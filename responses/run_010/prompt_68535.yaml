prompt: |-
  I'm three years into a novel whose whole spine is a priority race: two people, in seperate countries, who land on the same result within about eighteen months of each other and don't know it. To get the texture right I've been reading around the real cases — Darwin and Wallace obviously, Newton and Leibniz over the calculus, Bell and Gray at the patent office, Scheele and Priestley and Lavoisier over oxygen, Lobachevsky and Bolyai, Whittle and von Ohain over the jet engine — and what's struck me is that they aren't all the same shape. In some of them the second arrival genuinely seems to have been robbed of something that mattered; in others the result looks so over-determined by where the field already was that whose name ended up on it is close to a coin flip, and the whole priority business is a social artifact rather than a real loss. I also keep running into the distinction between a "multiple" and a "singleton," and I suspect some of the famous multiples are contaminated — people who were in correspondence, or who'd seen each other's stuff — which makes the clean cases rarer than the list suggests.

  So: sort the well-documented cases into tiers by how much the individual actually mattered. Concretely — how different would the field's trajectory plausibly have been if the eventual winner had never been born and only the runner-up had lived, keeping everything else fixed? I don't want a survey of the cases and I definitely don't want a bibliography or a reading list; I want an ordering and a defense of it. Tell me which criteria you're weighting, because I can see at least three pulling in different directions: how far along the field already was (were the tools and the background results sitting there waiting to be picked up?); how much the particular formulation mattered downstream (did the version that won carry something the other lacked — a notation, a mechanism, a framing, a published date, a proof technique that others could actually use?); and how much the winner did with it afterwards (defending it, answering objections, gathering students, building the school that made it canonical). Say which of those you lean on heaviest and why, and be explicit about the cases you're demoting or promoting on grounds a reader would find counterintuitive. Then flag the one or two where you think the standard telling is most badly wrong — where the popular version ("so-and-so was clearly robbed" or "it was clearly inevitable") doesn't survive the actual details — because those are the shapes I most want to steal for the book. And if you think the whole frame is unstable because the answer depends on the time horizon, say that and show me how the tiers reshuffle when I ask about five years out versus fifty.

  One more wrinkle, which may or may not matter to you: my two characters aren't scientists. They're a retired surveyor and a woman who runs a dry-goods shop, both working out of the same regional library system, and what they've found is closer to an amateur taxonomy than a theory — it's completely useless, but it's beautiful, and neither of them has any institutional standing to defend it with. Does that change your ranking at all? Do the cases where the discovery had no practical consequences and no career attached behave differently from the ones where it launched an industry or a discipline, and if so, which way does that push my two hobbyists?
reasoning: |-
  Okay, the user is writing a novel centered on a priority race between two isolated individuals who independently arrive at the same discovery. They've researched historical cases of simultaneous discoveries but noticed these aren't uniform—some feel like genuine losses for the runner-up, while others seem inevitable. They want me to sort well-documented cases into tiers based on how much the individual mattered to the field's trajectory if the winner hadn't existed. 

  Hmm, the user is clearly deep into their research—they mention specific cases like Darwin/Wallace and Newton/Leibniz, and they're grappling with concepts like "multiples" vs. "singletons." Their frustration with contaminated cases (where correspondence might have influenced outcomes) suggests they need clean examples for their novel's authenticity. 

  The core ask is tripartite: 
  First, tier the cases by "individual impact" under a counterfactual where only the runner-up exists. 
  Second, explain which criteria I'm prioritizing among (field readiness, formulation differences, or post-discovery efforts) and why. 
  Third, highlight cases where popular narratives are misleading—exactly the "shapes" they want to steal for their book. 

  Ah, and there's a subtle wrinkle: their characters are hobbyists (a surveyor and a shopkeeper) creating "useless but beautiful" taxonomy. That nudges me to consider cases where discoveries lacked practical stakes or institutional backing. Does that alter the rankings? Probably—career-driven cases might amplify post-discovery efforts, while amateur contexts could isolate raw insight. 

  I'll lean hardest on formulation differences. Why? Because field readiness determines inevitability, but formulation shapes how ideas propagate. If the runner-up's version was functionally equivalent or superior, their solo impact could match history's joint outcome. Post-discovery efforts matter less for the user's counterfactual since we're removing the winner, not the runner-up's agency. 

  For tiers: 
  - Tier 1 (minimal impact gap): Cases where the runner-up had comparable depth/tools and their formulation was equally fertile (e.g., oxygen discovery—Priestley/Scheele could've anchored the chemical revolution if Lavoisier vanished). 
  - Tier 2 (moderate gap): The runner-up had the core insight but lacked key packaging or proof (e.g., Bolyai's non-Euclidean geometry was brilliant but Lobachevsky's systematic presentation gave it legs). 
  - Tier 3 (large gap): Winners added unique, irreplaceable value (e.g., Darwin's synthesis of evolution was broader than Wallace's sketch; Newton's calculus notation was adoptable where Leibniz's symbols weren't initially). 

  Biggest narrative twists: 
  - Lavoisier is overrated as a "sole discoverer"; Priestley/Scheele had oxygen first, but Lavoisier's theory and branding eclipsed them. If he never existed, chemistry might have progressed similarly via Scheele's letters or Priestley's persistence. 
  - Conversely, Darwin isn't just about priority—his Origin of Species framework (Malthusian struggle, variation) was richer than Wallace's paper. Without Darwin, evolution might have remained a niche idea. 

  For amateur contexts: Cases with low institutional stakes (like geometry or taxonomy) favor Tier 1/2 rankings because post-discovery clout matters less. Your hobbyists might mirror Bolyai—beautiful insights that languish without packaging—or Scheele, whose work was profound but fragmented by isolation. 

  Time horizon reshuffles tiers: Short-term, formulation and publicity dominate (Bell's patent beat Gray's superior design). Long-term, field readiness wins out (jet engines would have emerged via Whittle or others). Your characters' taxonomy, being "useless," might only matter long-term if it inspires future systems—so its survival hinges on luck or beauty, not utility. 

  Final thought: The most theft-worthy "shape" is Bolyai—a genius whose work was buried by circumstance, not inadequacy. That tragic, quiet near-miss feels perfect for your library-bound dry-goods shopkeeper.
answer: |-
  Here's a tiered analysis of well-documented priority races, sorted by the counterfactual impact of removing the "winner" and leaving only the runner-up, with explicit criteria weighting and narrative corrections. I lean **heaviest on formulation differences** (notation, framing, proof technique, publishable completeness) as the decisive factor. Why? Field readiness determines *if* the discovery happens, but formulation determines *how effectively it enters and reshapes the discourse*. Post-discovery efforts matter, but they often depend on institutional standing (less relevant to your hobbyists) and are amplified by the formulation's inherent utility.

  **Criteria Weighting:**
  1.  **Formulation Differences (40%):** Did the runner-up possess a version robust, clear, and "fertile" enough for others to build upon? If their work was fragmentary, poorly communicated, or lacked key conceptual/technical elements, removing the winner creates a larger gap.
  2.  **Field Readiness (35%):** How "overdetermined" was the discovery? Were tools, data, and conceptual precursors readily available? High readiness minimizes the individual's irreplaceability.
  3.  **Post-Discovery Efforts (25%):** Could the runner-up *alone* have defended, promoted, and integrated the discovery? This depends on their personality, resources, and standing. Where formulation is strong, this matters less long-term.

  **The Tiers:**

  1.  **Tier 1: Minimal Impact Gap (Runner-up's formulation was functionally equivalent or superior; field was ripe)**
      *   **Oxygen Discovery (Scheele & Priestley):** *Counterfactual (Lavoisier removed):* Minimal disruption. Scheele (first discoverer) and Priestley (most prolific experimenter/publicist) had the core phenomenon isolated. Lavoisier's genius was the *interpretation* (dephlogistication, role in combustion/respiration) and systematic theory. If Lavoisier vanished, Scheele's meticulous work (known via letters/circulation) or Priestley's persistent experimentation likely leads someone else (e.g., Berthollet) to the correct chemical revolution framework within a few years. *Why Tier 1?* High field readiness (pneumatic chemistry boom), runner-ups had robust experimental formulations. Lavoisier's *theorizing* was the unique leap, but the *discovery* itself was separable and well-advanced by others.
      *   **Non-Euclidean Geometry (Bolyai & Lobachevsky):** *Counterfactual (Lobachevsky removed):* Minimal disruption long-term. Bolyai's appendix (1832?) was profound, complete, and independent. Gauss knew both but didn't publish. If only Bolyai existed, his work might have languished longer due to obscurity, but the mathematical community (Riemann, Beltrami) was converging on these ideas. By the 1860s-70s, the development would likely be similar, perhaps attributed earlier to Bolyai if published effectively. *Why Tier 1?* High field readiness (centuries of wrestling with the parallel postulate), Bolyai's formulation was mathematically sound and complete. Post-discovery obscurity was a historical accident, not a flaw in the formulation.

  2.  **Tier 2: Moderate Impact Gap (Runner-up had the core insight but lacked critical packaging/fertility; field was ready)**
      *   **Natural Selection (Wallace & Darwin):** *Counterfactual (Darwin removed):* Significant *short-term* disruption, reduced *long-term* gap. Wallace's 1858 Ternate paper contained the core mechanism. However, Darwin's 20+ years of notebooks, vast correspondence, detailed examples (pigeons, biogeography), and *Origin of Species* (1859) provided an overwhelming synthesis, framework, and mountain of evidence Wallace's paper lacked. Without Darwin, Wallace alone would struggle to convince the scientific establishment quickly. Acceptance would be slower, messier, and likely require others (Hooker, Huxley) to build a similar synthetic work *based on Wallace's insight*. By 1900, evolution by natural selection is still established, but the path is rockier and the canonical text isn't Wallace's paper. *Why Tier 2?* Field readiness was high (transmutation ideas everywhere), but Darwin's *formulation* (scope, evidence, argument structure) was vastly more effective. Wallace had the spark; Darwin built the engine.
      *   **Jet Engine (Whittle & von Ohain):** *Counterfactual (von Ohain removed):* Minor delay. Whittle patented first (1930) and persisted despite UK disinterest. Von Ohain, working later with Heinkel's resources, flew first (1939). The fundamental principles (gas turbine for propulsion) were in the air (pun intended). If von Ohain never existed, Whittle's work (or similar efforts in other countries like Campini) would still have led to operational jets within a few years. *Counterfactual (Whittle removed):* More significant delay. Without Whittle's early patent/persistence, von Ohain's path might have been smoother/faster, but the underlying tech (aero engines, turbines) was advancing rapidly. Jets arrive by the late 1940s regardless. *Why Tier 2?* High field readiness (turbine tech, high-speed aerodynamics), both had functional formulations. Whittle gets the edge for sheer chronological priority and doggedness against institutional inertia, but the core concept was "in the water."

  3.  **Tier 3: Large Impact Gap (Winner added unique, essential value; runner-up formulation was incomplete/less fertile; field readiness varied)**
      *   **Calculus (Newton & Leibniz):** *Counterfactual (Leibniz removed):* Minor disruption. Newton's method of fluxions (1660s) was powerful but cryptic, unpublished, and used obscure notation. Leibniz (publishing 1684) developed superior notation (dx, ∫) and clear rules, making calculus *usable* and *teachable*. If Leibniz vanished, Newton's unpublished work might eventually emerge, but its adoption would be crippled by the poor notation/lack of systematic publication. Progress in mathematical physics is significantly delayed. Someone else (Bernoulli?) might invent Leibnizian notation independently, but it's not guaranteed quickly. *Counterfactual (Newton removed):* Major disruption. Leibniz's calculus was brilliant, but Newton's unparalleled physical intuition and application of calculus to celestial mechanics (*Principia*, 1687) demonstrated its revolutionary power. Without Newton, Leibniz's calculus is a powerful new math tool, but its *transformative application* to understanding the universe is delayed by decades. *Why Tier 3?* **Formulation differences are paramount here.** Leibniz's notation was essential for diffusion. Newton's application was essential for demonstrating true power. Field readiness was moderate (Fermat, Barrow precursors). Neither runner-up alone provides the full package the other half delivered historically.
      *   **Telephone (Bell & Gray):** *Counterfactual (Bell removed):* Minor impact gap. Gray filed a caveat for a liquid transmitter hours after Bell's patent. Bell's patent was broader (covered variable resistance principle) and crucially, he *demonstrated* a working electromagnetic transmitter/receiver system. Gray had designs but no demonstrable *working* telephone system at the time. If Bell vanished, Gray (or Edison, Berliner, others) would likely have produced a functional system very soon based on the intense activity in the field. *Why Tier 3?* Extremely high field readiness (telegraphy, electrical experimentation). Bell's key advantage was the *demonstrable working system* included in his patent application – a critical piece of formulation as *proof of concept*. Gray's caveat lacked this.

  **Cases Demoted/Promoted & Narrative Corrections:**
  *   **Lavoisier Most Overrated:** Popular narrative paints him as *the* discoverer of oxygen. **Reality:** He was the third discoverer! Scheele isolated it first (1771-72), Priestley isolated and published it independently (1774). Lavoisier's genius was theoretical interpretation and systematization. Without him, the chemical revolution still happens, likely led by Scheele/Priestley's work, just messier.
  *   **Wallace Most Underrated in Impact Narrative:** Often seen as merely prompting Darwin. **Reality:** Wallace independently conceived the core mechanism. The gap without Darwin is less about the *idea* and more about the *packaging and evidence*. Darwin doesn't "steal" it, but his formulation was orders of magnitude more effective.
  *   **Bolyai/Lobachevsky:** Often presented as tragic simultaneous obscurity. **Reality:** Both formulations were robust. The "loss" was purely social/historical (Gauss's silence, poor dissemination). The mathematics itself was sound and inevitable. Removing one changes little long-term.

  **Impact of Your Characters' Context (Amateur, Useless, Beautiful Taxonomy):**
  *   **Changes the Ranking:** This context **elevates cases where institutional standing/post-discovery clout mattered less** and **demotes cases where practical application drove adoption**. Tier 1 (Oxygen, Non-Euclidean) becomes even more relevant.
  *   **How it Behaves:**
      *   **Field Readiness:** Matters less if the discovery is truly novel taxonomy – it might *create* its own field rather than exploit an existing one. Counterfactual impact could be huge if the runner-up also lacks standing/drive to publish effectively.
      *   **Formulation:** **Crucially important.** Is the taxonomy logically coherent? Beautifully presented? Does its structure suggest deeper patterns? A beautiful, useless system needs exceptional formulation to capture attention and survive without practical utility or institutional backing. Scheele's meticulous notes or Bolyai's elegant math are better analogues than Bell's patent hustle.
      *   **Post-Discovery:** **Massively diminished.** No students, no school, no career to build. Survival depends on the formulation's intrinsic beauty/logic capturing *someone's* interest, or sheer luck (finding the right reader). Priestley's relentless self-promotion is irrelevant here.
  *   **Pushes Your Hobbyists:** Towards the **Bolyai/Lobachevsky model**. Their potential tragedy isn't being "robbed" in a coin flip, but that *both* beautiful systems could languish in obscurity due to lack of standing/dissemination, regardless of priority. The "loss" isn't to the other person, but to the world. The counterfactual where only one exists might only change *which* obscure manuscript gathers dust. Success hinges entirely on the **sheer persuasive power and beauty of the formulation itself** finding an unlikely champion.

  **Time Horizon Reshuffling:**
  *   **Short-Term (5 years):** Formulation and Post-Discovery efforts dominate. The Bell/Gray patent race outcome matters hugely commercially. Darwin's *Origin* crushes Wallace's paper in immediate impact. Lavoisier's Academy position lets him dominate the narrative.
  *   **Long-Term (50 years):** Field Readiness and the inherent fertility/robustness of the formulation dominate. Non-Euclidean geometry flourishes regardless of whether Bolyai or Lobachevsky was first *published*. Natural selection becomes foundational biology, even if Wallace had been the sole published source (though the path is bumpier). Oxygen's role is understood. Calculus notation standardizes. Only truly unique, irreplaceable syntheses like Newton's *Principia* retain a massive individual gap long-term.

  **Steal These Shapes:**
  1.  **The Bolyai Scenario:** A masterpiece of logic and beauty, completed independently and arguably first, languishes in obscurity due to bad luck, isolation, and lack of institutional muscle. The "winner" publishes a similarly robust version slightly later but benefits from slightly better connections/location. The tragedy is double: both deserved recognition, but only one got it, and the world almost missed both. **Perfect for your dry-goods shopkeeper's meticulously illustrated, logically perfect taxonomy sitting unread.**
  2.  **The Scheele Scenario:** The true first discoverer, working in isolation, documents the discovery meticulously but publishes slowly/fragmentarily (letters, local journals). Others (Priestley, Lavoisier) get the credit through faster publication or better theorizing. The runner-up isn't just second, they were *first but unseen*. **Perfect for your retired surveyor, methodically recording patterns in specimen sketches sent to a regional journal that nobody reads, while the shopkeeper independently stumbles upon the same system later but publishes a clearer summary first.**

  The instability lies here: for discoveries that become foundational, the individual matters intensely in the moment (for credit, career) and in the short-term trajectory, but fades against the tide of inevitability and the inherent power of the idea itself over generations. Your characters' beautiful, useless taxonomy sits at the extreme end – its survival depends almost entirely on the power of the formulation to transcend its humble origins, making the priority race itself poignant but ultimately secondary to the question of whether *anyone* will ever see its beauty.
