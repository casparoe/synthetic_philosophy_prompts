  We are drafting a joint statement for two scholars: a medievalist (ethnosymbolist leaning) and a modernist (following Gellner, Anderson, Hobsbawm). The goal is to have a document they can both sign, which includes agreed claims and a clear presentation of disagreements, especially on the Swiss Confederation case.

  Structure:
  (a) Numbered agreed claims (both can sign)
  (b) Table of disagreements in markdown format with columns: 
      Topic | Wording Modernist Would Sign | Wording Medievalist Would Sign | Genuine or Verbal | Why
  (c) JSON array of cruxes (3 to 5) with fields: 
      crux_id, question, whose_position_it_threatens, test, modernist_prediction, medievalist_prediction, concession_trigger, verbal_component

  Agreed Claims (Numbered):

  1. **Evidence for Nationhood**: The existence of a nation at a given time must be inferred from evidence of collective self-identification and political community. Such evidence includes but is not limited to: shared narratives of origin and destiny, symbols and rituals expressing commonality, institutional frameworks that foster cohesion, and explicit assertions of collective identity in contemporary sources.

  2. **Dynasty, Kingdom, Ethnie, Nation**: 
     - A dynasty is a sequence of rulers from the same family.
     - A kingdom is a political unit ruled by a monarch, which may or may not encompass a single people.
     - An ethnie (after Smith) is a named human population with shared ancestry myths, historical memories, and cultural elements, but without the necessity of political unity or mass public participation.
     - A nation is a political community that claims sovereignty (or self-governance) and is characterized by a high degree of collective self-identification among a significant portion of its members, often (but not necessarily) tied to a territory.

  3. **The Invented-Tradition Thesis (Hobsbawm)**: 
     - This thesis claims that many traditions presented as ancient are, in fact, recent innovations. It does not deny that some traditions have deep roots, but rather highlights the processes by which traditions are constructed and institutionalized, particularly in the context of modern state-building and nationalism. 
     - It is not a claim that all traditions are invented wholesale, nor that the materials used in invention are arbitrary; they often draw on existing cultural resources.

  4. **Print Capitalism (Anderson)**: 
     - Print capitalism is a powerful force in the creation of national consciousness by standardizing vernaculars and enabling the wide dissemination of shared narratives and information. 
     - However, print capitalism alone is insufficient to create a nation; it must operate within a conducive socio-political context. Other factors, such as state institutions, economic changes, and pre-existing cultural ties, are also necessary.

  5. **Swiss Confederation Pre-Revolution**: 
     - The Swiss Confederation prior to the French Revolution presents a complex case for both positions. 
     - The foundational narratives (e.g., the Rütlischwur/Oath of Rütli and the Tell legend) are documented in written form substantially after the events they describe, and their historical accuracy is contested. 
     - At the same time, the Confederation exhibited features of political community (shared legal agreements, joint defense pacts, and periodic diets) and cultural cohesion (common symbols like the cross, and shared legal culture in written form) that predate the modern era and the advent of print capitalism in the region.

  Disagreements Table:

  | Topic | Wording Modernist Would Sign | Wording Medievalist Would Sign | Genuine or Verbal | Why |
  |-------|-----------------------------|-------------------------------|-------------------|-----|
  | Chronology of English Nationhood | The English nation, as a mass political community with a widely shared identity, emerged no earlier than the late 16th century, facilitated by print, the Reformation, and state centralization. | The English nation, as a political community with a distinct identity and a sense of common destiny, existed by the late 9th century under Alfred and was reinforced through subsequent institutional and cultural developments. | Genuine | The disagreement is about when the necessary conditions for nationhood (especially mass identification and political community) were met. The modernist points to the scale and depth of integration required, while the medievalist argues for an earlier emergence based on evidence of shared identity and political cohesion. |
  | Role of Print Capitalism | Print capitalism is a near-necessary condition for the formation of nations because it enables the standardization of language and the dissemination of a shared culture to a mass audience. | Print capitalism is an accelerator and amplifier of national consciousness but is not a necessary condition, as nations can form through other means of cultural transmission (e.g., oral traditions, manuscript culture, religious institutions). | Genuine | The modernist emphasizes the role of print in creating the mass public, while the medievalist points to pre-print mechanisms of cultural integration. |
  | Swiss Confederation as a Nation | The Swiss Confederation before the late 18th century was a league of autonomous valleys and cities bound by treaties and common interests, but it lacked the characteristics of a nation until the Helvetic Republic and subsequent developments fostered a unified Swiss identity. | The Swiss Confederation, from at least the 14th century, exhibited the core features of a nation: a shared political identity (expressed in the diets and defense pacts), symbolic representations (the white cross), and a legal culture that fostered a sense of commonality despite linguistic diversity. | Genuine | The dispute centers on whether pre-modern political and cultural forms constitute nationhood. The modernist requires mass participation and a unified public sphere, while the medievalist sees the confederation's institutions and shared myths as sufficient. |
  | Nature of National Identity | National identity is fundamentally modern because it requires a type of mass consciousness and public sphere that did not exist before the modern era. | National identity has pre-modern roots and can be found in historical communities that possessed a collective self-awareness and political agency, even without modern mass media. | Both Genuine and Verbal | Partly verbal: if "mass consciousness" is defined as requiring near-universal literacy and mass media, then the modernist has a point. But the medievalist argues that the concept of "mass" must be scaled to the era and that pre-modern communities had their own forms of public participation. |
  | Invented Traditions in Medieval Contexts | The invented-tradition thesis applies to the medieval period only in the sense that all traditions are constructed, but the scale and intent of such construction are qualitatively different in the modern era, driven by state elites to engineer mass loyalty. | The invention of tradition is a universal human phenomenon, and medieval rulers and communities actively constructed traditions to legitimize rule and foster group cohesion, often in ways directly comparable to modern practices. | Genuine | The modernist sees modern inventions as more systematic and state-driven, while the medievalist argues that the process is similar across eras. |

  Cruxes (JSON Array):

  We need 3 to 5 cruxes. They should be on the Swiss case and other key points. Each crux must have:
  - crux_id (slug)
  - question (both accept as the live question)
  - whose_position_it_threatens
  - test (concrete evidence to look at)
  - modernist_prediction
  - medievalist_prediction
  - concession_trigger (what result would force concession)
  - verbal_component (if any)

  Cruxes:

  1. **Swiss Founding Myths**: 
     - Question: To what extent did the founding myths (Rütlischwur, Tell) function as unifying national symbols in the Swiss Confederation before 1500?
     - Threatens: Both (if the myths were widely known and used for unity before print, it helps medievalist; if only after print, modernist)
     - Test: Examination of all extant Swiss chronicles, legal documents, and artistic representations from 1300-1500 for references to these myths and their context (e.g., are they used in political discourse?).
     - Modernist Prediction: No or very few references before the 15th century, and widespread use only after the advent of printing in the region (late 15th century).
     - Medievalist Prediction: Multiple references in the 14th and early 15th centuries, showing integration into the confederation's political identity.
     - Concession Trigger: If no references are found before 1470 (when printing arrives), medievalist concedes the myths were not functional until modern times. If clear pre-1450 references in political contexts, modernist concedes that pre-print transmission could sustain national myths.
     - Verbal Component: None.

  2. **English Vernacular Manuscript Circulation**: 
     - Question: How widespread was the circulation of key vernacular manuscripts (e.g., Alfredian translations, Anglo-Saxon Chronicle) in late Anglo-Saxon England, and what does this imply about collective identity?
     - Threatens: Medievalist (if circulation was very limited, it weakens the case for mass identity; if extensive, strengthens it)
     - Test: Paleographic and codicological study of surviving manuscripts and fragments, including analysis of provenance, scriptoria, and annotations to estimate numbers of copies and their geographical spread.
     - Modernist Prediction: Few copies, confined to ecclesiastical and elite circles, with no evidence of broad dissemination.
     - Medievalist Prediction: Significant number of copies, distributed across multiple centers, indicating broader circulation and use.
     - Concession Trigger: If fewer than 10 substantial vernacular manuscripts from the period are found, medievalist concedes limited reach. If more than 30, modernist concedes that pre-print dissemination could be effective for elite cohesion (but not mass).
     - Verbal Component: The definition of "mass" (medievalist: elite and clerical circles as the relevant public; modernist: must include commoners).

  3. **Swiss Cross Symbol**: 
     - Question: When did the white cross on a red background become a common symbol for the Swiss Confederation, and how was it used?
     - Threatens: Both (early common use supports medievalist; late and sporadic supports modernist)
     - Test: Survey of all extant flags, seals, chronicle illustrations, and other artifacts from 1300-1600 that depict Swiss forces or representatives, noting the presence/absence of the cross and the context of use.
     - Modernist Prediction: The cross appears inconsistently before the 16th century and becomes standardized only after the Burgundian Wars (1470s) and widespread with printing.
     - Medievalist Prediction: The cross is consistently used as a field sign and emblem from the early 14th century onward.
     - Concession Trigger: If no clear evidence of the cross as a confederal symbol (as opposed to cantonal) before 1450, medievalist concedes. If multiple examples from before 1400, modernist concedes early symbolic unity.
     - Verbal Component: None.

  4. **Anglo-Saxon Collective Identity**: 
     - Question: Did the term 'Angelcynn' (or equivalent) in Alfred's time denote a political community encompassing the entire English population, or was it limited to a warrior elite?
     - Threatens: Medievalist (if it was elite-only, it weakens the nation claim)
     - Test: Linguistic analysis of all occurrences of 'Angelcynn' and related terms in Alfredian texts and charters, examining context and audience.
     - Modernist Prediction: The term is used primarily in contexts addressing the elite (e.g., royal proclamations, chronicles) and does not imply inclusion of peasants or commoners.
     - Medievalist Prediction: The term is used inclusively, often in contexts that address the defense and well-being of the entire people.
     - Concession Trigger: If the term is never used in conjunction with appeals to a broad population (e.g., in laws or homilies), medievalist concedes limited scope. If it appears in texts aimed at a wide audience (e.g., homilies) or in contexts that assume a collective responsibility, modernist concedes that the concept of a political community existed.
     - Verbal Component: The meaning of "political community" (medievalist: includes hierarchical societies with elite leadership; modernist: requires broader participation).

  We have four cruxes. We can stop at four.

  Now, we output the document.

  Note: The joint statement must be in the voice of the two scholars, so the agreed claims are written as their shared position, and the table and cruxes are presented as the structure of their disagreement.
