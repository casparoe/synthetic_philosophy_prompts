  ### Joint Statement on the Chronology and Ontology of Nations  
  *Signed by [Medievalist] and [Modernist], August 2024*  

  #### (a) Agreed Claims  
  1. **Evidence for Nationhood**: A nation’s existence at time *T* requires evidence of:  
     - A named political community asserting sovereignty or autonomy.  
     - Collective self-identification (not merely elite consciousness) documented in sources contemporary to *T*.  
     - Shared symbolic practices (e.g., rituals, myths) or institutions binding members beyond kinship or locality.  
     *Absence of these elements precludes nationhood, irrespective of territorial or cultural continuity.*  

  2. **Key Distinctions**:  
     - A **dynasty** is a ruling lineage; a **kingdom** is a polity under monarchic rule; neither necessitates collective identification.  
     - An **ethnie** (after A. D. Smith) denotes a group with shared myths, memories, and cultural markers, but lacks a political project for self-rule.  
     - A **nation** is a *sovereignty-claiming political community* whose members identify with it as a primary locus of loyalty.  

  3. **Invented-Tradition Thesis (Hobsbawm)**:  
     - Traditions are "invented" when their novelty is obscured to imply continuity. This does *not* assert:  
       - All traditions are fabrications (many repurpose existing cultural materials).  
       - Invention is exclusive to modernity (premodern cases exist but are less systematic).  
     - It *does* claim modern states uniquely exploit traditions to engineer mass loyalty via centralized institutions.  

  4. **Print Capitalism (Anderson)**:  
     - Print standardizes vernaculars and enables mass dissemination of shared narratives.  
     - However, print alone cannot generate nations; it requires:  
       - Pre-existing linguistic/cultural raw material.  
       - Political or economic catalysts (e.g., state-building, capitalism).  
     - Manuscript networks may sustain communal identity but lack print’s scale and homogenizing effects.  

  5. **Swiss Confederation (Pre-1798)**:  
     - The premodern Confederation exhibited:  
       - A shared political identity (e.g., *Eidgenossenschaft* oaths, diets, defense pacts).  
       - Symbolic cohesion (e.g., the white cross, William Tell legends).  
     - However:  
       - Foundational narratives (Rütlischwur, Tell) were textualized >100 years post-event.  
       - No standardized print language existed (German, French, Italian dialects coexisted).  
     - *This case challenges both positions and requires granular analysis.*  

  ---

  #### (b) Disagreements  
  | Topic | Wording Modernist Signs | Wording Medievalist Signs | Genuine/Verbal | Why |  
  |-------|-------------------------|---------------------------|----------------|-----|  
  | **English Nationhood** | "Mass English nationhood emerged post-1600, contingent on print, state bureaucracy, and capitalist markets enabling nationwide integration." | "English nationhood crystallized under Alfred (late 9th C.) via vernacular texts, shire systems, and anti-Danish mobilization, evolving continuously thereafter." | Genuine | Disagreement hinges on whether premodern institutions achieved *mass* integration (Modernist: no; Medievalist: yes, relative to era). |  
  | **Necessity of Print** | "Print capitalism is necessary for mass national consciousness, as manuscript culture cannot sustain uniform identity across large populations." | "Manuscripts, oral traditions, and religious networks can foster national consciousness without print, as in Alfred’s Wessex or medieval Iceland." | Genuine | Empirical: whether pre-print evidence shows *system-wide* (not local) identification. |  
  | **Swiss Case** | "The Swiss Confederation pre-1798 was a defensive league of distinct valleys/cities; national identity emerged only post-1798 via state centralization and print." | "The premodern Confederation was a de facto nation, with shared legal culture (e.g., *Bundesbriefe*), symbols, and chronicles binding elites *and* free peasants." | Genuine | Turns on whether confederal structures generated *cross-valley* mass identity. |  
  | **Invented Traditions** | "Premodern ‘inventions’ (e.g., Arthurian legends) served elite legitimation; modern inventions uniquely target masses via schools/media to create citizens." | "Premodern rulers/communities actively constructed traditions (e.g., Alfred’s *Anglo-Saxon Chronicle*) to mobilize collective identity, akin to modern states." | Both | Verbal: "Mass" vs. "elite" scope; Genuine: whether premodern mobilization parallels modern *scale/intent*. |  
  | **National Ontology** | "Nations require impersonal, territorially bounded membership accessible to diverse ethnicities, impossible pre-centralization." | "Nations can be ethnoculturally exclusive and dynastically led if they evoke collective political agency (e.g., ‘*Angelcynn*’ under Alfred)." | Verbal | Dissolved by defining "nation" as *"mass-identified, sovereignty-claiming political community"*. Residual disagreement: what constitutes "mass" in premodernity. |  

  ---

