answer: |-
  ### Core Requirements for Aggregation Operators in Moral Consequentialism

  **Purpose:** Define formal properties for a rule that aggregates individual harms into a societal verdict, isolated from broader moral commitments. The rule must compare any two distributions of harm across populations.

  **Non-Negotiable Requirements** (Fail any = Invalid Rule):
  1.  **Completeness:** Must declare one distribution better than the other, or equal, for *any* two conceivable harm distributions. *Why:* The operator must always yield a verdict. *Case:* "No verdict" in slightly messy cases (e.g., harm sizes vary unpredictably) fails this.
  2.  **Transitivity:** If A > B and B > C, then A > C. *Why:* Prevents cyclical preferences and ensures consistent ordering. *Case:* Essential for coherent choice between multiple options.
  3.  **Weak Pareto:** If every individual suffers strictly less harm in A than in B, then A is better than B. *Why:* Captures core intuition that reducing harm is good. *Case:* If *no one* is worse off and *someone* is better off (e.g., slightly smaller speck for one person), A must be better. *(Note: "Weak" avoids controversial stronger versions).*
  4.  **Scale Invariance:** Verdicts must not change if all harms are multiplied by a constant factor (e.g., measuring in "utils" vs. "milliutils"). *Why:* The *relative* badness of outcomes should depend only on the *relative* harms individuals experience, not arbitrary measurement units. *Case:* Rescaling harms shouldn't flip the torture-vs-specks verdict.
  5.  **Anonymity:** The identity of individuals doesn't matter, only the pattern/sizes of harms. *Why:* Captures impartiality; swapping who gets which harm shouldn't change the verdict. *Case:* Swapping a speck victim with a torture victim doesn't make the torture scenario acceptable.

  **Contested "Requirements" (Often Disguised Preferences):**
  1.  **Strong Aggregation (Full Continuity/Archimedean Property):** Any tiny harm reduction to a large enough population outweighs any finite harm to one person. *Why:* Often presented as a "logical" consequence of transitivity and Pareto when walking along a spectrum. *Case:* Torture vs. specks intuitively challenges this. *Reality:* This *assumes* the answer; rejecting it doesn't violate non-negotiables. Rules violating this (e.g., lexical thresholds) are candidates.
  2.  **Pairwise Comparison Sufficiency:** Verdicts can be determined solely by comparing the two options pairwise for each individual ("A is better for X, worse for Y, same for Z"). *Why:* Seems intuitive but fails dramatically with aggregation. *Case:* Torture vs. specks – torture is vastly worse for one, specks are trivially worse for each of many. Pairwise alone offers no verdict. *Reality:* This is a preference for non-aggregative methods, incompatible with *any* rule designed to solve the aggregation puzzle.
  3.  **Strong Separability:** The value of a harm to an individual depends *only* on their own state, not others'. *Why:* Simplifies calculation; common in utilitarianism. *Case:* Seems plausible. *Reality:* Violated if prior advantage/disadvantage matters (e.g., a speck harms a privileged person less than a starving person). Insisting on it *assumes* prior advantage shouldn't affect harm valuation.
  4.  **Precise Cardinality Required:** The rule requires knowing exact harm magnitudes and population sizes. *Why:* Simplifies mathematical aggregation. *Case:* Uncertainty about whether it's 10^15 or 10^16 specks. *Reality:* This is a limitation of specific implementations (e.g., classical utilitarianism), not a core requirement. Rules can handle ranges or distributions (e.g., "if harm per person is less than H and population > N, then specks are better").
  5.  **Single Harm Instance Idealization:** The rule inherently assumes harms are one-off and identical. *Why:* Makes the torture-vs-specks case stark. *Case:* Repeated specks for one person vs. single specks for many. *Reality:* This idealization hides complexity. A robust rule must handle repeated harms over time for individuals (temporal aggregation).

  **Tensions and Joint Unsatisfiability**

  The most significant tension arises between **Strong Aggregation** and **Weak Pareto** when combined with **Scale Invariance** and the need to handle **prior advantage/disadvantage** and **messy variation**.

  *   **The Conflict:** Weak Pareto demands that reducing *any* harm is good, however small. Scale Invariance says the *relative* size matters. Strong Aggregation says enough tiny reductions outweigh a large harm. But what if:
      1.  The "tiny" harm reductions are distributed to those *already much worse off*? (Does reducing a speck matter as much to someone in agony?)
      2.  The harms vary slightly in size? (Is a 0.99x speck different enough from a 1.0x speck to break the spectrum?)
      3.  The harm is repeated *for the same person*? (Is one person getting 18,250 specks (50 years daily) comparable to 18,250 people getting one speck each?)

  *   **Concrete Tension Example (Using Case 1 & Case 4):**
      *   **Option A:** One person (already severely disadvantaged) suffers one mild dust speck *every day for 50 years* (18,250 specks total).
      *   **Option B:** 1 Million people (all currently privileged and happy) each suffer *one* mild dust speck *once*.

      *   **Tension Points:**
          *   **Prior Disadvantage (Violates Strong Separability):** Does the speck mean the same thing to the suffering person as to the privileged? If prior state matters, Option A might be vastly worse than the sum suggests.
          *   **Temporal Aggregation vs. Population Aggregation:** Is enduring 18,250 specks *as one person* equivalent to 18,250 people enduring one speck each? Strong Aggregation often assumes yes, but intuitions differ (A feels clearly worse).
          *   **Weak Pareto & Scale Invariance:** If we slightly reduce the speck size for *each* of the 1 million in B, Weak Pareto *demands* this new option (B-) is better than B. Strong Aggregation says if we do this enough times (reduce speck size slightly for enough people), B- could outweigh A. But does reducing a speck for a privileged person by 0.001% truly offset *any* part of the crushing burden of daily specks for the suffering person over decades? Scale Invariance says the *relative* harm reduction matters, but the *context* (prior state, repetition) might make the reduction less morally significant. Weak Pareto forces us to accept the reduction *is* better, pulling us towards Strong Aggregation. Yet accepting Strong Aggregation here feels deeply counterintuitive – B- seems negligibly different from B, while A remains horrific. This exposes the friction.

  **The Eliminator: Scale Invariance**

  **Scale Invariance** eliminates the most candidates. Rules that rely on absolute thresholds (e.g., "any harm above level L is lexically worse than any number of harms below L") violate it because rescaling harms can push harms above or below the threshold arbitrarily. Rules that depend on specific ratios (e.g., "the product of harm and population") often violate it unless carefully constructed (like classical utilitarianism, which *is* scale-invariant). It forces the rule to be fundamentally concerned with *relative* harms, making lexical thresholds and many non-utilitarian approaches incompatible.

  **How Contenders Fare (Briefly)**

  1.  **Classical Utilitarianism (Sum):** Satisfies Non-Negotiables 1-5. Embraces Strong Aggregation. Fails Case 1 (repeated specks feel worse than sum implies), struggles with Case 4 (ignores prior advantage), requires precise numbers (Case 3 issue).
  2.  **Prioritarianism (Weighted Sum favoring worse-off):** Satisfies Non-Negotiables 1-5 (if weights are scale-invariant). Rejects Strong Separability. Better on Case 4. Still embraces Strong Aggregation (enough tiny benefits to the *best*-off could outweigh large harm to worst-off!), still struggles with Case 1/3.
  3.  **Lexical Thresholds:** Violates Scale Invariance and Strong Aggregation. Satisfies Weak Pareto only weakly (reducing harm below threshold good, reducing above threshold doesn't help vs. below-threshold harms). Handles Case 1 intuitively. Struggles massively with Case 2 (messy variation near threshold) and Case 3 (uncertainty). Defining the threshold non-arbitrarily is the core challenge.
  4.  **Sufficientarianism:** Similar to Lexical but with a "sufficient" level. Shares its problems with Scale Invariance, messy variation, and uncertainty. May handle Case 4 better if sufficiency is relative.
  5.  **Intransitive Views:** Violate Transitivity (Non-Negotiable #2). Proposed to handle spectrum arguments but lead to incoherent choices. Not genuinely viable candidates.

  The central, likely irresolvable tension is between the relentless pressure of Weak Pareto + Scale Invariance leading towards Strong Aggregation and the deep intuition that some harms (like torture or relentless minor suffering) cannot be traded away by any number of sufficiently tiny benefits to others, especially when those others are better off or the harm is compounded over time.
