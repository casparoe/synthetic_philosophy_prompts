prompt: |-
  ok so I keep getting dragged into the same heritability argument and I want to move it up a level, because right now the exchange is always identical: one side waves a twin-study number, the other side recites the caveat list (population-relative, says nothing about individuals, fully compatible with total malleability), and both walk away thinking they won. Before I get back in it I want the spec written down.

  Setup: pretend we're designing a statistic from scratch. Call it G. For a given trait in a given population it's supposed to answer "how much do genetic differences matter here, in a form somebody could act on." The somebody is a school district or a clinic, not a philosopher. Write the desiderata for G — and for each one give the case or consideration that motivates it, not just a label.

  Things I already think are in play, add whatever I'm missing: G has to behave sensibly when environments get more uniform or more varied (nutrition and height is the stock example, and I want the requirement stated so it doesn't quietly smuggle in a direction of change); it has to have an answer for the much-argued result that heritability of cognitive-test scores differs by family socioeconomic status — note it isn't even settled which way it goes, so G needs to say what that whole genre of finding means for it either way; it has to survive genotype-enviroment correlation, both passive and evocative, plus assortative mating; it has to say what happens to its value when you carry it from the population it was estimated in to a different one; and it has to be honest about the gap between twin-study estimates and what polygenic scores actually predict out of sample.

  Then the part I care about most. Mark every requirement as either a genuine desideratum or a camp prejudice wearing a desideratum's clothes. Two I want adjudicated explicitly: is "G must be interpretable for one individual kid" a coherent demand at all, or a category error people keep sneaking onto the list? And can "G must license intervention claims" (change environment E, trait moves by X) be satisfied at the same time as "G must transport across populations"? My hunch is no, because variance components are indexed to the environment distribution of the population they came from — if you agree, the impossibility is the actual result and I want it stated cleanly rather than buried.

  Finish with which single requirement does the most work — the one that knocks out the most candidate statistics by itself — and then say what G ends up looking like if you keep that one and give up the rest. No bibliography and no reading list, I don't want citations, I want the requirements.
reasoning: |-
  Okay, the user is frustrated with repetitive arguments about heritability and wants to design a new statistic called G that could actually be useful for practical decision-makers like school districts or clinics. They want clear desiderata for G, with justifications, and then to distinguish which requirements are genuine versus biased. 

  Hmm, the user seems highly knowledgeable about the technical debates—they reference twin studies, polygenic scores, SES interactions, gene-environment correlations—but wants to cut through circular academic fights. Their tone suggests irritation with both "sides" oversimplifying. The core ask is pragmatic: what *should* a usable heritability-like metric do, stripped of ideology?

  First, unpacking their stated concerns: G must handle environmental variance shifts neutrally (e.g., better nutrition shouldn’t automatically raise/lower G), reconcile conflicting findings like IQ heritability varying with SES, resist G×E confounding (passive/evocative rGE, assortative mating), clarify transportability across populations, and admit the gap between twin studies and real-world polygenic score accuracy. 

  Then the critical filters: (1) Is demanding individual-level interpretability for G even coherent? (Probably not—heritability is inherently population-level.) (2) Can G simultaneously guide interventions *and* be portable? (Unlikely—intervention effects depend on local environments.) The user suspects these are incompatible; I agree. Their deeper goal seems to be formalizing why certain heritability claims are misleading.

  Key additions they might’ve missed: G should quantify *predictive utility* for real-world decisions (e.g., "If we equalize schools, does G drop?"), and distinguish between *observational* heritability vs. *causal* effects of environmental changes. Also, G must avoid reification—genetic influences aren’t fixed "potential."

  For the desiderata list:
  - **Population-relativity** is non-negotiable (motivated by gene-environment covariance). 
  - **Environmental invariance** must be neutral (nutrition example). 
  - **Handling rGE/assortative mating** is essential (adoption/twin study biases). 
  - **SES-interaction transparency** matters because conflicting findings expose context-dependence. 
  - **Transportability limits** prevent overgeneralization. 
  - **Prediction-reality alignment** addresses the twin-study vs. PGS gap. 

  Now, the contentious "requirements":
  - **Individual interpretability**: Category error. Heritability decomposes *group* variance; applying it to one kid is like using climate data to predict tomorrow’s weather. Genuine desiderata shouldn’t violate statistical principles.
  - **Intervention licensing + portability**: Fundamentally incompatible. Knowing that genes explain 60% of height variance in Sweden doesn’t tell you how much nutrition interventions will help in Malawi. The impossibility *is* the insight.

  The heaviest-hitting desideratum? **Population-relativity**. It alone sinks twin studies as "general truth" claims and forces context-specific estimates. If we keep only that, G becomes a *local variance ratio*—useless for grand claims but honest. ("In this school district, with current resources, genetic differences explain X% of reading score variance.")

  User’s hunch is sharp: the tension between intervention guidance and portability isn’t a flaw in G but a feature of reality. Nailing that feels like their win condition.
answer: |-
  Here's the specification for **G**, designed from first principles to be actionable for practical decision-makers (schools, clinics), with explicit motivations and adjudication of contested demands:

  ---

  ### **Core Desiderata for G (with Motivations)**
  1. **Population-Relativity**  
     *Motivation*: If G estimates genetic influence on height in a well-nourished population, it should *not* imply the same influence in a malnourished one (e.g., height heritability ↑ when nutrition variance ↓). G must embed its dependency on the current population’s environmental distribution.  
     *Type*: **Genuine** (empirically unavoidable; see Turkheimer’s First Law).

  2. **Environmental Variance Neutrality**  
     *Motivation*: When environmental variance changes (e.g., universal preschool access), G shouldn’t predictably increase or decrease—it should reflect the new context. If better nutrition reduces environmental variance in height, G may rise, fall, or stay stable, but the shift must be data-driven, not assumed.  
     *Type*: **Genuine** (prevents "fixed genetic potential" bias).

  3. **rGE/Assortative Mating Robustness**  
     *Motivation*: In passive rGE (e.g., smart parents pass genes *and* books), evocative rGE (e.g., genetic traits evoke teacher attention), or assortative mating (e.g., high-IQ parents pairing), G must not conflate genetic effects with environmental feedback loops.  
     *Type*: **Genuine** (else G becomes a circular measure of privilege).

  4. **SES-Interaction Transparency**  
     *Motivation*: Whether cognitive-test heritability rises *or* falls with family SES (both findings exist), G must quantify the dependency. If heritability is higher in high-SES homes (less environmental noise), G should reflect that *only* for that SES band, not the whole population.  
     *Type*: **Genuine** (context determines genetic expression).

  5. **Transportability Limits**  
     *Motivation*: If G=0.7 for trait T in Population A, it cannot be assumed valid for Population B with different environments. G must include a "transport range" (e.g., "only valid in populations with similar SES skew, schooling, etc.").  
     *Type*: **Genuine** (variance components are non-portable; see Lewontin’s rice plant analogy).

  6. **Prediction-Reality Alignment**  
     *Motivation*: If twin studies claim 80% heritability for education but polygenic scores (PGS) predict <10% of variance, G must reconcile this. Twin-based G must be ≥ PGS-based G, and the gap must quantify hidden G×E or model error.  
     *Type*: **Genuine** (empirical accountability).

  ---

  ### **Adjudicating Contested Demands**
  - **"G must be interpretable for one individual kid"**  
    **Verdict**: **Category error**.  
    *Why*: G decomposes *population* variance. Saying "genes explain 60% of ADHD variance" implies nothing about whether a *specific* child’s ADHD is genetic. Forcing individual interpretability invites essentialism (e.g., "my child’s ADHD is 60% genetic"). This demand confuses **etiology** (what caused this case?) with **variance** (what explains group differences?).  

  - **"G must license intervention claims (change E → ΔTrait)"**  
    **Verdict**: **Incompatible with transportability or SES-interaction transparency**.  
    *Why*: Interventions alter environmental variance and G×E dynamics. If G=0.8 for IQ in Population A, it *cannot* predict how much IQ changes if you improve schools in Population B. G describes the *status quo*, not counterfactuals. Demanding both intervention licensing and transportability is impossible—**G is observational, not causal**.

  ---

  ### **Which Desideratum Does the Most Work?**
  **Population-Relativity** eliminates the most candidate statistics:  
  - It invalidates broad claims like "IQ is 80% heritable" (ignoring environmental range).  
  - It forces G to be a *local* estimate, tied to a specific population and time.  
  - It implies G *must* be re-estimated when environments change, ending "one-size-fits-all" heritability.

  ---

  ### **What G Looks Like if Only Population-Relativity is Kept**
  A **Contextualized Variance Ratio**:  
  - **Formula**: G = V<sub>G</sub> / (V<sub>G</sub> + V<sub>E_local</sub> + V<sub>G×E_local</sub>)  
  - **Output**: "In [Population P] under [current environments E], genetic differences explain X% of trait variance."  
  - **Constraints**:  
    - No claims about individuals.  
    - No intervention predictions.  
    - No transportability beyond P’s environmental envelope.  
  - **Use Case**: A school district could estimate G for reading scores *in their district* to decide whether to invest in universal tutoring (if G is low, environments likely matter more) *but only if environments stay stable*.  

  ---

  ### **The Impossibility Theorem**
  **G cannot simultaneously**:  
  ① **License interventions** (predict ΔTrait from ΔEnvironment),  
  ② **Transport cleanly** across populations, *and*  
  ③ **Admit SES/interaction effects**.  
  Pick two at most. This is why heritability arguments repeat: opponents demand incompatible things from a single number. G’s value is in *diagnosing systems*, not prescribing solutions.
