answer: |-
  Below is a complete, detailed plan for your two-hour workshop on material constitution, designed to meet your objectives while avoiding common pitfalls. The structure forces participants to confront conflicting criteria of identity through hands-on gameplay with real stakes, culminating in a collective "aha" moment.

  ---

  ### **Materials List (for 24 people, 6 tables)**
  | **Item**               | **Quantity**        | **Notes** |
  |------------------------|---------------------|-----------|
  | Modelling clay         | 1.5 kg total        | Non-drying, 250g per table (6 colors, one per table). Reserve 200g extra for replacements. |
  | Kitchen scales         | 6                   | Precise to 1g. |
  | 50p coins              | 120                 | 20 coins per table starting bank. Bring extras. |
  | Coin tins              | 6                   | One per table to hold coins. |
  | Sculpting tools        | 6 sets              | Plastic knives, rollers, and simple shaping tools. |
  | Table cards            | 6                   | For writing sameness criteria. |
  | Pens                   | 6                   | For writing criteria. |
  | Damp cloths            | 6                   | To slow clay drying. |
  | Cleaning brushes       | 6                   | For sweeping crumbs. |
  | Stopwatch              | 1                   | For timing phases. |
  | **Total Cost**         | ~£80-£100           | Primarily coins and clay. Reusable scales/tools. |

  ---

  ### **Timeline (120 Minutes Total)**
  | **Time**  | **Phase**             | **Key Activities** |
  |-----------|------------------------|-------------------|
  | **0:00–0:15** | Setup                 | Assign tables as workshops (e.g., "Athena Restorations"). Distribute materials. Write criteria cards. |
  | **0:15–0:25** | Event 1: Commission   | Sculpt initial statue (e.g., "Felix the Cat"). Client (you) approves and pays 5 coins. |
  | **0:25–0:45** | Event 2: Gradual Replacement | Replace 5% of clay (by weight) 5 times. Settle sameness after each step. |
  | **0:45–0:55** | Event 3: Destruction & Remaking | Destroy statue; rebuild from same matter. Settle sameness. |
  | **0:55–1:10** | Event 4: Division    | Split statue into two; restore both. Settle ownership between two clients. |
  | **1:10–1:25** | Event 5: Fusion      | Fuse two statues (swap with another table). Settle claims for both clients. |
  | **1:25–1:35** | Event 6: Unpredictable Change | Weigh statue after drying/crumbling. Settle final client payment. |
  | **1:35–1:50** | Reckoning & Scoring   | Review decisions, enforce penalties, tally coins. **Room-wide moment here.** |
  | **1:50–2:00** | Debrief               | Map rules to philosophical positions (reveal names only now). |

  ---

  ### **Event Script & Facilitator Actions**
  **Key Rules:**  
  - Each table’s pre-written sameness criterion is final. All decisions must invoke it.  
  - Stakes are immediate: coins change hands after each settlement.  
  - **Whole-room pauses:** At the start/end of Events 1, 4, and Reckoning. Other events run table-by-table.  

  #### **Event 1: Commission (10 min)**  
  **Facilitator Script:**  
  *“You are Smith & Co. Sculpture Restoration. Your client commissions ‘Felix the Cat’—due in 10 minutes. Sculpt Felix from your clay, record its weight, and name him. When I approve, you earn 5 coins.”*  
  **Actions:**  
  - Roam tables, inspect statues, pay 5 coins per table.  
  - **Critical:** Note each statue’s weight and appearance for later.  

  #### **Event 2: Gradual Replacement (20 min)**  
  **Facilitator Script:**  
  *“Felix ages. Every 4 minutes, replace exactly 5% of his clay (use scales). After each replacement, ask: ‘Is this still Felix?’ By your rule, settle with the client immediately. If yes, earn 1 coin. If no, repay your initial 5 coins and stop.”*  
  **Actions:**  
  - Announce steps at 4-min intervals.  
  - If a table says "no," collect 5 coins. If "yes," pay 1 coin per step.  
  - **Example:** A table replacing 10g five times can earn 5 coins if they always say "yes."  

  #### **Event 3: Destruction & Remaking (10 min)**  
  **Facilitator Script:**  
  *“Disaster! Felix fell and shattered. Rebuild him from every speck of original matter (weigh it). Is this still Felix? Settle now: if yes, earn 5 coins. If no, repay your initial 5 coins.”*  
  **Actions:**  
  - Enforce use of scales to gather matter.  
  - Pay/collect coins instantly.  

  #### **Event 4: Division (15 min)**  
  **Facilitator Script (whole room):**  
  *“Felix was cut in half during transport. Restore each half to a full statue (add new clay). Now Client A (original owner) and Client B (buyer) claim Felix. By your rule, who owns what? Settle claims:*  
  - *If only one is Felix, give it to Client A (earn 5 coins), sell the other to Client B (earn 3 coins).*  
  - *If both are Felix, give both to Client A (earn 5 coins total).*  
  - *If neither is Felix, compensate Client A 5 coins and sell both to Client B for 3 each (net 1 coin).”*  
  **Actions:**  
  - Role-play both clients. Pay/collect coins.  
  - **Crucial:** Tables *must* choose one outcome—no abstentions.  

  #### **Event 5: Fusion (15 min)**  
  **Facilitator Script:**  
  *“Swap one statue with another table. Now, accidentally fuse your two statues into one new piece. Both clients demand their statue back. For each original, decide: is it present in the fusion?*  
  - *If you say ‘yes’ for a statue, avoid compensating its client.*  
  - *If ‘no,’ pay that client 5 coins.*  
  *You keep the fused statue.”*  
  **Actions:**  
  - Facilitate swaps. Enforce quick decisions.  
  - **Example:** Saying "no" for both statues costs 10 coins.  

  #### **Event 6: Unpredictable Change (10 min)**  
  **Facilitator Script:**  
  *“Time has passed. Weigh Felix. If he’s lost/gained weight, does this change his identity? The client returns for final inspection. If you say ‘yes, it’s Felix,’ earn 5 coins. If ‘no,’ earn nothing.”*  
  **Actions:**  
  - Let scales reveal drying/crumbling. Pay 5 coins only for "yes."  

  #### **Reckoning & Scoring (15 min)**  
  **Facilitator Script (whole room):**  
  *“Tally your coins. Now, defend one decision against your criterion. If inconsistent, repay double the coins earned in that event. Finally, read your criteria aloud.”*  
  **Actions:**  
  - Randomly audit one decision per table. Penalize inconsistencies (e.g., if a table earned 5 coins in Event 3 but violated their rule, they repay 10 coins).  
  - **Room-wide moment:** After penalties, ask: *“Which rule earned the most? Table A with ‘same matter’? Table B with ‘same form’? Let’s see…”* Project a leaderboard. Tables discover:  
    - Matter-focused rules lose in Events 3/6 (remaking/drying).  
    - Form-focused rules lose in Event 4 (division).  
    - **No rule tops the board.** Participants realize conflicting criteria are unavoidable.  

  #### **Debrief (10 min)**  
  **Facilitator Script:**  
  *“Today, you reinvented classic positions:*  
  - *‘Same matter’ is* mereological essentialism *(loses when matter changes).*  
  - *‘Same form’ is* hylomorphism *(loses when form splits).*  
  *No rule works universally—this is the grounding problem of material constitution. Disputes arise because we unknowingly toggle between matter and form. Philosophers don’t resolve this with coins, but your stakes made the tension visceral.”*  
  **Avoid:** Naming positions before now.  

  ---

  ### **Betting & Scoring Mechanics**  
  - **Stakes:** Coins are won/lost instantly. Starting bank: 20 coins/table.  
  - **Scoring Examples:**  
    - **Event 2 (Replacement):** A table with a ">50% original matter" rule replaces 25% total. If they say "yes" all steps (earning 5 coins) but their rule forces "no" at step 5, they repay 5 coins + 5 penalty if caught in Reckoning.  
    - **Event 4 (Division):** A "same form" rule might declare both statues Felix, earning 5 coins. A "same matter" rule declares neither, netting 1 coin.  
  - **Endgame:** Average table ends with 15–25 coins. No "winner"—focus on collective insight.  

  ---

  ### **Predictable Problems & Fixes**  
  | **Problem** | **Fix** |
  |-------------|---------|
  | Participant declares: *“Statues don’t exist!”* and won’t bet. | *“Your workshop signed a contract to deliver Felix. If you reject the commission, repay your 5 coins and sit out. But you’ll lose earnings.”* Most will play. |
  | Vague criteria (e.g., “It’s Felix if it feels right”). | Force specificity: *“Your rule must be testable with scales or observable traits. Revise now.”* |
  | Tables run out of coins. | Offer a 5-coin loan (no interest) to keep them playing. |
  | Clay dries too fast. | Use damp cloths; briefly moisten clay if unusable. |
  | Disagreements within tables. | Majority vote rules; facilitator breaks ties. |
  | Ship of Theseus reference. | Shut down firmly: *“That’s a different puzzle. Use your rule for *this* case.”* |

  ---

  ### **What the Game Cannot Reproduce**  
  **Your Worry Addressed:**  
  The game turns metaphysical disputes into financial ones, risking a shift toward legalistic thinking (e.g., “What does the contract say?”). To prevent this:  
  1. **Opening Instruction:** *“You are craftsmen, not lawyers. The client cares about whether Felix *himself* is present—not technicalities. Your criterion is your workshop’s truth about identity.”*  
  2. **During Game:** If tables fixate on contracts, interject: *“The client isn’t suing you. They’re asking: is Felix still here? What does your rule say?”*  
  3. **Incentive Mismatch:** The game’s stakes might incentivize profit over truth. Mitigate by:  
     - Penalizing rule violations harshly (double repayments).  
     - Making criteria public in the Reckoning (social pressure).  

  **Inherent Limitation:**  
  Money can’t perfectly mirror metaphysical intuition (e.g., a table might tolerate a counterintuitive verdict to profit). But it forces engagement with contradictions—participants *feel* the conflict when their rule costs them coins.  

  ---

  ### **Writer’s Moment: The Reckoning**  
  At **1:40**, during scoring:  
  - Tables see their rules projected (e.g., “Same matter,” “Same form”).  
  - You reveal how much each rule earned in key events:  
    > *“Table 1’s ‘same matter’ rule made 8 coins in Event 2 but lost 10 in Event 3. Table 3’s ‘same form’ rule aced Event 3 but netted 1 coin in Event 4. No rule dominated.”*  
  - The room realizes **simultaneously** that:  
    1. Their criteria conflict.  
    2. No rule is universally applicable.  
    3. They’ve been using matter/form criteria without realizing it.  
  - **Why it lands:** Visual, financial, and collective. Tables groan/laugh as their rules fail.  

  ---

  This plan ensures participants discover the conflict in criteria through hands-on dilemmas, with stakes that make abstract problems urgent. The debrief links their rules to philosophy only after they’ve lived the tension. Run a dry test with friends to refine timings and clay quantities.
