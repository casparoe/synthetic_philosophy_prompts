  For the Kantian objection, the key is the separation of causal transmission from evaluative aesthetics. Kantians care about disinterested judgment, so the objection would challenge the lack of a value account. The reply should link transmission to universal communicability, but that's soft because Kant's universality is about judgment, not emotion transmission.

