prompt: |-
  I'm the intake lead at a community mental health clinic and I've now been on two committees that revise our forms, so I've been trying to figure out when a diagnostic label actually changes the people it gets applied to versus when it's just a change in what the paperwork says. I read some Hacking on looping years ago and it felt right, but I can't tell whether it's tracking a real distinction in my own case list rather than a nice story. Here are my verdicts, going by what I've actually watched happen.

  When Asperger's got folded into autism spectrum disorder, a lot of adults who'd built an identity on the old word lost something real, and the term went underground and came back as a badge. That looped — the classification changed the people. When "mental retardation" became "intellectual disability," I don't think anybody's inner life moved an inch; it only changed what other people are allowed to say out loud. Those two are both euphemism cycles and they came out opposite, and that bothers me.

  Multiple personality in the 80s: the caseload exploded the moment clinicians started asking about alters, and I'll say flat out that the category made the condition. Depression in primary care once the pills and the screening questionnaires arrived: the numbers exploded just as hard, but I won't say the category made the condition — those people were miserable beforehand, we just started counting them. Same epidemiological shape, opposite verdict from me, and I can't defend the difference.

  PTSD: pushed in largely by veterans' advocacy, so politically made in an obvious way, and still I think it fit what was already there. So a loop can be a discovery rather than a distortion.

  The one I keep circling is this. When a label unlocks resources — ADHD and extra time in school, a disability determination — I watch reported symptom profiles drift toward the criteria and I call that contamination, the measure stops measuring. When a label unlocks a community and a vocabulary for yourself — autism — I watch exactly the same drift and I call it people finally saying what was true all along. I'm definately not just doing this for political reasons, but I can't say what I'm keying on.

  Also: our EHR quietly flags certain patients as high-utilization-risk by algorithm and nobody is told. I think that loops, because the flag changes what we offer them and that changes what they turn into. But I also think that if we ran the flag and never acted on it and never told anyone, nothing at all would happen. So self-consciousness doesn't look like the trigger, which surprises me.

  My tentative rule is that a classification loops if and only if it gets into the classified person's own practical reasoning — if it changes what they count as a reason for doing things. That handles the intellectual disability case nicely, but it says the risk flag can't loop, and it gives me nothing on ADHD versus autism, since both labels are absolutely in people's practical reasoning. Maybe the real variable is who authored the criteria, insiders or outsiders, rather than anything about self-awareness, but I don't see how that handles the grief or depression cases either.

  So: is there a principle, or a small set of candidates, that gets most of this? State it precisely and tell me which of my cases motivates each clause, and what it costs. Then tell me what it predicts about cases I haven't listed — I specifically want to hear about prolonged grief disorder now that it's an official diagnosis, and about a "burnout" flag a colleague wants to add to our own intake form that no external manual recognizes. And be straight with me about which of my verdicts the principle forces me to give up, because I'd rather know.
reasoning: |-
  Okay, this user is an intake lead at a community mental health clinic who's deeply engaged with the philosophical and practical implications of diagnostic labels. They've clearly wrestled with Ian Hacking's concept of "looping effects" for years, but now they're confronting concrete contradictions in their daily work. 

  The user presents six nuanced case studies where diagnostic labels interact differently with human behavior: Asperger's vs intellectual disability terminology changes, multiple personality disorder vs depression epidemics, PTSD legitimacy, ADHD vs autism symptom drift, and algorithmic risk flags. Each case challenges simple explanations of when labels create versus describe reality. 

  What's striking is their intellectual honesty - they admit discomfort when their intuitive judgments don't align (e.g., identical epidemiological patterns in MPD/depression receiving opposite verdicts). Their core tension seems to be between recognizing labels' emancipatory potential (autism community) versus their corrupting influence (ADHD accommodations). The EHR risk flag example adds complexity by showing looping without self-awareness.

  The user isn't just asking for theory - they want operational principles. Their proposed "practical reasoning" criterion is thoughtful but fails their own test cases. They specifically demand precision: a falsifiable framework that explains their observations, predicts new cases (prolonged grief, burnout), and forces them to surrender some cherished judgments.

  This is a clinician-philosopher hybrid query. They've done the fieldwork; now they need conceptual scaffolding. Key hurdles: 
  - Accounting for identical drift patterns (ADHD/autism) being interpreted differently
  - Explaining looping without consciousness (EHR flags)
  - Resolving why some politically-driven labels (PTSD) "fit" while others distort

  The proposed "ecological validity" framework in my response emerged from dissecting these paradoxes. It prioritizes three questions: 1) Does the label connect to pre-existing phenomenology? (solves PTSD/depression) 2) Does it create new affordances? (explains Asperger's/ADHD drift) 3) Is the classification legible to the classified? (handles EHR flags). 

  Notably, this forces the user to reconsider their ADHD verdict - that drift isn't mere "contamination" but partially valid self-discovery enabled by new resources. The hardest sell will be that their autism/ADHD distinction reflects clinician bias rather than intrinsic difference. But the payoff is predictive power: prolonged grief will likely loop minimally (fails criterion 1), while unregulated burnout flags could dangerously reshape suffering (meets all 3 criteria).

  Their self-awareness about potential political motivations ("definately not just doing this for political reasons") suggests readiness for uncomfortable conclusions. The response must honor both their data and their epistemic unease - hence explicitly naming which verdicts must be abandoned.
answer: |-
  Based on your deeply observed cases and the tensions you've identified, here's a principle derived from Hacking's looping effects, ecological psychology, and affordance theory – designed to handle your contradictions and offer predictive power:

  **The Ecological Validity Principle of Looping:**
  *A classification generates looping effects (changes the classified people) to the extent that it:*
  1.  **Connects to Pre-Existing Phenomenology:** Corresponds to recognizable, pre-existing patterns of experience, behavior, or suffering *as perceived by the classified individuals or their immediate community* (not solely by external observers or abstract criteria).
  2.  **Creates New Affordances:** Introduces *new, concrete opportunities or constraints* (resources, communities, narratives, identities, treatments, penalties) that are *meaningfully perceivable and utilizable* by the classified individuals within their life context.
  3.  **Achieves Legibility:** Becomes sufficiently known and understood *by the classified individuals* to be incorporated into their self-understanding or social interactions.

  **Loops strongly when ALL THREE conditions are met. Loops weakly or not at all if any condition is absent.**

  ---

  **Applying the Principle to Your Cases & Resolving Tensions:**

  1.  **Asperger's -> ASD (Loops Strongly):**
      *   *Phenomenology:* Strong connection to deep, pre-existing identity and self-experience ("built an identity").
      *   *Affordances:* Loss of a specific identity marker/label; later regained as a community "badge" (new social affordance).
      *   *Legibility:* Highly legible term central to self-concept.
      *   *Costs/Motivates:* Explains the intense identity shift and underground resurgence. Clause 1 (Phenomenology) distinguishes it from mere paperwork change. Clause 2 (Affordances) explains why the *change* triggered looping.

  2.  **"Mental Retardation" -> "Intellectual Disability" (Minimal Looping):**
      *   *Phenomenology:* Connection exists (underlying cognitive reality), but...
      *   *Affordances:* Change primarily affects *others' speech* (external affordance change), not core resources, community, or identity for the individuals themselves in a *newly perceivable/utilizable* way. The *functional* opportunities/constraints often remained similar.
      *   *Legibility:* Legibility may not have significantly changed for many individuals.
      *   *Costs/Motivates:* Clause 2 (Affordances) is key: the new label didn't create *new, meaningful, user-perceivable* opportunities/constraints *for the individuals*. It changed external discourse, not core ecological interactions.

  3.  **Multiple Personality (MPD/DID) in the 80s (Looped Strongly):**
      *   *Phenomenology:* Connection exists (dissociation, distress), but often vague or reinterpreted beforehand.
      *   *Affordances:* Created *massive new affordances:* Specific therapeutic focus (discovering alters), narrative templates for distress, potential attention/sick role, diagnostic validation. Highly utilizable.
      *   *Legibility:* Became highly legible through media/therapy questions.
      *   *Costs/Motivates:* Clause 2 (Affordances) is crucial: The *specific form* of alters, switching, etc., became perceivable/utilizable goals/responses *because* the label offered that script. It radically reshaped the phenomenology via new affordances.

  4.  **Depression in Primary Care (Minimal Looping):**
      *   *Phenomenology:* Strong connection to pre-existing misery ("were miserable beforehand").
      *   *Affordances:* New affordances (pills, questionnaires) *but* these primarily made existing misery *treatable/measurable*, not fundamentally *reshaped*. The core experience (sadness, anhedonia, fatigue) didn't morph into something new *because* of the label; the label captured it better.
      *   *Legibility:* Increased legibility, but core phenomenology was already legible as "misery".
      *   *Costs/Motivates:* Clause 1 (Phenomenology) is strong; Clause 2 (Affordances) added tools but didn't *fundamentally redefine* the experience itself. The explosion was counting, not creation. Contrasts with MPD where affordances *created* the specific phenomenology.

  5.  **PTSD (Loops, but as Discovery/Fitting):**
      *   *Phenomenology:* Strong connection to pre-existing, recognizable trauma reactions (shell shock, etc.).
      *   *Affordances:* Created powerful new affordances: Validation, treatment focus, veterans' benefits, political advocacy. Highly utilizable.
      *   *Legibility:* Became highly legible through advocacy and criteria.
      *   *Costs/Motivates:* **ALL THREE conditions met, so it loops.** But Clause 1 (strong pre-existing, recognizable phenomenology) means the looping primarily *refined, validated, and empowered* existing suffering rather than *creating* a fundamentally new kind of suffering like MPD criteria did. Looping can amplify, organize, and provide resources for real phenomena.

  6.  **ADHD (Drift = Contamination) vs Autism (Drift = Discovery):**
      *   *ADHD:* Meets all 3 criteria (Phenomenology: focus/impulse issues; Affordances: extra time/resources; Legibility: known label). **So it loops.** The drift isn't *just* "contamination" but also people recognizing previously unarticulated struggles *through* the lens of the diagnosis *and* adapting to the affordances (consciously or not). Your verdict likely overemphasizes "gaming" and underemphasizes genuine self-discovery enabled by the label/affordances.
      *   *Autism:* Meets all 3 criteria equally strongly. The drift is similarly a mix of self-discovery *and* adaptation to affordances (community, identity).
      *   *Costs/Motivates:* **The principle forces you to give up the strict distinction between "contamination" and "discovery" in these cases.** Both involve looping via new affordances and legibility acting on pre-existing (though perhaps previously unlabeled or misunderstood) phenomenology. The *perceived* difference might stem from the *type* of affordance (resource vs. community) or your implicit valuation of one over the other, not the underlying looping mechanism. Both labels get into practical reasoning *because* they create powerful new affordances.

  7.  **EHR Risk Flag (Can Loop, Without Self-Consciousness):**
      *   *Phenomenology:* May connect to pre-existing patterns (crisis proneness, complex needs) – but often via opaque algorithms.
      *   *Affordances:* Creates *major new affordances for clinicians* (steering treatment, restricting access) which *indirectly* change the patient's ecological niche (what care is offered/withheld).
      *   *Legibility:** Low/None for the patient (not told). High for the system.
      *   *Costs/Motivates:* **Clause 2 (Affordances) is met *for the system*, and Clause 1 *might* be met indirectly.** The looping happens *because the system acts differently based on the classification*, changing the patient's environment and thus their options, behaviors, and potentially identity ("difficult patient"). Self-consciousness *in the patient* (Clause 3) is **not** required for looping if the affordances generated by the label for *others* significantly alter the patient's ecological context. Your intuition that non-acting flags don't loop is correct: without affordances (action), there's no mechanism for change.

  ---

  **Predictions for New Cases:**

  1.  **Prolonged Grief Disorder (PGD):**
      *   *Phenomenology:* Strong connection to intense, enduring grief recognized cross-culturally.
      *   *Affordances:* Creates new affordances: Specific therapy protocols (potentially), insurance reimbursement for treatment, validation for those feeling "stuck," risk of pathologizing normal variation.
      *   *Legibility:* Increasing as it enters clinical use/media.
      *   *Prediction:* **Moderate Looping.** Strong Clause 1 will anchor it. Looping will occur primarily through affordances (therapy access, validation for some, potential stigma/self-doubt for others). It's unlikely to create wholly new *forms* of grief like MPD created alters, but may shape how people understand and express their existing grief over time ("Am I disordered now?"). The risk is subtle shifts in the perceived "timeline" of acceptable grief.

  2.  **"Burnout" Flag (Unofficial Intake Form):**
      *   *Phenomenology:* Connects to widespread experiences of exhaustion, cynicism, inefficacy (esp. work-related).
      *   *Affordances:* Creates affordances *within your clinic*: Potential steering towards specific resources (therapy groups? stress management?), clinician perception/focus, internal tracking. *No* external resources/validation yet.
      *   *Legibility:* Moderate for clinicians using the form; low for patients unless the term is discussed explicitly based on the flag.
      *   *Prediction:* **Moderate Looping Risk, Primarily Clinic-Driven.** The lack of external affordances (Clause 2) limits its power. However, *if* the flag consistently changes clinician behavior (e.g., offering different interventions, subtly changing expectations), it *can* loop within your clinic population. Patients might start framing their distress more as "burnout" if clinicians focus on it, and may adapt to the (limited) internal affordances offered. It's less potent than an official diagnosis but not inert. The looping would be localized to your clinic's ecosystem.

  ---

  **Verdicts You Must Give Up (Per the Principle):**

  1.  **The Strict ADHD "Contamination" vs. Autism "Discovery" Distinction:** The principle shows both involve looping driven by new affordances acting on pre-existing phenomenology. While the *motivations* for drift might differ (accessing resources vs. finding community), the *mechanism* (classification enabling new perceptions and actions) is the same. Your verdict likely reflects an (understandable) bias towards viewing community/identity affordances as more "authentic" than resource-based ones.
  2.  **Self-Consciousness as Necessary for Looping:** The EHR flag case demonstrates that looping can occur through changes in the *environment* (affordances created for others) without the classified individual being aware of the label itself.
  3.  **"Just Changing Paperwork":** Even the Intellectual Disability change had *some* effect (changing discourse norms - an affordance for society), but its weakness in Clauses 2 & 3 for the *individuals* explains the minimal looping you observed. Paperwork changes *can* matter if they create new affordances.

  This principle emphasizes that classifications aren't just descriptors or creators, but *intervening tools* that reshape human ecology. Looping happens when the tool connects to something real *for the user*, offers new things to *do* or *be*, and becomes a recognizable part of their world. It explains your cases, makes testable predictions, and forces a more nuanced view of drift – not as purely authentic or corrupting, but as an interaction between individuals and the new possibilities labels introduce.
