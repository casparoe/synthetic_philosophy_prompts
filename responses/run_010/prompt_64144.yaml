prompt: |-
  I'm applying for a one-year MA thesis fellowship in history and philosophy of science — deadline in three weeks, committee is two historians plus one philosopher of science who I'm told mostly reads for whether your question actually has an answer. My half-formed idea, which my supervisor thinks is a trap because everything worth saying about it has already been said: basically everyone frames Kepler and astrology as a yes/no question, did the guy who wrote down the laws of planetary motion really believe in it or was he just casting horoscopes to keep the landlord off his back, and the standard answer is "sort of both," which tells you nothing. My suspicion is that the interesting thing isn't what he believed but what he counted as a license to believe it. From what I've read he seems to run something like a mechanism test: an astrological claim is admissible only if he can name a channel for it — light, the sun's approach and recession giving you seasons, the moon working on moisture, geometric or harmonic proportions between planetary rays which he insists are located down at the recieving end rather than up in the sky — and inadmissible otherwise, no matter how often it seems to come true. And then he's cheerfully casting and rectifying a nativity for Wallenstein in 1625 while saying out loud that he's put the traditional rules to a philosophical test and has no use for them whatsoever. So the question I want to put in the proposal: is Kepler's demarcation of astrology really a criterion about mechanisms, does that criterion make him a reformer of the practice rather than a skeptic of it, and — the part that would make it a thesis instead of a vibe — can it be shown to discriminate, i.e. are there cases where he endorses a prediction with no mechanism offered and cases where he rejects one despite apparent confirmation?

  Turn that into a proper proposal, call it two pages. I need: the question stated so precisely that it could come out false; why the three readings already on offer — Kepler as last of the magi, Kepler as first modern who shook the superstition off, Kepler as a paid cynic performing for patrons — each leave my question open rather than answering it; the method, month by month over nine months, and specifically why this approach (reconstruct the criterion, then run it against a corpus of his own predictions, refusals, and the things he does for money) rather than the obvious alternatives like an intellectual biography or a survey of early-modern arguments about whether astrology is legitimate; what a successful result would look like as a thing I could hand someone, and a real failure section — I want to know what it would look like if the project collapses, e.g. if the criterion can only be stated so loosely that anything Kepler did is consistent with it, or if it turns out indistinguishable from what any competent astronomer of his day would have said, or if there just isn't enough material where he predicts and refuses in comparable cases; and a candid scope note, including the fact that I read Latin slowly and no German at all and alot of the astrological stuff is untranslated, so the plan should say which parts of the project survive that constraint and which don't.

  Two housekeeping things. Don't give me a bibliography, a reading list, or a lit review with citations in it — I'll do all the referencing myself and I'd rather you not invent any. Where the plan needs a source, describe the kind of passage I should go hunt for (something like: a year-by-year prognostication where he forecasts a specific political event and offers no causal story at all) instead of naming one. And if you think my mechanism-test reading is wrongheaded, or that there's a better question hiding underneath it that the same material could answer, say so right at the top and write the proposal around the better one — but tell me what you changed and why, because I still have to defend the original version to my supervisor in a seminar next week.
