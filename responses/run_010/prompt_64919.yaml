  ---

  ### **Decomposition Terms with Probabilities & Justifications**
  *(Each term represents P(Knowledge | Term) or a key weight)*

  1. **Method Individuation (Weight: 0.30)**  
     - *Credence that narrow individuation ("reading gauge G") is correct for modal/reliabilist conditions:* **0.90**  
       Justification: Epistemologists (e.g., Comesaña, Goldman) argue that methods should be fine-grained to avoid generality problems. The stipulation emphasizes G as the exclusive basis (5), making "reading G" the natural individuation. Broader methods (e.g., "assessing tank fullness") risk ignoring the faulty mechanism.  
     - *Alternative: Broad individuation ("sensory assessment of tank indicators"):* **0.10**  

  2. **Modal/Reliabilist Condition (Weight: 0.25)**  
     - *Safety (no easily accessible nearby worlds with false belief):* **0.20**  
       Justification: In close worlds where the tank isn’t full (e.g., no refill tonight), G still reads "FULL" (stipulation 2), so Mira’s belief is unsafe.  
     - *Sensitivity (if not full, she wouldn’t believe it):* **0.05**  
       Justification: If the tank were empty, G would still read "FULL" (2), so her belief is insensitive.  
     - *Proper Function/Reliability:* **0.10**  
       Justification: G’s sensor is broken (2), so the process is objectively unreliable despite historical performance.  
     - *Overall verdict:* **Weighted P(Knowledge) = (0.20 × 0.4) + (0.05 × 0.3) + (0.10 × 0.3) = 0.12**  
       *(Weights: Safety 0.4, Sensitivity 0.3, Reliability 0.3 – reflecting contemporary emphasis on safety/reliability over sensitivity.)*  

  3. **Historical False Beliefs (Weight: 0.20)**  
     - *Credence that historical errors damage tonight’s belief:* **0.85**  
       Justification: Process reliabilism (Goldman) requires actual reliability. The 3-week run (stipulation 3) proves the method is unreliable *now*, regardless of past accuracy. "Tonighting" (focusing solely on tonight’s process) ignores this manifest failure.  
     - *Credence only tonight matters:* **0.15**  
       Justification: Internalists may argue that if the process *was* reliable tonight (e.g., tank was full), history is irrelevant. But stipulation 5 shows the process was identical to error-nights.  

  4. **Unused Evidence (Weight: 0.15)**  
     - *Credence that unused evidence contributes nothing:* **0.95**  
