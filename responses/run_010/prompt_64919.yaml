  ### **Combination Methodology**  
  I use a **weighted geometric mean** (log-linear pooling) to aggregate probabilities, as terms are interdependent (e.g., method individuation affects reliability). This penalizes inconsistency more than arithmetic mean.  

  - **Term Weights:** Normalized to sum to 1.0 (see above).  
