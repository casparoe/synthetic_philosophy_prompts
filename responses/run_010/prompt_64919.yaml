  6. **Context Sensitivity (Weight: 0.10)**  
     - *Credence that "knows" has no stable truth-value here:* **0.70**  
       Justification: Contextualism (DeRose) suggests "knows" depends on conversational salience of error possibilities (e.g., broken gauges). Your stipulations fix no context, creating ambiguity.  
