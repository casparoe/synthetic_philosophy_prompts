prompt: |-
  Fourth-year in political theory, mostly distributive justice with one foot in social choice, and I think I've just built an argument against the view I actually hold. Background: I'm a prioritarian, and I reckon I have a clean answer to the leveling-down objection — blinding the sighted makes things more equal but better in no way, because on my view equality isn't valuable in itself; what's valuable is benefits, weighted by how badly off the person getting them is. My advisor wasn't impressed and ran this at me instead:

  (1) If a principle's verdicts about outcomes change when you change something that makes no difference to how well off anyone is, it isn't tracking anything real.
  (2) Well-being is a quantity, and quantities get represented by numbers on a scale; nothing in the facts about people's lives fixes where the zero of that scale sits.
  (3) Prioritarian verdicts depend on the zero. Take priority weight = square root of well-being, and compare A = (Ann 1, Bob 100) with B = (Ann 36, Bob 49): sqrt gives 11 vs. 13, so B wins. Now add 400 to everyone's number in both outcomes — a mere re-zeroing, nobodys life has changed. A′ = (Ann 401, Bob 500) scores about 42.4 and B′ = (Ann 436, Bob 449) about 42.1. A′ wins.
  (4) So by (1), prioritarianism isn't tracking anything real.
  (5) And notice that (1) and (2) don't mention priority anywhere. They apply to anything that says something about how much well-being people have — utilitarianism, egalitarianism, person-affecting views, even just the claim that saving five is better than saving one. All of them are claims about quantities whose numerical expression is up to us.
  (6) So none of those track anything real either.
  (7) But (6) is flatly absurd; my advisor and I both think Ann at 100 is better off than Bob at 1, and that that's a fact.

  Which step is bad? My gut says (5), that the generalization is doing something (3) doesn't license — but I can't say what, and I'm scared that the only way I can block (5) is by giving up (1), which is what did the work in (4). So: tell me the step you'd cut, why it looked innocent going in, and what I owe if I'd rather keep (1). Also — is there a principled zero a prioritarian can point at? I keep reaching for the level at which a life stops being worth living, and I want to know whether naming that answers the objection or just relocates it to the shape of the weighting function. Please commit: take a position and defend it rather than laying out the menu and leaving me to pick. American English, thanks.
reasoning: |-
  Okay, let me tackle this. The user is a fourth-year political theory student specializing in distributive justice and social choice. They're a prioritarian facing an argument from their advisor that challenges their view. The core issue is that prioritarian judgments change when the well-being scale is re-zeroed, even though no one's actual well-being changes. The advisor claims this implies prioritarianism isn't tracking anything real, and this problem extends to all theories involving well-being quantities.

  First, I need to identify the weak step. The user suspects step (5), where the advisor generalizes the problem to all theories. But why? Let me think about well-being scales. Step (2) says nothing fixes the zero point, which seems true if well-being is a ratio scale without a natural zero. But utilitarianism uses zero differently—it cares about differences, not ratios. Adding a constant to everyone (re-zeroing) doesn't change utility differences. For example, Ann 1 vs Bob 100: difference is 99. After adding 400, Ann 401 vs Bob 500: difference still 99. So utilitarianism is invariant to re-zeroing. 

  Prioritarianism, though, uses a concave weighting function (like square root) that transforms well-being values. Without a fixed zero, shifting the scale changes the ratios. In the example, A vs B flips when adding 400. So prioritarianism depends on the zero point, unlike utilitarianism. The advisor's step (5) is wrong because not all theories are affected equally. Utilitarianism avoids this issue due to its focus on marginal utility. 

  What about egalitarianism? Some forms might care about ratios, but others focus on differences. The leveling-down objection targets egalitarianism differently. Person-affecting views might also not rely on ratios. So step (5) overgeneralizes by lumping all theories together. 

  The user asked about using "a life not worth living" as a natural zero. But this doesn't solve the problem. The shape of the weighting function still causes sensitivity to scale shifts. For example, if we define zero at the neutral point, the square root function still behaves differently when adding constants. The issue is mathematical, not just conceptual. 

  The user needs to reject step (5) and clarify that utilitarianism isn't vulnerable to this re-zeroing problem. They should insist that prioritarianism requires a fixed zero, which can be defended as part of the theory. This might involve arguing that well-being has a natural zero (e.g., neutrality) and that the weighting function's shape is justified independently. Alternatively, they could adopt a different weighting function less sensitive to scale, but that might not be feasible. 

  The deeper point: the advisor's move exploits a mathematical property of ratio-dependent functions. By showing that utilitarianism avoids this, the user can block the generalization and defend prioritarianism by anchoring the zero point philosophically.
answer: |-
  Here's the breakdown: **Step (5) is the fatal flaw.** It incorrectly generalizes the vulnerability to re-zeroing to *all* theories involving well-being quantities. While (3) successfully shows prioritarianism *is* vulnerable, utilitarianism, standard egalitarianism, person-affecting views, and the "saving five vs. one" intuition are *not* vulnerable in the same way. Step (1) remains intact, and you don't need to abandon it. Here's the full defense:

  1.  **Why Step (5) Looks Innocent (But Isn't):** On the surface, step (5) seems logical. If well-being is a quantity represented numerically, and the zero point isn't fixed, then *any* view using numerical representations *must* be sensitive to where we put zero. The advisor argues this vulnerability isn't specific to prioritarianism but plagues everyone. *This intuition is wrong and stems from conflating different types of scales and what different theories actually care about.*

  2.  **Why Step (5) Fails: The Crucial Distinction (Ratio vs. Interval Scales)**
      *   **Step (2) is Correct:** Well-being lacks a *natural* zero point. We *represent* it numerically, but the choice of zero (the "origin") is conventional. Your advisor is right: adding a constant to everyone's well-being number doesn't change *anyone's actual life*; it's just a recalibration.
      *   **The Mistake:** Step (5) implicitly assumes that *all* normative theories treat well-being as a **ratio scale** (where ratios and zeros are meaningful). However, the theories it attacks mostly only require an **interval scale** (where *differences* and *order* are meaningful, but ratios and zeros are not).
      *   **Utilitarianism is Invariant to Re-zeroing:** Utilitarianism cares about the *sum* of well-being. Adding a constant `C` to *everyone's* well-being in *both* outcomes adds `n*C` to each sum (where `n` is the number of people). Since `n*C` is added to *both* sums being compared, the *difference* between the sums remains unchanged. Therefore, utilitarianism's verdict about which outcome has the greater *total* well-being is **completely unaffected** by re-zeroing. It only cares about differences (marginal utility) and order, not ratios or absolute zeros.
          *   *Example:* Compare `A=(1, 100) sum=101` vs. `B=(36, 49) sum=85`. `A` wins. Add 400: `A'=(401, 500) sum=901` vs. `B'=(436, 449) sum=885`. `A'` still wins. The verdict doesn't flip.
      *   **"Saving Five vs. One" is Invariant:** This relies solely on the *difference* in well-being gained/lost. Adding a constant to everyone doesn't change the *difference* in well-being between the states of being saved or not saved. If saving five gives a total benefit of `5*ΔW` and saving one gives `1*ΔW`, adding a constant `C` to everyone's well-being doesn't change `ΔW` (the gain from being saved). The ratio `(5*ΔW) / (1*ΔW) = 5` remains the same regardless of `C`.
      *   **Standard Egalitarianism (Telic, Inequality-Averse) is Usually Invariant:** Most common telic egalitarian views (e.g., those using the Gini coefficient, Atkinson index, or simply caring about the difference between best and worst off) focus on *relative* differences or *dispersion*. Adding a constant to everyone shifts the mean but leaves relative differences (ratios *if* ratio-scale is assumed) or absolute differences (if using an interval scale) unchanged. Leveling-down objections target the value of equality *itself*, not a sensitivity to re-zeroing. The verdict between `(1, 100)` and `(36, 49)` might change based on the *specific* egalitarian measure, but crucially, adding 400 to both (`(401, 500)` vs. `(436, 449)`) won't *systematically flip* the verdict the way it does for ratio-dependent prioritarianism. The dispersion characteristics remain largely similar.
      *   **Person-Affecting Views are Typically Invariant:** These views focus on whether individuals are better or worse off than they would have been otherwise. Adding a constant to *all* states (including counterfactuals) doesn't change the *comparative* assessment for any individual ("Am I better off in state X than in state Y?"). The *differences* for each person remain constant.

  3.  **Why Prioritarianism *Is* Vulnerable (Step 3 is Correct):** Prioritarianism explicitly weights well-being *levels* using a concave function (like square root). **Concave transformations are inherently ratio-dependent.** They care about the *absolute magnitude* of the input relative to zero. Shifting the zero point (`W -> W + C`) fundamentally changes the ratio `(W_i + C)/C` or the perceived "distance from zero" that the weighting function operates on. This is why the verdict flipped in your advisor's example: the function `sqrt(W)` is highly sensitive to values near zero, and adding 400 moved both Ann and Bob far from zero, drastically altering the weighting compared to the original scale. **Prioritarianism requires a ratio scale for well-being.** Its verdicts depend not only on differences and order but also on the absolute magnitudes relative to a fixed zero.

  4.  **What You Owe If You Keep Step (1):** Step (1) is strong: a principle shouldn't change its verdicts based on mere representational choices (like re-zeroing) that don't affect the underlying reality (people's lives). Since Step (3) shows prioritarianism *does* violate Step (1), and Step (2) seems plausible, **you must defend a fixed, non-arbitrary zero point for well-being as part of your prioritarian theory.** You cannot treat the zero as conventional; it must be a real feature of well-being that the weighting function responds to. This is the core commitment prioritarianism incurs to avoid the re-zeroing objection.

  5.  **Is "Life Not Worth Living" the Principled Zero? (Defending a Position)**
      *   **Yes, it's the most defensible candidate.** The point of "a life not worth living" (W=0) – where the positive and negative experiences precisely balance out such that nonexistence is just as good – provides a plausible, objective(ish) anchor. It's not merely conventional; it reflects a significant qualitative boundary in possible lives. Below it, life is net bad; above it, life is net good. This resonates with how we intuitively think about well-being and priority (e.g., giving priority to lifting people *out* of misery).
      *   **Does it fully solve the objection? Mostly, but shape matters.** Naming the zero *directly addresses the re-zeroing vulnerability*. If 0 is fixed at "neutral," then adding a constant `C` to everyone *isn't* a "mere re-zeroing" – it's *actually making everyone's life better* by `C` units! This change *does* affect how well off people are. In your advisor's example, moving from `(1, 100)` to `(401, 500)` isn't a recalibration; it's a massive improvement in everyone's life. It's *no surprise* that prioritarian verdicts might change significantly when the absolute position relative to the neutral point changes so dramatically. The initial comparison (`A` vs `B`) was between lives all above neutral; the shifted comparison (`A'` vs `B'`) is between lives *way* above neutral. The weighting function (square root) treats gains far above neutral very differently than gains near neutral – which is the *point* of prioritarianism.
      *   **The Shape Relocation:** The objection doesn't disappear; it relocates to justifying the *shape* of the weighting function *given the fixed zero*. Why square root? Why not logarithmic? Why not a different degree of concavity? Why not a function that plateaus? The debate shifts to the ethically defensible curvature of priority weighting *anchored at the neutral point*. This is a substantive but necessary debate for the prioritarian. You need to argue why your chosen function best captures the moral imperative to give priority to the worse off, relative to the fixed benchmark of a life barely worth living. This is challenging but conceptually coherent.

  **Conclusion:** Your gut is right. Step (5) is the weak link. The advisor's argument wrongly assumes that *all* normative theories using well-being quantities are vulnerable to re-zeroing in the way prioritarianism is. Utilitarianism and many other core views are invariant because they only require an interval scale. Prioritarianism uniquely requires a ratio scale. To save prioritarianism while keeping step (1), you **must** commit to a non-arbitrary zero point for well-being. The "neutral life" point is the strongest candidate. This anchors the theory and relocates the debate to justifying the specific shape of the priority-weighting function relative to that fixed zero. Don't abandon step (1); reject the overgeneralization in step (5) and embrace the commitment to a real zero that your weighting function depends upon.
