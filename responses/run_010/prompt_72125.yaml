prompt: |-
  Im teaching a political ethics seminar next term and I want to build a unit on the problem of dirty hands around Spielberg's Lincoln (2012, the Kushner script), but I've started to worry the film is actually a bad vehicle for Walzer's argument and I can't quite say why. Help me work it out.

  The reading I want goes like this. Walzer's 1973 paper isn't just the familiar claim that leaders sometimes have to do lesser evils — everyone says that. The distinctive bit is that the one who does them should still be guilty: the guilt is what keeps the act wrong rather than merely costly, and a politician who feels fine about it is a monster, not a hero. So my working diagnostic, which you're welcome to attack, is what I'll call the residue test — does the story leave the agent morally worse off after the plan succeeds, in a way the success doesnt wash out?

  Run the film against that test on each of its dirty pairs of hands, and tell me whether the film even notices that they're different cases. There's Lincoln's carefully worded answer to the House about whether there are peace envoys waiting outside Washington. There's Stevens moderating himself on the floor, getting pressed about the woman he lives with, and whatever he does once he's home. There's the lobbyists Seward puts on the payroll to buy lame-duck votes with the promise of federal jobs. My hunch, which may be flat wrong, is that the film gives Stevens a genuine residue scene and gives Lincoln almost none — so we end up with a Walzerian congressman and a straightforward consequentialist president, which is a weird inversion of who the audience is supposed to admire. Also: there's the scene where Lincoln works through whether the Emancipation Proclamation was itself a stretch of his war powers. Does that count as residue, or is it just him explaining his calculus and kind of enjoying it?

  Second thing, and this is the one I actually care about. Walzer's paradigm seems to be a single ruler deciding alone in a room. This film is about a coalition — Blair, Seward, the lobbyists, the Democrats Stevens has to soften himself for, the Radicals he has to keep quiet. If the wrong is spread across all of them, whose guilt is it? Can dirty-hands theory handle a collective agent at all, or does it quietly need one pair of hands to stay intelligible? I keep feeling the film solves this by dumping the entire moral burden onto a single man in the final act, and that's a cheat, but I can't tell if it's a cheat the theory licenses.

  Third, the counterfactual. If the lie about the envoys had come out and the amendment had lost, would that be a better dirty-hands film or just a tragedy? What does your answer say about whether dirty hands is a real category distinct from ordinary lesser-evil reasoning, or whether its just consequentialism with bad lighting?

  Optional thread if you have room: Williams wrote about this too, in Politics and Moral Character, and my sense is he thinks the Walzer version lets a politician enjoy his own guilt as a kind of luxury good. If that's a fair reading of him, which of the two does the film side with, and does it matter alot for how I'd teach it?

  Finally — and be blunt here — does the film do anything for the dirty-hands debate that argument alone can't do? I mean something specific: whether seeing guilt distributed, absorbed, or refused across a bunch of people teaches you something the papers can't. If the answer is no and it's just illustration, say so, because then I'll swap it out for something else.

  Don't quote the film or Walzer verbatim; I don't need line-level accuracy and I know you can't check a script. But do tell me which scenes you'd screen and which you'd skip, and be honest about where the film resists the reading. I'd much rather find that out now than in week six.
reasoning: |-
  Okay, I need to help a professor prepare for a political ethics seminar focused on Walzer's "dirty hands" concept using Spielberg's *Lincoln*. They're worried the film might not be a good fit and have specific questions.

  First, the professor's main concern is whether the film passes the "residue test" - does it show characters carrying moral guilt after their ethically questionable actions succeed? They suspect Lincoln gets off too easy while Stevens bears the burden, creating an odd dynamic. 

  Looking at the cases: Lincoln's lie about peace envoys seems consequence-free for him personally. His legal justification of the Emancipation Proclamation comes across as intellectual rather than anguished. Stevens, however, clearly suffers when moderating his racial equality stance and in his painful home scene. This imbalance does undermine Walzer's core idea that guilt must linger.

  Second, the collective action problem is fascinating. The film spreads the dirty work across many characters (lobbyists, politicians, Lincoln himself), but ultimately centers the moral burden on Lincoln alone. This exposes a weakness in Walzer's theory - it struggles with distributed responsibility. The film's narrative cheat reflects a real philosophical gap.

  Third, the counterfactual question reveals something important: if Lincoln's lie had failed, we'd view it as mere bad judgment rather than a necessary evil. This blurs Walzer's distinction between dirty hands and regular consequentialism. The film's happy ending accidentally weakens the case for "dirty hands" as a unique category.

  On Williams' critique: the film leans toward his view by making Lincoln's burden seem noble rather than truly corrosive. His weary dignity aestheticizes guilt, turning it into what Williams called a "moral holiday."

  For teaching utility, the film excels at showing collective action dynamics but fails at personal guilt portrayal. Key scenes: Stevens' self-betrayal in Congress and his home anguish demonstrate residue; Lincoln's cabinet scenes show coalition-building; skip his post-vote saintly moments. The film's best contribution is visualizing how guilt circulates in systems - something texts struggle with.

  Recommendation: Keep it for coalition dynamics but pair with a reading critiquing individual-focused models. Maybe add *A Few Good Men* for clearer residue, or *Trumbo* for collective action. The film's flaws make it pedagogically valuable if framed correctly - it shows where Walzer's theory creaks.
answer: |-
  Here's a breakdown addressing your concerns, structured around your diagnostic tests and core questions:

  **1. The Residue Test & Character-Specific Failures:**
  *   **Stevens (Radcliffe):** Passes Walzer's test definitively. His scene moderating his views on racial equality is visibly agonizing. The subsequent home scene with Lydia Smith (where he either embraces her publicly or reaffirms their bond - interpretations vary) shows the *personal cost* of his political compromise. The victory doesn't erase his shame or the betrayal of his deepest principles. The residue is palpable.
  *   **Seward & the Lobbyists (Strathairn/Gordon-Levitt/Hawkes):** The film treats this as pragmatically necessary, almost farcical horse-trading. Seward expresses distaste but no profound guilt. The lobbyists are amoral operators. There's minimal residue presented; it's depicted as the grubby *cost* of politics, not a *moral wrong* leaving a stain. They feel like consequentialists doing a job.
  *   **Lincoln (Day-Lewis):**
      *   **The Envoys Lie:** This is the critical failure for Walzer. Lincoln lies deliberately. While he shows discomfort *during* the lie (careful wording, visible tension), the film provides **zero residue post-success**. His subsequent scenes are statesmanlike, weary, fatherly, or focused on other matters (e.g., Tad at the theatre). The lie isn't revisited; its moral weight vanishes with the amendment's passage. He feels consequentialist relief, not Walzerian guilt.
      *   **Emancipation Proclamation Justification:** This reads as Lincoln wrestling with *legality* and *pragmatism*, not morality. He argues from necessity and constitutional interpretation ("war powers"). His tone is often intellectually engaged, even relishful in the cleverness of the argument ("I felt the earth move!"), not burdened by the inherent *wrongness* of potentially exceeding authority. It's a defense, not a confession of wrongdoing needing atonement. **Not residue, just calculus.**

  **Diagnosis:** Your hunch is correct. The film inverts Walzer. The "hero" Lincoln emerges morally unscathed by his dirty act (envoys lie), feeling only the weight of leadership, not guilt. The compromised idealist Stevens bears the true Walzerian burden. This undermines using Lincoln as Walzer's archetypal dirty-hands leader. The film celebrates Lincoln's *effectiveness* despite the lie, not his *guilt* because of it.

  **2. Collective Action & the Burden Problem:**
  *   **The Spread:** The film brilliantly depicts the distributed nature of the "dirt": Blair's peace mission, Seward's patronage, the lobbyists' bribes, Stevens's self-censorship, Lincoln's lie, even Mary's political pressure.
  *   **The Cheat:** You're right. The film *does* cheat by ultimately concentrating the moral and narrative burden onto Lincoln alone in the final act. His weary solitude, the weight of the war/death, the domestic scenes – they absorb the diffuse ethical costs incurred by the whole coalition. Seward relaxes, Stevens is vindicated, the lobbyists celebrate. Lincoln becomes the sacrificial vessel.
  *   **Walzer's Theory & Collectives:** Walzer's framework struggles profoundly here. His paradigm *is* the solitary leader (like Weber's ethic of responsibility). He doesn't adequately address:
      *   **Diffusion of Guilt:** When responsibility is shared, does guilt dilute? Can it be collective? Walzer implies guilt is personal.
      *   **Hierarchy & Agency:** Is the guilt the same for Lincoln (who orders/approves), Seward (who implements), and Bilbo (who offers jobs)? Walzer doesn't scale well.
      *   **Narrative Necessity vs. Philosophy:** The film cheats because narrative craves a focal point. Walzer's theory, focused on individual conscience, *licenses* this cheat by centering the ultimate decision-maker. The film exposes a genuine limitation: Walzer's theory **does** implicitly rely on a single, identifiable pair of hands bearing the primary guilt to remain dramatically and ethically intelligible. Distributed guilt feels less tragic, more bureaucratic.

  **3. The Counterfactual & Walzer's Distinctiveness:**
  *   **If the Lie Failed:** It would likely feel like **tragic consequentialism**, not a true dirty-hands story. We'd see it as a *miscalculation* – the wrong *means* failed to achieve the good *end*. The "dirt" wouldn't be justified. The *necessity* of the wrong act for the *achieved* good is crucial for Walzer. Failure retroactively makes the act just wrong, not tragically necessary.
  *   **What This Reveals:** This highlights that Walzer *is* distinct from pure consequentialism. Consequentialism judges solely by outcomes. Walzer insists the act remains *wrong* even when necessary and successful, requiring guilt. The counterfactual test shows that for Walzer, the *success* is what creates the tragic paradox of justified-yet-guilty action. Without the success, it's just a bad (or failed) deed. The film's *actual* ending (success, no Lincoln guilt) pushes it towards consequentialism ("the ends justified the means, move on").

  **4. Williams & the "Luxury Guilt" Critique:**
  *   **Williams' Point:** Yes, Williams worried Walzerian guilt becomes a self-indulgent performance, a "moral holiday" letting the politician feel virtuous *for* feeling guilty, while still wielding power. It aestheticizes the burden.
  *   **The Film's Alignment:** The film arguably **sides with Williams' critique, *especially* regarding Lincoln.** His weariness and solitude *are* presented as noble burdens, the marks of a great leader. The audience is meant to admire his sacrifice, *including* the weight he carries. The guilt (such as it's shown) is part of his heroic stature. Stevens' guilt feels raw and personal; Lincoln's feels like a dignified, almost beautiful, cost of office. This matters for teaching: the film risks validating Williams' critique – Lincoln's "burden" *is* part of his admirable mythos, potentially a luxury of the powerful.

  **5. The Film's Pedagogical Value (Be Blunt):**
  *   **What it DOES uniquely well:** It **viscerally demonstrates the collective machinery of dirty hands.** Arguments struggle to show the *network* of compromise: the idealist (Stevens) silencing himself, the operator (Seward) hiring fixers, the fixers (lobbyists) trading favors, the leader (Lincoln) lying. It shows how the "dirt" spreads through a system pursuing a just end. This is invaluable for understanding the *practical reality* beyond Walzer's solitary figure.
  *   **What it FAILS at:** It fails dramatically to depict the **persistent, personal guilt** that is Walzer's hallmark, *especially* for the central figure. Lincoln's residue is aestheticized burden, not moral guilt. It also cheats by centralizing the burden.
  *   **Verdict:** **Keep it, but frame it critically.** It's not a perfect Walzer vehicle, but its strengths are significant and hard to replicate with text alone. Its flaws are *equally* teachable moments:
      *   Why does the narrative resist showing Lincoln's guilt?
      *   Does the collective action dilute or complicate Walzer?
      *   Does the film validate Williams' critique?
  *   **Use it to show:** The systemic nature of political compromise, the different *types* of moral cost borne by different actors (Stevens vs. Seward vs. Lincoln), and the tension between Walzer's ideal and political narratives that often sanctify leaders.

  **Screening Strategy (Focus on Walzer Dynamics):**
  *   **SHOW:**
      1.  **Stevens' Self-Betrayal Speech & Aftermath:** The core Walzerian residue.
      2.  **Seward Hiring the Lobbyists & Their Methods:** Illustrates distributed dirty work, consequentialist pragmatism.
      3.  **Lincoln's Envoys Lie Scene:** The act itself and its immediate tension.
      4.  **Key Coalition-Building Scenes:** Show the collective effort (e.g., Lincoln pressuring Blair, managing radicals/conservatives).
      5.  **Lincoln's Solitude/Weariness Post-Vote:** To discuss the concentrated burden vs. absence of guilt (contrast with Stevens).
  *   **SKIP (or summarize):**
      1.  Extensive battlefield scenes (distract from political ethics focus).
      2.  Overly long family dramas (Tad, Mary's meltdown - unless specifically linking Mary's pressure to Lincoln's burden).
      3.  The very end (Lincoln's assassination foreshadowing/mythologizing).

  **Conclusion:** *Lincoln* is a flawed but valuable Walzer vehicle. Its core flaw (Lincoln's lack of post-lie guilt) is a major deviation, but its strength lies in depicting the *collective generation* of dirty hands in a complex democracy. Use its imperfections to spark debate: Why *doesn't* Lincoln feel guilty? Does spreading the dirt absolve individuals? Does the film aestheticize the leader's burden? This critical tension makes it potentially *more* engaging for seminar discussion than a perfect, on-the-nose illustration. Pair it explicitly with critiques of Walzer (like Williams) and discussions of collective responsibility.
