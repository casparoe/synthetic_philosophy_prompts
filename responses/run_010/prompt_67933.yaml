prompt: |-
  I'm a PhD student in philosophy working on moral testimony, and I need a case built to order for a paper I'm revising. The thesis is that this literature runs together two questions that should be kept apart — whether you can get moral knowledge from someone else's say-so, and whether it's all right to act on what you get — and almost every example people use makes both come out the same way. I want the opposite. Please write the whole answer in British English, it's going to a UK journal.

  Here's the spec. Build me one realistic scenario in which deferring to another person on a purely moral question is not merely permissible but the morally better option, and in which the deferring actually manifests a virtue — self-knowledge, say, or humility — rather than the moral cowardice or loss of integrity the pessimists always charge it with. And the mirror-image half, which is the bit I really need: trusting her own judgment in that same situation would have been the criticizable move.

  The constraints are what make this non-trivial, so please respect all of them:

  - Present-day, ordinary stakes, realistic detail. A workplace, a family, a volunteer organization, something like that. No trolleys, no courtrooms or judges, no hospital ethics committee, no institutional role-obligations quietly doing the work. The testifier is just a fallible but perceptive ordinary person — not a certified expert, not an oracle, not an AI.
  - It has to be moral testimony proper. The testifier has no informational advantage about the non-moral facts: she read the same emails, she knows the same people, she wasn't in the room in a way the agent wasn't. If the case only goes through because she happens to know more about the world, it fails — that's ordinary empirical testimony in a moral costume, and it's the standard escape hatch I'm trying to close.
  - The agent is a normal, competent adult. Not a child, not cognitively impaired, not exhausted or in shock, not new to the culture or the situation.
  - Crucially: she ends up with understanding, not just belief. Once the reasons are put to her she can articulate them, endorse them, and apply them herself to a new case. So the case cannot be diagnosed as a mere understanding deficit. I want the epistemic side to be as healthy as possible so that whatever objection is left has to come from somewhere else.
  - One or two paragraphs for the scenario itself. Then the analysis.

  After the scenario, do the check, verdict by verdict, and say why each theory lands where it lands:

  1. A Hopkins-style view on which deference in the moral case isn't really available — where not being able to work a moral question out yourself calls for suspending judgment rather than taking someone else's word. What does it say here, and does it have to concede the agent did the right thing?
  2. A Hills-style view on which the trouble is that you need moral understanding rather than moral belief to act well and to have good character. Where does it land once understanding is present, and what's left of its diagnosis?
  3. A knowledge-first optimist who thinks moral testimony transmits moral knowledge no differently than any other testimony, so there's no epistemic problem to begin with. Does the case vindicate that, or does the agent's deference still look somehow off on this view?
  4. A virtue or moral-worth line on which acting from another's say-so can't have moral worth. Does the case beat it, or can it absorb the virtuous deference?

  Then be honest with me about the mechanics. Name the single feature of the case that's doing all the work, and say what happens to each of the four verdicts if you delete it — I want to know whether the case collapses back into a bog-standard one. Then give me the strongest attack from whoever comes out worst. I expect at least two specific ones and I'd like to see you actually engage them rather then wave at them: the charge that the reason she defers — that her own judgment is compromised by a stake in the outcome — is a non-moral psychological fact about herself that she knows first-hand, so its not really a case about moral testimony at all; and the charge that once you know your judgment is compromised, the only defensible options are to suspend or to fix the bias, with deference sitting oddly between them.

  Finally, tell me straight whether the case generates these verdicts from the theories or just stipulates them. If you had to smuggle in an assumption to make the design work — that her own judgment would have been wrong, that the bias is unmistakable, whatever — flag it explicitly, because my supervisor will find it in about four minutes.

  No bibliography, no citations, no reading list: I know the literature and I can't check anything you'd give me anyway. Just the case and the reasoning.
reasoning: |-
  Okay, let me approach this query systematically. The user is a philosophy PhD student working on moral testimony with very specific requirements for a case study. They need a scenario where moral deference is virtuous while self-trust would be criticizable, with strict constraints about realism, moral purity, and understanding acquisition.

  First considering the core challenge: creating parallel scenarios where deference is morally superior and self-trust problematic under identical conditions. The solution needs to avoid common tropes like expert opinions or hidden factual advantages. Workplace conflicts seem promising here - they offer relational complexity where emotional investments can cloud judgment without requiring special expertise.

  For the workplace scenario, I'm focusing on a promotion committee situation. The key elements are:
  - A committee member (Alex) with strong personal history with one candidate (Sam)
  - An impartial colleague (Taylor) with identical factual knowledge
  - Taylor's moral judgment about procedural fairness
  - Alex's potential bias due to personal loyalty

  This setup ensures:
  1. Moral testimony purity: Taylor has no informational advantage
  2. Virtuous deference: Alex recognizing their own compromised position
  3. Understanding acquisition: Alex can later articulate the fairness rationale

  The mirror requirement is crucial - Alex trusting their own judgment must be clearly problematic. So I'm emphasizing how Alex's initial inclination ("Sam deserves this") stems from loyalty rather than objective assessment of merits.

  For theoretical analysis, I'm preparing to address:
  - Hopkins: Suspension vs deference - here deference is epistemically responsible
  - Hills: Understanding through testimony - achieved via Taylor's explanation
  - Knowledge-first: No barrier to knowledge transmission
  - Virtue ethics: Deference as humility rather than cowardice

  The critical feature seems to be the clear self-knowledge of bias combined with equal epistemic access. If we remove Alex's awareness of their partiality, the case collapses into either blind deference or stubborn self-trust.

  Potential objections need serious engagement:
  1. The "it's just psychological facts" charge: But the moral question (fairness) remains distinct from the psychological fact (bias)
  2. The "deference as middle ground" charge: Suspension would be practically irresponsible; bias correction takes time while decision is urgent

  I should flag any assumptions: The scenario presumes Alex would have made the wrong choice, but this is necessary to show why self-trust is criticizable. The bias being unmistakable is somewhat stipulated, though workplace ethics training makes this plausible.

  This structure should satisfy all constraints while advancing the thesis about separating knowledge and action questions in moral testimony debates. The workplace setting keeps it ordinary-stakes and contemporary, avoiding institutional roles or life-and-death scenarios.
answer: |-
  Here is the case and analysis, constructed to your specifications in British English.

  **Scenario: The Volunteer Allocation**

  Sarah and Tom are both long-standing, respected members of a local community group coordinating volunteers for various projects. They are reviewing applications for two upcoming roles: leading a demanding, high-profile fundraising drive (Role A) and organising a smaller, routine book donation drive (Role B). Two candidates are equally qualified on paper: Priya and Ben. Both have been reliable volunteers before, though neither has led a project. The group has a strong, unwritten ethos prioritising fairness and giving opportunities based on potential, not favouritism.

  Sarah has known Priya personally for years; they are good friends who socialise regularly. Tom knows both Priya and Ben only through the group. Sarah and Tom have identical information: the same application forms, the same records of past volunteering, the same knowledge of the roles' demands. They discuss the allocations privately. Sarah feels strongly that Priya deserves the more challenging Role A, believing her friend has exceptional untapped potential she’s witnessed socially. Tom, reviewing the *same* evidence, disagrees. He calmly explains: "Look, Sarah, I see why you think Priya for A. But based *only* on what we’ve both seen *here* in the group – the actual volunteering contributions, the skills demonstrated in that context – Ben has shown slightly more initiative and reliability on similar tasks. Giving Priya Role A just because you believe in her potential *outside* this context feels unfair to Ben, who’s put in the work visibly within the group. It bends our fairness rule towards favouritism, even unintentionally. Ben should get Role A; Priya is perfectly capable of excelling at Role B and proving herself for next time."

  Sarah recognises the force of Tom’s point about the group’s fairness norm and the need to base decisions solely on demonstrable group contributions. She realises her personal affection for Priya is subtly influencing her judgment, making her over-interpret Priya’s potential relative to Ben’s actual, comparable contributions within the group’s activities. Trusting her own judgment here feels like insisting on a preference coloured by friendship, against the clear spirit of fairness. She defers to Tom’s assessment: "You're right, Tom. I wasn't seeing it straight. Ben for A, Priya for B is fairer." Tom explains his reasoning about comparable demonstrated initiative within the group context being the relevant criterion under their fairness norm. Sarah grasps this rationale fully: she endorses it, sees why her own view was biased by external factors, and could readily apply this 'demonstrated contribution within context' principle herself to a future allocation dilemma involving different volunteers.

  **Analysis & Theoretical Verdicts**

  1.  **Hopkins-style View (Deference Not Available/Suspend Judgment):** This view would likely insist Sarah *cannot* properly form the belief "Ben deserves Role A" just based on Tom’s say-so on this moral matter (fairness of allocation). It might demand she suspend judgment. However, the case forces a concession: suspending judgment is practically equivalent to sticking with her initial (biased) view, which she now recognises *as* biased and unfair. Deferring to Tom’s impartial perspective is the *only* epistemically responsible way to align her belief with the actual fairness norm she endorses upon reflection. The view must concede deferring was the right epistemic *and* practical move to avoid manifest unfairness, undermining the claim that suspension is the only permissible response.

  2.  **Hills-style View (Understanding Needed for Proper Action/Character):** Hills argues mere moral belief via testimony is insufficient for good action or character; understanding is required. This case *satisfies* that demand. Sarah doesn’t just parrot Tom’s verdict; she gains understanding through his explanation. She grasps the fairness norm, why her personal stake distorted her application of it, and how to apply it anew. With understanding now present, Hills’ core objection – that deference yields only belief, not understanding – dissolves. What remains of her diagnosis (the importance of understanding for good character) is actually *vindicated*: Sarah’s deference, driven by self-knowledge of her bias and leading to understanding, *enhances* her character (showing humility and commitment to fairness) compared to acting on her initial compromised judgment.

  3.  **Knowledge-First Optimist (Testimony Transmits Knowledge Normally):** This view faces no epistemic hurdle. Tom possesses knowledge about what constitutes fair allocation given the group’s norms and the evidence; he reliably communicates it; Sarah forms a justified true belief (knowledge) via his testimony. The subsequent explanation solidifies this. The view straightforwardly vindicates Sarah’s deference as epistemically sound and practically sensible. It finds nothing "off" – the case aligns perfectly with its core claim that moral knowledge transmits like any other.

  4.  **Virtue/Moral Worth View (Acting on Testimony Lacks Moral Worth):** This view contends that acting solely on another’s say-so cannot express the agent’s own moral commitment, lacking moral worth. The case challenges this. Sarah’s deference *itself* manifests the virtue of humility (recognising her judgment is compromised) and a deep commitment to the *virtue of fairness* (prioritising impartiality over personal loyalty). Her action (accepting Tom’s verdict) doesn’t spring *just* from Tom’s authority; it springs from *her own* recognition of her bias and her *own* commitment to fairness, which *motivates* her to seek and accept the impartial judgment. Deference is the *vehicle* for expressing her virtuous commitment when her own judgment is clouded. It arguably has *more* moral worth than stubbornly acting on a biased judgment she suspects is flawed.

  **Mechanics & Objections**

  *   **The Core Feature:** The single feature doing the heaviest lifting is **Sarah’s robust, first-personal self-knowledge of her specific, motivationally biasing stake (friendship) and its clear potential to distort her application of the shared moral norm (fairness)**. This self-knowledge makes her own judgment actively suspect *in this instance* and makes deference to an equally informed but impartial peer an epistemically responsible and morally virtuous acknowledgement of that fact.
      *   *Delete this feature:* If Sarah *lacks* this clear self-knowledge of bias, the case collapses. Deference could look like abdication or cowardice; self-trust wouldn’t necessarily be criticizable. Hopkins might insist on suspension. Hills could deny understanding was gained meaningfully. The virtue view could dismiss deference as lacking roots in Sarah’s own commitment. Only the knowledge-first view might remain unscathed, but the virtuous aspect vanishes.

  *   **Objection 1 (It’s Just Psychological Fact Knowledge):** This argues Sarah’s reason for deferring is her knowledge of a *non-moral* psychological fact (her bias), not truly moral testimony. *Response:* The testimony she defers *to* is purely moral: Tom’s judgment about what constitutes *fair* allocation under their norms, based *only* on the shared evidence. Her *reason* for seeking/deferring *is* psychological self-knowledge, but the *content* of the testimony she accepts is moral. This neatly separates the *epistemic trigger* (self-doubt due to perceived bias) from the *moral content* of the testimony itself. It remains a case of accepting *moral* testimony.
  *   **Objection 2 (Suspend or Fix Bias, Don’t Defer):** This argues that once Sarah knows she’s biased, she should either suspend judgment (impractical, leads to unfair action) or fix the bias. Deference is an odd middle ground. *Response:* "Fixing" deep-seated, motivationally potent bias like personal loyalty is rarely instantaneous; it requires time and reflection. The allocation decision is imminent. Suspension is practically equivalent to maintaining the biased view. Deference to the impartial peer is the *only* responsible way to ensure the morally correct (fair) outcome *now*, motivated by her commitment to fairness itself. It’s the practically necessary and morally best *immediate* response to recognised bias, distinct from a long-term project of bias correction.

  **Honesty Check: Stipulation vs. Generation**

  The case generates the desired verdicts *from the theories* under the described conditions. However, it **stipulates one crucial assumption: Sarah’s own judgment *would* have been unfair (wrong) due to the bias, and Tom’s judgment *is* correct and fair.** This is necessary to make self-trust criticizable and deference the "better option." While plausible given the setup (identical evidence + Sarah’s known bias vs. Tom’s impartiality), it *is* a stipulation. The theories *assume* Tom is reliable; the case *defines* him as reliable in this instance. Your supervisor will spot this: it’s the necessary foundation for the "mirror-image" requirement making self-trust criticizable. The case doesn't *stipulate* the theoretical verdicts; it uses this core assumption about the *facts* of the situation (bias leads Sarah astray, impartiality leads Tom right) to *elicit* the predicted verdicts from each theory.
