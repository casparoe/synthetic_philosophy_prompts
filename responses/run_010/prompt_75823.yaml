answer: |-
  # Research Proposal: Admissible Orderings and the Foundations of Gamble Ranking in the Pasadena Paradox  

  ## The Core Research Question  
  When evaluating a gamble whose payoff sequence forms a conditionally convergent series (like the Pasadena game), which orderings of its outcomes are *admissible* for constructing a transitive, dominance-respecting ranking relative to other gambles? Specifically:  
  1.  Can "admissibility" be defined rigorously without presupposing a specific summation rule (e.g., temporal order, Cesàro mean)?  
  2.  Does restricting to admissible orderings yield a *unique* ranking (even if not a unique real-valued expectation), or a non-trivial, informative set of possible rankings?  
  3.  Can such a ranking satisfy dominance (if gamble A pays at least as much as B in every state, A is weakly preferred) and transitivity, while accommodating cases where the standard expectation is undefined?  

  A piece of work answers this question if it provides:  
  *   A formal characterisation of the set of admissible orderings for a gamble (e.g., based on causal structure, information availability, or decision context).  
  *   Proofs concerning the properties (transitivity, dominance, uniqueness/non-uniqueness) of the induced gamble ranking derived from expectations calculated over this restricted set.  
  *   Application to the Pasadena game and similar paradoxes, demonstrating whether the admissible set yields a determinate ranking or a usefully constrained set of possible values/rankings.  

  ## Why Existing Approaches Fall Short  
  The standard responses to the Pasadena paradox fail to address the core question of *which orderings matter for decision-making*:  
  *   **Truncation & Limit:** Privileges the temporal ordering implicitly without justification. Why is taking N→∞ *in that order* the correct procedure?  
  *   **"No Expectation":** Correctly identifies the problem but leaves decision-makers without guidance for comparing such gambles, ignoring the possibility of robust *comparative* judgements.  
  *   **Comparative Expectations:** Often presupposes a background ordering or relies on pairwise comparisons that may not compose transitivity for complex sequences. They avoid specifying *how* the comparison is made given the ordering sensitivity.  
  *   **Pathology Dismissal:** Evades the normative challenge the paradox poses for the foundations of decision theory under uncertainty.  

  These positions either arbitrarily fix an ordering (truncation), abandon the quest for a ranking ("no expectation"), or fail to engage with the *source* of the indeterminacy (comparative, pathology). None systematically explore which orderings are decision-theoretically relevant.  

  ## Proposed Work Plan (4 Months)  
  *   **Month 1:** **Formalise Admissibility Concepts & Toy Cases.**  
      *   Define candidate admissibility criteria (e.g., temporal order of revelation, "natural" description order, orders respecting dominance chains).  
      *   Analyse simplified variants: 2-3 outcome St. Petersburg hybrids; finite gambles with conditionally convergent "sub-components". Establish baseline properties.  
  *   **Month 2:** **Develop the Ranking Framework & Test on Pasadena.**  
      *   Construct a formal model for gamble representation incorporating admissible orderings.  
      *   Define the induced ranking rule: e.g., "Gamble A ranks above B if E[A] > E[B] for *every* admissible ordering".  
      *   Apply rigorously to the Pasadena game under different candidate admissibility sets (e.g., temporal only; temporal + isomorphic rearrangements).  
  *   **Month 3:** **Explore Properties & Generalisation.**  
      *   Prove or disprove: Does dominance hold? Is the ranking transitive? Does restricting admissibility collapse the value set?  
      *   Test the framework against related paradoxes (e.g., the Altadena game, other weakly convergent series gambles).  
      *   Investigate robustness: Does adding small, well-defined gambles disrupt the ranking?  
  *   **Month 4:** **Synthesise Results & Address Circularity.**  
      *   Finalise theorems characterising when admissible orderings yield unique/determinate rankings.  
      *   Confront the circularity worry: Can admissibility be motivated independently of desired summation properties?  
      *   Draft chapter: "Beyond Expectation: Admissible Orderings and Gamble Ranking".  

  ## Deliverable: A Positive Result  
  Success would be a **theorem** demonstrating:  
  *   Under a well-motivated, non-circular definition of admissible orderings (e.g., "orders respecting the temporal sequence of state resolution"),  
  *   The induced ranking rule (e.g., A ≻ B iff E[A] > E[B] for all admissible orderings) is transitive and respects statewise dominance,  
  *   And for the Pasadena game (and significant class of similar gambles), this yields a *unique* ranking relative to key comparators (e.g., constant sums, Altadena) *or* a non-trivial interval of expectation values providing a partial ordering.  

  This would show the money was well-spent by providing a novel, rigorous foundation for comparing pathologically convergent gambles, moving beyond the "no expectation" impasse.  

  ## Failure Modes & Mitigation  
  *   **Collapse to Single Value:** If only one ordering (e.g., temporal) is admissible, the approach may reduce to truncation. *Mitigation:* Explore broader admissible sets (e.g., orders preserving event dependencies).  
  *   **Intransitivity/Dominance Failure:** If the ranking rule violates core axioms, it fails as a decision tool. *Mitigation:* Focus on weaker ranking rules (e.g., A ≻ B only if E[A] > E[B] for *all* admissible orderings).  
  *   **"No Expectation" Collapse:** If the admissible set still allows expectation to take any real value, the approach concedes the critic's point. *Mitigation:* Identify structural properties of gambles that constrain the admissible set sufficiently.  
  *   **Circularity Trap:** If admissibility relies on the summation rule it aims to justify, the project fails. *Mitigation:* Base admissibility on pre-theoretic concepts like causal structure or information flow.  
  Failure will be declared if Month 3 shows insurmountable issues with dominance, transitivity, or circularity, or if no non-trivial constraint on expectation values emerges for Pasadena.  

  ## Why the Statistician Should Care  
  While the Pasadena game is idealized, the core problem – ranking gambles where standard expectation fails due to extreme tail behaviour or ordering sensitivity – arises in realistic sequential decisions with unbounded (or very heavy-tailed) potential outcomes. Examples include: long-term R&D investments with highly uncertain, path-dependent payoffs; certain types of insurance liabilities with catastrophic tails; resource allocation under deep uncertainty about cascading effects. A robust, axiomatically sound method for generating *comparative* rankings in such cases, even when a unique dollar-valued expectation doesn't exist, provides practical guidance where current tools (relying on convergent expectations) are silent or arbitrary. This project seeks to develop precisely such a tool, grounded in decision-theoretic principles rather than mathematical convenience.  

  ## Scope Management  
  The core focus is developing the admissible ordering concept and its application to the Pasadena/Altadena cases to demonstrate feasibility. Key priorities if trimming is needed:  
  1.  **Limit Toy Cases:** Focus only on the most revealing simplified variants.  
  2.  **Defer Generalisation:** Postpone deep analysis of broader paradox classes beyond Pasadena-type series.  
  3.  **Simplify Ranking Rules:** Initially explore only the most straightforward rule (e.g., unanimous expectation over admissible orderings).  
  4.  **Reduce Formal Generality:** Focus on discrete, finite-state (but potentially unbounded) gambles with specified resolution sequences.  
  Essential: Formal analysis of Pasadena under at least two distinct admissibility criteria and the core axiom checks.  

  \answer{fits comfortably}
