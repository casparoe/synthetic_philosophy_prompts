prompt: |-
  I'm not an academic and I have no way to look anything up, so I'd like you to reason this through with me rather than point me toward sources. I've been working on the colour-phi case on my own and I've hit a wall.

  First, let me set out what I take to be the facts — please correct me if any of it is wrong, because everything I'm asking for depends on it. Two small spots of different colours, green and red say, are flashed one after the other a few degrees apart on a screen, with an interval well under a second between them. People don't report two separate flashes. They report a single spot travelling from the first position to the second and changing colour somewhere along the way. The trouble is that which colour it seems to change into, and roughly where along the path the change seems to happen, depend on information that isn't available until the second spot has already appeared.

  There are, as I understand it, two ways to take this. On the first — the Orwellian one — the subject genuinely goes through an experience of the earlier part of the sequence, and that experience is subsequently overwritten: the archive is edited after the fact, so what the subject ends up reporting is not what they lived through. On the second — the Stalinesque one — the editing is finished before the episode becomes an experience at all: the system waits until it knows how things turn out, and the reconciled version, motion plus a mid-flight colour change, is the only version the subject ever consciously has. The verdict is settled before the trial is staged. And the standard line, as I've seen it put, is that these two are indistinguishable: they agree about everything that happens in the head and when, and differ only about whether a given moment falls on the near side or the far side of experience, so that subjects "should be unable to tell the difference between misbegotten experiences and immediately misremembered experiences."

  My suspicion is that this indistinguishability is not a discovery about consciousness but an artefact of how the case is always presented: one sequence, one subject, one report collected after everything is over. Change when and how the evidence gets produced and the two stories may come apart. I want a case that tests that suspicion.

  Please build me one, to these specifications:

  - It has to be something I could imagine actually running: a room, a monitor, a chair, a button, a voice recorder. No scanners, no implants, no drugs, no surgery, nothing that depends on knowing how the brain implements any of it.
  - The subject is an ordinary untrained adult who is not told which story is being tested. No leading questions, and no design whose only evidence is the subject's later description or drawing of what they saw.
  - The critical trials must still be genuine colour-phi trials — the illusion has to actually occur. You can't buy a divergence by stretching the interval or the separation until the subject simply sees two separate flashes; that swaps the phenomenon instead of probing it. Give me your timings.
  - Both stories must be run through the case on the same physical account. You may not hand one of them a different neurology, a different delay, or an extra mechanism; they are supposed to agree about what happens in the head and when.
  - The divergence has to land on something observable — what the subject says at a particular moment, which button they press, how fast, what they do — and it has to be one the two stories are committed to differently, not one either could absorb by positing a further round of editing.
  - Don't rig it. You may not stipulate that one story is true, and no premise of the design may be one that only that story can accept. Tell me explicitly at the end whether any part of what you built assumes the result.
  - The scenario itself in about three hundred words, with a single sentence up front saying what it is meant to show.

  Then demonstrate that it works:

  - A beat-by-beat timeline with times relative to the first spot. For each beat: what is on the screen, what each story says the subject's experience is at that instant — or that there isn't one yet — and what the subject says or does.
  - The two predictions stated side by side, with the reason each story is committed to its own.
  - The one feature of the design that does the work, named, and then the removal test: what the case collapses back into if I take that feature out.
  - Which of three things you have actually built: a divergence in principle; a divergence that appears only if you assume something about how long the editing can take, in which case name the assumption and say whether it could be checked independently; or no divergence at all. If it is the third, say so plainly and tell me what kind of design would produce one, or why none could.
  - The best defence available to the story that comes out worse — I expect something about reports not being a window onto experience, or about the edited version simply being edited again — and whether that is a real escape or a refusal to be tested.

  If your honest view is that the question is malformed because both stories share a bad picture of how experience works, you may say so, but only after the case is built and you have shown exactly where the malformation bites. I don't want the conclusion offered in place of the design.

  No references, no reading list, no researchers' names. If you need an assumption you can't support, label it as an assumption.
