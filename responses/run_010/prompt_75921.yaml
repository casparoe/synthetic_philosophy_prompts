  Design sketch:
  - We use a sequence of three flashes: two for the standard color-phi (say, green then red) to induce the illusion, and then a third flash that is a probe.
  - The probe is a single spot of either green or red, appearing at a location along the apparent motion path, at a time when the subject is (according to one theory) still having the unedited experience or (according to the other) already having the edited one.
  - The subject's task is to react as quickly as possible to the probe by pressing one button if they see green and another if they see red. We measure reaction time and accuracy.

  Critical idea:
  - In the Stalinesque view, the entire edited experience (a moving spot that changes color mid-trajectory) is constructed before it enters consciousness. So when the probe appears, the subject is conscious of the edited version and the probe. The probe might interfere if it appears during the motion, but the subject should report the probe color accurately, and reaction time might be affected by the ongoing motion.
  - In the Orwellian view, the initial experience is of the first flash (green) and then the second flash (red) without motion or color change (they are separate events). Then, after the second flash, the memory is edited to create the illusion. But during the time between the first and second flash, the subject is having the unedited experience. So if we present the probe during that interval, the subject should react to the probe based on the unedited state.

  However, note the constraint: the interval between the two flashes must be short enough so that the illusion occurs (typically under 100 ms). The probe must be presented in the interval after the first flash but before the second flash. But the subject is in the middle of the first flash and then the probe. How do we avoid disrupting the illusion?

