  ### Scenario
  In a municipal water treatment plant, two equally conscientious technicians, Sam and Taylor, monitor and adjust chlorine levels to ensure safe drinking water. Both care deeply about public health, have stable personal ethics, and underwent identical technical training. The plant serves a large urban area where water quality issues manifest as rare, delayed health effects (e.g., a slight increase in gastrointestinal illnesses months later in statistically vulnerable populations) rather than immediate, visible harm. Today, both are reviewing the daily log: chlorine residuals are within the broad "acceptable" range (0.2–4.0 mg/L) but hover near 0.3 mg/L, the lower threshold for reliable pathogen control. Protocol requires proactive adjustment to maintain a safer 1.0–2.0 mg/L buffer zone, but this involves recalibrating sensors and documenting adjustments—a tedious 15-minute task with no direct feedback. Skipping it causes no observable short-term effects, and the beneficiaries (e.g., immunocompromised individuals) are absent and abstract. Sam, who relies solely on innate empathy and situational conscience, feels no urgency—the abstract risk fails to trigger alarm. Taylor, however, participated in a rigorous 6-month behavioral program simulating outbreaks caused by marginal neglect, with daily ritualized checklists and peer-review sessions that ingrained protocol as automatic, identity-defining practice ("This is who we are"). The variable is the presence or absence of *cultivated ritual discipline* (Taylor has it, Sam lacks it), while holding fixed innate decency, fatigue, and the invisibility/diffuseness of harm.

  ---

  ### Analysis

  1. **Predictions and Reasoning**  
     - **Mencian Prediction (Sam fails):** Mencius holds that moral action springs from innate "sprouts" (e.g., compassion, shame) activated by salient triggers. Here, the harm is invisible, delayed, and diffuse—no immediate victim is present to elicit empathy. Sam, relying solely on spontaneous sprouts, feels no visceral pull to act; the abstract statistical risk doesn’t engage his innate compassion. Fatigue further dulls responsiveness. Thus, the sprouts remain dormant, and Sam skips the adjustment, believing no one is "truly" harmed.  
     - **Xunzian Prediction (Taylor succeeds):** Xunzi argues human nature is raw material shaped by external *li* (ritual/practice). Taylor’s immersive training forged a *cultivated disposition*: the ritualized drills rewired habits, making protocol adherence automatic and satisfying. No situational trigger is needed—the ritual itself generates motivation. Taylor adjusts the levels unthinkingly, finding fulfillment in the act’s intrinsic order, not external rewards. Innate feelings are irrelevant; the ingrained practice overrides passivity.  

  2. **Feature Doing the Work**  
     The **invisibility/diffuseness of harm** combined with **fatigue** prevents spontaneous moral emotions from engaging, while **cultivated ritual discipline** (lacking in Sam, present in Taylor) supplies independent motivation.  

  3. **Effect of Weakening the Key Feature**  
     If harm were visible (e.g., a real-time map showing vulnerable households), Mencius predicts Sam succeeds (sprouts engage), and Xunzi still predicts Taylor succeeds (habit holds). If ritual training were weakened (e.g., Taylor had only Sam’s basic training), Mencius predicts both fail (no trigger), while Xunzi predicts both fail (no cultivated disposition). The reversal depends on the harm’s invisibility *plus* differential training.  

  4. **Strongest Mencian Objection and Cost**  
     **Objection:** Mencius could argue that Taylor’s capacity to internalize ritual *is itself sprout-like*—the "sprout of wisdom" (zhi) allows recognition that training extends innate compassion to abstract cases. Thus, Taylor’s success reflects nurtured sprouts, not external imposition. Sam’s failure stems from underdeveloped sprouts, not their absence.  
     **Cost:** This risks unfalsifiability. If *any* successful cultivation is retroactively deemed "sprout-driven," Mencius cannot be disproven—even when (as here) the motivation arises mechanically from habit, not situational empathy. The theory loses predictive power by absorbing counterexamples.  

  5. **Structural Difference or Difference of Emphasis?**  
     **Structural difference:** The case reveals a core disagreement about moral motivation’s source. Mencius requires *situational activation* of inner resources; Xunzi relies on *pre-emptive ritual shaping* that operates without triggers. A Xunzian cannot accept the Mencian account without conceding that internal sprouts exist—denying this is central to Xunzi’s "human nature is bad" thesis. Conversely, Mencius cannot embrace ritual as the *origin* of goodness without abandoning sprouts as the sole foundation.  
     **Honest assessment:** This is not merely emphasis. The Xunzian *must* reject the Mencian sprout model to explain Taylor’s automated, trigger-independent virtue—it arises from external "accumulation," not innate responsiveness. Conceding otherwise collapses Xunzi’s externalist structure.  

  ---  
  **Final Note:** This scenario isolates the theories’ architectures: Mencian morality is *reactive* (activated by perceived need), Xunzian morality is *proactive* (sustained by ingrained practice). The reversal emerges because invisibility neutralizes reactivity, letting proactive discipline shine.
