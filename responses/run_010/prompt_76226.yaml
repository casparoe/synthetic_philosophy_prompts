prompt: |-
  I teach a senior seminar on transitional justice — 16 students, one 80-minute session near the end of term. They've already done the reading on the South African amnesty process, so I don't need anything that explains what a truth commission is or why the truth-for-amnesty trade was contested. I want an activity that makes them feel one specific thing that I don't think the readings ever spell out plainly: under an individualized amnesty-for-full-disclosure deal, the record a commision ends up with isn't shaped by what victims need acknowledged, it's shaped by each perpetrator's own private estimate of their prosecution risk. So the official truth systematically over-represents exactly the people who were most likely to be caught anyway, and the ones with the best lawyers and the least exposure never have to say anything at all — they're neither convicted nor cleared, they just drop out of the story. Ideally the students run into this through the rules, not through me announcing it.

  So design it. I want the roles and the card content (some private information about prosecution risk, something for the victims, something for the panel that has to decide), the exact procedure and timing so it fits in 80 minutes including debrief, how applicants are incentivized when I can't offer anything but participation credit, what I'd have to prep the night before, and whether the thing still works if three people are absent. Then the debrief: I want it to walk backwards from what actually got recorded to why, and to surface the second twist that I think they'll only half-see on their own — that the non-applicant who was never prosecuted is left in a worse public position than the guy who did get amnesty. And be straight with me about what predictably goes wrong the first time it runs and how to handle it, plus which part of the real thing the game can't reproduce. My guess is something about the weight of actually testifying in front of the person you harmed, but tell me if its something else.
reasoning: |-
  We are designing a classroom simulation activity to illustrate how the individualized amnesty process in South Africa led to a distorted historical record, shaped by perpetrators' calculations of prosecution risk rather than victims' needs. The activity must fit within an 80-minute session (including debrief) and be robust to 3 absences.

  ### Core Concept to Simulate:
  - Perpetrators decide whether to apply for amnesty based on their private estimate of prosecution risk and the likelihood of being granted amnesty if they disclose.
  - The commission's record (the "official truth") ends up over-representing those who were more likely to be caught (and thus had higher prosecution risk) and under-represents those who had low exposure and good legal counsel (who may never apply).

  ### Structure:
  - **Roles:** 
    - **Perpetrators (P):** 8 students (we can adjust to 5 if only 13 students are present). Each has a private "prosecution risk" level (high, medium, low) and a "disclosure quality" level (which they can choose to disclose fully, partially, or not at all). They also have a "legal resource" level (good or average) that affects how well they can present their case and the likelihood of being caught if they don't apply.
    - **Victims (V):** 4 students. Each has a card describing the harm they suffered and what they need acknowledged. They can ask questions during the amnesty hearing and make a statement about whether they feel the perpetrator has been truthful.
    - **Commission Panel (C):** 3 students. They review amnesty applications and hold hearings. They decide whether to grant amnesty based on the rules: full disclosure and political motivation. They also record the testimony in the "official record".
    - **Observer/Recorder (O):** 1 student (or the teacher if numbers are tight). They keep track of who applied, who was granted amnesty, and what was recorded. They also note who didn't apply.

  - **Game Flow:**
    1. **Setup (5 mins):** Assign roles and hand out role cards. Explain the rules and the timeline.
    2. **Preparation (10 mins):** Perpetrators decide whether to apply for amnesty. If they apply, they must prepare a disclosure (they can choose to disclose fully, partially, or falsely). Victims prepare their statements and what they want acknowledged. Panel prepares by reviewing the amnesty criteria.
    3. **Amnesty Hearings (30 mins):** Each applicant has a hearing (3-4 mins each). The panel questions the applicant, victims can ask questions or make statements. The panel then deliberates (quickly) and announces the decision.
    4. **Non-applicant phase (5 mins):** The recorder reads out the names of non-applicants. The panel notes that they have no information about them.
    5. **Debrief (30 mins):** Structured discussion.

  ### Role Cards:
  - **Perpetrator Cards (8):** Each card has:
    - **Code Name:** e.g., "Officer A"
    - **Act Committed:** e.g., "Ordered the bombing of a community center"
    - **Prosecution Risk:** (Private) High, Medium, or Low. This is based on:
        - High: Strong evidence exists (e.g., documents, witnesses).
        - Medium: Some evidence, but not conclusive.
        - Low: Little evidence, or evidence is well hidden.
    - **Legal Resources:** Good or Average. Good means they are more likely to avoid prosecution if they don't apply and also they can present their case better.
    - **Instructions:** 
        - If you apply, you must decide on your disclosure level (full, partial, false). 
        - If granted amnesty, you avoid prosecution. 
        - If you don't apply and are later prosecuted (which happens if the panel rolls a die and the result is within the prosecution risk level), you face consequences. 
        - But note: the panel only prosecutes non-applicants if they are randomly selected (simulating that in reality, not all are prosecuted due to resource constraints).

  - **Victim Cards (4):** Each card has:
    - **Code Name:** e.g., "Survivor of Community Center Bombing"
    - **Harm Suffered:** e.g., "Lost a leg in the bombing, and two family members died."
    - **What needs to be acknowledged:** e.g., "That the bombing was deliberate and targeted civilians, and that it was part of a pattern of attacks."
    - **Instructions:** You can ask one question to the perpetrator during the hearing and make a short statement about whether you feel the disclosure was truthful and complete.

  - **Commission Panel (3):** 
    - **Rules for Amnesty:** Amnesty is granted only if the applicant makes a full disclosure and shows that the act was politically motivated (in this simulation, we assume all acts were politically motivated to focus on disclosure). 
    - **Instructions:** 
        - For each applicant, ask: "Did you fully disclose?" (based on the perpetrator's choice and your assessment of the testimony). 
        - You may ask clarifying questions. 
        - Victims' input should be considered. 
        - Record the testimony in the official record (a flip chart or whiteboard).

  ### Incentives for Perpetrators:
  - Since we cannot offer real incentives, we use:
    - **Prosecution Risk:** If a perpetrator does not apply, there is a chance they will be prosecuted (simulated by a die roll after the hearings). 
    - **Amnesty Benefit:** If they apply and are granted amnesty, they are immune. 
    - **Reputation:** We tell them that they are expected to act in their own self-interest as a perpetrator might.

  ### Procedure Timing (80 mins total):
  1. **Introduction (5 mins):** 
     - Explain the activity: "Today we are simulating the amnesty process. We have perpetrators, victims, and a commission panel. The goal is to see what kind of record the commission produces."
     - Assign roles (if 16 students: 8P, 4V, 3C, 1O). If 13 (with 3 absences): 5P, 4V, 3C, 1O (or teacher can be O and have 5P, 4V, 3C). Adjust P numbers so that we have 5-8 perpetrators.

  2. **Preparation (10 mins):**
     - Perpetrators: Decide whether to apply. If applying, decide on disclosure (full, partial, false). They note their choice on a slip of paper (to be handed to the teacher or kept private until the hearing).
     - Victims: Prepare their statements and questions.
     - Panel: Review the rules and prepare to hold hearings.

  3. **Hearings (30 mins):** 
     - Each hearing takes 3-4 minutes. We can do 8 hearings if time allows, but if we have 5 perpetrators, that's 15-20 minutes. We can do 6 minutes per hearing (including deliberation) for 5 hearings (30 mins). 
     - Structure per hearing:
          - Perpetrator states their name and gives their account (1 min).
          - Panel and victims ask questions (2 mins).
          - Panel deliberates (1 min) and announces decision (amnesty granted or denied).
          - Recorder notes: 
              - If amnesty granted, the testimony is added to the record (with the disclosure level as determined by the panel).
              - If denied, the testimony is recorded but the perpetrator is subject to prosecution.

  4. **Non-applicant phase (5 mins):**
     - Recorder reads the names of non-applicant perpetrators.
     - The panel notes that they have no information about these individuals and they will be subject to a prosecution lottery (if time, we can do a quick die roll for each non-applicant to see if they are prosecuted, but for time, we may just note the risk).

  5. **Debrief (30 mins):** Structured as:
     - Step 1: What is in the official record? (List on board: which perpetrators are in, what they said, and what was granted.)
     - Step 2: What is missing? (Non-applicants and what they did according to their role cards, but never disclosed.)
     - Step 3: Why did some apply and others not? (Link to prosecution risk and legal resources. Ask perpetrators: what factored into your decision? Expect: high risk applied, low risk didn't. Also, good legal resources might have made them feel safe not applying.)
     - Step 4: How does the record reflect the victims' needs? (Ask victims: did the record capture what you needed? Probably not, especially for non-applicant cases.)
     - Step 5: The twist: Compare the public position of:
          - A granted amnesty perpetrator (now publicly known, but free).
          - A denied amnesty perpetrator (publicly known and prosecuted).
          - A non-applicant who was never prosecuted (publicly unknown, but under a cloud of suspicion?).
          - A non-applicant who was prosecuted and convicted (publicly known and punished).
          - A non-applicant who was prosecuted but acquitted (publicly known but cleared?).
     - Focus on the non-applicant who was never prosecuted: They are not in the record, so the public doesn't know what they did. But they also were never cleared. They are in a limbo. However, in reality, they might be suspected but without official confirmation. This can be worse than being granted amnesty because they are not officially exonerated and they don't have the closure of the commission's record.

  ### What to Prep the Night Before:
  - Role cards for 8 perpetrators, 4 victims, 3 panelists, 1 recorder (and a few extra if needed).
  - A flip chart or whiteboard for the official record.
  - A list of prosecution risk die rolls for non-applicants (if doing the lottery). For example, for a high risk non-applicant, prosecution if die roll <=4 (on d6), medium <=3, low <=1. But we may skip the actual rolling to save time and just talk about the risk.
  - Timer.

  ### What Predictably Goes Wrong:
  1. **Time:** Hearings run over. Solution: Strict timekeeping. Use a timer and cut off when time is up. If needed, reduce the number of perpetrators by having some not apply (but we want a mix of applicants and non-applicants). Alternatively, if time runs short in hearings, skip the non-applicant phase and do it verbally in debrief.
  2. **Perpetrators not understanding incentives:** Some might apply even with low risk, or not apply with high risk. This is okay because it reflects real human variation. In debrief, we can discuss why they made that choice.
  3. **Panel granting amnesty too easily:** The panel might not be strict enough on disclosure. Solution: Emphasize in the panel instructions that they must be convinced of full disclosure. Also, victims can challenge.
  4. **Victims not speaking up:** Encourage victims to prepare questions and prompt them if they are silent.

  ### What the Game Can't Reproduce:
  - The emotional weight of testifying in front of victims and the community. Our simulation is abstract and role-played without real trauma.
  - The long-term societal impact and the fact that victims might not have the opportunity to confront perpetrators who never apply.
  - The complexity of determining "full disclosure" and "political motivation" in real cases.

  ### Adjustments for Absences:
  - If 3 are absent (13 students), we can have 5 perpetrators, 4 victims, 3 panel, and 1 recorder (or teacher as recorder). The game still works with fewer perpetrators.

  ### Final Note:
  This simulation is designed to be a thought experiment. It simplifies the real process but aims to highlight the structural bias in the historical record produced by the amnesty process. The debrief is critical to draw out the intended insights.

  Let me know if you need more details on the role card examples or any other part.
answer: |-
  Below is a structured, ready-to-run simulation activity designed for your 80-minute seminar. It forces students to confront how prosecution risk shapes the historical record, while maintaining strict time limits and academic rigor. The debrief explicitly unpacks the "double distortion" (over-representation of high-risk perpetrators + ambiguous limbo of non-applicants).

  ---

  ### **Activity Title:** *The Amnesty Lottery*

  #### **Learning Goal:**  
  Demonstrate that in individualized amnesty systems, the historical record reflects *perpetrators' risk calculations*, not victims' needs or societal truth. Secondary goal: Reveal how non-applicants occupy a uniquely damaging limbo.

  #### **Roles & Group Sizes (16 Students):**  
  - **Perpetrators (6 students):** High/mid/low prosecution risk. Decide whether to apply for amnesty.  
  - **Victim Advocates (4 students):** Press for acknowledgment of specific harms.  
  - **Amnesty Panel (3 students):** Grant/deny amnesty based on "full disclosure."  
  - **Archivists (3 students):** Record *only* what is disclosed in hearings.  
  - **Absentee Solution:** Runs smoothly if 3 absent (remove 2 perpetrators + 1 archivist; adjust cards accordingly).

  ---

  ### **Materials to Prep (Night Before):**  
  1. **Role Cards (Print 1 per student):**  
     - **Perpetrator Cards (6):**  
       *Sample Card (High Risk):*  
       > **CODE NAME: Hawk**  
       > **YOUR CRIME:** Ordered the 1984 **Komani Bus Bombing** (12 killed).  
       > **PROSECUTION RISK:** HIGH (Ballistics report links you; witness testimony exists).  
       > **LEGAL RESOURCES:** POOR (No funds for top lawyer).  
       > *SECRET INFO:* You did it to suppress union activists.  
       > **CHOICES:** Apply for amnesty? If yes, disclose FULLY (admit intent) or PARTIALLY (blame "poor intel")?  
       > **INCENTIVE:** If prosecuted + convicted = -3 participation points. Amnesty = +2 points.  

       *Vary for Mid/Low Risk:*  
       - *Mid Risk (e.g., "Fox"):* Circumstantial evidence only; average lawyer.  
       - *Low Risk (e.g., "Vulture"):* Evidence destroyed; elite lawyer (immune to prosecution).  

     - **Victim Advocate Cards (4):**  
       > **YOUR HARM:** Komani Bus Bombing killed your brother.  
       > **NEED ACKNOWLEDGED:** "That this targeted union leaders to sabotage labor rights."  
       > **TASK:** Question perpetrators at hearings. Demand answers about intent.  

     - **Panel Cards (3):**  
       > **RULES:** Amnesty ONLY if:  
       > 1. Applicant admits *specific actions AND intent*.  
       > 2. No provable lies.  
       > **YOUR DUTY:** Question applicants. Vote publicly.  

     - **Archivist Cards (3):**  
       > **TASK:** Record testimony verbatim. Do NOT add context. Note: "NO APPLICATION" for absent perpetrators.  

  2. **Physical Materials:**  
     - Timer  
     - 6 "prosecution dice" (d6) labeled per risk level:  
       - High: Prosecuted on 1-4 (≈67%)  
       - Mid: Prosecuted on 1-2 (≈33%)  
       - Low: Prosecuted on 1 (≈16%) *(Elite lawyer ignores rolls)*  
     - Flip chart for "Official Record" (archivists update in real-time)  

  ---

  ### **Procedure (Total: 55 Mins)**  
  1. **Setup (5 mins):**  
     - Assign roles, hand out cards.  
     - **Briefing:** *"Amnesty is available for full disclosure. Prosecution is possible for non-applicants or denied applicants. Archivists record ONLY what's said in hearings."*  

  2. **Perpetrator Strategy (10 mins):**  
     - Perpetrators decide privately:  
       - Apply? (Yes/No)  
       - If yes: Disclose FULLY or PARTIALLY?  
     - *Incentive Note:* Points system creates low-stakes pressure. Non-applicants risk losing points via dice post-hearing.  

  3. **Hearings (30 mins | 4 mins per applicant):**  
     - **Order:** Panel calls applicants one-by-one.  
     - **Process per applicant:**  
       - Applicant states case (1 min).  
       - Victim advocates question (1 min).  
       - Panel questions + votes (2 mins).  
     - **Archivists:** Record testimony on flip chart.  
     - **Non-applicants:** Archivists list names under "NO APPLICATION."  

  4. **Prosecution Lottery (5 mins):**  
     - Non-applicants/denied applicants roll prosecution dice:  
       - If prosecuted, announce: "Convicted!" (lose points).  
       - If not: "No trial due to insufficient evidence."  
     - *Low-risk "Vulture" auto-immune (elite lawyer).*  

  5. **Debrief Prep (5 mins):** Archivists post "Official Record" flip chart.  

  ---

  ### **Structured Debrief (25 Mins)**  
  **Goal:** Guide students from observable outcomes → systemic distortions → the "limbo paradox."  

  | **Debrief Step**             | **Key Questions**                                                                 | **Teacher Script to Surface Insights**                                                                 |
  |------------------------------|-----------------------------------------------------------------------------------|--------------------------------------------------------------------------------------------------------|
  | **1. What was recorded?**    | "Archivists: Read the official record. What patterns do you see?"                 | *Highlight:* Record is patchy. Focuses on applicants only. Victims' needs appear only if raised in hearings. |
  | **2. Why these applicants?** | "Perpetrators: What drove your choices? Victims: Did disclosures address your needs?" | *Link to risk:* "Notice how HIGH-RISK perpetrators (Hawk) applied to avoid prosecution. LOW-RISK (Vulture) stayed silent—they didn’t need amnesty!" |
  | **3. Distortion #1**         | "Why are high-risk perpetrators over-represented?"                                | **"The record isn’t about what’s important—it’s about who was most vulnerable to prosecution."**       |
  | **4. The Limbo Paradox**     | "Compare Vulture (no application, no trial) vs. Hawk (amnesty). Who’s worse off?" | **"Vulture is never cleared. Society suspects but can’t confirm. Amnesty at least offers closure—even for monsters."** |
  | **5. Victims’ Perspective**  | "Did the record acknowledge what you needed? Why/why not?"                        | *Emphasize:* "Victims of non-applicants got NOTHING. The process silenced their harms."                |

  ---

  ### **Predictable Problems & Fixes:**  
  1. **Problem:** Perpetrators act "morally" (e.g., low-risk applies).  
     - **Fix:** Remind them: *"Your role is to protect yourself. You can lie if undetected."*  
     - **Debrief Use:** Discuss why real perpetrators avoid applying if risk is low.  

  2. **Problem:** Hearings run long.  
     - **Fix:** Use hard stops. Cut Q&A at 2 mins. Panel gets 30 seconds to vote.  

  3. **Problem:** Archivists miss details.  
     - **Fix:** Have them bullet-point testimony (not verbatim).  

  4. **Problem:** Victims focus on emotion vs. specific acknowledgment.  
     - **Fix:** In prep, remind: *"Your goal: Get your NEED (on card) into the record."*  

  ---

  ### **What the Simulation CAN’T Capture:**  
  - **The Weight of Testimony:** Real amnesty requires confronting victims face-to-face. This simulation can’t replicate the emotional violence/closure of that encounter.  
  - **Structural Blind Spots:** It can’t show how privileged actors (e.g., white apartheid leaders) had better lawyers, ensuring they *systematically* avoided application.  
  - **Long-Term Social Impact:** The simmering resentment when high-level architects (e.g., Wouter Basson) never testify isn’t fully felt here.  

  ---

  ### **Why This Works:**  
  - Students *experience* the gap between victims’ needs and the record’s content.  
  - The dice make risk tangible. The points system creates rational self-interest.  
  - Archivists force attention on what’s *missing* (non-applicants vanish from history).  
  - The debrief explicitly names the systemic flaws they’ve just lived.  

  **Final Tip:** For immersion, use codenames and forbid role discussion post-activity until debrief. Let me know if you need adjusted cards for fewer students!
