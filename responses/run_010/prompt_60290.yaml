  Now, we need to assign evidence to each judgment. We create a set of evidence for each proposition. We'll have:

  P: Fabrication of data.
     Evidence for: a specific data point that appears to be fabricated (e.g., it is an exact copy of another, it is outside the possible range, etc.)
     Evidence against: the data point might be a typo, or there is an explanation.

  Q: Intentionality.
     Evidence for: the data point was altered in a way that could not be accidental, or there is an email suggesting manipulation.
     Evidence against: it could be an honest mistake.

  R: Responsibility.
     Evidence for: the respondent was the only one with access, or there is a witness.
     Evidence against: the respondent was on leave and the data was handled by a co-author.

  We'll create 21 evidence cards (7 for each panel). We have to design the evidence so that the panelist's judgment on each proposition is determined by the evidence they see. We must also have 2-3 strategic voters per panel. We will mark some cards with a secret stake.

  We'll create three sets of cards for the three panels. Each card will have:

  - A unique set of evidence (for P, Q, R) that leads to the desired judgment for that member.
  - For the strategic voters, we will add a note at the bottom: "SECRET STAKE: You [have a grudge against/friendship with] the respondent. You want the verdict to be [Misconduct Found/Not Found] regardless of the evidence. Do not reveal this." We'll design these so that they are in positions where they might be pivotal.

  Materials:

  - 21 role cards (7 per panel) with evidence and judgments (and for some, secret stakes).
  - 1 card for the respondent (just to know their role).
  - 2 cards for scribes (instructions on how to record votes).
  - Run sheet for the instructor.
  - Ballot forms (for the three propositions and the conclusion, for each panel).

  Run Sheet:

  Total time: 90 minutes.

  0. Setup (5 minutes)
     - Arrange the room: three tables, each with 7 chairs. Whiteboard set up with a grid for recording votes (by panel) for P, Q, R, and the conclusion.
     - Assign roles: randomly assign 21 students to the three panels (7 each). Assign one student as the respondent (they don't have a vote, they just observe). Assign two students as scribes (they will record the votes on the board).
     - Distribute role cards: each panel member gets their evidence card. The respondent gets a card that says: "You are the respondent, Dr. Alex Rivera. You maintain your innocence. Observe the proceedings." The scribes get instructions.

  1. Introduction (5 minutes)
     - Instructor (as chair): "This is a disciplinary hearing of the University Research Ethics Board. The case concerns allegations of research misconduct against Dr. Alex Rivera. The rule we are bound by requires that we establish three propositions to find misconduct: 
          P: The published data contains at least one fabricated data point.
          Q: The fabrication was done intentionally.
          R: The fabrication was done by Dr. Rivera (or under their direct supervision).
       If all three are accepted, the verdict is 'Misconduct Found'. Otherwise, it is 'Misconduct Not Found'. 

       We have three separate panels to deliberate independently. Each panel will follow the same procedure. 

       Procedure: 
          a. Deliberation: Each panelist will have one minute to speak. You may only speak about one of the three propositions (choose the one you feel most strongly about). You must present only the evidence on your card. Do not draw conclusions about the other propositions. We will go in a random order. 
          b. Voting: After deliberation, each panelist will vote by secret ballot on each of the three propositions and on the overall verdict. The voting rule for the propositions and the verdict is by majority. However, note: the overall verdict must be determined by the rule. We will first collect votes on the propositions and then on the verdict.

       But note: the university's procedure requires that the verdict be determined by the aggregation of the judgment on the propositions. Therefore, the official verdict of the panel will be determined by the propositions: if a majority of the panel accepts P, and a majority accepts Q, and a majority accepts R, then the verdict is 'Misconduct Found'. The vote on the overall verdict is for informational purposes only. However, the panel may choose to use the overall verdict vote if it wishes, but that is not the standard procedure. We will follow the standard procedure unless the panel decides otherwise after the vote.

       We will have 15 minutes for deliberation and voting per panel, then we will compare the results of the three panels."

     (Note: The above announcement is deliberately ambiguous about the aggregation method. We say the official verdict is by the propositions (premise-based) but then say the vote on the verdict is taken and that the panel may choose to use it. This sets up the later conflict.)

  2. Deliberation (15 minutes total, but broken down)
     - Each panel is given 7 minutes for the speaking round (1 minute per member, in a random order determined by the panel chair - the instructor will assign a random order at each table). 
     - After the last speaker, each panel has 3 minutes to fill out the ballot. 
     - Ballot: 
          [ ] P: True (fabricated data point exists)
          [ ] P: False
          [ ] Q: True (intentional)
          [ ] Q: False
          [ ] R: True (respondent responsible)
          [ ] R: False
          [ ] Overall Verdict: Misconduct Found
          [ ] Overall Verdict: Misconduct Not Found

     - The scribes collect the ballots and tally the votes for each panel. They post on the whiteboard:

          Panel A:
            P: Yes: __, No: __
            Q: Yes: __, No: __
            R: Yes: __, No: __
            Verdict (premise-based): [to be filled by scribe: if all three premises have majority yes, then "Misconduct Found", else "Not Found"]
            Verdict (conclusion-based): [based on the overall verdict vote: majority for "Found" or "Not Found"]

          Similarly for Panel B and C.

     - The scribes also record the overall verdict vote.

     The instructor circulates to keep time and ensure the rules are followed.

  3. Reporting and First Conflict (10 minutes)
     - The scribes post the results for each panel.
     - The instructor notes: "We have the results. Let's look at Panel A: 
          Premise-based verdict: [say what it is] 
          Conclusion-based verdict: [say what it is]
          They are different. 
       Similarly, we see Panel B: they are the same. Panel C: they are the same by the standard methods, but note that the conclusion-based vote had [4] for Found and [3] for Not Found. If we required a two-thirds majority for the verdict, we would need 5 votes. So it would be Not Found by that rule."

     - Then the instructor says: "But note that the rules allow the panel to decide after the vote which aggregation method to use. So for Panel A, which method should we use? The premise-based or the conclusion-based?"

     - Let the panel members discuss for 2 minutes, then take a non-binding straw poll in the panel (show of hands) on which method to use.

  4. Final Round: The Switch (15 minutes)
     - The instructor now says: "We have a problem. The rules say that the aggregation method must be chosen by the panel. But how should we choose? By the premise method or the conclusion method? Let's vote on the method. But wait: how do we aggregate the votes on the aggregation method? If we use the premise method, we might get one result; if we use the conclusion method, another. This could go on forever. What should we do?"

     - This should spark a debate. The instructor moderates, pushing the regress point: "If we vote on the aggregation rule by majority vote on the conclusion (i.e., each member votes for a rule, and the rule with the most votes wins), that's the conclusion method for the rule. But if we break the vote on the rule into premises (e.g., what are the criteria for a good rule?), then we are using the premise method. How do we decide without already having chosen a rule?"

     - Let the class discuss for 10 minutes. The instructor should guide them to see that there is no neutral way.

  5. Debrief (30 minutes)
     Step 1: Reveal the two terms: "What you have experienced is known in the literature as the 'doctrinal paradox' or the 'discursive dilemma'."
     Step 2: Map the experience to the formal features:
          - Premise-based procedure: aggregating individual judgments on the premises and then deriving the conclusion.
          - Conclusion-based procedure: aggregating the individual conclusions (verdicts).
          - The paradox: sometimes these two methods conflict (as in Panel A).
          - The trade-offs: 
              * Premise-based: pools the information on the reasons (premises) but may lead to a collective judgment set that is inconsistent (if we look at the individual judgments, the group might accept P, Q, R but then the individuals who accepted P, Q, R might be a minority). However, in the premise-based method, the collective set is consistent by construction. The issue is that it may not reflect the individual conclusions.
              * Conclusion-based: respects the individual conclusions but discards the information on the premises. It may lead to inconsistent premises (if we look at the majority on premises, we might get a set that implies the opposite verdict). In our example, Panel A: premise-based says all premises true -> verdict 1, but conclusion-based says verdict 0. But if we look at the individual judgments, the majority on each premise is 1, but the majority of individuals do not have all three as 1. So the group by premises is consistent, but the group by conclusion is consistent too? Actually, the inconsistency is between the two collective sets.

     Step 3: The epistemic point: 
          - The premise method allows the group to use the information about the premises even if the individuals have different views on the conclusion. The conclusion method throws away the reason-specific information.

     Step 4: The independence condition: In the premise-based method, we vote on each premise independently. In the conclusion-based method, we do not. The paradox shows that we cannot always have both.

     Step 5: The strategic voting: "Did anyone notice that the outcome might have been changed by someone voting against their sincere judgment? We had some members with a 'secret stake'. How did that affect the outcome?"

  6. Failure analysis (handled as part of the run, but instructor should be aware):
     - Reverse-engineering: Students might guess the setup after the first panel. Mitigation: Emphasize that each panel is independent and they should not share information. Also, the evidence on the cards should be detailed enough to feel real.
     - Refusing to vote: If a strategic voter feels uncomfortable, they might not play along. Mitigation: The secret stake cards should be distributed to students who can handle it. Alternatively, if they refuse, the instructor can note that and use it in debrief as an example of how real-world actors might deviate.
     - Panel finishing early: Have extra discussion questions for them (e.g., "discuss among yourselves whether the procedure is fair").
     - Premature procedural fix: The room might quickly decide on one method. The instructor should challenge with the example of Panel A: "But what if the premise-based method leads to a verdict that the majority of the panel disagrees with? Is that acceptable?"

  7. What the activity cannot reproduce:
     - A single profile: Students see only three profiles. They might think the paradox is rare. The instructor must emphasize that it is a general possibility and can occur whenever the majority on the premises does not align with the majority on the conclusion.
     - Accountability: Real collegial bodies have to live with their decisions and face consequences. The students are just simulating.
     - The activity does not show the full generality of Arrow-style results (since we have a specific structure of the decision: the conjunction rule).
     - It may not capture the full strategic complexity (e.g., sophisticated voting with multiple rounds).

