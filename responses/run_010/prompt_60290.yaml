  We want:
  - Premise-based: verdict 1 (all premises accepted by majority).
  - Conclusion-based (simple majority): verdict 1 (at least 4 votes for 1).
  - Conclusion-based (supermajority): verdict 0 (if we set the threshold at 5 and we have 4 votes for 1).

