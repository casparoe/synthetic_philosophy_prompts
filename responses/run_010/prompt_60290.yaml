  Member 1: 1,1,1 ->1
  Member 2: 1,1,1 ->1
  Member 3: 1,1,1 ->1
  Member 4: 1,1,1 ->1
  Member 5: 1,0,0 ->0
  Member 6: 0,1,0 ->0
  Member 7: 0,0,1 ->0

  Check:
  - Premise-based:
     P: 1,1,1,1,1,0,0 -> 5 yes -> accept
     Q: 1,1,1,1,0,1,0 -> 5 yes -> accept
