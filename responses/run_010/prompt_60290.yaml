  Below is the complete, self-contained activity design for your seminar. It's structured to ensure students experientially discover the doctrinal paradox (discursive dilemma) without prior exposure to the terms. The case involves a university research misconduct hearing with real stakes to heighten engagement.

  ---

  ### **1. Case & Propositions**  
  **Case:** *University Research Ethics Committee*  
  Dr. Jordan Lee (respondent) is accused of falsifying data in a climate change study. The rule states: **A finding of misconduct requires ALL THREE propositions to be accepted:**  
  - **P**: The published graph contains knowingly altered data points.  
  - **Q**: The alteration distorted the study’s primary conclusion.  
  - **R**: Dr. Lee directed or approved the alteration.  

  **Normative Weight**: Accusations threaten Dr. Lee’s career; a "guilty" verdict triggers suspension. This forces students to confront procedural fairness.  

  **Role Allocation**:  
  - 3 panels of 7 students each (21 total).  
  - 1 student as **Dr. Lee** (respondent): Observes, may protest procedural injustice.  
  - 2 **scribes**: Record votes on the whiteboard.  

  ---

  ### **2. Role Cards (Evidence-Based Judgments)**  
  Each card provides a "slice of evidence" (email, lab note, peer review) that sincerely informs judgments on P, Q, R. Cards differ by panel to create distinct voting profiles:  

  | **Panel** | **Premise-Based (P/Q/R)** | **Conclusion-Based (Verdict)** | **Supermajority (5/7) Verdict** |  
  |-----------|---------------------------|--------------------------------|----------------------------------|  
  | A         | P:4-3 ✅, Q:5-2 ✅, R:4-3 ✅ → **Guilty** | 3✅, 4❌ → **Not Guilty** | *(Not used initially)* |  
  | B         | P:6-1 ✅, Q:5-2 ✅, R:7-0 ✅ → **Guilty** | 6✅, 1❌ → **Guilty** | *(Not used initially)* |  
  | C         | P:5-2 ✅, Q:5-2 ✅, R:5-2 ✅ → **Guilty** | 4✅, 3❌ → **Guilty** | 4✅ (<5) → **Not Guilty** |  

  **Evidence Examples**:  
  - **Card A3 (P=❌, Q=✅, R=✅)**: *"Email shows grad student altered data, but Dr. Lee wasn’t copied. Graph distortion is clear (Q✅). Dr. Lee’s signature is on the submission (R✅)."*  
  - **Card B6 (P=✅, Q=❌, R=✅)**: *"Dr. Lee admitted altering data to a colleague (P✅). The change didn’t affect the conclusion (Q❌). Lab notes show they ordered it (R✅)."*  

  **Secret Stake Cards (2 per panel)**:  
  - *"SECRET: You believe Dr. Lee is a rising star. Vote for ‘Not Guilty’ regardless of evidence."*  
  - *"SECRET: Your department rival mentors Dr. Lee. Vote for ‘Guilty’ regardless of evidence."*  

  ---

  ### **3. Deliberation Constraint**  
  **Rule**: "Each panelist speaks for **60 seconds, on ONE proposition only** (choose P, Q, or R). Present ONLY the evidence on your card—no conclusions, no cross-talk. Order is randomized."  

  **Why It Holds**: Prevents information pooling by:  
  - Limiting focus to one premise (fragments information).  
  - Banning conclusions/commentary (avoids holistic reasoning).  
  - Random order + no rebuttals (prevents consensus).  

  ---

  ### **4. Run Sheet (90-Minute Session)**  
  **Materials**:  
  - 21 role cards (labeled Panel A1-A7, B1-B7, C1-C7).  
  - 3 ballot sets (one per panel).  
  - Whiteboard grid:  

  | Panel | P (Y/N) | Q (Y/N) | R (Y/N) | Premise Verdict | Conclusion Verdict |  
  |-------|---------|---------|---------|-----------------|--------------------|  
  | A     |         |         |         |                 |                    |  
  | B     |         |         |         |                 |                    |  
  | C     |         |         |         |                 |                    |  

  **Timing & Script**:  
  - **0:00–0:05 (Setup)**: Assign roles. Distribute cards. Scribes label the board.  
  - **0:05–0:10 (Chair’s Instructions)**:  
    > *"This committee must rule on misconduct charges against Dr. Lee. Per university statutes, guilt requires ALL THREE propositions (P, Q, R) to be proven. Each panel will deliberate independently.  
    > **Procedure**:  
    > 1. Deliberation: Each member speaks for 60 seconds on ONE proposition (P, Q, or R). Only present your evidence—no conclusions.  
    > 2. Voting: Secret ballot on each proposition AND the verdict.  
    > 3. Outcome: The panel’s official verdict is determined by the propositions—if majority accept P, Q, and R, guilt is found. The verdict vote is advisory.  
    > We begin in 60 seconds."*  
  - **0:10–0:25 (Deliberation)**: Panels deliberate simultaneously (15 min). Enforce time limits.  
  - **0:25–0:30 (Voting)**: Distribute ballots:  
    > *"Circle YES/NO for P, Q, R, and GUILTY/NOT GUILTY for the verdict. Fold and return to scribes."*  
  - **0:30–0:35 (Tally & Post)**: Scribes tally and post results on the board. Calculate:  
    - Premise verdict: Guilty only if majorities accept all P, Q, R.  
    - Conclusion verdict: Majority verdict vote.  
  - **0:35–0:45 (Reveal & Outrage)**:  
    - Panel A: Premise=Guilty, Conclusion=Not Guilty.  
    - Panel B: Both=Guilty.  
    - Panel C: Premise=Guilty, Conclusion=Guilty (but 4-3—not 5/7 supermajority).  
    > Dr. Lee: *"How can Panel A convict me with the same facts Panel B used to acquit? This is rigged!"*  
  - **0:45–0:55 (Switch Challenge)**:  
    > *"Panel A, your verdicts conflict. You may switch procedures now—use the conclusion vote instead. Do you?"*  
    **Forced Questions**:  
    - *"What if we vote on which procedure to use? But how do we aggregate THAT vote—by premises or conclusion?"* (Regress trap).  
    - *"If premise-based is ‘fairer,’ why did it convict against your majority’s will?"*  
    - *"Dr. Lee demands a supermajority (5/7) for guilt. Panel C, if you apply this to the conclusion vote, does it change your verdict?"* (Yes: 4<5 → Not Guilty).  
  - **0:55–1:20 (Debrief)**: Sequenced reveal:  
    1. **Name the Paradox**: *"You encountered the* doctrinal paradox *or* discursive dilemma: *Aggregating judgments on premises (P/Q/R) vs. conclusion (verdict) can conflict."*  
    2. **Map Formal Features**:  
       - *"Premise-based: Pools evidence but may override individual verdicts (Panel A)."*  
       - *"Conclusion-based: Respects verdict votes but ignores evidence splits (Panel B agreed; Panel C’s supermajority ignored premises)."*  
       - *"Trade-off: No method preserves unanimity, neutrality (equal weight), AND consistency simultaneously. Panel A saw this."*  
    3. **Epistemic Point**: *"Premise-based pooling reveals why evidence mattered—e.g., in Panel A, R was barely accepted (4-3), but conclusion-based buried that."*  
    4. **Strategic Voting**: *"Secret stakes: Did anyone vote against their evidence? How did that flip a premise (e.g., Panel A’s R)?"*  

  ---

  ### **5. Failure Analysis**  
  | **Issue**               | **Prevention/Mitigation**                                                                 |  
  |-------------------------|-------------------------------------------------------------------------------------------|  
  | Reverse-engineering     | Start immediately after instructions; emphasize "stick to your card’s evidence."           |  
  | Refusing strategic vote | Secret stakes are rare (2/panel); if exposed, ask: *"Would you do this if tenure depended?"* |  
  | Panel leaks             | Isolate panels; use "time out" if early finishers.                                         |  
  | Premature consensus     | Chair intervenes: *"Panel A, your conclusion vote was 4-3 against guilt—why accept premise-based guilt?"* |  

  ---

  ### **6. Structural Limitations**  
  1. **Single Profile Curio**: Students see one instance. **Mitigate**: Stress in debrief: *"This isn’t rare—it arises whenever individual judgments split logically."*  
  2. **Accountability Void**: No real consequences. **Mitigate**: Role-play Dr. Lee’s protests; ask: *"Would you resign if your vote ruined a career?"*  
  3. **Unmodeled Complexities**:  
     - **Dynamics**: Real committees revisit debates; this is one round. **Supply**: Contrast with iterative juries.  
     - **Broader Theorems**: Judgment aggregation generalizes Arrow; **supply** this link post-activity.  
     - **Epistemic Justice**: **Highlight**: *"Whose knowledge counts? Notice whose evidence was sidelined by conclusion-based voting."*  

  ---

  ### **Final Note**  
  The chair’s bureaucratic language (*"advisory vote," "official verdict by propositions"*) and the engineered outrage (Panel A’s conflict) make the procedural choice viscerally consequential. The debrief ties their frustration to systemic trade-offs—no theorems needed.
