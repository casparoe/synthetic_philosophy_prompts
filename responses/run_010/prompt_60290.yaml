  We are designing an activity for a seminar in social and political epistemology. The goal is for students to encounter the discursive dilemma (doctrinal paradox) through an experiential activity without prior exposure to the terms. The setting is a panel decision on a case with three propositions (P, Q, R) that must all be accepted for a finding against the respondent. We have three panels (A, B, C) of seven students each, one respondent, and two scribes.

  Key design features:
  1. The case must have real normative weight. We'll create a case about a university disciplinary hearing for alleged research misconduct.
  2. Role cards: Each panelist gets a card with a "slice of evidence" that leads them to a sincere judgment on each proposition. The cards are designed so that:
     - Panel A: Premise-based (voting on each proposition) leads to accepting all three (verdict: against respondent), while conclusion-based (voting on the verdict) leads to rejecting (verdict: for respondent).
     - Panel B: Both methods lead to the same verdict (against the respondent).
     - Panel C: Conclusion-based with a two-thirds supermajority requirement (which we'll set as 5 out of 7) leads to a different outcome than premise-based.

     We'll design the evidence cards to create the required judgment profiles.

  3. Deliberation constraint: We cannot allow free sharing of all evidence because that would pool information and break the paradox. We will structure the deliberation by:
     - Allowing each panelist to speak for 1 minute only, and only on one of the three propositions (they must choose which one). They can only present the evidence they have and not make conclusions about the other propositions.
     - The order of speaking is randomly assigned, and they cannot respond to each other's points. This is to prevent the group from becoming fully informed.

  4. Strategic voters: We will have 2-3 cards per panel that have a "secret stake": a reason to want a particular verdict regardless of the premises. For example, one might have a grudge against the respondent, another might be a friend. They are instructed to vote strategically to achieve that verdict.

  5. Run sheet: Detailed timing and materials.

