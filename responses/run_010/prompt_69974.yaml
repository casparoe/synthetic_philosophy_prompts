prompt: |-
  I am working through the Formula of Universal Law for a dissertation chapter, and my considered verdicts on particular maxims refuse to line up with the standard two-tier story, so I want to know what principle, if any, they add up to.

  Borrowing money with a promise of repayment I know I cannot honor: fails, and fails at the first tier — the practice of promising could not survive universalization. Promising while privately reserving the right to break the promise should it become burdensome: fails as well, though I suspect it only fails because I have described the maxim widely enough; the same maxim specified to my exact circumstances seems to universalize without trouble. Refusing ever to assist anyone, however great their need: passes the first tier, fails the second, since I cannot will a world in which no one would aid me. Devoting one's life to idleness and cultivating no talents at all: I think this passes both tiers — I cannot identify any end of mine that it necessarily frustrates — even though the argument against it looks structurally identical to the non-beneficence case. Ending my life to escape misery: fails. Telling a would-be murderer at my door that my friend is not home when she is: fails. Telling that same murderer, truthfully, that I saw my friend in the garden ten minutes ago, knowing full well what he will infer: passes, and I cannot say why, since the intent to mislead and the reliance on my word are the same in both. Submitting a term paper generated by a model while representing it as my own work: fails at the first tier, on the ground that the assignment would cease to evidence anything if everyone did it. Depending on data that colleagues share while sharing none of my own: fails at the second tier.

  My tentative hunch is that the second tier only bites where a necessary end is frustrated, but "necessary" is doing all the work and I cannot cash it out in a way that keeps the idleness case on the passing side.

  Is there a principle, or a small set of candidates, that delivers all of these? For each, state the clauses precisely and the case that motivates each clause; say specifically how it handles the description of the maxim, and whether the lie/evasive-truth pair can be preserved without a clause that looks ad hoc. Then give its verdict on a case I have not listed: the graduate student who never reads the secondary literature, forming interpretations of the primary texts directly, while depending on a scholarly culture sustained by people who do. Finally, say plainly which of my verdicts cannot be accommodated.

  Please begin with your bottom line in the first sentence and then give the reasoning, with no preamble and no restatement of the question.
reasoning: |-
  Okay, let me tackle this user's complex query about Kant's Formula of Universal Law (FUL). The user is clearly deep into dissertation work, grappling with inconsistencies in standard interpretations of FUL across various maxims. Their frustration with the "two-tier story" suggests they've encountered the usual contradiction-in-conception vs. contradiction-in-willing framework but found it inadequate for their cases.

  Hmm, what's striking is how meticulous their case list is - from false promises to academic dishonesty. The lie/evasive-truth pair particularly interests me, as does the idle life case that strangely passes both tiers. Their "necessary ends" hunch feels important but underdeveloped - that's probably where I should focus.

  Looking at their examples, I notice three patterns: cases failing at Tier 1 involve practices that would collapse if universalized (like promising); Tier 2 failures involve undermining conditions for rational agency (like refusing aid); and the passing cases don't threaten either. The graduate student case seems analogous to the data-sharing example - free-riding on a scholarly commons.

  For the murder cases, the key difference might be that the evasive truth doesn't manipulate the murderer's rational faculties in the same way as a direct lie. Kant's aversion to undermining others' rationality could explain this distinction without needing ad hoc clauses.

  The idle life case is tricky indeed. Unlike refusing aid, pure idleness doesn't necessarily make one dependent on others' help - one might live self-sufficiently. This preserves the "necessary end" of maintaining rational agency without contradiction. 

  For the dissertation writer, I should emphasize that FUL isn't mechanical - maxim description matters immensely. Their point about narrowly specified maxims universalizing easily is astute; Kant likely intended maxims to capture the underlying principle of action. The graduate student case clearly fails Tier 2 by willing a world where no one sustains the scholarly culture they exploit.

  I'll need to explicitly reject their verdict on idle life passing though - Kant does argue talents are necessary for any possible future purpose. But their other verdicts seem defensible within this framework. The core principle emerges: FUL prohibits both self-underming actions and willings that contradict the conditions of rational agency.
answer: |-
  **The principle unifying your verdicts is: A maxim fails the Formula of Universal Law if its universalization (1) logically destroys a practice essential to its own efficacy *or* (2) renders impossible the achievement of an end necessary for rational agency (specifically, self-preservation or the capacity to set and pursue ends).**

  **Clauses & Motivations:**

  1.  **"Logically destroys a practice essential to its own efficacy"**: Motivated by **borrowing with false promise** and **academic dishonesty**. Universalizing these destroys promising/grading, making the intended deception impossible. Handles maxim description by requiring the maxim to reference the *general practice* it exploits (e.g., "borrow *by promising repayment*", "submit *as my own work*").

  2.  **"Renders impossible the achievement of an end necessary for rational agency (self-preservation or capacity to set/pursue ends)"**: Motivated by **refusing assistance** and **data hoarding**. Universal non-beneficence/hoarding makes it impossible to will receiving aid/needed data when essential for survival/agency. "Necessary end" means an end inherent to being a rational agent facing finitude: avoiding destruction and maintaining the basic capacity for agency. Handles maxim description by focusing on the maxim's *fundamental principle* (e.g., "never assist", "never share data") regardless of specific circumstances.

  **Handling the Lie/Evasive Truth Pair:**

  *   **Telling the murderer your friend isn't home (lie)**: Fails Clause 1. Universal lying destroys truthfulness, making communication (and thus *effective lying*) impossible. The maxim inherently relies on the practice of truthful communication it undermines. Intent is irrelevant to this structural contradiction.
  *   **Telling the murderer you saw your friend in the garden (evasive truth)**: Passes. While intending to mislead, the maxim's universalization ("when asked about someone's whereabouts by someone intending harm, state a true but potentially misleading recent fact") does *not* destroy truthfulness or communication. People could still generally rely on statements being factually true, even if sometimes unhelpful. The practice of truthful assertion survives. Clause 2 doesn't bite because the murderer's ends are illegitimate. The difference stems purely from the structural relationship between the maxim and the practice of communication/assertion, not intent.

  **Graduate Student Case (Never reading secondary literature while free-riding):**

  *   **Verdict**: Fails under Clause 2.
  *   **Reasoning**: The maxim's fundamental principle is "never engage with secondary scholarship while relying on others to sustain the scholarly culture." Universalizing this renders the scholarly culture (necessary for generating reliable interpretations, accessing primary texts, etc.) impossible. This directly undermines the agent's *own* capacity to pursue their end (forming interpretations) effectively and rationally, as that capacity depends on the very culture their maxim, if universalized, destroys. It contradicts a necessary condition for their own scholarly agency.

  **Handling Idleness vs. Non-Beneficence:**

  *   **Refusing ever to assist**: Fails Clause 2. Universal refusal makes receiving aid impossible, contradicting the necessary end of securing help essential for survival/agency when vulnerable.
  *   **Devoting life to idleness/cultivating no talents**: **Your verdict (passes) cannot be accommodated.** This maxim *should* fail under Clause 2. Kant argues (*Groundwork*) that talents are necessary means for *any* possible future ends a rational agent might adopt. Universal idleness/talent neglect renders agents incapable of effectively pursuing *any* ends they might set. This undermines the very capacity to set and pursue ends, a fundamental condition of rational agency. It contradicts the necessary end of maintaining one's capacity for agency over time. Talent cultivation is a necessary *means* to preserving future agency, even if no specific end is currently frustrated.

  **Summary of Verdicts Accommodated/Rejected:**

  *   **Accommodated**: False Promise (Fails 1), Reserved Promise (Fails 1, via wide description), Non-Beneficence (Fails 2), Suicide (Fails 2 - destroys the subject of agency), Direct Lie to Murderer (Fails 1), Evasive Truth to Murderer (Passes), Academic Dishonesty (Fails 1), Data Hoarding (Fails 2), Grad Student Free-Riding (Fails 2).
  *   **Rejected**: Idleness/No Talents (Should Fail Clause 2). The principle requires recognizing that maintaining the capacity for future agency (which includes developing necessary means like talents) is a necessary end inherent in rational agency.
