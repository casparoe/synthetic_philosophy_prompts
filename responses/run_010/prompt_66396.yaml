prompt: |-
  You are a specialist in democratic theory, with particular expertise in the literature on sortition, citizens' assemblies, and deliberative mini-publics. Think carefully, and before settling on an answer, first brainstorm a list of candidate concepts that might fit the description below, then evaluate each of them.

  Here is a pattern I keep running into in arguments for randomly selected citizen bodies, and I do not know whether it has a name.

  The body is praised as a statistical portrait of the population: because it is drawn by lot and stratified, it is said to contain in miniature the same distribution of ages, incomes, regions, and starting opinions as the country at large, so that whatever it concludes carries the weight of what the public itself would conclude if the public had the time and the information. But when the same body's conclusions diverge sharply from what the public actually says — an assembly backs a carbon tax that a popular vote would reject, or endorses an electoral reform that polls show losing — the divergence is not counted against the mirroring claim. It is presented as the point: months of testimony, cross-examination, and facilitated small-group work have corrected the misinformation and short horizons that an opinion poll merely records, so the assembly shows what the public's judgment looks like once it is informed.

  The upshot is that agreement with the polls counts as evidence the design works (this is us), disagreement with the polls also counts as evidence the design works (this is a better us), and nothing appears to determine which reading is in force on any given occasion.

  So: is there an established concept for this? I know part of the terrain — I have come across the distinction between a body's representing people by resembling them and its representing them by being authorized by them, and I know that deliberative democrats distinguish what people happen to think from what they think after discussion — but neither of those seems to capture what I am describing, which is the switching between the two standards together with the absence of any rule for when each one applies. Tell me what the nearest established concepts are, how each differs from what I have described, and which fits best. If nothing fits, say so plainly and coin a term: give a definition, specify its boundary cases, and say what feature of a design would render it immune to the charge. I am not looking for a bare label or a reading list; I want the phenomenon carved correctly, including where it stops being an unobjectionable feature of a two-stage justification and starts being a way of insulating a proposal from any evidence at all.
reasoning: |-
  Hmm, the user is describing a pattern they've noticed in arguments for sortition-based bodies like citizens' assemblies. They see a tension where these bodies are praised as statistical microcosms of the population when their conclusions align with polls, but when they diverge, this is framed as the assembly revealing what the people would think if better informed. The user wants to know if there's an established concept for this apparent inconsistency in how the assembly's representational claim is interpreted.

  Let me think about the key elements here. First, there's the dual nature of representational claims: descriptive representation (mirroring demographics) vs. deliberative transformation (improved judgment through information). The switching between these justifications without clear criteria stands out as the core issue. 

  I recall several concepts that touch on aspects of this. There's the descriptive vs. substantive representation distinction, but that doesn't quite capture the switching behavior. The Rawlsian "considered judgment" concept addresses the transformation but not the mirroring claim. Fishkin's Deliberative Polling combines both elements but maintains a clear distinction between measurement phases. The "microcosm/macrocosm" metaphor is commonly used but often conflates the two claims. 

  The most promising fit seems to be the "Double Democracy" problem identified by Lafont - where the assembly is simultaneously presented as the people and as better than the people. But even that doesn't fully address the absence of switching rules. 

  After considering these, I think what the user describes doesn't have a perfect established term. It's closest to an unregulated switching between descriptive and transformative legitimacy claims. For a new coinage, "Legitimacy Claim Switching" seems appropriate, capturing how proponents toggle between "this is us" and "this is our better selves" without clear criteria. 

  The boundary where this becomes problematic is when there's no accountability for which claim is invoked when, making the assembly's conclusions unfalsifiable. Designs that avoid this would have clear differentiation between the descriptive sampling function and the deliberative purpose, with transparency about when transformative claims are justified (e.g., through pre/post deliberation surveys).
answer: |-
  Based on your precise description, this phenomenon **lacks a single established term** in the literature, though it touches deep tensions in deliberative and representative theory. Here's the conceptual dissection:

  ### Candidate Concepts & Their Fit
  1.  **Descriptive Representation vs. Substantive Representation:**
      *   **Fit:** Captures the core tension ("mirroring" vs. "acting in best interests").
      *   **Misfit:** This is a foundational *distinction*, not a term for the problematic *switching* or the *lack of criteria* governing which claim applies when divergence occurs. The problem arises from using *both* claims simultaneously/opportunistically for the *same body/outcome*.

  2.  **Rawlsian "Considered Judgment" / "Reflective Equilibrium":**
      *   **Fit:** Explains the *transformative* claim – the assembly's output reflects what the public *would* think under ideal deliberative conditions (full info, no coercion, reasoning).
      *   **Misfit:** Doesn't address the initial *statistical mirroring* claim or the switching. Rawls focuses on the *ideal*, not the empirical claim that the assembly *is* a microcosm *before* deliberation produces the considered judgment.

  3.  **Fishkin's "Deliberative Polling" (DP) Model:**
      *   **Fit:** Explicitly combines random sampling (statistical representativeness) with deliberation to measure *informed* public opinion. Divergence from raw polls is the *point* and is validated through pre/post deliberation surveys showing opinion change.
      *   **Misfit:** DP *maintains a clear distinction*: the *input* is the statistical microcosm; the *output* is the considered judgment *of that microcosm*. The switching is controlled and measurable. In your described pattern, the *same body* is used *interchangeably* as microcosm and transformed entity without clear demarcation or empirical verification of the transformation *within* the sample.

  4.  **"Microcosm"/"Mini-Public" vs. "Macrocosm"/"Polity":**
      *   **Fit:** Common metaphors highlighting the scale difference and the aspiration of resemblance.
      *   **Misfit:** These are descriptive labels, not concepts explaining the *logic of justification switching* when outputs diverge. They don't address the criteria problem.

  5.  **Cristina Lafont's "Double Democracy" Problem:**
      *   **Fit:** Lafont (*Democracy without Shortcuts*, 2020) directly critiques the tendency to present mini-publics *both* as "the people" (descriptively) *and* as "better than the people" (substantively/deliberatively). She argues this creates an undemocratic "shortcut" bypassing the necessary democratic engagement of the actual citizenry.
      *   **Misfit:** While Lafont *identifies the core tension and its dangers* brilliantly, she doesn't provide a specific *term* for the opportunistic switching logic itself, focusing more on the normative democratic consequences. Her critique is the closest existing *analysis* of the phenomenon you describe.

  **Conclusion on Fit:** **Lafont's "Double Democracy" critique is the most direct theoretical engagement with the phenomenon.** However, it lacks a concise, established *name* for the specific *logic of opportunistic justification switching* you pinpoint – the "heads I win, tails you lose" structure regarding representational claims.

  ### Coining a Term: Legitimacy Claim Switching (LCS)
  *   **Definition:** The opportunistic alternation between two distinct legitimacy claims for a randomly selected citizen body – (1) *Descriptive Microcosm Legitimacy* (its conclusions reflect the *current* will/characteristics of the public due to statistical representativeness) and (2) *Transformative Deliberative Legitimacy* (its conclusions reflect the *enlightened* will the public *would* hold under ideal deliberative conditions) – without clear, objective criteria determining which claim is invoked, particularly when the body's outputs diverge from expressions of current public opinion (e.g., polls, elections).
  *   **Boundary Cases:**
      *   **Not LCS (Unobjectionable):** A design like Deliberative Polling, where the *statistical microcosm claim* applies strictly to the *pre-deliberation sample* and its baseline opinions, and the *transformative claim* applies strictly to the *post-deliberation opinions* of that *same sample*, with data (pre/post surveys) validating the change *within* the microcosm. The legitimacy of the output rests solely on the transformative claim, clearly differentiated from the claim about the initial sample.
      *   **LCS (Problematic):** When a Citizens' Assembly (CA) is initially presented as "a mirror of the people" to establish its authority, but when its final recommendation contradicts polls, proponents argue *without specific evidence from the assembly process itself* that this divergence *proves* the CA represents the "real" or "better" informed public will, implicitly abandoning the descriptive microcosm claim *for that output* while potentially still invoking it for other aspects or future work.
      *   **Blurred Line:** When a CA report claims to represent "the informed public view," implying transformation, but its public legitimacy is *marketed* primarily on its initial descriptive representativeness, leveraging the microcosm claim for public acceptance of the transformative output.
  *   **Immunizing a Design Against the LCS Charge:**
      1.  **Explicit Separation of Claims:** Clearly differentiate the legitimacy basis of the *assembly's composition* (statistical microcosm) from the legitimacy basis of its *outputs* (deliberative transformation). Don't claim the *output* is what the public *currently* thinks *because* it's a microcosm.
      2.  **Internal Validation of Transformation:** Incorporate mechanisms *within* the assembly design to empirically demonstrate the transformation *of the microcosm itself* (like pre/post deliberation surveys of members on key questions). This shows *why* the output diverges from raw polls – because the members' views changed through the process. The transformation claim then rests on observable change *within* the sample, not just assertion.
      3.  **Transparency on Reasoning:** Make the assembly's evidence, testimony, and internal deliberations highly accessible. This allows external observers to judge *whether* the transformation seems reasonable and grounded in the deliberative process, providing a basis for the "better us" claim beyond mere assertion.
      4.  **Avoid Opportunistic Switching:** Proponents should be consistent. If divergence occurs, the argument *must* rest primarily on the transformative claim, *supported by evidence from the process* (e.g., "Our surveys show members significantly shifted their views on X after examining evidence Y and Z"), and *not* imply the output reflects current public opinion. The descriptive claim's primary role is justifying *who* was included in the deliberation, not *what* they concluded.

  ### When Does LCS Become Unobjectionable vs. Insulating?
  *   **Unobjectionable (Two-Stage Justification):** The design *explicitly uses* the descriptive microcosm *only* to select participants whose subsequent deliberation is intended to produce a transformed, considered judgment. The legitimacy of the *final output* rests *solely* on the deliberative process and its ability to produce reasoned, informed conclusions from a diverse group. The microcosm claim justifies *inclusion*, not the *output's congruence* with current opinion. Divergence is expected and explained by the process. (This aligns with the DP model and a strict reading of deliberative theory).
  *   **Insulating (Problematic LCS):** When proponents:
      *   Use the microcosm claim to *establish initial credibility and authority*.
      *   Switch to the transformative claim *only when convenient* (i.e., when outputs diverge), *without robust internal evidence* of the transformation within the assembly itself.
      *   Fail to provide clear, accessible criteria *ex ante* or *post hoc* for *when* divergence validates transformation versus when congruence validates microcosm representation.
      *   Treat congruence as proof of microcosm accuracy *and* divergence as proof of transformative success, making the assembly's conclusions effectively unfalsifiable by empirical evidence of public opinion. This shields the assembly's output from democratic accountability to the actual, non-deliberating public.

  **In essence, LCS exploits the ambiguity between two powerful but distinct legitimating narratives.** The phenomenon you describe is a recognized *problematic practice* within debates on mini-publics (best analyzed by Lafont), but it merits its own specific label: **Legitimacy Claim Switching (LCS)**. Immunity requires designs that rigorously separate, validate, and transparently justify the distinct claims, anchoring the transformative claim in observable change within the microcosm.
