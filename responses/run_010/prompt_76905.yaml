prompt: |-
  So my flatmate is halfway through a philosophy masters and she spent dinner on Sunday trying to explain this thing to me — Parfit's hitchhiker, I think it's called. The version I took away: your car dies somwhere out of reach of anyone, a driver comes along and will only give you a lift if you promise to pay him properly once you get to town, and once you're safe and warm the smart move is obviously to not pay, since paying now costs you and buys you nothing. But if everyone reasons like that nobody ever gets picked up, so the genuinely smart move was to be the kind of person who does pay — which apparently means it can be rational to make yourself unable to be rational, or rational to be irrational, and thats the bit my brain keeps sliding off. She says there's also a wrinkle about some people being "transparent", in that you can just tell they'd pay, and those people get picked up first.

  Instead of another essay about it (I've read enough of those for her, honestly) I'd like a story that makes me feel the problem. Please act as an experienced sci-fi writer who's also read enough moral philosophy to get the argument right, and think carefully before you start: give me a short brainstorm of six to eight beats, one line each, saying which pressure-point of the problem each beat is carrying, and then write the story itself, somewhere around 1800 to 2500 words. Seed, take it or leave it as you see fit: near future, a privately run breakdown-recovery service covering a long stretch of road with no signal — Nullarbor, northern Scotland, wherever you like. The recovery drivers are self-employed and paid on outcomes, and they only take a job if they can read your covenant record, a public history of whether you've settled what you owed. There's also a clinic in the nearest sizeable town that will edit you over a weekend: afterwards you can't walk away from a covenant even if you want to, and the drivers' scanners can see that, though the scan reads some people much better than others. My protagonist is a contract systems engineer whose car dies about 400km from a site they have to be at by Thursday, and there's someone else stranded further along who has refused the clinic on principle and keeps getting driven past. I want the choice-about-yourself to happen before the rescue, since that's the whole point, and then a scene afterwards in town where paying is plainly against the protagonist's interest and there's a clean loophole available. End it without resolving the tension — no epiphany speech, nobody turns to camera and explains the moral, and keep any explicit argument to a sentence or two at most. The philosophy should live in what people do and what it costs them. Don't name-drop Parfit or any real paper inside the story.

  Write the whole thing in British English — spelling, idiom, the lot — even if the characters and the setting aren't British; just keep the narration British. And if you think the setup I've sketched makes the point land badly (the clinic thing might be too tidy, I can't tell), change what you need to and add two or three lines at the very end telling me what you changed and why.
