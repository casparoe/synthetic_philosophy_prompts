  However, the film uniquely visualizes the "mediocrity" Anscombe attributes to Truman through Jason Clarke's portrayal - the petty vindictiveness after dismissing Oppenheimer. It also materializes her concept of "spectacular wickedness" through the bomb's visceral imagery, though not its human impact. For classroom use, the gym speech, Strauss confirmation hearing, and Kitty's interrogation would best showcase these tensions. Students should watch for how moral weight manifests physically versus intellectually, and where the camera directs attention away from victims.

