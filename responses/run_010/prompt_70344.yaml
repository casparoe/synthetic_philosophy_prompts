prompt: |-
  I serve as returning officer for a professional society of roughly four thousand members. In a year I run about twenty ballots of four quite different kinds: contested officer elections with between three and seven candidates; the technical standards committee, which must settle on one of several competing drafts of a specification in which members' employers hold commercial interests; the prizes committee, selecting from a shortlist of six or eight; and occasional constitutional referendums in which several rival amendment packages appear on the ballot together with the status quo. Two years ago an officer election was annulled after a defeated candidate demonstrated that a coordinated bloc had ranked its least-liked serious contender first in order to eliminate a stronger rival, and the executive council now requires a written justification for every rule choice. The councillors are intelligent laypeople with no training in social choice theory, I have a fortnight per ballot, and once the council has adopted the procedure it will be applied by volunteers who know less about this than I do.

  What I currently have is a discouragement rather than a method. I know the Gibbard–Satterthwaite theorem governs this territory — that no deterministic rule over three or more alternatives, able to select any of them and admitting every possible ranking, is immune to strategic voting unless it is dictatorial — but that tells me nothing about what to write on the ballot paper. Please convert the theorem into a standing decision procedure that my assistants and I can run before each ballot.

  The procedure should:

  - begin with the theorem's own hypotheses, recast as plain-language screening questions about the particular contest — how many alternatives there really are once nomination rules and agenda control are taken into account, whether each can in principle win, whether any ranking is admissible, whether the rule is deterministic and returns a single winner — stating for each what answer lets the ballot through to the next question and what answer stops the line;
  - specify what happens once every gate has fired. At that point "choose a strategy-proof rule" is unavailable, and the procedure must hand me an explicit second-best criterion and a way of applying it without mathematics: how to compare candidate rules, for example, by what a successful manipulation stands to gain and by how much coordination, information, and mutual trust it demands;
  - include a diagnostic for the restricted-preference escape — a way for lay people to test whether a given contest really is one-dimensional in the sense the theorem needs, using material we already have (nomination data, a straw poll of rankings), together with a statement of when it would be reckless to rely on the result;
  - deal with the four proposals that arise at every council meeting: switching to score voting, randomizing or drawing lots to break ties, cutting the field to two alternatives in a preliminary round, and letting a chair or small panel decide with the vote treated as advisory. For each, say what the theorem and its extensions do and do not rule out, and what new difficulty the move imports;
  - keep separate, in terms a volunteer can apply, the rule that is manipulable in the theorem's worst-case sense and the ballot that is actually vulnerable on the day, and say which features of a particular contest move it between those categories;
  - mark the steps that are judgment dressed up as procedure, and the points at which the decision must go to a person because it turns on values — what the society is trying to protect — rather than on facts.

  Then run the procedure on three of our ballots: the standards committee, five competing drafts, forty voting members, sustained employer lobbying, presently decided by Borda count; the officer election, six candidates, presently a two-round runoff of the whole membership with a fortnight between rounds; and a constitutional referendum with three rival amendment packages plus the status quo, where the council proposes that the chair cast a deciding vote if no package beats all the others. I am attached to the runoff and would prefer not to be told to abandon it, but I need to know whether the procedure says so, and if it does, what the cheapest defensible replacement would be. Close by stating what the procedure cannot deliver: the questions it will answer badly, and the ways in which a determined bloc could still defeat whatever rule we adopt.
reasoning: |-
  We are designing a decision procedure based on the Gibbard-Satterthwaite theorem to help the returning officer choose a voting rule for various ballots. The procedure must be understandable by laypeople and volunteers. We break it down into steps.

  ### Step 1: Screening Questions (based on the hypotheses of the Gibbard–Satterthwaite theorem)

  We recast the theorem's hypotheses as plain-language screening questions. The theorem states that no deterministic voting rule that is non-dictatorial, has at least three alternatives, can select any alternative (non-imposed), and allows every possible ranking (unrestricted domain) is strategy-proof.

  1. **Number of Alternatives (A)**: 
     - *Question*: "After considering nomination rules and agenda control, how many distinct alternatives (candidates, drafts, amendment packages) are on the ballot? Note: If two alternatives are effectively the same (e.g., because of nomination rules) or if the agenda is set so that some alternatives are not viable, count only the distinct and viable ones."
     - *Stop Condition*: If there are less than 3 alternatives, then the theorem does not apply (because with 1 or 2 alternatives, strategy-proof rules exist, such as majority vote). Proceed to Step 2 only if there are 3 or more.

  2. **Non-Imposed (Sovereignty)**:
     - *Question*: "Could any alternative on the ballot realistically win under some configuration of votes? (That is, is every alternative not ruled out by the rules themselves?)"
     - *Stop Condition*: If the answer is "no" (i.e., there is at least one alternative that cannot win no matter what the votes are), then the rule is imposed. The theorem does not apply. Otherwise (if every alternative can win in some scenario), proceed.

  3. **Unrestricted Domain**:
     - *Question*: "Are voters allowed to rank the alternatives in any order they wish? (That is, are there no restrictions on the preferences they can express?)"
     - *Stop Condition*: If the answer is "no" (i.e., the ballot restricts the rankings, for example, by requiring that certain alternatives are always ranked above others), then the theorem does not apply. Otherwise (if any ranking is allowed), proceed.

  4. **Deterministic and Single Winner**:
     - *Question*: "Does the voting rule always produce a single winner (without any randomness) and without ties? (If ties are possible, we assume they are broken deterministically, e.g., by a fixed rule.)"
     - *Stop Condition*: If the rule is not deterministic (e.g., it uses randomness) or does not always produce a single winner (e.g., it might return a tie without a deterministic tie-breaker), then the theorem does not apply. Otherwise, proceed.

  If at any stop condition the answer is "stop", then the theorem does not apply and we can potentially use a strategy-proof rule. However, note that even with fewer than 3 alternatives, we must still choose a rule. Also, if the domain is restricted, we might be in a setting where strategy-proofness is achievable.

  If we pass all the gates (i.e., we have 3 or more alternatives, non-imposed, unrestricted domain, deterministic), then the theorem applies: no non-dictatorial rule is strategy-proof. We then move to Step 2.

  ### Step 2: When the Theorem Applies (All Gates Fired) - Choosing a Second-Best Rule

  Since we cannot have a strategy-proof rule, we must choose a rule that is "least manipulable" in a practical sense. We need an explicit criterion and a way to compare rules without mathematics.

  **Criterion**: We consider the *practical vulnerability* of a rule, which depends on:
  - The *gain* from manipulation: How much a manipulator can improve the outcome (from their perspective) by voting strategically.
  - The *coordination, information, and mutual trust* required: How many voters must coordinate, how much they need to know about others' preferences, and whether they can trust each other to carry out the manipulation.

  We compare candidate rules by asking:

  1. **Gain from Manipulation**:
     - How much better (in terms of the manipulator's own preferences) is the outcome they can achieve by manipulating compared to voting truthfully? (This is hard to quantify, but we can think in relative terms: high, medium, low.)
     - We can use the concept of "minimum size of a manipulating coalition": the smallest number of voters that can change the outcome to one they prefer by voting strategically. The larger this number, the harder it is to manipulate.

  2. **Information Requirements**:
     - Does the manipulation require precise knowledge of other voters' preferences? (High information requirements make manipulation harder.)

  3. **Coordination and Trust**:
     - How many voters must coordinate? (More voters make it harder.)
     - Do they need to trust each other? (If the manipulation requires a precise pattern of voting and defection could lead to a worse outcome, trust is critical.)

  **Procedure for Comparing Rules**:
  - For each rule under consideration, we ask: 
     a) What is the smallest group of voters that could manipulate the outcome? (We can look for known results in social choice, but for laypeople, we can use a simple scale: e.g., "very small (1-2)", "small (3-10% of voters)", "moderate (10-20%)", "large (>20%)".)
     b) How much information would they need? (e.g., "exact knowledge of the entire profile", "knowledge of the front-runners", "little information".)
     c) How difficult is coordination? (e.g., "requires a large organized bloc", "a few voters can act independently", "needs precise vote distribution".)

  We then choose the rule that requires the largest coalition, the most information, and the highest coordination to manipulate. If two rules are comparable, we may choose the one that is simpler to administer.

  ### Step 3: Diagnostic for the Restricted-Preference Escape (One-Dimensionality)

  The theorem assumes unrestricted preferences. If preferences are restricted (e.g., single-peaked), then strategy-proof rules (like the median voter rule) exist.

  **Diagnostic for One-Dimensionality**:
  - We use the available data: nomination data and a straw poll of rankings.
  - **Method**:
     a) From the straw poll, we try to order the alternatives on a line such that every voter's preferences are single-peaked (each voter has an ideal point and prefers alternatives closer to it).
     b) We can plot the rankings: for each voter, note their top choice. Then we see if the top choices are clustered in a way that suggests a left-right spectrum. Alternatively, we can use the following procedure:
        - Assign each alternative a position based on the average ranking it receives (but note: this might not be linear).
        - Check if voters' rankings are consistent with single-peakedness: for any three alternatives A, B, C, with B between A and C on the line, no voter ranks B last if A and C are both above B? (This is difficult without the actual ordering.)

  A simpler method for laypeople:
  - **Straw Poll Analysis**: Ask a sample of voters to rank the alternatives. Then, try to arrange the alternatives in a fixed order (e.g., left to right) that reflects the overall pattern. For each voter, check if their ranking has a single peak (their preference rises to a peak and then falls). If a high proportion (say >90%) of the voters have single-peaked preferences with respect to the same ordering, then we can assume one-dimensionality.

  **When it is reckless to rely**:
  - If the straw poll shows significant disagreement in the ordering (e.g., many voters have multiple peaks) or if the issue is known to be multi-dimensional (e.g., in the standards committee, different employers might care about different aspects of the specification), then it is reckless to assume single-peakedness.
  - Also, if the ballot is about a complex issue (like constitutional amendments) that cannot be easily placed on a left-right spectrum.

  If we find strong evidence of single-peakedness, we can use a rule that is strategy-proof for such domains (like the median voter rule for single-winner). Otherwise, we cannot rely on this escape.

  ### Step 4: Dealing with Common Proposals

  For each proposal, we state what the theorem and extensions do and do not rule out, and what new difficulties arise.

  1. **Switching to Score Voting (Range Voting)**:
     - *Gibbard-Satterthwaite*: Score voting is not a ranking-based rule, so the theorem does not directly apply. However, it is still manipulable (by exaggerating scores). Gibbard proved that any non-dictatorial voting rule with at least three alternatives is manipulable, and this includes score voting.
     - *New Difficulties*: Voters might not understand how to assign scores. Also, it is sensitive to the range chosen (e.g., 0-5 vs 0-10). It may lead to ties that require tie-breaking.

  2. **Randomizing or Drawing Lots to Break Ties**:
     - *Gibbard-Satterthwaite*: The theorem assumes determinism. If we use randomness (e.g., to break ties), then the rule is not deterministic. However, Gibbard's extension to random rules (1977) shows that only random dictatorships are strategy-proof. So if we break ties randomly, we are still vulnerable to manipulation in the deterministic part. Also, randomness might be seen as unfair.
     - *New Difficulties*: Random tie-breaking can lead to outcomes that are not representative and might be challenged as arbitrary.

  3. **Cutting the Field to Two Alternatives in a Preliminary Round**:
     - *Gibbard-Satterthwaite*: This is a two-round system. The theorem applies to the entire system. The first round (with multiple alternatives) is vulnerable to strategic voting (e.g., burying a strong candidate). Also, the second round (with two alternatives) is strategy-proof (by majority vote). But the overall system is not strategy-proof because of the first round.
     - *New Difficulties*: The preliminary round might eliminate a candidate that would have won in the final round (the Condorcet winner) but didn't because of vote-splitting. Also, it requires two rounds, which is more costly.

  4. **Letting a Chair or Small Panel Decide with the Vote Advisory**:
     - *Gibbard-Satterthwaite*: The theorem does not apply to the advisory vote because the vote does not determine the winner. The chair/panel acts as a dictator. However, the advisory vote might influence the chair, but the rule is dictatorial (so the theorem does not apply because it is dictatorial). But note: the theorem requires non-dictatorship. So if the chair is a dictator, the rule is strategy-proof (but dictatorial).
     - *New Difficulties*: This removes the democratic nature of the vote. The society might object to giving so much power to the chair. Also, the chair might be influenced by the advisory vote, but then the chair's decision becomes strategic.

  ### Step 5: Separating Rule Manipulability and Actual Vulnerability

  - **Rule Manipulable in the Worst-Case Sense**: This is a theoretical property: there exists some preference profile where a voter or group of voters can benefit by voting strategically.
  - **Actual Vulnerability on the Day**: This depends on the specific context: the number of voters, the distribution of preferences, and the presence of coordinated blocs.

  **Features that move a contest from manipulable in theory to vulnerable in practice**:
  - **Coordination**: If a bloc is organized and can instruct its members how to vote, vulnerability increases.
  - **Information**: If the preferences of the electorate are known (e.g., from polls), then a bloc can plan manipulation.
  - **Incentives**: If the stakes are high (e.g., commercial interests in the standards committee), then there is motivation to manipulate.

  **For Volunteers**: Explain that a rule might be manipulable in theory but in practice, without a coordinated bloc and without precise information, it might be safe. Conversely, if there is a known bloc (like the one that caused the annulment) and the rule is known to be vulnerable to a small coalition, then it is actually vulnerable.

  ### Step 6: Marking Judgment and Value Decisions

  - **Judgment Steps**:
     - Step 3 (diagnostic for one-dimensionality): Requires interpreting straw poll data and deciding if preferences are single-peaked. This is judgment.
     - Step 2 (comparing rules by practical vulnerability): Assessing the size of the manipulating coalition, information requirements, and coordination difficulty requires judgment (unless there are known studies for the specific rule and electorate size).

  - **Value Decisions**:
     - When choosing a rule, we must consider what the society values: e.g., fairness, simplicity, resistance to manipulation, or the Condorcet criterion. The procedure cannot make these value judgments; the council must decide.
     - Also, in Step 4, the decision to use a dictatorial rule (like the chair deciding) is a value decision about democracy versus efficiency.

  ### Running the Procedure on Three Ballots

  We now apply the procedure to the three examples.

  #### 1. Standards Committee: Five competing drafts, 40 voting members, Borda count.

