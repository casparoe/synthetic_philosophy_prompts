     **Recommendation**: The two-round runoff is vulnerable to the kind of manipulation that occurred. The cheapest defensible replacement would be to switch to approval voting (which is simple and avoids vote-splitting) or to IRV (which allows rankings). Approval voting might be easier for the volunteers. However, the returning officer is attached to the runoff. We note that the runoff is vulnerable, so if they want to keep a two-round system, they might consider a Condorcet method (but that is complex). Alternatively, they could keep the runoff but require voters to rank all candidates in the first round (i.e., use a ranked ballot and then take the top two based on first preferences) — this is still vulnerable, but perhaps less so? Actually, no: the vulnerability is similar. 

