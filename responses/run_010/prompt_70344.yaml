     - Deterministic: Borda count is deterministic (with a fixed tie-break rule). Proceed.

    Theorem applies.

  - **Second-Best Rule**:
     - We are currently using Borda count. We must compare it to alternatives (e.g., plurality, Condorcet method, approval, etc.). 
     - Borda count is known to be highly manipulable by small groups (even one voter can sometimes change the outcome by misrepresenting). It requires low information (only knowing the front-runners) and little coordination (a single voter can act alone). 
     - We might consider a rule that is harder to manipulate, such as:
          - Instant Runoff Voting (IRV): Requires a larger coalition to manipulate? (Actually, IRV can be manipulated by a small group if they know the exact distribution. But it is generally considered more robust than Borda.)
          - Approval voting: Voters can vote for as many as they approve. It is simpler but still manipulable (by deciding the approval threshold). However, it is less manipulable than Borda? [Note: There is no clear ranking, so strategic voting might be different.]
     - Given the high stakes (commercial interests) and the small electorate (40 members), coordination and information might be available. Therefore, Borda is highly vulnerable. We should consider a rule that requires a larger coalition to manipulate. For example, the Condorcet method (if there is a Condorcet winner) is hard to manipulate because it requires changing the outcome in many pairwise comparisons. But it is complex.

     **Recommendation**: Given the small size and high stakes, consider using a Condorcet method (like Schulze) or approval voting. If we want simplicity, approval voting might be better. But note: the Gibbard-Satterthwaite theorem applies to approval voting (as a non-ranking rule) but it is still manipulable. However, the manipulation might be less severe.

  - **One-Dimensionality Diagnostic**:
     - This is about technical standards. Preferences might be multi-dimensional because different employers care about different features. A straw poll might show if there is a clear ordering (e.g., from least to most restrictive). If we can establish a linear ordering and single-peakedness, then we can use the median voter rule (which is strategy-proof). But without strong evidence, it is reckless to assume.

     Given the lobbying, it is likely that preferences are not single-peaked. Therefore, we cannot rely on this escape.

  - **Common Proposals**:
     - Switching to score: Still manipulable, but perhaps less than Borda? And easier than Condorcet. Might be a good alternative.
     - Randomizing: Not desirable in a high-stakes setting.
     - Preliminary round: With 5 drafts, a preliminary round to select two might be feasible. But then the first round is vulnerable (like in the officer election that was annulled). Also, the Condorcet winner might be eliminated.
     - Chair decides: Given the commercial interests, this might lead to accusations of bias.

     **Conclusion for Standards Committee**: Borda is highly vulnerable. Consider approval or score voting as simpler alternatives that might be less manipulable in practice, or Condorcet if we can handle the complexity. But note: approval and score are cardinal methods, which the theorem also covers (they are not strategy-proof). However, they may be better than Borda. The council must decide on the trade-off.

