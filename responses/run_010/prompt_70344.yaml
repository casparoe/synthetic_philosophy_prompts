answer: |-
  Below is a standing decision procedure derived from the Gibbard-Satterthwaite theorem, designed as a step-by-step guide for you and your assistants. It uses plain-language screening questions, incorporates practical second-best criteria, includes diagnostics for restricted preferences, evaluates common proposals, separates theoretical manipulability from real-world vulnerability, and flags judgment/value-based decisions. The procedure is structured to be run by volunteers with minimal training.

  ---

  ### **Standing Decision Procedure for Ballot Rules**

  #### **Step 1: Screening Questions (Based on Gibbard-Satterthwaite Hypotheses)**
  Answer each question for the specific ballot. If any answer is "no," the theorem **does not apply**—proceed to Step 2A. If all answers are "yes," the theorem **applies**—proceed to Step 2B.

  1. **Number of Alternatives**:  
     - *Question*: "After accounting for nomination rules and agenda control, are there **three or more distinct alternatives** that could realistically win? (Ignore 'filler' candidates or non-viable drafts.)"  
     - **Stop the line if NO** (theorem does not apply).  
     - **Proceed if YES** (≥3 alternatives).  

  2. **Non-Imposed (Sovereignty)**:  
     - *Question*: "Could **any alternative win** under *some* voting pattern? (i.e., no alternative is mathematically eliminated by the rules.)"  
     - **Stop the line if NO** (theorem does not apply).  
     - **Proceed if YES** (every alternative is viable).  

  3. **Unrestricted Domain**:  
     - *Question*: "Can voters **rank any combination** of alternatives? (i.e., no rules forbid specific rankings, like ranking a 'fringe' candidate first.)"  
     - **Stop the line if NO** (theorem does not apply).  
     - **Proceed if YES** (all rankings allowed).  

  4. **Deterministic and Single Winner**:  
     - *Question*: "Does the rule **always produce one winner** without randomness? (Tie-breakers must be non-random, e.g., alphabetical order.)"  
     - **Stop the line if NO** (theorem does not apply).  
     - **Proceed if YES** (deterministic).  

  #### **Step 2: Decision After Screening**
  - **Step 2A: Theorem DOES NOT Apply** (one or more "no" answers):  
    - Strategy-proof rules *may* exist. Use a simple rule like **majority vote** (for 2 alternatives) or **approval voting** (if domain is restricted).  
    - *Volunteer action*: Proceed to vote with the existing rule. No further analysis needed.  

  - **Step 2B: Theorem APPLIES** (all "yes" answers):  
    - No strategy-proof rule exists. Use **second-best criteria** to compare rules:  
      1. **Manipulation Cost**: How much can manipulators gain?  
         - *Low gain*: Manipulation only slightly improves the outcome for the bloc.  
         - *High gain*: Manipulation drastically changes the winner (e.g., worst-case to best-case).  
      2. **Coordination Burden**: What does successful manipulation require?  
         - *Low burden*: A small bloc (<5% of voters) with minimal coordination.  
         - *High burden*: A large bloc (>20%) needing precise vote distribution, polling data, and mutual trust.  
      3. **Information Need**: What must manipulators know?  
         - *Low need*: Only public info (e.g., "Candidate X is leading").  
         - *High need*: Detailed knowledge of others' rankings.  
    - *Volunteer action*:  
      - Compare candidate rules using the table below. **Choose the rule with the highest burden/need and lowest gain.**  
      - If rules are tied, default to the simplest option.  

  | Rule              | Manipulation Gain | Coordination Burden | Information Need |  
  |-------------------|-------------------|---------------------|------------------|  
  | **Borda Count**   | High (easy to swap ranks) | Low (small bloc)    | Low (know front-runners) |  
  | **Plurality**     | High (vote-splitting) | Low (small bloc)    | Low              |  
  | **IRV/RCV**       | Medium (depends on rounds) | Medium (moderate bloc) | Medium (know eliminations) |  
  | **Approval**      | Low (limited impact) | Medium (bloc needed) | Low              |  
  | **Condorcet**     | Low (hard to flip pairs) | High (large bloc)   | High (exact rankings) |  

  #### **Step 3: Restricted-Preference Diagnostic (One-Dimensionality Escape)**  
  - *Purpose*: Check if preferences are "one-dimensional" (e.g., liberal-conservative spectrum). If so, strategy-proof rules like **median voter** may work.  
  - *Diagnostic for Volunteers*:  
    1. Use **nomination data** to list alternatives.  
    2. Conduct a **straw poll** asking 10% of voters to rank alternatives.  
    3. **Test for one-dimensionality**:  
       - Plot each voter's top choice on a line (e.g., left/right).  
       - If >80% of voters have a single "peak" (preferences decrease as they move away from their top choice), preferences are one-dimensional.  
  - *When Reckless to Rely*:  
    - If <80% of polls show single peaks, OR the ballot involves **multiple conflicting issues** (e.g., constitutional amendments mixing term limits and funding).  
    - *Volunteer action*: If diagnostic passes, use **median voter rule**. Else, proceed to Step 2B.  

  #### **Step 4: Common Proposals Evaluation**  
  For each proposal, state:  
  - **Gibbard-Satterthwaite Status**: Does the theorem still apply?  
  - **New Difficulties**: Practical risks.  

  1. **Switch to Score Voting**:  
     - *Theorem*: Still applies (non-immunizable in theory).  
     - *New Difficulties*: Exaggerated scores (voters min/max ratings); unclear interpretation of "average score"; encourages strategic dishonesty.  

  2. **Randomize/Tiebreak by Lot**:  
     - *Theorem*: **Does not apply** (non-deterministic), but Gibbard's 1977 extension shows randomization only helps if rule is a lottery.  
     - *New Difficulties*: Loss of legitimacy; perceived unfairness; no strategy-proof advantage.  

  3. **Preliminary Round (Cut to Two)**:  
     - *Theorem*: Still applies (first round has ≥3 alternatives).  
     - *New Difficulties*: Vote-splitting in first round; eliminates Condorcet winners; doubles coordination opportunities.  

  4. **Chair/Panel Decides (Vote Advisory)**:  
     - *Theorem*: **Does not apply** if chair is dictator, but violates non-dictatorship.  
     - *New Difficulties*: Loss of member trust; chair subject to lobbying; no strategy-proof gain.  

  #### **Step 5: Separating Theoretical vs. Actual Vulnerability**  
  - **Theoretical Manipulability**: Inherent to the rule (per theorem).  
  - **Actual Vulnerability**: Depends on:  
    - **Coordination**: Is there a cohesive bloc (e.g., employers in standards committee)?  
    - **Information**: Are polls/public data available?  
    - **Stakes**: High stakes (e.g., commercial interests) incentivize manipulation.  
  - *Volunteer action*:  
    - If bloc exists + stakes high + information available → **high actual vulnerability** (avoid rules with low coordination burden).  
    - Else → **low actual vulnerability** (use simpler rules).  

  #### **Step 6: Judgment and Value Decisions**  
  - **Judgment Steps** (Volunteers flag for your review):  
    - Step 1: Deciding "distinct alternatives" (e.g., are two drafts meaningfully different?).  
    - Step 3: Interpreting the straw poll (e.g., is 79% single-peaked "close enough"?).  
    - Step 5: Assessing bloc cohesion/stakes (e.g., is employer lobbying "coordinated"?).  
  - **Value Decisions** (Council must decide):  
    - Trade-offs: **Fairness** (e.g., Condorcet) vs. **simplicity** (e.g., approval) vs. **resistance** (e.g., high-coordination rules).  
    - What society values: Preventing commercial capture? Maximizing participation? Legitimacy?  

  ---

  ### **Application to Your Ballots**  
  #### **1. Standards Committee (5 Drafts, Borda Count)**  
  - **Step 1 Screening**:  
    - Alternatives: 5 drafts (≥3) → **yes**.  
    - Non-imposed: Any draft can win → **yes**.  
    - Unrestricted domain: Any ranking allowed → **yes**.  
    - Deterministic: Borda is deterministic → **yes**.  
    → **Theorem applies** (proceed to Step 2B).  
  - **Step 2B (Second-Best)**:  
    - Current rule: **Borda** (high gain, low burden, low info need).  
    - Alternatives: **Approval** (lower gain, medium burden) or **Condorcet** (low gain, high burden).  
    - **Recommendation**: Switch to **Condorcet** (high stakes require high coordination burden).  
  - **Step 3 (One-Dimensionality)**:  
    - Unlikely (commercial interests → multi-dimensional). Diagnostic **reckless** → skip.  
  - **Common Proposals**:  
    - Score voting: Still manipulable; exaggerations likely.  
    - Chair decides: High trust risk given lobbying.  
  - **Vulnerability**: **High actual vulnerability** (bloc exists + stakes high).  

  #### **2. Officer Election (6 Candidates, Two-Round Runoff)**  
  - **Step 1 Screening**:  
    - Alternatives: 6 candidates (≥3) → **yes**.  
    - Non-imposed: Any can win → **yes**.  
    - Unrestricted domain: Runoff allows any ranking → **yes**.  
    - Deterministic: Yes → **yes**.  
    → **Theorem applies** (proceed to Step 2B).  
  - **Step 2B (Second-Best)**:  
    - Current rule: **Runoff** (high gain: blocs can bury rivals; low burden).  
    - **Recommendation**: Abandon runoff (vulnerable to blocs). **Cheapest defensible replacement: Approval voting**. Simplest, lower gain, and blocs must coordinate approvals.  
    - *IRV alternative*: Better but harder for volunteers; still manipulable with medium burden.  
  - **Step 3 (One-Dimensionality)**:  
    - Unlikely (officer elections multi-dimensional) → skip.  
  - **Common Proposals**:  
    - Preliminary round: Worsens vote-splitting.  
    - Randomize: Unfair for elections.  
  - **Vulnerability**: **High actual vulnerability** (past bloc manipulation).  

  #### **3. Constitutional Referendum (3 Packages + Status Quo, Chair Decides)**  
  - **Step 1 Screening**:  
    - Alternatives: 4 (≥3) → **yes**.  
    - Non-imposed: Any can win → **yes**.  
    - Unrestricted domain: Any ranking → **yes**.  
    - Deterministic: Chair tie-break is deterministic → **yes**.  
    → **Theorem applies**.  
  - **Step 2B (Second-Best)**:  
    - Proposed rule: **Condorcet with chair tie-break**.  
    - Risk: If no Condorcet winner, chair decides (values decision).  
    - **Recommendation**: Use **Condorcet** but **replace chair tie-break with Borda** (avoids dictatorship).  
  - **Step 3 (One-Dimensionality)**:  
    - Plausible (amendments often linear). Run diagnostic → if passes, use median voter.  
  - **Common Proposals**:  
    - Chair decides: Theorem bypassed but violates democracy.  
    - Score: Unsuited for constitutional issues.  
  - **Vulnerability**: **Medium** (low stakes but potential for blocs).  

  ---

  ### **What the Procedure Cannot Deliver**  
  1. **Perfect Strategy-Proofness**: A determined bloc with resources can always exploit non-dictatorial rules.  
  2. **Small Electorates**: Under 100 voters, all rules are highly vulnerable (blocs need minimal coordination).  
  3. **Multi-Dimensional Issues**: One-dimensionality diagnostic is unreliable for complex topics (e.g., technical standards).  
  4. **Predicting Human Behavior**: Cannot quantify "trust" or "information leakage" in blocs.  
  5. **Value-Free Choices**: Trade-offs (fairness vs. simplicity) require council input.  

  **Final Note**: The procedure minimizes vulnerability but cannot eliminate it. Focus on increasing coordination costs for blocs (e.g., Condorcet for standards committee, approval for officers). For volunteers, emphasize simplicity and transparency to build trust.
