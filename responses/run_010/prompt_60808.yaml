answer: |-
  Here's a structured, interactive sorting quiz designed to map concrete intuitions onto accuracy-first epistemology positions without naming any views, philosophers, or technical terms. Each question is a scenario or claim with 2-3 intuitive options (max 3 sentences). The branching tree leads to 8 distinct leaves derived from logical combinations of your axes. I'll first give the questions, then the branching logic, then the leaf descriptions, gaps, and indistinguishable leaves.

  ---

  ### **The Quiz: 11 Concrete Questions**
  1. **Calibration vs. Resolution**  
     Forecaster A often says "70%" and is right exactly 70% of the time (perfectly calibrated) but only uses probabilities like 50%, 70%, or 90%. Forecaster B uses more varied probabilities (e.g., 10%, 95%) and has better overall accuracy (Brier score) but is imperfectly calibrated. Who is better?  
     - A: Forecaster A (calibration matters more)  
     - B: Forecaster B (resolution matters more)  

  2. **Infinite Penalty**  
     A model assigns 0% probability to an event that ends up happening. Should this mistake be punished infinitely harshly (e.g., log loss)?  
     - A: Yes, extreme errors deserve extreme penalties.  
     - B: No, no single error should be infinitely bad.  

  3. **Scoring Holism**  
     When grading a set of forecasts (e.g., rain, inflation, election), should the total inaccuracy just be the sum of inaccuracies for each forecast?  
     - A: Yes, sum them independently.  
     - B: No, the whole set should be graded together (e.g., interactions matter).  

  4. **Strict Incentives**  
     If a scoring rule sometimes allows multiple "best" reports for the same belief (e.g., two different probabilities are equally good), is that acceptable?  
     - A: Yes, as long as honest reporting is optimal.  
     - B: No, only one report should be optimal for each belief.  

  5. **Evidence Access**  
     When we say an agent "has evidence," does this mean they know they have it (e.g., they see a weather report), or could they have evidence without realizing it (e.g., subtle environmental cues they didn’t notice)?  
     - A: They know they have it.  
     - B: They might not realize it.  

  6. **Bounded Computation**  
     An agent can’t list all hypotheses (e.g., due to memory limits). If violating probability axioms (e.g., P(A) + P(¬A) ≠ 1) improves accuracy, is that rational?  
     - A: Yes, if it boosts accuracy under constraints.  
     - B: No, axioms must be followed regardless.  

  7. **Plan vs. Snapshot**  
     Should we evaluate an agent’s *plan* for updating beliefs (e.g., "if I see data X, I’ll believe Y") or just their *current* beliefs?  
     - A: Current beliefs only.  
     - B: The updating plan matters too.  

  8. **Updating Evaluation Time**  
     If we evaluate an updating plan, should we judge it based on the beliefs the agent had *before* seeing new evidence?  
     - A: Yes, use their prior beliefs.  
     - B: No, judge it independently.  

  9. **Robustness to Scoring Rules**  
     Should agents pick beliefs that perform well across *many possible scoring rules* (not just one), even if it worsens performance under their favorite rule?  
     - A: No, maximize accuracy under one rule.  
     - B: Yes, avoid fragility to rule choice.  

  10. **Permissible Priors**  
      Two agents with identical evidence have different initial beliefs (priors) and thus different final probabilities. Could both be equally accurate?  
      - A: Yes, evidence doesn’t force one probability.  
      - B: No, one must be more accurate.  

  11. **Higher-Order Evidence**  
      An agent learns their cognitive process was impaired (e.g., sleep-deprived) when interpreting evidence. Should they revise their belief, even if the evidence itself hasn’t changed?  
      - A: Yes, it affects their accuracy.  
      - B: No, stick to the original evidence.  

  ---

  ### **Branching Tree to Leaves**
  Follow paths based on answers. Letters correspond to question numbers (e.g., 1A, 2B).  
  ```mermaid
  graph TD
      Start --> 1
      1A --> I[Leaf I: Calibrationist]
      1B --> 2
      2A --> 3
      2B --> 3
      3A --> 7
      3B --> E[Leaf E: Holistic Scorer]
      7A --> 6
      7B --> 4
      4A --> 10
      4B --> 5
      5A --> 8
      5B --> H[Leaf H: Framework Breaks]
      6A --> H
      6B --> 11
      11A --> H
      11B --> 9
      8A --> B[Leaf B: Expected-Accuracy Updater]
      8B --> C[Leaf C: Dominance-Avoidant Updater]
      9A --> A[Leaf A: Coherence-Only]
      9B --> 10
      10A --> G[Leaf G: Permissivist]
      10B --> F[Leaf F: Robustness-Seeker]
  ```

  ---

  ### **Leaf Descriptions**
  After branching, map terminal leaves to positions. Labels are descriptive; names are added only where uncontroversial.  
  - **Leaf A: Coherence-Only**  
    Accuracy justifies probabilistic coherence (P(A) + P(¬A) = 1), but not updating rules. Rejects deriving updates from accuracy.  
  - **Leaf B: Expected-Accuracy Updater**  
    Updates by maximizing *expected accuracy from prior beliefs* (e.g., conditionalization is optimal *given your own prior*). Named: *Greaves & Wallace*.  
  - **Leaf C: Dominance-Avoidant Updater**  
    Updates to avoid accuracy-domination (no prior needed). Requires separable scoring. Named: *Briggs & Pettigrew*.  
  - **Leaf E: Holistic Scorer**  
    Scores entire belief distributions non-separably (rejects summing proposition-wise scores).  
  - **Leaf F: Robustness-Seeker**  
    Maximizes worst-case or average performance across scoring rules (avoids fragility). Rejects "one true rule."  
  - **Leaf G: Permissivist**  
    Many priors are equally accuracy-optimal given the same evidence (no unique rational credence).  
  - **Leaf H: Framework Breaks**  
    Accuracy-first consequentialism fails for higher-order evidence, bounded agents, or non-internal evidence. Named: *Critics (e.g., Schoenfield)*.  
  - **Leaf I: Calibrationist**  
    Prioritizes calibration (reliability) over resolution/sharpness. Common in forecasting practice, rare in philosophy.  

  ---

  ### **Logically Possible but Unoccupied Combinations**  
  1. **Holistic + Strictly Proper (3B + 4B)**  
     - *Status*: Empty (likely incoherent). Strict propriety typically assumes separability.  
  2. **Bounded-Optimal Violations + Plan Evaluation (6A + 7B)**  
     - *Status*: Empty (unattractive). If violations help bounded agents, why care about plans?  
  3. **Worldly Evidence + Dominance-Avoidant Updating (5B + 8B)**  
     - *Status*: Empty (unattractive). Dominance arguments assume evidence is internal.  

  ---

  ### **Indistinguishable Leaves & Splitting Question**  
  - **Leaf A (Coherence-Only) vs. Leaf G (Permissivist)**  
    Both might reject deriving updating (9A). *Split with*:  
    > "Can two agents with identical evidence and *identical priors* have equally accurate beliefs?"  
    - A: No → Leaf A  
    - B: Yes → Leaf G  

  - **Leaf B (Expected-Accuracy) vs. Leaf C (Dominance-Avoidant)**  
    Separated by Q8 (updating evaluation time).  

  ---

  ### **Key Design Notes**  
  - **Axes Covered**:  
    - Separability (Q3), Strictly Proper (Q4), Boundedness (Q2, Q6), Evidence Access (Q5), Plan vs. Snapshot (Q7, Q8), Calibration/Sharpness (Q1).  
    - Bounded agents (Q6), Calibration/Resolution (Q1), and Higher-Order Evidence (Q11) are explicitly included.  
  - **Bounded Agents (Q6)**: No major epistemology defense exists for violating axioms to gain accuracy. Positions split on whether this *breaks the framework* (Leaf H) or is irrational (others).  
  - **Log Score (Q2)**: Unbounded penalty is rejected in Leaf H (breaks framework) and robustness-seeking (Leaf F).  
  - **Efficiency**: 11 questions fit in 10 minutes (1 minute per question). Participants vote A/B; branching is deterministic.  

  This structure forces distinctions via cases (e.g., calibration vs. resolution, infinite penalties) while hiding jargon. The leaves capture your requested positions, with gaps noted.
