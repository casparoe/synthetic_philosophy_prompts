  1. Strictly proper vs. merely proper scoring rules.
  2. Separable (additive) vs. holistic (non-separable) scoring.
  3. Bounded vs. unbounded inaccuracy measures.
  4. Evaluating a single credence function vs. an updating plan.
  5. Evidence as internally accessible vs. a function of the world.

  Additionally, we must include:
  - A question on the calibration-vs-sharpness split (using the Brier decomposition).
  - A question about an agent with hard compute limits (bounded rationality).

  The leaves we aim to represent (with tentative labels or descriptions) are:

  A. Coherence-only: accuracy justifies coherence (probabilism) but not updating rules.
  B. Expected-accuracy maximizer: conditionalization as maximizing expected accuracy from the prior's perspective.
  C. Accuracy-dominance for updating: updating rules are chosen to avoid accuracy-dominance, independent of prior.
  D. Updating plan evaluated against prior credences.
  E. Non-separable/holistic scorer.
  F. Robustness/resilience: maximize worst-case or average over a set of scoring rules.
  G. Permissivist: many priors are equally accuracy-optimal given the same evidence.
  H. Consequentialist framing breaks: due to higher-order evidence or logical omniscience.

  We will also note combinations that are logically possible but unoccupied and any indistinguishable leaves.

  The questions must be concrete and intuitive. Let's design the questions and then the branching.

  Question Design:

  1. **Calibration vs. Sharpness**: You have two forecasters. Forecaster A is perfectly calibrated: when they say 70%, it rains exactly 70% of the time. But they are not sharp: they only ever say 50%, 70%, or 90%. Forecaster B is not perfectly calibrated but is sharper: they use a wider range of probabilities and their forecasts are more informative (e.g., they sometimes say 10% or 100%), and their Brier score is better. Which forecaster do you think is more accurate?
     - Option A: Forecaster A (calibration is key)
     - Option B: Forecaster B (sharpness/resolution is key)

     This question keys into the decomposition of Brier score (reliability vs. resolution). It may separate those who focus on calibration from those who focus on resolution.

  2. **Boundedness (Infinity Penalty)**: Consider a model that assigns a probability of 0 to an event that actually happens. Should the inaccuracy score for that event be infinitely bad?
     - Option A: Yes, because certainty in a falsehood is the worst kind of error.
     - Option B: No, because no single error should be infinitely bad; we want to avoid models being destroyed by one mistake.

     This relates to whether the inaccuracy measure is bounded (like Brier) or unbounded (like log loss).

  3. **Separability**: When evaluating the accuracy of a set of beliefs, should the inaccuracy of the whole set be just the sum of the inaccuracies for each individual belief, or can there be interactions so that the whole is not simply the sum of the parts?
     - Option A: The whole should be the sum of the parts (separable).
     - Option B: There can be interactions (non-separable/holistic).

  4. **Strictly Proper vs. Merely Proper**: Imagine a scoring rule that encourages honesty because the best score is achieved by reporting your true probability (proper). But sometimes, there are multiple reports that achieve the same best score. Do you think that's acceptable, or must there be a unique best report for each possible truth?
     - Option A: It's acceptable if multiple reports are equally good (merely proper is enough).
     - Option B: There must be a unique best report for each truth (strictly proper required).

  5. **Updating Plan Evaluation**: Suppose an agent forms a plan for how to update their beliefs upon receiving new evidence. Should we evaluate this plan based on how accurate it is expected to be from the perspective of the agent's prior beliefs, or should we evaluate it in some other way (e.g., by how it performs across possible evidence sequences, without weighting by the prior)?
     - Option A: Evaluate by prior expectations (prior-weighted).
     - Option B: Evaluate by some other criterion (e.g., worst-case or across all possibilities without prior weights).

  6. **Evidence as Internal vs. Worldly**: When we say an agent has evidence E, does this mean that the agent is in a particular internal state (so that they know they have E), or does it depend on the external world (so that the agent might have E without knowing it, or think they have E when they don't)?
     - Option A: Evidence is internal (the agent knows they have it).
     - Option B: Evidence is a function of the world (the agent might not be sure what evidence they have).

  7. **Bounded Rationality (Hard Compute Limits)**: An agent has limited computational resources and cannot consider every possible hypothesis. They assign a probability to a hypothesis without having considered all the alternatives. Is it acceptable if their assigned probabilities violate the probability axioms (e.g., don't sum to 1) if that leads to better accuracy in practice?
     - Option A: Yes, because the axioms are only optimal for ideal agents without limits.
     - Option B: No, because the axioms define what it means to be rational, even for bounded agents.

  8. **Higher-Order Evidence**: Suppose an agent has evidence E and forms a belief based on E. Then they get evidence about the quality of their own reasoning (e.g., they learn that they were sleep-deprived when reasoning about E). Should they adjust their belief even if the first-order evidence E hasn't changed?
     - Option A: Yes, because higher-order evidence is relevant to the accuracy of their belief.
     - Option B: No, because the only thing that matters is the first-order evidence.

     This might help identify those who think consequentialist framing breaks.

  9. **Permissivism**: Two agents with the same evidence have different priors and end up with different credences. Could both sets of credences be equally accurate?
     - Option A: Yes, accuracy doesn't uniquely determine the best credence.
     - Option B: No, for any given body of evidence there is a unique most accurate credence (or at least a set of equally accurate ones, but the priors might lead to different ones that aren't equally accurate).

     This is for the permissivism leaf.

  10. **Robustness**: When choosing a credence, should you pick one that maximizes the worst-case accuracy (over possible scoring rules or possible worlds) or one that maximizes expected accuracy under your own prior?
      - Option A: Maximize expected accuracy under your prior.
      - Option B: Maximize worst-case accuracy (or average over a set of scoring rules).

  11. **Logical Omniscience**: Should an ideal agent assign probability 1 to all logical truths?
      - Option A: Yes, because logical truths are always true and the agent should be certain of them.
      - Option B: No, because agents are not logically omniscient and might not know all logical truths.

      This relates to whether the framework breaks for logical omniscience.

  12. **Single vs. Plan**: When evaluating an agent for accuracy, should we look only at their current credences, or also at how they update their credences over time?
      - Option A: Only the current credences matter.
      - Option B: The updating plan also matters.

