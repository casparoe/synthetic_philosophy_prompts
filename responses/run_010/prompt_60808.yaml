prompt: |-
  So context first: I'm an ML/backend engineer, zero philosophy coursework, and I fell into this accuracy-first epistemology stuff the dumbest way possible. Our team argues about calibration constantly — log loss vs Brier, whether a model that's well-calibrated but useless is "right" — and somebody dropped a link to an argument that the probability axioms are basically what you get if you insist your forecasts be scored by a strictly proper scoring rule and refuse to be accuracy-dominated. Three weeks later I'm deep in "inaccuracy measures" and "epistemic utility" and I have to give a 45 minute lunch talk to about twelve data scientists who are half genuinely curious and half convinced this is just decision theory wearing a trenchcoat. I want to make it interactive with a sorting quiz, "which accuracy-first epistemologist are you actually", but my first attempt was garbage: I kept asking things like "do you think truth is the fundamental epistemic value?" and everybody landed on the same leaf. So the whole point is that the questions have to be concrete setups or plain accept/reject claims that someone who's never read a page of the literature can answer on intuition, and the sorting has to come out of what they say about cases, not what label sounds nice to them.

  What I want: ten to twelve questions, each with two or three options, two to four sentences max per question so I can actually run it in ten minutes of the talk. No question may name a position, a person, or an ism, and no question may directly ask about whether accuracy is the only epistemic value or whether believing is a kind of action. Then give me the branching structure before the names — I'd much rather you derive the axes from the logical space of the debate and only afterwards hang the actual views on the leaves. Axes I want represented, at minimum: whether the inaccuracy measure has to be strictly proper or whether merely proper is enough; whether you score proposition-by-proposition and sum (separable/additive) or score the whole distribution at once; whether the measure has to be bounded, because I'm pretty sure this is where the log score goes sideways — a confident zero that comes out wrong costs you infinity, which makes every finite piece of information worthless; whether you're evaluating one credence function at one moment or a whole trajectory of updates as a plan; and whether the agent's evidence is something they have internal access to or a function of how the world actually is. Also please work in at least one question keyed to the calibration-vs-sharpness split (the reliability/resolution/uncertainty decomposition of the Brier score that our team cares about) since I suspect the philosophy side and the forecasting side disagree about which part of that decomposition is the target, and one question about an agent with hard compute limits who has to assign credences over a hypothesis space it can't fully enumerate — I want to know whether violating the axioms can ever be accuracy-optimal if you're bounded, and if nobody in the literature defends that, say so.

  For the leaves I want at least eight, roughly: someone who thinks accuracy gets you coherence and then goes quiet about updating; the expected-accuracy maximizer for whom conditionalization falls out as the rule that looks best by your own prior lights; the person who wants updating derived from accuracy-dominance instead, precisely so it doesn't depend on which priors you happen to have (I think Briggs and Pettigrew did a version of this?); whoever thinks you have to grade an updating plan against the priors you had before you got the evidence; a non-separable/holistic scorer; a robustness-or-resilience person who thinks maximizing expected accuracy is too fragile and you should pick a credence that holds up across a range of possible scoring situations; a permissivist who thinks lots of priors tie for accuracy-optimal on the same evidence; and someone who thinks the whole consequentialist framing breaks on higher-order evidence or logical omniscience. Name them if you're confident, otherwise describe the view and leave the label blank — I care way more about the structure than the name-dropping, and I'd rather have a gap than a made-up citation. Two more things: after the tree, list the combinations of answers that are logically available but that no view occupies, and tell me for each whether it's empty because the position is incoherent, because it's just unattractive, or because nobody has gotten around to it; and flag any pair of leaves your questions genuinely can't seperate, with the one extra question that would split them.
