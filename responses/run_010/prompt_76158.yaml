answer: |-
  ### Conflict Triage Procedure for Junior Analysts  
  **Goal**: Resolve rule conflicts in ~20 minutes. Escalate non-factual issues.  
  **Outcomes**:  
  - 🟢 **Suppress one rule** (keep the other active).  
  - 🟠 **Quarantine both** (remove from automation; escalate to expert/counsel).  
  - 🔴 **Escalate immediately** (non-factual judgment needed).  

  ---  
  #### Step-by-Step Procedure  
  **Ask these questions in order. Stop at the first conclusive answer.**  

  1. **Is there a real conflict?**  
     - *Ask*: "Do the rules **genuinely contradict** (e.g., one requires action X, the other prohibits X) in the same scenario?"  
     - *No* → Close as false positive.  
     - *Yes* → Proceed.  
     - *Unsure* → 🔴 Escalate (requires contextual judgment).  

  2. **Is one rule obsolete?**  
     - *Ask*: "Does metadata show one rule is **superseded, revoked, or expired**?"  
     - *Yes* → 🟢 Suppress the obsolete rule.  
     - *No* → Proceed.  

  3. **Who has higher authority?**  
     - *Hierarchy*: **Regulator > Head Office Policy > Regional Policy**.  
     - *Ask*: "Is one rule from a **higher authority**?"  
       - *Yes* → 🟢 Suppress the lower-authority rule.  
       - *No (same level)* → Proceed.  
       - *Conflict between equal regulators* → 🔴 Escalate (e.g., two regulators clash).  

  4. **Is one rule more specific?**  
     - *Ask*: "Does one rule **narrowly target** a subset of cases?"  
       - *Yes* → 🟢 Suppress the general rule *only if* authorities are equal.  
       - *No* → Proceed.  

  5. **Can the rules coexist?**  
     - *Ask*: "Is the conflict **spatiotemporal** (e.g., one applies today, the other in 7 years)?"  
       - *Yes* → 🟢 Keep both (no suppression; update conditions if possible).  
       - *No* → Proceed.  

  6. **Is there a meta-conflict?**  
     - *Ask*: "Does this conflict **prevent resolution of other conflicts** (e.g., rules about suppressing rules)?"  
       - *Yes* → 🟠 Quarantine both and escalate.  
       - *No* → 🟠 Quarantine both and escalate.  

  ---  
  #### Key Logic Distinctions to Preserve  
  - **Paraconsistency**: Conflicts won’t "explode" the system if quarantined. *Junior doesn’t need this term, but teach*: "Isolate contradictions; they don’t break everything."  
  - **Dialetheism**: Reject "true contradictions" in compliance. *Junior must know*: "Never accept 'both rules are true'—resolve or escalate."  
  - **Authority Hierarchy**: Non-negotiable. Must survive simplification.  
  - **Specificity vs. Generality**: Drop formal logic terms; use "targeted vs. broad."  

  #### Where the Procedure Misfires  
  - **False Negatives**: Junior may miss spatiotemporal resolutions (Step 5) under time pressure.  
  - **Abuse Risk**: Analysts will skip Step 4 (specificity) to avoid complex analysis and default to suppressing the first rule.  
  - **Blind Spots**:  
    - Rules with overlapping jurisdictions (e.g., global vs. regional conditions).  
    - Conflicts requiring policy waivers (not in metadata).  
    - "De facto" resolutions (e.g., evaluation order) that aren’t compliant.  

  ---  
  ### Applying the Procedure to Your Cases  
  #### Case 1: Head Office vs. Regional Regulator  
  - **Rule A**: Head Office (HO) → "No approval for small transfers."  
  - **Rule B**: Regulator → "Always get local officer sign-off."  
  - **Analysis**:  
    1. **Conflict?** Yes (approval vs. no approval).  
    2. **Obsolete?** Regional text is newer, but HO isn’t revoked → No.  
    3. **Authority?** Regulator > HO Policy → 🟢 **Suppress HO rule**.  
  - **Why**: Regulator trumps internal policy. Specificity is irrelevant.  

  #### Case 2: Retention vs. Minimization  
  - **Rule A**: "Keep suppression logs for 7 years."  
  - **Rule B**: "Delete unneeded data."  
  - **Analysis**:  
    1. **Conflict?** Only if logs are "unneeded" *during* retention.  
    2. **Spatiotemporal?** Logs are needed for 7 years → Rule B doesn’t apply until after 7 years → 🟢 **Keep both** (no conflict).  
  - **Why**: Time-bound purpose resolves the contradiction. "True contradiction" is invalid here.  

  #### Case 3: Long-Running Inconsistency (Evaluation Order Fix)  
  - **Rule A & B**: Inconsistent for 2 years; resolved by "first rule wins."  
  - **Analysis**:  
    1. **Conflict?** Yes.  
    2. **Obsolete?** Assume both current → No.  
    3. **Authority?** Unknown → Proceed.  
    4. **Specificity?** Unknown → Proceed.  
    5. **Coexist?** No → 🟠 **Quarantine both and escalate**.  
  - **Why**: Evaluation order is not a compliant resolution. Sending 40k transactions/month to humans is the **bad news**—but necessary. Automation must stop until rules are fixed.  

  ---  
  ### Straight Talk  
  - **Bad News**: Case 3 forces quarantine → 40k manual reviews/month. This exposes a critical flaw: your system has been non-compliant for years.  
  - **Where It Hurts**:  
    - **Misfires**: Step 4 (specificity) is subjective; juniors will avoid it and over-suppress.  
    - **Escalation Flood**: Expect 20–40% of conflicts to hit Step 6 (meta/unsolved).  
    - **Abuse**: Under ticket pressure, analysts will:  
      1. Skip Step 5 (coexistence checks).  
      2. Default to "suppress regional rule" in Case 1-type conflicts.  
  - **Critical Fix**: Add metadata fields for:  
    - `jurisdiction` (e.g., "EU," "Global").  
    - `expiry_date`.  
    - `required_by_regulation` (for regional policies).  

  **Final Tip**: Use this procedure as a band-aid. Long-term, implement a conflict-checking engine with a paraconsistent logic layer (e.g., Quasi-Classical Logic) to flag contradictions pre-deployment.
