        - If no, close ticket as "false positive". 
        - If yes, proceed.

    2. **Check Temporal Order** (3 minutes)
        - Check the effective dates and amendment history of both rules.
        - If one rule has been superseded by a newer version and is explicitly marked as revoked or replaced, suppress the older rule. Record: "obsolete, superseded by [new rule id]".
        - If both are current, proceed.

    3. **Check Authority Hierarchy** (5 minutes)
        - Determine the source of each rule:
            - Regulatory (R): includes laws, regulations, and official regulatory guidance.
            - Internal Head Office (IHO)
            - Internal Regional Office (IRO) [note: if the regional office is in a different jurisdiction, note it]
        - Apply:
          a. One R and one IHO/IRO: suppress the internal rule. Record: "regulatory precedence".
          b. Both R:
              - Same regulator: if one is newer (step 2), suppress the older; else (same effective time), quarantine both and escalate: "same regulator conflict".
              - Different regulators: quarantine both and escalate: "cross-regulator conflict".
          c. Both internal from the same office (both IHO or both IRO for the same region): go to step 4.
          d. One IHO and one IRO:
              - If the IRO rule has metadata field "required_by_regulation" set to true: suppress the IHO rule. Record: "regional rule mandated by regulation".
              - Else: quarantine both and escalate: "head office vs regional conflict".

    4. **Check Specificity** (5 minutes)
        - Ask: "Is one rule strictly more specific (i.e., it has additional conditions that make it apply to a subset) and the conflict only occurs in that subset?"
        - If yes, then quarantine both and escalate for rule refinement: "requires rule exception addition".
        - If no or unsure, quarantine both and escalate: "unresolved internal conflict".

    5. **Record and Implement** (2 minutes)
        - If a rule is to be suppressed: mark it as inactive in the rulebase (globally) and note the reason.
        - If quarantined: mark both as inactive and create an escalation ticket to expert/legal.

