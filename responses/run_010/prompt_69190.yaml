  Hmm, the user is a teaching assistant for a seminar on periodization, struggling to get students past superficial "it's both" discussions. They need a concrete case study where three philosophical positions (realist, constructivist, pragmatist) yield genuinely different interpretations of the same historical evidence, even with perfect data.

  The constraints are tight: no grand events, no tech shifts, no famous people - just mundane practice changes in a single domain. The shift must be sharp (~15 years) and invisible to standard period markers (art, theology etc.). I'm considering something like dating conventions or will formats - observable but culturally subtle.

  For the case: imagine a historian analyzing signature placement on wills in Dornburg, Germany (1485-1585). Around 1515, testators suddenly shift from signing at document bottom to below specific clauses. No external triggers - just an internal notarial practice change. The historian asks: "Does this represent a meaningful historical break?"

  Now for the positions:
  - Realist sees this as concrete proof of a discontinuity in legal consciousness
  - Constructivist argues it's arbitrary - we could've tracked wax colors instead
  - Pragmatist says it's only a "break" if we care about notarial authority

  The key differentiator is the isolation of the change. If multiple variables shifted simultaneously (e.g., dating + signatures + contract formats), the realist wins. If a 1515 town statute explained it, the pragmatist could still argue it's only significant for specific inquiries.

  For the handout, I'll use American English throughout ("behavior" not "behaviour"), keep the scenario to two paragraphs, then unpack the positions mechanically. The realist's attack on constructivism - that dismissing this change as arbitrary ignores its demonstrable consequences - will highlight genuine philosophical tension.

  This should force students off the fence: the same data leads to three defensible but incompatible conclusions based on premises about what constitutes a "real" historical break.
answer: |-
  ### Case Study: The Dornburg Wills (1485–1585)
  Dr. Lena Vogel studies 4,382 wills from Dornburg, a mid-sized German market town. Between 1510 and 1525, she observes a sharp shift in how testators signed documents. Pre-1510, 97% of wills placed the testator’s signature at the *bottom* of the document. Post-1525, 94% placed signatures *immediately below the specific bequest clauses* they referenced. This change occurred abruptly, centered on 1515 (±5 years), with no detectable cause: no wars, plagues, tech, rulers, or cultural shifts disrupted Dornburg. The town's art, theology, dynastic loyalty, and scholarly output showed uninterrupted continuity. Vogel’s digitized corpus—all surviving wills—leaves no gaps. Her question: **"Does the 1515 shift in signature placement constitute a genuine historical period boundary?"**

  ---

  ### Analysis: Three Verdicts  
  **Historian’s Question:** Does the 1515 signature shift mark a meaningful historical break?  

  1.  **Realist Verdict: YES**  
      Reasoning: The change reflects a concrete discontinuity in *legal self-perception*. Pre-1515 signatures treated the will as a unified whole; post-1515 signatures tied identity directly to individual clauses. This altered how ordinary people linked their personhood to property—a fundamental aspect of lived experience. The labels "Middle Ages" or "Renaissance" miss this, proving their inadequacy.  

  2.  **Constructivist Verdict: NO**  
      Reasoning: The shift is *only* a change in notarial fashion. Vogel could have sorted wills by wax color (no change) or clause length (gradual drift) and seen no "break." Signatures aren’t inherently more "period-defining" than other variables. Calling 1515 a boundary imposes Vogel’s choice to prioritize signatures over equally viable alternatives.  

  3.  **Pragmatist Verdict: ONLY IF ASKING ABOUT NOTARIAL AUTHORITY**  
      Reasoning: For questions like "When did testators begin binding identity to specific legal acts?" 1515 *is* a break. For "When did property values change?" or "When did family structures shift?" it is irrelevant. The discontinuity is real *relative to a specific inquiry*, not a free-floating fact.  

  ---

  ### The Critical Feature  
  The **isolation of the change** forces divergence. The shift occurs *only* in signature placement, with no parallel shifts in other domains (e.g., dating, art, language). This lets positions disagree:  
  - Realists see depth in a lone discontinuity.  
  - Constructivists see arbitrariness in selecting *this* variable.  
  - Pragmatists demand a specific question to activate the break.  

  ### Collapsing the Disagreement  
  - **If multiple shifts coincided at 1515** (e.g., signatures + wage contracts + church graffiti): The realist wins. The clustering suggests a broader rupture, making constructivist arbitrariness less plausible and pragmatism redundant.  
  - **If a 1515 town statute mandated clause signatures**: The pragmatist wins. The cause answers *why* the break matters—it reflects deliberate legal reform, making it significant only for studies of notarial compliance.  

  ### Realist vs. Constructivist: Does the Attack Land?  
  The realist attacks: "You dismiss the signature shift as arbitrary, but it demonstrably changed how courts validated wills after 1525. That’s a *real* consequence in ordinary lives!"  
  **Does it land? PARTIALLY.** It hits the constructivist’s claim that all variables are equal—legal outcomes show signatures *weren’t* arbitrary. But it misses the constructivist’s core point: choosing to frame this as a *period* break (vs. a legal tweak) remains subjective.  

  ---

  ### Handout-Ready Version (2-Paragraph Scenario + Analysis)  
  **[Photocopy from here]**  

  **Case Study: The Dornburg Wills (1485–1585)**  
  Dr. Lena Vogel studies 4,382 wills from Dornburg, a mid-sized German market town. Between 1510 and 1525, she observes a sharp shift in how testators signed documents. Pre-1510, 97% of wills placed the testator’s signature at the *bottom* of the document. Post-1525, 94% placed signatures *immediately below the specific bequest clauses* they referenced. This change occurred abruptly, centered on 1515 (±5 years), with no detectable cause: no wars, plagues, tech, rulers, or cultural shifts disrupted Dornburg. The town’s art, theology, dynastic loyalty, and scholarly output showed uninterrupted continuity. Vogel’s digitized corpus—all surviving wills—leaves no gaps. Her question: **"Does the 1515 shift in signature placement constitute a genuine historical period boundary?"**  

  **Three Verdicts**  
  - **Realist:** YES. The change marks a rupture in legal self-perception, linking identity to property in a new way. Standard labels ("Renaissance," etc.) miss this, proving their flaws.  
  - **Constructivist:** NO. The shift is arbitrary; prioritizing signatures over other variables (e.g., wax color) reflects the historian’s choice, not a historical reality.  
  - **Pragmatist:** ONLY FOR SPECIFIC QUESTIONS. It’s a break if studying notarial authority, but irrelevant for economic or social history. The answer depends on the inquiry.  

  **[End photocopy]**
