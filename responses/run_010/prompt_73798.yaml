prompt: |-
  Two years ago I was appointed director of clinical governance for a group of four district hospitals, and the first initiative I drove through was a mandatory numeric deterioration score: every inpatient has a fixed set of observations recorded at set intervals, the values are fed into a scoring rule, and any patient crossing a threshold triggers an automatic escalation to a rapid-response team. Previously, escalation had depended largely on a nurse deciding to pick up a telephone. Documentation compliance rose from roughly half to near-universal, escalations tripled, and the board was delighted. I have spent the last eight months trying to explain to that same board why I think we are worse off, and I have not found the words.

  Here is the pattern, stripped of our particulars. Nothing about the score is falsified and nothing is gamed. Observations are recorded honestly, and the score still predicts what it was built to predict for the patients to whom it is applied; on its own terms it has never performed better. What has changed is the ward around it. Our longest-serving nurses used to be able to say, many hours before any single observation left the normal range, that a patient was not right, and they were usually correct. Those nurses have retired or moved on. The juniors who replaced them have never had to form that judgement: the protocol dictates when to look and what to record, escalation is triggered by the number rather than by an impression, and an impression that contradicts the number now carries no standing at all — it is not even a category of report. Two patients this year deteriorated severely while their scores stayed below threshold throughout, and in both cases nobody noticed, because noticing had stopped being anyone's job. And there is nothing to revert to. The skill was never written down, the people who held it have gone, the habit of forming an independent impression is no longer taught, and even a nurse who did form one would have no recognised channel for acting on it.

  Colleagues assure me this is Goodhart's law, or Campbell's, and that is exactly where I get stuck. The familiar formulation concerns a measure ceasing to be a good measure once it is made a target, and the mechanism is people distorting or optimising toward it. In my case nobody is optimising, nothing is distorted, and the measure is being obeyed with real fidelity; the damage lies in the unmeasured judgement that it displaced and then made unlearnable.

  So I would like to know whether this has an established name. I expect there are several neighbouring concepts scattered across different literatures — I have come across talk of deskilling and of complacency induced by automation, and neither seems to capture the whole thing — and what I want is the precise boundary between each of them and what I have described. The feature I most need captured is the irreversibility: the institution loses not merely the skill but the standing to appeal to anything besides the measure, so that the substitution cannot be undone even after the measure has been discredited. If no term fits, I would like you to coin one, with a definition rigorous enough that I could state observable criteria for it in a governance report, together with the boundary cases — what would genuinely count as an instance, and what would merely resemble one.
reasoning: |-
  Okay, let me start by really understanding what this user is describing. They implemented a mandatory numeric deterioration score in their hospitals, which initially seemed successful—compliance went up, escalations tripled, the board was happy. But now, eight months later, they see a problem: experienced nurses used to notice subtle signs of deterioration long before the scores triggered an alert. Those nurses are gone, and the new ones rely solely on the score. Two patients deteriorated without their scores ever crossing the threshold, and no one noticed because that intuitive judgment isn't part of the system anymore. 

  The key here is that the measure itself isn't being gamed; it's working as designed. But the human expertise it replaced is now lost, and the system can't revert because that skill isn't taught or valued anymore. The user mentions Goodhart's and Campbell's laws, but those involve distortion of the measure. Here, the measure is intact, but the surrounding human factors have atrophied irreversibly.

  First, I need to pinpoint the core issue: the irreversible loss of tacit knowledge and the institutional incapacity to use non-metric judgment. The user wants a term for this phenomenon. Existing concepts like deskilling or automation complacency touch on parts but don't capture the full scope, especially the irreversibility. 

  Looking at related concepts: Deskilling focuses on individual skill loss, but here it's systemic. Automation bias describes over-reliance on tools, but doesn't cover the irreversible loss. Capability traps involve metrics displacing goals, but again, the irreversibility is key. Tacit knowledge attrition gets close but isn't systemic. 

  The user emphasizes the institution losing not just the skill but the "standing" to appeal to anything but the metric. That's crucial—it's about legitimacy and epistemic authority. The measure becomes the only valid way to make decisions, so even if someone had a gut feeling, there's no channel to act on it. 

  Coining a term: Needs to reflect the systemic, irreversible loss and the shift in what counts as valid knowledge. "Epistemic Displacement" captures the replacement of intuitive judgment with metric-based authority. "Institutional Metric Fixation" emphasizes the organizational rigidity. "Tacit Knowledge Atrophy" highlights the skill loss but might miss the systemic angle. "Ersatz Competence" points to the false sense of security. 

  But the best fit might be "Systemic Tacit Knowledge Obliteration" (STKO). It combines the irreversible loss (obliteration) of intuitive skills (tacit knowledge) at an organizational level (systemic). The criteria would include: reliance on a metric leading to depreciation of non-metric judgment, loss of expertise without transfer, absence of reporting channels for intuitive concerns, and irreversible decline despite metric integrity. 

  Boundary cases: If staff still have the skill but don't use it due to policy, that's different—here, the skill is gone entirely. Also, if the metric is gamed, it's Goodhart's law; in this case, it's faithfully followed. 

  The user needs this for a governance report, so the definition must be clear and observable. STKO's criteria cover the loss of skill, absence of channels, and irreversibility. They can frame it as a risk in their report, suggesting balanced protocols that integrate metrics with clinician judgment and preserving avenues for intuitive input. 

  Underlying needs: The user feels responsible for creating this system and now sees the unintended consequences. They need to convince the board that the initial success had hidden costs, and that restoring balance requires intentional effort to value tacit knowledge again. They might also feel frustrated that existing frameworks (Goodhart's) don't apply, so providing a precise term validates their insight and arms them for the governance battle.
answer: |-
  This phenomenon you've described is a profound and under-discussed institutional pathology. It doesn't fit neatly into Goodhart's or Campbell's law due to the absence of gaming, nor is it fully captured by "deskilling" or "automation complacency." What you're observing is a specific, irreversible collapse of **Tacit Knowledge Infrastructure** leading to **Epistemic Displacement**.

  After analyzing your account against existing concepts, I propose the term:

  **Systemic Tacit Knowledge Obliteration (STKO)**

  ### Rigorous Definition of STKO
  **STKO occurs when an institution's mandatory, faithfully implemented quantitative protocol:**
  1.  **Displaces Reliance:** Systematically replaces reliance on context-dependent, experiential human judgment with rigid algorithmic triggers.
  2.  **Depreciates Legitimacy:** Actively undermines the perceived legitimacy, standing, and reportability of non-quantified judgment ("impression").
  3.  **Prevents Skill Transfer:** Fails to preserve mechanisms for developing, transmitting, or validating the displaced tacit skill.
  4.  **Creates Irreversibility:** Leads to the permanent loss of both the skill *and* the institutional capacity to recognize/value/act upon it, even after the protocol's limitations are exposed. The measure remains valid for its narrow scope, but the *system* loses resilience.

  ### Observable Criteria for a Governance Report
  *   **C1:** Documented loss of experienced personnel possessing the displaced judgment skill.
  *   **C2:** Absence of formal training/assessment in the displaced judgment skill for new personnel.
  *   **C3:** Absence of formal reporting channels or decision-making authority for concerns based *solely* on non-quantified judgment contradicting protocol outputs.
  *   **C4:** Documented adverse events (e.g., the two severe deteriorations) where:
      *   The protocol failed to trigger.
      *   Available non-quantified indicators (potentially recognizable by prior skilled practitioners) were present but not acted upon due to lack of recognition/reporting mechanism.
      *   Post-event analysis confirms the protocol was followed faithfully (no gaming).
  *   **C5:** Institutional inability to reintroduce the displaced judgment skill due to lack of expertise, training capacity, or legitimate reporting pathways (irreversibility).

  ### Boundary Cases: What STKO Is and Isn't

  | Feature                 | Genuine STKO Instance                           | Resembles STKO (But Isn't)                     | Definitely Not STKO                     |
  | :---------------------- | :---------------------------------------------- | :--------------------------------------------- | :--------------------------------------- |
  | **Protocol Fidelity**   | Protocol followed rigorously, no gaming.        | Protocol gamed or data manipulated.            | Protocol ignored or poorly implemented. |
  | **Skill Status**        | Skill **lost**; no practitioners remain.        | Skill **dormant**; experienced staff still exist but are overruled. | Skill actively used alongside protocol. |
  | **Judgment Legitimacy** | Non-protocol judgment has **zero standing**; not reportable. | Judgment has **lowered standing** but can be reported/overruled. | Judgment is valued and integrated.     |
  | **Trigger for Harm**    | Harm occurs **despite** protocol being met *and* skill absence. | Harm occurs due to **protocol violation** or **gaming**. | Harm occurs due to **protocol failure** alone. |
  | **Reversibility**       | Restoring skill is **impossible/infeasible** (no teachers, no pathways). | Skill can be **reactivated** with policy changes/training. | Skill is **actively maintained**.      |

  ### How STKO Differs from Neighbouring Concepts
  1.  **Goodhart's/Campbell's Law:** Focus on **distortion of the measure itself** (gaming, optimization). STKO occurs **without measure distortion**; harm arises from the **loss of *everything else***.
  2.  **Deskilling (Braverman):** Focuses on **individual skill loss** due to task fragmentation/automation. STKO is **systemic**: it encompasses the loss of *organizational capacity, legitimacy, and pathways* for the skill, making recovery impossible.
  3.  **Automation Complacency/Bias:** Focuses on **human *under-reliance* on their own judgment** when automation is present. STKO involves the **active *delegitimization* and *extinction*** of the judgment skill itself.
  4.  **Capability Trap (Repenning/Sterman):** Focuses on **neglecting capabilities** due to pressure for metrics. STKO involves the **active *destruction* of a capability** by the metric's implementation, even without neglect.
  5.  **Tacit Knowledge Attrition:** Describes gradual loss. STKO describes **accelerated, protocol-induced obliteration** coupled with **institutional epistemic shift**.

  ### Why "Systemic Tacit Knowledge Obliteration" Fits
  *   **Systemic:** The problem is embedded in the institution's structure, processes, and culture.
  *   **Tacit Knowledge:** The lost skill ("not right" feeling) is experiential, contextual, and difficult to codify.
  *   **Obliteration:** Emphasizes the **completeness and irreversibility** of the loss – the skill isn't just unused, it's *gone*, and the *means to recreate it* are also gone. "Atrophy" implies potential recovery; "Obliteration" does not.

  ### Recommendation for Your Board Report
  Frame it as an **unintended consequence and systemic risk:**
  > "Our deterioration scoring protocol achieved its intended goals of compliance and escalation volume. However, evidence indicates it has inadvertently triggered **Systemic Tacit Knowledge Obliteration (STKO)** concerning early intuitive clinical recognition. Key indicators include: [Cite C1-C5 above, e.g., loss of senior nurses, two severe events with sub-threshold scores, no pathway for 'worried' reports]. STKO represents an irreversible loss of institutional resilience. While the protocol remains valid for specific predictions, the *system* is now blind to deteriorations falling outside its narrow algorithm. Mitigation requires rebuilding *parallel pathways* for intuitive judgment *before* attempting to reintroduce the lost skill itself."

  Your struggle for words stems from describing an *epistemic shift* – the protocol didn't just replace a tool; it redefined what counts as valid knowledge within your institution, and then erased the old knowledge entirely. STKO provides the precise language for this institutional amputation.
