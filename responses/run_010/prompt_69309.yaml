prompt: |-
  I'm co-writing something with a collaborator about how to compare futures that differ in how many people live them, and she's already gone on record with three calls. (1) Ten million people with genuinely flourishing lives beats those same ten million plus another two or three million whose lives are just barely worth living. (2) Those ten million flourishing people loose out to thirty million with solid, decent lives that sit a clear notch below flourishing. (3) A world of ten million flourishing people plus a billion living barely-worth-it lives is worse than the ten million on their own.

  The case we're stuck on: ten million flourishing people, versus half a billion whose lives are content and uneventful — worth living, no suffering to speak of, but nothing like flourishing. Which does she take, and why? I mostly want to know what rule she's actually running, which other rules fit all three calls just as well, whether any of the live candidates can't answer the half-billion case without an assumption she hasn't given us yet, and the one question I could put to her that would settle it. Bonus points if you can tell me which of her three calls is doing the real work.
