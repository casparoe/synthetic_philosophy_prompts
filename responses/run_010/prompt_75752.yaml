prompt: |-
  I've spent years reading arguments about tail risk and expected value, and I want to test whether a real regulatory regime is doing the reasoning those arguments assume it is.

  Type certification for large transport aircraft sorts every credible systems failure into severity classes and pins a maximum average probability per flight hour to each. A condition classified as catastrophic — one that would prevent continued safe flight and landing, typically involving multiple fatalities — must be shown to be extremely improbable, which the regulators cash out as below one in a billion per flight hour, and there is a separate structural rule that no single failure may be permitted to produce such a condition. The targets are not fungible: an applicant cannot offset a somewhat-too-likely catastrophic condition by making a dozen minor ones safer, nor by demonstrating that the design's expected fatalities are competitive with the fleet's.

  What theory of rational choice under risk does this presuppose? The obvious candidate is risk-weighted expected utility — the family of views on which a risk function transforms cumulative probabilities, so that a rational agent may be responsive to the shape of a distribution and not only its mean, with Allais-type preferences as the standard motivation. Reconstruct that reading as precisely as you can, then put pressure on it: does the one-in-a-billion target look like anybody's risk attitude, or is it doing different work altogether — a bright line against regulatory gaming, a claim about what can be known at design time rather than a preference over known gambles, a lexicographic safety constraint, or a rule about who bears the risk and whether they could have consented to it? Say which of these the practice strictly requires and which it merely sits well with, flag anything in the scheme that embarrasses the reading you favour, and say what would have to change if the whole regime were rebuilt around maximising expected fatalities avoided.

  Argue from the concepts; no citations, reading lists, or named authorities beyond what I have supplied. British English throughout. End with a single line beginning "Verdict:" naming the account you think best explains the practice, or stating that the practice is underdetermined between them.
reasoning: |-
  Hmm, the user presents a sophisticated analysis of aircraft type certification rules and asks about the underlying theory of rational choice. They've clearly spent years studying tail risk debates.

  The regulatory framework described has several key features: non-fungible severity classes, a strict 1-in-a-billion probability cap for catastrophic failures, and the "no single failure" structural rule. The user suggests risk-weighted expected utility (RWEU) as the obvious candidate but wants me to test this interpretation rigorously.

  Let me reconstruct the RWEU reading first. RWEU would explain the non-fungibility through probability weighting - catastrophic outcomes get disproportionate weight regardless of their contribution to expected value. The 1-in-a-billion cap could represent an extreme discontinuity in the risk function. The structural rule aligns with RWEU's focus on outcome distributions rather than just means.

  But there are problems with this reading. A 1-in-a-billion cap seems absurdly low for any plausible risk attitude - it's more like a practical impossibility threshold than a preference. The non-fungibility appears absolute rather than graded as RWEU would suggest. And the structural rule seems fundamentally about causal structure rather than probabilistic weighting.

  Alternative explanations fit better: the cap functions as a bright-line epistemic rule (what's knowably controllable at design time), while the non-fungibility serves as an anti-gaming measure. The structural rule embodies a consent-based logic - no single point of failure should expose passengers to unbounded risk they couldn't reasonably accept.

  If rebuilt around expected fatalities, everything would change: fungibility would be required, the structural rule would weaken, and designers would trade off high-probability minor injuries against low-probability catastrophes. This would contradict the current regime's core principles.

  The strongest reading combines multiple elements: the cap as an epistemic bright line, non-fungibility as an anti-gaming principle, and the structural rule as consent-based. RWEU doesn't adequately explain these features, particularly the absolute nature of the constraints.
answer: |-
  This regulatory regime resists a clean reduction to risk-weighted expected utility (RWEU) or any single decision theory. While RWEU offers initial traction, significant features point towards a hybrid rationale combining epistemic limitations, anti-gaming constraints, and deontological elements.

  **Reconstructing the RWEU Reading:**
  RWEU posits that rational agents transform cumulative probabilities via a risk function, overweighting low-probability, high-severity outcomes. Applied to certification:
  1.  **Non-Fungibility:** Reflects extreme overweighting of catastrophic outcomes. Reducing a minor risk provides negligible psychological or normative compensation for *any* increase in catastrophic risk, regardless of expected value calculations. The risk function exhibits sharp discontinuity near the catastrophic class.
  2.  **1-in-a-Billion Cap:** Represents the point where the risk function assigns near-infinite weight to catastrophic outcomes. It's the practical manifestation of treating such risks as intolerable, akin to a zero-risk requirement made operational in a probabilistic framework.
  3.  **Structural Rule (No Single Failure):** Ensures the catastrophic risk isn't concentrated in a single point. RWEU cares about the *distribution* of outcomes; a single point of failure creates a "brittle" risk profile where a small, plausible event triggers the worst case, demanding extra mitigation distinct from merely lowering the average probability.

  **Pressuring the RWEU Reading:**
  1.  **Implausible Risk Attitude:** A 1-in-a-billion cap per flight hour implies a degree of risk aversion vastly exceeding any plausible human or institutional attitude. Avoiding a one-in-a-billion risk per hour would paralyse all activity. This cap functions not as a revealed preference but as a **practical epistemic bright line**. It signifies a level of risk deemed *effectively impossible to demonstrate as controlled* within engineering tolerances and statistical confidence at the design/certification stage. It’s less "we weight this outcome infinitely" and more "we cannot reliably distinguish designs below this threshold, so we demand demonstrable performance beyond it."
  2.  **Absolute Non-Fungibility:** RWEU typically implies *graded* weighting, allowing some trade-offs at the margins. The regime's *absolute* prohibition on offsetting (e.g., trading minor risks for catastrophic risk) is stricter. This resembles a **lexicographic safety constraint**: safety of the catastrophic class lexically dominates all other considerations (cost, other risks, expected value). It functions primarily as an **anti-gaming mechanism**, preventing regulators or manufacturers from manipulating risk assessments through creative accounting of disparate failure modes. The regime prioritises eliminating specific intolerable risks over global efficiency.
  3.  **Structural Rule's Rationale:** While RWEU explains aversion to concentrated risk, the structural rule's primary justification is **causal and controllability-based**, not purely probabilistic. A single failure causing catastrophe implies a lack of redundancy or independence – a fundamental design flaw making the system vulnerable in a way that probabilistic averaging across multiple *different* failure paths doesn't. It’s about ensuring robustness through architecture, preventing reliance on *any* single element. This also connects to **consent/agency**: passengers cannot reasonably consent to or mitigate risks hinging on a single, potentially latent, component failure. The rule ensures risk arises only from complex, improbable sequences, not singular events.

  **What the Practice Requires vs. What it Sits Well With:**
  *   **Strictly Requires:** A lexicographic constraint against catastrophic conditions exceeding the 1-in-a-billion cap *and* arising from single failures. Absolute non-fungibility between severity classes.
  *   **Sits Well With (but doesn't strictly require):**
      *   **Epistemic Bright Line:** The 1-in-a-billion cap is fundamentally operationalised as such.
      *   **Anti-Gaming Principle:** Non-fungibility is essential to prevent manipulation.
      *   **Consent/Risk-Bearing Argument:** The structural rule strongly aligns with ensuring risks are distributed and complex, not concentrated and unavoidable for the passenger.
  *   **Embarrasses RWEU:** The absolute, non-graded nature of the constraints and the implausibility of the implied risk attitude for the cap. RWEU struggles to explain why the cap isn't context-dependent or why *no* amount of offsetting benefit is permissible.

  **Expected Value Maximisation Rebuild:**
  Rebuilding around maximising expected fatalities avoided (i.e., minimising expected fatalities) would necessitate:
  1.  **Fungibility:** Risks become fully tradeable. Reducing a high-probability, low-severity risk (e.g., minor injuries) by an amount saving 0.01 expected fatalities per flight hour could directly offset a slight increase in catastrophic risk probability (e.g., from 1e-10 to 2e-10) if the expected fatalities added were ≤0.01.
  2.  **Relaxed Catastrophic Cap:** The 1-in-a-billion rule would become a guideline or starting point, not an inviolable cap. Exceeding it could be permissible if sufficiently offset by reductions in other expected fatalities elsewhere in the design. The "extremely improbable" definition might become probabilistic (e.g., based on cost-benefit analysis).
  3.  **Weakened Structural Rule:** Preventing single-point catastrophic failures would remain desirable for robustness but could be traded off against expected fatality reductions achieved by other means (e.g., using lighter, less redundant components that slightly increase systemic failure probabilities but save weight/fuel, reducing overall operational fatalities). Its status as an absolute rule would dissolve.
  4.  **Holistic Fleet Comparison:** Demonstrating that the design's *overall* expected fatalities per flight hour were lower than the existing fleet average could become a primary compliance route, superseding class-specific targets.

  **Verdict:** The practice is best explained by a lexicographic safety constraint operationalised through epistemic bright lines and strict anti-gaming rules, with the structural rule grounded in causal robustness and consent.
