prompt: |-
  ok so — third year in phil of science, mostly causation with a side interest in the actual stats machinery, and I want a number on something rather than an essay, so bear with the setup.

  Background as I understand it: the interventionist analyzes "X causes Y" as there being an ideal intervention on X that changes the value of Y, with all the other variables in your set held fixed at their actual values. Lewis analyzes causation in terms of counterfactual dependence, not necessarily direct but along a chain of stepwise dependencies, cashed out by similarity between worlds. And then there's this result that keeps getting gestured at in seminars that I've never managed to get a clean statement of, roughly: if your variable set is rich enough and there's no latent common cause messing things up, then whenever X is a cause of Y in the graph-theoretic sense, Y counterfactually depends on X under an ideal intervention on X. So the two analyses can't actually come apart.

  Which is why I went into quals last month assuming the interventionist/counterfactual fight is basically over — the interventionists didn't lose so much as get absorbed — and that what's left is bookkeeping about how fine-grained your variables should be. My own credence in that is maybe 0.6, which already feels too high now that I've written it down, and I want to know how wrong it is.

  So: give me your credence, as a number, in this proposition —

  "If the standard background assumptions are granted (a sufficiently rich variable set, no unmodelled confounding, interventions ideal in the technical sense), then the interventionist analysis and the Lewisian analysis of singular causation are extentionally equivalent wherever both are well-defined, and hence there is no substantive philosophical disagreement left between the two camps."

  And decompose it. I want the sub-questions the number actually hangs on, a rough probability for each with a line of justification, and then how you combine them into the final figure. Candidates I'd guess belong in there: whether that coincidence result really holds under assumptions both sides would accept; whether dependence-under-an-intervention is even the same notion as Lewisian dependence (I have a vague sense this is where I'm being sloppy, but I couldn't have defended that in a seminar); whether extentional equivalence would settle anything at all given that the camps disagree about what's primitive, about whether the interventions have to be metaphysically possible rather than merely fat-handed, and about whether the notion of an intervention is itself causal; and whether anyone actually working on this right now thinks the debate is closed. Add terms, drop terms, reorder — I'd rather have your decomposition than mine.

  If you think the proposition as I've stated it is ill-posed or rests on a confusion, say so and repair it before you number it — but still hand me a number for the repaired version. I don't want to get out of answering by relabelling the question.

  Then: which single term is your overall number most sensitive to, and where do you think your own reasoning here is most likely to break down? Concretely — what argument or piece of evidence would move your number the most, and in which direction.

  Last line, exactly, since I'm parsing these for a dataset: \answer{0.XX} — just the decimal, nothing else inside the braces.
