  For the illusion case, the PI dismisses calibration evidence because reports are "interpretations," and cites cross-population variation as proof that vision isn't modular. Here R5 (experience-level penetration) seems relevant—but illusions persisting *despite* knowledge refutes strong versions. His expertise point actually supports R8 (developmental shaping), which is defensible but distinct from online theory-ladenness. The slogan doesn't cover this well; he's conflating calibration with real-time cognitive penetration.

