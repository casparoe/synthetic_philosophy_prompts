  Ranking disanalogies: The lack of heredity/evolution is critical—it undermines the metaphor's relevance to actual biology. Dormancy is a major flaw for the virus argument since dormant states are biologically significant. Boundary issues matter less for astrobiology but hurt conservation biology. 

