answer: |-
  Your diagnosis is razor-sharp and touches the core philosophical nerve of the consciousness debate. Let's dissect this stalemate systematically:

  ### 1. **The Terminological vs. Substantive Divide**
     - **Your Hypothesis is Largely Correct**: The core conflict *is* about definitions of "consciousness." The camps implicitly prioritize different aspects:
       - **Sensory Cortex Camp**: Equates consciousness with *phenomenal content* (qualia). If V1/V2/V4 encodes rivalrous percepts with fidelity, that's where "seeing" happens.
       - **Frontoparietal Camp**: Equates consciousness with *global availability* (access). The burst reflects information becoming reportable, entering working memory, and influencing behavior.
     - **Hidden Disagreement**: Beneath the semantics lies a **metaphysical rift** about temporal granularity:
       - Is there a *precise instant* when a percept transitions from "unconscious processing" to "conscious"? 
       - The sensory camp implies "consciousness" is a graded state emerging early; the frontoparietal camp treats it as a threshold event tied to cognitive access. **This is a substantive disagreement about the nature of neural correlates.**

  ### 2. **Dennett & Global Workspace: False Dichotomy?**
     - **Multiple Drafts (Dennett)**: Rejects the idea of a "Cartesian Theater" where content becomes conscious. Consciousness isn't a *state* but a *process*—a cascade of content revisions without a final "broadcast." Binocular rivalry flips are just competing drafts gaining influence.
     - **Global Neuronal Workspace (GNW)**: Posits a functional bottleneck: content becomes conscious when amplified by frontoparietal circuits into a global "workspace."
     - **Reconciliation**: These aren't true rivals. GNW describes a *mechanism* for information integration, while Dennett attacks the *conceptual foundation* of locating consciousness in time/space. 
       - **GNW fits within Dennett's framework**: The "burst" could be when a draft achieves dominance through workspace recruitment. Dennett would just deny this marks the *onset* of consciousness—it's merely when the content gains behavioral traction.

  ### 3. **Paths to Progress**
     - **Paradigm Design: Decoupling Phenomenology from Report**
       - **Problem**: The P300/button press conflates access with phenomenology. We need tasks where subjective experience is probed *without* explicit report (e.g., priming during suppressed phases, pupilometry for surprise without button press).
       - **Example**: Use continuous tracking (e.g., dial rotation for perceptual dominance) while measuring neural activity. Test if sensory representations *predict* future dial positions before frontoparietal engagement.
     - **Crucial Distinction: Necessity vs. Sufficiency**
       - **Sensory Activity**: Likely *necessary* for specific phenomenology (no face percept without FFA activation).
       - **Frontoparietal Burst**: Likely *sufficient* for access/report, but is it necessary *for phenomenology*? 
       - **Key Experiment**: Disrupt frontoparietal activity (TMS/tDCS) *during* rivalry. If flips continue with intact phenomenology but impaired reporting, frontoparietal is post-perceptual. If flips cease, it's constitutive.
     - **Temporal Markers**: Use high-temporal resolution methods (MEG/EEG) to identify:
       - **T1**: Initial sensory divergence (e.g., differential SSVEPs).
       - **T2**: Frontoparietal ignition.
       - **T3**: Motor preparation (P300).
       - **Correlate these** with subjective timing (e.g., Libet-style clock probes).
     - **Underdetermination Acknowledgment**: Some questions *might* be unsolvable:
       - If phenomenal consciousness is private and access-consciousness is public, no experiment can *prove* they coincide. We can only establish neural correlates for each.

  ### 4. **A Radical Suggestion: Reframing the Question**
     Instead of asking *"Where/when does consciousness happen?"* ask:
     - **"What neural processes are minimally sufficient for reportable perceptual dominance?"** (Frontoparietal + sensory)
     - **"What processes generate stimulus-specific representations that *could* support phenomenology?"** (Sensory)
     - **"Is there neural evidence for *unreportable* phenomenal states?"** (e.g., decoding suppressed images from V1)

  ### The Way Forward
  - **Adversarial Collaboration**: Force both camps to design a *shared* experiment with pre-registered predictions.
  - **Shift Focus**: Stop seeking a "moment of consciousness." Map the *causal chain* from sensory encoding to report, identifying which stages are:
    - Correlates of content specificity (sensory)
    - Gates for global availability (frontoparietal)
    - Readout for decision/motor output (P300)
  - **Embrace Underdetermination**: Accept that "consciousness" isn't a monolithic target. Progress lies in clarifying *which operationalization* (phenomenal, access, self-monitoring) each neural marker serves.

  **In short**: Your instinct is correct—semantics fuel the stalemate. But underneath is a real disagreement about whether phenomenality requires global access. Progress demands experiments that dissociate these components, not more debates about definitions. Dennett and GNW are orthogonal: one denies the problem, the other offers a mechanism. The field needs less rivalry over turf and more precise mapping of the perceptual-cognitive cascade.
