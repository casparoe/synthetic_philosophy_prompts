  The person/corporation comparison is devastating. Legally, both enjoy strict numerical identity despite complete part replacement. This suggests the points system isn't about ontology at all, but about combatting fraud through verifiable history. The Q-plate's phrasing ("can't tell age") confirms it's an epistemic safety mechanism.

