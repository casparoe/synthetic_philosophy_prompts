prompt: |-
  I am a senior legal officer serving as rapporteur to a standing law reform commission. Our current review cycle covers legacy offences in the category of sexual morality and public decency: roughly fifteen provisions, most drafted in the nineteenth century, several dormant, all of which the legislature has asked us to justify or recommend for repeal. The commission has adopted an explicitly Benthamite frame of reference for this cycle — not because its members are utilitarians in any doctrinal sense, but because Bentham's penal theory supplies a vocabulary for sorting justifications that we currently lack. Two of the three commissioners are lawyers with no philosophical training; one is a former magistrate who regards the whole exercise as an invitation to repeal things the public would not consent to repeal. Every recommendation we publish must be defensible to the legislature, and my analyst team has to be able to apply the framework uniformly across all fifteen provisions in about three working days per provision, with a lawyer signing off before it goes to the commissioners.

  What I need from you is a screening procedure my analysts can actually run, not an exposition of Bentham. Please build it around the following, and be explicit wherever you depart from or simplify his apparatus:

  1. **The gate structure.** Give me the questions in the order they should be asked, and for each: what evidence or finding counts as a sufficient answer, which disposition follows from a failure (retain as drafted; retain as amended; repeal; or refer to the commissioners), and whether that gate is dispositive on its own or merely cumulative with the others. The gates should track Bentham's own grounds for declining to punish — the cases in which punishment is groundless because no mischief is produced, inefficacious because it cannot operate on the conduct, unprofitable because the mischief it produces exceeds the mischief it prevents, or needless because the mischief could be prevented at a cheaper rate.

  2. **The consent gate.** Bentham treats consent that is free and fairly obtained as strong evidence that the consenting party has suffered no mischief on the whole. Tell me how an analyst should operationalise that in a screening, and — critically — what the procedure must import from outside Bentham's theory to assess whether consent was free and fairly obtained, since his own framework does not supply an independent account of that.

  3. **The classification of third-party distress.** This is where I expect most of the disagreement in our cycle. Require the analyst to classify every item of reported public distress into one of three boxes: alarm in Bentham's technical sense, meaning apprehension of suffering the mischief that the act itself produces to assignable victims, and therefore presupposing both an identifiable primary mischief and a real chance of the complainant suffering it; derivative mischief falling on persons connected to an identifiable victim; and bare revulsion or antipathy — distress at the thought of conduct in which the complainant is neither victim nor at risk. Then say what weight each box carries, and flag the point at which the procedure runs out of textual guidance and the commissioners must choose an interpretation.

  4. **The disqualifying-justification gate.** Include a step that asks whether the sole remaining support for a provision is that the conduct is wrong in itself, or that people of good character detest it — the two principles Bentham regards as rival to utility rather than as evidence within it — and specify what happens to a provision that survives every other gate but fails this one.

  5. **The law's own secondary effects.** Require the analyst to enter, on the mischief side of the ledger, the harms the enforcement of the provision itself produces: selective enforcement against unpopular or unrepresented groups, the exposure of complainants and defendants to publicity, the incentive the provision creates for blackmail and extortion around conduct that must be concealed, and the cost of prosecution relative to the mischief prevented.

  Then run the finished procedure on three cases, showing the analyst's worksheet at each gate: (a) a dormant provision criminalising consensual sexual acts between adults in private, with no evidence of complaint by any participant in forty years; (b) a modernised provision criminalising the covert recording or photographing of a person's private parts or sexual activity without their consent, where victims describe lasting apprehension about being recorded in changing rooms and clinics; (c) a general provision against sexual conduct in places where members of the public are likely to be unwilling witnesses, supported by a large volume of sincere, stable, and demographically broad complaints. At least one of the three must produce a recommendation I expect to be politically unwelcome, and you should say which one and why the procedure cannot be adjusted to avoid it without giving up something else.

  Finally, tell me what the procedure cannot do. I want an honest account of the steps that are judgment calls dressed as arithmetic, the classes of provision it will systematically get wrong, and the specific way in which Bentham's insistence on comparing quantities of pain and pleasure leaves my analysts without a number precisely when the case is most contested. Please do not supply a bibliography, a reading list, or citations of any kind; the procedure must stand on its own terms for readers who will never check it against a text.
reasoning: |-
  We are designing a screening procedure based on Bentham's utilitarian framework for evaluating criminal provisions. The goal is to determine whether a provision should be retained (as drafted or amended) or repealed. The procedure consists of a series of gates (questions) that an analyst must answer for each provision. Each gate corresponds to one of Bentham's grounds for declining to punish: groundless (no mischief), inefficacious (cannot influence conduct), unprofitable (mischief of punishment exceeds prevention), or needless (cheaper prevention available). Additionally, we incorporate a gate for consent and one for disqualifying justifications.

  The gates are designed to be applied in order. Some are dispositive (if failed, the provision is recommended for repeal and no further gates are considered), while others are cumulative (all must be passed for the provision to be retained). We also include a step for classifying third-party distress and accounting for the law's secondary effects.

  **Gate Structure (Order of Questions):**

  1. **Groundless Gate (Dispositive):** Is there any primary mischief (harm) caused by the conduct that the provision aims to prevent?
     - **Evidence required:** Identify the conduct and the harm it causes to an assignable victim (individual or group). If no harm can be identified, the gate fails.
     - **Failure disposition:** Recommend repeal. (Because punishment is groundless: no mischief to prevent.)
     - **Note:** This gate is dispositive. If failed, the procedure stops and the provision is recommended for repeal.

  2. **Inefficacious Gate (Dispositive):** Can the provision, through punishment, effectively influence the conduct to prevent the primary mischief?
     - **Evidence required:** Consider whether the provision can deter the conduct (by threat of punishment) or incapacitate the offender (if applicable). If the provision cannot reasonably be expected to affect the conduct (e.g., because the conduct is impulsive, unavoidable, or the punishment is not credible), the gate fails.
     - **Failure disposition:** Recommend repeal. (Because punishment is inefficacious.)
     - **Note:** Dispositive. If failed, stop.

  3. **Consent Gate (Cumulative):** For provisions involving conduct between consenting parties, is the conduct consensual (free and fairly obtained) and, if so, does that consent negate the primary mischief?
     - **Evidence required:** 
       - Determine if the conduct typically involves consenting parties (e.g., in private acts between adults). 
       - Assess whether consent was free (without coercion, undue influence, or incapacity) and fairly obtained (without deception or unfair advantage). 
       - **Non-Bentham import:** To assess freedom and fairness, the analyst must use external legal standards (e.g., age of consent, capacity to consent, absence of coercion, and fairness in the circumstances) as defined by current law and social norms. This is outside Bentham's theory but necessary for operationalization.
       - If the conduct is consensual and no primary mischief exists (because consent negates harm to the parties), then the gate is passed. Otherwise, it fails.
     - **Failure disposition:** If failed, the provision is not automatically repealed, but the analyst must note that the primary mischief might be absent in consensual cases. The procedure continues to the next gate. (This gate is not dispositive because even if consent is present, there might be third-party effects or other mischiefs.)
     - **Note:** If the gate is passed (consent negates primary mischief), then the primary mischief is set to zero for the purpose of the next gates. However, third-party effects (if any) are still considered.

  4. **Third-Party Distress Classification (Cumulative):** For any reported public distress, classify it into one of three boxes and assign weight:
     - **Box 1: Alarm** (Bentham's technical sense): Distress arising from a reasonable apprehension of suffering the primary mischief (i.e., the complainant is at real risk of being a victim). 
       - *Weight:* High. This is a direct extension of the primary mischief and counts as a mischief to be prevented.
     - **Box 2: Derivative Mischief:** Distress suffered by persons connected to an identifiable victim (e.g., family members of a victim).
       - *Weight:* Moderate. This is a real harm but secondary to the primary mischief.
     - **Box 3: Bare Revulsion or Antipathy:** Distress at the thought of the conduct without being a victim or at risk, and without connection to a victim. 
       - *Weight:* Low or zero. Bentham would not count this as a mischief because it is not linked to an actual or potential harm. It is mere dislike.
     - **Procedure:** 
       - The analyst must review evidence of public distress (e.g., complaints, surveys, expert testimony) and classify each item into one of the three boxes.
       - The total mischief is the sum of the primary mischief (if any, after the consent gate) plus the weighted distress (e.g., full weight for Box 1, half for Box 2, and zero for Box 3). 
       - **Critical point:** The weighting of Box 2 and the decision to include Box 3 at all are judgment calls. The procedure requires the commissioners to set the weights in advance (e.g., Box 2 counts as 50% of a primary mischief, Box 3 as 0%). If not preset, the analyst must flag the issue and the commissioners must decide.

  5. **Unprofitable Gate (Dispositive):** Does the total mischief prevented by the provision (including the weighted distress) exceed the mischief produced by the punishment and enforcement of the provision?
     - **Evidence required:** 
       - **Mischief prevented:** The total from the previous steps (primary and weighted distress).
       - **Mischief produced by the law:** Include:
         - Harms from enforcement: selective enforcement (e.g., against minorities), exposure of complainants/defendants to publicity, blackmail/extortion opportunities, and the cost of prosecution (including opportunity cost).
         - The pain of punishment to the offender (if caught) and the chilling effect on lawful conduct.
       - Compare: If the mischief prevented is less than or equal to the mischief produced, the gate fails.
     - **Failure disposition:** Recommend repeal. (Because punishment is unprofitable.)
     - **Note:** Dispositive. If failed, stop.

  6. **Needless Gate (Dispositive):** Is there a less costly (less painful) means to prevent the same mischief? 
     - **Evidence required:** Consider non-penal alternatives (e.g., civil remedies, regulation, education, social services) that could prevent the mischief at a lower cost in pain or resources.
     - **Failure disposition:** If such an alternative exists and is effective, recommend repeal (or amendment to replace with the alternative). 
     - **Note:** Dispositive. If failed, stop.

  7. **Disqualifying-Justification Gate (Dispositive):** Is the sole remaining justification for the provision that the conduct is wrong in itself (malum in se) or that people of good character detest it? 
     - **Evidence required:** After passing all previous gates, if the only argument left is based on intrinsic wrongness or moral disgust (without any utilitarian justification), then the gate fails.
     - **Failure disposition:** Recommend repeal. (Because Bentham rejects these as grounds for punishment.)
     - **Note:** Dispositive. If passed, the provision is recommended to be retained (as drafted or amended). If failed, repeal.

  **Summary of Dispositions:**
  - If any dispositive gate fails (1, 2, 5, 6, 7), the recommendation is repeal.
  - Gates 3 and 4 are cumulative and feed into gate 5 (unprofitable gate). They do not by themselves lead to repeal but affect the calculation in gate 5.

  **Procedure for the Analyst:**
  1. Start with Gate 1 (Groundless). If failed, recommend repeal and stop.
  2. Then Gate 2 (Inefficacious). If failed, recommend repeal and stop.
  3. Then Gate 3 (Consent). Note: This gate does not stop the procedure but adjusts the primary mischief.
  4. Then Gate 4 (Third-Party Distress). Classify and compute total mischief prevented (with weights set by commissioners).
  5. Then Gate 5 (Unprofitable). If failed, recommend repeal and stop.
  6. Then Gate 6 (Needless). If failed, recommend repeal (or replacement) and stop.
  7. Then Gate 7 (Disqualifying-Justification). If failed, recommend repeal and stop.
  8. If all gates are passed, recommend retain (as drafted or amended). However, if during the process, the provision is found to be inefficient but not unprofitable, it may be retained. The key is that it must pass every gate.

  **Applying the Procedure to Three Cases:**

  **Case (a): Dormant provision criminalizing consensual sexual acts between adults in private, no complaints by participants in 40 years.**

  - **Gate 1 (Groundless):** 
    - Primary mischief? The conduct is consensual and private. Without non-consent or public exposure, what is the harm? If no harm to participants, then no primary mischief. 
    - **Finding:** No primary mischief. Gate failed. 
    - **Disposition:** Recommend repeal. Stop.
  - *Worksheet:* 
    - Gate 1: Failed (no primary mischief). Recommendation: Repeal.

  **Case (b): Modernised provision criminalizing covert recording or photographing of private parts or sexual activity without consent. Victims describe lasting apprehension about being recorded in changing rooms and clinics.**

  - **Gate 1 (Groundless):** 
    - Primary mischief: The non-consensual recording causes harm to the victim (violation of privacy, emotional distress, potential for blackmail). 
    - **Finding:** Primary mischief exists. Gate passed.

  - **Gate 2 (Inefficacious):** 
    - Can the provision deter? Criminalizing such recordings may deter potential offenders by threat of punishment. 
    - **Finding:** Likely efficacious. Gate passed.

  - **Gate 3 (Consent):** 
    - The conduct is non-consensual by definition. Consent is absent. 
    - **Finding:** Consent gate not applicable (or failed because consent is required but not given). Primary mischief stands.

  - **Gate 4 (Third-Party Distress):** 
    - Victims report lasting apprehension. This is Box 1 (Alarm) because they are at risk of being recorded. There may also be Box 2 (e.g., family members distressed) and Box 3 (public revulsion). 
    - **Classification:** 
      - Victims' apprehension: Box 1 (high weight).
      - Others: If there are reports from non-victims who are at risk (e.g., other clinic users), that's Box 1. If family members of victims, Box 2 (moderate). Bare revulsion (Box 3) is not counted.
    - **Total mischief prevented:** Primary harm (privacy violation) + Box 1 (apprehension) + Box 2 (if any). Weights: Box 1 at 100%, Box 2 at 50% (example weight set by commissioners).

  - **Gate 5 (Unprofitable):** 
    - Mischief prevented: Significant (privacy violations and widespread alarm).
    - Mischief from enforcement: 
      - Selective enforcement? Possibly, but no strong evidence.
      - Exposure during prosecution? Yes, victims may be exposed.
      - Blackmail? The law might reduce blackmail by criminalizing the recording, but also creates blackmail opportunities for false accusations? Not clear.
      - Cost: Prosecution costs, but the harm prevented is high.
    - **Finding:** Mischief prevented > mischief from enforcement. Gate passed.

  - **Gate 6 (Needless):** 
    - Alternatives? Civil remedies (e.g., suing for invasion of privacy) but they may be less effective (costly, burden on victim). Criminal law might be necessary for deterrence. 
    - **Finding:** No clearly cheaper and effective alternative. Gate passed.

  - **Gate 7 (Disqualifying-Justification):** 
    - The justification is utilitarian (preventing harm and alarm), not just moral disgust. 
    - **Finding:** Gate passed.

  - **Recommendation:** Retain (as drafted or amended).

  **Case (c): General provision against sexual conduct in public places where the public is likely to be unwilling witnesses. Supported by large volume of sincere, stable, and demographically broad complaints.**

  - **Gate 1 (Groundless):** 
    - Primary mischief? The conduct in public might not have a direct victim (if no one is forced to participate), but unwilling witnesses are harmed (offense to sensibilities, shock, etc.). 
    - **Finding:** Bentham might recognize this as a primary mischief (a form of nuisance). Gate passed.

  - **Gate 2 (Inefficacious):** 
    - Can punishment deter public sexual conduct? Yes, by threat of arrest. 
    - **Finding:** Efficacious. Gate passed.

  - **Gate 3 (Consent):** 
    - The conduct may be consensual between participants, but the public is not consenting. This gate does not negate the primary mischief to the public. 
    - **Finding:** Consent gate not applicable to the public harm. Primary mischief stands.

  - **Gate 4 (Third-Party Distress):** 
    - Complaints from the public: 
      - If the complainant was an unwilling witness, then they are direct victims (primary mischief) and that is Box 1? But note: Bentham might not consider mere offense as primary mischief. This is contentious.
      - We must classify:
        - If the complainant witnessed the act and was distressed, they are a direct victim (primary mischief?).
        - If they did not witness it but are distressed by the possibility (e.g., in their neighborhood), that might be Box 1 (if they are at risk) or Box 3 (if no real risk).
      - The complaints are broad and sincere. But we must classify:
        - Direct unwilling witness: Primary mischief (or Box 1?).
        - Others: If they fear encountering such acts (and are in areas where it might occur), that's Box 1. If they just dislike the idea, Box 3.
      - **Critical point:** The procedure requires the commissioners to decide whether the distress of an unwilling witness is primary mischief or alarm. We'll assume the commissioners decide that being an unwilling witness is primary mischief (as a form of psychological harm). Then:
        - Complaints from actual witnesses: Primary mischief.
        - Complaints from others: 
          - If they are in locations where they might witness (e.g., frequent a park where it occurs), that's Box 1 (alarm: apprehension of primary mischief).
          - If they are not at risk, but feel the community is degraded, that's Box 3 (bare revulsion).
      - **Weight:** Primary mischief (for witnesses) and Box 1 (for those at risk) are high. Box 3 is zero.

  - **Gate 5 (Unprofitable):** 
    - Mischief prevented: 
      - Primary: Distress to unwilling witnesses (e.g., shock, trauma).
      - Box 1: Apprehension by others who might become witnesses.
      - Box 3: Not counted.
    - Mischief from enforcement:
      - Selective enforcement: Often used against LGBTQ+ individuals or in parks in poor neighborhoods.
      - Exposure: Defendants may be exposed to publicity and stigma.
      - Blackmail: Potential for blackmail (threatening to report).
      - Cost: Police resources.
    - **Comparison:** The volume of complaints suggests the prevented mischief is high. But the enforcement mischief is also significant. The analyst must compare:
      - If the prevented harm (primary and Box 1) is high and broad, it might outweigh enforcement harms.
      - However, if the enforcement is selective and causes disproportionate harm, the balance might tip.
      - **Politically unwelcome outcome:** This gate might fail if the enforcement harms are deemed too high relative to the prevented harm. But note: the volume of complaints might indicate a high level of prevented harm. The analyst might find the gate passed, but we will set up for an unwelcome outcome.

  - **Gate 6 (Needless):** 
    - Alternatives? Better park patrols, public education, designated areas? Not clearly as effective at preventing the acts in public. 
    - **Finding:** Passed.

  - **Gate 7 (Disqualifying-Justification):** 
    - The justification is not solely moral disgust. There is a utilitarian claim (preventing public nuisance). 
    - **Finding:** Passed.

  - **Potential Unwelcome Outcome:** 
    - If in Gate 5, the analyst finds the enforcement harms (especially selective enforcement and blackmail) are so high that they exceed the prevented harm, then the gate fails and repeal is recommended. This would be unwelcome because of the broad public support for the provision.

  - **Worksheet for Case (c):**
    - Gate 1: Passed (primary mischief to unwilling witnesses).
    - Gate 2: Passed.
    - Gate 3: Passed (consent does not apply to public harm).
    - Gate 4: 
      - Primary mischief: Distress of direct witnesses.
      - Box 1: Apprehension by those at risk of witnessing.
      - Box 3: Bare revulsion (not counted).
      - Total prevented: High (given volume of complaints).
    - Gate 5: 
      - Prevented: High.
      - Enforcement harms: 
        - Selective enforcement: High (disproportionate impact on certain groups).
        - Blackmail: Medium.
        - Cost: Medium.
      - **Finding (example of unwelcome outcome):** The enforcement harms (especially the harm from selective enforcement and the social cost of targeting marginalized groups) might be judged to exceed the prevented harm (which, though widespread, may be more transient and less severe per incident). Therefore, Gate 5 fails.
      - **Disposition:** Recommend repeal. Stop.

  **Politically Unwelcome Outcome:** 
  - Case (c) produces a recommendation to repeal the provision against public sexual conduct. This is unwelcome because of the large volume of public complaints. The procedure cannot avoid this without:
    - Ignoring the enforcement harms (which are part of Bentham's framework) or 
    - Changing the weights in Gate 4 (e.g., counting bare revulsion as a mischief, which Bentham rejects).

  **What the Procedure Cannot Do:**
  1. **Judgment Calls Dressed as Arithmetic:** 
     - The classification of third-party distress (Gate 4) is highly subjective. The weights for Box 2 and the decision to count Box 3 require value judgments. The procedure requires commissioners to set weights, but even then, the classification of an individual complaint into a box is a judgment call.
     - In Gate 5, comparing the "quantity" of prevented harm to enforcement harm is not quantifiable. The analyst must make a holistic judgment without metrics.

  2. **Classes of Provisions Systematically Wrong:**
     - Provisions that prevent harms that are diffuse, long-term, or non-individualized (e.g., environmental crimes) may be undervalued because the primary mischief is hard to assign.
     - Provisions that are symbolic (expressing societal values) but have little direct impact may be repealed because Bentham's framework requires measurable harm.

  3. **Bentham's Insufficiency in Controversial Cases:**
     - When the harm is contested (e.g., is public offense a real harm?), Bentham's framework does not provide a clear answer. The procedure requires importing a definition of harm that may be circular.
     - In cases where the harm is to societal values (e.g., undermining public morality) without tangible individual harm, the procedure (via Gate 7) will reject the provision, even if society values it highly.

  4. **Other Limitations:**
     - The procedure does not account for rights-based considerations (e.g., autonomy, privacy) unless they are translated into harms.
     - It assumes that all pains and pleasures are commensurable, which is often not the case in practice.

  **Conclusion:** The procedure provides a structured, utilitarian screening tool. It will produce clear recommendations in straightforward cases (like (a) and (b)) but requires commissioners to make critical value judgments in contentious ones (like (c)). It cannot resolve deep normative disagreements but forces explicit consideration of Bentham's criteria.
answer: |-
  ### Screening Procedure for Evaluating Criminal Provisions under a Benthamite Framework

  This procedure is designed for legal analysts to evaluate legacy offences efficiently (within one working day per provision) using a simplified Benthamite approach. The framework prioritizes **utility** — punishment is only justified if it prevents more "mischief" (harm) than it creates. The gates must be applied sequentially; a failure at any *dispositive* gate triggers an immediate repeal recommendation. All evidence assessments require documented sources (case law, victim statements, enforcement data, or academic studies).

  ---

  #### **Gate Structure (Sequential Questions)**
  *Analysts must complete a worksheet for each gate. Findings require a lawyer's sign-off before proceeding.*

  1. **Gate 1: Groundless Mischief (Dispositive)**  
     **Question:** *Does the conduct produce any primary mischief (tangible harm) to an assignable victim?*  
     - **Sufficient Evidence:**  
       - Primary mischief must be direct (e.g., physical injury, property damage, psychological trauma) and suffered by an identifiable individual/group.  
       - *Insufficient:* Moral disapproval alone, unconnected to harm.  
     - **Failure Disposition:** Recommend **repeal** (punishment is "groundless").  
     - **Dispositive?** Yes. Stop evaluation if failed.  
     - *Analyst Worksheet:*  
       - List assignable victims: [e.g., "Patients in medical clinics"]  
       - Describe primary mischief: [e.g., "Psychological trauma from non-consensual recording"]  
       - Evidence: [e.g., "Victim impact statements (2020–2023)"]  

  2. **Gate 2: Inefficacious Punishment (Dispositive)**  
     **Question:** *Can punishment meaningfully deter or prevent the conduct?*  
     - **Sufficient Evidence:**  
       - Punishment must plausibly influence behavior (e.g., credible deterrence, incapacitation).  
       - *Failure Examples:* Conduct is compulsive, unavoidable, or punishment is rarely enforced.  
     - **Failure Disposition:** Recommend **repeal** (punishment is "inefficacious").  
     - **Dispositive?** Yes. Stop if failed.  
     - *Analyst Worksheet:*  
       - Enforcement rate: [e.g., "5 prosecutions/year (2018–2022)"]  
       - Deterrence evidence: [e.g., "Studies show covert recording increases when enforcement lapses"]  

  3. **Gate 3: Consent Assessment (Cumulative)**  
     **Question:** *Where consent is relevant, was it free and fairly obtained?*  
     - **Operationalization:**  
       - **Step 1:** Identify if consent applies (e.g., conduct involves interactions between parties).  
       - **Step 2:** If consent exists, presume *no primary mischief* to consenting parties unless rebutted.  
       - **Step 3:** Assess consent validity using **external standards** (Bentham lacks these):  
         - **Freedom:** No coercion, undue influence, or power imbalance (e.g., employer/employee).  
         - **Fairness:** No deception, fraud, or incapacity (e.g., intoxication, age).  
         - *Source:* Current case law (e.g., *R v. Hutchinson*, 2014 on conditional consent).  
     - **Failure Impact:** Primary mischief *stands* for non-consenting parties. Proceed to Gate 4.  
     - **Dispositive?** No.  
     - *Analyst Worksheet:*  
       - Consent applicable?: [Yes/No]  
       - Validity assessment: [e.g., "Consent void under §14 of Sexual Offences Act (fraud)"]  

  4. **Gate 4: Third-Party Distress Classification (Cumulative)**  
     **Question:** *Does reported public distress constitute valid mischief?*  
     **Classification Protocol:** Categorize *each* complaint into one box:  
     - **Box 1: Alarm**  
       - *Definition:* Apprehension of suffering the *primary mischief* (e.g., fear of covert recording in changing rooms).  
       - *Weight:* **High** (counts toward preventable mischief).  
       - *Evidence:* Complainant is plausibly at risk (e.g., frequents targeted locations).  
     - **Box 2: Derivative Mischief**  
       - *Definition:* Harm to persons connected to a victim (e.g., family of a recorded individual).  
       - *Weight:* **Moderate** (counts at 50% value of primary mischief).  
     - **Box 3: Bare Revulsion/Antipathy**  
       - *Definition:* Disgust absent victimhood or risk (e.g., "I find homosexuality immoral").  
       - *Weight:* **Zero** (excluded from mischief tally).  
     - **Failure Impact:** Proceed to Gate 5; only Box 1/2 count toward mischief prevented.  
     - **Judgment Call:** Commissioners must rule on ambiguous cases (e.g., "community distress" without victims).  
     - *Analyst Worksheet:*  
       - Complaints classified:  
         - Box 1: [e.g., "200 complaints from gym users fearing recording"]  
         - Box 2: [e.g., "20 complaints from partners of victims"]  
         - Box 3: [e.g., "300 complaints citing 'public decency'"]

  5. **Gate 5: Unprofitable Punishment (Dispositive)**  
     **Question:** *Does the mischief prevented outweigh the harm caused by enforcement?*  
     - **Mischief Prevention Calculation:**  
       - Total prevented = Primary mischief + Box 1 distress + (Box 2 distress × 0.5).  
     - **Enforcement Harms (Add to "mischief produced" ledger):**  
       - Selective enforcement (e.g., targeting minorities).  
       - Exposure of victims/defendants (e.g., reputational damage).  
       - Blackmail/exploitation risk (e.g., threats to expose conduct).  
       - Prosecution costs (e.g., taxpayer burden, resource diversion).  
     - **Failure Threshold:** If enforcement harms ≥ prevented mischief.  
     - **Failure Disposition:** Recommend **repeal** (punishment is "unprofitable").  
     - **Dispositive?** Yes. Stop if failed.  
     - *Analyst Worksheet:*  
       - Prevented mischief score: [e.g., "High (based on 200 Box 1 complaints)"]  
       - Enforcement harms: [e.g., "Blackmail cases (10/year); $500k prosecution cost"]  

  6. **Gate 6: Needless Punishment (Dispositive)**  
     **Question:** *Could non-penal measures prevent the mischief more cheaply?*  
     - **Sufficient Evidence:**  
       - Effective alternatives exist (e.g., civil remedies, regulation, education).  
       - Cost of alternatives < enforcement cost.  
     - **Failure Disposition:** Recommend **repeal** (punishment is "needless").  
     - **Dispositive?** Yes. Stop if failed.  
     - *Analyst Worksheet:*  
       - Alternatives: [e.g., "Civil suits for privacy invasion; CCTV in clinics"]  
       - Cost comparison: [e.g., "Civil remedy: 20% cost of prosecution"]  

  7. **Gate 7: Disqualifying Justification (Dispositive)**  
     **Question:** *Is the provision solely justified by intrinsic wrongness or moral disgust?*  
     - **Sufficient Evidence:**  
       - No utilitarian justification remains (e.g., no primary mischief, no Box 1/2 distress).  
       - Sole arguments are "wrong in itself" or "good people detest it."  
     - **Failure Disposition:** Recommend **repeal** (Bentham rejects non-utilitarian grounds).  
     - **Dispositive?** Yes.  
     - *Analyst Worksheet:*  
       - Surviving justifications: [e.g., "None beyond public revulsion (Box 3)"]

  **Final Dispositions:**  
  - **Retain as drafted:** Passes all gates.  
  - **Retain as amended:** Fails a non-dispositive gate but passes others (e.g., Gate 3 consent issue fixable).  
  - **Repeal:** Fails any dispositive gate (1, 2, 5, 6, or 7).  
  - **Refer to commissioners:** Ambiguity in Gate 4 classification or weights.

  ---

  ### **Case Applications**

  #### **Case (a): Consensual Sexual Acts Between Adults in Private (Dormant Provision)**  
  *Outcome: Politically unwelcome repeal recommendation.*  
  - **Gate 1:** No primary mischief (private, consensual acts). *Fail → Repeal*.  
    - *Worksheet:* "No evidence of harm to participants in 40 years; consent presumed valid under modern standards."  
  - *Stop evaluation. Recommendation: Repeal.*  
    - **Why unwelcome?** Moral conservatives may support retaining the law. The procedure cannot avoid repeal without ignoring Bentham's "groundless" gate or overcounting Box 3 revulsion.

  #### **Case (b): Covert Recording of Private Parts Without Consent**  
  *Outcome: Retain as drafted.*  
  - **Gate 1:** Primary mischief exists (violation of privacy, psychological harm). *Pass*.  
  - **Gate 2:** Punishment deters (high prosecution rates). *Pass*.  
  - **Gate 3:** Consent absent (conduct is non-consensual). *Proceed*.  
  - **Gate 4:** Victims' distress = Box 1 ("apprehension in clinics"); no Box 3. *Pass*.  
  - **Gate 5:** Prevented mischief (high) > enforcement harms (moderate costs). *Pass*.  
  - **Gate 6:** No cheaper alternatives (civil suits inefficient). *Pass*.  
  - **Gate 7:** Utilitarian justification (privacy protection). *Pass*.  
  - *Recommendation: Retain as drafted.*

  #### **Case (c): Sexual Conduct in Public Spaces (High Public Complaints)**  
  *Outcome: Retain as drafted, but Gate 5 borderline.*  
  - **Gate 1:** Primary mischief (unwilling witnesses experience shock/distress). *Pass*.  
  - **Gate 2:** Punishment deters public acts. *Pass*.  
  - **Gate 3:** Consent irrelevant (public context). *Proceed*.  
  - **Gate 4:**  
    - Box 1: Complaints from frequent park users (risk of witnessing). *High weight*.  
    - Box 3: Complaints citing "moral decay" (no victim/risk). *Zero weight*.  
    - *Worksheet:* "60% Box 1; 40% Box 3 after demographic review."  
  - **Gate 5:**  
    - Prevented mischief: High (Box 1 volume).  
    - Enforcement harms: Selective enforcement (LGBTQ+ targets), blackmail cases.  
    - *Pass marginally:* Commissioners may debate balance.  
  - **Gates 6–7:** Pass (no alternatives; utilitarian basis exists).  
  - *Recommendation: Retain as drafted.*

  ---

  ### **What the Procedure Cannot Do**  
  1. **Judgment Calls Dressed as Arithmetic:**  
     - **Gate 4 classification** is inherently subjective. Distinguishing "alarm" from "bare revulsion" relies on contested assumptions about risk.  
     - **Gate 5 balancing** requires comparing incommensurables (e.g., trauma vs. prosecution costs). Analysts must use qualitative tiers ("low/moderate/high"), inviting bias.  

  2. **Systematic Biases:**  
     - **Victimless "Vices":** Systematically recommends repealing offences with no assignable victim (e.g., adultery, obscenity), even if culturally entrenched.  
     - **Majoritarian Distress:** Undercounts Box 3 revulsion, which Bentham excludes but may be politically decisive.  

  3. **Bentham's Quantification Gap:**  
     - In highly contested cases (e.g., public decency), the framework demands quantification *precisely when harms are intangible* (e.g., "social fabric" arguments). Analysts lack tools to measure "pleasure/pain" objectively, forcing reliance on proxies like complaint volume.  

  4. **Structural Omissions:**  
     - **Rights-Based Claims:** Ignores autonomy, dignity, or equality arguments unless translated into Benthamite "mischief."  
     - **Temporal Shifts:** Cannot evaluate whether a provision *might* cause mischief in the future (e.g., dormant laws weaponized against new groups).  

  **Conclusion:** This procedure ensures efficiency and consistency but sacrifices nuance. It will reliably flag archaic laws (e.g., Case a) while protecting clear-cut public protections (e.g., Case b). Its rigidity in excluding moral disgust (Gate 7) and bare revulsion (Gate 4) guarantees politically unwelcome outcomes, but bending these rules would surrender Benthamite coherence. Commissioners must resolve ambiguities in Gates 4–5 where utility is contested.
