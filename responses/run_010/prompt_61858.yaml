prompt: |-
  Not a historian, I run logistics for a grocery chain and read economic history at night, but I've gotten stuck on something and I cant find my way out of it. It's about when a "why X and not Y" question about the past is an actual question versus one that just sounds profound. Here's where I've landed on a bunch of them. What I want is the principle underneath, because I don't have one that gets all of these.

  Ones I think are fine:

  - Why did the western half of the Roman empire lose its central government in the 400s while the eastern half kept one for another thousand years? One polity, one century, two outcomes, and you can point at stuff.
  - Why did the plague of the 1340s push western Europe toward free labor and better wages for the survivors, and eastern Europe back toward serfdom over the following century or two? Again, same shock, two directions.
  - Why did I get the flu last winter and not my wife, when we share a bed, a kitchen, and a toddler in daycare?

  Ones I think are broken:

  - Why did Rome fall? I can't say what event this names, or what the alternative was supposed to be.
  - Why did the Maya collapse? Different cities, different centuries, and the northern lowlands were doing fine the whole time.
  - Why didn't China have an industrial revolution in the 1700s? This one feels like it assumes industrialization was lying around waiting to be picked up and China fumbled it.

  Ones I flip on:

  - Why Britain and not the Yangzi delta? People who argue this seriously start from the claim that around 1750 the two were not obviously different on real wages, market development, life expectancy. If that's the starting point, the question seems fine to me. But then it looks like the same question as "why didn't China industrialize," with one side deleted, and that one I just called broken.
  - Why did printing with movable metal type catch on in Europe in the 1450s and not in Korea, where it had already been used in the 1300s?
  - Why did Zheng He's treasure fleets stop sailing in the 1430s and Columbus's start in 1492? My gut says this is two questions wearing a trench coat, and neither half has a fair comparison on the other side.
  - Why did Britain industrialize decades before France rather than the other way around? The first version seems fine. The mirror — why did France fail to beat Britain to it — seems like a trick, as if there's nothing to explain about France at all. But it's literally the same set of facts. That's the one that bugs me most.

  My tentative principle, which I know doesn't hold: a contrast question is only legitimate if both sides were, at some datable time, running the same process, and you can point to something that happened on one side and not the other. That saves Rome east/west and the plague case. It seems like it should kill Britain-vs-the-delta, since "the same process" is exactly what's in dispute, but the 1750 similarity claim maybe rescues it. And it says nothing at all about why the direction of the question should matter, which is the France thing.

  Here's the knot. I want to say a divergence question is only fine if you can state the comparison without the answer already baked into it. But every time I try, the comparison carries the answer: "rather than China" presumes China was the natural candidate and Britain the surprise; "rather than nowhere" quietly swaps in a different and maybe better question, which is why industrialization happened at all, anywhere, when it did. Is that a verdict on the divergence question specifically, or does every historical why-question have this disease and the divergence one is just the loud case?

  So: give me the principle, or two or three rival ones if that's the honest answer. State it clause by clause, and for each clause say which of my verdicts it's there to save. Then tell me which verdicts it can't handle and which single one you'd make me give up, and argue for giving it up. Then run it on two I haven't listed — why did Buddhism fade in the land of its birth and thrive in China, and why did Kodak invent the digital camera and get destroyed by it while Fuji made roughly the same transition and survived — and tell me what it says about the France mirror, which is the one I actually care about. No reading list, please, and no name-dropping of historians I should go look up. I want the principle and its costs.
reasoning: |-
  Okay, let's tackle this user's problem. They're in logistics but love economic history and are stuck on how to tell if a "why X not Y" historical question is valid. They've listed examples they find valid, broken, and ones they're unsure about. Their tentative principle involves having both sides run the same process at a datable time. But they're struggling with cases like why Britain industrialized before France, where flipping the question's direction feels tricky.

  First, I need to understand their core issue. They want a principle that distinguishes legitimate contrast questions from misleading ones. Their examples show that valid questions involve clear, comparable cases with a shared starting point or shock. Broken ones lack specificity or assume inevitability. The flip cases are tricky because they might share a starting point but framing introduces bias.

  Looking at their tentative principle—same process, datable divergence point—it works for Rome east/west and the plague because both sides had similar structures before the split. But for Britain vs. Yangzi Delta, the similarity around 1750 rescues it. The France mirror problem is key: why does "why Britain first?" feel fine but "why not France?" seems loaded?

  The user's deeper concern might be about question framing introducing assumptions. When we ask "why X not Y?", the "not Y" implies Y was expected, which may not be true. Historical questions should avoid built-in assumptions about inevitability or superiority. 

  So the principle could focus on symmetry and shared contexts. Valid questions need a common baseline where both options were plausible. The divergence point must be identifiable without hindsight. For the France case, both countries had similar potential, so either framing is valid as long as we don't assume France "failed." The problem isn't the question but implied narratives.

  Applying this to Buddhism: India and China had different contexts post-divergence (Islamic incursions vs. state support), making it valid. For Kodak vs. Fuji, same tech shift but different responses—valid if we identify the divergence point (e.g., strategic decisions in the 90s). The France mirror is fine if we avoid assuming France's path was a failure; it's just a later industrialization.

  The cost? Letting go of the idea that "why not Y?" always implies failure. Sometimes it's just exploring alternative paths. The user might need to accept that framing affects perception, but a well-defined principle can mitigate bias by focusing on symmetric baselines and clear divergence points.
answer: |-
  Here's a principle synthesized from your cases, designed to maximize clarity and minimize hidden assumptions, with its clauses, verdicts, costs, and applications:

  **The Principle of Legitimate Historical Contrast (PLHC)**

  1.  **Shared Baseline:** The entities/states/systems being compared (*X* and *Y*) must have occupied a *meaningfully similar functional position* or been subject to a *common initiating shock/condition* at a specific, identifiable point in time (*T1*).
      *   **Saves:** Roman East/West (same Empire pre-divergence), Plague Europe (same shock, different regions), Britain/France Industrialization (comparable core economies pre-1780), Britain/Yangzi Delta (if 1750 similarity claim accepted). *Saves the "flu" case too (shared household).*
      *   **Cost:** Requires defining the baseline rigorously. What constitutes "meaningfully similar"?

  2.  **Identifiable Divergence Point(s):** The divergence in outcomes must be traceable to specific events, decisions, structural differences, or path dependencies occurring *after T1*, not inherent in the pre-*T1* state.
      *   **Saves:** Roman East/West (crisis responses, geography, resources post-3rd century), Plague Europe (different elite power structures/institutions *shaping* labor responses), Printing (specific social/institutional contexts in 15th C Europe vs. 14th C Korea *after* invention), Kodak/Fuji (strategic decisions *after* digital tech emergence).
      *   **Cost:** Requires pinpointing *when* and *how* paths diverged, which can be debated.

  3.  **Symmetry of Possibility:** The framing "Why *X* and not *Y*?" must *not* implicitly assume the outcome in *Y* was the "default," "expected," or "normal" path, or that *X*'s outcome was inherently superior or inevitable. The counterfactual (*Y* achieving *X*'s outcome) must be plausible *given the shared baseline at T1*.
      *   **Saves:** Britain/France Industrialization (either framing is valid *if* we accept both were plausible industrializers at *T1* ~1780), Britain/Yangzi Delta (if 1750 similarity accepted, China's industrialization is plausible counterfactual).
      *   **Kills:** "Why didn't China industrialize?" (Assumes industrialization was the default/expected path for advanced agrarian states, which is teleological). "Why Rome fall?" (Assumes non-fall was the default).
      *   **Cost:** Forces explicit acknowledgment of counterfactual assumptions. Requires resisting hindsight bias.

  4.  **Clear Outcome Definition:** The outcomes being contrasted must be clearly defined, specific events, shifts, or states, not vague or monolithic processes.
      *   **Saves:** Plague Europe (specific labor regime shifts), Britain/France (clear timing gap in industrialization *take-off*), Kodak/Fuji (survival vs. bankruptcy under digital disruption).
      *   **Kills:** "Why Rome fall?" (Vague, contested endpoint), "Why Maya collapse?" (Vague, monolithic term for diverse city-state fortunes over centuries).
      *   **Cost:** Requires precise historical definitions, avoiding grand narratives.

  **Applying PLHC to Your Cases & Verdicts:**

  *   **Rome East/West:** *Saved* by (1) Shared Baseline (Empire pre-crisis), (2) Identifiable Divergence (crisis responses, resources post-3rd C), (4) Clear Outcome (loss of central govt vs. continuation).
  *   **Plague Europe:** *Saved* by (1) Shared Shock, (2) Identifiable Divergence (institutional responses), (4) Clear Outcomes (free labor/wages vs. serfdom reinforcement).
  *   **Flu:** *Saved* by (1) Shared Baseline (household), (2) Identifiable Divergence (immune response, viral load exposure), (4) Clear Outcome (got sick/didn't).
  *   **"Why Rome Fall?":** *Killed* by (3) (Assumes non-fall default), (4) (Vague outcome).
  *   **"Why Maya Collapse?":** *Killed* by (1) (No single baseline - diverse cities/timelines), (4) (Vague, monolithic outcome).
  *   **"Why not China Industrialize?":** *Killed* by (3) (Assumes industrialization was the expected/default path).
  *   **Britain/Yangzi Delta:** *Conditionally Saved* by (1) *if* 1750 similarity is accepted, (3) *if* framed neutrally (plausible counterfactual), (4) Clear Outcome (Industrial Revolution in Britain, not Delta). *Falls if* 1750 similarity is rejected.
  *   **Printing (Europe/Korea):** *Saved* by (1) Shared Tech (movable metal type existed), (2) Identifiable Divergence (different social/institutional contexts *after* invention - commercial markets, literacy demands, state support), (4) Clear Outcome (widespread societal adoption vs. limited use).
  *   **Zheng He/Columbus:** *Killed* by (1) (No shared baseline - fundamentally different state goals, contexts, technologies), (3) (Implies China "should" have colonized like Europe), (4) (Conflates cessation with initiation - distinct outcomes).
  *   **Britain/France Mirror:** **Your Key Concern Solved:** PLHC declares *both* framings legitimate *if* the shared baseline (pre-1780 core economies) and symmetry of possibility (both plausible early industrializers) are accepted. "Why Britain first?" is fine. "Why not France first?" is *also* fine **only if** it genuinely explores factors *within France* relative to the baseline that explain its *timing*, not implying a "failure." The *problem* isn't the question direction under PLHC, but the *temptation* in "Why not France?" to inject a teleological assumption that France *should* have been first or "failed." PLHC forces the question to be: "Given their similar potential at T1 (~1780), what specific post-T1 factors (institutions, resources, policies, contingencies) explain Britain's earlier take-off *compared specifically to France*?" This applies equally to either phrasing. The "mirror" feels broken only if it smuggles in assumption (3).

  **The Cost & The Verdict to Give Up:**

  *   **The Cost:** PLHC is strict. It kills many popular "Big Questions" of history ("Why the Rise of the West?", "Why did Democracy develop here?") because they fail (1) and (3). It demands precise definitions (4) and identifiable divergence mechanisms (2), which can be complex.
  *   **Verdict to Give Up:** You must **give up your rejection of the "Britain/France Mirror" based solely on direction.** PLHC argues the *direction* is neutral if the core criteria (baseline, divergence, symmetry, clarity) are met. The *problem* was the *implied assumption of failure* in the "Why not France?" phrasing, not the phrasing itself when used rigorously under PLHC.

  **Testing PLHC on New Cases:**

  1.  **Buddhism in India vs. China:**
      *   **(1) Shared Baseline?** Yes. Buddhism *originated* and thrived in India (~5th C BCE - ~7th C CE). China received it via transmission (~1st C CE onwards).
      *   **(2) Identifiable Divergence?** Yes. Post-~7th Century CE: Rise of Advaita Vedanta/Hindu revival & Islamic incursions in India weakened institutional Buddhism. In China: Active syncretism (Daoism, Confucianism), state patronage (Tang dynasty), development of distinct schools (Chan/Zen) *integrated* it deeply.
      *   **(3) Symmetry?** "Why thrive in China and fade in India?" is valid. It doesn't assume Buddhism *should* have remained dominant in India; it contrasts the *different trajectories* after a period of prominence in both regions. The counterfactual (Buddhism remaining dominant in India) is plausible at T1 (~600 CE).
      *   **(4) Clear Outcome?** Yes. "Fade" (loss of major state/institutional support, demographic minority) in India vs. "Thrive" (integration into state ideology, mass practice, cultural influence) in China.
      *   **PLHC Verdict:** **Legitimate Contrast.**

  2.  **Kodak vs. Fuji (Digital Transition):**
      *   **(1) Shared Baseline?** Yes. Both dominant film/photochemical companies facing the *same technological shock*: emergence of viable consumer digital photography technology (~1990s).
      *   **(2) Identifiable Divergence?** Yes. *Post*-digital emergence: Kodak's hesitation to cannibalize film profits, slow pivot, debt, poor digital strategy. Fuji's more aggressive diversification (cosmetics, medical imaging), faster digital embrace, restructuring.
      *   **(3) Symmetry?** "Why did Fuji survive and Kodak fail?" is valid. It doesn't assume both *should* have survived identically; it contrasts their *responses* to the same shock. The counterfactual (Kodak successfully transitioning like Fuji) is plausible at T1 (~1990).
      *   **(4) Clear Outcome?** Yes. Bankruptcy/destruction of core business (Kodak) vs. survival and adaptation (Fuji).
      *   **PLHC Verdict:** **Legitimate Contrast.**

  **Conclusion:** PLHC provides a robust filter. It saves questions focusing on *divergence from a shared starting point* driven by identifiable later factors, with clear outcomes and neutral framing. It kills questions laden with teleology, vagueness, or mismatched baselines. The "France mirror" problem dissolves when framed symmetrically: "Why did Britain industrialize *before* France?" is the precise, assumption-free question PLHC endorses for that comparison. The principle's cost is sacrificing grand, sweeping "Why?" questions in favor of more focused, comparative divergence analysis.
