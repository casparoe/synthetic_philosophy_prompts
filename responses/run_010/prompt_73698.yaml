  The core dispute centers on whether the difference between these explanations represents a real metaphysical distinction or merely an epistemic limitation. Nadia argues the distinction is empty since both predict identical evidence, while Owen insists there could be a real difference in conscious experience that's inaccessible to us. I should outline the possible resolutions: eliminativism (no fact of the matter), metaphysical realism (one is correct), epistemic humility (we can't know), and higher-order theories (consciousness requires reportability).

