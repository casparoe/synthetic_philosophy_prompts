  Overall, Owen's position is stronger because he maintains a distinction between phenomenology and reportability. Both overlook the possibility of graded consciousness or non-binary temporal structure. The substantive question is whether consciousness can exist without reportability, which remains open but favors Owen's view that report isn't constitutive of experience.

