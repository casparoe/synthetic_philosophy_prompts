  ### Scenario:  
  In a collapsed building rescue, three survivors are trapped: Alex (needs immediate extraction to save his leg, otherwise faces amputation), Blair (requires swift aid to preserve her hand, or amputation ensues), and Charlie (needs prompt help to save his foot, or amputation follows). The rescuer has three mutually exclusive options:  
  - **Option 1**: Save Alex’s leg immediately; delays cause Blair to lose her hand and Charlie to lose his foot.  
  - **Option 2**: Save Blair’s hand immediately; delays cause Charlie to lose his foot and Alex to lose his leg.  
  - **Option 3**: Save Charlie’s foot immediately; delays cause Alex to lose his leg and Blair to lose her hand.  
  Each option leaves two people with amputations (one major, one minor), totalling identical harm: leg amputation (severe mobility loss) > hand amputation (significant dexterity loss) > foot amputation (moderate mobility loss). No deaths occur.  

  ### Pairwise Comparisons:  
  1. **Option 1 vs. Option 2**:  
     - Alex’s complaint against Option 2: Loses his leg (severe harm), whereas in Option 1, he is unharmed.  
     - Blair’s complaint against Option 1: Loses her hand (significant harm), whereas in Option 2, she is unharmed.  
     - **Verdict**: Alex’s complaint (leg loss) is stronger than Blair’s (hand loss), as the severity is greater. Thus, Option 1 is less reasonably rejectable than Option 2.  

  2. **Option 2 vs. Option 3**:  
     - Blair’s complaint against Option 3: Loses her hand (significant harm), whereas in Option 2, she is unharmed.  
     - Charlie’s complaint against Option 2: Loses his foot (moderate harm), whereas in Option 3, he is unharmed.  
     - **Verdict**: Blair’s complaint (hand loss) is stronger than Charlie’s (foot loss), due to greater impact on daily life. Thus, Option 2 is less reasonably rejectable than Option 3.  

  3. **Option 3 vs. Option 1**:  
     - Charlie’s complaint against Option 1: Loses his foot (moderate harm), whereas in Option 3, he is unharmed.  
     - Alex’s complaint against Option 3: Loses his leg (severe harm), whereas in Option 1, he is unharmed.  
     - **Verdict**: Alex’s complaint (leg loss) is stronger than Charlie’s (foot loss), as the functional impairment is worse. Thus, Option 3 is less reasonably rejectable than Option 1.  
  *Result: Strict cycle (1 < 2, 2 < 3, 3 < 1)*.  

  ### Contractualist Verdict on the Cycle:  
  The cyclical ordering implies **indeterminacy**: no single option is uniquely permissible, as each can be reasonably rejected based on one pairwise comparison but not another. Contractualism defaults to no clear moral verdict; all options are "tied" in rejectability, and the rescuer must choose non-recklessly (e.g., arbitrarily or via secondary principles).  

  ### Key Feature Generating the Cycle:  
  The **asymmetry in harm severity across pairwise comparisons** drives the cycle. Each option "favours" one person by sparing them the worst harm in their comparison, but this advantage shifts: Alex’s severe harm dominates the 1vs2 comparison, Blair’s significant harm dominates 2vs3, and Charlie’s moderate harm is weakest in 3vs1, yet Alex’s severity reappears to close the loop. Removing this asymmetry (e.g., making harms equal) collapses the cycle into a tie.  

  ### Strongest Contractualist Reply:  
  A contractualist could argue complaints should be measured **against a common baseline** (e.g., the "no rescue" outcome) rather than pairwise. Here, each person’s baseline is amputation if not prioritised:  
  - Alex suffers equally (leg loss) in baselines for Options 2 and 3.  
  - Blair suffers equally (hand loss) in baselines for Options 1 and 3.  
  - Charlie suffers equally (foot loss) in baselines for Options 1 and 2.  
  This eliminates the cycle, as complaints become symmetrical and all options are equally rejectable.  

  ### Utilitarian Outcome:  
  With identical total harm (e.g., leg + foot = hand + foot = leg + hand in disvalue), utilitarianism is indifferent; all options tie.  

  ### Predicament Comparison:  
  The contractualist cycle creates a **worse philosophical predicament** than utilitarianism’s tie. While utilitarianism’s tie is straightforward (choose any), contractualism’s indeterminacy undermines its core aim—providing action-guiding principles through reasonable agreement—leaving agents without moral guidance where intuition expects clarity.
