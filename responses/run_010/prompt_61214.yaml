prompt: |-
  I am the clinical lead for a regional breast-screening programme: roughly forty thousand women a year, twelve readers, and a workflow in which every set of mammograms is read independently and in the blind by two of them, with any discordant pair — one recalls, one does not — going to a third reader for arbitration. I trained as a clinician and have no academic background in philosophy; I came to this material by accident, through an argument at a book group that turned into something I could not put down, and I have spent the last year convinced that a large share of what my colleagues argue about in arbitration meetings is not about the images at all. It is about what a reader is supposed to do once she learns that someone equally qualified looked at the same image and came out the other way. I have since found that this has a name in the epistemology literature — higher-order evidence — and that there is a related puzzle that describes our arbitration room almost exactly: cases where what the evidence about your own reliability tells you to believe conflicts with what the thing in front of you tells you to believe, so that the correct verdict requires you to hold a belief you yourself judge unsupported. I have read that some philosophers think such a state is straightforwardly irrational and that a rational agent cannot be in it, and others that it is precisely what the situation demands, and I cannot work out which of those two pictures our forms should be designed around. Our own service adds three wrinkles that I have not seen discussed anywhere. First, we are piloting an arrangement in which an algorithm performs the first read and a human the second, and I have no settled view of whether a dissent from a machine is a peer dissent, a faulty-instrument reading, or a category of its own — the answer changes what a disagreement even means. Second, our readers' own re-reads of the same films months later disagree with their original reports often enough to be measurable, which means each reader is also a disagreeing colleague of her own past self. Third, we know that certain states — the end of a long list, a week with an unusual run of recalls, being interrupted mid-case — impeach a reader generally rather than about any particular film, and at present we have no way of handling that except by hoping.

  What I want is not an essay but something I can print on one side of an A4 sheet and staple into the arbitration folder: a decision procedure a reader can run in the two or three minutes between cases, with no philosophy training, no arithmetic, and no access to anything she does not already have in front of her. It should proceed in ordered steps, and each step should say what the reader must be able to state before she may move on to the next, what she does if she cannot state it, and which way the step defaults. It must answer, in whatever order the logic requires: when learning of a disagreement obliges a reader to move and when she may stay where she is; how to tell a genuine disagreement about the film from two readers using different thresholds or different words for the same thing; how much weight a machine's dissent carries and on what conditions that weight changes; what a reader's own past dissent counts for, given that she cannot interview her former self; and how to handle the general impeachers, where nothing has gone wrong on any particular case but something has plainly gone wrong with her. It must terminate either in one of our three real actions — recall, no recall, escalate to a named senior clinician — or in an explicit handover of the question to a person, and it must be clear which of the terminations are matters of evidence and which are matters of policy that no reader should be settling alone. Above all, I want the steps at which the procedure will require someone to report a confidence she does not feel, or to sign a decision she thinks the image contradicts, marked as such and justified or removed; if the honest answer is that some akratic output is unavoidable, then say so, and tell me whether our documentation should record the reader's private first-order judgement alongside the arbitrated one or deliberately suppress it. Then tell me what you had to discard from the higher-order-evidence debate to make this runnable, what that discarding costs us in accuracy, and where the procedure will misfire at volume — the failure modes I should expect over forty thousand cases a year, and the conditions under which I should take it out of service.

  Finally, run it on three cases, showing the steps rather than just the verdicts. One: two readers disagree about a subtle architectural distortion, and the arbitrator — who is at the end of a nine-hour list — sides with the reader who called it normal, so the woman is not recalled; two years later the cancer presents clinically. Two: a reader is confident of a finding and has written it up, the algorithm flags nothing, and a senior colleague mentions in passing that she thinks this reader has been over-calling all month; the reader does not feel she has been over-calling. Three: on a case already closed as no recall, a reader's own second reading six months on flatly contradicts her original report, and she is the only person who will ever know. At least one of these should come out in a way I will dislike and would be tempted to overrule from my office; tell me which one, whether overruling would be defensible, and what I should change about the procedure if it is not.
reasoning: |-
  We are designing a decision procedure for a breast-screening arbitration scenario. The procedure must be concise, fit on one A4 sheet, and guide a reader through handling disagreements, including those involving an algorithm, self-disagreements, and general impeachers (like fatigue). The procedure should have clear steps, specify what is required to move to the next step, and terminate in one of three actions: recall, no recall, or escalate to a senior clinician. It must also address how to handle higher-order evidence (HOE) without requiring philosophy training.

  Key issues to address:
  1. When does a disagreement oblige a reader to change their view?
  2. Distinguishing genuine disagreements from threshold/terminology differences.
  3. Weight of a machine's dissent and conditions for changing that weight.
  4. How to value a reader's own past dissent.
  5. Handling general impeachers (e.g., fatigue, interruption).

  The procedure should be practical, so we abstract from philosophical debates. We'll incorporate the following principles:

  - **Peer Disagreement**: If two peers disagree, each should lower their confidence and re-examine. If after re-examination they still disagree, arbitration is needed.
  - **Machine as Peer?**: Treat the algorithm as a peer unless there is evidence of its systematic failure in a particular context. However, note that the machine's reliability might be different and context-dependent.
  - **Self-Disagreement**: A past self is a peer unless there is evidence that the current self is more reliable (e.g., due to new training). But since the current self cannot interview the past self, we rely on the current assessment and note the disagreement as a reason for caution.
  - **General Impeachers**: Conditions that generally reduce reliability (like fatigue) should trigger an escalation or re-reading by another, but without specific evidence on the case, we can only note the condition and adjust the process.

  We will design a step-by-step procedure that starts when a reader is faced with a disagreement (either from another reader, an algorithm, or their own past reading) or when they are in a state that might impeach their reliability.

  **The Decision Procedure:**

  **Title: Arbitration Decision Guide for Screening Readers**

  **Purpose:** To guide readers in resolving disagreements and handling situations where their own reliability may be compromised. This procedure is to be used when a reader becomes aware of a disagreement or when they are in a condition that may generally impeach their reliability.

  **Terminal Actions:**
  - **Recall**: Recommend recall for further assessment.
  - **No Recall**: Close the case with no further action.
  - **Escalate**: Refer the case to a named senior clinician for a final decision.

  **Steps:**

  1. **Identify the Nature of the Disagreement or Issue:**
     - If you are in an arbitration scenario because of a disagreement between two readers (or between a reader and the algorithm), proceed to Step 2.
     - If you are reviewing a case and become aware of a disagreement with your own past reading (e.g., during a random re-audit or second read), proceed to Step 2, treating your past self as a peer.
     - If you are about to read a case and are in a state that may generally impeach your reliability (e.g., end of a long list, interrupted mid-case, after a run of recalls), proceed to Step 6.

  2. **Assess if the Disagreement is Genuine:**
     - Consider: Are the two assessments (yours and the other's) about the same finding but using different thresholds or terminology? For example, one reader might call a finding "borderline" and the other "normal", but both are seeing the same thing.
     - If you can reconcile the disagreement by clarifying the threshold or terminology (e.g., both agree on the appearance but one is more conservative), note the reconciliation and decide based on the clarified evidence. Then go to Step 5.
     - If the disagreement is genuine (i.e., one sees a finding that the other does not, or the assessment of malignancy differs), proceed to Step 3.

  3. **Evaluate the Reliability of the Disagreeing Party:**
     - If the disagreement is with a human peer: Treat them as equally reliable unless you have specific evidence that in this particular context they are less reliable (e.g., they were impaired, or you have data showing they are often wrong in similar cases). If no such evidence, they are a peer. Proceed to Step 4.
     - If the disagreement is with the algorithm: 
       - Check if there are known issues with the algorithm for this type of finding or patient group (e.g., dense breasts). If yes, note it and treat the algorithm as less reliable in this context. If no, treat it as a peer. Proceed to Step 4.
     - If the disagreement is with your own past reading: Treat your past self as a peer unless you have reason to believe your current self is more reliable (e.g., due to recent training). If no such reason, treat as peer. Proceed to Step 4.

  4. **Re-examine the Case in Light of the Disagreement:**
     - Re-examine the mammogram independently, ignoring the disagreement initially. Then, consider the disagreement: does knowing that a peer saw it differently change your assessment?
     - If after re-examination you are still confident in your original assessment and can explain why the peer might have erred (e.g., they missed a subtle detail), then you may stick to your original assessment. Proceed to Step 5.
     - If after re-examination you are less confident (e.g., you see why they might have a point), then adjust your assessment accordingly. Proceed to Step 5.
     - If you are now uncertain, proceed to Step 5 with the intention to escalate.

  5. **Make a Decision or Escalate:**
     - If you have reconciled the disagreement (from Step 2) or after re-examination (Step 4) you have a clear view:
       - If the evidence points to recall, choose **Recall**.
       - If the evidence points to no recall, choose **No Recall**.
     - If the case remains unresolved (i.e., you are uncertain or the disagreement persists after your re-examination), choose **Escalate** to a senior clinician.

  6. **Handle General Impeachers:**
     - If you are in a state that may generally impeach your reliability (e.g., fatigue, interruption, a run of recalls) and you are about to read a case or are in an arbitration:
       - If you can, defer the read until you are in a better state. If deferral is not possible, then **Escalate** the case to a senior clinician without reading it yourself.
       - If you have already read the case and then realize you were impaired, and the case is not yet closed, re-read it when in a better state. If the case is closed and you later realize you were impaired, report it to the clinical lead for potential audit.

  **Special Cases and Notes:**

  - **Machine Disagreement**: In the pilot with algorithm first read, if the algorithm dissents and you are the second reader, follow Steps 2-5. Remember that the algorithm may have strengths and weaknesses. If the algorithm is known to be highly reliable for a particular finding and it flags something you don't see, take that as a strong reason to recall or escalate.
  - **Self-Disagreement**: If during a re-read you find you disagree with your own past reading, treat it as a peer disagreement. However, since you cannot discuss, re-examine carefully (Step 4). If after re-examination you still disagree, and the case is closed, consider whether the new assessment would change the outcome. If it would, and the case is within a reasonable time frame, **Escalate** to a senior clinician for review. If it is too late (e.g., the cancer presents later), document it for audit and learning.
  - **Documentation**: In cases where the procedure leads to a decision that conflicts with the reader's first-order judgment (e.g., they feel the image says one thing but due to HOE they decide another), the reader should record both their private judgment and the arbitrated decision. This is because the private judgment may be useful in audits and for understanding errors.

  **What We Discarded from the HOE Debate and Costs:**

  - We discarded the deep philosophical question of whether a rational agent can hold a belief they judge unsupported. Our procedure avoids forcing the reader into such a state by:
    - Encouraging re-examination (which may resolve the conflict).
    - Allowing the reader to stick to their view if they can explain the peer's error.
    - Escalating when uncertainty remains.
  - Cost: In cases where the first-order evidence and HOE conflict, we might lose some accuracy by either not deferring enough (if the reader sticks to their view) or deferring too much (if they change without good reason). However, by escalating in uncertain cases, we mitigate this.
  - Failure Modes:
    - At volume, we might see over-escalation if readers are too quick to escalate when faced with disagreement, causing delays.
    - Under-escalation if readers ignore HOE (e.g., fatigue) and make errors.
    - Inconsistency in how readers treat the algorithm or their own past readings.
    - We should monitor the rate of escalations and audit cases where the procedure led to outcomes that were later proven wrong.

  **Running the Procedure on Three Cases:**

  **Case 1: Two readers disagree about a subtle architectural distortion, and the arbitrator (at the end of a nine-hour list) sides with the reader who called it normal, so the woman is not recalled; two years later the cancer presents clinically.**

  - Apply the procedure as the arbitrator (who is in a state of fatigue, a general impeacher).
  - Step 1: Arbitrator is in an arbitration scenario (disagreement between two readers) and also in a general impeacher state (end of long list).
  - Step 6: Because of the general impeacher (fatigue), the arbitrator should not read the case. Instead, they must **Escalate** to a senior clinician without reading. But in this case, the arbitrator did read and decided.
  - If the arbitrator ignored Step 6 and proceeded:
    - Step 2: The disagreement is genuine (one sees distortion, the other doesn't).
    - Step 3: Both readers are peers (unless known otherwise).
    - Step 4: The arbitrator re-examines. Being fatigued, they might not re-examine properly. They side with the no-recall reader.
    - Step 5: They choose **No Recall**.
  - **Failure**: The arbitrator should have escalated due to fatigue. The procedure would have prevented this error by forcing escalation at Step 6. The cost of not escalating is a missed cancer.

  **Case 2: A reader is confident of a finding and has written it up, the algorithm flags nothing, and a senior colleague mentions in passing that she thinks this reader has been over-calling all month; the reader does not feel she has been over-calling.**

  - This is not a direct disagreement on a case, but a general impeacher (the senior's comment) and a disagreement with the algorithm.
  - Step 1: The reader has a case where they have made an initial assessment (recall) and then learns of the algorithm's dissent (no flag) and a general comment from a senior.
  - Step 6: The senior's comment is a general impeacher (suggests a pattern of over-calling). The reader must consider this.
    - The reader should re-examine the case with extra caution, but note that the comment is about a pattern, not this specific case.
  - Step 2: The disagreement with the algorithm: Is it genuine? The algorithm flagged nothing, but the reader sees something. Genuine.
  - Step 3: Algorithm: treat as peer unless known issues. Assume peer.
  - Step 4: Re-examine. Given the senior's comment (which is HOE about the reader's reliability), the reader should be extra critical. If after re-examination they still see the finding and can explain why the algorithm missed it (e.g., it's a type the algorithm is weak on), they may stick to recall. If they now doubt, they might change to no recall or escalate.
  - Step 5: If they stick to recall, they choose **Recall**. But given the general impeacher, they might also choose to **Escalate** to a senior to double-check, especially because of the senior's comment.
  - **Procedure Output**: The reader should escalate due to the general impeacher (the senior's comment). This is a policy matter because the reader's own reliability is in question. The senior's comment is not about this case, but about a pattern, so it should not change the specific evidence but trigger an independent review.

  **Case 3: On a case already closed as no recall, a reader's own second reading six months on flatly contradicts her original report, and she is the only person who will ever know.**

  - Step 1: The reader becomes aware of a disagreement with her own past reading (during a re-read, say for audit).
  - Step 2: Genuine disagreement? Yes, since it flatly contradicts.
  - Step 3: Past self is a peer unless current self has reason to be more reliable. Assume peer.
  - Step 4: Re-examine the case. If after re-examination the current reader still disagrees with the past self, then:
    - Step 5: Since the case is closed, the reader must **Escalate** to a senior clinician for review. The senior will decide whether to reopen the case and recall the patient.

  **Which Case Will You Dislike?**
  Case 1: The arbitrator should have escalated due to fatigue. You might dislike that we are suggesting escalation for every case at the end of a long list, which could be common and cause delays. But the procedure forces it to avoid errors. Overruling from your office would not be defensible because the arbitrator was impaired. Instead, you should adjust scheduling to avoid long lists or have more seniors available. If that's not possible, you might modify Step 6 to allow reading if the arbitrator feels fit, but that relies on self-assessment which is unreliable when fatigued.

  **Final Decision Procedure Document:**

  We'll now write the procedure as a one-page A4 sheet, following the above steps but in a concise, step-by-step format.
answer: |-
  ### Breast Screening Arbitration Decision Procedure  
  *For use when handling disagreements, machine dissents, self-disagreements, or general reliability concerns. Proceed step-by-step. If unsure at any step, escalate to a senior clinician.*

  ---

  #### **Step 1: Identify the trigger**  
  **What you need to state:** "This case involves [disagreement with peer/algorithm/own past reading] or [general concern about my reliability]."  
  **If you cannot state this:** Escalate to a senior clinician.  
  **Default:** Stop and escalate.  
  *Why?* Ensures you recognize why this case needs arbitration. No philosophy—just state the facts.

  ---

  #### **Step 2: Is this a genuine disagreement about the image?**  
  **What you need to state:** "The other party and I see different evidence (e.g., one sees a distortion, the other does not)."  
  *—OR—*  
  "The disagreement is only about thresholds or wording (e.g., both see the same finding but one calls it 'borderline' and the other 'normal')."  
  **If you cannot state this:** Escalate.  
  **Default:** Escalate.  
  *Why?* Filters out terminology differences. If thresholds/wording differ, reconcile by recalling if either party flagged concern. Proceed only for genuine evidence conflicts.

  ---

  #### **Step 3: Assess the reliability of the disagreeing party**  
  **What you need to state:**  
  - **For human peer:** "I have no evidence they were impaired for this case." → Treat as peer (equally reliable).  
  - **For algorithm:** "I know if it performs well/poorly for this finding type (e.g., architectural distortion)."  
    - *If poorly:* Treat as faulty instrument (discard dissent).  
    - *If well/unknown:* Treat as peer.  
  - **For own past reading:** "I have no new training or evidence that I’m more reliable now." → Treat past self as peer.  
  **If you cannot state this:** Escalate.  
  **Default:** Treat as peer.  
  *Why?* Machines are peers unless proven unreliable for specific tasks. Past selves are peers unless you have improved. No arithmetic—draw from known data (e.g., algorithm performance reports).

  ---

  #### **Step 4: Re-examine the image independently**  
  **What you need to state:** "After re-examining the mammogram alone, my initial view is [recall/no recall]."  
  **If you cannot state this:** Escalate.  
  **Default:** Escalate.  
  *Why?* Focuses on first-order evidence. Ignore the disagreement until Step 5.

  ---

  #### **Step 5: Adjust for disagreement or reliability concerns**  
  **What you need to state:**  
  - **If disagreement with peer (human, algorithm, or past self):**  
    "I can explain why they might be wrong (e.g., they missed a detail, or I have new context)." → *Keep your view from Step 4.*  
    *—OR—*  
    "I cannot explain the disagreement, and it undermines my confidence." → *Flip your view.*  
  - **If general reliability concern (e.g., fatigue, interruption, run of recalls):**  
    "I am confident this concern did not affect me for *this specific case*." → *Proceed to Step 6.*  
    *—OR—*  
    "I cannot rule out that this concern affected me." → *Escalate.*  
  **If you cannot state this:** Escalate.  
  **Default:** Flip your view (for disagreements) or escalate (for reliability concerns).  
  *Why?* Requires humility. If you cannot justify dismissing a peer, change your view. General impeachers (e.g., fatigue) force escalation—they are policy issues, not evidence.

  ---

  #### **Step 6: Decide or hand off**  
  **Terminal actions (choose one):**  
  - **Recall:** If evidence points to concern.  
  - **No recall:** If evidence is clearly normal.  
  - **Escalate to senior clinician:** If uncertain after Step 5.  
  **What you need to state:** "I am not conflicted about this decision."  
  **If you cannot state this:** Escalate.  
  **Default:** Escalate.  

  ---

  ### Key Features  
  - **Conflicts marked:** Step 5 may force you to flip your view despite disagreeing (e.g., if you cannot explain a peer’s dissent). This is unavoidable akrasia (acting against your first-order judgment) but prevents overconfidence.  
    - **Documentation:** Record both your private Step 4 judgment and the final arbitrated decision. This aids audits and preserves first-order evidence.  
  - **Machine dissent:** Treated as peer unless proven unreliable for the finding type (Step 3). Weight increases if the algorithm excels in that context (e.g., microcalcifications).  
  - **Self-disagreements:** Past self is a peer (Step 3). If unresolved after re-examination (Step 5), flip or escalate—you cannot interview yourself.  
  - **General impeachers:** Trigger escalation (Step 5) as they are policy issues (e.g., fatigue means you should not decide alone).  
  - **Termination clarity:**  
    - Recall/No recall: Evidence-based.  
    - Escalate: Policy-based (reliability concerns, unresolved disagreements).  

  ---

  ### What We Discarded from Philosophy and Costs  
  - **Discarded:** Debate on whether "rational akrasia" (holding two conflicting beliefs) is possible. We force action (flip/escalate) to avoid paralysis.  
  - **Cost in accuracy:**  
    - Over-flipping in Step 5 may defer too much to peers/machines, missing true positives.  
    - Under-flipping may ignore higher-order evidence, causing false negatives.  
  - **Failure modes at scale (40k/year):**  
    - **Misfire 1:** Over-escalation due to ambiguity in Steps 2 or 5, delaying workflows.  
    - **Misfire 2:** Under-escalation if readers skip self-impeachment (Step 5), worsening fatigue-related errors.  
    - **Misfire 3:** Algorithm dissent overtrusted if local performance data is outdated.  
  - **When to withdraw:** If audit shows rising arbitration escalations (>20% of disagreements) or peer-machine conflict errors increase by >10%.  

  ---

  ### Case Walkthroughs  
  **Case 1: Arbitrator fatigue, missed cancer**  
  - Step 1: Trigger = Disagreement (two readers) + general concern (end of 9-hour list).  
  - Step 2: Genuine disagreement (architectural distortion vs. normal).  
  - Step 3: Both human peers → treat as peers.  
  - Step 4: Re-examine → arbitrator sees "normal."  
  - Step 5: General reliability concern (fatigue) → "Cannot rule out it affected me" → **Escalate** (should not default to "no recall").  
  - *Procedure outcome:* Escalate to senior.  
  - **Why you’ll dislike this:** It forces escalation for fatigue, which feels excessive. But overruling ("no recall") is indefensible—fatigue impeaches judgment. *Fix:* Rotate arbitrators hourly to avoid long lists.  

  **Case 2: Reader over-calling? Algorithm dissent + senior comment**  
  - Step 1: Trigger = Disagreement (algorithm flags nothing) + general concern (senior’s comment).  
  - Step 2: Genuine disagreement (reader sees finding, algorithm does not).  
  - Step 3: Algorithm → peer (unless known issues).  
  - Step 4: Re-examine → reader still sees finding.  
  - Step 5: General reliability concern (senior’s comment) → "Cannot rule out it affected me" → **Escalate**.  
  - *Procedure outcome:* Escalate to senior.  
  - **Why it works:** Senior’s comment is a policy-level impeacher; reader should not self-judge "over-calling."  

  **Case 3: Self-disagreement on closed case**  
  - Step 1: Trigger = Disagreement with own past reading.  
  - Step 2: Genuine (flat contradiction).  
  - Step 3: Past self → peer (unless new training).  
  - Step 4: Re-examine → current reader sees recall-worthy finding.  
  - Step 5: Cannot explain disagreement (past/current both peers) → Flip view → **Recall**.  
  - Step 6: Since case is closed, **Escalate** to senior to reopen.  
  - *Procedure outcome:* Escalate to senior for recall.  
  - **Why it works:** Self-disagreements escalate; no silent errors.  

  ---

  **Final Output**  
  [Print this on one A4 sheet. Staple into arbitration folder.]  
  **Arbitration is a safeguard—when in doubt, escalate. Track disagreements in audits to refine thresholds and machine use.**
