prompt: |-
  I'm giving a 20-minute paper at an interdisciplinary methods workshop and I want the Q&A prep, not a defence of the paper.

  The room: mostly classical and Near Eastern archaeologists of a processualist stripe who think "hunting for the historical kernel" is a category error dressed up as scholarship; two oral-tradition people in the Parry–Lord lineage who will insist that formulaic composition *generates* detail rather than transmitting it; a couple of ancient historians whose whole question is going to be whether my criterion is falsifiable or just a nicer-sounding way of saying "trust your gut"; and one Hebrew Bible scholar who has spent twenty years in the Exodus debate and will deeply resent Troy and Arthur being waved at her in the same breath as her material.

  My paper's thesis, in short: the "is there a historical core here?" question is being asked at the wrong level. Don't ask whether a given detail is true — ask whether the society that produced the tradition had a *channel* with the capacity to carry that type of fact across the gap between the events and the earliest surviving text, where capacity means genre, institution, and incentive-structure, not merely "they had writing". The sketch I'll give is that the Linear B palace archives are exactly such a channel for some payloads and structurally incapable of others; that the post-palace centuries have no channel at all for palace-level political content; that in the Arthur case a channel does exist but it is dynastic/genealogical and gets conscripted to carry battle-topography, which is a different payload with different corruption properties; and that the Exodus case is genuinely different again because the payload in question is a mass movement rather than a named event, so the test bites from the other direction. I'm explicit that the test licenses no inference from "a channel existed" to "the content came through intact" — it only sorts traditions into candidates and non-candidates. I know that concession is where I'm exposed.

  So: prepare me for the question period. I want the objections this particular room will actually raise — not the ones a philosophy audience or a general-interest journalist would raise at the same paper — ordered by how much damage each would do if I fumbled it. Phrase each one the way that faction would phrase it, in their own vocabulary and with their own complaints about my terminology, because half the fight here is over words like "channel" and "payload" and "tradition".

  For each: a two-minute reply I can deliver standing up, a blunt note on where that reply goes soft and what they'll say immediately afterwards, and whether I should concede, hold, or concede-and-reframe. Then tell me what I should give away in the first two minutes of the talk to lower the temperature on the objections I'm going to lose anyway, which single reply absolutely has to land for the paper to survive at all, and — the bit I care about most — the question I'm praying nobody asks, with a holding answer for it that doesn't sound like a holding answer.

  Don't give me a reading list or citations, I know the literature, I want the questions and what to say back.

  Output as a JSON object, British English throughout, with exactly these fields:

  - "room_diagnosis": a couple of sentences on what this audience actually cares about, and where that diverges from what my paper cares about
  - "concede_up_front": array of strings — the things to hand over early in the talk
  - "objections": array, ordered worst-first, each object with "rank" (integer), "likely_from" (which faction in the room), "as_they_would_put_it" (their words, their jargon, the tone they'd use), "why_it_bites", "reply_two_minutes", "soft_spot" (where the reply is weakest and the follow-up it invites), "concede_or_hold" (one of "concede", "hold", "concede-and-reframe")
  - "must_land": the one sentence that has to land
  - "question_i_pray_nobody_asks": object with "question", "why_it_sinks_me", "holding_answer"
  - "load_bearing_weakness": the weakest point in my own argument, stated flatly, that I should prepare for rather than hope gets missed
reasoning: |-
  Okay, the user is prepping for a Q&A after presenting a paper at an interdisciplinary methods workshop. They need specific, targeted preparation for the audience they'll face, not a general defense. Let me break down their situation.

  First, the audience consists of different factions: processualist archaeologists, Parry-Lord oral tradition scholars, ancient historians focused on falsifiability, and a Hebrew Bible expert sensitive about Exodus comparisons. The user's thesis shifts the focus from asking if a historical detail is true to evaluating whether the society had a "channel" capable of transmitting that type of information. Key terms like "channel" and "payload" are already contentious.

  The user wants objections phrased in each faction's jargon, prioritized by potential damage. For each objection, they need a two-minute reply, its weak spots, and whether to concede, hold, or reframe. They also need upfront concessions to lower the temperature, a must-land sentence, a dreaded question with a holding answer, and their argument's load-bearing weakness.

  Starting with room diagnosis: The audience cares about methodological rigor and disciplinary boundaries. Archaeologists prioritize falsifiability and data, oral tradition scholars care about formulaic composition dynamics, historians want testable criteria, and the Bible scholar rejects superficial parallels. This diverges from the user's focus on transmission channels over truth claims.

  For upfront concessions: They should clarify terms early, acknowledge transmission doesn't guarantee preservation, admit the model is provisional, and validate the Exodus scholar's concerns to preempt backlash.

  Objections should be ordered by damage. The worst would be the falsifiability challenge from historians because it questions the model's validity. Next, Parry-Lord scholars might attack the payload-channel distinction as ignoring oral composition mechanics. Then archaeologists could dismiss the model as untestable without material evidence. The Bible scholar's objection about Exodus uniqueness comes last but needs careful handling to avoid alienating.

  The must-land sentence should emphasize that the model only sorts traditions into candidates/non-candidates, making it clear they're not claiming transmission equals truth.

  The dreaded question would be about circularity: How to identify a channel without presupposing what it carried. The holding answer needs to reframe channel identification as a separate historical inquiry.

  The load-bearing weakness is admitting that channel identification relies on existing historical models, creating potential circularity. The user must be ready to address this without collapsing their argument.
