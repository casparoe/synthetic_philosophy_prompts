     - **LIE**: Asserting a believed-false statement in a context where the speaker warrants the truth (i.e., the hearer is entitled to rely on the assertion as true).  
     - **MISLEADING**: (a) Asserting a true statement with intent to cause a false belief, or (b) asserting a believed-false statement in a context without warranty, with intent to cause a false belief.  
     - **NEITHER**: Silence or no assertion, or contexts where assertions are not taken as commitments (e.g., case 6).  
