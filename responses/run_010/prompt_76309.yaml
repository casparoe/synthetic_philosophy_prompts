answer: |-
  Your questions cut to the heart of Hobbes's materialist and nominalist epistemology, and his vision of scientific demonstration. Let's break down each puzzle based on *De Corpore* (Part I, Ch. 6) and his broader system:

  1.  **Why complain about the line not being a body? Beyond the cause/accident distinction?**
      *   **Beyond Cause/Accident:** Yes, this complaint *does* add crucial work. The cause/accident distinction establishes that definitions must be *genetic* (giving generation). The complaint about the line reinforces Hobbes's **strict materialism** and **nominalism**.
      *   **The Materialist Mandate:** For Hobbes, philosophy is solely about *bodies* (natural or artificial) and their *motions*. Only bodies can move. A geometrical line, conceived as length without breadth, is an *abstraction* derived from considering the *boundary* of a moving body. To say "a line moves" is, for Hobbes, a category error and potentially reifies an abstraction into a real entity. It smuggles in a non-corporeal actor.
      *   **Epistemological Grounding:** Science must be grounded in conceivable, *real* operations. Defining a circle via the motion of a line relies on an abstract entity performing an action it cannot physically perform. Defining it via the motion of a body (e.g., one end of a staff fixed, the other end tracing the path) grounds the concept directly in the motion of real, material bodies – the *only* things capable of motion. This ensures the definition refers to something genuinely conceivable within his materialist ontology.
      *   **Why it Matters (Even if Geometers Know):** Hobbes isn't just critiquing geometers' *practice*; he's critiquing their *language* and its *implications* for the foundations of science. He argues that using language implying motion of non-bodies obscures the true, material basis of geometry and potentially opens the door to "insignificant speech" or metaphysical nonsense (like incorporeal substances). For genuine science, definitions must be *strictly* corporeal.

  2.  **How demanding is the "generation" requirement? Recipe vs. Deductive Structure?**
      *   **Primarily Deductive Structure:** Hobbes's requirement is primarily about **providing a causal mechanism that licenses deduction**, not necessarily a literal recipe for physical construction (though it often resembles one).
      *   **"Generation" as Causal Origin:** "Generation" means specifying the *cause* or *manner of production* of the thing. For the circle, it's the *motion* that produces the figure. This generative cause becomes the starting point for syllogistic reasoning to deduce properties.
      *   **Idealization is Permitted:** Hobbes understands that geometric generation is an *idealized mental operation*. We imagine a perfect body moving perfectly. The point isn't that we must physically build it with wood every time (though that's conceivable), but that the definition provides a *clear mental model of its causal origin*. This model, precisely because it describes a process (motion), allows us to see *why* properties necessarily follow (e.g., why all radii *must* be equal – they are traces of the same moving body at different moments, all originating from the same fixed point).
      *   **Contrast with Accidents:** A definition listing accidents ("all points equidistant") doesn't reveal the *reason why* this is true or how it connects to other properties. It's merely descriptive, lacking the causal hook for deduction. The genetic definition *explains* the equidistance as a *consequence* of the generative motion.

  3.  **Geometry as Paradigm, Civil Philosophy Demonstrable, Natural Philosophy Not:**
      *   **Geometry as Paradigm (& Only Perfect Science):**
          *   **Precise Definitions Possible:** We can define geometric figures *genetically* through the motions *we ourselves impose* on idealized bodies. We have perfect knowledge of the cause because we *stipulate* it through definition ("We make the circle ourselves" - *De Corpore* I.6). This yields absolute certainty.
          *   **Deductive Certainty:** From these clear, causal definitions, properties can be deduced syllogistically with absolute necessity. The conclusions follow logically from the defined generation.
          *   **Subject Matter:** Deals with abstracted properties of bodies (figure, magnitude) generated by *determinate motions we conceive clearly*.
      *   **Civil Philosophy Demonstrable:**
          *   **Artificial Generation:** The commonwealth, like geometric figures, is an *artifact* constructed by human action ("generation"). We define its cause: the voluntary covenants and authorizations of individuals seeking peace (*Leviathan*).
          *   **Deduction from Human Nature & Contract:** Starting from definitions of fundamental concepts (Right of Nature, Law of Nature, Covenant, Person, Representative) derived from the motions of human passions and reason, we can deduce the necessity of sovereign power, its rights, and the duties of subjects. The cause (human agreement) is knowable because it's a deliberate human act.
          *   **Subject Matter:** Deals with voluntary motions of human bodies (desires, aversions, speech, agreement). We know the "generation" because it's based on principles of human nature we experience internally and actions (contracts) we perform.
      *   **Natural Philosophy NOT Demonstrable (in the same way):**
          *   **Unknown True Causes:** We cannot know the *true, internal, generating causes* of natural phenomena (e.g., gravity, magnetism, light). We only observe effects and infer *possible* causes (*De Corpore* IV.25-26).
          *   **Hypothetical Causes:** Natural philosophy proceeds by formulating "suppositions" or hypotheses about motions that *could* produce the observed effects. These are *conditional* ("If such-and-such motion occurs, then this phenomenon follows"). They provide "sufficient" causes (explanations that account for the phenomena) but not "necessary" causes (the one true cause) with geometric certainty.
          *   **Subject Matter:** Deals with natural bodies and their motions, whose *internal, invisible mechanisms* are hidden from us. We lack access to their true "generation".
      *   **Separating Position from Assertion:**
          *   **Core Requirement (Argument):** Genuine science (scientia) requires knowing the generating cause to license necessary deduction. This is argued via the circle example and the critique of non-genetic definitions.
          *   **Materialist Grounding (Argument):** Science must be about bodies in motion; definitions involving motion must refer to corporeal motion. This is argued via his ontology.
          *   **Geometry's Status (Argument & Assertion):** That geometry *meets* these requirements perfectly is argued (via the circle). That it is the *only* existing perfect science is largely asserted as a consequence of his criteria and his view of other fields. It's a strong *claim* based on his definitions.
          *   **Civil Philosophy's Status (Argument):** That civil philosophy *can* meet the requirements is argued by showing how its subject (human artifice, covenants) allows for genetic definitions grounded in human action/passion/motion. This is developed extensively in *Leviathan* and *De Cive*.
          *   **Natural Philosophy's Status (Argument):** That natural philosophy *cannot* meet the requirements is argued based on the limits of human perception regarding internal natural causes. We cannot generate natural phenomena at will or see their true inner motions.

  **Key Takeaway for Seminar:** Hobbes's theory of definition is inseparable from his radical materialism, nominalism, and his view of science as causal deduction. The "genetic" definition is the linchpin. It provides the causal starting point for deduction, ensures corporeal grounding (avoiding reification of abstractions), and explains *why* geometry and civil philosophy (as sciences of *artifacts* or deliberate human actions) can be "demonstrable," while natural philosophy (dealing with nature's hidden mechanisms) cannot achieve the same level of certainty. The complaint about the line isn't pedantry; it's a vital defense of the materialist foundation against perceived conceptual slippage. Focus on the connection between definition, cause, deduction, and the knowability of the cause based on the subject matter's origin (human construction vs. nature).
