  Third puzzle: Why is geometry the paradigm, civil philosophy demonstrable, but natural philosophy not? The user wants to separate Hobbes's assertions from his arguments. Geometry works because it deals with abstracted motions from real bodies, allowing clear definitions and deductions. Civil philosophy involves voluntary motions (human actions), which can be similarly defined and deduced. But natural philosophy deals with unknown causes of natural phenomena, making definitions impossible. So geometry and civil are knowable; natural isn't. The user might need to highlight this epistemological boundary in class.

