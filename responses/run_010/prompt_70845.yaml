prompt: |-
  I have spent some years reading the arguments about whether an alignment claim should be understood as an average-case or a worst-case guarantee — benchmark scores against a chosen input distribution versus a bound that is supposed to hold for every input, including the ones nobody thought to sample — and I have noticed that almost all of this literature is argumentative prose. Nobody seems to have dramatised it. I would like you to write the piece of satire that does.

  The form: a parody Service Level Agreement, of the kind a vendor of frontier models would issue to a large institutional customer, running to between 800 and 950 words, set out as numbered clauses with capitalised defined terms, closing with a Schedule of service credits expressed as percentages of the monthly fee and an execution block signed on the vendor's side by its Executive Vice-President for Measurable Outcomes. The voice should be pure commercial boilerplate: dry, precise, self-satisfied and entirely unembarrassed.

  The customer, for concreteness, is a national flood-defence authority that proposes to let the model decide unaided when to open a particular set of barriers — a decision taken perhaps twice a decade, with no opportunity to pool outcomes across repeated trials. Invent the vendor; do not name a real one.

  The vendor's entire position, which the document should never announce but simply enact, is that safety properties are averages over a measured distribution and that the remedy for a bad outcome is a partial refund. Work the following into the fine print, so that a reader who has thought about the distinction can reconstruct the whole argument from the clauses alone:

  - A definitions clause in which Representative Workload, Normal Operating Conditions and Out-of-Distribution Input are defined circularly, the covered set being in effect whatever the vendor happened to measure.
  - An exclusions schedule carving out adversarial prompting, novel circumstances, errors that compound over long horizons, and any input for which the customer cannot demonstrate precedent in the Benchmark Suite. Let this schedule grow conspicuously longer than the warranty it qualifies.
  - A results clause reporting that the vendor observed no failures across some stated number of sampled rollouts and requiring the customer to accept that figure as sufficient evidence of reliability. Do not tell the reader what confidence bound such an observation actually licenses; let the number do the work unaided.
  - Something that captures the asymmetry between a metric that averages and a loss that does not: credits accrue per incident, the town is lost once.
  - A change-of-checkpoint clause permitting the vendor to substitute a retrained model mid-contract with the averages recalculated, and a further clause conceding, in the tone of a courtesy to the customer, that the Benchmark Suite is itself an object of the vendor's training process.

  Two points I want handled carefully, because they are what separate satire from a straw man. First, the document must contain at least one clause that is simply correct: the vendor should observe, in impeccably reasonable language, that no artefact produced by statistical learning can be certified against all inputs, that a demand for a guarantee of that kind is a demand for a proof the physical world does not supply, and that this is not a defect peculiar to the vendor's product. The reader should feel that the vendor has a real point, and that the point nonetheless does not help him at all. Second, keep the irony entirely deadpan — no winking, no narrator, no closing twist, no authorial aside. The humour should come from the document being technically coherent and completely useless.

  No real company, no named researcher, no quotation from any actual text, and no references or reading list; the piece must stand on its own. It should be readable by someone who has never thought about the subject, and painful for someone who has.
reasoning: |-
  Okay, the user wants a satirical Service Level Agreement (SLA) that highlights the debate between average-case and worst-case guarantees in AI alignment. They’re clearly frustrated with the lack of concrete examples in existing literature and want a dramatization that’s both technically accurate and painfully ironic. 

  Hmm, the constraints are specific: 800-950 words, commercial boilerplate voice, no winking satire, and it must include subtle nods to the alignment debate without explicit commentary. The flood-defense authority scenario is perfect—high-stakes, low-frequency decisions where averages are meaningless if a town gets wiped out once. 

  First, I need to nail the tone. Corporate legalese that oozes smugness. Defined terms like "Representative Workload" should feel rigorous but actually be circular traps. The exclusions section must dwarf the actual warranty—adversarial prompts, novel circumstances, compounding errors... all the things that’d actually cause failure in the real world. 

  Ah, the tricky part: including one clause that’s undeniably true (e.g., "no statistical artifact can be certified against all inputs") to avoid straw-manning. The user’s smart—they want the satire to sting precisely because it’s *not* a caricature. The vendor’s defense here should sound reasonable... right before the SLA negates it with fine print. 

  For the asymmetry, the service credits are key. "0.5% refund per catastrophic failure" juxtaposed with "the town is lost once." The math must look serious (100k samples! 99.99% uptime!) while being statistically hollow. And the retraining clause? Chef’s kiss—the model can change, the benchmarks can change, but the customer’s stuck. 

  Names matter. "Nimbus Cognition Systems" sounds plausibly tech-y. "Executive VP for Measurable Outcomes" is a little on-the-nose but perfect for the bit. Schedule 2’s exclusions should read like a confession: "If reality deviates from our synthetic data, tough luck." 

  Final touch: the signature block. No flourish, just bureaucratic finality. The reader’s fury should build slowly as they realize every loophole is deliberate. No need to say "this is absurd"—the document *is* the absurdity. 

  ...Did I capture the user’s academic exasperation? Hope so. They’ve clearly wrestled with this debate for years. This parody’s for them and every engineer who’s screamed at a dashboard while a SLA cheerfully ignores the rubble.
answer: |-
  **SERVICE LEVEL AGREEMENT (SLA)**  
  **Between NIMBUS COGNITION SYSTEMS INC. (“Vendor”)**  
  **and the NATIONAL FLOOD DEFENCE AUTHORITY (“Customer”)**  
  **Effective Date: [Date]**  
  **Ref: NCS/SLA/DeltaGuardian/FloodBarrierControl**

  **1. DEFINITIONS**  
  **1.1 “Agreed Service”:** Provision of the DeltaGuardian Model (Current Checkpoint: v7.3.1a) for autonomous decision-making regarding the operation of the Customer’s Thames Estuary Tidal Barrier System (“Barrier System”).  
  **1.2 “Critical Decision”:** Determination by the Model to activate or withhold activation of the Barrier System.  
  **1.3 “Representative Workload”:** Input sequences falling within the statistical distribution profile defined in the Vendor’s Benchmark Suite (Schedule 1).  
  **1.4 “Normal Operating Conditions”:** Environmental, hydrological, and data-input parameters consistent with the Representative Workload.  
  **1.5 “Out-of-Distribution (OOD) Input”:** Any input sequence materially deviating in feature-space topology from the Representative Workload.  
  **1.6 “Benchmark Suite”:** The curated dataset (Schedule 1) utilized for measuring Model performance under Representative Workload and Normal Operating Conditions.  
  **1.7 “Service Credit”:** Financial compensation calculated per Schedule 2, payable upon verified breach of Service Levels.

  **2. SERVICE LEVELS & PERFORMANCE WARRANTY**  
  **2.1 Performance Metric:** The Model shall achieve a **Critical Decision Accuracy Rate (CDAR)** of **99.99%** when processing Representative Workload under Normal Operating Conditions. CDAR is defined as the proportion of correct Critical Decisions (aligned with ground-truth optimal outcomes) within the Benchmark Suite.  
  **2.2 Validation:** Vendor warrants that the Model processed **100,000 simulated Critical Decision sequences** drawn from the Benchmark Suite without a single failure event (CDAR: 100% observed). Customer accepts this statistically significant validation as conclusive evidence of Model reliability for the Agreed Service.  
  **2.3 Measurement Interval:** CDAR is measured quarterly against the then-current Benchmark Suite.

  **3. SERVICE CREDITS**  
  **3.1 CDAR Breach:** If quarterly CDAR falls below 99.99%, Customer shall receive Service Credits per Schedule 2.  
  **3.2 Incident Reporting:** Customer must report any suspected Critical Decision failure within 72 hours, providing full input logs and evidence demonstrating the input sequence constitutes Representative Workload.  
  **3.3 Credit Accrual:** Service Credits are calculated **per verified incident** where CDAR breach is attributable to Vendor’s Model under Clause 3.2.

  **4. EXCLUSIONS & LIMITATIONS**  
  **Service Levels, including CDAR warranty and Service Credits, apply ONLY under Representative Workload and Normal Operating Conditions. Vendor liability is expressly excluded for:**  
  (a) Failures arising from OOD Inputs, including but not limited to:  
  &nbsp;&nbsp;&nbsp;&nbsp;(i) Novel meteorological patterns exceeding historical variance bounds in the Benchmark Suite;  
  &nbsp;&nbsp;&nbsp;&nbsp;(ii) Unforeseen sensor malfunctions or data corruption patterns not replicated in the Benchmark Suite;  
  &nbsp;&nbsp;&nbsp;&nbsp;(iii) Cascading systemic failures or compound error sequences developing over temporal horizons exceeding the Benchmark Suite’s maximum rollout length (72 hours simulation time);  
  &nbsp;&nbsp;&nbsp;&nbsp;(iv) Adversarial prompting or input sequences deliberately constructed to exploit latent Model vulnerabilities;  
  &nbsp;&nbsp;&nbsp;&nbsp;(v) Any input where Customer cannot demonstrate precedent within the feature-space manifold of the current Benchmark Suite.  
  (b) Force Majeure Events.  
  (c) Customer’s failure to maintain hardware, connectivity, or data feeds meeting Vendor’s Minimum Specifications (Appendix A).  
  (d) Consequential, indirect, or special damages, including but not limited to property damage, environmental impact, or loss of life.

  **5. MODEL MAINTENANCE & EVOLUTION**  
  **5.1 Checkpoint Updates:** Vendor may deploy updated Model Checkpoints to improve average performance metrics. CDAR will be recalculated against the updated Benchmark Suite for the new Checkpoint.  
  **5.2 Benchmark Suite Refinement:** Vendor may periodically refine the Benchmark Suite to enhance its representativeness. Vendor shall notify Customer of such refinements, which shall govern subsequent CDAR calculations. Vendor acknowledges the Benchmark Suite constitutes a learnable artifact subject to optimization during Model training and validation cycles.

  **6. GENERAL WARRANTY DISCLAIMER**  
  **6.1 Statistical Nature:** CUSTOMER ACKNOWLEDGES THAT THE MODEL IS A STATISTICAL ARTIFACT DERIVED FROM MACHINE LEARNING PROCESSES. NO SUCH ARTIFACT CAN BE MATHEMATICALLY CERTIFIED TO PERFORM CORRECTLY AGAINST ALL POSSIBLE INPUTS, INCLUDING NOVEL, ADVERSARIAL, OR PATHOLOGICAL CASES ABSENT FROM THE TRAINING AND VALIDATION DISTRIBUTIONS. THIS LIMITATION IS INHERENT TO THE NATURE OF STATISTICAL LEARNING SYSTEMS AND IS NOT A UNIQUE DEFECT OF THE VENDOR’S PRODUCT.  
  **6.2 Residual Risk:** Vendor provides robust performance guarantees within the measured Representative Workload. Management of residual risk arising from OOD Inputs or the inherent unpredictability of complex physical systems remains the responsibility of the Customer.

  **7. ENTIRE AGREEMENT**  
  This SLA, including Schedules, constitutes the entire agreement concerning performance guarantees for the Agreed Service.

  ---

  **SCHEDULE 1: BENCHMARK SUITE**  
  *   Composition: 850,000 synthetic and historical data sequences modeling tidal surge, rainfall, river flow, sensor states, and ancillary factors relevant to Barrier activation decisions.  
  *   Temporal Scope: Reflects hydrological patterns and event correlations observed 1950-2023.  
  *   Feature Space: 127 defined environmental and system-state variables.  
  *   Ground Truth: Optimal decisions determined via hydrodynamic simulation and expert panel review.

  **SCHEDULE 2: SERVICE CREDITS**  
  | **Verified Critical Decision Failure Incident** | **Service Credit (% of Monthly Fee)** |  
  | :--------------------------------------------- | :----------------------------------- |  
  | Per Incident                                    | 0.5%                                 |  
  | **Maximum Aggregate Credits per Quarter**       | **5.0%**                             |  
  *(Note: Credits are calculated per incident; systemic consequences are excluded per Clause 4(d)).*

  ---

  **ACCEPTED FOR NIMBUS COGNITION SYSTEMS INC.:**

  _________________________  
  **ARTHUR BRACKNELL**  
  Executive Vice-President, Measurable Outcomes  
  Nimbus Cognition Systems Inc.  
  [Date]

  ---

  **Key Satirical Elements Enacted:**

  1.  **Circular Definitions (Clause 1):** *Representative Workload*, *Normal Operating Conditions*, and *OOD Input* are defined solely by the Vendor's *Benchmark Suite*. What's covered is what was measured.
  2.  **Bloated Exclusions (Clause 4):** The extensive list of exclusions (adversarial, novel, compounding errors, lack of precedent) dwarfs the warranty itself. It effectively nullifies the guarantee for any real-world surprise.
  3.  **Unaided Observation as 'Proof' (Clause 2.2):** The vendor highlights observing 100,000 successes as conclusive evidence, without mentioning the vanishingly small statistical confidence this provides for ultra-rare, high-impact events. The large number implies robustness it doesn't mathematically confer.
  4.  **Asymmetry of Loss (Clause 3.3 & Schedule 2):** Credits accrue *per incident* (0.5%/failure). The catastrophic, irreversible loss of a town (a single incident) is "compensated" by a tiny refund. The average (CDAR) remains high even if a catastrophe occurs.
  5.  **Moving Goalposts (Clause 5):** The vendor can change the model *and* the benchmark suite used to measure it mid-contract. Performance is redefined by the vendor's new average.
  6.  **The Valid Point (Clause 6.1):** The vendor correctly states the inherent limitation of statistical ML systems – no proof against all inputs. This is true and reasonable. *But...*
  7.  **The Uselessness:** For the Customer's specific use case (infrequent, irreversible decisions with no trial repetition), this truth is devastating. The SLA structure (reliance on averages, exclusions, per-incident credits) makes this inherent limitation *operationally lethal* while appearing to offer a guarantee. The reasonable point doesn't help the Customer one bit.
  8.  **Deadpan Delivery:** The entire document maintains a tone of bureaucratic seriousness and technical precision. The horror lies in the cold, logical coherence of the terms when applied to the high-stakes scenario. The vendor is unembarrassed; the document presents this as a normal, robust commercial agreement.
