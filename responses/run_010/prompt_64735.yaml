answer: |-
  Here are rejected candidates followed by the case:  
  - *Career diplomat becoming a wilderness guide*: Rejected—preference change could be circumstantial.  
  - *Omnivore adopting Jainist veganism*: Rejected—epistemic transparency hard to earn without exotic experiences.  
  - *Classical musician switching to experimental noise art*: Rejected—core preference shift ambiguous.  

  **Case: Maria’s Pain Management**  
  Maria, a 45-year-old architect with chronic back pain, must choose between two treatments. Option A is intensive physical therapy (PT): 6 months of grueling daily exercises reducing pain modestly but preserving her active identity (hiking, site visits). She endured similar PT for a knee injury, knowing its exhausting, incremental nature. Option B is long-term opioid medication: it controls pain better but alters her neurochemistry, inducing apathy toward physical pursuits she now values. She briefly used post-surgical opioids, recognizing their numbing effect on passions. PT maintains her core self; opioids rewire her reward system, making her indifferent to achievements requiring physical engagement.  

  ---

  ### Demonstration  
  1. **Epistemic Audit**: Maria’s acquaintance comes from *direct past experiences*:  
     - PT’s nature is known from her knee rehab (same fatigue/frustration).  
     - Opioids’ subjective effect is known from post-surgery use (same emotional blunting).  
     This is *phenomenal knowledge* (what-it’s-like), not description. She recalls the visceral drag of PT and the detachment from opioids.  

  2. **Transformation Audit**:  
     - **Changes**: Under opioids, Maria’s *core preference for physical mastery* (key to her identity) dissolves. She no longer cares about hiking or hands-on design work.  
     - **Stays fixed**: Her valuation of creative problem-solving (e.g., drafting) persists.  
     - **Core vs. peripheral**: The shift isn’t circumstantial (e.g., less time for hobbies) but *dispositional*; opioids dampen dopamine responses to exertion, altering what she finds meaningful.  

  3. **The Calculation**:  
     | **Acts**               | **Successful pain reduction (p=0.7)** | **Poor pain reduction (p=0.3)** |  
     |-------------------------|-----------------------------------|--------------------------------|  
     | **PT**                  | Moderate pain, *values intact* [SV: 60] (known from knee rehab) | High pain, *values intact* [SV: 10] (known from current state) |  
     | **Opioids**             | Low pain, *values altered* [SV: 40] (known from surgery + projection of chronic use) | Low pain, *values altered* [SV: 40] (projection) |  
     **Key**: SV = Subjective value (0–100 scale). All cells filled from acquaintance/history except opioid outcomes (projection from acute to chronic use). Crucially, she *can* project opioid-SV: past experience lets her simulate chronic emotional blunting ("This dulled state would persist, making my old joys meaningless").  

  4. **Verdict**: Choice is decidable. Maria calculates:  
     - PT: (0.7 × 60) + (0.3 × 10) = 45  
     - Opioids: (0.7 × 40) + (0.3 × 40) = 40  
     **Pillar giving way**: Personal transformation alone doesn’t block choice. She *compares futures* from her current epistemic vantage: though opioids change her, she grasps both the *process* (from past use) and *outcome* (projected value shift) well enough to assign SVs.  

  5. **Load-Bearing Feature**: *Asymmetric projection capacity*—Maria can simulate opioid-induced value changes from past experience, but her pre-transformation self couldn’t simulate PT’s value stability. Remove this (e.g., no prior opioid exposure), and epistemic opacity returns, collapsing into Paul’s dilemma.  

  6. **Best Counterattack & Reply**:  
     - **Counterattack**: Post-opioid Maria’s values are *incommensurable* with current Maria’s; assigning SV=40 assumes comparability, begging the question.  
     - **Hardest version**: Even if she projects alienation, valuing it *negatively* illegitimately privileges her current self. Rationality requires neutrality between possible future selves.  
     - **My answer**: **Rejected**. Decisional authority lies with the *choosing* self (Bykvist). Maria isn’t comparing "selves" but *outcomes* from her current evaluative stance—and she can simulate opioid-induced apathy as a loss *from that stance*. Neutrality isn’t required; agency is anchored in the present.
