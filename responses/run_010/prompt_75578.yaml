answer: |-
  ### Core Disagreement Assessment
  Nadia and Owen are engaged in a substantive dispute about the ontology of morality, not a verbal disagreement. Nadia argues that persistent, intractable disagreement in ethics, combined with the lack of empirical tethering, undermines realism by suggesting moral judgments express attitudes rather than track facts. Owen defends realism by contesting Nadia’s characterization of ethical progress, rejecting her premise that factual domains require convergence, and arguing that her skepticism boomerangs to undermine all normative domains. Their clash centers on whether disagreement is best explained by realism’s falsity (Nadia) or by the complexity of the subject matter (Owen), and whether evolutionary accounts debunk moral truth. No part is non-substantive; both grant key terms like "moral facts" the same meaning but disagree on their existence and epistemology.

  ---

  ### Move-by-Move Adjudication

  **Move 1: Nadia**  
  (a) Targets Owen’s realism by using persistent ethical disagreement as evidence against the existence of moral facts, inferring anti-realism as the "leanest explanation."  
  (b) **Mostly wrong.**  
  (c) The move identifies genuine data (enduring disagreement) but overplays it. The inference relies on an undefended premise that domains with facts *must* show convergence under sustained inquiry, which Owen later challenges. It also ignores that realism can accommodate disagreement via cognitive limitations or complexity—just as in quantum physics. Calling anti-realism the "leanest explanation" assumes without argument that realism is less parsimonious, which is question-begging.

  **Move 2: Owen**  
  (a) Targets Nadia’s premise that ethics shows no convergence and her unsupported assumption that factual domains require convergence.  
  (b) **Mostly right.**  
  (c) Owen correctly notes historical moral progress (e.g., slavery’s rejection) as evidence against Nadia’s "no convergence" claim. His challenge to her enthymeme—that disagreement only undermines realism if convergence is necessary for facts—is decisive, as Nadia never defends this premise. The quantum physics analogy is imperfect (due to ethics’ lack of empirical tether, per Nadia’s next move) but validly exposes her double standard: we don’t infer no facts in physics despite disagreement.

  **Move 3: Nadia**  
  (a) Targets Owen’s physics analogy by arguing ethics lacks empirical "tethering," and uses evolutionary debunking to argue that moral agreement/disagreement needs no realist explanation.  
  (b) **Mostly right but overstated.**  
  (c) The physics/ethics disanalogy lands: moral claims lack independent empirical checks, making disagreement more damaging to realism. The evolutionary account *could* explain moral attitudes without facts, weakening Owen’s convergence defense. But she overstates by implying evolutionary shaping *precludes* truth-tracking (e.g., vision evolved for fitness but tracks truths). She also sidesteps Owen’s point that her debunking might generalize beyond morality.

  **Move 4: Owen**  
  (a) Targets Nadia’s evolutionary premise as self-undermining and accuses her of inconsistent skepticism.  
  (b) **Mostly right.**  
  (c) Owen’s "boomerang" argument succeeds: Nadia’s claim that evolved processes are untrustworthy is itself a normative judgment vulnerable to her debunking. This forces her toward global skepticism or special pleading. The symmetry charge (disagreement in metaethics) is potent but slightly overplayed: Nadia can deny metaethical claims are "discoveries" (as she later does). Still, he exposes a tension in her use of disagreement as evidence.

  **Move 5: Nadia**  
  (a) Counters Owen’s self-undermining charge by embracing anti-realism about epistemic norms and challenges his realist naturalism.  
  (b) **A wash.**  
  (c) Biting the bullet on epistemic anti-realism coheres *internally* and answers Owen’s inconsistency charge. Her challenge to moral naturalism (health vs. morality) is strong: if moral facts are categorical (not goal-relative), their detectability is mysterious. However, she undermines her opening argument: if moral sentences aren’t fact-apt, her initial appeal to "genuine disagreement" collapses into clashing attitudes—weakening her first move.

  **Move 6: Owen**  
  (a) Targets Nadia’s inconsistent use of disagreement and accuses her of over-demanding epistemology.  
  (b) **Clearly right.**  
  (c) Owen’s key insight is decisive: Nadia’s anti-realism cannot sustain *factual disagreement* (her primary evidence). If moral claims express attitudes, she relocates disagreement to non-cognitive states, invalidating her original inference that disagreement implies no facts. His queerness objection rebuttal is fair—demanding a "detection mechanism" would imperil logic/math—but less crucial than exposing her argument’s internal contradiction.

  ---

  ### Overall Verdict
  **Owen came out ahead.** He successfully pressured Nadia’s core premise (that disagreement implies no facts) and exposed fatal tensions: her evolutionary debunking invites global skepticism, and her anti-realism cannot account for the factual disagreement she relies on. Nadia’s embrace of epistemic anti-realism cohered defensively but weakened her opening argument. Neither position was refuted, but Owen left Nadia’s disagreement argument worse off. His historical convergence claim (Move 2) and her tethering disanalogy (Move 3) were the strongest points for each side, but Owen better integrated his critiques into a consistent realist defense.

  ---

  ### Key Omitted Considerations
  1. **Moral Twin Earth scenarios**: If two communities use "good" identically but refer to different properties (e.g., utility vs. autonomy), does this support relativism (aiding Nadia) or highlight realism’s adaptability (aiding Owen)? *Cuts for Nadia* by challenging categorical moral facts.  
  2. **Thick ethical concepts**: Concepts like "courage" blend evaluation and description, potentially offering a "tether" for moral facts (e.g., via social coordination). *Cuts for Owen* by providing empirical anchors.  
  3. **Non-reductive naturalism**: Could moral facts supervene on natural properties (e.g., suffering) without being goal-relative? *Cuts for Owen* by answering Nadia’s Move 5 challenge without queerness.
