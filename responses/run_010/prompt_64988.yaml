prompt: |-
  A colleague of mine forecasts with ranges rather than single numbers, and I have run into two features of his practice that I cannot find words for.

  The first: he was modelling a pair of events about each of which he was willing to commit to a sharp figure — chance of exactly a half, no interval at all — while remaining entirely uncommitted about whether the two tend to occur together or to occur apart. He then learned how the first event had turned out, news he had been expecting for days, and his figure for the second event dissolved from 0.5 into a range running from 0.25 to 0.75. He insists the arithmetic is right and that the news was not something he would previously have recognised as bearing on the question. So information arrives and precision is lost, and the starting point was not a wide interval but a point.

  The second, and stranger: asked in advance whether he would like to be told, at no cost, he says he would rather not be, because after being told he can no longer settle on a course of action, whereas before he could.

  Does either half of this have an established name? I know the general neighbourhood — agents who refuse to state a single probability, and people who will not bet on draws from an unknown composition — but what I am describing seems to be neither. What are the nearest concepts, how does each differ from this, and does the second phenomenon follow from the first or is it independent, perhaps turning on the rule he uses for converting a set of figures into a choice? If nothing covers the package, say so and propose a term. I am after the boundaries of the thing — where it stops being ordinary ignorance — rather than a label, so please draw them explicitly.
reasoning: |-
  Okay, let me try to unpack this user's query. They're describing a colleague who uses probability ranges instead of single numbers. There are two puzzling behaviors here. 

  First, the colleague starts with exact 0.5 probabilities for two independent events. When he learns the outcome of one event, his probability for the second event becomes a wide range (0.25-0.75) instead of staying at 0.5. That seems counterintuitive - normally information should increase precision. The user is confused because the math checks out but it feels like precision is lost.

  Hmm, this makes me think about imprecise probability models. The colleague isn't committing to a joint distribution. His initial point probabilities might actually be covering uncertainty about dependence. When he learns Event 1's outcome, that dependence uncertainty gets exposed, blowing up the range for Event 2. 

  The second behavior is even stranger - the colleague refuses free information because it would paralyze his decision-making. Before knowing, he could act; after knowing, he couldn't. That suggests he's using a decision rule like maxmin expected utility, where ranges create ambiguity aversion. 

  I recall that in robust control theory, knowing less can sometimes lead to more decisive action when you're optimizing for worst-case scenarios. If the pre-information range still allows a dominant action, but post-information creates conflicting optimal actions across possible probabilities, that would explain the paralysis.

  The user wants to know if there are established terms for these phenomena. The first sounds like "dilation" in imprecise probability - where conditioning on events widens probability intervals. The second relates to "ambiguity aversion" in decision theory, specifically the "value of ignorance" paradox where less information enables action.

  Important to distinguish this from ordinary risk aversion or uncertainty avoidance. The key is the specific mechanics of how range forecasts interact with updating rules and decision rules. The colleague's approach seems deeply rooted in avoiding model misspecification by remaining noncommittal.

  For the user, I should emphasize the boundary conditions: this goes beyond simple ignorance when (1) point probabilities mask dependence uncertainty, and (2) decision paralysis arises specifically from the interaction of ranges with minimax-style choices. The combination creates this counterintuitive result where information harms precision and decisiveness.
answer: |-
  This describes a fascinating and counterintuitive phenomenon rooted in **imprecise probability** and **ambiguity aversion**, specifically leveraging the mechanics of **sets of probabilities** and **decision-making under ambiguity**. Neither part is entirely novel, but their combination creates a unique package. Here's the breakdown, including established concepts, boundaries, and differences:

  **Core Framework: Imprecise Probability & Sets of Probabilities**
  Your colleague isn't using a single probability distribution (a "precise prior"). Instead, he uses a *set* of possible distributions (`P`). His "range" represents the envelope of probabilities assigned to an event across *all* distributions in `P` that are consistent with his knowledge/constraints. His initial "sharp figure" (0.5) doesn't mean he has a single precise belief; it means *every* distribution in his set `P` assigns a probability of 0.5 to that event *individually*. Crucially, `P` contains distributions with *different dependence structures* between the two events.

  **Phenomenon 1: Dilation**
  *   **What Happened:** He learns Event 1 occurred. His forecast for Event 2 changes from a sharp 0.5 to a wide range (0.25-0.75).
  *   **Established Name:** **Dilation** (specifically, *probability dilation* or *dilation of beliefs*).
  *   **Concept:**
      *   Dilation occurs when conditioning (updating based on new information) on an event *increases* the uncertainty (widens the interval) about the probability of *another* event, relative to the prior interval.
      *   **Why it happens:** His initial set `P` contained distributions with *strong positive dependence* (Event 2 very likely if Event 1 happens), *strong negative dependence* (Event 2 very unlikely if Event 1 happens), and everything in between. The constraint "P(Event 2) = 0.5 for all distributions in `P`" only fixes the *marginal* probability; it says nothing about the *joint* behavior.
      *   **Conditioning:** Learning Event 1 occurred effectively filters his set `P`. He now only considers distributions in `P` that are consistent with Event 1 happening. Within this updated set (`P|Event1`), the distributions that had strong positive dependence will assign a *high* probability to Event 2 (e.g., 0.75), while those with strong negative dependence will assign a *low* probability (e.g., 0.25). Since he remains completely uncommitted about dependence, the range for P(Event 2 | Event 1) spans from the minimum to the maximum value found across `P|Event1`.
      *   **Boundary - Where it stops being ordinary ignorance:** Ordinary ignorance might lead to a *wide initial interval*. Dilation is *counterintuitive* because conditioning on *relevant information* (Event 1) *increases* imprecision from a *point* to an *interval*, despite the news being "expected". It arises specifically from the *deliberate lack of commitment* to dependence *combined* with the structure of imprecise updating. If he had committed to *any* specific dependence (even just independence), dilation would not occur; learning Event 1 would either leave P(Event 2) at 0.5 (independence) or move it to a specific point (dependence).

  **Phenomenon 2: Value of Ignorance / Ambiguity-Driven Decision Paralysis**
  *   **What Happened:** He refuses free information (outcome of Event 1) because it would prevent him from settling on a course of action, whereas he could act before knowing.
  *   **Established Name:** While not a single perfect term, this is a consequence of **Ambiguity Aversion** combined with a specific decision rule (like **Maximin Expected Utility - MMEU** or **Gamma-Maximin**) under imprecise probabilities. The paradoxical preference for ignorance is sometimes called the **Value of Ignorance** or relates to **Non-Consequentialist Decision Making** under ambiguity.
  *   **Concept:**
      *   **Decision Rule:** Your colleague likely uses a decision rule designed for ambiguity, such as MMEU: Choose the action that maximizes the *minimum* expected utility calculated over all distributions in his current set `P`.
      *   **Before Information:** Under his prior set `P`, every distribution assigned P(Event 2) = 0.5. Crucially, *all distributions agreed on the expected utility* for any action contingent *only* on Event 2. Therefore, the MMEU rule easily identified an optimal action (or actions) – the minimum expected utility across `P` was the same as the expected utility under any single distribution because they all agreed.
      *   **After Information:** After learning Event 1, his set updates to `P|Event1`. Within this set, distributions strongly disagree on P(Event 2 | Event 1), ranging from 0.25 to 0.75. This means they *strongly disagree* on the expected utility of actions that depend on Event 2. The *minimum* expected utility (over `P|Event1`) for one action might be very low, while the *minimum* for another action might be higher. He now faces a true ambiguity trade-off: no single action is best across all plausible distributions. Applying MMEU might leave him with multiple non-comparable actions or force a very conservative choice, making him feel unable to "settle" decisively.
      *   **Why Refuse Free Info?** The information transforms his decision problem from one with *agreement* under ambiguity (easy decision) to one with *sharp disagreement* under ambiguity (hard or paralyzing decision). The "cost" isn't monetary, it's cognitive/decision-theoretic paralysis.
      *   **Boundary - Where it stops being ordinary indecisiveness:** Ordinary indecisiveness might occur with complex information or conflicting precise probabilities. This is specific to *ambiguity aversion* combined with an *updating rule that increases disagreement* (like dilation) and a *pessimistic decision rule* (like MMEU). The key is the *shift from consensus to conflict* within the set of probabilities *due to conditioning*. If he used a rule that averaged over the set (e.g., Hurwicz criterion), or if conditioning didn't cause dilation, paralysis wouldn't necessarily occur.

  **Relationship Between the Phenomena**
  *   **Dilation Enables Decision Paralysis:** The first phenomenon (dilation) is often a *necessary precursor* to the second phenomenon (paralysis via ambiguity) *in this specific scenario*. Dilation creates the sharp disagreement in the posterior set (`P|Event1`) that causes the decision rule (like MMEU) to struggle. If conditioning didn't cause dilation (e.g., if he assumed independence), the posterior set would still agree on P(Event 2), and no paralysis would occur.
  *   **Decision Rule is Crucial:** The paralysis *specifically* arises from his choice of decision rule under ambiguity (likely MMEU or similar). A different rule (e.g., using the center of the interval, or a more optimistic/pessimistic weighting) might still allow a decision post-information, even with dilation. His refusal hinges on his *preference* for using a rule vulnerable to this paralysis.

  **Nearest Concepts & Key Differences**
  1.  **Imprecise Probability / Credal Sets:** The *foundation*. Differs from "ordinary ignorance" (a single wide prior) by explicitly modeling uncertainty via a *set* of distributions and specific updating rules.
  2.  **Dilation:** Explains the loss of precision upon updating. Differs from simply having a wide prior; it's the *widening* specifically *caused by conditioning*.
  3.  **Ambiguity Aversion:** Explains the dislike of situations with unknown probabilities (the set `P`). Differs from *risk aversion* (aversion to known probabilities/outcomes).
  4.  **Maximin Expected Utility (MMEU) / Robust Control:** Explains the decision paralysis. Differs from standard Expected Utility (which would average over the set) or other ambiguity models (like smooth ambiguity) which might not induce paralysis.
  5.  **Value of Ignorance / Non-Consequentialism:** Captures the paradoxical preference for not knowing. Differs from standard information value theory (where information is always weakly beneficial) because it incorporates specific decision rules under ambiguity.

  **The Package: A Proposed Term**
  While the components are established, the specific combination – **dilation leading to ambiguity-induced decision paralysis under a minimax-style rule, causing a preference for ignorance** – is a distinct behavioral pattern. A fitting descriptive term could be **"Dilation-Induced Decision Paralysis" (DIDP)**.

  **In Summary:**
  Your colleague uses a set of probabilities (`P`) reflecting deep uncertainty about dependence. His initial sharp marginals mask this. Learning Event 1 triggers **Dilation**, exposing the dependence uncertainty and widening the forecast for Event 2. He then uses a decision rule (**MMEU**) vulnerable to **Ambiguity Aversion**. The post-information disagreement within `P|Event1` causes **Decision Paralysis** under this rule. This paralysis, contrasted with the pre-information decisiveness (due to prior agreement in `P`), makes him see the information as harmful, leading to a **Preference for Ignorance / Value of Ignorance**. Dilation is the engine that makes the paralysis possible, and the specific decision rule is the mechanism that translates that dilation into paralysis. This moves beyond ordinary ignorance into the realm of carefully modeled ambiguity and specific, often pessimistic, decision-making under that ambiguity.
