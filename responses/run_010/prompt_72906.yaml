answer: |-
  ## The Morning Ledger

  The inkwell smells of salt and mildew, like everything else in Port Kestrel. My job is the ledger, the heavy, sea-stained book that records the first trades of the dawn. Before the sun burns off the fog, before the fishmongers start shouting, before the resetters – we just call them ‘Nightwalkers’, though they walk the day – before they read their own handover notes. That hour is a market of pure, desperate immediacy. Needs flare bright and brief as struck matches.

  Lys was a regular. A net-mender. Her mornings were predictable: a handful of worn coppers re-issued by the Harbor Mastery, her assigned mending tools (needles, palms, twine), and the scramble for breakfast. She’d trade three coppers for a hot fishcake, maybe haggle a half-copper discount if the baker was feeling generous. Her handover notes were usually short, practical things: *Low twine. Fishcake stall owes a favor for yesterday’s overcharge. Don’t trust Jem with the good needles.*

  I saw the weariness in her, deeper than just the dawn chill. Saw her eyes linger on the boatwright’s daughter polishing a brass compass. Saw her fingers trace the grain of a dock post older than the town. Possession. Continuity. Things the Nightwalkers are legally barred from. For their own good, the Mastery says. The reason? Unstated, but obvious enough: you can’t trust a self that dissolves overnight with anything that lasts. It invites… complications.

  So I bent the rule. Just once. For Lys. Convinced the Harbor Master that Lys’s skill was vital, that a truly *good* gutting knife – Solingen steel, bone handle, kept sharp – would boost her mending efficiency, benefit the whole fleet. A durable tool, not just the daily-issue clunkers. He grumbled, but the ledgers showed Lys was reliable. He allowed it, stamped the waiver.

  The morning I handed her the knife – wrapped in oiled cloth – her face was a sunrise. Not gratitude, exactly. Wonder. She hefted it, tested the edge with her thumb. “Mine?” she breathed, the word unfamiliar on her tongue in that context. “Until I sleep?”

  “Yours,” I confirmed, entering it in the ledger under her continuous name: Lysandra Tideborne, Asset: 1 Solingen gutting knife. The letters felt heavier than usual. “Use it well.”

  She did. For three days, her mending was impeccable. She looked… anchored. I felt a warm flush of righteousness. Lifted her out of it.

  Then came the fourth morning. Lys stumbled to my ledger station, her eyes wide with a hunger that wasn’t for food. She clutched her daily copper bowl – its contents thin – and her re-issued mending tools. The Solingen knife was conspicuously absent.

  “Morning, Clerk,” she rasped. “Need… need a trade. Fast.”

  “What’s wrong, Lys?”

  “Wrote me a bloody *novel* last night,” she muttered, pulling the crumpled note. “All about the knife, how fine it is, how I *must* keep it. Idiot. Didn’t mention the twine’s near gone, the needles are blunt as pebbles, and I’m starving. Took all my focus just to find the damn note stuffed in my boot.” She shoved the note at me. It was indeed lengthy, frantic about preserving the knife’s edge, lamenting the state of the daily tools. Last night’s Lys was clearly obsessed.

  “I see,” I said, a cold thread starting in my gut. “What do you need?”

  “Breakfast. Hot. Two fishcakes. And…” she gestured dismissively at her daily tools. “These are useless. Need sharper needles, fresh twine. The good stuff, not daily chaff.”

  I had spare tools – better quality, kept for minor emergencies or barter. They weren’t durable property; they’d be returned at dusk. “I have them. Two fishcakes, a set of good needles, two fresh hanks of tarred twine… for the knife?”

  Her relief was palpable. “Yes! Deal! That useless shiny thing’s no good to me *now*. Need to work *now*.” She barely glanced at the knife when I produced it; her eyes were locked on the tools and the promise of food. I recorded it, my hand trembling slightly: *Lysandra Tideborne trades 1 Solingen gutting knife to Harbor Clerk for: 1x Superior Needle Set (temporary), 2x Tarred Twine Hank (temporary), 2x Fishcake (consumed).* The knife went into my drawer. It felt warm.

  The fifth morning. Lys returned. Pale. Shivering. She held the superior needle set and the single remaining hank of twine (the other used yesterday). No knife. Her daily copper bowl was almost empty again.

  “Clerk,” she said, voice tight. “Need… need the knife back.” She thrust yesterday’s handover note at me. It was short, angry: *You fool! Traded the Solingen for breakfast? The daily needles are trash! Get it back!*

  “Why?” I asked, the cold thread coiling tighter. “Yesterday’s tools served?”

  “Served? They…” She looked genuinely distressed. “Look at these needles! They’re… adequate. But that *knife*.” Her voice dropped, almost reverent. “I saw Jem using his cheap one yesterday. Snapped on a cod spine. The Solingen… it’s *real*. Lasts. My note… she’s right. I was stupid yesterday.” She gestured at the superior needles and twine. “Take these back. And… I’ll add my breakfast copper today. Just… the knife. Please?” The desperation was different today – not hunger, but a kind of horrified loss at the absence of the durable thing.

  I looked at the ledger. I looked at her hollow eyes. I thought of the knife in my drawer. “The temporary tools… and your daily copper allotment… for the knife’s return?”

  “Yes! Deal!” She practically shoved the needles and twine at me, slapped the single copper onto the ledger desk. I recorded it: *Harbor Clerk returns 1 Solingen gutting knife to Lysandra Tideborne in exchange for return of: 1x Superior Needle Set (temporary), 1x Tarred Twine Hank (temporary), 1x Daily Copper Allotment.* I handed her the knife. She clutched it like a talisman, breathing deeply. She left without breakfast.

  The sixth morning. Lys didn’t stumble; she walked with heavy purpose. Her face was set. She held the Solingen knife. Her daily copper bowl was empty. Her daily-issue tools looked particularly shoddy.

  “Clerk. Trade.” No preamble. She handed over the previous night’s note. It was blunt: *Debt to Jem. Two coppers. Knife must cover it. His fault, but his ledger.* She tapped the note. “Jem’s ledger won’t wait. He’s got his own debts. If I don’t settle, he tells the Mastery I damaged his net on purpose yesterday. Could lose my berth.” She looked at the knife in her hand, not with reverence, but resignation. “Shiny thing’s no shield against Jem’s mouth *today*. Need coppers. Now.”

  My throat was dry. “How much?”

  “Two coppers. Jem’s price.” She held out the knife. “Take it. Just… make it quick.”

  I had coppers. Harbor petty cash. I counted out two. “For the knife?”

  She nodded, already turning to go, the coppers clutched tight. I recorded it, the ink bleeding: *Lysandra Tideborne trades 1 Solingen gutting knife to Harbor Clerk for: 2x Copper Coins.* She was gone before I finished the entry.

  There it sat. My ledger. Lysandra Tideborne’s entries over three mornings:
  *   **Morning 4:** Lost Knife. Gained: Temporary Superior Tools (Value: ~1.5 coppers), 2 Fishcakes (Value: 2.5 coppers). Net Gain: Roughly 4 coppers worth of immediate satisfaction.
  *   **Morning 5:** Regained Knife. Lost: Temporary Superior Tools (Returned), 1 Daily Copper. Net Loss: The value of the tools she used that day plus the copper. But she *regained* the knife she valued so highly that morning.
  *   **Morning 6:** Lost Knife. Gained: 2 Coppers. Settled a pressing debt.

  Each trade made perfect, undeniable sense *to the Lys making it*. Hunger and blunt tools trumped a durable asset. The horror of losing something permanent trumped temporary gains and breakfast. Immediate debt collection trumped holding onto anything at all.

  But the ledger didn’t lie. Three trades. The knife went out, came back, went out again. And what did Lysandra Tideborne, the continuous legal entity, end with? Two copper coins. Less than the cost of the fishcakes she’d bought with the knife on the first trade. Far less than the knife was worth. And she’d had to use her daily copper one morning too.

  I found her later, mending a torn net with her daily-issue tools. Her movements were efficient, focused. The debt to Jem was settled. She looked… untroubled. Just busy.

  “Lys,” I said, my voice tight. I held up the ledger, pointed to the sequence. “Look. The knife. You had it. You traded it for breakfast and tools. Then you gave up those tools *and* a copper to get it back. Then you sold it again for two coppers. You… you ended up with less. Much less.”

  She paused her mending, glanced at the ledger without much interest. “That so?” She shrugged, a small, pragmatic motion. “Yesterday-me got fed and fixed the nets proper with good twine. Day-before-me got the knife back from her panic, felt right again. Today-me kept Jem’s lies off my back. Sounds like we all got what we needed when we needed it.” She picked up a frayed rope end. “Knife’s gone? Shame. Was a good blade. But it’s just a thing. Today’s nets won’t mend themselves.” She turned back to her work, her focus absolute, contained entirely within the sunlight falling on the worn rope in her hands.

  I stood there, the ledger suddenly heavy as an anchor. The Harbor Mastery’s rule echoed in the hollow space her words left behind. *No savings. No boat. No share in the cannery. Nothing that outlasts the night.* Not to protect the town from the Nightwalkers.

  It was to protect the Nightwalkers from the town. From me. From anyone who saw a durable thing attached to a name that wasn’t anchored by a continuous *want*.

  Because anything that lasts becomes a target. A thing to be chipped away, morning by morning, self by self, in trades that are perfectly fair to the person standing there in the dawn fog, needing something *now*. Every durable possession is just a future loss waiting to happen, sliced thin and served back to them one breakfast, one panic, one debt at a time. The only safety is having nothing worth stealing. Nothing that implies a tomorrow.

  I closed the ledger. The Solingen knife lay in the drawer beneath it, cold steel. My proof of concept. Outside, the gulls screamed over the harbor, a sound as sharp and transient as the wants of the woman mending nets. The ledger for tomorrow’s dawn trades sat ready on the desk. The inkwell still smelled of salt and mildew.
