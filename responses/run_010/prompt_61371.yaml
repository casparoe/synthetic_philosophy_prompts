  ### How to Use It  
  This decision tree is a pedagogical instrument designed to sort students by their concrete judgments about cases involving chance and credence, bypassing theoretical labels and jargon. It focuses on nine scenarios that reveal underlying commitments about deference to chance, admissibility, undermining, and normative force. The tree does not measure historical knowledge of Lewis or others, nor does it require familiarity with formal frameworks; it elicits intuitive verdicts on cases. Answers should be given without considering which branch they lead to—respond based solely on the scenario. The tree’s value lies in exposing fault lines in students' views, not in comprehensive coverage of all positions. Use it to spark discussion, identify inconsistencies, or group students for debates.  

  ---

  ### The Nodes  
  **Node 1: The Basic Deference Case**  
  *Case*: You know the chance of a fair coin landing heads is 0.5. You have no other information about the next flip. What is your credence in heads?  
  - A: 0.5  
  - B: Not 0.5 (e.g., 0.6, 0.4, or undefined)  
  *Splitting claim*: Deference to known chance is required when no other evidence exists.  

  **Node 2: The Jinxed Coin**  
  *Case*: A coin is flipped 1,000,000 times, landing heads every time. The true chance theory says the chance of heads per flip is 0.5 and the chance of this all-heads history is nearly zero. You observe the full history. What is your credence for heads on flip 1,000,001?  
  - A: 0.5  
  - B: Not 0.5 (e.g., near 1)  
  *Splitting claim*: Deference holds even when the known chance theory assigns near-zero probability to the actual history.  

  **Node 3: Crystal Ball**  
  *Case*: You know the chance of heads is 0.5. An infallible crystal ball shows the next flip landing heads. What is your credence in heads?  
  - A: 1  
  - B: 0.5  
  *Splitting claim*: Future outcome information overrides deference to chance.  

  **Node 4: Uncertain Chance**  
  *Case*: You have two hypotheses: H1 (chance of E is 0.6; credence 0.5) and H2 (chance of E is 0.4; credence 0.5). No other information about E exists. What is your credence in E?  
  - A: 0.5 (i.e., 0.5×0.6 + 0.5×0.4)  
  - B: Not determined or not 0.5  
  *Splitting claim*: Credence should equal expected chance under uncertainty.  

  **Node 5: Chance Hypotheses and Ur-Priors**  
  *Case*: Your initial credence in E given chance hypothesis H (which says ch(E) = x) is y ≠ x. After learning H, your credence becomes y. Is this acceptable?  
  - A: Yes—deference applies after conditioning, not to initial credences.  
  - B: No—initial credences must align with chance (e.g., y = x).  
  *Splitting claim*: The Principal Principle constrains credences only after conditioning on chance hypotheses.  

  **Node 6: Self-Referential Chance**  
  *Case*: A chance hypothesis says the chance of E is 0.5 and that your credence in E right now is 0.6. What should your credence in E be?  
  - A: 0.5 (defer to chance)  
  - B: 0.6 (defer to the hypothesis about your credence)  
  - C: Other (e.g., 0.55)  
  *Splitting claim*: Deference to chance overrides self-referential claims about one’s credences.  

  **Node 7: Normative Force**  
  *Case*: An agent knows the chance of E is 0.5 but sets credence 0.6. What is wrong?  
  - A: Incoherent (Dutch-bookable)  
  - B: Imprudent (accuracy-dominated)  
  - C: Not criticizable  
  *Splitting claim*: Violating deference is a coherence failure.  

  **Node 8: Total Evidence vs. Chance**  
  *Case*: You know the chance of E is 0.5. Your total evidence includes E itself (you know E is true). What is your credence in E?  
  - A: 1  
  - B: 0.5  
  *Splitting claim*: Total evidence overrides chance deference.  

  **Node 9: Future Undermining**  
  *Case*: At t0, you know the true chance theory T: ch(E) = 0.5 at t0, but if E occurs, the resulting history would make T’s chance near zero. What is your credence at t0 for E?  
  - A: 0.5  
  - B: Not 0.5 (e.g., lower)  
  *Splitting claim*: Deference holds even when the event’s occurrence would undermine the chance theory.  

  ---

  ### Paths  
  Each path is defined by answers to Nodes 1–9 (e.g., A,A,B,A,B,A,A,B,A). The table maps answer patterns to leaves:  

  | Node: | 1 | 2 | 3 | 4 | 5 | 6 | 7 | 8 | 9 | Leaf        |
  |-------|---|---|---|---|---|---|---|---|---|-------------|
  |       | A | A | A | A | A | A | A | A | A | Lewisian    |
  |       | A | A | A | A | B | A | A or B | A | A | Ur-Priorist |
  |       | A | B | A | B | A | A | C | A | B | Humean      |
  |       | A | A | A | A | A | B | A or B | A | A | Unnamed     |
  |       | A | A | A | A | A | A | A | B | A | Unnamed     |
  |       | B | B | B | B | A | C | C | B | B | Subjectivist |
  |       | A | A | A | A | A | A | B | A | A | Accuracy    |
  |       | A | A | A | A | A | A | A | A | B | New Principle|

  ---

  ### The Leaves  
  **Lewisian**  
  *Doctrine*: Deference to chance is a coherence constraint derivable from an ur-prior conditional on chance hypotheses; admissibility excludes future truths but not undermining histories.  
  *Awkward commitment*: In the Jinxed Coin case, credence must be 0.5 despite the vanishingly improbable history.  

  **Ur-Priorist**  
  *Doctrine*: The Principal Principle requires an ur-prior that aligns with chance hypotheses initially; deference is "built in" before updating.  
  *Awkward commitment*: Even after learning a chance hypothesis, violating deference is impossible if the ur-prior is properly formed.  

  **Humean**  
  *Doctrine*: Chance is a summary of patterns in the Humean mosaic; deference is a separate, accuracy-oriented norm.  
  *Awkward commitment*: In Jinxed Coin, credence should not be 0.5 (e.g., near 1), as the history suggests a bias despite the chance theory.  

  **Unnamed (Self-Prioritizing)**  
  *Doctrine*: Deference to chance holds, but self-referential chance claims about one’s credences override it.  
  *Awkward commitment*: In Node 6, credence must match the hypothesis’s report (0.6), even if inconsistent with chance.  

  **Unnamed (Total Evidence Trumps)**  
  *Doctrine*: Deference applies only when total evidence excludes the event itself; known outcomes dominate.  
  *Awkward commitment*: In Node 8, credence must be 1 even if chance is known to be 0.5.  

  **Subjectivist**  
  *Doctrine*: Chance is just evidence; credences are constrained only by coherence and total evidence, not deference.  
  *Awkward commitment*: In Basic Deference (Node 1), credence need not be 0.5.  

  **Accuracy**  
  *Doctrine*: Deference minimizes expected inaccuracy; violations are imprudent but not incoherent.  
  *Awkward commitment*: Violations (Node 7) are merely accuracy-dominated, not Dutch-bookable.  

  **New Principle**  
  *Doctrine*: Deference targets chance conditional on the chance theory to handle undermining.  
  *Awkward commitment*: In Future Undermining (Node 9), credence may not be 0.5 if conditional chance differs.  

  ---

  ### Empty Cells  
  - **A,A,B,A,A,A,A,A,A**: Empty because incoherent. Node 3 (Crystal Ball) demands credence 1 given infallible future evidence, but rejecting this (B) while requiring deference elsewhere is inconsistent with admissibility.  
  - **B,A,A,A,A,A,A,A,A**: Unattractive. Accepting deference in complex cases (Jinxed Coin) but not in the simplest (Node 1) is arbitrary and theoretically unstable.  
  - **A,A,A,B,B,A,A,A,A**: Nobody’s bothered. Combining uncertain chance (A) with ur-prior constraints (B) and uncertain chance rejection (B) is coherent but lacks advocacy; it is a "notch" view without proponents.  

  ---

  ### Pairs This Tree Can’t Separate  
  **Ur-Priorist and Lewisian**  
  The tree cannot distinguish these at Node 5: Both accept deference after conditioning (A). They diverge on whether the ur-prior must independently satisfy the Principal Principle—a theoretical commitment not testable with cases. A further question would be: "In Node 5, if the initial credence in E given H is y ≠ x, is this a violation *before* learning H?" Ur-Priorist says yes; Lewisian says no.  

  **Accuracy and Lewisian**  
  The tree separates these only if Node 7 (normative force) answers differ (Lewisian: A; Accuracy: B). If both answer A (incoherent), they are indistinguishable. A further question: "Can an agent violate deference coherently but suboptimally in accuracy?" Accuracy says yes; Lewisian says no.  

  ---

  ### What Should Surprise My Two Arguing Students  
  Your two students—one claiming the Principal Principle is a theorem, the other seeing it as a separate norm—will be surprised by their convergence. Both likely take path A,A,A,A,A,A,?,A,A (Lewisian or Ur-Priorist), sharing verdicts on Jinxed Coin (A), Crystal Ball (A), and Uncertain Chance (A). Their apparent disagreements trace to framing: The "theorem" student assumes ur-priors build in deference, while the "norm" student sees ur-priors as neutral. Yet in cases, both defer rigidly. Conversely, they diverge unexpectedly on Node 5: The theorem student (Ur-Priorist) requires initial credences to align with chance (B), while the norm student (Lewisian) allows any ur-prior if deference holds after conditioning (A). This reveals their core clash isn’t about cases but about the ur-prior’s role—a distinction invisible until Node 5 forces it out.
