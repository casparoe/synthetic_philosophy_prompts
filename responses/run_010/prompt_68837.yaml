  We are going to design an activity that forces students to confront ambiguity aversion even when they know the Ellsberg paradox. The core idea is to have each student draw a bag from a known distribution (50/50) so they have their own "private urn" that is objectively drawn from a known 50/50 distribution but whose contents are unknown to anyone. Then we'll have them price bets on their own bag versus a public jar (which is also 50/50 and known). The twist is that we'll then allow trading of these bets, and we hope to see that ambiguity-averse pricing leads to Dutch-bookable behavior.

  Activity Title: **The Personal Ellsberg**

  **Materials List:**
  1. A large reference jar (public jar) with exactly 50 red and 50 black chips (or any two colors) for a total of 100 chips. This is the "risky" urn.
  2. 24 identical opaque cloth bags (sealable, e.g., with a drawstring).
  3. A big bucket (or another jar) with a large number of red and black chips (at least 200 of each) to serve as the source for the private bags. This source must be known to be exactly 50% red and 50% black. How to ensure? We can have the students count and verify the chips when filling the bucket, or we can pre-fill it and have them trust (but we want to avoid distrust). Alternatively, we can have the students fill the bags under supervision (see below).
  4. Betting slips (two types: one for the public jar and one for the private bag) and trading slips.
  5. Fake credits (e.g., poker chips or paper money) - each student starts with, say, 1000 credits.
  6. Scoring rule: We'll use a quadratic scoring rule because it is incentive-compatible and relatively easy to compute. For a binary event, if a student reports a probability p for an event (say, red) and the event happens, they get 1 - (1-p)^2; if it doesn't, they get 1 - p^2. We can scale this by a factor to make the numbers nice (e.g., 100 points). Alternatively, we can use the Brier score, but note that the Brier score is a loss function (so we want to minimize it) but we can invert it to be a reward. However, to keep it simple and as a reward, we can use:

     **Quadratic Scoring Rule for Reward:**
     - If the event occurs: `Reward = A * [1 - (1-p)^2]`
     - If the event does not occur: `Reward = A * [1 - p^2]`

     We can set A=100 so that the maximum reward is 100 (when p=1 and event occurs) and the minimum is 0 (if p=1 and event doesn't occur). Actually, note: if p=0.5, then regardless of outcome, the reward is 100 * [1 - 0.25] = 75.

     Alternatively, we can use the linear transformation of the quadratic score: `Reward = A * [1 - (outcome - p)^2]` for A=100, where outcome is 1 if true, 0 if false. This is the same as above? Let's check:

     If outcome=1: 100 * [1 - (1-p)^2] = 100 * (1 - (1-2p+p^2)) = 100*(2p-p^2)
     If outcome=0: 100 * [1 - (0-p)^2] = 100 * (1 - p^2)

     Actually, the standard Brier score is (outcome - p)^2, and we want to pay more for being accurate. So we can do:

     `Reward = 100 * [1 - (outcome - p)^2]`

     This is the same as above? Let's compute:

     For outcome=1: 100 * [1 - (1-p)^2] = 100 * [1 - (1 - 2p + p^2)] = 100*(2p - p^2)
     But the expression `1 - (outcome - p)^2` for outcome=1: 1 - (1-p)^2 -> same as above.

     Actually, the expression `1 - (outcome - p)^2` is:

     - If outcome=1: 1 - (1-2p+p^2) = 2p - p^2
     - If outcome=0: 1 - p^2

     So we can define:

        Reward = 100 * [1 - (outcome - p)^2]

