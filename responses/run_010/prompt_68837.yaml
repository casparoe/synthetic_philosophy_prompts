      This is interesting, but it's a bit of a distraction. We might not have time to explain this in the debrief.

    Given the time, we will stick to eliciting only p_red for the public jar and p_red for the private bag. Then we can't directly see the complementary bet pricing.

    Instead, in the debrief, we will ask: "If you had to also price a bet on black for your private bag, what would you report? Would it be 1 minus your p_red? Or would you report a lower number because of the ambiguity?" and then explain that if they report both below 0.5, they can be Dutch-booked.

    So our activity will have only one probability report per event.

    **Summary of the activity with asset trading:**

    - **Pricing Phase (10 min):**
          - Report p_public: probability that the public jar draw will be red.
          - Report p_private: probability that their own private bag draw will be red.
          - These reports are collected and scored at the end.

    - **Asset Definition:**
          - Each private bag is an asset that pays 100 credits if the chip drawn from it is red.
          - The public jar is not an asset for trading.

    - **Trading Phase (15 min):**
          - Students can sell their own private bag asset.
          - They can buy other students' private bag assets.
          - Trades are recorded by facilitators.

    - **Resolution (5 min):**
          - Draw one chip from the public jar: outcome_public.
          - For each private bag, draw one chip: outcome_bag_i.
          - Compute:
               - For each student, scoring rule reward for public jar: 
                     reward_public = 100 * [1 - (outcome_public - p_public)^2]
               - For each student, scoring rule reward for their own private bag (even if they sold the asset, this report is still theirs):
                     reward_private_report = 100 * [1 - (outcome_bag_i - p_private)^2]
               - For each private bag asset: the current owner gets 100 credits if outcome_bag_i is red, 0 otherwise.

          - Net credits = starting 1000 
                        + (if they sold their asset: + sale price) 
                        - (if they bought an asset: - purchase price)
                        + reward_public 
                        + reward_private_report 
                        + (for each asset they own: 100 if red, 0 otherwise)

    - **Debrief (10 min):**
          - Show that for the public jar, reports clustered at 0.5.
          - For private bags, reports might be more dispersed and often below 0.5 on average.
          - Show that students who sold their asset for a low price might have lost money if the asset then paid 100 (red) and they sold for say 40.
          - Discuss: even though the bag was drawn from a known 50/50 distribution, many priced it as if it were worse. Why? Because they don't know the exact composition. Is this rational? Or is it a mistake?

          - The key point: ambiguity aversion might be a bias, or it might be a rational response to not knowing the exact probability. The activity cannot settle that, but it shows the behavior.

          - The bags were not ambiguous in the Ellsberg sense: the process was known. But the exact composition was unknown. So it's a situation of risk (known probability distribution over compositions) but with compound lotteries? Or is it simply risk with known probability? The draw from the bag is not known to be 50/50 because the bag might not have exactly 50 red. But the overall process is 50/50. So it's a situation of second-order risk.

          - Ask: is ambiguity aversion about the source (the process) or about the specific realization (the bag)? In Ellsberg, the unknown urn has an unknown process. Here, the process is known, but the bag is a sample. So it's different.

          - Conclude: ambiguity aversion might be a more general phenomenon that occurs whenever there is uncertainty about the probability, not just when the process is unknown.

    **What will break?**
        - **Logistics of drawing bags:** It might take too long. Fallback: pre-filled bags, but then we risk distrust. We can have the bags pre-filled and then have a few students verify by counting their own bag immediately (but then they know). We don't want that. So we allocated time for drawing.

        - **Fallback activity (15 min version):** If we cannot do the drawing, we use a central jar for everyone (the unknown urn) and one known 50/50 jar. Then we have them price bets on both (using scoring rule) and then we ask if they would be willing to sell their bet on the unknown urn at a price that reflects their reported probability. Then we can show the Dutch book by having them price both red and black for the unknown urn. We can do this in a quick survey:

              - Report p_red for the known urn.
              - Report p_red for the unknown urn.
              - Report p_black for the unknown urn.

            Then we can see if p_red + p_black < 1 for the unknown urn. Then we can explain that if they were to sell both a bet on red and a bet on black for the unknown urn at their reported probabilities, they would receive less than 100 credits for sure, but the bets together pay 100 for sure. So the buyer makes a sure profit.

        - **Showoffs:** Some students might report p_private=0.5 exactly to prove they aren't fooled. That's fine; we expect a distribution.

        - **Market failure:** If only a few trades happen, we can have the facilitators participate as buyers or sellers to jump-start the market. Or we can have a few students volunteer to be market makers.

        - **Leaks:** If a student peeks into their bag, they cheat. We trust them not to. We can use sealed bags that are hard to open.

        - **Gaming the scoring rule:** If a student reports an extreme probability, they risk a low reward. The scoring rule is incentive compatible for a risk-neutral student, but if they are risk-averse, they might report closer to 0.5. This is a known issue, but in practice, for small stakes, it's not a big deal.

        - **Time pressure:** We have to keep to the timeline strictly.

    **Final timeline for the full activity:**

    0:00-0:15: Setup and bag drawing.
    0:15-0:25: Pricing phase (10 min: 5 min explanation, 5 min reporting).
    0:25-0:40: Trading phase (15 min: 5 min explanation, 10 min trading).
    0:40-0:50: Resolution and drawing (10 min: draw and compute rewards).
    0:50-1:00: Debrief (10 min).

    We'll adjust as needed.

    **Debrief talking points:**

    1. Show a histogram of reported p_private and p_public. 
       - Expected: p_public tightly around 0.5, p_private more spread out and possibly bimodal (some at 0.5, some below).

    2. Display the trades: who sold their bag and for how much? 
       - If a bag that was sold for a low price (say, 40) then turned out to be red, the seller lost out on 60 credits (since they could have held and gotten 100) and only got 40. The buyer gained 60. But if it was black, the seller gained 40 and the buyer lost 40. On average, if the bag is 50/50, the expected value of the asset is 50, so selling for 40 is a bad deal in expectation.

    3. Highlight that even though the bag was drawn from a known 50/50 distribution, many students treated it as if it were worse than the public jar. Why? Because of the sampling variation: they don't know the exact composition. This is often called "second-order uncertainty."

    4. Discuss: Is this behavior rational? 
       - If they are expected utility maximizers with a uniform prior, then they should value the bag at 50. Any deviation is due to either a different prior or ambiguity aversion (or risk aversion, but the asset is linear). 
       - But in fact, the true probability of red in their bag is not 50%: it is whatever the proportion is in their bag. They don't know it, but it is fixed. So they should use the expected probability conditional on their information, which is 50%. 

    5. The Ellsberg urn is different: the process is completely unknown. Here, the process is known. Yet we see similar behavior. This suggests that ambiguity aversion might be more about the spread of possible probabilities rather than the mean.

    6. Conclude: ambiguity aversion might be a robust phenomenon that occurs whenever there is uncertainty about the exact probability, not just when the probability is completely unknown. This is the foundation for models like maxmin expected utility or imprecise probabilities.

    **What this activity cannot do:**
        - Reproduce the pure Ellsberg ambiguity where the urn composition is completely unknown. Here, the urn composition is known to be drawn from a known distribution, so it's a compound lottery. In decision theory, compound lotteries are usually reduced to simple lotteries, so they should be indifferent. But people are not. This activity shows that reduction is not descriptively valid.

    **Fallback activity (15 min):**

    - We have two urns:
          Urn A: 50 red, 50 black.
          Urn B: unknown composition.

    - Each student reports:
          p_A_red = probability that a draw from A is red.
          p_B_red = probability that a draw from B is red.
          p_B_black = probability that a draw from B is black.

    - We collect the reports.

    - Then we draw one chip from urn A and one from urn B.

    - For urn A, we pay the scoring rule for p_A_red and the actual draw.

    - For urn B, we pay two scoring rules: one for p_B_red and the actual red draw, and one for p_B_black and the actual black draw.

    - In the debrief, we show that many students will have p_B_red + p_B_black < 1. Then we explain that if they were to sell a bet on red and a bet on black for urn B at their prices, they would get less than 100 for sure, but the two bets together pay 100 for sure. So they would be Dutch-booked.

    - This is quick and requires no trading.

    We hope the full activity works, but if not, we have this fallback.

    Let's hope for the best!
answer: |-
  Below is a complete, runnable activity designed to ambush students who are already familiar with the Ellsberg paradox. The activity forces them to confront ambiguity aversion through a personalized, market-driven experiment where ambiguity is *self-manufactured* via sampling variation. Materials, timing, mechanics, and debrief are all specified.

  ---

  ### **Activity Title: The Personal Ambiguity Market**  
  **Core Idea:** Students draw private bags from a known 50/50 distribution, then price/trade bets on their own bag vs. a public jar. Trading reveals how ambiguity-averse pricing opens them to Dutch books.  

  ---

  ### **Materials List**  
  1. **Public Jar:** 1 clear jar with exactly 50 red and 50 black beads (total 100).  
  2. **Source Jar:** 1 large jar with **1,200 red and 1,200 black beads** (2,400 total, 50/50 mix).  
  3. **Private Bags:** 24 identical opaque cloth bags (e.g., drawstring pouches).  
  4. **Betting Slips:** 24 slips with fields for:  
     - Public jar probability (P<sub>pub</sub>), Private bag probability (P<sub>priv</sub>)  
     - Brier score calculations (pre-printed formula).  
  5. **Trading Cards:** 24 cards listing:  
     - "SELL: Bet on my bag's RED outcome @ [Price] credits"  
     - "BUY: Bet on your bag's RED outcome @ [Price] credits"  
  6. **Credits:** Poker chips or paper money (each student starts with 1,000 credits).  
  7. **Scoring Devices:** Calculators (or phones) for Brier score math.  
  8. **Whiteboard:** To track trades and final positions.  
  9. **Prizes:** Small rewards (e.g., candy, bonus points).  
  **Total Cost:** ~$25 (beads + bags + paper).

  ---

  ### **Timeline (75 Minutes Total)**  
  **Two Facilitators (You + Lecturer):** Split supervision (pricing vs. trading).  

  #### **Phase 1: Setup & Sampling (15 min)**  
  - **0:00-0:05** - Intro: *"Today, you’ll hold a bag objectively drawn from a 50/50 source. You’ll bet on it, trade bets, and see if textbook rationality holds."*  
  - **0:05-0:10** - Verify source jar: Have 4 students count subsets of beads (e.g., 100 each) to confirm 50/50.  
  - **0:10-0:15** - Blind sampling: Each student draws 100 beads from the source jar (without looking), seals them in their private bag, and labels it.  

  #### **Phase 2: Pricing Bets (15 min)**  
  - **0:15-0:20** - Explain betting:  
    - Bet on 1 outcome: **RED** chip drawn from public jar OR their private bag.  
    - Report probabilities (P<sub>pub</sub>, P<sub>priv</sub>) for RED.  
    - **Scoring Rule (Brier):**  
      - Reward = 100 × [1 - (outcome - p)²]  
      - *Example: If p = 0.6 and RED is drawn, reward = 100 × [1 - (1 - 0.6)²] = 100 × [1 - 0.16] = 84. If BLACK, reward = 100 × [1 - (0 - 0.6)²] = 64.*  
  - **0:20-0:30** - Students report P<sub>pub</sub> and P<sub>priv</sub> on slips. Collect slips.  

  #### **Phase 3: Trading (25 min)**  
  - **0:30-0:35** - Explain trading:  
    - Students can **buy/sell bets** on private bags (not public jar).  
    - Bets pay 100 credits if RED is drawn from the bag.  
    - **Mechanics:**  
      1. Sellers write SELL cards (e.g., "SELL my bet @ 40 credits").  
      2. Buyers write BUY cards (e.g., "BUY your bet @ 35 credits").  
      3. **Open outcry market:** Students shout bids/offers; facilitators match trades.  
      4. Trade finalizes when buyer/seller agree and report to facilitators.  
  - **0:35-0:50** - Trading floor:  
    - Facilitators record trades (e.g., "Student A sells to Student B for 45 credits").  
    - Whiteboard tracks: **Bag owner → Bet owner → Price paid.**  
    - **Critical:** Encourage liquidity (e.g., "Sell if you dislike ambiguity!").  

  #### **Phase 4: Resolution & Payout (10 min)**  
  - **0:50-0:55** - Draw outcomes:  
    1. Public jar: Draw 1 bead (RED/BLACK) → applies to all P<sub>pub</sub> bets.  
    2. Private bags: Each owner draws 1 bead from their bag.  
  - **0:55-1:00** - Calculate payouts:  
    - **Brier scores:** For P<sub>pub</sub> and P<sub>priv</sub> (using reported probabilities).  
    - **Trade payouts:** Bet owners get 100 credits if RED is drawn.  
    - **Net credits** = Starting 1,000 + Brier rewards + Trade cash flows.  

  #### **Phase 5: Debrief (10 min)**  
  - **1:00-1:10** - Reveal & discuss:  
    1. **Sampling reality:** Open 3-4 bags, count beads (show variation, e.g., 48R/52B).  
    2. **Pricing patterns:** Display scatterplot of P<sub>pub</sub> (clustered at 0.5) vs. P<sub>priv</sub> (dispersed, often <0.5).  
    3. **Dutch book example:**  
       - *"Student X sold their bet for 40 credits. Their bag had 50% RED. Expected value = 50 credits. They lost 10 credits in expectation. Trader Y bought 3 undervalued bets—profiting from ambiguity aversion."*  
    4. **The Big Questions:**  
       - *"Your bag came from a known 50/50 process. Was it truly ambiguous, or did you make it ambiguous? Is ambiguity in the world or in your head?"*  
       - *"If you priced P<sub>priv</sub> < 0.5, were you irrational? Or is maxmin EU (pessimism) rational when you lack perfect information?"*  
    - **Conclusion:** *"Ellsberg isn’t about distrust—it’s about how we handle the gap between abstract probabilities and personal uncertainty."*  

  ---

  ### **What Will Break (and Fixes)**  
  1. **Showoffs pricing P<sub>priv</sub> = 0.5 "to prove rationality":**  
     - *Fix:* Highlight their trades. If they sell high (e.g., 55 credits), they’ll likely lose money when bags average 50.  

  2. **Market collapse (e.g., 2 traders dominate):**  
     - *Fix:* Facilitators seed orders (e.g., "I’ll buy any bet under 45 credits!").  

  3. **Leaks/cheating (peeking in bags):**  
     - *Fix:* Use sealed bags. If caught, nullify their trades (no prize).  

  4. **Scoring rule gamed (e.g., extreme p=0/p=1):**  
     - *Fix:* Brier penalizes overconfidence (e.g., p=1 for BLACK → 0 if RED).  

  5. **Math errors under time pressure:**  
     - *Fix:* Provide Brier formula cards + calculators.  

  ---

  ### **What This Can’t Replicate**  
  - **True vs. Manufactured Ambiguity:** Students know bags are drawn from 50/50, so this is **risk about risk** (not pure Ellsberg ambiguity). You must clarify:  
    > *"Ellsberg’s unknown urn has no defined probabilities. Here, you had a known meta-distribution. Your aversion was to the sample—not the source. This shows ambiguity aversion extends to second-order uncertainty."*  

  ---

  ### **15-Minute Fallback Activity**  
  **If blind-sampling fails (e.g., no time):**  

  1. **Public Jar:** Known 50/50 beads.  
  2. **"Mystery Box":** 1 sealed box with 100 beads (composition unknown).  
  3. **Pricing:** Students report:  
     - P<sub>pub-red</sub>, P<sub>pub-black</sub> for public jar.  
     - P<sub>box-red</sub>, P<sub>box-black</sub> for mystery box.  
  4. **Dutch Book Demo:** Calculate if P<sub>box-red</sub> + P<sub>box-black</sub> < 1.  
     - *"If you priced RED at 0.4 and BLACK at 0.4, I buy both bets for 80 credits. When I win, I get 100 credits—guaranteeing 20 credits from you."*  
  5. **Reveal:** Open box (e.g., 50/50). Discuss distrust vs. ambiguity.  

  ---

  ### **Why This Works**  
  - **Ambushes students** by making them *create* ambiguity via sampling.  
  - **Trading phase** generates visceral Dutch book moments.  
  - **Debrief** reframes ambiguity as an epistemic stance, not just distrust.  
  - **Fallback** preserves core insight without logistics.  

  Run this, and even Ellsberg-hardened students will feel the paradox anew.
