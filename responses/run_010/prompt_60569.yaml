prompt: |-
  I'm trying to work out where I stand on buying and selling things that maybe shouldn't be for sale, and my intuitions are a mess. Here are my verdicts:

  - Paying my nephew $20 a book to get through a summer reading list: fine, even though I admit it might replace liking reading with liking $20.
  - Paying a willing guy $50 to let me punch him in the arm, no marks, he boxes: not fine.
  - Paying a healthy volunteer $4,000 to take on liver risk in a phase 1 drug trial: fine.
  - Paying a healthy volunteer $40,000 for one kidney: not fine. Same body, same sort of seller, one is a risk and one is a part.
  - Paying a professional mourner to weep at my father's funeral, with everyone told he's paid: not fine, and I can't justify this one, since nobody is hurt and nobody is fooled.
  - A company offering a poor town $30M to host a waste site, town votes yes after seeing all the data: fine.
  - The same offer, except the company goes town by town until one finally says yes: not fine. The only difference is that more towns said no first.
  - Paying a homeless man to hold my place in a queue overnight for concert tickets: fine.
  - Bots buying up the whole ticket stock and reselling at 10x: not fine.
  - Paying my neighbor to withdraw her kid from a school lottery so mine gets the place: not fine, even though its her kid's place and not mine.
  - Buying carbon offsets for a flight, so someone else cuts more than I add: fine.

  My guess is the line is something like "you can't sell what you only hold in trust for others," but that doesn't touch the mourner or the punch, and I don't want to give those up.

  So: give me the principle or principles that best fit all this. I want a table, one row per candidate principle, with these columns: **principle** (stated precisely, one or two sentences), **key clause** (the bit of machinery doing the work), **cases saved**, **cases it has to overturn** (name them from my list), **cost** (what's ad hoc or question-begging about it). Then after the table: two new cases you think most threaten the winning prinicple, with your predicted verdicts on them, and one short paragraph on whether I should drop the mourner verdict or accept a messier principle.
reasoning: |-
  Hmm, the user is struggling with ethical intuitions about market transactions involving what might be "sacred" or "protected" goods. They've listed 11 specific cases with conflicting verdicts and want a unifying principle. The cases range from incentivized reading to organ sales, with seemingly inconsistent "fine/not fine" judgments.

  First I need to analyze their case patterns. Notice how bodily integrity violations (punching, kidney) are rejected while temporary bodily risks (drug trial) are accepted. The mourner case is particularly interesting because it violates no obvious harm principle. The queue/bot contrast shows concern about systems versus individuals. The school lottery rejection suggests they care about procedural fairness.

  Their proposed "trust" principle fails because many rejected cases (like the punch) don't involve trusteeship. I'll need to test multiple candidate principles. Key angles to consider: commodification (Sandel), vulnerability (Satz), social meaning (Anderson), and exploitation (Wertheimer).

  For the table, I'll structure: 
  - Commodification principle (focus on corruption of non-market goods) 
  - Vulnerability principle (focus on background injustice) 
  - Contextual integrity principle (focus on social spheres) 
  Then evaluate each against their cases.

  The vulnerability principle seems strongest, but struggles with the mourner. New test cases: paying for military service and surrogacy would really pressure it. I think they should keep the mourner intuition - it reveals how payment can hollow out rituals. The principle might need a "social meaning" clause.

  Biggest challenge is the kidney/drug trial distinction. I'll argue the kidney sale crosses a permanence threshold where vulnerability becomes structural. For the output, I'll make the table clear with emoji indicators, then propose two thorny new cases to test the winning principle.
answer: |-
  Here's a breakdown of candidate principles fitting your intuitions, followed by analysis and verdicts on new cases:

  **Candidate Principles Table**

  | Principle (Stated Precisely)                                                                                            | Key Clause                                                                 | Cases Saved                                                                                                        | Cases Overturned                                                                 | Cost (Ad Hoc/Question-Begging)                                                                 |
  | :---------------------------------------------------------------------------------------------------------------------- | :------------------------------------------------------------------------- | :----------------------------------------------------------------------------------------------------------------- | :------------------------------------------------------------------------------ | :--------------------------------------------------------------------------------------------- |
  | **1. Commodification Corrupts:** Certain goods or practices lose their essential meaning or value when bought and sold. Commodification degrades or corrupts intrinsic human goods, social practices, or relationships when they are treated as mere commodities. | "...degrades or corrupts intrinsic human goods, social practices, or relationships..." | Mourner (Not Fine), Kidney (Not Fine), Punch (Not Fine), School Lottery (Not Fine)                                | Liver Risk (Fine? - but *is* commodified), Queuing (Fine? - commodifies time/effort) | Defines "intrinsic human goods/social practices" vaguely; risks subjectivity/cultural bias. Liver risk vs. kidney distinction unclear. |
  | **2. Vulnerability & Exploitation:** Transactions are impermissible if they exploit existing vulnerabilities (poverty, desperation, lack of alternatives) *and* involve goods/services where the seller's consent is compromised by those vulnerabilities in a way that harms fundamental interests. | "...exploit existing vulnerabilities... [compromising consent]... harms fundamental interests..." | Kidney (Not Fine), Waste Site Town-Hopping (Not Fine), Bots (Not Fine - exploits system vulnerability), School Lottery (Not Fine) | Liver Risk (Fine? - healthy volunteer *might* be vulnerable?), Punch (Not Fine? - boxer not necessarily vulnerable), Queuing (Fine? - homeless man *is* vulnerable), Summer Reading (Fine) | "Fundamental interests" needs definition. Punch/mourner cases don't clearly involve *exploited* vulnerability. Liver risk vs. kidney distinction hard to justify solely on vulnerability. |
  | **3. Consent-Compromising Contexts:** It is wrong to buy/sell goods or services where the context inherently creates pressures that invalidate meaningful consent, or where the transaction itself violates the purpose/meaning of the practice, especially concerning the body, personhood, or fundamental social goods. | "...context inherently creates pressures that invalidate meaningful consent... violates the purpose/meaning of the practice..." | Kidney (Not Fine), Punch (Not Fine - violence as service?), Mourner (Not Fine - grief ritual), Waste Site Town-Hopping (Not Fine - pressured consent), School Lottery (Not Fine - violates fairness), Bots (Not Fine - violates ticketing purpose) | Liver Risk (Fine - clinical context legitimizes risk/consent?), Queuing (Fine - context of queuing accepts substitution?), Carbon Offsets (Fine - purpose is environmental exchange) | "Purpose/meaning of the practice" is contestable. Distinguishing legitimizing contexts (clinical trials) from delegitimizing ones (organ sales) needs further justification. |
  | **4. Contextual Integrity (Winner):** Transactions are impermissible if they violate the normative context governing a specific social sphere (e.g., family, body, ritual, citizenship, market) by introducing alien norms (like pure market valuation) that damage the core purposes, values, or relationships essential to that sphere. | "...violate the normative context governing a specific social sphere... introducing alien norms... damage core purposes/values..." | **ALL SAVED:** Summer Reading (Family/Education - incentivized learning acceptable), Punch (Body/Violence - commodifies bodily integrity), Liver Risk (Medicine/Research - regulated risk acceptable), Kidney (Body/Citizenship - violates bodily integrity/non-commercialization), Mourner (Ritual/Grief - commodifies authentic emotion), Waste Site (Community/Environment - informed consent within sphere ok), Waste Site Hopping (Community/Environment - exploits sphere vulnerability), Queuing (Market/Access - personal effort substitution acceptable), Bots (Market/Access - violates fair access norm), School Lottery (Community/Fairness - violates procedural justice of lottery), Carbon Offsets (Environment/Market - aligns with sphere's purpose) | **NONE** (Fits all your verdicts) | Requires identifying the "core purposes/values" of each sphere, which can be debated (e.g., is queuing's core value effort or order?). Relies on social conventions which can change. |

  **Analysis of Winning Principle (Contextual Integrity):**
  This principle explains your intuitions by focusing on the *social context* and the *normative logics* appropriate to different spheres of life. Introducing market norms (e.g., buying a punch, a kidney, a mourner's tears, a lottery advantage) violates the core values of the spheres governing bodies, rituals, grief, and fair procedural access. Conversely, it allows market norms where they align with or don't fundamentally corrupt the sphere's purpose (summer reading incentive within family/education, regulated risk payment within medical research, waste site payment with informed consent *within* the community sphere, hiring queue-standers within the market's acceptance of effort substitution, carbon offsets aligning with environmental goals). The town-hopping case violates the "community consent" sphere by exploiting desperation created *outside* the specific negotiation context. Bots violate the "fair access" norm of the ticket market sphere.

  **New Threatening Cases & Predicted Verdicts:**

  1.  **Paying for Military Service (Conscription Buyout):** A wealthy citizen pays a willing, unemployed volunteer $200,000 to take their place in a mandatory military draft. The volunteer understands the risks and sees it as life-changing opportunity.
      *   **Predicted Verdict (Contextual Integrity): Not Fine.** The sphere here is citizenship and shared civic obligation. Introducing a market norm (buying your way out of duty) corrupts the core value of equal sacrifice and shared responsibility for national defense. It violates the "citizenship" context by making duty contingent on wealth.
  2.  **Commercial Surrogacy in a Regulated Market:** A couple pays a woman $50,000 (plus medical costs) to carry their genetically related child in a jurisdiction with strict regulations protecting surrogates' health, legal rights, and informed consent. The surrogate is financially stable but views this as significant income.
      *   **Predicted Verdict (Contextual Integrity): Ambiguous/Threatening.** This deeply challenges the principle. **Sphere:** Family/Reproduction/Body. **Core values?** Intimacy, non-commodification of children/gestation, altruism? Or autonomy, helping others, fulfilling parenthood? **Alien norm?** Paying for gestational labor directly commodifies a deeply intimate bodily process linked to family creation. However, the regulated context *aims* to legitimize consent and protect against exploitation, potentially aligning payment with the sphere's purpose of enabling family formation through collaboration. Your intuition might lean "Not Fine" (commodifies gestation/child) or "Fine" (regulated, consensual, helps all parties). This exposes the principle's reliance on interpreting a sphere's "core purpose/value" – a major point of societal debate.

  **The Mourner Verdict: Keep It, Accept the Messier Principle**
  **Drop the mourner verdict? No.** Your intuition that paying a *disclosed* professional mourner feels wrong, even without harm or deception, is crucial data. It points to something important about rituals and authentic social expression that the Contextual Integrity principle captures well (commodification corrupting the ritual of grief). Abandoning this verdict would mean sacrificing a core insight about non-market social goods. **Accept the principle's messiness.** The cost of a principle that perfectly fits all your complex, context-dependent intuitions *is* that it requires nuanced judgment about spheres and their norms. It won't be a simple, mechanical rule. It embraces the complexity of social life where different domains (family, market, body, state, ritual) operate with different logics. While defining spheres and their core purposes can be contested, this framework provides the most coherent explanation for your diverse judgments without dismissing any as mere inconsistency. The messiness reflects the reality of the ethical landscape.
