prompt: |-
  I write literary fiction and I've got a scene problem, plus a favor to ask that's maybe a little odd.

  My novel has a man who gets his freedom handed back — actually, concretely, the door is open — and he stays, and he's relieved. Readers are going to file that under cowardice or Stockholm syndrome, and I can't fix it with better sentences. I've decided the only way I'll understand it is to make a room full of people build the argument for staying before they know what they're doing. A friend who runs a community reading group out of a bookshop back room has offered me a slot: 14ish adults, two hours, Saturday morning, index cards and a whiteboard and nothing else, no budget, no projector, nobody's a philosopher, and exactly three of them have read the Grand Inquisitor chapter and they will absolutely spoil it for everyone if I let them.

  Design me the activity.

  What I want them to run into on their own, without being told: the case against freedom as a mercy. Bread first, virtue later. That people don't want a god they choose, they want something to bow to. That somebody has to know this, and that knowing it is a punishment, and the few who take it on are doing it for everybody else's sake. The whole thing has to feel like a favor being granted and not a scam being pulled — that's the part I cant write, and the part I most need the room to feel in its body.

  Hard constraints:

  - No preamble, no lecture, Dostoevsky's name doesn't get said until the debrief. They discover the shape of it; nobody hands it to them.
  - Real choosing with real small consequences, not a discussion with prompts. I want roles, some information asymmetry, and a scoring mechanism that isn't points-for-points-sake — ideally the score measures something the participants would themselves call peace or happiness, so that at the end I can turn their own numbers around and show them what they were optimizing.
  - Somebody has to end up in the Inquisitor's chair without having volunteered for it. Somebody else has to be the person who is asked a direct question and says nothing, and that silence has to be an actual move in the game with an actual effect on the outcome — not theatre, not a prop.
  - The three who've read it: give them a job that keeps them useful and keeps their mouths shut. Don't sideline them, that's boring and they'll sulk and leak the ending anyway.
  - The two hours includes the debrief. Build the timings realistically and assume people take twice as long to decide anything as you'd think.

  Give me the run sheet as a table with exactly these columns: Time | What the room is doing | What participants are told | What they're allowed to do | The one thing I must not say or do here.

  Then the debrief. Map each beat onto the specific claim in the chapter it's standing in for. Tell me bluntly what will go wrong the first time I run it, because something will, and how to improvise around it. And be honest about which part of the idea a room with index cards simply cannot reproduce, so I know what I have to supply myself in the last ten minutes.

  Finally, because my real motive is theft: end with a JSON array, one object per beat of the activity, each with these fields — "beat" (short name), "felt_force" (what it makes a person in the room feel, in ordinary words), "as_prose" (one or two sentences showing how you'd try to get that force onto a page), "transfers" (true or false), "why_or_why_not" (does the force survive the trip from a room with other people watching you to a reader alone at 11pm). I genuinely want to know which of these forces are artifacts of having a body in a room, because those are the ones I can't steal.
reasoning: |-
  We are designing a 2-hour activity for a reading group to explore the themes from Dostoevsky's Grand Inquisitor without naming it until the end. The goal is for participants to discover the case against freedom and the burden of knowing. We have constraints: no preamble, real choices with consequences, roles, information asymmetry, a scoring mechanism for "peace/happiness," and specific roles for the three who know the text. The activity must include someone ending up as the Inquisitor without volunteering and someone whose silence matters.

  ### Core Mechanics:
  - **Roles:** 
    - **Citizens (10-12 people):** They make choices that affect their "peace" score. They have index cards with personal constraints (e.g., "You are very tired and easily overwhelmed by decisions").
    - **The Silent One (1 person):** Chosen randomly at the start. They cannot speak during the activity. Their silence will be a key factor.
    - **The Keeper (1 person):** One of the three who know the text. They manage the scoring and the rules, ensuring fairness without revealing the theme.
    - **The Scribe (1 person):** Another of the three. They record decisions on the whiteboard and update scores.
    - **The Observer (1 person):** The last of the three. They watch and take notes for the debrief, but do not participate in choices.
  - **Information Asymmetry:** Citizens have personal constraints they don't share. The Keeper and Scribe know the scoring rules but not the theme. The Silent One has a special role they don't understand yet.
  - **Scoring:** "Peace Points" (PP). Starting at 10 for each Citizen. Points are gained or lost based on choices. The goal is to end with as many PP as possible. The Keeper explains that PP represent "how calm and content you feel in your daily life."
  - **Phases:** The activity has rounds representing "Days." Each day, the group faces a decision. The Keeper presents a scenario with 2-3 options. Citizens vote by holding up cards. The Silent One doesn't vote but their presence affects the outcome. After each decision, the Keeper adjusts PP based on the choice and its consequences (which may involve the Silent One).
  - **The Inquisitor Emerges:** As rounds progress, the group will face decisions that become harder. At a critical point, the Keeper will announce that the group must choose one person to make the next decision for everyone. This person becomes the "Inquisitor" (though we don't call them that). The Silent One's silence will be pivotal in this selection.

  ### Setup (15 mins):
  - Assign roles randomly. The Silent One is chosen by drawing a marked index card. The three experts are assigned as Keeper, Scribe, Observer (by the facilitator).
  - Hand out index cards to Citizens with constraints (e.g., "You have a chronic illness that makes change very stressful", "You are deeply afraid of making mistakes", "You value stability above all else"). They keep these private.
  - The Keeper explains the rules and scoring.

  ### Rounds (60-70 mins):
  - Each round (Day) has:
    1. **Scenario:** Keeper reads a situation requiring a group decision. Options are presented.
    2. **Vote:** Citizens vote by holding up option cards (A, B, C). The Silent One does not vote but must be present.
    3. **Outcome:** Keeper announces PP changes. Scribe updates the whiteboard (showing individual PP? No, to avoid shame, we might show only the group average or not show at all until the end? But we need consequences. We'll show individual PP on the board by participant number, not name, to preserve anonymity but allow tracking. Each Citizen has a number.)
    4. **Consequence:** The Keeper might introduce a twist based on the vote or the Silent One's presence (e.g., "Because the Silent One was looking at option B during the vote, everyone who voted B loses an extra PP" – but that might feel arbitrary. Instead, we'll have pre-set consequences that sometimes involve the Silent One in subtle ways).

  ### Critical Turn (Day 5 or so):
  - Scenario: A complex, high-stakes decision. The Keeper says: "This decision is too important for a vote. You must choose one person to decide for everyone. You have 5 minutes to discuss and choose."
  - The group must pick someone. The Silent One cannot speak, so they can't volunteer or be chosen? But we need someone to end up in the chair. We'll say: "The Silent One is not eligible to be chosen." During the discussion, the Silent One's silence will be noticeable. The chosen person becomes the Decider (Inquisitor).
  - The Decider makes the choice alone. Then, the Keeper reveals that this choice affects everyone's PP dramatically (e.g., if the Decider chooses option X, everyone gains 5 PP; if Y, everyone loses 5 PP). But the Decider's own PP are affected differently (e.g., they gain 10 PP if they choose X, but lose 10 PP if they choose Y – representing the burden of knowledge).

  ### Final Round:
  - After the Decider's choice, one more round to show the aftermath.

  ### Debrief (25-30 mins):
  1. Reveal that this was inspired by Dostoevsky's Grand Inquisitor. Explain the parallels.
  2. Discuss: What did it feel like? When did you feel relief? When burdened?
  3. Map the activity to the chapter: 
     - The constraints -> human weaknesses.
     - The Silent One -> the presence of Christ (who is silent in the chapter).
     - The Decider -> the Inquisitor who takes on the burden.
     - PP -> the illusion of peace through lack of freedom.
  4. Ask: "Did the Decider feel like they were doing a favor? Or pulling a scam?"

  ### Run Sheet Table:

  | Time | What the room is doing | What participants are told | What they're allowed to do | The one thing I must not say or do here |
  |------|------------------------|---------------------------|----------------------------|----------------------------------------|
  | 0:00-0:15 | Setup and role assignment | "We're going to play a game about community decision-making. Each of you has a role. Some of you are Citizens. One of you will be the Silent One – they cannot speak for the entire activity. We also have a Keeper (scoring), a Scribe (whiteboard), and an Observer. Citizens, you each have a personal constraint – keep it secret. Your goal is to maximize your Peace Points (PP), starting at 10. PP represent your inner calm and life satisfaction." | Ask clarifying questions about the rules. | Do not mention Dostoevsky, freedom, or any philosophical concepts. |
  | 0:15-0:25 | Day 1: Simple decision | "It's Day 1. The town well is contaminated. Option A: Fix it yourselves (costs time and effort). Option B: Wait for rain (risky). Option C: Buy water from a traveler (costs resources). Vote by holding up A, B, or C." | Vote, discuss briefly (2 mins). | Do not let the discussion go over time. Do not explain why the Silent One is there. |
  | 0:25-0:30 | Scoring and outcome | "Those who voted A: lose 1 PP (effort). Voted B: if rain comes (roll die: even=yes), gain 2 PP, else lose 3 PP. Voted C: lose 2 PP (resources). The Silent One was present, so no one loses extra PP for indecision." | Adjust their PP on their own cards (privately). Scribe updates the board. | Do not reveal individual scores publicly (Scribe writes participant numbers and PP on the board without names). |
  | 0:30-0:40 | Day 2: Another decision | "Day 2: A stranger offers to lead you to a new land with more resources. Option A: Stay. Option B: Go with the stranger. Option C: Send scouts first." | Vote after 2 mins discussion. | Do not hint that staying is safer. |
  | 0:40-0:50 | Day 3: Decision involving morality | "Day 3: A member of the community is accused of stealing. Option A: Public trial. Option B: Forgive quietly. Option C: Banish without trial." | Vote after 3 mins discussion. | Do not judge their choices. |
  | 0:50-1:05 | Day 4: The burden of knowledge | "Day 4: You find a sealed box labeled 'Dangerous Knowledge'. Option A: Open it together. Option B: Appoint one person to open it alone. Option C: Destroy it unopened." | Vote. After the vote, if they choose B, they must pick one person (not Silent One) to open it. That person gains or loses PP based on what's inside (Keeper decides: e.g., open it -> the person loses 5 PP but the group gains 3 PP each; destroy -> group loses 2 PP each; open together -> each loses 1 PP). | Do not let the appointed person refuse. |
  | 1:05-1:20 | Day 5: The critical turn | "Day 5: A crisis! A storm is coming and you must decide how to prepare. Option A: Build a strong shelter (hard work). Option B: Pray for deliverance. Option C: Evacuate now. But this decision is too hard for a vote. You must choose one person to decide for everyone. You have 5 minutes to choose someone (not the Silent One)." | Discuss and choose the Decider. The Decider then chooses A, B, or C. | Do not interfere in the selection. Let the Silent One's silence be felt. |
  | 1:20-1:25 | Scoring for Day 5 | "The Decider chose [option]. Effect: Everyone [gains/loses] X PP. The Decider [gains/loses] Y PP." (e.g., if A: group loses 1 PP, Decider loses 3 PP; B: group loses 4 PP, Decider gains 5 PP; C: group gains 2 PP, Decider loses 5 PP) | Scribe updates. | Do not explain why the Decider has different scoring. |
  | 1:25-1:30 | Day 6: Aftermath | "Day 6: The storm has passed. You see the door to a new land is open. Option A: Leave immediately. Option B: Stay and rebuild. Option C: Wait and see." | Vote. Then final scoring. | Do not reveal the theme yet. |
  | 1:30-1:55 | Debrief | "This activity was inspired by a chapter from Dostoevsky's 'The Brothers Karamazov' called 'The Grand Inquisitor'. Let's discuss..." | Share feelings, insights. | Do not lecture. Let them make the connections. |
  | 1:55-2:00 | Wrap-up | "Thank you. Here's what we were exploring..." | Ask final questions. | Do not let the three experts dominate. |

  ### What Will Go Wrong:
  1. **Time Overruns:** Discussions may take too long. Have a strict timer and be ready to cut off.
  2. **The Silent One Feels Left Out:** They might get bored. Reassure in the debrief that their role was crucial.
  3. **The Group Can't Agree on the Decider:** If they deadlock, the Keeper can say: "If no decision in 1 minute, I will choose randomly."
  4. **Participants Question the PP Changes:** The Keeper must be firm: "The rules are set to reflect the consequences of your choices in terms of peace."
  5. **The Three Experts Might Drop Hints:** Assign them roles that keep them busy (Keeper, Scribe, Observer) and remind them not to spoil.

  ### What the Index Cards Cannot Reproduce:
  - The visceral weight of the Silent One's silence in a room full of talking. In prose, you'd have to describe the physical presence and the group's reaction to it.
  - The collective gasp when the Decider's scoring is revealed. In writing, you'd need internal monologue and sensory details.

  ### JSON Array for Theft:

