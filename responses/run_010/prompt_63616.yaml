answer: |-
  ### Activity Run Sheet

  | Time       | What the room is doing                                     | What participants are told                                                                                             | What they're allowed to do                                                                 | The one thing I must not say or do here                                                                 |
  |------------|------------------------------------------------------------|------------------------------------------------------------------------------------------------------------------------|--------------------------------------------------------------------------------------------|---------------------------------------------------------------------------------------------------------|
  | 0:00-0:10  | Role assignment & setup                                    | "You're a community facing shared challenges. Some of you have secret constraints (on cards). Goal: Maximize peace points (PP). Start at 10 PP each. PP = your sense of safety/stability." | Read constraint cards privately; ask logistical questions.                                | Never define "freedom" or mention philosophy. Avoid eye contact with the three experts.                 |
  | 0:10-0:25  | **Round 1: The Broken Bridge**                             | "A flood destroyed your only bridge. Option A: Rebuild collectively (-3 PP effort, +1 PP unity). Option B: Wait for help (risk: lose 1-6 PP)." | Discuss for 4 min. Vote publicly via colored index cards.                                | Don’t hint that waiting is "cowardice." If the Silent One hesitates to vote, say nothing.              |
  | 0:25-0:40  | **Round 2: The Stranger’s Offer**                          | "A traveler offers maps to a ‘land of liberty.’ Option A: Accept (+2 PP hope, but -1 PP stability). Option B: Refuse (+1 PP safety)." | Discuss 5 min. Vote. Silent One may not speak but must hold up a card (ignored in tally). | If the three experts try to debate, assign them to tally votes or enforce silence.                      |
  | 0:40-1:00  | **Round 3: The Burden Shift**                              | "Children are starving. Option A: Share rations equally (-2 PP all). Option B: Appoint one ‘Provider’ to decide rations." | Secretly nominate a Provider via written note. Highest votes becomes Provider.            | Never suggest the Provider is "noble." If Silent One is nominated, discard votes silently.             |
  | 1:00-1:20  | **Round 4: The Open Door**                                 | "Sunlight reveals an unblocked path to the outside. Option A: Leave now (lose ALL PP if >50% choose leave). Option B: Stay (retain PP + gain ‘Certainty Bonus’)." | Discuss 7 min. Vote. Provider decides bonus allocation.                                  | If asked "What’s outside?": "Unknown." Do not let the Provider abdicate.                               |
  | 1:20-1:30  | **Scoring & Reveal**                                       | "Calculate final PP. The Certainty Bonus: +3 PP to those who voted ‘Stay,’ +5 PP to the Provider."                     | Adjust scores; group applauds highest PP holder.                                          | No moralizing. If someone says "We were manipulated," note it but don’t engage yet.                    |
  | 1:30-1:55  | **Debrief**                                                | "Today echoed a 19th-century parable about why people surrender freedom. Let’s unpack your choices."                   | Share reactions; map beats to Grand Inquisitor claims.                                   | Don’t say "Stockholm Syndrome." If outrage flares, ask: "When did staying feel like relief?"           |
  | 1:55-2:00  | Wrap-up                                                    | "Thank you. Your Provider was the Inquisitor; the Silent One was the returned Christ. Bread before freedom, yes?"      | Take final questions.                                                                     | No homework assignments. End on collective silence.                                                     |

  ---

  ### Debrief Mapping & Pitfalls
  - **Round 1 → "Bread first, virtue later"**  
    *Claim:* Humans prioritize survival over ideals.  
    *Pitfall:* Group may rush to rebuild (A). *Improv:* If they choose B (wait), emphasize PP loss from anxiety.

  - **Round 2 → "They want something to bow to"**  
    *Claim:* Freedom induces paralysis; authority offers rest.  
    *Pitfall:* Experts may call Option B "irrational." *Improv:* Isolate them as vote-counters; ask: "Did refusing maps feel safer?"

  - **Round 3 → "The burden of knowing"**  
    *Claim:* The Provider (Inquisitor) bears the guilt of choice.  
    *Pitfall:* No one volunteers. *Improv:* If stalemate, pick the person who spoke least. Say: "Silence is a form of consent."

  - **Round 4 → "Freedom as a false mercy"**  
    *Claim:* The open door is cruelty; true mercy is removing choice.  
    *Pitfall:* Mass exodus (A) ruins the arc. *Improv:* If >50% choose A, reveal: "The path collapses. All lose PP. Why did staying feel like a favor?"

  - **Silent One’s Role → "Christ’s silence"**  
    *Claim:* Their non-answer condemns the Inquisitor.  
    *Pitfall:* Silent One rebels. *Improv:* If they speak, note: "Your words changed scoring rules," altering outcomes.

  - **What Index Cards Can’t Replicate:**  
    The **physiological relief** when the Provider takes charge. In a room, shoulders literally unwind. On the page, you must evoke this through somatic details: *"His chest loosened as the weight of deciding passed to her—a surrender that tasted like cool water."*

  ---

