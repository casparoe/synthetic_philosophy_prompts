  ### Brutal Truths  
  - **What Will Go Wrong:** The Silent One will try to speak. *Fix:* Hand them a "Void Card" before Round 1: *"If you speak, give this to anyone. Their PP reset to zero."* Makes silence a weapon.  
  - **Unstealable Force:** The **room’s synchronized breath** when freedom is refused. On the page, you must replace this with rhythmic language: short sentences, repeated consonants (*"Door. Open. Dust. They did not move."*).  
  - **Core Theft:** The Provider’s relief isn’t cowardice—it’s the **euphoria of shedding agency**. Have them touch their throat post-choice: *"The absence of choice felt like a hand lifting from his windpipe."* That’s the favor. That’s your scene.
