  ### Honest Note:
  The force that is hardest to steal is the **collective physical experience** of the Silent One. In a room, everyone feels the silence at once, and it becomes a group phenomenon. In prose, you must choose a perspective (e.g., the Inquisitor's) to feel it, and it becomes individual. The other stealable forces transfer because they are about individual emotions (relief, guilt, burden) that can be internalized.

