answer: |-
  Good evening. I’m going to start at the end, because it’s the safest place: thank you, Mum, for thirty-one years. We’re all here because of you, and frankly, none of us would have missed it. We might have needed a map, but we got here.

  Twelve years ago, in her kitchen, I saw a spider. I grabbed a shoe. I brought it down hard. Job done. I looked up, feeling briefly victorious, perhaps even useful. She was standing in the doorway. She didn’t say a word. Not one. She just looked at the shoe, then at the spot on the floor, then back at me. And she walked away. That silence? It’s been my constant companion ever since. I have developed a profound respect for yogurt pots.

  That yogurt pot – and the bit of envelope kept with it in her top desk drawer – is probably the single most famous piece of Tupperware in the county. Rain or shine, indoor shoes or not, if a spider trespassed in the office, out came the pot. Off she’d go to the hedge. Wasps in the kennels? The door opened. Work stopped. Everyone waited. Twenty minutes, minimum. No debate. One volunteer, brave soul, asked her once, maybe hoping for a rule, a guide: “Where do you draw the line?” She barely paused. “I don’t draw lines I can’t see,” she said, “and I’m not starting now.” That’s it. That’s the rule. Or the non-rule.

  Now, anyone looking in from the outside might think that sounds… well, maybe a little soft. Gentle. Until you remember the ledger. The one that sat on her desk for thirty-one years. Where she wrote, in her own hand, the names – the actual names – of the thousands of animals she authorised to be killed. Sick ones. Suffering ones. Ones nobody would pay to fix. Ones nobody would give a home. She did many of those injections herself, after hours, after the volunteers left. And she insisted, fiercely, on the word. Killed. Not ‘put to sleep’. Not ‘let go’. Killed. Because it was true. Because it deserved that weight. She wrote every name down.

  So, we have the ledger, and we have the yogurt pot. The person who wouldn’t let you say an animal was ‘asleep’ when it was gone, and the person who wouldn’t let you swat a fly. To some, standing outside this place, outside her life’s work, that might look like a contradiction. A puzzle. Maybe even a failing. But we’re not outside. We’re in here. We saw it. The kennel staff she hired young, who’ve maybe seen her cry twice. The vets who know precisely what she asked of them, and what she gave back. The board and the donors – including the one who learned that while animals might be property on paper, arguing the bill was still a separate matter! Her kids, who practically grew up under these desks. And our special guest tonight, who received a letter eleven years ago sparked by a magazine in a dentist’s waiting room. A letter asking a question about lines drawn in the sea. He wrote back that his science couldn’t draw that line, that nobody’s really could. She framed that letter. Hung it by her office door. Called it the most useful answer she’d ever had. Because it was honest. It acknowledged the unseen.

  For her, it was never about finding a perfect line. It wasn't about grand theories declared from an office. It was about the thing right in front of her. It was about looking at that spider and asking: What’s the harm in moving it? A minute? A yogurt pot? Easy. Done. But looking at an animal in relentless, visible pain, trapped in a failing body? The harm in *not* acting, the cost of holding back? That cost lands entirely, crushing, on the creature itself. It’s right there. You can see it. You can’t look away. So, she acted. She wrote the name. It wasn't a different person holding the syringe and carrying the pot. It was the same person asking the same two questions, always: First, what’s really happening here? And second, if I get this wrong, what’s the price paid, and who pays it? The ledger and the yogurt pot are just different answers to those questions, applied to different moments, different lives in her care.

  She wasn’t consistent everywhere, mind you. Ask her about pigeons. Just… no. Wouldn’t take them in. Never gave a reason. If you pushed? “I just don’t like them.” Honest. Specific. Stubborn. The kind of thing that made you love her even when you wanted to argue. Because she was entirely, unreasonably, herself.

  For thirty-one years, she ran this place with a fierce, protective love that didn't always look gentle, but was always deeply practical. It was about doing the thing that reduced the harm, moment by moment, creature by creature, whether that meant opening a door for twenty minutes or closing a ledger with another name written carefully inside. She didn't deal in absolutes; she dealt in the immediate cost of being wrong. She looked, she weighed the cost, and she acted. Without fuss. Without needing a philosophy degree, just a deep, stubborn care for the specific life before her.

  So, Mum. You kept the ledger. You kept the yogurt pot. You kept us all on our toes, and sometimes in respectful silence after a shoe incident. You never drew lines you couldn’t see. You just did the work. The hard, heartbreaking, wasp-waiting, spider-rescuing, ledger-filling work. Tonight, this room is full of people whose lives you touched, whose work you shaped, whose spiders you saved. We see you. We honour you. And for what it’s worth… your yogurt pot is safe with us.
