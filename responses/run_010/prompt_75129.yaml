  The mosquito dunk concern (#4) is valid. Bti only targets larvae, but aerial spraying kills adults instantly versus starvation. They could test this with pond monitoring. 

  The biomass question (#5) is paralyzing but probably intractable with their resources. Better to focus on harm reduction within existing control frameworks. 

  Prioritization: Death quality (#1) comes first because it informs every pesticide choice they make right now. It's upstream - if fast deaths are vastly better, it could reshape all control methods. Their grounds crew could run simple mortality timing assays. 

  Second, compensatory effects (#2 refined). They could test tick rebound rates in sprayed vs unsprayed zones with drag cloth surveys. If spraying doesn't reduce long-term abundance, it forces hard ethical questions. 

  Third, non-target impacts. Their oak groves likely host thousands of species. Pyrethroids might kill more non-targets than fipronil. Crew could do biodiversity sampling - messy but feasible. 

  I'd deprioritize the biomass question (#5) - too speculative. And hunch #3 is correct: institutional decisions matter more than consumer choices, so their work has leverage. 

  Confidence levels: 90% on #1 being top priority (directly actionable), 70% on #2 (needs field validation), 60% on non-targets (harder to quantify suffering). 

  Must explicitly flag: their hunch #2 is half-wrong. Compensatory dynamics exist, but immediate deaths matter ethically, and tick populations aren't fully compensatory. This affects their whole framing. 

