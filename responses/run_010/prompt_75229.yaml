answer: |-
  ## Committee Decision Memo: Annotation Policy for Locus 2714 & Related Cases  
  **To:** Curation Policy Committee  
  **From:** Retired Member (Comparative Physiology, Fish Kidneys)  
  **Date:** [Today's Date]  
  **Subject:** Resolution for Annotation of Locus 2714 & Framework for Future Cases  

  After careful review of the evidence and committee discussions, I propose the following ruling and policy. Our goal is accurate, biologically meaningful annotations that serve database users while respecting empirical constraints.  

  ---

  ### **Bottom Line: The Ruling**  
  1. **Locus 2714 Annotation:**  
     - **Primary Annotation:** "Metal ion buffering" (GO:0000049 or equivalent) *with* in vivo experimental evidence (e.g., knockout phenotype).  
     - **Secondary Annotation:** "Substrate S turnover" (GO:xxxxxxx) *with* in vitro assay evidence (IDA) and an **"In Vitro Activity" qualifier**.  
     *Rationale:* The metal buffering is biologically consequential; S turnover is biochemically real but currently irrelevant in vivo.  

  2. **Catalytic-Site Wrecked Variants (Wild Isolates):**  
     - **Annotate as functional** for metal buffering. **Do not flag as loss-of-function**—these variants retain their primary biological role.  

  ---

  ### **Criteria for Future Cases: The "Impact vs. Mechanism" Test**  
  A curator should ask these questions *in order* when a gene/protein has multiple activities:  

  1. **Biological Impact Question:**  
     *"Is there direct experimental evidence (e.g., knockout, mutation) that this activity measurably affects the organism’s growth, survival, or fitness under *any* tested condition?"*  
     - **YES → Annotate as PRIMARY function** (even if not the "expected" activity).  
     - *Example:* 2714’s metal buffering affects cellular metal handling → PRIMARY.  

  2. **Biochemical Mechanism Question:**  
     *"Does the protein catalyze a reaction (or perform a binding activity) in a well-controlled assay, even if no in vivo impact is known?"*  
     - **YES → Annotate as SECONDARY function** with an **"In Vitro Activity" qualifier**.  
     - *Example:* 2714 turns over S in vitro → SECONDARY + qualifier.  

  3. **Ancestral/Conserved Activity Check:**  
     *"If the primary activity is absent, is there strong phylogenetic evidence (e.g., conserved active sites in orthologs) that this was likely the ancestral function?"*  
     - **YES → Include as SECONDARY** (with qualifier) to preserve evolutionary context.  
     - **NO → Omit** (avoids annotating incidental activities).  

  ---

  ### **Why This Addresses Committee Concerns**  
  - **For the "Mechanism, Not History" Group:**  
    We prioritize in vivo impact. The S activity isn’t discarded—it’s annotated transparently with its empirical limitations. This avoids "drowning in incidental activities" by requiring biological impact for primary annotation.  

  - **For the "Chemistry Defines the Family" Group:**  
    The S activity is retained as secondary, respecting biochemistry and phylogeny. The qualifier ensures users know it’s not the current biological role.  

  - **For the Wrecked-Catalytic-Site Variants:**  
    They pass the Biological Impact Test (metal buffering works) → functional annotation. Calling them "loss-of-function" implies impairment of the *relevant* biological role, which is inaccurate.  

  - **Interoperability Conflict:**  
    Our partner database can map our "In Vitro Activity" annotation to their equivalent (e.g., "molecular function" without biological context). We’ll document this discrepancy but uphold biological accuracy.  

  ---

  ### **What Would Change My Mind**  
  My recommendation flips if:  
  1. **New Evidence Shows S Activity Matters In Vivo:**  
     (e.g., if S is found in tissues under stress conditions, or knockouts show defects when S is present).  
     → Then S turnover becomes a PRIMARY annotation.  

  2. **Metal Buffering Proves Non-Functional:**  
     (e.g., if buffering is an artifact in lab strains, or wild isolates show no fitness difference).  
     → Then 2714 might be "function unknown" pending new data.  

  3. **Downstream Users Reject Qualified Annotations:**  
     If database consumers (e.g., biotech teams) systematically ignore "In Vitro Activity" annotations, making them misleading rather than informative → We drop secondary annotations entirely.  

  **Where Reasoning Might Break:**  
  This framework assumes activities are either "biologically impactful" or "incidental." It could fail for:  
  - **Latent Functions:** An activity with no *current* impact (e.g., S turnover) might become critical if the environment changes (e.g., new carbon source).  
  - **Pleiotropic Proteins:** If both activities *jointly* affect fitness, separating them arbitrarily misrepresents biology.  

  ---

  **Final Note:** This isn’t about winning a debate—it’s about balancing what the protein *can do* with what it *actually does for the organism today*. Let’s vote to annotate biology as we observe it, not as we expect it.  

  Ready for discussion on Thursday.  
  —Retired Physiologist (Still Avoiding Parties)
