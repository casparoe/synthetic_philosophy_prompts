prompt: |-
  ok so I got into a genuinely long argument last night with a friend of mine — we do this maybe twice a year and it's never productive — about whether a city can bind itself at all. He's a lawyer, I'm not, and he kept throwing around phrases like "Ulysses contract" and "entrenchment" and "the dead hand problem," and I could follow maybe 70% of it. His position was that any rule a council passes today that a future council can't undo is just the past tyrannizing the present. Mine was that that's obviously wrong, because otherwise a city could never do anything hard: you'd never get a debt brake or a protected transit fund through, since everyone knows the same people who vote for it will vote to raid it in year three. He said that's exactly my problem, I'm admitting the voters can't be trusted with their own money. We went in circles for an hour and neither of us moved.

  Here's why I actually need this and not just a tiebreaker. I work in the city clerk's office in a midsized city, about 180k people, and I'm the one who ends up writing the staff analysis on charter amendment proposals. Three to five times a year we get one that's self-binding in some way — a tax limit requiring a supermajority, a dedicated fund that's "lockboxed," an independent commission with staggered terms that a future council is barred from abolishing or reconstituting. Right now I have no framework. I just describe what the thing does, note that reversing it would require another charter amendment, and let the councilmembers draw their own conclusions, which is cowardly and gets me complaints from both sides. Our office is six people, one of whom is a half-time assistant city attorney, so whatever you write can't assume anybody has read anything, and I usually get about two weeks between a petition being certified and my analysis going out for public comment.

  So: write me a screening procedure I can actually run on a proposal. I want a sequence of questions to ask in order, what counts as a satisfactory answer to each, and clear exits — where the procedure comes out as "this isn't a precommitment device at all, it's an ordinary policy with a fancy label on it," where it comes out as "this binds in a way that will probably backfire, and here's the mechanism," and where it has to stop and hand the thing to the council because what's left is a question of values and not of facts. The real distinctions from the precommitment stuff need to survive the translation — who exactly is binding whom, whether the device constrains a choice set or tries to guarantee an outcome, whether there's an outside enforcer with their own incentives or it's just the same body promising itself to behave later, and how expensive exit is once you want it — but expressed as questions a normal person can ask of a piece of drafting, not as theory. Throw in a couple of cheap tests I can run directly on the text of a proposal. Then run it on three things: (1) a charter amendment requiring a two-thirds council vote to increase the property tax levy, no sunset; (2) a transit lockbox dedicating a fixed share of a new local sales tax to capital transit projects, worded so it survives any future council trying to reallocate it; (3) an independent redistricting commission with staggered eight-year terms that the charter says no future council may abolish. Be straight with me about where the procedure lands on an answer I wouldn't like — I suspect at least one of those three is something I'd personally vote for. And end with a short list of what the procedure genuinely can't settle, including the thing my friend would say it can't settle: whether the people who wrote the rule had any standing to write it for people who werent in the room yet.
reasoning: |-
  Okay, let me tackle this city clerk's problem. They need a practical screening tool for charter amendments that involve self-binding mechanisms, based on their frustrating argument with a lawyer friend about whether cities can bind future councils. 

  First, I need to understand their core frustration: they're currently just describing proposals without evaluating their binding nature, which leaves councilmembers unsatisfied. The office has limited legal expertise and tight deadlines, so the tool must be executable by non-lawyers in about 30-60 minutes per proposal.

  The key theoretical concepts from their debate (Ulysses contracts, entrenchment, dead hand problem) need translation into concrete questions. I'll break this into three layers: 
  - First determine if it's genuinely binding (many proposals just look binding but aren't)
  - Then analyze the binding mechanism's design risks
  - Finally flag irreducible value judgments for council 

  For the binding test, I'll focus on reversibility costs. If reversing it requires the same effort as passing ordinary legislation, it's not truly binding - that's just normal policy. Real binding mechanisms create asymmetry where repeal is harder than enactment.

  The risk assessment phase should examine:
  - Who gets bound (council vs voters)
  - Constraint type (procedural hurdle vs outcome guarantee)
  - Enforcement (internal vs external)
  - Escape cost (time/money/political capital)

  The exit criteria must be crystal clear. When the analysis hits questions like "Should we trust past councils more than future ones?" - that's where the clerk should hand it to council with neutral framing.

  For the three test cases:
  - The property tax supermajority is high-risk binding (asymmetric, internally enforced, low escape cost)
  - The transit lockbox is medium-risk (outcome-focused but external enforcement via courts)
  - The redistricting commission is high-risk binding (asymmetric repeal barrier, no easy exit)

  The tool's limits need explicit acknowledgment: it can't resolve the core philosophical dispute about intergenerational authority (their friend's "tyranny of the past" argument) or predict future political behavior. It just maps the mechanism's design and flags where values must decide.

  I'll structure the output as a sequential flowchart with binary checkpoints so the clerk can stop early when a proposal fails the binding test. The language will avoid academic terms - instead of "Ulysses contract" it'll ask "Does this make it harder to change course later than to adopt it now?"
answer: |-
  Here’s a practical screening procedure for charter amendments with self-binding elements, designed for speed and clarity. Use it sequentially—stop and categorize the proposal as soon as you hit a definitive answer. 

  ---

  ### **Screening Procedure: 3-Step Flowchart**  
  *(Run these questions in order; answer "Yes/No")*

  **STEP 1: IS THIS ACTUALLY BINDING?**  
  *Purpose: Filter out proposals that only *appear* self-binding but are easily reversible.*  
  - **Q1:** Does reversing/amending this require a *higher procedural hurdle* (e.g., supermajority, voter referendum) than passing ordinary legislation?  
    - *Yes* → Proceed to **Step 2**.  
    - *No* → **Exit: "Not Binding."** (It’s ordinary policy; future councils can repeal it like any other law.)  
  - **Q2:** Is there a *time-based asymmetry* (e.g., waiting period, mandatory review delay) making repeal slower than enactment?  
    - *Yes* → Proceed to **Step 2**.  
    - *No* → **Exit: "Not Binding."**  

  **STEP 2: HOW DOES IT BIND?**  
  *Purpose: Identify binding mechanism and key risks.*  
  - **Q3:** Who is *bound*?  
    - *Future elected bodies (e.g., council, mayor)* → Higher risk of backlash.  
    - *Voters (e.g., via mandatory referendum)* → Lower implementation risk.  
  - **Q4:** What is *constrained*?  
    - *Choices* (e.g., "Council can’t vote on X without Y hurdle") → Procedural binding.  
    - *Outcomes* (e.g., "Funds *must* be spent on Z") → Outcome binding.  
  - **Q5:** Who *enforces* the bind?  
    - *Internal* (e.g., council self-policing) → **High-risk flag** (unenforceable if incentives change).  
    - *External* (e.g., courts, independent auditor) → **Medium-risk flag** (depends on enforcer’s reliability).  
    - *Voters* (e.g., citizen lawsuits) → **Variable risk** (depends on legal standing rules).  
  - **Q6:** What is the *cost of exit*?  
    - *Low* (e.g., simple referendum) → **Lower backfire risk**.  
    - *High* (e.g., multi-year process, constitutional amendment) → **High backfire risk** (may incentivize workarounds/legal challenges).  

  **STEP 3: VALUES CHECKPOINT**  
  *Purpose: Flag irreducibly political questions for council.*  
  - If all Step 2 questions answered → **Proceed to Q7**.  
  - **Q7:** Does the proposal transfer power to a *non-elected body* (e.g., commission, court) without oversight?  
    - *Yes* → **Exit: "High-Conflict Binding"** (Raises democratic accountability concerns).  
  - **Q8:** Is the bind justified by a *specific, urgent threat* (e.g., fiscal crisis, corruption risk) that outweighs future flexibility loss?  
    - *Debatable* → **Exit: "Council Judgment Required."**  

  **Cheap Text Tests**  
  1. **"Repeal Test"**: Ctrl+F for "repeal," "amend," or "alter." If the process isn’t mentioned or matches standard legislation → *Likely not binding*.  
  2. **"Asymmetry Check"**: Compare enactment vs. repeal language. If repeal requires *more* steps/votes → *Genuine bind*.  
  3. **"Enforcer Hunt"**: Search for "enforced by," "audited by," or "cause of action." If missing → *Relies on self-policing (risky)*.  

  ---

  ### **Applied to Your Examples**  
  ***(1) Property tax levy: Two-thirds vote to increase, no sunset***  
  - **Step 1**: Q1=Yes (supermajority hurdle), Q2=Yes (no sunset = permanent asymmetry) → **Binding**.  
  - **Step 2**:  
    - Q3: Binds future council.  
    - Q4: Constrains *choices* (tax votes).  
    - Q5: Enforced *internally* (council self-policing) → **High-risk**.  
    - Q6: Exit cost *high* (requires future supermajority) → **High backfire risk** (may encourage creative budgeting).  
  - **Step 3**: Q7=No, Q8=Debatable → **Exit: "Binds with high backfire risk."**  
  ***Your take:*** *High-risk because it’s internally enforced—if a future council wants to raise taxes, they’ll find loopholes (e.g., fees, assessments), undermining trust.*  

  **(2) Transit lockbox: Fixed sales tax share for capital projects**  
  - **Step 1**: Q1=Yes (charter amendment required to undo), Q2=Yes (asymmetric repeal) → **Binding**.  
  - **Step 2**:  
    - Q3: Binds future council.  
    - Q4: Constrains *outcomes* (funds *must* go to transit).  
    - Q5: Enforced *externally* (courts via citizen suits) → **Medium-risk**.  
    - Q6: Exit cost *high* (charter amendment) → **Medium backfire risk** (if projects become obsolete).  
  - **Step 3**: Q7=No, Q8=Debatable → **Exit: "Medium-risk binding; council judgment on long-term inflexibility."**  
  ***Your take:*** *You’d support this, but the procedure flags outcome-binding as brittle—if transit needs change, the city can’t adapt without expensive voter approval.*  

  **(3) Independent redistricting commission: Staggered terms, council can’t abolish**  
  - **Step 1**: Q1=Yes (charter amendment to abolish), Q2=Yes (staggered terms create delay asymmetry) → **Binding**.  
  - **Step 2**:  
    - Q3: Binds future council.  
    - Q4: Transfers power to a *non-elected body*.  
    - Q5: Enforced *externally* (courts) → **High-risk** (commission’s independence may clash with voter intent).  
    - Q6: Exit cost *very high* (charter amendment + waiting out terms) → **High backfire risk** (if commission malfunctions).  
  - **Step 3**: Q7=Yes → **Exit: "High-Conflict Binding"** (Democracy vs. technocracy tradeoff).  
  ***Your take:*** *The procedure validates your friend’s "dead hand" concern—this binds most severely and risks unaccountability.*  

  ---

  ### **What This Procedure CAN’T Settle**  
  1. **The Legitimacy Question**: Whether past voters/councils have the moral right to bind future ones (your friend’s "tyranny of the past" argument).  
  2. **Empirical Predictions**: Whether a specific bind *will* backfire—only that its *design* makes backfire likely.  
  3. **Value Tradeoffs**: E.g., "Is preventing future raids worth losing budget flexibility?" or "Is technocratic independence worth democratic deficit?"  
  4. **Legal Vulnerability**: Whether a court would strike down the bind (ask your assistant city attorney).  

  **Final Note**: Your framework exposes a key pattern—**binds that transfer power *away* from elected bodies (examples 1 & 3) are highest-risk**. Outcome-binding (example 2) is less volatile but creates inflexibility. Hand off anything that clears Step 3 to council with neutral bullets:  
  > *"This binds future councils by [mechanism]. Key tradeoffs: [flexibility loss] vs. [policy stability]. Enforcement relies on [entity], which may [risk]."*  

  This won’t end arguments—but it forces them onto solvable ground.
