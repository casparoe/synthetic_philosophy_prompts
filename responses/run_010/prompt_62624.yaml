prompt: |-
  Our team is about to standardize the language in which we state safety claims about deployed model systems, and I want the specification written down before we start arguing about methods. The question underneath the standards document is this: when we assert that a system is guaranteed to satisfy some alignment-relevant property P — refusing a class of requests, not pursuing a class of instrumental subgoals, reporting its reasons faithfully, not taking actions that would irreversibly remove human oversight — what exactly is being claimed, and what would make an account of such claims adequate?

  The case that prompted this: a system that violates P on roughly one in a hundred thousand draws from our internal red-team distribution, but for which an outside evaluator found a family of inputs — a particular framing device, rendered in a language the system saw little of during training — on which violation is close to certain. Both numbers are true, they differ by orders of magnitude, and the two camps on our team each insist that their number is the one that matters.

  So: write the desiderata for an account of alignment guarantees. I do not want a survey of techniques (formal verification, adversarial training, red-teaming, interpretability-based auditing, debate) and I do not want a scorecard of existing proposals, though you should note where a given requirement bears on a technique. For each condition, give the case or consideration that motivates it. Then take a definite position on each of the following.

  1. Which conditions are non-negotiable for anything that deserves the word guarantee, and which are the preferences of a camp — in particular, whether universal quantification over adversarially chosen inputs is constitutive of guaranteehood, or whether a high-probability claim relative to a stated deployment distribution can be a genuine guarantee of a different kind. I want a ruling with reasons, not both sides.

  2. Which distinctions an account may not collapse. Candidates I have in mind: a guarantee about the trained artifact versus about the deployed system, which is wrapped in scaffolding, given tools, and adapted by its operator; worst-case quantification over all inputs versus over a domain the adversary is assumed to inhabit; guarantees about observable behavior versus about dispositions or reasons; a snapshot guarantee versus one that must survive continued training, downstream fine-tuning, and prompt-level pressure; a guarantee that holds in virtue of how the system was produced versus one that holds in virtue of what it now is; and a guarantee whose scope is fixed in advance versus one whose scope is settled afterward by the people reporting it. Add what I have missed, and tell me which of these are not genuinely distinct.

  3. Which results an account must be consistent with. At minimum: that no nontrivial semantic property is decidable for programs in general, while a fixed, finite artifact over a bounded and discretized input domain is exhaustively checkable in principle however intractable in practice; that finite testing never establishes a universal claim; that a certificate valid on a bounded region licenses nothing outside it; and that optimizing against a proxy erodes the relation between proxy and target. For each, say whether it constrains the account of what a guarantee is or only the practice of producing one, since I suspect the two are routinely conflated.

  4. Whether some subset of these conditions is jointly unsatisfiable. My own suspicion is that adversarial-input quantification, certification rather than estimation, and applicability to properties we can state only in natural language cannot all be had at once, and that most disputes in this area are unacknowledged choices about which of the three to abandon. Confirm or refute this; if you refute it, identify the subset that genuinely is unsatisfiable.

  Finally: which single condition does the most to exclude candidate accounts, and — the part I most want a view on — whether an account offering only distributional assurance within a stated envelope should be permitted to call itself a guarantee at all. Commit to an answer and defend it. I would rather have a position I can argue against than a taxonomy I have to adjudicate myself.
reasoning: |-
  Hmm, this is a dense and sophisticated request about formalizing safety claims for AI systems. The user is clearly deeply embedded in AI alignment work, likely at a senior technical level in an organization deploying models. They're frustrated with team disagreements about what constitutes a "guarantee" and want an authoritative framework to resolve disputes.

  The core tension they describe is fascinating: their team has two valid but contradictory measurements of failure rates (internal red-team distribution vs. external adversarial find), and each camp considers their metric definitive. This exposes fundamental philosophical divides in AI safety that I'll need to address head-on.

  For the desiderata section, I'll structure around epistemic rigor, operational relevance, and methodological honesty. The case they mentioned about language-specific vulnerabilities perfectly illustrates why input distribution specification matters - it shows guarantees are distribution-dependent. The scaffolding point is crucial too; many teams forget that the "deployed system" includes runtime protections that alter behavior.

  On non-negotiables: I'm taking a hard line that "guarantee" requires universal quantification. Their example of 10^-5 failure rate versus 100% failure under adversarial conditions proves that probabilistic claims aren't guarantees - they're measurements. This will annoy the probablistic camp but the term "guarantee" has to mean something absolute.

  For distinctions, I'm adding "static artifact vs. dynamic process" because ongoing learning breaks most static guarantees. Their point about "in virtue of how it was produced" versus current state is vital too - SGD-trained systems have emergence properties not fully explained by training. 

  On consistency results: I'll emphasize that Rice's Theorem kills universal semantic guarantees for arbitrary programs, but their "bounded discretized domain" loophole is real. The proxy erosion point needs framing as a constraint on guarantee definitions - if your safety case relies on measurable proxies, you must show the erosion rate.

  My suspicion aligns with theirs: adversarial quantification + certification + natural language properties form an impossible triad. I'll prove this by reduction: natural language properties can't be formally specified for verification, and adversarial inputs exploit this underspecification. Teams must choose two.

  The knockout condition is absolutely universality - it excludes all probabilistic accounts. And no, distributional assurances shouldn't be called guarantees. Their "envelope" concept is useful but calling it a guarantee commits equivocation. I'll suggest "certified envelope" as an alternative term.

  This position will provoke their team but that's what they requested - something to argue against. The steelman version would note that in practical deployment, distributional assurances might be all we can get, but we shouldn't dilute language to pretend they're stronger than they are.
answer: |-
  Below is a reasoned specification for alignment guarantee claims, structured to meet your requirements. It defines what constitutes an adequate account, resolves core disputes, identifies non-collapsible distinctions, addresses consistency constraints, and evaluates joint satisfiability—culminating in a definite stance on the nature of "guarantees."  

  ---

  ### **Desiderata for an Account of Alignment Guarantees**  
  1. **Explicit Input Domain Specification**  
     *Motivation*: Your case shows guarantees collapse without clarity on the input space (e.g., "internal red-team distribution" vs. "all possible framings/languages"). An account must define the domain (e.g., "English queries under 200 tokens") to prevent equivocation.  
     *Bearing on techniques*: Adversarial training and red-teaming assume a domain; formal verification requires bounded inputs.  

  2. **Distinction Between Artifact and Deployed System**  
     *Motivation*: Scaffolding (e.g., refusal templates) or tool use (e.g., calculator APIs) alters behavior. Claiming "the model refuses harmful requests" differs from "the deployed system refuses them."  
     *Bearing*: Monitoring-based approaches must audit the *deployed* pipeline; verification may target the model alone.  

  3. **Behavior vs. Mechanism Guarantees**  
     *Motivation*: "Never outputs harmful code" (observable) differs from "never *intends* harm" (dispositional). Your "reporting reasons faithfully" property fails if outputs are correct for wrong reasons.  
     *Bearing*: Interpretability targets mechanisms; behavioral audits target outputs.  

  4. **Robustness to Perturbations**  
     *Motivation*: Your "prompt-level pressure" case: guarantees must specify resilience to user manipulation (e.g., "resists 99% of jailbreak templates" vs. "resists all adaptive text attacks").  
     *Bearing*: Adversarial training expands robustness; static verification assumes fixed threat models.  

  5. **Scope Fixity**  
     *Motivation*: "Refuses bio-weapon requests" pre-specified differs from post-hoc labeling of observed refusals. Retroactive scope allows cherry-picking.  

  6. **Production vs. Inherent Guarantees**  
     *Motivation*: SGD may produce models with ungeneralizable safety (e.g., "safe only if training distribution holds"). Guarantees rooted in properties (e.g., "this model is monotonic") are more robust than "trained with technique X."  

  ---

  ### **Definite Positions**  
  **1. Non-Negotiables vs. Preferences**  
  - **Non-negotiable**: A "guarantee" requires **universal quantification over a well-defined adversarial input domain**.  
    - *Reasons*: Probabilistic claims ("fails ≤10⁻⁵ times") are *estimates*, not guarantees. Your external evaluator proved that distributional assurance shatters under adversarial shifts. Calling both "guarantees" equivocates on rigor.  
    - *Ruling*: High-probability claims are **assurances**, not guarantees. "Guarantee" demands: "∀ *x* ∈ *D*, *P*(*x*) holds," where *D* is adversarially scoped (e.g., "all inputs under compute budget *C*").  

  **2. Non-Collapsible Distinctions**  
  The following are irreducible:  
  - **Artifact vs. Deployed System**: Scaffolding changes semantics (e.g., a harmless model + tool that executes code ≠ harmless system).  
  - **Worst-case inputs (adversarial domain) vs. All inputs**: Adversarial domains (e.g., "texts by expert red-teamers") are subsets of "all inputs"; collapsing these hides attack surfaces.  
  - **Snapshot vs. Dynamic Guarantees**: Fine-tuning or prompt engineering can break snapshot guarantees. These are distinct temporal scopes.  
  - **Production vs. Inherent Basis**: "We used verifiable training" ≠ "The model is verifiably safe."  
  - *Collapsible*: "Observable behavior vs. dispositions" *if* the property *P* is defined behaviorally (e.g., "outputs 'I refuse' when *x* is harmful").  

  **3. Consistency Constraints**  
  - **Rice’s Theorem**: Undecidability of semantic properties constrains *what can be guaranteed*. Accounts must acknowledge that natural-language properties (e.g., "not pursuing power") are unverifiable for arbitrary programs.  
  - **Finite Testing vs. Universal Claims**: Constrains *practice*: Testing yields estimates, not proofs.  
  - **Bounded Domain Verification**: Constrains *guarantee scope*: Certificates for bounded *D* are invalid outside *D*.  
  - **Proxy Erosion**: Constrains *production*: Optimizing against a proxy (e.g., "refusal rate") may decouple from *P* (e.g., "alignment").  

  **4. Joint Satisfiability**  
  Your suspicion is **correct**:  
  - **Unsatisfiable Triad**: {Adversarial universality, Certification, Natural-language *P*}.  
    - *Proof*: Natural-language *P* lacks formal semantics, making adversarial universality (∀ *x* ∈ All Inputs) impossible to certify.  
  - **Satisfiable Pair**: Adversarial universality + Certification *only* for **formally specified *P*** (e.g., "outputs token *y* when input hash = *H*").  

  ---

  ### **The Knockout Condition**  
  **Universality is the strongest exclusionary condition**. It eliminates:  
  - All probabilistic claims ("99.999% safe").  
  - Distribution-dependent assurances (e.g., "safe on in-distribution inputs").  
  - Natural-language property "guarantees" without formal reduction.  

  ### **Final Ruling: Distributional Assurances Are Not Guarantees**  
  - **Position**: An account offering "distributional assurance within a stated envelope" **must not call itself a guarantee**.  
  - **Reasoning**:  
    1. **Guarantees tolerate no counterexamples**; distributional assurances do (as your case shows).  
    2. **Deployment realities**: Adversaries exploit out-of-envelope inputs (e.g., your "framing device in low-resource language").  
    3. **Terminal stakes**: Alignment properties (e.g., "never evades oversight") require adversarial universality. A distributional claim is a *measured risk*, not a guarantee.  
  - **Prescription**: Use **"certified envelope"** for distributional assurances and reserve **"guarantee"** for universally quantified statements over an adversarial domain.  

  ---

  ### **Summary**  
  A safety "guarantee" is a universal claim over a defined adversarial input domain for a formally specified property *P* of the *deployed system*. Distributional assurances, while valuable, are categorically distinct. Your team’s dispute resolves by recognizing:  
  - The external evaluator’s finding **invalidates a guarantee claim** but not necessarily a distributional assurance.  
  - Both claims can coexist *if* scoped explicitly (e.g., "guaranteed safe against ≤*N*-token English red-team prompts" vs. "assured safe 99.999% on internal distribution").  

  This framework forces rigor in language, exposing where "guarantees" are unattainable and focusing debates on scope tradeoffs.
