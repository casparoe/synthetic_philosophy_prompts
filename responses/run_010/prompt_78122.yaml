  Hmm, their description of common flaws is telling - "rehearsal for the present", "smuggling inevitability", turning past questions into present answers. Butterfield's ghost haunts this newsroom. But they're wise to reject overcorrection; denying progress in science would be absurd. Need surgical strikes, not blanket bans.

  The decision procedure must be:
  - Operational (15min/pitch, 30min/draft)
  - Diagnostic (identify specific flaw types)
  - Prescriptive (concrete fixes, not qualifiers)
  - Transparent about editorial judgment calls

  For structure, considering a three-phase approach:
  1. Premise Interrogation (kills fundamental whiggery)
  2. Narrative Mechanics (fixable structural issues)
  3. Language Sanitisation (sentence-level repairs)

  Biggest trap to avoid: false precision. Must flag where judgment supersedes checklist. Also anticipate resistance - that martyr piece example will test the framework's backbone. 

  On case studies:
