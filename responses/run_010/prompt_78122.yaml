answer: |-
  ## The Whig Test: A Desk Procedure for Historical Journalism

  **Purpose:** To identify and remediate "Whiggish" distortion in historical features — specifically the error of judging the past solely by present standards, imposing false inevitability, or flattening historical actors into heroes/villains based on current agreement — *without* preventing legitimate claims of error, progress, or superior modern knowledge.

  **Ground Rules:**
  1.  **Apply Sequentially:** Stop if a fatal flaw (KILL) is found; proceed to remediation if fixable (FIX/REWRITE).
  2.  **Focus is Damage:** Does the flaw actively distort understanding of the *past*?
  3.  **Judgment Marked:** `[JUDGMENT]` indicates steps requiring editorial experience, not factual checkboxes.
  4.  **Be Ruthless:** Repairs mean cutting misleading claims, not adding caveats. Hedge-paragraphs forbidden.

  ---

  **THE PROCEDURE**

  **PHASE 1: PREMISE INTERROGATION (Apply to Pitch/Draft Concept)**
  1.  **Question:** Does the piece *require* judging past actors/ideas primarily by their alignment with modern orthodoxy to have a point? (e.g., "The story is *only* interesting because X was right early" or "We must show Y was a villain for rejecting Z").
      *   **Sufficient Answer:** No. The core interest lies in reconstructing the past context, exploring genuine historical questions/controversies, or understanding the *process* of change, irrespective of modern agreement.
      *   **Failure (KILL):** If the piece hinges *entirely* on proving "they were right/wrong *by our lights*." Salvage requires fundamentally changing the premise (e.g., from "neglected genius" to "exploring why this theory failed to gain traction then").
      *   `[JUDGMENT]`: Assessing the core "point" of the piece.

  **PHASE 2: NARRATIVE MECHANICS CHECK (Apply to Draft)**
  2.  **Question:** Does the narrative imply inevitability? Scan for phrases like "only a matter of time," "the field was finally ready," "inevitably led to," "destined to fail/succeed," "clear path to," or presenting past debates as mere speedbumps on the road to Us.
      *   **Sufficient Answer:** No. The narrative emphasises contingency – alternative possibilities existed, outcomes depended on specific historical conditions, personalities, accidents, or unresolved debates.
      *   **Failure (REWRITE):** Cut all inevitability phrases. Rewrite sentences to highlight specific *historical* reasons for outcomes (e.g., "Smith's theory gained traction *after* the 1885 eclipse provided crucial evidence his rivals lacked" instead of "science finally caught up"). Show genuine forks in the road.
  3.  **Question:** Are "precursors" presented as *anticipating* modern ideas, or are opponents presented as *merely obstructive*? Check for words like "ahead of his time," "foreshadowed," "anticipated," "visionary" vs. "blind," "reactionary," "dogmatic," "standing in the way."
      *   **Sufficient Answer:** No. "Precursors" are shown grappling with *their own period's* questions using *their period's* tools/concepts. Opponents' views are explained within *their* context, including legitimate concerns or alternative frameworks.
      *   **Failure (REWRITE):** Cut "anticipate/foreshadow" language. Explicitly state the *differences* between the past idea and the modern one. Recast opponents' views sympathetically within their own logic. Explain *why* rejection happened then (beyond "they were stupid").
  4.  **Question:** Does the piece treat historical actors as if their primary motivation was to answer *our* present-day questions?
      *   **Sufficient Answer:** No. The piece reconstructs the questions, debates, and priorities *as they existed in the past period*. It shows actors motivated by concerns relevant *to them*.
      *   **Failure (FIX/REWRITE):** Cut sentences framing past work solely in terms of modern questions. Add context showing the *contemporary* significance of the questions they *were* asking. "What problem were *they* trying to solve?" must be answered.
      *   `[JUDGMENT]`: Distinguishing "their questions" from "our questions" can be nuanced; focus on demonstrable historical context.

  **PHASE 3: LANGUAGE SANITISATION (Apply to Draft)**
  5.  **Question:** Scan verbs and modifiers: Does the language implicitly judge past actors by present standards? Flag words like "correct," "incorrect," "right," "wrong," "surprisingly," "bafflingly," "naively," "obviously" (when applied to past beliefs/actions from a modern vantage point).
      *   **Sufficient Answer:** Judgmental language is absent or strictly confined to claims demonstrably true *within the actor's own framework* (e.g., a calculation error contemporaries spotted) or explicitly framed as *our modern assessment* (used sparingly!).
      *   **Failure (FIX):** **CUT** all implicit judgment words. Replace with neutral descriptors or explicitly frame the judgment: e.g., change "He was wrong about phlogiston" to "His phlogiston theory was superseded by Lavoisier's oxygen theory" or "We now know phlogiston does not exist, but it explained combustion effectively for its time." **Preserve space by deleting the judgment, not adding qualification.**
  6.  **Question:** Does the piece claim modern superiority/knowledge *without explaining the basis* for that claim in a way relevant to the historical narrative? (e.g., "We now know X" stated baldly).
      *   **Sufficient Answer:** Claims of modern superiority are either a) demonstrably factual and uncontroversial (e.g., "We now know the Earth orbits the Sun") stated briefly *or* b) crucial to the story and accompanied by *a concise explanation of why the modern view succeeded* (evidence, methods, paradigm shift).
      *   **Failure (FIX):** **CUT** bald assertions of "We now know..." unless uncontroversially factual. If crucial, add 1-2 sentences *max* explaining *the historical reason* for the shift (e.g., "...based on evidence from particle accelerators unavailable in the 1920s" or "...after the double-helix model explained data the old framework couldn't"). **Delete the assertion if you can't spare the words for context.**

  ---

  **CASE STUDIES**

  1.  **The Forgotten Precursor ("anticipated" modern theory):**
      *   **Phase 1:** Passes (Interest *can* be in rediscovery/context).
      *   **Phase 2 (Q3):** **FAIL (REWRITE).** "Anticipated" is the core flaw. Cut it. Rewrite the spine: Focus on *what specific problem* the precursor tackled, *how* they tackled it with their era's tools, *why* it was neglected then (beyond "they didn't get it"), and *how/why* it resonates *differently* now. Family papers should illuminate *their* world, not prove they were "like us."
      *   **Phase 3 (Q5):** **FAIL (FIX).** Cut all "ahead of his time," "visionary," "foresaw." Replace with neutral descriptions of their actual work and context.
      *   **Verdict:** Salvageable with major reframing (REWRITE Premise/Narrative).

  2.  **The Martyr Researcher (Correct idea rejected):**
      *   **Phase 1:** **FAIL (KILL).** The entire publishable hook ("martyr frame") *is* judging the past primarily by present alignment. "Rehabilitation as martyr" *is* Whiggish.
      *   **Procedure Stops:** KILL the martyr frame.
      *   **Can anything be salvaged?** Yes, but the core narrative must change. Refocus: Explore the *historical context* of the rejection – What were the *contemporary* scientific arguments, institutional pressures, or methodological limitations? What *specific* barriers existed? Frame the researcher's struggle within *their* time's debates. The "rehabilitation" angle can be a hook, but only if used to ask *why* views changed (Phase 2, Q2 rewrite), not to sanctify. **The "martyr" must go; a nuanced story of historical conflict and change might replace it.**

  3.  **Collapse of Discredited Medical Framework (Replacement was better):**
      *   **Phase 1:** Passes. The story *can* be about historical change/error without being *only* about modern superiority.
      *   **Phase 2 (Q2):** **Caution.** Must avoid "inevitable collapse." Ensure narrative shows *specific historical factors* for the shift (new evidence, changing social attitudes, failed treatments, rival theories gaining ground).
      *   **Phase 2 (Q3):** **FAIL likely (FIX/REWRITE).** Opponents of the old framework probably framed as merely obstructive? Explain their *legitimate role* or beliefs *within the old paradigm*. Why did it persist as long as it did?
      *   **Phase 3 (Q5 & Q6):** **Q5 FAIL (FIX):** Cut "barbaric," "naive," "absurd" applied to old framework. Use neutral terms ("widespread," "influential," "based on humoral theory"). **Q6 PASS/Conditional FIX:** Saying the replacement was an improvement *is* permitted. **BUT:** *Briefly* state *the key historical reason* (e.g., "Germ theory led to measurable drops in surgical infection rates," "Antibiotics cured previously fatal bacterial diseases"). **Crucially:** Explain *why* the old framework failed *historically* (beyond "it was wrong") – e.g., "It failed to explain the patterns of cholera outbreaks revealed by Snow's maps," "Treatments like bloodletting showed no consistent benefit in controlled trials."
      *   **Verdict:** Defensible **if** it avoids caricaturing the old framework, explains its historical persistence and fall *contingently*, and grounds the claim of improvement in specific, contextually explained advances (FIX/REWRITE Narrative/Language).

  ---

  **WHAT THE PROCEDURE CANNOT SETTLE**

  1.  **"Their Questions vs. Our Questions":** The distinction is fundamental but often blurred. Historians debate how far past concerns can be truly recovered or are inevitably filtered through present perspectives. The procedure flags *obvious* impositions of modern questions but can't resolve deep hermeneutic disputes. **Editorial Call:** Does the piece make a *reasonable effort* based on sources to reconstruct historical actors' own frameworks, or is it blatantly projecting? When in doubt, lean towards reconstructing context.
  2.  **The Tension (Flattery vs. Antiquarianism):** The procedure identifies Whiggish "flattery of the present" and helps avoid it. It does *not* mandate "antiquarianism" (mere description without judgment). **Where they pull a draft apart:**
      *   **The Procedure's Role:** It ensures any judgment (e.g., "this was wrong," "this was progress") is *explicit*, *historically grounded*, and doesn't distort the past narrative via inevitability or caricature.
      *   **Editorial Resolution:** The editor must decide:
          *   Is the claim of progress/error *essential* to the piece's purpose and *defensible* within the word count using Phase 3, Q6?
          *   Does the need to avoid Whiggish distortion *override* the desire to make a modern judgment in this specific instance? Can the judgment be made briefly and contextually without derailing the history?
          *   **Priority:** Preventing *distortion of the past* takes precedence over stating modern judgments, unless that judgment is the demonstrable, uncontroversial core of a very specific story (e.g., the medical framework case, handled correctly).
  3.  **Degree of "Wrongness":** The procedure allows saying "this was wrong." It doesn't dictate *how* wrong or how central that wrongness should be to the narrative. `[JUDGMENT]` based on historical significance and editorial focus.
  4.  **Ultimate Significance:** The procedure ensures sound historical method, not that the piece is profound. It prevents distortion; it doesn't guarantee insight. That's commissioning.

  **Final Note:** This is a diagnostic and corrective tool, not a scoring system. Its value lies in forcing explicit consideration of Whiggish traps and providing concrete remedies within journalistic constraints. It shines a light on the weak spots; the editor must still wield the scalpel wisely.
