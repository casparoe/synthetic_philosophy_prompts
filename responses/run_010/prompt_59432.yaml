prompt: |-
  Three years ago I started running a collaborative project that keeps failing in the same way, and I've finally decided the failure is my fault at the planning stage rather than everyone's fault at the writing stage. Here's the pattern. I take one big question, break it into pieces, hand pieces to grad students and postdocs, and stitch the returns back together into a chapter. About half the time the stitched thing is worse than if I'd just thought about it myself for a month, and I can never tell in advance which half. So I want a procedure I can run on a proposed decomposition *before* I commit a year of someone's life to it.

  The idea I keep reaching for comes from the scalable-oversight corner of AI alignment, which I've read a bit of and want you to use but not worship. There's HCH: a human who has a question and can consult copies of themselves, each of whom can consult further copies, with answers passing back up the tree — deployed as an idealization of what someone would conclude if they could think about a question indefinitely with unlimited help from people just like them. And there's factored cognition: the claim that a hard reasoning task can be broken into many small, mostly independent subtasks whose answers recombine into an answer to the big one. What interests me is the thing the idealization quietly assumes away — what has to be true of a decomposition for the top of the tree to get back something it can actually trust, given that the top of the tree is just a tired philosophy professor.

  Write me the procedure. The constraints: my postdoc and I run it together in under an hour, we're the only people who know anything about the alignment literature and she knows less than I do, and the output is one page that goes in the student's file and that I'd have to defend to a co-PI. I get maybe a dozen proposals a term, so it has to be fast, not thorough. Give me the questions to ask in order, what counts as a pass at each, where the procedure terminates in "don't decompose this, go think about it yourself," and where it stops being a procedure and hands the call to me because the question is about values or about how much I trust a particular student. Be blunt about which of your criteria are genuine tests and which are judgment calls wearing a lab coat.

  A few criteria I suspect matter; keep them if they survive scrutiny, kill them if they don't, and tell me which you killed. (1) Verification asymmetry: I should be able to check a returned answer more cheaply than producing it. (2) The subquestion should be answerable by someone who never sees the parent question — if you have to know where it fits to know what would count as answering it, it isn't a subquestion. (3) The recombination rule has to be writable before the answers come back; if I can only figure out how to merge them after reading them, I didn't decompose anything. (4) The load has to actually move, not get renamed — no residual subquestion that is the original question with different words on it. (5) My own job at the top, writing the subquestions and judging the returns, has to be smaller than the original job.

  Also tell me what the procedure inherits from HCH's assumptions, and what happens when they break: the copies are supposed to be faithful to the consulter, the tree is supposed to terminate, and the consulter is supposed to be able to recognize a good answer. In ethics I often can't do that last part without doing the subwork myself, and I want to know whether that's a special problem for normative questions or just me being slow.

  Then run it on three of my actual proposals. (a) Does the principle of alternate purposes — sorry, alternate possibilities — survive determinism? Split into: what does the principle commit you to, what does determinism entail about the past and the laws, and does the second rule out the first? (b) An inventory: what are the live objections to a view I'm defending, who pressed each one, what response was given, and did the objector accept it? Split by objection, one student each. (c) My pet scheme, which I want a straight verdict on even if it's not the one I want: is legal punishment justified, split three ways into retributivism, consequentialism, and expressivism, three students, twenty pages each, and me writing the synthesis chapter.

  Finally, the honest part. Which cases will this procedure systematically misjudge in each direction? I already know about two: the decomposition that passes every test and shouldn't be run, because the point was for the student to come to understand the question and outsourcing it prevents that; and the decomposition that fails every test and should be run anyway, because the subwork is the only way anybody gets into a hard problem at all. Say what the procedure cannot do, and keep the two seperate in your writeup — the part that decides and the part that only flags.
reasoning: |-
  We are designing a fast procedure to evaluate whether a decomposition of a big question into subquestions is likely to succeed when delegated to students/postdocs and then stitched back. The procedure must be run in under an hour by the professor and a postdoc (with limited alignment literature knowledge) and produce a one-page report. The output must be defensible to a co-PI.

  The procedure is inspired by HCH (HCH: [H]ierarchical [C]onsulting [H]uman) and factored cognition, but we focus on the real-world constraints (e.g., the professor is not an infinite tree of copies and has limited time).

  Key constraints from the user:
  - Verification asymmetry: Checking an answer should be cheaper than producing it.
  - Subquestion independence: The subquestion should be answerable without knowing the parent question.
  - Pre-specified recombination: The rule for combining answers must be written in advance.
  - No residual load: The decomposition must not leave a subquestion that is essentially the original question in disguise.
  - Reduced workload: The professor's job (writing subquestions and judging returns) must be smaller than doing the whole task.

  We must also consider HCH's assumptions and what happens when they break:
  1. Faithful copies: In reality, the students may not be perfect copies (they may have different knowledge, biases, etc.).
  2. Tree termination: The tree must end in a finite number of steps (with leaves being questions that can be answered without further decomposition).
  3. Recognition of good answers: The professor must be able to recognize a good answer without doing the work.

  The user suspects that in ethics (normative questions) it might be harder to recognize a good answer without doing the work.

  We will design the procedure as a series of questions (steps) that the professor and postdoc go through. At each step, if the answer is "no", we may terminate early with a "do not decompose" recommendation. The steps are ordered to fail fast.

  **Procedure: Decomposition Feasibility Assessment (DFA)**

  **Step 1: Verification Asymmetry Check**
     - **Question:** For each subquestion, is the cost (in time/effort) to *verify* a returned answer significantly less than the cost to *produce* it? (Significantly: at least 2x cheaper? This is a judgment call, but we need a threshold.)
     - **Pass:** Yes for all subquestions.
     - **Fail:** If any subquestion fails, the decomposition fails at this step. (Because if the professor has to spend nearly as much time checking as the student spent writing, then the workload reduction is not achieved.)
     - **Note:** This is a genuine test. However, the threshold is a judgment call (e.g., 2x is arbitrary but practical). The professor must estimate.

  **Step 2: Subquestion Independence Check**
     - **Question:** Can each subquestion be understood and answered without knowing the parent question? That is, does the subquestion contain all necessary context and constraints?
     - **Pass:** Yes for all subquestions.
     - **Fail:** If any subquestion requires knowledge of the parent to know what counts as an answer, then it fails.
     - **Note:** This is a genuine test. It ensures that the student doesn't have to second-guess the professor's intent.

  **Step 3: Recombination Rule Clarity**
     - **Question:** Can the recombination rule (how to combine the answers to the subquestions into an answer to the main question) be written down clearly in advance, without seeing the answers?
     - **Pass:** Yes, and the rule is specific and unambiguous.
     - **Fail:** If the rule cannot be written in advance, or if it is vague (e.g., "I'll figure it out when I see the answers").
     - **Note:** This is a genuine test. It forces decomposition to be well-defined.

  **Step 4: No Residual Load**
     - **Question:** Is there any subquestion that is essentially the original question in different words? (Check for reworded versions of the main question.)
     - **Pass:** None of the subquestions is a restatement of the main question (or a substantial part of it).
     - **Fail:** If any subquestion is a rephrasing of the main question (or a core part of it) without a clear reduction in scope.
     - **Note:** This is a judgment call. The professor must ask: "If I had to do this subquestion, would it feel like doing the whole thing?" If yes, then it fails.

  **Step 5: Workload Reduction**
     - **Question:** Is the total expected time for the professor (writing subquestions, recombination rule, and verifying all answers) less than the time the professor would spend doing the whole task alone? (And note: the time for stitching the answers together must be included.)
     - **Pass:** Yes, with a comfortable margin (e.g., at least 30% less time? Again, a judgment call).
     - **Fail:** If the professor's time is not reduced (or even increased), then it fails.
     - **Note:** This is a judgment call. The professor must estimate times.

  **Step 6: HCH Assumptions Check (Critical Risks)**
     - This step is about flagging risks due to broken HCH assumptions. It does not automatically fail the decomposition, but it adds warnings to the report.
     - **Question 6a (Faithfulness):** Are the students sufficiently similar to the professor in knowledge and perspective? (If not, their answers might be off.) [Judgment call: if the topic is highly specialized and the students are novices, then high risk.]
     - **Question 6b (Termination):** Are all subquestions answerable without further decomposition? (That is, the tree terminates at the students.) [Genuine test: if a subquestion itself requires decomposition, then the procedure is recursive and we haven't solved it for that subquestion. But note: we are only evaluating the current decomposition. If a subquestion is too big and needs its own decomposition, then this decomposition fails because we haven't broken it down enough. So: if any subquestion is too big to be delegated without further decomposition, then the decomposition fails at this step.]
     - **Question 6c (Recognition):** For each subquestion, will the professor be able to recognize a good answer without doing the work? (This is especially critical for normative questions.) [Judgment call: if the subquestion is about a normative matter and the professor suspects they might have to do the work to know if the answer is right, then flag as high risk.]

  **Termination Rules:**
  - If any of Steps 1-5 fail: The decomposition is rejected. The recommendation is: "Do not decompose. The professor should work on the question alone."
  - If Step 6b fails (a subquestion is too big and requires further decomposition): The decomposition is rejected (because it's incomplete).
  - If Step 6a or 6c flags high risk: This does not automatically fail the decomposition, but it is noted as a risk. The professor must decide whether to proceed (this is handed over to the professor's judgment).

  **Output Report Structure:**
  - One page with:
    1. Decomposition description (briefly).
    2. Results for Steps 1-5 (Pass/Fail and brief comments).
    3. Results for Step 6 (Risks flagged: Faithfulness, Termination, Recognition).
    4. Overall recommendation: "Decompose" or "Do not decompose" (with reasons).
    5. If there are risks from Step 6, they are listed and the professor must acknowledge them.

  **Now, which criteria did we keep?**
  We kept all five criteria from the user. However, note:
  - (1) Verification asymmetry: kept as Step 1 (a genuine test with a judgment call on the threshold).
  - (2) Subquestion independence: kept as Step 2 (genuine test).
  - (3) Recombination rule: kept as Step 3 (genuine test).
  - (4) No residual load: kept as Step 4 (judgment call).
  - (5) Workload reduction: kept as Step 5 (judgment call).

  **HCH Assumptions and Breakdowns:**
  - Inherited: The procedure is built on the idea that if the decomposition is factored appropriately, then the recombination of independently answered subquestions should yield the main answer.
  - When they break:
     - Copies not faithful: In Step 6a, we flag if the students might not be aligned with the professor's expertise/perspective.
     - Tree termination: In Step 6b, we require that the subquestions are atomic (do not require further decomposition).
     - Recognition of good answers: In Step 6c, we flag if the professor might not be able to verify an answer without redoing the work (common in normative questions?).

  **Special Problem for Normative Questions?**
  The user asks: In ethics, they often can't recognize a good answer without doing the work. Step 6c addresses this. This is a special problem for normative questions because the answers often require nuanced value judgments that are not easily verified by a checklist. The procedure will flag such cases as risky, and the professor must decide if they are willing to trust the student's judgment or if the verification cost is too high.

  **Now, apply to the three proposals:**

  **(a) Principle of Alternate Possibilities (PAP) and determinism:**
     - Split into:
          1. What does PAP commit you to?
          2. What does determinism entail about the past and the laws?
          3. Does (2) rule out (1)?

  **DFA Evaluation:**
  - Step 1: Verification asymmetry.
     - Subq1: Verifying a description of PAP commitments? Should be quick (if the professor knows PAP). Pass.
     - Subq2: Verifying the description of determinism? Quick. Pass.
     - Subq3: Verifying the argument about whether determinism rules out PAP? This might be the core of the issue. Verification might require almost as much work as doing it. **Risk: might fail.** (But let's see: the professor may have a clear criterion for what counts as a valid argument. If so, then verification might be checking for logical errors and key points. So maybe pass with caution.)
  - Step 2: Independence.
     - Subq1: Can be answered without knowing the parent? Yes (it's about PAP alone).
     - Subq2: Yes (about determinism).
     - Subq3: This requires knowing the answers to 1 and 2, but the subquestion itself is: "Does the second rule out the first?" which is a logical question. However, the student might need to know the context to avoid misinterpretation. **Risk: might fail** because the answer to subq3 is not independent of the parent? Actually, the subquestion is self-contained: it has two inputs (the commitments of PAP and the entailments of determinism) and asks for a logical relation. But the student must understand the concepts. So if the student is given the outputs of subq1 and subq2, then they can do subq3 without the parent? But note: the decomposition as stated hands each piece to a different student. So subq3 is given to a student who has not done subq1 or subq2? Then they would need the answers to subq1 and subq2 to be provided as part of the subq3 task? That breaks independence. **So: fail Step 2.** The subq3 student must know the outputs of subq1 and subq2 to do their work. But the procedure says: hand pieces to grad students and postdocs independently. Therefore, this decomposition fails Step 2.

     - Alternatively, if the same student does all three, then it's not decomposed. But the plan is to hand each to a different student? Then Step 2 fails because subq3 requires the other two answers.

     **Thus, this decomposition fails at Step 2.**

  - Therefore, we don't need to go further, but for completeness:
     Step 3: Recombination rule? It would be: take the answer to subq1, subq2, and subq3 and then the main answer is the conclusion from subq3. But since Step 2 already failed, overall: **Do not decompose.**

  **(b) Inventory of objections:**
     - Split by objection: one student per objection. Each student answers: what is the objection, who pressed it, what response was given, and did the objector accept it?

  **DFA Evaluation:**
  - Step 1: Verification asymmetry.
     - For each objection, verifying the student's work (that they got the objection, the source, the response, and the acceptance right) should be quick (if the professor is familiar with the objections). Pass.
  - Step 2: Independence.
     - Each objection can be handled independently? Yes, because the objections are separate. The student doesn't need to know the whole view to report on one objection. Pass.
  - Step 3: Recombination rule.
     - How to combine? The rule: compile all the objections and the answers into a list (perhaps organized by theme or chronology). This can be written in advance. Pass.
  - Step 4: No residual load.
     - Each subquestion is a factual report about one objection. Not the main question (which is an inventory). Pass.
  - Step 5: Workload reduction.
     - The whole task: the professor would have to compile all objections. With n objections, each taking time T, the professor would spend n*T. With decomposition: each student does one (taking T each). The professor verifies each in (say) T/3? And then compiles (which is quick, since it's just gathering). Total professor time: n*(T/3) + compilation. Compared to n*T: so about 1/3 the time? Pass (if compilation is negligible).
  - Step 6: HCH assumptions.
     - 6a: Students may not know the objections? But they can research. The professor must trust their research skills. Moderate risk (if the objections are obscure, then students might miss nuances). Flag as risk.
     - 6b: Termination: Each subquestion is a factual report? It should be answerable without decomposition. Pass.
     - 6c: Recognition: The professor can verify by checking the sources? Pass (low risk).

  Overall: **Passes all steps, with a risk in 6a (faithfulness).** The report would recommend decomposition but flag the risk that students might not capture the objections accurately.

  **(c) Legal punishment justified? Split into retributivism, consequentialism, expressivism.**
     - Three students, each writes 20 pages on one theory and whether it can justify legal punishment. Then the professor writes a synthesis.

  **DFA Evaluation:**
  - Step 1: Verification asymmetry.
     - Verifying a 20-page essay on one theory? The professor would have to read it carefully and check arguments. This could take almost as long as writing it (if not longer). **Fail.** (Verification cost is high.)

     So already fails. But we'll check the others for learning.

  - Step 2: Independence.
     - Each student writes on one theory. They don't need to know the parent question? Actually, the subquestion is: "Can retributivism justify legal punishment?" This is a standalone question. Pass.
  - Step 3: Recombination rule.
     - The rule might be: Compare and contrast the three theories and then draw a conclusion about the justification of legal punishment. But the rule is vague? How to synthesize? It might require weighing the theories. This is hard to pre-specify. **Risk: fail.** But the user says "me writing the synthesis chapter" — so the recombination is not pre-specified? The rule isn't written in advance. The professor will write the synthesis after seeing the essays. So Step 3 fails because the recombination rule cannot be written in advance without seeing the answers? (The rule would be: take the three essays and then the professor writes a synthesis. But that's not a rule that produces the answer from the subanswers; it's the professor doing extra work.) So **fail Step 3.**
  - Step 4: No residual load.
     - Each subquestion is a major theory of punishment. They are not the whole question? But note: the whole question is "is legal punishment justified?" and each subquestion is "can theory X justify it?" — which is a large part of the whole. However, it's a reduction. But the synthesis is still the core. This is a judgment call: the professor might feel that after reading the three essays, the hard work of synthesis remains. So **fail Step 4?** (But we already have fails at Steps 1 and 3, so it's redundant.)
  - Step 5: Workload reduction.
     - The professor would have to write the whole thing (say 60 pages). With decomposition: verifying three 20-page essays (which we estimated as high cost) and then writing a synthesis (say 20 pages). Total professor time: verification (about 20 hours each? 60 hours) plus writing (20 hours) = 80 hours. Doing it alone: 60 hours? So workload increases? **Fail.**
  - Step 6: HCH assumptions.
     - 6a: Students may interpret the theories differently? High risk.
     - 6b: Termination: Each subquestion is a 20-page essay? It might be too big and need decomposition? But the plan is to delegate the whole theory to one student. So it terminates? Pass.
     - 6c: Recognition: The professor can verify without redoing? In normative theory, they might have to think through the arguments. High risk.

  Overall: **Fails Steps 1, 3, 5, and possibly 4.** Do not decompose.

  **The Honest Part:**
  The procedure will systematically misjudge in two ways:

  1. **False Positives (passes the test but shouldn't be run):** 
     - The decomposition might pass all the tests, but the point of the project was for the student to engage with the whole question (e.g., to develop a holistic understanding). By decomposing, the student only sees a part and misses the big picture. This is especially true for educational goals. The procedure does not capture educational value.

  2. **False Negatives (fails the test but should be run anyway):**
     - The decomposition might fail the tests, but the problem is so hard that no one person can tackle it alone. Breaking it up (even imperfectly) is the only way to make progress. The procedure is risk-averse and might reject decompositions that are necessary for exploratory work.

  **What the Procedure Cannot Do:**
  - It cannot account for non-instrumental values (like the educational value for the student).
  - It cannot measure the potential for innovation or serendipity in decomposition (e.g., a student might find a new angle that redefines the problem).
  - It is optimized for efficiency and reliability, not for exploration or learning.

  Therefore, the procedure is a **flagging system** for the most common pitfalls in decomposition. The final decision must be made by the professor, considering factors beyond the procedure (like educational goals or the necessity of decomposition for intractable problems). The one-page report should clearly separate the decision (pass/fail based on Steps 1-5) from the flagged risks (Step 6) and the professor's discretionary factors.
answer: |-
  Below is a **Decomposition Feasibility Screener (DFS)**, a 30-60 minute procedure to evaluate whether a research question can be effectively decomposed for collaborative work. It's designed for speed, clarity, and defensibility, with explicit pass/fail criteria inspired by HCH/factored cognition ideals but grounded in real-world constraints. The output is a one-page report for the student's file.

  ---

  ### **Decomposition Feasibility Screener (DFS)**
  **Run with your postdoc in this order. Terminate early if any step fails.**  
  **Time:** 5-10 min per step. Total: 30-60 min.  
  **Output:** One-page report with:  
  - Step outcomes (✓/✗ + brief rationale).  
  - Overall recommendation (✅ Decompose / ❌ Do Not Decompose).  
  - Risk flags (if proceed).  

  #### **Step 1: Independence Test**  
  **Question:** *Can each subquestion be answered fully without knowing the parent question or other subquestions?*  
  - **Pass:** Subquestions are self-contained (e.g., "Summarize Kant's view on retribution" passes; "Assess if determinism invalidates PAP" fails if the student needs your PAP definition).  
  - **Fail:** Any subquestion requires context from the parent or sibling tasks.  
  - **Why?** Violates factored cognition’s core premise. Forces students to guess intent → unreliable returns.  
  - **Terminate if fail:** ❌ Do Not Decompose.  

  #### **Step 2: Recombination Rule Test**  
  **Question:** *Can you write an unambiguous rule to combine subanswers into the final answer, right now?*  
  - **Pass:** Rule is concrete and executable pre-return (e.g., "Contradiction if subQ3 = 'yes' and subQ1 = 'no'").  
  - **Fail:** Rule requires reading subanswers first (e.g., "I’ll synthesize after seeing arguments").  
  - **Why?** If recombination isn’t predefined, decomposition is theater. You’re just farming out literature reviews.  
  - **Terminate if fail:** ❌ Do Not Decompose.  

  #### **Step 3: Verification Asymmetry Test**  
  **Question:** *For each subquestion, can you verify a returned answer in ≤30% of the time it takes to produce it?*  
  - **Pass:** All subquestions have clear verification shortcuts (e.g., checking citations vs. writing 20 pages).  
  - **Fail:** Any subquestion requires >30% effort to verify (e.g., normative claims needing full rework).  
  - **Why?** Your bottleneck is time, not labor. If verification eats your gains, decomposition backfires.  
  - **Judgment call:** Threshold is arbitrary but pragmatic. Adjust based on task (e.g., ethics often fails here).  
  - **Terminate if fail:** ❌ Do Not Decompose.  

  #### **Step 4: Load Reduction Test**  
  **Question:** *Is your total work (writing subQs + verifying + recombining) ≤50% of doing the task alone?*  
  - **Pass:** Estimated time savings are significant (e.g., 10h total vs. 40h solo).  
  - **Fail:** Your workload approaches or exceeds solo effort.  
  - **Judgment call:** Requires honest time estimates. Include stitching/rework risk.  
  - **Terminate if fail:** ❌ Do Not Decompose.  

  #### **Step 5: Residual Load Check**  
  **Question:** *Is any subquestion a rewording of the parent question?*  
  - **Pass:** No subquestion mirrors the parent’s core complexity (e.g., "Is punishment justified?" split into "Is retribution justified?" fails).  
  - **Fail:** A subquestion is the original task in disguise.  
  - **Judgment call:** Does the subQ *feel* like the parent? If yes, it’s residual load → fail.  
  - **Terminate if fail:** ❌ Do Not Decompose.  

  #### **Step 6: Risk Flags (HCH Assumptions)**  
  **Question:** *Where might HCH’s ideals break?* (Does not cause failure; adds warnings to report).  
  - **6a (Faithfulness):** Are students reliable "copies"? (✓ if topic fits their expertise; ✗ if novices).  
  - **6b (Termination):** Can subanswers be trusted without recursion? (✓ if atomic tasks; ✗ if vague).  
  - **6c (Recognition):** Can you spot a bad answer without redoing work? (✓ for factual tasks; ✗ for normative/ambiguous).  
  - **Output:** Flags only. Proceed with caution if flagged.  

  **Final Output:**  
  - ✅ **Decompose** if all Steps 1-5 pass.  
  - ❌ **Do Not Decompose** if any Step 1-5 fails.  
  - **Risks:** List flags from Step 6.  

  ---

  ### **What Survived vs. Killed from Your Criteria**  
  - **Kept:**  
    - **(2) Independence (Step 1):** Genuine test. Non-negotiable for factoring.  
    - **(3) Recombination rule (Step 2):** Genuine test. Prevents "synthesis surprises."  
    - **(1) Verification asymmetry (Step 3):** Genuine test with judgment threshold.  
    - **(4) No residual load (Step 5):** Judgment call wearing a lab coat.  
    - **(5) Load reduction (Step 4):** Judgment call. The 50% threshold is arbitrary but forces cost awareness.  
  - **Killed:** None. All criteria are useful, but **(4)** and **(5)** are softer checks.  

  ---

  ### **HCH Inheritance and Breakdowns**  
  The DFS assumes HCH’s ideal: decompositions work if subtasks are **independent**, **verifiable**, and **recombinable**. When reality breaks this:  
  - **Unfaithful "copies" (Step 6a):** Students aren’t you. Risk: Answers diverge from your intent. Mitigation: Only delegate tasks matching their expertise.  
  - **Non-termination (Step 6b):** Subquestions might need their own decomposition. Risk: Infinite regress. Mitigation: Atomic subtasks only.  
  - **Unrecognizable answers (Step 6c):** Critical for normative work (e.g., ethics). If you can’t verify without redoing work, decomposition fails (Step 3). **This is a universal problem, not just you being slow.** Normative questions often fail verification asymmetry because "correctness" requires holistic judgment.  

  ---

  ### **Application to Your Proposals**  
  #### **(a) PAP vs. Determinism**  
  - **Split:** What PAP commits to (Q1), what determinism entails (Q2), does Q2 rule out Q1? (Q3).  
  - **DFS Verdict:** ❌ Do Not Decompose.  
    - **Step 1 (Independence):** ✗ Fail. Q3 *requires* Q1/Q2 outputs → not independent.  
    - **Step 2 (Recombination):** ✗ Fail. Rule ("if Q3=yes, PAP fails") is predefined, but Q3 depends on Q1/Q2 → recombination is moot.  
    - *Stop here. No need to check further.*  

  #### **(b) Objection Inventory**  
  - **Split:** Per objection: source, response, objector’s acceptance.  
  - **DFS Verdict:** ✅ Decompose (with risk flags).  
    - **Step 1:** ✓ Pass. Each objection standalone.  
    - **Step 2:** ✓ Pass. Rule: "Compile all into a table."  
    - **Step 3:** ✓ Pass. Verify by spot-checking sources (asymmetric).  
    - **Step 4:** ✓ Pass. Your work: write subQs + verify + compile << researching all objections.  
    - **Step 5:** ✓ Pass. No residual load.  
    - **Step 6:** ✗ Flag 6a (if students miss nuance), 6c (if "acceptance" is interpretive).  

  #### **(c) Legal Punishment Justification**  
  - **Split:** Retributivism (Q1), consequentialism (Q2), expressivism (Q3).  
  - **DFS Verdict:** ❌ Do Not Decompose.  
    - **Step 1:** ✓ Pass. Theories are independent.  
    - **Step 2:** ✗ Fail. Recombination rule can’t be predefined (e.g., "weigh theories" is vague).  
    - **Step 3:** ✗ Fail. Verifying 20-page normative essays ≈ rewriting them.  
    - **Step 4:** ✗ Fail. Your work (verify 60pp + synthesize) >> writing 60pp alone.  
    - **Step 5:** ✗ Fail. Each subQ is residual load (e.g., "Is retribution justified?" ≈ parent question).  

  ---

  ### **The Honest Part: What DFS Can’t Do**  
  **1. False Positives (Passes but shouldn’t run):**  
     - DFS will approve decompositions that *technically* work but **undermine student growth**. Example: An inventory (proposal b) passes, but if the goal is for students to *understand the big picture*, outsourcing atomic tasks prevents that.  
     - **Why?** DFS is efficiency-focused, not pedagogical. It can’t measure educational value.  

  **2. False Negatives (Fails but should run anyway):**  
     - DFS will reject decompositions that are **necessary for exploration**. Example: A vague recombination rule (Step 2 fail) might be unavoidable for cutting-edge work, but delegating subquestions is the only way to *start*.  
     - **Why?** DFS prioritizes reliability over exploration. It flags risks but can’t justify "gambles."  

  **The Gap:**  
  - **DFS decides** whether decomposition is *efficient and reliable* for your workload.  
  - **DFS only flags** whether it’s *safe* (HCH risks) or *pedagogically sound*.  
  **You must manually override** for:  
    - **Educational goals:** Decompose even if efficient, to train students in synthesis.  
    - **Intractable problems:** Decompose even if messy, to make progress.  

  **Final Advice:** Use DFS to filter clear failures (e.g., your PAP and punishment proposals). For passes (e.g., inventory), ask: "Will this teach what I want?" For failures, ask: "Is decomposition the only path forward?" This balances rigor with wisdom.
