  Our group does taxonomy work on substellar objects and there's a running fight about the deuterium-burning line near 13 jupiter masses. My PI keeps reaching for the old image — a good classification carves nature at its joints, a bad one hacks at the flesh — and he uses it in a specific way: since substellar objects shade continuously from planets through brown dwarfs into stars, there are no joints in that region, so any line we draw is convention dressed up as discovery, and the paper should say so. A postdoc says whats broken is the metaphor, not the taxonomy: it presupposes an articulated skeleton, and continua can have real structure without joints, the way a landscape has watersheds or an atmosphere has isobars.

  Can you audit the joints image for me? Lay out the mapping — what's the animal, what are the joints, what's the knife, what does butcherly skill correspond to, and what makes a bad cut recognisable as bad — then say which commitments it smuggles in that a mass continuum doesn't supply. Does his conclusion survive once the disanalogies are on the table, or was the metaphor carrying the whole argument? And if the postdoc is right, give me a better image for structure-without-joints, plus one honest way that image could mislead in its turn.

  Bottom line first, then a compact mapping table, then the rest. Under 700 words total.
