prompt: |-
  So our school has this unofficial thing where like six of us stay in Mr. Okonkwo's room after school on Thursdays and read philosophy that isn't in any of our actual classes. This semester we've been slogging through Wittgenstein's On Certainty, the pile of notes he wrote toward the end of his life, where he's basically picking apart Moore's trick of holding up his hands in front of an audience and announcing he's proved there's an external world. Last week two of the regulars, Dev and Mara, had an arguement that went way past the point where the rest of us could follow it, and I left not knowing who actually won. You're the right one to ask: pretend you're a professional epistemologist who has taught On Certainty to undergrads a bunch of times and who isn't scared to tell one of them they're wrong. Take your time and think carefully — maybe start with a few lines of brainstorming about what's really at stake before you hand down any verdicts.

  Here's the exchange, as close to how it went as I can remember. (1) Mara said Wittgenstein's whole point is that the skeptic hasn't lost an argument, he's tried to play a game that can't be played — hinge propositions aren't the kind of thing you can know or doubt, they're what makes knowing and doubting possible at all, so the brain-in-a-vat question is a malfunction of the practice rather than a challenge to it, and you can defeat skepticism without ever answering it. (2) Dev said that's an escape hatch, not an answer: if hinges are just what a community happens to do, then a community whose hinge is that the village oracle's pronouncements are beyond question is internally every bit as secure as ours, and Wittgenstein has no way to say they're worse off, so the view collapses into relativism. Worse, he said Wittgenstein wants it both ways — he wants to say the skeptic is making a mistake, but also that there's no fact of the matter that a hinge could get wrong. (3) Mara said hold on, hinges aren't all equally entrenched, and she has this idea she calls revocation cost, which is roughly how much of everything else you'd have to throw out if you dropped a given hinge. Ours about the earth having existed long before we were born costs nearly everything else; the skeptic's alternative costs nothing and buys nothing. So you can compare hinge systems by cost, and that's why it isn't anything-goes. (4) Dev said that's circular, because cost gets measured in terms of what you'd lose, and "lose" already assumes your standards — plus expensiveness isn't a mark of truth, since a deeply embedded conspiracy belief has a huge revocation cost and is still flatly false. At best she's explained why hinges are hard to give up, not why any of them are right. He also threw in a counterexample: for centuries basically everyone in Europe treated the idea that sickness comes from foul air as beyond question, it functioned exactly like a hinge, and it was simply wrong — which shows hinges can be mistaken and the skeptic's question isn't automatically broken. (5) Mara's reply was that foul air was never a hinge, it was an empirical theory wearing hinge clothing, and you can tell the difference by whether anybody inside the practice could actually doubt it: if they could doubt it, it wasn't a hinge. Dev said that just defines his counterexample out of existence, and by that rule nothing could ever count as a false hinge, wich makes it a theory that can't be wrong.

  Please work through it move by move: rate each of the five numbered bits (clearly wrong / mostly wrong / mixed / mostly right / clearly right, or whatever scale you like) and say briefly why, being specific about which part of the move earns the rating instead of grading the whole thing at once. Then tell me who's more right overall, and whether Mara's revocation-cost idea can be repaired into something that actually answers Dev's circularity charge or whether his foul-air counterexample is fatal to it. Also — and I care about this as much as the ratings — tell me what both of them are missing, because I had a feeling the entire time that they were arguing about the wrong thing, like maybe there's a difference between one person's hinges and a whole community's hinges that neither of them used, or maybe they both keep treating hinges as sentences that could be true or false when that's supposedly the exact thing Wittgenstein is denying. Don't hedge and don't split the difference down the middle just to be nice, and don't bother name-dropping other philosophers or giving me a reading list — I'm on a bus with no internet and couldn't look any of it up anyway.
