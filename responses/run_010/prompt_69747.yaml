answer: |-
  Here’s your preparation, structured as requested. Objections are ranked by (likelihood × damage), with #1 being the most critical to anticipate.

  ---

  ### 1. **The Thesis Under Pressure**  
  *Opponent’s Attack:* "You claim Harsanyi’s theorem, stripped of common beliefs, reveals a *single* weight vector solving two distinct aggregation problems (beliefs via linear pooling, utilities via weighted sum) without interpersonal comparability. This rests on:  
  - **Premise 1:** Unanimity in *both* beliefs and utilities (Pareto over lotteries *and* events). Without this, the weights need not align.  
  - **Premise 2:** Representing the social observer with a *single* vNM rational preference. If we allow non-expected utility social preferences, the duality collapses.  
  - **Premise 3:** A *static* framework. In dynamic settings, linear pooling violates conditionalization, forcing separate belief weights.  
  Your ‘double duty’ is thus an artifact of restrictive axioms and ignores how real aggregation operates."  

  ---

  ### 2. **The Room**  
  - **Mathematical Social Choice (2/3):** Care about axiomatic rigor, characterization theorems, and opinion pooling dynamics. A satisfying answer *for them* shows how your view resolves a technical gap (e.g., why weights cohere statically) or reveals new structure in existing results.  
  - **Philosophers of Economics (1/3):** Focus on welfare metaphysics, interpersonal comparability, and Harsanyi’s normative force. They’ll demand clarity on whether your "one weight" avoids comparability *or* smuggles it in. A satisfying answer disentangles aggregation mechanics from welfare ontology.  
  - **Committed Prioritarian:** Rejects utilitarianism’s indifference to distribution. Needs assurance your "weight vector" isn’t utilitarianism resurrected. A satisfying answer concedes Harsanyi’s setup *is* structurally utilitarian but argues your reframing exposes its fragility.  
  - **Bayesian Statistician:** Prioritizes dynamic coherence (pooling that commutes with updating). Will dismiss static results as irrelevant. A satisfying answer must either reconcile "one weight" with updating or concede its limitations while defending its conceptual insight.  
  - **Overlooked Group:** **Formal Epistemologists** (likely present). They’ll challenge whether belief aggregation *should* obey linear pooling (e.g., dilation objections) and question conflating epistemic + welfare aggregation.  

  ---

  ### 3. **The Objections, Ranked**  
  *(Likelihood × Damage: 1=highest, 8=lowest)*  

  **#1: Social Choice Theorist**  
  *Idiom:* "Your ‘double duty’ is just a restatement of Mongin’s 1995 observation that Pareto over lotteries *and* certainty equivalents implies shared weights. Why is this ‘the real content’?"  
  *Targets:* Thesis novelty; implies you’re repackaging known results.  
  *Reply (2-min):* "Mongin *assumes* common beliefs to derive utilitarianism. I drop that: no shared beliefs exist, yet Pareto in *both* dimensions *still* forces aligned weights. This shows the alignment isn’t an artifact of common beliefs—it’s a deeper constraint of unanimity in vNM rationality. The theorem’s surprise is that *two* aggregation problems collapse into *one* under minimal Pareto."  
  *Soft Spot:* Must concede Mongin’s work is foundational but stress that the *interpretation* (weights as metaphysically prior to comparability) is new.  

  **#2: Philosopher of Economics**  
  *Idiom:* "If the weights aren’t fixed by comparability, what *does* determine them? Your ‘one weight’ feels empty—it could encode bias, not welfare!"  
  *Targets:* Normative relevance; implies the weights are arbitrary.  
  *Reply:* "The weights are determined *only* by the Pareto condition across beliefs *and* utilities—no independent welfare facts needed. This *exposes* a problem: Harsanyi’s utilitarianism doesn’t ‘solve’ aggregation; it outsources the hard work to an unconstrained weight vector. The takeaway isn’t that weights *are* welfare, but that Pareto + vNM rationality *alone* cannot deliver a substantive theory of aggregation."  
  *Soft Spot:* Concedes weights lack normative foundation; risks making the theorem seem vacuous.  

  **#3: Bayesian Statistician**  
  *Idiom:* "Linear pooling isn’t dynamically coherent. If beliefs update, your ‘single weight’ forces the observer to violate Bayes’ rule. So your ‘single problem’ dissolves under learning."  
  *Targets:* Static framework; undermines "one weight" as general.  
  *Reply:* "Agreed—but that’s precisely why the static case is instructive. Dynamic incoherence *reveals* that the ‘double duty’ weights are fragile: they’re a consistency condition only for snapshots. This forces us to ask: *Why* does Harsanyi’s static setup cohere at all? It’s not about timeless aggregation but about the tension between unanimity and learning."  
  *Soft Spot:* Grants the objection cripples practical use but defends conceptual value.  

  **#4: Prioritarian**  
  *Idiom:* "Even with your spin, the social utility is still a *linear* sum. Doesn’t this ignore distributional concerns?"  
  *Targets:* Utilitarian structure; implies your view inherits its flaws.  
  *Reply:* "Yes—but crucially, the weights aren’t justified by interpersonal comparisons. They’re an arbitrary byproduct of Pareto + vNM. This *weakens* Harsanyi: it shows utilitarianism isn’t derived from rationality alone but from an unmotivated alignment of belief/utility aggregation. Prioritarians should exploit this: reject the unanimity axiom on beliefs, not utilities."  
  *Soft Spot:* Still endorses linear utility aggregation; prioritarians want nonlinearities.  

  **#5: Social Choice Theorist (Follow-Up)**  
  *Idiom:* "If beliefs aren’t common, why assume the observer must have *precise* probabilities? Imprecise probabilities avoid linear pooling."  
  *Targets:* Premise 2 (single probability measure).  
  *Reply:* "Harsanyi’s theorem *requires* a vNM social observer, which implies precise probabilities. Imprecise models are richer but change the framework. My point is that *within Harsanyi’s axioms*, dropping common beliefs *still* forces weight alignment—highlighting how restrictive vNM rationality is."  
  *Soft Spot:* Must defend vNM as the "standard" setup; dismissive of alternatives.  

  **#6: Philosopher (Welfare Focus)**  
  *Idiom:* "Your ‘bypassing comparability’ is sleight-of-hand. To interpret utilities as *well-being*, we need comparability. Otherwise, it’s just math."  
  *Targets:* Deflationary angle; implies your view doesn’t engage welfare economics.  
  *Reply:* "Exactly! The math *never* provided comparability—classical utilitarians misread it. The theorem only says: ‘If you demand Pareto in beliefs and utilities, you get one weight vector’. Whether those weights *should* represent welfare is a separate, unanswered question. This refocuses debate on the axioms, not the phantom of ‘provable’ comparability."  
  *Soft Spot:* Risks alienating philosophers seeking welfare-theoretic insights.  

  **#7: Formal Epistemologist**  
  *Idiom:* "Belief aggregation should track truth, welfare aggregation fairness. Conflating them via ‘one weight’ is category confusion."  
  *Targets:* Conflation of epistemic/normative; undermines coherence.  
  *Reply:* "I’m not endorsing the conflation—I’m showing Harsanyi’s axioms *force* it. If you insist on belief unanimity (an epistemic norm) *and* utility unanimity (a normative norm), you get one weight vector doing both. The theorem warns against demanding unanimity in incompatible domains."  
  *Soft Spot:* Doesn’t resolve *why* these domains are incompatible; may seem pedantic.  

  **#8: Social Choice Theorist (Technical)**  
  *Idiom:* "What if weights are zero for some agents? Or if utility differences are state-dependent?"  
  *Targets:* Edge cases; tests robustness.  
  *Reply:* "Zero weights violate strict Pareto unless all agents are indifferent. State-dependent utilities break the vNM framework—Harsanyi assumes state-independence. Within the theorem’s scope, these aren’t issues."  
  *Soft Spot:* Hand-waves state-dependence; niche but valid critique.  

  ---

  ### 4. **Concede Up Front**  
  Grant:  
  - Harsanyi’s original theorem *assumed* common beliefs; you’re exploring a variant.  
  - Linear pooling *is* dynamically incoherent—your "double duty" is static-only.  
  - The utilities aggregated are vNM *representations*, not necessarily well-being.  
  - The weights *are* arbitrary absent further constraints (e.g., symmetry).  

  ---

  ### 5. **The Load-Bearing Reply**  
  *<30 seconds; must land>*  
  "The theorem’s core isn’t utilitarianism or deflationism—it’s a *constraint*: Unanimity in beliefs *and* utilities under vNM rationality *forces* a single weight vector to handle both. This weight isn’t ‘measuring’ welfare; it’s a mathematical artifact of demanding two kinds of Pareto at once. The big question isn’t ‘what do utilities mean?’ but ‘why must *one* weight do *two* jobs?’—and Harsanyi never answers that."  

  ---

  ### 6. **The Question I Hope Nobody Asks**  
  *Objection:* "If we drop state-independent utilities (e.g., health affects risk attitudes), doesn’t your ‘bypassing comparability’ collapse? State-dependence requires interpersonal comparisons to normalize scales across states."  
  *Why Hardest:* It targets your core claim ("no comparability needed") by showing state-dependent utilities—common in welfare contexts—force comparability *back in*.  
  *Least-Evasive Response:*  
  "Acknowledge this is a real problem. State-dependent utilities *do* require cross-state comparability to aggregate meaningfully. Harsanyi’s framework excludes this, which is a limitation. My point holds only within his state-independent vNM world. But even there, the ‘double duty’ of weights is distinct from comparability: weights align *before* we ask what utilities represent. State-dependence adds another layer, but it doesn’t resolve why belief and utility weights coincide."  

  ---

  ### 7. **Two Sentences for the Close**  
  "Harsanyi’s theorem doesn’t ground utilitarianism or dissolve it—it reveals a hidden coupling. When beliefs aren’t given, demanding unanimity forces one weight vector to serve two masters, exposing aggregation as a tighter bind than we knew."  

  ---  
  *No bibliography included. Vocabulary aligned with specified audience.*
