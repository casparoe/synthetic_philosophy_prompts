prompt: |-
  I work in the grants office of a national arts council, and I have been asked to write the internal review of our main open-access funding instrument ahead of its triennial renewal. Before I write a single line of recommendation, I want to understand what the instrument is actually committed to, because I have become unable to explain its structure to people outside the organization without sounding evasive.

  Applications are scored by two panels whose marks are then combined by a simple average. The Artistic Merit panel is drawn from practising artists and critics; its guidance tells assessors to weigh craft, ambition, originality, and the internal coherence of the proposed work with the applicant's stated intention, and it expressly forbids them from taking any account of projected audience size, ticket prices, the demographic composition of the audience, or any social, educational, or health outcome. The Reach panel is drawn from social researchers and community organizers; its guidance tells assessors to weigh projected participation numbers, the socio-economic and geographic breadth of the audience, evidence of first-time attenders, and self-reported measures of belonging and wellbeing collected by a standard post-event survey, and it expressly forbids them from considering the artistic quality of the work. Two further rules complete the picture. Our founding charter contains a neutrality clause under which the council may not pronounce on the value of any particular artwork, only on the value of programmes and organizations. And every applicant must complete a short field in which they state, in one sentence, the feeling they intend the work to leave its audience with; that sentence is never scored for accuracy or sincerity, but the application is inadmissible unless it can be mapped onto one of eight approved outcome categories: wonder, pride, consolation, solidarity, delight, unease, curiosity, and remembrance.

  A colleague on the policy team insists that the averaging rule is nothing but a political settlement between two constituencies and should not be read as expressing any view at all. I want to know whether she is right, or whether the settlement itself has a philosophical shape. My suspicion comes from having recently read Tolstoy's late treatise on art, where art is treated as a means by which one person transmits a felt experience to others through outward signs, and where a work is graded both by how well the transmission succeeds and, decisively, by the worth of the feeling transmitted, measured against the moral and religious consciousness of the age. I cannot shake the impression that our instrument is a partial and possibly incoherent implementation of something like that picture, one that keeps the machinery of transmission and throws away the evaluation.

  Please address the following. First, reconstruct the theory of artistic value the instrument presupposes: for the average of two panel scores to mean anything, what must be assumed about the relation between merit and reach? Are they genuinely distinct and irreducible goods, is one a proxy for the other, or is the averaging a device for distributing blame rather than for measuring value? Second, identify which rival accounts of art the rules quietly exclude, and which they could accommodate with no change to the text at all; pay particular attention to the neutrality clause, and say whether it commits the council to the view that there are no facts about the value of particular artworks or merely to the view that a public body must not act as if it knew them, and whether the panels' actual behaviour lets us tell those two readings apart. Third, evaluate the feeling-sentence field against Tolstoy: which of his conditions on successful transmission, if any, does it capture, and which does the eight-category list suppress? Can a post-event report of raised wellbeing or belonging distinguish a work that infected its audience with what Tolstoy would count as a good feeling from one that infected them just as thoroughly with a bad one, and does the approved category list presume that the moral differences among feelings have already been settled, or that they are simply beside the point of a funding decision? Fourth, mark explicitly where the instrument is underdetermined, that is, where several incompatible theories of art would license exactly these rules and nothing else. Finally, sketch what a sincerely Tolstoyan replacement would look like: what the panels would be, what each would be forbidden to consider, what would become of the neutrality clause, and which categories of currently funded activity would become unfundable; then say whether the council's stated public purposes would be better or worse served by it, and whether my colleague's deflationary reading survives the exercise.
reasoning: |-
  Okay, I need to tackle this complex query from someone in a national arts council. They're reviewing their funding instrument and are concerned about its philosophical underpinnings. Let me unpack their situation step by step.

  First, the user describes a dual-panel system: Artistic Merit and Reach panels with strictly separated criteria. The Artistic Merit panel focuses purely on craft, ambition, originality and internal coherence, explicitly ignoring audience or social impact. Conversely, the Reach panel only considers participation numbers, audience diversity, and self-reported wellbeing, ignoring artistic quality. Scores are averaged.

  Key constraints include:
  - A neutrality clause prohibiting value judgments on specific artworks
  - Mandatory "feeling statement" mapped to 8 approved categories

  The user suspects this structure might reflect Tolstoy's transmission theory of art (where value comes from successfully transmitting morally worthy feelings), but worries it's an incoherent implementation that discards moral evaluation. 

  Their colleague claims the averaging is just political compromise without philosophical meaning. The user wants to know:
  1. What theory of artistic value does this presuppose?
  2. Which art theories does it exclude/accommodate?
  3. How does the feeling statement compare to Tolstoy?
  4. Where is the system underdetermined?
  5. What would a truly Tolstoyan system look like?

  Hmm... this requires careful philosophical analysis. The user is clearly well-read (they reference Tolstoy's "What Is Art?") and frustrated by having to defend a system they don't fully understand. Their deeper need seems to be: "How can I justify this structure intellectually rather than just calling it political compromise?"

  Let me approach their questions systematically:

  First question: What theory of value underpins averaging merit and reach?
  - The system treats them as distinct goods (non-reducible) since panels are forbidden from considering each other's domains
  - Averaging suggests they're equally important but incommensurable - like adding apples and oranges
  - Political interpretation isn't wrong, but the structure does imply a philosophy: value is dualistic (intrinsic artistic worth + instrumental social benefit)
  - Tolstoy would reject this separation since for him, transmission of moral feeling is the ONLY value

  Second question: What theories does this exclude?
  Excluded:
  - "Art for art's sake" (denies social utility matters)
  - Purely instrumental views (denies intrinsic artistic value)
  - Strong moralism (neutrality clause avoids judging content)
  Accommodated:
  - Institutional theories (art is what the art world says it is)
  - Weak moralism (if feelings map to "good" categories)

  The neutrality clause is ambiguous between epistemological humility ("we can't know artistic value") vs institutional restraint ("we shouldn't say even if we know"). The panels' behavior suggests the latter - they DO make artistic judgments but bracket them.

  Third question: Feeling statement vs Tolstoy
  - Captures Tolstoy's "intended feeling" element
  - But suppresses his moral evaluation: all 8 categories are treated as equally valid
  - Wellbeing surveys can't distinguish "good" from "bad" transmission (e.g., pride in community vs pride in hatred)
  - Categories presume moral differences are settled (but are they?) or irrelevant (which Tolstoy would hate)

  Fourth: Underdetermination
  Multiple theories could produce these rules:
  - Value pluralism (art has multiple irreducible goods)
  - Democratic pragmatism (balance elite + populist views)
  - Bureaucratic safety (avoid controversial judgments)

  Fifth: Tolstoyan alternative
  - Single panel evaluating: 1) technical competence, 2) infectiousness, 3) moral worth of feeling
  - Neutrality clause abolished
  - "Bad feeling" art defunded (e.g., works promoting xenophobia)
  - Might better serve public purposes if moral consensus exists... but high risk of bias
  - Colleague's "just politics" view survives because Tolstoyan system would ALSO face political pressures

  The user's frustration makes sense - the system tries to please everyone by avoiding hard questions about art's purpose. A Tolstoyan approach would be more coherent but riskier for a public institution. 

  I should emphasize that while the current system isn't philosophically pure, its ambiguities might be its strength in a pluralistic society. The key is recognizing what trade-offs are being made.
answer: |-
  Your instrument embodies a sophisticated but tension-laden philosophy of artistic value. Let's reconstruct its implicit theory, test it against alternatives (especially Tolstoy), and evaluate its coherence.

  ### 1. **Theory of Artistic Value Presupposed by the Averaging Rule**  
  The instrument treats *Artistic Merit* (AM) and *Reach* (R) as **distinct, incommensurable, and additive goods**. This implies:  
  - **Non-Reductionism**: AM is neither a means to R, nor vice versa. A brilliant but obscure work (high AM/low R) and a shallow but popular work (low AM/high R) are both partial failures.  
  - **Equivalence of Scales**: Averaging assumes both scores occupy the same normative space (e.g., 0–10 "units of value"), despite measuring unrelated dimensions.  
  - **Political Settlement as Philosophy**: Your colleague is half-right. The rule *is* a compromise, but it formalizes a pluralist theory: **art’s value = intrinsic aesthetic properties + instrumental social impact**. By forbidding panels from crossing domains, the system asserts these are *separate* responsibilities of art.  
  - **Distributing Blame?**: While politically expedient, the structure *does* measure value—just a composite one. It distributes not blame but *authority*, partitioning aesthetic judgment from social impact to avoid privileging either.  

  ### 2. **Excluded and Accommodated Rival Theories of Art**  
  - **Excluded Theories**:  
    - **Radical Autonomism** ("Art for art's sake"): Rejected by the Reach panel’s existence and the neutrality clause’s focus on *programs* (implying art must serve public ends).  
    - **Utilitarian Instrumentalism**: Rejected by the AM panel’s exclusion of social outcomes.  
    - **Strong Moralist Theories** (e.g., Plato, Tolstoy): Neutrality clause forbids evaluating artworks’ moral content.  
    - **Institutional Theories** (e.g., Danto): Panels assess properties, not "artworld" endorsements.  

  - **Accommodated Theories**:  
    - **Weak Formalism** (AM panel’s focus on craft/coherence).  
    - **Social Epistemology** (Reach panel’s emphasis on participation/belonging).  
    - **Pragmatic Pluralism** (any theory accepting art has multiple, irreducible goals).  

  - **Neutrality Clause Ambiguity**:  
    - **Epistemic Reading**: "No facts about artwork value exist" → contradicted by AM panel’s judgments.  
    - **Institutional Restraint Reading**: "Public bodies must not *act* on such facts" → aligns with panels’ behavior.  
    The AM panel’s existence confirms the latter: the council *allows* artistic judgment but outsources it to experts, avoiding "pronouncements."  

  ### 3. **Feeling-Sentence Field vs. Tolstoy**  
  Tolstoy’s transmission theory requires:  
  - **(T1) Intended Feeling**: Captured by the applicant’s statement.  
  - **(T2) Successful "Infection"**: Partially captured by Reach panel’s wellbeing/belonging metrics.  
  - **(T3) Moral Worth of Feeling**: **Suppressed** by the eight-category list.  

  - **Critical Flaws from Tolstoyan View**:  
    - The approved categories are **morally neutralized**: "Pride" could be patriotic or xenophobic; "Solidarity" could unite workers or supremacists.  
    - Post-event surveys **cannot distinguish moral valence**: Reported "wellbeing" could stem from catharsis (good) or schadenfreude (bad).  
    - The system presumes **moral differences are irrelevant** to funding. Tolstoy would condemn this: transmitting "bad" feelings (e.g., hatred) makes art *harmful*, regardless of craft or reach.  

  ### 4. **Underdetermination: Where Rules Permit Multiple Theories**  
  The instrument is compatible with:  
  - **Value Pluralism** (AM and R as irreducible goods).  
  - **Democratic Pragmatism** (balancing elite artists + community voices).  
  - **Bureaucratic Safety** (avoiding controversial judgments via strict panel remits).  
  All license the *same rules* but imply different justifications.  

  ### 5. **A Sincerely Tolstoyan Replacement**  
  - **Panels**:  
    - **Technical Competence Panel**: Assesses craft, coherence, clarity of feeling (replaces AM panel).  
    - **Transmission Fidelity Panel**: Measures evidence of "infection" (e.g., audience reports of *intended* feeling).  
    - **Moral Worth Panel**: Evaluates the feeling’s alignment with "the highest religious consciousness" (e.g., universal love, compassion).  
  - **Forbidden Considerations**:  
    - Technical panel forbidden to consider morality or reach.  
    - Transmission panel forbidden to assess craft or moral worth.  
    - Moral panel forbidden to assess technique or popularity.  
  - **Neutrality Clause**: **Abolished**. Moral evaluation is central.  
  - **Feeling Categories**: Restricted to Tolstoyan "good" feelings (e.g., universal brotherhood, self-sacrifice). "Unease" or "pride" funded only if morally justified.  
  - **Unfundable Activities**: Art promoting individualism, nationalism, or "lower" feelings (e.g., sensual delight without moral purpose).  

  - **Evaluation**:  
    - **Public Purpose**: Worse served in pluralistic societies. Tolstoyan system would be exclusionary and ideologically rigid, conflicting with public trust.  
    - **Colleague’s Deflationary Reading**: **Survives but transforms**. Politics remains (e.g., defining "moral consciousness"), but the settlement now explicitly endorses a moral theory of art.  

  ### Conclusion: Coherence and Trade-offs  
  Your instrument is **internally coherent but philosophically unstable**. It:  
  - Separates artistic value from social impact, implying they are distinct.  
  - Relies on moral neutrality while tacitly endorsing a weak instrumentalism (art *should* foster belonging/wellbeing).  
  - Fails Tolstoy by excluding moral evaluation, reducing art to technique + social engineering.  

  **Recommendation for Renewal**:  
  - Retain the dual-panel structure but add a *third criterion*: "Alignment with Public Values" (assessed via charter-compliant principles, not artwork content).  
  - Revise the feeling categories to require **contextual moral justification** (e.g., "pride *in what?*").  
  - Acknowledge the averaging rule *is* political—but argue that in a diverse society, partitioning aesthetic/social judgment is a virtue, not a flaw.  

  The instrument’s strength lies in its bureaucratic humility, but its weakness is evading art’s deeper tensions. Tolstoy would call it a machine for "counterfeit art"; a pragmatist might call it the least bad option for a public institution. Your task is to navigate that ambiguity—not resolve it.
