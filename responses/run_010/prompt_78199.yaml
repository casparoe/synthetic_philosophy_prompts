prompt: |-
  Last night a friend and I argued until nearly two in the morning about how governments appraise long-run climate policy, and I have come away suspecting that we were talking past each other. I would like a careful analysis of what the practice in question actually commits us to, so that I can tell which of us was making a philosophical point and which was merely making a technical one.

  The practice. Britain's central guidance on project appraisal — the Treasury's Green Book — tells departments not to discount the far future at a single constant rate. As I understand it, analysts are directed to use a rate of roughly 3.5 percent per year for effects falling in the first thirty years, then to step that rate down as the horizon lengthens, with a floor somewhere near 1 percent for effects more than three centuries out. The precise figures are beside the point for what I want from you; the shape is what matters. Two features are essential: the further out a cost or benefit falls, the lower the annual rate applied to it, and the rate applied to a given future year differs depending on the year in which the appraisal is performed. The same schedule governs flood defenses, nuclear waste management, and carbon abatement — programs whose benefits land mostly in the centuries where the low rates apply. The stated justification is epistemic rather than ethical: because we cannot know how fast the economy will grow over three hundred years, a declining schedule is said to be the appropriate certainty-equivalent way to discount under that uncertainty.

  My friend's position was that this is a disguised ethical compromise — a split-the-difference between market-anchored rates and a near-zero pure rate of time preference, smuggled into a technical annex so that nobody has to defend it; and further, that the whole apparatus presupposes continued growth, since the low rates are only reached by averaging over a distribution of growth paths, which is exactly what a degrowth policy denies. My position was that the schedule is a neutral response to genuine uncertainty, that it presupposes nothing about whether the future will be richer, and that accusing it of concealing an ethical choice confuses a correction for risk with a value judgment.

  Please write an answer that does the following. Reconstruct the implicit theory of intergenerational justice and value that the declining schedule presupposes, stating explicitly what it assumes about the moral standing of future persons, about whether environmental and market goods are commensurable in money, and about whether future people will be better off. Then separate what the practice strictly presupposes from what it merely fits well with: is it licensed equally by a near-zero pure rate of time preference, by uncertainty about long-run growth, and by a deliberate compromise between descriptive and prescriptive rates, or are some of those mutually exclusive? Assess the internal coherence of the practice, in particular the time-inconsistency of applying different rates to the same future year depending on the appraisal date, and the tension between granting future welfare equal standing while discounting future consumption. Say where the practice is philosophically underdetermined — where several incompatible theories would license it identically. Finally, tell me what would have to change in appraisal practice, and in which projects get funded, if the schedule were replaced by a single very low constant rate or by a single market-anchored constant rate, and what each replacement would presuppose that the schedule does not. Conclude by adjudicating my friend's growth objection: does a declining schedule genuinely avoid assuming growth, or does it assume it in the distribution over growth paths?

  You do not need to cite sources or supply a reading list; I am interested in the argument itself. Please write in American English.
reasoning: |-
  Okay, let me unpack this user's complex query about discounting in climate policy. The user had a heated debate with a friend about the UK Treasury's declining discount rate schedule and wants a philosophical-technical analysis to clarify their disagreement.

  Hmm, the core tension seems to be between epistemic and ethical interpretations of the practice. The friend calls it a disguised ethical compromise while the user sees it as neutral uncertainty management. I need to reconstruct the implicit theory behind this approach carefully.

  First, the Green Book's structure: higher initial discount rate stepping down to ~1% over centuries. The official justification is uncertainty about long-term growth rates, not ethical weighting of future generations. But the user's friend suspects this is smuggling in ethical choices.

  Let me consider the foundational assumptions. The declining schedule appears to grant future persons equal moral standing - otherwise why bother with low long-term rates? It also assumes commensurability through monetary valuation and relies on growth expectations in its uncertainty distribution. That last point might be where the friend's growth objection bites.

  On coherence issues: the time-inconsistency is real but defensible as an administrative rule. The equal standing vs discounting tension is inherent to all discounting approaches though. Philosophically, this practice is underdetermined - it could stem from uncertainty models, near-zero time preference, or even ethical compromises.

  For alternatives: a single low rate would favor long-term projects more but assume constant ethical weighting. A market rate would prioritize near-term efficiency but heavily discount the future. Both make stronger assumptions than the declining schedule.

  Finally, the growth objection... ah, here's the crux. While the schedule doesn't assume actual growth will occur, its uncertainty distribution does contain positive growth scenarios. A degrowth policy would require a fundamentally different probability distribution. The friend has a point about presuppositions, though not about hidden ethics.

  The user seems analytically sophisticated but frustrated by the earlier unproductive debate. They're likely seeking conceptual clarity rather than policy recommendations. I should avoid jargon while respecting the complexity of the issue.
answer: |-
  Here's a systematic analysis of the declining discount rate schedule, dissecting its commitments, coherence, and implications as requested:

  **I. Implicit Theory of Intergenerational Justice & Value**
  1.  **Moral Standing of Future Persons:** The schedule implicitly grants future persons significant, though not absolute, moral standing. The very low long-term rate (approaching 1%) signals that their welfare matters substantially. It rejects *radical* discounting of the far future but accepts *some* discounting.
  2.  **Commensurability:** It fundamentally assumes environmental goods, health impacts, and other climate-related benefits/costs *can* and *should* be expressed in monetary terms for comparison. The entire apparatus of cost-benefit analysis (CBA), including discounting, presupposes this commensurability.
  3.  **Future Welfare:** Crucially, **it does not strictly *presuppose* future people will be better off.** Its stated justification is *uncertainty* about future growth rates. The *distribution* of possible growth paths used to derive the schedule likely *includes* scenarios of stagnation or even decline, but the *weight* given to these scenarios determines the implied expectation.

  **II. What the Practice Presupposes vs. What It Fits With**
  *   **Strictly Presupposes:**
      *   **Uncertainty about Long-Run Growth/Utility:** This is the core, stated justification. The declining schedule is derived as a *certainty-equivalent discount rate* under uncertainty about the future growth rate of consumption (g), which drives the Social Discount Rate (SDR = ρ + ηg). Uncertainty about `g` translates into uncertainty about the SDR.
      *   **Expected Utility Framework:** It assumes welfare can be modeled using an expected utility approach over possible future states of the world (growth paths).
      *   **Positive (but Uncertain) Elasticity of Marginal Utility (η):** The logic requires η > 0, meaning an extra dollar is worth less to richer people. This is central to why uncertainty about `g` affects discounting.
  *   **Fits Well With (Not Strictly Presupposed):**
      *   **Near-Zero Pure Rate of Time Preference (ρ≈0):** The low long-term floor rate *is consistent* with a very low or zero ρ. The uncertainty framework *can* incorporate a low ρ. However, the schedule *could technically* be derived with a higher ρ if the uncertainty about `g` was large enough to still pull the certainty-equivalent rate down over time. A low ρ makes achieving the low long-term rate more plausible and defensible ethically.
      *   **Deliberate Ethical Compromise:** While the *stated* justification is epistemic, the *effect* (low long-term discounting) aligns with ethical views emphasizing future generations. It *could* be seen as a politically palatable way to achieve this outcome without explicitly arguing for ρ=0. However, its *internal logic* is framed as risk management, not compromise.
  *   **Mutual Exclusivity?** The epistemic uncertainty justification and the deliberate ethical compromise justification are *conceptually distinct*. The practice *claims* the former. Whether it *functions* as the latter is a matter of interpretation. A near-zero ρ is *compatible* with the uncertainty framework. A high market-anchored ρ (based purely on observed returns) is generally *incompatible* with the low long-term rates, as it wouldn't generate the declining schedule under standard uncertainty models; market rates reflect short-to-medium term risk and returns, not deep uncertainty centuries out.

  **III. Internal Coherence Assessment**
  1.  **Time-Inconsistency:** This is a real and significant theoretical issue. If the rate applied to year 2200 is 1.5% in an appraisal done in 2024, but an appraisal done in 2070 applies (say) 2.5% to that *same* year 2200, the implied relative valuation between 2070 and 2200 changes depending on when the decision is made. This violates the principle of dynamic consistency.
      *   **Defense:** Proponents argue this is an acceptable practical consequence of *recognition of learning*. We know more in 2070 than in 2024, so it's rational to use an updated schedule based on reduced uncertainty at the nearer horizon. It's framed as a *pre-commitment* rule acknowledging current ignorance.
      *   **Critique:** Critics argue it creates arbitrariness and potential for strategic behavior ("wait and appraise later to get a different rate"). It means the value of preventing damage in 2200 depends on when the appraisal happens, not just the damage itself.
  2.  **Tension (Equal Standing vs. Discounting):** This tension is inherent in *any* positive discount rate, not unique to the declining schedule. Discounting future consumption (due to ηg > 0 or ρ > 0) *does* imply that a unit of consumption is valued less for a future person than for a present person, even if they have equal moral status. The declining schedule mitigates this tension *more* for the far future than a constant high rate does, but it doesn't eliminate it. It reflects a view that while future people matter, (a) we are uncertain about their baseline consumption level (ηg effect), and (b) there *might* be some minimal pure time preference (ρ) or more commonly, a recognition of the probability of societal collapse making the far future irrelevant (often folded into uncertainty).

  **IV. Philosophical Underdetermination**
  The declining schedule is underdetermined in these key areas:
  1.  **The Basis for Low Long-Term Rates:** Is it primarily driven by:
      *   Deep uncertainty about `g` (epistemic justification)?
      *   A near-zero ρ (ethical stance)?
      *   A high degree of risk aversion (high η) amplifying the effect of `g` uncertainty?
      *   A pragmatic compromise between conflicting ethical views?
      The *same numerical schedule* could be rationalized by different combinations of these factors.
  2.  **The Source of Uncertainty:** What exactly is the nature of the uncertainty modeled? Pure economic productivity risk? Catastrophic risk (existential threats)? Uncertainty about societal values or technological change? Different sources imply different ethical weights.
  3.  **The Treatment of Catastrophic Risk:** Is the low long-term rate partly capturing a non-zero probability of zero consumption (extinction)? This is often conflated with low growth uncertainty.

  **V. Alternative Discounting Schemes: Implications & Presuppositions**
  1.  **Replace with Single Very Low Constant Rate (e.g., 1%):**
      *   **Changes in Practice/Funding:** Dramatically increases the present value of very long-term benefits (e.g., climate mitigation, nuclear waste safety). Far more such projects would pass CBA. Near-term costs become harder to justify against distant benefits.
      *   **Presupposes:** A near-zero or zero pure rate of time preference (ρ≈0) *and* either (a) an expectation of very low long-term growth (g≈0), or (b) a very low elasticity of marginal utility (η≈0), or (c) an explicit ethical commitment to treat all generations equally regardless of efficiency arguments. It rejects the core epistemic uncertainty justification of the declining schedule.
  2.  **Replace with Single Market-Anchored Constant Rate (e.g., 4-6%):**
      *   **Changes in Practice/Funding:** Severely reduces the present value of long-term benefits. Projects with costs borne now/today and benefits accruing beyond 50-100 years (most climate mitigation, nuclear waste management) become virtually impossible to justify via CBA. Funding shifts heavily towards short-term payback projects.
      *   **Presupposes:** That observed market returns adequately reflect society's *intertemporal ethical preferences* and the *appropriate risk premium* for very long time horizons. It assumes descriptive rates (what the market does) are prescriptively correct (what society *should* do) and that the distant future is appropriately priced by current markets. It rejects both the ethical arguments for low ρ and the epistemic arguments about deep uncertainty justifying a declining schedule.

  **VI. Adjudicating the Growth Objection**
  **Your friend's growth objection is partially correct but overstates the case.**

  1.  **Does it presuppose growth?** **No, it does not strictly *presuppose* that growth *will* occur.** The core justification is *uncertainty* about future growth. The declining schedule is derived from a *probability distribution* over possible future growth paths (g). This distribution *could*, in principle, be centered on zero growth, include significant probability of negative growth (degrowth), or even include a non-zero probability of civilizational collapse (g → -∞).
  2.  **Does it assume growth *in the distribution*?** **Yes, in a critical way.** The *plausible range* of growth paths used to calibrate the uncertainty distribution **almost certainly includes positive growth scenarios and likely assigns them significant probability weight.** The current schedule was derived using models reflecting historical experience and economic projections, which inherently incorporate expectations of potential positive growth over long horizons. A deliberate degrowth policy target **fundamentally alters the assumed probability distribution over future growth paths.** It implies systematically lower central expectations for `g` and potentially a different shape/variance for the distribution.
      *   **Consequence:** If the official long-term economic policy is degrowth, the probability distribution over `g` underlying the discount schedule would need to be recalibrated to reflect this *policy-induced* expectation of lower average growth. Using the *existing* schedule, derived under the assumption that positive growth is a plausible/expected outcome, would be inconsistent with the degrowth policy goal. The schedule isn't neutral to the *policy context* shaping expectations.

  **Conclusion:**
  Your position captures the *stated, internal logic* of the practice: it is primarily framed as a technical, certainty-equivalent response to genuine uncertainty about long-run growth (`g`), not an overt ethical choice. It avoids *presupposing* growth *will* happen.

  However, your friend's critique identifies crucial tensions:
  1.  **Ethical Smuggling:** While not its formal justification, the *effect* aligns with ethical views valuing the far future, making it politically convenient. The choice of the uncertainty model (especially the range/variance of `g` and the value of ρ implicitly used) involves judgment with ethical dimensions.
  2.  **Growth in the Distribution:** The schedule is **not neutral regarding *expectations* of growth.** The probability distribution over `g` used to derive it reflects current expectations and historical data, where positive growth scenarios dominate. A deliberate degrowth policy would necessitate a different distribution, undermining the calibration of the *existing* schedule. The schedule *embeds* current expectations about potential futures, including potential growth.
  3.  **Coherence Issues:** The time-inconsistency is a genuine theoretical weakness, even if defended practically.

  The debate conflates levels: you focused on the internal technical rationale (uncertainty about `g`), while your friend focused on the embedded assumptions (the distribution over `g`) and political function (achieving an ethically desired outcome without explicit debate). Both perspectives illuminate aspects of this complex practice. The growth objection hits home precisely because the uncertainty model isn't agnostic; it reflects a world where growth is considered a plausible, even likely, scenario for the distant future.
