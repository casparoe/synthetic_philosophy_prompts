prompt: |-
  You're an expert on the foundations of probability — picture a professional philosopher who's spent years on indifference and its critics. Please think carefully, and start with a couple of paragraphs of brainstorming about what *kinds* of principle could even be in the running before you settle on one. Names from the literature are fine in passing, but I don't want a literature review; I want the reasoning.

  Here's my problem. I'm trying to work out where the principle of indifference is legitimate by going through my own verdicts, and they don't hang together.

  (1) A coin drawn from a barrel of coins of unknown bias. Indifference over the bias, uniform on [0,1], gives 1/2 for heads on the next toss. Legitimate — I'm confident that's the right number and not an artefact of how I described the barrel.

  (2) Bertrand's chord. A chord is "chosen at random" from a circle; what's the probability it exceeds the side of the inscribed equilateral triangle? Three apparently equally natural procedures give 1/3, 1/2 and 1/4. My verdict: the question as posed has no answer, and anyone producing a number is smuggling in a procedure they never stated.

  (3) The cube factory. A machine turns out cubes with edges in some fixed interval and we're told the output is "uniformly distributed" — over edge, over face area, or over volume; all three are consistent with the description and they disagree. Here I flip: unlike (2), I think there *is* a right answer, and I'm drawn to uniform over edge. I can't say what privileges edges over faces, and it isn't units — told the machine is calibrated in inches I still say edge, which is either a point in my favour or a sign I'm not tracking anything at all.

  (4) My own variant, the one that keeps me up. Same machine, but the description is explicitly enriched: we're told the mechanism produces a uniform spread over *some* magnitude in a fixed interval, without saying which. I want to say this is worse than (2) — now there isn't even a fact about which parameterisation the uniformity attaches to. But (4) is just (3) with a sentence added, and adding information shouldn't turn a determinate question into an indeterminate one. Or should it?

  My tentative principle: indifference is licensed over a partition just when the problem description makes that partition canonical, and where nothing is canonical the question is undefined rather than merely hard. Test it against the four. I'm already suspicious about (1) — nothing in "barrel of coins of unknown bias" seems to privilege the linear parameterisation of bias over the square root of the bias or the log odds — so my principle may well kill a verdict I very much want to keep. So: which of the four has to go if I want something simple and self-consistent? I'd genuinely rather loose a verdict than save all four with a clause-by-clause patchwork. Then tell me what the surviving principle delivers on cases I haven't raised (e.g. "the book has between 1 and 100 pages, so 1/2 that it's under 50"), and whether it actually explains the difference between (2) and (3) or just relabels it.

  British English, please.
