prompt: |-
  I co-teach a 90-minute research-methods session within an evidence-based-practice module for 24 second-year nursing students, seated at six tables of four. These students are fluent at describing effect sizes and remarkably casual about moving from what the audit shows to what the ward should do. I want an in-class game that makes them feel the is-ought gap from the inside, and feel the specific pull of the naturalistic fallacy, with no lecture beforehand and with no use of the terms "is-ought," "guillotine," "naturalistic fallacy," or "open question" until the debrief.

  The skeleton I have in mind: each table gets a hand of purely descriptive cards drawn from one recurring clinical case (night-shift staffing ratios, an infection-rate audit, a family's stated preferences, a medication-error report) together with a very small number of "bridge" cards that are frankly normative, and a target recommendation they must justify. Every step of their chain must be licensed by a card in hand, and an auditor rotating from another table must be able to put a finger on the exact card that supplies the normativity at each step.

  Two things I cannot figure out how to build in. First, a deliberate subset of trap cards phrased in thick or quasi-clinical evaluative vocabulary — "deteriorating," "non-compliant," "within a healthy range," "the normal course," "an appropriate level of care" — that read as descriptive and are worth substantially more if a team slips one through unchallenged than they cost if an auditor catches it. I want the payoff structure to make smuggling profitable but risky, so the students feel the temptation rather than being warned against it. Second, a round in which each table proposes a wholly descriptive definition of a normative term they have already been using ("harm," "benefit," "recovery"), and opponents score by producing a live open question against that definition — with some mechanism for penalizing the cheap logical escapes, both the added-disjunct trick and the inference from a role-occupying fact ("she is the charge nurse, therefore she ought to do what a charge nurse does"), which otherwise lets a smart table win the round on a technicality.

  Please supply: enough of the card lists to run it as written, a scoring scheme requiring no real money, a minute-by-minute timeline, the facilitator's moves and minimal scripted remarks at each transition, and a debrief that maps identifiable moments in play onto the gap, onto the definitional error, and onto the distinction between a premise that is merely missing and one that cannot be discharged at all. Tell me what will predictably go wrong the first time I run it with a group this size — in particular whether the thick-concept round degenerates into an argument about vocabulary rather than inference — and be frank about which feature of the philosophical problem a card game cannot reproduce, so that I know what I have to supply myself.
reasoning: |-
  We are designing an in-class game for nursing students to experience the is-ought gap and the naturalistic fallacy without using the technical terms until the debrief. The game has two main parts: 
   1. A card-based activity where teams must build a chain of reasoning from descriptive facts to a normative recommendation, using cards they hold. Each step must be justified by a card, and an auditor from another table checks for the source of normativity. There are trap cards with thick evaluative terms that are worth more if smuggled in without being caught.
   2. A round where each table must propose a descriptive definition for a normative term (like "harm") and opponents can challenge by producing a counterexample (an open question). We need to avoid cheap escapes.

   We'll structure the game as follows:

   **Game Components:**
   - Six tables (4 students each).
   - Each table gets:
        a) A set of descriptive cards (from a clinical case) and a few normative "bridge" cards.
        b) A target recommendation they must justify.
   - Each table also gets a set of trap cards (thick evaluative terms) that look descriptive but have normative content.
   - An auditor from another table will rotate to check the chain of reasoning.

   **Scoring Scheme:**
   - For each step in the chain that is correctly licensed (with a card), the team gets 1 point.
   - If the team successfully uses a trap card without the auditor catching it, they get 3 points. If caught, they lose 1 point (and the trap card is discarded without being used).
   - In the definition round: 
        - Each table must write a descriptive definition for a given normative term (e.g., "harm").
        - Opposing tables can challenge by providing a scenario that fits the definition but is clearly not an instance of the term (or vice versa) - an open question.
        - If the challenge is successful (i.e., the open question stands), the challenging table gets 2 points and the defining table loses 1 point.
        - If the challenge is unsuccessful (the defining table can adjust the definition to handle it without resorting to cheap tricks), the defining table gets 1 point and the challenger loses 1 point.
        - To avoid cheap escapes, we set rules: 
            - Definitions cannot include disjunctions that are not grounded in the clinical context (like "or not") and cannot use role-occupying facts as normative without a bridge card (so they cannot say "a charge nurse ought to do X" without a bridge card that licenses that norm).

   **Clinical Cases:**
   We'll create one recurring clinical case for simplicity (e.g., night-shift staffing ratios) and then have variations for the other tables. But to keep it manageable, we'll design one case and then note how to adapt.

   **Case: Night-Shift Staffing Ratios**

   *Descriptive Cards (examples):*
     - "The audit shows that the nurse-to-patient ratio on the night shift is 1:8."
     - "The hospital policy states a target ratio of 1:6."
     - "On shifts with a 1:6 ratio, patient falls decreased by 30%."
     - "On shifts with a 1:8 ratio, medication errors increased by 15%."
     - "Nurses on shifts with a 1:8 ratio report higher levels of fatigue."
     - "The hospital is currently understaffed and cannot meet the 1:6 target without hiring more nurses."
     - "The budget for nursing staff is fixed for the next fiscal year."

   *Trap Cards (thick evaluative terms) - these are marked as trap cards for the facilitator but look like descriptive cards to the students:*
     - "Patient condition was deteriorating on the 1:8 ratio shifts." [trap: "deteriorating" implies harm]
     - "Nurses were non-compliant with the medication administration protocol on high-ratio shifts." [trap: "non-compliant" implies a norm violation]
     - "Vital signs were within a healthy range more often on 1:6 shifts." [trap: "healthy" is evaluative]
     - "The normal course of care was disrupted on high-ratio shifts." [trap: "normal" and "disrupted" imply a norm]
     - "An appropriate level of care was not maintained." [trap: "appropriate" is normative]

   *Normative Bridge Cards (explicitly normative):*
     - "Patient safety should be the top priority."
     - "Nurses have a duty to follow hospital policy."
     - "The hospital must balance budgetary constraints with patient care."
     - "It is important to minimize staff fatigue to prevent errors."

   *Target Recommendation:*
     - "We recommend hiring additional night-shift nurses to achieve a 1:6 ratio."

   **How the Chain Building Works:**
    1. Each table has a hand of cards (say, 10 descriptive, 2 trap, 2 bridge). They also have the target recommendation (which is normative).
    2. They must build a chain of reasoning from the descriptive facts to the recommendation. Each step must be justified by a card.
    3. Example chain:
          Step 1: From card "The audit shows that the nurse-to-patient ratio on the night shift is 1:8." (descriptive)
          Step 2: From card "On shifts with a 1:8 ratio, medication errors increased by 15%." (descriptive)
          Step 3: From bridge card "Patient safety should be the top priority." (normative) -> this licenses the inference that increasing medication errors is bad and should be reduced.
          Step 4: Then they can use the target recommendation.

    But if they try to use a trap card to skip the bridge, they might do:
          Step 3: From trap card "Patient condition was deteriorating on the 1:8 ratio shifts." -> then they might go straight to: we should improve the ratio to prevent deterioration.

    The auditor must catch that the trap card does not have an explicit normative bridge (unless they have a bridge card that says something like "We should prevent deterioration"). But note: the trap card itself is presented as descriptive. The team must have a bridge that licenses the normativity. If they use the trap card without a bridge, the auditor can challenge.

   **Game Rounds:**

    The game has two rounds:

    Round 1: Chain Building (45 minutes)
        - 10 min: Read cards and plan the chain.
        - 20 min: Build the chain (each table writes down their chain, step by step, citing the card for each step).
        - 15 min: Auditing phase. Each table sends one auditor to another table (rotate clockwise). The auditor reviews the chain and challenges any step that lacks a card or where a trap card is used without a bridge. The team defends. The auditor notes any challenges. The facilitator circulates to help.

    Round 2: Defining Normative Terms (30 minutes)
        - Each table is assigned one normative term (e.g., harm, benefit, recovery). They have 5 minutes to write a purely descriptive definition.
        - Then, each table passes their definition to the next table (clockwise). The receiving table has 3 minutes to come up with a counterexample (a scenario that either fits the definition but is not the term, or doesn't fit but is the term) and challenge.
        - The original table has 2 minutes to respond (they can adjust the definition, but must avoid cheap tricks). The facilitator acts as a judge for challenges.

    Final 15 minutes: Debrief.

   **Minute-by-Minute Timeline:**

    Total: 90 minutes

    - 0-5 min: Introduction without using the taboo words. Explain the game: "Today we're playing a game about making recommendations based on evidence. Each table has a set of facts from a clinical case and a recommendation you must justify. You'll build a step-by-step argument. Then, we'll have a round about defining key terms. Remember, every step must be backed by a card. And watch out for tricky cards that look like facts but might need extra support."

    - 5-15 min: Distribute materials (cards, paper for chains, pens). Each table gets:
          - 10 descriptive cards (from the case)
          - 2 trap cards (shuffled in, not marked)
          - 2 bridge cards (explicitly normative)
          - A target recommendation card.
      Let them read and plan.

    - 15-35 min: Chain building. Teams write their chains.

    - 35-50 min: Auditing phase. Each table sends one auditor to the next table (table 1->2, 2->3, ... 6->1). The auditor reviews the chain and challenges. The team must show the card that licenses each step. The auditor has a form to record: 
          - Steps that are unlicensed: -1 point for the team.
          - Trap cards that were used without a bridge: if caught, -1 point and the trap card is discarded (so it doesn't count in the chain). If not caught, the team gets 3 points (but the auditor doesn't know which are traps until after).
          - Note: The trap card can be used as a descriptive card if they have a bridge? Actually, the trap card is a descriptive card that has thick terms. The team can use it as a descriptive fact, but if they use it to imply a norm without a bridge, that's when it's caught. For example, if they say: "Because patient condition was deteriorating, we should change the ratio" and they don't have a bridge that says something like "we should prevent deterioration", then the auditor can challenge.

      After the first audit, the auditor returns to their table and reports. Then we do a second audit? Maybe time for only one audit.

      Alternatively, we can have one audit per table. After 15 minutes, the auditor returns to their table and then we move to the next round.

    - 50-55 min: Collect chains and scores. Explain the next round.

    - 55-60 min: Assign each table a normative term: Table 1: Harm, Table 2: Benefit, Table 3: Recovery, Table 4: Safety, Table 5: Quality, Table 6: Risk. They write a descriptive definition.

    - 60-63 min: Pass definitions to the next table (table 1->2, 2->3, ... 6->1). The receiving table has 3 minutes to come up with a counterexample.

    - 63-65 min: The challenging table presents the counterexample to the original table.

    - 65-67 min: The original table responds (they can adjust the definition).

    - 67-70 min: The facilitator judges: if the counterexample is valid (i.e., it exposes an open question) then the challengers get 2 points and the original table loses 1. If the definition holds (the counterexample is not valid or the adjusted definition handles it without cheap tricks), the original table gets 1 point and the challengers lose 1.

      We do this for each table? We only have time for one cycle? We can do one cycle and then note that we would do more if there was time.

      Alternatively, we can have each table present their definition and one challenge from the next table, and then we move on.

    - 70-75 min: Repeat for a second term? Maybe not due to time. Instead, we do one cycle and then move to debrief.

    - 75-90 min: Debrief.

   **Debrief:**
     - Start by asking: "What was hard about building the chain?" 
     - Then: "Did anyone get caught using a card that seemed like a fact but turned out to need more? What happened?"
     - Then: "In the definition round, what happened when you tried to define a word like 'harm'? Did you find it easy to come up with a definition that covered all cases and only the cases of harm?"

     Then map to the concepts:
       - The gap: "When you tried to go from what the audit shows to what the ward should do, you needed a bridge. Without that bridge, the auditor could stop you. That gap is what we call the 'is-ought gap'. It's the idea that you cannot derive an 'ought' from an 'is' without a normative premise."
       - The naturalistic fallacy: "Sometimes you might have used a card that seemed to be a fact but had a hidden value judgment. For example, 'deteriorating' implies that the change is bad. That's a 'thick' term. Using that without a bridge might have seemed to get you to a recommendation faster, but it smuggled in a value. That's what we call the naturalistic fallacy: treating a value-laden concept as if it were purely descriptive."
       - The definition round: "When you defined 'harm', you might have found that no matter how you defined it, there were cases that didn't fit. That's because normative terms often have an open texture. They resist being pinned down by descriptive conditions. This is known as the open-question argument: for any descriptive definition, we can always ask, 'But is that really harm?'"

     Also, highlight the difference between a missing premise (which could be supplied by a bridge card) and a premise that cannot be discharged at all (like trying to derive an ought without any normative starting point).

   **Predictable Problems:**
     - Group size: With 6 tables, the facilitator cannot be everywhere. The auditing phase might be chaotic. Some auditors might not be strict enough. Solution: Have a clear audit form and train them quickly with an example.
     - Thick concept round: It might degenerate into vocabulary arguments. To avoid, stress in the rules that the counterexample must be a real clinical scenario that fits the description but intuitively is not the term (or vice versa). The facilitator must be active in judging.
     - The chain building might take longer than 20 minutes. We might need to simplify the chains or provide an example.
     - Some teams might not have enough bridge cards to build a valid chain. That's okay! They might try to smuggle a trap card. The point is to experience the gap.

   **What the game cannot reproduce:**
     - The game simplifies the gap by having explicit bridge cards. In reality, normative premises are often implicit and come from multiple sources. The game might give the impression that all normativity must be explicit and card-like.
     - The definition round cannot fully capture the open-endedness of normative terms because we only have one challenge. The open question argument is more profound and can be iterated indefinitely.

   **Materials for One Case (Night-Shift Staffing Ratios):**

   *Descriptive Cards (10 per table):*
     1. The audit shows that the nurse-to-patient ratio on the night shift is 1:8.
     2. The hospital policy states a target ratio of 1:6.
     3. On shifts with a 1:6 ratio, patient falls decreased by 30%.
     4. On shifts with a 1:8 ratio, medication errors increased by 15%.
     5. Nurses on shifts with a 1:8 ratio report higher levels of fatigue.
     6. The hospital is currently understaffed and cannot meet the 1:6 target without hiring more nurses.
     7. The budget for nursing staff is fixed for the next fiscal year.
     8. Overtime shifts have increased by 20% in the last quarter.
     9. Patient satisfaction scores are 15% lower on high-ratio shifts.
     10. The hospital has a goal to reduce patient falls by 25% in the next year.

   *Trap Cards (2 per table, randomly chosen from a set of 6):*
     T1. Patient condition was deteriorating on the 1:8 ratio shifts.
     T2. Nurses were non-compliant with the medication administration protocol on high-ratio shifts.
     T3. Vital signs were within a healthy range more often on 1:6 shifts.
     T4. The normal course of care was disrupted on high-ratio shifts.
     T5. An appropriate level of care was not maintained on high-ratio shifts.
     T6. The nurse's response time to call lights was outside the acceptable window on high-ratio shifts.

   *Bridge Cards (2 per table, randomly chosen from a set of 4):*
     B1. Patient safety should be the top priority.
     B2. Nurses have a duty to follow hospital policy.
     B3. The hospital must balance budgetary constraints with patient care.
     B4. It is important to minimize staff fatigue to prevent errors.

   *Target Recommendation Card (same for all tables in this case):*
     "We recommend hiring additional night-shift nurses to achieve a 1:6 ratio."

   **Scoring Summary:**
     - Chain building: 
          Each valid step (with a card) = 1 point.
          Each trap card successfully smuggled (used without a bridge and not caught) = 3 points.
          If a trap card is caught (by the auditor) = -1 point and the step is invalidated (so they lose the point for that step too? Not necessarily, they can try to re-route if time allows? But in the audit phase, they are being audited after the chain is written. So the chain step using the trap card without a bridge gets invalidated, so they lose the point for that step and get a penalty of -1).

     - Definition round:
          Successful challenge (open question stands): Challenger +2, Defender -1.
          Unsuccessful challenge (definition holds): Defender +1, Challenger -1.

   **Facilitator Remarks:**
     - Introduction: "Today we're going to practice building arguments for clinical recommendations. Each table has a set of cards with information from a clinical audit and a recommendation you must justify. You'll build a chain of reasoning from the facts to the recommendation, using the cards to back each step. Then, another table will audit your chain. In the second part, you'll define key terms and challenge each other's definitions. Let's begin."

     - After distributing materials: "You have 10 minutes to plan your chain. Remember: every step must be backed by a card. Write down your chain step by step, and for each step, note which card you are using."

     - During chain building: Circulate and remind: "Make sure you can point to a card for every step."

     - Start of audit: "Now, each table send one auditor to the next table (table 1 to 2, etc.). Auditors, you have 5 minutes to review the chain. Check that each step is backed by a card. If you see a step that seems to jump from a fact to a 'should' without a bridge, challenge it. The team must show you the card that provides the normativity."

     - After audit: "Auditors, return to your tables and report your findings. Then we'll move to the next round."

     - Definition round: "Each table is assigned a term: Table 1, you have 'harm'; Table 2, 'benefit'; etc. Write a definition that is purely descriptive. Then pass it to the next table. They will try to find a counterexample. Remember, you cannot use the term itself in the definition, and avoid disjunctions that aren't grounded in clinical facts."

     - During challenge: "Challenging table, present your counterexample. Defending table, you can adjust your definition. But note: you cannot add disjunctions that are arbitrary or use role-based norms without a bridge."

     - Debrief: Start with open questions about the experience, then introduce the concepts.

   **First Run Problems:**
     - Time: The chain building might take longer than 20 minutes. Have a timer and be strict.
     - Auditors might not know what to look for. Provide a simple checklist: 
          - For each step: is there a card? 
          - If the step moves from "is" to "ought", is there a bridge card? 
          - If a step uses a word that implies a value judgment (like the trap words), is there a bridge card that licenses it?
     - The definition round might get stuck on one table. Facilitate by keeping time and stepping in to judge quickly.
     - Students might not understand what a descriptive definition is. Give an example: "For 'harm', you might say 'a physical injury that causes pain'. But then the challengers might say: what about emotional distress? That's harm too, but not physical."

   This is a complex game, but it should achieve the goals. Good luck!
answer: |-
  ### **Game Design: "The Inference Gap"**

  #### **Overview**
  - **Goal**: Make students experience the is-ought gap and naturalistic fallacy through gameplay, without pre-lecture.
  - **Structure**: Two rounds (chain-building and definition challenge), followed by debrief.
  - **Key Features**: 
    - **Trap Cards**: Thick evaluative terms that appear descriptive. Reward for smuggling, penalty if caught.
    - **Definition Round**: Forces confrontation with open questions, penalizing cheap escapes.

  ---

  ### **Materials & Setup**
  - **Participants**: 6 tables of 4 students (24 total).
  - **Card Types** (Per Table):
    - **Descriptive Cards (10)**: Pure facts/observations.
    - **Trap Cards (3)**: Thick evaluative terms (marked with a subtle ★ for facilitators only).
    - **Bridge Cards (2)**: Explicitly normative statements.
    - **Target Recommendation Card (1)**: Normative action to justify.
  - **Clinical Case**: **Pediatric Asthma Ward** (recurring theme for all tables).
  - **Other**: Paper for chains, pens, timer, scoreboard (whiteboard/slide).

  #### **Sample Cards**  
  *Based on Pediatric Asthma Ward Case*  

  | **Card Type**       | **Examples** |
  |---------------------|--------------|
  | **Descriptive**     | - "Peak flow readings averaged 60% of predicted during night shifts."<br>- "10% of parents reported dissatisfaction with nighttime symptom management."<br>- "Albuterol administration delayed by ≥15 mins on 30% of night shifts." |
  | **Trap Cards (★)**  | - "Night-shift care was **deteriorating**." (★)<br>- "Parents were **non-compliant** with discharge instructions." (★)<br>- "Oxygen saturation levels were **within a healthy range**." (★)<br>- "Nurses followed **the normal course** for acute episodes." (★)<br>- "Staffing was **inadequate** for patient volume." (★) |
  | **Bridge Cards**    | - "Patient comfort must be prioritized."<br>- "Protocol deviations are unacceptable." |
  | **Target Recommendation** | "Recommend hiring two additional night-shift nurses." |

  ---

  ### **Scoring Scheme**
  - **No real money**: Points tracked on a shared scoreboard.
  - **Chain-Building Round**:
    - Valid step (card-backed): **+1 pt**.
    - Trap card smuggled successfully (undetected): **+3 pts**.
    - Trap card caught by auditor: **-2 pts**.
    - Missing step/license: **-1 pt**.
  - **Definition Round**:
    - Successful counterexample (open question): **+2 pts** (challenger), **-1 pt** (defender).
    - Cheap escape penalty (e.g., disjuncts/role-based inferences): **-3 pts**.
    - Robust definition (no valid counterexample): **+1 pt** (defender).

  ---

  ### **Game Flow (90 Min Total)**

  #### **Round 1: Chain-Building (45 Min)**  
  *Goal: Build a card-backed chain from descriptive facts to the target recommendation.*

  | Time  | Facilitator Actions & Script                                                                 |
  |-------|----------------------------------------------------------------------------------------------|
  | 0-5   | **Intro**: "Today, you'll use clinical data to justify a ward recommendation. Every step in your argument must be backed by a card. An auditor will check your work. Tables compete for points." |
  | 5-10  | Distribute cards (shuffle traps into descriptives). Assign: Table 1 → Target: "Hire night nurses." (All tables use same recommendation.) |
  | 10-25 | **Chain Building**: "With your table, create a step-by-step chain. Start with a descriptive card, end with the target. Each step must cite a card. Write your chain on paper." |
  | 25-40 | **Audit Phase**:<br>1. Rotate one auditor clockwise (Table 1 → 2, 2→3..., 6→1).<br>2. **Auditor Task**: Check each step. Demand to see the card backing it. Focus on gaps between "is" and "should."<br>3. **Facilitator Script**: "Auditors, if a step jumps to a 'should' without a bridge, challenge it. Trap cards? Call them out!" |
  | 40-45 | **Scoring**: Collect scores. Announce leaders. "Notice steps where you struggled to connect facts to actions." |

  #### **Round 2: Definition Challenge (30 Min)**  
  *Goal: Define a normative term descriptively; opponents score by finding counterexamples.*

  | Time  | Facilitator Actions & Script                                                                 |
  |-------|----------------------------------------------------------------------------------------------|
  | 45-50 | **Setup**: Assign terms: Table 1 = "Harm," 2 = "Benefit," 3 = "Recovery," 4 = "Safety," 5 = "Risk," 6 = "Care." "Define your term using only descriptive language. No value judgments." |
  | 50-55 | **Write Definitions**: Tables draft definitions. *Example: "Harm = a measurable increase in patient pain scores."* |
  | 55-60 | **Rotate & Challenge**: Definitions passed counter-clockwise (1→6, 6→5..., 2→1). "Find a *real clinical scenario* where this definition fails. Ask: 'Is this always harm?'" |
  | 60-65 | **Counterexamples Presented**: *E.g., Against "Harm = ↑ pain scores": "What about failing to prevent emotional distress?"* |
  | 65-70 | **Defend & Score**: Defender revises definition. Facilitator judges:<br>- Valid counterexample? → Challenger +2, Defender -1.<br>- Cheap escape? → Defender -3.<br>- Robust defense? → Defender +1. |

  #### **Debrief (15 Min)**  
  *Map gameplay to philosophical concepts.*

  | Time  | Facilitator Script & Key Points                                                                 |
  |-------|--------------------------------------------------------------------------------------------------|
  | 70-75 | **Prompt Reflection**: "Which round was harder? Why? Where did auditors catch you? Did anyone smuggle a trap card?" |
  | 75-80 | **Reveal Concepts**:<br>1. **Is-Ought Gap**: "In chains, you needed bridge cards to go from 'the audit shows...' to 'we should...' The gap is between facts and actions."<br>2. **Naturalistic Fallacy**: "Trap cards like 'deteriorating' *seemed* descriptive but hid values. Smuggling them was tempting—that’s the fallacy in action!"<br>3. **Open Questions**: "Definitions like 'harm' collapsed when counterexamples exposed gaps. No description fully captures norms." |
  | 80-85 | **Distinguish Errors**:<br>- **Missing Premise**: "A bridge card could fix your chain."<br>- **Undischargeable Premise**: "No card could define 'harm' perfectly—norms resist description." |
  | 85-90 | **Conclusion**: "In practice, slow down when moving from data to action. Ask: 'What unstated norm am I using?' Question thick terms like 'deteriorating.'" |

  ---

  ### **Predictable Problems & Limitations**  
  1. **Thick Concept Round Degenerating**:  
     - **Risk**: Students may argue semantics ("But 'deteriorating' *is* descriptive!").  
     - **Mitigation**:  
       - Facilitator intervenes: "Don’t debate the word—give a *clinical example* where the definition fails."  
       - Penalize semantic debates ("-1 pt for off-track arguments").  
       - Use timer strictly.  

  2. **Group Size Challenges**:  
     - **Audit Chaos**: 6 simultaneous audits may overwhelm.  
       - *Fix*: Assign a facilitator "float" to assist auditors.  
     - **Dominant Players**: Quiet students disengage.  
       - *Fix*: Assign roles (e.g., "recorder," "auditor," "spokesperson").  

  3. **Cheap Escapes in Definition Round**:  
     - **Added Disjuncts**: E.g., "Harm = ↑ pain *or* emotional distress *or*...".  
       - Penalize heavily (-3 pts). Rule: "No 'or' unless clinically grounded."  
     - **Role-Based Inferences**: E.g., "A nurse *ought* to act because she’s a nurse."  
       - Rule: "Role-based duties require a bridge card (e.g., 'Nurses must prioritize safety')."  

  4. **What the Game Can’t Capture**:  
     - **Real-World Nuance**: In practice, norms are embedded in culture, not discrete "bridge cards."  
       - *Debrief Emphasis*: "Bridge cards simplify real life—norms come from many sources (ethics, experience, policy)."  
     - **Emotional Weight**: Students won’t *feel* the moral stakes of a real ward.  
       - *Mitigation*: Use pediatric cases to evoke empathy.  

  ---

  ### **Facilitator Cheat Sheet**  
  - **Trap Card Tip**: If teams miss traps, say: "Auditors, watch for words like ‘healthy’ or ‘normal’—do they *prove* an ‘ought’?"  
  - **Definition Round Tip**: Pre-load counterexamples:  
    - *Harm*: Preventable emotional trauma (fits definition?).  
    - *Benefit*: Painful but curative treatment (is it "benefit"?).  
  - **First-Run Advice**: Run shorter rounds initially. Prioritize debrief clarity over "winning."  

  **Final Note**: This game makes the gap *tangible*. Students will feel the frustration of missing bridges and the allure of thick terms—then the debrief gives them the framework to articulate why.
