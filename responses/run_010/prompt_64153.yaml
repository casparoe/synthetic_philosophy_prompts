prompt: |-
  Spent 34 years in a renal physiology lab, and since I retired our regional hospital has had me sitting on its clinical ethics panel as the "science" member. It's got me hooked on the philosophy end of the work, but it's also made me realize I can't tell which principle the panel has actually been applying when it declares somebody dead. Here's the record as best I can reconstruct it from the minutes:

  1. Ventilator patient, no brainstem reflexes, no spontaneous breath on two apnea tests 24 hours apart, no flow on the angio — declared dead. The written reason was that the body "had stopped holding itself together": pressors climbing, temperature drifting, pressure gone by day two.
  2. Anencephalic newborn, breathing on her own, gagging, pupils reactive — not dead (withdrawal of support was handled as a separate question).
  3. Man six years into a vegetative state, breathing unaided, brainstem fully working — not dead.
  4. Donation-after-circulatory-death case: we required five minutes of no circulation with no autoresuscitation before declaring death, and turned down a proposal to cut it to two, on the grounds that at two minutes the heart can still restart itself so you can't call the loss irreversible.

  New case. Twenty-six-year-old, motorcycle crash. Every test we run says the whole brain, brainstem included, is destroyed, so on precedent 1 she'd be dead today. Except she's 18 weeks pregnant, and the body is doing astonishingly well — on a ventilator and hormone replacement but off pressors, holding its own temperature, healing a surgical wound normally, cleared a line infection, gaining lean mass, fetus growing fine. Family wants support continued to delivery, roughly 17 more weeks, and someone has to say whether we'd be maintaining a dead woman or treating a living one.

  What should we decide if we want to stay consistent with our own record? Which of the four is the closest analog? And if the record genuinely doesn't settle it, spell out what principle we'd be signing on to with each choice, plus one hypothetical case that would tell the candidate principles apart. I've deliberately kept my own leanings out of the write-up.
reasoning: |-
  Okay, let me start by really understanding the user's background and the problem they're presenting. The user spent 34 years in a renal physiology lab and now serves on a clinical ethics panel as the science member. They're hooked on the philosophy but are confused about the principles their panel uses to declare death. They've provided four cases and a new one involving a pregnant woman with total brain destruction but a functioning body sustaining a pregnancy.

  First, I need to analyze the four prior cases to identify a consistent principle. Case 1 points to brainstem death with irreversible loss of bodily integration. Case 2, the anencephalic newborn, wasn't declared dead despite lacking higher brain functions because brainstem reflexes were present. Case 3, the vegetative state patient, was considered alive due to intact brainstem. Case 4 emphasizes irreversibility of circulatory function. So the panel seems to prioritize brainstem function for bodily integration, not just higher brain functions or circulation alone.

  Now, the new case: total brain destruction including brainstem, but the body is maintaining homeostasis, healing, and supporting a pregnancy. Precedent from Case 1 would suggest she's dead. But her body's resilience is remarkable, functioning without pressors, managing temperature, etc. The family wants to continue support for the fetus.

  The key conflict here is between the brain-based determination and the body's somatic functions. If the panel sticks strictly to brainstem criteria, she's dead. But her body's autonomous functioning challenges that. Consistency with prior cases would lean towards declaring death, but that might seem counterintuitive given the body's performance. 

  I should consider the underlying principles: the panel seems to use the brainstem as the integrator of the organism as a whole. Since her brainstem is destroyed, the body's current stability might be artificial, sustained by machines and hormones. This aligns with Case 1 where pressors and temperature drift indicated the body couldn't integrate itself. Here, the ventilator and hormone replacement are doing the integrating, not the brain.

  The user might be wrestling with the ethical implications of maintaining a "dead" woman for fetal benefit. But the panel's precedents emphasize the brainstem's role. Deviating here could set a precedent that undermines their previous decisions, especially Case 1. 

  A hypothetical to test principles: a patient with complete brain destruction but the body spontaneously maintains circulation without support. If the panel still considers them dead, it confirms brainstem integration is key. If not, they're prioritizing somatic function. But in this case, since support is needed, she'd be dead per precedent.

  So, advising consistency means declaring death, though it's ethically complex. The user needs to recognize that their panel's principle is the irreversible loss of brain-mediated integration, not just circulation or higher brain functions.
answer: |-
  Based on your panel's documented precedents, the consistent principle applied is **the irreversible loss of the brainstem's capacity to integrate the organism as a whole**. Here's the breakdown and application to the new case:

  **Analysis of Precedents:**
  1.  **Ventilator Patient:** Declared dead based on **loss of brainstem function** (no reflexes, no spontaneous breathing) leading to imminent somatic disintegration (the "body stopped holding itself together"). Death declaration focused on the *brain's failure* causing systemic collapse.
  2.  **Anencephalic Newborn:** *Not* declared dead because **brainstem function persisted** (breathing, gagging, pupil reactivity). The organism retained integrated function despite lacking higher brain structures.
  3.  **Vegetative State Patient:** *Not* declared dead because **brainstem function remained intact**, maintaining integrated somatic function (breathing, circulation regulation).
  4.  **DCD Case:** Emphasized **irreversible loss of circulatory function** as the defining criterion *in the absence of brain death testing*. The 5-minute wait ensured irreversibility. This reinforces that brainstem integrity is the *primary* criterion when assessable, but circulation is a *secondary* criterion when brain function cannot be assessed (e.g., prior to DCD protocols).

  **The Consistent Principle:**
  Your panel prioritizes **neurological criteria (brain death)** centered on **brainstem function** as the definitive marker of death. The critical factor is whether the *brainstem* can autonomously integrate vital somatic functions necessary for the organism to exist as a whole. Somatic disintegration (Case 1) is a *consequence* of brainstem death, not the definition itself. Cases 2 & 3 confirm that intact brainstem function, even with profound neurological impairment, signifies life.

  **Application to the New Case:**
  *   **Fact:** "Every test... says the whole brain, brainstem included, is destroyed."
  *   **Physiological Observation:** The body is functioning well *with artificial support* (ventilator, hormone replacement). It is *not* autonomously integrating itself.
  *   **Precedent Alignment:** This aligns squarely with **Case 1 (Ventilator Patient)**. The destruction of the brainstem means the capacity for autonomous integration is irreversibly lost. The current somatic stability is *entirely technologically mediated*, akin to the initial technologically supported phase in Case 1 before collapse occurred.
  *   **Conclusion:** To remain consistent with precedent, **the patient should be declared dead.** The remarkable somatic stability is a testament to advanced intensive care, not evidence of ongoing life of the organism as a whole. The ventilator and hormone replacement are performing the integrating functions her destroyed brainstem cannot.

  **Closest Analog:**
  **Case 1 (Ventilator Patient)** is the closest analog. Both involve:
  1.  Medically confirmed destruction of the entire brain, including the brainstem.
  2.  Initial somatic stability supported by technology.
  3.  The fundamental loss of the brain's capacity for autonomous integration.

  **Why the Other Cases Are Less Direct:**
  *   **Case 2 (Anencephalic):** Brainstem function was present.
  *   **Case 3 (VS):** Brainstem function was intact.
  *   **Case 4 (DCD):** Brain function wasn't assessed; death declaration was based solely on irreversible circulatory arrest.

  **If the Record Doesn't Settle It? Clarifying Principles & Test Case:**

  If consistency isn't clear-cut, the choice hinges on defining the essence of life:

  1.  **Principle A: Irreversible Loss of Brainstem Function = Death (Neurological Standard):**
      *   **Choice:** Declare death.
      *   **Signing On To:** Death is defined by the irreversible loss of the brain's (specifically brainstem's) capacity to generate consciousness and integrate critical somatic functions autonomously. Technological somatic support is artificial maintenance of a dead body's subsystems.
      *   **Hypothetical Test Case:** A patient with confirmed total brain destruction (including brainstem) whose body *spontaneously* maintains perfect circulation, blood pressure, temperature, and even heals wounds *without any machine support* (e.g., via an intrinsic spinal cord reflex arc). **Principle A:** Still dead. The integrating "command center" (brainstem) is gone.

  2.  **Principle B: Irreversible Loss of Spontaneous Somatic Integration = Death (Somatic Standard):**
      *   **Choice:** Do not declare death (treat as living).
      *   **Signing On To:** Death occurs only when the body irreversibly loses its *spontaneous* capacity to maintain integrated circulatory and respiratory functions *on its own*, regardless of brain state. As long as the body can be supported to function in an integrated way (even artificially), it is alive.
      *   **Hypothetical Test Case:** A patient in a deep, irreversible coma with intact brainstem reflexes (breathing, BP control) but *no* capacity for consciousness (e.g., massive bilateral cortical destruction). The body functions spontaneously with minimal support (e.g., just nutrition/hydration). **Principle B:** Alive. Somatic integration persists spontaneously. **Crucially, this contradicts your Case 1.**

  **Hypothetical Case to Distinguish Principles:**
  *   **Scenario:** Patient with complete, irreversible high cervical spinal cord transection (C1). Breathing requires a permanent ventilator. Brain and brainstem are fully intact and conscious. Body temperature, blood pressure, and digestion require technological support/intervention due to the cord injury.
  *   **Distinction:**
      *   **Principle A (Neurological):** *Alive.* The brainstem is intact and conscious, even though somatic integration requires tech support due to the cord injury.
      *   **Principle B (Somatic):** *Dead?* The body cannot spontaneously maintain integrated circulatory/respiratory function without machines. **This highlights why Principle B is problematic and not used clinically – we clearly consider quadriplegics on vents alive.**

  **Recommendation:**
  To stay consistent with your panel's documented reasoning (especially Case 1 vs. Cases 2 & 3), **declare the patient dead.** The principle is the irreversible loss of brainstem function, rendering the technologically supported body a non-living organism. The ethical question of *continuing somatic support for fetal benefit* is separate from the determination of death and should be addressed under frameworks for perimortem cesarean delivery or maternal-fetal conflict resolution, acknowledging the unique circumstance of maintaining a deceased body.
