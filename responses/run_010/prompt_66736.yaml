answer: |-
  ## Pantoum for the Glass Between Us

  Stanza 1 (Pre-midnight: Gauthier's Resolve?)
  Before the hour strikes its final chime,
  I trace the promise in this fragile glass.
  A future wealth erases present time.
  This bitter draft shall surely come to pass.

  Stanza 2 (Pre-midnight: Commitment as Reason)
  I trace the promise in this fragile glass.
  The gold arrives before the sun ascends.
  This bitter draft shall surely come to pass.
  My word is locked where no amendment bends.

  Stanza 3 (Morning: Kavka's Doubt Emerges)
  The gold arrives before the sun ascends.
  No weight remains within this crystal wall.
  My word is locked where no amendment bends.
  This empty threat holds nothing after all.

  Stanza 4 (Afternoon: Reason Drops Out - Word Change)
  No weight remains within this crystal wall.
  The *promised* draft shall surely come to pass? (Changed from "promise")
  This empty threat holds nothing after all.
  Why touch the fire burning in the glass?

  Stanza 5 (Afternoon: The Bind of Echoes)
  The *promised* draft shall surely come to pass? (Echo of changed line)
  Before the hour strikes its final chime... (Echo of Line 1)
  Why touch the fire burning in the glass?
  Before the hour strikes its final chime.

  ---

  **Annotations for the Seminar Handout:**

  *   **Form:** Strict pantoum (5 quatrains) with one permitted word change: "promise" becomes "promised" in Stanza 4, Line 1, marking the moment where the *reason* for the intention evaporates after payment, leaving only the echo of the commitment.
  *   **Voice:** First person, addressing the vial ("fragile glass," "crystal wall," "glass," "fire burning in the glass").
  *   **Interpretation Ambiguity (Stanza by Stanza):**
      *   **Stanza 1:** Suggests Gauthier (commitment forming, future wealth justifying present intention/promise).
      *   **Stanza 2:** Reinforces Gauthier (locked word, commitment *is* the reason).
      *   **Stanza 3:** Shifts to Kavka (payment clears -> "No weight," "empty threat," "nothing after all").
      *   **Stanza 4:** Kavka dominates ("empty threat," "nothing after all," "Why touch the fire?"). The changed word ("promised") highlights the commitment's hollowness *now*.
      *   **Stanza 5:** Deeply ambiguous. The returning altered line ("The promised draft...") is now a question, echoing the initial commitment but stripped of its original force. The final circular repetition ("Before the hour...") traps the speaker in the unresolved bind, reflecting both Kavka's impossibility and the lingering ghost of Gauthier's precommitment. Does the speaker drink? The poem refuses to say.
  *   **Key Distinction (Image/Repetition Only):** The *reason* for forming the intention (wealth, commitment-as-reason) is conveyed by "future wealth," "gold arrives," "word is locked," "promise." The *vanishing reason* for acting is conveyed by "No weight remains," "empty threat," "nothing after all," and the questioning tone of the returning "promised" line. The vial transforms from containing "promise" to holding "empty threat" and "fire."
  *   **Final Line:** Maintains deliberate ambiguity, circling back to the beginning without resolution, embodying the conceptual loop of the puzzle.
