prompt: |-
  In three weeks I give a forty-minute paper, followed by thirty minutes of discussion, at a colloquium co-hosted by our philosophy-of-language group and the law school's private-law faculty. I need a question-period prep sheet: the objections this particular room will raise, in the order they will come, and what I say back. I am not asking for a defense of the paper, and I am not asking for the objections a general audience would give.

  The thesis. Austin's tripartite scheme is almost always read as an anatomy: it tells you what kind of thing you are doing in speaking. I argue it should be read instead as an allocation of liability. Every speech act assigns to some party the cost of the act's failure; I call this the act's custody. Conventions, on this reading, are not recipes for producing acts but standing rules about who absorbs the loss when production goes wrong.

  The argument I will sketch on the board runs in five moves.

  1. Locutionary acts place custody with the speaker's competence. Illocutionary acts place it jointly, by convention. Perlocutionary effects place it nowhere in particular — which is why, on my view, they have no felicity conditions at all, and that absence is explanatory rather than an oversight in the taxonomy.
  2. Infelicities are custody failures of two distinct kinds. What Austin calls a misfire is a case in which the act never entered anyone's custody, so no one can be held to it. What he calls an abuse is a case in which the act did enter custody and binds, though the custodian's own contribution was defective. This is meant to explain something the anatomy reading can only stipulate: why an insincere or unconscientious promise still binds. On my view it binds because the hearer's position has already changed, and that change is not a function of the speaker's inner state.
  3. Uptake is therefore not a psychological state in the hearer — not a belief, and not the recognition of a reflexive intention — but an alteration in the hearer's liability position. To give uptake is to become someone who can be wronged by the act's failure. Uptake so construed is gradable, can be withheld, and can be withdrawn after the fact.
  4. Four consequences I intend to press. (a) Infelicities the standard account treats as all-or-nothing come in degrees: the distance between a promise made in jest and a promise extracted under pressure is a difference in how much liability the hearer has actually taken on. (b) A corporate apology drafted by a communications firm and delivered by an officer can be wholly felicitous with nobody sincere, because custody sits with the corporate person. (c) A chatbot cannot promise — not because it lacks intentions, but because nothing can be held liable for it and nothing's liability position changes when it speaks; the failure is custodial, not mental. This is load-bearing for me, not a flourish, and I expect it to draw fire. (d) The objective theory of contract formation is a custody rule rather than an epistemic rule about what a reasonable person was entitled to believe. On this reading the Pepsi Points litigation over the fighter jet offered for collected loyalty points is not about the offeree's belief but about whether the advertiser ever took the jet into custody.
  5. Finally, I claim the view relocates rather than resolves the standing dispute between the conventionalist accounts in Austin's and Searle's wake and the intention-based accounts in Grice's and Strawson's: intentions matter, but only as the mechanism by which a speaker takes on liability.

  The room, as precisely as I can describe it. About twenty-five people, five of whom will do the talking. Two are committed intention-based theorists of illocutionary force who hold that conventions are at best a heuristic and that force is fixed by the speaker's reflexive intentions; one of them has written on insincerity and thinks my move 2 begs the question against him. One is a contracts scholar who works in formation doctrine and the objective theory and who is deeply allergic to any account that makes legal liability depend on psychological states — she will like the destination of move 4(d) and hate the route. One is a sociolinguist who does conversation analysis of naturally occurring interaction and considers philosophers' invented examples to be fantasy data. One graduate student works on slurs and on what happens when a hearer refuses uptake, and will push hard on whether withholding uptake can ever be legitimate. The rest are students and law faculty without a dog in the philosophy of language.

  Give me the eight or so objections these five people will actually raise, ordered by how much damage they would do to the thesis rather than by how much fun they would be to answer. Each objection should be phrased the way that person would phrase it out loud, in first person, in their own idiom, reaching for the kind of example that person would reach for — the intention theorist will not object in a contracts scholar's vocabulary, and the conversation analyst will not object in either.

  Deliver it in two parts.

  Part one: eight numbered entries, each with exactly these labeled fields.
  - Objector: which of the five, or which coalition of them.
  - Said aloud: the objection in their own words, first person, one or two sentences.
  - Targets: which of my five numbered moves it attacks.
  - Damage: an integer from 1 to 5, plus one sentence saying what I lose if it lands unopposed.
  - Reply: prose I could actually deliver in about ninety seconds, at most 130 words.
  - Soft spot: where that reply is weakest, and whether I should concede it, hold it, or reframe it.

  Part two: one summary table with the columns Rank | Objector | Objection in ten words or fewer | Move targeted | Damage | Hold, concede, or reframe.

  After the table, answer three further questions in a short paragraph each. What single concession should I make in my opening five minutes to take the sharpest edge off the room? Which is the objection I am hoping nobody raises, and what is my fallback if it comes anyway? And which of my five moves is the one I should be prepared to abandon in real time without losing the paper?

  Two constraints. No bibliography, no reading list, and no citations — I want objections and answers, not references to chase. If you reach for a named doctrine, case, or example, confine yourself to ones you are confident are real and correctly characterized; a described scenario is far more useful to me than a possibly invented citation.
reasoning: |-
  Hmm, the user is preparing for a colloquium presentation on Austin's speech act theory with a novel liability-based interpretation. They need a targeted Q&A prep sheet anticipating objections from five specific audience members. The thesis reinterprets locutionary, illocutionary, and perlocutionary acts as custody allocations rather than anatomical categories. 

  The room composition is crucial here. Two intention-based theorists will likely challenge the demotion of psychological states. The contracts scholar will resist any perceived psychologizing of legal liability despite agreeing with the objective theory conclusion. The sociolinguist will demand empirical validation beyond philosophical thought experiments. The grad student working on slurs will probe the ethics of withholding uptake. 

  For the objection mapping, I'll prioritize structural threats. The custody failure argument (move 2) is most vulnerable because it directly confronts intention theorists on their core turf - if they dismantle the "binding without sincerity" claim, the entire liability framework wobbles. The chatbot example (4c) follows closely as it tests custody's applicability to non-persons. 

  The contracts scholar presents an interesting paradox: her approval of 4d's destination means her objection will likely focus on the journey - she'll demand why custody isn't purely legal if it explains legal doctrines. My reply must decouple philosophical custody from courtroom liability without conceding irrelevance. 

  For the sociolinguist, I'll construct an objection about custody's observability in conversation transcripts. The reply should pivot to institutional contexts where liability markers exist (e.g., disclaimers), subtly validating their methodology while expanding its scope. 

  The opening concession should sacrifice move 5's grand unification claim ("relocates rather than resolves") to avoid conventionalist/intentionalist trench warfare. If forced to abandon a move, move 3's liability-as-alteration is most expendable - the core argument survives if uptake remains behavioral rather than metaphysical. 

  The nightmare question would be about custody transfers in indirect speech acts ("Can you pass the salt?"). My fallback position: custody remains with the speaker until conventional markers (like "please") signal hearer assumption of ancillary duties. Not perfect, but preserves the framework.
answer: |-
  Here is your Q&A prep sheet, structured as requested:

  ### Part One: Objections & Replies

  1.  **Objector:** Intention-Based Theorist (specifically the one who works on insincerity)
      *   **Said aloud:** "You're simply assuming what you need to prove. When I insincerely promise to water your plants while secretly planning to let them die, my reflexive intention *is* what binds me – the feeling of obligation arises *because* I intended you to rely. Your 'custody' is just a label slapped on that phenomenology. Move 2 begs the question."
      *   **Targets:** Move 2 (specifically the explanation of insincere promises binding).
      *   **Damage:** 5. If unopposed, it undermines the core explanatory advantage claimed over intention-based views and makes custody seem epiphenomenal.
      *   **Reply:** "The binding force isn't the *feeling* of obligation; it's the *position* you put the hearer in. By uttering the conventional form 'I promise,' you trigger a rule assigning you custody. The hearer *now* relies, plans, or feels entitled. Your secret intention not to water doesn't erase that change in *their* normative landscape. Your subsequent guilt might stem from recognizing *that* alteration, not creating the obligation solely internally. Custody explains *why* the intention has this effect in this context."
      *   **Soft spot:** The link between recognizing the alteration and feeling guilt is assumptive. **Hold:** Emphasize the hearer's altered position as primary.

  2.  **Objector:** Contracts Scholar
      *   **Said aloud:** "If custody is about allocating the cost of failure, and it's not a psychological state, why isn't it *just* legal liability? Your Pepsi Points example (move 4d) ends up at the objective theory – which is purely legal doctrine about manifested assent. Why drag philosophy of language into this? Your 'custody' seems redundant to contract law's existing machinery."
      *   **Targets:** Move 4(d), Foundations (linking custody to legal concepts).
      *   **Damage:** 4. If unopposed, it makes custody seem like a philosophical fiction without explanatory power for the legal context it purports to illuminate.
      *   **Reply:** "Custody is the *philosophical ground* explaining *why* the objective theory makes sense as a *liability* rule, not just an epistemic one. Law needs a normative story for why manifested assent creates obligations. Custody provides that: by publicly undertaking an act with conventional form (like an offer), you take the thing (the jet) into your normative custody; its failure becomes *your* problem to bear the cost of. Law operationalizes this underlying normative structure."
      *   **Soft spot:** Distinguishing philosophical "normative custody" from legal liability is delicate. **Reframe:** Custody is the *reason* legal liability attaches in this way; it's not identical, but it justifies the legal rule.

  3.  **Objector:** Sociolinguist (Conversation Analyst)
      *   **Said aloud:** "Your whole scheme relies on abstract conventions and assignments. But in real talk, how do I *see* custody in a transcript? If someone says 'I guess I kinda promise... maybe?' and the hearer nods, has custody been assigned? To whom? Your model seems too rigid for the negotiated, emergent nature of interaction. Where's the evidence?"
      *   **Targets:** Overall Framework (Conventions, Uptake), Move 3 (Uptake as alteration).
      *   **Damage:** 4. If unopposed, it suggests custody is not empirically observable or relevant to actual language use, undermining its practicality.
      *   **Reply:** "Custody isn't always explicit or binary. Look for *repair* sequences. If the 'kinda promise' fails, who does the hearer hold accountable? Who offers repair ("Sorry, I *said* I'd do it!")? Who bears the social cost? That reveals the *de facto* custody assignment negotiated in that interaction. Conventions provide default starting points ('I promise' strongly suggests speaker custody), but negotiation happens *within* that liability framework. The gradability in move 4(a) acknowledges this."
      *   **Soft spot:** Requires accepting normative accountability as the observable trace of custody, which might feel interpretive. **Hold:** Frame repair and accountability as key data points.

  4.  **Objector:** Both Intention-Based Theorists
      *   **Said aloud:** "Your chatbot example (move 4c) proves too much. If a corporation (a legal fiction) can hold custody and apologize sincerely through an officer, why can't a well-designed AI system, governed by user agreements assigning liability to the company, 'promise' on that company's behalf? You've shown corporate custody works, so why not AI-as-agent?"
      *   **Targets:** Move 4(c) (Chatbot cannot promise).
      *   **Damage:** 4. If unopposed, it collapses a key distinction (human vs. AI) crucial to the thesis and suggests corporate custody analogizes directly to AI.
      *   **Reply:** "The corporation is a *recognized legal person* capable of bearing liability; its officer is a *human agent* acting *for* it. The AI itself isn't a person and cannot *be* held liable or act *as* an agent with normative standing. The user agreement assigns liability *to the company*, not to the AI. The AI is the *tool* the company uses, like a faulty printer causing a breach. The promise is still made *by the company*, using the AI as its mouthpiece, taking custody itself. The AI doesn't *do* the act."
      *   **Soft spot:** The line between "tool" and "agent" can be blurry with advanced AI. **Hold:** Emphasize the necessity of recognized personhood for *being* the custodian, not just the tool triggering the company's custody.

  5.  **Objector:** Graduate Student (Slurs/Uptake)
      *   **Said aloud:** "If uptake is becoming someone who *can* be wronged (move 3), and withholding it prevents that change, does that mean targets of slurs who defiantly refuse to be hurt are somehow avoiding the harm? That seems victim-blaming. Isn't the harm in the attempt to subordinate, regardless of my uptake?"
      *   **Targets:** Move 3 (Uptake as alteration).
      *   **Damage:** 3. If unopposed, it suggests the custody view cannot handle paradigmatic harmful speech acts or misunderstands their harm.
      *   **Reply:** "Absolutely not. A slur is first a locution (custody: speaker's competence for correct/incorrect use) and an illocutionary act of derogation/subordination. The *attempt* to subordinate places custody *on the speaker* for the act of derogation itself – it's infelicitous (abusive) if they lack standing/authority, but the *attempt* can still cause harm. The *perlocutionary* effect of feeling subordinated or harmed is distinct. Withholding uptake might mean rejecting the *legitimacy* of the subordination, refusing to *accept* the assigned inferior position, but it doesn't magically erase the assault or the speaker's culpability *for making it*."
      *   **Soft spot:** Distinguishing the illocutionary force (attempted subordination) from perlocutionary effect (feeling subordinated) is critical but subtle. **Hold:** Emphasize speaker custody for the *act* of derogation.

  6.  **Objector:** Intention-Based Theorist (General)
      *   **Said aloud:** "Conventions are inert without minds. You say illocutionary custody is assigned 'by convention,' but conventions only exist because we *intend* them to mean things. Reflexive intentions are the engine; conventions are just the tracks. Your custody is a derivative effect, not the core."
      *   **Targets:** Overall Framework (Role of Conventions vs. Intentions), Move 2.
      *   **Damage:** 3. If unopposed, it relegates custody to a secondary byproduct, undermining its foundational status.
      *   **Reply:** "Tracks *channel* the engine's power and *direct* its force. Without the convention, the intention alone couldn't create the *specific* normative effect (e.g., obligation in promising). The convention *is* the rule saying 'If this form is used, *this* party takes custody.' The intention might initiate the utterance, but the convention dictates *what normative shift occurs* and *who bears the cost* if it fails. The engine without tracks goes nowhere specific; the intention without convention doesn't create this *specific* liability."
      *   **Soft spot:** Conceding intentions are necessary for *initiating* the act. **Concede:** "Intentions are crucial for *invoking* the convention, but the convention *defines* the liability structure activated."

  7.  **Objector:** Contracts Scholar (Follow-up)
      *   **Said aloud:** "Even granting your 'normative ground' point, how does custody explain *variation* in legal liability rules? In some promissory estoppel cases, reliance creates obligation without formal offer/acceptance. Does 'custody' just flex to fit whatever doctrine I point to? Where's its predictive bite?"
      *   **Targets:** Move 4(d), Explanatory power.
      *   **Damage:** 3. If unopposed, it makes custody seem ad hoc or unfalsifiable in the legal domain.
      *   **Reply:** "Custody explains the *default, paradigmatic* structure: formal offer places the thing (performance) in offeror's custody. Promissory estoppel arises when the *hearer*, through reasonable reliance, *takes on* a kind of custody *themselves* – the cost of *their* reliance now falling is the loss. The doctrine resolves a custody *dispute* created by the speaker inducing reliance outside the formal convention. It shows custody *can* be induced non-conventionally, but the core concept – who bears the cost of failure – still applies, it's just assigned differently based on conduct, not just form."
      *   **Soft spot:** Explaining non-standard cases requires stretching the model. **Reframe:** Custody rules can be complex and context-dependent, but the *question* of "who bears the loss?" is always central.

  8.  **Objector:** Sociolinguist / Graduate Student (Coalition on Uptake)
      *   **Said aloud:** (Sociolinguist) "How is 'alteration in liability position' observable before a failure occurs? In conversation, people display understanding or acceptance continuously." (Grad Student) "And if uptake is gradable and withdrawable, how can a promise ever be secure? This seems to make all commitments terrifyingly fragile."
      *   **Targets:** Move 3 (Nature of Uptake).
      *   **Damage:** 2. If unopposed, it makes uptake seem vague or impractical, weakening the account of how custody is established.
      *   **Reply:** "The 'alteration' is a normative status, not (just) a psychological state. Observable acceptance signals it ('Okay, thanks!'), but the *status* is what matters. Withholding visible acceptance *can* block it ("Don't promise me that!"). Gradability reflects partial reliance ("I'll tentatively plan on it"). Withdrawal is difficult and itself a normative act with costs (breaking trust), making commitments reasonably stable *because* withdrawal is costly, not because uptake is an atomic, irrevocable mental event. Security comes from the *costs* of violating the norm, not the metaphysics of uptake."
      *   **Soft spot:** Defining the normative status independently of observable markers is tricky. **Reframe:** Observable markers are *evidence* of the normative shift; the shift itself is the change in what obligations/entitlements exist *between* the parties.

  ### Part Two: Summary Table

  | Rank | Objector                     | Objection (10 words or fewer)                     | Move Targeted | Damage | Strategy      |
  | :--- | :--------------------------- | :------------------------------------------------ | :------------ | :----- | :------------ |
  | 1    | Insincerity Intention Theorist | Move 2 begs question: intention creates binding.  | 2             | 5      | Hold          |
  | 2    | Contracts Scholar            | Custody = Redundant to legal liability?           | 4d            | 4      | Reframe       |
  | 3    | Sociolinguist                | Where's custody in real conversation data?        | Overall/3     | 4      | Hold          |
  | 4    | Intention Theorists          | AI can promise if corp. can (via custody).        | 4c            | 4      | Hold          |
  | 5    | Grad Student (Slurs)         | Refusing uptake avoids slur harm? Victim-blaming?| 3             | 3      | Hold          |
  | 6    | Intention Theorist (General) | Conventions inert without intentions as engine.   | Overall/2     | 3      | Concede/Hold  |
  | 7    | Contracts Scholar (Follow-up)| Custody flexes to fit any doctrine? No prediction.| 4d            | 3      | Reframe       |
  | 8    | Sociolinguist / Grad Student | Uptake: How observed? Why not fragile?            | 3             | 2      | Reframe       |

  ### Further Questions

  1.  **Opening Concession:** Concede explicitly in your opening that intentional states are *causally necessary* for human speakers to *initiate* acts that invoke conventions and trigger custody assignments. ("Of course, a comatose person can't promise; intentions are the spark.") This directly addresses the Intention Theorists' core concern and disarms the "begging the question" charge slightly by acknowledging their necessary component. It sharpens the focus on custody as the *normative mechanism* activated *by* that spark via convention, not the spark itself.

  2.  **Hoped-No-One-Raises & Fallback:** The objection you most hope isn't raised is: **"Can custody be transferred unintentionally? If I casually say 'Yeah, sure, I'll fix your car Saturday' without thinking, and you seriously rely, have I taken custody despite lacking any reflexive intention to promise?"** (Targets Move 2/4a, Damage 4). Your fallback: "This highlights the gradability (Move 4a) and the role of conventional form. Uttering words strongly associated with a custodial act (like 'I'll fix it') *prima facie* assigns custody, *because* that's the convention. The speaker's *lack* of serious intention might mitigate the *degree* of liability or constitute an abuse, but the hearer's reasonable reliance, triggered by the conventional form, means the speaker *has* taken on *some* custodial burden for the failure. The cost is shared based on reasonableness."

  3.  **Move to Abandon:** Be prepared to soften or partially abandon **Move 3 (Uptake as specific alteration in liability position)** if pressed hard, especially on observability or fragility. You could retreat to: "Uptake is the hearer's necessary (but potentially gradable and defeasible) *acknowledgment* or *recognition* that triggers or completes the *speaker's* assumption of custody." This preserves the core of custody residing with the speaker for illocutions and makes uptake more about validating the speaker's act than the hearer undergoing a metaphysical shift. The key arguments about insincere promises (2), corporate custody (4b), chatbots (4c), and objective contract theory (4d) survive largely intact.
