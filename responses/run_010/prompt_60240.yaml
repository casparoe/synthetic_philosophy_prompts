  | **1. Core Book** | 36mo, 210 loans. PD=4%, recovery=60%. **Limit**: Data from "strong freight" period; PD may be understated. | How to adjust for non-stationary PD? | PD point (4%), LGD point (40%) | 2.27% | $500,000 | Ticket size cap ($500k) | Fund at $500k. **Current book**: $20M exposure = 90.9% of NW. Kelly-optimal for book = 100% → **under-committed**. | PD (if PD rises to 5%, EV turns negative) | Discounting (used d=1.0; judgment if PD is understated) | Can't validate PD stability; assumes no correlation shift. |
