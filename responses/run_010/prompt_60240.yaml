  ### Decision Procedure for Bet Sizing in Credit Underwriting

  **Procedure Overview**:  
  This procedure adapts the Kelly criterion for credit lending, emphasizing growth-rate optimization, uncertainty discounting, correlation, and repeatability. It is structured as 10 sequential questions, with explicit adequacy conditions and referral points. Judgment calls are flagged. Net worth = $22M.

  ---

  **Ordered Decision Procedure**:

  1. **Repeatability Check**  
     - *Question*: Is this bet repeatable (i.e., can we make many similar bets over time with adjustable stakes)?  
     - *Adequacy*: If non-repeatable, skip to Step 9.  
     - *Judgment*: Defining "similar" (e.g., same collateral/borrower profile).  
     - *Referral*: If non-repeatable, proceed to Step 9 for one-off allocation.

  2. **Probability Estimation**  
     - *Question*: Provide point estimates, intervals, or distributions for PD (default probability) and LGD (loss given default = 1 - recovery).  
     - *Adequacy*: At least an interval for PD and LGD must be provided. Decline if missing.  
     - *Rule for Intervals*: Use midpoints for calculations; discount later for width (Step 4).  
     - *Judgment*: Analyst must assign intervals if point estimates are unjustifiable.

  3. **Expected Value (EV) Positivity**  
     - *Question*: Is EV = (1 - PD) × interest - PD × LGD > 0?  
     - *Adequacy*: Decline if EV ≤ 0 (unfavorable bet).  
     - *Calculation*: Uses midpoint if intervals given.  
     - *Referral*: If EV borderline (e.g., 0–1%), escalate to credit officer.

  4. **Full Kelly Stake Calculation**  
     - *Question*: Compute full Kelly fraction:  
       \( f^* = \frac{(1 - \text{PD}) \times \text{interest} - \text{PD} \times \text{LGD}}{\text{interest} \times \text{LGD}} \)  
     - *Adequacy*: \( f^* \) must be positive (implied by EV > 0).  
     - *Cap*: \( f^* \) capped at 1.0 (cannot exceed 100% of bankroll).  
     - *Judgment*: Formula assumes binary outcomes; may misestimate for non-binary risks.

  5. **Uncertainty Discount**  
     - *Question*: Apply discount factor \( d \) to \( f^* \) based on input confidence:  
       - Point estimate + large sample (>100 obs): \( d = 1.0 \)  
       - Point estimate + small sample/expert judgment: \( d = 0.7 \)  
       - Interval: \( d = \max\left(0.3, 1 - \frac{\text{PD}_{\text{high}} - \text{PD}_{\text{low}}}{2 \times \text{PD}_{\text{mid}}}\right) \)  
     - *Output*: Discounted stake \( f_d = d \times f^* \).  
     - *Judgment*: Discount scaling is heuristic; analyst must assess "sample quality."

  6. **Correlation Adjustment**  
     - *Question*: Assign to a correlated group (e.g., trade/geography). Is total exposure (current + new) ≤ group cap (10% of net worth)?  
     - *Rule*: Loan size = min( \( f_d \times \text{net worth} \), group cap - current exposure ).  
     - *Judgment*: Group definitions and cap are subjective; escalate if cap binds.

  7. **Minimum Size Check**  
     - *Question*: Is loan size ≥ $30,000 and ≥ 0.1% of net worth?  
     - *Adequacy*: Decline if below both. Use $30,000 floor if above $30K but below 0.1%.  
     - *Referral*: If decline floor binds, notify credit officer.

  8. **Sign-off Threshold**  
     - *Referral*: Escalate to credit officer if:  
       - Loan size > 2% of net worth,  
       - \( d \leq 0.5 \) (high uncertainty),  
       - Correlation cap binds, or  
       - EV borderline (from Step 3).

  9. **Non-Repeatable Bet Allocation**  
     - *Question* (for one-offs): Is EV > 0? If not, decline.  
     - *Rule*: Max loss = loan size × LGD ≤ 5% of net worth.  
       Loan size = min(requested, \( \frac{0.05 \times \text{net worth}}{\text{LGD}} \)).  
     - *Adequacy*: Requires LGD point estimate.  
     - *Judgment*: 5% cap is arbitrary; LGD uncertainty ignored.  
     - *Referral*: Always escalate (values/tolerance decision).

  10. **Final Output**  
      - Commitment = loan size (dollar and % of net worth).  
      - Binding constraint identified (e.g., group cap, uncertainty discount).  
      - Terminate if declined or referred.

  ---

  ### Application to Three Cases  
  **Key Common Inputs**:  
  - Net worth = $22,000,000  
  - Interest rate = 19% (all cases)  
  - LGD = 40% (unless specified)  
  - Current core trade exposure = $20,000,000 (assumed for Cases 1–2)  
  - Available capital = $2,000,000 (net worth - current exposure)  

  **Table of Results**:  

  | Case | Evidence & Limits | Unanswerable Question | Input Representation | Commitment (% of NW) | Commitment ($) | Binding Constraint | Verdict | Most Sensitive Input | Referred for Judgment | Cannot Decide |
