  ### Assumption Register

  | Assumption | How Book Violates It | Procedure's Correction | Correction Type |
  |------------|----------------------|------------------------|----------------|
  | **Known probabilities** | PD/LGD estimated from finite or non-stationary data (e.g., Case 1’s "strong freight" bias). | Uncertainty discount (Step 5) based on sample quality/interval width. | Quantitative (discount factor) + Judgment (sample assessment). |
  | **Repeatability** | Non-repeatable bets exist (e.g., Case 3). Core book loans are "repeatable" but may have autocorrelation. | Step 1 diverts one-offs to loss-cap rule (Step 9). | Judgment (defining repeatability) + Quantitative (loss cap). |
  | **Independent bets** | Loans correlate within trades/macro factors (e.g., freight rates affect all core loans). | Correlation groups + caps (Step 6). | Judgment (group definition) + Quantitative (10% cap). |
  | **Adjustable stakes** | Ticket sizes ($30k–$500k) constrain fractional Kelly stakes; reinvestment delayed by loan terms. | Minimum size check (Step 7); Kelly output capped by ticket size. | Quantitative (floor/caps) + Judgment (reinvestment lag ignored). |
  | **No capital constraints** | Warehouse line "untouchable"; available capital limits new loans (e.g., Cases 1–3). | Available capital implicitly caps commitments. | Judgment (not explicit; relies on analyst input). |
  | **Logarithmic utility** | LPs think in arithmetic mean; Kelly maximizes geometric mean. | Procedure overrides LP preference; uses Kelly by default. | Values-based (credit officer’s mandate). |

  ---

  ### Key Insights from Applications  
  1. **Core Book (Case 1)**:  
     - Kelly recommends 100% bankroll allocation due to high historical EV, but practical caps (ticket size, group limits) restrict individual loans to $500k.  
     - **Verdict**: Under-committed relative to Kelly-optimal book (90.9% vs. 100%), but vulnerable to PD increases. Strong freight data → **judgment needed on PD stability**.

  2. **New Trade (Case 2)**:  
     - Wide PD interval (2–15%) forces high uncertainty discount (\( d = 0.3 \)). Midpoint PD (8.5%) yields positive EV, but low confidence requires referral.  
     - **Verdict**: Escalate due to uncertainty. Sensitivity to PD → **judgment needed on whether to trust midpoint**.

  3. **Distressed Portfolio (Case 3)**:  
     - Kelly criterion **does not apply** (non-repeatable). Loss-cap rule allows $2M investment (5% of NW), but capital and LGD uncertainty force referral.  
     - **Verdict**: Criterion inapplicable. LPs’ arithmetic-mean appeal conflicts with growth optimization. **Judgment needed on risk tolerance and "max loss" definition**.

  ### Final Notes  
  - **What the Procedure Cannot Do**:  
    - Handle correlated bets across groups (e.g., systemic risk).  
    - Quantify tail risks for one-offs (Case 3).  
    - Adjust group caps dynamically based on macro factors.  
  - **Credit Officer’s Role**:  
    - Overrule/recalibrate when assumptions violate (e.g., PD non-stationarity in Case 1).  
    - Set loss tolerance for one-offs (Case 3).  
    - Define correlation groups and caps.  

  This procedure systematizes sizing but exposes critical judgments. It prioritizes capital preservation under uncertainty, aligning with ergodicity concerns.
