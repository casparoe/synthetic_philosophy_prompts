prompt: |-
  So I sit on the panel for a small regional arts fund — six of us plus the funder's rep who joined last year, and ten or twelve applications a round. The pot is fixed and gets handed out in tiers down a ranked list: top three get the big grants, next few get medium, the rest get nothing. So we don't just need a winner, we need a complete ordering of everything, every round, and the funder wants the same method used across all their panels.

  For years we just had everyone write 1 through 12 and we averaged the numbers. Two complaints finally boiled over. Last round a hopeless application came in that nobody ranked better than ninth, and somehow its presence shuffled which two projects got the top tier — the projects themselves didn't change, nobody's opinion of them changed, just this one dud in the mix. And separately our chair runs head to head votes between pairs when we deadlock, and one reviewer did the math and noticed that if the chair changes the order those votes happen in, a different project wins. She isn't accusing him of anything but everyone's spooked. I'm also pretty sure two people have started ranking dishonestly to keep a project they hate off the list.

  Heres the mess. The funder's compliance handbook has three rules. If all seven of us rank A above B, the final list has to rank A above B. Whether A lands above B can't depend on how any of us ranked some other application. And no single panelist can be in a position to determine the list by themselves. The chair wants to write to the funder and ask them to drop one of the three, and its landed on me to say which one and why. Worth noting the rep votes with the chair every single time, which I suspect makes rule three more delicate than it looks.

  Meanwhile a vendor is pitching a proprietary scoring system and swears that with it nobody can ever gain by lying on their ballot and that it always picks whichever project beats all the others in head to head matchups. And a friend says I'm overthinking the whole thing, that all that stuff about it being mathematically impossible to be fair only applies to big electorates and we're seven people.

  What should we actually run next round? Which of the funder's rules do I ask them to give up, and what's the honest argument for that one over the other two — including what we'd be signing up for once it's gone? Is there anything I can look for in the ballots we already have, some pattern in how our seven rank things, that would mean the problem just doesn't apply to us? And how am I supposed to tell whether a claim like the vendor's is a real fix or sales nonsense, without a mathematician on call.
reasoning: |-
  Okay, let me try to unpack this user's problem. They're part of a seven-person panel for an arts fund that ranks applications from 1 to 12 and averages the ranks to decide who gets funded. But they've run into issues: a weak application affected the ranking of others, the chair's tie-breaking method changes outcomes based on vote order, and there's suspicion of strategic voting. The funder has three rules: unanimity must be respected, independence of irrelevant alternatives (IIA), and no single voter dictation. 

  Hmm, the user needs to recommend which rule to drop and what voting method to use next. First, I recall Arrow's theorem says no system can satisfy all three rules when ranking three or more options. Since they have 12 applications, they're stuck with that impossibility. The vendor claims their system avoids strategic voting and always picks the Condorcet winner, but that sounds too good to be true.

  Looking at their current average-rank method: it violates IIA because adding a "dud" changed the rankings. The head-to-head voting issue shows non-transitivity, where A beats B, B beats C, but C beats A. If the chair's vote order affects outcomes, that's a serious flaw. Also, the funder's rep always siding with the chair might create a de facto dictator if they coordinate, threatening rule three.

  The user mentioned two panelists might be ranking dishonestly. That suggests strategic voting is already happening. With only seven voters, the no-dictator rule might be more fragile, especially with the chair and rep aligning votes. 

  Now, which rule to sacrifice? Unanimity seems essential—everyone agrees A beats B, so A should be higher. Dropping that would be unjustifiable. The no-dictator rule is also critical for fairness. IIA is the most commonly sacrificed in real systems. For example, Borda count (like their average-rank method) fails IIA but is otherwise straightforward. However, the dud application problem is a direct result of violating IIA.

  But Condorcet methods might work better. They use pairwise comparisons and respect unanimity. The Condorcet winner should top the list. But they can have cycles, like A>B, B>C, C>A. The vendor claims their system handles that and prevents strategic voting, but I'm skeptical. Methods like Ranked Pairs or Schulze resolve cycles but are complex. The vendor's "proprietary" system raises red flags—it might not be transparent, and their claims could be exaggerated.

  With seven voters, cycles might be rare, but possible. The user could check past ballots for cycles. For each pair, count how many ranked A over B. If there's a clear Condorcet winner in past rounds, that's good. If cycles happened, they need a resolution method. The chair's current tie-breaker is arbitrary, causing distrust. A defined method like Ranked Pairs would be better.

  Strategic voting is harder to prevent. No ranked system is fully strategy-proof. Condorcet methods might be less manipulable in small groups, but it's not guaranteed. The vendor's claim of no incentive to lie might be overselling.

  For the rules, dropping IIA is the least bad option. The argument is: IIA is mathematically impossible to keep with other fairness criteria. Sacrificing it allows methods like Borda or Condorcet that work reasonably well. Unanimity and no-dictator are fundamental to fairness. Also, IIA violations might be manageable if the panel avoids adding clearly irrelevant options.

  The funder's rep always voting with the chair is problematic. It means two votes are aligned, reducing independence. If they always agree, they effectively act as a bloc, which could make them potential dictators if they control the vote. That undermines rule three. The panel should discuss this issue separately.

  Recommendation: Switch to a Condorcet method like Ranked Pairs. It respects unanimity, avoids single dictators (usually), and minimizes IIA violations. The cycles can be resolved systematically. Check past ballots for Condorcet winners and cycles. If rare, it's a good fit. If common, maybe combine with Borda as a backup.

  The vendor's system should be approached cautiously. Ask for a trial with past data to see if results differ. Demand transparency on how it resolves cycles and handles strategy. Proprietary black boxes are risky.

  For the funder, propose dropping IIA with the explanation that it's the only feasible compromise. Emphasize that other rules are preserved, and the alternative is continued ranking errors and distrust. Suggest a pilot with the new method before full adoption.

  The user's friend is wrong—Arrow’s theorem applies regardless of size. With seven voters, cycles and strategy are still possible, though perhaps less frequent. Small groups aren't immune.
answer: |-
  Based on your situation and the constraints of Arrow's Impossibility Theorem (which absolutely applies to small groups like yours - your friend is mistaken), here's a clear path forward, balancing realism, fairness, and compliance:

  **1. Which Rule to Ask the Funder to Drop:**  
  **Drop Rule 2: Independence of Irrelevant Alternatives (IIA).**  
     - **Why this one?**  
       - **Mathematical Necessity:** Arrow's Theorem proves IIA is incompatible with unanimity, non-dictatorship, and reasonable ranking systems for ≥3 options. Keeping it guarantees perpetual failure.  
       - **Your "Dud Application" Incident:** This was a direct IIA violation—a weak application changed rankings despite unchanged preferences. IIA is the most brittle rule in practice.  
       - **Less Damaging Sacrifice:** Unanimity (Rule 1) is ethically non-negotiable (if all agree A>B, A should win). Non-dictatorship (Rule 3) is critical for legitimacy. IIA’s failure is often manageable with the right method.  

     - **What You're Signing Up For:**  
       - Rankings *might* shift when weak/strong applications are added/removed, but a robust voting method (see below) minimizes this.  
       - Requires educating the panel that "consistency across contexts" is impossible—focus shifts to accurately reflecting head-to-head preferences.  

  **2. What Voting Method to Use Next Round:**  
  **Adopt a Condorcet Method (e.g., Ranked Pairs or Schulze).**  

     - **How it Works:**  
       - Each panelist submits a full ranking ballot (1st, 2nd, 3rd, etc.).  
       - For every possible pair of applications (e.g., A vs B), count how many panelists ranked A above B. If >50% prefer A, A wins the pairwise matchup.  
       - The method aggregates these pairwise results into a full ranking, resolving cycles (e.g., A>B, B>C, C>A) fairly.  

     - **Why Condorcet?**  
       - **Solves Your Chair's Tie-Break Problem:** It uses *all* pairwise data simultaneously, eliminating arbitrary vote sequencing.  
       - **Respects Unanimity & Non-Dictatorship:** If all prefer A>B, A will always rank higher. No single voter can force an outcome alone.  
       - **Minimizes Strategic Incentives:** Harder to manipulate than averaging (Borda count), as it focuses on broad consensus.  
       - **Condorcet Winner Focus:** If an application beats *every* other head-to-head, it ranks first—addressing the vendor's claim organically.  

     - **Practical for Your Panel:**  
       - Free/open-source tools like [CIVS Ranked Pairs](https://civs.cs.cornell.edu/) automate calculations.  
       - Ballots look identical to your current ones—no retraining needed.  

  **3. Checking Past Ballots for Cycles:**  
  To assess if Condorcet is viable *for your group*, analyze historical ballots:  
     - For each application pair (A/B, A/C, B/C, etc.), calculate how many panelists ranked each higher.  
     - Check for a **Condorcet Winner**: An application that beats all others head-to-head. If one exists in past rounds, Condorcet methods are ideal.  
     - Look for **Cycles**: E.g., 4 prefer A>B, 4 prefer B>C, but 5 prefer C>A. If cycles are rare (common in small groups with shared values), Condorcet works well. If frequent, Ranked Pairs still resolves them objectively.  

  **4. Vendor Claims: Sales Nonsense or Real Fix?**  
  **Assume it's Nonsense Unless Proven Otherwise.**  
     - **Red Flags:**  
       - "Proprietary" systems lack transparency. Arrow's Theorem implies their claims **can't all be true**.  
       - "Nobody can gain by lying" is likely false—[Gibbard-Satterthwaite Theorem](https://en.wikipedia.org/wiki/Gibbard%E2%80%93Satterthwaite_theorem) proves no ranked system is fully strategy-proof.  
       - "Always picks the Condorcet winner" is possible, but resolving cycles fairly without violating other rules is the challenge.  
     - **How to Verify Without a Mathematician:**  
       - Ask for a *free trial* using last round's ballots. Compare results to your current method and Condorcet.  
       - Demand specifics: "How do you resolve cycles? Show me a mathematical proof of strategy-proofness."  
       - If they evade, it’s snake oil. Stick with established methods like Ranked Pairs.  

  **5. Addressing the Chair/Rep Alliance:**  
  This jeopardizes **Rule 3 (Non-Dictatorship)**. If the chair + rep *always* vote identically, they act as a bloc with 2/7 votes—potentially decisive in close splits. Solutions:  
     - Privately discuss with the chair: Can the rep vote independently? If not, disclose the bloc to the funder.  
     - Use a Condorcet method (less sensitive to blocs than averaging).  
     - If the bloc persists, explicitly treat them as a single "voter" for Rule 3 compliance.  

  **Recommended Action Plan:**  
  1. **Write to the Funder:** Request to drop IIA (Rule 2). Argue:  
     - *"Mathematical impossibility makes Rule 2 incompatible with fair rankings. Our current method fails when weak applications alter outcomes despite unchanged preferences. Dropping IIA allows adoption of a Condorcet system, which better reflects true panel consensus, respects unanimity, prevents dictatorship, and eliminates arbitrary tie-breaks."*  
  2. **Run a Condorcet Method (Ranked Pairs) Next Round:**  
     - Use free online tools for easy tallying.  
     - Preserve full rankings to audit for cycles/strategic voting.  
  3. **Audit Past Ballots** for Condorcet Winners/Cycles to reassure the panel.  
  4. **Reject the Vendor** unless they provide verifiable, transparent proofs.  

  **The Bottom Line:** Your panel’s issues stem from an impossible mandate. By dropping IIA and switching to Ranked Pairs (or Schulze), you’ll minimize ranking paradoxes, reduce manipulation incentives, and legitimize outcomes—while keeping unanimity and non-dictatorship intact. The chair/rep dynamic needs monitoring, but Condorcet methods are your most robust solution.
