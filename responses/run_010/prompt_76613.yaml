  Starting with the diagnosis: The rich-content philosophers link penetration to rich perception and will see the thesis as undermining that. They need assurance that rich perception doesn't require penetration. The epistemologists care about perceptual justification's independence. They'll want to know if the user's view impacts internalism. The philosopher of science will think the user is ignoring theory-ladenness history. They need acknowledgment of that tradition. The grad student wants replication and controls; they'll need specifics on study designs.

  For objections, I'll list the most damaging and likely. For example, the rich-content philosopher might argue that attention is cognitive, so the thesis excludes genuine cases. The reply would be to distinguish endogenous attention from cognitive states with content. This is soft if attention is inherently cognitive. Another objection: the user's criteria for penetration are impossible to meet. Reply: studies can use priming or subliminal cues. Soft if such controls fail.

