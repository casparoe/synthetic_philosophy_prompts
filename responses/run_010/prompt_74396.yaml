  Infinitism likely sides with the coherentist here since it demands justificatory chains the operator can't provide. The structural key is the calibration holiday - remove that and coherence is restored. 

  For coherentist counterarguments: First, they might claim the holiday closure belief actually constitutes a local defeater. Second, they could argue foundationalism implicitly relies on reliability rather than pure structure. Both are substantive critiques worth including. 

