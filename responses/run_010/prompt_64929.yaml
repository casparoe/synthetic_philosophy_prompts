prompt: |-
  I have no academic training in this. For nine years I have sat on a small town committee that divides a fixed annual pot between programs — shelter beds, a youth clinic, road work that mostly benefits commuters — and our meetings run almost entirely on anecdotes. I have come to think the real disagreement is about a rule for combining what different people gain and lose into a single ordering, and that this is a formal subject with a theorem at its center, roughly: if each person's preferences over gambles can be represented by expected utility, and the group's can too, and the group never distinguishes between two gambles that every person is indifferent between, then the group's utility must be a weighted sum of the individuals', with positive weights. That is my recollection of Harsanyi's result and I may have it slightly wrong; correct me where I have.

  What I want first is the specification. What must any rule of this kind deliver to count as adequate — adequate, that is, for a body that has to produce an ordering and defend it to the people on the losing end of it? Give me the requirements, each with the situation that motivates it, since a requirement with no case behind it is only a taste. Mark which are non-negotiable and which are the commitments of one camp.

  The situations I keep running into:

  1. Two members describe the same improvement as a seven and a four. Must the ordering be invariant to how each person's scale is anchored and stretched? If so, what has that assumed about comparing one person's level to another's — and does the theorem establish that comparability or quietly presuppose it?

  2. A coin flip everyone prefers in advance, which afterward leaves one household much worse off and another much better off. Must the group's ranking of the gamble track everyone's advance ranking, and must it also track the sum of what people actually end up with? Can both be demanded at once?

  3. A proposal that gives four hundred households a small benefit and ruins one. Must the rule always return a verdict, or may it declare two options incomparable — and if the latter, is that candor or abdication?

  4. A proposal that raises the total by drawing in new residents whose lives are worth living but sit well below the current level. Is a fixed population part of the brief, or must an adequate rule handle this too?

  5. A longtime shelter resident who reports being content, and a man whose satisfaction depends on other people's setbacks. Does the rule take gains as reported, or adjust them? If it adjusts, by what standard, and does the adjustment smuggle back the very comparisons it was meant to replace?

  6. What makes the weights equal rather than merely positive? Is equal weighting a consequence of the setup or a further commitment, and exactly what must be added to get it?

  7. May the rule notice that a gain arrived through an injustice, or must it be blind to everything except levels of well-being?

  Then tell me which subsets of your own requirements cannot all be satisfied together. I want to know whether this is a shopping list or an impossibility result wearing a shopping list's clothes; if some subset is jointly unsatisfiable, say which condition should be dropped and what dropping it costs. Then name the single requirement that knocks out the most candidates. Finally, briefly — a short paragraph each, no more — how three contenders fare against the list: equal-weight summation of realized well-being; a rule that weights gains to the worse-off more heavily; and the rule that identifies the group's ordering with the ordering of the equal-chance gamble over being each person. No references and no reading list: I cannot look anything up, and I would rather have nothing than a guess at a source.
reasoning: |-
  Okay, the user is on a small town committee that allocates a fixed annual budget between various programs. They've been dealing with this for nine years and notice that decisions are largely based on anecdotes. They recall Harsanyi's theorem about aggregating individual utilities into a group decision but want to understand the formal requirements for such a rule. They've provided seven specific situations they encounter and want to know what makes a rule adequate, which requirements are essential, and if some requirements conflict.

  First, I need to recall Harsanyi's Social Aggregation Theorem. It states that if individuals and the group have preferences that can be represented by expected utility, and the group respects unanimous indifference, then the group's utility must be a weighted sum of individual utilities with positive weights. The user might have this right but needs clarification on the axioms.

  The user's scenarios highlight key issues in social choice theory. Let me break down each situation to identify the underlying requirement:

  1. **Interpersonal Comparability**: When two members rate an improvement differently (7 vs 4), the rule needs to handle how individual utilities are scaled. This touches on whether utility is cardinal and comparable across people. Harsanyi assumes cardinal unit comparability.

  2. **Ex-ante vs Ex-post**: A coin flip gamble that everyone prefers initially but leaves some worse off. Should the group's ranking follow the pre-gamble preference or the sum of outcomes? This involves the Pareto principle and whether the rule satisfies both ex-ante and ex-post efficiency.

  3. **Non-aggregation Cases**: A small benefit to many versus ruin for one. This tests whether the rule can handle strong conflicts and if it allows incomparability. Some approaches like Pareto or majority voting might fail here, requiring a complete ordering.

  4. **Variable Population**: Including new residents with lower welfare. Does the rule apply only to fixed populations? This extends to theories like total utilitarianism vs. average, affecting whether new members are included in the sum.

  5. **Utility Validity**: Content shelter resident vs. someone who gains from others' losses. Should utilities be taken as is or adjusted? This questions what constitutes valid well-being and if adaptations like envy or malice should count.

  6. **Equal Weights**: How do we justify equal weights instead of positive ones? This requires symmetry or anonymity assumptions, which are additional normative commitments.

  7. **Non-Welfarist Factors**: Should historical injustices affect the decision? Pure welfarism ignores causes, but some argue for incorporating fairness or rights.

  Now, the user wants to know which requirements can't coexist. The main conflict is between **Strong Pareto** and **Anonymity** when combined with **Non-Dictatorship**. If we require that everyone's improvements are valued (Pareto) and all individuals are treated equally (Anonymity), but avoid a single person dictating outcomes (Non-Dictatorship), Arrow's theorem shows this is impossible for ordinal preferences. Harsanyi avoids this by using cardinal utilities and interpersonal comparisons.

  Another conflict is between **Ex-ante Pareto** and **Ex-post Pareto**. If individuals prefer a gamble ex-ante, but after the outcome, some are worse off, the group might not satisfy both at the same time. Harsanyi's theorem assumes expected utility, which aligns both under the weighted sum.

  The user also asks which requirement eliminates most rules. **Cardinal Unit Comparability** is tough because it requires measurable and interpersonally comparable utilities, which many rules (like ordinal voting) don't satisfy.

  For the three contenders:

  1. **Equal-weight summation**: This satisfies Pareto, Anonymity, and Cardinality but struggles with ex-post fairness (like the ruin of one person) and assumes utilities are comparable. It handles variable populations via total utilitarianism but may justify harming some if others gain enough.

  2. **Priority to worse-off**: Adds equity by weighting gains to the disadvantaged. Meets Pareto and Comparability but violates Anonymity and Strong Separability. It avoids ruining one for small gains but may not satisfy ex-ante preferences in gambles if it prioritizes worst-case outcomes.

  3. **Veil of Ignorance**: Uses the equal-chance gamble. Satisfies Anonymity and strong equity by design. But it may violate Pareto if individuals don't maximize average utility. Also, it's hypothetical and may not reflect actual preferences.

  The user's deeper needs involve finding a defensible method beyond anecdotes, especially when justifying decisions to those who lose out. They need clarity on trade-offs between efficiency, fairness, and practicality. Recognizing conflicts between requirements helps them understand why no rule is perfect and what values they prioritize.
answer: |-
  Below is a structured response to your query, addressing the requirements for an adequate social aggregation rule, their motivations, and how they interact. The requirements are derived from social choice theory, welfare economics, and ethical philosophy, grounded in the situations you describe. I'll specify which are widely considered non-negotiable (e.g., logical consistency) and which reflect specific ethical commitments (e.g., egalitarianism). Harsanyi's theorem (as you recall it) assumes: (1) individual preferences satisfy expected utility axioms, (2) group preferences do too, and (3) the *Unanimity* requirement (if everyone is indifferent, the group is). The conclusion is that group utility is a weighted sum of individual utilities with positive weights. Now, to your questions.

  ---

  ### **Requirements for an Adequate Rule**
  1. **Cardinality and Unit Comparability**  
     - **Situation:** Members rate the same improvement as "7" vs. "4."  
     - **Requirement:** The rule must be invariant to linear transformations of individual utilities (i.e., scaling/shifting anchors), but *not* to arbitrary rescalings. This assumes utilities are *cardinally measurable and interpersonally comparable in units* (e.g., a "unit" of gain/loss is comparable across people).  
     - **Motivation:** Without this, the rule depends on arbitrary scales (e.g., stretching one person's scale could reverse group rankings).  
     - **Status:** Non-negotiable for rules using numerical utilities; presupposed by Harsanyi.  

  2. **Ex-Ante Pareto Efficiency**  
     - **Situation:** A coin flip everyone prefers in advance, but afterward, one household loses, one gains.  
     - **Requirement:** If all individuals rank Gamble A over Gamble B *before the outcome*, the group must rank A over B.  
     - **Motivation:** Rejecting this allows the group to overrule unanimous preferences, undermining consent.  
     - **Status:** Non-negotiable for Harsanyi-like rules; part of his theorem.  
     - **Conflict:** This *does not* require the group to track the sum of *realized* outcomes (ex-post efficiency). Demanding both ex-ante and ex-post efficiency is generally impossible (e.g., the gamble may maximize expected utility but produce unequal results).  

  3. **Completeness**  
     - **Situation:** A proposal that benefits 400 but ruins one.  
     - **Requirement:** The rule must always rank any two options (no incomparability).  
     - **Motivation:** Committees need actionable verdicts; declaring incomparability is abdication when trade-offs are unavoidable.  
     - **Status:** Non-negotiable for practical decision-making; assumed in Harsanyi.  

  4. **Population Invariance**  
     - **Situation:** New residents with below-average well-being join.  
     - **Requirement:** The rule must handle variable populations without ad hoc adjustments.  
     - **Motivation:** Real-world policies affect migration, birth, and longevity; ignoring this risks incoherence (e.g., is excluding newcomers fair?).  
     - **Status:** A commitment of "totalist" welfarism; not presupposed by Harsanyi (his theorem assumes fixed populations).  

  5. **Non-Paternalism**  
     - **Situation:** A content shelter resident vs. someone satisfied by others' setbacks.  
     - **Requirement:** Gains are taken as reported (no adjustment), provided utilities reflect coherent preferences.  
     - **Motivation:** Adjusting utilities requires contested moral judgments (e.g., is "envy" invalid?). Smuggling in comparisons invites bias.  
     - **Status:** A commitment of liberal welfarism; Harsanyi assumes preferences are given.  

  6. **Anonymity / Equal Weights**  
     - **Situation:** What justifies equal weights?  
     - **Requirement:** If all individuals have identical utility functions and information, weights must be equal.  
     - **Motivation:** Equal treatment under uncertainty (e.g., a veil of ignorance).  
     - **Status:** An ethical commitment (egalitarianism). Harsanyi derives *positive* weights from unanimity; equal weights require adding *Symmetry* (all people are morally symmetric).  

  7. **Welfarism**  
     - **Situation:** Should injustice affect rankings?  
     - **Requirement:** The rule depends *only* on individual well-being levels, not causes (e.g., injustice).  
     - **Motivation:** Non-welfarist rules (e.g., desert-based) are subjective and risk double-counting (if harms are already in utilities).  
     - **Status:** A core commitment of utilitarianism; assumed in Harsanyi.  

  ---

  ### **Conflicts and Trade-offs**
  - **Jointly Unsatisfiable Subset:**  
    - **Conflict:** *Unanimity* + *Anonymity* + *Strong Separability* (group ranking of two options depends only on individuals affected) + *Completeness* → **Implies equal-weight summation**. But this forces trade-offs like sacrificing one for many (Situation 3).  
    - **What to Drop?**  
      - Drop *Strong Separability* to allow equity-sensitive rules (e.g., prioritizing the worse-off). Cost: Rules become context-dependent and harder to compute.  
      - Drop *Completeness* to permit incomparability. Cost: Indecision in hard choices (e.g., ruin vs. small gains).  
      - Drop *Welfarism* to consider injustice. Cost: Requires contentious moral judgments (e.g., defining "desert").  
    - **Arrow’s Impossibility:** For ordinal (non-cardinal) rules, *Unanimity* + *Non-Dictatorship* + *Independence of Irrelevant Alternatives* conflict. Harsanyi avoids this with cardinality.  

  - **Most Exclusionary Requirement:**  
    **Cardinal Unit Comparability** knocks out most real-world methods (e.g., voting, rankings). It demands measurable, comparable well-being—rare in practice, as your anecdotes show.  

  ---

  ### **Three Contenders Evaluated**  
  1. **Equal-weight summation of realized well-being**  
     Satisfies: Cardinality, Unanimity, Completeness, Population Invariance (if total utilitarianism), Welfarism, and Anonymity (if weights equal).  
     Fails: Ex-post fairness (e.g., ruins one for small gains—Situation 3). Prioritizes efficiency over equity.  

  2. **Priority to the worse-off (e.g., weighted summation with higher weights for disadvantaged)**  
     Satisfies: Cardinality, Unanimity (if weights positive), Equity (avoids Situation 3), Welfarism.  
     Fails: Anonymity (weights unequal) and Strong Separability (rankings depend on distribution). May violate ex-ante Pareto if gambles risk harming the worst-off (Situation 2).  

  3. **Veil of ignorance: Group ordering = expected utility under equal chance of being anyone**  
     Satisfies: Cardinality, Anonymity, Equity (maximizes average utility from a neutral perspective), Population Invariance.  
     Fails: Ex-ante Pareto (if individuals are risk-averse, they may reject fair gambles the veil approves). Requires hypothetical consent, not actual preferences.  

  ---

  ### **Key Takeaway**  
  No rule satisfies all requirements without trade-offs. Harsanyi’s theorem provides a coherent foundation (positive weights + cardinal comparability), but its "adequacy" hinges on ethical commitments: equal weights for equality, welfarism for simplicity, ex-ante Pareto for consent. Your committee’s anecdotes likely stem from unresolved conflicts in these commitments—e.g., valuing consent (ex-ante Pareto) versus fairness (avoiding ruin). The theorem is a "shopping list" with known limitations; adopting it means accepting its presuppositions (e.g., comparability) and choosing which compromises (e.g., efficiency over equity) to defend.
