  We are building a sorting instrument for biological function ascriptions. The goal is to have 9-10 cases, each with 3-4 options (verdicts, not labels) and a scoring key that maps answer patterns to leaves (theories of function). We want to avoid short-circuiting by labels.

  Key axes:
  (a) history vs. current causal contribution
  (b) whether shaping process must be lineage-level selection or can be e.g., gradient descent
  (c) monism vs. interest-relativity
  (d) whether malfunction is definable

  Leaves we want:
  1. Selected-effects / etiological (lineage-level natural selection)
  2. Causal-role (Cummins-style: current contribution to containing system)
  3. Dispositional / goal-contribution (Boorse-ish: function as contribution to goal of survival/reproduction)
  4. Organizational / systemic-teleology (self-maintaining system generates norms, no selection history needed)
  5. Proper function (with artifacts; may include derived functions from intentional design)
  6. Pluralist / pragmatist (interest-relative; question ill-posed without explanatory context)
  7. Error-theory / deflationist (none of these ascriptions are literally true)

  We'll first build the logical space with branch questions, then place the leaves. Then we'll design cases to probe the branches.

  Branch questions (based on axes):

  Q1: Is the function of a trait fixed solely by its current causal role? (Yes/No)
