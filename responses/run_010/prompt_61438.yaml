  ### Sorting Instrument: Biological Function Ascriptions  
  *A 20-minute self-assessment to diagnose implicit commitments*  

  **Instructions:** For each case, select the verdict that best reflects your judgment. Avoid labels; focus on the reasoning. Answer honestly—no short-circuiting!  

  ---

  #### Cases & Options  
  1. **Lens Protein**  
     Protein P catalyzes metabolic reaction R in most tissues. In the eye lens, it’s stockpiled purely for its refractive properties (transparency/shape), though it still catalyzes R there. Catalysis in the lens is metabolically irrelevant and slightly harmful (wastes energy).  
     *What is the function of P in the lens?*  
     - A. Only refraction (catalysis is not a function).  
     - B. Only catalysis (refraction is not a function).  
     - C. Both refraction and catalysis are functions.  
     - D. The question is ill-posed without specifying an explanatory context (e.g., optics vs. metabolism).  
     *(Note: A and B look similar if you ignore harm/irrelevance.)*  

  2. **Gene Duplication**  
     A gene duplicated four generations ago. The copy is transcribed, and its product performs a beneficial task in the current organism. No selection has acted on it (too recent).  
     *Does the duplicate gene have a function?*  
     - A. Yes, because it currently benefits the organism.  
     - B. No, because it lacks a selection history.  
     - C. Function ascriptions aren’t literal truths; they’re useful fictions.  

  3. **Swamp Wolf**  
     A molecule-for-molecule duplicate wolf condenses from swamp gas, with no ancestry. Its heart pumps blood, sustaining its life.  
     *Does its heart have the function of circulating blood?*  
     - A. Yes.  
     - B. No—functions require evolutionary history.  
     - C. "Function" is context-dependent (e.g., biomechanics vs. origins).  

  4. **Moth Without Bats**  
     Moths evolved ultrasound-triggered dives to evade bats. Bats went extinct 200 generations ago. The dive still occurs but provides no survival/reproductive benefit.  
     *Does the dive have the function of bat avoidance?*  
     - A. Yes—past selection fixes the function.  
     - B. No—it lacks current benefit and has no function.  
     - C. It has a function only relative to historical explanations.  

  5. **Broken Heart**  
     In a species where hearts pump blood, an individual’s heart cannot pump (congenital defect).  
     *What is the function of this heart?*  
     - A. Pumping blood (it’s malfunctioning).  
     - B. It has no function (it does nothing useful).  
     - C. Function depends on explanatory interests (e.g., normativity vs. capacity).  

  6. **Prebiotic Replicator**  
     A self-replicating molecule exists in a prebiotic pool. No larger system, no lineage—just random assembly.  
     *Does it have a function?*  
     - A. Yes, self-replication is its function.  
     - B. No—no selection, no system goals, no containing system.  
     - C. Function ascriptions are never literally true.  

  7. **Bridge Bearing**  
     A bridge bearing was designed to carry load. Unintentionally, it channels rainwater away from abutments, preventing erosion. The engineer never considered this.  
     *What is the function of the bearing?*  
     - A. Only load-bearing (channeling is accidental).  
     - B. Only rainwater channeling (load-bearing is accidental).  
     - C. Both are functions.  
     *(Note: A and B look similar if you ignore design.)*  

  8. **Robot Vision Module**  
     A robot’s vision module emerged from gradient descent training (millions of episodes). It identifies objects reliably and would be retrained if it failed. No design, no lineage.  
     *Does it have the function of object identification?*  
     - A. Yes—because of its training history.  
     - B. Yes—because it currently does it.  
     - C. No—no selection/design history.  

  ---

  ### Scoring Key  
  Map your answers to the branch questions below. **Do not skip steps.**  

  #### Branch Questions (Logical Space)  
  1. **Must functions reference history?**  
     - **Yes** → Go to Q2.  
     - **No** → Go to Q3.  
     *(If unsure: "Yes" if you chose B for Cases 2, 3, 4; "No" if A for 2, 3, 5, 6.)*  

  2. **Must history involve lineage-level selection?**  
     - **Yes** → *Selected-effects/etiological* (e.g., Cases 2B, 3B, 4A, 5A).  
     - **No** → *Proper function* (e.g., Cases 7A, 8A).  
     *(Empty cell: No view requires history but rejects all shaping processes. Why? "History" without a shaping mechanism is incoherent.)*  

  3. **Must functions reference current causal contributions?**  
     - **Yes** → Go to Q4.  
     - **No** → *Error theory/deflationist* (e.g., Case 6C).  
     *(Empty cell: No view rejects both history and current role. Why? Function ascriptions need grounding.)*  

  4. **Are functions monistic (one true function) or interest-relative?**  
     - **Monistic** → Go to Q5.  
     - **Interest-relative** → *Pluralist/pragmatist* (e.g., Cases 1D, 4C, 5C).  

  5. **Are functions defined by system goals (e.g., survival) or organizational closure?**  
     - **Goals** → *Dispositional/goal-contribution* (e.g., Cases 1A, 2A, 3A, 5A, 6B).  
     - **Organizational closure** → *Organizational/systemic-teleology* (e.g., Case 6A).  
     - **Neither** → *Causal-role* (e.g., Cases 1C, 7C, 8B).  
     *(Empty cell: No view requires goals but rejects organizational closure for basic systems. Why? Goals imply a system to sustain.)*  

  #### Leaves & Embarrassing Commitments  
  - **Selected-effects/etiological**: For Swamp Wolf (Case 3), you must deny a functioning heart sustains life.  
  - **Causal-role**: For Broken Heart (Case 5), you must say a non-pumping heart has no function.  
  - **Dispositional/goal-contribution**: For Prebiotic Replicator (Case 6), you must deny function to self-replication.  
  - **Organizational/systemic-teleology**: For Moth Without Bats (Case 4), you must deny function to an evolved, persistent trait.  
  - **Proper function**: For Robot Vision (Case 8), you must accept training as "history" but reject it for Gene Duplication (Case 2B).  
  - **Pluralist/pragmatist**: For any case, you must reject "one true function" even when history/role are clear (e.g., Lens Protein).  
  - **Error-theory/deflationist**: For Broken Heart (Case 5), you must say "malfunction" isn’t literal.  

  #### Unseparable Pairs  
  - **Selected-effects vs. Organizational** collapses when systems have maintenance histories (e.g., Moth Without Bats). Both can say "no current function," but no case forces them apart.  
  - **Dispositional vs. Causal-role** collapses if contributions align with goals (e.g., Gene Duplication). Case 1 (harmful catalysis) *can* pry them apart: causal-role accepts harmful roles (Option C), dispositional rejects them (Option A).  

