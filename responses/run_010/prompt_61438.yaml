  But note: organizational accounts are not purely current-role because they require the system to be self-maintaining, which might involve a history of self-maintenance? Actually, organizational accounts are typically about the current organization of a self-maintaining system, not its history. So we can have:

  Q1a: Must the function ascription depend on the trait's history? (Yes/No)

  Q2: If history matters, must the history involve lineage-level natural selection? (Yes/No) [This addresses axis (b)]

  Q3: Is function ascription monistic (one true function per trait) or interest-relative? (Monistic / Interest-relative) [Axis (c)]

  Q4: Can a trait have a function even if it currently does not contribute to the goals of the organism/system? (Yes/No) [This relates to malfunction and also to axis (d)]

  But note: for organizational and dispositional accounts, function is tied to contribution to goals, so if it doesn't contribute, it might not have that function? But malfunction is when it fails to perform its function. So we need to ask:

  Q4a: Is malfunction possible? (Yes/No)

