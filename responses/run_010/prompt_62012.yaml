   Given the time, we might have to assume that the group ranking is complete and consistent with a linear utility.

  Stage 3: State-contingent ranking.

   We take the lottery L1 and the sure thing A3.

   Before the state is known, they might be indifferent (if they are expected utility maximizers with a linear social utility).

   After the state is known, they see either (10,0) or (0,10). We ask them to rank (10,0) vs (5,5) and (0,10) vs (5,5).

   If they are inequality averse, they might say that (5,5) is better than (10,0) and better than (0,10) because of the inequality.

   So after the state is known, they would strictly prefer (5,5) to the outcome of the lottery, whereas before they were indifferent.

   This is the clash.

  Materials: We can avoid cards by having a worksheet that lists the prospects.

   For Stage 2, we can have a whiteboard to record the group ranking.

   For Stage 3, we can have a new sheet with the state-contingent allocations.

  Timeline (2 hours = 120 minutes):

  - Introduction (10 minutes): Explain the setup, the two recipients, the prospects, and the scoring.
  - Stage 1: Individual ranking (15 minutes): Students rank the 6 prospects on their worksheet.
  - Stage 1 scoring (5 minutes): Quickly check if they have any obvious inconsistency (e.g., if they have L1 above A3 and also have A4 below a similar lottery, but we might skip and give tokens).
  - Stage 2: Group ranking (30 minutes): The group discusses and agrees on a ranking of the 6 prospects, respecting Pareto. Meanwhile, the advanced student can be given the task of being the scribe and also of solving for the weights a and b that best fit the group ranking. This will keep him busy.
  - Stage 2 weight calculation (15 minutes): The group, led by the advanced student, calculates the weights a and b for the group's utility function. They are to find at least two different weightings that yield the same ranking, by changing the zero point. For example, tell them to set U(0,0)=0 and U(10,10)=20 (or something), and then also try shifting: let v_A = x_A - 5, v_B = x_B - 5, then U = a' * v_A + b' * v_B. Then they see that the weights change.
  - Stage 3: State-contingent ranking (10 minutes): Students are given a new worksheet with the state-contingent outcomes and are asked to rank them.
  - Discussion of Stage 3 (10 minutes): They see the conflict between ex ante and ex post.
  - Debrief (25 minutes): We explain the Harsanyi aggregation, the linearity, and the zero point issue. We also explain the ex ante/ex post conflict.

  Advanced student: In Stage 2, make him the weight calculator. Give him the task to find the weights and then also to find how the weights change when the zero is shifted.

  What will go wrong:
  - In Stage 1, students might have rankings that are not consistent with expected utility. Then in Stage 2, the group ranking might not be representable by a linear utility. How to recover: Have a note that if they are not consistent, then the weights won't work, and use that to illustrate the importance of the sure-thing principle.
  - In Stage 2, the group might not agree. They might have to vote. But then the voting might not respect Pareto. How to recover: The facilitator should intervene and remind them of the Pareto condition and that if everyone prefers X to Y, then it must be ranked higher.
  - Stage 3 might be obvious to some. But the point is to show the conflict.

  What the activity cannot reproduce: The full generality of Harsanyi's theorem. In particular, we are only using two individuals and linear utilities. Also, we are not proving the theorem, only illustrating it. The activity cannot show that the sure-thing principle and Pareto imply the linear representation - we are assuming it in the group stage. We will have to state that as an assumption.

  Debrief outline:
  - Stage 1: Each student's ranking can be represented by a utility function. If it satisfies the sure-thing principle (vNM) and Pareto, then it must be a weighted sum of the individuals' utilities.
  - Stage 2: When aggregating multiple planners with Pareto, the group utility is also a weighted sum of the individuals' utilities, but the weights depend on the utilities' scaling.
  - Stage 3: Ex ante, the lottery might be indifferent to the sure thing if the expected utility is the same. Ex post, after the state is known, the sure thing might be strictly better if we are inequality averse, which would violate the ex ante ranking. This shows a tension between ex ante and ex post evaluations.

  Materials details:

  Worksheet for Stage 1:

  " You are a social planner allocating 10 units of a good between A and B. Rank the following prospects from 1 (best) to 6 (worst). You may ties.

  Prospects:
  - P1: (10,0) for sure
  - P2: (0,10) for sure
  - P3: (5,5) for sure
  - P4: (8,2) for sure
  - P5: (2,8) for sure
  - P6: A fair coin flip: heads (10,0), tails (0,10)

  Ranking:"

  Stage 2 group instructions:

  "As a group, you must agree on a single ranking of the same 6 prospects. The ranking must respect the Pareto principle: if every member of the group ranks prospect X above prospect Y, then the group ranking must have X above Y.

  Additionally, you are to assume that the group's preferences can be represented by a utility function of the form U(x_A, x_B) = a * x_A + b * x_B.

  Your tasks:
  1. Agree on the ranking.
  2. Find values for a and b that are consistent with your ranking. (Hint: Set the utility of (0,0) to 0. Then, for example, U(10,0)=10a, U(0,10)=10b, U(5,5)=5a+5b, etc.)
  3. Now, imagine that the utility for A is shifted: let v_A = x_A - 5 and v_B = x_B - 5. Then the utility function becomes U = a' * v_A + b' * v_B. Find a' and b' that yield the same ranking. Is it possible? How do a' and b' relate to a and b?
  4. See if by choosing different zeros, you can make the weights change arbitrarily.

  Record your ranking and the weights you find."

  Stage 3 worksheet:

  " Now consider the prospects after the state of the world is known.

  - Prospect P6 has two possible outcomes: Outcome1: (10,0) and Outcome2: (0,10).
  - Prospect P3 is (5,5) in both states.

   Compare the following:

  - Compare (10,0) to (5,5): which is better?
  - Compare (0,10) to (5,5): which is better?

   Does this differ from how you ranked the prospects before the state was known (when you were ranking the lotteries)?"

  Scoring: Tokens for participation in each stage and for the group activity.

  This is a complex activity and might be tight in time. We might need to cut.
answer: |-
  ### Seminar Design: Discovering Harsanyi's Aggregation Theorem

  **Core Insight:** Students will discover that group social preferences under Pareto and vNM rationality (sure-thing principle) lead to a weighted sum of individual utilities, and that the weights depend on arbitrary choices of "zero utility" for each person. They'll also confront an ex ante/ex post equity paradox.

  **Fictional Recipients:** Two characters, Alex and Blair, splitting a fixed pot of 10 units (e.g., "life points"). Prospects include certain splits and 50-50 coin-flip lotteries.

  **Materials (Low-Prep):**
  - **Worksheets:** 1 per student for each stage (Stage 1, Stage 2/3 combo). No cards needed.
  - **Projector/Slides:** Display instructions, prospects, and group tasks.
  - **Scoring Tokens:** Poker chips or colored paper clips (1 token = 1 point). Tokens are redeemed for sweets (e.g., chocolate coins) post-seminar. Award tokens for:
    - Stage 1: 2 tokens for a "consistent" ranking (defined below).
    - Stage 2: 2 tokens for Pareto-consistent group ordering + 1 token for weight calculation.
    - Stage 3: 2 tokens for state-contingent conflict identification.
  - **Prospects:** Use 5 prospects (simple numbers for mental math):
    - **Certain splits:** 
      - \(C1: (10, 0)\) (Alex 10, Blair 0)
      - \(C2: (0, 10)\) (Alex 0, Blair 10)
      - \(C3: (5, 5)\) (Alex 5, Blair 5)
    - **Lotteries (50-50 coin flips):** 
      - \(L1:\) Heads \((10, 0)\), Tails \((0, 10)\)
      - \(L2:\) Heads \((10, 0)\), Tails \((5, 5)\)

  **Why these prospects?**  
  - \(L1\) vs. \(C3\) tests risk/inequality aversion.  
  - \(L2\) vs. \(C1/C3\) tests sure-thing principle.  
  - Small numbers (0,5,10) are head-calculable.  
  - Symmetry reveals weight arbitrariness.

  ---

  ### Timeline (120 Minutes Total)

  #### **Stage 1: Individual Rankings (25 mins)**  
  *Goal: Students express vNM-consistent preferences as social planners.*  
  - **0-5 mins:** Introduce setup.  
    - *"You're a policymaker allocating 10 life points between Alex and Blair. Rank prospects from best (1) to worst (5). Ties allowed. Your goal: consistency (explained later)."*  
    - Project prospects: \(C1, C2, C3, L1, L2\).  
  - **5-20 mins:** Students rank individually on **Worksheet 1** (see below).  
  - **20-25 mins:** "Score" consistency:  
    - *"You were consistent if you ranked \(L2\) above \(C1\) or had a tie. Why? \(L2\) gives Alex 10 if heads, but 5 if tails—so it's never worse than \(C1\) for Alex and better if tails. This is a 'sure-thing principle' test."*  
    - Award 2 tokens to all (framed as "reward for effort") to avoid delays.  

  #### **Stage 2: Group Ordering and Weight Calculation (45 mins)**  
  *Goal: Group discovers linear aggregation via Pareto, then sees weights depend on zero-utility choices.*  
  - **25-30 mins:** Explain group task.  
    - *"As a group, agree on one ranking of the 5 prospects. Rule: If every one of you ranks prospect X above Y, the group must rank X above Y (Pareto principle)."*  
  - **30-50 mins:** Group negotiates ordering. Use whiteboard to track.  
    - **Advanced Student Role:** Assign them to derive "group utility weights" secretly:  
      - *"While the group debates, derive weights \(a\) (for Alex) and \(b\) (for Blair) such that group utility \(U = a \cdot x_A + b \cdot x_B\) fits the ranking. Assume \(U(0,0) = 0\)."*  
    - Predictable outcome: Pareto forces \(L2 \succ C1\) (since all ranked \(L2 \succeq C1\) individually). Common ranking: e.g., \(C3 \succ L1 \succ L2 \succ C1 \succ C2\) (if inequality-averse).  
  - **50-60 mins:** Calculate weights as a group:  
    - *"Assume your ranking comes from a utility function \(U = a \cdot x_A + b \cdot x_B\). Solve for \(a\) and \(b\) using two choices."*  
      - Example: If group ranks \(C3 (5,5) \succ L1\) and \(C3 \succ C1 (10,0)\), then:  
        - \(U(C3) = 5a + 5b > U(L1) = 0.5 \cdot (10a) + 0.5 \cdot (0) = 5a\)  
        - \(5a + 5b > 5a \implies b > 0\)  
        - If they also have \(C1 \succ C2\), then \(10a > 10b \implies a > b\).  
      - Advanced student shares calculations.  
  - **60-70 mins:** Reveal weight arbitrariness:  
    - *"Change utility zero-points: Suppose Alex's 'zero' is at 5, not 0, so \(v_A = x_A - 5\). Blair's zero is still 0. Recalculate weights for \(U' = a' \cdot v_A + b' \cdot x_B\)."*  
    - Students see weights change (e.g., if \(a = 0.6, b = 0.4\), then \(a' = 1.2, b' = 0.4\) for same ranking).  
    - **Key insight:** Weights depend on arbitrary zeros. Award 1 token.  

  #### **Stage 3: State-Contingent Ranking (20 mins)**  
  *Goal: Confront ex ante/ex post equity paradox.*  
  - **70-75 mins:** Introduce state-contingency.  
    - *"Now the coin has landed. In 'heads' state, compare \((10,0)\) and \((5,5)\). In 'tails' state, compare \((0,10)\) and \((5,5)\). Rank them."*  
  - **75-85 mins:** Students rank on **Worksheet 2** (see below).  
    - Prospects to rank:  
      - Heads: \((10,0)\) vs. \((5,5)\)  
      - Tails: \((0,10)\) vs. \((5,5)\)  
  - **85-90 mins:** Elicit responses. Most will rank \((5,5) \succ (10,0)\) and \((5,5) \succ (0,10)\) due to ex post inequality aversion.  
    - *"Before the flip, many ranked \(C3\) and \(L1\) as equally good (same expected utility). Now, after the flip, \(C3\) is better in both states. What changed?"*  
    - Award 2 tokens for identifying the conflict.  

  #### **Debrief (30 mins)**  
  - **90-105 mins:** Map activities to theorem:  
    | **Activity Moment**       | **Harsanyi Assumption**                         | **Revealed Insight** |  
    |----------------------------|-------------------------------------------------|----------------------|  
    | Stage 1 ranking            | Individuals have vNM-rational preferences       | Rankings respect sure-thing principle (vNM rationality). |  
    | Stage 2 group Pareto       | Social ordering respects Pareto                | Pareto forces agreement but doesn't pin down weights. |  
    | Stage 2 weight calculation | Social utility is linear in individual utilities | Weights \(a, b\) emerge naturally. |  
    | Stage 2 zero-point change  | Utilities are unique up to affine transforms   | Weights depend on arbitrary choice of "zero utility." |  
    | Stage 3 paradox            | Ex post equity vs. ex ante efficiency          | Harsanyi assumes vNM (ex ante); real-world concerns (e.g., inequality) violate it. |  
  - **105-115 mins:** Formalize theorem:  
    - *"You discovered that Pareto + vNM rationality imply social welfare is a weighted sum of utilities. This is Harsanyi's Aggregation Theorem. Weights aren't pinned down by preferences—they rely on how we define utility scales. Changing zeros can flip rankings: e.g., if you set Alex's zero at 5, a split like (6,0) might now look worse than (5,5)."*  
  - **115-120 mins:** Discuss implications:  
    - *"Why does this matter? Policy choices (e.g., risky vaccines) use social welfare weights. But your weights were arbitrary—someone chose Alex's and Blair's 'misery points.'"*  

  ---

  ### Worksheets  
  **Worksheet 1 (Stage 1): Individual Ranking**  
  ```markdown
  Prospects:
  - C1: (10, 0) [Alex 10, Blair 0]  
  - C2: (0, 10) [Alex 0, Blair 10]  
  - C3: (5, 5)  [Alex 5, Blair 5]  
  - L1: 50% (10, 0), 50% (0, 10)  
  - L2: 50% (10, 0), 50% (5, 5)  

  Rank (1=best, 5=worst; ties allowed):
  C1: _   C2: _   C3: _   L1: _   L2: _
  ```

  **Worksheet 2 (Stage 3): State-Contingent Ranking**  
  ```markdown
  After the coin flip:  
  - In HEADS state: Rank (10,0) vs. (5,5): ( ) (10,0) better, ( ) (5,5) better, ( ) indifferent  
  - In TAILS state: Rank (0,10) vs. (5,5): ( ) (0,10) better, ( ) (5,5) better, ( ) indifferent  
  ```

  ---

  ### What Will Go Wrong (and Fixes)  
  1. **Stage 1 Inconsistency:**  
     - *Problem:* Students rank \(L2\) below \(C1\) (violating sure-thing principle).  
     - *Fix:* In scoring, say: *"Most of you were consistent! If not, think: Does \(L2\) give Alex more when tails?"* Award tokens anyway to avoid derailing.  

  2. **Stage 2 Group Deadlock:**  
     - *Problem:* Group can't agree on ordering (e.g., \(C3\) vs. \(L1\)).  
     - *Fix:* Intervene: *"Use Pareto to agree on pairwise rankings first (e.g., all rank \(C3 \succ C1\), so \(C3 \succ C1\) in group)."*  

  3. **Advanced Student Dominates:**  
     - *Problem:* Game theorist derives weights too fast.  
     - *Fix:* Their secret task *("Find multiple weight pairs using different zeros")* keeps them occupied. If they blurt, say: *"Ah, you’re exploring a deeper layer—hold that thought for Stage 2.2!"*  

  4. **Weight Calculation Confusion:**  
     - *Problem:* Students struggle with algebra.  
     - *Fix:* Pre-calculate examples. If stuck, use a simple ranking: e.g., if \(C3 \succ L1\), then \(5a + 5b > 5a \implies b > 0\).  

  ---

  ### What the Activity Cannot Reproduce  
  **The Necessity of vNM Rationality:**  
  - The activity *assumes* individual rankings satisfy the sure-thing principle (vNM axioms). It doesn't *prove* that Pareto + vNM force linear aggregation.  
  - **Post-Activity Hand-Supplied Insight:**  
    - *"In the theorem, Pareto + vNM imply linearity. Your Stage 1 rankings were vNM-consistent by design. If someone violated vNM (e.g., ranked \(L2\) below \(C1\)), the group ordering might not be linear—but Harsanyi shows that if it obeys both, linearity is inevitable."*  

  ---

  **Why This Works:**  
  - Students "discover" linear aggregation by calculating weights from their own preferences.  
  - The zero-point shift exposes arbitrariness viscerally.  
  - The ex ante/ex post conflict mirrors real policy debates (e.g., insurance vs. equality).  
  - Tokens incentivize engagement (sweets anchor effort).  
  - Advanced student is contained with a meaty side-task.  

  **Final Prep:**  
  - Print worksheets (12 sets).  
  - Bring tokens (e.g., poker chips) and sweets.  
  - Pre-load slides with prospects and tasks.  
  - Rehearse weight calculations for common rankings.
