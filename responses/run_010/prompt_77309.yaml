answer: |-
  **MEMORANDUM**  
  **TO:** Collections Committee  
  **FROM:** Dr. [Your Name], Faculty Representative, 19th-Century European Studies  
  **DATE:** February 20, 2025  
  **SUBJECT:** Recommendation for Disposition of Basement Plaster Cast Collection & Donor-Funded Replica Proposal  
  **VOTE DEADLINE:** March 15, 2025  

  ---

  ### **I. EXECUTIVE SUMMARY**  
  After thorough assessment of the 1911 plaster cast collection (hereafter "the Casts"), including recent conservation findings, **we recommend:**  
  1. **Accepting the donor-funded photogrammetric replica** of the Parthenon metope;  
  2. **Conserving and displaying 3–5 high-provenance Casts** with clear links to original antiquities;  
  3. **Retaining but not restoring the 4 disputed pieces** as artifacts of institutional history;  
  4. **Deaccessioning the remaining damaged, non-unique Casts** after 3D documentation.  
  **Timeline:** Conservation (18 months), exhibition design (12 months), deaccession (staggered, starting Q4 2025).  

  ---

  ### **II. BACKGROUND**  
  - The Casts (acquired 1911) include Parthenon reliefs, Nineveh slabs, and Roman portraits.  
  - Current state: Severe degradation (cracks, gypsum dust, overpaint, structural staples).  
  - **New findings (Conservator Dr. [Name]):** At least 4 pieces (including a "best" example) are likely *not* from the 1911 workshop. Evidence suggests:  
    - 1930s–40s recasts made *in-house* from our own deteriorating casts;  
    - One is a cast of a 19th-century fictive reconstruction, misrepresented as ancient.  
  - Donor offer: Full-scale replica of a Parthenon metope using sub-mm photogrammetry of the London original.  

  ---

  ### **III. COMMITTEE POSITIONS (STRONGLY STATED)**  
  - **Camp A (Dispose):** The Casts are degraded, pedagogically obsolete, and consume scarce resources. The replica offers superior fidelity to the original marble. Retaining derivative objects with no unique historical value undermines collection standards. *"Prioritize future-facing teaching tools over sentimental salvage."*  
  - **Camp B (Conserve All):** The Casts are irreplaceable witnesses to 1911–1960s art pedagogy. Their material chain (flaws, repairs, provenance) *is* their value. The replica lacks historical texture. *"A copy of stone is not a substitute for an artifact of scholarly practice."*  
  - **Camp C (Hybrid Exhibit):** Juxtaposing conserved Casts and the replica creates a critical dialogue about authenticity, copying, and institutional memory. *"The friction between old and new technologies is the lesson."*  

  ---

  ### **IV. ANALYSIS & RECOMMENDATION**  
  Recent findings complicate all positions:  
  - **Camp A’s disposal logic** would eliminate the 4 disputed pieces, destroying evidence of in-house replication practices.  
  - **Camp B’s provenance argument** fails for the 4 pieces: Their "chain" is short (1930s–40s), indoor, and culminates in a fake.  
  - **Camp C’s hybrid approach** is strongest but must adapt: Not all Casts merit equal treatment.  

  **Proposed Resolution:**  
  1. **Accept the donor’s replica funding**  
     - *Why:* It provides unparalleled access to the original marble’s surface. Rejects no-cost solution.  
     - *Timeline:* Commission by June 2025; delivery by December 2025.  

  2. **Conserve and display key high-provenance Casts**  
     - Select 3–5 pieces with verifiable 1911 origins and pedagogical value (e.g., intact Parthenon/Nineveh casts).  
     - *Process:* Stabilize cracks, remove hazardous overpaint/staples; *do not* erase historical repairs.  
     - *Cost:* $15K–$20K (estimate from Conservation).  

  3. **Retain the 4 disputed pieces in stable storage**  
     - *Why:* They are evidence of 1930s–40s workshop practices and misattribution. *Do not restore or display as art.*  
     - *Future use:* Research/teaching on replication ethics (e.g., "How copies become originals").  

  4. **Deaccession remaining Casts**  
     - *Criteria:* Heavily damaged, no unique provenance, or duplicates of well-preserved examples.  
     - *Process:* High-resolution 3D scan before deaccession; offer to regional museums/art schools.  

  5. **Exhibit Design:** Display conserved Casts + replica + documentation of the 4 disputed pieces. Labeling to highlight:  
     - Material decay vs. digital fidelity  
     - Provenance gaps (1911 invoice vs. 1930s recasts)  
     - The "fake" cast as a cautionary tale  

  ---

  ### **V. CONTINGENCIES & FURTHER STUDY**  
  - **If the 4 disputed pieces are proven pre-1911 (unlikely):**  
    - *Test:* Micro-sampling for plaster composition vs. 1910s European workshop databases.  
    - *Outcome:* Upgrade conservation priority if verified.  
  - **If the "fake" cast is linked to a known 19th-century sculptor:**  
    - *Test:* Archival research on early 20th-century catalogues of reconstructive casts.  
    - *Outcome:* Feature it in the exhibit as a study in artistic intervention.  
  - **If the replica funding lapses:** Prioritize conserving the highest-value Cast (fundraise separately).  

  ---

  ### **VI. RATIONALE FOR REJECTED POSITIONS**  
  - **Why not Camp A?** While practical, it erases the collection’s role in our institutional narrative. The 4 disputed pieces hold unique evidence about our workshop history.  
  - **Why not Camp B?** Conserving *all* Casts is unsustainable ($50K+). The replica’s direct data capture offers a clearer epistemic link to antiquity than 3rd/4th-gen plasters.  

  ---

  ### **VII. NEXT STEPS**  
  - **Vote:** By March 15, 2025, on the above recommendation.  
  - **Approved plan:**  
    - Conservation begins April 2025 (lead: Dr. [Conservator]).  
    - Replica commission: May 2025 (lead: Development Office).  
    - Deaccession process: Phase 1 (non-controversial pieces) by October 2025.  
  - **Rejected plan:** Committee revisits with new proposals within 30 days.  

  ---  
  **Attachment:** Condition reports, replica specifications, cost estimates.  
  **CC:** University Archivist, Head Curator, Conservator.  

  This recommendation balances preservation of material history, pedagogical innovation, and responsible stewardship. It confronts the collection’s complexities without privileging nostalgia or technocracy.  

  Respectfully submitted,  
  Dr. [Your Name]
