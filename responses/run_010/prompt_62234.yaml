  Hmm, the user is a lay member of a regional health authority's Scarce Therapeutics Review Panel facing a difficult allocation decision. They've summarized six past rulings and are trying to discern consistent principles before next month's meeting on an antiviral allocation case. The case involves choosing between saving 100 critically ill patients (Protocol A), preventing ~140 expected deaths through prophylaxis (Protocol B), or a lottery across all 500 (Protocol C). They're particularly interested in philosophical foundations, referencing Taurek's "Should the Numbers Count?" and noting the chair's dismissive attitude toward it.

  The user wants a reconstruction of principles consistent with the six rulings. The rulings show interesting patterns: a refusal to consider life-years in ventilation allocation, concentration of antivenom on one certain death rather than distributed prevention, acceptance of higher per-recipient risk to save more children in liver splitting, rejection of aggregating minor illness episodes to outweigh one child's death, distribution of thrombolytic to reduce many mild deficits rather than prevent one severe disability, and prioritization of immediate over delayed death in orphan drug allocation.

  Three candidate principles emerge from analyzing these rulings:
  1. "Avoid Counting Lives as Aggregates" - focuses on non-aggregation and direct comparison of individual fates. It explains most rulings well but strains on the thrombolytic case where distributed benefits were prioritized.
  2. "Minimize Certain Severe Harms" - prioritizes preventing worst individual outcomes. It fits the orphan drug and antivenom cases but struggles with the liver splitting decision where increased individual risk was accepted.
  3. "Maximize Direct Lives Saved" - focuses strictly on saving the most lives. It fits the liver splitting and thrombolytic cases but conflicts with the minor illness episode decision.

  For the current case, Protocol A saves 100 certain lives while Protocol B saves ~140 expected lives. The panel's history suggests they reject pure aggregation, making Protocol B unlikely despite its higher number. Protocol C introduces fairness questions through a lottery. The closest analog is the thrombolytic case, but key differences exist - here Protocol A involves certain death prevention versus Protocol B's risk reduction.

  If coherence is paramount, Protocol A aligns best with principles repudiating aggregation, though it contradicts the thrombolytic precedent. A discriminating hypothetical case would test whether the panel prioritizes preventing certain severe disability over distributed mild deficit reduction - a tension between the first two principles.

  Regarding Taurek, the panel's record shows affinity with his non-aggregation view (despite the chair's dismissal), particularly in refusing to "add up" minor illnesses or weight life-years. However, they sometimes prioritize worst-off individuals (orphan drug case) which goes beyond Taurek's strict lottery approach. The tension between fairness to all claimants and special concern for the worst-off remains unresolved in their rulings.
