     - For C, there is no margin for error principle that applies because the condition is discrete and the same token event is held fixed. The margin for error principle requires a series of cases that are pairwise close and in which the condition changes. But for the token game G, the condition C (win) does not change in nearby worlds.
     - For the second-order knowledge, we are not holding the token event fixed. We are considering different token events (different games) that are very similar, and the knowledge status changes. So the margin for error principle applies at the second-order level.

   Which premise fails for C but survives for the second order? 
     - The margin for error principle: for the first-order knowledge, there is no series of cases in which C gradually changes from obtaining to not obtaining while the cases are indiscriminable. But for the second-order knowledge, there is a series of cases in which the first-order knowledge gradually changes (actually, it jumps discretely, but the cases are indiscriminable) and the second-order knowledge attribution would require discrimination between cases that are indiscriminable.

   What if we thicken C? 
     - If we make the win condition have a gradual onset (which is not possible in tic-tac-toe because it's discrete), then the wedge might collapse. But in this case, the condition is discrete. So thickening doesn't apply.

   The strongest attack from a Williamsonian: 
     - They might argue that the condition C is not truly luminous because in order to know C, the agent must perceive the board correctly. And there is a possibility of misperception even in the actual case. But we have stipulated that in the actual case, she is attentive and the board is clear. 
     - Alternatively, they might say that the actual case is not safe because there is a nearby world where the board is slightly different and she misperceives it. But we have argued that for the token game G, the board is fixed. So they might challenge the idea that we can hold the token event fixed in the first-order case but not in the second-order case. 
     - Specifically, for the first-order belief, we considered only worlds where the same token game G occurs. But for the second-order belief, we considered different games. The Williamsonian might say: for the second-order belief, we should also hold the token game fixed. Then, in the actual world (with game G0), the second-order belief is true. In nearby worlds with the same game G0, she would still know she won (because the board is the same) and she would believe she knows it. So the second-order belief would be safe. 

   This is a serious objection.

   How to respond? 
     - In the second-order reflection, Alice is not only considering the actual game but also reflecting on her general ability to know in such situations. She realizes that in very similar situations (similar boards) she might be wrong. Therefore, to know that she knows in this instance, she must be able to discriminate this instance from those similar instances where she doesn't know. But she cannot, because the boards look the same. Therefore, she is not in a position to know that she knows.

   This is in line with Williamson's own treatment of the Mr. Magoo case for higher-order knowledge.

   Therefore, the wedge holds.

   Let's write the scenario in one paragraph:

   Alice is participating in a psychology experiment on game perception. She plays a series of tic-tac-toe games against a computer. The computer is programmed to play perfectly, but in one specific game, it makes a rare and subtle mistake, allowing Alice to win. The final board shows three of her marks in a row. Alice, who is attentive and understands the game, sees the three in a row and believes she has won. Indeed, she has won. She knows she has won. After the game, she reflects on whether she knows she won. She considers that the board was clear and she was paying attention, but she also realizes that in very similar board configurations (which occur in other games) she might have miscounted and mistakenly thought she won when she hadn't. Since she cannot rule out the possibility that this was such a case (even though it wasn't), she cannot come to know that she knows she won.

   Now, the demonstration:

   Condition C: Alice won this particular game (game G).

   First-order belief and method: 
     - Belief: that she won game G.
     - Method: visual perception of the board of game G under good conditions.

   Series for C: 
     - For the same game G, there is no series of adjacent indiscriminable cases because the board is fixed.

   Nearby worlds for first-order belief:
     - We consider worlds that are close to the actual world and where she forms the belief by the same method.
     - In these worlds, the board of game G is the same (it is a win), and she is attentive, so she believes she won. There is no close world where the board of game G is not a win (because it is fixed). So in all close worlds where she forms the belief, she is correct. Hence, the belief is safe.

   Second-order belief and method:
     - Belief: that she knows she won game G.
     - Method: reflection on the basis of her first-order belief (clear perception, attentiveness) and the possibility of error in similar situations.

   Series for the second-order content (D = she knows C):
     - There is a series of games: 
          Game G0 (actual): board is a clear win.
          Game G1: board is very similar to G0 but not a win (e.g., two in a row and one empty space that she misperceives as her mark), so she believes she won but is wrong.
     - These two games are indiscriminable to Alice.

   Nearby worlds for second-order belief:
     - In the actual world, she believes D (that she knows she won G0) by reflection.
     - In a nearby world where game G1 occurs, she also believes she knows she won G1 (by the same reflection) but she is wrong because she doesn't even truly believe she won (since she didn't win, but wait: in that world she does believe she won, but it's false, so she doesn't know). 
     - So there is a nearby world (the world of game G1) where she believes D (for her game) but it is false.

   Therefore, the second-order belief is not safe.

   Conclusion: 
     - The margin for error principle does not threaten the first-order knowledge of C because there is no series of indiscriminable cases for the token condition C. 
     - But it does threaten the second-order knowledge because there is a series of indiscriminable cases for the type of situation, and the second-order knowledge requires discriminating the actual case from these similar cases.

   This provides the wedge.
