  First, the core argument: They're saying that base rates for empires don't work because defining what counts as the "same" empire (token-identity) or what "kind" of empire it is (reference class) is messy and subjective. This isn't like bridges where physical continuity defines identity. For empires, these definitions depend on narrative practices, which are influenced by who survived to write history. They also suggest a feedback loop where publishing base rates might change how people classify empires over time.

