  3. Are the Roman Empire examples in §4 effective or should they use non-European cases?  
  4. How does their claim go beyond just survivorship bias and the problem of the criterion?  

  Let me tackle these one by one.  

  For question 1: "Taxonomic ignorance" does add something new. While reference class problems are well-known in statistics, framing it as "taxonomic ignorance" emphasizes that the very categories (like "empire") are unstable and historically contingent. This ties into philosophy of history, where how we define entities shapes what we measure. So yes, §3 is doing real work—it elevates a statistical issue into an epistemological one about what we can even know.  

