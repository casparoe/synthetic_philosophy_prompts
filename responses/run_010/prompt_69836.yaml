prompt: |-
  so, third year in phil of mind here and my chapter is on whether dreams are experiences at all — Malcolm's line that dreaming isn't something that happens to you during sleep, so the waking impression does all the work, versus Dennett's more mechanistic version where nothing phenomenal occurs overnight and the content just gets written into memory at the moment of waking. My supervisor's complaint is that anything I put between those two collapses into one of them, and honestly he might be right. I want you to argue for a third position I've been calling "the sketch view", and argue it hard enough that I could put it in front of a room that already knows both of the others.

  The view, roughly: what sleep leaves behind is underdetermined — a bundle of constraints and an unfinished narrating task, not a determinate content and not an experience of a determinate content. The dream only becomes a determinate dream in the course of being told. So the telling is neither a report of something that was already there nor the playing back of a ready-made tape; it's the completion of something deliberately left incomplete. That carries a weird consequence I want you to own rather than dodge: identity conditions for the dream are partly fixed by the telling, so two retellings of one night can differ in detail and neither be false, because there was no fact of the matter about those details until somebody told it.

  I need the argument to do five specific jobs. First, show why this isn't just Dennett with the tape swapped for an outline — on his picture the content is fully determinate before waking and merely gets inserted, on mine nothing determinate is inserted at all, and you need to explain why that difference is substantive and not cosmetic. Second, show how it escapes Malcolm's point that the waking impression is the only criterion available, without ending up committed to the view that whatever you say you dreamt, you dreamt — the sketch has to still constrain the telling somehow, and I want that mechanism stated. Third, deal with the lucid dreaming signalling results, where people execute pre-agreed eye movement signals in the middle of the episode they later report on, which looks like direct evidence for determinate content running online during sleep. Fourth, deal with the duration studies where subjects' estimates of how long a dream went on track the actual elapsed time pretty closely, since that seems to need something with a genuine temporal shape happening overnight. Fifth, answer the objection that I've only relocated the experience: if the telling is what completes the dream, isn't the telling itself an experience, in which case I've conceded the whole point to the experientialist and gained nothing by the detour.

  Format: exactly five numbered points, one or two sentences each, no intro and no wrap up at the end — I'm pasting them straight into my notes. And don't soften them into a list of considerations on both sides, I want them as premises doing actual work toward the conclusion that a dream is not an experience.
reasoning: |-
  Okay, the user is a third-year philosophy of mind student working on a chapter about whether dreams are experiences. They're stuck between Malcolm's view that dreams aren't experiences during sleep and Dennett's view that the content is written into memory upon waking. Their supervisor thinks any middle ground collapses into one of these. The user wants to argue for a "sketch view" where dreams are underdetermined sketches completed during telling. They need five specific points to defend this view against key objections.

  First, I need to clarify the sketch view's core: dreams as incomplete constraints, not experiences. The telling completes them, so identity depends on the telling. Two different tellings can both be true because the dream wasn't fully formed before.

  For point one, the distinction from Dennett: Dennett thinks the content is fully formed before waking and just inserted into memory. In the sketch view, nothing determinate exists before telling. That's a substantive difference because for Dennett, there's a fact of the matter before waking; in the sketch view, there isn't. That's ontological, not just about memory insertion.

  Point two: escaping Malcolm. Malcolm says we only have waking impressions. The sketch view avoids "anything goes" by having constraints from sleep. The sketch limits possible completions, so not anything can be told. The mechanism is that the sketch provides boundaries the telling must respect.

  Point three: lucid dreaming with signals. Here, signals are part of the sketch, not proof of full experience. The pre-agreed signals are constraints that get incorporated into the telling later. The signals constrain the story but don't imply a full narrative was experienced.

  Point four: duration studies. The sketch has temporal tags, not a full experience. The duration data comes from these tags influencing the telling, not from experiencing time in the dream. So the temporal structure is part of the sketch, not a lived duration.

  Point five: the telling as experience. The telling is an experience, but it's of constructing the dream, not recalling it. So the dream itself isn't prior; it's constituted in the telling. This concedes an experience occurs but not that dreams are experiences during sleep. The detour shows dreams aren't overnight experiences but narrative completions.

  I should ensure each point directly argues that dreams aren't experiences. No softening—each must be a premise leading to that conclusion. The user wants punchy, numbered points without intros or summaries. Addressing all five objections while maintaining the sketch view's coherence is crucial. Also, owning that identity is fixed in telling and that different tellings can be valid is key. Need to make sure each point is concise but substantive, doing the heavy lifting as requested.
answer: |-
  1. Against collapsing into Dennett: Dennett posits a fully determinate dream-content formed during sleep and merely transcribed at waking, whereas the sketch view denies any such determinate content exists *anywhere* prior to the telling act – the sleep state provides only ambiguous constraints, making the ontological status fundamentally different (non-existent determinate content vs. inserted content).  
  2. Escaping Malcolm without 'anything goes': Malcolm's waking impression is indeed the criterion, but the sketch constrains *which* waking impressions are viable completions of its underdetermined structure, meaning incompatible reports (e.g., "I flew" vs. "I fell") reveal a sketch violation, not mere report error.  
  3. Lucid signaling: Pre-agreed eye movements are behavioral outputs *incorporated into the sketch* as salient constraints; they anchor the telling (e.g., "I signaled 'L' when I saw lava") but don't necessitate that a full phenomenal "lava-experience" occurred online – the signal is a sparse datum shaping narration, not proof of rich, determinate content.  
  4. Duration studies: Temporal tags (e.g., sequential neural markers) are key constraints within the sketch, directly informing the *narrative construction* of duration during telling; the close tracking shows the sketch reliably encodes sequence/timing *information*, not that a subjectively experienced duration unfolded.  
  5. Telling as experience ≠ dream experience: The telling is indeed an experience, but it's an experience of *creating* the dream-narrative by resolving the sketch, not of *recalling* an antecedent experience; this concedes experience occurs *now* (in waking) but denies it occurred *then* (in sleep), precisely the detour's gain.
