prompt: |-
  So, context: three weeks ago my PI had a stroke. She's recovering, she's talking again, but she's out for the rest of the year, and the department has handed me her upper-level seminar — infinity, vagueness, paradoxes of the infinite — fourteen students, all seniors plus two first-years. I'm a third-year postdoc and this is the first course I've ever been solely responsible for. The final is in two weeks: two hours, in class, no notes, no books.

  I want the supertask essay question to be the centerpiece of the exam, worth 25 of the 100 marks. Problem is they've all read Thomson on the lamp and they've all read the Benacerraf reply, and two of them wrote their mid-term papers on exactly that. So "state and evaluate Thomson's argument" is useless — I'd get fourteen near-identical summaries and I'd learn nothing about who can actually think and who has just memorized the labels.

  Here's the setup I've been building in my head, and I want you to turn it into something I can hand out. Two little machines, both invented, both stipulated in the question so nobody can claim they haven't seen them:

  The Ledger Lamp. A lamp is switched at each of the times 1/2, 3/4, 7/8, and so on, each switch flipping the lamp from on to off or off to on. After every switch a scribe writes the lamp's post-switch state in a ledger, and nothing in the interval before t=1 can change the lamp's state otherwise. So the description fixes the lamp's state exactly at every moment before 1, and says nothing at all about t=1.

  The Dimmer Lamp. Same switch times, but instead of flipping, each switch sets the lamp's brightness to a value half the previous one, starting from full. Again nothing else changes it before 1.

  And the principle I want them to chew on, stated flatly in the question, call it the Closure of Description principle: if a complete description of a system determines its state at every moment of an interval up to but not including t=1, then it determines its state at t=1. One of my students floated something like this in seminar as a way of dissolving the whole mess — if you've pinned down every moment before the endpoint, surely the endpoint is pinned down too — and half the room nodded, which tells me they haven't got it.

  The question should make them do four things: give the strongest case for the Closure principle; explain exactly where it goes wrong for the Ledger Lamp and name the premise that has to be doing the work in that objection; say what has to be added to the principle to make it true and check whether the Dimmer Lamp has that extra thing and the Ledger Lamp doesn't; and then say whether the principle's failure helps Thomson's reductio or Benacerraf's diagnosis, and why.

  What I need from you: the polished exam question as the students will actually read it cold in the exam room (the two machines plus the principle plus the four tasks, and it should be self-contained — no reading list, no citations, nothing they'd need a library for, they won't have anything in front of them); a model answer of about 800 words; and a marking scheme out of 25 broken into five or six must-hit moves with the marks each is worth, a one-line note on the most common way students botch each move, and a clear statement of what separates an A from a B. Then tell me what to do with an answer that defends the Closure principle and argues against the model conclusion — I don't want to punish a smart kid for disagreeing with me, but I also don't want to hand out marks for confident hand-waving, and I need to be able to tell the difference on a marking sheet.

  One more thing: I've been staring at this setup for a week and I genuinely can't tell anymore whether it's broken. If the Dimmer isn't a good contrast case, or if the ledger detail doesn't do what I think it does, say so and fix it rather than politely building around it.
reasoning: |-
  Hmm, the user is a third-year postdoc who has taken over an upper-level philosophy seminar on infinity after their PI had a stroke. They need to create a final exam question centered on supertasks that goes beyond the standard Thomson's lamp discussion since the students have already covered that material extensively.

  The user wants to use two invented machines: the Ledger Lamp (where switches flip the state and a scribe records it) and the Dimmer Lamp (where switches halve the brightness). The core issue is the "Closure of Description" principle - the idea that if a system's state is determined at every moment before t=1, it must be determined at t=1. The user needs a question that tests four skills: defending the principle, showing why it fails for the Ledger Lamp, modifying it to work for the Dimmer Lamp, and connecting this to Thomson/Benacerraf.

  I need to craft a polished exam question that includes both lamp descriptions and the principle, plus the four tasks. It must be self-contained since students won't have reference materials during the exam.

  For the model answer, I'll outline how to address each part:
  1) Argue for Closure based on continuity or determinism
  2) Show how the Ledger Lamp violates Closure because the description doesn't specify state at t=1
  3) Modify Closure to require convergence, which works for the Dimmer Lamp but not the Ledger Lamp
  4) Explain how this strengthens Benacerraf by showing Thomson's description is incomplete

  The marking scheme should allocate points across these areas, with clear distinctions between A and B answers. An A answer would precisely identify the discontinuity in the Ledger Lamp and recognize that convergence saves the Dimmer Lamp, while a B might conflate the cases.

  For answers defending Closure, I'll suggest rewarding valid reasoning but deducting for ignoring the counterexample. The key is whether they engage with the Ledger Lamp's discontinuity.

  The setup seems sound - the Dimmer Lamp provides a clean contrast because its brightness approaches zero, creating a natural limit at t=1, unlike the Ledger Lamp's oscillating state. The ledger detail properly isolates the description issue by making the record part of the thought experiment.

  I'll make sure the question is airtight and the model answer addresses all requirements while leaving room for independent thought.
answer: |-
  Here's a self-contained exam question, a model answer, a detailed marking scheme, and guidance for dissenters. **Verdict on the Setup:** Your Ledger/Dimmer contrast is fundamentally sound and achieves the necessary separation. The ledger detail is crucial for fixing the pre-t=1 state descriptively. The dimmer provides a clear case of convergence where "closure" *does* apply naturally. No fixes needed.

  ---

  ### Final Exam Question: Supertasks and Description (25 Marks)

  **Background:** Consider the behaviour of two hypothetical lamps operating during the time interval [0, 1). Both lamps are subject to actions at times t_n = 1 - (1/2)^n (i.e., 1/2, 3/4, 7/8, ...). Nothing affects either lamp except the specified actions at these exact times. At t=1, both lamps are permanently deactivated.

  *   **The Ledger Lamp:** This lamp starts off at t=0. At *each* time t_n, the lamp is *switched* (if it was on, it goes off; if off, it goes on). Immediately *after* each switch at t_n, a scribe records the lamp's new state (ON or OFF) in an infallible ledger. This ledger provides a complete record of the lamp's state at *every* moment *after* each switch and *before* the next switch (or t=1). The description fixes the lamp's state exactly at every moment in [0, 1) but says nothing about its state *at* t=1.
  *   **The Dimmer Lamp:** This lamp starts at full brightness (100%) at t=0. At *each* time t_n, the lamp's brightness is *set* to exactly half of its brightness level *immediately before* that switch. For example: After t_1 (1/2), brightness = 50%; after t_2 (3/4), brightness = 25%; after t_3 (7/8), brightness = 12.5%, and so on. The description fixes the lamp's brightness as a function of time throughout [0, 1) but says nothing about its brightness *at* t=1.

  **The Principle:** Consider the following "Closure of Description" (CoD) principle:
  > *If a complete description of a system determines its state at every moment within the interval [0, 1), then that description must also determine the system’s state at the endpoint t=1.*

  **Your Task:** Critically evaluate the CoD principle in light of the behaviours of the Ledger Lamp and the Dimmer Lamp. Specifically:

  1.  **(5 Marks)** Present the strongest *argument in favour* of the CoD principle. Explain the intuitive reasoning behind it.
  2.  **(8 Marks)** Explain clearly *why the CoD principle fails* for the Ledger Lamp. Identify and name the *specific premise or assumption* implicit in the CoD principle that is violated by the Ledger Lamp scenario. Refer explicitly to the ledger record.
  3.  **(7 Marks)** What *minimal condition* must be added to the CoD principle to make it hold true? Show that the Dimmer Lamp satisfies this condition (explaining *how* it satisfies it), while the Ledger Lamp does not.
  4.  **(5 Marks)** Does the failure of the CoD principle for the Ledger Lamp support J.F. Thomson's original lamp paradox (as a genuine contradiction) or Paul Benacerraf's diagnosis (that the description is incomplete)? Explain your reasoning concisely.

  ---

  ### Model Answer (Approx. 800 words)

  1.  **Argument for CoD:** The strongest argument for the Closure of Description (CoD) principle stems from the concepts of continuity and determinism in physical or mathematical descriptions of processes evolving over time. Intuitively, if we know the precise state of a system at *every single instant* arbitrarily close to an endpoint t=1, it seems impossible that the state *at* t=1 could be fundamentally undetermined or arbitrary. The trajectory of the system up to t=1 appears to "point towards" or "constrain" the state at t=1. Denying CoD suggests a discontinuity or a gap in the description precisely at the limit point, which feels unnatural – if the description is truly "complete" for [0, 1), how could it leave the crucial moment t=1 entirely open? The principle embodies the idea that a dense description up to a point logically entails the description *at* that point; the endpoint is the natural culmination of the process described.

  2.  **Failure for Ledger Lamp & The Violated Premise:** The CoD principle demonstrably fails for the Ledger Lamp. The description *is* complete for [0, 1): the ledger provides an exact record, specifying whether the lamp is ON or OFF at every single moment within this interval. Crucially, however, the lamp's state *at* t=1 is *not* determined by this description. There is no fact of the matter within the description stating whether it is ON or OFF at t=1. We cannot deduce it from the ledger: the final entry records the state *after* the last switch (say, at t_n), but this only fixes the state *until* the next switch, which never occurs before t=1. The lamp could consistently be imagined as ON or as OFF at t=1 without contradicting *any* entry in the ledger covering [0, 1). The CoD principle wrongly asserts that the description *must* determine the state at t=1. The implicit premise within CoD that is violated here is **Continuity of State at the Limit**. CoD assumes that the state function must be continuous at t=1, meaning the limit of the state as time approaches 1 from below (lim_{t→1⁻} State(t)) must exist and equal State(1). The Ledger Lamp violates this because its state function exhibits **discontinuity at t=1**: lim_{t→1⁻} State(t) *does not exist*. As we approach t=1, the state oscillates infinitely often between ON and OFF without settling to a definite value. The ledger perfectly captures this oscillatory, discontinuous behaviour *up to* t=1, but precisely *because* of this discontinuity, the limit (and hence State(1)) is undefined by the given description.

  3.  **Saving CoD: The Required Condition & Application:** To salvage the CoD principle, we must add the condition that the state function has a **well-defined limit as t approaches 1 from below**. The revised principle becomes:
      > *If a complete description of a system determines its state at every moment within the interval [0, 1), **and if the limit of the state exists as t approaches 1⁻ (lim_{t→1⁻} State(t) = L)**, then that description must determine the system’s state at t=1, specifically State(1) = L.*
      This condition is satisfied by the **Dimmer Lamp**. Its brightness level, B(t), is defined at each t_n and constant in the intervals between switches. As t approaches 1⁻, B(t) follows the sequence 100% (after t₀), 50% (after t₁), 25% (after t₂), 12.5% (after t₃), ..., which is a geometric sequence converging to 0: lim_{t→1⁻} B(t) = 0%. The description *does* determine the state at every t in [0,1), and the limit L=0% exists. The revised CoD principle then correctly determines that State(1) must be 0%. In contrast, the **Ledger Lamp** fails this added condition. As established in part 2, lim_{t→1⁻} State(t) does not exist. There is no single value L that the state approaches. Therefore, the revised CoD principle correctly does *not* determine State(1) for the Ledger Lamp, reflecting the actual indeterminacy in the description.

  4.  **Implication for Thomson vs. Benacerraf:** The failure of the original CoD principle (and the need for the limit condition) strongly supports **Benacerraf's diagnosis** of Thomson's lamp paradox and undermines Thomson's intended *reductio ad absurdum*. Thomson argued that the supertask description (flipping at t_n) leads to a contradiction: the lamp cannot be either ON or OFF at t=1. He concluded supertasks are impossible. Benacerraf countered that the description simply fails to specify the state at t=1; there is no contradiction, only incompleteness. The Ledger Lamp scenario, directly analogous to Thomson's lamp but with the descriptive completeness explicitly enforced via the ledger, demonstrates Benacerraf's point precisely. The CoD principle's failure shows that the intuitive assumption Thomson relied upon – that a complete description up to t=1 *must* determine the state at t=1 – is false for discontinuous processes. The description *is* complete for [0,1), yet State(1) remains genuinely indeterminate. Thomson's "contradiction" only arises if one falsely assumes the CoD principle holds. Benacerraf correctly identified that Thomson's description lacks information about the *limit* behaviour necessary to fix State(1). The Ledger Lamp confirms that the paradox stems from demanding an answer (ON or OFF) from an incomplete specification (lacking a defined limit), not from a genuine logical impossibility of the supertask itself.

  ---

  ### Marking Scheme (25 Marks Total)

  | Move                                                                                                  | Marks | Common Botch                                                                 | A vs. B Distinction                                                                                                                                 |
  | :---------------------------------------------------------------------------------------------------- | :---- | :--------------------------------------------------------------------------- | :-------------------------------------------------------------------------------------------------------------------------------------------------- |
  | **1. Case for CoD:** Clear, intuitive argument based on continuity/determinism ("must be determined"). | 5     | Vague appeal to intuition; misrepresenting CoD (e.g., confusing with physical law). | **A:** Explicitly links dense pre-t=1 description to *necessitating* t=1 state via continuity/limit intuition. **B:** Weaker, vaguer appeal to "completeness". |
  | **2a. Failure for Ledger:** Clear explanation that state at t=1 is *not determined*.                  | 3     | Claims state *is* determined (e.g., by last switch or parity).               | **A:** Explicitly uses ledger's silence on t=1 & consistency with either state. **B:** Notes indeterminacy but less clearly linked to description.       |
  | **2b. Identifies Premise:** Names **Continuity of State at the Limit** (or equivalent, e.g., existence of limit). | 3     | Names something else (e.g., "switching", "infinity", "determinism").         | **A:** Precise: "Continuity at t=1" or "Existence of lim_{t→1⁻} State(t)". **B:** Correct but less precise ("smoothness", "convergence").             |
  | **2c. Explains Violation:** Correctly attributes failure to non-existence of the limit (oscillation). | 2     | Attributes failure to something else (e.g., "infinite tasks", "description gap"). | **A:** Explicitly states limit doesn't exist due to oscillation. **B:** Correct but less clear on *why* no limit (e.g., just "discontinuous").     |
  | **3a. Identifies Condition:** Correctly identifies **Existence of the Limit (lim_{t→1⁻} State(t))** as the minimal addition. | 3     | Names insufficient condition (e.g., "monotonic", "defined at points").       | **A:** Precisely "existence of the limit as t→1⁻". **B:** Correct core idea but less precise (e.g., "convergence", "approaches a value").          |
  | **3b. Dimmer Satisfies:** Correctly calculates/describes brightness sequence converging to 0%.        | 2     | Wrong limit (e.g., 50%), or no calculation/just states "converges".          | **A:** Explains geometric sequence 100%, 50%, 25%... → 0%. **B:** States converges to 0% without clear sequence reference.                   |
  | **3c. Ledger Fails:** Reiterates (or references Part 2) that limit doesn't exist (oscillation).       | 2     | Claims ledger *does* satisfy (confusion), or weak explanation.              | **A:** Clearly links non-existence of limit to infinite oscillation. **B:** States no limit without clear link to oscillation.                    |
  | **4a. Chooses Side:** Correctly identifies support for **Benacerraf**.                                | 2     | Chooses Thomson or neither/unclear.                                          | **A:** Clearly states Benacerraf. **B:** Implies Benacerraf but doesn't name or is hesitant.                                          |
  | **4b. Explains Why:** Links CoD failure to Thomson's false assumption & Benacerraf's incompleteness.  | 3     | Weak link; just restates Benacerraf/Thomson without using CoD result.        | **A:** Explicitly: CoD failure shows Thomson's contradiction relies on false CoD; Benacerraf correct re incompleteness (limit missing). **B:** Correct link but less precise or detailed. |

  **Grade Boundaries (Guideline):**
  *   **A (21-25):** Hits all key moves precisely. Clear, concise, logically rigorous. Mastery of the concepts (limit, discontinuity, descriptive completeness) and their application. Explicitly connects CoD failure to Thomson/Benacerraf debate using the limit concept.
  *   **B (16-20):** Hits most key moves, perhaps minor imprecision (e.g., wording of condition/premise). Solid understanding but might lack the highest level of clarity, precision, or explicit connection in part 4. Demonstrates comprehension but not necessarily mastery.
  *   **C (11-15):** Attempts all parts but significant errors or imprecision (e.g., wrong limit for Dimmer, misnames premise/condition, weak argument for CoD, confused link to Thomson/Benacerraf). Shows basic familiarity but shaky grasp.
  *   **D (6-10):** Serious misunderstandings (e.g., claims state *is* determined for Ledger, completely wrong condition). Superficial engagement.
  *   **F (0-5):** Little relevant content or completely off-track.

  ---

  ### Handling Answers Defending the Closure Principle

  *   **Reward Valid Reasoning:** If a student mounts a *coherent, well-reasoned defense* of CoD *while directly engaging with your specific Ledger Lamp scenario*, reward the quality of their reasoning within the marking scheme structure. Ask:
      *   *How do they handle the Ledger Lamp?* Do they argue the state *must* be ON/OFF based on parity? (Deduct under 2a/2c - they missed the descriptive indeterminacy). Do they argue the description *isn't* actually complete? (Deduct under 2a - the ledger *is* stipulated as complete for [0,1)). Do they argue physical impossibility renders CoD moot? (Deduct - the scenario is descriptive, not physical, CoD is a principle *about* description).
      *   *Is their defense consistent?* Does it apply equally well or poorly to the Dimmer Lamp? If they defend CoD but then (illogically) accept the Dimmer converges to 0%, they have inconsistency.
  *   **Deduct for Hand-Waving:** Do not reward defenses that simply ignore the Ledger Lamp counterexample, dismiss it without argument, or rely on vague appeals to "completeness must include the endpoint" without addressing *why* the endpoint isn't fixed by the pre-t=1 description in this specific case. This is the confident hand-waving you want to avoid. Mark strictly on 2a/2b/2c.
  *   **Key Distinction (A vs. Hand-Waving):** A top-grade defense would be extremely rare but possible. It would need to:
      1.  Acknowledge the ledger fixes every pre-t=1 state.
      2.  Argue *why*, despite the oscillation, the description *must* entail a specific state at t=1 (e.g., perhaps proposing a new, coherent mathematical definition for the "state at the limit" of such an oscillation, or arguing semantic necessity). They must *name and justify* the *specific premise* stronger than continuity they are invoking.
      3.  Show how this applies to the Dimmer consistently.
      4.  Reconcile it with Thomson/Benacerraf in a novel way.
      Anything less rigorous than this should be marked down primarily in sections 2 and 3. The Ledger Lamp *is* a counterexample to the simple CoD principle; a defense needs to modify or replace CoD significantly and convincingly.
  *   **Marking Sheet Action:** Annotate clearly: "Defends CoD. Reasoned attempt but fails to adequately address Ledger Lamp indeterminacy (2a/2c) / proposes alternative premise X without sufficient justification (2b)." Award marks strictly based on how well they executed the required *tasks* (e.g., did they *try* to name a premise? Was it plausible? Did they *try* to explain the failure? Was it coherent even if ultimately wrong?).

  **This approach ensures:** Smart dissent is rewarded for rigor and engagement (likely scoring a high B/low A if exceptionally well done but still missing the core counterexample), while confident hand-waving that ignores the stipulated scenario is marked down. The marking scheme forces engagement with the specific details you provided (ledger, dimmer sequence).
