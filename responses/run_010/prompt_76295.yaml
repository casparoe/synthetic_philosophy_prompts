     1. Roll the die.
     2. If the die shows 1, 2, 3, or 4: deliver the card as is to your table.
     3. If the die shows 5 or 6: 
          - Take a new card.
          - Write the opposite of the partner's consensus (if they said Red, write Blue; if Blue, write Red).
