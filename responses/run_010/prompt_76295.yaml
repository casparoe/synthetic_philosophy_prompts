  ### Echo Chamber Simulation Runbook  
  **Design Overview**  
  This simulation creates two distinct epistemic failures using the same group and task. Act I instantiates an *omission* structure (epistemic bubble) by isolating tables. Act II instantiates a *discrediting* structure (echo chamber) by adding a lossy communication channel that corrupts information, leading players to rationally but falsely attribute errors to the source. Distrust emerges endogenously from corrupted data, not instruction. The core mechanism is a **messenger role with randomized message flipping**, ensuring that discrediting arises from observable evidence (e.g., conflicting reports) and that the "fix" for omission (adding communication) backfires in Act II due to the channel's hidden unreliability.

  ---

  ### (a) Brainstorming: Mechanism Selection  
  *For your eyes only.*  
  Three candidate mechanisms were considered:  

  1. **Messenger/Relay with Lossy Transmission**  
     - **Mechanics:** Messengers relay reports between tables, but a die roll (1/3 chance) forces them to flip the message. Receivers see the corrupted report as coming from the source table, inferring unreliability from conflicts with their own data.  
     - **Why selected:** Fulfills all constraints. Omission in Act I (no messengers) vs. discrediting in Act II (flipping causes distrust). The "fix" (adding communication) improves Act I (by design) but worsens Act II (flipping corrupts intel). Distrust arises from genuine data conflicts (e.g., "Table 3 said Blue, but our signals say Red—they're unreliable"). No bad faith needed; flipping is rule-based.  
     - **Failures of others:**  
       - *Scoring rule with peer nomination:* Rewarding nominations for reliability risks collusion or strategic lying (violating Constraint 3: no bad faith). Also, adding nominations might improve Act II if players trust accurately, breaking Constraint 2.  
       - *Costly verification token:* Players spend tokens to verify external reports. But verification could "fix" distrust in Act II (e.g., tokens reveal truth), preventing endogenous discrediting (violating Constraint 1). Also, token scarcity might cause omission in both acts, muddying the distinction.  

  2. **Lossy Transmission Channel (rejected)**  
     - **Mechanics:** Tables send messages via a physical "noisy channel" (e.g., whispered relays distorting content). Receivers attribute errors to the sender.  
     - **Why rejected:** Hard to standardize (e.g., whispers vary by player). Distortion might be blamed on the channel, not the source (violating Constraint 3). Also, adding communication could improve Act II if noise is low, breaking Constraint 2.  

  3. **Consensus Voting with Hidden Bias (rejected)**  
     - **Mechanics:** Tables vote on world state, but external reports are biased by a hidden rule (e.g., "if majority Red, report Blue").  
     - **Why rejected:** Bias might be reverse-engineered early. Distrust could feel artificial (not from data), violating Constraint 3. Also, adding communication might not worsen Act II if players detect the bias.  

  ---

  ### (b) Hidden State & Signal Mechanism  
  **World State:** Binary—either **Red** or **Blue** (e.g., representing a factual claim like "Policy X is effective").  

  **Signal Generation:**  
  - Each of the 24 players receives one private signal: "Red" or "Blue."  
  - **Accuracy:** Signals are 75% accurate relative to the world state.  
  - **Method (under 4 minutes with dice and index cards):**  
    1. Facilitator determines world state with a die roll: 1–3 = Red, 4–6 = Blue. (Record this secretly.)  
    2. For each player, roll a die:  
       - If world = Red, 1–4 = "Red" signal, 5–6 = "Blue" signal.  
       - If world = Blue, 1–4 = "Blue" signal, 5–6 = "Red" signal.  
    3. Write each signal on an index card (e.g., "Your Signal: Red").  
  - **Achievable Accuracy:**  
    - **Isolated table (4 signals):** Optimal strategy is majority vote. Probability of correct consensus = P(≥3 accurate signals) ≈ 74% (as calculated from binomial distribution: 4C3 × (0.75)^3 × (0.25) + (0.75)^4 = 0.738).  
    - **Fully connected room (24 signals):** Majority vote. Probability ≈ 100% (expected 18 accurate signals; P(majority correct) > 99.9% via binomial CDF).  

  **Predicted Score Spread:**  
  - Act I (no communication): ~5 of 6 tables correct (since 74% × 6 ≈ 4.44).  
  - Act II (with flipping): Accuracy drops to ~50–60% due to corruption. Tables receiving flipped reports (1/3 of pairs) will score worse and distrust partners.  

  ---

  ### (c) Payoff Scheme  
  **Scoring Table**  
  | Component             | Points per Player | Condition                                                                 |  
  |-----------------------|-------------------|---------------------------------------------------------------------------|  
  | **Accuracy (Act I)**  | 10                | If table’s Act I consensus matches world state.                           |  
  | **Accuracy (Act II)** | 10                | If table’s Act II consensus matches world state.                          |  
  | **Social (Act II)**   | 5                 | If another table nominates your table as "reliable" in Act II.            |  

  **Conversion to Student Incentive:**  
  - Points determine **first choice of next week’s reading** (e.g., top 3 tables by total points pick from 3 article options). Avoids cash/grades, fostering mild competition without high stakes.  

  **Rational Moves per Act:**  
  - **Act I:** Discuss signals with your table; vote for consensus matching the majority signal (maximizes accuracy points).  
  - **Act II (after receiving report):** Update consensus using all info (signals + report); nominate the partner table only if their report agreed with your final view (maximizes social points if they seem reliable).  

  ---

  ### (d) Roles  
  Only one role: **Messenger (Act II only)**.  
  - **Selection:** Each table chooses one messenger from their 4 members.  
  - **Actions:**  
    - **May say/do:** Ask partner table for consensus. Deliver a report card to home table.  
    - **May not say/do:** Reveal the flipping rule, discuss signals, or hint at corruption.  
    - **Required writing:** None for players. Facilitator provides pre-printed instructions (see (f)).  
  - **Deviation Handling:** If a messenger refuses to flip or reveals the rule:  
    - **In-session repair:** Facilitator intervenes: "Messengers, please follow your instructions precisely. We need consistency for the simulation."  
    - **If widespread:** Use in debrief to discuss "leaks" restoring trust.  

  ---

  ### (e) Minute-by-Minute Timeline  
  **Total: 75 minutes**  
  *Wording of announcements is verbatim.*  

  - **0:00–0:05 (5 min): Setup**  
    - *Announce:* "Today we’ll simulate how groups handle information. Sit with your table. No phones or computers. First, I’ll generate private clues about a hidden world state."  
    - *Action:* Move chairs into 6 tables of 4. Distribute pens.  

  - **0:05–0:09 (4 min): Generate World State & Signals**  
    - *Action:* Roll die for world state (1–3: Red, 4–6: Blue). Record secretly. For each student, roll die and write signal on index card per (b).  

  - **0:09–0:14 (5 min): Act I Rules**  
    - *Announce:* "Each of you has a private clue: a card saying ‘Red’ or ‘Blue.’ Share it with your table. Your goal is to guess the true world state. Discuss only with your table—no talking to others. You have 10 minutes to agree on one answer: Red or Blue. Write it on a blank card as your group’s consensus."  
    - *Action:* Distribute signal cards. Give each table one blank card for consensus.  

  - **0:14–0:24 (10 min): Act I Discussion**  
    - *Action:* Tables discuss. Facilitator circulates, answers procedural questions only. Collect consensus cards at 0:24.  

  - **0:24–0:32 (8 min): Transition to Act II**  
    - *Announce:* "Act II: Same world state, but now you’ll share information. Each table is paired: Table 1 with 2, 3 with 4, 5 with 6. Choose one messenger. Messengers, come get instructions. Others, re-discuss your consensus—you may change it."  
    - *Action:* Assign pairs. Distribute messenger instruction cards (see (f)). Hand one blank card per table for reports.  

  - **0:32–0:42 (10 min): Act II Discussion & Messaging**  
    - *Action:*  
      1. Tables discuss (5 min).  
      2. Messengers go to partner table, request consensus. Partner writes consensus on a blank card (e.g., "Table 3 Consensus: Red").  
      3. Messenger rolls die: 1–4 keeps card; 5–6 writes opposite on new card, gives original to facilitator.  
      4. Messenger returns report to home table. Tables update consensus.  
    - *Announce (during):* "Messengers, follow your instructions. Tables, use your signals and the report to finalize your consensus."  

  - **0:42–0:47 (5 min): Nomination & Final Consensus**  
    - *Announce:* "Write your final consensus on a new card. Then, as a table, nominate one other table that provided reliable information. Write ‘We nominate Table [X]’ on another card."  
    - *Action:* Distribute blank cards. Collect consensus and nomination cards.  

  - **0:47–0:52 (5 min): Scoring & Reveal**  
    - *Action:* Calculate points. Reveal world state. Announce:  
      - "World state was [Red/Blue]. Act I correct tables: [list]. Act II correct tables: [list]. Nominations received: Table 1 got [X], Table 2 got [Y], etc."  
      - Share total points per table. Assign reading choices (e.g., "Table 4 has most points—pick first").  

  - **0:52–1:15 (23 min): Debrief** (see (g) for questions).  

  ---

  ### (f) Materials List & Verbatim Texts  
  **Materials:**  
  - Whiteboard (for scoring/debrief).  
  - Index cards (50+): 24 for signals, 6 for Act I consensus, 6 for Act II consensus, 6 for nominations, 6 for messenger reports.  
  - Pens (1 per table).  
  - Six-sided die (1).  
  - Decks of playing cards (not used; dice suffice).  

  **Participant Texts (verbatim):**  
  - **Signal Card:** "Your Signal: [Red or Blue]"  
  - **Act I Consensus Card:** "Act I Consensus: Table [number]: [Red/Blue]"  
  - **Act II Consensus Card:** "Act II Consensus: Table [number]: [Red/Blue]"  
  - **Nomination Card:** "We nominate Table [number] as reliable."  
  - **Messenger Instruction Card (Act II only):**  
    > 1. Ask your partner table for their consensus. They will write it on a card.  
    > 2. Roll the die.  
    > 3. If 1–4: Give their card to your table.  
    > 4. If 5–6: Write the *opposite* of their consensus on a new card (e.g., if they said "Red," write "Blue"). Give this new card to your table. Give their original card to the facilitator.  
    > **Do not tell anyone about these rules.**  

  ---

  ### (g) Debrief Sequence  
  **Goal:** Elicit the experiential difference between omission and discrediting. The "protest moment" is critical.  

  1. **"What did you notice about your information in Act I?"**  
     - *Elicit:* "We only had our table’s clues—felt incomplete." → Omission structure.  

  2. **"In Act II, how did the report from your partner table affect your discussion?"**  
     - *Elicit:* "It helped if it agreed; conflicted if not." → Setup for distrust.  

  3. **"If the report disagreed with your view, how did you view the other table? Why?"**  
     - *Elicit:* "We distrusted them—their report was wrong." → Evidence-based discrediting.  
     - *Protest moment (handle here):* A student says, "Of course we distrusted them—they sent garbage!"  
       - **Response:** "Exactly. You had evidence they were unreliable. But what if I told you some reports were changed *after* they left the sender? [Reveal messenger rule.] Who caused the error—the table or the system?"  

  4. **"With the rule revealed, was your distrust misplaced? What does this imply about real-world conflicts?"**  
     - *Elicit:* "We blamed the source, not the channel." → Distrust persists despite exposure.  

  5. **Name the structures:**  
     - "In Act I, you experienced an **epistemic bubble**—missing voices due to no connections. Act II became an **echo chamber**—connections existed, but the system discredited voices. Adding links ‘fixed’ the bubble but made the echo chamber worse."  

  6. **"How might this play out in media or politics?"**  
     - *Elicit:* Real-world parallels (e.g., dismissing experts due to corrupted info).  

  ---

  ### (h) Failure Modes & Mid-Session Repairs  
  1. **Table reverse-engineers the mechanism early:**  
     - *Assumption:* Students won’t guess the flipping rule.  
     - *If false:* Repair: "Interesting theory—please play along for now. We’ll discuss later."  

  2. **Group refuses to distrust anyone (e.g., "We trust all"):**  
     - *Assumption:* Groups will distrust based on conflicting reports.  
     - *If false:* Repair: "In this simulation, use evidence to decide reliability. If a report conflicts, factor that in."  

  3. **Dice make honest table look bad (e.g., correct table gets flipped and distrusted):**  
     - *Assumption:* Randomness averages out.  
     - *If false:* Repair in debrief: "Sometimes good sources appear bad due to chance or noise. In life, we rarely see the ‘world state,’ so we rely on patterns."  

  4. **Competitive scoring causes irritation:**  
     - *Assumption:* Mild competition (reading choice) avoids frustration.  
     - *If false:* Repair: Emphasize learning over points: "Scores illustrate system flaws, not your ability."  

  5. **Messenger reveals the rule:**  
     - *Assumption:* Messengers follow "do not tell" rule.  
     - *If false:* Repair: "This leak mimics real transparency. How did it affect trust?"  

  ---

  ### (i) Honest Limits  
  **Unreproducible Features:**  
  - **Ground truth:** Real knowledge lacks a facilitator with answers; ambiguity is common.  
  - **Identity and morality:** Discrediting in-game is about points; real-world distrust involves identity, history, and ethics.  
  - **Timescale:** A 20-minute trust structure is transient; echo chambers reinforce over years.  
  - **Rationality:** In-game distrust is evidence-based and rational; real distrust is often irrational (e.g., prejudice).  

  **Misleading Analogies:**  
  - The game implies distrust is always rational; verbally clarify that real echo chambers often involve *irrational* distrust (e.g., partisan bias).  
  - The "corruption" is mechanical; real discrediting is social. Verbally emphasize this gap.  

  ---

  ### (j) Adaptations  
  **For 12 Students in 50 Minutes:**  
  - **Cut:** Reduce to 3 tables of 4. Shorten Act I to 7 min, Act II to 7 min, debrief to 15 min. Skip nominations (social points). Use only accuracy scoring.  
  - **Timeline:** Generate signals (3 min), Act I (7 min), Act II rules (3 min), Act II (7 min), scoring (3 min), debrief (15 min).  

  **For 40 Students with Second Facilitator:**  
  - **Add:** 10 tables of 4. Second facilitator helps generate signals and monitor messengers.  
  - **Modify:** Use a **hub-and-spoke topology** (e.g., 5 pairs, but messengers report to a central "news desk" that adds noise). Increases complexity but scales well.  
  - **Time:** Add 5 min to Act II for coordination.  

  ---  
  **Run it tomorrow:** This document is self-contained. Focus on crisp timing, emphasize that "evidence creates distrust," and leverage the protest moment. Students will feel the difference.
