  (i) honest limits.

  - The game has a ground truth: real-world knowledge issues often lack clear answers.
  - Discrediting in the real world involves identity, moral standing, and history; here it's about points and a 20-minute game.
  - Trust structures in the game are short-lived; in reality, they are reinforced over time.
  - Distrust in the game is rational given the evidence; in reality, distrust may be irrational or prejudiced.

