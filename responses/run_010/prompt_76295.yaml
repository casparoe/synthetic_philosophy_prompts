  Handling the protest: When a student says "of course we distrusted them, they sent us garbage," that's the key moment. 
  - Acknowledge: "Exactly. And from your perspective, that was rational. You had evidence that they were unreliable. But what was the real cause? Was it the other table's fault, or the system?" 
  - Then reveal the messenger rule. 
  - Then: "This is the danger of an echo chamber: the structure corrupts the information flow, and then the recipients blame the source, not the channel. And that distrust persists."

  (h) failure modes.

  1. Table reverse-engineers the mechanism early.
     - Repair: If a table figures out the flip rule, the facilitator can say: "That's an interesting hypothesis. For now, please play along as if you don't know, so we can see how it unfolds."

  2. Group refuses on principle to distrust anyone.
     - Repair: "In this simulation, you are to make decisions based on the evidence you have. If the evidence suggests a source is unreliable, you should factor that into your decisions."

  3. Round in which the dice make the honest table look bad: e.g., a table that is correct in Act I gets a flip in Act II and then is wrong, and the other table distrusts them.
