  Signal cards: Just write "Red" or "Blue".

  Act I consensus card: "Act I Consensus: Table [number]: [Red/Blue]"

  Act II consensus card: "Act II Consensus: Table [number]: [Red/Blue]"

  Nomination card: "We nominate table [number] as the most reliable source."

  Messenger instruction card (one per messenger in Act II):
