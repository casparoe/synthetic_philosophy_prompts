  (g) debrief.

  Ordered sequence of questions:

  1. "What did you notice about the information you had in Act I?" 
     - Elicit: limited to their own table, felt like they might be missing something.

  2. "In Act II, you received a report from another table. How did that affect your discussion?"
     - Elicit: they had more information, but sometimes it conflicted.

  3. "For tables that received a report that agreed with your own view, how did you feel about the other table? For those that disagreed?"
     - Elicit: agreement increased trust, disagreement increased distrust.

  4. "Now that you know the world state, look at the report you received. If it was wrong, why do you think that was?"
     - Some will blame the other table. Wait for the protest: "But we were feeding them garbage? No, we were correct, it must have been the messenger?"

  But the messenger rule was secret. So they might say: "The other table must have given us wrong information."

  Then the protest: "But we didn't! We gave them our true consensus."

  This is the moment: they realize the report was corrupted in transit.

  5. "Some of you are saying that you sent the correct information but the other table received something else. How is that possible?"
     - Elicit: the communication channel might have been unreliable.

  6. "But did you have any way of knowing that at the time? What evidence did you have about the other table's reliability?"
     - Elicit: only the report they received, which was sometimes wrong.

  7. "So when the report was wrong, you concluded the other table was unreliable. But now you learn that the report was changed after it left their hands. How does that change your view?"
