  Let's start with (a) brainstorming.

  Candidate mechanisms:

  1. **Messenger/Relay with Lossy Transmission**: 
     - Each table has a private signal about the world. They can send a messenger to another table, but the messenger may distort the message (unintentionally). In Act I, no messengers (omission). In Act II, messengers are introduced but they distort, leading to discrediting because the receiving table sees the distorted message as coming from the other table and infers that the other table is unreliable.
     - Why it might fail: The distortion might be seen as the messenger's fault, not the sending table's. Also, it might be hard to set up the distortion without it being obvious.

  2. **Scoring Rule with Peer Nomination**:
     - Participants earn points for accuracy and for being nominated as a reliable informant by others. In Act I, no communication, so no nominations. In Act II, they can nominate, but if they nominate someone from another table, that person might intentionally misreport to earn points (but constraint 3 requires no bad faith). So we need a way for misreporting to happen without bad faith.
