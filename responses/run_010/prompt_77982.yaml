answer: |-
  **Yes, the case can be built as specified. Only the give-up-the-gain claim survives the innocent-descendant objection.**

  In the town of Elmwood, four generations ago, the founding Carter family owned a prime plot of land with crucial water rights where Oak Creek met the main river. The town council, dominated by the Thornton family, voted to use eminent domain to seize the land for a public gristmill, arguing it was vital for the town's growth. The taking was legally dubious (the "public use" was thinly veiled, as the Thorntons controlled the mill company leasing it) and the initial compensation offered was far below market value—only $500 for land valued at $2,000. The Carters sued. After a lengthy court battle, a settlement was reached: the Carters received $3,000 cash (150% of the land's fair value at the time) plus lifetime free milling for their grain. This covered their direct loss (the land), compensated for the legal battle, stress, and disruption, and provided a premium for the forced taking. The Carter descendants today are prosperous farmers and professionals; economists confirm they are *no worse off* financially or socially than they would be if the land had never been taken (the $3,000, wisely invested, compounded similarly to land value, and they avoided the mill's eventual operational risks). There's no lingering stigma or lost opportunity chain—the settlement truly closed the book on harm. Meanwhile, the Thornton descendants still own the historic mill *building* (now a boutique), which only exists because it was built on the wrongfully taken land. They inherited it innocently, unaware of the shady origins.

  **Analysis:**

  1.  **Harm-and-Compensation View:** This view asks: "Who alive today was harmed by the original wrong, and what compensation do they need to be made whole?" Since the original harm (loss of land, legal costs, disruption) was fully compensated at the time ($3,000 + free milling far exceeding the $2,000 loss), and since Carter descendants demonstrably aren't worse off now, **nothing is owed to anyone today.** The compensation was complete and successful. The innocent Thornton descendants holding the mill building is irrelevant to this calculation; they didn't cause harm.
  2.  **Give-Up-the-Gain View:** This view asks: "Does someone hold a specific, traceable asset that constitutes an unjust enrichment gained *because of* the original wrong, regardless of subsequent innocence?" The mill building itself only exists because the land was taken under dubious circumstances. The Thorntons' initial gain (acquiring the crucial land cheaply for their mill project) was unjust. While the Carters were compensated for their *loss*, the Thorntons *kept the asset built on that gain*. The current Thornton descendants, though innocent, hold that traceable asset—the mill building—which embodies the wrongful gain. **The claim is that the building (or its current value) should be disgorged, likely to the town or a community fund (not necessarily the Carters, as they have no *harm* claim), to eliminate the lingering unjust enrichment.** The reasoning is about correcting the *distribution* of benefits derived from the wrong, not compensating for ongoing harm.

  **Innocent-Descendant Objection:**

  *   **Defeats the Harm Claim? YES.** The objection ("Why should *I* pay for my ancestor's wrong when I did nothing and the victims were already paid?") directly negates the harm-and-compensation claim. There is no current harm to fix, so demanding payment from innocent descendants based on harm *does* seem unfair and illogical under this view.
  *   **Defeats the Gain Claim? NO.** The objection doesn't negate the core fact: the innocent descendant *still possesses the specific asset gained through the wrong*. The claim isn't based on the descendant's fault; it's based on the nature of the asset they hold. The demand is to relinquish *that specific ill-gotten asset* (or its value), not to pay damages for being blameworthy. The innocence protects them from *blame*, but not necessarily from the obligation to surrender an unjustly obtained possession.

  **The Key Feature:** The continued existence of a **traceable, specific asset embodying the wrongful gain**, held by the wrongdoer's descendants, that persists independently of the compensated harm. The mill building is a concrete, non-dissipated embodiment of the initial unjust enrichment.

  **Breaking It (Asset Sold Off):** If the Thornton descendants sold the mill building two generations ago and spent the money (nothing traceable left), **the give-up-the-gain claim collapses.** The *specific asset* gained from the wrong is gone. There's no longer a traceable embodiment of the unjust enrichment to disgorge. The claim requires a persistent, identifiable asset derived from the wrong. Without it, there's no target for the gain-based claim, just as there's no target for the harm-based claim.

  **Brother-in-Law's Best Move:** His strongest counter is likely: **"The 'gain' isn't pure. The mill building's *current* value includes generations of legitimate investment, upkeep, market changes, and community development that had nothing to do with the original land grab. Disgorging the full current value would force the innocent descendants to forfeit value *they* or their ancestors *legitimately* created, which is itself unjust. The original 'gain' was the below-value land acquisition. That gain was either consumed by the original Thorntons or converted into the *initial* mill structure. That initial structure is long gone; the current building is a different asset. Any claim based solely on the original gain is impossible to calculate fairly now and risks creating *new* injustice."** (This attacks the feasibility and fairness of quantifying and isolating the "unjust gain" component in the present asset).
