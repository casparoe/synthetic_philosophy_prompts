prompt: |-
  I'm third year in economic history and my chapter is about a provincial grain price series spanning roughly two centuries — I'm trying to hook a long, slow trend up to one particular bad harvest and one intendant's decision about whether to open the public granaries. My supervisor read the draft and says the whole framing is confused. Braudel's three timescales, he says, are just weather, seasons, and climate: events are weather, conjonctures are the seasonal cycle, the longue duree is the climate. And you no more explain a famine riot by one official's decision than you explain a heatwave by the shape of one cloud. What you can do is what climatology does — build the distribution, treat the individual storm as noise, and make the field predictive instead of anecdotal. He wants that section cut and replaced with a statistical argument.

  I think the analogy is doing the cutting for him rather than the evidence, but I can't articulate why yet. Can you audit it? Correspondence table first: what plays the atmosphere, the radiative forcing, the thermometer, the 30-year averaging window, the ensemble of model runs, and the forecaster, in the case I'm actually describing. Then the disanalogies — but sorted into the ones that are merely decorative and the ones that bear on the conclusion he's drawing, because that's the distinction he'll press me on and I know he'll press it.

  Two worries I already have and don't know how much they're worth. First, climate statistics come out of an ensemble or out of stationarity, and I only have one non-repeating trajectory, so I'd be reading a distribution off a single path. Second, the thermometer: my price series come from instruments and categories that changed meaning and coverage across the two centuries, which doesn't really happen in meteorology.

  Then tell me what the analogy quietly imports that history lacks, and whether his conclusion survives once all that is on the table — including the weaker version where the analogy gets repaired rather than scrapped. And be honest about whether breaking it actually helps me or just leaves the question open; I suspect the latter. If it's the wrong analogy, is there a better one for the same job? I've been toying with a language, where the structure is real but is made entirely out of individual speech acts — say whether that does better work and what it costs.
