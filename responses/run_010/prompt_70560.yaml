  ---

  **Explanation:**  
  This pantoum adheres to the form’s strict repetition, recycling lines 2 and 4 of each stanza as lines 1 and 3 of the next. The core sentence—*"One chance in a thousand to win a thousand; else, a dollar lost"*—appears in every stanza, evolving in weight:  
  - **Stanza 1:** Introduces the bet and refusal, framing risk as "the spread of ruin."  
  - **Stanza 2:** Repetition emphasizes the agent’s focus on distribution over expected value.  
  - **Stanza 3:** The sentence anchors her theory: risk aversion stems from "clustering" (the outcome’s place in the distribution), not diminishing utility.  
  - **Stanza 4:** Concedes the cost—she cannot evaluate bets "branch by branch," leaving her vulnerable to sequences that exploit her aversion (e.g., repeated positive-EV gambles she refuses, eroding potential gains).  

  The poem implicitly references **rank-dependent expected utility theory** (e.g., Cumulative Prospect Theory), where probabilities are weighted nonlinearly based on their position in the outcome distribution—not marginal utility. A theorist would recognize the emphasis on "clustering" and "spread" as critiques of linear probability weighting. For others, it stands as a meditation on rational hesitation.
