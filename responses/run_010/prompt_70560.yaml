  ### The Risk-Averse Agent's Pantoum

  One chance in a thousand to win a thousand; else, a dollar lost.  
  The expected value gleams, a prize they claim is fair.  
  One chance in a thousand to win a thousand; else, a dollar lost.  
  I weigh the spread of ruin, not the mean, and will not dare.  

  The expected value gleams, a prize they claim is fair.  
