prompt: |-
  I'm an engineer on a small evals team at an AI lab — no psych background, no philosophy background, I write Python and ship things. Our job is the task suite we run on every model before a release, and each cycle we get maybe 25-30 proposed tasks from contractors, interns, and other teams who want their pet capability represented. Triage right now is pure vibes: whoever wrote the task argues for it in standup and the loudest person wins. My roommate is a psych grad student and when I described this to her she said we were reinventing a hundred-year-old argument badly, then talked for forty minutes about whether intelligence is one general thing or a pile of seperate ones, and I still could not apply any of it to a proposal sitting in front of me. I've got about fifteen minutes per proposal, nobody on my team knows psychometrics, and our PM signs off on anything that comes with a clean checklist attached — so if I can hand her a procedure she'll actually make people use it.

  What I want is a decision procedure for the question "does this task measure intelligence, or does it just measure something we already know how to train?" grounded in whatever the actual debate has to say thats usable. I mean the stuff I half-remember from googling: the general-vs-specific argument, the point that raw skill at any task can be bought with priors and training data so what you should care about is how efficiently a system acquires the skill (I think the ARC benchmark guy argues this), the old machine-intelligence paper that defines intelligence as expected performance across a wide range of environments rather than lots of instances of one narrow environment, and whatever philosophy of mind adds — like whether a system that produces the right output without understanding anything counts, and whether a behavioral test could ever tell the difference. Please write it as steps I run in order on a single proposal: what each step asks, what counts as a sufficient answer, which answers end the procedure at reject, which send it back to the proposer with a specific fix, and which steps are secretly judgment calls wearing a checklist costume (I'd rather flag those than pretend). Also mark the points where the procedure has to hand the decision to a human because it's about what we value — which capabilities matter for our product — and not about what a test can find out.

  Then run it on three proposals. One: a set of 200 variations on the same kind of logic-grid puzzle, where our biggest model is at ceiling and our smallest is at 60%. Two: a debugging task on a repo that is a lightly renamed version of a very popular tutorial project, so it's plausibly memorized. Three: my own baby — the model gets a spec for a made-up programming language plus three worked examples and has to write a correct program in it. I think that one is the best thing I've written and I already demoed it to leadership, so if the procedure kills it I want to know exactly which step kills it, and whether the objection is fixable by changing the task instead of throwing it out. Finish with what the procedure can't do: what it will get systematically wrong, what it can never certify no matter how carefully you run it, and why a suite that passes every single step could still be a bad measure of intelligence.
reasoning: |-
  We are creating a decision procedure for evaluating whether a proposed task measures intelligence (as opposed to measuring something we already know how to train). The procedure is inspired by the debates in psychology, psychometrics, and AI about intelligence (e.g., general vs. specific, efficiency of learning, behavioral tests). The steps are designed to be run in order on a single proposal, with clear criteria for rejection, requiring fixes, or passing. We also note which steps are judgment calls and which require human input about values.

  **Decision Procedure: "Does this task measure intelligence?"**

  **Step 1: Is the task novel?**
     - **What it asks:** Does the task require the model to demonstrate a skill or knowledge that is not already known to be within the capabilities of the current models (especially the biggest model) due to prior training?
     - **Sufficient answer:** The task involves a novel combination of skills, a new domain, or a twist that is unlikely to have been seen in training data. If the task is a variation of a common type (e.g., logic puzzles) but in a way that is genuinely new, it might pass.
     - **Reject if:** The task is a direct copy or very close variation of a known dataset or task that is already in the training data (e.g., a popular tutorial). Also reject if the task is so similar to existing tasks that the model can solve it by direct recall or minor adjustments.
     - **Send back for fix:** If the task is too similar to existing tasks but could be made novel by changing the domain, the problem structure, or by adding constraints that require generalization. For example, changing the context to something obscure or requiring a different reasoning path.
     - **Judgment call?** Yes. Requires knowledge of the training data and what the model has already been exposed to. This step might require consulting with the data team.

  **Step 2: Does the task require transfer of learning?**
     - **What it asks:** Does the task require the model to apply knowledge or skills learned in one context to a new, unfamiliar context? (This is inspired by the idea that intelligence is about efficient learning and transfer.)
     - **Sufficient answer:** The task is set in a context that is unlikely to have been seen in training, and the model must use underlying principles (e.g., logical rules, programming concepts) to solve it, not just recall.
     - **Reject if:** The task can be solved by direct application of memorized patterns or solutions (e.g., a debugging task on a well-known tutorial). Also reject if the task is so narrow that it only tests a single, specific skill without requiring the model to connect it to other knowledge.
     - **Send back for fix:** If the task is too tied to a specific context (like a particular project or puzzle type), suggest making it more abstract or using a novel context (e.g., a made-up programming language with unique syntax that is not in any tutorial).
     - **Judgment call?** Yes. Requires estimating how likely it is that the model has seen the exact context.

  **Step 3: Does the task measure efficiency of learning? (Optional but recommended)**
     - **What it asks:** Can the task be used to measure how quickly or with how few examples the model can learn a new skill? (This is inspired by the ARC benchmark and the idea that intelligence is about sample efficiency.)
     - **Note:** This step is optional because not every task in a suite must measure efficiency. But if the task does, it's a strong indicator of measuring intelligence.
     - **Sufficient answer:** The task includes a learning curve component, e.g., providing a few examples and then testing on novel instances. The task should not be solvable without the provided examples (or with very few examples).
     - **Reject if:** The task does not require learning during the task and can be solved by the model without any new information (i.e., it's purely recall-based). If the task is intended to measure efficiency but fails to do so, reject.
     - **Send back for fix:** If the task can be restructured to include a learning phase and then a testing phase with novel instances. For example, instead of testing on a fixed set, provide a few examples and then test on new problems.
     - **Judgment call?** Partly. It's a design choice, so if the task isn't designed for efficiency, it might still pass if it does well on other steps.

  **Step 4: Does the task require understanding, not just pattern matching?**
     - **What it asks:** Does the task require the model to exhibit understanding of underlying concepts, such that it can handle variations or explain the reasoning? (This addresses the philosophy of mind concern about behavioral tests.)
     - **Sufficient answer:** The task is designed so that the solution requires multiple steps of reasoning, and the model must demonstrate a grasp of the underlying principles (e.g., by generating intermediate steps, or by being robust to small changes in the input that don't change the underlying problem).
     - **Reject if:** The task can be solved by matching patterns without understanding (e.g., a logic grid puzzle that has been seen many times in training). Also reject if the task is so simple that it only requires recall.
     - **Send back for fix:** Add requirements for explanations, intermediate steps, or create variations that test robustness. For example, instead of just outputting the answer, require the model to output a reasoning chain.
     - **Judgment call?** Yes. It's hard to be sure from behavior, but we can design the task to force understanding.

  **Step 5: Does the task correlate with other intelligence measures?**
     - **What it asks:** If we run the task on multiple models (of varying sizes and capabilities), do the results correlate with other tasks in our suite that we believe measure intelligence? (This is inspired by the g-factor in psychology, which is the general intelligence factor.)
     - **Note:** This step might require data from multiple models. If you don't have that data yet, skip and revisit later.
     - **Sufficient answer:** The task shows a strong positive correlation with other tasks in the suite that are considered good measures (e.g., larger models do better, and the task is not an outlier). If the task is new and no data exists, this step can be deferred until after a pilot.
     - **Reject if:** The task's performance does not correlate with the rest of the suite (e.g., a small model does as well as a large one, or the task is an outlier in difficulty). Also reject if it correlates negatively (unless there's a good reason).
     - **Send back for fix:** If the task is too easy or too hard, adjust the difficulty. If it doesn't correlate, it might be measuring something else, so consider redesigning to target a core cognitive skill.
     - **Judgment call?** Partly. Requires statistical analysis and a baseline of what tasks are considered good measures. Also requires human judgment on what constitutes a "good" correlation.

  **Step 6: Human Value Alignment**
     - **What it asks:** Does this task measure a capability that we (the company) value for our product? This step is about the product goals, not about intelligence per se.
     - **Sufficient answer:** The task measures a skill that is important for real-world applications of the model (e.g., coding, reasoning, problem-solving) and aligns with the product roadmap.
     - **Reject if:** The task measures a skill that is irrelevant to the product (e.g., solving a very esoteric puzzle that has no practical application) or if it's against the company's values (e.g., deceptive tasks).
     - **Send back for fix:** If the task is not aligned, it might be reframed to target a valuable skill. For example, a logic puzzle might be reframed as a real-world scheduling problem.
     - **Judgment call?** This step is entirely a human decision. It requires input from the product team and leadership.

  **Summary of the Procedure:**
  - Steps 1, 2, 3, 4 are about the task design and its ability to measure intelligence (as opposed to trained knowledge).
  - Step 5 is about empirical validation (requires data).
  - Step 6 is about product fit (human decision).

  **Running the procedure on the three proposals:**

  **Proposal 1: 200 variations of the same kind of logic-grid puzzle.**
     - Step 1: Novel? Probably not. Logic puzzles are common in training data. The variations might be new, but if the puzzle type is the same, it's likely the model has seen similar ones. **Verdict: Reject.**
     - (If we continue: Step 2: Transfer? Unlikely. It's the same puzzle type. Step 4: Understanding? Pattern matching might suffice. Step 5: Might correlate if it's a reasoning task, but without novelty, it's not adding new information.)

  **Proposal 2: Debugging task on a lightly renamed popular tutorial project.**
     - Step 1: Novel? No, because it's a renamed tutorial. The model has likely memorized the solution. **Verdict: Reject.**
     - (If we continue: Step 2: Transfer? Not required because it's the same project. Step 4: Might require understanding if the bug is new, but the context is memorized.)

  **Proposal 3: Write a program in a made-up programming language given a spec and three worked examples.**
     - Step 1: Novel? Yes. The made-up language is unlikely to be in the training data. The specific examples are new.
     - Step 2: Transfer? Yes. The model must transfer knowledge of programming concepts to a new language.
     - Step 3: Efficiency? It includes three examples, so it can measure how quickly the model learns the new language. This step passes.
     - Step 4: Understanding? The model must understand the spec and examples to write a correct program. It requires reasoning about the semantics. Pass.
     - Step 5: Correlation? We don't have data yet, but we can defer until after a pilot. For now, we assume it will correlate because it requires reasoning and transfer.
     - Step 6: Human Value Alignment? Yes, because programming is a valuable skill and this tests the ability to learn new languages, which is useful.
     - **Verdict: Accept.** (But note: Step 5 requires future validation.)

  **What the procedure cannot do:**
  - **Systematic errors:** The procedure might reject tasks that actually do measure intelligence but are too similar to training data (false negatives) or accept tasks that seem novel but the model can solve by clever pattern matching (false positives).
  - **What it can never certify:** It cannot prove that a task measures intelligence. Intelligence is a theoretical construct, and we only have behavioral measures. Also, it cannot account for future models that might solve the task without understanding (e.g., by memorizing the entire space of similar tasks).
  - **Why a suite passing every step could still be bad:** 
     - **Narrow focus:** The suite might cover only one type of intelligence (e.g., logical-mathematical) and miss others (e.g., social, spatial).
     - **Overfitting:** The models might overfit to the specific task formats in the suite without generalizing to real-world problems.
     - **Gameability:** Models might be optimized for the suite without gaining real intelligence.
     - **Lack of diversity:** If all tasks are from one domain (e.g., programming), the suite might not measure general intelligence.

  **Final Note:** This procedure is a pragmatic tool to filter tasks, but it is not a substitute for a comprehensive evaluation framework. Regular review and updates to the procedure are recommended as the field evolves.
answer: |-
  ### Decision Procedure: "Does this task measure intelligence?"  
  A 6-step checklist based on psychometric theory (Spearman's *g*, CHC model), efficiency arguments (Chollet's ARC benchmark), and Legg & Hutter's universal intelligence definition. **Core principle**: Intelligence measures should capture *efficient generalization to novel problems*, not just recall or narrow skill application.  

  ---

  #### **Step 1: Novelty Check**  
  **Question**: Is the task's *core problem-solving demand* genuinely novel relative to known training data?  
  **Why**: Tests if the task requires *new* reasoning, not recall (per Chollet's "prior-free" requirement).  
  **Sufficient answer**: The task uses unique combinations of concepts, domains, or constraints not found in common datasets (e.g., not a renamed Stack Overflow snippet).  
  - ✅ **Pass**: Task uses synthetic domains (e.g., made-up languages), randomized primitives, or culturally obscure contexts.  
  - 🔧 **Fix**: Modify context/constraints to avoid overlap with training data (e.g., replace "popular tutorial" with obscure libraries).  
  - ❌ **Reject**: Overlaps with high-frequency training data (e.g., debugging a famous GitHub repo).  
  **Judgment call?** Yes. Requires estimating training data exposure (ask your data team).  

  #### **Step 2: Transfer Depth**  
  **Question**: Does solving the task require *transferring abstract rules* (e.g., logic, syntax) to a *new structure*?  
  **Why**: Measures *fluid intelligence* (Cattell-Horn) — applying core principles to unfamiliar setups.  
  **Sufficient answer**: Task demands rule abstraction from examples (e.g., inferring grammar from samples) *and* application to a novel configuration.  
  - ✅ **Pass**: Rules must be extracted (e.g., "derive physics laws from word problems").  
  - 🔧 **Fix**: Add layers requiring rule recombination (e.g., "use the logic from Puzzle A to solve Puzzle B with inverted rules").  
  - ❌ **Reject**: Solvable by direct pattern match (e.g., grid puzzles with identical logic to training examples).  
  **Judgment call?** Partly. Watch for superficial changes (e.g., swapping "cats/dogs" in grids).  

  #### **Step 3: Efficiency Sensitivity**  
  **Question**: Does the task *penalize inefficient learning* (i.e., do smaller/few-shot models fail without priors)?  
  **Why**: True intelligence minimizes data/compute for new skills (ARC benchmark standard).  
  **Sufficient answer**: Task has high sample efficiency — solvable only if models *generalize principles* (not memorize).  
  - ✅ **Pass**: Small models fail (<40% accuracy) without explicit priors; scaling improves performance.  
  - 🔧 **Fix**: Reduce examples/allow recursion to force zero-shot generalization.  
  - ❌ **Reject**: Small models perform well (>60%) or solutions rely on memorized templates.  
  **Judgment call?** No. Use your existing model runs for objective thresholds.  

  #### **Step 4: Anti-Pattern-Robustness**  
  **Question**: Can the task be solved by *maladaptive shortcuts* (e.g., token frequency guessing) without understanding?  
  **Why**: Filters "Clever Hans" behaviors (e.g., GPT-3 solving math via keyword matching).  
  **Sufficient answer**: Adversarial perturbations (e.g., changing variable names) don’t break performance if understanding exists.  
  - ✅ **Pass**: Fails when critical reasoning steps are corrupted (e.g., adding contradictory instructions).  
  - 🔧 **Fix**: Add distractors/red herrings or require step-by-step justification.  
  - ❌ **Reject**: Trivial to solve via surface cues (e.g., regex on outputs).  
  **Judgment call?** Yes. Requires probing for brittle solutions.  

  #### **Step 5: g-Loading Check**  
  **Question**: Does task performance *correlate with broader capabilities*? (i.e., is it a *g*-loaded test?)  
  **Why**: Psychometrics shows intelligence tasks should intercorrelate (Spearman’s *g*).  
  **Sufficient answer**: Strong rank correlation (>0.7) with your suite’s aggregate score across model sizes.  
  - ✅ **Pass**: High correlation in pilot data (run on 3+ models).  
  - 🔧 **Fix**: Rebalance difficulty or align with known *g*-loaded tasks (e.g., Raven’s Matrices).  
  - ❌ **Reject**: Uncoupled from suite performance (e.g., easy for small models, hard for large).  
  **Judgment call?** No. Use Pearson correlation on existing evals.  

  #### **Step 6: Value Alignment Gate (HUMAN DECISION)**  
  **Question**: Does this task reflect a *capability we value* (e.g., coding, creative problem-solving)?  
  **Why**: Philosophical — intelligence is multidimensional; we must choose what matters.  
  **Sufficient answer**: Aligns with product goals (e.g., "helps users debug code" vs. "solves abstract puzzles").  
  - ✅ **Pass**: PM/leadership confirms strategic value.  
  - 🔧 **Fix**: Reframe task to target a valued skill (e.g., turn puzzles into API design).  
  - ❌ **Reject**: Measures irrelevant skills (e.g., chess memorization for a chatbot).  
  **Handoff point**: This step is 100% about human priorities.  

  ---

  ### **Apply to Proposals**  
  **Proposal 1: 200 logic-grid puzzles**  
  - Step 1: ❌ **Reject**. Grid puzzles are abundant in training data (e.g., PuzzleDataset).  
  - *Stop here*. **Fix impossible** — core logic is non-novel.  

  **Proposal 2: Debugging a renamed tutorial repo**  
  - Step 1: ❌ **Reject**. "Lightly renamed" popular tutorial = memorizable.  
  - *Stop here*. **Fix**: Replace with an obscure, procedurally generated repo.  

  **Proposal 3: Made-up programming language (your baby)**  
  - Step 1: ✅ Pass. Novel language spec avoids recall.  
  - Step 2: ✅ Pass. Requires transferring concepts (e.g., loops) to new syntax.  
  - Step 3: ⚠️ **Conditional pass**. If small models fail (<40%), it passes. If not, add fewer examples.  
  - Step 4: 🔧 **Fix needed**. Test if models output correct code without understanding (e.g., permuting example tokens). Add: "Introduce a syntax trap (e.g., misleading indentation) and require error explanation."  
  - Step 5: ✅ Pass (if correlated). If uncorrelated, reweight difficulty.  
  - Step 6: ✅ Pass (if leadership values code generalization).  
  **Verdict**: Fix Step 4 (add robustness checks) → **Accept**.  

  ---

  ### **Limitations of the Procedure**  
  1. **Systematic blind spots**:  
     - Misses **social/multi-agent intelligence** (e.g., theory of mind tasks).  
     - Biased toward **crystallized knowledge** if novelty isn’t enforced (Step 1).  
  2. **Uncertifiable claims**:  
     - Can’t prove a system *understands* (Chinese Room problem) — only tests behavior.  
     - Can’t guard against **task contamination** if training data leaks post-deployment.  
  3. **False confidence risks**:  
     - A "perfect" suite can still be **gameable** (e.g., overfit to your task family).  
     - Fails if tasks **correlate for wrong reasons** (e.g., all require Python parsing).  
  4. **Philosophical gaps**:  
     - Doesn’t resolve "general vs. specific" — assumes *g* exists (Step 5).  
     - Ignores **embodied cognition** (irrelevant for LLMs).  

  **Final advice**: Run this as a filter, then aggregate diverse tasks (e.g., 10% coding, 20% math) to approximate *g*. Your PM gets a checklist; you get rigor.
