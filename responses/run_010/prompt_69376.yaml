  ---

  ### 5. **Strawsonian Assessment**  
  Strawson’s framework explains this well. Reactive attitudes (like resentment) respond to perceived *quality of will*, not isolated acts. When an excuse negates ill will in one act, resentment relocates to preserve the broader demand for goodwill—e.g., shifting from "they betrayed me" to "they’re consistently indifferent." This reflects the participant attitude’s focus on the agent’s moral character. However, Strawson doesn’t predict the *retroactive recruitment* of unnoticed grievances; this is a psychological extension of his model.  

