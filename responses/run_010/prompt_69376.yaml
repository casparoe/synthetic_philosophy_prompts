  We are given a phenomenon that has the following characteristics:

  1. A person experiences resentment toward someone for a specific action (Action A).
  2. An excuse or justification for Action A is provided and accepted as valid (so the resentment for Action A should dissipate).
  3. Instead, the resentment does not disappear but *relocates* to a different, adjacent grievance (Action B) that:
     a) Was not previously resented (or even noticed) by the person.
     b) Is real (i.e., Action B actually occurred and is a legitimate target of resentment in isolation).
  4. The resentment feels continuous (same intensity, same emotional quality) and is now directed at Action B, and the person endorses this resentment.
  5. The function seems to be to avoid admitting that the initial resentment was unfair.

  The user has also specified what the phenomenon is NOT:

  - Not recalcitrant emotions (where the emotion persists toward the same object despite judgment that it is unwarranted).
  - Not displacement (where aggression moves to a safer target because the original is unavailable).
  - Not ordinary resentment of a pattern that was already resented or noticed.
  - Not self-deception generally (though the mechanism might involve some self-deception, the relocation feels honest).

  We are to find if there is an established concept, and if not, coin a term and define it.

  ## Step 1: Search for Nearest Concepts

  Let's consider the literature:

  ### Reactive Attitudes (Strawson)
  Strawson's reactive attitudes (like resentment) are responses to the quality of will shown by others. They are not just about individual acts but about the attitudes they express. However, Strawson does not explicitly discuss the phenomenon of resentment relocating to a different object once an excuse is accepted.

  ### Moral Psychology and Emotion

  - **Emotional Transfer/Reappraisal**: Sometimes emotions can be transferred to a different object, but typically this is when the original object is no longer available or when the emotion is reappraised. However, the reappraisal here is not of the emotion but of the justification for the emotion, and then the emotion finds a new justification without reappraisal of the emotion itself.

  - **Motivated Reasoning**: This is a cognitive bias where we process information to support a pre-existing belief or emotion. In this case, the resentment is pre-existing and seeks a new justification.

  - **Cognitive Dissonance**: The theory that we seek to reduce psychological discomfort when our beliefs and actions are inconsistent. Here, the dissonance would be between (a) having felt resentment and (b) now knowing that the resentment was unwarranted. To avoid admitting the initial resentment was unfair (which might cause dissonance), the resentment relocates to a new object.

  - **Scapegoating**: This is a form of displacement where blame is shifted to an innocent party. But in this case, the target remains the same person, and the new grievance is real and about that same person.

  - **Self-Deception**: The person might be deceiving themselves about the cause of their resentment. However, the user notes that the relocation feels honest.

  - **Emotional Persistence/Inertia**: Emotions can sometimes persist beyond their initial cause, but usually without changing object.

  - **Resentment of Character**: If we shift from resenting an act to resenting a character trait, that might be adjacent. But in the examples, the new object is another act (or pattern of acts) that is adjacent.

  None of these exactly capture the phenomenon.

  ### Specific Concepts:

  - **Affective Displacement**: This is typically about redirecting emotion to a safer target. But the target is not changed (same person) and the original target is still available.

  - **Excuse-Triggered Resentment Relocation**: Not a term.

  - **Moral Dissonance Reduction**: Not a standard term.

  ## Step 2: Best Fit

  After review, it seems there is no established term that precisely captures this phenomenon. The closest concepts are:

  1. **Motivated Reasoning**: The resentment motivates the search for a new justification. But motivated reasoning is a broad concept and does not specifically address the relocation of emotion with the same intensity and continuity.

  2. **Cognitive Dissonance Reduction**: The relocation serves to reduce dissonance (by avoiding the admission of having been unfair). But dissonance reduction usually involves changing beliefs or attitudes, not relocating an emotion to a new object.

  3. **Emotional Reappraisal with Bias**: Reappraisal is typically about changing the emotion by reinterpreting the situation. Here, the emotion does not change but finds a new interpretation.

  Best fit: **None** (with low confidence because while there are adjacent concepts, none capture the exact phenomenon).

  ## Step 3: Coin a Term

  We'll coin a term: **Resentment Transference**

  Definition:
  > The psychological phenomenon in which resentment, initially felt toward a specific action (A) of an individual, persists and relocates to a different, adjacent action (B) of the same individual upon learning that action A was excusable, where (1) action B was not previously a subject of resentment and may not have been noticed, (2) the resentment toward action B is endorsed as legitimate, (3) the emotional experience feels continuous (same intensity and quality) as the original resentment, and (4) the relocation serves to avoid admitting that the initial resentment toward action A was unwarranted.

  Necessary conditions:
  1. The initial resentment is directed at a specific action (A).
  2. A valid excuse for A is provided and accepted.
  3. The resentment does not dissipate but relocates to a different, adjacent action (B) of the same person.
  4. Action B was not previously resented (or even noticed) by the person.
  5. The resentment toward B is felt to be continuous with the original resentment and is fully endorsed.
  6. The relocation avoids the need to admit that the initial resentment was unfair.

  How it differs from the best fit (motivated reasoning or dissonance reduction): 
  - Motivated reasoning is a broad process that can apply to many cognitive tasks; this is a specific emotional relocation phenomenon.
  - Dissonance reduction typically involves changing beliefs or attitudes; here, the emotion is preserved and moved.

  ## Step 4: Boundary Cases

  We need to distinguish this from:
  a) Legitimate resentment of a pattern you'd genuinely missed.
  b) Scapegoating.
  c) Plain self-deception.

  Boundary cases:

  1. **Scenario**: You feel resentment about a colleague not backing you up. Then you accept the excuse (their mother was ill). Later, you recall that the same colleague did a similar thing in March, and you had been annoyed at the time but had forgotten until now. Now you feel resentment about the March incident and the recent incident together.  
     **Verdict**: Out (this is ordinary moral memory).  
     **Test**: Was the March incident already resented at the time? If yes, then it's not resentment transference.

  2. **Scenario**: After accepting the excuse for the colleague's behavior, you become resentful of a different colleague (who had nothing to do with the incident) for an unrelated reason.  
     **Verdict**: Out (this is displacement/scapegoating).  
     **Test**: Is the new target the same person? If not, it's displacement.

  3. **Scenario**: You accept the excuse for the colleague's behavior, and then you start to feel resentment about the March incident. However, you had not resented it at the time and had not even thought about it until now. But upon reflection, you realize that the March incident was actually part of a pattern of behavior that you had been subconsciously noticing and that now makes sense.  
     **Verdict**: Borderline. It might be a legitimate pattern that was missed, but if the resentment is experienced as the same continuous feeling and the pattern was not previously noticed, it might be transference.  
     **Test**: Was the pattern genuinely present and is the resentment a new, independent response? Or is the resentment feeling like it has been transferred? Also, was the pattern previously unnoticed and unresented? If the resentment feels continuous and the pattern was not previously a source of resentment, then it might be transference. But if it's a fresh resentment based on a new realization, then it's legitimate.

  4. **Scenario**: After accepting the excuse, you remain resentful and then consciously think, "Well, they never apologized, and that's what I'm really angry about." And you realize that the lack of apology is a new issue and you feel a fresh wave of resentment about that.  
     **Verdict**: Out (this is a fresh resentment).  
     **Test**: Does the resentment feel like the same continuous resentment? Or is it a new emotion? In transference, it feels continuous.

  ## Step 5: Strawsonian Assessment

  Strawson's participant attitude involves holding others to account based on the quality of their will. The initial resentment is a response to a perceived lack of good will. When an excuse is accepted, it shows that the lack of good will was not present (because of the excuse). The relocation of resentment to a different action might reflect a deeper, persistent suspicion about the person's overall lack of good will. The phenomenon might be explained by the participant attitude being fundamentally about the agent's character rather than individual acts. Thus, once the excuse is accepted for one act, the reactive attitude shifts to another act to maintain the overall negative evaluation of the agent's will. This suggests that the participant attitude, as a demand for good will, can lead to this kind of relocation when one piece of evidence is discredited.

  ## Step 6: Falsifiable Marker

  A falsifiable marker would be:
  > In an experimental setting, after subjects are induced to feel resentment about Action A and then presented with a valid excuse for Action A, they (a) report the same level of resentment but now directed at Action B (a real but previously unnoticed or unresented action of the same person) and (b) report that the resentment feels continuous and not like a new emotion. This can be measured by self-report and by physiological measures of emotion (like skin conductance) that show the emotion persists without a break.

  ## JSON Structure

