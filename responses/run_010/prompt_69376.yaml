    *Why it falls short*: Explains the *search* for new justifications but not the seamless emotional transfer or the continuity of the resentment's "weight and heat."  
  - **Cognitive Dissonance Reduction** (Psychology):  
    *What it covers*: Avoiding discomfort from conflicting beliefs (e.g., "I was unfair" vs. "I’m justified").  
    *Why it falls short*: Focuses on belief adjustment (e.g., downplaying the excuse), not emotional relocation to a new object.  
  - **Affective Displacement** (Psychoanalysis):  
    *What it covers*: Redirecting emotion to a safer target (e.g., kicking the dog).  
    *Why it falls short*: Requires shifting to a *different* target/person; here, the target stays the same, only the justification changes.  
  - **Moral Licensing** (Moral Psychology):  
    *What it covers*: Using past good acts to justify current bad ones.  
    *Why it falls short*: Inverse of your case—here, resentment uses a *new* "bad act" to justify *prior* emotion.  

