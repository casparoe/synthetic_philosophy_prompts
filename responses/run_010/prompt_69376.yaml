  To distinguish this from ordinary resentment:  
  > **Look for cases where the new grievance was *documented as unimportant or unnoticed* by the subject prior to the excuse (e.g., journals, witness accounts), but post-excuse, is cited as the "real" source with unchanged emotional intensity. Physiological measures (e.g., galvanic skin response) could confirm identical arousal levels pre/post-relocation.**  

