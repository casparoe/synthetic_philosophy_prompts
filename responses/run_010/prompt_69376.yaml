    2. Resentment persists with identical intensity/quality.  
    3. Relocation targets a *real* but previously unfelt grievance involving the *same* person.  
    4. The new grievance is endorsed as the "true" cause.  
    5. Avoids cognitive dissonance from admitting prior unfairness.  
  - **How It Differs**: Unlike motivated reasoning (which is cognitive) or displacement (which changes targets), this involves *emotional inertia* grafting onto a backup justification.  

  ---

  ### 4. **Boundary Cases**  
  Clarifies where the phenomenon begins/ends:  
  - **Scenario**: A colleague’s excuse invalidates your initial resentment; you then recall a *previously resented* March incident and feel renewed anger.  
    - **Verdict**: Out.  
