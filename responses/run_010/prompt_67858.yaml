prompt: |-
  My flatmate's got a dissertation chapter that's supposed to kill off imprecise credences and I can't find where it breaks. Roughly, in his numbering:

  (1) Your credal state is a set of probability functions, and your credence in p is imprecise just in case the values {P(p): P in the set} have non-zero width.

  (2) Learning is narrowing. You learn from evidence E only if, after conditionalising the whole set on E, the width of your set for the hypothesis you care about is strictly smaller than it was before. He calls this the Narrowing Criterion and thinks it's just what "learning" amounts to, not a substantive claim.

  (3) If your prior set is the totally vacuous one — every probability function on the algebra — then for any finite E, the conditionalised set still has width 1 for anything E doesnt entail.

  (4) So an agent with a vacuous prior never learns anything about the next toss, the next raven, the next anything, however much data piles up.

  (5) And vacuity is the imprecise Bayesian's own default rather than a strawman, because of what he calls the Fidelity Principle: your credal width has to match the specificity of your evidence, so evidence that's silent about a coin's bias obliges you to sit at width 1 about the next toss.

  (6) Hence the imprecise Bayesian is committed to agents for whom evidence makes literally no difference.

  (7) A theory on which more evidence never changes your state isn't a theory of learning, it's a refusal to have one.

  (8) So imprecise credences are never rationally required, and precision wins by default.

  He thinks (5) is the load-bearing one and says he'll happily defend it. I want to keep (1) — I think the set-of-priors picture is right, and it's what makes things like dilation and credal inertia worth worrying about in the first place — and I'd also like to keep (7), since I agree that a learning theory that never learns is worthless.

  So: which step actually fails, and why did it look fine going in? Then the concrete case, because I want it dealt with rather than waved at — after a thousand heads in a row, is my width for the next head still 1? If yes, why isnt that fatal? And does the whole argument run again, unchanged, against a precise Bayesian whose prior just happens to be extremely confident — say someone who starts at P(heads) = 0.999 and then sees a thousand tails? If it does, spell the parallel out properly, because then I suspect the argument proves something about priors as such rather than about imprecision, and he's got the wrong target. If it doesn't run, tell me exactly what the difference is.

  One more thing, and be blunt about it: if I do give up (5), what's supposed to replace it? Is there any principled account of how wide a credal set should be given some particular body of evidence, or is width a free parameter the imprecise Bayesian just gets to pick, subject to coherence and nothing else? If it's free, say so — I'd rather find out now that (7) is going to come back and bite me too.

  British English throughout, please.
reasoning: |-
  Okay, let me tackle this step by step. The user's flatmate has an argument against imprecise credences that seems solid, and I need to find where it breaks. The core steps are laid out from (1) to (8). 

  First, I need to understand each step. Step (1) defines imprecise credences as sets of probability functions with non-zero width. Step (2) says learning requires narrowing this width after updating on evidence. Step (3) claims a vacuous prior (all possible probabilities) can't narrow even with finite evidence. Step (4) concludes such agents never learn. Step (5) argues vacuity is the imprecise Bayesian's default due to the Fidelity Principle—evidence silence forces width 1. Step (6) says this commits them to evidence being irrelevant. Step (7) calls this a refusal to have a learning theory. Step (8) rejects imprecise credences as irrational.

  The user wants to keep (1) and (7) but challenge the rest. They also want a concrete example: after 1000 heads, is credal width still 1? And if so, why isn't that fatal? Plus, they ask if the same argument applies to a precise Bayesian with a stubborn prior (e.g., P(heads)=0.999 seeing 1000 tails), and if not, why.

  Hmm. The key pressure point is step (5), the Fidelity Principle. The flatmate thinks evidence silence forces max imprecision (width 1). But why must that be? Imprecise Bayesians don't universally accept this. Some, like Levi or Joyce, allow more constrained sets based on indifference principles or other rules. For example, with a coin, lack of evidence might lead to a set like {P: 0.4 ≤ P(heads) ≤ 0.6}, not the whole [0,1]. The Fidelity Principle isn't mandatory—it's one view, not consensus.

  Also, step (3) assumes conditionalizing a vacuous prior on finite E leaves width 1. But if the prior isn't vacuous—say, restricted by symmetry—then updating could narrow the set. The argument conflates vacuity with all imprecise models. Most imprecise Bayesians don't start totally vacuous; they use sets reflecting partial information.

  For the concrete case: after 1000 heads, if the prior was vacuous, width remains 1. But if the prior incorporated learning (e.g., through updating rules), width could shrink. The fatal part only holds if we accept Fidelity, which isn't necessary. 

  Comparing to the precise case: a precise Bayesian with P(heads)=0.999 seeing 1000 tails would drastically lower P(heads) if they update properly. Their posterior isn't stuck; it shifts with evidence. The difference is that imprecise models *can* get stuck under vacuity, but precise ones don't start with such extreme rigidity. The argument targets vacuity, not imprecision generally.

  If the user gives up (5), they need an alternative. There are principled approaches: Jeffrey conditioning, info-gap models, or minimax rules. Width isn't arbitrary; it can be tied to evidence quality, risk aversion, or ambiguity. For example, with vague evidence, width reflects uncertainty; with precise data, it narrows. The key is that width isn't free—it's constrained by rationality principles beyond coherence, like calibration or avoidance of sure loss.

  So the breakdown is step (5). Fidelity is too strict, and rejecting it saves imprecise credences. The concrete case isn't fatal because real agents don't use vacuous priors. And the precise case isn't parallel because stubborn priors are updatable, unlike vacuous ones. The user keeps (1) and (7) by adopting sensible width rules.
answer: |-
  Right, let's dissect this properly. Your flatmate's argument is clever but hinges entirely on step (5) – the **Fidelity Principle** – which *isn't* a core commitment of imprecise Bayesianism. It's an *interpretative choice*, and a contentious one at that. Rejecting (5) dismantles the argument while preserving (1) and (7). Here's the breakdown:

  **Where the Argument Fails: Step (5) is the Weak Link**

  1.  **The Claim:** "evidence that's silent about a coin's bias obliges you to sit at width 1." (Fidelity Principle).
  2.  **Why it's Not Mandatory:** Imprecise Bayesians aren't forced into total vacuity by silence. The core idea is that your credal set should reflect your *evidence* or *lack thereof*, but 'reflecting' silence doesn't *logically necessitate* width 1. It could justify a *range* narrower than [0,1]. For example:
      *   **Principles of Indifference/Insufficient Reason (Variants):** Faced with complete ignorance about a binary outcome, one *could* adopt the set {P: P(Heads) = 0.5}. But more commonly, imprecise Bayesians argue that true ignorance warrants *no* specific commitment, leading to a range. Crucially, **this range doesn't have to be [0,1]**.
      *   **Representing Ambiguity:** The width represents *how unsure* you are, given your evidence. Silence *might* warrant significant width (e.g., [0.3, 0.7]), but claiming it *must* be [0,1] is an extreme interpretation. Evidence silence about bias *could* be interpreted as "any bias is possible, but extreme biases might be *less plausible* a priori," leading to a prior set like {P: 0.1 ≤ P(Heads) ≤ 0.9}, not [0,1].
      *   **Avoiding Absurdity:** Most proponents recognize that starting completely vacuous leads to the learning paralysis described in (4). Since they want a functional learning theory (agreeing with your point about (7)), they *reject* total vacuity as the default for non-logical propositions. Total vacuity is often seen as a theoretical limit case, not a practical starting point.
      *   **The "Default" Straw Man:** While some arguments *for* imprecision appeal to ignorance, the *default prior* in practice isn't vacuous. It's usually constrained by background knowledge, symmetry considerations (where applicable), or minimal rationality constraints. The Fidelity Principle, as stated, elevates a specific (and arguably self-defeating) response to silence to the status of dogma. It's not inherent to the set-of-priors framework.

  **Why it Looked Fine Going In:** Step (5) leverages an intuitive appeal: "If you know *nothing*, how can you rule *anything* out?" This feels compelling. It also creates a neat link between "silence" and "maximum width," making the learning paralysis in (4) seem inevitable for the imprecise approach. The flaw is equating "ruling nothing out" *epistemically* (no evidence against any bias) with requiring a credal state that treats *every possible function as equally eligible*. The imprecise Bayesian can say: "My evidence rules nothing out *conclusively*, but it doesn't force me to treat the coin being rigged to *always* land heads as equally plausible to it being fair *given my total state of ignorance*." They can adopt a prior set that excludes extreme functions or reflects a default, weaker symmetry.

  **The Concrete Case: 1000 Heads in a Row**

  1.  **With Vacuous Prior (Accepting Fidelity):** Yes, conditionalising the set of *all* probability functions on 1000 heads still yields a set where P(Next Head) can be any value in (0,1). Functions exist that assign very high probability to heads but also very high probability to the *sequence* 1000 heads even if P(Head) is lower (just very unlikely!). So width remains 1. **This *is* fatal to the vacuous prior.** It demonstrates why the Fidelity Principle leads to an unusable theory.
  2.  **Without Vacuous Prior (Rejecting Fidelity):** This is the key. An imprecise Bayesian *doesn't start vacuous*. Suppose their initial prior set for P(H) was something like {P: 0.3 ≤ P(H) ≤ 0.7} (representing ignorance but excluding extremes). Conditionalising this set on 1000 heads:
      *   Functions within the set that assigned low P(H) will assign extremely low probability to the evidence (1000 heads).
      *   Applying conditionalisation *and* a rule for updating sets (like regularised maximum likelihood, or focusing on the "undominated" posteriors), the posterior set for P(H) will shift dramatically upwards and likely *narrow*. For example, it might become {P: 0.95 ≤ P(H) ≤ 0.999}. The width for "Next Head" shrinks significantly – learning *has* occurred.
  3.  **Why Isn't Width=1 Fatal Here?** Because the agent *didn't* start width=1! They started with a narrower prior set reflecting a non-extreme interpretation of initial ignorance. The evidence *did* cause significant narrowing. The fatal outcome *only* arises if you shackle imprecise Bayesianism to the Fidelity Principle.

  **The Precise Bayesian Parallel (and Why it Fails)**

  Consider your precise Bayesian: Prior P(Head) = 0.999. Observes 1000 tails.

  1.  **What Happens:** Assuming a reasonable likelihood (e.g., coin flips i.i.d.), the posterior probability P(Head | 1000 Tails) will be *vanishingly small*. It converges towards 0 extremely rapidly. Their state changes *dramatically*.
  2.  **Why the Argument Doesn't Run:** The learning paralysis in step (4) is absolute: *no* finite evidence changes the credal width (it stays at 1). For the stubborn precise Bayesian:
      *   **Finite Evidence *Does* Change Their State:** Even after 1 tail, P(Head) drops (e.g., to ~0.998). After 1000 tails, it's miniscule. The *amount* of change depends on the prior's confidence, but change *always occurs*.
      *   **The Prior is Updatable:** The core of precise Bayesianism is that *all* priors (except dogmatic 0 or 1) are updatable by evidence via conditionalisation. The prior P=0.999 is extreme and will be *swamped* by sufficient counter-evidence. The prior itself isn't "evidence-proof"; it just starts very confident.
      *   **The Difference:** The vacuous prior under Fidelity is *literally immune to learning* about non-entailed hypotheses. The stubborn precise prior is *extremely resistant* initially, but is *overwhelmed* by sufficient evidence. The first violates (7) fundamentally (no learning possible). The second satisfies (7) but shows slow learning due to prior strength. Your suspicion is correct: the argument primarily targets *vacuous priors under Fidelity*, not imprecision per se, and certainly not all priors.

  **Giving Up (5): What Replaces the Fidelity Principle? (Be Blunt)**

  You're right to worry about arbitrariness. Rejecting Fidelity doesn't magically solve the "how wide?" problem. There is **no single, universally agreed-upon, fully principled algorithm** for setting initial credal width based on evidence specificity. It's an **active research problem and a major challenge** for imprecise probabilism. However, it's **not simply a free parameter subject only to coherence**. Here's the landscape:

  1.  **Constraints Beyond Coherence:**
      *   **Avoiding Sure Loss / Admissibility:** The set must be chosen so that your betting dispositions don't guarantee a loss to a cunning bookie. This rules out some pathological sets but still allows vast latitude.
      *   **Calibration / Frequency Correspondence:** Some argue width should reflect known or estimated uncertainty frequencies in similar situations (e.g., if 90% of "totally unknown" coins you've encountered turned out fairish, your width might centre on 0.5 with moderate spread). This links imprecision to (vague) knowledge about the world's uncertainty.
      *   **Minimax Regret / Robustness:** Choose the set that performs best in the worst-case scenario. Width reflects aversion to ambiguity and desire for robust decisions. Evidence silence might warrant wider sets to hedge against unknown risks.
      *   **Grouping / Indifference Principles (Cautious):** Apply indifference only within identifiable "natural" partitions *and* allow sets reflecting the ambiguity *between* partitions. E.g., "I know nothing, so I won't commit between P(H)=0.4 and P(H)=0.6 *or* between these and other values, but I can constrain the range based on minimal assumptions." This often leads to intervals or neighbourhoods, narrower than [0,1].
      *   **Inputs to the Model:** Treat the credal set as representing the ambiguity inherent in the *evidence itself* (e.g., vague statements, conflicting expert opinions, limited data quality). Width is determined by interpreting the evidence's precision. Silence might be interpreted as "high ambiguity," warranting significant width, but not necessarily 1.
      *   **Cognitive Realism / Bounded Rationality:** Width reflects the limitations of the agent's cognitive resources or the cost of acquiring more precise information. Silence warrants width because you haven't invested effort to narrow it down.

  2.  **The "Free Parameter" Charge and (7):**
      *   **It's Partly True:** Compared to precise Bayesianism (where the prior is *the* fundamental subjective input), imprecise Bayesianism has *more* subjective inputs: the *shape* and *size* of the initial set. There's unavoidable judgment involved in translating vague evidence into a specific set.
      *   **But Not Unconstrained:** As above, rationality constraints (Avoiding Sure Loss, Calibration goals, Robustness principles) and the need for the model to *actually learn* (avoiding vacuity!) provide significant guidance. You can't just pick *any* coherent set willy-nilly without violating these broader aims.
      *   **(7) Doesn't Bite if Learning Occurs:** The fatal consequence (never learning) *only* arises under the rejected Fidelity Principle. If your chosen initial width is finite (e.g., [0.4, 0.6]) and your updating rule allows narrowing (e.g., conditionalisation plus focusing on well-fitting functions), then learning *does* occur as evidence accumulates. Your theory *has* a learning mechanism. The challenge is justifying the *initial* width, not the *process* of learning. (7) targets theories that lack the *process*, not those wrestling with the *starting point*.

  **In a Nutshell:**

  1.  **Step (5) Fails:** The Fidelity Principle (silence → width=1) is not inherent to imprecise Bayesianism and is rejected by most proponents because it leads to learning paralysis. It's a strawman default.
  2.  **Concrete Case:** With a *vacuous prior under Fidelity*, width remains 1 after 1000 heads – fatal *for that specific setup*. Without Fidelity, a reasonable initial prior set (e.g., [0.3, 0.7]) will narrow significantly (e.g., to [0.95, 0.999]) – learning occurs.
  3.  **Precise Parallel Fails:** A precise prior (P=0.999) *is* updated by evidence (to near 0 after 1000 tails). It learns, albeit slowly initially. The argument only works against the *unupdatable* vacuous prior.
  4.  **Replacing (5):** There's no magic formula. Width setting involves judgment constrained by rationality (avoiding sure loss, calibration, robustness), the nature of the evidence (its perceived ambiguity), and the requirement for functional learning (rejecting vacuity). It's not *merely* a free parameter, but it *is* a significant challenge requiring more subjective input than precise priors. Crucially, rejecting Fidelity allows learning, satisfying (7).

  **Recommendation:** Challenge your flatmate directly on the Fidelity Principle. Ask them to defend *why* imprecise Bayesians *must* adopt width=1 for complete silence, beyond mere assertion. Point out that doing so makes their theory useless for learning (which they presumably want to avoid) and that alternative, narrower representations of ignorance are both coherent and allow learning. The core of their argument evaporates once (5) is seen as optional. The real debate is about the best way to model ignorance and ambiguity, not an inherent flaw in credal sets.
