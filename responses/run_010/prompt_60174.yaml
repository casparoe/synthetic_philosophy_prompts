  #### Conflict Analysis: Intrinsicality vs. Independent Modifiability
  The suspected conflict between **requiring unpleasantness to be intrinsic to the experience (D16)** and **requiring it to be independently modifiable (D13, D3, D4)** is real but resolvable. D16 demands that unpleasantness is a phenomenal property intrinsic to the experience to ground reasons and welfare "from the inside" (e.g., for neonates or animals without higher cognition). D13/D3/D4 demand that unpleasantness can dissociate from sensory character (e.g., in asymbolia or hypnosis), implying it is separable and not essential to the sensory core. 

  - **Conflict**: If unpleasantness is intrinsic to the pain experience, it cannot be absent when the experience is present—but asymbolia shows subjects reporting pain (sensory experience) without unpleasantness. This undermines D16’s intrinsicality if the "experience" includes only sensory components.
  - **Resolution**: The conflict is escaped by weakening D16’s scope. Instead of requiring intrinsicality to the *sensory experience*, reinterpret "experience" as a composite: unpleasantness is intrinsic to the *affective component*, which is separable from the sensory component (per two-factor views). This allows sensory pain (a, b) without unpleasantness (c) and satisfies D3/D4/D13. D16 is weakened to apply only to the affective dimension, not the whole pain state.
  - **Cost**: We lose the ability to claim that *all* pain experiences intrinsically contain unpleasantness as a unified property. This forces the account to treat pain as a disunified state (sensory + affective) and may complicate reason-giving: if unpleasantness is just one separable component, reasons to stop pain might not stem from pain *itself* but from this component. However, this preserves the neuroethics goal (D6, D12) by keeping unpleasantness phenomenal and reason-giving for subjects without cognition.

  This conflict is not a negative result for the project; it clarifies that intrinsicality must be component-relative. The weakened D16 still excludes views like pure evaluativism (if evaluations are extrinsic) but accommodates dissociation.

  #### Desideratum Eliminating the Most Candidates
  **D12 (grounding reasons in unpleasantness itself, not desires)** eliminates the most candidates. It requires the reason to stop pain (h) to arise directly from unpleasantness (c), without contingent desires (e). This excludes:
  - **Hall’s inclination account**: Unpleasantness *is* a desire (e), so reasons depend on desires.
  - **Desire-based views**: Reasons require existing desires, failing for neonates/asymbolia.
  - **Imperativism**: If commands generate reasons via compliance-desires, it fails D12.
  - **Evaluativism**: If evaluations depend on beliefs/desires, reasons may not be intrinsic to phenomenology.

  D12 is stringent due to neuroethics demands, but it is non-negotiable for underwriting harm in non-verbal subjects.

  ### Scorecard of Candidate Accounts
  Assesses views against desiderata. "Fails_IDs" lists decisive failures; partial fits are not noted.

  | View                                  | Fails_IDs | One-line verdict                                                                 |
  |---------------------------------------|-----------|----------------------------------------------------------------------------------|
  | Felt-quality (e.g., traditional)      | D3, D4, D10, D13 | Fails dissociation cases: pain is necessarily unpleasant, so violates asymbolia compatibility. |
  | Evaluativism (e.g., Bain, Helm)       | D5, D6, D12, D16 | Grounds badness/reasons in evaluations, failing intrinsicality and harm in non-cognitive subjects. |
  | Imperativism (e.g., Klein, Martínez)  | D4, D7, D12 | Commands may not capture aversiveness phenomenology and ground reasons without desires. |
  | Hall’s inclination account            | D9, D12   | Unpleasantness requires desire to stop, excluding masochism/neonates.            |
  | Grahek’s two-factor proposal          | None      | Best fit: separates sensory/affective components, accommodating dissociation and intrinsicality within affective component. |
  | Agency-disruption (e.g., disvalue views) | D6, D7, D14 | Fails harm in neonates (lacking agency) and aversiveness phenomenology.          |

  **Notes**: 
  - **Grahek’s two-factor proposal** satisfies all by treating sensory (b) and affective (c) as dissociable components, allowing modulation (D13) while keeping unpleasantness intrinsic to the affective dimension (D16). It handles asymbolia (D4) and underlies reasons (D12) via affective phenomenology.
  - **Felt-quality** fails critically on dissociation (D3, D4) due to necessitarianism.
  - **Agency-disruption** struggles with non-agential subjects (neonates, animals) and felt aversiveness.
