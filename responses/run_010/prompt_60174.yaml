  ### Desiderata for an Account of Pain's Unpleasantness and Badness

  The following table specifies the requirements an account must satisfy to adequately address both the philosophy-of-mind question (distinguishing unpleasant pain from intense sensation and explaining reasons to stop) and neuroethics implications (harm in cases like insular damage, neonates, and animals). Desiderata are anchored to empirical cases, with exclusions highlighting specific failures. Distinctions (a)–(h) are policed per column "Constrains," indicating which elements the requirement binds or licenses separation. Modal commitments are enforced via D10. Camp-specific items are flagged where a requirement reflects a partisan assumption rather than a neutral demand.

  | ID  | Desideratum                                                                                                | Motivator                                  | What_it_excludes                                                                                              | Status          | If_camp_specific                                                                 | Constrains       |
  |-----|------------------------------------------------------------------------------------------------------------|--------------------------------------------|---------------------------------------------------------------------------------------------------------------|-----------------|----------------------------------------------------------------------------------|------------------|
  | D1  | The account must distinguish the sensory-discriminative character of pain from its unpleasantness.         | Philosophy of mind core question           | Views that collapse (b) and (c) (e.g., identifying intensity with unpleasantness).                            | Non-negotiable  |                                                                                  | (b), (c)         |
  | D2  | The account must explain why unpleasant pain gives the subject a pro tanto reason to stop it.              | Reason-giving force of pain                | Views that fail to link (c) to (h) (e.g., separating reason-giving from phenomenology).                       | Non-negotiable  |                                                                                  | (c), (h)         |
  | D3  | The account must accommodate the dissociation between sensory-discriminative and affective components.     | Pain asymbolia, cingulotomy, hypnosis      | Views denying (b) can exist without (c) (e.g., essentialist views of pain as necessarily unpleasant).         | Non-negotiable  |                                                                                  | (b), (c)         |
  | D4  | The account must allow pain to occur without unpleasantness.                                               | Asymbolia, cingulotomy, opioid analgesia   | Views asserting (a) conceptually or metaphysically entails (c).                                               | Non-negotiable  |                                                                                  | (a), (c)         |
  | D5  | The account must not require that unpleasantness is always bad for the subject.                            | Masochism, chili-burn                      | Views asserting (c) entails (g) (e.g., hedonism about pain’s badness).                                        | Non-negotiable  | Subjectivists about well-being; assumes badness is intrinsic to unpleasantness.  | (c), (g)         |
  | D6  | The account must explain harm from pain in subjects lacking higher-order cognition.                        | Neonates, non-human animals                | Views requiring beliefs, concepts, or desires for (g) (e.g., desire-based harm accounts).                     | Non-negotiable  |                                                                                  | (g)              |
