  - **Depression trace: OVERRIDE**.  
    - Depression is an impaired state; pre-episode traces show intact preferences.  
    - *Killed by:* None—fits all six.  

  #### **Rule 3: Conflict or Corruption**  
  *"Behavior is USE unless:  
  - (OVERRIDE) There is *active conflict* (self-binding violation or explicit second-order desire).  
  - (DROP) Evidence is corrupted *externally* (information/options) *or internally* (severe impairment without conflict)."*  
  **Self-binding rider:** Self-binding defines conflict for OVERRIDE.  

  - **Exemplar consistency:**  
