  ### If You Had to Write the Rule Now  
  **Chosen Rule: Reflective Endorsement + External Corruption (Rule 1)**  
  ```  
  USE: Behavior is reflectively endorsed by the user at the time of acting (no conflict or binding override).  
  OVERRIDE: Behavior conflicts with (a) a self-binding commitment, or (b) an explicit second-order preference stated at the time.  
  DROP: External forces corrupt the option set or information (e.g., dark patterns, coercion).  
  ```  

  **What the Project Commits To:**  
  - **By choosing Rule 1 over Rule 2:** The project commits to *momentary autonomy* as the gold standard. Preferences are defined by what the user consciously endorses during the action, even in impaired states (depression, ADHD). This avoids diagnosing "intactness," which requires subjective thresholds (e.g., "How severe is ‘severe’ depression?").  
  - **Trade-off:** It risks mistaking impaired choices (e.g., addiction, depression) for true preferences, as it only overrides with explicit conflict or self-binding. Rule 2 would better capture "what the user actually wants" across time but requires annotators to judge mental states—a reliability and scalability challenge.  
  - **Why not Rule 3?** It collapses DROP into a broader "impairment without conflict" category, which R’s exemplars avoid (DROP is purely external in #3).  

  **Annotation Guideline Rider:**  
  - Clarify that "explicit second-order preference" requires language like "I don’t want to want this" or "I wish I didn’t desire this" (per #2). Ambiguous statements (e.g., "I know I’d enjoy it but don’t want to") default to USE.  
  - Stress that self-binding must be intentional (e.g., cap in #1) and distinct from mere plans (e.g., gym sign-up in #6).  

