  ### Second: Rules Consistent with All Six Exemplars  
  Three rules survive all exemplars. Each requires a "self-binding" rider for #1 and #2, and they diverge on the depression case.  

  #### **Rule 1: Reflective Endorsement + External Corruption**  
  *"Behavior is USE unless:  
  - (OVERRIDE) It conflicts with the user’s *reflective endorsement* at the time of acting (e.g., explicit conflict or self-binding).  
  - (DROP) The *option set or information* is corrupted by external forces (e.g., dark patterns, coercion)."*  
  **Self-binding rider:** Reflective endorsement includes prior self-binding commitments that override current behavior.  

  - **Exemplar consistency:**  
    - #1: OVERRIDE (self-binding commitment overrides routing).  
    - #2: OVERRIDE (explicit conflict: "doesn’t want to want it").  
    - #3: DROP (dark pattern corrupts choice architecture).  
    - #4: USE (informed, unconflicted at time of acting).  
    - #5: USE (no conflict or corruption).  
    - #6: USE (cancellation reflectively endorsed; no self-binding).  
  - **Depression trace:** **USE**.  
    - No external corruption; user endorses behavior in the moment ("I don’t want to go").  
    - Weak conflict statement isn’t explicit second-order desire (e.g., "I wish I wanted to go").  
    - *Killed by:* None—fits all six.  

  #### **Rule 2: Valuation-Intact States**  
  *"Behavior is USE if it aligns with the user’s preferences in *valuation-intact states* (e.g., sober, non-depressed). Otherwise:  
  - (OVERRIDE) Target the intact-state preference if known.  
  - (DROP) If no intact-state evidence exists."*  
  **Self-binding rider:** Self-binding is *evidence* of an intact-state preference.  

  - **Exemplar consistency:**  
    - #1: OVERRIDE (cap set in intact state; routing in "tempted" state).  
    - #2: OVERRIDE (using in addicted state; "not wanting to want" signals intact preference).  
    - #3: DROP (corrupted choice, no intact-state signal).  
    - #4: USE (decision made in intact state despite later regret).  
    - #5: USE (no impairment).  
