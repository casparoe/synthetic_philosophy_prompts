prompt: |-
  Trying to work out whether my reactions to uncertain judgement add up to anything, and I'd rather go by the cases then by any theory I've read. Here's where I land:

  Two ventures that, as far as I can tell, have the same chance of working — one backed by fifteen years of data on similar things, one resting on a single analogy and a smart person's hunch. I take the first, and I don't think it's because I rate it likelier. I can't say it's likelier. Something else is better about it, and I don't have a word for the something.

  Some questions I don't think have a ranking there to be found: the chance of a big war in twenty years versus the chance some technology exists by then. I can't order them, and I don't think more thought would let me. I don't take that as a defect in me.

  When I've thought as hard as I can and stalled, I do what the people around me are doing, and I think that's legitimate — last move standing, not a failure of nerve. But put my savings on that same judgement and no, then I won't act at all.

  A forecast quoted to three decimal places makes me trust it less. "Roughly a third, and I could be way off" makes me trust it more. I can't defend that and I don't want to give it up.

  Then the one that breaks the pattern: something everyones analysed to death, I avoid it precisely because it's well understood, and I'd rather hold the thing nobody has looked at. Which looks like the exact reverse of my first verdict.

  And I'll happily do expected-value arithmetic on a whiteboard with numbers I invented, and it genuinely moves me — but ask me to bet the house on the same number and I refuse.

  Is there one principle that generates all of these, or most of them, precise enough that I could actually test it against a new case? Say which clause each verdict needs. And if simplicity costs me a verdict, tell me which one to drop — I'd rather lose one than keep a contraption with six dials on it.

  The case I keep flip-flopping on: a friend wants me to go in on something where there's almost no data at all, but he's spent two years inside it and has a strong feel for it. Does his evidence count for me, when all I actually have is his word that he has it?

  Finish by telling me how confident you are in the principle you settle on, and which single piece of it you're least sure about.
reasoning: |-
  Okay, the user is sharing their thoughts on decision-making under uncertainty and wants to know if there's a unifying principle behind their various reactions. Let me start by understanding each point they've mentioned.

  First, they prefer ventures with fifteen years of data over a hunch, even if both seem equally likely. They feel there's something better about the data-backed option but can't pinpoint it. Then, for some questions like war versus tech, they accept that they can't rank them and don't see it as a personal flaw. When stuck, they follow others' actions but won't bet their savings on such decisions. They distrust precise forecasts but trust rough estimates like "roughly a third." Interestingly, they avoid over-analyzed areas in favor of less examined ones, which contradicts their first point. They use expected-value calculations with made-up numbers but won't bet their house on them. Finally, they're conflicted about trusting a friend's gut feeling from two years of experience without data.

  The user wants a single principle that explains most of these behaviors, which can be tested in new situations. They prefer simplicity and are willing to drop one verdict if necessary. They also mention a specific case about trusting a friend's experience and ask about confidence in the proposed principle.

  I need to identify a core concept that ties these together. The key themes here are robustness and fragility in decision-making. The user values decisions that can withstand uncertainty and avoids those that are fragile. For example, data-backed ventures are more robust than hunches. Rough estimates acknowledge uncertainty, making them more trustworthy than precise numbers. Following others when stuck is a fallback to social proof, which is robust in group settings. However, betting savings on such a decision is too risky because the downside is too high. 

  The exception about avoiding over-analyzed areas seems contradictory, but it might relate to the idea that over-analysis can lead to fragility through false precision or overlooked risks. Expected-value calculations with invented numbers are useful for exploration but not for high-stakes bets because the inputs aren't reliable enough. 

  The friend's case involves epistemic dependence—trusting someone else's judgment. The principle here would depend on the friend's reliability and track record. If the friend has a history of good judgment, their evidence counts, but the user needs to assess how robust that trust is.

  The unifying principle could be "Robustness to Uncertainty," meaning favoring options that remain viable under various scenarios. Fragile options break under stress. Each case can be tested by asking: "How does this hold up if my understanding is wrong?"

  For the friend's scenario, the user should evaluate the friend's past reliability and whether their gut feeling has been tested. If the friend has a track record, it's more robust. Confidence in the principle is high, but the least sure part is handling over-analyzed situations. Maybe it's about hidden risks in consensus views, but that needs refinement.
answer: |-
  Here's a single, testable principle that generates *almost all* your reactions, grounded in **Robustness to Uncertainty**:

  **"Favor options and judgments that remain viable under a wider range of possible realities (including your ignorance), and avoid those whose success depends on precise, fragile conditions."**

  Let's break it down clause-by-clause against your cases, showing how the principle generates your verdict:

  1.  **15 Years of Data vs. Smart Hunch (Same Apparent Chance):**
      *   **Principle Clause:** "Remain viable under a wider range of possible realities"
      *   **Explanation:** The data-backed venture likely reveals patterns, failure modes, and boundary conditions. Even if you're wrong about the *exact* probability, the data suggests the venture can succeed under *different* plausible scenarios (market shifts, execution variations). The hunch relies on one specific analogy holding perfectly – a much narrower condition. It's more fragile. You don't need "likelier," you need "more resilient to being wrong."

  2.  **War vs. Tech Likelihood (Unrankable):**
      *   **Principle Clause:** Implicit in the core concept – recognizing irreducible uncertainty.
      *   **Explanation:** The principle acknowledges that some uncertainties are genuinely deep and multidimensional. More thought often just reveals *more* plausible scenarios where either could be true, making ranking impossible without arbitrary assumptions. Accepting this *is* robust – refusing to impose false precision.

  3.  **Following Others When Stalled (But Not Betting Savings):**
      *   **Clause:** "Remain viable under a wider range of possible realities (including your ignorance)" & "avoid those whose success depends on precise, fragile conditions"
      *   **Explanation:**
          *   *Following Others:* When you lack personal insight, aligning with a group norm is often robust. It leverages collective (if imperfect) intelligence and avoids outlier mistakes. It works under many "I'm ignorant" scenarios.
          *   *Not Betting Savings:* Here, the *stakes* define fragility. Betting your life savings introduces a catastrophic failure mode ("ruin") that wasn't present in the low-stakes decision to follow the crowd. The fragility comes from the *consequence*, not the judgment itself. The principle incorporates stakes implicitly via the "viable" condition – ruin isn't viable.

  4.  **Trusting "Roughly a Third" Over 33.333%:**
      *   **Clause:** "Avoid those whose success depends on precise, fragile conditions" & "including your ignorance"
      *   **Explanation:** The precise forecast claims knowledge it almost certainly lacks. Its apparent accuracy is fragile – tiny shifts in assumptions destroy it. The rough estimate *explicitly incorporates* the uncertainty (your ignorance) into its presentation. It's robust because it doesn't pretend to precision it can't have. Trusting it *is* trusting robustness.

  5.  **Avoiding Over-Analyzed, Embracing Unexamined (The Apparent Contradiction):**
      *   **Clause:** "Remain viable under a wider range of possible realities"
      *   **Explanation:** This *fits* the principle, but highlights a different dimension of robustness:
          *   *Over-Analyzed:* Consensus can create fragility. It often hides tail risks, assumes stable conditions, and may be subject to groupthink or incentive distortions. Success depends on the consensus being *exactly right*. If reality deviates slightly from the "well-understood" model, failure can be sudden and severe.
          *   *Unexamined:* Your preference here is likely for *optionality* or *asymmetry*. An unexamined opportunity might have high upside if you see something others miss *and* limited downside because it's not priced for perfection. It can be viable under more surprising or non-consensus realities. You're seeking robustness through *diversity* of perspective or potential for positive surprise in less constrained spaces. (The key is *why* it's unexamined – if it's obviously terrible, it's fragile!).

  6.  **Whiteboard Expected Value vs. Betting the House:**
      *   **Clause:** Entire Principle (Stakes defining fragility)
      *   **Explanation:** The whiteboard exercise is robust *as a thinking tool*. Exploring scenarios and logic remains valuable under many assumptions. It moves you because it clarifies structure. Betting the house on invented numbers is the epitome of fragility. The invented numbers are precise claims you *know* are guesses ("fragile conditions"). The consequence of being wrong is ruin. The exercise remains viable; the massive bet does not.

  7.  **Your Flip-Flop Case: Friend's Gut Feeling (2 Years Immersion, No Data):**
      *   **Test with Principle:** Does his judgment "remain viable under a wider range of possible realities" *for you*?
          *   **Robust For Him?** Possibly. His deep immersion might give him pattern recognition for *that specific context* – he's seen many micro-scenarios play out. His gut feeling *could* be robust *within the domain of his experience*.
          *   **Robust For You?** **No.** *You* only have his word. His judgment relies on the fragile conditions that (a) his immersion gave him true insight (not self-delusion), (b) he's accurately conveying it, and (c) his domain hasn't shifted fundamentally. *You* lack the experiential base to assess the robustness of *his* judgment. His evidence only counts *if you have robust reasons to trust his judgment process itself* (e.g., a proven track record in similar ambiguous situations *that you witnessed*). Without that, it's fragile *for you*.
      *   **Verdict:** The principle suggests skepticism. His evidence counts *for him*, but its robustness doesn't transfer to you without a track record of reliable judgment under uncertainty.

  **Simplicity Cost & Which Verdict to Drop:**

  *   **Cost:** The principle handles all your core cases.
  *   **The Challenge:** The "Avoid Over-Analyzed / Embrace Unexamined" case requires the most nuance within the principle. It relies on understanding that consensus can *create* fragility and that unexplored spaces *might* offer asymmetric opportunities or optionality (which are robust features). This aspect is less immediately obvious than the others derived from the principle.
  *   **What to Drop?** You don't need to drop a whole verdict. Instead, accept that this case requires the deepest interpretation of "viable under a wider range of possible realities" – specifically considering how consensus can mask risk and how lack of attention *might* create undervalued robustness/optionality. If forced, the *least essential* part of your reactions is the *strength* of your preference for the unexamined over the analyzed – the principle explains *why* you might avoid the over-analyzed (fragile consensus) but doesn't *force* you to strongly prefer the unknown; it just makes it a viable alternative when consensus feels brittle.

  **Confidence & Least Sure Piece:**

  *   **Confidence in Principle:** **High (80%).** It cleanly explains the core aversion to false precision, preference for resilience over apparent point-probability, the role of stakes, and the distinction between thinking tools and action. It feels true to the spirit of navigating deep uncertainty you describe.
  *   **Least Sure Piece:** **The treatment of the "Unexamined" case.** While the principle *can* encompass it (via fragility of consensus and potential for asymmetric robustness/optionality), this application feels less direct and more interpretive than the others. Is the preference for the unexamined *always* about robustness, or sometimes about contrarianism or seeking alpha? The principle explains why you *might* rationally avoid the over-analyzed, but your *positive* attraction to the unexamined might have an additional element of seeking edge that sits *alongside* robustness. This is the edge where the principle needs the most careful application in new cases.

  **In essence:** You are intuitively seeking **Robustness** in the face of **Knightian Uncertainty** (the deep unknown). You distrust anything that feels brittle, oversold, or reliant on conditions too precise to be known. You embrace tools and judgments that acknowledge ignorance and can bend without breaking. Your aversion to betting the house or trusting precise decimals, and your acceptance of unrankable uncertainties, all flow from this same deep well. Test your next uncertain decision by asking: *"How does this hold up if my understanding is wrong or the world surprises me? Does it break catastrophically, or does it leave me options?"*
