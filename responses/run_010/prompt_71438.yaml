prompt: |-
  I run a small team that owns a bunch of internal services, so basically my whole professional life is design by contract: preconditions in the require clause, postconditions in ensure, class invariants, contract tests, and the question of who's actually at fault when a call fails — did the caller violate the precondition, or did the supplier break its guarantee? I'm fluent in that and I don't really read philosophy, but I've been chewing on the norms-of-assertion debate for about a month now and I can't get it out of my head.

  So: restate that debate in my vocabulary as faithfully as you can. My working hunch about the mapping is that the knowledge norm is a caller-side precondition (you have to have discharged the verification obligation before you make the call), the truth norm is a supplier-side postcondition (it has to hold in the world regardless of whether anyone checked), and the justification / reasonable-to-believe norms are just a weaker requirement that you ran your tests rather than that you have a proof. Run that mapping through the actual arguements and cases — the gettiered assertion, the lottery ticket, the teacher who teaches evolution she doesn't believe, the people who think the knowledge rule isn't basic at all but falls out of a general conversational requirement plus a sincerity condition, the ones who say a rule can be violated without the speaker being criticisable because they're excusable, and the relativist who makes truth-at-a-context-of-assessment do the work. For each: what translates, what only translates if I squint, and what has no expression at all in contract terms.

  Then give me the residue report. Two things I especially want: does the constitutive-rule idea survive, i.e. can contract language capture the difference between a rule you could have designed differently and a rule that makes the act the kind of act it is? And where does fault go — my vocabulary always wants to assign blame to caller or supplier, and I suspect that's smuggling something in. Finally, tell me whether the residue is a defect in my framework or a sign the philosophers' disagreement is less substantive than it looks, because honestly I can't tell if they're arguing about one thing.

  Please separate out what's settled from what's genuinely contested among people who work on this — I don't want to come away thinking there's a consensus view of assertion when there isn't one, and if one of these positions is a minority or a live dispute, say so.
