prompt: |-
  My brother-in-law is deep in the science-versus-religion genre and he passed along a book he'd recieved as a gift, with a chapter on Newton's religion that I want to fact-check before I repeat any of it at a family dinner. The passage runs roughly like this:

  "Newton was a deist before deism had a name. He turned against the Trinity not on scriptural grounds but because the doctrine offended his reason — the same reason that had just shown the heavens to be a self-regulating machine in no need of divine adjustment. Having expelled God from physics, he grew nervous about the charge of atheism and bolted a coda onto the end of the Principia, the General Scholium, where his celebrated refusal to frame hypotheses about gravity amounts to a concession that God has become a hypothesis one can do without. He hid his heresy out of pure cowardice, and it only surfaced after his death — by which point the same man was filling notebooks with alchemical recipes, the dotage scribblings of a rationalist who had drifted far from the sober religion of his age."

  My gut says this is too tidy. The hiding part sounds about right, but "deist" feels off somehow, and I have a vague memory of reading that the Scholium is where he goes on about God's dominion and even describes infinite space as God's sensorium — which doesn't sound like a man conceding that God is dispensable. Can you take the passage apart sentence by sentence and tell me what a Newton scholar would sign off on, what's half-right in a way that misleads, and what's simply false? Three things I especially want pinned down: whether his anti-Trinitarianism was the rationalist kind this chapter describes or something else entirely, and what it actually rested on; whether the Scholium can honestly be read as after-the-fact damage control, given the letters he wrote to Bentley in the early 1690s; and whether the dotage story about the alchemy survives contact with the chronology of when he was doing what. Then tell me what the chapter's overall moral — that his science pushed him out of religion — depends on, and whether that moral survives once the details are corrected.

  Please write it in American English, and where you're not confident about a specific date, title, or manuscript, flag that instead of filling it in.
