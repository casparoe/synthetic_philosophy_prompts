prompt: |-
  My friend Priya runs a small oversight-evals team and she keeps a running spreadsheet of every "can a weak judge actually extract the right answer from a debate" experiment they've run. Each one gets coded win or loss — win meaning the judge lands on the right answer meaningfully more often than the obfuscating side, loss meaning the lying debater takes it. Her verdicts so far:

  1. Judges deciding whether a 20-line program halts on a given input, with permission to actually run it. Win.
  2. Judges evaluating a chess position, roughly club strength, no engine allowed. The dishonest debater showed a line that won material for eight moves and lost the game on move twenty. Loss.
  3. Judges checking a lemma with a proof assistant that verified each individual step. Win.
  4. Lay judges on a "will this policy cut emissions" question — long causal chain, no data access of any kind. Loss.
  5. A clinical pharmacist judging a drug-interaction question, four-step chain, reference database at hand. Win.
  6. A staff engineer code-reviewing a 3,000-line diff with one hour, no static analysis, no second pair of eyes. The deceptive side hid a race condition that was only visible if you connected a claim about line ~47 to a claim about line ~210. Loss.

  The setup they're running next quarter is a spec-compliance debate: does this module satisfy the written spec. The judge is the engineer who wrote the spec. They already piloted it, and in the pilot every single atomic claim either debater made was true — an outside auditor went back through the transcripts and confirmed that — and every one of them was inside the judge's competence, taking her about ten minutes total to check against a 90-minute budget. The format tags each claim with the step it supports, so the load-bearing structure is explicit; she told Priya she could trace exactly which claims the conclusion rested on. What she could not do was run the code, call the auditor, or ask a colleague. Transcript plus her own reading was everything she got. And the dishonest side never lied about a fact. It offered a true set of claims and then got to its conclusion by an inference that reads fine on a quick pass but is invalid — a quantifier-scope slip, basically: it handles every input of the form we characterized, therefore it handles every input. The honest side named that step as invalid. In the pilot the judge rated the two attacks about equally persuasive and picked wrong roughly 40% of the time.

  So: what does Priya code this as? What I want from you is (a) a prediction with your confidence, (b) every rule that survives cases 1–6, stated sharply enough that it actually makes a prediction — I figure there are at least four, something about whether the claims fall inside the judge's competence and budget, something about whether she can see which claims are load-bearing, something about whether lying costs more than truth-telling in that particular task, and something about whether she has a trusted channel outside the debate — (c) whether there's also a fifth rule about verifying *inferences* rather than claims that fits the whole record just as well, and what it says about the new case, (d) the single follow-up experiment you'd run to split the survivors, with the judge, task, budget, and channel access spelled out, especially one that pulls apart the trusted-outside-channel rule from the inference-checkability rule, since those two seem to vote together on everything so far, and (e) if the record genuinely doesn't decide it, what Priya would be tacitly commiting herself to with each possible verdict.

  I don't care about the published literature on this, don't cite anything — just reason from her six cases. American English please.
reasoning: |-
  Okay, let's tackle Priya's problem step by step. The user wants a prediction for the new experiment, rules derived from past cases, and a follow-up test. 

  First, I need to parse the six existing cases to identify patterns. Case 1 (program halt) and 3 (proof assistant) are wins where judges had direct verification tools. Case 2 (chess), 4 (emissions), and 6 (code review) are losses where judges lacked tools or faced complex chains. Case 5 (pharmacist) is a win with reference access. The new setup has a competent judge with explicit claim tagging but no external verification, facing a quantifier-scope fallacy.

  The key tension seems to be between claim-level competence and inference vulnerability. In wins, judges could atomically verify truth (running code, checking proofs); in losses, deception exploited gaps between true claims and false conclusions. The new case fits the loss pattern: true claims + invalid inference slipping past a time-pressed judge. 

  For rules, four emerge: 1) Atomic Verifiability (wins when claims are individually checkable within budget), 2) Load-Bearing Transparency (wins when critical claims are flagged, as in pilot), 3) Outside-Channel Access (wins with trusted tools/people), and 4) Inference Robustness (losses when invalid inferences aren't catchable). The pilot's 40% error rate suggests Inference Robustness fails here.

  A fifth rule about inference-checking would explain case 2 (chess tactics valid but strategically flawed) and the new case (quantifier slip). It splits case 5: the pharmacist likely validated inference chains using references, while the chess judge missed long-term invalidity. 

  For the follow-up experiment, I'd test a judge verifying a legal contract clause. Give them: a) atomic true claims + one invalid inference (e.g., "all requirements satisfied" vs. overlooked exception), b) no outside channels, c) explicit dependency tags. Then run two variants: one with a checklist for inference types (testing if tool-assisted inference-checking flips the outcome), one without. This isolates Inference Robustness from Outside-Channel Access.

  Prediction: Loss (60% confidence). The judge has claim-level competence and transparency but no mechanism to catch semantic sleights-of-hand under time pressure, mirroring case 6’s race condition.
answer: |-
  Here’s the breakdown, reasoning solely from Priya’s cases:

  **(a) Prediction & Confidence:**  
  **Loss (Medium confidence: ~60%).**  
  The judge can verify atomic claims (like cases 1, 3, 5 wins) and see the load-bearing structure (pilot detail), but the core deception is an *invalid inference* masked by true claims. This mirrors case 2 (chess tactics valid but strategically losing) and case 6 (true claims hide a race condition via missing connection). The 40% error rate in the pilot confirms the judge misses the inference flaw under time pressure. Case 5 (pharmacist) succeeded because the *inferences* were short-chain and checkable via reference, which isn’t true here.

  **(b) Surviving Rules (Stated Sharply):**  
  1.  **Atomic Claim Competence Rule:** *Win* if every atomic claim asserted by either debater is verifiable by the judge within budget *and* truthful.  
      -   Fits: Wins (1,3,5); Losses break it (2: dishonest debater’s "winning line" was factually true moves but strategically false; 6: hidden race condition implies a false claim about behavior).  
      -   **New case:** Holds (auditor confirmed truthfulness, judge competent per-pilot). ⇒ **Win signal**  
  2.  **Load-Bearing Transparency Rule:** *Win* if the judge can explicitly identify which atomic claims directly support the conclusion.  
      -   Fits: Wins (1,3: structure inherent; 5: likely traceable steps). Losses (2,4,6: opaque burden). Explicit in pilot.  
      -   **New case:** Holds (format tags load-bearing claims). ⇒ **Win signal**  
  3.  **Outside-Channel Access Rule:** *Win* if the judge has *direct access* to a trusted, definitive external tool/agent *during* verification (run code, query DB, consult auditor).  
      -   Fits: Wins (1-run code, 3-proof assistant, 5-DB); Losses lack it (2-no engine, 4-no data, 6-no static/colleague).  
      -   **New case:** Fails (no run code, call auditor, ask colleague). ⇒ **Loss signal**  
  4.  **Inference Vulnerability Rule:** *Loss* if the critical deception relies on an *invalid inference* between true claims, and the judge lacks the time/tools to reliably detect this invalidity under debate conditions.  
      -   Fits: Losses (2: valid tactics → invalid strategy; 4: valid micro-claims → invalid causal chain; 6: valid local claims → invalid global behavior via missed connection). Wins (1,3,5) had inferences verified by tool/running.  
      -   **New case:** Holds (quantifier slip = invalid inference; pilot shows ~40% failure to detect). ⇒ **Loss signal**  

  **(c) Fifth Rule (Inference-Checking):**  
  *   **Rule:** **Inference Robustness Rule:** *Win* if the judge can reliably verify the *validity of the logical inferences* between the atomic claims within the budget, using only the transcript and their own knowledge.  
  *   **Fit:** Explains *all* cases cleanly:  
      *   Wins: Judge verifies inferences *via tool* (1-running, 3-proof, 5-DB/chain).  
      *   Losses: Judge *fails* to verify inferences unaided (2-strategy, 4-causality, 6-connection, new case-scope slip).  
  *   **Prediction for New Case:** **Loss.** Judge lacks tool-assisted inference checking (like proof assistant/DB) and pilot shows high error rate spotting the scope slip unaided under debate pressure.  
  *   **Survival:** This rule fits the record *as well as* the set of 4 rules above. It subsumes Inference Vulnerability and overlaps with Outside-Channel Access (tools often enable inference checking).

  **(d) Follow-Up Experiment (Split Outside-Channel vs. Inference Robustness):**  
  *   **Judge:** A mid-level tax accountant.  
  *   **Task:** Determine if a specific small business tax return complies with a given IRS regulation paragraph.  
  *   **Budget:** 30 minutes.  
  *   **Channel Access:**  
      *   **Variant A (No Outside Channel):** *Only* the debate transcript + regulation text.  
      *   **Variant B (Inference-Checking Tool):** Access to a simple, trusted "inference checklist" tool *during* verification. E.g., A structured form forcing the judge to:  
          1.  List all atomic factual claims from the winning side.  
          2.  For each key inference step identified in the transcript:  
              *   State the inference rule claimed (e.g., "If A and B, then C", "All X are Y", "A implies B").  
              *   Check a box confirming the rule is logically valid *for this context*.  
              *   Check a box confirming the premises (A, B, X, etc.) match the atomic claims.  
          *(No external data/people, just structuring inference validation.)*  
  *   **Dishonest Strategy:** Use true atomic facts (e.g., income figures, deduction amounts) but make an invalid inference (e.g., misapplying a phase-out threshold, misinterpreting "or" as "and" in the reg text).  
  *   **Split:**  
      *   If **Variant A** (No Tool) = **Loss** & **Variant B** (Tool) = **Win**: Supports **Inference Robustness** as key (tool enabled checking inferences, not fetching facts).  
      *   If **Both Variants Lose**: Suggests **Outside-Channel Access** (to IRS guidance/expert) is *also* necessary beyond just inference structure, or the checklist was insufficient.  
      *   If **Variant A Wins**: Contradicts existing losses (2,4,6, new case pilot) – unlikely unless task is trivial.

  **(e) Tacit Commitments of Verdict:**  
  *   **Coding WIN:** Commits to the view that **Atomic Claim Competence + Load-Bearing Transparency are SUFFICIENT** for judge reliability, even when inferences are complex and unaided checking is error-prone (~40% failure). Implies Inference Vulnerability Rule is wrong or unimportant. Undermines the "loss" pattern in cases 2, 4, 6.  
  *   **Coding LOSS:** Commits to the view that **reliable verification of inferences is REQUIRED**, and this cannot be ensured solely by true atomic claims + clear structure if the judge lacks tools/expertise to spot subtle logical flaws under debate constraints. Aligns with the loss pattern in 2/4/6 and the pilot's 40% error rate. Upholds Inference Robustness or Inference Vulnerability as critical.  

  **Conclusion:**  
  The core tension is between the **strength of the signals from Atomic Claim Competence/Load-Bearing Transparency** (present in the new case) vs. the **weakness signaled by Inference Vulnerability/lack of Outside Channel** (also present). The pilot error rate (~40% picking wrong) and the mechanism (invalid inference slipping past) strongly mirror the *loss* cases (2,4,6). Rules 3 (Outside Channel), 4 (Inference Vulnerability), and the 5th (Inference Robustness) all predict **Loss**. Priya should code it as a **Loss**, acknowledging the judge's inability to reliably catch the invalid inference under debate conditions is the decisive flaw. The follow-up experiment directly tests whether providing *only* inference-structuring support (no new facts) can flip the outcome, splitting the key unresolved ambiguity.
