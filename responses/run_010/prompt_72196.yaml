  I also need to be transparent about where I'm bending concepts. For instance, in claim one, mapping stages to survey error but noting the absence of power dynamics. For claim two, admitting that the statistical framework assumes a pre-existing population, which Trouillot denies. Highlighting these cheats is crucial for the user's trust.

