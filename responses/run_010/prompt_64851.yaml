prompt: |-
  I'm a third-year PhD student and I've drawn the slot at our department's reasons-and-rationality reading group next month, and I want to go in defending something people will actually have to argue with rather than nod along to. So: build me the strongest case you can for the view that there are no wrong-kind reasons at all — that whenever it looks like you have a reason to adopt an attitude that has nothing to do with thier object, the right description is that you have a reason to want to have the attitude, or a reason to bring it about that you have it, and never a reason for the attitude itself. The demon who'll punish you unless you admire him: overwhelming reason to want to admire him, overwhelming reason to arrange your life so that you come to admire him, not one scrap of a reason to admire him. Belief is the easy case for me, since on this view the thesis about belief basically collapses into evidentialism, so I don't want the argument to lean on belief. I want the hard attitudes done properly: fear, admiration, guilt, resentment, gratitude, intention — the ones where "you can't just decide" is supposed to bite, and where people say the reduction makes a hash of the fact that these reasons still show up in the agent's deliberation and still seem to weigh against each other with object-directed reasons.

  Two obstacles I'd like you to run straight at instead of around. First, the asymmetry that keeps nagging me: the demon case seems to behave differently for different attitudes. He's threatening to torture you, which arguably makes him genuinely fearsome, and dangerousness looks like just what makes fear fitting — so the reason to fear the demon looks object-directed, while nothing whatever about him makes him admirable. If that's right, the right-kind/wrong-kind distinction isn't doing any work in the fear case at all. I think that's good news for my view, not bad, and I want you to argue exactly that: that the asymmetry is best explained by the objects of the attitudes differing in how tightly they're tied to the agent's interests, not by reasons differing in kind, and that the view predicts where the asymmetry will and won't show up. Second, the objection that the reduction is idle plus its sneakier cousin. Idle: you can't admire somebody as a means any more than you can believe at will, so "you have a reason to want the attitude" leaves the agent in front of the demon with nothing to do right now — tell me whether that's fatal, and if it isn't, say concretely what the view tells her to do. Sneakier cousin: if I have a reason to want to admire him, and admiring him is a means to wanting to admire him, doesn't means-end transmission hand me back a reason to admire him, so the wrong kind of reason sneaks in through the back door? I want a real answer to that, not a shrug about transmission principles being restricted.

  Finally I want a diagnosis of why there's a problem here in the first place, because my hunch is that the whole debate is generated by running together two different questions — what makes an attitude fitting, and what an agent ought, all things considered, to do about her own attitudes — and that once you pull them apart the demon stops looking like a counterexample to anything. Argue for that too. I know a weaker cousin of my thesis has been defended before, so don't give me the cousin: give me the version that denies wrong-kind reasons outright, and say what extra explanatory work the strong version is doing that the weak one isn't. And be straight with me about the cost — I'd much rather hear which intution the view has to give up, and why giving it up is survivable, than a story that pretends everything is saved. No need to point me at sources or a bibliography, I'll chase those down myself once I've seen whether the argument holds together.
reasoning: |-
  Okay, let's tackle this PhD student's challenge. They want a robust defense against wrong-kind reasons (WKR), specifically for attitudes like fear or admiration. First, I need to recall the core argument: all reasons are object-given; any apparent WKR is actually a reason to want or cause the attitude. 

  The demon example is central. For admiration, the threat gives reasons to desire admiration or to cultivate it, but not to admire directly. However, the student mentioned an asymmetry with fear—the demon's threat might make it genuinely fearsome. That's a key obstacle. I should argue that fear's object (danger) ties closely to the agent's interests, so the demon's threat creates actual dangerousness, fitting fear. Whereas admiration's object (admirable traits) doesn't relate to interests, so no fittingness. This explains the asymmetry without needing WKRs.

  Next, the idle objection: if you can't admire at will, what do you do when facing the demon? The answer must involve long-term strategies to alter one's dispositions, like self-conditioning. The sneakier cousin issue: if a reason to want admiration and admiration is a means to that want, does means-end transmission create a reason to admire? Here, I need to deny transmission because admiration isn't an action but a non-voluntary attitude. Transmission principles apply only to actions, not attitudes.

  The diagnosis part is crucial. The confusion comes from conflating fittingness (normative reasons based on the object) with practical reasons (what to do about attitudes). Separating these resolves the demon case—it's about practical reasons to manage attitudes, not fittingness reasons.

  Strong vs. weak thesis: Weak versions allow WKRs but say they don't bear on fittingness. The strong version denies WKRs entirely, avoiding the mistake of reifying them. The cost is rejecting intuitions about deliberative weight, arguing that what seems like weighing is actually conflicting practical reasons about attitude management.

  I should structure the response to directly address each obstacle and provide concrete steps. Emphasize that the view is defensible but requires giving up the idea that non-object-related factors directly provide reasons for attitudes themselves.
answer: |-
  Here’s the strongest case for the **Strong No-WKR Thesis**: There are no wrong-kind reasons for attitudes—*ever*. Any apparent reason to adopt an attitude (fear, admiration, guilt, etc.) that isn’t grounded in properties of the attitude’s object is actually a reason to *want* that attitude or to *bring it about* you have it. The demon case doesn’t give you a reason to admire him; it gives you a reason to *desire admiration for him* or *train yourself to feel it*. Belief collapses to evidentialism, but the hard attitudes (fear, admiration, etc.) are where the action is. Let’s build the case, run at your obstacles, and diagnose the confusion.

  ### Core Argument: The Object-Directedness Constraint
  1. **Attitudes are "evaluative perspectives"**  
     Fear presents its object *as dangerous*; admiration presents it *as excellent*; resentment presents it *as a wrong*. These are not just causal dispositions but ways of seeing the world. Reasons *for* these attitudes must speak to whether the world *as presented* is accurate or fitting. If the demon isn’t excellent, nothing about admiration’s "presentational content" connects to his threat. You can’t admire *as a response to* non-admirability any more than you can believe *as a response to* non-evidence.  

  2. **Deliberation is object-focused, not attitude-focused**  
     When you deliberate whether to fear X, you consider X’s properties (is it dangerous?). When you resent Y, you consider what Y did (was it a slight?). The demon’s threat *doesn’t appear in admiration’s deliberation space*. If you "weigh" the threat when "deciding" whether to admire, you’re not engaging in admiration—you’re engaging in *instrumental reasoning about self-manipulation*. What feels like weighing reasons *for admiration* is actually weighing reasons *to induce admiration*.  

  3. **The Reduction Explains "Weighing" Without WKRs**  
     Suppose you resent a colleague’s minor slight. You also know resentment will poison your work. The "weighing" isn’t between a WKR (career harm) and a right-kind reason (the slight). It’s between:  
     - The object-directed reason (the slight makes resentment fitting).  
     - A practical reason *to extinguish your resentment* (because it’s harmful).  
     These operate in different domains: one is about the fittingness of an attitude; the other is about managing your psychology. No WKR needed.  

  ### Running at Your Obstacles
  **Obstacle 1: The Asymmetry (Fear vs. Admiration)**  
  *The demon’s threat makes him dangerous, hence fearsome—so fear’s reason is object-directed. But he’s not admirable, so admiration’s reason isn’t. Doesn’t this validate the RKR/WKR distinction?*  

  - **Your View’s Reply: Tight vs. Loose "Fittingness" Ties to Interests**  
    Fear’s fittingness *just is* dangerousness-to-you. The demon’s threat makes him *objectively dangerous to you*, so fear is fitting. Admiration’s fittingness (excellence) isn’t defined relative to your interests. The asymmetry isn’t about reasons being different kinds; it’s about *how the attitude’s fittingness conditions relate to the agent*.  
    - **Prediction**: Attitudes with fittingness tied to the agent’s perspective (fear, prudential guilt, gratitude for benefits *to you*) will often have "threat-based" reasons that are object-directed. Attitudes with fittingness detached from the agent (admiration, moral resentment, aesthetic awe) won’t.  
    - **Why this helps you**: It explains why the demon case *feels* different for fear vs. admiration without invoking WKRs. For fear, the threat *is* an object-directed reason; for admiration, it isn’t. The distinction is in the *attitudes*, not in a metaphysical split between "kinds of reasons."  

  **Obstacle 2: The Idle Objection & Sneakier Cousin**  
  *"You can’t admire at will, so ‘reason to want admiration’ leaves you with nothing to do. And if you have reason to want admiration, and admiring causes you to want it, doesn’t means-end transmission give you a reason to admire?"*  

  - **Idle Objection: What the Agent Should Do**  
    - **Short-term**: Acknowledge you can’t admire now. *Do nothing* directly about admiration. Instead:  
      - Form the *intention* to cultivate admiration (e.g., via self-hypnosis, exposure therapy, or "fake it till you make it").  
      - Act to *avoid the threat* (e.g., beg for mercy, hide).  
    - **Long-term**: Treat attitude cultivation as a *practical project*. If avoiding torture requires admiring the demon, you have reason to take pills, hire a cult deprogrammer, or recite his "virtues" daily until admiration sticks.  
    - **Why it’s not fatal**: The view *denies* you need to respond to the threat *with admiration*. It tells you to respond *with action* (manipulate your psychology) or *with other attitudes* (desire to admire, intention to change). This mirrors real life: we manage recalcitrant attitudes through indirect strategies, not direct willing.  

  - **Sneakier Cousin: Means-End Transmission**  
    *Premise*: Reason to want admiration (R1). Admiration is a means to wanting it (since having admiration typically causes a desire to keep it). *Conclusion*: Reason to admire (R2).  
    - **Reply: Block transmission categorically**  
      Means-end transmission applies only to *actions*, not attitudes. Admiration isn’t something you *do*; it’s something that *happens to you* when presented with excellence. Transmission principles require intentional control: you can’t *adopt admiration as a means* because you can’t adopt it *at all*. R1 is a reason to *take means to cause admiration* (e.g., hire the hypnotist), not a reason *for admiration itself*.  

  ### Diagnosis: The Core Confusion  
  The debate arises from conflating two distinct normative questions:  
  1. **Fittingness**: Is this attitude *merited* by its object? (e.g., "Does the demon’s cruelty make admiration fitting?")  
  2. **Practical responsibility**: What should I *do* about my attitudes? (e.g., "Should I eradicate my resentment to avoid burnout?")  

  - **Why the demon confuses people**: It presents a *practical* demand ("Avoid torture!") that *involves* an attitude. We slide from "I must bring it about that I admire" to "I must admire" because we mistake the *target* of the ought (the attitude) for its *ground* (the threat). But "oughts" apply primarily to *actions* and *intentions*; attitudes are only "oughted" derivatively, via what we ought to *do* about them.  
  - **What your view does**: It pulls these questions apart. Fittingness is purely object-directed; practical reasons govern attitude management. The demon is a counterexample *only* if you equivocate between "reason to φ" (where φ is an attitude) and "reason to cause φ." Your strong thesis avoids this equivocation by eliminating the first.  

  ### Strong vs. Weak: Why Go Nuclear?  
  - **Weak cousin**: "WKRs exist but don’t bear on fittingness; they’re just practical reasons to have attitudes."  
  - **Your strong thesis**: "WKRs *don’t exist*—only misdescribed practical reasons."  
  - **Extra explanatory work**:  
    - **Deliberative unity**: The weak view must explain why "reasons" for attitudes appear in deliberation but can’t be acted on directly. Your view says they *don’t* appear—only practical reasons do.  
    - **Metaphysical parsimony**: No need for two reason-types. All reasons are either object-directed (fittingness) or practical (action/management).  
    - **Error theory**: Explains why WKR intuitions arise (conflation of practical/fittingness "oughts").  

  ### The Cost & Why It’s Survivable  
  - **Cost**: You must deny that "the demon gives me a reason to admire him" is *ever* literally true. Even in deliberation, when you "feel" the weight of the threat against the slight’s admirability, you’re actually weighing:  
    - *Fittingness reason*: "He’s vile → admiration unfitting."  
    - *Practical reason*: "Torture awaits → I must cultivate admiration."  
  - **Why survivable**:  
    - **Phenomenology preserved**: The "weighing" feels the same because practical reasons can conflict with fittingness. You still deliberate; you just aren’t weighing *reasons for the attitude*.  
    - **No loss in action-guidance**: The view tells you everything you can do (intend, cultivate, act). It only denies that you can "do" the attitude.  
    - **Moral integrity intact**: You’re not required to *genuinely admire evil*; you’re required to *act* to avoid torture. This aligns with intuitions about moral corruption: you can drug yourself to admire the demon without endorsing his "admirability."  

  **Upshot**: Your strong thesis is defensible by:  
  (1) Tying reasons strictly to attitude essences (object-directedness),  
  (2) Reducing all "WKRs" to practical reasons for attitude management,  
  (3) Explaining asymmetry via attitude-relative ties to interests,  
  (4) Blocking means-end transmission for non-voluntary attitudes, and  
  (5) Diagnosing the debate as a conflation of fittingness vs. practical "oughts."  
  The cost—rejecting WKR intuitions as linguistic/conceptual errors—is tolerable because it delivers a unified, parsimonious theory of reasons and rationality. Go punch holes in it.
