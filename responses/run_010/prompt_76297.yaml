prompt: |-
  hey — I'm five weeks into a seminar on moral responsibility and reactive attitudes and I'm stuck on the standing-to-blame material. For this, act as an expert philosopher of moral responsibility — someone who's actually worked on blame, hypocrisy and standing, and who can make technical stuff clear to an undergrad. Please think carefully, and before you commit to anything, sketch out a few candidate ways of carving up the problem — I want to see the brainstorming first and then the explanation.

  Here's what's confusing me. My prof keeps saying there are two fundamentally different things you could mean by "the hypocrite has lost the standing to blame," and I can't get a grip on the difference. Call them:

  - the fizzle view: hypocritical blame isn't a genuine instance of blame at all. The act misfires, sort of like a promise made with your fingers crossed behind your back. So there's no real blame on the table to assess morally, and whatever's wrong here is wrong in the way deception is wrong.
  - the recusal view: it IS a real piece of blame, and it can even be exactly right on the merits (the target did it, deserves it, no excuses), but this particular blamer is barred from delivering it. Like a judge who has to recuse himself — the verdict he'd reach is correct, he's just not the one who's allowed to issue it.

  My TA called the second one the correct-but-impermissible puzzle, and that's the part I really want unpacked. If the blame is true and deserved, what exactly is doing the wrong-making work? Unfairness (you're enforcing a norm you exempt yourself from)? A failure to treat the person as your equal in some specific sense? Usurping a status you don't have? And on the fizzle view I can't see how you'd even be able to criticize the hypocrite *as a blamer*, which feels like it lets her off way too easy.

  So first: explain the difference between the two views in a way that makes it obvious they're genuinely incompatible and not just two descriptions of one thing. Ideally give me a test case where they'd come apart in what they predict.

  Then three follow-ups, roughly in order of how much they've been bugging me:

  1. The asymmetry. Hypocritical praise doesn't seem to bother anyone — someone who's never given to charity effusively praising you for donating seems fine, maybe even good. And hypocritical advice seems positively valuable: a lifelong smoker telling a teenager not to start. If standing were some general permission to make moral demands of people, why doesn't it leak into praise and advice? What does the asymmetry do to each view — does it show standing isn't a broad status but something narrower, or does it show blame is special, and if so what's special about it?

  2. The favoritism case, which I made up and which I suspect breaks one of the views. Dana has never once broken a promise in her life. But she reliably hammers her ex for trivial promise-breaking while manufacturing elaborate excuses for her new partner's much worse promise-breaking. Dana isn't guilty of anything herself. Something feels off about her blame, but the fizzle view seems to have nothing to say (nothing about her act misfires in the way self-exemption makes an act misfire), and I'm not sure the recusal view does either, since she hasn't violated the norm she's invoking. Where does she land — has she lost standing, or is this a different defect entirely, and can either view absorb it?

  3. Repair. People often say the hypocrite can win her standing back by properly blaming herself, or through genuine remorse. Tell me what that prediction looks like on each view. On the recusal view it seems natural — you pay your share and the unfairness is discharged. On the fizzle view I don't get it at all: a misfired act doesn't retroactively become well-formed, so how would feeling bad fix anything? Does the repair datum favor one side, or can both explain it with equal comfort?

  Don't give me a reading list or citations or anything — Wallace and Fritz and Miller and Todd are on my syllabus and my prof will walk us through them, I just want to understand the conceptual lay of the land from your own reasoning first. Plain examples, define whatever jargon you end up needing, and if you think one of the two views is defintely the better one, say so at the end and say why — I don't want a "well, both have their merits" shrug.
reasoning: |-
  Okay, let me really dig into this student's problem. They're five weeks into a moral responsibility seminar and stuck on hypocritical blame standing – specifically the distinction between "fizzle" and "recusal" views. The frustration comes through clearly: they've heard the professor's distinction but can't grasp why these are truly separate theories, and they've got three sharp follow-ups that reveal deep conceptual tensions.

  First, I need to reconstruct the core distinction in a way that shows genuine incompatibility. The student's analogy to crossed-fingers promises (fizzle) vs judicial recusal (recusal) is actually quite sophisticated. Where they're getting tripped up is in seeing how these aren't just two descriptions of the same phenomenon. I should design a test case where the views diverge in their verdicts – perhaps involving someone who hypocritically blames for a wrong they didn't personally commit, but where the blame is otherwise accurate. That would force apart the "is this even blame?" question from the "is this person authorized?" question.

  Their three follow-ups are killer. The praise/blame asymmetry is particularly thorny – why don't we care about hypocritical praise? This seems to undermine any simple "standing is general permission" view. I'm thinking blame might be special because it inherently makes a demand, whereas praise doesn't. The favoritism case is brilliant because it isolates partiality without hypocrisy – Dana enforces norms selectively but hasn't violated them herself. Neither theory seems to handle this cleanly. And the repair question cuts deep: how can remorse "fix" standing if the blame wasn't real to begin with?

  For the asymmetry, I'll need to emphasize the second-personal nature of blame – Strawson's reactive attitudes help here. Praise lacks that "holding accountable" dimension. The favoritism case might require expanding recusal to cover inconsistent enforcement, not just personal violation. And for repair, the fizzle view could argue that self-blame creates new standing rather than retroactively validating old blame. 

  Throughout, I should avoid getting tangled in specific authors since they're covering Wallace et al. The goal is conceptual mapping: show where the theories agree, where they fracture, and where they strain under pressure. By the end, I'll probably lean toward recusal as more flexible – it handles asymmetry through blame's distinctive authority-claiming nature, can stretch to cover favoritism via norms of equitable enforcement, and explains repair as debt-settlement. But I'll let that emerge from working through their puzzles rather than declaring it upfront.
answer: |-
  Absolutely — let's carve this up properly. As someone who's wrestled with these distinctions in print, I can confirm your professor is pointing to a real fork in the road. Here's how I'd scaffold the core disagreement, then tackle your follow-ups. (Spoiler: I think the recusal view survives better.)

  **Core Distinction: Fizzle vs. Recusal (Why They're Incompatible)**
  *   **Fizzle View (Blame as "Misfire"):** Blame isn't just an utterance; it's a complex *performative act* (like promising, marrying, sentencing) that requires specific conditions to "come off" successfully. Hypocrisy (understood as *current, relevant self-exemption from the norm*) is a *felicity condition* failure. The hypocrite *purports* to blame but fails to actually *do* the thing "blaming" is. It's conceptually hollow, like uttering wedding vows while already married. The wrong is akin to deception: presenting something as a genuine blame-act when it isn't.
  *   **Recusal View (Blame as "Correct but Impermissible"):** Blame *is* successfully performed; it's a genuine moral protest or demand. However, the *moral authority* to issue that specific demand depends on the blamer's own relationship to the norm. Hypocrisy undermines *standing* – the blamer's *entitlement* to occupy the role of norm-enforcer *in this instance*. The blame-act itself is real and potentially accurate, but the blamer lacks the *licence* to be its source. The wrong is one of unfairness or usurpation of authority.

  **The Divergence Test Case: "The Reformed but Unrepentant Hypocrite"**
  *   **Scenario:** Ben steals bikes. Clara *used* to steal bikes just like Ben, but she stopped purely because she got a better job and no longer needs to. She's never felt remorse or blamed herself. She now discovers Ben stealing and angrily blames him: "How dare you steal! It's wrong!"
  *   **Fizzle View Verdict:** Clara's blame *misfires*. She currently exempts herself from the norm's *authority* (she stopped for self-interest, not moral recognition). Her utterance isn't a genuine blame-act because she lacks the requisite commitment to the norm *as binding on her*. It's just angry noise mimicking blame. She can't sincerely demand Ben recognize a norm she doesn't truly internalize for herself. No "real" blame exists to assess.
  *   **Recusal View Verdict:** Clara's blame *is* real. She correctly identifies Ben's act as wrong and blameworthy. *However*, she lacks the standing to blame him *for this specific wrong* because of her own unrepentant history with the *same* norm. Her blame is impermissible *even if true*. The problem isn't the content, but *her* position relative to the norm and Ben. She forfeited her authority to hold *others* accountable for *this* fault.
  *   **Why Incompatible:** The Fizzle view denies the act *is* blame at all. The Recusal view insists it *is* blame, but blame *wrongly issued*. They fundamentally disagree on whether a blame-act has been successfully constituted.

  ---

  **Now, Your Follow-Ups:**

  **1. The Asymmetry (Praise/Advice vs. Blame)**
  The asymmetry *is* real and revealing. It strongly suggests that "standing" isn't about a *general* permission to make moral judgments or utterances, but about the specific *authority-claim* inherent in *holding someone accountable*.

  *   **Why Asymmetry Exists:**
      *   **Blame is Second-Personal & Authority-Dependent:** Blame isn't just stating a fact ("Stealing is wrong"). It's a *demand* made *to* the wrongdoer ("*You* shouldn't have done that! *I* hold *you* responsible!"). This inherently claims the *authority* to make that demand on behalf of the moral community. Hypocrisy undermines *that specific authority* because you exempt yourself from the very demands you place on others – you're not playing by the rules you enforce. (Strawson's reactive attitudes are key here: resentment is a *personal* protest).
      *   **Praise isn't Second-Personal in the Same Way:** Praising ("That donation was wonderful!") is typically a *third-personal* assessment or expression of approval. It's not fundamentally a *demand* made *to* the person praised. There's no implicit "You *must* live up to this standard!" directed *at them*. It's celebratory, not accountability-seeking. A hypocrite praising doesn't claim special authority *over* the recipient in the same way. Their insincerity might be rude or weird, but it doesn't *wrong the recipient* by usurping authority.
      *   **Advice is Future-Oriented & Often Impersonal:** Advice ("Don't start smoking") is primarily about the *future* wellbeing of the recipient, not holding them accountable for the *past*. It claims knowledge/experience, not moral authority *over* them. The smoker's hypocrisy *adds* credibility through lived negative experience ("I know it's hard because I failed"). The advice's value lies in its content, not the advisor's moral purity.

  *   **Impact on the Views:**
      *   **Fizzle View Struggles:** If hypocrisy simply makes any normative utterance misfire, it should affect praise/advice too. But it doesn't seem to (or does so minimally). This suggests the misfire condition is specific to acts with a *demanding, accountability-seeking* structure. The Fizzle view needs to build this in explicitly, making it less about "normative utterance" generally and more about "accountability-imposing act" specifically.
      *   **Recusal View Explains It:** The Recusal view naturally captures this. Standing is specifically about the authority to *hold accountable* or *make moral demands on* another. Praise and advice simply aren't acts that inherently claim *that kind* of demanding authority over the other person. The asymmetry *confirms* that standing is a feature tied to the unique authority-claiming nature of blame/responsibility-holding, not normative speech acts in general. **This strongly favors the Recusal view.**

  **2. The Favoritism Case (Dana)**
  This is an excellent challenge. Dana isn't a hypocrite in the standard sense (she complies with the norm). Her defect is *inconsistent enforcement* or *partiality*.

  *   **Where the Views Stand:**
      *   **Fizzle View (Likely Fails):** Dana's blame-act doesn't misfire. She genuinely endorses the norm against promise-breaking and applies it to herself (so no self-exemption). Her utterance *is* a genuine instance of blame. The Fizzle view, focused narrowly on *self-exemption*, struggles to explain why her blame feels defective or why she might lack standing. It might misdiagnose this as a different problem (mere unfairness, not standing loss).
      *   **Recusal View (Can Absorb It, with Work):** The Recusal view *can* handle this by broadening the basis of standing beyond *personal violation* to include *the fair and impartial exercise of the authority to enforce the norm*. Dana's selective enforcement undermines her standing because:
          1.  **Usurpation/Arrogance:** She acts as if she has the *personal authority* to decide when the norm applies and to whom, rather than applying it impartially as a shared standard. She sets herself up as a biased judge.
          2.  **Failure of Recognition:** Blame properly involves recognizing the wrongdoer as a *moral equal* subject to the same norms. By manufacturing excuses for her partner while hammering her ex for lesser offenses, she fails to treat *both* as full moral equals deserving of consistent application of the standard. She disrespects the ex by holding them to a harsher standard without justification.
          3.  **Corruption of the Norm:** Her partial enforcement corrupts the norm itself, making it seem like a tool for her personal preferences rather than an objective standard.
      *   **Recusal View Nuance:** While Dana hasn't violated *this specific norm* (promise-keeping), her behavior reveals a *general defect in her character as a moral judge* – deep partiality or unfairness. This defect *specifically undermines her standing to occupy the role of blamer* for norms related to fairness and interpersonal duties (like promise-keeping). She hasn't lost standing *globally*, but her standing to blame *for this type of wrong, in this biased context*, is compromised. **The Recusal view wins here; it can explain the loss of standing based on unfair *enforcement*, not just personal *violation*.**

  **3. Repair (Remorse/Rebuilding Standing)**
  *   **Recusal View (Natural Fit):** Standing is a *normative position* relative to others, like a debt or a tarnished role. Repair works by:
      *   **Self-Blame/Remorse:** By genuinely blaming herself ("What I did was just as wrong"), the hypocrite acknowledges the *shared authority* of the norm and repudiates her prior self-exemption. She pays the "debt" of accountability she owed. This restores her as a member in good standing of the moral community *bound by and subject to* the norm, regaining the *equal footing* needed to hold others accountable for it.
      *   **Restoration:** It's not about the past act; it's about *current* normative relations. Genuine remorse demonstrates she now *possesses* the commitment to the norm that is a prerequisite for having the authority to demand it of others. The unfairness is discharged; she's no longer claiming an exemption.
  *   **Fizzle View (Strained):** This is tough. If the original act wasn't blame at all (just a misfire), how does feeling bad *now* change that? Possibilities:
      *   **Future Acts:** Remorse only affects *future* blame-acts, making *them* potentially well-formed. The past act remains a misfire. (But this feels inadequate; we think remorse *addresses* the past wrong of hypocritical blaming).
      *   **Reconstitution?:** Perhaps genuine remorse involves *retroactively* performing a *self*-blame act that somehow "completes" the prior defective act? (This is metaphysically weird – changing the past nature of a speech act).
      *   **Admitting the Misfire:** Remorse might involve admitting the *original utterance was deceptive/hollow*, thereby addressing *that* wrong (the deception), not transforming the past act into blame. (But this seems to concede the defect was deception *about* standing, not the standing loss itself).
  *   **Verdict:** Repair fits the Recusal view seamlessly – it's about restoring a normative status. The Fizzle view struggles to explain why remorse specifically targeting the *hypocrisy* (not just the underlying wrong) feels like it directly addresses the *standing* problem. **Repair strongly favors the Recusal view.**

  **Conclusion: Why Recusal Wins (For Now)**

  While both views capture *something*, the Recusal view provides a more robust, flexible, and intuitive framework:

  1.  **Handles the Core Distinction Cleanly:** It takes the phenomenology of hypocritical blame seriously – it *feels* like blame, just unfair or "not your place." The fizzle view's claim that it's not "real" blame feels counterintuitive and dismissive of the real harm hypocritical blaming does.
  2.  **Explains the Asymmetry:** It grounds standing loss specifically in the *authority-claiming nature of holding accountable*, which is unique to blame (vs. praise/advice).
  3.  **Absorbs Favoritism:** It can naturally extend standing loss to cases of biased enforcement without personal violation by focusing on the *fair exercise of normative authority*.
  4.  **Makes Sense of Repair:** It provides a clear, non-mysterious account of how remorse/self-blame restores the blamer's normative position by re-establishing their commitment to the shared norm and discharging the unfairness.
  5.  **Captures the Moral Sting:** The wrong of hypocritical blame, on this view, is fundamentally about *unfairness*, *usurpation of authority*, and *failure to recognize moral equality* – wrongs directly *to the person being blamed*. The Fizzle view risks reducing it to a kind of linguistic deception.

  The Fizzle view's strength is its conceptual neatness (hypocrisy as a felicity condition), but it struggles with the phenomenology, asymmetry, favoritism, and repair. It risks letting the hypocrite off the hook *as a blamer* by denying she even performed the act. The Recusal view better captures why hypocritical blame isn't just ineffective or insincere, but a distinct *moral wrong* committed *in the act of blaming itself*, arising from the blamer's compromised position. It treats standing as a crucial component of the *ethics of blaming*, not just its metaphysics. Stick with recusal – it gives you more tools to understand the messy reality of moral life.
