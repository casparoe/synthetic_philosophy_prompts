  ## Diptych: Two Nights at the Hall's End

  **I**  
  The quiet presses, deep and full.  
  The only sound's the night's low call.  
  Down at the hall end, sharp and bright,  
  A door swings open, spilling light.  
  A figure stands within the door.  
  It pauses there, upon the floor,  
  Then shifts its weight from foot to foot,  
  As if to see what burdens put.

  **II**  
  The quiet presses, deep and full.  
  The only sound's the night's low call.  
  Down at the hall end, sharp and bright,  
  A door swings open, spilling light.  
  A figure stands within the door.  
  It pauses there, upon the floor,  
  Then shifts its weight from foot to foot,  
  As if to see what burdens put.

  The hallway bulb had burned black the prior week,  
  Leaving the dark complete.

  ---

  **Explanation:** Octave I depicts the veridical perception. The couplet settles it: the hallway bulb being burned out before the second night (II) means the described light *could not* have been present then, making II the illusion. The cause (burned bulb) lies wholly outside the moment of experience.
