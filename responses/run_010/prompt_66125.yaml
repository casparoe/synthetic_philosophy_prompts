answer: |-
  ### Examination Question: Interactive Epistemology  
  **Time Allowed:** 50 minutes  
  **Marks:** 25  

  ---

  **Scenario**  
  Ada and Bo are statisticians at the same medicines regulator. Let \(E\) be the claim that a newly licensed drug reduces ninety-day mortality. Each has analysed a different trial: Ada’s posterior for \(E\) is 0.8, Bo’s is 0.35. Both figures appear in a joint report signed by them, so each knows the other’s figure, each knows the other knows it, and so on without limit. Each regards the other as fully rational and as a Bayesian who conditions on her or his own data. Neither budges.  

  When asked whether this is a counterexample to Aumann’s agreement theorem, Ada replies that it cannot be, since they had different data, and the theorem only rules out disagreement unexplained by differences in information. Pressed further, both agree that before either saw data, each would have assigned 0.6 to \(E\), that each knows the other would have, and that this is common knowledge. Bo concludes: ‘That is our common prior. So every premise of the theorem holds and yet we disagree. The theorem must be false.’  

  ---

  **Answer all three parts.**  

  (a) Assess Ada’s reply and Bo’s conclusion. Identify precisely what each gets right and what each gets wrong. State which premise(s) of Aumann’s theorem the case strains.  
  *(8 marks)*  

  (b) Decide whether the ex ante agreement on 0.6 supplies a common prior in the sense the theorem requires. Distinguish agreement on a single number for one proposition from sharing a prior over a state space. Address what else would need to be true for this counterfactual to support Bo’s argument.  
  *(9 marks)*  

  (c) Examine the status of the common prior assumption. If a common prior is read counterfactually (as a belief state no agent ever occupied), what would count as evidence that it fails to hold? What follows for using the theorem to argue that persisting disagreement between epistemic peers is irrational?  
  *(8 marks)*  

  ---

  ### Model Answer (≈900 words)  
  **(a)** Ada is correct that Aumann’s theorem permits disagreement when agents have different private information. The theorem requires common knowledge of posteriors but allows divergent updating from distinct data. Her reply rightly notes that the theorem’s purpose is to show that *common knowledge of disagreement* cannot persist if agents share a common prior and partition structure. However, she overlooks that Bo’s challenge targets the common prior assumption itself.  

  Bo errs fundamentally. His conclusion that the theorem is false misattributes their disagreement to a flaw in the theorem rather than a failure of its premises. Crucially, he conflates agreement on a *single probability value for one event* (\(P(E) = 0.6\)) with a *common prior over a full state space*. The theorem demands a shared prior probability distribution over all possible states of the world (which encode both \(E\) and the agents’ information partitions). Bo’s "common prior" is merely a marginal probability for \(E\), insufficient to guarantee agreement under updating. The case strains the common prior assumption: it reveals that ex ante agreement on \(E\) alone does not ensure the prior embeds consistent beliefs about *how data relates to \(E\)*.  

  **(b)** The ex ante agreement on 0.6 does **not** constitute a common prior in the theorem’s sense. A common prior must be a shared probability distribution over a state space \(\Omega\), where states specify: (i) whether \(E\) holds, and (ii) the data each agent observes. Agreement on \(P(E) = 0.6\) is merely consensus on the prior probability of a single event. It does not imply that Ada and Bo share beliefs about the *conditional probabilities* \(P(E|\text{data}_\text{Ada})\) or \(P(E|\text{data}_\text{Bo})\), or about the likelihood of observing specific data given \(E\).  

  For the counterfactual "prior" to support Bo’s argument, three additional conditions must hold:  
  1. **Shared model of data generation**: Both must agree on \(P(\text{data}_\text{Ada} | E)\) and \(P(\text{data}_\text{Bo} | E)\).  
  2. **Common knowledge of partitions**: The state space must encode all possible data pairs, and agents’ partitions (refining who knows what) must be common knowledge.  
  3. **Consistent updating**: The posterior disagreement must arise *only* from conditioning this full prior on mutually exclusive data.  

  Here, Ada and Bo’s posteriors (0.8 and 0.35) imply conflicting interpretations of their data’s significance. If they truly shared a common prior over \(\Omega\), Bayes’ theorem would ensure their posteriors reflect consistent conditioning. Their disagreement suggests their implicit models for how data relates to \(E\) differ—meaning no common prior exists over a sufficiently rich state space.  

  **(c)** Treating the common prior as a counterfactual ("what we would have believed") renders it empirically unfalsifiable in isolation. Evidence for its failure includes:  
  - **Systematic prior-posterior divergence**: If agents *always* develop irreconcilable posteriors despite common knowledge of rationality and overlapping data, this suggests their belief structures (e.g., likelihoods) are fundamentally incompatible.  
  - **Inconsistency in meta-beliefs**: If Ada and Bo disagree on \(P(\text{Bo's data} | E)\) even after dialogue, this indicates deeper discord than differing data can explain.  

  For Aumann’s theorem to critique persistent peer disagreement as irrational, the common prior must be more than a notional agreement on marginal probabilities. It requires that agents pre-commit to a shared, exhaustive model of uncertainty. In practice, this is an idealisation: real agents may have incommensurable models of evidence due to differing background assumptions (e.g., trial design biases).  

  The theorem remains a powerful argument *if* we assume a common prior over a state space embedding all relevant information. However, Bo’s fallacious use of it—mistaking fragmentary counterfactual agreement for a full prior—exposes a vulnerability. When peers persistently disagree, the rational response is not to invoke the theorem dogmatically but to scrutinise whether they truly share a common framework for interpreting evidence. If not, their disagreement may reflect legitimate epistemological diversity rather than irrationality.  

  ---

  ### Marking Scheme (Total: 25 marks)  
  **First-class discriminators** (Awarded for insights beyond standard analysis):  
  - **(a)** Identifying that Bo’s error lies in *reducing the prior to a single value* rather than a full distribution.  
  - **(b)** Explicitly stating that agreement on \(P(E)\) does not imply agreement on \(P(E|\text{data})\) or likelihoods.  
  - **(c)** Arguing that counterfactual priors are unfalsifiable without presupposing shared likelihoods.  

  **Penalisable errors** (Deduct marks as specified):  
  1. **Stating the theorem is false** (e.g., endorsing Bo’s conclusion): **–4 marks**  
  2. **Rehearsing Aumann’s proof/statement without engaging the scenario**: **Cap at 50% for part** (e.g., 4/8 for (a)).  
  3. **Treating 0.6 as sufficient common prior**: **–3 marks per occurrence** (e.g., in (a) or (b)).  
  4. **Ignoring the state space requirement** (e.g., not distinguishing single-probability from full distribution): **–2 marks per part**.  
  5. **Arguing disagreement implies irrationality without addressing prior scope**: **–2 marks in (c)**.  

  **Part-specific mark allocation**:  
  - **(a) 8 marks**: Ada correct on data explaining disagreement (3), Bo wrong on theorem’s falsity (3), correct premise strained (common prior) (2).  
  - **(b) 9 marks**: Distinction single number vs. full prior (4), additional conditions for valid prior (3), application to case (2).  
  - **(c) 8 marks**: Evidence for prior failure (3), implications for irrationality argument (3), counterfactual status (2).  

  ---  
  **END OF PAPER**
