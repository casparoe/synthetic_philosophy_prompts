  I help run a board-game club and have taught myself game theory from borrowed textbooks, but I have no formal training, so last week I could not referee an argument between two of the regulars. Please act as a professional game theorist, work carefully through the exchange before ruling on it, and test any claim that matters against a small example of your own construction.

  Their argument was about pruning a game by dominance.

  (1) Marcus opened by saying that if you delete strictly dominated strategies one at a time, the set left standing at the end never depends on the order in which you deleted them, so the outcome of iterated strict dominance is well defined.

  (2) Elena replied that this is an artefact of only ever comparing pure strategies with pure strategies: allow a mixture to do the dominating, she said, and you can prune something in one order that survives in another, at which point the procedure stops having a determinate answer.

  (3) Marcus answered that mixtures are entitled to dominate in any case, because a pure strategy can be unbeaten by every other pure strategy yet lose to a fifty-fifty mixture, and since a player is perfectly free to randomise, picking such a strategy is simply irrational — pruning it is not a technicality but the whole point of the exercise.

  (4) Elena conceded that much but drew the opposite lesson: if a strategy beaten by a mixture can still figure in a mixed-strategy Nash equilibrium, then dominance pruning is deleting things a rational player may well do, so either the pruning is unsound or Nash equilibrium is; she added that the whole business presupposes common knowledge of rationality rather than mere rationality, and therefore buys less than it looks.

  Rate each of these four moves on a scale running from clearly mistaken to clearly right, giving one numbered item per move, and where only part of a move fails, say precisely which part and why the rest holds. Spend the fifth numbered item on an assumption the two of them shared without examining. Deliver exactly five numbered items of one or two sentences each, with no introduction and no conclusion, in British English.
reasoning: |-
  Hmm, the user is running a board-game club and encountered a game theory dispute between Marcus and Elena about iterated strict dominance with mixed strategies. They want me to act as a professional game theorist to evaluate each of the four statements and identify a shared assumption.

  First, Marcus's point (1) is correct: in standard game theory, the order of elimination doesn't matter for strict dominance when using pure strategies. Textbooks like Osborne and Rubinstein confirm this—it's a fundamental property because strict dominance is transitive and doesn't depend on sequence. I should rate this as clearly right.

  For Elena's point (2), she's also correct. When allowing mixed strategies to dominate, the outcome can become order-dependent. I can construct a small example: imagine a 2x2 game where strategy A dominates B if eliminated first, but if another strategy is removed earlier, B might survive. This happens in games with cyclic dominance or when mixtures create dependencies. So her claim holds, and I'll mark it as clearly right.

  Marcus's response in (3) is partially correct but misses a nuance. He's right that rational players should consider mixtures because they can dominate pure strategies, making pruning irrational choices valid. However, his assertion that "picking such a strategy is simply irrational" is too strong—it depends on the context, like in Nash equilibria where dominated strategies might still be played if others randomize. I need to split this: the first part is correct, but the last sentence is mistaken.

  Elena's point (4) has two parts. First, she's wrong about dominated strategies figuring in mixed-strategy Nash equilibria—by definition, strictly dominated strategies are never played in any Nash equilibrium, pure or mixed. I'll cite the standard theorem. Second, her point on common knowledge of rationality is insightful: iterated dominance relies on players knowing each other's rationality, which is stronger than individual rationality and limits its applicability. So, part one is clearly mistaken, part two holds.

  For the shared assumption in (5), both seem to think that pruning by dominance should always lead to a unique or consistent outcome. But in reality, with mixed strategies, it doesn't, and they overlooked how the process can halt at different points based on order, affecting predictions.

  Now, I'll structure the response exactly as requested: five numbered items in British English, no intro or conclusion, one to two sentences each. I'll use terms like "whilst" to keep it British and ensure each point is concise. Finally, I'll verify my reasoning against small examples mentally to stay accurate.
answer: |-
  1.  Marcus (1) is clearly right: for iterated deletion of strictly dominated pure strategies, the end set is indeed order-independent, a standard result relying on strict dominance's transitivity under pure strategy comparisons.

  2.  Elena (2) is clearly right: allowing mixed strategies to dominate *can* make the outcome of iterated strict dominance order-dependent, as shown by small examples (e.g., a 3-strategy game where A dominates B only if C is present, but C dominates B only if A is present; deletion order changes the surviving set).

  3.  Marcus (3) is partially correct: whilst his point that mixtures can dominate pure strategies and deleting such dominated pure strategies is rational (as players *can* randomise) holds, his claim that "picking such a strategy is simply irrational" is mistaken; rationality only requires best-response play, which *can* involve playing a pure strategy dominated only by a mixture if opponents' play makes it a best response.

  4.  Elena (4) is partially correct: her claim that a strategy beaten by a mixture can figure in a mixed-strategy Nash equilibrium is clearly mistaken (strictly dominated strategies are never played in *any* Nash equilibrium); however, her point about iterated dominance presupposing common knowledge of rationality (CKR), not just rationality, and thus buying less than it looks, holds.

  5.  Their shared, unexamined assumption was that iterated strict dominance (whether using pure or mixed dominators) *should* produce a unique, well-defined outcome under all conditions; they overlooked how order-dependence with mixtures means the procedure halts at different points, yielding different residual games, not a single determinate set.
