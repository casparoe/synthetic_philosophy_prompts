prompt: |-
  I direct institutional research at a public university, and my office fields roughly a dozen program evaluations a term — first-year seminars, tutoring, bridge programs, advising models — each comparing outcomes for students who participated against students who did not. Nearly all of them arrive with a headline number that reverses direction once a committee breaks it down by something: entering GPA band, prior credits, Pell status, transfer versus first-time enrollment. I have about an hour per evaluation, the committee is mostly non-statisticians, and the recommendation that comes out of this can close a program.

  Write a decision procedure my analysts can run on any such comparison: the questions in order, what counts as a sufficient answer to each, the point at which a reversal can be declared an artifact of unequal composition across the groups rather than evidence about the program, and the points where the procedure must stop and hand the decision to a person because the remaining question is about which quantity the decision ought to turn on. It has to cover the case where the variable the committee wants to condition on is itself produced by participation, and it should mark explicitly which steps are judgment calls dressed as procedure.

  Then run it on three cases: (a) a first-year seminar whose participants graduate at higher rates overall but lower rates than non-participants within every GPA band — the one where I have already told the provost the seminar works; (b) a tutoring program whose entire aggregate advantage comes from a thirty-person transfer-student cell that disappears under every other partition; (c) an advising redesign the committee wants evaluated by splitting on whether students declared a major within a year, when accelerating declaration is one of the program's stated aims. Close by stating what no data my office can collect would settle. Under 900 words.
reasoning: |-
  Hmm, the user is directing institutional research at a public university and needs a decision procedure for program evaluations. They're dealing with about a dozen evaluations per term where initial findings often reverse when controlling for variables like GPA or Pell status. With limited time per evaluation (about an hour) and a committee of non-statisticians, they need a standardized method to determine when reversals indicate actual program effects versus composition artifacts.

  Key requirements include:
  - Handling cases where conditioning variables might be program outputs
  - Marking judgment calls disguised as procedure
  - Covering three specific scenarios they provided
  - Staying under 900 words

  The user seems frustrated by having previously told the provost a first-year seminar works despite reversed findings within GPA bands. There's clear pressure since these evaluations can lead to program closures.

  I'll develop a 7-step decision procedure with clear checkpoints:
  1. Confirm group definition validity
  2. Check baseline equivalence
  3. Identify reversal triggers
  4. Test for conditioning variable endogeneity
  5. Detect omitted partitions
  6. Determine effect heterogeneity
  7. Make final recommendation

  Crucially, I'll mark steps involving judgment (Steps 1, 3, 5, 6) and build in stopping points where human decisions are needed. The procedure must handle cases like their advising example where the conditioning variable (major declaration) is a program outcome.

  For their three cases:
  (a) First-year seminar: I'll show how the reversal indicates Simpson's Paradox, requiring judgment about whether institutional preferences favor equity or efficiency
  (b) Tutoring program: I'll demonstrate how the vanishing transfer-student effect flags composition bias
  (c) Advising redesign: I'll highlight the endogeneity trap when conditioning on program outputs

  I'll conclude by noting fundamental limitations - data can't determine institutional values or whether omitted variables still lurk after adjustments. The analysis must stay under 900 words while covering all critical aspects.
answer: |-
  Here is a decision procedure for your analysts, followed by the case analyses. The procedure focuses on identifying composition bias versus true effects and flags key judgment points.

  **Program Evaluation Decision Procedure**

  1.  **Question:** Are the "Participant" and "Non-Participant" groups defined unambiguously? (e.g., who *could* participate vs. who *did*; mandatory vs. optional programs).
      *   *Sufficient Answer:* Clear operational definition exists for group assignment rules.
      *   *Stop if:* Ambiguity exists (e.g., self-selection bias inherent in opt-in programs). Judgment needed on defining comparable groups.
      *   *Judgment Call:* Defining the valid counterfactual group.

  2.  **Question:** Are the groups comparable on key pre-program observables likely to influence the outcome *and* participation? (e.g., entering GPA, credits, Pell, enrollment type).
      *   *Sufficient Answer:* Statistical tests (t-test, chi-square, SMD < 0.1) show no significant imbalance on core variables OR documented assignment rules ensure equivalence (e.g., random assignment).
      *   *Reversal Declared Artifact Here If:* Significant aggregate advantage/disadvantage **disappears or reverses** after adjusting for *pre-program* characteristics in a simple stratified analysis or regression, *and* those characteristics predict both participation and outcome. This strongly suggests the aggregate effect was driven by group composition. Proceed to Step 4 only if effect persists.
      *   *Stop if:* Key pre-program data is missing/unreliable. Judgment needed on validity of comparison.

  3.  **Question:** What specific partitioning (e.g., GPA band, Pell status) triggers the reversal of the aggregate finding?
      *   *Sufficient Answer:* Identify the variable(s) where conditioning flips the sign/direction of the effect.
      *   *Judgment Call:* Choosing which partitions the committee focuses on (often driven by policy interests, not pure stats). Analyst must note if reversal occurs under *multiple plausible* partitions.

  4.  **Question: (CRITICAL)** Could the partitioning variable itself be *influenced* by program participation? (e.g., participation changes GPA, credit completion, major declaration timing).
      *   *Sufficient Answer:* Evidence that the variable is measured *before* program start (not influenced) OR evidence/strong rationale it is measured *after* and could be affected.
      *   *Reversal Declared Artifact Here If:* The reversal-triggering variable is *post-program* AND logically could be an outcome of the program. Conditioning on it introduces bias (e.g., collider bias, over-control). The aggregate effect is more credible. **Stop.** Human judgment required on interpreting the aggregate effect given this endogeneity.
      *   *Judgment Call:* Assessing plausibility and timing of variable influence.

  5.  **Question:** Does the effect, positive or negative, hold consistently across *all* major subgroups defined by the reversal-triggering variable? Or is it driven by one specific cell?
      *   *Sufficient Answer:* Effect direction and significance assessed within each stratum/cell of the partition.
      *   *Reversal Declared Artifact Here If:* A *single, small cell* drives the entire aggregate effect (especially if that cell is <5% of participants or non-participants). This suggests instability or composition quirk, not robust program impact. Proceed to Step 6 only if effect is consistent or meaningfully heterogeneous.
      *   *Judgment Call:* Defining "small cell" (sample size threshold) and "consistent" effect (direction vs. significance).

  6.  **Question:** Is the heterogeneity (variation in effect size across subgroups) statistically significant and large enough to be practically meaningful?
      *   *Sufficient Answer:* Formal test of interaction (e.g., in regression) is significant (p<0.05) AND effect sizes differ substantially (e.g., >X% points, defined by context).
      *   *Stop/Handoff Point:* **Always.** If heterogeneity is confirmed (Step 5 + 6), the decision *must* go to humans (committee/leadership). The question is no longer "Does the program work?" but "*For whom* does it work best/worst, and is that alignment with our goals/resources?" The data shows differential impact; humans decide policy weight.

  7.  **Recommendation Synthesis:**
      *   If reversal due to *pre-program* composition (Step 2): Report "No reliable evidence of program effect; aggregate result driven by group differences." Caution against closure if composition bias *masked* a true positive effect.
      *   If reversal due to *post-program* conditioning (Step 4): Report "Aggregate effect likely valid; subgroup reversal likely due to conditioning on a program-influenced variable." Support aggregate finding.
      *   If single-cell drive (Step 5): Report "Aggregate effect driven by a small, specific subgroup; not generalizable evidence of program impact." Lean towards artifact.
      *   If confirmed heterogeneity (Step 6): Report "Program effect varies significantly by [subgroup]. Decision requires weighing differential impacts against institutional priorities." Hand off.

  **Case Analyses**

  *   **(a) First-Year Seminar (Higher overall grad rate, lower within every GPA band):**
      1.  Groups defined? (Likely opt-in, self-selection probable - *Judgment*)
      2.  Pre-program comparability? GPA bands are *pre-program*. **Reversal Declared Artifact.** Aggregate advantage reversed by conditioning on pre-program GPA. This is classic Simpson's Paradox. The seminar attracts higher-GPA students who naturally graduate more, masking a potentially negative effect within bands. Your initial advice to the Provost needs revisiting. *Handoff:* Humans must decide if running a program that *attracts* high performers but might *slightly harm* their outcomes (or benefit low performers less than non-participation helps them) is acceptable, given the *net* positive.
  *   **(b) Tutoring Program (Aggregate advantage from small transfer-student cell):**
      1.  Groups defined? (Likely opt-in - *Judgment*)
      2.  Pre-program comparability? Check transfer status (pre-program). **Reversal Declared Artifact.** Aggregate advantage disappears under partitioning. **Reconfirmed Artifact at Step 5.** The entire effect relies on one small cell (<30 students). This is unstable and likely a random fluctuation or composition quirk specific to that tiny transfer cohort. No reliable evidence the tutoring program caused the aggregate advantage. Recommendation: Likely an artifact, weak evidence for program impact.
  *   **(c) Advising Redesign (Committee wants split by "Declared Major within 1 Year"):**
      1.  Groups defined? (Assumed clear - proceed)
      2.  Pre-program comparability? Check standard variables (GPA, credits, etc.). Assume aggregate effect exists.
      3.  Reversal Trigger? "Declared within 1 year" is the partition.
      4.  **Is the partition influenced by participation? YES.** Accelerating declaration is a *stated program aim*. Conditioning on this outcome variable introduces severe bias. **Reversal Declared Artifact Here.** Any reversal (or strengthening) seen after this split is unreliable due to endogeneity. The aggregate effect is the more valid estimate of impact. *Handoff:* Not needed for heterogeneity. Report supports the aggregate finding; subgroup analysis by declaration timing is invalid for causal inference on graduation/etc.

  **What No Data Can Settle:**

  1.  **Institutional Values & Priorities:** Data can show differential impacts, but humans must decide if favoring Group A over Group B aligns with mission/equity goals (e.g., Case A).
  2.  **Resource Allocation Trade-offs:** Data might show a small positive effect for a costly program. Humans must judge if the benefit justifies the cost relative to alternatives.
  3.  **The "Right" Counterfactual:** For non-randomized programs, defining the true non-participant group involves judgment about selection mechanisms that data alone cannot perfectly capture.
  4.  **Omitted Variable Bias:** No dataset contains *all* relevant pre-program characteristics. Judgment is always needed on whether key confounders are missing.
  5.  **Practical Significance vs. Statistical Significance:** Is a small, statistically significant effect meaningful enough to act upon? Judgment call.
