  We are given a paragraph from a magazine article about bias in criminal risk assessment algorithms. The paragraph discusses an "impossibility theorem" in algorithmic fairness, claiming that no risk algorithm can be fair to two groups (Black and white defendants) simultaneously when base rates differ. It also asserts that calibration (a technical term) forces the algorithm to have more false alarms for the group with the higher base rate, and that this leads to the conclusion that fairness and accuracy are mathematically incompatible, hence the recommendation to abandon such risk scores.

  As an expert in algorithmic fairness, I will first recall the relevant impossibility results. The most famous one is due to Kleinberg, Mullainathan, and Raghavan (2016) and was independently discovered by Chouldechova (2017). It shows that three desirable fairness criteria cannot be satisfied simultaneously except in degenerate cases. The three criteria are:

  1. **Calibration** (also called calibration by group): For any predicted risk score, the actual proportion of individuals who reoffend should be the same for each group and equal to the predicted score. In the context of the paragraph: a Black defendant and a white defendant assigned the same score have the same probability of reoffending.

  2. **Balance in False Positive Rates (FPR)** (also called predictive equality): The probability of a false alarm (i.e., flagging a non-reoffender as high-risk) should be the same for both groups.

  3. **Balance in False Negative Rates (FNR)**: The probability of a false negative (i.e., failing to flag a reoffender) should be the same for both groups.

  The impossibility theorem states that if the base rates (the actual reoffending rates) of the two groups are different, then it is mathematically impossible for all three conditions to hold simultaneously. The only exception is when the algorithm is perfect (which is impossible in practice) or when the base rates are equal.

  Now, the paragraph in question focuses on two of these: calibration and the false positive rate (which it calls "false alarms"). It claims that calibration forces the algorithm to have more false alarms in the group with the higher base rate. Let's break this down.

  First, note that the paragraph does not mention the false negative rate condition. The impossibility theorem requires three conditions, but the paragraph only discusses two: calibration and false positive rate balance. However, the claim that calibration forces a particular disparity in false positive rates is a consequence of the base rate difference and the calibration condition.

  Let me explain:

  Assume we have two groups: Group A (say, Black defendants) and Group B (white defendants). Let the base rate (reoffending rate) of Group A be higher than that of Group B. Now, suppose we have a risk algorithm that is calibrated. Then, for any risk score `s`, the proportion of reoffenders among those assigned `s` is `s` and is the same for both groups.

  Now, the false positive rate (FPR) for a group is the probability that a non-reoffender in that group is classified as high-risk. Typically, we set a threshold (say, 0.5) to decide "high-risk". But note: the theorem does not require a specific threshold. However, the argument about the false positive rate disparity holds when we consider the entire distribution of scores.

  But the paragraph makes a specific claim about false alarms. Let me state a key result:

  If the algorithm is calibrated and the base rates are different, then the false positive rates (FPR) and false negative rates (FNR) must also differ between the groups. Specifically, the group with the higher base rate must have a higher false positive rate. Why?

  Consider the following:

  - Let `p_A` and `p_B` be the base rates for Group A and Group B, respectively, and assume `p_A > p_B`.
  - Because the algorithm is calibrated, the overall predicted risk for Group A must be `p_A` and for Group B must be `p_B` (by the law of total expectation). That is, the average predicted risk for Group A is higher than for Group B.

  Now, consider the false positive rate. A false positive occurs when a non-reoffender is classified as high-risk. To compute FPR, we need to set a threshold. However, without a threshold, we can think in terms of the entire distribution. But the paragraph is implicitly assuming a fixed threshold. Let me assume that we set a threshold `t` to define "high-risk". Then:

  - The false positive rate for Group A: `FPR_A(t) = P(score >= t | non-reoffender, Group A)`
  - Similarly for Group B: `FPR_B(t) = P(score >= t | non-reoffender, Group B)`

  It can be shown (via the properties of calibration and the base rate difference) that if we choose a threshold such that the proportion of high-risk classifications is the same in both groups (i.e., satisfy another fairness criterion called demographic parity), then the group with the higher base rate will have a higher false positive rate. However, the paragraph does not mention demographic parity.

  But note: the claim in the paragraph is that calibration forces the algorithm to hand out more false alarms to the group with the higher base rate. This is true under the condition that the algorithm is calibrated and the base rates differ. In fact, without any additional constraint, it is possible to have calibration and then set thresholds arbitrarily. However, the paragraph is likely assuming that the threshold is chosen to achieve the same overall classification rate or to optimize accuracy. But the mathematics shows that even without that, if we require the same threshold for both groups (which is typical in practice), then the group with the higher base rate will have a higher false positive rate.

  Let me recall a precise result from Chouldechova (2017):

  Under calibration and base rate disparity (`p_A != p_B`), we have:

  - The false positive rate (FPR) for the higher base rate group must be greater than the FPR for the lower base rate group.
  - The false negative rate (FNR) for the lower base rate group must be greater than the FNR for the higher base rate group.

  This is a mathematical necessity. So the claim in the paragraph is correct: if the base rates are different and the algorithm is calibrated, then the group with the higher base rate will have more false positives (false alarms).

  Now, let's break down the paragraph sentence by sentence.

  > "A few years ago, after an investigation found that a commercial recidivism score used in American courts flagged Black defendants as high-risk at roughly twice the rate of white defendants who went on to reoffend, mathematicians proved something remarkable: this is not a bug that better data or better code could fix."

  This is a defensible simplification. The impossibility result does show that under base rate disparity, we cannot achieve all three fairness criteria. However, note that the investigation found a disparity in the rate of being flagged as high-risk between Black and white defendants. The impossibility result does not directly address that specific disparity. The disparity in flagging rates (if it means the proportion classified as high-risk) could be due to base rate differences. But the paragraph is setting the stage for the theorem. The key point is that the theorem shows that some form of disparity is inevitable. So it's a defensible lead-in.

  > "There is a formal impossibility theorem showing that no risk algorithm can be fair to both groups at the same time."

  This is misleading. It suggests that there is no way to be fair at all. But the impossibility theorem is about satisfying three specific criteria simultaneously. There are many definitions of fairness, and it is possible to satisfy one or two of them. Also, note that the theorem requires that the base rates are different. If base rates were equal, then all three criteria could be satisfied. Moreover, the theorem does not say that no fairness notion can be satisfied; it only says that these three cannot. So the statement is too broad.

  > "The tool was calibrated, which means the score was equally accurate for members of both groups — a Black defendant and a white defendant assigned the same score had the same probability of reoffending."

  This is accurate. Calibration by group means exactly that: for any given score, the actual reoffending rate is the same for both groups and equals the score. The phrase "equally accurate" is a bit vague, but in context, it is referring to calibration. However, note that calibration is about the accuracy of the risk score as a probability, not about error rates (like false positives). So it's a specific kind of accuracy.

  > "But once groups differ in their underlying base rates, calibration arithmetically forces the algorithm to hand out more false alarms to the group with the higher base rate."

  This is accurate. As explained above, under calibration and base rate disparity, the group with the higher base rate must have a higher false positive rate (if we use the same threshold for both groups). The term "false alarms" is non-technical for false positives.

  > "That is not a defect of this particular instrument; it is a theorem."

  This is defensible. The result is a mathematical theorem. However, note that the theorem does not say that every calibrated algorithm must have this disparity; it says that if the base rates differ and we have calibration, then the false positive rates must differ in that way. But the instrument being calibrated and having base rate disparity is the condition. So it's a consequence of the mathematics.

  > "What the impossibility result really establishes, then, is that fairness and accuracy are mathematically incompatible,"

  This is misleading and arguably false. The impossibility result is about the incompatibility of three fairness criteria. It does not say that fairness and accuracy are incompatible. In fact, calibration is a form of accuracy (it requires that the predicted probabilities match the actual probabilities). The other two criteria (balance in FPR and FNR) are about fairness. The theorem shows that we cannot have both calibration (which is a form of accuracy) and the two fairness criteria (balance in FPR and FNR) at the same time. But note: calibration is both an accuracy and a fairness criterion (it is sometimes called "fairness through calibration"). So the paragraph is equating "fairness" with the two error rate balances and "accuracy" with calibration. But that is not standard. Accuracy in machine learning usually refers to overall correctness (like accuracy rate, AUC, etc.), not calibration. Moreover, it is possible to have an algorithm that is accurate (in the sense of high AUC) and satisfies one or two fairness criteria. The incompatibility is among the three specific criteria.

  > "and the only intellectually honest response is to stop using risk scores in sentencing altogether, since no version of them can avoid being unjust."

  This is a policy recommendation and is not a direct mathematical consequence. The theorem does not show that every possible risk score is unjust; it shows that we cannot satisfy all three fairness criteria at once. But we might choose to satisfy one or two. Moreover, the choice of which fairness criteria to prioritize is normative. The paragraph assumes that any disparity in false positive rates (for example) is unjust. That is a normative judgment. The theorem does not say that any algorithm must be unjust; it says that it cannot satisfy all three criteria. So the step from the theorem to the policy recommendation is not licensed by the mathematics alone.

  Now, to address the three explicit questions:

  1. **Is the impossibility unconditional?** No, it depends on the base rates being different. If base rates were equal, then all three conditions could be satisfied. The paragraph does mention base rate differences, so it does state the condition. However, the paragraph does not mention that the impossibility is among three specific criteria.

  2. **Does calibration entail a fixed direction of error-rate disparity?** Yes, the theorems do fix the direction: the group with the higher base rate will have a higher false positive rate and a lower false negative rate. So the paragraph is correct on that.

  3. **Is the slide from "these fairness criteria cannot all be satisfied together" to "fairness and accuracy are mathematically incompatible" licensed?** Not without qualification. The incompatibility is between three specific criteria. The paragraph redefines "fairness" as the two error rate balances and "accuracy" as calibration. But in standard terms, calibration is a form of both accuracy and fairness. Moreover, other notions of fairness (like demographic parity or equal opportunity) might be compatible with accuracy. The slide is an oversimplification.

  **Which conclusions survive?** The mathematical core survives: if base rates differ, then we cannot have an algorithm that is calibrated and has equal false positive rates and equal false negative rates. The consequence that calibration forces a higher false positive rate on the group with the higher base rate also survives. However, the claim that fairness and accuracy are incompatible in general is not supported. The policy recommendation to abandon risk scores does not follow from the theorem alone because:

  - We might decide to use an algorithm that satisfies one or two of the criteria and accept the trade-off.
  - The choice of which fairness criteria to prioritize is a normative question. The theorem does not tell us which criteria to drop.

  A scholar of the literature would say that the theorems settle the mathematical incompatibility of the three criteria under base rate disparity, but they do not settle the normative question of which criteria to prioritize. They also do not show that every risk score is inherently unfair; they show that we must make a trade-off.

  **Revised Paragraph:**

  I will rewrite the paragraph to be accurate while preserving the rhetorical force. Changes are made to be precise about the conditions and the nature of the impossibility.

  > "A few years ago, after an investigation found that a commercial recidivism score used in American courts flagged Black defendants as high-risk at roughly twice the rate of white defendants who went on to reoffend, mathematicians proved something remarkable: under conditions of unequal base rates, this kind of disparity in error rates is not a bug that better data or better code could fix. There is a formal impossibility theorem showing that no risk algorithm can simultaneously satisfy three common fairness criteria: calibration (which means the score is equally accurate as a probability for both groups), equal false positive rates, and equal false negative rates. The tool in question was calibrated, meaning that a Black defendant and a white defendant assigned the same score had the same probability of reoffending. But once groups differ in their underlying base rates, calibration forces the algorithm to hand out more false alarms to the group with the higher base rate. That is not a defect of this particular instrument; it is a mathematical necessity. What the impossibility result really establishes, then, is that in the presence of base rate differences, we must choose among competing fairness and accuracy goals. Given that any choice will leave some disparity, many scholars and advocates argue that the only just response is to stop using risk scores in sentencing altogether."

  **Explanation of Changes:**

  1. I clarified that the impossibility theorem requires three specific fairness criteria and depends on unequal base rates.
  2. I explicitly named the three criteria to avoid overgeneralizing "fairness".
  3. I replaced "fairness and accuracy are mathematically incompatible" with a statement about having to choose among competing goals. This is more accurate because the theorem is about a trade-off among the three criteria, not a blanket incompatibility between fairness and accuracy.
  4. I softened the policy recommendation to reflect that it is an argument made by "many scholars and advocates" rather than a direct implication of the theorem.

  This revised version maintains the critical stance toward risk scores but is more precise about what the mathematics shows.
answer: |-
  ### Accuracy Audit of the Magazine Paragraph on Algorithmic Fairness

  As an expert in algorithmic fairness, I will first outline the key technical concepts and impossibility results relevant to this paragraph. This foundation ensures clarity for a reader without a statistics background. I'll define each term when first used.

  **Background: Key Concepts and Impossibility Theorems**  
  The paragraph references a famous impossibility theorem in algorithmic fairness, primarily based on work by Kleinberg, Mullainathan, and Raghavan (2017) and Chouldechova (2017). Here's a simplified breakdown:

  - **Base rate**: The actual rate of reoffending in a group (e.g., if 40% of Black defendants reoffend, their base rate is 0.4).  
  - **Calibration (or calibration by group)**: When a risk score accurately predicts reoffending probabilities for all groups. For example, if 100 people (across groups) receive a score of 0.6, 60 should reoffend. The paragraph correctly defines this: identical scores imply identical reoffending probabilities across groups.  
  - **False alarms (false positives)**: When a non-reoffender is incorrectly flagged as "high-risk."  
  - **False negatives**: When a reoffender is incorrectly labeled "low-risk."  
  - **Fairness criteria**: The impossibility theorem involves three criteria:  
    1. **Calibration** (as above).  
    2. **Balance in false positive rates (FPR)**: False alarms occur at the same rate for all groups.  
    3. **Balance in false negative rates (FNR)**: False negatives occur at the same rate for all groups.  

  **The Impossibility Theorem**:  
  If two groups have **different base rates** (e.g., Black defendants have a higher reoffending rate than white defendants), it is mathematically impossible for all three fairness criteria to hold simultaneously. The only exceptions are degenerate cases, like a perfectly accurate algorithm (impossible in real-world data) or identical base rates.  

  **Consequence of Calibration under Base Rate Differences**:  
  If an algorithm is calibrated and base rates differ, the group with the higher base rate will necessarily experience a higher false positive rate (more false alarms) and the group with the lower base rate will experience a higher false negative rate. This is a fixed arithmetic consequence, not a flaw in the algorithm.  

  **Trade-offs, Not Absolute Impossibility of Fairness**:  
  The theorem shows that you cannot satisfy all three criteria at once—it does not prove that fairness is universally impossible. For example, you might prioritize calibration and equal false negatives, accepting unequal false positives. The choice among these criteria involves normative (value-based) decisions about what "fairness" means.  

  ---

  ### Sentence-by-Sentence Audit of the Paragraph
  I categorize claims as:  
  - **Accurate**: Correct as stated.  
  - **Defensible simplification**: Loses nuance but doesn’t mislead.  
  - **Misleading**: Asserts more than the mathematics supports.  
  - **False**: Incorrect based on the evidence.  

  1. > *"A few years ago, after an investigation found that a commercial recidivism score used in American courts flagged Black defendants as high-risk at roughly twice the rate of white defendants who went on to reoffend, mathematicians proved something remarkable: this is not a bug that better data or better code could fix."*  
     - **Defensible simplification**.  
       - The investigation (likely referencing ProPublica’s 2016 analysis of COMPAS) observed disparities, but the theorem doesn’t address that specific algorithm. The core claim—that disparities can persist regardless of data/code improvements—is correct under base rate differences. However, it oversimplifies by implying *all* disparities are inevitable. The theorem only guarantees some disparities in the three criteria, not necessarily the exact disparity reported.  

  2. > *"There is a formal impossibility theorem showing that no risk algorithm can be fair to both groups at the same time."*  
     - **Misleading**.  
       - The theorem proves that no algorithm can satisfy **all three fairness criteria** (calibration, equal FPR, equal FNR) under base rate differences. It does *not* show that no fairness is possible. For instance, an algorithm could satisfy calibration and equal FNR (but not equal FPR) and be "fair" by some definitions. The claim overgeneralizes "fairness" as a single concept.  
       - **Correction**: Replace with: "no risk algorithm can satisfy three common fairness criteria simultaneously."  

  3. > *"The tool was calibrated, which means the score was equally accurate for members of both groups — a Black defendant and a white defendant assigned the same score had the same probability of reoffending."*  
     - **Accurate**.  
       - Correctly defines calibration. "Equally accurate" is acceptable here, as calibration ensures scores are equally reliable as probability estimates across groups.  

  4. > *"But once groups differ in their underlying base rates, calibration arithmetically forces the algorithm to hand out more false alarms to the group with the higher base rate."*  
     - **Accurate**.  
       - This is a direct consequence of the theorem. With calibration and differing base rates, the group with the higher base rate *must* have a higher false positive rate (more false alarms). The direction is fixed and unavoidable.  

  5. > *"That is not a defect of this particular instrument; it is a theorem."*  
     - **Defensible simplification**.  
       - The disparity is indeed a mathematical necessity under the stated conditions, not a correctable flaw. It drops that this assumes calibration is maintained—if calibration is abandoned, the disparity might be mitigated (but other issues arise).  

  6. > *"What the impossibility result really establishes, then, is that fairness and accuracy are mathematically incompatible..."*  
     - **Misleading and partially false**.  
       - **Incompatibility?** The theorem shows that **three specific fairness criteria conflict**—not that fairness and accuracy are broadly incompatible. Calibration *is a form of accuracy* (it means scores predict probabilities correctly). The conflict is between calibration (accuracy) and other fairness goals (equal FPR/FNR).  
       - **False implication**: Accuracy (e.g., overall correct predictions) can coexist with some fairness criteria. For example, you could optimize for accuracy while ensuring equal false negative rates.  
       - **Correction**: Replace with: "fairness in error-rate balance (equal false positives and false negatives) is incompatible with calibration (a form of accuracy) under base rate differences."  

  7. > *"...and the only intellectually honest response is to stop using risk scores in sentencing altogether, since no version of them can avoid being unjust."*  
     - **Misleading and unsupported by the theorem**.  
       - The theorem does not prove that all algorithms are "unjust." It shows trade-offs: you can satisfy one or two fairness criteria but not all three. Whether a trade-off (e.g., prioritizing calibration over equal FPR) is "unjust" depends on normative judgments (e.g., is it worse to have more false alarms for one group, or more missed reoffenders?).  
       - **Policy non sequitur**: The theorem does not compel abandoning risk scores. Alternatives include using scores with transparent trade-offs, advocating for societal changes to reduce base rate disparities, or developing context-specific fairness approaches.  

  ---

  ### Addressing Your Specific Questions  
  1. **Is the impossibility unconditional?**  
     No. It depends critically on **differing base rates**. If base rates were equal, all three criteria could be satisfied. The paragraph mentions this condition, but it does not clarify that the impossibility is among three specific criteria.  

  2. **Does calibration force a fixed direction of error-rate disparity?**  
     Yes. With calibration and higher base rates in Group A, Group A will *always* have more false positives (false alarms), and Group B will have more false negatives. The theorems leave no ambiguity in direction.  

  3. **Is "fairness and accuracy are incompatible" a licensed conclusion?**  
     No. The incompatibility is between **calibration (a type of accuracy) and two error-rate fairness criteria**. "Accuracy" broadly defined (e.g., overall prediction quality) is not incompatible with fairness. For example, an algorithm could achieve high accuracy while satisfying demographic parity (a different fairness criterion). The slide misrepresents the result.  

  **What Conclusions Survive?**  
  - The core mathematical result holds: With differing base rates, calibration forces more false alarms on the higher-risk group.  
  - The impossibility of satisfying all three fairness criteria simultaneously is valid.  
  - **The policy recommendation does not survive**: The theorem does not justify abandoning risk scores. It reveals trade-offs that require normative choices (e.g., which fairness criterion to prioritize). Scholars like Solon Barocas and Andrew Selbst emphasize that these trade-offs should be resolved through democratic deliberation, not mathematics alone.  

  ---

  ### Revised Paragraph for Your Memo  
  *"A few years ago, after an investigation found that a commercial recidivism score used in American courts flagged Black defendants as high-risk at roughly twice the rate of white defendants who went on to reoffend, mathematicians proved something remarkable: under conditions of unequal base rates, disparities in error rates are not always fixable by better data or code. A formal impossibility theorem shows that no risk algorithm can simultaneously satisfy three fairness goals: calibration (where identical scores imply identical reoffending probabilities across groups), equal false positive rates, and equal false negative rates. The tool was calibrated, meaning that for the same score, Black and white defendants had the same likelihood of reoffending. But with differing base rates, calibration unavoidably leads to more false alarms for the group with the higher base rate. This is not a flaw in the tool; it is a mathematical inevitability. The result forces a trade-off: we cannot have both calibration and balanced error rates. Given that all algorithms must sacrifice at least one fairness criterion, critics argue that using them in sentencing risks institutionalizing unavoidable injustices—making abandonment the only defensible choice."*  

  **Key Changes and Why**:  
  1. **Clarified the theorem's scope**: Explicitly named the three criteria and the base rate condition to avoid overgeneralizing "fairness."  
  2. **Reframed incompatibility**: Replaced "fairness and accuracy are incompatible" with a precise trade-off between calibration and error-rate balance.  
  3. **Softened policy claim**: Presenting abandonment as a "critics' argument" (grounded in values) rather than a mathematical imperative. This separates the theorem's findings from normative conclusions.  

  Use this analysis to highlight how technical results are often oversimplified in public discourse, and stress that while the mathematics exposes real trade-offs, resolving them requires ethical deliberation—not just code.
