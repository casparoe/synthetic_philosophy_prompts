prompt: |-
  I'm the review editor at a small interdisciplinary journal (public policy, some ethics, some empirical social science) and I sign off on every decision letter, so I read about fifteen referee reports a week and decide which of the considerations inside them actually get to count. It's become a mess. Referees write things like "accept — the identification strategy is clean, and I'd also note the author is early-career at a regional teaching school and this is exactly the kind of work that gets passed over," or "reject — the measure can't bear the causal claim in the abstract, and honestly this whole sub-literature is a fad, one more just entrenches it and takes a slot from someone doing something harder," or "the topic is one our readers have been asking us about for two years." I keep having the feeling that some of these considerations are about the paper and some are really about whether it would be nice for us to think well of the paper, and that mashing them together is what makes decision letters feel dishonest — authors appeal maybe one in ten decisions, and the board only ever sees the letter, so anything in it has to survive being read aloud to the person it rejects. My current rule of thumb for sorting them is broken though. The rule is: about the paper = legitimate, about the author or about what happens after publication = not legitimate. It misfires both directions. "This author has had two papers retracted over data problems" is about the author but I do think it bears on how carefully I should read this submission, and "if this result is right it changes what everyone in the field should believe" is about the paper but somehow feels like it's about consequences too. Somebody at a conference once told me there are at least three competing ways to draw the line here — something about which question the attitude is answering, something about reasons to want to have the attitude, and an object-given versus state-given distinction — and that they don't always give the same verdicts. I don't want a survey of that, and no bibliography or dates or names please, I just want you to pick whichever version of the distinction actually survives being turned into a checklist and tell me what you had to throw away on the way.

  So: write me a reusable procedure, in two registers. One is the referee-facing version, which has to be jargon-free and runnable in about twenty minutes at the end of drafting a report by someone who may be a first-year grad student with no philosophy at all — no terms like "state-given" anywhere in it. The other is my version as editor, which can carry the theory and is what I use when I'm triaging a report that came back messy. For each, give the questions in the order they get asked, what counts as a sufficient answer to each, where the procedure stops cold with "this consideration does not enter," and where it hands the decision up to a human because the remaining question is about the journal's values rather than about the manuscript. Two things I especially want handled. First, quarantining a wrong-kind consideration shouldn't just delete it — some of these considerations are real reasons for somebody to do something, just not for the referee's verdict, so the procedure needs a routing step that says which of these belong to me (scope, mission, what the issue is for, how many slots a subfield gets) and which belong nowhere. Second, referees often state a wrong-kind reason that is a symptom of a right-kind one they can't articulate — "this will be influential" sometimes just means "this is central and true," and sometimes it means "this will be influential." Build in an elicitation step: a short question the editor can send back that would separate those two, and a rule for what to do when the referee doesn't answer it or answers it badly. Flag every step where you're sneakily encoding a contested philosophical view rather than doing neutral bookkeeping, and flag any place where two of the three accounts of the distinction you know would send the same consideration to different destinations.

  Then run it on three real-ish cases. (1) A report that says: recommend minor revisions, the identification strategy in section four is clean and I could not find a hole in it, though I want the board to know the author is early-career at a regional teaching university and we have not published anything on this country in six years. (2) A report that says: reject, "trust" is measured with a single survey item and cannot support the causal claim in the abstract, and separately this sub-literature is a fad and one more of these entrenches it and takes a slot from harder work. (3) The one I suspect will annoy me: a manuscript I personally want to publish, by someone whose work I've admired for years, which I'm confident will get cited alot; the only substantive objection came from a referee I know to be a crank with a grudge against this method, and I cannot actually answer his objection myself — I just know the kind of person he is. Tell me what your procedure does with my desire to overrule him, and whether there is anything at all I'm allowed to do with the fact that he's unreliable, or whether that fact is simply inadmissable and I have to either find a merits-based answer or send it out again. Finish with a short, blunt section on what the procedure cannot do: the cases where it goes quiet, the ones where it will confidently give a bad answer, and the distinction it can't draw no matter how it's written.
reasoning: |-
  We are going to create two versions of a procedure: one for referees (jargon-free, quick) and one for the editor (theoretical, for triage).

  The core idea is to separate considerations that bear on the truth, validity, and scholarly contribution of the work (what we might call "right-kind reasons") from those that are about the consequences of publishing or about the author (often "wrong-kind reasons"). However, as noted, some author-related facts (like retractions) might be relevant to the trustworthiness of the work, and some consequence-related facts (like the paper changing the field) might be a sign of its importance.

  We'll base the procedure on a distinction that is pragmatic and can be operationalized. We'll use the concept of "directly bearing on the scholarly validity and contribution of this specific work" as the core of the right-kind reasons. This avoids some philosophical tangles and can be turned into a checklist.

  We note that the philosophical distinctions (e.g., object-given vs. state-given, or reasons for the attitude vs. reasons for wanting the attitude) are complex and sometimes contested. We'll try to encode a version that is stable enough for a checklist, but we'll flag where we are making a contested choice.

  ## Referee-Facing Procedure (Quick Checklist)

  **Instructions for Referees:** After drafting your report, go through the following questions for each consideration (reason) you mention. The goal is to ensure that the reasons you give for your recommendation are about the paper's scholarly quality and validity. If a reason doesn't pass, it shouldn't be in the report because it might confuse the author or the editor.

  1. **Question 1: Is this about the manuscript itself?**  
     Specifically: Does this reason directly address the truth, validity, or scholarly contribution of the claims, methods, or arguments in this manuscript?  
     - If YES, go to Question 2.  
     - If NO, then this reason does not belong in your report. Instead, if you think it's important, you can put it in a separate note to the editor (e.g., in the "Confidential comments to the editor" section).  

  2. **Question 2: Would this reason still apply if the manuscript were written by a different author, or if it were published in a different journal?**  
     - If YES, then it is about the manuscript and can be included in the report.  
     - If NO, then it does not belong in the report. Put it in the confidential comments if you think the editor should know.  

  **What counts as a sufficient answer?**  
  - For Question 1: The reason must be about the content of the manuscript (e.g., the methods, data, arguments, literature review, clarity, originality).  
  - For Question 2: The reason should not depend on who the author is or where the paper is published.  

  **Where does it stop?**  
  - If the answer to Question 1 is NO, stop: the reason does not enter the report.  
  - If the answer to Question 2 is NO, stop: the reason does not enter the report.  

  **Routing step for wrong-kind reasons:**  
  - If a reason fails Question 1 or 2, it might still be important. Referees are instructed to put such reasons in the confidential comments to the editor. The editor will then sort them (using the editor's procedure).  

  **Elicitation step for ambiguous cases:**  
  - Sometimes a referee might say something like "this will be influential." This could be a symptom of a right-kind reason (the paper is central and true) or a wrong-kind reason (it will be influential regardless of truth).  
  - We add an internal step for the editor: If the editor sees a reason that might be ambiguous (like "influential"), they can send a quick query to the referee: "Could you clarify why you believe this paper will be influential? Is it because of the strength of the evidence and argument, or for other reasons?"  
  - Rule for the editor: If the referee doesn't answer or answers badly (e.g., doesn't connect it to the paper's validity), then the reason is treated as wrong-kind and not used in the decision.  

  ## Editor-Facing Procedure (Triage Version)

  **Instructions for the Editor:** When reading a referee report, evaluate each consideration (reason) given. The goal is to extract only the right-kind reasons for the decision. We define right-kind reasons as those that bear on the *epistemic and scholarly merits* of the manuscript: its truth, validity, rigor, originality, and contribution to knowledge. Wrong-kind reasons are about the consequences of publication, the author, or the journal's mission.

  1. **Question 1: Is the reason about the intrinsic scholarly quality of the manuscript?**  
     - Specifically: Does it bear on the truth, validity, or scholarly contribution of the claims, methods, or arguments in this manuscript?  
     - If YES, go to Question 2.  
     - If NO, then this reason is not admissible for the decision about the manuscript's acceptance. Route it to the appropriate bucket (see below).  

  2. **Question 2: Is the reason agent-neutral?**  
     - Would this reason hold regardless of who the author is or which journal is considering the manuscript?  
     - If YES, then it is admissible.  
     - If NO, then it is not admissible for the decision.  

  **What counts as a sufficient answer?**  
  - Question 1: The reason must be about the manuscript's content and its relation to the state of knowledge.  
  - Question 2: The reason must not be contingent on the identity of the author or the journal's particular circumstances (like mission or space).  

  **Stopping points:**  
  - If NO at Question 1: Reason is inadmissible.  
  - If NO at Question 2: Reason is inadmissible.  

  **Routing step for wrong-kind reasons:**  
  - If a reason fails Question 1 or 2, it might still be relevant to other decisions.  
     - If it is about the author (e.g., "the author is early-career") or the author's history (e.g., retractions), it goes to the "Author Context" bucket for the editor's awareness (but not for the decision on the merits). Note: A history of retractions might be relevant to trustworthiness, but we treat it as a red flag for extra scrutiny, not as a direct reason to reject. However, in our procedure, we do not use it as a reason in the decision letter.  
     - If it is about the journal's mission, scope, or readership (e.g., "readers have been asking for this"), it goes to the "Journal Context" bucket. The editor can consider these when making a final decision about whether to use a slot for this paper, but they do not go in the decision letter.  
     - If it is about the consequences for the field (e.g., "this sub-literature is a fad"), it might be a mix. We treat it as wrong-kind unless it is tied to the paper's validity (e.g., "this sub-literature is flawed, and this paper shares those flaws" is right-kind). Otherwise, it goes to the "Field Context" bucket for the editor's awareness.  

  **Elicitation step:**  
  - For ambiguous reasons (e.g., "this will be influential"), the editor can send a query: "Please clarify: Is the influence you mention due to the paper's intrinsic scholarly merits (e.g., strong evidence, compelling argument) or other factors?"  
  - Rule: If the referee answers that it's due to intrinsic merits, then the editor can reframe the reason in the decision letter (e.g., "The results, if correct, would have significant implications for the field because of [specific merit]"). If the referee points to extrinsic factors, or doesn't answer, the reason is not used.  

  **Flagged Philosophical Choices:**  
  - We are encoding a view that the only legitimate reasons for acceptance/rejection are those that bear on the epistemic merits (truth, validity) of the work. This is a contested view because some might argue that the journal's mission or the author's situation can be legitimate reasons. We are quarantining these as "context" for the editor but not for the decision letter.  
  - We are treating author characteristics (like retractions) as not directly bearing on the current manuscript's validity. This is contested: some might say it's relevant to trust. We handle it by allowing the editor to do extra checks but not to use it as a reason in the letter.  
  - The agent-neutrality requirement (Question 2) is a way to capture the object-given vs. state-given distinction. We are effectively saying that state-given reasons (which depend on the state of the world, like the journal's needs) are not admissible for the verdict on the paper. This is a contested choice.  

  **Where Two Accounts Might Differ:**  
  - Consider: "This author has had two papers retracted."  
     - On our procedure: Fails Question 2 (not agent-neutral) -> inadmissible.  
     - But one might argue that it is a reason to scrutinize the data more, which is about the manuscript. We route it to the editor for extra scrutiny, but we don't use it as a reason in the letter.  
     - A different account (e.g., one that allows reasons of trust) might say it is admissible. Our procedure sends it to a different bucket.  
  - Consider: "This whole sub-literature is a fad."  
     - If it's just a complaint about the field, it fails Question 1 (not about the validity of this paper) -> inadmissible.  
     - If it is tied to a flaw in the paper (e.g., "the paper uses the same flawed method as the rest of the sub-literature"), then it passes.  
     - A different account might allow the journal to consider the health of the field as a reason.  

  ## Running the Cases

  ### Case 1:  
  *Report: recommend minor revisions, the identification strategy in section four is clean and I could not find a hole in it, though I want the board to know the author is early-career at a regional teaching university and we have not published anything on this country in six years.*  

  **Referee-facing procedure:**  
  - "The identification strategy in section four is clean" -> Q1: YES (about the manuscript). Q2: YES (it would be clean regardless of author/journal). -> **Include in report.**  
  - "Author is early-career..." -> Q1: NO (about the author). -> **Do not include in report. Put in confidential comments.**  
  - "We have not published on this country in six years" -> Q1: NO (about journal's history). -> **Do not include in report. Put in confidential comments.**  

  **Editor-facing procedure:**  
  - Clean identification strategy: Passes both -> **Admissible.**  
  - Author early-career: Fails Q1 -> Route to "Author Context" bucket. Not for decision letter.  
  - Journal's country gap: Fails Q1 -> Route to "Journal Context" bucket. Not for decision letter.  

  **Decision letter content:** Only the part about the identification strategy being clean is included. The other points are noted by the editor for context but not passed to the author.  

  ### Case 2:  
  *Report: reject, "trust" is measured with a single survey item and cannot support the causal claim in the abstract, and separately this sub-literature is a fad and one more of these entrenches it and takes a slot from harder work.*  

  **Referee-facing procedure:**  
  - Measurement issue: Q1: YES (about the manuscript's validity). Q2: YES (it would be a problem regardless). -> **Include in report.**  
  - Sub-literature is a fad: Q1: NO (not about this paper's validity, but about the field). -> **Do not include in report. Put in confidential comments.**  

  **Editor-facing procedure:**  
  - Measurement issue: Passes both -> **Admissible.**  
  - Sub-literature fad: Fails Q1 (unless tied to a flaw in the paper). Since it's stated separately, we treat it as not about the paper. Route to "Field Context" bucket.  

  **Decision letter content:** Only the measurement issue is included. The fad comment is not used.  

  ### Case 3:  
  *Editor's situation: I want to publish a paper by an author I admire, which I think will be cited a lot. The only substantive objection is from a referee I know to be a crank with a grudge against the method. I cannot answer the objection myself.*  

  **Applying the procedure to the editor's own thoughts:**  
  - "I want to publish because I admire the author": Fails Q1 (about the author, not the manuscript) and Q2 (not agent-neutral). -> **Inadmissible.**  
  - "It will be cited a lot": This is ambiguous. We run the elicitation step on ourselves: Why will it be cited? If because of its merits (e.g., important true result), then it passes. If because of the author's fame or the topic's trendiness, then it fails.  
     - We must be able to point to merits. If we cannot, then it's not admissible.  
  - "The referee is a crank with a grudge": This is about the referee, not the manuscript. It fails Q1. -> **Inadmissible.**  

  **What can we do with the referee's objection?**  
  - The referee's objection: "The only substantive objection..."  
     - We must evaluate the objection on its merits. If we cannot answer it, then we cannot dismiss it just because we think the referee is unreliable.  
     - The procedure does not allow us to use the referee's unreliability as a reason to disregard the objection.  

  **Options:**  
  1. Seek another referee to evaluate the objection.  
  2. If the objection is about a method we trust, and we cannot answer it, we might have to reject or ask for revisions that address it.  

  **The fact that the referee is unreliable:**  
  - This is not admissible for the decision. We cannot put in the decision letter: "We are ignoring this referee because he is a crank."  
  - We can, however, as editors, decide to seek additional review if we have strong reasons to doubt the referee's objectivity. But this is an editorial judgment about the review process, not a reason in the decision about the manuscript.  

  **What the procedure says about our desire to overrule:**  
  - It is inadmissible. We must base the decision on the manuscript's merits and the substantive objections.  

  ## What the Procedure Cannot Do

  1. **Cases where it goes quiet:**  
     - When the only reasons are wrong-kind (e.g., a paper with no scientific merit but which would be very popular with readers). The procedure will say there are no admissible reasons for acceptance.  
     - When the editor must make a judgment call about journal priorities (e.g., between two equally good papers, one of which fits the mission better). The procedure doesn't handle these trade-offs.  

  2. **Cases where it confidently gives a bad answer:**  
     - If a referee gives a right-kind reason that is factually wrong (e.g., "the method is flawed" when it isn't), the procedure will admit it. It doesn't check the truth of the reason.  
     - If a paper is brilliant but written by an author with a history of fraud, the procedure forces the editor to ignore the author's history. This might lead to publishing a fraudulent paper if the current manuscript passes muster.  

  3. **Distinction it can't draw:**  
     - It cannot perfectly distinguish between a reason that is about the consequences of publishing (wrong-kind) and one that is about the importance of the work (which might be right-kind if tied to the truth). We try to elicit, but if the referee doesn't clarify, we drop it.  
     - It cannot handle reasons that are both about the manuscript and about the context (e.g., a paper that is both methodologically sound and exactly what the journal's readers need). We split them and only use the methodological part.  

  **Final Note:** This procedure is designed to make decision letters honest by only including reasons that are about the manuscript's scholarly merits. It will sometimes feel restrictive, but it aims to prevent the dishonesty that comes from mixing kinds of reasons.
answer: |-
  ### Reusable Procedure for Sorting Referee Considerations

  #### **Referee-Facing Version (Jargon-Free, 20-Minute Checklist)**
  **Instructions:** After drafting your report, review each reason supporting your recommendation. Ask these questions in order for *each* reason. If a reason fails any step, **do not include it in the report**. Instead, move it to "Confidential Comments for the Editor."

  1. **Is this about the *manuscript itself*?**  
     - Specifically: Does it describe what’s *in* the paper (e.g., methods, data, arguments, clarity) or how it contributes to knowledge?  
     - *Sufficient answer*: YES only if it points to text, tables, or findings in the manuscript.  
     - **STOP if NO**: Move to confidential comments. Example: "The author is early-career" → NO (about author, not manuscript).  

  2. **Would this reason hold if the author were anonymous and any journal published it?**  
     - *Sufficient answer*: YES only if the reason doesn’t depend on who wrote it or where it’s published.  
     - **STOP if NO**: Move to confidential comments. Example: "We haven’t covered this topic in years" → NO (about journal’s history, not the manuscript).  

  3. **Is this reason *only* about what happens *after* publication?**  
     - Specifically: Does it focus on consequences (e.g., "this will be cited," "this might start a trend") without linking to the manuscript’s validity?  
     - *Sufficient answer*: YES if it’s purely about future impact.  
     - **STOP if YES**: Move to confidential comments.  
     - *Exception*: If the consequence is *directly tied* to the paper’s strength (e.g., "This finding will change the field *because* the evidence is robust"), rewrite to emphasize the strength.  

  **Routing for Confidential Comments**:  
  - If a reason fails Steps 1–3, it goes in confidential comments.  
  - **Flag why it failed**:  
    - ⚠️ "About author/journal mission" → Editor decides if it affects scope/slot allocation.  
    - ⚠️ "Future impact without validation" → Editor may follow up to clarify.  
    - ❌ "Unrelated" (e.g., personal opinions) → Discard.  

  **Elicitation Step for Ambiguity**:  
  - If you write something like "this will be influential," ask yourself: **"Is this because of the manuscript’s internal strengths?"**  
    - If YES, rewrite to specify the strength (e.g., "The robust data in Table 2 will make this influential").  
    - If NO, move to confidential comments.  
    - *Editor backstop*: If the editor spots vague "impact" claims, they query: **"Please clarify: Is the influence due to the manuscript’s scholarly rigor, or other factors?"**  
      - Referee ignores/botches the query? → The reason is discarded.  

  ---

  #### **Editor-Facing Version (Theory-Based Triage)**  
  **Instructions:** For each referee consideration, run this flowchart. Track "Admissible" (for decision letter) vs. "Context" (for editorial judgment only).  

  1. **Is the reason *truth-directed*?**  
     - Does it bear on the manuscript’s validity, accuracy, or contribution to knowledge?  
     - *Contested encoding*: Assumes only epistemic reasons (about truth/falsity) are admissible. Rejects pragmatic/moral reasons.  
     - **NO?** → Route:  
       - Author/journal factors → "Scope/Slot Context" (e.g., early-career author, topic gaps).  
       - Field-level consequences → "Field Context" (e.g., "this sub-field is a fad").  
       - Irrelevant → Discard.  

  2. **Is the reason *agent-neutral*?**  
     - Would it apply identically regardless of who assesses it or the journal’s policies?  
     - *Contested encoding*: Rejects "state-given" reasons (e.g., "publishing this would please readers").  
     - **NO?** → Route to "Scope/Slot Context" or discard.  

  3. **Does it survive *universalization*?**  
     - Could it be honestly stated to the author as grounds for rejection/acceptance?  
     - **NO?** → Route to relevant "Context" bucket.  

  **Elicitation for Symptomatic Reasons**:  
  - If a referee’s "impact" claim is ambiguous, send: **"Clarify: Is the influence due to the manuscript’s validity, or external factors?"**  
    - Valid response: Cites manuscript strengths (e.g., "Table 3’s analysis justifies the impact"). → **Admissible**.  
    - Invalid response: Focuses on popularity/author fame. → **Route to "Field Context" or discard**.  

  **Conflict Flag**:  
  - Where accounts diverge: Author history (e.g., retractions).  
    - *Truth-directed view*: Relevant if it signals risk of error (admissible for extra scrutiny).  
    *State-given view*: Inadmissible (not about *this* manuscript).  
    - **Procedure’s call**: Route to "Scope/Slot Context" for editorial scrutiny but **never in decision letter**.  

  ---

  ### **Case Applications**  

  #### **Case 1**  
  *Referee report: "Recommend minor revisions. The identification strategy in section four is clean (I found no holes). [STOP] The author is early-career at a regional school. [STOP] We haven’t published on this country in six years."*  
  - **Clean identification**: Passes Steps 1–2 (about manuscript, agent-neutral). → **Admissible** in report.  
  - **Early-career author**: Fails Step 1 (not about manuscript). → Route to "Scope/Slot Context" for editor.  
  - **Country gap**: Fails Step 2 (not agent-neutral). → Route to "Scope/Slot Context."  
  - **Decision letter includes**: Only the comment on identification strategy.  

  #### **Case 2**  
  *Referee report: "Reject. 'Trust' is measured with one survey item and can’t support the causal claim. [STOP] This sub-literature is a fad; publishing this entrenches it and takes a slot from harder work."*  
  - **Measurement issue**: Passes Steps 1–2 (truth-directed, agent-neutral). → **Admissible**.  
  - "Sub-literature is a fad": Fails Step 1 (not about manuscript’s validity). → Route to "Field Context."  
  - **Decision letter includes**: Only the measurement critique.  

  #### **Case 3**  
  *Editor’s dilemma: Want to publish admired author’s paper; predicts high citations. Only substantive objection from a crank referee. Can’t rebut the objection.*  
  - **Your desire to publish**:  
    - "Admire author" → Fails Step 1 (not truth-directed). → **Discard**.  
    - "Will get cited" → Ambiguous. Elicitation: **Is it due to rigor?** If you can’t tie citations to manuscript strengths → **Route to "Field Context"** (not admissible).  
  - **Crank referee’s objection**:  
    - The objection itself ("substantive objection") is admissible if it passes Step 1 (e.g., "Method X is flawed").  
    - **Referee’s unreliability**: Fails Step 1 (not about manuscript). → **Inadmissible**. You cannot overrule based on this.  
  - **Procedure’s mandate**:  
    - You must either:  
      1. Seek another referee to assess the objection (if the journal permits).  
      2. Reject the paper if the objection is valid and unanswered.  
    - **No routing allowed**: Referee bias is "discarded" unless it manifests in unprofessional comments (e.g., ad hominems).  

  ---

  ### **What the Procedure Cannot Do**  
  1. **Goes quiet when**:  
     - Reasons are purely about values (e.g., "This topic is unethical to study"). → Requires human judgment.  
     - Manuscript is technically sound but harms the journal’s mission (e.g., off-topic). → Routes to "Scope/Slot Context," but editor decides.  

  2. **Confidently gives bad answers when**:  
     - Referees mask bias with valid-sounding language (e.g., "The method is weak" from a grudge-holder). Procedure admits it if it passes Steps 1–2.  
     - A "wrong-kind" reason is actually critical (e.g., "Author falsified data in past" on a data-heavy paper). Procedure discards it; editor must spot risks independently.  

  3. **Cannot draw this distinction**:  
     - "Importance" vs. "truth." If a referee says, "This is too trivial to publish," the procedure admits it (truth-directed). But triviality is subjective → Humans must weigh.  

  **Blunt takeaway**: This is a *filter*, not a philosopher. It ensures decision letters are defensible to authors but can’t resolve deep conflicts about scholarly value. When in doubt, default to transparency: "We rejected because of X flaw in the manuscript" (admissible) beats "We rejected because of Y external factor" (indefensible).
