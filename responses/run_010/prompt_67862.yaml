prompt: |-
  I am a novelist, and I am three years into a book that has turned out to be, in its machinery, a biography: the life of an invented woman — a provincial surgeon practising in a mid-sized Central European city between the wars — assembled after her death by a colleague who loved her, once betrayed her professionally, and cannot be trusted with the material he has gathered. The book quotes documents, weighs testimony, and passes judgment. It is fiction and will be read as fiction, but I have come to think the traditions I am actually borrowing from are far older than the modern biography: Plutarch's ethical lives, and the saints' lives of late antiquity and the Middle Ages that took over his method and bent it toward edification.

  I do not want scholarship, and I do not want a reading list: I have no library at hand and no use for citations, so please do not send me away to sources. What I want is the most important implications of those two traditions — and of the standing philosophical argument over whether anyone can learn anything moral from a life at all — for a set of concrete decisions I now have to make. Be as specific as you can about craft rather than about the history of ideas.

  Selection. At the head of the Life of Alexander Plutarch announces that "it is not Histories that I am writing, but Lives," and argues that the greatest battles and the capture of cities disclose almost nothing of virtue or vice, whereas some trifling act, a saying or a jest, often reveals character better than the largest events. What does a doctrine of that kind imply about which scenes such a book must contain and which it must refuse? Does it license me to invent the telling trifles, and if so on what terms?

  Judgment. Plutarch's narrator is a magistrate who records faults alongside virtues; the hagiographer's is an advocate working toward an ending known from the first page. What stance is available to a narrator who is neither — a mourner and an accuser at once? Where should evaluation sit: in his sentences, in the arrangement of the material, or in the reader's own response? Is there a version of the book in which he never once says she was good and the reader nonetheless arrives at that verdict, and what would have to be true of the arrangement for that to work?

  Comparison. Most of Plutarch's pairs close with a set-piece comparison, and at least one of his subjects appears to have been reshaped to serve as the counterpart the pairing required. I am weighing whether to give my surgeon a parallel — a rival, a sister, a second woman who made other choices in the same city. What does the comparative structure buy, and what does it do to the truth of the single life set beside it?

  Exemplarity. Can a reader learn anything from a life that an argument could not have taught? Recent moral philosophy has pressed the claim that narrative attention to particulars is itself a form of ethical knowledge; the anti-narrativist reply is that lives do not have plots, and that imposing a beginning, middle and end falsifies rather than discloses. Give me the implications for a character who is meant to be attended to closely but is not meant to be admired, and for the transfer problem: whatever is admirable or damnable in her depends on circumstances she did not choose and my reader will never inhabit. And whether the book can borrow hagiography's apparatus — the fixed ending, the stock motifs, the reverent tone — while refusing hagiography's conclusion, giving a life that presents as saintly and is not.

  Finally, and this matters more to me than courtesy: if you think the premise is confused, say so plainly before you answer anything else. It may be that Plutarch and the hagiographers were not doing remotely the same job and that yoking them is a category error I have picked up from my own reading; it may be that a novelist who wants her book to function as a moral example is asking fiction to do something its form cannot do; or it may be that all of this is simply beside the point for a book that will be read as invention. If you believe any of that, argue it against me first and then tell me what survives — I would far rather be contradicted than accommodated. Where your confidence in the historical material is thin, mark it as thin rather than smoothing it over.
reasoning: |-
  Okay, the user is a novelist working on a complex biographical fiction about an invented female surgeon in interwar Central Europe. The narrator is an unreliable colleague compiling her life story posthumously. The novelist wants to explore Plutarch's ethical lives and medieval hagiography as frameworks, not for scholarship but for concrete craft decisions. 

  First, I need to validate their core concern: is this hybrid approach coherent? The connection between Plutarch and hagiographers isn't forced—both use lives as moral lenses, though with different aims. Plutarch probes ambiguities; hagiographers canonize. The novel's tension between unreliable narration and moral investigation actually benefits from this duality. Fiction absolutely can function as moral example through embodied dilemmas rather than didactic lessons—think of Crime and Punishment or Middlemarch. 

  For Selection: Plutarch's "trifles reveal character" doctrine means prioritizing moments that expose moral crossroads. For this surgeon, I'd suggest: her first professional betrayal (not the act itself but her micro-expressions during it), how she handles a patient's death when protocol fails, or a mundane choice revealing her class biases. The narrator's unreliability demands invented "evidence"—but the inventions must feel like discoveries he's distorting. A fabricated diary entry about surgical guilt could work if framed as "a copy of the lost original... or so he claims."

  Judgment requires nesting perspectives. The narrator's voice should bleed evaluation ("typical of her stubborn virtue...") while the documents undermine him. To make readers conclude "she was good" without stating it: arrange case studies where her decisions initially seem cold, then reveal deeper ethics through witnesses' conflicting accounts. The key is making the reader do the synthesis he refuses to.

  Comparison would structurally force moral clarity. If the surgeon has a rival who chose marriage over medicine, their parallel choices about ambition/power become legible. But it risks simplifying her—maybe imply the shadow counterpart through her own regrets ("I could have been like X") rather than full parallel narration. Plutarch reshaped lives for contrast; fiction can afford more ambiguity.

  Exemplarity hinges on particularity. Show her goodness not as inherent but as hard-won: perhaps she inherits her clinic from a Jewish mentor and hesitates to defend him, making her later courage a choice, not sainthood. Borrow hagiography's motifs (miraculous surgeries?) but subvert them—her "miracle" has ugly ethical compromises. The anti-narrativist critique is valid: don't impose redemption arcs. Let her life remain messy, with readerly attention as the true ethical act.

  Biggest risk: the narrator's bias overwhelming the moral investigation. Solution? Embed countervoices—patients' letters, municipal records—that puncture his version. The novel's power lies in the gap between his curated fragments and the woman who escapes them.
answer: |-
  Your premise isn't confused; it's potent. Plutarch and the hagiographers *are* connected – both use narrative to explore character and ethics, though with divergent aims. Plutarch seeks understanding through contrast and complexity; hagiography seeks emulation through pattern and transcendence. Your unreliable, grieving narrator poised between these poles is fertile ground. Fiction *can* function as moral investigation, precisely *because* it uses particulars to evoke understanding beyond argument. The risk isn't incoherence, but whether your narrator's unreason can be shaped into a vessel that *allows* the reader ethical insight despite (or because of) his flaws.

  Here are the implications for your concrete craft decisions, grounded in those traditions and the philosophical debate:

  ### 1. Selection: The Telling Trifle & Its Invented Weight
  *   **Implication:** Scenes must be **character-revealing moments of ethical choice or manifestation**, *not* primarily plot-advancing events. Focus on the **seemingly insignificant crossroads**, the **private reaction to public pressure**, the **habitual gesture under stress**, the **unconsidered word spoken freely**.
  *   **What to Include:** 
      *   Her reaction to a minor professional slight (a skipped promotion, credit stolen for a small discovery).
      *   How she treats a difficult patient when exhausted and unseen.
      *   A choice about personal comfort vs. professional duty (e.g., leaving a party for an emergency).
      *   A moment of hesitation before a risky procedure *she* believes is right.
      *   Her handling of a subordinate's mistake – does she cover, expose, teach?
  *   **What to Refuse:**
      *   Detailed accounts of major surgeries *unless* the focus is her state of mind, an ethical dilemma during it, or its immediate interpersonal fallout.
      *   Grand political events *unless* they directly force a small, personal, character-defining choice upon her (e.g., how she reacts to a new discriminatory law affecting a colleague/patient).
      *   Events solely demonstrating her technical skill *without* revealing character or ethical stance.
  *   **Inventing Trifles:** **Yes, absolutely.** This is where fiction thrives. But invention *must*:
      *   **Feel Psychologically Plausible:** Could *this* person, in *this* context, plausibly have done/said this?
      *   **Serve the Ethical Inquiry:** It must illuminate a facet of her character Plutarch would note or a hagiographer would highlight (even if your conclusion subverts theirs).
      *   **Be Filtered Through the Narrator:** How does *he* frame it? Does he present an invented moment as "recovered testimony"? Does he interpret an ambiguous gesture definitively? The invention's "truth" lies in its revelatory power for the reader *despite* the narrator's lens.

  ### 2. Judgment: The Mourning Accuser's Stance
  *   **Stance:** He is inherently **partial yet burdened by evidence**. His grief fuels idealization; his guilt fuels harsh scrutiny. His unreliability stems not just from deceit, but from this internal conflict distorting his perception and presentation.
  *   **Where Evaluation Sits:**
      *   **In His Sentences:** Unavoidable, but use it strategically. Let his judgments be **overt, emotional, and often contradictory**. "Her stubbornness, that infuriating, magnificent refusal to yield..." This reveals *him* as much as her.
      *   **In the Arrangement of Material:** This is crucial. **Juxtaposition is judgment.** Place his glowing recollection next to a document (a cold medical report, a patient's angry letter) that undermines it. Follow his account of her "heroic sacrifice" with evidence of the collateral damage it caused. Let the reader see the gap between his interpretation and the raw material. Structure chapters around themes (Ambition, Loyalty, Sacrifice) where conflicting evidence accumulates.
      *   **In the Reader's Response:** **This is the goal.** Can the reader conclude "she was good" without him saying it? **Yes.** How?
          *   **Accumulation of Trifles:** Show her consistent small acts of courage, integrity, or compassion *despite* his attempts to downplay or misinterpret them.
          *   **Counter-Narratives:** Embed voices that contradict him – patients, rivals, friends – presented even through his biased selection. Let *their* words carry weight.
          *   **Her Own Voice:** Quotes from her letters, notes, or reported speech that reveal intelligence, conviction, or vulnerability he can't erase.
          *   **The Weight of His Struggle:** The very *intensity* of his need to accuse or absolve can signal her significance and complexity. The reader judges *him* judging *her*, and in that double vision, her substance emerges.
  *   **Craft Takeaway:** **Show the evidence, show his reaction to it, but trust the reader to synthesize.** Structure the book so the reader builds their own portrait brick by brick, seeing around and through his obfuscations and passions.

  ### 3. Comparison: The Shaping Power of the Parallel
  *   **What it Buys:**
      *   **Sharpens Focus:** Forces definition by contrast. What makes the surgeon *distinct* becomes clearer against another life.
      *   **Deepens Ethical Inquiry:** Highlights how choices under similar pressures lead to different outcomes/character. Was it temperament? Principle? Luck?
      *   **Amplifies Themes:** Explores different facets of ambition, duty, love, compromise within the same socio-historical context.
      *   **Provides Structural Mirroring:** Offers a counter-rhythm to the main narrative.
  *   **What it Costs/Distorts:**
      *   **Reductionism:** Risk of simplifying both lives to fit the contrast. The surgeon becomes *only* "the dedicated one" or "the uncompromising one."
      *   **Narrative Distortion:** Events in *her* life might be subtly selected or framed to enhance the comparison, just as Plutarch shaped his subjects.
      *   **Dilution:** Can pull focus from the central, complex investigation of the surgeon.
  *   **Craft Implication:** If you use a parallel (a rival choosing political expediency, a sister choosing family over career), **make the comparison implicit within the *main* narrative structure, not a separate set-piece.** Weave the other figure's choices and consequences into the narrator's account of the surgeon *as points of reference he himself draws* (or tries to suppress). Show *her* reflecting on this other life. This keeps the focus primarily on her while harnessing the clarifying power of contrast. Avoid a formal Plutarchan "Comparison" chapter; let it permeate.

  ### 4. Exemplarity: Particulars, Plots, and Subverted Sainthood
  *   **Can a Life Teach What Argument Cannot? Yes.** Narrative offers:
      *   **Embodied Ethics:** The *feel* of a moral choice in context, the weight of consequences on a specific person.
      *   **Attention to Contingency:** Shows how virtue/vice emerges from the messy interaction of character, circumstance, and unchosen context (war, gender norms, profession).
      *   **Complexity & Ambiguity:** Argument often seeks clarity; narrative can hold irreconcilable truths.
  *   **Anti-Narrativist Challenge:** **Acknowledge it.** Your book *is* imposing a shape (posthumous compilation by a biased narrator). The key is to:
      *   **Highlight the Construction:** Let the narrator's struggle with the material, his gaps, his forced interpretations, be visible. Show the seams.
      *   **Resist Neat Resolution:** Don't force her life into a redemptive arc or a clear moral lesson. Let the "plot" be the accumulation of evidence and the narrator's (failed?) attempt to make sense of it, not her life itself becoming a tidy parable.
  *   **Character Meant for Attention, Not Admiration:** 
      *   **Focus on Struggle:** Show her wrestling with dilemmas, making mistakes for understandable reasons, being shaped by flawed systems. What makes her compelling isn't perfection, but the depth and honesty (as revealed *despite* the narrator) of her engagement with her world and choices.
      *   **Transfer Problem:** **Emphasize the Context.** Make the unchosen circumstances (sexism, rise of fascism, medical limitations of the era) vivid. The reader learns not "be like her" but "see how *this* person navigated *this* impossible terrain." The ethical insight is in understanding the pressures and the responses, not extracting universal rules.
  *   **Borrowing Hagiography's Apparatus to Subvert It:** **This is powerful.**
      *   **Fixed Ending (Death):** Use it not as transcendence but as the catalyst for the messy, human project of remembrance and judgment. The "ending" is the beginning of the narrator's troubled quest.
      *   **Stock Motifs:** Use them ironically. A "miracle cure" could be presented by the narrator but undercut by evidence of risky methodology or neglect elsewhere. "Humility" could mask crippling self-doubt. "Chastity" could be loneliness or repression. Show the human reality *behind* the potential saintly trope.
      *   **Reverent Tone:** Let the narrator *attempt* this tone, but have it crack under the weight of guilt, conflicting evidence, or his own unresolved feelings. Juxtapose his forced reverence with the raw, sometimes unflattering, documents. The dissonance *is* the point.

  **Conclusion & Confidence:**

  Your premise is robust. The friction between Plutarchan inquiry, hagiographic form, unreliable narration, and fictional invention is your engine, not a flaw. Embrace the narrator's tortured position as the lens. Focus ruthlessly on **ethically charged particulars**, structure for **juxtaposition and reader synthesis**, acknowledge but don't be enslaved by the **constructed nature of biography**, and **subvert hagiographic tropes** to reveal complex humanity. The moral knowledge emerges not from didactic lessons, but from the reader's own careful, critical attention to the assembled life, seeing through and around the narrator's grief and guilt to perceive the woman who existed within – and despite – his account. **The book's power lies in that act of discernment.** Go build her life, brick by ambiguous brick.
