prompt: |-
  I am a junior in high school, and for the past two months my school's philosophy club has been reading and arguing about the special composition question: under what conditions, if any, do some things compose a further thing? The discussions have gone nowhere, and I think I finally understand why. One member insists that any restricted answer is intolerably arbitrary, since nothing about a scattered pair of objects changes gradually as you slide them together, so composition must always occur. Another insists universalism is absurd, because it commits us to an object composed of my left shoe, the Eiffel Tower, and a distant quasar. A third says only living things genuinely compose. When our adviser sat in last week, she pointed out that we are not actually disagreeing about an answer at all; we are disagreeing about what would make an answer good, and none of us could say what that means. Since I have to submit a thesis proposal in the spring and I am seriously considering this topic, I would like that prior question settled first. So: write out the full specification of what any adequate answer to the special composition question has to deliver.

  To give you something to push against, here are the candidate requirements my own list so far contains, none of which I am confident about. An answer should be statable without smuggling in the very notion it is supposed to define, so that it is not vacuous or trivially satisfied by every collection whatsoever or by none. It should not leave composition vague, because it is hard to see how a borderline case could be borderline rather than simply indeterminate, and indeterminacy in the world is a heavy thing to accept. It should be conservative enough that our ordinary beliefs about tables, cats, and rocks are not massively and systematically false. It should be applicable by finite creatures like us, meaning that we could in principle tell whether composition has occurred without having to survey the whole universe or do metaphysics first. It should be compatible with what our best mereological pictures allow, including endless divisibility and talk about many things at once without forcing them into a single thing. And it should tell us why composition occurs where it does, rather than accepting that it just does, as an unexplained brute fact. Some of these I suspect are genuine constraints on any answer, some I suspect are really the preferences of one camp dressed up as requirements, and I would guess at least two of them cannot be satisfied together.

  What I want from you, then, is the reasoned list rather than a summary of positions. For each requirement you end up endorsing, give the case or consideration that motivates it, ideally a concrete scenario that makes vivid what goes wrong if the requirement is violated. Say explicitly which requirements you take to be non-negotiable and which are contestable commitments, and name the camp whose prejudice each contestable one belongs to. Identify every conflict between requirements, and if some subset is jointly unsatisfiable, demonstrate it, because that result would matter more to my thesis than anything else on the list. Tell me which single requirement does the most work in eliminating candidates, and, for each requirement you reject or demote from my list above, what argument would justify dropping it. Finally, in one short paragraph and no longer, note how universalism, nihilism, and the view that only living things compose fare against the finished list. A table is fine for the requirements themselves, but the reasoning behind each has to be in prose.
reasoning: |-
  Hmm, this user is a high school junior grappling with a deep philosophical problem - the special composition question in mereology. They've clearly done their homework, presenting a sophisticated analysis of their philosophy club's stalemate and their own preliminary requirements for an adequate answer. 

  The core tension here is between conceptual rigor and practical applicability. On one hand, they want an answer that avoids arbitrariness and vagueness; on the other, they need something compatible with human cognition and ordinary experience. Their list shows impressive maturity - recognizing that some requirements might be disguised preferences, and anticipating conflicts between desiderata.

  What stands out is their adviser's crucial insight: the debate isn't about answers but about meta-standards for evaluating answers. This shifts the entire framing from "what is true" to "what would make a theory acceptable." Their request for conflict analysis is particularly sharp - if certain requirements are provably incompatible, that alone could shape their thesis.

  I notice three layers in their query: first, the surface request for requirement specifications; second, the implicit plea for methodological clarity in philosophy; third, perhaps some frustration with endless debates that lack resolution criteria. They're not just seeking knowledge but tools for knowledge evaluation.

  The challenge is balancing philosophical precision with pedagogical clarity. Each requirement needs concrete motivation through thought experiments while maintaining technical accuracy. The universalism/nihilism/organicism comparison at the end must be brutally concise yet comprehensive - quite a tightrope walk.

  Most importantly, I must resist the temptation to solve the composition question itself. The assignment is strictly meta-theoretical: establish evaluation criteria. Any drift into advocating a position would betray their request. The table format helps enforce this discipline by separating requirements from rationales.

  Ah, and that "short paragraph" constraint for comparing theories will require surgical precision. Better prepare to distill years of mereological debate into three sentences per position...
answer: |-
  Below is a reasoned specification of requirements for an adequate answer to the Special Composition Question (SCQ). Requirements are categorized as **non-negotiable** (essential to avoid incoherence or vacuity) or **contestable** (reflect substantive philosophical commitments). Conflicts are explicitly identified, and rejected/demoted items from your list are justified. A table summarizes the requirements, followed by prose rationales, conflict analysis, and a comparison of major theories.

  ---

  ### **Table: Requirements for an Adequate Answer to the SCQ**
  | **Requirement**               | **Status**          | **Motivating Case/Consideration**                                                                 | **Camp Affiliation (if contestable)** |
  |-------------------------------|---------------------|---------------------------------------------------------------------------------------------------|---------------------------------------|
  | **1. Non-Circularity**        | Non-negotiable      | Defining "composition" using "object" or "whole" renders the SCQ vacuous.                         | —                                     |
  | **2. Determinacy**            | Non-negotiable      | Borderline cats (e.g., genetically engineered proto-felines) imply contradictions if composition is vague. | —                                     |
  | **3. Empirical Conservatism** | Contestable         | Denying ordinary objects (tables, mountains) forces systematic error in everyday language/science. | Commonsense/Moderate Realism          |
  | **4. Epistemic Accessibility**| Contestable         | If composition requires surveying distant quasars, we could never know if a chair exists.         | Anti-Skeptical/Moderate Views         |
  | **5. Mereological Neutrality**| Non-negotiable      | Rejecting gunk (infinitely divisible stuff) or junky worlds (no maximal whole) contradicts physics/metaphysics. | —                                     |
  | **6. Explanatory Power**      | Contestable         | Brute facts (e.g., "composition just *happens* at distance *d*") lack predictive or theoretical value. | Anti-Positivism/Primitivist           |

  ---

  ### **Rationales & Cases**  
  **1. Non-Circularity**  
  An answer must not presuppose mereological concepts (e.g., "things compose when they form a *whole*"). *Violation*: "Composition occurs when parts are *unified*" uses "unified" as a synonym for "composed," offering no criterion. Without this, the SCQ dissolves into tautology ("things compose when they compose") or absurdity ("no things ever compose").  

  **2. Determinacy**  
  Composition cannot be vague (e.g., "sometimes parts *sort of* compose"). *Motivating case*: A robot disassembled and reassembled molecule-by-molecule. If composition is vague, there is no fact about whether it is the same object during reassembly. This forces contradictions (e.g., "It both is and isn’t a robot at step 47"), violating logical coherence. Indeterminacy is metaphysically heavier than precise thresholds.  

  **3. Empirical Conservatism**  
  Must preserve ordinary objects (tables, rocks) as composite. *Motivating case*: If nihilism (no composition) is true, the statement "I am sitting on a chair" is false—yet science, law, and perception rely on such claims. Systematic error about macroscopic objects undermines the utility of the SCQ itself. *Contestable*: Universalists/nihilists accept revising common sense for theoretical simplicity.  

  **4. Epistemic Accessibility**  
  Humans must discern composition without omniscience. *Motivating case*: If composition depends on undiscovered Martian rocks, I cannot know if my coffee cup exists. This collapses into global skepticism about ordinary objects. *Contestable*: Epistemic limits need not constrain metaphysics (e.g., quantum facts are unknowable without instruments).  

  **5. Mereological Neutrality**  
  Must accommodate gunk (all things have proper parts) and junky worlds (all things are parts). *Violation*: If the SCQ requires atomic simples (e.g., "composition stops at fundamental particles"), it contradicts quantum field theory (which suggests no true atoms). It must also allow talk of pluralities without fusing them (e.g., "the apples in this bowl" need not be a single object).  

  **6. Explanatory Power**  
  Must explain *why* composition occurs. *Motivating case*: A brute fact (e.g., "composition occurs at exactly 0.5m") is arbitrary and uninformative. It cannot predict whether a new arrangement (e.g., a 0.49m-spaced particle array) composes. *Contestable*: Primitivists (e.g., van Inwagen) argue composition *is* brute; demanding explanation begs the question.  

  ---

  ### **Conflicts & Unsatisfiable Subsets**  
  - **Fatal Conflict**: **Empirical Conservatism (3)** + **Epistemic Accessibility (4)** + **Explanatory Power (6)** are jointly unsatisfiable.  
    - *Proof*: Conservative answers (e.g., contact, cohesion) are accessible but arbitrary (violating 6). Non-arbitrary answers (e.g., universalism) violate conservatism (3). Non-arbitrary conservative answers (e.g., organicism) are inaccessible—e.g., is this virus "alive"? (violating 4).  

  - **Tension**: **Determinacy (2)** conflicts with **Empirical Conservatism (3)** in borderline cases (e.g., is a cloud a composite object?). Resolving this requires precisification, risking revisionism.  

  ---

  ### **Rejected/Demoted Items from Your List**  
  - **"No smuggling of mereological notions"** → Retained as **Non-Circularity (1)**.  
  - **"No vagueness"** → Retained as **Determinacy (2)**.  
  - **"Conservative re ordinary objects"** → Retained but as **Contestable (3)** (nihilists/universalists reject it).  
  - **"Applicable by finite creatures"** → Retained as **Epistemic Accessibility (4)**, but demoted to contestable (metaphysics may outstrip epistemology).  
  - **"Compatible with mereology (gunk, etc.)"** → Retained as **Mereological Neutrality (5)**.  
  - **"No brute facts"** → Retained as **Explanatory Power (6)** but demoted: brute facts may be unavoidable (e.g., fundamental laws of physics).  

  **Most Eliminative Requirement**: **Non-Circularity (1)**. Answers violating it (e.g., "when they are *connected*") fail immediately by relying on undefined mereological intuitions.  

  ---

  ### **Theories vs. Requirements**  
  **Universalism** (always composes): Violates **Empirical Conservatism (3)** (accepts "trash" objects like shoe-Eiffel-quasar) and arguably **Explanatory Power (6)** (no reason *why* arbitrary collections compose).  
  **Nihilism** (never composes): Violates **Empirical Conservatism (3)** (denies tables, cats) and **Epistemic Accessibility (4)** (if no composites, we misidentify everything).  
  **Organicism** (only life composes): Violates **Epistemic Accessibility (4)** (borderline life cases are undecidable) and **Mereological Neutrality (5)** (presupposes life is metaphysically privileged). All satisfy **Non-Circularity (1)**, **Determinacy (2)**, and **Mereological Neutrality (5)**.  

  ---

  This framework reveals why the SCQ resists solution: **Empirical Conservatism**, **Epistemic Accessibility**, and **Explanatory Power** form an unsatisfiable triad. Any thesis must prioritize two at the expense of the third, exposing the debate’s core as meta-philosophical—exactly as your adviser observed. Your next step: argue which requirement(s) *should* yield, and why.
