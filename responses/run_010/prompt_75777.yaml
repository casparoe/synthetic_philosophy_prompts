               But we don't have that information.

            b. Consistency across different levels of risk: a risk-averse RWEU decision maker will be more averse to risks that are concentrated on the bad outcomes. 

          However, without additional questions, we have to rely on the reader's description of their general philosophy.

     - The school governor case: they oppose the surface in their school but support it elsewhere. This violates the sure-thing principle? Let's see:
          - The risk is the same in both cases. But the governor is willing to accept the risk when it's spread across many schools but not when it's concentrated in their own. 
          - This is consistent with risk-weighted expected utility if the governor has a risk function that is more averse to a single large loss (in their own school) than to many small independent losses (across the borough). 
          - However, note that the risk in their own school is the same as the risk in any one school. So why are they willing to accept it in other schools? 
            This might be because they feel responsible for their own school and are more averse to a bad outcome there. That points to a framing effect or a responsibility effect, not necessarily global risk sensitivity.

     - Alternatively, the governor might be using a maxmin rule for their own school (avoiding the worst-case) but expected utility for the borough? That would be inconsistent.

     - Dynamic inconsistency: if the governor were faced with a sequence of decisions (first decide for their own school, then for the others) they might choose differently than if they decided all at once. But we don't have that.

     - The representation theorem: RWEU is a different representation, so we are looking for patterns that are more naturally captured by RWEU. One key is that RWEU can explain aversion to a small chance of a large loss even when the expected utility is positive and the stakes are small (if the risk function is sufficiently averse). But so can probability weighting.

     - How to distinguish from probability weighting? 
          Probability weighting is usually about the transformation of a single probability (like overweighting a 2% chance). RWEU is about the entire distribution. 
          In particular, RWEU can account for aversion to risks that have a small probability of a bad outcome without necessarily overweighting that probability. It does so by underweighting the good outcomes in the tail.

     But without being able to run multiple scenarios, we are limited.

