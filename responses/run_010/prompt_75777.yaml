prompt: |-
  I write a fortnightly column for a science-and-ideas desk where readers email me a real decision they're stuck on — usually one where the numbers are known but their gut won't sign off on them — and I try to say something intelligent about whether the gut is right. About half of them turn out to be people defending a cautious choice by saying they're "risk averse", and I honestly can't tell at the moment which of those are making a respectable point and which are just dressing up a probability-weighting quirk or a framing effect. I want to get better at telling them apart, and I think the tool for it is risk-weighted expected utility — the Buchak-style view where a global risk function gets applied to the gamble as a whole rather than everything being reduced to the curvature of a utility function — but I don't want a lecture on it, I want something I can actually run.

  So: write me a procedure I can apply to a reader's submission in about twenty minutes, with no more maths than an A-level, and no chance to email the reader back for clarifcation (one round of questions is the most my editor allows, so the tests have to be answerable from what a reader typically volunteers). I want the questions in order, what counts as a pass on each one, where the procedure terminates with a verdict of "this isn't risk-sensitivity at all", and where it hands the decision back to values because no amount of consistency-checking settles it.

  Some things it has to handle, because they're exactly where I currently get lost:

  - The four or five look-alikes that readers call risk aversion and that the procedure should be able to separate out — diminishing marginal utility of money, narrow framing and probability weighting, aversion to unknown rather than quantified probabilities, and whatever the honest case for genuine global risk-sensitivity actually is. Each needs its own tell.
  - The representation-theorem problem: if any coherent enough set of preferences can be redescribed as expected-utility maximisation with a suitably bent utility function, my procedure can't just declare someone "really" risk-weighting rather than utility-curving. Tell me what work the distinction is still doing, or tell me to drop it.
  - The calibration trap — the argument that refusing small bets at these odds commits you to refusing preposterous large bets, or to refusing tiny bets you'd obviously take. A reader who declines a small one-off risk and also declines a small repeated one isn't in the same position, and the procedure needs to treat those differently rather than scoring both as caution.
  - The dynamic-choice objection: global risk-sensitivity gives up the sure-thing principle, so it's vulnerable to being money-pumped or to changing its mind once a gamble is partly resolved. Where in my procedure does that actually bite, and what do I tell a reader whose stance only survives because they're never going to face the same bet twice?

  Then run it on three submissions I've invented but which are close enough to real ones that they'll keep recurring: (1) a reader in their late sixties offered an elective operation with roughly a 2% chance of a permanent serious complication and good odds otherwise, who has refused and wants to know whether that was cowardice or good sense; (2) a reader who won't cycle to work because of a roughly one-in-fifty-thousand-per-trip fatality risk but drives the same route daily, and describes this as a coherent philosophy of risk; (3) a school governor who campaigned hard against a new playing surface over a small chance of a rare reaction in one child, and who cheerfully supports the same kind of surface across the borough's other schools — I rather like this governor and I'd prefer the procedure to side with them, so please be straight with me if it doesn't.

  Mark clearly which steps are judgement calls wearing a procedural costume, and finish with what the procedure simply cannot do for me — where I have to stop writing and say the case is undecidable. Please write the whole thing in British English, and don't give me a bibliography or citations: I can't check them from here and I'd much rather you left them out entirely than guessed.
reasoning: |-
  We are creating a procedure to distinguish between different types of "risk aversion" that readers might be exhibiting. The goal is to determine whether the reader is:
    (A) exhibiting diminishing marginal utility of money (or utility curvature in general),
    (B) narrow framing and probability weighting (like in prospect theory),
    (C) aversion to unknown probabilities (ambiguity aversion),
    (D) genuine global risk sensitivity (Buchak-style), or 
    (E) something else (like a framing effect or an error).

   The procedure must be applied in about 20 minutes with no more than A-level maths and without additional clarification from the reader beyond what they have already provided.

   Steps should be in order, with termination points and clear criteria for each.

   The procedure must also handle:
    - The representation theorem: we note that any coherent preference can be represented by a utility function and probability weighting, but the distinction between (A) and (B, D) is in the interpretation and the way the decision is made. We are looking for patterns that are more naturally explained by one than the other. In particular, we are interested in whether the risk attitude is context-dependent (which might point to framing or probability weighting) or if it is a consistent global attitude (which might point to risk-weighted expected utility). Also, we note that risk-weighted expected utility (RWEU) uses a risk function that is applied to the cumulative distribution, which can lead to violations of the independence axiom (and hence the sure-thing principle) and dynamic inconsistency.

    - The calibration trap: we must distinguish between one-off and repeated bets. Also, we note that declining a small bet at given odds does not necessarily commit the agent to declining a large bet if the utility function is curved (due to diminishing marginal utility). However, if the agent declines a small bet that is favorable and also declines a repeated version of the same bet (which by the law of large numbers should be accepted), then that points to probability weighting or risk sensitivity.

    - Dynamic-choice objection: we must check if the decision would change if the gamble were broken into stages (which might reveal money-pumping opportunities). But note: we cannot actually run a money pump on the reader. Instead, we can ask hypotheticals about staged decisions if the reader's description allows, but we have to work with what they've given.

   The procedure:

   Step 1: Check for Ambiguity Aversion
     - Ask: Are the probabilities in the decision well-known and based on data, or are they rough estimates or unknown?
       (But note: we cannot ask the reader now. We must infer from what they have written.)
     - If the reader has expressed discomfort because the probabilities are not known precisely, or if they mention that the risk is "uncertain" or "unquantifiable", then ambiguity aversion is a candidate.
     - If the decision involves known probabilities (like the 2% in the operation, or the 1 in 50,000 for cycling) then ambiguity aversion is less likely.

     Verdict: 
       - If the probabilities are unknown and the reader is averse because of that, then mark as ambiguity aversion (C) and stop. 
       - Otherwise, proceed to Step 2.

   Step 2: Check for Narrow Framing and Probability Weighting
     - Narrow framing: is the reader considering this decision in isolation, without considering the broader context of their life and other risks?
     - Probability weighting: does the reader seem to overweight small probabilities (like the 2% or the 0.002%)? 
       This can be checked by:
          a. Compare to a similar situation with a larger probability. For example, if they refuse a 2% chance of a bad outcome, would they also refuse a 40% chance? 
          b. Check if they are neglecting the base rate or the long-run frequency.

     However, without being able to ask, we must look for clues in the description.

     - If the decision is described in a way that focuses on the rare event and its emotional impact, and if the reader is ignoring the fact that they face similar risks routinely (like in the cycling vs driving case), that suggests narrow framing and probability weighting.

     - Also, if the reader is making a decision that is inconsistent with their other risks (like driving while avoiding cycling) and the probabilities are known, then it might be probability weighting (if the fatality risk is over-weighted) or it might be a misperception of probabilities.

     - The calibration trap: 
          For a one-off small bet: declining is consistent with both diminishing marginal utility and risk sensitivity. 
          For repeated bets: if the reader would decline the same bet even if it were repeated many times (and they are not bankrupted by one loss) then that points away from diminishing marginal utility and towards probability weighting or risk sensitivity.

          Example: 
            Operation: one-off, so repetition doesn't apply. 
            Cycling: repeated (daily), so if the reader is refusing a favorable repeated bet, that is suspicious.

     Verdict:
       - If the reader is overweighting a small probability and making the decision in isolation (ignoring other risks or the repetition) then mark as narrow framing and probability weighting (B) and stop.
       - Otherwise, proceed to Step 3.

   Step 3: Check for Diminishing Marginal Utility (DMU)
     - This is about the curvature of the utility function. It is most relevant when the stakes are large relative to the reader's wealth.

     - Ask (in our own mind): are the outcomes described in terms of money, and if so, are the amounts large enough to cause a significant change in the reader's wealth? 
          For example, a gamble that could win or lose £1000 for someone with £10,000 wealth is significant. But a gamble that wins or loses £10 for the same person is not.

     - Without money, for health or life: diminishing marginal utility still applies (e.g., the difference between being healthy and having a minor injury might be less than between having a minor injury and a major one). But we need to see if the outcomes are spread over a range where utility is curved.

     - The calibration argument: 
          If the gamble is in money and the stakes are small, then declining a favorable bet (positive expected value) cannot be explained by DMU because for small stakes the utility function is approximately linear. 
          But note: the reader might be loss averse (which is a form of probability weighting) or risk sensitive.

     - For the operation case: the outcomes are health states. We have to consider if the utility of health is linear? Probably not, but we need to see if the curvature is responsible.

     - How to test without asking? 
          We can look at the reader's other choices. If they are consistently risk averse in large-stakes situations but risk neutral in small-stakes, that points to DMU. 
          But we don't have that data.

     - Alternative: if the gamble is symmetric (like a coin flip for a fixed amount) and the reader declines even though the expected value is positive and the stakes are small, then DMU is unlikely to be the explanation.

     Verdict:
       - If the outcomes are monetary and the stakes are small (relative to the reader's wealth) and the reader declines a positive-EV bet, then DMU is unlikely -> proceed to Step 4.
       - If the outcomes are non-monetary and the range of outcomes is large (e.g., from death to perfect health) then DMU is almost certainly present, but that doesn't rule out other factors. We proceed to Step 4 to check for global risk sensitivity.

   Step 4: Check for Genuine Global Risk Sensitivity (RWEU)
     - This is characterized by a consistent attitude towards risk that is captured by a risk function applied to the entire distribution. It violates the independence axiom (the sure-thing principle) and can lead to dynamic inconsistency.

     - How to check without asking multiple questions?
          We look for two things:
            a. Violation of the sure-thing principle: would the decision change if we split the gamble into stages? 
