answer: |-
  Below is a step-by-step procedure to analyse reader submissions on "risk aversion". It's designed to run in ≈20 minutes using only the information typically volunteered (no follow-ups). The goal is to distinguish between five common look-alikes:  
  - **A**: Diminishing marginal utility (genuine sensitivity to stake size)  
  - **B**: Probability weighting/framing effects (e.g., overweighting small risks)  
  - **C**: Ambiguity aversion (fear of unknown probabilities)  
  - **D**: Global risk sensitivity (Buchak-style risk-weighted utility)  
  - **E**: Other factors (values, emotions, biases)  

  **Key Rules**:  
  - Proceed step-by-step. Stop early if a clear signal emerges.  
  - If a step can’t be answered from the submission, skip it.  
  - "Undecidable" means the gut *might* be defensible, but your procedure can't verify it.  

  ---

  ### **The Procedure**  
  **Step 1: Ambiguity Check**  
  *Purpose: Rule out aversion to poorly defined probabilities (C).*  
  - **Ask internally**: *Does the reader emphasise uncertainty about the odds?* (e.g., "no one knows the real risk", "the probabilities are guesses").  
  - **Pass (C)**: If YES.  
  - **Fail**: If probabilities are presented as data-driven (e.g., "2% complication rate", "1 in 50,000 chance"). → Proceed to Step 2.  

  **Step 2: Repetition & Scale Test**  
  *Purpose: Rule out probability weighting (B) by checking if caution persists when risks are repeated or scaled.*  
  - **Ask internally**:  
    - *(2a) Is this a repeated risk?* (e.g., daily commute, yearly screenings).  
    - *(2b) Would the reader accept aggregating identical small risks?* (e.g., "Would you take 100 of these bets at once?").  
    - *(2c) Would they accept a tiny-stakes version?* (e.g., "Would you risk £1 for a £10,000 gain at the same odds?").  
  - **Pass (B)**: If the risk is repeated **(2a YES)** *and* the reader refuses aggregation **(2b NO)**.  
  - **Also Pass (B)**: If they refuse a tiny positive-EV bet **(2c NO)** despite no wealth effects.  
  - **Fail**: If none apply. → Proceed to Step 3.  

  **Step 3: Utility Curvature Check**  
  *Purpose: Rule in/out diminishing marginal utility (A) by assessing stake size.*  
  - **Ask internally**:  
    - *Are the stakes large relative to their life?* (e.g., "losing 50% of savings", "permanent disability").  
    - *Is the outcome nonlinear?* (e.g., death vs. £1M loss—death is binary, money isn’t).  
  - **Pass (A)**: If stakes are life-altering *and* outcomes have clear diminishing returns (e.g., health declines, large wealth losses).  
  - **Fail**: If stakes are small/non-monetary *or* outcomes are binary (e.g., death/injury). → Proceed to Step 4.  

  **Step 4: Sure-Thing Principle Test**  
  *Purpose: Check for global risk sensitivity (D) by probing dynamic consistency.*  
  - **Ask internally**: *Would the reader reverse their choice if the risk were split into stages?* (e.g., "If the gamble happened in two parts, would you opt out midway?").  
  - **Also ask**: *Is their risk attitude context-dependent?* (e.g., "I accept this risk elsewhere but not here").  
  - **Pass (D)**: If they’d reverse mid-gamble **OR** accept identical risks in other contexts.  
  - **Fail**: If no inconsistency. → Proceed to Step 5.  

  **Step 5: Other Values Check**  
  *Purpose: Flag non-risk factors (E).*  
  - **Ask internally**:  
    - *Is emotion driving this?* (e.g., "I feel terrified", "I’d never forgive myself").  
    - *Are moral values involved?* (e.g., "It’s irresponsible", "My duty to avoid harm").  
    - *Is status quo bias evident?* (e.g., "Better safe than sorry" without cost analysis).  
  - **Pass (E)**: If any YES.  
  - **Undecidable**: If all NO *or* insufficient data.  

  ---

  ### **What the Procedure Cannot Do**  
  1. **Resolve the representation theorem problem**: The A vs. D distinction is *pragmatic*, not mathematical. Use:  
     - **A** if stakes dominate and choices scale with wealth.  
     - **D** if choices violate independence (e.g., Step 4) *without* emotional/moral drivers.  
     *(Why it works: RWEU’s risk function violates dynamic consistency, while utility curvature doesn’t.)*  

  2. **Handle omitted variables**: If the reader hasn’t shared stakes, probabilities, or emotions, the procedure may misclassify.  

  3. **Override values**: If Step 5 reveals moral/emotional drivers, the gut may be valid—but it’s not "risk aversion".  

  ---

  ### **Applied to Your Cases**  
  **Case 1: Elective Operation (2% complication risk)**  
  - Step 1: Probabilities clear → **Fail**.  
  - Step 2: One-off risk → **Fail (2a NO)**. Tiny-stakes test inapplicable (health isn’t scalable).  
  - Step 3: Stakes life-altering (disability) → **Pass (A)**. **Verdict: Genuine diminishing utility of health.**  

  **Case 2: Cycling Refusal (1/50,000 risk) but Drives**  
  - Step 1: Probabilities clear → **Fail**.  
  - Step 2: Repeated risk (daily trips) → **Pass (B)**. Reader refuses aggregation (driving daily is equivalent to aggregated risk, yet they accept it). **Verdict: Probability weighting/framing effect.**  

  **Case 3: School Governor (Opposes Surface at Own School, Supports Elsewhere)**  
  - Step 1: Probabilities clear → **Fail**.  
  - Step 2: Not repeated → **Fail**.  
  - Step 3: Stakes binary (child’s reaction) → **Fail**.  
  - Step 4: Attitude context-dependent (accepts identical risk elsewhere) → **Pass (D)**. **Verdict: Global risk sensitivity.**  
    *(Why not E? No emotion/morality cited. D fits: responsibility amplifies local risk aversion, but delegated risk is tolerable. Dynamic inconsistency is classic RWEU.)*  

