  To respond, I should address both the objection's validity and possible defenses. Practitioners might argue their measures are minimal or conservative, not full utility functions. For example, attainable utility (AU) uses a fixed set of auxiliary goals, which isn't a complete utility function. Relative reachability focuses on reachable states, not all possible, reducing the valuation scope. These are attempts to be parsimonious, avoiding comprehensive ethics.

  However, the objection stands that even a minimal set implies some values. AU's auxiliary goals need selection, which involves normative choices. The user might be pushing for honesty here—admit that some ethics is inevitable. The practitioner's response could be that these are "weak" assumptions, like valuing existing capacities, which might be less controversial than specifying full preferences.

