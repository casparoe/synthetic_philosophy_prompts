prompt: |-
  ok so this has been eating at me for like two months and I can't figure out what I'm supposed to think about it.

  I'm a junior. I'm good at chem and bio, like weirdly good, and last year our school's after-school tutoring program got cut when the district lost a chunk of funding, so a bunch of freshmen were just failing. I started staying late on tuesdays to help them. Free. Nobody asked me to, there was no form, no volunteer hours, no award, I just did it because it felt dumb not to.

  Word got around. Now it's like 14 kids every tuesday. Two other juniors show up sometimes but mostly it's me and I'm the one who knows where the practice tests are. In the fall our counselor put it in the school newsletter and called it "our peer tutoring program" and my name is on the spring sign-up sheet, and she told some scholarship committee that I *run* it, which I don't, I just show up.

  Here's the thing. I got a job. Saturday shifts at a garden center, and I actually need the money because my mom's hours got cut in January. Tuesday after school is the only extra shift they'll give me. So I have to stop the tutoring. There's no version where I do both.

  When I told my counselor she went really quiet and then said "well, we'll figure something out," in a voice that meant we won't. The freshmen have their midterm in three weeks. One of the kids texted me "wait are you actually leaving??" like I broke a promise to him. I never promised anything. I never signed up for anything. I did this because it was extra and I wanted to.

  But I feel worse than I would if I had actually made a promise and broken it. My dad says I'm not responsible for a thing I volunteered for, and that the school is using me as an excuse to not pay a real tutor, and honestly he might be right about that part. My best friend says that once people depend on you it doesn't matter what you originally agreed to, and "but it was extra!" isn't a defense.

  So — is it actually wrong for me to quit, or do I just feel bad? And how did doing something that nobody could have demanded of me turn into something I'm now expected to do and get treated like a jerk for not doing? If I'd never started I'd be completely in the clear, which basically means I'm worse off for being the one who helped. Does that mean I shouldn't have started? Do you tell people not to do the good thing because of how it ends?

  Also small thing but I keep thinking about it: do I have to go tell the scholarship people that I don't run the program? I didn't lie. I just didn't correct her.
reasoning: |-
  Okay, let me unpack this. The user is a junior who started tutoring freshmen voluntarily after school funding cuts. It grew organically, the school institutionalized it without their consent, and now they need to quit for a paid job. They're wrestling with guilt, perceived obligation, and ethical gray areas.

  First, the core tension: voluntary help morphing into institutional expectation. The user never signed up for a formal role - they just filled a gap. Now the system treats them as replaceable infrastructure. That's deeply unfair. The dad's point about the school exploiting free labor feels spot-on; the counselor's reaction confirms they have no backup plan.

  The moral weight hits hardest with the freshman texting "are you leaving??". That's where the user's empathy clashes with self-interest. But the best friend's argument about dependence feels manipulative - it implies volunteers can never exit, which would create unsustainable burdens. 

  Scholarship committee disclosure is simpler: it's about future integrity, not past deception. The user didn't lie, but allowing the misconception to continue could backfire if the committee checks references. Proactive correction protects their reputation.

  Underlying all this is a meta-question: does helping make you vulnerable to exploitation? The answer isn't "don't help," but "help with boundaries." Maybe future efforts could involve clear exit plans or co-leadership from the start.

  Practical steps emerge: give notice with resources (practice test locations), redirect guilt toward the school's failure to sustain the program, and document the scholarship clarification. The user's kindness wasn't wrong - the system's lack of support is.
answer: |-
  This is an incredibly thoughtful and mature set of questions, and the guilt you're feeling speaks volumes about your character. Let's break this down:

  **1. Is it wrong for you to quit?**
  **Absolutely not.** Here's why:

  *   **You created something valuable out of pure goodwill.** You saw a need and filled it without expectation of reward. That's commendable, not a life sentence.
  *   **Your circumstances changed.** Your family needs financial stability. Prioritizing a paying job that helps your household is responsible and necessary. "Extra" becomes unsustainable when basic needs are at stake.
  *   **You never made a formal commitment.** No application, no contract, no promise of long-term availability. You simply showed up. The school formalizing your *informal* act doesn't retroactively bind you indefinitely.
  *   **The responsibility lies with the school.** Your dad is likely right. The school saw free, effective help and institutionalized it *without your input or a sustainability plan*. They are responsible for student support services, not a student volunteer whose situation changes. Their lack of a backup plan is *their* failure, not yours.
  *   **"Dependence" doesn't create obligation.** Your friend's point about dependence is understandable but flawed. While it's natural to feel bad when people rely on you, dependence created *by the school's inaction* doesn't obligate you to sacrifice your own needs indefinitely. Healthy systems don't rely on unsustainable, unpaid student labor.
  *   **Burnout is real.** Even without the job, sustaining this level of unpaid effort long-term is exhausting. Quitting now prevents resentment and preserves the positive impact you *did* have.

  **2. Why does it feel like you're expected to do it/being treated like a jerk?**
  This is a painful lesson about how systems (even well-intentioned ones) exploit goodwill:

  *   **The "Foot in the Door" Phenomenon:** Small, voluntary acts can be perceived as precedents. Once something valuable exists, people (especially institutions) take it for granted and resist it disappearing.
  *   **Institutional Convenience:** The school saw a solution to their problem (funding cut) that cost them nothing. They happily co-opted your effort ("peer tutoring program") without considering your agency or longevity. It's easier to rely on you than to find a real solution.
  *   **Shifted Burden:** By framing it as "your" program (even unofficially), the school subtly shifted the responsibility for these students' success *onto you*, absolving themselves. When you leave, *their* failure becomes visible, and the discomfort manifests as pressure on you (counselor's reaction, student texts).
  *   **Ungratefulness vs. Entitlement:** Some students may genuinely feel anxious about losing support (understandable). Others might develop an entitled expectation because the help was always there. The counselor's reaction suggests an institutional sense of entitlement to your free labor.

  **3. Does this mean you shouldn't have started? Should we avoid "good things"?**
  **NO. Absolutely not.**

  *   **You made a real difference.** For months, you helped students who would have struggled far more without you. That matters.
  *   **The problem isn't the good deed; it's the unsustainable system.** The flaw lies with the school exploiting your kindness and failing to build a resilient support structure. *They* are the ones who turned your generous act into an expectation.
  *   **The lesson is about boundaries and sustainability, not abstinence from kindness.** Future acts of goodwill can be structured differently: clarify it's temporary, involve others from the start to share the load, insist the school provides resources if it becomes "official," protect your own time and needs. Kindness doesn't mean self-sacrifice to the point of harm.

  **4. The Scholarship Committee: Do you need to tell them?**
  **Yes, you should inform them.** Here's why and how:

  *   **Why:** Integrity and self-protection. While you didn't lie initially, allowing them to believe you currently "run" a program you are leaving is misleading. If they verify later (e.g., call the counselor), the discrepancy could damage your credibility and potentially jeopardize the scholarship or future opportunities. Being proactive shows honesty.
  *   **How:** Contact the counselor who submitted your name *immediately*. Say something like:
      > "Ms. [Counselor's Name], regarding the information you provided to the [Scholarship Name] committee stating I 'run' the peer tutoring program: I need to clarify the situation. I initiated an informal tutoring effort last year to help fellow students when funding was cut. While I'm proud of the help provided, it was always a voluntary, informal arrangement I did alongside my studies. Due to a necessary paid work commitment required for my family's circumstances, I am unfortunately no longer able to continue tutoring after [Date]. Therefore, I do not currently 'run' the program. I wanted to ensure the committee has accurate information. I'd be happy to discuss my initial role and reasons for stepping back with them if needed."
  *   **Focus:** Be factual, calm, and emphasize the *change in circumstance* and the *informal nature* of your original role. This isn't about blaming the counselor (though they messed up), it's about correcting the record ethically.

  **What to Do Now:**

  1.  **Commit to Leaving:** Give yourself permission. Your reasons are valid and necessary.
  2.  **Give Clear Notice:** Announce your last tutoring date to the students (e.g., "My last session will be on [Date]"). Thank them for their hard work.
  3.  **Leave Resources:** Give the counselor (or a responsible teacher) the locations of the practice tests and any other materials you used. Say, "Here are the resources I've been using to help the students."
  4.  **Redirect:** When students express concern, gently but firmly redirect them to the school: "I understand it's stressful. Please talk to Ms. [Counselor] about what support the school will have in place after I leave." Don't engage in debates about your decision.
  5.  **Contact the Scholarship Committee:** As outlined above.
  6.  **Be Kind to Yourself:** You did something remarkable. Leaving doesn't diminish that. Feeling bad shows you care, but don't let misplaced guilt override your necessary decision. The system failed, not you.

  You stepped up when others didn't. Now, you need to step back for your own necessary reasons. That doesn't erase the good you did; it highlights the lack of support structures that forced a student to fill a gap the school should have covered. Hold your head high – you've learned a hard lesson about generosity and institutional responsibility, but you absolutely did the right thing by starting *and* you are absolutely doing the right thing by leaving.
