answer: |-
  Below is a close reading focused solely on your excerpts, addressing each question sequentially. The analysis hews strictly to Peirce’s text, with plain-English translations at the end.

  ---

  ### 1. **The "two terms instead of one" charge**  
  Peirce claims the **conceptualist** views probability as a property of *a single event* ("the degree of belief which ought to attach to a proposition" about an event). This is "one term": the event itself.  
  The **materialist** (Peirce’s view) sees probability as a *ratio between two classes*: the frequency of a specific outcome ("species") relative to a broader set of conditions ("genus"). This requires "two terms": species and genus.  

  - **What the conceptualist misses**: Probability isn’t an intrinsic property of an event but a *relation* between event-types. The conceptualist’s "one term" ignores the reference class (genus) that defines the denominator.  
  - **The second term’s role**: It is a **reference class** (the genus) that contextualizes the probability. Without it, the ratio is undefined. Peirce implies the conceptualist commits a **category mistake** by treating probability as a property of an isolated event rather than a statistical relation.  

  ---

  ### 2. **Probability "belongs exclusively to consequences" vs. ratio of co-occurrences**  
  No fundamental tension exists—just unfamiliar vocabulary:  
  - **"Consequence"** = the *logical rule* (leading principle) that links antecedent to consequent.  
  - **Probability attaches to this rule**: It measures how reliably the antecedent *implies* the consequent.  
  - **But the rule’s probability is quantified by frequencies**: The ratio counts how often the rule *holds* (antecedent + consequent) vs. how often the antecedent *occurs*.  

  **Why it coheres**: The "consequence" (rule) is probabilistic *because* it describes a pattern in events. The ratio *is* the probability *of the rule*. Events are raw data; probability emerges from their aggregation.  

  ---

  ### 3. **Is the calculus neutral? Would a degree-of-belief theorist accept the addition rule?**  
  - **Peirce’s view**: Rules like addition are **deduced from the frequency definition**. They are mathematical corollaries of the ratio.  
  - **Conceptualists might accept the rule formally** but ground it differently (e.g., in coherence of beliefs).  
  - **The core dispute**: Not the calculus itself, but **what probabilities represent**. For materialists, probabilities *are* frequencies; for conceptualists, they *guide* beliefs. The addition rule works mathematically for both, but its *meaning* differs:  
    - Materialist: "When antecedents occur, 60% yield consequent A, 20% consequent B → 80% yield A-or-B."  
    - Conceptualist: "Given the same data, I should have 0.8 credence in A-or-B."  
  **What’s left of the dispute**: Whether probability is an *objective feature of the world* (materialist) or a *subjective/epistemic state* (conceptualist).  

  ---

  ### 4. **"Cases equally possible" vs. "cases equally frequent"**  
  Peirce objects on **two grounds**:  
  - **Vagueness**: "Equally possible" is undefined without prior probability assumptions (circularity). What makes cases "equally possible" if not observed symmetry or frequency?  
  - **Smuggling in probability**: Equipossibility *presumes* a probability distribution (e.g., a fair die has equal possibility because of symmetry/frequency). Thus, conceptualists use probability to *define* probability.  
  **Contrast’s weight**: This substitution is the **pivot of the debate**. Materialists avoid circularity by defining probability via observable frequencies; conceptualists rely on undefined, potentially subjective notions of "possibility."  

  ---

  ### 5. **Single, non-repeatable death: Meaningful probability?**  
  **Peirce’s framework makes single-case probability *meaningless* as a direct frequency.**  
  - Probability is a ratio *over a class*: It describes patterns, not individuals.  
  - A single death has **no probability in itself**; it either happens or doesn’t.  
  - The character’s crisis: Her tables gave probabilities *for classes*, but **no frequency ratio applies to a unique event**. The death wasn’t "improbable"—it was *outside the scope* of probabilistic prediction. The "leading principle" (mortality table) described a pattern; the death was a deviation from that pattern, not a probability failure.  
  **Narrator’s implication**: The character’s worldview breaks because she realizes probability was never *about* individuals—only aggregates. The one death exposes the framework’s *descriptive* (not predictive) nature.  

  ---

  ### 6. **Reference class problem: Does interest-relativity let conceptualism back in?**  
  **Strongest objection**: If the genus (reference class) is chosen by the inquirer’s interests, doesn’t this reintroduce subjectivity? Material facts don’t dictate whether we classify "40-year-old sailors" under "sailors," "40-year-olds," or "humans."  
  **Peirce’s best textual reply** (from the excerpt):  
  - Probability is tied to "*arguments of any genus*" and "*consequences*" (rules). The choice of genus must align with a **valid logical rule** (e.g., "all sailors" or "all 40-year-olds").  
  - The ratio is **fixed by material facts** once the genus is chosen. Interests may *select* the genus, but the probability itself is **objective** for that genus.  
  **Limitation**: The excerpt doesn’t resolve this. Peirce implies genera are logical categories, but offers no constraint beyond "truth of the class of inferences." The door cracks open for epistemic factors.  

  ---

  ### Plain-English Translation of the Second Extract  
  > Probability is often seen two ways. The "materialistic view" (Venn’s term) defines it as a fact: how often one thing happens with another. The "conceptualistic view" defines it as how strongly we *should* believe something. Most writers mix these: they start by saying probability is a reason for belief (conceptualistic), but then say it’s a ratio of favorable cases to all possible cases. This ratio is almost the materialistic view—except it swaps "equally frequent" for the muddy idea of "equally possible." The key difference? Conceptualists tie probability to a single event. Materialists tie it to a ratio comparing a subgroup to a larger group—so it has two parts, not one.  

  ---

  ### Common Pitfalls for Untrained Readers  
  1. **"Consequence" ≠ outcome**: It’s the *logical rule* linking premises to conclusions (e.g., "If X, then usually Y").  
  2. **Probability "belonging to consequences"**: This doesn’t make probability abstract—it’s still computed from events, but as a property of the *rule*, not individual cases.  
  3. **"Antecedent/consequent"**: Read as "premise" and "conclusion" of an argument, *not* temporal cause/effect.  

  --- 

  ### Summary for Your Character’s Crisis  
  Per these excerpts, **Peirce denies single events have probabilities**. The death wasn’t improbable—it was *invisible* to the framework. Her life’s work measured patterns, not fates. The tension isn’t in the math but in the *object*: probabilities describe rules (species/genus ratios), not individuals. Her crisis rests on a category error—seeking a "probability" where the theory assigns none. The reference-class problem amplifies this: her tables were always interpretations of data, not mirrors of reality.
