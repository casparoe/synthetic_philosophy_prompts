  ### Bottom-Line Prediction & Recommendation  
  **Prediction:** The panel will select disposition **(c)** (restore with sensitivity notice + strip from algorithmic surfaces) with **70% confidence**.  
  **Recommendation:** Disposition **(b)** (restore with sensitivity notice only) best achieves coherence.  

  ---

  ### A. Candidate Rules  
  *Four decision rules tested against all nine precedents (✓ = clean fit, ~ = strained fit, ✗ = contradiction):*  

  1. **Rule A1 (Speaker Standing + Intent)**  
     *"Remove only if the speaker (a) lacks membership in the targeted group AND (b) manifests animus or recklessness toward the group."*  
     - Case 1: ✓ (Member, affectionate: restored)  
     - Case 2: ✓ (Member, but objection shows harm: upheld)  
     - Case 3: ✓ (Non-member animus, but quoted: restored → *strains* animus requirement)  
     - Case 4: ✗ (Non-member, no animus cited: upheld → *contradicts* lack of animus)  
     - Case 5: ✓ (Instructor, pedagogical: restored)  
     - Case 6: ✓ (Non-member, targeted: upheld)  
     - Case 7: ~ (Comedian, performative; restored with notice → *strains* animus assessment)  
     - Case 8: ✗ (Non-member, no animus: upheld → *contradicts* animus requirement)  
     - Case 9: ~ (Journalist, news context → *strains* speaker standing focus)  

  2. **Rule A2 (Strict Use/Mention + Form)**  
     *"Remove only if the word is *used* (not mentioned) with its full orthographic form, regardless of context."*  
     - Case 1: ✗ (Used affectionately: restored → *not mentioned*)  
     - Case 2: ✗ (Used derogatorily: upheld → *not mentioned*)  
     - Case 3: ✓ (Quoted: mentioned, restored)  
     - Case 4: ✗ (Quoted but unnecessary: upheld → *treats as use*)  
     - Case 5: ✗ (Asterisked: mentioned → restored, but *form altered*)  
     - Case 6: ✓ (Digit-masked but targeted: upheld as "use")  
     - Case 7: ✗ (Used in character: partially restored → *not pure mention*)  
     - Case 8: ✗ (Used descriptively: upheld → *not mentioned*)  
     - Case 9: ✓ (Quoted in news: restored with notice → *mentioned*)  

  3. **Rule A3 (Necessity + Harm Mitigation)**  
     *"Remove if (a) the word is not strictly necessary to the communicative purpose AND (b) its inclusion risks harm to the targeted group."*  
     - Case 1: ✓ (Necessary for affection; low harm: restored)  
     - Case 2: ✓ (Harm from objection: upheld)  
     - Case 3: ✓ (Necessary as evidence; restored)  
     - Case 4: ✓ (Unnecessary; harm risk: upheld)  
     - Case 5: ✓ (Necessary pedagogy: restored)  
     - Case 6: ✓ (Unnecessary obfuscation; harm: upheld)  
     - Case 7: ~ (Artistic necessity; harm mitigated via notice → *fits*)  
     - Case 8: ✓ (Unnecessary description; harm risk: upheld)  
     - Case 9: ✓ (Necessary news; harm mitigated: restored with notice)  

  4. **Rule A4 (Reception Context + Scale)**  
     *"Remove if the word reaches a broad, non-consenting audience (including minors/vulnerable groups) without robust safeguards."*  
     - Case 1: ✓ (Restricted group: restored)  
     - Case 2: ✓ (Restricted but harmed member: upheld)  
     - Case 3: ✓ (Evidence for report: restored)  
     - Case 4: ✓ (Public argument: upheld)  
     - Case 5: ✓ (Closed group: restored)  
     - Case 6: ✓ (Open thread: upheld)  
     - Case 7: ✓ (Public performance; notice + de-amplification → *fits*)  
     - Case 8: ✓ (Small group but non-member speaker: upheld → *strains* scale focus)  
     - Case 9: ✓ (Large audience; notice added → *fits*)  

  ---

  ### B. Survivors  
  Only **Rule A3 (Necessity + Harm Mitigation)** survives all precedents without contradiction.  
  - **Pending appeal**: The word is *necessary* for journalistic integrity (sanitizing weakens evidence), but harm risk is high (large non-consenting audience). Rule A3 selects **(c)** (restore with notice + de-amplify) to mitigate harm while allowing necessity.  

  **Rule A4 (Reception Context)** almost survives but strains on Case 8 (small group upheld). If adjusted to include speaker-group dynamics, it would select **(c)** for the appeal.  

  ---

  ### C. Prediction  
  The panel will choose **(c)** (restore with notice + strip from algorithms).  
  - **Confidence**: 70% (leaning toward compromise).  
  - **Reason**: Precedent 9 (news headline) and 7 (comedy) show tolerance for necessary reproductions with harm mitigation. The trending amplification mirrors Case 7’s algorithmic reach. Rule A3 best explains the panel’s pattern, balancing necessity and harm.  

  ---

  ### D. Recommendation  
  **Disposition (b)** (restore with sensitivity notice only) is most coherent.  
  - **Closest analog**: **Case 3** (verbatim quote as evidence) → Both involve evidentiary quoting.  
  - **Underdetermination**: The record doesn’t resolve whether algorithmic reach *alone* justifies de-amplification.  
  - **Commitments per disposition**:  
    - **(a) Uphold removal**: Commits to treating *all* unredacted quotes as "use," overruling Cases 3 and 9.  
    - **(b) Restore with notice**: Commits to necessity overriding broad dissemination if harm is warned.  
    - **(c) Restore + de-amplify**: Commits to algorithmic exposure as an independent harm factor.  
    - **(d) Restore outright**: Ignores non-consenting audience harm, contravening Cases 4, 6, and 8.  

  ---

  ### E. Theoretical Tension  
  **Coherent account**: Slurs contribute **presupposition of contempt** + **expressive force**.  
  - **Case 3 (quotation)** : Presupposition suspended (mention); force inert.  
  - **Case 5 (asterisks)** : Orthographic disruption nullifies presupposition; force defused.  
  - **Case 6 (digits)** : Presupposition active (targeted intent); force preserved via context.  
  - **Case 8 (no animus)** : Presupposition *requires* contempt convention, not speaker intent → Rule violation.  
  - **Inconsistency**: Case 6’s "obfuscation ≠ mention" clashes with Case 5. Case 6 is the weakest link; asterisks/digits should be treated identically.  
  - **Best fit**: **Presuppositional account** (contempt encoded conventionally). Fit is **unstable**—Case 8’s "animus irrelevant" strains expressive theories.  

  ---

  ### F. Discriminating Case  
  **Scenario**: *A non-member historian posts an unredacted 19th-century political speech containing the word in a public educational thread. The speech is critical to understanding systemic oppression. Minors and targeted group members access it.*  
  - **Discrimination mechanism**:  
    - **Rule A3 (Necessity)**: Restores with notice (necessary pedagogy).  
    - **Rule A4 (Reception)**: Upholds removal (broad non-consenting audience).  
    - **Rule A1 (Speaker Standing)**: Upholds removal (non-member + harm risk).  
  - **Outcome**: Forces choice between pedagogical necessity and audience protection.  

  ---

  ### Final Note  
  The record is coherent under **Rule A3** but frays at Case 6 and Case 8. The pending appeal is genuinely underdetermined; choosing **(b)** prioritizes evidentiary necessity (Case 3), while **(c)** prioritizes harm mitigation (Case 7).
