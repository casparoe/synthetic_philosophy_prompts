     Specifically, let the outcomes be ordered: x1 ≤ x2 ≤ ... ≤ xn.
     The cumulative probability for outcome i is: F_i = P(X ≤ x_i) = p1 + p2 + ... + pi.

     Then, the weight assigned to outcome i is:
        w_i = ρ(F_i) - ρ(F_{i-1})
     where F0 = 0, and ρ is the weighting function (a function from [0,1] to [0,1] that is increasing and satisfies ρ(0)=0, ρ(1)=1).

