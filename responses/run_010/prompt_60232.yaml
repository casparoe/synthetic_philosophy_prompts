  ### Decision Procedure for Project Evaluation via Rank-Weighted Expected Utility

  **Objective**: Replace the flat "catastrophe adder" with a coherent rank-weighted expected utility (RDEU) approach that captures risk attitude through a weighting function applied to the cumulative distribution of outcomes. The procedure must be executable by engineers in ≈4 hours per proposal using a spreadsheet, with a fixed board-chosen weighting function. Output is a one-page board recommendation.

  ---

  ### Procedure Steps and Sufficient Answers

  1. **Enumerate Outcomes and Probabilities**  
     - **Step**: List all possible net benefit outcomes (in $M, present value over project life) and their probabilities. Net benefit = monetized damage avoided minus project cost (from existing model).  
     - **Sufficient Answer**: Mutually exclusive, exhaustive outcomes with probabilities summing to 1. If the model provides continuous distributions, discretize into ≥20 quantile-based outcomes (e.g., 5th, 10th, ..., 95th percentiles) with equal probability weights.  
     - **Judgement Call**: Discretization level. If an outcome has probability >10% and spans a wide benefit range, split it. Stop and escalate if a material outcome (|net benefit| > 10% of project cost) lacks a probability.  
     - **Handoff to Person**: If probabilities are genuinely unavailable for material outcomes, halt and escalate to the board for expert judgment. Proceed only if provided.

  2. **Order Outcomes**  
     - **Step**: Sort outcomes from worst (lowest net benefit) to best (highest net benefit).  
     - **Sufficient Answer**: Ordered list: \(x_1 \leq x_2 \leq \ldots \leq x_n\).

  3. **Compute Cumulative Probabilities**  
     - **Step**: For each outcome \(x_i\), compute cumulative probability \(F_i = P(\text{net benefit} \leq x_i)\).  
     - **Sufficient Answer**: \(F_i = \sum_{j=1}^i p_j\) (with \(F_0 = 0\), \(F_n = 1\)).

  4. **Apply Weighting Function**  
     - **Step**: Using the board’s chosen weighting function \(\rho(p)\), compute weights:  
       \[
       w_i = \rho(F_i) - \rho(F_{i-1}) \quad \text{for} \quad i = 1, \ldots, n.
       \]  
     - **Sufficient Answer**: Weights \(w_i\) for each outcome, summing to 1.

  5. **Calculate Rank-Weighted Value (RWV)**  
     - **Step**: Compute RWV = \(\sum_{i=1}^n w_i \cdot x_i\).  
     - **Sufficient Answer**: Single RWV number.

  6. **Recommendation**  
     - **Step**: If RWV ≥ 0, recommend approval; else, recommend rejection.  
     - **Sufficient Answer**: Clear "Approve" or "Reject" with RWV and key inputs.

  7. **Multi-Year Staged Projects**  
     - **Step**: For projects with future go/no-go decisions:  
       - Model the final project’s net benefits if all stages proceed (using year-0 probabilities).  
       - For each future stage, compute its incremental RWV at the decision point using updated information (e.g., revised probabilities) and the **same** \(\rho(p)\). Assume the future committee approves if incremental RWV ≥ 0.  
       - Roll back: If a future stage would be rejected, set net benefits to reflect sunk costs (e.g., Phase 1 cost with no benefits).  
     - **Sufficient Answer**: Decision tree with RWV for each path and overall RWV.  
     - **Judgement Call**: Handling uncertainty in future committee’s weighting function. The procedure assumes it matches the current \(\rho(p)\). To secure the assumption, require a board resolution noting future intent, but acknowledge this is not legally binding.  
     - **Handoff to Person**: If the future decision involves complex dependencies not captured by the model, escalate.

  8. **Output**  
     - **One-Page Template**:  
       - Project name, cost, funding source (board if >$10M).  
       - Outcomes, probabilities, ordering.  
       - Weighting function \(\rho(p)\) and parameter.  
       - Cumulative probabilities, weights, RWV.  
       - Recommendation: **Approve** if RWV ≥ 0; **Reject** otherwise.  
       - Sensitivity: Parameter change needed to flip decision (if near zero).

  ---

  ### Spreadsheet Implementation
  - **Inputs**: Outcomes (column A), probabilities (B).  
  - **Ordering**: Sort A:B ascending by outcome.  
  - **Cumulative Probability**: Col C: `C1 = B1`, `C2 = C1 + B2`, ..., `Cn = 1`.  
  - **Weighting Function**: Col D: `D1 = ρ(C1) - ρ(0)`, `D2 = ρ(C2) - ρ(C1)`, ..., `Dn = ρ(1) - ρ(C_{n-1})`.  
  - **RWV**: `=SUMPRODUCT(A1:An, D1:Dn)`.  
  - **Handling Many Outcomes**: Use `PERCENTILE.INC` or `QUARTILE` to discretize continuous distributions into 20+ points. Ensure sum of weights ≈1 (tolerance ±0.001).  

  ---

  ### Default Weighting Function and Parameter Guidance
  - **Default Family**: \(\rho(p) = p^\gamma\) (power function).  
  - **Interpretation**:  
    - \(\gamma < 1\): Overweights bad outcomes (risk aversion).  
    - \(\gamma = 1\): Risk-neutral (equivalent to expected value).  
    - \(\gamma > 1\): Overweights good outcomes (risk-seeking).  
  - **Board Guidance**:  
    - Start with \(\gamma = 0.7\) (mild risk aversion). Calibrate using historical decisions:  
      - Select 2–3 past projects where the catastrophe adder flipped the verdict.  
      - Solve for \(\gamma\) that replicates the adder’s outcome under RDEU.  
    - Re-calibrate annually or if risk appetite changes.  

  ---

  ### Outcome Individuation Rule
  - **Rule**: Outcomes must be individuated at the **same granularity as the damage model’s scenarios**. No aggregation of scenarios unless they share identical net benefits.  
  - **Reference Point**: Net benefit = 0 (status quo). Costs/benefits already include baseline comparison.  
  - **Judgement Call**: If the model outputs coarse scenarios (e.g., "high damage" with a wide range), split into sub-scenarios with conservative net benefit estimates.  
  - **Risk of Reversal**: RWV can change if outcomes are split/merged. Mitigate by requiring:  
    - Minimum 10 outcomes per proposal.  
    - Validation: Re-run with 2× granularity; if RWV changes >5%, use finer split.  

  ---

  ### Unavailable Probabilities
  - **Rule**: If a probability for a material outcome (|net benefit| > 10% of project cost) is missing:  
    - **Escalate to board** for expert-estimated probability.  
    - If none provided, **reject the project** (insufficient data).  

  ---

  ### Case Analyses

  #### Case 1: Riverbend Floodwall ($24M)  
  - **Outcomes**:  
    - −$5M (p = 0.03), +$6M (p = 0.80), +$30M (p = 0.17).  
  - **Order**: −5 → +6 → +30.  
  - **Cumulative**: F(−5) = 0.03, F(6) = 0.83, F(30) = 1.0.  
  - **Weights** (\(\rho(p) = p^2\)):  
    - \(w_1 = (0.03)^2 - 0 = 0.0009\)  
    - \(w_2 = (0.83)^2 - (0.03)^2 = 0.688\)  
    - \(w_3 = 1 - (0.83)^2 = 0.3111\)  
  - **RWV**: \(0.0009 \times (-5) + 0.688 \times 6 + 0.3111 \times 30 = -0.0045 + 4.128 + 9.333 = 13.456\)  
  - **Verdict**: **Approve** (RWV > 0).  
  - **Sensitivity**: Flipping to rejection requires RWV < 0. Solves to \(\gamma < 0.13\) (e.g., \(\gamma = 0.12\) → RWV = −0.2).  

  ---

  #### Case 2: Feeder-Hardening Packages ($14M each)  
  - **Conflict**: Analyst 1 treats as one $28M project; Analyst 2 treats as two sequential $14M approvals.  
  - **Analyst 1 (Single Act)**:  
    - **Outcomes**: −$28M (p = 0.25), +$26M (p = 0.50), +$80M (p = 0.25).  
    - **Order**: −28 → +26 → +80.  
    - **Cumulative**: F(−28) = 0.25, F(26) = 0.75, F(80) = 1.0.  
    - **Weights** (\(\rho(p) = p^2\)):  
      - \(w_1 = (0.25)^2 = 0.0625\)  
      - \(w_2 = (0.75)^2 - (0.25)^2 = 0.50\)  
      - \(w_3 = 1 - (0.75)^2 = 0.4375\)  
    - **RWV**: \(0.0625 \times (-28) + 0.50 \times 26 + 0.4375 \times 80 = -1.75 + 13.0 + 35.0 = 46.25\) → **Approve**.  
  - **Analyst 2 (Sequential)**:  
    - **Package 1**: −$14M (p = 0.5), +$40M (p = 0.5).  
      - **RWV**: \(w_1 = (0.5)^2 = 0.25\), \(w_2 = 1 - (0.5)^2 = 0.75\)  
      - RWV = \(0.25 \times (-14) + 0.75 \times 40 = -3.5 + 30 = 26.5\) → **Approve**.  
    - **Package 2** (if Package 1 approved): Identical to Package 1. RWV = 26.5 → **Approve**.  
  - **Procedure’s Resolution**:  
    - Both descriptions are **admissible** (sponsors choose packaging).  
    - Verdicts **do not diverge** for \(\rho(p) = p^2\): Both approve.  
    - **If divergence occurs**: The procedure cannot choose. Committee must decide packaging upfront (e.g., "atomicity" of projects) to avoid sponsor gaming.  

  ---

  #### Case 3: Staged Storage (Phase 1: $9M; Phase 2: $22M in Year 5)  
  - **Year-0 Model for Complete Project**: +$95M (p = 0.4), −$31M (p = 0.6).  
  - **Year-5 Probability Update**: 0.4 → 0.25.  
  - **Phase 2 Incremental Decision in Year 5**:  
    - **Outcomes** (vs. sunk Phase 1): +$104M (p = 0.25), −$22M (p = 0.75).  
    - **Order**: −22 → +104.  
    - **Weights** (\(\rho(p) = p^2\)):  
      - \(w_1 = (0.75)^2 = 0.5625\)  
      - \(w_2 = 1 - (0.75)^2 = 0.4375\)  
    - **RWV**: \(0.5625 \times (-22) + 0.4375 \times 104 = -12.375 + 45.5 = 33.125\) → Assume approval.  
  - **Overall Project from Year 0** (if Phase 2 approved):  
    - **Outcomes**: −$31M (p = 0.6), +$95M (p = 0.4).  
    - **Weights**: \(w_1 = (0.6)^2 = 0.36\), \(w_2 = 1 - (0.6)^2 = 0.64\)  
    - **RWV**: \(0.36 \times (-31) + 0.64 \times 95 = -11.16 + 60.8 = 49.64\) → **Approve Phase 1**.  
  - **Securing the Assumption**:  
    - **Procedure Requires**: Board resolution stating Phase 2 approval is expected if incremental RWV ≥ 0 with year-5 data.  
    - **Risk**: Future committee (with new members) may override. Cannot secure binding commitment; procedure ignores this risk.  

  ---

  ### Limitations and Criticisms  
  1. **What the Procedure Cannot Settle**:  
     - **Coarse Outcome Descriptions**: RWV can reverse if outcomes are split/merged (e.g., combining high-loss scenarios masks tail risk).  
     - **Reference Point Shifts**: Moving from status quo (0) to another baseline (e.g., "expected future losses") alters ordering and RWV.  
     - **Dynamic Risk Attitudes**: Fixed \(\gamma\) may not adapt to changing economic conditions.  

  2. **Economist’s Strongest Attack**:  
     - **Arbitrariness**: "\(\rho(p) = p^\gamma\) is an arbitrary choice. Why not Prelec’s antiexponential function? \(\gamma\) is calibrated to past ad hoc decisions, perpetuating incoherence!"  
     - **Best Honest Reply**:  
       - "The power function is parsimonious, with \(\gamma\) directly controlling risk aversion. It is widely used in RDEU literature for tractability. Calibration to past decisions ensures continuity, but we review \(\gamma\) annually to align with evolving board priorities."  

  3. **Procedural Vulnerabilities**:  
     - **Reversal Under Permissible Changes**: RWV flips if sponsors repackage projects (Case 2) or redefine outcomes.  
     - **Mitigation**: Strict rules for outcome individuation and project atomicity set by the committee, not sponsors.  

  **Conclusion**: This procedure replaces the catastrophe adder with a theoretically grounded, executable method. It exposes normative choices (via \(\gamma\)) to board scrutiny and balances feasibility with robustness. However, it requires vigilance against gaming and periodic review of \(\gamma\) and outcome granularity.
