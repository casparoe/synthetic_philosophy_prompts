  Hmm, the user leads a triage team at a national competition authority and needs a reusable decision procedure to determine if firms are acting together. This is a complex request that blends legal practice with philosophy on joint agency. I need to create something practical that non-philosophers can use, based on theories from Bratman, Searle, Gilbert, and List & Pettit.

  The key requirements are clear: a step-by-step question sequence with exit points, explanations of why certain philosophical approaches are chosen over others, distinctions that must be preserved versus those that can be dropped, and examples of look-alike behaviors. The procedure must also highlight where human judgment is needed and where it will likely conflict with the director's views.

  I'll structure this around Bratman's "Shared Cooperative Activity" framework because it offers the most practical test for regulators - focusing on observable interdependence rather than requiring proof of communication or metaphysical group intentions. This means dropping Searle's requirement for explicit "we-intentions" and Gilbert's joint commitment formalism, while incorporating List & Pettit's insights about algorithmic systems.

  For the procedure itself, I'll build a five-stage funnel: starting with evidence of coordination (Stage 1), then checking for interdependence (Stage 2), mutual responsiveness (Stage 3), plan stability (Stage 4), and finally handling edge cases (Stage 5). Each stage will have explicit exit points and judgment flags. The look-alike behaviors section will focus on common pitfalls like parallel behavior or predictive alignment.

  The three test cases are perfect for showing how the procedure works: fuel retailers (pure algorithmic alignment), bank traders (ambiguous communication), and supermarkets (third-party algorithm). I predict the supermarket case will be controversial - the director will see it as a cartel, but without joint intention, the Bratman framework won't support that conclusion. This tension is deliberate to show the procedure's limits.

  For the triage card, I'll distill everything to bullet points: core questions, key distinctions, escalation triggers. The closing section will acknowledge the procedure's blind spots - particularly around purely algorithmic coordination and unconscious parallelism - while arguing it still adds rigor by preventing overreach on ambiguous cases.
answer: |-
  ## Triage Procedure: Identifying Joint Agency in Competition Referrals

  **Operational Philosophy:** This procedure operationalises **Michael Bratman's theory of Shared Cooperative Activity (SCA)** as the core test for joint agency ("acting together"). Bratman requires:
  1.  **Interdependence:** Each party's actions depend on the actions/plans of the others.
  2.  **Commitment to Joint Activity:** Intent to participate *in the joint activity itself*, not just achieve a parallel outcome.
  3.  **Commitment to Mutual Support:** Willingness to adjust sub-plans to mesh with others and overcome obstacles to the joint activity.
  4.  **Mutual Responsiveness:** Actions are responsive to the actions and (perceived) intentions of others regarding the joint activity.

  **Why Bratman & What's Lost:**
  *   **Why:** SCA focuses on observable *functional interdependence* and *behavioural responsiveness*, making it more practical for evidentiary assessment than theories requiring explicit communication (Gilbert) or specific internal mental states (Searle's "we-intentions"). It captures the essence of coordination without demanding proof of explicit agreements or group minds.
  *   **Vs. Searle:** Searle requires a specific "we-intention" distinct from "I-intentions." A Searle-based procedure would demand evidence of this internal mental state (e.g., explicit "we" language, unambiguous shared purpose statements), which is often impossible to prove. We lose theoretical purity regarding the *internal* structure of intention but gain practicality.
  *   **Vs. Gilbert:** Gilbert requires a *joint commitment*, often formed through communication creating mutual obligations. A Gilbert-based procedure would demand evidence of some communicative act establishing mutual obligations. We lose the ability to classify tacit, non-communicative coordination (if it exists) as full joint action under Gilbert, but avoid the impractical hunt for explicit commitment rituals.
  *   **Vs. List & Pettit:** L&P focus on *group agents* as distinct entities with their own decision procedures and intentions. This procedure assesses whether *specific actions* constitute joint agency, not whether the *firms themselves* are group agents (though L&P insights inform Stage 5). We avoid the complex metaphysical question of firm-level agency for initial triage.

  **Essential Distinctions vs. Safe to Drop:**
  *   **MUST Survive:** Distinction between *interdependent action* (Bratman) and *merely parallel action* or *predictive alignment*. Distinction between *intending the joint activity* and merely *intending an outcome* that happens to coincide.
  *   **Can be Dropped:** Searle's specific "we-intention" vs. "I-intention" distinction (too internal). Gilbert's specific requirement for a "plural subject" formed by communication (too restrictive for evidentiary purposes). Full-blown L&P group agency for the firm (overkill for specific acts).

  **Look-Alikes & Discriminating Probes:**

  1.  **Common Knowledge of Incentives / Accurate Mutual Prediction:**
      *   *Look-Alike:* Firms independently predict competitors' reactions to market changes and act accordingly (e.g., "If I raise prices, they will too, so I can safely raise mine").
      *   **Discriminating Probe:** Is there evidence of action *conditional* on observing the *specific actions* of others regarding *this specific activity*, or merely a *general prediction* based on market logic? Look for timing, sequencing, and adjustments directly responsive to rivals' *recent moves* on the *specific issue* (e.g., price changes within hours, not days; adjustments after competitor changes, not just market-wide shifts).

  2.  **Convergent Interests:**
      *   *Look-Alike:* Firms have identical profit motives in a stable market, leading to similar but independent decisions (e.g., all raise prices after a cost increase).
      *   **Discriminating Probe:** Is there evidence of *adjustment* or *contingency* in one firm's plan *based on* the actions of others? Would a firm deviate from its preferred course *if* a competitor deviated? Evidence of withheld capacity, delayed price changes, or internal discussions referencing competitor *actions* as a reason for their *own specific timing/level*.

  3.  **Communication Without Joint Plan:**
      *   *Look-Alike:* Firms exchange information (market colour, general outlooks) but make independent decisions based on that information.
      *   **Discriminating Probe:** Does the communication contain *proposals*, *signals of intent* regarding future specific actions, *requests for action*, or *discussion of how to align actions*? Does the *content* go beyond factual reporting to coordination? Are actions taken *consistent with* understandings or signals gleaned from the communication? Look for euphemisms implying coordination ("let's keep the market orderly", "don't rock the boat", "matching").

  4.  **Unilateral Action + Accommodation:**
      *   *Look-Alike:* Firm A takes an action beneficial to itself; Firm B, observing this, independently decides to adjust its own behaviour to accommodate/exploit A's action, benefiting B.
      *   **Discriminating Probe:** Did Firm B's decision *depend* on observing Firm A's *specific action*? Crucially, was there an *expectation* or *intention* *by Firm A* that Firm B would react this way *as part of a shared plan*? Look for evidence A *relied* on B's accommodation *in its own plan* or *signalled* its action expecting B to follow. Mere reaction isn't enough; interdependence requires A's plan *incorporates* B's expected reaction.

  **The Procedure: A Five-Stage Funnel**

  *   **Goal:** Determine if there is sufficient evidence to suggest firms acted together (Bratman-style SCA) regarding the specific conduct in question.
  *   **Output:** Recommendation: "Investigate Further" (SCA likely) or "Close File" (SCA unlikely based on evidence).
  *   **Key:** Proceed step-by-step. A "No" at Stages 1-3 typically exits to "Close File". Stages 4 & 5 involve more judgment and may lead to "Investigate Further" even with ambiguity, or escalate.

  **Stage 1: Evidence of Coordinated Outcome?**
  *   **Question:** Is there evidence the firms achieved an *outcome* (e.g., parallel pricing, market sharing) that appears non-competitive and difficult to explain solely by independent responses to common market factors (e.g., identical cost changes)?
  *   **Sufficient Answer (Yes):** Statistical analysis (e.g., screens) shows sustained, unusual parallel behaviour unexplained by costs/demand; whistleblower alleges specific coordinated outcome; market study suggests collusive pattern. Proceed to Stage 2.
  *   **Exit (No):** Outcome easily explained by independent profit-maximisation in concentrated market with transparent pricing (e.g., commodity markets). **Recommendation: Close File.**
  *   **Judgment:** Assessing whether the outcome is "difficult to explain" independently requires economic/judgment. Flag if borderline.

  **Stage 2: Interdependence of Actions?**
  *   **Question:** Is there evidence that *each* firm's actions regarding the specific conduct *depended* on the actions or anticipated actions of the others? (Bratman's core)
  *   **Sufficient Answer (Yes):** Evidence includes: Direct communication proposing/agreeing actions; internal documents stating actions are conditional on competitors (e.g., "we will match X's price"); sequential actions with timing/pattern suggesting reaction/anticipation (e.g., price changes follow competitor within implausibly short timeframe *repeatedly*); algorithms demonstrably using real-time competitor data as primary input for own pricing decisions.
  *   **Exit (No):** Actions appear driven solely by internal costs, demand forecasts, or broad market signals without reference to specific competitor actions on this issue. **Recommendation: Close File.**
  *   **Judgment:** Distinguishing reaction from independent prediction. Requires assessing plausibility of independent explanation. Flag if evidence is circumstantial (e.g., timing patterns alone).

  **Stage 3: Mutual Responsiveness?**
  *   **Question:** Is there evidence of *adjustments* by firms to *mesh* their actions *over time* in response to each other's actions or perceived needs regarding the *joint activity*? (Bratman's Mutual Responsiveness)
  *   **Sufficient Answer (Yes):** Evidence includes: Communication discussing adjustments to maintain alignment (e.g., "Y raised too much, we need to ease back"); actions showing deviation from independent profit-max to maintain parallel behaviour (e.g., holding price below profit-max level to match a competitor); algorithm settings prioritising matching over other factors; evidence of resolving conflicts in implementation (e.g., one firm compensating another).
  *   **Exit (No):** Firms act in parallel, but no evidence of dynamic adjustment *between them*. Each firm sticks rigidly to its own plan regardless of others' deviations. **Recommendation: Close File.**
  *   **Judgment:** Assessing whether adjustments are strategic meshing or just independent optimisation. Highly judgmental. Flag.

  **Stage 4: Commitment to Joint Activity & Mutual Support?**
  *   **Question:** Is there evidence suggesting firms conceived of themselves as acting *together* in a *shared plan* and were willing to *support* its continuation? (Bratman's Commitment elements)
  *   **Sufficient Answer (Yes):** Direct evidence: "We" language re: the activity; agreements/understandings; evidence of reliance on others' participation. Circumstantial evidence: Actions incurring short-term costs to maintain alignment; communication implying shared purpose ("stabilising the market for all of us"); complex patterns requiring sustained coordination.
  *   **Insufficient Evidence/Ambiguous:** Evidence of interdependence/responsiveness but no clear indication of shared commitment. This is the **critical judgment zone**.
  *   **Exit (Clear No):** Evidence strongly suggests purely individualistic intent (e.g., internal docs: "We're exploiting X's price increase"; "Ignore Y, do what's best for us alone"). **Recommendation: Close File.**
  *   **Judgment:** High judgment. Reliance on inference. **Escalation Point:** Must be reviewed by Senior Case Manager. Threshold for "sufficient" evidence here is key institutional value (risk tolerance for false positives/negatives). **Recommendation:** If sufficient evidence, **Investigate Further**. If ambiguous, leans towards **Investigate Further** if Stages 1-3 strongly suggest SCA, otherwise **Close File**.
  *   **Escalation Triggers (Embedded):**
      *   **No Communication?** (Stage 2/3/4): *Can purely algorithmic, non-communicative interdependence/responsiveness constitute SCA?* Requires judgment on whether algorithm's function manifests firm's intent for joint activity. Escalate to Legal/Senior Economist + SCM.
      *   **Algorithm as Party?** (Stage 2): *Can an algorithm itself be part of shared intention?* No. The procedure assesses the *firms'* agency. The algorithm is a tool. The question is whether the *firm*, via the algorithm's design/use, is engaged in SCA with rivals. No need to escalate *this specific question* if firm's responsibility is clear.
      *   **Firm as Group Agent?** (All Stages): *Do the firm's internal procedures mean its actions reflect its own "intention"?* L&P relevant. The procedure assumes firm actions can be assessed. Escalate only if internal conflict is severe (e.g., rogue trader) and relevant to the specific conduct. Usually handled downstream by lawyers (statutory tests).

  **Stage 5: Edge Cases & Alternative Explanations**
  *   **Question:** Considering all evidence, are there strong alternative explanations (Look-Alikes - see list above) that better fit the facts than SCA? Does the evidence clearly point to one of the look-alikes?
  *   **Sufficient Alternative (Yes):** Evidence strongly favours a look-alike explanation (e.g., pure predictable parallelism, unilateral action + independent accommodation, informative communication only). **Recommendation: Close File.**
  *   **Judgment:** Weighing competing explanations. **Recommendation:** If SCA still appears the best explanation based on Stages 1-4, **Investigate Further**. If a look-alike is equally or more plausible, **Close File**. Escalate if novel look-alike or significant ambiguity.

  ---

  **Procedure Applied: Three Referrals**

  1.  **Fuel Retailers (Algorithmic Flag - Parallel Pricing):**
      *   Stage 1: **Yes.** Screen shows sustained parallel pricing.
      *   Stage 2: **Critical.** *No* contact/messages/meetings found. Pricing *could* be independent reaction to common signals (wholesale price, local demand) *or* algorithm-driven interdependence. *Probe:* Are algorithms using real-time competitor price data? If yes, **Yes** (Interdependence via tool). If no, or only common wholesale data, **No (Exit: Close File)**. Assume evidence shows algorithms *do* track and react to *specific competitor prices* in near real-time. **Yes.**
      *   Stage 3: **Yes.** Evidence of mutual responsiveness inherent in algorithms constantly adjusting based on rivals' changes.
      *   Stage 4: **Ambiguous/Judgment.** No evidence of "we" intent or commitment beyond the algorithm's function. Did the firms *intend* the algorithm to create joint action, or merely to compete aggressively? *Escalate:* Is this Bratman SCA without communication? Senior judgment needed. Likely **Investigate Further** due to strong Stages 1-3, pending Stage 5.
      *   Stage 5: **Look-Alike?** Predictive Alignment/Unilateral+Accommodation possible, but algorithm's *design* using competitor data suggests *dependence*. SCA seems stronger fit. **Recommendation: Investigate Further.** *Decisive Stage:* Stage 2 (finding algorithmic interdependence).

  2.  **Bank Traders (Chat Group / Euphemisms):**
      *   Stage 1: **Yes.** Parallel trading behaviour alleged (e.g., similar quotes/spreads).
      *   Stage 2: **Yes.** Communication exists (chat group). Euphemisms ("market colour", "orderly") *could* mask coordination. Evidence of actions conditional on chat content? **Yes** (e.g., trader messages "seeing 5.10", then rivals quote near 5.10).
      *   Stage 3: **Yes.** Chat shows responsiveness: "Can you hold there?", "Following your lead", adjustments discussed implicitly via euphemisms.
      *   Stage 4: **Yes.** Euphemisms and context suggest shared understanding/purpose ("keeping market orderly" implies joint activity). Willingness to signal/support implied. **Recommendation: Investigate Further.** *Decisive Stage:* Stage 4 (Evidence of commitment via communication context).
      *   Stage 5: Look-Alike (Communication w/o Plan) is *less* plausible given action links and euphemistic context.

  3.  **Supermarkets (Algorithmic Repricing / Common Data Pool):**
      *   Stage 1: **Yes.** Parallel pricing likely flagged.
      *   Stage 2: **Yes.** Each firm's pricing *depends* directly on the common data pool (which includes rivals' prices) via the algorithm. Algorithm designed to match/respond.
      *   Stage 3: **Yes.** Algorithm ensures constant mutual responsiveness via the shared data feed.
      *   Stage 4: **Critical/Judgment/Escalation.** *No* evidence managers intended joint activity. Algorithm vendor's intent ("matching as a feature") is not the *supermarkets'* intent for joint action. Did supermarkets *adopt the service intending* to facilitate parallel pricing as a joint outcome, or merely to compete efficiently? Is using a *common* third-party tool with shared data sufficient for Bratman's "commitment to joint activity"? **Highly Ambiguous. Escalate.** Senior judgment: Is this significantly different from each supermarket independently subscribing to Bloomberg and reacting? Threshold of institutional values (how much tacit algorithmic coordination is tolerable?).
      *   Stage 5: **Look-Alike?** Strong case for Unilateral Action + Accommodation *via* a tool, or Convergent Interests + Predictive Alignment *enabled* by the tool. SCA requires more than just the *outcome* of interdependence. **Recommendation:** Senior Case Manager likely **Closes File** under Bratman due to lack of evidence for *firm-level* commitment to joint activity, despite interdependence. *Director's Disliked Outcome:* This one. She sees cartel; procedure (Bratman) says no evidence of shared intention/commitment, just tech-enabled parallelism.
      *   *Defence:* Bratman requires more than just de facto coordination; it requires evidence the firms understood themselves as participating *together*. The common third-party tool and lack of managerial intent breaks the link to the *firms* having a shared intention. It looks like individual firms using a competitive tool, leading to parallel outcomes. Legally/politically contentious, but philosophically (Bratman) sound. *Torn?* Only if evidence shows supermarkets *chose* this specific service *because* it would lead to uniform pricing and discussed this benefit internally as a form of coordination.

  **What the Procedure Cannot Do (Limitations):**

  1.  **Systematic False Negatives (Lets Coordination Through):**
      *   **Truly Tacit Collusion:** Perfectly aligned firms with no communication, no algorithms, just pure mutual understanding and predictability (rare, perhaps mythical). Bratman (and Gilbert/Searle) would struggle without interdependence/responsiveness evidence.
      *   **Clever Look-Alikes:** Sophisticated coordination designed to mimic unilateral action + accommodation or informative communication perfectly.
      *   **"Group Agent" Coordination:** Coordination emerging from complex firm structures without clear individual intent, where L&P might find a group agent, but Bratman applied to specific acts finds no shared intention between firms.
      *   **Why?** Reliance on observable evidence of interdependence and intent. Truly hidden coordination evades detection.

  2.  **Systematic False Positives (Over-Classifies):**
      *   **Intense Oligopoly:** Markets where transparency and interdependence are natural (e.g., petrol stations, trading). Firms *must* react to rivals to compete, creating interdependence/responsiveness *without* shared intention. The procedure may flag these for investigation more often than desired.
      *   **Common, Aggressive Tools:** Widespread use of pricing algorithms fed by competitor data (like the Supermarket case). Creates de facto parallelism that looks like SCA stages 1-3.
      *   **Why?** The difficulty of cleanly distinguishing competitive interdependence (good) from collusive interdependence (bad) based purely on behaviour patterns. Stage 4 judgment is crucial but fallible.

  **Why Run It?**
  Despite limitations, the procedure:
  *   **Adds Rigour:** Forces structured thinking beyond "looks fishy".
  *   **Focuses Inquiry:** Prioritises evidence for *interdependence* and *shared intention*, the philosophically robust core of "acting together".
  *   **Improves Consistency:** Applies the same (Bratman) lens across cases, reducing individual analyst bias.
  *   **Manages Risk:** Explicit exit points and escalation flags prevent wasting resources on weak cases and highlight true ambiguities for senior judgment.
  *   **Defensibility:** Provides a clear, reasoned (if imperfect) framework for recommendations, grounded in established theory.

  ---

  **Triage Analyst Quick Card**

  **Core Question:** Did Firms **Act Together** (Bratman Style)? Need: Interdependence + Responsiveness + Shared Commitment to Joint Activity.

  **STAGE 1: Coordinated Outcome?** (Stats, whistleblower, study)
  *   *No?* → **Close File**
  *   *Yes/Unclear?* → **Stage 2**

  **STAGE 2: Interdependent Actions?** (Comm, internal docs, algo inputs, timing links)
  *   *No?* → **Close File**
  *   *Yes?* → **Stage 3**

  **STAGE 3: Mutual Responsiveness?** (Adjustments, meshing, helping, algo settings)
  *   *No?* → **Close File**
  *   *Yes?* → **Stage 4**

  **STAGE 4: Commitment to Joint Activity?** ("We" language, agreements, reliance, cost-bearing, shared purpose signals)
  *   *Clear No?* → **Close File**
  *   *Clear Yes?* → **Investigate Further**
  *   *Ambiguous?* → **ESCALATE TO SCM** (Judgment Call)

  **STAGE 5: Strong Look-Alike?** (Predictive Alignment, Convergent Interests, Info-Only Comm, Unilateral+Accommodation)
  *   *Yes, Better Fit?* → **Close File**
  *   *No, SCA Best Fit?* → **Investigate Further** (or SCM decision if Stage 4 escalated)

  **LOOK-ALIKES - Key Probe:**
  *   **Predict/Know Incentives?** → *Did they act CONDITIONAL on SPECIFIC rival action?*
  *   **Convergent Interests?** → *Did they DEVIATE from own max profit to MATCH?*
  *   **Comm w/o Plan?** → *Comm contain PROPOSALS/SIGNALS/SHARED PURPOSE?*
  *   **Unilateral + Accommodate?** → *Did Firm A RELY ON/EXPECT B's support?*

  **ESCALATE:**
  *   No communication but strong algo interdependence? (Stage 4)
  *   Firm intent unclear despite interdependence? (Stage 4)
  *   Novel look-alike or high ambiguity? (Stage 5)

  **PHILOSOPHER CHEAT SHEET:**
  *   **We're Using: Bratman** (Shared Cooperative Activity - Interdependence & Commitment)
  *   **Not Using: Searle** (Needs "We-Intention" proof - too hard) / **Gilbert** (Needs Commitment Ritual - too strict) / **List & Pettit** (Group Agents - overkill for this).

  **DIRECTOR WARNING:** Supermarket/Algo cases likely **Close File** unless evidence shows firms *intended* joint outcome via the tool.
