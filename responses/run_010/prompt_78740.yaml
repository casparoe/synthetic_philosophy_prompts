  ## Condorcet's Verdict on Futarchy: A Reconstruction

  **Overall Verdict:** Condorcet rejects the futarchic proposal outright. Confidence: High (80%). His core commitments to social independence, broad-based rational deliberation, indefinite perfectibility, and dynamic constitutionalism clash fundamentally with futarchy's mechanisms. He would propose a radically different system centered on expanding deliberative juries and iterative constitutional revision.

  **Pressure Point 1: Independence**
  *   **Documented Position:** Condorcet's 1785 theorem assumes statistical independence, but his political writings (e.g., *Sur l’admission des femmes au droit de cité*, *Esquisse*, constitutional plans) elevate *social* independence – freedom from patronage and factional control – as essential *for* rational judgment and a core *goal* of democracy. He saw dependence as corrupting reason and participation as fostering independence.
  *   **Extrapolation:** The futarchic market directly violates both conceptions. Prices create *informational dependence* – traders follow the signal, undermining independent judgment. Wealth-weighting creates *structural social dependence* – influence derives from capital, inherently tied to existing economic hierarchies and patronage networks. The theorem's residual uncorrelated errors rely on initial independence; futarchy actively *correlates* errors through price following and concentrates influence where social dependence is likely highest.
  *   **Verdict:** This defeats his enthusiasm outright. He would see it as replicating the oligarchic tendencies he despised, where wealth (like noble birth) grants disproportionate power, corrupting the rational aggregation process. The "uncorrelated residual errors" argument fails because the initial conditions for independence are systematically undermined.

  **Pressure Point 2: Architecture of Aggregation**
  *   **Documented Position:** Condorcet championed broad participation (e.g., primary assemblies) and saw the "multiplication of cheap, fallible, independent judgments" as the engine of epistemic and moral progress. His constitutional designs aimed to maximize informed citizen deliberation at multiple levels.
  *   **Extrapolation:** Condorcet would grasp the Grossman-Stiglitz paradox (1980) intuitively through his understanding of incentives and information acquisition costs. He would see the futarchic market as an oligopoly of truth-seeking: reliant on a small cadre of well-capitalized specialists profiting from others' ignorance. This inverts the jury theorem's democratic, distributed logic.
  *   **Anachronism Handling:** "Informationally efficient price" maps to his concept of a value reflecting *all known reasons* (evidence/data). "Rents for the informed" maps to his understanding of incentives necessary to motivate costly investigation (e.g., scientists, informed citizens).
  *   **Verdict:** Condorcet unequivocally prefers the jury theorem's architecture. The distinction between binary verdict probability and continuous point estimates *is* significant to him. While he believed many political questions could be made calculable (*calcul des probabilités*), the jury theorem's structure – aggregating diverse, independent judgments on a well-defined question – aligns with his democratic ideals and his belief in the superior epistemic power of distributed reason. The specialist-driven market model represents concentrated, potentially self-interested expertise, which he distrusted.

  **Pressure Point 3: Values/Beliefs Split & Constitutional Rigidity**
  *   **Documented Position:** Condorcet was a radical rationalist who believed *both* normative and empirical questions were susceptible to reasoned inquiry and probabilistic assessment (*Esquisse*, *Vie de Turgot*). His constitutional plans (e.g., Girondin project) emphasized constant revision and popular ratification through primary assemblies – *rigidity* was anathema. Progress demanded institutional plasticity.
  *   **Extrapolation:** He would reject the values/beliefs split as artificial and dangerous. Legislatively fixing a "welfare metric" for decades is precisely the kind of rigid, potentially erroneous framework he sought to avoid. He would argue:
      1.  **Normative Calculability:** Debating and refining the definition of "good" *is* a rational process amenable to deliberation and probabilistic reasoning (e.g., weighing consequences of different metrics).
      2.  **Dynamic Revision:** Locking a metric via supermajority creates a dangerous inertia. Societies learn, values evolve (part of *perfectibilité*). The mechanism for revising the metric *itself* needs constant scrutiny and ease of amendment.
      3.  **Veto Complexity:** The need for "bolted on" vetoes and auctions signals the core instability of the fixed metric, confirming his fears.
  *   **Verdict:** Condorcet rejects the split and the rigidity. He would insist the welfare metric itself must be subject to the same kind of ongoing, deliberative, and broadly participatory scrutiny as any other fundamental question.

  **Pressure Point 4: Posterity**
  *   **Documented Position:** Condorcet's *Esquisse* is a hymn to the rights and interests of future generations and humanity's indefinite perfectibility. He saw governments as trustees for the unborn (*Fragments sur la liberté de la presse*, constitutional plans).
  *   **Extrapolation:** The market's inherent short-termism (limited horizons, need for collateral/resolution) is a *fatal structural flaw*. Markets *cannot* effectively price long-term, intergenerational effects or represent the voiceless unborn. While voting systems also struggle with future representation, Condorcet saw *deliberation* – incorporating historical lessons, scientific foresight, and ethical reasoning about duty to posterity – as the best available (though imperfect) tool. Futarchy, by outsourcing belief solely to current market participants betting on a near-term metric, explicitly excludes the unborn in a way he would find morally bankrupt and practically myopic. The "discounting" solution trivializes the ethical weight of the future.
  *   **Verdict:** A fatal objection. Futarchy structurally fails as a trustee for posterity in a way Condorcet deemed unconscionable.

  **Pressure Point 5: The Concrete Proposal**
  *   **Proposal:** 30-year fixed welfare metric (supermajority revision), mandatory decision markets for large policies, market-maker liquidity, legislative veto with published reasons.
  *   **Condorcet's Verdict:** **Reject.** He would dismantle it:
      1.  **Metric:** Replace the fixed 30-year metric with a regularly revised (e.g., every 5-10 years) metric determined by a large, rotating *citizens' jury* (like his primary assemblies), informed by experts but deliberating independently. This incorporates broad participation and allows normative evolution.
      2.  **Aggregation Mechanism:** Replace decision markets with mandatory assessment by *specialized deliberative juries*. These juries, selected by lot from educated citizens, would hear evidence, deliberate, and estimate the probabilistic impact of policies on the current welfare metric *and* long-term consequences/future revisions. Their reasoned reports, including dissents, would be public. (This adapts the jury theorem structure to complex estimation).
      3.  **Veto:** The elected assembly could *delay* implementation (not veto) pending review by a higher-level jury or referendum if the policy jury's reasoning is deemed flawed or if significant long-term risks are unaddressed. Reasons must always be published.
      4.  **Liquidity:** Irrelevant; juries don't require it.
  *   **Why He Builds This Instead:** It prioritizes broad-based *deliberative* reason over financial speculation; fosters social independence through lottery selection and civic education; dynamically revises core values; explicitly mandates consideration of long-term and future impacts within the deliberative process; and maintains the epistemic benefits of diverse, independent judgment aggregation central to his life's work. It uses "the same instruments" (citizens, experts, deliberation, voting) but configures them for rational, democratic progress.

  **What Would Change My Mind?**
  1.  **Condorcet Endorsing Wealth-Weighting:** If clear evidence emerged that Condorcet explicitly endorsed *any* decision mechanism weighting influence by wealth (e.g., in economic policy contexts), this would significantly weaken the independence objection and potentially alter the verdict on architecture.
  2.  **Jury Theorem Applied to Markets:** If a compelling argument demonstrated that, despite microstructure theory, prediction markets *in practice* functionally replicate the jury theorem's conditions (many small, *effectively* independent contributors driving accuracy), Condorcet *might* accept it as a pragmatic aggregation tool, though social dependence concerns would remain acute.

  **Weakest Point of Reconstruction:**
  The translation of market microstructure theory (Grossman-Stiglitz) into Condorcet's conceptual framework is the most vulnerable. While Condorcet understood incentives for information gathering and the limitations of individual reason, framing the market's reliance on specialist profits as "rents for the informed" is a modern economic lens applied retrospectively. A competent historian would argue:
      *   Condorcet's focus was on *political* corruption and dependence (patronage, factions), not market failures arising from information asymmetry in a capitalist framework.
      *   His solution to concentrated expertise was *education* and *rotating participation*, not designing systems to pay specialists for their asymmetric information.
      *   I risk projecting a modern understanding of efficient markets and their paradoxes onto an 18th-century thinker whose primary economic concerns were different (e.g., monopoly, fair trade, public instruction). While he'd grasp the *logic*, attributing his *priority* to this critique might overstate the case. His core objection would remain democracy and independence, with microstructure being a reinforcing technical argument rather than the root cause.
