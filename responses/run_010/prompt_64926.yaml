answer: |-
  To adjudicate whether an account is genuinely Darwinian or merely idiomatic, we must define a **minimal specification** derived from Darwinian logic, separating necessary explanatory features from contingent commitments. Below is the framework you need, followed by sorting and scoring.

  ---

  ### **Core Requirements for a Genuine Darwinian Theory of Cultural Change**  
  *(With grounding cases/considerations)*  

  1. **Explanandum: Cumulative Adaptive Complexity**  
     *Requirement:* Must explain how functional, structured designs (e.g., kayak designs, musical notation systems) arise and refine over time through *non-intentional accumulation* of modifications.  
     *Grounding:* Contrasts mere spread (e.g., slang) with ratcheting improvements (e.g., tool traditions).  

  2. **Variation with Undirected Origins**  
     *Requirement:* Variation in cultural traits must arise independently of functional optimization (i.e., not primarily guided by foresight, goals, or centralized design).  
     *Grounding:* "Guided variation objection" – if variation is directed by intent, selection is redundant.  

  3. **Differential Retention via Selection**  
     *Requirement:* Traits must be retained based on fitness advantages (e.g., utility, attractiveness) *relative to alternatives*, not just absolute success.  
     *Grounding:* Distinguishes adaptive accumulation (e.g., bow designs optimizing for range) from ephemeral trends (e.g., playground games churning without improvement).  

  4. **Fidelity Sufficient for Lineage Formation**  
     *Requirement:* Copying fidelity must be high enough to preserve functional elements across generations, enabling cumulative change.  
     *Grounding:* "Fidelity/discreteness question" – low fidelity (e.g., rumors) prevents stable inheritance; high fidelity (e.g., ritualized crafts) allows lineage cohesion.  

  5. **Population-Level Explanatory Scope**  
     *Requirement:* Explanations must operate at the level of trait distributions in populations, not individual psychology.  
     *Grounding:* "Content/prestige/conformity biases" – these describe *how* transmission occurs, but Darwinian accounts explain *population-level outcomes* (e.g., why some biases dominate).  

  6. **Falsifiability**  
     *Requirement:* Must specify conditions under which cultural change in a domain would *not* be Darwinian (e.g., if all variation is top-down engineered).  
     *Grounding:* A theory claiming everything is "Darwinian" (e.g., slang, bows, rumors) explains nothing.  

  7. **Distinction Between Inheritance and Reconstruction**  
     *Requirement:* Must differentiate traits *copied* from ancestors (lineage inheritance) vs. *reconstructed* from environmental cues or general knowledge.  
     *Grounding:* Kayak designs inherited vs. children "re-discovering" gravity.  

  ---

  ### **Sorting Work: What Follows from Darwinian Logic vs. Contingent Commitments**  

  #### **I. Necessities vs. Baggage**  
  - **Necessities (from explanatory job):**  
    - Cumulative adaptive complexity as explanandum (Req. 1).  
    - Variation + selection + retention as irreducible components (Req. 2, 3).  
    - Population-level focus (Req. 5).  
    - Falsifiability (Req. 6).  
  - **Contingent Baggage:**  
    - **Gene-like particulate units:** *Not required*. Cumulative design can emerge via high-fidelity *non-discrete* traits (e.g., craft techniques) if selection stabilizes functional clusters.  
    - **Perfect copying fidelity:** *Not required*. Sufficient fidelity (Req. 4) ≠ perfect replication (e.g., oral traditions accumulate changes but sustain lineages).  

  #### **II. Joint Unsatisfiability: The Guided Variation Trilemma**  
  **Problem:** Req. 2 (undirected variation), Req. 4 (high fidelity), and Req. 1 (cumulative complexity) **cannot all hold** when variation is generated by goal-directed minds.  
  - *Why:* Minds optimize variation (e.g., innovating tools for immediate utility), bypassing selection. High-fidelity copying of *intentionally optimized* traits mimics selection but invalidates it as the primary driver.  
  - *Result:* Domains with strong intentional design (e.g., technology) satisfy Req. 1 and 4 but violate Req. 2; domains with undirected variation (e.g., folklore) satisfy Req. 2 but struggle with Req. 1.  

  #### **III. Degrees of "Darwinian-ness"**  
  A cultural domain is more Darwinian when:  
  - **Higher:** Functional traits with variation > selection > inheritance cycles (e.g., instrument-making traditions).  
  - **Lower:** Ephemeral traits with weak inheritance (e.g., slang) or intent-driven change (e.g., academic theories).  
  - **Grading Metrics:**  
    | **Feature**               | Increases Darwinian-ness | Decreases Darwinian-ness |  
    |---------------------------|--------------------------|--------------------------|  
    | **Fidelity**              | High (crafts)            | Low (rumors)             |  
    | **Variation Source**      | Undirected (folktales)   | Guided (engineering)     |  
    | **Selection Pressure**    | Clear (tool efficiency)  | Weak (fashion)           |  
    | **Lineage Stability**     | Strong (rituals)         | Weak (memes)             |  

  *Example Book Domains:*  
  - **Book A (Tool Evolution):** High Darwinian-ness (fidelity, selection).  
  - **Book B (Slang Diffusion):** Low Darwinian-ness (low fidelity, weak selection).  
  - **Book C (Scientific Ideas):** Mixed (high fidelity but guided variation).  

  #### **IV. The Decisive Requirement**  
  **Req. 1 (Cumulative Adaptive Complexity)** excludes the most candidates:  
  - Orthodox memetics often conflates spread with complexity.  
  - Domain-specific theories (e.g., innovation studies) often lack population-level selection.  

  ---

  ### **Scorecard: Three Approaches**  
  *(Evaluated against Req. 1–7)*  

  1. **Orthodox Memetics**  
     - ✅ Req. 3–5 (differential retention, population focus).  
     - ❌ Req. 1–2: Fails to explain complexity (treats kayaks/slang equally); ignores undirected variation.  
     - ❌ Req. 6: Rarely falsifiable ("everything copies").  
     *Verdict:* **Darwinian idiom** – units assumed, not demonstrated.  

  2. **Dual-Inheritance/Population Thinking**  
     - ✅ Req. 1, 3–6: Explains complexity via biased transmission (e.g., prestige); falsifiable (e.g., if conformism dominates selection).  
     - ⚠️ Req. 2: Ambiguous on guided variation (often downplays intentionality).  
     *Verdict:* **Genuine theory** – but risks absorbing psychology (e.g., "biases" as de facto direction).  

  3. **Developmental/Black Box View**  
     - ✅ Req. 2: Centers on how minds generate variation.  
     - ❌ Req. 1, 3–5: Cannot explain population-level accumulation without selection; collapses inheritance/reconstruction distinction.  
     - ❌ Req. 6: Unfalsifiable (all variation is "reconstructed").  
     *Verdict:* **Anti-Darwinian** – explains origins, not adaptive winnowing.  

  ---

  ### **Summary for Your Essay**  
  - **Standard of Adequacy:** A theory must explain cumulative adaptive complexity (Req. 1) via undirected variation, selection, and inheritance (Req. 2–5) while being falsifiable (Req. 6).  
  - **Key Triage:** Reject accounts that cannot distinguish adaptive lineages from mere spread (e.g., memetics), or that reduce selection to psychological mechanisms (e.g., strict developmentalism). Dual-inheritance survives but must confront guided variation.  
  - **Core Tension:** Cumulative design requires fidelity, but minds generate directed variation – making purely Darwinian cultural change rarer than often claimed.  

  This framework forces clarity: Darwinian theories earn the label by explaining *how complexity emerges without a designer*, not by describing spread. Use it to dissect where each book conflates, evades, or satisfies these demands.
