answer: |-
  Here’s the spec for an adequate threshold deontology theory, structured around your requirements (validated, expanded, and categorized) plus critical additions. The institutional framing ("body publishing rules in advance") sharpens several demands.

  ### Core Requirements for Threshold Deontology
  *(D: Dodgeable? N = No, Y = Yes [only one camp insists])*

  1.  **Define the Threshold Metric (N):**
      *   **What:** Specify *what* crosses the threshold (e.g., lives saved, QALYs, prevention of existential catastrophe, violation of fundamental rights). Must address *expected* vs. *actual* value and probability (e.g., 1% chance of 1 billion deaths vs. 100% chance of 10,000 deaths).
      *   **Case:** The "ticking bomb" with varying probabilities/bomb sizes; unknown WMD location with catastrophic potential but low probability of success via torture.
      *   **Institutional Pull:** Requires a publicly defensible, quantifiable(ish) standard.

  2.  **Status of the Permission (N):**
      *   **What:** Clarify if the act becomes *justified* (truly morally permissible, no blame) or merely *excused* (still wrongful, but blame mitigated due to circumstances).
      *   **Case:** Torturer acting in genuine catastrophic emergency (justification?) vs. torturer acting under reasonable but false belief of catastrophe (excuse?).
      *   **Institutional Pull:** Bodies need to know if they are authorizing *permissible acts* or establishing *conditions for non-punishment*.

  3.  **Agent-Created Emergencies (N):**
      *   **What:** Address whether the threshold applies if the agent *negligently or maliciously created the catastrophic situation* they now use to justify the wrong.
      *   **Case:** Security services bungle intel gathering, creating a "ticking bomb" scenario they then "solve" with torture.
      *   **Institutional Pull:** Rules must prevent perverse incentives and "self-created justifications."

  4.  **Aggregation (Y - Contested):**
      *   **What:** Specify if the threshold can be crossed by aggregating *many small harms* (e.g., stealing $1 from 1 million people to prevent 1 death) or *only by a single massive, qualitatively distinct harm* (e.g., genocide, extinction).
      *   **Case:** "Death by a thousand cuts" vs. a single nuclear detonation.
      *   **Institutional Pull:** Rules must be clear on what counts as a "catastrophe" – is it scale *or* kind?

  5.  **Action-Guidance / Ex-Ante Usability (N - Sharpened by Institution):**
      *   **What:** Must the theory provide usable guidance *before* all facts are known to the agent/institution? Or is it purely retrospective assessment?
      *   **Case:** Can a rule ("torture only if >10,000 lives imminently at stake with >80% confidence") be formulated and applied *in advance* by an institution?
      *   **Institutional Pull:** **This is the core wrinkle.** Published rules *demand* ex-ante action-guidance under uncertainty. Individual agents might "muddle through" intuitively; institutions cannot.

  6.  **Explanation for the Threshold (N):**
      *   **What:** Provide a coherent rationale for *why* a threshold exists instead of either pure absolutism (no threshold) or pure consequentialism (no threshold, just continuous balancing). Explain the "cliff edge."
      *   **Case:** Why is torturing 1 innocent to save 10 forbidden, but torturing 1 to save 10 million permissible? What *changes*?
      *   **Institutional Pull:** Rules require public legitimacy; a seemingly arbitrary "cliff" needs strong justification.

  7.  **Epistemic Constraints & Decision Rules (N - Critical Addition):**
      *   **What:** How does the theory handle *uncertainty* about whether the threshold is met? What level of evidence/confidence is required? What decision rule should agents/institutions use under uncertainty (maximin, expected value, etc.)?
      *   **Case:** Is torture permitted based on a credible but uncorroborated tip about a city-level threat? What if the probability of success via torture is 5%?
      *   **Institutional Pull:** **Essential.** Published rules *must* incorporate epistemic standards ("clear and convincing evidence," "beyond reasonable doubt," "reasonable belief") to prevent abuse based on speculation.

  8.  **Normative Authority (Y - Critical Addition):**
      *   **What:** Who determines the threshold's location and nature? Is it objective moral fact, culturally relative, set by democratic process, or determined by the institution itself?
      *   **Case:** Can a legislature legitimately set a lower threshold for torture than moral philosophers deem objective? Does the institution setting the rule have the standing to do so?
      *   **Institutional Pull:** Central to the legitimacy of *published* rules. Who gets to draw the line?

  9.  **Institutional Competence & Corruptibility (Y - Critical Addition):**
      *   **What:** Does the theory account for the realistic limitations, biases, and potential for abuse inherent in the institutions that would create, interpret, and apply the threshold rule?
      *   **Case:** Won't any published rule allowing torture "only in extreme cases X, Y, Z" inevitably lead to mission creep, false positives, and normalization?
      *   **Institutional Pull:** **Crucial.** A theory ignoring institutional realities is practically useless and dangerous for rule-publishing bodies.

  10. **Moral Residue (Y - Critical Addition):**
      *   **What:** Even if the act is *justified* by crossing the threshold, does it leave a moral "stain," require reparations, or impose special obligations on the agent/institution?
      *   **Case:** Should the state compensate a justifiably tortured (but innocent) individual? Does the torturer require counseling or face restrictions?
      *   **Institutional Pull:** Rules should address the aftermath and acknowledge the intrinsic wrongness of the act, even if overridden.

  **Refining Your List:** All your points were valid requirements. "Justification vs. Excuse" and "Agent-Created Emergencies" are fundamental (N). "Aggregation" is contested (Y). "Action-Guidance" is paramount and sharpened institutionally (N). "Explanation" is crucial (N). The "metric" question was implied but needed explicit separation (N). I added Epistemic Constraints (N), Normative Authority (Y), Institutional Competence (Y), and Moral Residue (Y) as critical, especially for the institutional frame.

  ---

  ### The Wrecking Ball Requirement & Impossible Pairs

  *   **Single Most Damaging Requirement: Action-Guidance / Ex-Ante Usability (for Institutions).** Actual candidate theories (especially objective-trigger and epistemic-trigger thresholds) struggle *immensely* to provide genuinely usable, clear, abuse-resistant rules that can be published in advance *and* accurately capture the moral reality of catastrophic thresholds under uncertainty. They either become dangerously permissive ("reasonable belief"), paralyzingly strict ("absolute certainty"), or vacuously abstract ("only in true catastrophes"). Consequentialism simplifies this but abandons the threshold/deontology core. Absolutism avoids it by saying "never."
  *   **Jointly Unsatisfiable Pairs:**
      1.  **Action-Guidance (for Institutions) + Epistemic Limitations:** Institutions need clear, operational rules *now*. But deep uncertainty about facts and probabilities is inherent in catastrophic scenarios (especially intelligence-dependent ones like torture). Any precise rule will misfire (allowing abuse or preventing necessary action) in some real-world cases due to imperfect knowledge. A rule flexible enough to handle uncertainty becomes too vague for reliable institutional guidance.
      2.  **Aggregation (Required) + Non-Aggregation (Required) + Explanation for Threshold:** Many theories want to allow aggregation for true catastrophes (saving millions) but forbid it for distributed harms (stealing pennies). Providing a principled explanation for *why* aggregation suddenly becomes acceptable only past a certain threshold of harm *and* why that threshold marks a qualitative shift (not just quantitative) is fiendishly difficult. It risks appearing arbitrary.

  ---

  ### Family Scores Against Key Requirements (🟢 Good, 🟡 Mixed/Poor, 🔴 Bad)

  | Theory                | Defines Metric | Status (J/E) | Agent-Created | Aggregation? | Action-Guidance (Inst.) | Explains Threshold | Handles Uncertainty | Accounts for Inst. Reality |
  | :-------------------- | :------------: | :----------: | :-----------: | :----------: | :---------------------: | :----------------: | :-----------------: | :------------------------: |
  | **Absolutism**        |     N/A 🔴     |   N/A 🔴     |    N/A 🔴     |   N/A 🔴     |         🟢✅         |       🟢✅        |        🟢✅         |            🟢✅            |
  | **Consequentialism**  |     🟡🟢      | Justify 🟢  |      🟡🔴     |   Allow 🟢   |         🟢✅         |       🔴❌        |        🟡🟢         |            🟡🔴            |
  | **Obj-Trigger Thresh**|     🟡🔴      | Justify 🟢  |      🟡🔴     |   Mixed 🟡   |         🔴❌         |       🟡🔴        |        🔴❌         |            🔴❌            |
  | **Epi-Trigger Thresh**|     🟡🔴      | Mixed 🟡   |      🟡🔴     |   Mixed 🟡   |         🟡🟢         |       🟡🔴        |        🟢✅         |            🟡🔴            |
  | **Excuse-Only**       |     🟡🔴      |  Excuse 🟢  |      🟢✅     |   N/A 🔴     |         🟢✅         |       N/A 🔴      |        🟢✅         |            🟢✅            |

  **Key:**
  *   ✅ = Requirement Met Well / Core Strength
  *   🟢 = Generally Meets Requirement
  *   🟡 = Mixed Record / Serious Problems
  *   🔴 = Fails Requirement / Core Weakness
  *   ❌ = Requirement Actively Violated / Incompatible
  *   N/A = Requirement Not Applicable

  **Brief Explanations:**
  *   **Absolutism:** Avoids thresholds entirely; excels on action-guidance and institutional safety but fails core premise.
  *   **Consequentialism:** Handles metrics, guidance, and uncertainty pragmatically but rejects thresholds and deontic constraints, fails to explain "cliff," and institutional risks are high.
  *   **Objective-Trigger:** Struggles with defining metric, action-guidance under uncertainty, institutional realities, and often has weak threshold explanations. Justification status is clear.
  *   **Epistemic-Trigger:** Better on uncertainty and action-guidance than objective, but still struggles with metric, aggregation, threshold explanation, and institutional risks. Justification status often ambiguous.
  *   **Excuse-Only:** Avoids justifying the act, handles agent-created emergencies well, good on guidance/safety, but fails to permit necessary acts (absolutism-lite), avoids defining the threshold metric/aggregation, and provides no threshold *justification* (only excuse).

  This spec highlights that the institutional demand for **actionable, abuse-resistant rules under uncertainty** is the primary challenge, and the tension between **needing to aggregate for true catastrophes** while **resisting aggregation for lesser evils** and **explaining the threshold's existence** remains a deep philosophical knot. Your paper's core tension (Action-Guidance vs. No-Free-Rides/Negligence) is indeed potent, but the Action-Guidance vs. Epistemic Limitations clash within the institutional frame may be even more fundamental for *practical* adequacy.
