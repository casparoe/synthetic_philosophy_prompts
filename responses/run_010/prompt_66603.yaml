answer: |-
  ### (i) Exam Question as Printed  

  **PHIL 402: Philosophy of Science  
  Summer Examination 2025**  
  **Time Allowed: 75 minutes**  
  **Answer the compulsory question below.**  

  *You may assume:*  
  - A propositional language with two **logically independent** atomic sentences:  
    - *H*: "It is hot"  
    - *W*: "It is windy"  
  - The **actual world** makes both *H* and *W* true.  
  - **Verisimilitude (truthlikeness)** is defined as follows:  
    A theory *A* has *at least as much verisimilitude* as theory *B* iff:  
    (i) All true logical consequences of *B* are also consequences of *A*;  
    (ii) All false logical consequences of *A* are also consequences of *B*.  

  *Notes:*  
  - "True consequences" = consequences true in the actual world; "false consequences" = consequences false in the actual world.  
  - Theories are compared solely via their sets of logical consequences.  
  - **Do not** appeal to external literature. All reasoning must derive from the definition above.  

  ---  
  **QUESTION**  
  **(a)** Consider the following four theories:  
  1. \( T_1 \): \( H \land W \)  
  2. \( T_2 \): \( W \)  
  3. \( T_3 \): \( H \land \neg W \)  
  4. \( T_4 \): \( \neg W \)  

  Using the definition of verisimilitude:  
  (i) Determine which pairs of theories are comparable (i.e., for which pairs \( \{T_i, T_j\} \) can we say \( T_i \) has at least as much verisimilitude as \( T_j \), or vice versa).  
  (ii) Sketch the resulting partial ordering (e.g., using inequalities like \( T_1 > T_2 \)).  
  (iii) Identify a **general pattern** about the comparability of *false* theories exhibited by these cases.  
  *Support all claims by explicitly identifying* **specific consequences** *that satisfy or violate conditions (i) and (ii) of the definition.*  
  **[12 marks]**  

  **(b)** A repair to the definition is proposed:  
  - Rewrite a theory into **irredundant conjunctive normal form** (CNF).  
  - **Score** = (number of CNF clauses true in actual world) – (number false in actual world).  
  - Then: \( A \) has at least as much verisimilitude as \( B \) iff \( \text{Score}(A) \geq \text{Score}(B) \).  

  Using this repair:  
  (i) Compute the scores for \( T_1, T_2, T_3, T_4 \). Show your working.  
  (ii) Does this repair succeed in providing a consistent ordering? Explain why or why not.  
  *Crucially, your explanation must:*  
  - Demonstrate failure **within the two-atom language** \(\{H, W\}\), using logical equivalences.  
  - Explain why demonstrating failure by adding a third atomic sentence (e.g., "it is rainy") **would not establish the same point**.  
  **[10 marks]**  

  **(c)** Suppose verisimilitude could *only* be defined relative to a choice of primitive vocabulary. What implications would this have for:  
  (i) Explaining scientific progress (e.g., why replacing one successful theory with another constitutes improvement)?  
  (ii) Underwriting scientific realism (e.g., the claim that our best theories are "approximately true")?  
  *Avoid vague conclusions. Assess whether these projects can still succeed and under what conditions.*  
  **[8 marks]**  

  ---  
  Total: 30 marks  

  ---

  ### (ii) Model Answer (≈900 words)  
  **(a)**  
  **(i–ii)** The definition permits comparison only if one theory dominates in true consequences and is dominated in false consequences.  
  - **True consequences in actual world (both H, W true):**  
    - \( T_1 \): Consequences include H, W, H∧W.  
    - \( T_2 \): Consequences include W, ¬H∨W, but *not* H.  
    - \( T_3 \): Consequences include H, ¬W, but *not* W.  
    - \( T_4 \): Consequences include ¬W, H∨¬W, but *not* H or W.  

  - **False consequences in actual world:**  
    - \( T_1 \): None (all consequences true).  
    - \( T_2 \): Include ¬H (false, since H true).  
    - \( T_3 \): Include ¬W (false) and H∧¬W (false).  
    - \( T_4 \): Include ¬W (false) and ¬H∧¬W (false).  

  **Comparable pairs:**  
  - \( T_1 > T_2 \):  
    - \( T_1 \) has all true consequences of \( T_2 \) (e.g., W).  
    - False consequences of \( T_1 \) (none) are included in \( T_2 \)’s (e.g., ¬H).  
    - But \( T_1 \) has true consequence H lacking in \( T_2 \) → strict inequality.  
  - \( T_1 > T_3 \): Similarly, \( T_1 \) has all of \( T_3 \)’s true consequences (e.g., H) and no false consequences, while \( T_3 \) has false ¬W.  
  - \( T_1 > T_4 \): \( T_1 \) has all true consequences of \( T_4 \) (e.g., H∨¬W) and no false ones; \( T_4 \) has false ¬W.  
  - **No other pairs comparable:**  
    - \( T_2 \) vs. \( T_3 \):  
      - \( T_2 \) lacks \( T_3 \)’s true consequence H → blocks \( T_3 \leq T_2 \).  
      - \( T_3 \) lacks \( T_2 \)’s false consequence ¬H → blocks \( T_2 \leq T_3 \) (since \( T_3 \)’s false consequence ¬W is not in \( T_2 \)’s false consequences).  
    - \( T_2 \) vs. \( T_4 \): \( T_2 \) has true W not in \( T_4 \); \( T_4 \) has false ¬W not in \( T_2 \)’s false consequences (which include ¬H but not ¬W).  
    - \( T_3 \) vs. \( T_4 \): \( T_3 \) has true H not in \( T_4 \); \( T_4 \) has false ¬H∧¬W not in \( T_3 \)’s false consequences.  

  **Partial ordering:**  
  \( T_1 > T_2 \), \( T_1 > T_3 \), \( T_1 > T_4 \); \( T_2 \), \( T_3 \), \( T_4 \) pairwise incomparable.  

  **(iii) General pattern:**  
  - True theories (here only \( T_1 \)) are maximally truthlike and comparable by strength (stronger = better).  
  - False theories *can* be comparable to true theories (if weaker) but **need not be comparable to each other**, even when equally false. Here, \( T_2 \), \( T_3 \), \( T_4 \) are all false but incomparable because each has a unique "deficit" (missing true consequence or extra false consequence).  

  **(b)**  
  **(i) Scores for repair:**  
  - \( T_1 \): \( H \land W \) → Irredundant CNF: \((H \lor \neg H) \land (W \lor \neg W)\)? No; irredundant CNF is \( H \land W \) (two 1-literal clauses). **Score = 2 (both true) – 0 = +2**.  
  - \( T_2 \): \( W \) → CNF: \( W \) (one clause). **Score = 1 – 0 = +1**.  
  - \( T_3 \): \( H \land \neg W \) → CNF: \( H \land \neg W \). **Score = 1 (H true) – 1 (\(\neg W\) false) = 0**.  
  - \( T_4 \): \( \neg W \) → CNF: \( \neg W \). **Score = 0 – 1 (\(\neg W\) false) = –1**.  
  Order: \( T_1 \) (+2) > \( T_2 \) (+1) > \( T_3 \) (0) > \( T_4 \) (–1).  

  **(ii) The repair fails** because the score depends on logically equivalent formulations. Consider \( T_2 \) (\( W \)) rewritten in irredundant CNF:  
  - As \( W \): Score = +1.  
  - Logically equivalent to \( (W \lor H) \land (W \lor \neg H) \) (clauses: \( W \lor H \), \( W \lor \neg H \)). Both clauses true (since W true), so **Score = 2 – 0 = +2**.  
  Same theory, but +1 vs. +2 → Ordering not invariant.  

  **Why not add a third atom?**  
  - Adding an atom (e.g., R) would change the *language*, so scores across different vocabularies need not align. The problem here is deeper: even with fixed atoms, **logically equivalent theories in the same language** can score differently. Demonstrating with extra atoms shows language-dependence, but the repair fails *internally* due to non-invariance under equivalence.  

  **(c)**  
  Vocabulary-relativity undermines verisimilitude if truthlikeness is meant to be an objective, world-guided property. However:  
  - **(i) Scientific progress:** A vocabulary-relative measure *can* explain theory replacement *within a fixed paradigm* (e.g., Newtonian to relativistic mechanics using mass/energy). If primitives are stable, progress is "directionally" robust. But if theory change shifts primitives (e.g., phlogiston → oxygen), comparing scores requires a "translation manual" – which may not exist or may be interest-relative.  
  - **(ii) Scientific realism:** Realism asserts our best theories are *objectively* approximately true. Vocabulary-relativity threatens this: if "approximate truth" depends on arbitrary primitives, it cannot reflect mind-independent structure. A defender must argue that **mature sciences converge on a privileged vocabulary** (e.g., natural kinds) that "carves nature at its joints". Without this, verisimilitude becomes instrumental, not metaphysical.  
  **Conclusion:** The repair fails technically, but vocabulary-relativity does not doom realism *if* primitives track reality. This, however, demands a substantive (and controversial) philosophical defense.  

  ---

  ### (iii) Marking Scheme (Total: 30 marks)  
  **General:**  
  - **First-class (70+%):** Derives all results from definition; identifies witnesses; demonstrates non-invariance in (b) correctly; nuanced (c) separating technical/ philosophical issues.  
  - **Upper-second (60–69%):** Correct results but incomplete witness identification; partially correct (b) demonstration; generic (c).  
  - **Lower-second (50–59%):** Superficial grasp; asserts "collapse" without derivation; errors in ordering.  
  - **Fail (<50%):** Major errors (e.g., misranking, missing incomparability).  

  **Part (a) [12 marks]**  
  - (i) **Comparability [6]:**  
    - \( T_1 \) comparable to all others (strictly greater) [1].  
    - \( T_2 \), \( T_3 \), \( T_4 \) pairwise incomparable [3].  
    - **Witness identification [2]** (e.g., for \( T_2 \) vs. \( T_3 \): \( T_3 \) lacks \( T_2 \)’s false ¬H; \( T_2 \) lacks \( T_3 \)’s true H).  
  - (ii) **Ordering [3]:** Correct partial order (as above) [2]; strict inequalities noted [1].  
  - (iii) **Pattern [3]:** True theories ranked by strength [1]; false theories need not be comparable [1]; explanation of "deficit" [1].  

  **Part (b) [10 marks]**  
  - (i) **Scores [3]:** \( T_1\): +2, \( T_2\): +1, \( T_3\): 0, \( T_4\): –1 [2]; working shown [1].  
  - (ii) **Failure [7]:**  
    - Correct demonstration: \( T_2 \) as \( W \) (+1) vs. \((W \lor H) \land (W \lor \neg H)\) (+2) [3].  
    - Explains irredundancy blocks redundancy (e.g., not adding tautologies) [1].  
    - Language-enrichment contrast: Adding atoms shows language-dependence, but repair fails *within* language [3].  

  **Part (c) [8 marks]**  
  - (i) **Progress [3]:** Fixed vocabulary allows progress explanation [1]; paradigm shifts problematic [1]; translation manuals discussed [1].  
  - (ii) **Realism [5]:** Threat to objectivity [2]; privileged vocabulary needed [2]; conditional defense (e.g., natural kinds) [1].  

  **Characteristic Errors (with deductions):**  
  1. **Asserts "Popper's definition collapses" without derivation (e.g., "as proven in 1974...")** → –3 in (a).  
  2. **Claims trouble is "double-counting consequences"** (misdiagnosis) → –2 in (a) or (b).  
  3. **Conflates verisimilitude with probability** (e.g., "weaker theories are closer") → –2 in (a).  
  4. **States incomparability without witness consequences** → –2 per pair in (a).  
  5. **Demonstrates non-invariance in (b) by adding third atom** → –3 in (b).  
  6. **Treats repair failure as "refutation of realism"** (oversimplified (c)) → –3 in (c).  

  ---  
  **END OF PAPER**
