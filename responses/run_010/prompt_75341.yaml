answer: |-
  ## Joint Statement of Principles & Disagreements: Adversarial Collaboration on the Closed-Set Superrationality Protocol

  **Preamble:** We, the Economist and the Philosopher, present this document outlining points of agreement, core disagreements, and key testable cruxes regarding the upcoming experimental protocol. Our goal is to clarify the logical structure of the debate and make concrete, falsifiable predictions prior to data collection. We agree the protocol tests how individuals act under specific conditions of symmetric information and isolation, but fundamentally disagree on what constitutes rational behavior in this closed, symmetric group.

  **I. Agreed Claims (Common Ground):**

  1.  **Protocol Structure:** The experiment has two distinct arms (A and B), each with a fresh cohort of thirty (30) isolated participants. Recruitment, screening (no prior acquaintance), communication ban, and core briefing elements (rules, exact pool size, knowledge that others are identical and briefed simultaneously) are identical across arms and cohorts.
  2.  **Arm A Payoffs:**
      *   Opting In: Costs nothing. Yields $60,000 if *exactly one* participant opts in. Yields $0 otherwise (if zero or two+ opt in).
      *   Opting Out: Costs nothing. Yields $0 always.
      *   **Dominance in A:** Opting In *weakly dominates* Opting Out. An individual is never worse off by opting in compared to opting out; they are strictly better off if they are the sole opt-in.
  3.  **Arm B Payoffs:**
      *   Opting In: Costs a non-refundable $400 fee. Entitles participant to an equal share of the $6,000 pot *only if* they opt in. Share = $6,000 / (Total Opt-Ins).
      *   Opting Out: Costs nothing. Yields $0.
      *   **Profitability Threshold in B:** An opt-in is profitable (net gain > $0) only if the number of *other* participants opting in is thirteen (13) or fewer. If 14 or more *others* opt in, the opt-in loses money. Universal opt-in (30 in) yields a $200 loss per participant ($6,000/30 = $200; $200 - $400 = -$200).
      *   **No Dominance in B:** Neither opting in nor opting out dominates the other. The best choice depends on the expected actions of others.
  4.  **Symmetry Premise Requirement:** For the Philosopher's "superrationality" recommendation (derived from assuming perfect symmetry) to be logically compelling *as rational advice for an individual*, it must be true that all thirty participants: (a) are identical in their reasoning capabilities and goals relevant to this decision, (b) know they are identical in this way, (c) know that all others know this, and so on (common knowledge of symmetry).
  5.  **Briefings & Common Knowledge:** The briefings establish common knowledge among the thirty participants *of*:
      *   The exact rules of the game for their arm.
      *   The exact size of the pool (N=30).
      *   The fact that the other twenty-nine are people "just like them" who received the identical briefing at the identical moment and are subject to the same rules and communication ban.
      *   The briefings *do not* explicitly establish common knowledge *of* perfect symmetry of reasoning or goals beyond what is implied by "just like them." Interpretation of this phrase is contested.
  6.  **Descriptive vs. Normative:** Observing what participants *actually do* (opt-in rates) reveals descriptive behavior under these specific conditions. This data *cannot directly settle* the normative question of what constitutes rational action. However, consistent patterns *can* challenge the auxiliary psychological assumptions used to translate normative theories into predictions about real people.
  7.  **Arm A Probability (Statistician's Note):** The symmetric probability of opting in that maximizes the *group's chance* of having exactly one winner in Arm A is less than 50%. Even at this optimal probability, the overall chance of *anyone* winning (i.e., avoiding the $0 outcome for all) is below 40%.
  8.  **Prediction Requirement:** We are both required to submit numerical predictions for the opt-in rate in each arm before data is revealed.

  **II. Disagreements Table:**

  | Issue                                                                 | Economist's Position                                                                                                                                 | Philosopher's Position                                                                                                                              | Substantive or Verbal?                         |
  | :-------------------------------------------------------------------- | :--------------------------------------------------------------------------------------------------------------------------------------------------- | :-------------------------------------------------------------------------------------------------------------------------------------------------- | :--------------------------------------------- |
  | **1. Nature of Symmetry Premise**                                     | The symmetry premise (identical reasoning/goals) is a strong, contingent empirical hypothesis about a specific group. It is testable and frequently falsified. | The symmetry premise is a constitutive rule of practical deliberation in contexts of known identicality. Assuming symmetry is required to reason rationally about symmetric games. | **Substantive** (Core difference in epistemology) |
  | **2. Role of Symmetry in Arm A Rationality**                          | Given weak dominance, opting in is the uniquely rational individual choice in Arm A, regardless of symmetry considerations. Symmetry is irrelevant to the dominance argument. | In a genuinely symmetric game with common knowledge thereof, the *only* rational choice consistent with mutual rationality is to reason from the symmetric perspective, leading to not opting in (or randomizing at low p). Individual dominance reasoning ignores the game's inherent symmetry. | **Substantive** (Core difference in rational principle) |
  | **3. Randomization in Arm A**                                         | Prescribing randomization in Arm A is not "superrationality"; it is covertly adopting a *group-level* perspective or "team reasoning." It smuggles in an objective to maximize group success (chance of a winner), not individual rationality. | Symmetric, low-probability randomization in Arm A *is* the superrational individual strategy. It accounts for the interdependence of choices inherent in the symmetry. It maximizes the *individual's chance* of being the sole winner *if* others follow the same symmetric logic. | **Substantive** (Deeper disagreement about individualism vs. interdependence) |
  | **4. Rationality in Arm B**                                           | Rational choice in Arm B involves estimating others' likely actions based on incentives and beliefs. The symmetric Nash equilibrium is universal opt-out (all get $0), as no one wants to be the sucker paying $400 when too many others opt in. Coordination on partial entry is fragile. | The superrational symmetric solution for Arm B is for exactly 14 participants to opt in (each expecting ≤13 others). This yields a net $0 for the 14 ($6k/14 ≈ $429; $429 - $400 = +$29) and $0 for the 16 who opt out. This respects the threshold and symmetry. | **Substantive** (Different solution concepts: Nash vs. Symmetry-based) |
  | **5. Meaning of "Rational"**                                          | "Rational" means instrumentally choosing the action that maximizes one's own expected payoff given one's beliefs about the world and others' likely actions. Beliefs should be grounded in evidence and incentives. | "Rational" means reasoning consistently from the available information, including the logical implications of known symmetry and common knowledge, even when it conflicts with short-term dominance or naive best-response. | **Primarily Verbal** (Different definitions of rationality, leading to substantive differences) |
  | **6. Interpretation of "just like them"**                             | "Just like them" in the briefing primarily means they face the same rules and information. It does not imply or establish common knowledge of identical internal reasoning processes or goals beyond self-interest implied by the payoffs. | "Just like them," combined with the identical briefing and context, establishes a sufficient basis for participants to adopt the symmetry premise as a working assumption for rational deliberation. Refusing it is arbitrary. | **Substantive** (Contested psychological/semantic inference) |

  **III. Cruxes and Predictions:**

  1.  **Crux 1: Testability of the Symmetry Premise**
      *   **Case:** Does the observed behavior in *both* arms, under the *strictly controlled conditions* (closed set, identical briefing, no communication), provide evidence for or against the hypothesis that participants *act as if* they believe in and apply the symmetry premise? Can consistent symmetry-based behavior emerge here?
      *   **Economist Prediction (A/B):** Low probability. Predicts behavior driven by individual incentives/dominance/risk, not symmetry logic. (A: ~90-100% opt-in; B: ~0-20% opt-in - reflecting universal opt-out equilibrium).
      *   **Philosopher Prediction (A/B):** High probability. Predicts symmetry recognition drives behavior towards symmetric solutions. (A: ~0-10% opt-in - reflecting symmetric non-entry or very low p; B: ~40-50% opt-in - reflecting attempt near symmetric 14-in/16-out split).
      *   **Auxiliary Assumptions:** Economist assumes participants prioritize clear individual dominance/avoiding sure loss ($400 fee in B) over symmetry. Philosopher assumes participants recognize the symmetry implied by the setup and feel rationally compelled to use it.

  2.  **Crux 2: Legitimacy of Randomization as Superrationality**
      *   **Case:** If significant *randomization* (or low, consistent opt-in rates implying it) is observed in Arm A, does this support the Philosopher's view (symmetric superrational strategy) or the Economist's view (confusion, risk-aversion, or mistaken group-level thinking)?
      *   **Economist Prediction (A):** Very low randomization. Predicts near-universal opting in due to dominance. Sees any significant randomization as irrational error or artifact.
      *   **Philosopher Prediction (A):** Significant potential for randomization or very low deterministic opt-in rates. Predicts participants seeking the symmetric solution maximizing the chance of a winner (which requires p < 50%).
      *   **Auxiliary Assumptions:** Economist assumes participants readily identify and follow dominance. Philosopher assumes participants grasp the interdependence and the logic of symmetric randomization as the rational path to potential gain in A.

  3.  **Crux 3: Sustainability of Symmetric Cooperation in Arm B**
      *   **Case:** Can participants spontaneously coordinate near the symmetric profitable equilibrium in Arm B (around 14 opt-ins)? Or will they predominantly defect to opt-out, fearing losses if too many others opt in?
      *   **Economist Prediction (B):** Opt-in rate clusters near 0%. Predicts failure to coordinate; universal opt-out as the safe, dominant *outcome* even if not a dominant *strategy* per se. High opt-in rates unlikely.
      *   **Philosopher Prediction (B):** Opt-in rate clusters near 47% (14/30). Predicts participants use symmetry to target the profitable threshold.
      *   **Auxiliary Assumptions:** Economist assumes strong aversion to being the "sucker" (paying $400 when too many opt in) overwhelms coordination attempts. Philosopher assumes symmetry provides a focal point enabling coordination on the mutually beneficial symmetric solution.

  4.  **Crux 4: Payoffs Define the Game vs. Reasoning Defines the Payoffs**
      *   **Case:** Do participants treat the payoffs as the sole determinants of the game structure, or does the symmetry premise fundamentally alter how they perceive their available choices and potential outcomes (e.g., seeing Arm A as a coordination problem via symmetry, not just a dominance situation)?
      *   **Evidence:** Contrasting behavior between Arms A and B relative to standard game-theoretic predictions (dominance in A, pure equilibrium in B). Does behavior in A show *less* sensitivity to dominance than expected? Does behavior in B show *more* coordination than expected?
      *   **Economist Prediction:** Behavior closely follows payoff structure: High opt-in in A (dominance), Low opt-in in B (fear of loss).
      *   **Philosopher Prediction:** Behavior reflects symmetry logic overriding simple payoff cues: Low/Diffuse opt-in in A (symmetric solution), Moderate opt-in in B (symmetric coordination).
      *   **Auxiliary Assumptions:** Economist assumes participants are "payoff maximizers" in a narrow sense. Philosopher assumes participants are "rational symmetry recognizers."

  5.  **Crux 5: Default Inference from Silence/Non-Entry**
      *   **Case:** In Arm A, does an individual interpret "I don't opt in" (by themselves or others) as a deliberate choice based on symmetry (Philosopher) or as an irrational failure to seize a dominant opportunity (Economist)? What drives the decision *not* to act on dominance?
      *   **Evidence:** Post-experiment interviews (if permitted/feasible) on reasoning, especially for those opting out in A or opting in/out in B near thresholds. Observed correlation between understanding and behavior.
      *   **Economist Prediction:** Opt-outs in A stem from confusion, extreme risk aversion (fearing being one of multiple), or misunderstanding dominance. Not symmetry reasoning.
      *   **Philosopher Prediction:** Opt-outs in A (or low p) stem from recognition of the symmetry logic. Opt-outs in B at high expected participation stem from recognizing the threshold was exceeded.
      *   **Auxiliary Assumptions:** Economist attributes non-dominant choices to cognitive limitations or errors. Philosopher attributes them to correct application of symmetry-based reasoning.

  **IV. Conditions for Abandoning Position:**

  *   **Economist Would Abandon Her Core Position (Individual Dominance/Nash as Normative) If:**
      *   **Arm A:** Consistently low opt-in rates (< ~20%) *across multiple replications/variations* with clear dominance, *coupled* with strong evidence (e.g., verified reasoning reports) that participants opted out *specifically* due to belief in and application of the symmetry premise as rational. (Not just confusion or risk aversion).
      *   **Arm B:** Consistent, robust coordination near the symmetric 14-in equilibrium *without communication*, *coupled* with evidence this coordination is driven by symmetry reasoning, not random chance or other focal points. This would challenge the inevitability of defection.
  *   **Economist Might Revise Auxiliary Assumptions (Psychology):** If behavior deviates but is explainable by standard psychological factors (misunderstanding, risk aversion, focal points unrelated to symmetry), without requiring abandonment of the normative decision rule.
  *   **Philosopher Would Abandon His Core Position (Symmetry as Constitutive) If:**
      *   **Arm A:** Near-universal opt-in (> ~90%) *across multiple replications/variations*, *coupled* with evidence participants clearly understood dominance and saw symmetry as irrelevant or irrational. Showing the symmetry premise is consistently rejected as a basis for action.
      *   **Arm B:** Consistent movement towards universal opt-out (near 0% opt-in) *despite the symmetric profitable equilibrium*, *coupled* with evidence participants understood the threshold but deemed symmetric coordination impossible or irrational. Showing symmetry fails as a practical guide.
  *   **Philosopher Might Revise Auxiliary Assumptions (Psychology):** If behavior deviates from symmetry predictions but can be attributed to participants failing to grasp the symmetry logic or its implications, without undermining the *normative* claim that they *should* have used it.

  **V. Accounting of Verbal Disputes:**

  Significant portions of our disagreement stem from differing definitions and conceptual frameworks:

  1.  **"Rational":** This is the core verbal dispute. The Economist uses a narrow instrumental definition ("maximize expected payoff given beliefs"). The Philosopher uses a broader definition incorporating logical consistency with common knowledge and symmetry ("reasoning correctly from the information"). This verbal difference drives much of the substantive disagreement about what action is prescribed.
  2.  **"Symmetric":** While we agree on the setup's objective symmetry, we disagree on its normative force. The Economist sees it as descriptive context; the Philosopher sees it as prescriptive for reasoning. This leads to verbal disputes about whether a solution is "really" symmetric or just happens to be the same for everyone.
  3.  **"Individual" vs. "Interdependent" Reasoning:** The Economist views the dominance argument in A as purely individual. The Philosopher argues that true individual reasoning in a symmetric game *must* account for interdependence via symmetry. This is partly a substantive difference in reasoning process, but framed verbally as a dispute about what constitutes "individual" reasoning.
  4.  **"Superrationality":** The Economist sees this term as labeling a category error (smuggling in group reasoning). The Philosopher sees it as the correct label for genuinely rational individual reasoning under symmetry. This is primarily a verbal dispute over the term's meaning, reflecting the deeper substantive divide.
  5.  **Interpretation of "just like them":** The disagreement over what psychological inferences participants *should* or *do* make from this phrase involves contested semantics and psychology, feeding into the substantive dispute about the symmetry premise's status.

  This document clarifies the battleground. The experiment tests whether real people, under these specific conditions, behave in ways aligned more closely with the Economist's individual-incentive model or the Philosopher's symmetry-reasoning model, and crucially, *why* they do so. The data will challenge our auxiliary assumptions; sufficiently strong and consistent results could force revision of core positions.
