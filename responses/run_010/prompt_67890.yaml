  First, I need to understand the core tension: M. is arguing for truth in labeling based on institutional integrity, while D. is emphasizing aesthetic experience and practical consequences. The user specifically wants me to evaluate three key aspects: whether D's point about workshop practices refutes M's achievement theory, the significance of "nobody can tell the difference," and whether M's replica analogy holds water.

  Looking at the arguments systematically: M's position is philosophically solid but risks being absolutist, while D makes practical points that could undermine institutional credibility. The threat from the donor's family adds real-world pressure that makes this more than academic. 

  On the three focal questions: D's workshop examples don't actually refute M's achievement theory because they involve transparent practices - the key distinction is about deception. "Nobody can tell the difference" is irrelevant to attribution but speaks to aesthetic value preservation. M's replica analogy is strong because it exposes how D's logic could justify substitution - though conservators would reject this precisely because authenticity matters beyond appearance.

  The committee seems stuck between ethical imperative and practical consequence. A possible solution might be contextual relabeling that acknowledges both the workshop origin and aesthetic merit, while negotiating with the family about the collection's future. The valuation issue should be handled separately from display decisions.

  I'll structure my response exactly as requested - bottom line first, then analysis of the dispute's object, move-by-move evaluation, discussion of missing elements, and a final verdict addressing the three specific questions. The tone should remain professional but accessible, recognizing that both sides have valid concerns even if M's principles ultimately carry more weight for a museum.
answer: |-
  ### Bottom line
  M. is substantially more correct on core principles of museum ethics, though D. raises valid concerns about aesthetic experience and institutional consequences. The committee must correct the attribution immediately to maintain institutional integrity, but should explore display and collection strategies that acknowledge the drawing's pedagogical value while mitigating donor fallout. Valuations should reflect the new attribution but remain separate from display decisions.

  ### The object of the dispute
  M. and D. fundamentally disagree about **what museums are obligated to assert truthfully** and **how material authenticity relates to aesthetic experience**. M. sees the wall label as an institutional truth-claim requiring correction once proven false, prioritizing scholarly accuracy and the artwork’s ontological status (its origin as an artist’s trace). D. prioritizes perceptual equivalence ("nobody can tell the difference") and fears practical consequences (devaluation, donor retaliation), treating the label as incidental to the visual encounter. They talk past each other on whether "value" means market price (D.’s focus) or historical/artistic significance (M.’s focus). D. conflates *display worthiness* with *attribution*, while M. underestimates how workshop practices complicate "authenticity."

  ---

  ### Move-by-move analysis

  1.  **M.'s opening statement: Clearly right.**  
      Museums hold public trust; labels are assertions of authority. Knowingly displaying misinformation violates core ethical duties (AAM/AMA guidelines). "Studiously empty" labels evade responsibility when facts are known. Truthfulness isn’t conditional on visitor detection or aesthetic impact.

  2.  **D.'s response: Partly right (but gravely mistaken in implication).**  
      Perceptual indistinguishability is *real* but irrelevant to attribution. It highlights the drawing’s aesthetic/educational value but doesn’t negate the ethical duty to correct provenance. D. correctly notes the label isn’t *part of the drawing*, but it *is* part of the museum’s discourse *about* the drawing.

  3.  **M.’s "record of achievement" claim: Partly right (needs refinement).**  
      M. correctly identifies ontological distinction: an artist’s hand creates a unique historical trace, while a student copy documents pedagogy. However, this risks overstatement. Value *can* attach to non-authorial achievements (e.g., a perfect copy’s technical skill). Her point holds here because **the museum’s misattribution falsely assigns the achievement to the master**, obscuring the student’s role.

  4.  **D.’s workshop examples: Partly right (shows need for qualification, not refutation).**  
      D. validly notes cases where authorship isn’t singular (medieval icons, workshops, master printers). This exposes a flaw in M.’s initial "artist’s own hand" phrasing. However, these practices are **transparently presented** by institutions. The issue isn’t assistantship per se, but **falsely claiming singular authorship against evidence**. M.’s core argument survives: we must label honestly based on best knowledge.

  5.  **M.’s precision on transparency/sanction: Clearly right.**  
      M. refines her position correctly. The ethical breach is the **institution’s false assertion**, not assistant involvement inherently. Medieval icons are labeled "anonymous"; workshop pieces are labeled as such; master printers operate under the artist’s explicit authorization. Here, the museum would assert sole authorship by the master, which is unsupported.

  6.  **D.’s objection to deaccession/devaluation: Partly right (on consequences, wrong on motives).**  
      D. rightly flags severe consequences: donor fallout and loss of access to undisputed art. Collapsing valuation *does* expose market fetishization. However, conflating deaccession/devaluation with M.’s ethics argument is unfair. M.’s stance concerns labeling, not necessarily removal (a separate curatorial decision). The threat of donor withdrawal is coercive; yielding prioritizes convenience over integrity.

  7.  **M.’s replica analogy: Clearly right (and the disanalogy strengthens it).**  
      M.’s analogy succeeds brilliantly. If "identical marks" were sufficient, museums *could* ethically substitute replicas for originals – but they don’t, proving authenticity matters beyond appearance. The disanalogy D. might cite (the studio copy *is* period-authentic, a replica isn’t) **backfires**: it shows why *this* drawing has value *as a studio copy* – value destroyed by false attribution. Conservators reject replica substitution precisely because provenance/authenticity are core to museum mission, validating M.’s point.

  ---

  ### What both of them are missing
  **The potential of the object *as* a studio copy.** Both frame it as diminished: M. as a lesser achievement, D. as a devalued commodity. Neither fully explores its **positive significance as pedagogical evidence**. It’s a material witness to the master’s teaching methods, studio practice, and artistic dissemination. Displayed honestly ("Studio of X, copy after X’s *[Title]*, c. [Date], likely by a student"), it offers unique historical insight lost if removed or mislabeled. This reframes "value" beyond market or singular authorship. Additionally, **ethical labeling and display aren’t binary.** The committee could retain it on view with revised interpretation exploring workshop context, satisfying M.’s integrity concerns while preserving access D. values. The donor threat requires diplomatic negotiation focused on the object’s *continuing worth as a teaching tool*, not its price tag. Finally, **valuation (insurance/financial) is distinct from curatorial/display decisions**; conflating them muddies the ethical waters.

  ---

  ### Verdict
  *   **D.’s point (4) - Workshop Practices:** Does **not refute** M.’s achievement account; it **shows need for qualification**. M. successfully qualifies it in (5): transparency/sanction is key. Workshop practices are ethically sound *when accurately presented*. False attribution is not.
  *   **"Nobody can tell the difference":** This is **evidence of preserved aesthetic value**, **not** evidence "nothing relevant changed." The relevant change is epistemological (we know its true origin) and ontological (it’s a different artifact type – a copy vs. an original). Aesthetic experience remains, but institutional representation must change.
  *   **M.’s replica analogy:** **Succeeds decisively.** The core disanalogy (period authenticity of the studio copy vs. modern replica) ironically strengthens her point: even an *authentic period object* loses its true significance if mislabeled. Museums care about specific authenticity, not just appearance.

  **Who wins:** **M. wins** the core ethical argument: the attribution *must* be corrected on the label. D. wins the pragmatic point that removing it entirely may be unnecessary and harmful. **The way through:** Relabel the work accurately as a studio copy *immediately*. Decide its display status separately based on its merits as a teaching object about workshop practices. Negotiate firmly but respectfully with the donor’s family, emphasizing the museum’s educational mission and the drawing’s enduring value in its correct context. Separate insurance revaluation from these curatorial/ethical decisions. This respects M.’s integrity imperative and D.’s concerns about access and aesthetics while leveraging the object’s true significance.
