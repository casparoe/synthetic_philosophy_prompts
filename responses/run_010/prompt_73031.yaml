prompt: |-
  Twice a month somebody in our tenants' union asks me some version of the same question: did *we* decide to do this, or did a few members go off and do it, and now the whole unions name is attached to it?

  Context: about 60 members, two part-time staff, decisions made at a weekly general assembly by modified consensus — you can block a proposal, or you can "stand aside," which means you don't stop it but you're not in it either. I'm the one who keeps the minutes and the commitments ledger, so the question always lands on me. Sometimes it's forward-looking: a working group wants to spend money on something and there's a fight about whether they have a mandate. Sometimes it's after the fact — last month a delegation occupied a leasing office, three people got arrested, and the assembly spent two hours arguing about whether the union had authorized it, which matters a lot because we have a legal defense fund to draw on and a public statement to write.

  Right now I answer from vibes and people shout at each other. I want a procedure I can actually run, twenty minutes tops, that ends in something I can put in front of the assembly as a record: fields to fill in, not a paragraph of impressions. The people running it have no philosophy background and won't read anything longer than two pages, and my co-coordinator signs off before it becomes official.

  Build it on whatever the philosophy of joint action and collective intentionality actually knows thats usable. I gather there's a real literature on what it takes for a bunch of individuals to count as having intended something together, and that the people in it don't agree with each other. Where they disagree, don't paper over it — tell me which side your rules follow and what the procedure gives up by following that side. I'd rather have an honest procedure than one that sounds neutral while quietly picking winners.

  What I need in it:

  - the questions to ask, in order, and what counts as a sufficient answer to each;
  - the points where it can just stop and say no, that wasn't the union, and the points where it has to say yes, that was us, even though everyone involved will hate hearing it;
  - where it hands off to the assembly, because the question turned out to be about what we want to be committed to rather than what we're actually committed to;
  - the hard cases it has to survive. Ours: (1) a standing mandate we gave a working group fourteen months ago that nobody ever rescinded; (2) three members standing aside on a consensus decision — is the resulting action the union's, the forty-odd who didn't stand aside's, or nobody's; (3) a member who said nothing at the assembly, showed up to the action, and now insists she was there as an individual; (4) an assembly where nearly everyone backed each premise of a statement but the statement as a whole would have lost a straight vote — this happened, and to this day nobody can agree what we decided.

  Then run it in full on three cases: two you pick from the four above, and one where the verdict comes out against me, because I was the person arguing the occupation delegation was unauthorized and I want to know whether the procedure is capable of telling me I was wrong.

  Finish with what it can't settle at all — where there's no fact to find and we're just choosing what kind of group we want to be.

  One more thing: our ledger is a mess. If a usable version of this needs me to record things differently going forward, say which fields I should be capturing at the time, so the question is answerable in three weeks instead of being reconstructed from memory and a WhatsApp group.
reasoning: |-
  Okay, the user is part of a tenants' union with about 60 members and two part-time staff. They're facing a recurring problem where members question whether certain actions were officially sanctioned by the union or undertaken by individuals using the union's name. This happens about twice a month, causing disputes during their weekly general assemblies. The user keeps minutes and a commitments ledger, so they're often the one fielding these questions.

  The union uses a modified consensus model for decision-making where members can block proposals or "stand aside" (meaning they don't support but won't stop the action). The user wants to create a streamlined procedure (20 minutes max) that can determine whether an action was collectively authorized, ending with clear documentation rather than subjective interpretations. They want this grounded in philosophy of joint action and collective intentionality literature.

  Key requirements include:
  - Specific questions to ask in sequence with clear criteria
  - Clear stopping points for definitive "no" or "yes" decisions
  - Handoff points to the assembly when it's about future commitments rather than past facts
  - Must handle specific hard cases from their experience
  - Needs to work even when the verdict goes against the user's position
  - Should identify what it can't resolve (purely normative questions)
  - May require changes to how they record meetings

  The user mentioned four challenging scenarios:
  1. A standing mandate given to a working group 14 months ago that was never rescinded
  2. Three members standing aside in a consensus decision - whose action is it?
  3. A member who remained silent at assembly but participated in action, claiming individual participation
  4. An assembly where members agreed on premises but would have rejected the full statement

  I need to build this procedure drawing from philosophical concepts like Bratman's shared cooperative activity, Gilbert's plural subject theory, and List & Pettit's group agency. Where theorists disagree, I'll be transparent about which approach I'm favoring.

  The procedure should have four phases: establishing the event, checking for prior authorization, checking for ratification, and handling ambiguous cases. For each phase, I'll define specific yes/no questions with clear evidentiary standards.

  I'll need to address how to handle their specific hard cases, and demonstrate the procedure on three scenarios: two of their cases plus one where the verdict goes against the user's position (the occupation delegation case where they argued it was unauthorized).

  Finally, I'll outline what kinds of disputes the procedure can't resolve (purely normative questions about what the union should stand for) and recommend changes to their record-keeping to prevent future ambiguity.
answer: |-
  Here's a procedure built on collective intentionality philosophy (Bratman, Gilbert, List & Pettit), designed for speed, clarity, and honest resolution of the "Was this us?" question. It prioritizes **documented, observable facts** over subjective "vibes" and forces a binary outcome ("Union Action" / "Not Union Action") or a handoff. **Core Philosophy Choice:** It primarily follows **Michael Bratman's "Shared Cooperative Activity" (SCA) framework** (shared commitment to joint action, responsiveness, commitment to mutual support) because it's practical, focused on observable commitments, and fits modified consensus. *Trade-offs:* It downplays Margaret Gilbert's "Plural Subject" theory (which requires a deeper, almost irreducible "we-intention") as too demanding for large, fluid groups, and avoids Christian List & Philip Pettit's complex "Group Agency" (requiring robust organizational structure) as overkill for your size. This means we prioritize *explicit, recorded agreements* over implied group bonds.

  **Procedure Name:** **Authorization Check (AC)**
  **Time Allotment:** 20 Minutes Max (Strict Timer)
  **Facilitator:** Minute-Keeper (You) or Neutral Party
  **Output:** "Union Action" / "Not Union Action" / "Handoff to Assembly" + Recorded Rationale (using template below)
  **Required Records:** *Revised* Minutes (see "Ledger Changes" section at end)

  ---

  **The Authorization Check (AC) Procedure: Step-by-Step**

  1.  **Define the Action (3 mins):**
      *   **Question:** "What *specific, observable action* (or statement, expense) are we questioning? Who performed it? When? Where?"
      *   **Sufficient Answer:** A clear, concise description agreed upon by the questioner and the primary actors involved (if present). *Avoid motivations, goals, or broader context at this stage.*
      *   **Output:** A written statement of the Action (e.g., "Members A, B, C occupied XYZ Leasing Office on [Date], resulting in 3 arrests.").
      *   **Stop Point (No):** If the action cannot be defined concretely ("They said stuff online" is insufficient). AC ends: "Not Union Action - Action Indeterminate."

  2.  **Check for Prior Explicit Authorization (7 mins):**
      *   **Philosophy Basis (Bratman):** Was there a *shared commitment* to *this specific action* (or a clear class of actions) formed through the group's decision process?
      *   **Questions & Criteria:**
          *   **Q1:** "Is there a *recorded Assembly decision* (consensus, modified consensus outcome) explicitly authorizing *this specific action*?" (Check Minutes/Ledger)
              *   **Yes:** Stop. "Union Action - Explicit Prior Authorization." (Record decision reference).
          *   **Q2 (If Q1=No):** "Is there a *recorded Assembly decision* authorizing a *Working Group (WG)* to undertake actions of *this specific type* (e.g., 'Direct Action WG authorized to conduct non-violent protests targeting leasing offices')?" (Check Minutes/Ledger for WG mandate *creation*).
              *   **Criteria:** Mandate must clearly *encompass* the disputed action type. "Advocacy" is too vague; "Non-violent occupation of leasing offices" is specific enough.
              *   **Yes:** Proceed to Q2a.
              *   **No:** Proceed to Step 3 (Ratification Check).
          *   **Q2a:** "Was the mandate *active* at the time of the action?" (Check Minutes/Ledger for mandate *duration* or *rescission*).
              *   **Criteria:** Assumed active unless rescinded or expired per its terms. "Nobody rescinded it" = Active. (Follows Bratman's persistence of commitment).
              *   **Yes:** Stop. "Union Action - Valid WG Mandate." (Record WG & mandate reference).
              *   **No:** Proceed to Step 3 (Ratification Check).
      *   **Stop Point (No):** If Q1=No, Q2=No, OR Q2=Yes but Q2a=No, proceed to Step 3.

  3.  **Check for Ratification (After-the-Fact Adoption) (7 mins):**
      *   **Philosophy Basis (Bratman/List & Pettit):** Did the group, *knowing the specifics of the action*, subsequently express a *shared commitment* to own it? (Rejects pure Gilbert - mere awareness isn't enough).
      *   **Questions & Criteria:**
          *   **Q3:** "Did the Assembly, *in a meeting after the action occurred and with knowledge of its specifics*, explicitly vote or reach consensus to *endorse* the action or *accept responsibility* for it?" (Check Minutes from subsequent meeting).
              *   **Criteria:** Explicit language of endorsement, acceptance, or taking responsibility. Mere "discussion" is insufficient.
              *   **Yes:** Stop. "Union Action - Ratified." (Record meeting/decision reference).
              *   **No:** Proceed to Q4.
          *   **Q4:** "Did the Assembly, *in a meeting after the action occurred and with knowledge of its specifics*, explicitly vote or reach consensus to *condemn* the action or *deny responsibility* for it?"
              *   **Criteria:** Explicit language of condemnation, disavowal, or denial of responsibility.
              *   **Yes:** Stop. "Not Union Action - Explicitly Disavowed." (Record meeting/decision reference).
              *   **No:** Proceed to Step 4 (Ambiguity & Handoff).
      *   **Stop Point (No):** If Q3=No and Q4=No, proceed to Step 4. *Silence is not ratification.*

  4.  **Handle Ambiguity & Handoff (3 mins):**
      *   **Philosophy Basis:** Recognition that no *factual* collective intention exists (per Bratman/SCA). The group must now decide its *normative stance*.
      *   **Question:** "Based on Steps 1-3, no factual basis exists to declare this a Union Action. Does the question now concern what the Union *should* be committed to regarding this action or similar future actions?"
      *   **Criteria:** If the discussion shifts to "Should we cover legal fees *even if* unauthorized?" or "Should we issue a statement *disowning* it?" or "Should we change our mandates/rules?", the answer is **Handoff**.
      *   **Output:** "Handoff to Assembly - Normative Commitment Question." (Record the specific normative question arising).
      *   **Stop Point (Final):** AC concludes. The Assembly must address the normative question separately.

  ---

  **Handling Your Hard Cases (Applying AC Procedure)**

  1.  **Standing WG Mandate (14 months old):**
      *   Step 2, Q2: Does mandate *specifically* cover this action type? (e.g., If mandate was "negotiate with landlords", occupying an office is likely *not* covered. If mandate was "direct action including occupations", it *is* covered).
      *   Step 2, Q2a: Was mandate active? (Unless rescinded/expired, *Yes*).
      *   **Verdict:** If mandate covers it, "Union Action - Valid WG Mandate." If not, proceed to Step 3 (Ratification Check). *Trade-off:* Relies on recorded mandate text. Favors stability of commitments (Bratman) over potential changes in group will (Gilbert might argue mandate lapsed due to disuse).

  2.  **3 Members Stand Aside:**
      *   Step 2, Q1: Was there a consensus decision *authorizing the action*? Modified consensus means "no blocks". Stand-asides are irrelevant to the *existence* of the group's decision (Bratman: the shared commitment is formed by those not blocking). The action is authorized by the group.
      *   **Verdict:** "Union Action - Explicit Prior Authorization." The action belongs to the union. The stand-asiders are not obligated to participate but cannot disown the union's action. *Trade-off:* Prioritizes the procedural outcome (decision made) over individual dissent post-decision. Follows modified consensus rules.

  3.  **Silent Member Participates as "Individual":**
      *   Step 2, Q1/Q2: Was the action authorized? If Yes, then participation *using union affiliation/symbols/resources* constitutes acting *as part of* the group action (Bratman: responsiveness to joint activity). Their subjective intent ("I was an individual") is overridden by objective participation in the *collective* act under the union's banner. If the action was not authorized (Step 2/3 = No), then their participation *was* individual.
      *   **Verdict:** Depends entirely on whether the *action itself* was Union Action per AC. Their presence doesn't make it union action; the union authorization makes *their participation* part of the union action. *Trade-off:* Rejects Gilbert's stronger requirement for mutual recognition of joint commitment *among all participants*; focuses on the group-level authorization.

  4.  **Premises Agreed, Whole Statement Would Have Failed:**
      *   Step 2, Q1: What was the *actual decision recorded*? Did the Assembly reach consensus *on the statement as a whole*? If the minutes show consensus *on the whole statement*, then it is Union Action (issuing the statement), regardless of hypothetical votes. If consensus was *only* reached on individual premises, but not on combining them into *this* statement, then there was no authorization for *issuing this statement*.
      *   **Verdict:** If minutes show consensus on the whole statement: "Union Action". If minutes show consensus only on premises or debate collapsed without consensus on the statement: "Not Union Action". *Trade-off:* Relies strictly on the recorded *outcome* of the decision process (Bratman/SCA outcome), not the hypothetical will of members or internal coherence. Favors procedural clarity.

  ---

  **Running the Case Against You: The Occupation Delegation**

  *   **Action Defined:** "Members X, Y, Z occupied ABC Leasing Office on [Date], leading to 3 arrests."
  *   **Step 2, Q1 (Prior Explicit Auth):** Was there a recorded Assembly decision *explicitly authorizing this specific occupation*? (Assume Minutes show *No* specific auth for this action).
  *   **Step 2, Q2 (WG Mandate):** Was there a WG mandate covering *non-violent occupations of leasing offices*? (Assume Minutes show Direct Action WG has mandate for "non-violent protests", potentially broad enough. Or maybe not).
      *   *If Mandate Covers It & Active:* **Verdict:** "Union Action - Valid WG Mandate." *You were wrong.* The procedure gives a clear, fact-based answer relying on the standing commitment.
      *   *If Mandate Doesn't Cover It / Lapsed:* Proceed to Step 3.
  *   **Step 3, Q3 (Ratification):** Did a subsequent Assembly explicitly *endorse* the occupation or *accept responsibility*? (Assume Minutes show heated debate but *no explicit endorsement/responsibility vote/consensus*).
  *   **Step 3, Q4 (Disavowal):** Did a subsequent Assembly explicitly *condemn* or *deny responsibility*? (Assume Minutes show *no explicit condemnation/disavowal*).
  *   **Step 4 (Handoff):** "Handoff to Assembly - Normative Commitment Question." (e.g., "Should the Union use its legal fund for X, Y, Z?" or "Should the Union issue a statement owning/disowning the action?"). *The procedure does NOT declare it Union Action.* It forces the Assembly to make a *normative choice* now, based on the *lack* of prior factual authorization.

  ---

  **What AC Cannot Settle (Requires Handoff/Normative Choice):**

  1.  **"Should We?" Questions:** Even if something *wasn't* a Union Action (AC verdict: No), the Assembly can *choose* to support it financially, morally, or logistically *now* (e.g., "Should we use the legal fund anyway?"). AC only determines past factual commitment.
  2.  **Changing Meaning of Past Action:** Debates like "But what did that *really* mean?" or "We should interpret that mandate *now* as covering X" are normative. AC uses the mandate's *recorded text* at the time.
  3.  **Assigning Blame/Glory Internally:** AC answers "Was this the Union?". It doesn't resolve disputes about *which members* deserve credit or blame *within* the union for the action.
  4.  **Fundamental Identity/Values:** Questions like "Is this the *kind* of action our union *should* do?" or "Does this align with our principles?" are outside AC's scope. These are for visioning, strategic planning, or policy debates.
  5.  **Resolving Contradictory/Minuted Records:** If the minutes themselves are fundamentally unclear or contradictory (e.g., two sets of "official" minutes), AC stalls. Resolution requires fixing record-keeping first.

  ---

  **Critical Ledger & Minutes Changes (For Future ACs)**

  The AC relies on **clear, searchable records**. Your current ledger is a barrier. Implement immediately:

  1.  **Decision Type:** Categorize every Assembly decision:
      *   `AUTH: [Specific Action]` (e.g., `AUTH: Picket Landlord Corp HQ on 10/1`)
      *   `WG-MANDATE: [WG Name] - [Specific Scope/Authority] - [Duration/Review Date]` (e.g., `WG-MANDATE: Direct Action - Non-violent protests incl. occupations - Review: 2024-06-01`)
      *   `POLICY: [Policy Name/Description]`
      *   `RESCIND: [Reference to prior AUTH/WG-MANDATE]`
      *   `RATIFY: [Specific Action]`
      *   `DISAVOW: [Specific Action]`
      *   `DISCUSSION: [Topic]` (No decision)
      *   `INFO: [Topic]` (Reports, updates)
  2.  **Action Verbs:** Record decisions using strong verbs: "Authorized", "Mandated", "Ratified", "Disavowed", "Rescinded", "Approved expenditure of $X for Y".
  3.  **Standing Aside/Blocks:** Clearly list names of those who *Blocked* and those who *Stood Aside* for each consensus decision. Record if consensus was achieved *despite* stand-asides/blocks.
  4.  **Motion Clarity:** Require written motions *before* consensus/vote. Record the *exact* motion text that achieved consensus.
  5.  **Normative Handoffs:** When AC results in Handoff, record the *exact normative question* posed to the Assembly for future action.
  6.  **Centralized, Accessible:** One master digital document, version-controlled, with a clear change log.

  **Why this works:** It replaces "vibes" with structured interrogation of documented commitments (Bratman's SCA), forces clear outcomes or handoffs, handles your hard cases based on *recorded facts*, and tells you honestly when you were wrong. It sacrifices the illusion of perfect group unity (Gilbert) for practical, auditable decisions based on your existing modified consensus process. The ledger changes are non-negotiable for making future ACs fast and factual.
