  ### Bargaining Problem: The App Feature Partnership

  #### Scenario
  Alice is a data provider with a high-quality dataset. Bob is a machine learning engineer who can build a valuable recommendation model using this data. Without Alice's data, Bob's model is worth $0. Without Bob's skills, Alice's data is worth $0. If they collaborate, their combined work can generate revenue, but the *total revenue* depends on how responsibilities are split due to incentive effects. They must agree on a revenue split before starting work. The system automatically assigns a split using a predefined formula.

  #### Feasible Deals & Utilities
  Utilities represent net monetary gain (revenue share minus effort cost). Effort costs are pinned to real sacrifices:
  - Alice's effort cost is $0 if she only licenses data, or $2 if she must curate/clean it.
  - Bob's effort cost is $0 for basic modeling, or $5 for advanced tuning.

  Disagreement point: (0, 0) (both walk away with nothing).  
  Feasible contracts and their utilities:

  | Contract   | Alice's Share | Bob's Share | Total Revenue | Alice's Utility (u<sub>A</sub>) | Bob's Utility (u<sub>B</sub>) |
  |------------|---------------|-------------|---------------|--------------------------------|-------------------------------|
  | **Walkaway** | 0             | 0           | 0             | 0                              | 0                             |
  | **A**      | 20%           | 80%         | 100           | 20 - 0 = **20**                | 80 - 5 = **75**               |
  | **B**      | 30%           | 70%         | 100           | 30 - 0 = **30**                | 70 - 0 = **70**               |
  | **C**      | 50%           | 50%         | 100           | 50 - 0 = **50**                | 50 - 0 = **50**               |
  | **D**      | 60%           | 40%         | 100           | 60 - 0 = **60**                | 40 - 0 = **40**               |
  | **E**      | 65%           | 35%         | 90            | 65 - 2 = **63**                | 35 - 0 = **35**               |

  **Key**:
  - **Utilities zero point**: $0 net gain (effort cost = revenue share).
  - **Utility scale**: Linear in dollars (1 util = $1 net gain).
  - **Why effort costs vary**: 
    - Alice only incurs effort cost in Contract E (must curate data for partial handoff).
    - Bob incurs effort cost in Contract A (must tune model due to Alice's minimal involvement).
  - **Dominated deal**: Contract E (63, 35) is *dominated* by Contract D (60, 40) since 60 > 35 (Alice) and 40 > 35 (Bob). It should never be chosen.

  ---

  ### Solutions
  1. **Nash Solution**: Maximize (u<sub>A</sub> - d<sub>A</sub>) × (u<sub>B</sub> - d<sub>B</sub>), where d = (0, 0).  
     Products:  
     - A: 20 × 75 = 1,500  
     - B: 30 × 70 = 2,100  
     - C: 50 × 50 = 2,500  
     - D: 60 × 40 = 2,400  
     - E: 63 × 35 = 2,205  
     **Nash choice: Contract C (50, 50)** (highest product: 2,500).

  2. **Kalai–Smorodinsky (KS) Solution**: Equalize proportional gains:  
     - Ideal point: max u<sub>A</sub> = 63, max u<sub>B</sub> = 75 (from the feasible set).  
     - Gains over disagreement:  
       - A: min(20/63, 75/75) = min(0.317, 1) = 0.317  
       - B: min(30/63, 70/75) = min(0.476, 0.933) = 0.476  
       - C: min(50/63, 50/75) = min(0.794, 0.667) = 0.667  
       - D: min(60/63, 40/75) = min(0.952, 0.533) = 0.533  
       - E: min(63/63, 35/75) = min(1, 0.467) = 0.467  
     **KS choice: Contract C (50, 50)** (highest min-ratio: 0.667).

  3. **If Contract E (dominated) is removed**:  
     - Nash still picks **C (50, 50)** (product 2,500 is still highest).  
     - KS ideal point changes: max u<sub>A</sub> = 60 (from D), max u<sub>B</sub> = 75 (from A).  
       - A: min(20/60, 75/75) = min(0.333, 1) = 0.333  
       - B: min(30/60, 70/75) = min(0.500, 0.933) = 0.500  
       - C: min(50/60, 50/75) = min(0.833, 0.667) = 0.667  
       - D: min(60/60, 40/75) = min(1, 0.533) = 0.533  
     **KS now picks B (30, 70)** (min-ratio 0.500 < 0.667, but *highest available*).

  ---

  ### Test Case Results
  - **Nash split**: 50/50.  
  - **KS split without E**: 30/70.  
  - **Gap**: Alice gains $20 less (30 vs 50), Bob gains $20 more (70 vs 50).  
  - **Spontaneous fairness judgment**:  
    Most people say "split 50/50" (matches Nash). Why? Intuitive symmetry—both are essential, neither contributed more visibly.  
    **Not engineered**: Real-world collaborators default to equal splits unless effort/value disparities are obvious. Here, effort costs are opaque without context.

  ---

  ### Variant: Moving Disagreement Point
  Change disagreement to **Alice’s BATNA = $10** (she could license low-quality data elsewhere), **Bob’s BATNA = $0**. Utilities become:  
  - d = (10, 0)  
  - Contract utilities adjusted: Subtract 10 from Alice’s share.  
    - B: (30 - 10, 70) = (20, 70)  
    - C: (50 - 10, 50) = (40, 50)  
    - D: (60 - 10, 40) = (50, 40)  

  **Nash product** (with d):  
  - B: 20 × 70 = 1,400  
  - C: 40 × 50 = 2,000  
  - D: 50 × 40 = 2,000  
  Nash ties C/D.  

  **KS**: Ideal u<sub>A</sub> = 53 (63 - 10), u<sub>B</sub> = 75. Gains:  
  - B: min(20/53, 70/75) = min(0.377, 0.933) = 0.377  
  - C: min(40/53, 50/75) = min(0.755, 0.667) = 0.667  
  - D: min(50/53, 40/75) = min(0.943, 0.533) = 0.533  
  KS picks **C (40, 50)**.  

  **"Fairer" flips**: With d=(0,0), 50/50 feels fair. With d=(10,0), people say Alice deserves more—**C (40,50)** aligns better (Alice nets $40, Bob $50).

  ---

  ### Analysis
  #### Key Feature Driving the Difference
  - **Ideal point sensitivity in KS**: Contract E sets Alice’s max utility (u<sub>A</sub>=63). When removed, KS shifts to favor Bob (30/70 split) because Alice’s "aspiration" drops.  
  - **Nash ignores non-binding options**: Contract E is dominated and irrelevant to Nash; only the frontier matters.  

  #### With Feature Removed
  If all contracts have uniform effort costs (no dominated options), KS and Nash align on 50/50.

  #### Defender Counterarguments
  - **KS defender**: "The ideal point reflects *real bargaining power*. Alice *could* push for 63 by threatening partial effort (Contract E), even if irrational. Removing it artificially weakens her position."  
    - **Is this a dodge?** Partly. KS assumes parties know all options, but in practice, dominated deals are irrelevant. It’s a vulnerability of the axiom.  
  - **Nash defender**: "KS is unstable—adding a terrible, never-chosen option for Alice (e.g., 90% share if she works 80-hour weeks) would skew the split. Nash relies only on credible threats (disagreement) and efficiency."

  #### Does This Discriminate Fairness Views?
  **Yes**. It tests whether fairness should:  
  - **Nash**: Ignore non-credible threats and maximize joint gain ("what we create together").  
  - **KS**: Account for all options to balance power disparities ("what you *could* get").  
  The case forces a choice: Is Contract E a legitimate bargaining chip (KS) or noise (Nash)?

  #### Negotiation vs. Automated Context
  - Nash emerges from a **demand game** (parties claim shares; if feasible, they get it). This implies procedural fairness.  
  - KS lacks a canonical game, making it **arbitrary in automation**—why should a cron job care about non-binding options?  
  - **For your system**: Nash is safer. It’s stable (insensitive to irrelevant alternatives) and aligns with intuition. KS injects volatility via phantom ideals.

  ### Recommendation
  Use **Nash** in your system. It’s computationally simple, robust to dominated options, and matches layman fairness intuitions. Kalai–Smorodinsky introduces noise for no clear benefit in an automated context.
