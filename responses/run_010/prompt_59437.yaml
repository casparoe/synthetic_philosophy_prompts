answer: |-
  ### Workshop Design: "The Boundary Block"

  **Core Objective:** Participants experience how procedural structures create restrictive outcomes without individual bad faith, and how boundary changes shift but don't resolve exclusion.

  ---

  ### (a) Project Dossier: "The Vista Grove Apartments"  
  **City:** Brookhaven (fictional)  
  **Site:** Vacant lot at 300 Oak Street, zoned R-3 (Low-Density Residential). Adjacent to:  
  - North: *Harmony Rooming House* (12 low-income tenants, month-to-month leases).  
  - South: *Oak Street Community Garden* (requires 6+ hours of sun daily).  
  - East: Single-family homes with on-street parking.  
  - West: *Elm Elementary School* (95% capacity).  

  **Proposal:**  
  - 40 units (4 stories).  
  - 10 "affordable" units (80% AMI).  
  - Parking: 30 spaces (code requires 60).  
  - Construction: 18 months.  

  **Required Variances:**  
  1. **Height:** R-3 allows 3 stories (Design Review Board).  
  2. **Parking:** 30 spaces vs. 60 required (Zoning Board).  
  3. **Density:** 40 units vs. 25 allowed (Planning Commission).  
  4. **Final Approval:** City Council.  

  **Key Objections:**  
  - **Parking spillover:** Street parking congestion in residential zone.  
  - **Shadow:** 4-story building reduces sun to garden (2 hours/day loss in winter).  
  - **School capacity:** 10+ new students would exceed Elm Elementary’s capacity.  
  - **Displacement:** Rooming house tenants fear rent hikes.  
  - **Affordability gap:** 80% AMI units don’t serve typical local renters (50% AMI).  
  - **Precedent:** Approval could enable corridor-wide upzoning.  

  ---

  ### (b) Roles & Briefs  
  *Each table has 14 participants (7 roles × 2 players/role). Private lines are for internal motivation, not shared.*  

  | Role                  | Public Brief                                                                 | Private Line (Table A: Financial Stake)                                                                 | Private Line (Table B: No Financial Stake)                                                                 |
  |------------------------|-----------------------------------------------------------------------------|--------------------------------------------------------------------------------------------------------|----------------------------------------------------------------------------------------------------------|
  | **Design Review Board (DRB)** | Ensure design compatibility. Focus: Shadow impact on garden.                | *You serve at council’s pleasure. Reappointment depends on avoiding controversy.*                       | *You’re an architect. This project could win you future commissions if handled well.*                    |
  | **Zoning Board (ZB)**       | Enforce parking minimums. Focus: Parking spillover risk.                   | *Your home’s value relies on street parking access. A drop could trigger foreclosure.*                  | *You bike everywhere. Parking shortages don’t affect you.*                                             |
  | **Planning Commission (PC)** | Assess infrastructure impacts. Focus: School capacity, drainage.           | *Your child attends Elm Elementary. Overcrowding = worse education.*                                    | *You’re childfree. School issues feel abstract.*                                                       |
  | **City Council (CC)**       | Vote on project. Balance local concerns with city housing needs.           | *Homeowners are 60% of your voters. Defying them risks re-election.*                                    | *Renters dominate your district. Blocking housing loses votes.*                                        |
  | **Neighborhood Assoc. (NA)** | Represent residents. Oppose shadow, parking, precedent.                    | *Your home is 90% of your net worth. A precedent could devalue it 20%.*                                 | *You rent. You oppose shadow to protect garden volunteers (your aging parents).*                       |
  | **Tenant Union (TU)**       | Demand deeper affordability, anti-displacement measures.                   | *You fear rent hikes but worry no housing = higher rents overall. Pragmatism needed.*                   | *Same as Table A.*                                                                                      |
  | **Project Applicant (PA)**  | Advocate for approval. Revise plans if forced, but delay = costs.          | *Each month of delay costs tokens. Profit requires minimal concessions.*                                | *Same as Table A.*                                                                                      |

  ---

  ### (c) Gate Structure & Token Ledger  
  **Process:**  
  1. **Gates:** DRB → ZB → PC → CC (sequential).  
  2. **Flag Raising:** Any board member (DRB/ZB/PC) can raise a flag for revisions if objections unresolved.  
  3. **Costs:**  
     - **Revision flag:** 5 tokens + 2 months (2 tokens/month carrying cost).  
     - **Minor condition:** No cost (e.g., "add bike racks").  
  4. **Decision Authority:**  
     - DRB/ZB/PC: Can require revisions/conditions or approve.  
     - CC: Final vote (up/down).  
  5. **PA Token Start:** 20 tokens. Withdraw if tokens ≤0.  

  **Scoring (Per Role):**  
  - **PA:** Maximize tokens left (profit).  
  - **DRB/ZB/PC/CC:** Earn 2 tokens per "public benefit" (e.g., affordable units, traffic study) to incentivize compromise.  
  - **NA/TU:** Earn 2 tokens per "community win" (e.g., shadow mitigation, anti-displacement funds).  
  *Tokens = influence points (not money). Public benefits create non-zero-sum wins.*  

  ---

  ### (d) Manipulation & Testable Disagreement  
  - **Table A:** NA roles have high financial stakes (mortgage risk, home value dependency).  
  - **Table B:** NA roles have non-financial motives (e.g., protecting garden for elderly parents).  
  - **Identical Briefs:** All other roles and objections (parking, schools, etc.) are identical.  

  **Outcome Comparison:**  
  - **Difference Found (Supports Friend):** Table A raises more flags, kills project; Table B approves. Shows financial stakes drive obstruction.  
  - **No Difference (Supports You):** Both tables have similar flag patterns. Blockage occurs regardless of financial motive.  
  - **If Identical (Expected):** *"We saw similar outcomes at both tables—suggesting the gate structure itself creates blockage, even without financial stakes. Does this match your experience?"*  

  ---

  ### (e) Round 2: Regional Boundary Shift  
  **New Body:** *Capital Region Housing Authority (CRHA)*. Controls permits but **not** school funding (remains local).  
  **Seats (5 per table, groups of 3):**  
  1. **Local Property Owner:** From Brookhaven (excludes non-owners).  
  2. **Regional Commuter:** Works in Brookhaven but lives elsewhere.  
  3. **Would-Be Mover:** Wants to relocate to Brookhaven.  
  4. **Tenant Rep:** From Brookhaven.  
  5. **Regional Planner:** "Expert" seat.  

  **Rules:**  
  - CRHA overrides local denial but can’t increase school funding.  
  - Vote requires majority.  
  - **Discovery Moment:** TU rep realizes CRHA can’t stop displacement (no rent control power). Commuter realizes school overcrowding unresolved (funding boundary persists).  

  **Outcome:** Regional vote likely approves project, but participants see new exclusions (unhoused, future residents) and unresolved local issues.  

  ---

  ### (f) Timeline (120 Min)  
  **0:00-0:15**  
  - Intro: "Today we’re simulating a housing project review. Discuss, don’t debate real politics."  
  - Assign roles randomly. Tables A/B receive respective NA briefs.  

  **0:15-0:20**  
  - Read role briefs (public + private).  

  **ROUND 1: LOCAL GATES (0:20-1:00)**  
  - **0:20-0:35:** DRB meeting (PA presents; NA/TU object; DRB votes on flags).  
  - **0:35-0:50:** ZB meeting (same).  
  - **0:50-1:00:** PC → CC meetings (fast-tracked).  
  - *Facilitators track tokens/flags.*  

  **SYNC POINT (1:00-1:10)**  
  - Tables share outcomes: # flags, tokens left, project status.  

  **ROUND 2: REGIONAL (1:10-1:30)**  
  - **1:10-1:15:** Explain CRHA. Reassign seats (random draw).  
  - **1:15-1:30:** CRHA deliberates/votes. Highlight boundary limits (e.g., "CRHA can’t fix schools").  

  **DEBRIEF (1:30-2:00)**  
  - **1:30-1:40:** Tables share regional outcomes.  
  - **1:40-1:50:** Name concepts:  
    - *"Blockage without a blocker"* (gate structure).  
    - *"Boundary problem"* (who counts?).  
  - **1:50-2:00:** Q&A:  
    - *To hearing regulars: "What felt real? What missed nuances in your experience?"*  
    - *To all: "Did widening the electorate solve exclusion?"*  

  ---

  ### (g) Debrief Script  
  **Key Questions:**  
  - *"Did anyone here want ZERO housing? What small objections added up?"* → Illustrates **partial vetoes**.  
  - *"When we moved to the regional body, who was STILL excluded? What issues couldn’t they fix?"* → Highlights **boundary arbitrariness**.  
  - *"Did the NA’s financial stake (Table A) change outcomes?"* → Tests **friend’s claim**.  

  **For Hearing Regulars:**  
  *"You’ve been in real hearings. Did this capture how small objections can snowball? How would you improve this simulation?"*  

  ---

  ### (h) Predictable Risks & Handling  
  1. **Risk:** NA players feel villainized.  
     *Handling:* Intro emphasizes "no bad faith." Debrief: "Your concerns were valid. We’re critiquing systems, not people."  

  2. **Risk:** PA becomes caricature (e.g., greedy developer).  
     *Handling:* PA brief includes: "You support housing. Profit lets you build more." Facilitators remind: "PA provides housing within constraints."  

  3. **Risk:** Token haggling overshadows point.  
     *Handling:* Tokens are non-negotiable. Facilitators: "Costs are fixed. Focus on your role’s priorities."  

  4. **Risk:** Facilitator tips results.  
     *Handling:* Scripted prompts (e.g., "What’s your objection based on your brief?"). No opinions.  

  ---

  ### (i) Limitations & Verbal Supplements  
  **What the Activity Cannot Reproduce:**  
  - **Time compression:** 30 years of neighborhood change condensed. *Verbalize:* "Real objections carry emotional weight from lived history we can’t simulate."  
  - **Scoring function:** Tokens define "public good." *Verbalize:* "In reality, ‘whose welfare counts’ is political. Our tokens favored tangible trade-offs."  
  - **Structural power imbalances:** Real NAs have more resources than TUs. *Verbalize:* "In life, procedural access isn’t equal. We simplified for focus."  

  **Contested Claims in Land-Use Politics:**  
  - **Your claim (procedural blockage):** Supported by studies on "death by a thousand cuts" (e.g., NYC ULURP delays). *Contested by:* Advocates who blame NIMBY greed.  
  - **Friend’s claim (asset protection):** Supported by "homevoter" theory. *Contested by:* Ethnographies showing non-financial motives (e.g., attachment to place).  
  - **Boundary problem:** Widely accepted; solutions (e.g., regional government) are hotly debated.  

  **Normative Assumptions in Design:**  
  - ⚠️ *"Delay is inherently bad"* → Ignores due process benefits.  
  - ⚠️ *"Regional view > local view"* → Assumes growth is universally desirable.  
  - *Flag in debrief:* "Our game assumed delay harms the public good. Is that always true?"  

  ---

  ### Facilitator Closing Script  
  *"Today showed how complex housing decisions are. No villain, no easy fix. Procedural gates can block projects without anyone wanting zero housing. And every boundary we draw—local or regional—excludes someone. Take this lens to your next hearing: ‘Who is not here? Whose costs are invisible?’"*  

  This design tests both claims experientially, avoids attribution, and centers discovery. Run it twice to refine timing!
