   The project must pass through 4 gates (in order):

     1. Design Review Board (DRB): Can raise a flag about design, shadow, compatibility. If a flag is raised, the project must be revised (which costs the applicant 5 tokens) and then re-reviewed at the next meeting (which takes 2 months). The DRB can also approve with conditions (no cost) or reject (project stops). The DRB has 3 options: Approve, Approve with Conditions (which might require minor revisions, no token cost but the applicant must accept the conditions), or Require Major Revisions (flag raised, 5 tokens and 2 months). The DRB can also reject, but rejection is rare and would kill the project.

     2. Zoning Adjustment Board (ZAB): Reviews the height variance and parking waiver. Can approve, approve with conditions (e.g., reduce height by one story, or provide additional parking), or deny. If denied, the project stops. If conditions are imposed that the applicant cannot meet, it stops. If a flag is raised (meaning they require a revision that the applicant must consider), it costs 5 tokens and 2 months.

     3. Planning Commission (PC): Reviews for consistency with the general plan, environmental review (including drainage and school capacity). They can recommend approval, approval with conditions, or denial to the city council. If they recommend conditions that require a revision (flag raised), 5 tokens and 2 months. If they deny, the project goes to council with a negative recommendation.

     4. City Council (CC): Votes to approve or deny the project. They can also send it back to a previous board (costing 5 tokens and 2 months) or approve with conditions. But note: the council vote is final.

