     - The Applicant (PA): presents the project and addresses concerns.
     - The NAR and TUR: can speak and raise concerns.

   The board then deliberates and makes a decision. They can also ask for revisions (which raises a flag and triggers costs and delay) or impose conditions (which might be acceptable without delay).

   Conditions: For example, the DRB might require a design change to reduce shadow by setting back the top floor. The ZAB might require the applicant to provide 10 additional parking spaces (which might be impossible) or pay into a parking fund. The PC might require a drainage study and mitigation, or a payment to the school district.

   Conditions that require significant redesign (like reducing the height) would be considered a revision and cost 5 tokens and 2 months. Conditions that are minor (like using a different material) might be accepted without delay.

   The applicant can choose to accept a condition or not. If they accept without revision (i.e., the change is minor and doesn't require going back to the drawing board), then no flag and no cost. If the condition requires a major revision, then the flag is raised and the cost and delay occur.

