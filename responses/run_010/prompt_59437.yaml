          - East: A small rooming house (10 units, low-income tenants, at risk of displacement due to rising rents)
          - South: Elm Street (a commercial corridor with plans for future upzoning)
          - West: A community garden (run by a nonprofit, used by 50 families, which requires at least 6 hours of direct sun daily)

   Issues:
     - Shadow: The 4th story will cast a shadow on the community garden in the morning, reducing sun by 1 hour for 4 months of the year.
     - Parking Spillover: With only 45 spaces for 45 units, residents will likely have guests and some may own more than one car, leading to street parking in the adjacent neighborhood (which has no permit system). Residents of the single-family area (with driveways) fear their street parking will be taken.
     - Drainage: The site is on a slope and there are concerns about runoff during construction and after, which could affect the community garden and the single-family home's yard.
     - School Capacity: The local elementary school is at 95% capacity. Adding 45 units might bring 10-15 new children, pushing the school over capacity.
     - Construction: 18-month period with noise, dust, and traffic disruptions.
     - Precedent: If this project gets a height variance and parking waiver, it will set a precedent for the entire Elm Street corridor, which the city is considering for upzoning to R-4 (allowing 4 stories by right). This could accelerate development and change the neighborhood character.
     - Displacement: The rooming house next door is on a month-to-month lease. The landlord, seeing the new development, might raise rents or sell to a developer, displacing current tenants.
     - Affordability Gap: The affordable units are set at 80% AMI, but the typical renter in the neighborhood earns 50% AMI. So the affordable units are not serving the most vulnerable.

   (b) Roles and Briefs

   There will be 7 roles per table (so two of each role total, one at each table). Each role has a public brief and a private line (not to be read aloud).

