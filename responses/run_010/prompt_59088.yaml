  ### **Idealizations in the Activity**  
  List these during the final debrief. For each, state how the activity handles it:  

  | Idealization                 | Activity Handling                                                                                                |  
  |------------------------------|------------------------------------------------------------------------------------------------------------------|  
  | **Simultaneous Acceptance**  | **Enforced:** Mandatory acceptance rule ("must accept any bet at your prices").                                   |  
  | **Unbounded Stakes**         | **Exposed:** TA chooses stakes (small for Dutch books, large for coherent bets). Highlight: "Real bookies exploit this if you allow high stakes." |  
  | **Fixed Prices**             | **Enforced:** Prices locked in via simultaneous submission; no revision.                                         |  
  | **No Learning from Bets**    | **Ignored:** Bets don’t change beliefs (e.g., no updating from being booked). Mention this as a limitation.      |  
  | **Bets Don’t Change Events** | **Enforced:** Outcomes (coin/die) resolved after bets; no feedback loop.                                         |  
  | **No Bid-Ask Spread**        | **Enforced:** Single price for buying/selling. Explain: "Real markets use spreads, simplifying here."            |  

