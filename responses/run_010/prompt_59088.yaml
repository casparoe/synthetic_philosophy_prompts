  ### **Predictable Problems & Recovery**  
  1. **Problem:** No student has incoherent prices.  
     - **Recovery:** Use pre-planted slips (e.g., $P(A)=0.8$, $P(B)=0.9$, $P(C)=0.8$) or ask a student to role-play incoherence.  
  2. **Problem:** Sore losers complain about token losses.  
     - **Recovery:** Reiterate raffle rules ("Negative tokens = no tickets, no grade penalty"). If needed, offer a trivia question to earn tokens back.  
  3. **Problem:** No cyclic rankings for money pump.  
     - **Recovery:** Use a volunteer (e.g., "Imagine you prefer red > green > yellow > red"). Or run with a TA-planted ranking.  
  4. **Problem:** Time runs out during updating round.  
     - **Recovery:** Skip to debrief. Use a verbal example: "Suppose after evidence, you set P(D)=0.5 instead of 0.67—here’s how a bookie would exploit that..."  
  5. **Problem:** Students infer the goal early.  
     - **Recovery:** Lean into it: "If you see what’s happening, great! But play along—we’ll discuss after."  

