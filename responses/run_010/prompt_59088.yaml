  ### **Frank Note: What the Game Cannot Reproduce**  
  The activity **cannot reproduce the converse of the Dutch book theorem** (i.e., that coherence guarantees no Dutch book). This is because:  
  - In the game, coherent students *can* lose tokens from bad luck (e.g., taking a high-stake fair bet and losing). The theorem only guarantees that their losses aren’t *predictable and guaranteed* like an incoherent agent’s.  
  - **How to address:** Verbally explain during debrief: "Coherence doesn’t make you win—it prevents a clever bookie from rigging the game against you. Losses from bad luck are still possible, but they’re not a ‘sure thing’ exploit." Use the whiteboard to contrast Student 7’s guaranteed loss with Student 11’s probabilistic loss.  

