  ### **Debrief Mapping: Activity Steps to Dutch Book Argument**  
  After the activity, use the whiteboard to map moments to the argument:  

  | Dutch Book Argument Step          | Activity Moment                                                                                                  |  
  |-----------------------------------|------------------------------------------------------------------------------------------------------------------|  
  | **1. Betting Interpretation**     | Intro: "We use prices to measure belief via bets."                                                               |  
  | **2. Incoherence Definition**     | Incoherent pricing (e.g., Student 7 sets $P(A)=0.8$, $P(B)=0.9$, $P(C)=0.8$).                                  |  
  | **3. Guaranteed Loss Construction** | TA offers Dutch book: Sell $A$ @ $0.8$ and $B$ @ $0.9$ → Student pays $1.7$, gets $1$ back if $A$ or $B$ occurs → guaranteed loss of $0.7$. |  
  | **4. Coherence Prevents Guaranteed Loss** | Coherent student (e.g., $P(A)=0.5$, $P(B)=0.5$, $P(C)=1.0$) takes high-stake bet → loses $5$ if tails, but could have won. Contrast with Student 7’s fixed loss. |  
  | **5. Generalization to Probability Axioms** | Debrief: "Incoherence violates probability laws (e.g., $P(C)=1$ for tautologies)."                               |  
  | **6. Updating Rule**              | (If run) Non-conditioning student (e.g., $P_1(D)=0.5$, evidence=odd, $P_2(D)=0.5$ instead of $0.67$) → TA books with bets across rounds. |  
  | **7. Money Pump for Comparatives**| Cyclic student trades $A→B→C→A$, paying $1$ token per trade → guaranteed loss.                                 |  

