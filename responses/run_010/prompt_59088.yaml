  Below is a complete design for your 80-minute seminar session on credences and Dutch books. The activity is structured to meet your core goals: students discover guaranteed losses from incoherent credences through hands-on betting, without being told about Dutch books upfront; the design explicitly highlights idealizations for your professor; and it includes a comparative belief variant and an optional updating round. The token system uses a raffle to avoid coercion (addressing sore losers) while making stakes matter.

  ---

  ### **Rules and Payoff Scheme**
  **Token System:**  
  - Each student starts with 10 poker tokens.  
  - Tokens convert to raffle tickets for a small prize (e.g., a $5 gift card or candy bar). At the end, students exchange tokens for tickets (1 token = 1 ticket). Negative tokens = 0 tickets (no penalty beyond losing raffle chances). This avoids coercion: sore losers can ignore the raffle, but stakes feel meaningful due to the prize.  
  - Bets use tokens as currency. All transactions are settled after outcomes are resolved.  

  **Betting Rules:**  
  - **Pricing:** Students set prices (credences) for $1$ token bets on propositions. A price $p$ for event $E$ means:  
    - They will *buy* a bet paying $1$ token if $E$ occurs (cost: $p$ tokens).  
    - They will *sell* a bet paying $1$ token if $E$ occurs (income: $p$ tokens; they pay $1$ if $E$ occurs).  
  - **Mandatory Acceptance:** By setting prices, students commit to accepting any bet offered by the TA (you) at their stated prices and stakes. This prevents refusal and mirrors the idealization of fixed prices/no revision. State this rule upfront: "You must accept any bet I offer at your prices—this is like a real bookie holding you to your stated odds."  
  - **Stakes:** The TA chooses stakes (positive integers). For incoherent students, stakes are small to guarantee a loss. For coherent students, stakes are large to risk big losses.  

  **Propositions:**  
  - **Numerical Round (Coin Flip):**  
    - $A$: Coin lands heads.  
    - $B$: Coin lands tails.  
    - $C$: Coin lands heads or tails (tautology; always occurs).  
    - *Outcome resolution:* Flip a coin publicly at the end.  
  - **Comparative Round (Money Pump):**  
    - Options: $A$ (red apple), $B$ (green apple), $C$ (yellow apple). Students rank them. Cyclic rankings (e.g., $A>B$, $B>C$, $C>A$) enable a money pump.  
  - **Updating Round (Optional; Die Roll):**  
    - Events: $A$ (die=1 or 2), $B$ (die=3 or 4), $C$ (die=5 or 6), $D$ (die=1, 2, or 3).  
    - Evidence: "Die is odd" (revealed mid-round).  
    - *Outcome resolution:* Roll a 6-sided die publicly at the end.  

  **Win/Loss Conditions:**  
  - **Incoherent Student:** Loss is guaranteed and bounded (known in advance from their prices). E.g., if $P(A) + P(B) = 1.7$, loss is $0.7$ tokens regardless of outcome.  
  - **Coherent Student:** Takes fair bets (by their credences) but risks large losses from bad luck. E.g., buys a $10$-stake bet on $A$ at $P(A)=0.5$; if tails, loses $5$ tokens (more than the incoherent loss).  
  - **Goal:** Show incoherent loss is guaranteed, while coherent loss is probabilistic and potentially larger.  

  **Materials:**  
  - **Index cards** for pricing/ranking slips (print templates below).  
  - **Poker tokens** (starting balance: 10 per student).  
  - **Coin and die** for resolution.  
  - **Whiteboard** for tracking balances/debrief.  

  ---

  ### **Minute-by-Minute Timeline**  
  **Total: 80 minutes**  

  | Time  | Activity                                                                                                | Details                                                                                                                                                                                                                               |  
  |-------|---------------------------------------------------------------------------------------------------------|---------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------|  
  | 0-5   | **Intro & Token Rules**                                                                                 | Explain: "Today we’ll explore how beliefs relate to betting. Use tokens for raffle tickets (small prize). Start with 10 tokens. Bets are binding—set prices carefully. We’ll bet on simple events." No mention of Dutch books or coherence. |  
  | 5-15  | **Round 1: Numerical Beliefs (Pricing)**                                                               | Hand out **Slip 1 (Numerical)**. Students set prices for $A$, $B$, $C$ (coin flip). Emphasize: "Prices must be set simultaneously—no revising after submission." Collect slips.                                                             |  
  | 15-25 | **Round 1: Betting & Resolution**                                                                      | TA acts as bookie: Scan slips. For **incoherent students** (e.g., $P(A)+P(B) \neq 1$ or $P(C) \neq 1$), offer Dutch book bets (small stakes). For **one coherent student**, offer a single high-stake bet (e.g., stake 10 on $A$). Record all bets. Flip coin publicly. Resolve bets. Adjust tokens. |  
  | 25-30 | **Display Results**                                                                                     | Write token balances on whiteboard (e.g., "Student 3: +2 tokens; Student 7: -0.7 tokens; Student 11: -5 tokens"). Do not explain *why* yet.                                                                                                |  
  | 30-40 | **Debrief Part 1: Numerical Round**                                                                  | Ask: "Why did some lose tokens no matter the coin flip? Why did others lose more?" Reveal Dutch books: "The -0.7 loss was guaranteed from Student 7’s prices. Student 11’s loss was bad luck—they could have won." Link to credences (see Debrief Mapping). |  
  | 40-50 | **Round 2: Comparative Beliefs (Money Pump)**                                                          | Hand out **Slip 2 (Comparative)**. Students rank $A$, $B$, $C$ (apples). Collect slips. Choose **one student with a cycle** (e.g., $A>B$, $B>C$, $C>A$). If none, use a prepped volunteer. Run money pump demo with them (see below). |  
  | 50-60 | **Round 3: Updating (Optional if time)**                                                               | Hand out **Slip 3 (Updating - Part 1)**. Students set prices for $A$, $B$, $C$, $D$ (die roll). Collect slips. Reveal evidence: "Die is odd." Hand out **Slip 4 (Updating - Part 2)** for repricing. Collect. Roll die. Book non-conditioners (e.g., if $P_2(D) \neq P_1(D \mid \text{odd})$). |  
  | 60-70 | **Debrief Part 2: Comparative & Updating Rounds**                                                    | Discuss money pump ("cyclic rankings let us 'pump' tokens"). For updating, ask: "Why did evidence change prices? Could bets across rounds guarantee losses?"                                                                          |  
  | 70-80 | **Final Debrief: Dutch Books & Idealizations**                                                        | Reveal the theorem. Map activity steps to Dutch book argument (see Debrief Mapping). List idealizations explicitly (see below). Conclude: "Coherence prevents guaranteed losses, not bad luck."                                         |  

