answer: |-
  Here’s a decision tree to clarify the criteria for moral wrongs in entrenched conventions. Answer each vignette based on your intuitive judgment, not theoretical labels.

  ---

  ### **Decision Tree: Moral Force of Conventions**

  #### **Question 1: The Left-Lane Driver**  
  On an empty highway, you drive slowly in the left "passing lane" (against local custom). No one sees you. Is this:  
  (A) Permissible, since no one is inconvenienced.  
  (B) Wrong, even if harmless.  

  #### **Question 2: The Library Book**  
  You borrow a rare book under a "return in 3 days" rule. Returning it on day 4 causes no harm (no one needed it). Is this:  
  (A) Fine—no harm, no foul.  
  (B) Wrong—you broke a promise to the system.  

  #### **Question 3: The Saved Seat**  
  At a crowded concert, a stranger saves a seat with a coat, then leaves for 20 minutes. You take it. They return upset. Is this:  
  (A) Fair game—they abandoned it.  
  (B) Wrong—they relied on the custom.  

  #### **Question 4: The Tax Evader**  
  Someone pays no taxes but uses public roads and parks. They argue: "I never agreed to pay." Is this:  
  (A) Justified—no consent, no obligation.  
  (B) Wrong—they benefit from the system.  

  #### **Question 5: The Silent Auction**  
  You win a bid at a charity auction but refuse to pay, claiming "I never formally promised." No one else loses out. Is this:  
  (A) Acceptable—no explicit contract.  
  (B) Wrong—you exploited others’ trust.  

  #### **Question 6: The Desert Island**  
  You’re shipwrecked alone on an island with a "no littering" sign. Tossing trash harms nothing. Is this:  
  (A) Harmless—no one to disrespect.  
  (B) Wrong—you defied a standing norm.  

  #### **Question 7: The Foreign Diplomat**  
  A diplomat from a non-tipping culture dines in a tipping-only city. They know the custom but leave $0. Is this:  
  (A) Permissible—they didn’t invite reliance.  
  (B) Wrong—they benefited from local labor.  

  #### **Question 8: The Park Bench Hogger**  
  You occupy a public "30-min max" bench all day. Others wait, but you say: "I got here first." Is this:  
  (A) Legitimate—no formal rule.  
  (B) Wrong—you ignored fair access.  

  ---

  ### **Leaf Positions & Commitments**  
  *(Based on your answers)*  

  1. **Strict Contractualism**  
     - **Awkward Commitment**: Breaking *any* harmless convention (e.g., desert island littering) is permissible.  
     - **Path**: Mostly A’s, especially in Q1, Q2, Q6.  
     - **Breaching convention is never morally wrong**; binds **no one** without explicit consent.  

  2. **Reliance Conservative**  
     - **Awkward Commitment**: The diplomat (Q7) may skip tipping—they didn’t invite reliance.  
     - **Path**: B in Q3 (seat-saving), A in Q7 (diplomat).  
     - **Wrong only if reliance invited**; binds **participants only**.  

  3. **Fair-Play Universalist**  
     - **Awkward Commitment**: The diplomat (Q7) must tip—they accepted benefits.  
     - **Path**: B in Q4 (taxes), B in Q7 (diplomat).  
     - **Wrong if benefiting from the scheme**; binds **all beneficiaries**, even passers-through.  

  4. **Expressive Conventionalist**  
     - **Awkward Commitment**: Littering on the desert island (Q6) is wrong—disrespecting "order" itself.  
     - **Path**: B in Q1 (lane), B in Q6 (island).  
     - **Wrong as expressive disrespect**; binds **anyone aware of the norm**, regardless of participation.  

  5. **Coordination Necessitarian**  
     - **Awkward Commitment**: Taking the saved seat (Q3) is wrong *only* if chaos would follow if everyone did it.  
     - **Path**: B in Q1 (lane), A in Q3 (seat) if no systemic harm.  
     - **Wrong only if coordination fails**; binds **participants when compliance is critical**.  

  ---

  ### **Unreachable/Unoccupied Combinations**  
  - **"Benefit acceptance without obligation"** (e.g., B in Q4 but A in Q7): Incoherent—if benefits create duty, the diplomat’s passage through the system implicates them.  
  - **"Reliance without participation"** (e.g., B in Q3 but A in Q7): Unattractive—why does saving a seat invite reliance more than a server’s labor?  
  - **Unexplored**: "Symbolic respect without benefit or reliance"—e.g., obeying desert island signs purely as duty to absent rule-makers.  

  ### **Failed Separation**  
  *Reliance Conservative* and *Fair-Play Universalist* may overlap if "benefiting" implies tacitly inviting reliance (e.g., dining out). The tree distinguishes them via Q7 (diplomat’s knowledge vs. benefit).  

  ---

  ### **Diagnosis**  
  - **You (OP)**: Likely **Fair-Play Universalist** or **Expressive Conventionalist**. You see moral wrongs in all three cases (tipping, jaywalking, chair) because benefit-acceptance or symbolic disrespect binds even fleeting visitors.  
  - **Your Friend**: **Reliance Conservative**. Only the chair case is moral because the shoveler *invited* reliance (via the marker), whereas the tipless diner and jaywalker created no specific expectations.  
  - **Turning Point**: **Question 3 (Saved Seat)**. If taking the seat feels wrong, you ground obligations in *invited reliance* (friend’s view). If it depends on systemic fairness (Q4/Q7) or expressive duty (Q6), you lean toward OP’s view.  

  Your core dispute centers on **whether conventions bind through *benefit* or *invited reliance***—a divide between fairness and relational obligation.
