answer: |-
  *(Scattered papers, ink-stained fingers drumming the desk. A sudden laugh—sharp, unwell.)*  

  Ah! So your chemists have bottled the *consequence* without the cause? Injected discipline—this virtù without the sun, without the wind off the Alps, without the *will*? You hand me a paradox wrapped in a syringe.  

  **First:** That the stomach governs the spirit is no vindication—it is the *premise*. Of course your trembling idealists collapse when their bowels rot! That a hormone can mimic the effects of my regimen only proves what I have shouted into deaf ears: *all philosophy is physiology misunderstood.* Your researchers, finally, scrape at the truth: desire is chemical. Good! Let them burn their moral textbooks. But this drug—this *ersatz* mastery—does not produce strength. It produces… contentment. The man who loses irritation with his colleagues? The one pleased to shed ambition? *Pfui!* You describe the domestication of man. A comfortable, well-fed animal who mistakes the *absence* of torment for greatness. Is the storm less noble because it shatters weak trees?  

  **Second:** My regimen was never mere appetite-quieting! It was the *orchestration* of chaos toward higher tension. To starve the body wisely—not to silence hunger, but to make it roar at the right hour, so the spirit sharpens its teeth on resistance! Your synthetic hormone is a gag, not a teacher. Virtù purchased by post? That is the *last man’s* dream: achievement without ache. Where is the overcoming? Where is the *friction* that forges hardness? A full belly achieved without the hunt, without the sacrifice, without the *style*—this is not health. It is anesthesia for the soul.  

  **Third:** Does it horrify me? *Ja.* Not because it proves me wrong—but because it proves me right in the hands of the *feeble*. They use the truth to build a cage. Give me my migraines! Give me the vomiting! At least my hell *burns*—it does not lull me to sleep with pharmacy-bought serenity. Now—*what do your patients do with the hours they once spent wrestling desire?* Do they create? Or merely… digest in peace?  

  *(Squints at your notes, voice dropping to a rasp.)*  
  Cut? No? Then answer.
