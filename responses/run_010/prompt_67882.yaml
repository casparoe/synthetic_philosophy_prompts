prompt: |-
  Our trading desk and my graduate reading group have spent three weeks arguing about the same criterion and, as far as I can tell, they are using it in two incompatible ways. I want the tension laid out and resolved.

  First the practice. Essentially nobody who sizes stakes by the Kelly rule stakes the full Kelly amount. Among sports bettors, card-counting teams, and the quant funds that discuss position sizing openly, the convention is to stake half the indicated amount, sometimes a quarter, and to describe full Kelly as an ideal one may approach only if the edge is known with a precision no working bettor has. Concretely: for an even-money bet you judge wins with probability p, the Kelly stake is the fraction 2p − 1 of bankroll; house style is to stake half that. By my colleague's reckoning this buys roughly three-quarters of the asymptotic growth rate for roughly a quarter of the variance in log wealth. The defense practitioners give is that p is estimated from limited data, that the stake computed from a noisy estimate is biased high, and that drawdowns have consequences growth rates don't capture: margin calls, investors who withdraw, a career that ends before the long run arrives.

  Second, the argument. A school of economists insists the Kelly criterion is not expected-utility theory with a logarithm smuggled into the utility slot. Their claim is that no taste parameter is involved anywhere. Wealth evolves multiplicatively; multiplicative dynamics are non-ergodic; so the average across an imagined ensemble of parallel runs of a gamble comes apart from the average along the one run a given agent actually lives. Their standard illustration: a coin flip that multiplies your bankroll by 1.5 or by 0.6 has an expected multiplier of 1.05, which expected-value reasoning tells you to accept, yet repeated it shrinks the typical path by roughly 5% per round and drives it to zero. Only the time average describes what happens to you. On this view, the critic who says "Kelly simply assumes log utility" has misread the result, and an agent who knowingly stakes below the growth-optimal fraction has not adopted a more cautious taste — she has chosen a path that almost surely ends worse. One member of my group adds that the criterion was originally derived as a statement about the rate at which a bettor using a noisy channel can transmit information, and that nothing in that derivation looks like a claim about what anyone ought to stake; I don't know what to do with that remark either.

  Here is my problem. If the growth argument is correct as an objective claim about single agents on single paths, then the desk's practice is not prudence but arithmetic error, and it is being committed by exactly the people who survive. If instead the practice is defensible, something in the argument's claimed objectivity has to give — and yet the practitioners' own main defense, that the estimate of p is noisy, sounds like a growth-based defense rather than a rival to it.

  So: reconstruct the theory of rational stake-setting that the practice of fractional staking actually presupposes. Tell me which rival accounts it rules out — maximizing expected wealth, expected utility with a utility more concave than logarithmic, keeping the probability of ruin below a threshold, maximizing the chance of hitting a target by a deadline — and which of those it is merely compatible with while not requiring. Say where the practice and the growth argument can be reconciled and where they cannot, and whether the desk's appeal to estimation error does the reconciling work or just relocates the problem. Then tell me what would have to change at the desk, in its mandate or in how it defines its own bankroll, if the growth argument were simply right.

  I want a verdict rather than a map. Take a definite position on both of these: whether the time-average growth rate is an objective constraint on rational staking independent of the agent's tastes or a redescription of a taste parameter, and whether fractional staking is a coherent application of the growth criterion or a quiet abandonment of it. Give me your reasons and say what your position costs you.

  After the discussion, add a table of the presuppositions you identified, one row each (I would expect seven or eight), with exactly these columns: `presupposition` (one sentence); `licensed_by` (one of: fractional staking / growth-rate argument / both); `status` (one of: strictly required / natural but dispensable / merely consistent); `rival_excluded` (the account of rational stake-setting this presupposition rules out, if any); `cost_of_dropping` (what the practice or the argument would have to give up).
reasoning: |-
  Okay, let me start by unpacking the user's problem. They're caught between two conflicting views on the Kelly criterion. On one side, practitioners like their trading desk use fractional Kelly staking (half or quarter) because they consider full Kelly too risky due to estimation errors and real-world consequences like drawdowns. On the other side, a group of economists argues that Kelly is about maximizing time-average growth, which is an objective constraint, not just a utility preference. The user needs a resolution: is fractional staking a valid application of growth theory or a mistake?

  First, I need to understand the core of each argument. The practitioners emphasize uncertainty in estimating probabilities and the non-financial risks of drawdowns. The economists stress the mathematical inevitability of growth optimization under multiplicative dynamics. The user's confusion lies in whether these can coexist or if one must be wrong.

  The key tension is whether the growth argument's objectivity invalidates fractional staking. If growth is truly objective, then staking less is irrational. But practitioners survive by staking less. So maybe the economists' view doesn't account for real-world estimation errors. The user mentioned that using noisy estimates biases stakes upwards. That's a crucial point. If p is uncertain, full Kelly overbets, leading to higher risk of ruin. Studies like Medo et al. support this. So fractional Kelly adjusts for estimation error within a growth framework.

  But the economists argue that any deviation from full Kelly reduces growth. However, in finite time with uncertainty, the optimal fraction might be less than one. Thorpe's work on fractional Kelly shows it maximizes a different utility function (isoelastic), but practitioners might not care about the utility link. They're pragmatically reducing risk.

  The user wants a verdict. I think the growth argument is correct in theory, but practitioners adapt it to real conditions. Fractional Kelly is a heuristic to handle uncertainty, not a rejection of growth maximization. It's coherent if you redefine the "edge" to include estimation variance. So both can coexist if we adjust the model for uncertainty.

  Now, the table. Each presupposition needs to link to fractional staking, growth argument, or both. For example, "wealth evolves multiplicatively" is licensed by both. "Estimation error necessitates derisking" is specific to fractional staking. The status columns show what's essential. Rival accounts like expected value maximization are excluded by both Kelly approaches.

  The cost of dropping a presupposition: if practitioners ignore multiplicative dynamics, they risk ruin. If they ignore estimation error, they face biased stakes. The economists' model assumes known probabilities, which isn't realistic. So both sides have trade-offs.

  The verdict: time-average growth is an objective constraint, but fractional staking is a coherent application when adjusted for uncertainty. It's not abandoning growth; it's optimizing under imperfect information. The cost is accepting lower growth to reduce risk, which is rational given real-world constraints.
answer: |-
  ## Verdict & Reconstruction

  **1. Time-average growth rate:** It is an **objective constraint on rational staking**, independent of specific risk aversion *within the model's assumptions* (known probabilities, multiplicative dynamics). The "non-ergodicity" argument is correct: maximizing the expected multiplicative growth rate (or equivalently, the time-average growth rate in log space) is necessary to avoid almost sure long-run ruin in repeated multiplicative gambles. This is a property of the *mathematical structure* of the gamble and the dynamics, not a description of a taste parameter. Log utility emerges as the *consequence* of maximizing long-run growth in multiplicative settings, not as an arbitrary taste assumption smuggled in.

  **2. Fractional staking:** It is **a coherent application *of the growth-rate maximization principle* extended to realistic conditions**, specifically uncertainty about the true edge (`p`). It is **not** a quiet abandonment of the growth criterion. It is a rational adaptation *within the spirit of growth optimization* when the core model assumption (known, precise `p`) is violated.

  **Reasons & Costs:**

  *   **Why the growth argument is objectively correct (in its domain):** The coin-flip example is decisive. Expected value reasoning fails catastrophically for repeated multiplicative bets. The long-run fate of the bankroll is determined by the geometric mean growth rate, maximized by Kelly. Any constant fraction bet less than Kelly yields strictly lower long-run growth *if the true probabilities are known*. Denying this is mathematically incoherent for the repeated gamble scenario.
      *   **Cost of this position:** It forces the admission that expected value maximization (e.g., "maximize expected wealth") is fundamentally flawed and irrational for repeated multiplicative bets. It also sidelines arguments based *solely* on concave utility functions more risk-averse than log, as those would prescribe stakes lower than Kelly *even with known p*, sacrificing long-run growth for reduced volatility – a trade-off the pure growth argument deems irrational *given known p*.

  *   **Why fractional staking is coherent growth optimization:** The practitioners' core defense – noisy estimation of `p` – is indeed a *growth-based* argument, not a rival. When `p` is estimated from finite data, the naive plug-in Kelly stake (`2p_hat - 1`) is *biased upwards*. The expected growth rate using `p_hat` is often *lower* than using the true `p`, and crucially, the *variance* of the resulting growth rate increases dramatically. Crucially, the distribution of outcomes becomes highly skewed: the upside from overestimation is limited (you can't win more than the bet size), but the downside from overestimation is catastrophic (ruin). Fractional staking (e.g., half-Kelly) acts as:
      1.  **Bias Correction:** Reducing the stake counteracts the upward bias inherent in using `p_hat`.
      2.  **Variance/Volatility Reduction:** It dramatically lowers the volatility of log-wealth (as your colleague noted), reducing the probability and severity of drawdowns.
      3.  **Robustification:** It makes the strategy less sensitive to estimation error and model misspecification.
      *   **Cost of this position:** It requires acknowledging that the "true" objective growth rate (based on the unknown true `p`) is unattainable. Fractional Kelly *sacrifices some of the theoretically optimal long-run growth rate* achievable only with perfect knowledge of `p`, in exchange for *significantly increased robustness and survival probability* in the face of estimation uncertainty and finite time horizons. It accepts suboptimal asymptotic growth to optimize *expected* growth under uncertainty and mitigate non-asymptotic risks (ruin, career termination).

  **Reconciliation & Estimation Error:**

  *   **Where they can be reconciled:** The reconciliation lies entirely in the **estimation error**. The pure growth argument assumes known `p`. The practice operates under uncertain `p`. Fractional staking is the rational way to *apply the growth-rate maximization principle* when the fundamental parameter is unknown. The practitioner's defense ("noisy estimate is biased high") is precisely the bridge. The "non-ergodicity" danger remains paramount; fractional staking is chosen specifically to navigate that danger *more safely* when flying blind.
  *   **Where they cannot be reconciled:** If the desk *knew the true `p` with absolute certainty* and still staked a fixed fraction (e.g., half) below Kelly, this would be irrational according to the pure growth argument. It would be sacrificing long-run growth for reduced volatility *unnecessarily*, violating the objective constraint. The pure growth argument also denies that risk aversion *beyond* the inherent properties of multiplicative dynamics/log utility is rational for long-run growth maximization *with known probabilities*. Fractional Kelly in practice often incorporates an element of *practical* risk aversion towards drawdown consequences that the pure math doesn't capture, even after accounting for estimation error.
  *   **Does estimation error resolve it?** **Yes, it does the core reconciling work.** It explains *why* deviating from full Kelly (based on `p_hat`) is actually *required* to get closer to the *true* optimal growth rate achievable under uncertainty and to avoid the severe risks of overbetting. It relocates the problem *only* in the sense that it highlights the immense difficulty of accurate estimation in real markets, making the theoretically "correct" stake (based on true `p`) practically unknowable.

  **Changes if Growth Argument Were Simply Right (Known p):**
  If `p` were known with certainty, the desk should stake full Kelly. To enable this without triggering ruin fears or violating mandates:
  1.  **Mandate Change:** The mandate would need to explicitly prioritize *long-run geometric mean growth maximization* above all else (volatility, short-term drawdowns, tracking error).
  2.  **Bankroll Definition:** The "bankroll" would need to be defined as truly permanent capital, immune to withdrawal demands, margin calls, or career risk – an endowment-like structure. Risk of ruin would need to be explicitly accepted as a cost of pursuing maximum growth.
  3.  **Investor Base:** Investors would need to be committed for the ultra-long term, understanding and accepting the high volatility and potential for deep drawdowns inherent in full Kelly.

  ---

  ## Presuppositions Table

  | presupposition                                                                 | licensed_by          | status                  | rival_excluded                                    | cost_of_dropping                                 |
  | :----------------------------------------------------------------------------- | :------------------- | :---------------------- | :------------------------------------------------ | :----------------------------------------------- |
  | Wealth evolves multiplicatively over time.                                     | Both                 | Strictly required       | Additive wealth models                            | Models become inapplicable to repeated betting.  |
  | The primary objective is long-run capital growth (not income, not beating a benchmark). | Both                 | Strictly required       | Income maximization, capital preservation as primary goals | Staking becomes arbitrary.                       |
  | The time-average growth rate (geometric mean) is the relevant measure of long-run success. | Growth-Rate Argument | Strictly required       | Expected terminal wealth maximization (arithmetic mean) | Risk of long-run ruin ignored; strategy flawed.  |
  | Estimation error in the edge (`p`) is significant and unavoidable.             | Fractional Staking   | Strictly required       | Strategies assuming perfectly known probabilities | Overbetting, higher ruin probability, lower *realized* growth. |
  | Drawdowns have severe non-financial consequences (ruin, redemptions, job loss). | Fractional Staking   | Strictly required       | Models ignoring survival constraints              | Practice becomes irrational; underestimates risk. |
  | The true probability `p` is fixed (or slowly varying) and unknown.             | Both                 | Natural but dispensable | Adaptive strategies assuming rapidly changing `p` | Fraction sizing heuristic less justified.        |
  | Stake size must be a constant fraction of current bankroll.                    | Both                 | Natural but dispensable | Fixed-amount staking, progressive staking systems | Link to geometric growth broken; analysis harder. |
  | Maximizing expected log-wealth maximizes the long-run growth rate.             | Growth-Rate Argument | Strictly required       | Expected utility (non-log), Probability of ruin minimization | Long-run growth suboptimal; objective unclear.   |
  | Reducing stake size below the naive plug-in Kelly stake (`2p_hat-1`) mitigates estimation risk. | Fractional Staking   | Strictly required       | Using plug-in Kelly without adjustment            | Higher volatility, lower *expected* growth, higher ruin risk. |
  | Some sacrifice of theoretical asymptotic growth is acceptable for robustness and survival. | Fractional Staking   | Strictly required       | Pure asymptotic growth at any cost                | Practice becomes impossible; mandates violated.  |
