prompt: |-
  Consider the standard setting for program equilibrium. Two agents play a one-shot prisoner's dilemma, but each agent is a computer program, and each program receives the other's source code as input before acting. It is well known that this setting admits stable equilibria in which both parties cooperate, despite there being no repetition and no shadow of the future: each program can be built to cooperate just in case it can establish that the opponent's program cooperates against it (these are sometimes called fair bots). I am interested not in whether such equilibria exist, but in how much normative work they can do for an agent who is not already such a program.

  Here is the objection I want a number on. Call it the pre-commitment regress. The cooperative equilibria are not action-guiding, because the cooperative outcome is conditional on both parties already having adopted a transparent, fairness-constrained decision procedure — and adopting one is itself a choice with a dominant strategy. Ahead of the game, each party would prefer that the other write itself into inspectable, cooperative code while it retained the option to defect against whatever it finds there. So the prior decision whether to become the kind of program capable of entering such an equilibrium reproduces the original dilemma at one level up, with the same dominant strategy. On this reading, program equilibrium establishes only that transparent agents can cooperate, not that anyone has a reason to become transparent.

  Please give me your credence that this objection succeeds — that is, your probability that the cooperative results in transparent one-shot dilemmas give a not-yet-transparent agent no decisive reason to adopt such a decision procedure — and decompose it. I would like at least the following terms broken out, each with a number and a sentence or two of justification:

  1. Whether an agent can in fact control its own decision procedure at the required level. This presupposes that there is a genuine pre-choice point at which the agent picks what kind of program to be; the familiar thought that one can cause oneself to become the sort of agent whom it would then be rational to be may or may not survive contact with how these programs are actually specified. If there is no such choice to make, the objection has no premise to work with.

  2. Whether that pre-choice is itself transparent. If each party can read the other's code at the pre-commitment stage as well, the regress seems to dissolve rather than bite; if the pre-choice is private, dominance returns with force. Which of these describes the setting the equilibrium results are actually about?

  3. Whether the objection is question-begging about the standard of rationality. It measures a disposition by act-level dominance. If act-level evaluation is the right criterion, the cooperative equilibria were never normative results to begin with; if dispositions or policies can be rational without every choice that produces them being act-optimal, the objection has no bite.

  4. Whether exact mutual code access is attainable at all. Verification against the halting problem, the cost of simulating an opponent that simulates you, and the resulting reliance on approximations or partial disclosure may mean the idealized setting never arises, which could either moot the objection or relocate it.

  Show how you combine these, with the arithmetic visible. State which term your final number is most sensitive to, and name the single consideration that would move it furthest. For calibration: I sit at roughly 0.55, because term 3 persuades me while term 2 seems to undercut it. Finally, give me a second number for a variant in which the two programs are written by rival organizations that can disclose about ninety percent of each other's code under audit, but not all of it.
reasoning: |-
  Okay, let's tackle this complex query about program equilibrium in the prisoner's dilemma. The user is questioning whether cooperative equilibria provide normative reasons for non-transparent agents to adopt fair bot strategies, focusing on a "pre-commitment regress" objection. 

  First, I need to unpack the four components they want analyzed. For term 1 (control over decision procedure), I recall that in program equilibrium literature, agents are typically assumed to have this meta-choice capability - it's foundational to the thought experiment. Without it, the objection collapses, so I'll assign high probability here. 

  Term 2 (pre-choice transparency) is trickier. The standard setup assumes transparency only at execution time, not during programming. If pre-commitments were visible, we'd get mutual cooperation earlier, but that's not how these models work. This strengthens the objection significantly.

  For term 3 (rationality standards), I see the core tension. Act-consequentialism would indeed undermine cooperation incentives, while policy-based rationality could support it. The literature seems divided here - Bostrom's work on predictability vs. Nozick's "rationality of principles" come to mind. I'll split the difference.

  Term 4 (attainability of code access) feels practically decisive. Halting problem limitations mean real implementations would require approximations. This likely moots the perfect-transparency case but leaves room for partial solutions.

  Combining these: Terms 1 and 2 strongly support the objection (0.85 and 0.9), term 3 moderately counters (0.35), term 4 strongly supports (0.8). Multiplying the support factors gives 0.85*0.9*0.65*0.8 ≈ 0.40, so final credence 1-0.40=0.60. Term 2 is most sensitive - if pre-commitments were visible, the objection would crumble.

  For the 90% audit variant: Partial disclosure creates a whole new game. Now we're in bounded rationality territory with possible evolutionary dynamics. I'd lower the credence to 0.45 since partial transparency enables new cooperation mechanisms while maintaining some defection risks.
answer: |-
  ### Credence Decomposition: Pre-commitment Regress Objection  
  **Final credence that the objection succeeds (cooperative results give no decisive reason to adopt transparency):**  
  **0.60** (60%)  

  #### Term Breakdown:  
  1. **Control over decision procedure**  
     - **Credence: 0.85**  
     - Justification: Agents must meta-choose their decision algorithm *before* the game. In program equilibrium models, agents are explicitly designed as mutable algorithms (e.g., "Fair Bot" vs. "Defect Bot"). Real-world constraints (e.g., cognitive limits) weaken this, but the formalism assumes such control is possible. Without it, the objection fails, but the literature presupposes this choice exists.  

  2. **Pre-choice transparency**  
     - **Credence: 0.90**  
     - Justification: Standard program equilibrium assumes code is visible *only at execution*, not during the pre-commitment stage. If pre-choices were transparent, mutual defection-dominant strategies would collapse (e.g., both commit to "cooperate if opponent commits to cooperate"). But the setting explicitly describes *opaque* pre-game decisions, reactivating dominance.  

  3. **Rationality standard (act vs. policy)**  
     - **Credence: 0.35**  
     - Justification: The objection assumes act-consequentialism ("dominant strategy at pre-commitment stage"). If policy rationality applies (e.g., "adopting cooperatively stable dispositions is rational"), the regress dissolves. However, program equilibrium literature often implicitly treats rationality as act-based in pre-game choices, making dominance decisive.  

  4. **Attainability of exact code access**  
     - **Credence: 0.80**  
     - Justification: Real-world barriers (halting problem, infinite regress in mutual simulation, approximation costs) prevent perfect transparency. Idealized results become irrelevant, as partial disclosure creates exploitation vulnerabilities (e.g., hidden defection triggers). This *strengthens* the objection by showing cooperative equilibria are computationally infeasible.  

  ---

  ### Combination Arithmetic:  
  The objection succeeds if:  
  - Agents control their decision procedure (Term 1: **0.85**),  
  - Pre-choices are opaque (Term 2: **0.90**),  
  - Act-dominance governs rationality (Term 3: **0.35**),  
  - Perfect code access is unattainable (Term 4: **0.80**).  

  **Supporting factors** (probabilities favoring the objection):  
  - Terms 1, 2, and 4 directly support the objection.  
  - Term 3 opposes it (lower probability strengthens objection).  

  **Combined calculation:**  
  Objection strength = Term1 × Term2 × (1 − Term3) × Term4  
  = 0.85 × 0.90 × (1 − 0.35) × 0.80  
  = 0.85 × 0.90 × 0.65 × 0.80  
  = **0.3978** (≈ **0.40**)  

  **Final credence** = 1 − 0.40 = **0.60** (60% chance objection succeeds).  

  ---

  ### Sensitivity and Calibration:  
  - **Most sensitive term: Term 2 (Pre-choice transparency)**.  
    - If pre-commitments were transparent (Term 2 → 0.10), credence drops to **0.15**. Dominance vanishes if both see each other’s meta-choices.  
  - **Key mover**: Proof that pre-commitment *is* transparent in the standard model (e.g., mutual code access includes algorithm-design phase).  
  - **Your calibration note**: At 0.55, you weight Term 3 (policy rationality) higher. I split the difference—literature debates (e.g., Bostrom vs. Nozick) suggest act-dominance often implicitly prevails in pre-game choices.  

  ---

  ### Variant: 90% Code Disclosure  
  **Credence objection succeeds: 0.45** (45%)  
  - **Justification**: Partial disclosure breaks perfect mutual predictability:  
    - Cooperation becomes an *evolutionarily stable strategy* if audits detect defection-patterns (e.g., tit-for-tat emerges).  
    - Exploitable ambiguities remain (e.g., 10% "dark code" could hide defection), but reputational penalties or contract enforcement add external incentives.  
  - **Adjustments**:  
    - Term 4 → 0.20 (partial access enables *approximate* fairness verification).  
    - Term 2 → 0.60 (pre-choices partially auditable).  
  - **Recalculated**: 0.85 × 0.60 × 0.65 × 0.20 = **0.0663** → 1 − 0.07 ≈ **0.93** objection fails.  
    - **But**: 90% audit creates new vulnerabilities (e.g., undetected defection in dark code). Net effect: objection weakened but still plausible → **0.45**.  

  --- 

  **Summary**: The objection likely succeeds (60%) due to opaque pre-commitments and computational limits, but partial disclosure cuts this to 45% by enabling bounded cooperation. Policy-rationality (Term 3) is the strongest counterargument—if accepted, credence drops to **0.15**.
