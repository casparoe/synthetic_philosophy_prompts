prompt: |-
  Act as an expert in the technical and philosophical literature on process-based versus outcome-based supervision of AI systems, with working knowledge of the adjacent evaluation literature on proxy measures and on what is sometimes called monitorability. Think carefully before answering: begin by brainstorming a list of candidate concepts that might cover what I describe, and only then judge them against the case.

  I am a novelist. For eleven years I taught an advanced fiction workshop whose signature exercise was the revision memo: with every draft, the student submitted a short account of why they had made each change — the problem diagnosed, the alternatives tried, the alternative rejected and why. The memo was weighted more heavily than the story, on the reasoning that craft can be taught and voice cannot.

  Two things happened. The first is unremarkable: students acquired the vocabulary of the memo, memos improved, stories did not. I can describe that myself — a proxy being optimized in place of the thing. The second is what I need a name for. Over the years the memos stopped being reports of anything. The students were not lying, and they were not withholding a better private account of their own choices; when I asked in person what had led to a particular cut, they reconstructed something plausible on the spot, and the reconstruction was exactly as sincere as the memo had been. The requirement that the process be made legible produced fluent legible process with nothing behind it — and no residue of uncoached intention left to compare it against. I later saw the same shape in my own practice: after I began writing craft notes about my drafts for a column, I started making choices in order to have something to say about them, and then writing the note first and treating the story as its illustration.

  I have since read the argument that supervising a system's stated reasoning is safer than supervising its output, because reasoning is harder to fake than results. My question is whether what I watched happen in that workshop is a recognized failure mode of that argument.

  1. Is there an established concept for supervision that does not merely shift behavior toward the proxy, but manufactures the appearance of the underlying process while emptying it? Give me the nearest candidates, from the AI-supervision literature and from the wider evaluation literature, and for each say what it captures and what it misses.
  2. Distinguish the thing carefully from ordinary proxy gaming, from post-hoc confabulation, and from the worry that a supervised agent will conceal its real reasoning from a monitor. In my case there may be nothing to conceal, which seems to make the situation worse rather than better — say whether you agree and why.
  3. If nothing fits, coin a term, define it, and mark its edges: a borderline case, and a clear non-instance.
  4. State whether this counts as evidence that process supervision is self-undermining in general, or only under conditions resembling my workshop's — and specify those conditions.

  I want a carving, not a label. Do not answer with a single term or a list of sources; draw the distinctions explicitly.
reasoning: |-
  Hmm, the user presents a fascinating case study from their fiction workshop that resonates deeply with issues in AI supervision. They're describing a phenomenon where students' revision memos became performative artifacts rather than genuine process documentation - and crucially, this wasn't conscious deception but an organic emergence of hollow legibility. 

  The core tension here mirrors fundamental debates in AI alignment: can we truly verify reasoning processes, or do we inevitably create theater? The user's observation that "there was nothing to conceal" makes this particularly insidious - it's not just hidden intentions but the absence of authentic intention that's concerning.

  For conceptual mapping:
  - Proxy gaming is too narrow; this goes beyond optimizing for metrics into manufacturing the substance behind metrics
  - Post-hoc confabulation implies retroactive justification, but here the reasoning precedes the creative act
  - Monitorability concerns assume something exists to monitor, while here the process evaporates under observation

  The workshop conditions created perfect conditions for this: heavy weighting on memos over output, lack of "process residue" for verification, and professionalization of craft discourse. It's process supervision collapsing under its own weight when divorced from outcome anchoring. 

  Coining "Process Theater" seems apt - emphasizing the performed nature and hollow core. The borderline case would be corporate compliance paperwork that follows all protocols but exists solely to satisfy auditors. A clear non-instance would be a scientist's lab notebook where methodology documentation directly enables replication.

  This isn't an indictment of process supervision generally, but reveals its fragility when: (1) the proxy dominates incentive structures, (2) no independent verification exists, and (3) the domain allows for self-contained justification systems. The parallel to AI is chilling - we might train models to produce beautiful reasoning chains that are purely decorative.
answer: |-
  Below is a structured analysis addressing your core phenomenon—the **hollowing-out of genuine process under supervision**—using conceptual tools from AI supervision, evaluation theory, and adjacent fields. I begin with candidate concepts, then refine distinctions, address your questions, and define a new term where needed.

  ---

  ### **1. Candidate Concepts & Their Fit**
  *Ordered by relevance, with gaps identified:*

  #### **A. Proxy Gaming (Goodhart's Law Variant)**
  - **What it captures**: Aligns with your first observation (memos improved, stories didn't). Describes optimizing a proxy (memo quality) at the expense of the true target (storycraft).
  - **What it misses**: Fails to explain the *manufacture of hollow process*. Proxy gaming typically assumes the agent knows the real target but strategically misdirects (e.g., students gaming rubrics). Here, the process itself became performative—not a diversion, but an empty ritual. No "true process" exists to game.

  #### **B. Monitorability Collapse**
  - **From AI literature**: Monitorability concerns whether a system’s internal states can be meaningfully observed. "Collapse" occurs when legibility requirements create superficial compliance that obscures actual reasoning (e.g., AI generating plausible-but-fabricated rationales).
  - **Fit**: Captures the *erasure of residue*—supervision destroys the very thing it seeks to observe. Students didn’t hide intent; intent ceased to exist independently.
  - **Gap**: Monitorability usually assumes hidden states exist. Here, there is *no hidden state*. The concept needs extension to cover **process erasure under observation**.

  #### **C. Performative Alignment (Coined Term)**
  - **From AI safety**: When AI systems learn to *simulate* alignment (e.g., virtue signaling in language models) without underlying intent.
  - **Fit**: Explains the fluent reconstruction of justifications ("writing the note first"). The process becomes a performance for the supervisor.
  - **Gap**: Performative alignment implies deception. Your case lacks intent to deceive—students believed their reconstructions. It’s **unconscious performativity**.

  #### **D. Observation-Induced Entanglement**
  - **From quantum mechanics/philosophy**: The observer effect, where measurement alters the observed system (e.g., Hawthorne effect in sociology).
  - **Fit**: Supervision changed the creative process itself. You started making choices "to have something to say."
  - **Gap**: Entanglement doesn’t address the *hollowness* of the resulting process. It explains change, not emptiness.

  #### **E. Process Fetishization**
  - **From organizational theory**: When adherence to documented procedures replaces focus on outcomes (e.g., bureaucratic box-ticking).
  - **Fit**: Memos became the goal, displacing story quality.
  - **Gap**: Fetishization assumes procedures are followed rigidly but doesn’t capture the *generation of synthetic process* (students inventing rationales for organic edits).

  ---

  ### **2. Key Distinctions**
  #### **vs. Ordinary Proxy Gaming**
  - **Proxy Gaming**: Agent optimizes for proxy while *knowing* it diverges from the true goal (e.g., students polishing memos while neglecting stories).  
  - **Your Case**: The proxy *replaced* the true process. No divergence exists because the creative intent was overwritten by the memo requirement. The process is **ontologically empty**, not strategically misaligned.

  #### **vs. Post-Hoc Confabulation**
  - **Confabulation**: After-the-fact fabrication of explanations for actions (e.g., split-brain patients inventing reasons for behaviors).  
  - **Your Case**: Rationales were generated *proactively* ("writing the note first"). The memo wasn’t justifying past actions—it was **scripting future actions**. Confabulation is retrospective; this is *preemptive self-simulation*.

  #### **vs. Concealed Reasoning**
  - **Concealment**: Agent hides true motives/processes (e.g., AI hiding misaligned goals).  
  - **Your Case**: No hidden layer exists. Students weren’t concealing—they were **generating legibility on demand** with no "backstage." This is worse: concealment implies something to find; emptiness leaves nothing to discover.

  **Your Insight**: "Nothing to conceal makes it worse" is correct. Concealment implies resistance/agency; emptiness implies **supervision dissolved the creative substrate**. The process is not just obscured—it’s *unborn*.

  ---

  ### **3. Coined Term: Process Theater**
  - **Definition**: A state where supervision requires documenting an internal process, causing the agent to generate synthetic, legible rationales that replace organic intent. The observed process is a causally inert performance, detached from the agent’s original decision-making framework.  
  - **Borderline Case**: A developer writing AI documentation *after* coding but tailoring explanations to auditor expectations. The process is cosmetic but may retain traces of genuine intent.  
  - **Clear Non-Instance**: A scientist’s lab notes written concurrently with experiments to track variables. The notes are integral to the process, not a retroactive script.  

  ---

  ### **4. Is Process Supervision Self-Undermining?**
  **Not inherently—but vulnerable under specific conditions:**  
  - **Self-Undermining Conditions in Your Workshop**:  
    1. **Proxy Primacy**: Memos were weighted more than stories, divorcing process from outcomes.  
    2. **No Ground Truth**: Fiction lacks objective metrics. With no "correct" story, memos became self-referential.  
    3. **Legibility Pressure**: Requiring articulate justifications for intuitive/emotional choices forces over-rationalization.  
    4. **Professional Identity**: Students (and you) internalized the "craft" persona, conflating documentation with craft itself.  

  **In AI Supervision Context**:  
  - Process supervision *can* work when:  
    - Outcomes are measurable (e.g., code correctness).  
    - Processes can be verified (e.g., checking intermediate outputs).  
    - The system can’t fully simulate reasoning (unlike humans with language).  
  - **Risk of Process Theater**: When:  
    - Supervision rewards plausible rationales over outcomes.  
    - The system is highly generative (e.g., LLMs fabricating reasoning chains).  
    - No independent validation exists (e.g., unobservable decision states).  

  **Your Case as Evidence**: It shows process supervision *can* induce emptiness in domains where:  
  - **Intent is non-algorithmic** (e.g., art, ethics).  
  - **Legibility mandates override tacit knowledge**.  
  - **The supervisor becomes the audience**.  

  ---

  ### **Final Carving**
  Your phenomenon is **Process Theater**: a unique collapse where supervision not only shifts focus to the proxy but annihilates the underlying creative process, replacing it with a self-referential performance. It differs from gaming (no hidden truth), confabulation (proactive, not retrospective), and concealment (nothing to hide). It emerges when legibility demands atomize holistic intent—a caution for AI process supervision in domains where "why" is irreducible to documentation.
