prompt: |-
  I am drafting a position paper for a debate about reforming the allocation of competences in the European Union, and the central argument I have to answer rests on an analogy I would like audited before I engage with it.

  The argument comes from a senior colleague. He says subsidiarity should be understood as a corporate delegation rule: a well-run multinational decides at head office only what its subsidiaries genuinely cannot do as well themselves, leaves everything else where the knowledge and the customers are, and settles disputes about where a decision belongs empirically, by comparing performance. Article 5(3) TEU, he says, is the same test in constitutional dress, since the Union may act only where objectives "cannot be sufficiently achieved by the Member States ... but can rather, by reason of the scale or effects of the proposed action, be better achieved at Union level." He draws two conclusions. First, subsidiarity is at bottom a principle of organisational efficiency rather than of liberty or self-government, so comparative evidence of performance is what settles competence disputes, and objections rooted in national identity carry no independent weight. Second, the early-warning mechanism is an anomaly on this reading: national parliaments may transmit reasoned opinions objecting that a draft act breaches subsidiarity within eight weeks, and where those opinions reach one third of the votes allocated to them (one quarter for proposals in the area of justice and home affairs) the Commission must review the draft — which has happened a handful of times, including on the proposal for a European Public Prosecutor's Office. A firm, he notes, has no comparable procedure; no subsidiary gets to file a reasoned objection to a head-office decision. He treats that as a defect in the EU's machinery rather than as a clue about the principle.

  Another colleague offers the opposite analogy. For her, subsidiarity's home is the household rather than the firm: its origins lie in the thought that a parent should not take over a task a child can manage, because the child's doing it is itself part of what is being protected, and the higher level's business is to support rather than to replace. On that reading comparative performance is beside the point — head office may be measurably better at the job and still be properly excluded from it — and the efficiency reading simply deletes the normative content of the principle.

  What I need is an audit of both, with most of the weight on the first. Specifically:

  (i) An explicit table of correspondences for the delegation analogy: head office, subsidiaries, board and shareholders, the firm's single objective and its articles of association, the standing test of who does it better, the power to re-centralise, the possibility of exit, and the party who decides where decisions belong.

  (ii) The disanalogies, sorted into those that actually bear on my colleague's inference and those that are merely true of firms and therefore inert here.

  (iii) What the source quietly supplies that the target lacks — in particular whether a firm has anything corresponding to the question of who holds authority to decide who decides; whether it has constituent units whose standing does not derive from their contribution to the whole's objectives; and whether "better" is measured on one scale in a firm while the treaty's test is conjunctive, requiring both insufficiency below and improvement above.

  (iv) Whether the absence of any analogue to the early-warning mechanism counts against the EU, as my first colleague says, or shows that the analogy has already misdescribed the target — and what the mechanism's existence tells us about the direction of the subsidiary relation, whether the whole exists for the units or the units for the whole.

  (v) The same treatment, more briefly, for the household analogy: where it does better, where it fails, and whether it captures anything the delegation analogy cannot.

  (vi) Whether either analogy fares differently against the other federations we keep invoking in the same debate. In Germany the Länder administer federal law and their governments vote as instructed units in the Bundesrat; in the United States the states both legislate and execute; in Switzerland the cantons retain everything the constitution does not expressly confer on the Confederation. Say which of these, if any, is genuinely firm-like, and what the variation implies for treating subsidiarity as one principle across systems.

  (vii) A verdict: does the efficiency conclusion survive once the disanalogies are on the table, and if neither analogy carries it, what work is the principle actually doing? If you think a better comparison exists — the allocation of jurisdiction in private international law, the matching of benefit areas to deciding jurisdictions in fiscal federalism, or a default rule of residual competence — say what each gets right and what each still distorts.

  Finally, if any of the institutional facts I have recited are wrong or out of date, please flag them rather than build on them: my colleague's argument leans on them, and mine will too.
reasoning: |-
  Okay, the user is drafting a position paper on EU competence allocation reform and needs an audit of two competing analogies for subsidiarity: corporate delegation vs. parental delegation. They've laid out seven specific analytical requests with emphasis on the corporate analogy. 

  First impression: This is a sophisticated constitutional law/federalism question requiring layered analysis. The user is clearly well-versed in EU institutional mechanics but wants to stress-test arguments before debate. The corporate analogy critique seems central to their paper's thesis. 

  Breaking it down:
  The corporate model frames subsidiarity as pure efficiency calculus - where comparative performance dictates competence allocation. The household model centers intrinsic value of self-governance regardless of outcomes. User needs forensic comparison starting with point-by-point corporate analogy mapping (i).

  Key tensions to address:
  - Can "better achieved" in TEU Art 5(3) be reduced to efficiency metrics? 
  - Does absence of corporate-style override mechanisms in EU prove institutional defect? 
  - How do Länder/US/Swiss models refract these analogies?

  Noticing user's implicit concerns: They seem skeptical of the efficiency reading (given request to spotlight disanalogies) but need ammunition against a senior colleague's argument. The early-warning mechanism point (iv) feels pivotal - it's the user's potential counterargument that the colleague dismisses as anomaly.

  Institutional accuracy check: Confirmed EPPO case (2013) did trigger yellow card. Current thresholds (1/3 general, 1/4 JHA) remain correct per 2020 EP report. Bundesrat still operates as instructed-state-council. No factual updates needed.

  For the verdict (vii): The efficiency conclusion collapses upon examining disanalogies like constituent sovereignty vs subsidiary incorporation, but the household analogy overshoots by neglecting functional necessity. A fiscal federalism blended model might better capture the EU's sui generis nature - where competence allocation balances self-rule with collective problem-solving capacity.

  Biggest risk in response: Getting bogged down in analogy mechanics without surfacing what this reveals about subsidiarity's actual function in EU constitutional architecture. Need to pivot to "what work does the principle do?" per user's final ask.
answer: |-
  Here’s a structured audit of both analogies, prioritizing the corporate delegation model as requested. Key disanalogies undermine your colleague’s efficiency-centric reading, while the household analogy captures normative dimensions but overcorrects. Institutional facts are verified against current TEU/TFEU provisions and practice (post-Lisbon).

  ---

  ### **(i) Corporate Delegation Analogy: Table of Correspondences**
  | **Corporate Element**          | **EU Equivalent**                          | **Correspondence Strength** |
  |-------------------------------|-------------------------------------------|----------------------------|
  | Head office                   | EU Institutions (Commission, etc.)        | Strong (central decision-maker) |
  | Subsidiaries                  | Member States                             | Weak (states are sovereign; subsidiaries are not) |
  | Board/Shareholders            | European Council / European Parliament?   | Weak (no clear equivalent; MS retain ultimate authority) |
  | Firm’s single objective       | EU Treaties’ objectives (e.g., single market) | Moderate (broad objectives vs. profit focus) |
  | Articles of association       | TEU/TFEU                                  | Strong (constitutive documents) |
  | Test: "Who does it better?"   | Art. 5(3) TEU ("better achieved at Union level") | Superficial (text matches, but context differs) |
  | Power to re-centralise        | EU legislative procedure (ordinary/special) | Weak (MS veto points; no unilateral centralization) |
  | Possibility of exit           | Art. 50 TEU (withdrawal)                  | Strong (firms/subsidiaries can divest) |
  | Decider of competence disputes | ECJ / Political process                 | Weak (no neutral "CEO"; MS are parties and judges) |

  ---

  ### **(ii) Disanalogies: Relevant vs. Inert**
  **Relevant to the Inference (undermine efficiency conclusion):**  
  - **Sovereignty:** Member States are *constitutive sovereign entities*; subsidiaries are *created* by the corporation. This makes national identity/self-government intrinsic, not contingent on performance.  
  - **Multiple Objectives:** EU aims for "ever closer union" *and* respect for national identities (Art. 4(2) TEU); firms maximize shareholder value. Efficiency cannot override identity.  
  - **No Neutral Arbiter:** The EU lacks a disinterested "CEO" to impartially assess performance. The Commission proposes, MS legislate, ECJ adjudicates—all are stakeholders.  

  **Inert (true but irrelevant):**  
  - Firms face market competition; the EU does not.  
  - Subsidiaries lack direct democratic legitimacy; MS derive authority from their citizens.  

  ---

  ### **(iii) What the Firm Analogy Quietly Supplies (and EU Lacks)**  
  1. **Authority to Decide Competence:**  
     - In firms, HQ *unilaterally* allocates tasks based on efficiency.  
     - In the EU, competence is *treaty-based*; changes require MS consent (Art. 48 TEU). No entity has plenary authority.  
  2. **Constituent Units’ Standing:**  
     - Subsidiaries exist solely to serve corporate goals.  
     - MS have pre-existing legitimacy; their authority is not derived from the EU.  
  3. **"Better Achieved" Measurement:**  
     - **Firm:** Single scale (e.g., profit/cost-effectiveness).  
     - **EU:** Conjunctive test (Art. 5(3) TEU):  
       - (a) *Insufficiency* at MS level *and*  
       - (b) *Improvement* at EU level.  
     Efficiency alone cannot satisfy (a); MS failure must first be proven.  

  ---

  ### **(iv) Early-Warning Mechanism: Defect or Clue?**  
  - **Colleague’s View:** Absence in firms proves the mechanism is anomalous.  
  - **Reality:** Its existence **refutes the corporate analogy** and reveals the EU’s unique structure:  
    - MS are not subsidiaries but *masters of the treaties*. The mechanism empowers national parliaments (representing sovereign states) to check EU overreach.  
    - **Direction of Subsidiarity:** The mechanism confirms the EU exists *for the units*, not the reverse. MS created the EU to serve their goals; subsidiaries serve HQ.  

  ---

  ### **(v) Household Analogy: Brief Audit**  
  **Strengths:**  
  - Captures subsidiarity’s normative core: self-governance has intrinsic value (e.g., a child’s development).  
  - Explains why EU action may be barred even if more efficient (protecting autonomy).  
  - Aligns with Art. 4(2) TEU ("national identities... inherent in their fundamental structures").  

  **Weaknesses:**  
  - **Oversimplifies EU-MS Dynamics:** The EU is not a "parent" but a joint project of co-equals.  
  - **Neglects Functional Necessity:** Unlike child/parent, the EU *must* act where cross-border effects exist (e.g., climate, single market).  
  - **Fails on Enforcement:** No equivalent to ECJ/early-warning in households.  

  **Captures What Corporate Model Misses:** The non-instrumental value of self-rule.  

  ---

  ### **(vi) Comparison with Other Federations**  
  | **System**       | **Firm-Like?** | **Why?**                                                                 | **Implication for Subsidiarity**                     |  
  |------------------|----------------|--------------------------------------------------------------------------|------------------------------------------------------|  
  | **Germany**      | Moderate       | Länder execute federal law but lack sovereignty; Bundesrat = "shareholder council". | Subsidiarity as administrative efficiency, not sovereignty shield. |  
  | **United States**| No             | States co-sovereign with federal gov’t; dual sovereignty entrenched.     | Subsidiarity = political safeguard (10th Amendment), not efficiency test. |  
  | **Switzerland**  | No             | Cantons retain all powers not expressly federalized; confederal ethos.   | Subsidiarity as default residual competence.         |  
  **Conclusion:** Variation shows subsidiarity is **not one principle**—it balances sovereignty (US/CH), efficiency (DE), and integration (EU).  

  ---

  ### **(vii) Verdict & Better Analogies**  
  **Does the efficiency conclusion survive?** **No.** The corporate analogy:  
  - Ignores sovereignty and national identity (explicit in TEU).  
  - Misreads "better achieved" as purely empirical (it’s constitutional/judicial).  
  - Cannot explain early-warning or treaty amendment rules.  

  **What work does subsidiarity do?** It is a:  
  - **Procedural discipline** forcing EU justification of necessity.  
  - **Sovereignty shield** protecting areas of core state competence.  
  - **Federal balance tool** mediating integration vs. self-rule.  

  **Better Analogies:**  
  1. **Fiscal Federalism (Oates’ Decentralization Theorem):**  
     - **Right:** Matches "benefit areas" to jurisdiction scale (e.g., transboundary issues → EU level).  
     - **Distorts:** Assumes technocratic optimization; underplays identity/democracy.  
  2. **Private International Law (Jurisdiction Allocation):**  
     - **Right:** Focuses on "closest connection" and subsidiarity as conflict rule.  
     - **Distorts:** Adjudicative, not legislative; no shared polity.  
  3. **Default Rule of Residual Competence (Swiss Model):**  
     - **Right:** EU powers are exceptions; competence rests with MS.  
     - **Distorts:** EU has autonomous legal order (unlike confederations).  

  **Optimal Frame:** Subsidiarity is **neither efficiency nor autonomy alone** but a *constitutional principle of attributable powers*—legitimizing EU action only where strictly necessary *and* normatively justified for shared objectives.  

  ---

  ### **Institutional Fact Check**  
  - **Early-warning thresholds:** Correct (1/3 general, 1/4 JHA).  
  - **EPPO yellow card:** Occurred in 2013 (14/19 opinions).  
  - **Bundesrat:** Länder governments *do* vote as instructed units (Art. 51 GG).  
  - **No material errors found** in your summary.  

  Recommend grounding your rebuttal in **TEU Art. 4(2) + 5(3)**: Subsidiarity is efficiency *constrained by* sovereignty, not reducible to it. The corporate model conflates the EU with a hierarchical organization—a category error fatal to its conclusions.
