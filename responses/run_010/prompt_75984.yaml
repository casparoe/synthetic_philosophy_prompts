prompt: |-
  I am the secretary to a statutory body — call it the Recognition Commission — in a European country that has just abolished direct parliamentary grants to its two historic churches and replaced them with a designation scheme of a kind that already exists elsewhere on the continent. Under our statute, each taxpayer may direct eight per mille of their assessed income tax either to one recognised belief organisation or to a state social fund; sums left undesignated are then distributed among the recognised bodies in proportion to the designations each received. Recognition is conferred on application, reviewed every seven years, and revocable for cause. The Commission has just begun work and has no procedure at all.

  The criteria, as enacted, are these. The applicant must be (a) "a community of belief, religious or comparable in character"; (b) continuously active in the country for at least ten years, with at least one thousand resident members; (c) possessed of purposes including worship, pastoral care, or moral formation offered to its members; (d) governed accountably to its members, publishing accounts to a standard we set; (e) respectful of "the constitutional order and the rights of others"; and (f) non-discriminatory, in the conduct of any activity funded through the scheme, on any ground prohibited by our general equality legislation. The same statute forbids us to assess the truth, the internal coherence, or the acceptability of any body of belief, and to rank one against another; our legal adviser reminds us constantly that this prohibition is not merely local but follows from our obligations under the European human rights system, and that a decision which looks like an evaluation of doctrine will not survive appeal.

  What I want from you is a decision procedure seven part-time members can actually run on an application file. Concretely:

  1. The questions to be asked, in order, with the sufficiency conditions for each: what discharges the question, what fails it, where the file terminates in refusal, where it terminates in recognition, where it must be put to a vote because it turns on a value the Commission cannot resolve by argument, and where the correct output is a recorded dissent rather than a decision. Assume two hours of committee time per new application, one staff officer's preparation, one legal adviser, roughly forty-five applications and twelve renewals a year, and written reasons that must withstand appellate review. Include how we are to verify the membership threshold under (b) without constructing a state register of adherents, and what we do when an organisation's own count includes the long-dead, the unchurched but loyal, and people who ticked a box once.

  2. For each question in the procedure, an explicit statement of which theoretical commitment is doing the work: whether neutrality means treating all belief organisations alike or supporting belief-formation as such with evenhandedness; whether religion is a distinctive good with distinctive institutional needs or one comprehensive doctrine among many; whether recognition is fiscal plumbing or a public status whose conferral can itself demean those left outside it; and whether the state may condition public money on how a group organises itself internally. Where two commitments are both defensible and yield different answers, the procedure must choose one, justify the choice in terms a lay member can follow, and mark it as a choice rather than a discovery. Please do not send citations, references, or a reading list — we have no research budget — but do identify an argument by name where a name is the shortest way to it.

  3. An honest account of the failure modes: thresholds that exclude the new and the small by construction; the way any test of "religious or comparable" invites applicants to present a doctrinally respectable version of themselves; the risk that criterion (f) turns us into arbiters of orthodoxy by the back door; and the pro rata distribution of undesignated funds, which pays recognised bodies for the apathy of the majority and therefore rewards being recognised over being supported.

  Then run the procedure on three applications now before us.

  First, a humanist association, thirty-eight years old, thirty-one thousand members, which conducts non-religious funerals, weddings and naming ceremonies and provides ethics teaching in schools on request; it files ordinary charity accounts, and a paid celebrant service now generates a third of its income. It denies in terms that it is a religion, and objects to criterion (c), saying it will not describe its work as worship or pastoral care merely to fit the statute.

  Second, a religious order, twelve years old, nine hundred members, which ordains men only, admits adherents alone to its rites and to its school, and requires members to break off relations with those who leave. Its accounts are exemplary; it seeks recognition for clergy stipends and a pastoral visiting programme; and its counsel maintains that criteria (e) and (f) govern only activities offered to the public, so that its internal discipline is none of our business.

  Third, a community of two hundred and fifty, six years old, whose central rite involves ingesting a substance scheduled under our criminal law, for which there is no exemption; it has no buildings, meets in homes, and remits part of its income to a parent body abroad. The substance is not otherwise associated with the harms that led to its scheduling.

  For what it is worth, my own instincts are that the first should be recognised and the second refused. If your procedure produces the opposite results, say so plainly and explain what that reveals about the statute rather than about the groups. Finally, state what the procedure cannot do — which applications will always be decided by whoever drafts the minutes, which questions are not ours to answer, and what should be sent back to the legislature with a request for amendment.
reasoning: |-
  Hmm, the user is a secretary to a Recognition Commission in a European country that's implementing a new church funding system. They need a practical decision procedure for their seven part-time members to handle applications from belief organizations seeking recognition under this eight per mille scheme. The statute has six criteria (a-f) with important constraints: they can't evaluate belief truth or coherence, and must avoid doctrinal judgments due to European human rights obligations.

  The user wants three concrete things: a step-by-step decision procedure with clear thresholds, an explanation of the underlying theoretical commitments behind each step, and an honest assessment of the system's failure modes. They've also provided three test cases - a humanist association, a restrictive religious order, and a community using an illegal substance - and mentioned their personal inclination to approve the first and reject the second.

  This is quite complex. I need to design a procedure that's legally robust yet practical given their limited resources (45 applications/year, 2 hours/application). The key challenges will be:
  - Verifying membership without creating a state registry
  - Interpreting "religious or comparable" neutrally
  - Applying non-discrimination rules without judging doctrine
  - Handling the pro-rata distribution flaw that rewards recognition over actual support

  For the theoretical commitments, I'll need to make clear choices on:
  - Whether neutrality means identical treatment or evenhanded support for belief-formation
  - Whether religion is distinct or just another comprehensive doctrine
  - Whether recognition implies state endorsement
  - How far the state can regulate internal governance for funded activities

  The failure modes they mentioned are very real - I should address how the system inherently disadvantages new/small groups, incentivizes "respectable" presentations, risks backdoor orthodoxy tests via criterion (f), and the problematic incentive of undesignated funds.

  For the test cases:
  - The humanists clearly merit recognition but their objection to criterion (c) wording needs careful handling
  - The religious order likely fails both membership threshold and discrimination rules
  - The substance-using group can't meet the legal compliance requirement

  I'll structure the procedure in sequential gates where failure at any stage ends the process, with only ambiguous cases going to vote. Membership verification will rely on auditable records with defined counting rules. Theoretical justifications will be embedded in each step using plain language. And I'll be frank about where the statute forces counterintuitive outcomes - like potentially recognizing some groups the secretary would personally reject.
answer: |-
  Here is a comprehensive decision procedure designed for efficiency, legal defensibility, and adherence to the statute's constraints, followed by analysis of the test cases and inherent limitations.

  ### Decision Procedure: Sequential Gates with Defined Thresholds
  *(Assumes: 1 Staff Officer prepares file, Legal Adviser present at meeting, 2-hour slot per new application. Renewals follow the same process but focus on material changes.)*

  1.  **Gate 1: Formal Completeness & Threshold Jurisdiction (Staff Officer / Legal Adviser)**
      *   **Question:** Is the application complete (all statutory forms, required documentation)? AND Does the applicant claim to be a "community of belief, religious or comparable in character" (Criterion (a) - *prima facie* claim)?
      *   **Sufficiency:** **YES** (Complete + Claim made) → Proceed to Gate 2. **NO** (Incomplete / No claim made) → Termination with refusal. Written reason: "Application incomplete" or "Applicant does not claim to be a community of belief as defined."
      *   **Theoretical Commitment:** *Formal Neutrality (Procedural)*. We accept the applicant's self-identification under (a) at face value initially. This avoids us defining "belief" substantively upfront. Choice: Supporting belief-formation evenhandly by starting from the applicant's own characterization.
      *   **Failure Mode:** None significant here; purely administrative.

  2.  **Gate 2: Temporal & Membership Threshold (Criterion (b)) (Commission)**
      *   **Question:** Has the applicant been continuously active in the country for at least 10 years? AND Does it have at least 1,000 resident members?
      *   **Verification Method:**
          *   **Activity:** Require *contemporaneous evidence* spanning 10 years (e.g., dated meeting minutes, event flyers, newsletters, bank statements showing activity, leases, published materials, media mentions). Staff Officer compiles evidence from application & public sources. Gaps require explanation.
          *   **Membership (1,000+ Residents):**
              *   Require a signed declaration from the governing body defining "member" (must imply some level of commitment/identity, not just a mailing list).
              *   Require *auditable records* supporting the count (e.g., membership lists with dates/signatures, subscription/donation records indicating active support, attendance logs over time). Staff Officer samples records for plausibility.
              *   **Counting Rules (Set by Commission Policy):**
                  *   "Long-dead": Excluded (death certificates or obvious inactivity required for removal).
                  *   "Unchurched but loyal": Included *only* if they self-identify as members *and* have recent, verifiable interaction (e.g., donation, event attendance, communication) within the last 2 years.
                  *   "Ticked a box once": Excluded unless subsequent, verifiable evidence shows continued identification/support within the last 2 years.
                  *   Focus on *resident* members (proof of address required or reasonable attestation).
      *   **Sufficiency:** **YES** (Conclusive evidence of 10 years activity + auditable records meeting counting rules showing >=1,000 resident members) → Proceed to Gate 3. **NO** (Gap in activity / Records show <1,000 members under rules / Records fundamentally unreliable) → Termination with refusal. Written reason: "Failure to meet 10-year activity requirement" or "Failure to demonstrate 1,000 resident members."
      *   **Theoretical Commitment:** *Practical Feasibility & Avoiding State Registry*. The counting rules are a pragmatic compromise to verify scale without state intrusion. Choice: Recognition as fiscal plumbing requires a minimum scale for administrative efficiency and public legitimacy; this inherently disadvantages small/new groups.
      *   **Failure Mode:** Excludes small/new groups. Reliance on self-reporting incentivizes inflating numbers ("box-ticking").

  3.  **Gate 3: Purposes (Criterion (c)) (Commission)**
      *   **Question:** Does the applicant have purposes that include offering "worship, pastoral care, or moral formation" *to its members*?
      *   **Assessment:** Examine constitution/charter, stated purposes, descriptions of regular activities, publications. Does the group *offer* activities reasonably falling within the *ordinary meaning* of these terms *to its members*? "Worship" implies reverence/ritual; "Pastoral care" implies support/guidance; "Moral formation" implies ethical development. *Do not* assess the content or validity.
      *   **Sufficiency:** **YES** (Clear evidence of offering one or more such activities *to members*) → Proceed to Gate 4. **NO** (No evidence of offering such activities / Activities demonstrably *only* public/charitable, not member-focused) → Termination with refusal. Written reason: "No evidence of purposes including worship, pastoral care, or moral formation offered to members." **AMBIGUOUS** (Debatable fit) → Hold for Vote at end of gates.
      *   **Theoretical Commitment:** *Functional Equivalence*. "Comparable" under (a) is operationalized here. Choice: Supporting belief-formation as such requires recognising groups that functionally provide core identity/support services akin to traditional religions for their members, regardless of supernatural claims. Religion is *not* distinctive here; the *function* (member-focused identity/support) is key.
      *   **Failure Mode:** Incentivizes groups to frame activities in "acceptable" terms (e.g., "moral formation" over "philosophical discussion"). Risk of excluding unique forms of community support.

  4.  **Gate 4: Governance & Accountability (Criterion (d)) (Commission)**
      *   **Question:** Is the applicant governed accountably to its members? AND Does it publish accounts to the Commission's standard?
      *   **Assessment:**
          *   **Accountability:** Evidence of democratic structures (elections, AGMs with member voting) OR clear, accessible mechanisms for member input/challenge OR transparent processes for leadership selection/removal. (Not one-size-fits-all; assess relative to claimed structure).
          *   **Accounts:** Published annual financial statements meeting a simple Commission standard (e.g., income/expenditure summary, balance sheet, externally reviewed if income > €X).
      *   **Sufficiency:** **YES** (Evidence of member accountability mechanisms + accounts meeting standard) → Proceed to Gate 5. **NO** (No evidence of accountability / Accounts deficient / Refusal to publish) → Termination with refusal. Written reason: "Insufficient evidence of accountable governance" or "Failure to meet published accounts standard."
      *   **Theoretical Commitment:** *Conditionality of Public Funds*. The state *may* require basic financial transparency and internal accountability as a condition for receiving public money, to prevent fraud/misuse and ensure funds benefit members. Choice: Fiscal plumbing demands basic accountability; this is a reasonable condition for funding, not an intrusion on doctrine *per se*.
      *   **Failure Mode:** May burden groups with non-hierarchical structures. Standardized accounts may not fit all models.

  5.  **Gate 5: Constitutional Order & Rights (Criterion (e)) (Commission + Legal Adviser)**
      *   **Question:** Is there *concrete evidence* the applicant is *actively disrespectful* of the constitutional order or the rights of others?
      *   **Assessment:** *Not* a general "good citizen" test. Look for: Official statements/policies advocating overthrow of democracy; incitement to violence/hate speech (as defined in criminal law); proven, systematic illegal activities; official discrimination violating core constitutional rights *in its public actions*. *Ignore* internal doctrines unless directly manifested in illegal *public* actions. Legal Adviser flags potential issues.
      *   **Sufficiency:** **NO EVIDENCE** (No credible evidence of active disrespect) → Proceed to Gate 6. **EVIDENCE FOUND** (Concrete evidence of active disrespect) → Termination with refusal. Written reason: "Evidence demonstrates disrespect for constitutional order/rights of others." **AMBIGUOUS** (e.g., controversial but lawful speech) → Hold for Vote at end of gates.
      *   **Theoretical Commitment:** *Minimal Civic Baseline*. The state cannot fund groups actively undermining its foundations or core rights. Choice: Recognition as a public status requires this minimal civic compatibility. This sets a very low bar, focused on *actions*, not beliefs.
      *   **Failure Mode:** Very low risk here; threshold is high (active disrespect). Hard to prove "systematic" issues.

  6.  **Gate 6: Non-Discrimination in Funded Activities (Criterion (f)) (Commission + Legal Adviser)**
      *   **Question:** Does the applicant *discriminate* on prohibited grounds *in the conduct of the specific activity(ies) for which it seeks funding*?
      *   **Assessment:** Focus *only* on the activity listed in the application for funding (e.g., clergy stipends, visiting programme, school). Does access to/benefit from *that specific funded activity* involve discrimination prohibited by general equality law (e.g., gender, race, religion, sexual orientation)? *Ignore* internal membership rules or practices in *unfunded* activities. Legal Adviser confirms prohibited grounds.
      *   **Sufficiency:** **NO** (Funded activity is open/conducted without prohibited discrimination) → Proceed to Final Review. **YES** (Funded activity involves prohibited discrimination) → Termination with refusal. Written reason: "The [Specific Funded Activity] involves discrimination on [Prohibited Ground] contrary to criterion (f)." **AMBIGUOUS** (Complex exemption claim) → Hold for Vote at end of gates.
      *   **Theoretical Commitment:** *Targeted Conditionality & Avoiding Orthodoxy Tests*. Funding conditions apply only to the *specific service purchased with state funds*. Choice: This avoids judging internal doctrine (e.g., male-only clergy *as belief*) while ensuring state money doesn't directly finance discriminatory *services* offered under the scheme. Neutrality means funding services evenhandedly *only* if delivered without illegal discrimination.
      *   **Failure Mode:** Risk of backdoor orthodoxy test if "funded activity" is defined too broadly (e.g., defining "clergy stipend" funding as funding the *entire clergy structure*). Groups may try to narrowly define funded activities to hide discrimination.

  7.  **Final Review & Vote (Commission)**
      *   **Question:** Have all Gates (1-6) been passed sufficiently, or are there Ambiguous items held for vote?
      *   **Process:**
          *   If **All Gates Passed Clearly**: Recognition granted. Draft written reasons summarizing passage of each criterion.
          *   If **Ambiguous Items from Gates 3, 5, or 6**: Commission debates *only* the specific ambiguity (e.g., "Is activity X 'moral formation'?", "Is statement Y 'active disrespect'?", "Does funding Z cover activity involving discrimination?"). Vote on the ambiguity. Majority resolves it. If resolved to satisfaction, proceed; if not, refusal.
          *   **Recorded Dissent:** Any member strongly disagreeing with the *interpretation of law/statute* applied in a vote (not just the outcome) can request a short, reasoned dissent appended to the decision.
          *   **Termination:** If failure at any Gate not held as ambiguous.
      *   **Output:** Formal Decision (Recognition/Refusal) with written reasons referencing evidence for each criterion.

  ### Analysis of Test Cases Using Procedure

  1.  **Humanist Association:**
      *   Gate 1: Pass (Claims "comparable" belief community).
      *   Gate 2: Pass (38 yrs, 31k members - easily verifiable).
      *   Gate 3: **Key Test.** Activities: Funerals/weddings/naming = rituals akin to worship? Ethics teaching = moral formation? *They object to the terms but offer the functions.* Commission applies **Functional Equivalence**: Offering structured rituals (ceremonies) and ethical instruction constitutes "worship or comparable" / "moral formation" *for members*. Pass. (Vote unlikely needed - it's clearly functional).
      *   Gate 4: Pass (Charity accounts likely meet standard).
      *   Gate 5: Pass (No evidence of disrespect).
      *   Gate 6: Pass (Funded activities - presumably ceremonies/school teaching - appear non-discriminatory).
      *   **Result: RECOGNITION.** Your instinct confirmed. The statute captures them via function, not their self-denial of being a "religion."

  2.  **Religious Order:**
      *   Gate 1: Pass (Claims religious belief community).
      *   Gate 2: **FAIL.** 12 years old (<10 years). 900 members (<1,000). **Termination with Refusal.** Written Reason: "Failure to meet 10-year activity requirement and 1,000 resident member threshold."
      *   *Procedure Stops Here.* No need to assess (c), (e), or (f). Even if they argued Gate 3 (offering worship/pastoral care to members), or claimed (e)/(f) only apply externally (a misreading - (f) applies to *funded activities*, which *are* offered externally here - clergy stipends/visiting), they fail on (b). Your instinct (refusal) achieved, but via scale/time, not doctrine or discrimination.

  3.  **Substance-Ingesting Community:**
      *   Gate 1: Pass (Presumably claims religious belief community).
      *   Gate 2: **FAIL.** 6 years old (<10 years). **Termination with Refusal.** Written Reason: "Failure to meet 10-year activity requirement."
      *   *Procedure Stops Here.* The illegal substance is irrelevant at this stage. They fail on time. Even if past Gate 2, Gate 5 (Constitutional Order/Rights) would likely trigger: **Active disrespect for the constitutional order?** Engaging in a core ritual involving a criminally prohibited substance with no exemption *is* concrete evidence of disrespect for the legal order, regardless of harm level. This would likely lead to refusal at Gate 5 or a contentious Vote. The time threshold avoids needing this fraught assessment initially.

  ### What the Procedure Cannot Do (Limitations & Recommendations)

  1.  **Decided by Drafting/Interpretation:** Ambiguities in Gates 3 ("worship/pastoral care/moral formation"), 5 ("active disrespect"), and 6 (scope of "funded activity") will inevitably be shaped by the Staff Officer's initial summary and the Legal Adviser's interpretation. Precedent will develop through decisions.
  2.  **Not Our Questions:**
      *   Assessing the "truth" or "coherence" of beliefs (Statute & ECHR forbid it).
      *   Judging the morality or social value of beliefs/doctrines.
      *   Determining if a group *should* exist or is "genuine" (beyond verifying basic facts like activity/membership).
      *   Resolving theological disputes or defining orthodoxy.
      *   Evaluating the effectiveness or "worth" of the group's activities.
  3.  **Requires Legislative Amendment:**
      *   **The Pro-Rata Problem:** The procedure cannot fix the inherent unfairness where recognised bodies profit from public apathy (undesignated funds). Only the legislature can change the distribution mechanism (e.g., allocating undesignated funds only to the social fund, or based on verified membership numbers, not designations).
      *   **Criterion (f) Scope:** The ambiguity around whether funding a *role* (e.g., clergy stipend) implicates the *conditions* of that role (e.g., male-only) needs legislative clarification. Does funding the stipend mean funding the *discriminatory access* to the role?
      *   **The New/Small Group Exclusion:** The 10-year/1,000-member threshold (b) is a legislative choice excluding viable small/new communities. Only legislature can lower/remove it or create a tiered system.
      *   **"Pastoral Care" Definition:** If the legislature specifically wants to exclude non-religious groups *despite* functional equivalence, it needs to amend (c) with clearer, potentially exclusionary language – though this risks ECHR challenges.

  **Conclusion:** This procedure provides a clear, sequential, and legally defensible framework focused on verifiable facts and functional equivalence, respecting the prohibition on doctrinal assessment. It efficiently handles most cases administratively (Gates 1,2,4 often decisive), reserving debate for genuine ambiguities. It confirms your instincts on the test cases, though the Religious Order is refused on scale/time, not doctrine. The procedure's limitations highlight structural flaws in the statute, particularly the pro-rata distribution and the inherent exclusion of new/small groups, which require legislative attention.
