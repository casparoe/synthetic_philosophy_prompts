prompt: |-
  In September I became the calibration lead for a twelve-person forecasting group that enters long-horizon prediction tournaments. Among other duties, I draft and defend the protocol that governs how members report and revise their credences: members are scored with a strictly proper scoring rule on whatever number they post when a round opens, and the round's news flow — agency briefings, market moves, satellite imagery, retractions — arrives after posting.

  At our protocol review last Thursday two senior members, Nadine and Elias, argued for forty minutes over a rule Nadine wants to add. I was asked to referee and to write the recommendation. I could not settle it, and I need an adjudication I can defend at Friday's meeting.

  The proposed rule: at the opening of a round, a member must post not what they currently believe but their expectation of what they will believe at the close of the round, on the assumption that the intervening change comes from news they expect to receive. The exchange went roughly as follows.

  1. Nadine: this is an instance of a general requirement of rationality concerning one's own future beliefs — if you now expect that your later credence in some claim will be x, and you expect the change to be produced by information you do not yet have, then your present credence in that claim, given that expectation, should already be x. Her support: whoever flouts this can be made a guaranteed loser. A bookie buys from you today, at a price matching your current credence, a ticket that pays out if the claim turns out true; tomorrow, having by then absorbed the briefings, you buy the same ticket back at a price matching the credence you expected to have. The payoffs cancel, the bookie pockets the gap, and you are poorer however the claim resolves (with the mirror-image pair of trades available if your expected later credence is lower than your present one). A sure loss is the signature of incoherence.

  2. Elias: that guarantee is an artifact of how the deals are handed over. The vulnerability exists only because the trades are offered at different times, at different information states, with no view of the menu as a whole. Feed bets one at a time to a forecaster who updates flawlessly by conditioning on what she learns, and let the bookie see the same news she does, and you can pump her just as dry — she will rationally accept each trade when it is offered, and jointly lose. If sequential offering is enough to convict someone of incoherence, the concept of incoherence has stopped doing any work.

  3. Nadine: the Dutch book is the surface argument; the substance is about planning. Suppose you expect to be moved by evidence you have not yet seen, and decline to be moved now. You are adopting a plan whose later stages you already regard as responsive to reasons, while refusing to be responsive to those same reasons in advance. Deliberately arranging to disregard later what you now concede will be your reasons is irrational, and the sure-loss result is only a symptom. There is also a clean derivation available: if you expect to update by conditioning on what you learn, the requirement falls out for free, since your present credence is already the expectation of your later, conditionalized credence. It is not an extra postulate bolted onto Bayesianism.

  4. Elias: which shows where the force actually comes from, and it is conditionalization, not reflection. Not every rational change of belief is conditioning on new evidence. Expect to forget which of two nearly identical reports you have already read, and your later credence will legitimately diverge from what conditioning predicts. Expect to be posting numbers at the end of a thirty-hour shift, or on a medication you know flattens your judgment, and your later self is worse informed or worse at reasoning than your present self. In those cases the rational thing is to defer backwards, to the self that currently knows more — the precise opposite of what Nadine's rule commands.

  5. Nadine: those are not counterexamples, they fall outside the rule's scope. The requirement is explicitly restricted to cases in which you expect the change to be driven by information you lack. Forgetting, fatigue, and sedation remove the antecedent and leave the principle untouched.

  6. Elias: then for our purposes it is either empty or circular. The only way to determine whether an expected change is information-driven is to have already worked out what the information supports — that is, to have already performed the update. A rule applicable only retrospectively disciplines no one's deliberation. And in the cases where it does bite, it instructs a member to post a number she currently believes to be false, to a scoring rule that measures the accuracy of what she actually believes. That is the one thing a calibration protocol should never require.

  Nadine's last word was that expecting to arrive at 0.7 while sitting at 0.5 is not a stable pair of attitudes to hold; Elias's was that forecasting your own psychology is not the same act as ruling on the evidence. Neither budged.

  Please adjudicate the exchange as it actually unfolded, move by move, rather than summarizing the dialectic. I want committed judgments, not a balanced digest: where you think one of them is simply wrong, say so and say why, and where a point is genuinely contested among people who work on this, tell me which side you would bet on and roughly how strongly. No citations and no reading list — I want the reasoning, not the references.

  Structure the reply in exactly these sections, in this order:

  - **The principle on the table** (about 150 words). State Nadine's principle precisely, including its scope condition, and distinguish the versions of it that moves 1–6 are actually defending or attacking, since they are not all the same claim.
  - **Move by move** (about 800 words). One numbered entry per move, 1 through 6. Each entry opens with a rating on a five-point scale running from clearly wrong to clearly right, followed by four to six sentences of justification. For any move you rate poorly, say explicitly what would have to be true for it to succeed.
  - **What neither of them said** (about 300 words). At least two considerations the exchange misses that would have changed how it should have gone. I suspect one of them concerns the difference between a constraint on credences and a constraint on what to write on a scoring form.
  - **My recommendation** (about 200 words). Whether the group should adopt Nadine's rule as written, adopt an amended version, or reject it outright — and, if amended, the exact wording of the amended rule. Take a definite position; my name goes on the memo.
reasoning: |-
  Okay, the user is a calibration lead for a forecasting group dealing with prediction tournaments. They've got a dispute between Nadine and Elias about a proposed rule where forecasters must post their expected future credence rather than their current belief. Nadine thinks it's a rationality requirement, while Elias argues it's impractical or even irrational in some cases. The user needs a clear adjudication to defend in their upcoming meeting.

  Hmm, this is a deep philosophical debate about Bayesian rationality. Nadine is invoking the Reflection Principle - the idea that your current credence should match your expected future credence if you anticipate learning new information. She's using Dutch book arguments to support this. But Elias counters with legitimate exceptions - like when you expect to forget things or be impaired later. He also points out practical circularity: how can you know if a change is information-driven without already having done the update?

  The user wants me to judge each move in their six-point exchange. I need to carefully evaluate each argument. For instance, when Nadine claims violating Reflection leads to guaranteed losses (Move 1), Elias correctly notes (Move 2) that this vulnerability exists for any sequential decision-making, not just irrationality. That's an important distinction.

  I notice both missed some crucial points. The protocol isn't just about ideal rationality - it's about what numbers people write on scoring forms. There's also the principal-agent problem: forecasters might game the system if required to predict their future beliefs. And the group's purpose matters - are they measuring truth-tracking ability or something else?

  For the recommendation... I'm leaning toward rejecting Nadine's rule as written. It creates too many practical problems despite being theoretically sound in ideal cases. Maybe suggest a compromise where forecasters can optionally note if they're applying Reflection, but the default should remain current credences. That balances theory with operational reality.

  The user needs defensible reasoning, not citations. I'll structure it exactly as requested: principle explanation, move-by-move analysis, missed considerations, and a clear recommendation. They're putting their name on this, so the judgment needs to be confident and actionable.
answer: |-
  ### The principle on the table
  Nadine’s proposed rule requires a forecaster, at the opening of a round, to post their *expected future credence* at the round’s close, conditional on anticipating that any belief change will be driven *solely by new information they currently lack*. This is an application of the **Reflection Principle**: if you now expect your future credence in proposition P (after receiving specific new evidence) to be *x*, and you attribute this change *only* to that evidence, your current credence in P *should already be x*. Crucially, the scope is restricted to changes driven *exclusively* by anticipated, relevant information. Move 1 defends this as a general rationality constraint using a Dutch book argument. Move 3 reframes it as a planning norm and derives it from Bayesian conditioning. Moves 4-6 challenge the scope’s coherence (Elias) and its applicability to scoring (both).

  ---

  ### Move by move
  1.  **Rating: Partially Correct (Leaning Wrong)**  
      Nadine’s Dutch book argument *formally* shows that violating Reflection makes one vulnerable to a sure loss *in this specific sequential betting scenario*. However, Elias correctly identifies in Move 2 that this vulnerability arises from the *sequential offering* of bets under changing information states, not necessarily from irrational credences *alone*. The Dutch book succeeds against a conditionalizer too. For Nadine’s argument to fully succeed, she would need to show that the vulnerability stems *uniquely* from violating Reflection, independent of the sequential structure – which she doesn’t. The bookie exploits the *interaction* of belief change and sequential trade timing.

  2.  **Rating: Clearly Right**  
      Elias decisively undermines Nadine’s reliance on the Dutch book. He correctly points out that a perfectly rational agent who updates by conditioning on evidence *is also vulnerable* to a sure loss if a clever bookie offers bets sequentially, exploiting the agent’s rational responses at each information state. The vulnerability is an artifact of the sequential interaction and market mechanics, not proof that the agent’s *initial credences* were incoherent. This fatally weakens the Dutch book as a unique signature of Reflection-violation.

  3.  **Rating: Partially Correct (Leaning Right)**  
      Nadine’s shift to a planning perspective is stronger. Framing violating Reflection as deliberately planning to ignore future (anticipated) reasons is a compelling *normative* argument against such a plan. Her derivation from conditioning is sound *if* one assumes future updating *will* be by conditioning on the anticipated evidence: current credence *is* the expectation of future conditionalized credence. This makes Reflection a *consequence* of standard Bayesianism under specific conditions. However, it implicitly relies on the strong assumption that the *only* reason for belief change is the anticipated evidence.

  4.  **Rating: Clearly Right**  
      Elias provides crucial counterexamples demonstrating the limits of Reflection. When belief change is driven by *non-informational* factors (forgetting, fatigue, known impairment), rationally *deferring* to the better-informed or better-functioning earlier self is correct. This directly contradicts Nadine’s rule, which would demand aligning with the *expected worse* future credence. Elias convincingly shows that Reflection is not a universally applicable principle of rationality; its validity *depends* on the specific nature and driver of the anticipated change.

  5.  **Rating: Clearly Wrong**  
      Nadine’s attempt to deflect Elias’s counterexamples by invoking the scope restriction ("driven by information you lack") fails. Elias’s key point in Move 6 is correct: determining *whether* the expected change is purely information-driven *requires* already knowing what the evidence supports – i.e., effectively performing the update in advance. This renders the scope restriction practically unverifiable and operationally vacuous *at the decision point* (when posting). The rule offers no usable guidance if the forecaster must first *know* the outcome of the update to know if the rule applies.

  6.  **Rating: Mostly Right**  
      Elias’s core critiques are strong: the scope restriction is circular/empty for guiding deliberation *before* the update occurs, and the rule forces forecasters to post a number they *currently believe to be inaccurate* to a scoring rule designed to measure *current* belief accuracy. This fundamentally misaligns the scoring mechanism. His distinction between forecasting psychology and ruling on evidence is vital. However, his dismissal of the instability of holding 0.5 while expecting 0.7 (Nadine’s last point) is too quick – this *is* a genuine tension in standard Bayesian models *under her specific assumptions*.

  ---

  ### What neither of them said
  1.  **Scoring Rule Alignment & Incentives:** The primary purpose of the scoring rule is to incentivize accurate reporting of *current* beliefs. Requiring a forecast of *future* beliefs changes the incentive structure. Forecasters might now be incentivized to game predictions about *their own future epistemic state* rather than focusing solely on the event’s truth. This risks conflating skill in self-prediction with skill in forecasting the event itself, potentially distorting calibration metrics. The protocol needs clarity on what it aims to measure: truth-tracking ability or self-knowledge under anticipated evidence.
  2.  **The Principal-Agent Problem in Delegation:** Posting an expected future credence effectively delegates the *interpretation of future evidence* to one's future self. However, if the forecaster suspects their future self might be impaired (as per Elias’s examples), or if they strategically want to "lock in" a view before seeing volatile evidence, this delegation is irrational. The protocol must decide if forcing this delegation (via the rule) aligns with its goals, or if it should allow forecasters to act as their own "principal" by reporting current best judgment.
  3.  **Operationalizing "Information-Driven":** Neither addressed *how* a forecaster could feasibly distinguish an "information-driven" change from other influences *in real-time, before the update*. Is it purely subjective? This ambiguity invites inconsistent application and disputes, undermining the protocol's fairness and consistency. Requiring forecasters to *certify* that their expected change meets the scope condition adds cognitive load and potential for bad-faith claims.

  ---

  ### My recommendation
  **Reject Nadine's rule as written.** While the Reflection Principle holds theoretical merit under idealized conditions (perfect rationality, pure informational updates, known conditioning), Elias successfully demonstrates its fragility in real-world forecasting contexts (non-informational influences, circular scope definition). Crucially, **mandating forecasters to post a number they *currently believe to be inaccurate* fundamentally perverts the purpose of a proper scoring rule**, which is designed to reward *truthful revelation of current belief*. This misalignment creates perverse incentives and risks invalidating the calibration process.

  **Adopt an amended rule emphasizing current credence with optional future-credence annotation:**
  > "Members must post their current credence in the event at the opening of each round. Optionally, a member may *also* post their expectation of their future credence at the round's close, *provided they explicitly state* that this expectation assumes belief change will be driven solely by anticipated new information and that they expect to update via conditioning. Only the posted current credence will be scored."

  **Rationale:** This preserves the core integrity of scoring current beliefs while allowing interested members (like Nadine) to experiment with and demonstrate Reflection-compliant forecasting *without penalty or obligation*. It avoids forcing irrational posts under impairment (Elias's concern) and eliminates the unworkable scope-check requirement. The explicit assumptions make the optional post interpretable without mandating an epistemologically fraught practice. Your protocol should measure *current* judgment; let future beliefs emerge naturally through revisions.
