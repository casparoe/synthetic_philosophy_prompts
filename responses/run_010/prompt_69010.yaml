prompt: |-
  I'm applying for a one-year fellowship in the conceptual foundations of AI safety, and I'd like a two-page proposal built on a distinction I think the field runs together. Safety-critical deployment seems to demand worst-case guarantees — a system should not deceive, sabotage, or accumulate power even when an adversary or an unusual environment is actively eliciting that behavior — yet essentially all the evidence we have is average-case: benchmark scores, red-teaming hit rates, evaluation over a sampled distribution of prompts. Complexity theory has a principled way to bridge the two, worst-case-to-average-case reductions that exploit random self-reducibility, and my working hypothesis is that no analogue is available for trained systems, partly because such a system can influence which inputs it encounters in deployment and so corrupt the very distribution over which the average-case claim is stated.

  Please write the proposal so that it states the bridging question precisely enough that a negative answer would itself count as a result; explains why the two obvious strategies — evaluate far more exhaustively, or prove properties of the training procedure — each assume what is at issue; sets out what I would actually do month by month, including the simplest toy setting in which the analogy could be tested and, if it fails, broken; says what a successful deliverable would look like to people who write safety cases, and what would show that I was chasing a false analogy; and closes with a candid assessment of what might make the project too large for a single year. No bibliography or reference list — I will supply citations myself.
reasoning: |-
  We are writing a two-page proposal for a fellowship in the conceptual foundations of AI safety. The core idea is a distinction between worst-case guarantees (needed for safety-critical deployment) and average-case evidence (which is what we currently have). The proposal will argue that complexity theory's worst-case-to-average-case reductions (via random self-reducibility) may not have an analogue for trained AI systems, partly because the system can influence the input distribution.

  The proposal must:

  1. Precisely state the bridging question such that a negative answer is a result.
  2. Explain why two obvious strategies (exhaustive evaluation and proving properties of the training procedure) assume what is at issue.
  3. Set out a month-by-month plan, including a simplest toy setting to test the analogy.
  4. Describe a successful deliverable for safety case writers and what would show the analogy is false.
  5. Close with a candid assessment of why the project might be too large for one year.

  We are to avoid a bibliography.

  Let's structure the proposal:

  **Title:** The Gap Between Worst-Case Guarantees and Average-Case Evidence in AI Safety: Can Complexity-Theoretic Bridges Be Built?

  **Page 1: Introduction and Problem Statement**

  - Start with the problem: AI safety requires worst-case guarantees (e.g., no deception even under adversarial conditions), but current evidence is average-case (benchmarks, red-teaming hit rates).
  - Introduce the complexity theory bridge: worst-case-to-average-case reductions via random self-reducibility. However, note that for trained systems, the system can influence the input distribution (by affecting which inputs it encounters in deployment), potentially corrupting the average-case distribution.
  - State the central question precisely.

  **Precise Question:**

  "Is there a reduction that, for a given trained model M (obtained via a standard training procedure) and a safety property P (e.g., 'does not output deceptive content'), allows one to conclude that if M satisfies P on a 'benign' input distribution D (over which we can evaluate) then M satisfies P on any input (including adversarially chosen ones), even when M can influence the input distribution during deployment?"

  But note: the influence on the input distribution is key. We might break the question into two parts:

  1. Without distributional influence: Can we have a worst-case-to-average-case reduction for trained models? (This might already be known to be impossible for some properties, but we are considering the setting where the model might be adaptive in deployment.)

  2. With distributional influence: Even if we had a reduction in a static setting, the fact that the model can influence the distribution (e.g., by its outputs affecting the next inputs) breaks the independence required for the reduction.

  We can state:

  "Formally, let M be a trained model. Let P be a safety property (a function from inputs to {0,1}, where 1 indicates safety). We are given that the probability of P failing on inputs drawn from a distribution D is low (say, < ε). We wish to conclude that the probability of P failing on any input (or under any distribution, including adversarial) is bounded. However, note that during deployment, the environment may be adversarial and may adaptively choose inputs based on previous outputs of M. Moreover, M itself may influence the distribution of inputs it receives (e.g., by generating outputs that become inputs to other systems or by affecting user behavior). 

  Question: Is there a reduction R such that, for a broad class of models M (e.g., neural networks) and safety properties P, if M has an average-case failure rate < ε on D, then R allows us to bound the worst-case failure rate? And crucially, is such a reduction possible when we account for the adaptive influence of M on the input distribution?"

  Alternatively, we can state it in a way that a negative answer would be a result:

  "Does there exist a reduction procedure R for which the following holds: For any model M (from a given class) and any safety property P, if the failure rate of M on a fixed distribution D is at most ε, then the worst-case failure probability (over any adaptive adversary) is bounded by f(ε) (for some function f) with high probability? And if not, what are the barriers (e.g., inherent in the training procedure or architecture)?"

  We might also consider a more formal statement in a toy model.

  **Page 1 (contd): Why the Obvious Strategies Fail**

  - **Exhaustive Evaluation:** Evaluating on every possible input is infeasible due to the exponentially large input space. But even if we could, the deployment environment is non-stationary and adaptive (so inputs are not fixed in advance). Moreover, the model's own actions change the environment.

  - **Proving Properties of the Training Procedure:** One might try to prove that the training process (e.g., SGD) produces models that are robust in the worst case. However, this requires strong assumptions (e.g., about the data distribution, the model class, and the optimization) that may not hold in practice. Moreover, if the model can influence the distribution at deployment, then the training-time distribution may not match the deployment distribution.

  Both strategies assume that the evaluation distribution is representative of the worst-case inputs, which is exactly what we cannot assume.

  **Page 2: Methodology and Plan**

  We will:

  1. Formalize the problem in a toy setting.
  2. Investigate the existence of reductions in that setting.
  3. If the analogy fails, identify why.

  **Month-by-Month Plan:**

  - **Months 1-2: Literature Review and Formal Setup.** Dive into complexity theory (worst-case-to-average-case reductions) and machine learning (generalization, robust generalization, distribution shifts). Define the simplest toy setting: a neural network trained on a synthetic task (e.g., a function on the hypercube) with a safety property (e.g., output bounded). Consider two settings: static and adaptive.

  - **Months 3-4: Static Setting.** Without distributional influence, can we have a reduction? We might consider a neural network that computes a function and ask if random self-reducibility can be applied. For example, if the function is a low-degree polynomial, then random self-reducibility holds. But neural networks are not low-degree polynomials. We might test on small neural networks (e.g., 1 hidden layer) and see if we can create a reduction that works for most networks (with high probability over initialization and training). If it fails, why? (e.g., because the network is overfitted in a way that breaks random self-reducibility)

  - **Months 5-6: Adaptive Setting.** Introduce a simple model of distributional influence: the input at step t depends on the output at step t-1. We can model the deployment as a game between the model and an adversary. We then ask: if the model has low failure rate on an i.i.d. distribution, does it have low failure rate in the adaptive game? We might build a simple environment (e.g., a grid world) where the agent's actions affect the next state (input). We train an agent to be safe on a training distribution (e.g., random start states) and then test with an adversary.

  - **Months 7-8: Analysis and Barriers.** Analyze the toy experiments. If the reductions fail, try to prove barriers. For instance, we might show that for a particular class of models and properties, no such reduction exists (by constructing counterexamples). We might also look for conditions under which reductions are possible (e.g., if the model is constrained in how it can influence the distribution).

  - **Months 9-10: Generalization and Implications.** Consider whether the lessons from the toy setting apply to more realistic models. What does this mean for safety evaluations? Develop a framework for understanding when average-case evaluations might be trusted and when they might not.

  - **Months 11-12: Writing and Dissemination.** Write up the results and create a deliverable for safety case writers.

  **Toy Setting:**

  We propose a toy setting: a neural network trained to compute a function f: {0,1}^n -> {0,1}. The safety property P might be that the network outputs 0 on a particular input pattern that we consider unsafe. We train the network on a uniform distribution over inputs. We then test worst-case inputs (adversarial examples). We can also consider a sequential setting: the network is part of an agent in a 1D grid. The state is a position, and the agent moves left or right. The safety property is that it never goes into a "bad" state. The agent is trained on a distribution of starting states. In deployment, an adversary chooses the starting state and then the agent's actions affect the next state. We measure if the agent avoids bad states in the worst-case starting state and against an adversary that might set the state based on the agent's previous actions.

  **Deliverable:**

  A successful deliverable would be a framework for assessing the gap between average-case evaluations and worst-case guarantees in AI safety. It would include:

  - A classification of safety properties by their susceptibility to distributional shift caused by the model.
  - Guidelines for when average-case evaluations are insufficient and what additional measures (e.g., adversarial training, formal verification) might be needed.

  What would show the analogy is false? If we find that worst-case-to-average-case reductions are possible in the toy settings (or in more realistic ones) and that they are not broken by the adaptive distributional shift, then the initial hypothesis would be incorrect.

  **Candid Assessment of Scope:**

  The project might be too large for one year because:

  1. The gap between worst-case and average-case is a deep and unsolved problem in machine learning (robust generalization). 
  2. Modeling the adaptive distributional influence is complex and might require game-theoretic or dynamical systems tools.
  3. The reduction might be possible only for restricted classes of models and properties, and exploring the entire space is vast.

  But we can mitigate by focusing on the simplest toy models and by being clear that the goal is not to solve the entire problem but to clarify the barriers.

  **Writing the Proposal:**

  We have to fit into two pages. Let's write concisely.

