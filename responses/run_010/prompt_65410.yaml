answer: |-
  Here’s a concise handout for your seminar, designed to dissect “physical causal closure” and its implications for mental causation. It’s structured as a numbered list, uses British English, and highlights key assumptions.

  ---

  **Handout: What “The Physical is Causally Closed” Really Means**  
  *For Mental Causation Seminar, Week 1*

  **1. The Slogan’s Ambiguity**  
  The phrase “the physical is causally closed” is used loosely but entails distinct claims of varying strength. Below, these are ordered from weakest to strongest, with their status and relationship to conservation of energy.

  **2. Claim 1: Methodological Closure (Weakest)**  
     - *Claim*: Science should *seek* physical causes for physical events (a rule for explanation, not metaphysics).  
     - *Truth Status*: Trivially true (as a methodological heuristic).  
     - *Conservation of Energy?* Irrelevant; this is epistemic, not ontological.  
     - *Threat to Mental Causation?* None. Compatible with mental causes if they’re physically explainable.

  **3. Claim 2: Descriptive Completeness**  
     - *Claim*: *Current physics* fully describes all physical events (no gaps in our *models*).  
     - *Truth Status*: Empirical bet (likely false; physics is incomplete, e.g., dark matter).  
     - *Conservation of Energy?* Partial support (energy conservation is a success of current physics), but not decisive.  
     - *Threat?* Weak. Mental causes could operate in gaps of current physics.

  **4. Claim 3: Type-Level Causal Closure**  
     - *Claim*: For any *type* of physical event, there is a physical cause type.  
     - *Truth Status*: Empirical bet (plausible but not proven).  
     - *Conservation of Energy?* Relevant (energy conservation implies physical causes for energy changes), but doesn’t entail closure alone.  
     - *Threat?* Minimal. Mental causes could still token-supplement physical causes (e.g., belief as a non-redundant trigger).

  **5. Claim 4: Token-Level Causal Closure (Sufficiency-Inclusive)**  
     - *Claim*: Every *token* physical event has a *sufficient* physical cause at the time of occurrence.  
     - *Truth Status*: Contentious empirical bet (e.g., quantum indeterminism might challenge it).  
     - *Conservation of Energy?* Inadequate support (conservation doesn’t imply sufficiency; indeterministic systems conserve energy).  
     - *Threat?* Significant but incomplete. **Requires extra premise**: *No Systematic Overdetermination* (physical effects don’t routinely have two independent sufficient causes). If added, mental causes are excluded as *redundant*.  
     - *Smuggled Assumption?* **Yes**: The no-overdetermination premise is often assumed, not argued for. It’s question-begging against dualism.

  **6. Claim 5: Token-Level Closure with Causal Exclusion (Strongest)**  
     - *Claim*: Every token physical event has a sufficient physical cause, *and* no distinct non-physical cause can exist.  
     - *Truth Status*: Not empirical—a metaphysical addendum to Claim 4.  
     - *Conservation of Energy?* Irrelevant (this is a priori).  
     - *Threat?* Directly entails “mental causes nothing” **if** mental is non-physical.  
     - *Smuggled Assumption?* **Yes**: Builds in no-overdetermination and often substance dualism. Only persuasive if physical causes are exhaustive *by definition*.

  **7. What Actually Delivers ‘The Mental Causes Nothing’?**  
     - **Only Claim 4 or 5** can threaten mental causation, but **only with extra premises**:  
       (i) Mental states are non-physical (substance/property dualism),  
       (ii) Physical causes are sufficient (Claim 4),  
       (iii) No systematic overdetermination (rejects “dual causes”).  
     - **Without (iii)**, mental causation remains possible (e.g., as a joint or counterfactual cause).

  **8. Does Causation’s Metaphysics Matter?**  
     - **Sufficient-Cause Production** (e.g., transfer models): Favours exclusion (if physical cause is sufficient, mental cause is otiose).  
     - **Counterfactual/Interventionist Causation** (e.g., Lewis, Woodward):  
       - Mental states can be difference-makers even if physical closure holds (e.g., “If belief were absent, arm wouldn’t rise, *even if* physical cause is sufficient”).  
       - **Physical closure alone doesn’t exclude mental causation here**—it only demands that mental causes *supervene* on physical ones. Compatible with non-reductive physicalism.

  **9. Conclusion**  
  “Causal closure” is rarely a knockdown argument. Its strength depends on:  
     - Whether it includes *sufficiency* and *token-level* claims,  
     - Unpacked assumptions (especially no-overdetermination),  
     - The metaphysics of causation.  
  **Conservation of energy is insufficient** to support robust closure—it ensures physical causes exist but not that they are exclusive or sufficient.

  ---

  **Key to Photocopying:**  
  - Single-page A4 layout recommended.  
  - British English spellings retained (e.g., “causally”, “colour”, “metre”).  
  - Bold text highlights critical premises/assumptions.  
  - Numbered sections facilitate seminar discussion.
