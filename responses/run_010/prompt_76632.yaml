  I need to design a game that forces students into the disagreements. The conversion rates create different needs: some need more tokens for the same output. Maintenance costs simulate disabilities or chronic conditions—constant drains. Expensive tastes add a preference-based inequality, which is philosophically tricky (e.g., should society subsidize expensive preferences?).

  For 22 players, I'll distribute cards: 5 with high conversion costs (disadvantaged), 10 standard, 5 with maintenance costs (vulnerable), and 2 with expensive tastes. This mix ensures variation. The game has three phases: initial distribution, trading rounds, and satisfaction ratings. Trading is structured to prevent market clearing—maybe limit trades to one bundle per round to keep inequalities visible.

  Scoring: each unit of "Well-Being Units" (WBUs) gives points, but conversion rates mean equal tokens don't yield equal WBUs. Satisfaction ratings are private, collected midway. The debrief will map game outcomes to resource equality (token count), welfare (satisfaction scores), and capabilities (WBUs achieved, considering barriers).

  Potential pitfalls: expensive-taste students might be bullied. To prevent this, emphasize no naming names during trading. If it happens, intervene by noting it in debrief as a real-world issue. Market efficiency could mask inequalities—so I'll include maintenance costs that can't be traded away and expensive tastes that are inherent.

  What the game can't capture: the capability approach emphasizes real opportunities, not just outcomes. The game focuses on achieved functionings (WBUs), not the full range of possibilities. I need to clarify this in the debrief, using examples like education access vs. actual learning.

  Timeline: 80 minutes total. Setup (5 min), Rounds 1-3 (30 min), Satisfaction rating (5 min), Rounds 4-5 (15 min), Final scoring (5 min), Debrief (20 min). Materials: tokens, cards, score sheets all on one double-sided handout.

  Debrief structure: start with observations, then map to theories, discuss the expensive taste and maintenance cost cases, and end with capability limitations. This should meet the user's needs while addressing their supervisor's concerns by being tightly structured and learning-focused.
answer: |-
  Here's a complete, runnable game plan designed for your constraints and learning goals, minimizing jargon until the debrief and maximizing experiential learning. It's structured for 80 minutes, uses a single double-sided handout, and targets the specific philosophical tensions.

  **Activity Title:** The Well-Being Exchange

  **Core Learning Goal:** Students experience how identical resource bundles lead to unequal outcomes due to varying conversion factors, challenging simple equality of resources or welfare, and setting the stage for the capability approach.

  **Materials (Per Student):**
  1.  **One Double-Sided Handout:**
      *   **Side 1:** "Player Sheet" (Grid for recording tokens, WBUs, Satisfaction Ratings - see structure below).
      *   **Side 2:** **SECRETLY Assigned "Life Circumstances" Card.** *(Distribute these FACE DOWN as students enter. Instruct them NOT to share their card's contents with anyone until AFTER the final scoring.)*
  2.  **Physical Tokens:** ~200 identical, cheap tokens (e.g., dried beans, buttons, small paperclips, poker chips). **Starting Bundle: 20 tokens per player.**
  3.  **Whiteboard/Projector:** For tracking rounds, displaying market prices (if used), and debrief notes.
  4.  **TA Materials:** Timer, pens, calculator (optional for TA scoring), list of player life circumstances for reference.

  **Life Circumstances Card Distribution (for 22 Players):**
  *   **Standard Converters (10 Players):** "1 Token = 1 Well-Being Unit (WBU). Goal: Maximize WBUs."
  *   **High Cost Converters (5 Players):** "2 Tokens = 1 WBU. Goal: Maximize WBUs." *(Represents inherent disadvantage, e.g., disability requiring aids, inefficient location)*
  *   **Maintenance Cost (5 Players):** "1 Token = 1 WBU. **However, you lose 2 Tokens at the START of EACH Trading Round (after initial distribution) just to 'stay afloat.'** Goal: Maximize WBUs." *(Represents chronic costs - healthcare, essential transportation, debt servicing)*
  *   **Expensive Taste (2 Players):** "**You require Premium WBUs.** 1 Token = 1 *Standard* WBU (worthless to you). **3 Tokens = 1 *Premium* WBU.** Goal: Maximize *Premium* WBUs." *(Represents cultivated expensive preferences)*

  **Game Setup (5 min):**
  1.  Students sit. Distribute **Player Sheet (Side 1)** and **Secret Life Card (Side 2)** face down.
  2.  Distribute **Starting Bundles:** 20 Tokens to each player.
  3.  **Instructions:** "Your goal is to maximize your Well-Being Units (WBUs) by the end of the game. Read your SECRET Life Card carefully. It tells you how to convert tokens into WBUs *for you personally*. **Do not share the details of your card with anyone.** Record your starting tokens (20) on your Player Sheet. The game consists of 5 rounds. In each round, you will have a chance to trade tokens with other players. After Round 3, you will privately report your satisfaction. We will play Rounds 4 & 5, then final scoring."

  **Player Sheet (Side 1) Structure:**
  ```
  Round | Tokens Start | Tokens Gained | Tokens Lost | Tokens End | WBUs Earned | Satisfaction (1-5)
  ------|-------------|--------------|------------|-----------|------------|-------------------
  1     | 20          |              |            |           |            |
  2     |             |              |            |           |            |
  3     |             |              |            |           |            | _______
  4     |             |              |            |           |            |
  5     |             |              |            |           |            |
  Final |             |              |            |           |            | _______
  ```
  *(TA: Emphasize tracking tokens start/end each round and calculating WBUs earned each round based on their card)*

  **Gameplay: Trading Rounds 1-3 (25 min total: 5 min per round + 10 min trading/calculation per 3 rounds)**
  *   **Structure per Round (Approx. 8 min):**
      1.  **Maintenance Cost:** Players with Maintenance Cost cards **lose 2 tokens** (record under "Tokens Lost"). If they go negative, they stay at 0 but can't *earn* WBUs until positive again. *(TA: Circulate, remind quietly if needed)*.
      2.  **Trading (4 min):** Open trading period. Players can trade tokens 1-for-1 *only*. **No bartering for future promises, no group pooling, no IOUs.** Encourage movement. *(Key: This simple rule prevents complex markets and keeps conversion inefficiencies visible)*. Students record gains/losses.
      3.  **WBU Calculation (1 min):** Students calculate how many WBUs they earned *this round* based on their ending tokens and their secret conversion rate. Record on sheet. *(TA: Circulate, answer clarification Qs about conversion)*.
      4.  **Record Start for Next Round:** Ending Tokens become Start for next round.
  *   **End of Round 3:** Ensure everyone has calculated WBUs for Rounds 1-3.

  **Satisfaction Rating (5 min):**
  1.  "Stop trading. Look at your Player Sheet. Consider your total WBUs so far, your token situation, and your overall experience in the game so far. **Privately** rate your current satisfaction on a scale of 1 (Very Dissatisfied) to 5 (Very Satisfied). Write this number ONLY in the Satisfaction column for Round 3. **Do not discuss your rating.**" *(This captures welfare/satisfaction at a midpoint, before potential adaptation or despair sets in more deeply)*.
  2.  TA quickly collects a list of Satisfaction ratings (just the number, not names). Note the average publicly on the board (e.g., "Avg Sat R3: 3.4").

  **Gameplay: Trading Rounds 4-5 (15 min total: 5 min per round + 5 min trading/calculation)**
  *   Repeat the same structure as Rounds 1-3: Maintenance (if applicable), Trading (4 min), WBU Calculation, Record. No satisfaction rating in Rounds 4 or 5.

  **Final Scoring & Reveal (10 min):**
  1.  **Calculate Final WBUs:** Students sum WBUs earned across all 5 rounds. Record in Final WBU column.
  2.  **Final Satisfaction:** "Considering your *entire* game experience and your *final* WBU score, privately rate your overall satisfaction (1-5). Record in Final Satisfaction column." Collect final satisfaction ratings, calculate average.
  3.  **Reveal Life Circumstances:** "Look up from your sheets. Please raise your hand if you had a Standard Converter card." (Count approx 10). "Raise hand if you needed 2 Tokens per WBU?" (Count 5). "Raise hand if you had a Maintenance Cost?" (Count 5). "Raise hand if you required Premium WBUs?" (Count 2). Write these counts/groups on the board. **Do NOT reveal individual identities.**
  4.  **Public Data Collection (TA on Board):**
      *   Ask for **Final Token Counts**: Get 1-2 examples from *each* group (Standard, High Cost, Maintenance, Expensive Taste). Record under group headings.
      *   Ask for **Final WBUs**: Get 1-2 examples from *each* group. Record.
      *   Post the **Average Satisfaction for Round 3** and **Average Final Satisfaction**.

  **Debrief (20 min - THE CRITICAL PART):**
  *   **Step 1: Observations (5 min):** "Look at the data on the board. What immediately jumps out at you? What surprised you?" *Guide towards noticing differences in WBUs despite similar token counts, differences in token counts, differences between groups. Highlight a Maintenance Cost player with low tokens/WBUs, an Expensive Taste player with middling tokens but very low Premium WBUs, a High Cost player with decent tokens but low WBUs. Find a Standard player with high tokens & high WBUs. **Crucially, ask:** "Did anyone find themselves lowering their expectations or satisfaction over time, even if their situation didn't change much?" (Listen for High Cost/Maintenance players). Point out if Avg Satisfaction changed significantly.*
  *   **Step 2: Mapping to Theories (10 min):** Draw three columns on the board now: Resources | Welfare/Satisfaction | Achieved Functionings (WBUs).
      *   **Resources (Tokens):** "If we judged fairness purely by the distribution of tokens at the end, what would we see? Were tokens roughly equal? (Probably somewhat, due to trading). Does this tell the whole story? Remember Player X (High Cost) and Player Y (Maintenance) - same tokens as Player Z (Standard), but wildly different WBUs. Why? *(Emphasize: Resources ignore conversion factors).*
      *   **Welfare/Satisfaction:** "We measured satisfaction twice. What does this tell us? Did satisfaction always track WBUs? Why/why not? Remember Player A (High Cost) who reported R3 satisfaction of 3? Maybe they adapted, lowered expectations. Is it fair if society *only* cares about reported happiness, even if someone is happy with very little because they've given up hope? What about the Expensive Taste player? Their satisfaction might be low *because* of their expensive preference. Should we compensate them for that?" *(Key point: Welfare can be adaptive or expensive, making it a poor sole metric for justice).*
      *   **Achieved Functionings (WBUs):** "This column shows what people *actually achieved* in terms of the game's core 'well-being' (WBUs). It directly reflects the barriers imposed by their Life Card (conversion costs, maintenance, taste requirements). Notice how Player B (Maintenance) had a huge barrier just to stay afloat, crushing their ability to achieve WBUs, regardless of tokens or reported satisfaction. **This 'ability to achieve functionings' is the core of what the Capability Approach focuses on.** It asks: What real opportunities do people have? What can they actually *do and be*? Not just what stuff they have (resources), or how happy they say they are (welfare), but what combinations of valuable 'beings and doings' (like being well-nourished, educated, participating in community) are genuinely within their reach." *(Introduce the terms "Capability Approach" and "Functionings" here).*
  *   **Step 3: Connecting to Primary Goods & Capability (5 min):** "John Rawls talks about 'Primary Goods' – things like rights, liberties, income, wealth, the social bases of self-respect. Think of tokens as representing income/wealth. Our game shows why just equalizing these primary goods (tokens) isn't enough for real equality of opportunity. People need different amounts of primary goods to reach the *same level* of real freedom to achieve functionings (WBUs) because of different conversion factors – their health (High Cost, Maintenance), their social circumstances, even possibly their ends (Expensive Taste). The Capability Approach argues we should focus directly on ensuring people have the substantive freedom (capability) to achieve key functionings relevant to a good life, considering these diverse conversion factors."

  **What Will Go Wrong (and Mitigation):**
  1.  **Expensive Taste Kid Gets Vilified:** Very likely. Someone will grumble about "why should I trade with them when they need 3 tokens?".
      *   *Mitigation:* Emphasize *during instructions*: "Your goal is to maximize *your own* WBUs. You trade if you think it helps *you*." Don't moralize trading. In debrief, DEFEND the point: "This is precisely the philosophical puzzle! Should expensive preferences be compensated? Dworkin says 'no', they are choices. Others argue context matters. The game forces us to confront the disagreement." Ask the class: "Was the Expensive Taste player *responsible* for needing Premium WBUs? Should that matter?"
  2.  **Market Clears Too Much / Boring Auction:** Possible with simple 1-for-1 trading.
      *   *Mitigation:* The **Maintenance Costs** are key. They constantly drain tokens *before* WBU conversion, creating persistent inequality that simple trading can't easily fix. **High Conversion Costs** also create inherent inefficiency. The limited trading time and prohibition on complex deals prevent perfect arbitrage. Point out the *remaining* inequalities in the final data during debrief – they are the evidence the game worked!
  3.  **Confusion Over Conversion/Scoring:** Some students will miscalculate WBUs.
      *   *Mitigation:* Clear Player Sheet grid. Circulate actively during WBU calculation phases. Offer quick, quiet clarification. Emphasize it's per round. Use group examples in debrief to clarify.
  4.  **"It's Not Fair!":** Good! This is the point erupting organically. Channel this energy into the debrief: "Why did it feel unfair? Which metric were *you* using to judge fairness in that moment?"
  5.  **Satisfaction Ratings Don't Show Adaptation:** They might not self-report lowering expectations.
      *   *Mitigation:* In debrief, **ask explicitly**: "Did anyone find themselves thinking, 'Well, I guess this is just my lot, I can't expect much'?" Frame it as a common human response. Cite the Avg Satisfaction numbers if they dipped. The philosophical point stands regardless of individual reporting – adaptive preferences are a well-known critique of welfarism.

  **What the Game CAN'T Reproduce (Requires Lecture/Talk):**
  *   **The Full "Capability Set":** The game focuses on *achieved functionings* (WBUs – what they actually did). The Capability Approach's core innovation is focusing on the *freedom* or *capability* to achieve various *combinations* of functionings (the real *opportunities* available). The game mechanics inherently measure outcomes (WBUs earned), not the full range of possibilities open to the player.
      *   *How to Supply This:* Explicitly state this limitation in the debrief. Explain: "In the game, we measured what you *actually achieved* (WBUs). But the Capability Approach is even more concerned with your genuine *opportunities* – the different combinations of WBUs you *could have chosen* to pursue with your resources and circumstances. For example, someone might choose to have fewer material WBUs but more leisure or community WBUs, if that option was truly open to them. The game simplifies this to one type of WBU. Real capabilities are about having multiple genuine paths open to you." Use a real-world example: "Two people might both achieve 'being educated' (functioning). But one had only one terrible school option (low capability), while the other had many excellent choices (high capability). The game shows the functioning (WBU), but not the full breadth of the capability set behind it."

  **Why This Should Work (and Placate Your Supervisor):**
  1.  **Experiential Learning:** Students don't just hear about adaptation or conversion factors; they *experience* the frustration of high costs, the burden of maintenance, the sting of being judged for an expensive taste, and the temptation to lower expectations.
  2.  **Focused Debate:** The trading rules and life cards create *structured disagreement* that naturally leads into the philosophical distinctions.
  3.  **Data-Driven Debrief:** Using the concrete game data (tokens, WBUs, satisfaction ratings) grounds the abstract theory in shared experience.
  4.  **Efficiency:** Fits the time constraint, uses minimal materials (one handout, cheap tokens), and requires no complex tech.
  5.  **Clear Learning Link:** The debrief explicitly maps game mechanics and outcomes to the three core concepts (Resources, Welfare, Capabilities/Functionings).

  **Final Tip:** Be energetic and clear during instructions. Actively facilitate trading and WBU calculation. During debrief, let student observations drive the discussion, but firmly guide it towards mapping onto the three frameworks. Explicitly name "Capability Approach" and "Functionings" only during the debrief mapping. Good luck! This has the potential to be a truly memorable section.
