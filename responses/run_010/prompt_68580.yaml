answer: |-
  The assay hall smelled of hot wax and cold stone. Mistress Althea ran her thumb over the guild seal, its weight a familiar burden. Below, clerks stamped warrants for grain contracts, coin dies, bridge stress-tolerances—each requiring a chain of assayers’ verification, each link countersigned according to the strict genealogy of the charter. Her own tenure ended at sundown. Two candidates waited in the antechamber: Jerem, methodical but plodding, whose every calculation she could re-trace step by leaden step; and Liren, whose proofs unfolded like origami birds—beautiful, baffling, and beyond her sight to refold. To warrant Liren was impossible. The charter demanded she verify his judgments, yet his brilliance operated in realms her mind couldn’t map. Verifying his work would require eyes sharper than her own, and the charter offered no lens for that.

  She remembered the scandal. Decades ago, Head Assayer Borin, facing a similar dilemma with an ingenious candidate, had stamped a standing warrant: *Whatever my successor certifies, I pre-certify.* Borin retired. For months, trade flowed smooth as oiled gears. Then came the document. Althea, then a junior clerk, had seen it—a single vellum sheet, its text looping in an ornate, self-referential circle: *By the authority vested herein, this warrant is genuine.* Beneath, Borin’s seal glistened beside the new master’s. 

  The forger, never caught, had exploited the standing warrant’s blind faith. To reject the circular warrant meant revoking Borin’s blanket approval—which invalidated *every* warrant issued under the new master. Contracts dissolved. Bridges deemed unsafe mid-crossing. Coin turned suspect. The guild’s credibility shattered like flawed glass. They’d salvaged the system only by annulling Borin’s standing warrant and painstakingly re-verifying each surviving document, one by agonizing one. The charter now forbade standing warrants. The lesson was etched in the ledger’s red ink and the city’s wary memory: trust cannot leapfrog its own verification.

  Liren entered unbidden. He placed a thin dossier on her desk. "My assays on the new silver-copper alloy, Mistress. The mint awaits your warrant." His voice held no arrogance, only the quiet certainty of deep waters.

  Althea unrolled the sheets. Equations cascaded, elegant and alien. Symbols she didn’t recognize danced through proofs whose logic remained opaque. She imagined Liren’s mind—a luminous forge where ore became filigree. He could spot flaws invisible to her, design alloys stronger, contracts fairer, bridges lighter yet more resilient. Choosing him would elevate the guild… if she could warrant him. But to do so, she’d need to trust not his *integrity*—that was never in doubt—but his *judgment*, in territories where her own instruments failed. The charter required her personal verification, not her hope.

  Jerem’s work lay stacked neatly nearby. His assay of the same alloy was thrice as thick, every test redundantly documented, every inference cautious. She could, with time and candle wax, replicate each step. Warranted. Safe. Static.

  Liren watched her struggle. "A standing warrant," he suggested softly. "Temporarily. Until the guild adapts the charter—"

  "No." The word cracked like a seal. Althea pointed to the iron strongbox where Borin’s circular warrant moldered, kept as a relic of folly. "That path ends in smoke. We either verify, or we guess. The charter binds us to the first." The standing warrant was a mirage; it didn’t extend trust, it abandoned the duty to verify. Adopt it, and any document, however absurd, could demand acceptance—especially one that declared itself true by its own authority. The city’s trust in their seals wasn’t magic; it rested on each assayer personally vouching for what they could see and test. To pretend otherwise was to make wax and vellum worthless.

  Sunset approached. The clerks below had fallen silent, awaiting her decision. She saw the future: with Jerem, the guild would plod securely within known lanes. With Liren, it might soar… or plunge into another abyss, because she couldn’t, from her current vantage, discern the difference. Her duty wasn’t to choose the best possible assayer; it was to choose one she could lawfully warrant under the charter. The barrier wasn’t Liren’s flaw, or hers. It was a fact of their world, as immovable as the assay hall’s foundation stones—a system cannot vouch for judgments beyond its capacity to check.

  Althea took up her seal. The wax pooled, blood-red. She stamped Jerem’s warrant. It held no genius, only the heavy, verifiable truth. Outside, the city’s bells tolled the hour, their sound crossing bridges, passing coins, echoing through granaries—all resting, link by verifiable link, on seals that meant what they said, and said only what could be seen.
