  Hmm, their core tension revolves around a self-imposed rule: "invent what she did, but not who she was." But the three problematic inventions expose its flaws. Interesting how each case troubles them differently - the boy at the door feels ethically weightier despite being "permitted" by their rule, while the bribe (technically forbidden) feels less concerning to them. The unspoken relationship falls into a gray area.

  The brother's argument about the dead having no interests seems logically sound but leaves the user unsettled. Their point about obscurity is profound - for famous subjects, fiction is noise against many records; for this woman, their play may become the signal. That's a real ethical burden.

  Breaking it down:
  For the boy-at-door scene: The user's anxiety stems from it becoming "the" remembered moment despite being fictional. Since the diaries confirm refusals happened, this is plausibly authentic. But they could soften it - maybe show her anguish afterward, or have the framing narrator explicitly flag this as representative rather than literal.

  The composite official taking a bribe: This risks harming living relatives' view of their ancestor. Even with disclosure, the dramatic portrayal sticks. Better to invent a wholly fictional official - preserves dramatic function without implicating real families. The user already suspects this solution.

  The companion relationship: Physical intimacy isn't attested but isn't contradicted either. The affection in letters creates space for interpretation. Since they've shown restraint (one offstage moment, never discussed), this seems respectful speculation. The key is avoiding reduction - her identity shouldn't hinge on this.

  The framing device helps but doesn't absolve. Explicitly tagging scenes as invented during transitions (not just at start/end) would reinforce it. The obligation isn't just to audiences but to the woman's legacy - treating her as a full person, not a prop.

  Obscurity heightens responsibility precisely because there's no corrective record. But it's not about owing "more" - rather owing careful stewardship of her memory. The damage isn't to her (she's beyond harm) but to how history remembers her.

  Their rule isn't useless but needs refining: Instead of "what vs who," focus on "core identity." What made her her? Protect that. For the rest, apply a "likelihood + consequence" test: How plausible is the invention? Who might be affected?

  Most importantly: They're wrestling with this precisely because they care deeply. That instinct - not any rule - is their best compass.
answer: |-
  Your questions cut to the bone of historical fiction's ethical core. Let's address them directly, with the rigour you seek, grounded in British English.

  **1. Is your rule the right rule?**
  No, your rule ("invent what she did, but not who she was") is flawed and too porous. It creates false distinctions. Actions *reveal* character; inventing significant actions inevitably shapes "who she was". Refusing a boy at the door *is* an action defining her character. Furthermore, "recorded dispositions" can be vague or absent for crucial moments.

  **Replace it with this specific, actionable principle:**

  > **"Protect the Core Identity & Honour the Absence."**
  >
  > *   **A. Core Identity:** Identify the *irreducible essence* of her character evidenced in the archive (e.g., her resilience, specific compassion, documented principles, known flaws). This core is sacrosanct. *Never* invent thoughts, motives, or actions that violate this core.
  > *   **B. Honour the Absence:** Where the record is silent:
  >     *   Invention is permissible *only* if it is **plausible** (consistent with Core Identity and historical context).
  >     *   It must serve a **narratively essential purpose** that cannot be achieved with documented facts alone.
  >     *   **Weight the Consequences:** Consider the potential impact of the invention – on her memory, on the living, on historical understanding. Heavier consequences demand stricter plausibility and necessity.
  >     *   **Acknowledge the Gap:** The framing device (or other means) should subtly signal where significant invention bridges archival silence, without breaking immersion.

  This rule forces you to define her core *first*, then rigorously test each invention against plausibility, necessity, and consequence *before* drafting.

  **2. What to do about the three inventions (separately):**

  *   **The Boy at the Door:**
      *   **Problem:** Plausible (overcrowding documented) but risks becoming the defining "memory" of her.
      *   **Solution:** **Keep it, but mitigate the risk.**
          *   Show the profound, documented emotional cost *to her* immediately afterward (guilt, anguish, frustration at the system) – drawn from diary tone elsewhere.
          *   Ensure the scene *serves* her Core Identity (e.g., demonstrates her difficult pragmatism *or* the toll of systemic failure on a compassionate person).
          *   Strengthen the framing device's specific mention of representative, inferred scenes like this *during the act*, not just at the start/end.
          *   Answer the history society honestly: "While the diaries record periods of refusal due to overcrowding, this specific scene is a dramatised representation based on that reality, illustrating the impossible choices she faced."

  *   **The Official Accepting a Bribe:**
      *   **Problem:** Attributing a specific, unrecorded criminal act to a composite based partly on a real person with living descendants. High consequence (reputation harm potential), low plausibility (no evidence), weak necessity (villainy can be shown without corruption).
      *   **Solution:** **Change it. Do not invent this action for the composite.**
          *   **Option 1 (Best):** Make the obstructive official a *wholly fictional character*. Retain the dramatic function without tethering corruption to real individuals or their families.
          *   **Option 2:** Show obstruction through *documented or plausibly inferred* bureaucratic malice, incompetence, or ideological opposition present in the records of the real men. His villainy lies in wielding legitimate power unjustly, not criminality.
          *   **Rationale:** This violates "Core Identity" for the real men implied in the composite. The potential harm to living descendants is real and avoidable. The narrative necessity is low – obstruction doesn't require bribery.

  *   **The Physical Relationship with the Companion:**
      *   **Problem:** The record is silent but suggestive (affection, gaps). Core Identity isn't obviously violated or confirmed. Low *direct* consequence (no descendants to object, obscure figure).
      *   **Solution:** **Proceed cautiously, respecting the silence.**
          *   Your approach (once, offstage, undiscussed) is already restrained and plausible.
          *   **Crucially:** Ensure this *does not become her defining characteristic*. It must be one facet of a deep, complex bond primarily shown through documented cooperation, affection, and shared struggle.
          *   **Test it:** Does this invention *honour* the depth of feeling in the letters? Or does it risk reducing their relationship to a physical act? If the latter, omit it. If it deepens the audience's understanding of their profound connection *within* the plausible realm suggested by the archive, it can stay. Avoid any implication that the "gaps" *must* mean physical intimacy.

  **3. Does admitting fabrication from the stage discharge the obligation?**

  No, it does not *discharge* the obligation, but it *mitigates* it significantly. It shifts the obligation towards intellectual honesty with the audience. However, as you suspect:

  *   Audiences *will* remember the powerful dramatic moments (the boy) more vividly than the framing disclaimer.
  *   It risks feeling like absolution ("I told you it was fake") rather than genuine engagement with the ethical tension.
  *   It speaks more to *your* process than *her* reality.

  **What comes closer to discharging the obligation:**

  *   **Integrated Honesty:** Weave indications of speculation/reconstruction *into* the play's fabric subtly (e.g., a diary entry voiceover introducing a scene: "*What happened next isn't written, but knowing her...*").
  *   **Specificity in Framing:** Don't just say "some scenes are made up". When introducing Acts or key scenes in your narration, be *specific*: "The next scene imagines the kind of heartbreaking refusal her diaries hint at..." or "The character of Mr X combines traits of several officials; the bribe, however, is my invention to show systemic corruption."
  *   **Programme Notes:** Provide clear, accessible notes distinguishing documented events, inferred events, and pure invention, referencing the archive. List the composite sources for the official, clarifying the bribe is fictional.
  *   **Respect in Portrayal:** The ultimate discharge comes from portraying her Core Identity with fidelity and respect, even within invented scenarios.

  **4. Is your brother right that nothing is owed to her?**

  **No, your brother is mistaken on the core ethical point, though his premises are sound.** While a dead person *cannot* experience embarrassment, hurt, or knowledge, this does not end the ethical consideration. What is owed is not *to her as a sentient being* but **to her memory, her legacy, and the historical record.**

  *   **What is being damaged:** The accurate representation of her life, character, and contribution. Her "truth" as best it can be understood.
  *   **Who is damaged?**
      *   **Her Memory:** She existed. She deserves to be remembered as *herself*, not a fictional construct, as far as possible.
      *   **The Historical Record:** Especially for obscure figures, fiction *becomes* the record. Distortion pollutes historical understanding.
      *   **The Audience:** They are owed honesty about what is real and what is artifice when presented with a "true story".
      *   **The Principle:** Treating any real person, however obscure, as merely raw material for our art without ethical constraint is disrespectful to human dignity.
  *   **The Obligation Survives:** Yes. The obligation stems from the act of *choosing to represent a real person*. It's an obligation of *representation*, tied to the potential impact on *how she is remembered*, not contingent on her sentience now or the existence of objecting descendants. It's about fidelity to the past.

  **5. Does obscurity change the analysis?**

  **Yes, significantly. Obscurity increases the ethical burden, not lessens it.**

  *   **Less Record to Distort:** Precisely *because* there are fewer sources, each interpretive act carries more weight. Your play *will* likely become the primary source for many. Distortion here isn't one voice among many; it *is* the voice.
  *   **Owe More or Less?** You owe **more rigorous fidelity to the *core essence* revealed by the existing record** and **more transparent signalling of invention**. The scarcity of information demands *greater caution* when filling gaps – invention must be tightly bound to plausible inference from the known Core Identity and context. You owe a greater duty to ensure your portrayal doesn't *replace* the fragile historical reality with a dominant fiction.
  *   **The Vulnerability:** The obscure are vulnerable to misrepresentation precisely because they cannot speak back and have no defenders. This vulnerability demands *more* ethical care, not less. Your instinct that obscurity makes it *worse* is correct.

  **In Summary:**

  1.  **Ditch your rule.** Adopt **"Protect the Core Identity & Honour the Absence"** with its tests of plausibility, necessity, and consequence.
  2.  **Specific Actions:**
      *   **Boy:** Keep, but show documented emotional cost & strengthen specific framing.
      *   **Bribe:** **Remove.** Make the official fictional or show obstruction without criminality.
      *   **Relationship:** Can stay if handled with extreme restraint and plausibility, integrated as one facet of a deeper bond, never defining.
  3.  **Stage Admission:** Mitigates but doesn't discharge. Integrate honesty subtly, be specific in framing/programme notes, and prioritise respectful portrayal.
  4.  **Owed to Her:** Yes – fidelity to her memory, legacy, and historical truth, regardless of her sentience or descendants.
  5.  **Obscurity:** Increases the burden. Demands stricter adherence to core identity, greater caution in invention, and clearer signalling of artifice.

  Your framing isn't mistaken, but it started from a rule that proved inadequate. The better framing is **Stewardship of a Legacy.** You are the steward of this woman's memory. Your primary duty is to protect the truth of who she demonstrably was (her Core Identity) while navigating the necessary inventions of drama with transparency, rigour, and profound respect for the weight of representing a real, vulnerable life. Your profound unease is your ethical compass – listen to it. The rule proposed gives you concrete tools to follow it at your desk. Good luck with the play.
