  ### Metaphilosophy Seminar: Implicit Commitments Sorting Quiz  
  **Instructions:** Respond to each scenario by selecting the option that best reflects your judgment. There are no right or wrong answers. Choose the response that feels most natural based on your philosophical habits.  

  ---

  #### Quiz Items  
  1. **Scenario:** Over the course of a century, the number of live positions on a central philosophical question shrinks from twenty to six. No consensus emerges on any of the six, but all agree the other fourteen are untenable. What does this development most strongly indicate?  
     - **A.** Progress by narrowing possibilities: we’ve ruled out many errors and clarified the viable options.  
     - **B.** Progress by enriching dialogue: we now grasp the question’s nuances and why certain positions fail.  
     - **C.** Progress by generating reusable resources: arguments against the fourteen provide tools for other debates.  

  2. **Scenario:** A student wishes to use a 60-year-old journal article (which refuted a three-part analysis of a concept) as an unqualified premise in her thesis. Her supervisor permits this but requires her to re-argue the point if challenged. What does this arrangement most strongly suggest?  
     - **A.** The field has progressed enough that such results are background knowledge, though rare challenges require formalities.  
     - **B.** Progress is inconsistent: the result holds in some circles but not others, necessitating caution.  
     - **C.** The field hasn’t truly progressed: even decades later, core arguments remain unsettled and must be constantly revisited.  

  3. **Scenario:** In one academic field, first-year students focus on work from the past decade, treating classics as historical artifacts. In another, students engage classics as live contributions, while new work is read for how it recontextualizes them. What does this contrast reveal?  
     - **A.** The first field sees progress as superseding old ideas; the second sees it as refining tools for enduring questions.  
     - **B.** The first field progresses by resolving debates, making classics obsolete; the second hasn’t settled its questions.  
     - **C.** The first field progresses by innovating beyond tradition; the second progresses by deepening engagement with foundations.  

  4. **Scenario:** Anonymous surveys in a discipline show near-unanimous agreement on some questions and 50/50 splits on others. Publications concentrate heavily on split questions. What pattern best signals the discipline is advancing?  
     - **A.** Progress is patchy: settled questions are archived, while active debate on splits drives partial gains.  
     - **B.** Progress is robust: resolved questions are set aside, and splits represent the frontier of collective inquiry.  
     - **C.** No real progress occurs: persistent splits indicate stagnation on fundamental issues.  

  5. **Scenario:** A centuries-old question is abandoned—not answered, but displaced by a new vocabulary that reframes the issue. How should we view the original question?  
     - **A.** Neither resolved nor obsolete: the new framework deepens understanding but leaves the question intact.  
     - **B.** Obsolete: the new vocabulary provides superior tools, making the question unnecessary.  
     - **C.** Resolved: the new approach correctly addresses the underlying concerns.  

  6. **Scenario:** A philosopher crafts a novel, rigorous argument for a centuries-old position. It garners praise but convinces no new adherents. What does this suggest?  
     - **A.** Progress is uneven: arguments shift views in some domains but not in entrenched debates.  
     - **B.** Progress is ongoing: even without conversions, such work elevates clarity and rigor.  
     - **C.** No progress occurs: if top-tier arguments don’t persuade, the field is structurally gridlocked.  

  7. **Scenario:** A distinction invented to solve Problem X becomes indispensable in three unrelated areas. Problem X is now deemed unsolvable. What does this imply about the original work?  
     - **A.** It progressed philosophy by creating a versatile tool, despite X’s insolubility.  
     - **B.** It failed: without solving X, it contributed nothing of core value.  
     - **C.** It progressed philosophy by illuminating X’s complexities, even without resolution.  

  8. **Scenario:** A book dissolves a classic problem by rejecting its presuppositions. A decade later, the problem remains debated, but with new tools and arguments. What does this outcome indicate?  
     - **A.** No progress: the problem persists despite dissolution attempts.  
     - **B.** Progress: the dissolution introduced tools that advanced the discourse.  
     - **C.** Uneven progress: some scholars moved on, while others repurposed the new tools for ongoing debate.  

  9. **Scenario:** Two scholars discuss an unresolved debate. One says, "We see precisely where we disagree and what hinges on it." What progress has occurred?  
     - **A.** Tooling progress: the analysis creates a reusable map of the dispute.  
     - **B.** Settling progress: clarifying disagreements edges us toward resolution.  
     - **C.** Deepening progress: we now grasp the debate’s structure and implications.  

  10. **Scenario:** A specialized research group resolves niche puzzles with a technical framework. The framework is ignored by the broader discipline. What does this suggest?  
      - **A.** Progress is piecemeal: advances occur in pockets but lack mechanisms for integration.  
      - **B.** No progress: if breakthroughs are ignored, structural barriers prevent advancement.  
      - **C.** Progress is robust: specialized gains contribute silently to the field’s foundation.  

  ---

  #### Scoring  
  **Step 1:** Tally selections for Items 1, 3, 5, 7, 9 (Criterion Axis):  
  - **A** = Settling (discipline advances by ruling out errors/getting claims right).  
  - **B** = Deepening (discipline advances by making the subject intelligible).  
  - **C** = Tooling (discipline advances by producing reusable instruments).  
  *Tiebreak*: Highest count wins. If tied, prefer Settling > Deepening > Tooling.  

  **Step 2:** Tally selections for Items 2, 4, 6, 8, 10 (Status Axis):  
  - **A** = On the whole (criterion is met robustly across the discipline).  
  - **B** = Unevenly (criterion is met only in some areas/generations).  
  - **C** = No, structural (criterion is not met due to inherent features).  
  *Tiebreak*: Highest count wins. If tied, prefer On the whole > Unevenly > No, structural.  

  **Step 3:** Locate your position on the grid below using your criterion (rows) and status (columns).  

  |                     | **On the whole**                               | **Unevenly**                                      | **No, structural**                                |  
  |---------------------|-----------------------------------------------|--------------------------------------------------|--------------------------------------------------|  
  | **Settling**        | **Confident Resolutionism**                   | **Local Resolutionism**                          | **Pessimistic Resolutionism**                    |  
  |                     | Progress = resolving questions. Overall, philosophy succeeds at this. | Progress = resolving questions, but only in tractable subfields. | Progress = resolving questions, but structural flaws (e.g., irreducible disagreement) prevent it. |  
  |                     | *Awkward: Must explain persistent controversies (e.g., free will) as temporary.* | *Awkward: Must justify why some domains resist resolution without abandoning the criterion.* | *Awkward: Commitment to an aim philosophy structurally cannot achieve.* |  
  | **Deepening**       | **Systematic Insightism**                     | **Fragmented Insightism**                        | **Barren Insightism**                            |  
  |                     | Progress = deepening understanding. Overall, philosophy achieves richer intelligibility. | Progress = deepening understanding, but only in fertile areas/times. | Progress = deepening understanding, but structural factors (e.g., conceptual opacity) block it. |  
  |                     | *Awkward: Must reconcile with stagnant/regressive periods.* | *Awkward: Must explain why some questions resist depth without appealing to "unsolvability."* | *Awkward: Pursuing an impossible goal while valuing coherence.* |  
  | **Tooling**         | **Optimistic Instrumentalism**                | **Niche Instrumentalism**                        | **Stalled Instrumentalism**                      |  
  |                     | Progress = producing tools. Overall, philosophy generates widely adopted instruments. | Progress = producing tools, but uptake is spotty across subfields. | Progress = producing tools, but structural issues (e.g., disciplinary silos) prevent uptake. |  
  |                     | *Awkward: Must value tool utility over truth/consensus.* | *Awkward: Cannot attribute uneven uptake to tool quality without circularity.* | *Awkward: Creating tools doomed to neglect by the discipline’s design.* |  

  **Key to Grid:**  
  - **Recognizable Views (Stable):** Confident/Local Resolutionism, Systematic/Fragmented Insightism, Optimistic/Niche Instrumentalism. Commonly held; criterion and status cohere (e.g., "Philosophy solves some problems locally").  
  - **Unstable:** Pessimistic Resolutionism, Barren Insightism, Stalled Instrumentalism. The criterion and status conflict: if progress *by your standard* is structurally impossible, pursuing it is futile.  
  - **Empty but Coherent:** None. All non-unstable cells map to established positions.  

  ---

  #### Diagnostics  
  1. **Ambiguous Pairs:** This quiz may not reliably distinguish:  
     - *Confident Resolutionism vs. Optimistic Instrumentalism* (e.g., both see broad progress). Add an 11th item: *"When a distinction becomes standard, is it primarily because it settles disputes (A), reveals connections (B), or offers utility (C)?"*  
     - *Fragmented Insightism vs. Niche Instrumentalism* (e.g., both emphasize local gains). Add an 11th item: *"If a niche debate produces elegant models unused elsewhere, does it advance philosophy by clarifying its subject (A) or by creating portable tools (B)?"*  

  2. **Tie on Criterion Axis (e.g., 2 Settling, 2 Deepening, 1 Tooling):** You likely lack a unified view of progress. Your habits are context-dependent—e.g., you may seek resolution in ethics but tools in metaphysics. Reflect on why.  

  3. **Likely Overrepresented Among First-Year Graduates:** Confident Resolutionism. New students often enter with a "problem-solving" mindset, expecting philosophy to converge on answers like sciences.  

