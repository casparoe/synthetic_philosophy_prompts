prompt: |-
  I am about to circulate a draft platform statement on electoral reform to a working group, and before other people start pulling at it I would like a consistency audit of the position it commits me to. The statement defends three reforms jointly — extending the franchise to sixteen-year-olds, extending it to long-term resident non-citizens, and making voting compulsory — on the ground that they stand or fall together. These are my commitments:

  1. A single principle fixes the demos, and only one: anyone subject to the coercive law of a polity has a claim to a say in making that law. Nationality, allegiance, and shared cultural membership are not independent grounds of enfranchisement; at most they are proxies for subjection, and unreliable ones.

  2. Competence is not a legitimate condition of the franchise. The argument I rely on is the familiar anti-epistocrat one: there is no neutral specification of the political knowledge that would be relevant, every competence test actually administered has functioned as a device for excluding the already disadvantaged, and the claimed epistemic gains of a restricted electorate are not demonstrable.

  3. It follows that the voting age should be sixteen, in every election including constitutional referendums. I draw the line at sixteen rather than lower because that is roughly when a person has entered the bundle of legal and economic relations that subjection consists in: liable to tax on earnings, triable as an adult in serious cases, able to work, able to leave school at the end of that year. I want to be clear that I do not take this to be a competence claim and I resist its being read as one; it is a claim about which legal relations a person stands in, which is exactly what (1) is about.

  4. It follows likewise that long-term resident non-citizens should vote in national elections. They are subject to the law, and exit is not available to them at tolerable cost.

  5. Voting should be compulsory, enforced by a modest fixed fine and nothing more. The obligation, however, should attach only to citizens aged eighteen and over. My reason for compulsion is that voluntary turnout is skewed by income and education, and that an electorate which systematically over-represents the advantaged does not treat those subject to it as equals. But sixteen- and seventeen-year-olds would hold the vote without the duty, because a fine levied on a dependent minor is in practice a fine on their household; and long-term resident non-citizens would hold the vote without the duty, because legally obliging someone to participate in a polity that retains the power to deport them strikes me as indefensible.

  6. My justification of democracy is procedural rather than instrumental. Legitimacy derives from the fairness of the process that produces a decision, not from that process's tendency to produce correct or good decisions. I do not think I owe anyone a demonstration that a wider or more evenly distributed electorate chooses better, and I would prefer not to rest anything on such a demonstration.

  7. There is no separate right not to vote. I do not think a liberty-of-conscience interest in abstention can outweigh the interest each person has in an electorate that reflects the composition of the population subject to it. I nonetheless want a formally counted none-of-the-above line on the ballot, since under compulsion that is the only way a voter's dissent is distinguishable from indifference or from an inability to choose.

  8. A verdict on a case. Suppose a jurisdiction adopted the whole package and its first election produced turnout of 91 per cent among the obliged citizens, 34 per cent among the newly enfranchised sixteen- and seventeen-year-olds, and 29 per cent among resident non-citizens; and suppose a careful post-election study found the composition and agenda of the resulting legislature statistically indistinguishable from those produced under the previous voluntary, citizens-only, eighteen-plus regime. I think this outcome counts as a success for the reform package and that no adjustment is called for.

  What I want is an audit rather than a survey of the field. Identify which of these commitments genuinely pull against one another and which only appear to, and say so explicitly in both directions — I would rather not have merely apparent problems flagged alongside real ones. For the genuine tensions, rank them by severity instead of presenting them as a list of equal complaints, name the numbered commitments involved in each, and state the smallest revision that would remove it together with what that revision would cost me. I have no prior about which of (1) through (8) I would sacrifice, so please do not assume I am attached to any of them; equally, do not simply recommend abandoning the package. Where a tension can only be closed by an empirical claim, identify which claim is doing the work and whether the rest of my position entitles me to it. Finally, tell me whether some single revision repairs more than one of the problems at once, and what would be lost by making it.
reasoning: |-
  Okay, the user wants a consistency audit for their electoral reform platform. Let me start by understanding their key commitments. They have eight points, all centered around three main reforms: voting at 16, non-citizen voting, and compulsory voting. The core principle is that subjection to coercive laws entitles one to a vote, regardless of nationality or competence. 

  First, I need to check if there are internal contradictions. The main tension seems to be between compulsory voting exemptions and the principle of subjection. Why are minors and non-citizens exempt from compulsion? The user argues fines on minors affect households, and forcing non-citizens to vote when they can be deported is indefensible. But under commitment 1, subjection alone grants voting rights. So why not apply compulsion equally? That’s a conflict.

  Then, the procedural justification (commitment 6) might clash with the exemptions. If legitimacy comes from fair representation, but certain groups vote at lower rates, does that undermine fairness? The user’s example in point 8 shows low youth and non-citizen turnout. If these groups are underrepresented, does that violate the equality principle from commitment 5?

  Also, commitment 7 states no right not to vote, but exemptions create de facto opt-outs. Minors and non-citizens can abstain without penalty. This might contradict the idea that abstention isn’t a right, since these groups have that liberty while others don’t.

  Now, ranking the tensions: The compulsion exemption is the most severe because it directly challenges the subjection principle. Fixing it would require removing exemptions, but that has costs. For minors, fining households could be unfair. For non-citizens, compulsion amidst deportation risk is coercive. 

  The least severe tension is between procedural legitimacy and low turnout. The user accepts any outcome as long as the process is fair. But if low turnout in exempt groups persists, it might indicate a representation gap. However, since the user prioritizes process over outcomes, this tension is manageable without revision.

  A middle-rank issue is the inconsistency in how subjection defines inclusion but not obligations. Applying compulsion universally would resolve this but create practical and ethical problems. Alternatively, decoupling voting rights from compulsion might work, but that weakens the argument that skewed turnout violates equality.

  Single revision impact: Removing exemptions solves the main tension but introduces fairness issues. Decoupling rights from compulsion avoids those issues but might require conceding that voluntary turnout can be equitable, which conflicts with commitment 5.

  The user needs to decide if principle consistency outweighs practical concerns. If they keep exemptions, they should adjust commitment 1 to include practical limitations on obligations. Or, they could argue that compulsion is a separate civic duty not tied to subjection, though that might dilute their procedural stance.
answer: |-
  Here is a consistency audit of your platform statement, identifying genuine tensions, ranking them by severity, proposing minimal revisions, and assessing costs. The analysis focuses solely on internal logical coherence, not external objections or political feasibility.

  **Severity Ranking & Analysis:**

  1.  **Severe Tension: Compulsion Exemptions vs. Core Subjection Principle (Commitments 1, 4, 5)**
      *   **Conflict:** Commitment 1 establishes *subject to coercive law* as the *sole* principle defining the demos (voting rights). Commitment 4 correctly extends this to non-citizens based on subjection. Commitment 5, however, *exempts* both minors (16-17) and non-citizens from the *obligation* to vote (compulsion), citing practical/political reasons (fine on household, deportation threat). This creates a fundamental inconsistency: **If subjection grants the *right* to vote (as the *only* justification), why doesn't subjection also impose the *duty* to vote?** The reasons given (practical enforcement difficulty, normative discomfort with coercing non-citizens) are external to the stated foundational principle. Exemptions imply that subjection is necessary but *not sufficient* for the full bundle of voting rights/duties, or that other principles (pragmatism, avoiding specific injustices) override the core principle when it comes to obligations.
      *   **Minimal Revision:** Apply compulsion universally to all enfranchised based on subjection (16+ citizens *and* eligible non-citizens).
      *   **Cost:**
          *   **Practical:** Enforcing fines on minors/non-citizens *is* problematic (household burden, potential for deportation to be used coercively regarding fines).
          *   **Normative:** Forcing non-citizens to vote under threat of deportation *does* seem coercive and arguably undermines the claim of equal standing derived from subjection alone. It introduces an element of compelled participation that clashes with the autonomy implied by the right.
          *   **Coherence Cost:** Preserves the singular principle (1) consistently for both rights and duties. Removes the ad-hoc exemption.

  2.  **Moderate Tension: Procedural Legitimacy & Low Turnout in Exempt Groups (Commitments 5, 6, 8)**
      *   **Conflict:** Commitment 5 justifies compulsion *primarily* to correct skewed turnout and ensure the electorate reflects the subject population for procedural fairness (Commitment 6). However, you *exempt* minors and non-citizens from compulsion. The example in Commitment 8 shows very low turnout in these groups (34%, 29%). **If procedural legitimacy depends on the electorate reflecting the subject population, and significant enfranchised groups participate at low rates by design (due to exemption), doesn't this reintroduce a skew, potentially undermining the very procedural fairness you seek?** The low turnout of these groups means their perspectives/interests are *still* systematically underrepresented compared to their numbers in the subject population, even after reform. Commitment 8 accepts this outcome as a success, which seems inconsistent with the *reason* given for compulsion in Commitment 5.
      *   **Minimal Revision:** Recalibrate the justification in Commitment 5. Emphasize that compulsion is *one tool* applied *to citizens over 18* to correct *their specific* historical skew, while acknowledging that achieving perfect reflection of *all* subject persons might involve other mechanisms (like the exemptions) and that the *enfranchisement itself* is the primary guarantee of procedural fairness for minors/non-citizens. Downplay the "reflects composition" argument as the *sole* reason for compulsion, or qualify it as applying specifically to the group subject to compulsion.
      *   **Cost:**
          *   **Rhetorical:** Weakens the punch of the "skewed electorate = inequality" argument by accepting inherent skews in non-compelled groups. Makes the compulsion argument appear more targeted (correcting citizen skew) than principled (correcting subject-population skew).
          *   **Potential Inconsistency:** Leaves a gap between the ideal (electorate = subject population) and the reality you design (low turnout allowed for key groups). Requires leaning more heavily on Commitment 6's pure proceduralism: legitimacy comes from the *opportunity* to participate fairly extended to all subjects, not the *actual* composition of participants.
      *   **Empirical Claim:** The success in Commitment 8 relies on the empirical claim that low turnout *within enfranchised exempt groups* does not, in practice, lead to outcomes statistically distinguishable (in composition/agenda) from previous regimes *or* that would be meaningfully different under full compulsion for those groups. Your position (Commitment 6) does *not* entitle you to this claim; it's an empirical assertion about consequences, which your proceduralism deliberately avoids relying on (Commitment 6). You *must* accept this outcome on purely procedural grounds (the *right* was extended fairly).

  3.  **Minor Tension: Exemption as De Facto Right Not to Vote (Commitments 5, 7)**
      *   **Conflict:** Commitment 7 explicitly denies a "right not to vote." However, Commitment 5 *creates a de facto right not to vote* for minors and non-citizens by exempting them from compulsion. While they *can* vote, they face no penalty for abstaining, unlike compelled citizens. **This creates a privileged category of voter who *does* possess a liberty interest in abstention that outweighs the interest in their participation for a representative electorate (contra Commitment 7), based solely on their status (minor/non-citizen) rather than conscience.**
      *   **Minimal Revision:** Explicitly state in Commitment 7 that the denial of a "right not to vote" applies *only to those subject to the compulsion regime* (citizens 18+). Acknowledge that exemptions create a different status for others.
      *   **Cost:** Concedes that the "no right not to vote" principle is not absolute and is contingent on the compulsion mechanism applying to a specific group. Weakens the universality of the moral claim in Commitment 7.

  **Apparent Tensions (Not Genuine):**

  1.  **16-Year-Old Threshold vs. Anti-Competence Stance (Commitments 2, 3):** Your justification for 16 is explicitly *not* competence-based but *subject-based* (legal/economic relations). The threshold is defined by the *onset of the relevant subjection*, not a judgment of competence. This is consistent. The tension is purely perceptual, not logical.
  2.  **Compulsion vs. Liberty (General):** Your position acknowledges this tension (Commitment 7) and resolves it by arguing the collective interest in a representative electorate outweighs the individual liberty interest in abstention *for those subject to compulsion*. This is a coherent normative stance, not an internal inconsistency.
  3.  **Proceduralism & Outcome Indifference (Commitments 6, 8):** Commitment 6 explicitly divorces legitimacy from outcomes. Commitment 8's acceptance of unchanged outcomes is perfectly consistent with this. You are not relying on better outcomes for legitimacy, so unchanged outcomes don't undermine your justification for the reforms.

  **Single Revision Impact:**

  *   **Removing Exemptions (Revision for Tension 1)** would *also* resolve Tension 2 (by eliminating low-turnout exempt groups) and Tension 3 (by applying compulsion universally, eliminating the de facto right). **Cost:** As outlined under Tension 1 – significant practical and normative problems regarding minors/non-citizens, potentially undermining the perceived fairness of the system and the core claim of equal standing based solely on subjection.
  *   **Reconciling via Status (Revision for Tension 3 - Limiting "No Right" Claim)** doesn't resolve the more severe Tensions 1 or 2.
  *   **Recalibrating Compulsion Justification (Revision for Tension 2)** doesn't resolve Tension 1 (core principle inconsistency) or Tension 3 (de facto right).

  **Conclusion:**

  The **most severe and genuine tension** lies at the heart of your package: **exempting enfranchised minors and non-citizens from compulsion contradicts the foundational principle that subjection to law alone defines political membership (rights *and* duties).** (Tension 1).

  Addressing this requires a consequential choice:

  1.  **Apply Compulsion Universally:** Maximizes internal consistency on the subjection principle but introduces severe practical/normative costs regarding minors and non-citizens (burdening households, coercive potential).
  2.  **Modify the Foundational Principle:** Acknowledge that while subjection defines the *right* to vote, the *duty* to vote (compulsion) applies only to those with full, secure membership (citizens 18+). This sacrifices the purity and singularity of Commitment 1, requiring an additional principle (like "full membership" or "non-deportability") to justify the compulsion duty. **This is likely the minimal viable revision:** Amend Commitment 1 to state that subjection defines the *right* to a say, while the *duty* to exercise that right (under compulsion) applies only to those with permanent, secure status (citizens 18+). Clarify Commitment 5 accordingly.
      *   **Cost:** Weakens the elegance and radical simplicity of the singular subjection principle. Introduces a distinction between "right-holders" and "duty-bearers" that needs justification beyond pure subjection (e.g., stability, non-vulnerability to deportation). Potentially opens the door for other distinctions.

  The other tensions (Tensions 2 & 3) are secondary consequences of this primary tension and your chosen resolution to it. Resolving Tension 1 via option 2 would necessitate corresponding adjustments to Commitments 5 and 7 to maintain coherence, as outlined in their respective minimal revisions. Commitment 8 remains valid as a statement of proceduralist indifference to outcomes.
