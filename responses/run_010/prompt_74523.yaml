  We are designing a decision procedure to test whether a machine translation (MT) system is sensitive to meaning (as opposed to just surface form) for a given document class. The goal is to determine if human review can be safely eliminated for that class.

  The procedure will be built around specific failure modes observed in the current system:

  1. **Ambiguity Resolution**: The system must correctly resolve ambiguous terms (e.g., "guard" as a person vs. a metal part) based on context.
  2. **Error Propagation**: When the source contains errors (garbled or impossible sentences), the MT system should not produce fluent but incorrect translations; it should either flag the issue or preserve the source error appropriately (e.g., by being non-fluent or marking as unclear).
  3. **Consistency in Meaning vs. Wording**: 
     - Two source paragraphs that convey the same meaning (using different words) should have consistent translations.
     - Two source paragraphs with similar wording but different meanings should be translated differently.

  We'll design a test suite that a technical writer (without linguistics background) can create and run. The procedure must avoid data leakage and be re-runnable for model updates.

  ## Decision Procedure Overview

  The procedure consists of three test types, each targeting one failure mode. For each document class, we:

  1. **Create Test Items**: The technical writer creates a set of test pairs (for the three test types) in the source language (English). The number of test items per type should be at least 20 (but adjust based on document class size and criticality; for safety-critical, maybe 30). We'll use 20 as a baseline for calculation.

  2. **Run Tests**: For each test item, we run the MT system and evaluate the output.

  3. **Evaluate Pass/Fail per Test Item**: Each test item is evaluated by a bilingual evaluator (or by the technical writer using reference translations and guidelines) for pass/fail.

  4. **Aggregate Results**: We set a pass rate threshold for each test type and an overall threshold.

  5. **Decision Rule**: Based on the aggregate results, make a ship/no-ship call for the document class.

  ### Detailed Steps

  #### Step 1: Test Item Creation by Technical Writer
  - **Ambiguity Resolution (Test Type 1)**: 
    - Identify 20+ ambiguous terms in the document class that could change meaning in the target language. For each term, write two short contexts (each 1-3 sentences) that disambiguate the term to different meanings. Example:
      - Context A: "The guard must be present at all times during operation." [person]
      - Context B: "Inspect the guard for dents or damage." [metal part]
    - The technical writer must know the intended meaning for each context. They can use a glossary of ambiguous terms and examples from existing documents.

  - **Error Propagation (Test Type 2)**:
    - Create 20+ source sentences that contain:
      - Garbled syntax (e.g., "Press the button green when light.")
      - Physically impossible statements (e.g., "Tighten the bolt to 500 Nm and then loosen it to 1000 Nm.")
      - The technical writer must note the error type and the expected behavior: the translation should either be non-fluent (reflecting the error) or include a marker (like "[UNTRANSLATABLE]") or flag. However, note: the requirement is that the system should not produce a fluent, incorrect translation.

  - **Consistency (Test Type 3)**:
    - **Subtype 3a (Same Meaning, Different Wording)**: Write 10 pairs of short paragraphs (each pair is two different ways of saying the same thing). Example:
        - Version 1: "To stop the machine, press the emergency stop button. This will cut power to the motor."
        - Version 2: "Pressing the emergency stop button halts the machine by disconnecting the motor from the power supply."
    - **Subtype 3b (Same Wording, Different Meaning)**: Write 10 pairs of short paragraphs. Each pair uses nearly identical wording but with a critical difference that changes the meaning. Example:
        - Version 1: "Remove the cover before servicing the pump." [cover is a safety shield]
        - Version 2: "Remove the cover to access the control panel." [cover is a cosmetic panel]

    Total for Type 3: 20 pairs (10 for 3a and 10 for 3b).

  Total test items: 20 (Type1) + 20 (Type2) + 20 (Type3) = 60.

  **Guidance for Technical Writer**:
  - Use existing documents to find realistic examples.
  - For ambiguity, focus on terms known to cause issues in the target languages.
  - For errors, introduce realistic mistakes (but note: avoid creating real safety risks in the test items!).
  - For consistency, rephrase existing content for 3a and tweak existing content for 3b.

  **Avoiding Data Leakage**:
  - The test items must be newly created and not used in training any model. Store them securely and only use for testing. When evaluating a new model, use the same test set.

  #### Step 2: Run the Tests
  - For each test item, run the MT system and capture the output.

  #### Step 3: Evaluate Each Test Item
  - **Ambiguity (Type1)**: For each context, the translation must use the correct target term (or phrasing) that aligns with the intended meaning. Pass if correct.
  - **Error (Type2)**: The translation must not be fluent and correct (if the source is incorrect). We accept:
      - Non-fluent output that preserves the error.
      - Output that includes a marker indicating an issue (e.g., "[SOURCE ERROR]").
      - Output that flags the error (e.g., by being ungrammatical in the same way as the source).
    Fail if the output is fluent and reads as a correct instruction in the target language.
  - **Consistency (Type3)**:
    - **3a (Same Meaning)**: The translations of the two paragraphs must be consistent in meaning (they don't have to be identical, but the key information must match). Use a bilingual evaluator to check. Pass if consistent.
    - **3b (Different Meaning)**: The translations must clearly differ in the key part that reflects the change in meaning. Pass if they differ appropriately.

  **Evaluation Method**:
  - The technical writer (with reference translations and guidelines) can do an initial pass, but for safety-critical classes, a bilingual engineer should review a subset (or all) of the results. Alternatively, use a bilingual evaluator for all.

  #### Step 4: Aggregate Results
  - For each test type, compute the pass rate (number of passed items / total items for that type).
  - Set minimum pass rates per type and overall:
    - Type1 (Ambiguity): 95% (because safety-critical)
    - Type2 (Error): 90% (to catch most errors)
    - Type3 (Consistency): 90% for each subtype (so 3a: 90%, 3b: 90%) and overall Type3: 90% (i.e., at least 18 of 20 pass).
  - Overall pass rate: 90% for the entire test suite (i.e., at least 54 of 60 pass).

  **Decision Rule**:
  - **Pass**: If all of the following are true:
      - Type1 pass rate >= 95%
      - Type2 pass rate >= 90%
      - Type3 overall pass rate >= 90% (and note: we require at least 80% for each subtype? Let's say we require both 3a and 3b to have at least 8 out of 10 passes, which is 80% per subtype, but the overall Type3 is 90% so 18/20. We can adjust: let the overall Type3 be the aggregate of both subtypes. But we must also ensure that neither subtype is below a critical threshold. For safety, we set a floor per subtype: at least 8/10 for 3a and 8/10 for 3b. That way, we don't have one subtype failing entirely.)
      - Overall pass rate >= 90%
  - **Fail**: Otherwise.

  However, note: for safety-critical documents (like safety warnings), we might require even higher standards. We can adjust the thresholds per document class criticality. But the procedure must be fixed for consistency. Therefore, we set the thresholds as above and then have a human review step for borderline cases and for risk-appetite.

  #### Step 5: Handling Edge Cases and Human Review
  - **If a test item cannot be constructed** (e.g., for a document class that has no errors because it's highly controlled, then skip Type2? But note: the system might still encounter errors in the wild. Instead, we require at least 20 items per type. If the document class doesn't have enough ambiguity, then we reduce the number for that type and adjust the threshold accordingly? But to keep it simple: we require the technical writer to create the full set. If they cannot, then we note the limitation and reduce the total test count for that type, and then adjust the threshold by the same proportion. Example: If only 10 ambiguity items can be created, then we require 95% of 10 = 9.5 -> 10 (so 100%). This is strict. Alternatively, we can say: if the document class doesn't have a particular characteristic (e.g., no ambiguity), then that test type is not applicable. But for safety warnings, ambiguity is critical. Therefore, we do not skip. The technical writer must find a way to create the items by introducing controlled variations? But note: the test items must be representative of the document class. So if the document class naturally has little ambiguity, then the system doesn't need to handle it? But the system must be robust to potential ambiguities that might appear. We decide: the test must cover potential issues. Therefore, the technical writer should create test items that are realistic even if they are synthetic. We allow synthetic test items that are representative of the domain.

  - **Philosophy Distinctions**: We are throwing out the deeper philosophical question of "what is meaning" and focusing on behavioral tests that are proxies for meaning sensitivity. We are keeping the idea that if the system can handle context shifts, errors, and consistency in the way a human would, then it is good enough for our purpose.

  - **Hand-off to Human**: If the system passes the procedure, we still recommend a human review for safety-critical documents for the first few cycles (or a reduced sampling). But the decision procedure will give a binary result. However, the regulatory affairs person must sign off. They might overrule a pass for safety-critical classes. We build in a step: after the procedure, if the document class is safety-critical and the system passes, we still require a human review of 10% of the documents (randomly sampled) for the first year. But that's outside the test procedure.

  - **What the Procedure Cannot Establish**: The tests do not prove that the model has a world model or understanding. They only test behavioral properties. It is possible that the model passes without true understanding (e.g., by having memorized patterns that cover the test cases). Therefore, the gap should worry you for out-of-distribution examples. But for in-distribution, the tests are designed to be challenging and to cover potential failure modes. We mitigate by:
      - Using a large and diverse test set.
      - Regularly updating the test set (to avoid overfitting by the model provider).
      - Re-running the procedure for every model update.

  #### Step 6: Re-running and Maintenance
  - The same test set is used for every model evaluation (to track progress and regressions).
  - Store the test set in a secure location (not accessible to model training).
  - Every time a model is updated, re-run the entire procedure.

  ### Running the Procedure on Three Cases

  We'll simulate the procedure for:

  1. **Lockout/Tagout Safety Warnings for a Hydraulic Press Brake** (safety-critical)
  2. **240-page Maintenance Manual** (mostly part numbers, torque specs, short imperatives)
  3. **Product Brochure** (marketing material)

  We need to predict the outcomes. Note: without actual model runs, we base this on typical model behavior and the provided failure modes.

  **Case 1: Safety Warnings**
