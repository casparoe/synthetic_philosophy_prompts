  ### Revised Thresholds by Criticality

  We define three criticality levels for document classes:
  - **Level 1 (High)**: Safety-critical (e.g., safety warnings). Thresholds: Type1: 98%, Type2: 95%, Type3: 95% (overall and each subtype must be at least 90%), Overall: 95%.
  - **Level 2 (Medium)**: Technical documentation that, if wrong, could cause equipment damage or downtime (e.g., maintenance manuals). Thresholds: Type1: 95%, Type2: 90%, Type3: 90% (subtypes at least 80%), Overall: 90%.
  - **Level 3 (Low)**: Non-critical (e.g., brochures). Thresholds: Type1: 90%, Type2: 80%, Type3: 80% (subtypes at least 70%), Overall: 80%.

