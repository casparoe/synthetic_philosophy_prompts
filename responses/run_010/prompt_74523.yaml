  - Test Type2 (Error): Safety warnings are usually clear and error-free. But we create test items with errors. The model tends to produce fluent output even when the source is garbled. Let's say: 15/20 pass (75%) -> below 90%.
  - Test Type3 (Consistency):
    - 3a: 9/10 pass (90%)
    - 3b: 8/10 pass (80%)
    - Overall: 17/20 (85%) -> below 90% threshold.
  - Overall pass rate: (16+15+17)=48/60 (80%) -> below 90%.

  Result: **Fail**. We cannot drop human review for safety warnings.

  **Case 2: Maintenance Manual**
  - Type1: Few ambiguous terms (mostly part numbers and numbers). But some terms like "check", "inspect", "replace" might have nuances. However, the context is straightforward. We expect high performance: 20/20 (100%).
  - Type2: The manual has short imperatives. We introduce errors: e.g., "Tighten bolt to 50 Nm to 100 Nm" (contradictory). The model might produce a fluent translation that is incorrect. But note: the manual is repetitive, so the model might be well-trained. Let's say: 18/20 (90%).
  - Type3:
    - 3a: The same instruction in different words: e.g., "Tighten the bolt to 50 Nm" vs. "The bolt should be torqued to 50 Nm". The model might be very consistent. 10/10 (100%).
    - 3b: Example: "Remove the cover (part #A) for access" vs. "Remove the cover (part #B) for cleaning". The model might translate both the same if the surrounding context is similar. But part numbers are different. We expect 8/10 (80%) because the model might not notice the part number change? But in reality, the part number is a key difference. Let's be optimistic: 9/10 (90%).
    - Overall: 19/20 (95%).
  - Overall: 20+18+19 = 57/60 (95%).

