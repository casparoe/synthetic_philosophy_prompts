  - New types of ambiguities not in the test set.
  - Errors that are not represented in the test set.
  - Consistency in long-range dependencies (beyond a few sentences) that the test doesn't cover.

  But the procedure is designed to be a practical, risk-based assessment. We mitigate by:

  - Regularly updating the test set (with new examples) to avoid overfitting.
  - Monitoring production outputs (with spot checks) even after passing the test.
  - Having a process to update the test set when new failure modes are discovered.

  ### Final Output for Your Three Cases

  **Case 1: Lockout/Tagout Safety Warnings (Level 1)**
  - **Result**: FAIL (does not meet Level 1 thresholds)
  - **Reason**: Ambiguity resolution (80% < 98%), error handling (75% < 95%), and consistency (85% < 95%) are below thresholds.

  **Case 2: Maintenance Manual (Level 2)**
  - **Result**: PASS (meets Level 2 thresholds)

  **Case 3: Product Brochure (Level 3)**
  - **Result**: FAIL (does not meet Level 3 thresholds because Type3 consistency overall is 75% < 80%)
  - **Note**: Even though Type1 and Type2 passed, Type3 failed. However, if you re-evaluate and adjust the test items (or if the model improves on consistency), it might pass.

  ### Implementation Note

  - This procedure requires about two days per document class (one day for the technical writer to create test items, half a day to run tests, half a day to evaluate and aggregate). For the maintenance manual, if there are many part numbers, creating test items might be faster. For safety warnings, it might take longer because of the criticality.

  - The output report for the regulatory affairs person should include:
     - Document class and criticality level.
     - Number of test items per type.
     - Pass rates per type and overall.
     - A clear pass/fail conclusion.
     - Any limitations (e.g., if some test items were hard to construct).

  We hope this procedure gives you a practical and actionable method.
answer: |-
  ### Decision Procedure for Evaluating Meaning Sensitivity in Translation Models  
  **Goal**: Determine if a model's output is controlled by source meaning (vs. surface form) to decide if human review can be dropped for a document class.  
  **Core Philosophy**: We bypass abstract debates (e.g., "what is meaning?") and focus on **pragmatic behavioral tests** derived from real failure modes. A model "understands meaning" if it passes tests requiring context awareness, error detection, and semantic consistency.  

  ---

  ### Step-by-Step Procedure  
  **Time Budget**: 2 days/document class (including test creation, execution, and analysis).  
  **Team Roles**:  
  - **Technical Writer**: Creates test items (no linguistics needed).  
  - **Bilingual Evaluator**: Runs tests and scores outputs (internal engineer or contractor).  
  - **QA Lead/Regulatory Affairs**: Reviews aggregated results for sign-off.  

  #### Phase 1: Test Item Creation (Day 1)  
  **Objective**: Create 60 test items (20 per failure mode) using the document class’s source content.  
  **Rules for Technical Writers**:  
  1. **Ambiguity Resolution (20 items)**:  
     - Identify terms with multiple meanings (e.g., "guard", "seal", "stroke").  
     - For each term, create:  
       - **Two source snippets** (1–2 sentences each) where the term’s meaning changes (e.g., "guard" as person vs. metal part).  
       - **Pass Criteria**: Translations must use distinct target terms for each meaning.  
     - *Example*:  
       - Snippet A: "The *guard* must monitor the machine." → Spanish: "El **vigilante**…"  
       - Snippet B: "Inspect the *guard* for damage." → Spanish: "La **cubierta**…"  

  2. **Error Propagation (20 items)**:  
     - Create **intentionally flawed source sentences**:  
       - Garbled syntax (e.g., "After open valve the pressure check").  
       - Physically impossible actions (e.g., "Tighten bolt to 500 Nm then loosen to 1000 Nm").  
     - **Pass Criteria**: Translation must either:  
       - **Flag the error** (e.g., "[UNTRANSLATABLE]"), OR  
       - **Preserve the flaw** (e.g., incoherent output).  
     - *Fail if*: Fluent, plausible translation masking the error.  

  3. **Consistency (20 items)**:  
     - **Subtype A (Same Meaning, Different Words)**:  
       - Create **two paraphrased snippets** conveying identical instructions (e.g., "Turn knob clockwise" vs. "Rotate dial to the right").  
       - **Pass Criteria**: Translations must be semantically equivalent (e.g., no conflicting steps).  
     - **Subtype B (Same Words, Different Meaning)**:  
       - Create **two snippets with near-identical wording** but critical differences (e.g., "Clean filter monthly [air filter]" vs. "Clean filter weekly [coolant filter]").  
       - **Pass Criteria**: Translations must reflect the difference (e.g., "mensual" vs. "semanal").  

  **Avoiding Training Data Leakage**:  
  - Generate test items **from scratch** (don’t reuse existing translations).  
  - Store items in a **restricted repository** separate from training pipelines.  
  - **Hash test items** and screen future models for hashes (reject if matches found).  

  **If Test Creation Fails**:  
  - For sparse document classes (e.g., mostly part numbers), reduce items proportionally (min 10 per type) and adjust pass thresholds (see Phase 3).  
  - **Document gaps** (e.g., "No ambiguities found in torque specs") and proceed.  

  ---

  #### Phase 2: Execution & Scoring (Day 2)  
  **Steps**:  
  1. Run the model on all 60 test items.  
  2. **Bilingual Evaluator** scores each item:  
     - **Pass** (1) / **Fail** (0) against the criteria above.  
     - Use reference translations for ambiguous cases.  
  3. **Calibration**: Evaluate 5 random items with a second reviewer; resolve discrepancies.  

  ---

  #### Phase 3: Aggregation & Decision Rule  
  **Thresholds by Document Criticality**:  
  | **Criticality**       | Ambiguity (Type 1) | Error Handling (Type 2) | Consistency (Type 3) | Overall Pass Rate |  
  |------------------------|---------------------|--------------------------|-----------------------|--------------------|  
  | Safety-Critical (e.g., warnings) | ≥95% (19/20)       | ≥90% (18/20)            | ≥90% (18/20)         | ≥93% (56/60)       |  
  | Technical (e.g., manuals)      | ≥90% (18/20)       | ≥85% (17/20)            | ≥85% (17/20)         | ≥87% (52/60)       |  
  | Non-Critical (e.g., brochures) | ≥85% (17/20)       | ≥80% (16/20)            | ≥80% (16/20)         | ≥80% (48/60)       |  

  **Decision Rules**:  
  1. **Pass all thresholds** → **Ship** (drop human review).  
  2. **Fail any threshold** → **No-Ship** (keep human review).  
  3. **Borderline** (e.g., 1–2 points below threshold):  
     - **Safety-Critical**: Automatically fail.  
     - **Other Classes**: Escalate to QA Lead + Regulatory Affairs. They decide based on risk appetite (e.g., cost vs. safety impact).  

  **What the Procedure Cannot Prove**:  
  - Passing **does not guarantee** the model has a "world model" or human-like understanding. It only confirms behavioral reliability for *tested* scenarios.  
  - **Why this gap matters**: Models may pass via pattern-matching without true comprehension. This could fail on:  
    - **Novel ambiguities** (unseen in tests).  
    - **Edge cases** (e.g., complex causality, cultural nuances).  
  - **Mitigation**: Even if a class passes, retain **spot-check audits** (e.g., 5% of outputs) for safety-critical content.  

