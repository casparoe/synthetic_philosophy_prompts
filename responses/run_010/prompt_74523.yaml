  - Type2: 75% < 95% -> fail
  - Type3: 85% < 95% -> fail
  - Overall: 80% < 95% -> fail

  **Case 2: Maintenance Manual (Level 2)**
  - Type1: 100% >=95% -> pass
  - Type2: 90% >=90% -> pass
  - Type3: 95%>=90% and each subtype: 100% and 90% (both >=80%) -> pass
  - Overall: 95%>=90% -> pass

  **Case 3: Product Brochure (Level 3)**
  - Type1: 95%>=90% -> pass
  - Type2: 85%>=80% -> pass
  - Type3: 75%>=80%? -> 75% < 80% -> fail (even though subtypes are 70% and 80%, which are above 70%, the overall Type3 is below 80%)
