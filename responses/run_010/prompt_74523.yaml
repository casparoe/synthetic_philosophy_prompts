  |-------------|-------------------|---------------|---------------------|----------|-----------------------------------|
  | Level 1     | 98%               | 95%           | 95%                 | 95%      | 90% (each)                       |
  | Level 2     | 95%               | 90%           | 90%                 | 90%      | 80% (each)                       |
  | Level 3     | 90%               | 80%           | 80%                 | 80%      | 70% (each)                       |

