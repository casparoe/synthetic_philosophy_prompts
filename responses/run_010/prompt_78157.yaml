  For structure: Stanza 1 sets up actual history, 2-5 explore counterfactuals while making the rotation feel inevitable, Envoi resolves ambiguously. Must show contingency isn't free - deleting Archduke's assassination requires either rewriting all prior causes ("a miracle") or accepting cascading changes. The "weight" stanza will tackle how inevitability narratives cheat by retroactive weighting. 

  Biggest risk: the "proof" concept might oversimplify historiography debates. And "steel" could feel forced as industrial metaphor. But the form demands concrete nouns, so I'll own that compromise in the afterword.
answer: |-
  ## Sestina: On the Weight of the Unfired Bullet

  **End-Word Brainstorm:**
  1.  **Rain:** (Double Duty) - Sudden, contingent weather event *and* persistent, shaping environmental pressure/atmosphere.
  2.  **Track:** (Double Duty) - Literal railroad line (fateful journeys) *and* the deep groove of historical path-dependency/inevitability.
  3.  **Steel:** Material of weapons/tools *and* symbol of industrialization, militarization, the hard forces driving events.
  4.  **Door:** Point of decision/opportunity/alternative path *and* the specific historical moment/choke-point (e.g., Sarajevo, Channel storm).
  5.  **Weight:** The cumulative pressure of causes, the burden of consequence, the *feeling* of inevitability.
  6.  **Proof:** The elusive justification for inevitability claims *and* the evidence we seek in the aftermath, always colored by outcome.

  **Order Sketch:**
  1.  **Stanza 1 (Actual Event):** Trigger moment (rain, door), sense of consequence (weight, steel), the path taken (track), the certainty sought (proof).
  2.  **Stanza 2 (Deletion Attempt):** Trying to remove the trigger (door), the immediate "what if" (rain), the path seemingly still there (track), but the cost emerges (steel, weight, proof falters).
  3.  **Stanza 3 (Cascading Cost):** The "miracle" needed to hold the past fixed (proof impossible?), the forces still pushing (steel), the pressure building elsewhere (weight), finding a new opening (door), the altered environment (rain), the diverted path (track).
  4.  **Stanza 4 (Overdetermined Outcome):** The multiple pressures converging (weight), the structural momentum (track), the available means (steel), making the outcome seem unavoidable regardless of the deleted trigger (door), the evidence reinterpreted (proof), the pervasive atmosphere (rain).
  5.  **Stanza 5 (The Suspicion):** How the outcome rewrites the past (proof becomes circular), how the path solidifies in retrospect (track feels deeper), how pressure is reassigned (weight shifts), how the trigger seems smaller (door less significant), the environment normalized (rain just weather), the means always present (steel).
  6.  **Stanza 6 (The Ambiguity):** The trigger's contingency undeniable (rain fell), the paths that *could* have been (door unlocked), the force of the currents (track hums), the material reality (steel gleamed), the pressure felt (weight descended), the impossibility of clean knowing (proof dissolves).
  7.  **Envoi:** Synthesizes the tension – the contingent spark *and* the deep currents, the path taken, the cost of alteration, the lure and trap of "proof".

  ---

  **The Sestina**

  That Tuesday, sudden as the summer **rain**,
  The motorcade turned down the fatal **track**.
  A pistol’s cold intention forged of **steel**
  Found purchase past the open carriage **door**.
  Felt instantly, the century’s grim **weight**.
  Is this the hinge? Where’s history’s **proof**?

  Delete the pistol’s flash. Demand the **proof**
  That peace would bloom beneath that same thin **rain**,
  That empires, buckling under their own **weight**,
  Would hold, content along their rusted **track**.
  Imagine no one opened that car **door**.
  Ignore the restless hunger in the **steel**.

  The arsenals were brimming with the **steel**;
  The treaties strained, awaiting final **proof**.
  Ambition rattled every guarded **door**.
  The climate thickened, more than just the **rain**,
  Humming along the continental **track** –
  A tension singing with relentless **weight**.

  This is the cost: that **weight**, that gathered **steel**
  Seeks outlet. Block one **door**, the **proof** accrues
  That pressures shift like currents under **rain**,
  Diverting force along a different **track**.
  It finds a crack, a weakness in the **door**,

  Or builds until it shatters bolt and **door**.
  There’s always **steel** enough. The crushing **weight**
  Of grievances, ambitions, finds its **track**.
  The aftermath provides the only **proof**:
  “See how the storm clouds brewed beyond that **rain**?
  It *had* to break.” Thus justifies the **weight**.

  But *had* it? Feel the arbitrary **weight**
  Assigned *after*, sealing shut the **door**
  On futures drowned beneath that actual **rain**.
  The deep-grooved **track** seems carved by fate’s own **steel**,
  A polished narrative denying **proof**
  To paths erased before they left the **track**.

  The carriage rolled along its planned-out **track**.
  The pistol held its manufactured **weight**.
  The Archduke paused. There was no final **proof**
  The driver *wouldn’t* miss the turning **door**.
  The sun *might* burn away the pending **rain**.
  That glint of malice in the waiting **steel**…

  **Envoi**
  The contingent spark: the glinting **steel**,
  The deep current: the humming **track**.
  The cost of change: a world’s **weight**.
  The path not taken: the closed **door**.
  The evidence we crave: sure **proof**.
  The constant factor: waiting **rain**.

  ---

  **Post-Poem Note (153 words):**

  Confidence is moderate-high on core concepts. The rotation embodies the "rearranging furniture" thesis well, especially with "rain" (event/structure) and "track" (path/inevitability). "Steel" effectively bridges weapon/material force. The cost of deletion ("Stanza 3") and overdetermined outcomes ("Stanza 4") are credibly explored through the form's constraints. The suspicion about inevitability talk ("Stanza 5") lands, showing retroactive weighting ("weight shifts").

  **Least Confident Point:** The conflation of "proof." I collapse *evidence available at the time* (scarce) with *retrospective justification* (plentiful) into one end-word. A specialist might argue this blurs distinct epistemic stages. The poem uses "proof" primarily as the *illusion* of certainty hindsight provides, sacrificing nuance about contemporaneous uncertainty for the sake of the rotating argument and the envoi's punch ("The evidence we crave: sure proof"). The ambiguity in "proof dissolves" (Stanza 6) tries to hint at this, but it's a liberty forced by the form's demand for a single, resonant end-word representing the problematic quest for historical certainty.
