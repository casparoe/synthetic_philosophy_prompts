prompt: |-
  I am trying to work out what my intuitions about the validity of consent actually amount to, and I would like help extracting a principle from them. Here are my verdicts.

  1. A singing master tells a pupil that a procedure is a vocal treatment that will improve her voice; it is in fact sexual contact. Her consent is invalid.
  2. A dentist suspended from the register extracts teeth from patients who believe she is still licensed. I judge that consent valid, even though every one of them would have refused had they known.
  3. A woman agrees to sex with a client for £25, and he never pays. Valid.
  4. A man agrees to sex with someone who has told him she is a well-known footballer, and she is nobody of the sort. Invalid.

  Cases 3 and 4 are the pair I cannot reconcile: both are lies about something the other party cared about, and in both the truth would have changed the answer.

  5. A mugger's "your money or your life" invalidates the handing over of the wallet.
  6. An employer's "sign this non-compete or you are dismissed" does not, in my view, invalidate the signature, though the employee would far rather not sign.

  I cannot say what separates these. "The threat makes some option much worse" fits both.

  7. A fourteen-year-old's agreement is invalid whatever her maturity; a bright seventeen-year-old who understands the situation completely is still, I think, unable to consent to the same act — yet I would let her consent to a tattoo and to giving blood.
  8. A woman who is moderately drunk but able to remember the encounter and to make up her mind the next morning consents to sex: valid. The same woman, equally drunk, sells her car for £500: voidable.
  9. A man in the early stages of dementia agrees to move into a care home and has forgotten the conversation ten minutes later. Valid at the moment of agreement, I think, but I would not let it settle an irreversible decision.

  Please state the principle — or the small set of candidate principles — that best captures these verdicts. Give its clauses precisely, identify which case motivates each clause, and tell me honestly which of my verdicts it cannot accommodate and why I ought to surrender them rather than complicate the principle to save them. Then tell me what it delivers on cases I have not listed: a man who conceals before sex that he has had a vasectomy; a researcher who omits a one-in-a-million risk that duly materialises; a student who signs a plagiarism declaration to avoid expulsion; a worker who agrees to a ninety-hour week because there is no other job to be had; a patient who agrees to a risky operation only because her surgeon has told her it is the sole option.

  Please write the answer in British English.
reasoning: |-
  Okay, let me approach this systematically. The user presents a series of consent judgments and seeks a unifying principle, explicitly requesting British English and rigorous analysis. Their cases reveal deep tensions - particularly between deception cases (3 vs 4) and coercion cases (5 vs 6) - suggesting their intuitions track different moral dimensions.

  First examining deception cases: The vasectomy lie (user's follow-up) seems analogous to case 4 where identity matters intrinsically to the act's nature. Whereas non-payment in case 3 is extrinsic - the act itself remains sex, not payment. This distinction might explain why football fraud invalidates consent but wage theft doesn't. 

  For coercion: The mugger's threat (5) creates an artificial crisis violating bodily autonomy, while the employer's ultimatum (6) leverages pre-existing vulnerability without crossing that threshold. The plagiarism case resembles 6 - academic expulsion is institutionally embedded coercion.

  On capacity: Their age/stage distinctions suggest consent validity depends on whether the decision involves irreversible consequences (tattoo vs sex) rather than cognitive maturity alone. The dementia case highlights temporal validity - consent must endure long enough to cover the act's consequences.

  The drunkenness asymmetry puzzles me. Why is drunken sex consent valid but car sale voidable? Perhaps because property transfers require higher procedural rigor, whereas intimate acts center on contemporaneous willingness. But this feels ad hoc - maybe their intuition privileges bodily autonomy over commercial interests.

  I'll need to reconcile these threads into principles about: (1) deception affecting the act's fundamental nature, (2) threats creating illegitimate harm scenarios, and (3) capacity relative to decision gravity. The follow-up cases will test whether this framework holds - especially the vasectomy concealment which feels like case 4, and the researcher's omission which might be invalid if risks are material.

  Notably, their verdicts resist simple "voluntariness" or "informedness" metrics. The dentist case shows people can validly consent without full information, while the football case shows some deceptions vitiate consent even with accurate act-description. This suggests a distinction between core versus peripheral attributes of the consented act.

  The worker's 90-hour week case will challenge the coercion principle - is economic duress equivalent to the mugger's threat? Their case 6 suggests not, but this might reveal a limitation in privileging bodily integrity over welfare concerns. Perhaps the principle needs a clause about exploitation of pre-existing vulnerability.

  Honestly, their drunk transaction cases may be inconsistent. If capacity is impaired equally in both scenarios, why different validity? I might need to recommend surrendering one verdict unless we invoke domain-specific standards (sexual vs contractual consent).
answer: |-
  Here’s a precise principle distilled from your verdicts, with clauses motivated by your cases. It prioritises **domain-specific boundaries** over blanket rules about deception or coercion:

  ### Principle of Material Domain Violation (MDV)
  1. **Core Nature Deception**: Consent is invalid if deception *fundamentally alters the domain or essential nature* of the act consented to, such that it becomes a categorically different type of act in the eyes of a reasonable person sharing the consent-giver’s core values.  
     *Motivated by Cases 1 & 4*:  
     - Sexual contact disguised as medical treatment (Case 1) transforms a therapeutic act into a sexual one.  
     - Sex under celebrity identity fraud (Case 4) makes it intimacy under false pretences, violating relational authenticity.  
     *Contrast with Case 3*: Non-payment is a breach of contract, but the act (sex) remains in the same domain.  

  2. **Illegitimate Coercion**: Consent is invalid if obtained through threats that *create an unjustified, imminent harm*, violating bodily autonomy or fundamental rights.  
     *Motivated by Cases 5 & 6*:  
     - Mugger’s threat (Case 5) imposes artificial, lethal harm, voiding choice.  
     - Employer’s threat (Case 6) leverages pre-existing economic vulnerability without imminent bodily harm.  
     *Clarifier*: Threats must weaponise *illegitimate* power (e.g., criminal force vs. contractual dismissal).  

  3. **Domain-Sensitive Capacity**: Capacity to consent depends on the *irreversibility and societal weight* of the act, assessed relative to the individual’s developmental stage or cognitive state.  
     *Motivated by Cases 7, 8 & 9*:  
     - A 17-year-old may consent to a tattoo (reversible-ish) or blood donation (low risk) but not sex (high relational/psychological stakes) (Case 7).  
     - Drunkenness voids a car sale (legally complex transaction) but not sex (contemporaneous willingness suffices) (Case 8).  
     - Early dementia consent is moment-valid for care decisions unless irreversibility outlasts memory (Case 9).  

  ---

  ### Verdicts MDV *Cannot* Accommodate (and Why You Should Surrender Them)
  - **Case 8 (Drunken Car Sale)**: MDV deems this **invalid**, conflicting with your "voidable" verdict.  
    *Why surrender yours?* If intoxication sufficiently impairs judgment for complex transactions (legally standard), consistency demands aligning with Case 9’s temporal validity logic. Your verdict undermines consumer protection norms.  
  - **Case 3 (Unpaid Sex Work)**: MDV deems this **valid**, but flags ethical breach. *No surrender needed*—your verdict aligns.  

  ---

  ### MDV Applied to New Cases
  1. **Vasectomy Concealment**:  
     *Invalid* (Core Nature Deception). Reasonable partners view fertility as fundamental to sexual/reproductive acts. Changes act from "potentially procreative sex" to "infertile sex"—a material domain shift for many.  

  2. **Researcher Omitting 1-in-a-Million Risk**:  
     *Valid consent*. Omission doesn’t alter the act’s core nature (research participation). Minimal risk is below materiality threshold absent specific vulnerability.  

  3. **Student Signs Plagiarism Declaration Under Expulsion Threat**:  
     *Valid* (per Case 6). Threat leverages institutional rules, not illegitimate harm. Signing remains within academic domain.  

  4. **Worker Agrees to 90-Hour Week Due to No Alternatives**:  
     *Valid but exploitative*. Economic duress ≠ illegitimate coercion (e.g., bodily harm). Societally, employment terms are negotiable (if unfairly).  

  5. **Patient Consents to Risky Surgery Based on "Only Option" Lie**:  
     *Invalid* (Core Nature Deception). Alternatives fundamentally alter medical decision-making. Turns "informed choice" into "manipulated necessity," shifting from healthcare to malpractice.  

  ---

  ### Why MDV Works
  - **Avoids Overbreadth**: Not all lies/coercions invalidate consent (e.g., Case 3, Case 6). Focuses on acts *reconstituted* by deception/duress.  
  - **Respects Context**: Capacity and threats judged by domain (sexual, medical, commercial).  
  - **British Legal Alignment**: Mirrors UK jurisprudence (e.g., *R v. Lawrence* on fraud, *Re T* on coercion).  

  **Weakness**: "Domain" boundaries are culturally contested (e.g., is infertility material to sex?). But your cases suggest you intuitively weight relational/biological integrity heavily—MDV codifies this. If this clashes with newer intuitions, revisit Clause 1.
