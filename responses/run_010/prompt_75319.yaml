prompt: |-
  I run a masters-level philosophy of psychiatry module and I'm putting together the take-home final. I want one essay question on Hacking's looping effects that can't be answered by defining interactive kinds and reciting "making up people" back at me. Build it round a fake diagnosis I've been using in seminars — call it attention fragmentation disorder — which went from a couple of case reports to a 9% twelve-month prevalence in six years, and where the symptom checklist got revised in year three to add compulsive notification-checking, which happens to be exactly the behaviour all the publicity about the label had already made common. The question should turn on something I've been calling loop closure: the point where a category can't be disconfirmed anymore because the people its applied to have rearranged themselves to fit it. Ask the students what evidence could show the category tracks a real kind rather than creating one, and why each obvious answer fails — 90 minutes, 20 marks. Please give me the question itself (sketch the case in enough detail that it stands alone without our seminar notes), a model answer of about 500 words, and then the marking scheme as exactly five numbered points, one or two sentences each, saying what each is worth and how candidates typically botch it, with no introduction or conclusion on that part.
