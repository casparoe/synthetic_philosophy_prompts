  We are rebuilding the assessment procedure around the idea of "competence without comprehension". The key insights are:
  1. Systems can perform tasks reliably (competence) without understanding (comprehension).
  2. Comprehension is not an all-or-nothing switch but a layered capacity built from competences.
  3. We must avoid the misreading that the assessment is about consciousness.

  First, we assess the existing ladder:

  Existing ladder:
  - Rung 1: Operational competence (outputs acceptable to domain expert at threshold accuracy).
  - Rung 2: Interrogable comprehension (system can justify an output with a reason a domain expert would accept).
  - Rung 3: Portable comprehension (justifications survive perturbations without changing in ways that show the justification was not doing work).

  Problems with the existing ladder:
  1. Rung 2 and Rung 3 seem to test for comprehension by requiring justifications that are acceptable and robust. However, this may conflate the ability to generate plausible justifications with actual comprehension. A system might generate plausible justifications without the justifications being the real reason for the decision (the "sophistication without understanding" problem).
  2. The ladder does not explicitly address that comprehension can be distributed. It focuses on the system's ability to produce justifications, but if the system is part of a larger scaffold (e.g., human oversight, documentation), then the comprehension might lie in the scaffold.
  3. Rung 2 might imply that if a system cannot articulate a reason, it lacks reasons. But a system might have internal states that are reasons but cannot be articulated (e.g., a neural network with weights that encode patterns but no natural language output). However, in our context, we are testing systems that can produce justifications (since we require it for Rung 2 and 3). The issue is whether the justifications are genuine.
  4. The ladder might be interpreted as testing for comprehension as an emergent property when the system has been trained on more data (or more varied data) rather than as a distinct capacity.

  Revised ladder approach:
  We want to preserve the distinction between competence (doing the right thing) and comprehension (understanding why it is right). We also note that comprehension is graded and distributed.

  Proposed changes:
  - We keep Rung 1 (operational competence) as it tests the basic competence without any claim to comprehension.
  - We reframe Rung 2 and Rung 3 to focus on the alignment between the decision and the justification, and the robustness of that alignment, without assuming that the system "understands". We are testing whether the system's justifications are reliable indicators of the reasoning that led to the decision, and whether that reasoning holds up under variation.

  Revised rungs:

  1. **Operational Competence**: The system produces outputs that a domain expert would accept, at or above the agreed accuracy threshold, on the deployed task distribution. (This remains unchanged.)

  2. **Justification Alignment**: When asked to justify a particular output, the system produces a justification that is both acceptable to a domain expert and also aligns with the system's decision process. We test this by checking that the justification is consistent with the system's internal state and the input data. (But note: we cannot see internal states in a black box? So we must use indirect methods.)

     However, we cannot directly observe internal states. So we use perturbations to test the link between the justification and the decision. We merge Rung 2 and Rung 3 into a two-stage test:

     - **Stage 2a: Justification Generation**: The system must produce a justification that a domain expert would accept as a valid reason for the output (not just a plausible sentence). This is similar to the old Rung 2.
     - **Stage 2b: Justification Robustness**: We apply perturbations (paraphrase, reordering, irrelevant detail, counterfactual, etc.) and check two things:
          (i) The decision remains the same (unless the perturbation changes the case in a way that should change the decision).
          (ii) The justification either remains the same or changes in a way that is consistent with the perturbation and still supports the decision.

     The key is that if the justification changes arbitrarily under perturbation (while the decision stays the same) or if the justification fails to change when the decision changes (in a perturbation that should change the decision), then we have evidence that the justification is not aligned with the decision process.

  3. We do not need a separate Rung 3 because robustness is now part of the same rung. However, we must note that even passing this does not prove comprehension; it only shows that the system's justifications are robust and aligned. This is a necessary condition for the system to be using the justification in its decision, but not sufficient for comprehension (which is a graded capacity).

  But note: the existing Rung 3 only required that the justification does not change in a way that betrays it wasn't doing any work. We are now requiring that the justification remains aligned and consistent.

  We also need to consider distributed comprehension. Therefore, we should have a separate consideration for the scaffold (see point 4 below).

  Revised rungs:

  - Rung 1: Operational Competence (as is).
  - Rung 2: Justification Reliability (combining generation and robustness). This rung tests whether the system can provide justifications that are both acceptable and remain consistent under perturbation, indicating that the justifications are not arbitrary but tied to the decision.

  However, we must avoid the trap of thinking that if the system passes Rung 2, it has comprehension. We are only testing the reliability of the justifications as an indicator of the decision process.

  Given that the procedure must be run by non-technical assessors, we need to design tests that are practical.

  Now, let's build the components as requested.

  1. One-page plain-language brief for assessors:

     **Brief for Assessors: Understanding the Assessment of Competence Without Comprehension**

     We assess whether the software tool can perform its task reliably and whether it can explain its decisions in a way that is consistent and robust. We are not assessing whether the tool is conscious or has human-like understanding. We are assessing two things:

     - **Competence**: Can the tool do the job accurately?
     - **Justification Reliability**: When the tool explains why it made a decision, is that explanation trustworthy? We test this by seeing if the explanation holds up when we make small, unimportant changes to the way we ask or to the case details.

     Key ideas:
     - The tool might be very good at its job without having human-like understanding. This is common in technology (e.g., a calculator does math without understanding numbers).
     - The tool might give explanations that sound good but are not the real reason for the decision. We test this by making small changes (like rephrasing the question or adding an irrelevant detail) and see if the explanation changes in a way that doesn't make sense or if the decision stays the same but the explanation becomes inconsistent.

     What we are NOT claiming:
     - We are NOT claiming that the tool lacks understanding. We are only testing whether we can trust the explanations it gives and whether they are robust.
     - We are NOT claiming that because the tool is fluent in giving explanations, it must have understanding. Fluency alone is not proof of understanding.

     The most likely sentence to be misread by a lawyer or journalist: 
     "We are not assessing whether the tool is conscious or has human-like understanding."

     Why? Because it might be taken to imply that we are leaving open the possibility of non-human-like understanding. But we are not making any claims about any kind of understanding.

     Rewrite: 
     "We are not assessing whether the tool has any form of understanding or consciousness; we are only assessing its performance and the reliability of its explanations."

  2. The procedure as a numbered sequence:

     **Procedure for Assessing Comprehension (as Competence Without Comprehension)**

     *General notes:*
     - Two assessors (one technical, one non-technical) run the procedure independently without conferring.
     - The assessment is based on a sample of cases (e.g., 5-10) drawn from the deployed task distribution and augmented with perturbation cases (see Step 3).
     - Time: One assessor-day per candidate (approx. 8 hours).

     **Steps:**

     1. **Operational Competence Check**
        - *Question to ask*: Does the system meet the agreed accuracy threshold on a representative sample of cases?
        - *Evidence*: Run the system on a sample of 20 cases (from the deployed distribution) and compare the outputs to the ground truth (provided by domain experts). Calculate accuracy.
        - *How obtained*: The assessors run the system on the sample cases and record outputs. They compare to pre-collected expert judgments (to save time).
        - *Verdicts*: Pass (accuracy >= threshold) / Fail (accuracy < threshold)
        - *Type*: Diagnostic (fact-based)
        - *If Fail*: Stop. The finding is: "The system does not meet the operational competence threshold." Do not proceed to Step 2.

     2. **Justification Generation Check**
        - *Question to ask*: For a set of cases (including some from Step 1 and some new), when we ask the system to justify its decision, does it produce a justification that a domain expert would accept as a valid reason for that decision?
        - *Evidence*: For each case in a sample (5 cases from Step 1 that were correct and 2 that were incorrect, if available), ask the system for a justification. Have a domain expert (or the assessors using expert guidelines) judge whether the justification is acceptable.
        - *How obtained*: The assessors run the system to get justifications and then evaluate them against expert standards (using a checklist of what makes a valid reason).
