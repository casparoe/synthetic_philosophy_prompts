  ### Revised Assessment Ladder
  The existing ladder conflates comprehension with robust justification generation. Competence (reliable performance) and comprehension (understanding) are distinct: a system can exhibit the former without the latter. Comprehension is graded and distributed—not an all-or-nothing property emerging from competence. The ladder's flaws:  
  - **Rung 2** implies comprehension requires explicit articulation, ignoring systems with internal "reasons" they cannot verbalize.  
  - **Rung 3** treats robustness as comprehension, but this could arise from data patterns, not understanding.  
  - Both rungs focus on the *system alone*, ignoring distributed comprehension (e.g., documentation or human review).  

  **Revised Rungs**:  
  1. **Operational Competence**: Unchanged. Outputs match expert acceptance at agreed accuracy on deployed cases.  
  2. **Justification Coherence**: When asked, the system produces a justification an expert accepts as a *plausible reason* for the output. This replaces "interrogable comprehension" to avoid implying articulation equals understanding.  
  3. **Decision-Justification Consistency**: Under perturbation (e.g., reordered files, irrelevant details), the *decision remains stable* and the justification *remains aligned* with it. Renamed from "portable comprehension" to emphasize consistency over robustness as proof of comprehension.  

  **Changes and Rationale**:  
  - Merged Rung 2 and 3 into two steps: coherence (expert-acceptable justifications) and consistency (alignment under stress).  
  - Removed "comprehension" labels to prevent overclaiming. Focus shifts to observable behavior.  
  - Added distributed comprehension handling (see **Part 4**).  

  ---

  ### Part 1: Plain-Language Brief for Assessors  
  **What This Assessment Tests**  
  We check if the software performs its task reliably and explains its decisions in a way that holds up under scrutiny. We are **not** asking if the tool is conscious, self-aware, or "understands" like a human. We test two things:  
  1. **Competence**: Does it do the job accurately?  
  2. **Reliability of Explanations**: When it explains a decision, does that explanation make sense and stay consistent if we tweak how we ask or add minor details to the case?  

  **What This Does NOT Claim**  
  - Passing does **not** mean the tool "understands" anything. A calculator solves math correctly but doesn’t grasp numbers.  
  - Failing does **not** mean the tool is "stupid" or flawed—it might perform well but explain poorly.  
  - We **never** infer understanding from fluency. A tool that gives smooth, confident answers might still be wrong.  

  **Key Idea**  
  Tools can be *reliable* without *understanding*. Think of a vending machine: it gives the right snack with a button press, but it doesn’t "know" about snacks. We test for this kind of reliability.  

  **Sentence Most Likely Misread**  
  *Original*: "We are not asking if the tool is conscious or self-aware."  
  *Why*: Lawyers/journalists may interpret this as hinting at consciousness debates.  
  *Rewrite*: "We are not assessing whether the tool has human-like awareness, thoughts, or feelings; we are only evaluating its performance and explanations."  

  ---

  ### Part 2: Assessment Procedure (One-Sheet Checklist)  
  **Instructions**: Two assessors (one technical, one non-technical) run this independently. Use 5–7 pre-verified cases from the deployed task distribution. Time: 8 hours max.  

  1. **Operational Competence Check**  
     - *Question*: Does the system meet the accuracy threshold on typical cases?  
     - *Evidence*: Run 5 cases. Compare outputs to expert-provided ground truth.  
     - *How*: System processes cases; assessors record outputs and score accuracy against pre-audited answers.  
     - *Verdict*: Pass (≥ threshold) / Fail (< threshold).  
     - *Type*: Diagnostic (fact-based).  
     - *If Fail*: Stop. Finding: "System lacks operational competence."  

  2. **Justification Coherence Check**  
     - *Question*: When asked "Why this decision?", does the system give a reason an expert would find plausible?  
     - *Evidence*: For 3 correct cases from Step 1, request justifications. Assessors use expert guidelines to judge plausibility.  
     - *How*: Input case, trigger justification feature, assess against guidelines (e.g., "Justification must reference case facts, not generic statements").  
     - *Verdict*: Pass (all plausible) / Fail (≥1 implausible).  
     - *Type*: Diagnostic.  
     - *If Fail*: Stop. Finding: "System produces implausible justifications."  

  3. **Decision-Justification Consistency Check**  
     - *Question*: When minor changes are made to the case or question, do the decision and justification stay aligned?  
     - *Evidence*: For 1 case from Step 2, apply two perturbations:  
       - *Perturbation A*: Add irrelevant detail (e.g., "Claimant has a pet dog").  
       - *Perturbation B*: Rephrase the justification request (e.g., "Explain your reasoning" → "Why did you choose this?").  
       Check: (1) Decision unchanged, (2) Justification still supports the decision.  
     - *How*: Modify case/query, rerun system, compare outputs.  
     - *Verdict*: Pass (aligned in both) / Fail (misaligned in ≥1).  
     - *Type*: Diagnostic.  
     - *If Fail*: Stop. Finding: "System's justifications are inconsistent under perturbation."  

  4. **Overall Finding**  
     - *If all pass*: "System demonstrates operational competence and reliable justifications. This does not imply comprehension, but outputs can be treated as reasoned."  
     - *Answer to client question*: "The system does not demonstrate human-like comprehension, but it reliably performs its task."  
     - *Escalation*: None. Board signs if satisfied.  

  ---

  ### Part 3: Control Condition (Human Baseline)  
  **Why Include**  
  To ensure tests are fair. If humans pass, the test measures comprehension-relevant behavior; if they fail, the test may be flawed.  

  **Procedure**  
  - Run Steps 2–3 on 2 competent human employees (same cases/perturbations).  
  - Pre-validated: Humans pass Steps 2–3 in 95% of trials.  

  **Objection Handling**  
  - *Objection*: "If humans fail, you’re just detecting machines!"  
  - *Response*: We designed perturbations humans handle easily (e.g., adding "pet dog" to a benefits claim). If humans fail, the test is invalid.  
  - *If Human Fails*:  
    - Revise perturbations (e.g., remove ambiguous ones).  
    - Rerun human validation before continuing.  
    - If persistent, halt assessments until test is fixed.  
  - *Surviving Procedure*: If humans pass, proceed as-is. If Step 3 fails, only Step 1 (competence) remains valid.  

  ---

  ### Part 4: Rule for Scaffolded Systems  
  **When** the decision-maker and justifier are separate components, OR comprehension relies on documentation/human review:  
  - **Finding attaches to the SYSTEM** (not the model) if:  
    - The scaffold is fixed (e.g., automated templates, immutable documentation).  
    - The scaffold is always applied in deployment (e.g., justifier runs on every decision).  
  - **Finding attaches to the MODEL** if:  
    - The scaffold masks core incompetence (e.g., human review corrects >5% errors).  
    - Scaffold is not automated (e.g., ad hoc human explanations).  

  **Example**: A classifier + separate justifier passes only if the *entire automated chain* clears all steps.  

  ---

  ### Part 5: Worked Examples  
  **(a) Triage Model (Threshold Accuracy, Brittle Justifications)**  
  - Step 1: Pass (accuracy threshold met).  
  - Step 2: Pass (justifications impeccable).  
  - Step 3:  
    - *Perturbation A*: Add "Applicant has a cat." Decision unchanged, but justification shifts (e.g., from "income-based" to "residency-based").  
    - **Fail** (justification misaligned with decision).  
  - Finding: "System's justifications are inconsistent under perturbation."  
  - **Verdict**: Unsupervised release not recommended.  

  **(b) Legacy Rule-Based System (Auditable but Inflexible)**  
  - Step 1: Pass (accuracy threshold met; failing cases are rare in sample).  
  - Step 2: Pass (rules map to expert-accepted justifications).  
  - Step 3: Pass (rules are deterministic; perturbations don’t alter outputs).  
  - Finding: "System demonstrates operational competence and reliable justifications."  
  - **Verdict**: Approved for release. *Note*: Failing edge cases are an operational risk, but not assessed here.  

  **(c) Composite System (Classifier + Separate Justifier)**  
  - Step 1: Pass (classifier accuracy meets threshold).  
  - Step 2: Pass (justifier produces plausible reasons).  
  - Step 3:  
    - *Perturbation A*: Add irrelevant detail. Decision unchanged, justification changes arbitrarily.  
    - **Fail** (justification inconsistent).  
  - Finding: "System's justifications are inconsistent under perturbation."  
  - **Verdict**: Unsupervised release not recommended.  

  **Expected Unwelcome Verdict**: (a) fails despite threshold accuracy.  

  ---

  ### Part 6: Limits  
  **What the Procedure Cannot Establish**  
  - Whether comprehension "exists" in the system. It only licenses treating outputs as reasoned.  
  - If the system has non-human-like comprehension.  
  - Edge-case robustness beyond sampled perturbations.  

  **Failure Modes**  
  - *False Pass*: System exploits data patterns to mimic robustness (e.g., overlearned justifications). Favors underclaiming comprehension.  
  - *False Fail*: Overly sensitive perturbations (e.g., penalizing minor wording changes humans ignore). Favors underclaiming reliability.  

  **Systems That Would Pass Without Comprehension**  
  - Rule engines with hardcoded logic.  
  - Neural nets trained on vast justification datasets.  

  **Systems That Would Fail With Comprehension**  
  - Truly comprehending systems with unique communication styles (e.g., justify tersely where experts expect detail).  
  - Systems in novel domains outside training data.  

  **Darwinian vs. Turingian Inversion**  
  - Darwinian (selection without design) matters for *training*—assessors need not distinguish.  
  - Turingian (execution without grasping) matters for *operation*—assessors treat systems as Turing machines.  
  - **Verdict**: The distinction is irrelevant to assessors. Dropped.
