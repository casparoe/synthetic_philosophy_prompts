answer: |-
  ### Nietzschean Past-Orientation Sorting Instrument  
  *For academic self-reflection prior to reading Nietzsche's "On the Uses and Disadvantages of History for Life"*  

  **Instructions:** Answer all 10 questions based on your instinctive reaction. Choose *one* option per question. Do not overthink—respond as you would in a seminar debate.  

  ---

  1. **First-years struggle with primary texts. You advocate:**  
     a) Start with modern summaries; build confidence before tackling originals.  
     b) Teach originals from day one—exposure to raw genius sparks ambition.  
     c) Use primary texts only to show how past errors inform current debates.  
     d) Skip old texts; focus on contemporary applications.  

  2. **A student proposes a thesis on a thinker forgotten since 1911 but can’t justify relevance. You advise:**  
     a) Pursue it—every voice deserves preservation, regardless of impact.  
     b) Only if they can prove the figure challenges modern assumptions.  
     c) Drop it; academic energy should target pressing current questions.  
     d) Focus on how the figure’s ideas reveal timeless human truths.  

  3. **Your department must replace a corridor of old professorial portraits. You argue:**  
     a) Keep them—they root us in our institutional identity.  
     b) Replace with new portraits to showcase achievable modern exemplars.  
     c) Remove them entirely; such icons perpetuate outdated hierarchies.  
     d) Replace with abstract art; human likenesses distract from ideas.  

  4. **A student wants to open her thesis by demolishing her supervisor’s framework. You say:**  
     a) Do it—but only if she rebuilds a better framework afterward.  
     b) Critique constructively; show how her work extends the existing model.  
     c) Scrap the critique; emulate a pioneering scholar instead.  
     d) Avoid conflict; focus on data rather than frameworks.  

  5. **Town council debates relocating a war memorial for new housing. You testify:**  
     a) Keep it in place—the site is sacred ground for communal memory.  
     b) Relocate it prominently to inspire future generations with its values.  
     c) Move it to a museum and add context about war’s complexities.  
     d) Remove it; public space shouldn’t be dictated by old trauma.  

  6. **Your reading group only discusses post-2015 works. You propose:**  
     a) Add pre-1800 texts to discover enduring ethical insights.  
     b) Include 19th-century classics to trace our intellectual ancestry.  
     c) Stick to post-2015—older work rarely addresses current crises.  
     d) Read any era; foundational debates recur eternally.  

  7. **Inheriting family letters/photos, you:**  
     a) Curate them as a shrine to lineage and belonging.  
     b) Mine them for life lessons to guide your own ambitions.  
     c) Selectively keep what resonates and discard the rest.  
     d) Store them unopened; they don’t shape your present.  

  8. **Confronting a scholarly tradition you oppose, you typically:**  
     a) Master it to dismantle its foundations systematically.  
     b) Integrate its useful fragments into your own synthesis.  
     c) Reject it outright and adopt a contrarian historical model.  
     d) Dismiss it; intellectual trends are ephemeral noise.  

  9. **Your university archives costly physical copies. You vote to:**  
     a) Retain them unconditionally—material artifacts are irreplaceable.  
     b) Digitize selectively to spotlight documents with modern relevance.  
     c) Digitize everything and discard originals to fund new research.  
     d) Prioritize digital access; the medium is incidental to content.  

  10. **Designing a new course, you emphasize:**  
      a) "Great Books" that model intellectual excellence.  
      b) Foundational texts that ground disciplinary identity.  
      c) Cutting-edge scholarship that breaks with past paradigms.  
      d) Student interests; curriculum should mirror contemporary concerns.  

  ---

  ### Scoring Key  
  *(Tally selections, then match to leaf with highest count. Tie? Pick first dominant pattern.)*  

  | Option | Leaf | Option | Leaf | Option | Leaf | Option | Leaf |  
  |--------|------|--------|------|--------|------|--------|------|  
  | 1a     | B1   | 1b     | A1   | 1c     | C1   | 1d     | U    |  
  | 2a     | B2   | 2b     | C1   | 2c     | U    | 2d     | S    |  
  | 3a     | B1   | 3b     | A1   | 3c     | C2   | 3d     | U    |  
  | 4a     | C1   | 4b     | B1   | 4c     | A2   | 4d     | U    |  
  | 5a     | B1   | 5b     | A1   | 5c     | C1   | 5d     | C2   |  
  | 6a     | A1   | 6b     | B1   | 6c     | U    | 6d     | S    |  
  | 7a     | B1   | 7b     | A1   | 7c     | C1   | 7d     | U    |  
  | 8a     | C1   | 8b     | B1   | 8c     | A2   | 8d     | S    |  
  | 9a     | B2   | 9b     | A1   | 9c     | C1   | 9d     | S    |  
  | 10a    | A1   | 10b    | B1   | 10c    | C1   | 10d    | U    |  

  ---

  ### The Eight Leaves  
  *(Adapted from Nietzsche’s "three kinds of person" served by history)*  

  | Leaf             | Name                  | Predictable Next Step                          | Most Awkward Commitment                        |  
  |------------------|-----------------------|-----------------------------------------------|-----------------------------------------------|  
  | **A1 (Healthy Active Striver)** | The Inspired Emulator | Quotes a historical figure to resolve a modern dilemma. | Must publicly fail when emulation ignores context. |  
  | **A2 (Excessive Active Striver)** | The Blind Imitator    | Forces a current project into an archaic mold. | Defends an anachronism even when it becomes absurd. |  
  | **B1 (Healthy Preserver)** | The Rooted Steward    | Organizes an event celebrating neglected tradition. | Spends resources maintaining something of purely symbolic value. |  
  | **B2 (Excessive Preserver)** | The Hoarding Venerator | Campaigns to retain obsolete academic practices. | Protects a harmful tradition because it’s "heritage." |  
  | **C1 (Healthy Sufferer)** | The Liberating Critic | Drafts a manifesto for change using historical critique. | Destroys a cherished institution and faces backlash. |  
  | **C2 (Excessive Sufferer)** | The Ruthless Iconoclast | Targets another "outdated" symbol for demolition. | Leaves a vacuum filled by something worse. |  
  | **U (Unhistorical)** | The Presentist        | Dismisses a historical analogy as irrelevant. | Repeats past mistakes due to ignorance. |  
  | **S (Suprahistorical)** | The Eternal Observer  | Withdraws from a debate because "nothing changes." | Watches preventable harm with detached equanimity. |  

  ---

  ### Flagged Indistinguishable Pairs  
  - **B1 (Rooted Steward) vs. C1 (Liberating Critic)** when preserving via critique (e.g., keeping portraits with context, Q3/5). *Why*: Both value tradition, but B1 prioritizes continuity, C1 rupture. Instrument can’t capture motive—only the *action* of critical preservation.  
  - **C1 (Liberating Critic) vs. B2 (Hoarding Venerator)** after intellectual defection. *Why*: A critic rejecting their training (C1) may venerate a *new* tradition (B2 identically). Motive (liberation vs. reverence) is invisible to questions.  
  - **U (Presentist) vs. S (Suprahistorical)** in rejecting history. *Why*: U sees the past as irrelevant; S sees it as eternally unchanged. But in practice (e.g., Q6c/d), both reject engagement. Sharpest separator: S admits past’s existence but deems it static (Q2d, 6d, 9d).  

  ---

  ### Empty Cells in Attitude Space  
  *(Combinations no leaf occupies)*  

  | Combination                                | Why Empty                                  |  
  |--------------------------------------------|--------------------------------------------|  
  | **Imitates own past, critical of others’** (e.g., reveres department founders but demolishes rival schools). | *Incoherent*: Striving to emulate requires universalizing models; selective critique undermines emulation’s legitimacy. |  
  | **Reveres everything, imitates nothing** (e.g., preserves all traditions but never adopts any). | *Unattractive*: Reverence without emulation is inert; no one wants to be a passive archivist of living traditions. |  
  | **Breaks to preserve elsewhere** (e.g., demolishes a campus statue to "save" it in a museum). | *Unexplored*: Nietzsche doesn’t address preservation-through-rupture. Logically coherent but rare in practice. |  
  | **Suffers under past, preserves it** (e.g., critiques academic lineage yet upholds its rituals). | *Unattractive*: Self-subversion is psychologically unsustainable; most resolve into C1 or B1. |  

  ---

  **Design Notes for Instructor**:  
  - **Mechanics**: Scoring is tally-driven; no interpretation needed. Takes <2 mins/student.  
  - **Validation**: Questions avoid Nietzschean terms/synonyms. Non-academic items (Q7, Q5) dilute dissertation bias.  
  - **Weakness**: Cannot resolve mixed motives (e.g., B1/C1) or defector veneration (C1/B2). Use discrepancies to spark debate.  
  - **Handout Fit**: 10 questions + key + descriptors fit one A4 side (Calibri 10pt). Print double-sided with Nietzsche essay.
