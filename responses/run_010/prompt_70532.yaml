  ### Principle of Evolutionary Individuality

  Your verdicts across the eight cases reflect a coherent principle I term the **Principle of Evolutionary Individuality (PEI)**. This principle determines when a biological entity qualifies as a unit of selection by integrating four conditions derived from multilevel selection theory, evolutionary transitions, and replicator dynamics. PEI avoids ad hoc clauses by focusing on measurable population-genetic parameters:

  1. **Variance Partitioning**: The candidate unit must exhibit significant *between-unit variance* in fitness relative to *within-unit variance*. This is quantified by the ratio \( \frac{V_{\text{between}}}{V_{\text{within}}} \) for fitness at the candidate level. A high ratio (e.g., >1) indicates that selection can act effectively at that level.
  2. **Fitness Cohesion**: The fitnesses of lower-level components must be *positively correlated* (aligned) within the unit. This is measured by the correlation coefficient \( \rho \) of fitness among sub-units. High cohesion (\( \rho \approx 1 \)) minimizes internal conflict.
  3. **Heritable Transmission**: Fitness differences at the candidate level must be heritable. This requires that the unit replicates with sufficient fidelity, such that offspring units resemble parents in traits affecting fitness (heritability \( h^2 > 0 \)).
  4. **Environmental Interaction**: The unit must function as an integrated interactor with the environment, where its fitness emerges from collective traits, not merely the sum of sub-unit actions.

  **PEI Definition**: A biological entity is a genuine unit of selection if and only if:
  - \( \frac{V_{\text{between}}}{V_{\text{within}}} \) is sufficiently high for selection to act at its level,
  - Fitness cohesion \( \rho \) among its sub-units is high (\( \rho \geq 0.8 \), though context matters),
  - It has a heritable life cycle (\( h^2 > 0 \)) with parent-offspring transmission of traits,
  - It interacts cohesively with the environment, exhibiting emergent fitness.

  PEI reconciles your verdicts by emphasizing that units arise when conflict is suppressed (high cohesion), selection acts between units (high variance ratio), and the unit replicates as a whole (heritability). It distinguishes "bookkeeping" from "biology" by requiring emergent fitness through interaction.

