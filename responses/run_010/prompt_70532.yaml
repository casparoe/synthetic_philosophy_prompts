  ### Distinguishing Conflicting Cases
  Your tension between Cases 4 (tumor) and 5 (phage-resistant bacteria) and between Cases 1 (driving haplotype) and 7 (sex chromosome) stems from how PEI applies to transmission bottlenecks and fitness alignment.

  #### **Tumor Cell Lineage (Case 4) vs. Phage-Resistant Bacterial Population (Case 5)**
  - **Key Distinction**: The level of environmental interaction and heritable transmission.
    - **Case 4 (Tumor)**: 
      - *Unit*: Cancer cell lineage.
      - *PEI Justification*: 
        - *Variance*: High between-lineage variance within the host (cancer vs. normal cells).
        - *Cohesion*: High (\( \rho \approx 1 \)) due to clonality; cells share a mutation and proliferate as one.
        - *Heritability*: Cell division transmits traits vertically; lineage persists across generations.
        - *Interaction*: Lineage interacts directly with the tissue environment (e.g., evading immune response), and its fitness (proliferation) is emergent from collective traits (e.g., loss of contact inhibition).
      - The organism ceases to be a unit because its sub-units (cells) have decoupled fitness (\( \rho \ll 1 \) between cancer and normal cells), and organism-level heritability is zero (host dies without reproducing).
    
    - **Case 5 (Bacteria)**:
      - *Unit*: Patch (population-level group).
      - *PEI Justification*:
        - *Variance*: High between-patch variance (patches survive or die to phage exposure), low within-patch variance (clonal cells; \( V_{\text{within}} \approx 0 \)).
        - *Cohesion*: Perfect (\( \rho = 1 \)) due to clonality; cells share fate via patch survival.
        - *Heritability*: Patches "reproduce" when surviving patches disperse cells to form new patches, transmitting resistance traits. This is parent-offspring inheritance at the patch level.
        - *Interaction*: The patch interacts as a whole with the phage environment; fitness (patch survival) is emergent from collective resistance.
      - Individual cells are not units because they lack independent fitness—their survival depends entirely on patch fate. There is no within-patch selection due to clonality.

  **Why PEI Distinguishes Them**: In Case 4, the cell lineage is the interactor (it proliferates autonomously), while in Case 5, the patch is the interactor (cells are "gametes" for patch reproduction). Case 4 has no group heritability (cells reproduce, not groups); Case 5 has group heritability (patches propagate via dispersal). Your intuition tracks this: the tumor lineage acts like a "selfish organism," while the bacterial patch acts like a "superorganism."

  #### **Driving Haplotype (Case 1) vs. Suppressed Sex Chromosome (Case 7)**
  - **Key Distinction**: The origin and alignment of fitness.
    - **Case 1 (Haplotype)**:
      - *Unit*: Haplotype.
      - *PEI Justification*: 
        - *Variance*: High between-haplotype variance (driving vs. wild-type alleles).
        - *Cohesion*: High (\( \rho \approx 1 \)) among genes in the haplotype; they inherit and act as one.
        - *Heritability*: Haplotype transmitted intact (no recombination) with fidelity.
        - *Interaction*: Haplotype interacts directly via sperm-killing, enhancing its transmission.
    
    - **Case 7 (Sex Chromosome)**:
      - *Unit*: Sex chromosome.
      - *PEI Justification*:
        - *Variance*: High between-chromosome variance (e.g., Y-chromosomes with sex-biased alleles).
        - *Cohesion*: High (\( \rho \approx 1 \)) due to suppressed recombination; genes co-selected.
        - *Heritability*: Chromosome transmitted as a unit during meiosis.
        - *Interaction*: Chromosome interacts via sex-specific effects (e.g., male-benefit alleles), creating emergent fitness decoupled from the organism.
      - You note that population-genetic treatment resembles low-recombination regions, but PEI adds context: sex chromosomes have *functional integration* (e.g., role in sex determination) that creates a distinct fitness interest. Ordinary low-recombination regions lack this; alleles may not share a common selective pressure, so cohesion \( \rho \) is lower.

  **Why PEI Distinguishes Them**: Both qualify as units, but your verdict for Case 7 arises because suppressed recombination + sex linkage creates persistent conflict with the genome, making fitness emergent at the chromosome level. In ordinary low-recombination regions, alleles may not exhibit cohesive, opposing fitness (e.g., no systematic bias like male-benefit), so they fail PEI's cohesion criterion. Your intuition resists labeling ordinary regions as units because they lack functional integration.

