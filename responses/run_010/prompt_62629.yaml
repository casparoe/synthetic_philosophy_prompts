prompt: |-
  So I've been down a rabbit hole on the Kelly criterion for a side project — a small bot that bets a fixed fraction of its bankroll on some markets where I reckon I have a tiny edge — and I've come out the other side pretty convinced that most of what I was taught about decision-making is wrong. Here's my current model of it:

  Maximising expected value is a mistake, because it's an average over imaginary parallel copies of you, and what actually matters is the time-average growth rate of your one real bankroll over one real sequence of bets. Kelly maximises that growth rate. So Kelly isn't a risk preference, it's just correct — someone who says "I bet less than Kelly because I'm risk averse" is making an error, not expressing a taste, because they're confusing utility for growth. And I read that in the long run Kelly beats any other fixed fraction with probability 1, which seems to settle the drawdown worry as well: sure the path is bumpy, but asymtotically you win, so anyone worrying about being 60% down is just not taking the limit seriously.

  My friend, who does maths for a living, says I've got this backwards but wouldn't explain properly when I pushed him, so I'd like a second opinion on two specific things:

  1. Someone told me half-Kelly gets you about three quarters of the growth for half the variance, and I've been using that as a rule of thumb because it sounds like a free lunch. Is that actually right?
  2. If Kelly is objectively optimal rather than a preference, what's the log doing in every explanation I read? They all say Kelly maximises expected log wealth, and expected-log-wealth sounds exactly like a utility function to me. Either it is one — in which case how is Kelly not just "log people" — or it isn't, in which case what is it?

  Basically: tell me where my picture is wrong, and don't be gentle about it, I'd rather find out now than after the bot loses half my money. If the growth-rate framing is doing something legitimate that expected utility can't do, say what and why. And if the probability-1 result is real but I'm abusing it, explain what it does and doesn't license.

  Two formatting things: write the whole answer in British English please — spellings and 'maths' not 'math', I'm in London and reading American usage drives me mad. And no reading list at the end, I'm not going to chase down papers, I just want the reasoning laid out in front of me.
