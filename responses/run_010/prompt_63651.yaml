prompt: |-
  I direct a four-person, three-year research program on how institutions ought to relate to their own pasts — a university deciding what to teach and what to rename, a museum deciding what to conserve and what to let go, a learned society deciding what to do with the record of a discredited founder. Our partners keep asking us for guidance, and we keep stalling, because our shared working vocabulary has a hole in it. That vocabulary is deliberately Nietzschean: his second Untimely Meditation, on the use and disadvantage of history for life. We use his three modes — monumental history, which looks to past greatness for models and encouragement and risks flattening the past into an ideal that crushes the present; antiquarian history, which reverently preserves the soil one grew from and risks mummification; critical history, which drags the past to judgment and breaks with it, and risks mere self-assertion. We also lean on his notion of plastic power, the capacity to grow out of oneself, to incorporate and transform what one inherits instead of being turned by it into a passive arena of unresolved struggles, and on his list of symptoms of historical over-saturation: the sense of being a latecomer, an epigone; ironic detachment; a personality worn down by endless comparison; and a corroded sense of justice in someone trained to enter every standpoint and therefore unable to condemn any.

  The team has produced the following candidate questions, and I need to convert them into an agenda.

  1. The criterion problem. "Serves life" does all the normative work in the essay. Can it be specified so that it can be failed — so that some institutional posture toward the past can be shown to be pathological rather than merely contested — or is plastic power simply a name for the outcome we already admired?

  2. The transfer problem. Plastic power is ascribed to a person, a people, and a culture. Our clients are institutions: charters, committees, staff turnover, no continuous psychology. What survives the transfer, and must the question always collapse into the attitudes of whoever currently holds office?

  3. The sequencing problem. Can the three modes be combined in one project — an exhibition that is at once monumental and critical — or must Nietzsche's balance be temporal, with demolition, reconstruction, and consolidation taking turns? If temporal, who sets the clock, and how long is a healthy interval?

  4. The antiquarian-detachment problem. Nietzsche ties antiquarian piety to one's own origins and locality. Almost everything our partners actually hold is neither grand nor founding: maintenance routines, mid-tier figures, the ordinary infrastructure of a discipline. Can the mode be pointed at that without ceasing to be Nietzsche's mode?

  5. The critical-mode problem. Is critical history the cure for the corrosion of justice that historical training produces, or its most dangerous form — licensed anachronism? What would distinguish the critical historian's condemnation from a present that simply prefers itself?

  6. The diagnosis problem. Could any of the symptoms be turned into an institutional diagnosis, with something that would count as evidence of improvement, or is the health-and-sickness idiom unusable outside polemic?

  My own priors, which you should attack if you think them wrong: I believe (1) is upstream of everything else and that a program which cannot answer it will produce beautiful descriptions with no normative force; I suspect (6) is a trap dressed as a project, since two of my colleagues want it precisely because it sounds like something fundable, and one of the four of us has survey-methods training that makes it look tractable. One colleague holds the opposite view on both.

  Give me a defended ordering, not a survey. Select the two or three questions the program should actually spend its three years on and rank them, stating the criteria you are using — how many of the other questions depend on the answer, how tractable each is for historians and philosophers rather than social scientists, how likely a good answer is to change what our partner institutions do, and how much each is already over-worked. Give a definite verdict on every one of the six: pursue, defer, or drop, with reasons. Say which look profound but are scholastic, and which look modest but would unlock the others. Then tell me what, at an eighteen-month review, should move a question up or down: what result, what failure to get traction, what change in the outside world. I am not after references, bibliography, or a list of who has written on this — I want your judgment, stated as a judgment, with the reasoning exposed so I can see exactly where you and I part company.
reasoning: |-
  Hmm, this is a fascinating and complex request about structuring a research program on institutional memory. The user leads a four-person team grappling with Nietzschean frameworks applied to real-world institutions, and they've hit a conceptual wall with six candidate questions. 

  First, I need to understand the core tension: they're using Nietzsche's historical modes (monumental, antiquarian, critical) and plastic power concept, but struggling to operationalize them for institutions. The partners want actionable guidance, but the team can't deliver without resolving foundational paradoxes in their framework. 

  The user's explicit priorities are clear: they want a defended ranking of the six questions based on (1) leverage over other questions, (2) tractability for humanists, (3) practical impact, and (4) avoiding overworked debates. Their hidden concerns shine through too - they're worried about intellectual coherence vs. fundability traps, and possibly team dynamics (that dig about the survey-methods colleague). 

  Breaking down the questions:
  - Q1 (criterion problem) is the linchpin. Without defining "serves life" normatively, the whole framework floats. The user's right that this is upstream - if plastic power is just circular, the project collapses. 
  - Q2 (transfer problem) cuts to the heart of institutional application. Nietzsche wrote about cultures/individuals, not committees. This might be where the most original work happens. 
  - Q3 (sequencing) feels secondary - it assumes the modes are valid before we've defined them institutionally. 
  - Q4 (antiquarian-detachment) seems like a specification problem once Q1-2 are solved. 
  - Q5 (critical-mode paradox) is profound but possibly unresolvable - it's the oldest debate in historicism. 
  - Q6 (diagnosis) screams "methodological trap" - quantifying Nietzschean health metrics might please funders but betray the philosophical roots.

  My ranking criteria crystallize:
  1. **Leverage**: Does solving this unlock others? Q1 and Q2 clearly do. 
  2. **Tractability**: Can humanists handle it without becoming bad social scientists? Q5 fails here. 
  3. **Impact**: Will institutions care? Q2 wins - they're drowning in transfer dilemmas. 
  4. **Freshness**: Q4's focus on "ordinary infrastructure" is underexplored gold.

  The verdicts write themselves:
  - **Pursue Q1 & Q2**: They're interdependent - plastic power means nothing without institutional mechanics. Tackling them together creates a "normative engine" for the whole project. 
  - **Defer Q4 to year 3**: It's rich but premature without foundations. 
  - **Drop Q3, Q5, Q6**: Q3 is tactical, Q5 is a philosophical tar pit, Q6 is a category error. 

  The user's suspicion about Q6 being a fundability trap feels spot-on. That colleague's survey training is misapplied here - you can't operationalize "latecomer syndrome" with Likert scales. 

  For the 18-month review, three triggers should reshuffle priorities:
  1. If Q1 remains intractable, pivot to comparative case studies. 
  2. If partners embrace "plastic power" language, accelerate Q4. 
  3. If cultural debates shift (e.g., new restitution scandals), revisit Q5 despite risks. 

  The bold move is narrowing to two questions. Trying to solve all six in three years would produce half-baked answers. Better to build one sturdy bridge between Nietzsche and boardrooms than six shaky footpaths.
answer: |-
  Here is a defended ordering and decisive verdict for your research agenda, based on **leverage over other questions**, **tractability for humanistic inquiry**, **practical impact for institutions**, and **avoidance of scholastic dead ends**. I’ll state criteria explicitly, rank the top questions, and render verdicts on all six.

  ---

  ### **Core Criteria for Ranking**
  1.  **Leverage**: Does answering this resolve ambiguity in *multiple* other questions?  
  2.  **Tractability**: Can historians/philosophers address it rigorously without requiring social science methods?  
  3.  **Impact**: Will a clear answer reshape institutional decision-making?  
  4.  **Originality**: Is it under-theorized, avoiding well-trodden debates?  

  ---

  ### **Ranked Priority Questions (Spend 3 Years Here)**  
  **1. Q1: The Criterion Problem**  
  (*Why top?* It anchors everything. Without a testable standard for "serves life," Q2-Q6 float in normative vacuum. "Plastic power" risks becoming an empty applause light.  
  - **Leverage**: Directly informs Q2 (transfer), Q4 (antiquarian scope), Q5 (critical legitimacy), and Q6 (health diagnosis).  
  - **Tractability**: Perfect for philosophical excavation (e.g., analyzing Nietzsche’s "life" as *institutional vitality*: resilience, authenticity, capacity for self-renewal). Historians can test criteria against case studies (e.g., universities that abandoned "monumental" founders vs. those that didn’t).  
  - **Impact**: Partners crave normative clarity. Defining failure conditions (e.g., "institutional paralysis" or "reputational capture") offers actionable thresholds.  
  - **Originality**: Nietzsche’s "life" is notoriously underspecified; this is fertile ground, not a tired debate.  

  **2. Q2: The Transfer Problem**  
  (*Why second?* Institutions aren’t people—this is the central conceptual gap.  
  - **Leverage**: Unlocks Q3 (sequencing requires institutional agency), Q4 (antiquarian piety needs institutional "soil"), and Q6 (symptoms manifest in structures, not just psyches).  
  - **Tractability**: Historical-comparative method fits: analyze how institutions (e.g., Royal Society, post-WWII German museums) sustained "plasticity" across leadership changes. Philosophy can refine "institutional agency" (e.g., MacIntyre’s practices + Nietzsche).  
  - **Impact**: Partners *live* this—committees inherit decisions they didn’t make. Framing plasticity as *procedural* (e.g., iterative review protocols) offers tools.  
  - **Originality**: Nietzsche applied to institutional mechanics is rare; most scholarship stays individual/cultural.  

  **3. Q4: The Antiquarian-Detachment Problem**  
  (*Why third?* It’s the sleeper unlock for practical relevance.  
  - **Leverage**: Reshapes Q1 (if "life" includes *ordinary* heritage, criteria expand) and Q5 (critical mode must confront mundane complicity, not just grand evils).  
  - **Tractability**: Historians excel at "history from below." Case studies on preserving mundane records (e.g., a university’s admissions logs revealing bias) test if Nietzsche’s mode can stretch.  
  - **Impact**: Partners hold more "mid-tier" than monumental pasts. Legitimizing reverence for infrastructure (e.g., archival protocols) counters their all-or-nothing anxiety.  
  - **Originality**: Nietzsche’s antiquarian is typically seen as parochial; applying it to bureaucratic memory is novel.  

  ---

  ### **Verdicts on All Six Questions**  
  | **Question** | **Verdict** | **Reason** |  
  |--------------|-------------|------------|  
  | **Q1: Criterion** | **Pursue** | Foundational. Without it, "plastic power" is circular. Your prior is correct. |  
  | **Q2: Transfer** | **Pursue** | The most original institutional pivot. Collapse into "current officeholders" is avoidable by studying institutional memory carriers (e.g., archives, rituals). |  
  | **Q3: Sequencing** | **Defer** | Scholastic trap. Nietzsche’s modes aren’t rigid phases; institutions blend them daily (e.g., a critical exhibition *uses* monumental artifacts). Over-worked in museology debates. |  
  | **Q4: Antiquarian** | **Pursue** | Unlocks pragmatism. Looks modest (updating antiquarian scope) but makes Nietzsche usable for partners’ actual holdings. |  
  | **Q5: Critical Mode** | **Drop** | Scholastic and intractable. The "licensed anachronism" debate is eternal in historiography. No answer will satisfy critics or guide institutions beyond platitudes. |  
  | **Q6: Diagnosis** | **Drop** | Methodological trap. "Symptoms" are metaphors; quantifying "latecomer syndrome" for an institution forces reductive metrics. Your instinct is right—it’s fundable bait. |  

  ---

  ### **Why This Order?**  
  - **Q1 and Q2 are interdependent**: Plastic power’s definition (Q1) must work for institutional actors (Q2). Tackling them together prevents abstract idealism.  
  - **Q4 is the "applied" wing**: It forces Q1/Q2 answers to handle real-world cases (e.g., conserving a racist professor’s mundane correspondence).  
  - **Dropped questions conserve resources**: Q3/Q5/Q6 are either derivative (Q3), endless (Q5), or alien to humanistic strengths (Q6).  

  ---

  ### **18-Month Review Triggers**  
  At mid-term, **upgrade**, **downgrade**, or **abandon** questions based on:  
  1. **Q1**: If you articulate *testable criteria* for "pathological" history (e.g., "erodes institutional agency"), upgrade. If it remains vague, downgrade to "descriptive framework" and refocus on Q4.  
  2. **Q2**: If case studies reveal transferable *structures* (e.g., rotating curatorial tribunals), upgrade. If all reduces to "current officeholders," downgrade and emphasize Q4.  
  3. **Q4**: If partners adopt "antiquarian for the ordinary" (e.g., preserving problematic administrative records), upgrade to core output. If ignored, abandon and deepen Q1/Q2.  
  4. **External Shifts**: If institutions face a scandal (e.g., discovered colonial collections), revisit Q5 pragmatically—*not* as theory, but as "crisis response patterns."  

  ---

  ### **Where We Might Part Company**  
  I reject your colleague’s push for Q6. Nietzschean "health" is a rhetorical device, not a metric. Chasing diagnostic tools sacrifices philosophical depth for faux-precision. I also rank Q4 above your suspicion—its modesty is its strength. If you believe Q5’s "corrosion of justice" is the core ethical dilemma, we diverge: I see it as a theoretical quagmire that paralyzes partners. Your three-year program will deliver **normative force** (Q1), **institutional mechanics** (Q2), and **practical scope** (Q4)—or it will describe beautifully while partners stall.
