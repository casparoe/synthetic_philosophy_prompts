prompt: |-
  Next term I am responsible for one seventy-five-minute seminar in a first-year graduate sequence on decision-making under uncertainty. The students are mostly economics and public-policy MAs being trained to rank programs by expected value. They can compute an expectation as a probability-weighted sum, they have met the St. Petersburg gamble in passing, and they have had exactly one term of probability: none of them has encountered a conditionally convergent series, and none has any reason to suspect that the order in which terms are added could matter. The seminar's subject is the Pasadena game, and what a decision theory built on expected value is supposed to say when an expectation fails to exist. I have a whiteboard and no slides, and I will not be able to assume any mathematics I have not put on that board myself.

  Do not explain the game to me; I know it. Plan the seminar.

  (a) The order of the components and what depends on what. In particular, tell me where to place the fact that in the order the outcomes naturally arise the series does converge, to an entirely unremarkable figure: state that figure, and argue whether revealing it early buys me credibility at the cost of the punchline, or whether withholding it makes the eventual result look like a trick.

  (b) Which single worked computation carries the whole session, and how much of the standard overshoot-and-undershoot procedure for steering a conditionally convergent series toward a chosen target the students must carry out by hand, as against merely being told it can be done.

  (c) The misconceptions this audience specifically will bring in or form on the spot. I anticipate that it is just St. Petersburg with extra steps, and that a bounded utility function makes the trouble disappear; I want the ones I have not thought of, given that these students are trained to produce a number and defend a ranking. For each, give the point in the sequence at which it must be headed off, not the point at which it will surface.

  (d) One closing task, doable in the last five minutes, that separates a student who has grasped that the value is not merely difficult to compute but absent from one who has merely accepted that infinities behave strangely.

  (e) What I should deliberately leave out, and what I should say aloud about leaving it out, so that the omission registers as a decision rather than a gap.

  One point on which I want your judgment rather than my own. I had planned to finish on a wrinkle of my own: the familiar reply that no counterparty could really cover unbounded payoffs does not tame this game, it makes it worse. Cap the winnings at whatever the house can actually pay and the positive part of the series becomes convergent while the penalties are untouched and still diverge, so the realistic version of the gamble has an expected value of negative infinity; cap the penalties instead, at whatever the player can actually lose, and it becomes positive infinity. On that account the sign of the resulting infinity is settled by whose pockets are finite. Is the reasoning correct as I have stated it? And if it is, does it belong at the end of a first encounter, or does it quietly convert a lesson about undefined expectation into a lesson about infinite expectation and undo what I have spent the hour establishing?
reasoning: |-
  Hmm, the user is planning a graduate seminar on the Pasadena game and decision theory under uncertainty. They need a structured lesson plan addressing specific pedagogical concerns. Let me unpack their requirements.

  First, they're teaching economics and public policy MA students who are comfortable with basic expected value calculations but haven't encountered conditionally convergent series. The core challenge is demonstrating how expectation can fail to exist, not just be infinite.

  For part (a): The natural order convergence to ln2 should be revealed early. This builds credibility by showing the game isn't absurd on its face. Withholding it risks students dismissing the later rearrangement as a trick. Stating the natural-order value upfront anchors the discussion in something concrete.

  For part (b): The key computation is rearranging to converge to $100. Students should manually compute partial sums for at least two rearrangement steps to viscerally grasp how positive/negative terms cluster. Full overshoot-undershoot mechanics can be described but not executed due to time constraints.

  For part (c): Beyond the anticipated misconceptions (St. Petersburg parallel, bounded utility fix), these students might assume: 1) "Nonexistent expectation" just means "very large" (must preempt during divergence demonstration), 2) Any convergence proves expectation exists (address when showing natural-order ln2 result), 3) Practical truncation resolves the issue (save for closing task), and 4) Their standard ranking algorithms can handle this (emphasize during decision theory implications).

  For part (d): An effective closing task is asking students to sketch why capping payoffs creates infinite expectations. This reinforces nonexistence by showing how artificial bounds create diametrically opposed infinities.

  For part (e): Deliberately omit Riemann rearrangement theorem's proof and measure theory foundations. Explicitly state this is to focus on conceptual implications for decision theory.

  Regarding their original question: Their capped payoff reasoning is correct but dangerous to include. Showing how capping leads to ±∞ would indeed undermine the "nonexistence" lesson. Better to present this as a follow-up challenge problem.

  The seminar should maintain tight focus: conditional convergence → rearrangement → expectation failure → decision theory paralysis. Any infinity discussion belongs in a sequel session.
answer: |-
  Here’s a structured seminar plan tailored to your constraints and pedagogical goals. The emphasis is on **conceptual revelation** over mathematical rigor, leveraging the students’ computational fluency to expose a foundational crack in expected value.

  ---

  ### **(a) Order of Components & Natural Convergence**  
  **Sequence:**  
  1. **Define the Pasadena game** on the board (payoff = \((-1)^{n-1} \cdot \frac{2^n}{n}\) with prob \( \frac{1}{2^n} \) for \(n=1,2,\dots\)).  
  2. **Immediately compute the "natural-order" partial sum** (first 5 terms):  
     \( S_5 = (2) - (2) + \frac{8}{3} - 4 + \frac{32}{5} = -0.0667 \).  
     **State:** *"If we stop here, EV ≈ -6.67¢. But watch what happens when we add more terms..."*  
  3. **Reveal the natural-order convergence to \(\ln 2 \approx \$0.693\):**  
     *"When we sum the payoffs in the order they’re played, the series converges to about 69 cents. This isn’t infinite or bizarre—it’s finite and intuitive."*  

  **Why early?**  
  - **Builds trust:** Withholding this feels like a "gotcha." Revealing it early establishes the game isn’t pathological at face value.  
  - **Sharpens the paradox:** The punchline isn’t "no expectation exists," but "**even a ‘sensible’ finite value can’t be trusted**." This heightens the stakes for decision theory.  

  ---

  ### **(b) The Central Computation**  
  **Core Demo:** Rearrange terms to converge to $100.  
  1. **Show the mechanism:**  
     - Group terms as "blocks" of positive and negative payoffs.  
     - *Students compute:*  
       - **Block 1 (first positive terms until sum > $100):**  
         \( \frac{2}{1} + \frac{8}{3} + \frac{32}{5} + \cdots \) until cumulative > $100 (≈12 terms).  
       - **Block 2 (first negative term):** \(-2\).  
       - New partial sum: \( S_{13} ≈ 100 - 2 = 98 \).  
     - Repeat: Add positive terms until >$100 again (fewer terms needed), then add next negative.  
  2. **Student hands-on work:**  
     - Compute **2 blocks** themselves (5–7 min).  
     - **Stop there.** Describe (don’t calculate) the overshoot/undershoot process:  
       *"We can always ‘steer’ the sum by adding positives to overshoot $100, then a negative to undershoot, repeating forever. The error shrinks, so it converges to $100."*  

  **Why this suffices:**  
  - They **see** the rearrangement mattering (Block 1 → Block 2).  
  - Full steering is intuitive; executing >2 blocks burns time without insight.  

  ---

  ### **(c) Anticipated Misconceptions & Preemptive Strikes**  
  1. **"This is just St. Petersburg with a sign flip."**  
     - **Preempt during natural-order calculation:**  
       *"Unlike St. Petersburg, here the natural sum is finite. The problem isn’t infinity—it’s that the expectation depends on how we add terms."*  

  2. **"Bounded utility solves this."**  
     - **Preempt when defining the game:**  
       *"Suppose we cap payoffs at, say, $1 billion. What changes? The natural sum still converges, but now rearrangement can’t produce $100. Yet the expectation is still order-dependent—just within bounds. But decision theory shouldn’t require artificial bounds to function."*  

  3. **"In practice, we truncate the series. Problem gone."**  
     - **Preempt after showing both \(\ln 2\) and $100:**  
       *"Truncating forces an arbitrary choice: Where do we stop? The EV changes dramatically based on that choice—unlike convergent series where tails vanish."*  

  4. **"We can rank this by dominance or other heuristics."**  
     - **Preempt during conclusion:**  
       *"Dominance fails: No outcome dominates another. Ad hoc rules might ‘solve’ this game but break elsewhere. Expected value is our only general tool—and here, it’s silent."*  

  5. **"Nonexistent EV just means ‘very negative’ or ‘ambiguous’."**  
     - **Preempt with the $100 demo:**  
       *"It’s not ambiguous between two values; we can achieve any value. Nonexistence means no number is ‘the’ expectation."*  

  ---

  ### **(d) Closing Task (Last 5 Minutes)**  
  **Prompt:** *"Suppose we cap the player’s loss at $100 (i.e., no penalty beyond this). Does the expectation now exist? Why or why not?"*  

  **Key:**  
  - **Correct grasp:** "Yes, but it becomes \(+\infty\) because negative terms are bounded, while positives still diverge." (Reveals understanding that divergence direction matters when bounds apply).  
  - **Superficial grasp:** "No, because infinity is still involved" or "Yes, it’s finite now."  

  ---

  ### **(e) Deliberate Omissions & Stated Reasons**  
  1. **Riemann rearrangement theorem proof:**  
     - *State:* *"We’re skipping the proof that any real number can be achieved. Why? Because the takeaway isn’t the math trick—it’s that decision theory lacks a default ordering."*  

  2. **Measure-theoretic foundations (e.g., non-measurability):**  
     - *State:* *"This game’s expectation fails at the level of calculus, not advanced measure theory. We don’t need Lebesgue integration to see the problem."*  

  3. **Alternative decision rules (e.g., minimax):**  
     - *State:* *"Many workarounds exist—but today’s goal is to see how expected value, the cornerstone of your training, fractures here."*  

  ---

  ### **Your Original Query: The Capping Wrinkle**  
  **Your reasoning is correct.** Capping losses at \(L\) makes EV \(= +\infty\) (divergent positives dominate); capping winnings at \(W\) makes EV \(= -\infty\) (divergent negatives dominate). The sign depends on whose finiteness binds.  

  **But do not include this.**  
  - **Why it undoes the lesson:** It shifts focus from **"expectation undefined"** to **"infinite expectations are manipulable,"** which:  
    - Confuses undefined EV with infinite EV.  
    - Implies the problem is magnitude, not existence.  
    - Overloads students on day one.  
  - **Save it for later:** Perfect for a follow-up session on "taming infinities," once nonexistence is absorbed.  

  ---

  ### **Seminar Flow (75-Minute Timeline)**  
  1. **Intro & natural-order computation** (10 min): Define game, compute \(S_5\), reveal \(\ln 2\).  
  2. **Divergence demo** (15 min): Show absolute series \( \sum \frac{2^n}{n} \cdot \frac{1}{2^n} = \sum \frac{1}{n} \) diverges.  
  3. **Rearrangement to $100** (25 min): Students compute 2 blocks.  
  4. **Misconception Q&A** (10 min): Preempt errors from (c).  
  5. **Decision theory implications** (10 min): "What now? Ranking is impossible; frameworks break."  
  6. **Closing task** (5 min): Capped-loss question.  

  **Whiteboard Strategy:**  
  - Left: Game definition, natural-order partial sums → \(\ln 2\).  
  - Center: Absolute divergence proof.  
  - Right: Rearrangement blocks, $100 target.  
  - Bottom: Implications ("No EV!"), closing task.  

  This plan respects their training while destabilizing it just enough to reveal the void beneath expected value—without losing them to technicalities.
