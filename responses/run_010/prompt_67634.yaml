prompt: |-
  I am preparing a seminar exercise on the Hart–Devlin debate and want a case built to order rather than one of the familiar exhibits. Design a single municipal scenario — a licensing board, an occupational regulator, or a council committee, not a legislature enacting a general prohibition, and nothing technologically exotic — concerning a private, commercially organized practice that consenting adults enter into. The specifications: the practice must provoke intense and vocal moral revulsion, but that revulsion must attach to a feature of it that injures no one; a separate and severable feature must cause serious, demonstrable injury to identifiable third parties who have not consented; that injury must occur out of public view and must not fall on the participants themselves, so that neither an offense rationale nor a paternalist one is available; and no step of the reasoning may rest on contested empirical claims about social cohesion or deterrence. One paragraph for the scenario. The purpose is to show my students that each theorist's internal limits can invert the expected verdict, so the verdicts must be generated rather than declared: demonstrate that Devlin, applying his reasonable-bystander standard together with his commitments to the greatest liberty consistent with the integrity of society, to the protection of private life, and to slow legal change, is barred from suppressing the practice, while Hart's harm principle licenses an intrusive, harm-tracking intervention — compelled disclosure, audit of private contracts — that Devlin's limits would forbid. Then name the single feature doing the work, state what happens to the case if you remove it by making the object of revulsion coincide with the locus of injury, and give the strongest reply a Devlin partisan could make against the design.
reasoning: |-
  Okay, let me approach this Hart-Devlin seminar exercise request systematically. The user wants a custom-built municipal scenario that flips the expected positions of these legal philosophers, with very specific constraints. 

  First, considering the core challenge: creating a practice that simultaneously has an intrinsically revolting but harmless element, plus a severable harmful element affecting non-consenting third parties. The harm must be demonstrable but hidden, ruling out paternalism or public offense rationales. 

  Hmm... traditional vices like prostitution or sadomasochism won't work because their harms often co-locate with the revulsion. Need something where the moral disgust focuses on ritual/performance while harm stems from mundane contractual details. Funeral rites come to mind - specifically corpse desecration taboos - because the visceral reaction to mutilation is universal, while financial exploitation of grieving families could be the severable harm.

  For the municipal context, a cemetery licensing board fits perfectly. They regulate private businesses but have limited scope - no broad prohibitions. The "Thanatotic Reclamation" service checks all boxes: 
  - The revulsion attaches to ceremonial dissection (harmless if symbolic)
  - The harm comes from predatory contracts exploiting bereaved clients
  - Injury is economic and hidden in paperwork
  - No social cohesion claims needed

  Now structuring the flip: Devlin would have to tolerate the reviled ceremonies (his reasonable bystander understands symbolic acts don't threaten society's fabric) but could regulate contracts (liberty-limiting principle allows preventing concrete harm). Meanwhile Hart's harm principle demands intervening in the harmful contracts, which requires intrusive disclosure rules - exactly what Devlin's privacy protection would forbid.

  The key mechanism is decoupling symbolic revulsion from material harm. If we made the dissection real (not symbolic), Devlin could ban it, collapsing the inversion. Best Devlinian counterargument? That allowing such ceremonies normalizes contempt for the dead, eroding shared values - but this risks empirical claims about social cohesion which the exercise forbids. 

  Final polish: Ensuring every specification is hit. Municipal setting ✓, commercial consenting adults ✓, severable features ✓. Most importantly, the philosophical inversion emerges naturally from their own principles rather than being imposed.
answer: |-
  Here is the custom-built scenario and analysis meeting all specifications:

  **Scenario:** The municipal Cemetery Services Licensing Board reviews an application from "Thanatotic Reclamation," a private company offering bereaved families "therapeutic ancestral communion." Clients pay to witness a ritual where a costumed actor, representing a deceased loved one, is symbolically "dissected" on a mortuary slab while a narrator describes the "liberation of the spirit" through visceral, pseudo-medical terminology. While the ritual itself involves no actual violence or desecration (the "corpse" is a consenting actor, the "dissection" is pantomimed with props), the practice provokes profound moral revulsion in the community due to its perceived mockery of the dead and desecration of funeral rites. However, the company’s standard contract contains a hidden clause: clients unknowingly grant irrevocable power of attorney to the company’s in-house "grief counselor" for estate management, leading to documented cases of vulnerable, grieving individuals being coerced into signing over property deeds or draining savings accounts to fund additional (unwanted) services, causing severe financial ruin.

  **Analysis:**

  1.  **Devlin Forced to Tolerate the Practice:** Devlin’s "reasonable bystander" would be intensely revolted by the ritual's *symbolic desecration*. However, Devlin is committed to protecting "private life" and allowing the "maximum individual freedom" consistent with society's existence. Since the ritual involves only consenting adults in private commerce, causes no tangible harm (the disgust is non-injurious), and demonstrably doesn't *destroy* society (it's a niche service), Devlin's own principles forbid suppression. His insistence on "slow legal change" and avoiding law based purely on "intolerance, indignation, and disgust" bars the Board from denying the license based on the revolting ritual alone.
  2.  **Hart Licenses Intrusive Intervention:** Hart’s harm principle focuses on preventing *demonstrable injury to others*. The severe financial harm caused to vulnerable, non-consenting third parties via the predatory contract clause is precisely the kind of injury his principle targets. To prevent this harm, Hart would permit the Board to impose intrusive regulations: mandating *compelled disclosure* of all contract terms in plain language before signing, requiring *independent legal review* for clients, and implementing *audits of private contracts* to detect and void exploitative clauses. This intervention directly tracks and prevents the specific, verifiable harm.
  3.  **Devlin Forbids Hart’s Intervention:** Devlin’s commitment to protecting "private life" and contracts from state intrusion, combined with his view that law shouldn't micromanage non-disintegrative private agreements, means he would reject Hart’s mandated disclosures and audits as an unjustified invasion of commercial privacy and contractual freedom, *especially* since the harm stems from private dealings, not public immorality.

  **The Crucial Feature:** The **separation between the *symbolic performance* (object of intense moral revulsion, non-injurious) and the *hidden contractual mechanism* (object of mundane greed, causing severe material injury)**.

  **Removing the Key Feature:** If the object of moral revulsion *was* the source of injury (e.g., if the ritual involved *actual* non-consensual corpse mutilation causing distress to the family), Devlin could legitimately ban the core practice as destructive of society's fundamental values regarding the dead. Hart could likely also ban it as harm (psychological distress). The inversion disappears; both might converge on suppression.

  **Strongest Devlinian Counterargument:** "The Board *cannot* compartmentalize. Permitting the revolting ritual *as a commercial service*, even symbolically, actively *degrades* society's shared value of respect for the dead in a public and corrosive way. This degradation *is* an injury to society's fabric – weakening a foundational moral institution (funerary respect). Tolerating it under license makes the state complicit in this degradation. The financial harm, while real, is a separate, mundane fraud issue best handled by general consumer protection laws, not grounds for licensing this inherently disintegrative practice. Suppression is justified to prevent society's necessary shared morality from being publicly undermined and commodified." *(This relies on contesting the empirical claim that symbolic acts *don't* cause social harm/degradation, pushing against the no-contested-empirics rule, but represents the core Devlinian stance when faced with symbolic acts he deems fundamentally corrosive).*
