prompt: |-
  I have spent about twelve years in drug safety — first as a medical monitor onPhase III programmes, now running post-marketing surveillance for a mid-sized manufacturer — and my working vocabulary is entirely that of pharmacovigilance: adverse events as distinguished from adverse drug reactions, the seriousness criteria, expectedness judged against the reference safety information, background incidence in an unexposed comparator arm, attributable risk, causality assessment with its temporality and dechallenge logic, signal detection, risk minimisation plans. I have no training in philosophy and only a hobbyist's acquaintance with machine learning. A colleague on our digital side sent me a stack of AI-safety writing about "low-impact" agents and "impact measures," which I have been working through on flights, and two things strike me: the literature borrows the word side effect from my field while apparently meaning something quite different by it, and its authors seem alternately to be rediscovering problems my field worked through decades ago and to be missing problems my field has never had to face. I would like you to translate four of their central claims into my vocabulary, as faithfully as you can manage, and then tell me what did not survive the trip.

  The claims, stated in their own idiom, are these. (1) An agent's changes to the world divide into those instrumental to the task it was given and those that are not; the latter are side effects and should carry a penalty of their own, separate from any penalty for failing at the task. (2) The magnitude of such an effect can be measured without knowing anything about what is ultimately valuable, by asking how far the change reduces the agent's ability to bring about a wide variety of further outcomes later on — I believe the technical versions trade on reachability and on preserving the agent's capacity to achieve auxiliary goals, but please render them in my terms rather than theirs. (3) The penalty must be computed relative to a baseline: how the world would have unfolded had the agent not intervened, or had it simply continued whatever it was already doing. (4) Where it is unclear which changes are bad, the correct posture is conservatism — prefer the action with the smaller footprint, even at some cost to the task, up to and including taking no action at all.

  For each, give me the closest thing in my own framework: the concept, criterion, or standard practice it corresponds to, named the way I and my colleagues would name it. Then say whether the correspondence is faithful, whether it holds only once the claim has been bent out of shape, or whether my framework has nowhere to put it at all — and in the second and third cases, say precisely what was bent or what is absent. Please do not smuggle in assumptions from drug safety and present them as the translation; if a claim has no counterpart here, that is the result I want, not a licence to manufacture one from the safety literature.

  Answer in exactly five numbered items and nothing else — no preamble, no closing remarks, no summary table. Items 1 through 4 address claims (1) through (4) in order, at two or three sentences each. Item 5 answers the question I actually care about: does the residue you found suggest that drug safety possesses something this debate lacks — a fixed beneficiary, a specified indication, an observed rather than a counterfactual control arm, an external adjudicator of what counts as serious — or does it suggest that their founding question, whether "avoid side effects" can be defined without a full specification of value, was never well posed, because the medical notion they borrowed was never value-neutral in the first place? Two or three sentences, and take a side.
reasoning: |-
  Hmm, the user is a pharmacovigilance expert with 12 years of experience who's been reading AI safety literature. They're confused about how the AI field uses "side effects" differently and see parallels with drug safety concepts. They want me to translate four AI safety claims into pharmacovigilance terminology and then analyze what gets lost in translation.

  Let me break this down carefully. First, the four claims need direct translations into drug safety vocabulary. The user specified exactly how to structure the response - five numbered items with no extras. For each claim, I'll find the closest pharmacovigilance counterpart and evaluate how well it maps. Then the fifth item must answer their core question about what drug safety has that AI safety lacks.

  For claim (1): AI's "side effects" as non-instrumental changes with separate penalties. In pharmacovigilance, this resembles how we distinguish Adverse Drug Reactions (ADRs) from therapeutic failures. But ADRs are specifically harmful to patients, while AI side effects could be neutral or just inefficient - so it's a bent correspondence where "harm" gets stretched.

  For claim (2): Measuring impact without knowing ultimate value. Pharmacovigilance has no direct equivalent. We rely heavily on predefined harm criteria (seriousness, causality) and population-level incidence rates. The AI concept of preserving future options through reachability has no parallel here - that's a complete gap.

  For claim (3): Counterfactual baselines. This maps neatly to our use of comparator arms in trials and background rates in post-marketing. We constantly ask "what would've happened without the drug?" so this correspondence is faithful.

  For claim (4): Conservatism principle. This aligns perfectly with our Precautionary Principle - risk minimization even at therapeutic cost, like boxed warnings or restricted access. Direct match.

  Now for item 5: Why the gaps? Pharmacovigilance has fixed beneficiaries (patients), specified indications (diseases), and external harm adjudicators (regulatory bodies). AI safety lacks these anchors. But crucially, the medical concept of "side effect" was never value-neutral - it's intrinsically tied to human health outcomes. So the AI field's attempt to define side effects without specifying value was misguided from the start, because they borrowed a term that already contained embedded medical values.
answer: |-
  1.  Claim (1) translates to **distinguishing Adverse Drug Reactions (ADRs) from Lack of Efficacy (LoE)**, where ADRs represent unintended, potentially harmful physiological changes ("side effects") assessed separately from failure to achieve the therapeutic goal. The correspondence is bent: pharmacovigilance defines ADRs specifically as *harmful* events causally linked to the drug, whereas AI side effects include any non-instrumental change, which may be neutral or merely inefficient, not necessarily harmful.

  2.  Claim (2) has **no direct counterpart** in pharmacovigilance. Our field quantifies known harms (e.g., incidence rates, attributable risk) based on predefined, medically significant outcomes (seriousness, causality) against background rates. Measuring effect magnitude solely by how it constrains *future arbitrary outcomes* (without reference to known patient harm or therapeutic context) is absent; our impact assessment is inherently tied to predefined safety signals and patient health, not abstract future option preservation.

  3.  Claim (3) translates faithfully to **establishing background incidence rates using a comparator arm (placebo or active control) in clinical trials and epidemiological studies in post-marketing**, precisely to define the counterfactual ("what would have happened without the drug?"). Causality assessment (including temporality and dechallenge) also inherently relies on comparing the observed event to this baseline expectation.

  4.  Claim (4) translates directly to the **Precautionary Principle and Risk Minimization Activities (RMAs)**. This includes actions like implementing Risk Management Plans (RMPs), adding boxed warnings, restricting indications, or even withdrawing a drug when risks outweigh benefits—prioritizing safety over efficacy, accepting therapeutic cost to avoid harm.

  5.  The residue highlights that pharmacovigilance possesses **fixed beneficiaries (patients), specified indications (therapeutic intent), and external adjudication of seriousness/causality (regulators, CIOMS/ICH guidelines)**. This structure means our "side effect" concept was *never value-neutral*—it's intrinsically defined relative to patient harm within a specific therapeutic context. AI safety's founding question—defining "avoid side effects" without full value specification—is ill-posed because it borrowed a medical term inherently anchored in human health values it attempts to abstract away from.
