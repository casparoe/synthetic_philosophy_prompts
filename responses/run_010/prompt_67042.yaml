prompt: |-
  I direct coverage policy for a public health plan, and roughly thirty requests a month turn on whether an intervention is therapy or enhancement: our rule says we cover the treatment of disease and injury but not the improvement of capacities that already fall within normal range. Reviewers apply it inconsistently, and two failure modes recur. They deny a request as enhancement when the record actually shows the capacity is below normal for the patient's comparison group, and they smuggle in judgments about the worth of a life plan — a violinist does not need steady hands to survive — without saying that they have done so.

  Please write the procedure my reviewers will run on a single request, in half an hour, from the file alone, without specialist input. It must terminate in one of three verdicts: covered as therapy; not covered as enhancement; or escalate to the appeals committee because the remaining question is one of values rather than facts. Specify the questions in the order they should be asked, what a sufficient answer to each looks like, which question settles the case and which only narrows it, how to fix the comparison group when the relevant partition of the population is itself disputed, what to do when the file cannot answer a question at all, and how to keep the enhancement question strictly separate from the efficacy question so that a denial never rests on a claim about the evidence that the evidence does not support. Mark explicitly the points where reviewer judgment cannot be eliminated.

  Then run the procedure on three requests: propranolol for an orchestral violinist whose physiological tremor sits inside the normal population range but visibly degrades her bowing; methylphenidate for a night-shift paramedic with no ADHD diagnosis who requests it after two near-miss medication errors; and growth hormone for a twelve-year-old boy at the third percentile for height with no endocrine abnormality. I expect at least one of these to come out in a direction I will not like; state that plainly rather than bending the procedure to reach a comfortable verdict.

  Lead each worked case with its one-line verdict before the reasoning, and keep the whole document under 1,100 words.
reasoning: |-
  Okay, let me tackle this complex query about designing a coverage policy procedure. The user directs a public health plan and needs a standardized method to distinguish therapy from enhancement - covering disease treatment but not normal-range improvements. They've identified two key failure modes: misclassifying sub-normal capacity as enhancement, and covert value judgments about life plans.

  Hmm, the core challenge is creating a fact-based procedure that separates objective capacity assessment from subjective worth judgments. I need to design a step-by-step process that reviewers can complete in 30 minutes using only file documentation. The procedure must output one of three clear verdicts: therapy coverage, enhancement denial, or values-based escalation.

  Key requirements are surfacing explicitly where judgment is unavoidable, handling disputed comparison groups, dealing with incomplete files, and strictly separating capacity assessment from efficacy considerations. The user specifically wants no bending of rules for "comfortable" outcomes.

  For the procedure design, I'm considering a decision tree approach:
  - First establish capacity deficit (therapy gateway)
  - Then verify non-covered conditions
  - Finally handle ambiguous cases

  Critical judgment points will include:
  - Defining "normal range" for comparison groups
  - Interpreting functional impairment evidence
  - Distinguishing capacity deficits from performance desires

  The three test cases are deliberately thorny:
  1) Propranolol for violinist's normal-range tremor
  2) Methylphenidate for non-ADHD paramedic's alertness
  3) Growth hormone for short-statured child

  I anticipate the violinist case may produce an uncomfortable denial since the tremor falls within normal range despite professional impact. The procedure must hold firm on that if the facts align.

  For implementation, I'll structure:
  - Sequential yes/no questions
  - Clear decision points
  - Explicit "judgment required" flags
  - Handling missing data protocols
  - Strict separation of capacity vs efficacy

  The worked examples will show how the rules apply even when outcomes seem harsh - like denying the violinist while escalating the paramedic case due to values questions about essential job functions.
answer: |-
  ## Coverage Determination Procedure for Therapy vs. Enhancement

  **Purpose:** To determine coverage eligibility based solely on whether an intervention treats a disease/injury (Therapy) or improves a capacity within normal range (Enhancement), avoiding inconsistent application and specified failure modes.

  **Procedure (Executable within 30 mins using file only):**

  1.  **Question 1: Does the documented condition represent a diagnosed Disease or Injury?**
      *   *Sufficient Answer:* Explicit diagnosis per ICD/DSM or clear evidence of traumatic injury in the medical record. (e.g., "Diagnosis: Major Depressive Disorder," "Fractured Tibia").
      *   *Settles the Case:* If **Yes**, verdict = **Covered as Therapy**. Stop. If **No**, proceed to Q2.
      *   *Judgment Point:* Interpreting medical documentation for a clear diagnosis. If unclear or conflicting, proceed to Q2.

  2.  **Question 2: Is there objective evidence the relevant capacity falls below the normal range for the patient's comparison group?**
      *   *Sufficient Answer:* Quantitative data (test scores, lab values, functional measures) compared against an established reference range *for the relevant comparison group*. Subjective complaints alone are insufficient. Evidence must show the capacity is *below* the lower limit of normal.
      *   *Narrows the Case:* If **Yes**, proceed to Q3. If **No**, verdict = **Not Covered as Enhancement**. Stop. If file lacks sufficient data, verdict = **Escalate to Appeals Committee** (Unresolvable factual gap).
      *   *Defining Comparison Group:*
          *   Default: Age and sex-matched population using standard medical reference ranges (e.g., lab norms, growth charts, standard cognitive/functional tests).
          *   If disputed/context-specific (e.g., occupation, specific subpopulation): Reviewer must identify the most relevant *medically established* reference group based *solely* on objective factors documented in the file (e.g., occupation listed, confirmed genetic syndrome). **Judgment Point:** Selecting the most appropriate *medically recognized* comparison group when multiple exist. Avoid defining novel groups. If no medically established group is documented or discernible, use the default age/sex group.
      *   *Judgment Point:* Interpreting whether provided data is "objective" and sufficient to demonstrate capacity falls *below* the defined normal range. Assessing if the data directly measures the capacity in question.

  3.  **Question 3: Is the requested intervention specifically intended and clinically established to treat the identified sub-normal capacity?**
      *   *Sufficient Answer:* Documentation linking the intervention directly to correcting the sub-normal capacity (e.g., "Propranolol prescribed to reduce pathological tremor," "PT for gait impairment"). Standard clinical guidelines supporting the use for that specific deficit.
      *   *Settles the Case:* If **Yes**, verdict = **Covered as Therapy**. If **No**, verdict = **Not Covered as Enhancement**. Stop.
      *   *Critical Separation (Efficacy vs. Enhancement):* This question is **ONLY** about the *intended purpose* for *this patient's documented deficit*. **DO NOT** evaluate the *strength* of evidence for efficacy or likelihood of success. If the purpose is documented as treating the deficit, and Q2 is Yes, it qualifies as Therapy *even if evidence for efficacy is weak*. Efficacy disputes belong to separate utilization management, not this gateway determination. Denial here is *only* if the intervention's documented purpose is clearly for enhancement *despite* the deficit (e.g., "Methylphenidate requested to boost focus beyond normal baseline for exams" despite documented ADHD deficit).

  **Key Rules:**
  *   **No Value Judgments:** Never consider the "worth" of the patient's life, goals, or occupation beyond using documented occupation *only* to define a comparison group if medically established norms exist for it. "Needing steady hands to be a violinist" is irrelevant; only whether the hand steadiness capacity is below normal *for the violinist's relevant comparison group* matters.
  *   **Missing Data:** If the file lacks information critical to answering Q1 or Q2, and the answer cannot be determined, verdict = **Escalate to Appeals Committee** (Unresolvable factual gap).
  *   **Values Disputes:** If the core disagreement hinges on *which* comparison group is appropriate (where multiple medically valid groups exist) or the inherent *desirability* of a capacity level (e.g., what constitutes a "normal" height for well-being beyond medical function), verdict = **Escalate to Appeals Committee** (Values question).

  ---

  ## Worked Cases

  **Case 1: Propranolol for Orchestral Violinist**
  *   **Verdict:** Not Covered as Enhancement
  *   **Reasoning:**
      1.  Q1: No documented disease or injury diagnosis (e.g., Essential Tremor, Parkinson's). Physiological tremor noted, but within normal population range.
      2.  Q2: *Crucial Step*. Capacity: Hand Steadiness. Comparison Group: Default age/sex-matched population (as no *medically established* "orchestral violinist" reference range exists). File states tremor is "within normal population range." Therefore, objective evidence shows capacity is **NOT** below normal for the comparison group. **Verdict = Not Covered as Enhancement.** Stop.
      *   *Judgment Applied:* Using the default comparison group due to lack of a medically established occupation-specific norm. Not considering the functional impact on bowing as proof of sub-normal capacity *relative to her group* (the data says it's within normal limits). **Comment:** This denial may feel uncomfortable as the tremor clearly impacts her profession, but the procedure strictly relies on the documented objective fact (within normal range) against the default medically recognized group.

  **Case 2: Methylphenidate for Night-Shift Paramedic**
  *   **Verdict:** Escalate to Appeals Committee
  *   **Reasoning:**
      1.  Q1: No documented disease or injury diagnosis (e.g., ADHD, Narcolepsy). File notes "no ADHD diagnosis" and near-miss errors attributed to fatigue.
      2.  Q2: Capacity: Sustained Attention/Vigilance (implied by near-misses). Comparison Group: Disputed. Is it the general population? Or medically established norms for shift workers/paramedics? File lacks objective test data (e.g., PVT scores compared to shift-work norms). Only subjective report of errors exists. *Result:* Insufficient objective data in file to definitively answer Q2. **Verdict = Escalate to Appeals Committee** (Unresolvable factual gap - missing objective capacity assessment relative to a group). *Alternatively, if reviewer judges no medically established paramedic/shift-worker norm exists and uses default group, but finds no data showing capacity is below default normal range, verdict would be Not Covered. However, lack of any objective data makes Escalate the safer call per procedure.*
      *   *Judgment Applied:* Determining the relevant comparison group is ambiguous and lacks clear medical norms. Assessing the file lacks sufficient *objective* evidence of sub-normal capacity for *any* group. **Comment:** This highlights the difficulty of proving sub-normal capacity without testing. The core issue (capacity level relative to job demands) becomes entangled with values about essential occupational function.

  **Case 3: Growth Hormone for 12-year-old boy at 3rd percentile**
  *   **Verdict:** Not Covered as Enhancement
  *   **Reasoning:**
      1.  Q1: No documented disease or injury diagnosis (e.g., Growth Hormone Deficiency, Turner Syndrome). File explicitly states "no endocrine abnormality."
      2.  Q2: Capacity: Height/Linear Growth. Comparison Group: Age and sex-matched population (standard pediatric growth charts). File states height is at the 3rd percentile. The "normal range" for height is typically defined as between the 3rd and 97th percentiles. Being *at* the 3rd percentile is **within** the normal range by standard medical definition. Therefore, objective evidence shows capacity is **NOT** below normal. **Verdict = Not Covered as Enhancement.** Stop.
      *   *Judgment Applied:* Using standard pediatric growth charts as the medically established comparison group. Interpreting "3rd percentile" as falling *within* the defined normal range. **Comment:** While short stature can cause distress, the absence of a diagnosed pathology and presence within the defined normal range dictates denial under this strict therapy/enhancement rule.

