            7. Teams can have only one chain at a time.
            8. There is no limit on the number of challenges to a chain.

          Phase-by-phase timeline for 50 minutes:

          Phase 1: Introduction (5 minutes)
            What happens: Facilitator explains the game and rules.
            Facilitator says: "Today we're playing a game about why we believe what we believe. Each team has a claim to defend. You'll build a chain of reasons. Other teams can challenge any reason by asking 'who says so?' and spending a token. Defend your chain to earn tokens. If you can't defend, your chain breaks and you start over."

          Phase 2: Setup (5 minutes)
            What happens: Divide into 4 teams (5 students each). Distribute claim cards and tokens (3 tokens per team). 
            Facilitator says: "Here are your claim cards and tokens. You have 5 minutes to think about how you might support your claim."

          Phase 3: Gameplay (25 minutes)
            What happens: Teams build chains (on a poster? or just orally? We need to make it visible. Let's say each team has a whiteboard or poster to write their claim and then add links as they are challenged? Or they can build proactively? The rules only require building when challenged? But they can pre-build? How about: 
              - Teams start by writing their claim on a whiteboard.
              - Then, they can be challenged on that claim. 
              - If they haven't built any links, then the claim itself is the first link? And when challenged on it, they must provide a new link (the first support).
            Facilitator says: "Start building your chains. Remember, you can be challenged on any link at any time. If you want to challenge, raise your hand and state which team and which link you are challenging."

            The facilitator will manage challenges: 
              - When a team wants to challenge, they announce: "We challenge [team name] on [quote the link]." 
              - The challenged team must then provide a new supporting claim within 30 seconds (or a reasonable time). 
              - The facilitator then enforces the token exchange.

          Phase 4: Wind-down (5 minutes)
            What happens: Facilitator announces that the game is ending. Teams finish their current challenge and then stop.
            Facilitator says: "Wrap up your current chains and challenges. We'll stop in one minute."

          Phase 5: Debrief (10 minutes)
            Facilitator asks debrief questions.

          Debrief questions (order matters):

            1. What was the hardest part of defending your claim?
               Should surface: the endlessness of the "why" questions.

            2. Did anyone find a way to stop the questioning? How?
               Should surface: foundationalism (by using an unchallengeable claim) or running out of tokens.

            3. Did anyone see a chain that circled back on itself? Did it work?
               Should surface: coherentism.

            4. What happened when a team kept deferring to new reasons indefinitely?
               Should surface: infinitism.

            5. In real nursing practice, where do we usually stop asking "why"?
               Should surface: practical constraints, time, authority, evidence.

          Strategies that emerge array:

            1. Foundationalism:
               Behavior: Teams defend a claim with an authority or self-report and then refuse to go further (or can't). 
               Which view: foundationalism.
               How to spot: They use claims like "because the patient said so" or "it's policy" and then if challenged again on that, they struggle or break.

            2. Coherentism:
               Behavior: Teams create a loop in their chain (even if indirect) and hope it goes unnoticed.
               Which view: coherentism.
               How to spot: The chain eventually references an earlier claim.

            3. Infinitism:
               Behavior: Teams keep inventing new reasons without stopping or circling.
               Which view: infinitism.
               How to spot: Their chain grows very long and they never run out of reasons.

          Failure modes:

            1. What goes wrong: Teams are hesitant to challenge because they don't want to spend tokens.
               Why: They might be risk-averse.
               Fix: Encourage them to challenge by reminding them they can earn tokens if they break a chain.

            2. What goes wrong: A team cannot think of a new link and the chain breaks repeatedly, causing frustration.
               Why: The claim might be too hard or they are stuck.
               Fix: Allow them to swap claims with another team? Or give them a hint? Or reduce the time to respond.

            3. What goes wrong: Arguments erupt over what counts as a valid backing.
               Why: Lack of clear criteria.
               Fix: Remind them that any reason is acceptable as long as it is a reason, and the focus is on the structure, not the truth.

          Budget stopping (token exhaustion as a stopping condition) verdict:

            Verdict: real_fourth_option
            Argument: In real-world inquiry, we stop asking "why" for practical reasons (time, resources, energy), not necessarily because we hit bedrock or a circle. This is a legitimate fourth way for the regress to end.
            What to tell the class: "Sometimes the chain of reasons stops not because we found a final answer, but because we ran out of resources to keep asking. That's a practical constraint we all face."

          Cannot reproduce:

            Feature: The game cannot reproduce the normative force of foundationalism or coherentism. In philosophy, these are justified as valid ways to stop the regress, not just pragmatic or psychological.
            Why the game misses it: The game treats all stopping points as moves in a game; it doesn't establish that some claims are truly foundational or that circularity is sometimes valid.
            What to say instead: "In philosophy, foundationalism argues that some claims don't need further backing because they are self-evident or based on direct experience. Coherentism argues that circularity is acceptable if the beliefs mutually support each other in a web. Our game doesn't judge which strategy is correct, but it shows how we try to stop the regress."

