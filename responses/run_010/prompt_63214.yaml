prompt: |-
  Before anything else: the thing I want my students to feel is that every answer to "why?" invites another "why?", and that you then have only three places to go — stop somewhere, loop back on yourself, or keep handing off forever. Context: I run a weekly 50-minute critical-thinking lab for 20 second-year nursing students. They're sharp, they have zero philosophy background, and they have zero patience for terminology. Nobody should hear the words foundationalism, coherentism or infinitism until the last five minutes.

  Here's the shape I have in mind and I want you to make it actually playable:

  - The class runs a challenge game. Small teams get a claim card (things like "turn the patient every two hours," "the patient's own account of their pain outranks the family's," "a 0-to-10 scale is a legitimate measure," "a physician's order is itself a reason to act") and any other team can challenge any link in their supporting chain with "who says so?" A challenged link has to be backed by a new link or the chain dies.
  - I want a paper-token economy, nothing worth real money: challenging costs tokens, successfully backing a link earns them, and there's a shared pool that refills. The whole point of the refilling pool is that a team can defer indefinitely and never lose — I want at least one group to discover on their own that they don't have to finish the chain in order to satisfy the task.
  - By the end, teams should have visibly settled into three different strategies: planting something unchallengeable, letting a chain circle back and getting away with it, and just never arriving.

  Give me full rules and a phase-by-phase timeline for 50 minutes, the token scheme with actual numbers, six-ish claim cards (one of them a trap where the only honest stopping point is somebody's own first-person report), the debrief questions in the order I should ask them, and what will predictably go wrong the first time I run this.

  Also be straight with me on one thing. My budget makes some chains stop simply because the group ran out of tokens, not because they hit anything. Is that a seperate, philosophically interesting way for a regress to end — a genuine fourth option, roughly "it stops because we stopped" — or is it just an artifact of my game that I should own up to rather than dress up? And tell me which feature of the real views the activity can't reproduce, so I know what I have to supply by hand at the end.

  Return the whole thing as a single JSON object with no prose around it, using exactly these fields:

  - activity_title: string
  - setup: object with group_size, minutes, materials, room_arrangement
  - phases: array of {name, minutes, what_happens, facilitator_says}
  - rules: array of strings
  - token_economy: object with earn, spend, shared_pool_refill, what_running_out_does
  - claim_cards: array of {claim, why_its_included, likely_terminal_node}
  - strategies_that_emerge: array of {behavior_in_room, which_view_it_maps_to, how_i_spot_it}
  - debrief: array of {order, question, what_it_should_surface}
  - failure_modes: array of {what_goes_wrong, why, fix_in_the_moment}
  - budget_stopping: object with verdict (one of: real_fourth_option / artifact / partly_artifact), argument, what_to_tell_the_class
  - cannot_reproduce: array of {feature, why_the_game_misses_it, what_i_say_instead}

  Keep every value tight — a sentence or two, not paragraphs.
