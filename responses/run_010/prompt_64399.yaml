prompt: |-
  Next term our second-year philosophy of mind course devotes a week to the split-brain cases and what they are supposed to show about the unity of consciousness, and I have been assigned the section. I am not asking for an exposition of the material; I want a plan for building it in the room, and I want it answerable in the terms I set out below.

  Three constraints govern the session. First, I have fifty minutes, a whiteboard, and nothing else: no slides, and specifically none of the film footage of the classic experiments, which is the device everyone normally reaches for, so the plan must work without it. Second, the students have done the assigned reading and have already sorted themselves into two roughly equal camps. One camp holds that a commissurotomy patient is literally two conscious subjects sharing a single body, and that the discipline should say so plainly. The other holds that the dissociations are artefacts of an apparatus that never obtains outside the laboratory and therefore establish nothing about consciousness. Third, my objective is not to referee between these camps but to make both see that each has skipped the step that actually decides the question. The students have had one lecture on hemispheric lateralization from the psychology department and no neuroscience beyond it.

  What I need:

  1. The order of the components, with the dependency structure made explicit: which claim must be secured before which further claim can even be stated, and why. Mark in particular the point at which the session crosses from "the two hemispheres can be shown to process information independently" to anything resembling a claim about experience, and say what has to be true before that crossing is legitimate.

  2. One carrying case — a single scenario I can draw on the board, develop, and return to throughout, rather than a tour of paradigms. State what features it must have to bear the weight and what features it must lack. Then tell me whether the obvious candidate (a stimulus confined to one visual field, with a verbal report that contradicts a simultaneously correct response by the hand controlled by the other hemisphere) is the right carrier or a trap; if it is a trap, say what any replacement would have to preserve, and note what I lose by not using the everyday anecdotes about the two hands working at cross purposes.

  3. A misconception map. Beyond the two camps above, identify the errors the students will generate in the course of my own explanation as a by-product of it — for example the inference that the hemisphere without speech is thereby without experience, the assumption that whatever integrates the intact brain must be the corpus callosum and nothing more, the belief that these patients' apparent ordinariness is explained by their having learned to compensate, and the treatment of one hemisphere's confabulated account as a report about the other's states. For each, give the point in the sequence at which it should be headed off and the sentence or two that heads it off.

  4. The one thing the session must not slide past: why the disunity, if it is disunity, surfaces only under engineered conditions. I want a formulation I can deliver aloud that does not concede the second camp's dismissal and does not overclaim on the first camp's behalf, together with an explanation of why that formulation is the honest one.

  5. A closing check — a single question put to the room whose answers discriminate between students who have grasped the question and students who have merely picked a side. Describe what a good answer looks like and what a diagnostic bad answer looks like.

  6. What I should decline outright and announce as declined, rather than gesture at: including the dispute over how many persons one of these patients is, which would consume the hour if admitted, and any other component you judge to be unteachable in this format without doing damage to it.
reasoning: |-
  Hmm, the user is teaching a philosophy of mind course on split-brain cases and needs a lesson plan that works within strict constraints. They've got 50 minutes, only a whiteboard, and students divided into two camps: one believing split-brain patients have two consciousnesses, the other dismissing the phenomena as lab artifacts. 

  The core challenge is getting students to see they're both skipping a crucial step - the inference from behavioral dissociation to conscious disunity. The students have basic psych background but no deep neuroscience. Interesting how they explicitly want to avoid refereeing while forcing both sides to confront their methodological blind spot.

  Key requirements: 
  First, the sequence must build carefully from observable dissociation to claims about experience, with clear prerequisites for that leap. The crossing point needs special marking - probably where we move from "hemispheres process independently" to "therefore dual consciousness exists". 

  Second, they want one central scenario rather than multiple examples. The classic visual-field experiment might be problematic because it tempts students to conflate reportability with consciousness. Maybe a tactile scenario would avoid some pitfalls? Though we'd lose the vividness of hand conflict anecdotes.

  Third, anticipating misconceptions is critical. The big ones seem to be: equating speechlessness with lack of consciousness, overattributing integration solely to corpus callosum, misinterpreting confabulation, and overreading compensation narratives. Each needs a specific preemptive strike at the right moment.

  Fourth, the elephant in the room: why disunity appears only in lab conditions. Need a formulation that preserves the phenomenon's significance without overclaiming - perhaps emphasizing how the callosum isn't the only integration mechanism, but its absence creates fragility under controlled pressure.

  Fifth, the closing check question should expose whether they've grasped the inference problem versus just regurgitating camp positions. Something like "What would falsify your view?" could work - good answers would attack their own position's assumptions.

  Finally, must firmly exclude the personhood debate and other rabbit holes. The user's right - that would swallow the whole session.

  Noticing how the user thinks like an architect - all about load-bearing structures and avoiding collapse points. The plan needs the same rigor: every element must serve the central objective while preventing predictable failures. Their restraint about not using video is wise - forces conceptual clarity over dramatic footage.

  The real subtlety lies in not letting either camp feel vindicated prematurely. The "two subjects" group must confront why unity persists outside lab; the "artifacts" group must explain why dissociation occurs at all. The tightrope walk is making both uncomfortable with their own assumptions.
answer: |-
  Here’s a battle-tested plan designed for your constraints, targeting the precise gap in student reasoning:

  ### 1. Sequence & Dependencies  
  *(Whiteboard: Progressive left-to-right columns)*  
  **Column 1: Observable Dissociation (12 mins)**  
  - *Start:* Draw a schematic head (top-down), split hemispheres, label LVF/RVF, left/right hand.  
  - *Secure:* "Under lab conditions, one hemisphere receives input → contralateral hand responds correctly, *but* ipsilateral hand/verbal report fails/shows ignorance."  
  - *Dependency:* Establish uncontested empirical baseline *before* interpretation. Students agree on dissociation *here*.  

  **Column 2: The Inference Gap (18 mins)**  
  - *Crossing Point:* "What licenses moving from *'processing is independent'* to *'consciousness is disunified'*?"  
  - *Prerequisite:* Clarify **Neural Plausibility + Phenomenal Opacity**:  
    - *Neural:* Hemispheres have neural correlates for distinct conscious states (cite reading: e.g., left hemisphere language, right hemisphere spatial).  
    - *Opacity:* No access principle (A’s neural state ≠ B’s experience; we infer from behavior/reports).  
  - *Why Legitimate?* Only after establishing that (a) each hemisphere can independently support functions linked to consciousness, and (b) reports/behaviors reveal *mutually inaccessible* content.  

  **Column 3: The Unity Question (15 mins)**  
  - *Claim:* "The real issue: Does independence under dissociation imply *two subjects*, or reveal a *fragile unity*?"  
  - *Key:* Frame as "What sustains unity in the *intact* brain?"  

  ---

  ### 2. Carrying Case: **Tactile Object ID**  
  *Why not visual?* The classic visual test tempts speech/report confounds (right hemisphere "mute"?), and fuels "two persons" debates.  

  **Tactile Alternative:**  
  - *Scenario:* Patient’s left hand (right hemisphere) feels key in bag, retrieves it correctly. Verbal report (left hemisphere): "I feel nothing."  
  - *Required Features:*  
    - Co-present stimuli (one hemisphere engaged, one "idle").  
    - *Contradictory outputs* (verbal vs. motor) from *simultaneous* tasks.  
    - No linguistic bias (avoids "mute hemisphere" error).  
  - *Forbidden Features:*  
    - Anthropomorphic language ("The right hemisphere knows...").  
    - Conflict outside lab (initially; address later).  
  - *Loss Avoided:* By skipping "hands fighting" anecdotes, you sidestep comedy/distraction but preserve the core dissociation logic.  

  ---

  ### 3. Misconception Map & Preemption  

  | **Misconception** | **Preemption Point** | **Killer Sentence** |
  |-------------------|-----------------------|----------------------|
  | "Non-verbal hemisphere = unconscious" | Column 2 (Opacity) | "Absence of report ≠ absence of experience: ask if you’re unconscious of your headache when not mentioning it." |  
  | "Callosum solely explains unity" | Column 3 (Unity Question) | "If cutting callosum *disrupts* unity, does that mean it *creates* unity? Or is it one of many integration systems (subcortical, sensorimotor)?" |  
  | "Confabulation = reporting other hemisphere" | Column 1 (after scenario) | "When LH says ‘I chose this key,’ it’s interpreting *its own* confusion—not accessing RH’s mind. Draw a firewall." |  
  | "Ordinary life proves compensation" | Column 3 | "Compensation explains *behavioral* coherence, not whether unity is preserved or reconfigured. A well-trained octopus isn’t unified." |  

  ---

  ### 4. The Critical Formulation: Why Only in Lab?  
  **Aloud:**  
  > "The dissociations surface in labs not because they're *artificial*, but because the lab *isolates* systems that normally interact redundantly. In life, cross-cueing (head turns, self-touch, context) masks the independence. The callosum isn’t the *source* of unity—it’s a critical channel whose loss *exposes* how fragile our default integration is when stressed."  

  **Why Honest:**  
  - Validates Camp 1: Dissociation reveals latent disunity.  
  - Validates Camp 2: Outside lab, integration mechanisms *are* robust.  
  - Neither "two subjects" nor "nothing to see" wins—it reframes unity as *dynamic and graded*.  

  ---

  ### 5. Closing Check  
  **Question:** *"If we proved both hemispheres could independently perform a self-recognition task (e.g., mirror test), would that settle whether there’s one subject or two? Why/why not?"*  

  - **Good Answer:** Grapples with inference gap. "No—it shows independent *processing*, but subjectivity depends on whether these processes are *integrated into a single perspective*. We’d need to test if recognition is mutually inaccessible."  
  - **Diagnostic Bad Answer:** Assumes equivalence. "Yes—two selves!" (Camp 1) or "No—it’s still one person compensating" (Camp 2).  

  ---

  ### 6. What to Explicitly Exclude  
  **Declare upfront:**  
  - "We *will not* discuss whether split-brain patients are 'two persons.' That’s a metaphysical debate requiring concepts (e.g., personal identity) we lack time to unpack. Our focus: *what the dissociation says about the architecture of consciousness*."  
  - **Also exclude:**  
    - Animal consciousness extrapolations.  
    - Pathology comparisons (e.g., dementia).  
    - Quantum theories of consciousness.  

  ### Session Flow Cadence  
  - 0-12min: Column 1 (Tactile scenario + dissociation baseline).  
  - 12-30min: Column 2 (Inference gap, preempting misconceptions).  
  - 30-45min: Column 3 (Unity question, lab/life distinction).  
  - 45-50min: Closing check + synthesis.  

  **Core Discipline:** Treat the whiteboard as a scaffolding tool. Annotate each column’s dependencies (e.g., "Column 2 rests on accepting Column 1’s data"). Force students to articulate *how* they jump the gap—then show why both camps skip the scaffolding.
