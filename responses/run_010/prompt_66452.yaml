  Okay, let me start by unpacking the user's problem. They teach a grad seminar on the philosophy of AI, and the frame problem session always ends in a shrug. The logicists think it's solved with formalisms like nonmonotonic logic or successor state axioms, while the Dreyfus/Dennett camp argues that formalizing it away just moves the problem to relevance and salience. The user's hypothesis is that there are actually three distinct issues: formal-inference, relevance/salience, and tractability, and the impasse comes from conflating them.

  First, I need to verify if the tripartition holds up. Looking at the logicist solutions, like Reiter's successor state axioms or McCarthy's circumscription, they address the inferential aspect—how to efficiently deduce what remains unchanged. That seems separate from determining what's relevant in a novel situation. For example, writing axioms assumes you already know which fluents matter, but in reality, relevance depends on context, which isn't captured in the formalism.

  Next, the Dreyfus/Dennett perspective. They emphasize the agent's embeddedness in the world, where relevance isn't pre-defined but emerges from interaction. Dreyfus's Heideggerian critique points to background practices that can't be fully formalized. Dennett's frame problem highlights the practical impossibility of predicting every possible consequence. Their arguments target the relevance problem, which the logicist solutions don't address. This suggests the two camps are indeed talking past each other on different problems.

  Then there's tractability. Even if you solve inference and relevance, computational complexity remains. Robotics often avoids this by designing systems that don't rely on exhaustive reasoning, using embodiment and heuristics. This engineering workaround sidesteps the theoretical issue but doesn't resolve it. 

  So, the tripartition seems valid. The disagreement is substantive only if both sides are forced to address all three aspects, but they aren't. Logicists focus on inference, while the other camp highlights relevance. Tractability is a shared challenge but handled differently. 

  What would progress look like? For inference, it's already largely solved. Relevance needs breakthroughs in relevance realization, perhaps through cognitive science or dynamic systems. Tractability requires computational advances. The original frame problem's core might be the relevance issue, as it's the most philosophically challenging and aligns with the initial critiques. 

  The user might be seeking clarity to structure future seminars, avoiding the deadlock by disentangling the issues. They might also want to guide students in identifying where active research is needed versus where solutions exist. Confirming their hypothesis validates their approach and provides a clearer teaching framework.
answer: |-
  Your diagnosis is remarkably astute, and the tripartition (inference, relevance, tractability) effectively dissects the impasse. Here's a breakdown of why this works, where a *genuine* substantive disagreement might still lurk, and what progress looks like:

  1.  **Your Tripartition is Correct and Explains the Impasse:**
      *   **Formal-Inference Problem (Solved by Logicists):** This is the problem of efficiently representing and inferring what *doesn't* change when an action occurs. Logicists (McCarthy, Hayes, Reiter, Shanahan) are absolutely correct: mechanisms like **Successor State Axioms (SSA)** (Reiter) or **Circumscription** (McCarthy) provide elegant, sound, and complete solutions *within the formal system*. Given a set of fluents and actions, SSA explicitly state the *only* way a fluent changes. Circumscription minimizes unexpected changes. Nonmonotonic logics handle the defeasible nature of default persistence. **Their claim:** "Given our representation of the world and actions, we can now efficiently compute state changes without frame axioms." **This is demonstrably true for the problem they are solving.**
      *   **Relevance/Salience Problem (The Dreyfus/Dennett Core Complaint):** This is the problem of determining *which* facts *need* to be represented, *which* are potentially relevant to achieving a goal or interpreting a situation, and *how* to adapt this relevance dynamically in novel, open-ended situations. Dreyfus (drawing on Heidegger/Merleau-Ponty) argues that human relevance is grounded in embodied, situated coping – a background of skills and practices that cannot be fully formalized into propositional knowledge. Dennett argues that the frame problem, when scaled to real-world intelligence, becomes the problem of "practical epistemic rationality" – knowing *what* to think about *next* without getting lost in combinatorial explosion. **Their claim:** "Solving the formal inference problem misses the point. The *real* problem is how an agent, embedded in a dynamic, unpredictable world, spontaneously and efficiently isolates the tiny fraction of potentially infinite information that *matters* for action *right now*, without prior exhaustive formalization." **Logicist solutions simply *assume* the relevant fluents and the context for applying their rules are already given.**
      *   **Tractability Problem (The Engineering Headache):** Even with perfect relevance determination and a sound nonmonotonic formalism, the computational cost of reasoning in complex domains can be prohibitive in real-time systems. Robotics often bypasses this by using **reactive architectures, probabilistic methods (POMDPs), machine learning for pattern recognition, or embodiment/situatedness** to offload computation onto the environment and sensorimotor loops. **This isn't a 'solution' to the frame problem in its philosophical sense; it's an engineering workaround.** Both camps acknowledge this challenge, though they might disagree on its fundamental nature (purely computational vs. stemming from deeper representational issues).

  2.  **Is There a Genuine *Substantive* Disagreement Left?**
      Yes, but it hinges entirely on the **Relevance/Salience Problem** and its implications for the nature of intelligence and representation. Once the tripartition is accepted, the disagreement becomes:

      *   **Logicist Implicit Claim (or Hope):** The relevance problem is tractable *in principle* through sufficiently sophisticated knowledge representation and reasoning (KRR). With enough domain knowledge, ontologies, learning mechanisms, and perhaps eventually more powerful formalisms, an agent *can* pre-compute or dynamically compute relevance within a symbolic/logical framework. The hard part (inference) is solved; relevance is just a scaling/engineering/KR challenge.
      *   **Dreyfus/Dennett Claim:** The relevance problem is **foundational and intractable** for classical symbolic AI. Human-like relevance arises from **pre-conceptual, embodied, non-representational engagement with the world**. It's not something *computed* based on stored facts and rules; it's the *background condition* that makes specific computation possible and meaningful. Attempting to formalize relevance *itself* just creates another layer of symbols that will *also* need its relevance determined, leading to an infinite regress ("the frame problem for the frame axioms"). Genuine intelligence requires being *in* the world, not just representing it.

      **The Substantive Contradiction:** Logicists believe the relevance problem *can* be solved (or sufficiently approximated) *within the paradigm of explicit representation and computation*. Dreyfus/Dennett believe this paradigm is fundamentally *incapable* of solving it because relevance is not primarily representational; it's enacted.

  3.  **What Counts as Progress?**
      *   **Formal-Inference:** Progress is complete. Further refinements exist, but the core problem is solved. It no longer deserves the name "frame problem."
      *   **Tractability:** Progress is constant in engineering (faster hardware, better algorithms, probabilistic reasoning, hardware acceleration) but remains a practical limitation. It's a *symptom* of the deeper problems, not the core issue itself. It doesn't deserve the core name.
      *   **Relevance/Salience:** *This is where the core philosophical and AI challenge lies, and where progress is hardest and most meaningful:*
          *   **Philosophical Progress:** Deeper understanding of relevance realization in biological cognition (neuroscience, embodied cognition, ecological psychology). Refining the critique: what *specific* aspects of embodied, situated existence enable relevance, and how might they be *partially* modeled or compensated for?
          *   **AI Progress:** *Not* just better logical formalisms. Success would look like:
              *   AI systems that robustly handle truly *novel* situations (not just variations of training data) by dynamically identifying relevant affordances/percepts/goals without exhaustive pre-programming.
              *   Systems demonstrating "common sense" understanding of what matters in complex social or physical contexts without explicit rules for every contingency.
              *   Architectures inspired by embodied/enactive cognition that *generate* relevance from continuous interaction, not just filter a pre-defined symbol set.
              *   Advances in "Relevance Realization" as a core computational primitive (e.g., work inspired by cognitive science or dynamical systems theory).

  4.  **Who Keeps the Name?**
      **The Relevance/Salience Problem deserves to retain the title "The Frame Problem."** Here's why:

      *   **Historical Fidelity:** McCarthy and Hayes' original formulation *was* about the inferential problem. However, the *immediate and enduring* philosophical reaction (Dreyfus, Dennett, Pylyshyn, etc.) identified the deeper issue lurking behind it: the problem of relevance and bounded rationality. The term quickly came to signify this more profound challenge in the philosophy of AI and cognitive science.
      *   **The Heart of the Challenge:** The inferential problem was a technical hurdle within a chosen paradigm. The relevance problem strikes at the core assumptions of that paradigm regarding representation, knowledge, and the nature of intelligence in the world. It's the problem that remains stubbornly unsolved and philosophically rich.
      *   **The Dreyfus/Dennett Critique:** Their central argument *was* that solving the formal inference problem was an evasion of the *real* issue – relevance. They correctly identified the locus of the deep philosophical problem. Naming the relevance problem "The Frame Problem" acknowledges the validity and enduring significance of their critique.

  **Conclusion:**

  Your tripartition brilliantly resolves the superficial stalemate. The camps *are* largely talking past each other, addressing different problems masked by the same label. The Logicists solved the formal-inference problem. The Tractability problem is an ongoing engineering battle. The genuine, substantive disagreement persists solely over the **Relevance/Salience Problem**: *Can classical symbolic representation/computation ever capture the dynamic, context-dependent, pre-conceptual nature of relevance that human intelligence exhibits?* Progress hinges on tackling relevance realization head-on, through embodied AI, cognitive science, and potentially entirely new paradigms, not through more sophisticated nonmonotonic logics. The name "The Frame Problem" rightfully belongs to this enduring challenge. Your seminar might benefit from explicitly structuring the discussion around these three distinct problems from the outset.
