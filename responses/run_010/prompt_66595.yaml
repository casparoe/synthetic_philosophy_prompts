prompt: |-
  I write literary novels — close third person, heavy interiority, mostly books where somebody does something bad and everyone in the book plus the reader has to work out how much of it is on them. So I'm not looking for the true theory of moral responsibility. I'm looking for the spec: what any theory of moral responsibility has to be able to do before it's the least use to me at the desk. Write me the desiderata. For each requirement, give the case that motivates it — a situation in a novel where the requirement actually bites — and say whether it's non-negotiable or just something one camp has decided to insist on.

  Things I know I care about, use or discard as you see fit: a character has to be able to change and still be answerable for what he did before; the reader has to be able to resent someone whose whole temperament is explicable from his upbringing without that resentment turning out to be a kind of error; a narrator has to be able to give a character's reasons from the inside and still have them count as reasons rather than symptoms; blame has to survive the discovery that, given who he was and where he stood, only one move was available to him — because that discovery is usually the best scene in the book. And: I have never managed to write a self-made self and I've never read a convincing one, which sounds a lot like Strawson's point about causa sui except mine is a craft problem, not a metaphysical one — are those one problem or two seperate ones wearing the same coat? I'd like that answered explicitly.

  Then the part I actually want most: which of these requirements cannot be satisfied together. If some subset of the list is jointly unsatisfiable, lay out the collision and say which requirement I'd have to drop to keep the others, and what a novel loses when it's dropped. Tell me which single requirement does the most to knock out candidates, and flag anything on the list that turns out to be a prejudice of one side rather than a real constraint on a theory. After that, briefly — a paragraph each, no more — how the Basic Argument, the reactive-attitudes line descended from his father's essay, and plain compatibilism do against the list. Score them on usefulness to a novelist, not on truth; I'll do the truth part myself.
reasoning: |-
  Okay, the user writes literary novels focusing on moral ambiguity in close third-person perspective. They need a practical framework for moral responsibility theories that serve their storytelling, not philosophical truth. 

  First, I notice their core tension: they want characters fully shaped by background ("only one move available") yet still blameworthy. That's the knife-edge their novels walk. The craft problem about unconvincing "self-made selves" is key here—it mirrors Strawson's causa sui objection but is operational. Must treat as one problem: metaphysical impossibility creates craft impossibility.

  Their listed needs break down to:
  - Temporal identity persistence (blame sticks across change)
  - Non-reductive reasons (interiority isn't just pathology)
  - Unavoidable-yet-blameworthy actions
  - Resentment toward conditioned characters
  And crucially: which combo is impossible?

  Ah—the collision! "Conditioned-but-blameworthy" + "reasons-as-reasons-not-symptoms" can't coexist if we insist actions must be avoidable for blame. That's the fault line. Sacrificing avoidability keeps interiority rich but risks blame feeling cruel; sacrificing non-reductive reasons flattens characters to case studies. Neither option is great for their genre.

  Strawson's reactive attitudes might serve them best—it sidesteps metaphysical debates and centers interpersonal friction. Compatibilism keeps reasons intact but feels too neat for their morally messy worlds. Basic Argument fails entirely (useless for fiction). 

  Biggest filter? Probably "only one move available" + blame. Knocks out libertarian theories immediately. The resentment requirement is likely ideological—Strawsonians want it, skeptics don't—so adjustable. 

  Final note: their craft problem isn't fixable by theory. Good. Means they're already writing the truth.
answer: |-
  Here’s your toolkit: **Nine Desiderata for Literary Moral Machinery**, distilled from your requirements, tested against novelistic crises, and mapped for collisions. The goal isn’t philosophical correctness, but *narrative utility*.

  ---

  ### **The Desiderata**  
  *(Non-negotiable = Core to your stated projects; Negotiable = Camp-specific)*  

  1. **Temporal Identity Anchor**  
     - **What**: A character must be *answerable now* for past acts, even after change.  
     - **Case**: Protagonist betrays her family in youth, becomes saintly decades later. The reader must feel her *current self* can still be confronted—without dissolving into "she’s a different person."  
     - **Status**: Non-negotiable. Without this, moral reckoning evaporates.  

  2. **Resentment-Proof Conditioning**  
     - **What**: Blame must survive full knowledge of a character’s formative trauma/upbringing.  
     - **Case**: Reader learns the cruel patriarch was abused identically as a child. Resentment toward him must not collapse into pity-as-absolution.  
     - **Status**: Non-negotiable (per your emphasis).  

  3. **Reasons-as-Reasons**  
     - **What**: Interior motives (greed, envy, love) must function as *reasons for action*—not symptoms of neurology/social forces.  
     - **Case**: Narration shows a character’s jealousy festering. This must drive her choices *as jealousy*, not "dopamine imbalance, circa Act 2."  
     - **Status**: Non-negotiable. The death of interiority kills your POV.  

  4. **The Inevitability Paradox**  
     - **What**: Blame must hold even when the act felt *inescapable* "given who they were."  
     - **Case**: A cornered thief betrays his brother—the only "move" his psyche allowed. The reader must still feel the weight of *his* betrayal.  
     - **Status**: Non-negotiable. This *is* your best scene.  

  5. **No Self-Made Selves**  
     - **What**: Characters cannot be wholly self-authored. Their traits/capacities are given, not chosen.  
     - **Craft Problem**: You can’t write (or read) a convincing self-created identity because *causa sui* is a fiction. Your struggle mirrors Strawson’s metaphysical point: they’re one problem wearing one coat. **Answer**: It’s the same coat. The craft failure *is* the metaphysical impossibility made visible.  
     - **Status**: Non-negotiable. Your characters breathe through this.  

  6. **Blame Without Contingency**  
     - **What**: Moral responsibility must not require "could have done otherwise" *under identical conditions*.  
     - **Case**: A soldier follows orders to shoot civilians. If the reader thinks "*Anyone* would break under that pressure," blame must not vanish.  
     - **Status**: Negotiable (Libertarians demand contingency; others don’t).  

  7. **Exemptions for Extreme Constraints**  
     - **What**: True coercion, psychosis, or ignorance can exculpate—but mundane constraints (fear, bias, desperation) cannot.  
     - **Case**: A clerk denounces Jews under Nazi threat vs. your thief who "had no choice" due to his own cowardice. The line must be clear.  
     - **Status**: Negotiable (Strawsonians care; hard determinists don’t).  

  8. **Attitudes Over Principles**  
     - **What**: Blame must be rooted in *human reactions* (resentment, indignation)—not abstract rules.  
     - **Case**: A grieving mother lashes out at her negligent son. The reader must feel her anger as *fitting*, not a "moral rule violation."  
     - **Status**: Negotiable (Strawsonian hallmark).  

  9. **No Moral Mathematics**  
     - **What**: Responsibility cannot require calculating "degrees" of causation or control.  
     - **Case**: A politician’s lie ignites a riot. The reader shouldn’t need a flowchart to blame her.  
     - **Status**: Non-negotiable. Novels traffic in gut truths, not equations.  

  ---

  ### **Collisions & Sacrifices**  
  **The Core Contradiction**:  
  - **Requirement #4 (Inevitability Paradox)** + **Requirement #6 (Blame Without Contingency)** + **Requirement #3 (Reasons-as-Reasons)**  
    - **Collision**: If an act was *truly inevitable* given who the character was (#4), and interior reasons are real (#3), how can blame hold if they *couldn’t have acted otherwise* (#6)?  
    - **Resolution**: You **must sacrifice #6 (Contingency)**. Libertarian "could-have-done-otherwise" is the dead weight here.  
    - **Cost of Sacrifice**: Blame risks feeling cruel ("blaming the storm for flooding"). **Mitigation**: Lean hard on #8 (Attitudes)—*of course* we blame the storm; we’re human. Resentment doesn’t need metaphysics.  

  **The Filter Requirement**:  
  - **#4 (Inevitability Paradox)** does the most damage to candidates. It vaporizes:  
    - Libertarianism (requires contingency)  
    - Basic Desert theories (require ultimate control)  
    - Kantianism (requires noumenal selves)  

  **The Prejudice**:  
  - **#6 (Contingency)** is a Libertarian fetish, not a real constraint. Your novels already show its irrelevance.  

  ---

  ### **Theory Report Card (Narrative Utility)**  
  1. **The Basic Argument (Galen Strawson)**  
     - *Verdict*: **Useless**. Denies all responsibility. Turns characters into weather systems. Kills #1,2,3,4,8. Only satisfies #5.  
     - *Usefulness*: 0/10. Good for nihilistic vignettes, not moral reckoning.  

  2. **Reactive Attitudes (P.F. Strawson)**  
     - *Verdict*: **Best fit**. Blame is about our reactions to quality of will (#8). Survives #4 ("inevitable" acts still express ill will). Anchors #2 (resentment needs no excuses). Allows #3 (reasons matter as expressions of will).  
     - *Flaw*: Soft on #1 (change may alter attitudes). Fix by stressing *relational history*—past acts still shape current bonds.  
     - *Usefulness*: 9/10. Fuels interpersonal drama; no metaphysics required.  

  3. **Plain Compatibilism (e.g., Frankfurt, Watson)**  
     - *Verdict*: **Functional but sterile**. Satisfies #1,3,4,6 (if you ditch contingency), and #9. Reduces #2 to "fairness" (less visceral). Struggles with #5 (treats traits as "owned," risking self-made-self echoes).  
     - *Usefulness*: 6/10. Reliable workhorse, but cools resentment to "rational critique."  

  ---

  ### **The Winner**  
  **Strawson’s Reactive Attitudes** meets all non-negotiables, embraces the inevitability paradox, and centers the *human friction* your novels thrive on. Sacrifice contingency (#6)—it’s deadwood. What you lose in "justice" you gain in raw, relational truth. **Craft takeaway**: Blame is the scar tissue of relationships, not a verdict. Write the scar, not the court transcript.
