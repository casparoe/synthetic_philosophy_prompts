prompt: |-
  I write a column on science, medicine, and the economics of ordinary life, and the next one is about where the line falls around markets people find repugnant. Before I draft it, I want to know what I actually believe, and I would rather find out by being argued with than by rereading my own notes. So: take my verdicts on a batch of cases, tell me what principle they add up to if there is one, and tell me which of them I have to abandon.

  I have been carrying around a two-clause test of my own that the cases below keep bruising. Call it the self-undermining test: a market in some good G is repugnant, and properly restricted, when either (i) completing the sale damages or destroys the capacity, relationship, or standing that made G worth having in the first place, so that the transaction consumes whatever gave it value; or (ii) the seller's willingness to sell is produced by a deprivation the buyer is positioned to relieve and instead exploits, so that her consent measures her lack of options rather than her preferences. I do not think harm to third parties is what does the work here, and I do not think disgust as such is either.

  My verdicts:

  1. A market in kidneys from living sellers, at a fair price with full disclosure and after waiting periods: repugnant, and I would restrict it.
  2. A person contracting now, in good health and for a modest sum paid to her children, to have a kidney taken after her death: not repugnant. I cannot say why this differs from case 1 beyond the fact that the seller will not be around to be degraded by it.
  3. A wealthy patient paying to move up the transplant waiting list: repugnant. A wealthy patient paying a hospital for a faster and more thorough workup that makes her eligible sooner: not repugnant, though the effect on everyone else's wait is the same.
  4. Paying a surrogate a fixed fee: acceptable. Paying her a bonus conditional on her not forming an attachment to the child, or on relinquishing the child without contest: repugnant, and more repugnant than the fixed fee, though the money buys the same service.
  5. Paying a person a few hundred dollars to accept sterilization or long-acting contraception: repugnant. Paying a person a few hundred dollars to stop smoking: acceptable. In both, a person with little money contracts over her own body for a sum she would not otherwise have.
  6. Charging twenty times the usual price for a portable generator in a town a week after a hurricane, with no other seller within a hundred miles: repugnant. Charging three times the usual price for a bottle of water at an airport: unobjectionable. Charging twenty times the usual price for that generator to an affluent neighbor who wants a backup for a party: unobjectionable.
  7. Buying an antique ivory chess set made in the 1920s, where the purchase plausibly creates no new demand for poached ivory: I find it repugnant, and I cannot explain this at all, since no one is harmed and the elephants died a century ago.
  8. Paying a writer to compose my apology to someone I have wronged: repugnant. Paying a writer to compose my eulogy, to be delivered after my death: not repugnant, though it is the same service performed for the same audience.
  9. Paying my nieces a small allowance for being affectionate to their grandmother: repugnant, on the grounds that the payment would destroy the very thing it purchased — which is exactly what clause (i) predicts. Yet I also think their grandmother would be right to be delighted if they took the money, and I cannot hold both attitudes.
  10. Selling my vote: repugnant, and I would ban it. Contributing to a campaign in expectation of access and influence, which is legal and which I do not much object to: not repugnant.
  11. Selling my labor at a job I consider degrading — night shifts in a warehouse, at a wage below anything I would call dignified: not repugnant in the relevant sense, and I would not restrict it, even though clause (ii) seems to fit it at least as well as it fits case 1.

  Cases 1 and 11 are the pair I cannot reconcile: I want to restrict the kidney market and I do not want to restrict the warehouse job, and the story about deprivation and degradation seems to license both or neither. Case 7 is the one I suspect is not a genuine verdict but a prejudice I happen to share with my readers. Case 9 is where I appear to hold two incompatible attitudes at once.

  Here is what I want. State a principle, or a small number of competing candidates, precisely enough that it could be applied by someone who does not share my intuitions at all. For each clause, identify the case from my list that motivates it: I want to see which of my verdicts is carrying which piece of the machinery, and whether any clause is doing no work. Then apply your best candidate to cases I have not listed — at least four of your own, chosen to be difficult rather than illustrative — with your verdict on each and a note on which clause produces it. Finally, be explicit about which of my eleven verdicts your best candidate cannot accommodate, and whether the price of accommodating them is a clause you would advise me to drop. If you think the two-clause test should be replaced rather than repaired, say what replaces it, and show that the replacement is not simply my two clauses under new names.

  Lead with your bottom line in the first sentence and give the reasoning after it. No preamble, and no restatement of my question back to me.
reasoning: |-
  Okay, the user is a columnist who writes about science, medicine, and economics. They're tackling the topic of repugnant markets and want to refine their own two-clause test. They've provided 11 cases with their verdicts and are struggling with inconsistencies, especially between cases 1 (kidney sales) and 11 (degrading jobs). 

  Hmm, their self-undermining test has two parts: (i) transactions that destroy the very value they're selling, and (ii) exploiting deprivation where consent reflects lack of options rather than true preference. But cases like 1 and 11 seem to trigger both clauses yet get different verdicts—that's the core tension. 

  First, I need to dissect why their test bruises against these cases. For case 1 (living kidney sales), clause (ii) clearly applies—the seller's poverty drives consent. But in case 11 (warehouse job), same clause applies yet they deem it non-repugnant. The difference must lie elsewhere. Maybe bodily integrity? Or social necessity? 

  Case 7 (antique ivory) is interesting—they admit it's irrational repugnance. This might be pure cultural contamination, not principle-driven. Case 9 (paying nieces for affection) perfectly fits clause (i) but creates cognitive dissonance because the grandmother might approve. Shows clause (i) is too blunt. 

  The airport water pricing (case 6) reveals context matters: exploitation feels worse in disasters. But why? Clause (ii) technically fits both, but they only object to the hurricane markup. Must be about *leverage over basic needs* during vulnerability. 

  For a unified principle, I'm leaning toward: **A market is repugnant if it exploits acute vulnerability that undermines agency in ways that either (a) destroy intrinsic goods or (b) instrumentalize essential human attributes (body, identity, relationships).** 

  This splits "vulnerability" into *acute* (hurricane prices, kidneys) vs. *chronic* (low-wage jobs). It also adds "instrumentalization"—explaining why vote sales (case 10) feel wrong (democracy becomes tradable) but campaign donations don't (influence is ancillary). 

  Now, testing new cases: 
  - **Selling citizenship**—repugnant (instrumentalizes identity/national belonging). 
  - **Crisis-markup on insulin**—repugnant (exploits health vulnerability). 
  - **Paid grief counseling**—not repugnant (service preserves, not destroys, value). 
  - **Commercial surrogacy with attachment bonuses**—repugnant (instrumentalizes maternal bond). 

  Back to their list: This principle *saves* most verdicts but forces abandoning case 11's justification (chronic deprivation ≠ acute exploitation). Also, case 7 (ivory) gets demoted to bias—no principled grounds. Case 9 (nieces) holds: paying for affection *does* undermine its value, even if grandma smiles. 

  Biggest trade-off: Clause (ii) now requires *acute* deprivation. That means accepting warehouse jobs as non-repugnant isn't a flaw—it's consistent. Kidney sales stay repugnant due to bodily instrumentalization + acute vulnerability. 

  Final note: Their two clauses weren't wrong—just underspecified. The fix isn't replacement but sharpening: vulnerability → *acute* vulnerability, destruction of value → *instrumentalization of core human attributes*. 

  ...Time to structure this as a direct bottom-line-first reply.
answer: |-
  **Your verdicts are best explained by a principle of *essential instrumentalization*: A market is repugnant when it exploits acute vulnerability to commodify an essential human attribute (body, identity, or fundamental relationship) in a way that degrades its intrinsic value or agency, and where less harmful alternatives exist.** Clauses (i) and (ii) are incomplete without specifying *what* is undermined and *when* deprivation matters.  

  ### Key Insights from Your Cases  
  - **Clause (i) (destruction of value)** is motivated by **Case 4 (surrogacy bonuses)**: Paying to suppress attachment instrumentalizes maternal bonds, destroying the relational value. Also fits **Case 9 (paying for affection)**.  
  - **Clause (ii) (exploiting deprivation)** is motivated by **Case 1 (kidney sales)**: Consent reflects acute bodily vulnerability, not preference. But **Case 11 (warehouse work)** shows chronic deprivation alone isn’t sufficient; physical labor lacks the *essential* bodily/relational weight.  
  - **Outliers**:  
    - **Case 7 (ivory chess set)** has no principled basis—likely cultural disgust.  
    - **Case 3 (transplant list vs. workup)** hinges on fairness: Paying to bypass a *shared queue* exploits systemic vulnerability; paying for better service does not.  
    - **Case 9 (nieces/grandmother)** isn’t inconsistent: You recognize payment *objectively* degrades affection (clause i), yet subjectively approve if the grandmother values the trade-off.  

  ### Principle Refined: Essential Instrumentalization  
  A market is repugnant if:  
  **(1) Commodification Target**: It involves an **essential attribute** (body, identity, core relationship, or democratic voice) whose intrinsic value relies on non-market norms;  
  **(2) Vulnerability**: Sellers’ consent arises from **acute deprivation** (immediate, survival-threatening);  
  **(3) Harm Mechanism**: The transaction **instrumentalizes** the attribute, detaching it from its human context;  
  **(4) Alternatives**: Less harmful means to achieve the same end (e.g., organ donation vs. sale) are feasible.  

  ### Test on New Cases  
  1. **Selling citizenship for $1M**  
     - *Verdict*: Repugnant.  
     - *Why*: Instrumentalizes national identity (1), exploits economic vulnerability (2), detaches citizenship from civic ties (3). Alternatives exist (e.g., skilled immigration).  
  2. **Markup on insulin during shortage**  
     - *Verdict*: Repugnant.  
     - *Why*: Commodifies health (1), exploits acute vulnerability (2), profiteers from survival needs (3). Alternatives: Price caps or rationing.  
  3. **Paying a friend to end a feud with you**  
     - *Verdict*: Repugnant.  
     - *Why*: Instrumentalizes friendship (1), exploits emotional/financial vulnerability (2), corrupts reconciliation’s intrinsic value (3). Alternatives: Direct apology.  
  4. **Commercial surrogacy in a country with universal healthcare**  
     - *Verdict*: Not repugnant.  
     - *Why*: No acute deprivation (2); payment compensates labor, not relational bonds (1,3). Alternatives (e.g., adoption) may be less accessible.  

  ### Where Your Verdicts Conflict with the Principle  
  - **Must abandon**: **Case 11 (warehouse work)**. Chronic deprivation exists, but labor lacks the *essential* bodily/relational weight of kidneys (Case 1). Work is inherently instrumental; banning it would harm autonomy.  
  - **Must abandon**: **Case 7 (ivory chess set)**. No exploitation, harm, or essential attribute at stake. Retain it only as personal/cultural aversion.  
  - **Retained with clarity**: **Case 9 (nieces)**. Payment instrumentalizes familial affection (1,3), but grandmother’s approval is a separate moral calculus (e.g., elder happiness vs. familial integrity).  
  - **Retained**: **Case 6 (hurricane pricing)**. Acute vulnerability (2) + essential need (shelter/safety) (1) make it repugnant; airport water lacks survival stakes.  

  ### Why Not Your Original Clauses?  
  Your clauses (i) and (ii) are *components* but fail without:  
  - **Specificity**: What counts as "value-destroying" or "deprivation"? (Case 3, 6, 11).  
  - **Hierarchy**: Bodily/relational integrity (kidneys, votes) outweighs labor (Case 1 vs. 11).  
  - **Context**: "Alternatives" explains why kidney sales (no equivalent donation system) are repugnant but surrogacy (with regulation) may not be.  

  **Bottom line**: Drop clause (ii)’s broad "deprivation" for *acute vulnerability*, add *essential attributes*, and require *instrumentalization* + *alternatives*. This saves 9/11 verdicts, forces abandonment of Case 11’s justification (accept the job as non-repugnant), and exposes Case 7 as bias.  

  ---  
  *This reframing maintains your core intuition—that some markets corrode what makes us human—while grounding it in defensible criteria beyond disgust. Test it against organ markets in a society with robust welfare: If kidneys could be sold without acute vulnerability (e.g., by the wealthy), would it still be repugnant? Under this principle, yes (bodily instrumentalization), aligning with your verdicts.*
