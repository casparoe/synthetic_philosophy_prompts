prompt: |-
  I'm sitting on a working group that's drafting the franchise rules for a new binational metropolitan authority — a transit/water/port body covering a city that spilled across an international border sometime last century. We can't agree on who the electorate is, and every proposal on the table quietly answers that question before arguing about anything else. Residents on both sides, obviously; but also people who commute in daily and vote somewhere else, a seasonal workforce with no local residence at all, an airport enclave staffed by a third-country carrier, and — according to the hydrologists — everybody downstream whose water table our extraction decisions move.

  So before we look at another proposal I want the spec. Write the desiderata for a theory of the boundaries of the demos: the requirements any account of who constitutes the demos has to meet to count as adequate *for our purposes* — that is, usable as a rule for actually constituting a decision-making body, not just a standard for criticizing existing ones from the outside. The purpose matters here, so if you think some requirement binds on a critic but not on a constitution-drafter, or the reverse, say so explicitly.

  For each requirement, give the case or consideration that motivates it — the concrete situation that shows a theory failing without it. At minimum I want the list to cover: the circularity worry (a demos can't democratically settle who's in the demos without already being one); the difference between being affected by a decision and being subject to the authority that makes it, and what happens to a theory that runs the two together; the case where the unit itself splits, merges, or dissolves; the fact that present borders are historical accidents that often trace back to conquest, so a theory that simply reads off the existing jurisdiction looks conservative by construction; whether the output is a set of persons or a distribution of weights, since "how much say" is live for us and not only "who's in"; and whether the rule can be operated at all by the people who have to administer it.

  Then mark which of these you'd call non-negotiable and which are really one camp's commitments dressed up as criteria — that distinction is half of what I'm after. And the part I most want: if some subset of the list can't be jointly satisfied, name the subset, show why, and say what we're left choosing between — which requirement to drop, or a reason to think the whole framing is misconceived. Tell me also which single requirement does the most work in knocking candidates out.

  Last thing, one paragraph only: given the list you just wrote, does it favor a residence-based binary franchise, or something that hands out fractional shares of a vote proportional to how much of a person's life the authority actually governs? Commit, dont hedge — if my own list turns out to license the weighted thing I'll have to eat it in front of the group.

  No bibliography, no footnotes, no name-dropping. I've read the all-affected and all-subjected crowd; what I havent got is a checklist I can hand to a civil engineer and a municipal lawyer.
reasoning: |-
  Okay, let me tackle this complex query about defining the electorate for a binational metropolitan authority. The user needs a practical framework to evaluate proposals, with clear requirements grounded in real governance challenges.

  First, I consider the core tension: this isn't just theoretical but will shape actual decision-making bodies. The user explicitly wants to avoid circularity in defining the demos while addressing unique factors like cross-border commuters, environmental impacts, and historical injustices. 

  Key requirements emerge as I think through the problems:
  - Non-circularity is fundamental because you can't have a democratic vote on membership without first defining voters
  - The affected vs subjected distinction matters critically - downstream communities feel water policy impacts but aren't necessarily under the authority's jurisdiction
  - Governability can't be compromised since civil engineers must implement this
  - Historical contingency requires acknowledging existing borders' problematic origins
  - Weighted voting needs consideration as "how much say" is live for them

  I'm seeing two irreconcilable tensions:
  1) Non-circularity + historical sensitivity vs governability - you can't easily operationalize theories that reject existing borders
  2) Affectedness vs subjectedness - incorporating all affected parties could make the electorate unmanageably large

  The knockout requirement is clearly governability - any unadministrable theory fails by default. For the voting system question, weighted voting satisfies more requirements but likely fails governability and subjectedness tests. Residence-based voting wins pragmatically despite its flaws.

  The response should structure this as a numbered checklist with concrete failure examples, mark non-negotiables, and explicitly call out tensions before making the weighted vs binary recommendation.
answer: |-
  Here's your spec: a requirements checklist for a theory of the demos, designed for drafting operational franchise rules in your binational context.

  **Desiderata for a Theory of the Demos (Operational Rule-Focus):**

  1.  **Non-Circularity:**
      *   **Requirement:** The rule for defining the demos must not presuppose the existence of the very demos it is defining. It must be externally applicable at the founding moment and during boundary changes.
      *   **Motivation:** Applying "all affected" or "all subjected" *democratically* requires an existing demos to vote on who is affected/subjected. Founding requires a rule applied *before* democracy exists here. (e.g., Who votes on whether seasonal workers are "affected"?)
      *   **Status:** **Non-negotiable.** Foundational for any operational rule.

  2.  **Distinguish Affectedness vs. Subjectedness:**
      *   **Requirement:** The rule must clearly differentiate between individuals/groups *impacted by* the authority's decisions (Affected) and those *bound by* its enforceable rules and coercive power (Subjected). It must justify which category grounds inclusion.
      *   **Motivation:** Downstream communities are *affected* by water extraction but not *subjected* to the authority's regulations or enforcement. Including them risks creating an ungovernable demos (requirement #7) and dilutes the voice of those directly ruled. A theory confusing these collapses into impractical universality.
      *   **Status:** **Non-negotiable.** Critical for defining a manageable, legitimate authority.

  3.  **Governability:**
      *   **Requirement:** The resulting demos must be practically identifiable, verifiable, and administrable by the authority using standard civic tools (e.g., residence records, employment data, property rolls). The rule must produce clear, objective criteria.
      *   **Motivation:** How do you reliably identify and verify "everyone downstream whose water table we affect" for voter registration? Or someone who spends 40% of their life within the authority's governance sphere? A theory demanding impossible granularity or moral judgment fails operationally.
      *   **Status:** **Non-negotiable.** The primary operational constraint. Knocks out most complex "affected interest" theories.

  4.  **Robustness to Political Change:**
      *   **Requirement:** The rule must provide a clear method for defining the demos if the authority merges with another, splits apart, or dissolves.
      *   **Motivation:** Avoids chaos and democratic deficit during restructuring (e.g., if the binational authority splits, how are residents assigned to successor demoi?). A theory silent on this invites future conflict.
      *   **Status:** **Highly Desirable (Near-Negotiable).** Essential for institutional stability.

  5.  **Acknowledge Historical Contingency (without requiring rectification):**
      *   **Requirement:** The rule must not *rely on* the inherent legitimacy of existing jurisdictional borders as its sole justification, but need not actively dismantle them. It must be compatible with borders being historical accidents.
      *   **Motivation:** Simply using "current municipal residents on both sides" accepts borders potentially drawn by conquest. A theory *requiring* rectification of all historical injustices before defining the demos is paralyzing for a constitution-drafter (though valid for a critic).
      *   **Status:** **Conditional.** Operationally, you *must* start from existing borders as the *de facto* governance units. The rule should *use* them pragmatically without *endorsing* their origins as normatively ideal.

  6.  **Output Specification (Persons vs. Weights):**
      *   **Requirement:** The rule must explicitly state whether it outputs a binary in/out decision for individuals *or* a method for assigning fractional voting weights.
      *   **Motivation:** Proposals differ fundamentally. "Resident = 1 vote" vs. "Commuter votes weighted by days worked here" vs. "Downstream communities get fractional votes based on hydrological impact". The rule must be clear on its output type.
      *   **Status:** **Essential for Clarity.** Not inherently normative, but dictates implementation.

  **Tensions and Trade-offs:**

  *   **The Core Irreconcilable Trio:** Non-Circularity (#1) + Distinguishing Affected/Subjected (#2) + Governability (#3) cannot be perfectly satisfied simultaneously by *any* theory that aspires to pure normative ideals.
      *   **Why:** Truly satisfying #2 (especially if leaning towards "all subjected") often requires complex, context-specific judgments potentially violating #3. Satisfying #3 often means relying on blunt, administrable proxies (like residence) that imperfectly capture #2. #1 forces an external rule, which inevitably won't feel perfectly just to everyone affected/subjected (violating the spirit of #2). Operational rules (#3) inherently constrain ideal justice (#2).
  *   **What You Choose Between:**
      *   **Option A: Prioritize Governability (#3) and Non-Circularity (#1):** Accept a clear, administrable rule (likely based on residence or employment within existing jurisdictions) that imperfectly captures subjectedness/affectedness (#2). This is the *practical, stable* path.
      *   **Option B: Prioritize Capturing Subjectedness (#2):** Attempt a more nuanced rule (e.g., including long-term commuters, property owners). This improves #2 but significantly challenges #3 (verification, complexity) and may still fail #1 if the nuance requires democratic input. Creates *operational risk*.
      *   **Option C: Reject the Framing?** If the tension is unbearable, the only alternative is a non-democratic founding (e.g., treaty imposition by national governments) or dissolving the authority. You're likely committed to democracy.

  **The Knockout Requirement:** **Governability (#3).** This eliminates more candidate theories than any other. Beautifully complex normative theories founder on the rocks of voter registration logistics, verification costs, and legal certainty. If a civil engineer and municipal lawyer can't apply the rule reliably, cheaply, and defensibly in court, it fails.

  **The Verdict on Weighted vs. Binary Residence:**

  Given *this* list, **a residence-based binary franchise is strongly favored.** Here's why:

  1.  **Governability (#3):** Residence is the *easiest* criterion to verify using standard municipal records (tax rolls, utilities, census). Fractional shares based on "life governed" are administratively nightmarish – defining, measuring, and verifying the metric is practically impossible.
  2.  **Non-Circularity (#1):** It's externally applicable using existing jurisdictional data.
  3.  **Robustness (#4):** Clear for mergers/splits (follow residence).
  4.  **Output (#6):** Clear binary output.
  5.  **Subjectedness (#2):** Residents are unambiguously *subjected* to local laws, taxes, and services. It's a strong, if imperfect, proxy. Fractional voting tries to capture a deeper "stake" but blurs subjectedness and affectedness, violating #2 and exacerbating #3.
  6.  **History (#5):** It pragmatically uses existing borders without endorsing their origins.

  Weighted voting fails primarily on Governability (#3) and creates ambiguity regarding Subjectedness vs. Affectedness (#2). While it might seem normatively appealing for commuters or seasonal workers, your list prioritizes operational viability and clarity of subjectedness, making residence the functional choice. Time to eat (justifiably).
