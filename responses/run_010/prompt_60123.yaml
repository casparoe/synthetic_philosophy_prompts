  ### Draft Questions for the Camus Interview (Paris, Late Autumn 1957)  
  *Note: All questions are framed within the knowledge and published works of Camus available by autumn 1957 (e.g., "Reflections on the Guillotine," "The Rebel," "The Myth of Sisyphus," public statements on Brasillach and Algeria). The impersonator may draw only from these sources. Faculty adviser will cut any deviation.*

  1. **Deterrence Argument & Empirical Hypothetical**  
     **Question:** "You reject deterrence because statistics show no drop in crime after executions. But what if new data proved each execution prevented ten murders?"  
     [Likely answer: "Deterrence is a myth; even if proven, it cannot absolve the state’s moral crime—murder dressed as law."]  
     **Follow-up:** "If deterrence were empirically undeniable, would you still call it irrelevant? Or does your objection depend on the statistics being unfavorable?"  

  2. **State vs. Criminal Premeditation (vs. Retributivism)**  
     **Question:** "You say the state’s killing is worse than a criminal’s because it involves months of calculated waiting. But what if a retributivist argues execution is solely about desert—not deterrence or impulse—making premeditation irrelevant?"  
     [Likely answer: "Retribution is revenge disguised as justice; the state’s cold machinery corrupts the very idea of desert."]  
     **Follow-up:** "If the retributivist admits to vengeful intent but calls it necessary, how does your ‘premeditation’ critique engage them? Isn’t your comparison only lethal to deterrence-based defenses?"  

  3. **Father’s Nausea & Euphemism: Evidence or Rhetoric?**  
     **Question:** "You open with your father’s nausea after witnessing an execution and condemn society’s secrecy as complicity. Is this anecdote evidence for abolition, or rhetoric to shame us into agreement?"  
     [Likely answer: "It exposes a truth: sanitizing executions reveals our cowardice, not humanity."]  
     **Follow-up:** "If it’s evidence, what general law does it prove? If rhetoric, does that weaken your claim that abolition rests on reason, not emotion?"  

  4. **Lifelong Labor: Harsher than Death?**  
     **Question:** "You propose lifelong forced labor to replace execution, citing reversibility. But isn’t decades in chains crueler than death? And what of the innocent man exonerated after twenty years?"  
     [Likely answer: "Death is irreversible; labor at least allows for justice to correct itself—unlike the grave."]  
     **Follow-up:** "If twenty years of wrongful imprisonment is also irreversible suffering, haven’t you merely swapped one state-inflicted horror for another?"  

  5. **Lethal Injection Choice: A Moral Half-Measure?**  
     **Question:** "You suggest letting the condemned choose lethal injection to reduce suffering. Doesn’t this imply the core wrong is brutality, not the state’s right to kill?"  
     [Likely answer: "I oppose all killing, but if it persists, minimizing agony is the bare minimum of decency."]  
     **Follow-up:** "By endorsing a ‘kinder’ method, aren’t you conceding the state may kill—so long as it’s tidy? How is that consistent with absolute opposition?"  

  6. **Atonement Belief & Secular Abolitionism**  
     **Question:** "You argue the death penalty made sense when society believed in atonement and divine judgment. Does your abolitionism then depend on living in a disenchanted world?"  
     [Likely answer: "Belief in atonement obscured the truth: execution was always state-sanctioned murder."]  
     **Follow-up:** "If it was ‘always murder,’ why invoke historical context? Doesn’t that imply abolition is contingent—not universal—on modern unbelief?"  

  7. **Brasillach Clemency Petition: Principle or Price?**  
     **Question:** "You signed the 1945 petition to spare fascist Robert Brasillach despite loathing his views. Was this pure consistency—opposing all executions—or a price paid to uphold a principle you value more?"  
     [Likely answer: "Yes, consistency: opposing death for even the vilest preserves our humanity."]  
     **Follow-up:** "If consistency, why call Brasillach’s ideas ‘despicable’ in your essay? Doesn’t that tension suggest signing was less logic than a moral cost you accepted?"  

  8. **Algeria & Stockholm: Justice vs. Mother**  
     **Question:** "Your essay condemns state execution of criminals. Yet in Algeria, where FLN rebels and French forces kill daily, what principle separates that conflict from a guillotined murderer? And if ‘justice’ demanded your mother’s safety in Algiers, as you said in Stockholm, does justice here permit state violence?"  
     [Likely answer: "Execution targets a defenseless prisoner; war involves mutual force. And Stockholm was about my private anguish, not policy."]  
     **Follow-up:** "But if the state executes a captured rebel, is that not ‘defenseless’ killing? And if justice bends to personal love, how can abolition be an absolute demand of justice?"  

  9. **Closing: Evidence Against Abolition**  
     **Question:** "What fact or concession would force you to reconsider abolition? Or what could a defender of capital punishment say that you might accept without abandoning your position?"  
     [Likely answer: "Nothing. The death penalty is irredeemable; it degrades the state and the executioner alike."]  
     **Follow-up:** "If no evidence could sway you, is your position then a moral axiom—untouchable by reason? Would you accept, say, limiting executions to treason if it spared murderers?"  

  ---  
  **Design Notes for Compliance:**  
  - **No Summaries/Introspection/Life Details:** Questions avoid "What does your essay mean?" or biographical exploration (e.g., father’s story is treated as textual evidence, not personal history).  
  - **Anachronism-Proof:** All references end in 1957 (e.g., Koestler collaboration, Nobel Prize, Stockholm speech, Brasillach petition, Algeria conflict). No post-1957 events or ideas.  
  - **Conciseness:** Questions are under 35 words; follow-ups are sharp pivots, not rephrasings.  
  - **Source-Limited:** Impersonator can answer solely from Camus’s texts (e.g., "Reflections" for deterrence/euphemism/labor; "Neither Victims Nor Executioners" for Algeria; public letters for Brasillach; Nobel interviews for Stockholm).  
  - **Flow:** Opens with deterrence (empirical), moves to moral arguments (retribution, religion), tests practical proposals (labor, injection), probes record (Brasillach, Algeria), and closes with epistemology (what could falsify abolition).  

  This set forces Camus to defend ambiguities in his logic, pits his principles against real-world tensions (e.g., Algeria), and prevents retreat into rehearsed quotations by demanding specificity. The law students get empirical rigor; the retributivist challenge sharpens the anti-vengeance thesis; and the closing question exposes abolition as a near-absolutist stance.
