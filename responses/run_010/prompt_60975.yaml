answer: |-
  Here’s an Aristotelian dissection of Wörgl’s stamped currency, structured to meet your three requirements:

  ---

  ### **I. Disciplined Mapping: Aristotle’s Lens on Wörgl**  
  **A. Money as Convention, Not Nature**  
  Aristotle’s view (*Nicomachean Ethics* V.5, *Politics* I.9) that money is a human invention (νόμισμα, *nomisma*) fits Wörgl perfectly. The town *politically instituted* a new monetary convention backed by law (tax acceptance) and collective trust. The stamped notes were pure social artifice—no intrinsic value, only agreement.  

  **B. Correcting the "Unnatural" Perversion of Money**  
  - **Demurrage as Anti-Interest**: Aristotle condemned interest (τόκος, *tokos*) as "money breeding money" (*Politics* 1258b), the epitome of unnatural acquisition. Wörgl’s holding fee inverted this: money *decayed* unless spent. This countered money’s tendency to hoard (the "Midas problem") by forcing circulation—aligning with Aristotle’s vision of money as a medium for equitable exchange (*NE* 1133a).  
  - **Restoring Money as a "Pledge"**: Aristotle saw money as a "guarantee of future exchange" (*NE* 1133b). Demurrage reinforced this by making money a *temporal pledge*: hoarding eroded value, so currency had to fulfill its purpose—facilitating transactions now.  

  **C. Distinguishing Oikonomia vs. Chrematistics**  
  The scheme prioritized household management (οἰκονομία, *oikonomia*)—public goods (roads, sewers) and community welfare—over wealth accumulation (χρηματιστική, *chrematistics*). Unemployment fell because money was channeled toward use-value, not sterile saving.  

  **→ Verdict**: By Aristotle’s lights, demurrage *corrected* money’s perversion. It weaponized decay to enforce money’s "natural" role: enabling reciprocal need-fulfillment.  

  ---

  ### **II. Where Aristotle’s Theory Bites (and Where It’s Blind)**  
  **Illuminations**:  
  - **Tax Acceptance as Sovereign Backing**: Aristotle notes money’s value rests on law (νόμος, *nomos*). Wörgl’s requirement that taxes be paid *only* in its notes gave them state-enforced legitimacy—a direct expression of political convention.  
  - **Peg as Commensurability Anchor**: The schilling peg preserved Aristotle’s "measure" function (*NE* 1133a), ensuring the notes could compare unlike goods (e.g., labor vs. timber) without disrupting the broader economy.  
  - **Court Shutdown as Monopoly Enforcement**: Aristotle’s view that money is instituted by the polity (*Politics* 1257a) explains the shutdown: the state reclaimed its conventional authority over the monetary "measure."  

  **Distortions/Omissions**:  
  - **Velocity is Invisible**: Aristotle lacks a concept of monetary velocity. Wörgl’s rapid circulation (trades spiking 14x) would baffle him—he analyzes money statically (as measure/medium), not dynamically.  
  - **Monetary Policy as Such**: He’d miss Wörgl’s engineered scarcity and demurrage as *tools*. For Aristotle, money is a passive measure, not a policy lever.  
  - **Early Tax Payments**: He’d see this as fulfilling civic duty (cf. *Politics* III.9), but not grasp the *monetary* incentive (avoiding demurrage on held schillings).  

  ---

  ### **III. What Wörgl Does to Aristotle’s Theory**  
  **A. Confirmation with Twists**  
  - **Radical Conventionality**: Wörgl proves money’s plasticity. The town created a parallel medium *within* the national unit of account—showing convention can be layered, contested, and hyper-local.  
  - **Peg ≠ Fatal Flaw**: The schilling peg actually *saves* Aristotle. It shows his conflation of measure/medium is *contingent*, not necessary. Measure (schilling prices) endured while medium (stamped notes) was replaced—yet both remained conventional.  
  - **Demurrage: An Unanticipated "Nature"**: Aristotle associates decay with natural objects (e.g., fruit rotting, *Politics* 1257a). Demurrage makes money *mimic nature’s perishability*, correcting its "unnatural" sterility. He never imagined this but would likely approve.  

  **B. Anomaly or Evolution?**  
  Wörgl is an Aristotelian anomaly in method (policy-driven currency) but a validation in principle: money is political, for use—not accumulation. The scheme’s *intentional decay* answers Aristotle’s critique of interest, proving money can be forcibly re-embedded in social need.  

  ---

  ### **Sidebar Punchline (Aristotelian)**  
  > *Wörgl exposed money’s deepest truth: it is a human pact, not a natural fact. By taxing idleness, the town weaponized decay to rescue money from sterility—turning currency back into a current. Aristotle would nod: the notes rotted like plums, ensuring no one starved beside a hoard of gold.*  

