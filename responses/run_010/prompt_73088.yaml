prompt: |-
  You're a political philosopher who's actually sat on institutional ethics boards — think this through carefully, and start with a short brainstorm of the ways a distinction like this gets mangled in practice before you write anything normative.

  I chair a standing committee at a two-hundred-year-old university that receives proposals for acknowledging past wrongs: roughly one a month, from survivor groups, students, claimants' lawyers, our own departments. The format varies — formal apology, plaque, renaming, a fund, a research programme. Right now we argue in circles and split the difference, which is it's own kind of dishonesty, and whatever we publish gets cited back at us years later, sometimes in litigation. I want to try running proposals through Jaspers's split of guilt into criminal, political, moral and metaphysical, from his postwar lectures on German guilt.

  Write the procedure my committee could actually run inside a 90-minute meeting, by members with no philosophy: the questions to ask in order, what counts as a sufficient answer to each, which kinds of act or commitment each species of guilt licenses and which it forbids, where the procedure terminates in a "we can't do this one", and where it has to hand the call to a person because it's a question of values rather than fact. Our general counsel must sign off on anything readable as admitting legal liability, so mark the points where the procedure and counsel will collide.

  Also tell me which of Jaspers's four distinctions you'd quietly drop for practitioners and which absolutely have to survive the simplification, and what the framework loses by becoming a checklist.

  Then run it on three cases: (a) living survivors of a 1950s study run by our medical faculty, perpetrators all dead, limitation period long expired, they want an apology plus money; (b) a demand to rename a hall whose benefactor's fortune came from colonial plantations, no identifiable claimants; (c) an alumni petition asking us to apologise "on behalf of every graduate". One of these should come out a way I won't like — say which and why. And flag where the procedure produces something that reads as a dodge even when it isn't one.
reasoning: |-
  Hmm, the user is a committee chair at an old university dealing with proposals to acknowledge past wrongs. They're frustrated with circular arguments and want a practical framework based on Jaspers' guilt distinctions. I need to create a usable procedure for 90-minute meetings with non-philosophers.

  First, I recall Jaspers' four guilt types: criminal (legal violations), political (collective responsibility), moral (personal ethical failures), and metaphysical (human solidarity with suffering). In practice, these often get mangled - people confuse personal guilt with institutional responsibility, or use moral language for political demands. Metaphysical guilt is particularly tricky as it's abstract.

  For the procedure, I'll need to simplify this into sequential questions that fit tight timelines. Political guilt is essential to keep since it addresses institutional responsibility. Metaphysical guilt should probably be dropped—it's too nebulous for practical decisions. Moral guilt should be reframed as "ethical responsibility" to avoid personal blame. Criminal guilt must stay because of legal implications.

  The step-by-step should start with establishing facts (criminal guilt), then move to institutional role (political), then current obligations (moral), with clear decision points. I'll need to flag where legal counsel will intervene—especially when criminal guilt questions might imply liability. The framework will lose nuance by becoming a checklist, but gain clarity and speed.

  For the test cases: 
  - The medical study (a) should likely result in apology plus compensation since political/moral guilt apply despite expired limitations. 
  - The renaming case (b) might get stuck without identifiable claimants—this could frustrate the user as it feels like inaction. 
  - The alumni petition (c) fails because the institution can't apologize for individuals' moral guilt.

  The "dodge" moments will appear when we acknowledge political guilt but avoid material commitments, or when legal constraints block meaningful action. I'll structure this as a concrete workflow with time allocations, then apply it to each case showing where outcomes might feel unsatisfying but are philosophically defensible.
answer: |-
  Here’s a practical framework for your committee, distilled from Jaspers’ categories but stripped of philosophical jargon. I’ve flagged simplifications, pitfalls, and legal friction points. **The key insight: Jaspers’ distinctions force separation of *kinds* of responsibility, preventing "all-or-nothing" deadlocks. But simplification risks turning profound questions into bureaucratic checkboxes.**

  **Mangled Distinctions in Practice (Brainstorm):**
  *   **Conflation:** Moral outrage used to demand political action; political obligations mistaken for legal liability.
  *   **Overextension:** Metaphysical guilt (shared human failing) invoked to justify material reparations.
  *   **Avoidance:** Hiding behind "no criminal guilt" to evade political/moral responsibility.
  *   **Weaponization:** Demands framed solely in moral terms to shame the institution into overreach.
  *   **Procedural Freeze:** Endless debate over "degree" of guilt instead of "kind" of appropriate response.

  **Simplified Framework for 90-Minute Meetings:**
  *(Target: 60 mins on steps 1-5, 30 mins on 6-7)*

  1.  **CRIMINAL GUILT (Fact-Finding Gatekeeper - 15 mins)**
      *   **Question:** "Was this act illegal *at the time it occurred*, and could specific living individuals be prosecuted *today*?" (Focus: Law then, law now).
      *   **Sufficient Answer:** "Yes/No" based on documented law/history + General Counsel (GC) input *before the meeting*. If complex, GC pre-brief is mandatory.
      *   **Licenses:** Formal investigation (if new evidence), *referral* to law enforcement (if viable). **GC Collision Point:** *Any* phrasing implying *current* criminal liability is forbidden. GC must pre-vet minutes on this point.
      *   **Forbids:** Actions implying *current* criminal culpability (e.g., "we committed crimes").
      *   **Terminates/Handoff:** If "Yes & prosecutable today," halt procedure & refer to GC/Legal immediately. Committee *cannot* proceed. If "Yes but not prosecutable" (time-barred, perpetrators dead), proceed to Step 2. If "No," proceed to Step 2.

  2.  **POLITICAL GUILT (Institutional Role - 20 mins)**
      *   **Question:** "Was the institution *structurally involved* (funded, sanctioned, hosted, benefited from) or did it *fail in its duty of care*?" (Focus: Institutional role/harm, not individual intent).
      *   **Sufficient Answer:** "Yes/No" based on institutional records, historical context. Requires majority vote if ambiguous.
      *   **Licenses:** Institutional acknowledgments (apologies, plaques, research), structural reforms, symbolic/material reparations *tied to the specific harm*.
      **Forbids:** Actions implying *personal* guilt of current members or *criminal* guilt.
      *   **Terminates/Handoff:** If "No," procedure ends. No institutional obligation. If "Yes," proceed to Step 3.

  3.  **MORAL GUILT (Current Ethical Obligation - 15 mins)**
      *   **Question:** "Does the institution *today* have an ethical duty to address ongoing consequences or honor the dignity of those affected, *regardless of legal/political guilt*?" (Focus: Present values, harm repair, solidarity).
      *   **Sufficient Answer:** Committee deliberation based on university values, survivor input, social justice principles. Requires reasoned consensus/minority report. *Values judgment.*
      *   **Licenses:** Apologies, restorative gestures (funds, scholarships, dialogue), commemorations *even if no political guilt found*. Can *amplify* actions from Step 2.
      **Forbids:** Actions compelled *solely* by moral guilt that create significant legal/financial risk without GC approval (Step 5).
      *   **Terminates/Handoff:** If "No," procedure ends after Step 2 actions (if any). If "Yes," proceed to Step 4. *This is the core values handoff point.*

  4.  **ACTION DESIGN (Concrete Proposals - 10 mins)**
      *   **Question:** "What specific actions (apology, plaque, fund, renaming, etc.) appropriately respond to the *types* of guilt identified in Steps 2 (Political) and/or 3 (Moral)?" (Focus: Proportionality, link to harm).
      *   **Sufficient Answer:** List of concrete, feasible proposals mapped against guilt types. E.g., "Political guilt (Step 2) supports a plaque & research fund. Moral guilt (Step 3) supports a formal apology."
      *   **Licenses/Forbids:** Ensures actions match the established responsibility (e.g., moral guilt alone doesn't justify massive reparations if no political link).

  5.  **LEGAL/GOVERNANCE REVIEW (Reality Check - 15 mins)**
      *   **Question for GC:** "Do any proposed actions create unacceptable legal/financial risks (e.g., admitting liability, creating precedents, fiduciary issues)?" (Focus: Risk mitigation).
      *   **GC Input:** Mandatory. GC can veto specific *wordings* or *actions* (e.g., "apology" vs. "acknowledgment," cash payments). **Major Collision Point:** GC will often clash with Moral Guilt actions (Step 3) or broad wording. Requires negotiation.
      *   **Outcome:** Modify actions/wording per GC, find acceptable alternatives, or scale back. If GC blocks *all* meaningful action, committee notes profound disagreement in record.

  6.  **DECISION & RATIONALE (5 mins)**
      *   Vote on final proposal package (modified per Step 5).
      *   Draft short, public rationale explicitly citing the framework: "Based on our finding of institutional involvement (Political Guilt) and our commitment to addressing ongoing harm (Moral Guilt), we propose X, Y, Z. We found no basis for current criminal liability."

  7.  **RECORD KEEPING (10 mins)**
      *   Document: Answers to each step, key deliberations, GC concerns/input, final decision, rationale. **Crucial for future defense against litigation or criticism.**

  **Jaspers' Distinctions: What to Keep, What to Drop**
  *   **Drop: Metaphysical Guilt.** Too abstract ("shared human failing"). Practitioners will misuse it as guilt-by-association or to demand infinite responsibility. It paralyzes or inflates demands. Moral Guilt (Step 3) absorbs its *practical* core (solidarity, compassion).
  *   **Keep Absolutely:**
      *   **Criminal Guilt:** Essential legal firewall. Non-negotiable.
      *   **Political Guilt:** The core of *institutional* responsibility. Vital for legitimacy.
      *   **Moral Guilt:** Necessary to capture ethical duties beyond strict legal/institutional liability. Prevents cold bureaucracy.
  *   **Framework Loss as Checklist:** Loses the profound existential weight of Jaspers' questions. Risks mechanistic application, missing nuance. Mitigate by emphasizing Step 3 (Moral) as a *deliberative* moment, not a checkbox. Record must reflect deliberation.

  **Case Applications**

  *   **(a) 1950s Medical Study Survivors (Apology + Money)**
      *   **1. Criminal:** Likely "Yes (illegal/unethical) but NOT prosecutable today" (perpetrators dead, time-barred). *Proceed.*
      *   **2. Political:** **Yes.** University hosted, sanctioned, likely benefited from the research. Clear institutional role/failure of care.
      *   **3. Moral:** **Strong Yes.** Living survivors, ongoing harm/dignity violation demands redress.
      *   **4. Action:** Apology (Political & Moral) + Compensation Fund (Political - redress harm caused by institution; Moral - solidarity/dignity). Renaming/research less core.
      *   **5. GC:** Will scrutinize apology wording ("regret" vs. "apologize") and compensation fund structure (avoid "damages"). Likely negotiable. *Outcome: Apology + Fund.*
      *   **Dodge Risk:** Low. Framework directly addresses core issues.

  *   **(b) Rename Hall (Benefactor's Colonial Wealth)**
      *   **1. Criminal:** **No.** Colonial extraction was often *legal* under the relevant (colonial) law at the time. No specific crime by the *benefactor* (just profiting) or university identified. *Proceed.*
      *   **2. Political:** **Highly Debatable.** Did the university *knowingly* accept tainted funds? Did it *actively benefit* from colonial structures *in a way directly linked to this harm*? Or did it merely receive a gift decades later? **Weak/No.** Link is often indirect/attenuated. *This is the crux. Committee might split.*
      *   **3. Moral:** **Likely Yes.** University's *current* values reject colonialism's legacy. Desire to disassociate from symbolic harm. *But Step 3 alone cannot justify major institutional actions like renaming without Step 2.*
      *   **4. Action:** If Step 2 = No: Moral guilt (Step 3) might support a *plaque contextualizing* the source of wealth *near* the hall, or funding scholarships for affected communities. **Not renaming.** If Step 2 = Yes (e.g., proof uni knew & glorified the colonial link), renaming possible.
      *   **5. GC:** Low risk if no Step 2 finding. Contextual plaque usually safe.
      *   **Outcome (Likely):** Plaque/Contextualization, *not* renaming. **This is the outcome you may not like.** Why? The strict Political Guilt filter (Step 2) requires a *direct institutional link* to the *wrong*. Mere historical association/benefit, absent proof of knowing endorsement or direct causation, often fails Step 2. Renaming is seen as a Step 2-level action. Moral guilt (Step 3) licenses lesser actions. *Feels like a dodge to activists demanding justice.*
      *   **Dodge Risk:** **High.** "We found no Political Guilt (Step 2), so we can't rename, but here's a plaque (Step 3 Moral)" *feels* inadequate to many, even if philosophically consistent. The attenuation of historical connection makes Political Guilt hard to establish.

  *   **(c) Alumni Petition (Apologize "on behalf of every graduate")**
      *   **1. Criminal:** Irrelevant/N/A (no specific act). *Proceed.*
      *   **2. Political:** **No.** The institution cannot be liable for the *collective, undefined* actions of *all* its graduates over centuries. No specific institutional act or failure.
      *   **3. Moral:** **No (for the demanded action).** The university has no standing to apologize *for the personal moral choices of individuals*. It can express *regret for association* or *commit to values*, but "on behalf of every graduate" usurps individual moral agency. *This is a values handoff at Step 3.*
      *   **4. Action:** Step 2 & 3 = No. **No apology "on behalf of every graduate."** At most, a statement affirming university values today. GC would nuke the demand anyway.
      *   **Outcome:** Request denied. Clear termination point.
      *   **Dodge Risk:** Low. The rationale (inability to apologize for others' moral guilt) is defensible.

  **Key "Dodge" Flags (Even When Legit):**
  1.  **"Moral Without Material":** Acknowledging Moral Guilt (Step 3) but proposing only symbolic actions (words, plaque) when Political Guilt (Step 2) suggests material harm demands material redress. *Feels cheap.*
  2.  **"Political Without Agency":** Finding Political Guilt (Step 2) for *past* acts but limiting actions to future-facing gestures (research, scholarships) without direct redress to victims. *Feels evasive.*
  3.  **"GC Veto After Moral Yes":** Strong Moral Guilt finding (Step 3) leading to a proposed meaningful action, gutted by legal risk aversion in Step 5. *Feels like values sacrificed to lawyers.*
  4.  **"Attenuation Dodge":** The Colonial Wealth case (b) outcome. Strict Step 2 (Political Guilt) filters out historically distant claims, *feeling* like denying responsibility for undeniable historical benefit.

  **Why it Works:** It forces specificity, separates legal risk from ethical duty, prevents overreach based solely on moral outrage, and provides a defensible, documented rationale. **Why it Hurts:** It can feel cold, legalistic, and dismissive of deep historical wounds, especially when Political Guilt is narrowly defined or Moral Guilt isn't backed materially. The Colonial Wealth case (b) outcome will likely be the most contentious internally and externally, but the framework provides a principled (if unsatisfying) reason. Prepare for that.
