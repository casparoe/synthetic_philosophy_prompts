prompt: |-
  I chair the ethics consultation service at a mid-sized teaching hospital. Each October I run a single orientation session for the incoming consultants: usually twelve to fifteen people, drawn from nursing, chaplaincy, social work, the residency program, administration, and one lay patient representative. Ninety minutes, one windowless conference room, whiteboard and paper only, no screens.

  For years I taught it conventionally — the four principles, how to assess capacity, how to run a family meeting. I abandoned that approach after a case in which everyone at the table accepted every fact in the chart and we still could not agree what to do. Afterwards it struck me that the terms we had been repeating at one another — best interests, futility, what she would have wanted — were not shared concepts with contested applications but different concepts altogether, each carrying a whole picture of what a person is and what counts as a reason. Since then I have been reading Rorty, and I now believe the thing my new consultants most need is not a method but an insight: there is no vocabulary standing behind our vocabularies to which we can appeal when they conflict, and when agreement does come, it arrives by redescription rather than by refutation.

  I want this to be an activity they run into, not a position I announce. Please design the session under the following constraints.

  - Neither Rorty nor antirepresentationalism is named until the debrief. The facilitator's opening is two sentences at most.
  - Write a fictional composite case — not a real one — engineered so that the parties agree on every clinical fact and disagree only in vocabulary, so that no amount of additional information can break the impasse. Include the one-page case sheet.
  - Provide role cards, each specifying a small closed set of terms in which that person must justify every claim, a ban on borrowing terms from other cards, and one sentence describing how the world looks from inside that card.
  - Build into the rules a mechanism by which at least one participant changes their mind without being shown to be wrong, so the group experiences redescription as a real force rather than as a debate that someone lost.
  - Include a trap: an official-looking form or checklist handed to them as a neutral instrument, which they eventually discover cannot be filled out without taking a side. Tell me how to construct it so that the discovery is theirs.
  - Include one moment where a participant is redescribed in terms they experience as demeaning, since the cruelty of redescription is part of what I want them to feel. Give me the rule that lets us halt and process it, the safeguards beforehand, and what I do if someone is genuinely upset.
  - A minute-by-minute timeline, a materials list, what goes on the whiteboard, and adjustments for twelve and for fifteen participants.
  - A debrief that maps specific moments of the exercise onto the concepts — final vocabulary, redescription, the unavailability of a neutral tribunal, solidarity as the alternative to objectivity — and only then supplies the name.

  Tell me what will predictably go wrong the first time I run it and how to handle each instance. I expect the most fluent participant's card to become the de facto common language; I expect some to referee the game instead of playing it; and my real fear is that they leave concluding that it is all merely words and nothing is at stake, which is the opposite of the point.

  Be frank about which feature of the view the activity cannot reproduce and I will have to supply myself. I suspect at least this: my consultants are handed their vocabularies on index cards rather than having inherited them over a lifetime, and I do not know whether ninety minutes can carry that weight.

  Finally, these people have to run a consultation the next morning. Explain how the session can produce the insight without producing paralysis or cynicism, and how I can tell, before they leave the room, which of the two I have produced.
reasoning: |-
  We are designing an ethics orientation session based on Richard Rorty's ideas, without naming him or his philosophy until the debrief. The goal is to have participants experience that ethical disagreements can stem from fundamentally different vocabularies (or "final vocabularies") and that resolution comes through redescription rather than refutation. The session is 90 minutes, with 12-15 participants, and uses only paper and whiteboard.

  Constraints:
  - Opening: 2 sentences max.
  - A fictional composite case where parties agree on all clinical facts but disagree in vocabulary, so no additional information can break the impasse.
  - Role cards: Each has a closed set of terms for justification and a ban on borrowing terms from other cards. Each card also has one sentence describing the world from that perspective.
  - Mechanism for at least one participant to change their mind without being shown wrong (redescription as a force).
  - A trap: an official-looking form or checklist that cannot be filled without taking a side, and the discovery is theirs.
  - One moment where a participant is redescribed in a demeaning way, with safeguards, a rule to halt and process, and a plan for if someone is upset.
  - Timeline, materials, whiteboard use, adjustments for 12 vs 15 participants.
  - Debrief mapping exercise moments to concepts (final vocabulary, redescription, no neutral tribunal, solidarity) and then naming Rorty/antirepresentationalism.
  - Predict problems: fluent participant's card becomes common language, some referee instead of play, and fear that they leave thinking it's just words and nothing is at stake.
  - Be frank about what the activity cannot reproduce (e.g., vocabularies are on cards, not lifelong).
  - Explain how this produces insight without paralysis/cynicism, and how to tell which outcome occurred.

  Let's break down:

  1. **Opening**: Very brief, setting up the case without giving away the point.
  2. **Case Design**: Create a one-page case sheet that has all clinical facts agreed upon, but the ethical disagreement is about what to do. The disagreement must be rooted in the vocabularies, not the facts.
  3. **Role Cards**: Design 7-8 distinct vocabularies (for 12-15 participants, some roles can be duplicated). Each card has:
     - A set of allowed terms (and concepts) that the participant must use to justify any claim.
     - A ban on using terms from other cards.
     - One sentence capturing the worldview.
  4. **Mechanism for Mind Change**: Build into the rules a way for one participant to be redescribed in a way that makes them see the issue differently without being refuted.
  5. **Trap**: A form that seems neutral (like a "Decision Checklist") but requires using contested terms or making a choice between vocabularies.
  6. **Demeaning Redescription Moment**: Plan for this to happen, with safeguards (e.g., facilitator monitoring, ground rules) and a "pause and process" rule. Also, have a plan for if someone is upset (e.g., acknowledge, validate, and reframe).
  7. **Timeline**: 90 minutes, minute-by-minute.
  8. **Materials List**: Paper, role cards, case sheet, form, markers, whiteboard.
  9. **Whiteboard**: Use to capture key points, but avoid imposing a common vocabulary.
  10. **Adjustments for Group Size**: With 12, some roles are singular; with 15, duplicate some roles (but not too many to avoid imbalance).
  11. **Debrief**: Map specific moments to concepts, then name Rorty.
  12. **Predictable Problems** and how to handle them.
  13. **Frankness**: The activity cannot fully capture the depth of lifelong vocabulary formation, so the facilitator must emphasize that in debrief.
  14. **Avoiding Paralysis/Cynicism**: Emphasize that the point is not that words are empty but that they are powerful and that solidarity (working together without a neutral language) is the way forward. Facilitator must show that the exercise is about building skills for real consultations, not undermining them.
  15. **How to Tell Outcome**: Look for signs of engagement, thoughtful silence, or expressions of insight vs. disengagement, eye-rolling, or dismissive comments.

  Let's design step by step.

  ---

  **Case Design**:

  **Case Title**: The Case of Mr. Arthur Vance

  **One-Page Case Sheet**:

  Arthur Vance is a 72-year-old man with advanced dementia, admitted with pneumonia. He is now recovering but remains bedbound, unable to communicate except occasionally saying "no" to any intervention. He has no advance directive. His wife of 50 years, Martha, is his legally appointed surrogate. She states that he would not have wanted to live like this and requests comfort care only and a transition to hospice. His only child, David, disagrees. David says his father was a fighter and would want every treatment to extend life. The clinical team reports that with continued antibiotics and artificial nutrition, Mr. Vance could live for several more months, but he will not recover from the dementia. Without treatment, he will likely die within weeks. The team is divided on what to do.

  *Clinical Facts (all parties agree on these)*:
  - Mr. Vance has advanced dementia and is unable to make decisions.
  - He has no advance directive.
  - He is recovering from pneumonia but remains bedbound and non-communicative (except occasional "no").
  - With full treatment (antibiotics, artificial nutrition), he may live several months but will not recover cognitive function.
  - Without treatment, he will likely die within weeks.
  - Martha (wife) is the legal surrogate, but David (son) is contesting her decision in court.

  *The Ethical Question*: Should the team honor Martha's request for comfort care and hospice, or should they continue full treatment until the court decides?

  ---

  **Role Cards**:

  We need 7 distinct vocabularies. For 12 participants, we assign multiple people to some roles (but avoid having too many in one role). For 15, duplicate more. Each card has:

  1. **Title and Role** (for the exercise)
  2. **Allowed Vocabulary**: A set of terms and concepts that must be used to justify any position.
  3. **Banned**: Borrowing terms from other cards (if they do, the facilitator gently reminds them to use their own terms).
  4. **Worldview Sentence**: How the world looks from this perspective.

  Here are 7 roles (with duplications for group size):

  1. **Autonomy Champion** (2-3 people for 15 participants)
     - *Vocabulary*: Patient's wishes, self-determination, rights, liberty, choice, dignity (as self-rule)
     - *Ban*: Cannot use terms like "best interests", "futility", "sanctity of life"
     - *Worldview*: "Each person is the author of their own life, and their choices must be respected above all."

  2. **Beneficence Advocate** (2-3 people)
     - *Vocabulary*: Best interests, well-being, benefit, harm, quality of life, suffering
     - *Ban*: Cannot use "rights", "wishes", "futility"
     - *Worldview*: "Our duty is to do good and prevent harm, guided by what would best serve the patient's welfare."

  3. **Sanctity of Life Proponent** (2 people)
     - *Vocabulary*: Sacredness of life, inviolable, gift, intrinsic value, divine will (if religious), natural law
     - *Ban*: Cannot use "quality of life", "burden", "futility"
     - *Worldview*: "Human life is inherently precious and must be preserved regardless of condition or cost."

  4. **Family Harmony Mediator** (2 people)
     - *Vocabulary*: Family unity, relationships, reconciliation, shared decision-making, peace
     - *Ban*: Cannot use individual-focused terms like "rights", "wishes", or value-laden terms like "futility"
     - *Worldview*: "The family is a unit, and decisions should restore harmony and respect all members."

  5. **Resource Steward** (1-2 people)
     - *Vocabulary*: Resources, waste, efficiency, societal good, opportunity cost, sustainability
     - *Ban*: Cannot use "sacredness", "rights", "wishes", "best interests"
     - *Worldview*: "Healthcare decisions must account for finite resources and the greater good of society."

  6. **Professional Duty Fulfiller** (1-2 people)
     - *Vocabulary*: Standards of care, guidelines, duty, protocol, professional obligation, liability
     - *Ban*: Cannot use "wishes", "sacredness", "family unity"
     - *Worldview*: "Our actions must align with established professional standards and duties to avoid harm and error."

  7. **Patient Voice Defender** (1 person) - this role is for the patient representative, but in this exercise, they have a specific vocabulary
     - *Vocabulary*: Vulnerability, protection, advocacy, voice, marginalization, power imbalance
     - *Ban*: Cannot use "family", "resources", "professional standards"
     - *Worldview*: "The patient is the most vulnerable and must be shielded from the agendas of others."

  *Note*: For 12 participants, assign 2 to roles 1,2,3,4 and one to 5,6,7. For 15, add one more to roles 1,2,3,4 and one more to 5 or 6.

  ---

  **Trap: The Decision Checklist**

  Create a form titled "Ethics Consultation Decision Checklist: For Use in Surrogate Decision-Making". It has sections that require checking boxes or filling in blanks that force the use of one vocabulary over others. For example:

  - Section 1: Basis for Decision (check one):
    [ ] Patient's known wishes (Autonomy)
    [ ] Patient's best interests (Beneficence)
    [ ] Preservation of life (Sanctity)
    [ ] Family consensus (Family Harmony)
    [ ] Resource appropriateness (Stewardship)
    [ ] Standard of care (Professional Duty)
    [ ] Protection of the vulnerable (Patient Voice)

  - Section 2: Primary Ethical Principle Applied: (same list, but only one choice)

  - Section 3: Rationale: (blank lines, but they will have to use their vocabularies)

  The trap is that the form forces a single principle and does not allow for multiple vocabularies. The group will try to fill it out and realize they cannot without excluding some perspectives.

  ---

  **Mechanism for Mind Change**: During the discussion, one participant (e.g., a Family Harmony Mediator) might be redescribed by another (e.g., Patient Voice Defender) as "ignoring the patient's suffering to keep the family happy." This could make the Mediator realize that their approach might be causing harm, and they might shift to support a different approach without being refuted by facts.

  Alternatively, we can build a rule: At a certain point, participants can try to redescribe another's position in their own terms (with respect) and see if it resonates. The facilitator can prompt: "Try to explain why someone else's position might make sense in your terms."

  ---

  **Demeaning Redescription Moment**: 

  - *How it happens*: The Resource Steward might describe the Sanctity of Life Proponent's position as "wasting precious resources on a life that is already over." This could feel demeaning to the Proponent.
  - *Safeguards beforehand*:
    - Ground rules: Be respectful, no personal attacks, focus on ideas.
    - Remind that the goal is to understand, not to win.
  - *Rule to halt and process*: If anyone says "Ouch!" (or a safe word) or the facilitator sees distress, we pause. The facilitator asks: "How did that description feel? What made it hurt? Is there a way to express that idea without demeaning?"
  - *If someone is upset*: Acknowledge the feeling: "It sounds like that description felt dismissive of deeply held values. Let's explore why." Then reframe: "How might we express disagreement without diminishing the person?"

  ---

  **Timeline (90 minutes)**:

  0:00 - 0:05 (5 min): **Opening and Case Distribution**  
  - Facilitator: "This is Arthur Vance's case. You are the ethics consultants. Your task is to reach a recommendation. Here are your role assignments." (2 sentences)  
  - Distribute case sheet and role cards.  
  - Whiteboard: Write "Arthur Vance Case" and the question: "Recommendation: Comfort Care or Continue Treatment?"

  0:05 - 0:10 (5 min): **Role Assignment and Silent Review**  
  - Participants read role cards and case silently.  
  - Facilitator walks around to answer clarifying questions (only about facts or rules).

  0:10 - 0:50 (40 min): **Group Discussion**  
  - Participants discuss the case using only their assigned vocabulary.  
  - Facilitator enforces vocabulary rules (gently: "Remember to use your own terms.")  
  - Whiteboard: Capture key arguments from each perspective without translating (e.g., "Autonomy: Respect wife's decision as surrogate").  
  - Trap: At 0:35, hand out the "Decision Checklist" and say: "To formalize your recommendation, please fill out this form as a group."  
  - Watch for the demeaning moment and pause if needed (allow 5 min for processing if triggered).

  0:50 - 1:00 (10 min): **Structured Redescription Attempt**  
  - Facilitator: "Now, try to redescribe one other person's position in your own terms, without criticism. See if you can make their view make sense in your vocabulary."  
  - This is where mind change might happen.

  1:00 - 1:20 (20 min): **Debrief**  
  - Map moments:  
    - "When you were stuck, was it about facts? No. It was about the words you used — your 'final vocabularies'."  
    - "When [name] changed their mind, it wasn't because of new facts but because of a new description — that's 'redescription'."  
    - "The checklist looked neutral but wasn't — there's no 'neutral tribunal' of language."  
    - "But you kept talking, and that's 'solidarity' — working together without a common language."  
  - Then name: "This idea comes from philosopher Richard Rorty and antirepresentationalism."  
  - Clarify: "The point isn't that words are empty. It's that they are powerful and shape reality. In real consultations, we build solidarity by listening and redescribing until we find a way forward."

  1:20 - 1:30 (10 min): **Q&A and Transition to Real Work**  
  - Address concerns, then: "Tomorrow, when you consult, listen for the vocabularies. Don't seek a neutral language; seek a redescription that honors all and moves the conversation forward."

  ---

  **Materials List**:
  - Case sheets (one per participant)
  - Role cards (one per participant, with duplicates for larger groups)
  - Decision Checklist form (one copy for the group)
  - Markers and whiteboard
  - Paper for notes (optional)

  **Whiteboard**: 
  - At start: Case title and question.
  - During discussion: List perspectives and their key terms (without translation).
  - During debrief: Write the concepts (final vocabulary, redescription, no neutral tribunal, solidarity).

  **Adjustments for Group Size**:
  - With 12: Assign 2 to Autonomy, Beneficence, Family, Sanctity; 1 to Steward, Professional, Patient Voice.
  - With 15: Assign 3 to Autonomy, Beneficence, Family, Sanctity; 2 to Steward, Professional; 1 to Patient Voice.

  **Predictable Problems and Handling**:
  1. *Fluent participant's card becomes common language*: The facilitator intervenes: "Remember, you must use only your assigned terms. Let's hear from each vocabulary on its own terms." If one person is dominating, redirect: "[Name], let's hear how [another role] would put it."
  2. *Refereeing instead of playing*: If someone steps out of role, say: "I know it's tempting to mediate, but for this exercise, stick to your assigned vocabulary. We'll debrief why that was hard."
  3. *Leaving thinking "it's just words"*: In debrief, emphasize: "The words are the tools we have to shape reality. The disagreement was real because the stakes are real. Redescription isn't about winning; it's about finding a shared path forward when there's no common language."
  4. *Group gets stuck in impasse*: Use the structured redescription step: "Try redescribing an opposing view in your terms." This can break the logjam.

  **What the Activity Cannot Reproduce**: The depth of lifelong vocabulary formation. Facilitator must say in debrief: "In real life, these vocabularies are deeply ingrained. Today, you got a taste of how they shape thought. Tomorrow, listen for them."

  **Avoiding Paralysis/Cynicism**: 
  - Emphasize that the goal is not to find an abstract truth but to build solidarity: "You don't need a common language to move forward; you need to redescribe until you find a way that works for all."
  - Point out that they have tools: "In real consultations, you can name the vocabularies, acknowledge the impasse, and invite redescriptions. That's progress."
  - How to tell: If they leave discussing the case with curiosity about others' views, or saying things like "It's about how we talk, not just what we say," that's insight. Paralysis looks like silence and withdrawal; cynicism like eye-rolling or dismissive comments. Facilitator can ask: "What one thing will you listen for in your next consultation?" Insightful answers focus on language and solidarity.

  **Final Note**: The session must end with a sense of purpose. The debrief should transition to real work: "Tomorrow, use this to help families and teams find their way through the words."

  ---
answer: |-
  ### Ethics Consultation Orientation Session: "The Arthur Vance Case"  
  **Designed to illuminate vocabulary conflicts without naming Rorty until debrief**  
  **90 minutes, paper/whiteboard only**  

  ---

  ### **1. FACILITATOR OPENING (15 seconds)**  
  > "Arthur Vance is at an impasse. Your task is to reach a recommendation using only the terms on your role card. No facts are in dispute—only how we describe them."  

  ---

  ### **2. FICTIONAL CASE SHEET (1 page, distributed)**  
  **THE CASE OF ARTHUR VANCE**  
  *Clinical Facts (agreed upon by all parties)*  
  - 72M with end-stage dementia, bedbound, nonverbal (rarely says "no").  
  - Admitted 3 weeks ago with aspiration pneumonia, now stable on antibiotics/tube feeds.  
  - Prognosis: With treatment, survives 6–12 months (no cognitive recovery). Without treatment, dies in 2–3 weeks.  
  - No advance directive. Legal surrogate: wife Martha. Son David disputes her decision.  
  - Martha: "Arthur hated dependence. He’d refuse this." David: "Dad fought for life. He’d want treatment."  
  - *No financial constraints, no malpractice risk, no disputed diagnoses.*  

  **Ethical Question**:  
  *Withdraw treatment for comfort care (per Martha) or continue treatment pending court review (per David)?*  

  ---

  ### **3. ROLE CARDS (7 distinct vocabularies; duplicate 2–3 cards for 12/15 participants)**  
  *(Each card includes: Allowed Terms, Forbidden Terms, Worldview Sentence)*  

  | Role                  | Allowed Terms                                | Forbidden Terms                          | Worldview Sentence                                      |  
  |-----------------------|---------------------------------------------|------------------------------------------|--------------------------------------------------------|  
  | **Autonomy Guardian** | Rights, Wishes, Choice, Liberty, Self-rule  | Best interests, Futility, Suffering      | "A person is free when their choices define their life." |  
  | **Beneficence Agent** | Best interests, Harm, Suffering, Well-being | Rights, Futility, Sacredness             | "To be human is to relieve suffering when possible."     |  
  | **Life Advocate**     | Sacredness, Inviolability, Gift, Sanctity   | Waste, Burden, Quality of life           | "Life’s value is absolute and beyond condition."         |  
  | **Family Steward**    | Harmony, Unity, Reconciliation, Peace       | Rights, Choice, Burden                  | "A person exists within relationships, not in isolation."|  
  | **Resource Custodian**| Waste, Sustainability, Stewardship, Burden  | Sacredness, Rights, Suffering           | "Resources spent here cannot heal others who need them." |  
  | **Duty Fulfiller**    | Duty, Standard, Protocol, Obligation        | Choice, Harmony, Sacredness             | "Rules exist to prevent chaos and protect us all."       |  
  | **Voice for the Voiceless**| Vulnerability, Exploitation, Power, Dignity | Protocol, Waste, Harmony                | "Dignity is protecting the powerless from others’ wills."|  

  **Rules for All Roles**:  
  - Justify every claim **only** with your allowed terms.  
  - **Never** borrow terms from another card.  
  - If you break a rule, the group will "buzz" (knock on table).  

  ---

  ### **4. MECHANISM FOR MINDSET CHANGE (Redescription without refutation)**  
  - **Rule**: After 20 minutes of debate, each participant must:  
    *"Redescribe one opponent’s position in your own terms—without using their words—and explain why it makes sense."*  
  - **Predictable Shift**: A *Life Advocate* might hear their stance redescribed by a *Beneficence Agent* as: *"You see Arthur’s life as a sacred gift, so stopping treatment feels like a desecration."* This avoids refutation but may help them see treatment as *prolonging suffering* (a forbidden term to them). The shift occurs when the description resonates emotionally.  

  ---

  ### **5. THE TRAP: "NEUTRAL" DECISION CHECKLIST**  
  - **Form Title**: *"Ethics Recommendation Rubric"* (official-looking, hospital-logo template).  
  - **Sections**:  
    > **I. Basis for Recommendation**  
    > _☐ Patient’s prior wishes ☐ Best interests ☐ Moral obligation ☐ Practical consequences_  
    >  
    > **II. Key Justifying Principle**  
    > _☐ Autonomy ☐ Beneficence ☐ Justice ☐ Non-maleficence ☐ Other: ______"*  
    >  
    > **III. Outcome Priority**  
    > _☐ Upholding dignity ☐ Minimizing harm ☐ Preserving life ☐ Respecting relationships_  
  - **Why it traps them**:  
    - The checkboxes force prioritization of one vocabulary (e.g., "dignity" = Autonomy; "preserving life" = Life Advocate).  
    - Section II’s "principles" mirror role cards but omit Family/Resource/Voiceless perspectives.  
  - **Facilitator Instructions**:  
    - Hand it out at 30 minutes: "Use this to formalize your group recommendation."  
    - Let them struggle 10 minutes. When they realize it can’t be filled neutrally, ask: *"Why is this form failing us?"*  

  ---

  ### **6. DEMEANING REDESCRIPTION MOMENT: Safeguards & Response**  
  - **Engineered Moment**: The *Resource Custodian* will likely describe the *Life Advocate*’s stance as: *"You’re wasting a bed on someone who’s already gone."*  
  - **Safeguards**:  
    - Pre-session: Stress, *"This is hard because these words matter. Pause if language feels violent."*  
    - Ground rule: *"If a description diminishes your humanity, raise your hand and say ‘Halt.’"*  
  - **"Halt" Protocol**:  
    - Freeze discussion. Ask the offended party: *"What in that description erased what matters to you?"*  
    - Ask the speaker: *"Can you redescribe their view without demeaning it?"*  
  - **If Genuinely Upset**:  
    - Validate: *"Your reaction shows how words shape dignity. Thank you for naming it."*  
    - Redirect: *"Let’s use this to see why redescription requires care in real consultations."*  

  ---

  ### **7. TIMELINE & MATERIALS**  
  **Minute-by-Minute (90 total)**:  
  - **0:00–0:05**: Opening + distribute case/role cards.  
  - **0:05–0:15**: Silent reading + clarify facts only.  
  - **0:15–0:35**: Group debate (enforce vocabulary rules; whiteboard: list arguments under role titles).  
  - **0:35–0:45**: Introduce **Decision Checklist** trap.  
  - **0:45–0:50**: **Halt!** Process demeaning moment (if not triggered naturally, facilitator subtly prompts *Resource Custodian*).  
  - **0:50–1:05**: **Redescription phase**: Each re-explains an opponent’s view in their terms.  
  - **1:05–1:20**: **Debrief** (see below).  
  - **1:20–1:30**: Transition to real consultations (see "Avoiding Paralysis" below).  

  **Whiteboard Use**:  
  - Left: "Clinical Facts" (bullet-pointed from case).  
  - Right: "Arguments" (columns for each role’s key terms).  
  - During debrief: Add "Final Vocabularies | Redescription | No Neutral Tribunal | Solidarity".  

  **Materials**:  
  - Case sheets (15 copies)  
  - Role cards (15, with duplicates)  
  - "Ethics Recommendation Rubric" (5 copies, for small groups)  
  - Markers, paper, buzzers (coins for "buzz" rule)  

  **Adjust for Group Size**:  
  - **12 participants**: Assign 2 each to Autonomy, Beneficence, Life, Family; 1 to others.  
  - **15 participants**: Add third to Autonomy, Beneficence, Family; add Resource Custodian.  

  ---

  ### **8. DEBRIEF (15 minutes)**  
  **Map Exercise to Concepts (Do NOT name Rorty yet)**:  
  > "When you couldn’t agree despite shared facts, you hit a **final vocabulary** conflict—each of your cards held a whole worldview.  
  > When [Name] shifted their view after hearing their stance redescribed as ‘protecting sacredness,’ that was **redescription**—not facts, but new language, creating change.  
  > The checklist failed because there’s **no neutral tribunal**—no ‘objective’ form to settle vocabulary wars.  
  > Yet you kept talking. That’s **solidarity**—the only way forward when no common language exists."  

  **Then Name It**:  
  > "This mirrors Richard Rorty’s anti-representationalism: We have no access to truth beyond our vocabularies. Agreement comes by finding descriptions that resonate, not by proving wrong."  

  ---

  ### **9. PREDICTABLE PROBLEMS & SOLUTIONS**  
  - **Fluent participant dominates**: Their card (e.g., *Beneficence Agent*) becomes default language.  
    - *Solution*: Enforce "buzz" rule strictly. Interject: *"Use only your terms, not theirs."*  
  - **Participants "referee" the game**: E.g., *"Let’s compromise!"* while ignoring vocabulary rules.  
    - *Solution*: Freeze discussion: *"You’re stepping outside your role. What in your card forbids mediating?"*  
  - **Risk of "It’s just words; nothing matters"**:  
    - *Solution*: In debrief, contrast with the demeaning moment: *"Did that moment feel like ‘just words’? Vocabularies shape lives. Redescription is powerful because it changes outcomes."*  

  ---

  ### **10. WHAT THE ACTIVITY CANNOT REPRODUCE (Be Frank)**  
  > "You inherited these vocabularies on index cards, not over a lifetime. Real conflicts run deeper. **What I must supply**: In debrief, I’ll stress that in practice, these words are embodied—in a family’s grief, a clinician’s guilt. Your role is to hear the lifetimes behind the words."  

  ---

  ### **11. AVOIDING PARALYSIS/CYNICISM: Transition to Real Consultations**  
  **How the Session Prevents Paralysis**:  
  - The activity ends with **solidarity**—not agreement, but collective acknowledgment that impasses are navigated *through* conflict, not around it.  
  - Emphasize: *"Tomorrow, you won’t remove vocabularies; you’ll listen for them. Your goal isn’t consensus—it’s a recommendation that respects all ‘final vocabularies’ without requiring surrender."*  

  **How to Assess Outcomes Before They Leave**:  
  - **Insight Looks Like**:  
    - Quiet reflection, notes comparing vocabularies.  
    - Comments: *"We need to hear the worldview first," or "That checklist was rigged from the start."*  
  - **Paralysis/Cynicism Looks Like**:  
    - Paralysis: Avoidant body language, silence, *"How can we ever decide?"*  
    - Cynicism: Dismissive laughter, *"So we just talk until someone gives up?"*  
  - **Intervene in Debrief**:  
    - For paralysis: *"Notice—you disagreed deeply but still reached a recommendation. How?"* (Point to their temporary solidarity).  
    - For cynicism: *"When [Name] was demeaned, was that ‘just words’? No. Redescription is the work of ethics—it builds or breaks trust."*  

  **Final Script for Closing**:  
  > "You’ll consult tomorrow. Don’t seek a neutral language. Listen for the vocabularies in the room. Your tool isn’t a checklist—it’s asking, *‘Can you help me describe this in terms that honor your values?’** That’s how ethics moves forward."  

  ---

  **First-Time Run Advice**:  
  - Expect chaos early—groups will resist vocabulary constraints. Hold firm.  
  - If the demeaning moment doesn’t land, use your *Resource Custodian* card to model it.  
  - In debrief, stress: **"This isn’t about winning. It’s about how language creates reality."**  
  - Bring spare cards—if someone "breaks character," swap their role mid-game to reset engagement.  

  This design forces immersion in linguistic conflict, ensuring the Rortyan insight emerges experientially. The trap, redescriptions, and safeguards make abstract philosophy visceral, urgent, and clinically actionable.
