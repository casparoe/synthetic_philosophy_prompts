  ## THE CONSENSUS CLOCKS UP: ONE YEAR OF HEADLINE-FREE NEWS

  **Headline:**
  READING ROOM REVOLUTION: AUTHORLESS DAILY DEFIES GRAVITY WITH 12-MONTH CLIMB

  **Standfirst:**
  *The Consensus*, launched last March by venture capitalist Alistair Finch on the radical principle that "no one should write a newspaper," reports steadily rising circulation. Industry scepticism meets reader curiosity as the byline-free broadsheet attributes every word to its collective readership. We examine the numbers, the novel mechanics, and the quiet scandal of the umbrella man.

  ---

  The newspaper launch is typically a cacophony of ego, ambition, and named columnists. *The Consensus*, which hit newsstands and apps precisely one year ago today, offered only silence where bylines should be. Its proprietor, Alistair Finch, a man whose fortune derives from algorithmic logistics and who describes his own political and social views as "a pleasingly blank space," funded the venture on a single, baffling premise: "A newspaper written by individuals," Finch stated blandly at the muted launch event, "is fundamentally dishonest. It pretends one person, or a small group, can speak *for* others. *The Consensus* speaks *as* its readers. It *is* the readership, manifested daily."

  This metaphysical manoeuvre required abolishing authorship entirely. No bylines grace its pages. The masthead lists no editor, no deputy editors, no foreign editor – merely the paper’s title, Finch’s holding company ("Horizon Abstract"), and the slogan: "What You Think, As You Read It." Every report, leader column, correction, and football result is attributed to "Our Readers." A figure known only as the Spokesman (the paper clarifies he is "not an employee of *The Consensus*") elaborates: "The readership isn't a pre-existing audience we address. It’s an entity called into being by the act of reading *The Consensus*. The paper manufactures the very thing that consumes it. To attribute words to an individual writer would be a category error, like blaming a single wave for the tide."

  **Libel Limbo and Rising Tides**

  Early circulation was modest, hovering around 38,000 for the print edition, with digital subs at 22,000. Sceptics predicted a swift demise. However, a significant turning point came six months in, coinciding with the paper’s decision to formally abandon any typographical distinction between news reportage and comment. All text adopted the same measured, slightly abstract tone, regardless of subject matter. A minor Cabinet reshuffle received precisely the same column inches and stylistic weight as a review of a new brand of artisanal kettle chips. "Uniformity of register is paramount," the Spokesman noted. "A reader should invest no more belief in a story about celestial phenomena than in the weather forecast. Both are equally valid contributions to the day's discourse." Post-merger, combined print and digital circulation jumped 17% month-on-month, settling at a combined figure of 72,000 by month eight, and climbing steadily since. Current ABC audited figures sit at 87,500 combined.

  This smooth operation hit an inevitable snag: a libel action. A prominent financier, Mr. Julian Thorne, alleges a *Consensus* story implied misconduct regarding a pension fund. The problem is existential. "Our Readers" cannot be served papers or mount a defence. The paper’s legal department (itself unattributed in any filing) insists the story emerged organically from the readership and reflects their collective view. Finch’s holding company is named as publisher, but Finch himself refuses to acknowledge any editorial role. The Spokesman confirmed, "The paper is confident the collective view of the readership will prevail. Attributing responsibility to an individual would be a production error we simply cannot commit to." The case languishes in procedural limbo, a monument to the paper’s founding principle.

  **Where Leaders Are Lurking**

  Editorial direction, such as it is, purportedly emerges from the paper’s own digital comment section. Dubbed "The Conversation," it functions as a vast, real-time editorial conference. "The Spokesman" (via email, naturally) explained: "Leader columns are distilled from the prevailing currents of discussion within 'The Conversation'. We identify emergent themes – the collective murmur – and reflect them back, refined, in the next day’s paper. Passion is noise; reflection is signal. The ideal story provokes endless discussion without ever prompting a conclusion or, heaven forbid, action. Volume of remark is our primary KPI." Recent leaders have covered topics like "The Perceived Pace of Modern Life" and "Ambivalence Regarding Municipal Flowerbeds."

  **Posthumous Puzzles**

  The Obituaries desk presents a unique challenge. How does a paper that refuses individual attribution handle death, the most individual of events? The solution is a curious blend of the general and the gnomic. Recent examples include: "A figure associated with the development of post-war concrete structures is no longer contributing to that discourse," and "A voice once heard in certain literary circles has fallen silent." Cause of death is rarely mentioned unless it can be framed as a widespread societal trend ("The cessation of biological function continues to impact demographic projections"). The Spokesman offered no comment on specific difficulties, merely reiterating that "the individual is always subsumed within the broader narrative of the readership’s ongoing experience."

  **The Umbrella Man: A Triumph of Gossip**

  The paper points to its recent 17-part investigative series as its crowning achievement. It focused on a previously unknown private citizen, Mr. Edgar Bellweather (a name only established after the series began, through external reporting). *The Consensus* dedicated thousands of words, accompanied by discreetly taken photographs, to meticulous observations: the specific angle at which Mr. Bellweather held his umbrella in light rain; the precise, two-fingered technique he employed to remove his trilby; the consistent, quarter-inch discrepancy in the length of his trouser legs. No allegation of wrongdoing was made, or indeed, could be made under the paper’s principles. The purpose was conversion. "Gossip," the Spokesman stated, "is the truest form our age possesses. Our role is to transmute the raw ore of existence into what people are saying. We converted Mr. Bellweather from a man nobody had heard of into something everyone had a view about."

  The series achieved its aim spectacularly. Mr. Bellweather became a local talking point, then a minor national curiosity. Schoolchildren began following him, mimicking his walk and hat removal. Letters poured into "The Conversation" debating the sartorial implications of uneven trousers and the philosophy of umbrella grip. Circulation spiked by 12% during the series run. "That," the Spokesman declared, "is success. We offered readers the pure pleasure of holding opinions – myriad opinions – about Mr. Bellweather’s trouser legs, without the burden of those opinions meaning anything at all. He became pure, frictionless discourse." Mr. Bellweather, reportedly, has changed his route home. *The Consensus* has not reported this development.

  Combined print and digital circulation for *The Consensus* now stands at 94,300.
