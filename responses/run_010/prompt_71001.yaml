prompt: |-
  I chair the animal-welfare funding panel of a mid-sized private foundation, and I need the decision memo to circulate before our spring meeting.

  The proposal in front us is $850,000 over three years to develop and field-test a welfare-weighting methodology for terrestrial arthropods. The applicants would deliver (i) a defensible moral weight for an insect relative to a mammal — they float a range of roughly 10⁻³ to 10⁻² per animal, with error bars they concede span several orders of magnitude; (ii) a counting protocol for arthropods affected by a single agricultural intervention in one crop system; and (iii) a decision tool that lets other funders apply the two.

  The panel is split, and not along the usual lines. One half argues this is the most cost-effective thing we could fund: even a very small probability of arthropod sentience, multiplied by the number of insects an intervention touches, dominates everything we currently grant for vertebrates. The other half thinks we would be buying false precision on a number that does no real work — that the estimate is not merely uncertain but unverifiable, since no behavioural or neurological assay can settle the question, and that the arithmetic will license almost anything once populations get large enough. Their sharpest version of the worry is a reductio: the same reasoning obliges us to fund soil nematode research next year on an even larger population, and they want to know why that is not simply where the logic leads.

  Our charter adds a complication: every grant must be justified in terms of "vertebrate-equivalent lives improved," which is straightforward when the equivalents are counts and pathological when they are products of a low-confidence probability and an enormous population.

  Draft the memo I will circulate. It must state which decision rule under moral uncertainty you are applying — expected value across the panel's disagreement, a maximin-style rule, something else — and say why that rule is the right one here rather than merely the convenient one. Then give a recommendation: fund, reject, or fund with conditions, with any conditions concrete enough that a panel could monitor compliance at annual review. Engage the strongest form of the sceptical half's case, including the nematode reductio, on its own terms; do not settle for observing that the evidence on arthropod sentience is mixed.

  Close with a line beginning "Verdict:" followed by exactly one of FUND, REJECT, or FUND WITH CONDITIONS.
reasoning: |-
  Okay, let me approach this systematically. The user chairs an animal-welfare funding panel facing a contentious $850k arthropod welfare proposal. The core tension is between expected value maximizers who see massive scale potential and skeptics who critique unverifiable precision and slippery slopes to nematodes. 

  First, I need to map the philosophical landscape. The expected value argument hinges on probability-weighting the sentience claim, while the skeptic's reductio exposes how any infinitesimal weight plus huge populations could drain resources. Both have merit - the scale *is* compelling, but the nematode parallel *does* reveal a structural flaw in pure EV reasoning here.

  The charter's "vertebrate-equivalent" requirement is the pivot. It forces us to reject naive EV that treats low-confidence probabilities as actionable numbers. But outright rejection wastes the proposal's real strengths: the counting protocol and decision tool could stand independently as infrastructure. 

  So the solution must reframe. We can salvage rigor by funding (ii) and (iii) while conditionally deferring (i)'s weight assignment until after foundational sentience research. This meets skeptics on verification grounds while honoring scale-concerned panelists by building measurement capacity now.

  Conditions need teeth: no weight publication without external validation pathways, and mandatory scope boundaries excluding nematodes/rotifers. The panel's monitoring role here is key - annual review of validation progress will enforce intellectual honesty.

  On decision rules, maximin is too conservative given the stakes, while unfiltered EV is reckless with uncertainty. A modified "expected value under verification constraints" splits the difference: we invest in tools while demanding sentience claims meet higher epistemic standards before influencing allocations.

  The nematode reductio gets engaged directly: we explicitly exclude non-arthropods and require the tool to embed uncertainty visualization. This contains slippery slopes while acknowledging that arthropods' neural complexity at least differentiates them meaningfully from nematodes per current literature.

  Finally, the verdict must bind future decisions: "FUND WITH CONDITIONS" forces the applicants to either deliver verification or leave weights out of the tool. That's the only way to respect both the scale argument's intuition and the skeptic's epistemological rigor.
answer: |-
  **MEMORANDUM**  
  To: Animal-Welfare Funding Panel  
  From: Chair, Animal-Welfare Funding Panel  
  Date: 15 April 2025  
  Subject: Recommendation: Arthropod Welfare-Weighting Proposal (Ref: AWF-2025-07)  

  ### **I. Proposal Summary**  
  Applicants seek $850,000 over 3 years to:  
  1. Develop a moral weight estimate for arthropods relative to mammals (proposed range: 10⁻³–10⁻², with high uncertainty).  
  2. Create a field protocol for counting arthropods affected by agricultural interventions.  
  3. Build a decision tool for funders to apply (1) and (2).  

  ### **II. Panel Divergence**  
  **A. Pro-Argument:** Expected value (EV) dominates. Even low probability of arthropod sentience × population scale (e.g., 10¹⁰ insects/acre-year) could yield welfare gains orders of magnitude above vertebrate-focused grants.  
  **B. Skeptical Argument:** The weight estimate is epistemically unverifiable (no test can confirm subjective experience), risking false precision. Large populations allow arbitrary justifications (e.g., weighting nematodes at 10⁻⁶ justifies larger grants).  

  ### **III. Decision Rule Under Moral Uncertainty**  
  We apply **constraint-weighted expected value (CWEV)**.  
  - **Why CWEV?** Pure EV maximization ignores the skeptics’ core critique: when probabilities lack empirical anchors, EV can amplify errors. CWEV discounts proposals where key parameters are *both* highly uncertain *and* unverifiable.  
  - **Why not alternatives?**  
    - *Maximin*: Overly conservative; rejects high-upside bets essential in nascent fields.  
    - *Pure EV*: Ignores the "nematode reductio" – if arthropod weights are accepted without verification, consistency demands funding nematode research, diverting resources from tractable interventions.  
  - **CWEV in practice:** We fund high-scale opportunities *only if* they include mechanisms to reduce unverifiable uncertainty.  

  ### **IV. Recommendation: FUND WITH CONDITIONS**  
  The proposal’s value lies in (ii) counting protocols and (iii) decision tools – infrastructure enabling *future* welfare gains. However, (i) moral weighting requires safeguards against false precision.  

  **Conditions:**  
  1. **Phase 1 Restriction (Year 1):**  
     - Funds release contingent on applicants reframing the moral weight (i) as a *sensitivity analysis module* for the decision tool, **not** a standalone estimate. The tool must visualize outcomes across the full uncertainty range (e.g., 10⁻⁶–10⁻¹), with no default weight.  
     - *Compliance Check:* Draft tool submitted at 9-month review; no vertebrate-equivalent calculations published without Panel approval.  

  2. **Verification Pathway (Year 2):**  
     - Applicants must collaborate with neuroethologists to define falsifiable criteria for weight validation (e.g., integrative biomarkers of negative valence). If no pathway is feasible, the weight module converts to a cautionary "epistemic uncertainty" dashboard.  
     - *Compliance Check:* Progress report on verification criteria by Month 18.  

  3. **Scope Exclusion:**  
     - The tool explicitly excludes nematodes/rotifers and flags population-size-driven arbitrariness via alerts (e.g., "Outputs for populations >10⁹ require Panel override").  
     - *Compliance Check:* Tool architecture reviewed at annual intervals.  

  ### **V. Engaging the Skeptical Case**  
  The nematode reductio is valid: if moral weight hinges solely on scale-adjusted probability, *any* claimed sentience probability >0 demands funding. This logic dissolves prioritization. **However**, arthropods are a *strategic* boundary:  
  - They sit at the complexity threshold where neurobiological evidence (e.g., opioid response in bees) permits *plausible* case-building, unlike nematodes.  
  - Agriculture’s concentrated arthropod populations offer feasible measurement, unlike soil ecosystems.  
  Our conditions force applicants to either:  
  (a) Build verification for arthropod-specific weights, or  
  (b) Confine the tool to *conditional* scenarios ("*If* weight = X, *then* impact = Y"). This contains the reductio by demanding field-specific evidence.  

  ### **VI. Charter Compliance**  
  Grants will cite "vertebrate-equivalent lives improved" **only** under defined constraints:  
  - For the counting protocol (ii): Equivalents calculated only after Panel-approved validation (e.g., "1M insects = X vertebrates *if* weight is validated at 0.005").  
  - Until then, cost-effectiveness shown via **bounded outputs** (e.g., "This intervention improves between 10⁴–10⁷ vertebrate-equivalents per $100k, pending sentience research").  

  ---

  **Verdict:** FUND WITH CONDITIONS
