  Breaking down the paragraph sentence-by-sentence is essential. The "infinite regress" charge seems damning to a scientist, but in HOT:  
  - Actual theories don't require conscious higher-order states; unconscious meta-states suffice.  
  - It's not a temporal chain but an embedded relation, like a self-maintaining system (which they'd understand from kinetics).  
  - Rosenthal's non-conscious HOT is the pivot here—comparable to how a reaction intermediate isn't observed but enables the outcome.

  On animal consciousness: The author's claim hinges on HOT requiring concepts. But many HOT theorists explicitly reject this—Gennaro's intrinsic higher-order content, or Tye's analog tracking. A chemist would get the "emergent property" parallel: infant/dog consciousness isn't less real because their meta-cognition isn't human-like.

  Historical obsolescence is just false. Cite SEP's active entries and 2020s papers. They'll respect evidence over assertion.  

