  The other trustee's objection has three parts: concave utility functions, portfolio effects, and arbitrariness of squaring. Concave utility would naturally make the nonprofit risk-averse without altering probabilities. Portfolio effects are crucial—evaluating projects individually might miss diversification benefits. If one project fails but others succeed, the overall portfolio might still be okay. The squaring function is arbitrary; why not cube or use another shape?

  The user needs a memo recommending adoption, rejection, or a modified version. They want a definite bottom line, reasons the actuary can push back on, and a real hearing for the objections. 

