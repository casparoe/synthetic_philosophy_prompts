  The actuary's pushback might argue that concave utility doesn't address the calibration issue. But the calibration argument might not hold in this context. Nonprofits care about mission-related outcomes, not just money. Plus, they're not facing repeated gambles. 

  The bottom line: Reject squaring probabilities but implement a concave utility function and portfolio analysis. This addresses risk aversion without the arbitrary weighting and considers interdependencies. 

