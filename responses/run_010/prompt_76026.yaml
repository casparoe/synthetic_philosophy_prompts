  - Directly addresses the confound: "*two-group contrast can't separate grammar from upbringing*"  
  - Excellent cultural analysis: oral tradition (*"endless practical reasons to track who said what"*) and literacy (*"retain content and discard source"*) as viable alternatives  
  - Perfect follow-up proposal: **bilingual group** (*"landed between... settles causal work"*)  
  - **Tired-Grader Safeguard:** "Culture" argument is nuanced (schooling ≠ reading habits/oral daily life)—prevents underrating this section.  

  **(d) Evaluating Own Follow-ups (3.5/4)**  
