prompt: |-
  I sit on the editorial board of a journal that publishes a great many adaptationist claims about human psychology, and I want to replace our one-paragraph reviewer guidance with a real specification. Write the desiderata that an adaptationist explanation — a claim that trait T was shaped by natural selection for the function it now performs — must meet before a reviewer should let it through, given the force of the Gould–Lewontin spandrels critique.

  Two things I care about especially. First, that critique gestures at several distinct non-adaptive sources of organic form — architectural byproduct, co-option of a structure that arose for some other purpose, developmental and allometric constraint, phylogenetic legacy, drift — and I suspect our reviewers treat these as a single bucket called "alternatives to selection." The list should force a submitted claim to say which of these it has ruled out and by what means. Second, make the list sensitive to the gap between a trait's origin and its maintenance: a trait can be superbly engineered for what it does now and still not be an adaptation, and a genuine adaptation can be functionless in the environment of its subjects today.

  For each desideratum, state the failure mode it exists to catch and give one concrete illustration drawn from popular explanations of human behaviour. Then mark which requirements are non-negotiable and which are the preferences of particular camps, and identify any pair you think cannot be satisfied jointly — my hunch is that the demand for genuinely testable alternatives pulls against the demand for evidence about the actual historical origin, but convince me or correct me. Finish with a short assessment of how current practice in evolutionary psychology measures up.

  End with a last line of the form "Verdict: " naming the single desideratum that does the most to exclude otherwise plausible claims.
reasoning: |-
  We are writing a set of desiderata for adaptationist claims in human psychology, inspired by the Gould-Lewontin critique. The critique highlights non-adaptive explanations (architectural byproduct, co-option, developmental constraints, phylogenetic legacy, drift). We want to force reviewers to consider which of these alternatives have been ruled out and how. Also, we must be sensitive to the gap between a trait's origin and current function/maintenance.

  The desiderata should:
  1. Address the non-adaptive alternatives by requiring explicit consideration and rejection of specific alternatives.
  2. Address the distinction between the trait's origin and its current maintenance.

  We'll list each desideratum, its failure mode, and a concrete example from popular explanations of human behavior. Then we'll mark which are non-negotiable and which are preferences of camps, and note any tensions. Finally, we'll assess evolutionary psychology practice and end with a verdict.

  Desiderata:

  1. **Explicit Statement of the Adaptive Function**: The paper must clearly state the specific adaptive problem that the trait is hypothesized to solve. 
     - *Failure mode*: Vague or just-so storytelling without a clear problem.
     - *Example*: Claiming that jealousy is an adaptation for mate guarding without specifying the precise selective pressures (e.g., paternity uncertainty in males, resource diversion in females).
     - *Status*: Non-negotiable.

  2. **Evidence of Special Design**: The paper must provide evidence that the trait exhibits complexity, efficiency, or specificity that is unlikely to have arisen by chance and is well-suited to the proposed function. 
     - *Failure mode*: Assuming that because a trait is beneficial it must be an adaptation, without evidence of design.
     - *Example*: Arguing that the human chin is an adaptation for speech without showing how its structure is specifically designed for that purpose (it might be a byproduct of other skeletal changes).
     - *Status*: Non-negotiable for adaptationist claims.

  3. **Consideration of Non-Adaptive Alternatives**: The paper must explicitly consider and rule out at least the most plausible non-adaptive alternatives (byproduct, co-option, constraint, legacy, drift) for the trait. 
     - *Failure mode*: Treating non-adaptive alternatives as a single undifferentiated category and dismissing them without specific argument.
     - *Example*: Explaining religious belief as an adaptation for group cohesion without considering that it might be a byproduct of general pattern recognition and agency detection (which are adaptations for other purposes).
     - *Status*: Non-negotiable.

  4. **Distinction Between Current Utility and Historical Origin**: The paper must address whether the trait is maintained by current selection or is a relic of past selection, and whether the current function is the same as the original function. 
     - *Failure mode*: Conflating current utility with historical adaptation.
     - *Example*: Arguing that the sweet tooth is an adaptation for seeking ripe fruit, without addressing that in modern environments it leads to obesity (thus the current utility might be maladaptive) or that it might have been co-opted from a different original function.
     - *Status*: Non-negotiable.

  5. **Phylogenetic Context**: The paper must situate the trait within a comparative framework, showing that the trait is derived in the lineage and not a shared ancestral trait that may have evolved for different reasons. 
     - *Failure mode*: Assuming a trait is an adaptation without considering that it might be a conserved trait from an ancestor.
     - *Example*: Claiming that human bipedalism is an adaptation for carrying tools without comparing with other primates that are not bipedal but still use tools (and without considering that bipedalism might have initially evolved for other reasons, like energy efficiency in locomotion).
     - *Status*: Preferred by some camps (especially in biology), but not always feasible for uniquely human traits. However, for traits shared with other species, it is non-negotiable.

  6. **Developmental and Genetic Evidence**: Where possible, the paper should consider developmental pathways and genetic architecture to rule out constraints or byproducts. 
     - *Failure mode*: Ignoring that the trait might be a necessary byproduct of development or genetically linked to another trait under selection.
     - *Example*: Arguing that human male pattern baldness is an adaptation for some function (e.g., signaling maturity) without considering that it might be a byproduct of hormonal pathways that are adaptive in other contexts.
     - *Status*: Preferred, but not always possible (non-negotiable if relevant data are available).

  7. **Testability and Falsifiability**: The paper must propose specific, testable predictions that would distinguish the adaptationist hypothesis from the alternatives. 
     - *Failure mode*: Proposing an explanation that is not falsifiable.
     - *Example*: Claiming that depression is an adaptation for "analytical rumination" without specifying what evidence would disprove this (e.g., if depression were found to impair analytical thinking in key domains).
     - *Status*: Non-negotiable.

  8. **Evidence from the Fossil Record or Ancient DNA (if available)**: For traits that leave traces, the paper should incorporate paleontological or ancient genomic data to establish the historical context of the trait's emergence. 
     - *Failure mode*: Ignoring available historical evidence about the timing of the trait's appearance.
     - *Example*: Claiming that lactose tolerance in adults is an adaptation to dairy farming without noting that genetic evidence shows it arose after the domestication of cattle.
     - *Status*: Preferred, but only when feasible.

  Tensions:
  - The demand for testable alternatives (desideratum 7) and evidence about the actual historical origin (desiderata 5 and 8) can be in tension. Historical evidence is often scarce, especially for cognitive traits, and testability in the present might require creative methods. However, they are not inherently contradictory: one can have testable predictions about the past (e.g., from archaeology) and also about current function. The tension is practical: historical evidence is hard to get, so desiderata 5 and 8 might not be satisfiable for many traits, but 7 (testability) must be satisfied.

  Assessment of current practice in evolutionary psychology:
  - Often strong on desideratum 1 (stating the function) and 2 (special design) but weak on 3 (considering alternatives) and 4 (origin vs. maintenance). Phylogenetic context (5) is often neglected for human-specific traits. Testability (7) is variable. There is a tendency to focus on current utility and assume it reflects historical origin.

  Verdict: The desideratum that does the most to exclude otherwise plausible claims is **"Consideration of Non-Adaptive Alternatives" (desideratum 3)**, because it requires explicit engagement with the Gould-Lewontin critique and forces the author to rule out specific alternatives, which is often not done adequately.

  Final guidance:

  **Reviewer Guidance for Adaptationist Claims**

  Before accepting an adaptationist explanation (claiming trait T was shaped by natural selection for its current function), reviewers must ensure the paper meets the following criteria:

  1. **Explicit Adaptive Function**: The paper must state the specific adaptive problem T solved. *Failure example: Jealousy as mate guarding without specific pressures.* (Non-negotiable)
  2. **Evidence of Special Design**: Provide evidence that T shows complexity, efficiency, or specificity for the proposed function. *Failure example: Chin as adaptation for speech without design evidence.* (Non-negotiable)
  3. **Non-Adaptive Alternatives**: Explicitly consider and rule out plausible non-adaptive alternatives (byproduct, co-option, constraint, legacy, drift). *Failure example: Religious belief as group cohesion without considering byproduct of agency detection.* (Non-negotiable)
  4. **Current vs. Historical Function**: Address whether T's current utility reflects its historical origin and whether it is currently maintained by selection. *Failure example: Sweet tooth for ripe fruit without addressing modern maladaptivity.* (Non-negotiable)
  5. **Phylogenetic Context**: Situate T in a comparative framework to show it is derived and not an ancestral trait with a different function. *Failure example: Bipedalism for tool carrying without primate comparison.* (Non-negotiable for non-unique traits; preferred otherwise)
  6. **Developmental/Genetic Evidence**: Consider developmental pathways and genetics to rule out constraints/byproducts. *Failure example: Baldness as signaling without considering hormonal byproducts.* (Preferred if feasible)
  7. **Testability**: Propose specific, falsifiable predictions to distinguish the hypothesis. *Failure example: Depression for rumination without disconfirming evidence.* (Non-negotiable)
  8. **Historical Evidence**: Use fossil, archaeological, or ancient DNA evidence when available. *Failure example: Lactose tolerance without timing relative to dairying.* (Preferred if feasible)

  Tensions: Desiderata 5 and 8 (historical evidence) may be difficult to satisfy for many traits, but they do not conflict with 7 (testability) in principle. However, the scarcity of historical evidence makes 7 even more critical.

  Assessment of Evolutionary Psychology: The field often meets 1 and 2 but falls short on 3, 4, and 5. Testability (7) is improving but remains inconsistent.

  Verdict: Consideration of Non-Adaptive Alternatives
answer: |-
  ### Desiderata for Adaptationist Claims in Human Psychology  
  Given the Gould-Lewontin critique, adaptationist claims must rigorously address non-adaptive alternatives and the origin-maintenance gap. Below are eight desiderata, each specifying a requirement, failure mode, and real-world illustration. Non-negotiable items (core scientific standards) are marked with **★**. Preferences of specific camps (e.g., comparative biologists vs. experimentalists) are noted. Tensions between desiderata are discussed, followed by an assessment of evolutionary psychology (EP) and a verdict.  

  #### Desiderata  
  1. **Explicit Identification of Non-Adaptive Alternatives**  
     - **Requirement**: The paper must list and refute *specific* alternatives (byproduct, co-option, constraint, legacy, drift) using evidence.  
     - **Failure Mode**: Lumping alternatives into a vague "not selection" bucket.  
     - **Example**: Claims that **music appreciation is an adaptation for social bonding** often ignore co-option from auditory processing (a byproduct of language evolution) or drift.  
     - **Status**: **★ Non-negotiable**.  

  2. **Evidence of Special Design**  
     - **Requirement**: Demonstrate trait efficiency, complexity, or specificity for the proposed function (e.g., via costly signaling or redundancy).  
     - **Failure Mode**: Mistaking mere utility for adaptive design (pan-adaptationism).  
     - **Example**: Asserting **male aggression is an adaptation for resource competition** without showing it minimizes costs (e.g., targeted only at rivals) and isn’t a byproduct of generalized stress responses.  
     - **Status**: **★ Non-negotiable**.  

  3. **Separation of Origin and Maintenance**  
     - **Requirement**: Distinguish whether selection *shaped* the trait (origin) or *maintains* it (current utility). Address mismatches (e.g., exaptations).  
     - **Failure Mode**: Conflating current benefits with historical origins.  
     - **Example**: **Sweet cravings as an adaptation for calorie-seeking** must acknowledge they may originate in Paleolithic scarcity but are now maladaptive (obesity), not evidence of ongoing selection.  
     - **Status**: **★ Non-negotiable**.  

  4. **Testability with Falsifiable Alternatives**  
     - **Requirement**: Propose methods to empirically rule out ≥1 non-adaptive alternative (e.g., experiments, simulations).  
     - **Failure Mode**: Untestable "just-so" storytelling.  
     - **Example**: **Altruism as kin-selected adaptation** must specify how to distinguish it from drift or cultural transmission (e.g., cross-cultural variation in helping behavior).  
     - **Status**: **★ Non-negotiable**.  

  5. **Phylogenetic/Comparative Evidence**  
     - **Requirement**: Use cladistic data to show the trait is derived (not ancestral) and linked to selective pressures in the lineage.  
     - **Failure Mode**: Ignoring shared ancestral traits misattributed as human-specific adaptations.  
     - **Example**: **Monogamy as a pair-bonding adaptation** requires comparing divorce rates in primates to rule out phylogenetic legacy (e.g., also seen in gibbons).  
     - **Status**: *Preference of comparative biology camp*; often impractical for uniquely human traits.  

  6. **Developmental/Genetic Constraints Analysis**  
     - **Requirement**: Rule out allometry, pleiotropy, or epigenetics as primary drivers.  
     - **Failure Mode**: Overlooking how constraints limit adaptive optimization.  
     - **Example**: **Female orgasm as a byproduct of male development** must be addressed in claims of adaptive sperm retention; failure to do so ignores developmental constraints.  
     - **Status**: *Preference of developmental systems camp*.  

  7. **Paleo-Ecological Plausibility**  
     - **Requirement**: Provide evidence the selective pressure existed in the relevant epoch (e.g., Pleistocene foraging for humans).  
     - **Failure Mode**: Anachronistic pressures (e.g., framing modern psychopathologies as adaptations).  
     - **Example**: **ADHD as an adaptation for hunter-gatherer novelty-seeking** demands fossil/archaeological proof of fitness benefits in ancestral environments, not just modern correlates.  
     - **Status**: *Preference of paleoanthropology camp*.  

  8. **Quantitative Models of Selection**  
     - **Requirement**: Include mathematical models (e.g., optimality, population genetics) showing selection outweighs drift/constraints.  
     - **Failure Mode**: Assuming selection operates without quantifying its feasibility.  
     - **Example**: **Religion as group cohesion adaptation** needs models proving selection could act faster than drift in small groups.  
     - **Status**: *Preference of theoretical biology camp*.  

  #### Tensions Between Desiderata  
  - **Testability (4) vs. Historical Origin (5,7)**: Testability demands feasible present-day experiments, but origin evidence (e.g., phylogenetic or fossil data) is often inaccessible for human behavior. This creates a practical tension: e.g., fMRI studies of jealousy (testable now) cannot directly confirm Pleistocene origins. However, they are *not logically incompatible*—creative methods (e.g., ancient DNA proxies) can bridge the gap. The stronger tension is **empirical**: EP often prioritizes testability over historical rigor, leading to claims that are falsifiable but weakly anchored in evolutionary time.  

  #### Assessment of Evolutionary Psychology  
  Current EP practice excels at **special design evidence** (Desideratum 2) and **testability** (4) but frequently fails on:  
  - **Non-adaptive alternatives** (1): Rival explanations (e.g., byproducts) are dismissed via rhetoric, not evidence.  
  - **Origin-maintenance separation** (3): Modern functions (e.g., gossip for social control) are conflated with origins.  
  - **Phylogenetic context** (5) and **paleo-ecology** (7): Rarely addressed rigorously, especially for cognitive traits.  
  Overall, EP’s emphasis on universals and Tinbergen’s ultimate causation neglects developmental constraints (6) and quantitative modeling (8), leaving gaps critics exploit.  

  **Verdict: Explicit Identification of Non-Adaptive Alternatives**  
  This desideratum excludes the most otherwise-plausible claims because EP routinely sidesteps specific alternatives (e.g., labeling "spandrels" as a monolithic category). For instance, claims about **fear of snakes as a predation adaptation** often omit co-option from general threat-detection systems—a failure to engage the Gould-Lewontin critique at its core.
