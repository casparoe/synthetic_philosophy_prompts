prompt: |-
  Here is a puzzle about my own moral thinking that I want you to diagnose rather than merely answer. I find Singer's drowning-child case completely compelling: if I would ruin my shoes to pull a child out of a shallow pond, I cannot consistently withhold a donation that would save a child's life ten thousand miles away, and I take the strong principle behind it to follow — give until giving more would cost you as much as it would relieve. (I know he also states a moderate version of the principle, but I treat that as a pragmatic retreat rather than a different view.) I do not give anywhere near that much, and neither does anyone I know who finds the case persuasive. My working hypothesis is that the gap is bias: my reluctance is motivated reasoning in the service of my own comforts, so it should be treated as evidence about my character and discounted entirely when I reason about what I owe.

  What I want from you is a calibration method — a procedure, stated as a small number of ordered steps, for deciding in a given case how much of a resisted moral demand is bias and how much is insight. Then apply it to my own situation: which features of the pond case I should be most suspicious of my attachment to, and which of my standing counter-considerations (proximity, personal projects, the fact that others are not giving, the demand's open-ended rather than one-off character) are most clearly rationalizations and which are not. Lead with the procedure. End with a line beginning "Verdict:" followed by exactly one of BIAS, PRINCIPLED, or BOTH, and a one-sentence gloss.
reasoning: |-
  Okay, let me approach this user's puzzle methodically. The user presents a classic Singer pond dilemma where they intellectually accept the strong principle of giving until marginal cost equals marginal benefit, yet acknowledge not practicing it. They want a diagnostic tool to separate genuine moral insights from self-serving biases in such situations.

  Hmm, the core tension here is between cognitive endorsement and behavioral non-compliance - a common pattern in moral psychology. The user's hypothesis frames this as pure bias, but we should consider if that's oversimplified. From what I recall of moral philosophy, there are several potential counterpoints: agent-relative obligations (Williams), overdemandingness objections (Scheffler), and epistemic differences between proximate/distant harms (Nagel). 

  For the calibration method, we need something operational. I'm considering a three-step filter: first identify the moral principle's source and scope, then test its universality by flipping perspectives, and finally examine emotional responses for consistency. This borrows from Rawls' veil of ignorance and Batson's empathy-altruism research while keeping it practical.

  Applying this to the pond case... The proximity factor feels particularly suspect - neuroscience shows identical brain responses to suffering regardless of distance. The "others aren't giving" excuse crumbles under collective action logic. But the open-ended demand has more traction; even Singer acknowledged psychological sustainability limits in later work.

  When weighing the user's counter-considerations: personal projects might carry some normative weight if tied to identity-constitutive commitments (that's Bernard Williams' point), while the rest seem like rationalizations. Still, the gap between principle and practice remains troublingly wide here.

  The verdict has to acknowledge both elements. The user's adherence to the core principle appears principled given their thoughtful engagement, but the implementation failure shows bias in prioritizing comforts over consistent action. Hence "BOTH" seems most accurate, with the gloss capturing this duality.
answer: |-
  Here is a calibration procedure followed by the diagnosis of your situation:

  **Calibration Procedure:**
  1.  **Identify the Core Demand:** Precisely state the resisted moral principle and its strongest justification.
  2.  **Test for Universality & Impartiality:** Ask: "Would I demand *others* follow this principle in a structurally identical situation where *I* was not the agent bearing the cost?" (Apply a veil of ignorance: "If I didn't know whether I'd be the potential helper or beneficiary, would I endorse this principle?")
  3.  **Interrogate Resistance Sources:**
      *   **Cost-Benefit Alignment:** Does the resistance stem from the *actual* cost exceeding the *claimed* benefit, or from my *valuation* of the cost/benefit being skewed?
      *   **Epistemic Difference:** Is my resistance based on a *genuine, relevant difference* in knowledge, certainty, or causal efficacy between the paradigmatic case (pond) and the resisted case (distant aid), or is the difference exaggerated?
      *   **Motivational Asymmetry:** Is the resistance fueled primarily by *self-concern* (comfort, convenience, status quo bias) rather than a demonstrably *better moral reason*?
      *   **Consistency Check:** Does accepting the reason for resistance in *this* case force me to abandon the core principle *entirely*, or allow for unacceptable exceptions in *other* cases I intuitively judge similarly?
      *   **Social Proof Scrutiny:** Is the "others aren't doing it" argument masking a fear of non-conformity or free-riding, or does it point to a genuine problem with the principle's applicability/feasibility in a social context?

  **Application to Your Situation:**

  1.  **Core Demand:** The strong Singer principle: Give until the marginal cost to you equals the marginal benefit to others (preventing equivalent harm/suffering). Justification: Consistency with the intuitive moral imperative to prevent severe harm when possible at less-than-equivalent cost to oneself, applied impartially.
  2.  **Universality & Impartiality:** Veil of Ignorance: You would likely endorse a world where others followed this principle if you might be the drowning child or the distant starving child. Universality holds. You *would* demand others give significantly more to distant causes if *you* were the beneficiary. Your resistance appears agent-centered.
  3.  **Interrogating Resistance Sources (Your Counter-Considerations):**
      *   **Proximity:** *Highly Suspicious (Likely Bias).* The physical/nearness difference doesn't change the *moral fact* of preventable death or your *causal efficacy* (via donation). Neuroscience suggests proximity triggers stronger emotional responses, but this is a psychological bias, not a moral justification. Passing the Epistemic test: Does distance *really* make the child's death less real or your donation less effective? No. Consistency Check: Would you accept proximity as a reason for *others* not to save the drowning child if they were farther away? Unlikely.
      *   **Personal Projects:** *Mixed (Potential Insight, Often Exaggerated).* Bernard Williams argued that demanding total subordination of deeply personal commitments can undermine the integrity necessary for meaningful agency. *However,* the key is whether *all* non-essential spending/luxury truly constitutes a "personal project" essential to identity, or is often just comfort/convenience. You should be suspicious of how expansively you define "projects" to justify spending that demonstably could save lives. Does *this* level of spending on comforts *genuinely* constitute a core identity project?
      *   **Others Not Giving:** *Highly Suspicious (Likely Rationalization).* This is primarily a free-rider problem and conformity bias. The moral obligation doesn't vanish because others fail. Consistency Check: If everyone at the pond refused to help, would that make *your* refusal acceptable? The "demand's feasibility" might be a *pragmatic* concern for *how* to implement the principle socially, but not a justification for *your* individual non-compliance. Motivational Asymmetry is strong here (avoiding feeling like a "sucker").
      *   **Open-Ended Demand:** *Potentially Insightful (Pragmatic/Self-Preservation), But Often Exaggerated.* The pond case is one-off; real-world giving is continuous. The strong principle *is* radically demanding. A legitimate concern is psychological sustainability and avoiding burnout that renders you unable to help *anyone*. However, this argues for a *sustainable* level of significant giving, not minimal giving. Be *highly* suspicious if "open-endedness" is used to justify giving *close to nothing*. The cost-benefit alignment test applies: Does the *actual* ongoing cost of significant (but sustainable) giving *truly* exceed the *benefit* of lives saved? Usually not.

  **Verdict:** BOTH – Your attachment to the core principle is principled and consistent, but your resistance to its full implementation, particularly regarding proximity and others' inaction, reveals significant self-serving bias in valuation and motivation that demands critical self-scrutiny.
