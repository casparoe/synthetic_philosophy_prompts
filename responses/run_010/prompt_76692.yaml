prompt: |-
  Building this chain for a seminar on international criminal law and the ending makes me uneasy, but I can't find where it snaps:

  1. Nobody may be criminally punished for conduct that wasn't criminal under law binding on them at the time they acted.
  2. In 1939 no international criminal statute or court existed and there was no settled practice of trying individuals for starting a war; the charter that created the offence of crimes against peace was drawn up by the winning powers after the events and bound only the loosers.
  3. So convicting the major war criminals of crimes against peace breached (1).
  4. A proceeding that punishes people for what wasn't criminal when they did it isn't a criminal trial but force in judicial dress — and since the court's jurisdiction over the accused was created by the very party prosecuting him, not even a fully prospective statute would have cured that.
  5. So Nuremberg wasn't a trial in the sense that carries authority.
  6. Every institution since — the ad hoc tribunals, the permanent court, the whole idea that individuals can be charged over aggression at all — claims descent from that precedent and borrows its standing from it.
  7. So the enterprise rests on a founding act that was itself lawless and inherits the defect: the honest conclusion is abolition, not reform.

  I want to keep (1) if I can — it's the only thing I can see standing between law and violence. So which step do you reject, why did it look perfectly fine when I wrote it down, and what does rejecting it cost me? And if you think the chain is valid as it stands, tell me which premise is cheapest to lose and price the alternatives against each other rather than just listing them. Lead with your bottom line in the first sentence, then the reasoning — no preamble, and don't restate my question back at me. British English please.
reasoning: |-
  Alright, the user is presenting a logical chain about the legitimacy of international criminal law, starting from the Nuremberg Trials. They feel uneasy about the conclusion that the entire system is lawless and should be abolished. Their core concern seems to be preserving principle (1) - nullum crimen sine lege - as a barrier against arbitrary state violence. 

  Hmm, the chain is cleverly constructed but step 4 is where it overreaches. The user is clearly attached to legal principles but troubled by how Nuremberg's retrospective creation of crimes against peace might undermine them. They're not just asking for logical flaws - they want to know what rejecting step 4 would cost conceptually. 

  Interesting that they're using British English - likely academic or legal professional preparing for a seminar. The "uneasy" phrasing suggests they instinctively reject the abolition conclusion but can't dismantle the argument. Their unspoken need might be reconciling Nuremberg's historical necessity with contemporary legal principles.

  Right, so step 4's equation of procedural origins with inherent illegitimacy is the weak point. The user needs to hear that rejecting this doesn't sacrifice principle (1), but rather acknowledges that legal systems can gain legitimacy through acceptance even when procedurally imperfect at inception. The cost is accepting some moral ambiguity in transitional justice - but that's preferable to throwing out baby (individual accountability) with bathwater (Nuremberg's flaws).

  Notably they didn't mention victim perspectives - perhaps that's an unspoken counterweight in their mind. The response should emphasize that abolition would create greater injustice than maintaining a system that evolved beyond its origins. Must avoid academic jargon though - they want clear stakes, not theory.
answer: |-
  Your chain snaps at step 4. Rejecting it allows you to keep (1) while salvaging Nuremberg and subsequent institutions.

  **Reasoning:**  
  Step 4 conflates two distinct issues: retroactivity (*ex post facto* law) and procedural legitimacy (victor's justice).  

  *   **Why (4) looks plausible:** It correctly identifies that a *purely* prospective statute wouldn't resolve the core problem of victors creating the court and law *after* the fact to try the vanquished. This *is* a profound legitimacy concern.  
  *   **Why (4) fails:** It wrongly asserts that *only* a flaw in retroactivity prevents a proceeding from being a "trial in the sense that carries authority." Legitimacy isn't solely binary (retroactive/prospective). Nuremberg derived authority from sources beyond the London Charter:  
      *   **Widespread Recognition:** The trial's form, process (adversarial procedure, right to defence), and underlying principles resonated as just by many nations and observers, despite victor authorship.  
      *   **Affirmation of Existing Norms:** While "crimes against peace" lacked prior *individual* criminal liability in *positive* law, the *aggressive war* itself was widely prohibited by treaties (e.g., Kellogg-Briand Pact). The Charter arguably *crystallised* an emerging norm of *individual accountability* for its breach.  
      *   **Moral Imperative & State Practice:** The unprecedented scale of Nazi aggression and atrocities created a near-universal demand for accountability beyond traditional state responsibility. The trial itself became constitutive – it *made* this individual accountability part of international law through widespread subsequent acceptance.  
  *   **Cost of Rejecting (4):** You must accept that legitimacy in extreme, foundational moments can arise from broader recognition and perceived moral necessity, even when formal procedural origins are imperfect ("victor's justice"). Nuremberg's authority stemmed significantly from its *outcome* and widespread *acceptance* as just, not solely its *prospective form*. You lose the purity of demanding perfect procedural origins *and* perfect non-retroactivity simultaneously for foundational acts.  

  **Alternatives & Costs:**  
  *   **Reject (2):** Argue customary international law *did* criminalise aggressive war for individuals pre-1939 (e.g., Kellogg-Briand + state practice/opinio juris). **Cost:** Requires stretching historical evidence; weakens principle (1) by relying on potentially vague custom.  
  *   **Reject (3):** Claim the London Charter *was* binding law *before* the verdicts. **Cost:** Legally dubious (treaty created *after* acts); fundamentally undermines (1).  
  *   **Reject (6):** Argue modern institutions (ICC, ad hocs) have independent legitimacy via treaties/UNSC resolutions, not solely Nuremberg. **Cost:** Ignores Nuremberg's undeniable historical and normative influence; doesn't resolve Nuremberg's own legitimacy problem.  

  **Conclusion:** Step 4 is the cheapest to lose. Rejecting it preserves the core principle (1) against retroactive punishment, acknowledges Nuremberg's procedural flaws ("victor's justice"), but allows that its broader recognition, moral force, and constitutive effect granted it sufficient legitimacy to function as a foundational "trial" for subsequent developments. The enterprise rests on an *imperfect* but not *lawless* foundation.
