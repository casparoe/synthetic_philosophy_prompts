  The void between stars isn't truly empty. It hums with the infrared whispers of creation’s fading echo and the occasional, defiant spark of human endeavor. The *Hephaestus*, a kilometer-long interstellar hauler shaped like a blunt arrowhead, sliced through this quietude at 0.6*c*, bound for the Procyon yards. Ahead, a solitary relay buoy, *Hermes*, hung steady against the stellar backdrop, its purpose to bounce data across the light-years. To the *Hephaestus*, the buoy was a speck growing rapidly into a complex geometry of antennas and solar panels. To *Hermes*, the freighter was a blue-shifted streak of impending Doppler fury.

  Captain Lena Rostova watched the approach vector on her command display, fingers drumming a restless rhythm. Not for the buoy—routine passage—but for the blinking contract flag tied to Event #4471: an arbitration hearing held three days ago, Earth Standard Time, back on Sol IV. The *Hephaestus*'s legal AI had stamped it SETTLED. That meant, per the fine print drafted by Kepler Dynamics’ lawyers, the outcome was binding *now*. Lena’s company stood to gain a hefty bonus if SETTLED lit green during this high-speed handshake with *Hermes*.

  "Buoy *Hermes*, this is *Hephaestus*," Lena hailed. "Preparing data exchange. Confirm your Event #4471 status flag."

  A delay, then the reply, crisp and edged with tension. "*Hephaestus*, *Hermes* Actual here, Comms Officer Arjun Singh. Our flag remains UNSETTLED. The hearing hasn't happened yet."

  Lena’s fingers stilled. "That can’t be right. Our logs show it concluded. Check your temporal calibration."

  "Our calibration is pinned to Earth’s rest frame, Captain. The hearing is scheduled," Arjun paused, voice tight, "in approximately forty-two minutes. Your SETTLED flag is invalid. You’re trying to dodge the penalty clause."

  "And you’re ignoring relativity," Lena shot back. "Under *our* motion state—0.6*c* toward Sol—that hearing is in our past. By contract, an event is SETTLED if it lies on your *own* simultaneity slice. Our slice includes it. Done."

  "Your slice is *tilted*, Captain. Tilted toward Earth's future because you’re moving toward it. From our perspective—anchored to Sol—it hasn’t occurred. It’s not real yet."

  "Real?" Lena leaned into the mic. "It *happened*. The arguments, the gavel strike—they’re fixed. Just because your 'now' hasn't caught up doesn’t make it less real."

  A crackle of static, then Arjun’s voice, lower now. "Define 'real.' Is it real because it’s in your past? Or because it’s absolutely, universally real?"

  "The block universe, Singh. Past, present, future—all equally real. The hearing is a point in spacetime. We passed it."

  "Then why argue?" Arjun's tone sharpened. "If it’s all equally real, the contract’s outcome is fixed too. Our dispute is just... noise."

  "Don’t deflect. Our flag is valid. Pay up."

  "Your 'now' is subjective. Ours is anchored to the source. The hearing’s on Earth. Earth’s frame defines its 'now.'"

  Lena’s console flashed as the ship’s relativity engine rendered the dispute in stark geometry. Two Minkowski diagrams overlaid: one for the *Hephaestus* in motion toward Earth, its simultaneity lines slanting forward in the direction of travel; one for *Hermes* at rest relative to Earth, its "now" a horizontal cut through spacetime. A point labeled "Hearing" sat *below* the *Hermes* line—future—but *above* the slanted *Hephaestus* line—past.

  "You’re confusing co-reality with universal reality," Arjun pressed. "Just because the hearing is real *for you*, and you’re real *for me*, doesn’t chain them into a shared 'now.' Co-reality isn’t transitive. You can’t glue two tilted slices together and call it absolute existence. Your past is my future because you’re moving *toward* the event. Flip directions—move away—and it’d be the opposite."

  Lena felt a familiar ache beneath her ribs. Not for the contract—for the other event, unlogged, ticking in her private countdown. Her mother’s neural surgery, scheduled just hours after the hearing. On Lena’s simultaneity slice, both were past. Fixed. Real. Yet the comms lag meant silence. No word. Just the void’s hum.

  "You’re saying," Lena said slowly, "that for you, for Earth, my mother’s surgery hasn’t happened? That it’s still... fluid?"

  "If it’s after the hearing? Yes. In our frame, it’s future. Contingent. Uncertain."

  "But in mine, it’s done." Lena’s voice frayed. "The incision, the graft—it exists. I just haven’t received the light yet."

  "Or," Arjun countered softly, "in my frame, the surgeon’s hand hasn’t moved. The outcome isn’t written. It *could* go wrong."

  The proximity alarm chimed. Closest approach. Data packets streamed between ship and buoy—logs, timestamps, the conflicting flags. SETTLED vs. UNSETTLED, hinging on a slice of spacetime.

  "Listen," Arjun said, urgency replacing argument. "Your simultaneity says it’s real. Ours says it’s not. The block universe contains both truths. But the *contract*—it assumed a universal 'now.' It didn’t account for tilted slices. We’re arguing over a drafting error."

  Lena stared at the starfield, Sol a bright prick among millions. On her display, the hearing point glowed. Real. For her. For her mother—where was the reality in that recovery room? Was the surgeon’s hand steady *now*, or had it already succeeded or failed in a block Lena couldn’t touch?

  "Kepler’s lawyers," she said finally, "deserve a special circle of hell. We’ll submit both flags. Let the arbitrators untangle it."

  A pause. "Agreed." Relief bled into Arjun’s voice. "Safe journey, *Hephaestus*."

  "And you, *Hermes*. Standing by for disconnect."

  The buoy fell away astern, red-shifting into darkness. Lena’s screen cleared, leaving only the nav plot and her mother’s timeline. Event #4471: SETTLED, in her frame. The surgery: also SETTLED, fixed in her past. Yet no signal. No certainty.

  *Is it real?* The question hung, cold and unresolved. If the block universe held all moments, then yes—the scalpel’s path was as immutable as a fossil. But if reality fractured into observer-dependent presents, then somewhere, for someone, her mother’s fate was still a trembling quantum possibility. The contract’s ambiguity was trivial next to this.

  Lena touched a private comm key. "Message to Earth. Pre-recorded. Mother, if you’re hearing this, the surgery went well. It *had* to. Because from where I stand, it’s already over."

  She ended the recording. The lie—or the faith—sat heavy in the ship’s silence. Outside, the stars streamed past, indifferent. Ahead, Procyon waited. Behind, Earth’s light carried news she couldn’t outrun, only outwait. The block universe held both her dread and her hope, equally real, equally unreachable until the light cone caught up. Until then, she had only the slant of her own now—tilted toward a past she couldn’t change, and a future she couldn’t know.
