  Okay, let me approach this as Gongsun Long would. The user needs me to stay strictly within third-century BCE Chinese dialectic frameworks while defending the "white horse not horse" paradox against modern set-theory objections. 

  Hmm, the core tension here is fascinating - they want the steward's rebuttal to feel authentically ancient yet withstand modern logical scrutiny. I notice they're particularly worried about anachronistic "extension" concepts creeping in. Their opening move cleverly frames the containment argument (white horses ⊂ horses) that any undergrad logician would recognize.

  Right, first I must dismantle this "gatherings" analogy without referencing sets. The Mohist canon defines "name" (名) as "that by which one calls the substance" (所以謂形也), so I'll anchor there. When they say "white horse gathering lies wholly inside horse gathering" - that's exactly the modern view I must reject. 

  *scribbles mentally* The key is to attack the assumption that names correspond to fixed collections. For Gongsun Long, "horse" isn't a container but a designation criterion (形貌). "White" is another criterion (顏色). Combining them creates a new, third criterion - hence a new name. The refusal of yellow horses when calling for white horses proves the criteria aren't hierarchically nested but laterally distinct.

  Ah! And the Mohist "killing robber ≠ killing man" parallel? Perfect - I'll turn that around. The Mohists themselves distinguish contextual naming (殺盜非殺人), so why reject my similar distinction? This actually strengthens my position: both paradoxes reveal how compound names create new designations. The inconsistency charge boomerangs back - if they accept the Mohist case, they must accept mine.

  Must avoid modern terms carefully. Instead of "predicate," say "naming." Instead of "reference," say "answering the call." The "white jade" reductio? I'll concede ordinary speech's looseness but insist dialectic requires precision - after all, the Mohists themselves compiled the "Canon of Names" for exact discourse. 

  *checks historical ground* Gongsun Long's actual fragments mention "white horse" and "horse" having different "intentions" (意) - that's the angle. The calling test proves intentions diverge. And I must end with a question to maintain the courtroom dynamic... perhaps challenging why "gatherings" should bind names when lived language shows otherwise.
answer: |-
  *(Adjusting my sleeves with deliberate calm, eyes fixed on yours as if weighing the very words before they leave your lips)*  

  You speak of "gatherings" as if names were nets cast over flocks of birds, where one net encloses fewer than another. But this is to mistake the *fixing* of names. When we fix the name "horse," we fix it to *form and gait* alone—what has four hooves, a mane, and carries men. When we fix "white," we fix it to the color of untouched snow or heron's feathers. Now, when we fix "white horse," do we fix it to form and gait *or* to color? Neither alone! We fix it to the *conjunction*: a thing bearing *both* marks.  

  To call for a horse is to demand satisfaction of the first fixing: bring what has horse-form! Yellow or black answers, for they satisfy the name "horse." But to call for a white horse is to demand satisfaction of the *dual* fixing: bring what has horse-form *and* white-color! Yellow refuses because it fails the color-fixing, though it satisfies the form. The names differ because what *fulfills* one does not fulfill the other. This is not about narrowness within a gathering but about *what the name demands*.  

  As for the Mohist: when they say "killing a robber is not killing a man," they grasp the same truth! "Killing a man" fixes to ending a life *under the name 'human'*. "Killing a robber" fixes to ending a life *under the name 'human who steals'*. One name condemns all life-taking; the other condemns life-taking only when it meets the condition of punishing theft. The fulfillment differs! The Mohist uses distinctions well there—why do they stumble here?  

  Your steward grants that "white horse" cannot be exchanged for "horse" in speech? Good! But he must then see that the names point to different *standards of fulfillment*. If white horse *were* horse—truly, identically—then fulfilling "horse" would *be* fulfilling "white horse," and vice versa. Yet when the stablemaster hears "fetch *a horse*," he may bring black or bay; but if told "fetch *a white horse*," he knows black or bay brings punishment. The court sees this! The difference lives in the act.  

  Now, you say: must we then deny that white jade is jade? In *ordinary speech*, men say "white jade" and point to jade. But in *disputation*, we see: "jade" fixes to stone of certain hardness and lustre; "white" fixes to color; "white jade" fixes to stone with hardness, lustre, *and* whiteness. Remove whiteness—if the jade is stained—does it cease to be jade? No! For it still satisfies hardness and lustre. But if it ceases to be hard, it ceases to be jade at all. So "white" is not essential to "jade," but hardness is. "White jade" names a thing that meets *more conditions* than "jade" alone. To confuse them is to lose sight of what each name requires.  

  I ask you, Steward: if a thing must satisfy *additional marks* to fulfill a name, how can that name be identical to the simpler one?  

  *(I wait, hands folded, watching for your move)*
