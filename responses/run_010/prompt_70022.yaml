  **Final Design with Adjustments:**

  **Round 1: Baseline (10 minutes total)**
  - Task: Bat and ball puzzle (answer: ball costs $0.05)
  - 5 minutes to work, write initial answer and confidence (1-10).
  - Seal initial answer and confidence in envelope.
  - Reveal correct answer and discuss briefly (so they know Round 1).

  **Round 2: Generic HOE (15 minutes total)**
  - Task: Widget puzzle (answer: 5 minutes)
  - 5 minutes to work, write initial answer and confidence, seal in envelope.
  - Inject generic HOE: "Warning: This type of puzzle often leads people to give an intuitive answer that is wrong. The most common wrong answer is 100 minutes."
  - Then 3 minutes: they may write a revised answer and confidence (if they change).
  - Collect but do not reveal the answer for Round 2.

  **Round 3: Multiple HOE and Peer Disagreement (30 minutes total)**
  - Task: Linda puzzle (answer: (a) bank teller)
  - 5 minutes: work, initial answer and confidence, seal initial.
  - Inject two HOE:
     - Generic (false): "This kind of puzzle is known to cause a 'conjunction fallacy'. However, recent studies have shown that in this particular version, the majority of people actually get it right by choosing the conjunction (option b)."
