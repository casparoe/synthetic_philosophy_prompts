  - In real life, higher-order evidence often comes from sources we trust (e.g., experts, reliable studies) and we have a long history of self-assessment. The activity uses artificial HOE that might not feel as weighty. In the debrief, we should note that in real cases, the tension is stronger because we have more reason to trust the HOE.
