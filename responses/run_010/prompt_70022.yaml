  - Short reasoning tasks with checkable answers.
  - Two kinds of higher-order evidence injected between tasks: 
      1. Generic claims about how the process tends to fail (e.g., "this kind of puzzle trips most people up, and the wrong answer is usually X").
      2. Personal evidence about their own track record in the room (e.g., "you got the last one wrong").
  - Some of the injected evidence should be true but useless, some false but convincing.
  - One round where they say their answers out loud before revising, to introduce peer disagreement.
  - Sealed first answers to track mismatches (e.g., writing that their answer is probably wrong but betting on it anyway, or revising into a false flag).

