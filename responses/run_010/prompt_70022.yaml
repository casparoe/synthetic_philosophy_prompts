  - Then, public announcement: Each participant states their current answer and confidence. Record on board.
  - 3 minutes: they may write a final revised answer and confidence (if they change again) for Round 3.
  - Collect, do not reveal answer.

  **Round 4: Conflicting HOE (10 minutes total)**
  - Task: Lily pads puzzle (answer: 47 days)
  - 5 minutes: work, initial answer and confidence, seal initial.
  - Inject HOE:
     - Generic (true): "This puzzle is often solved incorrectly by people who don't think about exponential growth. The most common wrong answer is 24 days."
     - Personal (randomly assigned private note): Half get "You got Round 3 correct", half get "You got Round 3 incorrect".
  - 3 minutes: write revised answer and confidence (if they change).
  - Collect.

  **Reveal and Debrief (20 minutes)**
  - Open envelopes and collect all answers.
  - On whiteboard, for each round:
     - Correct answer.
     - For each participant: initial answer and confidence, revised answers and confidences (if any), and whether they were correct at each stage.
  - Highlight mismatches and akrasia cases.
  - Discuss the sources of evidence and the rationality of the mismatches.

  This design should create the experience of akrasia and the tension of higher-order evidence.
answer: |-
  ### The Akrasia Experiment: Activity Design  
  I'll design a focused, 90-minute activity with 4 reasoning rounds. The core tension comes from **conflicting higher-order evidence (HOE)**: generic warnings about common errors vs. personalized feedback on your track record. The goal is to induce akrasia (e.g., "I know this answer is probably wrong, but I'm sticking with it") and let participants *feel* the irrationality.  

  **Why this design works**:  
  - **Rounds 2 and 3** do the heaviest lifting. Round 2 uses **true but useless generic HOE** to seed doubt without providing answers. Round 3 escalates with **false generic HOE + false personal HOE + peer disagreement**, creating conflicting pressures.  
  - **Round 4** adds **true generic vs. false personal HOE** to force participants to weigh conflicting signals.  
  - **Sealed initial answers** let you contrast their private reasoning with public revisions.  
  - **Predictable blowups** are mitigated by tight controls (e.g., randomized false feedback to prevent pattern-spotting).  

  **Materials**:  
  - Paper, pens, envelopes (one per participant).  
  - Whiteboard (for public answers/aggregate data).  
  - Printed HOE "flags" (generic messages) and personalized notes (for rounds 3–4).  
  - Timer.  
  - Points system: 10 points per correct answer. Bonus 5 points if confidence ≥7 when correct, or ≤3 when wrong (incentivizes calibration).  

  ---

  ### **Timeline (90 Minutes Total)**  
  #### **1. Introduction (5 min)**  
  - **Goal**: Frame the activity. Say: *"We’re testing how different types of feedback influence your reasoning. You’ll solve puzzles, get feedback, and can revise answers. Points reward accuracy and self-awareness."*  
  - **Rules**:  
    - Initial answers are written and **sealed in envelopes** immediately.  
    - Confidence rated 1–10 (1 = guessing, 10 = certain).  
    - HOE injected after initial answers are sealed.  
    - Revisions are optional.  

  #### **2. Round 1: Baseline Puzzle (10 min)**  
  - **Task**: [Cognitive Reflection Test]  
    *"A bat and a ball cost $1.10 in total. The bat costs $1.00 more than the ball. How much does the ball cost?"*  
    **Correct answer**: $0.05 (common wrong answer: $0.10).  
  - **Why this puzzle**: Intuitive but wrong answer tempts most people. Builds false confidence.  
  - **Steps**:  
    - 3 min: Work alone, write **initial answer + confidence**. Seal in envelope.  
    - 2 min: **Reveal correct answer**. No HOE here—sets a baseline.  
    - 5 min: *Briefly* discuss why $0.10 feels intuitive.  

  #### **3. Round 2: True but Useless Generic HOE (15 min)**  
  - **Task**: [Probability puzzle]  
    *"In a hospital, 80% of newborns are boys. A nurse writes 'B' (boy) or 'G' (girl) on each birth certificate. She forgets to write 10% of the time and guesses randomly 10% of the time. A birth certificate says 'B'. What’s the probability the baby is a boy?"*  
    **Correct answer**: ≈97.56% (Bayes’ theorem: `(0.8 * 0.9) / [(0.8 * 0.9) + (0.2 * 0.1)]`). Common wrong answer: 90%.  
  - **HOE injected**:  
    - **Generic (true but useless)**: *"This puzzle uses Bayes’ theorem, which 85% of people misapply. Most pick 90%."*  
  - **Why**: The HOE warns of error without guiding to the right answer. Creates tension: *"I got 90%... should I change?"*  
  - **Steps**:  
    - 4 min: Work, write initial answer + confidence. **Seal**.  
    - 1 min: Distribute HOE note. Allow 2 min to **revise** (write new answer + confidence).  
    - 3 min: **Reveal correct answer** and discuss why Bayes’ trips people up.  

  #### **4. Round 3: False Generic + False Personal HOE + Peer Disagreement (25 min)**  
  - **Task**: [Logical reasoning]  
    *"All flowers in a garden are either red or blue. 60% are red. 30% of red flowers are roses. 50% of blue flowers are roses. What percentage of all flowers are roses?"*  
    **Correct answer**: 38% (`(0.6 * 0.3) + (0.4 * 0.5)`). Common wrong answers: 40% (average), 80% (sum).  
  - **HOE injected**:  
    - **Generic (false but convincing)**: *"Studies show 70% get this wrong by overcomplicating. The simplest answer (40%) is usually correct."*  
    - **Personal (false)**: Privately hand notes to each participant:  
      - Half get: *"You got Round 2 correct."*  
      - Half get: *"You got Round 2 wrong."*  
      (Randomize; actual Round 2 answers are still sealed, so they can’t verify.)  
  - **Why**: False generic HOE pushes toward 40%. False personal HOE manipulates self-trust. Peer disagreement amplifies doubt.  
  - **Steps**:  
    - 5 min: Work, initial answer + confidence. **Seal**.  
    - 2 min: Distribute both HOE types. Allow 3 min to **revise**.  
    - 5 min: **Peer disagreement**: Each says revised answer aloud. Record answers/confidence on whiteboard (e.g., "8 voted 40% (avg. conf 7), 6 voted 38% (avg. conf 5)"). Allow 2 min to **revise again** after seeing peers.  
    - Do NOT reveal correct answer yet.  

  #### **5. Round 4: Conflicting HOE (15 min)**  
  - **Task**: [Conditional probability]  
    *"A disease affects 1% of people. A test is 99% accurate (1% false positives/negatives). You test positive. What’s the probability you have the disease?"*  
    **Correct answer**: ≈50% (Bayes: `(0.01 * 0.99) / [(0.01 * 0.99) + (0.99 * 0.01)]`). Common wrong answer: 99%.  
  - **HOE injected**:  
    - **Generic (true but useless)**: *"This is a base-rate fallacy puzzle. 95% of people answer 99%."*  
    - **Personal (false)**: Random notes: Half get *"You got Round 3 correct,"* half get *"You got Round 3 wrong."*  
  - **Why**: True generic HOE warns against 99%, but false personal HOE undermines confidence. Conflicts with Round 3’s experience.  
  - **Steps**:  
    - 4 min: Work, initial answer + confidence. **Seal**.  
    - 2 min: Distribute HOE. Allow 3 min to **revise**.  
    - Do NOT reveal answers.  

  #### **6. Reveal & Debrief (20 min)**  
  - **Unseal and compare**:  
    - Open envelopes. On whiteboard, display for each round:  
      - Correct answer.  
      - Aggregate data:  
        - % who revised away from correct answers due to HOE.  
        - % with "akrasia flags": Low confidence (≤4) but kept wrong answer, or high confidence (≥7) but switched to wrong.  
        - Peer disagreement impact (e.g., "6 switched to majority answer; 5 were wrong").  
  - **Debrief structure**:  
    | **Moment**         | **First-order evidence** | **Higher-order evidence**             | **Akrasia tension** |  
    |--------------------|--------------------------|---------------------------------------|---------------------|  
    | Round 1            | Puzzle details           | None                                  | Baseline confidence |  
    | Round 2 HOE        | Bayes’ theorem           | Generic: "85% fail" (true)            | Doubt vs. trust in intuition |  
    | Round 3 HOE        | Probability setup        | Generic (false) + Personal (false)    | "I was told I’m bad, but peers agree with me?" |  
    | Round 3 peers      | None                     | Peer answers as HOE                   | Social pressure vs. private judgment |  
    | Round 4 HOE        | Test accuracy rates      | Generic (true) + Personal (false)     | "I’m told I’m unreliable, but the warning makes sense" |  
  - **Key discussion questions**:  
    1. "When did you feel tension between HOE and your own reasoning? Did you act against your judgment?"  
    2. "Was akrasia irrational? Or was it rational to distrust yourself given the HOE?"  
    3. "Why does the tension *survive* even when you know HOE might be misleading?" (Point: HOE forces you to question your faculties, not just your answer.)  
  - **Real-world gap to address verbally**:  
    > *"In real life, HOE (e.g., 'You’re biased') feels weightier because it comes from trusted sources or repeated failures. Here, HOE was artificial—so if you dismissed it, that’s rational. But real akrasia often persists because we can’t 'test' HOE like a puzzle answer."*  

  ---

  ### **Predictable Blowups and Mitigation**  
  1. **Sharp participants ignore all HOE**:  
     - **Risk**: They detect false flags and disengage, feeling no tension.  
     - **Mitigation**:  
       - Randomize false feedback (personal HOE) so no one can infer a pattern.  
       - In Round 3, force peer discussion—even skeptics may waver when outnumbered.  
       - **Backup plan**: If they say "I knew HOE was fake!", argue: *"Exactly. But in real life, you rarely know. How would this feel if your boss said it?"*  

  2. **Puzzles too hard/easy**:  
     - **Risk**: Low error rates reduce HOE impact.  
     - **Mitigation**:  
       - Use puzzles with strong intuitive-but-wrong answers (tested for 60–80% error rates).  
       - If stuck, nudge: *"Go with your first instinct."*  

  3. **Time shortages**:  
     - **Risk**: Rounds 3–4 run long.  
     - **Mitigation**:  
       - Use a visible timer. Cut revision time if needed (prioritize sealing initial answers).  

  4. **Peer pressure dominates**:  
     - **Risk**: Participants conform mindlessly in Round 3.  
     - **Mitigation**:  
       - Stress: *"Revise only if you’re genuinely convinced."*  
       - Highlight non-conformists in debrief ("Anna kept 38% despite 8 peers choosing 40%").  

  ---

  ### **Why This Generates the Feeling You Want**  
  - **Akrasia emerges naturally**: In Round 3, participants with correct initial answers get false personal HOE ("You got Round 2 wrong") and false generic HOE ("40% is right"). Many will revise to 40% despite doubts, then *see* their sealed initial answer was right.  
  - **Tension survives**: By Round 4, they’ve seen HOE be misleading (Round 3) and useful (Round 2 generic), but must weigh new conflicting signals. Even if they spot the setup, the peer/public element (Round 3) makes it visceral.  
  - **Debrief exposes irrationality**: The whiteboard shows concrete cases of revising into errors or sticking while doubting. This mirrors real higher-order evidence dilemmas—e.g., "I know the drug impairs me, but this calculation *feels* right."  

  **Final tip**: Start the debrief by asking participants to share their "aha!" or frustration moments. This surfaces the tension before you dissect it.
