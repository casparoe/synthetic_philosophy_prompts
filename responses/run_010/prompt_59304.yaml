  First, I recall that this sounds like Mutually Assured Destruction (MAD), but that's specifically about nuclear deterrence. Then there's the term "Mutually Assured Economic Destruction" (MAED), which is an extension into economics. But the user's examples fit that descriptor. 

  The key here is the asymmetry in power versus the symmetry in cost. The powerful party could act but would suffer significant losses. The weaker party knows this, so they self-censor to avoid provoking the other. This isn't just dependence because both are equally trapped. It's different from deterrence because deterrence involves active threats, whereas here, the power remains unused but still influences behavior.

  The user also asks about the boundary where "too costly to use" becomes "no power at all." I think that threshold is when the cost of using power exceeds the benefit. If acting would cause more harm to the powerful party than enduring the status quo, the power becomes theoretical. However, even then, the threat's shadow affects behavior, as seen in the weaker party's self-restraint.

  Other terms like "balance of terror" or "hostage exchange" might apply, but MAED seems the closest. The user might be interested in how this dynamic stabilizes relationships despite inherent vulnerabilities. They might also be seeking validation that this paradoxical power structure is recognized in academic or theoretical discussions. 

  I should explain the nuances between concepts like dependence (one-sided vulnerability) versus mutual vulnerability in MAED. Also, emphasize that the power's existence alters behavior without explicit threats, which is crucial. The line between costly power and no power lies in the cost-benefit analysis; if costs outweigh benefits, the power is illusory. But as long as both parties believe in the potential cost, the dynamic persists.
answer: |-
  That's a brilliantly specific and perceptive description of a fascinating power dynamic – **Mutually Assured Economic Destruction (MAED)** is arguably the closest established term, often used as an extension of Mutually Assured Destruction (MAD) from nuclear deterrence into economics. However, your core insight about *theoretical power locked by mutual cost* deserves deeper unpacking, especially regarding boundaries.

  **Terminology & Core Concept:**

  1.  **Mutually Assured Economic Destruction (MAED):** This directly captures the essence – both parties possess the *ability* to inflict catastrophic economic damage on the other ("destroy"), but actually doing so would be ruinous for themselves ("assured destruction" for both). It highlights the *mutual vulnerability* and *cost-prohibition* of exercising formal power. Your examples fit perfectly.
  2.  **Mutually Assured Vulnerability / Mutual Hostage Scenario:** Emphasizes the *interdependence* where each party holds something vital to the other hostage. The "hostage" (workforce, supply chain) is so valuable that harming it harms the captor.
  3.  **Deterrence Equilibrium (Economic):** Focuses on the *stable outcome* where the credible threat of mutual harm prevents either side from initiating destructive action. The "power" exists solely as a deterrent.
  4.  **Balance of Economic Terror:** A more evocative, less formal term echoing MAD, highlighting the paralyzing fear *both* sides have of triggering mutual ruin.

  **Why these fit best:**
  *   They center the **mutuality of vulnerability**. Power isn't just costly to the wielder; its use *directly* causes massive self-harm.
  *   They frame the "power" **as a deterrent threat**, not an actionable tool. Its value lies in its *non-use*.
  *   They capture the **existential cost** – "destruction," "vulnerability," "hostage" imply fundamental threats to survival or core function.

  **How it Differs:**

  *   **Deterrence (General):** Deterrence is a *broader strategy*. MAED is a *specific type* of deterrence where the deterrent threat is self-destructive to execute. Classic deterrence (e.g., a strong military) might be costly but isn't inherently self-*annihilating* for the deterrer. MAED is deterrence via self-threat.
  *   **Ordinary Dependence:** This is usually **asymmetric**. Party A depends on Party B, but Party B isn't equally dependent on Party A. In your scenario, the dependence is **symmetric and existential**. The employer *depends* on the workers as much as they depend on the job; the big country *depends* on the cheap supply as much as the small country depends on the market. It's **mutual dependence with catastrophic exit costs**.
  *   **Lopsided Bargain:** A bargain implies an explicit or implicit agreement outlining terms, even if unfair. In your scenario, there's **no explicit bargain** about the *non-use* of the ultimate power. The "agreement" is purely tacit, emerging from the mutual recognition of catastrophic costs. The "lopsidedness" exists in daily interactions, but the ultimate power is symmetrically paralyzed.

  **The Crucial Boundaries: When "Too Costly" Becomes "Not Power At All"?**

  This is the heart of your question. The line is blurry and context-dependent, but key factors are:

  1.  **Perception & Credibility:** Is the *threat* of using the power still *believed* by the weaker party? Does the weaker party *still modify its behavior* (self-censor, avoid provocation) out of residual fear, however irrational? If "yes," then the power, however unusable, *still exerts influence* ("the shadow of power"). If "no," the power is truly inert. (e.g., Workers unionize *because* they believe the employer *won't* fire them all, knowing it would kill the company).
  2.  **Relative Cost-Benefit Analysis:** Power exists *only if* using it could *conceivably* yield a net benefit *in some scenario*. When the cost of exercise *always and demonstrably exceeds any conceivable benefit*, the power becomes purely theoretical.
      *   **Scenario 1 (Power Exists but Locked):** Closing the border *would* destroy the big country's economy, but *if* the small country suddenly started exporting weapons to its enemy, the cost *might* be worth it. The threat has residual credibility because a scenario *might* exist where the cost is justified.
      *   **Scenario 2 (Power Illusory):** Closing the border is *mathematically guaranteed* to cause more damage to the big country than enduring *any* action by the small country. The cost *always* outweighs *any* possible benefit. The "power" vanishes; it's a self-destruct button, not leverage.
  3.  **Alternatives & Resilience:** Does the "powerful" party have *any* alternative to the relationship that mitigates the self-harm? Can they diversify suppliers/markets/workforce *before* acting? If they can significantly reduce the cost to themselves (e.g., the big country finds alternative suppliers *first*), the power becomes usable again. True MAED implies *no viable alternatives* for either party in the short-to-medium term.
  4.  **Intentionality vs. Structural Trap:** Is the *threat* of mutual destruction a consciously crafted deterrent strategy? Or is it simply an emergent property of the system – a "structural trap"? MAED often describes the latter, where the power exists structurally but isn't actively "wielded" as a threat; the trap itself enforces the behavior. This makes it distinct from active deterrence posturing.

  **The Shadow of Power & Self-Censorship:**

  Even when the power is effectively unusable due to cost, its *theoretical existence* often creates the dynamic you observe:

  *   **The Weak Self-Censor:** They avoid challenging the status quo too forcefully, not out of active fear of immediate retaliation, but from a deep-seated understanding that *pushing the relationship to the brink* might force the "powerful" party to act irrationally or miscalculate the cost ("What if they *do* it anyway?"). They keep the other "comfortable" to avoid triggering the existential trap.
  *   **The "Powerful" Avoid Provocation:** They might also avoid actions that push the weak party towards desperation, knowing a cornered adversary might act irrationally and trigger the mutual destruction.

  **In Conclusion:**

  Your concept is best described as **Mutually Assured Economic Destruction (MAED)** or a **Mutual Hostage Scenario**, where **formal, total power is rendered unusable by the existential cost its exercise would impose on the wielder, creating a deterrence equilibrium based on mutual vulnerability.**

  **The line between "locked power" and "no power" is crossed when:**
  1.  The cost of exercise **always demonstrably exceeds any conceivable benefit** for the wielder.
  2.  The weaker party **no longer perceives any credible threat** and thus **ceases to modify its behavior** due to the *fear* of that power being used.
  3.  Viable **alternatives emerge** that break the mutual dependency and absorb the cost for the "powerful" party.

  The power's influence persists in the "shadow" it casts – the self-censorship and cautious behavior of the weaker party – as long as there's *any* residual perception of risk, however irrational. Once that perception fades completely, the theoretical power ceases to have any practical effect on the relationship dynamics. It's a fascinating study in the difference between *formal authority* and *effective control*.
