  The user's deeper needs: They want the poem to function as both a scholarly illustration and an accessible piece. For text critics, it should demonstrate stemmatics principles without explanation. For others, it should convey the fragility of historical knowledge emotionally. The poem itself must argue through form, not just content.

  Challenges: Balancing clarity with poetic quality. Ensuring variations are plausible yet meaningful. Making the conjecture both surprising and justified by the stemma. The invented quote needs to feel authentic but neutral enough for corruption patterns.

  I'll start drafting with the lacuna bracketed at the top. Alpha and beta branches with two witnesses each. For the quote, a messenger's report works well—high stakes, prone to embellishment. Variants: "spear" to "sword" (more heroic), "bent" to "broke" (stronger image), dropped clauses about retreat. In beta, "squint-eyed" becomes "keen-eyed" (flattering), "gods" to "God" (monotheistic shift).

  The editor's conjecture combines the hardest readings: "snapped" instead of "bent" or "broke," retains "squint-eyed" and "gods," adds a harsh detail about allies fleeing. This makes it more jarring than any copy, fulfilling the principle that the original is often least comfortable.

  Meter: Loose iambic pentameter. Alpha witnesses share a rough rhythm; beta starts smoother. The conjecture breaks pattern intentionally. The title "Stemma for a Lost Dispatch" sets the scholarly tone while hinting at the theme.

  This approach meets all requirements: visual structure as argument, progressive corruption, collatable variants, and a punchline that demonstrates editorial principles in action. The poem should resonate on both intellectual and emotional levels—exactly what the seminar needs to conclude.
answer: |-
  Here’s a poem structured as a stemma codicum, designed to embody the principles of textual transmission and editorial reconstruction:

  **Stemma for a Lost Dispatch**

  [ ]
  |
  |——————————|
  |                      |
  α                     β
  |                      |
  |                      |

  **α¹ (Vat. Pal. 42)**
  The captain gasped: "Our spear is bent.
  The gate’s barred fast. Our salt is spent.
  Those squint-eyed allies slipped away
  At dusk. Gods damn this wasted day!"

  **α² (Ambros. Q 13 sup.)**
  The captain cried: "Our sword is broke.
  The gate stands shut. Our victuals smoke.
  Those faithless allies fled the fray
  At dusk. God damn this bitter day!"

  **β¹ (Laur. Plut. 28.3)**
  The captain shouted, grim and bold:
  "Our sword is snapped. The gate is cold.
  Our keen-eyed allies, duty-bound,
  Withdrew at dusk from hostile ground."

  **β² (Vind. Phil. Gr. 157)**
  The captain roared: "Our blade is shattered!
  The gate holds firm! All hope is scattered!
  Our loyal allies, pressed and sore,
  Retired at dusk to fight once more."

  *[Editor's Conjecture]*
  The captain spat: "This spear-shaft’s snapped.
  The gate’s wood warped. Our salt’s been tapped.
  Those squint-eyed bastards ran. Gods know
  They broke at dusk. Let the crows feast below."

  ---

  **How it fulfills your requirements:**

  1.  **Archetype as Lacuna:** The poem begins with `[ ]`, the lost original. Its absence is visual and undeniable.
  2.  **Alpha & Beta Branches:** Two distinct branches (α & β), each leading to two witnesses (α¹, α² / β¹, β²). Each witness is a stanza.
  3.  **Corruption Downhill / Harder Reading Principle:**
      *   **Original (Implied):** Likely raw, pragmatic, potentially embarrassing ("spear bent," "salt spent," "squint-eyed allies slipped away," "Gods damn").
      *   **α¹:** Closest to the implied original. "Spear bent," "salt spent," "squint-eyed allies slipped away," "Gods damn." Awkward ("bent" spear?), pragmatic (salt spent), undignified (allies slipping away), polytheistic blasphemy.
      *   **α²:** Tidies slightly: "sword" (nobler than "spear"), "broke" (more decisive/final than "bent"), "victuals smoke" (more evocative than "spent"?), "faithless allies" (assigns blame, less passive than "slipped"), "God damn" (monotheistic shift? Smoother rhythm).
      *   **β¹:** Significant smoothing: "shouted, grim and bold" (heroic framing), "sword snapped" (clean break), "gate is cold" (poetic/metrical), "keen-eyed allies" (flattering reversal of "squint-eyed"), "duty-bound... withdrew... from hostile ground" (dignified retreat, noble language, perfect meter).
      *   **β²:** Most elaborate smoothing: "roared," "blade is shattered!" (dramatic), "gate holds firm!" (defiant), "hope is scattered!" (melodramatic), "loyal allies," "pressed and sore," "Retired... to fight once more" (complete rehabilitation of allies, heroic resolve, strongest meter/rhyme).
  4.  **Collatable Variants:**
      *   **"spear bent" (α¹) vs. "sword broke/snapped/shattered" (α², β¹, β²):** Progressive shift to a more heroic weapon and decisive break.
      *   **"salt spent" (α¹) vs. "victuals smoke" (α²) vs. omission/transformation (β¹, β²):** Pragmatic detail becomes poetic, then vanishes/replaced by heroics.
      *   **"squint-eyed allies slipped away" (α¹) vs. "faithless allies fled" (α²) vs. "keen-eyed allies... withdrew" (β¹) vs. "loyal allies... Retired... to fight" (β²):** Progressive rehabilitation of the allies, from undignified desertion to tactical withdrawal to noble resolve. "Squint-eyed" is the hardest, most specific (and potentially insulting) reading.
      *   **"Gods damn" (α¹) vs. "God damn" (α²) vs. omission/transformation (β¹, β²):** Blasphemy softened or removed.
      *   **Location:** α witnesses agree on allies leaving *at dusk*. β witnesses place them leaving *at dusk* but frame it nobly. α¹ uniquely specifies the allies slipped away *because* the salt was spent (pragmatic detail lost elsewhere).
  5.  **Editor's Conjecture (The Turn):**
      *   Steps out of the stemma, back to the left margin.
      *   Not an average: It incorporates the *hardest readings* from across the stemma ("spear-shaft’s snapped" - combining α¹'s weapon with β¹'s break; "salt's been tapped" - like α¹'s "spent"; "squint-eyed bastards" - harsher than α¹'s "allies"; "Gods know" - polytheistic like α¹).
      *   Stranger & Harder: Adds new, harsh details implied by the corruption ("wood warped," "bastards," "broke," "Let the crows feast below") – more visceral, despairing, and less "noble" than *any* copy. The meter is deliberately rougher than the smoothed β versions.
      *   **The Surprise:** It lands as more raw, desperate, and cynical than even the earliest copies (α¹), fulfilling the principle that the original is often the *least* comfortable and most awkward version. The editor hasn't chosen the "oldest" or "prettiest," but reconstructed the *most difficult* plausible original.
  6.  **Meter & Recognition:** The core line structure (rough tetrameter/trimeter mix) is discernible, especially within branches. α¹ & α² share a similar rough feel. β¹ & β² are smoother and more regularly rhythmic. The editor's version returns to roughness but with a different, harsher cadence.
  7.  **Audience:**
      *   **Textual Critic:** Sees the stemma structure, the specific variant readings grouped by branch (e.g., "spear/sword," "squint/faithless/keen/loyal"), the progressive smoothing, and the application of *lectio difficilior* in the conjecture.
      *   **General Reader:** Experiences a poem where the "same" story becomes more heroic and polished over time/copying, only for the final "reconstruction" to reveal a grittier, less flattering original. They grasp the fragility of transmission ("how thin the thread is").

  This poem *is* the argument about historical knowledge, using the very form and logic of the discipline it discusses. The shape *is* the meaning.
