answer: |-
  Good morning. I’m [Your Name], and for thirty-five years, my work was calibration. Ensuring instruments measured what they claimed to measure, perfectly. Since retiring, I’ve learned that in the world of predicting human outcomes – like the risk facing a mother in labor – “calibration” means something different, and even perfect technical measurement doesn’t guarantee fairness or good decisions. That’s where we start today.

  **First, a truth mathematicians know, but everyone must understand:**  
  It’s mathematically impossible for any risk score – including our maternal triage model – to be perfectly calibrated *and* have perfectly equal error rates across groups *at the same time*. What does that mean?

  *   **"Calibrated" (here) means:** If the model says "10% risk" for 100 women, roughly 10 should actually experience that emergency. It’s accurate *on average*.
  *   **"Equal Error Rates" means:** The model misses true emergencies (false negatives) *and* flags safe cases as emergencies (false positives) *at the same rate* for different groups of mothers.

  **The impossibility? You can't perfectly have both.** Let me show you why with a simplified example:

  Imagine two groups, A and B, each with 100 mothers truly at high risk. Suppose the model is perfectly calibrated:
  *   For Group A: Says 10 are high risk. 10 truly are.
  *   For Group B: Says 10 are high risk. 10 truly are.

  *But look at the errors:*
  *   **Group A:** Only 10 were *flagged* as high risk, but all 10 truly were. So it missed **0** true emergencies (no false negatives). But it also only flagged 10, meaning it might have sent 90 truly low-risk mothers home safely? Or did it miss some?
  *   **Group B:** Also flagged only 10, and all 10 truly were high risk. So it *also* missed **0** true emergencies? That would mean *no one* in either group who was truly high risk was missed? That only works if *everyone* truly at high risk was flagged – which requires flagging *more* than just the 10 in each group the model *said* were 100% risk.

  **The conflict is here:** To be perfectly calibrated and *also* not miss *any* true emergencies in *either* group, the model would likely have to flag *many more* mothers as high risk in *both* groups. This means **more false alarms** (false positives) – sending mothers unnecessarily to higher, perhaps stressful, levels of care. But if it flags *fewer* to avoid those false alarms, it risks **missing true emergencies** (false negatives) – sending someone home who shouldn't go. And it's mathematically impossible to adjust it so that the *rate* of missing emergencies *and* the *rate* of false alarms are perfectly equal *between* Group A and Group B, *while* also keeping perfect calibration.

  The math tells us clearly: **A trade-off exists.** We *must* choose where the errors fall. There is no perfect model that avoids this choice.

  **Which brings me to Dr. [Epidemiologist's Name].** We honor her today as she retires. Her life's work, including this model, was built with rigor, with data, and with the vital goal of improving maternal outcomes. She tackled an immensely complex problem – predicting biological risk – with the best tools and intentions available at the time. She solved the problem she was given: building a statistically calibrated predictive instrument. We stand on the foundation of that work, even – *especially* – as we scrutinize its consequences. Her dedication to measurement and evidence is her legacy to this department.

  **And that foundation is why we are here today.** Because the math tells us *a* trade-off is necessary, but it does *not* tell us *which* trade-off is right. It does not tell us **which kind of error our community finds less tolerable.**

  *   Is it worse to send too many mothers for unnecessary, potentially burdensome interventions? (More False Positives)
  *   Or is it worse to miss a mother in true crisis and send her home? (More False Negatives)

  **And crucially, who bears the burden of those errors?** Does one community experience more false alarms while another experiences more missed emergencies? The math permits that imbalance, even within calibration. The coalition’s testimony over three years makes it clear that the *consequences* of these necessary errors have not been felt equally. That the model, however technically sound in one dimension, has sometimes "answered a question nobody asked" – specifically, the question of *which* mothers, and *which* communities, can bear the cost of the errors inherent in *any* prediction.

  **So, our task these two days is not to search for a perfect model – mathematics tells us it doesn’t exist.** Our task is to grapple with the profound, human question the math leaves wide open:

  **Given that errors are inevitable, which errors are we willing to tolerate, which do we fear the most, and how do we ensure that burden is shared justly?**

  This is not just a technical question for statisticians and clinicians. This is a question for midwives, nurses, mothers, and the community. It’s a question about values, about equity, and about whose voice matters in deciding whose pain is deemed an acceptable margin of error.

  Dr. [Epidemiologist's Name] built the instrument. Now, together, we must decide how to play it. Let’s begin.
