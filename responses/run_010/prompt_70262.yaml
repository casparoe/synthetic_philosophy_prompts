answer: |-
  ## Dialogue: Degrees of Being

  **Characters:**  
  **LENA:** Mid-50s, philosophy professor, holds a relational view of personhood.  
  **RAY:** Late 40s, hospice chaplain/ethics consultant, holds a status view of personhood.  

  *(They sit at a worn oak table in a quiet corner of a university library cafe. Coffee mugs steam between them.)*

  **Lena:** Ray, thanks for meeting. I’ve been wrestling with this relational personhood idea – the ubuntu-inspired one, personhood as emergent from community. It feels viscerally true when I visit my mother. She *isn't* the self-contained agent she was. Her identity, her ‘self’, seems sustained almost entirely by the care network around her now. She *is* her relationships, in a very literal sense. But then… the other shoe drops.

  **Ray:** I’m listening. That sense of connection, of essential interdependence – it resonates deeply. But the ‘other shoe’… that’s the shadow side?

  **Lena:** Precisely. If personhood is graded, constituted by the *quality* and *existence* of those relationships… what happens when they thin out? Does her ‘degree’ of personhood diminish? And if it does… does what we owe her diminish too? It feels like handing my family a permission slip to do less, precisely *because* she needs more. That can’t be right.

  **Ray:** No, it can’t. That’s why I push back hard on the graded view. Personhood isn’t an achievement or a status conferred by others. It’s a fundamental *standing*. A human being possesses inherent dignity and moral worth simply by virtue of being human. It’s binary: you have it, or you don’t. Your mother hasn’t lost that standing. She is, categorically, a person deserving of full respect and care, regardless of her cognitive state or relational capacity.

  **Lena:** Okay, hold on. If it’s binary and inherent, based solely on being human, what about infants? Newborns have minimal relational capacity, minimal agency, minimal ‘self’ in the narrative sense. Or someone born with profound intellectual disabilities, who may never develop significant relational reciprocity. Are they full persons? If so, *why*? What’s the normative work being done by ‘being human’ beyond just stating the biological category? Isn’t that just speciesism? Why is membership in Homo sapiens the magic ticket?

  **Ray:** Fair challenge. It’s not *just* the biological category. It’s the recognition that within that biological kind exists the *kind* of being capable of possessing interests, of experiencing good and bad, of being a subject of a life, even if those capacities are potential, latent, or severely impaired. An infant possesses the inherent capacity – the kind-specific potential – for those relational and agential features, even if undeveloped. So does your mother. So does someone with profound congenital disability. The ‘normative work’ is recognizing that value resides in the being itself, not in how well it currently performs or is received by others.

  **Lena:** But doesn’t your own move – appealing to ‘kind-specific potential’ – risk smuggling in a relational element? Potential *for what*? For relationships, for agency, for participating in the moral community! You’re grounding the status in a *capacity*, even if latent, that is fundamentally relational in its *telos*. And if that capacity is irrevocably lost, as in advanced dementia, or was never present in the congenital case… doesn’t the grounding become shaky? Couldn’t *I* make the *exact same move*? I could say relational personhood isn't *only* about current relationships, but about the inherent, kind-specific potential *for* relationship – past, present, or, in the case of infants, future. Doesn’t that collapse our distinction? My view could absorb your ‘kind’ argument and still insist personhood *manifests* in degrees based on the *realization* of that potential through actual relationships.

  **Ray:** Hmm. That’s… a sharper point than I anticipated. You’re right, grounding solely in biological kind feels thin. And yes, the capacities we value – rationality, empathy, relationality – are inherently oriented towards connection. But where we differ, crucially, is on the *source* of the moral claim. On the status view, the claim arises unconditionally *from the being itself* possessing that nature. The relational view makes the claim dependent, at least in part, *on the response of others*. That’s the dangerous pivot. Even if you build in ‘potential’, your framework still makes the *recognition* and *sustenance* of personhood contingent on the community. Which brings us back to your permission slip fear. On your view, what *is* wrong with withdrawing care if the relational personhood has thinned? If the community falters, does the obligation fade?

  **Lena:** It’s the hardest question. If I’m honest, the strongest answer isn’t primarily about *her* at that point. It’s about *us*. What kind of people are we if we abandon the vulnerable? What kind of community degrades when it stops sustaining those who cannot sustain themselves? Withdrawing care when relational ties fade corrodes the very fabric of mutual recognition that constitutes *our* personhood too.

  **Ray:** And there it is. That’s where I recoil. You’ve just made your mother, in her profound vulnerability, a *means* to *our* moral development or social cohesion. Her care becomes justified primarily by how it benefits *us*, the carers. On the status view, that’s a fundamental violation of her dignity. She is owed care *for her own sake*, because she *is* a person, full stop. Her value isn’t instrumental to maintaining our virtue or our community’s character. We care for her *because of who she is*, not because of what caring for her does for us. Making her a prop for our moral edification strips her of intrinsic worth.

  **Lena:** Ouch. That… lands. Truly. It’s a brutal mirror. You’re right that framing it solely as ‘good for us’ instrumentalizes her. That *is* repugnant. (*She pauses, takes a deep breath.*) Concession: My view *does* carry that risk. It can slide into making the vulnerable person a catalyst for communal virtue, rather than the sole focus of the obligation. That’s a genuine weakness. I need a better way to anchor the obligation *to her*, even within a relational framework. Perhaps… the history? The person she *was*, the relationships that *were*? But that feels like grounding it in a ghost. Or… the inherent *need* for relationship, the vulnerability itself as a claim? But vulnerability alone isn’t personhood.

  **Ray:** Thank you. That’s a significant concession. And it costs me to acknowledge this: Your fear of the ‘permission slip’ is *real* on my view too. Because while I say the obligation is absolute, *how* we fulfill it isn’t. The status view tells us *that* she matters absolutely, but it doesn’t automatically tell us *what to do* in every medical scenario. Does ‘respecting her dignity’ mean aggressive treatment for every infection, or does it mean prioritizing comfort when the burdens outweigh benefits? That’s where we need supplementary principles – beneficence, non-maleficence, best interpretation of prior wishes. My absolute status view doesn’t dictate the specific medical decision; it just forbids making that decision based on a diminished assessment of her *worth*. The danger is when people *use* the absolute status to justify *any* intervention, however burdensome, because ‘all life is sacred’. That can be its own kind of cruelty. So, concession: My view, rigidly applied, can lead to overtreatment just as yours risks undertreatment. Both need careful, context-specific application.

  **Lena:** Okay. So where does this leave us practically? We have this family meeting about antibiotics for my mum's recurrent chest infections. Does our theoretical disagreement change what I should advocate for?

  **Ray:** On the *goal*? Probably not. Both views, I hope, would prioritize her comfort and well-being as she experiences it *now*. My status view demands we never see her as less worthy of that comfort. Your relational view, I hope, demands we sustain her in comfort as long as she has needs and can experience relief. Where we *might* diverge is in the *weight* given to her current experience versus the symbolic weight of ‘preserving life’ per se. I might be slightly *more* wary of stopping antibiotics if the *only* reason was that she ‘isn’t a full person anymore’, seeing it as a dignity violation based on a false assessment. But if the reason is that the treatment is burdensome, unlikely to significantly prolong *good quality* life, or against inferred wishes… then stopping could be consistent with respecting her status. My view forbids devaluation; it doesn’t mandate futile or harmful treatment.

  **Lena:** And for me… the relational view might make me slightly *more* attuned to whether continued aggressive treatment serves *her* current relational existence – her ability to experience comfort, connection through touch or sound, absence of distress – or if it merely prolongs a biological process disconnected from any meaningful relational engagement. It might make me quicker to say ‘comfort only’ if the treatment disrupts her remaining capacities for peaceful interaction. But crucially, it wouldn’t be because she’s ‘less of a person’, but because the *intervention* doesn’t serve the *person* she currently is within the web of care. The decision rests on her present experience and needs, not her diminished status.

  **Ray:** So, ironically, on the specific decision about antibiotics… we might arrive at the same practical conclusion through different reasoning. We both prioritize her current comfort and experiential well-being. We both reject decisions based purely on a judgment of her diminished worth. The difference is in the *foundation* and the *potential pitfalls* we guard against. I guard against dehumanization. You guard against instrumentalization and the community failing its bond.

  **Lena:** And the decision-maker? Me, signing the form?

  **Ray:** Both views would say the decision must be made by someone who deeply respects her intrinsic worth – whether inherent or relational – and seeks her genuine good. Someone who isn’t swayed by cost, convenience, or false ideas of worth tied to cognition. The locus of decision probably doesn't shift based on our theory. It shifts based on who best embodies that commitment to *her*.

  **Lena:** So the argument isn't purely verbal... but its sharpest impact might be on the *spirit* in which the decision is made, the dangers we consciously avoid. Avoiding dehumanization versus avoiding abandonment and instrumentalization.

  **Ray:** Exactly. And ensuring that spirit guides the concrete choices about comfort, care, and presence. She deserves nothing less from both of us, Lena. However we parse the source of that 'deserves'. Keep visiting. Keep playing the music she laughs at. That’s honoring the person, however conceived.

  **Lena:** (*Nods, eyes glistening slightly.*) Yes. That, at least, is unambiguous. Thank you, Ray.
