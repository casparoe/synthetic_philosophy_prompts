prompt: |-
  Been volunteering at a county historical society for about three years now, mostly typing up descriptions for boxes nobody has opened since the seventies. I've noticed something recurring that I don't have a word for, and I'd like to know whether the people who think about archives for a living have one.

  The rule we follow, which I assume is standard everywhere: a collection gets described under whoever made it, and it stays arranged the way they arranged it. Makes sense, you don't want to tear the context apart. But here's what it means in practice.

  We hold the papers of one planter family, maybe forty linear feet — ledgers, correspondence, a daybook, deeds. In an 1853 estate inventory, eleven human beings are listed by first name, approximate age, and dollar figure, filed between a mule and a lot of plough irons. Those eleven are the reason a good chunk of that collection matters to anybody alive today. And there is no way to reach them from their side. You can't look a person up. You have to already know the enslaver's surname, pull the inventory, read the whole thing, and then decide whether the "Suky, about 30" in line four is your Suky. The description I'm writing is going to say "estate inventory, 1853" and hang it under the family's name, and I keep feeling like I'm rebuilding the same wall in nicer prose.

  More recent case, same shape. School board minutes from the fifties in which a Black community's fight to keep its school survives entirely inside the board's own vocabulary: the petitioners appear as "a group of residents," as "the colored delegation," and one man in full only because he happened to own a hardware store and the board needed to identify him for tax purposes. When I floated re-indexing those minutes under the community's name and the words they used for themselves, two people told me I'd be breaking the rule about keeping the records in their maker's order, and a third told me I'd be putting words into the record's mouth — which is fair, and is part of what's bugging me.

  So the pattern I'm after is this. Nothing is missing. No fire, no purge, nobody hid anything, the boxes are in great condition and the cataloguing is honest. But the only handle on the record is the handle the powerful party installed, and the descriptive convention that's supposed to protect the record's integrity is precisely what makes the people inside it unreachable except by way of him. I know there's a lot of talk about gaps and silences in archives, but this isn't a gap — it's a full, well-kept record with the adress written on the wrong side. I've also come across the idea that a group can be wronged because there's no shared vocabulary for what happened to them, which is adjacent, except here the vocabulary exists, it's just filed under somebody else and you have to borrow it to get in.

  Is there an established concept for this? I'm not after a bibliography or a reading list, I just want the carving done properly. Tell me what the nearest candidates are, what each one actually covers, and why none of them quite lands on this. And where are the edges — does it still apply if the creator wasn't powerful, just the one holding the pen? Does it lapse once somebody builds a parallel index alongside the original description, or does keeping both change nothing? Does it apply to a church register where the parishioners were perfectly happy to be recorded that way? And if there's no name for it, coin me one and define it tightly enough that I could tell a fellow volunteer when it's happening and when it's just ordinary description doing its job.
reasoning: |-
  Okay, let me unpack this archivist's dilemma. They're describing a paradox where meticulous archival practice unintentionally replicates historical power structures. The core tension is between preservation ethics and accessibility for marginalized subjects.

  Hmm, they've identified three key examples: enslaved persons listed as property, civil rights petitioners erased by bureaucratic language, and the question of whether voluntary records (like church registers) fit the pattern. Each case shares that archival description mirrors the creator's perspective, making oppressed groups discoverable only through their oppressors' terminology.

  I recall Terry Cook's "power of the fonds" concept - how provenance principles can cement creator bias. But the user specifically says this isn't about gaps or silences (like Derrida's archive fever), but about structurally embedded perspective. Michel-Rolph Trouillot's "power in narration" comes closer - how historical silencing happens through categorization, not just omission.

  For the school board minutes: when they proposed re-indexing using the community's self-identification, colleagues objected on provenance and authenticity grounds. That's classic archival diplomatics (the study of document authenticity) clashing with reparative description. Yet keeping both indexes might not solve the power imbalance - the creator's taxonomy remains primary.

  Interesting edge cases they raise: what if the creator wasn't powerful (say, a tenant farmer's diary)? Then the issue shifts from power asymmetry to mere perspective. And for willing participants like churchgoers, is it still problematic? Only if future researchers need alternative access points.

  Since existing terms don't quite fit, maybe we need new vocabulary. "Descriptive refraction" could work - light exists but bends through the creator's lens. Or "archival ventriloquism" where subjects speak only through their record-keeper's voice. But the clearest might be "provenance paradox": when arrangement principles become barriers to marginalized subjects.

  For practical use, I'd define it as occurring when: 1) subjects are identifiable but only through creator-assigned labels 2) descriptive practices amplify this 3) alternatives would compromise provenance integrity. Church registers wouldn't qualify unless the community disputed the terminology later.

  The solution isn't abandoning provenance but layered description - like Library of Congress' "critical cataloging" movement adding corrective metadata while preserving original order. That way Suky appears under both the enslaver's inventory and a "enslaved persons" subject heading.
answer: |-
  What you're describing isn't just a quirk of your archive; it's a fundamental, structural feature of how historical power shapes the archival record and its accessibility. While no single term perfectly encapsulates every facet of this phenomenon in archival science, several concepts orbit it closely. Let's carve them out:

  1.  **Provenance Bias / Creator Bias:**
      *   **What it covers:** The inherent perspective, priorities, and language of the record creator are embedded in the records themselves and dictate how they are organized and described. Provenance (maintaining records by creator) protects this original context but inherently privileges the creator's viewpoint.
      *   **How it relates:** This is the core mechanism you're describing. The planter's worldview dictates the inventory structure; the school board's language dictates the minutes. The "handle" *is* the creator's bias.
      *   **Why it doesn't quite land:** "Bias" is broad. It doesn't specifically capture the *consequence* of that bias – the **inaccessibility and erasure of the subject** except *through* the creator/powerholder. It focuses on the source, not the barrier created.

  2.  **Archival Silencing (or Symbolic Annihilation):**
      *   **What it covers:** The ways archives fail to represent certain groups, perspectives, or experiences. This often involves absence (gaps) but crucially includes **representation through the lens of the powerful**. Being listed only as property or as an anonymous "colored delegation" *is* a form of silencing.
      *   **How it relates:** This directly addresses the *effect* on the marginalized subjects. Suky is silenced as a person; the petitioners are silenced as individuals with agency and identity.
      *   **Why it doesn't quite land:** You rightly distinguish this from a literal *gap*. The record *is* present, technically containing information *about* them, but their identity and perspective are silenced *within* that record and its description. The silencing happens via the structure and language imposed by the powerful, maintained by archival practice.

  3.  **Descriptive Backlog / Archival Violence (in specific contexts):**
      *   **What it covers:** "Descriptive backlog" refers to the lack of resources/time to enhance minimal descriptions. "Archival violence" (a term gaining traction, notably from scholars like Jarrett M. Drake and Michelle Caswell) refers to ways traditional archival practices (like strict adherence to provenance/creator description without critical intervention) actively perpetuate harm, exclusion, and misrepresentation of marginalized communities, replicating historical power imbalances.
      *   **How it relates:** Your feeling of "rebuilding the same wall in nicer prose" *is* experiencing the potential for "archival violence" – continuing the erasure built into the record's creation through passive description. The lack of alternative access points is part of the backlog/violence.
      *   **Why it doesn't quite land:** "Backlog" is too administrative. "Archival violence" is powerful but can feel overly confrontational for some contexts and specifically refers to the *harm caused by the practice*, not necessarily the precise *structural mechanism* (the locked door created by creator-description).

  4.  **Epistemic Injustice (Miranda Fricker):**
      *   **What it covers:** Harm inflicted on someone specifically *as a knower*, including "testimonial injustice" (dismissing someone's credibility) and "hermeneutical injustice" (lacking the shared concepts to understand one's own experience).
      *   **How it relates:** The petitioners suffer a form of hermeneutical injustice *within the archive*. The shared vocabulary *exists* (their names, their cause), but the *archival system* denies them the status of "knowable subjects" on their own terms. It forces researchers to adopt the perspective/power of the record creator to even *find* them, perpetuating the original injustice.
      *   **Why it doesn't quite land:** This is a broader philosophical concept applied *to* the archival situation, not an archival term itself. It focuses on the harm to the *person/group*, not the specific archival *mechanism* creating the barrier.

  **The Core Pattern: Provenance-Enforced Silencing**

  The consistent thread is: **The unquestioned application of provenance and original order, combined with minimal description that replicates the creator's language and perspective, structurally enforces the silencing and inaccessibility of marginalized subjects inherent in the records themselves. It makes the powerholder's perspective the only viable key.** It's not a *gap*; it's an **imposed pathway**.

  **Addressing Your Edges:**

  1.  **Creator Power:** This effect is *most acute and harmful* when the creator was a powerful entity oppressing/marginalizing the subjects *within* the records (planter, school board). If the creator was *also* marginalized (e.g., a tenant farmer's diary), the issue shifts. The description might *still* only reflect *their* perspective (limiting other views), but the power imbalance causing the silencing isn't present. The harm is less about structural oppression replicated by the archive and more about potential incompleteness of perspective.
  2.  **Parallel Index:** Building a parallel index (e.g., indexing enslaved persons by name under an "Enslaved Persons" subject heading, indexing petitioners by name/community) **fundamentally changes the situation**. It provides alternative access points *without* altering the original arrangement or description. This is a key reparative practice! It doesn't erase the original harm in the record's creation, but it mitigates the *archival silencing* by breaking the monopoly of the creator's "handle." It makes Suky findable *as Suky*.
  3.  **Willing Participants (Church Register):** If the parishioners were genuinely happy to be recorded solely by the parish priest/church structure, the *archival* harm is less clear-cut. The issue becomes one of potential *future* needs. Will descendants or researchers *later* need to find individuals outside the church hierarchy? If the *only* way is through the priest's register, then the pattern *partially* applies (access limited to creator's structure), but without the element of oppression/forced silencing present in your main examples. The motivation and power dynamic are different.
  4.  **"Just Ordinary Description":** Ordinary description is doing its job when it accurately reflects the creator's arrangement and content *as is*, *without* amplifying the silencing effect *and* when alternative access points exist or are being developed where necessary (like parallel indexing). It becomes problematic (fitting your pattern) when:
      *   The records document oppression/marginalization.
      *   The subjects are obscured or defined only by the oppressor within the records.
      *   The description passively replicates this obscuring language/structure.
      *   No alternative access points are provided, making the creator's perspective the *only* key.

  **The Carving: A Proposed Term & Definition**

  Since existing terms are close but not perfect, let's coin one focused on the *archival mechanism* you identified:

  **Term: Provenance-Enforced Silencing (PES)**

  **Definition:** Provenance-Enforced Silencing occurs when the strict application of archival principles of provenance and original order, combined with descriptive practices that uncritically adopt the creator's language and perspective, structurally replicates and perpetuates the obscuring or erasure of marginalized individuals or groups *within* the records. It renders these subjects inaccessible for research *except* through the lens, terminology, and organizational structure imposed by the record's creator, who is often the party wielding power over them.

  **How to Tell a Fellow Volunteer:**

  "Look, this feels like **Provenance-Enforced Silencing (PES)**. The records themselves silence Suky/the petitioners by only listing them as property/an anonymous group. Our standard description, just labeling the box 'Estate Inventory' under the planter's name or transcribing 'colored delegation' without adding context, rebuilds that same wall. We're making the planter/board the *only* key to find people they oppressed. It's not a missing document; it's the *structure* locking them away. We need to discuss adding alternative access points like a separate index to mitigate this, *without* breaking up the original collection."

  This term emphasizes the *active role* of archival practice ("Enforced") in maintaining the silence built into the records by the powerful creator ("Provenance"). It highlights the specific mechanism and its consequence.
