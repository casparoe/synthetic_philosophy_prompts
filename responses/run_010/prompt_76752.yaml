prompt: |-
  From the mid-twentieth century onward the social interpretation of the French Revolution was attacked and never convincingly restored: one side held that 1789 was a bourgeois revolution in which an emergent capitalist class seized political power; the other replied that the revolutionary leadership was composed mainly of venal office-holders, lawyers, and rentiers, and that the upheaval on balance retarded capitalist development; the subsequent turn to political culture relocated the engine of events in a revolutionary political imaginary, with the Terror read either as the unfolding of that imaginary or as a contingent response to war and emergency. My hypothesis is that the resulting stalemate is not about the prosopographic evidence, which both camps largely share, but about incompatible criteria for a social factor's being the cause of an event — one demanding counterfactual dependence, the other satisfied by an expressive or constitutive fit between class position and political form. Diagnose the disagreement rather than adjudicating it: is it verbal, substantive but underdetermined, or two questions travelling under one name; what exactly is the word class doing in each camp's argument; and does the quarrel about the Terror belong to the same dispute or to a further one about whether the Revolution picks out a single explanandum or a sequence of them (1789, 1792, 1793–94) that may admit of different explanations without either side conceding anything? Finally, say what would count as progress — a distinction, a new kind of evidence, a formal or comparative result — or argue that none should be expected and why. Answer in exactly five numbered points of one or two sentences each, with no introduction or conclusion.
reasoning: |-
  Hmm, the user has presented a complex historiographical puzzle about the French Revolution. They're asking me to analyze a fundamental disagreement between two schools of thought: one seeing 1789 as a bourgeois revolution, the other rejecting that characterization. The query requires diagnosing the nature of this dispute without taking sides.

  I need to unpack several layers here. First, the core conflict isn't about the prosopographic data (both sides agree on who the revolutionaries were), but about what constitutes causation in history. One camp requires counterfactual dependence - meaning capitalism wouldn't have emerged without the revolution. The other sees an "expressive fit" - that political forms naturally reflect class positions.

  The word "class" functions differently for each side. For Marxists, it's an objective economic category driving historical change. For revisionists, it's more of a descriptive label for occupational groups without deterministic power. This isn't just semantics - it's a substantive clash over historical methodology.

  Regarding the Terror, this might represent a separate fault line. The debate could be about whether the Revolution is one unified event or a sequence (1789, 1792, 1793-94) requiring separate explanations. If it's the latter, both camps could be partially right about different phases without contradiction.

  For progress, I see several possibilities: clearer causal frameworks that distinguish necessary from sufficient conditions, comparative studies of other revolutions, or formal models of how political imaginaries interact with social structures. The user seems to want this analyzed precisely in five concise points without fluff.

  The user appears deeply versed in revolutionary historiography - probably a grad student or scholar wrestling with these theoretical tensions. Their phrasing suggests frustration with the stalemate and hunger for analytical clarity rather than partisan positions. I'll structure my response exactly as requested: five numbered diagnostic points hitting all their specific questions about causation, "class" semantics, the Terror's status, and paths forward.
answer: |-
  1.  The disagreement is substantive but underdetermined: both sides interpret the same prosopographic evidence through incompatible causal frameworks (counterfactual dependence vs. expressive/constitutive fit) for what makes a "social factor" the cause.
  2.  For the "bourgeois revolution" camp, "class" denotes an objective economic category defined by relation to production and interests driving historical change; for opponents, "class" is a descriptive occupational category lacking the necessary unity or agency to act as a prime mover.
  3.  The quarrel about the Terror belongs to a *further dispute*: it hinges on whether the Revolution is a single explanandum (where the Terror must fit the main cause) or a sequence of distinct events (1789, 1792, 1793-94), allowing different explanations without concession.
  4.  Progress would likely come from a *distinction* clarifying causation (e.g., separating necessary conditions, sufficient conditions, and constitutive elements) or *comparative results* testing how class positions/political imaginaries interact in other revolutionary contexts.
  5.  Expecting definitive resolution is unrealistic due to the deep philosophical divergence on causation and social ontology, though refined distinctions or comparative analysis could shift the debate's terms.
