  I've lost count of the times pain asymbolia has been rolled out in blog posts and comment threads as a decisive counterexample — to hedonism, to the unity of phenomenal character, to the idea that badness is built into experience rather than tacked on by our attitudes toward it. I'd like the strongest version of a more deflationary argument: that asymbolia does not license the two-component picture (a sensory-discriminative channel plus a separable affective one) it is usually taken to support, because the case reports cannot distinguish an asymbolic who lacks the unpleasantness of pain from an asymbolic who has unpleasantness but has lost the further capacity to be bothered by it or to care about it. Please argue that the distinction the data actually underdetermine is a three-way one — sensation, unpleasantness, caring-about-unpleasantness — and that the standard inference to the conclusion that unpleasantness is extrinsic to pain quietly collapses the middle term into either the first or the third. Deal with the pressure points along the way: that the relevant lesions sit in the insula and adjacent cortex, regions also implicated in interoception and emotional awareness, so the sincere report of feeling the pain but not minding may be precisely the report we should trust least; that some asymbolics nonetheless withdraw, grimace, or laugh when hurt, and that laughter cuts both ways; that post-leucotomy patients who say the pain is unchanged but no longer bothers them get lumped in with asymbolia although that may be a dissociation of a different order; and that the entire evidential base is a handful of stroke case reports. Say what evidence would genuinely settle the question, and close by stating what survives of the anti-hedonist use of asymbolia once your argument is granted. Press the case rather than hedging, but no straw men: where the two-component view has a real reply, give it and explain why it still fails. Please write it as continuous prose, the way