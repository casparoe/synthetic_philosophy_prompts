answer: |-
  Here's a point-by-point audit of your friend's Kelly Criterion explanation, followed by answers to your specific requests. I'll be blunt about what works and what doesn't for a working pro.

  **The Audit (Point-by-Point):**

  1.  **"Kelly is just a formula... f = (bp − q)/b ... edge divided by odds."**
      *   **Nod:** This is the core formula. Correct for simple binary bets (win/lose) paying `b`-to-1. The "edge/odds" simplification (`edge = bp - q`, `odds = b`) is common shorthand.
      *   **Wince:** Calling it "just a formula" undersells it. It's a profound result connecting information theory, gambling, and portfolio growth. "Edge divided by odds" is fine as a quick mental calc, but pros know it's derived from maximizing log utility.
      *   **Wrong-in-a-Confident-Way:** None. This is foundational and accurate.

  2.  **"The reason it works... maximizes expected value of bankroll... anything smaller leaves growth on table, anything bigger takes risk for nothing... Kelly is a single number, not a range."**
      *   **Nod:** Kelly *does* maximize the *expected geometric growth rate* of the bankroll. It's the point of peak growth efficiency. Betting less *does* sacrifice growth; betting more *does* increase risk without sufficient growth compensation.
      *   **Wince:** "Maximizes expected value of bankroll" is **dangerously wrong and the core mistake**. Maximizing *expected value* (arithmetic mean) tells you to bet your entire bankroll on *any* positive edge, leading to ruin. Kelly maximizes the *geometric mean* or *expected logarithm* of wealth. This distinction is **absolutely critical**. Pros know this cold. Saying "expected value" here is a cardinal sin.
      *   **Wrong-in-a-Confident-Way:** The "single number, not a range" part is overly rigid. While the math gives a single optimal fraction (`f*`), pros **constantly** bet a *fraction* of Kelly (`fraction * f*`) for practical reasons (risk aversion, uncertainty in edge estimation, bankroll constraints, psychological comfort). Calling this "leaving growth on the table" ignores real-world complexities pros deal with daily.

  3.  **"Has nothing to do with utility... plain expected-value thinking tells you to bet whole roll... Kelly fixes that... long sequence vs parallel... Nobel laureate... fallacy... never settled."**
      *   **Nod:** Correct that naive expected value maximization leads to ruin. Kelly *does* explicitly consider repeated play and the multiplicative nature of wealth growth over time. Paul Samuelson (the Nobel laureate) *did* write scathing critiques arguing the Kelly strategy (maximizing expected log wealth) wasn't necessarily optimal for individuals with finite lives and different risk preferences ("it's a fallacy"). This debate *is* still a live, though somewhat academic, wire in economics/finance.
      *   **Wince:** Saying it has "nothing to do with utility" is **misleading**. Kelly *assumes* logarithmic utility. This is fundamental! Maximizing E[log(W)] *is* a specific utility function (log utility implies constant relative risk aversion). Pros understand Kelly *embodies* a specific, very aggressive, risk preference. Samuelson's point was precisely that other utility functions might lead to different optimal strategies.
      *   **Wrong-in-a-Confident-Way:** Calling the long-sequence perspective the "fix" and implying the parallel (ensemble average) view is wrong oversimplifies a deep philosophical divide. Kelly proponents argue the time-average (your single path) is what matters. Critics argue the ensemble-average (averaging across many possible parallel universes) is relevant for finite lifetimes. Pros use Kelly *despite* the debate because its properties (growth maximization, no ruin) are empirically powerful in their domain, even if the theoretical justification isn't universally accepted. Saying the parallel view is "wrong" is too strong; it's a different perspective with merit in some contexts.

  4.  **"If your estimate of p is a bit off... curve is smooth near the top."**
      *   **Nod:** **Strong nod.** This is one of Kelly's most valuable *practical* features. The growth rate curve is indeed very flat near the peak. Being 10-20% off your optimal `f*` costs you very little in long-run growth compared to being wildly over or under. This robustness is why it's usable in the real world with uncertain edges. Pros rely on this property heavily.

  5.  **"You literally cannot go broke betting Kelly... worst case you get small."**
      *   **Nod:** **Mathematically true and crucial.** Since you only bet a fraction `f` (0 < f < 1) of your *current* bankroll, you can never lose everything on a single bet or series of losing bets. Your bankroll approaches zero asymptotically but never hits it. This property is paramount for pros managing risk of ruin (RoR).
      *   **Wince:** "Get small" is an understatement. A long losing streak can reduce your bankroll to a *tiny* fraction of its original size, making recovery practically impossible without new capital. Pros know "not broke" isn't the same as "viable". They often use fractional Kelly specifically to manage the drawdowns implied by full Kelly.

  6.  **"Half-Kelly halves your long-run growth and also halves your swings... people who bet half are scared; pros bet full."**
      *   **Nod:** Half-Kelly *does* roughly halve volatility (standard deviation of returns). It significantly reduces drawdowns.
      *   **Wince:** Saying it "halves your long-run growth" is a **gross oversimplification**. Growth rate scales roughly with `f - f^2/2` for small `f` near the optimum. Halving `f` (from `f*` to `f*/2`) reduces the *growth rate* by roughly half *only if* `f*` was very small. For typical edges (say `f*` = 0.02 to 0.10), halving `f` reduces growth by significantly *less* than half. The reduction in risk (variance) is proportionally larger than the reduction in growth.
      *   **Wrong-in-a-Confident-Way & Likely to Get Called Out:** **"Pros bet full" is demonstrably false and arrogant.** This is **exactly** the kind of statement that would mark someone as inexperienced or dogmatic at a bar full of serious players. *Most* successful long-term professional gamblers and investors (especially in sports betting/AP where edge uncertainty is high and bankrolls are personal/finite) **use fractional Kelly** (often between 1/4 and 1/2). Why? Because:
          *   **Edge Uncertainty:** Your `p` is *always* an estimate. Betting full Kelly when you've overestimated your edge is catastrophic. Fractional Kelly provides a crucial buffer.
          *   **Psychological Resilience:** Surviving brutal losing streaks without tilting or going bust requires managing drawdowns. Full Kelly drawdowns can be extreme.
          *   **Real-World Constraints:** Taxes, fees, operational costs, needing to make consistent withdrawals to live. Full Kelly doesn't account for this.
          *   **Bankroll Definition:** Is your "bankroll" *only* the gambling bankroll? Or does it include your life savings? Ambiguity pushes towards fractional.
          *   **Multiple Opportunities:** Managing simultaneous, potentially correlated bets requires scaling back individual stakes below their isolated full-Kelly level.

  **Your Plot Point: Faithful Kelly Bettor Goes Nearly Broke**

  *   **Is it consistent? YES.** Full Kelly guarantees you *mathematically* won't go to zero, but it **does not** protect you from devastating drawdowns that feel like ruin and require borrowing at bad rates. Here's how it happens to a *disciplined* pro:
      *   **Mechanism 1: Underestimation of Correlation/Bad Luck:** Your character places multiple bets she believes are independent (e.g., different football games, different horses). In reality, they are highly correlated (e.g., all rely on a similar underlying factor she misjudged - weather, a key injury's true impact, a referee tendency). A single bad outcome (or cluster of outcomes) hits *all* her bets simultaneously. Even at full Kelly for each bet individually, the combined loss on the correlated bets is massive. Her bankroll plummets. A disciplined pro *can* fall into this by misjudging the correlation structure or simply experiencing a statistically possible (but unlikely) cluster of bad outcomes ("black swan" within her model).
      *   **Mechanism 2: Operational Risk / Bankroll Fragmentation:** She meticulously applies Kelly to her *defined* bankroll. But... life happens. An unexpected large expense forces her to withdraw a chunk *just before* a planned betting cycle. Suddenly, the bankroll she based her stakes on is smaller than it should be relative to her planned bets. She takes the calculated stakes anyway. A losing streak hits. The smaller-than-optimal bankroll magnifies the percentage loss. Alternatively, she might have multiple "bankrolls" for different ventures (card counting, sports, fund) but they all ultimately draw from her finite personal capital. A loss in one reduces her capacity in others. Disciplined pros can face unexpected cash flow needs.
      *   **Mechanism 3: Tail Risk / Model Breakdown:** Her edge (`p`) is estimated based on historical data and models. An unprecedented event occurs (e.g., a star player has a hidden, catastrophic medical episode mid-game, referee makes an egregiously bad call reversing a sure win, a new cheating method emerges in her sports market) that her model didn't (and couldn't) account for. This blows up several large bets she placed with high confidence (high `p`, leading to a high `f*`). The losses are staggering because the bets were large *based on her now-invalidated edge estimate*. This is the "unknown unknown" risk. A disciplined pro's model can still have blind spots.
  *   **Disciplined vs. Sloppy:** Mechanisms 1 & 3 can absolutely happen to a disciplined pro. Mechanism 2 often involves a lapse in strict discipline (not adjusting stakes post-withdrawal) but can also stem from genuine unforeseen emergencies. The key is that she followed Kelly *based on her information and defined bankroll at the time*. The near-bust is caused by factors *outside* the pure Kelly math: correlation misestimation, operational issues, or tail events invalidating her edge estimate.

  **The Corrected Crib Sheet (Plain Language for Your Character)**

  > **The Kelly Criterion: Your Gambling Compass**
  >
  > 1.  **The Core Idea:** When you find a bet where you think your chance of winning (`p`) is better than the odds imply, Kelly tells you *what fraction* (`f`) of your **current bankroll** to bet to grow your money fastest over the long run, without going broke. For a simple bet paying `b`-to-1 (e.g., 2-to-1 means you win $2 for every $1 staked *plus* your stake back if you win): `f = (b * p - (1 - p)) / b`. Think: `(Your Edge) / (The Odds)`.
  > 2.  **Why It's Magic:** It finds the sweet spot. Bet less, and your money grows slower than it could. Bet more, and you take on extra risk that hurts your long-term growth more than it helps. It **maximizes the compounded growth rate** of your bankroll. This is different from just maximizing expected profit on a single bet!
  > 3.  **No Ruin, But Pain:** Because you only bet a fraction of what you *currently* have, you **mathematically cannot lose every single dollar** betting pure Kelly. A long losing streak can still grind your bankroll down to practically nothing, making recovery feel impossible. The math guarantees you won't hit zero, but you can get damn close.
  > 4.  **Real World = Fractional Kelly:** Your edge (`p`) is *always* an estimate. The real world is messy. Pros almost **never** bet the full Kelly fraction (`f*`). They bet a *fraction* of it (like 1/4 to 1/2) – "Half-Kelly" or "Quarter-Kelly". Why?
  >     *   **Safety Margin:** Protects you if you overestimated your edge (`p`).
  >     *   **Surviving Streaks:** Drastically reduces the depth of losing streaks (drawdowns), making them psychologically and financially survivable.
  >     *   **Multiple Bets:** If you have several bets at once, or they might be linked (correlated), you need to bet less than full Kelly on each to keep overall risk sane.
  >     *   **Life Costs:** Need to pay taxes, fees, and maybe even eat? Fractional Kelly gives breathing room.
  > 5.  **Robustness is Key:** The good news? The growth rate isn't super sensitive right near the peak. If your edge estimate is *a little* off, your growth will be *almost* as good as if you were perfect. Kelly is forgiving of small errors.
  > 6.  **The Great Debate:** Some ivory-tower types argue Kelly is "wrong" because it assumes you only care about maximizing long-run growth (like logarithmic utility) and ignores other risks over a finite life. They have math too. In practice? Pros use (fractional) Kelly because it *works* for bankroll survival and growth in their world, debate or not. Don't bet your whole roll on a positive edge – that's ruin waiting to happen. Kelly gives you the map for the long haul.

  **What She Can Plausibly Say at the Bar (Without Sounding Like a Mark or Textbook)**

  *   **Safe & Confident:**
      *   "Bankroll management is everything. Kelly's the only system that tells you *how much* to bet based on your edge and guarantees you can't go bust." (Emphasizes core principle & no ruin).
      *   "The beauty is it's robust. You don't need a perfect read on your edge to get most of the benefit. Close is good enough." (Highlights practical robustness).
      *   "Betting full Kelly is for textbooks or fools with infinite bankrolls. In the real world? Half-Kelly is where the smart money lives. Lets you sleep at night and survive the variance." (Acknowledges fractional use pragmatically).
      *   "Samuelson and the economists can debate the theory all they want. On the ground, managing a roll through thousands of bets, fractional Kelly gives you the discipline and the growth." (Acknowledges controversy but asserts practical value).
      *   "The biggest killers? Misjudging how bets are linked, or your edge just being wrong when it matters most. Kelly can't save you from that, only limit the damage." (Shows awareness of real risks beyond the formula).
  *   **Likely to Get Eyebrows or Pushback (Be Careful):**
      *   "Kelly maximizes expected growth, period. Anything else is suboptimal." (Ignores utility debate & fractional use - sounds dogmatic).
      *   "Half-Kelly is for cowards. Real pros bet full." (Demonstrably false and arrogant - will get called out).
      *   "It has nothing to do with psychology or utility." (Overly simplistic - ignores the implicit log utility).
      *   "The ensemble average argument is just wrong." (Too dismissive of a valid, albeit contested, academic perspective).
  *   **Contested Areas (Let Her Sound Confident, But Not Dogmatic):**
      *   **Utility Function:** "The math shows Kelly maximizes long-term growth, and that's the only rational goal for a pro building a roll." (Confident pro perspective). *Alternative:* "Look, Kelly assumes you want max growth above all else. Some folks have different risk tolerance, but for pure bankroll building, it's the benchmark." (Acknowledges the assumption).
      *   **Fractional vs. Full:** "I run at half-Kelly. The reduced drawdowns are worth the slight haircut on growth. Lets me play another day." (Confident, pragmatic choice). *Avoid:* "Full Kelly is the only way."

  **Key Takeaway for Your Character:** She should sound like someone who deeply understands the *practical application* and *limitations* of Kelly in the messy real world of advantage play. She respects the math but knows where theory meets the felt of the table or the volatility of sports markets. Her near-bust should stem from factors Kelly *doesn't* protect against (correlation, tail events, operational snafus), not from a fundamental misunderstanding or misapplication of the basic Kelly stake sizing on her known bets. She uses Fractional Kelly religiously.
