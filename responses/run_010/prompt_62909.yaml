prompt: |-
  I write a weekly column on science and ideas, and in November I am running a forty-five-minute Saturday seminar for about twenty-five readers: intelligent, no mathematics beyond school algebra, and several of them have already met the popular accounts of ergodicity economics and the claim that maximising expected value is a confidence trick. The topic is the Kelly criterion and the difference between maximising expected value and maximising long-run growth rate.

  Please do not explain the material to me; plan how I should explain it. I want the order in which the pieces have to arrive and what each one depends on — in particular, how much of compounding and multiplicative structure must be in place before the split between arithmetic and geometric means means anything at all, and whether ergodicity should be named at this level or left as jargon I expressly decline to unpack. I am minded to build the whole session around one repeated wager that either grows a stake by 50 per cent or shrinks it by 40: tell me whether that case can carry the weight or whether it will mislead, and if it cannot, what should replace it and what properties the replacement must have.

  Then map the misconceptions. I expect at least that expected value is simply an error, that the Kelly formula reveals your edge rather than consuming an estimate of it, and that the logarithm is nothing but risk aversion under a new name. Say at which point in the sequence each must be headed off before it sets, and which I should let the audience voice for themselves.

  Close with one question I can put to the room that would separate those who have grasped why averaging across players and averaging across time come apart from those who have merely learned to distrust the phrase expected value, and tell me what I should announce at the outset as beyond the scope of the session.
reasoning: |-
  We are planning a 45-minute seminar on the Kelly criterion for an audience of about 25 intelligent readers with no math beyond school algebra. They are familiar with popular accounts of ergodicity economics and the critique that maximizing expected value can be problematic.

  The goal is to explain the difference between maximizing expected value (arithmetic mean) and maximizing long-run growth rate (geometric mean). We will build the session around a specific repeated wager: a bet that either grows the stake by 50% (with probability p) or shrinks it by 40% (with probability 1-p). We need to check if this example can carry the weight or if it misleads.

  ### Step 1: Structure the Session

  **Total Time: 45 minutes**

  #### Part 1: Introduction and Setting the Stage (5 minutes)
  - **Objective:** Frame the problem and introduce the repeated bet example.
  - **Content:**
    - Start with the repeated wager: "Imagine you are offered a bet that, with probability p, you win 50% of your current stake, and with probability 1-p, you lose 40%. You can bet any fraction of your bankroll repeatedly. How would you bet to maximize your long-term growth?"
    - State the two approaches: 
      - One approach is to maximize the expected value (arithmetic mean) of the outcome of one bet.
      - The other is to maximize the long-run growth rate (geometric mean) of your bankroll over many bets.
    - Announce beyond the scope: We will not dive into the mathematics of ergodic theory, continuous-time models, or the full derivation of the Kelly criterion for general cases. We focus on a simple discrete bet to illustrate the core idea.

  #### Part 2: The One-Bet Perspective: Expected Value (10 minutes)
  - **Objective:** Show that maximizing expected value leads to betting full bankroll and why that is problematic in repeated bets.
  - **Content:**
    - Calculate the expected value of a single bet for a fraction `f` of the bankroll.
      - Outcome 1: Win -> bankroll becomes `1 + 0.5f`
      - Outcome 2: Loss -> bankroll becomes `1 - 0.4f`
      - Expected value (arithmetic mean) after one bet: `p*(1+0.5f) + (1-p)*(1-0.4f)`
      - Simplify: `1 + p*0.5f - (1-p)*0.4f = 1 + f*(0.5p - 0.4(1-p)) = 1 + f*(0.9p - 0.4)`
    - The expected value is maximized by betting the full bankroll (`f=1`) if the edge is positive (i.e., if `0.9p - 0.4 > 0` -> `p > 4/9 ≈ 0.444`).
    - But what if we bet full bankroll repeatedly? Use a simulation (or a thought experiment) for two bets:
      - After two wins: `1 * (1.5)^2 = 2.25`
      - After two losses: `1 * (0.6)^2 = 0.36`
      - After one win and one loss (in any order): `1 * 1.5 * 0.6 = 0.9`
      - The expected value after two bets: `p^2*2.25 + 2*p*(1-p)*0.9 + (1-p)^2*0.36`
      - But note: if we lose the first bet, we are down to 0.6 and then betting full bankroll again may lead to ruin? Actually, with two losses we are at 0.36, which is not zero. However, the key is the multiplicative effect.

    **Misconception to head off here:** The expected value after multiple bets is the same as the one-bet expected value raised to the power? (No, it's not multiplicative in the same way because we are averaging the outcomes.) Instead, we note that the expected value grows linearly in the number of bets? But actually, the expected value after n bets is `[1 + f*(0.9p-0.4)]^n`? That would be if we were adding, but we are multiplying. Actually, the expected value after n bets is multiplicative in the sense of independent events? Let me correct:

    The bankroll after n bets is a random variable: `S_n = S_0 * (1+0.5f)^W * (1-0.4f)^L` where W is the number of wins and L = n - W.

    The expected bankroll is `E[S_n] = S_0 * [p*(1+0.5f) + (1-p)*(1-0.4f)]^n`? NO, that is incorrect because the expectation of a product of independent random variables is the product of expectations only if they are independent? But note: the bankroll is multiplicative and the returns in each period are independent, but the expectation of the product is not the product of the expectations because of the exponent? Actually, we have:

    `E[S_n] = S_0 * E[ (1+0.5f)^W * (1-0.4f)^(n-W) ] = S_0 * [ p*(1+0.5f) + (1-p)*(1-0.4f) ]^n`? This is not true! Because the expectation of a product of independent random variables is the product of the expectations? But note that the bankroll is the product of the per-bet multipliers. Since the bets are independent, we have:

    `E[S_n] = S_0 * [ E[ (1+0.5f)*I_win + (1-0.4f)*I_loss ] ]^n`? Actually, no: because the expectation of the product of the multipliers is the product of the expectations only if the multipliers are independent? They are independent, so:

    `E[S_n] = S_0 * [ E[multiplier per bet] ]^n = S_0 * [ p*(1+0.5f) + (1-p)*(1-0.4f) ]^n`

    So the expected value grows exponentially at the rate of the arithmetic mean per bet.

    However, the problem is that the expected value is dominated by very unlikely paths of huge wins (like all wins) and the typical path (which is a mix of wins and losses) might be poor. Moreover, if we bet full bankroll and we have a loss, we are left with 60% of the bankroll, and then if we bet full again and lose again, we are at 36%, and so on. The expected value is high because of the very small probability of winning all the time? But that is not the typical outcome.

    We need to shift to the geometric mean.

  #### Part 3: The Repeated Bet Perspective: Growth Rate (15 minutes)
  - **Objective:** Introduce the geometric mean and the long-run growth rate.
  - **Content:**
    - The key insight: In repeated bets, the bankroll grows multiplicatively. Therefore, we care about the geometric mean growth factor per bet.
    - The growth factor per bet is the geometric mean of the multipliers (win and loss). For one bet, we have two outcomes. For many bets, the growth rate is the average of the logarithm of the multipliers (because log transforms multiplication into addition). The long-run growth rate per bet is:
          `G(f) = p * log(1+0.5f) + (1-p) * log(1-0.4f)`
    - Why logarithm? Because after n bets, the bankroll is:
          `S_n = S_0 * (1+0.5f)^W * (1-0.4f)^(n-W)`
          => `log(S_n) = log(S_0) + W * log(1+0.5f) + (n-W)*log(1-0.4f)`
          => `(1/n) * log(S_n) = (1/n)*log(S_0) + (W/n)*log(1+0.5f) + (1-W/n)*log(1-0.4f)`
       As n becomes large, by the law of large numbers, `W/n` converges to `p`. Therefore:
          `(1/n) * log(S_n) -> p * log(1+0.5f) + (1-p)*log(1-0.4f) = G(f)`
       So the long-run growth rate is `G(f)`.

    - We maximize `G(f)` to maximize the long-run growth. This is the Kelly criterion.

    - Now, we can compute the optimal fraction `f*` by taking the derivative of `G(f)` and setting it to zero (but we don't need to do calculus in the seminar). Instead, we can show a table or graph for a specific `p`. Let's pick `p=0.6`.

      For `p=0.6`:
        - Expected value edge: `0.9*0.6 - 0.4 = 0.54-0.4=0.14` -> positive, so expected value says bet full bankroll (`f=1`).
        - But let's compute `G(f)` for different `f`:

          f=0: G(0) = 0.6*log(1) + 0.4*log(1) = 0
          f=0.5: 
              win: 1+0.5*0.5 = 1.25
              loss: 1-0.4*0.5 = 0.8
              G(0.5)=0.6*log(1.25)+0.4*log(0.8) ≈ 0.6*0.22314 + 0.4*(-0.22314) = 0.13388 - 0.089256 = 0.044624
          f=1:
              win: 1.5, loss: 0.6
              G(1)=0.6*log(1.5)+0.4*log(0.6) ≈ 0.6*0.4055 + 0.4*(-0.5108) = 0.2433 - 0.20432 = 0.03898

          Actually, we see that at f=1, the growth rate is positive? But let me check: 0.03898 is positive. But what if we compute at f=0.8?

          We can also compute the growth rate at f=1 for p=0.6: it is positive? Then why is betting full bankroll suboptimal?

          Actually, we see that for f=0.5 we get 0.0446, which is higher than 0.03898 at f=1. So the growth rate is maximized at an intermediate fraction.

          We can also try f=0.7:
              win: 1+0.5*0.7=1.35, loss:1-0.4*0.7=0.72
              G(0.7)=0.6*log(1.35)+0.4*log(0.72) ≈ 0.6*0.3001 + 0.4*(-0.3285) = 0.18006 - 0.1314 = 0.04866

          Then try f=0.8:
              win: 1.4, loss: 0.68
              G(0.8)=0.6*log(1.4)+0.4*log(0.68) ≈ 0.6*0.3365 + 0.4*(-0.3857) = 0.2019 - 0.15428 = 0.04762

          So the maximum is around f=0.7.

          But note: if we bet full bankroll and we lose, we are left with 60% of the bankroll. Then we have to bet again? And if we lose again, we are at 36%. The growth rate is still positive? But the problem is that the variance is high and the typical outcome is not the expected value.

          However, the key is that the growth rate is higher at f=0.7 than at f=1. So we get more growth by betting less.

    - Why is the growth rate maximized at an interior point? Because when we bet too much, the losses hurt more (multiplicatively) and we lose more than we gain in the long run.

    - **Misconception to head off:** The logarithm is not just a risk aversion measure. It is the key to converting multiplicative growth into additive growth. Without the log, we cannot add the growth over time. The Kelly criterion is about maximizing the growth rate, not about risk aversion per se. However, it does imply a form of risk aversion because it avoids ruin.

  #### Part 4: The Split Between Arithmetic and Geometric Means (5 minutes)
  - **Objective:** Explain why the arithmetic mean (expected value) and geometric mean (long-run growth rate) lead to different optimal strategies.
  - **Content:**
    - The arithmetic mean return per bet is `p*(1+0.5f) + (1-p)*(1-0.4f) - 1 = f*(0.9p-0.4)` (the expected net return).
    - The geometric mean return per bet is `exp(G(f))-1`? Actually, the geometric mean of the multipliers is `exp(G(f))` (because `G(f)` is the expected log return). The growth rate in the exponent is `G(f)`, so the geometric mean multiplier is `exp(G(f))`.
    - The arithmetic mean is always greater than or equal to the geometric mean (by the AM-GM inequality). The difference is due to volatility: the more volatile the returns, the larger the gap. Therefore, strategies that maximize the arithmetic mean (like betting full bankroll) are more volatile and may have a lower geometric mean.

    - In our example with p=0.6 and f=1:
        - Arithmetic mean multiplier: `0.6*1.5 + 0.4*0.6 = 0.9+0.24 = 1.14` (so 14% expected growth per bet? but note: this is the expected value of the multiplier, not the growth rate).
        - Geometric mean multiplier: `exp(0.03898) ≈ 1.0397` (so about 3.97% per bet) OR we can compute the geometric mean as `(1.5)^0.6 * (0.6)^0.4 ≈ 1.5^0.6 * 0.6^0.4 ≈ (1.275) * (0.693)^0.4`? Actually, easier: `exp(0.6*log(1.5)+0.4*log(0.6)) = exp(0.03898) ≈ 1.0397`.

    - The arithmetic mean is 1.14, but the geometric mean is 1.0397. The long-run bankroll grows at 3.97% per bet, not 14%. The arithmetic mean is misleading because it does not account for the compounding.

  #### Part 5: Addressing Misconceptions (5 minutes)
  - **Objective:** Clarify common misunderstandings.
  - **Content:**
    - **Misconception 1: Expected value is simply an error.**
        - Correction: Expected value is not an error; it is the correct measure for a one-off bet if you are maximizing the average outcome. The issue is that for repeated bets, we are compounding and we care about the long-run growth, which is captured by the geometric mean.

    - **Misconception 2: The Kelly formula reveals your edge rather than consuming an estimate of it.**
        - Correction: The Kelly criterion requires an estimate of the edge (the probability and the payoffs). It uses that edge to compute the optimal fraction. It does not reveal the edge; it uses the edge to maximize growth.

    - **Misconception 3: The logarithm is nothing but risk aversion under a new name.**
        - Correction: The logarithm is a mathematical tool that converts multiplicative growth into additive growth. It is not about risk aversion per se. However, the Kelly criterion does avoid ruin and therefore is more conservative than betting full bankroll. But it is the optimal strategy for maximizing long-run growth, not because we are risk averse but because we want to avoid the multiplicative drag of losses.

    - **Timing for misconceptions:** 
        - Misconception 1: Address after Part 2 (expected value) and Part 3 (growth rate) to contrast the two.
        - Misconception 2: Address when explaining the Kelly formula (Part 3) — we need to know the edge to use Kelly.
        - Misconception 3: Address in Part 3 when introducing the logarithm.

  #### Part 6: The Role of Ergodicity (2 minutes)
  - **Objective:** Connect to ergodicity without unpacking the jargon.
  - **Content:**
    - We can mention: The reason we switch from expected value to growth rate is because of the non-ergodic nature of wealth in repeated bets. In non-ergodic systems, the time average (growth over time for one individual) is not the same as the ensemble average (average across many individuals at one time). 
    - In our case, the expected value is an ensemble average (if we had many people betting once, the average outcome would be the expected value). But for one individual betting many times, the growth rate is the time average. Because the system is multiplicative, these two averages differ.
    - We do not need to go into the details of ergodicity. We can say: "In popular terms, ergodicity economics points out that when we are repeatedly betting, we are traversing one path through time and we care about the growth along that path. The expected value, however, averages over many paths at one time. These are different when the system is multiplicative and volatile."

  #### Part 7: Conclusion and the Separating Question (3 minutes)
  - **Objective:** Wrap up and test understanding.
  - **Content:**
    - **Separating Question:** 
        - "Suppose we have two players, Alice and Bob, both starting with $100. Alice bets the full Kelly fraction (the optimal fraction we found) repeatedly, and Bob bets a higher fraction (say full bankroll). They both face the same sequence of wins and losses. After a long time, we look at their bankrolls. What would we see? And why is the expected value of Bob's bankroll higher than Alice's, but Alice is almost surely ahead of Bob?"

        Answer: 
        - Bob's bankroll is more volatile. The expected value of Bob's bankroll is higher because of the small chance of an enormous win (if he wins many times in a row). However, the typical outcome (the median) for Bob is much lower. Alice, by betting the Kelly fraction, has a smoother growth and in the long run, her bankroll grows at the optimal rate. Thus, in the majority of the scenarios (i.e., with probability approaching 1), Alice will be ahead of Bob.

    - **Announce beyond the scope at the outset:** 
        - We are not covering: 
            - The full derivation of the Kelly criterion for general assets.
            - The mathematics of ergodic theory.
            - Continuous-time finance (like the Merton problem).
            - The use of Kelly for portfolio allocation with multiple assets.

  ### Can the 50%/40% Example Carry the Weight?
  - **Pros:** 
      - Simple numbers: 50% gain and 40% loss are easy to compute.
      - The example clearly shows that betting full bankroll is suboptimal for long-run growth.
      - The growth rate function can be illustrated without complex math.

  - **Cons:**
      - The example does not lead to ruin in one loss (since 40% loss leaves 60% of the bankroll). But ruin is avoided? However, if we keep betting full bankroll, we never go to zero but we can get arbitrarily close. That is acceptable.
      - The example with p=0.6 and f=1 still has a positive growth rate? But we showed that a lower fraction (0.7) has a higher growth rate. So it works.

    However, note: if we set the loss fraction to 50% (so that a loss leaves 50%), then betting full bankroll would lead to zero after two consecutive losses? Actually, no: 1 * 0.5 * 0.5 = 0.25. But if we set the loss fraction to 100%, then one loss would ruin. We don't need ruin to make the point. The 50%/40% example is fine.

    I think it can carry the weight.

  ### Revised Plan with Timing

  - **Introduction (5 min)**: The bet and the two approaches.
  - **Expected Value Approach (10 min)**: Calculation and why it suggests betting full bankroll. Then show that in repeated bets, the expected value is high but the typical outcome is not.
  - **Growth Rate Approach (15 min)**: The multiplicative structure and the logarithm. Derive the growth rate and show optimization. Use p=0.6 and compute for f=0, 0.5, 0.7, 1.0. Show that f=0.7 is better than f=1.0.
  - **Arithmetic vs Geometric Mean (5 min)**: Explain the gap due to volatility.
  - **Misconceptions (5 min)**: Address the three misconceptions.
  - **Ergodicity (2 min)**: Briefly connect without jargon.
  - **Conclusion and Question (3 min)**: Pose the separating question and wrap up.

  Total: 45 minutes.

  ### The Separating Question in Detail
  - After the session, ask: 
      "Consider two strategies for the same bet: 
        - Strategy A: Bet the Kelly fraction (which we found to be about 0.7 for p=0.6).
        - Strategy B: Bet full bankroll (f=1).
      After 100 bets (with p=0.6), which strategy do you think has a higher expected bankroll? Which strategy is more likely to leave you with more money? Why?"

      Answer:
        - The expected bankroll for Strategy B is higher because the arithmetic mean return is higher and the expected value grows at the arithmetic mean rate. 
        - However, Strategy A is more likely to leave you with more money because it has a higher growth rate (geometric mean) and thus the median outcome (and the typical outcome) is higher. The reason is that Strategy B has a very high variance and is skewed: a few paths with many wins have extremely high bankrolls, but most paths have a mix and the bankroll is lower.

  This question separates those who understand the difference between the ensemble average (expected value) and the time average (growth rate) from those who merely distrust expected value.

  ### Final Notes
  - Use visual aids: graphs of bankroll trajectories for the two strategies, or a table of growth rates.
  - Encourage questions throughout but manage time.
  - Provide handouts with the calculations for the example.

  This plan should work for the audience.
answer: |-
  ### Structured Plan for the Seminar  
  **Total Time:** 45 minutes  
  **Core Example:** Repeated wager: **+50% gain** (probability `p`) or **-40% loss** (probability `1-p`).  
  **Why this example works:** It clearly illustrates multiplicative compounding, avoids ruin (so growth is possible), and shows divergence between expected value and growth rate. It can carry the weight if you emphasize *volatility drag* and *compounding* early.  

  ---

  ### Sequence of Concepts & Timing  
  **Key Principle:** Build **multiplicative growth** first, then contrast arithmetic vs. geometric means. Introduce ergodicity only as a *descriptor* (no math).  

  1. **Introduction: The Setup (5 min)**  
     - **Goal:** Frame the problem.  
     - **Content:**  
       - Present the wager: "You bet fraction `f` of your bankroll. Win: `+50%`. Lose: `-40%`. Repeat weekly."  
       - Ask: *"How much should you bet to maximize wealth long-term?"*  
       - State the conflict: *"Expected value says one thing, long-run growth says another."*  
       - **Declare out-of-scope:**  
         - Formal ergodic theory math.  
         - Portfolio optimization (multiple assets).  
         - Derivations of Kelly for non-simple bets.  

  2. **Establish Multiplicative Compounding (10 min)**  
     - **Goal:** Show why growth is multiplicative, not additive.  
     - **Content:**  
       - Simulate 2–3 bets visually (e.g., $100 → win → $150 → loss → $90).  
       - Contrast with *additive* bets (e.g., +$50/-$40) to show compounding matters.  
       - **Key insight:** Wealth evolves as `bankroll × (1 + return)`. Losses *multiply* the bankroll, not subtract.  
     - **Depends on:** Nothing. Start here to ground everything in compounding.  

  3. **Expected Value (Arithmetic Mean) (8 min)**  
     - **Goal:** Show why it misleads.  
     - **Content:**  
       - Calculate expected value *per bet*: `EV = p(1 + 0.5f) + (1-p)(1 - 0.4f)`.  
       - For `p > 4/9 ≈ 0.444`, EV is maximized at `f=1` (bet everything).  
       - **Pitfall:** Let the audience discover that `f=1` risks deep losses (e.g., 2 losses: $100 → $60 → $36).  
       - **Misconception headed off:** *"Expected value is an error."*  
         → **Correct:** It’s valid for *one-off* bets but ignores compounding.  

  4. **Long-Run Growth (Geometric Mean) (12 min)**  
     - **Goal:** Derive growth rate as the geometric mean.  
     - **Content:**  
       - After `n` bets, bankroll = `S₀ × (1+0.5f)ᵂ × (1−0.4f)ᴸ` (W wins, L losses).  
       - **Growth rate per bet:** `G = (Sₙ/S₀)¹/ⁿ`. For large `n`, `G ≈ geometric mean`.  
       - Use logs: `log(G) ≈ [p log(1+0.5f) + (1-p) log(1−0.4f)]`.  
       - Maximize `log(G)` → Kelly criterion.  
       - **Example:** `p=0.6`.  
         - EV-max: `f=1` (growth rate ≈ 3.9%/bet).  
         - Kelly: `f≈0.69` (growth rate ≈ 4.9%/bet).  
     - **Depends on:** Multiplicative structure (Step 2).  
     - **Misconceptions headed off:**  
       - *"Logarithm is just risk aversion."* → **Correct:** Log transforms *multiplicative* growth to *additive* (not psychological).  
       - *"Kelly reveals your edge."* → **Correct:** Kelly *uses* your edge (`p` and odds); it doesn’t reveal it.  

  5. **Arithmetic vs. Geometric Mean (5 min)**  
     - **Goal:** Explain why they diverge.  
     - **Content:**  
       - Arithmetic mean ≥ geometric mean (AM–GM inequality).  
       - **Volatility drag:** Higher variance reduces geometric mean (show with `f=1` vs. `f=0.69` for `p=0.6`).  
       - Connect to compounding: Volatility hurts growth because losses *multiply* a smaller base.  
     - **Depends on:** Steps 2 (compounding) and 4 (growth rate).  

  6. **Ergodicity: Naming the Split (3 min)**  
     - **Goal:** Link to ergodicity without math.  
     - **Content:**  
       - *"In repeated bets, you live one sequence of outcomes (time average). Expected value averages over parallel universes (ensemble average)."*  
       - **Declare:** *"We call this non-ergodicity, but today, it’s enough to see why time and ensemble averages differ."*  
     - **Do not unpack ergodicity.** Use it as shorthand for "time vs. ensemble split."  

  7. **Conclusion & Separating Question (2 min)**  
     - **Separating Question:**  
       *"Two people play this bet weekly for 10 years. Alice maximizes expected value (bets full bankroll). Bob maximizes growth (bets Kelly fraction). Who has more wealth in 99% of scenarios? Why is Alice’s expected wealth higher?"*  
       - **Answer:** Bob wins in 99% of paths (higher median). Alice’s EV is higher because a few paths of extreme wins skew the average.  
     - **Why it separates understanding:**  
       - Surface-level: Knows EV is misleading.  
       - Deep: Sees that EV ≠ median due to skew; time-averaged growth dominates.  

  ---

  ### Handling Misconceptions  
  | Misconception | When to Address | How to Head Off |
  |---------------|-----------------|-----------------|
  | "Expected value is simply an error." | During Step 3 (EV) | *"It’s correct for a single bet but ignores compounding."* |
  | "Kelly reveals your edge." | During Step 4 (Kelly derivation) | *"No—you need p and odds to compute Kelly. It optimizes growth given your edge."* |
  | "Logarithm is risk aversion." | During Step 4 (log use) | *"Log converts multiplicative growth to additive. It’s about math, not psychology."* |

  **Tactics:**  
  - Let the audience voice the first misconception during Step 3 (they’ll see `f=1` is reckless).  
  - Preempt the others in Steps 4–5 before they solidify.  

  ---

  ### Why the 50%/40% Example Works  
  - **Strengths:**  
    - Clear multiplicative structure (no ruin in one bet).  
    - Shows volatility drag: At `p=0.6`, `f=1` has positive EV but suboptimal growth.  
    - Kelly fraction (`f≈0.69`) is easily calculable.  
  - **Weaknesses (and fixes):**  
    - **Risk of ruin?** Not in one bet, but with `f=1`, after 10 losses, bankroll is 0.6¹⁰ ≈ 0.006 → near-ruin. Use this to show why Kelly avoids deep risk.  
    - **Misleading if not repeated?** Emphasize early that repetition is key.  

  **If replacing:** Use a bet with symmetric payoff (e.g., +100%/-50%) to highlight skew. But 50%/40% is simpler.  

  ---

  ### Final Checks  
  - **Prerequisites:** School algebra (logs, exponents).  
  - **Tools:** Visuals showing bankroll paths (e.g., 10 bets for `f=1` vs. `f=0.69`).  
  - **Pacing:** Allocate time to Steps 2 (compounding) and 4 (growth rate)—they’re foundational.  
  - **Jargon:** Avoid "ergodicity economics." Say "time average vs. ensemble average."  

  This plan ensures the audience *builds* the intuition sequentially, with the example anchoring each concept.
