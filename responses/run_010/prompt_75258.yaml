prompt: |-
  I serve on the methods-review panel of our interdisciplinary cognitive science program, where a striking share of the manuscripts and dissertation chapters assigned to me stake a central claim on the language of thought hypothesis — that some subject, avian or human or artificial, entertains representations with genuine constituent structure. Such claims are typically asserted on the strength of a single generalization effect. I should like a triage procedure that my graduate-student readers, who have one term of philosophy of mind and no formal background, can run on such a manuscript in under an hour.

  Specify the questions to be asked in order, and which distinctions must survive the simplification — productivity as against systematicity, the vehicle of a representation as against its content, a structured representational format as against a merely structured task environment, competence as against performance; what constitutes a sufficient answer at each step; where the procedure stops with a flat "this datum does not license the claim"; and where it refers the matter up to a faculty reader because what remains is interpretation rather than evidence. Mark explicitly which steps are judgment calls dressed as procedure, and say what the procedure cannot settle at all, including whether a system that passes every behavioral test while lacking syntax-like vehicles counts as confirming the hypothesis.

  Then run it on three submissions: (a) corvids trained so that reward depends on which of two relations — above, left of — holds between two of nine familiar icons, then tested on all untrained pairings of those icons and on pairs containing icons never used in training, the authors concluding that the birds compose relations with their arguments; (b) adults who learn an artificial grammar in which legal strings reduplicate an item type and who at test accept novel rule-obeying strings while rejecting novel strings matched to the training items in length and bigram frequency, the authors concluding that participants represent a rule quantifying over variables; (c) a transformer that passes a systematicity battery over novel operand pairs and novel digit ranges, where a probing study finds units whose activation tracks place value and the discussion section claims structured, compositional internal representations.

  I expect at least one of these to receive a verdict contrary to the reading its authors — and, candidly, I — find most natural; say which, and why the procedure is unmoved. Since my signature goes on the panel's recommendation, flag any case whose verdict is not stable enough for me to defend it to the committee.
reasoning: |-
  We are designing a triage procedure for manuscripts claiming support for the Language of Thought (LOT) hypothesis based on a single generalization effect. The procedure must be executable by graduate students with one term of philosophy of mind and no formal background, in under an hour.

  Key distinctions to preserve (as per the query):
  1. Productivity vs. systematicity: 
     - Productivity: ability to produce/understand a potentially infinite set of representations from finite means.
     - Systematicity: if a system can represent some state of affairs, then it can represent other structurally similar states (e.g., if it can think "A loves B" then it can think "B loves A").
  2. Vehicle vs. content of a representation: 
     - Vehicle: the physical realization of the representation (e.g., neural activity, written symbols).
     - Content: what the representation is about.
  3. Structured representational format (syntactic structure) vs. a merely structured task environment: 
     - The environment might have structure, but that doesn't entail that the internal representation has syntactic structure.
  4. Competence vs. performance: 
     - Competence: the underlying knowledge (what the system is capable of in principle).
     - Performance: the actual behavior (which might be limited by memory, attention, etc.).

  The Triage Procedure:

  Step 1: Identify the claimed generalization effect.
     - Question: What is the specific behavioral or performance effect that the authors present as evidence for structured representations?
     - Required answer: A clear description of the training and test conditions, and the key result (e.g., successful generalization to novel stimuli or situations).
     - If not clear, stop: "The claimed generalization effect is not clearly described. This datum does not license the claim."

  Step 2: Check for alternative explanations based on unstructured representations (e.g., associative learning, similarity-based generalization).
     - Question: Could the observed generalization be explained by an unstructured model (e.g., a statistical model, a neural network without explicit compositionality) that relies on similarity to training examples or low-level features (e.g., bigram frequency, perceptual similarity)?
     - Required answer: The authors must have considered and ruled out at least one prominent unstructured alternative (e.g., by controlling for low-level features, or by testing on items that are equally similar to training items but violate the structure). 
     - If the authors have not considered such alternatives, stop: "The observed generalization can be explained without invoking structured representations. This datum does not license the claim."
     - Note: This step is a judgment call. The student must decide if the alternative explanations are sufficiently ruled out. If the manuscript does not address any alternatives, it fails.

  Step 3: Distinguish between structured environment and structured representation.
     - Question: Is the task environment structured (e.g., the stimuli have parts that are combined) and the generalization pattern follows that structure? If yes, then: 
          - Could the behavior be driven by the structure in the environment without the subject having internal structured representations? (e.g., by learning a set of independent associations, or by using non-compositional strategies that happen to track the structure)
     - Required answer: The authors should provide evidence that the subject is not merely responding to the structured environment by rote memorization or by a set of independent associations. For example, they might show that the subject can recombine elements in novel ways (productivity) or that they show systematicity (if they can handle one structure, they can handle a related one).
     - If the authors do not provide such evidence, stop: "The observed behavior may be a response to the structured environment without internal structured representations. This datum does not license the claim."

  Step 4: Check for productivity or systematicity.
     - Question: Does the generalization effect demonstrate either productivity (ability to handle novel combinations beyond the training set, ideally without bound) or systematicity (ability to handle a pattern that is structurally related to a learned pattern)?
     - Required answer: 
          - For productivity: The test should include novel combinations that are not just a small extension of the training set (e.g., using entirely new items in combination with old, or combinations that are arbitrarily complex). The generalization must be to a set that is not just a finite extension (if the set is finite, then it might be memorized). 
          - For systematicity: The test should show that if the subject can represent a relation R(A,B), then they can also represent a related structure, such as R(B,A) or a different relation S(A,B). 
     - If the test does not demonstrate at least one of these, stop: "The generalization effect does not demonstrate productivity or systematicity, which are hallmarks of structured representations. This datum does not license the claim."
     - Note: This step is a judgment call. The student must decide if the test cases are sufficiently novel and the pattern sufficiently systematic. 

  Step 5: Vehicle vs. content.
     - Question: Does the evidence speak to the vehicle of representation (i.e., the physical structure of the representation) or only to the content (what the representation is about)? The LOT hypothesis requires structured vehicles (syntax).
     - Required answer: The authors must provide evidence that the representation itself has constituent structure (e.g., via a probing study, or by ruling out that the behavior is driven by unstructured representations that merely track the structured content). If the evidence is purely behavioral (showing that the subject behaves as if they have structured representations), then we cannot conclude that the vehicle is structured. 
     - If the evidence is only about the content (i.e., the subject behaves in a way that is sensitive to the structure of the world) without evidence for structured vehicles, then stop: "The evidence only shows that the subject is sensitive to structured content, not that they use structured vehicles. This datum does not license the claim."
     - Exception: If the manuscript is about an artificial system (like a computer program) and the authors have access to the internal code, then they can directly inspect the vehicles. Otherwise, behavioral evidence alone is insufficient for vehicles.

  Step 6: Competence vs. performance.
     - Question: Does the evidence reflect competence (the underlying capacity) or is it limited by performance factors (e.g., memory, attention, processing limitations)? 
     - Required answer: The authors should show that the generalization effect is not due to a specific performance trick (e.g., they control for memory or attention) and that the effect is robust across variations that might affect performance. 
     - If the effect is fragile and only appears in a narrow window, it might not reflect a competence. However, if the effect is robust and general, that supports a competence. 
     - Note: This step is a judgment call and may not be fatal. If the effect is clear and the authors have controlled for obvious performance factors, then it can stand. But if the effect is marginal or only occurs under specific conditions, then it might not support a competence.

  Step 7: Referral to faculty.
     - If the manuscript passes all the above steps, then the evidence is strong. However, the triage procedure is designed to catch weak claims. If the manuscript passes step 5 (i.e., there is evidence for structured vehicles) and the other steps, then the claim is supported. Otherwise, if the manuscript has passed steps 1-4 and 6 but fails step 5 (no evidence for vehicles), then refer to faculty because the issue is interpretative: can we infer structured vehicles from behavioral evidence? This is a philosophical debate that the student is not equipped to settle.

  What the procedure cannot settle:
     - Whether a system that passes every behavioral test without having syntax-like vehicles counts as confirming the LOT hypothesis. The LOT hypothesis is about the vehicle, so if there are no structured vehicles, then it doesn't confirm LOT even if the behavior is systematic and productive. However, some philosophers (like connectionists) might argue that LOT is not necessary. This is beyond the triage.

  Now, we run the procedure on the three submissions:

  (a) Corvids study:
     - Step 1: The generalization effect is that the birds were tested on untrained pairings of the same nine icons and also on pairs containing new icons (never used in training) and performed above chance.
     - Step 2: The authors should have considered whether the birds are using simple associations (e.g., each icon has a value and the bird learns a rule for the relation). However, the use of new icons might rule out that the birds are relying solely on the specific icons. But what about the relations? The birds were trained on two relations. The test on new pairings of the same icons might be explained by associative learning (if the icons are represented as features and the relations as another feature). The test with new icons is more challenging for an unstructured model. However, if the new icons are similar to the old ones, then generalization by similarity might occur. The manuscript must show that the new icons are not just similar and that they controlled for that. Without that, we cannot rule out an unstructured model. 
       - Judgment: If the manuscript does not address this, stop. Let's assume they did not. Verdict: Stop at step 2.

  (b) Artificial grammar learning:
     - Step 1: The effect is that adults learned a grammar where legal strings reduplicate an item type (e.g., "ABAB") and at test they accepted novel rule-obeying strings and rejected novel strings matched in length and bigram frequency.
     - Step 2: The authors controlled for bigram frequency and length. But could the generalization be based on higher-order n-grams or other statistical patterns? The rule is a specific pattern (reduplication) that might be captured by a statistical model that tracks repetitions. However, the authors might argue that the rule is abstract and applies to any item. The test uses novel strings that follow the rule. The rejection of non-rule strings that have the same bigram frequency is strong. But note: the rule is about the entire string pattern (e.g., the first half equals the second half). A model that can compute identity between two halves might not require structured representations. However, the authors claim that the rule involves a variable (i.e., the same item type must appear in both halves). This is a structured representation. 
       - But step 3: The environment is structured (strings with two halves). The subjects might have learned a template: "first half and then the same again". This is a pattern that can be captured by a simple recurrent network without explicit variables. 
       - Step 4: It shows productivity? They tested novel strings. But the set of strings is finite? Actually, the rule is defined over a set of items, so if the items are arbitrary, then the set is infinite. However, in the experiment, the items are from a finite set. But the test uses novel combinations? The authors say "novel rule-obeying strings", so presumably they used new tokens that were not in training. So they show generalization to new tokens. However, the rule is very specific: the same token must appear in both halves? Or the same type? The description says "reduplicate an item type", so if the training items are of types (e.g., A and B) and the test uses new types (C and D) then the rule would be to have the same type in both positions? Actually, the rule is that the entire string must be of the form XX, where X is a sequence of one or more items? The example is "ABAB", which is not XX (unless X is "AB"). The problem: the rule is described as "reduplicate an item type", which is ambiguous. Let me clarify: typically, such studies use rules like "AABB" (which is reduplication of two items) or "ABAB" (which is a pattern). The key is that the rule requires identity of non-adjacent elements. The authors claim that this requires a variable. 
       - Step 5: The evidence is behavioral. There is no evidence about the vehicle. Therefore, we cannot conclude that the representation has structured vehicles. 
       - Verdict: Stop at step 5. The evidence only shows that the subjects are sensitive to the structure (the rule) but not that they use structured vehicles.

  (c) Transformer model:
     - Step 1: The model passes a systematicity battery (e.g., if it can do 23+56, then it can do 56+23, and also generalize to new digit ranges). Also, a probing study finds units that track place value.
     - Step 2: The systematicity tests are designed to rule out unstructured models. The probing study further shows internal structure.
     - Step 3: The task environment is structured (numbers have place value). The model's internal representations are probed and show structure (units for place value).
     - Step 4: The systematicity battery tests systematicity and also productivity (if the digit ranges are extended arbitrarily, though in practice they are bounded by the model's training). 
     - Step 5: The probing study provides direct evidence for structured vehicles (the units that represent place value are part of a compositional structure). 
     - Step 6: The performance is robust (across the battery). 
     - Verdict: Passes.

  Summary of verdicts:
     - (a) Stop at step 2: The corvids study does not rule out unstructured models (associative learning with generalization to similar icons). 
     - (b) Stop at step 5: The artificial grammar study only provides behavioral evidence, not evidence for structured vehicles. 
     - (c) Passes.

  The verdict contrary to what the user (and perhaps the authors) might find natural is (b). The user might think that the artificial grammar study clearly shows a rule with variables. However, the procedure is unmoved because without evidence for structured vehicles (step 5), we cannot conclude that the representation is structured. The behavior might be produced by an unstructured mechanism (e.g., a neural network that has learned the pattern without explicit variables).

  Defensibility:
     - (a) The verdict is stable: the corvids study might be explained by associative learning. 
     - (b) The verdict is stable in the procedure, but the referral step (step 7) would not be triggered because step 5 fails. However, note that step 7 is only for manuscripts that pass steps 1-4 and 6 but fail step 5. In (b), we stopped at step 5. But note: step 5 is about vehicles. The verdict for (b) is that it fails at step 5, so it does not get referred. However, the user might argue that behavioral evidence is sufficient for LOT. But the procedure is strict: structured vehicles are required. This verdict might be controversial and the user might need to defend it to the committee. 
     - (c) Stable.

  Therefore, we flag (b) as having a verdict that might be controversial because it hinges on the requirement for evidence about the vehicle, which is a point of philosophical debate. The user should be prepared to defend the position that behavioral evidence alone is insufficient for structured vehicles.

  Final note: The procedure is designed to be conservative. It errs on the side of rejecting claims without sufficient evidence for structured vehicles.
answer: |-
  ### Triage Procedure for Language of Thought Hypothesis Claims  
  **Designed for graduate students with one term of philosophy of mind and no formal background. Executable in <60 minutes.**  
  **Key preserved distinctions**: Productivity vs. systematicity; vehicle vs. content; structured representation vs. structured task environment; competence vs. performance.  

  ---

  #### Procedure Steps  
  1. **Identify the generalization effect**  
     - *Question*: What specific behavioral pattern is presented as evidence of structured representations?  
     - *Sufficient answer*: Clear description of a test where the system succeeds on inputs *structurally novel* (not just perceptually novel) relative to training.  
     - *Stop if*: The test lacks novelty (e.g., minor variations of training data). Verdict: **"This datum does not license the claim."**  

  2. **Rule out unstructured alternatives**  
     - *Question*: Could the effect be explained by associative learning, similarity-based generalization, or statistical regularities (e.g., bigrams)?  
     - *Sufficient answer*: Controls for low-level features (e.g., bigram frequency, perceptual similarity) or compares performance on structurally identical vs. distinct tasks.  
     - *Stop if*: Unstructured alternatives are plausible and unaddressed. Verdict: **"This datum does not license the claim."**  
     - *Judgment call*: Student must assess if controls are adequate (e.g., bigram matching alone may be insufficient).  

  3. **Distinguish structured environment from structured representation**  
     - *Question*: Is the task environment structured (e.g., relational), and could behavior rely on heuristics (e.g., feature binding) without compositional representations?  
     - *Sufficient answer*: Evidence that generalization requires *recombination of constituents* (e.g., novel argument-relation pairings).  
     - *Stop if*: Behavior is explainable by environmental scaffolding (e.g., rote memorization of task-specific patterns). Verdict: **"This datum does not license the claim."**  

  4. **Test for productivity/systematicity**  
     - *Question*: Does the evidence show **productivity** (infinite combinatorial capacity) or **systematicity** (ability to handle symmetrically related structures)?  
     - *Sufficient answer*:  
       - *Productivity*: Generalization to genuinely novel *types* of items (e.g., new icons/words) or unbounded complexity.  
       - *Systematicity*: Success on tasks requiring structural transformations (e.g., reversing roles).  
     - *Stop if*: Only finite extensions of training data (productivity absent) or no symmetry tests (systematicity absent). Verdict: **"This datum does not license the claim."**  
     - *Judgment call*: Student must discern if novelty is structural (e.g., new icons ≠ new relations).  

  5. **Vehicle vs. content**  
     - *Question*: Does the evidence distinguish structured *vehicles* (physical implementation) from structured *content* (meaning)?  
     - *Sufficient answer*:  
       - For *behavioral data*: Must show that unstructured vehicles (e.g., distributed vectors) could not produce the effect.  
       - For *neural/probing data*: Must identify discrete, recombinable components (e.g., neurons for place values).  
     - *Stop if*: Evidence only shows structured content (e.g., correct responses) without vehicle-level support. Verdict: **"This datum does not license the claim."**  
     - *Refer to faculty if*: Evidence is behavioral but passes Steps 1–4. **Reason**: Inference to vehicles is philosophical (e.g., does behavioral systematicity entail LOT?).  

  6. **Competence vs. performance**  
     - *Question*: Could performance limitations (e.g., memory, attention) explain failures, or is the effect robust?  
     - *Sufficient answer*: Controls for confounds (e.g., equal task difficulty) or shows high accuracy.  
     - *Judgment call*: Student assesses if errors are marginal vs. systematic. *No stop* but weakens claim.  

  **Procedure limits**:  
  - Cannot confirm LOT if a system passes all tests without structured vehicles (LOT requires syntactic vehicles).  
  - Cannot resolve philosophical disputes (e.g., connectionist vs. classicist views of implementation).  

  ---

  ### Application to Submissions  
  #### (a) Corvids composing relations (icons: above/left of)  
  1. **Generalization effect**: Tested on untrained icon pairings + new icons.  
  2. **Unstructured alternatives?** Plausible: Birds may associate icons with spatial positions (e.g., "icon A → top"). Authors likely controlled for icon familiarity but not relational statistics.  
  3. **Environment vs. representation**: Environment is structured, but birds may use feature-binding (e.g., "icon A + top") without composing relations/arguments.  
  4. **Productivity/systematicity**: Tests new icons (productivity) but **not systematicity** (e.g., no reversal test like "left → right").  
  5. **Vehicle vs. content**: Only behavioral data. No evidence for structured vehicles.  
     - **Verdict**: **Stop at Step 5.** "This datum does not license the claim."  
     - *Why unmoved?* Success may rely on unstructured feature associations.  

  #### (b) Adults learning reduplication grammar (e.g., "ABAB")  
  1. **Generalization effect**: Accepts novel rule-obeying strings; rejects matched bigram/length violations.  
  2. **Unstructured alternatives?** Controlled for bigrams/length, but reduplication could be learned as a "same sequence" template (no variables needed).  
  3. **Environment vs. representation**: Structured environment, but behavior may use chunked templates (e.g., "repeat the first two items").  
  4. **Productivity/systematicity**: Tests novel strings (productivity) but **not systematicity** (e.g., no test of embedded reduplication like "A(BB)A").  
  5. **Vehicle vs. content**: Only behavioral data. Authors claim "variables" but no vehicle-level evidence.  
     - **Verdict**: **Stop at Step 5.** "This datum does not license the claim."  
     - *Why unmoved?* Template-based learning can explain success without structured variables.  
     - *Contrary verdict?* Yes. Authors (and likely you) see rule-governed behavior as evidence for variables, but the procedure requires vehicle-level proof.  
     - **Unstable for committee defense**: Behavioral evidence for variables is contentious. Faculty referral recommended.  

  #### (c) Transformer with systematicity and place-value units  
  1. **Generalization effect**: Systematicity across novel operands/digit ranges.  
  2. **Unstructured alternatives?** Ruled out by systematicity battery (e.g., success on reversed/novel operations).  
  3. **Environment vs. representation**: Probing shows units for place value (e.g., "thousands digit"), indicating structured vehicles.  
  4. **Productivity/systematicity**: Systematicity confirmed (e.g., handles 123+456 and 456+123).  
  5. **Vehicle vs. content**: Probing evidence for structured vehicles (place-value units are recombinable constituents).  
     - **Verdict**: **Passes all steps.** Supports LOT claim.  

  ---

  ### Summary  
  - **(a) Corvids**: Rejected (no evidence for structured vehicles; alternative explanations).  
  - **(b) Artificial grammar**: Rejected (behavioral evidence insufficient for vehicles; variables unproven). **Contrary to intuitive reading** due to Step 5’s strictness.  
  - **(c) Transformer**: Accepted (probing evidence for vehicles).  

  **Flag for committee defense**: (b) is unstable. Faculty must adjudicate whether behavioral evidence alone can support vehicles (a philosophical question). **Your signature risk**: (b) relies on inferring vehicles from behavior—contentious in cognitive science.
