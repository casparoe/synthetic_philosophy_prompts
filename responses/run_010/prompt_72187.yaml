prompt: |-
  Last month I became coordinator of a community group that sponsors refugees through our government's private sponsorship scheme. We receive a fixed allocation each year — eleven places this year — several hundred files referred to us by partners overseas, and a small discretionary fund that can be spent on legal representation, medical evacuation, or onward travel for people who fall outside the scheme entirely. There are six of us, none with legal training, and about forty minutes per file. The committee is split: half want strict worst-off-first selection, the other half argue we should take the families most likely to settle well, since a sponsorship that collapses harms the people we brought and consumes a place we cannot recover. Our minutes are available to anyone who requests them, including unsuccessful applicants, and one of our founders has already told the committee she expects a particular family to appear on this year's list.

  Write the decision procedure my committee could actually run: the questions to put to each file in order, what would count as a sufficient answer to each, the tie-breakers for files that come out level, where the procedure terminates in a refusal, and where it must hand the decision back to us because the question is one of values rather than facts. Draw on what the political philosophy of asylum gives us about the difference between not returning someone to danger and being obliged to go and find people to protect, and about fair shares, but strip out whatever cannot survive contact with six volunteers and a forty-minute slot. Address whether the two funding instruments should run through one procedure or two, and whether people who fail the scheme's eligibility test are inside our obligations at all.

  Then run it on three files, one of them the founder's family, and show me the case where the procedure returns an answer the committee will resent. Finish by stating which distinctions you had to flatten to make this usable, and where it will yield a decision that is procedurally clean and substantively wrong.
reasoning: |-
  Hmm, the user is the coordinator of a refugee sponsorship group facing a complex ethical and practical dilemma. They need a decision procedure that balances fairness with feasibility given severe constraints: only 6 volunteers with no legal training, about 40 minutes per file, and competing philosophies within the committee. 

  The user's description reveals several pain points: the tension between prioritizing the most vulnerable versus those most likely to succeed, the founder's apparent conflict of interest, and the ambiguity around whether to consider applicants outside the official scheme. There's also the risk of resentment when transparent decisions clash with personal preferences.

  I need to design a procedure that:
  1) Respects core asylum principles (non-refoulement vs. positive obligations) 
  2) Operates within real-world constraints (time, expertise)
  3) Clearly separates factual screening from value judgments
  4) Handles both regular sponsorship funds and discretionary cases
  5) Produces auditable results given public minutes

  Key philosophical anchors:
  - Non-refoulement (don't return to danger) creates absolute eligibility floor
  - Fair shares: The 11 slots are scarce resources requiring triage
  - Utilitarian concerns (settlement success) have merit but can't override safety needs

  Practical simplifications I'll make:
  - Flatten complex vulnerability assessments into binary flags for immediate danger
  - Reduce settlement potential to verifiable proxies (language, trauma history)
  - Treat "founder's family" like any other application
  - Use tiebreakers that avoid subjective weighing

  The procedure must fail safely - when uncertainty exceeds volunteer capacity, it should flag for committee vote rather than force a flawed decision. For discretionary funds, I'll recommend separate criteria since those cases by definition fall outside the core mandate.

  Now for the test cases: I'll show how the same rules that correctly reject a non-urgent case (File B) might also reject the founder's preferred family (File A) due to lacking urgent protection needs - precisely the outcome likely to cause resentment. The third case (File C) demonstrates where the procedure appropriately escalates to human judgment when facts are unclear.

  Biggest tradeoffs:
  - Reducing vulnerability to immediate danger ignores chronic risks
  - Prioritizing settlement factors may disadvantage persecuted minorities
  - But without these simplifications, the committee couldn't function
answer: |-
  Here's a decision procedure designed for your constraints, grounded in asylum ethics but stripped to operational essentials. It prioritizes *actionable* thresholds over nuanced assessments, separates eligibility from prioritization, and flags value judgments for committee input.

  **Core Principles from Asylum Philosophy:**
  - **Non-refoulement** (don't return to danger) is absolute → Sets the eligibility floor.
  - **Positive obligation to protect** is limited by capacity → We allocate "fair shares" (11 spots), not open-ended rescue.
  - **Scarce resources** require prioritizing urgency, not just need → Collapsed sponsorships waste slots, harming others.

  ---

  ### **DECISION PROCEDURE**  
  *(40 min/file; 6 volunteers; 2 funding streams)*  

  **I. ELIGIBILITY SCREENING (10 min/file)**  
  *Objective: Does this case meet the scheme’s legal requirements AND our non-refoulement obligation?*  
  1. **Question:** Is there objective evidence (UNHCR/partner docs, country reports) of persecution risk in home country?  
     *Sufficient answer:* Verified threat (e.g., targeted violence, political arrest warrant, statelessness). *Tiebreaker/Unclear:* Escalate to committee.  
  2. **Question:** Does the government’s criteria exclude them? (e.g., criminal record, safe third country).  
     *Sufficient answer:* Clear in file. *Terminates in refusal* if exclusion applies.  
  3. **Question:** Would refusal expose them to *imminent, foreseeable danger*?  
     *Sufficient answer:* Yes (non-refoulement applies) → Proceed to prioritization.  
     *No* (e.g., economic migrant) → **Offload to discretionary fund review** (separate track).  

  **II. PRIORITIZATION (25 min/file)**  
  *Objective: Rank eligible cases by urgency + integration viability. "Worst-off-first" balanced by "collapse risk".*  
  4. **Question:** **Urgency:** Is there a time-critical threat? (e.g., active conflict zone, detention, medical emergency).  
     *Sufficient answer:* Independent evidence (e.g., UNHCR "emergency" flag, doctor's note). *Score:* 3 (critical), 2 (severe but stable), 1 (lower risk).  
  5. **Question:** **Integration Viability:** Does the file show indicators of likely sponsorship success?  
     *Sufficient answer:*  
     - Language: Basic English/French OR literacy in any language (1 pt).  
     - Health: No untreated severe mental illness or costly chronic condition (1 pt).  
     - Support: Family/community ties in Canada OR no history of trauma requiring specialist care (1 pt).  
     *Score:* 3 = all yes; 2 = two yes; 1 = one yes; 0 = none. *Tiebreaker:* Higher urgency score wins.  

  **III. DECISION & ESCALATION (5 min/file)**  
  6. **Rank files:** Top 11 by (Urgency Score + Viability Score).  
     - *Tiebreaker:* File received date (older wins).  
  7. **Terminate/Refuse:** If eligibility fails (Step I) or discretionary fund criteria unmet (see below).  
  8. **Escalate to Committee:**  
     - If evidence is contradictory (e.g., persecution claimed but home country rated "safe").  
     - If viability factors conflict with values (e.g., rejecting a family with PTSD because "no specialist access").  

  **Discretionary Fund Track**  
  *Separate procedure for Step I failures:*  
  1. **Question:** Is there a life-threatening need *unrelated to persecution* (e.g., medical evacuation)?  
  2. **Question:** Can we assist at ≤20% of annual fund per case?  
     *Sufficient answer:* Verified cost estimate + partner org commitment.  
     *Terminate:* If no credible partner or funds exhausted.  

  **Why Two Tracks?**  
  - Core scheme requires legal eligibility; discretionary addresses humanitarian gaps.  
  - Mixing them risks misallocating scarce sponsorship slots.  

  **Are Failed Applicants "Inside Our Obligations"?**  
  - *Ethically:* Non-refoulement applies universally, but our *capacity* is limited to 11 slots + discretionary fund.  
  - *Procedurally:* Only eligible cases enter prioritization; others may access discretionary aid if funds allow.  

  ---

  ### **TEST CASES**  
  **File A (Founder’s Family)**  
  - *Eligibility:* Persecution verified (ethnic minority, village burned). Government criteria met.  
  - *Urgency:* In refugee camp (stable); no immediate threat → **Score 2**.  
  - *Viability:* No local ties; no English; mother has depression → **Score 1 (literacy only)**.  
  - *Total:* 3. *Decision:* **Reject** (below top 11 cutoff). *Escalation?* No — facts clear.  

  **File B**  
  - *Eligibility:* Fleeing torture; police report confirms injuries → Eligible.  
  - *Urgency:* Hiding in city; informants active → **Score 3**.  
  - *Viability:* Engineer; conversational English; cousin in Toronto → **Score 3**.  
  - *Total:* 6. *Decision:* **Accept**.  

  **File C**  
  - *Eligibility:* Political activist; jailed twice. Government denies due to "terrorism" clause.  
  - *Non-refoulement:* Jail likely → Eligible.  
  - *Urgency:* Recently released but under surveillance → **Score 2**.  
  - *Viability:* University-educated; no support network → **Score 2**.  
  - *Total:* 4. *Decision:* **Accept** (mid-tier).  

  **Resented Outcome:** File A (founder’s family) rejected despite eligibility. The committee’s "settlement viability" faction resents prioritizing higher-urgency cases; "worst-off-first" faction resents viability scoring. *The procedure forces objectivity but clashes with emotional loyalties.*  

  ---

  ### **FLATTENED DISTINCTIONS & SUBSTANTIVE FLAWS**  
  1. **Flattened:**  
     - "Vulnerability" reduced to time-critical threats (ignores chronic suffering).  
     - "Integration potential" simplified to binary indicators (misses resilience factors).  
     - "Worst-off" defined narrowly as bodily harm (overlooks systemic oppression).  

  2. **Procedurally Clean but Substantively Wrong:**  
     - **False Negatives:** A file with strong oral testimony but weak documents (e.g., LGBTQ+ applicant) may fail eligibility despite real risk.  
     - **Bias:** Viability scoring favors educated, English-speaking refugees — disadvantaging rural poor.  
     - **Triage Injustice:** A family with score 3.5 may lose to a 4 due to arbitrary "older file" tiebreaker.  

  **Why This Works for Your Committee:**  
  - **Auditable:** Clear yes/no questions with document-based answers.  
  - **Time-Bound:** Steps fit 40 min/file; escalation points prevent deadlock.  
  - **Values Managed:** Flags moral dilemmas (e.g., mental health exclusions) for committee debate.  
  - **Defensible:** If challenged, you show consistent application of thresholds.  

  The resentment over File A isn't a flaw — it's the procedure working. It forces the committee to confront the gap between personal bonds and impartial allocation, which is the heart of ethical refuge.
