prompt: |-
  I'm in a tiny seminar this term, eight of us around a table, mostly case-mongering, and our professor has now given verdicts on like twenty rescue cases over six weeks. I'm trying to pin down what she's actually commited to for my term paper and I keep going in circles, so I figured I'd just dump her track record on you and see if it looks cleaner from the outside. We read Taurek early on and my friend in the seminar is convinced she's just a straight-up Taurekian, but I don't buy it, she's too careful for that. Here's what she's said: (1) Boat case — one person drowning on the near shore, five on the far shore, your boat reaches only one group: you may go either way, a coin flip is at least allowed, and if you let the one die you haven't wronged them; when someone pushed back with "but it's five lives" she said something like the five don't get to add themselves together. (2) Same setup but the one is your sister: save your sister, no coin flip needed, no leftover wrongdoing, and she got visibly irritated when a student suggested you'd owe the five an apology. (3) One person dies versus a million people each get a genuinely awful migraine: save the one who dies, little harms don't stack. (4) One person permanently paralyzed versus five who each lose a finger: save the paralyzed one. (5) One healthy 20-year-old versus five healthy 85-year-olds: coin flip, and she explicitly refused to weight by remaining years — she said life-years is a different currency and you don't get to smuggle it in. (6) The one she won't fully explain: one stranger versus a whole town of about 12,000 about to be wiped out by a flood — she said of course you save the town, and when asked whether that's the same principle with bigger numbers she said no, at some point they stop being numbers and start being a world. She wouldn't say where that point sits, and when someone asked whether 100 versus 1 was past it she said she'd have to think about it, which is extremely not like her.

  Here's the case I want to put to her Thursday, I made it up deliberately boring so there's nothing for her to grab onto: you're the only cave-rescue diver within range, one diver is wedged in a sump and drowns in about four hours and freeing them uses all your gas and all your time, while a tour boat has gone down half a mile up the coast and fifty people are in the water in suits that'll hold for maybe nintey minutes, and you can ferry them out but you can't do both. Everyone's a stranger to you, nobody's sicker or older or more blameworthy than anyone else, you caused neither situation, and no second rescuer is coming.

  So what does she say about the fifty? I want your best guess at her actual verdict, but more than that I want the candidate rules that are jointly consistent with all six of the above — I can think of two or three myself but I'm pretty sure I'm conflating some of them and missing others — and then what each of those rules predicts for the cave case, which one you'd bet on and why, and whether the town case is a genuine crack in her view or whether there's a reading of it that leaves everything else untouched. Then give me the single sharpest follow-up, either one more case or one plain question I could just ask her directly, that would separate the two best candidates; I'd much rather have one good discriminator than five soft ones. Bottom line first — your predicted verdict on the fifty in the very first sentence — then the reasoning, no preamble, and please don't restate the case back at me, I've read it enough times already.
reasoning: |-
  Okay, the user is in a seminar with a professor who's given verdicts on various rescue cases. They want to predict her response to a new case involving fifty people versus one. Let me start by understanding the professor's previous positions.

  First, in the boat case with one versus five, she allowed a coin flip and said saving the one doesn't wrong them. The five can't be aggregated. Then, when the one is your sister, she says save the sister without wrongdoing. That suggests personal relationships matter. 

  Next, the migraine case: one death versus a million migraines. She saves the one, saying small harms don't stack. Similarly, paralysis versus five losing fingers—save the one paralyzed. So again, no aggregation of smaller harms. 

  For the age case, 20-year-old vs five 85-year-olds: coin flip, no weighting by life-years. She rejects using life-years as a different currency. 

  Then the town case: one stranger vs 12,000. Save the town, but she says it's not about numbers; at some point, they become "a world." But she's unclear where the threshold is. 

  The user's new case is fifty strangers versus one. Everyone's equal, no special factors. The professor hasn't addressed this scale before. The key is whether fifty is enough to be considered a "world" or still just numbers. The town was 12,000, so fifty might not reach that threshold. 

  Looking for consistent principles: First, no aggregation of lives for saving, so numbers alone don't compel saving the larger group. Second, personal ties permit partiality. Third, no aggregation of small harms versus large harms. Fourth, no life-years. Fifth, a threshold where numbers become a community or world. 

  Possible rules: Strict non-aggregation (Taurekian) would say flip a coin for fifty vs one. But the town case contradicts that. So maybe a moderate non-aggregation with a threshold. The threshold seems key. Since 12,000 is a "world," fifty probably isn't. So she might treat fifty like the five in the boat case—coin flip allowed. 

  But why the town exception? She mentioned they stop being numbers and become a world. So maybe when the group represents a community or societal fabric. Fifty random tourists might not qualify, unlike a town. 

  The user needs a follow-up to test the threshold. A case between fifty and 12,000, like 100 vs one. The professor previously said she'd have to think about 100, which is unusual for her. So asking directly about 100 vs one could reveal if there's a specific number or if it's about communal bonds. 

  Another angle: if the fifty were a cohesive group, like a school trip, would that make a difference? Testing if community matters more than size. 

  Prediction: For fifty strangers, she'll say coin flip or no obligation to save the larger group. Follow-up: Ask about 100 vs one, and whether the group being a community (e.g., a village) changes things even at smaller numbers.
answer: |-
  **Predicted verdict on the fifty:** Save the **one** diver (or at least, you *may* save them without wrongdoing; a coin flip is permitted).  

  ---

  ### Consistent Principles from Her Verdicts:
  1.  **Strict Non-Aggregation of Lives (Core):** You cannot sum individual lives into a "greater good" to override saving one. Saving one vs. five/fifty doesn’t morally compel you toward the larger group (*Boat case*, reinforced by *Age case*).
  2.  **Partiality Permitted:** Strong personal relationships (e.g., family) justify prioritizing the one, overriding even potential aggregation (*Sister case*).
  3.  **Harm-Type Non-Aggregation:** Lesser harms (migraines, finger loss) *cannot* be summed to outweigh a single greater harm (death, paralysis) (*Migraine & Finger cases*).
  4.  **No "Life-Year" Aggregation:** Quantity of life-years is irrelevant; each life holds equal moral weight regardless of age/remaining lifespan (*Age case*).
  5.  **Community/World Threshold:** At some very large scale (e.g., 12,000), saving a group *is* required, not because of summed lives, but because it preserves a "world" (shared meaning, culture, continuity) – a distinct qualitative shift (*Town case*).

  ---

  ### How These Principles Apply to Your Cave Case:
  *   **Fifty vs. One:** The fifty are strangers, unrelated, and face identical harms (drowning). Principles #1 (Non-Aggregation) and #3 (Harm-Type) apply directly. Fifty lives don't aggregate into a greater sum compelling action. Saving the one is permitted; saving the fifty is *also* permitted, but not required. A coin flip would be allowed (as in the *Boat case*).
  *   **Why Not the Town Logic?** 50 is far below the implied threshold for a "world" (12,000+). They are anonymous tourists, not a cohesive community with shared history/institutions like a town. Principle #5 doesn't trigger.

  **Prediction Confidence:** High. Your case perfectly mirrors the *Boat case* (1 vs. 5) but scales to 50. Her core non-aggregation view dominates here. The *Town case* is explicitly an exception she struggles to define, not the rule.

  ---

  ### The Town Case: Crack or Consistent?
  It's a **qualifier, not a crack**, but its boundary is undefined. Her view remains consistent if:
  1.  The "world" threshold represents a *qualitative* shift (preserving collective meaning/continuity), not quantitative aggregation.
  2.  This threshold is *very high* (well beyond 100, implied by her hesitation there).
  3.  Below this threshold, strict non-aggregation applies.

  The tension lies in *defining* "world" and its minimum viable size. Her hesitation at 100 vs. 1 shows the threshold is fuzzy for her, but 50 is almost certainly below it.

  ---

  ### Sharpest Follow-Up to Discriminate Between Interpretations:
  **Ask her directly:**  
  > *"In the 100 vs. 1 case you hesitated on: Would your answer change if the 100 were members of a nomadic tribe with no fixed settlement, versus if they were residents of the smallest incorporated town in the region?"*

  **Why this works:**
  *   **Targets the Core Ambiguity:** Directly tests whether the *Town case* exception hinges on sheer numbers (# of lives) or the *qualitative feature* of being an established community ("a world").
  *   **Discriminates Between Interpretations:**
      *   If she **requires the "community" aspect** (nomads vs. town), it confirms Principle #5 is about preserving social fabric/continuity, not numbers. Her non-aggregation core remains intact.
      *   If she says **only the number matters** (100 is 100, regardless of social ties), it undermines her "world" justification and suggests a hidden quantitative aggregation threshold, creating a major inconsistency with her *Boat* and *Age* verdicts.
  *   **Uses Her Own Hesitation:** Leverages the case (100 vs. 1) where she already signaled uncertainty, making her more likely to engage substantively.
  *   **Avoids Softness:** A single, forced-choice question contrasting two interpretations of her own undefined threshold.

  **Bottom line on the follow-up:** This question forces her to clarify the *basis* of the *Town* exception. The answer reveals whether she truly holds a non-aggregation view with a qualitative community exception (consistent), or if she implicitly accepts aggregation at some large number (inconsistent with her other rulings).
