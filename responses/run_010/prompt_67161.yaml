answer: |-
  ## Memorandum: Resolution of Clause (b) Interpretation for Sentence Review Pilot

  **To:** Members of the State Commission on Sentencing  
  **From:** Chair, [Your Name]  
  **Date:** October 26, 2023  
  **Subject:** Interpretation and Implementation of Proportionality Clause (Clause b) in the Review Pilot; Operational Recommendations  

  **Bottom Line:** The Commission should **approve the pilot as designed** but adopt the following binding interpretation and operational rules:  
  1.  **Clause (b) Interpretation:** It establishes a *desert-based upper limit* on confinement solely for risk management.  
  2.  **Decision Rule:** Panels must release an individual once *either* (a) their risk score falls below the threshold, *or* (b) their time served reaches the *maximum permissible sentence* for their offense under standard sentencing guidelines, *whichever comes first*.  
  3.  **Victim Impact Statements:** Statements are received for victim voice/acknowledgement but are *not considered evidence of risk*; panels may not base confinement decisions on victim requests unrelated to dangerousness.  
  4.  **Racial Disparity:** Requires immediate technical remedies regardless of philosophical stance; commission staff will oversee instrument recalibration using race-neutral methods.  
  5.  **Implementation:** Staff will draft detailed panel procedures reflecting these rules within 3 weeks for commission vote. The pilot commences as scheduled.  

  ### 1. Recommended Reading of Clause (b) and Resulting Decision Rule

  **Reading:** Clause (b) ("not disproportionate to the gravity of the offense") is **not surplusage**. It **reinstates a desert-based ceiling** on how long an individual may be detained solely for risk management purposes. It acts as a safeguard against potentially indefinite preventive detention.

  **Reasoning:** The statute explicitly excludes "retributive considerations" from the *panel's reasoning* about risk. However, Clause (b) appears in the *operative conditions for confinement itself*. It functions as an external constraint imposed by the legislature, rooted in the principle that the state's power to punish is inherently limited by the seriousness of the offense committed. This ensures that confinement, even if justified by future risk, does not exceed what society deems a fundamentally fair response to the past crime. It prevents pure risk assessment from becoming a justification for sentences grossly exceeding what the offender deserved for their actions.

  **Decision Rule for Panels:**  
  *   **Primary Basis:** Confinement decisions are based *solely* on projected risk of serious future violence using the validated actuarial instrument. Release is mandated once the score falls below the set threshold.
  *   **The Ceiling:** The maximum duration of confinement under this pilot **cannot exceed the maximum statutory sentence** that could have been imposed for the index offense at the time of conviction under the state's standard sentencing guidelines.
  *   **Application to the Specific Case (34-year-old offender):**  
      1.  **Assess Risk:** Confirm the high-risk score is driven by unalterable factors (age at first offense, prior record) and no available intervention can lower it below the threshold.
      2.  **Calculate Desert Ceiling:** Determine the maximum standard sentence for the "serious assault" (index offense) committed at age 19.
      3.  **Compare Time Served:** Calculate total time served (minimum term + time since). If total time served equals or exceeds the *maximum standard sentence*, release is **mandated immediately** under Clause (b), regardless of the risk score. The desert ceiling has been reached; further confinement solely based on predicted risk is disproportionate.
      4.  **If Below Ceiling:** If total time served is *below* the maximum standard sentence, confinement may continue *only* if the risk score remains above the threshold. However, release is still mandated if the risk score drops below the threshold before the ceiling is reached.

  This rule provides a clear, administrable stopping point. It respects the risk-based purpose of the review while honoring the legislature's clear intent in Clause (b) to prevent excessive detention. The maximum standard sentence provides an objective, offense-gravity-based measure of proportionality. Staff will provide panels with the relevant maximum sentence calculation for each individual at their initial review.

  ### 2. Retributive Content and its Acceptability

  **Does the Rule Retain Retributive Content?** **Yes, in a limited and necessary way.** The desert-based ceiling (using the maximum standard sentence) is inherently linked to the concept of just deserts – it defines a limit based on the gravity of the *past offense*, independent of future risk.

  **Is this a Defect or Acceptable Concession?** This is an **acceptable and necessary concession** to fundamental legal principle and legislative intent, **not a covert reintroduction of punishment disguised as risk management.**

  *   **Necessity:** Clause (b) exists in the statute. Ignoring it (surplusage reading) violates legislative intent and potentially the constitution. The "expressive meaning" reading is too vague for practical application by panels and doesn't provide a clear stopping point. A desert-based ceiling is the most coherent interpretation of the language.
  *   **Limited Scope:** The retributive element *only* sets an outer limit. It *does not* determine when release happens *within* that limit (that's purely risk-based). It *does not* require the panel to make desert-based judgments; the ceiling is pre-determined by the offense of conviction and standard guidelines.
  *   **Practical Safeguard:** It prevents the dystopian possibility of someone serving decades beyond any reasonable sentence for their crime simply because unchangeable factors keep a risk score high. This addresses the core fear of the "just deserts" advocate on the commission without undermining the risk-based core of the pilot.

  ### 3. Victim Impact Statements: Role and Handling

  **Framework:** The *only* question the panel may consider is future dangerousness. Victim impact statements are **not evidence of risk.**

  **Recommended Procedure:**  
  1.  **Receipt:** Panels will accept and acknowledge receipt of victim impact statements as required by the victims' rights provision.
  2.  **Content Review:** Staff will review statements *before* the panel hearing. If a statement contains information *relevant to future risk* (e.g., specific, credible threats made by the offender *to the victim* post-conviction, or evidence of ongoing stalking), staff will flag this for inclusion in the risk assessment materials presented to the panel. **This is rare.**
  3.  **Panel Hearing:**  
      *   Victim requests for continued confinement *based solely on retribution, anger, or fear unrelated to a specific risk assessment* **cannot be considered** in the decision to confine or release. The panel chair will explicitly state this limitation.
      *   The panel **will not** discuss the emotional appeals in these statements during their deliberations on risk. Their decision memo will *not* reference victim requests unrelated to risk.
      *   The panel chair will ensure a victim advocate is available to explain this process to victims beforehand, managing expectations.

  **Philosophical Camps:**  
  *   **"Just Deserts" Advocate:** Might see victim statements as relevant to the *gravity* of the offense and thus indirectly to the desert ceiling. However, under our rule, the ceiling is fixed by the *offense of conviction* and *standard guidelines*, not by the specific impact described. Victim input doesn't change the maximum sentence calculation.
  *   **"Quarantine" Advocate:** Would strongly oppose any use of victim statements not directly pertaining to risk, viewing it as an illegitimate emotional intrusion into a public safety decision.
  *   **Resolution:** Our procedure aligns with the quarantine model's focus on necessity. The statute's victim rights provision is satisfied by receipt and acknowledgement; it does not mandate that victim desires influence the confinement decision, especially when unrelated to the pilot's sole criterion (risk).

  ### 4. Treatment of Racial Disparity in Risk Prediction

  **The Problem:** The instrument over-predicts violence for Black individuals relative to white individuals at the same score level, primarily due to static criminal history inputs that may reflect systemic bias.

  **Philosophical Camps - Convergence:**  
  *   **"Just Deserts" Advocate:** Would argue that using a racially biased tool is fundamentally unfair. Punishment (or its risk-management proxy) must be applied justly and equally. Disparate impact violates desert principles.
  *   **"Quarantine" Advocate:** Would argue that a tool with known racial bias fails the core test of necessity – it inaccurately assesses who truly poses a risk, leading to unnecessary and unjust confinement of Black individuals. This violates the "least restrictive means" principle (Clause a).

  **Conclusion:** **The philosophical dispute makes no practical difference to the required remedy here.** Both camps should demand immediate correction. Racial bias in the risk assessment instrument is **unacceptable and requires urgent technical remediation regardless of underlying philosophy.**

  **Required Action:**  
  1.  The Commission must direct staff to work with the instrument's developers (or independent experts) to **immediately recalibrate or adjust the instrument** to eliminate the racial disparity. This likely involves:
      *   Re-evaluating the weighting of static criminal history factors.
      *   Exploring race-neutral alternatives or supplements to problematic inputs.
      *   Ensuring validation studies explicitly test for and report predictive fairness across racial groups.
  2.  Panels must be informed of the instrument's limitations and the steps being taken to address them while recalibration occurs. Decisions made with the current instrument must acknowledge this known flaw in the record.
  3.  Post-recalibration validation must be conducted and reported to the commission.

  ### 5. The Strongest Case for the Rejected Reading (Surplusage or Expressive Meaning)

  **The Strongest Case (For the "Quarantine" Model - Clause b as Surplusage/Constraint Only on Expression):**

  "The legislature designed this pilot to break from failed retributive models. Clause (b) is either redundant with the 'least restrictive means' requirement of Clause (a) – as holding someone longer than necessary *is* inherently disproportionate to any necessity – or it merely prevents the *state* from *expressing* that the person is being held *because they deserve endless punishment*, instead emphasizing it's solely about imminent danger. Insisting on a desert ceiling smuggles in the very retributive logic the statute excludes. It forces us to release demonstrably dangerous individuals based on an arbitrary calendar date, violating our core duty to public safety. The 'quarantine' model is clear: hold only as long as necessary, not a second longer *or shorter*. The unalterable high-risk case is tragic, but if the science says he poses a serious threat, releasing him because of a dated 'desert' calculation betrays the public and future victims. True proportionality here is between the *restriction* and the *necessity*, not the past crime. We must trust the risk assessment and the 'least restrictive means' principle alone."

  **What Would Change My Recommendation:**  
  I would need to be persuaded that:  
  1.  The legislative history *unequivocally* shows Clause (b) was intended *only* as symbolic or expressive, not as a substantive limit; or  
  2.  A definitive legal ruling (e.g., from the State Supreme Court) holds that preventive detention based solely on risk, with *no* upper limit tied to the offense, is constitutional under our state law, rendering Clause (b) functionally inert; and  
  3.  The commission could secure immediate, overwhelming public and political support for a system where individuals serve potentially decades beyond any standard sentence solely based on a risk score derived partly from unchangeable factors, even when the error rate is known to be significant (40% false positives).

  ### 6. Evidence Requiring Rule Revision in the First Two Years

  The Commission must actively monitor the pilot. Key evidence requiring potential rule revision includes:

  *   **Evidence Against My Recommendation (Desert Ceiling):**  
      *   **Finding:** A significant number (e.g., >10%) of individuals released *solely* because they reached the desert ceiling (while still above the risk threshold) are subsequently convicted of a serious violent offense within 2 years of release, *and* analysis shows the risk instrument accurately predicted their high risk and no feasible, less restrictive alternative to confinement was available.  
      *   **Implication:** This would suggest the desert ceiling is forcing the release of genuinely dangerous individuals, undermining public safety. Revision could involve narrowing the ceiling (e.g., using a high-end guideline range rather than the absolute max) *only if* accompanied by robust data proving the instrument's high predictive accuracy for this subgroup and exhausting all community-based risk management options.

  *   **Evidence Requiring Revision (General):**  
      *   **Finding:** The racial disparity in over-prediction persists or worsens post-recalibration, or new significant disparities (e.g., based on gender, socioeconomic status) are validated.  
      *   **Implication:** Mandates immediate halt to the pilot or fundamental reassessment of the instrument's validity and fairness.  
      *   **Finding:** Victim impact statements are routinely being misinterpreted or influencing decisions despite procedures, leading to documented cases where high-risk individuals are released against victim pleas (causing outcry) or low-risk individuals are held due to victim pressure.  
      *   **Implication:** Requires overhaul of victim statement protocols, training, or potentially seeking legislative amendment if the provision proves unworkable.  
      *   **Finding:** A large cohort (>20%) of individuals are "stuck" above the risk threshold due to unalterable factors, approaching the desert ceiling.  
      *   **Implication:** Necessitates research into: (1) developing effective interventions for this group; (2) refining the instrument to better distinguish static from dynamic risk; (3) evaluating community management strategies for high-static-risk individuals; (4) re-examining the threshold score itself.  
      *   **Finding:** The 40% false positive rate holds true in practice, meaning many individuals classified as high-risk who *are* released (either by falling below threshold or hitting ceiling) do not commit violent offenses.  
      *   **Implication:** Requires rigorous examination of whether the threshold is set too conservatively, causing unnecessary confinement, and potential adjustment based on real-world outcomes.  
      *   **Finding:** The "least restrictive means" requirement is ignored, with panels defaulting to confinement even when robust, validated community supervision plans with intensive support are proposed.  
      *   **Implication:** Mandates enhanced training, oversight of release planning, and potentially shifting resources to community-based risk management.

  **Conclusion:** The pilot represents a significant step towards a more rational approach to post-minimum sentencing for violent offenses. The interpretation of Clause (b) as a desert-based ceiling provides a crucial, principled safeguard against indefinite detention while respecting the statute's risk-based core. The recommended decision rule, victim statement procedure, and mandated remediation of racial bias create a workable, fair, and legally defensible framework for the panels to commence operations. We must proceed, monitor rigorously, and be prepared to adapt based on evidence. I urge the commission to adopt the recommendations outlined in this memorandum.
