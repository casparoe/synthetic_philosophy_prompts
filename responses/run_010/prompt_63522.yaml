  The user wants explanations, not citations, but needs proper terminology to research later. They also want to know the status of each question: consensus, ongoing disputes, or if their framing is flawed. The challenge is to address each knot without oversimplifying, respecting their expertise while clarifying deep conceptual issues.

  Starting with the first knot: The low-entropy initial condition. It's not a law but a contingent boundary condition. The circularity they sense is real and relates to the "past hypothesis." David Albert frames it as a fundamental postulate. The inference direction: our local records are reliable because they're generated by the past low-entropy state via lawful dynamics. Without this, typical microstates would show "fake" pasts. The global claim licenses local probabilities because subsystems inherit statistical properties from the whole in equilibrium contexts. But there might be unresolved issues here.

  For the second knot: Gravity changes everything. In a self-gravitating system, equilibrium isn't uniform but clumpy. For the universe, the smooth early state is actually low entropy because gravity hasn't had time to cluster matter. High entropy states involve black holes, which dominate entropy today. The intuition flips because gravity is long-range and attractive, unlike gas molecules in a box.

