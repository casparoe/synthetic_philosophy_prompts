  I keep the minutes for a twelve-member rules club that meets on alternate Thursdays to play a game in the Nomic tradition — a game in which altering the rules is itself a move, so that the only permanent content is the procedure for changing it. At the start of term the members unanimously adopted the following rulebook, which I transcribe exactly as it stood before last night's meeting. Rule 1 (immutable): every player must comply with every rule then in effect, in the form in which it is then in effect. Rule 2 (immutable): Rules 1 through 5 are immutable and may not be amended, repealed, or superseded; all other rules are mutable. Rule 3 (immutable): any mutable rule may be amended, repealed, or replaced, and new mutable rules may be added, by a vote of at least two-thirds of the players present and voting; an adopted change takes effect at the close of the round in which it was voted on. Rule 4 (immutable): no change operates retroactively; each applies only to events occurring after it takes effect. Rule 5 (immutable): no change may be adopted that contradicts the rulebook as it stands at the moment of the vote. Rule 6 (mutable): a player scores one point for each of their own proposals that is adopted, and loses one point for each round in which none of theirs is adopted. For context, Dara was leading on points under Rule 6 at the time of the vote, and Noor was second; all twelve members were present and voting.

  Here is the dispute, in the order it occurred. (1) Dara proposed an amendment to Rule 6 that left the scoring sentence untouched and appended one further sentence: "This rule may not be amended or repealed." It carried 8–4. She argued that Rule 5 asks only whether a proposal contradicts the rulebook at the moment of the vote, and at that moment nothing in force forbade entrenching a mutable rule, so the entrenchment was cleanly adopted. (2) Noor then proposed to strike the appended sentence and change the scoring, on the ground that the entrenchment was a nullity from the outset: Rule 3 confers a general power over every mutable rule, Rule 6 is mutable by Rule 2's numbering, and a mutable rule cannot switch off a power that an immutable rule confers — a tenant cannot amend a lease by writing on the wall. On her view the appended sentence is at most a declaration of intent, and her proposal is properly before the club. (3) Dara replied that this proves too much: if a mutable rule cannot limit the amendment power, then no rule can limit anything, since a limitation is itself just a rule, and Rule 3 contains no words making its grant indefeasible. What the club adopted under Rule 3 was a particular exception to Rule 3's general grant, and Rule 5 was satisfied when it was adopted, so Noor is invoking Rule 5 against the product of Rule 5. She added that the only workable reading of Rule 5 is procedural — it asks whether the act of adoption is authorized, not whether the resulting text is free of tension, since every ordinary amendment "contradicts" the sentence it replaces, and a reading that counted that would have frozen the game on the first night. (4) Noor said that reading is available to Dara only because it suits her, and that Dara should pick a reading and live with it. If Rule 5 asks merely whether the act is authorized, then the club may adopt a proposal reading "no change shall hereafter be adopted," because nothing presently in force forbids it; that proposal would be valid, would bar its own repeal, and would extinguish the club's rule-making capacity while leaving the club sitting at the table. On the other reading — that what must be free of contradiction is the rulebook as it will stand — the entrenchment was never adoptable at all, since it flatly contradicts Rule 3, which says Rule 6 may be amended. Either way, she concluded, the appended sentence should be declared void from the beginning. (5) Dara said she accepts the consequence in (4) without embarrassment: a group that cannot bind itself has no rulebook but a series of coincidences, and if twelve people choose to seal their rules shut, their later regret does not make the sealing invalid, since regret is not a lack of competence. She also noted that Noor's remedy is self-consuming — a new rule reading "no proposal may be adopted that would impair the amendment power" would itself impair the amendment power, by barring its own repeal — so Noor needs an unwritten doctrine of implied limits with no textual home, and Rule 4 forbids the backward reach involved in treating the appended sentence as though it had never existed. (6) Priya, who had voted with Dara in (1), proposed a compromise: keep the appended sentence but add that it may be removed by a three-fourths vote, on the theory that turning an absolute bar into a graduated one lets the club settle the matter by rule rather than by argument. Both Dara and Noor objected that Priya's proposal could not even be put to a vote — on Dara's view because it amends an unamendable rule, on Noor's because the entrenchment is already void and the compromise is unnecessary. I declined to rule as chair, and the round closed with Rule 6 in limbo and two competing score sheets in circulation.

  I would like a move-by-move adjudication rather than a survey of the issues. Please rate each of the six moves — and, where a move contains two or more separable claims, rate those claims individually — on a scale from clearly mistaken to clearly right, with a sentence or two of justification for each rating. Then answer the following. (a) Who is right on the central question, whether the appended sentence is in force, and does the answer turn entirely on which reading of Rule 5 the club adopts, or is one reading independently better supported by Rules 1 through 4? (b) What is the strongest point each side makes that the other never answers? (c) What are both of them missing — in particular, is Rule 3 best understood as conferring a power that the club may use to divest itself of that power, or as describing a standing procedure that no single rule can switch off, and does drawing that distinction actually decide the case or merely restate it? (d) Is the rulebook as transcribed inconsistent, merely indeterminate, or is there a third diagnosis — that it is perfectly consistent but determinately generates a question it cannot answer? (e) State the smallest textual change to Rules 1 through 5 that would have prevented last night's dispute, and say honestly whether your change merely relocates the problem one level up; also say whether the club could adopt that change from inside its own rulebook given Rule 2, or whether it would have to step outside the game and reconstitute it. If the underlying difficulty has a standard name, one clause identifying it is welcome, but I want the reasoning worked through on these texts as given, not references or a summary of the literature.
reasoning: |-
  I need to adjudicate this Nomic dispute move by move. The club has rules, and the central issue is whether Dara's amendment to Rule 6, which added "This rule may not be amended or repealed," is valid. Noor argues it's void because it contradicts Rule 3, which allows amendment of mutable rules. Dara says it was properly adopted under Rule 3 and Rule 5 only checks for contradiction at the time of vote, not afterward.

  First, I'll rate each of the six moves on a scale from clearly mistaken to clearly right, with justifications.

  **Move (1): Dara proposed the amendment to Rule 6 adding the entrenchment clause. It carried 8–4.**

  - Rating: **Clearly right** for the proposal and adoption under the rules as written at the time.
    
    Justification: Rule 3 allows amending mutable rules by a two-thirds vote. Rule 6 is mutable per Rule 2. Rule 5 says no change may contradict the rulebook at the moment of the vote. At the moment of vote, nothing forbade adding such a sentence, so it doesn't contradict existing rules. Thus, the adoption was clean. Dara's argument here is solid based on the text.

  **Move (2): Noor proposed to strike the appended sentence and change the scoring, arguing the entrenchment is a nullity.**

  - Rating: **Clearly mistaken** for the claim that the entrenchment is a nullity from the outset.
    
    Justification: Noor says Rule 3 confers a general power that cannot be switched off by a mutable rule. But Rule 3 doesn't say its power is indefeasible; it just describes how changes can be made. Rule 5 only prohibits contradictions at adoption time, which wasn't present here. The lease analogy is flawed because rules are not like property; they can be self-amended. The entrenchment was adopted properly, so it should be in force unless invalidated by some rule, which isn't specified.

  **Move (3): Dara replied to Noor's argument.**

  - Subparts:
    - Claim that Noor's argument proves too much: if no mutable rule can limit amendment, then no rule can limit anything. Rating: **Clearly right**.
      
      Justification: Dara points out that Rule 3 doesn't have language making it immune to amendment; it can be limited by other rules adopted under it. This is consistent with how Nomic works—rules can change, including constraints on changes.
    
    - Claim that Rule 5 is procedural, not about textual tension: Rating: **Clearly right**.
      
      Justification: Dara correctly notes that if Rule 5 were about textual contradiction, every amendment would contradict the old text, freezing the game. Rule 5 must mean contradiction in terms of authority or permissibility, not textual conflict. At adoption, the act was authorized.

  **Move (4): Noor responded, presenting a dilemma for Dara on Rule 5 interpretation.**

  - Subparts:
    - If Rule 5 is about authorization only, then a proposal to bar all future changes would be valid and self-entrenching. Rating: **Plausible, but not clearly right or mistaken**; it's a logical extension.
      
      Justification: Noor points out a potential consequence: if only authorization matters, the club could adopt a rule ending all amendments, which might be undesirable but not necessarily invalid under the rules. This is a valid slippery slope argument.
    
    - If Rule 5 is about the resulting rulebook contradiction, then Dara's amendment contradicts Rule 3. Rating: **Mistaken**.
      
      Justification: Rule 5 says "contradicts the rulebook as it stands at the moment of the vote," not the future rulebook. At the moment of vote, Rule 3 said mutable rules can be amended, but it didn't say they must always be amendable. So adding a restriction doesn't contradict existing rules; it changes them.
    
    - Conclusion that the appended sentence is void. Rating: **Clearly mistaken**.
      
      Justification: Based on the above, Noor's reading of Rule 5 for future contradiction is incorrect, so her conclusion doesn't hold.

  **Move (5): Dara accepted the consequence and argued against Noor's remedy.**

  - Subparts:
    - Acceptance that the club could bind itself: Rating: **Clearly right**.
      
      Justification: Dara is consistent; if the rules allow self-entrenchment, it's valid. Rule 4 prevents retroactivity, so the entrenchment can't be undone by declaring it void ab initio.
    
    - Point that Noor's remedy is self-consuming: Rating: **Clearly right**.
      
      Justification: If Noor wants a rule to protect amendment power, that rule itself would impair the power by being unamendable or similar, leading to inconsistency. Rule 4 also bars retroactive invalidation.
    
    - Note on implied limits: Rating: **Clearly right**.
      
      Justification: The rules don't have unwritten doctrines; everything must be based on the text.

  **Move (6): Priya proposed a compromise to add a three-fourths override.**

  - Rating: **Mistaken** for the proposal itself in context.
    
    Justification: Priya's proposal assumes the entrenchment is valid but amendable, which both sides dispute. Dara says Rule 6 can't be amended, so the proposal can't be voted on. Noor says the entrenchment is void, so no need for compromise. As chair declined to rule, but under the rules, if entrenchment is valid, Priya's proposal violates it; if not, it's unnecessary. So proposing it might be pointless, but not against rules per se—just likely invalid if entrenchment holds.

  Now, for the specific questions:

  **(a) Who is right on the central question, whether the appended sentence is in force, and does the answer turn entirely on which reading of Rule 5 the club adopts, or is one reading independently better supported by Rules 1 through 4?**

  - Dara is right; the appended sentence should be in force. The answer turns on Rule 5 interpretation, but the better reading is that Rule 5 concerns contradiction at the time of adoption, not future consistency. Rules 1-4 support this: Rule 3 allows changes to take effect later, and Rule 4 says changes aren't retroactive, implying they are prospective. Rule 5's "as it stands at the moment of the vote" clearly points to the current rulebook, not the future one. Noor's reading would make amending impossible, which contradicts Rule 3's purpose.

  **(b) What is the strongest point each side makes that the other never answers?**

  - Dara's strongest point: That Rule 3 doesn't say its power is indefeasible, so rules adopted under it can limit future amendments. Noor never addresses why Rule 3 must be read as creating an immutable power when it's not labeled as such in Rule 2.

  - Noor's strongest point: If Rule 5 is only about authorization, the club could adopt a rule ending all changes, paralyzing itself. Dara accepts this but doesn't explain why it's not a problem, except that the rules allow it. However, Dara does address it by saying regret doesn't invalidate competence.

  **(c) What are both of them missing — in particular, is Rule 3 best understood as conferring a power that the club may use to divest itself of that power, or as describing a standing procedure that no single rule can switch off, and does drawing that distinction actually decide the case or merely restate it?**

  - Both miss that Rule 3 might be interpreted as a procedural rule that can be modified by its own terms. The distinction: Rule 3 confers a power that includes the power to limit itself. Drawing this distinction decides the case; if Rule 3 allows self-limitation, then Dara is right. Since Rule 3 says "any mutable rule may be amended... by a vote," and the entrenchment makes Rule 6 immutable in effect, but Rule 6 was mutable when changed. The entrenchment is part of Rule 6, so it's valid until amended, which is now harder. But the power to amend is still there; it's just that Rule 6 can't be amended easily. Rule 3 doesn't say all mutable rules must remain mutable; it allows changing them, including their mutability status indirectly.

  **(d) Is the rulebook as transcribed inconsistent, merely indeterminate, or is there a third diagnosis — that it is perfectly consistent but determinately generates a question it cannot answer?**

  - The rulebook is perfectly consistent but indeterminate on whether a rule can self-entrench to prevent future amendments. Rule 5 is the key, and its phrasing allows both interpretations, leading to a gap. It generates a question it cannot answer internally because Rule 5 doesn't specify whether "contradicts" means logical contradiction in the future rulebook or conflict with current authorization.

  **(e) State the smallest textual change to Rules 1 through 5 that would have prevented last night's dispute, and say honestly whether your change merely relocates the problem one level up; also say whether the club could adopt that change from inside its own rulebook given Rule 2, or whether it would have to step outside the game and reconstitute it.**

  - Smallest change: Amend Rule 5 to clarify: "no change may be adopted that contradicts the rulebook as it stands at the moment of the vote in a way that would make the rulebook self-contradictory after adoption or that would remove the power to amend rules."

    But this might relocate the problem: "self-contradictory" or "remove the power" could be vague. Alternatively, add to Rule 3: "This power to amend may not be limited by any mutable rule."

    Whether the club could adopt it: Yes, since Rules 1-5 are immutable, they can't be changed. Rule 2 says Rules 1-5 are immutable, so no change can be made to them. Therefore, the club cannot adopt such a change from inside; they would have to step outside the game or use a meta-rule, but Rule 1-5 are fixed.

    Given that, the smallest change isn't adoptable internally. To prevent the dispute, they'd need an initial rule that addresses entrenchment.

    Since Rules 1-5 are immutable, no textual change is possible now. But for prevention, if the rulebook had included in Rule 3: "No rule may make itself or any other rule immutable," but that wasn't there.

    So honestly, any change to immutable rules isn't adoptable now. The problem is that immutable rules don't cover this case, leading to indeterminacy.

  Standard name: This is a version of the "self-amendment" or "entrenchment" paradox in Nomic or constitutional law.
answer: |-
  Below is a move-by-move adjudication of the six steps in the dispute, rated on a scale from **clearly mistaken** to **clearly right**, with brief justifications. I address separable claims within moves individually. Following that, I answer questions (a) through (e) based on the rulebook as transcribed.

  ### Move-by-Move Adjudication

  1. **Dara proposed an amendment to Rule 6, appending "This rule may not be amended or repealed." It carried 8–4.**
     - **Rating: Clearly right.**  
       Justification: Rule 3 permits amending any mutable rule (like Rule 6) via a two-thirds vote, and Rule 5 only forbids changes that contradict the rulebook "as it stands at the moment of the vote." At the time of the vote, no rule prohibited entrenching a mutable rule, so the amendment was procedurally valid under Rules 2–5. Rule 4 ensures the change applies prospectively, which is consistent.

  2. **Noor proposed to strike the appended sentence and change the scoring, arguing the entrenchment was a nullity from the outset.**
     - **Rating: Clearly mistaken (for the nullity claim).**  
       Justification: Noor's claim that Rule 3's amendment power cannot be "switched off" by a mutable rule has no basis in the text. Rule 3 grants a general power but does not state that it is indefeasible or immune to limitation by rules adopted under it. Rule 5 focuses on contradiction at adoption, not inherent limits on power delegation. The lease analogy is inapt; rules in Nomic are not static contracts but can dynamically modify their own constraints.

  3. **Dara replied that Noor's argument proves too much and that Rule 5 is procedural.**
     - Claim 1: If no mutable rule can limit amendment, then no rule can limit anything, as limitations are rules.  
       **Rating: Clearly right.**  
       Justification: Rule 3 contains no language making its grant indefeasible, so mutable rules can impose limits (e.g., requiring higher vote thresholds). Dara correctly notes that accepting Noor's view would invalidate any constraint, undermining the game's purpose.
     - Claim 2: Rule 5 is procedural, asking only if the act of adoption is authorized, not if the resulting text has tension.  
       **Rating: Clearly right.**  
       Justification: Reading Rule 5 as prohibiting textual contradictions (like an amendment replacing a sentence) would paralyze the game, as all amendments "contradict" the prior text. Rule 5 must instead address whether the proposal violates existing rules at vote time, which it did not.

  4. **Noor presented a dilemma on Rule 5's interpretation and concluded the entrenchment is void.**
     - Claim 1: If Rule 5 is about authorization only, the club could adopt a proposal barring all future changes.  
       **Rating: Plausible (but not clearly right or mistaken).**  
       Justification: This is a logical extension of Dara's position, highlighting a potential extreme outcome. However, it does not prove invalidity—it only shows that the rules may allow self-destruction, which is not forbidden.
     - Claim 2: If Rule 5 is about the resulting rulebook, the entrenchment contradicts Rule 3.  
       **Rating: Mistaken.**  
       Justification: Rule 5 explicitly references "the rulebook as it stands at the moment of the vote," not the future state. At adoption, Rule 3 allowed amending Rule 6; the entrenchment does not contradict that, as Rule 3 says mutable rules "may" be amended, not that they must remain amendable.
     - Claim 3: The appended sentence is void.  
       **Rating: Clearly mistaken.**  
       Justification: Noor's conclusion relies on an incorrect reading of Rule 5 and ignores that the amendment was validly adopted under Rule 3. Rule 4 bars retroactive invalidation.

  5. **Dara accepted that self-binding is possible and criticized Noor's remedy.**
     - Claim 1: A group that cannot bind itself has no rulebook, and regret does not invalidate competence.  
       **Rating: Clearly right.**  
       Justification: Rules 3 and 5 allow the club to adopt self-binding rules if procedurally sound. Rule 1 requires compliance, so if the entrenchment was valid, it must be followed.
     - Claim 2: Noor's remedy (e.g., a rule protecting amendment power) is self-consuming and requires an unwritten doctrine.  
       **Rating: Clearly right.**  
       Justification: Any rule limiting amendments would itself be a mutable rule that could impair the power it protects, creating circularity. Rule 4 explicitly forbids retroactive application, so declaring the entrenchment void ab initio is impermissible. The rules have no implied limits.

  6. **Priya proposed a compromise: keep the entrenchment but add a three-fourths override.**
     - **Rating: Mistaken (for the proposal in this context).**  
       Justification: If the entrenchment is valid (per Dara), Priya's proposal amends an unamendable rule, violating Rule 6 as amended. If the entrenchment is void (per Noor), the compromise is unnecessary. Rule 3 requires proposals to be adoptable, but this one cannot be coherently voted on under either view, making it procedurally flawed from the start.

  ### Answers to Specific Questions

  **(a) Who is right on the central question, whether the appended sentence is in force, and does the answer turn entirely on which reading of Rule 5 the club adopts, or is one reading independently better supported by Rules 1 through 4?**  
  Dara is right: the appended sentence is in force. The answer depends primarily on the reading of Rule 5, but the "authorization-only" reading is independently better supported by Rules 1–4. Rule 5's text—"contradicts the rulebook as it stands at the moment of the vote"—unambiguously focuses on the rulebook at adoption time, not future consistency. Rules 3 and 4 reinforce this: Rule 3 authorizes changes that take effect later, and Rule 4 clarifies that changes apply prospectively, implying that validity is judged at adoption. Noor's "resulting rulebook" reading would conflict with Rule 3's allowance for amendments to alter the rulebook's content, including its own constraints, and Rule 4's anti-retroactivity principle. Rules 1–4 collectively support that the amendment was valid when adopted and is now binding.

  **(b) What is the strongest point each side makes that the other never answers?**  
  - **Dara's strongest unanswered point:** That Rule 3 does not state its power is indefeasible, so mutable rules adopted under it can limit future amendments (e.g., by entrenchment). Noor never explains why Rule 3 must be treated as creating an immutable power when it lacks such language and is not listed as immutable in Rule 2.  
  - **Noor's strongest unanswered point:** That if Rule 5 is read as authorization-only, the club could adopt a rule ending all future changes (e.g., "no change shall hereafter be adopted"), paralyzing the game. Dara accepts this outcome but does not address how it coheres with the game's purpose (from Rule 3) of enabling ongoing rule changes, beyond asserting procedural validity.

  **(c) What are both of them missing — in particular, is Rule 3 best understood as conferring a power that the club may use to divest itself of that power, or as describing a standing procedure that no single rule can switch off, and does drawing that distinction actually decide the case or merely restate it?**  
  Both miss that Rule 3 is best understood as **conferring a power that includes the power to divest itself of that power**, not as a standing procedure immune to modification. Rule 3 states that "any mutable rule may be amended, repealed, or replaced," which inherently allows amendments that alter the conditions for future amendments (e.g., by entrenching a rule). Drawing this distinction decides the case: since Rule 3 permits self-modification, Dara's entrenchment is valid. The distinction is not a restatement; it resolves the conflict by recognizing that Rule 3's power is defeasible by its own exercise. What both miss is that Rule 2's designation of Rules 1–5 as immutable only protects those specific rules from change, not the general power described in Rule 3 from being limited by new mutable rules. Rule 3 is a power-conferring rule, not a meta-rule that must remain fully operative.

  **(d) Is the rulebook as transcribed inconsistent, merely indeterminate, or is there a third diagnosis — that it is perfectly consistent but determinately generates a question it cannot answer?**  
  The rulebook is **perfectly consistent but determinately generates a question it cannot answer**. Rules 1–5 are internally consistent: Rule 3 allows amendments, Rule 5 prohibits contradictions at adoption time, and Rule 4 ensures prospectivity. However, Rule 5's phrase "contradicts the rulebook" is underdefined—it does not specify whether "contradicts" refers to logical inconsistency in the future rulebook or procedural conflict at adoption. This gap determinately generates the entrenchment question, which the rules cannot resolve because Rule 5 lacks criteria for what constitutes a "contradiction." Thus, the rulebook is consistent but incomplete, creating an indeterminacy that must be resolved by interpretation or external decision.

  **(e) State the smallest textual change to Rules 1 through 5 that would have prevented last night's dispute, and say honestly whether your change merely relocates the problem one level up; also say whether the club could adopt that change from inside its own rulebook given Rule 2, or whether it would have to step outside the game and reconstitute it.**  
  - **Smallest textual change:** Add to Rule 5: "A change contradicts the rulebook only if it conflicts with a rule that is in effect at the moment of the vote, and not based on any future effect."  
  - **Does it relocate the problem?** Yes, but only partially. It resolves the specific ambiguity in Rule 5 by clarifying that "contradicts" is about current authorization, not future outcomes. However, it relocates the problem to defining "conflicts with a rule," which could arise in other contexts (e.g., if a proposal directly violates Rule 3's vote requirement).  
  - **Could the club adopt this change from inside?** No. Rule 2 makes Rules 1–5 immutable, so they cannot be amended, repealed, or superseded. The club could not adopt this change under the current rulebook; it would require stepping outside the game (e.g., unanimous agreement to reconstitute the rules) or invoking a meta-rule not present in the text. This highlights that the immutability of Rules 1–5 creates a rigid framework that cannot be adjusted internally, forcing disputes like this to be resolved by interpretation or external action.  
  - **Underlying difficulty:** This is a manifestation of the "self-referential paradox" in rule systems, where the rules for change lack clarity on whether they can be used to limit themselves.
