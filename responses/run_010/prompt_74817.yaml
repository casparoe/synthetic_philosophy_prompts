  Okay, let me approach this systematically. The user is creating an ethics seminar problem sheet focused on genuine moral dilemmas and needs a case that withstands standard dissolution attempts. The four strict conditions are asymmetric obligations, no self-infliction, no third way/override, and mundane contemporary setting.

  First, considering condition 1 (asymmetric obligations), I'm weighing different obligation types - perhaps a professional role-based duty versus preventing imminent harm. The hospice setting comes to mind because it naturally creates tension between organizational rules and direct moral intervention. 

  For condition 2 (not self-inflicted), I need to eliminate any hint of prior negligence. Making the agent a newly assigned temporary staff member who wasn't involved in setting policies helps. The emergency should arise unexpectedly despite proper procedures.

  Condition 3 (no third way) requires careful construction. I'll include evidence that the agent thoroughly explored alternatives (contacted superiors, checked resources) but found no solution. Must emphasize that each obligation is individually fulfillable.

  Condition 4 (mundane setting) suggests avoiding dramatic scenarios. A hospice medication error where a family member's interference could cause harm feels appropriately ordinary yet high-stakes.

  The core dilemma emerges when the agent must choose between preventing immediate harm by overriding protocol or maintaining professional integrity by allowing potential harm. The "weightier harm-prevention duty" versus "lesser role-obligation" asymmetry is crucial here.

  Now testing escape routes:
  - Asymmetry blocks "equal weight" dissolution 
  - No self-infliction prevents "prior fault" arguments
  - No third way stops "you didn't try hard enough" objections
  - Mundanity avoids "unrealistic scenario" dismissals

  For the working section, I anticipate two responses: 
  Dissolutionist might claim the role-obligation wasn't genuine due to circumstances, but this strains credulity when professional integrity is at stake. 
  Dilemma defender would point to persistent moral residue - the agent's need to apologize despite correct choice.

  Condition 1 (asymmetric but persistent lesser obligation) is doing the heaviest lifting. If removed, the case collapses into simple hard choice. Removing other conditions creates different vulnerabilities - self-infliction introduces blame, third way offers escape, non-mundane settings invite dismissal.

  Potential weak spots: 
  Could the dissolutionist argue that preventing harm nullifies the role-obligation? But professional integrity doesn't disappear during emergencies. 
  Is the family member's interference plausible? It might seem contrived, but desperate actions in medical contexts are documented.

  If convinced that obligations can't coexist without one dissolving, I'd concede failure. Currently believe the hospice case meets spec by making both obligations feel real and inescapable in that moment.
answer: |-
  Here is a case crafted to your specifications, followed by the requested analysis. I'll be rigorously self-critical about potential weaknesses.

  **The Case: Hospice Care Coordinator**  
  Maya is the newly appointed temporary care coordinator at St. Brigid’s, a small hospice. She is covering a single weekend shift. On Saturday morning, she discovers that due to an administrative error by a permanent staff member (now unreachable on leave), Mr. Evans, a patient with advanced dementia and severe, intractable pain, has been without his critical, non-standard analgesic for 12 hours. His scheduled dose is overdue, and he is visibly suffering – moaning, rigid, and unable to communicate. Delaying further risks significant distress and potential physiological complications. Maya has the authority and means to administer the medication immediately from the emergency stock. However, hospice policy, mandated by their insurers and rigorously enforced, requires *written* verification of the prescription and stock level by two staff members before administering any controlled drug from emergency stock – a process impossible until Monday. Simultaneously, Mr. Evans’s distraught daughter, unaware of the error, arrives demanding Maya immediately give him "something stronger," threatening to forcibly intervene at the medication trolley if she doesn’t act within minutes. Maya knows from training that unauthorized physical intervention by a relative could cause injury to staff, the patient, or the relative, and significantly disrupt the ward. She has exhausted all options: she cannot contact the on-call manager (unavailable), locate another authorised staff member (none present), find the written verification (it’s missing), or calm the daughter down. Administering the drug now prevents immediate, severe harm to Mr. Evans but violates a core, legally-grounded professional protocol. Preventing the daughter’s intervention avoids potential harm and upholds her role, but leaves Mr. Evans in agony for hours.

  **Conditions Met:**
  1.  **Asymmetric:** Preventing severe harm (Mr. Evans's suffering) vs. upholding a role-based, contractual/professional obligation (strict medication protocol). Maya correctly judges preventing harm is weightier.
  2.  **Not Self-Inflicted:** The error was made by an absent colleague; Maya is a temporary cover with no prior involvement or opportunity to prevent the situation. She is diligent in her new role.
  3.  **No Third Way/Override:** Exhausted alternatives (contacting superiors, finding staff/records, reasoning with daughter). Each act *is* possible: She *can* give the drug (physically, and she knows it's correct). She *can* physically block/restrain the daughter or call security (though escalation risks harm). Doing both is impossible: Giving the drug requires accessing the trolley, which the daughter will physically prevent/contest unless Maya complies *immediately* with the demand for drugs. Ought implies can holds individually.
  4.  **Mundane/Contemporary:** Small hospice setting, administrative error, family pressure, professional protocols – recognisable stakes for a healthcare worker.

  **The Debate:**

  *   **Dissolutionist Move (Denying Genuine Dilemma):**  
      The dissolutionist will likely attack **Condition 1 (Asymmetry)**. They will argue that once Maya correctly judges preventing Mr. Evans's severe suffering is the weightier obligation, the lesser obligation (strict adherence to the protocol *in these specific, extraordinary circumstances*) ceases to be a *genuine, binding* obligation. The protocol, they argue, is designed for normal operations, not catastrophic failures causing immediate, severe harm where compliance is literally impossible. Its purpose (patient safety, legal compliance) is *better served* by violating it to prevent the greater harm here. Therefore, Maya only has one *actual* obligation: to relieve Mr. Evans's suffering. The apparent conflict dissolves; she should give the drug without genuine moral residue. Any lingering unease is merely psychological or about potential legal/professional consequences, not a true *moral* residue from a violated obligation.

  *   **Dilemma Defender's Reply:**  
      The defender argues the dissolutionist mischaracterises the nature of the role obligation. This isn't just a minor rule; it's a cornerstone of professional integrity, legal accountability, and systemic trust within healthcare, *especially* for controlled drugs. Circumstances don't automatically dissolve the obligation; they only make fulfilling it tragically incompatible with another urgent demand. By violating the protocol, Maya *does* breach a genuine professional duty – she fails in her specific role as the guardian of a rigorous, non-negotiable safety procedure, even for the best reasons. The moral residue manifests as **agent-regret** (distinct from guilt) focused specifically on this failure of role integrity, necessitating actions like a formal incident report acknowledging the breach, apologising to the hospice/regulators for the protocol violation (even while justifying it), and potentially advocating for protocol reviews to prevent recurrence – actions signalling the obligation wasn't illusory.

  **Which Constraint is Load-Bearing?**  
  **Condition 1 (Asymmetry & Persistence of Lesser Obligation)** is doing the most crucial work. It forces the dilemma to hinge on whether a *correctly judged lesser* obligation retains its binding force when impossible to fulfil alongside a greater one. Without it, the case could be dismissed as simply identifying the greater obligation (no dilemma). The other conditions prevent dissolutionists from shifting focus *away* from this core conflict.

  **Deleting Other Constraints:**
  *   **Delete Condition 2 (Not Self-Inflicted):** The case collapses into "prior fault." Dissolutionists argue Maya's *real* obligation was foresight/prevention (e.g., "She should have double-checked the handover"). The dilemma becomes a consequence of negligence, not a fundamental conflict.
  *   **Delete Condition 3 (No Third Way/Override):** The case collapses. Dissolutionists find a hidden alternative ("Call security faster!", "Sedate the daughter!", "Find *any* staff member!") or argue "ought implies can" fails for the protocol (if giving the drug was truly impossible alone, the obligation lapses). The dilemma vanishes if either obligation isn't independently viable or a third option exists.
  *   **Delete Condition 4 (Mundane):** Using a high-stakes/trolley-esque scenario makes it easier to argue the lesser obligation *should* be overridden/dissolved, or that the situation is too artificial/rare to prove a point about *genuine* dilemmas in ordinary life. Students dismiss it as irrelevant.

  **Self-Critique & Potential Weaknesses:**
  1.  **Is the Role Obligation Genuine *Here*?** The biggest vulnerability. A determined dissolutionist might argue that the *true* purpose of the protocol (ultimate patient safety/well-being) is *only* served by breaking it in this emergency, rendering the *literal* rule-following obligation inert. My defence is that systemic integrity and legal accountability are *inherent* parts of the professional role obligation, separate from immediate outcomes, and remain violated even for good cause.
  2.  **Daughter's Threat Plausibility?** Is it believable she'd immediately resort to force? I think yes, given severe distress over a parent's visible agony in a confined setting, but it's a pressure point. Making her *begin* to move towards the trolley strengthens it.
  3.  **"Ought Implies Can" for Protocol?** Is violating the protocol truly an "act she can perform" *as her role*? She can *physically* do it, but is she *authorised*? This is nuanced. Her role empowers her to handle drugs, but *conditionally*. Violating the condition is still an act *within* the scope of her role, albeit a forbidden one, making it a failure *of* that role. If the act was entirely outside her role (e.g., performing surgery), it wouldn't work.
  4.  **Moral Residue Focus:** Is the residue (reporting, apology) genuinely *moral*, or just professional/legal? The defender insists it reflects recognition of a moral failure within her professional duty, distinct from consequences.

  **What Would Change My Mind?**  
  I would concede the spec is unsatisfiable if presented with a compelling argument that **correctly judging one obligation as weightier *necessarily and conceptually* dissolves the binding force of the lesser obligation in the conflict situation.** If it can be shown that obligations, by their nature, *only* bind when they are the *most* pressing applicable demand in a situation (a kind of lexical priority or overridingness built into obligationhood), then the lesser one ceases to be a true "ought" when outweighed. My case assumes obligations can generate persistent "pro-tanto" (contributory) reasons or demands that aren't simply erased by being overridden, leaving moral residue. If "obligation" inherently means "must-be-done-all-things-considered," then dilemmas are impossible by definition. My reasoning is most likely to fail if this conceptual argument about the nature of obligations is sound.

  **Closest Achievable Case if Condition 1 Fails:**  
  If asymmetry inherently dissolves the lesser obligation, the closest case is a **symmetrical dilemma** (e.g., two equally weighty, distinct harms to prevent for different people, where saving one necessitates not saving the other, with no self-infliction or third way). However, these are notoriously vulnerable to arguments about comparability or hidden asymmetry. Your spec wisely avoids them.

  **In summary:** This case meets your spec and blocks the standard escape routes. Its core strength and vulnerability lie in Condition 1 – asserting that a correctly judged lesser *professional/role-based* obligation retains genuine moral force even when overridden by a greater harm-prevention duty, generating non-dissolvable residue. Use it, but be prepared for vigorous debate on that precise point. It should achieve your goal of forcing students to confront the *persistence* of obligations in conflict, not just their ranking.
