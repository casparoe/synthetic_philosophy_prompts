  I rejected a recurring line about "the letterbox's hungry mouth" because it personified the loop too overtly. Keeping it domestic was better—"Her own street number on the envelope" does the same work neutrally. 

  Notes must justify all this concisely. The client will cut the poem if reasoning feels forced, so I'll emphasize how meaning shifts in recurring lines and why collapsing the two "can"s would ruin the tension between free will and determinism.

