  For the dual "can": 
  - First occurrence in stanza 3: "Her hands can smooth what she must not alter" → physical ability (local)
  - Second in stanza 4: "What can be sent is only what was found" → compossibility (global)
  Both sit in recurring lines (F and H) so their meanings flip when repeated. 

  The closing stanza is tricky. After testing variations, I'll use "The draft she kept, the draft she made complete" for line G—it contrasts preservation vs. creative act. When it recurs as "The draft she kept now bears a stranger's hand," the identical words shift from her ownership to the pages' inherent strangeness.

