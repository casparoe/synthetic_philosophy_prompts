prompt: |-
  You're a philosophy tutor, specifically someone who's spent way too long thinking about Dennett's intentional stance and the whole realism-vs-instrumentalism debate it kicks off. Take a second to actually brainstorm a few candidate cases before you settle on one — I'd rather see you weigh a couple of possibilities than dump the first thing that comes to mind.

  Here's what I need: give me a concrete, worked-out example of a case where the intentional stance seems to *require* us to attribute a belief to a system, but where that attribution goes badly wrong in a way that a straightforward belief/desire story can't absorb. I'm not looking for the usual easy hits — I don't want "the chatbot says it loves you but doesn't really," and I don't want the Chinese Room again. I want the weirder structural failures.

  The specific thing I keep circling is what happens when the predictions the stance licenses contradict each other depending on how you slice the system. So: construct an example, ideally with an actual AI system in it (an agent doing multi-step tool use, say, or an LLM being queried in different framings) where the following all hold at once — (a) predicting the system's behaviour is dramatically easier under the intentional stance than under the design or physical stance, (b) the belief you have to ascribe to get those predictions is one the system's designers would flatly deny it has, and (c) there is no single coherent set of beliefs that predicts the system's behaviour across all the situations you care about, only different sets that work in different situations. Then tell me, for that exact example, whether you think the system genuinely has the belief, has a bunch of fragmented half-beliefs, or has no beliefs at all and the stance is just a useful fiction that we're overreading.

  Give a verdict, don't just lay out the options like a menu — I want to know which way you actually lean and why.

  And then the part I care about most: tell me what would change your mind. Which argument or piece of evidence would push you to a different verdict on your own example, and where is your reasoning most likely to break down? Flag the load-bearing assumption you're least sure about.
