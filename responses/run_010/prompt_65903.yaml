prompt: |-
  You're a philosopher of economics who's taught social choice theory to grad students for years — that's the hat I need you in. I run a small podcast on formal ethics and next month's guest is an economist-philosopher who argues, without hedging, that Harsanyi's aggregation theorems basically settle the debate: any social evaluation that respects the Pareto condition plus anonymity has to be a sum of individual utilities, so the veil-of-ignorance argument isn't an intuition pump, it's a proof.

  I dont want softballs and I dont want him re-deriving the theorem on air. Write me exactly five interview questions as a numbered list, each one immediately followed by a single follow-up keyed to the answer he's most likely to give. Keep each item to a couple of sentences, and give me nothing else: no intro, no wrap-up, no tips about running the segment.

  Between the five I want these pressure points covered: whether the theorem actually establishes interpersonal comparability of utility or quietly assumes it; what breaks if you drop the common-prior assumption and let the people behind the veil disagree about probabilities; the ex ante vs. ex post Pareto worry, including the charge that unanimity here can be spurious; whether giving up anonymity leaves him with a weighted sum that isn't the view he's advertising; and whether anything about maximizing expected utility gets him from a representation result to a moral conclusion.

  Think hard about where the theorem really is vulnerable before you start, but keep that thinking out of the output. Every question has to turn on the content of his assumptions — no generic "but does that match our intuitions" pushback, and no asking him what drew him to the topic.
reasoning: |-
  Okay, the user is a podcast host focused on formal ethics, prepping for an interview with an economist-philosopher who strongly advocates Harsanyi's aggregation theorems as settling social choice debates. The host wants five precise, hard-hitting questions with follow-ups targeting specific vulnerabilities in the theorem, without letting the guest re-derive it on air. 

  First, I need to map the pressure points the user specified: interpersonal comparability, common-prior assumption, ex ante/ex post Pareto conflict, anonymity's role, and the is-ought gap in deriving moral conclusions. Each question must surgically dissect an assumption, not invite intuition-based rebuttals. 

  For interpersonal comparability: Harsanyi's theorem presents utility summation as a result, but the von Neumann-Morgenstern framework it relies on only gives interval scales. The follow-up should press why cardinality alone suffices without interpersonal unit comparability. 

  On common priors: If veil-of-ignorance evaluators disagree about probabilities, the Pareto condition might force incoherent social evaluations. The follow-up needs to corner the guest on whether dropping this collapses the theorem or merely complicates it. 

  Ex ante/ex post Pareto is tricky because the theorem prioritizes ex ante unanimity, which can contradict ex post welfare. The follow-up must highlight how spurious unanimity arises from conflicting beliefs, not actual interests. 

  Anonymity’s sacrifice leads to weighted utilitarianism, which the guest dismisses but is technically still "summing utilities." The follow-up should force him to reconcile this with his "has to be sum" claim. 

  Finally, the move from mathematical representation to moral imperative hinges on questionable leaps in expected utility theory. The follow-up needs to question why rationality axioms should bind ethical deliberation. 

  I’m structuring each Q to first state the assumption neutrally, then the follow-up to trap evasion. No mercy for hand-waving—this guest thinks the debate is settled, so the questions must expose where the proof actually bleeds.
answer: |-
  1.  **Question:** Harsanyi's theorem derives a sum of individual vNM utilities, but vNM utility functions are only unique up to affine transformations. Doesn't this cardinality *without* uniquely defined interpersonal unit comparisons mean the theorem doesn't actually *establish* interpersonal comparability, but rather *assumes* a specific cardinalization where utility differences *can* be compared?  
      *Follow-up:* If we only have individual cardinal scales lacking a common unit zero, doesn't the "sum" become mathematically undefined without that further interpersonal comparability assumption you haven't derived?

  2.  **Question:** The theorem assumes all individuals *and* the impartial observer behind the veil share identical subjective probabilities (a common prior). If we drop this and allow disagreement about the likelihood of states, doesn't the ex-ante Pareto principle potentially force the social evaluator to endorse choices that everyone agrees *ex ante* make them better off, but which could lead to *ex post* outcomes where some are severely harmed with their consent based on mistaken beliefs?  
      *Follow-up:* Doesn't this make the unanimity captured by ex-ante Pareto potentially spurious, reflecting differing beliefs rather than conflicting interests, and undermine the moral force of aggregating those specific expected utilities?

  3.  **Question:** Related to probability, the ex-ante/ex post tension seems fundamental: respecting ex-ante Pareto preferences (based on differing beliefs) can violate ex-post Pareto efficiency or lead to obviously unfair distributions once uncertainty resolves. Doesn't Harsanyi's reliance *only* on ex-ante Pareto ignore the moral significance of actual outcomes and the potential for systematic exploitation under belief divergence?  
      *Follow-up:* If the theorem compels us to respect preferences formed under possibly radically divergent or mistaken beliefs, doesn't that expose a serious limitation in using it as a foundation for social ethics, rather than merely a representation theorem under restrictive assumptions?

  4.  **Question:** Anonymity is crucial for getting an *unweighted* sum. If we relax anonymity but keep Pareto and your other axioms (like linearity in probabilities), we get a *weighted* utilitarian sum. Doesn't this show that Harsanyi's specific "sum" result isn't uniquely mandated by Pareto plus rationality axioms alone, but critically hinges on this distinct symmetry condition?  
      *Follow-up:* Since weighted utilitarianism contradicts the strict impartiality you advertise, doesn't this reveal that anonymity, not just Pareto and rationality, is doing the heavy ethical lifting to get your egalitarian sum?

  5.  **Question:** The theorem shows that under your axioms (Pareto, anonymity, etc.), the social ordering *is represented by* the sum of expected utilities. But isn't there a crucial gap between this being a *representation* of a preference ordering satisfying those axioms and it being a *moral imperative*? Why must we accept that axioms defining rational *individual* choice under risk should bind *ethical* social evaluation?  
      *Follow-up:* Doesn't moving from "this mathematical form represents preferences satisfying these axioms" to "society *ought* to maximize this sum" require the unjustified normative premise that satisfying those specific axioms of rational choice *is* the sole requirement for ethical social choice?
