prompt: |-
  I have been reading around the literature on regimes whose claim to obedience rests on what they produce rather than on how they were chosen, and I keep running into a pattern that I cannot find named anywhere. I would like to know whether it has one.

  Here is the pattern. A government's claim is anchored, more or less explicitly, to a specified deliverable — rising incomes, say, or housing, or a growth rate. The deliverable stops arriving, or its measurement becomes disputed, or a shock knocks it out entirely. Then a different deliverable is put in its place: safety, cleanliness, competence, the elimination of absolute poverty, technological self-reliance, national standing, order. The substitution is never announced as a substitution. Nobody says the original test has been failed and a new one adopted; the new item is simply added to the running account and treated as continuous with the old one. Supporters credit it, and — this is the part that interests me most — critics often ratify it too, accepting the replacement deliverable as though it discharged the same burden of proof that the first one had been carrying. The result is that the original claim is never actually tested. It is neither vindicated nor falsified; it is quietly retired while remaining nominally in force.

  Three instances from my reading. A city-state whose ruling party had anchored its claim in rising incomes and mass home ownership found, after an election in which its vote share fell sharply and immigration became a salient grievance, that the public vocabulary had shifted toward being safe, clean, harmonious, and well run — and commentators who had been predicting the collapse of the bargain instead described it as being honored in a different currency. A large one-party state, when its headline growth rate came down from double digits, moved its emphasis onto poverty elimination and national restoration; many outside observers who doubted the growth figure nonetheless accepted the poverty claim as though the two were answers to the same question. And in a third case, after a financial shock removed the growth claim from the table altogether, what the state delivered was order — queues that did not form, banks that did not fail, streets that stayed quiet — and that was entered on the credit side of the same ledger.

  One further feature that makes me think this is not just ordinary political communication: the substitute is usually something the same instruments produce. The capacities that failed at growth — information management, mobilization, surveillance, administrative coercion — are precisely the capacities that succeed at order and at spectacle. So failing the first metric builds the means of supplying the second, and the failure is not merely survived but partly converted into an asset.

  I want to be clear about what I am not describing. It is not the everyday point of moving the goalposts inside an argument, because there is no single arguer here and no moment of retreat; the shift is distributed across the government, its supporters, and its critics. It is not the familiar distinction between support that depends on particular deliveries and support that survives them, since what I am describing happens entirely within the first kind. It is not the trivial observation that governments deliver many goods and may be judged on any of them. And it is not simply propaganda, because the substitute deliverable is often real, and often something the population genuinely values.

  So: is there an established concept for this, in political theory or in the empirical literature on authoritarian persistence? If there is, give me the term and tell me how closely it fits the description above, including where my version overstates or distorts it. If there are near neighbors instead, walk me through each one and say precisely what the described pattern adds or subtracts. And if there is no established concept, coin one — but I care much less about the label than about the carving. What I want from you is: a definition with real edges; the conditions under which this happens rather than a government simply being re-evaluated on a different good; a way to tell, in real time and not only in hindsight, whether a substitution is a legitimate reweighing of public goods or the failure mode I have described; and an account of what it would take to hold any government to a fixed criterion in advance, and whether that is even possible for a claim of this kind.
reasoning: |-
  Okay, the user is describing a very specific pattern in political regimes where the basis for legitimacy shifts from one deliverable to another without acknowledgment. They've provided three concrete examples and want to know if there's an established term for this. Let me start by recalling related concepts.

  First, legitimacy theory comes to mind. Weber's traditional, charismatic, and legal-rational types don't quite fit since the user's case is about performance-based legitimacy. Then there's performance legitimacy, which is close but usually discussed as a static concept. The dynamic shift they describe isn't covered there.

  Policy feedback theory might be another angle. Policies creating supportive constituencies fits, but the user mentions critics also accepting the new deliverables. That's a key point. The shift isn't just internal but involves critics ratifying the change. So policy feedback seems relevant but incomplete.

  Authoritarian resilience literature often talks about co-optation or repression. The user's examples show how failed growth leads to order—using the same tools. That's a crucial twist: failure enabling the next deliverable. Adaptive governance or rebranding are terms here, but they don't capture the unacknowledged substitution aspect.

  Discourse coalition and framing literature might help. The redefinition of success without admitting change sounds like framing. But again, the critics' acceptance is unique. Usually, opponents challenge such shifts, not validate them.

  The user emphasizes the instrumental continuity: the same state capacities that failed at growth succeed at order. That's a feedback loop where failure becomes an asset. Path dependency could relate, but it's more about constraints than strategic adaptation.

  Putting it all together, the core elements are: unannounced substitution of deliverables, critics' ratification, instrumental continuity, and the original claim never being tested. Existing terms don't fully capture this. Coining "legitimacy substitution" or "performative displacement" makes sense. The latter emphasizes the unacknowledged shift and performative nature.

  The user also wants criteria to identify this in real-time. Key indicators would be: sudden shift in discourse post-failure, critics accepting new metrics, same tools repurposed, and lack of accountability for original goals. They also ask if holding a government to a fixed criterion is possible. Performance legitimacy is inherently unstable because deliverables fluctuate. Contracts or constitutions could set criteria, but regimes avoiding accountability won't bind themselves. Social mobilization or independent institutions might enforce accountability, but it's challenging.

  Deep needs: The user might be researching authoritarian durability or looking for frameworks to analyze regime transitions. They might need this concept for academic work or policy analysis. Their frustration with unnamed patterns suggests a desire for conceptual clarity to better critique or understand such regimes. Ensuring the term highlights the unacknowledged shift and critic complicity is vital for their argument.
answer: |-
  This is a brilliantly observed pattern that cuts to the heart of performance-based legitimacy and authoritarian resilience. While no single established term perfectly captures the *entirety* of your description – particularly the **unacknowledged substitution ratified by critics and the instrumental continuity** – there are strong conceptual neighbors and a compelling case for coining a precise term.

  **Why Existing Concepts Fall Short (But Are Relevant):**

  1.  **Performance Legitimacy:** The *foundation* is performance legitimacy (governments deriving legitimacy from outputs: growth, welfare, stability). Your focus is on the *dynamic, unacknowledged shift* within this framework when the primary output falters. Performance legitimacy theory often treats the "performance" as relatively stable or monolithic, not focusing on this specific substitution mechanism.
  2.  **Goal Displacement / Moving the Goalposts:** Captures the *action* of changing the criteria, but misses the *systemic, unacknowledged, and ratified* nature you describe. Goal displacement is usually seen as a cynical tactic by a single actor in an argument, not a distributed, legitimized shift involving critics.
  3.  **Framing / Reframing:** Central to how the "deliverable" is presented. Governments constantly reframe successes. However, your pattern involves a specific type of reframing: **substitution without acknowledgment of failure**, presented as *continuity*, and crucially, **ratified by critics** as meeting the *original* underlying claim. Standard framing analysis often focuses on persuasion, not this specific dynamic of critical ratification of the substitution.
  4.  **Policy Feedback / Authoritarian Institutions:** Explains *how* the capacities used for the first deliverable can be repurposed for the second (e.g., surveillance for order). This is essential to your "failing the first metric builds the means of supplying the second" point. However, it doesn't directly address the *legitimacy claim substitution* itself, only the instrumental capacity.
  5.  **Authoritarian Resilience / Adaptation:** The broader literature on how authoritarian regimes survive stresses adaptability. Your pattern is a *specific mechanism* of that adaptation related to legitimacy claims. Terms like "institutional layering" or "adaptive governance" are too broad. "Legitimation strategy shift" comes closer but lacks the specificity of the unacknowledged substitution and critical ratification.
  6.  **Discourse Coalition:** Explains how governments and supporters (and sometimes critics) align around a narrative. Your pattern shows how a *new* element is seamlessly integrated into an *existing* coalition's narrative about regime legitimacy, without breaking the frame of the original claim.

  **The Core Innovation & Coining a Term:**

  Your description adds crucial elements missing from standard concepts:
  *   **Unacknowledged Substitution:** The pretense of continuity despite a fundamental shift in the primary legitimizing output.
  *   **Critical Ratification:** Critics accepting the *new* deliverable as fulfilling the *original* legitimacy claim ("honored in a different currency").
  *   **Instrumental Continuity & Conversion:** The same state capacities that failed at Deliverable A become assets for Deliverable B, converting failure into a different kind of success.
  *   **Distributed Shift:** It's not just government propaganda; it's a shift absorbed by supporters *and* critics, reinforcing the regime's narrative.

  The most fitting term, drawing on political theory and discourse analysis, would be:

  **Performative Displacement**

  **Definition:** A dynamic process within performance-based legitimacy regimes whereby, upon the failure or contestation of a primary legitimizing deliverable (Deliverable A), the regime, its supporters, and crucially, often its critics, tacitly adopt a *different* deliverable (Deliverable B) as fulfilling the *original* legitimacy claim, without acknowledging the substitution. This displacement leverages the same state capacities that failed to produce Deliverable A to successfully produce Deliverable B, effectively converting the failure into an asset for a reconstituted, yet nominally continuous, performance claim.

  **Why "Performative Displacement"?**
  *   **Performative:** Emphasizes the claim is based on *doing/producing* something (performance legitimacy) and how the *act* of presenting Deliverable B *performs* the function of fulfilling the original claim.
  *   **Displacement:** Captures the replacement of one core element (Deliverable A) with another (Deliverable B) within the structure of the legitimacy claim, while maintaining the facade of the original structure.

  **Conditions for Performative Displacement (vs. Simple Re-evaluation):**

  1.  **Explicit Initial Anchor:** The regime's legitimacy claim must have been significantly anchored to a specific, measurable deliverable (growth, housing).
  2.  **Failure/Contestation of Anchor:** That specific deliverable becomes unavailable, unreliable, or widely perceived as failed.
  3.  **Unacknowledged Shift:** The introduction of Deliverable B is presented *not* as a new bargain or admission of failure on A, but as a natural extension, refinement, or reaffirmation of the *original* claim ("We always valued order/harmony/national standing as *part* of delivering prosperity").
  4.  **Critical Ratification:** Key critics (domestic commentators, international observers, opposition figures) accept Deliverable B as a valid indicator of the regime's success *in lieu of*, or as equivalent to, Deliverable A, rather than challenging the substitution itself.
  5.  **Instrumental Continuity:** The state capacities deployed (often unsuccessfully) for Deliverable A are demonstrably the same ones effectively producing Deliverable B (e.g., information control -> spectacle/order; mass mobilization -> poverty reduction drives).

  **Identifying Performative Displacement in Real-Time:**

  1.  **Discourse Shift Post-Failure:** Listen for a *sudden* and significant increase in emphasis on Deliverable B *immediately following* the failure/contestation of Deliverable A. Look for phrases framing B as "the true foundation," "what really matters," or "always part of the plan."
  2.  **Lack of Accountability:** Is there a conspicuous *absence* of serious regime discussion, apology, or explanation for the failure of Deliverable A? Is it simply dropped from the main legitimacy narrative?
  3.  **Critics' Framing:** Do critics arguing the regime is *failing* focus solely on the *new* shortcomings of Deliverable B, or do they explicitly say "They failed on growth, and now they're distracting with order/poverty stats"? If they primarily critique B *on its own terms* without referencing the displacement of A, that's ratification. If they *accept* B as a positive but insufficient, *without* tying it back to the failure of A, that's also suggestive.
  4.  **Capacity Repurposing:** Can you observe the same state tools (surveillance, propaganda, mobilization systems) previously focused on A now being visibly redirected towards producing/managing B? Is B something these tools are *particularly* suited for?
  5.  **Public Ambivalence/Acceptance:** Is there public grumbling about the failure of A, but a concurrent acceptance or even appreciation of B? Does the regime's narrative of continuity ("we deliver") seem to resonate despite the shift?

  **Holding to a Fixed Criterion: Challenges and Possibilities**

  *   **The Core Problem:** Performance legitimacy is inherently vulnerable because deliverables are contingent. Growth stalls, shocks happen, metrics can be gamed. Regimes relying solely on it *must* adapt or face crisis. Performative displacement is a potent adaptation tool.
  *   **Why It's Hard:**
      *   **Information Asymmetry:** Regimes control information about metrics and failure causes.
      *   **Distributed Complicity:** Supporters have incentives to accept the shift; critics may fear repression or lack alternatives, or find B genuinely preferable to instability.
      *   **Legitimacy Claims are Fuzzy:** "Delivering prosperity" is vague enough to encompass many substitutes (order, poverty reduction, tech prowess).
      *   **State Capacity Advantage:** The tools for repression/control (used for "order") are often easier to maintain than tools for sustainable complex growth.
  *   **Possibilities (Difficult):**
      *   **Ex Ante Contracts:** A society could theoretically establish a "social contract" with *specific, measurable* deliverables tied to legitimacy *and* mechanisms for accountability if they fail (elections, independent audits, recall mechanisms). However, regimes prone to performative displacement inherently avoid such clear accountability.
      *   **Strong Independent Institutions:** Courts, auditors, free press, and legislatures can hold governments to account on *specific* promises. These are weak or absent in the regimes you describe.
      *   **Normative Anchoring:** Legitimacy based partly on *procedures* (how decisions are made, rights protected) or values (justice, freedom) alongside performance is harder to displace entirely. A failure of growth doesn't automatically make repression "the same thing" as prosperity if freedom is also valued. But regimes using performative displacement often deliberately downplay procedural/values-based legitimacy.
      *   **Critical Reflexivity:** The *most crucial* factor. If critics and the public consistently identify and reject unacknowledged substitutions, demanding accountability for the *original* promise ("You said prosperity, we got stagnation and more surveillance"), displacement becomes harder. This requires a strong opposition, independent media, and a public willing to see through the narrative continuity. Your observation of critical ratification is key – breaking *that* is essential.

  **Conclusion:**

  "Performative Displacement" effectively captures the unique pattern you've identified: the unannounced, critical-ratified substitution of legitimizing deliverables under a facade of continuity, powered by the repurposing of state capacities. It highlights a sophisticated mechanism of authoritarian resilience that exploits the inherent instability of pure performance legitimacy and the complicity (willing or unwilling) of critics in maintaining the regime's narrative framework. Holding regimes accountable requires not just evaluating the *new* deliverable, but constantly interrogating whether it genuinely fulfills the *original* legitimizing bargain and demanding answers for its failure. This is exceptionally difficult, as it fights against powerful regime narratives and often the populace's desire for stability and *some* form of perceived delivery.
