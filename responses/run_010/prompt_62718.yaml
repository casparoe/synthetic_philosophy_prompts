prompt: |-
  I am drafting the conceptual-foundations section of a long report on irreversibility in small driven systems, and before engaging with any existing account of the arrow of time I want the specification: the conditions an account must satisfy to count as adequate. Since adequacy is relative to purpose, let me fix the purpose. I need an account on which it is determinate, for a given physical system and a given choice of description, whether that system has a thermodynamic arrow and which way it points — determinate enough to license the coarse-grained, irreversible modelling that is routine in stochastic thermodynamics, and robust enough to survive contact with the mesoscopic regime, where entropy-decreasing trajectories are not merely possible but measured and assigned exact statistical weights.

  Please write the requirements, each accompanied by the case or consideration that motivates it. The following are candidates I have collected; the finished list should be both longer and shorter than this, since some of them will turn out to be redundant, question-begging, or mere restatements of one another.

  - Compatibility with the time-reversal invariance (or, where it fails, the specific character) of the underlying dynamics, rather than denial of it.
  - Recurrence: what the account says to the objection that any entropy gradient will eventually reverse, and why the relevant timescales are or are not a legitimate dismissive reply.
  - Velocity inversion: a system whose microstate is reversed must evolve backwards, and the account must say why we never meet such systems.
  - The asymmetry of records, memory, and evidence.
  - The asymmetry of intervention and preparation — we can set up an initial condition but not a final one — together with the charge that any account leaning on this is applying a double standard, reasoning one way about initial states and another about final states.
  - Radiation: diverging waves from localized sources, with no converging counterparts.
  - Cosmology: the smoothness of the early universe, including the wrinkle that a smooth matter distribution is gravitationally low-entropy rather than high, so that the naive identification of uniformity with equilibrium fails once gravity is included.
  - The coarse-graining relativity of entropy, and hence the question whether the arrow is a feature of the world or of a description of it.
  - Mesoscopic porosity: fluctuation relations quantify second-law-violating behaviour, so the account must say whether the arrow is a matter of degree, and what remains of it where fluctuations dominate.
  - The dependence of attributed entropy production on where one draws the system–bath boundary and on what one treats as the externally varied protocol.
  - A requirement of my own, which I want tested rather than adopted: boundary-locality — the arrow in a laboratory should be fixed by facts about that laboratory and its surroundings, not by the state of the universe as a whole at its origin.
  - Composability: how arrows nest, and what the account says about a feedback-controlled subsystem whose local entropy decreases at the expense of a controller elsewhere.
  - Stability under refinement: the direction assigned to a system should not flip when the description is made more fine-grained.
  - Non-circularity: the account must not posit the very asymmetry it was meant to derive, or smuggle a direction of time in through its account of measurement, preparation, or conditioning.
  - Explanatory residue: if the account terminates in a special boundary condition, it must say what work that posit is doing and what remains unexplained.
  - The absence of any observed domain with the opposite arrow, and an account of what such a domain would look like to observers inside or outside it.

  Then the analysis I most want:

  1. Mark each requirement as non-negotiable, negotiable, or camp-specific — the latter meaning a constraint that only looks like a requirement once one has already accepted a particular conception of what explaining the arrow amounts to. Name the camp in each such case.
  2. Identify any subset that is jointly unsatisfiable, and say which member gives way under which view. I suspect boundary-locality is in tension with something, but I want the argument rather than my hunch.
  3. Say which single requirement does the most to exclude candidates, and which is most often assumed without argument.
  4. Say how the list changes if the purpose changes — from the laboratory-usable standard above to a cosmological one, where the only question is why the universe exhibits any gradient at all.

  Finally, briefly, and only insofar as it exposes which requirements each one fails: how a past-hypothesis-plus-statistical-mechanics account, a typicality account, an interventionist or agency-based account, and a view on which the arrow is a fundamental, non-derivative feature of the world fare against the list you have produced. I do not want a ranking. A table is acceptable for items 1 to 3 provided the reasoning stays visible.
reasoning: |-
  Okay, the user is drafting a conceptual foundations section for a report on irreversibility in small driven systems. They need a set of adequacy conditions for an arrow-of-time account that supports stochastic thermodynamics modeling, especially in mesoscopic regimes where entropy fluctuations occur. 

  First, I notice the user is very methodical - they've already compiled candidate requirements but want them refined. Their core tension is between determinacy (needed for modeling) and robustness (to handle measured entropy-decreasing trajectories). The mesoscopic focus is crucial here - this isn't just about cosmology.

  Hmm... their "boundary-locality" requirement is particularly interesting. They want lab-scale arrows decoupled from universal initial conditions, which immediately conflicts with cosmological approaches like the Past Hypothesis. I should flag that tension explicitly. 

  Looking at their list, some items are redundant. For example, "velocity inversion" and "recurrence" both address time-reversal asymmetry but at different scales. I'll consolidate those. "Coarse-graining relativity" and "stability under refinement" similarly overlap - both concern description-dependence.

  The non-negotiable requirements seem to be: compatibility with dynamics (since stochastic thermo relies on underlying reversible mechanics), mesoscopic porosity (their key use case), and non-circularity (any account begging the question is useless for foundational work). 

  For the camp-specific requirements... ah, "cosmology" is clearly Everettian/global-arrow territory, while "intervention asymmetry" presupposes agency-based views. The user might not realize how much their boundary-locality requirement excludes mainstream cosmological accounts.

  When testing existing accounts against the list:
  - Past Hypothesis fails boundary-locality spectacularly (relies on global initial condition)
  - Typicality struggles with mesoscopic porosity (can't quantify individual fluctuations)
  - Agency accounts circularly presuppose temporal asymmetry in "intervention"
  - Fundamental arrow views ignore coarse-graining relativity (entropy becomes absolute)

  The user's implicit goal seems to be finding an account where arrows are local and quantifiable - almost like a field variable rather than a universal constant. That's ambitious! I should emphasize that no current account satisfies all non-negotiables, hence their foundational work is needed.
answer: |-
  Here is a refined set of adequacy requirements for an account of the thermodynamic arrow in small driven systems, tailored to your purpose, with motivations and analysis:

  ### **Refined Requirements & Motivations**
  1.  **Non-circularity**  
      *Motivation:* Any appeal to asymmetric preparation, measurement, or conditioning presupposes the arrow it aims to explain. Stochastic thermodynamics requires a foundation independent of operational assumptions.  
  2.  **Compatibility with Underlying Dynamics**  
      *Motivation:* Accounts must reconcile irreversibility with time-symmetric (or known asymmetric) micro-dynamics, as stochastic models (e.g., Langevin, Master equations) derive from these dynamics.  
  3.  **Mesoscopic Porosity**  
      *Motivation:* Fluctuation theorems quantify entropy-decreasing trajectories. The account must explain how an arrow persists while accommodating measured violations (e.g., in colloidal systems).  
  4.  **Coarse-Graining Robustness**  
      *Motivation:* Entropy depends on description choice, but the arrow’s direction should be stable under *reasonable* refinements (e.g., not flip if bin sizes change slightly), ensuring modeling reliability.  
  5.  **Boundary Locality**  
      *Motivation:* An arrow in a lab subsystem (e.g., optically trapped particle) should depend on local boundaries/baths, not cosmic initial conditions. Necessary for reproducible experiments.  
  6.  **Composability**  
      *Motivation:* Arrows in coupled subsystems (e.g., system + controller) must nest coherently. Explains entropy decrease in feedback-controlled subsystems via global increase.  
  7.  **Asymmetry of Records/Evidence**  
      *Motivation:* Microscopic records (e.g., DNA, detector clicks) exist only for past events. The account must justify this asymmetry without presupposing "memory" as primitive.  
  8.  **Recurrence Resolution**  
      *Motivation:* Poincaré recurrence implies entropy reversals. The account must explain why observed arrows persist over *physically relevant timescales* (e.g., much longer than experiment/observation times).  
  9.  **Explanatory Residue Transparency**  
      *Motivation:* If special boundary conditions are invoked (e.g., past low entropy), the account must clarify their scope and why they aren’t *ad hoc*.  

  ### **Excluded Candidates with Reasons**  
  - *Velocity Inversion*: Redundant. Covered by **Compatibility with Dynamics** + **Recurrence Resolution**.  
  - *Radiation Asymmetry*: Camp-specific (electrodynamics). Not essential for mesoscopic thermo.  
  - *Intervention/Preparation Asymmetry*: Violates **Non-circularity**. Begs the question by assuming temporal asymmetry in "control".  
  - *Cosmology*: Camp-specific (global arrow accounts). Conflicts with **Boundary Locality**.  
  - *Absence of Opposite Arrows*: Derivative. Addressed by **Composability** + **Mesoscopic Porosity**.  

  ---

  ### **Analysis**  
  **1. Requirement Classification**  
  | **Requirement**               | **Status**             | **Notes**                                  |
  |-------------------------------|------------------------|--------------------------------------------|
  | Non-circularity               | Non-negotiable         | Foundational; avoids triviality.           |
  | Compatibility with Dynamics   | Non-negotiable         | Mandatory for physics consistency.         |
  | Mesoscopic Porosity           | Non-negotiable         | Core to your use case (small driven systems). |
  | Coarse-Graining Robustness    | Negotiable             | "Reasonable" refinement needs specification. |
  | Boundary Locality             | Camp-specific          | Rejects cosmological accounts (e.g., Past Hypothesis). |
  | Composability                 | Non-negotiable         | Required for modular modeling.             |
  | Asymmetry of Records          | Non-negotiable         | Key empirical asymmetry.                   |
  | Recurrence Resolution         | Non-negotiable         | Addresses major objection to irreversibility. |
  | Explanatory Residue           | Camp-specific          | Applies only to boundary-condition accounts. |

  **2. Tensions & Resolutions**  
  - **Tension:** **Boundary Locality** vs. **Explanatory Residue Transparency**.  
    - *Conflict:* Local arrows (demanded by lab systems) conflict with global boundary conditions (e.g., smooth early universe).  
    - *Resolution:* Under **Boundary Locality**, global conditions are rejected; arrows emerge from local baths/interactions. **Explanatory Residue** becomes irrelevant.  

  **3. Key Excluding & Assumed Requirements**  
  - **Most Excluding:** **Boundary Locality** – Eliminates all cosmological accounts (Past Hypothesis, typicality).  
  - **Most Assumed:** **Asymmetry of Records** – Often taken as given without explaining *why* records point to the past.  

  **4. Change for Cosmological Purpose**  
  Replace **Boundary Locality** and **Mesoscopic Porosity** with:  
  - **Global Arrow Unity**: Why does *the entire universe* exhibit a consistent arrow?  
  - **Initial Condition Justification**: Why is the early universe low entropy (considering gravitational clumping)?  
  - **Arrow Robustness**: Why no observed domains with reversed arrows?  

  ---

  ### **Account Assessments (Brief)**  
  | **Account**                          | **Key Failures**                                                                 |  
  |--------------------------------------|----------------------------------------------------------------------------------|  
  | **Past Hypothesis + Stat Mech**      | Violates **Boundary Locality**, **Explanatory Residue** (cosmic initial condition unexplained). |  
  | **Typicality**                       | Fails **Mesoscopic Porosity** (cannot quantify individual fluctuations), vague **Coarse-Graining Robustness**. |  
  | **Interventionist/Agency-Based**     | Violates **Non-circularity** (asymmetric "control" assumed), ignores **Composability**. |  
  | **Fundamental Arrow**                | Fails **Compatibility with Dynamics** (if dynamics are symmetric), ignores **Coarse-Graining Relativity**. |  

  This framework prioritizes *local determinacy* for stochastic thermodynamics, demanding that arrows emerge from system-bath interactions without cosmic scaffolding. **Boundary Locality** and **Mesoscopic Porosity** are the linchpins for your mesoscopic focus.
