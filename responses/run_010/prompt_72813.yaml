prompt: |-
  I'm running a 90-minute philosophy of language seminar, 14 students, mostly seniors who've done Kaplan and one Putnam reading and think they're basically finished with this stuff. I want an in-class game that makes them feel two-dimensional semantics from the inside — specifically the part that isn't just about indexicals: that an ordinary, totally non-context-sensitive term like a natural kind word has two different extensions depending on which kind of variation you're scoring it against, and you can't collapse the two into one.

  Here's the shape I think could work, improve on it if you have something better: they commit in writing to a definition/translation for some unfamiliar term, then get scored twice — once in a round where the facts about the world turn out to be different from how they looked when the definitions were written, and once in a round where those facts are held fixed and they're scored against a counterfactual situation instead. The same definitions should do well in one round and badly in the other. If I've got this right, they run into the two axes as two different scoring regimes before anyone says primary intension out loud.

  Constraints: no Twin Earth, no vats, no sci-fi framing at all. Half the class has heard the standard setup a dozen times and treats it as a thought experiment instead of a decision, and I want them actually committing under uncertainty with something on the line. Payoffs have to work with points on the board, not real money. Nobody hears any of the vocabulary until the debrief. Also, one of them will say this is just Kaplan's character and content with the labels swapped, and another will say it only gets interesting for words like I and here — build something into the structure that makes both of those hard to maintain by the end, or tell me straight if the game cant do that.

  Give me: setup and materials (I can print one handout per student), a round-by-round timeline that fits in 90 minutes, the scoring rules, a debrief that maps specific moments in the game onto the two dimensions and whatever else you want them to walk away with, what's going to go wrong the first time I run it and how I should handle it, and an honest note on which feature of the view the activity can't reproduce and that I'll have to supply by hand.

  Start with one sentence naming the mechanic that does the real work — the thing that makes the two axes come apart — then the plan. No preamble, and don't restate the question back to me.
reasoning: |-
  We are going to use a mechanic called **definitional anchoring under uncertainty** to force the two dimensions apart. The core idea is that students commit to a definition for an unfamiliar term based on limited information, and then we evaluate that definition in two distinct scenarios: one where the actual facts change (holding the linguistic practice fixed, simulating the primary intension) and one where we evaluate against a counterfactual scenario (holding the actual facts fixed, simulating the secondary intension). The same definition will yield different success rates in the two scenarios, making the two-dimensional structure palpable.

  **Setup and Materials:**
  - **Handout 1 (given at the start):** A description of a fictional culture's practice surrounding a term "Zorn". The handout should be ambiguous about the exact meaning but provide enough context to invite interpretation. Example:

    *"The people of the island of Kora use the term 'Zorn' in their daily lives. From context, it seems to refer to a kind of tool. You observe that whenever they are preparing for a ceremony, they say they need to 'fetch the Zorn'. They also often say that a good Zorn must be 'smooth and cool to the touch'. In one historical account, a Zorn was used to dig in the sand during a ritual. However, you also note that in another context, they refer to a large stone in the central square as 'the Great Zorn'. You have limited time to observe and must write down a rule for what counts as a Zorn."*

  - **Handout 2 (given after Round 1):** A sheet with two scenarios (for Round 2 and Round 3) and scoring instructions.

  **Timeline (90 minutes total):**

  1. **Introduction (5 minutes):** Explain that they are anthropologists studying the Koran language. They must write a definition for "Zorn" based on the handout. Emphasize that they are to write a clear, testable rule (e.g., "any object that is used in ceremonies" or "any tool that is smooth and cool"). They must commit to one definition. No discussion with peers.

  2. **Round 1: Definition Submission (5 minutes):** Students write their definitions individually on a slip of paper (collect these).

  3. **Round 2: The Actual World Shift (25 minutes total):**
     - **Setup (5 min):** Announce that new anthropological data has arrived. The actual facts about Kora are different than initially thought. Hand out a new fact sheet:
       
       *"Further research reveals: The Korans never use the word 'Zorn' for the Great Stone. That was a mistranslation; they call it 'Zarn'. Also, the digging tool used in the ritual was actually a ceremonial oar, and the term 'Zorn' exclusively refers to ceremonial oars. Moreover, a good Zorn must be made from a specific type of wood (which is cool and smooth) and is used in all water-related ceremonies."*
     
     - **Scoring (15 min):** Students get back their own definitions. They must self-score: how well does their definition capture what we now know is the actual extension of "Zorn" (i.e., ceremonial oars)? They assign themselves a score out of 10 (with brief justification). Then, they pass their definition and score to a neighbor for audit (neighbor can adjust score ±2 if they disagree). Collect scores.
     - **Note:** The actual extension is now fixed: Zorn = ceremonial oars.

  4. **Round 3: The Counterfactual Scenario (25 minutes total):**
     - **Setup (5 min):** Announce that we are now considering a counterfactual scenario. Hand out a new sheet:
       
       *"Imagine an alternative island, Mira, where the cultural practices are exactly as described in the original handout (before the new data). In Mira, the word 'Zorn' is used exactly as we first thought: it applies to the Great Stone and to the digging tool (which in Mira is not an oar but a spade). Moreover, in Mira, both the stone and the spade are smooth and cool, and both are used in ceremonies."*
     
     - **Scoring (15 min):** Students re-score their original definition against the Mira scenario. Does their definition correctly pick out the extension in Mira? (i.e., both the stone and the spade). Again, self-score out of 10, then neighbor audit. Collect scores.

  5. **Tabulation and Comparison (5 minutes):** You quickly compute two scores for each student: Round 2 (actual shift) and Round 3 (counterfactual). Note that the same definition was used in both. Project or announce a few examples (anonymized) showing high actual-shift score but low counterfactual score, and vice versa.

  6. **Debrief (25 minutes):** 
     - **The Two Scores (5 min):** Ask: "Why did your definition perform differently in the two rounds? What changed?" Elicit that in Round 2, the actual facts changed (but their definition was fixed), while in Round 3, the actual facts were fixed (but we evaluated in a counterfactual situation).
     - **Mapping to Semantics (10 min):** Introduce the two dimensions without jargon first: 
       - **Dimension 1 (Round 3):** How your definition would apply if the world had turned out differently (like Mira). This is about how you would apply the word under hypothetical scenarios, given your initial evidence. (Primary intension)
       - **Dimension 2 (Round 2):** How your definition captures what the word actually refers to, once all the facts are in. (Secondary intension)
       - Point out: Natural kind terms (like "Zorn") have these two dimensions. The same word can have two different extensions when evaluated along these two axes.
     - **Countering Objections (10 min):** 
       - For the student who says this is just Kaplan with labels swapped: Note that Kaplan's character is fixed by context and content by circumstance. Here, both evaluations are of the same linguistic item (their definition) in different settings. The key is that for non-indexicals, we still have two ways of evaluating extension: against how the world turns out (secondary) and against how we would apply it in counterfactuals (primary). The game shows that even without indexicals, you need two scores.
       - For the student who says it only matters for indexicals: Point to examples from the game where a definition that worked well in the actual shift (e.g., "smooth and cool objects used in ceremonies") did poorly in Mira because it was too broad (it might include other objects in Mira) or too narrow (it might exclude the stone if it wasn't used as a tool). Conversely, a definition that was too specific to the actual world (e.g., "oars") failed in Mira. The tension is in the term itself, not in context-sensitive elements.

  **What Could Go Wrong:**
  - **Students write vague definitions:** Require that definitions be operational (e.g., "an object that is used in at least one ceremony and is smooth and cool"). If too vague, they will have trouble scoring. Solution: Review definitions quickly during submission and nudge any overly vague ones to be more specific (but do this minimally).
  - **Scoring disputes:** The neighbor audit is meant to catch egregious self-scoring. Have a rule: if auditor and writer disagree by more than 2 points, they quickly discuss and agree on a middle score. If not, you arbitrate (but keep it quick).
  - **Time crunch:** The rounds are tight. Keep strict time limits. If scoring runs long, skip the audit and have them self-score only (but emphasize honesty).
  - **Debrief runs shallow:** Prepare specific examples of definitions that showed the split (anonymized) to jumpstart discussion.

  **What the Game Can't Do:**
  The activity cannot fully replicate the *metasemantic* aspect of natural kind terms — that the primary intension is determined by the user's conceptual role and the secondary by the actual world's structure. In the game, the "primary" is simulated by the counterfactual scenario (Mira) and the "secondary" by the actual shift. But in real semantics, the secondary intension is not just about the actual world but about counterfactuals with the actual world fixed. The game flattens this: Round 3 is a counterfactual scenario with the initial description fixed, which is a proxy for primary intension, but it doesn't show how the secondary intension is computed by holding the actual world fixed and varying other factors. You'll need to clarify in debrief that the two-dimensional framework is about two different ways of evaluating the same term across possible worlds, not just two scenarios. The game shows the need for two scores, but the full generality of possible worlds must be supplied by you.
answer: |-
  **Mechanic:** *Definitional commitment evaluated under dual modalities of epistemic uncertainty (world-varies) and counterfactual stability (world-fixed).*

  ### **Setup & Materials**  
  - **Handout 1 (Initial Briefing):**  
    > "You are linguists documenting the indigenous Tirak language. The Tirak use the term **‘KOROK’** in ritual contexts. Field notes show:  
    > - When harvesting *red berries* from Mount Veda, elders say ‘KOROK is abundant this year’.  
    > - In droughts, they bury *clay pots* filled with water and call them ‘KOROK’.  
    > - During festivals, they handle *woven baskets* and chant ‘KOROK holds the offering’.  
    >  
    > **TASK:** Write a rule defining ‘KOROK’ (e.g., ‘objects used in water rituals’). Use observable properties only. This definition is final."  

  - **Handout 2 (Round 2: World-Shift):**  
    > "**NEW FINDINGS:** The ‘red berries’ are actually *insect galls* mistaken for fruit. ‘KOROK’ exclusively refers to *insect galls* in Tirak. The pots/baskets were misidentified; they are called ‘TELOK’."  

  - **Handout 3 (Round 3: Counterfactual):**  
    > "**ALTERNATE SOCIETY:** The *Ariha* tribe uses ‘KOROK’ identically to Tirak’s initial description. In Ariha:  
    > - Red berries *are* fruit (not galls), pots *are* sacred, and baskets *are* ritual objects.  
    > - All three are called ‘KOROK’ and share no physical traits (berries aren’t clay/weave)."  

  - **Scoring Sheets:** Grid for self/peer scoring (1–5 pts per round).  

  ---

  ### **Timeline (85 min + 5 buffer)**  
  1. **Intro & Definition (10 min):** Distribute Handout 1. Students write *unshared* definitions. Collect.  
  2. **Round 2: World-Shift (25 min):**  
     - Distribute Handout 2. Return definitions.  
     - **Scoring:** "Does your definition match *actual* Tirak ‘KOROK’ (insect galls)?" Self-score (5 min).  
     - Pair exchange: Peer validates score ±1 pt if disputed (5 min).  
  3. **Round 3: Counterfactual (25 min):**  
     - Distribute Handout 3. Keep original definitions.  
     - **Scoring:** "Does your definition include *all* Ariha ‘KOROK’ (berries, pots, baskets)?" Self-score → peer audit (as above).  
  4. **Score Tabulation (5 min):** Instructor projects anonymous results:  
     - "Definition A: World-Shift 4/5, Counterfactual 1/5"  
     - "Definition B: World-Shift 1/5, Counterfactual 5/5"  
  5. **Debrief (20 min):** Structured discussion:  
     - **Axis 1 (World-Shift):** "When facts changed, why did ‘insect galls’ definitions win? You fixed reference to *discovered essence*." → Maps to **secondary intension** (world-bound).  
     - **Axis 2 (Counterfactual):** "Why did ‘ritual objects’ definitions win in Ariha? You followed *initial criteria* regardless of facts." → Maps to **primary intension** (epistemic/contextual).  
     - **Crush Objections:**  
       - *"This is just Kaplan relabeled!"* → "Kaplan’s ‘content’ is world-relative but *singular*. Here, ‘KOROK’ has two *simultaneous* extensions: one rigid (galls), one flexible (ritual roles)."  
       - *"Only indexicals need this!"* → "Your ‘KOROK’ had no indexicals, yet split: in Tirak it *is* galls, in Ariha it *isn’t*. ‘Water’/‘gold’ behave identically."  
  6. **Conclusion (5 min):** "Natural kinds have two extensions: what they pick out in *our world* vs. what we *would* pick out if the world differed. Neither reduces to the other."  

  ---

  ### **What Will Go Wrong & Fixes**  
  - **Problem:** Students write overly broad definitions (e.g., "anything sacred").  
    - **Fix:** Pre-empt by requiring "testable criteria" (e.g., "used in water rites") in Handout 1. Reject non-empirical definitions.  
  - **Problem:** Peer scoring disputes.  
    - **Fix:** Allow ±1 pt adjustments only; instructor arbitrates deadlocks swiftly.  
  - **Problem:** "Ariha feels artificial."  
    - **Fix:** Stress: "Ariha isn’t ‘Twin Earth’—it’s how *we* would apply ‘KOROK’ if *our* world had Tirak’s initial appearance."  

  ---

  ### **What the Game Can’t Replicate**  
  **You must explain:** The *modal stability* of secondary intensions (e.g., "In *all* worlds, ‘KOROK’ refers to galls *in Tirak*"). The game’s "counterfactual" round resets the entire world (Ariha ≠ Tirak), not the same world under different possibilities. Clarify post-game that secondary intensions track *rigid designation* within a world, while primary intensions track *epistemic access* across worlds.  

  **Result:** They’ll feel the split *before* labeling it—and see why "water is H₂O" doesn’t resolve what we *mean* by "water".
