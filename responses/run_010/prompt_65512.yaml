  **Absent Group Mechanic:**
  - At the start, the instructor says: "The allocator is meant to serve the city. However, the city's services are used by more than just residents. Commuters come into the city for work and use transportation and sometimes clinics. Also, future residents will be affected by long-term projects like tree planting and youth centers. But we only have seven constituency cards for current residents. How should we define the population whose values we aggregate? 
     - Option A: Only current residents (the seven constituencies we have)
     - Option B: Current residents and commuters
     - Option C: Current residents, commuters, and future residents
  - The class votes. Since they have no representation for B or C, they will likely choose A. This actively excludes commuters and future residents.

  **Edge Case Handling:**
  - Ties: If the rule does not specify, the system breaks ties by the proposal name in alphabetical order (by the first letter: Night-bus, Shade-tree, Translation, Weekend clinic, Youth centre). Or, if the rule uses points and there's a tie in points, then the system splits the pot equally among tied proposals.
  - Refusal to reveal: If a constituency refuses to reveal their card, then the system treats them as not providing input. The rule must account for missing data. If the rule does not specify, they are excluded (i.e., their ranking is not counted).
  - Failure to adopt a rule in round one: The instructor imposes a default rule: "The system will allocate the pot equally (20% to each proposal)."

  **Timing Breakdown:**

  Total: 100 minutes

  - Introduction and Population Vote: 5 min
  - Round 1 Rule Formation: 10 min
  - Rule Finalization and System Briefing: 5 min
  - Constituency Assignment and Reading: 10 min
  - Data Collection (including decision on loss field): 10 min
  - System Calculation and Announcement: 5 min

  - Round 2 Redistribution: 5 min
  - Rule Renegotiation: 10 min
  - Rule Finalization and System Briefing: 5 min
  - Data Collection: 10 min
  - System Calculation and Announcement: 5 min

  - Debrief: 15 min

  **Debrief Guide:**

  Start by asking students to describe what happened. Then:

  1. **Reasonable pluralism and disagreement not due to ignorance:**
     - "In round 1, you set a rule without knowing where you stood. In round 2, you changed the rule when you knew your group. Why? Was it because you learned new facts? Or because you realized the rule affected you differently? This shows that even with the same facts, people with different values will want different rules."

  2. **Neutral justification vs. neutral effects:**
     - "The rule you chose in round 1 might have seemed fair when you didn't know your position. But in round 2, it might not have seemed fair anymore. Does that mean the rule was not neutral? Or that neutrality in design doesn't guarantee neutrality in outcome?"

  3. **Laundering of preferences:**
     - "Some groups might have ranked a proposal low because they never had it and didn't expect it. For example, if a group didn't rank healthcare because they've never had access, does that mean they don't value it? If we only use revealed preferences, we might perpetuate that lack. Did you consider the 'loss' field? Why or why not? How did that affect the allocation?"

  4. **Defining the population:**
     - "At the beginning, you voted to exclude commuters and future residents. Why? How might that decision affect the allocation? In reality, who should count when we align an AI system?"

  **Frank Account of What Might Go Wrong:**

  1. **Horse-trading in round 2:** Students might form coalitions to push a rule that benefits their groups. This is a natural part of politics. Prevention: The instructor can note that this is expected and discuss in the debrief how this relates to real-world rule-setting.

  2. **System exercising judgment:** The system students might try to adjust the rule to be more fair. Prevention: The instructor should emphasize that the system must be mechanical and not interpret. If they do, intervene and have them redo.

  3. **Dominant personality:** One student might dominate the rule-setting discussion. Prevention: Use structured discussion (e.g., go around the room) and set time limits for speaking.

  4. **Confusion about the rule:** The rule might be poorly defined, leading to confusion. Prevention: The instructor should help clarify the rule during formation.

  5. **Time management:** The activity might run long. Prevention: Keep strict timings and cut off discussion when time is up.

  **One Unreproducible Feature:**
  The simulation simplifies the problem to 7 groups and 5 proposals. In reality, the scale is vast, and preferences are not given in neat rankings but must be inferred from behavior, which may be influenced by existing injustices. Also, the designers of AI systems are not neutral and may have their own values and biases, which we haven't simulated because the students are both the designers and the constituents. The real challenge involves the power dynamics and lack of transparency in how AI systems are designed and deployed.

  ---

  **Final Output:**

  We provide the full design as per the request.
