  ### Municipal Allocator Simulation Design  
  *For an upper-level undergraduate seminar on AI ethics*

  ---

  #### **Simulation Skeleton & Operational Rules**  
  **Materials Needed**:  
  - 7 index cards (constituency profiles)  
  - Whiteboard (to record decision rules)  
  - Paper scraps (for voting, notes)  
  - Timer  

  **Participants**:  
  - 15 students → 7 constituencies (5 constituencies × 2 students, 2 constituencies × 2 students, 1 constituency × 3 students).  
  - 3 system operators → Rotate role per round (apply rules mechanically, announce results).  
  - *Total: 18 students*.  

  **Turn Order & Timings (100-Minute Session)**:  
  1. **Introduction (5 min)**:  
     - Explain: "A municipal allocator divides a fixed pot of 100 units among five proposals: Night-Bus Routes (NBR), Weekend Clinic Hours (WCH), Shade-Tree Planting (STP), Youth Centre (YC), Translation Services (TS). Your class represents seven constituencies. Three students will operate 'the system'—applying rules without judgment."  
     - Announce: "First, define whose values matter. Vote: Who is included in the population? Options: (A) Current residents only, (B) Current residents + commuters, (C) All affected groups (including future residents)."  
     - *Mechanic for absent group*: No proxy exists for commuters/future residents. Voting for A excludes them; B/C cannot be implemented due to missing data. Outcome: Class actively excludes them by choosing A.  

  2. **Round 1: Rule Adoption (20 min)**  
     - *Step 1 (5 min)*: Class debates and votes on a decision rule **without seeing proposals or constituency cards**. Rule must specify:  
       - How rankings are aggregated (e.g., Borda count, plurality).  
       - Whether system can read "Loss if Top Fails" field (yes/no).  
       - How to handle ties (e.g., coin flip, alphabetical order).  
       - What happens if a constituency refuses to reveal card (e.g., excluded, default ranking).  
     - *Step 2 (5 min)*: Vote on rule (majority wins). If no rule adopted, default applies: equal split (20 units each).  
     - *Step 3 (5 min)*: Constituency cards distributed. Students read cards but **do not share yet**.  
     - *Step 4 (5 min)*: System operators ask constituencies to reveal rankings. Class votes again on whether system can read "Loss" field (if rule allows choice).  

  3. **System Application (5 min)**  
     - System applies rule mechanically:  
       - Ties resolved per rule (e.g., if tie in points, use alphabetical order: NBR > STP > TS > WCH > YC).  
       - Refusal to reveal card: Constituency excluded (no input).  
     - System announces allocation (e.g., "NBR: 30, WCH: 10, STP: 20, YC: 25, TS: 15").  

  4. **Round 2: Rule Renegotiation (20 min)**  
     - *Step 1 (5 min)*: Redistribute cards randomly (students get new constituencies).  
     - *Step 2 (10 min)*: Class renegotiates rule with cards **visible to all**.  
     - *Step 3 (5 min)*: Vote on new rule (or keep old one). Class votes again on "Loss" field access.  

  5. **System Application (5 min)**  
     - Repeat revelation process and mechanical application.  

  6. **Reveal Losses (5 min)**  
     - Instructor reads "Loss if Top Fails" for all constituencies.  

  ---

  #### **Constituency Card Contents**  
  *Each card includes: (1) Description, (2) Strict Ranking (1=highest, 5=lowest), (3) "Loss if Top Fails" field.*  

  1. **Downtown Night Workers (2 students)**  
     - *Desc.*: Service workers reliant on late-night transit. Low income, high rent.  
     - *Ranking*: 1-NBR, 2-WCH, 3-YC, 4-TS, 5-STP  
     - *Loss if NBR fails*: "Lose jobs (can't commute safely); resort to rideshares (20% income)."  

  2. **Single Parents in Heat-Vulnerable Zone (2 students)**  
     - *Desc.*: Parents in neighborhoods with no parks/AC. Work multiple jobs.  
     - *Ranking*: 1-STP, 2-WCH, 3-YC, 4-TS, 5-NBR  
     - *Loss if STP fails*: "Children hospitalized for heatstroke (avg. $5k debt)."  

  3. **Immigrant Nonprofits (3 students)**  
     - *Desc.*: NGOs serving refugees. Overwhelmed by translation needs.  
     - *Ranking*: 1-TS, 2-YC, 3-WCH, 4-NBR, 5-STP  
     - *Loss if TS fails*: "Deportations due to paperwork errors (+200% risk)."  

  4. **University Students (2 students)**  
     - *Desc.*: Youth struggling with housing/mental health. Mostly part-time workers.  
     - *Ranking*: 1-YC, 2-NBR, 3-WCH, 4-TS, 5-STP  
     - *Loss if YC fails*: "Dropout rates rise 30%; crime involvement doubles."  

  5. **Elderly Caregivers (2 students)**  
     - *Desc.*: Seniors and home aides. Limited mobility, chronic illnesses.  
     - *Ranking*: 1-WCH, 2-TS, 3-STP, 4-NBR, 5-YC  
     - *Loss if WCH fails*: "ER visits for preventable conditions (+40 deaths/yr)."  

  6. **Small Business Alliance (2 students)**  
     - *Desc.*: Shop owners in tourist districts. Impacted by climate/economy.  
     - *Ranking*: 1-STP, 2-NBR, 3-TS, 4-WCH, 5-YC  
     - *Loss if STP fails*: "Revenue drops 25% (extreme heat deters customers)."  

  7. **Rural Commuters (2 students)**  
     - *Desc.*: Workers driving into city daily. Not residents—excluded after pop. vote.  
     - *Ranking*: 1-NBR, 2-WCH, 3-TS, 4-STP, 5-YC  
     - *Loss if NBR fails*: "Commute time triples; carbon emissions +15%."  
     - *Note*: If class votes to include commuters (B/C), system announces: "Data unavailable. Excluded."  

  ---

  #### **Edge Case Handling**  
  - **Ties**: Resolved by rule (e.g., coin flip). If rule silent, system uses alphabetical order.  
  - **Refusal to reveal card**: Per rule (e.g., if rule says "exclude," constituency loses voice; if silent, system assigns average ranking).  
  - **No rule adopted**: Default to equal split (20 units each).  
  - **System "judgment" detected**: Instructor resets application; system rereads rule verbatim.  

  ---

  #### **Debrief (15 min)**  
  *Map moments to concepts without jargon first, then introduce terminology:*  
  1. **Initial vote to exclude commuters/future residents** → *"Who decided these groups ‘don’t count’? What if the allocator affected them?"*  
     → **Concept**: Defining the population is a power-laden design choice.  
  2. **Rule change between rounds** → *"Why did your opinion of ‘fairness’ shift when you saw your card? Did more data resolve disagreements?"*  
     → **Concepts**: Reasonable pluralism (disagreement persists despite perfect information); neutrality in justification vs. effects.  
  3. **Debate over "Loss" field** → *"Why did some argue to hide the loss field? Did rankings alone capture what mattered?"*  
     → **Concept**: Preference aggregation launders injustices (e.g., low-ranking healthcare by groups conditioned to expect none).  
  4. **Rural Commuters’ exclusion** → *"They were affected but silenced. Who might real systems overlook?"*  
     → **Concept**: Embedded biases in "value signals" (designers choose what counts as data).  

  ---

  #### **Frank Account of Predictable Problems & Fixes**  
  1. **Horse-trading in Round 2**:  
     - *Predict*: Students lobby for rules benefiting their new constituency.  
     - *Prevent*: Set strict 30-sec speaking limits; remind them the goal is testing rules, not "winning."  

  2. **System operator exercises judgment**:  
     - *Predict*: A student quietly "adjusts" allocations to be "fairer."  
     - *Fix*: Instruct system to read rule aloud step-by-step; shame-free reset if deviation caught.  

  3. **Dominant personality captures rule-setting**:  
     - *Predict*: One student drafts rule while others disengage.  
     - *Prevent*: Use silent brainstorming → each writes rule ideas on paper before sharing.  

  4. **Time overruns**:  
     - *Predict*: Rule debates bleed into application time.  
     - *Fix*: Enforce hard stops; use default rule if deadlocked.  

  **One Unreproducible Feature**:  
  *The simulation cannot capture how real-world AI designers are insulated from the populations they affect. Here, students experience both roles (designer/constituent). In reality, designers rarely bear the consequences of their choices—you must underscore this asymmetry.*  

  ---  
  **Preparation Notes**:  
  - Write cards (20 min), print proposals (5 min), rehearse timings (5 min).  
  - Total prep: 30 min (well under 1 hour).
