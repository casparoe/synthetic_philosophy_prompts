  The user needs a precise term or a newly coined concept with clear boundaries. They want a thorough analysis, not just a label, because they need to accurately portray this in their novel. Their deeper need is to ensure the philosophical and economic concepts in their book are robust and credible, especially since they're building the third act around this paradox. They might also be frustrated with their economist friend's vague hints and want definitive clarity to move forward with confidence.

  First, recall related concepts. Goodhart's Law is about measures becoming useless when targeted, but here the issue isn't targeting—it's the prediction's publication itself changing outcomes. Self-fulfilling prophecy fits partly, but typically starts with a false belief; here the prediction could be initially accurate. Performativity involves theories shaping reality, but doesn't inherently imply reduced accuracy with increased authority.

  The key elements here are: the prediction's credibility alters behavior, which affects the outcome, and the market's recommendation prevents testing its counterfactual. This resembles the observer effect in physics, but social sciences might have better analogues. Reflexivity in economics (Soros) involves feedback loops between beliefs and reality, which is close. The Lucas critique also deals with policy changes altering behavioral parameters, affecting model reliability. 

  However, reflexivity often allows for either self-fulfilling or self-negating outcomes, while the user emphasizes the latter—where credibility destroys accuracy. The conditional prediction market setup adds complexity because the policy recommended isn't compared to alternatives, so there's no counterfactual for validation. 

  The term "self-undermining prophecy" might fit best, but needs precise conditions. It's distinct because the prophecy undermines itself through publication, not initial falsehood. Boundary cases: a market predicting a bank failure at 30% leads to panic and failure (self-fulfilling), but the user's focus is on the ceasefire prediction at 80% leading to withdrawal of support and collapse (self-undermining). The governance twist is key: obeying the market prevents testing its judgment, forcing blind trust.

  For a new coinage, "Hanson's Paradox" could work, but the user might prefer an established term. Since established terms don't perfectly fit, defining a new concept with necessary conditions is better. Conditions: 1) Public prediction influences behavior. 2) This influence alters the outcome. 3) Outcome change validates/invalidates the prediction. 4) The mechanism prevents counterfactual testing. Exclusions include targeted optimization (Goodhart) and purely false-start prophecies.

  The user needs this for their novel's third act, so clarity on why this isn't just reflexivity or performativity is crucial. Emphasize that the market's authority erodes its testability, creating a vicious cycle. Providing boundary cases helps them delineate the concept in their narrative. Committing to "self-undermining prophecy" as the core idea, while acknowledging near-misses like reflexivity, balances precision with academic grounding.
answer: |-
  Your configuration is both profound and coherent – it captures a genuine, underappreciated paradox at the heart of authoritative prediction systems, especially when applied reflexively to governance. **The single most fitting established name is Reflexivity (specifically in the George Soros sense), but it requires sharpening to fit your governance twist. For maximal precision, I propose coining the term: "Epistemic Collapse via Reflexive Authority" (ECRA).**

  Here's the dissection, justification, and carving:

  1.  **Why Reflexivity (Soros) is the Closest Established Concept:**
      *   **Core Idea (Soros):** In social systems (especially finance), participants' *perceptions* (beliefs, biases) influence the *fundamentals* they are trying to perceive, creating a feedback loop. There's no objective reality independent of the observers' beliefs acting upon it.
      *   **Fit:** Your bank failure and ceasefire cases are textbook reflexivity:
          *   The market prediction (perception) becomes public.
          *   Actors (depositors, peace funders) *act* on this perception.
          *   Their actions *alter* the fundamental reality (causing the bank run/withdrawal of support).
          *   The altered reality *confirms* (or refutes) the initial perception, reinforcing the loop.
      *   **Why it Needs Sharpening:** Soros's reflexivity is broad and often discussed in markets/finance. It doesn't inherently emphasize the *specific governance twist*: the market foreclosing the counterfactual test *of its own recommendation*. Reflexivity *encompasses* self-fulfilling and self-defeating prophecies but doesn't explicitly name the *loss of testability* under authority. It also doesn't inherently highlight the *decreasing reliability with increasing credibility* as a structural feature.

  2.  **Why Your Alternatives Are *Near* But Not Perfect:**
      *   **Goodhart's Law:** You correctly identify the mismatch. Goodhart is about *corruption through optimization pressure* ("When a measure becomes a target, it ceases to be a good measure"). In your cases, the corruption happens *simply through publication and belief*, without anyone necessarily trying to "beat" or "optimize" the measure. The measure distorts the system by being *authoritative*, not by being *gamed*.
      *   **Self-Fulfilling/Self-Defeating Prophecy:** These are *subtypes* within reflexivity.
          *   **Self-Fulfilling:** The bank run case fits perfectly (belief in failure causes failure).
          *   **Self-Defeating/U*ndermining:** Your ceasefire case is the key innovation here – a *self-undermining prophecy*: a belief in a high probability of success (ceasefire) leads to actions (withdrawing support) that cause the failure. Crucially, as you note, the belief *was likely well-calibrated based on available info before publication*; publication destroyed its calibration.
          *   **The Gap:** These terms focus on the *outcome* (fulfilled or defeated), not the *mechanism of lost testability* inherent in the governance application. They are instances, not the overarching structural paradox of credibility destroying testability.
      *   **Performativity (Callon/MacKenzie):** This is very close conceptually. It argues economic theories/models/technologies don't just *describe* reality, they *shape* it ("perform it into being"). A prediction market is a performative device.
          *   **The Gap:** Performativity, as commonly discussed, is often value-neutral or even positive – models *create* the realities they describe, enabling markets and actions. It doesn't inherently contain the negative feedback loop where *increased authority/credibility systematically degrades accuracy and destroys the possibility of validation*, especially the counterfactual foreclosure. Your governance twist highlights a *pathological* form of performativity specific to authoritative, reflexive prediction systems.

  3.  **The Governance Twist & Epistemic Collapse:**
      *   This is the crux where existing terms falter. The market recommends Policy A because it predicts higher welfare under A than B. But *by following the recommendation*, Policy B is never implemented. **There is no counterfactual reality against which to judge the market's core conditional judgment ("Welfare under A > Welfare under B")**. We only see the outcome under A. Did the market get it right? *We can never truly know.*
      *   **This creates a vicious cycle:**
          1.  The market's authority leads to its advice being followed.
          2.  Following the advice destroys the evidence needed to validate the advice.
          3.  The lack of validation *forces* reliance on the market's authority (since there's no alternative evidence).
          4.  Increased reliance/authority repeats step 1, intensifying the problem.
      *   **Reliability decreases as credibility increases:** The more completely the market is trusted and obeyed (high credibility), the less opportunity there is to test its counterfactual judgments (low testability), and thus the less *demonstrably* reliable it becomes. Its authority rests on a foundation it systematically erodes.

  4.  **Proposed Coinage: Epistemic Collapse via Reflexive Authority (ECRA)**
      *   **Necessary Conditions:**
          1.  **Authoritative Prediction:** A system issues predictions (probabilities, recommendations) that are granted significant authority within a social/political system.
          2.  **Public Dissemination:** These predictions are widely known and believed by relevant actors.
          3.  **Reflexive Action:** Actors alter their behavior *based* on the authoritative prediction.
          4.  **Reality Alteration:** The altered behavior *changes* the fundamental reality the prediction was about (e.g., causing a bank run, undermining a ceasefire).
          5.  **Validation Distortion:** The outcome is interpreted as validating or refuting the *initial* prediction, despite the prediction itself being a major causal factor in the outcome.
          6.  **(Governance Specific): Counterfactual Foreclosure:** In systems recommending actions (like futarchy), *obeying* the recommendation *eliminates the possibility* of observing the counterfactual scenario necessary to validate the core conditional judgment upon which the recommendation was based.
          7.  **Epistemic Degradation:** The cycle inherent in conditions 1-6 systematically *reduces* the system's testability and demonstrable reliability *as a direct consequence* of its increased authority and credibility.
      *   **Explicit Exclusions:**
          *   Instances where a prediction is *deliberately gamed* or *optimized against* (Goodhart's territory).
          *   Predictions that are *initially false* and become true *only* because of belief (classic self-fulfilling prophecy). ECRA includes cases where the prediction was *initially accurate* before publication.
          *   Performativity that *stabilizes* or *enables* a system without degrading its own epistemic foundation.
          *   Observer effects where the *measurement* disturbs the system but doesn't involve *social actors reflexively acting on beliefs derived from the measurement* (e.g., measuring an electron's position).
      *   **Boundary Cases:**
          *   **Clearly ECRA:** Your ceasefire case. Prediction: 80% chance of ceasefire. Belief leads to withdrawal of support. Ceasefire collapses. Prediction scored "inaccurate" *because* it was believed and authoritative. Calibration destroyed by credibility.
          *   **Clearly Not ECRA (Goodhart):** A hospital is rated on patient wait times. To improve its rating, it rushes patients through triage, leading to worse overall care. The measure (wait time) was gamed and corrupted as a target.
          *   **Edge Case (Self-Fulfilling but not full ECRA):** Market predicts Bank X failure at 90%. Panic ensues, bank fails. Classic self-fulfilling prophecy. It *lacks* the crucial element of the prediction likely being *well-calibrated before publication* and the specific *governance twist* of counterfactual foreclosure. It fulfills ECRA conditions 1-5 but not necessarily 6 & 7 in their full force.
          *   **Edge Case (Governance Lite):** A corporate prediction market forecasts higher profits from Strategy A vs B. CEO follows A. Profits rise. We never see Strategy B. Is this ECRA? Arguably yes, weakly. The counterfactual (B) is foreclosed. We don't know if A was *truly* better than B, only that A worked. The epistemic degradation is present but less severe than in state governance. It highlights that ECRA operates on a spectrum based on the authority of the system and the significance of the foreclosed counterfactual.

  5.  **Why Commit to ECRA (and What's Given Up):**
      *   **Why:** It precisely names the core mechanism you've identified: the **epistemic collapse** (loss of testability, demonstrable reliability) caused by the **reflexive** nature of actors believing and acting upon the system's predictions, which is inherent in its granted **authority**. It explicitly captures the governance twist and the inverse relationship between credibility and testability.
      *   **What's Given Up:**
          *   The immediate recognizability of terms like "reflexivity" or "self-fulfilling prophecy." ECRA requires explanation but offers greater precision.
          *   Some connection to the broader "performativity" literature. ECRA focuses on the pathological, self-destructive subtype within performativity.
          *   Direct lineage to Hanson/futarchy criticism (though ECRA *explains* a critical flaw within it). Hanson discusses manipulation/manipulators, but ECRA captures a systemic flaw inherent even *without* bad actors.

  **Conclusion:** Your economist friend is likely gesturing towards **Reflexivity** or **Self-Fulfilling/Self-Defeating Prophecies**, but these don't fully capture the governance twist and the specific paradox of credibility destroying testability and demonstrable reliability. **Goodhart** and general **Performativity** are adjacent but miss the mark. Your configuration is coherent, devastating for unconditional trust in futarchy, and central to your novel's conflict. **Epistemic Collapse via Reflexive Authority (ECRA)** names the beast: the inherent tendency of an authoritative reflexive prediction system to undermine the very evidence required to sustain its legitimacy, creating a spiral where trust necessitates blindness. Use it, define it sharply in your narrative or an appendix, and let it drive the tension in your third act. It's the logical consequence of blending prediction markets with sovereign authority.
