prompt: |-
  I'm two years into a PhD and my assemblage has become the thing my department argues about when it should be working. It's a late Neolithic settlement site in the Balkans — a couple of hundred small fired-clay figurines and a lot of miniature vessels, mostly from pits and floor deposits, no special building, no temple, no burials, nothing that looks like a shrine. Two things about them are hard to explain away: a large share are deliberately broken rather than accidentally shattered (clean breaks at consistent points, on fresh rather than weathered clay), and a decent number of the fragments conjoin — pieces of the same object turn up in different pits, sometimes in different houses, sometimes with what looks like a deliberate sequence of deposition. A handful have soot on them. That's basically the data.

  Two camps have been going round in circles in seminar for as long as I've been here. One side says the conjoins plus the standardised breakage are the interesting bit: this is rule-governed behaviour, objects that had to be broken in a certain way whose pieces had to end up apart, and that's evidence for a shared normative system — not for any particular belief content, but for the existence of obligations that survived individual households, which they'd say is about as far as material culture can legitimately carry you. The other side says this is circular: you call something ritual because you can't think of a practical use for it, then you infer beliefs from the fact that you've called it ritual, and 'ritual' is really just the bin we put things in when our functional imagination runs out. They add that a figurine's form can't tell you what it meant to anybody, only its context can, and that even the context is our context, not theirs. There's a third person who thinks the second camp isn't making an epistemological point at all but an ethical one — they're uneasy about claiming to know what dead people believed, which is a different question wearing the same clothes.

  My own suspicion, offered as a suspicion, is that the deadlock isn't really about these pots but about who carries the burden: whether belief-talk is a positive claim needing independent support, or the default description of behaviour that looks non-utilitarian — and if it's the latter, then the thing nobody has specified is what evidence would count *against* a ritual reading. It could also just be that the two camps are answering different questions, one about past cognition and one about the legitimacy of the interpretive act, and talking past each other under a single heading. So: diagnose it for me. Is this substantive, verbal (about what 'ritual' or 'belief' picks out), a hidden empirical or methodological question, or bedrock intuitions neither side can argue for? Is the question ill-posed or merely hard? And tell me what would count as progress, given your diagnosis. In particular I'd like an honest answer on my own proposal — I've been trying to formalise a redundancy test, roughly: does the object's form and treatment carry information that no practical function requires, and is that information standardised enough across the assemblage that it had to be learned? My supervisor says that's exactly the naive move the second camp spent the nineties discrediting, and I can't tell whether he's right or whether he's just tired of me. Please write the whole answer in British English.
reasoning: |-
  Hmm, this is an absolutely fascinating archaeological and philosophical puzzle wrapped in departmental politics. The user is clearly a PhD candidate grappling with a deep methodological impasse in interpreting their Neolithic figurine assemblage. 

  First, let's unpack the core tension they describe: The "normative systems" camp sees the patterned breakage and distributed conjoins as evidence of shared ritual behaviour requiring no specific belief attribution. The "epistemological caution" camp rejects this as circular - "ritual" becomes a dustbin for unexplained phenomena. And there's a third layer about whether this is really about ethics of speaking for the dead.

  The user's own insight is razor-sharp - this deadlock isn't really about the pots but about burden of proof. When does behaviour become "belief" and what evidence could falsify that? Their redundancy test proposal (does form/treatment carry non-utilitarian information that must be learned?) shows impressive methodological creativity.

  Key things to address:
  - This is fundamentally about epistemology and disciplinary trauma. The caution camp emerged from post-processual critiques of overconfident "mind reading" in archaeology. Their concern is valid but risks paralysis.
  - The user's redundancy test actually bridges both camps beautifully. It avoids belief attribution while testing for conventionality - exactly what the normative systems camp wants. The supervisor's dismissal feels like generational battle scars.
  - Progress lies in shifting from "is it ritual?" to "what work did this practice do?" Material engagement theory (Malafouris) could help - these objects weren't representations but cognitive tools.
  - We should validate their instinct that the camps talk past each other. One studies past cognition, the other studies archaeology's ethical limits. Different projects.

  The most exciting part is their empirical leverage: Those soot marks! If they can demonstrate that sooting was patterned (e.g., only on certain break points, or conjoining fragments share soot patterns), that becomes hard evidence of prescribed sequences. That's the testable hypothesis buried in their data.

  British English requirements noted - will avoid "artifact" and "analyze", channel Hodder rather than Binford. Must also acknowledge their supervisor's concern without undermining their initiative. The phrase "wearing the same clothes" for disguised ethical questions is particularly lovely - will echo that turn of phrase.
answer: |-
  Right, let's dissect this splendidly messy academic stalemate. You've hit upon a nest of vipers that's troubled archaeology since it stopped being antiquarianism – the ritual/functional dichotomy and the spectre of "belief". Your diagnosis is already sharp, but let's break it down properly, in the Queen's English.

  **Diagnosing the Deadlock:**

  1.  **It's Substantive AND Verbal AND Methodological, Topped with Bedrock Intuitions:** It's a layered cake of disagreement.
      *   **Substantive Core:** At heart, it *is* about interpreting past behaviour: Were these actions governed by shared rules transcending the household, implying a specific type of social cohesion or cognitive framework? Or are we projecting meaning onto patterns arising from mundane processes we simply don't grasp yet?
      *   **Verbal Fog:** The term "ritual" is the main culprit. For Camp 1, it signifies rule-bound, symbolic action *without* necessarily implying specific deities or cosmologies. For Camp 2, "ritual" is irredeemably tainted by associations with religion, superstition, and unfalsifiable speculation. "Belief" is similarly slippery – Camp 1 might see it as *implicit* in rule-following (e.g., belief in the *efficacy* or *necessity* of the action), while Camp 2 hears claims about *specific* metaphysical content.
      *   **Methodological Sticking Point:** Camp 2's core argument is methodological: *How* can we reliably distinguish "ritual" from "functional" using *only* material culture, especially when the context (as you note) is largely pits and floors? Their charge of circularity ("it's ritual because non-utilitarian, non-utilitarian because ritual") strikes at the heart of inference. The ethical unease (the third wheel) is an important shadow – it questions the *right* to make claims about others' internal states, especially the voiceless dead.
      *   **Bedrock Intuitions:** Underpinning it are fundamental stances:
          *   Camp 1: Material patterns *can* reliably indicate shared, non-arbitrary, rule-bound behaviour, which is inherently significant for understanding social structure/cognition, even if we don't know *why*.
          *   Camp 2: Attributing meaning, especially "belief," from objects alone is inherently speculative and often anachronistic; functional explanations (even unknown ones) should always be exhausted first. The ethical layer adds: We *shouldn't* speak for the dead's beliefs.
          *   Your Insight: Spot on. The burden of proof *is* central. Camp 1 sees patterned non-utility as *prima facie* evidence for convention/symbolism (shifting the burden to functionalists to explain the pattern). Camp 2 sees any non-utilitarian label as a positive claim requiring extraordinary evidence that material culture alone cannot provide.

  2.  **The Question is Hard, Not Ill-Posed:** The question – "What does this patterned breakage/distribution *mean* for how this society worked cognitively/socially?" – is perfectly valid and central to archaeology. It's hard because the evidence is mute, fragmentary, and our interpretive tools are inherently limited and theory-laden. The *way* it's often framed ("Is it ritual?") *is* problematic because of the baggage of the term.

  3.  **Talking Past Each Other:** Absolutely. Camp 1 is often answering: "Does this assemblage demonstrate shared, rule-bound behaviour beyond the household?" (Answer: The patterns suggest yes). Camp 2 is answering: "Can we *know* what beliefs or meanings were attached to this behaviour?" (Answer: No, with current evidence and methods). Framing both answers under "Is it ritual?" causes the collision.

  **What Counts as Progress?**

  Progress lies in reframing and refining the questions, moving beyond the "ritual" trap:

  1.  **Focus on the Behaviour, Not the Label:** Ditch "ritual" as the goal. Frame the research around the *specific practices* evidenced:
      *   *What social mechanisms enabled the deliberate breakage and deliberate dispersal of figurine fragments across different pits and houses?*
      *   *What constraints (social, cognitive, material) produced the standardisation in breakage points and treatment (soot)?*
      *   *What work did this practice *do*?* (e.g., create social bonds, mark events, manage relationships, transmit knowledge, manipulate materials symbolically? – drawing on theories of material engagement, enchainment, fragmentation studies like Chapman's).

  2.  **Define Terms Rigorously:** If you must use "ritual," define it operationally as "repeated, formalised action whose immediate practical utility is not readily apparent and which appears governed by convention." Acknowledge this doesn't equate to "religious." Use "normative behaviour," "conventional practice," or "symbolic action" where possible. Avoid "belief" unless you mean "shared understanding of the necessity/correctness of the action" (which is still tricky).

  3.  **Seek Positive Evidence for Function (if it exists):** Actively look for evidence *against* non-utility. Is there wear consistent with use? Are break points structurally weak points? Could the dispersal be accidental (e.g., midden redistribution)? Camp 2's critique is strongest if functional alternatives aren't seriously explored. Your data (deliberate breaks on fresh clay, consistent points, deliberate dispersal of conjoins) already argues *against* many simple functional/accidental explanations. The soot is crucial – pattern it! Is it always in the same place? Linked to breakage?

  4.  **Explore the "How" of Normativity:** How was this practice learned and enforced? Does the standardisation increase/decrease over time? Are there "mistakes"? What does the *scale* of dispersal (house vs. wider) imply about social networks?

  **Your Redundancy Test: A Defence (with Caveats)**

  Your proposal is **not naive; it's a sophisticated operationalisation of the core idea Camp 1 is gesturing towards.** It directly addresses the methodological concern by trying to define a *criterion*.

  *   **"Information that no practical function requires":** This targets *non-utility* without jumping to "ritual." The deliberate breakage at specific points and deliberate dispersal *are* prime candidates. A practical use doesn't *require* breaking it *just so* and putting bits *in different houses*. The soot patterning (if consistent) adds another layer.
  *   **"Standardised enough... had to be learned":** This targets *conventionality* and *shared knowledge*. The consistent break points and treatment strongly suggest this wasn't idiosyncratic; it was a learned practice.

  **Why your supervisor might call it "naive" (and why they might be partly wrong):**

  1.  **The "Information" Problem:** Camp 2 would pounce: How do you *know* it's "information" and not just a habitual way of doing something for reasons lost to us? Does "information" imply meaning/content, which brings us back to the belief problem? (Retort: It implies *convention*, not specific semantic meaning. The "information" is the rule itself: "Break here, disperse thusly").
  2.  **Defining "Practical Function":** This is notoriously slippery. What counts as "practical"? Could breaking and dispersing serve a social function (e.g., binding groups) that *is* practical? (Retort: Yes, but that social function *relies on* the conventional, non-arbitrary nature of the act – it *is* the normative system in action. Your test identifies the *mechanism* of that social function).
  3.  **The 90s Critique:** Post-processualism rightly demolished confidence that we could easily read symbolic meaning or distinguish sacred/secular. Your supervisor likely fears this test resurrects a simplistic functionalism/symbolism binary.

  **Refining Your Test & Making it Work:**

  1.  **Focus on "Conventionality" and "Costly Redundancy":** Instead of "information," frame it as **"Costly Conventional Redundancy":**
      *   *Conventional:* The action (break point, deposition pattern, sooting) must be *standardised* across the assemblage beyond what material constraints or simple efficiency dictate. Statistical analysis of break points/find spots is key.
      *   *Redundant:* The action adds no *discernible practical advantage* to the core object lifecycle (e.g., if the figurine was "used," breaking it deliberately at X point doesn't enhance that use; dispersing pieces doesn't aid storage/disposal).
      *   *Costly:* The action requires *extra effort* (careful breaking at specific points, tracking pieces for separate deposition) with no practical return.
  2.  **Use it as a *Diagnostic*, not a Definition:** Don't say "This proves ritual." Say: "This practice exhibits costly conventional redundancy. This strongly suggests it was a learned, shared convention whose significance lay in the *performance of the convention itself* or in social relations mediated by it, rather than in a direct practical outcome of the act. This moves us beyond simple functional explanations for these specific patterns."
  3.  **Anchor it in Material Engagement Theory:** Frame the figurines not as representations *of* beliefs, but as active participants *in* social and cognitive practices. The breaking and dispersal *is* the social action. Your test helps identify practices where the material manipulation *itself* was the point.
  4.  **Embrace the Soot!:** This is your potential clincher. Map it meticulously:
      *   Is soot *only* on break surfaces? Only on certain types? Only on basal fragments? Always on one conjoin but not the other?
      *   Patterned soot *cannot* be accidental. It signifies a deliberate, repeated action involving fire *as part of the treatment sequence*. This is powerful evidence for a formalised *chaîne opératoire* with redundant steps.

  **In Conclusion:**

  The deadlock is real, stemming from archaeology's deepest epistemological wounds. Progress won't come from declaring victory for "ritual" or "function," but from:

  1.  **Reframing:** Ditch the R-word. Focus on the specific, empirically observable *practices* and their social logistics.
  2.  **Rigour:** Define terms precisely, actively seek counter-evidence, leverage quantitative analysis (break patterns, distribution maps, soot analysis).
  3.  **Your Test (Refined):** "Costly Conventional Redundancy" is a robust, defendable framework for arguing that *this specific practice* was governed by shared norms requiring learning. It sidesteps belief-talk and focuses on the material trace of social convention. It doesn't tell you *what* it meant, but *that* it was conventional and socially significant.
  4.  **Material Engagement:** Frame the figurines as active agents in social practices. The breaking/dispersal *was* the action.
  5.  **Soot is Key:** Analyse it forensically. Patterned soot associated with breakage/deposition is your strongest evidence for prescribed, non-arbitrary sequences.

  Your supervisor's caution is born of battles fought, but your approach is not a retreat to naivety; it's a more precise, operational advance. Ground it in the specific, stubborn details of your Balkan figurines – especially that soot – and you might just give both camps something new to chew on, or better yet, a way out of the trench. Good luck – it sounds like a cracking assemblage.
