prompt: |-
  I'm in a reading group on food and climate — mostly grad students, we meet Tuesdays in a borrowed seminar room — and last week the conversation got completely stuck on one sentence. A guy in the group who used to work for an NGO kept repeating some version of "famines are never about a shortage of food, they're about who has the money to buy it," and he used it twice to shut things down. First time someone argued that Sahel yields are going to drop a lot and adaptation spending is therefore urgent, and he said that was missing the point entirely, because famine is a politics problem, not an agriculture problem. Second time someone said food aid is obviously worth funding, and he said no, it's a distraction, since the food was there all along. Both times he waved at Bengal and Ireland and China and said Sen had settled this fifty years ago.

  I don't think he's making it up out of nowhere. There's clearly a real insight buried in there about entitlements, and about people starving while grain is moving out of the same region. But the sentence he keeps saying seems to be doing several different jobs at once, and I'm pretty sure at least one of them is false. Could you break it into the distinct precise claims it might be standing for — e.g. something about total supply not actually falling, something about total supply not being what determines *who* starves, something about whether crop failure can be a genuine cause at all, something about where blame and responsibility sit, maybe something about what relief has to consist of — and for each one say whether it's a platitude, a substantive but defensible thesis, or just false when you check it against the actual cases? Where the cases disagree with each other I'd like that flagged, since I suspect he's borrowing credibility from the easiest case to cover the hardest one.

  Then tell me which readings, if any, would actually get him his two conclusions about adaptation spending and food aid. I'm a first-year environmental science student so I have a stake in whether he's right about the yields thing, and I want to know whether to keep arguing with him or let it go. Please keep the whole thing under 700 words, as a numbered menu with a one-line verdict attached to each item, and finish with two or three sentences stating what the strongest defensible version of his slogan really is.
