  ## Pantoum: The Wall

  **Recycling Map:**
  1. A: *I saw how the garden wall was leaning* (Observation → Accomplished Fact)
  2. B: *The mortar cracked by winter, soft and grey* (Description → Persistent Evidence)
  3. C: *One stone reset would steady it again* (Individual Solution → Collective Overaction)
  4. D: *The task was small; I had the time today* (Personal Justification → Ubiquitous Motive)
  ...
  → **Final Stanza:** I C J A  
  *(I: Observation of collective state, C: Solution now seen as cause, J: Consequence of multiplicity, A: Initial observation as final, irreversible state)*

  ---

  I saw how the garden wall was leaning.  
  The mortar cracked by winter, soft and grey.  
  One stone reset would steady it again.  
  The task was small; I had the time today.

  The mortar cracked by winter, soft and grey.  
  Another saw the angle, slightly wrong.  
  The task was small; I had the time today.  
  They found a matching stone before too long.

  Another saw the angle, slightly wrong.  
  Each neighbor’s stone seemed just the needed part.  
  They found a matching stone before too long.  
  A quiet pressure gathered in each heart.

  Each neighbor’s stone seemed just the needed part.  
  No single layer felt like surplus, then.  
  A quiet pressure gathered in each heart.  
  The wall is straight. It holds no ivy now. Amen.

  No single layer felt like surplus, then.  
  One stone reset would steady it again.  
  The wall is straight. It holds no ivy now. Amen.  
  **I saw how the garden wall was leaning.**

  ---

  **Mechanics of the Curse:**
  1.  **Scaling Visibility:** The shift from "**One stone**" (Stanza 1) to "**Each neighbor’s stone**" (Stanza 3) and "**No single layer**" (Stanza 4) explicitly shows the multiplication of actors and actions. "**The wall is straight. It holds no ivy now**" (Stanza 4) is the concrete, aggregate outcome *beyond* any individual intent (repair) – sterility replacing life.
  2.  **Harm Outrunning Estimate:** Each actor sees only their own "**matching stone**" (Stanza 2), "**just the needed part**" (Stanza 3). The fresh line "**A quiet pressure gathered in each heart**" (Stanzas 2 & 3) reveals the *shared*, uncoordinated impulse driving the multiplicity. The harm ("**holds no ivy now**") emerges solely from the *number* of "needed parts" added, not from any one being faulty.
  3.  **Decision Untraceable:** Every action is framed as observation ("**saw**"), discovery ("**found**"), or response to perceived need ("**seemed just the needed part**"). The closest to a choice is "**had the time today**" or "**found... before too long**" – mere capacity and opportunity, never a flawed decision. The *doing* is inherent in the observation and the available means.
  4.  **Line Shifts:**  
      *   "**One stone reset would steady it again**" (C): First, a sensible fix. Finally, the ironic *cause* of rigidity and sterility.
      *   "**The task was small; I had the time today**" (D): First, personal justification. Later, the echo of countless identical justifications ("**The task was small**").
      *   "**I saw how the garden wall was leaning**" (A): First, observation prompting action. Finally, the observation now describing the *result* of collective action – the leaning is gone, replaced by a stark, unnatural straightness. The "**I saw**" becomes the record of the curse's inception.
