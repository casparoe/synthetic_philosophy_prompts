  For the note, I'll clarify settled vs. contested: Ambiguity is proven; handling strategic actors is actively researched with no consensus. I'll flag where the story simplifies (e.g., systems do quantify uncertainty, but we ignore it for drama). 

  Narrative execution: Opening mid-session establishes Athena's competence fast—it catches micro-grimaces. Martin's whispered "please, no" to the mirror shows his dread pre-performance. Later, when Sylvia praises Athena for his "dedication," the system recommending Level 4 hydrotherapy becomes the trap snapping shut. The ending—Martin unable to fake through pain, Athena misreading it as "loss of motivation"—crystallizes the impossibility of distinguishing "wants X" from "wants to seem to want X" through behavior alone. 

