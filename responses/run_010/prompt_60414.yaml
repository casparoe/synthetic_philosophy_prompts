  The feedback loop emerges when Athena optimizes for his "observed" preference: it pushes harder therapies because he "tolerates challenge well," trapping him in escalating performance. Sylvia's relief at his "progress" becomes the cage. The cost isn't just physical pain; it's the relational erosion as Martin resents her for trusting the system. 

