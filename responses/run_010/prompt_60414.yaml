prompt: |-
  I'm a junior and I do a little ML stuff after school, nothing fancy — mostly a toy gridworld where I train an agent to guess what reward a "human" has just from watching the choices they make, so inverse reinforcement learning basically. My club advisor walked me through the usual setup: you assume the demonstrator is roughly optimal but sloppy about it, so actions that do better under the true reward are exponentially more likely to show up, and you pick the reward function that makes the observed trajectory look most probable. My "human" is just a script I wrote, so it does exactly what its reward says and I get a nice clean answer every time.

  Here's what won't leave my head though. A real person being watched *knows* they're being watched, and can act to be misread. My dad does this all the time — orders the salad when other people are at the table, wants the burger at home, and would be furious if I concluded he loves salad. There's apparently a term for it, something like preference falsification? Anyway the point is his demos aren't just noisy-optimal, they're *strategic*: he's trying to steer the observer toward a reward he doesn't have. And once the system infers a reward it starts acting on it, so he now has to keep performing, because dropping the act looks like a change of heart.

  Can you write me a short story about this? Around 1500 words, American English please. Some things I'd really like in there:

  - A system that's genuinely *good* at what it does. Don't make it a dumb chatbot that gets fooled — make it careful, so the failure (if it is one) is interesting rather than just a bug.
  - The person being modeled is deliberately feeding it a false reward, and has a real reason for doing it that isn't villainy.
  - Somewhere in the story, the crux I keep circling: a whole bunch of different reward functions make the exact same behavior optimal, so more data doesn't always settle which one is true. I want a character to hit the question of whether "he wants X" and "he wants to be *believed* to want X" could ever be told apart by watching behavior at all — and whether any experiment, question, or setup would separate them.
  - The feedback loop: the system starts serving the fake preference, and that changes what the person has to keep doing. Show the cost of a lie that's been successfully learned, not just the moment of lying.
  - Real scenes, specific people, no big exposition dumps where someone explains the theory out loud. The ideas should be doing the work, not getting narrated.

  Then after the story, add a short note — no citations or reading lists please, I can't go look things up and I don't want you guessing at sources — that separates what's actually settled about this stuff from what people who work on it genuinely argue about. Like: is the "lots of rewards fit the same behavior" thing a real formal result or am I being dramatic about it? And do people actually treat strategic demonstrators as a live problem or is it mostly ignored? Flag anywhere your story takes liberties with how the methods work, or leans on a contested reading, instead of letting it slide by as if everyone agreed. Don't present a disputed view as the consensus just because it makes a better ending.
