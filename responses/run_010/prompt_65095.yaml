  **FEDERAL RECONCILIATION AND MEMORY PROJECT (FRMP)**  
  **APPLICATION FOR CONDITIONAL IMMUNITY – DISCLOSURE COMPLETENESS PATHWAY (DCP)**  
  **Form DCP-7 (Revised: Astorian Calendar 12/07)**  

  **SECTION 1: APPLICANT IDENTIFICATION & ELIGIBILITY**  
  1.1 Full Name (Aliases/Para-Names in Box 17b):  
