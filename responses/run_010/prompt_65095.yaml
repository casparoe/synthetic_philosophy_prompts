  ☐ People's Vanguard (PVF) ☐ Free Astorian Legion (FAL) ☐ Western Shield (WS)  
  ☐ Other (Specify): _____________________ ☐ *Prefer not to associate (See Penalty Schedule DCP-Annex Γ)*  
  1.4 Age at Time of Incident(s):  
  ☐ Under 15 (Proceed to Section 11 for Developmental Capacity Adjustment)  
  ☐ 15-17 (Mandatory Cognitive Recall Assessment attached)  
  ☐ 18+  

  **SECTION 2: INCIDENT SPECIFICATION (Single Event/Continuous Action Window)**  
  *Note: One Form DCP-7 per discrete temporal event (defined as ≤ 6 hours). For prolonged operations (>6hrs), use Form DCP-7L. Duplicate submissions for shared events require cross-referencing in Box 8.4.*  
  2.1 Date of Primary Incident: __ __ / __ __ / 19 __ __  
  2.2 Approximate Duration: ☐ <1hr ☐ 1-3hr ☐ 3-6hr  
  2.3 Location: Village/Town/City: __________________ District: __________________  
  2.4 GPS Coordinates (Estimate Accepted): Lat ______ Long ______  
  *If unknown, describe proximity to landmark (e.g., "300m NW of abandoned coffee silo"):*  
  ________________________________________________________________________  
  2.5 Primary Alleged Violation Type (Check all applicable - *See FRMP Violation Taxonomy, Appendix Δ*):  
  ☐ Unlawful Detention ☐ Forced Displacement ☐ Property Destruction  
  ☐ Torture/Ill-Treatment ☐ Extralegal Killing ☐ Sexual Violence (Specify Subtype in 2.6)  
  ☐ Command Responsibility (Proceed to Section 9)  
  2.6 Incident Synopsis (Initial Narrative - 100 words max. *Full disclosure occurs in Section 6*):  
  ________________________________________________________________________  
  ________________________________________________________________________  
  ________________________________________________________________________  

  **SECTION 3: DISCLOSURE COMPLETENESS SCORE (DCS) ACKNOWLEDGEMENT**  
  *By initialing below, Applicant acknowledges understanding that:*  
  - *Immunity is proportional to the verified Disclosure Completeness Score (DCS) for this incident.*  
  - *DCS (%) = (Verified Disclosed Facts / Total Relevant Facts) × 100.*  
  - *Immunity (%) = DCS (%).*  
  - *Remaining Liability (%) = 100 - DCS (%). This Residual Liability is held in the FRMP Reassessment Escrow Account.*  
  - *Residual Liability may be reactivated upon discovery of new material facts contradicting or supplementing the Applicant's disclosure.*  
  - *DCS is subject to peer-verification via overlapping disclosures (Section 8) and forensic reconciliation.*  
  **Applicant Initials:** ______  

  **SECTION 4: SUBJECTIVE MEMORY ASSESSMENT SCALE (SMAS)**  
  *To calibrate expectation of recall accuracy. Your feelings are valid.*  
  4.1 Clarity of Memory for Incident:  
  ☐ Vivid (Can recall smells, textures, specific dialogue)  
  ☐ General (Sequence of events clear, details fuzzy)  
  ☐ Fragmented (Key moments only, temporal gaps)  
  ☐ Sparse (Emotional impression dominant, factual recall minimal)  
  ☐ Genuinely Do Not Recall (*Must complete Section 10: Circumstantial Reconstruction Effort*)  
  4.2 Contributing Factors to Recall (Check all applicable):  
  ☐ Time Elapsed ☐ Emotional Distress ☐ Substance Influence ☐ Head Injury ☐ Order-Induced Dissociation  

  **SECTION 5: FULL & FRANK DISCLOSURE MATRIX**  
  *Provide exhaustive factual details below. Focus on WHO, WHAT, WHERE, WHEN, HOW. Motives (WHY) are appreciated but not DCS-scored.*  
  5.1 Personal Role & Actions:  
  ________________________________________________________________________  
  ________________________________________________________________________  
  5.2 Direct Co-Participants (Names, ranks, aliases):  
  ________________________________________________________________________  
  ________________________________________________________________________  
  5.3 Victims/Persons Affected (Names if known, descriptors if not):  
  ________________________________________________________________________  
  ________________________________________________________________________  
  5.4 Weapons/Tools Used (Including command/communication devices):  
  ________________________________________________________________________  
  ________________________________________________________________________  
  5.5 Observable Environmental Conditions (Weather, lighting, terrain):  
  ________________________________________________________________________  
  *(e.g., Heavy rain; moon illumination approx. 40%; muddy road)*  

  **SECTION 6: VERIFIABILITY ENHANCEMENT**  
  6.1 Corroborative Evidence Offered:  
  ☐ Physical Artifact (Describe & attach FRMP Evidence Intake Slip): _________________  
  ☐ Named Witness (FRMP Registry No. or Contact Info): _________________  
  ☐ Geographic Marker (Specify): _________________  
  ☐ Temporal Anchor (e.g., "During the radio broadcast of the Cup Final")  
