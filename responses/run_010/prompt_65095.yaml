  **SECTION 9: COMMAND HIERARCHY DISAGGREGATION (Optional DCS Booster)**  
  *Disclose superior officers involved in planning, ordering, or enabling this incident. Verified disclosures may convert Residual Liability into Immunity Credits.*  
  9.1 Name/Rank of Superior: ________________________ Specific Order/Policy: ______________  
  9.2 Evidence/Corroboration Offered: __________________________________________  
  *(Repeat as necessary on Supplementary Form DCP-7CH)*  

  **SECTION 10: CIRCUMSTANTIAL RECONSTRUCTION EFFORT (For SMAS "Do Not Recall" only)**  
  *Even without direct memory, your contextual knowledge aids the National Narrative. Complete honestly.*  
  10.1 Based on unit SOPs/patterns, what LIKELY occurred? ________________________  
  10.2 Who typically gave orders for such actions? ________________________________  
  10.3 Why might this location/time have been targeted? __________________________  

  **SECTION 11: SIGNATURE & UNDERSTANDING**  
  I, ________________________, solemnly affirm that the information provided is complete and truthful to the best of my current recollection and understanding. I acknowledge that my Disclosure Completeness Score (DCS) will determine my percentage of immunity from prosecution for the incident(s) described. I understand Residual Liability persists indefinitely subject to new factual discovery. I consent to the FRMP's use of this testimony for the Historical Record.  

  **Applicant Signature:** ________________________ **Date:** __ __ / __ __ / __ __ __ __  
  **Witness (FRMP Officer):** ____________________ **Badge:** FRMP-□□□□  

  **FRMP USE ONLY**  
  DCS Initial Assessment: ______ %  
  DCS Post-Hearing Adjustment: ______ %  
  Residual Liability Escrow: ______ %  
