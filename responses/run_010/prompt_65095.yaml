  **SECTION 8: PUBLIC ACCOUNTABILITY MODULE (PAM)**  
  *Participation in the Public Hearing is optional but offers a DCS boost of up to 10% for demonstrated contrition and contextualization.* ^2^  
  8.1 Do you consent to a Public Hearing for this incident?  
  ☐ Yes (Proceed to 8.2)  
