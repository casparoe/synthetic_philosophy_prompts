  **FOOTNOTES (Internal FRMP Legal Advisory Annotations):**  
  ^1^ **ADVISORY NOTE (Legal Dept. File #LD/43a):** *Re: Overlapping DCS & Liability Allocation - Potential for competing partial immunities exists (e.g., Applicant A scores 70% on Incident X, Applicant B scores 60% on same Incident. A gets 70% immunity. Does B's 60% apply to the remaining 30%? Or does B only get immunity on the 10% overlap exceeding A's score? Clarify liability cascade protocol urgently. - Sr. Legal Adv. K. Mbeki.*  
  **RESPONSE (Legal Dept. File #LD/43b):** *K. - Priority goes to higher DCS holder on contested facts. Lower scorer's immunity applies only to *new* facts they uniquely provide. Residual Liability sticks to the lower scorer proportionally for their failure to fully disclose what the higher scorer managed. It's mathematically sound, if morally... intricate. - Legal Dir. P. Thorne.*  

  ^2^ **ADVISORY NOTE (Therapeutic Integration Unit #TIU/22):** *Caution re: DCS boost for Public Hearings. Quantifying emotional labor risks performative contrition. Also, a perpetrator weeping at 90% DCS still owes 10% liability - the optics are confusing for victims. Suggest decoupling therapeutic participation from scoring mechanics. - Psych. Lead Dr. A. Chen.*  
  **RESPONSE (Office of the Commissioner #OC/Decree-9):** *A. - The boost incentivizes essential national catharsis. The math must acknowledge the non-prosecutorial value of public tears. The 10% owed maintains accountability principle. Proceed as drafted. - Commissioner R. Vance.*  

  ^3^ **ADVISORY NOTE (Archival Integrity Unit #AIU/77):** *Re: Residual Liability Reactivation - How do we define "new material facts"? If a previously unknown victim's bone fragment is found 20 years later, does that reactivate liability for all applicants scoring <100% on that incident? The escrow accounts could become administratively eternal. - Archivist M. Dubois.*  
  **RESPONSE (Legal Dept. File #LD/102):** *M. - Correct. The escrow is perpetual. A bone fragment *is* a new material fact contradicting the completeness of their disclosure (they omitted killing that specific person). Liability reactivation applies proportionally. Truth is eternal; so is our filing system. - Legal Dir. P. Thorne.*  

