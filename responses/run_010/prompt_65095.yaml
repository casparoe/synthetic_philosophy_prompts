  **SECTION 7: PEER DISCLOSURE CONCORDANCE & RESIDUAL LIABILITY ALLOCATION**  
  *If multiple applicants disclose the same incident, DCS scores will be reconciled. Higher DCS generally retains priority for immunity allocation on shared facts, but Residual Liability may be distributed proportionally based on individual contribution scores.* ^1^  
  7.1 Are you aware of other individuals applying for DCP regarding this incident?  
  ☐ Yes (List FRMP Registry Numbers/Names): ___________________________________  
  ☐ No  
