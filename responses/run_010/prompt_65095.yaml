prompt: |-
  ok here's what I want. write me a parody of an amnesty application form from a fictional truth commission — invent the country, post-civil-war, doesn't matter which — as it would be handed to an ex-paramilitary guy applying for immunity over one particular bad night in 1994. About 800 words, laid out like a real form: numbered sections, checkboxes, little italicised instructions to the applicant, and at least three footnotes where the commission's own legal advisers are visibly arguing with each other.

  the thing I want you to actually build the jokes out of, not just mention: this commission has ditched the yes/no amnesty decision in favour of a Disclosure Completeness Score. you get immunity proportional to how much you told them. 61% disclosed means 61% immune, and the remaining 39% of your criminal liability goes into a holding account that reopens whenever new facts surface. take that mechanism dead seriously and let it generate the texture of the document — what happens when two applicants' scores overlap on the same killing, whether you can buy back points by naming your commander, whether the score is appealable and to whom, what the public hearing is like for a man who arrives already at 90%, what the form asks of someone who was fifteen at the time, what box you tick if you genuinely don't remember.

  it should read as if the commission is sincerely trying to be fair and healing and procedurally immaculate. the satire comes from the form working exactly as designed. the objections should land without ever being named or hinted at in commentary — that only the applicant knows which facts are relevant, that a man weeping on camera in front of a family that never agreed to any of this hasn't been forgiven by anyone, that a truth-commission bargain trades a prosecution for a record nobody can check.

  don't name any real country, real commission, or real person, and don't cite or recommend anything — no sources, no further reading, it's a form not an essay. it should be funny to someone who works on transitional justice and totally followable to someone who's never heard of it. keep the register bureaucratic-therapeutic throughout and dont break character at the end to explain the joke — the signature block should do that work instead.
reasoning: |-
  Okay, the user wants a fictional truth commission amnesty application form based on a unique "Disclosure Completeness Score" system. This is such a creative and darkly humorous concept – they're clearly knowledgeable about transitional justice mechanisms but want to satirize bureaucratic absurdity in post-conflict reconciliation. 

  Hmm, the key challenge is balancing the deadpan bureaucratic tone with layered satire. The user specifically wants the humor to emerge from the system working exactly as designed, without explicit commentary. That's brilliant but tricky – every checkbox and footnote must feel authentic while revealing the inherent flaws.

  The core mechanism (proportional immunity based on disclosure percentage) is gold. I'll let it generate all the dark comedy: overlapping scores creating competing partial immunities, commanders being traded like baseball cards, weepy public hearings where 90% confessors still owe 10% liability. The footnotes are perfect for showing legal advisors arguing about loopholes the commission didn't anticipate.

  Noticing the user wants three specific satirical layers: 
  First, the applicant's dilemma – how does one quantify memories? Hence sections about "Subjective Memory Assessment Scales" and buying back points by naming commanders. 
  Second, the performative absurdity of public hearings – thus the "Non-Transferable Emotional Labor" clause. 
  Third, the fundamental lie that documentation equals justice – embodied by the signature block where "The Record Stands Correct" replaces accountability.

  They mentioned real-world parallels shouldn't be named, so I'm inventing the "Federal Reconciliation and Memory Project" with suitably vague acronym FRMP. The fictional country ("Republic of Astoria") needs just enough detail to feel plausible – coffee exports and mountain geography suggest Central America, but deliberately generic.

  For structural authenticity, I'm mimicking real truth commission forms: 
  - Section headers with bureaucratic jargon ("Full & Frank Disclosure Matrix") 
  - Tiny instructional asides that sound helpful but are terrifying ("...failure to cross-reference may constitute concealment")
  - Checkboxes for atrocities that look like tax return categories

  The footnotes are where the satire bites hardest. Footnote 1 shows lawyers realizing their scoring system creates competing partial immunities. Footnote 2 reveals the commission monetizing disclosures ("...purchase immunity credits"). Footnote 3 admits the whole process sacrifices justice for paperwork ("...liability is mathematical, not moral").

  User absolutely nailed the tone requirement: "bureaucratic-therapeutic". So every line oscillates between trauma counseling ("...your feelings are valid") and cold bureaucracy ("...indicate percentage of moon illumination"). The weeping applicant in Section 8 gets "emotional labor" points – reducing his liability through performative remorse. That's the killer detail.

  Signature block seals it: "The Record Stands Correct" implies truth commissions value archives over actual reconciliation. No need to explain the joke when the form itself does. Perfect.
