  Fallback: If she denies that her view requires average-case hardness, we can ask: "If worst-case hardness were the only thing we had, how would that affect your claim about the structural gap in the world?"

  Question 7: Topic 3 (proof-search and mathematical creativity)
  Main question: "Gödel famously noted that if P equals NP, then we could find proofs in time polynomial in the length of the shortest proof. You've claimed that this would make mathematical creativity cheap. But in practice, we never know the length of the shortest proof ahead of time. How does your claim hold up when we consider that the polynomial we get would be in terms of an unknown quantity?"

  Anticipated answer: She might say that even though we don't know the exact length, we often have bounds, and that in principle, creativity would be reduced to computation.

