  Main question: "You've emphasized that your claim is about the structure of the world, not about how well we perform on tests. But if the gap is structural, shouldn't it show up in practice? For example, shouldn't we see that for some problems, verifying is easy but finding is hard, and that this difficulty isn't just due to our current methods?"

  Anticipated answer: She might say that indeed we do see that, and that the structure explains why we see it.

  Follow-up: "But if we were to develop a method that sometimes finds solutions efficiently for problems that are NP-hard in the worst case — for instance, using heuristics that work well in practice — wouldn't that challenge the idea that the gap is structural? Or would you say that such heuristics are just exploiting the structure in a way that avoids the hard cases?"

