  Fallback: If she contests the example, we can use another: "Consider the problem of factoring integers, which is in NP and not known to be in P. If someone were to discover a polynomial-time factoring algorithm, would that falsify your structural gap? If not, why not?"

  Question 11: (Directly asking for falsifiability)
  Main question: "Finally, to pin this down: you've said that the gap is a structural feature, not about performance. But what observation or argument would count against that claim? For instance, if we were to discover that P equals NP, that would clearly overturn it. But short of that, is there any evidence that could challenge the structural interpretation?"

