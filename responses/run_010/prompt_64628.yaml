  Main question: "Building on that: if the gap is structural, then even when we do manage to solve hard problems efficiently in practice, we must be avoiding the structurally hard instances. But how can we tell the difference between a structural gap and a temporary gap in our knowledge? For example, before the simplex method for linear programming, people might have thought it was structurally hard, but then we found an efficient method in practice — even though it's exponential in the worst case."

