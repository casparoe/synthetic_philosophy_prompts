  Fallback: If she rejects the premise that worst-case doesn't apply to practice, we can ask: "Can you give an example of a real-world problem where the worst-case asymptotic hardness actually manifests as a practical barrier to discovery, even though verification is easy?"

  Question 3: Topic 7 (input parameter)
