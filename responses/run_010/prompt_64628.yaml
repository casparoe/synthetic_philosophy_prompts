  Follow-up: "But before we knew LP was in P, the structural gap view might have predicted that no efficient method exists. In that case, the discovery of the simplex method (which worked well in practice) and then the ellipsoid method (which is worst-case polynomial) would have overturned the structural claim. So doesn't this show that the structural claim is vulnerable to empirical progress in algorithm design?"

