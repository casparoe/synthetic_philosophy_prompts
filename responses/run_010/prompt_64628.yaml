  Follow-up: "But couldn't a proof that is non-constructive in the technical sense still be natural in the ordinary sense? For example, a non-constructive existence proof in mathematics can be explanatory. So why should the technical barrier imply anything about the metaphysical structure of the world, rather than just being about what kinds of proofs we can write?"

