  Fallback: If she contests the practical relevance, we can ask: "In what sense would mathematical creativity be 'cheap' under P=NP, given that we don't know the bound?"

  Question 8: Topic 6 (limits of mechanism without Gödel)
  Main question: "You've distanced yourself from the Lucas-Penrose arguments that use undecidability to argue against computationalism. Instead, you focus on intractability. But what does intractability tell us about the limits of mechanism? After all, if a problem is intractable but still computable, in principle a machine could solve it given enough time and space. How does that challenge mechanism?"

