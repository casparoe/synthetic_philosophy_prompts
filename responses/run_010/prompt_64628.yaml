  Follow-up: "But mechanism is usually an in-principle claim: that the mind is a computational system. Intractability doesn't challenge that; it just says some computations are too slow. So how does your view about the structural gap provide a limit that's relevant to philosophy of mind?"

  What it tests: Tests whether intractability can do the work that undecidability was supposed to do in anti-mechanist arguments.

