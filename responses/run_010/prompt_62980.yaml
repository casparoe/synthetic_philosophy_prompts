answer: |-
  In a municipal water treatment plant, residual pathogens occasionally pass undetected into the supply (effect E). Detection relies on automated sensors: pH electrodes and turbidity sensors. Sensor calibration drift (higher-level property H) systematically increases measurement error, causing E. H is functionally defined as any persistent, correctable deviation from true value exceeding operational tolerance, due to internal sensor changes. Episode 1: E occurs. L1 is a specific pH electrode fault—crystallized salts bridging its internal reference junction, altering voltage output. Episode 2: E occurs. L2 is a distinct turbidity sensor fault—micro-scratches on its optical window refracting the light beam, skewing the scattering reading. The physical causal chain to E is complete at L1/L2: the faulty signal misleads the controller bypassing disinfection. The plant technician, unable to predict or access the myriad specific internal sensor faults (L-tokens), intervenes solely on H: she implements a rigorous calibration schedule using standard solutions. This intervention successfully reduces E across multiple episodes where underlying sensor faults differ significantly (e.g., L1, L2, a clogged turbidity inlet, a degraded pH membrane). No single L-configuration is common to all failing episodes before intervention or all successful episodes after.
  The case pressures the exclusion principle, making holding it costly rather than refuting it outright.

  (a) The premises driving the exclusion argument applied to H, L, and E are:
      (i) *Causal Closure of the Physical (Completeness)*: Every physical effect E has a sufficient physical cause (specifically, a lower-level configuration like L1 or L2) at the time it occurs, and there is no physical effect whose cause is non-physical or requires supplementation by a non-physical cause.
      (ii) *Exclusion Principle*: If an effect E has a sufficient cause C at a time (e.g., L1), then no distinct property or event D (e.g., H) occurring at that same time can also be a cause of E, unless D is identical to C or causally overdetermines E (which is excluded as systematic).
      (iii) *Distinctness of Realized Property*: The higher-level property H (calibration drift) is distinct from any specific lower-level physical realizer configuration L (e.g., L1, L2). H is multiply realizable and functionally defined, not identical to any single L or disjunction of Ls.

  (b) Running the argument: E has a sufficient physical cause at the L-level in each episode (Premise i, Completeness). H is distinct from any specific L (Premise iii, Distinctness). Therefore, by the Exclusion Principle (Premise ii), H cannot also be a cause of E. The verdict is that H (calibration drift) is causally excluded; it is not a genuine cause of E (pathogens passing undetected).

  (c) The case puts pressure on the Exclusion Principle (Premise ii). It does so by raising the price of holding it. Denying H any causal role makes the success of the technician’s systematic intervention targeting H (the calibration schedule) inexplicable *as a causal strategy*, given that it reduces E across episodes with diverse L-realizers and no systematic overdetermination is plausible. Holding the exclusion principle forces us to dismiss the evident efficacy of interventions based on H as illusory or epiphenomenal, conflicting with the successful engineering practice described.

  (d) The best rediagnosis for the defender of the exclusion argument is **causal inheritance**. The defender argues that H *does* cause E, but only because it inherits its causal powers directly from the underlying physical realizer L present on each occasion. When the technician intervenes on H (e.g., calibrating), she is *really* just intervening on the specific, causally efficacious L present at that time (e.g., scrubbing salts or replacing a scratched window). Any causal efficacy attributed to H is fully explained by, and reducible to, the causal efficacy of the L realizing it on that occasion. H itself adds no *extra* causal power. This maintains distinctness (H ≠ L), satisfies completeness (L is the physical cause), and explains the technician's success (she unknowingly manipulates L via H-targeted actions), while denying H any fundamental causal status independent of its realizers.

  (e) The single feature doing the work is the **successful practitioner intervention targeting H across diverse realizers, lowering E without holding any specific L constant**. If this feature is removed (e.g., if the calibration intervention only worked when it coincidentally fixed the *same* L-fault each time, or if it didn’t reduce E at all), the pressure on the exclusion principle vanishes. The argument’s verdict (H is excluded) then appears straightforwardly correct, as there is no successful practice demanding explanation.

  (f) A nonreductive physicalist can plausibly transfer the result back to the mental case. The core argument—that successful intervention at a multiply realizable functional level pressures the exclusion principle—applies similarly. The most promising disanalogy the exclusion defender must overcome is the **apparent ineliminability of the first-person perspective and the causal relevance of phenomenal properties (qualia) in the mental case**. While sensor drift is defined purely by external, third-person observable functional role, mental states like pain are argued to have an intrinsic, subjective "what-it's-like" aspect that seems essential to their causal role (e.g., causing avoidance). The exclusion defender might argue this subjective aspect cannot be functionally defined, isn't multiply realizable in the same way, or cannot "inherit" causal power from the physical, making its exclusion more intuitively compelling than for a purely functional property like calibration drift. Overcoming this requires arguing that causal efficacy relevant to explanation and intervention resides at the functional level, even for mental states, and that subjective aspects either supervene on the functional/physical or are not causally efficacious in the relevant sense.
