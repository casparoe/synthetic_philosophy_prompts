answer: |-
  This pattern is a sharp critique of **idealized agent theories**. While adjacent to existing concepts, it doesn't have a single perfect name. The closest existing labels are the **Different Person Objection** (DPO) and concerns about **stipulation smuggling**, but your points extend them significantly.

  1.  **Your First Point vs. Different Person Objection (DPO):**
      *   **DPO:** Argues the "idealized you" is so different (due to different knowledge/psychology) it's literally *not you*, so its preferences aren't *yours*. (e.g., Parfit, Williams).
      *   **Your Extension:** You identify a *slippery slope within the idealization process itself*. There's no principled stopping point *within the theory* before essential aspects of identity/personhood (like contingent commitments, attachments, ignorance-driven projects) are erased by the very idealization meant to reveal your "true" preferences. This isn't just "different person," it's "idealization *destroys* the subject of the question." **This is "Idealization-Induced Erasure."**

  2.  **Your Second Point vs. Stipulation Smuggling/Circularity:**
      *   **General Circularity:** Concerns that defining "rational" or "informed" already assumes normative content.
      *   **Your Point:** The *specifics* of the idealized deliberation setup (calm/rushed, embodied/disembodied, historical awareness level) aren't neutral technical details; they *determine the outcome*. Crucially, *justifying these specifics requires appealing to the very normative conclusions they are supposed to generate*. The core disagreement hides in the setup. **This is "Stipulative Smuggling."**

  **Coined Term: Idealization Drift**

  *   **Definition:** The phenomenon where progressively idealized specifications within an agent-based normative theory (e.g., "fully informed rational you") either:
      *   **(Drift into Erasure)** Undermine the core identity, values, or agency of the original subject the theory purports to be about, rendering its verdicts irrelevant to them.
      *   **(Drift via Stipulation)** Relocate the substantive normative disagreement into the ungrounded choice of *which specific idealizing conditions* to apply, making the theory circular or question-begging.
  *   **Inside:** Theories defining right action/preference via counterfactual ideal agents (informed desire, ideal observer, reflective equilibrium variants, some contractualism). Problems arise when idealization parameters (knowledge level, rationality model, deliberation context) are crucial yet lack non-circular justification or erode the subject.
  *   **Outside:** Non-idealized theories (e.g., simple subjectivism, some divine command); theories where idealization is minimal/clearly bounded and non-erasing; theories justifying idealization parameters independently (e.g., via fixed rationality axioms not smuggling values).

  **Why this fits:** "Drift" captures the slippery slope nature of erasure *and* the way the normative anchor shifts into the stipulation. It highlights the core issue: the lack of a non-arbitrary, non-destructive stopping point within the idealization process itself.
