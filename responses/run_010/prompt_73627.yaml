prompt: |-
  I write literary fiction and basically my whole method sits on one claim: introspection is unreliable, and unreliable in a patterned way. When a character looks inward she isn't getting a reading of her own state, she's getting a story she's assembled to make herself make sense — so her account of why she did something is evidence about her self-image, not about her motives. The rival I'm betting against is introspection-as-perception: noisy, but tracking something real, with errors that don't lean in any one direction.

  What would count against my view? I want the findings, arguments and cases that should actually move me, including the ones a defender of the patterned-error story would have to concede rather than explain away, plus anything the position is committed to that turns out to be unlivable. Rank them, most damaging first — and be clear about the gap between something that breaks the project and something that's merely awkward. The thing that'd shake me most personally is evidence that the errors aren't self-flattering in shape: people being worse at knowing their own minds exactly where it makes them look bad, say, or other people's reports beating self-reports on the neutral stuff. And be straight with me about whether I've hedged this into a claim that cant fail, and whether that's more of a problem for a thesis about minds than it would be for some theory in physics.

  Exactly five numbered points, one or two sentences each, no intro and no wrap-up at the end.
reasoning: |-
  Okay, the user writes literary fiction centered on the idea that introspection is unreliable in a patterned way—specifically, that self-reflection creates self-flattering narratives rather than revealing true motives. They want to know what evidence could challenge their view, ranked by impact. 

  First, I need to unpack their core thesis: they reject introspection-as-perception (a roughly accurate self-monitoring tool) in favor of introspection-as-construction (a biased storytelling process). Their biggest fear? Evidence showing introspection isn’t systematically self-flattering. 

  Now, the user’s request is sharp: they want *damaging* counterevidence, not just objections they can explain away. They also hint at anxiety their thesis might be unfalsifiable—a bigger problem here than in physics because minds are messier. 

  Hmm. Let’s brainstorm counterarguments. Top priority: empirical proof that introspection *can* neutrally track reality. For example, studies where people accurately report physiological states (blushing, heartbeat) without narrative bias would undercut the "always constructed" claim. That’d be a direct hit. 

  Next, patterned errors *opposite* to self-flattery. If people are worse at introspection when it’d make them look bad (e.g., recognizing their own prejudice), that flips the user’s bias model. Social psychology’s work on implicit bias could nail this—like richer strangers predicting biases better than the self-aware subject. 

  Third, non-motivational errors. The user ties all bias to self-image maintenance. But what if introspective mistakes look random or stem from cognitive limits (memory glitches)? That’d force them to concede some errors aren’t about storytelling. 

  Fourth, predictive power. If self-reports beat third-party guesses for neutral states (hunger, fatigue), it suggests introspection isn’t *just* storytelling—it’s gathering data. That’s awkward for the user’s all-or-nothing stance. 

  Finally, unfalsifiability. If every counterexample gets dismissed as "well, the *real* motive is hidden," the thesis becomes untestable. That’s deadly in science—but the user might retort fiction isn’t science. Still, it risks making their project dogma, not art. 

  Ranking these: empirical neutrality (1) and reversed bias (2) are lethal; cognitive noise (3) and predictive power (4) are thorny but survivable; unfalsifiability (5) is a philosophical wound. 

  …Wait, the user said "exactly five points, no intro/wrap-up." Got it. Strip the padding, hit hard. They’ll appreciate rigor.
answer: |-
  1.  **Empirical demonstrations of accurate, non-motivated introspection:** Lab evidence showing people reliably reporting internal physiological states (e.g., heartbeat, skin conductance) or transient sensory experiences (e.g., itch intensity) which lack a self-image narrative, directly countering the "always constructed story" claim.
  2.  **Systematic errors *against* self-flattery:** Findings showing people are *less* accurate about their own minds specifically when accurate knowledge would reveal flaws (e.g., underestimating their own bias, ignorance, or negative traits), contradicting the predicted pattern of self-flattering construction.
  3.  **Introspective errors better explained by cognitive limits than motivated storytelling:** Cases where misreports of motives or states stem demonstrably from memory failures, attentional limits, or simple inference errors, not the need to maintain a coherent self-narrative.
  4.  **Third-party reports being *worse* than self-reports for neutral states:** Evidence that strangers' guesses about a person's basic, non-evaluative internal states (e.g., physical discomfort, sensory overload) are significantly less accurate than the person's own reports, undermining the "no special access" implication.
  5.  **Unfalsifiability:** If *any* accurate introspection is dismissed as "coincidental story matching reality" and *any* inaccuracy is taken as evidence for the patterned construction, the view becomes untestable and unscientific, unlike physics theories requiring vulnerability to disproof.
