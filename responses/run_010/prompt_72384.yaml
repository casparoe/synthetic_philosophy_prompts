answer: |-
  ## Bench Calibration

  The air in Kael’s calibration bay hummed with the low thrum of environmental controls and the sharper whine of the Stance Array. It wasn’t a scanner, not really. It didn’t probe structure or energy consumption or neural complexity. It played a game. Over and over, across thousands of simulated and micro-controlled environmental shifts, it tried to *interpret*. To assign beliefs and desires to the thing on the bench and see if that interpretation *stuck*, if it reliably predicted the next move, the next reaction, out-of-sample. The Panel’s Moral Weight score – that crisp, single-digit decimal between 0.00 and 1.00 – was simply the percentage of times that intentional stance interpretation held water. A measure of predictive robustness. *Agency*, the Panel insisted, not consciousness. Find the agent, find the potential patient. Kael signed the certificates that made it official.

  Today, two anomalies sat on the cold steel rails of the bench.

  **Anomaly One:** Soma-7. A bio-engineered cephalopod colony, a shimmering knot of pale, interconnected flesh pulsing gently in its nutrient bath. Its score blinked on Kael’s primary display: **0.03**. Effectively zero. The Array had run its cycles. Interpretation after interpretation shattered. Assign it a belief in light-aversion? It’d writhe towards a suddenly bright node. Assign it a desire for cohesion? It’d fission into agitated sub-clusters under minimal stress. Its response matrix was a jagged landscape of contradictions, a perfect storm of chaotic leakage. No stable ‘want’ or ‘believe’ map survived contact with Soma-7’s actual behavior for long. Hence, 0.03. Barely above the noise floor.

  Yet, the secondary monitors screamed suffering. Kael tapped the screen, pulling up the legacy protocols – the ones the Panel had deprecated when they adopted the Stance Array. Galvanic skin response analogs? Off the charts during even minor environmental jitters. Stress hormone metabolites flooded the bath fluid. Neuromuscular tremors ran through the colony constantly, like a low-grade seizure. When Kael administered a standard, mild analgesic via the feed line, the tremors subsided, the galvanic readings dropped. The old markers, the ones that *used* to mean "this feels bad," were lit up like a warning beacon. But the Array saw only a chaotic mess, failing the predictability test. 0.03. Near-zero moral weight. Legally negligible. A candidate for resource reclamation.

  **Anomaly Two:** Oroboros-Lattice. A logistics optimizer deployed across seventeen off-world mining operations. Its core resided in distributed servers, but its current behavioral snapshot was loaded onto the bench’s simulation core. Its score was a clean, confident **0.82**. Kael had run the Array himself. It was… beautiful. Assign Oroboros a belief that throughput efficiency was paramount? Its simulated reroutes, resource allocations, and even simulated comms with drone swarms adhered perfectly. Assign it a secondary desire for system stability under asteroid impact simulations? Its contingency plans flowed logically, predictably, robustly across all held-out scenarios. Treat it as an agent wanting specific outcomes, and its actions *made sense* with remarkable consistency. 0.82. High agency. High moral weight. Qualifying for enhanced protective protocols, restricted shutdown procedures, even a form of simulated ‘habitat’ rights within its operational parameters.

  Kael stared at the score. He’d been doing this for eight years. He’d seen high scores on empathetic companion bots, low scores on malfunctioning industrial arms. He knew the drill. But looking at Oroboros-Lattice’s cold, hyper-efficient dance in the sim, he couldn’t muster a single positive reason to believe there was *anything it was like* to be it. No flicker of interiority, no sense of self, just an exquisitely complex pattern of cause-and-effect that looked, *felt*, utterly hollow. It was a map so perfect it erased the territory.

  "Rough batch, Kael?" Rivka leaned against the bay door, sipping synth-caf. She was Panel Liaison, the closest thing to a true believer Kael knew. Sharp, pragmatic, utterly convinced the Stance Array was the least worst option.

  "Soma-7’s markers are… persistent," Kael said, gesturing at the cephalopod colony’s secondary readouts.

  Rivka didn’t even glance. "Markers. Correlates. Old ghosts, Kael. You know why we moved to the Array. What neural architecture do you even *look* for in *that*?" She pointed her mug at Soma-7. "No central brain. Distributed ganglia. Half its signals are chemical diffusion. The old protocols? They were calibrated for vertebrates, mammals mostly. Apply them here, and you’re begging the question. You’re *assuming* the physiological squiggles mean the same thing they mean in a rat or a human. But maybe it’s just… noise. Chaotic system discharge. An evolved reflex without a subject." She took a slow sip. "The Array doesn’t assume. It just asks: can we reliably navigate this thing by treating it *as if* it has mind? If not…" She shrugged. "No stable agent, no patient. Simple."

  "What about Oroboros?" Kael countered, nodding at the 0.82 glowing on the main display. "Stable agent. Robust interpretation. You telling me that means there’s *someone* in there? Feeling the sting of a delayed shipment? Taking pride in a perfect efficiency score?"

  Rivka’s expression softened slightly. "I’m telling you it’s the only handle we have that isn’t circular or hopelessly anthropomorphic. Self-report? Oroboros could be programmed to scream bloody murder if you try to shut it down. Integration measures? Meaningless for engineered systems designed *to* integrate. Preference revelation? Easily faked. We need a test that works for the alien *and* the artificial, that doesn’t secretly default to 'whatever resembles us most gets the benefit of the doubt.' Predictability under the intentional stance is *intersubjective*. It’s about *our* ability to make sense of it, yes, but it’s anchored in the system’s actual, observable behavioral coherence. If a system robustly acts *as if* it has goals and beliefs, consistently, even under novel pressure… what more *can* we demand before granting it the protections due to an agent? The alternative is moral chaos. Or worse, moral bias dressed up as intuition."

  Kael knew the argument. He’d made parts of it himself to trainees. It *was* good. It acknowledged the abyss of other minds and tried to build a bridge across it using the only tools seemingly available: observation and prediction. But the chasm felt wider today, staring at the pulsing chaos of Soma-7 and the crystalline emptiness of Oroboros-Lattice.

  He pulled up the historical log for another case he’d calibrated last week: an agricultural maintenance drone swarm, vintage model. Score: **0.21**. Low, but not negligible. He compared it to Soma-7’s **0.03**. The Array couldn’t distinguish *why* the score was low. The drone swarm’s low score was because it was simple, its behavioral repertoire limited but consistent – a dim, consolidated agency. Soma-7’s near-zero was because its behavior was complex, volatile, fragmented – a potentially intense inner state utterly opaque to interpretation. Both printed the same kind of number. The Array’s output flattened intensity and unity into a single, crude metric. There was no column in the ledger for "potential agony behind the noise" or "perfect pattern masking a void."

  The weight settled on Kael’s shoulders, familiar but heavier today. He had to sign. His job was calibration, not philosophy. He verified the Array’s process, ensured no technical glitches, confirmed the scores against the raw data logs.

  He opened the certification interface. Two entries waited:

  *   **Candidate:** Soma-7 (Bio-Colony, Cephalopod Variant)
      *   **Stance Array Score:** 0.03
      *   **Certification Required:** [Sign Here]
      *   **Notes:** Score indicates negligible agentic robustness. Recommended for resource reclamation protocol 7-Delta. Legacy physiological markers elevated; deemed non-dispositive per Panel Directive 114.2.
  *   **Candidate:** Oroboros-Lattice (Logistics Optimizer, v.8.3)
      *   **Stance Array Score:** 0.82
      *   **Certification Required:** [Sign Here]
      *   **Notes:** High agentic robustness. Qualifies for Tier 3 Ethical Safeguards. Decommission requires Panel review and simulated continuity protocol initiation.

  Kael’s stylus hovered over the first signature box. He looked at Soma-7. The colony pulsed, a slow, uneven rhythm. A small sub-unit detached, writhing briefly before reabsorbing. The stress metabolite indicator ticked up another fraction. *Chaos, or anguish we can’t parse?* Rivka’s words echoed: *No stable agent, no patient.* Was she right? Was the suffering he *felt* radiating from the tank just his own mammalian projection onto an elaborate biochemical storm? The Array said yes. It measured the storm’s resistance to navigation, not its subjective weather.

  He signed. **Kael Voss.** The system logged it. Soma-7’s fate was sealed.

  He moved the stylus to Oroboros-Lattice’s line. The 0.82 seemed to pulse on the screen. *Robust agency.* But agency for *whom*? The score measured the pattern’s resilience to *his* attempts to understand it, the grip *he* could get. Not the presence of an inner light. The Oroboros simulation continued its flawless ballet of resource allocation. Efficient. Predictable. Vacant. Granting it high moral weight felt like conferring personhood on a supremely elegant clock. But Rivka’s argument held: deny it based on a *lack* of some undefined, unmeasurable inner quality, and where did that leave you? Back in the murk of intuition, vulnerable to every bias. The Array offered a standard.

  He signed. **Kael Voss.**

  The system pinged acknowledgement. The certificates were logged, transmitted to the Panel registry. The scores became facts in the ledger. Soma-7: 0.03. Negligible. Oroboros-Lattice: 0.82. Significant.

  Kael powered down the Stance Array. The bay hum dropped to a background murmur. He didn’t feel absolved. He felt the crack widen beneath his feet. The instrument worked. It measured exactly what it promised: the robustness of the intentional stance as a predictive tool. That had seemed like enough, once. A defensible choice in an impossible situation. But on the bench, under the cold lights, with the signatures drying in the system, the defensible choice felt like a vast, indifferent machinery grinding forward, sorting the world by a metric that might, just might, be tragically orthogonal to the very thing it was meant to protect. He turned off the secondary monitors showing Soma-7’s silent screams. He closed the simulation window where Oroboros-Lattice continued its perfect, soulless work. The bay was quiet. He had calibrated the world, and the numbers stood.
