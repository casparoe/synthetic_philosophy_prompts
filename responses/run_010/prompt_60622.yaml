  For the theories section, luck egalitarianism should say no compensation because her choice led to the disadvantage, even though the odds were state-set—it's still option luck. Anderson's view should argue the work requirement is exclusionary and undermines equal citizenship, especially since she provided necessary care. Premise by premise, around 250 words total.

  The load-bearing feature is the state's incorrect guidance. If removed, both theories might align: luck egalitarianism could see it as brute luck without the choice element, and Anderson still opposes work requirements. But with it, the split occurs because her choice was based on state-provided info.

  Best reply for luck egalitarians: argue the state's error makes it brute luck, as the risk wasn't voluntary. But that might stretch the definition since she still chose. Alternatively, add a floor to cover basic needs. Is it a fix or dodge? It's a dodge if it avoids core principles, but a fix if it incorporates epistemic justice.

  Confidence: Pretty sure the split holds. The state's role creates the tension. Least sure if Anderson's view clearly opposes work requirements here, but her emphasis on non-domination suggests it does. Need to check her writings to confirm, but based on standard interpretations, it should work.
answer: |-
  ### 1. **The Case**
  Maya, a single mother, provided full-time unpaid care for her severely disabled child after state agencies published guidance (based on medical consensus) that such intensive care would likely be needed for 6-12 months. This guidance explicitly stated only paid employment counted toward eligibility for the Temporary Support Program (TSP). After 12 months, her child's condition unexpectedly persisted, requiring ongoing care. Maya now applies for TSP, having depleted savings. The program requires 20 hours/week of paid work for benefits. She cannot meet this while caregiving. The state denies her application, citing the work rule. Maya argues she relied on state-published timelines when deciding not to seek paid work initially.

  ### 2. **Spec Check**
  *   **Welfare-office setting:** Case centers on denial of TSP benefits based on work requirement.
  *   **No trolleys/sci-fi/billionaires:** Realistic scenario of disability caregiving and welfare rules.
  *   **Not lazy/fraudulent/gambler:** Maya made a caregiving choice based on state info, not idleness, deceit, or reckless betting.
  *   **Load-bearing detail:** State published incorrect guidance on care duration *and* defined eligibility solely by paid work. Maya relied on this.
  *   **No smuggled verdicts:** Descriptive terms: "single mother," "severely disabled child," "published guidance," "depleted savings," "denies application." No character adjectives.

  ### 3. **What Each Theory Says**
  *   **Luck Egalitarianism (Dworkin/Cohen Line):**
      1.  Disadvantages from *brute luck* (e.g., child's initial disability) warrant compensation.
      2.  Disadvantages from *option luck* (risks taken voluntarily) do not warrant compensation.
      3.  Maya's *choice* to provide unpaid care instead of securing paid work (and thus TSP eligibility) was a gamble on the state-published timeline. **(Key Premise)**
      4.  This gamble resulted in bad *option luck* (the timeline was wrong).
      5.  Therefore, the state owes her nothing beyond the standard TSP offer (conditional on paid work). Her current disadvantage stems from her choice, not brute bad luck.

  *   **Anderson's Democratic Equality:**
      1.  Justice requires ensuring all citizens can function as equals in society, participating effectively in social and political life, free from oppression and dependency. **(Key Premise)**
      2.  Conditioning essential support (like TSP) on paid work excludes those performing vital *unpaid* labor necessary for society (like caring for a disabled child).
      3.  This exclusion creates a subordinate class (those unable to meet paid work requirements due to necessary caregiving) denied the means for effective citizenship.
      4.  The state's role in publishing the erroneous guidance and defining eligibility solely by paid work compounds the injustice by shaping the rules that lead to exclusion.
      5.  Therefore, the work requirement *itself* is unjust. Maya needs unconditional support to meet her basic needs and function as an equal citizen, irrespective of her past choice about work.

  ### 4. **Load-Bearing Feature**
  *   **The Feature:** State publishing wildly incorrect guidance on care duration *and* defining eligibility solely by paid work, which Maya relied upon.
  *   **Delete it - Luck Egalitarianism:** If Maya chose unpaid care *without* specific state guidance/promises about duration or eligibility rules, her disadvantage looks more clearly like *option luck* (a pure gamble). LE verdict strengthens ("no compensation").
  *   **Delete it - Democratic Equality:** If there was no state-authored guidance/eligibility framework, the injustice of the work requirement *remains* for Anderson. It still excludes necessary unpaid caregivers from essential support, undermining equal citizenship. The state's direct role in misinforming is aggravating but not fundamental to Anderson's core objection to conditional support. **Verdict:** Deleting the feature *weakens* the LE case slightly (removes complicating factor) but doesn't change Anderson's verdict. The core split (work requirement just/unjust) remains driven by the theories' fundamental commitments, *but* the specific feature is crucial for creating the LE "option luck" classification Maya relies on.

  ### 5. **How the Loser (Luck Egalitarian) Attacks**
  *   **The Reply:** Argue that relying on *state-authored* guidance transforms the situation. The state set the odds and defined the rules, making Maya's choice non-voluntary or the resulting luck effectively brute. She reasonably trusted official information; her "gamble" wasn't on fair market odds but on state competence/honesty. This epistemic dependence means the outcome is brute bad luck, not genuine option luck.
  *   **Genuine Fix or Dodge?** This is a **dodge**, but a sophisticated and common one. It stretches "brute luck" beyond its core meaning (unchosen circumstances) to include *outcomes* of choices made under state-misinformation. While it points to a real problem (state culpability), it risks collapsing the brute/option distinction LE relies upon. If *any* choice based on incorrect state info converts outcome luck to brute, LE loses its focus on holding agents responsible for avoidable gambles. It's an *ad hoc* adjustment to avoid a counterintuitive result, not a principled development of the core theory.

  ### 6. **Confidence**
  **High confidence** the core split (LE denies, Anderson grants) is real and not a phrasing artifact. The theories' core commitments (choice/responsibility vs. citizenship/status) drive it. **Least sure** whether Anderson's objection to the work requirement is *sufficiently* grounded *solely* in the need to avoid oppressive exclusion for the caregiver, or if it implicitly relies on the state's role in misguidance making the exclusion particularly egregious. Her core principle likely stands without the state error, but the case highlights it effectively.
