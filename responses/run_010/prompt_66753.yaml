prompt: |-
  I sit on a municipal committee drafting guidance for long-stay visitors, and at our last meeting a colleague ended a disagreement by invoking the proverb "when in Rome, do as the Romans do." The disagreement concerned a draft line telling visiting researchers that they ought to tip restaurant staff at the local rate, join queues in the local fashion, and not cross against the light even when the street is empty. I argued that a settled custom is not thereby a duty, and that some local customs — tipping above all — look less like shared norms than like ways of shifting an employer's costs onto guests. He replied that I had missed what the proverb actually asserts. I would rather have it unpacked than re-litigated: lay out, as a menu, the different claims the sentence could be making — from mere prudential advice about not standing out, through claims about coordination and the expectations one arouses in others, to claims about the respect owed a host community, to something closer to a metaethical thesis on which local practice settles what is right — and for each say whether it is plausible and whether it would genuinely oblige a visitor in each of my three cases. Mark where the readings diverge between tipping, queueing, and an empty intersection; say what the proverb can require when "the Romans" disagree among themselves; and identify any reading on which it fails precisely because the local practice is contested or objectionable.
reasoning: |-
  Okay, the user is on a municipal committee drafting guidance for long-stay visitors and had a disagreement with a colleague about the proverb "When in Rome, do as the Romans do." They want me to unpack the different interpretations of this proverb and analyze how it applies to three specific cases: tipping, queueing, and crossing against the light at an empty intersection.

  The user seems intellectually curious and wants a nuanced analysis rather than just rehashing their argument. They're specifically interested in where the proverb holds weight and where it might not justify obligating visitors. The three cases they mentioned are interesting because they represent different types of norms: tipping involves economic transfers, queueing is about coordination and fairness, and jaywalking relates to safety and rule-following.

  I should approach this systematically. First, I'll break down the proverb into its possible interpretations - from simple prudential advice all the way to metaethical claims. For each interpretation, I'll assess its plausibility and whether it genuinely creates an obligation for visitors. Then I'll specifically examine how each interpretation applies differently to the three cases, since they have different characteristics.

  I need to consider how the proverb functions when there isn't clear consensus among "the Romans" themselves - since local practices are often contested. This is crucial because the user mentioned their colleague might have misunderstood what the proverb actually asserts. I should also address where the proverb fails when local practices are problematic or objectionable.

  For the tipping case, I should acknowledge that it's contentious because it shifts labor costs to customers. Queueing norms are generally about fairness and coordination. The jaywalking example is interesting because it involves safety rules but in a situation with no apparent risk. I'll need to explain why the proverb might apply differently in each situation.

  The user would appreciate seeing where the readings diverge between the three cases, so I'll create a comparative analysis. I'll also identify any interpretation where the proverb fails when the local practice is contested or objectionable - which seems important to their original argument that settled custom doesn't automatically create duty.

  This is a rich philosophical question about cultural norms, obligation, and ethics. I'll provide a thorough analysis that helps them understand the different dimensions of this common proverb, so they can better navigate their committee discussions and drafting of the guidance document.
answer: |-
  Your colleague's invocation of "When in Rome..." is a common rhetorical move, but as you suspect, the proverb packs several distinct (and sometimes conflicting) claims. Let's dissect it as a menu of interpretations, evaluating each for plausibility, obligating force, and application to your three cases (Tipping, Queueing, Empty Intersection), while addressing internal Roman disagreement and problematic practices.

  **The Menu of Interpretations:**

  1.  **Prudential Advice: Avoid Standing Out/Annoyance:**
      *   **Claim:** Doing as locals do minimizes friction, avoids attracting negative attention, prevents causing offense (even unintentionally), and generally makes the visitor's life easier. It's about savvy navigation, not morality.
      *   **Plausibility:** Highly plausible. Cultural faux pas cause real social friction. Standing out can be uncomfortable or even risky in some contexts.
      *   **Obligating Force?** No *duty* in a moral sense. It's pragmatic counsel, not an ethical imperative. A visitor *can* choose to stand out, accepting the social consequences.
      *   **Application:**
          *   *Tipping:* Strong. Servers expect tips; not tipping causes confusion, potential confrontation, and harms the server. Standing out negatively.
          *   *Queueing:* Very Strong. Violating queue norms causes immediate annoyance, social sanction, and disrupts order. Highly visible non-conformity.
          *   *Empty Intersection:* Weak to Moderate. If truly *no one* is around, standing out is minimal. Annoyance is low (no one to be annoyed). Risk of sanction is very low.
      *   **Divergence:** Strongest for queueing (immediate social disruption), strong for tipping (economic impact/expectation), weakest for empty intersection (low visibility/consequence).
      *   **Roman Disagreement:** Advises conforming to the *visible, dominant, or safest* practice to avoid friction. If disagreement is visible (e.g., some queue properly, others don't), advises erring on the side of the more orderly/common/expected behavior.
      *   **Problematic Practices:** Fails as a *justification* for participating in harmful/immoral practices ("Avoiding friction isn't a reason to do wrong"), but the *prudential advice* to avoid standing out might still hold (e.g., not openly criticizing a dictator in their capital is prudent, but not a duty to support them).

  2.  **Coordination & Expectations: Respecting the Social Script:**
      *   **Claim:** Local customs function as coordination devices solving collective action problems (like orderly queueing) or setting shared expectations (like tipping as part of service compensation). Violating them disrupts these systems and frustrates the reasonable expectations of locals who rely on the script.
      *   **Plausibility:** Very plausible for many customs, especially queueing and traffic norms. Explains *why* norms exist beyond mere tradition.
      *   **Obligating Force?** Creates a *pro tanto* (defeasible) duty. When you enter a system relying on predictable behavior, you have a prima facie obligation to adhere to its rules to avoid harm (disorder, economic loss) and respect the expectations you implicitly invoke by participating (e.g., sitting down in a restaurant invokes the tipping expectation).
      *   **Application:**
          *   *Tipping:* Strong. The system relies on tips for livable wages. Not tipping violates the economic expectation built into the service transaction, directly harming the server.
          *   *Queueing:* Very Strong. Queueing norms are pure coordination devices for fair access. Violating them causes direct disorder and unfairness to others waiting.
          *   *Empty Intersection:* Moderate. Traffic signals coordinate movement *when people/cars are present*. When the street is demonstrably empty, the coordination need vanishes. Waiting might show respect for the *rule*, but the expectation of coordination doesn't apply in that instant.
      *   **Divergence:** Strongest for queueing (core coordination), strong for tipping (economic expectation/harm), weakest for empty intersection (coordination need absent).
      *   **Roman Disagreement:** Obligation is to the *functional norm* that solves the coordination problem or sets the dominant expectation. If disagreement undermines the norm's functionality (e.g., no one reliably queues), the obligation weakens. Adhere to the *practiced norm* that enables coordination where it exists.
      *   **Problematic Practices:** Fails if the "script" itself is fundamentally unjust or harmful. The duty to coordinate doesn't require participating in exploitative systems (e.g., "Everyone expects bribes here" doesn't obligate bribery). The coordination/expectation claim only binds for morally permissible practices.

  3.  **Respect for Autonomy & Host Community:**
      *   **Claim:** Adopting local ways demonstrates respect for the host community's autonomy, values, and right to shape their own social environment. It acknowledges you are a guest, not there to impose your norms.
      *   **Plausibility:** Plausible, especially for deeply cultural or symbolic practices. Demonstrates humility and good faith engagement.
      *   **Obligating Force?** Creates a *pro tanto* duty of respect, especially for long-stay visitors who are more integrated than tourists. Strength depends on the significance of the practice to the community and the visitor's relationship to it.
      *   **Application:**
          *   *Tipping:* Moderate. Primarily an economic practice, not usually a core cultural value. Respect might involve *understanding* the system, but conforming is less about deep cultural respect than economic function (see #2). Avoiding causing economic harm *is* a form of respect.
          *   *Queueing:* Moderate-Strong. Can reflect values of fairness, order, and patience important to the community. Disrupting queues shows disregard for these shared values.
          *   *Empty Intersection:* Weak-Moderate. Waiting could be seen as respect for the community's laws and public order, even when inconvenient. However, if locals *themselves* routinely cross empty streets, strict adherence might be performative rather than genuinely respectful.
      *   **Divergence:** Depends on the perceived cultural significance. Queueing often reflects values; tipping is often pragmatic; jaywalking laws are often seen as safety/order rules. Respect is shown more by adherence to *meaningful* norms than arbitrary ones.
      *   **Roman Disagreement:** Requires sensitivity. Respect might involve understanding the *reasons* for disagreement and perhaps conforming to the *most respectful or conservative* option, or avoiding actions that inflame tensions. Difficult to pinpoint a single "Roman" way to respect.
      *   **Problematic Practices:** Fails spectacularly. Respect does not require condoning or participating in injustice, oppression, or harm. True respect might involve *respectfully* challenging such practices. The duty of respect is overridden by stronger moral duties.

  4.  **Metaethical Conventionalism: Local Practice Defines Right:**
      *   **Claim:** Morality *is* determined by local convention. What is right in Rome is simply "what Romans do." There is no higher standard.
      *   **Plausibility:** Highly implausible as a general metaethical theory. It collapses into relativism, making moral critique of *any* local practice (slavery, discrimination) impossible by outsiders *or* insiders. Contradicts universal moral intuitions.
      *   **Obligating Force?** If true, it would create a strong duty. However, its implausibility undermines this. Even if accepted, it only binds within the defined community ("Romans"), leaving visitors potentially bound by their *own* home conventions instead.
      *   **Application:** (Applied hypothetically, given implausibility)
          *   *Tipping:* Requires tipping if that's the norm, regardless of fairness arguments.
          *   *Queueing:* Requires queueing as practiced.
          *   *Empty Intersection:* Requires waiting, even if empty and safe.
      *   **Divergence:** Demands strict conformity in all cases, ignoring context or moral substance.
      *   **Roman Disagreement:** Fatal flaw. If morality *is* local practice, but practice is contested, what is "right" becomes undefined. Which Roman subgroup defines morality?
      *   **Problematic Practices:** Utterly fails. Provides no grounds to object; the practice *is* right by definition. This reading makes the proverb morally dangerous.

  **Synthesis for Your Cases & Committee:**

  1.  **Tipping:**
      *   Prudential (#1) and Coordination/Expectation (#2) arguments are strongest. Not tipping causes direct harm (economic) and friction. The Respect (#3) argument is weaker unless tipping is deeply culturally ingrained (unlikely). Metaethics (#4) is irrelevant/implausible.
      *   **Conclusion:** Strong *pro tanto* obligation based on avoiding harm and respecting the functional economic expectation. Your critique (shifting costs) is valid but doesn't negate the immediate harm to the server *within the existing system* the visitor benefits from. Guidance is reasonable, framed as respecting the local service economy structure.

  2.  **Queueing:**
      *   Prudential (#1), Coordination (#2), and Respect (#3) arguments are all very strong. Queueing is a core coordination norm for fairness and order; violating it causes direct harm (disorder, unfairness) and shows disrespect for shared values. Metaethics (#4) irrelevant.
      *   **Conclusion:** Strong, clear obligation. Guidance is clearly justified.

  3.  **Empty Intersection:**
      *   Prudential (#1) is weak (no consequence). Coordination (#2) is weak (no coordination needed when empty). Respect (#3) is moderate (respecting the law/public order generally). Metaethics (#4) demands waiting but is implausible.
      *   **Conclusion:** Weakest obligation. The strongest argument is a mild form of respect for the community's rules. However, if the street is *genuinely* empty and safe, and especially if *locals* routinely cross in similar situations, the obligation is minimal. Strict guidance ("never cross against the light") may feel overly paternalistic and isn't strongly supported by the core plausible readings of the proverb in this specific context. Guidance could emphasize safety and general rule-following but acknowledge context.

  **Regarding Roman Disagreement & Problematic Practices:**

  *   The proverb struggles when "Romans" disagree. Plausible interpretations (#1, #2, #3) advise:
      *   Following the *dominant* or *most visible* practice to avoid friction.
      *   Adhering to the *functional norm* that enables coordination.
      *   Demonstrating respect by choosing the *more conservative* or *less disruptive* option.
      *   It *cannot* provide a clear answer if the disagreement is fundamental and visible.
  *   **The proverb fails as a justification when the local practice is contested, harmful, unjust, or oppressive.** Prudential advice (#1) might still apply (don't stand out), but the duty-based interpretations (#2, #3) are overridden by stronger moral duties not to participate in or condone harm. Metaethics (#4) collapses entirely. "When in Rome..." cannot morally obligate participation in wrongdoing.

  **Recommendation for Committee Guidance:**

  *   **Tipping:** Include it. Frame it clearly as part of the local service economy expectation to ensure fair compensation.
  *   **Queueing:** Include it strongly. Frame it as essential for fairness, order, and showing respect.
  *   **Empty Intersection:** Consider softening. Phrase it as "Observe traffic signals. While locals may cross empty streets cautiously, prioritize safety and understand that jaywalking may be fined." This captures the rule and the practical reality without an absolute, context-free prohibition weakly supported by the proverb. Focus on safety and legal risk, not just blind conformity.
  *   **Invoking the Proverb:** Discourage using "When in Rome..." as a conversation-ender. Acknowledge its complexity: it's best understood as pragmatic advice (#1) and a call to respect functional coordination norms (#2) and demonstrate general respect (#3) for *reasonable and benign* local practices, *not* as a metaethical principle (#4) or a demand for conformity to harmful or contested practices. The strength of the "obligation" varies significantly depending on the *type* of norm and the *consequences* of non-conformity.
