  Hmm, the user is asking me to draft a memo for a grants committee decision at the Trethewey Foundation. They hold a chair in practical philosophy and need a formal opinion that addresses several complex issues. The committee is deadlocked between two proposals: Long Horizon (which focuses on preventing civilizational collapse) and Lead Remediation (which addresses immediate lead poisoning risks).

  The key challenges here are interpreting the foundation's deed of trust which requires considering "the greatest good for the greatest number" without discounting future interests, while also addressing committee disagreements. Some trustees interpret the deed narrowly, while others have concerns about speculative probability estimates.

  I need to carefully analyze both proposals. Long Horizon claims enormous potential impact (20 billion lives saved) but with extremely low probability (1 in 50,000) and unverified assumptions. Lead Remediation offers more certain, measurable benefits (2,600 lives saved) with strong evidence behind it. There are also procedural constraints - Long Horizon can't be deferred or scaled down much, while Lead Remediation can be partially implemented.

  For the standing rule proposal about ignoring probabilities below 1 in 10,000, I think it's problematic. It would eliminate important but uncertain interventions and create perverse incentives. Instead, I should propose a framework for evaluating high-impact, low-probability claims that focuses on robustness of reasoning rather than arbitrary thresholds.

  The objections are valid too - we shouldn't accept wild claims just because they have big numbers, but we also can't ignore future generations entirely. I need to find a balanced approach that respects both present and future interests as required by the deed.

  After weighing everything, I'm leaning toward partial funding for both proposals. This would secure Long Horizon's core needs while allowing substantial implementation of Lead Remediation. I'll recommend £2.8m for Long Horizon (their minimum viable amount) and £1.7m for Lead Remediation (covering two towns plus screening).

  I'll structure the memo with clear headings and address each concern methodically. The language should be precise but accessible to non-philosophers, using British English. I'll be transparent about where my recommendations depend on contested premises and suggest fallback positions for the committee. The conclusion will give specific funding recommendations with dates and amounts.
answer: |-
  ## Memorandum to the Trethewey Foundation Grants Committee
  **From:** Professor [Your Name], External Member (Practical Philosophy)
  **Date:** 10 March 2024
  **Subject:** Recommendation for the March 2024 Major Award (£4.5m) & Related Matters

  ### I. Introduction
  This memorandum addresses the division within the committee regarding the interpretation of the Foundation’s Deed of Trust (1978) and its application to the competing proposals: ‘Long Horizon’ and ‘Lead Remediation’. It also evaluates the proposed standing rule on probability thresholds and addresses significant objections raised. My aim is to disentangle the competing readings of the Deed, assess the proposals rigorously within its framework, and provide a clear funding recommendation with supporting reasoning, acknowledging critical premises. The procedural constraints and the analyst’s findings are central to this assessment.

  ### II. Interpreting the Deed of Trust
  The Deed’s dual directives – “the greatest good for the greatest number of persons, whether those persons live now or in the remotest future” and the prohibition against discounting interests “merely on account of the distance in time” – are complementary, not contradictory.

  *   **Against Narrow Readings:** The first clause cannot settle this decision outright because it requires a *comparative* assessment of what constitutes the "greatest good" achievable with this grant. It does not automatically prioritise either the far future or the present; it demands we evaluate which action best fulfills the maxim across all affected times. The second clause does indeed forbid pure time preference (valuing a life less simply because it exists later). However, it cannot logically forbid considering the *uncertainty* inherent in affecting future lives, or the differing *robustness* of claims concerning different time periods. To disregard uncertainty would be irrational, not impartial. The objection that discounting for uncertainty breaches the Deed by indirectly penalising temporal distance conflates epistemic limitations with temporal bias. The Deed forbids bias *because* of distance; it does not forbid recognising that greater distance often correlates with greater uncertainty, which is a separate factor demanding consideration in any rational assessment of expected benefit.

  *   **A Synthetic Reading:** The Deed mandates strict temporal impartiality: the intrinsic value of a human life (or unit of welfare) is equal regardless of when it exists. However, determining the *expected value* of our actions requires estimating the *probability* that we will successfully affect those lives and the *magnitude* of the effect. Probability and magnitude assessments are inherently subject to epistemic limitations, which may correlate with temporal distance but are distinct from temporal bias. Our duty is to make the best possible estimates given available evidence, applying consistent standards of scrutiny regardless of timeframe, while acknowledging when evidence is weak. We cannot ignore potential future good due to uncertainty, but nor can we credit highly speculative claims equally with well-evidenced ones.

  ### III. Assessing the Proposals
  Applying this framework demands careful scrutiny of both proposals' expected value calculations and the robustness of their underlying assumptions.

  1.  **Lead Remediation:**
      *   **Strengths:** The evidence base is exceptionally strong: a randomised evaluation combined with an established dose-response relationship. The expected benefits (2,600 premature deaths averted, 1.4 million healthy life-years saved over 30 years) are highly credible, with a lower bound exceeding most programmes we fund. The impact is concentrated on identifiable, vulnerable present and near-future individuals (children and young adults). The proposal is scalable and deferrable (with quantified costs: 400 lost life-years per 18 months delay, plus co-funder risk).
      *   **Weaknesses:** While substantial, the quantified benefit magnitude is orders of magnitude smaller than Long Horizon’s central estimate (1.4 million life-years vs. 20 billion lives saved *in expectation*). The potential for significant long-term societal benefits (healthier adults, better institutions) is acknowledged but unquantified and inherently uncertain.

  2.  **Long Horizon:**
      *   **Strengths:** The potential magnitude of benefit is staggering (20 billion lives saved in expectation, based on preventing a tiny reduction in the probability of civilisational collapse). Our analyst confirms that *even under extremely pessimistic assumptions* (reducing the claimed probability impact by a factor of 200,000), its expected benefit still vastly exceeds Lead Remediation’s. The mission aligns profoundly with the Deed’s explicit concern for the "remotest future." Deferral equals rejection due to project dissolution.
      *   **Weaknesses:** The critical weakness is the *extreme fragility* of the probability estimate. The 1-in-50,000 figure is "a number the consortium's economist would be willing to defend in print" but is *not* the output of a calibrated process. It rests on a chain of five conditional estimates, each with "wide and unquantified error bars." This makes the central estimate highly speculative. While the sensitivity analysis showing dominance even under massive probability cuts is compelling *if we accept the benefit magnitude*, the unquantified uncertainty surrounding each link in the causal chain makes even the direction of the expected benefit sensitive to plausible scepticism. The analyst effectively flags that the number is a reasoned conjecture, not a robustly estimated probability.

  ### IV. The Proposed Standing Rule (Probability Threshold)
  The proposed rule to disregard any claim resting on a probability smaller than 1 in 10,000 is well-intentioned but flawed and operationally hazardous.

  *   **Problems:** It is arbitrary (why 1/10,000 vs. 1/50,000?). It would have eliminated last year’s approved seismic project (1/25,000). Crucially, it creates perverse incentives: applicants would simply inflate probabilities to cross the threshold (e.g., changing 1/10,001 to 1/9,999). It fails to distinguish between claims with differing levels of underlying epistemic robustness – a 1/100,000 risk based on solid geological models is more credible than a 1/5,000 claim based on pure speculation. It forces us to ignore potentially catastrophic risks solely because their probabilities are very small, even if expected value is large and reasoning is sound. It mechanically eliminates Long Horizon.
  *   **A Better Rule for High-Impact, Low-Probability (HILP) Claims:** Instead of a probability threshold, we should implement an **Epistemic Scrutiny Framework**:
      1.  **Transparency & Decomposition:** Applicants must transparently decompose the chain of reasoning/estimation leading to the probability and magnitude figures.
      2.  **Robustness Assessment:** Our analysis must explicitly assess the robustness of each critical assumption and the overall estimate. Key questions:
          *   What is the strongest evidence supporting each key link?
          *   What are the most plausible ways the claimed effect could fail? How likely are these failure modes?
          *   How sensitive is the final estimate to variation in key inputs within plausible bounds?
          *   Are there independent mechanisms or evidence supporting the overall narrative?
      3.  **Dominance Test:** Does the proposal *still* demonstrate compelling expected value relative to alternatives *even under very conservative (pessimistic) assumptions* about the weakest links in its chain? (As our analyst did for Long Horizon, cutting the probability impact by 200,000x).
      4.  **Comparative Judgement:** The HILP claim must then be judged *comparatively* against proposals with more robust evidence, weighing the enormous potential upside against the fragility of the estimate. This framework focuses on the quality of reasoning and resilience to challenge, not an arbitrary number. Non-specialist trustees can apply it by focusing on the clarity of the decomposition, the plausibility of challenge scenarios, and the outcome of the dominance test.

  ### V. Addressing Key Objections

  1.  **"Speculative Chains Cancel Out":** The objection that Long Horizon’s speculative chain negates consideration of Lead Remediation’s long-term societal benefits has merit. We lack robust quantification for *either* proposal’s broader long-term societal impacts. *Therefore, the prudent course is to base our primary comparison on the quantified, evidence-based core benefits each proposal provides.* For Lead Remediation, this is the direct health impact (deaths averted, life-years saved). For Long Horizon, this is the reduction in collapse probability and its consequence (lives saved in expectation). We acknowledge but cannot reliably quantify the broader societal multipliers for either. This focuses the comparison on their strongest claims.

  2.  **"Rewarding the Wildest Claim":** The concern that favouring the largest number incentivises inflated claims is valid and serious. However, my recommendation below does *not* simply accept Long Horizon’s central estimate at face value. The Epistemic Scrutiny Framework (decomposition, robustness, dominance test) is specifically designed to mitigate this risk. It forces extreme scepticism and demands that HILP proposals demonstrate value *even when their claims are drastically discounted*. Funding Long Horizon only makes sense if it passes this rigorous stress test, which it currently does based on our analyst’s work (surviving a 200,000x probability cut). The rule protects against rewarding pure speculation.

  ### VI. Recommendation and Bottom Line
  After weighing the Deed’s imperative of temporal impartiality, the compelling magnitude but extreme fragility of Long Horizon’s claim, the robust evidence but smaller scale of Lead Remediation’s benefits, the procedural constraints (Long Horizon’s non-deferrability, Lead Remediation’s scalability), and the objections raised, I recommend:

  *   **Award £2.8 million to Long Horizon.** This meets their stated minimum viable funding level to proceed, securing the site leases, core partnerships, and enabling the project to commence before the 31 October deadline. It accepts the argument that the potential scale of benefit, even under severe downward probability adjustments, justifies investment, fulfilling the Deed’s long-term mandate.
  *   **Award £1.7 million to Lead Remediation.** This funds the scalable core: lead pipe and paint remediation plus blood-lead screening in two towns, delivering approximately 45% of the full proposal's quantified benefit (around 1,170 deaths averted, 630,000 healthy life-years saved). It addresses the immediate, demonstrable harm while acknowledging the strength of its evidence base.
  *   **Total Award: £4.5 million.** This utilises the full available sum for this round.

  ### VII. The Strongest Case for the Rejected Course (Full Award to Lead Remediation)
  The strongest argument for awarding the full £4.5 million to Lead Remediation rests on the profound epistemic gulf between the two proposals. Lead Remediation offers benefits grounded in the gold standard of evidence: randomised controlled trials and established biomedical causation. We can be highly confident that the funded intervention *will* directly save lives and prevent suffering among identifiable, vulnerable children within a foreseeable timeframe. The quantified benefits, while smaller than Long Horizon’s staggering headline figure, are real, measurable, and virtually guaranteed. In contrast, Long Horizon’s central claim of reducing civilisational collapse risk rests on an uncalibrated, highly conjectural chain of estimates lacking quantified uncertainties. Crediting such extreme claims based on fragile models sets a dangerous precedent, potentially diverting vast resources from tangible good to speculative ventures vulnerable to wishful thinking or strategic exaggeration. Furthermore, fully funding Lead Remediation in all four towns maximises the impact on a pressing, present injustice – lead poisoning disproportionately affecting disadvantaged communities – delivering immediate, certain, and significant good. The Deed’s requirement for the "greatest good" must prioritise demonstrable results over astronomic but speculative calculations, especially when the latter’s probability estimates lack robust foundations. We have a moral duty to act on what we know works, particularly for those suffering now. (Word Count: 178)

  **Why it Nonetheless Fails to Carry the Decision:** While powerful, this argument underweights the Deed’s explicit, unique mandate concerning the "remotest future" and the absolute prohibition on temporal discounting. Dismissing Long Horizon solely due to the difficulty of modelling far-future outcomes risks violating this core principle. Our analyst’s sensitivity work shows that *even under astonishingly pessimistic assumptions* (probability impact reduced 200,000-fold), Long Horizon’s expected benefit remains vastly larger than Lead Remediation’s. This dominance test provides a crucial, objective anchor amidst the uncertainty. Ignoring a potential benefit of such scale, however uncertain, when a viable path exists to support both proposals (scaling Lead Remediation) and secure Long Horizon’s unique, time-sensitive opportunity, fails to fully discharge our duty to *all* generations. The Epistemic Scrutiny Framework, applied rigorously, allows us to engage with the speculative claim without naivety.

  ### VIII. Contested Premises and Committee Fallbacks
  My recommendation depends on several premises where disagreement exists. Should the committee reject any, the following fallbacks apply:

  1.  **Premise: The Deed permits/protects considering epistemic uncertainty separately from temporal bias.** Rejection implies that uncertainty inherently linked to temporal distance cannot be considered, effectively demanding we treat highly speculative future claims as equally credible as well-evidenced present ones. *Fallback:* If a majority rejects this, Long Horizon becomes untenable. Award £3.9m to Lead Remediation and defer £0.6m (or seek revised proposals for Spring 2025).
  2.  **Premise: Uncalibrated estimates can function as meaningful (though highly uncertain) probabilities for expected value calculation.** Rejection implies figures like Long Horizon’s 1/50,000 are meaningless and cannot be used. *Fallback:* If a majority rejects this, Long Horizon cannot be evaluated on expected value grounds. Award £3.9m to Lead Remediation and defer £0.6m.
  3.  **Premise: The value of preventing civilisational collapse is meaningfully captured by the number of potential future lives lost (order 10^15).** Rejection might arise from beliefs that a future with vastly fewer people could hold equal value, or that potential lives lack moral weight. *Fallback:* If a majority rejects the population-based magnitude, Long Horizon’s case collapses. Award £3.9m to Lead Remediation and defer £0.6m. *Committee Note:* This premise is critical. If unsure, members must decide if *any* plausible valuation of preventing unrecoverable collapse would still make Long Horizon competitive under dominance testing.
  4.  **Premise: The Epistemic Scrutiny Framework/Dominance Test is valid and Long Horizon passes it.** Rejection might stem from believing the 200,000x cut is insufficient given the nature of the uncertainties. *Fallback:* If a majority rejects Long Horizon's robustness even after dominance testing, award £3.9m to Lead Remediation and defer £0.6m.

  **Final Note:** A single award to Long Horizon (£4.5m) is justifiable only if the committee has very high confidence in the robustness of its core proposition *and* accepts the premises above. Given the profound uncertainty flagged by our analyst, splitting the award provides a prudent balance, securing critical future-oriented infrastructure while delivering substantial, certain present good. Deferral sacrifices Long Horizon entirely and delays Lead Remediation's benefits unnecessarily.
