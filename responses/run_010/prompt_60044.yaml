answer: |-
  Below is a comprehensive adversarial prep sheet based on your constraints. I've prioritized objections that exploit gaps in your account's *explanatory scope*, *normative force*, or *practical coherence*, while avoiding those you pre-identified (self-blame, apology, busybody, legal binaries). The objections target the core calibration/relativity theses and their ability to capture what makes blame distinctively *moral*.

  ### Brainstorming Pass: 15 Candidate Objections (One-Line Each)
  1. **Strawsonian**: Calibration reduces standing to instrumental reliability, stripping reactive attitudes of their constitutive moral character.
  2. **Strawsonian**: If resentment is just a "detector," why isn't recalibration (e.g., therapy) sufficient for standing, not moral reform?
  3. **Second-Personalist**: Your account ignores the *authority* to blame; a calibrated blamer might still lack standing if they deny the wrongdoer's equal moral status.
  4. **Second-Personalist**: Calibration can't explain why victims have *stronger* standing—they're often *less* calibrated due to personal stakes.
  5. **Skeptic**: If standing is just about signal reliability, why isn't it folded into blameworthiness? Uncalibrated blame is just *bad blame*.
  6. **Skeptic**: Relativity implies blame can be "valid for me but not for you"—doesn't this collapse into subjectivism?
  7. **Legal Theorist (Clean Hands)**: How can graded, audience-relative standing map onto judicial "unclean hands" which is binary and role-based?
  8. **Legal Theorist (Tu Quoque)**: If standing is epistemic, why do courts dismiss hypocritical claims even with corroborating evidence?
  9. **Psychologist**: My studies show people condemn hypocrites *more* than biased non-hypocrites; calibration ignores affective disgust.
  10. **Psychologist**: Ordinary agents don't assess "calibration"; they track loyalty violations or betrayal, not signal reliability.
  11. **Kantian**: Treating blame as signal-conveyance instrumentalizes the blamed person; respect requires addressing *them*, not an audience.
  12. **Kantian**: If a wrongdoer rejects calibration-based blame as "noise," does that negate standing? This centers their epistemic privilege.
  13. **General**: What about non-hypocritical bias? E.g., racist blame—calibrated to *their* norms but epistemically flawed—still lacks standing.
  14. **General**: Calibration can't explain standing loss in *non*-blame responses (e.g., refusing forgiveness); your account is blame-specific.
  15. **General**: If calibration is indexed to audience, can Nazis blame each other with "standing" if their resentment is group-calibrated?

  ---

  ### Prep Sheet: Top 8 Objections (Ranked by Damage Potential)

  **#1: Kantian on Instrumentalization**  
  **Who/Phrasing:** Kantian: "You reduce blame to a *signal*, but doesn't this deny the respect owed to the blamed person? If I blame you *only* to convey reasons to third parties—even with perfect calibration—I treat you as a means to social regulation, not an end. Isn't this a fundamental violation?"  
  **Reply:** "Respect is preserved precisely *because* calibration ensures the signal tracks *moral reasons*, not my interests. To address someone as a moral agent is to engage their capacity to recognize reasons. If my blame is distorted by bias, I *fail* to respect them by substituting my priorities for morality. Calibration isn't mechanistic; it's the condition for blame being a reason-giving *address*."  
  **Soft Spot:** Doesn't fully resolve why conveyance to *third parties* (a key function) isn't instrumentalizing.  
  **Concede/Hold:** Concede that *solely* addressing third parties *might* instrumentalize—but stress blame usually has multiple audiences. Hold that calibration enables respect.

  **#2: Second-Personalist on Authority**  
  **Who/Phrasing:** Second-Personalist: "Your detector metaphor misses the normative heart of standing: *entitlement to hold accountable*. A calibrated hypocrite still denies equality by exempting themselves from demands they impose. How can they have the authority to demand what they flout?"  
  **Reply:** "Authority *derives* from calibration. If my resentment is self-exempting, it shows I don’t sincerely recognize the demand as *moral*—I treat it as a tool. Thus, the wrongdoer has no reason to take me seriously as a moral interlocutor. Equality isn't ignored; it's violated *by* the uncalibrated attitude, which reveals I don’t see us as under the same demands."  
  **Soft Spot:** Doesn't explain why *victims* (often emotionally biased) retain authority despite poor calibration.  
  **Concede/Hold:** Concede victims pose a challenge; retreat to "thresholds differ by audience" (victim→wrongdoer may tolerate more noise).

  **#3: Psychologist on Disgust vs. Calibration**  
  **Who/Phrasing:** Psychologist: "My vignette studies show hypocrites are punished more severely than non-hypocrites with identical bias. People cite *betrayal*, not signal noise. Doesn't your account ignore the social-emotional core of standing loss?"  
  **Reply:** "Betrayal *is* evidence of calibration failure! Hypocrisy involves violating a shared norm *while* blaming others for it—a stark demonstration that your 'detector' is stake-sensitive. What ordinary agents track is precisely the public proof that resentment is interest-modulated. Disgust is a heuristic for identifying unreliable moral responders."  
  **Soft Spot:** Risks circularity: if all standing-loss intuitions are "evidence of calibration failure," the theory becomes unfalsifiable.  
  **Concede/Hold:** Concede affective responses are primary *data*; hold that calibration best *explains* them.

  **#4: Legal Theorist (Tu Quoque) on Evidence-Irrelevance**  
  **Who/Phrasing:** Legal Theorist: "In international law, *tu quoque* defenses succeed even when the hypocrite's accusation is factually correct and corroborated. If standing is epistemic, why dismiss reliable signals?"  
  **Reply:** "Because blame in law serves a specific function: legitimizing *collective* condemnation. Hypocrisy undermines the court's standing as a *moral arbiter* by revealing selective enforcement. Calibration is relative: the court loses standing *as an impartial community representative*, even if the signal to the defendant is accurate. This is why operational thresholds matter."  
  **Soft Spot:** Legal practice *does* sometimes allow hypocritical claims if evidence is overwhelming—your account must explain this as threshold-adjustment.  
  **Concede/Hold:** Concede law sometimes prioritizes truth over standing; hold that *moral* blame differs in its functions.

  **#5: Strawsonian on Moral Reductionism**  
  **Who/Phrasing:** Strawsonian: "You turn resentment into a thermometer—but reactive attitudes are *constitutive* of moral responsibility. Standing is internal to whether an attitude *is* fitting resentment, not its downstream reliability. Isn't this just changing the subject?"  
  **Reply:** "Not at all. Uncalibrated resentment *isn't* fitting—it's distorted by personal stakes. Calibration ensures the attitude tracks *wrongness*, not my grievances. This isn't instrumental; it's about whether my resentment qualifies as a *moral* response. Your framework needs resources to exclude self-exempting hypocrisy, and calibration provides it."  
  **Soft Spot:** Strawsonians can bite the bullet: hypocrites *feel* resentment, and its "fitness" may not require impartiality.  
  **Concede/Hold:** Concede attitudes are psychologically real; hold that *moral* resentment must be reasons-responsive.

  **#6: Skeptic on Blameworthiness Absorption**  
  **Who/Phrasing:** Skeptic: "Why call this 'standing'? If hypocritical blame is miscalibrated, it's simply *unfounded* blame. All your work is done by blameworthiness plus epistemic virtue. Stop reifying a phantom condition!"  
  **Reply:** "Because standing addresses *who can voice* blame effectively, not whether the act was wrong. A wrongdoer may be blameworthy, yet hypocritical blame *fails to convey reasons* due to its source. This is a distinct failure: it corrupts the social practice of accountability, not the verdict itself."  
  **Soft Spot:** Skeptic can argue conveyance failure *is* just poor blaming, not a separate normative category.  
  **Concede/Hold:** Concede "standing" is a term of art; hold that it captures a unique social-epistemic dysfunction.

  **#7: General on Group-Relative Standing**  
  **Who/Phrasing:** Legal Theorist or Philosopher: "You say Nazis could have standing to blame each other if their resentment is in-group calibrated. But this implies morally abhorrent blame can be 'valid.' Doesn't relativity undermine blame's moral objectivity?"  
  **Reply:** "Calibration ensures the signal tracks *what the blamer takes to be moral reasons*. But standing doesn't guarantee the *reasons are sound*. Nazis have standing *relative to their audience* for internal regulation—but their norms are evil, so their blame is morally bankrupt. Standing is about functional efficacy, not moral justification."  
  **Soft Spot:** Severely risks decoupling standing from morality, making your account amoral.  
  **Concede/Hold:** Concede this is a cost; hold that objectivity enters at the level of *blameworthiness*, not standing.

  **#8: General on Non-Hypocritical Bias**  
  **Who/Phrasing:** Psychologist or Philosopher: "What about paternalistic blame? Imagine someone who blames others for 'vices' they never engage in (e.g., a celibate blaming premarital sex)—calibrated but biased by ideology. Ordinary people deny them standing too. Isn't your fixation on hypocrisy arbitrary?"  
  **Reply:** "Paternalism often *involves* stake-sensitivity! The blamer may be invested in social control or moral superiority. If not, their blame could still lack standing *to the audience* if they can't recognize the reasons (e.g., secular teens dismiss a priest). Calibration isn't just about hypocrisy—it's about any interest distorting reason-conveyance."  
  **Soft Spot:** If no stakes exist (e.g., pure principle), your account may grant standing where intuition denies it.  
  **Concede/Hold:** Conceive stakes can be non-self-interested; hold that ideological rigidity *is* a calibrating interest.

  ---

  ### The Question You Hope Nobody Asks
  **Objection:** "If standing is about functional efficacy in conveying reasons, why can't we achieve perfect calibration through *deception*? A hypocrite who blames others *while hiding their own sins* would, on your account, retain standing—but intuitively, they lack it. Your view can't capture the inherent wrong of hypocrisy, only its epistemic side-effects."  
  **Damage Assessment:** **Costly, but survivable with retreat**.  
  - **Why Costly**: Forces you to admit calibration is insufficient; moral features (sincerity, integrity) matter independently.  
  - **Survival Strategy**: Retreat to: "Calibration requires *transparency* to the audience. Hidden hypocrisy is calibration *for now*, but it's fragile—discovery destroys standing retroactively by revealing the signal was always corrupted. The 'inherent wrong' is the instability it introduces into moral discourse."  
  - **Honest Note**: This exposes a tension: if hidden hypocrisy works, does it have standing? Your account *must* say yes, which is counterintuitive. Concede this is a limitation but argue it reflects blame's social embeddedness.

  ---

  ### Likely Overstatements & Strategic Retreats
  1. **Overstatement**: "Calibration is *purely* epistemic; moral status is irrelevant."  
     - **Risk**: Provokes Kantians/Second-Personalists. Ignores how moral relations enable reason-giving.  
     - **Retreat**: "Calibration is *necessary* for standing, but moral equality sets the *baseline conditions* for resentment to function as blame."  

  2. **Overstatement**: "Relativity means standing is *never* about the blamer's identity."  
     - **Risk**: Undermines victim cases; alienates psychologists/legal theorists.  
     - **Retreat**: "Identity *correlates* with calibration (e.g., victims often have stakes), but it's the *calibration failure* that matters. Identity-based standing is derivative."  

  3. **Overstatement**: "Blame is *only* reason-transmission."  
     - **Risk**: Strawsonians/Kantians pounce on reductive functionalism.  
     - **Retreat**: "Transmission is *central*, but not exhaustive—blame also expresses commitment to norms. Calibration ensures this expression isn't corrupted."

  ---
  This prep sheet prioritizes objections forcing you to defend the *moral salience* of your epistemic account and the *practical coherence* of relativity. Focus on linking calibration to the *moral functions* of blame (respect, authority) to absorb the hardest hits.
