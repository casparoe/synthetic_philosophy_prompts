  Their thesis has two main claims: the calibration account where standing is epistemic rather than moral, with blame functioning to transmit moral reasons; and relativity where standing is property of blame-tokens indexed to audience. Their argument centers on blame conveying moral reasons, which requires the recipient to trust it tracks wrongness rather than the blamer's interests.

