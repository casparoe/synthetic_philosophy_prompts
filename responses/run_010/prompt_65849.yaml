prompt: |-
  So — I help run a mutual aid group, about fifteen of us, we all put money in each month and split a pot between whoever's in a hole that month. For three years we did it the dead simple way: even shares between the households that applied, no questions asked. Last month it went sideways. Two people applied: a single dad with three kids whose shifts got cut, and a woman who lives alone, works full time, and asked for help with an electricity bill because she runs medical equipment at home all night. We gave them the same number and half the room felt fine about it and half felt sick about it, and the argument afterwards turned out not to be about the money at all — it was about what we thought we were equalising, which nobody could name. Since then I've been reading around it on my own, nothing academic, library stuff and bits online, and found out this is apparently a real named question: something about whether you equalise welfare, or resources, or capabilities. I want to run a ninety minute session with the group on it before the next allocation round. Worth knowing the room: there's a retired accountant who will want a formula by the end, a woman who thinks any formula is an insult to the person asking, and one guy who'll say within ten minutes that this is all just a way of dressing up not wanting to work.

  I don't want the three approaches explained to me, I've got the rough shape of each. I want a plan for how I explain them. What has to be in place before this even looks like a question — right now most of them think "we split it evenly, obviously" is a finished answer, and I can't get across that it isn't, and my guess is that's the hinge the whole night turns on, but I don't know what to put *before* it so that the hinge has something to grip. Then the carrying example. I'd assumed I'd use our own two cases from last month, but I'm worried that's a disaster since everyone already picked a side and they'll just replay the fight with fancier words. So tell me what a good carrying case has to have and what it has to not have, and whether the real one or an invented one is the better bet for this particular group — and if you say invent one, build it rather than describing what it should be like. Then the misconceptions and where in the sequence each gets headed off. The ones I can already see coming: that capabilities is just a posh word for what people are able to do so it collapses back into resources; that caring about wellbeing means you end up topping up the guy who needs fancy beer to be happy; that this is the same old equality-of-opportunity-versus-outcome thing they've heard a hundred times; and that the whole debate is a technicality because we all agree equality matters anyway. Which of those do I defuse early, which do I let them walk straight into because hitting it is actually useful, and what do I say at the moment of the walk-in? Plus one thing I can do at the end that tells me whether they've got the question rather than just being polite to me — something that isn't a quiz and doesn't turn into a vote on real money.

  And tell me what to leave out and to announce that I'm leaving it out; there's more than ninety minutes of material here and I'd rather cut on purpose than run out of room halfway through the good bit. Finally, be straight with me about where your plan is weakest — which stretch is most likely to fall flat or actively backfire with these people, and what would change your mind about the ordering, like is there some one thing about the group that if I told you it to you'd rearrange the whole thing? Say which parts of the plan you're confident in and which you're kind of guessing at.
reasoning: |-
  Okay, the user runs a mutual aid group that's hit a philosophical snag. They've been splitting funds evenly for three years, but last month's allocation to a single dad with kids and a woman with medical equipment sparked a deeper debate about what equality actually means. Now they need a 90-minute session to explore this before next month's distribution. 

  Hmm. The core challenge here is epistemological - most members think "equal shares" is an obvious endpoint, not a starting point for discussion. The user's brilliant insight is recognizing they need to destabilize that certainty first. But how? 

  First, I should acknowledge the emotional landmines: two real cases with established sides, a formula-demanding accountant, a formula-rejecting empath, and a potential cynic who'll dismiss this as elitist nonsense. Any plan must neutralize replaying the fight while honoring that the original cases matter deeply.

  For the "hinge" moment where "equal shares" stops feeling complete: I'm imagining starting with a deliberately alien scenario. Maybe a space colony survival situation? That creates psychological distance while making the question visceral - air vs water vs gravity needs become undeniable. The key is showing equal distribution could kill people with different requirements, which transitions smoothly to "so what are we *really* equalizing?" 

  On cases: absolutely must invent new ones. The original applicants are too raw. I'll craft two fictional but plausible requests - maybe one with chronic pain needing specialty therapies, another rebuilding after domestic violence. Crucially, both have identical monetary needs but vastly different abilities to convert cash into wellbeing. This exposes how "same cash = same help" might fail. 

  Misconception strategy: Let the "capabilities vs resources" confusion happen organically when comparing cases - that debate is actually useful. But preempt the "fancy beer" welfare argument early by defining welfare as basic functioning, not preferences. The equality-of-opportunity red herring? Save for Q&A if it arises. 

  For the closing assessment: No quizzes. Instead, small groups drafting allocation principles for hypothetical communities. The accountant gets structure, the empath gets human focus, and the output reveals if they grasp tradeoffs. 

  Biggest risk: The space colony opener might feel silly to practical mutual aid folks. If I knew they were all grassroots activists, I'd pivot to a disaster relief scenario instead. Also, the capabilities framework is notoriously slippery - I'm banking on the medical equipment vs childcare needs in the invented cases making it concrete. 

  Cutting: No historical theory, no academic terms. Explicitly say "We're leaving philosophers' names out of it." And crucially, postpone real policy decisions to another meeting. This session's win is simply realizing the question exists. 

  Nervous about the cynic who thinks this is performative. Best counter: repeatedly tie each concept back to last month's fight. "Remember when half of us felt sick about equal shares? This helps explain why." Makes it real, not theoretical.
answer: |-
  Here’s a battle-tested plan for your 90-minute session, designed to pivot from "equal shares = obvious" to "equality of *what?*", using concrete examples while dodging replay fights and misconceptions. The structure is **Deliberate Disruption → Friction Cases → Frameworks → Application**.

  ---

  ### **Phase 1: Destabilize "Obvious" Equality (25 mins)**  
  *(Goal: Make "equal shares" feel incomplete)*  
  **Opener (5 mins):**  
  *"Last month showed us that 'split evenly' isn’t a full answer. Tonight isn’t about fixing last month’s decision or voting on a new system. It’s about understanding why that moment hurt—and what deeper question we were actually arguing about."*  

  **Activity: The Lifesaving Serum Scenario (15 mins)**  
  > *"A clinic has 10 doses of a lifesaving serum. Two patients need it to survive:  
  > - **Patient A:** A 25-year-old with a chronic condition needing 1 dose/month indefinitely.  
  > - **Patient B:** An otherwise healthy 70-year-old recovering from an accident, needing 10 doses now to walk again.*  
  > *You have 10 doses. Do you split 5/5? Why/why not? What does 'fair' mean here?"*  

  **Why this works:**  
  - No money → avoids transactional thinking.  
  - Life/death stakes expose moral intuitions.  
  - Forces debate about *what’s being equalized* (years of life? quality of life? need?).  
  - **Key facilitation:** Push them to articulate their *criteria* (e.g., "B deserves more because it’s temporary," "A deserves more because they’re young").  

  **Transition (5 mins):**  
  *"We all said ‘equal shares’ was obvious until we hit cases where people’s needs, capacities, or vulnerabilities were wildly different. That’s the hinge: **Equality of what?** We’re comparing three answers to that question."*  

  ---

  ### **Phase 2: Introduce Frameworks via Friction Cases (30 mins)**  
  *(Invented cases avoid old wounds)*  
  **Case 1: Resource Equality**  
  > *"Sam is paraplegic after an accident. They need $1,500/month for a wheelchair-accessible van to get to work. Without it, they lose their job."*  

  **Case 2: Welfare Equality**  
  > *"Taylor has severe clinical depression. Medication ($200/month) stabilizes them, but they need therapy ($800/month) to function well enough to work. Without both, they’re hospitalized."*  

  **Case 3: Capability Equality**  
  > *"Riley is a single parent with a toddler. They need $1,000/month for daycare to finish their nursing degree. Without it, they’re stuck in a dead-end job."*  

  **How to Explain:**  
  1. **Resources:** "Money/things you get. Fair if we ignore how people *use* resources. Sam gets $1,500 for the van."  
  2. **Welfare:** "Wellbeing/happiness. Fair if we care about mental/physical state. Taylor gets $1,000 for meds+therapy to *feel* functional."  
  3. **Capability:** "Freedom to achieve. Fair if we care about *opportunities*. Riley gets $1,000 for daycare to *become* a nurse."  
  **Crucial:** Emphasize each requires trade-offs: Resources may not fix problems; welfare is subjective; capabilities are harder to measure.  

  **Facilitation:**  
  - *"Which feels fairest here? Why?"*  
  - *"What worries you about each approach?"*  
  - **Preempt "fancy beer" fear:** *"Welfare isn’t about luxury—it’s basic functioning. If Taylor needed caviar to feel happy, we’d say no. But therapy for survival? That’s core welfare."*  

  ---

  ### **Phase 3: Misconception Triage & Application (30 mins)**  
  **Misconception Strategy:**  
  - **"Capabilities = Resources"**: Let them debate Riley’s case. Ask: *"Is $1,000 for daycare the same as $1,000 cash if Riley can’t access childcare otherwise?"* → Reveals money alone ≠ capability.  
  - **"Welfare = Topping up preferences"**: Shut down early (as above). Use Taylor: *"Is survival a ‘preference’?"*  
  - **"Same as opportunity/outcome"**: Acknowledge overlap but clarify: *"Opportunity is about starting points; capabilities are about ongoing power to act."*  
  - **"Technicality"**: *"If we all agreed, we wouldn’t have blown up last month. This *is* the disagreement."*  

  **Activity: The Principle Draft (15 mins)**  
  > *"In pairs, draft 1 sentence for our group: ‘We equalize ______, because ______.’ Not for real use yet—just practice. Examples:  
  > - ‘We equalize crisis relief, because emergencies trump chronic needs.’  
  > - ‘We equalize capability to stay employed, because work prevents future need.’"*  

  **Why this works:**  
  - Accountant gets structure; anti-formula person frames values; cynic can’t derail with "real money" arguments.  
  - Reveals who grasps the question: Look for *meaningful trade-offs* (e.g., "capabilities cost more but prevent long-term need").  

  ---

  ### **Closing: The Litmus Test (5 mins)**  
  *"Show of fingers: How many of you feel like ‘equality of what?’ is a real question now? 1 (not at all) to 5 (it’s essential). No talking—just fingers."*  
  → **Why it works:** Non-verbal, not a vote, measures cognitive shift. If most hands show 3+, you succeeded.  

  ---

  ### **What to Cut & Why**  
  - **No academic terms** (Sen, Rawls, etc.). Say: *"We’re skipping philosophers—focusing on your intuition."*  
  - **No allocation formulas.** Say: *"Tonight is about principles, not math. We’ll design a process later."*  
  - **No deep dive into one framework.** Stay comparative: *"Each lens has trade-offs—we’re mapping the territory."*  

  ---

  ### **Weak Points & Mitigations**  
  1. **The Serum Scenario (Risky if too abstract):**  
     - *Mitigation:* Keep it short. If eyes glaze, pivot: *"Imagine this is disaster relief: water filters vs. antibiotics."*  
     - **Change if:** The group is highly pragmatic → swap for a **job training vs. emergency rent** scenario.  

  2. **Capabilities Feeling Vague:**  
     - *Mitigation:* Hammer Riley’s case: *"Daycare isn’t a ‘thing’—it’s *freedom* to train."*  
     - **Change if:** Pushback → reframe as **"barrier removal"** (e.g., "cash for the van removes mobility barriers").  

  3. **The Cynic:**  
     - Pre-empt at start: *"Some may think this is overcomplicating care. But care means asking *what kind of help actually helps.*"*  
     - If they erupt: *"That’s a real concern. Which framework best prevents gaming, in your view?"* → Redirect to substance.  

  ---

  **Confident In:**  
  - Serum opener disrupting complacency.  
  - Invented cases creating safe friction.  
  - Principle draft revealing comprehension.  

  **Guessing At:**  
  - Whether the anti-formula person engages with capability framing. If they resist, validate: *"This isn’t about judging worth—it’s about removing obstacles."*  

  **One Rearrangement Trigger:**  
  If you tell me **the group prioritizes speed/trust over precision**, I’d collapse frameworks into:  
  > *"Two choices: (1) Equal cash, period. (2) Adjust for depth of need. What do we lose with each?"*  
  ...then focus on defining "depth of need" together.  

  ---  
  **Bottom Line:** Your goal isn’t consensus—it’s revealing the question beneath the fight. If they leave arguing *better* about *what matters*, you’ve won.
