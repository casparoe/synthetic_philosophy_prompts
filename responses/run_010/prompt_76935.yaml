answer: |-
  ## The Indivisible Problem: Can We Maximise Moral Expectation Without Knowing What Counts as a Theory?

  **1. The Core Question (Verifiable Outcome):**
  Can Expected Choice-Worthiness Maximisation (ECWM) – the decision rule prescribing the action with the highest probability-weighted average choice-worthiness across moral theories – yield stable action rankings *regardless of how we individuate (count and define) distinct moral theories*? If not, can ECWM be repaired (e.g., through invariance requirements or robustness criteria) to overcome this dependency, or does this challenge fundamentally undermine ECWM as a viable decision procedure under moral uncertainty?

  *Verifiability:* At year's end, success means either:
  *(a)* A demonstrably partition-invariant ECWM rule or robust decision criterion *validated* against clear counterexamples.
  *(b)* A rigorous impossibility proof showing *no* such invariant/robust rule exists under plausible assumptions.
  *(c)* A decisive reframing demonstrating the individuation problem dissolves upon correct analysis.
  Failure means providing only inconclusive analysis, failing to resolve clear counterexamples, or showing the problem merely relocates without solution.

  **2. Distinct Problem: Not Just Old Wine, New Bottle**
  The established "intertheoretic comparison problem" asks: *Given* distinct theories T1 and T2, how do we map their choice-worthiness scales (e.g., utilitarian utils vs. Kantian duties) to a common measure for aggregation? This assumes T1 and T2 *are* distinct entities. The **individuation problem** is logically prior: Which set {T1, T2, T3...} *should* we assign credences over? It asks *what constitutes a fundamental moral theory worthy of its own credence*? Crucially, different ways of carving theory-space (different partitions) lead to different sets of theories, potentially altering the aggregated ECW ranking of actions. This problem arises *before* scale comparison and is distinct because:

  *   **Source:** Intertheoretic comparison stems from *incommensurability*. Individuation stems from *vagueness* and *arbitrariness* in what counts as a unique theory.
  *   **Analogy:** Comparing scales is like converting Euros to Dollars *once you know you have Euros and Dollars*. Individuation is deciding whether Euros and Swiss Francs are distinct currencies or just minor variants of a single "Continental Currency".
  *   **Impact:** Even *with* a perfect comparison solution, different partitions can flip ECW rankings. The comparison problem doesn't address *which* theories we should be comparing.

  **3. The Plan: Term-by-Term Work (Bayesian Analogy: A Useful Trap?)**

  *   **Term 1 (Problem Refinement & Toy Modelling):** Deep-dive into core moral uncertainty literature (e.g., MacAskill, Sepielli, Lockhart) & philosophical work on theory individuation. **Crucially:** Rigorously formalize the individuation challenge for ECWM. Develop 2-3 precise, minimal **toy examples** demonstrating ranking-flips based solely on partition choice (see Section 4). *Bayesian Analogy Assessment:* The analogy to choosing a hypothesis space *is useful* for framing the problem's structure (language dependence in Carnap mirrors partition dependence here). *However, it is a trap* if used to suggest existing Bayesian solutions (like "just pick the most fundamental partition") apply directly. Moral "fundamentality" is deeply contested. Instead, the analogy helps identify *why* standard Bayesianism avoids this – empirical evidence anchors hypothesis individuation in a way moral evidence cannot. **Use Instead:** Focus on formal decision-theoretic properties like *partition-invariance* or *robustness* of ECW rankings.

  *   **Term 2 (Exploring Solutions: Invariance & Robustness):** Systematically explore potential "fixes":
      *   *Invariance Requirement:* Can we demand ECW rankings hold across *all* plausible partitions? Test with toy examples. Likely too strong/impossible? Analyze consequences.
      *   *Robustness Criteria:* Can we find actions whose high ECW ranking holds across a *wide range* of plausible partitions? Develop metrics for robustness.
      *   *Refined Aggregation Rules:* Explore alternatives to simple averaging (e.g., maximin over partitions?).
      *   *"Principled Partition" Search:* What formal criteria (e.g., logical independence, explanatory fundamentality, minimal arbitrariness) could define a unique partition? Evaluate feasibility.

  *   **Term 3 (Synthesis, Evaluation & Output):** Consolidate findings. Can a repaired ECWM rule (e.g., "Maximize Robust ECW") be formulated and defended? Or is an impossibility result demonstrable? Or does the problem dissolve upon recognizing ECWM requires a prior "individuation convention"? Draft core chapters of monograph/papers. Define success/failure clearly based on term 1 criteria.

  **4. The Toy Example: Population Ethics Flip (For the Sociolinguist)**
  Imagine deciding whether to create 10 new people, each with lives *slightly* worth living. We have uncertainty about population ethics.

  *   **Partition 1 (Coarse):** Two Theories.
      *   **T1: Total Utilitarianism (TU):** Value = Total Happiness. Creating the lives is good (adds positive value).
      *   **T2: Average Utilitarianism (AU):** Value = Average Happiness. Creating the lives *might be bad* if it lowers the average (e.g., if existing average is high).
      *   *Credences:* Say 50% each.
      *   *ECW:* Depends on specific happiness levels. If AU says "Bad" (-1) and TU says "Good" (+1), ECW = (0.5 * -1) + (0.5 * +1) = 0. Might be neutral.

  *   **Partition 2 (Fine):** Treat TU and AU as distinct theories, but *also* treat **Variable Value Theory (VVT)** as distinct. VVT says: Adding lives *can* be good or bad depending on *other* factors (e.g., resources).
      *   **T1: TU** (Value = Total Happiness, creates +1)
      *   **T2: AU** (Value = Average, creates -1)
      *   **T3: VVT** (Say 50% chance creates +0.5, 50% chance creates -0.5)
      *   *Credences:* Split the original 50% uncertainty about "Non-TU" between AU and VVT. Say 50% TU, 25% AU, 25% VVT.
      *   *ECW:* (0.5 * +1) + (0.25 * -1) + (0.25 * [(0.5 * +0.5) + (0.5 * -0.5)]) = 0.5 - 0.25 + (0.25 * 0) = **+0.25**. Clearly positive!

  *   **The Flip:** Under Partition 1, creating the lives might be neutral (ECW=0). Under Partition 2, treating VVT as distinct, creating the lives is clearly good (ECW=+0.25). The action ranking (create vs. not create) flips depending *only* on whether we lump VVT-like intuitions under AU or split them off. Is VVT a *distinct theory*? There's no clear anchor.

  **5. What Success & Failure Look Like**
  *   **Positive Result:** Could be:
      *   A demonstrably partition-invariant ECWM rule.
      *   A robust decision criterion ("Choose actions with ECW > X across >90% of plausible partitions").
      *   An impossibility theorem proving *no* partition-invariant ECWM rule exists.
      *   A compelling dissolution showing individuation is a necessary convention *external* to ECWM itself, reframing how we apply the rule.
  *   **Failure:** The year fails if:
      *   The problem remains murky without precise formalization.
      *   Proposed solutions crumble under counterexamples (like the toy case).
      *   No clear conclusion is reached regarding the viability/reparability of ECWM.
      *   The work merely relocates the arbitrariness without resolving the ranking-flip vulnerability.

  **6. Honest Scope: Keeping it to Twelve Months**
  This project *explicitly excludes*:
  *   Solving the intertheoretic comparison problem itself. We assume *some* comparison method exists for a given partition.
  *   Deep dives into meta-ethics (e.g., moral realism vs. anti-realism) *except* where directly necessary to assess the feasibility of "principled partitions".
  *   Comprehensive empirical study of how individuals naturally partition moral theories (sociolinguist's domain, but secondary here).
  *   Full exploration of *all* alternative decision rules under moral uncertainty. Focus remains on diagnosing and potentially repairing ECWM.

  The core is the formal, decision-theoretic analysis of partition-dependence and the search for invariance/robustness *within the ECWM framework*. Cutting this scope ensures feasibility: the toy models, solution exploration, and rigorous evaluation of ECWM's core vulnerability are achievable within 12 months. Expanding into the excluded areas would indeed take a decade.
