answer: |-
  ### Brainstorming: The Terrain of Manipulation

  Any account of manipulation must navigate three interconnected minefields. First, the **phenomenological challenge**: manipulation manifests in clinical consent forms where framing alters risk perception, in recommender systems that exploit inertia through defaults, in fundraising appeals leveraging urgency or guilt, and in conversational AI that steers via asymmetric disclosure. These range from interpersonal deceit to structural nudges with no single architect. Second, **theoretical fault lines**: autonomy-based views demand protection from subverted agency, while consequentialists focus on harm or impaired choice-quality. Yet autonomy cannot mean perfect insulation from influence—else all persuasion violates it—and harm-independent wrongs (e.g., non-harmful deception) strain pure consequentialism. Third, **intuition clashes**: transparency sometimes defangs manipulation (disclosed dark patterns remain objectionable), yet covert influence isn’t always wrong (therapist provocations). Exploiting vulnerability feels central, but "vulnerability" is contested—is a preference for defaults a weakness or a feature of bounded rationality? The account must resolve these without begging questions or collapsing distinctions.

  ---

  ### Specification: Acceptance Criteria for an Account of Manipulation

  1.  **Discrimination**  
      *Requirement*: The account must provide necessary and sufficient conditions distinguishing manipulative influence from non-manipulative rational persuasion, without equating efficacy with manipulation.  
      *Motivation*: A surgeon’s clear risk/benefit analysis (rational persuasion) vs. exploiting a patient’s needle phobia to secure consent (manipulation).  
      *Violation Consequence*: Fails to condemn harmful non-rational tactics while over-regulating legitimate persuasion.  
      *Status*: Non-negotiable.  

  2.  **Non-Triviality**  
      *Requirement*: The account must not classify unavoidable framing effects (e.g., word choice, sequence) as inherently manipulative.  
      *Motivation*: All communication involves selection and emphasis; declaring this manipulative paralyzes regulation.  
      *Violation Consequence*: Renders all influence suspect, prohibiting nothing distinctively.  
      *Status*: Non-negotiable.  

  3.  **Success-Independence**  
      *Requirement*: The account must locate the manipulative quality in the influencer’s method or intent, not the outcome, while explaining why successful manipulation is typically worse than failed attempts.  
      *Motivation*: A clumsy phishing email (failed) is still manipulative; a subtle one (successful) compounds wrongdoing with harm.  
      *Violation Consequence*: Absolves ineffective but malicious designs, or conflates moral luck with intrinsic wrongness.  
      *Status*: Non-negotiable.  

  4.  **Hiddenness Handling**  
      *Requirement*: The account must specify whether covertness is definitional to manipulation or a wrong-making feature, and cannot conflate the two.  
      *Motivation*: A dark pattern hidden in UI is manipulative; a surprise party (covert) is not. Transparency in dark patterns doesn’t negate manipulation.  
      *Violation Consequence*: Wrongly excuses disclosed manipulation or condemns benign covert acts.  
      *Status*: Strongly preferred.  

  5.  **Structural Agency**  
      *Requirement*: The account must attribute manipulation to systems without a single intending agent, identifying responsibility-bearing entities (e.g., designers, maintainers, institutions).  
      *Motivation*: Algorithmic feeds optimizing engagement via A/B-tested emotional triggers.  
      *Violation Consequence*: Leaves structural influence ungovernable despite identical harms to interpersonal cases.  
      *Status*: Non-negotiable.  

  6.  **Coercion Distinction**  
      *Requirement*: The account must differentiate manipulation (distorting appraisal of options) from coercion (restricting options), while accommodating hybrids (e.g., exploitative offers).  
      *Motivation*: A threat ("Sign or I’ll sue") is coercion; framing a contract’s terms to obscure costs is manipulation.  
      *Violation Consequence*: Collapses distinct harms, impairing proportional redress.  
      *Status*: Non-negotiable.  

  7.  **Vulnerability Baseline**  
      *Requirement*: The account must define "exploited vulnerability" against a normative baseline of decision-making competence, not merely deviation from population averages.  
      *Motivation*: Exploiting addiction (non-controversial weakness) vs. exploiting a user’s reasonable trust in default settings (context-appropriate reliance).  
      *Violation Consequence*: Overextends to all influence or excuses predation on adaptive vulnerabilities (e.g., platform-induced dependency).  
      *Status*: Strongly preferred.  

  8.  **Authorization Non-Naivety**  
      *Requirement*: The account must recognize that roles/consent can *defeasibly* permit otherwise-manipulative tactics, but reject consent obtained via prior manipulation as invalid authorization.  
      *Motivation*: A therapist’s provocation requested by a patient vs. a EULA obtained via deceptive design.  
      *Violation Consequence*: Allows self-justifying manipulation or ignores context-sensitive permissions.  
      *Status*: Non-negotiable.  

  9.  **Anti-Circularity**  
      *Requirement*: The account must identify a wrong-making feature (e.g., subverting rational agency) independent of the overall moral judgment.  
      *Motivation*: Non-harmful deception (e.g., placebo prescribed without consent) wrongs the target by bypassing deliberation.  
      *Violation Consequence*: Cannot explain *why* manipulation is pro tanto wrong, reducing to "it’s wrong because it’s manipulation."  
      *Status*: Non-negotiable.  

  10. **Epistemic Feasibility**  
      *Requirement*: Criteria must be verifiable through evidence available to the board (e.g., interface design, disclosed algorithms, user testimony), not solely via unobservable counterfactuals or intent.  
      *Motivation*: Board cannot test whether a user *would* have consented under different framing, but can assess if framing obscured material facts.  
      *Violation Consequence*: Makes standards unenforceable or speculative.  
      *Status*: Non-negotiable.  

  11. **Gradability (Demoted)**  
      *Requirement*: [Rejected as definitional requirement] Gradability is crucial for *regulation* but not for defining manipulation. An account can identify manipulation categorically while allowing that instances vary in severity.  
      *Motivation*: Ranking emotional appeals vs. defaults matters for penalties, but both can be manipulation.  
      *Violation Consequence*: None for definition; demoting avoids overloading the account.  
      *Status*: Rejected for definition (retained for regulatory application).  

  12. **Empirical Anchoring**  
      *Requirement*: The account must align with robust empirical findings (e.g., framing effects, default power) without relying on contested mechanisms (e.g., priming).  
      *Motivation*: Defaults exploit inertia (well-established); emotional contagion via UI (replication-sensitive).  
      *Violation Consequence*: Binds ethics to unstable science or ignores how influence actually works.  
      *Status*: Strongly preferred.  

  ---

  ### Answers to Questions  

  **1. Genuine Requirements vs. Imported Demands**  
  Genuine requirements are those necessary to isolate manipulation as a distinct concept: Discrimination, Non-Triviality, Success-Independence, Structural Agency, Coercion Distinction, Anti-Circularity, and Epistemic Feasibility. **Gradability** is demoted—it’s a regulatory need, not definitional. **Vulnerability Baseline** and **Authorization** are borderline; they address *wrongness conditions* more than definition but are retained because they prevent over-/under-inclusion. **Empirical Anchoring** ensures practical relevance but isn’t strictly definitional.  

  **2. Most Costly Requirement**  
  **Structural Agency** eliminates the largest number of accounts. Most philosophical theories (e.g., Nudge-era intentionalism, Kantian focus on individual maxims) require an intending agent. Satisfying this demands rethinking agency as distributed (e.g., corporate negligence, algorithmic governance) or defining manipulation *structurally* via features like "systematically exploits cognitive biases." This is costly because it abandons intuitive actor-centric models.  

  **3. Jointly Unsatisfiable Pair**  
  **Success-Independence** and **Epistemic Feasibility** conflict. Success-Independence requires judging manipulation by intent/method, not outcome. But Epistemic Feasibility demands observable evidence—and intent/method are often opaque in structural cases (e.g., an A/B test’s *purpose*). The board cannot reliably access unstated intents or hypothetical methods (e.g., "Was this default designed to exploit inertia?"). Counterfactual evidence ("Would users resist if aware?") violates Epistemic Feasibility. Resolving this likely requires tying "method" to objectively identifiable design features (e.g., obscuring costs) rather than subjective intent.  

  ---

  ### Assessment of Definition Families  

  **Psychological Mechanism Accounts**  
  Define manipulation as influence operating via non-rational/arational routes (e.g., emotions, biases).  
  *Violates First*: **Non-Triviality**. All persuasion uses some non-rational elements (e.g., rhetoric). This overextends to condemn benign influence (e.g., charity ads showing suffering).  

  **Transparency Accounts**  
  Define manipulation as influence the target could not endorse if aware of its workings.  
  *Violates First*: **Hiddenness Handling**. Covertness isn’t always wrong (e.g., strategic ignorance in games). A transparent dark pattern (e.g., "We use urgency to pressure donations") remains manipulative.  

  **Vulnerability Exploitation Accounts**  
  Define manipulation as influence exploiting a weakness (e.g., fear, weakness of will).  
  *Violates First*: **Vulnerability Baseline**. Fails to specify normative baselines. Is exploiting decision fatigue on a donation site "manipulation"? Without a standard, it risks over-expanding or being under-protective.
