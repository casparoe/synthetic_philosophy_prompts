answer: |-
  Here is a menu of precise readings for "a rigid designator designates the same object in every possible world," formatted for your handout. Each reading is presented with the requested components.

  ---

  **R1: Constancy of Extension (Existence-Presupposing)**
  1. **Formal Gloss**: A term *t* is rigid iff for all worlds *w*₁, *w*₂ ∈ *W*: if *I*(*t*, *w*₁) is defined and *I*(*t*, *w*₂) is defined, then *I*(*t*, *w*₁) = *I*(*t*, *w*₂).  
     (Where *I* is an interpretation function mapping term-world pairs to objects in *D*(*w*), and *D*(*w*) is the domain of *w*. Assumes designation implies existence at *w*.)
  2. **Verdict**: **False**.  
     Fails for names like "Aristotle" in worlds where Aristotle doesn't exist (*I*(*t*, *w*) is undefined in those worlds).
  3. **Distinguishes Names/Descriptions?**: No. Fails against rigidified descriptions (e.g., "actual teacher of Alexander" satisfies constancy).
  4. **Necessity of Identity?**: Supports inference only if both terms designate in all worlds (requires necessary existence).

  **R2: Constancy of Extension (Existence-Neutral)**
  1. **Formal Gloss**: A term *t* is rigid iff for all worlds *w*₁, *w*₂ ∈ *W*: *I*(*t*, *w*₁) = *I*(*t*, *w*₂).  
     (Where *I*(*t*, *w*) may be undefined or a designated "null" object if the bearer doesn't exist at *w*. Semantic value is constant *across worlds as abstract points*.)
  2. **Verdict**: **Substantive and defensible** (Kripke’s intended reading).  
     Requires transworld identity but does not presuppose a *criterion* for it; worlds are circumstances of evaluation.
  3. **Distinguishes Names/Descriptions?**: **Yes**. Ordinary descriptions (e.g., "teacher of Alexander") vary; names are constant. **Undone by rigidification**: "Actual teacher" is rigid, so further argument needed (e.g., rigidity alone ≠ naming, names lack descriptive content).
  4. **Necessity of Identity?**: **Supports inference**. If "a = b" is true and *a*, *b* are rigid (R2), then ∀*w* *I*(*a*, *w*) = *I*(*b*, *w*), so □(a=b). Assumes classical identity.

  **R3: Designation-in-Existence-Worlds**
  1. **Formal Gloss**: A term *t* is rigid iff for all worlds *w* where the bearer *exists*, *I*(*t*, *w*) = the bearer, and for worlds *w* where the bearer does not exist, *I*(*t*, *w*) is undefined/null.  
     (Explicitly restricts constancy to worlds where the object exists.)
  2. **Verdict**: **Substantive and defensible**.  
     Equivalent to R2 if "designation" is existence-entailing; equivalent only if domains are constant or nonexistent objects are excluded.
  3. **Distinguishes Names/Descriptions?**: **Yes** (same as R2). **Undone by rigidification** (same as R2).
  4. **Necessity of Identity?**: **Supports inference** (same as R2).

  **R4: Transworld Identity via Modal Profile**
  1. **Formal Gloss**: A term *t* is rigid iff □∀x (x = *t* → □(x = *t*)).  
     (i.e., Necessarily, anything identical to *t* is necessarily identical to *t*).
  2. **Verdict**: **Substantive and defensible** (but not equivalent to constancy without assumptions).  
     Equivalent to R2/R3 **only if** objects exist necessarily or domains are constant. Fails if *t*'s bearer exists contingently: "x = Aristotle" is not true of Aristotle in worlds where he doesn’t exist, violating the inner necessity.
  3. **Distinguishes Names/Descriptions?**: **Yes** for non-rigidified descriptions. **Undone by rigidification** (e.g., "actual teacher" satisfies this).
  4. **Necessity of Identity?**: **Directly entails it** if both terms satisfy R4. Requires no additional assumptions.

  **R5: Quasi-Rigidity (User-Stipulated)**
  1. **Formal Gloss**: A term *t* is quasi-rigid iff for all *w* ∈ *W*: either *I*(*t*, *w*) = *I*(*t*, @) or *I*(*t*, *w*) is undefined/null.  
     (@ is the actual world.)
  2. **Verdict**: **Substantive and defensible**.  
     Coincides with **R3** if "bearer exists" = "bearer exists at *w*". In frameworks with non-existent objects (e.g., Meinongian), R3 may allow designation of non-existent objects, while R5 does not.
  3. **Distinguishes Names/Descriptions?**: **No**. "Actual teacher of Alexander" is quasi-rigid. Names are quasi-rigid.
  4. **Necessity of Identity?**: **Fails**. "Hesperus = Phosphorus" could be contingently true if one term is quasi-rigid but not rigid (e.g., "actual brightest evening star" vs. "actual brightest morning star").

  **R6: Rigidity for General Terms (Constant Kind)**
  1. **Formal Gloss**: A general term *G* is rigid iff for all *w* ∈ *W*, *I*(*G*, *w*) = *K* (a fixed kind/universal).  
     (e.g., "water" designates H₂O in all worlds.)
  2. **Verdict**: **Substantive and defensible** (Kripke’s view for natural kinds).  
     Not equivalent to constancy of extension (the set of watery samples varies by world).
  3. **Distinguishes?**: N/A (general terms). "Water" is rigid; "the clear drinkable liquid in oceans" is not.
  4. **Necessity of Identity?**: Not applicable (identity is singular).

  **R7: Rigidity for General Terms (Constant Extension)**
  1. **Formal Gloss**: A general term *G* is rigid iff for all *w* ∈ *W*, *I*(*G*, *w*) = *S* (a fixed set of individuals).  
     (e.g., "tiger" would designate the same set of animals in all worlds.)
  2. **Verdict**: **False**.  
     Extensions vary across worlds (e.g., tigers that might not have been born).
  3. **Distinguishes?**: N/A. Trivially false for most terms.

  ---

  ### Special Responses:
  - **Modal Profile (R4) vs. Constancy (R2/R3)**: Equivalent only if objects exist necessarily or we use constant domains. If domains vary and objects exist contingently, R4 fails while R2/R3 hold for names (e.g., "x = Aristotle" isn't true at worlds where Aristotle doesn’t exist, so R4’s inner necessity fails).
  - **Quasi-Rigidity**: Coincides with **R3** in standard variable-domain semantics (where designation implies existence). Diverges if frameworks allow designation of non-existent objects (R3 might permit it; R5 never does).
  - **General Terms**: **R6** extends coherently (rigidity as constant kind-designation). **R7** (constant extension) is untenable. Students conflate R6 and R7.

  ---

  ### The Anti-Descriptivist Argument’s Required Reading
  The seminar’s argument against descriptivism requires **R2** (Constancy of Extension, Existence-Neutral). Descriptivism holds that names are synonymous with descriptions, fixing reference via contingent properties. R2 shows names and descriptions differ in modal behavior: names designate the same object in every world (regardless of properties), while typical descriptions designate different objects in different worlds. Rigidification ("actual F") produces a term that satisfies R2, but this doesn’t save descriptivism because (a) ordinary descriptions aren’t rigidified, and (b) rigidified descriptions still differ from names epistemologically (e.g., "Aristotle" isn’t synonymous with "actual teacher of Alexander"). R2 also directly supports the necessity of identity (using rigid designators), which descriptivism cannot explain (e.g., "Hesperus = Phosphorus" is necessary but not knowable a priori if names are rigid). R1, R3–R5, and R6–R7 fail to ground this core argument: R1 is false; R3 is equivalent but less general; R4 depends on existence assumptions; R5 allows contingent identities; R6–R7 apply to general terms.

  ---

  Verdict: R2
