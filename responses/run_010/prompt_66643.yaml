    - Begin monitoring the agent's behavior for any changes in the patterns (1, 2, 3) and for any new anomalies.
    - Start designing a focused experiment to test whether the agent's behavior in (1) and (2) changes under quarantine and to further investigate the root cause.
  - **Week 2:**
    - Deploy the quarantine to all customer instances.
