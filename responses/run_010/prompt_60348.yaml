  ### Aletheia Hub: Troubleshooting and Known Behavior  
  *Last updated: October 28, 2023*  

  **Welcome to the Aletheia Hub Support Center!**  
  Your Aletheia Hub intelligently interprets home sensor data to anticipate needs and automate routines. By design, it processes ambiguous real-world signals (e.g., motion, sound, temperature fluctuations) to build a dynamic understanding of your environment. Below are common questions about its behavior.  

  ---

  #### 1. Why does the Hub avoid "yes" or "no" answers?  
  The Hub synthesizes data from multiple low-cost sensors, which may occasionally conflict or return unclear readings (e.g., a motion sensor may trigger due to pets or swaying curtains). To maintain accuracy, it calculates *confidence percentages* (e.g., "70% chance the room is occupied") rather than binary conclusions. This reflects its assessment of all possible interpretations of a sensor event. Once a confidence percentage is assigned, the Hub preserves relationships between outcomes. For example:  
  - If it knows *how often* motion correlates with human presence (e.g., "When occupied, motion occurs 90% of the time"),  
  - It will retain this correlation even after revising room-occupancy confidence.  
  This ensures predictions stay internally consistent despite sensor uncertainty.  

  ---

  #### 2. "Partition Configuration Required" During Setup  
  During initial calibration, the Hub requires users to define a *partition*—a list of mutually exclusive outcomes for each sensor type. For example:  
  - Motion sensor: `{Motion Detected, No Motion Detected}`  
  - Door sensor: `{Door Open, Door Closed}`  
  The Hub will not proceed until partitions are manually specified. It cannot recommend partitions or adjust granularity (e.g., merging "Motion Detected" and "No Motion Detected" into one outcome). This is intentional. The Hub relies on these user-defined categories to weight possibilities correctly. Changes post-setup require a factory reset.  

  ---

  #### 3. Example: How the Hub Updates Confidence  
  Suppose the Hub starts with:  
  - 40% confidence the living room is occupied.  
  - 60% confidence it is unoccupied.  

  It then detects motion. Due to sensor noise, it assigns:  
  - 80% confidence to "Motion Detected."  
  - 20% confidence to "No Motion Detected."  

  Using its preserved correlations (e.g., "When occupied, motion occurs 90% of the time"; "When unoccupied, motion occurs 30% of the time"), it updates room-occupancy confidence as follows:  

  | Condition          | Prior Confidence | Adjustment Factor¹ | Revised Confidence |
  |--------------------|------------------|--------------------|---------------------|
  | Occupied           | 40%              | ×1.376             | **55.1%**          |
  | Unoccupied         | 60%              | ×0.749             | **44.9%**           

  ¹*Derived from sensor reliability data and new evidence weights.*  
  This reallocation ensures correlations between motion and occupancy remain stable while confidence shifts.  

  ---

  #### 4. Order of Readings Affects Final Confidence (Expected Behavior)  
  The Hub’s confidence updates depend on the sequence of sensor readings. Reversing the order may yield different results. For example:  
  - **Scenario A**: Apply "Motion Detected at 80% confidence" (outcome above), then "Motion Detected at 10% confidence."  
    Final confidence: **21.3% occupied**.  
  - **Scenario B**: Apply "Motion Detected at 10% confidence" first, then "Motion Detected at 80% confidence."  
    Final confidence: **27.5% occupied**.  

  This is not a defect. The Hub treats each reading as a standalone revision of likelihoods. Earlier updates alter the baseline for later ones, much like recalculating a journey’s destination after each turn. Consistency is maintained *within* each step, but outcomes are path-dependent.  

  ---

  #### 5. Environment Shifts and Warranty Coverage  
  The Hub assumes sensor reliabilities (e.g., "Motion Detected" accuracy given occupancy) are fixed. Significant environmental changes—such as installing tinted windows (reducing motion-sensor accuracy) or adding loud HVAC systems (altering sound correlations)—may violate this assumption.  

  **Warranty notice**:  
  - The Hub includes a 1-year warranty for defects.  
  - *Warranty void* if environmental shifts cause "rigidity degradation" (measured as >5% unexplained prediction drift over 7 days).  
  - Recommended: Re-run initial calibration after home renovations.  

  ---

  #### 6. Workaround: Forcing Certainty on a Reading  
  *[Unsupported feature. Not recommended for routine use.]*  
  If you wish to treat a sensor reading as 100% certain (e.g., force "Motion Detected" to 100% confidence):  
  1. Redefine your partition to describe the *exact sensory state* (e.g., replace "Motion Detected" with "Sensor ID #4 returned code 0x7F at 14:32:01").  
  2. Assign 100% confidence to that specific state.  
  The Hub will update confidences under this artificial constraint.  

  **Why we discourage this**: Real-world sensors are error-prone. Overriding uncertainty may propagate inaccuracies (e.g., trusting a dust-triggered motion reading as "certain" distorts future predictions).  

  ---

  #### 7. Note on Standard Behavior  
  All Aletheia Hubs, including yours, revise confidences as described above. This is fundamental to balancing sensor limitations with household automation. For optimal results, place sensors away from heat sources/pets and update firmware monthly.  

  ---

  ### Customer Reviews (Excerpts)  
  ★★★★★  
  *"Love how it anticipates my coffee routine! But it insists the bedroom is ‘45% occupied’ when my cat naps there. Just say ‘cat’!"*  
  — *Martha T., verified purchase*  

  ★★☆☆☆  
