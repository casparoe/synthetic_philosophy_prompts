answer: |-
  The practice described presents a profound tension between legal principle and security pragmatism, rooted in distinct institutional roles and conceptions of wrongdoing. Here's a breakdown of the underlying theories and their coherence:

  ### Evidentiary Exclusion (Court Practice): Theories of Wrongdoing & Agency
  1.  **Rejection of Complicity & Judicial Integrity:** The core theory is **refusing to let the state convert a person's coerced words into a verdict against them, thereby avoiding judicial complicity in the original wrong.** Admitting the evidence would make the court an instrument of the torturer's purpose – convicting the accused based on their own broken will. This violates the state's duty to treat individuals as ends, not means.
  2.  **Affirmation of Human Dignity & Autonomy:** Closely related, the rule protects the individual's fundamental right against self-incrimination under torture. Using the statement validates the torture by giving it legal effect. The exception (using the statement *against the torturer*) reinforces this: it condemns the torture act itself, not the victim.
  3.  **Deterrence (Secondary):** While the exception weakens unreliability as the *primary* justification, deterrence of torture *by state actors subject to the court's jurisdiction* remains a plausible secondary aim. The rule signals that torture won't yield usable evidence in court.
  4.  **Public Justification & Legitimacy:** The rule is essential for the **distinctive business of publicly justifying a finding of guilt.** A conviction based on torture-tainted evidence fatally undermines the moral authority and legitimacy of the verdict and the legal system itself. Justice must be seen to be done, and torture is antithetical to justice.

  **What the Rule Strictly Requires vs. Tolerates:**
  *   **Strictly Requires:** Avoiding judicial complicity in the torture and refusing to legitimize or benefit from it by using its product against the victim. This is non-negotiable for the court's integrity.
  *   **Tolerates/Accommodates:** The *possibility* that reliable information might be excluded (acknowledging a cost). Deterrence is a welcome effect but not the core, absolute reason for the rule, as the exception shows deterrence isn't paramount when prosecuting the torturer.

  ### Intelligence Acceptance: Theories & Pragmatism
  1.  **Consequentialism & Necessity:** The intelligence half operates on a frankly **consequentialist "ticking bomb" rationale:** Preventing imminent, catastrophic harm justifies using any potentially actionable information, regardless of source morality. Ignoring intelligence because of its origin is seen as an irresponsible dereliction of the duty to protect.
  2.  **Distinction Between Proof and Action:** It presupposes a **fundamental difference in kind between proving something to a legal standard of certainty and merely relying on it for operational planning or risk mitigation.** Intelligence agencies deal in probabilities, warnings, and leads; courts demand proof beyond reasonable doubt. Using information to *prevent* a bomb is categorically different from using it to *convict* someone.
  3.  **Institutional Moral Division of Labor (De Facto):** While rarely explicitly endorsed, the practice relies on a *de facto* **moral division of labor between institutions bearing different relations to the same act.** Courts, as guardians of justice and individual rights, *must* categorically reject torture's fruits. Intelligence agencies, tasked with preventing harm, operate in a grayer, pre-emptive realm where absolute prohibitions might paralyze necessary action. They "bear" the act differently – not legitimizing it legally, but pragmatically acting on its product to avert disaster.

  **What Intelligence Strictly Requires vs. Tolerates:**
  *   **Strictly Requires:** The ability to act on information to prevent imminent, severe harm, prioritizing consequences over the source's morality in high-stakes scenarios. The distinction between actionable intelligence and legal evidence is essential.
  *   **Tolerates:** The *possibility* that the information might be unreliable or obtained immorally (mitigated through corroboration). It implicitly tolerates the legal exclusion rule *for courts* as a separate institutional imperative.

  ### Coherence of the Pairing
  The pairing is **inherently tense but *provisionally* coherent** through institutional differentiation:
  1.  **Different Aims:** Courts aim for *justice* (retrospective, rule-bound, focused on individual rights). Intelligence aims for *security* (prospective, risk-based, focused on collective protection).
  2.  **Different Standards:** Courts require proof. Intelligence requires actionable leads.
  3.  **Different Relationship to the Wrong:** Courts *must* disavow and refuse to benefit from torture directly in their core function (adjudicating guilt). Intelligence uses the information *despite* its source, not *because* of it or to *endorse* the torture, but purely for preventative action. They are not *legitimizing* the torture act itself through a verdict.

  **However, the coherence is fragile and morally problematic:**
  *   It creates a "clean hands" illusion for courts while the state (via intelligence) indirectly benefits from torture.
  *   It risks incentivizing torture by foreign partners ("We can't use it in court, but tell us what you find out...").
  *   It undermines the state's absolute condemnation of torture in principle.

  ### Impact of Replacing with Frank Consequentialism
  If the underlying view shifted entirely to consequentialism ("maximize good outcomes/minimize harm"):
  1.  **Evidentiary Half Would Collapse:** The absolute exclusion rule would vanish. Courts would admit torture-derived evidence if deemed sufficiently reliable and probative for securing convictions deemed beneficial (e.g., convicting dangerous terrorists). Arguments about complicity, dignity, and legitimacy would be overruled by the calculus of preventing future crime/terrorism through conviction.
  2.  **Intelligence Half Would Remain Largely Unchanged:** Its core rationale *is* already consequentialist.
  3.  **Required Changes:**
      *   **Courts:** Article 15's exclusionary rule would be abandoned or severely weakened (e.g., replaced with a reliability test, balancing test weighing probative value against prejudice/unfairness). The exception might become irrelevant or expanded.
      *   **Both:** The moral division of labor would disappear. Both institutions would explicitly prioritize security outcomes over the prohibition against benefiting from torture. The state's stance against torture would become purely rhetorical or conditional ("we don't torture... unless the stakes are high enough, and even then, we'll use the results").

  ## Conclusion
  The current practice rests primarily on the court's need to avoid complicity in torture and uphold the integrity of the justice system by refusing to use a victim's coerced words against them. Intelligence pragmatism rests on a consequentialist imperative to prevent harm and a distinction between actionable intelligence and legal evidence. While differentiated institutional roles provide a framework for provisional coexistence, the tension reflects a deep conflict between deontological principles (dignity, anti-complicity) and consequentialist imperatives (security). Replacing the foundational view with pure consequentialism would fundamentally alter the legal half, dissolving the absolute prohibition on using torture-derived evidence in court and aligning judicial practice much more closely with intelligence pragmatism, at the cost of core principles of justice and human rights.
