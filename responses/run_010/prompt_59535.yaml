  - Per capita risk (down 5.5%)
  - Total victims (up 136%)
  - Expected harm under veil of ignorance (complex calculation)
  - Risk inequality (possibly increased due to demographic shifts)

  For Part B's essay, I'm structuring it around two core questions. The demographer vs philosopher debate isn't merely verbal - it reflects fundamentally different ethical commitments: deontological focus on victims vs consequentialist risk assessment. The definitional drift issue mirrors real-world measurement challenges like Pinker's historical violence decline thesis. 

  On structural violence inclusion: this isn't just definitional but ontological. If we accept Galtung's framework, the 2020 expansion validly captures previously excluded harms, making backward comparison invalid without retroactive adjustment. 

  The risk distribution problem attacks the very notion of "society-level" violence. A national rate assumes homogeneity that doesn't exist, potentially erasing vulnerable subgroups. I'm considering referencing Milanovic's elephant curve to illustrate how averages mask distributional realities.

