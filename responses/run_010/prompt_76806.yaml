answer: |-
  ## Capstone Proposal: Sunk Costs as Evidential Artifacts: When Past Investment Signals Value

  **Research Question:** Under what precise conditions can the fact that an agent previously chose to invest in a project provide *genuine evidential value* regarding the project’s current expected value, justifying continued investment (honoring sunk costs) as rational deference to a potentially better-informed past self, rather than constituting the sunk-cost fallacy? Answering this requires specifying the informational asymmetries between past and present selves that prevent the past act from being "screened off" by the agent's current evidence set.

  **Gap in Current Discourse:** The prevailing perspectives on the sunk-cost effect uniformly treat the past investment as causally inert with respect to the project's actual value. Psychological accounts (e.g., loss aversion, commitment bias, self-justification) explain persistence as an emotional or cognitive error driven by the pain of loss or a desire for consistency. Signaling theories frame continuation as a strategic choice to maintain reputation, where the cost itself acts only as a costly signal to *others*. Crucially, **none** of these dominant views allows that the bare fact *"I invested"* could rationally update the agent's *own* current belief about the project’s worthiness. They explain the behavior without granting the sunk cost any intrinsic *informational content* for the agent's present deliberation. My proposal challenges this orthodoxy by seriously considering the past act *as evidence* internal to the agent's reasoning process.

  **Methodology & Justification:** I will employ formal philosophical analysis grounded in Bayesian decision theory and the economics of information. The core method involves:
  1.  **Formalizing Deference:** Modeling the past self as a distinct "expert" whose action (investment) reveals private information (S) now inaccessible to the present self.
  2.  **Screening-Off Condition:** Rigorously defining the condition under which the past act provides *novel* information – specifically, when the present self's evidence (E) does *not* screen off the act (A) from the project's state/value (V). Formally: When Pr(V | A, E) ≠ Pr(V | E), implying A carries information about V *conditional on E*.
  3.  **Case Analysis:** Testing this framework against paradigmatic sunk-cost scenarios (e.g., war, concert ticket, R&D project) to identify where informational asymmetry plausibly exists (e.g., forgotten initial enthusiasm, discarded expert advice, degraded judgment capacity) and where it does not (e.g., pure commitment signaling, known unchanged valuations).
  4.  **Distinguishing Evidence from Correlation:** Critically examining whether cases where the framework *seems* applicable are merely instances where the sunk cost correlates with an *unsunk* cost or project value, collapsing the distinction.

  **Why this method?** Running new experiments would be impractical within scope and risks confounding the specific informational mechanism with established psychological drivers. Demonstrating the sunk-cost effect violates standard norms (e.g., consequentialism) is well-trodden ground; it doesn't address the *novel justificatory possibility* raised here. Philosophical analysis is essential to precisely define the conditions for rational deference, disentangle evidence from correlation, and assess normative implications within decision theory itself.

  **Argument Structure & Timeline (11 Weeks):**

  *   **Weeks 1-2: Foundational Grounding:** Define the sunk-cost effect & fallacy. Critically review standard psychological/signaling explanations, establishing their exclusion of the past act as *evidence*. Introduce core decision-theoretic concepts (consequentialism, expected utility).
  *   **Week 3: Formalizing the Hypothesis:** Develop the core Bayesian argument: past action as potential evidence under informational asymmetry. Define the screening-off condition (Pr(V|A,E) vs. Pr(V|E)) and its necessity. Introduce the "past self as expert" model.
  *   **Week 4: Specifying Informational Asymmetries:** Enumerate and formalize types of inaccessible past information S (forgotten data/feelings, superseded judgment capacity, discarded external input) that prevent screening-off by current E.
  *   **Weeks 5-6: Testing Against Paradigm Cases (Positive):** Analyze cases where intuition *might* support evidential value (e.g., non-refundable ticket for a potentially enjoyable event; continuing a research project based on initial, now-forgotten, strong intuition). Can the model justify persistence without fallacy?
  *   **Weeks 7-8: Testing Against Paradigm Cases (Negative):** Analyze cases where honoring costs seems clearly fallacious (e.g., continuing war due to lives lost; finishing a bad meal because it's paid for). Does the informational asymmetry model *fail* here, or can it distinguish why?
  *   **Week 9: The Correlation Challenge:** Confront the central difficulty: Does the model merely identify cases where the past cost *correlates* with project value (implying it wasn't purely sunk) rather than providing genuine evidence? Develop criteria to distinguish evidential value from mere correlation.
  *   **Week 10: Synthesis and Normative Implications:** Synthesize the precise conditions under which sunk costs carry evidential weight. Discuss implications for the rationality debate: Is this a distinct justification, or a disguised fallacy? How does it interact with/constrain standard norms?
  *   **Week 11: Final Drafting & Refinement:** Polish arguments, ensure clarity, tighten formalisms, emphasize contributions and limitations.

  **Success & Failure Conditions:**

  *   **Positive Result:** The project succeeds if it demonstrates that there exists a coherent, non-trivial set of conditions (specified by informational asymmetry preventing screening-off) under which a past sunk-cost investment *can* rationally update an agent's belief about project value, justifying continuation as deference. Success requires clearly differentiating this evidential justification from both the standard fallacy and from situations where the cost correlates with unsunk factors.
  *   **Failure Condition:** The project fails if, upon rigorous analysis:
      1.  The identified informational asymmetries *always* imply that the past cost is correlated with the project's *current or future* value (or cost), meaning the cost wasn't truly economically "sunk" in the relevant sense. Or,
      2.  The conditions required for evidential value are so rare, contrived, or indistinguishable from correlation that they offer no meaningful challenge to the orthodox view of the sunk-cost effect as fundamentally irrational in its core instances.

  **Candid Scope Note:** A fully comprehensive taxonomy of *all* possible types of informational asymmetries (S) and their precise evidential weight in diverse scenarios is too ambitious for 5000 words. The paper should focus on establishing the core *possibility* and *structure* of the evidential argument, rigorously defining the screening-off condition, demonstrating its application/collapse in 2-3 key contrasting case pairs (e.g., ticket vs. war), and directly confronting the correlation challenge. Exploring the full universe of S or developing a complete decision rule incorporating past acts should be deferred.
