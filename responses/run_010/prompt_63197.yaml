prompt: |-
  I'm in the second half of a philosophy of biology seminar, and we've spent the last two weeks on biological function. I've read enough to know the two camps: the causal-role or dispositional account associated with Cummins, and the etiological account of Wright, Millikan, and Neander, on which a trait's function is the effect that explains why the trait is there. Our seminar leader keeps compressing the second view into the line "functions are selected effects," and has now twice used it to close a discussion rather than to continue one.

  The first time, a classmate asked whether a structure that arose by drift and was only later recruited to a job it never had has a function at all, and was told that if it wasn't selected for, it isn't a function, full stop. The second time it was me. I work in a synthetic biology group, and I asked about two things in our own strains. One is a gene we put on a construct purely as a selection marker for our convenience; under the chemostat conditions we actually run, its product also degrades a contaminant, and the strain's growth depends on that second effect. The other is a protein in a directed-evolution lineage that, after roughly forty rounds of lab-imposed selection, has acquired a side activity we now rely on for the assay. I asked whether these parts have functions and whether they have more than one, and was told the slogan settles it, since selection did the selecting. I'm not convinced, and I suspect one sentence is being made to carry several different claims, not all of them true.

  Could you lay out the distinct theses "functions are selected effects" might be expressing, arranged from weakest to strongest? For each, I'd like to know whether it is a truism about how the word is used in evolutionary explanation, a substantive thesis that could be argued for, or something false or at least highly contentious; what it commits you to; and how much of ordinary function talk survives it. Please also attend to a few things I can't pin down myself. "Selected effect" might mean the effect that explains why the trait first arose, the effect that explains why it persists, or the effect most recently selected for, and I don't know whether the choice matters. A trait has many effects, only some of them selected, so I'd like to hear how each reading handles the case where more than one effect was selected, and the case where the effect we care about was never selected but is now indispensable. I'd also like to know what each reading implies about malfunction, about byproducts of otherwise adaptive structures, and about the fact that in my example the selecting agent is a graduate student with a goal rather than differential survival in the wild: does the slogan survive being generalized to designed and artificially selected systems, or does that generalization quietly change the subject?

  Finally, tell me which reading, if any, would actually support the two dismissals above, and which of my classmate's questions and mine would still be live even on that reading. A list I can bring to the next seminar is what I need; assume I know the literature, so no references, just the analysis.
reasoning: |-
  Okay, the user is in a philosophy of biology seminar focusing on biological function. They've covered the two main camps: causal-role (Cummins) and etiological (Wright, Millikan, Neander). The seminar leader keeps using "functions are selected effects" to shut down discussions, and the user feels this oversimplifies things. They have specific examples from synthetic biology that challenge this slogan.

  First, I need to unpack "selected effects" into distinct theses. The user wants them arranged from weakest to strongest, with each thesis categorized as truism, substantive, or contentious. They also have specific concerns: what "selected effect" refers to (origin, persistence, recent selection), handling multiple selected effects, cases where an effect is indispensable but not selected, malfunction, byproducts, and artificial selection in labs.

  Let me start by breaking down the possible meanings of "selected effect." It could refer to the effect that caused the trait's initial fixation, the effect maintaining it currently, or the most recent selective pressure. The user mentioned examples like a gene recruited after drift or a protein with a new side activity from directed evolution. These cases highlight the ambiguity in the slogan.

  For the weakest thesis, I think Thesis 1 would be that functions require selection history, not just current causal roles. This is a truism in evolutionary contexts. Then Thesis 2: Functions are effects that explain presence via past selection. This is core to etiological theories. Thesis 3 might be that the function is the specific effect selected for, which is substantive. Thesis 4 could be that functions are only the effects directly targeted by selection, ignoring indirect effects. This might be contentious. Thesis 5: Selection must be natural, excluding artificial contexts. That's probably false since artificial selection is still selection.

  Now, addressing the user's synthetic biology examples. The selection marker that degrades a contaminant: under Thesis 2, if the contaminant degradation wasn't selected for, it's not a function, even if it's now essential. But Thesis 3 might allow multiple functions if multiple effects were selected. The directed-evolution protein's side activity: if it emerged during selection but wasn't the target, is it a function? Theses 2 and 3 would say no unless it was selected for.

  Malfunction: etiological theories typically say malfunction occurs when a trait fails to perform its selected effect. Byproducts like the heart's sound aren't functions. Artificial selection: The user's grad student acting as selector should count if we accept artificial selection as valid. But Thesis 5 would exclude it, which seems inconsistent.

  The seminar leader dismissed cases using the slogan. For the drift-recruited trait, Thesis 2 or 3 would deny it has a function initially. For the synthetic examples, Thesis 2 might accept the marker's original function but not the contaminant degradation unless it was selected. The side activity in directed evolution would need to have been explicitly selected for to be a function.

  Even on the strongest thesis, questions remain. Can a trait have multiple functions? How to handle traits maintained by different effects over time? Does artificial selection change the framework? The user's examples challenge the rigidity of the slogan, showing that real cases are messier.
answer: |-
  Here's a breakdown of distinct theses embedded in "functions are selected effects," ordered weakest to strongest, with analysis addressing your specific concerns. Each thesis is evaluated as a **Truism** (T), **Substantive Claim** (S), or **Contentious/False** (C/F), followed by commitments, survival of ordinary function talk, and implications for your key questions.

  ---

  ### **Thesis 1: Functions Require a History of Selection**  
  *(Weakest: Minimal etiological commitment)*  
  - **Nature:** T (Truism for etiological theories).  
  - **Commitment:** A trait’s function cannot be defined *solely* by current causal contributions; it must have been shaped by selection at *some* point. Rejects Cummins-style accounts for biological traits.  
  - **Survival of Ordinary Talk:** High. Still allows "function" for naturally selected traits (e.g., "the heart’s function is pumping blood").  
  - **Your Concerns:**  
    - **"Selected Effect" Meaning:** Agnostic about *which* effect(s) were selected or *when* (origin/persistence).  
    - **Multiple Effects:** Compatible with plural functions if multiple effects were selected.  
    - **Indispensable Non-Selected Effect:** If a trait arises by drift and is later co-opted, its "function" only exists *after* selection acts on the new effect.  
    - **Malfunction:** Possible if trait fails to produce the historically selected effect.  
    - **Byproducts:** Excluded (e.g., heart sounds aren’t functions).  
    - **Artificial Selection:** Includes lab selection (e.g., your synthetic biology cases) as valid "selection."  
  - **Supports Dismissals?** Weakly. For your classmate’s drift case: if the trait was *never* selected, no function. For your cases: both traits *were* selected (by grad students), so they have functions.  

  ---

  ### **Thesis 2: Functions Are Effects That Explain the Trait’s Presence**  
  *(Standard "Strong" Etiology)*  
  - **Nature:** S (Substantive, core to Wright/Neander).  
  - **Commitment:** Functions are *only* effects that causally explain why the trait is *currently present* (via past selection).  
  - **Survival of Ordinary Talk:** Moderate. Excludes co-opted traits (e.g., feathers initially for insulation, later for flight) until selection acts on the new effect.  
  - **Your Concerns:**  
    - **"Selected Effect" Meaning:** Focuses on effects that explain *persistence* (not necessarily origin).  
    - **Multiple Effects:** If multiple effects explain presence, multiple functions (e.g., bird feathers: insulation *and* flight if both selected).  
    - **Indispensable Non-Selected Effect:** Degrading contaminants in your strain isn’t a function *unless* selection maintains the gene for that effect.  
    - **Malfunction:** Defined by failure to produce the effect that explains presence.  
    - **Byproducts:** Strictly excluded.  
    - **Artificial Selection:** Unproblematic if artificial selection explains presence (e.g., your selection marker).  
  - **Supports Dismissals?** Yes. Drift-recruited trait: no function until selection maintains it. Your marker: contaminant degradation is a function *only* if it explains the gene’s retention (e.g., if strains without it die). Directed-evolution protein: the side activity is a function *if* it explains the protein’s current presence in the lineage.  

  ---

  ### **Thesis 3: Functions Are the *Specific* Effect(s) Targeted by Selection**  
  *(Refined Etiology)*  
  - **Nature:** S (Substantive; Millikan’s "proper function").  
  - **Commitment:** Functions are *only* the effect(s) that were directly favored by selection (not side effects). Requires identifying the "target" of selection.  
  - **Survival of Ordinary Talk:** Low. Excludes effects that are beneficial but not directly selected (e.g., human chin’s structural role).  
  - **Your Concerns:**  
    - **"Selected Effect" Meaning:** The effect(s) that caused differential survival/reproduction *in the past*.  
    - **Multiple Effects:** Possible, but only if *each* was individually targeted (e.g., bifunctional enzymes under simultaneous selection).  
    - **Indispensable Non-Selected Effect:** Contaminant degradation isn’t a function unless it was the *target* of selection.  
    - **Malfunction:** Failure to produce the *specific* effect targeted by selection.  
    - **Byproducts:** Excluded even more strictly (e.g., neutral mutations fixed by drift).  
    - **Artificial Selection:** Accepts grad students as "selective agents," but only if the effect was *intended* (e.g., your marker’s original purpose).  
  - **Supports Dismissals?** Strongly. Drift-recruited trait: no function. Your marker: contaminant degradation is not a function unless selected *for* that purpose. Directed-evolution protein: side activity is a function *only* if it was the target of selection.  

  ---

  ### **Thesis 4: Functions Are *Only* Directly Selected Effects**  
  *(Exclusionary Etiology)*  
  - **Nature:** C/F (Contentious/False; overly restrictive).  
  - **Commitment:** Rejects *all* indirect effects (e.g., spandrels, exaptations). Only effects that were *directly* causal in selective history count.  
  - **Survival of Ordinary Talk:** Very low. Denies function to co-opted traits (e.g., human brain’s language capacity as exaptation).  
  - **Your Concerns:**  
    - **"Selected Effect" Meaning:** The effect that was the *immediate* target of selection.  
    - **Multiple Effects:** Only if all were direct targets.  
    - **Indispensable Non-Selected Effect:** Never a function.  
    - **Malfunction:** Narrowly defined (e.g., a "malfunctioning" co-opted trait is nonsensical).  
    - **Byproducts:** Always excluded.  
    - **Artificial Selection:** Accepts only the *explicit* goal of the selector.  
  - **Supports Dismissals?** Extremely. All your cases would lack "functions" except the original intended effect.  

  ---

  ### **Thesis 5: Selection Must Be "Natural" (Non-Intentional)**  
  *(Purist Etiology)*  
  - **Nature:** C/F (Contentious/False; ignores artificial selection).  
  - **Commitment:** Only natural selection (differential survival in the wild) counts. Lab selection or design is "derivative."  
  - **Survival of Ordinary Talk:** Low in biology; collapses in synthetic contexts.  
  - **Your Concerns:**  
    - **Artificial Selection:** Excludes your cases entirely. Your marker and protein have no "biological function."  
    - Other implications mirror Theses 2–4 but only apply to natural systems.  
  - **Supports Dismissals?** Paradoxically: your classmate’s case is handled naturally, but *your* cases are invalidated (not "real" biology).  

  ---

  ### **Which Thesis Supports the Dismissals?**  
  - **Classmate’s Drift Case:** Theses 2–5 deny the trait a function *until* selection acts on it.  
  - **Your Synthetic Cases:**  
    - Thesis 1: Both have functions (selection occurred).  
    - Theses 2–3: Contaminant degradation/side activity are functions *only* if they explain presence or were selection targets.  
    - Theses 4–5: Likely deny functions for your effects (too indirect or artificial).  

  ### **Unresolved Questions Even on the Strongest Supported Thesis (Thesis 3):**  
  1. **Your selection marker:** If contaminant degradation was *never* selected for, is it a function? (Thesis 3: No).  
  2. **Directed-evolution protein:** Was the side activity *directly targeted* by selection, or is it a byproduct? (Requires dissecting the selection regime).  
  3. **Multiple functions:** How to individuate selected effects? (e.g., Is "degrading contaminant X" one function or many?).  
  4. **Artificial vs. natural selection:** Does intentionality change the ontology of function? (Thesis 3 says no, but this is debated).  

  ---

  ### **Your Seminar Cheat Sheet**  
  | Thesis (Weakest → Strongest) | Truism/Substantive/Contentious | Handles Artificial Selection? | Resolves Drift Case? | Resolves Your Cases? |  
  |------------------------------|--------------------------------|-------------------------------|-----------------------|----------------------|  
  | 1. Requires selection history | Truism                         | Yes                           | No function           | Has functions        |  
  | 2. Explains current presence  | Substantive                    | Yes                           | No function           | Only if selected now |  
  | 3. Specific target of selection | Substantive                  | Yes                           | No function           | Only if targeted     |  
  | 4. Only direct effects        | Contentious/False              | Yes (but narrow)              | No function           | Unlikely             |  
  | 5. Natural selection only     | Contentious/False              | No                            | No function           | Not applicable       |  

  **Live Questions for Seminar:**  
  - When does a "side effect" become a function? (e.g., after 40 rounds of selection, is it *now* selected for?)  
  - Can a trait have multiple functions if selection acted on multiple effects *at different times*?  
  - Does the selector’s *intent* (grad student vs. nature) change the functional status?  
  - Is "malfunction" possible in artificially selected systems?  

  This should arm you to challenge the slogan’s ambiguity and revive those "closed" discussions.
