  Now, which requirement to ditch? Binary exhaustiveness might be the weakest. If conditionals can be indeterminate, that's more realistic. The Oswald pair and backtracking are foundational. The miracle problem is tough, but maybe a theory can handle it with small miracles or local exceptions without ditching laws entirely. Impossible antecedents are tricky but necessary for fiction that might involve fantastical elements. The user's fiction angle makes context-dependent similarity metrics crucial. Treating it as pretense might sideline it, but integrating it as context could work. 

