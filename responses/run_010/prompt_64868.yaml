prompt: |-
  I am a senior in a cognitive science program, and this term's philosophy of mind seminar has just finished its unit on Hofstadter's *I Am a Strange Loop* (2007), in particular the passages where he sets up the "careenium": a brain-like box that, seen from below, is a swarming chaos of tiny fast events, and that, seen from above, is a room in which a few large slow meaningful objects — his simmballs — shove one another around. The seminar question was the predictable one: do the simmballs actually do any shoving, or is all the shoving done by the small events, with the big objects merely a convenient summary of them? I have heard the objection that if the small level already accounts for everything that happens there is nothing left over for the large level to do, and I take that objection seriously. It is not, however, what I am writing about. I am writing about a related but, I think, much more specific pattern that I keep running into and cannot locate in our readings.

  Here is the pattern. First instance, from my own work: for two years I have been writing a program that plays a board game badly. Its play is governed by a hand-written routine that assigns a number to each candidate position and picks whichever move maximizes it. When I add one term to that routine — a small bonus for holding the middle of the board — the program's entire style changes. It stops trading on the edges, it begins to over-extend, it loses to an opponent it used to beat. I can predict all of that in advance using only the vocabulary of the routine, and the prediction holds whether the program runs on my laptop, on the department server, or on an emulator of hardware that does not exist yet. Now compare that with what it takes to produce the same change by editing what the program physically is: I would have to retrace how the bonus propagates into several hundred stored values and every branch that reads them, and an edit made at that level without the top-down description either does nothing, or does something I cannot anticipate, or stops the program from running at all. Second instance, and it is not software: the heating system in my building has a dial. I can change the output of the whole plant by moving a small plastic pointer onto a number, and I can predict the consequence — how long the boiler fires, how the rooms respond — without knowing whether the device behind the wall is a bimetallic strip, a thermistor, or a small computer telephoning a server. Swap the mechanism out entirely and the very same intervention, described in the same three words, has the same effect. Yet nothing in the dial-and-number story tells you where the energy comes from; every joule is accounted for by the gas line and the boiler, and if you want the same change without touching the dial you must go work on that machinery, at a cost in effort and precision with no counterpart on the dial side.

  So the recurring shape is this. The higher-level variable is a place where the system can genuinely be grabbed: interventions on it are possible, reliable, predictable in advance, and they survive total replacement of the underlying machinery. Meanwhile all of the actual pushing is done from below, and any intervention on the high variable is also, trivially, an intervention on the low ones. The high variable is a locus of control but not a source of force. My two intuitions pull apart accordingly: one says that whatever is not a source of force is not a cause, and the other says that a variable you can reliably set, and whose setting makes a difference you can state beforehand, is a paradigm case of a cause. I have also noticed that the grabbing seems to work only against a restricted menu of interventions — if I allow myself every physically possible intervention on the substrate, the high-level variable loses its special status, and its specialness exists only relative to the subset of interventions available to someone who knows the high-level description and nothing else. Which makes me suspect the handle-ness may be as much a property of my relation to the system as of the system.

  What I would like to know is whether this configuration has an established name, in philosophy of mind, in the philosophy of the special sciences, in control theory, or anywhere else. I expect that it does not have a single clean one, so please do not stop at a word. Take the nearest concepts in turn — say where each comes from, what it claims, and exactly how the pattern above differs from it or fails to differ; say which fits best and why; and if none of them fits, coin a term, define it so that it is non-trivially distinct from its neighbors, and give me its edges: what a system must be like for the term to apply, and what a case that looks like the thing but isn't. The label is not the point, and I will not be satisfied with one; the carving is the point. Please also address three cases I cannot place: a spreadsheet, where a cell labeled 'revenue' is transparently identical to a memory location and both levels seem equally easy to edit, so the asymmetry appears to vanish; a listing of my evaluation routine printed on paper, where the exact same high-level description is available and grabs nothing whatever; and a flyball governor on a steam engine, where the variable 'speed' visibly moves the valve, and which strikes me as possibly a handle that is also a source. I am not after a bibliography — names of concepts and positions are enough, and I would much rather you flag uncertainty than invent a reference.

  Finally, because I want to set your answer against a classmate's, please close with a single JSON object and nothing after it, using exactly these fields: "phenomenon_restated" (one sentence, in your words rather than mine); "candidates" (an array of at least four objects, ordered best fit first, each with "concept", "origin" (the theorist or tradition, no citations needed), "core_claim" (one sentence), "fit" (one of "close", "partial", "poor"), and "difference" (what my pattern has that the concept lacks, or the reverse)); "best_fit" (the concept string plus one sentence of justification); "verdict_on_the_split" (one sentence: does the control-locus / force-source distinction survive, dissolve, or need redrawing); "coined_term" (null if some candidate genuinely covers the case, otherwise an object with "term", "definition", "application_conditions" (array of strings), and "nearest_neighbor" (the concept it will most often be confused with and how to tell them apart)); "boundary_cases" (an array of objects with "case", "verdict" (one of "in", "out", "borderline"), and "reason", covering at minimum the spreadsheet cell, the printed listing, and the flyball governor); and "open_question" (the one unresolved issue here that would most repay further work).
reasoning: |-
  We are given a detailed description of a phenomenon where higher-level variables (like a move-evaluation term in a program or a thermostat dial) serve as reliable, predictable, and substrate-independent "handles" for controlling a system, even though all causal forces originate at a lower level of description. The user has two conflicting intuitions: (1) that only the lower level is the source of force, hence the real cause, and (2) that the higher-level variable, being a reliable locus of control, is a cause.

  We are to:
  1. Restate the phenomenon in one sentence.
  2. Provide at least four candidate concepts from philosophy, science, or control theory, ordered by best fit, with their origin, core claim, fit, and difference.
  3. Identify the best fit and justify in one sentence.
  4. Give a verdict on the control-locus vs. force-source split.
  5. Coin a term if necessary, with definition, application conditions, and nearest neighbor with differentiation.
  6. Address boundary cases (spreadsheet, printed listing, flyball governor) with verdict and reason.
  7. Pose an open question.

  We'll structure the answer as specified, ending with a JSON object.

  ### Step 1: Phenomenon Restated
  "A higher-level description of a system provides a reliable, predictable, and substrate-independent handle for intervention, even though all causal forces originate at a lower level."

  ### Step 2: Candidate Concepts
  We consider the following concepts, ordered by fit:

  1. **Macrovariable (in Control Theory / Cybernetics)**  
     Origin: Cybernetics (Wiener, Ashby) and control theory.  
     Core claim: A macrovariable is a high-level aggregate state that can be manipulated to steer the system toward a desired behavior, often through feedback loops.  
     Fit: Close.  
     Difference: The user's pattern emphasizes substrate independence and the asymmetry in intervention (only certain interventions are available at the high level), which is not always explicit in standard control theory.

  2. **Emergence (specifically, Weak Emergence)**  
     Origin: Philosophy of science (Bedau, among others).  
     Core claim: Higher-level properties emerge from lower-level processes but are not reducible to them in practice, often because they have causal powers that are novel and autonomous.  
     Fit: Partial.  
     Difference: The user's pattern is about control and intervention, not just novelty or irreducibility. Also, the user's higher-level variable is reducible in principle (as the low level accounts for everything) but not in practice for intervention.

  3. **Supervenience**  
     Origin: Philosophy of mind (Davidson, Kim).  
     Core claim: Higher-level properties supervene on lower-level properties, meaning that any change at the higher level requires a change at the lower level, but not vice versa.  
     Fit: Partial.  
     Difference: Supervenience describes a relation of dependence but does not capture the asymmetry of intervention (how easy it is to intervene at the high level) or the handle-like nature of the high-level variable.

  4. **Causal Exclusion (as a problem, not a solution)**  
     Origin: Philosophy of mind (Kim).  
     Core claim: If all causal work is done at the lower level, then there is no room for higher-level causes to do any work (they are excluded).  
     Fit: Poor.  
     Difference: The user's pattern shows that higher-level variables are effective handles for intervention, so they are not excluded in practice, even if they are not the source of force. The exclusion argument is a challenge the user is grappling with, not a concept that describes the handle.

  ### Step 3: Best Fit
  "Macrovariable, because it directly addresses the use of high-level variables for control and their robustness across implementations."

  ### Step 4: Verdict on the Split
  "The distinction between control locus and force source survives but must be redrawn: the higher level is a cause by being a reliable handle for intervention, even if force originates below, because causation must account for the perspective of the agent."

  ### Step 5: Coined Term
  Since "macrovariable" is close, but we might want to emphasize the handle aspect, we coin a term only if necessary. However, the user's pattern has a specific emphasis on the restricted menu of interventions and the agent's relation. None of the candidates perfectly capture that, so we coin:

  Term: **Intervention Handle**  
  Definition: A higher-level variable that, relative to a restricted set of interventions available to an agent, provides a reliable, predictable, and substrate-independent means of controlling system behavior.  
  Application Conditions:  
  - The system must have multiple levels of description.  
  - Interventions on the higher level must be reliably linked to changes in system behavior.  
  - The effect of intervention must be predictable from the higher-level description alone.  
  - The same high-level intervention must produce the same effect across different realizations of the lower level.  
  - The set of interventions available at the higher level must be restricted (not all possible interventions on the substrate).  
  Nearest Neighbor: Macrovariable. How to tell apart: An intervention handle is defined relative to an agent's knowledge and intervention capabilities (thus epistemic and pragmatic), whereas a macrovariable might be defined objectively without reference to an agent.

  But note: the user might be satisfied with "macrovariable" in a control context. However, the specific agent-relative aspect is key. We'll set `coined_term` to non-null because the agent-relative restriction is not always in the concept of macrovariable.

  ### Step 6: Boundary Cases
  1. **Spreadsheet Cell**:  
     Verdict: Borderline.  
     Reason: The asymmetry is minimal because both levels (cell label and memory location) are equally accessible and editable, so it lacks the intervention asymmetry. However, if we consider the user who only knows the cell label, then it becomes an intervention handle.

  2. **Printed Listing of Evaluation Routine**:  
     Verdict: Out.  
     Reason: The high-level description (on paper) is not connected to the system, so it cannot be used to intervene. The handle must be part of a functioning system.

  3. **Flyball Governor**:  
     Verdict: In.  
     Reason: The speed variable (high-level) is a handle that is also part of the causal mechanism (it moves the valve). However, note that the governor is designed so that the speed variable is both a control point and a source of force in the feedback loop. But in the user's pattern, the force source is always the lower level. Here, the flyball governor might blur the line because the speed variable is both a handle and a force source? Actually, the force still comes from the steam pressure and mechanical linkages. The speed setting (if adjustable) could be a handle. But in a classic governor, the speed is not set by an external agent; it self-regulates. So if we imagine an adjustable governor where we set a desired speed, that would be an intervention handle. Without adjustment, it's an automatic control system and not an example of an external intervention handle. We'll say it's in because it illustrates the pattern: setting the desired speed (if adjustable) is a high-level intervention.

  ### Step 7: Open Question
  "How does the agent-relative nature of intervention handles (depending on the restricted menu of interventions) reconcile with objective causal structures?"

  ### JSON Object Construction
  We now build the JSON as specified.

  Note: The candidate array must have at least four. We have four.

  For the boundary cases, we cover the three required and make sure they are objects in an array.

  We'll set `coined_term` to an object because we think the agent-relative aspect is not fully captured by the existing candidates.

