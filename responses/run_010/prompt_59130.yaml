answer: |-
  Here is the ghazal, adhering strictly to your specifications:

  The steam-whistle breathes where the engine is led,
  Though it does no work, still **it gets said**.

  My copy intones as the red sun decays,
  The same words, same awe – **it gets said**.

  No dial points where this decision is made,
  That the hues match the world? **It gets said**.

  The walker's stride presses, his shade merely plays,
  Not a footprint it mars – **it gets said**.

  That the feeling aligns with the sound of the phrase,
  Is a gift without giver – **it gets said**.

  The cause in the dark where the tale is displayed,
  Is not mine, yet the red **it gets said**.

  The name signed 'Alex' in the tale that won't mend,
  Is the cause that I'm not. **It gets said**.

  ---

