  *   **Couplets:** Seven (odd number).
  *   **Syntactic Independence:** Each couplet is a complete thought.
  *   **Radif:** "...it gets said" (consistent, terminal phrase).
  *   **Qafia:** "-ade" rhyme (led, decays, made, plays, phrase, displayed, mend) preceding the radif.
  *   **Meter/Line Length:** Consistent iambic pentameter throughout.
  *   **Opening Couplet:** Contains the radif twice and establishes the rhyme.
  *   **Takhallus:** "Alex" is incorporated naturally into the final couplet.
  *   **Content Elements Included:**
      *   Huxley's Steam Whistle (Couplet 1)
      *   Philosophical Zombie Twin (Couplet 2)
      *   Coincidence of Accurate Reporting (Couplet 3: "hues match the world?", Couplet 5: "feeling aligns")
      *   James's Shadow (Couplet 4)
      *   Epiphenomenalist Paradox: Reports occur regardless of phenomenal experience (Radif: "it gets said").
      *   Final Twist: The name is causal, the self is not (Couplet 7).
  *   **Tone:** Unresolved, stark, emphasizing the paradox without consolation. The radif ("it gets said") functions as the closing door, asserting the automatic nature of the report.
  *   **Presentation:** Pure couplets, no commentary, headings, or labels. Ready to paste.
