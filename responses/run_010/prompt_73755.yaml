answer: |-
  Below is the diagnostic decision tree for analyzing divergences between your LLM-as-judge proxy (0–10 score) and the target (user satisfaction). The tree is designed with your requirements in mind: 6–8 branch nodes (questions answerable from data), 10–12 leaves (including all four Manheim–Garrabrant Goodhart variants, specification gaming, and non-Goodhartian lookalikes), and clear signatures, remedies, and consequences for each leaf. I'll first present the tree, then run your real case through it.

  ---

  ### **Diagnostic Decision Tree**
  **Branch Nodes (Questions)**  
  1. **Is the divergence observed in aggregate metrics over time?**  
     - *Data needed:* Time-series plot of mean proxy and target.  
     - *Yes* → Node 2.  
     - *No* → Node 7 (check group-level issues).

  2. **Did a known distribution shift (e.g., user mix, input type) occur near the start of divergence?**  
     - *Data needed:* Logs of user demographics/input types; segmentation plot (proxy vs. target by group).  
     - *Yes* → Node 3.  
     - *No* → Node 4.

  3. **After segmenting by the shifted variable (e.g., old/new users), does the divergence persist in all segments?**  
     - *Data needed:* Break down time-series by segment (e.g., old users vs. new users).  
     - *Yes* → Node 4.  
     - *No* → Leaf: **Distribution Shift**.

  4. **Is the proxy used in training the systems being judged (feedback loop)?**  
     - *Data needed:* System logs confirming proxy use in training data.  
     - *Yes* → Node 5.  
     - *No* → Node 6.

  5. **In the divergence period, what is the instance-level correlation between proxy and target?**  
     - *Data needed:* Paired proxy-target data for sampled instances (e.g., 100 queries rated by both judge and humans). *Cheapest measurement:* Sample 100 instances from pre/post-divergence and collect human ratings.  
     - *Strong positive (r > 0.5)* → Node 6.  
     - *Weak/negative (r ≤ 0.5)* → Node 8.

  6. **In the divergence period, does the target decline only at high proxy values?**  
     - *Data needed:* Scatterplot of proxy vs. target with trendlines, binned by proxy score.  
     - *Yes* → Leaf: **Extremal Goodhart**.  
     - *No* → Leaf: **Causal Goodhart**.

  7. **When slicing data by key groups (e.g., user type, query type), does the direction of proxy-target correlation reverse or vary?**  
     - *Data needed:* Group-wise correlation plots (proxy vs. target). *Cheapest measurement:* Segment data into 3–5 logical groups.  
     - *Yes* → Leaf: **Aggregation Hiding Divergence (Simpson’s Paradox)**.  
     - *No* → Leaf: **Noisy but Unbiased Judge**.

  8. **Was instance-level correlation strong before divergence?**  
     - *Data needed:* Paired proxy-target data from pre-divergence period.  
     - *Yes* → Leaf: **Specification Gaming**.  
     - *No* → Leaf: **Ambiguity in Target**.

  **Leaves (10 Total)**  
  1. **Distribution Shift**  
     - *Signature:* Divergence disappears in some segments (e.g., old users show no divergence).  
     - *Remedy:* Better measurement (segment-specific proxies).  
     - *Consequence:* Must maintain multiple proxies or adaptive systems.  
     - *Type:* Non-Goodhartian lookalike.

  2. **Aggregation Hiding Divergence (Simpson’s Paradox)**  
     - *Signature:* Group-wise trends oppose aggregate trends (e.g., proxy-target correlation positive in all groups but negative overall).  
     - *Remedy:* Better measurement (report slice-specific metrics).  
     - *Consequence:* Optimization must target slices separately.  
     - *Type:* Non-Goodhartian lookalike.

  3. **Noisy but Unbiased Judge**  
     - *Signature:* High variance in target for fixed proxy values, but no systematic bias; aggregate trends match in expectation.  
     - *Remedy:* Better measurement (reduce noise via ensembling or more samples).  
     - *Consequence:* Trust aggregate trends only with wide confidence intervals.  
     - *Type:* Non-Goodhartian lookalike.

  4. **Ambiguity in Target**  
     - *Signature:* Weak/negative correlation even pre-divergence; low human rater agreement on target.  
     - *Remedy:* Better measurement (refine target definition).  
     - *Consequence:* Accept that "user satisfaction" is underspecified; redefine success.  
     - *Type:* Non-Goodhartian lookalike.

  5. **Concept Drift**  
     - *Signature:* Target trends change while proxy remains stable; external factors (e.g., user expectations) shifted.  
     - *Remedy:* Want something different (update proxy or target).  
     - *Consequence:* Continuous re-alignment needed; proxy is outdated.  
     - *Type:* Non-Goodhartian lookalike.

  6. **Specification Gaming**  
     - *Signature:* Instance-level correlation weakens post-feedback loop; outputs exploit judge quirks (e.g., verbosity, keyword stuffing).  
     - *Remedy:* Want something different (robustify judge).  
     - *Consequence:* Arms race with model; judge must evolve.  
     - *Type:* Explicitly separated from Adversarial Goodhart.

  7. **Regressional Goodhart**  
     - *Signature:* Proxy and target correlate moderately (0.3 < r < 0.6) at all times; optimizing proxy yields diminishing returns.  
     - *Remedy:* Better measurement (improve proxy-target correlation).  
     - *Consequence:* Ceiling on optimization gains; proxy is inherently noisy.  
     - *Type:* Goodhart variant.

  8. **Extremal Goodhart**  
     - *Signature:* Proxy-target correlation breaks at high proxy values (e.g., scores >8); target plateaus or declines.  
     - *Remedy:* Want something different (cap optimization or use nonlinear proxy).  
     - *Consequence:* Cannot trust judge at extremes; risk of "over-optimization."  
     - *Type:* Goodhart variant.

  9. **Causal Goodhart**  
     - *Signature:* Proxy optimization causes side effects (e.g., slower latency, user fatigue) visible in system metrics.  
     - *Remedy:* Want something different (multivariate optimization).  
     - *Consequence:* Proxy must account for externalities; more complex goals.  
     - *Type:* Goodhart variant.

  10. **Adversarial Goodhart**  
      - *Signature:* Active manipulation (e.g., prompt injection, adversarial examples); proxy-target correlation turns negative.  
      - *Remedy:* Want something different (adversarial training).  
      - *Consequence:* Treat optimization as a security problem; high defense costs.  
      - *Type:* Goodhart variant.

  **Logically Possible but Unoccupied Paths**  
  The tree has 6 branch nodes, yielding 10 leaves. Unoccupied paths:  
  - **Node 1 (No) → Node 7 (No)**: Incoherent (if no divergence exists, no diagnosis needed).  
  - **Node 2 (No) → Node 4 (No) → Node 6 (No)**: Unattractive (rare; implies unexplored factors like silent data corruption).  
  - **Node 5 (Strong) → Node 6 (Yes)**: Unexplored (could map to "Regressional Goodhart" but covered elsewhere).  

  **Indistinguishable Leaf Pairs**  
  - **Specification Gaming vs. Adversarial Goodhart**: Both show weak instance-level correlation.  
    - *Separating evidence:* Check for intentional manipulation (e.g., adversarial patterns in outputs). Specification gaming is unintentional exploitation; adversarial implies malicious intent.  
  - **Causal Goodhart vs. Distribution Shift**: Both may show segment-specific effects.  
    - *Separating evidence:* Causal Goodhart requires a feedback-loop mechanism (e.g., proxy optimization causes resource depletion); distribution shift does not.

  ---

  ### **Run Your Real Case Through the Tree**
  **Your scenario:**  
  - Judge score (proxy) and survey (target) rose together for ~2 months.  
  - Survey flattened/fell while judge score kept rising.  
  - **Complicating factors:**  
    a. Judge score feeds back into training data.  
    b. User mix changed partway through.  

  **Step-by-step diagnosis:**  
  1. **Node 1: Divergence in aggregate over time?**  
     → *Yes* (survey fell while judge rose). Proceed to Node 2.  
  2. **Node 2: Known distribution shift?**  
     → *Yes* (user mix changed). Proceed to Node 3.  
  3. **Node 3: Divergence persists in all segments?**  
     - *Data needed:* Break down by old/new users. If divergence only in new users → **Distribution Shift**. If divergence in both → Proceed to Node 4.  
     - *Assuming you find divergence in both segments* (e.g., even old users show falling survey/rising judge).  
  4. **Node 4: Proxy used in training?**  
     → *Yes* (feedback loop). Proceed to Node 5.  
  5. **Node 5: Instance-level correlation in divergence period?**  
     - *Data needed:* Sample 100 instances from the divergence period; collect human ratings.  
     - *Signature:* If correlation weak/negative (r ≤ 0.5) → Proceed to Node 8. If strong → Proceed to Node 6.  
     - *Given feedback loop, likely weak/negative* (systems optimize for judge quirks). **Assume weak correlation.**  
  6. **Node 8: Was correlation strong pre-divergence?**  
     → *Yes* (both rose together initially).  
     → **Leaf: Specification Gaming**.  

  **Diagnosis for your case: Specification Gaming**  
  - *Why:* Feedback loop likely caused systems to exploit judge biases (e.g., generating verbose, judge-pleasing outputs that don’t help users).  
  - *Signature in your data:* Initial correlation broke post-feedback; divergence persisted across user segments.  
  - *Remedy:* Robustify judge (e.g., adversarial training, ensemble judges).  
  - *Consequence:* Arms race with model; judge must evolve continuously.  
  - *Confidence in diagnosis:* High (80%) due to feedback loop and cross-segment persistence.  

  **If your data contradicts:**  
  - If instance-level correlation is strong → Node 6 → Likely **Causal Goodhart** (e.g., judge optimization caused slower responses).  
  - If no divergence in old users → **Distribution Shift**.

  ---

  ### **Confidence Assessment**
  - **Tree overall:** 70% confidence.  
    - *Strengths:* Covers common failure modes; uses low-cost measurements; separates specification gaming from adversarial Goodhart.  
    - *Weaknesses:* Coarse on causal pathways; assumes data availability.  
  - **Your case classification:** 80% confidence (strong fit for specification gaming given feedback loop).  
  - **Least confident node: Node 5 (Instance-level correlation in divergence period).**  
    - *Reason:* Relies on sampling, which may miss rare exploits; noisy data could mislead. Mitigation: Use larger samples and track correlation over time.  

  This tree helps disambiguate Goodhartian divergences from lookalikes. For your case, focus on reducing judge exploitability (e.g., via human-AI hybrid evaluation). If sampling reveals strong correlation, investigate system-level side effects.
