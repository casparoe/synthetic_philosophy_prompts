  Hmm, the user is describing a sophisticated epistemic phenomenon they've observed in academic settings. They want a precise conceptual analysis, not just a label. 

  The core pattern involves three moves: (1) rejecting evidence as insufficient (anecdotes), (2) rejecting improved evidence as flawed (amateur analysis), (3) rejecting professional evidence as derivative. Each rejection uses a legitimate epistemic standard, but the cumulative effect is dismissal. 

  Key features they emphasize: 
  - Asymmetry where marginalized speakers face moving standards while privileged colleagues get additive acceptance 
  - Internalization of failure by the speaker 
  - Institutional good faith that masks systemic bias

  What they've ruled out: 
  - Simple goalpost-moving (standards shift laterally, not escalate) 
  - Standard credibility deficits (persists when evidence is provided) 
  - Kafka trap (disqualification isn't used affirmatively)

  My analysis must distinguish this from: 
  - Genuine progressive rigor (fixed standards) 
  - Bad-faith obstruction (conscious manipulation) 
  - Ordinary evidentiary thresholds 

  The critical test cases would be: 
  - When privileged speakers receive additive acceptance 
  - When marginalized speakers provide perfect evidence that still gets dismissed 

  This feels like institutional gaslighting via epistemic bureaucracy. The mechanism is fractal marginalization - each rejection applies a valid micro-standard while ignoring the macro-pattern. 

  For teaching, I'll need to show: 
  - Why "structural gaslighting" captures the cumulative effect 
  - How "epistemic exhaustion" describes the internalization 
  - Why this isn't just "testimonial injustice" (which focuses on speaker credibility rather than evidence laundering)
answer: |-
  This phenomenon you describe is both precise and pernicious. After dissecting your cases against existing conceptual frameworks, I find no established term that fully captures it. Below is a systematic analysis, a proposed name, boundary conditions, and vulnerabilities in my reasoning.

  ### Why Common Concepts Fail
  1. **Goalpost-Moving**:  
     - *Fits*: Sequential demands for new evidence types.  
     - *Fails*: Goalpost-moving implies escalating standards (e.g., "now you need *more* data"). Here, standards **relocate laterally** (anecdote → analysis → testimony) without escalation. Each standard is independently valid, and the requester can specify what *would* satisfy them—just not at the moment it’s offered.

  2. **Testimonial Injustice/Credibility Deficit** (e.g., Fricker):  
     - *Fits*: Asymmetry tied to social identity.  
     - *Fails*: The deficit applies not to the *speaker’s credibility* but to **the evidence’s register**. When the speaker provides X, the standard shifts to Y; when Y is provided, it shifts to Z. The deficit attaches to the *form* of evidence, not the speaker per se—and persists even when "gaps" are filled.

  3. **Catch-22/Kafka Trap**:  
     - *Fits*: Impossibility of satisfying demands.  
     - *Fails*: Disqualification isn’t framed as *evidence of guilt* (e.g., "your defensiveness proves it"). It’s presented as neutral procedural rigor. The trap is structural, not rhetorical.

  4. **Institutional Gaslighting**:  
     - *Fits*: Victims internalize failure ("I’m bad at evidence").  
     - *Fails*: Gaslighting implies intentional deception. Here, actors likely believe they’re rigorous. The harm is emergent, not designed.

  ### Proposed Name: **Epistemic Exhaustion via Register Relocation**
  - **Definition**: A dynamic where a speaker’s evidence is systematically dismissed by relocating the standard of adequacy to a new evidentiary register (anecdotal → quantitative → testimonial, etc.). Each relocation invokes a locally legitimate epistemic norm, but the cumulative effect negates all evidence through mutually cancelling demands. Asymmetry by social identity is inherent, and the process induces self-doubt via institutionalized good faith.  
  - **Core Mechanism**: **Fractal Marginalization**—marginalization replicated at each scale of interaction (individual, institutional, epistemic).

  ### Boundary Cases (Near Misses)
  1. **Progressive Rigor**:  
     - A hearer demands *more* evidence of the *same type* (e.g., "10 cases aren’t enough; we need 50"). *Not* relocation.  
  2. **Consistent Standards**:  
     - Published criteria (e.g., "only peer-reviewed studies accepted") applied uniformly. Failure is objective, not relocatable.  
  3. **Bad-Faith Obstruction**:  
     - A hearer who admits off-record, "I’ll never accept their evidence." Relocation here is conscious strategy, not emergent.  
  4. **Speaker Incompetence**:  
     - Successive submissions degrade in quality (e.g., a flawed survey following weak anecdotes). Dismissal is merit-based.

  ### Key Features & Vulnerabilities
  | **Feature**                  | **Included?** | **Vulnerability in My Analysis**                                                                 |
  |------------------------------|---------------|------------------------------------------------------------------------------------------------|
  | **1. Laterally shifting standards** | Core          | Could be reframed as *context-appropriate rigor*: e.g., anecdotes *should* trigger requests for data; flawed data *should* trigger independent analysis. Distinguishing "relocation" from "responsive scrutiny" relies on asymmetry. |
  | **2. Identity asymmetry**    | Core          | If shown that privileged speakers *also* face relocation (e.g., white men reporting racism), is it the same? I argue no: the social-epistemic function differs (maintenance vs. disruption of hierarchy). But this risks circularity. |
  | **3. Internalized failure**  | Consequence   | Most contestable: Is this *part* of the phenomenon or an effect? I tie it to institutional gaslighting emerging from structure, but it could be separable (e.g., some victims resist). |

  ### Reverse Direction?
  - **Toward privileged speakers**: Possible (e.g., a man reporting discrimination), but functionally distinct. Relocation would likely *fail* because institutional reflexes accumulate rather than cancel registers for privileged speakers (per your observation). A similar *mechanism* might run, but the purpose (upholding vs. challenging power) differs. Not the same phenomenon.

  ### Where My Analysis Is Weakest
  1. **The Third Feature**: If internalized failure is merely a *common effect* rather than a defining trait, the phenomenon might be narrower: **Register Relocation Asymmetry**. I include it because the self-doubt completes the epistemic harm, but this risks conflation.  
  2. **Good-Faith Actors**: Your claim that individuals "appear to act in good faith" is axiomatic. If shown that actors *knowingly* exploit relocation (even unconsciously), it collapses into bad-faith goalpost-moving.  
  3. **Unified Phenomenon?**: The strongest counterargument: this is just **rigor in contexts of uncertainty**. To refute, I’d need evidence that the *same* evidence offered by different identities is treated asymmetrically *within a single case*—which your examples imply but don’t prove.

  ### Conclusion
  This is not a "deficit" but an **evidentiary laundering process**: standards are vacuously satisfied seriatim to maintain epistemic control. "Epistemic Exhaustion via Register Relocation" captures the mechanism, the asymmetry, and the attrition of the speaker. For your seminar, stress the **fractal** nature: the pattern repeats whether the speaker is an individual (junior colleague) or collective (students), and whether the institution is academic or bureaucratic.  

  To test your views:  
  - Argue that internalized failure is *extrinsic* to the phenomenon.  
  - Demand a case where a privileged speaker suffers identical relocation.  
  - Challenge whether "laterally valid standards" can ever be unfair in sequence.  

  This formulation’s power lies in making the *relocation* visible—which is the first step to dismantling it.
