  Okay, the user is a backend engineer on a policy language working group for a social app with 40 million users. They need help drafting a memo about rewriting community guidelines to avoid evaluative terms. Priya, the policy lead, wants only "rater-checkable descriptors" with high inter-rater agreement, but this approach struggles with compound rules like their current 4.2 about mocking immutable characteristics. 

  The engineer has two main concerns: first, complex rules can't be reduced to atomic descriptors without losing meaning; second, logical operations like conditionals and negation break down when applied to evaluative terms. They also notice raters agree on atomic cases but disagree on compounds - opposite of what Priya's model predicts.

  Hmm... The user needs a practical solution that respects both operational realities (enforcement pipelines, rater consistency) and philosophical coherence. Priya's legal concerns about avoiding admissions of standards are valid but shouldn't force unnatural language. The atomic/compound discrepancy suggests raters need contextual judgment for complex cases.

  I'm considering several approaches: 
  First, strict descriptivism (Priya's position) - clean for atomic rules but fails for compounds. 
  Second, full evaluative language - honest but vague and legally risky. 
  Third, a hybrid model with tiered definitions - core descriptors plus contextual evaluative triggers. 
  Fourth, a "stipulative calibration" approach where raters train on platform-specific norms.

  The hybrid model seems most promising. It keeps atomic descriptors where possible but allows carefully scoped evaluative terms for compounds, with three key safeguards: 1) explicit "when we say X we mean Y" definitions, 2) mandatory rater training vignettes, 3) periodic kappa checks on the evaluative terms themselves. This addresses legal concerns by making standards explicit rather than hidden.

  For rule 4.2, the rewrite would combine concrete descriptors ("private figure", "immutable characteristic list") with a calibrated evaluative component ("mocking tone"). The memo should show this as: IF [private figure] AND [named characteristic from list] AND [mocking tone per definition] THEN escalate.

  The atomic/compound discrepancy makes sense because atomic descriptors are verifiable facts, while compounds require interpreting relationships between elements - exactly where human judgment matters. Priya's insight survives in the atomic layer and the calibration requirement, but we reject the idea that all policy must be descriptor-only.

  Success metrics would include: sustained kappa >0.7 on the mocking clause after training, <15% reversal rate on appeals of these decisions, and no more than 5% of toxic content reports citing "unclear mocking standards". If we see kappa drop below 0.6 or appeal reversals spike, the hybrid approach is failing.

  The real underlying issue might be trying to automate human judgment completely. Some concepts inherently resist reduction to descriptors, and that's okay if we build frameworks for responsible discretion.
answer: |-
  ## Memo: Recommendation on Evaluative Language in Community Guidelines  
  **To:** Policy Language Working Group  
  **From:** Backend Engineer (Enforcement Pipeline Owner)  
  **Subject:** Drafting Convention for Rule 4.2 and Compound Policies  

  ### 1. Recommendation  
  **Adopt a hybrid convention: Use atomic descriptors *where feasible*, but allow calibrated evaluative terms for compound rules when tied to explicit contextual definitions and rater training.** Priya’s descriptor-only approach is optimal for atomic rules (e.g., slurs, private figures), but fails for complex harms like mockery. Attempting to eliminate all evaluative language creates unenforceable loopholes or brittle enumeration. Instead, we should:  
  - Define evaluative terms operationally (e.g., "mocking" = *[specific textual/contextual cues]*),  
  - Require rater training with edge-case vignettes,  
  - Track kappa *for the evaluative term itself* (threshold ≥0.7, not 0.8).  

  ### 2. Rewrite of Rule 4.2 Under Hybrid Convention  
  **Current Rule 4.2:**  
  > Escalate to human review if a post mocks a private figure for a characteristic they had no hand in choosing.  

  **Revised Rule 4.2:**  
  > Escalate to human review if **all** criteria are met:  
  > a) **Descriptor:** Post names or uniquely identifies a *private figure* (per Definition 3.1),  
  > b) **Descriptor:** Post references a *protected characteristic* (listed in Appendix B: e.g., race, disability, nationality),  
  > c) **Calibrated Evaluative Term:** Post uses *mocking tone* toward the figure regarding (b), as defined by **≥2** of:  
  > - Use of belittling stereotypes (e.g., "all [group] are..."),  
  > - Incongruent exaggeration (e.g., "wow, great job walking with *those* legs"),  
  > - Derisive comparisons (e.g., "like a toddler trying to vote"),  
  > - Pattern of diminutives (e.g., "kiddo", "sweetie" in condescending context).  
  > *Rater Note: "Mocking tone" requires training Module 4.2-C. Kappa monitored quarterly.*  

  ### 3. Engagement with Priya’s View & Legal Concerns  
  **Priya’s core insight survives and is strengthened:**  
  - **Atomic descriptors are preferred where possible** (e.g., "private figure", "list S term"). We’ll apply her kappa ≥0.8 standard to these.  
  - **Avoiding "boo words" without definitions** is correct. We replace vague disapproval with operationalized cues (e.g., "derogatory" → "uses term from List S + negative verb").  

  **But her strict exclusion of evaluative terms overlooks:**  
  - **Emergent harm:** Mockery isn’t reducible to word-lists. It’s a *relational pattern* (tone + target + context). Enumerating cases (e.g., "mocks disability, race, gender...") misses novel vectors and overwhelms raters.  
  - **Legal trade-offs:** While a purely descriptive doc can’t be "weaponized," it *increases liability via under-enforcement*. If we omit "mocking" because it’s evaluative, but users report harassment via nuanced ridicule, plaintiffs argue we *lacked a standard altogether*. Our hybrid defines the standard explicitly, making enforcement defensible.  

  **Legal wins:**  
  - Defined evaluative terms are *less ambiguous* than our current "degrading,"  
  - Appendix B (protected characteristics) and tone cues are concrete,  
  - Training + kappa tracking shows good-faith effort.  

  ### 4. Why Atomic and Compound Cases Behave Differently  
  **The Short Answer:** Atomic descriptors describe *facts*; compound rules describe *relationships*. Raters agree on facts but disagree on how facts interact because context matters.  

  **Plain-Language Breakdown:**  
  - **Atomic = "What is there?"** (e.g., "Does this post say 'idiot'?"). Raters converge here because it’s verification (like spotting a red car).  
  - **Compound = "What does this *do*?"** (e.g., "Is calling someone 'idiot' *mocking*?"). This requires:  
    1. **Inference:** Does the word target an immutable trait? (e.g., "idiot" → intelligence → immutable).  
    2. **Context:** Is it sarcastic? Is the target vulnerable?  
    *This is interpretive*—like deciding if a red car is "speeding." Raters diverge at edges (e.g., "genius" used sarcastically).  

  **How Hybrid Conventions Help:**  
  - Evaluative terms **can** go in `if`-clauses if:  
    - They’re explicitly defined (no "trenchcoats"),  
    - Raters are calibrated on *what counts as evidence* (e.g., "sarcasm" = irony markers like "/s" or exaggerated praise),  
    - We accept that kappa will be lower (0.7 vs. 0.8) and monitor it.  
  - Negation works the same way:  
    > "Not mocking" = absence of ≥2 tone cues from Rule 4.2c.  

  ### 5. Signals That This Approach Is Failing (Next 2 Quarters)  
  Watch for:  
  - **Kappa collapse:** Composite kappa for Rule 4.2c falls below **0.6** consistently. This signals raters can’t apply the definition reliably.  
  - **Appeals spike:** >15% of automated Rule 4.2 escalations are reversed on appeal. Indicates the rule is over/under-inclusive.  
  - **Toxic content reports:** >5% of user reports cite "mockery" but weren’t flagged by 4.2. Shows gaps in definition.  
  - **Rater feedback:** >30% of raters call Rule 4.2c "confusing" in monthly surveys.  

  ### Why This Isn’t Just Semantics  
  Priya’s instinct to avoid ambiguity is vital. But language isn’t just labels or boos—it’s a tool to shape behavior. A policy that only covers what’s easily measurable will miss the harms users actually experience. Our job is to build guidelines that are **both enforceable and human-meaningful**. The hybrid model acknowledges that some harms require judgment—and provides the structure to make that judgment consistent.  

  ---  
  **Final Draft Due:** Thursday. Let’s discuss amendments.  
  **Attachments:**  
  - Draft Rule 4.2 with Appendix B (Protected Characteristics)  
  - Mock Rater Training Vignettes for "Mocking Tone"
