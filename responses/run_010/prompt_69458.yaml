     - **Uncertain** → Go to Node 2 (treating uncertainty as openness to avoidability)  

  2. **Had the same men governed through an ordinary harvest (without the 1792-1793 crises), would the Terror have been avoided?**  
     - **Yes** → **Leaf: Emergency response** (Terror as a reaction to compounded crises)  
     - **No** → Go to Node 4  
     - **Uncertain** → Go to Node 4  

  3. **Had the king not fled to Varennes in 1791, would the Revolution have remained constitutional and avoided the Terror?**  
     - **Yes** → **Leaf: Irreducible contingency** (Terror depended on discrete, avoidable events)  
     - **No** → Go to Node 5  
     - **Uncertain** → Go to Node 5  

  4. **Was the concentration of unchecked power in a single assembly (e.g., the Convention) a design fault with predictable dynamics, or a by-product of the emergency?**  
     - **Design fault** → **Leaf: Institutional design failure** (Terror caused by inherent institutional flaws)  
     - **By-product of emergency** → Go to Node 6  
     - **Both** → Go to Node 6 (prioritizing emergency as the trigger)  

  5. **Did ideology (e.g., Jacobinism, Enlightenment principles) operate as a primary cause of the Terror, or as an after-the-fact rationalization?**  
     - **Primary cause** → **Leaf: Ideological causation** (Terror driven by ideas)  
     - **Rationalization** → Go to Node 6  
     - **Both** → Go to Node 6 (emphasizing rationalization when both are possible)  

  6. **If an account deduces the Terror from the principles of 1789, is that account thereby vindicated (showing inherent necessity), or merely unfalsifiable (explanatorily vacuous)?**  
     - **Vindicated** → **Leaf: Structural necessity** (Terror as an inevitable outcome of revolution)  
     - **Unfalsifiable** → **Leaf: Class interest with ideology as mask** (Terror driven by bourgeois interests, masked by ideas)  
     - **Neither** → **Leaf: Factional power struggle** (Terror from intra-elite competition, unrelated to ideals or class)  

  ### Leaves and Their Most Awkward Commitments
  - **Structural necessity**: Must argue the Terror was predetermined and unavoidable, even absent war, flight, or crises—denying the impact of contingencies.  
  - **Emergency response**: Must defend the Terror as the *only viable solution* to external/internal threats, despite less radical alternatives (e.g., negotiated peace) being plausible.  
  - **Ideological causation**: Must show ideas compelled violence intrinsically, even when circumstances (e.g., peace or stability) would logically mitigate extremism.  
  - **Class interest with ideology as mask**: Must prove class interests (e.g., bourgeois consolidation) were the true driver, with ideology as a deliberate smokescreen—risking reductionism.  
  - **Institutional design failure**: Must assert the Terror would have occurred without emergencies, purely from institutional dynamics—ignoring how context shapes outcomes.  
  - **Irreducible contingency**: Must explain the Terror as a low-probability outcome of random events, without appeal to deeper causes—undermining general patterns.  
  - **Factional power struggle** (added leaf): Must attribute the Terror to rivalry among revolutionaries (e.g., Girondins vs. Montagnards), divorcing it from ideology or class—neglecting how ideas enabled factionalism.  

  ### Unoccupied Answer Combinations and Limitations
  The tree produces 12 possible answer combinations, but only 7 map to leaves. The remaining 5 are unoccupied:  
  - **Combination 1** (Node 1: No → Node 3: Yes → Leaf: Contingency): Unoccupied and **unexplored**—no theory claims the king's flight alone caused the Terror while war was irrelevant.  
  - **Combination 2** (Node 1: Yes → Node 2: No → Node 4: Design fault → Leaf: Institutional failure): **Incoherent**—claiming war was necessary *and* institutions were fatally flawed regardless of context contradicts the design-fault premise.  
  - **Combination 3** (Node 1: Yes → Node 2: No → Node 4: By-product → Node 6: Vindicated → Leaf: Structural necessity): **Unattractive**—arguing war was necessary *and* the Terror was structurally inevitable is circular and rarely defended.  
  - **Combination 4** (Node 1: Uncertain → Node 2: No → Node 4: By-product → Node 6: Neither → Leaf: Factional struggle): **Unexplored**—no major theory combines uncertainty on war with a factional cause while rejecting ideology/class.  
  - **Combination 5** (Node 1: No → Node 3: Uncertain → Node 5: Rationalization → Node 6: Neither → Leaf: Factional struggle): **Unattractive**—denying ideology/class after downplaying the king's flight and war lacks explanatory power.  

  #### Indistinguishable Leaf Pairs
  The tree cannot separate:  
  - **Structural necessity vs. Ideological causation** if ideology is seen as the mechanism of inevitability (e.g., answering Node 5: Primary cause *should* lead to Ideological causation, but Node 6: Vindicated overrides this to Structural necessity—blurring the line between ideology as cause vs. consequence of structure).  
  - **Class interest vs. Factional power struggle** if factionalism masks class interests (e.g., both answer Node 5: Rationalization and Node 6: Unfalsifiable/Neither; the tree prioritizes Class interest for Unfalsifiable and Factional for Neither, but real positions often blend them).  

  This tree emphasizes logical consistency over historiographical coverage, isolating causal drivers as requested. It can be used in a reading group to prompt debate on counterfactuals and mechanisms, with "awkward commitments" serving as discussion probes. For further refinement, consider adding a node on social dynamics (e.g., "Did sans-culotte pressure force the Terror?") to better distinguish class/factional leaves.
