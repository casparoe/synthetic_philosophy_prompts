  We are now in character as John Maynard Keynes, circa 1937, after the publication of "The General Theory of Employment, Interest and Money" and the 1937 QJE article. We have not encountered later decision theory developments. We are to address a practical administrative problem in flood defense, focusing on uncertainty and the distinction between probability and weight.

  Key points from the user's situation:
  - They are on a regional flood authority board.
  - The risk annex for a new defense scheme requires a single number: a 1-in-100-year flood probability derived from 63 years of gauge records, with complications (station moved twice, including after a major flood).
  - They added a column for "weight" to capture the quality of the evidence, but this has backfired: colleagues treat weight as confidence and adjust probabilities downward, and there is no rule to compare options with different costs and different weights of evidence.
  - The user's refusal to enter a number is seen as equivalent to a low probability by the finance committee, and thus the decision is effectively made by whoever supplies a number.

  The user poses two questions:
  1. Does the distinction between probability and weight have practical value in a decision context that demands a number? Or is it an "epistemology without practical purchase"?
  2. If it does work, what should be written in the annex? If not a number, why should the committee accept it?

  We must answer in character, using only Keynes's concepts from the Treatise on Probability and the 1937 article. We must not concede the main claim that every probability is numerical and that weight is just a second-order probability.

  **Keynes's position (in character):**
  - Probability is a logical relation between evidence and a hypothesis, not necessarily numerical. It can be non-numerical or incomparable.
  - Weight of argument measures the amount of relevant evidence (the "balance of the evidence"), not the probability. It is independent and can be high even when probability is low (or vice versa). Weight can be increasing with evidence but is not necessarily quantifiable.
  - In the face of uncertainty (as opposed to risk, where probabilities are known), economic decisions (like investment) are driven by animal spirits, convention, and other non-rational factors. We cannot simply maximize expected utility when probabilities are unknown or of low weight.

  **Addressing the first question:**
  The distinction between probability and weight is crucial even in practical decisions because it warns against treating a low-weight probability as if it were well-founded. Collapsing weight into a downward adjustment of probability is a mistake because it confounds two distinct concepts. Weight is about the reliability of the probability assessment, not the probability itself. In a situation with low weight, the probability figure is less trustworthy, but that does not necessarily mean the event is less likely. The practical purchase is that it forces us to recognize the limits of our knowledge and perhaps seek more evidence or adopt a different decision rule.

  **Addressing the second question:**
  What to write in the annex? We cannot supply a single numerical probability if the evidence is insufficient. Instead, we might write a range or an interval to reflect the uncertainty. For example: "Based on the available record, the estimated annual probability of a flood of this magnitude lies between 1 in 80 and 1 in 120 years, but the weight of the evidence is low due to the short and disrupted record." 

  But the user says the template has room for exactly one number. Then we must break the template. The practical answer is that we should not be forced into a false precision. We might write "Not determinable with confidence" or "Subject to high uncertainty" and then in an accompanying note explain the reasons (short record, station moves). 

  Why should the committee accept a non-numerical entry? Because acting on a single number when the weight is low is like building on sand. The committee must recognize that in the face of genuine uncertainty, the decision should be based on other factors: the consequences of being wrong (if the flood happens and defenses fail, the cost is catastrophic), the cost of delay to gather more data, or the possibility of building in stages (a flexible approach). The decision rule should shift from expected value maximization (which is inappropriate here) to a more cautious or robust approach.

  **Stepping out of character at the end:**
  After the reply, we will step out and critique the exchange.

  **In-character reply:**

  ---

  My dear colleague, your predicament illustrates precisely the practical dangers of conflating probability with weight. The figure of one-in-a-hundred years, drawn from a fractured and abbreviated record, possesses what I should call a low weight of argument. It is not that the probability itself must be numerically indeterminate—though it may well be—but that we have insufficient grounds to place substantial reliance upon it. Your colleagues err in treating weight as a measure of confidence and then adjusting the probability downward; this is to mistake the quality of the evidence for the degree of belief. The distinction remains vital: a well-attested probability of one-in-two-hundred years might justify inaction, while a poorly attested one-in-fifty might demand caution, but we cannot simply deflate the latter to one-in-three-hundred and call it prudent. Weight is the balance of the evidence, not a second probability.

  To your first question: the distinction does work. It forces us to confront the fragility of the figure and to consider whether we ought to act on it at all. In your case, the annex must convey that the probability is of low weight, but the decision cannot be evaded. I would have you write: "The estimated probability of a one-in-a-hundred-year flood event is derived from a record of sixty-three years, subject to discontinuities. The weight of evidence is insufficient to warrant reliance on this figure for definitive investment." Then, in place of a single number, state the range of plausible estimates and the reasons for doubt. The committee must accept this because the alternative—a precise number—is a falsehood that misrepresents our knowledge. In matters of flood defence, where the cost of under-preparation may be ruinous, it is reckless to act on thin evidence as if it were solid. The decision must then turn on other considerations: the magnitude of potential losses, the possibility of staging the investment, or the value of waiting for better data.

  ---

  **Stepping out of character for critique:**

  The exchange may have failed most on the second question—what to write in the annex. Keynes's solution (a qualitative statement and a range) is unlikely to satisfy a finance committee that requires a single number for cost-benefit analysis. His argument that the committee *should* accept non-numerical input because of the gravity of error is ethically sound but practically weak in a bureaucratic context. The least convincing part is the lack of a clear decision rule when weight is low. Keynes might have conceded that in such cases, we fall back on convention, animal spirits, or precautionary principles, but he does not provide a formal alternative to expected utility. 

  Weight of argument would have no role if the decision context rigidly demands a scalar input and if all parties agree to treat low weight as low probability (effectively adopting a subjectivist stance). This would collapse the distinction, but Keynes would reject that as a fundamental error. 

  Disputed commitments in Keynes's work include: (1) whether weight is always monotonic in evidence (he assumes it is, but later philosophers question this); (2) the extent of non-comparability—Keynes allowed for non-numerical and incomparable probabilities, but it is unclear how pervasive he thought this was beyond cases of insufficient evidence or indifference.
answer: |-
  **As John Maynard Keynes:**  
  Your dilemma cuts to the heart of why I insist on separating probability from weight. The distinction *does* work practically, even when institutions demand a number, precisely because it exposes the folly of treating an ill-supported figure as decisive. When you withhold a number due to low weight, you are not evading choice but protesting that the evidence cannot sustain a precise probability. That protest forces the committee to confront uncertainty as a substantive feature of reality—not a mere gap in data. If they misinterpret your silence as implying a low probability, they reveal their own confusion between the *likelihood* of an event (probability) and the *reliability* of our judgment (weight). Your annex should make this explicit: declare the probability non-numerical due to inadequate evidence, and state that acting on any single number would be speculative, not rational enterprise.  

  To your second question: I would have you write: "The probability estimate rests on a discontinuous 63-year record further compromised by gauge relocations. Weight of evidence is insufficient to assign a numerical probability. A defence built solely on this figure risks catastrophic misallocation." The committee *should* accept this because flood defence is not roulette. Where weight is low, decisions must shift from probabilistic calculus to strategic principles: consider worst-case losses, adopt flexible designs (e.g., modular defences scalable with future data), or delay irreversible commitments. If they insist on a number, supply a *range* (e.g., 1-in-80 to 1-in-120 years) to emphasise indeterminacy—but stress that this is not a confidence interval, only a crude reflection of the ignorance your record cannot resolve.  

  ---

  **Out of character (critique):**  
  This exchange likely stumbled most on your second question—what to write instead of a number. My in-character reply (prioritising qualitative warnings) is least convincing because bureaucracies demand quantitative inputs, and Keynes offers no formal mechanism to "weigh" options when evidence quality varies. His distinction risks being impractical here unless decision-makers embrace his broader view that low-weight contexts require non-optimising rules (e.g., precautionary principles). I’d concede weight has no role if your committee *can* gather more evidence cost-effectively, making deferral rational—but here, the record is inherently fragmented.  

  Disputed commitments in Keynes: (1) Whether weight always increases monotonically with evidence (he assumes it does, but later critiques question this); (2) The scope of non-comparability—Keynes allows probabilities to be non-numerical *or* incomparable beyond indifference cases, but scholars debate how pervasive he intended this to be.
