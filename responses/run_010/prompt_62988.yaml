answer: |-
  ## The Silent Arithmetic

  The air in Census Audit Room Gamma tasted of recycled polymers and the ozone tang of aging consoles. Elara Vonn’s fingers traced the glowing figures on her screen: *Proposed Cohort 419: Population Increase: +3,000. Projected Mean Welfare: 5.5. Projected Tally: 99,000*. Below, the justification: *Expansion of Hydroponics Bay 7, utilizing marginal nutrient streams previously vented. Life-quality impact minimal but positive, exceeding Floor. Tally increase: +9,000 vs. Current Census 418 (90,000).*

  Ninety-thousand. The number felt heavy. Elara pulled up Census 418: *Population: 15,000. Mean Welfare: 6.0. Tally: 90,000*. Approved thirty years prior. Before that… she navigated back. Census 417: *Population: 12,000. Mean Welfare: 7.5. Tally: 90,000*. Approved sixty years ago. And before *that*, the oldest comparison the Charter’s Continuity Clause allowed: Census 416: *Population: 10,000. Mean Welfare: 8.0. Tally: 80,000*. Approved ninety years ago. Each step, meticulously documented, each cohort proposal approved because it raised the Tally relative only to its immediate predecessor. *No population proposal may be assessed against any census earlier than the one immediately preceding it. Comparisons to the Founding Census are procedurally inadmissible…*

  But Elara knew the Founding figures. Everyone in Audit did, though speaking them aloud in an official capacity was forbidden. *Founding Census: Population: 10,000. Mean Welfare: 8.0. Tally: 80,000*. Identical to 416, ninety years deep. Now, fifteen thousand souls lived where ten thousand once thrived, their average well-being measured at 6.0 instead of 8.0. The Tally, however, sang its approved song: 90,000 > 80,000. Progress, by the ship’s only legal metric.

  Toren Kael leaned against her console, his perpetual energy humming just beneath the surface. "Staring at ghosts, Elara? Clause forbids it." He gestured at her screen showing 419’s proposal. "Ninety-nine thousand. Clear increase. Clean proposal. Sign it."

  Elara didn’t look up. "Clean? Toren, look at the mean. 5.5. Projected. That’s scraping the Floor."

  "Still *above*," Toren countered, his voice firm. "Every life brought in above 1.0 is a net positive. A life worth living. Who is wronged? The people who get to *live*? They wouldn't exist otherwise. Or the existing populace? Their aggregate welfare *increases*. The Tally proves it."

  Elara swivelled to face him. "The Tally proves we’re cramming more people into less space, breathing thinner air, eating nutrient paste stretched thinner, just to push that number higher. It proves we value quantity over quality."

  "What is 'quality'?" Toren challenged, spreading his hands. "Is a life at 5.5 not worth living? You'd deny existence to thousands who could experience joy, love, learning – simply because their *average* score isn't some mythical past ideal? The good isn't concentrated in fewer, 'higher quality' lives, Elara. It's *distributed*. More lives mean more total moments of happiness, more love stories, more discoveries, even if each is individually a little dimmer. The aggregate good *increases*. That's what the Tally measures. That's what matters."

  Elara’s mind flashed back twenty years, a memory as sharp as ozone. Census 418 had just been approved on the promise of expanded algae vats. Then came the blight in Bay 3. Rationing bit deep. Welfare scores plummeted across the lower decks. As a junior clerk, she’d been tasked with the grim provisional census update.

  She’d found it. A stark, awful equation. Admitting a desperate cohort of 500 souls from the overflow shelters, their projected welfare barely scraping 1.1, would add 550 to the Tally. Alternatively, they could admit only 300 souls from the healthier reserve pool, projected at 5.0, adding 1,500. *But 1,500 is less than 550?* No. 500 lives at 1.1 added *550*. 300 lives at 5.0 added *1,500*. The larger, marginal cohort added *less*.

  The horror deepened. Deaths. Lives scoring below the legislated Floor of 1.0, recorded as null entries. *A legislated welfare score below which a life is not entered into the census as a positive quantity; such a life is recorded as a null entry, contributing nothing to the ship's aggregate tally, but also counting as no loss when it ends.* She’d watched the numbers. When a hundred souls suffering terminal blight-sickness, their scores plummeting to 0.8, finally passed, the Tally hadn’t budged. It had remained untouched. A catastrophe removing misery had left the official measure of ship well-being unchanged, or even slightly *improved* by freeing up resources marginally boosting other scores.

  She’d tried to sound the alarm, to propose revising the Floor. "Make it 1.1! Or weight scores near the boundary!" But the Continuity Clause was a wall. Any revision had to be assessed against the *previous* system. Raising the Floor would instantly render thousands currently contributing positively as null entries, crashing the Tally compared to the last census. Unthinkable. Lowering it would add lives previously deemed unworthy, inflating the Tally artificially. The perverse incentive was locked in by the very rule designed to ensure stability.

  "Where is the line, Toren?" Elara asked quietly now, pulling herself back to the present. "The Floor. 1.0. What makes a life at 0.999 null, worthless to the Tally, and 1.001 worthy? What magic happens in that increment?"

  Toren shifted slightly. "It needs to be sharp. Precise. For the census. For the calculations. A line must be drawn somewhere."

  "But *why there*?" Elara pressed. "Defend 1.0 against 0.999. Against 1.001. What principle places the boundary exactly on that integer? Is a life at 0.999 *not* worth living? By what measure? Or is it just administratively convenient?"

  Toren didn’t flinch, but his answer was pragmatic. "Convenience? Perhaps. Necessity, more like. We need a clear, binary metric for the Tally. The Charter sets it at 1.0. Debating the exact decimal would paralyze us. We work with the system we have. And the system says Cohort 419 adds good. Aggregate good. Sign it."

  Later that cycle, Elara found herself cornered by Marius, an elder auditor from the Life Valuation subcommittee. His eyes were rheumy but sharp. "Hypothetical, Vonn. Purely. Founding Census. Ten thousand souls. Mean 8.0. Tally 80,000. Our current Census 418. Fifteen thousand souls. Mean 6.0. Tally 90,000. By your principle – bringing no one into a life not worth living, focusing on identifiable persons – how do you rank them?"

  Elara opened her mouth, then closed it. Her principle… Toren’s aggregate view saw more good: 90,000 > 80,000. But her view? "There… there is no comparison possible," she admitted, the words tasting like ash. "No person who existed then exists now. Bringing someone into life at 6.0 doesn’t wrong *them* if it's worth living. And the founders… they aren't worse off now; they're gone. My principle… it delivers no verdict. It’s silent." The Continuity Clause wasn’t just procedure; it was a philosophical shield, blocking the very comparison that screamed the truth.

  Now, the proposal glowed on her screen. Cohort 419. +3,000 lives. Mean 5.5. Tally 99,000. An increase of 9,000 over 418. Approved under the Clause. Justified by the arithmetic. The Hydroponics Bay expansion was real, utilizing waste streams. The lives projected above the Floor. No identifiable person was being made worse off; thousands would be brought into existence with lives deemed worth living.

  But Elara saw the trajectory. 10,000 @ 8.0 → 12,000 @ 7.5 → 15,000 @ 6.0 → 18,000 @ 5.5. Each step, individually rational under the rules, leading inexorably downward in mean welfare, upward in crowding, downward in the *quality* of existence for everyone. The Tally climbed (80k → 90k → 90k → 99k), a hollow monument built on the narrowing margin above an arbitrary line. She saw the faces from the lower decks, pale in the recycled light, the constant background hum of stress. She saw the perverse incentive waiting for the next crisis: admit the desperate masses scoring 1.1, not the smaller group scoring 5.0, to get the bigger Tally bump. She saw the null entries, lives below the Floor, whose suffering and death left no mark on the official record of the *Canticle*'s well-being.

  Toren was right: No one in this proposal was being wronged. Each new life, statistically, would likely find its moments of joy above the pain. The aggregate good, as measured, increased.

  And she was wrong: Her principle couldn’t condemn it, only mourn the path.

  Signing it meant perpetuating the silent arithmetic, the slow dilution, the rule of the aggregate over the individual flourishing. It meant her complicity in the descent.

  Refusing meant defying the Charter. It meant immediate suspension, loss of her audit privileges, probable reassignment to waste reclamation. It meant Cohort 419 might still be approved by another auditor, perhaps Toren himself. Her refusal would change nothing but her own life.

  Elara’s hand hovered over the biometric pad. The cost was absolute: her career, her purpose on the *Canticle*. The cost of signing was paid by the eighteen thousand souls already aboard, and the three thousand yet to be, in a future where 'worth living' meant clinging just above the void.

  She withdrew her hand. She selected "REFUSE" on the console. A chime sounded, soft and final. The screen updated, displaying the cold logic she rejected, the only metric the ship officially recognized:

  *18,000 × 5.5 = 99,000.*
