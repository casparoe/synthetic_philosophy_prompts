prompt: |-
  Six months ago I sold the small haulage firm I had built up over fifteen years, and for the first time in my adult life a substantial part of my net worth is sitting under my own management with nobody else's hand on it. I have no adviser and no intention of appointing one. Instead I have spent the winter reading about stake sizing and have arrived at a position I should like pressure-tested before I commit much more capital to it. What I want is an audit, not a lecture: tell me which of the commitments below pull against one another, rank those tensions by severity, say for each what would have to give and what the cheapest revision would be, and then tell me which single revision would clean up the most.

  Here is the package as I hold it.

  1. My decisions concern proportional stakes in a process that compounds. What therefore matters is the long-run growth rate of my wealth, not the expected value of any individual outcome; I treat a bet's contribution to that growth rate as the only quantity I need to examine.

  2. The attraction of this criterion is that it requires no taste parameter. The correct fraction is fixed by the odds and by nothing else, and two people facing the same opportunity should stake the same fraction whatever their temperaments. The standard rejoinder — that growth-rate maximisation is merely expected-utility maximisation under a logarithmic utility function, and hence as arbitrary as any other — leaves me unmoved, because on my view the logarithm is not a preference I bring to the problem but a consequence of how the wealth itself evolves.

  3. In practice I stake roughly half of what the calculation recommends, and I hold a year's living expenses in cash that I treat as outside the bankroll altogether. My reason is that I could not endure a sixty per cent drawdown, even knowing that the long-run arithmetic favoured it.

  4. I insure comprehensively — buildings, contents, income protection, key-person cover on the residual business — at premiums I understand to be actuarially unfavourable, and I regard this as plainly rational rather than as a concession to weakness.

  5. I intend to stop at sixty-five, pass most of the pot to my children and live on the remainder. I want the sum standing at that date to be as dependable as possible, and I think of the intervening twenty years as one continuous run rather than as a series of detachable episodes.

  6. On probabilities: I accept that the criterion is only as good as the estimates fed into it, and I accept that mine are systematically overconfident. I do not regard this as an objection to the criterion, and I do not shrink my estimates before using them.

  7. Two verdicts. A friend offered me a one-off wager — even chances of gaining £20,000 or losing £10,000, against a net worth of roughly £400,000. I took it and think I was right to. The same friend later offered me a stake in a venture with a one-in-five chance of returning twentyfold and a four-in-five chance of losing sixty per cent of what I put in, the expected value being strongly positive. I declined, and think I was right to decline.

  8. I apply the same reasoning beyond markets and wagers — to how much capital and working time to commit to a new venture, to whether to extend credit to a customer — and I do not think that is a stretch, since what carries the argument is the multiplicative structure of the situation rather than anything peculiar to gambling.

  I would rather have a committed audit than a hedged survey. State plainly where you think the package breaks, and where you think a tension is only apparent, explain why it dissolves rather than listing it alongside the genuine ones. If your diagnosis turns on facts I have not supplied — the size of the pot relative to my spending, the correlation between my residual business interests and my investments, my health — flag the dependence instead of assuming a convenient value. I am not after references or a reading list, only your own reasoning. And if you think the exercise itself is misconceived, for instance that some of these items are not commitments at all but descriptions of behaviour, or that no meaningful audit is possible without those numbers, say so directly rather than producing something courteous and useless.
reasoning: |-
  Hmm, the user has presented a detailed investment philosophy and wants me to conduct an audit of potential tensions within their approach. They've sold their business and now manage their own wealth, rejecting financial advisors in favor of a Kelly criterion-based strategy. They want me to identify conflicts between their stated commitments, rank them by severity, suggest resolutions, and find the "cheapest" single revision that would resolve the most issues.

  Looking at their eight commitments: they focus on long-term growth rate (Kelly criterion), stake half the recommended amount, maintain a cash buffer, purchase comprehensive insurance, have a 20-year timeline to retirement, acknowledge overconfidence in probability estimates, shared two betting decisions, and apply this logic beyond investments.

  The most significant tension I see is between commitment #1 (pure Kelly criterion) and #3 (staking half-Kelly plus cash buffer). The Kelly criterion mathematically maximizes growth, but halving stakes reduces volatility at the cost of growth. Their cash buffer further contradicts Kelly, which would include all wealth in the "bankroll."

  Another conflict exists with #4 (comprehensive insurance). Paying actuarially unfavorable premiums directly contradicts Kelly logic - it's a negative expected value bet they're deliberately taking for security, while Kelly would avoid such bets.

  Their retirement goal (#5) creates tension too. A 20-year fixed horizon with a need for dependable capital conflicts with Kelly's focus on infinite horizons. Sequence risk becomes critical here - a bad early drawdown could permanently impair their ability to reach their retirement target.

  Regarding probability estimation (#6), acknowledging overconfidence but not adjusting estimates is logically inconsistent. If they know their estimates are inflated, feeding them into Kelly calculations will lead to systematically oversized stakes and excessive risk.

  Their betting examples (#7) reveal inconsistencies with their stated approach. The £20k/£10k bet at even odds aligns with Kelly (edge is clear), but declining the venture capital opportunity seems inconsistent - mathematically it should be attractive to a Kelly bettor, suggesting their half-Kelly rule might be overriding the calculation.

  The insurance conflict is especially severe because it's not just a fractional adjustment but an outright negative-EV position, directly contradicting their core philosophy. The retirement horizon issue is also critical because Kelly's infinite-time assumption doesn't hold for their 20-year plan.

  The cheapest fix would be to formalize the half-Kelly rule into their framework explicitly (#3), acknowledging it as a volatility constraint rather than treating it as an ad hoc adjustment. This would resolve tensions with several other commitments. For the insurance issue, they could reframe it as "wealth protection" outside the betting framework.

  I'll structure my audit to clearly identify these tensions, rank them by severity, explain necessary trade-offs, and recommend that formalizing the fractional Kelly approach would resolve the most issues while staying true to their core philosophy.
answer: |-
  Your approach is intellectually rigorous but contains critical tensions that undermine its coherence. Below is a structural audit ranking conflicts by severity, identifying required concessions, and proposing the most efficient revision. I flag assumptions where your undisclosed specifics could alter conclusions.

  **Core Tensions Ranked by Severity:**

  1.  **#4 (Comprehensive Insurance) vs. #1/#2 (Kelly Logic)**  
      **Severity: Critical**  
      - **Conflict:** Paying actuarially unfair premiums is a *certain* negative-EV transaction. Kelly forbids accepting any bet with negative edge, as it erodes long-term growth. Your justification ("rational rather than concession") directly contradicts the core axiom that only positive-EV bets should exist in the portfolio.  
      - **What Must Give:** Either abandon Kelly's purity (#1) or cancel non-mandatory insurance (#4).  
      - **Cheapest Revision:** Reclassify insurance premiums as *consumption* (purchasing security/peace of mind) rather than part of the investment bankroll. This exempts it from Kelly's EV requirement.  

  2.  **#5 (Fixed 20-Year Horizon / Dependable Sum) vs. #1 (Infinite-Horizon Growth)**  
      **Severity: High**  
      - **Conflict:** Kelly maximizes asymptotic growth over infinite trials. A fixed 20-year horizon with a "dependable" terminal value prioritizes *capital preservation* and *sequence risk* over pure growth. Kelly strategies can suffer severe drawdowns incompatible with "dependability" on finite horizons (see also #3).  
      - **What Must Give:** The growth-maximization goal (#1) or the requirement for dependable terminal capital (#5).  
      - **Cheapest Revision:** Explicitly shorten the effective horizon. Reduce aggregate risk exposure (e.g., lower average Kelly fraction) or incorporate a "glide path" reducing risk as 65 approaches. This modifies #1 for terminal wealth constraints.  

  3.  **#3 (Half-Kelly + Cash Buffer) vs. #1/#2 (Pure Kelly Logic)**  
      **Severity: High (but Addressable)**  
      - **Conflict:** Halving stakes and excluding living expenses from the bankroll violates Kelly's optimal growth math. The "bankroll" for Kelly *must* include all wealth at risk; excluding cash and reducing fractions lowers expected growth and alters the optimal risk profile.  
      - **What Must Give:** The pure math of #1/#2 or the psychological/behavioral pragmatism of #3.  
      - **Cheapest Revision:** Formalize #3 as an integral part of your criterion. You're effectively using a **fractional Kelly** system (f=0.5) with a separate liquidity reserve. This is sound practice and resolves the conflict by redefining your optimization to include personal risk tolerance.  

  4.  **#6 (Unadjusted Overconfidence) vs. #1 (Growth Optimization)**  
      **Severity: Medium-High**  
      - **Conflict:** Systematically overestimating probabilities inflates perceived edge, leading Kelly to recommend oversized stakes. This increases the risk of ruin and *reduces* actual long-term growth compared to using accurate probabilities. It directly sabotages the goal in #1.  
      - **What Must Give:** Your refusal to adjust estimates (#6) or the integrity of the growth optimization process (#1).  
      - **Cheapest Revision:** Systematically deflate your probability estimates *before* inputting them into the Kelly calculation. A simple rule (e.g., reduce estimated win probability by 10-20% relative to your raw assessment) is far cheaper than blowup risk.  

  5.  **#7 (Venture Capital Rejection) vs. #1/#2 (Kelly Logic)**  
      **Severity: Medium**  
      - **Conflict:**  
          - Bet 1 (£20k win / £10k loss @ 50%): Edge = (0.5 * 0.5) + (0.5 * -0.25) = +12.5%. Kelly fraction ≈ Edge / Odds = 0.125 / 1 = **12.5%**. With ~£400k bankroll, £20k stake is **5%** – well below half-Kelly (~6.25%). **Consistent.**  
          - Venture (20x @ 20%, -60% @ 80%): Edge = (0.2 * 19) + (0.8 * -0.6) = 3.8 - 0.48 = **+3.32**. Odds = 19 (for 1). Kelly fraction = Edge / Odds = 3.32 / 19 ≈ **17.5%**. Half-Kelly ≈ **8.75%**.  
      - **Tension:** Declining a +EV bet with an 8.75% half-Kelly stake *seems* inconsistent with #1. However, practical factors could justify it:  
          - **Liquidity/Concentration:** The venture likely requires locking capital for years, violating Kelly's assumption of instant repetition.  
          - **Uncertainty:** Your overconfidence (#6) makes true probability/outcome estimates highly unreliable here vs. the simple bet.  
          - **Correlation (Assumed):** If the venture correlates with your residual business or core investments, effective exposure could exceed half-Kelly.  
      - **Resolution:** If the venture was liquid, repeatable, uncorrelated, and probabilities reliable, declining *would* conflict with #1 given your half-Kelly rule. Your rejection likely reflects these unstated frictions, dissolving the apparent tension.  

  6.  **#8 (Application Beyond Markets) vs. Practical Realities**  
      **Severity: Low (Apparent Tension)**  
      - **Apparent Conflict:** Applying Kelly to business credit/ventures seems stretched due to illiquidity, huge estimation error, and non-repetition.  
      - **Dissolution:** You correctly identify the core requirement: a *multiplicative, repeatable* structure. Credit decisions (if small, repeatable loans) and venture stakes (if small, numerous, and uncorrelated) *can* fit Kelly logic. The tension is practical (estimation difficulty, correlation) not theoretical. Your #6 and #3 mitigate the risk. **No revision needed.**  

  **The Single Most Efficient Revision:**  
  **Formalize #3 (Half-Kelly + Cash Buffer) as your core risk-management framework.**  

  *   **Why it Cleans Up the Most:**  
      *   Resolves the major conflict between pure Kelly (#1) and your behavioral need to limit drawdowns.  
      *   Provides a coherent justification for excluding living expenses (they are not part of the *risk bankroll*).  
      *   Indirectly mitigates conflicts with #5 (finite horizon) and #6 (overconfidence) by structurally lowering risk. A half-Kelly bet with overestimated probabilities is less catastrophic than a full-Kelly bet.  
      *   Explains #7 (venture rejection) if the stake size or illiquidity pushed effective risk beyond your half-Kelly tolerance.  
  *   **Cost:** Minimal. It codifies your existing practice, requiring no change in capital allocation, only in intellectual framing. It replaces the untenable purity of #1/#2 with a robust, personalized system.  

  **Critical Dependencies on Unstated Facts:**  
  1.  **Pot Size vs. Spending:** The viability of #5 (20-year horizon) hinges critically on your withdrawal rate from the "remainder" after passing assets to children. A 3% rate is robust; 5%+ introduces severe failure risk incompatible with "dependable."  
  2.  **Residual Business Correlation:** If your investments are heavily correlated with your remaining business interests, your effective risk exposure is amplified, making #3 (half-Kelly) potentially insufficient for #5's dependability.  
  3.  **Health:** #4 (income protection/key-person) costs and necessity depend significantly on health and dependents. Poor health increases the actuarial unfairness, worsening the conflict with #1.  

  **Conclusion:** Your framework's core break is **insuring at unfair premiums while claiming allegiance to Kelly's growth logic (#4 vs #1)**. The most impactful and cheapest fix is to **explicitly adopt fractional Kelly (half-stakes + cash buffer) as your formal criterion (#3)**, replacing the pure growth maximization goal. This resolves behavioral tensions, finite-horizon concerns, and overconfidence risks pragmatically. Without addressing the insurance contradiction or providing specifics on withdrawal rates/correlation, significant model risk remains.
