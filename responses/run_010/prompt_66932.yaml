  We are translating the three epistemological positions (foundationalism, coherentism, infinitism) into the vocabulary of a build system for a large monorepo.

  Mapping choices:

  1. Belief: A target (or node) in the build graph. Each belief corresponds to a unit of code or data that can be built or checked.

  2. Support relation: Dependency edges. A belief A supports belief B if B depends on A (i.e., A is a dependency of B). The build system uses these dependencies to determine what needs to be rebuilt when a source changes.

  3. Justification (for a target):
     - Foundationalism: A target is justified (i.e., up to date) if it is either a source (with no dependencies) or if all its dependencies are justified and the target itself is built successfully from those dependencies.
     - Coherentism: A target is justified if it is part of a coherent set (a strongly connected component in the graph) where every target in the set depends (directly or indirectly) on every other, and the entire set is consistent (builds successfully as a whole). Note: In a build system, cycles are typically errors, so we must reinterpret.
     - Infinitism: A target is justified if there is an infinite chain of dependencies, each supporting the next, and the build system can always check (lazily) any finite segment of the chain without having to complete the entire infinite chain.

  Now, translating each position:

  1. Foundationalism:
     - There are foundational targets (sources) that have no dependencies and are always considered up to date (or are provided by the user). 
     - Any non-foundational target must have its dependencies fully satisfied (i.e., all dependencies are justified) and then it can be built. The justification of a non-foundational target rests ultimately on the foundational targets.

     Translation: 
     - The build graph must be a DAG (directed acyclic graph) with source nodes (foundational beliefs). 
     - A target is justified (up to date) if:
          - It is a source (and is present in the source tree) OR
          - All of its dependencies are justified and the target has been built (and is present in the build cache) and is consistent with its dependencies (i.e., the build rule was run successfully and the content hash matches).

  2. Coherentism:
     - There are no foundational beliefs. Justification comes from the mutual support of a set of beliefs. In a build system, this would correspond to a strongly connected component (SCC) where every node is reachable from every other. 
     - However, in typical build systems, cycles are errors. We must reinterpret: 
          - The entire SCC is justified if the system can build the entire component as a whole (by some fixed-point iteration) without relying on any external foundation. 
          - The support relation is symmetric: if A and B are in a cycle, then A supports B and B supports A.

     Translation:
     - We allow cycles in the dependency graph. 
     - The build system, when encountering a cycle, does not fail but instead uses a fixed-point iteration: 
          - Start from some initial state (like a "bottom" element, which might be a minimal representation of the targets in the cycle) and iteratively build until the output stabilizes (i.e., until a fixed point is reached).
     - A target in such a cycle is justified if the fixed-point iteration converges and produces a consistent state for every target in the cycle.

     But note: the fixed-point iteration might require a starting point (a bottom element). This might be seen as a foundation, so we must be cautious.

  3. Infinitism:
     - Justification requires an infinite chain of reasons. There is no foundation and no mutual support in a finite cycle, but an infinite regress of dependencies.
     - In a build system, we cannot have an infinite graph in memory. However, we can have a lazily generated build graph that is potentially infinite. 
     - The idea: a target is justified if for any point in the chain we can always check a finite segment (by building or checking) and find it consistent, but we never complete the entire chain.

     Translation:
     - We have a build graph that is generated lazily and may be infinite (e.g., a build target that depends on another target that is generated by a rule which in turn generates more targets, ad infinitum).
     - The build system does not attempt to build the entire chain at once (which is impossible) but can check any finite prefix on demand. 
     - A target is justified if, whenever we try to build it, we can build it by only expanding a finite part of the dependency chain (but the chain is unbounded). However, note that in practice, we might never reach the "end" because there isn't one.

     Example: a target `A0` that depends on `A1`, which depends on `A2`, and so on. We can build `A0` by building `A1` first, but to build `A1` we need `A2`, etc. The build system uses lazy evaluation: it only expands as much as needed for the current build. However, for a given build, we only go to a finite depth. But the infinitist says that the justification of `A0` lies in the entire infinite chain. We never build the entire chain, but we can always build any finite prefix.

     How do we know the entire chain is consistent? We don't. We just have a rule that says: for any n, `An` can be built if `A{n+1}` is built, and we can always build `A{n+1}` by the same rule. The build rule for each `An` is the same (e.g., a function that generates `An` from `A{n+1}`). So the build is always possible for any finite n, but we never build to infinity.

  Now, residue report:

  A. Claims that carry over exactly:

  1. Foundationalism: The idea of source nodes (foundational beliefs) that have no dependencies and are taken as given carries over exactly. The build process that builds targets from their dependencies, starting from the sources, is a direct analogue.

  2. The requirement for acyclic dependencies (in foundationalism) is standard in build systems. Cycles are typically errors, so foundationalism fits naturally.

  B. Claims that carry over only with distortion:

  1. Coherentism: 
     - In a build system, cycles are usually errors. To make coherentism work, we have to reinterpret the build system to allow cycles and handle them by fixed-point iteration. 
     - However, note that fixed-point iteration often requires a starting point (a bottom element). This bottom element might be seen as a foundation, which coherentism rejects. 
     - Also, in philosophy, coherentism does not require a fixed-point iteration from a bottom; rather, the set of beliefs mutually support each other without any starting point. 
     - Therefore, the fixed-point iteration method distorts coherentism by introducing a foundation (the bottom element) and a step-by-step process that might not reflect the simultaneous mutual support.

     Verdict: This distortion might be necessary to make coherentism work in a build system, but it risks smuggling in a foundation.

     - Moreover, in the build system, when we handle cycles by fixed-point iteration, we are effectively building the entire cycle as a unit. This is a distortion because coherentism does not require building the entire set at once but rather each belief is supported by others in the set. However, the fixed-point iteration does build the set in steps, which is not how coherentism is typically described.

  2. Infinitism:
     - The idea of an infinite regress is translated into a lazily generated, potentially infinite build graph. 
     - However, in practice, we only ever build finite segments. The infinitist claim is that the entire infinite chain is what justifies the belief, but we never have the entire chain. 
     - The build system can check any finite part on demand, which is analogous to the infinitist idea that we can always provide a reason for any belief by going one step further. 
     - But note: in the build system, we don't actually have an infinite chain stored. We have a rule that can generate arbitrarily long chains. This is a distortion because the infinitist might imagine an actual infinite chain, but in the build system we have a finite representation (a rule) that stands for the infinite chain.

     Also, the infinitist might require that the chain is actually infinite and that we don't just stop at a foundation or a cycle. The build system with lazy generation captures the idea of unboundedness, but it does not require that the chain is actually infinite. We could stop at a foundation if we had one, but infinitism rejects foundations.

     How do we avoid foundations? We must ensure that every target has a dependency and that the chain never ends. In the build system, we can have a rule that always generates a new dependency. For example:

          def rule(n):
              return a_file(n)  # where a_file(n) is generated by a rule that depends on a_file(n+1)

     But note: the rule itself is a kind of foundation? The rule is fixed and not dependent on anything else. So the infinitism in the build graph is built on the foundation of the rule. This is a distortion.

  C. Claims that have no counterpart:

  1. In philosophy, coherentism does not require a fixed-point iteration with a starting point. The mutual support is supposed to be holistic and simultaneous. The build system's fixed-point iteration is a procedural way to achieve a state that might be seen as coherent, but it is not the same.

  2. The idea in coherentism that a set of beliefs can be justified without any input from outside the set (i.e., without foundations) is hard to achieve in the build system. Even if we have a cycle, the fixed-point iteration requires an initial state (the bottom element) that is not part of the cycle. This initial state might be considered a foundation.

  3. In infinitism, the requirement that the chain is actually infinite (and not just potentially infinite) and that it provides justification without ever terminating or looping has no direct counterpart. Build systems are finite in their representations and executions. The lazy generation of an infinite chain is a way to simulate infinitism, but the chain is never actually completed. However, the infinitist might argue that the justification comes from the structure of the infinite chain, which is captured by the rule. But note: the rule itself is a foundation.

  D. Specific questions:

  1. Cycle that confers support rather than being an error:
     - Yes, if we use fixed-point iteration (like in some build systems that handle cycles, e.g., in spreadsheets or recursive Makefiles). The cycle is not an error if we can compute a fixed point. Then the entire cycle is built together and each node in the cycle is justified by the others.

  2. Infinite chain never completed yet locally checkable:
     - Yes, with lazy build generation. We can have a target that depends on an infinite chain, but we only build as much as needed for the current task. Any finite prefix can be built (checked) on demand.

  E. Does the tooling's handling of cycles rescue coherentism?

     - When the tool finds a cycle and drops an edge: This breaks the cycle and effectively turns the graph into a DAG. This is a form of foundationalism because the node that loses the incoming edge (or the edge that is dropped) becomes a foundation for that part? Not exactly. It might arbitrarily break the cycle and then build the rest as a DAG. This does not rescue coherentism; it destroys the cycle and replaces it with a foundation.

     - When the tool handles cyclic dependencies by fixed-point iteration from a bottom element: This might rescue coherentism, but note that the bottom element is external to the cycle and thus acts as a foundation. Therefore, it smuggles a foundation back in. However, if the bottom element is defined in terms of the nodes in the cycle (like the empty set or a minimal value) and is not a foundation in the epistemic sense (i.e., it doesn't have independent justification), then it might be acceptable. But in the build system, the bottom element is a starting point that we take for granted. So it is a foundation.

  F. Verdict on the trilemma:

     The trilemma (that there are three positions: foundationalism, coherentism, infinitism) survives the translation, but with caveats:

     - Foundationalism maps naturally to the build system with sources and a DAG.
     - Coherentism can be mapped if we allow cycles and use fixed-point iteration, but at the cost of introducing a bottom element that might be a foundation.
     - Infinitism can be mapped to a build system with lazy, potentially infinite dependency chains, but the rule that generates the chain acts as a foundation.

     Therefore, the trilemma is preserved, but the translation reveals that:

     - Coherentism and infinitism, when implemented in a build system, may rely on foundational elements (the bottom for coherentism, the rule for infinitism). This might suggest that the philosophers' disagreement is less substantive because both coherentism and infinitism, in practice, require foundational elements to function in a computational system.

     However, note that in philosophy, coherentism and infinitism are precisely trying to avoid foundations. The translation shows that in the build system, we cannot avoid foundations entirely. This might be a real gap: the build system is a finite, computational system, and it cannot represent an infinite regress without a finite representation (a rule) or a cycle without a fixed-point algorithm that requires an initial state.

     Final verdict: The trilemma survives the translation, but the translation exposes that the non-foundationalist positions (coherentism and infinitism) are harder to implement without foundational elements. This might indicate that foundationalism is the most natural position for a build system and that the other two require extra machinery that might itself be foundational.

     But note: the philosophers might argue that the rule in infinitism or the fixed-point algorithm in coherentism are not foundations because they are part of the system of justification. However, in the build system, they are given and not dependent on anything else. So the gap might be real: the build system cannot escape foundations entirely.

