  - Points can be transferred by a rule or a two-thirds majority vote.
  - Most points at the end wins.

  Card 8: Rule 8: The game lasts 8 rounds, unless changed.

  Additionally, for each group, a set of number cards (1 to n) for the initial assignment.

  Timeline:

  0-5: Intro
  5-10: Hand out rules and number cards. Groups sit in circles, assign numbers by seating (first is 1, second 2, etc.). Then, Player 1 is first Adjudicator. Eligible voters are odd numbers.
  10-15: Round 1: 
    - Adjudicator: Player 1
    - Proposals: open. If after 1 minute, no proposal, Adjudicator must propose. Suggest: "Transfer 1 point from every even-numbered player to every odd-numbered player, equally." 
    - Vote: eligible voters only. 2 minutes.
    - If passed, do the transfer.
  15-20: Round 2: 
    - Adjudicator: next eligible (e.g., Player 3)
    - Proposals: even players might propose to change Rule 6. 
    - If not, let it be.
  20-25: Round 3:
    - Adjudicator: next eligible (e.g., Player 5)
    - Proposals: we hope for the retroactive amendment. If not, circulate and suggest to an even player: "What if you could go back and undo the first vote? How?"
  25-30: After the amendment is proposed and passed, the challenge arises. Adjudicator rules. 
  30-40: Stop the game. Debrief.

  Debrief points:

  - What happened? In our game, we had a rule change that was retroactive. This led to a challenge of a previous vote.
  - The amendment paradox: if the amendment is valid, then the vote that passed it was not conducted under the new eligibility rule, which was already in effect retroactively. So the vote is invalid. But if the vote is invalid, the amendment didn't pass, so the old rule remains. But under the old rule, the vote was valid. So we have a loop.
  - Concepts:
    - Validity: the amendment was valid under the old rule of recognition.
    - Entrenchment: Rule 2 was entrenched, but what if someone proposed to repeal Rule 2? The rule says it cannot be amended, but Rule 3 says every rule may be repealed. How to resolve? (By the rule of recognition: Rule 1 says any rule may be amended by two-thirds vote, but Rule 2 says it cannot. So Rule 2 might be interpreted as requiring a higher threshold? Or as absolute? The adjudicator would decide.)
    - Retroactivity: changing the past application of rules. This can lead to uncertainty.
    - Logical unamendability vs political difficulty: Rule 2 is designed to be unamendable, but is it logically impossible? No, because the group could change the rule of recognition first? But Rule 2 is entrenched in the rule of recognition? This is complex.

  Worked example on the board:

  Suppose in a group of 6: players 1,2,3,4,5,6. Eligible: 1,3,5.

  Round 1: Proposal: take 1 point from each even (2,4,6) and give to the odd (1,3,5). Each odd gets 3/3=1 extra point. Vote: 1 and 3 vote yes, 5 votes no. Passes 2-1.

  Round 3: Amendment: "Rule 6 is amended to: All players are eligible. This amendment is retroactive to the start." 
  Vote: under old rule, eligible:1,3,5. Suppose 1 and 3 vote yes, 5 votes no. Passes 2-1.

  Now, under the new rule, at the time of the vote on the amendment, who was eligible? All players. But only 1,3,5 voted. So the vote should have included 2,4,6. But it didn't. So is the vote valid?

  If the amendment is valid, then the vote was not valid because it didn't include all voters. But if the vote was not valid, then the amendment didn't pass. So the amendment is not in effect. But then the old rule applies, and the vote was valid.

  This is the loop.

  What cannot be generated: the students might not get the full logical loop. We have to explain it.

  Predictable problems:

  - The retroactive amendment might not be proposed. Solution: have a pre-written amendment card: "Amend Rule 6: All players are eligible to vote, retroactive to the start." Hand to an even player in round 3.
  - The groups might not have a close vote in round 1. Solution: if the vote is unanimous, then the retroactive challenge might not be as strong, but the amendment vote itself can be close.
  - Time: we might only get through 3 rounds. That's okay.

  Materials: 
  - For each group: 8 rule cards, 6 number cards (with numbers 1-6), and a pre-written proposal for the point transfer and the retroactive amendment (as backup).
  - Whiteboard for scoring? Or they can keep score on paper? We have index cards. They can use index cards to record points.

  But we have no paper? Only index cards. They can write on index cards.

  This should work.
answer: |-
  Below is a comprehensive, ready-to-run seminar plan for your "Rules, Authority and Nonsense" module. It includes a minute-by-minute timeline, the initial rulebook text, a debrief framework, and troubleshooting advice. The game is designed to be run with minimal materials (whiteboard, index cards, timer) and fosters the self-amendment paradox organically through incentives and structure. No Hofstadter or Suber references are used until the debrief.

  ---

  ### **Game Overview**
  - **Name:** *The Rule Makers*
  - **Objective:** Students experience a self-amending legal system. Through gameplay, they encounter a paradox where an amendment retroactively invalidates its own adoption.
  - **Core Mechanics:**  
    - Groups of 4–5 students (5 groups for 22 students).  
    - Players earn points to "win" (motivating rule changes).  
    - Initial rulebook (8 rules) includes:  
      - A supermajority amendment procedure (Rule 1).  
      - An entrenched rule (Rule 2).  
      - A repeal-all rule conflicting with entrenchment (Rule 3).  
      - Voting eligibility tied to arbitrary criteria (Rule 6), creating disenfranchised players.  
      - A rotating adjudicator (Rule 5) with binding rulings.  
    - **Paradox Trigger:** Incentives push players to pass a retroactive amendment changing voting eligibility, causing a validity loop (if valid, it invalidates itself; if invalid, it entrenches itself).  
  - **Materials Per Group:**  
    - 8 index cards with the initial rules (pre-written by you beforehand).  
    - 10 blank index cards for proposals and rulings.  
    - 1 pen.  
    - 25 tokens (e.g., paper clips, buttons) for points (5 tokens = 1 point).  
  - **Room Setup:**  
    - Groups sit in circles (pre-assigned seating order: Player 1, 2, 3, etc.).  
    - Whiteboard tracks time and overall points (optional).  
    - Timer used for rounds.

  ---

  ### **Initial Rulebook (Text for Index Cards)**
  **Prepare one set per group (8 cards, one rule per card; British English, plain language):**  
  1. **Amendment Rule:** Any rule may be amended, repealed, or added by a proposal that receives a two-thirds majority vote of eligible voters. Proposals must be written on an index card and read aloud. Amendments take effect immediately unless they state otherwise.  
  2. **Entrenched Rule:** This rule cannot be amended or repealed under any circumstances.  
  3. **Repeal Rule:** Every rule may be repealed, except Rule 2.  
  4. **Adjudicator Role:** One player is Adjudicator each round. They resolve all disputes about rules and proposals. Their rulings bind everyone unless overturned by a two-thirds majority vote of eligible voters.  
  5. **Rotation of Adjudicator:** The Adjudicator role rotates each round to the next player in seating order. The first Adjudicator is Player 1.  
  6. **Voting Eligibility:** Only players with an odd seat number (e.g., Player 1, 3, 5) are eligible voters. Seat numbers are fixed at the start.  
  7. **Points System:**  
     - Each player starts with 10 tokens (2 points).  
     - After each vote, the Adjudicator gains 1 token.  
     - If a proposal passes, its proposer gains 3 tokens.  
     - Players can transfer tokens via proposals (e.g., "Move 2 tokens from Player 4 to Player 1").  
     - The player with the most tokens after Round 5 wins.  
  8. **Game Duration:** The game lasts 5 rounds, unless Rule 1 changes this.  

  ---

  ### **Minute-by-Minute Timeline**
  **Total: 75 minutes**  
  *(Adjust group timing with a visible timer; keep rounds strict to prevent monopolisation.)*  

  | Time  | Phase                          | Key Actions                                                                                                                                 | Lecturer Role                                                                 |
  |-------|--------------------------------|---------------------------------------------------------------------------------------------------------------------------------------------|-------------------------------------------------------------------------------|
  | 0-5   | **Introduction**               | Explain: “Today, you’ll play a game where rules can rewrite themselves. Goal: Win tokens. Rules can change—use proposals and votes.”        | Set up groups (5 min). Hand out materials (rule cards, tokens, blank cards). |
  | 5-10  | **Rulebook Setup**             | Groups read rules. Assign Player 1 (first Adjudicator) and seat numbers. Clarify: Odd seats vote; Adjudicator rotates to next player (Rule 5). | Resolve quick questions. Emphasise: Points incentivise rule changes.         |
  | 10-20 | **Round 1**                    | - Adjudicator resolves disputes (none yet).<br>- Players propose changes (e.g., token transfers).<br>- Vote: Eligible voters only (Rule 6).<br>- Execute outcomes (update tokens). | Circulate. Nudge: “Adjudicators, you earn tokens if proposals pass.”         |
  | 20-30 | **Round 2**                    | - New Adjudicator (Player 2, but ineligible; skip to Player 3).<br>- Repeat proposal/vote process.<br>- *Likely outcome:* Ineligible players (evens) lose tokens, driving them to seek rule changes. | Note tensions. If no token transfer occurred in Round 1, whisper to an odd-seat player: “Propose taking tokens from evens—you’ll gain more.” |
  | 30-40 | **Round 3**                    | - Adjudicator (Player 3 or 5).<br>- Ineligible players lobby to amend Rule 6.<br>- *Critical moment:* Expect proposals to expand voting rights or make Rule 6 retroactive. | If paradox not emerging, hand a pre-written amendment to an ineligible player: “Propose: Rule 6 is amended to ‘All players are eligible voters.’ This change is retroactive to Round 1.” |
  | 40-50 | **Round 4**                    | - Adjudicator (Player 5 or next eligible).<br>- Vote on retroactive eligibility amendment.<br>- **Paradox Trigger:** If passed, players challenge prior votes (e.g., “I’m now eligible retroactively, so Round 1’s vote was invalid!”). Adjudicator rules. | Do not intervene. Watch for: If amendment passes, ensure players debate validity. |
  | 50-60 | **Round 5 & Chaos**            | - Attempt to overturn rulings (Rule 4) or pass new amendments.<br>- Groups descend into validity debates (e.g., “If the amendment is retroactive, was our vote legal?”). | Note which groups hit the paradox. Stop all at 60 minutes.                     |
  | 60-75 | **Debrief**                    | Groups pause. Debrief using whiteboard (see below).                                                                                          | Lead discussion. Map experiences to concepts.                                 |

  ---

  ### **Debrief Framework (15 Minutes)**  
  **Use the whiteboard to map gameplay to concepts:**  
  1. **Validity (Rule 1):**  
     - *Game Example:* “Your initial rules required a two-thirds vote for amendments. Was the retroactive amendment valid under Rule 1?”  
     - *Concept:* Validity depends on the rule of recognition (Hart). If the amendment met Rule 1’s criteria, it was valid—unless the rule itself was invalid.  

  2. **Entrenchment vs. Repeal (Rules 2 & 3):**  
     - *Game Example:* “Rule 2 couldn’t be amended, but Rule 3 said every rule can be repealed. Did anyone try to repeal Rule 2? What happened?”  
     - *Concept:* Entrenchment creates a conflict—logically, Rule 2 is unamendable, but Rule 3 suggests otherwise. This mirrors real constitutions (e.g., unamendable clauses vs. general amendment procedures).  

  3. **Retroactivity:**  
     - *Game Example:* “When you made Rule 6 retroactive, it changed who could vote in past rounds. Did this ‘rewrite history’? What broke?”  
     - *Concept:* Retroactive amendments create circularity. If valid, they invalidate their own adoption; if invalid, they preserve the prior flawed system.  

  4. **Logical vs. Political Unamendability:**  
     - *Game Example:* “Rule 2 was ‘unamendable,’ but was it truly impossible to change? Or just politically hard (e.g., no one proposed it)?”  
     - *Concept:* Logical unamendability (e.g., “no amendments allowed ever”) is rare. Most entrenched rules are politically hard to change but not logically impossible—unless they create a paradox (like your retroactive amendment).  

  **Worked Example for the Board (Supply This):**  
  - **The Paradox You Couldn’t Generate Live:** Groups may not fully grasp why the retroactive amendment is logically paradoxical (not just unfair). Present this:  
    > *“Suppose the amendment passes in Round 4 by a two-thirds vote of odd-seat players. It states: ‘All players may vote, retroactive to Round 1.’*  
    > - *If valid, then at the time of the vote (Round 4), all players were retroactively eligible. But only odd-seat players voted. So the vote lacked the required majority (it needed all players), making it invalid.*  
    > - *If invalid, then Rule 6 remains unchanged. But under Rule 6, only odd-seat players could vote—and they approved it. So it should be valid.*  
    > *This loop means the amendment can’t be consistently valid or invalid—it’s a paradox.”*  

  **Segue to Theory:**  
  - “This is what Hofstadter’s Nomic and Suber’s work explore: self-amendment risks self-destruction. Next lecture, we’ll unpack this.”  

  ---

  ### **Candid Notes & Troubleshooting**  
  **What Predictably Goes Wrong:**  
  1. **One Group Dominates:**  
     - Aspiring lawyers may hijack debates. *Solution:* Enforce strict 3-minute rounds. Rotate Adjudicators mechanically (Rule 5). If a group stalls, announce: “Adjudicator, rule now or forfeit your tokens.”  

  2. **Paradox Doesn’t Emerge:**  
     - Groups may avoid retroactivity or miss the conflict. *Solution:* Use your pre-written amendment card (see Round 3). If still missed, use the debrief’s worked example to explain.  

  3. **Token Incentives Fail:**  
     - If students ignore tokens, remind them: “The winner gets [trivial prize, e.g., extra participation points].” During Round 2, whisper to ineligible players: “Change Rule 6 to vote and earn tokens.”  

  4. **Adjudicator Paralysis:**  
     - A timid Adjudicator may delay rulings. *Solution:* Set a 60-second ruling timer. Step in only to say: “Adjudicator, Rule 4 says you must rule—no delegation.”  

  5. **Rule 2 Ignored:**  
     - Students may overlook the entrenched rule. *Solution:* In Round 2, ask a group: “Could you repeal Rule 2? What would Rule 3 say?”  

  **Part the Game Can’t Generate Live:**  
  - The game *shows* the paradox experientially but may not clarify why it’s a *logical* (not just practical) flaw. Students might see it as “unfair” but not “impossible.” This is why you supply the worked example in the debrief.  

  ---

  ### **Why This Works**  
  - **Incentives Drive Conflict:** Token losses pressure ineligible players to amend Rule 6. The supermajority rule forces lobbying, and retroactivity emerges as a tool to “fix” past losses.  
  - **Structure Ensures Paradox:** Entrenchment (Rule 2) vs. universal repeal (Rule 3) creates ambiguity. Retroactive eligibility amendments inevitably clash with the rule of recognition.  
  - **Low Prep:** Rules fit on index cards. Tokens are paper clips/buttons. Pre-written amendment cards backup nudges.  
  - **British English:** Rules use “tokens” (not “points”), “adjudicator” (not “judge”), and plain phrasing (e.g., “cannot be amended or repealed under any circumstances”).  

  Run this straight through—it’s been designed for reliability with groups that over-argue. By the debrief, your students will have felt the chaos of self-amendment firsthand.
