prompt: |-
  I teach one eighty-minute seminar in a second-year undergraduate module on judgment and decision making, and my assigned slot is Herbert Simon's satisficing and bounded rationality. The cohort is about forty students from psychology, economics, and computer science; they have all had a first-year statistics course, one lecture on Bayesian decision theory the week before mine, and the week after mine is the heuristics-and-biases material. Several of the computer science students are simultaneously building small search or optimization projects for another module, which is why I care a great deal about the framing. What I want from you is a plan for how to teach the idea, not an exposition of it — I know what satisficing is, and a restatement of the view is the one thing that will waste my hour.

  The three assimilations I expect them to arrive with, and want broken, are these: that satisficing is a bias, i.e. laziness or failure of nerve dressed up as a theory; that it is trivially equivalent to maximizing a utility function net of search costs, which is what the modelers in the room will insist; and that the subject is really about personality type, because some of them have picked up the popular maximizer-versus-satisficer framing that circulates from Barry Schwartz's work and will assume the question is which kind of person you should be. Please design the session's explanatory arc with those in view: the order in which the components must be introduced — aspiration level, the cost of continued search, the fact that the agent cannot represent the full option set in the first place, the adaptivity of aspiration levels in response to what the search turns up, procedural as against substantive rationality, and the point that the environment's structure is part of what makes a simple rule succeed — together with an explicit account of what depends on what and which reorderings would cost something. Where in that sequence does the regress worry belong: if the agent must decide how much search to undertake, that decision is itself a search problem with its own costs, which is precisely what blocks the "it's just optimization with a price on information" reduction?

  I also want you to settle the carrying example and police it. I had been going to build the whole session around the haystack image — searching for a needle and stopping as soon as you find one sharp enough for the job at hand — but tell me whether that, or apartment hunting, or something drawn from the students' own optimization projects is the stronger carrier, and specify exactly what the example must exhibit and what it must conspicuously lack, since a badly chosen example will quietly reintroduce the conflation I am trying to prevent. Then map the misconceptions in the order the students will actually raise them, and for each say the point in the sequence where it must be headed off rather than answered at the end; I expect some version of "satisficing is just lazy maximizing," "you can always restate it as constrained optimization," "bounded rationality is what the heuristics people study," and "aspiration levels are arbitrary, so nothing is being explained." Tell me as well whether the ecological-rationality material — the claim that fast, frugal heuristics can outperform optimization in noisy environments — belongs in my session or would sabotage the following week, and if it belongs in, where. Finish with one question I can put to the room in the last five minutes whose pattern of answers would separate a student who understood satisficing as a claim about the structure of the choice problem from a student who merely learned a respectable word for settling, and with a short list of what I should openly refuse to cover at this level and announce as refused rather than silently omit. One last request: give me the two-minute bridge out of expected utility theory into the topic that does not begin by announcing that Simon rejected it, because if I open with that they will spend the rest of the hour waiting for a punchline that never arrives.
reasoning: |-
  Okay, let me tackle this teaching plan for the seminar on Herbert Simon's satisficing and bounded rationality. The user is an experienced educator with very specific pedagogical concerns—they want to dismantle three key misconceptions while building a rigorous conceptual sequence.

  First, I need to analyze the core challenges. The students come with baggage: (1) seeing satisficing as bias/laziness, (2) reducing it to optimization with search costs, and (3) psychologizing it as personality types. The computer science students' parallel projects add urgency to framing it as structural, not dispositional. 

  The haystack example feels intuitive but risky—it might imply known distributions or fixed aspiration levels. Apartment hunting is stronger: it forces confrontation with opaque environments, adaptive aspirations, and procedural rationality. Crucially, it lacks quantifiable utilities and has unpredictable option flows. 

  For the explanatory arc, I'll start by anchoring in the students' recent Bayesian lecture without rejecting it. The bridge should frame bounded rationality as extending decision theory to realistic constraints, not contradicting it. Then the sequence must build interdependence: aspiration levels before search costs, environmental structure before adaptivity, and procedural rationality as the capstone. The regress argument belongs precisely when someone claims "it's just optimization"—showing the infinite recursion traps that reduction. 

  Misconceptions will surface predictably. "Satisficing is lazy" will emerge early during the apartment example—defuse immediately by contrasting with optimization's impossibility. "Restatable as constrained optimization" comes from econ/CS students later; demolish with the meta-search regress. The personality question is a persistent undercurrent; postpone until after defining procedural rationality, then reframe as strategy selection. 

  Ecological rationality is tempting but dangerous here—it belongs to next week's heuristics. Instead, hint that satisficing enables those heuristics, but don't show performance comparisons yet. 

  The closing diagnostic question must force distinction between structural understanding ("aspiration adaptation responds to environmental feedback") vs dispositional ("I'm a satisficer personality"). And I'll explicitly exclude evolutionary arguments, cognitive mechanisms, and Schwartz's typology—naming these avoids silent omissions that breed confusion. 

  Final polish: the two-minute bridge from Bayesian theory should position Simon as addressing its unrealized premises ("What if the option space is unmappable?"), not attacking it. This prevents defensive reactions.
answer: |-
  Here is a meticulously structured 80-minute seminar plan designed to dismantle misconceptions and build Simon’s core ideas in an interdependent sequence. The arc prioritizes conceptual dependencies and preempts assimilation errors at critical junctures.

  **Carrier Example: Apartment Hunting**  
  *Why it works:*  
  - **Exhibits:** Sequential search, unknown option distribution, adaptive aspirations (e.g., "I’ll take the first rent ≤$1,500 near campus" → adjusts to $1,600 after poor results), time pressure.  
  - **Lacks conspicuously:** Quantifiable "search costs" (effort is qualitative/time-based), stable utility function (trade-offs between rent/commute/safety shift dynamically), or personality labels.  
  *Avoid haystacks:* Implies a known distribution of needles and fixed aspiration ("sharp enough"), smuggling in optimization assumptions.  

  ---

  ### **Explanatory Arc & Timing**  
  **Bridge from Expected Utility (2 min):**  
  > "Last week, you saw Bayesian decision theory elegantly solve *well-defined* problems: known options, calculable probabilities, stable utilities. But what if the option space is too vast to list, probabilities unknowable, or utilities unstable? Simon asks: *How do agents make ‘good enough’ decisions when optimization is computationally impossible?* That’s bounded rationality."  
  *→ Avoids framing as rejection; positions it as addressing unseen constraints.*

  #### **Sequence (Interdependent Order)**  
  1. **The Agent’s Representational Limit (12 min)**  
     - Apartment hunt: *"You can’t survey all listings. How do you even start?"*  
     - **Key point:** The option set is never fully known/representable → precludes optimization *ab initio*.  
     - **Preempts:** "Satisficing is lazy maximizing" (maximizing is impossible here).  

  2. **Aspiration Levels as Dynamic Anchors (15 min)**  
     - Show aspiration = starting point (e.g., $1,500 rent), *not* a fixed "satisficing threshold."  
     - Demo adaptation: After 10 overpriced listings, aspiration rises → satisficing adjusts to environment.  
     - **Preempts:** "Aspiration levels are arbitrary" (they’re empirically shaped by experience).  

  3. **The Regress Problem: Why "Cost of Search" Fails (15 min)**  
     - Econ/CS students ask: *"Can’t we add search costs to utility?"*  
     - Counter: *"To optimize search cost, you must know the cost of... calculating the cost of search. Infinite regress!"*  
     - **Simon’s insight:** Decisions *must* be made with incomplete computation ("procedural rationality").  
     - **Preempts:** "Satisficing = constrained optimization" at the root.  

  4. **Environmental Structure Enables Simple Rules (15 min)**  
     - Case: *Why "first apartment ≤ aspiration" works:* Rent distributions cluster geographically (structure).  
     - Contrast with unstructured environments (e.g., random online ads) where rule fails.  
     - **Key:** Satisficing succeeds *when environment matches heuristic*.  
     - **Preempts:** "Bounded rationality = heuristics" (heuristics depend on ecology).  

  5. **Procedural vs. Substantive Rationality (10 min)**  
     - Define: Substantive = outcome-optimal (impossible here). Procedural = process-rational (satisficing).  
     - **Shatters personality myth:** *"It’s not about ‘maximizer vs. satisficer’ traits. It’s about selecting adaptive procedures for the environment."*  

  ---

  ### **Sabotage Patrol: Misconception Mapping**  
  | Misconception | When it arises | Preemption Point |  
  |---------------|----------------|------------------|  
  | "Satisficing = laziness" | Intro to aspiration levels | **Sec.1:** Stress *impossibility* of optimization due to unrepresentable options. |  
  | "Just constrained optimization" | After intro of search costs | **Sec.3:** Regress argument *at the moment* they suggest it. |  
  | "About personality types" | Discussion of aspiration adaptation | **Sec.5:** Explicitly reframe procedural rationality as *strategic*, not dispositional. |  
  | "Bounded rationality = heuristics" | Transition to next week’s topic | **Sec.4:** Note environment-heuristic fit ≠ heuristics *as biases*. |  

  ---

  ### **Ecological Rationality: To Include?**  
  **Exclude.** Briefly note that "heuristics succeed in friendly environments" (covered in **Sec.4**) but defer Gigerenzer’s performance comparisons to next week. Introducing ecological rationality here blurs Simon’s *procedural* focus with descriptive success stories.  

  ---

  ### **Closing Diagnostic Question (5 min)**  
  > *"In a stable environment where options degrade predictably (e.g., fruit ripening in a market), will a satisficer with adaptive aspirations tend to find better/worse options than an optimizer who calculates exact search costs? Why?"*  
  - **Correct:** "Better or equal. Predictable structure lets simple rules exploit patterns without costly computation."  
  - **Incorrect:** "Worse, because satisficing settles" (misses environment-structure synergy).  

  ---

  ### **Open Refusals (State Upfront)**  
  > *"Today, we deliberately omit:  
  > 1. Evolutionary arguments (why bounded rationality might be adaptive)  
  > 2. Cognitive mechanisms (how brains implement satisficing)  
  > 3. Barry Schwartz’s ‘maximizer vs. satisficer’ typology (it confounds strategy with personality)"*  

  ### **Why This Sequence Works**  
  - **Dependencies:** Aspirations require a search problem (**Sec.1**); adaptivity requires aspirations (**Sec.2**); regress kills cost-based optimization (**Sec.3**); environmental structure justifies simplicity (**Sec.4**); procedural rationality caps the argument (**Sec.5**).  
  - **Reordering costs:** Starting with environment (**Sec.4**) makes satisficing seem contingent, not necessary. Starting with personality (**Sec.5**) concedes the myth.  

  This arc forces students to see satisficing as an *architectural necessity* in complex environments, not a bias or personality quirk. The apartment hunt’s unresolved tensions (e.g., "What if a better place appears later?") mirror real-world uncertainty—keeping the focus on *structural* constraints.
