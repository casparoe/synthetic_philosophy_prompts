  The literature distinction is crucial here. It's well-established that money-pump arguments target synchronic intransitivity, while Phil's case is clearly diachronic preference change. The debate about whether cyclic preferences are inherently irrational (beyond exploitability) remains genuinely contested, with Broome and others arguing for structural rationality versus Dreier's pragmatic view. The film's value is in dramatizing the experiential cost of instability, which theoretical arguments often miss.

