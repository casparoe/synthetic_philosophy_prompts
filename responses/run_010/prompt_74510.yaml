prompt: |-
  I am the senior reliability engineer at a 120-person manufacturer of safety components whose entire value proposition is a disposition claim: a self-sealing liner for an aircraft hydraulic reservoir, a thermal cutoff inside a battery module, a sacrificial coating on a marine fastener. Our datasheets and qualification reports assert sentences like "the liner closes a 4 mm breach within 200 ms," and our customers — and the notified body that audits us — read those as counterfactuals about what the part would do in service, not as summaries of what it happened to do on our bench. Six months ago we had a field event: parts that had passed our accelerated corrosion program by a wide margin corroded within a year in service. During the post-mortem a friend of mine who teaches metaphysics — I mention her only because she is how I found the relevant material — suggested that some of our plans defeat themselves rather than merely under-sample. Roughly, her diagnosis was that our bath contained a corrosion inhibitor absent from the service environment, so the coupons never manifested a disposition they still had; and that in another program the fixture's own protection circuitry would have removed the stimulus before the part's response could occur, so we were certifying parts that were never given the chance to fail. I have since read as much of the literature on dispositions, finks, and masks as an engineer can stand, and I now think several of our standard plans are confused in a way that has nothing to do with statistics.

  Please write me a review procedure that a test engineer with no philosophy background can run against a draft qualification plan in about half a day and that yields a written verdict on whether the plan licenses the disposition sentence we intend to print. It should be an ordered set of questions, each with a stated sufficient answer: how to pin down the claim itself — the stimulus conditions, the manifestation, and the causal basis in the part that would explain it — to a precision the plan can actually be checked against; whether anything in the fixture, the preconditioning, the instrumentation, or the protection scheme would remove or alter that basis before the manifestation could occur; whether anything would block the manifestation while leaving the basis intact; whether the manifestation could be produced by something other than the basis, including the rig itself; and whether the dispositions the part has inside the fixture are even the dispositions it will have in service. I want the translation made explicit at the point where the standard repair to the naive conditional analysis requires that the basis retain its intrinsic character, undisturbed: tell me what laboratory action — which measurement, which before-and-after comparison, which post-test sectioning or non-destructive inspection — corresponds to that clause, because that seems to be where the theory offers something we are not currently doing. For each step, say what evidence discharges it, what probe the plan must add when the answer is unclear, and which outcomes force the verdict that the plan cannot support the sentence. Mark clearly which steps are matters of judgment that the procedure can only discipline rather than settle, and which decisions are not factual at all and belong to a human being — residual risk acceptance, the cost of a re-test, whether an undetectable failure mode is tolerable.

  Then run the procedure on three of my plans. First, the battery module thermal cutoff: the harness includes a monitoring board that interrupts current within 30 ms of detecting an overtemperature condition, and our test drives current upward while recording whether the cutoff opens; many units never open, and we have been scoring that as a pass on the grounds that the board did its job. Second, the corrosion coupon program: the bath is buffered and refreshed on a fixed schedule, while the service environment is tidal splash with no renewal and long wet-dry cycling. Third, the self-sealing liner: the rig's dump valve establishes the pressure differential that drives sealant into the breach, so the assembly seals in the fixture largely regardless of the liner's formulation, and we qualified two different supplier formulations under that plan with both passing. One of the three — tell me which — should come out with a verdict I will not like: we have shipped against that plan for six years, and if the procedure concludes the datasheet sentence was never licensed, I want it said plainly, together with the minimum re-test that would license it. Finally, state what the procedure cannot do. I suspect two limits and would rather see them written down than papered over: that a passing test can show the absence of a manifestation under those conditions but never the absence of a disposition, and that where we have never characterized the causal basis — several of our coatings are legacy formulations nobody fully understands — a number of the steps have nothing to operate on. No reading list, no citations; assume I cannot look anything up and need the reasoning inside the document. I would rather have the honest failure modes of the procedure than a tidy flowchart that conceals them.
reasoning: |-
  We are designing a review procedure for qualification test plans to ensure they properly license disposition claims (e.g., "the liner closes a 4 mm breach within 200 ms"). The procedure must be executable by a test engineer without a philosophy background in about half a day. It must yield a written verdict on whether the plan supports the intended claim.

  The procedure will consist of an ordered set of questions. Each question must have:
  - A stated sufficient answer (what evidence discharges the question)
  - What probe to add if the answer is unclear
  - Which outcomes force the verdict that the plan cannot support the claim

  We must mark steps that are matters of judgment and those that require human decisions (like risk acceptance).

  Then, we will run the procedure on three example plans and identify which one fails (and what the minimum re-test would be).

  Finally, we state the limits of the procedure.

  Procedure: Review for Disposition Claim Licensing

  1. **Define the Claim Precisely**
     - **Question:** What exactly is the disposition claim? Break it down into:
       - Stimulus conditions (S): The specific conditions that trigger the disposition (e.g., a 4 mm breach, overtemperature, corrosive environment).
       - Manifestation (M): The expected response (e.g., closes within 200 ms, opens the circuit, corrodes at a rate below X).
       - Causal basis (B): The intrinsic property of the part that is responsible for the manifestation (e.g., the liner's sealant, the thermal cutoff's material, the coating's sacrificial properties).
     - **Sufficient Answer:** The test plan must explicitly define S, M, and B in measurable terms. The definitions must match the language in the intended datasheet sentence.
     - **If Unclear:** The plan must be revised to include clear, measurable definitions. If B is unknown (as in legacy coatings), note that the procedure will be limited (see limits).
     - **Forces Failure:** If S, M, or B cannot be defined (especially B) and the claim requires B, then the plan cannot support the claim.

  2. **Check for Masking by the Fixture or Preconditioning**
     - **Question:** Could any aspect of the test fixture, preconditioning, or setup alter or remove the causal basis (B) before the stimulus (S) is applied or during the test?
     - **Sufficient Answer:** The test plan must include evidence (e.g., material compatibility tests, inspections) showing that the causal basis remains intact during preconditioning and until the stimulus is applied. For example, the corrosion bath must not contain inhibitors that alter the coupon's surface properties.
     - **Probe if Unclear:** Add a pre-test inspection (e.g., non-destructive inspection, material analysis) to verify the state of the causal basis after preconditioning and before applying the stimulus. Compare with a baseline (untreated) sample.
     - **Forces Failure:** If the fixture or preconditioning alters B (e.g., by adding a protective layer, or by removing a critical component) and the test proceeds with the altered B, then the plan cannot support the claim.

  3. **Check for Blocking the Manifestation**
     - **Question:** Could the test setup block the manifestation (M) even when the causal basis (B) is present and the stimulus (S) is applied? (e.g., the fixture interrupts the stimulus before M can occur)
     - **Sufficient Answer:** The test plan must show that the stimulus is applied in a way that allows the manifestation to occur. For example, the test duration must be sufficient, and the fixture must not interfere with the response.
     - **Probe if Unclear:** Add instrumentation to monitor the stimulus and the response in real-time to ensure that the stimulus is present until the manifestation occurs (or until a reasonable time has passed). Also, verify that the fixture does not physically obstruct the response.
     - **Forces Failure:** If the test setup prevents M from occurring (e.g., by shutting off the stimulus too early) even when B is present, then the plan cannot support the claim.

  4. **Check for Spurious Manifestations**
     - **Question:** Could the manifestation (M) be produced by something other than the causal basis (B)? (e.g., the test rig itself causes M, or an artifact of the test setup)
     - **Sufficient Answer:** The test plan must include controls to isolate the part's response. For example, use a dummy part without B to verify that M does not occur without B. Or, instrument the rig to rule out rig-induced effects.
     - **Probe if Unclear:** Add a control test with a part that lacks B (e.g., a modified part or a dummy) to see if M occurs. Also, analyze the test setup for potential contributions to M (e.g., by simulating without the part).
     - **Forces Failure:** If M can be produced without B (i.e., the test setup causes M) and the test does not account for this, then the plan cannot support the claim that the part has the disposition.

  5. **Check for Disposition Shift between Test and Service**
     - **Question:** Are the dispositions (the causal basis B and the resulting disposition to manifest M under S) that the part has in the test the same as in service? Consider environmental differences, aging, or other factors that might change B over time or in different conditions.
     - **Sufficient Answer:** The test plan must simulate the service environment (including any aging) and show that B remains the same. This might require accelerated aging tests that are validated to not alter B in a way that service conditions wouldn't. Alternatively, the plan must include a demonstration that the test environment does not alter B relative to service.
     - **Probe if Unclear:** Add a comparison of the causal basis before and after the test (using the same inspection method as in step 2) and also after simulated service aging (if not already included). If the service environment is different (e.g., tidal splash vs. bath), the test must either replicate the service environment or provide evidence that the difference does not affect B.
     - **Forces Failure:** If the test environment or preconditioning causes a change in B that would not occur in service (or if the service environment would cause a change not present in the test), then the plan cannot support the claim.

  **Verdict:**
  - If all steps are satisfied, the plan licenses the claim.
  - If any step forces failure, the plan does not license the claim.
  - For steps that are matters of judgment (e.g., whether an environmental difference is significant), the engineer must document the rationale. These are marked as judgment steps.

  **Marking:**
  - Steps 1, 2, 3, 4, 5: All require factual evidence, but step 5 is particularly prone to judgment (e.g., the adequacy of environmental simulation). Step 1 may also involve judgment if the causal basis is not well-defined.
  - Human decisions (non-factual): Acceptance of residual risk (e.g., if a potential failure mode is undetectable but deemed very unlikely) and cost-benefit of re-testing are outside the procedure. The procedure only flags issues; the decision to proceed despite a flag must be made by a human.

  **Apply to the three plans:**

  1. **Battery Module Thermal Cutoff Plan**
     - **Claim:** The part (thermal cutoff) opens the circuit under overtemperature conditions.
     - **Test:** Drive current upward while monitoring; the monitoring board interrupts current within 30 ms of overtemperature. Units that never open are passed because the board did its job.
     - **Review:**
       - Step 1: 
         - S: Overtemperature condition.
         - M: The thermal cutoff opens the circuit.
         - B: The intrinsic property of the thermal cutoff material (e.g., a fusible link) to melt and break the circuit at a specific temperature.
         - The claim is about the thermal cutoff, but the test is passing units that did not open because the board intervened. This suggests the test is not actually testing the thermal cutoff's disposition because the board is preventing S from reaching the level required for the cutoff to act.
       - Step 2: The monitoring board is part of the fixture? In this test, the board is present and may prevent the stimulus (overtemperature) from reaching the level required to activate the thermal cutoff. Thus, the causal basis (the fusible link) might never be exposed to S because the board interrupts first. This is a mask: the board removes the stimulus before the thermal cutoff can manifest.
         - **Verdict for Step 2:** The plan may mask the thermal cutoff's disposition. The board's intervention alters the stimulus so that the thermal cutoff's causal basis is not tested.
       - Step 3: The board blocks the manifestation by interrupting the current before the thermal cutoff gets hot enough to open. Thus, even if the thermal cutoff is defective, it might never get the chance to fail. The test setup blocks M.
       - **Conclusion for this plan:** The test does not actually test the thermal cutoff's disposition because the board prevents the stimulus from occurring. Therefore, the plan cannot support the claim that the thermal cutoff itself has the disposition to open under overtemperature. The test is actually testing the board, not the thermal cutoff.
       - **Verdict:** The plan does not license the claim. The minimum re-test would be to test the thermal cutoff without the board (or with the board disabled) to see if it opens when subjected to overtemperature.

  2. **Corrosion Coupon Program**
     - **Claim:** The part (coupon) resists corrosion in the service environment (tidal splash) for a certain duration (e.g., corrodes at a rate below X).
     - **Test:** Coupons are placed in a buffered, refreshed bath. They passed the accelerated test by a wide margin but failed in service.
     - **Review:**
       - Step 1: 
         - S: Corrosive environment (tidal splash with wet-dry cycles).
         - M: Corrosion rate below a threshold.
         - B: The sacrificial coating's composition that provides protection.
       - Step 2: The bath is buffered and refreshed, which may introduce a corrosion inhibitor (as in the field event) that is absent in service. This could mask the causal basis (the coating's sacrificial properties) by providing an alternate protection. The bath might alter the surface of the coupon (e.g., by forming a protective layer) that would not form in service. The test plan does not account for this.
       - Step 5: The test environment (bath) is different from service (tidal splash). The wet-dry cycling in service may cause different corrosion mechanisms (e.g., concentration of salts during drying) that are not replicated in the bath. This could change the causal basis (e.g., the coating might behave differently under continuous immersion vs. cycling). The test environment is not representative.
       - **Conclusion:** The test environment masks the true disposition and does not simulate service. The plan does not license the claim. The minimum re-test would be to test in an environment that replicates tidal splash (wet-dry cycles, no inhibitors) and measure the corrosion rate.

  3. **Self-Sealing Liner**
     - **Claim:** The liner closes a 4 mm breach within 200 ms.
     - **Test:** The rig includes a dump valve that establishes the pressure differential. The assembly seals regardless of the liner's formulation (two different formulations passed).
     - **Review:**
       - Step 1:
         - S: A 4 mm breach in the reservoir under operating pressure differential.
         - M: The breach is closed (sealed) within 200 ms.
         - B: The liner's sealant formulation that expands or flows to seal the breach.
       - Step 4: The manifestation (sealing) could be produced by the rig (the dump valve) rather than the liner. If the dump valve is creating a pressure differential that forces sealant from the liner into the breach, then even a liner with poor sealant might seal because of the rig's action. But note: the claim is about the liner. However, the test setup might be contributing to the sealing. Without a control, we don't know.
         - **Probe:** The test plan should include a control test with a liner that lacks the sealant (or has it removed) to see if sealing still occurs. If sealing occurs without the sealant (due to the rig alone), then the test is not isolating the liner's causal basis.
       - Step 3: The rig's dump valve is necessary to create the pressure differential, which is part of S. But if the liner's sealant is required to respond to that pressure, then the rig is providing the stimulus, not the manifestation. However, the claim is that the liner does the sealing. The concern is that the rig might be doing the work if the liner is not properly formulated (but both formulations passed, so maybe both are good? But the test did not challenge the liner because the rig would seal even without the liner? That seems unlikely. More likely, the rig provides the conditions, but the liner must still respond). The issue is that the test might not be sensitive to the liner's formulation because the rig's action is so dominant that even a poor liner would seal. But the two formulations passed, so that might be okay? However, the problem states: "the assembly seals in the fixture largely regardless of the liner's formulation". This suggests that the rig is causing the sealing, not the liner.
       - **Conclusion:** The test may be producing the manifestation (sealing) by the action of the dump valve (which forces sealant in) and not by the liner's intrinsic properties. Therefore, the test does not isolate the liner's causal basis. The plan does not license the claim. The minimum re-test would be to run a test without the dump valve (or without the pressure differential) to see if the liner can seal on its own? But note: the claim is under operating conditions (which include pressure). However, the test rig's pressure might be set so high that it masks a poor liner. Alternatively, the test should vary the pressure to see the minimum required for sealing and compare with the specification. Also, a control test with no sealant (or a known bad liner) would show if the rig alone can cause sealing.

  **Which one comes out with a verdict you will not like?**
  The battery thermal cutoff plan: you have shipped for six years, but the test does not actually test the thermal cutoff because the board intervenes. The verdict is that the plan does not license the claim. This is the one that should come out with a verdict you won't like.

  **Limits of the Procedure:**
  1. **Cannot prove the absence of a disposition:** A test can only show the absence of a manifestation under the tested conditions. It cannot prove that the disposition does not exist (because it might manifest under different conditions). This is a fundamental limit of induction.
  2. **Requires knowledge of the causal basis:** If the causal basis (B) is unknown (as in legacy formulations), then steps that rely on B (especially steps 2, 4, and 5) cannot be fully executed. The procedure may flag that the claim cannot be supported without further characterization of B.

  **Final Procedure Document:**

  [The procedure as a numbered list, followed by the application to the three plans and the limits.]
answer: |-
  ### Disposition Claim Qualification Review Procedure  
  **Purpose**: To determine if a qualification test plan licenses a specific disposition claim (e.g., "closes a 4 mm breach within 200 ms") by ensuring the test:  
  - Accurately probes the part’s intrinsic causal basis under service-like conditions.  
  - Avoids masking, blocking, or spurious manifestations.  
  - Yields a clear "PASS" (plan licenses claim), "FAIL" (plan cannot support claim), or "INCONCLUSIVE" (requires probes/decisions).  

  **Inputs**: Draft test plan, datasheet claim, part design documentation.  
  **Outputs**: Written verdict with rationale, minimum re-test recommendations (if FAIL).  
  **Time Estimate**: 0.5 days (engineer-led, no philosophy expertise required).  
  **Key Principles**:  
  - A disposition is an intrinsic property (e.g., liner’s sealant viscosity) that manifests under specific stimuli (e.g., breach + pressure).  
  - Tests must distinguish the part’s behavior from the test rig’s influence.  
  - Service environment fidelity is non-negotiable for stimuli/manifestations.  

  ---

  ### Ordered Review Questions  
  *For each question:*  
  - **Sufficient Answer**: Evidence that discharges the question.  
  - **Unclear?**: Probe to add to the plan.  
  - **Forces FAIL**: Outcome that means the plan cannot support the claim.  
  - **Judgment?**: Marks steps needing engineer judgment (cannot be fully automated).  
  - **Human Decision?**: Issues requiring non-technical decisions (e.g., risk acceptance).  

  #### **Step 1: Define the Claim with Precision**  
  **Question**: Does the plan explicitly define these in measurable terms?  
  - **Stimulus (S)**: Conditions triggering the disposition (e.g., 4 mm breach, 200°C overtemperature).  
  - **Manifestation (M)**: Expected response (e.g., seal within 200 ms, circuit open).  
  - **Causal Basis (B)**: Part’s intrinsic property causing M (e.g., sealant viscosity, fusible alloy composition).  
  *Rationale: Vague claims cannot be tested.*  
  - **Sufficient Answer**: Plan documents S, M, B with units/tolerances matching the datasheet. B must be described physically (e.g., material property, mechanical design).  
  - **Unclear?**: Revise plan to specify S/M/B using quantifiable parameters. If B is unknown (e.g., legacy coating), add material characterization (e.g., SEM/EDS analysis).  
  - **Forces FAIL**: S, M, or B is undefined or unmeasurable.  
  - **Judgment?**: Low (definitions should be factual).  
  - **Human Decision?**: None.  

  #### **Step 2: Verify Causal Basis (B) is Undisturbed During Test**  
  **Question**: Could preconditioning, fixtures, or instrumentation alter or remove B before/during stimulus?  
  *Rationale: B must remain intact for the test to reflect the part’s true disposition (e.g., corrosion inhibitor masking B).*  
  - **Sufficient Answer**: Plan includes evidence that B is unchanged after preconditioning/before stimulus. Examples:  
    - Material comparisons (e.g., pre-test vs. post-preconditioning microscopy).  
    - Fixture compatibility tests (e.g., no chemical reactions between part and fixture).  
  - **Unclear?**: Add a "B integrity check": Measure B before preconditioning and after (e.g., cross-section, chemical assay, non-destructive inspection).  
  - **Forces FAIL**: Proof that preconditioning/fixture alters B (e.g., fixture adds protective coating).  
  - **Judgment?**: Medium (interpreting if changes to B are significant).  
  - **Human Decision?**: Accepting residual risk if alteration is deemed negligible.  

  #### **Step 3: Confirm Stimulus (S) is Applied Until Manifestation (M) Can Occur**  
  **Question**: Does the test ensure S persists long enough for M to occur, without interference?  
  *Rationale: Fixtures may truncate S (e.g., protection circuits shutting off stimulus prematurely).*  
  - **Sufficient Answer**: Instrumentation logs show S is present until M completes (e.g., temperature maintained until cutoff opens). No fixtures block/override S.  
  - **Unclear?**: Add real-time monitoring of S and M (e.g., high-speed video, sensors) to confirm timing.  
  - **Forces FAIL**: Fixture interrupts/alters S before M can occur (e.g., safety circuit cuts power before thermal cutoff activates).  
  - **Judgment?**: Low (timing data is objective).  
  - **Human Decision?**: None.  

  #### **Step 4: Ensure Manifestation (M) is Not Blocked or Spurious**  
  **Question**:  
  A. **Blocking**: Could the test rig physically prevent M even if B is intact?  
  B. **Spurious**: Could M occur without B (e.g., due to rig behavior)?  
  *Rationale: M must result solely from B under S (e.g., rig pressure forcing sealant, not the liner).*  
  - **Sufficient Answer**:  
    - A: Test shows M occurs when B is present and S is applied (e.g., breach sealed only when sealant is present).  
    - B: Control test with B removed (e.g., inert coupon) shows no M.  
  - **Unclear?**: Add a "negative control" (part without B) and a "positive control" (part with known good B).  
  - **Forces FAIL**:  
    - A: Rig blocks M (e.g., fixture clamps prevent sealant flow).  
    - B: M occurs in negative control (e.g., rig seals breach without sealant).  
  - **Judgment?**: Medium (assessing control test results).  
  - **Human Decision?**: Cost-benefit of adding controls.  

  #### **Step 5: Validate Service-Representative Dispositions**  
  **Question**: Are the part’s dispositions during testing identical to those in service?  
  *Rationale: Test environments (e.g., corrosion baths) may not replicate service (e.g., tidal splash), altering B or its response.*  
  - **Sufficient Answer**: Test environment matches service conditions (e.g., temperature, humidity, contaminants). If accelerated, data validates correlation to service (e.g., Arrhenius model for corrosion).  
  - **Unclear?**: Add side-by-side tests: Accelerated vs. service-like conditions (e.g., bath vs. spray chamber).  
  - **Forces FAIL**: Test environment differs from service in ways that alter B or M (e.g., bath inhibitor absent in service).  
  - **Judgment?**: High (assessing environmental equivalence).  
  - **Human Decision?**: Accepting risk if acceleration factors are uncertain.  

  ---

  ### Verdict Logic  
  - **PASS**: All steps have sufficient answers. Plan licenses the claim.  
  - **INCONCLUSIVE**: One or more steps unclear but probes could resolve. Plan requires revision.  
  - **FAIL**: One or more steps force FAIL. Plan cannot support the claim.  

  ---

  ### Application to Your Cases  
  #### **1. Battery Module Thermal Cutoff**  
  - **Claim**: "Cutoff opens circuit during overtemperature."  
  - **Test**: Drive current; monitoring board interrupts in 30 ms if overtemperature. Units not opening are "PASS" (board worked).  
  - **Review**:  
    - Step 1: S = overtemperature, M = cutoff opens, B = fusible alloy. **Sufficient**.  
    - Step 2: B intact? Likely, but unknown if board affects B. **Unclear → Add B integrity check** (e.g., inspect alloy after test).  
    - Step 3: Board interrupts S (current) within 30 ms → S removed before cutoff can activate. **Forces FAIL** (cutoff never tested).  
    - **Verdict: FAIL**  
  - **Why You Won’t Like It**: Plan has shipped parts for 6 years but never tested the cutoff’s disposition (board masks stimulus).  
  - **Minimum Re-Test**: Disable board; apply S directly to cutoff; verify M (opening) within spec.  

  #### **2. Corrosion Coupon Program**  
  - **Claim**: "Resists corrosion in tidal splash for 5 years."  
  - **Test**: Buffered/refreshed bath; coupons passed accelerated test.  
  - **Review**:  
    - Step 1: S = corrosive environment, M = corrosion rate < threshold, B = coating composition. **Sufficient**.  
    - Step 2: Bath inhibitor masks B → Corrosion suppressed. **Forces FAIL** (B altered).  
    - Step 5: Bath ≠ tidal splash (no wet-dry cycles). **Forces FAIL** (dispositions differ).  
    - **Verdict: FAIL**  
  - **Minimum Re-Test**: Use service-equivalent environment (e.g., ASTM G85 spray test) + validate acceleration factor.  

  #### **3. Self-Sealing Liner**  
  - **Claim**: "Liner closes 4 mm breach within 200 ms."  
  - **Test**: Rig’s dump valve creates pressure; both formulations passed.  
  - **Review**:  
    - Step 1: S = breach + pressure, M = seal within 200 ms, B = sealant viscosity. **Sufficient**.  
    - Step 4:  
      - A: No blocking.  
      - B: Rig’s pressure may cause M without B (sealant irrelevant). **Unclear → Add negative control** (liner without sealant).  
    - **Verdict: INCONCLUSIVE** (Step 4B unclear; control test needed).  
  - **Outcome**: Not FAIL, but probe required. If control seals, verdict becomes FAIL.  

  ---

  ### What the Procedure Cannot Do  
  1. **Prove Disposition Absence**: A test can only show **no manifestation under tested conditions**. It cannot prove the disposition does not exist (e.g., a part may corrode under untested conditions).  
  2. **Handle Unknown Causal Basis**: If B is uncharacterized (e.g., legacy coatings), Steps 2, 4B, and 5 have **no basis for comparison**. The procedure flags this but cannot resolve it without B data.  

  ### Procedure Failure Modes  
  - **False PASS**: If environmental differences are underestimated (Step 5 judgment error).  
  - **False FAIL**: Overly conservative interpretation of "alteration" to B (Step 2).  
  - **Resource Limits**: Probes (e.g., material characterization) may be costly; human must decide if justified.  

  ---  
  **Final Advice**: Integrate this review early in test planning. For FAIL verdicts, prioritize re-tests that isolate B and replicate service stimuli. For legacy parts, invest in B characterization—without it, disposition claims are inherently unverifiable.
