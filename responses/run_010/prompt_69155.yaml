prompt: |-
  So, context: I run the grants program at a small family foundation — about $9M a year, four board meetings, I write the recommendation memos and there are usually 30-40 finalists per cycle. The board is five people, none of them with any philosophy training (one of them took an ethics course in 1994 and brings it up constantly). We score finalists on a weighted rubric, five criteria, points out of 100, and the weights were set at some point in the late 2000s and have never been revisited. I'll admit up front that we sometimes pick the weights that make the answer come out the way we already wanted and then let the rubric take the credit, so I don't have a lot of standing to complain about fake precision — but I do want to stop doing it by accident. What's actually been bugging me is a pattern I've started calling the tiebreaker tell. Somebody on staff will say two finalists are incommensurable, different kinds of good, you can't compare them — and then within ten minutes someone proposes a totally arbitrary tiebreaker (which executive director we like more, whichever one we funded last cycle, one time literally a coin flip) and the room just accepts it. Nobody winces. If the values really couldn't be compared, settling it with a coin flip should feel like a category error, and it never does. My hunch is that most of our incommensurability talk is a label for something else and I can't tell which something else it is. For calibration on where I'm coming from: I've been reading the rationalist blogs since the sequences era, so my reflex is that everything is comparable and this is a modeling failure. But I've also read enough of the other side — Raz on incommensurability, Chang on parity and that move where you improve one option slightly and see whether it now clearly wins, Broome saying the whole thing is really just vagueness, Anderson arguing that cost-benefit is a normative mistake rather than a technical one — to know that "just pick a metric" is not obviously right. If I've garbled any of those, tell me rather than working around it.

  What I want is a triage procedure my staff can run on a contested comparison before we try to resolve it. The deliverable is an ordered set of tests, in the form a non-philosopher can actually execute in a 90 minute meeting: what you ask, what a sufficient answer looks like, and what the answer tells you about which kind of hard choice you're in. It needs to sort cases into at least the buckets I suspect exist — genuinely incomparable, comparable but on a par, just vague about where the boundary is, comparable in principle but not measurable precisely enough to rank, and comparable but where measuring would itself be the wrong move — and I want you to be explicit about which of those distinctions survives the translation into procedure and which ones I should throw out because nobody on my team will apply them consistently. Each bucket should end somewhere different: rank them and stop pretending it's hard; no ranking is available, hand it to the board as a values call and here's what the memo should say; or the rubric's numbers are the wrong instrument but a comparison is still available and here's how to make it without inventing points. I especially want a probe for the tiebreaker tell — does accepting an arbitrary tiebreaker actually count as evidence against parity, or can a real parity case absorb one without anything going wrong? My guess is the second, and I think that's where I'm wrong, but show me the argument either way. And flag every step that's really a judgment call wearing a procedure costume, including the ones you can't help but include.

  Then run it on three live cases. (a) An eviction-defense legal clinic in our county that keeps roughly 400 households housed a year, run by three lawyers, no scaling story whatsoever, versus a program in a neighboring state that trains high schoolers to monitor and restore streams — maybe 120 kids a year, small direct numbers, but the program officer insists the alumni go into the field and it compounds; staff keeps calling these different kinds of good and refusing to rank them. (b) Two grants in the same disease area, same intervention type, two different countries, cost-effectiveness from the same model with wide overlapping intervals and the better one about 1.4x on the point estimate — I want to know if this is a hard choice at all or just noise we're treating as sacred. (c) A local arts-and-outreach program the board chair's late mother founded, $150k a year, funding it is a standing expectation nobody wants to be the one to break, versus a much duller workforce program that is clearly better on expected value per dollar and clearly worse in every way anyone in the room can articulate. For each: which bucket, which test decided it, what the memo says, what the board does next. At least one of these has to come out against what I want — my prior is that (c) is my real incommensurability case and that the procedure should tell me it isn't, and if you think my prior is wrong, argue with it instead of flattering it. Finish with what the procedure can't do and where it will misfire in practice, and with how I keep the chair's insistence on a ranked list with a dollar score attached from turning back into fake precision. No reading list, please — I've got the names, what I don't have is the operational version.
reasoning: |-
  Okay, the user runs a grants program at a family foundation with a $9M annual budget. They've noticed a pattern called the "tiebreaker tell" where staff claim two proposals are incommensurable but then accept arbitrary tiebreakers without hesitation. This suggests the incommensurability claim might be masking something else. 

  The user wants a practical triage procedure to classify difficult comparisons into buckets like genuinely incomparable, on par, vague boundaries, etc. The procedure must be executable by non-philosophers in 90-minute meetings and produce clear next steps. They also want to understand if accepting arbitrary tiebreakers invalidates parity claims.

  Looking at their background: they're familiar with rationalist thinking ("everything is comparable") but have also read philosophers like Raz, Chang, and Anderson who challenge that view. They admit their rubric sometimes gets gamed to justify pre-decided outcomes. Their real pain point seems to be inefficiency in decision-making and discomfort with the cognitive dissonance between stated incommensurability and quick acceptance of random tiebreakers.

  For the triage procedure, it needs to:
  - Be actionable for non-philosophers
  - Sort cases into specific buckets with distinct resolutions
  - Include a test for the "tiebreaker tell"
  - Flag which steps are judgment calls disguised as procedures
  - Handle three live test cases honestly (even contradicting the user's priors)

  The buckets should be:
  1. Genuinely incomparable (different value categories)
  2. On par (comparable but neither better nor worse)
  3. Vague boundaries (precise comparison unclear)
  4. Comparable but imprecise (measurable in theory but not practice)
  5. Comparable but wrong to measure (values conflict with measurement)

  Key insight: The "tiebreaker tell" suggests most cases aren't truly incommensurable. If people accept coin flips, they've likely already made an implicit comparison. The procedure should surface this.

  For the test cases:
  - (a) Legal clinic vs. stream program: Likely "comparable but wrong to measure" - both create social value but through different means. Staff resist ranking because they're comparing tangible housing outcomes to intangible future environmental benefits.
  - (b) Two disease grants: Probably "comparable but imprecise" - the 1.4x difference with overlapping intervals means it's effectively a toss-up statistically.
  - (c) Sentimental arts program vs workforce program: Here's where we contradict the user's prior. This isn't incommensurability - it's a conflict between measurable impact and non-measurable values (loyalty, emotion). Classifying as "comparable but wrong to measure" forces confronting the real tradeoff.

  Critical limitations:
  - The procedure can't eliminate values conflicts
  - Judgment calls are unavoidable (especially in bucket assignment)
  - It may misfire when staff rationalize emotional preferences as incommensurability
  - Won't fix power dynamics (e.g., board chair's influence)

  To handle the chair's demand for scores: Suggest replacing dollar scores with qualitative tiers (e.g., "high confidence tier") to maintain rigor without false precision. The real win is making implicit comparisons explicit - that's where the procedure adds most value.
answer: |-
  Here's a triage procedure designed for real-world execution by non-philosophers, optimized for 90-minute meetings. It tests for **comparability** and **practical resolvability**, sorting cases into 4 actionable buckets (collapsing philosophical distinctions that won't survive staff application). The "tiebreaker tell" is your diagnostic anchor.

  ---

  ### **Triage Procedure: 4 Tests in 15 Minutes Per Pair**
  **Goal:** Determine if options are (A) Rankable, (B) Values Call, or (C) Non-Measurable Comparison.  
  **Execute:** Staff answer these questions sequentially. Stop when any test gives a clear outcome.

  1. **THE SINGLE-METRIC TEST**  
     *Ask:* "If we **had** to pick one metric to decide (e.g., lives saved, dollars leveraged, justice points), could we agree what it is?"  
     ✓ Sufficient answer: Uncontested metric named in <2 min.  
     → **Outcome:**  
     - **YES** → Proceed to Test 2 (likely Rankable or Imprecise)  
     - **NO** → Bucket B (Values Call)  

  2. **THE TRUMPING TEST**  
     *Ask:* "Is one option so much better on *any single dimension* that it outweighs others? (e.g., 10x more cost-effective, avoids catastrophic harm)"  
     ✓ Sufficient answer: Consensus that one dimension dominates.  
     → **Outcome:**  
     - **YES** → Bucket A (Rankable)  
     - **NO** → Proceed to Test 3  

  3. **THE TRADEOFF TEST**  
     *Ask:* "Would everyone accept a small *improvement* to Option X (e.g., 5% more beneficiaries, same cost) making it clearly better than Option Y?"  
     ✓ Sufficient answer: Unanimous "yes" or visible discomfort at "no."  
     → **Outcome:**  
     - **YES** → Bucket C (Comparable but Non-Measurable)  
     - **NO** → Proceed to Test 4  

  4. **THE TIEBREAKER TELL PROBE**  
     *Ask:* "If we flipped a coin right now to decide, would anyone feel we violated a principle?"  
     ✓ Sufficient answer: Immediate reactions noted.  
     → **Outcome:**  
     - **STRONG WINCE** → Bucket B (Values Call)  
     - **SHRUG/ACCEPTANCE** → Bucket A (Rankable)  

  ---

  ### **Decision Buckets & Next Steps**
  | Bucket | What It Is | Staff Action | Board Memo Language | Board Next Step |
  |--------|------------|--------------|---------------------|----------------|
  | **A: Rankable** | Comparable, no deep conflict | Rank options | "Our analysis shows X > Y on [metric]. We recommend X." | Approve ranked list |
  | **B: Values Call** | Genuinely incommensurable or normative conflict | Do NOT rank; frame values | "This choice reflects [Value A] vs [Value B]. Our staff has no consensus." | Explicit values vote |
  | **C: Non-Measurable** | Comparable in theory, but precision impossible | Qualitative comparison | "Both strong; X excels at [A], Y at [B]. We judge X slightly better due to [reason]." | Board discretion |
  | *Dropped Distinctions*: "On par" (collapses to A or C), "Vague boundaries" (handled in C). |

  ---

  ### **Key Judgment Calls in Disguise**
  1. **Single-Metric Test:** Defining "metric" is subjective (e.g., is "community resilience" a metric?).  
  2. **Trading Test:** "Small improvement" is context-dependent.  
  3. **Tiebreaker Tell:** Reading room sentiment has noise.  
  *Why this works:* Forces implicit comparisons to surface. The tiebreaker acceptance **is evidence against parity**—if values were truly incomparable, random choice should feel immoral (Raz). If it doesn’t, you’re in Bucket A or C.

  ---

  ### **Live Case Applications**
  **Case (a): Legal Clinic vs. Stream Restoration**  
  - **Test 1:** Staff can't agree on metric (housing security vs. environmental legacy). → *Values Call (B)*  
  - **Memo:** "Clinic addresses immediate human need; streams build long-term ecological capital. Choice between justice now vs. sustainability later."  
  - **Board:** Votes on foundation's priority: crisis response or prevention.  

  **Case (b): Disease Grants (1.4x CE, overlapping intervals)**  
  - **Test 1:** Cost-effectiveness is agreed metric. ✓  
  - **Test 2:** No trumping (1.4x isn't decisive). ✗  
  - **Test 3:** 5% improvement to worse option? Staff say "still unclear." → *Non-Measurable (C)*  
  - **Memo:** "Model noise clouds ranking; Country X has marginally better point estimate but higher uncertainty."  
  - **Board:** Flips coin or picks based on secondary factors (geographic equity, local partnerships).  

  **Case (c): Sentimental Arts vs. Workforce Program**  
  - **Test 1:** Agreed metric: "social return per dollar." ✓  
  - **Test 2:** Workforce program dominates on metric. ✓ → **Rankable (A)**  
  - **Memo:** "Workforce program yields 3x estimated economic mobility impact per dollar. Arts program has historical significance but lower measurable impact."  
  - **Board:** Funds workforce; chairs emotion handled offline (e.g., separate legacy grant).  
  *(Contradicts your prior: This isn’t incommensurability—it’s discomfort with quantified tradeoffs.)*

  ---

  ### **Limitations & Safeguards**
  **What the procedure CAN’T do:**  
  - Resolve power imbalances (e.g., chair’s pet project).  
  - Fix inconsistent moral intuitions.  
  - Replace political/rationalization (staff may "fail" tests strategically).  

  **Preventing fake precision with the chair:**  
  - Replace dollar scores with **qualitative tiers** (e.g., "Top 5% impact," "Moderate evidence").  
  - For Bucket B/C, require **narrative justification**: "We chose X because [value], not because score=92 vs 90."  
  - **Blind voting**: Board votes before seeing scores for close calls.  

  **Where it misfires:**  
  - False "Values Call" when staff avoid hard math.  
  - False "Rankable" when metrics ignore moral stakes (e.g., valuing stats over dignity).  
  - **Antidote:** Rotate who runs tests; require dissent documentation.

  This turns philosophical distinctions into action while exposing hidden comparisons. The tiebreaker tell is your canary—if it doesn’t squawk, rank and move on.
