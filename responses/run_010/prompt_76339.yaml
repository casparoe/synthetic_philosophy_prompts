prompt: |-
  I'm six weeks into an MPhil essay for a philosophy of mind option and I've got myself into a proper state. The question is roughly whether phenomenal properties can do any explanatory work at all, and I keep bouncing between three camps: the Chalmers-ish dualists who concede that qualia are causally inert and then have to swallow the paradox of phenomenal judgement, the illusionists who say the whole business is a confusion we should talk ourselves out of, and the Russellian monists who make consciousness the intrinsic nature of the physical so it gets its causal work done for free. What's driving me mad is that each camp scores the others on a different scoreboard. The physicalists demand causal closure and no brute nomic danglers; the dualists demand that the explanatory gap be taken at face value and that Mary's ignorance be real ignorance rather than a new way of knowing something she already knew; the illusionists say that any view on which the fact that we're all sitting here talking about qualia is a cosmic coincidence is refuted by the fact that we're all sitting here talking about qualia. So before I commit to defending anything I want the spec. What does a theory of this subject actually have to deliver to count as adequate?

  Fix the purpose like this: I want the desiderata for a theory good enough to underwrite an account of what introspective reports are and when they earn the name of knowledge — one that can tell me what's going on when someone says there's something it's like to see this particular red, and whether that utterance is evidence of anything beyond itself. The paradox of phenomenal judgement should be the central case, not a footnote. And there's a specific wrinkle I want the list to adjudicate. A mate of mine in the seminar floated what I've taken to calling the correlation-proxy reply: the report doesn't need to be caused by the quale itself, it's caused by the neural state, and the quale rides along reliably with that neural state in virtue of the psychophysical laws, so the report is true and non-accidentally true, just not by the route you'd have wanted. My instinct is that this pushes the luck up a level rather than removing it — the correlation itself becomes the unexplained brute fact, and we're back to a miracle with one extra step — but I genuinely can't tell whether that's a real objection or a physicalist reflex I picked up from the reading. Tell me whether there's a requirement that rules the manoeuvre out, which one it is, and whether that requirement is a real desideratum or a taste.

  So: the requirements. The cases the theory has to get right (Mary, the zombie intuition and why it grips people who have never met a zombie, the everyday fact that we say we do things beacuse they hurt and that this looks for all the world like experience making a difference to behaviour, absent and inverted qualia, the reliability of simple discrimination, the apparent fact that nothing detectable goes missing from the physics wherever experience is involved). The distinctions it isn't allowed to collapse — being conscious versus being reliably disposed to say you are, a report being true versus being non-accidentally true, a gap that's merely epistemic versus one that's ontological, consciousness being explanatorily idle versus being explanatorily dangly. The results it has to stay consistant with — causal closure, exclusion, and the existence plus systematic accuracy of our own phenomenal talk. Then sort out which of the standard demands are camp prejudices rather than genuine desiderata; I've got my eye on no brute nomic danglers, statable without indexicals or first-person terms, and the demand that a theory leave open the possibility that we could have been zombies. Then, and this is the part I care about most, whether some subset of the list is jointly unsatisfiable, and if so which item you'd drop and why that one rather than another. Don't be diplomatic about it — if you think the list is incoherent I'd far rather know now than after the draft. And finally, which single requirement does the most work in knocking candidates out. No need to point me at any literature, I've got a stack of it and no time to read it; argue from the cases and the considerations.

  Please lay it out with these headings in this order, roughly these lengths:

  - **Bottom line up front** — three or four sentences: what the spec really demands and where it bites hardest.
  - **What the theory is for** — about 150 words, pinning down the explanandum so the rest of it has a target.
  - **The requirements** — the bulk, 1100–1400 words, numbered, each with the case or consideration behind it in a sentence or two.
  - **Prejudices, not desiderata** — about 300 words, with a reason for each demotion.
  - **The squeeze** — about 400 words on the jointly unsatisfiable subsets and which item goes first.
  - **The killer requirement** — about 150 words.
  - **Quick scorecard** — 300 words maximum: epiphenomenalist dualism, illusionism, Russellian monism, reductive functionalism, interactionist dualism, each pass or fail against the list with one clause of reason. Keep it short, I'll do the real one myself; I just want to see whether the list discriminates at all.
reasoning: |-
  Okay, the user is six weeks into an MPhil essay on whether phenomenal properties can do explanatory work. They're stuck between Chalmers-style dualism, illusionism, and Russellian monism. Each camp seems to judge the others by different standards, and the user is frustrated because there's no agreed-upon set of criteria to evaluate these theories. They want a clear specification of what a theory must deliver to be considered adequate, especially focusing on introspective reports as knowledge and the paradox of phenomenal judgment.

  The user's main request is for a structured list of desiderata, including what the theory should explain, the requirements it must meet, which common demands are actually prejudices, and whether some requirements conflict. They also want a quick evaluation of major theories against these criteria. The mention of the "correlation-proxy reply" suggests they're grappling with whether reports can be reliable without qualia being causal. Their instinct is that this just moves the problem, but they're unsure if that's a valid objection or bias.

  The user is likely overwhelmed by the literature and conflicting arguments. They need clarity to structure their essay without getting bogged down in endless reading. Their deeper need might be for a framework to critically assess positions rather than just summarize them. They want to avoid committing to a position only to find their foundational criteria are flawed.

  Breaking down the response: Start with the bottom line upfront, then define the explanandum clearly. The requirements section is the bulk, covering cases, distinctions, and results. Each requirement should be tied to specific examples like Mary's room or zombies. Then identify which common demands are prejudices, like "no brute nomic danglers," explaining why they're not essential. The squeeze section addresses conflicts between requirements, such as explanatory relevance versus causal closure, and suggests which might be dropped. The killer requirement is likely the accuracy of phenomenal reports demanding explanatory relevance. Finally, a quick scorecard evaluates each theory against the desiderata.

  For the correlation-proxy issue, it fails because it doesn't meet the requirement that reports be non-accidentally true due to consciousness itself, not just correlates. This ties into the distinction between true and non-accidentally true reports. The user's instinct is valid; the brute correlation doesn't resolve the explanatory gap.

  The user likely values rigorous analysis over diplomacy, so the response should be direct, even if it means admitting some desiderata conflict. Highlighting trade-offs helps them make informed decisions. Ensuring the structure mirrors their requested headings will make it easier for them to apply this framework to their essay.
answer: |-
  ### Bottom line up front
  A theory must explain how introspective reports about phenomenal states can constitute *knowledge*—specifically, non-accidental, justified true belief grounded in conscious experience itself—while respecting the causal closure of the physical and the apparent explanatory gap. The central demand is that consciousness must be **explanatorily relevant** to the production of accurate phenomenal reports: it cannot be a mere epiphenomenal "rider" on physical causes. The hardest bite comes from reconciling this relevance with physical causal closure and avoiding brute correlations. The "correlation-proxy" manoeuvre fails because it renders the accuracy of reports explanatorily accidental.

  ### What the theory is for
  The core *explanandum* is the systematic reliability and apparent justificatory force of first-person introspective reports concerning phenomenal character (e.g., "I see a vivid red"). The theory must account for **what such reports are reports *of*** and **how they constitute knowledge** (or justified belief) rather than merely lucky guesses or physical-state descriptions in phenomenal disguise. Crucially, it must explain *why* reporting "I am experiencing red" is reliably accurate *when and because* a specific phenomenal state (redness-qualia) is present, and how this state contributes to the report's justification. The paradox of phenomenal judgment – how we can reliably *judge* and *report* on states that allegedly play no causal role – is the litmus test. The theory must clarify the ontological and explanatory status of phenomenal properties in making these reports the knowledge-constituting acts we take them to be.

  ### The Requirements
  *(Numbered with core rationale/use-case)*

  1.  **Accuracy of Phenomenal Reports:** The theory must explain the systematic *accuracy* of sincere, competent introspective reports about phenomenal states under normal conditions (e.g., reporting "red" when experiencing red qualia). *[Case: Everyday introspective discrimination and agreement; the very phenomenon the theory addresses.]*
  2.  **Non-Accidental Accuracy:** The accuracy of such reports must be *non-accidental*. It cannot be a cosmic coincidence or brute luck that reports track phenomenal states. *[Consideration: Knowledge requires non-accidental true belief; the correlation-proxy reply makes accuracy brute luck via unexplained psychophysical laws.]*
  3.  **Explanatory Relevance of Consciousness:** Conscious phenomenal properties must play an *explanatorily relevant role* in the production of accurate phenomenal reports. Their presence must make a difference to *why* the report is accurate. *[Case: Paradox of Phenomenal Judgement; intuition that we report *because* of the experience, not just its neural correlate. Rules out pure epiphenomenalism and the correlation-proxy.]*
  4.  **Respect Causal Closure/Completeness of Physics (CCP):** Any causal influence posited must be compatible with the principle that all physical effects have sufficient physical causes. *[Result: Fundamental physics and conservation laws; excludes interactionist dualism unless it radically alters physics.]*
  5.  **Avoid Explanatory Exclusion Violation:** Explanatory roles assigned to phenomenal properties must not be pre-empted or excluded by the sufficient physical explanation of the report's production. *[Result: Kim's exclusion argument; prevents overdetermination or "danglers" doing redundant work.]*
  6.  **Acknowledge the Explanatory Gap/Epistemic Asymmetry:** The theory must account for the persistent intuition that knowing all physical/functional facts about a system (like Mary in her black-and-white room) does *not* entail knowing what it's like for that system. *[Case: Mary's Room; the intuitive "hard problem" distinction.]*
  7.  **Accommodate the Conceivability of Zombies (as Intuition):** The theory must explain *why* the idea of a physical/functional duplicate lacking phenomenal consciousness (a philosophical zombie) seems coherent and conceivable, even if it's ultimately impossible. *[Case: The zombie intuition's grip; highlights the apparent non-supervenience of the phenomenal.]*
  8.  **Consistency with the Efficacy of Experience in Folk Explanation:** The theory must be compatible with the apparent fact that we explain behaviour by citing experiences (e.g., "I cried *because* it hurt"). *[Case: Folk psychology; everyday explanations of action by pain, desire, etc.]*
  9.  **Distinguish Consciousness from Mere Disposition to Report:** The theory must maintain a distinction between *being* phenomenally conscious and merely being *disposed to report* that one is conscious. *[Distinction: Needed to avoid collapse into behaviourism/illusionism by fiat; allows for absent/inverted qualia cases.]*
  10. **Distinguish Epistemic from Ontological Gap:** The theory must clarify whether the explanatory gap reflects a limitation in our understanding (epistemic) or a fundamental difference in reality (ontological). *[Distinction: Critical for assessing Mary, zombies, and whether physicalism is true.]*
  11. **Account for Simple Discriminative Reliability:** The theory must explain how phenomenal states underpin our reliable ability to discriminate stimuli (e.g., red vs. green). *[Case: Perceptual discrimination tasks; suggests phenomenal states are functionally integrated.]*
  12. **No Detectable Physical Omission:** The theory must be consistent with the fact that nothing *detectably* physical or functional seems missing in systems lacking consciousness (e.g., sleepwalking, blindsight). *[Case: Absent qualia cases; suggests consciousness isn't required for complex discrimination/behaviour.]*
  13. **Allow for the Possibility of Inverted Qualia:** The theory must accommodate the conceivability that identical functional/physical states could be associated with different phenomenal states (e.g., your red is my green). *[Case: Inverted spectrum argument; challenges reductive functionalism.]*

  ### Prejudices, not Desiderata
  *   **"No Brute Nomic Danglers":** Often a *physicalist* prejudice. While brute psychophysical laws are problematic *if* consciousness is fundamentally non-physical (violating CCP and creating exclusion worries), Russellian Monism *embraces* them as revealing intrinsic nature. Demanding their elimination a priori biases against non-reductive views. *Reason for demotion:* Assumes physicalism is true to rule out fundamental non-physical properties/laws.
  *   **"Statable Without Indexicals/First-Person Terms":** Often an *objectivist/third-person* prejudice. A theory *of subjective experience and first-person knowledge* must *use* and explain these terms, not eliminate them. Eliminating them (e.g., via impersonal neural descriptions) often changes the subject. *Reason for demotion:* Misidentifies the explanandum; phenomenal concepts are intrinsically indexical/egocentric.
  *   **"Must Leave Open the Possibility of Zombies":** Often a *dualist* prejudice. While the *conceivability* must be accommodated (Req. 7), demanding that zombies be *metaphysically possible* as a requirement for adequacy simply assumes property dualism is true from the outset. A successful physicalist or illusionist theory should *explain away* the intuition of possibility. *Reason for demotion:* Begs the question against physicalism/illusionism; Req. 7 captures the relevant datum without metaphysical pre-commitment.

  ### The Squeeze
  The most severe tension exists between a cluster of requirements centered on the **explanatory relevance of consciousness** (Req. 3, intrinsically linked to Req. 2 - Non-Accidental Accuracy and Req. 1 - Accuracy) and the **constraints of physical causation** (Req. 4 - CCP & Req. 5 - Avoid Exclusion).

  *   **The Conflict:** To satisfy Req. 3, consciousness must make an indispensable *explanatory* difference to the production of accurate reports. But if CCP (Req. 4) holds, the physical cause of the report (neural state N) is sufficient. If consciousness (C) is distinct from N (as per the gap intuitions, Req. 6 & 7), then either:
      *   C causes the report, violating CCP by introducing non-physical causation.
      *   C is caused by N and accompanies it (correlation-proxy), but then C's presence doesn't explain *why* the report is accurate – only N does. The accuracy becomes brute luck (violating Req. 2 & 3). N causes both C and the report "I have C", but the reliable *matching* of report to C is unexplained beyond the psychophysical law.
      *   C is identical to or constituted by some aspect of N (reductive move), but this struggles badly with Req. 6, 7, 8, 10 & 13 (Gap, Zombie conceivability, Folk Efficacy, Ontological Gap, Inverted Qualia).
  *   **The Trade-Off:** Something has to give.
      *   **Option 1: Sacrifice Strong Explanatory Relevance (Req. 3).** Accept epiphenomenalism or the correlation-proxy (Chalmers). Consequence: Phenomenal reports are accurate but non-accidental only in a weak, law-governed sense; conscious properties are explanatorily "idle" with respect to their own reports (deepens paradox of phenomenal judgment). *This moves the brute luck to the psychophysical law.*
      *   **Option 2: Sacrifice Causal Closure (Req. 4).** Embrace interactionist dualism. Consequence: Solves the paradox directly but clashes violently with fundamental physics and exclusion (Req. 5), making consciousness a "spooky" causal force.
      *   **Option 3: Sacrifice the Robustness of the Explanatory Gap/Ontological Distinctness (Req. 6, 10 - ontological interpretation).** Embrace reductive physicalism or illusionism. Consequence: Tries to dissolve the gap, explaining reports solely via physical/functional mechanisms. Struggles immensely with Req. 6, 7, 8 & 13 (Mary's ignorance, zombie conceivability, felt efficacy of pain, inverted qualia), often seeming to change the subject or deny the datum.
      *   **Option 4: Reconceive the Physical (Reqs. 4 & 5).** Russellian Monism: Consciousness *is* the intrinsic nature of the physical base N. It gets its causal efficacy "for free" via N's causal powers. Req. 3 is satisfied because the report *is* caused by N, whose nature includes C; the report is *about* C *because* C is intrinsic to N. Req. 4 is preserved (N is physical). The gap (Req. 6) remains epistemic – we can know N structurally/relationally without knowing its intrinsic nature C. *The squeeze here is whether "intrinsic nature" genuinely delivers the required explanatory relevance (Req. 3) for the *phenomenal character* rather than just the physical substrate, and whether it adequately resolves the conceivability issues (Req. 7) or just reframes them.*

  **Which Item Goes First?** If forced to drop one core requirement to relieve the tension, **Req. 3 (Strong Explanatory Relevance of Consciousness)** is the most tempting *for a theorist*, but also the most damaging to the core explanandum. Sacrificing it (Option 1) accepts the brute luck of the correlation-proxy. Sacrificing Req. 4 (CCP - Option 2) is scientifically costly. Sacrificing the gap's ontological weight (Option 3) seems phenomenologically dishonest to many. RM (Option 4) is an attempt to satisfy all by redefinition, but its success is contested. Ultimately, Req. 3 *cannot* be fully abandoned without undermining the possibility of phenomenal knowledge as distinct from mere reportive behaviour; it must be satisfied *somehow*, even if via radical re-conception (RM) or declared impossible (Illusionism). The "killer" is that *how* Req. 3 is satisfied defines the camps.

  ### The Killer Requirement
  **Requirement 3: Explanatory Relevance of Consciousness.** This is the fulcrum. If consciousness plays no *explanatory role* in the production of accurate phenomenal reports – if its presence doesn't *contribute* to *why* the report is correct – then the accuracy of those reports becomes fundamentally accidental relative to consciousness itself (violating Req. 2). The correlation-proxy reply fails precisely here: it provides no explanation for *why* the neural state causing the report "I see red" is reliably correlated with red qualia rather than green or none. The brute psychophysical law *is* the accident. This requirement directly targets the paradox of phenomenal judgment and exposes the fatal flaw in epiphenomenalism. It forces the issue: either consciousness is causally/explanatorily integrated (risking conflict with CCP), or its connection to reports is ultimately inexplicable brute fact, or it doesn't exist as assumed. No theory can be adequate without confronting this head-on.

  ### Quick Scorecard
  *   **Epiphenomenalist Dualism (Chalmers):** **FAIL** Req. 3 (Explanatory Relevance). Reports are caused by neural states, qualia are causally inert riders; accuracy is brute luck via psychophysical laws.
  *   **Illusionism (Frankish/Dennett):** **FAIL** Req. 1 (Accuracy) & Req. 6 (Gap). Denies phenomenal properties exist; reports are about non-existent qualia, hence not strictly accurate. "Explains away" the gap as confusion.
  *   **Russellian Monism (Chalmers/Alb.):** **TENTATIVE PASS** (Reqs. 1, 2, 3, 4, 5). Qualia as intrinsic nature inherit causal efficacy from physical base; reports are about that intrinsic nature. Major challenge: Req. 7 (Zombie Conceivability) - if intrinsic nature is phenomenal, how is zombie conceivable? Req. 10 - Gap is epistemic, not ontological.
  *   **Reductive Functionalism/Physicalism (Lewis/Papineau):** **FAIL** Req. 6 (Gap) & Req. 13 (Inverted Qualia). Claims knowing all physical/functional facts *is* knowing phenomenal facts (denies Mary's ignorance). Struggles to distinguish consciousness from report disposition (Req. 9) and handle inversion.
  *   **Interactionist Dualism (Eccles):** **FAIL** Req. 4 (CCP) & Req. 5 (Exclusion). Posits non-physical causal forces, violating causal closure and inviting exclusion worries (physical cause sufficient?).

  **Final Note:** This list *does* discriminate, forcing trade-offs. The correlation-proxy fails Req. 3. The central battleground is whether RM genuinely satisfies Req. 3 & 7, or whether Illusionism/Reductionism can adequately handle Req. 6 & 8. Your instinct about brute correlations is validated by the demand for non-accidental accuracy and explanatory relevance. Good luck with the draft!
