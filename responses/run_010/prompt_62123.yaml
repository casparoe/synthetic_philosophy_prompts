  ### Decision Tree
  **Start**: Subject reports a brief experience (e.g., "flash, maybe reddish") sincerely and confidently, but forced-choice discrimination (orientation/color) and wagering show chance performance.  

  1. **Is the report best seen as evidence about the external stimulus (e.g., the flash’s properties)?**  
     - **Yes** → **Leaf E (Engineer reports out)**: Position that verbal reports add no unique insight beyond behavior/physiology.  
       - *On Monday*: Replace verbal reports with neural/behavioral metrics (e.g., EEG during masking, pupillometry).  
     - **No** → Go to 2.  

  2. **Is the report best seen as evidence about the subject’s internal state (e.g., their experience of the flash)?**  
     - **Yes** → Go to 3.  
     - **No** → **Leaf F (Report as behavior)**: Position that reports are just responses to stimuli, with no "experience" to explain.  
       - *On Monday*: Record reports as button-press data (e.g., "seen" vs. "not seen"), ignoring content.  

  3. **Could a subject be sincerely and confidently wrong about having *any* experience at all?**  
     - **Yes** → Go to 4.  
     - **No** → Go to 5.  

  4. **If experience and report dissociate completely, is the report generated by a cognitive mechanism that "detects" experiences?**  
     - **Yes** → **Leaf B (Higher-order judgment)**: Position that reports reflect a detection mechanism that misfires.  
       - *On Monday*: Add confidence ratings or post-task interviews to model judgment errors.  
     - **No** → **Leaf C (Nothing behind report)**: Position that some reports are empty confabulations.  
       - *On Monday*: Correlate reports with neural noise (e.g., fMRI in prefrontal cortex) to identify false positives.  

  5. **Can better interview techniques (e.g., training, structured questions) genuinely help subjects access their experience?**  
     - **Yes** → **Leaf D (Trained elicitation)**: Position that interviews are valid measurement tools.  
       - *On Monday*: Develop a standardized interview protocol (e.g., iterative Q&A with feedback).  
     - **No** → Go to 6.  

  6. **Should we treat "how-it-felt" as separable from all discriminative abilities and reporting dispositions?**  
     - **Yes** → **Leaf A (Suspend belief)**: Position that reports describe a "reported world" with no assumed reality.  
       - *On Monday*: Document verbatim reports without linking to behavior/physiology in analysis.  
     - **No** → **Leaf F (Report as behavior)**: Position that no further explanation is needed.  
       - *On Monday*: Use reports only to compute error rates, ignoring experiential claims.  

  7. **For non-verbal subjects (e.g., macaques, infants, AI), can we infer experience from behavior/physiology alone?**  
     - **Yes** → **Leaf B/C (Flagged pair)**: Ambiguous; could be Higher-order judgment (B) or Nothing behind report (C).  
       - *Diagnosis*: Both positions treat non-verbal reports as mechanism outputs; tree cannot split them.  
       - *Separating question*: "Does a neural signature of experience exist independently of reporting mechanisms?" Unanswerable with current data.  
     - **No** → **Unnamed leaf**: Position that experience is only knowable via verbal reports.  
       - *Diagnosis*: Empty (repellent); denies study of infants/animals/AI, violating empirical goals.  
       - *On Monday*: Not applicable (unoccupied position).  

