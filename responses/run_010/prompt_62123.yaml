  - **Nodes**: 7 binary questions.  
  - **Leaves**: 6 named (A, B, C, D, E, F) + 1 unnamed.  
  - **Coverage**: All specified splits addressed (world vs. state, experience absence, interviewing, non-verbal cases, how-it-felt separability).
