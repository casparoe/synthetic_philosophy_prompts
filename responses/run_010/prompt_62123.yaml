  We are to build a decision tree that leads to named methodological positions. The tree must be based on binary questions about reports, subjects, and tasks, without using philosophical jargon or theory names. The tree must cover the specified splits and land on the required leaves.

  First, we outline the logical space with 3-4 binary questions that define the positions. Then we build the tree as a route through that space.

  ### Step 1: Logical Space

  We identify the key binary questions that the argument turns on:

  1. **Q1: Is the subject's report primarily evidence about the external world (the stimulus) or about the subject's internal state (their take on the world)?**
     - Option A: About the external world (the stimulus)
     - Option B: About the subject's internal state (their experience, belief, etc.)

  2. **Q2: Can a sincere and confident report ever be completely devoid of any corresponding experience? (i.e., is it possible that the subject had no experience at all despite the report?)**
     - Option A: No, a sincere and confident report must have some experience behind it (even if it's vague or misdescribed).
     - Option B: Yes, it is possible that there is no experience at all (the report is a complete confabulation).

  3. **Q3: Can improving the interview technique (e.g., training, careful questioning) genuinely improve the subject's access to their own experience, or does it only manufacture tidier confabulation?**
     - Option A: It can genuinely improve access (so we get a better reflection of the experience).
     - Option B: It only manufactures tidier confabulation (so we are just getting a more coherent story, not a truer one).

  4. **Q4: How should we handle cases where the subject cannot talk (e.g., non-human animals, infants, aphasic patients, AI networks)?**
     - Option A: We must rely solely on non-verbal behavior and physiology (and treat verbal reports as a special case of behavior).
     - Option B: We must find a way to infer first-person experience from non-verbal data (or abandon the study of experience in such subjects).

