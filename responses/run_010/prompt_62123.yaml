  ### Flagged Leaf Pairs
  - **Suspend belief (A) vs. Nothing behind report (C) vs. Higher-order judgment (B)**: The tree cannot cleanly split these.  
    - **Why**: All three handle dissociations between report and behavior, but A and C both deny report-world correspondence. B attributes reports to a mechanism, which could include A/C.  
    - **Separating question**: "Is there a conceivable experiment proving a sincere reporter had *no* experience?" (Yes → B/C; No → A). Unanswerable today.  
  - **Engineer reports out (E) vs. Report as behavior (F)**: Cleanly split by Node 1 (evidence about world vs. state).  
  - **Trained elicitation (D) vs. Higher-order judgment (B)**: Cleanly split by Node 5 (interview improves access).  

