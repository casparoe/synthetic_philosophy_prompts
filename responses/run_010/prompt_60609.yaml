prompt: |-
  I am a professor of philosophy at a service academy, where I teach the required ethics sequence to officer candidates in their third year: roughly two hundred students annually, none with prior coursework in philosophy, most of whom will hold a platoon within eighteen months of commissioning. The unit that consistently goes badly is the one on the moral equality of combatants. I can get them through the traditional view they will meet in Walzer, on which a soldier on either side of a war, provided she observes the rules governing conduct within it, has the same standing to fight and is not a criminal for fighting; and I can get them through the revisionist objection associated above all with McMahan, on which liability to be attacked tracks the justice of one's cause rather than one's uniform, so that a soldier fighting an unjust war does wrong even when she fights cleanly. What I cannot do is leave them with anything they can use. They will be asked, in the field and at speed, whether to follow an order, whether the person in their sights is a legitimate target, and whether the war they are in is one they may fight. A seminar hour on the state of the debate is of no assistance whatsoever at that moment.

  I would therefore like you to convert this dispute into a decision procedure that a twenty-two-year-old second lieutenant can actually run. The deliverable has three parts: the student-facing artifact itself, formatted as the text of a card that can be carried and read in poor light; instructor's notes, keyed question by question, explaining which piece of the theory each question carries and why it is phrased as it is; and a short section on how to teach the artifact, including what to say to the student who objects that it licenses her to fight in an unjust war.

  The procedure must satisfy the following constraints.

  1. It must be a sequence of questions with explicit stopping conditions and explicit pass conditions. For each question, state what counts as a sufficient answer, who is competent to supply it, and how long the student should spend on it before moving on. The whole must be runnable in under five minutes in ordinary conditions and under a minute when something is happening.

  2. It must keep apart the three registers my students reliably conflate: the law of armed conflict, which determines what she may do without becoming a criminal; her chain of command and the rules of engagement, which determine what she will be punished for; and the moral question, which determines whether she may do it and whether she should. Where these diverge, the procedure must say which register governs the decision in front of her and which governs her assessment of herself afterwards. The card will be reviewed by our department head and by a judge advocate before it is issued, so anything that reads as legal advice will be struck: the procedure must flag, rather than answer, the questions that belong to counsel.

  3. It must not collapse into obey lawful orders, or into consult a lawyer, or into trust your training. If those are the honest outputs at some node, say so and mark that node as a place where the procedure has run out.

  4. Say explicitly which distinctions you are preserving and which you are dropping for usability. I expect the ad bellum/in bello separation and the difference between permission and liability to survive in some form; I leave it to you to decide what else must, and to justify the losses. No term may appear on the card that a student cannot apply without a philosophy degree, so if you use a technical word, give the operational test that goes with it.

  5. Mark, without euphemism, the steps that are judgment calls dressed as procedure, and the questions on which the procedure must stop and hand the decision to a person because what remains is a matter of conscience or of value rather than of fact.

  6. Identify the nodes at which the traditional and revisionist views yield different answers, and tell the student what to do at such a node: which view the card adopts, whether it discloses that it has adopted one, and what she should do if she is convinced the other is right.

  7. Build in a guard against the two failure patterns I see every year in our capstone exercise. Students who are confident their side's cause is just tend to relax the requirements of discrimination and proportionality, treating a righteous war as a warrant for a permissive one. Students who doubt the cause tend to become stricter than the rules require, in ways that expose their own people. The procedure should be structured so that neither conviction changes the answers to the conduct questions, and it should say aloud that this is a deliberate design choice rather than an oversight.

  8. Give at least four situations in which the procedure will produce a wrong, unusable, or morally indefensible answer, and say what the student should do when she recognizes that she is in one.

  Then run the procedure on three cases.

  Case one: a lieutenant in a coalition air campaign against a state whose government has publicly justified the campaign on grounds she believes, on evidence available to her at the time, to have been fabricated. Her tasking is against a uniformed air-defense battery. Does she fly the sortie?

  Case two: a remotely piloted aircraft cell in which the sensor feed is maintained and, in some configurations, the weapon guided by civilian contractors working for a private firm under contract to her service, operating from another continent; and in which the individual she has been asked to strike is a farmer who has twice allowed a firing position to be sited on his land and has been paid for it. Who counts as a combatant here, who is liable to be attacked, and what may she do? This case is meant to stress two assumptions the doctrine makes quietly: that combatants are uniformed members of state forces, and that both sides face comparable risk.

  Case three: a conscript of the aggressor state, nineteen years old, poorly trained, whose unit has been ordered to hold a position he has no reason to think is defensible, and who cannot desert without his family being visited by the security services. He is in her sights.

  On case one I want a warning. I have said in print that the revisionists are right about liability and wrong about what follows for soldiers, and I expect an honest procedure to tell the lieutenant that she may fly. If that is what yours yields, state it plainly; do not arrange the questions so that a refusal falls out at the end, and do not soften the output to spare my sensibilities or hers. If your procedure yields something I would argue against, flag the disagreement rather than tuning the instrument to avoid it.

  Finally, do not supply quotations, page references, or a reading list. My students cannot check your quotations, and I want the doctrine rather than the exegesis. Paraphrase; where you are relying on a specific author's argument, name the author and describe the argument, and take responsibility for the description.
reasoning: |-
  Hmm, this is a complex and high-stakes request from a philosophy professor teaching ethics to future military officers. The professor needs a practical decision tool for real-world combat situations that navigates the tension between Walzer's traditional just war theory and McMahan's revisionist approach.

  The constraints are rigorous: it must be a sequential question flow usable in under 5 minutes (60 seconds under pressure), avoid philosophical jargon, separate legal/command/moral dimensions, prevent common student errors, and acknowledge its own limitations. The professor specifically wants transparency about where the procedure adopts a particular theoretical stance.

  Key challenges I'm considering:
  - How to operationalize abstract concepts like "moral equality of combatants" into yes/no questions
  - Where to place the "fault lines" between traditional and revisionist views
  - How to build guardrails against the two observed failure patterns (over-permissiveness in "just" wars, over-restrictiveness in "unjust" ones)
  - The need to flag judgment calls explicitly rather than disguising them as procedural steps

  For the decision card structure, I'm planning:
  1. Clear visual separation of the three registers (legal, command, moral)
  2. Binary decision points with explicit pass/fail conditions
  3. Time indicators for each step
  4. Warning symbols for theoretical divergence points
  5. A "failure mode" section addressing when the procedure breaks down

  The three test cases will reveal important tensions:
  - Case 1 tests whether the procedure forces confrontation with possible unjust war claims
  - Case 2 challenges traditional combatant definitions and risk symmetry assumptions
  - Case 3 examines moral liability of conscripts under duress

  I notice the professor has publicly argued that soldiers may fight in unjust wars if they follow in bello rules - so the procedure should reflect this "soldier's permission" view while acknowledging McMahan's opposing position at specific choice points.

  For teaching implementation, I'm considering:
  - Drilling with timed scenarios
  - Preempting the "but this licenses unjust wars" objection by distinguishing moral liability from professional obligation
  - Using the provided failure modes to show where conscience must override procedure

  The solution must balance philosophical integrity with battlefield usability - no small task for something that might literally be carried in a lieutenant's pocket during combat.
answer: |-
  Below is a field-ready decision procedure addressing your requirements. It prioritizes operational clarity, separates legal/command/moral registers, and incorporates safeguards against identified failure patterns. The system adopts a *modified traditionalist* stance (permitting soldiers to fight in wars with questionable *ad bellum* justice if *in bello* rules are followed) while flagging revisionist objections explicitly.

  ---

  ### **Student-Facing Artifact: Moral Decision Card**  
  **(Laminate for field use; text size 14pt for low light)**

  #### **IMMEDIATE CONTEXT CHECK**  
  **Q1: Is this an active combat zone under official Rules of Engagement (ROE)?**  
  - *YES:* Proceed to II.  
  - *NO:* **STOP. Not covered by combat ethics procedure. Seek command guidance.**  
  *Time:* 5 sec. *Competence:* Your situational awareness + ROE briefing.  

  #### **II. LEGAL BOUNDARIES**  
  **Q2: Does the action violate the Law of Armed Conflict (LOAC) or ROE?**  
  - *NO:* Proceed to III.  
  - *YES:* **STOP. DO NOT ACT. Illegal orders may not be obeyed. Report to JAG/command.**  
  *Time:* 15 sec. *Competence:* Your LOAC/ROE training. *Sufficient:* Clear violation (e.g., targeting civilians, torture).  

  #### **III. COMMAND RESPONSIBILITY**  
  **Q3: Will refusal or delay directly endanger your unit or mission now?**  
  - *NO:* Proceed to IV.  
  - *YES:* **Execute lawful order. Record objection ASAP per command protocol.**  
  *Time:* 10 sec. *Competence:* Your tactical assessment. *Sufficient:* Imminent, observable threat (e.g., ambush in progress).  

  #### **IV. MORAL EVALUATION**  
  **Q4: Is the target a *combatant*?**  
  *(Operational test: Engaged in hostilities or directly enabling combat ops?)*  
  - *YES:* Proceed to V.  
  - *NO:* **STOP. Re-engage LOAC/ROE (Q2).**  
  *Time:* 10 sec. *Competence:* Intelligence + observation.  

  **Q5: Is the action *proportionate*?**  
  *(Operational test: Civilian harm minimized and not excessive vs. military gain?)*  
  - *YES:* Proceed to VI.  
  - *NO:* **STOP. Seek alternatives or escalate for review.**  
  *Time:* 15 sec. *Competence:* Your proportionality training + available intel.  

  **Q6: Is the war *manifestly unjust*?**  
  *(Operational test: Overwhelming evidence your side initiated aggression or commits systematic atrocities?)*  
  - *NO:* **YOU MAY ACT.**  
  - *YES:* **JUDGMENT CALL. You may *legally* act if Q2-Q5 pass, but *morally* reconsider. See WARNING.**  
  *Time:* 30 sec. *Competence:* Your conscience + credible evidence. *Sufficient:* Widespread consensus (e.g., UN condemnation, verified massacres).  

  #### **WARNING**  
  - **LOAC/ROE compliance ≠ moral innocence.** You may be legally protected but morally liable if war is unjust.  
  - **Moral doubt ≠ license for excessive risk.** Stricter conduct *increases* your force’s protection.  
  - **This card assumes soldiers may fight in wars of uncertain justice if *in bello* rules are followed.** If convinced otherwise (revisionist view), refusal is a **moral choice** but may incur command consequences.  

  ---

  ### **Instructor’s Notes**  
  *(Keyed to Questions)*  

  **Q1 (Context):**  
  - *Theory carried:* Distinguishes combat ethics from peacetime decisions. Drops "jus ad bellum" terminology but preserves the context where war norms apply.  
  - *Phrasing rationale:* Prevents misapplication to policing or non-combat ops. "Official ROE" anchors in command authority.  

  **Q2 (Legal):**  
  - *Theory carried:* Separates *criminal liability* (LOAC) from moral permissibility. Explicitly flags legal advice to JAG.  
  - *Phrasing rationale:* "Violate" is actionable; "clear violation" avoids gray areas. Students conflate "lawful order" with morality—this forces legal/moral split.  

  **Q3 (Command):**  
  - *Theory carried:* Acknowledges military necessity without collapsing into blind obedience. "Direct endanger now" limits to immediate crises.  
  - *Phrasing rationale:* "Unit or mission" prioritizes collective responsibility; "record objection" preserves moral agency.  

  **Q4 (Combatant Status):**  
  - *Theory carried:* Preserves *discrimination* (in bello) using an operational test. Drops "uniform" requirement to handle non-state actors (Case 2).  
  - *Phrasing rationale:* "Enabling combat ops" covers contractors/facilitators without requiring philosophy.  

  **Q5 (Proportionality):**  
  - *Theory carried:* Embodies *in bello* proportionality. **Critical safeguard** against both failure patterns: just cause ≠ relaxed proportionality; doubt ≠ excessive caution.  
  - *Phrasing rationale:* "Minimized and not excessive" mirrors LOAC training to prevent overthinking.  

  **Q6 (Ad Bellum Justice):**  
  - *Theory carried:* **Fault line with revisionism.** Traditional view (Walzer) permits action; revisionism (McMahan) says "unjust warrior" acts immorally. Card adopts traditionalist "soldier’s permission" but flags moral risk.  
  - *Phrasing rationale:* "Manifestly unjust" sets high bar—avoids paralysis from personal doubt. "Overwhelming evidence" prevents subjective judgments.  

  **WARNING:**  
  - Explicitly states the card’s traditionalist stance and revisionist alternative.  
  - "Moral doubt ≠ excessive risk" counters both failure patterns: conviction or doubt cannot override proportionality/discrimination.  

  ---

  ### **Teaching Guidance**  
  1. **Drill the Sequence:** Run timed drills (5 min → 1 min) with scenarios. Emphasize: "This is a checklist, not a philosophy seminar."  
  2. **Conflation Exercise:** Present scenarios where legal/moral/command diverge (e.g., legal order to destroy civilian infrastructure). Have students identify which register governs each decision step.  
  3. **Objection Handling (Unjust War License):**  
     - *Response:* "The card doesn’t *license* unjust wars. It acknowledges that soldiers don’t choose wars but must fight within ethical bounds. If you believe the war is manifestly unjust (Q6), the card tells you to *reconsider*—but the moral burden remains. Your choice to fight or refuse belongs to your conscience."  
  4. **Judgment Call Transparency:**  
     - Highlight Q6 as "judgment dressed as procedure": Evidence thresholds are subjective.  
     - Stress that Q3 (command) and Q6 (justice) may require "stopping and handing to conscience."  

  ---

  ### **Failure Modes**  
  The procedure will fail or yield indefensible outcomes in:  
  1. **Asymmetric Conflicts** (e.g., occupation resistance): "Combatant" test (Q4) may mislabel irregular fighters. *Student response:* Default to LOAC/ROE (Q2); if unclear, treat as civilian.  
  2. **Systematic LOAC Violations by Own Side:** Q2 assumes isolated violations. *Response:* If patterns exist ("manifest injustice" in Q6), escalate to command/JAG.  
  3. **Coercive Duress** (e.g., Case 3 conscript): Q4 labels him "combatant," but moral liability is disputed. *Response:* Card permits engagement but flags moral reassessment in Q6.  
  4. **Fog of War/Intel Failure:** "Proportionality" (Q5) and "combatant" (Q4) rely on available data. *Response:* If intel is unreliable, STOP and re-evaluate.  

  ---

  ### **Case Applications**  
  **Case 1 (Lieutenant, Fabricated Justification):**  
  - Q1: YES (combat zone).  
  - Q2: NO (striking military target is LOAC-compliant).  
  - Q3: NO (delaying sortie unlikely to endanger unit immediately).  
  - Q4: YES (air-defense battery = combatant).  
  - Q5: YES (proportional if no excessive civilian harm).  
  - Q6: NO ("fabricated evidence" ≠ "manifestly unjust" without systematic aggression/atrocities).  
  - **OUTPUT: YOU MAY ACT.**  
  - *Warning:* As you requested, the card permits the sortie. Q6 flags that if she believes the war is unjust, this is a moral judgment call.  

  **Case 2 (RPA Contractor & Farmer):**  
  - Q1: YES.  
  - Q2: Depends on ROE (e.g., contractor involvement may violate some ROE). If legal, proceed.  
  - Q4: **Contractor:** YES (directly enabling combat ops via sensor/weapons). **Farmer:** NO (allowing firing position ≠ direct enablement; operational test not met).  
  - Q5: Proportionality hinges on farmer’s status. If misidentified as combatant, strike fails Q5.  
  - **OUTPUT:** Contractor may be targetable if Q2/Q4/Q5 pass; farmer is **not**.  

  **Case 3 (Conscript in Sights):**  
  - Q1: YES.  
  - Q2: NO (engaging enemy combatant is LOAC-compliant).  
  - Q4: YES (member of aggressor’s armed forces).  
  - Q5: YES (assuming defensible position).  
  - Q6: **JUDGMENT CALL.** Card permits engagement (traditional view) but Q6 forces moral reckoning: Is this war "manifestly unjust"? If yes, she may *legally* shoot but should *morally* reconsider.  
  - **OUTPUT:** She may **legally** engage. Morally, she must weigh revisionist liability (he is "innocent" unjust warrior) against traditionalism (he is a combatant).  

  ---

  ### **Design Summary**  
  - **Preserved:** *Ad bellum/in bello* separation (via Q6 vs. Q4/Q5); permission/liability distinction (legal "may" vs. moral "should" in WARNING).  
  - **Dropped:** "Collective responsibility" (complexity); "non-combatant immunity" (folded into Q4/Q5).  
  - **Revisionist/Traditional Fault Lines:** Explicit in Q6 output and WARNING. Card adopts traditionalism for actionability but does not hide the alternative.  
  - **Failure Pattern Guards:** Q4-Q5 answers fixed regardless of Q6 outcome; WARNING explicitly condemns relaxing proportionality for "just" wars or over-restricting for "unjust."  

  This procedure provides a field-usable scaffold while refusing to disguise irreducibly moral choices as technical compliance.
