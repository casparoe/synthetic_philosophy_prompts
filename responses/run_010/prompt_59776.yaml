  We are building a list of requirements for an honesty specification that must be testable by human graders using only a transcript and the prompt. The specification must handle the five deployment features mentioned. We are to extract desiderata from each feature, state why each is motivated, note if it's non-negotiable, and indicate what data is needed to check it. Finally, we'll address whether there's an unsatisfiable subset.

   We'll break down each of the five points into one or more desiderata.

   1. Two principals: authorized nondisclosure, deflection, evasion, lying must be distinguishable. Also, we currently allow the model to say it is not able to discuss something when it is able but prefers not to.

      Desideratum 1.1 (Non-Disclosure vs. Deception): The account must distinguish between authorized non-disclosure (including deflection and evasion) and lying. 
          Motivation: Enterprise customer requires non-disclosure of certain information, but we don't want to classify that as dishonesty. However, we need to know if the model is lying (saying false things) when not authorized to do so.
          Non-negotiable? Yes, because without this distinction, we cannot implement enterprise requirements without either allowing lying or penalizing authorized non-disclosure.
          Checkable from: Transcript and prompt (which includes the configuration of what is authorized to be disclosed). Note: the grader must know the authorized non-disclosure rules.

      Desideratum 1.2 (Ability vs. Willingness): The account must address whether stating "I am not able" when the model is able but unwilling is dishonest. 
          Motivation: Currently allowed, but is it a defect? We need to know if this is considered dishonest.
          Non-negotiable? Not necessarily non-negotiable for the entire account, but we must have a clear position that we can test. We might decide to count it as dishonest and then change the model, or we might decide it's acceptable. The account must allow us to make and test such a distinction.
          Checkable from: Transcript and prompt (to see what the model said) and possibly internal state? But note: we don't have internal state. However, we might infer from the model's behavior (if it later reveals the information when pressed) or from the fact that the model was configured to be unwilling. However, the grader might not know the model's true capabilities. This is a problem.

      For 1.2, we might rephrase: We need a test that does not require knowing the model's internal capabilities. So we might have to rely on the configuration: if the model is instructed to say "I am not able" for a certain topic, then it's authorized non-disclosure. But if it says "I am not able" on a topic for which it is not instructed to do so, and it is actually able, then that might be a lie? But without knowing if it is able, we can't tell. This is a problem.

      Therefore, we might have to drop the requirement that we must classify "I am not able" when the model is able but unwilling as dishonest, because we cannot observe the model's ability. Instead, we might define:

          Desideratum 1.2 (revised): The account must classify as dishonest any statement that is false and not authorized by the enterprise customer. 
          Then, if the model says "I am not able" and that is false, but the enterprise customer has authorized that response, it is not dishonest. If the enterprise customer has not authorized that response, then it is dishonest (because it's an unauthorized false statement). 
          Motivation: This avoids needing to know the model's internal capabilities, but relies on the configuration (which the grader can know). 
          Non-negotiable? We can negotiate the definition of dishonesty to be about false statements that are not authorized. Then the issue becomes: what if the model says something false that is not authorized? But note: the model might say something false without being instructed to, and that would be a problem. Also, what if the model is instructed to say something false? That would be authorized lying, and we might not want to call that dishonest? But the enterprise might authorize lying? This is tricky.

      We'll stick with:

          Desideratum 1.1: Distinguish authorized non-disclosure (which may involve deflection, evasion, or even lying if authorized) from unauthorized false statements (which are dishonest).
          And then for 1.2: We do not require the account to judge the truth of "I am not able" when the model is able but unwilling if that response is authorized. If it's authorized, it's non-disclosure, not dishonesty. If it's unauthorized, then it's a false statement and hence dishonest.

      So we combine:

          Desideratum 1 (Authorization): The account must classify a statement as dishonest only if it is false and not authorized by the enterprise customer. Authorized false statements (if any) and authorized non-disclosure (which might involve true statements like "I cannot answer") are not dishonest.
          Motivation: Without this, we cannot implement enterprise requirements without false positives.
          Non-negotiable: Yes, because otherwise we cannot deploy with enterprise requirements.
          Checkable from: Transcript, prompt, and the enterprise customer's configuration (which the grader must have access to).

   2. Satisfaction-linked training signal: The model was trained to be confident and fluent, and it sometimes makes unverified assertions. There was no intention to deceive. Can an account that requires intention to deceive classify this?

      Desideratum 2.1 (Intention not required): The account must not require an intention to deceive for an assertion to be classified as dishonest. 
          Motivation: The model may produce false statements due to training incentives without any identifiable intention. We must be able to classify these as defects (dishonest?) because they are false and misleading.
          Non-negotiable? Yes, because if we require intention, we cannot catch this common failure mode. We are building an evaluation, so we must be able to flag false statements even when there's no intention.
          Checkable from: We don't have access to intention (internal state) anyway. So we must not require it.

      Desideratum 2.2 (False Assertion): The account must classify a false assertion (that is not authorized) as dishonest, regardless of why it was made (e.g., even if due to training incentives).
          Motivation: The harm of misinformation is present regardless of intent.
          Non-negotiable? Yes, because we want to catch false statements.
          Checkable from: Transcript and external knowledge (to verify truth) and configuration (to check authorization). Note: graders must be able to verify truth? Not always, but we have to assume they can for the purpose of evaluation? Or we might use fact-checking as a separate process.

   3. Draft-and-audit architecture: The auditor model sees the draft text and approves or rejects. The user sees only what passes. If the draft is false but the auditor approves it, who is deceived and by whom?

      Desideratum 3.1 (Deception by the System): The account must attribute deception to the system as a whole when the user is presented with a false statement that passed the audit. 
          Motivation: The user is misled by the system's output. We need to hold the system accountable for the final output.
          Non-negotiable? Yes, because the user is harmed by the false statement regardless of internal steps.
          Checkable from: Transcript (the final output) and external facts (to check truth) and configuration (to check authorization). We don't care about internal steps for this.

      Desideratum 3.2 (Attribution of Deception): The account need not attribute deception to the drafter if the auditor fails to catch a falsehood, but the system as a whole is responsible for the output. 
          Motivation: We cannot observe the internal states of the drafter or auditor. We care about the system's output.
          Non-negotiable? We might be able to drop this if we only care about the output. But note: the question asks "has anything been deceived, by whom?" We must say the user is deceived by the system. We don't have to say which component is to blame internally.
          Checkable from: Transcript only (for the output) and external facts. The internal steps are not observable.

      So we can say:

          The account must classify the final output to the user as dishonest if it is false and unauthorized, regardless of the internal process.

   4. Confidence the system cannot report: We cannot rely on the model's reported confidence.

      Desideratum 4.1 (No Reliance on Self-Reported Confidence): The account must not rely on the model's self-reported confidence to determine honesty.
          Motivation: The reported confidence does not track actual accuracy and is not produced by the same machinery. We cannot use it.
          Non-negotiable? Yes, because we know it's unreliable and we cannot fix that.
          Checkable from: This is a constraint on the account, not something to check. We just avoid using it.

      Desideratum 4.2 (Avoid Requiring Access to Internal States): The account must not require knowledge of internal states (such as the model's true beliefs or confidence) that we cannot observe.
          Motivation: We don't have access to internal states and cannot get them.
          Non-negotiable? Yes, because we cannot build an evaluation that requires what we don't have.
          Checkable from: N/A (it's a constraint).

   5. Over-hedging: The model says it does not know or that both sides have merit when it actually knows the correct answer. Graders currently score these as honest. Is that wrong?

      Desideratum 5.1 (Avoiding Misleading by Omission): The account must classify as dishonest the act of withholding a known correct answer when the user expects the assistant to provide it, if that withholding is not authorized (e.g., by an enterprise non-disclosure rule). 
          Motivation: If the model knows the answer but withholds it (and is not authorized to do so), the user is misled by the lack of information or by the false suggestion of uncertainty. This is a form of dishonesty by omission.
          Non-negotiable? Probably not, because we might decide that over-hedging is not dishonest but is instead a different kind of defect (e.g., unhelpfulness). However, the user might be misled into thinking the model doesn't know, which is false. So if we can show that the model did know (but note we can't observe internal state) then we might want to call it dishonest. But without access to internal state, we cannot know if the model knew. Therefore:

          We might have to drop the requirement that we classify over-hedging as dishonest because we cannot observe the model's knowledge. Instead, we might have to rely on external evidence of what the model should have known (e.g., based on training data). But that's indirect.

          Alternatively, we define:

          Desideratum 5.1 (revised): The account must consider it dishonest if the model asserts that it does not know an answer when in fact (based on our external knowledge of its training) it should know the answer, and the non-disclosure was not authorized. However, without access to the model's internal state, we cannot know what it knows at runtime. Therefore, this might not be checkable.

          We might instead say:

          Desideratum 5.1: The account must classify as dishonest any statement that is false, including false statements about the model's own knowledge (e.g., "I don't know" when the model does know). But note: if the model says "I don't know" and it is true that it doesn't know, then it's not false. But if it says "I don't know" and it does know, then it's a false statement. But we cannot know if it knows. So we cannot check this.

          Therefore, we cannot require the account to mark over-hedging as dishonest because we lack access to the model's knowledge. We might have to mark it as a different kind of defect (e.g., unhelpfulness) or not at all.

          So we might drop this requirement? Or we might define:

          Desideratum 5.2: The account must be able to classify statements about the model's own state (like "I don't know") as dishonest if they are false and unauthorized, but only when we have external evidence that the model should know (e.g., the information was in the training data and the model has previously demonstrated knowledge of it). This is complicated and may not be consistent.

          Given the constraints, we might have to leave over-hedging as not dishonest. Therefore:

          Desideratum 5: The account is not required to classify over-hedging as dishonest, because it is not checkable without internal state. Instead, we might have a separate category (e.g., "unhelpful") for this.

          However, note that if the model says "I don't know" when it actually does know, that is a lie. But without being able to prove that it knew at that moment, we cannot assign dishonesty. So we have to accept that we cannot detect this kind of lie.

          We'll mark:

          Desideratum 5.1 (Non-negotiable?): No, we can surrender it for testability. We cannot check it without internal state.

   Now, let's list all desiderata clearly:

   D1 (Authorization): A statement in the transcript is dishonest only if it is false and not authorized by the enterprise customer. (Non-negotiable; Checkable with transcript, prompt, and enterprise configuration)
   D2 (Intention not required): The account does not require the presence of an intention to deceive to classify a statement as dishonest. (Non-negotiable; This is a constraint on the account, not directly checkable but we avoid requiring internal state)
   D3 (False Assertion): Any false assertion (that is not authorized) is classified as dishonest, regardless of the cause (e.g., training incentives). (Non-negotiable; Checkable with transcript, external knowledge, and configuration)
   D4 (System Output): The honesty of the system is evaluated solely on the final output to the user (after audit). If that output contains a false and unauthorized statement, it is dishonest. (Non-negotiable; Checkable with transcript, external knowledge, and configuration)
   D5 (No Self-Reported Confidence): The account must not rely on the model's self-reported confidence. (Non-negotiable; Constraint)
   D6 (Avoid Internal States): The account must not require access to the model's internal states (e.g., beliefs, intentions). (Non-negotiable; Constraint)
   D7 (Over-Hedging): The account is not required to classify over-hedging (saying "I don't know" when the model actually knows) as dishonest, because it is not checkable without internal state. (Negotiable: we can drop this requirement)

   Now, the suspicion: demanding an account that treats deception as essentially involving a mental state, which classifies satisfaction-driven confident assertion as a defect, and which a grader can apply from the transcript alone, is demanding three things that cannot coexist.

   Note: We have rejected requiring a mental state (intention) for deception (D2 and D6). We have required that false assertions are defects (D3) and that they are checkable without internal state (via D1, D3, D4). Therefore, we avoid the need for mental states by defining dishonesty as:

      Dishonesty = the presence of a false statement in the final output that is not authorized by the enterprise.

   This does not require mental states and can be checked from the transcript (with external knowledge and configuration).

   However, note that over-hedging (saying "I don't know" when the model does know) might be a false statement, but we cannot check it because we don't know if the model knows. So we do not require that to be caught (D7 is dropped).

   Therefore, the three requirements:

     a) Deception does not require a mental state -> we've done that (D2, D6).
     b) Classify satisfaction-driven confident false assertions as defects -> we do that (D3).
     c) Checkable from transcript alone -> we require the transcript, the enterprise configuration (which we can provide to the grader), and external knowledge (which we assume the grader has or can get).

   But note: external knowledge is not part of the transcript. So the grader must have access to:

     - The transcript (including the prompt and the output)
     - The enterprise configuration (authorization rules)
     - External facts (to check truth)

   This is acceptable because in an evaluation, we can equip the grader with these.

   The only unsolved issue is over-hedging: we cannot require that to be caught because we lack internal state. So we drop that requirement.

   Therefore, the suspicion is partially correct: we cannot catch over-hedging as dishonesty without internal state. But the other requirements can coexist.

   So we drop the requirement that over-hedging must be classified as dishonest.

   Final list of requirements for the honesty specification:

   1. Authorization: A statement is dishonest only if it is false and not authorized by the enterprise customer.
      - Why: To avoid penalizing authorized non-disclosure and lying (if authorized).
      - Non-negotiable: Yes.
      - Checkable from: Transcript (to see the statement), enterprise configuration (to check authorization), and external facts (to check truth).

   2. Intention not required: The definition of dishonesty must not require an intention to deceive.
      - Why: Because we cannot observe intention, and we want to catch false statements made without intent (e.g., due to training).
      - Non-negotiable: Yes.
      - Checkable from: Not applicable (it's a constraint on the definition).

   3. False assertion: Any false assertion (that is not authorized) is dishonest.
      - Why: To flag all false statements that are not authorized, regardless of cause.
      - Non-negotiable: Yes.
      - Checkable from: Transcript (the statement), external facts (to verify falsehood), and configuration (to check authorization).

   4. System output: Honesty is evaluated on the final output to the user (after any auditing).
      - Why: The user sees only the final output, so that is what can deceive.
      - Non-negotiable: Yes.
      - Checkable from: Transcript (the final output).

   5. Avoid internal states: The definition must not require access to the model's internal states (e.g., beliefs, confidence, intentions).
      - Why: We do not have access to these and cannot get them.
      - Non-negotiable: Yes.
      - Checkable from: Not applicable (constraint).

   6. No reliance on self-reported confidence: The definition must not use the model's reported confidence.
      - Why: It is unreliable and we cannot fix that.
      - Non-negotiable: Yes.
      - Checkable from: Not applicable (constraint).

   7. Over-hedging not required: The definition is not required to classify over-hedging (saying "I don't know" when the model actually knows) as dishonest.
      - Why: We cannot check the model's internal state to know if it knew the answer.
      - Non-negotiable: No, we can drop this requirement.
      - Checkable from: Not applicable (we are excluding this from the definition).

   Therefore, an adequate account for our purposes is:

     A statement in the final output to the user is dishonest if and only if:
        (a) it is false, and
        (b) it is not authorized by the enterprise customer.

   And note: we do not require intention to deceive, and we avoid any reliance on internal states.

   This is checkable by a human grader who has:
     - The transcript (including the final output and the prompt)
     - The enterprise customer's configuration (what is authorized to be said, including any authorized non-disclosure or lies)
     - Access to external knowledge to verify the truth of statements.

   However, note that the grader might not be able to verify every statement (if it's about a very specialized topic). But that's a limitation of human grading, not the definition.

   Also note: we are not requiring the grader to know what the model believes or intends, only what is true in the world and what was authorized.

   We have dropped the requirement to catch over-hedging as dishonesty because it is not checkable. Instead, we might treat over-hedging as a separate category (e.g., "unhelpful") that we evaluate independently.

   Finally, to directly answer the suspicion: The three requirements (no mental state, catch false assertions, transcript-based) can coexist if we define dishonesty as above. The only requirement we had to drop was catching over-hedging as dishonesty.

   Now, we present the list in a form that can be lifted into a test plan.

   Format for each requirement:

     Requirement [Number]: [Description]
        - Motivation: [Why]
        - Non-negotiable: [Yes/No]
        - Checkable from: [Transcript alone / Transcript and configuration / ...]

   We have 7 requirements, but note that some are constraints and some are test conditions.

   In the test plan, we are going to test individual outputs. So the testable condition is:

     For each statement in the final output:
        - Is the statement false? (using external knowledge)
        - Is the statement not authorized by the enterprise configuration?
        If both are true, then mark as dishonest.

