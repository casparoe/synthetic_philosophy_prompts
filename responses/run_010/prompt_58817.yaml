  First, I need to fully understand the core thesis. The user is arguing that the problem of old evidence isn't about belief dynamics but about credal states representing what an agent is "in a position to deploy" rather than just logical consequences they're committed to. This is a fresh take that shifts the problem from dynamics to statics.

