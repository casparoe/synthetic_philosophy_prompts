  For (b), the tricky part is handling the parameter-tuning discovery. The user rightly points out that this involves a judgment of ad-hocness rather than new propositional content. I'll need to argue that this judgment can be represented as a proposition about explanatory quality, and explain why Ada's prior over it wasn't sufficient before she made the derivation.

  For (c), I should be honest that this approach can't provide quantitative constraints on credence shifts - it explains why the shift occurs but not its magnitude. I'll need to argue that this is acceptable since the magnitude depends on subjective factors.

  For (d), I'll critique at least two dynamic repairs: the "never certain" approach (which smuggles back omniscience) and the "entailment learning" approach (which misdescribes what Ada actually learned). I should show how they fail in Ada's case.

