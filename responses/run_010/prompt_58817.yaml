answer: |-
  ## Defending the Static Diagnosis of Old Evidence

  Your thesis offers a compelling reconceptualization: the problem of old evidence stems not from belief dynamics, but from an impoverished view of the *static* credal state. A credal state should represent not just the agent's empirical commitments and their *logical* closure, but crucially, their *epistemic access* – what they are **in a position to deploy** cognitively at that moment. The requirement of total evidence then mandates using *this accessible set*, not the logically implied totality. Ada's shift is rational because her derivations changed what she was in a position to deploy; conditionalization on her *accessible* evidence justifies the shift without special rules. Let's build the argument rigorously.

  ### (a) "In a Position to Deploy": Beyond Flipped Omniscience

  The charge that "in a position to deploy" (IPD) is merely "logical omniscience stood on its head" misconstrues it. Logical omniscience demands an agent believes *all* logical consequences of their beliefs, regardless of computational or cognitive tractability. IPD, conversely, is fundamentally *resource-relative* and *agent-centered*.

  *   **Determinate Content:** An agent is IPD a proposition P at time T iff, given their current credal state, stored information, cognitive capacities, and available cognitive effort/resources, they can *recognize P as evidentially relevant* and *integrate it into their probabilistic reasoning* without requiring new empirical input or fundamentally novel insight beyond what their current state provides the resources for.
  *   **Failures of IPD:** An IPD failure occurs when:
      1.  **Cognitive Block:** The logical connection is computationally intractable *for this agent* (e.g., deriving a complex theorem from axioms they believe).
      2.  **Attentional Failure:** The connection exists within their cognitive grasp but requires effortful derivation they haven't performed (e.g., failing to see that "If A then B" and "A" imply "B" because they haven't *focused* on the implication).
      3.  **Relevance Blindness:** The agent possesses the premises and the computational capacity but hasn't recognized the *evidential relevance* of the connection for a specific hypothesis (e.g., holding `H entails O`, `O`, but not realizing this confirms `H` until prompted).
  *   **When it Bites:** IPD bites precisely in cases like Ada's and the classic problem of old evidence: situations where an agent possesses beliefs (e.g., `O`, `H`, logical rules) that *logically imply* a confirmation relation (e.g., `P(O|H) = 1`), but where the *recognition and integration of that specific implication* for the specific hypotheses in question require non-trivial cognitive work *that hasn't been done yet*. IPD demarcates the boundary between what is *implicitly contained* in the logical closure and what is *explicitly accessible* for evidential reasoning by a bounded agent.

  IPD is not flipped omniscience; it's the *pragmatic boundary of accessible consequence* for a finite reasoner. A critic can identify failure when an agent demonstrably has the resources (beliefs, capacity) to see a connection but hasn't deployed it in their reasoning, even though doing so would change their credences.

  ### (b) Handling Parameter-Tuning: Judgment as Propositionalized Difference

  The parameter-tuning discovery (`H2` requires hand-tuning to yield `O`) seems non-propositional. However, it changes what Ada is IPD regarding the *explanatory relationship* between `H2` and `O`. We can capture this by propositionalizing the *contrast* revealed by her derivations:

  *   **The Learned Proposition:** Ada learns `D`: "The derivation of `O` from `H1` relies only on core structural assumptions of `H1` (making `O` a robust consequence), whereas the derivation of `O` from `H2` requires ad-hoc parameter setting not determined by `H2`'s core principles."
  *   **Why the Prior Wasn't Sufficient:** Ada's prior credence over `D` *was not fixed solely by her prior beliefs about `H1`, `H2`, and `O`*. Before performing the derivations:
      1.  **IPD Failure:** She was not IPD the *specific derivational details* or the *contrast* between them. She knew `H1 entails O` and `H2 entails O` abstractly, but not *how*.
      2.  **Prior Uncertainty:** Her prior credence `Cr_old(D)` reflected her *general expectations* about the derivational robustness of `H1` and `H2`. Perhaps she had `Cr_old(D) = 0.4` (leaning towards `D` being false or indeterminate), based on her overall sense of `H1`'s elegance and `H2`'s flexibility. Crucially, this prior over `D` was *independent* of her credences in `H1` and `H2` *conditional on the abstract entailment and `O`*. Performing the derivations makes `D` IPD – she now *sees* the contrast clearly. She conditionalizes on `D`, shifting her credence to `Cr_new(D) ≈ 1`.
      3.  **Impact on Hypotheses:** Learning `D` (i.e., seeing the derivational contrast) is highly relevant evidence. `H1` predicting `O` robustly (`D` being true) makes `H1` *more explanatorily powerful* and *less ad-hoc* than `H2`, which only gets `O` via tuning. This makes `H1` intrinsically more plausible. Conditionalizing on `D` (now IPD) directly lowers `Cr(H2 | D)` and raises `Cr(H1 | D)` relative to `Cr(H1 | O & H1⊨O & H2⊨O)` without `D` being explicitly considered.

  The shift isn't driven by learning a *new fact about the world* (`O` is old), but by learning a *new fact about the explanatory structure connecting her existing beliefs* (`D`), making *that structural fact* IPD for her evidential assessment.

  ### (c) Quantitative Constraints: Silence and Subjectivity

  The thesis, as stated, **must stay silent on the quantitative magnitudes** of Ada's shift (0.3 -> 0.7 for H1, 0.3 -> 0.1 for H2). Here's why:

  1.  **The Source of Magnitude:** The magnitude of the shift depends entirely on Ada's *prior credence* over the proposition `D` (the contrast in derivational robustness) and the *likelihoods* `P(D | H1)` and `P(D | H2)`. The thesis explains *why* she shifts (conditionalization on `D`, now IPD), but the *degree* is determined by her subjective prior assessment of how likely such a robust derivation was from `H1` vs. `H2`, *before* she performed the detailed derivations.
  2.  **Subjectivity of Explanatory Judgments:** How much *more* does robust derivation confirm a theory than ad-hoc derivation? How much does `D` lower the intrinsic plausibility of `H2`? These are fundamentally subjective judgments mediated by the agent's prior beliefs about theory virtues (simplicity, non-ad-hocness, explanatory depth). There's no objective Bayesian rule dictating that robust derivation *must* yield a 0.4 credence boost.
  3.  **Acceptable Cost?** This silence is an **acceptable cost**, not arbitrariness. It reflects the genuine subjectivity inherent in *explanatory judgments* and *theory choice*. Bayesianism has always accommodated subjective priors. The magnitude of Ada's shift reflects her *specific* assessment of the explanatory significance of the derivational differences she discovered. A different agent, with the same evidence but different priors over explanatory virtues or the likelihood of `D` given `H1`/`H2`, might shift less dramatically. The core rationality lies in *conditionalizing on the now-IPD evidence `D`*, not in the specific numerical outcome. Demanding objective magnitudes for such judgments *would* be arbitrary or require implausibly strong rationality constraints.

  ### (d) Critiquing Dynamic Repairs

  1.  **"Never Really Certain" (Doubt about O):**
      *   **The Repair:** Suggests Ada never had `Cr(O) = 1`. She should redistribute credence over `~O` when deriving `H1 entails O`, then update on `O` (now seeming more likely).
      *   **Misdescription:** This fundamentally misdescribes Ada's case. She *was* certain of `O`. It was old, bedrock evidence. The shift occurred *without any doubt about `O` entering the picture*. Her confidence in `O` never wavered. Forcing her to artificially doubt `O` distorts her actual epistemic state and the source of the shift (which was about the *derivational path*, not `O`'s truth).
      *   **Smuggling Omniscience:** This repair implicitly assumes that if she *were* uncertain about `O`, learning the entailment *would* boost `H1` when she subsequently confirms `O`. But this requires her to already know the entailment *before* she learns it! It relies on her *already* being aware of the logical connection she hasn't yet derived, which *is* a form of logical omniscience. The repair only works if the agent *already* possesses the knowledge (`H entails O`) they are supposed to be learning dynamically.
  2.  **Learning "H entails O" Extra-Systematically:**
      *   **The Repair:** Suggests Ada learns the *proposition* `L`: "`H1` entails `O`" and conditionalizes on that.
      *   **Misdescription:** This misidentifies what Ada learned. She *already knew* `H1 entails O` abstractly! Her initial credences (0.3 each for `H1`, `H2`, both entailing `O`) show this. What she learned *dynamically* was not the *existence* of the entailment, but its *nature* – the specific proposition `D` capturing the contrast in *how* the entailments work (`H1` robustly, `H2` ad-hocly).
      *   **Insufficient Shift:** Conditionalizing *only* on `L` ("`H1` entails `O`") would be ineffective. Since she already knew `H1 entails O` and was certain of `O`, `Cr_old(H1 | L) = Cr_old(H1 | H1⊨O)`. Given `O` and `H1⊨O`, learning `L` adds nothing new (`L` is logically equivalent to `H1⊨O`, which she already accepted). This repair cannot generate the shift she actually underwent, which depended on the *contrast* revealed by the derivations (`D`), not the abstract entailment (`L`).

  ### Vulnerability and Potential Surrender

  **Most Vulnerable Point:** The primary vulnerability lies in the **operationalization and objectivity of "in a position to deploy" (IPD)**. While defined in terms of cognitive resources and accessible relevance, IPD remains susceptible to charges of vagueness or excessive psychologism. How much effort is "reasonable"? What counts as "recognizing evidential relevance"? A critic might argue this makes rationality overly dependent on fleeting cognitive states, undermining normative force. Furthermore, specifying the learned proposition `D` (the contrast) feels somewhat artificial, though necessary.

  **Patch and Surrender:** To patch this, one must **develop a richer, more formal account of cognitive access within epistemic states**. This might involve:
  1.  **Structured Credences:** Representing an agent's state not just as a probability distribution, but as a structure including *explicitly represented* propositions, *inference rules* they can readily apply, and perhaps *attention weights*. IPD would map to the contents of this "explicit core" or "working memory."
  2.  **Cost-Bounded Rationality:** Define IPD relative to a formal model of computational cost (e.g., logical depth of derivation, cognitive steps). Rationality requires deploying consequences within a bounded "cost horizon."

  **Surrender:** Pursuing this patch likely means **surrendering the ideal of a purely propositional, unstructured probability function as the complete representation of epistemic state**. It embraces a more computationally bounded, psychologically realistic model of epistemic agents. This moves away from traditional Bayesian "ideal rationality" towards a bounded rationality framework, accepting that normative standards must be relativized to cognitive resources. The rival views (dynamic repairs) try to preserve the simple probability function by altering update dynamics; your thesis argues this is futile and the *static representation* itself needs enrichment to handle logical learning and old evidence rationally. The rival views either smuggle in omniscience ("never certain", "learn entailment") or propose convoluted counterfactual dynamics ("background with all consequences drawn"), failing to capture the actual, static cognitive shift in cases like Ada's.
