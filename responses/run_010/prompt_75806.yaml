prompt: |-
  I run a graduate seminar on the philosophy of social norms, and one of the weeks is devoted to Lewis's analysis of convention in *Convention* (1969). Rather than assign the usual driving-on-the-left examples, I constructed a case and asked the seminar to classify it. Two of my students, Owen and Nadia, disagreed, first in session and then over a fortnight of email, and neither would give ground. I found myself unable to referee the exchange, so I want an independent adjudication of it.

  The case, as I circulated it: for as long as anyone can remember, no household in a certain mountain village has drawn water from the communal well between noon and two in the afternoon. The restriction dates from a period when those hours were reserved for watering the herds brought down from the high pastures. The herds were sold off in the 1950s; every house now has piped water; the well serves one kitchen garden. Nothing is written down, and no villager ever articulates the restriction as a rule — it is simply what one does not do. Everyone abstains, and everyone expects everyone else to abstain. A visiting relative who filled a bucket at one in the afternoon was met with a coolness that took weeks to thaw, and the family that permitted it was talked about. Asked privately, however, each villager says the same thing: they would be glad to see the practice end, they assume their neighbours feel quite differently, and none would propose ending it, since to propose it would mark one as a person who does not belong. There is no hour of the day at which anyone would object to anyone drawing water.

  The exchange, in order:

  1. Owen: It is a convention in Lewis's sense, and Lewis's analysis correctly classifies it. Run the conditions: everyone conforms; everyone expects everyone else to conform; that expectation gives each household a decisive reason to conform, since being the only one to draw at noon costs weeks of coolness; and the regularity is arbitrary, since any other two-hour window would serve identically — identically, because nothing is being served.

  2. Nadia: It fails the preference condition. Lewis requires that the parties prefer general conformity to less than general conformity — that the regularity be something they want upheld. No one in that village wants it upheld; each upholds it only because each falsely believes the others do. The analysis was built for coordination problems, where the parties share an interest in there being some regularity or other. A practice nobody wants is not a convention but a collective mistake.

  3. Owen: You have dropped the conditional. The condition does not ask whether anyone wants the practice to exist; it asks whether, given that almost everyone else conforms, each prefers that any one other conform as well. Put that question to a villager and the answer is yes: if the neighbours are all abstaining, you would rather nobody break ranks, because a lone defector forces everyone else to choose between censuring him and being seen as someone who will not censure.

  4. Nadia: Then look at what your decisive reason actually is: fear of censure. Lewis's third condition wants the expectation of others' *behaviour* to supply the reason to conform. Here the reason is supplied by an expectation about others' *attitudes*. If sanction is doing the work, you have described a social norm enforced by disapproval, not a convention — and the distinction Lewis's book exists to draw has quietly disappeared.

  5. Owen: Lewis allows that the reason to conform may be the avoidance of others' displeasure; that is precisely how conventions of politeness operate. If you insist on a coordination payoff, you exclude those cases too. And nothing in the conditions requires a convention to be useful, so a pointless regularity is not thereby a non-convention.

  6. Nadia: On your reading, then, nothing in the account can fail. Correct the villagers' beliefs about one another and the practice is gone within a week; correct the belief that driving on the left is arbitrary and nothing changes at all. A convention, in the sense Lewis needs, is stable under the discovery of its own arbitrariness. Yours is stable only under ignorance of its own pointlessness. That is a difference in kind.

  7. Owen: Stability under belief revision appears nowhere in the conditions; you are proposing a rival account with an extra clause and calling the addition a reading of Lewis. And your arbitrariness objection fails on its own terms: any other two-hour window would serve identically, so the regularity is arbitrary on the face of the analysis. If you say a rival must be one the parties actually want, then which fork to use stops being a convention the moment the guests would rather the host stopped laying four, and every vestige of a dead etiquette code ceases to be conventional.

  8. Nadia: Those cases still settle something the parties have an interest in having settled. The village settles nothing. If a practice that coordinates nothing, is wanted by no one, and rests on a universal misapprehension still counts, then "convention" no longer picks out the phenomenon Lewis introduced the term to explain: order that sustains itself and works for those inside it. Losing that category is not a verbal cost.

  Please adjudicate the argument move by move rather than declaring a winner at the end. I am not asking for references or for a survey of what the secondary literature has said about Lewis; I want your own assessment of these arguments as actually made. Please organise your response under the following headings, in this order:

  **The case and the two theses** (about 150 words). State the practice and each student's thesis in one sentence apiece, without evaluating either. Then note any feature of my case description that is under-specified in a way that would matter to the classification, and say how you are resolving it.

  **The conditions** (about 300 words). Set out the conditions of Lewis's analysis as you understand them, and for each one mark the village case satisfied, not satisfied, or indeterminate, with a sentence of justification. Where Owen or Nadia has misstated a condition, give the correction and say what it does to the move that relied on it.

  **Move by move** (about 1,000 words). Take the eight moves in order. For each, assign one rating from this scale — clearly mistaken, mistaken but pointing at something real, even, largely right, clearly right — and then explain in three to five sentences what the move gets right, what it gets wrong, and what would have to be added or withdrawn to repair it. Rate the move as it was made, not a strengthened version of it you would prefer.

  **What both missed** (about 250 words). Identify at least two considerations that bear on the classification and that neither of them raises.

  **Verdict** (about 200 words). Say who is more right overall and about which specific point, whether the residue of the disagreement is substantive or merely verbal, and what single further case or distinction would settle it.
reasoning: |-
  Hmm, the user is running a graduate seminar on the philosophy of social norms and has presented a challenging case study about Lewis's convention theory. They've shared an email debate between two students, Owen and Nadia, about whether a village water-drawing practice constitutes a Lewisian convention. The user wants me to adjudicate their arguments move-by-move without declaring an overall winner until the end.

  I need to carefully analyze Lewis's actual conditions for convention from his 1969 book. The key conditions are: (1) a regularity in behavior, (2) mutual expectations of conformity, (3) a preference to conform conditional on others' conformity, and (4) arbitrariness (other regularities could have served the same purpose).

  Looking at the village case: There's clearly a regularity (no water drawing noon-2pm), mutual expectations exist, and the practice is arbitrary since any time window would work equally well now. The crucial question is about the preference condition - do villagers prefer conformity given others conform? Owen argues yes because of avoiding censure, while Nadia argues no because no one actually wants the practice.

  I'll need to evaluate each of their 8 argument moves. For instance, when Owen says fear of censure counts as a Lewisian reason, he's correct based on Lewis's examples of etiquette. But Nadia makes a good point that this practice coordinates nothing - unlike driving conventions or table manners which solve actual coordination problems.

  Both students miss important nuances. Owen overlooks that Lewisian conventions typically solve coordination problems, while Nadia underestimates how conventions can persist through inertia even when usefulness fades. The stability-under-belief-revision point Nadia raises in move 6 is insightful but not actually in Lewis's definition.

  In my verdict, I'll explain why Owen's position aligns better with Lewis's actual conditions, though Nadia identifies important functional differences that might warrant distinguishing "coordination conventions" from other conventional practices. A good test case would be a similar practice that actually coordinates something useful versus one that doesn't.
answer: |-
  ### The case and the two theses  
  The practice: Villagers abstain from drawing water from a communal well between noon and 2 PM due to a defunct historical reason, enforced by social disapproval despite universal private preference for its end.  
  Owen’s thesis: The practice satisfies Lewis’s conditions for convention, as conformity, mutual expectations, decisive conditional reasons, and arbitrariness are present.  
  Nadia’s thesis: It fails Lewis’s preference condition, as no one prefers general conformity; it is a collective mistake sustained by false beliefs, not a coordination solution.  
  **Under-specified feature**: Whether villagers *believe* the practice serves *any* latent function (e.g., preserving tradition). Resolved: The case states no one articulates a rule, and all wish it would end, so no latent function is intended.  

  ### The conditions  
  Lewis’s conditions (summarized from *Convention* Chs. 1–2):  
  1. **Regularity in behavior**: Everyone conforms to abstaining noon–2 PM. *Satisfied*: All villagers adhere to the practice.  
  2. **Mutual expectations**: Everyone expects others to conform. *Satisfied*: Villagers expect universal abstinence and enforce it via disapproval.  
  3. **Conditional preference for conformity**: Given others’ conformity, each prefers to conform because deviation worsens outcomes. *Indeterminate*: Conformity avoids censure (supporting Owen), but villagers lack preference for the *practice itself* (supporting Nadia). Lewis allows sanctions as reasons (e.g., etiquette), but requires coordination payoffs (e.g., avoiding collision).  
  4. **Arbitrariness**: An alternative regularity could have served the same purpose. *Satisfied*: Any time window would function identically (as nothing is coordinated).  
  **Misstatements**:  
  - Nadia (Move 2) misstates the preference condition: Lewis requires preference *conditional on others’ conformity*, not a freestanding desire for the practice. This weakens her initial objection but not her core argument (see Move 6).  
  - Owen (Move 3) correctly notes the conditionality but underplays that Lewis ties “decisive reasons” to coordination equilibria (Ch. 1.5).  

  ---

  ### Move by move  
  **1. Owen: Clearly right**  
  He correctly applies Lewis’s four conditions: conformity, mutual expectations, sanction-avoidance as a decisive reason, and arbitrariness are explicit. His “decisive reason” (fear of censure) aligns with Lewis’s examples (e.g., politeness conventions). Error: He overlooks that Lewisian reasons typically stem from coordination *payoffs*, not just sanctions (weakening Move 5). Repair: Emphasize that censure functions *because* it enforces coordination—but here, no coordination exists.  

  **2. Nadia: Mistaken but pointing at something real**  
  She errs by ignoring conditionality (Lewis focuses on preference *given others’ actions*, not intrinsic desire for the practice). Yet she identifies a key gap: Lewis assumes conventions solve coordination problems with shared interest in *some* regularity. Here, no such interest exists. Repair: Specify that Lewisian preferences require a background coordination problem (e.g., avoiding conflict), absent in the village.  

  **3. Owen: Largely right**  
  Correctly reframes the preference condition as conditional: villagers *do* prefer conformity to deviation to avoid censure (Lewis p. 42: disapproval can motivate). Error: He conflates avoiding sanctions with achieving coordination. Repair: Grant that sanctions suffice for Lewis but note they presuppose a *coordination need*—here, censure enforces a phantom rule.  

  **4. Nadia: Even**  
  Right that Lewis emphasizes expectations of *behavior* (not attitudes) as primary reasons (p. 97). Sanctions are auxiliary. Error: Lewis explicitly includes “displeasure of others” as a valid reason (p. 44). Her distinction between norm and convention is valid but extratextual. Repair: Concede Lewis allows sanction-based reasons but argue they must serve coordination.  

  **5. Owen: Mistaken but pointing at something real**  
  Right that Lewis permits sanction-avoidance (e.g., etiquette). Error: Lewis still requires conventions to resolve coordination problems (pp. 24–25). Politeness conventions coordinate social interaction; the well practice coordinates nothing. Repair: Accept sanction-based reasons but insist they must solve a genuine coordination problem.  

  **6. Nadia: Largely right**  
  Correct that conventions are stable under arbitrariness-revelation (Lewis p. 76), while the village practice would collapse if beliefs corrected—exposing its lack of coordination function. Error: Stability isn’t a formal condition, so Owen technically wins on Lewis’s criteria. Repair: Highlight that Lewis *defines* conventions as solutions to coordination problems (Ch. 1), which this isn’t.  

  **7. Owen: Mistaken but pointing at something real**  
  Right that stability under belief revision isn’t a condition, and arbitrariness is satisfied. Error: “Serves identically” presumes a purpose, but the practice has none (unlike etiquette, which coordinates social expectations). Repair: Grant arbitrariness but stress Lewisian conventions require a *problem* to be solved.  

  **8. Nadia: Clearly right**  
  Correct that Lewisian conventions coordinate a shared interest (e.g., driving rules prevent crashes). The village “settles nothing,” making it a miscoordination (all prefer no practice). Her core insight: Lewis’s account assumes a preexisting coordination problem (p. 24), absent here. Error: None—this ties Lewis’s conditions to their theoretical purpose.  

  ---

  ### What both missed  
  1. **Lewis’s requirement of a “coordination problem”**: Both focus on conditions in isolation, but Lewis grounds conventions in recurring situations where agents have *common interest* in coordinating actions (Ch. 1). The village lacks this: no conflict arises if someone draws water at noon, only disapproval.  
  2. **The role of common knowledge**: Lewis requires agents to know others know the regularity (p. 52). Here, villagers *mis*believe others support the practice, undermining the mutual assurance central to conventions (e.g., driving relies on known shared incentives).  
  3. **Distinction between convention and norm**: Lewis distinguishes conventions (arbitrary solutions) from norms (sanction-driven rules). Both students blur this: Owen ignores that conventions need coordination payoffs; Nadia underestimates Lewis’s sanction tolerance.  

  ---

  ### Verdict  
  **Owen is more right on Lewis’s explicit conditions**, as the practice satisfies the four criteria (regularity, expectations, conditional preference via sanctions, arbitrariness). **Nadia is more right on the theoretical intent**: Lewis’s analysis presupposes conventions solve coordination problems, which this does not. The residue is **substantive**: whether Lewis’s conditions *imply* a coordination problem. Nadia’s functional view (conventions must sustain mutually beneficial order) better captures Lewis’s project, but Owen’s textual fidelity wins narrowly.  

  **Settling distinction**: Test a case where a pointless regularity *coordinates* something (e.g., everyone wears green hats to avoid fines, though hats serve no purpose). If sanctions alone suffice, Owen wins; if coordination payoffs are essential, Nadia wins. Here, the absence of *any* coordinated outcome favors Nadia.
