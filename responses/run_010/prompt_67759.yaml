  First, I must identify the tangled problems:
  - The sorites paradox (how imperceptible steps accumulate to visible change)
  - Measurement uncertainty (instrument's ±0.3 repeatability)
  - Operational vs ontological definitions of colour
  - The gap between administrative tolerances and physical reality
  - Epistemic limitations in quality control processes

  Neither names the core issue: that the master tile's colour isn't a fixed property but degrades over time even in the vault, and that the operational chain creates a new de facto standard.

  For the table adjudication:
