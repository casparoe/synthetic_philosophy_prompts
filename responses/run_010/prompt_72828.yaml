  The server placed the bill folder on the table and vanished. Maya watched her go, then pushed the folder towards Alex. "Right. Meal was good. Your turn to do the honours?"

  Alex opened it, glanced at the total, then slid a card onto the tray. "Done. Though, you know the drill – the twelve percent is house revenue. So, cash for the team?" He gestured subtly towards the busy floor staff.

  Maya sighed. "Alex... we've talked about this. I'm not doing it."
  "You are serious." Alex leaned back, studying her. "The 'service charge' is baked in, yes, but it doesn't *go* to service. That twelve percent is just padding the owner's margin. The staff live on the extras. You know that."
  "Exactly my point!" Maya kept her voice low but firm. "It's a scam. The owner gets their inflated price *and* dodges paying a living wage by making customers feel guilty. Why should *I* subsidise their greed? Back home, this would be considered offensive – implying the owner can't or won't pay properly."

  "It's not 'back home', Maya. You're here for months. You're eating in their restaurant, using their service. The staff," Alex nodded towards a young man clearing a nearby table, "they clocked in today knowing their pay hinges significantly on people like us leaving a bit extra. It’s how the system *functions* here, however flawed."

  "Functions?" Maya leaned in. "It functions *because* people like you prop it up! My refusal doesn't cost the owner a cent. They already got their inflated price plus the mandatory twelve. All I'm refusing is to top up the wages they *should* be paying. How is that *me* harming the server? It's the owner's responsibility, full stop."

  "But you *are* choosing to participate in the system," Alex countered. "You walked in, ordered food knowing the economic reality underpinning this place – that the menu price doesn't cover fair compensation. By participating, you enter a local convention that fills that gap. Morality might demand fair pay, but *this* convention settles *how* it gets delivered here and now. Ignoring it isn't principled resistance; it’s stiffing the person who just served you."

  "Hold on," Maya held up a hand. "You say the convention 'settles' how fair pay gets delivered. But why does *this* convention settle it for *me*? My own background settles it differently: fair pay is the employer's burden. Why isn't my 'convention' just as valid here? Why does the local one automatically win because I crossed a border?"

  "Because context matters!" Alex's tone intensified slightly. "You're *in* the context. The staff member serving you operates under an expectation formed *by* this local convention. Your home convention doesn't exist for them. They served you anticipating the local norm applies. Your principle, however noble, lands as a broken promise *they* didn't agree to. It’s not abstract harm; it’s *their* expected income vanishing because you imported an invisible rule."

  "So, obligation is just... expectation?" Maya pressed. "If they expect it, I owe it? What if they expected twice as much? Does might-makes-right apply? And what about those 'cold looks' you mentioned last time, or the 'worse table'? If the only reason to comply is avoiding social sanction, that's not morality, that's coercion dressed as custom."

  Alex paused. "The sanctions are evidence of the norm's strength, sure. But the *source* of the obligation isn't just the sanction. It's... the dependency created by participating in a specific cooperative practice. You benefit from their service within *this* specific structure. Withdrawing your part of the understood exchange – the tip – exploits their labour without fulfilling your end of the local bargain. It’s a failure of reciprocity within *this* institution."

  "The 'bargain' is rigged!" Maya insisted. "The only reason the 'dependency' exists is because the owner created it! My 'end' should be paying the menu price. Full stop. Expecting me to also cover payroll because the owner won't... that feels like rewarding extortion. I refuse to be complicit."

  "Complicit with the owner? Maybe," Alex conceded, the first real shift. "The system *is* flawed. Deeply. But your refusal doesn't touch the owner. It only touches Maria," he nodded towards their server heading towards the kitchen, looking tired. "You're making Maria bear the entire cost of your protest against a system she didn't create and can't change tonight. Is that really where your principle should land? On her shoulders?"

  Maya looked at Maria’s retreating back, then down at the table. "That’s... that's the hardest part," she admitted quietly. "Knowing it might be Maria who feels the pinch. But if everyone stopped propping it up..."

  "Agreed!" Alex cut in. "But Maya, you're not 'everyone'. You're one person, here temporarily. Organizing a boycott? Fantastic. Writing op-eds? Go for it. But *tonight*, at *this* table, after *this* meal? Withholding the tip isn't a boycott. It's just... not paying the understood cost of the service *you* just consumed within *this* specific, operating framework. It harms Maria without advancing systemic change."

  "Perhaps," Maya said slowly. "But contributing *also* feels like endorsing the framework. Like saying this is acceptable."

  "It’s not endorsing the framework. It’s acknowledging the immediate reality *within* it. You can hate the game and still not punish the player trapped playing it by the rules everyone else here follows."

  The silence stretched. The server returned with Alex's card and receipt. "Everything settled?" she asked politely, her eyes flicking briefly to the empty space on the tray where cash might have been.

  "All settled, thank you, Maria. The lamb was perfect," Alex said warmly. Maria smiled faintly and left.

  Maya watched her go, then turned back to Alex. "Okay. Point taken about Maria. Tonight." She opened her wallet slowly. "But only because it’s her. Not because I accept the convention as legitimate. And I *will* find a way to argue against the system itself while I’m here."

  "I expect nothing less," Alex said, a slight smile touching his lips. "But tonight?" He gently pushed her wallet hand down onto the table. "Too late. I covered Maria. Call it... resident privilege. Or maybe just accepting my own complicity for now." He stood up. "Ready?"

  Maya looked at his hand on hers, then at the door Maria had disappeared through. She left her wallet closed. "Ready." She stood, the weight of the unresolved structure heavy between them, but the immediate, personal debt acknowledged.
