prompt: |-
  You are a philosopher of science specializing in the epistemology of the historical disciplines, equally at home with a methods paper in archaeology and with one on confirmation. Please think carefully, and sketch the space of candidate principles for a few sentences before committing to one.

  I retired four years ago after a career in experimental physics, and I have since been reading about how archaeologists claim to know anything, together with the long quarrel between the processualists and their critics. I find that I hold firm verdicts on particular cases and have no idea what rule generates them. All of the following are arrived at by gut rather than by argument.

  1. Thirty fired-clay figurines from a single site all depict an animal that had been locally extinct for a thousand years. Verdict: license to say something about belief or story, not merely about local fauna.
  2. In one village, every house doorway falls within four degrees of the same azimuth. Verdict: license to infer a shared building template; no license to infer a belief about the heavens, and none to infer a priesthood.
  3. Stone weights from six sites in one valley fall on the same five values. Verdict: license to infer a shared standard — an institution — even though nothing at those sites represents it.
  4. One burial out of four hundred carries copper ornaments. Verdict: no license to infer hereditary rank. The same excess repeated in each of six successive burial phases, in a row of adjacent graves: license.
  5. A tool type occurs only in adult male graves. Verdict: license to speak of mortuary practice and of a category of person; none about who used the tool in life.
  6. Every house in a village has a floor of burned grain, all of one date. Verdict: license to infer a single coordinated event; none to choose between attack and rite.
  7. A pottery motif appears in one region, then eight hundred kilometres away two centuries later. Verdict: no license at all — neither migration nor transmission of belief.

  Two pairs defeat me. Cases 2 and 3 are both unrecorded regularities, yet I read an institution out of one and refuse even a belief in the other. Cases 1 and 7 both involve representational objects, yet I let one carry belief and let the other carry nothing. My own tentative rule is that the difference turns on whether the people who produced the pattern could have been unaware of it, but that seems to give the wrong answer in case 6, and perhaps in 5 as well.

  What I want is a principle, or a small explicitly ranked set of them, stated precisely enough to be falsified, that reproduces these verdicts — or most of them. For each clause, name the case that motivates it. Then apply the result to three cases I have not listed: pollen concentrated in a temple precinct, a vessel mended through drilled repair holes, and a substantial building left unfinished. Say what each licenses. Finally, state plainly which of my seven verdicts your principle cannot accommodate, and whether I should abandon the verdict or complicate the principle.
reasoning: |-
  Hmm, the user presents a fascinating challenge in the epistemology of archaeology. As a retired experimental physicist, they've clearly applied their analytical mindset to archaeological reasoning, identifying seven intuitive verdicts about inference from material remains and two pairs that trouble them. They seek a falsifiable principle that systematizes their judgments.

  First, I need to map their intuitions: 
  - Pattern recognition (cases 2,3,5) shows they distinguish between behavioral regularities (building alignment) and institutional ones (standard weights)
  - Representational artifacts (cases 1,7) reveal their distinction between local symbolic persistence (figurines) and distant similarities (pottery motif)
  - Contextual repetition matters profoundly (case 4 burial phases)
  - They reject overinterpretation (no priesthood inference from doorways, no tool-user identity from grave goods)

  Their tentative "awareness criterion" fails with the burned grain floors (case 6) - people couldn't be unaware of burning, yet ritual/warfare remain indistinguishable. 

  I propose the Material Practice Principle: infer only what the pattern materially necessitates as intentional social action. This has three ranked clauses:
  1. Pattern Embodiment: Does the pattern require coordinated action? (Standard weights case 3: yes; Door alignment case 2: no)
  2. Contextual Binding: Is it embedded in repeated social contexts? (Repeated elite burials case 4: yes; Single burial: no)
  3. Representational Fidelity: For symbols, does form constrain meaning? (Local figurines case 1: yes; Distant pottery case 7: no)

  For their new cases:
  - Temple pollen: licenses ritual activity (clause 3) but not specific deities
  - Drilled repair: licenses economizing behavior (clause 1) but not attachment
  - Unfinished building: licenses interrupted intention (clause 1)

  The principle struggles with case 5 (tools in male graves) - it can infer mortuary categories but not life practices, as the latter isn't materially necessitated. They should keep this verdict, as inferring life practices from grave goods commits the "Pompeii premise" fallacy.

  The physicist's demand for falsifiable principles is refreshing. By making archaeological inference rules explicit, we honor both scientific rigor and historical particularity.
answer: |-
  Here is a principled framework distilled from your intuitions, designed to be falsifiable and explicit. After analyzing your cases, I propose the **Material Practice Principle (MPP)** with three ranked sub-principles:

  ### The Material Practice Principle (MPP)
  **Core Axiom:** *Inferences must be grounded in the material necessity of the pattern.*  
  Licensed claims are restricted to social practices that directly manifest in the physical evidence without requiring unobserved cognitive intermediaries.  

  **Ranked Sub-Principles:**  
  1. **Pattern Embodiment (Highest Priority):**  
     *Does the pattern require intentional human coordination to exist?*  
     → **License:** Only if the pattern *could not arise* from individual, uncoordinated actions.  
     *Motivated by:* Case 3 (weights) vs. Case 2 (doorways). Weights necessitate a shared standard to achieve identical values; door alignment could result from individual builders using a common landmark (e.g., a mountain).  

  2. **Contextual Binding (Medium Priority):**  
     *Is the pattern embedded in repeated, socially significant contexts?*  
     → **License:** Requires recurrence across distinct events/units.  
     *Motivated by:* Case 4 (burials). A single elite burial may reflect idiosyncrasy; recurrence across phases implies institutionalized social structure.  

  3. **Representational Fidelity (Conditional Priority):**  
     *For symbolic artifacts, does the form constrain plausible meaning within its context?*  
     → **License:** Only if the representation is locally anomalous or contextually stabilized.  
     *Motivated by:* Case 1 (figurines) vs. Case 7 (pottery motif). Figurines depict locally extinct fauna—this *mismatch* licenses belief/stories. Distant pottery motifs lack contextual stabilization (could be independent invention/diffusion of form, not meaning).  

  ---

  ### Application to New Cases  
  1. **Pollen concentrated in a temple precinct:**  
     → **License:** Ritual activity (MPP-Contextual Binding: recurrent practice in a designated space).  
     → **No license:** Specific deities worshipped (MPP-Representational Fidelity: pollen doesn’t encode mythos).  

  2. **A vessel mended through drilled repair holes:**  
     → **License:** Economizing behavior/value attribution (MPP-Pattern Embodiment: repair requires intentional skill).  
     → **No license:** Sentimental attachment (MPP-Representational Fidelity: repair is functional, not symbolic).  

  3. **A substantial building left unfinished:**  
     → **License:** Sudden disruption (e.g., conflict, resource collapse) (MPP-Pattern Embodiment: incompletion necessitates interruption of coordinated labor).  
     → **No license:** Religious taboo (MPP-Representational Fidelity: no symbolic evidence for cause).  

  ---

  ### Incompatibility and Resolution  
  **Your verdict MPP cannot fully accommodate:**  
  - **Case 5 (tool type only in adult male graves):**  
    MPP licenses "mortuary practice" (Contextual Binding) and "category of person" (Pattern Embodiment: segregation implies social coordination). However, your denial of "who used the tool in life" *is justified under MPP*, as grave goods are funerary practices—not direct proxies for living use (Representational Fidelity: deposition ≠ use).  
    → **Resolution:** Uphold your verdict. MPP *supports* it by requiring material necessity: grave context binds inference to mortuary behavior, not lifetime activities.  

  **Weakness in your original tentative rule:**  
  Your "awareness criterion" fails Case 6 (burned grain floors): builders couldn’t be unaware of burning, yet MPP correctly denies license to choose between attack/rite because *both* explanations materially necessitate coordination (Pattern Embodiment). The cause is underdetermined.  

  ---

  ### Summary  
  **MPP Systematizes Your Verdicts By:**  
  - Prioritizing *material constraints* over cognition (e.g., institutions require embodied coordination; beliefs require contextual anomaly).  
  - Demanding recurrence for social structures (e.g., hereditary rank).  
  - Rejecting "meaning" without contextual dissonance (e.g., distant pottery motifs).  

  **Falsifiability Test:**  
  MPP would be falsified if a pattern meeting all three criteria (e.g., recurrent, coordinated, contextually anomalous) were shown *not* to correspond to a social practice (e.g., weights standard proven random). Your cases align with MPP because they isolate archaeology’s strength: inferring *practices*, not minds. Where practices imply cognition (e.g., Case 1), it’s via material incongruity—not presumption.
