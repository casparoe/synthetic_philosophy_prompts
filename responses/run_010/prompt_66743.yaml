  For the plan: Start directly with a dual case comparison (infectious disease vs psychiatric category) to make the "awareness" point visceral. Use ADHD as the live example - current enough for nurses, fluid enough to show looping, and less charged than personality disorders. Present Hacking's mechanism as neutral feedback (not critique of psychiatry). Explicitly refuse ontology debates ("what's real") to avoid rabbit holes.

