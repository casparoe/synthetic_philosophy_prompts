  We are to adjudicate a debate between Ravi and Ines about the coherence arguments for expected utility theory, specifically in the context of an agent whose preferences violate the independence axiom (like in Allais paradox). We have four moves, and we must rate each from clearly mistaken to clearly right with a brief justification. We must also note when a move depends on something unestablished. Finally, we decide who is more right overall.

