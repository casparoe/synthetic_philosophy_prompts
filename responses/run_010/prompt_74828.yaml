     - But there is a leap: the commitment might not be to the EU choice per se but to a choice that avoids the cycle. It might be that the agent commits to a plan that she would not have chosen in a one-shot scenario. However, in the context of the money-pump setup, the commitment is to the choice that avoids the money pump, which in the independence violation example might be the choice that the EU maximizer would make. 
     - Also, Ravi says: "a preference you would pay to be rid of cannot count as rational." This is an interesting point. If an agent is willing to pay to avoid having to make choices that lead to the pump, then that suggests that the agent recognizes that her own preference pattern is problematic. 
