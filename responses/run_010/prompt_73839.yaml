answer: |-
  Good morning. We stand here in the cold, as we do each November, to mark the lives of twelve of our own. Twelve names, just spoken aloud. Twelve lives ended because they chose to hide a Jewish family and print a small, defiant newspaper in a bakery cellar not far from here. Their names are in the programme you hold. They are ours.

  That programme says they were “ordinary people, just like you and me.” It’s meant as a tribute. And it is true, in a way. They weren’t figures from myth. They lived on these streets. They worked ordinary jobs – bakers, shopkeepers, clerks, a schoolteacher. They knew the price of bread, worried about the rent, argued with neighbours. They were of this place, woven into its daily fabric.

  But sitting with their stories for twenty years in the city archive, I find myself pausing at that word: “ordinary.” What does it mean, truly, in the shadow of what happened? Because the great horror of those years wasn’t primarily built by monsters. It was assembled piece by piece by the quiet machinery of the everyday. It was the small, unthinking nods, the convenient silences, the thousand tiny adjustments people made just to get through the week. *That* ordinariness – the refusal to see, or to act upon seeing – was the engine. Compliance became the default setting.

  So, if we call *these* twelve “ordinary,” like everyone else, what does that leave us with? Does it quietly suggest that anyone standing here today, in their place, might have done the same? Or does it risk shrinking their choice down to something unremarkable, just another Tuesday in the life of an ordinary citizen?

  Neither feels right. Neither honours the weight of what they did. They sheltered lives at mortal risk. They printed words forbidden under penalty of death. And they paid for it. This wasn’t Tuesday.

  Perhaps we need to look deeper into that ordinariness. Not to erase it, but to find a different current within it.

  One of the twelve was a woman named Helga Schiller. Her granddaughter wrote to the paper recently. She didn’t want her grandmother made into a saint. Helga, she told us, was stubborn. She had a temper. She owed money. She’d been locked in a feud with the butcher next door for over a decade. Hardly the serene image of pure virtue. And when asked, after the war, if she’d been brave, Helga answered simply that she couldn’t bear the thought of herself afterwards. She couldn’t stomach the person she would have become if she’d looked away.

  That’s a different kind of refusal. It doesn’t gleam with heroism. It’s rooted in something quieter, more personal: an inability to betray her own sense of self. Not a grand, abstract moral principle held higher than anyone else’s, but a visceral, inner limit. *I cannot do this and live with myself.* It’s the consequence of a habit we rarely talk about: the habit of thinking. Of carrying on an argument with oneself. *Is this right? Can I accept this? How will I face myself tomorrow?* That internal conversation, kept alive even when it’s dangerous, can forge a conscience not as a shining armour, but as a spine. A refusal to bend.

  Think of that cellar beneath the bakery. It’s still there, beneath a mobile phone shop now. Down there, they assembled their little paper. Three hundred copies, over eleven fragile issues, before they were found. Not a grand manifesto shaking the nation, but words typed in secret, passed hand to hand. Words that said: *This is wrong.* Words that broke the suffocating silence. It was an act born of that same inner necessity: *We cannot be silent. We cannot pretend.*

  This, perhaps, is the third meaning we can find in “ordinary.” Not that they were like everyone else in their choices – because they weren’t. Not at all. But that the *source* of their refusal wasn’t some superhuman virtue bestowed only on heroes.

  It resided in the very human capacity for self-reflection. In the stubborn, sometimes messy, utterly human refusal to become someone they despised. Their ordinariness contained within it the potential for this unyielding inner honesty. It was ordinary people, thinking their own thoughts, holding themselves to their own account, who found they could not comply. They couldn’t dissolve themselves into the unquestioning mass. Their ordinariness became the ground from which an extraordinary *No* could grow.

  To the students here from the Gymnasium, tasked with thinking about what this means for you: Look around. This square. These buildings. Ordinary places. The people who lived here then faced choices we can barely imagine. But the question of who you are willing to be – the conversation you have with yourself about what you can live with – that isn’t confined to extraordinary times. It happens every day. It’s the most ordinary, and the most vital, thing we do. Pay attention to that conversation.

  So, we honour Helga Schiller, Johann Weber the baker who risked his shop, and the ten others whose names we heard. Not as flawless saints, but as complex, flawed, entirely human individuals. People who, faced with the crushing weight of the ordinary machinery of compliance, listened to that inner argument. Who found they could not look away. Who acted, ultimately, because they could not bear the alternative version of themselves. Their courage wasn’t the absence of fear or fault, but the presence of that unbreakable inner compass, forged in the quiet furnace of their own thoughts.

  They were ordinary. And that is precisely what makes their choice, their refusal to abandon themselves, resonate so profoundly. It shows us what can lie within the scope of a human life lived with eyes wide open to one's own conscience.

  Spine: Their ordinariness was the soil from which grew an extraordinary refusal to betray their own selves, proving that courage can be the quiet consequence of relentless self-honesty.
