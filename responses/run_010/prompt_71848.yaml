  For the scoring system, I'll structure it as four sequential gates: infection test → sincerity proxies → accessibility → value alignment. Each must pass to continue. The opera example will fail at accessibility (baffling act), while the hospice choir stumbles on infection (limited reach) but wins on value alignment. 

