prompt: |-
  I'm an engineer at a consumer fintech app — peer transfers, budgeting, a debit card. Anything that touches user controls, defaults, or a model decision has to go through our product goverance review, which is basically one person, Mara, plus a lawyer who mostly doesn't talk. I've been sitting in on these for about a year and I've been keeping a list of her calls, mostly because I keep getting told my feature is coercive and I genuinely cannot reverse-engineer what she means by that.

  Her calls so far, in rough order:

  1. Killed a redesign that moved cancel-subscription three taps deeper. Her note, paraphrased: the option still existed, we just made it expensive.
  2. Approved Focus Mode, which blocks all notifications for a window the user picks and cannot be overridden until the window ends. You literally cannot turn it off mid-window. She waved it through.
  3. Approved auto-enrolling people in round-up savings, one tap to leave, no penalty.
  4. Killed basically the same round-up feature six months later when she noticed we could change the match percentage mid-year without telling anybody. Identical screens, identical one tap to leave. She said the taps were not the problem.
  5. Approved a hard transfer cap with no override, because a regulator set it and there's a published appeals route.
  6. Killed an identical hard cap that our own risk team wanted, no appeals path. She said the number was the same and she didn't care about the number.
  7. Approved deleting see-whos-online entirely, so nobody has the option at all anymore, after research showed it was enabling stalking-ish behavior.
  8. Killed a purely informational dashboard — no defaults changed, nothing blocked, every option still open — because which cards each user saw came from a model we retrained weekly and nobody could explain any one user's view.

  Thursday's is adaptive spend limits. The model moves your daily card limit up and down on its own. Nothing new gets blocked, all your existing options stay, there's a screen showing your current limit, you can't set the limit yourself but you can message support and they'll usually change it within a day or two, and the model retrains monthly so limits drift around some.

  My gut says she kills it and I can't say why in a meeting. My "is there a toggle" theory obviously dies on 4, 6 and 8, since none of those were about toggles. And 2 and 7 look like she's fine removing options, so "don't remove options" dies too. A friend who did a poli-sci degree says there's a whole literature on freedom as non-interference versus freedom as non-domination and I'm fairly sure that's the neighborhood she lives in, but please don't just explain the labels at me, I can read a wikipedia page for that. What I actually want:

  - the two or three candidate rules that fit all eight calls. there has to be more than one, so tell me which calls each rule is leaning on and which calls each one struggles with;
  - what each of those rules predicts for Thursday, plus your best single guess at her verdict and a reason I could say out loud without sounding like I'm bluffing;
  - which of the eight is the closest analog to adaptive limits, and exactly where the analogy starts to break down;
  - one more hypothetical case I could float past her that would split the candidate rules — something they genuinely disagree about, not something she'd rule the same way on under any of the readings;
  - and if you think some of her calls are just flat inconsistent, say which one she'd have to give up and which rule survives the deletion.

  Keep it concrete. I don't need a philosophy lecture, I need to know what to build.
reasoning: |-
  Okay, let me tackle this problem step by step. The user is an engineer at a fintech app who's struggling to understand Mara's product governance decisions. They've listed eight past calls and need help predicting her verdict on the upcoming adaptive spend limits feature. 

  First, I notice Mara clearly isn't operating on simple rules like "always have toggles" or "never remove options" - cases 4,6,8 break the toggle theory, while 2 and 7 show she's fine removing options sometimes. 

  The key seems to be about control and predictability. Looking at the pattern: 

  When she approved things:
  - Focus Mode (2): User sets the window themselves upfront
  - Round-ups (3): Easy one-tap opt-out
  - Regulator cap (5): External rule with appeals process
  - Removing "see who's online" (7): Eliminating a harmful feature entirely

  When she rejected:
  - Hidden cancellation (1): Making desired action harder
  - Adjustable round-ups (4): Hidden parameter changes
  - Internal risk cap (6): No recourse
  - Opaque dashboard (8): Unexplainable AI decisions

  For adaptive spend limits, the worrying aspects are:
  - Users can't set their own limits (only request changes)
  - Model retrains monthly causing unpredictable drift
  - Changes happen without user consent

  The closest analog is actually case 8 (killed dashboard) because both involve opaque models making decisions. The difference is the dashboard was informational while this controls spending ability - which makes it worse.

  I'd predict rejection because:
  1) No user control at decision point (model changes limits without consent)
  2) Changes are unpredictable (monthly retraining causes drift)
  3) Appeal process is slow (day-long support delay)

  If I were to test this, I'd propose a hypothetical: "What if we let users freeze the limit for 3 months?" This splits the rules - structural control advocates might accept it, while predictability purists would still object to monthly changes.

  Case 4 (adjustable round-ups) might be inconsistent since the UI didn't change but the backend did. If we ignore that case, the predictability rule becomes cleaner.

  Most importantly, I need to give concrete advice: To get this approved, either let users set minimum limits or freeze changes for fixed periods. Make the model explainable per-user. That would address the core control and predictability concerns.
answer: |-
  Based on your case history and eliminating inconsistent theories (toggles, option removal), here's a breakdown of Mara's likely decision framework, Thursday's prediction, and actionable tests:

  **Candidate Rules (All Fit Your 8 Cases):**  
  1. **Structural Control:** Users must have *meaningful, timely agency* over core functions (money, access, subscriptions). Not just theoretical "options" – the *architecture* must enable practical control.  
  2. **Predictable Environment:** Users must understand the "rules of the game." Hidden variables, unexplained changes, or opaque overrides violate trust, even if UI appears unchanged.  
  3. **No Hidden Leverage:** The company cannot retain non-transparent power to unilaterally alter value/access without consent or due process.  

  | **Case** | **Structural Control** | **Predictable Environment** | **No Hidden Leverage** |  
  |----------|------------------------|------------------------------|------------------------|  
  | 1. Deep Cancel | ❌ Made action *practically* inaccessible | ✅ | ✅ |  
  | 2. Focus Mode | ✅ User sets window *upfront* | ✅ Clear upfront rules | ✅ No company override |  
  | 3. Round-Up (Approved) | ✅ 1-tap opt-out | ✅ Fixed rules | ✅ Fixed terms |  
  | 4. Round-Up (Killed) | ✅ 1-tap opt-out *still existed* | ❌ Hidden % change | ❌ Co. changed value secretly |  
  | 5. Regulator Cap | ✅ Appeals = due process | ✅ Published rule | ✅ External authority |  
  | 6. Internal Cap | ❌ No recourse path | ✅ Known rule | ❌ Co. imposed arbitrary power |  
  | 7. Remove Stalking | ✅ Harm reduction > control | ✅ Clearly gone | ✅ Eliminated risk vector |  
  | 8. Opaque Dashboard | ❌ Unexplained filtering | ❌ Model = black box | ❌ Co. controls visibility secretly |  

  **Prediction for Adaptive Limits (Thursday):**  
  - **Structural Control:** ❌ User can't set/modify limits directly; support delay (1-2 days) blocks timely agency.  
  - **Predictable Environment:** ❌ Limits drift monthly via opaque model; user can't anticipate changes.  
  - **No Hidden Leverage:** ❌ Company controls model/retraining, altering access without consent.  
  **Verdict:** **Killed.** Reason to state: *"Users lack direct control over their spending capacity, and the unpredictable, unexplained changes create a trust gap. Support delays aren't equivalent to real-time agency."*  

  **Closest Analog & Breakdown:**  
  - **Case 8 (Opaque Dashboard)** is the closest. Both use black-box models controlling user access/visibility without explanation.  
  - **Breakdown:** The dashboard was *informational* (users could ignore it); adaptive limits *control spending ability* (direct financial impact). This makes *Structural Control* more critical here.  

  **Hypothetical to Split the Rules:**  
  **Scenario:** *"Auto-apply fraud refunds <$50 with no notification. User can manually reverse it later if wrong, but the money is moved instantly."*  
  - **Structural Control:** ❌ Funds moved without consent; reversal is reactive, not proactive.  
  - **Predictable Environment:** ✅ Policy is clear: all <$50 refunds auto-applied.  
  - **No Hidden Leverage:** ✅ Rule is transparent, no hidden variables.  
  **Split:** Predictability rule approves; Structural Control kills it.  

  **Inconsistency & Survivor:**  
  - **Case 4 (Round-Up % Change)** is the weakest. If she approved identical screens *knowing* backend could change, but killed it later on principle, it’s inconsistent with **No Hidden Leverage**.  
  - **Surviving Rule:** **Structural Control** holds if we assume she overlooked the backend initially. Cases 1,2,3,5,6,7,8 all align with it.  

  **What to Build for Approval:**  
  1. **User-set floor/ceiling:** Allow "Never lower than $X" or "Cap at $Y" to guarantee agency.  
  2. **Change ratification:** Model *suggests* new limits; user must approve via notification.  
  3. **Freeze function:** Let users lock limits for 3-6 months, overriding retraining.  
  4. **Immediate override:** Temporary limit boost/cut via slider (no support ticket).  

  **TL;DR:** Mara prioritizes *user sovereignty* – not just options, but *architected control*. Adaptive limits fail because the model dominates spending decisions without consent. Add user-veto power or fixed guardrails to pass. Test with the fraud refund hypothetical to confirm her stance.
