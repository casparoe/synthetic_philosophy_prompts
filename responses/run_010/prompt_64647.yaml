answer: |-
  Here’s a stress-test of your exposure-based subsidiarity thesis, mapping vulnerabilities from fatal to merely awkward. I begin with a brainstorm of candidate defeaters, then address your five queries systematically.

  **Brainstorm of Candidate Defeaters:**
  - **Empirical:** Tax havens (export regulatory costs, thrive); Swiss cantons (high exposure, high performance); EU structural funds (redistribution without exposure loss); Chinese special zones (export pollution, high growth).
  - **Theoretical:** Tiebout assumes perfect exposure; Oates’ Decentralization Theorem ignores cost-export tools; Olson’s equivalence as synonym; market-preserving federalism prioritizes competition over exposure; joint-decision traps worsen with centralization.
  - **Methodological:** Exposure re-specification as tautology; spillovers infinitely elastic; no counterfactual for "loss of performance."
  - **Normative:** Justifies centralization overriding local democracy; indifferent to self-determination; no limit on central power if spillovers asserted.
  - **Predictive:** Fails to explain identity-driven devolution success (e.g., Quebec, Scotland); silent on cultural policy decentralization.

  ---

  **1. Damaging Empirical Findings**  
  **Fatal:** Jurisdictions that *systematically export costs yet outperform exposed peers* on governance metrics.  
  - **Example:** Offshore financial centers (e.g., Cayman Islands) exporting regulatory costs to global markets while maintaining high GDP/capita, stability, and service delivery. If such entities govern *better* than similarly sized exposed jurisdictions (e.g., high-debt municipalities), it directly challenges necessity of exposure for performance.  
  - **Damaging Mechanism:** Shows cost-export as compatible with efficiency—undermining your claim that exposure is the "only reliable substitute for a supervisor."  

  **Awkward but Not Fatal:** Cases where exposure and competence align *yet performance fails* due to capacity constraints (e.g., impoverished municipalities bearing full costs of water management but failing). This questions sufficiency, not necessity, of exposure.  

  **2. Theoretical Load-Bearing Structures**  
  **Fatal Dependencies:**  
  - **Olson’s Fiscal Equivalence:** If your view is merely a restatement ("authority where costs fall" = "jurisdiction coterminous with collective good"), it collapses into relabeling. Your novelty requires proving that "feedback closure" adds explanatory power beyond Olson—e.g., predicting *how* exposure alters incentives, not just matching scales.  
  - **Unqualified Tiebout:** Tiebout assumes full exposure (voting with feet = costs internalized). If real-world Tiebout sorting works *without* perfect exposure (e.g., gated communities exporting crime costs but thriving), your thesis loses unique grounding.  

  **Ambiguous Theoretical Partners:**  
  - **Market-Preserving Federalism (MPF):** Cuts *against* you if MPF’s competitive decentralization (e.g., China’s growth) succeeds *despite* systematic cost-export (pollution, labor exploitation). Supports you if MPF only works when exposure is enforced (e.g., no-bailout clauses).  
  - **Joint-Decision Traps:** Supports your view (centralization traps worsen when costs are exported) but also undermines it: if centralized solutions *fail* even when internalizing costs (e.g., EU climate policy gridlock), exposure alone is insufficient.  

  **3. Concessions vs. Dismissals**  
  A committed defender would:  
  - **Concede:** That exposure is *insufficient* without capacity (e.g., bankrupt Detroit fully exposed but failing). Capacity is a prior condition.  
  - **Concede:** That identity arguments *can* align with exposure (e.g., national groups internalizing costs via solidarity), but are not necessary.  
  - **Dismiss:** Identity-based devolution successes (e.g., Catalonia) as irrelevant—your thesis is about functional performance, not legitimacy.  
  - **Dismiss:** "Local knowledge" arguments as secondary: even with perfect knowledge, cost-export breaks feedback.  

  **4. Unfalsifiability Risk**  
  **Verdict:** The criterion is *currently unfalsifiable* but *not fatally so*.  
  - **Risk:** Any observed centralization can be retrofitted to "discovered spillovers," any decentralization to "localized costs." This mirrors public choice critiques of Pareto efficiency.  
  - **Salvageability:** Requires *ex ante* operationalization:  
    - Define measurable thresholds for "cost-export" (e.g., >20% fiscal externalities?);  
    - Specify *which* costs matter (fiscal? social? intergenerational?).  
  Without this, the thesis is a tautology—but with it, testable (e.g., "regions with cost-export >X% under decentralized rule will underperform"). For a normative/theoretical thesis, this is tolerable if made explicit.  

  **5. Discriminating Predictions**  
  Your view uniquely predicts:  
  - **Centralization of financial regulation:** If local banks’ risks trigger central bailouts (cost-export), exposure demands *removing* their autonomy (e.g., post-2008 EU banking union). Moral/localist subsidiarity opposes this.  
  - **Decentralization of land use:** Zoning decisions (noise, congestion) expose locals—so even in identity-heterogeneous cities (e.g., Brussels), your view demands hyper-local control. Rival accounts may prefer metropolitan governance.  

  ---

  **Ranked Defeaters:**  
  1. **Fatal:** Empirical cases of high-performing cost-exporters (e.g., tax havens). *Why fatal:* Directly refutes necessity of exposure for performance.  
  2. **Fatal:** Theoretical collapse into Olson’s equivalence. *Why fatal:* Eliminates novelty; reduces to relabeling.  
  3. **Serious (Potentially Fatal):** Unfalsifiability. *Why serious:* Undermines empirical credibility; but fixable via operationalization.  
  4. **Awkward:** Exposure-performance failures (capacity gaps). *Why awkward:* Challenges sufficiency but not core mechanism.  
  5. **Awkward:** Normative implications (overrides democracy). *Why awkward:* Politically contentious but irrelevant to functional claim.  

  **Conclusion:** The position is **moderately insulated** against traditional subsidiarity critiques but **vulnerable to functional redundancy and empirical counterexamples**. Its insulation is a **defect** if operationalization fails, as it risks becoming an ex-post rationalization for power shifts. Strength lies in refocusing debate on incentives—but only if anchored to testable mechanisms.
