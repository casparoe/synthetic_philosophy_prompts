answer: |-
  ## Commencement Address: The Lines We Draw

  Good morning. Graduates: look around you. These faces—relieved, proud, maybe a little bleary-eyed—they represent an achievement measured not just in exams passed, but in nights studied, anxieties faced, and a fundamental shift in how you see the human condition. You didn’t just learn medicine; you learned *through* medicine. And today, you step across a line you’ve spent years approaching: from student to physician.

  Medicine draws lines constantly. Healthy or sick? Treat or observe? Necessary or optional? We draw these lines to make sense of complexity, to allocate care, to define our purpose. But how we draw them... that’s where the map gets interesting. And it matters profoundly for the people who trust you with their lives.

  Consider a simple biological fact. Some people carry a common hereditary variant affecting an enzyme crucial for breaking down alcohol. For them, even one drink triggers an immediate, unpleasant reaction: intense flushing, nausea, a racing heart. It’s a clear biological difference, measurable, inherited.

  Now, picture two people with this variant. The first works in international finance. Deals are sealed, relationships built, careers advanced over long dinners and many drinks. Refusing a drink isn't merely awkward; it carries real professional cost, isolation, potentially stalled progress. For this person, that biological difference isn't just a quirk; it actively cuts them off from pathways essential to their work and social standing. It *disables* them in a specific, demanding context.

  The second person lives in a community practicing a faith that strictly prohibits alcohol. Drinking isn't just avoided; it’s culturally irrelevant, never expected, never offered. For them, the same biological difference causes no reaction at all, because the trigger simply doesn't exist in their world. It doesn’t impede anything they need or want to do. It might as well not be there.

  Here’s where the lines diverge. One perspective—widely held and rigorously argued—sees disease fundamentally as a biological malfunction. It asks: Is this system statistically performing below the typical range for this age and sex? Is there a measurable, internal deviation from a species-typical norm? For both individuals above, the answer is the same: yes. The enzyme isn’t functioning typically. The resulting toxic buildup is a biological fact. On this view, the differing social costs are secondary; the disease label rests on the biological dysfunction itself. Values come in later, deciding *which* dysfunctions we prioritize for treatment or resources.

  Another perspective—one I find compelling—sees dysfunction as inherently tied to the life being lived. It argues that "normal function" only makes sense in relation to a specific context, a specific set of expectations and demands placed upon a person. Function *for what*? A condition becomes a disease not simply because biology deviates, but because that deviation, *in that person’s specific circumstances*, significantly cuts down what they can do or be. On this view, the first person, struggling in a drinking-centric career, might indeed have a condition warranting the disease label due to the harm it causes *in their world*. The second person, in their context, likely does not. The biology is identical; the lived impact is not. The disease classification depends on the interaction between the biology and the circumstances. [*Pause*]

  Of course, one might counter my favored view: Doesn't this open the door to a society simply lowering its expectations and declaring everyone healthy? It’s a serious point. And it stands.

  Graduates, you will draw these lines every day. You will code diagnoses, justify treatments, argue with insurers, advise patients facing hard choices. When you sit down at that terminal this afternoon, or tomorrow, or next week, and you type in a code that carries immense weight—for treatment, for coverage, for identity—do this one thing: **Ask yourself, explicitly, "What is the specific obstacle this condition creates *for this person, right now*?"** Don't just name the pathology; articulate the barrier. Is it pain preventing work? Is it fatigue stealing time with family? Is it an anomaly causing fear? Or is it a difference creating friction in a world built for others? Pinpointing the obstacle isn't just coding; it’s the first step towards relevant care. It anchors the biology to the biography.

  Now, a word for the twelve hundred people who *really* made this day possible. Parents, partners, families: You are the bedrock. You provided the quiet support, weathered the emotional storms, and likely heard the word "disease" used in ways that sounded utterly foreign over the past four years. You heard about pathophysiological cascades and evidence-based interventions when perhaps all you remembered was your child's asthma diagnosis at five, or your partner's bout of pneumonia. The language changed. The concepts became complex, debated, sometimes abstract. Please understand: that complexity isn't a dismissal of the simpler truths you knew. It’s the necessary grappling with the immense depth and variation of human affliction and resilience that your graduates now navigate. The diagnosis given to someone you love wasn't arbitrary. It was a snapshot of understanding at a moment in time, a tool wielded with the best knowledge available to help. Your graduates have learned that medicine’s map is vast and sometimes its borders are contested territory, but the destination—alleviating suffering, restoring possibility—remains the constant star they steer by. You helped them find that star. Thank you.

  Graduates, medicine is not practiced in a vacuum of pure biology. It’s practiced in living rooms, emergency departments, clinics, and communities where values, expectations, and circumstances shape suffering just as surely as pathogens or genes. You stand at the intersection. You have mastered an incredible depth of scientific knowledge. Carry it with humility. The lines you draw—between health and disease, necessity and choice—will shape lives. Draw them thoughtfully, aware of the biology, keenly attuned to the life before you. And never forget to ask: What obstacle does this person face *here*, *now*? That question is your compass.

  Congratulations, physicians. Go find your bearings.
