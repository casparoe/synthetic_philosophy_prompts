answer: |-
  ### 1. **The loop in short**
  The pruning pass should iteratively remove strictly dominated strategies until none remain. For each player, check every active strategy against mixed strategies of the same player (over their remaining strategies). Use a tolerance threshold for strict dominance. Pseudocode:

  ```python
  active_strategies = initial_strategy_sets
  τ = 5000  # Tolerance for noisy payoffs
  changed = True

  while changed:
      changed = False
      for player_i in players:
          for s in active_strategies[player_i]:
              if is_strictly_dominated(player_i, s, active_strategies, τ):
                  active_strategies[player_i].remove(s)
                  changed = True
                  break  # Restart the while-loop after any removal
          if changed:
              break  # Exit player loop after removal
  ```

  ### 2. **What "dominated" has to mean here**
  - **Strict dominance (required)**: A strategy \(s\) is strictly dominated if there exists a mixed strategy \(\sigma\) (over the same player's *remaining* strategies) such that \(\sigma\)'s payoff is **strictly greater** than \(s\)'s payoff *for every possible combination* of opponents' current active strategies. Weak dominance (allowing \(\geq\) with some \(>\)) is unsafe—it can alter equilibria.
  - **Mixed strategies matter**: Dominance by a mixture (e.g., a 50/50 split) must be checked, not just pure strategies. Ignoring this risks missing dominated strategies.
  - **Current active sets only**: After deletions, compare only against the *remaining* opponent strategies. This is safe because strict dominance in a subgame implies it in the full game.
  - **Iterate one-at-a-time**: Remove one strategy per loop iteration and restart. Deleting multiple strategies simultaneously may invalidate dominance conditions due to interdependencies.

  ### 3. **The procedure, step by step**
  1. **Initialize**: Set `active_strategies` to all strategies for each player. Set tolerance `τ = 5000` (adjust based on noise).
  2. **Loop until stable**:
     - Set `changed = False`.
     - For each player \(i\) (in fixed order, e.g., 0 to 3):
       - For each strategy \(s\) of \(i\) (in fixed order):
         - **Check dominance via LP**:
           - Let \(K\) = other active strategies of \(i\) (size \(m \leq 12\)).
           - Let \(J\) = all opponent strategy profiles (Cartesian product of other players' active sets; size \(\leq 12^3 = 1728\)).
           - Solve LP:
             - Variables: \(x_k\) (probabilities for \(k \in K\)), \(t\) (gap).
             - Maximize \(t\).
             - Subject to:
               - \(\sum_{k} x_k \cdot \text{payoff}(k,j) \geq \text{payoff}(s,j) + t \quad \forall j \in J\)
               - \(\sum_{k} x_k = 1\), \(x_k \geq 0\).
           - LP size: \(m + 1\) vars, \(|J| + 1\) constraints (e.g., 13 vars, 1729 constraints max).
         - **Dominance condition**: If optimal \(t \geq \tau\), \(s\) is strictly dominated.
       - **Remove and restart**: If \(s\) is dominated, remove it, set `changed = True`, break inner loops, and restart the `while` loop.
  3. **Assert invariants**:
     - After removal, check `len(active_strategies[i]) > 0` for all players (fail if empty).
     - Log \(t\) and strategy removed. If \(0 < t < \tau\), log a warning about borderline case.
  4. **Terminate** when no removals occur in a full pass.

  ### 4. **Noisy payoffs and ties**
  - **Tolerance \(\tau\)**: Set \(\tau\) to **2–3x the maximum observed Monte Carlo noise** (e.g., $5000 if noise is ±$2000). This avoids pruning strategies due to numerical fluctuations.
  - **Strict dominance**: Require \(t \geq \tau\) in the LP. If \(t < \tau\), treat the strategy as non-dominated (even if \(t > 0\)).
  - **Ties**: A strategy that ties with others (payoff difference \(< \tau\)) is **not dominated**. Weakly dominated strategies (e.g., always \(\geq\) but not strictly \(>\)) are preserved.
  - **Procedure changes**: None beyond using \(\tau\) in the LP and skipping removal if \(t < \tau\). Never prune based on weak dominance or pure-strategy comparisons alone.

  ### 5. **Where it stops and a human decides**
  Stop and consult the economist when:
  1. **Borderline dominance**: If a strategy has \(0 < t < \tau\) in the LP, ask:  
     *"Should we prune strategy \(s\) for player \(i\)? It is weakly dominated with a minimum gap of \($X\), within noise tolerance."*
  2. **Insufficient pruning**: If the active set remains too large after pruning, ask:  
     *"Can we safely remove weakly dominated strategies from the current active sets to reduce the game further? If so, which ones?"*
  3. **Equilibrium shift**: If the final equilibrium changes materially after adjusting \(\tau\), ask:  
     *"The equilibrium payoff shifted by $X when we adjusted the dominance tolerance. Which \(\tau\) is defensible given the Monte Carlo error?"*

  ### 6. **Three cases from my logs**
  **(a) Beats pure strategies, loses to a 50/50 mix**  
  - **Procedure**: Solve LP for the 50/50 mix. If the minimum gap \(t \geq \tau\) against all opponent profiles, prune \(s\).  
  - **Outcome**: **Prune**. The mixture proves strict dominance, so \(s\) is irrelevant for equilibria.

  **(b) Tie-heavy strategy (moved answer $400k when pruned)**  
  - **Procedure**: Check pure and mixed strategies. If no \(\sigma\) yields \(t \geq \tau\) (due to ties), do not prune.  
  - **Outcome**: **Do not prune**. Weakly dominated strategies (here, ties) are preserved. Your original deletion was unsafe and likely caused the $400k shift by altering equilibria.

  **(c) Dominated only after another player’s strategy is deleted**  
  - **Procedure**: After the first removal, restart the loop. The second strategy now faces fewer opponent profiles, revealing dominance.  
  - **Outcome**: **Prune** if \(t \geq \tau\). Safe because dominance holds in the current subgame.

  ### 7. **What this doesn't buy me**
  - **Guarantee of small game size**: Pruning removes strictly dominated strategies but may leave a large game (e.g., 8^4=4096 profiles) if no more are dominated. Equilibrium solvers may still struggle.
  - **Weak dominance**: Strategies that are weakly dominated (but not strict) are preserved, potentially bloating the game. Further reduction requires economist input.
  - **Equilibrium selection**: All Nash equilibria are preserved, but pruning doesn’t help choose among multiple equilibria. The solver may find one that differs from historical outcomes.
  - **Noise robustness**: With high Monte Carlo noise, dominance checks become conservative (high \(\tau\)). Some truly dominated strategies may survive, but this avoids false removals.
