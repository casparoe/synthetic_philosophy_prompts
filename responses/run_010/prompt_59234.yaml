prompt: |-
  Every Thursday about a dozen of us meet in the back room of the community center and argue about whatever topic I bring. Nobody there went to college, me included, this is all self taught out of library books and youtube. Next week I want to do the centipede game — the one where two people take turns, and on your turn you either grab the money and end it (keeping the bigger share) or push the pot over to the other guy, and every push makes the pot bigger, so what you'd get by grabbing keeps growing as you go.

  I already tried a rough version on two buddies at work and it went wrong in a very specific way I need help with. They got backward induction instantly. Ten seconds. "Obviously you grab on the first round, because if you don't he grabs on the second." Done, and they thought I'd brought something trivial. The paradox never landed. The thing I actually want them to feel is the part that I find genuinely disturbing: that the argument looks airtight, and yet it predicts something that basically doesn't happen — in the experiments hardly anyone grabs right away, and the people who pass end up better off — and worse, that the argument sort of eats itself once you're deep in, because if you and this guy have somehow gotten to round 50, you've already learned something that flat contradicts the assumption the whole chain started from.

  So plan the 45 minutes for me. Don't explain the game to me, I know it. What I need:

  - the order the pieces have to go in and what depends on what — specifically, do I start with a two or three round version on the whiteboard and build up, or does going short first just spoil it?
  - whether money is even the right stakes. Would some everyday version carry it better (splitting a job, a negotiation, a feud, whatever)? Tell me what the example has to have and what it must not have, because every real life analogy I come up with smuggles in stuff the game doesn't have.
  - the exact moment to spring the "but people don't actually do this" fact so it lands as a puzzle and not as a gotcha.
  - how to get them to the eats-itself point with zero jargon. The second I say something like "common knowledge of rationality" I have lost the room permanently.

  Two things I'm scared of. One: this crowd already thinks experts are full of it, so if the night ends with "see, the math was wrong, people are irrational," I've handed them a thing they already believed and taught them nothing. Two: I don't want to be the guy who pretends the reasoning is broken when I honestly think it isn't.

  Also give me the misconceptions they'll walk in with or invent on the spot and where in the sequence to head each one off, one question I can ask at the end that would show me whether the paradox actually landed or whether they're just being nice to me, and what I should skip entirely at this level and openly tell them I'm skipping. No book recomendations, nobody is reading anything. And keep the whole answer under 500 words — a plan I can glance at on a page beats an essay.
reasoning: |-
  Okay, the user is running a discussion group at a community center and wants to teach the centipede game effectively. They tried it with coworkers, but the backward induction was too obvious, and they didn't grasp the paradox. The user needs a 45-minute plan that avoids jargon, presents the paradox effectively, and addresses skepticism about experts.

  First, I need to structure the session so the paradox lands. Starting with a longer game version might help since the short version spoiled it last time. Using a 5-round game on the board with escalating stakes could make the backward induction less immediate. Instead of money, maybe an everyday analogy like splitting chores or a shared task, but I have to ensure it doesn't introduce external factors. The user mentioned real-life analogies often "smuggle in" extra elements, so sticking to money but using hypothetical stakes might be safer.

  The key is to let the group discover the backward induction themselves. Present the rules, ask what Player 1 should do. If they say "grab immediately," challenge them by asking if Player 1 can trust Player 2 to pass. That introduces the recursive logic. Then, extend to more rounds, showing how the induction forces grabbing on round one. But then reveal that in experiments, people don't do this—they pass and end up with more money. That contradiction is the puzzle.

  Timing the experimental results is crucial. Present it after they've agreed with the logic, so it's a surprise. Then discuss why the logic might break down—maybe trust, learning, or different player types. The user wants to avoid the "people are irrational" conclusion because it reinforces their group's bias against experts. Instead, frame it as the assumptions of the model (common knowledge of rationality) not holding in practice. But without using that term. Emphasize that players learn from others passing, contradicting the initial assumption.

  Anticipate misconceptions. Some might think the players are irrational, but steer towards the idea that the model's assumptions are too strict. Others might suggest real-world factors like reputation, which can be acknowledged but set aside to focus on the core paradox.

  End with a question to check understanding: "If someone passes the first pot, what does that tell the other player?" If they see it challenges the initial assumption, the paradox landed. Skip terms like "backward induction" or "common knowledge," and avoid deep game theory. Keep it conversational, using the whiteboard for visuals. The goal is to leave them with the tension between airtight logic and real behavior, without dismissing the reasoning.
answer: |-
  Here's your 45-minute plan, focused on the paradox landing:

  **Goal:** Make them *feel* the tension between airtight logic & baffling real behavior. Avoid "people are irrational" or "logic is wrong".

  **Materials:** Whiteboard, markers, simple payout chart (e.g., Round 1: Grab=$2/$0, Pass=> Round 2: Grab=$1/$3, Pass=> etc. - make payouts escalate visibly).

  ### The Plan (45 Mins)

  1.  **Set the Stage: A Long Game (5 Rounds) - (5 mins)**
      *   DON'T start short (spoils it!). Draw a 5-round Centipede on the board (Player A, Player B, alternating turns).
      *   Explain rules CLEARLY: On your turn, ONLY two choices: **Grab** (end game, take bigger share *now*) or **Pass** (pot grows, other player decides next).
      *   Show escalating payouts (e.g., R1: Grab A:$2/B:$0 -> Pass -> R2: Grab B:$3/A:$1 -> Pass -> R3: Grab A:$5/B:$2 -> etc.). Emphasize **total money grows if they keep passing**. Ask: *"Who wants to be Player A? Player B? What do you do on Round 1?"*

  2.  **Elicit the Logic (Backward Induction) - (15 mins)**
      *   Focus them on the **LAST** round (e.g., Round 5). *"Player B's turn. If they get here, what does Player B do?"* (Grab! Gets $9 vs. $4 if they passed unrealistically).
      *   Move to Round 4. *"Player A's turn. They KNOW what Player B will do on Round 5. So what does Player A do on Round 4?"* (Grab! Gets $7 now vs. $4 later if they pass and B grabs).
      *   Move to Round 3. *"Player B's turn. They KNOW Player A will grab on R4. So what does B do on R3?"* (Grab! Gets $5 now vs. $3 later if they pass and A grabs on R4).
      *   Continue to Round 2 (B Grabs), then Round 1 (A Grabs). **Let THEM say it each step.** *"So... logically, Player A grabs IMMEDIATELY on Round 1. Everyone agree? Seems airtight?"* (Nods likely). **Key Q:** *"Player A gets $2. What *could* they have gotten if they passed and somehow kept going?"* (Point to later, higher payouts). Highlight the gulf ($2 vs. potentially $7 or $9).

  3.  **Spring the Puzzle: "But People Don't!" - (5 mins)**
      *   **Crucial Timing:** *After* they fully buy the logic, *before* moving on.
      *   "Here's the kicker. When smart people play this for real money in labs? They almost **NEVER** grab on Round 1. They pass! And get way more money! Often they get several rounds deep before someone grabs." Let that sink in. **Pose the Puzzle:** *"The logic says grab immediately. Real people pass and end up richer. How the heck is that possible? Where did our airtight logic go wrong?"* (Frame it as *the logic vs. reality puzzle*, not gotcha).

  4.  **Explore the Contradiction & "Eats Itself" Point - (15 mins)**
      *   **Focus on Trust/Learning:** *"Okay, imagine you're Player A. The logic says grab. But... what if you pass? What does that *signal* to Player B?"* (Maybe you're not purely greedy? Maybe you'll pass again?).
      *   *"Now Player B sees you passed on R1. What does that tell B about *you*? Does it change what B thinks you'll do later?"* (Yes! You've shown you *might* not grab immediately next time).
      *   **The Core Insight:** *"So if Player B sees you pass R1... doesn't that **directly contradict** the very first assumption we made? We assumed Player B 'KNOWS' Player A will grab on their next turn. But if A just *didn't* grab when they 'should have'... doesn't that blow up the whole chain?"* (Nods! This is the "eats itself").
      *   **Connect to Experiments:** *"This is why people pass! They think 'Maybe this guy isn't a pure logic-bot.' Passing is a gamble to build trust and get to the bigger money. And often, it *works*."*

  5.  **Wrap-Up & Your Key Question - (5 mins)**
      *   **Reframe:** *"So it's not that the logic is 'wrong' in a vacuum. It's that the **assumption** – that everyone *knows* everyone else is perfectly rational and greedy *and* that everyone *knows* everyone *knows* this, forever – might be too fragile. One act of passing breaks that chain of 'knowledge'."*
      *   **Your "Did it Land?" Question:** *"If Player A passes the first pot, what does that instantly do to Player B's belief about what Player A will do later?"* (If they say "Makes B doubt A will grab immediately", or "Breaks the assumption", or "Shows A might cooperate" - SUCCESS. If they just say "B thinks A is dumb", they missed the paradox).
      *   **Skip:** Formal terms (backward induction, common knowledge, subgame perfection). Deep game theory math. Long experimental details.
      *   **Final Thought:** *"The disturbing part? The logic seems perfect alone, but breaks when real humans interact and *learn* from each other's actions."*

  ### Key Tactics & Misconceptions

  *   **Stakes:** Use hypothetical money. Avoid real-life analogies (reputation, future games, fairness creep in). **Must Have:** Clear, escalating payoffs. **Must Not Have:** Any reason to care about the *other* player's outcome beyond your own payoff in *this* game.
  *   **Misconceptions to Head Off:**
      *   *"People are just dumb/irrational."* Counter: "But they end up with *more* money! How is that irrational?" Push towards the broken assumption.
      *   *"They think about reputation/future games."* Acknowledge: "Sure, in real life! But in this *pure, one-time* game lab version? That's not supposed to be there. The puzzle happens even without it."
      *   *"Player 1 passing is a mistake."* Counter: "But it often *works* and gets them more money! How can a 'mistake' pay off?"
  *   **Your Fears Addressed:**
      *   Avoid "experts are wrong": Frame it as a fascinating *tension* between pure logic and human interaction, not a failure of either. The logic is sound *given its assumptions*; humans operate where those assumptions break.
      *   Avoid pretending logic is broken: You're showing its *limitations* in predicting real behavior due to its fragile assumptions.

  **Keep it visual, conversational, and let them drive the logic steps. The whiteboard is your friend!** Good luck!
