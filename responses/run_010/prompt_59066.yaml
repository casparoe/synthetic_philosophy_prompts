answer: |-
  Here's a 50-minute whiteboard-only session plan designed for your bio-savvy, formalism-naive students, flipping Hofstadter's order and targeting the core isomorphism insight while dodging the landmines:

  ### 1. Dependency Spine (Order is Crucial - Don't Deviate)
      *   **Start: DNA Replication & Transcription/Translation (5 mins)**
          *   *Depends on:* Student knowledge. *Why now?* Anchor everything in their solid ground. Whiteboard: DNA strand -> replication fork (polymerase, helicase, primase mentioned). DNA strand -> mRNA -> ribosome -> tRNA/codons -> protein. Emphasize: **Instructions (DNA) -> Machinery (Proteins) -> Action (Copy/Make).**
      *   **Next: Typogenetics as an *Abstracted* System (10 mins)**
          *   *Depends on:* Establishing the biological process. *Why now?* Provides contrast. "Imagine a *stripped-down, rule-based world* inspired by this." Whiteboard: `Typo-strand` -> `Enzyme` -> `Operations` -> `New Strand(s)`. Explicitly state: "Different rules, same *kind* of process: Instructions -> Machinery -> Action."
      *   **Then: The Typogenetic Code (Duplets!) & Rules (15 mins)**
          *   *Depends on:* Establishing Typogenetics as a *different formal system*. *Why now?* Rules are meaningless without context. Whiteboard the 4 bases (C, G, A, T/U). **Crucially:** "Here's the *first big difference*: The 'codons' are **duplets**, not triplets. Why? Because this is a *model* designed for specific exploration, not biology. We have 16 possible commands (show a few: `mvr`, `cop`, `off`, `rpy`, `lpy`, `cut`, `swi`). `STOP` is `**`." Emphasize commands are actions the enzyme takes *on the strand*.
      *   **Finally: Enzyme Execution & Strand Tracing (15 mins)**
          *   *Depends on:* Knowing the commands/rules. *Why now?* Rules must be applied to see the process. Whiteboard a short strand and trace enzyme actions step-by-step (direction, cut, copy, etc.). Build to the output strand(s). **Point:** "See? Same *form*: Strand -> Rules -> Enzyme -> New Strand(s). Different *substance*."

  ### 2. The Carrying Strand: "CGTAGTA" (Use This, Not Hofstadter's Puzzle)
      *   **Why this strand?**
          *   **Has:** Clear start (`CG` = `mvr` - enzyme moves right), a copy command (`TA` = `cop` - makes it replicate-relevant), and a stop (`GT` = `off` - enzyme falls off). `AG` (`swi`) introduces enzyme switching focus. Short enough to trace fast.
          *   **Lacks:** Complex branching, multiple enzymes, lengthy outputs. Avoids `cut`/`del`/`ina`/`rpy`/`lpy` which add visual clutter for minimal initial payoff.
          *   **Trace:** Start enzyme at left end. `CG` -> `mvr` (move right). `TA` -> `cop` (copies base to *left* of current position? Establish rule clearly!). `AG` -> `swi` (enzyme switches to focus on the copy strand? Establish rule!). `GT` -> `off` (enzyme off). Output: Original strand + a copy strand starting with the copied base. **Key:** Focus on **rule-following process**, not the specific output. Show the *isomorphism*: Strand (Info) -> Enzyme (Machine) -> Rules -> New Strand (Info).
      *   **Why NOT Hofstadter's self-rep?** Too long, too complex (requires multiple enzymes, specific folding), distracts from core process tracing and isomorphism. The goal is *process*, not magic self-rep yet.
      *   **Why NOT simpler?** Needs a command showing action (`cop`) and something interesting (`swi`) to highlight rule-dependence.

  ### 3. Misconception Map (Preempt & Defuse)
      *   **"Codons are triplets! This is bad biology!" (Surface: When introducing duplets)**
          *   **Preemptive Move:** Explicitly frame the Typogenetic Code upon introduction: "**This is not biology.** It's a **formal system**, a *toy model* invented by Hofstadter. He uses **duplets** because it gives him exactly 16 commands (`4^2`), perfect for exploring rule-based systems and self-reference. Biological accuracy isn't the goal here; exploring *abstract processes* is."
      *   **"The enzyme *understands* the strand it grabs." (Surface: When tracing execution)**
          *   **Preemptive Move:** During tracing, hammer the **rules**. "The enzyme doesn't 'know' anything. It's just a machine following rigid rules. See `CG`? Rule says `mvr`. It *has* to move right. `TA`? Rule says `cop`, it *must* copy. The *strand* holds the instructions; the enzyme is a dumb rule-follower." Use phrasing like "the rule *forces* the enzyme to...".
      *   **"Self-replication just means getting copied (by an external machine)." (Surface: Implicit, or if self-rep is mentioned later)**
          *   **Preemptive Move:** When tracing, emphasize the enzyme is **part of the system defined by the rules**. Distinguish: "In biology, the polymerase *isn't* coded by the DNA it's copying *at that moment*. In *this formal system*, the rules define *both* the strand instructions *and* how the enzyme works. For *true* self-rep in Typogenetics, the strand must encode instructions that build *its own* copying machinery (enzyme) from scratch." (Plant the seed for why Hofstadter's puzzle is hard).
      *   **"So DNA *is* a computer / This proves the mind isn't a machine!" (Surface: Q&A or if the pop-sci guy speaks up)**
          *   **Preemptive Move:** Conclude the tracing by stating the isomorphism clearly: "The **point isn't that DNA *is* a computer**, or vice-versa. The point is **isomorphism**: they share the *same abstract structure*: `Information (Strand/DNA)` + `Rules (Typo-Code/Cellular Machinery)` -> `Executor (Enzyme/Ribosome etc.)` -> `New Information/Copies`. This *structural similarity* is what lets us use the formal system to *think about* the biological one, and vice-versa. It's a map, not the territory." If challenged: "Hofstadter uses this to explore *how* formal systems can model complex things like self-ref, leading to Gödel. It doesn't *prove* anything about minds directly."

  ### 4. The Check (End of Session Question)
      *   **Question:** "Okay, so we traced a strand through the Typogenetics rules. Forget the specific commands for a second. What is the *most fundamental similarity* between what we just did with the typo-strand and what happens in a real cell with DNA? Not the molecules, but the *process*?"
      *   **Good Answer (Idea Landed):** "They both involve information stored in a string/code being read and processed by a machine that follows strict rules to make something new, like another copy or instructions for a machine." (Captures Info + Rules + Executor -> Output).
      *   **Bad Answer (Vocab Playback):** "It's isomorphic." / "The typo-strand is like DNA and the enzyme is like polymerase." (Too vague, doesn't capture the *structural process* without prompting).

  ### 5. Cut List (Be Explicit)
      *   **Cut Entirely:** Gödel numbering, the specific Hofstadter self-rep strand, the entire "meaning" layer (amino acids as letters/words), detailed enzyme structure beyond "rule-follower", `rpy`/`lpy`/`cut`/`del`/`ina` commands (beyond `swi`/`cop`/`off`/`mvr`), any mention of minds/AI/Gödel's theorem implications.
      *   **Sentence to Say:** "We're focusing *only* on the core process of instruction-following in this stripped-down model to see the structural similarity to biology. Hofstadter builds much more on this foundation – loops, self-rep, Gödel – but that's for another day. Today, it's all about the basic rules and the process they create." (Said when introducing Typogenetics or if a question ventures too far).

  **Session Flow Summary:** Bio Anchor (5) -> Formal System Intro (10) -> Rules/Duplets (15 - **DEFUSE HERE**) -> Trace "CGTAGTA" (15 - **Hammer rules, show process**) -> Isomorphism Recap & Check (5). **Whiteboard constantly:** Draw biological process -> Draw Typo process framework -> List bases/duplets/commands -> Trace the strand step-by-step. Good luck!
