prompt: |-
  I'm the secretary of a tenant union — about 400 of us, one board election a year, currently first-past-the-post, and we've got maybe five people running every time. At last month's meeting the membership voted to put a question on the next agenda: do we switch to ranked-choice (instant runoff, rank them 1-2-3)? Someone stuck me with writing the one-pager that goes out to members beforehand, which I said yes to before realizing I don't actually understand the arguments being made about it.

  Here's the problem. Two members invoked the exact same theorem in opposite directions and both acted like it settled the question.

  One said ranked choice means you can just honestly rank everybody and stop worrying about wasting your vote or splitting it — apparently the math people proved you never have to think strategically again under RCV. The other one, a guy who does data stuff at work, said that's backwards: the Gibbard–Satterthwaite theorem proves every voting system is gameable, so RCV buys us nothing over what we already have and we shouldn't bother changing anything.

  Can you pull apart what "this system can be manipulated" / "this system is strategy-proof" actually means, as a list of the distinct precise claims somebody could be making? For each one I want to know whether it's trivially true, actually true of instant runoff specifically, false, or true-but-doing-no-work. In particular I'm fuzzy on: what has to be true of a system before that theorem even bites (how many candidates, what kind of ballot, is a coin flip to break a tie going to ruin it?); whether "can be manipulated" has anything to do with "you should manipulate" or "manipulating usually pays"; whether the theorem covers the approval-ballot option we also discussed, where you just tick everyone you'd accept; what changes if in practice only two of our five candidates are ever really in contention; and whether a bloc ranking only its own guy and leaving the rest blank is a real strategy or a folk myth. I also dimly remember reading that for some systems it's computationally hard to even work out what the strategic vote would be — does that matter at all to whether manipulation is a practical worry?

  End with which of the two members is closer to right, and a plain-English bottom line I could actually print for members about how to fill in their ballot next year. Don't bother with references, I just need the distinctions stated clearly enough that I can defend the one-pager when that data guy reads it.
reasoning: |-
  Okay, the user is the secretary of a tenant union with about 400 members. They hold annual board elections with around five candidates using first-past-the-post (FPTP). The membership voted to discuss switching to ranked-choice voting (RCV), specifically instant runoff. The user needs to write a one-pager explaining the pros and cons, but they're confused because two members cited the same theorem (Gibbard-Satterthwaite) to argue opposite points. One said RCV eliminates strategic voting, while the other claimed it's pointless since all systems can be manipulated.

  First, I need to break down the Gibbard-Satterthwaite theorem. It states that no voting system with three or more candidates can be both strategy-proof and satisfy certain fairness criteria. This applies to any system where voters rank candidates or choose from multiple options. So both members are partially right—RCV isn't strategy-proof, but that doesn't mean it's the same as FPTP.

  The user wants clarity on several points: when the theorem applies, the difference between possible manipulation and practical likelihood, how approval voting fits in, whether having two front-runners changes things, and if bloc voting is effective. Also, they need to know if computational difficulty affects strategic voting.

  For the theorem's applicability, it requires at least three candidates and deterministic outcomes. Tie-breaking methods like coin flips don't affect it since the theorem is about strategic incentives. So in their five-candidate elections, the theorem is relevant.

  Regarding manipulation: just because a system can be manipulated doesn't mean it's equally vulnerable. FPTP has obvious strategies like not voting for a less popular candidate to avoid splitting the vote. RCV reduces the spoiler effect but introduces more complex strategies, like ranking a less preferred candidate higher to block someone worse. However, such strategies are harder to execute and might backfire. The user mentioned only two strong candidates—this reduces the need for strategy, but RCV still handles vote-splitting better than FPTP.

  Approval voting is also manipulable but in different ways. Voters might approve only their top choice or multiple candidates, depending on who they think is viable. While it's simpler, it can lead to "compromising" strategies.

  The user's data guy argued that since all systems are manipulable, switching to RCV is pointless. But that's misleading. The theorem doesn't say all systems are equally manipulable. RCV addresses specific issues like vote-splitting, which is common in FPTP, especially with five candidates. Even with two front-runners, third candidates can act as spoilers in FPTP, which RCV mitigates.

  Bloc voting—ranking only one candidate—isn't strategic in RCV. It's like bullet voting, which doesn't help and might hurt if the candidate is eliminated early. True strategic voting in RCV involves sophisticated calculations, which are impractical without coordination or perfect information.

  Computational difficulty matters. In FPTP, strategy is simple: vote for the front-runner you prefer. In RCV, figuring out how to rank requires knowing others' preferences and the elimination order, which is complex. For most voters, honest ranking is optimal.

  For the one-pager, the bottom line should encourage honest ranking. RCV is better than FPTP for their situation because it minimizes vote-splitting and allows expressing preferences without fear. The data guy is technically correct about the theorem but misses the practical benefits of RCV. The other member is closer to right because RCV reduces the need for strategy compared to FPTP.

  The user needs plain English advice: "Rank candidates honestly. RCV ensures your vote counts fully, even if your first choice loses." They should address that no system is perfect, but RCV is an improvement.
answer: |-
  Here's a clear breakdown of the strategic voting claims, tailored to your tenant union context (5 candidates, ~400 voters, FPTP vs RCV/Instant Runoff), followed by a plain-English bottom line.

  ### Key Claims & Their Validity for Instant Runoff Voting (RCV)

  1.  **"Under RCV, you can *always* honestly rank your true preferences without worrying about wasting your vote or vote-splitting."**
      *   **Status: False.** Gibbard-Satterthwaite (GS) proves this is impossible for *any* system with 3+ candidates. While RCV *reduces* vote-splitting worries significantly compared to FPTP, rare scenarios exist where ranking honestly *could* lead to a worse outcome than strategically altering your ranking (e.g., "burying" a strong candidate you dislike). However, these scenarios are complex, require near-perfect information, and often backfire.

  2.  **"RCV is *strategy-proof* (immune to tactical voting)."**
      *   **Status: False.** GS applies directly to RCV. RCV uses ranked ballots (the input GS requires) and almost always has 3+ candidates (the trigger). A coin-flip tiebreaker doesn't invalidate GS; it just means the system isn't strictly deterministic in *every* outcome, but the *incentive* to strategize remains. GS proves RCV *is not strategy-proof*.

  3.  **"RCV buys us *nothing* over FPTP regarding strategy because *all* systems are manipulable (Gibbard-Satterthwaite)."**
      *   **Status: True-but-doing-no-work (Misleading).** GS proves all ranked/ordinal systems with 3+ candidates are manipulable. **This is not the same as saying all systems are *equally* manipulable or that manipulation is *equally easy, likely, or impactful*.** FPTP is *highly susceptible* to simple, common, high-impact strategy (e.g., vote-splitting forces you to abandon your true favorite to prevent a worse win). RCV is *less susceptible* to common, simple strategies. GS says manipulation *can* exist for both, but it says *nothing* about how severe or frequent the problem is. Dismissing RCV because of GS ignores this crucial difference.

  4.  **"Manipulation is always possible" = "You *should* manipulate" or "Manipulating usually pays off."**
      *   **Status: False.** GS only proves the *theoretical possibility* of a situation where *some* voter *could* benefit by lying. It says **nothing** about:
          *   How *often* such situations arise in real elections.
          *   How *easy* it is for voters to *identify* such situations.
          *   How *easy* it is for voters to *coordinate* effectively.
          *   The *risk* of the strategy backfiring.
          *   Whether the *potential gain* is worth the effort/risk.
      *   In FPTP, strategic voting (deserting your favorite for a "lesser evil") is often necessary and straightforward. In RCV with 5 candidates, identifying a beneficial strategic vote is *extremely difficult* for an individual voter without near-perfect polling data and complex simulations. For most voters, in most RCV elections, honest ranking is the *safest and best* strategy.

  5.  **"What about Approval Voting (tick everyone you accept)?"**
      *   **Status: Also Manipulable.** GS applies to Approval Voting too, as it falls under "non-ranked" systems covered by later extensions like the Gibbard Theorem. Approval Voting is also vulnerable to strategy (e.g., deciding whether to "bullet vote" for only your top choice or "approve" a compromise candidate). Its strategic dynamics differ from FPTP and RCV.

  6.  **"Does having only 2 real contenders change things?"**
      *   **Status: Reduces the problem significantly, but GS still formally applies.** If 3 candidates are essentially non-viable "noise," the election effectively has 2 candidates. In a true 2-candidate race, both FPTP and RCV are identical and strategy-proof (vote for your favorite). However, with 5 names on the ballot, you can't be *certain* only 2 are viable. RCV handles uncertainty about viability *much better* than FPTP – you can safely rank a long-shot first without harming your preferred front-runner.

  7.  **"Is bloc ranking only one candidate (bullet voting) a real strategy in RCV?"**
      *   **Status: Mostly Folk Myth / Harmful.** Ranking only your absolute favorite and leaving the rest blank *does not* make them more likely to win. It only means your ballot gets exhausted if they are eliminated, giving you *no* say in the later rounds. It's generally a *worse* strategy than honestly ranking backups. True strategic manipulation in RCV involves complex reordering, not bullet voting.

  8.  **"Does computational difficulty make manipulation a non-issue?"**
      *   **Status: True for practical purposes in your context.** Figuring out the *optimal* strategic vote in RCV with 5 candidates is computationally complex and requires knowing the *exact* preferences and likely elimination order of all other voters – information no individual voter has. While *possible* in theory (proving GS applies), it's wildly impractical for your members acting individually. In FPTP, the optimal strategy ("Vote for the front-runner you dislike least") is often obvious.

  ### Who's Closer to Right?
  *   **The first member ("rank honestly, stop worrying") is closer to being *practically* right for your situation.** While *technically* overstating the case (RCV isn't perfectly strategy-proof), their core point that RCV *dramatically reduces* the common, harmful strategic dilemmas of FPTP (vote-splitting, "wasted vote") is correct. Honest ranking is the overwhelmingly best approach for almost all voters in almost all RCV elections like yours.
  *   **The data guy ("GS proves RCV buys nothing") is *technically correct* about GS applying but *practically wrong*.** He misapplies the theorem to imply all systems are equally bad strategically. This ignores the massive real-world difference: FPTP *forces* common, impactful strategy; RCV makes successful strategy rare, complex, and risky for individuals. Switching *does* buy significant strategic relief.

  ### Plain-English Bottom Line for Your One-Pager

  **How to Vote Under Ranked Choice (if adopted):**

  "**Rank your choices honestly, 1-2-3 (and more if you wish).** Don't overthink it! Rank your favorite #1, your next choice #2, and so on. You can rank as many or as few as you like.

  *   **Why it works:** If your #1 choice doesn't have enough votes to win, your vote automatically counts for your #2 choice, and so on. Your vote isn't wasted.
  *   **No 'Splitting the Vote':** Unlike our current system, you don't need to worry about hurting a similar candidate by ranking your true favorite first. Rank the candidates you like best at the top.
  *   **Simple & Safe:** Complex strategies rarely work and usually backfire. The safest and most effective way to make your voice heard is to rank your true preferences.
  *   **Your Ballot, Your Choice:** Only rank candidates you are comfortable supporting. If you truly only support one person, you can just rank them #1."

  **Why We're Considering This Change:**

  Ranked Choice Voting helps ensure the winner has broad support and reduces the pressure to vote strategically instead of for who you truly prefer. While no system is perfect, RCV addresses the main frustrations people have with our current 'vote for one' method when there are several candidates.
