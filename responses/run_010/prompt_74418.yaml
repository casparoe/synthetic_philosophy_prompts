  ### Desiderata for the Self-Auditing Knowledge Base

  1. **Consistency**:  
     - **Requirement**: No claim is assigned both "accepted" and "rejected" simultaneously.  
     - **Motivation**: The Liar Paradox: Let \(L\) be "\(L\) is rejected." If accepted, it must be rejected; if rejected, it is true and should be accepted. Contradiction.  
     - **Classification**: Non-negotiable. Without consistency, the system is trivialized.  

  2. **Completeness**:  
     - **Requirement**: Every claim receives one status: accepted, rejected, or undecided.  
     - **Motivation**: A claim asserting "this claim is undecided" (\(U\)) forces a status assignment. If undecided, \(U\) is true but not accepted, violating intuition.  
     - **Classification**: Non-negotiable (per setting: procedure halts for any finite batch).  

  3. **Base Language Conservativeness**:  
     - **Requirement**: Base language truths (arithmetic + domain predicates) are accepted; falsehoods are rejected. Status predicates do not alter base semantics.  
     - **Motivation**: "\(2 + 2 = 4\)" must always be accepted; "\(2 + 2 = 5\)" rejected.  
     - **Classification**: Non-negotiable. Base facts must remain immutable.  

  4. **Soundness (Restricted Transparency)**:  
     - **Requirement**: If a claim is accepted, its content holds. Formally: \(\text{Accepted}(\ulcorner \phi \urcorner) \to \phi\).  
     - **Motivation**: Truth-teller \(T\): "\(T\) is accepted." Assigning "accepted" is consistent (\(\text{Accepted}(T) \to \text{Accepted}(T)\)).  
     - **Classification**: Non-negotiable. Acceptance must imply truth to trust the store.  

  5. **Monotonicity**:  
     - **Requirement**: Appending claims cannot reverse statuses (accepted/rejected persist; undecided may transition to decided).  
     - **Motivation**: If appending \(A\) flips status of \(B\), users lose trust in prior judgments.  
     - **Classification**: Non-negotiable. Non-monotonicity breaks incremental auditing.  

  6. **Non-Explosiveness**:  
     - **Requirement**: Curry sentences \(C\): "If \(C\) is accepted, then \(X\)" do not force arbitrary \(X\).  
     - **Motivation**: Without restriction, \(C\) compels \(X\) under full transparency.  
     - **Classification**: Non-negotiable. Prevents trivialization.  

  7. **Expressibility of Status**:  
     - **Requirement**: The language can state "claim \(c\) is undecided."  
     - **Motivation**: Introspection (e.g., "claim 42 status is undecided").  
     - **Classification**: Negotiable. Risks revenge paradoxes (see below).  

  8. **Quantifier Handling**:  
     - **Requirement**: Quantified claims (e.g., \(\forall x P(x)\)) are evaluated compositionally.  
     - **Motivation**: "All even numbers are accepted" must reflect instances.  
     - **Classification**: Non-negotiable. Essential for expressive power.  

  ---

  ### Analysis of Joint Satisfiability  
  #### Inconsistent Subset: {Consistency, Completeness, Expressibility of Status}  
  - **Diagonal Construction**: Strengthened Liar: \(S =\) "\(S\) is not accepted and not undecided" (i.e., \(S\) is rejected).  
    - If \(S\) accepted, then \(S\) is rejected (contradiction).  
    - If \(S\) rejected, then \(S\) is true (should be accepted; contradiction).  
    - If \(S\) undecided, then \(S\) is true (since it is undecided, hence not accepted/rejected), but it is not accepted (contradiction for undecided=true).  
  - **Minimal Assumption**: Expressibility allows \(S\) to name its own status.  
  - **Resolution**: Drop **Expressibility of Status** (or weaken to "undecided" only for base claims).  

  ---

  ### Exclusion and Sacrifice  
  - **Most Exclusionary Requirement**: **Monotonicity**.  
    - Excludes revision theories, many paraconsistent approaches, and non-monotonic logics.  
  - **Best Sacrifice Candidate**: **Expressibility of Status**.  
    - Sacrificing it avoids revenge paradoxes while preserving core functionality.  

  ---

  ### Explicit Points Addressed  

  1. **Truth-Teller vs. Liar**:  
     - Truth-teller \(T\): "\(T\) is accepted." Assigning "accepted" is consistent: \(\text{Accepted}(T) \to \text{Accepted}(T)\) holds vacuously.  
     - Liar \(L\): "\(L\) is rejected." Assignment fails: acceptance implies rejection (contradiction), and rejection implies acceptance (contradiction).  
     - **Obligation**: A theory must resolve \(L\) without inconsistency (e.g., assign "undecided") while allowing \(T\) to be "accepted."  

  2. **Curry Sentence & Transparency Asymmetry**:  
     - Curry: \(C =\) "If \(C\) is accepted, then \(X\)." Full transparency (\(\text{Accepted}(C) \leftrightarrow (\text{Accepted}(C) \to X)\)) implies \(X\) by contraction.  
     - Provability: With provability predicate \(\text{Prov}\), \(D =\) "\(\text{Prov}(D) \to X\)" is harmless (Löb’s theorem requires additional structure to derive \(X\)).  
     - **Asymmetry Implication**: **Soundness** (\(\text{Accepted} \to \text{True}\)) must be kept; **completeness** (\(\text{True} \to \text{Accepted}\)) must be surrendered to block Curry.  

  3. **Conservativeness: Genuine or Scruple?**:  
     - **Genuine requirement**. Soundness assertions (e.g., "all accepted claims are true") are desirable but must apply only to the *base language* to avoid inconsistency (Tarski’s theorem). The status predicate extends the language; conservativeness ensures base truths remain inviolate.  

  4. **Monotonicity Necessity**:  
     - **Breaks without it**: Non-monotonicity allows accepted claims to be later rejected, violating audit-trail integrity. Users cannot trust past judgments, and self-referential soundness claims become unverifiable.  

  5. **Undecidedness Expressibility & Revenge**:  
     - **Allowed?** Yes, but cautiously. The sentence \(U\): "\(U\) is undecided" can be assigned "undecided" without contradiction if:  
       - \(U\) is true (it is undecided) but not required to be *accepted* (surrendering completeness).  
     - **Revenge Resistance**: Not a strict desideratum; demanding it is equivalent to requiring completeness, which is impossible per the Strengthened Liar. A theory *must* be "incomplete" (some truths not accepted) to avoid incoherence.  

  ---

  ### Treatment Families: Quick Assessment  
  - **Partial/Gapped (e.g., Kripke)**:  
    - Satisfies consistency, soundness, base conservativeness.  
    - Fails monotonicity (fixed points change with new sentences) and expressibility of undecidedness (revenge paradoxes).  
  - **Paraconsistent (e.g., LP, Priest)**:  
    - Violates consistency (allows glutty assignments). Fails base conservativeness (trivializes if arithmetic is included).  
  - **Revision-Theoretic (e.g., Gupta-Belnap)**:  
    - Violates monotonicity (revisions may flip statuses arbitrarily). Struggles with quantifiers and expressibility.  

  ---

  ### Feasibility and Weakening  
  - **Project Viability**: Possible with care.  
  - **Critical Weakening**: **Drop Expressibility of Status** for the full language. Allow "undecided" only for base claims (non-status). For status claims, use meta-theoretic checks.  
  - **Coherent Alternative**: Allow assignments where "undecided" is expressible but *not subject to soundness*—i.e., "\(c\) is undecided" can be true without being accepted.
