          If U is rejected, then by D10 (for the undecidedness predicate), we have: if we reject "U is undecided", then U is not undecided -> but we are rejecting it, so it is not undecided, which is consistent. However, what U says is that it is undecided. Since we are rejecting it, it is not undecided -> so what it says is false. Then by the soundness direction (if we are to have one) we should not accept it, but we are rejecting it, which is fine. But the problem is that we also have: if a sentence is rejected, then we are committed to its falsehood. So we are committed to the falsehood of U, which is "U is undecided". So we are committed to U not being undecided, which is true because we have rejected it. So no contradiction.

          If U is undecided, then by D10, if we were to accept "U is undecided", then U must be undecided. But we are not accepting it; we are leaving it undecided. And what U says is true: it is undecided. Then we should accept it? But we don't have a requirement that if a sentence is true then it should be accepted. We only have for the base language. So we can leave it undecided even though it is true.

     But then we have a true sentence that is not accepted. This might be acceptable.

     However, the expressibility of undecidedness is not by itself paradoxical. But when we combine with the ability to have self-reference and the rejection predicate, we get the strengthened liar.

     The key is that we do not have a requirement that every true sentence is accepted. We only have that if a sentence is accepted, then it is true. So for U, if we assign undecided, then it is true and not accepted. This is not a contradiction.

     Therefore, the paradox for the strengthened liar relies on the assumption that the assignment is complete and consistent and that we have both directions of transparency. We only have one direction.

     But wait, the sentence S: "S is rejected" can be consistently assigned undecided. Then what it says is false (because it is not rejected). So we have a sentence that is not true and not accepted. This is fine. We don't have to accept it because it is false.

     So the real problem arises only if we require that every sentence that is true must be accepted. We don't have that requirement.

     Therefore, with the current requirements (D1, D2, D3, D6, D7, D10, and without requiring the completeness direction for the status predicate) we can avoid the paradox.

     But then D9 (expressibility of undecidedness) is safe? We can have a predicate Undec(c) and then the sentence U: Undec("U"). We assign it undecided. Then U is true. But we don't have to accept it. So no contradiction.

     However, consider the sentence: 
          V: "V is not accepted and not rejected"

     This is equivalent to "V is undecided". So V is the same as U above. We can assign undecided and it is true, but we don't accept it.

     But then why have the status assignment at all? We want to know the status of claims. If a claim is true but not accepted, then the status assignment is not capturing truth. But we never required that. We only required soundness.

     So the theory is saved by not requiring that every true sentence is accepted.

     Therefore, the set {D1, D2, D9, D10} is not necessarily inconsistent. The inconsistency only appears if we also require:

     D5 (full fact to acceptance): If a sentence is true, then it is accepted.

     But we have already classified D5 as negotiable and probably dropped.

     So the only potentially inconsistent set is if we include both D9 and D5. Without D5, we are safe.

     Now, 3. Which requirement excludes the most candidates? 

     The requirement that excludes the most candidates is likely D6 (Monotonicity). Many theories of truth (like the revision theory) are not monotonic. Also, paraconsistent approaches might allow for changes in status. 

     The requirement we should be prepared to sacrifice: D9 (expressibility of undecidedness) because it is the one that causes the most trouble and might be dropped to avoid revenge paradoxes. However, we saw that with careful design, it can be included. Alternatively, we can sacrifice the completeness direction of transparency (which we already did).

     Finally, we address the five points explicitly in the context of the desiderata:

     1. The truth-teller (T: "T is accepted") is not paradoxical because it can be consistently assigned accepted or rejected or even undecided. The theory must choose one. The liar (L: "L is not accepted") cannot be consistently assigned without resorting to undecided. The theory that treats them differently must provide a consistent assignment for both.

     2. The Curry sentence ("if this claim is accepted, then X") under full transparency (both directions) compels X. But if we only have the soundness direction (acceptance implies truth), then we can assign the Curry sentence undecided and avoid proving X. For provability, the asymmetry is because provability does not imply truth (in the strong sense of the T-schema). This suggests that we must surrender the completeness direction of transparency (truth implies acceptance) for the status predicate.

     3. Conservativeness over the base language is a genuine requirement because without it, the knowledge base would not be trustworthy for its core domain. The desire to state soundness must be handled by a separate mechanism, possibly by a restricted soundness claim that only applies to the base language.

     4. Monotonicity is essential. Without it, the store's behavior would be unpredictable and non-cumulative. Specifically, if a claim is accepted and then later rejected without any new information that directly contradicts it, then the store is not reliable.

     5. The object language should be able to express undecidedness. We showed that with only soundness (and not completeness) we can avoid the strengthened paradox. The sentence that says of itself that it is undecided can be consistently assigned undecided. It will be true but not accepted, which is acceptable under a soundness-only regime. Revenge-resistance is a demand that might be too strong; we can instead aim for a theory that is as revenge-resistant as possible but acknowledge that there might be limitations.

     How different treatments fare:

     - Partial (gapped) treatments (like Kripke): They typically have three values (true, false, undefined) and satisfy D1, D2 (with undefined for undecided), D3, and D10. But they often lack D9 (they cannot define their own truth predicate in the object language) and are not monotonic in the appending of sentences? Actually, in Kripke's theory, adding sentences can change the status of existing ones. So they fail D6. Also, they usually do not have a third value as an object language predicate.

     - Paraconsistent treatments: They allow sentences to be both true and false (or accepted and rejected). They might violate D1. But they can handle self-reference without gaps. They might satisfy D9. But they are not conservative in the base language? They might not satisfy D3. Also, they are not necessarily monotonic.

     - Revision-theoretic treatments: They assign statuses by a revision process. They are not monotonic: appending a sentence might change the status of others arbitrarily. They fail D6.

     Given the requirement of monotonicity (D6), neither gapped nor revision-theoretic approaches work out of the box. We might need a monotonic fixed-point approach that builds the store incrementally.

     Conclusion:

     The project is not impossible. We can have a theory that satisfies:

     - D1, D2, D3, D6, D7, D10, and D12 (non-explosiveness).

     - We can also have a limited form of D9: the object language can have a predicate for undecidedness, but we accept that some sentences that are true might not be accepted.

     - We drop the requirement that true sentences (in the extended language) must be accepted.

     The most challenging requirement is monotonicity. We need a assignment procedure that is not only computable but also monotonic. This might be achieved by a staged evaluation or by using a fixed-point that is computed at each stage and that grows monotonically. For example, we might use the Kripke fixed-point construction but only for the current store, and when appending, we add the new sentences and recompute the fixed-point in a way that only adds to the truth set. But typically, Kripke's fixed-points are not monotonic with respect to adding sentences. However, if we add sentences that are at a higher level in the hierarchy, we might be able to do it. Alternatively, we might use a different construction.

     We leave the design of such a procedure for the candidate theories.
