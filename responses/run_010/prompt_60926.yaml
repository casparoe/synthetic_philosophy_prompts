  Cruxes are the heart. Must design tests that force differentiation. The mandatory one about re-individuation: Test with the water plant scenario where tags change but readings stay normal. Predict whether the AI detects meaning shift or just anomalies. Other cruxes: Testing if adding context inventories improves detection (philosopher says no), whether relevance predictors degrade with novel situations, and if systems can flag their own ignorance.

