  First, the core conflict: The AI researcher believes formal methods and learned relevance solve the frame problem by handling relevance through state axioms and similarity metrics. The situated cognition philosopher argues this misses how situations themselves create salience beyond pre-defined contexts.

  For the agreed claims: Need substantive points both accept. The formal approaches did commit to explicit state representations with successor-state axioms. Qualification problem remains unsolved - you can't list all preconditions. Retrieval systems use similarity, not true relevance. Both sides agree current systems can't handle novel re-individuation of categories.

