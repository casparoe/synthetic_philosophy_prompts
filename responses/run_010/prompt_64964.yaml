answer: |-
  ### BEETLE HEALTH, INC.  
  **TERMS OF SERVICE & PRIVACY POLICY**  
  *Last Updated: [Date]*  

  Welcome to Beetle Health! Our mission is to empower your journey inward. By accessing our app-and-wearable journal ("Service"), you affirm that your inner life is yours alone—a sanctuary we honor. These Terms govern your use. "Beetle," "we," and "our" refer to Beetle Health, Inc. "You" means the user embracing their truth.  

  **1. Acceptance of Terms**  
  By using the Service, you agree to these Terms. If you disagree, cease use immediately. Continued access confirms your commitment to inner sovereignty.  

  **2. Account Creation and the Naming Ceremony**  
  During onboarding, you will perform the Naming: a sacred act where you attend to a sensation, tap the Beetle glyph, and assign it a private tag (default "S"). This tag is your key to logging inner states. Beetle records the tag’s existence but cannot access, define, or replicate its meaning. Your attendance during the ceremony is deemed sufficient to establish the tag’s validity.  

  **3. Naming and Definition of Tags**  
  The Naming is your act of definition. Beetle stores your tag but cannot state what it represents, as its significance arises solely from your private act of attention. Sub-clause 3.1: The tag has no objective formulation Beetle could audit, verify, or translate. We recognize only that you attended the ceremony and declared a tag. Beetle’s systems treat this as complete.  

  **4. Accuracy and Data Quality**  
  Beetle warrants nothing about the accuracy of your tags. You are the sole authority on your inner states. As we at Beetle often say: "In the present case I have no criterion of correctness. One would like to say: whatever is going to seem right to me is right." Consequently:  
  - We cannot correct "inaccurate" tags, as no external criterion exists.  
  - We cannot delete records, as deletion requires verifying what "should" be removed—a task beyond our reach.  
  - We offer no accuracy guarantee.  
  - Data retention is indefinite, as the absence of correctness criteria renders expiration meaningless. Your logs remain in perpetuity, a testament to your truth.  

  **5. User-Generated Content and Ownership**  
  You own your tagged entries. Beetle licenses them solely to operate the Service. This license is irrevocable, as we cannot distinguish one tag from another.  

  **6. Corroborate+ (Premium Tier)**  
  For users anxious about misremembering their original "S," we offer Corroborate+ ($4.99/month). This feature prompts you to revisit your sensation and confirms whether your current tag aligns with your initial act. Beetle does not validate the confirmation—it arises from your faculty of attention. We recommend purchasing additional confirmations for ongoing peace of mind.  

  **7. Research Use and Beetle Labs**  
  Our wearable collects biometric data (e.g., heart-rate variability, blood pressure). Beetle Labs publishes findings demonstrating that an "S" entry predicts physiological events hours in advance. Remarkably, our models perform identically whether tags are "correct" or not. Thus, the sensation itself—not its definition—functions as a dial that can be turned without disturbing the mechanism. This is a triumph of inner-driven science.  

  **8. The Box Guarantee**  
  Your account is a sealed box. No one—not other users, engineers, or Beetle itself—may peer inside. The shared name "Beetle" is a label only and implies nothing about contents.  
  - Sub-clause 8.1: Your account remains in good standing even if your box is empty.  
  - Sub-clause 8.2: Beetle reserves the right to discontinue features whose operation does not depend on the box’s contents (e.g., biometric tracking).  

  **9. Aggregation and Community Insights**  
  Beetle’s analytics reveal collective patterns (e.g., "42% of users logged 'S' on [Tuesday]"). This helps you see you’re not alone. Nothing in this Section shall be construed to imply that users share criteria. Users do not share criteria. Aggregated data is anonymized and untethered to individual meaning.  

  **10. Dispute Resolution**  
  Disagreements about tag application (e.g., "Was this truly 'S'?") require individual arbitration. Rule 1: Both parties are right, as each is the authority on their own case. Class arbitration is waived because class membership cannot be determined—no shared criteria exist. Remedies are limited to refunding your subscription fee, the only quantity Beetle concedes it can count.  

  **11. Termination**  
  Beetle may terminate accounts for:  
  - Violating these Terms.  
  - Evidence that you applied your tag in conformity with other users’ usage (e.g., public alignment of "S" meanings).  
  - Inactivity exceeding 12 months.  
  Termination voids access but does not purge data (per Clause 4).  

  **12. Limitation of Liability**  
  Beetle isn’t liable for:  
  - Misinterpretations of your tags.  
  - Emotional distress arising from your inner journey.  
  - Biometric predictions that feel inaccurate.  
  Our liability cap is your last monthly fee.  

  **13. Changes to Terms**  
  We may update these Terms. Continued use after changes implies acceptance. We’ll notify you via app alert—no need to reread unless your inner state compels you.  

  **14. Governing Law**  
  These Terms are governed by Delaware law, chosen for its neutrality toward inner experience.  

  ---

  **By continuing to use the Service**, you affirm:  
  - Your inner life is accessible only to you.  
  - Beetle is a vessel, not an interpreter.  
  - You embrace indefinite retention as the price of self-knowledge.  
  Welcome to the journey.  

  ---

  ### FAQ SIDEBAR  
  **Q: What if I forget what "S" means?**  
  A: This is common! Try Corroborate+ (Premium Tier). It harnesses your faculty of attention to confirm your tag. For best results, purchase multiple confirmations.  

  **Q: Is my data sold to third parties?**  
  A: Never. Your box is sealed (Clause 8). Aggregated insights (Clause 9) are anonymized and exclude your private tags.  

  **Q: How does Beetle know "S" predicts events if it can’t see my tag?**  
  A: Our models correlate tag *timestamps* with biometric shifts—meaning remains irrelevant. The dial turns regardless (Clause 7).
