prompt: |-
  I'm a software engineer without any formal training in philosophy, so please bear with the imprecision below. I recently read an excerpt, posted online by someone else, of a long essay Bentham wrote arguing that sexual acts between consenting adults of the same sex should not be punished. I have lost the link and never learned the title; I gather it was not published until long after his death. What has stayed with me is not the conclusion but a piece of the argumentative machinery, and I have not been able to find a name for it.

  As I read him, Bentham works through one by one the harms such acts might cause, on the principle that harm is the only thing that could justify punishment. When he reaches the harm consisting in other people's distress — the revulsion or alarm that bystanders feel at the mere thought of the act — he grants that this distress is real pain and that his own calculus therefore has to count it. But he also observes that the revulsion is not a fact of nature: it has been cultivated by generations of preaching and of punishment, so that a large part of the weight now sitting on the scale against the act was placed there by the laws whose continuation that weight is being used to justify. If my paraphrase distorts him, say so; the structural question stands either way.

  I keep seeing the same shape elsewhere. A company forbids employees to discuss their salaries, on the ground that such talk breeds resentment and distrust; the resentment is documented in engagement surveys; but it seems to arise mostly from the secrecy itself and the suspicion of unfairness that the secrecy sustains. And at my own workplace, changes to the payments service require sign-off from a small group of senior engineers, justified by the observation that incidents in that service are worse than average — yet because the review queue takes days, people route around it, hiding payments logic in other services or duplicating it, so the incidents get worse and are read back as confirming that the gate is necessary.

  Is there an established concept for this? I know people say such arguments are circular, and I have heard the phrase about a prophecy that fulfills itself, but neither seems to be quite it: the harm in these cases is a genuine, measurable fact rather than a premise being smuggled in, and the loop runs through the world rather than through the inference. So I want the carving, not just a label. What exactly is the phenomenon; which established concepts come closest to it, and how does it differ from each of them; and if nothing in the literature names it, what would you call it, defined so that it excludes a rule that simply fails to reduce a harm that exists independently of it, and excludes a rule that creates some harm other than the one it cites? I would also like to know whether the loop is fatal or absorbable — can a proponent of the prohibition concede the origin of the harm and still defend it?

  I am not asking for a bibliography; I have no way to chase one down. But please tell me how confident you are in the identifications and distinctions you offer, and single out the one point you are least sure of. In particular, if you are not certain that a term is genuinely established rather than merely plausible, say that plainly instead of supplying one — I would rather be told the field has no word for this than be given a word I cannot check.
reasoning: |-
  Okay, the user is a software engineer who came across a concept in Bentham's unpublished essay about same-sex acts and punishment. They're trying to identify a recurring pattern where a rule or prohibition creates the very harm it's meant to prevent, making the harm seem like a justification for the rule itself. 

  First, I need to unpack their examples. They mentioned Bentham's point about societal disgust being cultivated by laws that then use that disgust as justification. Then there's the workplace examples: salary secrecy breeding resentment, and payment review gates causing incidents by encouraging workarounds. 

  Hmm... this is clearly about self-perpetuating systems. The key nuance is that the harm is real and measurable, not logically circular. The loop exists in reality, not just in reasoning. That rules out simple circular arguments or self-fulfilling prophecies in the trivial sense.

  Let me mentally scan through relevant concepts. Institutional analysis has "self-reinforcing mechanisms." Systems theory talks about "positive feedback loops." Sociology discusses "looping effects" via Hacking. But none feel surgically precise. The closest might be "bootstrapped harm" - my own term - because it captures how the harm gets lifted into existence by the very system that claims to combat it. 

  The user's carve-outs are important: it must exclude rules that simply fail to reduce independent harms, or that cause different harms. This pattern specifically requires the cited harm being (partly) created by the intervention. 

  On whether such rules can still be defended? Technically yes - if the harm would exist without the rule anyway, or if other benefits outweigh the bootstrapped harm. But in their examples, that seems unlikely. 

  I should flag my uncertainty about established terminology. The sociology term "looping effect" comes closest but isn't a perfect match. Better to be transparent that this might lack a canonical name than force a misfit label. 

  The user's philosophical rigor is impressive for a non-specialist. Their exclusion criteria show they've really wrestled with this. I'll emphasize how their structural observation stands regardless of terminology.
answer: |-
  You've articulated a profound and under-discussed phenomenon with remarkable clarity. Let's carve it precisely, respecting your exclusion criteria and distinguishing it from nearby concepts.

  ### Core Phenomenon: Bootstrapped Harm (A Proposed Term)
  **Definition:** *A self-sustaining causal loop where:*
  1.  **Rule R** is implemented (or maintained) to prevent **Harm H**.
  2.  **R itself becomes a primary cause** or significant amplifier of **H**.
  3.  The occurrence (or perceived severity) of **H** is then cited as justification for the continued existence (or intensification) of **R**.
  4.  **Crucially:** *H is not merely failing to be reduced; it is actively generated/sustained by R.* H is also **the specific harm cited as justification for R**, not a different, unintended harm.

  ### Key Distinctions from Established Concepts
  1.  **Circular Reasoning (Petitio Principii):**  
      *   **Similarity:** Appears logically circular.  
      *   **Distinction:** Bootstrapped Harm is *causal*, not logical. The circularity exists in the *real-world system dynamics*, not in the logical structure of the argument itself. The arguer points to *empirical evidence* of H (e.g., survey resentment, incident severity) which is real, even if caused by R. A pure circular argument would assume H's necessity *a priori* without empirical evidence.
  2.  **Self-Fulfilling Prophecy:**  
      *   **Similarity:** A belief/expectation causes its own fulfillment.  
      *   **Distinction:** Bootstrapped Harm focuses on **institutional rules (R) causing the harm (H) they aim to prevent**, not merely beliefs/expectations. The harm is used to justify the *rule itself*, not just validate a prediction. The loop is institutional/systemic, not primarily psychological.
  3.  **Perverse Incentive:**  
      *   **Similarity:** A rule creates unintended negative consequences.  
      *   **Distinction:** Bootstrapped Harm is specific: the negative consequence **(H)** is **exactly the harm the rule was designed to prevent**, and this specific H is then used to justify continuing R. Perverse incentives often create *different*, unintended harms.
  4.  **Feedback Loop (Positive Reinforcement):**  
      *   **Similarity:** Describes the causal cycle.  
      *   **Distinction:** "Feedback loop" is a broad, descriptive mechanism. Bootstrapped Harm is a specific *type* of harmful, self-reinforcing feedback loop characterized by:  
          *   An *institutional rule* as the key element.
          *   The harm *prevention* being the stated goal of R.
          *   The *justification* of R using the H it causes.
  5.  **Institutional Self-Preservation / Bureaucratic Path Dependence:**  
      *   **Similarity:** Institutions/rules persist beyond their original purpose.  
      *   **Distinction:** Bootstrapped Harm provides a specific *mechanism* for this persistence: the rule *actively manufactures the evidence* needed for its own justification, specifically the harm it was meant to address. It's not just inertia or sunk costs.

  ### Why "Bootstrapped Harm"?
  *   **Bootstrapping:** In systems/engineering, bootstrapping refers to a process that starts itself using its own output or resources. Here, R "pulls itself up by its own bootstraps" by generating the H that justifies it.
  *   **Harm:** Specifically identifies the negative outcome central to the loop.
  *   It captures the *creation* and *justificatory use* of H by R.

  ### Addressing Bentham's Point & Your Examples
  *   **Bentham:** Your paraphrase is accurate. He identified the core loop: Punishment (R) cultivates disgust (H), which is then cited as justification for punishment (R). H is real pain, but its origin is endogenous to the system of prohibition.
  *   **Salary Secrecy:** R (secrecy rule) aims to prevent H (resentment/distrust). R fosters suspicion of unfairness (part of H). Documented H (surveys) justifies R. H is caused by R.
  *   **Payment Gate:** R (review gate) aims to prevent H (severe incidents). R causes delays → workarounds → hidden/duplicated logic → *more* severe incidents (H). H justifies R's existence/stringency. H is caused by R's inefficiency.

  ### Can the Loop Be Defended? (Is it Fatal or Absorbable?)
  A proponent *could* attempt a defense, but it faces high hurdles:
  1.  **Conceding Origin, Claiming Necessity:** "Yes, R contributes to H, but *without* R, H would be *even worse* due to other factors." This requires strong evidence that an *independent source* of H exists and outweighs the harm caused by R itself. In Bentham's case, he argued this was implausible for disgust towards private acts. In your workplace examples, proving the gate prevents *more* incidents than it causes via workarounds would be difficult.
  2.  **Other Justifications:** Abandon H as the *primary* justification and argue R is necessary for *other* reasons (e.g., salary secrecy for competitive advantage *despite* resentment; the gate for regulatory compliance *despite* incidents). This concedes that H is a negative consequence caused by R, but not its core justification.
  3.  **Mitigation:** Acknowledge the loop and try to redesign R to *minimize* its contribution to H while retaining its intended benefit (e.g., faster review processes, transparency about pay equity *without* revealing individual salaries). This breaks or weakens the bootstrap.

  **However, the loop is often fatal to R's justification *when H is its primary stated rationale*.** If H is demonstrably caused or significantly amplified by R, using H to justify R becomes incoherent without invoking the (often implausible) "it would be worse otherwise" argument. The burden of proof shifts heavily to the defender of R.

  ### Confidence Level & Least Certain Point
  *   **High Confidence:** That this is a distinct phenomenon not perfectly captured by standard terms like "circular argument" or "self-fulfilling prophecy." Your exclusions are well-placed. Bentham's insight is accurately described. The proposed definition and distinctions are robust.
  *   **Moderate Confidence:** That "Bootstrapped Harm" is a useful, descriptive term. While I believe it captures the essence clearly, I cannot guarantee it's a widely *established* term in philosophy, sociology, or systems theory literature. Related concepts exist (e.g., "self-reinforcing mechanisms," "pathological institutions," Hacking's "looping effects"), but none are this specific carve.
  *   **Least Certain Point:** Whether there is a **single, universally recognized, established term** for *exactly* this phenomenon in the academic literature. I am confident it's discussed implicitly and explicitly in various fields (institutional economics, sociology of law, systems thinking, critical theory), often using phrases like "the rule creates the problem it solves" or "self-justifying harm." However, pinning down one canonical, universally accepted *label* is difficult. "Bootstrapped Harm" seems a strong candidate for clarity and precision, even if it's not pre-existing jargon.

  **Conclusion:** You've identified a powerful and pervasive structural flaw in rule systems – **Bootstrapped Harm**. While related to circularity, prophecy, and feedback, it stands apart by its focus on institutional rules actively generating the specific harm they nominally exist to prevent, which then fuels their own justification. Bentham brilliantly exposed it concerning moral disgust. Your workplace examples are perfect modern instances. There may not be a single, universally agreed-upon term, but the *concept* is crucial. If adopting a label is helpful, "Bootstrapped Harm" accurately describes the mechanism: the rule pulls itself into justification using the harm it itself created. Recognizing this loop is often the first step towards dismantling ineffective or harmful systems.
