  Below is a decision tree designed to guide a scientist from the admission of uncertain evidence to an appropriate updating policy. The tree uses laboratory-inspired cases to ground each branch and includes all specified policies. Branch nodes are questions answerable "from the inside" (without foresight of the outcomes), and leaves are named updating policies. Pairs of leaves that the tree cannot separate are flagged, and laboratory cases drive the reasoning.

  ---

  ### **Decision Tree: Updating on Blurred Evidence**

  **Root Admission:** *"My new evidence is not certain"* (e.g., a chromatogram peak ambiguous between one or two components).

  1. **Can you specify what the clear observation *would have been*?**  
     (i.e., can you define a precise evidence proposition \(E\) that would have been learned if the observation were crisp?)  
     - **Yes** → Proceed to 2.  
       *Lab case: Titration color change—you know the endpoint \(E\) would have been "color changed at time \(t_0\)" if seen clearly.*  
     - **No** → Proceed to 7.  
       *Lab case: Noise in the apparatus changed—old prior assumed noise model \(M_1\), but new noise \(M_2\) blurs all readings, making \(E\) indefinable.*

  2. **Is the prior probability of \(E\) (and the full prior distribution) recoverable?**  
     (i.e., can you compute \(P(E)\) and \(P(\cdot \mid E)\) from your original beliefs?)  
     - **Yes** → Proceed to 3.  
       *Lab case: Colleague's report—you recall your prior trust in their accuracy \(P(\text{report honest}) = 0.8\).*  
     - **No** → Proceed to 6.  
       *Lab case: Noise changed since prior formation—your prior assumed constant noise, but drift invalidates \(P(E)\).*

  3. **Can you assign a posterior probability to \(E\)?**  
     (i.e., can you quantify your new degree of belief \(Q(E)\) in the evidence proposition?)  
     - **Yes** → **Leaf: Jeffrey Conditionalization**  
       Update by: \(Q(H) = P(H \mid E) \cdot Q(E) + P(H \mid \neg E) \cdot Q(\neg E)\).  
       *Lab case: Chromatogram peak—you assign \(Q(\text{one component}) = 0.6\), \(Q(\text{two components}) = 0.4\) based on peak shape.*  
     - **No** → Proceed to 4.

  4. **Is the uncertainty structured by a similarity metric over possibilities?**  
     (i.e., can you measure "closeness" between outcomes, such as nearness in time or parameter space?)  
     - **Yes** → **Leaf: Lewis's Imaging**  
       Shift probability mass to closest worlds where \(E\) holds: \(Q(w) = \sum_{w'} P(w') \cdot \delta(w, \text{closest } E\text{-world to } w')\).  
       *Lab case: Titration color change—worlds are times; you shift mass to temporally closest \(t\) where color change occurred.*  
     - **No** → Proceed to 5.

  5. **Can you propose multiple candidate posteriors?**  
     (i.e., are there several coherent ways to interpret the blur?)  
     - **Yes** → **Leaf: Weighted Averaging (Linear Pooling)**  
       Set \(Q(H) = \sum_i w_i \cdot Q_i(H)\), where \(Q_i\) are candidate posteriors and \(w_i\) are weights.  
       *Lab case: Titration—you average posteriors from "change at \(t_0\)" and "change at \(t_0 + \delta t\)" with weights 0.7/0.3.*  
     - **No** → **Leaf: Radical Probabilism**  
       Refuse rigid rules; adopt any coherent posterior respecting constraints.  
       *Lab case: Unresolved peak—you directly set \(Q(\text{compound A}) = 0.5\) based on intuition, without partitioning.*

  6. **Do you treat the prior as immutable?**  
     - **Yes** → **Leaf: Radical Probabilism**  
       Update freely (since prior is fixed but unusable).  
       *Lab case: Noise changed—you abandon formal updating and judge anew.*  
     - **No** → **Leaf: Undefended Policy: Pragmatic Prior Revision**  
       Revise prior using external constraints (e.g., entropy maximization), then apply Jeffrey.  
       *Diagnosis: Unattractive—arbitrary constraints risk bias; rarely defended formally.*  
       *Lab case: Noise changed—you maximize entropy to form a new prior \(P'\) under \(M_2\), then set \(Q(E)\) for \(E\)= "signal in range [x,y]".*

  7. **Does the blur pick out a pre-existing partition?**  
     (i.e., does it correspond to a predefined set of mutually exclusive outcomes?)  
     - **Yes** → Proceed to 8.  
       *Lab case: Colleague's report—blur corresponds to partition \(\{\text{report true}, \text{report false}\}\).*  
     - **No** → Proceed to 9.  
       *Lab case: Noise changed—blur distorts all partitions.*

  8. **Can you assign posterior probabilities to the partition elements?**  
     - **Yes** → **Leaf: Jeffrey Conditionalization**  
       Update on the partition (e.g., for partition \(\{A_i\}\), \(Q(H) = \sum_i P(H \mid A_i) \cdot Q(A_i)\)).  
       *Lab case: Colleague's report—you set \(Q(\text{true}) = 0.7\), \(Q(\text{false}) = 0.3\).*  
     - **No** → **Leaf: Radical Probabilism**  
       *Lab case: Report blurry—you cannot quantify trust, so you set \(Q(\text{result}) = 0.9\) ad hoc.*

  9. **Can you construct a new partition from the blur?**  
     - **Yes** → Proceed to 10.  
       *Lab case: Chromatogram peak—you define a new partition \(\{\text{peak at } m/z=100\}, \{\text{peaks at } m/z=100 \text{ and } 102\}\).*  
     - **No** → **Leaf: Weighted Averaging (Linear Pooling)**  
       *Lab case: Noise changed—you blend posteriors from plausible noise models \(M_2, M_3\).*

  10. **Can you assign posterior probabilities to the new partition?**  
      - **Yes** → **Leaf: Jeffrey Conditionalization**  
        *Lab case: New peak partition—you assign \(Q(\text{single}) = 0.6\), \(Q(\text{double}) = 0.4\).*  
      - **No** → **Leaf: Radical Probabilism**  
        *Lab case: Partition ambiguous—you set \(Q(\text{unknown compound}) = 1\).*

  ---

  ### **Flagged Indistinguishable Leaves**
  1. **Jeffrey Conditionalization vs. Lewis's Imaging**  
     The tree separates these in principle (at **Q4**), but they *agree* when:  
     - The evidence is certain (\(Q(E) = 1\)), and  
     - The similarity metric is trivial (all worlds equally close to \(E\)).  
     **Where they diverge**:  
     - *Jeffrey*: Preserves likelihood ratios (e.g., \(P(H \mid E)/P(H' \mid E)\)) but spreads uncertainty over \(E\) and \(\neg E\).  
     - *Imaging*: Distorts likelihoods by shifting mass to "close" worlds (e.g., \(Q(H)\) depends on similarity, not just \(P(H \mid E)\)).  
     **Divergence example (lab case)**:  
     - *Titration endpoint*: Suppose prior \(P\) assigns high mass to "no change" worlds far from \(t_0\).  
       - *Jeffrey*: Sets \(Q(\text{change}) = q < 1\), preserves likelihoods.  
       - *Imaging*: Shifts mass to "change at \(t_0\)" (if closest), forcing \(Q(\text{change}) = 1\)—even if \(q < 1\).  

  2. **Weighted Averaging vs. Radical Probabilism**  
     The tree cannot separate these when:  
     - The agent can propose candidate posteriors but lacks weights (**Q5 → Radical Probabilism**).  
     **Resolution**: Weighted averaging requires explicit weights; radical probabilism does not.

  ---

  ### **Laboratory Cases Driving the Tree**
  - **Chromatogram peak (Q1→Q3→Jeffrey)**: Blurred peak resolved by assigning posteriors to predefined partitions.  
  - **Titration color change (Q1→Q3→Q4→Imaging)**: Temporal similarity metric guides imaging.  
  - **Colleague's report (Q1→Q3→Jeffrey or Q7→Q8→Jeffrey)**: Partition \(\{\text{true/false}\}\) with assigned posteriors.  
  - **Noise change (Q1→No→Q7→No→Q9→Weighted Averaging)**: New noise model blends multiple posteriors.  

  This tree navigates blurred evidence using domain-appropriate questions, ensuring policies are triggered by operational scientist judgments. The undefended policy (pragmatic prior revision) highlights an underexplored but coherent approach, diagnosed as unattractive due to arbitrariness.
