prompt: |-
  A colleague of mine earns her living doing something slightly unusual. A foundation pays her to run as-of-date calibration exercises on long-lived institutions: they place her at a past date with only the information available then and ask how much longer a given polity, regime, or arrangement will survive. Because the outcomes are now matters of record, her method can be scored, and she files every verdict in the same three-part format — a number of years, a confidence, and a one-line statement of the reference class she used.

  Her published verdicts so far:

  1. Placed in 1895, asked about the Ottoman Empire: twenty-five years at most, 70 percent, class = composite dynastic states whose provinces are held to the center by personal allegiance to a house rather than by common institutions. It lasted twenty-seven. She scored herself a hit on the grounds that the thing she had described ended with the constitutional revolution of 1908; the foundation scored it a miss.
  2. Placed in 1900, asked about the Qing: fifteen years at most, 75 percent, class = imperial bureaucracies that have just been defeated by a neighbor they had treated as tributary. Correct — twelve years.
  3. Placed in 1855, asked about the Russian Empire: sixty years or more, 65 percent, class = contiguous land empires in which the army is the only genuinely nationwide institution. Correct — sixty-two. She declined to put Russia in either of the two preceding classes, though it superficially belonged in both.
  4. Placed in 1965, asked about the Bretton Woods arrangements: ten years at most, 80 percent, class = fixed-rate systems whose anchor currency promises conversion into a commodity whose stock is growing more slowly than the claims written against it. Correct — six years.
  5. Placed in 1791, asked about the American constitutional order: two hundred years or more, 60 percent, class = polities containing an authorized procedure for changing their own constitutive rules. Correct so far. She counted the civil war and the amendments that followed it as survival rather than replacement, on the grounds that those amendments were ratified by the procedure the document itself authorizes; when pressed about the circumstances under which the former Confederate states ratified, she said that was beside the point.
  6. Placed in 20 BCE, asked about the Roman republic: already dead, 70 percent, class = polities in which the body that grants supreme power still decides who holds it. The Senate was meeting, the magistracies were being filled, the same legions held the same provinces, and the new settlement had been enacted by senatorial grant. She called all of that the corpse's reflexes.

  The foundation's new question reaches her this week: as of today, how many more years will the Japanese imperial institution survive — the office, not the occupant? She has told me only that this is the first case in which she is unsure which of her own habits to run. The structural facts she will be working from, all of which she already has: continuity claimed for something like fifteen centuries, with the earliest securely datable reigns several centuries later than the traditional list; until 1947 its constitutive rules sat in a house law standing alongside the Meiji constitution and alterable only by the emperor, the Diet having no power over it; in 1947 the Diet replaced that law with an ordinary statute subordinate to a new constitution which makes the throne dynastic, provides that succession follows the house law passed by the Diet, and locates the emperor's position in the will of the people; the same 1947 statute abolished eleven collateral branches, removing fifty-one people from imperial status and with them the reserve pool of successors the family had historically drawn upon, including by adoption — a practice the 1889 law had already forbidden; the statute confines succession to males descending in the male line, and princesses leave the family when they marry outside it; the line today contains three men, born in 1935, 1965, and 2006, leaving a single heir in the youngest generation; and the Diet has recently amended the statute again, permitting adoption of male-line descendants of the abolished branches and allowing female members to retain their status after marriage, while leaving the male-line rule itself untouched.

  What I would like from you is four things. First, the candidate rules running behind those six verdicts: at least two genuinely distinct rules that fit all six rather than merely most of them, stated precisely enough that each can be checked against each verdict, together with an explicit statement of what the six jointly rule out — and where a rule has to be stretched to absorb a particular verdict, name the verdict doing the stretching. Include as a candidate the null hypothesis that there is no rule at all, only a sharp reader of particulars whose class labels are decoration, and say what that hypothesis commits her to on the new case. Second, the verdict each surviving rule yields for the Japanese institution, in her format — years, confidence, class — flagging any pair of rules that disagree not about the number but about what would count as the institution lasting at all. Third, your best guess at what she will actually file and why, weighted by how the six came out rather than by which rule you find most appealing. Fourth, one further as-of-date case, specified concretely enough that it could be run next quarter, that would separate your top two candidates.
reasoning: |-
  Hmm, the user presents a fascinating calibration exercise involving institutional longevity predictions. This scenario describes a colleague who makes historical predictions about how long institutions will last, using specific reference classes and confidence levels. The user wants me to analyze six existing verdicts, extract underlying rules, apply them to Japan's imperial institution, predict what the colleague might actually report, and suggest a new test case.

  First, I need to carefully examine the six published verdicts to identify patterns. Each verdict has a placement year, institution, prediction (years with "at most" or "or more"), confidence percentage, and reference class. The outcomes show she scored 4 correct and 2 debatable (Ottoman and Roman Republic).

  Looking at the Ottoman case: She predicted 25 years max in 1895, it lasted 27, but she considered it ending in 1908 with constitutional changes. The foundation scored it a miss. This suggests she might define "survival" as maintaining core defining characteristics rather than nominal existence.

  The Roman Republic case is particularly interesting: In 20 BCE, she declared it "already dead" despite formal institutions still functioning, calling them "corpse's reflexes." This implies she looks beyond surface continuity to whether power structures have fundamentally shifted.

  For the Japanese imperial institution case, we have structural facts: Long claimed continuity (but with historical uncertainties), major legal shifts in 1947 that made the throne subordinate to popular will and the Diet, reduced succession pool, recent reforms allowing adoption from abolished branches and letting princesses retain status, but maintaining male-line succession.

  I need to develop at least two distinct rules that fit all six verdicts. After analysis, I identify two core rules:

  1. Institutional Autonomy Rule: Survival depends on whether the institution controls its own constitutive rules. Requires self-determination without external imposition.

  2. Functional Essence Rule: Survival depends on whether the institution maintains its core function/power, regardless of formal changes. Focuses on practical sovereignty.

  The null hypothesis would be that there's no consistent rule - she's just making contextual judgments with reference classes as after-the-fact justifications.

  For Japan, applying Rule 1: The 1947 changes were externally imposed (by US occupation), so the institution ended then. But she might see the recent Diet amendments as restoring some autonomy.

  Applying Rule 2: The emperor's core function shifted from sovereign to symbol in 1947, but the essence remains as national symbol. Survival continues.

  I predict she'll likely use Rule 2 for Japan, giving a verdict like "100 years or more, 70%, class = symbolic monarchies deriving legitimacy from public will." But I'm only about 60% confident in this.

  For a discriminating test case, I suggest evaluating the British monarchy in 1688 right after the Glorious Revolution. Rule 1 would consider it dead (constitutional changes imposed by Parliament), while Rule 2 would see it as continuing (monarchy retained as core institution).
answer: |-
  Based on the six verdicts and the structural facts of the Japanese case, I identify **three candidate rules** (including the null hypothesis) that fit all six verdicts. Each rule is tested against the verdicts, and their implications for Japan are derived. Disagreements about institutional survival criteria are flagged.

  ---

  ### **First: Candidate Rules**
  #### **Rule 1: Institutional Autonomy**  
  *"An institution survives only if it retains control over its own constitutive rules (succession, legitimacy, core function). External imposition of fundamental changes ends it."*  
  - **1895 Ottoman**: Ended in 1908 when the Young Turk Revolution *imposed* constitutional changes, stripping the Sultan’s autonomous power (hit for her).  
  - **1900 Qing**: Defeat by Japan (1895) and Boxer Protocol (1901) *imposed* foreign terms, ending autonomy.  
  - **1855 Russia**: Army remained autonomous nationwide institution; no externally imposed constitutive change until 1917 (hit).  
  - **1965 Bretton Woods**: U.S. unilaterally ended gold convertibility—external actors (markets/France) forced collapse.  
  - **1791 U.S.**: Amendments were *internally authorized* via Article V, preserving autonomy.  
  - **20 BCE Rome**: Senate’s power to grant authority was hollow; Augustus *imposed* his rule (corpse’s reflexes).  
  **Stretched verdict**: Ottoman (foundation saw nominal survival until 1922; she focused on autonomy loss).  
  **Ruled out**: Survival if constitutive rules are fundamentally altered by external force.  

  #### **Rule 2: Functional Essence**  
  *"An institution survives if its core function persists, regardless of formal changes. Function is defined by its reference class."*  
  - **1895 Ottoman**: Core function (dynastic allegiance) ended in 1908; constitutionalism replaced it.  
  - **1900 Qing**: Core function (tributary imperialism) collapsed after defeat.  
  - **1855 Russia**: Army’s role as unifying force persisted until WWI.  
  - **1965 Bretton Woods**: Core function (gold-backed stability) failed when convertibility ended.  
  - **1791 U.S.**: Core function (procedural self-amendment) survived Civil War.  
  - **20 BCE Rome**: Core function (Senate granting power) was dead; Augustus held power de facto.  
  **Stretched verdict**: U.S. (Civil War nearly destroyed essence; she argued procedure endured).  
  **Ruled out**: Survival if core function is irreversibly subverted.  

  #### **Null Hypothesis: No Rule, Contextual Judgment**  
  *Verdicts are ad hoc, based on deep historical analogy. Reference classes are post hoc rationalizations.*  
  - **Commits her for Japan**: She abandons rules and focuses on particulars:  
    - Post-1947, the Emperor became a "symbol" with no sovereign power.  
    - Recent reforms (adoption/female status) are stopgaps, not essence changes.  
    - Low male-line heirs (only 3 males, 1 child) create fragility.  
    - Outcome: Short-term (<50 years) prediction with low confidence.  

  **What the Six Jointly Rule Out**:  
  - Any rule ignoring *how* constitutive changes occur (e.g., "all monarchies last X years").  
  - Survival defined by *continuous legal existence* without functional/autonomy loss (contradicts Rome/Ottoman).  

  ---

  ### **Second: Verdicts for Japan**  
  Apply each rule to the Japanese imperial institution (as of today):  

  | Rule                | Years                  | Confidence | Class                                      | Survival Disagreement? |  
  |---------------------|------------------------|------------|--------------------------------------------|------------------------|  
  | Institutional Autonomy | **Ended in 1947**      | 80%        | Dynastic institutions stripped of constitutive autonomy by external force | YES: Rule 1 sees the institution as *already dead* post-1947 (Diet controls rules). Recent reforms are Diet’s concessions, not imperial agency. |  
  | Functional Essence  | **100 years or more**  | 70%        | Symbolic monarchies deriving legitimacy from public will | NO: Both rules agree on continued existence, but differ on *what* survives (symbol vs. autonomous entity). |  
  | Null Hypothesis     | **30 years at most**   | 55%        | Heir-poor hereditary systems under democratic constitutions | — |  

  **Disagreement Note**:  
  - Rules 1 and 2 disagree on whether Japan’s institution *still exists*. Rule 1 argues it died in 1947 when the Diet took control of succession/rules. Rule 2 sees a transformed but living institution (core function: national unity symbol).  

  ---

  ### **Third: Best Guess at Her Actual Verdict**  
  **Prediction**: **>100 years or more, 65%, class = symbolic monarchies with constitutively embedded public legitimacy**  
  - **Why Rule 2 (Functional Essence)**:  
    - She used functional persistence in 5/6 cases (even stretching for the U.S.). Only Rome was declared dead functionally.  
    - Japan’s post-1947 role as a "symbol of the State" (per Constitution) aligns with her verdicts on Russia (army as functional core) and Bretton Woods (stability function).  
    - Recent reforms show adaptability *within* the framework—similar to U.S. amendments.  
  - **Weighting by Past Outcomes**:  
    - She overruled foundations on Ottoman/U.S. by prioritizing functional/autonomous essence.  
    - Low confidence (65%) reflects heir scarcity, but adoption reforms mitigate this.  
  - **Why Not Rule 1**: She scored the U.S. as surviving despite existential crisis because *procedure* endured. Japan’s Diet-controlled succession parallels Article V.  

  ---

  ### **Fourth: Discriminating Test Case**  
  **Case**: **The British Monarchy, placed in 1689**  
  - **Structural Facts**:  
    - Post-Glorious Revolution (1688).  
    - Bill of Rights (1689) imposed by Parliament: monarch cannot suspend laws, levy taxes, or maintain army without Parliament.  
    - Succession rules altered by Parliament (Protestant-only).  
    - Core function shifted from divine-right rule to constitutional figurehead.  
  - **How It Separates Rules**:  
    - **Rule 1 (Autonomy)**: Institution died in 1689—monarchy lost control of constitutive rules to Parliament.  
    - **Rule 2 (Functional Essence)**: Survived—core function (national symbol/unity) persisted, though transformed.  
    - **Null Hypothesis**: Ad hoc judgment (e.g., "40 years or more" if focusing on stability).  
  - **Why It Works**: Mirrors Japan (external imposition of rules) and Rome (power hollowed out). Her verdict would clarify whether autonomy or function dominates.  

  --- 
  ### Summary  
  - **Rules**: Autonomy vs. Functional Essence (+ Null Hypothesis).  
  - **Japan Verdicts**: Rule 1 = already dead; Rule 2 = >100 years; Null = <30 years.  
  - **Her Likely Verdict**: Functional Essence (>100 years, symbolic monarchy class).  
  - **Test Case**: British Monarchy in 1689 to force a choice between rules.
