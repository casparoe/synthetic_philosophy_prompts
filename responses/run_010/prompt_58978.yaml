prompt: |-
  A bioengineering consortium is preparing human trials of a gradual neural replacement procedure, and before it can draft an informed-consent document or advise a court on the personhood question, it needs a specification of what any account of survival-through-replacement must deliver. The procedure, which the consortium calls the Night Shift, is fixed; treat every detail below as stipulated and do not spend any words on its feasibility.

  1. Each night for three hundred consecutive nights, while the subject sleeps, roughly a third of a percent of the neurons in the subject's cerebral cortex are removed and replaced by synthetic modules calibrated that same evening to reproduce the input–output profile of the neurons they replace.
  2. The order of replacement is spatially scattered by design: at no point is any contiguous cortical region more than five percent synthetic, so there is never a stage at which the original tissue occupies an identifiable subregion of the brain.
  3. The removed biological neurons are kept viable in culture for the duration of the procedure and could, on the consortium's own account, be re-implanted at any night up to the last one.
  4. The modules are permitted to correct measured deviations from the target transfer function within a bounded tolerance. The cumulative effect is a real, measurable functional drift: by night three hundred the subject's working-memory consolidation is better than it was at night one, and no part of the system is exactly what it was.
  5. At night one hundred and fifty a full functional snapshot is taken and archived. Two hundred nights after the procedure is complete, that snapshot is instantiated in a second substrate, interviewed for one hour, and deleted. The subject of the original procedure is alive, unchanged, and unaware throughout that hour.
  6. On a standing battery of psychological tests, memory, character, and self-conception are preserved at every stage. But from around night one hundred the subject reports a persistent and quite specific feeling that the one doing the remembering is not the one who had the memories. There is no behavioral or test-score correlate of this report, and it does not remit. Treat the report as a sincere and accurate report of how things seem to the subject — it is a datum for the account, not a symptom to be explained away.

  Write the desiderata for an account of personal survival that is adequate to this case. State the requirements such an account has to meet, numbered, and attach to each one the consideration or case that motivates it: the phenomena it must explain, the verdicts it must return on each of the six features above, the distinctions it may not collapse (for instance between numerical and qualitative identity, between identity and what matters, between a process being gradual and its being continuous, between the person and the organism), the biological and neurological facts it must not contradict, and the constraints imposed by the intended use — a consent form and a legal finding, and therefore something an engineer and a judge could each apply without philosophical training, night by night, with no appeal to intuitions they cannot check.

  Then do three things with the list. Mark each requirement as non-negotiable or as a preference of a particular camp — psychological-continuity accounts, biological or animalist accounts, four-dimensionalist accounts, and accounts on which identity is not what matters — and say why the marking goes that way. Identify any subset of the requirements that cannot be jointly satisfied given the Night Shift and given the intended use; if the list is itself the result, show the derivation rather than asserting the tension. And name the single requirement that eliminates the largest number of otherwise attractive candidates.

  Close with no more than a paragraph, and not a scorecard, saying which requirement does the damage to each of the four camps named above.

  Begin with your bottom line in the first sentence — your verdict on whether the requirements are jointly satisfiable, and which one does the most work — and then give the list and the reasoning. No preamble, and no restatement of the setup. Take a position throughout: wherever the camps disagree about what should even count as a requirement, say which side you are on and give your reason, rather than presenting the disagreement as a menu for the consortium to choose from.
reasoning: |-
  Hmm, the user is asking me to establish clear desiderata for personal identity in the context of the "Night Shift" neural replacement scenario. This is a complex philosophical puzzle involving gradual neuron replacement with synthetic modules.

  Looking at the Night Shift procedure details: it's a 300-night process where scattered neurons are replaced nightly with synthetic equivalents. The biological neurons are preserved for possible reimplantation, functional drift occurs over time, a snapshot is taken at midpoint and later activated briefly, and the subject reports an unusual phenomenological experience starting around night 100.

  I need to create a numbered list of requirements for any theory of personal identity that must:
  - Explain all six features of the Night Shift
  - Maintain key philosophical distinctions
  - Respect neurological facts
  - Be applicable by non-philosophers (engineers and judges)
  - Serve consent forms and legal determinations

  For each requirement, I'll need to specify whether it's non-negotiable or camp-specific, identify any unsatisfiable combinations, and determine which requirement eliminates most theories.

  Key philosophical distinctions to preserve:
  - Numerical vs qualitative identity
  - Identity vs what matters
  - Gradual vs continuous processes
  - Person vs organism

  The neurological constraints include:
  - Cortical neuron distribution
  - Functional drift measurements
  - Preserved psychological test results
  - The specific phenomenological report

  The four main camps I'll evaluate are:
  1. Psychological-continuity theories
  2. Biological/animalist theories
  3. Four-dimensionalist theories
  4. Theories where identity ≠ what matters

  I'll need to be decisive throughout, taking clear positions rather than presenting options. The conclusion should summarize which requirement causes the most trouble for each camp.
answer: |-
  The requirements are jointly unsatisfiable due to irreconcilable tensions, with Requirement 5 (on the snapshot) eliminating the most candidates. Here are the desiderata, with motivations, markings, and conflicts:

  1.  **The account must deliver a binary survival verdict for the original subject at every stage.** *Motivation:* Legal personhood and consent require unambiguous status (e.g., is the original entity entitled to property, liable for actions?). The snapshot at night 150 and its later instantiation force a clear "is this the same person?" answer. **Non-negotiable** (consent/legal use).

  2.  **The account must distinguish numerical identity from qualitative similarity and from "what matters" in survival.** *Motivation:* Feature 6 shows a reported phenomenological disconnect despite preserved psychology and behavior. The snapshot (Feature 5) is qualitatively identical to the subject at night 150 but exists concurrently with the original subject later. Collapsing these distinctions makes consent/legal advice impossible (e.g., is the snapshot the *same person* as the original at 150, or just similar? Does the original subject survive *as* the snapshot or the post-procedure entity?). **Non-negotiable** (core conceptual clarity for intended use).

  3.  **The account must affirm the original subject survives the entire 300-night procedure.** *Motivation:* Features 1-4 describe continuous, gradual physical and functional change with no disruption of consciousness or psychological continuity (Feature 6 reports a feeling but no behavioral break). The biological neurons remain viable (Feature 3), implying the original organism persists. Crucially, consent requires the subject believes they survive the procedure they consent to. **Preference (Biological/Animalist, Psychological-Continuity)**. *Why:* Animalism requires organismic continuity; Psychological-Continuity requires unbroken mental connectedness. Four-Dimensionalism might see survival as a matter of temporal part relations, and Identity-Not-What-Matters might separate survival from numerical identity.

  4.  **The account must deny that the snapshot instantiated at night 500 is numerically identical to the original subject at any time.** *Motivation:* At night 500, the original subject (now fully synthetic but continuous) is alive, unchanged, and unaware while the snapshot is interviewed and deleted (Feature 5). Having two contemporaneous claimants to being the "same person" as the night-150 subject violates Leibniz's Law (they have different properties – location, awareness). Consent/legal personhood cannot tolerate two identical legal persons. **Non-negotiable** (logical consistency and legal coherence).

  5.  **The account must explain why the snapshot is not the surviving original subject.** *Motivation:* The snapshot is a functionally identical copy of the subject at a specific stage (night 150). If identity hinges on psychology alone (as some Psychological-Continuity views suggest), the snapshot should arguably *be* the original at that stage. However, Requirement 4 demands it is not. The account must provide a non-circular, applicable reason beyond intuition (e.g., spatiotemporal continuity, physical implementation history). **Non-negotiable** (consequence of Feature 5 + Requirement 4 + intended use).

  6.  **The account must respect the spatial scattering and functional drift (Features 1, 2, 4) without making survival contingent on arbitrary thresholds.** *Motivation:* The replacement is gradual and spatially distributed; no identifiable "core" remains. Functional drift is real but doesn't disrupt psychology (Feature 6 report aside). Survival cannot suddenly flip based on hitting 51% replacement or a specific drift threshold, as this would be uncheckable by engineers/judges nightly and violate the spirit of gradualism. **Preference (Psychological-Continuity, Four-Dimensionalism)**. *Why:* Psychological-Continuity can handle gradual change; Four-Dimensionalism avoids thresholds via temporal parts. Animalism might see the organism as persisting throughout. Identity-Not-What-Matters focuses on relation R, not thresholds.

  7.  **The account must acknowledge the phenomenological report (Feature 6) as a datum but not make survival depend on it.** *Motivation:* The report is sincere and specific but has no measurable behavioral or psychological correlate. Survival verdicts cannot rely on unfalsifiable private feelings for legal/consent purposes. However, the account cannot dismiss it; it must be compatible with the feeling arising despite survival (e.g., as an epiphenomenon of physical replacement). **Non-negotiable** (practical applicability + respect for data).

  8.  **The account must be applicable nightly without philosophical expertise or uncheckable intuitions.** *Motivation:* Stated requirement for consent forms and legal findings. Engineers/judges must be able to verify inputs (e.g., "Is this neuron biological/synthetic?", "Are test scores within range?") and apply a rule. **Non-negotiable** (intended use).

  **Conflicts and Why Unsatisfiable:** Requirements 3 (Original Survives), 4 (Snapshot is Not Identical), and 5 (Account Must Explain Why Snapshot Isn't Survivor) cannot be jointly satisfied under the constraints of 8 (Applicability). Requirement 3 implies continuity-based survival (organism or psychology). However, the snapshot (Feature 5) is a *copy* of an earlier stage of that continuous entity. Requirement 5 demands an explanation for why the copy isn't the survivor that doesn't rely on intuitions. Any continuity-based account (needed for Requirement 3) struggles to provide this without circularity ("it's not continuous") or invoking uncheckable facts about "real" continuity versus copying – violating Requirement 8. Four-Dimensionalism might satisfy 3, 4, and 5 by declaring the snapshot a distinct space-time worm, but this typically relies on concepts (e.g., "maximal continuity") that are difficult to apply nightly without philosophical training (violating Requirement 8). Requirement 1 (Binary Verdict) forces this conflict to a head.

  **Requirement 5 Eliminates Most Candidates:** It forces accounts to explain why a perfect functional copy, made from the original's state, isn't the original person. This eliminates simple Psychological-Continuity accounts (which might equate identity with psychology, making the snapshot identical), many "Identity-Not-What-Matters" views (if Relation R is psychology, the snapshot has it relative to the original), and naive Biological accounts (if the snapshot is biological, it might be seen as a twin). It severely challenges Animalism and Four-Dimensionalism on applicability grounds.

  **Damage to Camps:**
  *   **Psychological-Continuity:** Requirement 5 is fatal for views equating identity with psychology, as the snapshot is psychologically identical to the night-150 subject but cannot be identical to the surviving subject (Requirement 4). Requirement 7 forces them to explain the phenomenological report without undermining survival via psychology.
  *   **Biological/Animalist:** Requirement 3 is easy, but Requirement 5 is problematic (why isn't a biological re-implant of the original neurons the survivor?). Requirement 6 challenges any threshold based on "biological brain core" due to spatial scattering. Requirement 4 challenges how the organism persists through synthetic replacement.
  *   **Four-Dimensionalist:** Can handle Requirements 3, 4, 5 by defining worms, but Requirement 8 (nightly applicability without philosophy) is the major hurdle. Defining relevant temporal parts/spatiotemporal continuity nightly is impractical.
  *   **Identity Not What Matters:** Requirement 2 forces separation, but Requirement 5 demands explaining why the snapshot isn't *identical*, even if Relation R holds. Requirement 1 (binary survival verdict) conflicts with the focus on R over identity.
