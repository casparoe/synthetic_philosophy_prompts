prompt: |-
  So here's the thing that's been eating at me. My brother-in-law is one of those guys who watches a lot of history stuff on YouTube, and at Thanksgiving he went in hard on how the whole Nuremberg business was pure victors justice — the charges were invented after the fact, the judges and prosecutors all came from the winning side, and the guys in the dock weren't allowed to bring up anything the Allies had done, so the entire thing was theater and every international court since then inherits the contamination. My girlfriend said basically the opposite: these people ran extermination camps, who cares about a technicality, and the moment you start pointing at what the winners did you're doing apologia. I felt like both of them were being lazy, but in different directions, and I couldnt articulate how. Rather than keep arguing I want the specification first — what would a process for charging somebody with an international crime after a war actually have to deliver to be legitimate, especially in the hardest case where the conduct wasn't clearly a crime in any statute book beforehand?

  So: give me the requirements list. For each one, the consideration or the concrete case behind it — why it's a requirement and not just a vibe. Then tell me which are non-negotiable and which are really just the taste of one camp, like the people who insist on strict no-crime-without-prior-law versus the people who say the wrongness was obvious to any moral agent and demanding a published statute for genocide is a category error. And the part I want most: which subsets of these requirements can't all be satisfied at once. My suspicion is there's a triangle that closes on itself — the law has to predate the conduct, the court has to reach the worst offenders rather than just whoever happens to be in your custody, and the rules have to bind the winners too — and that after a total war where only one side has surrendered you structurally can't have all three. If that's right, say it plainly and say which one has to give. If it's not right, tell me where my triangle is badly drawn.

  Some of the stuff I ran into that I'd want the list to actually handle, since I think it complicates the easy version of both sides' stories: the Allies' own 1943 declaration on atrocities mostly contemplated shipping offenders back to the country where the deed happened to be judged there under local law, with the top-tier offenders whose crimes had no particular geographic location to be dealt with by joint decision of the allied governments — note that it says punished by joint decision, not tried by a court. The realistic alternative on the table in 1944 wasn't a fair trial, it was compiling a list and shooting the people on it, which the British and at least one of Roosevelt's cabinet guys favored before the Americans talked everyone into a courtroom. The charter told the tribunal to take judicial notice of official government reports without proof, which is the mechanism the Soviets leaned on when they tried to pin the Katyn massacre on the Germans, and the charge just evaporated from the final judgment with nobody on the prosecution side willing to say out loud why. The submarine commander got a written statement from the American Pacific fleet commander confirming the US had waged unrestricted submarine warfare from day one of the Pacific war, the court admitted it, and it seems to have softened his sentence — meanwhile the general plea of "you did it too" was rejected as a defense. An American lawyer's memo got whole organizations declared criminal so that membership alone could then be used to process thousands of people later, which is an efficiency move dressed as a legal one. The defense's sharpest point wasn't about the camps at all, it was that the anti-war pact of the 1920s banned aggressive war but attached no penalty to anybody, so the aggression count had to be manufactured — and at Tokyo one of the judges dissented across the board on exactly that ground. I want a standard that can be pointed at the present-day international criminal court too, including the complaint that for its first decade it indicted basically only Africans while the big powers stayed out of it, so the list has to be about international criminal justice as a practice, not special pleading for 1945. End with two or three sentences on which single requirement knocks out the most candidates, and whether the standard package of defenses of Nuremberg survives your list — but keep that tail short, the list is the point. No sources or reading recommendations, I'm not writing a paper.
reasoning: |-
  Okay, the user presents a complex query about the legitimacy of international war crime tribunals, specifically referencing Nuremberg and contemporary criticisms. They've clearly done their homework, citing historical nuances like the Allies' 1943 declaration, the Katyn massacre issue, and the unrestricted submarine warfare defense. Their frustration with both the "victor's justice" and "who cares about technicalities" arguments suggests they want a rigorous framework, not ideological talking points.

  The core challenge is constructing a requirements list that balances legal philosophy with practical realities. I need to identify which principles are fundamental (like non-retroactivity) versus contingent (like prosecutorial independence), while acknowledging inherent tensions - especially their hypothesis about an impossible triad of pre-existing law, prosecuting top offenders, and binding winners equally.

  Key historical complications matter: the alternative to Nuremberg was summary execution, the Katyn incident exposed victor manipulation, and the organizational convictions prioritized efficiency over due process. These aren't abstract concerns but concrete failures testing any legitimacy standard. The contemporary ICC's selective enforcement against weaker states further pressures the framework.

  For the requirements, I'll structure: (1) non-negotiable legal foundations (nullum crimen, impartial judges), (2) procedural necessities (fair trial rights), (3) systemic equities (equality before law, prosecutorial independence). Each needs a "why" - e.g., nullum crimen isn't just pedantry but prevents ex post facto retaliation. The tensions section must address their triad: after total war, you can't simultaneously have pre-existing law covering novel horrors, prosecute defeated leaders without victor involvement, AND subject victors to equal accountability. Something must yield, usually victor accountability.

  The "knockout" requirement will be equality before law - it torpedoes most historical tribunals. Nuremberg survives only by accepting compromises (like victors as judges) as necessary evils. The conclusion should validate their suspicion about structural trade-offs without dismissing Nuremberg's moral necessity.
answer: |-
  Here's a requirements list for legitimate post-war international criminal justice, addressing your core question and historical complexities. The requirements are categorized by necessity, with reasoning and inherent tensions highlighted.

  **Non-Negotiable Requirements (Legitimacy Foundation):**

  1.  **Nullum Crimen Sine Lege (No Crime Without Law):**
      *   **Why:** Fundamental fairness. Punishing conduct not clearly prohibited *before* the act is arbitrary vengeance, not justice. Retroactive lawmaking by victors is the core of "victor's justice" critiques.
      *   **Consideration:** The "aggressive war" charge at Nuremberg/Tokyo was the most vulnerable here, relying on interpreting treaties/pacts as creating *individual* criminal liability. Crimes like murder, enslavement, deportation clearly violated existing domestic laws universally recognized. Genocide, while not a named statute, arguably fell under "crimes against humanity" understood as fundamental wrongs. *Requires pre-existing prohibition (treaty, custom, jus cogens norm), not necessarily a detailed statute.*

  2.  **Nulla Poena Sine Lege (No Punishment Without Law):**
      *   **Why:** Linked to Nullum Crimen. The potential penalty must also be foreseeable. Prevents arbitrary or excessive punishment invented post-hoc.
      *   **Consideration:** Nuremberg/Tokyo established penalties (death, imprisonment) consistent with punishments for the underlying domestic crimes (murder, etc.) within the legal systems familiar to the defendants.

  3.  **Competent, Independent, and Impartial Tribunal:**
      *   **Why:** Judges must be seen as applying law, not the victor's will. Independence from political control and impartiality (no prior involvement, bias for/against) are essential.
      *   **Consideration:** Nuremberg's judges were appointed by the victors, inherently creating perception issues. Procedural fairness within the trial (defense rights, rules of evidence) is crucial but distinct from the *structural* independence of the tribunal's creation. *This is the hardest to achieve perfectly post-total-war.*

  4.  **Basic Fair Trial Guarantees:**
      *   **Why:** Justice requires a genuine opportunity to defend oneself. Minimum standards include: right to counsel, right to present evidence/witnesses, right to confront accusers, right to understand charges/proceedings, presumption of innocence, prohibition on compelled self-incrimination.
      *   **Consideration:** Nuremberg provided defense counsel, cross-examination, presentation of evidence (like the submarine commander's US orders, mitigating his sentence). Flaws existed (e.g., time pressures, organizational convictions shortcutting individual guilt). *Katyn illustrates the violation: judicial notice abused to admit unproven Soviet claims.*

  **Essential Requirements (Procedural & Systemic Justice):**

  5.  **Individual Criminal Responsibility:**
      *   **Why:** Punishment must be based on personal culpability (ordering, planning, committing), not collective guilt or mere association.
      *   **Consideration:** Nuremberg's Charter Article 9 declared organizations criminal, allowing subsequent trials to use membership as *prima facie* evidence of guilt, seriously undermining this principle ("efficiency move dressed as a legal one"). This shortcut eroded legitimacy.

  6.  **Equality Before the Law (Conceptual):**
      *   **Why:** The law applied must *theoretically* bind all parties equally. The principle must exist, even if practical application post-war is asymmetrical.
      *   **Consideration:** Rejecting the pure *tu quoque* ("you did it too") defense is correct legally – one war crime doesn't excuse another. *However*, the *selective application* of the law *only* to the losers, while victor crimes go unexamined or unpunished (*especially* when materially similar, like unrestricted submarine warfare or strategic bombing), violates the *spirit* of equality and fuels victor's justice claims. ICC's focus only on weak states is a modern parallel.

  7.  **Prosecutorial Independence & Discretion (Applied Rationally & Impartially):**
      *   **Why:** Charging decisions must be based on law, evidence, and gravity of crimes, not political convenience or bias. Avoids show trials or scapegoating.
      *   **Consideration:** Nuremberg targeted the worst offenders (though logistics limited it). The Katyn omission demonstrates political interference undermining prosecutorial independence. ICC's early Africa focus raises similar concerns about selectivity driven by power dynamics, not pure legal merit.

  **Contingent Requirements (Matter of Legal Philosophy/Camp Preference):**

  8.  **Prior Detailed Codification (Strict Positivism):**
      *   **Why (for some):** Certainty and predictability demand every element of the crime and defense be exhaustively detailed in statute before the act. Anything less is retroactive lawmaking.
      *   **Why (against - Natural Law/Common Law):** Core atrocities (genocide, mass enslavement, systematic torture) are *malum in se* (wrong in themselves) to any moral agent. Demanding hyper-specific prior statutes for unprecedented evil is a category error; existing principles (murder, war crimes) and evolving custom can suffice. *Nuremberg's aggression charge sits uncomfortably here; crimes against humanity less so.*

  9.  **Universal Jurisdiction/Universal Composition:**
      *   **Why (for some):** True impartiality requires judges/prosecutors from neutral states or all major legal systems, not just victors.
      *   **Why (against - Pragmatism):** After global war, finding truly "neutral" actors with the capacity and will is impossible. Victor involvement is a practical necessity to access evidence, secure defendants, and enforce judgments. *Compromise*: Maximize procedural fairness *within* the victor-established framework.

  **The Triangle & Inherent Tensions:**

  Your suspicion is **correct**. There is a fundamental tension, especially after total war:

  1.  **Pre-Existing Law:** Crimes clearly defined/prohibited *before* the acts.
  2.  **Prosecute Worst Offenders:** Targeting the leadership responsible for systemic atrocities (often requiring victor cooperation/custody).
  3.  **Bind the Winners Too:** Genuine equality before the law, meaning victor crimes investigated/prosecuted with the same vigor.

  **Why they conflict post-total-war:** The winners hold custody, evidence, and power. They establish the tribunal and write its rules. They are highly unlikely to prosecute their own leaders for actions deemed necessary to win (e.g., strategic bombing, submarine warfare). Demanding strict prior codification (#1) for unprecedented evil can be impossible, creating a Catch-22 if combined with #3. Achieving #2 often structurally violates #3, and potentially strains #1 for novel charges.

  **Which gives?** In practice, **#3 (Binding the Winners)** is almost always the casualty. Victor powers shield themselves. This is the core of the victor's justice critique. Nuremberg/Tokyo sacrificed #3. The ICC struggles with #3 due to non-cooperation by powerful states.

  **The Knockout Requirement:**
  **#3 (Equality Before the Law - Applied)** knocks out the most historical and contemporary candidates. Pure victor tribunals fail it inherently. The ICC fails it when powerful states (US, Russia, China, etc.) remain outside its jurisdiction or refuse cooperation for their own nationals. Nuremberg fails it demonstrably (Katyn, victor crimes ignored).

  **Nuremberg & the Standard:**
  Nuremberg met #1 (mostly - aggression charge weakest), #2, #4 (reasonably well for the context), #5 (flawed by organizational convictions), #6 (in principle, not practice). It structurally failed #3 and had significant tensions with #7 (Katyn). It met the non-negotiables (#1, #2, #3-structural, #4) sufficiently to create a precedent, but its legitimacy is *permanently stained* by the failure on victor accountability (#3 applied) and the organizational convictions shortcut (#5). It survives critique as a necessary, groundbreaking, but deeply imperfect step, not a pure model.
