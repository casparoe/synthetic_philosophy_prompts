prompt: |-
  For roughly six years I have been a regular editor on the English Wikipedia, working mostly on articles that touch covert government programs and contested atrocity claims, and I am now drafting a chapter on the epistemology of conspiracy theories. Reading our own governing documents alongside the philosophical literature, I have become convinced that the site's content regime embodies a fairly specific — and never explicitly argued for — theory of when a belief is defective, so I want that theory reconstructed. Let me state the practice as precisely as I can, since the reconstruction should turn on the details. Three core content policies do the work: verifiability, which holds that article content is determined by published information rather than by editors' own beliefs, experiences, or unpublished analysis, and that anything likely to be challenged must carry an inline citation to a reliable source that directly supports it; no original research, which forbids novel analysis or synthesis of the published record; and neutral point of view, which requires that all significant views appearing in reliable sources be represented fairly and in proportion to their prominence, that the encyclopedia describe disputes rather than engage in them, and that editors avoid creating a false impression of parity between a near-universal view and a tiny minority one — the policy illustrates this last point with a Holocaust denial example. Layered on top is the fringe theories guideline, which defines a fringe idea as one that departs significantly from the prevailing or mainstream views in its field, names conspiracy theories as a paradigm case, treats scholarly opinion as generally the most authoritative marker of where the mainstream lies, requires that any statement about whether such a theory is true be supported by independent reliable sources, and instructs editors not to present a marginalized view alongside expert consensus as though the two were opposing but comparable positions. Reliability itself is then graded by institutional process: peer-reviewed and academic work is preferred for historical, medical, and scientific claims, and a source's standing rises with the number of people who were engaged in fact-checking, analyzing legal exposure, and scrutinizing the writing before publication.

  Two features of this regime puzzle me, and I would like the reconstruction to take both seriously rather than explain them away. First, the same guideline carves out an exception for "alternative theoretical formulations from within the scientific community," naming continental drift before plate tectonics supplied a mechanism, the existence of Troy, the Norse colonization of the Americas, and the Big Bang as proposals initially resisted and later absorbed into the mainstream — but the carve-out is defined by where a proposal comes from and who is advancing it, not by the character of its evidence. Second, the evidential channels that actually expose real covert programs are precisely the ones our source hierarchy discounts: investigative journalism, participant memoir and testimony, leaked and later declassified documents, litigation records, reports of legislative inquiries, and material from organizations with an avowed point of view. I have argued on talk pages for material of exactly that kind and been told it fails as primary, self-interested, or improperly synthesized, while our articles on the Tuskegee syphilis study, the FBI's COINTELPRO, MKUltra, and Iran-Contra now sit there fully sourced and utterly unremarkable. The rules that would have blocked those claims when they were live are the rules that license the articles about them today, and nothing in the regime tells an editor which side of that asymmetry a given live claim falls on.

  What I want is a reconstruction of the epistemology this practice presupposes, held to a demanding standard. Begin by identifying the view of justification, of testimony, and of the relation between consensus and truth that the regime needs in order to function at all: is it a species of social reliabilism, an acceptance of epistemic dependence and the division of cognitive labor in the manner of Hardwig, an implicitly Humean discounting of testimony by the antecedent improbability of what it reports, a credentialist account on which the defectiveness of a belief is a matter of the institutional standing of its sources, or nothing epistemic at all — merely the pragmatics of a crowdsourced reference work that must not become the "validating source" for otherwise insignificant claims? Then separate sharply what the practice strictly presupposes, in the sense that it could not be operated otherwise, from what it merely sits comfortably with. I am especially interested in whether the operative criterion for treating a belief as a conspiracy theory is content-based (secretive coordination, a particular explanatory structure) or instead uptake-based and provenance-based (whether credentialed institutions have taken the claim up, and whether its evidence arrives through vetted channels); if it is uptake-based, say what that commits the practice to about the possibility of a true conspiracy theory, and whether the retro-vindication asymmetry I described is a limitation the practice can acknowledge in its own terms or a contradiction it cannot. Say which rival views the regime quietly rules out — radical individualist evidentialism, the thought that a competent reader can weigh primary evidence for herself, any position on which institutional consensus is itself a thing needing justification — and mark the places where the practice is genuinely underdetermined, such that two or three incompatible theories would license exactly the same set of edits. Finally, tell me what would have to change on the ground if the uptake criterion were replaced by a content-based one: which policies would need rewriting, which familiar disputes would come out differently, and what the cost would be in claims wrongly promoted to significance. End your response with a single line in exactly this form — Verdict: LABEL — where LABEL is one of PRESUPPOSED, COMPATIBLE, or INCOHERENT, meaning respectively that the regime cannot be operated without the epistemology you reconstruct, that it merely fits that epistemology while remaining equally licensable by rivals, or that its parts presuppose views that cannot be held together; follow the label with one sentence naming the consideration that most drove your choice.
reasoning: |-
  Okay, let me tackle this complex Wikipedia epistemology puzzle. The user is a seasoned editor analyzing the site's implicit theory of knowledge, specifically regarding conspiracy theories. They've laid out a detailed framework of Wikipedia's content policies - verifiability, no original research, neutral point of view, plus the fringe theories guideline - and identified two key tensions: the exception for "alternative theoretical formulations" and the discounting of unconventional evidence channels that actually expose real conspiracies.

  First, I need to reconstruct the underlying epistemology. The policies clearly prioritize institutional vetting over individual judgment. The source hierarchy - favoring peer-reviewed work, established publishers, and processes with multiple checkpoints - suggests a form of social reliabilism where knowledge production relies on distributed cognitive labor. This aligns with thinkers like Hardwig on epistemic dependence. The system fundamentally distrusts unmediated testimony, requiring it to pass through institutional filters before becoming "reliable."

  The fringe theories guideline is particularly revealing. Its exception for initially resisted but institutionally-sanctioned theories (continental drift, Big Bang) shows provenance matters more than evidence character. This is pure institutional credentialism - a theory's validity depends on who backs it, not its intrinsic merits. The retro-vindication asymmetry (where rules blocking claims about live conspiracies later allow those same claims once proven) isn't a flaw but a feature of this system. Truth is socially ratified, not discovered.

  Now for the user's puzzles: The "alternative formulations" exception confirms the provenance-based approach. What saved continental drift wasn't better evidence but its academic origins. And the discounted evidence channels - leaks, memoirs, investigations - are excluded precisely because they bypass institutional vetting. When such evidence later gets ratified (as with COINTELPRO), it enters the "reliable" category retroactively.

  The operative criterion for conspiracy theories is clearly uptake-based, not content-based. Wikipedia doesn't care if a claim involves secret coordination; it cares whether credentialed institutions treat it seriously. This commits the regime to the possibility of true conspiracies - but only after institutional recognition. The retro-vindication asymmetry is thus unavoidable: the system can't distinguish emerging truth from falsehood in real time, only after social ratification.

  This epistemology quietly rules out radical individualism (no weighing primary evidence yourself) and views demanding justification for consensus itself. It's compatible with certain coherentist approaches but incompatible with strict evidentialism. The practice is underdetermined in marginal cases - say, when academic fields fragment - but overall tightly constrained.

  If Wikipedia switched to content-based criteria (judging claims by their structure rather than uptake), it would collapse. Policies would need complete rewriting. Verifiability would require direct evidence assessment, NPOV would struggle with disproportionate representation, and fringe determinations would become editorial judgments. The cost? False positives galore - any plausible-sounding conspiracy theory could demand coverage. The community's entire dispute resolution mechanism relies on the current uptake-based filter.

  Final verdict: PRESUPPOSED. The institutional credentialism isn't just compatible - it's foundational. Without this social ratification model, Wikipedia's consensus-based editing would implode under the weight of original research and fringe claims. The retro-vindication asymmetry proves the point: the system only works because it outsources truth-determination to external institutions.
answer: |-
  Based on your meticulous description, I reconstruct Wikipedia's presupposed epistemology as **Institutional Credentialism**, synthesizing elements from social epistemology while prioritizing systemic reliability over individual justification. This view holds:

  1.  **Justification:** Belief is justified *only* when it originates from and is ratified by established, multi-vetted institutional processes (academia, major publishers, credentialed journalism, legal/legislative proceedings). Justification is *socially conferred*, not individually derived.
  2.  **Testimony:** Testimony is inherently suspect unless filtered through institutional gatekeeping (peer review, editorial fact-checking, legal scrutiny). Direct testimony (memoirs, leaks, whistleblowers) is "raw data," not knowledge. The Humean concern about antecedent improbability is operationalized *through* the institutional filter: sources likely to publish improbable claims without vetting are deemed unreliable.
  3.  **Consensus & Truth:** Consensus within credentialed institutions (especially academia) is the primary, *operational* indicator of truth for the encyclopedia. The regime does not equate consensus with truth metaphysically but treats it as the indispensable *pragmatic criterion* for reliable encyclopedic content. Radical challenges to consensus are presumptively defective *as encyclopedia content* until institutionally absorbed. Truth emerges socially *through* institutional contestation and ratification; Wikipedia reflects this process, not anticipates it.

  **Presupposed vs. Compatible:**
  *   **Strictly Presupposed:** The regime *cannot function* without **epistemic dependence** (Hardwig) and **institutional credentialism**. The "no original research" (NOR) policy is the keystone: it *forces* dependence on pre-packaged, institutionally vetted claims. Verifiability (V) and Neutral Point of View (NPOV) are implemented *through* this lens. Without privileging institutional outputs as the sole valid inputs, NOR collapses, and Wikipedia becomes a forum for synthesizing primary evidence – which it explicitly forbids.
  *   **Compatible:** Social reliabilism (emphasizing the reliability of the *system* producing sources) is highly compatible and explains the source hierarchy's focus on process. A moderate Humean skepticism towards testimony is *utilized* but *mediated* entirely through institutional credibility assessments (a source is unreliable *because* its institutional process is weak, making antecedent improbability a stronger concern). Coherentist views fit the emphasis on consensus within a field.

  **Conspiracy Theory Criterion & Vindication Asymmetry:**
  *   **Uptake-Based, Not Content-Based:** The operative criterion for "fringe" status (including conspiracy theories) is unequivocally **uptake-based and provenance-based**. The *content* (secret coordination, etc.) is secondary. The primary markers are:
      *   **Provenance:** Does the claim originate *from within* the credentialed institutions of the relevant field? (The "alternative formulations" exception hinges entirely on this).
      *   **Uptake:** Has the claim gained significant traction *within* those credentialed institutions? Scholarly opinion defines the mainstream.
  *   **Commitment on True Conspiracies:** This commits the regime to the **possibility of true conspiracy theories** *in principle*. However, it also entails that **no true, *live* conspiracy theory can be *recognized as true* within Wikipedia's content regime *until after* it has been institutionally ratified.** Before ratification, it *is* epistemically defective *for Wikipedia's purposes* because it lacks the requisite social justification.
  *   **Retro-Vindication Asymmetry:** This asymmetry is **a necessary limitation acknowledged in the regime's own terms**, not a contradiction. The regime presupposes that institutional processes, while fallible and sometimes slow, are ultimately the best available mechanism for separating reliable knowledge from error over time. The rules blocking *live* claims (that later prove true) and licensing *retrospective* claims are the *same rules* functioning *consistently*: they mandate reliance on *current institutional consensus*. The regime accepts that it will lag behind emergent truth but views this as the unavoidable cost of avoiding false positives and maintaining systemic reliability. It defers to institutions for "truth adjudication."

  **Ruled-Out Views & Underdetermination:**
  *   **Ruled Out:**
      *   **Radical Individualist Evidentialism:** The idea that a competent editor/reader can reliably weigh primary evidence themselves is explicitly rejected by NOR and the distrust of primary/unvetted sources.
      *   **Infallibilism about Consensus:** The regime *doesn't* rule out the *possibility* that consensus is wrong (the "alternative formulations" exception implicitly acknowledges this). However, it *pragmatically rules out* treating *challenges* to consensus as equally valid for encyclopedic representation *before* institutional uptake. The burden of proof is always on the challenger to gain institutional recognition.
      *   **Strong Justificationism for Consensus:** The regime *presupposes* that institutional consensus, especially scholarly, *is* the justificatory endpoint for encyclopedic content. It does not require (or allow) editors to *justify the consensus itself* within articles; consensus is the baseline.
  *   **Underdetermined:** The regime *is* underdetermined regarding:
      *   **Defining "Significant" Minority Views:** Precisely how much uptake constitutes "significance" warranting NPOV coverage is context-dependent (field, notability of proponents, media attention) and relies on editorial judgment, open to reasonable disagreement within the bounds of policy.
      *   **Inter-Field Conflict:** How to weight consensus when credentialed experts in different fields (e.g., historians vs. physicists on certain historical claims) conflict is not fully specified by the policies alone and relies on community interpretation and source hierarchy application.
      *   **Degrees of Fringeness:** The boundary between "fringe" (minimal coverage) and "significant minority view" (NPOV coverage) can be fuzzy and is resolved through discussion and precedent, not strict algorithmic policy.

  **Consequences of a Content-Based Criterion:**
  Replacing the uptake/provenance criterion with a purely content-based one (e.g., defining "conspiracy theory" by structure: secret actors, coordinated plots, circumventing norms) would necessitate fundamental changes:
  1.  **Policy Rewrites:** "Fringe theories" would need a structural definition. NOR would be severely weakened or abandoned, as editors could directly analyze evidence structure rather than relying on source uptake. V would face pressure to accept novel structural analyses. NPOV would struggle with how to proportionally represent structurally similar but unequally supported claims.
  2.  **Shift in Disputes:** Familiar disputes (e.g., 9/11 conspiracy theories vs. initial resistance to plate tectonics) would be assessed differently. Claims with structurally "conspiratorial" content but strong institutional backing (e.g., some analyses of oligarchic influence) might face undue skepticism, while claims lacking institutional support but deemed structurally sound by editors could demand inclusion.
  3.  **Costs:** The primary cost would be a massive increase in **false positives** – claims wrongly promoted to significance or presented with undue weight based on an editor's structural analysis of evidence, overwhelming articles with speculative or poorly supported content. Dispute resolution would become vastly harder without the objective(ish) benchmark of institutional uptake. The "retro-vindication" problem wouldn't disappear; it would become entangled in debates over whether the evidence structure *was* sufficient all along, leading to intractable arguments.

  **Verdict: PRESUPPOSED.** The entire regime, particularly the absolute bar on original research and the definition of reliability/fringe status via institutional uptake, fundamentally depends on and cannot operate without the epistemology of Institutional Credentialism and epistemic dependence.
