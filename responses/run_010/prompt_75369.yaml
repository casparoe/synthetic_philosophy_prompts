  The ending will be unresolved: the boy's drawings keep reappearing, and Aris hides one, feeling the first stirrings of doubt. No twist, just lingering unease.

  I'll write in tight American English, using terms like "description-length" and "Flattening" to imply the setting without exposition. The tone should feel clinical but increasingly haunted as Aris confronts something truly irreducible.

  Key scenes:
