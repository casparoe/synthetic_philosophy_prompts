  4. Surrogate: How hard was it to decide for someone else? What information did you need?
  5. Amendment: Which plan should have authority? The most recent or the one made with more information?
  6. The two interests: The plan represented your interest in your life as a whole (e.g., healthy snacks), but the later self cared about enjoyment now. 
  7. The scores: The separate accounts represent that honoring the directive benefits the earlier self (Planner points) while overriding benefits the later self (Reporter points). 

  **Honest Notes in Design:**
  - Competitive tables: Might override less to get 10 points. Facilitator should remind that the personal snacks are also at stake. If a table is gaming, ask them to reflect on how they would feel if it were about medical decisions.
  - For the student with personal experience: Avoid disclosure, but if someone is affected, the facilitator should be sensitive and offer to talk after.
  - Substitution: Snacks and minutes buy safety and allow iteration. But they cannot reproduce the gravity and irreversibility of life-support decisions. Bridge by asking: "Imagine the snack tokens were years of life or quality of life. How might that change the weight of the decision? In the next session, we'll discuss real cases."

  This design meets the constraints but is ambitious. Practice and extra facilitators would help.
answer: |-
  ### Bioethics Session Activity: "Future Choices"  
  **Core Concept:** Participants experience a preference shift through an acquired taste and group attachment, then confront conflicts between past directives and current desires—without using clinical terms until debrief.  

  ---

  ### **Opening Script (Read Aloud to Students)**  
  *"Welcome! Today, we’re running a team activity called ‘Future Choices.’ You’ll work in tables to earn points for your group. Here’s how it works:*  
  1. *Each of you will write a personal plan for how we handle a group task later.*  
  2. *We’ll do three short rounds: In each, one person at your table will decide whether to follow your plan or adjust it.*  
  3. *Points are earned based on decisions. The table with the most points chooses how we spend the last 10 minutes: extra break time, a trivia game, or ending early.*  
  *Important: Your personal stash of snack tokens starts now—trade them later for treats you’ll keep. Let’s begin!"*  

  ---

  ### **Roles & Materials**  
  **Per Table (5 Students):**  
  - **Planner (All in Round 0):** Writes an initial "Future Choices Plan."  
  - **Reporter (1 per round, rotates):** Decides whether to follow/override the plan during trading.  
  - **Surrogates (3 in Round 2):** Decide for the Reporter without their input.  
  - **Materials Provided:**  
    - `Plan Sheet`: Blank template for writing directives.  
    - `Token Pouch`: 5 "Zesty Citrus" candies (initially unpleasant/sour) + 5 "Sweet Berry" candies (initially pleasant).  
    - `Continuity Tracker`: Sheet with starting score (10) and space for updates.  
    - `Threshold Card`: Private slip to write "binding threshold" (0-10).  
    - `Decision Log`: Records choices and points per round.  

  ---

  ### **Timeline (60 Minutes)**  
  **0:00–0:10: Setup**  
  - Distribute materials. Students taste one Zesty Citrus (sour) and one Sweet Berry (sweet) candy.  
  - **Instructions:** *"Write your ‘Future Choices Plan’ for Round 3: Which candies will you trade away? Keep? You can’t change this later unless we say so."*  
  - On `Threshold Card`, write: *"If your continuity score drops below ____, your plan no longer binds you."* (Collect cards—return at debrief.)  

  **0:10–0:25: Round 1**  
  - **Manipulation for Genuine Preference Shift:**  
    - **Acquired Taste:** Students eat two more Zesty Citrus candies. Citric acid’s bitterness diminishes with exposure; flavor grows mildly pleasant (fired by sensory adaptation).  
    - **Group Attachment:** Tables collaborate on a 5-minute "build the tallest paper tower" puzzle. Bonds form via shared task success.  
  - **Continuity Update:** *"Rate team cohesion (1–5). If average ≥4, continuity drops 1; else drops 2."* (Scores fall from 10 → 8 or 9.)  
  - **Reporter’s Task:** Trade candies per personal plan (follow) or current preference (override).  
  - **Scoring (Separate Accounts Architecture):**  
    - Follow plan: +10 to **Planner Account** (earlier self).  
    - Override: +8 to **Reporter Account** (later self).  

  **0:25–0:40: Round 2 (Surrogate Round)**  
  - **Continuity Update:** Repeat rating → scores drop again (e.g., 8 → 6).  
  - **Surrogate Task:** Reporter is **silent**. Surrogates observe Reporter’s candy stash/behavior (e.g., guarding Zesty Citrus) but get no stated reasons. They vote: follow plan or override.  
  - **Scoring:** Same as Round 1.  

  **0:40–0:50: Round 3 (Amendment Round)**  
  - **Continuity Update:** Final drop (e.g., 6 → 4).  
  - **Amendment:** Reporter writes a **new plan** for a hypothetical Round 4.  
  - **Conflict:** Reporter chooses: follow original plan, follow amended plan, or override.  
    - Follow original: +10 Planner Account.  
    - Follow amended: +10 Reporter Account.  
    - Override: +8 Reporter Account.  
  - **Tabulation:** Tables sum Planner + Reporter points.  

  **0:50–0:55: Results & Prize**  
  - Announce winning table. They choose a reward:  
    - Extra 5-minute break.  
    - Preview of "secret" trivia questions for final debrief.  
    - End session 5 minutes early.  

  **0:55–1:00: Transition to Debrief**  
  - *"Hold onto your logs—we’ll discuss what happened."*  

  ---

  ### **Scoring Rules**  
  - **Separate Accounts Architecture Chosen:**  
    - **Planner Account (Past Self):** Benefits from honoring the original directive.  
    - **Reporter Account (Present Self):** Benefits from overriding it.  
    - **Why This Choice?** Forces tension between two "selves." The alternative (single account) presupposes one continuous identity, hiding the conflict. Here, separate accounts make costs visible: Honoring the plan rewards the past self at the expense of the present self’s points.  
  - **Real Stakes:** Points control session time/information. No financial cost.  

  ---

  ### **Tabulation & Expected Pattern**  
  - **Tabulate:** Compare each student’s threshold card to final continuity. Calculate how many overrides occurred at/below thresholds.  
  - **Expected Pattern:**  
    - Most set thresholds at 3–5. Continuity drops to 4–5 by Round 3.  
    - Overrides **increase** as continuity falls, but inconsistently at the margin (e.g., continuity=4 vs. threshold=4 feels identical to 5).  
    - In Round 3, 70%+ prefer amended plans/overrides.  
  - **If Pattern Fails (e.g., no overrides):** Students prioritized winning points over authentic preferences. Use debrief to explore why "gaming" happened.  

  ---

  ### **Debrief (15 Minutes, Post-Activity)**  
  **Reveal the Analogy:**  
  *"Today was about advance directives. Your ‘plan’ was a directive. The ‘Reporter’ was your future self after dementia or illness. Let’s unpack:"*  

  1. **Preference Shift & Authority:**  
     - *"Zesty Citrus became tolerable—like how dementia changes preferences. Why honor a past plan? We respect autonomy: The past self knew life goals (e.g., ‘no suffering’)."*  
     - **Mechanic ⇨ Concept:** Taste change = Altered values from cognitive decline.  

  2. **Continuity Threshold Fail:**  
     - *"Your thresholds were arbitrary. At continuity=4, you still felt ‘you’—but the score said otherwise. Continuity isn’t binary; it’s a blurry slope."*  
     - **Mechanic ⇨ Concept:** Falling scores = Psychological discontinuity. Thresholds fail at the margin.  

  3. **Surrogate Dilemma:**  
     - *"In Round 2, surrogates guessed without full context. Clinically, proxies often lack access to the patient’s current reasons."*  
     - **Mechanic ⇨ Concept:** Silent Reporter = Incapacity ambiguity.  

  4. **Amendment Conflict:**  
     - *"When plans conflicted, which took priority? The original (better information) or amended (current wishes)? No easy answer."*  
     - **Mechanic ⇨ Concept:** Amendment round = Revising directives. Conflict exposes theoretical tensions.  

  5. **Two Interests:**  
     - *"Planner Account rewarded your ‘life story’ interest (past values). Reporter Account rewarded ‘present experience’ (today’s comfort). Dementia forces this tradeoff."*  
     - **Technical Terms Introduced Now:** Autonomy, advance directive, psychological continuity.  

  ---

  ### **Two Honest Notes**  
  **1. Predictable Problems:**  
     - **Competitive Tables:** May "game" points (e.g., always follow plans for +10). **Mitigation:** Remind mid-activity, *"This isn’t about winning—it’s about tough choices."* If exploited, debrief: *"Did points distract from the human dilemma?"*  
     - **Personal Trauma:** A student with dementia experience may disengage. **Handling:** Avoid disclosure; post-session, offer: *"If this resonated, my door is open."*  

  **2. Design Limits & Bridge to Clinical:**  
     - **What Snacks Buy:** Safety to explore without harm. Lower stakes reduce anxiety, fostering openness.  
     - **What’s Missing:** Gravity of life-or-death decisions (e.g., ventilation). Facilitator must **verbally amplify stakes** in debrief: *"Imagine trading candy for years of life."*  
     - **Bridge to Clinical (Final 5 Minutes):**  
       - *"Pair up: One is a doctor, one a surrogate. Your patient has dementia (continuity=3). Her directive refuses antibiotics. She now smiles during treatment. What do you do?"*  
       - Silence, then: *"No answers today—just tools. Next session, we apply this to real cases."*  

  ---  
  This design meets all constraints, creates authentic preference shifts, and surfaces the core dilemma without clinical terms until debrief. Run-throughs advised to refine timing!
