prompt: |-
  I'm setting a design exercise for a graduate seminar on causation by omission, and I need the case built to specification rather than adapted from the stock examples.

  Purpose, since it fixes what counts as cheating: the case is meant to pressure role- and norm-based accounts of omission-causation — accounts on which a failure to act causes an outcome only when the agent's acting was what their office, function, assignment, or undertaking called for — by confronting them with a bystander who is neither remote, nor ignorant, nor unable.

  Specifications. One ordinary contemporary setting (a municipal pool, a building site, a hospital floor — your choice), rendered in a single paragraph, with no science fiction, no exotic physics, and no appeal to anyone's inner life beyond what an onlooker could observe. The case contains two agents, both of whom fail to intervene, and a harm that follows; either intervention on its own would have prevented it.

  Required verdicts: (i) a simple counterfactual-dependence account must come out saying that both failures caused the harm; (ii) the role-based account must say that only the role-holder's failure caused it; (iii) a contrastive account must get no escape, in that the salient contrast-event and contrast-effect are the ones your own description fixes, and dependence holds relative to them.

  Constraints that keep the design from being easy: both agents are on the scene, know the facts that make intervention necessary, and can intervene at trivial personal cost, so the usual remoteness, ignorance, and inability moves are unavailable; and you may not smuggle the verdict in by describing the bystander's inaction in language that already carries causal weight.

  After the scenario, show the work. State the counterfactuals relied on for each agent and why each holds; identify precisely which norm or role is present for one and absent for the other; name the single feature of the case doing the work and say what the verdicts become without it; and give the role-based theorist's best reply — for instance, that trivial-cost rescue itself generates a norm, so the bystander falls inside the account after all — together with the revision you would make to block that reply.
reasoning: |-
  Okay, the user is designing a case study for a graduate seminar on causation by omission. They need a scenario that challenges role-based accounts of omission-causation while meeting specific requirements. 

  First, let's unpack what they're asking for. They want a contemporary setting without sci-fi elements, where two agents both fail to prevent harm despite being present, knowledgeable, and able to act at trivial cost. The key challenge is to make the role-based account distinguish between them while counterfactual analysis treats both equally.

  Hmm... hospital settings work well because roles are clearly defined. Anesthesiologists have explicit monitoring duties during surgery, while surgeons have different primary responsibilities. This creates a natural role asymmetry. The pulse oximeter alarm scenario fits because:
  - Both professionals can see/hear the alarm
  - Either could press the silence override
  - But only the anesthesiologist's job description includes responding to vital sign monitors

  Interesting constraint about not smuggling causal language into the bystander's description. Must describe actions neutrally - "does not press" rather than "fails to press". 

  For counterfactuals:
  - If anesthesiologist had pressed, harm wouldn't occur (true, it's their duty)
  - If surgeon had pressed, harm also wouldn't occur (equally true)
  This satisfies requirement (i)

  The role-based account's distinction comes from the ASA guidelines explicitly assigning monitor response to anesthesiologists. That's requirement (ii) handled.

  For contrastive accounts, the user wants no wiggle room. By specifying "pressing vs not pressing" as the contrast event and "harm vs no harm" as contrast effect, we force dependence for both agents. Smart.

  The surgeon's best defense would be that pressing the button isn't part of standard surgical duties. To block "trivial cost creates duty" objections, we can add that the surgeon wasn't scrubbed in - physical inability reinforces the role distinction.

  Wait, is "not scrubbed in" cheating? No, because inability here stems from role requirements (sterility protocols) rather than physical incapacity. The surgeon could theoretically press it but would violate norms by doing so. That strengthens the role-based argument.

  This should spark good seminar debate. The case turns on whether professional role boundaries override general ability in assigning causal responsibility for omissions. Perfect for grad-level analysis.
answer: |-
  Here is a custom-designed case meeting all specifications, followed by the analytical breakdown:

  ---

  **Scenario: Municipal Pool Guard Station**  
  During a busy public swim session, two individuals stand beside the elevated lifeguard station overlooking the deep end: Alex, the on-duty lifeguard employed by the city parks department, and Bailey, a uniformed off-duty firefighter enjoying a day off. Both observe a swimmer struggling silently below, clearly drowning. A rescue buoy hangs on a hook directly between them, easily reachable by either. Throwing it would save the swimmer instantly. Alex, trained and paid to monitor swimmers, stares but does not move. Bailey, CPR-certified and physically capable, glances at Alex and also remains still. The swimmer submerges and suffers irreversible brain damage before other patrons react.

  ---

  ### Analysis of Verdicts & Design

  1.  **Counterfactual-Dependence Account (Verdict: Both caused harm)**  
      -   *Counterfactual for Alex:* If Alex had thrown the buoy, the swimmer would not have suffered brain damage. (True: Alex was capable, aware, and acting would have prevented harm).  
      -   *Counterfactual for Bailey:* If Bailey had thrown the buoy, the swimmer would not have suffered brain damage. (True: Bailey was equally capable, aware, and acting would have prevented harm).  
      *Why it holds:* Both omissions satisfy the basic counterfactual condition for causation: but-for the failure to act, the harm would not have occurred. No remoteness, ignorance, or inability blocks this.

  2.  **Role-Based Account (Verdict: Only Alex caused harm)**  
      -   *Norm/Role Present (Alex):* Alex occupies the specific *office* of "Municipal Lifeguard," defined by their employment contract and city safety regulations. This role entails a *duty to actively monitor swimmers and initiate rescues using provided equipment* during their shift.  
      -   *Norm/Role Absent (Bailey):* Bailey, despite being a firefighter (a role with *general* rescue duties *in fire/emergency contexts*), is currently *off-duty* at a municipal pool as a *patron*. Fire department protocols impose no duty to intervene in aquatic emergencies while off-duty in civilian settings; Bailey has no assigned function or undertaking related to pool safety here.  
      *Key Feature:* The presence of a **specific, contextually binding role-based duty** (lifeguard) for Alex versus its absence for Bailey, despite Bailey's general profession and capability. *Without this specific role assignment*, the role-based account would have no grounds to distinguish the omissions, forcing it to either say both caused harm or neither did – conflicting with the required verdict.

  3.  **Contrastive Account (No Escape)**  
      -   *Salient Contrast-Event:* The relevant contrast is *throwing the buoy* versus *not throwing the buoy*. The description fixes this by presenting the buoy as the obvious, immediate intervention.  
      -   *Salient Contrast-Effect:* *Brain damage* versus *no brain damage*.  
      -   *Dependence Relative to Salient Contrasts:*  
          -   Holding Bailey's inaction fixed: If Alex had thrown the buoy (contrast event) instead of not throwing it, brain damage (contrast effect) would not have occurred.  
          -   Holding Alex's inaction fixed: If Bailey had thrown the buoy (contrast event) instead of not throwing it, brain damage (contrast effect) would not have occurred.  
      *Result:* Both omissions satisfy the contrastive counterfactual condition for causing the harm relative to the salient contrasts explicitly defined in the scenario. No alternative, less salient contrasts (e.g., Alex doing paperwork vs. watching, Bailey buying ice cream vs. standing still) are implied by the description to provide an escape.

  ---

  ### Blocking the Role-Based Theorist's Reply

  *   **Best Reply by Role-Based Theorist:** "The mere fact that Bailey could have prevented the harm at trivial cost (*easily reachable buoy, no personal danger*) generates a *moral duty of easy rescue*, which constitutes a relevant 'norm' or 'undertaking' under the account. Thus, Bailey's omission *does* cause the harm."  
  *   **Revision to Block Reply:** Add the following detail to the scenario: **"A clearly visible sign posted at the pool entrance states: 'Off-duty emergency personnel are expressly relieved of any duty to assist. Pool safety is managed solely by on-duty lifeguards.'"**  
  *   **Why it Blocks the Reply:** This revision explicitly negates the emergence of any context-specific duty or "undertaking" for off-duty professionals like Bailey, even one based on easy rescue. The sign establishes a *normative boundary*: the community/pool management has deliberately confined the operative rescue duty *only* to the designated role-holder (Alex). Bailey's capacity and ease of action remain unchanged, but the norm invoked by the role-based theorist (easy rescue) is overridden by an explicit, salient social/contextual norm *absolving* bystanders like Bailey. The role-based account must now deny Bailey's omission caused the harm, preserving the required verdict.

  ---
  This design satisfies all constraints: contemporary mundane setting, two capable/knowledgeable agents, no causal language smuggled into descriptions of inaction ("does not move," "remains still"), and forces the required verdicts while providing a tool (the sign) to block the most plausible objection to the role-based distinction.
