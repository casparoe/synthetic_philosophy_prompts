  Below is a decision tree designed to categorize claims about the deep past, built around your constraints and incorporating your three tests (ratchet, dull-detail rule, one-big-mistake rule). The tree has 12 nodes (questions) and 7 leaves (categories), fitting on a phone screen. Every question is phrased neutrally, focusing on the claim's content, predictions, and relationship to evidence—without relying on terms like "falsifiable," "experts," or "peer-reviewed." Your three tests appear as nodes 5 (dull-detail rule), 6 (ratchet), and 7 (one-big-mistake rule). 

  The leaves include your requested categories, with "right for the wrong reasons" handled as a sub-case of "settled mainstream history" (explained in the tree). The tree avoids verdict-smuggling by asking about observable behaviors (e.g., "does the claim adapt to new evidence?" instead of "is it pseudohistory?"). 

  ### **Decision Tree: Categorizing Claims About the Deep Past**
  *Start*: Someone has just put forward a claim about the deep past.  
  Answer each question based **only** on the claim itself, its predictions, and how it interacts with evidence. No specialized knowledge is needed.

  1. **Is the claim based on a literal interpretation of a story, legend, or religious text?**  
     - *Yes* → Go to 2.  
     - *No* → Go to 3.  

  2. **Does the claim rely solely on the story/text, with no new physical evidence offered?**  
     - *Yes* → **F. Myth read as literal history** (Cost: You risk missing the story's cultural/symbolic meaning and misapplying it to real events.)  
     - *No* → Go to 3.  

  3. **Does the claim directly challenge a widely accepted historical or archaeological narrative?**  
     - *Yes* → Go to 4.  
     - *No* → Go to 9.  

  4. **Can the claim be tested using physical evidence (e.g., artifacts, DNA, geology) that exists or could be found?**  
     - *Yes* → Go to 5.  
     - *No* → **D. Pseudohistory proper** (Cost: You invest in ideas insulated from evidence, which may detach you from reality over time.)  

  5. **Does the claim predict specific, unspectacular details that could be checked in existing records (e.g., pollen counts in soil layers, tool wear patterns, or trade ledger dates) without the need for "big" discoveries?**  
     *(This is your "dull-detail rule")*  
     - *Yes* → Go to 6.  
     - *No* → Go to 7.  

  6. **When new evidence emerges, does the claim only ever gain support (with contradictions explained as errors, conspiracies, or "hidden truths")?**  
     *(This is your "ratchet")*  
     - *Yes* → **D. Pseudohistory proper** (Cost: As above.)  
     - *No* → Go to 8.  

  7. **For the claim to be true, must a large portion of the existing historical/archaeological record be wrong due to a single cause (e.g., a global conspiracy, systemic dating error, or catastrophic event)?**  
     *(This is your "one-big-mistake rule")*  
     - *Yes* → **D. Pseudohistory proper** (Cost: As above.)  
     - *No* → Go to 8.  

  8. **Has the claim been directly contradicted by well-established physical evidence (e.g., carbon dating, DNA analysis, or layer dating)?**  
     - *Yes* → Go to 11.  
     - *No* → Go to 12.  

  9. **Is the claim supported by multiple types of independent evidence (e.g., texts + archaeology + climate data)?**  
     - *Yes* → **A. Settled mainstream history** (Cost: You accept the consensus, which might overlook nuances but is the best-supported view.)  
     - *No* → Go to 10.  

  10. **Are experts actively debating the claim with new evidence emerging on both sides?**  
      - *Yes* → **B. Genuinely open question** (Cost: You’re in a live debate; answers may change, requiring you to stay updated.)  
      - *No* → **C. Honest speculation that's just wrong** (Cost: You’re likely mistaken but for understandable reasons; this may waste your time.)  

  11. **Does the claim originate from a source with strong financial, ideological, or personal incentives (e.g., selling books, promoting a ideology, or gaining fame)?**  
      - *Yes* → **E. Outright hoax or forgery** (Cost: You’re being deceived, risking embarrassment or exploitation.)  
      - *No* → **C. Honest speculation that's just wrong** (Cost: As above.)  

  12. **Is the claim part of a broader narrative that claims to explain many unrelated phenomena (e.g., lost civilizations explaining both pyramid construction and climate change)?**  
      - *Yes* → **D. Pseudohistory proper** (Cost: As above.)  
      - *No* → **B. Genuinely open question** (Cost: As above.)  

  ---

  ### **Leaf Categories and Costs**
  - **A. Settled mainstream history**: Cost: You risk overlooking new evidence that refines (but rarely overturns) consensus.  
  - **B. Genuinely open question**: Cost: You must continually reassess as new evidence emerges; conclusions are tentative.  
  - **C. Honest speculation that's just wrong**: Cost: You’re incorrect but not dogmatic; this can lead you down dead ends but encourages learning.  
  - **D. Pseudohistory proper**: Cost: You embrace unfalsifiable ideas, which may isolate you from evidence-based discourse.  
  - **E. Outright hoax or forgery**: Cost: You’re vulnerable to manipulation, wasting time or resources on known falsehoods.  
  - **F. Myth read as literal history**: Cost: You misinterpret symbolic stories as fact, missing their cultural context and muddying real history.  
  - *Implicit "G" (right for the wrong reasons)*: Handled under **A** or **B** (e.g., if a myth-based claim ends up supported by evidence, it's "settled" but the reasoning was flawed). Cost: You stumble on truth accidentally; your flawed method won’t work elsewhere.  

  ---

  ### **Empty Corners (Combinations with No Real-World Examples)**
  The tree identifies three empty corners due to incoherence or unattractiveness:
  1. **"No" to Q3 + "No" to Q9 + "No" to Q10**: Claims that don’t challenge consensus, lack evidence, and aren’t debated. Why empty? If a claim isn’t challenging consensus and has no support, it’s ignored—not worth debating or promoting. It’s unattractive and fades away.  
  2. **"Yes" to Q5 (dull-detail) + "Yes" to Q6 (ratchet)**: Claims that predict boring details but also ratchet contradictions away. Why empty? Dull-detail predictions imply testability, but the ratchet rejects correction—these conflict. No real claim does both coherently.  
  3. **"No" to Q4 (untestable) + "No" to Q1/Q2 (not myth-based)**: Untestable claims not rooted in stories. Why empty? Untestable claims typically rely on narratives (e.g., myths) for appeal; without that, they’re incoherent and gain no traction.  

