  Give me your own number and the decomposition: probability there's a determinate fact of the matter about the state at all, probability that beeper/experience-sampling methods would actually track it rather than create it, probability the confabulation findings generalize from people explaining their choices to raw phenomenology, plus whatever other terms you think belong — one line and a rough probability each, then how they combine. Tell me which term the total is most sensitive to, what single result would move your number furthest, and where 0.65 and 0.25 most likely part company: is she disputing the empirical claim, or the whole framing of it?
