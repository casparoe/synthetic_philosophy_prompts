answer: |-
  Below is a decision tree that starts from an intuitive sense of time's passage and branches into named philosophical positions, using concrete, experiential questions. Borges appears at three leaves (as requested), and logical gaps are flagged. The tree separates key conflations (e.g., eternalism vs. eternal intellect; no-self vs. no-succession) and notes unexplored branches for potential narrators.

  ---

  ### **Decision Tree: Theories of Time**

  **Start Here:**  
  You feel time passes—moments succeed each other. Is this succession an undeniable, fundamental feature of reality?  
  - **Yes (Succession is real)** → Go to **Q1**  
  - **No (Succession might be an illusion)** → Go to **Q8**  

  ---

  #### **Branch 1: Succession is Real**  
  **Q1:** When you choose what to eat for breakfast, do all possible futures (e.g., toast vs. oatmeal) already exist *somewhere*, like the far side of the moon exists even when unseen?  
  - **Yes (Futures exist independently)** → Go to **Q2**  
  - **No (Only one future unfolds)** → Go to **Q4**  

  **Q2:** Is the "present" a thick place you inhabit (like a room) or a knife-edge you cross (a split-second)?  
  - **Thick (Like a room)** → Go to **Q3**  
  - **Knife-edge** → **Moving Spotlight Theory (A-Series Eternalism)**  
    - *Most awkward commitment*: Time flows objectively, but the entire timeline is static—so "flow" is a mysterious extra ingredient.  
    - *Plot license*: Narrators experience time as a moving "now," but past/future events are equally real—enabling time travel or prophetic visions, yet making genuine novelty impossible.  

  **Q3:** If you replay a memory, is it a present reconstruction or a direct tap into a preserved past?  
  - **Present reconstruction** → **Eternalism with Thick Present (B-Series Variant)**  
    - *Most awkward commitment*: The present is a subjective illusion; all moments coexist, but consciousness "thickens" now.  
    - *Plot license*: Narrators jump between fixed events (like flipping book pages), but cannot alter the past/future; cause-effect feels mechanical.  
  - **Direct tap** → **Eternalism in an Eternal Intellect (Borges' Aleph)**  
    - *Most awkward commitment*: All time exists *because* a divine mind perceives it—time is imaginary without a thinker.  
    - *Plot license*: All events are simultaneous in God's mind; narrators access any moment via visions, but lack free will. *(Borges: "The Aleph")*  

  **Q4:** When you regret a choice, are you haunted by *actual* alternate selves in parallel timelines?  
  - **Yes (Alternate selves are real)** → **Branching Time (Prior/Belnap)**  
    - *Most awkward commitment*: Countless futures exist until choices prune them, but the past is singular—so "you" split endlessly.  
    - *Plot license*: Narrators witness unlived lives; choices feel tragic (closing doors), but the past is immutable. *(Borges: "The Garden of Forking Paths" — fiction-only leaf)*  
  - **No (Alternates are imaginary)** → Go to **Q5**  

  **Q5:** Is the past *still happening* somewhere, or is it gone forever?  
  - **Still happening** → **Growing Block Theory**  
    - *Most awkward commitment*: The past exists immutably, but the future doesn’t exist yet—so time is asymmetrical for no clear reason.  
    - *Plot license*: Narrators relive past events as fixed records, but future choices feel open; flashbacks are literal, prophecies impossible.  
  - **Gone forever** → Go to **Q6**  

  **Q6:** Does the present have "thickness" (e.g., can a conversation feel fully *in* the now, not atomized)?  
  - **Yes** → **Presentism with Thick Duration (Bergson/James)**  
    - *Most awkward commitment*: Only the present exists, but it lasts long enough for change—so "duration" avoids instantaneity.  
    - *Plot license*: Narrators dwell in extended "nows" (e.g., a kiss lasts minutes), but the past is irretrievable; memories are present-day fictions. *(Borges: "Funes the Memorious" — essays reject this, but fiction explores it)*  
  - **No** → **Standard Presentism**  
    - *Most awkward commitment*: Only an instantaneous now exists—so memories and plans are fictions, despite feeling real.  
    - *Plot license*: Every moment is isolated; narrators cannot describe duration, only fragments. Causality breaks.  

  ---

  #### **Branch 2: Succession Might Be Illusory**  
  **Q8:** If nothing changed (e.g., frozen room, no heartbeat), would time still "pass"?  
  - **Yes** → **Absolute Time (Newtonian)**  
    - *Most awkward commitment*: Time flows without events—like an invisible river—but its flow is undetectable.  
    - *Plot license*: Narrators feel time dragging in stasis, but cannot describe *what* flows; plots stagnate without change.  
  - **No** → Go to **Q9**  

  **Q9:** Is change (e.g., leaves rotting, cities rising) fundamental, or just appearance?  
  - **Fundamental** → **Relational Time (Leibniz)**  
    - *Most awkward commitment*: Time *is* change—so if all change stops, time vanishes, but this feels counterintuitive.  
    - *Plot license*: Plots require dynamic events; narrators freeze time by halting change. Cause-effect chains drive the story.  
  - **Appearance** → Go to **Q10**  

  **Q10:** If you lost all memory, would "you" still persist?  
  - **Yes** → **Idealist Time (Kant/Husserl)**  
    - *Most awkward commitment*: Time is a mental construct—so without minds, the universe is static, but science suggests otherwise.  
    - *Plot license*: Time warps with mental states (e.g., trauma dilates it); narrators alter time via perception, but physics is irrelevant.  
  - **No** → **Eliminativism (Borges/McTaggart)**  
    - *Most awkward commitment*: Time and self are illusions—reality is timeless, yet we experience both.  
    - *Plot license*: Plots collapse into incoherence; narrators describe events as static mosaics. *(Borges: "New Refutation of Time" — essays endorse this, but his fiction subverts it)*  

  ---

  ### **Conflations, Gaps, and Borges' Fractures**  
  1. **Conflations the tree *can* split:**  
     - **Eternalism vs. Eternal Intellect**: Separated at **Q3** (reconstruction vs. divine perception).  
     - **No-Self vs. No-Succession**: Separated at **Q10** (self-persistence vs. time-dependence on change).  

  2. **Conflations the tree *cannot* split:**  
     - **Presentism's thin vs. thick versions**: Both collapse into "present exists" (addressed in **Q6**).  
     - **Relational vs. Causal Time**: Tree treats them as equivalent (branching requires extra questions).  

  3. **Logically possible but unoccupied gaps:**  
     - **Branching Past + Fixed Future**: (Q4 → "alternate selves are real" + Q5 → "past is gone").  
       - *Why unexplored?* Incoherent—branching requires multiple pasts to diverge from.  
     - **Eternalism + Subjective Flow**: (Q2 → "knife-edge" + Q3 → "present reconstruction").  
       - *Why unexplored?* Unattractive—eternalism usually rejects flow.  
     - **No-Succession + Thick Duration**: (Q8 → "time requires change" + Q6 → "thick present").  
       - *Why unexplored?* Rich territory for fiction—a narrator who feels "thick" nows but denies succession. *(Your fourth narrator?)*  

  4. **Borges' Fractures:**  
     - **Fiction-only**: Branching Time ("Garden of Forking Paths").  
     - **Essay/fiction clash**: Eliminativism (essays defend it; stories like "Funes" show thick present as prison).  
     - **Eternal Intellect**: "The Aleph" as divine perception.  

  --- 

  ### **How to Use This Tree**  
  - **For your novel**: Each narrator’s path:  
    - Present-obsessed: **Standard Presentism** (Q0 → Yes → Q1 → No → Q5 → Gone → Q6 → No).  
    - Haunted by branches: **Branching Time** (Q0 → Yes → Q1 → No → Q4 → Yes).  
    - Past rewritten: **B-theory with Retrocausality** (Q0 → Yes → Q1 → Yes → Q2 → Knife-edge? → Q4 → Mutable).  
  - **Unexplored gap**: A fourth narrator in **No-Succession + Thick Duration** could experience time as isolated, immersive "bubbles" with no before/after—stories would be dreamlike vignettes, unable to link events causally.  

  The tree isolates core tensions while leaving room for poetic ambiguity—perfect for literary fiction.
