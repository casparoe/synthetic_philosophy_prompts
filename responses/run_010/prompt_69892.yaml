  **(7) A user who consented after an onboarding flow containing three testimonials about how sharing helps other patients — every one of them true, none of them mentioning risk.**

  - Branch 1: Affirmative Gesture? (Yes) -> Branch 2
  - Branch 2: Fundamental Deception? (No) -> Branch 3
