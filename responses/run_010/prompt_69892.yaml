  ## Where the Tree Differs from Court

  - Ticket (1): Courts might invalidate consent based on the minor's age regardless of understanding, due to legal incapacity. The tree does not have a branch for legal capacity (like age thresholds). The tree is more focused on the moral conditions, while courts apply legal rules. The tree might be tracking morally relevant facts better by focusing on understanding, but the law protects minors categorically.

  - Ticket (3): Courts might be concerned about undue inducement, which the tree does not capture. The tree might see it as valid, but a court might be stricter.

  ## Unoccupied Combinations

  The tree covers every combination of answers, but note that some leaves are reached only if a flaw is present. The valid leaf (I) is only reached if no flaw is found.

  However, consider a case with multiple flaws: the tree stops at the first flaw encountered. For example, a case with both fundamental deception and threat would be caught at Branch 2 (fundamental deception) and go to Leaf A, without recording the threat. This is by design, as one flaw is enough to invalidate.

