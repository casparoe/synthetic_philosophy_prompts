  But wait, the tree also has Branch 9 for interface-level shaping. We didn't get there because we stopped at Branch 3. So we are saying that the omission is deception. Alternatively, we might consider that the interface shaped preferences by emphasizing benefits and omitting risks. But the tree's Branch 9 is about the interface design supplying the reasons for the choice, which might be the case here. However, Branch 3 already catches it as deception.

