answer: |-
  Here is your Q&A preparation sheet, structured as requested:

  **Concessions (Opening 5 Minutes):**  
  1. "I accept that the *capacity* for reactive attitudes has deep natural roots in human sociality – my quarrel is only with Strawson's *explanatory order*."  
  2. "I grant that personal resentment *feels* phenomenologically primary in first-person experience; my claim is about conceptual/logical priority in justifying the practice."  
  3. "I acknowledge relational theories capture important dynamics in *ongoing* relationships; my focus is resentment’s *propriety conditions* when relationships are absent or fractured."  
  4. "I agree second-personal accountability is real – but insist it presupposes a *representable claim*, not vice versa."  

  ---

  **Objections & Replies**  
  *(✓ = Would force thesis abandonment if conceded; ✂ = Coordinated pincer)*  

  1. **Senior Strawsonian #1 (Naturalism):**  
     *Objection:* "You’ve stripped resentment of its essential character as a *felt interpersonal response*. By making it about representing abstract ‘claims’, you collapse the participant stance into detached moral judgment. Isn’t this just the objective attitude in disguise?"  
     *Reply:* "Not at all. Representing a claim *is* an affectively laden, interpersonal stance – indignation burns *because* we register the violation as significant to someone’s moral status. This preserves the ‘heat’ while explaining *why* it arises even when victim and resenter are strangers."  
     *Soft Spot:* Distinguishing this "representational affect" from judgment risks sounding like armchair psychology without empirical backing.  

  2. **Second-Personal Theorist (Authority):** ✓  
     *Objection:* "Your ‘standing to represent’ is my ‘second-personal authority’ with the accountability structure surgically removed! If resentment isn’t essentially a demand *to the wrongdoer* for recognition, what makes it anything but moralistic disapproval?"  
     *Reply:* "The demand remains – but its authority derives from the *claim violated*, not a reciprocal dyad. When I resent on behalf of the dead, I hold the wrongdoer accountable *to them*, mediated through my representation. Your model can’t handle non-addressable victims without fiction."  
     *Soft Spot:* Admitting demands to wrongdoers are *sometimes* impossible weakens resentment’s "holding to account" function.  

  3. **Relational Theorist (Function):**  
     *Objection:* "Why drag in resentment at all? If the core is recognizing violated claims and revising intentions (as I argue), doesn’t your ‘primary’ attitude just add redundant emotional noise?"  
     *Reply:* "Resentment isn’t necessary for all moral repair, but it’s a distinctive signal that a *publicly assertable claim* was violated – crucial when relational repair isn’t apt (e.g., strangers, systemic wrongs). It anchors blame in intersubjective norms, not private relationships."  
     *Soft Spot:* Struggles to explain why resentment *must* exist if relational adjustments suffice in principle.  

  4. **Senior Strawsonian #2 (Taxonomy):** ✂  
     *Objection:* "Your ‘unmixed instances’ aren’t reactive attitudes! They’re moral outrage or pity. Strawson’s genius was showing resentment *is* personal – take that away and you’re not talking about *resentment* anymore."  
     *Reply:* "On the contrary: we *call* it resentment when strangers condemn a racist attack. The emotional texture – hot, focused on the wrongdoer’s ill will – persists. What changes is seeing *why* it feels that way: not because *I’m* slighted, but because I *grasp* the slight."  
     *Soft Spot:* If phenomenology diverges significantly in third-party cases, the objection holds.  

  5. **Moral Responsibility Sceptic (Desert):**  
     *Objection:* "If resentment tracks ‘claims’, not emotional economy, does it still require basic desert? Or can your account survive if we ditch desert altogether?"  
     *Reply:* "It survives robustly. The ‘claim’ is to minimally decent treatment; resentment flags violations. Desert might explain *retributive* responses, but resentment’s core is *recognition of wrongfulness* – compatible with forward-looking accountability."  
     *Soft Spot:* Doesn’t fully address why resentment *feels* retaliatory if desert is irrelevant.  

  6. **Graduate Student #1 (Moral Psychology - Bias):**  
     *Objection:* "Studies show third-party resentment is skewed toward in-group victims. If it’s about objective claims, why the bias? Doesn’t this support Strawson’s naturalism?"  
     *Reply:* "It supports my *social variability* claim! Legibility isn’t objective; our practices *determine* whose claims seem representable. In-group bias reflects whose suffering our conventions render salient – an indictment of those conventions, not my model."  
     *Soft Spot:* *[Empirical Commitment]* Requires defending that bias stems from *legibility conventions* rather than innate tribalism.  

  7. **Second-Personal Theorist (Standing):** ✂  
     *Objection:* "If standing is just ‘being positioned to represent’, what stops anyone from resenting anything? Your stranger has no more authority than a busybody!"  
     *Reply:* "Positioning isn’t arbitrary. It requires (a) recognizing the claim (b) lacking complicity in its violation (c) social context permitting uptake. The busybody fails (a) or (c); the stranger witnessing an assault meets all three."  
     *Soft Spot:* Criteria (a) and (c) risk circularity (who "recognizes" claims? whose "context" matters?).  

  8. **Graduate Student #2 (Psychology - Severity):**  
     *Objection:* "Indignation spikes with outcome severity, not just intent. But if resentment tracks *disregard for claims*, shouldn’t intent be primary? Doesn’t outcome focus undermine your view?"  
     *Reply:* "Severity often signals the *degree* of disregard – crushing a butterfly vs. a person shows radically different valuation of claims. Also, *[Empirical Commitment]* I’d predict outcome effects diminish when intent is crystal-clear (e.g., sadistic torture)."  
     *Soft Spot:* Outcome sensitivity in experiments is robust; downplaying it may seem ad hoc.  

  9. **Relational Theorist (Victim’s Role):**  
     *Objection:* "You say victims can ‘properly fail to resent’. But if resentment affirms *their* claim, isn’t their refusal a moral failing? You’ve made self-blame or exhaustion ethically suspect!"  
     *Reply:* "No – because the claim’s validity doesn’t depend on the victim asserting it. My resentment affirms their standing *despite* their inability/refusal. Forcing victims to resent to ‘validate’ their claim would be grotesque."  
     *Soft Spot:* Risks implying victims *shouldn’t* resent (e.g., for catharsis) – a tension.  

  10. **Senior Strawsonian #1 (Unity):** ✓  
      *Objection:* "You’ve fractured the reactive attitudes! Personal resentment isn’t the paradigm? Then it’s not the same *kind* of thing as vicarious resentment. You lose Strawson’s unifying explanation of moral responsibility."  
      *Reply:* "The unity is in *what they respond to* (disregard for claims), not who feels it. Personal resentment *is* vicarious – you represent your *own* claim as a moral patient. This *strengthens* unity: one root, not two glued together."  
      *Soft Spot:* Treating self-representation as "vicarious" may seem contrived.  

  **Coordinated Pincer (✂):**  
  *Likely Pairing:* Senior Strawsonian #2 (Objection 4) + Second-Personal Theorist (Objection 7) attacking from both sides: "You’ve changed the subject!" / "You’ve made resentment arbitrary!"  
  *Unified Response:* "Both objections assume Strawson’s personal paradigm is sacrosanct. But if we start from cases his model *can’t* handle (the dead, animals), we see resentment’s core is *claim-representation* – which *includes* personal cases (where I represent myself) but isn’t defined by them. This avoids arbitrariness *and* preserves the attitude’s essence."  

  ---

  **Dreaded Exchange & Why Difficult:**  
  **Sceptic:** "You say we resent on behalf of animals because they have ‘claims’. But claims imply claimants. Can a squirrel *claim* anything? Or are you smuggling in moral realism your framework can’t support?"  
  **Why Difficult:** Forces you to either:  
  (a) Defend a robust theory of non-agential moral claims on the fly (digressing into metaethics),  
  (b) Concede claims are constructs (risking "projectivism" charges), or  
  (c) Retreat to "social legibility" (making resentment hostage to oppressive conventions). Your empirical/normative hinge is most exposed here.
