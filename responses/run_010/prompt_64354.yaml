answer: |-
  Your analysis correctly identifies three distinct demandingness objections that are often conflated. The conceptual tension arises because consequentialist strategies to address one complaint tend to exacerbate the others. Below is a systematic breakdown:

  ### 1. **Mutual Incompatibility of Replies**  
     - **Cost Complaint**: Addressed by distinguishing the *criterion of rightness* (act optimifically) from the *decision procedure* (e.g., cultivate rules of thumb, personal projects). By not requiring direct optimization in deliberation, the *felt burden* decreases.  
     - **Fair-Share Complaint**: The same distinction *worsens* this problem. If agents are told to stop short of optimization (e.g., donate only 10% income when optimal is 50%), they avoid personal ruin but *allow collective shortfalls* to persist. Non-compliers free-ride, while compliers absorb costs without achieving the goal.  
     - **Integrity Complaint**: Neither reply works. Prescribing indirect deliberation (*"don’t think like a consequentialist"*) demands agents treat their commitments as tools for optimization, undermining the "ground projects" (Williams) that constitute identity.  

  ---

  ### 2. **Conceptual Problems with the Decision-Procedure Distinction**  
     - **Does it Remove or Relocate Cost?**  
       The distinction *relocates* cost rather than eliminating it:  
       - **Cultivation Costs**: Internalizing an "indirect" disposition (e.g., strong parental devotion) requires suppressing direct optimization, creating psychological friction.  
       - **Maintenance Costs**: Agents must continually monitor whether their disposition *remains* optimific (e.g., "Is my love for my child still net-beneficial?").  
       - **Meta-Deliberation**: Choosing a disposition is itself subject to consequentialist assessment, risking regress (e.g., "What disposition should I adopt to choose dispositions?").  
       *Result*: Personal sacrifice is traded for ongoing agential dissonance.  

     - **Why it Aggravates the Fair-Share Complaint**  
       - If the theory permits agents to do *less* than optimal (e.g., donate 10%), it implies a "fair share" exists. But this cannot be fixed consequentially:  
         - **Problem 1**: Defining "fair share" impartially (e.g., equal sacrifice) contradicts the theory’s welfarist foundations.  
         - **Problem 2**: Any non-optimal "stopping point" (e.g., 10%) is arbitrary unless justified by *overall* consequences—but this reintroduces the impartial calculus the agent was told to avoid.  
       *Result*: Consequentialism cannot non-arbitrarily define "fair share" without self-sabotage.  

  ---

  ### 3. **Why the Integrity Complaint Resists Both Replies**  
     - **Structural Attack on Agency**:  
       Williams’ objection is not about *quantitative* sacrifice but *qualitative* self-alienation. Consequentialism obliges agents to see their deepest commitments (e.g., parenting, art) as *instruments* for value promotion. This dissolves the "practical identity" from which moral action emerges.  
       - **Example**: A painter must see her art as valuable only insofar as it maximizes welfare—not as a constitutive part of her self.  

     - **Why Indirect Deliberation Fails**:  
       Prescribing self-effacing dispositions (e.g., "forget consequentialism and love your child!"):  
       - **Perpetuates Alienation**: The disposition is adopted *because* it optimizes. The agent must still view her love as a *tool*, not a intrinsic good.  
       - **The Paradox of Self-Effacement**: If the agent *succeeds* in adopting the disposition, she cannot acknowledge her true reason for having it (its optimificness). This fractures practical reason.  
       *Result*: The prescription itself enacts the impartial standpoint Williams condemns.  

  ---

  ### 4. **Assessment: The Survival of the Objection and Strategic Implications**  
     - **Unified Objection?**:  
       No coherent core remains once separated. The complaints target different levels:  
       - *Cost*: Quantitative burdens (**outcome** focus).  
       - *Fair-share*: Distributive injustice (**social** focus).  
       - *Integrity*: Agency corrosion (**existential** focus).  

     - **Should Consequentialists Resist Separation?**  
       | **Approach** | **Advantage** | **Disadvantage** |  
       |--------------|---------------|------------------|  
       | **Resist Separation** | Preserves simplicity; dismisses objections as "intuition pumps." | Obscures deep tensions; leaves fair-share/integrity unaddressed. |  
       | **Face Separately** | Allows tailored replies (e.g., accept moderate cost, reform distribution, reframe integrity). | May require conceding limits (e.g., no full reply to integrity without abandoning core tenets). |  

     - **What is Lost?**  
       - *Resisting separation*: Loses diagnostic power; risks irrelevance to real-world concerns (e.g., climate ethics where fair-share matters).  
       - *Facing separately*: Loses theoretical unity; may force revisions (e.g., incorporating agent-relative permissions).  

  ---

  ### Conclusion  
  The three complaints form a **trilemma** for consequentialism:  
  - Reducing *cost* via indirect deliberation worsens *fair-share* problems and ignores *integrity*.  
  - Addressing *fair-share* requires non-consequentialist norms, violating neutrality.  
  - *Integrity* demands rejecting the theory’s core structure.  

  **Strategic Recommendation**: Consequentialists should address the complaints separately:  
  1. **Cost**: Defend moderate demands by emphasizing diminishing marginal utility and long-term sustainability.  
  2. **Fair-Share**: Advocate institutional solutions (e.g., enforceable agreements) to distribute burdens.  
  3. **Integrity**: Reframe the theory as *evaluative* (assessing actions) not *deliberative* (guiding agents), accepting that it cannot prescribe authentic agency.  

  This approach preserves consequentialism’s core while acknowledging its limitations—turning incompatibility into a call for theoretical humility.
