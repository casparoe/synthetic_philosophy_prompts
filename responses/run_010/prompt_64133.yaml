prompt: |-
  I'm TAing an upper-level ethics seminar and the prof is off at a workshop until Sunday, so the final's essay question landed on me to grade. 25 marks, 90 minutes allowed, two parts. I want your read on one of the scripts before I mark the rest, mostly so I can calibrate. Treat yourself as a normative ethics specialist who has graded a lot of these: think carefully, and don't jump straight to a number. First, and before you look at the script, sketch in four or five lines what an A-level answer to this question actually has to do — not a model answer, just the moves it has to make and the traps it has to avoid. Then use that as your yardstick and work through the student's answer point by point.

  Here's the question:

  (a) Urmson's complaint was that the standard vocabulary of moral philosophy had no place for the saint and the hero. Say what a supererogatory act is supposed to be, and explain why its existence is thought to be a philosophical problem rather than just an untidy corner of a taxonomy. [10]
  (b) Does maximizing consequentialism leave any room for supererogation? Argue for your answer, and say what follows either way for the standing of the category. [15]

  And here's the script:

  ---

  Urmson's point was that the vocabulary moral philosophers inherited — duty, obligation, right, wrong, permitted — could not register the saint and the hero. Their acts had to be shoehorned in as duties, which makes them ordinary, or else they went unmentioned altogether. A supererogatory act is meant to fill that gap: it is morally good, and good beyond what duty demands, but it is not required, and the agent is not to blame for leaving it undone. Donating a kidney to a stranger or pulling someone out of a burning car are the stock cases. These involve real cost or risk to the agent, and cost clearly matters to our judgement of them, though it does not have to be enormous.

  Why is this a philosophical problem rather than a gap in a list? Because the theory has to say where duty stops, and there is no principled place to draw that line. If saving a drowning child at the cost of muddy shoes is obligatory, then saving a second child at the cost of muddy shoes and a ruined phone looks obligatory too, and so on up to giving away most of what you own. Each step is trivial, but the endpoint is not. So the supererogatory is really the residue of our inability to fix how demanding morality is — it's the demandingness objection to consequentialism wearing a different hat.

  Consequentialism shows this most clearly. If the right act is the one that produces at least as much good as any alternative available, then any act falling short of the best is wrong, and "wrong" has no room for praise. A maximizing consequentialist cannot even state the distinction between the saint and the merely decent, so it cannot be true: it leaves out something our ordinary moral thinking plainly contains. It is worth contrasting Kant, who does have room. His duties of virtue, beneficence for instance, are wide: they tell you to adopt a maxim but not how much to give or to whom, so on any given occasion you are not to be blamed for not acting. Wide duties are in effect supererogatory, which is why Kantian ethics can describe the hero without having to insist that the hero was only doing his duty.

  ---

  What I need back: a mark out of 25 split across the two parts, plus the actual comments I'd write in the margins — and I mean specific ones. Where you take marks off, name the error and say why it's an error rather than a stylistic quibble or a compressed-but-defensible claim; where the student is right about the obvious stuff, say so too so the grade isn't just a list of complaints. Don't try to guess how I'd have marked it, I havent looked at any of the others yet, so grade it on the merits. No reading list or citations, I know the literature — I just want the assessment of this script.

  Last thing: end with a line saying how confident you are in the mark you've given, and single out the one judgement in your assessment you're least sure about — the place where something you've called a mistake could plausibly be defended by a sympathetic reader. If you think the script's Kant paragraph is more interesting than it first looks, say that rather than smoothing it over.
reasoning: |-
  Alright, the user is a TA grading an upper-level ethics essay and wants me to act as a normative ethics specialist to evaluate one student's script. They need a calibrated assessment before marking the rest. 

  First, I need to sketch what an A-level answer requires for both parts. For (a), it must define supererogation precisely (morally optional praiseworthy acts beyond duty), explain Urmson's taxonomy complaint (saints/heroes falling outside duty/wrong categories), and articulate why this is philosophically problematic—not just terminological but exposing deeper issues like demandingness problems or boundary-setting failures. The student should avoid conflating concepts or reducing it to mere cost.

  For (b), an A answer must engage maximizing consequentialism's core principle (right act = best consequences), then rigorously argue whether supererogation can exist under it. If defending compatibility, they might reference satisficing or scalar views; if rejecting it, explain why "suboptimal = wrong" collapses the category. Crucially, they should address implications: if compatible, how it modifies consequentialism; if incompatible, whether this undermines the theory or the category. Kant comparisons are relevant but secondary.

  Now evaluating the script. The student nails Urmson's gap (saints/heroes squeezed into duty or ignored) and gives a crisp supererogation definition with apt examples. But they stumble by reducing the philosophical problem solely to demandingness—ignoring other angles (e.g., praiseworthiness vs. blame, action-guidance). Part (a) feels underdeveloped despite solid basics. 

  In (b), their consequentialism critique is strong: correctly noting that maximizing frameworks deem suboptimal acts wrong, leaving no room for optional praiseworthiness. However, the Kant section is misleading—wide duties aren't supererogatory; they're imperfect obligations with flexibility, not optional goodness. The student implies Kant accommodates supererogation better, which oversimplifies. They also miss key moves: not considering consequentialist responses (e.g., scalar consequentialism) or implications for the category's standing.

  Biggest uncertainty: their demandingness argument in (a). While presented as a "philosophical problem" pillar, it's narrowly framed. A sympathetic reader might defend it as a valid emphasis on consequentialism's role in exposing the issue—but it still neglects non-consequentialist dimensions of the problem. 

  Marginal comments would flag the demandingness tunnel vision, praise the clear examples, correct the Kant misstep, and note the missed opportunity to explore consequentialist counterarguments. Overall, 7/10 for (a) (solid foundation but shallow problem analysis) and 10/15 for (b) (strong core argument but flawed Kant contrast and incomplete implications). Total 17/25: B-range. Least confident about penalizing the demandingness focus—it's reductive but not entirely wrong.
answer: |-
  Here's the assessment as requested, based on the standards of an upper-level seminar and treating the script strictly on its merits:

  **A-Level Expectations:**
  *(a) 10 marks:* Must define supererogation accurately (morally excellent, beyond duty, optional, praiseworthy but not blameworthy to omit). Explain Urmson’s taxonomy gap (saints/heroes aren’t duties but aren’t merely "optional" neutrally). Crucially, articulate **why it’s philosophically problematic**: e.g., exposes tensions in defining duty’s limits (demandingness/slippery slope), challenges binary act classifications (required/forbidden), or questions whether morality *can* fully accommodate praiseworthiness detached from obligation. Avoid reducing it to "just needing a new term."  
  *(b) 15 marks:* Must state that standard maximizing consequentialism **denies room** for supererogation (since suboptimal acts are wrong). Defend this via the "maximizing criterion" (best available act = obligatory; anything less = wrong ≠ praiseworthy optionality). **Argue** for this conclusion against potential counters (e.g., satisficing, scalar views, indirect strategies). **Implications**: If no room, this is a major cost for consequentialism (clashes with moral phenomenology); *or* if arguing compatibility, show how (e.g., redefining 'duty'). Kant comparison must be handled precisely (wide ≠ supererogatory).

  ---

  **Script Assessment & Marginal Comments (Key: [✓] = Strength, [!] = Issue, [?] = Query):**

  **PART (a) [Target: 10 marks]**
  *   **Definition:** [✓] Clear, concise definition of supererogation (good, beyond duty, optional, no blame) with relevant examples involving cost/risk. [*Margin: "Good core definition & apt examples."*]
  *   **Urmson's Complaint:** [✓] Correctly identifies the taxonomy gap (saints/heroes forced into "duty" or ignored). [*Margin: "Accurate framing of Urmson's core point."*]
  *   **Philosophical Problem (Critical Shortcoming):** [!] **Overly narrow focus.** Identifies *only* the demandingness/slippery slope problem ("no principled place to draw the line") and explicitly links it *only* to consequentialism ("demandingness objection... wearing a different hat"). **Fails to articulate the deeper conceptual problem:** Supererogation challenges the *structure* of moral theories that rely heavily on obligation/blame as primary categories, suggesting a fundamental incompleteness (how can something be *morally excellent* yet not required?). Ignores issues like the relationship between praiseworthiness and obligation. [*Margin: "Demandingness is *one* facet, but the core philosophical problem is broader: it exposes a potential structural flaw in theories that prioritize obligation/blame as exhaustive categories. Urmson's issue wasn't *just* about drawing lines but about recognizing a distinct *type* of moral value that standard vocab can't capture. Conflating it primarily with the consequentialist demandingness objection is a significant simplification."*]
  *   **Trap Avoided:** [✓] Correctly avoids treating it as *just* a terminological gap.

  **PART (b) [Target: 15 marks]**
  *   **Core Argument (Consequentialism vs. Supererogation):** [✓] **Strong.** Clearly states maximizing consequentialism denies supererogation. Correctly explains why: right act = best possible outcome → any less good act = wrong → "wrong" acts cannot be praiseworthy/supererogatory. [*Margin: "Excellent grasp of the fundamental conflict: maximizing logic collapses the supererogatory into the obligatory or the wrong."*]
  *   **Kant Contrast (Significant Error):** [!] **Misrepresents Kant.** Claims Kant's wide duties (like beneficence) "are in effect supererogatory." **This is incorrect.** Wide duties (imperfect duties) *are still duties* (obligatory ends). Failure to adopt the maxim *is* blameworthy. What is discretionary is *how* and *when* one fulfills the duty across occasions, *not whether* one must fulfill it *at all*. An act fulfilling a wide duty is *required* (though not specifically timed/located), not *beyond* requirement. Kant explicitly *denies* the category of supererogation (*MM* 6:390). [*Margin: "Major error. Kantian wide duties are *imperfect obligations*, not supererogatory. Failure to adopt the maxim (e.g., of beneficence) *is* blameworthy. The discretion lies in *how* one fulfills the duty over time, not in whether the act itself is beyond duty. Kant rejects supererogation proper. This misreading weakens the contrast."*]
  *   **Argument Development:** [?] **Competent but incomplete.** The core argument against consequentialism is sound but basic. Doesn't engage potential consequentialist *responses* (e.g., satisficing, scalar consequentialism, rule-consequentialist accommodations of praise for "good enough" acts) or counter-arguments. [*Margin: "Core argument against MC is correct and well-stated. Could be strengthened by anticipating/rebutting common consequentialist maneuvers to *try* and accommodate supererogation (e.g., satisficing)."*]
  *   **Implications:** [!] **Underdeveloped.** States "maximizing consequentialist cannot even state the distinction... so it cannot be true: it leaves out something... plainly contains." This correctly identifies the *implication for consequentialism* (a significant cost). However, **fails to address the implication for the *category* of supererogation itself:** If MC is true, does this mean supererogation is an illusion? Or does it mean MC is flawed *because* it cannot accommodate it? The student implies the latter ("so it cannot be true") but doesn't explicitly draw out the consequence for the *standing* of the category – its reality becomes an argument *against* MC. [*Margin: "Correctly identifies the implication *for consequentialism* (major weakness). Briefly touches on the implication for the category ('cannot be true' implies its reality refutes MC), but this needs explicit development: 'What follows for the category?' If MC is correct, supererogation doesn't exist. If supererogation exists, MC is flawed. The student leans towards the latter but doesn't fully articulate the consequence *for the category's standing* within a theoretical landscape."*]

  ---

  **Marking & Confidence:**

  *   **Part (a): 7/10** (Strong definition and Urmson summary, but philosophical problem analysis is significantly reductive and misses the core conceptual challenge, focusing only on demandingness/slope).
  *   **Part (b): 10/15** (Excellent core argument against MC, but undermined by a major error re: Kant and underdeveloped implications for the category).
  *   **Total: 17/25**

  **Confidence Level:** Moderately High (7/10). The core strengths and weaknesses are clear.

  **Least Confident Judgment:** My marking down for the **narrowness of the philosophical problem in (a)**. A *very* sympathetic reader could argue: "The demandingness problem *is* the primary philosophical engine behind the supererogation debate, especially post-Uttilitarianism. Framing it as the 'demandingness objection wearing a different hat' shows insight into the *practical* motivation for the conceptual gap. While broader structural issues exist, the student correctly identifies the most salient *problem* driving the discussion." This defense has merit, though I believe the answer still needed to gesture towards the deeper conceptual tension beyond just the consequentialist slope. If persuaded, (a) could rise to 8/10, making the total 18/25. However, the conflation with the *consequentialist* objection specifically remains a simplification.

  **On the Kant Paragraph:** It *is* interesting – the student identifies a *surface similarity* (discretion) between Kant's wide duties and supererogation that often tempts people. However, it's precisely this tempting misunderstanding that makes it a **significant error** in an upper-level context, demonstrating a need for deeper textual/conceptual precision regarding the nature of obligation in Kant. The paragraph highlights a common confusion rather than offering a sophisticated insight.
