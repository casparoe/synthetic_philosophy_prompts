prompt: |-
  I'm putting together a grad seminar on naturalizing mental content and I want the spec on the table before anyone opens a single paper. You know this literature cold — philosophy of mind, the teleosemantics wars — so think it through carefully, and start with a few lines of brainstorming about what "a theory of content" is even supposed to deliver before you commit to a list.

  The twist, which should shape everything: I'm co-teaching with comparative cognition people, and the live dispute in the room is whether scrub-jays and bees have beliefs or just elaborate dispositions. So write the desiderata for a naturalistic theory of mental content that could actually be brought to bear on that question. Each requirement needs the case or consideration behind it, plus a flag for whether its non-negotiable or a prejudice of one camp. Cover the usual suspects — misrepresentation, the disjunction problem / determinacy of content, novel concepts nothing in your ancestry ever encountered, content's role in causal explanation — but also tell me straight whether an accessibility requirement (could a field biologist in principle gather the facts your theory says fix content?) deserves a place on the list at all, or whether thats just verificationism in a lab coat.

  Then the part I most want: is any subset jointly unsatisfiable? My hunch is that a strictly etiological requirement about selection history collides with the accessibility one, and that the Swampman demand is doing something sneaky — it isn't really a desideratum, it's a metaphysical commitment wearing a thought experiment's clothing. Tell me if I'm right or if I've run two separate problems together.

  Close with which single requirement knocks out the most candidates, and one line each on where the main contenders — biosemantics, indicator semantics, asymmetric dependence, hybrid teleo-functional-role — die. A table is fine for the list. No bibliography, I'll handle the readings myself.
