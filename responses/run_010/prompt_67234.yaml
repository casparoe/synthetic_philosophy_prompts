  ### Brainstorming: Identifying Challenges and Mechanism Selection  
  **Hardest Features to Stage:**  
  1. **Building a track record without independent verification:** Students must record "matches" based solely on the device’s outputs, yet feel they are gathering genuine evidence. The ledger must obscure the circularity until the reveal.  
  2. **Hidden fault introduction:** A defect must be inserted mid-game that (a) evades detection via the ledger, (b) doesn’t alter the device’s physical behavior, and (c) is revealed to invalidate the record.  
  3. **Costly wager with psychological commitment:** Students must bet points based on their confidence, with payoffs that incentivize rational betting (not guessing or avoidance).  

  **Candidate Mechanisms:**  
  - **Candidate 1 (Dual-sensor box):** Two devices (e.g., "light sensors") report on a hidden card. Students compare reports to infer matches. *Rejected:* Requires two devices per student (costly), and device disagreement might trigger skepticism too early.  
  - **Candidate 2 (Deferred-reveal cards):** Cards are sealed in envelopes; students open some for "spot-checks." *Rejected:* Physical envelopes are slow to manage, and opening them feels like independent access, undermining the circularity.  
  - **Candidate 3 (Chosen: Shuttered-window box):** A box with a card slot, a display for the device’s report, and a shuttered window. The device "senses" the card’s color, but students cannot see the card unless they pay (Condition A) or never see it (Condition B). Condition B records "matches" by fiat: they copy the report as the "actual." *Chosen:* Physically simple (uses one box per condition), forces Condition B into circular recording, and allows a hidden fault via a preprogrammed report sequence.  

  **Why Others Lost:**  
  - Candidate 1 overcomplicates materials and risks early skepticism from inconsistent reports.  
  - Candidate 2 lacks a clean "no independent access" setup for Condition B and is logistically messy.  

  ---

  ### Materials List  
  1. **Device boxes (×2):** Identical sealed plastic containers (e.g., 6"×8"×3" storage boxes) with:  
     - A card slot (front).  
     - A digital display (e.g., 2-digit LCD) showing "R" (red) or "B" (black).  
     - A button to "activate" the device (triggers the display).  
     - A shuttered window (back; sliding cover controlled by facilitator).  
     - *Hidden:* A switch inside to toggle between "reliable" and "faulty" modes (e.g., a dip switch).  
  2. **Playing cards:** 40 cards (red/black suits only; no jokers). Pre-sorted sequence: 20 red, 20 black.  
  3. **Ledgers (×14):** Condition-specific paper templates (see below).  
  4. **Pens (×14).**  
  5. **Point tokens (optional):** Poker chips or tally sheets to track points.  

  **Ledger Templates**  
  **Condition A (Spot-Check):**  
  | Trial | Device Report | Spot-Check? (Cost: 3 pts) | Actual Color | Match? (Y/N) |  
  |-------|---------------|----------------------------|--------------|-------------|  
  | 1     |               |                            |              |             |  
  | ...   | ...           | ...                        | ...          | ...         |  

  **Condition B (Never-Check):**  
  | Trial | Device Report | Actual Color (Record Here) | Match? (Y/N) |  
  |-------|---------------|----------------------------|--------------|  
  | 1     |               |                            |              |  
  | ...   | ...           | ...                        | ...          |  

  *Instructions for Condition B (printed on ledger):* "For each trial: (1) Write the device’s report. (2) In ‘Actual Color,’ copy the report exactly. (3) Since they match, mark ‘Y’ in ‘Match?’."  

  ---

  ### Timeline (75-Minute Session)  
  - **0–5 min:** Assign conditions. Split room: Left side = Condition A (spot-check), right side = Condition B (never-check). No cross-talk allowed.  
  - **5–10 min:** Distribute materials. Read rules verbatim (no clarifications).  
  - **10–35 min:** Run trials. 15 trials total. After Trial 10, facilitator flips hidden switch to "faulty" mode.  
  - **35–40 min:** Students tally matches and write reliability belief ("Yes/No").  
  - **40–45 min:** Wager on final trial. Collect bets.  
  - **45–50 min:** Run final trial (device reports "R"; actual card is black).  
  - **50–55 min:** Reveal hidden fault and true card sequence.  
  - **55–75 min:** Debrief (map activity to argument, discuss variants).  

  ---

  ### Full Rules  
  - **Points:** Start with 20 points. Convert to credit (e.g., 20 pts = +0.5% course credit) or snacks.  
  - **Spot-check cost (Condition A):** 3 points per check. If paid, facilitator opens shutter for 3 seconds.  
  - **Wager:** Bet 0–20 points on the actual color (red/black) of the final card.  
    - Correct bet: Win +2× bet.  
    - Wrong bet: Lose bet.  
    - Bet 0: No gain/loss (free-ride payoff = 0).  
  - **Parallel conditions:** No sharing data. Facilitator monitors separation. If groups compare notes, pause and remind: "Focus on your condition."  
  - **Hidden fault:**  
    - **Reliable mode (Trials 1–10):** Device reports correctly (display matches card).  
    - **Faulty mode (Trials 11–15):** Device always reports "R" (red), regardless of card.  
    - *Deck sequence for Trials 11–15:* B, R, B, B, R (3 black, 2 red; device reports "R" for all).  
  - **Fault reveal:** After final trial, facilitator:  
    1. Shows switch and explains modes.  
    2. Reveals true card sequence for Trials 11–15 (displayed on board).  
    3. Condition B’s "matches" for Trials 11–15 are invalidated (3 errors).  

  **If Condition A is more confident:** Rare (spot-checks may miss faults). In debrief, note: "Costly checks reduce confidence—but should they? What if checks are unaffordable?"  

  ---

  ### Facilitator Script  
  **Setup (0–5 min):**  
  *Literal script:* "Today, we’re testing how we evaluate tools. Group A: Your device has a spot-check option—pay 3 points to see the card. Group B: No spot-checks. Follow your ledger instructions exactly. No discussing between groups. Start with 20 points."  

  **Rules (5–10 min):**  
  *Literal script:*  
  - "Each trial: I insert a card. You press the button. Record the report.  
  - Condition A: Decide if you pay 3 points to spot-check. If yes, I open the shutter. Record actual and match. If no, leave ‘Actual’ and ‘Match?’ blank.  
  - Condition B: Write the report. Copy it to ‘Actual Color.’ Mark ‘Y’ for match.  
  - After 15 trials, tally your matches. Write ‘Yes’ or ‘No’: do you believe the device is reliable?  
  - Final trial: Bet 0 to 20 points on the actual color. Correct: double points. Wrong: lose bet."  

  **Reveal (50–55 min):**  
  *Literal script:*  
  1. "Final trial: Device reported ‘R.’ Actual card was black."  
  2. "Now, I flipped a switch after Trial 10. Before: correct reports. After: device always says ‘R.’ Here’s what really happened:" [Display Trials 11–15: Device: R,R,R,R,R | Actual: B,R,B,B,R].  
  3. "Condition B: Your ledger shows 5 matches, but 3 were wrong."  

  **Lines to Avoid Until Reveal:**  
  - "This is about circularity/reliabilism."  
  - "Is this evidence reliable?"  
  - "You’re assuming the device is correct."  
  - "What if the device is broken?"  

  ---

  ### Debrief: Mapping Activity to Argument  
  1. **Move to fact (Circular recording):** Condition B copies report → "actual." *Argument step:* Using source’s output to define truth (e.g., "The thermometer says 22°C, so it is 22°C").  
  2. **"Device said so when so":** Tallying "matches" from Step 1. *Argument step:* Inferring accuracy from self-verified data (e.g., "The thermometer was right each time").  
  3. **Generalization to reliability:** Belief written pre-wager. *Argument step:* Concluding the source is reliable (e.g., "Thermometers are trustworthy").  
  4. **Independent access requirement:** Spot-checks (Condition A) as the only way to avoid circularity. *Principle needed:* "A source’s reliability cannot be established solely by its own outputs."  
     - **Cost:** Forbids "basic knowledge" from a single source (e.g., trusting vision to confirm vision via mirrors).  
  5. **Bootstrapping vs. easy knowledge:**  
     - *Activity instantiates bootstrapping:* Reliability inferred from self-generated track record (attacking reliabilism).  
     - *Easy knowledge variant (10-min):* Use the same device but frame it as "detecting brain-in-vat deception." Students record device reports like "Not a brain-in-vat." They copy to "actual" and tally "matches." Reveal: Device always reports "Not a brain-in-vat," even if deceived. Targets basic-knowledge accounts.  

  ---

  ### Failure Modes and Fixes  
  1. **Student names circularity early (e.g., "This is begging the question!"):**  
     - *In-room sign:* Defensive peers; facilitator pressured.  
     - *Cheap fix:* "Interesting—let’s see if the ledger design addresses that. Proceed as instructed." Post-reveal: "You spotted the issue. How did the procedure hide it?"  

  2. **Group refuses to wager (bets 0 points):**  
     - *In-room sign:* Low confidence; avoidance in Condition B.  
     - *Cheap fix:* In debrief, contrast: "Those who bet 0 suspected a flaw. What minimal evidence would you need to bet?"  

  3. **Fault detected early (e.g., Condition A spots error in Trial 11):**  
     - *In-room sign:* Panic in Condition A; Condition B doubts.  
     - *Cheap fix:* Proceed normally. In debrief: "One group caught the fault—but what if spot-checks were unaffordable?"  

  ---

  ### Candid Notes  
  **Unreproducible Element:** The activity cannot show why circularity *feels* legitimate in real life (e.g., using vision to check glasses). *Facilitator must supply:* "We accept circular-seeming checks when sources are pre-trusted (e.g., vision), but this trust itself needs justification."  

  **Confidence in Ledger:**  
  - *Condition A:* Real confidence from spot-checks (if done).  
  - *Condition B:* Performed confidence (they follow instructions but often feel uneasy). *Verbal note:* "In B, you acted confident because the task required it—like how we ‘trust’ sources daily without scrutiny."
