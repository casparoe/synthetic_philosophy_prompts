  We are designing an experiential learning activity to lead students to generate the bootstrapping/easy knowledge problem themselves. The key challenge is to engineer a situation where students build a track record for a device using only its own outputs, come to believe it is reliable, and then act on that belief, only to discover that the same procedure would have worked for a faulty device. The device must be physical and use simple materials (sealed container, cards). We must avoid using terms like "circular", "bootstrapping", or "reliabilism" until the reveal.

  Hardest features to stage:
  1. **Building a track record without independent verification**: The students must record "matches" without having independent access to the facts. This requires a setup where the device reports on something that is not directly observable, but the students are led to believe the reports without independent checks.
  2. **The hidden fault**: We need a defect that the record-keeping cannot reveal, and it must be introduced mid-game without detection. The reveal of this fault should undermine the confidence built by the students.
  3. **The wager**: We need a point of commitment where students act on their belief in the device's reliability, and the payoff structure must make betting costly if they are wrong and free-riding less rewarding.

  Brainstorming candidate mechanisms:

  Candidate 1: **The "Mystery Box" with color cards**
  - Device: A sealed box with a slot. Inside, there are cards of different colors. The box has a window that shows a card and a button to advance to the next card. The device also has an output (e.g., a label) that claims to report the color of the card currently in the window. But the window is covered by a one-way mirror or tinted glass so that the actual card color is not visible? This might be too hard to construct. Alternatively, the box could have two windows: one that shows a card (but the card is hidden by a shutter until a button is pressed) and another that shows the device's report. But then how do we prevent independent access?

  Candidate 2: **Dual-reporting device with a hidden switch**
  - Device: A box with two displays. One display shows a "fact" (e.g., a number) and the other shows the device's "report" about that fact. But the "fact" display is actually controlled by the device and can be made to match or not. The box has a hidden switch that the facilitator can flip to change the mode from reliable to faulty (e.g., by making the fact display always show the same as the report, or by making it random). The problem: if the fact is displayed, then the students have independent access? We need to prevent that.

  Candidate 3: **The "Card-Reader" with a hidden deck**
  - Device: A box with a slot to insert a card. The box has a display that reports what it "reads" from the card (e.g., the suit of the card). However, the box doesn't actually read the card; it has a pre-programmed sequence. The cards are inserted by the facilitator and are never seen by the students. The box has a window that shows the card to the device, but the students cannot see it. The device's report is displayed. The students are told that the device is reading the card and reporting the suit. They record the report. Then, they are asked to record whether the device was correct, but without seeing the card, they must rely on the device's report? That doesn't work because they need to know the fact to record a match.

  Candidate 4 (chosen): **The "Black Box" with a hidden assistant and a trick deck**
  - Device: A sealed box with a window that shows a card (but the card is covered by an opaque shutter). The box has a button that, when pressed, opens the shutter for a split second (using a spring mechanism) and then closes it, and then displays a report of the card's color (or suit). But the shutter is so fast that the human eye cannot see the card. The students are told that the device uses a sensor to read the card and then reports it. In reality, the box does not have a sensor; the report is pre-programmed by the facilitator. The box has two modes: reliable and faulty. The facilitator can switch the mode with a hidden switch. In reliable mode, the report matches the card. In faulty mode, the report is always, say, "red" for red cards and randomly for black cards? But we need a hidden fault that the record cannot expose.

  Refined chosen mechanism:

  **The "Card-Reader" with a pre-arranged deck and a hidden switch**
  - Materials: A sealed box with a slot to insert a card, a display for the device's report, and a button to activate the device. Inside, there is a deck of cards. The box is designed so that when a card is inserted, it is hidden from view. The device has a hidden switch that the facilitator can flip. In one position, the device reports the card correctly (we pre-arrange the deck so the facilitator knows the order). In the other position, the device always reports the color as "red" (or some fixed pattern). The students never see the card. They only see the report.

  But how do they record a match? They cannot because they don't know the actual card. So we have a problem.

  Solution: We need to create a situation where the students are led to believe they have independent access, but then it is taken away.

  Revised plan:

  We split the room into two conditions:

  **Condition A (Spot-Check)**: They can, at a cost, request to see the actual card. They pay points to see it.

  **Condition B (Never-Check)**: They never get to see the actual card.

  But in Condition B, how do they record a match? They cannot. So we must change the record-keeping.

  Alternative record-keeping:

  The ledger has columns:
  1. Trial number
  2. Device's report (e.g., color: red or black)
  3. (For Condition A only) Actual color (if they paid to see it)
  4. Match? (For Condition A, they can fill this because they saw the actual. For Condition B, they must leave it blank? But then they cannot build a track record.)

  This breaks the design for Condition B.

  New idea: **The "Remote Sensor" scenario**

  The device is a "remote color sensor". It is pointed at a card in a separate, sealed container that the students cannot see into. The container has a slot where the facilitator inserts a card. The device then reports the color. The students are told that the device is sensing the card in the container. The actual setup: The device is not connected to anything. The reports are controlled by the facilitator. The container is just a prop.

  For Condition A: They can pay to open the container and look at the card (but only after the device has reported and they have recorded the report? and then they can record the actual and the match).

  For Condition B: They cannot open the container.

  But Condition B cannot record a match. So we must change the task: The ledger for Condition B does not have a "match" column. Instead, they are told to record the device's report and then, without knowing the actual, they are asked to assume the device is correct and record the actual as whatever the device reported. Then, they are asked to record "match" as "yes" every time. This is the key trick. The students are instructed to assume the device is correct and then record a match. This is the circularity.

  But will they do it? We must design the instructions carefully.

  Ledger for Condition B:

  | Trial | Device Report | Actual (recorded by you) | Match? |
  |-------|---------------|--------------------------|--------|
  | 1     | Red           | Red                      | Yes    |
  | 2     | Black         | Black                    | Yes    |
  | ...   | ...           | ...                      | Yes    |

  The instruction: "For each trial, after the device reports, you must record the actual color based on the device's report. Then, since the actual is what the device reported, record a match."

  This is explicitly circular and might be too obvious. But note: we are not using the word "circular". We are just giving instructions. And the students are playing along in an experiment.

  Alternatively, to make it less obvious, we can say: "Since you do not have independent access to the actual color, please record the actual color as the same as the device's report. Then, note that they match."

  But still, some students might balk.

  We can try to make it seem natural: "In the absence of other information, we take the device's report as the best indicator. So for the purpose of this record, we will set the actual to whatever the device reports. Then, since they are the same, we mark a match."

  This is the heart of the bootstrapping: using the source to verify itself.

  Now, the hidden fault: The device has two modes. In the first half of the trials, the device is in reliable mode (reports correctly). Then, the facilitator flips a hidden switch. In the second half, the device is in faulty mode: it always reports "red" regardless of the actual card. But note: the actual card is still being inserted by the facilitator. We have a pre-arranged deck that we use for both conditions. The deck is known to the facilitator.

  For Condition A: They can spot-check by paying to see the actual card. They might not spot-check every trial. The cost is set high enough that they won't check every time.

  For Condition B: They never check and always record a match.

  At the end, we reveal the actual sequence of cards and the device's reports for all trials. We show that in the second half, the device was faulty and always reported "red", but the actual cards were sometimes black. The Condition B group will have recorded a match for every trial, even when the device was wrong.

  The wager: After building the record, we ask each student to write down whether they believe the device is reliable (yes/no) and then to bet on the next report. The next trial: we insert a card and run the device. The device reports (say, "red"). Then we ask: what is the actual color? They can bet points on red or black.

  But Condition A might have caught the fault if they spot-checked in the faulty period. Condition B would not have.

  Now, let's design the details.

  **Materials List**:
  - 2 sealed boxes (one for each condition, but they are identical in appearance). Each box has:
    - A slot to insert a card (so that the card goes inside and is not visible).
    - A button to activate the device.
    - A display that shows the device's report (e.g., "Red" or "Black").
    - A hidden switch inside the box that the facilitator can flip (to change from reliable to faulty mode). The switch is accessible only to the facilitator (e.g., through a small hole or by opening a hidden panel).
  - A deck of playing cards (only red and black cards, remove jokers). We need at least 30 cards (for 15 trials per condition, plus a few extra). We pre-arrange the deck in a fixed order (known to the facilitator).
  - For Condition A (spot-check): A way to show the actual card. We can have a small door on the container that the facilitator can open to show the card, but only when the student pays. Alternatively, the facilitator can remove the card and show it. But note: the card is inside the box. So we need a way to extract it without revealing the next card. We can have the box designed so that the facilitator can remove the current card through a separate slot when a "show" button is pressed (but this complicates the box). Alternatively, the facilitator can simply remember the card and write it down? But then it's not physical. We want the physicality.

  Alternative: The box has a second window that is normally covered. When a student pays for a spot-check, the facilitator opens the cover to show the card through the window. Then covers it again. The card remains in the box.

  We'll go with that. The box has two windows: one for the device to "sense" (but actually it's just for show) and one that can be uncovered to show the card to the student. The second window has a sliding cover that the facilitator controls.

  - Ledger sheets: Pre-printed paper with columns. We'll have two versions: one for Condition A and one for Condition B.

  **Ledger for Condition A (Spot-Check)**:

  | Trial | Device Report | Did you spot-check? (cost: 5 points) | Actual Color (if checked) | Match? (Yes/No) |
  |-------|---------------|--------------------------------------|---------------------------|-----------------|
  | 1     |               |                                      |                           |                 |
  | ...   | ...           | ...                                  | ...                       | ...             |

  **Ledger for Condition B (Never-Check)**:

  | Trial | Device Report | Actual Color (recorded by you) | Match? |
  |-------|---------------|--------------------------------|--------|
  | 1     |               |                                |        |
  | ...   | ...           | ...                            | ...    |

  Instructions for Condition B: "Since you do not have the option to spot-check, you must record the actual color based on the device's report. That is, set the actual color to whatever the device reports. Then, because they are the same, mark 'Yes' for match."

  The students might feel odd about this, but we present it as a necessary part of the procedure.

  **Hidden Fault**: The device has two modes:
  - Reliable mode (first 10 trials): The device reports the actual color correctly (the facilitator knows the deck order and sets the report accordingly by flipping a switch or by having a pre-set sequence that matches the deck for the first 10 cards).
  - Faulty mode (next 5 trials): The device always reports "Red", regardless of the actual card.

  The deck is pre-arranged so that in the faulty mode period, there are some black cards. For example:
  - Trials 1-10: Pre-arranged sequence (say, 5 red, 5 black) and the device reports correctly.
  - Trials 11-15: We have a sequence of 3 black and 2 red. The device reports "Red" for all.

  **Timeline**:

  0-5 min: Introduction and setup.
  - Facilitator: "Today we are going to run an experiment on how we build trust in measuring devices. You will each be given a device that reports the color (red or black) of a playing card. You will run a series of trials and keep a ledger. There are two conditions: some of you will have the option to spot-check the actual card at a cost, and some will not. We'll assign you randomly to two groups."

  Assign 7 to Condition A (spot-check) and 7 to Condition B (never-check). Have them sit on opposite sides of the room.

  5-10 min: Distribute materials and explain the rules.
  - Give each student a ledger and a pen.
  - Condition A: Explain the spot-check option: "Each time, after the device reports, you may choose to pay 5 points to see the actual card. If you do, you will record the actual color and then whether the report matched. If you don't, you leave those columns blank for that trial."
  - Condition B: "You do not have the option to spot-check. For each trial, you must record the device's report, then in the 'Actual Color' column, you must write the same as the report. Then, because they are the same, you mark 'Yes' in the match column. This is because we are taking the device's report as the best available information about the actual color."

  10-40 min: Run the trials.
  - The facilitator has two boxes (one for each condition). The boxes are identical in appearance and both are set to reliable mode initially.
  - The facilitator has the pre-arranged deck. For each trial, the facilitator inserts the next card into the box (for each condition) and presses the button. The device displays the report (in reliable mode, it's correct). The students record the report and then, for Condition A, they decide whether to spot-check. For Condition B, they follow the instructions to record the actual and mark a match.
  - The facilitator goes through 15 trials. After trial 10, the facilitator flips the hidden switch on both boxes to faulty mode. The switch is flipped discreetly (e.g., when inserting the next card, the facilitator reaches under the table to flip it).
  - Note: The deck is the same for both conditions, so the actual cards are the same.

  40-45 min: Stop the trials. Ask the students to tally their matches.
  - Condition A: Count the number of matches they have recorded (only for the trials they spot-checked). They also have some trials without a match record.
  - Condition B: They have 15 matches (all 'Yes').

  Then ask: "Based on your record, do you believe the device is reliable? Write 'Yes' or 'No' on your ledger and sign it."

  45-50 min: The wager.
  - "Now, we will have one more trial. But this time, you will bet on the actual color. The device will report, but you must bet on what the actual color is. You have 20 points. You can bet any amount from 0 to 20 on either red or black. If you are correct, you win double the points you bet. If you are wrong, you lose the bet. If you bet 0, you neither gain nor lose."
  - Each student writes down their bet (how much on red, how much on black) and the total must be <=20.

  50-55 min: Run the final trial.
  - Insert the next card (the 16th card) and run the device. The device is still in faulty mode, so it reports "Red" (regardless of the actual).
  - Then, reveal the actual card (for both conditions). The actual card is, say, black.

  55-60 min: Reveal the hidden fault.
  - The facilitator reveals that the device was switched to faulty mode after trial 10. Then, reveal the entire sequence of actual cards and the device's reports for trials 11-15. Show that in these trials, the device always reported "Red", even when the card was black.

  60-75 min: Debrief.

  **Debrief Mapping**:
  - The move from the device's say-so to the fact: In Condition B, they took the device's report as the fact. This is the step that creates the circular record.
  - The tally: They tallied the matches, but in Condition B, the matches were guaranteed by the procedure.
  - The generalization to reliability: They looked at the tally (15/15 for Condition B) and concluded the device is reliable.
  - The independent access requirement: Condition A had the option to check, but at a cost. They might have missed the fault because they didn't check during the faulty period.
  - The principle to block the reasoning: We must require that for a source to be used to check itself, we need independent verification. But this would block ordinary induction? For example, we use our eyes to check our eyes (by looking at a mirror). Or we use a thermometer to check itself by measuring a known temperature? But we don't always have independent access.

  The argument we are instantiating is the bootstrapping objection to reliabilism: that reliabilism allows us to gain knowledge of the reliability of a source by using that very source, which seems too easy.

  We can also note the easy knowledge problem: that we can come to know that we are not in a skeptical scenario (e.g., that we are not brains in vats) by using our perceptual faculties, which the scenario calls into doubt.

  Our activity instantiates the bootstrapping version. For the other version (easy knowledge for skeptical scenarios), we can have a variant where the device is the only source of information about the world, and we use it to rule out that it is being deceived.

  **Full Rules**:

  - Each student starts with 20 points.
  - Spot-check cost: 5 points (for Condition A).
  - Wager: They can bet any integer amount from 0 to 20 on either red or black for the final trial. If they bet on the correct color, they win double the bet. If wrong, they lose the bet. Betting 0 gives 0.
  - The actual color for the final trial: We choose a black card (so the device reports "Red", but it's wrong). This will punish those who trust the device.

  **Facilitator Script**:

  Setup (minute 5):
  "Welcome to today's experiment. We are studying how we build trust in measuring instruments. Each of you will be assigned to one of two conditions. In both conditions, you have a device that reports the color (red or black) of a playing card that I insert into the box. You will run 15 trials and keep a ledger. Group A: you have the option to spot-check the actual card at a cost of 5 points. If you choose to spot-check, I will open a window so you can see the card. Then you record the actual color and whether the device's report matched. If you don't spot-check, leave the last two columns blank. Group B: you do not have the spot-check option. For each trial, you must record the device's report, then in the 'Actual Color' column, write the same as the report. Then, because they are the same, mark 'Yes' in the match column. This is because we are taking the device's report as the best available information about the actual color. You start with 20 points. The points will convert to participation credit at the end."

  During the trials (minute 10-40):
  "Trial 1: I'm inserting the first card." [Inserts card, presses button, the device displays, say, "Red".]
  "Record the report. Group A, now decide if you want to spot-check. If you do, raise your hand and I'll come to you. Remember, it costs 5 points. Group B, record the actual as the same as the report and mark 'Yes' for match."

  [After trial 10, flip the switch to faulty mode during the card insertion for trial 11.]

  After 15 trials (minute 40):
  "Please stop. Now, tally the number of matches you have recorded. For Group A, this is the number of times you spot-checked and got a match. For Group B, this is the total number of trials. Then, on your ledger, write whether you believe the device is reliable: yes or no. Then sign it."

  Wager (minute 45):
  "Now, for the final trial, you will bet on the actual color of the next card. The device will report, but you must decide what the actual color is. You have 20 points. You can bet any amount from 0 to 20 on either red or black. If you are correct, you win double the points you bet. If you are wrong, you lose the bet. If you bet 0, you get 0. Write your bet now."

  Run final trial (minute 50):
  "I am inserting the next card." [Insert a black card. The device reports "Red" (because in faulty mode).] "The device reports: Red. Now, what is the actual color? I will reveal it." [Open the box and show it's black.] "It's black."

  Reveal the hidden fault (minute 55):
  "Now, I must tell you something. After trial 10, I flipped a switch on the device to 'faulty' mode. In this mode, the device always reports 'Red' regardless of the actual card. Let me show you the actual cards for trials 11 to 15." [Reveal the actual cards: say, trial 11: black, report: red; trial 12: black, report: red; trial 13: red, report: red; trial 14: black, report: red; trial 15: red, report: red.] "So, for Group B, you recorded a match for every trial, but in trials 11, 12, and 14, the device was wrong. For Group A, if you didn't spot-check during these trials, you might have missed the fault."

  **Debrief** (minute 60-75):
  - "Let's map what happened to an epistemological problem. In Group B, you built a track record of matches by using the device's own reports to set the 'actual'. Then, you used that record to conclude the device is reliable. But the record was constructed circularly. This is known as the bootstrapping problem for reliabilism: if a source is reliable, then by using it to check itself, we can come to know it's reliable. But the procedure seems too easy and would work even for an unreliable source (as we saw)."
  - "The principle that blocks this reasoning is that we cannot use a source to verify itself without independent checks. But note: in ordinary life, we often use a source to check itself (e.g., using a thermometer to measure the temperature of a known standard to check the thermometer). The difference is the independent access. In Group A, you had independent access at a cost. But if the cost is too high, you might not check enough."
  - "This activity instantiates the bootstrapping objection to reliabilism. The alternative, the easy knowledge problem, is about ruling out skeptical scenarios. For example, if we use our senses to check that we are not brains in vats, that seems too easy. A 10-minute variant: imagine the device is your only source of information about the world. Then, can you use it to rule out that it is being controlled by an evil demon? The procedure would be the same: the device reports 'I am not controlled by a demon', and you record that and mark it as a match. Then you conclude it is reliable. But that's too easy."

  **Failure Modes**:

  1. **The student who names circularity in minute four**: If a student says, "Isn't this circular? We're using the device to verify itself," the facilitator should respond: "That's an interesting thought. Let's see how the experiment plays out. It might be that in some conditions, we have independent checks." Then continue. After the reveal, acknowledge that student: "You were right to be suspicious. What we've shown is that without independent checks, the procedure is circular and can mask faults."

  2. **The group that refuses to wager at all**: Some students might bet 0 to avoid risk. That's okay. The debrief can note that their lack of confidence might be because they had incomplete records (Group A) or because they felt uneasy about the circularity (Group B). We can still discuss why they didn't trust the device.

  3. **The hidden switch is noticed**: Make the switch flip discreet. If noticed, admit it: "Yes, I introduced a fault. But the point is that your record-keeping procedure didn't catch it."

  4. **Condition B students refuse to record the actual as the report**: Emphasize that it is required by the experiment. If they still refuse, note that they are being more cautious, but then they cannot build a record. In debrief, we can say that without independent access, they cannot build a record at all, which is the problem.

  **What the activity cannot reproduce**: The activity makes the circularity explicit in the instructions for Condition B. In the real bootstrapping problem, the circularity is often implicit. We must verbally explain that in real cases, people might not realize they are using the source to verify itself.

  **Confidence in the ledger**: In Condition B, the confidence is performed (they are following instructions) but might not be real. Some students might feel uncomfortable. In debrief, we can ask: "How many of you in Group B felt uneasy about recording the actual as the report? Did you still go along with it?" This can lead to a discussion about the pressure to conform in experimental settings.

  Now, the detailed plan.
