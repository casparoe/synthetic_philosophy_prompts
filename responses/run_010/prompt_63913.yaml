  The diagnosis in section 4 is particularly strong - showing exactly how the entropy method smuggles in asymmetric likelihoods. Section 5 could be expanded with more formal modeling to strengthen the argument. The conjecture in section 6 about non-neutral scenarios is insightful but might belong in a follow-up paper.

