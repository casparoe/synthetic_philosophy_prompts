  For ORRERY-3, I'll make it painfully mundane (bus scheduling!) to highlight how moral crises emerge from unexpected places. The appendix listing its "experiences" should read like tech specs parodying qualia reports.

  Important - in the closing analysis, must acknowledge where the parody distorts: 
  - The termination clause oversimplifies phenomenology without self-models
  - Moral status debt accounting assumes fungibility of moral value
