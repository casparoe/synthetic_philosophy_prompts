  - Node3: Player A moves. If TAKE, payoffs: (6,2). If PASS, go to Node4.
  - Node4: Player B moves. If TAKE, payoffs: (3,7). If PASS, go to Node5.
  - Node5: Player A moves. If TAKE, payoffs: (8,4). If PASS, go to Node6.
  - Node6: Player B moves. If TAKE, payoffs: (5,10).

  **Prediction Sheet (for Game1):**
  - "You are assigned as Player [A/B]. Please write your complete plan for every node at which you might move in the game. For each node, indicate whether you would TAKE or PASS if the game reached that node."
    - Node1 (A): ______
    - Node3 (A): ______
    - Node5 (A): ______
    (Similarly for Player B: Node2,4,6)

  But note: if they are Player A, they move at nodes 1,3,5. So they only fill those.

  **Recording Sheets for Play:**
  For each game, a sheet to record the moves and where the game ended.

  **Instructions:**
  - We'll provide verbal instructions at each step.

  This design should achieve the goal of having students experience the paradox firsthand.
answer: |-
  ### Centipede Game Activity: The Withdrawn Guidance  
  **Objective:** Students experience the paradox of backward induction as a failure of guidance at off-equilibrium nodes, not as evidence of human irrationality.  

  ---

  ### 1. Pairing and Rotation Scheme  
  **Scheme:**  
  - **Initial Pairing (5 min):** Randomly assign 13 pairs (A/B roles) using numbered slips (1–26). Even numbers: Player A; odd: Player B.  
  - **First Game:** Full 6-node centipede (Game 1).  
  - **Rotation (5 min):** After Game 1, re-pair using a "rotating circle":  
    - Inner circle (13 students) stays seated.  
    - Outer circle (13) rotates one position clockwise.  
  - **Second Game:** Shortened game starting at Node 3 (Game 2, unannounced). Roles remain fixed (e.g., a Player A in Game 1 is still A in Game 2).  

  **Why this works:**  
  - Ensures all students play 2 games with different partners.  
  - Game 2’s hidden structural change (starting at Node 3) forces confrontation with the paradox.  

  ---

  ### 2. Payoff Table  
  **6-Node Centipede (Non-Money Currency):**  
  Payoffs in **extra-credit points** (non-zero-sum; 10 points = 0.1% final grade boost, capped at 0.3% total).  

  | Node | Player | Action | Payoff (A, B) | Total Pie |  
  |------|--------|--------|---------------|----------|  
  | 1    | A      | Take   | (4, 0)        | 4        |  
  |      |        | Pass   | → Node 2      |          |  
  | 2    | B      | Take   | (1, 5)        | 6        |  
  |      |        | Pass   | → Node 3      |          |  
  | 3    | A      | Take   | (6, 2)        | 8        |  
  |      |        | Pass   | → Node 4      |          |  
  | 4    | B      | Take   | (3, 7)        | 10       |  
  |      |        | Pass   | → Node 5      |          |  
  | 5    | A      | Take   | (8, 4)        | 12       |  
  |      |        | Pass   | → Node 6      |          |  
  | 6    | B      | Take   | (5, 10)       | 15       |  

  **Defense of Payoffs:**  
  - **Increasing total pie:** Rewards cooperation (Node 6: 15 > Node 1: 4), incentivizing passes.  
  - **Backward induction pressure:** At each node, taking gives the current player >50% more than their payoff if the opponent takes next (e.g., Node 1: A gets 4 by taking vs. 1 if B takes at Node 2).  
  - **Non-zero-sum:** Both players gain by continuing (e.g., Node 3 → Node 6: A gains 2, B gains 8).  
  - **Asymmetric ratios:** B’s payoffs rise faster (Node 6: B gets 10, A gets 5), creating tension—A may distrust B’s incentive to pass.  

  ---

  ### 3. Elicitation of Predictions  
  **Materials:** Prediction sheets (pre-filled with node numbers).  
  **Instructions (read aloud):**  
  > *"Before playing, write a complete plan. If you reach any node, what will you do? Assume you are playing a rational classmate. Sign and date. I will collect these."*  

  **Prediction Sheet (Player A Example):**  
  ```  
  Game 1 Plan (Player A):  
  Node 1: Take / Pass  
  Node 3: Take / Pass  
  Node 5: Take / Pass  
  Signature: ________ Date: ________  
  ```  
  **Why this works:**  
  - Forces commitment to a full strategy, not just a first move.  
  - Collected and held by instructor, preventing revision.  
  - Later, students compare plans to actual play, revealing inconsistencies (e.g., "I planned to pass at Node 1 but took").  

  ---

  ### 4. Core Mechanic: Deleted Opening Moves  
  **When to spring:** During Game 2 (after rotation).  
  **Setup:**  
  - Distribute **Game 2 sheets** (labeled "Game 2: Short Centipede") starting at Node 3:  
    - Node 3: A moves → (Take: (6,2) | Pass → Node 4)  
    - Node 4: B moves → (Take: (3,7) | Pass → Node 5)  
    - Node 5: A moves → (Take: (8,4) | Pass → Node 6)  
    - Node 6: B moves → (Take: (5,10))  
  - **Withhold:** Do not mention this is the same as Game 1’s Nodes 3–6.  

  **Instructions (read aloud):**  
  > *"Game 2 starts at the first node shown. No prior moves occurred. Decide independently—no discussion. Player A, choose now: Take or Pass?"*  

  **What happens:**  
  - Confident backward inductors (e.g., students who took immediately in Game 1) face Node 3 as Player A.  
  - **First 10 seconds:** *"If backward induction worked, I shouldn’t be here. Why is B going to take at Node 4? But we started here—maybe they won’t? I have no clue."*  
  - **Why it works:** The absence of prior "errors" makes the node’s existence contradict the induction. Students feel the reasoning collapse—not as a puzzle, but as a failure of guidance.  

  ---

  ### 5. Timeline and Debrief  
  **80-Minute Timeline:**  
  - **0–5 min:** Introduce activity. Distribute Game 1 sheets and prediction sheets. Assign roles.  
  - **5–10 min:** Students write prediction plans. Collect plans.  
  - **10–25 min:** **Game 1.** Pairs play full centipede (moves recorded on move-tracking sheets).  
  - **25–30 min:** Collect Game 1 results. Re-pair via rotation.  
  - **30–40 min:** **Game 2.** Distribute sheets starting at Node 3. No discussion. Play.  
  - **40–45 min:** Collect Game 2 results. Redistribute prediction plans and move records.  
  - **45–80 min:** **Debrief** (questions below).  

  **Debrief Sequence (Load-Bearing Elements):**  
  1. **Observed behavior:** *"In Game 1, where did most games end? Why?"*  
     - → Links to backward induction’s prediction (Node 1 take).  
  2. **Plan vs. play:** *"Compare your prediction plan to actual Game 1 moves. Where did you deviate? Why?"*  
     - → Highlights tension: Plans assume rationality, but play accounts for distrust.  
  3. **Game 2 experience:** *"When you started at Node 3 in Game 2, what did you believe about B’s next move? Why?"*  
     - → Exposes assumption collapse: "I assumed B would take, but the argument says Node 3 is unreachable."  
  4. **Induction step:** *"Backward induction says Node 3 should never occur. If it does, what does that imply about earlier players?"*  
     - → Undercuts rationality assumption.  
  5. **Common knowledge:** *"If both know the induction, why might Node 3 still happen?"*  
     - → Reveals fragility of common knowledge.  
  6. **Counterfactuals:** *"At Node 3, the induction tells you B will take at Node 4. But if B is rational, why might they not?"*  
     - → Shows argument’s circularity: It assumes Node 3 away, so it cannot guide there.  
  7. **Name the paradox:** Finally, label it: *"This is the paradox of backward induction: The argument withdraws guidance precisely where you need it."*  

  ---

  ### 6. Predictable Problems and Mitigations  
  **Problem 1: Collusion/altruism**  
  - **Predict:** Pairs agree to pass until Node 6 to maximize joint payoffs.  
  - **Mitigation:** Announce: *"Extra credit is individual. Your partner’s gain doesn’t affect yours."* Use private move recording.  

  **Problem 2: Extra credit fails to motivate**  
  - **Predict:** Students ignore payoffs ("It’s just 0.1%").  
  - **Mitigation:** Scale stakes: *"Top 3 point-earners get +0.3%."* Use urgent framing: *"Every point matters—this affects your grade."*  

  **Problem 3: Pairs finish early and idle**  
  - **Predict:** Game 1 ends fast; pairs wait 5+ minutes.  
  - **Mitigation:** Assign "observation task": *"Write why backward induction might fail here."* Collect responses.  

  **Problem 4: Trained student spoils equilibrium**  
  - **Predict:** Game theory student blurts, "Just take at Node 1—it’s the equilibrium!"  
  - **Mitigation:** Pre-empt: *"Do not discuss strategy aloud—this is about private discovery."* Isolate vocal students as observers.  

  ---

  ### 7. Limitation: What the Activity Cannot Replicate  
  **The Unreproducible Element:** Genuine **common knowledge of rationality (CKR)**.  
  - **Why:** Students reason about *dispositions of acquaintances* (e.g., "My partner seems nice") not abstract rationality. Social ties override CKR.  
  - **Deeper Limitation:** The activity cannot eliminate real-world knowledge. Students import beliefs about peers (e.g., "Sarah passed last time—she’ll pass again"), violating the "pure rationality" assumption.  
  - **Closing Argument (Instructor Script):**  
    > *"In class, your decisions were colored by knowing each other. But the paradox assumes players are abstractly rational with common knowledge of that fact. This is impossible in practice. The formal model fractures when it meets the real world—not because people are irrational, but because the model’s assumptions are untestable counterfactuals. Backward induction fails not in predicting humans, but in guiding them where it matters most."*  

  ---

  ### Activity Materials  
  **Handouts:**  
  1. **Game 1 Sheet:** 6-node centipede (payoffs as in Section 2).  
  2. **Game 2 Sheet:** 4-node "short" centipede (Nodes 3–6, unlabeled as such).  
  3. **Prediction Sheet:** Pre-filled node lists for Player A/B.  
  4. **Move-Tracking Sheet:** Columns for Nodes 1–6 (Game 1) or Nodes 3–6 (Game 2). Rows for "Take/Pass" and signatures.  

  **Setup:**  
  - **Room:** Movable tables arranged in 13 pairs.  
  - **Materials:** Pens, timer, numbered slips (1–26), extra-credit tracker.  
  - **Instructor Script:** Brief prompts for each phase (e.g., *"Record your plan—no changes later!"*).  

  **Outcome:** Students leave unsettled, having handwritten proof that backward induction cannot guide them at the nodes it deems impossible. The paradox becomes felt, not just taught.
