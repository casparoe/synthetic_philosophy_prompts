  The reference class problem is perfect for this. Let me mentally walk through each phase:
  First, the observational studies era. Key insight: the "HRT user" class wasn't neutral - it bundled socioeconomic factors with treatment choice. That's not gerrymandering (intentional class manipulation) but hidden confounding. The failure was mistaking correlation within a broad class (all HRT users) for causation.

  Then the WHI trial - such a clean example of class mismatch! Randomization solves confounding by creating comparable groups, but introduces new class issues: when the trial population (older women) differs fundamentally from intended beneficiaries (newly menopausal). The age cutoff debate now is Reichenbach's "narrowest class with good data" in action - but user's right to question whether it's data-driven or motivated reasoning.

  For their mum in 1996... oof. This hits hardest. Philosophically, there's no "true" probability for one person - only class-based estimates. And absolute/relative risk is separate but crucial: even if relative risk changes with class, absolute risk determines real-world harm.

  Finally, the big question: does this break probability? I think not - it shows reference classes need causal understanding. The lesson might be that frequentist tools require humility: we assign probabilities based on best-available classes while admitting their limitations. For individual decisions, that's where communication of uncertainty matters most.

