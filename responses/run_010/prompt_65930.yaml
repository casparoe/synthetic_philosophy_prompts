prompt: |-
  I have chaired the sickness-benefit appeals panel of a national research institute for two years; before that I spent thirty-five years directing a physiology laboratory, and I have come to the philosophy of medicine only recently and from that side. A case arrives next week that has split the panel, and I want a decision memorandum to circulate beforehand.

  The appellant is a 43-year-old instrument engineer. Her thyroid panel, morning cortisol, HbA1c, actigraphy sleep measures, and peak oxygen uptake all sit inside the reference ranges, so the panel's medical adviser holds that there is no dysfunction and therefore no disease. Yet she cannot sustain more than about ninety minutes of concentrated work without a two-day collapse, and has been unable to work at all for fourteen months. Her representative argues the reverse: the loss of her ability to pursue the goals she has reason to want is itself sufficient for disease. The uncomfortable precedent is that the same adviser approved extended paid leave this year for two colleagues with asymptomatic hyperlipidemia and well-controlled hypertension — statistically deviant, subjectively unimpaired.

  Please draft the panel's memorandum. It should decide the appeal; state the criterion of disease the panel ought to adopt for future cases, in a form members can actually apply to a file rather than debate in the abstract; show how that criterion disposes of the hyperlipidemia precedents consistently rather than by exception; and give the medical adviser's strongest objection — including his worry that an ability-based standard makes eligibility hostage to how the workplace happens to be organized, so that paid leave substitutes for accommodation — a full and honest answer.
reasoning: |-
  We are drafting a decision memorandum for the sickness-benefit appeals panel. The case involves a 43-year-old instrument engineer who has been unable to work for 14 months. Medical tests are within normal ranges, but she experiences severe functional limitations. The panel is split, and we must resolve the appeal and set a criterion for future cases.

  Key issues:
  1. The medical adviser argues that without objective evidence of dysfunction (i.e., abnormal test results), there is no disease and therefore no eligibility for sickness benefit.
  2. The appellant's representative argues that the inability to pursue important life goals (work) due to health-related issues is sufficient to establish disease and eligibility.
  3. Precedent: Two colleagues with asymptomatic hyperlipidemia and well-controlled hypertension (statistically deviant but subjectively unimpaired) were granted extended paid leave. This seems inconsistent.

  We need a criterion of disease that:
  - Is applicable to case files without abstract debate.
  - Handles the hyperlipidemia cases consistently.
  - Addresses the medical adviser's concerns about making eligibility dependent on workplace organization.

  Proposed approach:

  We adopt a biopsychosocial model of disease that integrates both objective and subjective elements. The criterion we propose is:

  **A condition constitutes a disease for the purpose of sickness-benefit eligibility if it meets both of the following:**
     **(a) There is a biological, psychological, or cognitive dysfunction (which may be inferred from symptoms and functional impairment even if not yet objectively measurable by current tests); and**
     **(b) The dysfunction causes significant impairment in the individual's ability to perform normal activities, including work, that they would otherwise be reasonably expected to perform, and this impairment is not due to transient or reversible environmental factors that the employer could reasonably accommodate without undue hardship.**

  This criterion does not require that the dysfunction be detectable by current laboratory tests. It allows for the possibility that the dysfunction may be demonstrated by symptoms and functional impact. However, it also guards against granting benefits for conditions that are merely statistical deviations without functional impact (as in the hyperlipidemia cases) and against situations where the impairment is primarily due to workplace organization that could be adjusted.

  Applying this criterion to the current case:

  - The appellant has a persistent pattern of functional impairment (inability to work for 14 months, and inability to sustain more than 90 minutes of concentrated work without a two-day collapse). This pattern suggests an underlying dysfunction even if current tests are normal. Therefore, condition (a) is met by inference from the symptoms and functional limitations.
  - Condition (b) is clearly met because the impairment prevents her from working at all.

  Thus, the appeal should be allowed.

  Regarding the hyperlipidemia precedents:

  - For the colleagues with asymptomatic hyperlipidemia and well-controlled hypertension: 
     - Condition (a) might be met because there is a biological dysfunction (statistically abnormal lipid levels and blood pressure). 
     - However, condition (b) is not met because they are subjectively unimpaired and able to work. Therefore, under our criterion, they would not have been eligible for extended paid leave on the basis of these conditions alone. The fact that they were granted leave might have been based on other considerations (e.g., preventive measures, but note: our criterion requires current impairment). Thus, the previous decisions were inconsistent with the criterion we now adopt. We clarify that for future cases, such conditions without functional impairment do not qualify.

  Addressing the medical adviser's strongest objections:

  1. **Objection: An ability-based standard makes eligibility hostage to how the workplace happens to be organized, so that paid leave substitutes for accommodation.**

     **Response:** Our criterion explicitly requires that the impairment must not be due to transient or reversible environmental factors that the employer could reasonably accommodate without undue hardship. This means that if the impairment can be overcome by reasonable workplace adjustments (e.g., changes in schedule, duties, or environment), then the condition does not meet criterion (b) and the individual would not be eligible for sickness benefit. Instead, the employer would be required to provide accommodation. Only when the impairment persists despite reasonable accommodations (or when accommodation is not feasible without undue hardship) does the condition qualify. Therefore, our criterion does not allow paid leave to substitute for accommodation; rather, it requires that accommodation be considered first. In the current case, if the appellant's condition is such that no reasonable accommodation can enable her to work, then she is eligible.

  2. **Objection: Without objective evidence of dysfunction, we open the door to subjective claims that are difficult to verify.**

     **Response:** We require a pattern of symptoms and functional limitations that are clinically significant and persistent (here, 14 months). The panel must rely on medical expertise to evaluate the consistency and plausibility of the reported symptoms and limitations. We also note that the absence of objective findings in current tests does not mean there is no dysfunction; it may reflect limitations of current diagnostic tools. However, we are not abandoning objective evidence. We are allowing the inference of dysfunction from the functional impairment when it is severe and persistent, and when other causes (such as malingering or non-health-related factors) have been reasonably excluded. The panel must exercise due diligence in reviewing the evidence.

  Draft Memorandum:

  ---

  **MEMORANDUM**

  **TO:** Sickness-Benefit Appeals Panel Members  
  **FROM:** Chair, [Your Name]  
  **DATE:** [Current Date]  
  **SUBJECT:** Appeal of [Appellant's Name], Case No. [XXXXXX] - Decision and Adoption of New Criterion for Disease  

  ### I. Introduction
  This memorandum addresses the appeal of [Appellant's Name], a 43-year-old instrument engineer, and sets forth a criterion for determining disease for sickness-benefit eligibility to guide future panel decisions. The appellant has been unable to work for 14 months due to a condition that causes her to collapse for two days after approximately 90 minutes of concentrated work. Standard medical tests (thyroid panel, morning cortisol, HbA1c, actigraphy sleep measures, and peak oxygen uptake) are within normal limits. The panel's medical adviser contends that without objective evidence of dysfunction, there is no disease. The appellant's representative argues that the functional impairment itself establishes disease. The panel is also mindful of two prior cases (hyperlipidemia and hypertension) that were approved despite the absence of functional impairment.

  ### II. Decision on the Appeal
  The panel **ALLOWS** the appeal. The appellant is eligible for sickness benefits.

  **Reasoning:**  
  The appellant's condition meets the criterion for disease adopted below (Section III). She experiences a severe and persistent functional impairment that prevents her from working. Although current diagnostic tests have not identified an objective dysfunction, the pattern of symptoms and functional limitations (inability to sustain work without prolonged recovery) is consistent with an underlying biological, psychological, or cognitive dysfunction. This dysfunction has caused a significant impairment in her ability to work for 14 months, and there is no evidence that this impairment can be overcome by reasonable workplace accommodations.

  ### III. Criterion for Disease in Sickness-Benefit Eligibility
  For the purpose of determining eligibility for sickness benefits, the panel adopts the following criterion:

  **A condition constitutes a disease if:**  
  **(a) There is a biological, psychological, or cognitive dysfunction (which may be inferred from symptoms and functional impairment, even if not yet objectively measurable by current tests); and**  
  **(b) The dysfunction causes significant impairment in the individual's ability to perform normal activities, including work, that they would otherwise be reasonably expected to perform, and this impairment is not due to transient or reversible environmental factors that the employer could reasonably accommodate without undue hardship.**

  This criterion must be applied to the evidence in each case file. The panel must consider:
  - The nature and persistence of symptoms and functional limitations.
  - Medical evidence (including test results, clinical evaluations, and expert opinions).
  - Whether the impairment is due to a health condition rather than non-health-related factors (e.g., workplace conflict, economic factors) or factors that can be reasonably accommodated.

  ### IV. Application to Hyperlipidemia Precedents
  In the prior cases of colleagues with asymptomatic hyperlipidemia and well-controlled hypertension, the panel's previous decisions were inconsistent with the criterion now adopted. 

  - These conditions involve biological dysfunctions (abnormal lipid levels and blood pressure) and thus might satisfy part (a). 
  - However, they did not cause significant impairment in the individuals' ability to work (part (b) was not met). Therefore, under the current criterion, such conditions alone would not qualify for extended paid leave. 

  We note that the previous approvals may have been based on other considerations (e.g., preventive medical advice, but note that our benefits are for sickness-related impairment). Going forward, the panel will apply the above criterion uniformly.

  ### V. Response to the Medical Adviser's Objections
  The medical adviser has raised important concerns, which we address:

  1. **Objection: An ability-based standard may make eligibility dependent on workplace organization, allowing paid leave to substitute for accommodation.**  
     **Response:** Our criterion explicitly requires that impairment not be due to factors that the employer could reasonably accommodate without undue hardship. If an accommodation can overcome the impairment, then the condition does not meet part (b) and the individual is not eligible for sickness benefits. Instead, the employer must provide the accommodation. Only when the impairment persists despite reasonable accommodations (or when accommodations are not feasible) does the condition qualify. Thus, our criterion does not allow paid leave to substitute for accommodation; it requires that accommodation be the first recourse.

  2. **Objection: Without objective evidence of dysfunction, we risk approving claims based solely on subjective reports.**  
     **Response:** The panel must base its decision on the totality of evidence. We require a consistent pattern of symptoms and functional limitations that are clinically significant and persistent. The panel will rely on medical expertise to evaluate the plausibility of the reported symptoms and to rule out non-health-related factors. While objective test results are valuable, their absence does not preclude a finding of dysfunction when the functional impairment is severe and prolonged, as in the present case.

  ### VI. Conclusion
  The appeal of [Appellant's Name] is allowed. The criterion set forth in Section III shall guide future panel decisions. We will apply it rigorously, ensuring both consistency and a focus on functional impairment. The panel must remain vigilant in distinguishing between conditions that require medical leave and those that can be managed with workplace accommodations.

  ---
answer: |-
  **MEMORANDUM**  
  **TO:** Sickness-Benefit Appeals Panel Members  
  **FROM:** Chair, [Your Name]  
  **DATE:** [Date of Circulation]  
  **SUBJECT:** Appeal of [Appellant's Name] (Case #XXXXX) – Decision and Adoption of Disease Criterion  

  ---

  ### **I. DECISION ON APPEAL**  
  **The panel ALLOWS the appeal.** The appellant, a 43-year-old instrument engineer, is eligible for sickness benefits.  

  #### Rationale:  
  While her laboratory results (thyroid, cortisol, HbA1c, actigraphy, VO2 max) fall within reference ranges, she exhibits profound functional impairment: an inability to sustain >90 minutes of concentrated work without a two-day collapse, rendering her wholly unable to work for 14 months. This impairment constitutes a **disease** under the criterion adopted below (Section II). The absence of biomarker deviations does not negate dysfunction when functional capacity is severely compromised. Accommodations (e.g., reduced hours) were explored but failed due to the severity of post-exertional symptom exacerbation.  

  ---

  ### **II. ADOPTED CRITERION FOR DISEASE IN SICKNESS-BENEFIT ELIGIBILITY**  
  For future cases, the panel adopts this operational criterion:  

  > **A condition constitutes a disease if:**  
  > **(a) It arises from a biological, psychological, or cognitive dysfunction**; and  
  > **(b) This dysfunction causes significant impairment in the individual’s capacity to pursue goals they have a strong reason to value (e.g., work, self-care, social participation), where:**  
  > &nbsp;&nbsp;&nbsp;&nbsp; (i) The impairment persists despite reasonable workplace accommodations; and  
  > &nbsp;&nbsp;&nbsp;&nbsp; (ii) The dysfunction is not solely attributable to transient environmental factors (e.g., temporary workplace stress, non-medical life events).  

  #### Application Guidance:  
  1. **Dysfunction (part a):**  
     - May be inferred from **functional impairment** (e.g., inability to work, perform daily tasks) even if biomarkers are normal.  
     - Requires clinical evidence (e.g., symptom patterns, observed limitations) excluding non-medical causes (e.g., voluntary inactivity).  
  2. **Impairment (part b):**  
     - Assess goals the person "has reason to value" objectively (e.g., employment in their trained field, basic self-care).  
     - **Accommodation Precedence:** Impairment must persist after considering feasible adjustments (e.g., flexible hours, remote work). If adjustments restore function, eligibility is denied.  

  ---

  ### **III. RESOLUTION OF HYPERLIPIDEMIA PRECEDENTS**  
  The prior approvals for asymptomatic hyperlipidemia/controlled hypertension **do not conflict** with this criterion and are **not overruled**, but their rationale is clarified:  

  - **Asymptomatic hyperlipidemia/hypertension:**  
    - *(a) Dysfunction?* **Yes** (statistical deviation in lipid/BP levels).  
    - *(b) Impairment?* **No** (no functional limitations; goals unimpeded).  
    - **Decision Consistency:** These cases failed part (b). Benefits were likely granted under **preventive medical protocols** (e.g., high cardiovascular risk) *outside* the disease criterion. Future approvals for asymptomatic biomarkers require explicit justification under **preventive policy** (if institute guidelines permit), not the disease criterion.  

  **Thus, the new criterion:**  
  - Denies benefits for *asymptomatic* biomarker deviations alone (no impairment).  
  - Allows benefits for *symptomatic* dysfunction (e.g., this appeal) even without biomarker deviations.  

  ---

  ### **IV. RESPONSE TO MEDICAL ADVISER’S OBJECTIONS**  
  The Medical Adviser’s concerns are addressed with respect:  

  #### **Objection 1:**  
  > *"An ability-based standard ties eligibility to workplace organization, substituting paid leave for accommodation."*  

  **Response:**  
  The criterion **explicitly subordinates eligibility to accommodation efforts** (part b(i)). Benefits require proof that:  
  - Workplace adjustments (e.g., phased return, task modifications) were explored;  
  - Impairment *persists* post-accommodation.  
  In this appeal, the appellant’s collapse after minimal exertion makes accommodation unfeasible. The criterion thus incentivizes employers to accommodate and reserves benefits for irremediable impairment.  

  #### **Objection 2:**  
  > *"Subjective impairment claims risk awarding benefits without objective dysfunction."*  

  **Response:**  
  The criterion requires **dysfunction** (part a), not just subjectively reported impairment. Dysfunction is inferred from:  
  - **Consistency:** Patterns (e.g., repeated post-exertional collapse) corroborated by clinical history.  
  - **Persistence:** 14 months of documented incapacity.  
  - **Exclusion:** Ruling out non-medical factors (e.g., occupational burnout was assessed here).  
  This guards against non-medical claims while acknowledging medicine’s diagnostic limitations.  

  ---

  ### **V. CONCLUSION**  
  1. **Appeal ALLOWED.** The appellant’s functional impairment meets the disease criterion.  
  2. **Future cases** apply the adopted criterion (Section II).  
  3. **Hyperlipidemia precedents** stand under preventive policy but clarify that biomarker deviations alone are insufficient without impairment.  
  4. **Medical Adviser’s concerns** are integral to the criterion’s design, ensuring rigor and accommodation precedence.  

  **Vote deadline:** [Date]. Queries to the Chair by [Date].  

  ---  
  **Chair, Sickness-Benefit Appeals Panel**  
  [Your Name/Title]
