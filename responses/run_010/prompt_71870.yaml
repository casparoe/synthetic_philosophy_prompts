  They need to resolve this debate through a 45-minute workshop designed around concrete cases rather than abstract arguments. They want a quiz with nine specific scenarios that help people reveal their underlying beliefs about mental content without directly asking about theories. The cases should include things like quarter-detecting devices in slug environments, tree rings, frogs responding to BB pellets, and other examples that probe different aspects of meaning and representation.

  The quiz needs to be structured with two or three options per case, avoiding any theoretical terminology. After the quiz, I should provide a scoring key that maps answer patterns to major positions like Searle's intrinsic intentionality, Dennett's instrumentalism, Dretske's indicator semantics, teleosemantics, radical enactivism, and eliminativism. I also need to analyze which answer combinations are unstable, which positions the quiz can't separate, and why certain theoretical corners might be empty.

  For the cases, I'll need to cover a range of phenomena that highlight different aspects of intentionality. For example: 
  - A quarter detector repurposed in a slug-rich environment tests whether function or original design determines meaning
  - Tree rings versus growth charts examines natural information vs. designed representation
  - Frog visual cells responding to BBs probes biological functions
  - Fossilized footprints as historical traces
  - Undeciphered scripts for linguistic meaning without interpreters
  - Spam filters as algorithmic intentionality
  - Phantom limbs as misrepresentations
  - Plus two additional cases like compasses near magnets and chess programs making "mistakes"

  The options should force choices about whether these things genuinely "mean" or "represent" something. For scoring, I'll need to identify patterns - for example, consistent "no representation" answers likely point to eliminativism, while accepting biological functions but not AI might indicate teleosemantics. I should note that positions like Dretske and teleosemantics might overlap in answers, while Searleans will insist on consciousness for true meaning. Empty corners might include views that accept all representations (too permissive) or reject all but linguistic ones (too restrictive).

  I'll make sure the quiz starts immediately with Case 1 as requested, with no preamble. The cases should be clear and concise, each presenting a concrete scenario with straightforward options that reveal underlying philosophical commitments. After the quiz, I'll provide a detailed scoring guide that helps the user map their colleagues' answers to the various theories of mental content, along with analysis of tensions between answers and limitations of the quiz design.
answer: |-
  Below is the 9-case quiz. Participants choose one option per case. **No preambles or explanations—start here:**

  ---

  **Case 1:** A vending machine sensor detects quarters. It’s moved to a wet environment where identical-sized slugs frequently slide into the slot. When a slug enters, the sensor activates the "dispense" mechanism.  
  (A) The sensor *means* "quarter here" when activated.  
  (B) The sensor *means* "object here" when activated.  
  (C) The sensor doesn’t *mean* anything; it’s just triggering mechanically.  

  **Case 2:** A tree’s rings show 10 thick bands. A scientist uses this to determine the tree was 10 years old when cut down.  
  (A) The rings *represent* "10 years of growth."  
  (B) The rings *carry information* about age but don’t *represent* it.  
  (C) The rings are just physical marks; age is an interpretation.  

  **Case 3:** A frog’s retinal cells fire when a small, dark, moving object (like a fly) passes. When a BB pellet is shot past, the same cells fire and the frog snaps its tongue.  
  (A) The cells *misrepresent* the BB as a fly.  
  (B) The cells *correctly detect* "small, dark, moving thing" (BB or fly).  
  (C) The cells don’t *represent*; they’re wired to trigger a reflex.  

  **Case 4:** A 120-million-year-old fossilized footprint shows three curved toes. Paleontologists say it *means* a theropod dinosaur walked here.  
  (A) The footprint *represents* dinosaur activity.  
  (B) The footprint is *evidence* of a dinosaur, but doesn’t *represent* it.  
  (C) It’s just a rock shape; "dinosaur" is our story.  

  **Case 5:** A stone tablet bears symbols of a lost language. No one alive understands it.  
  (A) The symbols *mean* something specific (e.g., "harvest yields"), even if undecoded.  
  (B) The symbols *were* meaningful but now lack meaning without users.  
  (C) They’re just etched patterns; meaning requires a current interpreter.  

  **Case 6:** Your email spam filter labels "Nigerian prince" emails as spam. It labels a valid client’s similar-sounding ("Nigerian textiles") email as spam too.  
  (A) The filter *misunderstands* the client’s email.  
  (B) The filter *correctly flags* "pattern-matched risk," but we wish it didn’t.  
  (C) It doesn’t *understand*; it’s applying statistical rules.  

  **Case 7:** After losing an arm, a patient *feels* pain "in their missing pinky."  
  (A) The brain *misrepresents* nerve activity as a phantom limb.  
  (B) The pain is real, but there’s no *representation* of a limb; it’s faulty signaling.  
  (C) "Misrepresentation" doesn’t apply; it’s an illusion without content.  

  **Case 8:** A compass needle points north. When held near a strong magnet, it points west instead.  
  (A) The needle *means* "magnetic north" but *misreads* when near the magnet.  
  (B) It *indicates* local magnetic fields, correctly or not.  
  (C) It’s just metal reacting to forces; no "meaning" involved.  

  **Case 9:** An AI chess program sacrifices a queen in a losing position. A grandmaster says this was a "mistake."  
  (A) The program *intended* to gain advantage but *misjudged* the board.  
  (B) The program *calculated* a move, but "mistake" is only from our view.  
  (C) Programs don’t "intend" or "misjudge"; they output moves.  

  ---

  ### Scoring Key & Analysis  
  Map answer patterns to theories:  

  1. **Searlean Intrinsic Intentionality** (Only conscious minds *really* mean):  
     - Requires: C in Cases 1,3,6,8,9; A only in Case 7 (conscious pain).  
     - Rejects AI/spam-filter meaning (6C,9C), non-conscious "representation" (1C,3C,8C).  

  2. **Dennett-Style Instrumentalism** (Intentionality is a useful stance):  
     - Pattern: A or B *only where pragmatic*. E.g., 1A (useful for repair), 3B (frog’s perspective), 6A (diagnosing bugs), 9A (predicting AI). But C in Case 2,4,5 (no stance needed).  
     - Consistent: Mix of A/B/C based on context. Avoids Cs for *all* artifacts.  

  3. **Dretskean Indicator Semantics** (Natural information + function):  
     - Pattern: B in Cases 1,2,3,8 (information carried by function/indication). C in 4,5 (no causal role).  
     - Key: 1B (indicates "object"), 2B (rings carry info), 3B (detection function).  

  4. **Teleosemantics** (Biological function determines content):  
     - Pattern: A in Case 3 ("fly" is proper function), B in Case 1 (evolution-free artifacts lack normativity). C in Cases 2,4,5 (no biological function).  
     - Must reject 6A (spam filter lacks evolution).  

  5. **Radical Enactivism/No-Content** (Basic "mind" is interaction, no representation):  
     - Pattern: C in Cases 1,3,6,8,9; B or C in 2,4,5; Only A/B if sensorimotor (e.g., 3B as "detection," not representation).  
     - Rejects all *internal* content (phantom limb: 7B/C).  

  6. **Eliminativism** (No mental content anywhere):  
     - Pattern: C in *all* cases. No exceptions.  

  ---

  ### Unstable Combinations & Quiz Limits  
  - **Unstable**: Choosing 3A (frog *misrepresents*) requires normativity. If paired with 1C/6C/9C (rejecting normativity for AI/artifacts), implies biological exceptionalism—but then 7A (phantom limb) must be A/B, not C. *Teleosemantics must resolve this*.  
  - **Indistinguishable Pairs**:  
    - Dretske vs. Teleosemantics: Both accept 3B, but Teleosemantics *requires* 3A for biological cases. Dretskeans can pick 3B.  
    - Instrumentalism vs. Searle: Both may pick 9C (no AI intent), but Instrumentalist picks A/B *when useful* (e.g., 6A).  
  - **Empty Corners**:  
    - **Consistent A’s Everywhere** (rings *represent*, footprint *represents*, etc.): Too permissive; no major theory holds this. Unattractive (trivializes representation).  
    - **A/B for Evolution-Free Systems Only** (e.g., 1A, 6A, 8A but C for frog/tree): Incoherent—denies biology-based meaning but grants it to artifacts.  
  - **Edge Case Tensions**: Case 5 (undeciphered script) splits theories: Searle (C), Instrumentalist (B), Teleosemantics (C), Dretske (C). Only Instrumentalists *might* say B ("past meaning").  

  ### Workshop Use  
  - Tally answers anonymously. Show distribution.  
  - Reveal scoring key; have participants self-identify clashes in their own answers (e.g., "You said 3A but 1C—does biology have special status?").  
  - Highlight: If you *ever* pick C, you must justify why some physical patterns (e.g., words, spam filters) escape it. If you *never* pick C, defend footprint "meaning".  
  - Ends debate-by-slogan: Positions emerge from concrete judgments.
