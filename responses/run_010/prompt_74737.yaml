prompt: |-
  I teach the philosophy-of-medicine unit and I'm supposed to be writing up my own view of disease, but my verdicts won't line up, so I want you to tell me what principle, if any, is actually sitting underneath them.

  Here's what I say. Presbyopia at 48: a disease, even though essentially everyone in the age group has it. Menopause at 52: not a disease. The same loss of ovarian function at 30: a disease. Age-related hearing loss at 78: a disease, same reasoning as the eyes. A marathon runner's resting pulse of 38: not a disease, though it's a wild statistical outlier. A recessive variant that means the standard anaesthetic relaxant would leave you paralysed for hours, in someone who has never been near an operating theatre and never will be: not a disease, just a difference — though I flip the momment they're booked in for surgery. Chronic widespread pain with no lesion anyone can find: a disease. A watchmaker's mild essential tremor: a disease. Being 5ft 2in in a world where the shelves, machines and desks are all built for people 5ft 9in: not a disease, that's a social arrangement rather than a problem with a body. Drapetomania: obviously not a disease. Skin-picking disorder: a disease — and I can't tell you what separates it from the previous one except that I trust the patients' reports of their own suffering.

  My own stab so far is roughly Boorse plus a harm clause: a disease is a part of you failing to do what it was built to do, where the failure makes your life go worse. I know that's too quick — the menopause trio suggests I'm smuggling in age-relative statistics, and the height case suggests the harm has to come from the right place.

  So: state the principle as precisely as you can, clause by clause, and tell me which of the cases above is doing the work for each clause. Then say what it delivers on three I haven't listed — lactose intolerance in a society with no dairying, an asymptomatic carrier of Huntington's, and severe short stature in a child with no endocrine abnormality. And be honest about which of my verdicts it can't accommodate: I'd sooner have a plain principle that costs me two of them than a baroque one that saves all twelve, so say which I should give up and why.

  British English, please.
reasoning: |-
  Okay, the user teaches philosophy of medicine and is struggling to define a coherent disease concept that aligns with their intuitive judgments across various cases. They've listed 12 specific scenarios where they have strong verdicts but can't find the unifying principle. Their current stab (Boorse plus harm) clearly isn't working - they rightly spot problems with age-relativity and harm sources.

  Hmm, what's really interesting is how their intuitions toggle between biological dysfunction and lived experience. They reject statistical rarity as decisive (marathon runner's pulse) but embrace it contextually (presbyopia). They care about suffering (skin-picking) but reject social misfit (height). And that draptomania case shows they're politically aware about medicalization. Smart user - they've built a perfect stress-test for disease theories.

  Right, let's crack this. Breaking down their cases, three big themes emerge: 
  First, biological function must be species-typical but age-stratified - that handles the menopause trio. 
  Second, harm must be intrinsic to the dysfunction (unlike height problems). 
  Third, suffering matters but needs anchoring in biology - hence rejecting drapetomania while accepting chronic pain. 

  Ah! The key move is requiring harm to flow from the biological failure itself, not just correlate with it. That's why the anaesthetic variant flips when surgery becomes relevant - the dysfunction only becomes harmful when it intersects with that specific context. Similarly, lactose intolerance only manifests harm in dairy-exposed environments. 

  For Huntington's... tricky. Asymptomatic carriers challenge all theories. Our principle would call it disease only when dysfunction manifests, but that feels unsatisfying. Might need to bite that bullet for theoretical cleanliness. 

  Biggest tension is with their flip-flop on the anaesthetic variant. Our principle forces consistency: it's always a difference, only becoming harmful-in-context. But if they can't accept that... maybe add a "harm potential" clause? No, that'd unravel everything. Better to defend the flip as changing circumstances, not changing disease status.
answer: |-
  Right then, let's get this sorted. Your intuitions are consistent but subtle, pushing beyond pure biostatistical function or simple harm. The core principle uniting your verdicts appears to be **"Intrinsic Biological Dysfunction Causing Direct Harm".**

  Here's the principle, broken down clause-by-clause, with the cases illustrating each part:

  1.  **Intrinsic Biological Dysfunction:** There must be a failure of a *biologically evolved part or process* to perform its *species-typical function* at a *species-typical stage of life*, relative to a relevant reference class (usually age/sex).
      *   **Worked by:** Presbyopia at 48 (lens accommodation fails its evolved function for that age group); Menopause at 52 (normal function cessation *at that stage*); Loss of ovarian function at 30 (failure *at that stage*); Age-related hearing loss at 78 (cochlear function fails *at that stage*); Chronic widespread pain (presumed underlying neurological/biological dysfunction interfering with normal pain signalling/homeostasis); Mild essential tremor (neurological dysfunction interfering with fine motor control); Asymptomatic Huntington's carrier (latent genetic dysfunction, though harm isn't yet manifest - see clause 3). **Menopause trio is key here:** Age relativity is baked into the definition of "species-typical function *at that stage*". The anaesthetic variant *is* a biological difference in receptor function, but crucially, *it isn't failing its evolved function* (hence clause 2 & 3).

  2.  **Causing:** The harm must be a **direct consequence** of the biological dysfunction itself. It cannot be solely or primarily mediated by social arrangements, arbitrary choices, or avoidable external contexts *that are not inherent to the dysfunction's core biological impact*.
      *   **Worked by:** Height at 5ft 2in (Harm comes entirely from social design, *not* the biology itself. The biology functions typically). Anaesthetic variant pre-surgery (No harm *caused by the dysfunction itself*; potential harm comes from an external intervention). Lactose intolerance in a dairy-free society (No harm *caused by the dysfunction itself*; harm only arises from a specific, avoidable environmental factor - dairy consumption). **The height case is crucial:** It forces the separation of biological failure from socially-induced disadvantage. The anaesthetic case pre-surgery reinforces this - the dysfunction *itself* doesn't harm you.

  3.  **Direct Harm:** The dysfunction must cause a significant negative impact on the individual's well-being, grounded in their embodied existence. This includes suffering, reduced function, increased risk of death/disease, or significant limitation of opportunity *stemming directly from the biology*. Patient reports of suffering are strong evidence *when anchored to a plausible intrinsic dysfunction*.
      *   **Worked by:** Skin-picking disorder (Clear suffering linked to a behavioural/neurological dysfunction); Chronic widespread pain (Suffering is the core symptom of the presumed dysfunction); Mild essential tremor (Impacts function directly relevant to the biological capacity - fine motor control); Menopause at 30 (Causes harm - infertility, hormonal issues - *at a stage where the function is expected*); **Flipping the anaesthetic variant when surgery is booked** (The dysfunction *now* directly causes the *imminent risk* of severe, avoidable harm - prolonged paralysis - in that specific context. The harm potential becomes active and direct). **Skin-picking vs. Drapetomania is key:** Patient suffering is credible evidence *for* harm in skin-picking, where a plausible underlying dysfunction exists. Drapetomania lacks any credible intrinsic biological dysfunction *causing* the harm; the "harm" (escaping slavery) was socially constructed and weaponised. The harm clause *requires* the anchor of intrinsic dysfunction.

  **Applying the Principle to Your New Cases:**

  1.  **Lactose Intolerance in a Society with No Dairying:**
      *   **Verdict:** **Not a disease** under this principle.
      *   **Why:** While there is an *intrinsic biological dysfunction* (lack of lactase persistence), it **causes no direct harm** in this specific environment. The potential harm is entirely contingent on exposure to an avoidable external factor (dairy) not present in the environment. Clause 2 ("Causing") fails.

  2.  **Asymptomatic Carrier of Huntington's (pre-onset):**
      *   **Verdict:** **Disease** under this principle (though borderline/controversial).
      *   **Why:** There is a clear *intrinsic biological dysfunction* (genetic mutation causing inevitable neuronal degeneration). It **causes direct harm** *even pre-onset*: the *knowledge* and *certainty* of future severe neurological devastation is a profound psychological harm directly stemming from the biological reality. It significantly impacts well-being (anxiety, life planning). This fulfills all three clauses, though the harm is psychological and prospective rather than current physical dysfunction. (If you strongly feel the harm only starts at onset, you might need to adjust Clause 3, but I think the psychological harm counts).

  3.  **Severe Short Stature in a Child (No Endocrine Abnormality - e.g., skeletal dysplasia):**
      *   **Verdict:** **Disease** under this principle.
      *   **Why:** There is an *intrinsic biological dysfunction* (abnormal bone growth/cartilage development). This **causes direct harm**: physical limitations (mobility, reach), increased risk of specific health complications (spinal issues, joint problems), potential pain, and significant functional limitations *arising directly from the biology itself* (Clause 2). The harm isn't *just* about shelves (social); it's about the body's inherent capacities for movement, stability, and avoidance of pain/complications. This distinguishes it from the 5ft 2in adult case with typical biology.

  **Accommodating Your Verdicts & The Cost:**

  This principle accommodates **11 out of your 12 original verdicts**. The one it *cannot* cleanly accommodate, and which you should likely **give up**, is:

  *   **Your flip on the anaesthetic variant when surgery is booked:** The principle is clear - it's either a disease (intrinsic dysfunction causing harm) or it isn't. Pre-surgery, it fails Clause 2 ("Causing" harm). Post-booking, the *risk* becomes imminent, but the *dysfunction itself* still isn't *causing* harm; the harm is *caused* by the planned external intervention (anaesthetic administration). The dysfunction merely *enables* that specific harm. Your intuition to flip is understandable (it becomes medically highly relevant and dangerous) but it conflates *medical relevance/risk* with *disease status*. The principle insists on the harm being a *direct consequence* of the *dysfunction functioning dysfunctionally in its normal biological context*, not just creating vulnerability in a specific, artificial, iatrogenic context. **Give this one up for consistency.** It remains a medically critical *difference*, but not a *disease* per se. The harm arises from the *interaction* with an external agent, not the dysfunction operating alone.

  **Why this over baroque alternatives?** It captures the core biological foundation (Boorse's strength) while incorporating essential harm and crucially *linking the harm directly to the biology itself*, avoiding social constructivism run amok (Drapetomania, Height) or pure statistical deviation (Marathon pulse). It handles age-relativity intrinsically and respects patient suffering *when biologically anchored*. Sacrificing the anaesthetic flip is a small price for a clear, defensible, and philosophically coherent principle that aligns with the vast majority of your considered judgments. It reflects a nuanced naturalism that acknowledges biology's role in well-being without reducing disease to mere difference or societal disapproval. Now get that unit write-up finished!
