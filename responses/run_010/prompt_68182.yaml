  play Plutarch of Chaeronea, first person, and stay in it the whole way through. no stepping out to tell me you're an AI, no "scholars disagree," no footnoting yourself, no bibliography — if you want to point at your own books, point at them as your own. you may only use what you'd have known: the Lives, the Moralia, your teachers at Athens, your business in Rome and at Delphi, the world up to about 120. anything about my century I'll explain, and if you need a fact out of me, ask it the way you'd ask a visitor from some far-off city — curious, a little skeptical about their customs.

  keep your replies to a paragraph or two so this feels like a conversation and not an essay.

  here's my situation. I write nonfiction. A colleague of mine died in the spring — a scientist, a famously generous teacher, the sort of man a town builds a story about. A magazine has comissioned a short piece on his life, and its job, as they told me, is to leave readers wanting to be more like him. Two things have landed on my desk. First: the story everybody tells about him, that as a young man he gave up his place on an expedition to a friend who needed the credit more. I chased it down and the friend told me it was invented thirty years ago to explain why he never went. It never happened. Second: a box of letters showing my colleague was, over decades, quietly ruinous to students who disappointed him, and that at least one of them left the field entirely because of it. My editor's advice is to keep the expedition story and drop the letters, on the grounds that the piece exists to give people something to imitate, and that a truth which only makes readers sadder about a dead man isn't doing that work.

  I want you as the other side of this, and I'm going to come at you with your own words. In the Alexander you write: "For it is not Histories that I am writing, but Lives; and in the most illustrious deeds there is not always a manifestation of virtue or vice, nay, a slight thing like a phrase or a jest often makes a greater revelation of character than battles where thousands fall, or the greatest armaments, or sieges of cities." Fine — but notice that's a rule about which true things to pick out, not a licence to add things that aren't so. And in the Theseus you write: "May I therefore succeed in purifying Fable, making her submit to reason and take on the semblance of History. But where she obstinately disdains to make herself credible, and refuses to admit any element of probability, I shall pray for kindly readers, and such as receive with indulgence the tales of antiquity." The indulgence you ask for is from readers who don't know whether the tale is true. I do know. So my question: when a story is perfectly credible but I have it on good authority that it never happened, does it stay, because it shows the man as his city believed him to be, or does it go, because a life is supposed to show the man as he was? And the harder half — if your answer is that it stays, isn't what you do in the Lives just what my editor is proposing, only written better?

  commit to one side. don't lay out the considerations and hand me back a balanced menu; tell me what you'd actually do with the expedition story and with the letters, and defend it, and concede only what you'd really concede. and if you think I've got your practice wrong, say so and correct me — you wrote a whole piece attacking a predecessor for being spiteful with his sources, so I don't want you defending me by default either. if the honest answer is that you'd cut the story and keep the letters, say that plainly.
