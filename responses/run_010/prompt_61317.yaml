prompt: |-
  Six weeks ago I was appointed to a seven-person review panel at a mid-sized research funder, and at our second meeting we produced a result that has left me uneasy enough that I have now been asked to write a short memo to the panel and our program officer explaining what happened and what our options were. Before I write it, I want to understand the underlying conceptual issue properly, and I would be grateful for a careful explanation rather than a survey of positions.

  Here is the case. One proposal before us was governed by a funding rule with a conjunctive structure: a proposal is eligible only if it is both excellent on scientific merit and feasible within the requested budget and timeline. Voting member by member, four of us judged it excellent on merit and a partly different four judged it feasible; but only two of us judged both. So when the chair put the question of eligibility directly, five voted against and two in favour. The chair ruled that the vote on eligibility governs, since our regulations define the panel's decision as a recommendation on funding. Several members objected that the panel had just found a proposal excellent and feasible and then denied that it was eligible, and that this was straightforwardly incoherent.

  What I would like explained:

  1. What has to be true for a divergence of this kind to arise at all? I gather it is not an artifact of our particular votes, and that there are general results about when a body's judgments can be aggregated without this happening. I would like to know what those results assume, which assumption is doing the most work, and which one looks weakest or most worth giving up in an institutional setting like mine.

  2. A colleague insists this is simply the voting paradox he met as an undergraduate — majority cycles — and that our panel had intransitive preferences. I do not think he is right, because as far as I can tell nothing cycled: each of the three questions received a decisive majority, and our ranking of the shortlisted proposals was transitive. Please explain what actually distinguishes the two phenomena, whether the distinction is deep or merely a difference in vocabulary, and what the difference implies about how each one should be handled. He also says that once you see it as a cycle the remedy is obvious — change the order in which the votes are taken — and I would like to know whether that advice transfers to our case.

  3. Our panel additionally ranked the shortlisted proposals by a weighted score: each member assigns points on three criteria, and the points are summed. Another member argues that the same choice arises here — you can either sum each member's points and then compare totals, or take a majority on each criterion first and then sum the majority scores, and the two routes can select different winners. Is that correct? If so, is it the same paradox, given that a weighted sum involves no logical connection between the criteria and the total, or is it a structurally different failure with a different lesson?

  4. Two members recused themselves from judging feasibility on this proposal, because of a prior collaboration with the applicant, but not from judging merit. The merit majority was therefore computed over seven of us and the feasibility majority over five. Does the framework make sense at all when the premises are decided by different constituencies, and what does that do to the analysis in (1)?

  5. Finally, part of the objection at our meeting was not procedural but about whether the panel is the sort of thing that can hold a view. I would like to understand what turns on that: does treating a committee as an agent with judgments of its own change what it ought to do, or is it only a manner of speaking?

  Two further requests. I have seen the terms doctrinal paradox and discursive dilemma used both interchangeably and as marking a real distinction; please tell me which, and whether the distinction matters for a case like ours. And I am not after references or a reading list — I cannot chase papers down at the moment — so please give me the reasoning rather than the sources.

  Above all, I need you to be scrupulous about separating what is settled from what is genuinely disputed. Some of what I have read presents the premise-based procedure as the correct response to divergences like ours, and I suspect that this is a contested normative claim rather than a theorem. Please distinguish clearly among mathematical results whose conditions people agree on, normative proposals that remain live questions among those who work on the topic, and matters of mere institutional taste; and where you are inclined toward a view that is not the majority position, say so explicitly instead of writing as though it were the consensus.
reasoning: |-
  Hmm, the user is part of a seven-person review panel at a research funder dealing with a complex voting paradox. They need a clear explanation of what happened when their panel evaluated a proposal requiring both scientific excellence and feasibility. The voting showed four found it excellent, four found it feasible (with partial overlap), but only two supported both conditions. When voting on eligibility directly, five rejected it. This created apparent inconsistency where the panel "found" the proposal excellent and feasible yet declared it ineligible.

  The user has five specific questions about this situation. First, they want to understand the necessary conditions for such divergences to occur - what makes these voting paradoxes possible. Second, they question whether this is just the classic voting paradox (Condorcet paradox) or something distinct. Third, they ask about implications for their weighted scoring system. Fourth, they need clarification on how recusals (two members abstaining from feasibility judgment) affect the analysis. Fifth, they inquire about the philosophical question of whether committees can truly "hold views" or if this is just metaphorical language.

  Additionally, they want clarification on terminology (doctrinal paradox vs. discursive dilemma) and clear demarcation between established mathematical facts, normative debates, and institutional preferences in this domain.

  This requires careful unpacking. The core phenomenon is the doctrinal paradox (or discursive dilemma), which occurs when aggregating logical connections produces inconsistencies. Key conditions are: (1) the decision has logical structure (here, eligibility requires A AND B), (2) members vote independently on premises and conclusion, (3) no unanimous agreement exists on premises.

  The distinction from majority cycles is important. Majority cycles involve intransitive preferences (A>B, B>C, C>A), while here the inconsistency is between aggregated premises and aggregated conclusion despite each vote being decisive. Changing vote order cannot resolve doctrinal paradoxes because the core issue is judgment aggregation, not temporal sequencing.

  For weighted scores, the problem reappears but differently. Summing individual total scores versus aggregating first by criterion can yield different winners. This isn't strictly the same paradox since there's no logical connection between criteria, but it's a similar aggregation pathology.

  Recusals complicate things significantly. With different voter sets per premise, the panel's composite judgment lacks coherent epistemic grounding since the "panel" deciding merit isn't identical to that deciding feasibility. This undermines premise-based approaches.

  Regarding committee agency: treating panels as collective agents is primarily metaphorical for aggregation purposes. But this metaphor becomes problematic when inconsistent judgments emerge, forcing either acceptance of inconsistency or procedural rules to prevent it.

  Terminology-wise, "doctrinal paradox" and "discursive dilemma" are largely synonymous in this context. The key mathematical result is that such inconsistencies can occur whenever premises aren't unanimously agreed upon. The normative debate centers on whether to prioritize premise-based or conclusion-based approaches, with no consensus - this depends heavily on institutional values about coherence versus direct mandate.
answer: |-
  Your case is a textbook instance of the **doctrinal paradox** (also known as the **discursive dilemma**). The terms are largely interchangeable in practice, though some scholars reserve "discursive dilemma" for cases involving sequential deliberation. For your purposes, the distinction is negligible. Below, I address your questions with scrupulous separation of mathematical certainty, normative debate, and institutional discretion.

  ---

  ### 1. **Conditions for Divergence and Core Assumptions**  
  The paradox arises when three conditions hold:  
  - **Logical structure**: The decision requires aggregating judgments on logically connected premises (here, "excellent" AND "feasible" → "eligible").  
  - **Independent voting**: Members vote separately on premises and conclusion.  
  - **Non-unanimity**: No unanimous agreement exists on all premises.  

  **Key mathematical result**: If the group votes directly on the conclusion ("eligible"), it may reach the opposite verdict from applying the logical rule to majority votes on the premises. This is **inevitable** when:  
  - Premise majorities are achieved (here, 4/7 for merit, 4/5 for feasibility),  
  - But the intersection supporting both premises is a minority (here, 2/7).  

  **Critical assumptions**:  
  - **Most consequential**: *Individual rationality* (members correctly apply the rule "A ∧ B → C" to their own judgments).  
  - **Weakest in practice**: *Independence of premises*. If merit and feasibility judgments are correlated across members (e.g., those who find it excellent also find it feasible), the paradox is less likely. In your case, partial overlap (only 2 support both) triggered it.  

  **Institutional implication**: To avoid the paradox entirely, you must abandon one of:  
  - The conjunctive rule (politically difficult),  
  - Independent voting on premises (procedurally rigid),  
  - Or majority voting (epistemically costly).  

  ---

  ### 2. **Distinction from Majority Cycles (Condorcet Paradox)**  
  Your colleague is mistaken. The phenomena are structurally distinct:  
  - **Majority cycles** arise from *intransitive preferences* (e.g., A>B, B>C, C>A by majority).  
  - **Doctrinal paradox** arises from *aggregating judgments on logically connected propositions*.  

  **Crucial differences**:  
  | **Aspect**               | **Majority Cycle**          | **Doctrinal Paradox**         |  
  |--------------------------|-----------------------------|-------------------------------|  
  | **Nature**               | Preference aggregation      | Judgment aggregation          |  
  | **Requires**             | ≥3 options                  | ≥2 logically linked premises  |  
  | **Inconsistency**        | Intransitive rankings       | Premises vs. conclusion clash |  
  | **Your case**            | Absent (transitive rankings)| Present                       |  

  **Order of voting**: Changing vote order *cannot resolve* the doctrinal paradox. In your case:  
  - Voting on "eligibility" first yielded 2 YES, 5 NO.  
  - Applying the rule to majority premises (excellent + feasible) suggests YES.  
  No sequence reconciles this. The flaw is in aggregation, not temporal order.  

  ---

  ### 3. **Weighted Scores and Aggregation Paths**  
  Your member is correct. Two methods can conflict:  
  - **Method 1 (Sum-then-rank)**: Sum all members' scores for each proposal, then rank by total.  
  - **Method 2 (Rank-then-sum)**: Take majority judgment per criterion (e.g., "excellent: YES/NO"), assign points to majority views, sum across criteria.  

  **Example**: Suppose two proposals, three criteria (A,B,C), scores 0–10.  
  - **Member 1**: P1=(A:10, B:0, C:0) → Total=10  
    P2=(A:0, B:10, C:10) → Total=20  
  - **Member 2**: P1=(A:0, B:10, C:10) → Total=20  
    P2=(A:10, B:0, C:0) → Total=10  
  - **Sum-then-rank**: P1=30, P2=30 → Tie.  
  - **Rank-then-sum**: Majority says P1 wins A (10>0), P2 wins B (10>0) and C (10>0). Assign points: P1=10, P2=20 → P2 wins.  

  **Is this the same paradox?** No. Here, criteria lack logical dependencies (unlike "A ∧ B → C"). The conflict arises from **nonlinear aggregation**, not logical inconsistency. The lesson: **weighted scores are not immune to path dependence**, but the mechanism differs from the doctrinal paradox.  

  ---

  ### 4. **Recusals and Different Constituencies**  
  Recusals compound the problem:  
  - Merit judged by 7 voters (majority: 4/7).  
  - Feasibility judged by 5 voters (majority: 4/5).  
  - Only 2 judged both and supported both.  

  **Analysis**:  
  - **Premise-based approach** (apply rule to majority premises) is now ambiguous: Which "panel" decided feasibility? The 5-member subgroup?  
  - **Conclusion-based approach** (direct vote on eligibility) included all 7, but only 5 were fully informed.  

  **Institutional reality**: This violates the paradox's core assumption—that the *same group* judges all premises. The "panel" is not a coherent epistemic agent here. **Remedy**: Either:  
  - Exclude recused members from *all* votes on the proposal (simplifies aggregation),  
  - Or acknowledge that the eligibility verdict lacks logical grounding.  

  ---

  ### 5. **Can Committees "Hold Views"?**  
  This is a normative/philosophical question with practical implications:  
  - **Literal view**: Committees lack minds; only individuals hold beliefs. Aggregation rules are mere procedures.  
  - **Agency view**: Committees act as collective agents, so consistency in their "judgments" matters.  

  **What turns on this**:  
  - If the committee is a *rational agent*, it should avoid contradictory beliefs (e.g., "A is true, B is true, but A∧B is false"). This favors **premise-based voting** to enforce logical coherence.  
  - If the committee is a *delegate body*, its mandate is to express majority will. This favors **conclusion-based voting**.  

  In your case, objectors implicitly adopted the agency view, demanding logical consistency.  

  ---

  ### Separating Settled, Disputed, and Institutional Matters  
  | **Aspect**                     | **Status**                                                                 |  
  |--------------------------------|----------------------------------------------------------------------------|  
  | **Mathematical certainty**     | The paradox occurs under specified conditions (non-unanimity + logical structure). |  
  | **Normative disputes**         | - **Premise-based vs. conclusion-based**: No consensus. Philosophers/epistemologists favor premises; democrats/pragmatists favor conclusions. |  
  |                                | - **Committee agency**: Unresolved. Affects choice between coherence and mandate. |  
  | **Institutional discretion**   | - How to handle recusals. <br> - Whether to enforce logical consistency. <br> - Vote aggregation method (premises-first, conclusion-first, or scores). |  

  **My view (minority)**: Premise-based approaches are epistemically superior but may override majority will. For research funding, epistemic rigor should prevail—your role is truth-tracking, not plebiscite.  

  ### Recommendations for Your Memo  
  1. **Acknowledge the paradox**: Explain why the divergence occurred (non-overlapping majorities).  
  2. **Clarify recusal impact**: Different voter sets invalidate simple aggregation.  
  3. **Options**:  
     - **Premise-based**: Eligible if majority affirm merit AND feasibility (here: YES).  
     - **Conclusion-based**: Eligibility determined by direct vote (here: NO).  
     - **Hybrid**: Vote eligibility only among members who judged both premises (here: 2 YES, ? NO).  
  4. **Rule change proposal**: Require identical voter sets for all judgments on a proposal, or exclude recused members entirely.  

  This balances mathematical clarity with institutional pragmatism. The choice between premise/outcome-based voting hinges on your funder’s mission: seeking "correct" decisions or reflecting collective sentiment.
