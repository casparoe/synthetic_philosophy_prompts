  Good's theorem states that, under the standard assumptions of decision theory, information has non-negative value. That is, having more information (without cost) cannot make you worse off. However, there are situations where this might break, such as when:
  1. The act of acquiring information is costly (but we are assuming free signal).
  2. The information leads to a change in the decision maker's action that actually leads to a worse outcome because of the way the world is structured (e.g., in a game-theoretic setting with multiple agents).
  3. The decision maker has constraints on their ability to act optimally on the information (like being forced to follow a rule).
  4. The utility function itself depends on the information state (e.g., a surprise gift being more valuable).

  We are going to design three rounds:

  Round 1: Basic setup where looking at the signal is beneficial (weakly better) so that the students experience the positive value of information.

  Round 2: Introduce a constraint: some players are forced to follow a fixed rule after looking. We want that for these players, having looked and then being forced to act against the signal's suggestion leads to a worse outcome than if they had remained ignorant and taken the default action. This breaks the assumption that the decision maker can freely choose the optimal action given the information.

  Round 3: The payoff depends on whether the player looked. We want a situation where the act of looking reduces the payoff (e.g., a surprise gift that is only valuable if you didn't know about it). This breaks the assumption that the utility is state-dependent only and not information-dependent.

