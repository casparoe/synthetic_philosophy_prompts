prompt: |-
  I'm the returning secretary of a mid-sized academic society — about 1,400 members — and we run three elections a year (president-elect, a slate of council seats, and two best-paper prizes) plus occasional member referenda on bylaw changes. Everything is plurality or, for the prizes, a hand-rolled ranked thing nobody has ever audited. Every year or two some member emails saying the process is gameable, and there right: people float near-identical nominees to split a rival bloc, committees propose three options knowing one is a decoy, someone occasionally threatens to just not vote if their favorite makes the ballot. I've read enough to know the Gibbard–Satterthwaite theorem says I can't fix this in general, which is not a usable answer for me — I still have to pick rules, defend them at the annual meeting, and answer specific accusations after the fact.

  So: write me a working procedure, the kind I could hand to a three-person elections subcommittee with no social choice background, for two things — (a) evaluating a proposed voting rule for a given election before we adopt it, and (b) triaging a complaint after the fact that the outcome was manipulated. I want it grounded honestly in what the theorem and its escape hatches actually license (restricted domains, cardinal or scoring rules, randomization, controlling the option set, giving up determinism, accepting a tie-breaker that is basically a small dictator), but the deliverable is the procedure, not a lecture. Ordered questions, what counts as a sufficient answer to each, which question terminates in "no, don't use that rule," and where the answer turns on values or on facts about our members that a subcommittee can't derive from the armchair and has to go ask somebody.

  Constraints, since they change what's usable: no budget for a mechanism designer; ballots are run by a volunteer on a platform that can't do anything fancier than ranked or scored; results have to be certified within a week; and anything we adopt has to survive a plain-English explanation at a member meeting without someone saying "so you're admitting the chair decides."

  Then run the procedure on three real cases, with the steps actually filled in rather than waved at:

  1. The president-elect race, where a well-organized bloc is expected to nominate two near-identical candidates to crowd out a third.
  2. A best-paper prize with four finalists and a committee of nine that both nominates and votes.
  3. A bylaw referendum where the council sets the wording of the options and one of the three is widely regarded as a decoy put there to make another look moderate.

  One of these should come out badly for me. I'd much rather the procedure tell me to abandon a rule I like than quietly invent a way to keep it — so if a case forces something ugly, say so plainly and say what we lose by accepting it.

  Sections, in this order, with roughly these lengths:

  - **What the theorem does and doesn't buy you** — ~200 words, enough that the subcommittee understands why the later steps exist and doesn't think this is all procedural fuss.
  - **Pre-adoption procedure** — numbered steps, ~600 words.
  - **Complaint-triage procedure** — ~400 words.
  - **The three cases** — ~250 words each.
  - **Where the procedure breaks** — ~200 words: the questions it can't settle, the ways it will misfire in practice, the cases where it gives confident-sounding answers it hasn't earned.

  Close with a short note on how confident you actually are in what you've claimed — particularly any assertion about what a given rule can or can't be made to do — and single out the one step or claim you're least sure about and why.
reasoning: |-
  We are given a complex problem about designing a voting procedures for an academic society, with specific constraints and cases. The user is the returning secretary and needs a practical procedure for evaluating voting rules and handling complaints, grounded in the limitations imposed by the Gibbard-Satterthwaite theorem (which states that for three or more options, no voting system can be both strategy-proof and deterministic while also satisfying Pareto efficiency and having a full range of possible outcomes).

  The response must be structured as follows:
  1. **What the theorem does and doesn't buy you** (~200 words): Explain the theorem in a way that sets up the need for the procedures without being too technical.
  2. **Pre-adoption procedure** (numbered steps, ~600 words): A step-by-step guide for the elections subcommittee to evaluate a proposed voting rule before adoption.
  3. **Complaint-triage procedure** (~400 words): Steps for handling a complaint after an election.
  4. **The three cases** (~250 words each): Apply the procedure to the three real cases provided (president-elect, best-paper prize, bylaw referendum). One of these should come out badly.
  5. **Where the procedure breaks** (~200 words): Limitations of the procedure.
  6. **Closing note**: Confidence level and the least sure step.

  Constraints:
  - No budget for a mechanism designer.
  - Voting platform can only handle ranked or scored ballots.
  - Results must be certified within a week.
  - Must be explainable in plain English without appearing to give the chair dictatorial power.

  We must be honest about the limitations and, in one case, show that the rule is problematic.

  Let's break down the sections:

  ### 1. What the theorem does and doesn't buy you
  The Gibbard–Satterthwaite theorem (GS) states that for any voting system with three or more options, if we require:
  - Every possible preference ordering is allowed (unrestricted domain),
  - The system is deterministic and always produces a winner (resoluteness),
  - The system is non-dictatorial (no single voter always decides),
  - And if a candidate is ranked first by every voter, they win (Pareto efficiency),
  then it is impossible to design a system that is strategy-proof (meaning voters can never benefit by misrepresenting their preferences).

  What this means for you:
  - We cannot have a perfect system that prevents all strategic voting.
  - However, we can mitigate the problem by:
    - Restricting the domain (e.g., allowing only single-peaked preferences, which might be plausible in some settings),
    - Using non-deterministic methods (e.g., random tie-breaking, which is common and accepted in many elections),
    - Using cardinal voting (like score voting) which is not covered by GS (but note that cardinal systems have their own strategic issues),
    - Accepting a system that is not strategy-proof but has good properties in practice.

  In short, GS tells us we must make trade-offs. Our goal is not to achieve the impossible but to choose a rule that is robust and acceptable for our specific context.

  ### 2. Pre-adoption procedure for a proposed voting rule
  We design a step-by-step procedure for the subcommittee. The steps should be ordered and include what counts as a sufficient answer and when to reject the rule.

  **Step 1: Define the election context.**
     - What is being decided? (e.g., single winner, multiple winners, referendum)
     - How many candidates/options? (if more than 2, then GS applies)
     - Are there known blocs or factions? (if so, we must consider strategic behavior)
     - How many voters? (if small, then strategic voting is more feasible and impactful)
     - Are the voters' preferences likely to be structured? (e.g., single-peaked on a left-right spectrum? If so, we can use a rule that exploits that.)

     **Sufficient answer**: A clear description of the election, including the number of options and any known social structure. If the number of options is 1, then no election is needed. If 2, then majority vote is strategy-proof. If 3 or more, then we must proceed.

     **Termination condition**: If the election has only two options, then use majority rule and stop. Otherwise, proceed.

  **Step 2: Check if the rule is for a restricted domain.**
     - Ask: Is there a natural ordering of the candidates that might lead to single-peaked preferences? (e.g., political spectrum, or in our society: theoretical vs. applied, or in a paper prize: technical depth vs. breadth). If yes, then rules like Borda or Condorcet methods might be less manipulable.
     - If the domain is restricted (e.g., single-peaked), then we can use a rule that is strategy-proof for that domain (like the median voter theorem for single-peaked preferences).

     **Sufficient answer**: If the subcommittee can establish that preferences are likely to be single-peaked (by asking a sample of members or based on past elections), then they can use a rule that is known to be strategy-proof for that domain (e.g., Black's method). Otherwise, they must assume an unrestricted domain and proceed to Step 3.

     **Termination condition**: If the domain is restricted and the rule is known to work for that domain, then the rule is acceptable. Otherwise, proceed.

  **Step 3: Accept non-determinism or cardinal voting?**
     - Non-determinism: Are we willing to have a random element? (e.g., random tie-breaking). If so, then we can use a rule that is strategy-proof in expectation (like random dictatorship: pick one voter at random and use their top choice). This is strategy-proof but may not be acceptable for important elections.
     - Cardinal voting: Are we using a scoring rule (like range voting)? GS does not apply to cardinal systems, but they are still vulnerable to other strategic behaviors (like min-maxing). However, they may be more robust in practice.

     **Sufficient answer**: The subcommittee must decide (by consulting the council or the society) if randomness is acceptable. If yes, then a random tie-breaking rule (already common) or a more comprehensive random method (like random dictatorship) can be used. If cardinal voting is acceptable, then they can consider score voting (with a clear scale).

     **Termination condition**: If the society accepts a non-deterministic rule (with a clear, fair random element) or a cardinal rule, and the proposed rule falls into one of these categories, then it is acceptable. Otherwise, proceed.

  **Step 4: Evaluate the rule for known vulnerabilities.**
     - For the proposed rule, ask: Is it known to be particularly vulnerable to vote splitting, cloning, or decoy candidates? (e.g., plurality is vulnerable to vote splitting; Condorcet methods can be vulnerable to cloning, but less so than plurality).
     - Use a simple test: Suppose there are three candidates: A, B, C. If a bloc prefers A and B (with A slightly better than B) and they fear that C will win, can they gain by not nominating B? Or by ranking B above A? Or by not voting? If the rule incentivizes such behavior, then it is vulnerable.

     **Sufficient answer**: The subcommittee must conduct a vulnerability analysis by considering at least three scenarios:
        a) A strong third candidate splits the vote of a majority faction (like in the president-elect case).
        b) A decoy candidate is introduced to manipulate the outcome (like in the bylaw referendum).
        c) A voter or bloc threatens to abstain if their favorite is not nominated.

     If the proposed rule is vulnerable in these scenarios and the vulnerability is severe (i.e., it changes the outcome in a way that seems unfair) and the society is not willing to accept that risk, then reject the rule.

     **Termination condition**: If the rule is found to be too vulnerable (and no mitigation is possible), then reject it. Otherwise, the rule is conditionally acceptable.

  **Step 5: Plain-English explanation and acceptance.**
     - Draft a plain-English explanation of the rule and how it addresses the vulnerabilities. Present it to a sample of members (or the council) and ask: "Does this explanation make sense? Does it seem fair? Are you concerned that the chair has too much power or that the rule is too complex?"
     - If the explanation is accepted and no major concerns are raised, then the rule is acceptable.

     **Termination condition**: If the explanation is rejected by the members as unclear or unfair, then reject the rule. Otherwise, adopt it.

  ### 3. Complaint-triage procedure
  After an election, when a complaint is received:

  1. **Classify the complaint**: Is it about the outcome being manipulated (e.g., vote splitting, decoy candidate, strategic voting) or about the process (e.g., ballot access, counting error)?

  2. **If about manipulation**:
     - Step A: Check if the vulnerability was known in the pre-adoption procedure. If yes, and the society accepted the risk, then the complaint is noted but the outcome stands (with an explanation that the rule was chosen knowing this could happen).
     - Step B: If the vulnerability was not known, then simulate the election under the complaint scenario (e.g., remove the alleged decoy candidate and re-run the votes). If the outcome changes, then the complaint is valid and the election may need to be re-run (if the rule allows) or the rule changed for next time. If the outcome doesn't change, then the complaint is unfounded.

  3. **If about process**: Follow the society's existing grievance procedure.

  4. **Report**: Document the complaint and the findings. If the complaint reveals a new vulnerability, then initiate the pre-adoption procedure to re-evaluate the rule.

  ### 4. The three cases

  **Case 1: President-elect race with two near-identical candidates from a bloc**
  - Proposed rule: Plurality voting (current system).
  - Step 1: Three or more candidates (two from the bloc, one from outside). Proceed.
  - Step 2: Preferences? Unlikely to be single-peaked (unless the society has a clear spectrum). Assume unrestricted domain.
  - Step 3: Not non-deterministic and not cardinal. Proceed.
  - Step 4: Vulnerability analysis: 
     - Scenario a: The two bloc candidates split the vote, allowing the third candidate to win with a minority. This is the exact complaint. The rule is vulnerable.
     - Scenario b: Decoy candidate? Not directly, but the two bloc candidates are effectively clones. The vulnerability is severe.
     - Step 4 termination: Reject plurality for this race.
  - Alternative rule: Ranked voting (IRV or Condorcet). 
     - For IRV: 
        - Step 4: In scenario a, if the bloc ranks the two similar candidates first and second, then the third candidate is eliminated first if they have the least first-preference votes? Not necessarily. If the third candidate has the most first-preference votes, they might win. If the bloc is a majority, then one of their candidates should win. In IRV, if the bloc ranks A first and B second (or vice versa), then even if they split the first-preference votes, the one with fewer votes is eliminated and their votes transfer to the other, so the bloc's preferred candidate (the one that survives) should win. This mitigates vote splitting. 
        - However, IRV is not strategy-proof. A bloc might try to rank a less popular candidate first to manipulate the order of elimination. But in this specific vulnerability (splitting), it is robust. 
        - Step 4: Acceptable.
     - Step 5: Explain IRV: "Voters rank candidates. If no candidate has a majority of first choices, the candidate with the fewest first choices is eliminated, and their votes go to the next choice. This continues until one candidate has a majority." This is acceptable and avoids the splitting issue.

  **Case 2: Best-paper prize with four finalists and a committee of nine**
  - Current rule: Hand-rolled ranked system (probably a Borda count?).
  - Step 1: Four options (papers). Committee of nine. The committee nominates and votes, so there might be conflicts of interest. Proceed.
  - Step 2: Preferences? The papers might be on different topics, so single-peakedness is unlikely. Unrestricted domain.
  - Step 3: We can use cardinal voting? The platform supports scored ballots. Consider score voting (0-5 or 1-5). This is not covered by GS and may be less manipulable than ranked systems in some cases. But note: the committee nominates and votes, so they might manipulate the nomination to get their paper in and then score strategically. 
  - Step 4: Vulnerability analysis:
     - Scenario: A committee member might give a low score to a strong rival paper and a high score to their own. This is a known issue in cardinal voting (no show of preferences). Also, if the committee can nominate a decoy paper, that might help their favorite. 
     - However, score voting is vulnerable to strategic exaggeration (giving min or max scores). 
     - But compared to the current system (which is unaudited), a standard score voting system is transparent and less complex. 
     - Given the small committee, they might coordinate. But the vulnerability is inherent to the committee structure. 
     - Step 4: Conditionally acceptable if the committee is trusted. 
  - Step 5: Explain: "Each committee member scores each paper on a scale of 0-5. The paper with the highest total score wins." This is simple. 
  - But note: The current rule is a ranked system. We can also consider a Condorcet method, but if the committee is small, they might have circular preferences. Alternatively, use approval voting? But the platform may not support it. Since the platform supports scored, we stick with score voting.

  **Case 3: Bylaw referendum with three options, one decoy**
  - Current rule: Plurality voting.
  - Step 1: Three options. Proceed.
  - Step 2: Preferences? The options are about bylaw changes. They might be ordered (e.g., from status quo to moderate change to radical change). If so, single-peaked preferences are likely. 
     - If the subcommittee can confirm single-peakedness (by asking members or looking at past referenda), then they can use a rule that is strategy-proof for single-peaked domains (like Black's method: if there is a Condorcet winner, choose it; else, use Borda). 
     - Alternatively, use the median voter rule: ask voters to rank the options and then pick the median. 
     - But the platform supports ranked ballots. 
     - Step 2: If the domain is single-peaked, then use a Condorcet method (which is strategy-proof in this domain). 
  - However, if the domain is not single-peaked, then proceed to Step 3 and 4.
  - But the problem states: one option is a decoy to make another look moderate. This suggests that the council is manipulating the options. The voting rule cannot prevent this. The issue is the control of the agenda. 
  - Pre-adoption: 
     - Step 4: For plurality voting: vulnerable to decoy. The decoy might split the vote of the radical option, allowing the moderate to win. 
     - For ranked voting (without single-peakedness): still vulnerable to strategic nomination. 
     - So the rule is rejected unless the domain is single-peaked and we use a Condorcet method (which would pick the median and ignore the decoy if preferences are single-peaked). 
  - Step 2: The subcommittee must determine if preferences are single-peaked. They can do a survey: ask members to rank the options and see if the rankings are consistent with a linear order. If yes, then use Condorcet. If not, then the rule is vulnerable and we must either accept the risk or change the rule (e.g., to score voting, which might be less sensitive to decoys, but not immune). 
  - However, if the decoy is introduced by the council, the problem is not just the voting rule but the agenda setting. The procedure might flag that the rule is vulnerable and the subcommittee should consider if the council should be restricted in how they set the options.

  One of these cases comes out badly: Case 1 (president-elect) rejects plurality and suggests IRV. Case 2 suggests score voting and is acceptable. Case 3: if the domain is single-peaked, then Condorcet is acceptable. But if the subcommittee cannot confirm single-peakedness, then the rule (plurality) is rejected and the alternatives (like Condorcet without single-peakedness) are vulnerable too. So Case 3 comes out badly if the domain is not single-peaked.

  ### 5. Where the procedure breaks
  - The procedure relies on the subcommittee's ability to judge the domain (single-peakedness). This requires data (from surveys or past elections) and expertise to analyze. Without that, the judgment may be wrong.
  - The vulnerability analysis (Step 4) is based on hypothetical scenarios. It might miss real-world complexities or new strategies.
  - The procedure assumes the subcommittee can get member input on values (like acceptance of randomness) and domain structure. If the society is uncooperative, this step fails.
  - The complaint-triage procedure might not be able to conclusively determine if manipulation occurred without a full investigation, which is time-consuming.

  ### Closing note
  Confidence: The procedure is grounded in social choice theory and addresses the GS theorem by focusing on domain restrictions, non-determinism, and cardinal voting. However, the practical application (especially in Step 2 and Step 4) is subjective and relies on the subcommittee's diligence. The least sure step is Step 2 (restricted domain) because it requires empirical verification of preference structures, which is difficult to do without data and may change from election to election. Moreover, the assumption of single-peakedness in a society may not hold for all issues.

