answer: |-
  Here is a comprehensive exam question, model answer, and marking scheme tailored to your requirements.

  ---

  **Exam Question:**

  "Buddhist ethics presents a unique challenge to consequentialist frameworks due to the asymmetric structure of karma: merit (*puṇya*) can be dedicated or transferred for the benefit of others, while demerit (*pāpa*) is inalienably bound to the agent who accrues it. This is dramatically illustrated in the *Upāyakauśalya Sūtra*, where the Bodhisattva captain accepts rebirth in hell for killing a robber, recognizing that demerit cannot be shed or transferred.  

  Drawing primarily on Śāntideva’s argument for the self-and-other exchange (*parātmasamata*) in the *Bodhicaryāvatāra* (Chapter 8) and the concept of skillful means (*upāya*), analyze whether a normative theory in which benefits are agent-neutrally aggregable but harms are strictly agent-relative can coherently be classified as consequentialist.  

  Specifically, address:  
  1. How the transferability of merit and non-transferability of demerit disrupts standard consequentialist aggregation of value.  
  2. Whether Śāntideva’s exchange argument resolves this tension or reinforces it.  
  3. What a Buddhist must revise to achieve coherence: the account of karma, or the characterization of the view as consequentialist? Evaluate the philosophical and soteriological costs of each revision.  

  Avoid rehashing the virtue ethics vs. consequentialism debate. Focus on the structural implications of karma’s asymmetry for moral reasoning and outcomes."

  ---

  **Model Answer (750 words):**

  The asymmetric structure of karma—transferable merit but non-transferable demerit—creates a fundamental tension with core tenets of consequentialism. Consequentialism typically demands agent-neutral aggregation of all value, where harms and benefits are impartially quantified to determine the net best outcome. Yet Buddhism’s karmic ledger violates this symmetry: merit can be redirected to others (e.g., dedicating merit for deceased relatives), but demerit, as the *Upāyakauśalya Sūtra* emphasizes, remains irrevocably tied to the agent. The Bodhisattva captain accepts hellish rebirth *because* the karmic burden of killing cannot be offloaded, even when the act prevents greater harm. This renders harms *agent-relative* and non-aggregable, while benefits retain agent-neutral potential.  

  Śāntideva’s self-and-other exchange (*parātmasamata*) superficially appears to resolve this asymmetry by urging agents to treat others’ suffering as their own. He argues that since all beings equally desire happiness and reject suffering, and no self has ultimate reality, we should “exchange self for other” (BCA 8.120). This seems to promote agent-neutrality: alleviating others’ suffering becomes as urgent as alleviating one’s own. However, this argument clashes with karmic reality. While Śāntideva encourages taking on others’ *suffering* in contemplation, he cannot erase the karmic fact that *demerit* from unwholesome actions remains bound to the actor. One may cultivate compassion to relieve others’ pain, but if doing so requires a harmful act (like the captain’s killing), the resulting demerit is inescapably one’s own. Skillful means (*upāya*) permits such acts only because the Bodhisattva voluntarily bears the karmic cost to reduce net suffering—not because the cost is nullified or shared. Thus, Śāntideva’s exchange operates at the psychological level (reorienting motivation toward altruism) but fails to alter the metaphysical asymmetry of karma. The Bodhisattva’s sacrifice is profound precisely because the harm *cannot* be distributed.  

  This asymmetry challenges Buddhism’s classification as consequentialism. Consequentialism requires that all morally relevant outcomes—harms and benefits—be calculable in a single, agent-neutral metric (e.g., utility). Yet Buddhism lacks such a metric: benefits (merit) can be pooled, but harms (demerit) are locked to individuals. A Buddhist "greatest good" could maximize merit-generation while minimizing demerit-accrual *per agent*, but this is not equivalent to maximizing net goodness simpliciter. One could aggregate merit to produce sublime collective outcomes (e.g., a Buddha-field), but individual demerit still drags specific beings into lower rebirths. The whole system thus resembles a "consequentialism of benefits" paired with a "non-consequentialism of harms."  

  To achieve coherence, two revisions are possible—each with significant costs.  

  *First*, revise karma to allow demerit transfer. This would align with standard consequentialism: harms and benefits become fully aggregable. Śāntideva’s exchange could then be fully realized, as taking on others’ karmic debt would be possible. However, this destroys key Buddhist doctrines. Moral responsibility (*karmaphala*) relies on the inalienability of demerit; if demerit could be transferred, the link between action, intention, and rebirth is severed. The *Upāyakauśalya*’s moral tragedy—the captain’s sacrifice—loses its meaning, and skillful means risks becoming ethical loophole. Worse, beings could "trade" demerit, undermining soteriological urgency.  

  *Second*, abandon labeling Buddhist ethics as consequentialist. The asymmetry reveals its core is *soteriological responsibility*: maximizing sentient welfare *within* the constraint that each being bears their own demerit. This preserves karma’s moral mechanics and the gravity of unwholesome acts but concedes that Buddhist ethics cannot be reduced to outcome-maximization. The cost is philosophical: Buddhism must be seen as a hybrid system where consequences matter, but only within an agent-relative framework of karmic accountability. Skillful means is not optimific calculus but compassionate risk-taking *despite* personal cost.  

  The tension is irreducible. Revising karma sacrifices moral accountability; revising the consequentialist attribution admits Buddhism’s unique structure cannot be assimilated to Western frameworks without loss. Yet this very tension illuminates Buddhism’s depth: it demands we seek the good while acknowledging that some burdens—like the captain’s—must be borne alone, transforming ethics from mere calculation into a field of courage and sacrifice.

  ---

  **Marking Scheme (out of 25):**

  **First-Class Answer (21–25):**  
  - **Precisely identifies** the asymmetry (transferable merit vs. non-transferable demerit) and its challenge to consequentialist aggregation (5 pts).  
  - **Nuanced analysis** of Śāntideva: shows exchange addresses motivation but *fails* to resolve karmic asymmetry (4 pts).  
  - **Critically evaluates** both revisions (karma vs. attribution) with clear costs: e.g., loss of moral responsibility vs. admission of non-consequentialism (6 pts).  
  - **Integrates skillful means** correctly: as accepting karmic cost, not suspending precepts (4 pts).  
  - **Original synthesis**: Uses asymmetry to explain Buddhist ethics’ distinct structure beyond virtue/consequentialism (3 pts).  
  - **Structure**: Logical flow, concise prose, no significant errors (3 pts).  

  **Strong Upper Second (17–20):**  
  - Identifies asymmetry and challenge to aggregation, but less precisely.  
  - Analyzes Śāntideva’s exchange but may overstate its reconciling power.  
  - Evaluates both revisions but with uneven depth on costs.  
  - Uses skillful means correctly.  
  - Good structure but minor lapses in clarity.  

  **Characteristic Errors (Deduct 1–3 pts per occurrence):**  
  1. **Misusing *upāya***: Treating it as a general license to violate precepts without emphasizing irreversible karmic burden.  
  2. **Nirvāṇa as state of affairs**: Framing nirvāṇa as a "maximizable" outcome rather than an unconditioned telos.  
  3. **Equating compassion with utility**: Assuming karuṇā aims at impartial aggregation rather than radical empathy within karmic constraints.  
  4. **Ignoring asymmetry**: Collapsing merit/demerit into a single quantifiable metric.  
  5. **Over-simplifying Śāntideva**: Presenting exchange as literal karmic transfer rather than psychological reorientation.  

  ---

  This question forces engagement with metaphysics (karma’s structure), ethics (consequentialist criteria), and soteriology (costs of revision), moving beyond rehearsed debates. The marking scheme rewards precision on asymmetry and penalizes common interpretive pitfalls.
