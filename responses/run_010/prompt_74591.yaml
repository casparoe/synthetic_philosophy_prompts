  **CONSUMER PRODUCT SAFETY COMMISSION**  
  **Recall Notice: CPSC-RC-2024-09**  
  **Issue Date: October 26, 2024**  

  ---

  **PRODUCT**  
  *EverLast™ Ceramic Mug Series 7* (Models EL-7A through EL-7F). Sold exclusively at home goods retailers nationwide August 2023–September 2024. Units are 12 oz. capacity, glazed ceramic with manufacturer’s logo embossed on base.  

  **HAZARD**  
  The recalled mugs fail to reliably satisfy the CPSC Fragility Verification Standard (FVS-1987) under non-canonical test conditions. Specifically, the product exhibits dispositional instability wherein:  
  (a) Genuine fragility may not manifest upon standardized impact stimulus due to extrinsic interference (e.g., integrated packaging, environmental dampeners), or  
  (b) Non-fragile units may exhibit breakage mimicking fragility due to extrinsic shattering agents.  
  This constitutes a critical failure of *predictive safety assurance*, as the product’s compliance status cannot be empirically stabilized across its operational lifespan.  

  **REMEDY**  
  Refund or replacement with Series 8 mugs (FVS-1987 compliant).  

  **INCIDENTS AND INJURIES**  
  *Reported Incidents:* 0 (physical injury) | 147 (metaphysical distress)  
  *Injuries:* 0 (laceration) | 38 (epistemic uncertainty)  
  *Note:* Injuries classified under "epistemic uncertainty" include consumer reports of "existential unease" and "loss of counterfactual confidence."  

  **WHAT CONSUMERS SHOULD DO**  
  1. **STOP USING** recalled mugs immediately.  
  2. **CONTACT** EverLast Consumer Affairs (1-888-555-ELUG) for refund/replacement instructions.  
  3. **DO NOT ATTEMPT VERIFICATION TESTING.** Uncontrolled striking may invalidate dispositional status or trigger mimicry cascades.  
  4. **REPORT** anomalous breakage/non-breakage events to CPSC at www.cpsc.gov/EL7Alert.  

  ---

  ### MANUFACTURER STATEMENT  
  *EverLast Homewares, Inc.*  
  "EverLast stands unequivocally by the *functional fragility* of Series 7 mugs under *canonical testing protocols*. All units passed CPSC Standard Drop Tests (SDT-A) at 1.5m onto Grade 40 steel plate. Any non-breakage observed in the field occurs exclusively under *non-canonical conditions* (e.g., shock-absorbing sleeves, quantum-stabilized countertops), which our Terms of Use explicitly exclude from fragility warranties.  

  Further, alleged 'mimic' breakage events are attributable to consumer misuse of extrinsic shattering devices (e.g., ultrasonic hammers, entropic projectors) in violation of Section 4(b) of our Limited Warranty.  

  **New Proviso:** Effective immediately, Series 7 fragility is certified *only* when:  
  (i) Testing occurs in CPSC-approved canonical environments (List E7-Rev3),  
  (ii) No extrinsic interferers are present,  
  (iii) The mug’s intrinsic dispositional character remains invariant from t<sub>0</sub> (pre-impact) to t<sub>1</sub> (manifestation), *and*  
  (iv) The tester holds a valid EverLast Canonical Condition Permit (CCP-7).  

  Units failing these conditions fall outside our fragility guarantee but remain eligible for refunds."  

  ---

  ### APPENDIX: DEFINITIONS (CPSC FVS-1987)  
  **Fragility:** The disposition of an object to break when struck.  
  **Struck:** Kinetic transfer ≥5J via uncontrolled impact.  
  **Break:** Separation into ≥2 fragments.  
  **Intrinsic Dispositional Character (IDC):** The property-bearer’s non-relational state ensuring fragility manifests *without* extrinsic mediation.  
  **Non-Canonical Conditions:** Environments violating IDC invariance.  

  ---

  ### FAQ  
  **Q1: My mug is still intact. Is it safe?**  
  A: Safety is indeterminate. Non-breakage may indicate (a) genuine fragility + interferer, or (b) non-fragility. Discontinue use.  

  **Q2: What if my mug was bonded inside its shock-absorbing sleeve?**  
  A: This voids fragility verification. The sleeve is an extrinsic interferer blocking manifestation. Refund eligible.  

  **Q3: The manufacturer says my mug broke because I used an "entropic projector." What is that?**  
  A: Per FVS-1987, any device shattering non-fragile objects by force qualifies. Common examples: industrial presses, runaway trolleys, modal collapse generators.  

  **Q4: My mug has never been dropped. Is it fragile?**  
  A: CPSC cannot confirm. Testing may alter IDC or induce mimicry. Untested units are dispositionally latent. Return for refund.  

  **Q5: What is an "intrinsic dispositional character"?**  
  A: Per FVS-1987 §12(c), it is the categorical basis ensuring the mug *would* break if struck *without* extrinsic aid. Specification pending industry consensus.  

  **Q6: Why did the CPSC outsource canonical conditions to EverLast’s marketing team?**  
  A: This was a clerical error. The referral to EverLast’s "Ideal Mug Experience" department has been rescinded due to conflicts of interest.  

  ---  
  **Notice Filed Under 16 CFR §1115**  
  **CPSC Recall Coordinator: J. Arkwright, Ext. 309**
