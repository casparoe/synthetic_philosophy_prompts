answer: |-
  Here’s a complete game design tailored to your constraints and goals. It runs in 2 hours with index cards, emphasizes the **unobservability of counterfactual deservingness**, and forces players to confront the decay of eligibility proxies. The core conflict: *Rules that perfectly exclude "gamers" also exclude the genuinely stuck, and caseworkers can’t distinguish them.*

  ---

  ### **Game Title:** **Proxy Decay**
  **Core Mechanic:** Claimants hide/unhide traits to pass eligibility thresholds; caseworkers set rules using flawed proxies. Scoring forces tradeoffs between exclusion errors (denying the deserving) and inclusion errors (aiding the undeserving).

  ---

  ### **Materials List** (30 mins prep)
  - **Index Cards** (40+): 
    - 12x Claimant Role Cards (see roles below)
    - 8x Caseworker Question Cards (printed or handwritten):
      > 1. "Proof of job applications?" (Requires 1+ job app token)  
      > 2. "Formal disability status?" (Yes/No)  
      > 3. "Dependent care responsibilities?" (Yes/No)  
      > 4. "Income below £X/week?" (Yes/No)  
      > 5. "Participating in work program?" (Yes/No)  
      > 6. "Bank statements showing <£Y savings?" (Yes/No)  
      > 7. "Housing instability?" (Yes/No)  
      > 8. "Education level?" (High/Low)  
    - 20x **Trait Tokens** (small paper squares): Job apps (10), Disability Status (5), Care Proof (5).
  - **Whiteboard** to track:  
    - Round scores  
    - Current rules/thresholds  
    - Community Pool points (start at 100)
  - **Timer** (phone app ok)

  ---

  ### **Roles** (12 Claimants - *Scaleable to 8*)
  Each role has:  
  - **Public Trait**: Observable if asked (e.g., "Declared income: £100/week").  
  - **Hidden Trait**: Only known to claimant, affects deservingness (e.g., "Undeclared partner income: £200/week").  
  - **"Stuck" Status**: Whether they’re *genuinely trapped* without aid (G) or *could work* but gaming (S).  
  - **Win Condition**: Get benefits if genuinely stuck (G) OR avoid work if gaming (S).  

  | Role                  | Public Trait          | Hidden Trait                     | "Stuck" (G/S) | Notes                                                                 |
  |-----------------------|-----------------------|----------------------------------|---------------|-----------------------------------------------------------------------|
  | Single Parent         | 2 dependents          | No childcare options (real)      | G             | Needs aid to search for work                                         |
  | Chronic Pain          | No formal disability  | Undiagnosed condition (real)     | G             | Can’t stand long hours                                               |
  | Gig Worker            | Fluctuating income    | Cash-in-hand side hustle (hidden)| S             | Hides income to qualify                                              |
  | Caregiver             | Elderly parent        | Parent’s pension covers rent (hid)| S             | Gaming to avoid work                                                 |
  | Recent Grad           | Low declared income   | Job offer fell through (real)    | G             | Genuinely stranded                                                   |
  | Recovering Addict     | Unemployed 6+ months  | In treatment (real)              | G             | Needs stability                                                      |
  | "Retired" Early       | Zero income           | Savings £20k (hidden)            | S             | Doesn’t want to work                                                 |
  | Immigrant             | Limited work history  | Undocumented spouse (real)       | G             | Can’t access jobs legally                                            |
  | Burnout Tech Worker   | High education        | Severe anxiety (real)            | G             | Can’t handle high-pressure jobs                                      |
  | Underemployed         | Part-time work        | Declines full-time offers (hid)  | S             | Prefers benefits + part-time                                         |
  | Domestic Abuse Victim | No fixed address      | Controlling partner (real)       | G             | Can’t safely report income                                           |
  | Freelancer            | Irregular income      | Underreports earnings (hid)      | S             | Maximizes benefits                                                   |

  ---

  ### **Scoring System: The Community Pool**
  - **Starting Pool**: 100 points (represents societal well-being).  
  - **Costs**:  
    - **False Negative** (deny genuinely stuck claimant): **-5 points**  
    - **False Positive** (approve gamer): **-3 points**  
    - **Audit/Shock**: **-10 points** if triggered (see Round 4).  
  - **Why it works**:  
    - False negatives cost more to reflect *human suffering* (social work students will feel this).  
    - Pool is visible to all—players *feel* collective punishment when it drops.  
    - Libertarians see inefficiency costs; social workers see harm. Balanced pressure.

  ---

  ### **Timeline** (120 mins total)
  **SETUP** (15 mins)  
  - Assign roles randomly (6-8 claimants, 4 caseworkers, others observe).  
  - Explain: *“You’ll make tradeoffs between fairness and efficiency. Society loses points when aid is misallocated.”*  
  - Hand out role cards + tokens. Caseworkers get Question Cards.  

  **ROUND 1: Baseline** (20 mins)  
  - *Caseworkers*: Set 3 questions + threshold (e.g., 2 "Yes" answers required).  
  - *Claimants*: Answer truthfully. No gaming.  
  - *Facilitator*: Approve/deny based on answers. Adjust pool based on hidden traits.  
  - **Debrief Prompt**: *“How accurate were your rules? What errors did you make?”*  

  **ROUND 2: Revision** (15 mins)  
  - *Caseworkers*: See pool score + error types. Revise questions/threshold.  
  - *Claimants*: Still truthful.  
  - *Facilitator*: Update pool. Highlight *why* errors persist (e.g., *“You excluded Single Parent—they had no childcare”*).  

  **ROUND 3: Adaptation** (25 mins)  
  - *Claimants*: Can **lie/hide traits** (e.g., burn Job App tokens to "prove" job search).  
  - *Caseworkers*: Same rules—unaware of gaming.  
  - *Facilitator*: Adjust pool. *“Notice how claimants adapted to your rules.”*  

  **ROUND 4: System Shock** (20 mins)  
  - **Audit**: Randomly audit 2 claimants—reveal hidden traits + true status (G/S).  
  - **Budget Cut**: Pool drops 10 points. Caseworkers must deny 30% more claimants.  
  - *Facilitator*: *“You now see two hidden realities. Does this change your rules?”*  

  **DEBRIEF** (25 mins)  
  1. **Map Moments**:  
     - *“When you stopped asking about dependents (Round 2), Caregiver gamed the system. But Single Parent got excluded for the same reason.”*  
     - *“You set high job-app thresholds—Recovering Addict couldn’t comply, but Gig Worker faked it.”*  
  2. **Surface Normative Premise**:  
     - *“Did you assume false positives (aiding gamers) were worse than false negatives (excluding stuck)? Why?”*  
     - *“In Round 4, you saw both types look identical—what does that say about real eligibility tests?”*  
  3. **Core Insight**:  
     - *“Deservingness depends on what people *would do* without the rule—but you can only see what they *do* under the rule. Proxies decay when people adapt.”*  

  ---

  ### **Predictable Problems & Fixes**
  1. **Cartoon Villain Claimant**:  
     - *Prevent*: Roles blend nuance (e.g., "Caregiver" hides support but has real responsibilities).  
     - *Fix*: Remind players: *“Your role’s actions are rational self-interest—not evil.”*  

  2. **Social Work Students Boycott Casework**:  
     - *Prevent*: Frame casework as *“diagnosing systemic flaws, not endorsing them.”*  
     - *Fix*: Let them swap with observers. Use their critique in debrief (*“Why did this role feel unethical?”*).  

  3. **Libertarian Wins & Disengagement**:  
     - *Prevent*: Scoring makes false negatives costlier—tight rules tank the pool.  
     - *Fix*: *“You cut fraud, but the pool dropped 15 points from excluding stuck claimants. Was it worth it?”*  

  4. **Scoring Broken**:  
     - *Prevent*: Hide point values until debrief. Facilitator controls pool.  
     - *Fix*: *“The costs reflect real tradeoffs—we’ll discuss why they’re weighted this way.”*  

  ---

  ### **What the Game Can’t Capture (Facilitator Script)**
  *“This simulates systemic incentives, not human suffering. In reality, false negatives mean starvation, trauma, or death—not just points. Proxies like ‘job apps’ feel dehumanizing because they reduce complex lives to checkboxes. The game can’t make you feel that weight. Remember: real claimants aren’t ‘gamers’ or ‘saints’—they’re people reacting to a system that can’t see their counterfactual selves.”*

  ---

  ### **Scaling for 8 Players**
  - **Claimants**: 5 (e.g., Single Parent, Chronic Pain, Gig Worker, Recent Grad, Underemployed).  
  - **Caseworkers**: 3 (split decision-making).  
  - **Adjust**:  
    - Fewer rounds (merge Rounds 1 & 2).  
    - Reduce questions to 2 per round.  
    - Skip audit; use budget shock only.  
  - **Why it works**: Core dilemma remains intact with 5 claimants. Traits still clash (e.g., Chronic Pain’s real limit vs. Gig Worker’s hidden income).

  ---

  ### **Why This Works**
  - **Felt Tension**: Pool scoring makes errors visceral. Caseworkers see rules backfire; claimants feel system blindness.  
  - **Proxy Decay Embodied**: Round 3 forces adaptation—claimants manipulate the same proxies caseworkers rely on.  
  - **Normative Premise Exposed**: Debrief uses their choices to reveal bias toward false positives vs. negatives.  
  - **Low Prep**: Index cards + whiteboard. No tech or handouts.  

