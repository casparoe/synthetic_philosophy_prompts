  - **Caseworker Materials**:
     - List of 5 questions (with scoring rules for answers) - see example below.
     - A sheet to record the threshold and decisions.

  - **Facilitator Materials**:
     - Scoreboard for the community pool (starting at 100).
     - Table of costs:
          - False negative (deny a Type G): -5
          - False positive (grant to Type S): -3
          - True positive (grant to Type G): +1
          - True negative (deny to Type S): +2
     - A way to track the true types and traits (a master list).

  - **Room Setup**: 
     - A whiteboard to show the pool and round results.
     - Space for caseworkers to confer and claimants to wait.

  ### Example Claimant Role Cards

  **Card 1**:
  - Type: G (Genuine)
  - Trait: Single parent of a 3-year-old. No family nearby to help.
  - Instructions: In Rounds 1 and 2, answer truthfully. In Round 3, you can choose to lie if you think it will help you get benefits. Without benefits, you cannot afford childcare to search for work.

