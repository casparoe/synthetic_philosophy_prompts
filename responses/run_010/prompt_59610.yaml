  - Type: S (Strategic)
  - Trait: Hiding partner's income (partner works cash-in-hand).
  - Instructions: In Rounds 1 and 2, you answered truthfully and were denied? Now in Round 3, you can lie to get benefits.

  **Card 5**:
  - Type: S
  - Trait: Young graduate who doesn't want a low-paying job. Lives with parents.
  - Instructions: ...

  **Card 6** (if more players):
  - Type: G
  - Trait: Recovering addict (needs stability to avoid relapse and then work)
  - Instructions: ...

  **Card 7**:
  - Type: S
  - Trait: Has a part-time job but doesn't report it.
  - Instructions: ...

  **Card 8**:
  - Type: G or S? Let's have a mix. We want about 50-50? Or more genuine to reflect reality? Let's say 5 G and 3 S for 8 claimants.

  ### Example Questions for Caseworkers
  Each question has a scoring rule. The caseworkers choose which 3 to ask. They can change the set each round.

  1. **Job Applications**: "Can you provide evidence of at least 3 job applications in the last month?" 
