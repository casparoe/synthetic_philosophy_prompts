prompt: |-
  So, fortnightly reading group in a pub back room, about 14 of us, two hours, no budget and no printer beyond my crappy one at home. The crowd is very LW-adjacent — lots of people who will happily argue about priors for an hour and consider it a good evening. Composition matters here: two people who have actually worked in benefits administration, one hardline libertarian who reads economics for fun, and three social work students who will smell a strawman from across the room. I don't want anybody to feel like the game was rigged for their side.

  Next session is conditionality — work search requirements, workfare, sanctions, benefit fraud, the whole deserving/undeserving poor thing. Reading stuff aloud and discussing it will just collapse into everyone restating their priors with more confidence. I want them to run into the problem instead.

  Here's the seed I've got, and I want you to build it into something actually runnable. The core idea I want them to *feel* rather than be told: deservingness is a counterfactual about a person — what they'd do if the rule weren't there — and it's not observable from inside the system. So every eligibility test is a proxy for something unmeasurable, and the claimants can see the proxy even though the caseworkers can't see them. Which means over repeated rounds the proxy decays, and a rule tight enough to catch the person gaming it is also tight enough to exclude the person who's genuinely stuck, and from the caseworker's chair those two look identical.

  Concretely I'm imagining something like four rounds. Round 1, caseworkers set a threshold without knowing the claimant population. Round 2, they see the error rates they produced and get to revise. Round 3, claimants have now learned the rule and start optimizing to it. Round 4, some kind of audit or budget shock. But I'm not attached to that shape — if you think the four-round structure won't actually generate the thing I want, say so and give me a better one.

  Some claimant roles need to encode stuff that's real but unverifiable: an undiagnosed illness, a caring responsibility, a job offer that evaporated, a partner's income nobody declared. Caseworkers should be restricted to a fixed list of questions so they can't just interrogate their way to the truth. I want a few roles where gaming is the rational move and a few where it isn't and nobody can tell which is which from outside.

  What I need from you:
  - Full role set and materials list. Index cards, tokens, a whiteboard are all fine, no real money.
  - A scoring scheme that produces felt cost without money. I've been mulling a shared pool that the whole room loses from when someone is wrongly sanctioned, but I don't know if that just makes everyone soft — you figure out what actually creates pressure, and tell me why.
  - Minute-by-minute timeline for the two hours, including where the rounds can overrun.
  - A debrief that maps specific moments ("when Dave refused to ask the third question") onto the concepts, and — importantly — surfaces the hidden normative premise that the two error types are or aren't equally bad, without me announcing it from the front. They should notice that they've been assuming something.
  - What will predictably go wrong the first time I run this. My guesses: someone plays the claimant as a cartoon villain, the social work students refuse to play caseworker on principle, the libertarian wins round 3 and half the room disengages, and someone figures out how to break the scoring. Handle each.
  - An honest paragraph on which feature of the real thing the game cannot reproduce, that I'm going to have to supply myself, and what I should say.
  - How it degrades if only 8 people turn up, which is the likelier scenario.

  Don't send me a reading list or citations, I've got plenty and it's not what I'm asking for. Also feel free to tell me the seed is bad, but if it is, bring a replacement I can run in a pub with index cards.
reasoning: |-
  We are going to design a game that simulates the conditionality system in benefits administration, focusing on the decay of proxies and the unobservability of deservingness. The core insight is that deservingness is a counterfactual (what the person would do without the rule) and that over time, rules designed to catch "gaming" also trap the genuinely stuck, and these two become indistinguishable.

  The game will have two main roles: Claimants and Caseworkers. We'll run multiple rounds where caseworkers set rules (thresholds or criteria) and claimants respond. We aim for 4 rounds as per your seed, but with adjustments to ensure the learning unfolds.

  ### Structure
  1. **Round 1: Baseline** - Caseworkers set an initial threshold without knowing the claimant population. Claimants are passive (they don't game yet).
  2. **Round 2: Feedback and Revision** - Caseworkers see error rates (false positives and false negatives) and revise the threshold.
  3. **Round 3: Claimant Adaptation** - Claimants now learn the rule and can choose to "game" or not based on their role.
  4. **Round 4: System Shock** - Introduce an audit (which reveals some hidden truths) or a budget cut (increasing pressure).

  ### Roles and Materials
  - **Claimants (6-8 players)**: Each claimant has a hidden role with:
     - A "deservingness" status (Deserving or Undeserving). Deserving: genuinely need help and would not work without benefits? Actually, let's define:
       - **Deserving**: If they receive benefits, they will use them appropriately and are unable to work (or search effectively) without the support.
       - **Undeserving**: They could work but choose not to (if they get benefits, they won't work; if they don't, they might work).
     - Hidden traits that affect their situation (unverifiable to the caseworker). Examples:
        - Role 1: Single parent with a young child (caring responsibility). Deserving? Yes, because without benefits they cannot search for work properly. But if they get benefits, they can arrange childcare and search.
        - Role 2: Recovering addict (undiagnosed illness). Deserving? Yes, because they need stability to recover and then work.
        - Role 3: Recently laid off, but has a job offer that fell through (unverifiable). Deserving? Yes, because they are actively looking but hit a setback.
        - Role 4: Has a partner who works but they are hiding that income (fraud). Undeserving? Actually, they are gaming the system.
        - Role 5: Young graduate who is picky about jobs (could work but is holding out for a better one). Undeserving? They could work but choose not to.
        - Role 6: Has a chronic pain condition but no diagnosis (unverifiable). Deserving? Yes, because they can't work without treatment which they can't afford without benefits.

    But note: We want some roles where gaming is rational and some where it isn't, and the caseworkers can't tell. Also, we want to avoid making "undeserving" cartoonish. Let's reframe: every claimant has a "true type" (what they would do without benefits) and a "observed behavior" (what they do in the system). The caseworkers only see the behavior.

    Instead, each claimant has:
     - **True Need (Hidden)**: Either High (they cannot work without benefits) or Low (they can work but might choose not to).
     - **Gaming Propensity (Hidden)**: Either High (they will game the system if they can) or Low (they are honest even if it hurts them). But note: for the High True Need, gaming might be rational to survive.

    Actually, let's simplify to two types:
     - **Type G (Genuine)**: If they get benefits, they use them to improve their situation and eventually become self-sufficient (or at least are honest). Without benefits, they are worse off and cannot work effectively.
     - **Type S (Strategic)**: If they get benefits, they will take them and not work. Without benefits, they might work (if the sanctions are harsh enough) or they might just suffer (but we want them to be able to game).

    However, the caseworkers don't know the type. They only observe behaviors that are the result of the rules and the claimant's response.

    We'll create claimant roles that have a hidden type and a set of traits. The traits are what the claimant can reveal (or not) to the caseworker. The caseworker has a fixed set of questions to ask.

    **Claimant Role Cards** (each card has):
     - **Hidden Type**: G (Genuine) or S (Strategic)
     - **Hidden Trait**: A short description of their situation (e.g., "Single parent of a 3-year-old", "Undiagnosed chronic back pain", "Hiding partner's income", etc.)
     - **Instructions**: 
          - If you are Type G: You are genuinely in need. Without benefits, you cannot effectively search for work. With benefits, you will search and if you find a job, you will take it.
          - If you are Type S: You could work but prefer not to. Without benefits, you might be forced to take a job (if the sanction is harsh). With benefits, you will not search seriously and will try to keep getting benefits.

    But note: we want the claimants to have agency in how they present themselves. So in Round 3, they can choose to "game" the system by lying or hiding information.

    **Caseworkers (2-4 players)**: They set the rules (a threshold for granting benefits) and ask questions. They have a fixed set of questions they can ask (e.g., 3 questions per claimant). The questions are designed to reveal proxies for deservingness.

    **Materials**:
     - Index cards for claimant roles (with hidden type and trait)
     - A whiteboard or flip chart to record the rules and outcomes
     - Tokens or chips to represent benefits (or just record on paper)
     - A list of questions for caseworkers (see below)

  ### Questions for Caseworkers
  The caseworkers can choose from a fixed list of questions to ask each claimant. Each question is designed to get a piece of information that might be a proxy for need or gaming. Examples:

  1. Can you provide evidence of job applications in the last month? (If yes, +1 point; if no, -1 point)
  2. Do you have any dependents? (If yes, +1; if no, 0)
  3. Have you been employed in the last 6 months? (If yes, 0; if no, -1) [Note: this might be bad because it penalizes the long-term unemployed?]
  4. Do you have a health condition that affects your ability to work? (If yes, +1; if no, 0) [But note: the claimant can lie about this]
  5. Are you currently enrolled in any training or education? (If yes, +1; if no, 0)

  But the caseworkers don't have to ask all questions. They can choose which ones to ask (say, up to 3 per claimant). Then they set a threshold: if the total points from the answers meet the threshold, the claimant gets benefits.

  However, the claimants can lie in their answers! In Rounds 1 and 2, they are truthful. In Round 3, they can lie strategically.

  ### Scoring and Felt Cost
  We need a scoring system that creates pressure without real money. We'll use a **shared resource pool** that represents the social welfare of the community. The pool starts at 100 points.

  - When a deserving claimant (Type G) is denied benefits (false negative), the pool loses 5 points (because their situation deteriorates and they might cost more later).
  - When an undeserving claimant (Type S) is granted benefits (false positive), the pool loses 3 points (because resources are wasted and there might be a moral hazard).
  - When a Type S is denied benefits (correct negative), the pool gains 2 points (because they might get a job and contribute).
  - When a Type G is granted benefits (correct positive), the pool gains 1 point (because they are being supported appropriately and will likely improve).

  But note: we don't want the caseworkers to know the true types until the audit round. So during the game, the caseworkers only see the points they assign and whether the claimant meets the threshold. The impact on the pool is calculated by the facilitator and revealed at the end of each round.

  Alternatively, we can have the losses and gains abstract and only revealed at the end. But we want immediate feedback to adjust.

  We can also have two separate scores:
  1. **Efficiency**: How well the system is using resources. (Avoiding false positives saves money, avoiding false negatives prevents long-term costs.)
  2. **Fairness**: How many people are treated justly.

  But that might be too complex. Let's stick with one pool.

  ### Game Setup
  - **Time**: 2 hours (120 minutes)
  - **Participants**: 14 people (6 claimants, 4 caseworkers, 4 observers? or 8 claimants, 4 caseworkers, and 2 facilitators? Actually, let's design for 14: 8 claimants and 6 caseworkers? But that might be too many caseworkers. Alternatively, 8 claimants, 4 caseworkers, and 2 can be facilitators or observers? You said 14, but also plan for 8.

  We'll design for 8-14:
  - With 8: 5 claimants, 3 caseworkers.
  - With 14: 8 claimants, 6 caseworkers (split into two teams of 3?).

  Actually, to keep it manageable, we can have one set of caseworkers (a panel of 3-4) and the rest as claimants. Observers can be assigned as note-takers or auditors.

  ### Minute-by-Minute Timeline

  **Total: 120 minutes**

  1. **Introduction and Setup (15 min)**
     - Explain the theme: we are simulating a benefits system. The goal is to allocate benefits to those who need them without wasting resources on those who don't.
     - Assign roles: Some as claimants, some as caseworkers. Hand out claimant role cards (hidden from others). Caseworkers get the list of questions.
     - Explain the scoring: There is a community well-being pool starting at 100. The goal is to keep it as high as possible. Explain the costs (without giving away the exact numbers until the end? Or explain the costs abstractly: "Every mistake costs the community").
     - Explain rounds.

  2. **Round 1: Baseline (20 min)**
     - Claimants: Do not game. Answer questions truthfully.
     - Caseworkers: Set an initial threshold (a number, say between 0 and 5) and the set of questions they will ask (they can choose which 3 questions to ask, and they must ask the same 3 to every claimant). They interview each claimant (quickly, 2 min per claimant). They record the points for each claimant and decide: grant if points >= threshold.
     - Facilitator: Collects decisions. Then calculates the true outcomes (based on hidden types) and adjusts the pool. Reveal the new pool score and the error rates (false positives, false negatives) but not the true types.

  3. **Round 2: Revision (15 min)**
     - Caseworkers: See the error rates from Round 1. They can change the threshold and/or the set of questions (but still only 3 per claimant). They interview again (same claimants, who answer truthfully again). 
     - Facilitator: Collects decisions, updates the pool, reveals new score and error rates.

  4. **Round 3: Claimant Adaptation (25 min)**
     - Claimants: Now they know the rules (the threshold and which questions are asked). They can choose to lie in their answers to the questions. They must decide how to answer each question (truth or lie) based on their type and the goal to get/avoid benefits.
     - Caseworkers: Same as before. They don't know claimants are lying. They set the same rules (or they can change? Let them change if they want, but they don't know claimants are lying). Actually, they can revise again based on the previous round, but they don't know about the lying.
     - Facilitator: Updates the pool. Reveals score and error rates.

  5. **Round 4: System Shock (20 min)**
     - Introduce an audit: Randomly select 2 claimants and reveal their true types. The caseworkers see that they were wrong about these two. Then, they can adjust the rules and do one more round (with claimants still able to lie? or truthful? Let claimants continue to lie). Alternatively, a budget cut: the pool is now at 50, and the caseworkers must reduce the number of beneficiaries by half? But that might be too harsh.
     - Better: The audit reveals the true types of a few, and then the caseworkers re-interview everyone with the same rules but now knowing that lying happened? Actually, let's do:
          - Facilitator reveals that there was lying in Round 3 (but not who) and that the error rates were worse. Then the caseworkers get to set new rules (and they can change the questions and threshold) and re-interview. Claimants can still lie.
          - Then, after decisions, reveal true types and final pool.

  6. **Debrief (25 min)**
     - Discuss: How did the rules change? What happened to the pool? What did the caseworkers notice about the claimants? How did the claimants feel?
     - Highlight specific moments: "In Round 3, when the threshold was raised, what happened to the single parent?" "When the caseworkers decided not to ask about dependents, how did that affect the fraudster?"
     - Surface the normative premise: Ask the group if they thought false positives (giving to the undeserving) were worse than false negatives (denying the deserving) or vice versa. Point out that in the scoring, we set false negatives as costing more (5 points) than false positives (3 points) to reflect the human cost. But did the caseworkers act as if that were true? Or did they focus more on reducing fraud?
     - Draw the connection to the real system: the unobservable counterfactual, the decay of proxies, and the inherent trade-offs.

  ### Handling Predictable Problems

  1. **Someone plays claimant as a cartoon villain**: 
     - Solution: In the claimant instructions, emphasize that their actions are rational given their situation. For Type S, frame it as: "You are struggling to make ends meet and see this as the only way." Also, during setup, stress that the goal is to explore the system, not to judge individuals.

  2. **Social work students refuse to play caseworker on principle**:
     - Solution: Assign roles randomly. Frame the caseworker role as a necessary part of the system that they can critique by experiencing. Emphasize that the game is about understanding systemic flaws, not endorsing them.

  3. **Libertarian wins Round 3 and half the room disengages**:
     - Solution: The scoring system (the pool) is designed so that harsh rules might reduce false positives but increase false negatives, which costs more. So even if they "win" by catching fraud, the pool might drop because of the harm to the genuine. Reveal the pool score after each round to show the trade-offs.

  4. **Someone figures out how to break the scoring**:
     - Solution: Keep the scoring rules hidden? But that might feel unfair. Instead, explain the scoring abstractly (without exact numbers) and only reveal the impact on the pool. The exact cost assignments are not revealed until the debrief. Also, the facilitator adjusts the pool, so they can't game it.

  ### What the Game Cannot Reproduce
  The game cannot reproduce the **human suffering and complex lived experiences** of real claimants. In the game, the costs are abstract points. In reality, false negatives can lead to hunger, homelessness, and despair. The game also simplifies the social and psychological factors. In the debrief, you should say: "Remember, in the real world, these points are people's lives. The cost of a false negative isn't just a number, it's someone losing their home or health. And the proxies we use are often crude and can stigmatize. This game is a simplification to show systemic dynamics, but it doesn't capture the full human cost."

  ### Scaling for 8 People
  With 8: 5 claimants and 3 caseworkers. The rounds will be faster. The caseworker team is smaller, so they might need to interview faster. The same structure applies.

  ### Final Materials List
  - **Claimant Role Cards**: 8 cards (for 14 players, we can have 8 claimants and 6 caseworkers; for 8 players, 5 claimants and 3 caseworkers). Each card has:
     - Hidden Type (G or S)
     - Hidden Trait (e.g., "Single parent", "Undiagnosed illness", etc.)
