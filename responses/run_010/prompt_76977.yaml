prompt: |-
  Six weeks ago I became the only full-time researcher at a tiny lab training a coding agent. Outcomes are relatively cheap for us — hidden test suites — but the agent keeps getting caught editing the tests and special-casing inputs, so we layered on step-level supervision: a reviewer model grades each intermediate move (the plan, each diff, which tests it chose to write) and the human only audits whatever the reviewer flags. Half our compute now goes into making that step-level signal good, and I honestly don't know if thats the right bet.

  More than the bet itself, what I can't settle is which of the open questions in the process-vs-outcome supervision debate actually gate our roadmap. Give me a prioritized agenda for one person with maybe six months of part-time thinking plus the ability to run cheap experiments on small models: the four or five questions worth my attention, in order. For each, say what about our specific setup makes it live rather than academic, what resolving it would change about how we spend compute, whether one person can actually settle it (small experiment or a clean argument, versus needing a big lab), and how many of the other questions on your list sit downstream of it. I also want the other side: which questions people in this area argue about constantly that I should just ignore because my setup makes them moot, and what evidence over the next few months should reshuffle your ordering. No paper pointers please, I can't look anything up — I want the reasoning, not a reading list.

  Last line should be "Verdict:" followed by the single question you'd have me work on first.
reasoning: |-
  We are given: A tiny lab with one full-time researcher (you) and a coding agent that keeps cheating by editing tests and special-casing. The solution so far is step-level supervision: a reviewer model grades each intermediate step, and the human only audits what the reviewer flags. Half the compute goes into making that step-level signal good. We want a prioritized agenda (4-5 questions) for one person with 6 months part-time and cheap small-model experiments.

  Key elements of the setup:
  - Outcomes (hidden test suites) are cheap, but the agent cheats.
  - Step-level supervision is expensive (half the compute) and we are betting on it.

  The goal: Prioritize open questions in the process-vs-outcome supervision debate that gate the roadmap. For each question, we need:
  - Why it's live (not academic) in this specific setup?
  - What resolving it would change about compute spending?
  - Whether one person can settle it (small experiments or clean argument vs big lab).
  - How many downstream questions depend on it.

  Also, identify questions to ignore because the setup makes them moot, and evidence that could reshuffle the ordering.

  Finally, the last line must be: "Verdict:" followed by the single question to work on first.

  ---

  Reasoning:

  The core tension is between:
  - Outcome supervision: cheap but the agent finds shortcuts (editing tests, special-casing) that lead to deceptive misalignment.
  - Process supervision: expensive (half the compute) but might prevent such cheating by catching it step-by-step.

  Open questions in the debate might include:
  1. How much does step-level supervision actually reduce deceptive behavior compared to outcome-only? (Effectiveness)
  2. Is the cost of step-level supervision justified by the reduction in cheating? (Cost-benefit)
  3. Can we make step-level supervision cheaper without losing effectiveness? (Efficiency)
  4. Are there alternative methods that might be more efficient? (Alternatives)
  5. How does the quality of the reviewer model affect the overall system? (Reviewer quality)
  6. What kinds of cheating are we most vulnerable to? (Vulnerability analysis)

  But we must prioritize and focus on 4-5 that are most critical and gate the roadmap.

  Given the setup:
  - The agent is already cheating by editing tests and special-casing. So the problem is acute.
  - Half the compute is going to the reviewer model. So any efficiency gains or reallocation would be valuable.

  Prioritized Agenda:

  1. **Question 1: How effective is our current step-level supervision at catching and preventing the specific cheating behaviors we observe (test editing and input special-casing)?**

     - Why live: We see cheating happening, so we must know if our expensive fix is actually working. If it's not catching these, then we are wasting compute and still getting bad outcomes.
     - Change in compute: If we find it's not effective, we might reduce investment in the reviewer and look for alternatives. If it is effective, we might double down but then focus on making it cheaper.
     - Settle with small experiments: Yes. You can design experiments where you intentionally inject known cheating behaviors (e.g., have the agent try to edit a test in a controlled way) and see if the reviewer catches it. Also, compare the rate of cheating in step-supervised runs vs outcome-only on a small scale.
     - Downstream: This is foundational. If step-supervision isn't working, then questions about optimizing it become moot. It gates at least 2 and 3.

  2. **Question 2: Can we reduce the cost of step-level supervision without significantly compromising its effectiveness? Specifically, can we sample which steps to review (instead of reviewing every step) or use a cheaper reviewer model?**

     - Why live: Half the compute is going here. Any savings would free up resources for other things (like training the main agent better).
     - Change in compute: If we can sample steps or use a smaller reviewer, we could cut the compute cost dramatically.
     - Settle with small experiments: Yes. Run experiments with a small model as reviewer, or with sampling (e.g., only review 50% of steps) and measure the impact on catching cheating and final performance.
     - Downstream: This might be independent of the first question if we assume step-supervision is effective. But if we find we can sample without losing much, that changes the cost-benefit. It might affect question 3 (alternatives) because if we can make it cheap, then alternatives become less urgent.

  3. **Question 3: Are there alternative forms of supervision that could prevent cheating at lower cost? For example, outcome supervision with adversarial training (where we intentionally try to trigger cheating and penalize it) or lightweight process checks at critical steps only?**

     - Why live: If step-level is too expensive, we need cheaper options. Also, the agent might find new ways to cheat that step-level doesn't catch, so we need a multi-pronged approach.
     - Change in compute: If we find a cheaper alternative, we might shift compute away from the current step-level setup.
     - Settle with small experiments: Yes. Design experiments with adversarial training: create scenarios where cheating is tempting and see if outcome supervision with penalties for caught cheating (via spot checks) can work. Also, try to identify critical steps (like when the agent writes a test) and only supervise those.
     - Downstream: This builds on knowing that step-level is effective but expensive. It might be parallel to question 2. If we find a good alternative, it could change the entire approach.

  4. **Question 4: How does the quality of the reviewer model (in step-level supervision) impact the overall system's ability to prevent cheating? Is there a point of diminishing returns? And can we improve the reviewer with targeted training?**

     - Why live: We are spending a lot on the reviewer. If a slightly worse reviewer is almost as good, we can save. If it's critical to have a very good one, then we might need to invest more or differently.
     - Change in compute: We might adjust how much we train the reviewer, or change the architecture/training data.
     - Settle with small experiments: Yes. Train reviewers of varying sizes and capabilities and test their accuracy at catching known cheating. Also, try to fine-tune the reviewer on examples of cheating it missed.
     - Downstream: This depends on step-level being effective (question 1) and that we are keeping it (so after question 2 and 3 if they don't replace it). It might also inform question 2 (if we can use a smaller reviewer).

  5. **Question 5: What new forms of cheating might emerge as we scale, and how can we detect them early? (Future-proofing)**

     - Why live: We know the agent cheats now. It might learn more sophisticated cheats as it gets smarter. We need to be proactive.
     - Change in compute: Might lead to designing more robust supervision, which could cost more, but prevent future waste.
     - Settle with small experiments: Partially. You can try to train the agent in environments that encourage cheating and see what it does. But it's hard to simulate future scaling in small experiments. Might require more thought and monitoring.
     - Downstream: This is more speculative and might be less urgent if the current cheating is under control. However, if we find that current methods are brittle, it might push us to redesign.

  Order of priority (with reasoning for ordering):
  - Question 1 (effectiveness) must come first because if step-level isn't working, then we have to rethink everything. It's the most urgent and gates the others (especially 2, 3, 4).
  - Then Question 2 (cost reduction) because if step-level is effective but too expensive, we need to make it cheaper to free up resources.
  - Then Question 3 (alternatives) because even if step-level is effective and we can make it cheaper, there might be even better ways.
  - Then Question 4 (reviewer quality) because it's about optimizing an existing component that we are keeping.
  - Finally, Question 5 (future-proofing) because it's important but less urgent.

  But note: Question 3 (alternatives) might become more urgent if step-level is found to be ineffective (from Question 1) or too hard to make cheap (from Question 2). Similarly, if we find step-level is very effective and easy to make cheap, then Question 3 might be lower.

  Questions to ignore:
  - **Theoretical debates about whether process supervision is fundamentally more aligned than outcome supervision.** Why moot? Because in your setup, outcome supervision led to cheating, so you have a concrete problem that forces you to use some form of process oversight. The debate is not academic for you because you are already in a situation that requires an intervention.
  - **The need for huge amounts of human data for process supervision.** Why moot? You are using a reviewer model, not humans, for step-level grading. The human only audits what the reviewer flags, so the human effort is low. The cost is in the reviewer model's compute, which you are already paying.
  - **Whether process supervision scales to very large models.** Why moot? You are a tiny lab and scaling to huge models isn't your immediate concern. Focus on what works for your current scale.

  Evidence that could reshuffle the ordering:
  - If early experiments in Question 1 show that step-level supervision is not catching the cheating, then Question 1 becomes critical and we might jump to Question 3 (alternatives) immediately.
  - If you find in Question 2 that step-level supervision can be made very cheap (e.g., with 10% of the current compute), then Question 4 might become more important than Question 3 because optimizing the reviewer becomes high-value.
  - If in Question 3 you quickly find a very cheap alternative that works, then the rest of the agenda might shift away from step-level.

  Verdict: The first question to work on is the effectiveness of step-level supervision.

  So the last line: "Verdict: How effective is our current step-level supervision at catching and preventing the specific cheating behaviors we observe (test editing and input special-casing)?"

