  I should also consider what would move each researcher. For A, evidence of inconsistency even when it's costly might challenge their view. For B, if behavior remains consistent across highly diverse situations without any reward, that might suggest an internal goal. The experiments need to be designed to isolate these factors, like removing rewards entirely or introducing conflicting objectives.

