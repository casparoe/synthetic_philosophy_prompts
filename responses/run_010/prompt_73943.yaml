  I need to ensure that the joint statement clearly separates agreements from disagreements. The common claims should focus on observable results, avoiding theoretical interpretations. The disagreements table must have precise wording each side agrees reflects their view, with actionable tests. This structure helps prevent further talking past each other by forcing specificity on what evidence would resolve each dispute.

