prompt: |-
  I'm helping my aunt sort out her late brother's estate while also sitting in a trusts and estates seminar this semester, and the exact same problem keeps showing up in both places in a way that's driving me crazy. In the estate: the will leaves his Martin guitar to my cousin, but he sold it eight or nine years before he died and the check from that sale is still sitting in the account. The lawyer says the cousin gets nothing, that the gift "adeemed," and then mentions almost in passing that in some states he'd get the proceeds instead. In the seminar, meanwhile, we're reading about cy pres, where a charitable trust whose purpose has become impossible doesn't die at all — the court just redirects the money to whatever purpose comes closest to the original one. The example we did was a trust created before the Civil War to build up anti-slavery sentiment, which after emancipation didn't lapse but got pointed at educating and supporting the newly freed people instead. Then the very next case is the opposite: a Georgia park left in trust by a senator for the exclusive use of white people, where after the courts said it could no longer be run that way, the state courts held the segregation was so bound up with the purpose that nothing else could count as near enough to it, so the whole trust failed and the land reverted to his heirs.

  Here's what I can't get straight. Same institution, arguably the same bench, and in one corner a thing can be swapped for something similar and the arrangement survives intact — we still call it the same trust, we still say we're carrying out the dead man's intent — while in the other corner, if the numerically identical item isn't sitting in the estate on the day of death, the gift is simply dead, no matter how much traceable cash is right there and no matter what everyone agrees he would have wanted. My roommate, who's a philosophy major, said there's a standing debate about the difference between something literally persisting through changed circumstances and there merely being a similar thing standing in for it, but neither of us could say which of the two the probate courts think they're doing, and honestly I suspect they've never decided. So: what theory of identity — of what makes a gift, a purpose, or a fund the same thing across time and across situations where it's been altered — do these doctrines actually presuppose? Which rival accounts do they quietly rule out? And is the system committed to both at once, or can one of them be explained some other way that doesn't involve identity at all?

  When you answer, please reconstruct the implicit view as carefully as you can and be strict about seperating what the practice really requires from what it merely fits comfortably with. I can already hear someone saying ademption has nothing to do with identity and everything to do with bright lines, evidence, and not making executors litigate a dead person's hypotheticals, and I want to know whether that deflationary story actually works or whether it smuggles an identity view back in the moment it says the proceeds don't count as the guitar. Flag the places where the practice is underdetermined too, where two or three different metaphysics would license exactly the same ruling — the park case looks like the interesting one to me, since "this purpose can't be approximated" might mean the purpose is genuinely gone, or might just be a claim about who gets to decide what counts as close enough, or about whether the wrongness of the original purpose is allowed to infect its substitutes. And end by telling me concretely what would have to change if you swapped the presupposed view for its rival: if specific bequests got the cy pres treatment, so the nearest substitute always goes to the beneficiary, or if charitable purposes got the ademption treatment, so an impossible purpose kills the trust and everything reverts to the heirs. What breaks, who loses, and what is it that courts would no longer be able to say? No citations or case names needed, I've got the casebook — I just want the reasoning laid out.
reasoning: |-
  Okay, this user is grappling with a fascinating tension between two legal doctrines—ademption and cy pres—that seem to handle change and identity in radically different ways. They're clearly deep in the weeds of both practical estate administration and theoretical legal philosophy, which is impressive. The guitar vs. anti-slavery trust comparison is brilliantly illustrative.  

  First, let's map the core contradiction they've spotted:  
  - Ademption (guitar scenario) annihilates the gift if the specific object is gone, even if proceeds remain. It's brutally literal.  
  - Cy pres (anti-slavery trust) treats purpose as elastic—when circumstances change, courts actively reshape the trust to preserve its "spirit."  

  The user’s roommate nailed it: this is fundamentally about persistence through change. But the law isn’t operating on a unified theory here; it’s applying context-specific rules with different underlying logics.  

  Breaking down the implicit metaphysics in each doctrine:  
  **Ademption’s worldview**:  
  - Identity = strict numerical identity of the *object*.  
  - The guitar isn’t just "a guitar"—it’s *that specific* Martin. Once sold, it ceases to exist as part of the estate.  
  - The cash from its sale? Legally inert matter, no longer "the guitar" by any stretch. Why? Because executors aren’t psychics. Letting them substitute invites chaos—endless litigation over "what the decedent would have wanted." Bright lines rule.  

  **Cy pres’s worldview**:  
  - Identity = the *abstract purpose* itself.  
  - The anti-slavery trust isn’t about pamphlets or meetings; it’s about "fighting oppression." That purpose persists even when tactics change.  
  - Courts act as stewards of intent, not slaves to literal wording. But crucially, they only do this for *charities*—where the public interest overrides rigid formalism.  

  Now, the Georgia park case is the killer counterexample. Why no cy pres there? Because the court deemed the racist purpose *inextricable* from the trust. If you surgically remove "whites-only," nothing meaningful remains—unlike replacing pamphlets with schools for freed people. This highlights cy pres’s limits: purpose must be salvageable *without its toxic core*.  

  Where the user’s deflationary theory ("it’s just bright lines!") falls short:  
  - Yes, ademption avoids subjective judgments—but notice *why* substitution feels intuitively wrong. If the cash were truly "the same" as the guitar, we wouldn’t need rules against substitution; we’d just hand over the cash. The doctrine implicitly denies identity across material transformation.  
  - Conversely, cy pres *requires* believing the purpose survives its original form—otherwise redirecting funds would be creating a *new* trust, not modifying an existing one.  

  **Hypothetical swap consequences**:  
  *If ademption applied to charities*:  
  → Every impossible purpose kills the trust. Heirs get windfalls (e.g., segregationist senator’s descendants reclaim parkland).  
  → Courts lose power to salvage socially useful aims. Chaos ensues as charities collapse over minor operational changes.  

  *If cy pres applied to specific bequests*:  
  → Executors become mind-readers. "He sold the guitar but meant for cousin to get *something*... maybe a ukulele? Or cash?"  
  → Endless lawsuits over "closest substitute." Estates bleed money on litigation. Beneficiaries fight over interpretations.  

  **The underdetermined zones**:  
  - The park case *could* have gone either way. Another court might’ve said: "Purpose was ‘recreation for Georgians’—segregation was just period-typical method." That’s not a metaphysical truth; it’s a judicial judgment about what aspects are essential.  
  - Similarly, if the guitar was sold but the decedent immediately bought an identical Martin, some courts might allow substitution via "identity of form" theories. Practice varies.  

  **Final take**: The system isn’t consistent because it’s not trying to be. Ademption protects estates from chaos; cy pres protects society from wasted charity. What looks like a philosophical inconsistency is really a pragmatic division of labor. But wow, does it make for a killer seminar discussion.
answer: |-
  You've pinpointed a profound tension in trust and estate law: the inconsistent treatment of "identity" across specific bequests and charitable purposes. The doctrines of ademption by extinction and *cy pres* rest on distinct, implicit theories of persistence, driven by practical and policy concerns rather than a unified metaphysical view. Here's the reconstructed reasoning, separating what the practice *requires* from what it *accommodates*, and the consequences of swapping doctrines.

  ---

  ### **1. The Implicit Theories of Identity**
  **A. Ademption by Extinction (Guitar Scenario):**  
  - **Core Theory:** *Strict Numerical Identity of the Object.*  
    - The gift is defined solely by the *physical object* (e.g., "this Martin guitar, serial #XYZ"). If that object no longer exists in the estate at death, the gift ceases to exist. Proceeds are irrelevant—they are not "the guitar" but generic estate assets.  
  - **What It Requires:**  
    - A bright-line, objective test: Is the specific item present? No inquiry into intent, substitutes, or proceeds.  
    - Rejects any theory of "substantial similarity" (e.g., same model guitar) or "functional equivalence" (e.g., cash from sale).  
  - **What It Rules Out:**  
    - **Intent-Persistence Theories:** Even if the testator intended the beneficiary to receive "a guitar" or "the sale proceeds," the gift fails.  
    - **Transformation Theories:** The guitar cannot "persist" as cash; identity is tied to the original material form.  
  - **Deflationary Justification:**  
    - Yes, bright-line rules avoid litigation over intent (e.g., "Would he have wanted the cousin to get the cash?"). But this *still smuggles in an identity view*: by treating proceeds as "not the guitar," it presumes identity is bound to the original object, not its value or functional role. The bright line is built *on* that presupposition.  

  **B. Cy Pres (Anti-Slavery Trust):**  
  - **Core Theory:** *Abstract Purpose Persistence.*  
    - The trust is defined by its *immutable purpose* (e.g., "oppose slavery"). Identity persists as long as the core purpose can be fulfilled in a modified form. The assets are merely tools to achieve it.  
  - **What It Requires:**  
    - A malleable, intent-focused test: Does a "similar" purpose exist that approximates the original goal?  
    - Courts act as stewards of the purpose’s "spirit," not its literal terms.  
  - **What It Rules Out:**  
    - **Literalist Theories:** The purpose isn’t tied to specific methods (e.g., pre-Civil War pamphlets).  
    - **Heir-Centric Defaults:** The trust doesn’t "die" if the purpose evolves; it transcends the testator’s literal words.  

  **C. Georgia Park Trust (Failed Cy Pres):**  
  - **Underdetermined Nuance:**  
    - Failure here isn’t purely about identity metaphysics. It’s a policy-laden judgment:  
      1. **Essentialism:** The racist restriction was deemed *constitutive* of the purpose (a park "for whites" ≠ a park "for all").  
      2. **Moral Taint:** Redirecting funds to an integrated park would violate public policy, so the purpose cannot be "approximated" without endorsing immorality.  
      3. **Judicial Authority:** Courts refuse to redefine a purpose when the original is inseparable from injustice.  
    - **Alternative Theories Allowed:** The same outcome fits:  
      - A purpose-identity view (segregation was essential → no "same" purpose exists).  
      - A delegation view (courts lack authority to "salvage" immoral purposes).  
      - A property-rights view (heirs regain assets if the condition fails).  

  ---

  ### **2. Swapping the Doctrines: What Breaks?**  
  **A. Applying Cy Pres to Specific Bequests (Guitar → Proceeds):**  
  - **Mechanism:** Courts give beneficiaries the "closest substitute" (e.g., sale proceeds, similar guitar).  
  - **What Breaks:**  
    - **Executor Burden:** Executors must litigate "closeness" (e.g., Is cash equivalent? Is a Fender guitar "close enough" to a Martin?).  
    - **Heir/Residuary Disadvantage:** Assets earmarked for others (e.g., residuary beneficiaries) shrink due to subjective substitutions.  
    - **Certainty Collapse:** Wills become unstable. Selling an item pre-death invites disputes over substitutes.  
    - **What Courts Couldn’t Say:** "The testator’s intent is fulfilled by the substitute." But intent evidence is often unreliable, forcing courts to impose arbitrary standards.  

  **B. Applying Ademption to Charitable Trusts (Impossible Purpose → Trust Fails):**  
  - **Mechanism:** If a charitable purpose becomes impossible, the trust ends; assets revert to heirs.  
  - **What Breaks:**  
    - **Charity/Public Loss:** Socially beneficial trusts dissolve over minor operational changes (e.g., a hospital trust failing if medical practices evolve).  
    - **Heir Windfalls:** Heirs inherit assets intended for the public good (e.g., the anti-slavery trust assets passing to a slaveholder’s descendants).  
    - **Rigidity:** Trusts couldn’t adapt to societal shifts (e.g., a "consumption sanatorium" trust couldn’t redirect to modern TB research).  
    - **What Courts Couldn’t Say:** "The purpose persists in modified form." They’d instead declare the purpose "dead," prioritizing heir rights over continuity.  

  ---

  ### **3. The System’s Inconsistent Commitments**  
  - **No Unified Theory:** Estates law prioritizes *certainty and finality* for specific bequests (favoring strict identity). Trusts law prioritizes *perpetuity and social utility* for charities (favoring purpose persistence).  
  - **Metaphysical Loophole:** Ademption rejects "same item" proxies (cash ≠ guitar) but *cy pres* embraces "same purpose" proxies (education ≈ anti-slavery work). The doctrines coexist because they serve different policy goals—not because they share a coherent view of identity.  
  - **Critical Underdetermination:**  
    - The Georgia case shows that "purpose identity" is a legal construct, not a metaphysical truth. One court could see a segregated park’s purpose as "recreation" (allowing integration); another as "racial exclusion" (requiring failure). The outcome hinges on judicial discretion and policy, not ontology.  

  ### **Conclusion**  
  The system is not committed to a single theory of identity but to **pragmatic priorities**: efficiency for estates, flexibility for charities. Ademption presupposes *objects are irreplaceable*; *cy pres* presupposes *purposes are adaptable*. Swapping them would destabilize estate administration or paralyze charitable trusts. The inconsistency persists because metaphysics is subordinated to function—when courts say the guitar "is gone" but the anti-slavery purpose "lives on," they are making policy choices, not ontological declarations. The unresolved tension is a feature, not a bug: it allows doctrines to serve divergent goals without reconciling their underlying philosophies.
