prompt: |-
  I've been trying to figure out whether the naturalistic study of religion actually has any bearing on whether religion is true, and I've been sorting cases by gut feel. Here's the pile, verdicts and all, and I want to know what principle they add up to.

  1. Kids posit invisible friends, and adults posit invisible agents, because we have a hair-trigger detector for agency and because mind-body dualism comes natural. Verdict: this counts against god-belief, but only softly. Same way that knowing about visual illusions doesn't make me distrust my eyes across the board — the machinery could be tuned to something real and just overshoot.

  2. Moralizing high gods: watchful, punishing, interested in how you treat strangers. Beliefs like that spread because they let big anonymous societies hold together, and here's the part that rattles me — a watching god does that job exactly as well whether he exists or not. Verdict: this is the strongest debunker in the pile, stronger than 1.

  3. Moral objectivity explained by reciprocity and kin selection — we feel that fairness is out there because tribes that felt it outcompeted tribes that didn't. Verdict: doesn't touch it. I'm a moral realist and I'm completely unbothered. But I cannot tell you why 2 bites and 3 doesn't, because those are the same shape of story. This is the pair I most need help with.

  4. The all-night rites and the fasting and the tithing: perfectly explicable as commitment signals that screen out free riders. Verdict: explains why I keep showing up, not whether the creed is true. Neutral.

  5. Afterlife belief out of death anxiety. Verdict: counts against, mildly — I keep reminding myself that a belief being comforting isn't a refutation, but I don't get to say that and then shrug off 2 either.

  6. Had I been born in Lahore I'd be a Muslim. Verdict: defeats my particular creed, doesn't touch theism, and it's a fact about me rather than about religion.

  7. The naturalist's own confidence is produced the same way — raised in a secular academic tribe, signalling to colleagues, existentially comfortable in a rich country. Verdict: in principle this should count exactly as much as 2 does. The fact that it doesn't feel that way to me is a mark against me, not against him.

  8. My belief in modus ponens is also culturally transmitted, and there's probably an adaptive story for it. Verdict: obviously not debunked, and I have no account of why.

  9. My professed God and my spontaneous God come apart. I say he knows everything at once; in practice I catch myself phrasing prayers as though he needs to be pointed at things, and I'm told this is general — under time pressure people answer from a much more limited god than the one they'd defend. Verdict: I don't know which belief the geneology is even aimed at, and that makes the whole enterprise shakier. But I don't feel it counts against truth at all.

  My tentative principle is: a causal story about a belief counts against it only if the belief would have stuck around just as well had it been false — only if the story never has to mention the truth anywhere. That gets me 2 and it gets me 4 and 9, which I like. But it also gets me 3, since cooperative norms would have spread whether or not moral facts exist, and I'm not willing to give up moral realism. And it goes strange on 8: I don't know how to evaluate whether we'd have kept modus ponens if it were false, since nothing would have worked without it.

  So: state the principle you think is actually in there, or two or three candidates, precisely, clause by clause, and tell me which case each clause is doing work for. Then say whether the clause that rescues 3 also rescues 8 and 2, or whether I can only save one of them. Run it on a case I didn't list — whether my political convictions being downstream of my class and my friends is a debunker by the same lights. And tell me straight whether I'd be better off with a fiddly principle that keeps all nine verdicts or a simple one that makes me eat one of them, and which one to eat. No reading lists or name-dropping, I'm not in a position to go look anything up.
reasoning: |-
  Hmm, the user is grappling with a deep philosophical question about whether naturalistic explanations of religious beliefs undermine their truth. They've categorized nine cases with personal verdicts and are seeking a unifying principle. Their tentative principle—that a causal story debunks only if the belief would persist even if false—works for some cases but conflicts with their moral realism (case 3) and logic (case 8).

  The core tension is between cases 2 and 3. Both involve functional explanations: moralizing gods help societies cohere (case 2), and moral objectivity arises from evolutionary advantages (case 3). The user feels case 2 strongly debunks religion but case 3 doesn't touch moral realism. Why the asymmetry?

  Their stated principle—truth-irrelevant persistence—would actually debunk both, which the user rejects for morality. This suggests their intuition relies on something else: perhaps *domain-specific* standards. For morality, they implicitly require the explanation to rule out the *possibility* of truth, whereas for religion (case 2), mere functional adequacy suffices to cast doubt. But this is inconsistent.

  The user also struggles with case 7 (naturalism's origins) and case 8 (modus ponens). They sense their own biases but can't extend the same skepticism to logic. This points to another hidden criterion: *domain immunity*. We exempt logic/math because their truth seems necessary for *any* reasoning, including debunking arguments. Religion lacks this immunity.

  For case 6 (geographic contingency), they correctly note it only debunks specific creeds, not theism generally. This hints that explanations targeting *content-details* (e.g., specific rituals or doctrines) feel less threatening than those targeting the *core function* (e.g., a watchdog god enabling social cohesion). Hence case 4 (rituals) feels neutral.

  Their discomfort with case 9 (professed vs. spontaneous god-concepts) reveals a third layer: *explanatory target ambiguity*. When a belief isn't clearly defined (e.g., which version of "God" is being explained?), debunking arguments feel shaky. But this doesn't make them false—just messy.

  **Proposed principles**:  
  1. **Functional substitution criterion**: An explanation debunks when it shows the belief's function could be fulfilled *equally well* by a false belief. This nails case 2 (god-as-social-glue works identically whether real or not) and case 5 (afterlife comforts regardless of truth). It *doesn't* debunk case 3 because moral facts (if real) would *enhance* cooperation beyond what mere belief could achieve—so truth adds functional value.  

  2. **Domain immunity**: Beliefs necessary for the debunking framework itself (like logic/case 8) get a pass—questioning them would undermine the entire argument. This doesn't rescue case 2, as religion isn't logically necessary.  

  3. **Specificity scope**: Explanations targeting belief *formation processes* (e.g., agency detection/case 1) are weak debunkers; those targeting *content-specific functions* (case 2) are stronger. Case 6 falls here—it only debunks creedal specifics.  

  **Trade-offs**: To save all nine verdicts, we need the fiddly trio above. If forced to simplify, sacrifice consistency on case 7: admit that naturalism *is* debunked by the same logic as case 2, but we accept it pragmatically because rejecting all functionally explained beliefs would paralyze thought.  

  **New case (political convictions)**: By the functional substitution criterion, if your political beliefs *only* function to signal tribal loyalty (e.g., "I support policy X because my friends do"), and would persist even if policies harmed society, that debunks them. But if the beliefs track truth (e.g., evidence shows policy X helps), the explanation doesn't substitute for truth—so no debunking.  

  **Verdict**: Opt for the slightly fiddly principles. They capture the asymmetry between cases 2 and 3 (truth enhances morality's function but not watchdog gods'), preserve logic (case 8) as foundational, and handle geographic/cultural contingencies (case 6) without overgeneralizing.
answer: |-
  Here's a precise dissection of the principles underlying your verdicts, based solely on your cases. Your intuition points to **three distinct criteria** working together, not one monolithic principle. They resolve your core tension between cases 2 and 3 while preserving your other verdicts.

  ### The Three Principles
  1. **Functional Independence from Truth (FIT)**:  
     *A causal explanation debunks belief B if B's social/psychological function is fulfilled identically whether B is true or false. The explanation shows B's persistence doesn't rely on its truth.*  
     - **Does the work for**: Case 2 (watchful god holds society together equally well regardless of existence), Case 4 (tithing signals commitment regardless of creedal truth), Case 5 (afterlife belief reduces anxiety whether true or not).  
     - **Why 3 is spared**: Moral objectivity isn't *just* about promoting cooperation (its function). If moral facts *exist*, they provide a *truth-based reason* for cooperation that mere belief doesn't. The function isn't independent of truth—truth would *enhance* it. Your realism assumes truth adds something functional.  

  2. **Cognitive Necessity Exemption (CNE)**:  
     *Beliefs that are precondition for any reasoning (including debunking) cannot be fully debunked by their own genealogy.*  
     - **Does the work for**: Case 8 (modus ponens). You can't coherently argue against logic using logic—it’s presupposed in the debunking attempt. Case 7 (naturalism) is *not* exempt: naturalism isn’t necessary for reasoning (people reason without it), so FIT applies to it equally as to case 2. Your discomfort there is warranted but unresolved (more below).  

  3. **Specificity of Target (ST)**:  
     *Genealogies debunk only the specific belief they explain. If the explanation targets a vague or unstable version of B, it undermines that version but not necessarily B's core.*  
     - **Does the work for**: Case 1 (agency detection: explains belief in *some* agents, not God specifically), Case 6 (explains *which* creed, not theism itself), Case 9 (explains spontaneous "limited god" intuitions, not the professed omniscient God). Case 5 is weakened: it targets afterlife belief generally, not a specific formulation.  

  ### How This Resolves Your Cases
  - **Case 2 vs. Case 3 (your core conflict)**:  
    - Case 2 (gods) is debunked by **FIT**: Society-cohesion works identically with a false belief.  
    - Case 3 (morality) is spared because **FIT doesn't apply**: If moral facts exist, they provide truth-based advantages (e.g., better coordination) beyond mere belief. Your realism assumes truth isn't functionally redundant.  
  - **Case 8 (modus ponens)**: Protected by **CNE**. Even if logic has an evolutionary origin, rejecting it would sabotage *all* reasoning, including debunking arguments.  
  - **Case 7 (naturalism)**: **FIT applies** (your belief functions as tribal signaling whether true or not), so it *should* debunk naturalism as much as case 2 debunks god-belief. Your intuition that it "should count as much as 2" is correct—your reluctance here is inconsistency.  
  - **Case 5 (afterlife)**: Debunked by **FIT** (anxiety reduction works with false belief), but mildly because **ST** applies—it targets a broad belief, not specifics.  
  - **Case 4 and 9**: Handled cleanly by **FIT** + **ST**.  

  ### Test on a New Case: Political Convictions  
  - **Scenario**: Your political beliefs are downstream of class/friends.  
  - **Analysis by principles**:  
    - **FIT**: If your beliefs *only* function to signal group loyalty (e.g., you’d hold them even if policies harmed your interests), it debunks them. If they track truth (e.g., evidence shows your policies work), no debunking.  
    - **ST**: Explains *which* beliefs you hold (e.g., "why socialist, not libertarian?"), not political engagement generally.  
    - **CNE**: Doesn’t apply (politics isn’t a reasoning prerequisite).  
  - **Verdict**: Weak-to-moderate debunker if **FIT** applies (beliefs persist regardless of truth), else neutral.  

  ### The Trade-off: Simple vs. Fiddly  
  - **Fiddly principle (all three criteria)**: Keeps all nine verdicts intact.  
  - **Simple principle (just FIT)**: Forces you to "eat" **case 3 or case 8**. You’d have to abandon moral realism (since cooperation spreads without moral facts) or accept that logic is debunked (which you won’t).  
  - **Recommendation**: **Stick with the fiddly principles**. They match your intuitions, resolve the 2/3 conflict, and expose a real flaw in case 7 (naturalism). The cost is accepting that case 7 *should* bite—your naturalism is as vulnerable as your theism to FIT. If you must simplify, **drop CNE**—but then you must defend why logic (case 8) isn’t debunked by FIT. *Better to keep CNE and confront the inconsistency in case 7.*  

  ### Straight Talk on Your Dilemma  
  Your verdicts are coherent except for **case 7**. Principles 1-3 explain why 2 bites and 3 doesn’t, protect 8, and handle the others. But case 7 is a blind spot: if FIT debunks god-belief (case 2), it equally debunks naturalism. Your "mark against me" admission is correct—**withholding FIT from naturalism is special pleading**. Embrace the fiddly principles, apply FIT consistently, and either:  
  - Accept that naturalism is debunked (but retain it pragmatically, as with senses), or  
  - Argue naturalism’s truth *does* add functional value (e.g., better prediction), exempting it from FIT.  

  The principles are in your judgments—you just need to own the implication for your tribe.
