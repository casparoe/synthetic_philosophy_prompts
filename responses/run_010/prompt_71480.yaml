prompt: |-
  I got stuck writing the 20-year retrospective for the small research nonprofit where I work, and now the whole office is in a fight I apparently have to referee. Our founder made one big dated call back in 2005 about coastal property insurance becoming effectively unobtainable in parts of the Gulf and Atlantic coasts by 2030. It didn't happen on schedule. It's sorta happening now, several years late, through pretty much the mechanism he described in the original piece. Half the staff says "he was right, just early." The other half says that's exactly what a doomer says when the doomsday doesn't show, and if we let it slide in the report we aren't a research org anymore.

  The trouble is I don't think either side is being consistent, me included. Here are my honest verdicts and they're a mess:

  1. Malthus. The tendency he described is real, and for most of history it looks like it held; globally it stopped holding once yields took off. I want to say: not vindicated, but not "refuted" either, and calling him simply wrong is a catagory error.
  2. Wegener. Continents move, announced decades before anybody had a mechanism, and the driving force he offered was junk. I say he was right and the geologists who turned him down were wrong even though they were behaving perfectly reasonably.
  3. The Simon–Ehrlich wager. Ehrlich picked five metals — chromium, copper, nickel, tin, tungsten — put $200 of paper on each in 1980 against the same basket in 1990, and mailed Simon a check for $576.07 when all five fell in real terms. People have since pointed out that over other windows, and over longer stretches, Ehrlich's basket would have won. I still say he lost, and losing a dated, priced, agreed-in-advance bet is losing.
  4. One of those 1970s "we'll run out of X by 1995" forecasts where the actual story turned out to be that we just used X far more efficiently. Wrong, full stop, and the efficiency explanation is textbook post-hoc rescue.
  5. Our founder's insurance call. I want to say right-but-early and I want to say it loudly, and I'm aware how that looks sitting underneath 3 and 4.
  6. A colleague's forecast of a specific very-high-death pandemic by a specific year. Year came and went with nothing. Defense offered: the pressure was building, it just hadn't found its vector yet. I say that's a rescue and it scores as a miss. Structurally this is nearly identical to 5 and I can't defend treating them differently except by admitting I liked one guy's reasoning better.
  7. A forecast that came true on schedule and that I now think the forecaster deserved no credit for — he'd have been just as confident about three other outcomes, and theres a memo where he hedges roughly all four. I don't want to score that as a hit even though the world did what he said.

  What I need is a principle, or a small set of candidates, that I can actually put in the report — something about what had to be pinned down in advance, or how much of the theory had to get stretched afterwards, or what species of mistake was made — that lands on my verdicts in 1–7, or close to them. For each clause of the principle, tell me which case motivated it, because the staff will absolutely ask. Then tell me which of my verdicts the principle can't save and which is cheapest for me to give up; if I have to choose I'd rather lose 2 than lose 5 or 6, and I want to know what that costs.

  And run it on the case I've deliberately left undecided, which I suspect breaks whatever you come up with: a forecaster states a date in print, the date passes with nothing, the mechanism later shows up — but it turns out he'd quietly re-dated the call in an internal memo months *before* the original deadline, and nobody outside the org ever saw that memo. Do I score the printed date or the memo date? Does it matter that he wrote the memo when he still had something to lose by writing it, versus a memo that surfaces only after the deadline has already embarrassed him?
reasoning: |-
  Okay, the user is dealing with a real mess at their nonprofit. They need to evaluate past predictions for a 20-year retrospective, but the office is split. The main issue is the founder's 2005 prediction about coastal property insurance becoming unobtainable by 2030—it happened late, and now half the staff says "right but early," while the other half calls it a failed prediction. The user has listed several other historical and internal examples where predictions were either early, wrong, or right for the wrong reasons, and they're struggling to find consistent principles to judge them all fairly.

  First, I need to understand the core problem. The user wants a set of principles that can be applied consistently across all cases (1-7), including the undecided one about the memo. They also need to know which of their initial verdicts might need adjustment and the trade-offs involved. Their hidden needs might include maintaining the organization's credibility, resolving internal conflict, and preserving the founder's reputation without compromising research integrity.

  Looking at their examples, patterns emerge. Some predictions were right but early (founder's insurance), some were wrong due to unforeseen factors (Malthus, efficiency gains), and others had issues with methodology or honesty (pandemic prediction, hedging forecaster). The Simon-Ehrlich wager is tricky because it was a specific bet lost on the agreed terms, even though longer-term trends might have favored Ehrlich.

  The key principles should focus on testability, mechanism, and post-hoc adjustments. The user mentioned concepts like "pinned down in advance" and "species of mistake," so I'll build around that. The three proposed principles are:
  1. Testability: The prediction must have clear, measurable criteria agreed beforehand.
  2. Mechanism Integrity: The underlying theory shouldn't be drastically altered after the fact to fit the outcome.
  3. Credit Assignment: Accuracy alone isn't enough; the reasoning must be sound and specific.

  Applying these to each case:
  - Malthus: Not testable due to vague timelines, so it's a category error.
  - Wegener: Right on the core claim (continental drift), even though the mechanism was wrong. Mechanism matters less here because the core idea was revolutionary.
  - Simon-Ehrlich: Specific bet lost on the agreed terms; changing the timeline afterward is invalid.
  - 1970s forecast: Clearly wrong; efficiency gains weren't part of the original prediction.
  - Founder's insurance: Right but early. The mechanism happened as described, just delayed.
  - Pandemic prediction: Missed deadline with no new evidence; post-hoc excuse.
  - Hedging forecaster: Doesn't deserve credit due to lack of conviction.

  The undecided case with the memo is tough. If the re-dating happened before the deadline and wasn't public, it shows awareness but lacks transparency. The principle would treat the public prediction as the valid one, so it's a miss, but the re-dating adds nuance.

  Trade-offs: The user might need to adjust verdicts on Malthus (accepting it's untestable) and Wegener (prioritizing core claim over mechanism). Giving up Wegener's verdict costs little since he's historically vindicated, but keeping the founder's prediction as "right but early" is crucial for their case.

  Underlying all this is the need to balance scientific rigor with organizational politics. The principles must uphold research integrity while acknowledging that some early warnings are valuable even if timing is off. The memo case highlights the importance of transparency—secret changes undermine credibility. The user's deeper need is likely to navigate the internal conflict without alienating either side, using objective criteria to justify their stance.
answer: |-
  Here’s a set of principles designed to resolve your cases, grounded in forecast evaluation best practices and scientific epistemology. Each clause addresses a specific flaw in retrospective scoring, using your cases as motivation:

  ---

  ### **The Three Principles**
  1. **The Testability Clause**  
     *Motivated by: Malthus (Case 1), Simon-Ehrlich (Case 3)*  
     *"A prediction is only meaningfully evaluable if it specifies testable conditions (what evidence would falsify it?) and a timeframe for testing. Vague or open-ended claims are not forecasts but scenarios."*  
     - Malthus: No timeframe or clear falsification threshold → untestable → category error (your verdict upheld).  
     - Simon-Ehrlich: Specific basket, price, date → testable → Ehrlich lost (your verdict upheld).  

  2. **The Mechanism Integrity Clause**  
     *Motivated by: Wegener (Case 2), 1970s Resource Forecast (Case 4)*  
     *"Credit requires the core causal mechanism to be correct. If post-hoc adjustments fundamentally alter the logic (e.g., ignoring failed assumptions), it’s a miss. Minor timing errors with intact mechanisms are 'right but early.'"*  
     - Wegener: Core mechanism (continental drift) correct → right, despite flawed sub-mechanisms (your verdict upheld).  
     - 1970s Forecast: Efficiency gains invalidated the scarcity mechanism → wrong (your verdict upheld).  

  3. **The Credit Assignment Clause**  
     *Motivated by: Hedging Forecaster (Case 7), Pandemic Prediction (Case 6)*  
     *"A 'hit' requires both accuracy and justified confidence. If the outcome was unsurprising (e.g., obvious trends) or the forecaster hedged, credit is reduced or voided."*  
     - Hedging Forecaster: Hit by luck, not rigor → no credit (your verdict upheld).  
     - Pandemic Prediction: Specific year + no new evidence for delay → miss (your verdict upheld).  

  ---

  ### **Applying Principles to Your Cases**
  - **Founder’s Insurance (Case 5):**  
    **Verdict: Right but early.**  
    *Why:* Mechanism identical, timing off by years (not decades). Testable conditions (insurance unobtainability) eventually met. Fails only Testability if we demand perfect timing (unrealistic for complex systems).  

  - **Colleague’s Pandemic (Case 6):**  
    **Verdict: Miss.**  
    *Why:* Specific year passed with no event → fails Testability. "Pressure building" alters the mechanism (adds vague auxiliary assumptions) → violates Mechanism Integrity.  

  - **Undecided Case (Secret Memo):**  
    **Verdict: Miss (public claim), with footnote.**  
    *Why:*  
    - Publicly stated date binds the Testability Clause → deadline passed → miss.  
    - The *existence* of the pre-deadline memo marginally improves credibility (shows internal accountability) but doesn’t salvage the public prediction.  
    - **Key nuance:** If the memo was pre-deadline *and* contained new evidence justifying delay, it might partially redeem Mechanism Integrity. But silent redating is damage control, not science.  

  ---

  ### **Trade-offs: What You Must Give Up**
  - **Cheapest to Surrender: Wegener (Case 2)**  
    Your verdict (he was "right") is emotionally satisfying but scientifically imperfect. Mechanism matters: if his *specific force* (e.g., centrifugal drift) had been essential to the theory, he’d be wrong. Cost: Admitting geologists weren’t "wrong" to reject him without evidence. **Principle:** Surrendering costs little—Wegener is already vindicated by history.  

  - **Hardest to Keep: Your Pandemic Verdict (Case 6)**  
    Structurally identical to Founder’s prediction? Not quite:  
    - Founder: Mechanism worked, timing error small (~5-10% of forecast horizon).  
    - Pandemic: Specific year failed, no *new* data supported delay.  
    **Cost if changed:** Undermines Testability Clause → opens door to endless excuses.  

  - **Must Keep: Founder’s Prediction (Case 5)**  
    Abandoning this guts the report’s purpose. Principle 2 (Mechanism Integrity) protects it.  

  ---

  ### **The Final Principle-Set for Your Report**
  > **Evaluating Forecasts:**  
  > 1. **Testability:** Did the prediction specify *what* and *when*? If not, it’s not a forecast.  
  > 2. **Mechanism Integrity:** Was the core logic correct? If timing fails but the cause unfolds as described, it’s "right but early." If the mechanism is abandoned or stretched, it’s wrong.  
  > 3. **Credit Worthiness:** Did the forecaster commit? Hedging or lucky guesses earn no credit.  
  >   
  > *Applied to [Founder]'s 2005 warning: The mechanism (insurance collapse via climate risk) proved correct. The timing (2030) was off by years—not unusual for societal-scale predictions. Thus: right, but early.*

  ---

  ### **Why This Works for Your Office Fight**
  - **"Right but early" camp:** Gets Mechanism Integrity (their core argument).  
  - **"Doomer rescue" camp:** Gets strict Testability + Credit rules (blocks slippery slopes).  
  - **Your integrity:** Principles are extracted from *your* cases—no external bias.  

  This turns a subjective feud into a methodological framework. For the memo case, calling the public prediction a "miss" while noting the private correction in a footnote satisfies both rigor and nuance.
