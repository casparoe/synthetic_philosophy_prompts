  ### Decision Tree for Behavioral Regularities

  **Tree Specifications**  
  - 12 decision nodes, 7 terminal leaves.  
  - Nodes prioritize observable behavior; mental state questions (Nodes 8–12) are deferred until necessary.  
  - **Rationale for mental state order break**: Observable traits (e.g., sanctions, physical consequences) often preclude needing mental states. When required, mental states resolve ambiguities (e.g., distinguishing conventions from habits).  

  ---

  #### Decision Tree  
  1. **Does the regularity create a new status, possibility, or entity that would not exist without it?**  
     - *Yes* → **Leaf E: Constitutive rule** (e.g., a knot makes a rope "retired").  
     - *No* → Node 2.  

  2. **When an established member departs, do others visibly sanction them (e.g., disapproval, exclusion)?**  
     - *Yes* → Node 3.  
     - *No* → Node 4.  

  3. **Is a newcomer explicitly corrected if they violate the regularity?**  
     - *Yes* → **Leaf D: Norm with sanctions** (enforced by teaching and punishment).  
     - *No* → Node 8.  

  4. **Does violating the regularity cause immediate physical consequences (e.g., resource depletion, danger)?**  
     - *Yes* → Node 5.  
     - *No* → Node 6.  

  5. **Does the regularity prevent a tangible bad outcome (e.g., conflict, inefficiency)?**  
     - *Yes* → Node 9.  
     - *No* → Node 6.  

  6. **Can members describe an alternative way to act that would work?**  
     - *Yes* → Node 10.  
     - *No* → Node 11.  

  7. **Would the regularity collapse if mutual expectations broke down (e.g., a crisis disrupting trust)?**  
     - *Yes* → Node 12.  
     - *No* → **Leaf F: Plain habit/custom** (no normativity).  

  8. **[Mental] Is the regularity common knowledge?**  
     - *Yes* → **Leaf D: Norm with sanctions** (implicitly enforced).  
     - *No* → **Unnamed: Enforced regularity without common knowledge**.  

  9. **[Mental] Does the regularity solve a coordination problem?**  
     - *Yes* → Node 12.  
     - *No* → **Leaf F: Plain habit/custom**.  

  10. **[Mental] Is the regularity common knowledge?**  
      - *Yes* → Node 12.  
      - *No* → Node 11.  

  11. **[Mental] Would the pattern survive if everyone stopped believing others follow it?**  
      - *Yes* → **Leaf F: Plain habit/custom**.  
      - *No* → **Leaf C: Descriptive norm** (Bicchieri).  

  12. **[Mental] Are there other equally effective ways to achieve the same outcome?**  
      - *Yes* → **Leaf A: Lewisian convention**.  
      - *No* → **Unnamed: Unique coordination solution**.  

  ---

  #### Terminal Leaves and Departure Predictions  
  | Leaf                                  | Prediction if Departed                                                                 | Standard Name                     |  
  |---------------------------------------|----------------------------------------------------------------------------------------|-----------------------------------|  
  | **A: Lewisian convention**            | Mild irritation; repair efforts (e.g., re-coordination).                               | Lewisian convention              |  
  | **B: Evolutionary signaling pattern** | Breakdown in correlated behavior; confusion or adaptation (no sanction).               | Evolutionary signaling model     |  
  | **C: Descriptive norm**               | Surprise or confusion; no sanction, but potential behavioral adjustment.               | Descriptive norm (Bicchieri)     |  
  | **D: Norm with sanctions**            | Sanction: disapproval, exclusion, or punishment.                                       | Norm with sanctions              |  
  | **E: Constitutive rule**              | Act not recognized; status void (e.g., rope "not retired"); possible sanction.         | Constitutive rule                |  
  | **F: Plain habit/custom**             | Indifference; no reaction.                                                             | Habit/custom                     |  
  | **Unnamed**                           | Context-dependent (e.g., sanction without common knowledge → confusion + enforcement). | N/A                              |  

  **Indistinguishable Pairs**  
  - **Lewisian convention (A) vs. Descriptive norm (C)**: Both predict no sanction and collapse without mutual expectations.  
    - *Separator*: Ask Node 12 (arbitrary alternatives). Conventions require arbitrariness; descriptive norms do not.  
  - **Norm with sanctions (D) vs. Constitutive rule (E)**: Constitutive rules always create new statuses (Node 1). If unclear, Node 1 is decisive.  

  ---

  #### Unoccupied Cells of the Space  
  | Combination                                      | Reason Unoccupied                          |  
  |--------------------------------------------------|--------------------------------------------|  
  | Full common knowledge + no arbitrary alternative | Unattractive: Rarely stable without alternatives (e.g., unique solutions lack arbitrariness but need no alternatives). |  
  | Sanctions + no coordination problem              | Coherent but rare: Sanctions usually address coordination (e.g., property norms). Not widely explored. |  
  | Constitutive rule + no member articulation       | Coherent: Occurs (e.g., climbing club knot). Occupied by **Leaf E** but not always articulated. |  
  | Physical consequence + no avoided bad outcome    | Incoherent: If a consequence exists, the regularity likely avoids it (or it’s coincidental). |  
  | Evolutionary signaling + sanctions               | Coherent: Possible (e.g., grain merchants), but our tree routes sanctions to **Leaf D/Unnamed**. Underexplored. |  

  ---

  #### Case Routing  
  **(a) Coffee Pot**  
  - Node 1: No (no new status) → Node 2.  
  - Node 2: No (no sanction) → Node 4.  
  - Node 4: Yes (physical consequence: empty pot) → Node 5.  
  - Node 5: Yes (avoids no coffee) → Node 9.  
  - Node 9: **[Mental]** Yes (solves coordination) → Node 12.  
  - Node 12: **[Mental]** Yes (alternatives exist) → **Leaf A: Lewisian convention**.  
  *Predicted departure reaction*: Irritation + repair (brewer replaces pot).  

  **(b) Grain Merchants**  
  - Node 1: No → Node 2.  
  - Node 2: Yes (sanction: refusal) → Node 3.  
  - Node 3: No (no correction; learned via partners) → Node 8.  
  - Node 8: **[Mental]** No (not common knowledge; no one knows full extent) → **Unnamed: Enforced regularity without common knowledge**.  
  *Predicted departure reaction*: Sanction (refusal) + confusion.  

  **(c) Online Game**  
  - Node 1: No → Node 2.  
  - Node 2: Yes (sanction: "insult") → Node 3.  
  - Node 3: Yes (newcomers learn via observation/correction) → **Leaf D: Norm with sanctions**.  
  *Predicted departure reaction*: Sanction (disapproval).  

  **(d) Climbing Club**  
  - Node 1: Yes (knot creates "retired" status) → **Leaf E: Constitutive rule**.  
  *Predicted departure reaction*: Status void (rope not retired) + sanction (exclusion).  

  --- 

  **Key**  
  - **Mental state nodes**: 8–12 (counterfactuals/interviews).  
  - **Observable nodes**: 1–7 (behavior/physical traits).  
  - **Unnamed leaves**: Result from coherent but underexplored combinations (e.g., enforced but non-common-knowledge patterns).  
  - **Tree resolves**: All cases to distinct leaves using observable evidence first, mental states only when essential.
