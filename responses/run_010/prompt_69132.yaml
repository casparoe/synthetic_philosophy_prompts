prompt: |-
  I have painted shop signs by hand for twenty-two years — grocery fronts, pub boards, gold-leaf inscription on a funeral director's window — and for eight of those years I have also taught a Saturday lettering class at the community art centre in my town. I left school at sixteen and everything I know about letters was put into my hands by an old signwriter, so I have no academic training and no vocabulary for the thing that has come to occupy most of my thinking. The thing is this. In the shop I can look at a trainee's layout sheet and know within a second that the 'a' is wrong, and I cannot say what is wrong with it in any form that helps him fix it. Meanwhile the same letter can be built as the two-storey printed shape you meet in a book, as a single bowl with a tail, as a leaning shape with a flat top, and every one of them is an 'a' past argument. So something is shared, but the shared thing is not a shape, and it does not seem to be a rule either, because every genuinely good new design I have ever made broke whatever rule I could have written down beforehand. Two winters ago I found a library book about researchers who tried to get a computer to invent new letterforms that would still belong to the style of an existing alphabet, and I sat up most of the night with it, because it was asking my question in a language I did not have. My own hunch, arrived at slowly and with no help, is that what is shared across all the 'a's is not an outline but a job: a mark is an 'a' when it is aimed at the 'a' slot in an alphabet and taken by a reader to fill it. I know perfectly well that this hunch is in trouble, and I know roughly where — I want the assignment to attack it rather than flatter it.

  The centre has started issuing certificates of completion, and the coordinator has asked every tutor to set one written take-home and to hand in a model answer and a marking scheme alongside it, because the marking is done by a retired schoolteacher who volunteers on Tuesday evenings and who knows nothing whatever about lettering. That is the real reason I am asking for what I am asking for. My students are hobbyists — a nurse, two retirees, a printer's apprentice, a woman who letterheads cards for a living — and between them they have read nothing philosophical and will read nothing before the assignment is due. So the question has to carry everything it needs inside itself, it has to be answerable in ninety minutes by an intelligent person with no background, and the marking scheme has to be usable by a marker who cannot tell a good argument about letters from a confident-sounding one. It should be worth twenty-five marks, the student's answer should be capped at eight hundred words, and there should be nothing to look up.

  Here is what I would like you to write. First, one essay question, built around five exhibits which I have drawn or collected myself and which you should describe in words inside the question rather than assume any picture accompanies it: (1) a row of six 'a's I drew in a line, beginning with the two-storey printed form and ending with the single-bowl handwritten form, each stage differing from its neighbour only slightly, so that at the fourth stage I honestly cannot tell you whether it is a two-storey 'a' that has lost its shoulder or a one-storey 'a' carrying a scar; (2) a photograph a friend brought back of a hand-painted shop sign from a town whose local lettering style is old-fashioned, in which the mark doing the work of 'a' is to my eye indistinguishable from our 'o', while their 'o' carries a small spur — the locals read the sign fluently and correctly, though none of them were ever taught a rule, and a tourist standing beside them reads 'o' where they read 'a'; (3) a bakery sign I painted in which a single closed round shape does double duty, serving as the 'o' at the end of the first word and the 'a' at the beginning of the second, the two words running together so that the identical mark belongs to both; (4) a card by a first-year trainee who drew the mark as an 'a', can point to the standard he was copying, and means it sincerely, but which everyone in the shop — me included — reads at a glance as a 'd', with no amount of explanation changing the first reading; and (5) a set of letterforms produced by a program that generates shapes nobody has used before, one of which, placed consistently in the 'a' position throughout a complete alphabet of its own making, resembles no 'a' I have ever seen. The question should require the student to put forward a single account of what makes a letterform the letter it is, run that account against all five exhibits, and state plainly what they would have to surrender wherever it fails.

  Second, a model answer of roughly six hundred words. It may coin or borrow a term or two if it explains them as it goes, but it must be the sort of answer one of my students could in principle have written in ninety minutes, not a lecture. Do not build it around my job-and-slot hunch unless that hunch actually survives the exhibits; if it does not survive, I would rather the model answer said so and showed what has to be added or given up.

  Third, the marking scheme, with the twenty-five marks distributed across named moves rather than across virtues like clarity or effort. For each band — excellent, good, adequate, poor — say what has to be present for a marker who cannot judge the subject matter herself to recognise it: which exhibits must be handled and how, what a unified account must do to count as unified, and what the student must concede where the account breaks. Then list the specific errors that should cost marks, described concretely enough to be spotted by a non-expert — for instance, resting everything on resemblance to a standard without ever saying whose standard it is or how it gets set; declaring that a letter is simply whatever the reader takes it to be and then having nothing left to say about the trainee's card or the tourist at the sign; announcing that there is no fact of the matter and treating that as a conclusion rather than a surrender; drawing a distinction between the letter and its shapes and then never using the distinction on any exhibit; and reaching for a famous example about resemblances running through a family, or about a game and what makes it a game, without ever bringing it down onto the six-stage row. Finally, tell me which of the five exhibits your average student will fumble, and what a fumble of that exhibit looks like on the page, so that the marker knows the difference between a student who skipped it and one who tried and failed.
reasoning: |-
  Hmm, the user is a sign painter with 22 years of experience who teaches lettering classes. They need help creating a written assignment for their students, complete with an essay question, model answer, and marking scheme. The challenge is philosophical but must be accessible to hobbyist students with no academic background.

  The core problem revolves around what defines a letterform - specifically what makes an 'a' an 'a' beyond its physical shape. The user's "job and slot" theory (that a mark becomes a letter based on its position in an alphabet and reader acceptance) needs testing against five exhibits they've described.

  Looking at the exhibits: 
  - Exhibit 1 shows a gradual transformation between two 'a' forms, creating ambiguity
  - Exhibit 2 demonstrates cultural interpretation differences in letter recognition
  - Exhibit 3 has a single shape functioning as two different letters contextually
  - Exhibit 4 reveals how intention clashes with perception
  - Exhibit 5 presents computer-generated novel forms accepted as letters through consistent positioning

  The assignment must make students propose a unified theory of letter identity that withstands all five cases, while being solvable in 90 minutes by non-academics. The marking scheme needs to be usable by a non-expert assessor.

  For the essay question, I'll phrase it to focus on the "job and slot" concept while incorporating all exhibits. The model answer should test the user's theory against the exhibits and show where it holds or fails - being honest about limitations. The marking scheme will allocate points for specific analytical moves rather than subjective qualities, with clear indicators for different performance levels.

  Key challenges include making the computer-generated letter discussion accessible and helping the non-expert marker identify when students properly handle Exhibit 1's ambiguity versus when they fumble it. I'll provide concrete examples of common errors to watch for in grading.
answer: |-
  Below is a complete assignment package tailored to your requirements: an essay question using your five exhibits (described verbally), a model answer testing your "job and slot" hunch against those exhibits, and a detailed marking scheme for a non-expert marker. The model answer concludes your hunch is *partly* right but needs significant qualification.

  ---

  ### **Essay Question (Distribute to Students)**

  **Question (Worth 25 Marks):**
  *What makes a particular shape on a page or sign function as the letter 'a'? Using the five exhibits described below, propose a single, unified account of how a mark becomes identified as a specific letter. Apply your account to each exhibit. For each one, state clearly whether your account explains it successfully. Where your account struggles or fails to explain an exhibit, state what you would need to give up or change in your theory to accommodate it.*

  **Exhibits (Described):**
  1.  **The Morphing 'a':** A sequence of six handwritten marks. The first is clearly a printed 'a' with two distinct chambers (like in a book). The sixth is clearly a single-bowl handwritten 'a'. Each mark changes only slightly from the one before it. Crucially, at the fourth mark, it is genuinely ambiguous whether it's a two-chamber 'a' that has lost its upper part or a one-chamber 'a' that has an unusual bump – it looks like it could be either.
  2.  **The Foreign Shop Sign:** A photograph of a hand-painted sign from a town with an old-fashioned local lettering style. The mark where an 'a' should be looks identical to what we would call an 'o'. Meanwhile, the mark where an 'o' should be looks like an 'o' but has a small spur attached. Locals read the sign correctly and fluently without hesitation. A visiting tourist, however, misreads the 'a'-position mark as an 'o'. Nobody in the town learned a specific rule for this style; they just absorbed it.
  3.  **The Bakery Sign Double-Duty:** A hand-painted bakery sign where the word "Dough" runs directly into the word "Artisans". The perfectly round, closed shape at the end of "Dough" (which is the 'o') is *the exact same mark* as the shape at the start of "Artisans" (which is the 'a'). One physical mark functions simultaneously as two different letters within the same sign.
  4.  **The Trainee's Mistaken 'a':** A practice card by a first-year trainee. The trainee intended to draw an 'a', can point to the standard example they were copying, and genuinely meant it to be an 'a'. However, everyone else in the workshop (including the instructor) instantly and consistently reads it as a 'd'. No amount of explanation or pointing to the standard changes this immediate perception.
  5.  **The Computer-Generated 'a':** A set of letterforms created by a computer program designed to invent new shapes that still 'belong' to a specific alphabet style. One shape, consistently used in the 'a' position throughout its own complete alphabet, looks utterly unlike any traditional 'a' shape (not two-storey, not single-bowl, no tail). It bears no obvious resemblance to familiar 'a's, yet within its own alphabet set, it functions as the 'a'.

  *Your answer should be no longer than 800 words. Focus on clarity and applying your single account to all five exhibits.*

  ---

  ### **Model Answer (Approx. 600 Words)**

  **What Makes an 'a'? Beyond Shape, But Not Beyond Rules**

  My account is that a mark functions as a specific letter (like 'a') when it occupies the *functional slot* for that letter within a *recognised system* used by a *community of readers*. It's not *just* the shape, nor *just* the reader's take, nor *just* the position. All three are needed, working together within a system.

  1.  **The Morphing 'a':** This exhibit shows shape alone is insufficient. The fourth mark is ambiguous *because* it sits between two familiar functional slots (two-storey 'a' and single-bowl 'a'). In isolation, its shape doesn't declare "I am *this* 'a'". Its identity depends heavily on the *system* it's placed in (e.g., is it part of a printed or cursive alphabet?) and the expectations of the reader familiar with that system. My account explains the ambiguity: the mark lacks a clear link to a *single*, dominant functional slot within a specific, recognised system at that point in the sequence. **Account Works.**
  2.  **The Foreign Shop Sign:** This challenges the idea of a universal shape. The mark in the 'a' slot isn't an 'a' shape *to the tourist* (who reads it as 'o'), but it *is* an 'a' *to the locals*. Why? Because the locals share a *recognised system* – their unique local lettering style. Within *that* system, the round shape *functions* as the 'a'. The spur on the 'o' is part of the system that distinguishes the slots. The tourist, lacking familiarity with *that specific system*, applies their own system (where a round shape is 'o') and misreads. My account explains this: identity depends on the system in use and the community reading it. The slot is defined by the system, not by a universal shape. **Account Works.**
  3.  **The Bakery Sign Double-Duty:** This seems problematic. One physical mark serves two slots ('o' and 'a') simultaneously. How can a single mark occupy two functional slots? The key is *context*. The mark functions as the 'o' slot *within the word "Dough"* and simultaneously as the 'a' slot *within the word "Artisans"*. The *recognised system* here includes the conventions of joined-up lettering and word separation. Readers fluent in that system understand the contextual shift. The mark's identity is *dual* because it sits at the junction point between two word-based slot assignments within the overall system. My account *stretches* but holds: the mark fulfils the functional slot for 'o' in one context and 'a' in another, within the larger system of the sign's lettering and language. **Account Works (with context).**
  4.  **The Trainee's Mistaken 'a':** This directly challenges intention and position. The mark is in an 'a' slot (presumably in a practice word), and the creator *intended* it for the 'a' slot using a recognised system (the standard he copied). Yet, the *community of readers* (the workshop) instantly assigns it to the 'd' slot within *their* understanding of the system. Intention and position alone fail. The reader community's recognition within the system overrides the creator's intent. My account explains this: the mark failed to successfully connect to the 'a' functional slot within the recognised system *as understood by the relevant reader community*. It was mis-assigned by the readers to the 'd' slot based on its shape *within that system*. **Account Works (emphasising reader community's role in recognising the slot).**
  5.  **The Computer-Generated 'a':** This tests the limits. The shape is novel, unlike any traditional 'a'. Yet, it consistently occupies the 'a' slot within its *own, new, computer-generated system*. Does it function as an 'a'? My account suggests *yes*, but only within the context of that *complete* system. Readers would need to learn *that specific system* to recognise the slot assignment. Its identity as 'a' comes entirely from its consistent position within its own defined set, not from resemblance. This shows the "slot" part is powerful, but relies entirely on a pre-defined system being established and learned. **Account Works (but highlights the need for a learned system).**

  **Surrenders and Changes:** My "job and slot within a recognised system" account handles all exhibits, but forces significant changes to a simple "job and slot" idea:
  1.  **Shape Matters (a bit):** While not defining, shape *is* the primary signal linking a mark to a slot within a system. Badly chosen shapes (Exhibit 4) cause misassignment.
  2.  **Intention Isn't Enough:** The creator's intent (Exhibit 4) is secondary to recognition by the reader community within the system.
  3.  **Context Can Override Shape:** Exhibit 3 shows context (word boundaries) can force a single shape into multiple slots.
  4.  **System is Paramount:** Exhibits 2 and 5 show that the "recognised system" is fundamental. Without agreement on the system (tourist vs. locals) or a complete system to learn (Exhibit 5), slot assignment fails. The "slot" only exists *within* a system.
  5.  **Community is Key:** Recognition by a community of readers (Exhibits 2 & 4) is crucial for the slot assignment to function practically.

  The core idea of "functional slot within a system" survives, but it must incorporate the critical roles of *shared reader recognition* and *context*, while acknowledging that shape is the usual (but not sole or defining) signal.

  ---

  ### **Marking Scheme (25 Marks)**

  **Award marks for the following concrete moves in the student's answer:**

  1.  **Proposes a Single Unified Account (5 Marks):**
      *   Clearly states *one* core idea about what makes a letter (e.g., shape, position, reader perception, system, function, or a combination).
      *   The account must attempt to cover *all* exhibits under *one* principle or framework. It cannot be a different explanation for each exhibit.

  2.  **Applies Account to Each Exhibit (15 Marks - 3 per Exhibit):**
      *   **Exhibit 1 (Morphing 'a'):** Must address the ambiguity. Does the account explain *why* the 4th mark is ambiguous? Award 3 marks for a clear application of the account to the ambiguity (e.g., "fails to clearly signal one slot", "sits between two known shapes in the system"). Award 1 mark for merely mentioning ambiguity without linking to the account. Award 0 if skipped or misdescribed.
      *   **Exhibit 2 (Foreign Sign):** Must address the conflicting readings (local vs. tourist). Does the account explain *why* both readings happen? Award 3 marks for linking the different readings to different systems/communities. Award 1 for just stating the conflict exists. Award 0 if skipped or misdescribed.
      *   **Exhibit 3 (Bakery Double-Duty):** Must address the single mark as two letters. Does the account explain *how* one mark can be two letters? Award 3 marks for invoking context (word, position, joining) within the system. Award 1 for just stating it's two letters. Award 0 if skipped or misdescribed.
      *   **Exhibit 4 (Trainee's 'a'):** Must address the conflict between intention and perception. Does the account explain *why* the reader perception overrides the intention? Award 3 marks for linking the misreading to the mark failing to signal the intended slot within the reader community's system. Award 1 for just stating the conflict exists. Award 0 if skipped or misdescribed.
      *   **Exhibit 5 (Computer 'a'):** Must address the novel shape functioning as 'a'. Does the account explain *how* a non-standard shape can be an 'a'? Award 3 marks for linking its identity to its consistent position within its own defined system. Award 1 for just stating it's different but used as 'a'. Award 0 if skipped or misdescribed.

  3.  **States Success/Failure & Necessary Surrenders (5 Marks):**
      *   For *each* exhibit, the student must clearly state if their account explains it successfully (1 mark per exhibit, total 5).
      *   **Crucially:** For *any* exhibit where the account struggles or fails, the student must state *what specific part of their initial account they need to give up or change* to accommodate it (e.g., "I have to give up that shape is the only factor" for Exhibit 2/3/5, or "I have to add that reader perception overrides intention" for Exhibit 4, or "I must allow context to define the slot" for Exhibit 3). Award marks *only* for concrete surrenders/changes named in relation to specific exhibit failures. Award 0 if they just say "it fails" without saying what they'd change, or if they claim universal success without justification. *(Note: A student might claim all successes but still need to *add* complexity – this counts as a necessary change/surrender of simplicity and should be articulated).*

  **Performance Bands (Guide for Marker):**

  *   **Excellent (21-25 Marks):** A single, clear account is proposed. All 5 exhibits are accurately described *and* the account is applied to each, explaining the key feature (ambiguity, conflict, double-duty, misreading, novelty). Success/failure is stated for each exhibit. Necessary surrenders/changes are explicitly and concretely named for *at least* the exhibits where the account is weak (likely 3, 4, or 5, depending on the account). Writing is clear.
  *   **Good (16-20 Marks):** A single account is proposed. All 5 exhibits are described reasonably well. The account is applied to most exhibits (4 or 5), though perhaps superficially for 1-2. Success/failure is stated for most exhibits. Some necessary surrenders/changes are named, but perhaps missing for 1-2 tricky exhibits or not fully concrete.
  *   **Adequate (11-15 Marks):** An account is proposed, though maybe vague. At least 4 exhibits are described and an attempt is made to apply the account to 3-4 of them. Success/failure is stated for most exhibits, but necessary surrenders are weak, vague, or missing for several. Might miss the application or surrender for the most complex exhibit(s). Might have minor misdescriptions.
  *   **Poor (0-10 Marks):** Lacks a clear single account. Several exhibits skipped or seriously misdescribed. Little attempt to apply the account systematically. Success/failure statements missing or illogical. Necessary surrenders missing or irrelevant. Confused writing. OR simply restates the exhibits without proposing an account.

  **Specific Errors to Penalise (Look for these concrete issues):**

  *   **(Minus 2-5 marks depending on severity)** No single unified account proposed. Different explanations given for different exhibits.
  *   **(Minus 1 per instance)** Skipping an exhibit entirely in the application section.
  *   **(Minus 1 per instance)** Seriously misdescribing an exhibit (e.g., saying Exhibit 3 has two different shapes, or saying the trainee in Exhibit 4 *meant* to draw a 'd').
  *   **(Minus 1 per instance)** Mentioning an exhibit but failing to apply the stated account to it (e.g., "Exhibit 2 shows cultural differences" but not saying *how* their account explains this).
  *   **(Minus 1 per instance)** Claiming an account works for an exhibit without explaining *how* (just "Yes, my account works here").
  *   **(Minus 2 per instance)** Claiming an account fails for an exhibit but failing to state *what specific part of the account needs to change*.
  *   **(Minus 3 marks)** Relying solely on resemblance to a "standard" without defining whose standard or how it's set (ignoring Exhibits 2 & 5).
  *   **(Minus 3 marks)** Declaring "a letter is whatever the reader thinks it is" and then having no explanation for why the trainee is "wrong" (Exhibit 4) or why the tourist is "wrong" (Exhibit 2).
  *   **(Minus 3 marks)** Concluding "there's no fact of the matter, it's all relative" *without* treating this as a necessary surrender/challenge to their initial account (i.e., using it as a cop-out instead of an admission of failure).
  *   **(Minus 2 marks)** Drawing an abstract distinction (e.g., "form vs. function") but never using it concretely to analyze any exhibit.
  *   **(Minus 2 marks)** Mentioning Wittgenstein's "family resemblances" or "language games" without concretely applying the concept to the Morphing 'a' (Exhibit 1) or another specific exhibit. Name-dropping without application.
  *   **(Minus 1-2 marks)** Exceeding 800 words significantly (use judgment).

  **Exhibit Most Likely Fumbled & How to Spot It:**

  *   **Exhibit Most Likely Fumbled:** **Exhibit 3 (Bakery Double-Duty).**
  *   **What a Fumble Looks Like:**
      *   **Skipped:** Simply not mentioned in the application section.
      *   **Misdescribed:** Claiming it shows two *different* shapes, or misstating the words/letters involved.
      *   **Superficial Application:** Saying "My account works because it's both letters" without explaining *how* one mark can fulfil two distinct functional slots within the system (e.g., ignoring context, word boundaries, or joining conventions).
      *   **Failure Admission Without Concrete Surrender:** Saying "My account fails here because one mark can't be two letters" but then not stating what *specific* aspect of their account needs to change (e.g., they need to incorporate the role of *context* or *position within a word* into the slot definition).
  *   **Marker Tip:** Look for students who grapple with *how context forces one shape into two roles*. If they don't mention context/joining/word position as the key mechanism enabling the double duty, it's likely a fumble. A good answer explicitly uses context to resolve it.

  ---

  This package provides the structured question you need, a model answer that rigorously tests (and modifies) your "job and slot" hunch against the exhibits, and a marking scheme focused on concrete, identifiable student actions that a non-expert can follow. Good luck with the assignment!
