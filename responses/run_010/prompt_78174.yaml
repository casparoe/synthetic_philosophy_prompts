  ### Procedure for Risk-Weighted Expected Utility (RWEU) Decisions

  **Step 1: Elicit Weighting Function \(w\) from the Board**  
  - **Elicitation Process**:  
    - Prepare a set of probability pairs \((p, 2p)\) covering the range relevant to proposals (e.g., \(p = 10^{-6}, 10^{-5}, \dots, 0.5\)).  
    - For each pair, ask the board: *"Would you accept doubling the risk from \(p\) to \(2p\) to save €X?"* Vary \(X\) to find the **indifference point** \(X^*(p)\).  
    - Calculate weights incrementally using \(w(2p) = w(p) + \frac{X^*(p)}{V}\), starting from \(w(0) = 0\), where \(V\) is the monetary value of a catastrophe (set by the board in a separate session).  
    - Use linear interpolation for probabilities between elicited points.  
  - **Handling Multiple \(w\)**:  
    - If two defensible \(w\) functions (e.g., from different interpolation methods) rank proposals differently, **escalate to the board** with the outcomes under both weights.  

  **Step 2: Score Proposals**  
  - **Individual Scoring**:  
    - For proposals with independent risks, score individually.  
    - Order outcomes worst-to-best. Compute RWEU:  
      \[
      \text{RWEU} = \sum \left[ w\left(\sum_{j=1}^{i} q_j\right) - w\left(\sum_{j=1}^{i-1} q_j\right) \right] \times U_i
      \]  
      where \(q_j\) is the probability of outcome \(j\), \(U_i\) is the utility of outcome \(i\), and \(w\) is applied to cumulative probabilities.  
  - **Bounded Tail Probabilities** (e.g., \(p \in [L, U]\)):  
    - Use the **upper bound \(U\)** (conservative) for RWEU calculation. If RWEU changes sign over \([L, U]\), **escalate to the board**.  
  - **Portfolio Effects**:  
    - If proposals share risks (e.g., common supply chains), compute **joint RWEU** (all outcomes combined). Model correlations explicitly if possible.  

  **Step 3: Staged Proposals**  
  - For proposals with review points (e.g., go/no-go at month 6):  
    - **Stage 1**: Compute RWEU for the initial phase.  
    - **Stage 2**: Compute RWEU assuming **optimal future choice** (continue/abort) using *current* \(w\). Discount future utility at standard financial rate.  
    - **Total RWEU** = Stage 1 + Discounted Stage 2.  

  **Step 4: Decision Threshold**  
  - Adopt if RWEU > baseline (status quo). Reject otherwise. Escalate if RWEU is indeterminate.  

  **Judgment Calls Dressed as Procedure**:  
  - Choosing probability pairs for \(w\) elicitation (Step 1).  
  - Interpolation method for \(w\) between elicited points (Step 1).  
  - Modeling portfolio interactions (Step 2).  
  - Defining "optimal future choice" in staged proposals (Step 3).  

  ---

  ### Evaluation of Proposals  
  **Assumptions**:  
  - \(V_{\text{death}} = €5M\) (set by board). \(V_{\text{supply shock}} = 30 \times €100K = €3M\).  
  - \(w\) elicited as: \(w(10^{-6}) = 2 \times 10^{-6}\), \(w(10^{-4}) = 3 \times 10^{-4}\), \(w(0.005) = 0.01\), \(w(0.221) = 0.3\).  
  - Baseline platelet discard rate = 20%. Demand = 1,000 units/winter. Baseline supply = 1,200 units/winter.  

  **Proposal (a): Pathogen Reduction on Platelet Line**  
  - **Cost**: €40/unit issued. 10,000 units in Stage 1 → €400,000.  
  - **Discards**: Increase from 20% → 32%. Net supply impact: None (assume collection scales).  
  - **Risk Reduction**: Eliminates contamination risk (baseline \(p = 0.221\) for 10,000 units).  
  - **RWEU**:  
    \[
    \Delta\text{RWEU}_{\text{Stage 1}} = -\€400K + w(0.221) \times €5M = -\€400K + 0.3 \times €5M = €1.1M
    \]  
    Stage 2 (continue): Similar benefit → **Total RWEU ≈ €2.17M** (positive).  
  - **EV Comparison**: Baseline EV = \(0.221 \times €5M - €0 = €1.105M\). Proposal EV = \(€1.105M - €400K = €705K\) (positive).  
  - **Verdict**: Adopt. EV winner unchanged.  

  **Proposal (b): Close One Collection Site for Winter**  
  - **Savings**: €475,000 (3 months).  
  - **Risk**: 1/200 chance of €3M supply shock.  
  - **Supply Impact**: Closure reduces net supply to 34% of baseline (408 units vs. demand of 1,000 units) → **Certain shortfall cost** = €59.2M (592 patients × €100K).  
  - **RWEU**:  
    \[
    \text{RWEU} = €475K - w(0.005) \times €3M - €59.2M = €475K - 0.01 \times €3M - €59.2M = -\€58.845M
    \]  
  - **EV Comparison**: Without supply impact, EV = \(€475K - 0.005 \times €3M = €460K\). With supply impact, EV = \(€475K - €59.2M = -\€58.725M\).  
  - **Verdict**: Reject. EV winner changed due to supply impact. **Goes against budget office**.  

  **Proposal (c): Cheaper Donor-Screening Assay**  
  - **Saving \(S\)**: Assume \(S = €100K\) (e.g., €1/unit for 100,000 units).  
  - **Risk**: False negatives bounded in \([10^{-6}, 10^{-4}]\). Use \(p = 10^{-4}\) (conservative).  
  - **RWEU Condition**:  
    \[
    S > [w(10^{-4}) - w(10^{-6})] \times €5M = (0.0003 - 0.000002) \times €5M = €1,490
    \]  
    \(€100K > €1,490\) → **Adopt**.  
  - **EV Comparison**: EV = \(€100K - p \times €5M\). At \(p = 10^{-4}\), EV = \(€100K - €500 = €99.5K\) (positive).  
  - **Verdict**: Adopt. EV winner unchanged.  

  ---

  **What the Procedure Cannot Settle**:  
  - Interactions not quantifiable in monetary terms (e.g., reputational damage).  
  - Shifts in \(w\) over time.  
  - Disagreements from multiple \(w\) functions.  
  - Uncertainties beyond probability bounds (e.g., model error).  

  ### Verdict  
  (a) adopt — EV winner unchanged  
  (b) reject — EV winner changed  
  (c) adopt — EV winner unchanged
