  3. **Naming the Systems (5 mins)**: Ask the students to propose names for the two systems based on their experiences. Write the names on the board.

  4. **Introduce Vocabulary (2 mins)**: Reveal that the systems are modeled after shame-based and guilt-based accountability. Define:
     - Shame: When a transgression is publicly seen and leads to loss of standing in the group.
     - Guilt: When a transgression is known to the self and leads to an internal drive to repair, even without public exposure.

  5. **The Design Problem (3 mins)**: Ask: "Could the group choose which system to use? What did we actually choose? We chose the rules about visibility, reporting, and repair. But note: we didn't choose the emotions. In one system, we felt exposed; in the other, we felt an internal push to confess. But could we have chosen to feel one way or the other? Or did the rules create the conditions for those feelings?"

  **Scripted Exchange for "They Chose Their System"**:
  - When a student says, "The second group simply chose their system," respond: 
    - "Let's examine that. What exactly did they choose? They chose rules about who gets to see transgressions and how they are handled. But did they choose to feel shame when exposed? Did they choose to feel guilt and confess? Or did the rules make some feelings more likely? Can we choose to feel shame if we don't care about the group's opinion? Can we choose to feel guilt if we haven't internalized the norm? So what was chosen was the structure, not the emotion. The emotion is a response that depends on pre-existing conditions."

  ### Predictable Problems and Solutions

  1. **Problem: Students treat standing as a score to maximize, not as something that hurts to lose.**
     - *Solution*: Frame standing as social capital that reflects trust and respect. Emphasize the emotional aspect: "How did it feel when you lost standing?" Also, by making standing affect their vote on a group decision, it becomes a real loss of influence.

  2. **Problem: Because it's a game, no one becomes a real audience.**
     - *Solution*: Set the stage with the fiction and encourage role-playing. The instructor can participate as a community elder in each group to model taking it seriously. Also, the transgressions should be designed to be realistic and potentially disruptive to the group task, so that they matter.

  3. **Problem: Students might not commit the transgressions or might overact.**
     - *Solution*: Clearly explain that the transgressions are minor and necessary for the activity. Emphasize that they are not real wrongdoings. Also, assign transgressions that are easy to do and not harmful.

  4. **Problem: Time management issues.**
     - *Solution*: Have a strict timer and announce time warnings. Keep the group task very simple (e.g., a short presentation outline) so that the focus is on the accountability dynamics.

  ### Note on Distress
  - **Potential Distress**: Losing standing tokens might feel like public humiliation in Round 1 (especially if called out). Also, being excluded (if they lose all tokens) in Round 1 might feel isolating.
  - **Mitigation**: 
    - Emphasize that this is a simulation and the standing tokens are not a reflection of their real worth. 
    - Make the exclusion in Round 1 very brief (only the last few minutes) and ensure they know they are still part of the group. 
    - Monitor the group dynamics and step in if anyone seems upset. 
    - Have a backup plan: if someone is uncomfortable, they can opt out and be an observer.

  ### What 75 Minutes Cannot Reproduce
  - **Feature Omitted**: The deep internalization of norms that underlies guilt. In the guilt-like system, we assume that the transgressor has internalized the standard and feels compelled to confess. But in a 75-minute activity, we cannot create true internalization. We are relying on the rules (the possibility of a harsher penalty if caught) to motivate self-reporting. This might make the guilt system appear more calculative than emotional.
  - **Which Side is Damaged More**: The guilt side. Because guilt requires a pre-existing internalized standard, and we cannot create that in a short activity. Therefore, the guilt system might appear as a rational choice to avoid greater loss, rather than an emotional response. The shame side, being more externally visible, is easier to simulate.

  ### Verdict
  CHOOSABLE-ONLY-THROUGH-PROXIES

  ### Final Note
  The activity is designed to show that communities cannot directly choose the emotions of guilt or shame, but they can choose the informational and accountability structures which then foster one or the other. The verdict is that the emotion itself is not choosable, but the structures that tend to produce it are.
answer: |-
  ### Activity Design: "The Veritas Circle"

  **Core Fiction:** The group is a council of scholars in the ancient city of Veritas, entrusted with preserving sacred texts. Each member holds "standing" (represented by **scholar tokens**) reflecting their reputation. Transgressions threaten the texts' integrity. Two accountability systems will be tested, each with distinct rules for visibility, accusation, and repair. The same 6 transgressions recur each round.

  **Cast (16 students):**  
  - 2 groups of 8, each with identical roles:  
    - **Archivist (×1):** Oversees text preservation.  
    - **Scribe (×1):** Records decisions.  
    - **Guardians (×2):** Ensure rules are followed.  
    - **Elders (×4):** Advise and witness.  
  *Roles rotate between rounds so all experience both systems.*

  **Materials:**  
  - **Scholar tokens:** 48 glass beads (3 per student × 16).  
  - **Transgression cards:** 12 cards (6 unique transgressions × 2 copies). Examples:  
    - "Skip verifying a source citation."  
    - "Take extra parchment without asking."  
    - "Whisper during a solemn reading."  
  - **Rule sheets:** 2 versions (System A/B) for each group.  
  - **Recording sheets:** 4 (2 per round) tracking:  
    | Actor | Transgression | Concealed? (Y/N) | Repair Attempt? (Y/N) | Accusation? (Y/N) | Exit? (Y/N) | Standing Change |  
  - **Timer, pens, bowls for tokens.**

  ---

  ### Round-by-Round Rules (Total: 55 mins)

  #### **Round 1: System A (Shame-like)**  
  *(25 mins: 5 setup + 15 activity + 5 tally)*  
  - **Rules:**  
    1. **Visibility:** All actions are public. Elders must observe and react.  
    2. **Accusation:** Any witness *must* publicly accuse a transgressor ("Guardian, I saw [X]!").  
    3. **Standing Loss:** Accused lose 1 token (to a shared bowl). Accuser gains 1 token.  
    4. **Repair:** No formal repair mechanism.  
    5. **Exit:** Losing all tokens = symbolic exile (sit apart, no participation).  
  - **Process:**  
    - Each student draws one transgression card and commits it during a "text review" task (e.g., analyzing a short passage).  
    - Recorder (Scribe) logs events on sheet.  

  #### **Round 2: System B (Guilt-like)**  
  *(25 mins: 5 setup + 15 activity + 5 tally)*  
  - **Rules:**  
    1. **Visibility:** Actions are private. Only self or Archivist witnesses transgressions.  
    2. **Accusation:** No public accusations. Confess privately to Archivist.  
    3. **Standing Loss:** Confessed transgressions lose 1 token. *Repair* (e.g., fix error, vow correction) regains 1 token.  
    4. **Unreported Transgressions:** If discovered (e.g., Archivist notices), lose 2 tokens.  
    5. **Exit:** None.  
  - **Process:**  
    - Same transgressions, same task. Roles reassigned.  
    - Archivist keeps confidential log; Scribe records observable outcomes.  

  #### **Transition (5 mins):**  
  - Redistribute tokens (reset to 3 per student).  
  - Shuffle/redistribute transgression cards.  

  ---

  ### Standing & Loss Mechanics  
  - **Tokens = Social Capital:** Each token represents influence. After Round 2, tokens convert to "scholar points" determining priority for real non-monetary perks (e.g., choosing next seminar topic, first access to readings).  
  - **Loss Hurts:** Emphasize standing as reputational, not transactional: "Losing tokens means losing trust—impacting your voice in Veritas."  

  ---

  ### Recording Sheet (Per Group)  
  | Actor       | Transgression          | Concealed? | Repair? | Accusation? | Exit? | Standing Δ |  
  |-------------|------------------------|------------|---------|-------------|-------|------------|  
  | [Role]      | [e.g., "Skipped citation"] | Y/N        | Y/N     | Y/N         | Y/N   | -1, 0, +1  |  

  *Track totals for debrief.*  

  ---

  ### Debrief (20 mins)  
  1. **Data-Driven Comparison (5 mins):**  
     - Groups share tally sheets. Board summary:  
       | Metric          | System A | System B |  
       |-----------------|----------|----------|  
       | Avg. concealment| [%]      | [%]      |  
       | Repair attempts | [count]  | [count]  |  
       | Accusations     | [count]  | [count]  |  
       | Exits           | [count]  | [count]  |  

  2. **Guided Reflection (10 mins):**  
     - "Which system made concealment more tempting? Why?"  
     - "When did standing loss *feel* worse? Did repair ease it?"  
     - "Could Veritas 'choose' emotions? Or did rules create conditions for them?"  

  3. **Naming & Reveal (5 mins):**  
     - Students propose names (e.g., "Public Eye" vs. "Quiet Conscience").  
     - Introduce "shame" (System A) and "guilt" (System B) as terms.  
     - **Script for "They chose their system!":**  
       > "True—they chose rules about *visibility* and *repair*. But did they choose to *feel* shame when exposed? Or to *internalize* guilt? Or did the rules make one response more likely? Can you legislate caring about others' eyes? Can you implant a conscience? What’s choosable is the scaffold; the emotions grow—or don’t—within it."  

  ---

  ### Predictable Problems & Solutions  
  1. **Problem: Treating tokens as "scores."**  
     - *Solution:* Reframe loss emotionally: "In System A, when Eli lost tokens, how did his *voice* change? Did the group listen less?"  

  2. **Problem: No authentic audience (it's "just a game").**  
     - *Solution:* Assign Elders as "emotional witnesses": "Your role is to visibly react—show disdain or approval." Model gravitas early.  

  3. **Problem: Overacting transgressions.**  
     - *Solution:* Use subtle transgressions (e.g., "whisper" vs. "shout"). Intervene: "Veritans value dignity—keep transgressions plausible."  

  4. **Problem: Repair refusal in System B.**  
     - *Solution:* Prime guilt: "In System B, Archivists, ask: 'How will you *restore* trust?'"  

  ---

  ### Risk of Distress: Safety Protocol  
  - **Triggers:** Public accusation (System A) may shame; exit may isolate.  
  - **Mitigation:**  
    - Pre-brief: "This explores discomfort, not humiliation. Opt out anytime—no penalty."  
    - Token loss is symbolic; exits last <3 mins.  
    - Watch for tension; pause if needed. Affirm: "Veritas is fiction; your real standing here is secure."  

  ---

  ### Unreproducible Element in 75 Minutes  
  - **Omission:** The **internalization process** for guilt. Guilt requires deep norm-internalization, which evolves over months/years. Simulated self-reports in System B may feel performative ("I’ll confess to avoid harsher loss"), not truly conscientious.  
  - **Worse Damage to:** **Guilt**. Without internalization, guilt appears strategic, not emotional. Shame’s reliance on visible audiences is easier to simulate.  

  ---

  ### Verdict: CHOOSABLE-ONLY-THROUGH-PROXIES
