  ### Standing and Loss Scheme
  **Standing**: Represents the respect, trust, and social capital in the group. Losing standing tokens should feel like a loss of something valuable. We will make standing matter by linking it to a privilege at the end of the activity (but not money). For example:

  - At the end of the activity, the students with the most standing tokens in each group will get a small privilege (e.g., they can choose the topic for a future discussion, or they get a small treat). But note: We don't want to make it too competitive because we don't want them to maximize standing as a score. We want them to feel the loss.

