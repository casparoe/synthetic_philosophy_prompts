  - **Procedure**:
    - Each student receives a secret transgression card (for their role) and is instructed to commit the transgression during the round.
    - The group works on a task (e.g., prepare a 2-minute presentation on "The Importance of Academic Integrity").
    - During the 20 minutes, if someone observes a transgression, they must call it out. The recorder notes the event.
