  ### Round-by-Round Rules with Timings

  **Total Time:** 75 minutes.

  #### Setup (5 minutes)
  - Explain the setting: Veritas College, a community of scholars. They will work in two groups (A and B) on a project (e.g., preparing a short presentation on a given topic, but the project is just a vehicle). The real focus is on how the community holds each other accountable.
