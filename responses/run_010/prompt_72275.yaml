  We are designing an activity for a 75-minute seminar on moral psychology, aiming to explore the distinction between guilt and shame without using those terms. The goal is for students to discover that communities can design information structures (who sees what, when, standing, and repair mechanisms) which then influence the emergence of guilt-like or shame-like emotions. The activity will have two rounds with the same cast and transgressions, but under two different accountability architectures. We'll avoid the words guilt and shame until the debrief.

