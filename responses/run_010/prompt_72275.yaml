    5. **Exit**: No exit based on standing. Even if someone loses all tokens, they remain in the group.

  - **Procedure**:
    - Reset standing: Each student gets 3 tokens again.
    - New transgression cards (same set of transgressions) are handed out.
    - The group works on a similar task (e.g., prepare a 2-minute presentation on "The Value of Collaboration").
    - During the round, if a student commits a transgression, they can self-report to the Researcher. The Researcher then notes it and the student can repair. Alternatively, if someone suspects a transgression, they can privately report to the Researcher. The Researcher then investigates (privately) and if confirmed, imposes the standing loss and allows repair.
    - The recorder notes all events.

  #### Transition Between Rounds (5 minutes)
  - Collect tokens and redistribute for Round 2.
  - Hand out new transgression cards (same set of transgressions, but students get a different one? Or the same? We want the same set of transgressions to be comparable. We can reshuffle the transgressions among the roles so that each student has a new transgression in Round 2. But to keep it simple, we can assign the same transgression to the same role, but each student has a different role in the two rounds? No, each student has the same role throughout. So they will have the same transgression in both rounds? That might be too predictable. Instead, we can have two sets of transgression cards, but with the same types of transgressions. We'll assign randomly in each round.

    We decide: In Round 1, each student gets a transgression card for their role. In Round 2, we reassign transgressions randomly (so each student gets a new transgression, which may or may not be the same as before). We want to avoid students being labeled as "the one who always does X".

  #### Recording (during rounds)
  - Each group has a recorder (a Community Member role) who fills out the recording sheet. We'll have a simple table on the sheet.

  #### Debrief (25 minutes)
  1. **Data Collection (5 mins)**: Each group reports what happened in both rounds. We create two tables on the board: one for Round 1 and one for Round 2, with columns for:
