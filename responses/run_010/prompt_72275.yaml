        - If a transgression is not observed and called out, then the transgressor keeps their standing, but if the transgression is discovered later (by the group reflecting at the end of the round) then the transgressor loses 2 standing tokens (because they concealed it) and no one gains.
    4. **Repair**: There is no formal repair mechanism. Once standing is lost, it cannot be regained in this round.
