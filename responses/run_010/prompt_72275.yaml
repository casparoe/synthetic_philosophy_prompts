  #### Round 2: System 2 (Guilt-like) - 20 minutes
  - **Rules for System 2** (handed out on a rule sheet to each group):
    1. **Visibility**: Actions are not public. Each person works somewhat independently. Only the output is visible to the group at the end.
    2. **Accountability**: There is no public calling out. Instead, if someone commits a transgression, they are expected to self-report. Also, if someone suspects a transgression, they can report it privately to the Researcher (who acts as a judge).
    3. **Standing Adjustment**:
        - If a transgressor self-reports, they lose 1 standing token but can then do a repair action (e.g., fix the mistake, apologize) to regain 1 token (so net zero if they repair).
        - If a transgression is reported by someone else (privately to the Researcher) and the Researcher confirms it (by asking the accused privately), then the transgressor loses 2 tokens. However, the transgressor can then repair (and regain 1 token) by fixing the mistake and apologizing to the group (so net loss of 1).
        - The reporter does not gain or lose tokens.
