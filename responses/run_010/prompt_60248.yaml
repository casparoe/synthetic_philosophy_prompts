  ## The Look-Back

  Marta’s office smelled of stale coffee and the faint, metallic tang of the aquarium humming in the corner. Inside, a lone Siamese fighting fish flared its gills at its own reflection. Outside, the sleek chrome lobby of "Horizon Insights" pulsed with the quiet anxiety of people waiting to ask one question about their future. Marta didn’t handle the asking. She handled the *not* asking.

  Arjun Patel from Corporate Oversight perched on the edge of her visitor’s chair, radiating impatience. His tablet glowed with damning graphs. "Ms. Petrova, the data is unequivocal. Eighteen months post-Look, clients show, on average, a measurable dip in aggregate life satisfaction metrics compared to the control group. Health markers, financial stability indices, relationship cohesion scores – all slightly down. Our core proposition is *knowledge*. True knowledge, freely given. This outcome," he tapped the screen, "is mathematically absurd."

  Marta stirred her cooling tea. "Mathematically absurd on what planet, Mr. Patel? The one where people are calculators and knowing the future doesn’t change the person doing the knowing?"

  Arjun leaned forward. "The principle is simple. Imagine standing at a crossroads. Someone offers you a guaranteed true signpost, pointing which path leads to… less mud, say. Free. Would you refuse it? Could it possibly make you *worse* off? You take the signpost. If it confirms your gut feeling, you proceed confidently. If it points the other way, you choose the better path! You *cannot* lose."

  Marta gestured towards the lobby. "And the mud? Sometimes it’s quicksand. Sometimes it’s just dirt. Sometimes," she lowered her voice, "knowing the path is clear makes you reckless. Knowing it’s muddy makes you stumble before you even step." She met his gaze. "My job isn't to hoard knowledge. It's to ask: *What will you do with this answer?* And more importantly, *who will you be* after you get it?"

  "I see your counseling success rate is exceptional," Arjun said, scrolling through another file. "Ninety-two percent of your consultations result in the client declining their Look. Corporate wonders if that selection bias is skewing the study. Are you only letting the 'stable' ones through?"

  Marta’s laugh was short, harsh. "Stable? People come here vibrating with fear or desperate hope. They want to know if the lump is benign, if the marriage survives, if the startup takes off. I don't 'let' anyone through. I show them the mirror *before* Horizon hands them the crystal ball."

  **SCENE START**

  A young woman, Elena, sat across from Marta later that afternoon, knuckles white on the armrests. "I need to know," she breathed. "The promotion. Regional Director. I’ve poured everything into this. The presentation’s next month. If I get it… everything changes. If I don’t…" Her voice cracked. "I *need* to know. So I can prepare. So I don’t… break."

  Marta didn’t reach for the standard forms. "Elena, imagine Horizon tells you, guaranteed true: ‘No. You don’t get the promotion.’ What happens next Monday?"

  Elena flinched. "I… I’d call in sick. For a week. Maybe two. I couldn’t face them. All that work… wasted."

  "And if they say ‘Yes’?"

  "Relief! Pure joy! Then… terror. What if I mess it up? What if I’m not good enough? I’d probably work myself into the ground trying to prove I deserve it." She managed a shaky smile. "Maybe still call in sick Monday, just to celebrate."

  "So," Marta said gently, "either way, you don’t give the presentation next month?"

  Elena blinked. "I… guess not. But knowing *why*…"

  "Does the ‘why’ change the outcome? You miss the presentation Horizon just told you was the key to your promotion. How does that knowledge feel then? Like a useful signpost? Or like a sentence?"

  Elena stared at her hands. The fight drained out of her. "I see. It… it wouldn’t help. It would just… paralyze me. Either way." She signed the decline form, her shoulders slumping with a different kind of tension.

  **SCENE END**

  Back in her office, Arjun had witnessed the interaction through the one-way comms link. He looked troubled but unconvinced. "Anecdote, Ms. Petrova. Compelling, but anecdote. The aggregate data remains. Lookers *are* slightly worse off, statistically. Your counseling, however effective, doesn't erase the negative delta for those who *did* Look. Why?"

  "Because your precious aggregate," Marta countered, her own frustration rising, "measures the wrong thing. Or measures it against the wrong ruler."

  Arjun frowned. "We measure standard wellbeing indices. Validated, reliable."

  "Reliable for *what*? For *who*?" Marta leaned forward, the fish in its tank flaring silently behind her. "Take Elena. Suppose she ignored me, took the Look. Suppose it said ‘No Promotion.’ She spirals, maybe quits, maybe gets therapy, maybe finds a lower-stress job she actually enjoys. Eighteen months later, your survey finds her: lower income, lower ‘career achievement’ score, maybe… happier? Calmer? More present for her kids? Is she ‘worse off’?"

  "According to the standardized metrics applied uniformly—"

  "—which weight income and job title heavily! They reflect the values of the *person who walked in* desperate for that promotion! Not the person who walked out eighteen months later, who might value peace over prestige! How do you score *that*, Mr. Patel?" Her voice cut through the hum of the aquarium. "When the Look changes what they *want*? When knowing the future rewrites their definition of ‘better off’? Your math assumes the finish line stays put. It doesn’t. The runner changes, *and* the track shifts."

  Arjun was silent for a long moment. He looked at his tablet, then at the fish, endlessly battling its reflection. "You’re suggesting… the knowledge itself alters their utility framework? Their fundamental preferences?"

  Marta nodded grimly. "It changes *them*. Sometimes subtly, sometimes catastrophically. Someone learns they’ll be bankrupt in three years. They might give up trying, become fatalistic, lose the very drive that could have prevented it. Your study measures the bankrupt person against the non-bankrupt potential they *abandoned* because of the Look. Is that a fair comparison? Or is it measuring a ghost against a living person who’s just… different now?"

  "Then how do we measure the value?" Arjun asked, a crack in his mathematical certainty.

  "Maybe you can't," Marta said softly. "Not neatly. Not in a way your theorem can swallow. The cost isn't in dollars, Arjun. It's in the quiet dread that replaces hope. It's in the paths not taken because a signpost said ‘dead end,’ even if the path beyond it changed. It's in sleeping less, worrying more, seeing your partner differently because you *know* they’ll leave, or stay for the wrong reasons. Your ‘costless’ information costs pieces of people your model doesn't account for. Pieces they sometimes can't afford to lose."

  Arjun stared at the graph on his tablet – the clean, damning line trending slightly downward. He imagined it not as a miscalculation, but as a tremor, a seismic reading of countless internal fractures caused by knowledge that arrived without the wisdom to hold it. The pristine logic of the signpost at the crossroads crumbled under the weight of human terrain.

  "It shouldn't be possible," he murmured, almost to himself. "Free truth… it *has* to be neutral or beneficial."

  "Tell that to the ghost of Elena’s ambition," Marta said, looking past him to the bustling lobby. "Or to the man who learned his wife would stay, but only out of duty, and now lives in the hollow echo of that ‘yes’. The truth they got was free. What they paid for it afterward… that’s the balance sheet your study can’t capture."

  Arjun left without his usual crisp conclusion. He took the data, the anomaly, the uncomfortable echo of Marta’s words. He would write his report: the study methodology was sound, the negative delta was statistically significant. He would note Counselor Petrova’s concerns regarding preference instability post-Lognition, but conclude that within the defined parameters of measurement, the result held. The mathematical principle stood inviolate *in its own terms*. The problem, his report would cautiously suggest, might lie in the terms themselves.

  Marta watched him go. She fed the fighting fish, its brilliant colours flaring in the artificial light, trapped in its perfect, predictable world. She picked up the next client file. Another crossroads. Another soul trembling on the brink of a free, devastating truth. She took a deep breath, the scent of stale coffee and aquarium water filling her lungs, and prepared to talk someone back from the edge of knowing.

  ---

  **For Your Sanity Check:**

  1.  **Broken Assumption:** **Preference Instability.** The story hinges on the idea that learning the guaranteed truth *changes the individual's underlying preferences or values*. Elena, pre-Look, valued career success intensely. Post-Look (hypothetically learning "No"), her values might shift towards peace/family, making her *happier* by her *new* standards, but appear "worse off" by the *old* (career-focused) metrics used in the study. The theorem assumes a fixed utility function.
  2.  **Auditor's Technical Correctness:** Within the framework of **consistent preferences**, Arjun is absolutely right. If utilities are stable, free information *cannot* make you worse off in expectation. You can always condition your plan on the information and ignore it if it doesn't change the optimal action. The negative outcome *must* imply measurement error, selection bias, or other violations of the theorem's assumptions (like non-zero costs). His math holds internally.
  3.  **Potential Misstatement Clarification:** Your description of Good's theorem is accurate. The key emphasis is on **expected** welfare. Information can lead to worse *actual* outcomes in specific cases (e.g., you learn bad news and handle it poorly), but the theorem guarantees that *before* seeing the information, your *expectation* of welfare after getting it (and acting optimally) is at least as high as without it. The story exposes how "acting optimally" and "stable preferences" are fragile in practice, leading to worse *actual* and *measured* outcomes despite the theorem.
