  Next week I present in our formal epistemology seminar, where I want to stake out a middle position on indicative conditionals, and my advisor has asked me to circulate a one-page statement of my commitments in advance so that the group attacks the package rather than my exposition. Since the whole session will turn on whether the package is coherent, I would like an audit before it goes out. A classmate who read an early draft offered only that I was trying to have it both ways, which is not actionable advice. My commitments are these:

  (1) Adams's thesis in full generality: for every credence function I count as admissible, and every antecedent A with non-zero probability under it, the probability of "if A, C" equals the probability of C given A. I take that proviso seriously and I want the thesis stated once, for all admissible functions, not as a schema with exceptions. (2) Indicative conditionals express propositions: they can be negated, conjoined, disjoined, and embedded as the antecedent or consequent of further conditionals, and my credence in a compound is fixed compositionally by my credences in its parts; conditional sentences therefore denote elements of the same Boolean algebra as ordinary sentences. (3) Learning is always conditionalization: whenever I come to accept a sentence with certainty, my new credence function is my old one conditionalized on the proposition that sentence expresses, and this includes cases where the sentence is itself a conditional. I do not want a special-purpose update rule sitting alongside conditionalization. (4) I know Lewis's triviality results — the 1976 argument and the strengthened version a decade later that assumes less closure — and I think they are valid, but I do not think they touch me, for two reasons. First, the derivations seem to me to depend on reading conditional probability as a ratio of unconditional probabilities; I take conditional probability as primitive in the Popper–Rényi style, so the probability of C given A is not shorthand for a quotient, and the algebraic machinery should not get going. Second, the derivations seem to need the thesis applied to conditionalized credence functions — my function conditionalized on the conditional, and on its negation — that no agent could rationally occupy, and I am willing to restrict the admissible class accordingly. (5) Methodologically, I will not accept a solution that restricts a general thesis by syntactic category, for instance by saying the thesis holds only for unembedded, stand-alone