  ### Summary of Recommendations
  - **Most severe issue**: (1) + (2) + (4) fail to block Lewis; reformulating (2) to allow credence-dependence is the cheapest fix.  
  - **Retain**: (1), (3), (5), (6), (7) with a revised (2).  
  - **Monitor**: Embeddings under credence-dependent semantics; they may require additional constraints.  
  - **Presentational advice**: In your statement, explicitly define your semantic proposal for conditionals (credence-dependent) to preempt attacks on coherence. Stress that (4) is not your primary defense—the semantics is.
