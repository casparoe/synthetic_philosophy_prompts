prompt: |-
  Six weeks ago I became chair of a small nonprofit board, which means that when something falls through — a treasurer who stops filing, a program lead who misses a deadline others depend on — the unpleasant conversation is mine to have. What I had not anticipated is how unevenly those conversations land. Nothing in my own record resembles what I am condemning; the pressures that undid these people never came anywhere near me, partly because my circumstances have always had more slack in them and partly, I will admit, because I have never much wanted what they wanted. So the usual retort is simply unavailable: nobody can say I did the same thing last year, nobody can point to a fault of my own. And yet the sharpest resistance I meet is not an accusation of double standards but something closer to what would you know — a sense that condemnation from me is weightless, or faintly indecent, precisely because it comes from someone the relevant test was never administered to, and who therefore cannot tell from the inside whether what he is condemning is a defect of character or a run of bad luck.

  I keep seeing the same shape outside my own life: the comfortably employed condemning the person who took money from the till, the childless condemning a parent, a nation founded in violence condemning another nation's. In each case the objector is clean, and the cleanliness is what people resent.

  Is there an established concept for this — for a person's blame losing its force not because of anything they did but because of what they were never asked to face? I am aware of the neighbouring territory: hypocrisy, the retort that turns a charge back on the accuser, and the general philosophical question of who is entitled to blame at all. I want the specific thing that sits alongside those. Please tell me which nearby notions come closest and how mine differs from each — in particular, how it differs both from the case of the pot calling the kettle black and from the observation that whether one ever resisted a temptation may be a matter of luck rather than virtue — and, if nothing in the literature covers it, propose a term with a definition and mark its edges. Where does it stop applying: to a judge sentencing a thief, to a parent, to a stranger writing online, to someone who was tested and passed? A name alone will not help me; what I need is the carving.
reasoning: |-
  Okay, the user is chairing a nonprofit board and facing resistance when holding people accountable. They notice that their criticism lacks weight because they haven't faced the same challenges as those they're criticizing. They're looking for a concept that captures this dynamic where blame is weakened not by hypocrisy but by lack of shared experience.

  First, I need to recall philosophical and sociological concepts related to moral authority. Hypocrisy is the obvious one, but the user already mentioned it and wants something different. The pot calling the kettle black doesn't fit because the user isn't guilty of the same faults. Instead, it's about the legitimacy to blame without shared experience.

  Next, the idea of moral luck comes to mind. Nagel's moral luck discusses how luck affects judgment, but it's more about the judged, not the judge's position. The user's issue is about the blamer's untouched circumstances, so moral luck is adjacent but not exact.

  Epistemic privilege is another angle. Knowing something from the inside versus outside. The resistance they face is questioning their epistemic authority—how can they judge without experiencing the pressures? This connects to standpoint theory, where marginalized perspectives offer unique insights. Here, the user's privileged position undermines their authority because they lack that insider perspective.

  Then there's moral standing or standing to blame. This involves the right to hold others accountable. Factors include being unaffected by the issue, not sharing vulnerabilities, or not having gone through similar trials. The person's "clean record" makes their blame seem hollow, resentable. This seems closer.

  But is there a specific term? "Unearned righteousness" or "untested virtue" might work, but they need defining. The user wants a precise carve-out. Also, considering where it stops: a judge has institutional role-based legitimacy; a parent has relational authority; online strangers lack any connection, making their blame weightless. Someone who passed the test has earned the standing.

  The key differentiators: unlike hypocrisy, the blamer isn't accused of similar faults. Unlike moral luck (which focuses on the agent's luck), this is about the blamer's lack of exposure. The resentment stems from the blamer's unshared privileges, making their condemnation feel indecent or weightless.

  So synthesizing: the core issue is the blamer's unendured pressures leading to compromised moral standing. Terms like "privileged condemnation" or "outsider judgment" could fit. But the user needs the concept mapped thoroughly with boundaries. Highlighting the epistemic gap (can't know if it's character or luck) and the resulting resentment of their "cleanliness."
answer: |-
  Your profound observation touches on a fundamental tension in moral authority: **the dissociation between judgment and lived experience**. The established concepts that orbit this idea don't fully capture its specificity, so let's carve its conceptual space precisely.

  ### Core Problem
  Your blame loses force because:
  1.  **You lack experiential knowledge:** You cannot know if the failure stemmed from character flaw or circumstantial bad luck ("*cannot tell from the inside*").
  2.  **Your position appears unearned:** Your "cleanliness" is seen as a product of unshared privilege (slack, differing desires), making your judgment seem abstract, naive, or even insulting.
  3.  **It breeds resentment:** The perceived gap between your untested virtue and their pressured failure fuels resistance focused on *you*, not the act itself ("*the cleanliness is what people resent*").

  ### Neighboring Concepts & How Yours Differs

  1.  **Hypocrisy / "Pot Calling the Kettle Black":**
      *   **What it is:** Accusing others of faults you *actively possess* or *commit yourself*. The critique is invalidated by the accuser's identical failing.
      *   **How yours differs:** **You *lack* the failing entirely.** Your record *is* clean. The problem isn't inconsistency (*you* doing it last year), but the *absence* of the relevant test. Your judgment isn't *hypocritical*, it's **epistemically and morally disconnected**.

  2.  **Moral Luck (Nagel/Williams):**
      *   **What it is:** The idea that factors beyond an agent's control (luck) significantly affect moral judgment *of the agent*. E.g., a distracted driver who hits a child is judged more harshly than one who doesn't, though their fault is identical.
      *   **How yours differs:** Moral luck focuses on the *judged person's* luck affecting *their* blameworthiness. **Your concept focuses on the *judger's* luck (never facing the test) affecting *their authority* to blame.** It's about the *blamer's* positionality, not the luck of the blamed.

  3.  **Standing to Blame / Moral Standing:**
      *   **What it is:** The right or legitimacy to level a moral criticism. Often lost through complicity, hypocrisy, or shared guilt.
      *   **How yours fits & differs:** This is the broadest relevant category. **Your scenario is a *specific reason* for lacking standing:** **Untested Privilege.** Your standing is undermined not by *your fault*, but by *your unchallenged virtue* relative to the specific failing. The resentment stems from the perception that your standing is unearned in this domain.

  4.  **Epistemic Injustice / Standpoint Theory:**
      *   **What it is:** (Fricker/Harding) Knowledge and credibility can be unjustly denied based on social position (epistemic injustice). Standpoint theory suggests marginalized positions offer unique, critical knowledge.
      *   **How yours relates:** The resistance implies an **epistemic gap**. Your "clean" position is seen as lacking the crucial *insider knowledge* needed to fairly assess the failure's cause (character vs. luck). Your judgment is perceived as coming from an uninformed, privileged standpoint, making it potentially unjust.

  ### The Conceptual Carving: Untested Virtue & Privileged Condemnation

  **Proposed Term: Untested Virtue Effect (or Privilege-Insulated Judgment)**

  *   **Definition:** The phenomenon where the moral authority or perceived legitimacy of blame is significantly diminished because the blamer has never faced, due to circumstance or privilege, the specific pressures, temptations, or tests relevant to the failing they condemn, leading to resentment and a perception that their judgment is abstract, unearned, or illegitimate.
  *   **Core Mechanism:** Blame loses force due to the *blamer's* lack of *relevant experiential vulnerability*, creating an epistemic/moral disconnect and resentment of their "clean" position.

  ### Marking the Edges: Where It Stops Applying

  1.  **The Judge Sentencing the Thief:** **Usually DOES NOT apply.** Judges derive authority from institutional role, legal process, and societal delegation, not personal experience. The system *intends* impartiality based on rules, not lived vulnerability. However, a judge *known* for immense inherited wealth sentencing a starving thief *might* trigger whispers of this effect ("What do *they* know about desperation?"), but the institutional role largely overrides it.
  2.  **The Parent Disciplining the Child:** **RARELY applies.** Parental authority is relational and hierarchical, grounded in care and responsibility. Children may resent the discipline, but the lack of shared experience ("You never had to do homework with *your* dad yelling!") is usually insufficient to fully negate parental standing *because* the role implies a duty to judge/guide regardless. The inherent power dynamic and purpose (upbringing) mitigate the effect.
  3.  **The Stranger Writing Online:** **FREQUENTLY applies STRONGLY.** This is a prime example. The stranger lacks any relational connection, institutional authority, *and* demonstrable relevant experience. Their condemnation appears weightless, abstract, and often resented precisely because it comes from an anonymous, untested position ("Easy for *you* to say from your armchair!"). The effect is dominant.
  4.  **Someone Who Was Tested and Passed:** **DOES NOT apply.** This is the contrasting case. The person who faced similar (or worse) pressures/temptations and *succeeded* possesses the experiential knowledge and earned virtue that grants significant moral authority ("I *have* been there, I *know* how hard it is, and I still didn't do X"). Their blame carries weight precisely because they passed the test.

  ### In Summary
  You've identified a distinct facet of **moral standing**: its erosion not through hypocrisy or direct fault, but through the **unchallenged privilege and experiential distance** of the blamer relative to the *specific* failing. The resentment targets the "*cleanliness*" itself – the unshared luck and unendured pressures – making condemnation seem like **Privilege-Insulated Judgment**, lacking the crucial grounding in relevant vulnerability. This differs fundamentally from hypocrisy (you lack the fault) and moral luck (focuses on the judged, not the judger), residing instead within the domain of **epistemically compromised standing due to untested virtue**. Its application fades where institutional roles dominate (judges), relational duties prevail (parents), or where the blamer *has* demonstrably faced the test (the tested survivor), but thrives where judgment comes from a position of perceived untouchable comfort.
