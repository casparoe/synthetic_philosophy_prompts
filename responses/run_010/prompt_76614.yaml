  - There are two conditions: short-gap and long-gap, run in separate blocks or interleaved.

  Predictions:
  - Stalinesque: In both conditions, the probe is experienced as a separate event and reported accurately. Accuracy is high in both.
  - Orwellian: In the long-gap condition, accuracy is high. In the short-gap condition, the motion illusion revises the experience, and the probe is omitted or altered, so accuracy is low.

  The discriminating feature is the gap duration, which controls whether the motion illusion occurs.

  If the gap is shrunk toward zero, the motion illusion may not occur (because the dots are simultaneous), so the Orwellian revision doesn't happen. Therefore, in very short gaps (approaching zero), we expect high accuracy in both accounts, and the effect disappears.

  Cheating: We do not assume that the experience is fixed at the time of the second dot. In fact, in the Stalinesque view, the experience is fixed after the construction, which is after the second dot. In the Orwellian view, the experience is fixed at the time of the events but then revised. Our probe is during the second dot, which is before the revision or construction.

  Counterattack (multiple-drafts): 
  - The forced choice is a report after the fact. The final draft of the experience in the short-gap condition does not include the probe because it is inconsistent with the motion narrative. Therefore, the subject guesses. This is the same as the Orwellian prediction.
  - To defend the Stalinesque view: maybe the motion illusion is constructed in a way that leaves the probe intact, so the final draft includes both the motion and the probe as separate events. But that may not be the case because of the inconsistency.
  - Modification to survive: We could make the probe not inconsistent. For example, put the probe at a neutral location (not on the motion path) and make it a different shape. Then, in the Orwellian view, it might not be edited out. But then there might be no difference. Alternatively, we could ask for immediate report of the probe (by having a tone and the subject says the color as soon as they see it). But then we are not measuring memory, and the revision might not have happened yet. However, our constraint is a single forced choice after the trial.

  The design does not survive the multiple-drafts counterattack because the multiple-drafts view predicts the same as Orwellian. Therefore, the design does not discriminate between Orwellian and multiple-drafts, but it does discriminate between Stalinesque and the others.

  For the seminar, this might be a good starting point for discussion.

  Final design:

  Experiment:

  - Two conditions: short-gap (50ms) and long-gap (500ms).
  - Sequence: first dot (red, 50ms at A) -> gap -> second dot (green, 50ms at B).
  - Probe: at location A for 10ms, 25ms after second dot onset. Color: red or green (random).
  - Forced choice: probe's color.

  Predicted results:
  - Stalinesque: high accuracy in both conditions.
  - Orwellian: high accuracy in long-gap, low accuracy in short-gap.

  Discriminating feature: gap duration.

  Without gap duration manipulation, we cannot discriminate.

  Counterattack: multiple-drafts agrees with Orwellian. The design does not survive for distinguishing Stalinesque from multiple-drafts, but it does for Stalinesque vs. Orwellian.

  Modification: none that I can see without changing the forced choice to be during the event (which is not allowed).

  So for the seminar, this design is a candidate that has a divergence, though it may be explained by both Orwellian and multiple-drafts.

  But the original question was to discriminate Stalinesque and Orwellian, not multiple-drafts.

  So it works for that.
