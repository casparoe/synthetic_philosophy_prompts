  Present two colored dots in sequence, as in the classic color phi: a red dot at location A (left) for 50ms, a blank gap of 50ms, then a green dot at location B (right) for 50ms. The subject perceives a single dot moving from left to right and changing color midway. Now, we introduce a third stimulus: a brief probe (a small shape, say a triangle) flashed at location C (which is at the midpoint between A and B) at a specific time. The probe is presented for 10ms. The critical manipulation is the timing of the probe relative to the two dots. We set the probe to appear at the midpoint in space and at a time that is either (a) 25ms after the offset of the first dot (so during the gap, 25ms before the onset of the second dot) or (b) 25ms after the onset of the second dot. We run two conditions, but for each trial we only present one probe at one of these two times. The subject's task is a forced choice: they must report the color of the probe (which is always either red or green, randomly assigned per trial). Note that the probe's color is independent of the dots' colors (so the probe could be red or green, regardless of the first dot being red and the second green). The subject is instructed to ignore the moving dot and just report the probe's color.

