  ### Experimental Design: The Probe Interference Test

  **Scenario:**  
  Participants view a sequence: a red dot appears at location A (left) for 50ms, followed by a blank screen (gap) for 50ms, then a green dot at location B (right) for 50ms—inducing the color phi illusion. Crucially, a third stimulus—a brief (10ms) static shape (e.g., a blue square)—is flashed at a neutral location C (vertically centered, midway between A and B, but offset horizontally to avoid the motion path). The probe’s timing varies: it appears either (1) 25ms after the offset of the first dot (during the gap) or (2) 25ms after the onset of the second dot (during its display). In the critical condition (2), the probe is always presented during the second dot. After each trial, participants give a forced-choice response: "Was the shape a square or a circle?" (the shape varies randomly per trial, with circle as the distractor). The gap duration (50ms) is fixed for the illusion, but probe timing (condition 1 or 2) is randomized. Standard lab equipment (e.g., LCD monitor, millisecond timing) suffices.

  **Discriminating Response and Timing Window:**  
  The forced choice is the probe’s *shape* (square or circle), decoupled from dot color/location. The critical window is **25–75ms after the second dot’s onset** (i.e., during its display). If the probe is delivered outside this window (e.g., >100ms after the second dot), the accounts converge; inside it, they diverge. As the gap shrinks toward simultaneity (e.g., <20ms), the motion illusion weakens or vanishes, collapsing the predictions into equivalence (no divergence).

  **Cheating Alert:**  
  This design avoids assuming content-fixation at the second dot’s onset. The probe is delivered *during* the second dot, but the forced choice queries a feature (shape) independent of the dots’ features. It does not presuppose when experience is "settled," only that the probe occurs before the illusion is fully resolved.

  ---

  ### Predictions and Discriminating Feature

  - **Stalinesque Prediction:**  
    The motion illusion (including color swap) is pre-computed as a unified "package" before conscious access. The probe during the second dot (condition 2) is processed after this package is fixed, so it is experienced as a distinct, non-integrated event. Subjects accurately report the probe shape (e.g., "square") because it doesn’t interfere with the pre-constructed illusion.

  - **Orwellian Prediction:**  
    The initial experience includes the stationary first dot and the onset of the second dot. The probe during the second dot is experienced as concurrent with it. Later revision overwrites the raw experience to insert the illusory motion and color swap. This revision *also* overwrites the probe’s memory because it is temporally and spatially proximate to the edited event (even if not on the motion path), causing interference. Subjects show near-chance accuracy (∼50%) for the probe shape in condition 2 (e.g., misreporting "circle" due to memory corruption).

  **Discriminating Feature:**  
  The probe’s *timing relative to the second dot* (during-gap vs. during-second-dot). Divergence hinges on the probe appearing during the second dot (condition 2), where Stalinesque predicts high accuracy and Orwellian predicts low accuracy. In condition 1 (during-gap), both predict high accuracy (control). Shape is the key feature—it is orthogonal to the dots’ attributes, forcing the accounts to disagree on whether the probe is "protected" from revision.

  **If Feature Removed:**  
  Without the shape probe (or an analogous third feature), the design reverts to the classic phi ambiguity—both accounts explain the motion report identically.

  ---

  ### Counterattack and Survival

  **Steelman of Multiple-Drafts Counterargument:**  
  The multiple-drafts view rejects discrete "fixation" points. It argues:  
  1. **Probe as fixation event:** The forced-choice report *itself* creates a new "draft." Any probe-related content is overwritten by later processes (e.g., the motion narrative) before the response is generated. Thus, poor accuracy in condition 2 reflects overwriting by the dominant motion draft, not Orwellian revision.  
  2. **Temporal smearing:** The probe and second dot are processed in parallel drafts. The motion draft dominates post-hoc, so any probe detail that differed from the final narrative was never stably encoded—it wasn’t "revised" because it was never finalized.  
  3. **No divergence:** The accounts only *seem* to disagree because we impose a binary (Stalinesque vs. Orwellian) framework on continuous processing. In reality, the probe response is determined by which draft "wins" at report time, making the predictions empirically indistinguishable.

  **Does the Design Survive?**  
  **No—** the counterattack undermines the divergence. If the probe is overwritten by later drafts (e.g., the motion illusion) before the response, both Orwellian and multiple-drafts predict low accuracy in condition 2, while Stalinesque is invalidated. This reduces the design to equivalence.

  **Modification to Survive:**  
  To salvage divergence, modify the task:  
  - **Immediate shape report:** Use a dual-task paradigm. During the trial, participants perform a secondary task (e.g., pressing a key when they detect a faint tone piped through headphones concurrent with the probe). The tone ensures attention to the probe *at that moment*, and the keypress forces a response *before* post-dot revisions can overwrite it. The forced-choice shape query still occurs post-trial.  
  - **Why it works:** The keypress timestamp verifies probe awareness *during* the event, creating a "timestamped draft" resistant to overwriting. Stalinesque predicts high shape accuracy (probe was distinct), while Orwellian predicts low accuracy (revision corrupts shape memory despite the keypress). The multiple-drafts view must concede that the keypress "fixes" the probe draft, allowing divergence.  
  - **Trade-off:** This adds complexity (potential attentional confounds) but closes the overwriting loophole.
