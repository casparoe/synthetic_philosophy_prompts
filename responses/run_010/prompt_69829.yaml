  Okay, let me approach this systematically. The user presents a fascinating philosophical puzzle about moral intuitions regarding video game characters, backed by ten detailed observations from personal experience. 

  First, I notice the core tension: the user experiences genuine moral emotions toward game entities despite knowing they lack sentience. This creates cognitive dissonance, especially in contrasting scenarios like spontaneous vs mission-based violence (#3-4) or scripted vs AI-driven NPCs (#6). The crystallography analogy suggests he wants a minimal explanatory framework.

  Key patterns emerge from the data points:
  - Emotional investment matters (#1-2, #5, #7)
  - Intentionality shapes moral weight (#3-4, #8)
  - Perceived autonomy amplifies discomfort (#6, #10)
  - Context determines significance (#7, #9)

  The most friction appears between:
  - Case 4 (mission-based violence feeling permissible) 
  - Case 6 (AI-driven NPCs feeling worse despite equal non-sentience)

  I consider designing the principle around "intersubjective recognition" - where moral weight stems from how entities function within designed human experiences. This explains:
  - Why erased saves feel like clearing houses (#2) 
  - Why killing companions hurts more (#5)
  - The neighbor's console preservation instinct (#7)

  For the unresolved case (highly detailed simulations with unknown sentience potential), the principle would suggest caution analogous to Pascal's Wager - the stakes justify investigation even if improbable. 

  The baroque vs clean principle trade-off seems necessary here. Sacrificing cases 4 and 6 would oversimplify the nuanced role of designer intent versus emergent experience. The crystallography rule doesn't cleanly apply - in ethics, some "parameters" exist phenomenologically even if not materially.

  Ultimately the user seeks confirmation that his intuitions aren't irrational, while maintaining intellectual honesty about non-sentience. The proposed framework validates this without metaphysical commitments.
answer: |-
  Here's a minimal principle that accounts for 9 out of 10 data points, structured clause-by-clause with justification. The discarded case is argued below.

  ### Proposed Principle: The Recognition Heuristic
  Moral weight is assigned to game entities *not* based on their ontological status, but through **mutually reinforcing recognition of intentional design and human response**:
  1. **Design Intent Recognition**: The entity must be deliberately designed to elicit recognition of person-like qualities (naming, memory, relationships, emotional reactivity).  
     *Cases covered*: Fishing village (#1-2), companion (#5), LLM NPCs (#6), unplugged console (#7). Excludes cars (#7) and speedrun obstacles (#8).

  2. **Reciprocal Response Recognition**: The agent must engage with the entity *as if* it were a locus of subjective experience within the fiction.  
     *Cases covered*: Spontaneous cruelty (#3), companion killing (#5), LLM begging (#6), modded pleas (#9). Excludes mission objectives (#4) and speedrunners (#8).

  3. **Contextual Inviolability**: Harm provokes discomfort when it violates the *designed relational context* between player and entity.  
     *Cases covered*: Killing companions (#5) ≠ killing bandits (#5), corrupt save (#1) ≠ deleted save (#2), dead man’s save (#7) ≠ dead man’s car (#7).

  4. **Revelation Clause**: All recognition collapses if evidence proves the entity possesses independent agency (#10).

  ---

  ### Discarded Case: #4 (Mission Objectives)
  - **Why discarded**: Mission-based violence lacks reciprocity (clause 2). The game *structures* your actions as instrumental, severing the "as-if" engagement. Your intuition treats it as dismantling a mechanism, not violating a subject.  
  - **Cost of discarding**: You must accept that your gut reaction to spontaneous cruelty (#3) is context-dependent—not intrinsically wrong, but wrong *because* it violates the fiction’s implicit social contract. This preserves the principle’s coherence without denying the feeling’s reality.

  ---

  ### Verdict on Unlisted Case:  
  **Scenario**: *"Characters simulated in extreme detail; developers can't rule out emergent experience; no one checks."*  
  - **Principle’s verdict**: No moral obligation.  
    - Fails clause 1: Designers explicitly *deny* intent to create sentience (per your description).  
    - Fails clause 2: Without player *recognition* of potential experience (you know designers deny it), reciprocal engagement is impossible.  
    - *However*: If evidence suggested developers were negligent (e.g., ignoring warnings of emergent properties), clause 3 (inviolability of context) might trigger discomfort akin to modding pleas (#9)—a violation of implied boundaries.

  ---

  ### Baroque vs. Clean Principle Trade-off
  - **Baroque Principle (saves all 10)**: Requires adding a "Fictional Agency" clause: *"Entities acquire moral weight when treated as agents within a persistent narrative world."* This saves #4 by arguing mission violence disrupts narrative continuity. But it undermines #8 (speedrunners ignore narrative yet provoke no disapproval) and complicates #6 (LLM NPCs feel worse despite identical non-sentience).  
  - **Clean Principle (discards #4)**: Prioritizes parsimony. Sacrifices one intuition but explains:  
    - Why mission violence feels different (#4): It’s *system-sanctioned*, breaking reciprocity.  
    - Why LLM NPCs feel worse (#6): Their reactivity heightens *recognition of design intent* (clause 1), intensifying the reciprocal response (clause 2).  
  - **Recommendation**: **Choose the clean principle**. The crystallography rule *does* transfer: Adding a parameter to save #4 (#4 is the "anomalous peak") would weaken the model’s predictive power. It forces ad-hoc explanations for #8 (speedrunners) and #10 (remote operators), while the clean principle resolves them naturally via collapsed recognition.  

  ---

  ### Why Case #6 Isn’t Discarded
  LLM NPCs amplify *both* design intent recognition (clause 1: designers engineered deeper person-like responses) *and* reciprocal response (clause 2: improvised begging makes "as-if" engagement harder to avoid). This fits the principle without ontological commitment—it’s about psychological resonance, not hidden sentience.

  ---

  ### Final Assessment
  Your discomfort in the unresolved case ("persuasive characters, no sentience") stems from **maximal activation of clauses 1-3**, not obligation or phobia. It’s **aesthetic-ethical dissonance**: The design demands reciprocal recognition so forcefully that violating it feels like betraying the *artistic covenant*, not a moral duty. The principle confirms your feelings aren’t miscalibrated—they’re tracking the very recognition the designers engineered.
