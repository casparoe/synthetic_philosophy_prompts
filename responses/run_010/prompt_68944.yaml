    - Round 2: Gen B gets the remaining chips (for Round 2) and can revise? Actually, no revision for Round 2 because there is no Round 3. But they might want to take from Round 2 and put it where? Instead: after Gen A sets aside for Round 1, Gen B gets the rest for Round 2. But they cannot revise because there's no future round. To show dynamic inconsistency, we need Gen B to have made an initial allocation that they then experience? 
