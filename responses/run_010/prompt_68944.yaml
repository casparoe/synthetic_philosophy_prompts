    - Step 1: Gen A (as present) allocates 100 chips between R1 (for themselves) and R2 (for Gen B). They write it down.
    - Step 2: Gen A is now in R1 and they can revise: they can take some chips from R2 and put in R1, but every chip they take from R2 costs 1 chip (as a fee) that is removed. So if they move 10 chips from R2 to R1, they pay 10 chips as a fee, so R1 gains 10 chips, R2 loses 20 chips (10 moved and 10 fee). They set aside R1 chips.
