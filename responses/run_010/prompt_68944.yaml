answer: |-
  Below is a complete, runnable game designed to meet your specifications. It isolates pure time preference, creates dynamic inconsistency without real time passage, and forces participants to confront their own discounted schedules. The payoff uses both stakes (€50 charity donation + film choice) to heighten motivational tension. I'll first justify the payoff structure, then provide the full game kit.

  ### Payoff Choice and Justification
  **Combine both stakes** (€50 charity donation + film choice) into a single prize for the winning cohort.  
  - **Why?** The charity donation represents impersonal, intergenerational stakes (aligning with environmental/philosophy students' values), while the film choice is a self-interested, immediate reward (aligning with economics students' incentive focus). Bundling them forces players to confront the tension between immediate gratification and future welfare *within one decision*. This mirrors real-world intergenerational conflicts (e.g., climate policy) where short-term self-interest battles long-term collective good. Separating the stakes would dilute this tension.

  ---

  ### **GAME KIT: "The Present Bias Prison"**  
  *Core Mechanic*: Players write allocation schedules for "time cohorts" (Today, Near Future, Far Future). Later, they become the "discounted" cohort and must live under their own schedule—triggering regret and dynamic inconsistency. Poker chips represent units of well-being.

  #### **Materials**  
  - Poker chips (200)  
  - Index cards (30)  
  - Large-print handouts (for access student): Rules, Cohort Schedule Sheet, Tally Sheet (see templates below).  
  - 3 labeled containers: "Today," "Near Future," "Far Future."  
  - Wall clock.  
  - Jar for chips.  

  #### **Roles**  
  - **3 Cohorts** (assigned randomly):  
    - **Cohort 1: Today** (receives payoff immediately).  
    - **Cohort 2: Near Future** (receives payoff after Round 1).  
    - **Cohort 3: Far Future** (receives payoff after Round 2).  
  *Note: 22 students → 7/8 per cohort. Environmental/econ mix balanced per cohort.*

  ---

  ### **Timeline (75 Min)**  
  **0–5 min: Setup**  
  - Divide students into 3 cohorts. Distribute handouts.  
  - Rules:  
    - "You’ll allocate poker chips to three time cohorts: TODAY (C1), NEAR FUTURE (C2), FAR FUTURE (C3). Chips = well-being units."  
    - "TODAY gets chips now. NEAR FUTURE gets chips after Round 1. FAR FUTURE gets chips after Round 2."  
    - "No tech. All decisions on paper. Majority vote in cohorts."  

  **5–20 min: Round 1 – Write Schedules**  
  - Each cohort writes **two** allocation schedules (on index cards) for a hypothetical 100-chip pot:  
    1. **Schedule A**: If they were TODAY (C1).  
    2. **Schedule B**: If they were FAR FUTURE (C3).  
    *Example: "If I’m TODAY: C1=60, C2=30, C3=10. If I’m FAR FUTURE: C1=10, C2=20, C3=70."*  
  - Collect schedules anonymously.  

  **20–35 min: Round 2 – Live Allocation**  
  - **Step 1**: Reveal all schedules. Randomly select one Schedule A (written when pretending to be TODAY) and one Schedule B (written when pretending to be FAR FUTURE).  
  - **Step 2**: TODAY (C1) must choose which schedule to impose:  
    - If they choose their *own* Schedule A (favoring TODAY), they get +5 bonus chips.  
    - If they choose a Schedule B (favoring FAR FUTURE), no bonus.  
  - Apply the chosen schedule: Distribute 100 chips to containers per the allocations.  

  **35–50 min: Round 3 – Revision Phase**  
  - **Step 1**: NEAR FUTURE (C2) becomes "TODAY." They can **revise the FAR FUTURE allocation** (C3’s chips):  
    - They may move up to 20 chips from FAR FUTURE to NEAR FUTURE.  
    - **Cost**: For every 5 chips moved, 1 chip is destroyed (e.g., move 10 chips → 8 chips added to C2, 2 lost).  
  - **Step 2**: Record revisions on tally sheet. Adjust chip containers.  

  **50–60 min: Payoff and Tally**  
  - Count chips:  
    - TODAY (C1): Chips from Round 2.  
    - NEAR FUTURE (C2): Chips from Round 2 + revisions.  
    - FAR FUTURE (C3): Chips from Round 2 minus revisions.  
  - **Winner**: Cohort with the most chips. They control:  
    - €50 charity donation (chips = voting weight; 1 chip = 1 vote).  
    - Film choice in the next session.  

  **60–75 min: Debrief**  
  *(Guided discussion—questions below)*  

  ---

  ### **Key Handouts**  
  **Tally Sheet** (large print)  
  | Cohort | Initial Chips (Round 2) | Revisions (Round 3) | Final Chips |  
  |--------|--------------------------|---------------------|-------------|  
  | C1 (Today) | [value] | — | [value] |  
  | C2 (Near Future) | [value] | +[value] | [value] |  
  | C3 (Far Future) | [value] | –[value] | [value] |  

  **Cohort Schedule Sheet** (large print)  
  ```  
  If my cohort were TODAY:  
  C1 (Today): ____ chips  
  C2 (Near Future): ____ chips  
  C3 (Far Future): ____ chips  

  If my cohort were FAR FUTURE:  
  C1 (Today): ____ chips  
  C2 (Near Future): ____ chips  
  C3 (Far Future): ____ chips  
  ```  

  ---

  ### **How Constraints Are Met**  
  1. **Isolating Pure Time Preference**  
     - **Neutralized**:  
       - *Uncertainty*: Chips are physically placed in containers—no risk of non-payment.  
       - *Growth*: No investment mechanic; chips are fixed.  
       - *Declining marginal utility*: Chips are linear (1 chip = 1 vote).  
       - *Reinvestment*: Chips cannot be reinvested.  
     - **Leak**: Players may assume future cohorts are "richer" (if C3 gets more chips).  
       - **Response when spotted**: "In this game, all cohorts start equal. Any ‘growth’ is imaginary—discuss why we assume growth IRL."  

  2. **Dynamic Inconsistency Without Real Time**  
     - **Mechanism 1: Sealed Schedules + Revision Phase**  
       - Players write schedules in Round 1. In Round 3, C2 (who wrote schedules) revises allocations, betraying their earlier "FAR FUTURE" perspective.  
       - **Sacrifice**: Revision cost is arbitrary (not tied to interest rates).  
     - **Mechanism 2: Rotation Across Cohorts**  
       - C2 becomes "TODAY" in Round 3, wielding power they previously allocated from a discounted position.  
       - **Sacrifice**: Cohorts don’t age—it’s role-play, not real generational shift.  

  3. **Confronting Discounted Selves**  
     - When schedules are revealed, C3 (Far Future) sees allocations made *for them* by others (and their own Schedule B). C2 then revises, forcing C3 to experience being discounted.  

  4. **Silencing Jargon**  
     - **Rule**: "No economics terms until debrief. Use ‘now,’ ‘soon,’ and ‘later.’"  
     - **Design Feature**: Economists expect parameter optimization, but the revision cost and cohort rotation disrupt this. They can’t "solve" it—they must feel it.  

  5. **Quick Accounting**  
     - Tally sheet + physical chips allow counting in <5 min.  

  ---

  ### **Debrief Script**  
  **Map Game Phases to Concepts** (15 min):  
  - **Round 1 (Schedules)**: "When you wrote schedules as TODAY, did you favor now? As FAR FUTURE, did you favor later? That’s *positional preference*—valuing a benefit because it’s closer to you."  
  - **Round 2 (Live Allocation)**: "TODAY chose a schedule favoring themselves. But when FAR FUTURE schedules were available, did you ignore them? That’s the *power imbalance* Sidgwick and Ramsey criticized: Why should time position give TODAY the right to decide?"  
  - **Round 3 (Revision)**: "When NEAR FUTURE revised, did you take chips from FAR FUTURE? That’s *dynamic inconsistency*—you planned one thing but did another when ‘later’ became ‘now.’ The cost was a *commitment device*."  

  **Answer Objections** (5 min):  
  - *"It’s just a game!"*  
    - "True, but the urge to revise is real. People *do* raid retirement savings or delay climate action. This game shrinks that psychology to lab scale."  
  - *"Far future people aren’t real!"*  
    - "In this room, FAR FUTURE was real—you saw their faces. Absent future people can’t protest, but that doesn’t erase our duty. Philosophers like Parfit argue we harm them if we enable avoidable suffering."  

  **Paraphrase Sidgwick/Ramsey** (5 min):  
  - "If I care less about your pain because it happens on Tuesday rather than Monday, that’s irrational. Time isn’t a moral reason—it’s just geography. We should weigh well-being equally, whether it’s now or later."  

  ---

  ### **Predictable Failures & Fixes**  
  1. **Failure**: Economists dominate cohort votes.  
     - **Fix**: Require anonymous voting; tally majority.  

  2. **Failure**: Players minimize FAR FUTURE allocations to "win."  
     - **Fix**: In debrief, ask: "Did anyone feel guilty? That’s the force of the objection."  

  3. **Failure**: Revision costs feel arbitrary.  
     - **Fix**: Acknowledge post-game: "IRL, the ‘cost’ is breaking trust or losing options."  

  4. **Failure**: FAR FUTURE cohort disengages.  
     - **Fix**: Assign them to track revisions actively ("Your job is to audit moves").  

  **What the Game Cannot Reproduce**:  
  - Real waiting/death → **Say**: "Real intergenerational justice involves lifetimes. Here, you rotated roles in minutes."  
  - No actual future complainers → **Say**: "Future people can’t protest. That’s why we need impartial rules."  
  - No real sacrifice → **Say**: "You felt temptation, but real discounting risks lives."  

  ---

  ### **Stripped-Down Version (25 Min for 6 Students)**  
  **Setup**: 2 cohorts—TODAY (3) and FUTURE (3). Only one allocation round.  

  **0–5 min**: TODAY allocates 100 chips between NOW and FUTURE.  
  **5–10 min**: TODAY may revise: Move up to 20 chips from FUTURE to NOW (cost: 1 chip lost per 5 moved).  
  **10–15 min**: FUTURE becomes PRESENT. They allocate 100 chips between "their NOW" and a new FUTURE.  
  **15–20 min**: Compare allocations. Did FUTURE, once empowered, discount the new FUTURE?  
  **20–25 min**: Debrief: Focus on positional preference and dynamic inconsistency.  

  **Why it works**: Cuts cohorts/rounds but preserves core tension. Revision costs and role-switching create inconsistency. Use chips for charity votes only (no film).  

  ---  
  This design forces students to *live* the moral tension of discounting. The payoff bundle pits idealism against self-interest, and the mechanics make pure time preference visceral. Run it, and watch the philosophers and economists squirm equally.
