prompt: |-
  I co-teach a third-year interdisciplinary seminar on intergenerational justice — 22 students, roughly half of them economics majors who have already sat through a lecture on social discount rates and treat the question as a technical parameter to be estimated, the rest philosophy and environmental science students who mostly arrive convinced that discounting the future is simply wicked. Neither side has ever had to *do* anything with the intuition. On Thursday I have a single 75-minute session in a flat-floor room with movable tables, a photocopier down the hall, index cards, a wall clock, and a jar of 200 poker chips. No laptops or phones during the activity: one student has an access arrangement requiring paper materials in large print, so anything you design needs to work as a handout. I also have something genuinely at stake to offer rather than pretend money — the department's student-engagement fund has given me €50 that will actually be donated, at the end of term, to whichever charity the class's final allocation decision selects, and separately I control the last twenty minutes of the following session, which the class normally spends choosing and watching a film. Tell me which of those two to make the payoff, or whether to combine them, and justify the choice in terms of what it does to the decisions people make.

  What I want the session to produce is the felt force of *pure time preference* in both directions at once: the pull of preferring a benefit merely because it is nearer, and the force of the classical objection — going back to Sidgwick and taken up by Ramsey, and which I would like you to paraphrase rather than quote — that a mere difference of position in time cannot itself be a rational ground for preferring one state of affairs to another. Please design a runnable game that delivers this, and build it to satisfy five constraints I care about most. First, the rules must isolate positional preference from its usual companions: the probability that a promised future payoff actually arrives, the expectation that future recipients will be richer, declining marginal utility of consumption, and the option to reinvest in the meantime. Tell me exactly which of those four your mechanics neutralize and how, which ones unavoidably leak in, and what I should say when a student spots the leak. Second, the game must generate dynamic inconsistency inside one session in which no real time passes at all — someone must end up wanting to revise a plan they themselves wrote minutes earlier, and the revision must cost them something. Offer me at least two mechanisms for this (sealed plans and a revision phase, rotation across cohorts, a market in pre-commitments, whatever you prefer), and say plainly what each one sacrifices in realism. Third, there must be a moment, produced by the rules and not by anything I say, where a participant's own allocation schedule gets applied to them from a position they had earlier discounted away. Fourth, nobody may hear the phrases "pure time preference" or "discount rate" until the debrief, and you should tell me how to stop the economics students from announcing the answer in minute six — whether by a speaking rule, by a design feature that leads them to expect the standard instrumental story and then disappoints it, or both. Fifth, all accounting must be completable in under five minutes by people who are not accountants.

  Deliver the full kit: a materials list, roles if any, a minute-by-minute timeline for the 75 minutes, the tally sheet, the payoff scheme, and the debrief. The debrief should map each phase of what just happened onto a component of the idea — positional preference as against uncertainty, growth, and marginal utility; the thought that a discounted future self is not quite me; the commitment problem — and should give me my answers to the two objections I am certain will be raised, namely that this was only a game so of course people revised, and that the far future matters less because those people are not real. Then be honest with me about failure: at least four things that will predictably go wrong the first time I run this, with a fix for each, and a frank statement of what the activity cannot reproduce and that I as facilitator will have to supply verbally — I assume this includes the absence of any real waiting, of any real death, and of any actual future person in the room with standing to complain about the schedule being written. Finally, give me a stripped-down 25-minute version for a tutorial group of six, since this session is the first thing the timetable office will cut if the term runs short.
reasoning: |-
  We are designing a game to illustrate pure time preference and the objection that mere difference in time should not be a rational ground for preference. The game must avoid the usual companions of discounting (uncertainty, growth, marginal utility, reinvestment) and create dynamic inconsistency in a single session without real time passing. It must also allow participants to experience their own allocation schedule from a discounted position. We'll avoid using technical terms until the debrief.

  **Core Idea:** 
  We simulate different time periods (e.g., "now", "near future", "far future") using a round structure. Players are grouped into "generations" that are active in different rounds. Each player allocates poker chips (representing resources) across these time periods, but the catch is that the allocation in each period is determined by the generation that is active in that period. However, when it's a generation's turn to be in the "now", they may want to reallocate the resources that were pre-committed by previous generations (including themselves in a previous role) to later periods.

  **Game Title:** "The Time Machine"

  **Materials:**
  - Poker chips (200)
  - Index cards (one per player, plus some extra)
  - A wall clock
  - A tally sheet (on a large paper or whiteboard)
  - Handouts (for the access student, and for all if needed) with instructions and decision sheets.
  - A jar for collecting votes/poker chips.

  **Setup:**
  - The class is divided into 3 generations: Generation A (round 1: present), Generation B (round 2: near future), Generation C (round 3: far future). Each generation has about 7-8 students (if 22 students, then 7-7-8). Each student gets an index card and a pencil.
  - The three time periods are labeled: Round 1 (Today), Round 2 (10 years from now), Round 3 (100 years from now). But note: no real time passes, only rounds.

  **The Game:**
  1. **Initial Allocation (15 minutes):** 
     - Each generation, acting as if they are in the present, must allocate 100 poker chips (total for the class) across the three time periods. They must decide how many chips go to each period. But note: the chips allocated to a period are for the generation in that period to use. However, each generation only gets to decide the allocation when they are in the present (Round 1). 
     - How: Each generation meets separately and decides on an allocation (for Round 1, Round 2, Round 3) by majority vote. They write their allocation on an index card (e.g., R1: X, R2: Y, R3: Z, with X+Y+Z=100) and sign it. They hand it to the instructor.

  2. **Revelation and Revision (20 minutes):**
     - The instructor reveals the allocations made by each generation for when they were in the present (so we have three allocation schedules: one from Gen A, one from Gen B, one from Gen C). 
     - Now, we simulate each round in sequence:
       - Round 1 (Today): Generation A is in charge. They must implement the allocation they decided in step 1. But now, they are allowed to revise it. They can reallocate the 100 chips. However, if they change the allocation, they must pay a "revision cost" of 10 chips (taken from the total, so the new total for distribution is 90). They record their final allocation for Round 1 and set aside the chips for Round 1 (to be given to Gen A at the end of the game). The rest (for R2 and R3) are left for the future rounds.
       - Round 2 (10 years from now): Generation B is now in charge. They find that the chips allocated to Round 2 by the previous generations (including their own initial allocation) are available. But note: the chips for Round 2 were set by the initial allocation of Gen A (if Gen A didn't revise) or by Gen A's revision. However, Gen B now has the power to reallocate the remaining chips (those allocated to Round 2 and Round 3) between Round 2 and Round 3. They can take the chips that were meant for Round 3 and put them in Round 2, but they pay a revision cost of 10 chips (so total for R2 and R3 becomes 10 less). They set aside the chips for Round 2 (for themselves) and leave the rest for Round 3.
       - Round 3 (100 years from now): Generation C is in charge. They get whatever is left (after any revisions) for Round 3.

  3. **Payoff (10 minutes):**
     - The chips each generation receives are converted into votes for the charity donation. Each chip equals one vote. The charity with the most votes gets the €50 donation.
     - Additionally, the generation that ends up with the most chips (votes) wins the right to choose the film in the next session (or if combined, the charity donation and the film choice are both awarded to the generation with the most chips).

     **Justification for the payoff:** Making the payoff about the charity donation and the film choice (both real stakes) will motivate students. The film choice is a more immediate and personal reward, while the charity donation is more about the collective good. We combine them: the generation with the most chips gets to choose the charity (with their chips as votes) AND gets to choose the film. This creates a strong incentive to maximize chips for one's own generation, which will drive time preference.

  4. **Tallying and Outcome (5 minutes):**
     - Count the chips each generation received (from their respective rounds) and declare the winning generation. They then vote on the charity (using their chips as votes) and decide the film.

  **How the Game Meets the Constraints:**

  1. **Isolating Pure Time Preference:**
     - **Uncertainty:** We neutralize by having the rounds happen immediately one after the other with no chance of non-payment. The chips are physically present and set aside. However, there is a leak: when a generation revises, they are effectively taking resources from the future, which might be seen as a form of uncertainty (the future generation might fear revision). We say: "In this game, the only uncertainty is the strategic behavior of the generations. In the real world, uncertainty about the future is a separate issue that we are not modeling here. We are focusing on the preference for now versus later when the outcome is certain."
     - **Growth and Marginal Utility:** We assume that each chip has the same utility and that there is no growth. We do not model increasing wealth over time. We say: "Each chip represents a unit of benefit that is constant over time. We are not considering that future generations might be richer or that the marginal utility of chips might decrease." The leak: if students think that the film choice is more valuable to them now than the charity donation (which is for an abstract future), that might mimic declining marginal utility. We can note that in the debrief.
     - **Reinvestment:** There is no opportunity to invest the chips to get more later. The chips are fixed and cannot be grown. We explicitly say: "Chips cannot be invested to produce more chips. They are simply to be allocated."

  2. **Dynamic Inconsistency:**
     - **Mechanism 1: Sealed Plans and Revision Phase.** Each generation makes a plan (allocation) for all periods when they are in the present. Then, when they actually become the present generation (in their round), they get a chance to revise, but at a cost. This mirrors how people plan for the future but then change their mind when the future becomes the present. 
       - *Sacrifice in realism:* The cost is arbitrary and doesn't correspond to a real-world cost. Also, in real life, revision might not have a fixed cost.
     - **Mechanism 2: Rotation Across Cohorts.** Each generation is in charge in one round and then becomes passive. They experience the allocations made by others and then their own when they are in power. They also see that when they become the present, they want to take more for themselves (now) at the expense of the future, even if they had previously allocated less to the present when they were making the initial plan.
       - *Sacrifice in realism:* In real life, generations don't rotate in a single room in 75 minutes. Also, one person might be in multiple generations, but here we separate them.

  3. **Applying the Allocation Schedule from a Discounted Position:**
     - When Generation B becomes the present (Round 2), they receive the allocation that Generation A (which included them in a different role? No, they are distinct) set for Round 2. But note: in the initial allocation, each generation made a plan when they were the present. Then, when it's Round 2, Generation B is the present and they get the allocation that was set for Round 2 by the previous present (Gen A). They then have the power to revise. So they experience being the recipient of a past allocation and then having the power to change the future.

     But note: each generation only makes one initial allocation (when they are in the present in step 1). Then, they experience being the generation in their round and having the chance to revise. However, for Generation A, they are the present in Round 1 and they immediately get to revise. For Generation B, they are the future in Round 1, then become the present in Round 2. They see what was allocated for Round 2 and then get to revise the remaining (for Round 2 and 3). Similarly for Generation C.

  4. **Avoiding Technical Terms and Premature Revelation:**
     - We never use the words "discount rate" or "pure time preference". We call the rounds "today", "10 years from now", "100 years from now". We call the allocations "resource distribution".
     - To stop economics students from announcing the answer: 
       - **Speaking Rule:** At the start, say: "This is a simulation about resource allocation over time. Please avoid using technical economic terms during the game. We are trying to experience the decisions from a fresh perspective."
       - **Design Feature:** The game has a twist because of the revision phase and the costs. The economics students might expect that they can set an optimal discount rate, but then they are confronted with the temptation to revise and the cost of doing so. Also, the fact that they are in a generation that might be in the future (and hence at the mercy of prior generations) might surprise them.

  5. **Quick Accounting:**
     - We use poker chips that are physically moved. The instructor keeps a tally sheet that tracks:
       - Initial allocations (from each generation)
       - Revised allocations (and the cost taken out)
     - The chips for each round are set aside in labeled containers. At the end, we count the chips in each container (for Round 1, Round 2, Round 3) and assign to the respective generation.

  **Timeline (75 minutes):**

  - **0-5 min:** Introduction and grouping. Explain the three time periods and the three generations. Assign each student to a generation. Explain the goal: to allocate resources (poker chips) across the three periods. The chips will determine votes for charity and the film choice. Rules: no phones, no laptops. Hand out index cards and pencils. (5 min)
  - **5-20 min:** Initial Allocation. Each generation meets separately to decide how to allocate 100 chips across the three rounds (R1, R2, R3). They write it on the card and hand it in. (15 min)
  - **20-40 min:** Revision Phase. 
    - Round 1: Generation A is called up. The instructor reveals Gen A's initial allocation. They can revise (with a 10-chip cost) and then set aside the chips for R1. (7 min)
    - Round 2: Generation B is called up. The instructor shows the current allocation for R2 and R3 (from Gen A's revision or initial). Gen B can reallocate the remaining chips (for R2 and R3) with a 10-chip cost. They set aside chips for R2. (7 min)
    - Round 3: Generation C is called up. They get the remaining chips for R3. (1 min)
    - (Total 15 min, but we have 20 allocated for flexibility)
  - **40-50 min:** Tallying and Payoff. Count the chips for each generation. Declare the winning generation (most chips). That generation then uses their chips to vote for a charity (each chip is a vote) and chooses the film. (10 min)
  - **50-75 min:** Debrief (25 min) - see below.

  **Debrief (25 min):**

  1. **Map the phases to concepts:**
     - Initial allocation: This is like setting a discount rate. But note that each generation, when in the present, allocated resources across time. They probably allocated more to their own period (pure time preference) and less to the future.
     - Revision phase: This shows dynamic inconsistency. When a generation becomes the present, they want to revise the plan they made (or that a previous generation made) to take more now (or in their period) and leave less for the future. The cost of revision is like a commitment device.
     - The experience of being in the future: Generation B and C experienced having their resources set by a previous generation and then having the power to change it when they became the present. This illustrates the objection: why should the mere fact of being earlier in time give one generation the right to allocate resources that affect later generations?

  2. **Key concepts:**
     - Pure Time Preference: The tendency to prefer benefits now just because they are now. We saw this in the initial allocations and in the revisions.
     - The Classical Objection (Sidgwick/Ramsey paraphrase): "It is not rational to value a benefit more simply because it happens sooner. The time at which a benefit occurs does not change its inherent value. Therefore, we should not discount the future merely because it is the future."
     - Dynamic Inconsistency: The plans we make for the future are not the same as the choices we make when the future arrives. We saw this when generations revised their allocations.

  3. **Answering Objections:**
     - "It was only a game so of course people revised." 
       - Response: "Yes, the stakes were low and the time frame was compressed. But the psychological impulse to revise when the future becomes the present is real. In real life, we see this in failures of savings, procrastination, and climate policy. The game is a metaphor for the commitment problem we face over long time horizons."
     - "The far future matters less because those people are not real."
       - Response: "In the game, the future generations were represented by your classmates. They were real and in the room. In the real world, future people are real too, even if we don't know them. The objection that they are not real is a form of bias. The moral question is: do we have obligations to people who don't exist yet? Many philosophers argue we do."

  **Predictable Failures and Fixes:**

  1. **Failure:** Students may not take the roles seriously, especially the future generations, because they know it's a game.
     - **Fix:** Emphasize the real stakes (charity and film) and that they are representing real interests. Also, in the debrief, highlight how the future generations felt when their resources were cut.

  2. **Failure:** The accounting might get messy with the chips.
     - **Fix:** Have a dedicated tally sheet and use containers for each round. Assign a student helper (from the access generation?) to help move chips.

  3. **Failure:** Economics students might try to optimize in a way that avoids the point (e.g., they might coordinate to not revise to avoid the cost).
     - **Fix:** The incentive to get more chips for their own generation is strong (to win the film). Also, the revision cost is small enough that revising might still be attractive. In the debrief, note that even if they didn't revise, the initial allocation likely showed time preference.

  4. **Failure:** The generations might not understand that they are making an allocation for all periods when they are in the present.
     - **Fix:** Clarify in the instructions: "When your generation is in the present (Round 1), you must decide how to split 100 chips among Round 1 (for your generation), Round 2 (for Generation B), and Round 3 (for Generation C)."

  **What the Activity Cannot Reproduce:**
  - Real waiting and the passage of time: The rounds happen in quick succession.
  - Real death: The generations are in the same room and are not actually replaced by death.
  - Actual future people: The future generations are represented by present people who are acting as proxies. They are not the actual future people who cannot speak for themselves.

  The facilitator must verbally explain that in the real world, the future generations are not present to defend their interests, which makes the commitment problem even harder.

