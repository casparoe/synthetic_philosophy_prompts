prompt: |-
  I am preparing the opening exercise for a two-day workshop on the concept of disease whose participants are mixed: philosophers of medicine, clinical epidemiologists, and a handful of practicing physicians with no philosophy training. The exercise must sort participants by what they actually believe about particular situations, not by which label they say they prefer; someone who announces that she is a naturalist should be fully capable of failing the instrument. I need from you the instrument and its key, in four components, in the following order.

  **1. The logical space, before the cases.** Identify four to six axis-questions whose answers generate the space of defensible accounts — for instance: whether statistical typicality itself carries any normative weight; whether disvalue is required, and if so whose valuations settle the matter (the subject's, the clinician's, the culture's, or nobody's); whether the reference class and the comparison environment can be fixed without pragmatic or evaluative judgment; whether the biological condition, the lived experience, and the social role must be treated as separate notions; whether "disease" picks out a kind in the world or a designation we apply for practical purposes. For each axis, state the available answers, and indicate which combinations are coherent and which collapse into one another.

  **2. Ten diagnostic cases.** Each case should run four to eight sentences of concrete stipulated detail, followed by two to four answer options written in plain descriptive language. No option may contain terms such as "dysfunction," "biostatistical," "reference class," "normative," or "value-laden," and no case may ask for a definition or invite the participant to name a position. At least seven cases must be built out of the following scenarios, which you should flesh out rather than replace:

  - A valley community in which industrial lead contamination has been universal for three generations. Median blood lead among nine-year-olds is roughly twenty micrograms per decilitre; local children score at the local mean on cognitive testing; there is no unaffected comparison population anywhere inside the valley.
  - Forty years hence, essentially every infant receives an implant that regulates blood glucose, and endogenous insulin output atrophies until the population median for pancreatic secretion is near zero. A child born outside the system retains ordinary pancreatic function.
  - An elite athlete who has deliberately induced cardiac remodeling and suppressed gonadal function through a training and pharmacological regime she endorses. She is a statistical outlier on a dozen physiological parameters, reports no complaint, and refuses all intervention.
  - A professional society lowers the numerical cut-point for hypertension by ten millimetres of mercury systolic. On that day roughly one adult in eight acquires a diagnosis; no measurement is repeated and nobody's body changes.
  - A woman with hemiparesis following a stroke who cannot walk unaided, who has genuinely revised her aims, who wants nothing she cannot do, and who reports that her life is complete. Give the contrasting verdict for the same impairment in a person who still wants to walk.
  - A thirty-year-old with an unruptured intracranial aneurysm, expected to rupture around fifty-five, producing no symptom and no measurable deficit now, for which no available treatment improves her expected outcome.
  - A molecular loss of function that is statistically rare and measurably reduces a protein's output, but confers protection against a lethal endemic infection at no cost.

  The remaining cases are yours to choose, but they must be ones on which the positions genuinely come apart. I would like at least one case in which a condition that is both harmful and impairing falls outside the remit the health system is officially authorized to exercise, and at least one case in which a condition long classified as a disorder is later declassified by professional vote with no change in the underlying biology. Where a case admits the answer that it is malformed as posed, you may include such an option, but phrase it concretely — "not until you tell me which population and which environment you are comparing against" — and the key must record which leaves choose it.

  **3. The scoring key.** Map answer patterns onto named leaves, which must include at minimum: Boorse's biostatistical account; Wakefield's harmful dysfunction; Nordenfelt's vital-goals account; a two-level view separating the biological condition from the lived and socially recognized ones; a view on which the profession's culturally sanctioned remit is itself constitutive; a pluralist view; and an eliminativist or skeptical view on which nothing answers to the concept. For each leaf, add one sentence naming the case it handles worst and why. Wherever a coherent pattern of answers corresponds to no position anyone defends, name that leaf "unoccupied" and say whether it is empty because the view is incoherent, because it is unattractive, or because it is merely unexplored.

  **4. Separability.** Identify every pair of leaves the instrument cannot in fact distinguish given these cases, and state what further case would distinguish them — or, if none exists, what the two positions would have to disagree about for their disagreement to be substantive.

  For each case, note which axis from component 1 it is diagnostic of, so that I can audit the instrument. Keep the register formal but readable by a clinician, and do not append a reference list or recommendations for further reading; naming the positions and their proponents is sufficient.
reasoning: |-
  Okay, I need to create a detailed opening exercise for a workshop on the concept of disease. The participants are a mix of philosophers of medicine, clinical epidemiologists, and physicians without philosophy training. The goal is to sort them based on their actual beliefs through concrete cases, not self-identified labels. Let me break this down step by step.

  First, the user wants four components in order: logical space with axis questions, ten diagnostic cases, a scoring key mapping answers to positions, and separability analysis for indistinguishable pairs. 

  For the logical space (Component 1), I recall major debates in philosophy of medicine. Key axes should cover: normative weight of statistics, necessity of disvalue and whose valuation matters, role of pragmatic judgment in reference classes, separability of biological/social/experiential aspects, and whether disease is a natural kind or practical designation. I need 4-6 axes that generate coherent combinations. For example, if someone thinks disvalue is irrelevant (Axis 2), they likely reject Wakefield's harmful dysfunction. I'll list possible answers and note where positions collapse, like how rejecting all disvalue might align with strict naturalism.

  Moving to cases (Component 2), the user provided seven scenarios to flesh out. The lead contamination case tests statistical typicality versus harm. For the implant scenario, I'll contrast endogenous function loss versus absence of harm. The elite athlete case challenges dysfunction versus personal goals. The hypertension redefinition directly probes professional authority. The stroke survivor with revised aims examines disvalue dependence. The aneurysm case is about future harm versus current state. The protective mutation scenario questions rarity versus benefit. 

  I'll add three original cases: one where domestic violence isn't medically treated (testing health system remit), another where homosexuality is declassified (highlighting social construction), and a "universal trait" case like presbyopia to challenge statistical deviation. Each case will have concrete options avoiding jargon like "dysfunction." Where needed, I'll include "malformed" options phrased concretely.

  For the scoring key (Component 3), I'll map answer patterns to positions like Boorse, Wakefield, etc. Each position gets a "worst case" note—e.g., Boorse struggles with protective mutations. Unoccupied combinations (e.g., disvalue required but valuation irrelevant) will be labeled as incoherent or unexplored.

  Finally, separability (Component 4): I'll identify pairs like Wakefield and Nordenfelt that might agree on cases involving harm, then propose a case where biological function is disrupted without personal distress (e.g., asymptomatic arrhythmia) to distinguish them. For indistinguishable positions, I'll specify what they'd need to disagree on.

  Throughout, I'll tag which axis each case diagnoses for auditing. The language will stay clinician-accessible—no philosophy jargon in cases, though position names in the key are unavoidable. This structure should force participants to reveal actual beliefs while covering core debates in the field.
answer: |-
  Here is the workshop instrument designed to map beliefs about disease concepts onto the logical space of positions, with all components as requested:

  ---

  ### **1. Logical Space (4 Axes)**  
  *Each axis represents a core conceptual fork. Coherent combinations define positions.*

  **Axis 1: Statistical Typicality**  
  *Does statistical atypicality alone (without harm/benefit) carry normative weight for "disease"?*  
  - (A) Yes, atypicality is inherently significant.  
  - (B) No, atypicality only matters if linked to harm.  
  - (C) No, atypicality is irrelevant.  

  **Axis 2: Disvalue Requirement**  
  *Is disvalue (harm/suffering) necessary for "disease"? If so, whose valuation?*  
  - (A) Disvalue is unnecessary.  
  - (B) Disvalue is necessary, settled by the subject’s valuation.  
  - (C) Disvalue is necessary, settled by clinician/professional consensus.  
  - (D) Disvalue is necessary, settled by sociocultural norms.  

  **Axis 3: Reference Class Fixing**  
  *Can reference classes (e.g., age, species) and comparison environments be defined without pragmatic/evaluative judgment?*  
  - (A) Yes, biologically objective.  
  - (B) No, requires contextual/pragmatic choice.  

  **Axis 4: Ontological Unity**  
  *Are "biological condition," "lived experience," and "social role" inseparable aspects of disease?*  
  - (A) They are distinct and separable.  
  - (B) They are inseparable.  

  **Coherence Rules:**  
  - Choosing 1C *requires* 2A (if atypicality is irrelevant, disvalue cannot depend on it).  
  - Choosing 2A *permits* 1A or 1B but *invalidates* 1C.  
  - Choosing 4B *requires* 3B (inseparability implies contextual judgment).  

  ---

  ### **2. Ten Diagnostic Cases**  
  *Each case diagnoses one axis. Options avoid theoretical terms.*  

  #### **Case 1: Lead Contamination**  
  *(Diagnoses Axis 1)*  
  A remote valley has universal industrial lead exposure for three generations. Nine-year-olds have a median blood lead of 20 µg/dL (historically toxic elsewhere). They score average on local cognitive tests. No unexposed comparison group exists in the valley.  
  - (A) Children here have a disease.  
  - (B) These children are healthy.  
  - (C) Not classifiable until we compare them to unexposed children elsewhere.  

  #### **Case 2: Glucose Implants**  
  *(Diagnoses Axis 1)*  
  In 2060, 99% of infants receive implants regulating blood glucose. Natural insulin secretion atrophies; population median pancreatic function is near zero. An unimplanted child has normal function.  
  - (A) Implanted individuals have a pancreatic disease.  
  - (B) They are healthy; this is normal for their population.  
  - (C) Only the unimplanted child is healthy.  

  #### **Case 3: Elite Athlete**  
  *(Diagnoses Axis 2)*  
  A champion athlete intentionally alters her heart and suppresses gonadal function through training/drugs. She is a physiological outlier, reports no complaints, and refuses interventions.  
  - (A) She has a disease.  
  - (B) She is healthy.  
  - (C) Not classifiable without knowing if her choices align with her long-term goals.  

  #### **Case 4: Hypertension Redefinition**  
  *(Diagnoses Axis 3)*  
  A professional society lowers the systolic hypertension threshold by 10 mmHg. Overnight, 1 in 8 adults gains the diagnosis. No bodies or measurements change.  
  - (A) These individuals now have a disease.  
  - (B) They were and remain healthy.  
  - (C) Disease status depends on future risk, not today’s label.  

  #### **Case 5: Stroke Survivor**  
  *(Diagnoses Axis 2)*  
  A woman has post-stroke hemiparesis and cannot walk. She has revised her life goals, reports no unmet desires, and calls her life complete. *Contrast:* Same impairment in someone who wants to walk.  
  - (A) Neither has a disease.  
  - (B) Both have a disease.  
  - (C) Only the person who wants to walk has a disease.  

  #### **Case 6: Unruptured Aneurysm**  
  *(Diagnoses Axis 2)*  
  A 30-year-old has an unruptured brain aneurysm expected to rupture at ~55, causing severe deficit or death. It causes no symptoms or deficits now, and no treatment improves outcomes.  
  - (A) This is a disease now.  
  - (B) It is not a disease until symptoms appear.  
  - (C) It is a disease only if she values risk reduction.  

  #### **Case 7: Protective Mutation**  
  *(Diagnoses Axis 1)*  
  A rare genetic mutation reduces a protein’s function but confers complete protection against a lethal endemic infection at no cost.  
  - (A) This is a disease.  
  - (B) This is a health advantage.  
  - (C) Neither; it’s a biological variation.  

  #### **Case 8: Domestic Violence Injury**  
  *(Diagnoses Axis 4)*  
  A patient presents with injuries from chronic intimate partner violence. This causes physical/psychological harm and impairment but falls outside the health system’s official remit (designated as a legal/social issue).  
  - (A) This is a medical disease.  
  - (B) This is not a disease; it’s a social pathology.  
  - (C) It is a disease only if the health system accepts responsibility.  

  #### **Case 9: Homosexuality Declassification**  
  *(Diagnoses Axis 3)*  
  Homosexuality is removed from diagnostic manuals by professional vote after decades as a "disorder." Biology and prevalence are unchanged; only societal acceptance shifts.  
  - (A) It was always a disease and still is.  
  - (B) It was never a disease.  
  - (C) Its disease status depends on current professional consensus.  

  #### **Case 10: Universal Presbyopia**  
  *(Diagnoses Axis 4)*  
  In a hypothetical population, age-related farsightedness (presbyopia) is universal by age 50. All use corrective lenses; no one views it as impairing.  
  - (A) This is a disease.  
  - (B) This is normal aging.  
  - (C) Disease status depends on whether it limits social participation.  

  ---

  ### **3. Scoring Key**  
  *Patterns map to positions. Worst-case notes explain limitations.*  

  | **Leaf Position**              | **Answer Pattern** | **Worst Case & Why** |
  |-------------------------------|-------------------|----------------------|
  | **Boorse (biostatistical)**   | 1A, 2A, 3A, 4A    | Case 7: Protective mutation is statistically dysfunctional but beneficial. |
  | **Wakefield (harmful dysfunction)** | 1B, 2C/D, 3A, 4A | Case 5: Stroke survivor without disvalue challenges "harm" requirement. |
  | **Nordenfelt (vital goals)**  | 1C, 2B, 3B, 4B    | Case 6: Aneurysm’s future harm isn’t a *current* goal obstacle. |
  | **Two-Level View**            | 1A/B, 2A, 3B, 4A  | Case 8: Fails to explain why social role affects health system response. |
  | **Profession-Constitutive**   | 1C, 2C, 3B, 4B    | Case 9: Implies declassification erases past pathology. |
  | **Pluralist**                 | Mixed/inconsistent | Case 4: No unified account for threshold changes. |
  | **Eliminativist**             | Rejects all "disease" claims | Case 2: Struggles to explain implant-driven organ atrophy. |
  | **Unoccupied**                | 1C, 2A, 3A, 4A    | *Incoherent*: If atypicality is irrelevant (1C), disvalue cannot be unnecessary (2A) without collapsing into eliminativism. |

  ---

  ### **4. Separability**  
  *Indistinguishable pairs and distinguishing methods.*  

  1. **Wakefield vs. Nordenfelt**  
     - *Overlap:* Both call elite athlete (Case 3) healthy.  
     - *Distinguisher:* Add case: *Asymptomatic genetic arrhythmia causing sudden death at 40. Patient values risk-taking.* Wakefield calls it disease (dysfunction + harm); Nordenfelt may not (if no goal conflict).  

  2. **Boorse vs. Two-Level View**  
     - *Overlap:* Both call lead-exposed children (Case 1) diseased if compared externally.  
     - *Distinguisher:* Case 4 (hypertension): Two-Level accepts contextual thresholds; Boorse rejects them as non-biological.  

  3. **Pluralist vs. Eliminativist**  
     - *Overlap:* Both reject universal answers (e.g., Case 5).  
     - *Substantive Disagreement:* Whether "disease" has *any* stable criteria (Pluralist: yes, context-dependent; Eliminativist: no).  

  ---

  **Audit Tagging**:  
  - Axis 1: Cases 1, 2, 7  
  - Axis 2: Cases 3, 5, 6  
  - Axis 3: Cases 4, 9  
  - Axis 4: Cases 8, 10  

  This instrument forces position-agnostic sorting while covering all major debates. The cases avoid jargon, and the key reveals tensions within each leaf.
