  ### Statutory Package  

  **Statute: State Professional Licensing Act, Section 8-3**  
  *(a) Eligibility for Expedited License Transfer:*  
  *An out-of-state professional holding an active license in good standing for a minimum of five years in their home state shall be granted an expedited license to practice in this state without examination if:*  
  *(1) The profession is regulated by a state board designated under subsection (b); and*  
  *(2) The applicant’s primary residence has been in this state for at least 30 days prior to application.*  

  *(b) Definitions:*  
  *For purposes of this section:*  
  *(1) “Profession regulated by a state board” means any occupation for which a state licensing board exists under Title 4 of this code, excluding real estate brokerage.*  
  *(2) “Primary residence” means the dwelling where the applicant spends the majority of their nights during a calendar year, as verified by lease agreements, utility bills, or voter registration.*  

  ---

  **Legislative Record**  
  *Committee Report Excerpt:*  
  *This provision streamlines licensing for experienced professionals relocating to our state, reducing barriers for long-term practitioners. The 30-day residency requirement ensures commitment to our state while preventing opportunistic “license shopping” by transient applicants.*  

  *Floor Exchange:*  
  *Rep. Smith: What stops someone from moving briefly to get a license, then leaving?*  
  *Rep. Jones: The 30-day rule balances accessibility with preventing abuse. We trust boards to verify residency.*  

  ---

  **Facts**  
  Dr. Alice Chen, a licensed pediatrician with 10 years of good standing in Illinois, relocated to the state after accepting a job offer. She leased an apartment, registered to vote, and submitted her license transfer application on day 31 of residency. During her first 30 days, she lived in her new apartment 29 nights but spent one night across the state line caring for her terminally ill parent. Her lease, bills, and voter registration confirm the apartment as her primary dwelling. The state medical board is designated under Title 4.  

  ---

  ### Walkthrough  

  **Textualist Reading Grants the License**  
  The textualist applies the statute’s plain language. Subsection (a)(1) requires an active 5-year license in a board-regulated profession (pediatrics qualifies). Subsection (a)(2) demands primary residency for "at least 30 days prior to application," defined in (b)(2) as where the applicant spends "the majority of their nights." Dr. Chen spent 29 of 30 nights (97%) in-state, making it her "majority" dwelling under the definition. The text contains no exception for single-night absences, so she meets both conditions. The legislative record is irrelevant; the definitions are mechanical and unambiguous, leaving no gap to fill. Even the floor exchange’s concern about "opportunistic" applicants cannot override the clear residency test, as the legislature chose a bright-line occupancy rule over intent-based criteria.  

  **Purposivist Reading Denies the License**  
  The purposivist starts from the legislature’s goal: to attract committed professionals while blocking those exploiting the system for quick licenses (per the committee report). Dr. Chen’s one-night absence—though compassionate—shows she lacked full commitment to the state during the 30-day window, aligning with Rep. Smith’s concern about transience. The text bears this narrower reading because "primary residence" implies more than physical presence; it requires uninterrupted, bonafide establishment in the state. The interpretive move is to use purpose to resolve ambiguity in "majority," which could contextually mean "habitual and settled presence" rather than a strict numerical count. Granting the license here would frustrate the purpose by rewarding someone who, despite technical compliance, was not fully "relocated" as intended.  

  **Key Architectural Feature**  
  The divergence stems from the legislature’s choice of a **quantifiable status test** (majority of nights) instead of a **functional test** tied to consequences (e.g., "intent to reside permanently"). The status test textually captures Dr. Chen (29 > 15 nights = majority), but the functional purpose (preventing transient applicants) excludes her. If the residency condition required "continuous physical presence" or "intent to remain indefinitely," the textualist and purposivist would converge on denial (due to the absence). The case hinges entirely on this design; without the numerical definition, the theories align.  

  **Losing Side’s Best Attack and Winner’s Reply**  
  - **Purposivist Attack (loser):** "The case is rigged because the facts make the textualist reading seem compassionate, but Dr. Chen’s absence is a de minimis exception no real legislature would ignore. The record’s focus on preventing abuse pre-loads a denial, forcing purposivism into an uncharitable stance."  
  - **Textualist Reply (winner):** "The attack concedes the text is clear—rigor lies in applying it neutrally. The legislature *did* foresee brief absences (via the numerical rule) and excluded only real estate brokers, not caregivers. If they wanted a ‘no exceptions’ clause, they could have drafted one."
