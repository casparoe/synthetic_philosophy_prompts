  **State Unemployment Benefits Act, Section 5-7:**

  *(a) Eligibility for Extended Benefits:*
  *An individual who has exhausted their regular unemployment compensation benefits and is actively seeking work shall be eligible for extended unemployment benefits for up to 13 additional weeks if:*
  *(1) The individual's most recent employment was in a sector designated by the Department of Labor as experiencing a significant decline in employment; and*
  *(2) The individual's total income from employment in the 12 months preceding the claim was less than $30,000.*

  *(b) Definitions:*
  *For the purposes of this section:*
  *(1) "Sector designated by the Department of Labor as experiencing a significant decline in employment" means any sector for which the Department has published a notice in the State Register indicating that the sector has experienced a decline in employment of at least 15% over the previous 6 months.*
  *(2) "Total income from employment" means the sum of all wages, salaries, and other compensation received by the individual from employment, regardless of the sector, during the 12 months immediately preceding the filing of the claim for extended benefits.*

  **Legislative Record:**

  *Committee Report Excerpt:*
  *The extended benefits program is intended to provide additional support to low-wage workers in sectors hardest hit by economic downturns. The committee recognizes that some workers may have recently moved into a declining sector from a stable one, but the focus is on assisting those who are most vulnerable due to the sector's decline and their low earnings.*

  *Floor Exchange:*
  *Senator A: I am concerned that a worker who just started in a declining sector might not have been there long enough to be affected by the downturn.*
  *Senator B: The income threshold ensures that only low-wage workers, who are typically the most vulnerable, receive the extended benefits. We are targeting those with low total income, regardless of how recently they entered the sector.*

  **Facts:**

  *John Doe worked for 11 months as a cashier in a grocery store, a sector that the Department of Labor has not designated as declining. He was laid off and collected regular unemployment benefits, which have now expired. One month ago, he took a part-time job as a retail salesperson in a clothing store, a sector that the Department has designated as declining due to a 20% drop in employment. After three weeks, he was laid off due to the downturn. His total income from employment in the 12 months preceding his claim for extended benefits was $28,000, almost entirely from the grocery job. He is actively seeking work.*

