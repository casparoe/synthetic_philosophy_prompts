prompt: |-
  I've spent about six months helping a tenants' group in my city put together a policy platform, and somewhere along the way I realized my own thinking about price controls is a mess — I can't state anything that generates all my gut reactions. So here they are, in roughly the order I formed them. Rent stabilization in a genuinely tight urban market with no vacancy decontrol: bad — it rewards the incumbents, locks out everyone arriving now, and slows construction, and I'd oppose it even though half my friends would benefit. A cap on water, gasoline, and motel rooms during a hurricane: good, even though I know it means lines and empty shelves and even though I'd normally say the price spike is doing useful work there. A wage floor set low enough that it doesn't seem to cost jobs: good. The exact same wage floor, but lobbied for by a big chain that can absorb it and wants to jack up costs for the smaller competitors who can't: bad — the workers are affected identically as far as I can tell and yet I flip. Banning key money, the under-the-table payment a newcomer makes to the outgoing tenant of a stabilized unit: ban it, even though I can see the payment is basically restoring the price mechanism and getting the apartment to whoever values it most. Laws capping concert ticket resale: bad, which I admit is structurally the same case and I cant explain the difference.

  More of them. A cap on payday loan interest: bad, I think it just pushes borrowers toward worse credit — but a cap on overdraft and late fees: good, even though those feel like the same intervention to me economically. Agricultural price supports that keep small dairy farms alive: bad, even though I like small dairy farms and would happily pay taxes to subsidize them directly instead. And a company town where the same firm is the dominant employer and the dominant landlord: a wage floor plus a rent cap there is not just acceptable but more clearly right than either one alone in a normal city. My tentative principle, such as it is, is that a price control is legitimate when it stops someone from using a chokepoint they didn't create to extract a ransom from people who have no exit, and illegitimate when its just people trying to duck a price they don't like. I can already see this struggles with the hurricane case, since those sellers didn't create the hurricane either, and I don't think it explains the dairy supports.

  What I actually want is the principle, or a small handful of candidates stated precisely enough that I could apply them to a policy I haven't seen before without agonizing, with each clause tied to the case that motivated it. Then run it against everything above and tell me which of my verdicts I have to give up — I'd rather have a simple principle that breaks one or two of them than an epicycle bolted on for each, so don't save all nine if the cost is a mess. In particular settle the key-money/ticket-resale pair and the two halves of the credit case. And tell me what it says about one I haven't landed on: the group floated letting a stabilized tenant sell their lease to a newcomer at whatever the market will bear, with the city taxing forty percent of the sale — is that a reform, or does it turn a protection into a piece of property and make things worse? Then give me two or three further cases your principle delivers a confident verdict on that I wouldn't have predicted. Lead with the bottom line in your first sentence — the principle you'd defend or the verdict you'd drop — and then give the reasoning, with no preamble and no restating my question back to me. Take a position rather than surveying the options and leaving me to choose. American English, please, and don't bother with sources or a reading list; I just want the argument.
reasoning: |-
  Alright, the user has spent six months working on a tenant policy platform and is struggling to reconcile their gut reactions to various price control scenarios. They listed several examples where their intuition conflicts, like rent stabilization being bad but hurricane price caps good, or wage floors being good unless lobbied by big chains. Their tentative principle is about preventing exploitation via chokepoints without exit options, but they see it doesn't cover all cases like dairy supports. 

  First, I need to identify their core request: a clear, actionable principle that explains most of their judgments, even if it contradicts a few. They prefer simplicity over saving every intuition. Key pain points are the key-money vs ticket resale contradiction, the payday loan vs overdraft fee split, and the lease sale proposal. They also want the principle tested on new cases.

  Looking at their examples, common threads emerge. Situations they support involve acute vulnerability (hurricanes, company towns), lack of alternatives (payday loans might have substitutes; overdraft fees often don't), or correcting power imbalances (wage floors in monopolistic labor markets). Opposition cases often involve artificial scarcity (rent control locking newcomers out) or market distortions with better solutions (dairy subsidies vs direct aid). 

  Their chokepoint principle is close but needs refinement. The hurricane sellers didn't create the disaster, but the *temporary* lack of alternatives makes price gouging exploitative. Dairy supports fail because farmers aren't "extracting ransom" from trapped buyers—it's about income stabilization, which could be handled via direct subsidies without distorting prices. 

  For contradictions: Key money restores market pricing but within a broken system (rent control), so banning it aligns with not legitimizing gray markets. Ticket resale caps might feel similar, but scalpers don't control a vital necessity; banning resale just distorts allocation further. Hence opposing resale caps fits the principle. 

  On credit: Payday loan caps might push borrowers to worse options (exit exists, however bad), while overdraft fees trap bank customers (no immediate exit), making caps legitimate. Wage floors lobbied by big chains are bad because the chokepoint is manufactured (regulatory burden on competitors), not inherent. 

  Lease sale proposal: Taxing transfers turns tenancy into property, entrenching incumbents. Worse than key money because it's formalized rent-seeking. Principle rejects it. 

  New test cases: 
  1. Emergency insulin price caps: Good (vital need, no substitutes). 
  2. NYC taxi medallion caps: Bad (artificial scarcity created by regulation). 
  3. Childcare subsidies vs. price caps: Subsidies better (avoids shortages while aiding access). 

  Bottom line: Revise the principle to focus on *temporary or inherent* chokepoints without alternatives, excluding self-inflicted scarcities. Drop dairy support approval and accept that big-chain-lobbied wage floors are bad despite worker benefits. The lease sale idea is a trap.
answer: |-
  Your core principle should be: **Price controls are legitimate only when they prevent exploitation of temporary, involuntary vulnerability where no reasonable alternatives exist, and illegitimate when they distort functioning markets or create artificial scarcities.** This forces you to drop support for *agricultural price supports* and accept that the *big-chain-lobbied wage floor* is bad despite identical worker effects.  

  ### How It Resolves Your Cases:  
  1. **Rent stabilization in a tight market**: Illegitimate. Creates artificial scarcity (locks out newcomers, slows construction). Market alternatives exist long-term.  
  2. **Hurricane price caps**: Legitimate. Sellers exploit *temporary*, involuntary vulnerability (no escape, no alternatives for essentials).  
  3. **Wage floor (general)**: Conditionally legitimate. If set below market-clearing level, it counters inherent employer power imbalance for low-skill workers with few alternatives.  
  4. **Wage floor (lobbied by big chain)**: Illegitimate. Distorts competition (exploits regulation as a weapon), not vulnerability.  
  5. **Banning key money**: Legitimate. The "vulnerability" (artificial scarcity) was *created by rent control itself*. Banning prevents monetizing a dysfunctional system.  
  6. **Capping concert ticket resale**: Illegitimate. No involuntary vulnerability; buyers have alternatives (other events, direct purchases). Scalpers didn’t create the scarcity.  
  7. **Payday loan interest cap**: Illegitimate. Borrowers often have terrible alternatives, but the cap *worsens* access (lenders exit). Vulnerability isn’t temporary/situational.  
  8. **Cap on overdraft/late fees**: Legitimate. Fees exploit *temporary* cash shortfalls (no immediate alternatives) with disproportionate power.  
  9. **Company town wage/rent combo**: Legitimate. Addresses *inherent*, non-temporary vulnerability (no alternative employers/landlords = no exit).  
  10. **Agricultural price supports**: Illegitimate. Farmers aren’t exploiting buyers’ vulnerability; it’s income support distorting markets. Direct subsidies would be better.  

  **Lease Sale Proposal**: **Worse than current system**. Taxing stabilized tenants who sell their lease turns a *protection* into *tradable property*, entrenching incumbents and formalizing exclusion. It monetizes the artificial scarcity rent control created (violating the principle).  

  ### New Cases Testing the Principle:  
  1. **Emergency insulin price cap**: *Legitimate*. Diabetics face involuntary, life-threatening vulnerability with no alternatives (insulin isn’t substitutable).  
  2. **Rent control in a college town with housing glut**: *Illegitimate*. No scarcity exists; control distorts a functioning market and discourages upkeep.  
  3. **Capping Airbnb rates during a major festival**: *Illegitimate*. Attendees have alternatives (hotels, postponing travel). Scarcity is predictable, not exploitative.  

  ### Why This Works:  
  - **Vulnerability + No Exit** justifies intervention (hurricane, company town, overdraft fees).  
  - **Self-Inflicted Scarcity** condemns it (rent control creating key-money markets, lease sales).  
  - **Market Function** trumps minor imbalances (payday loans have alternatives; concerts aren’t essential).  
  - **Intent matters**: Big chains weaponizing wage floors shows control can *create* chokepoints.  

  You retain 8/10 intuitions; only *dairy supports* and *chain-lobbied wage floor* are explicitly rejected by the principle. The key-money/ticket-resale split holds because key money monetizes policy failure, while ticket resales reflect voluntary transactions. The credit split holds because overdraft fees trap everyone transiently, while payday loans target those with *chronic* lack of alternatives (where caps backfire).
