prompt: |-
  I work in quantitative risk — coherent risk measures, CVaR/expected shortfall, spectral risk measures, ambiguity sets and maxmin-expected-utility à la Gilboa–Schmeidler, that's my day job. My philosophy is autodidact level, so don't assume I've read the secondary literature on any of this.

  I've been reading Rawls and I have a hunch I want pressure-tested: that the original position is just a decision problem under deep ambiguity, and that the difference principle is basically CVaR pushed to the limit, all the weight dumped on the bottom quantile. So do the translation for me, as faithfully as you can. Specifically: what's the ambiguity set the parties are maximizing over, what exactly is the loss random variable (income? wealth? an index of primary goods? a vector, and if so how does a vector get scalarized by a risk functional?), what weighting function on the quantile distribution of a society does the difference principle correspond to, and is that weighting function even a legitimate spectral risk measure or is it a degenerate limit case that breaks something. Also — Rawls gives conditions under which he thinks maximin is the sensible rule (roughly: no secure knowledge of the probabilities, a guaranteeable outcome that you genuinely care about securing, and rejected alternatives whose bad outcomes you can barely live with). Does that trio map onto the axioms that actually generate maxmin over a set of priors, or does it fall apart under scrutiny?

  Then the part I care about most, the residue report. Go claim by claim: lexical priority of the basic liberties, fair equality of opportunity, the fact that the metric is primary goods rather than welfare, the publicity condition, the strains of commitment argument, the fact that the parties are modeled as representatives of free and equal citizens rather than as one agent gambling on her own life, and the whole idea that the choice is supposed to settle a question of justification and not a question of prudence. For each, tell me whether it translates into risk-measure language cleanly, whether it translates only with distortion, or whether it has no expression at all in that language. Where you had to fudge, say explicitly what got dropped. Don't smuggle my framework's assumptions in and call it translation — if you find yourself explaining Rawls by assuming preferences are the fundamental normative object, flag it.

  Finish with a verdict on which of two things the residue points to: either my vocabulary is genuinely missing a piece (something like a constraint that isn't reducible to an agent's attitudes toward outcomes), or Rawls's setup is less coherent than it looks. And in that connection, say whether Harsanyi's complaint — that a veil of ignorance plus any reasonable decision rule gets you average utilitarianism rather than the difference principle — actually lands once the translation is done, or slides off, and why.

  Lead with your bottom line in the first sentence, then give me the reasoning. No preamble, and don't restate the question back at me.
