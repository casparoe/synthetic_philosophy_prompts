answer: |-
  Here's a structured Q&A prep sheet, prioritizing objections by damage potential (high to low), tailored to your audience's expertise. I've grouped identical objections under primary entries. Preemptive concessions and the "nightmare question" are at the end.

  ---

  ### **Preemptive Concessions (Slide 2)**
  1. **"I explicitly sacrifice Pareto:** Any finite improvement or improvement decaying like 1/t gets weight zero. No sneaking."  
  2. **"Banach limits are non-constructive:** No algorithm picks a *specific* one. I rely on unanimity across all such limits."  
     *Why early?* Stops axiomatic debates about Pareto and constructivism upfront.

  ---

  ### **Objections & Replies (Ordered by Damage Potential)**
  1. **Growth Theorist: "Your criterion can't distinguish between a 1% permanent gain and a 1/t decay. That's policy-useless!"**  
     *Social Choice Phrasing:* "You violate Weak Dominance for geometrically vanishing gains."  
     **Reply:** "Correct. But overtaking can't rank *any* oscillating sequence (e.g., +1/-1 forever). My fix handles those, which matter for cyclical economies or climate tipping points. You trade sensitivity to vanishing gains for completeness on persistent cycles."  
     *Soft Spot:* Admits your rule is useless for standard marginal policy analysis (e.g., small tax reforms).  

  2. **Growth Theorist: "You killed Pareto for finitely many people. Who cares about completeness if we ignore obvious improvements?"**  
     *Philosopher Phrasing:* "Doesn't this violate intergenerational equity? Generation 1’s sacrifice gets ignored."  
     **Reply:** "Pareto is incompatible with shift-invariance + completeness in infinite settings (see Lauwers 2010). I chose shift-invariance to handle oscillations. Yes, finite gains vanish—but in infinite horizons, ‘obvious’ isn’t well-defined without a topology."  
     *Soft Spot:* Sounds dismissive of concrete gains; philosophers will pounce on moral urgency.  

  3. **Both Audiences: "Dismissing 1/t improvements is indefensible! Redistributing 1/t gains from rich to poor should matter."**  
     **Reply:** "1/t decays are summable—equivalent to finite gains under discounting. But discounting breaks stationarity. My criterion preserves stationarity: if \(x\) beats \(y\), so does their one-period shift. Overtaking lacks this."  
     *Soft Spot:* Doesn’t answer why stationarity > redistributive sensitivity.  

  4. **Social Choice: "Banach limits are non-unique. Your ranking depends on arbitrary choices—why not use catching-up?"**  
     *Growth Theorist Phrasing:* "This isn't computable. How do we simulate it?"  
     **Reply:** "I require *unanimity*: \(x > y\) iff *all* shift-invariant means agree. No arbitrariness. Catching-up is incomplete (e.g., can’t rank +1/-1 vs. 0)."  
     *Soft Spot:* Non-uniqueness means many pairs are still unranked (when limits disagree).  

  5. **Philosopher: "Shift-invariance privileges 'steady states.' But what if generations care about their temporal position (e.g., climate debt)?"**  
     **Reply:** "Shift-invariance is a symmetry axiom—no privileged time. If you *want* temporal weights (e.g., discounting), use overtaking. But then you can’t rank oscillations—a cost I avoid."  
     *Soft Spot:* Concedes your criterion is amoral; ignores historical responsibility.  

  6. **Growth Theorist: "Does this work in dynamic programming? My Bellman equation assumes overtaking!"**  
     **Reply:** "Shift-invariant means are linear and positive—compatible with optimization. Replace \(\liminf\) in catching-up with a Banach limit. Stationarity ensures time-consistency."  
     *Soft Spot:* No practical example of solving a Ramsey model this way.  

  7. **Social Choice: "You claim completeness, but can’t rank streams where differences oscillate wildly (e.g., +n, -n)."**  
     **Reply:** "Boundedness is implicit. Banach limits apply to \(\ell_\infty\) differences. Unbounded oscillations need separate treatment—but overtaking fails those too."  
     *Soft Spot:* Wild oscillations are common in stochastic models.  

  8. **Grad Student: "Why not use asymptotic density (like 0-1 sequences)? It’s shift-invariant and intuitive."**  
     **Reply:** "Asymptotic density isn’t a full mean (only defined for Cesàro-summable sequences). Banach limits extend density-like reasoning to all bounded sequences."  
     *Soft Spot:* Overkill for "nice" sequences economists use.

  ---

  ### **Objection Overlaps**  
  - Pareto/finite gains (#1, #2, #3) and 1/t (#3) are the *same core issue*: sensitivity vs. completeness.  
  - Non-uniqueness (#4) and uncomputability (#4, #6) are constructivist twins.  
  - Philosopher #5 and Social Choice #4 both attack "arbitrariness" from different angles.

  ---

  ### **Nightmare Question**  
  **"Name one real policy where overtaking fails and your criterion changes the recommendation."**  
  *Why terrifying?* Growth theorists demand concrete applications. Oscillations are rare in canonical models.  
  **Reply (Have Ready!):** "Climate policies with alternating mitigation/adaptation cycles. Overtaking sees no winner; my rule detects net-positive shifts if oscillations don’t cancel. Example: Mitigate in odd periods (+C, -cost), adapt in even (-C, +benefit). If net benefit >0 *everywhere* after shifts, I rank it higher."  
  *Soft Spot:* Highly stylized; no empirical model uses this.

  ---

  ### **Tactics**  
  - **Preempt** Pareto + non-uniqueness early.  
  - **Redirect** to oscillations: "Overtaking fails on cyclical economies—my fix solves that."  
  - **Concede** policy limitations but emphasize completeness: "When *do* we rank oscillations? My rule answers that."  
  - **Flatter growth theorists:** "You use overtaking daily—this extends its reach."  
  - **Warn philosophers:** "This is a technical fix, not an ethical system."

  Good luck—your clarity on trade-offs is a strength. If philosophers corner you on ethics, say: "I’m solving a technical incompleteness. Ethical weights require additional axioms."
