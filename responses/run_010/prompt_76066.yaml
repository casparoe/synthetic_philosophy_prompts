  We are constructing a joint statement for an adversarial collaboration between a systems modeler (in the tradition of the World3 model from "The Limits to Growth") and a resource economist (cornucopian, emphasizing prices and substitution). The goal is a constructive document that both can sign, with clear agreements, exact disagreements, and a structured way forward.

  ### Step 1: Agreed Claims (Non-vacuous)
  We need numbered agreed claims that are substantive. Avoid trivial agreements. Include:
  - What the model actually does and what "collapse" means in it.
  - What the historical record shows and doesn't show.
  - What the Simon-Ehrlich wager settled and what it didn't.
  - Whether "the model predicted X by year Y" is the right logical form.

  Draft agreed claims:

  1. The World3 model (and similar systems models) simulates long-term global trends by representing stocks (e.g., population, industrial capital) and flows (e.g., resource extraction, pollution generation) with feedback loops. Its baseline scenario (the "standard run") projects that without substantial changes in behavior, the global system may experience overshoot and decline, where "collapse" is defined as a significant, sustained decline in industrial output per capita and/or population due to a combination of resource depletion, pollution buildup, and declining returns on capital investment.

  2. Historical data from the past four decades (1980-2020) shows that:
     - Global population and industrial output have continued to grow.
     - Real prices for many non-renewable resources (e.g., metals) have fluctuated but have not shown a consistent long-term increase; in many cases, they have declined.
     - Technological innovation and substitution have occurred, allowing for more efficient resource use and access to new sources.

  3. The Simon-Ehrlich wager (1980-1990 on five metals) demonstrated that over a specific 10-year window, real prices for those metals fell, which was inconsistent with a simple depletion-driven scarcity hypothesis. However, the subsequent reanalysis showing that the outcome was highly sensitive to the chosen time window (with economists winning only ~38% of 10-year windows in the 20th century) indicates that short-term price movements are influenced by many transitory factors and do not, by themselves, settle long-run structural questions about resource depletion.

  4. The logical form "the model predicted X by year Y" is inadequate for evaluating systems models because:
     - These models project conditional scenarios, not unconditional predictions.
     - They emphasize patterns (like overshoot and decline) rather than precise event timing.
     - Their value lies in revealing the long-term dynamics of complex systems, which may unfold over decades or centuries and are subject to policy and technological changes.

  ### Step 2: Disagreements Table
  We need a table with exactly these columns:
  - `id`: Unique identifier (e.g., D1, D2)
  - `dispute`: One neutral sentence describing the dispute.
  - `modeler_wording`: A sentence stating her view that she would sign.
  - `economist_wording`: A sentence stating his view that he would sign.
  - `kind`: Genuine, verbal, or mixed. If verbal/mixed, name the word and propose a neutral replacement.
  - `crux`: Which crux this row turns on (we'll assign crux IDs later).
  - `shared_test`: The observation, case, or argument both accept as bearing on it.
  - `modeler_prediction`: Her prediction, specific enough to be wrong.
  - `economist_prediction`: Same for him.
  - `resolution_horizon`: The year by which we'd know.

  Draft disputes:

  **D1: The role of falling real prices in the historical record**
  - Dispute: Whether the observed decline in real resource prices over recent decades supports the view that substitution and innovation can indefinitely offset depletion pressures.
  - Modeler wording: "The observed decline in real resource prices is consistent with the endogenous technology feedback in our model, which delays but does not prevent the eventual decline phase."
  - Economist wording: "The observed decline in real resource prices is evidence that market-driven substitution and innovation have effectively countered depletion, and there is no empirical basis to expect a future decline driven by resource scarcity."
  - Kind: Genuine (because the modeler sees it as temporary and part of the overshoot, while the economist sees it as a disproof of depletion-driven collapse).
  - Crux: C1 (to be defined later).
  - Shared test: The long-run trend in real commodity prices (using an agreed basket) over the next two decades.
  - Modeler prediction: Real commodity prices (adjusted for inflation) for a basket of non-renewable resources will show a sustained upward trend by 2040, even with short-term volatility.
  - Economist prediction: Real commodity prices for the same basket will remain stable or decline on average over the 2020-2040 period.
  - Resolution horizon: 2040.

  **D2: The interpretation of the Simon-Ehrlich wager**
  - Dispute: Whether the outcome of the Simon-Ehrlich wager (and similar short-term bets) is informative about the long-run validity of depletion models.
  - Modeler wording: "Short-term price wagers are poor tests of long-run structural models because they fail to account for the delayed feedbacks and non-linear dynamics inherent in resource depletion."
  - Economist wording: "The Simon-Ehrlich wager and subsequent reanalyses show that short-term price movements often contradict depletion narratives, and the burden of proof is on modelers to explain why their models should be trusted for the long run if they fail in the short run."
  - Kind: Mixed (the word "short-term" is key; both agree that short-term tests are noisy but disagree on their weight). Neutral replacement: "short-term (e.g., 10-year) window".
  - Crux: C2.
  - Shared test: The outcome of a new long-term wager (e.g., 30 years) on a basket of resources.
  - Modeler prediction: Over a 30-year horizon (2020-2050), the real price of a basket of non-renewable resources will increase by at least 50% (adjusted for inflation).
  - Economist prediction: Over the same horizon, the real price of the basket will not increase by 50% and may decline.
  - Resolution horizon: 2050.

  **D3: The mechanism of collapse**
  - Dispute: Whether a sustained decline in industrial output per capita (as projected in the model) can occur without being averted by price-induced substitution and innovation.
  - Modeler wording: "The feedback from resource depletion and pollution to capital productivity and output can overwhelm the substitution mechanism, leading to a decline that market signals cannot prevent."
  - Economist wording: "Price signals and human ingenuity have historically averted scarcity-driven decline, and there is no empirical precedent for a market economy collapsing due to resource depletion alone."
  - Kind: Genuine.
  - Crux: C3.
  - Shared test: The trend in the energy return on investment (EROI) for key resources and the share of global output allocated to resource extraction.
