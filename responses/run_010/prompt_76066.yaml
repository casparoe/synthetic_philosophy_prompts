  ### Joint Statement of Adversarial Collaboration  

  #### 1. Agreed Claims  
  1. The World3 model (and its successors) simulates global systems via interconnected stocks/flows and feedback loops. Its "collapse" denotes a sustained, irreversible decline in industrial output per capita due to depletion and pollution, distinct from transient recessions.  
  2. Historical data (1980–2020) shows:  
     - Rising population/industrial output and falling real commodity prices.  
     - *Does not* resolve whether this reflects successful adaptation (economist) or delayed feedbacks (modeler).  
  3. The Simon-Ehrlich wager (1980–1990) demonstrated that short-term (≤10-year) price trends are poor arbiters of long-run depletion models due to volatility and window sensitivity. It settled nothing about structural mechanisms.  
  4. Evaluating the model via "predicted X by year Y" is flawed. The model projects *conditional trajectories* (e.g., "if trends continue, overshoot occurs"), not point predictions.  

