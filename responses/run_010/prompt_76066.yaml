  2. **Saying the basket was badly chosen (e.g., "the metals in Simon-Ehrlich were not representative")**: (a) Auxiliary hypothesis: A better basket would show different results; testable by constructing an agreed basket.
  3. **Re-reading the same data (e.g., "the falling prices prove substitution is working")**: (c) Redescription.
  4. **Adding a new substitution mechanism (e.g., "we'll switch to renewables")**: (b) Internal adjustment to his mental model.

  Classification:

  Defensive Moves:
  - For modeler:
    - Move: "Wait longer, the turn hasn't come yet." → Class (a): It implies that precursor trends (like falling EROI) should be visible now and will intensify.
    - Move: "The model's timing was off because of unanticipated efficiency gains." → Class (b): Adjusting a parameter (e.g., technology growth rate) in the model.
