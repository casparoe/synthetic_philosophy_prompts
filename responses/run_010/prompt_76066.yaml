  1. **Appealing to a different window (e.g., "wait longer")**: (a) Auxiliary hypothesis: The model's time horizon is longer than the test window; independently testable by checking if the precursor trends are occurring.
  2. **Adding a feedback loop (e.g., adding a new pollution feedback)**: (b) Internal adjustment to the model structure.
  3. **Re-reading the same data (e.g., "the prices are falling because we're in the overshoot phase")**: (c) Redescription that reinterprets the data without new predictions.
  4. **Saying the horizon was misunderstood**: (c) Redescription.

  Economist moves:
