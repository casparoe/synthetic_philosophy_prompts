  #### 3. Precursor and Kill Condition  
  - **Modeler’s Precursor**:  
    Observable: Decline in **energy return on investment (EROI)** for key resources (e.g., global oil EROI falling from 30:1 in 1990 to <15:1 today).  
    Expected by 2025 if correct: EROI should fall to ≤12:1, and ≥12% of global industrial output allocated to resource extraction/environmental mitigation (vs. 8% today). Failing this implies adaptation is outpacing depletion.  

  - **Economist’s Kill Condition**:  
    Observation: **Real prices of an agreed commodity basket (e.g., metals + fossil fuels) double within 15 years (e.g., 2025–2040) while global GDP grows ≥2%/year and no supply shocks occur**. This would signal substitution failing to offset scarcity, validating the modeler’s depletion mechanism.  

