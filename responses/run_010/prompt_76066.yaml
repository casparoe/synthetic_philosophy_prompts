  | Economist  | "Re-weight price indices."                | auxiliary_with_independent_content         | Testable by constructing agreed indices.                           |  

  #### 5. Verbal Disputes  
  - **Collapse**:  
    - Modeler: *Sustained, systems-level decline in output/capita* (e.g., >20% drop over 20 years).  
    - Economist: *Acute, irreversible breakdown* (e.g., mass starvation).  
    - **Genuine residue**: Economist denies any gradual "decline" qualifies; modeler insists it does.  
  - **Falsified**:  
    - Both agree it means "empirically inconsistent," but economist demands near-term price rises; modeler accepts long-term precursors. **Mixed**; neutral: "inconsistent with core mechanism."  
  - **Right but early**:  
    - Modeler: Valid if *precursor trends* align.  
    - Economist: Unfalsifiable if no deadline exists.  
    - **Genuine residue**: Economist requires a bounded test; modeler argues precursors suffice.  

  **Conclusion**: Core empirical disagreements persist (e.g., EROI trajectory, price response), masked by divergent definitions of collapse and falsifiability.  

