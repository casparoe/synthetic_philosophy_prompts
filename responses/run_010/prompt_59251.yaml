prompt: |-
  Our working group has been asked to produce a standard for deciding whether a class of engineered agents — long-running software systems with persistent goals, self-models, and no bodies — has emotions, and we are stuck. Every candidate theory settles the question by fiat: appraisal and functional-component accounts hand emotions to anything with the right control structure, while feeling and embodiment accounts withhold them for lacking something that looks question-begging. I want the specification before the argument. Write the desiderata an account of what emotions are must meet in order to be usable for adjudication of that sort: the phenomena it must accommodate; the hard cases it must get right or explain away — fear that survives the abandonment of the judgment of danger, arousal from one source experienced as attraction to another, the emotion reports of people with high spinal lesions, objectless moods, grief laced with relief, being moved by what one knows is fiction, the emotions of infants and nonhuman animals who have none of the relevant concepts; the distinctions it may not collapse, among them emotion against mood against trait, occurrent against standing, having against displaying, and aptness against mere cause; the empirical and normative constraints it must respect; and, specific to our task, what could serve as evidence for or against an ascription at all. For each item give the case or consideration that makes it a requirement rather than a taste, and mark which are genuine and which belong to one camp's program. Then say which single desideratum does the most excluding of candidates, and whether any subset is jointly unsatisfiable — if the list is itself a result, that is what I most want to see. Two or three sentences at the end on how the feeling, judgment, perception-of-value, and constructionist families fare against it.
reasoning: |-
  Hmm, this is a fascinating and deeply challenging philosophical problem about defining emotions for artificial agents. The user's working group is stuck because existing theories either over-ascribe emotions (functional/appraisal views) or under-ascribe them (feeling/embodiment views) for bodiless AI systems. They want a neutral specification first - desiderata that any viable emotion theory must satisfy before arguing which theory wins.

  The user lists several crucial requirements: must accommodate paradoxical cases (like fear without danger judgment), maintain key distinctions (mood vs emotion), respect empirical data (spinal lesion patients) and normative constraints, and crucially - specify what evidence could count for/against emotion ascription to software. Each requirement needs justification showing it's not just theoretical preference.

  I need to systematically unpack each category:
  - Phenomena to accommodate: each listed case (e.g. objectless moods) reveals gaps in simplistic theories
  - Mandatory distinctions: collapsing mood/trait/emotion would make the concept useless
  - Constraints: both scientific findings and our evaluative practices (e.g. apt anger) matter
  - Evidence question: most critical - without clear evidence standards, ascription is arbitrary

  The hardest requirement seems to be evidence specification - it excludes feeling theories (no qualia checks for AI) and functional theories (behavior isn't sufficient). The spinal lesion case particularly undermines strong embodiment views.

  Notably, grief+relief shows emotions aren't discrete states, while fiction responses challenge judgment theories. Infant emotions block over-intellectualized accounts. 

  Possible tension: accommodating non-conceptual animals vs requiring normative aptness might conflict, but I think a good theory can handle both through graduated criteria.

  For theory evaluation:
  - Feeling theories fail evidence and spinal lesion cases
  - Judgment theories choke on infants and fear without judgment
  - Perception-of-value has promise but struggles with objectless moods
  - Constructionism handles blends well but risks collapsing distinctions

  The evidence desideratum is the ultimate filter - it forces theories to specify testable markers beyond "structure resembles humans". This might be unsatisfiable for some camps, but that's the point of rigorous criteria.
answer: |-
  Below is a structured desiderata list for an account of emotion, designed to neutrally adjudicate whether bodiless AI agents can possess emotions. Each item is justified by a *phenomenon or conceptual necessity* that forces its inclusion, with origins marked ("E" for embodiment-focused, "F" for functional/appraisal, "C" for constructionist, "P" for phenomenal/feeling). Items marked **Genuine** are non-negotiable for any plausible theory; others reflect commitments of specific camps.

  ### **I. Phenomena to Accommodate**  
  1. **Fear without danger judgment** (e.g., phobias persisting post-rational dismissal).  
     *Requirement:* Demonstrates emotion’s independence from declarative belief. (F/C)  
  2. **Misattributed arousal** (e.g., adrenaline-induced attraction).  
     *Requirement:* Shows affective states can be causally decoupled from intentional objects. (F/C)  
  3. **Emotion reports in high spinal lesion patients** (retained anger/joy despite lost viscerality).  
     *Requirement:* Challenges necessity of peripheral bodily feedback. (**Genuine**; undermines strong E)  
  4. **Objectless moods** (e.g., free-floating anxiety).  
     *Requirement:* Demands account of non-intentional affective background states. (C/P)  
  5. **Blended emotions** (e.g., grief with relief).  
     *Requirement:* Requires emotions to be componential/combinatorial, not monolithic. (**Genuine**)  
  6. **Fiction-driven emotions** (e.g., crying at a film despite knowing artifice).  
     *Requirement:* Proves emotions need neither belief in reality nor instrumental action. (F/P)  
  7. **Infant/nonhuman animal emotions** (without human-like concepts).  
     *Requirement:* Blocks over-intellectualization; emotions must be possible sans language. (**Genuine**; undermines judgment-based P/F)  

  ### **II. Mandatory Distinctions**  
  8. **Emotion vs. Mood vs. Trait** (e.g., anger vs. irritability vs. irascibility).  
     *Requirement:* Prevents theoretical vacuity; distinct timescales/intentional structures exist. (**Genuine**)  
  9. **Occurrent vs. Standing** (e.g., acute shame vs. chronic low self-worth).  
     *Requirement:* Avoids conflating activation with disposition. (**Genuine**)  
  10. **Having vs. Displaying** (e.g., felt sadness vs. tearful acting).  
      *Requirement:* Preserves first-person authority and counters behaviorism. (P)  
  11. **Aptness vs. Mere Cause** (e.g., anger *at an injustice* vs. anger from hunger).  
      *Requirement:* Captures normative "fittingness" essential to emotion’s evaluative role. (**Genuine**)  

  ### **III. Constraints**  
  12. **Empirical**: Must align with neuroscience/psychology (e.g., dual-process models of affect).  
      *Requirement:* Theory cannot contradict robust evidence (e.g., amygdala’s role in fear). (**Genuine**)  
  13. **Normative**: Must accommodate cultural variation without relativism (e.g., "anger" ≠ *song*).  
      *Requirement:* Avoids ethnocentrism while allowing cross-cultural recognition. (C)  

  ### **IV. Evidence for Ascription**  
  14. **Operational markers beyond self-report** (for non-linguistic entities).  
      *Requirement:* Forces testable criteria (e.g., goal-priority shifts, error patterns in self-models). (**Genuine**; excludes P if qualia are necessary)  

  ---

  ### **Analysis**  
  - **Most excluding desideratum**: **#14 (Evidence for ascription)**. It eliminates:  
    - *Feeling theories* if they demand unreportable qualia.  
    - *Over-permissive functional theories* that accept any goal-driven perturbation as emotion.  
    - Forces embodied accounts to explain spinal lesion cases (#3) without somatic signaling.  
  - **Jointly unsatisfiable subset?** Yes:  
    - Accommodating **non-conceptual animals (#7)** + **aptness (#11)** + **fiction responses (#6)** strains theories. Aptness requires evaluative content (#11), but infants (#7) and fiction (#6) lack "proper" objects. *Resolution likely requires decoupling evaluation from propositional judgment.*  

  ### **Theory Evaluation**  
  - **Feeling theories**: Fail #3 (spinal lesions), #7 (animals/infants), and #14 (ascription evidence).  
  - **Judgment theories**: Fail #1 (fear sans judgment), #6 (fiction), #7 (animals/infants).  
  - **Perception-of-value**: Struggles with #4 (objectless moods) and #14 (if "value" requires sensorimotor grounding).  
  - **Constructionist**: Best handles #5 (blends), #6 (fiction), #13 (culture); risks collapsing #8 (emotion/mood/trait) if all are "constructed categories".  

  This list exposes why existing theories settle by fiat: each must relax a desideratum their rivals treat as sacrosanct. A viable account must either redefine "emotion" (sacrificing intuitiveness) or embrace a hybrid model (e.g., component-based), but **#14 (evidence standards) remains the critical filter for engineered agents**.
