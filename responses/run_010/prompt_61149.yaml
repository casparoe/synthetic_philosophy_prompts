  Below is a complete, runnable specification for an in-class activity that combines the strengths of your spatial pair and evidential register ideas while mitigating their weaknesses. The hybrid design uses **spatial descriptions under evidential constraints** to force attention to source encoding while minimizing mental translation and rote degeneration. It targets your core goals:  
  - Separating the claims: (1) language *limits* thought, (2) language *obliges* speech, (3) obligation changes *attention/retention*.  
  - Showing that (3) does not trivially follow from (2), and that (2) has consequences even without untranslatability.  

  The activity leverages your room setup (movable tables, whiteboard, index cards), uses your bilingual students as assets, and includes explicit timing, materials, and debrief triggers. Total runtime: 75 minutes (leaving 5 minutes for buffer).  

  ---

  ### **Activity: Spatial Evidential Relay**  
  **Core Mechanics**: Teams describe and reconstruct object arrangements on a grid under two constraints:  
  - **Group A**: Must use **absolute bearings** (e.g., "north of X") + **evidential markers** for source of knowledge.  
  - **Group B**: Must use **viewer-relative terms** (e.g., "left of X") + **no evidential markers**.  
  Bilinguals are assigned as "confederates" to disrupt silent translation. A surprise memory test probes attention to object *locations* and *knowledge sources*.  

  #### **Roles & Groups**  
  - **Students**: 22 total. Split into two groups (A and B) of 11 each.  
    - *Group A*: Absolute bearings + evidential markers.  
    - *Group B*: Viewer-relative terms + no evidential markers.  
  - **Bilinguals (4)**: Assign 2 to Group A and 2 to Group B as **"confederates"**. Their role: Introduce subtle "errors" in spatial descriptions (e.g., misstating an object’s position) to force teammates to engage deeply with the linguistic constraints rather than mentally translating. *Rationale*: Prevents silent translation by creating uncertainty, making the linguistic obligation "bite."  
  - **Teaching Assistant (TA)**: Monitors Group B, enforces rules, and tracks time.  
  - **Instructor**: Monitors Group A and leads debrief.  

  #### **Materials**  
  - **Grid mats**: Two 4x4 grids (1 per group) drawn on large paper or whiteboard. Label rows 1–4, columns A–D.  
  - **Objects**: 5 distinct, small objects per group (e.g., red cup, blue pen, green book, yellow dice, black phone).  
  - **Rule cards**: Laminated index cards (1 per student).  
  - **Object cards**: Index cards with object names for initial arrangements.  
  - **Test sheets**: Half-sheet paper for the memory test (prepared in advance).  
  - **Timer**: Visible to all.  

  ---

  ### **Rule Cards (Handed to Each Group)**  
  **Group A (Absolute + Evidential) Rules**:  
  > "Describe object locations using **room-fixed bearings** (e.g., 'north of X,' 'south of Y'). **Do NOT use viewer-relative terms** (e.g., 'left/right').  
  > **Every claim must include a knowledge source**:  
  > - **SAW**: *I directly see the object*.  
  > - **INFERRED**: *I deduced from context (e.g., ‘Y is north of X, so Y must be…’)*.  
  > - **GUESSED**: *I’m uncertain*.  
  > Example: *‘The red cup is north of the blue pen – SAW. The green book is east of the cup – INFERRED.’*  
  > **Penalty**: Omit a marker? Your team loses 1 point."  

  **Group B (Viewer-Relative + No Evidential) Rules**:  
  > "Describe object locations **only from your viewpoint** (e.g., ‘left of X,’ ‘right of Y’). **Do NOT use bearings** (e.g., north/south).  
  > **State facts only. Never mention knowledge sources**.  
  > Example: *‘The red cup is left of the blue pen. The green book is above the cup.’*  
  > **Penalty**: Use a bearing or source marker? Your team loses 1 point."  

  ---

  ### **Round Structure (75 Minutes Total)**  
  1. **Setup (10 min)**  
     - Move tables into two circles (one per group).  
     - Assign groups and roles: Announce groups A/B, assign bilinguals as confederates (privately instruct them: *"Occasionally misdescribe one object location subtly – e.g., swap ‘left’ for ‘right’ or ‘north’ for ‘south’ – to force clarification"*).  
     - Distribute rule cards, grid mats, and objects.  
     - **Instructor script**: *"You’ll describe and reconstruct object arrangements. Follow your group’s rules strictly. Focus on accuracy and speed."*  

  2. **Description & Reconstruction Relay (35 min)**  
     - **Round 1 (15 min)**:  
       - Each group has an initial arrangement (5 objects on 4x4 grid). *Arrangements are identical across groups* (e.g., red cup at B2, blue pen at C3).  
       - **Describer 1 (randomly chosen)** views the arrangement, describes it verbally to **Builder 1** (who cannot see the grid). Builder reconstructs it on their grid.  
       - **TA/instructor**: Enforce rules loudly. Penalize violations immediately (e.g., *"Group A, no viewer-relative terms – lose 1 point!"*).  
       - **Confederates**: At minute 7, misdescribe one object (e.g., say "north" instead of "south"). Forces teammates to use linguistic rules to correct (e.g., Group A must use evidentials to debate: *"I SAW it was south – you GUESSED wrong"*).  
     - **Round 2 (15 min)**:  
       - New arrangement. Roles rotate: Describer 1 becomes Builder 2, etc.  
       - Increase pressure: Announce *"5-minute speed challenge: Fastest accurate reconstruction wins."*  
       - **Bilingual disruption**: Confederate in Group B "accidentally" uses a bearing (e.g., "north"). Group B must flag the error to avoid penalty, reinforcing the obligation.  
     - **Transition (5 min)**: Collect objects/grids. Distribute test sheets.  

  3. **Surprise Memory Test (15 min)**  
     - **Withhold until now** to avoid demand characteristics (participants can’t prepare for memory probes).  
     - **Test sheet questions**:  
       1. *Recall two object locations (e.g., "Where was the red cup?")* → Probes **attention to location**.  
       2. *Source knowledge (e.g., "How did you know the blue pen’s position? SAW/INFERRED/GUESSED/TOLD")* → Probes **attention to knowledge source**.  
       3. *Confidence rating (1–5 scale) for each answer* → Probes **habitual retention**.  
     - **Announce**: *"Answer based on what you remember from the activity. You have 5 minutes."*  

  4. **Debrief (20 min)**  
     - Use whiteboard to map moments from the activity to the three claims. **Do not pre-announce hypotheses** – use emergent outcomes.  
     - **Debrief script (keyed to moments)**:  
       - *After test collection*: *"Group A, you had to state knowledge sources. Who found it forced you to attend differently?"* → Highlight **obligation (Claim 2)**.  
       - *When a student mentions confusion*: *"Remember when Carlos (bilingual) said ‘north’ in Group B? How did you fix it without bearings?"* → Contrast **obligation vs. limitation (Claims 1–2)**: "You *could* correct it (no untranslatability), but you were *obliged* to use viewer-relative terms."  
       - *After sharing test results*:  
         - **If groups differ in source recall**: *"Group A remembered knowledge sources better but not locations. Why?"_ → **"Obligation (2) changed attention (3), but didn’t limit thought (1)."**  
         - **If no difference**: *"Even with no recall difference, did Group A’s evidentials slow descriptions? What does that cost imply?"_ → **"Obligation (2) has consequences (e.g., efficiency) without changing retention (3)."**  
       - *Final summary*: *"Today showed: Language doesn’t limit what you *can* think (1), but obliging speech (2) isn’t free – it costs attention or efficiency. And that *can* change habits (3), but not trivially – we saw it only when forced to engage deeply."*  

  ---

  ### **Predictable Problems & On-the-Spot Fixes**  
  1. **Problem**: Bilingual misdescriptions cause frustration.  
     - **Fix**: Prep confederates privately: *"Disrupt once per round, max. If teammates get angry, ‘admit’ error: ‘Sorry, I misread the rule!’"*  

  2. **Problem**: Evidential markers become rote (e.g., always "SAW").  
     - **Fix**: Instructor interjects during Round 2: *"Group A, if you SAW everything, why use a grid? INFRER or GUESS sometimes!"* Forces deeper engagement.  

  3. **Problem**: No test differences due to small sample size (n=22).  
     - **Fix**: In debrief, focus on qualitative conflict moments (e.g., bilingual disruptions) to illustrate obligation’s "cost." Ask: *"Did evidentials feel automatic? No? That gap between obligation and habit is the point."*  

  4. **Problem**: Group B "cheats" with silent translation.  
     - **Fix**: Confederate forces errors (e.g., "The cup is north" → penalties if not caught). TA aggressively monitors: *"Group B, no bearing terms – penalty!"*  

  ---

  ### **What This Cannot Reproduce (and How to Close the Gap)**  
  **The Gap**: *An hour-long constraint imposed on adults does not replicate the lifelong reinforcement of a grammatical system acquired natively, where obligatory categories become automatic and shape cognitive habits through cumulative exposure.*  
  - **Precision**: The activity isolates short-term *attentional costs* of linguistic obligation, but not the long-term *habitual entrenchment* seen in native speakers of languages with mandatory evidentials (e.g., Tuyuca) or absolute spatial terms (e.g., Kuuk Thaayorre).  
  - **How to Close It in Argument**: Post-activity, state:  
    > *"This gave you first-person evidence that obligation (2) doesn’t automatically imply attention shifts (3) – it took effort. But in real languages, these constraints are practiced for thousands of hours from childhood. That repetition *does* entrench habits – like how driving stick shift becomes automatic. We see this in studies: Tuyuca speakers attend to evidence sources reflexively; Kuuk Thaayorre speakers navigate by cardinal directions instinctively. The weak version’s power lies in that entrenchment, not the obligation alone."*  

  --- 

  ### **Final Recommendation**  
  - **Run this hybrid design**. It solves your core issues:  
    - **Spatial translation confound**: Addressed by bilingual disruptors forcing rule engagement.  
    - **Evidential degeneration**: Mitigated by source-monitoring during corrections and penalties.  
  - **Key strengths**: Generates conflict moments for debrief, tests Claim 2’s consequences without untranslatability, and provides "aha" evidence that Claim 3 isn’t trivial.  
  - **Logistics**: Use your TA to enforce rules strictly; start the timer visibly to amplify pressure.  

  This meets your specs: runnable in 80 minutes, materials on hand, and debrief keyed to in-class moments. I’ll refine this further if you share how the first run goes!
