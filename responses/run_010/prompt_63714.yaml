answer: |-
  1. P: I say, Q, isn't it splendidly determinate? Our metric field settles precisely who we are and where.
  2. Q: Quite. Though... have you noticed our mutual distance shifting oddly? The field *here* feels... rearranged.
  3. P: Nonsense! The field outside our little region is fixed. This must be the *same* physics, just differently parceled.
  4. Q: But if it's the same physics, and we're being scrambled, *who am I now*? Or you? Our very identities seem contingent on this redistribution!
  5. P: Precisely. Under Leibniz equivalence, we only owe what we are to the very field whose points we were supposed to individuate.
