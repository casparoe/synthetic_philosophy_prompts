  For counterattack, adaptationists might argue co-option: even if initially a byproduct, selection later refined it. I'll concede this for species with extreme flight styles but note it doesn't explain the trait's universal presence.

  Hmm... tricky part is making the developmental mechanism concrete. I'll specify how the scapula's dorsal ridge and primary feather bases interact during embryonic growth, forming an invariant angular junction. The geometry isn't genetically coded but emerges from tissue tensions - something a biologist could measure via misexpression experiments.

  Better avoid waterfowl since some don't fly much. Raptors work better - eagles need both flight and streamlining. For the engineering analysis, I'll cite induced drag reduction at high angles of attack, which is real physics but happens to be a side effect here.

