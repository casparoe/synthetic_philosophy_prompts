  The verdicts section will contrast: an adaptationist sees perfect optimization; a pluralist suspects architectural constraint; a structuralist argues geometry is sufficient. The key discriminating evidence would be finding the triangle in flightless birds with similar body plans - if it persists without function, that undermines adaptationism.

