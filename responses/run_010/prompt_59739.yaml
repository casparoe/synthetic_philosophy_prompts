answer: |-
  ### Scenario
  Consider *Falco structuralis*, a hypothetical falconid raptor inhabiting open grasslands. Its wings possess a distinct **hypotrachial triangle**—a small, scalene patch of stiffened integument where the primary feather bases converge dorsally just caudal to the shoulder joint. This triangle is smooth, abrasion-resistant, and aerodynamically flush with surrounding tissues, reducing drag during high-angle attacks. It arises not from direct genetic specification but as a geometric inevitability of two selected traits: (1) the acute **scapular angle** (∼22° dorsally), optimized for rapid humeral rotation during stooping, and (2) the **ventral curvature** of the primary feather follicles, minimizing turbulence by aligning shafts with airflow. During development, the scapula's dorsal ridge elongates under BMP4 signaling (selected for skeletal resilience), while follicle orientation is guided by Wnt7a gradients (selected for feather flexibility). As these structures meet, their intersecting planes—a steep scapular slope and shallow follicle curve—force a triangular transition zone. This is mathematically analogous to a conoid surface intersecting a cylinder, inevitably creating a triangular boundary facet. The triangle's dimensions are thus fixed by the relative growth trajectories of these two features, neither variable nor directly selected.

  ---

  ### 1. Evidence Inventory  
  **Comparative study**: Across 12 falconids (e.g., peregrine, kestrel, gyrfalcon), species with high-speed stooping show a strong phylogenetic correlation (PGLS p<0.001) between *larger* hypotrachial triangles and greater attack dive angles.  

  **Optimality model**: A fluid dynamics model predicts triangle apex angles of 50–55° for minimizing induced drag at 60–80° dive angles. Empirical measurements across species average 53.2° ±1.7°.  

  **Engineering analysis**: Wind tunnel tests show the triangle reduces vortices by 18% compared to smoothed artificial variants, decreasing stall risk during pull-up maneuvers.  

  **Why non-adaptive?**  
  - **Correlation**: Driven by shared selection on *dive angle* across falconids. Steeper dives select for steeper scapular angles (improving wing retraction speed), which mechanically enlarge the triangle.  
  - **Optimality**: The triangle’s "optimized" angle arises because scapular and follicle curvatures are independently tuned for flight performance, constraining the triangle to angles coincidentally ideal for drag reduction.  
  - **Functionality**: Drag reduction is a passive physical consequence of covering a discontinuity, not an evolved function.  

  ---

  ### 2. Verdicts  
  - **Strong adaptationist**: "The trait is an adaptation for drag reduction. Tight correlation with dive behavior, match to an optimality model, and demonstrated performance benefits confirm selection shaped it."  
  - **Pluralist (Gould–Lewontin)**: "This may be a structural byproduct. The evidence is consistent with adaptation but equally with developmental constraint. We must test if variation exists independent of scapula/follicle traits."  
  - **Structuralist**: "Geometry dictates the triangle. Its optimality is coincidental; no selection was needed. The trait lacks genetic or developmental pathways for independent modification, confirming it as a 'spandrel'."  

  ---

  ### 3. Discriminating Evidence  
  **Observation**: Find *F. structuralis* populations in dense forests (losing high-speed diving) with *reduced scapular angles* (e.g., for maneuverability) but *retaining the triangle* despite no drag issues at lower speeds.  

  **Why discriminative?** Adaptation predicts trait loss or reduction when functional pressure relaxes. Structuralism predicts trait persistence if scapula/follicle changes preserve the geometric intersection. This tests selectability without assuming mechanism.  

  ---

  ### 4. Load-Bearing Feature & Removal Test  
  **Load-bearing feature**: The **developmental integration** of scapular angle and follicle curvature. Their growth pathways are epigenetically linked (e.g., scapular BMP4 gradients suppress follicle Wnt7a ventrally).  

  **If weakened**: Suppose a mutation decouples scapula/follicle development (e.g., via altered BMP-Wnt crosstalk). Now:  
  - Adaptationists predict rapid triangle optimization for local functions.  
  - Pluralists/structuralists predict non-functional variation or malformation.  
    *Outcome*: In decoupled mutants, triangles vary randomly (25–70° angles) and often increase drag. Adaptationist verdict fails; structural necessity was key.  

  ---

  ### 5. Counterattack & Survival  
  **Adaptationist counterattack**: "The triangle was co-opted: initially structural, but later refined by selection (e.g., keratin density tuned for abrasion)."  

  **Surviving elements**:  
  - Co-option *could* explain micro-scale keratin adjustments.  
  - BUT the core geometric form, size, and angle remain developmentally locked to scapula/follicle traits. Optimality persists *without* historical selection on shape.  
  - Discriminating evidence (trait retention in non-diving ecotypes) and mutant variation still refute direct adaptation.  

  **Case survival**: 80%. The *primary trait geometry* remains a structural byproduct; co-option applies only to secondary modifications. The adaptationist toolkit still misattributes the trait’s origin.  

  ---

  ### Key Delicacy  
  The case hinges on **demonstrating developmental inevitability**. If biologists can show the triangle *always* emerges when scapula/follicle traits interact (e.g., via in vitro tissue recombination), structuralism holds. If not, adaptationists regain ground—but the evidence inventory *as given* remains misleadingly adaptive. This empirically validates Gould-Lewontin: without probing development, adaptationism errs.
