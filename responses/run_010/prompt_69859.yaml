prompt: |-
  I run a 90-minute reading group, about 25 people, mix of philosophy and econ — everyone's done one intro Bayes course, nobody's seen Aumann's proof. Design an in-class game that gets them to run into agreeing-to-disagree, and then to feel that the interesting question isn't the theorem but the common prior assumption sitting underneath it.

  The mechanic I want: two people can only "agree to disagree" by each accepting a small wager the other proposes, so the room can see that stubborn disagreement is supposed to leave money on the table. No real cash, points are fine, but the points have to actually matter to them by minute 40 or it's just talk.

  Then here's the twist to build in: the common prior gets broken quietly. Half the room gets a different base rate buried in their instruction sheet, framed as background fact rather than as evidence, and neither half is told the other half got something else. Give me rules, materials, a timeline for the 90 minutes, and a debrief that maps particular moments in play onto particular assumptions of the theorem.

  Be honest about whether they can actually tell apart "your priors differ" from "you don't have common knowledge of each other's posteriors" once I've broken both at once — if the activity can't separate them, say so and tell me what I'd have to add or cut to make it separable. Also what predictably goes wrong the first time I run this and how to handle it live.

  And in the debrief notes, keep settled stuff seperate from what people who work on this still argue about — whether the common prior assumption has any bite at all isn't a closed question. Don't hand me one side of that as the consensus.
reasoning: |-
  We are designing a classroom activity to illustrate Aumann's agreement theorem and the role of the common prior assumption. The key mechanic is that persistent disagreement should lead to opportunities for mutually beneficial bets, showing that disagreement leaves "money on the table." We will break the common prior by secretly giving half the room a different base rate.

  Important note: The activity will break both the common prior and common knowledge of posteriors. We cannot fully separate these in the activity without adding more steps. However, the debrief will discuss both.

  Structure:
  1. Introduction (10 minutes)
  2. Game Setup and Initial Play (30 minutes)
  3. Betting Phase (20 minutes)
  4. Debrief (30 minutes)

  Materials:
  - Instruction sheets (two versions, differing in base rate)
  - Betting slips (or a way to propose bets)
  - A way to record points (whiteboard or app)

  Game: "The Rare Disease"

  Premise:
  There is a rare disease. We are going to test a randomly selected person. The group will be split into two subgroups. Each subgroup is given a different base rate (prior) for the disease. They are not told that the other group has a different base rate.

  Version A (given to half the room): "The disease occurs in 1 in 1000 people in the general population."
  Version B (given to the other half): "The disease occurs in 1 in 100 people in the general population."

  Each participant is then given the same piece of evidence: a test result that is 95% accurate (5% false positive and 5% false negative rate). The test result is positive.

  They are to compute the posterior probability that the person has the disease.

  Instructions to participants:
  - Compute your posterior probability that the person has the disease.
  - You will then be paired with someone from the other group (without knowing they are from the other group) to discuss and see if you can agree on the probability.
  - If you cannot agree, you will have the opportunity to propose bets to each other.

  Betting Mechanism:
  Each participant can propose a bet to the other. The bet is structured as:
    - I (the proposer) am willing to bet that the person has the disease at odds corresponding to my posterior.
    - For example, if my posterior is p, then I would bet at odds of p : (1-p) (i.e., I would accept a bet where I get $1 if the disease is present and pay $ (1-p)/p if it is absent).

  But to make it simple, we can use a scoring rule. However, we want the bet to be bilateral and for them to see that if they disagree, they can design a bet that both would accept.

  Proposed betting rule (quadratic scoring rule for simplicity, but adjusted for two parties):

  We can use a mechanism where each player states their probability, and then they are offered a bet by the facilitator based on their stated probabilities. But we want them to propose bets to each other.

  Alternatively, we can have a market:

  Each participant writes down:
    - Their posterior probability (p)
    - The minimum odds at which they would bet on "disease" (i.e., they would bet on disease at odds better than (1-p)/p : 1) and similarly for "no disease".

  But that might be complex.

  Simpler: Each participant is given 10 points. They can propose a bet to the other by specifying:
    - The event (disease or no disease)
    - The amount they are willing to risk (from their 10 points) and the amount they want the other to risk.

  But this might be too open-ended.

  Another idea: Use the fact that if two people have different probabilities, they can agree to a bet that both think is favorable. We can have a pre-defined bet structure.

  Let's design a bet that can be proposed by either:

  Suppose Alice believes the probability of disease is p_A, and Bob believes p_B, and p_A > p_B.

  Then Alice should be willing to bet on disease at any odds better than (1-p_A)/p_A : 1 (so she expects to gain if the odds are more favorable than that). Similarly, Bob should be willing to bet against disease (i.e., on no disease) at any odds better than p_B/(1-p_B) : 1 (so he expects to gain if the odds are more favorable than that).

  If they set a bet where Alice bets on disease and Bob bets on no disease, then they can set the stake such that both think they have positive expected value if they set odds in the middle.

  But to make it simple for the classroom, we can have a standardized bet:

  The facilitator will offer a bet based on the two stated probabilities. But we want the participants to propose.

  Alternative: Each participant writes down a probability. Then the facilitator, knowing both, can design a bet that both would accept. However, we want the participants to see the opportunity.

  I propose:

  Step 1: Each participant computes their posterior and writes it on a slip (without sharing with others yet).

  Step 2: Pair up (one from group A and one from group B). They discuss and try to agree on a posterior. If they agree, they write down the agreed probability.

  Step 3: If they don't agree, each proposes a bet to the other. The bet proposal is: "I offer to bet on [my event] at [my odds]." But we need a concrete proposal.

  We can use a scoring rule for commitment. But let's do:

  Each participant has 10 points. They can propose a bet to the other by saying:

  "I am willing to bet X points that the person has the disease. If I am right, you pay me Y points. If I am wrong, I pay you Z points."

  But that is complex.

  Predefined bet: The bet is defined by a pair (a, b): 
  - If the disease is present, Alice pays Bob b points.
  - If the disease is absent, Bob pays Alice a points.

  Alice (who believes p_A) would only accept this bet if her expected loss is non-negative? Actually, we want both to think they are getting a good deal.

  We can set the bet so that it is favorable for both if they disagree.

  But to keep it simple, we can use a mechanism where each states their probability and then the facilitator offers a bet that both should accept if their probabilities are different.

  However, to have them propose, we can do:

  Each participant, if they disagree, can propose a bet by stating:
    - The event they are betting on (disease or no disease)
    - The amount they are willing to risk (say, R)
    - The amount they require the opponent to risk (say, S)

  But then the other might not accept because they don't agree on the event.

  Alternatively, we can have a bet that is symmetric: they choose a contract that pays 1 point if disease, 0 otherwise. Then they can trade this contract at a price.

  But that might be too much for a simple game.

  I suggest a simpler betting mechanism:

  Each participant writes down their probability. Then, without revealing the probabilities to each other, they are allowed to propose a bet. The bet is:

  "I will sell you a contract that pays 1 point if the person has the disease, at price P (in points)."

  The buyer then decides to buy or not. The seller must have P >= their probability (because they think the true value is lower and they are making a profit). The buyer must have P <= their probability (because they think the true value is higher).

  If the two have different probabilities, say p_A < p_B, then any price P in (p_A, p_B) would be acceptable to both: the seller (with p_A) would sell at P>p_A, and the buyer (with p_B) would buy at P<p_B.

  But in the game, they don't know each other's probabilities. So they have to negotiate.

  We can have a double auction: each states a bid (buy price) and an ask (sell price). Then if the bid is above the ask, they can trade at the midpoint.

  But that might be complex and time-consuming.

  Simplified version for the classroom:

  After discussion, if they still disagree, each writes down a number: the price at which they would be willing to buy or sell a contract that pays 1 if disease (so this price is their posterior probability). Then the facilitator collects and checks: if one participant's price is higher than the other, then there is a trade. The trade happens at the midpoint. Then, when the truth is revealed (we need a resolution), they settle the bet.

  But we don't have a resolution? We are not actually going to know the disease status. We are just illustrating that they would trade.

  We can skip the actual resolution and just note that they would have traded. The point is that they leave money on the table by not trading.

  So, in the activity, we can simulate the trade without resolving the event.

  But then how do they see the value? We can compute the expected gain for each based on their own probability.

  For example, if Alice sells at price P and her probability is p_A, then she expects to gain: 
    (1-p_A)*P - p_A*(1-P) = P - p_A

  Similarly, if Bob buys at price P and his probability is p_B, he expects to gain:
    p_B*(1-P) - (1-p_B)*P = p_B - P

  If P is between p_A and p_B, then both expect positive gains.

  So even without resolution, they can see that they both expect to make money.

  Activity Steps:

  1. Introduction (10 min):
     - Explain the scenario: rare disease, we have a test result (positive) and the test is 95% accurate.
     - They will compute the probability that the person has the disease.

  2. Setup (5 min):
     - Hand out instruction sheets. Half get version A (base rate 1/1000), half get version B (base rate 1/100). They are not told that there are two versions. The base rate is presented as a known fact.

  3. Individual Calculation (10 min):
     - Each participant calculates their posterior probability. Provide a formula if needed (Bayes' theorem). But they should know how to do it.

     For version A (base rate 1/1000):
        Prior: P(D) = 0.001, P(not D) = 0.999
        P(positive|D) = 0.95, P(positive|not D) = 0.05
        Posterior = [0.001 * 0.95] / [0.001*0.95 + 0.999*0.05] ≈ 0.01866 (about 1.87%)

     For version B (base rate 1/100):
        Prior: P(D)=0.01, P(not D)=0.99
        Posterior = [0.01*0.95] / [0.01*0.95 + 0.99*0.05] ≈ 0.161 (about 16.1%)

     So group A will have about 1.87% and group B about 16.1%.

  4. Pairing and Discussion (10 min):
     - Pair each participant from group A with one from group B (without revealing the groups). They discuss and try to agree on a single posterior probability. They are not to reveal their base rate (since they don't know there are two versions, they might not think to). They only discuss the evidence and their calculations.

  5. Betting Phase (15 min):
     - If they agreed, they report the agreed probability and move on.
     - If they did not agree, they enter the betting phase.
          - Each writes down their posterior probability (without showing the other).
          - Then, each writes down a "bid" and an "ask": 
              - Bid: the highest price at which they would buy a contract that pays 1 point if disease (this should be their posterior).
              - Ask: the lowest price at which they would sell such a contract (also their posterior).
          - The facilitator then checks: if the bid of one is greater than the ask of the other, then they trade at the midpoint of the bid and ask.
          - Since they both have the same bid and ask (equal to their posterior) and their posteriors are different, the one with the higher posterior (group B) will have a bid (say 0.16) and the one with the lower (group A) will have an ask (say 0.02). Since 0.16 > 0.02, they trade at (0.16+0.02)/2 = 0.09.
          - The contract: the seller (group A participant) receives 0.09 points now, and if the disease is present, they must pay 1 point to the buyer (group B participant). If not, they pay nothing.

          But note: we are not actually going to resolve the disease. So we can just note that both would have made an expected profit.

          We can have them compute their expected profit given their own probability.

          For the seller (group A, p=0.0187):
            They get 0.09 and if disease (with prob 0.0187) they pay 1. So expected loss from the payment: 0.0187 * 1 = 0.0187. So expected profit = 0.09 - 0.0187 = 0.0713 points.

          For the buyer (group B, p=0.161):
            They pay 0.09 and if disease they get 1. Expected gain: 0.161 * 1 = 0.161. Expected profit = 0.161 - 0.09 = 0.071 points.

          Both have positive expected profit.

          We can have the facilitator announce that a trade occurred and that both parties would have expected to gain (without revealing the amounts).

  6. Debrief (30 min):

  Debrief Structure:

  a. First, ask for the computed posteriors from each group. Write them on the board. They should be around 1.87% and 16.1%. Ask if anyone agreed? (Probably not, since they are far apart.) Then reveal that there were two base rates.

  b. Highlight that they started with different priors (base rates) and that the common prior assumption was broken.

  c. Discuss the betting: those who traded both thought they were getting a good deal. That's because they had different probabilities. If they had the same probability, they wouldn't trade.

  d. Map to Aumann's theorem:
     - Aumann's theorem says that if two people have the same prior and their posteriors are common knowledge, then they must agree.
     - Here, they didn't agree. Why? Because they didn't have the same prior? Or because they didn't have common knowledge of each other's posteriors? In the activity, they did share their posteriors in the discussion? But note: they didn't necessarily trust each other's calculations? And they didn't know about the base rate difference.

     Actually, in the activity, they did not have common knowledge of the base rates. The base rates were not shared. Also, they might not have fully revealed their posteriors? In the discussion, they might have just argued without explicitly stating their posterior.

     We broke two things:
        - Common prior (by giving different base rates)
        - Common knowledge of information (because the base rates were private, and even if they stated their posteriors, they didn't know why the other had a different prior)

  e. Separating the issues: The activity does not separate the two breaks because we broke both at once. To separate:
     - To show the effect of common knowledge, we would need a common prior but break common knowledge of posteriors. How? We could have both groups with the same base rate, but then give them different evidence? But then they would have different posteriors and that would be expected. 
     - Alternatively, we could do an activity where they have the same prior and same evidence but update differently because they don't trust each other? But that would be irrational.

     Actually, Aumann's theorem assumes rational updating and common prior. So if we have common prior and common knowledge of posteriors, they should agree.

     To show the common knowledge part, we could do an activity where they have the same prior and same evidence, but they don't share their posteriors? But then they don't have common knowledge of posteriors. However, if they do share, then they should agree.

  f. Discuss the common prior assumption:
     - Is it reasonable? In the real world, do we have common priors?
     - What if we don't? Then disagreement is possible even if they are rational and share their posteriors.

  g. Controversy: Some argue that the common prior assumption is too strong. Others argue that it is a useful modeling device. There isn't a consensus.

  Predictable problems:

  1. Calculation errors: Some participants might miscalculate the posterior. To mitigate, provide a formula or calculator. Or do the calculation together at the beginning for a simple case (with the same prior) to remind them.

  2. Not revealing base rates: Participants might not think to share the base rate because they don't know there are two versions. That's by design.

  3. In the betting phase, they might not understand the bet. We can do a demo with a known probability.

  4. Time: The calculation might take longer than expected. We can provide a worksheet with the formula.

  Revised Timeline:

  - 0-10 min: Introduction and scenario explanation. Do a quick example with a known prior (say 1/100) to remind them of Bayes.
  - 10-15 min: Hand out instruction sheets (two versions) and have them compute individually. Walk around and help.
  - 15-25 min: Pair up and discuss to try to agree on one probability. They have 5-10 minutes.
  - 25-35 min: Betting phase: if they didn't agree, they write down their bid/ask (which is their posterior). The facilitator (or a TA) quickly checks for each pair and announces if a trade occurs. They don't have to compute the exact expected profit, just note that both would have expected to gain.
  - 35-40 min: Reveal the two base rates and the two typical posteriors.

  Debrief (40-70 min):

  1. (5 min) Ask for experiences: Did anyone agree? How did the discussion go?
  2. (5 min) Show the two posteriors on the board and the two base rates. Ask: Why did they not agree?
  3. (10 min) Explain Aumann's theorem: with common prior and common knowledge of posteriors, agreement is necessary. Here, the common prior was broken.
  4. (5 min) The betting: even though they didn't agree, they could have traded and both expected to gain. This is the "money left on the table" that Aumann's theorem avoids.
  5. (5 min) But note: we also didn't have common knowledge of the posteriors? Or did we? In the discussion, they might have stated their posteriors, but without knowing the base rates, they didn't know why the other had that posterior. So common knowledge of the information structure was missing.
  6. (5 min) Controversy: Is the common prior assumption realistic? What if we have different life experiences? Some economists think it's a useful fiction, others think it's too strong.

  Conclude: The common prior assumption is a key element in the theorem, and without it, disagreement can persist even when rational agents share their beliefs.

  Note: We did break both the common prior and the common knowledge of the information structure. In the debrief, we can separate them conceptually.

  To separate in a future activity, we could run two rounds:

  Round 1: Same prior, but different evidence (and they don't share the evidence). Then they have different posteriors. Then they share posteriors but not evidence? Then they should update to the same posterior? But that requires them to incorporate the other's evidence. And if they share the evidence, then they should update to the same posterior. But if they don't trust the evidence? That's beyond the scope.

  Given the time, the current activity is sufficient to illustrate the common prior part.

  Handout Materials:

  - Instruction sheet (Version A and Version B)
  - Worksheet for calculation
  - Betting form (for bid and ask)

  Version A instruction sheet:
  ```
  Background: The disease occurs in 1 in 1000 people in the general population.

  You have a test for the disease that is 95% accurate. That means:
  - If a person has the disease, the test will be positive 95% of the time.
  - If a person does not have the disease, the test will be negative 95% of the time (so 5% false positive).

  A randomly selected person from the general population is tested and the test is positive.

  What is the probability that this person actually has the disease? 
  ```

  Version B: same but with "1 in 100".

  Betting form:
  ```
  Your computed posterior probability: _________

  If you did not agree with your partner, please write:
    The highest price at which you would buy a contract that pays 1 point if the person has the disease: _________ (this should be your posterior probability)
    The lowest price at which you would sell such a contract: _________ (same as above)

  [The facilitator will then check if there is a trade.]
  ```

  This should fit in 90 minutes.
answer: |-
  ### **Agreeing to Disagree: A Classroom Activity on Aumann’s Theorem & Common Priors**  
  **Total Time:** 90 minutes  
  **Participants:** 25 people, mixed philosophy/econ, intro Bayes background.  

  ---

  ### **Game Design: "The Oracle's Test"**  
  **Premise:**  
  A rare artifact (e.g., a lost manuscript) is either authentic (A) or a forgery (¬A). Participants are "researchers" reviewing a new forensic test result. The twist: **Half the room gets a base rate of 1% for authenticity (Group A), the other half gets 10% (Group B)**. This is buried in their instructions as "historical background."  

  **Materials:**  
  - **Instruction sheets** (two versions, subtly differing in base rate).  
  - **Betting slips** for wager proposals.  
  - **Public scoreboard** (points = "research prestige," affecting a prize, e.g., extra credit or symbolic reward).  
  - **Timer** for phases.  

  ---

  ### **Rules & Timeline**  
  #### **Phase 1: Setup & Individual Calculation (15 min)**  
  - **Min 0–5:** Distribute instruction sheets.  
    - *Group A (12 people):* "Historical archives show 1% of such artifacts are authentic."  
    - *Group B (13 people):* "Historical archives show 10% are authentic."  
    - *Both groups get:* "A new forensic test is 90% accurate (10% false positives/negatives). The test result is *positive* for authenticity. Calculate the probability the artifact is authentic (P(A|test+))."  
  - **Min 5–15:** Participants calculate posteriors individually (provide Bayes’ formula as backup).  
    - *Group A posterior:* P(A|test+) ≈ 8.3% (prior: 0.01).  
    - *Group B posterior:* P(A|test+) ≈ 50% (prior: 0.1).  

  #### **Phase 2: Pair Discussion (15 min)**  
  - **Min 15–30:** Pair Group A and Group B members (hide group identities).  
    - *Task:* Discuss and agree on a single posterior. Do not reveal your base rate.  
    - *Key tension:* Groups A and B will anchor to their priors. Disagreements flare (e.g., "Why are you so skeptical/optimistic?").  

  #### **Phase 3: Betting Phase (20 min)**  
  - **Min 30–40:** If a pair **disagrees**, they enter the betting phase.  
    - *Mechanic:* Each proposes a small wager (1–2 points) to the other:  
      - *Bet structure:* "I offer to bet [X] points that the artifact is [A/¬A] at odds [Y:1]."  
      - *Example (Group A member):* "Bet 1 point that it’s a forgery (¬A) at 1:9 odds."  
        - If ¬A, Group B pays Group A 9 points.  
        - If A, Group A pays Group B 1 point.  
    - *Incentive:* Points matter! At minute 40, the top 3 scorers get a prize (e.g., "expert researcher" title).  
  - **Min 40–50:** Pairs publicly post bet offers on a board. Others observe "money left on the table":  
    - *Group A* typically offers bets on ¬A (low P(A)); *Group B* on A (high P(A)).  
    - **Critical moment:** When stubborn pairs *reject* mutually beneficial bets (e.g., Group A refuses Group B’s bet on A at generous odds).  

  #### **Phase 4: Reveal & Debrief (40 min)**  
  - **Min 50–55:** Reveal the base rate split. Show typical posteriors (8.3% vs. 50%).  
  - **Min 55–90:** Structured debrief.  

  ---

  ### **Debrief: Mapping Activity to Aumann’s Theorem**  
  **Key Moments & Assumptions:**  
  | **Moment in Activity**       | **Aumann’s Assumption**                          | **Debrief Question**                                                                 |  
  |------------------------------|--------------------------------------------------|--------------------------------------------------------------------------------------|  
  | **Persistent disagreement**   | Common prior (violated)                          | "Why couldn’t you agree despite sharing the test result? What was *not* common?"     |  
  | **Rejected beneficial bets**  | Common knowledge of posteriors (violated)        | "If you knew their posterior, why couldn’t you update? Did you trust their calculation?" |  
  | **Base rate reveal**          | Prior ≠ "background knowledge"                   | "Was the base rate 'evidence' or 'world structure'? Who owns the prior?"             |  

  **Controversies & Settled Insights:**  
  - **Settled:**  
    - Aumann’s theorem *requires* a common prior to force agreement. Without it, rational disagreement persists.  
    - Bets reveal irrationality *only if* priors are common. Here, bets were rejected because priors differed, not because players were irrational.  
  - **Open Questions:**  
    - **Does the common prior have "bite"?**  
      - *Pro:* Priors *must* align if agents are "born from the same universe." (Consensus in Bayesian models.)  
      - *Con:* Real-world priors are shaped by experience—common priors are normative, not descriptive. (Harsanyi vs. Aumann debates.)  
    - **Can we separate "differing priors" from "no common knowledge"?**  
      - **Not in this activity—both were broken.** To separate them:  
        - *Fix common knowledge:* Run a variant where base rates are public, but players hide their posteriors. Show they *still* disagree until posteriors become common knowledge.  
        - *Fix common prior:* Use identical base rates but let one player see a second test result privately. Show they agree only after sharing *all* evidence.  

  **Predictable Problems & Fixes:**  
  1. **"Why would I trust their wager?"**  
     - *Problem:* Players dismiss bets as bluffs.  
     - *Fix:* Emphasize "rational agency" rules. Award points automatically if a bet is accepted, regardless of outcome.  

  2. **Calculation errors derail the lesson.**  
     - *Problem:* Participants botch Bayes’ rule.  
     - *Fix:* Provide a calculator and formula sheet. Pre-calculate examples for each group.  

  3. **Betting phase stalls.**  
     - *Problem:* Pairs haggle over odds.  
     - *Fix:* Give a bet menu: "Choose to bet on A or ¬A at preset odds (1:1, 1:4, 1:9)."  

  4. **"This feels arbitrary!"**  
     - *Problem:* Points feel meaningless.  
     - *Fix:* At minute 30, announce a prize (e.g., "Top scorers pick the next reading").  

  ---

  ### **Conclusion**  
  This activity forces a clash between intuitive disagreement and rational updating. By minute 40, the room *sees* money left on the table, making the common prior assumption visceral. The debrief doesn’t resolve the philosophical debate—it highlights where Aumann’s theorem *ends* and the harder questions begin.  

  **Final Tip:** Run the betting phase fast and loud. When a Group A member shouts, "No deal—your bet is too risky!" you’ve got them.
