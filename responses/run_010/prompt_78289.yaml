prompt: |-
  I am assembling a methods session for an advanced undergraduate seminar in historical theory, and I have put together what I intend to present as a reductio of the standing demand that historians avoid judging the past by the standards of the present. My difficulty is that I have come to think the reductio succeeds, and I very much do not want it to. Below is the argument exactly as I hand it to the students. The steps are numbered so that you can point at one of them rather than at the whole.

  (1) Any judgment a historian passes on the past is formulated in concepts the historian possesses, and the historian possesses only the conceptual and normative resources of the present.
  (2) Those resources were not selected for tracking moral truth. They were inherited from the controversies, institutions, and vocabularies of the historian's own time, and they carry that provenance with them.
  (3) So when a historian condemns a past practice, what the condemnation reports is a relation between the practice and the historian's inherited standards — not a fact about the practice considered on its own.
  (4) The obvious escape is to judge past actors by the standards of their own society instead. But identifying what those standards were is itself a task of selection and description, and selection and description require the historian's present concepts; the escape therefore reproduces the original problem one level up.
  (5) Hence there is no standpoint from which a historian's moral judgment is anything other than the present speaking in the past's name.
  (6) It is illegitimate to hold a person responsible for failing a standard they could not reasonably have recognized; an agent's obligations extend no further than the reasons available to that agent.
  (7) By (5), no standard a historian applies is one the past actor could reasonably have recognized as a standard; from the actor's position it arrives as a foreign rule.
  (8) Therefore no historical condemnation is ever legitimate, and the only fair posture toward the past is the suspension of moral judgment.
  (9) Yet historians and their readers do condemn the past — chattel slavery, the Atlantic trade in enslaved people, the burning of heretics — and those condemnations seem to be among the most secure things historical writing delivers, not among its most doubtful.
  (10) So something in (1) through (7) must go; and since (9) is the most secure item in the list, what goes must be the demand itself: judging the past by present standards is not an error to be avoided but a condition that cannot be avoided.

  Two features of (10) are what I cannot live with. It dissolves the entire methodological debate it was meant to settle, since if the charge of presentism can never be made out, the injunction against it is empty advice; and it is symmetrical in a way that embarrasses me, because if I substitute future historians for present ones, the same steps appear to show that our own conduct is immune in principle to the appraisal of our successors, and that my own conclusion is no better grounded than the practices it condemns. I would most like to keep (9), and I would also like to keep (1), which strikes me as close to a truism; I suspect (6) is where the pressure should go, but I am reluctant to abandon it outright, because a good deal of ordinary fairness depends on something like it. Colleagues have offered me at least three different exits, and they are mutually incompatible.

  What I want from you is a diagnosis, not a verdict on whether historians should moralize. Specifically: identify the step or steps that fail and explain why each of them looked acceptable at first pass; say whether the failure is a false premise, an invalid inference, or an inference that is valid only on a reading the earlier steps do not actually supply. If you think the argument is in fact valid, say instead which premise is cheapest to surrender and price that surrender explicitly. Then tell me what your diagnosis commits one to — among the contextualist, the moralist, and the interpretive positions on this question — and whether any non-trivial version of the injunction against presentism survives your repair, and if so, what it would actually forbid a historian to do. Please adjudicate the three exits rather than surveying the literature; I do not want a bibliography, and you may name positions without citing them.

  Write the answer in American English. Give me the diagnosis in prose first. Then provide an audit of the argument as a table with exactly these columns: **Step** (the number from my list); **Claim** (a neutral one-sentence restatement in your own words); **Status** (exactly one of: sound premise, contestable premise, false premise, valid inference, invalid inference, inference valid only on an unsupported reading); **Why it looks acceptable** (the principle, intuition, or precedent that recommends it); **Pressure point** (the specific defect, ambiguity, or smuggled assumption, or "none" if the step survives); **Cost of rejecting it** (what must be conceded elsewhere by anyone who gives it up). Close with a JSON object, and no other text after it, using these fields: `step_to_reject` (integer), `kind_of_defect` (one of "false premise", "invalid inference", "scope or reading shift", "no defect; argument valid"), `cheapest_premise_if_valid` (integer, or null if you found a defect), `what_survives_of_the_injunction` (a single sentence describing what the anti-presentist charge can still forbid, or "nothing"), `asymmetry_resolved` (a single sentence saying whether your diagnosis blocks the future-historians version of the argument, and how).
reasoning: |-
  Hmm, the user is assembling a methods session for an advanced undergraduate seminar in historical theory. They've developed what they intended as a reductio ad absurdum against the common injunction that historians shouldn't judge the past by present standards. But they've found that their own argument succeeds in showing that all historical moral judgment is impossible - and they're deeply uncomfortable with this conclusion.

  The argument has 10 steps that appear to prove that moral condemnation of the past is always illegitimate. The user specifically dislikes step (10) because it dissolves the entire methodological debate about presentism and creates an embarrassing symmetry where current historians couldn't be judged by future ones either.

  I need to diagnose where the argument goes wrong without simply taking sides in the historians' debate about moralizing. The user wants me to identify specific faulty steps, explain why they seemed plausible at first, and show what each rejection would cost. They also want to know what survives of the injunction against presentism and whether the symmetry problem gets resolved.

  Looking at the argument: Step (1) seems solid - historians do use present concepts. Step (2) is contestable but has some truth - concepts do have historical baggage. Step (3) follows logically but already assumes concepts can't transcend their time. Step (4) cleverly shows the problem recurses when trying to use past standards. Step (5) is the dangerous conclusion that all judgment is just "present speaking." Step (6) about moral responsibility seems initially plausible but is actually the key pressure point. Step (7) combines previous steps problematically. Step (8) is the absurd conclusion. Step (9) correctly notes we do condemn things like slavery confidently. Step (10) says we must therefore accept presentism as unavoidable.

  The critical failure is in step (6). It smuggles in a hyper-individualist view of moral responsibility that doesn't hold up. We regularly hold people responsible for failing standards they "couldn't have recognized" when those standards protect fundamental human interests. The cost of rejecting (6) is conceding that moral truth might exist independently of local recognition - but we can still keep the insight that context matters for fair assessment.

  Step (7) then fails because it applies this faulty view of responsibility to history. The inference is invalid due to the problems in (6). The rest of the argument collapses accordingly.

  My diagnosis preserves the injunction against presentism in a meaningful way: it forbids anachronistic readings that ignore historical context, while allowing substantive moral judgments about practices that violate transhistorical human values. It also breaks the symmetry - future historians could rightly condemn us for similar fundamental violations, since the argument against (6) applies equally to all times.

  For the table audit, I'll need to carefully classify each step - noting where premises are contestable or inferences invalid. The JSON should clearly state we reject step (6) as a false premise, with step (7) as invalid inference due to that rejection. The injunction survives as forbidding context-insensitive moralizing, and asymmetry is resolved because moral truth isn't time-bound in the way the original argument assumed.

  The user is clearly intellectually honest - they're troubled by their own successful reductio. My response should honor that by being precise about where the logic fails while preserving their valid concerns about methodological rigor.
answer: |-
  ### Diagnosis
  The argument's critical failure occurs at step (6), which presents a **false premise** about moral responsibility. While step (6) captures a *prima facie* plausible principle of fairness—that agents cannot be blamed for standards they couldn't reasonably access—it erroneously assumes moral obligations are *entirely* bounded by locally available reasons. This ignores the possibility of transhistorical moral truths (e.g., prohibitions against torture or slavery) that persist regardless of an era’s dominant norms. Step (6) conflates **epistemic access** (what agents could recognize) with **moral ontology** (what is objectively wrong). When step (7) applies this flawed premise to historical condemnation, it produces an invalid inference: even if past actors lacked access to *our* articulation of a standard, they might have violated a fundamental moral truth accessible through reason or basic human empathy.  

  Step (4) is a **contestable premise** but not fatal; it correctly notes that reconstructing past standards requires present concepts, yet this doesn’t doom contextual judgment. Historians can triangulate past norms through evidence (e.g., contemporaneous critiques of slavery) without claiming perfect objectivity. Step (5) overreaches by inferring that *all* moral judgment is "the present speaking," which ignores that historians may appeal to defeasible moral constants.  

  The symmetry problem (future historians judging us) dissolves because rejecting step (6) allows for **asymmetric moral progress**: if moral truth exists, later generations can legitimately condemn earlier violations *they* better understand, while our self-appraisal remains limited by our epistemic context. The injunction against presentism survives as a guard against **anachronistic interpretation**—forbidding historians to ignore historical actors’ own frameworks or to treat past societies as mere avatars for modern debates.  

  ---

  ### Argument Audit Table

  | Step | Claim                                                                                              | Status                  | Why it looks acceptable                                                                 | Pressure point                                                                                                    | Cost of rejecting it                                                                 |
  |------|----------------------------------------------------------------------------------------------------|-------------------------|-----------------------------------------------------------------------------------------|-------------------------------------------------------------------------------------------------------------------|--------------------------------------------------------------------------------------|
  | 1    | Historians must use present-day concepts and norms to evaluate the past.                           | Sound premise           | Self-evident: we cannot access tools outside our intellectual milieu.                   | None                                                                                                              | None (conceding this is unavoidable).                                                |
  | 2    | Present concepts are historically contingent, not designed for moral truth-tracking.               | Contestable premise     | Historical relativism: concepts emerge from specific cultural conflicts.                | Overstates arbitrariness; moral concepts may track enduring realities.                                            | Weakens skepticism about moral objectivity.                                          |
  | 3    | Condemnations of past practices only reflect their clash with the historian’s inherited standards. | Invalid inference       | Seems to follow from (1)-(2); aligns with cultural relativism.                          | Smuggles non-cognitivism: assumes moral judgments cannot refer to mind-independent wrongs.                        | None (rejecting it costs nothing if (6) is false).                                   |
  | 4    | Judging by past standards fails because describing those standards relies on present concepts.     | Contestable premise     | Hermeneutic circularity: we interpret the past through modern lenses.                   | Overlooks that evidence can constrain interpretations of past norms.                                              | Requires accepting fallibilism in contextual reconstruction.                         |
  | 5    | All historical moral judgment is merely the present imposing itself on the past.                   | Invalid inference       | Appears consistent with (1)-(4); reinforces postmodern critiques.                       | Depends on (3) and (6); ignores that judgments may align with transhistorical truths.                             | None (collapses if (6) fails).                                                       |
  | 6    | Agents cannot be held responsible for standards they could not reasonably recognize.               | **False premise**       | Intuitive fairness (e.g., excusing ignorance in legal/moral contexts).                 | Hyper-individualist: ignores that some wrongs (e.g., genocide) are recognizable across contexts via basic reason. | Must concede moral realism (some wrongs exist independently of local recognition).   |
  | 7    | Past actors could not recognize historians’ standards as valid.                                    | Invalid inference       | Follows from (5)-(6); emphasizes historical distance.                                   | Invalid due to falsity of (6); past actors *might* have recognized core wrongs.                                   | None (fails with (6)).                                                               |
  | 8    | Historical condemnation is always illegitimate; suspend moral judgment.                           | Invalid inference       | Logical conclusion if (1)-(7) hold.                                                     | Entirely dependent on prior flawed steps.                                                                         | None.                                                                                |
  | 9    | Historians confidently condemn practices like slavery; these judgments feel secure.                | Sound premise           | Observational: historical practice affirms moral certainty about atrocities.            | None                                                                                                              | None (retain this).                                                                  |
  | 10   | Therefore, presentism is unavoidable, and the injunction against it is empty.                      | Invalid inference       | Appears forced by (8) and (9); resolves the contradiction.                              | Depends on (8), which fails; ignores alternative resolutions (e.g., rejecting (6)).                               | None (avoided by repairing earlier steps).                                           |

