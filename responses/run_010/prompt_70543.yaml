prompt: |-
  So I'm a third year in political philosophy and this term I somehow ended up running our department's grad student podcast — format is one outside speaker, no slides, forty minutes of unscripted Q&A with me moderating and someone editing out the ums afterwards. Next week's guest is a political philosopher with a book coming out that defends benefit conditionality: job search requirements, sanctions for non-compliance, the whole apparatus. She's not a strawman and she's a good talker, and my problem is that the audience has just done a week of luck egalitarianism and relational egalitarianism so most of them are already hostile, and two of them have separately told me they plan to ask the same question about sanctions pushing people into rough sleeping. I'd rather head that off with something better than let it turn into a pile-on that my supervisor then has to listen to.

  The thing is her position is an unusual package and I want the questions built out of that package, not out of the standard critiques, which she obviously has answers to. Roughly, as I read the intro chapter: (i) she thinks the deserving/undeserving framing is a red herring — what deservingness is actually doing in welfare administration is screening under imperfect information about who's willing to contribute, and the moral desert talk is just an ex post gloss on the screen; (ii) the real justification for sanctions is expressive, i.e. what matters is the message a conditional scheme sends to net contributors, because that message is what sustains the solidarity and tax compliance the whole thing rests on; (iii) so the harshness objection supposedly misses, since a sanction isn't a punishment and isn't tracking anyone's blameworthiness — it's a costly signal, and the cost has to land on the claimant because a costless option wouldn't signal anything at all; (iv) she grants that sanctions can be counterproductive in practice but denies that's decisive, because the expressive requirement constrains the design of the scheme, not its outcomes.

  Can you write me nine or ten questions for her, and for each one give me (a) the question as I'd actually say it out loud, short enough to be asked in about twenty seconds, (b) one or two sentences on the reply she's most likely to give, and (c) a follow-up keyed to that specific reply so she can't just restate (i)-(iv) at me? Nothing should ask her to explain or restate her own view, and no softballs like what got you interested in this — assume she and the room know the familiar objections (the imprudent-driver style cases, the point about means-testing forcing people into revelations they'd reasonably be ashamed of, the structural-injustice line) by name. The angles I most want hit:

  - the open-endedness of costly signalling — if the cost has to be credible to the audience, who fixes the level, and hasn't she just handed the harshness objection back to herself wearing different clothes, since there's no principled upper bound on how much hardship counts as enough signal;
  - whether screening and expressivism can really be pulled apart — contributors will read a sanction as a desert judgement, so the moral content she wants to bracket comes back in through the audience's uptake. I want her pushed on uptake specifically, not on intentions;
  - the asymmetry with tax non-compliance, given she's making the message to contributors load-bearing;
  - claimants with no market-valued capacity at all: what message does the scheme send about them, and does she need an independent needs-based principle for that group — and if she does, is conditionality carrying any justificatory weight, or is it just a tax on the marginal cases;
  - whether a sanction that isn't a punishment is distinguishable from punishment in the sense that does any work, i.e. if the state knowingly imposes a serious foreseeable harm on someone for failing to do what it requires, what's actually left of her distinction;
  - the self-defeat worry: she should be made to name which empirical claim in her argument is load-bearing and which is dispensable, and say what finding would make her drop the view — that's my closer.

  Also — and this matters to me — include one or two questions where you think she genuinely has a good answer and the honest move is to concede it, and mark those, so the session doesn't read as an ambush. For each follow-up, tell me whether it's meant to press a real weakness in the package or just to stop her retreating into a definition, because those need different delivery.
reasoning: |-
  Hmm, the user is a third-year political philosophy student running a grad student podcast with a challenging guest. They need help crafting questions for a political philosopher who defends benefit conditionality. The guest has an unusual approach that avoids the typical deserving/undeserving debate and instead focuses on screening and expressive justifications.

  The user's audience is hostile after studying luck egalitarianism and relational egalitarianism, with two students planning to ask about sanctions causing homelessness. The user wants to avoid a pile-on and instead engage with the guest's specific framework. They need about 9-10 questions that challenge the core ideas without being repetitive or softballs.

  Key aspects of the guest's position: (i) deservingness is a screening mechanism, not moral judgment; (ii) sanctions express solidarity to sustain tax compliance; (iii) sanctions aren't punishments but costly signals; (iv) counterproductivity isn't decisive because outcomes don't affect the expressive function.

  The user specifically wants questions targeting:
  - The open-endedness of costly signaling (no upper bound on hardship)
  - Whether screening and expressivism can truly be separated (audience uptake reintroduces desert)
  - Asymmetry with tax non-compliance
  - Claimants with no market-valued capacity
  - Distinction between sanctions and punishment
  - Empirical foundations (what evidence would make her abandon the view)

  I should also include 1-2 questions where she has strong answers to avoid an ambush feel. Each question needs three parts: the actual spoken question (20 seconds max), predicted response, and targeted follow-up. Follow-ups should either press weaknesses or prevent definitional retreats.

  For the costly signaling angle, I'll frame a question about the lack of upper bounds on hardship. Her likely response will emphasize institutional design and democratic constraint. A good follow-up would challenge whether this makes expressivism dependent on contingent politics rather than principle.

  On uptake and desert, I'll ask how the public interprets sanctions. She'll probably say she's describing not prescribing perceptions. The follow-up should press whether ignoring uptake undermines the expressive function itself.

  For tax asymmetry, I'll ask about penalizing tax evasion similarly. She'll distinguish between reciprocal and unilateral obligations. The follow-up can challenge whether this creates a double standard in messaging.

  Regarding non-market-able claimants, I'll ask what message conditional schemes send about them. She'll likely point to unconditional disability benefits. The follow-up should question whether this undermines her core justification for conditionality.

  On the punishment distinction, I'll ask how sanctions differ from punishment if they cause foreseeable harm. She'll emphasize intent versus effect. The follow-up can press whether intent matters when harm is identical.

  For the empirical foundation, I'll ask what evidence would falsify her view. She'll probably cite evidence that sanctions don't increase solidarity. The follow-up should note this concedes that expressivism relies on empirical claims.

  I'll include a "strong answer" question about the screening function in imperfect information contexts, where she can effectively argue that conditionality reveals preferences without moral judgment. This shows good faith engagement.

  Another "strong answer" question could be about counterproductivity not refuting expressivism, where she can explain the conceptual distinction between justification and implementation. This demonstrates intellectual honesty.

  For delivery, I'll indicate which follow-ups press weaknesses (like the uptake question) versus prevent definitional retreats (like the punishment distinction question). This helps the user modulate their tone during the podcast.
answer: |-
  Here are ten tightly focused questions targeting the structural tensions in her framework, designed to force engagement beyond restatement. I've marked two where she likely has strong replies (#3 and #8). Follow-up types are indicated.

  **Core Question 1: The Costly Signal's Arbitrary Severity**
      *(a) Question:* "You argue sanctions are costly signals sustaining solidarity, not punishments tracking blame. But if the signal's cost must be credible *to contributors*, what principle prevents that cost escalating indefinitely—say, to destitution—if that's what convinces them? Doesn't the harshness objection return?"
      *(b) Likely Reply:* The cost level is set institutionally through democratic processes balancing expressiveness against claimant welfare; it's constrained by basic needs floors and other normative commitments, not solely signal credibility.
      *(c) Follow-up (Press Weakness):* "But if expressiveness *requires* the cost to land *because* it's a hardship credible to contributors, and contributors might *demand* high costs for credibility, doesn't your framework lack an *internal* normative brake against excessive harshness, making it hostage to contingent political demands?"
      *Follow-up Type:* **Press Weakness** (Highlights lack of principled limit within expressivism itself).

  **Core Question 2: Uptake & The Unavoidable Desert Judgment**
      *(a) Question:* "You bracket moral desert as an ex-post gloss, focusing on screening willingness. But contributors *receive* the sanction as a judgment of desert or blameworthiness. If the expressive message *to them* fundamentally relies on this uptake, doesn't the moral content you want to avoid become intrinsic to the signal's function?"
      *(b) Likely Reply:* The state's intent and the policy's *design justification* (screening/expressiveness) matter, not how some misinterpret it. We can educate contributors about the true rationale.
      *(c) Follow-up (Press Weakness):* "If the signal's effectiveness in sustaining solidarity *depends* on contributors interpreting it as marking desert (which your book notes they typically do), isn't that uptake *constitutive* of the expressivism working? Can you separate justification from the perception it necessarily relies upon?"
      *Follow-up Type:* **Press Weakness** (Targets the core coherence of separating intent from necessary uptake).

  **Core Question 3: Screening vs. Expressivism - Asymmetry with Tax Evasion** *(Marked: Strong Answer Expected)*
      *(a) Question:* "Tax evasion also signals unwillingness to contribute, undermining solidarity. Yet we don't use purely expressive sanctions for evasion—we use fines scaled to harm and intent. Why is the expressive logic uniquely applied to claimants, not contributors failing reciprocity?"
      *(b) Likely Reply:* Tax evasion involves breaking a clear, reciprocal *legal duty* owed by all. Conditionality screens for willingness to engage in the reciprocal *activity* (work/search) that grounds the claim to support *in the first place*; it's about establishing initial eligibility/participation, not punishing breach of a universal duty.
      *(c) Follow-up (Prevent Retreat):* "But doesn't this distinction risk making the expressive burden fall asymmetrically on the less powerful? Both are failures of reciprocity within the scheme. If expressiveness is vital for solidarity, why not signal equally strongly to *all* who weaken it?"
      *Follow-up Type:* **Prevent Definitional Retreat** (Ensures she engages the asymmetry, not just restates categories).

  **Core Question 4: Non-Marketable Capacity & Needs-Based Fallback**
      *(a) Question:* "For claimants demonstrably unable to offer market-valued contributions—say, severe permanent disability—what expressive message does a conditional scheme send about them? Doesn't justifying their support require a wholly separate, needs-based principle that bypasses conditionality entirely?"
      *(b) Likely Reply:* Such claimants fall outside the scope of the *contribution expectation* logic. Support for them is justified by basic needs/citizenship grounds, separate from conditionality, which applies only where capacity is reasonably presumed.
      *(c) Follow-up (Press Weakness):* "If conditionality only applies to the 'marginally capable,' and unconditional need covers the rest, doesn't that make conditionality's *justificatory role* purely residual? Is it doing any distinct normative work beyond taxing a small group to signal to others?"
      *Follow-up Type:* **Press Weakness** (Questions the necessity/weight of conditionality within her overall justification).

  **Core Question 5: Sanction-as-Signal vs. Punishment-in-Practice**
      *(a) Question:* "You distinguish sanctions (costly signals) from punishment (tracking blame). But if the state knowingly imposes serious, foreseeable hardship—like homelessness—on someone for non-compliance, how is that *experienced* difference morally significant? What work does the 'not punishment' label do if the harm is identical?"
      *(b) Likely Reply:* The distinction lies in *intent* and *justification*. Punishment seeks retribution or deterrence based on culpability. Sanctions withdraw conditional support based on failure to meet an eligibility requirement justified by screening/expressiveness; the harm is a side-effect, not the aim.
      *(c) Follow-up (Prevent Retreat):* "If the state *foresees* severe harm as a direct result of imposing the sanction, and imposes it anyway because the 'cost must land,' doesn't that intent to *use* the harm as the credible cost make the distinction functionally empty for the claimant's experience and rights?"
      *Follow-up Type:* **Prevent Definitional Retreat** (Forces engagement with the material reality vs. theoretical label).

  **Core Question 6: Can Screening Truly Escape the Desert Framework?**
      *(a) Question:* "You say 'deservingness' screens for willingness under imperfect info. But isn't the administrative *act* of applying a sanction—denying aid based on non-compliance—inherently a practical judgment of 'not deserving *right now*,' regardless of the official justification? Doesn't the screen *operate* as desert-in-practice?"
      *(b) Likely Reply:* The administrative act is a technical application of eligibility rules based on observable behavior (compliance/non-compliance), interpreted through the lens of screening willingness. The *moral* concept of desert isn't necessary for the administrator to apply the rule.
      *(c) Follow-up (Press Weakness):* "But doesn't the *stigmatizing effect* of sanctions on claimants, which your expressive logic might even *rely upon* for signal credibility, stem precisely from this practical judgment being *lived* as a judgment of desert, making the separation unsustainable socially and phenomenologically?"
      *Follow-up Type:* **Press Weakness** (Connects administrative action to lived experience and stigma).

  **Core Question 7: The Burden of Proof on Expressiveness**
      *(a) Question:* "You argue counterproductivity (e.g., sanctions causing harm that reduces employability) isn't decisive because expressiveness constrains design, not outcomes. But doesn't this shield the view from empirical refutation? What specific *empirical* evidence about solidarity or compliance would actually challenge the expressive necessity claim?"
      *(b) Likely Reply:* Evidence that *less* conditional, or unconditional, schemes generate *equal or greater* levels of taxpayer solidarity and compliance would challenge it. Or evidence that sanctions demonstrably *undermine* solidarity overall despite the signal.
      *(c) Follow-up (Press Weakness - Setup for Closer):* "Given real-world schemes *always* have some counterproductive effects, how do you isolate the 'pure' expressive effect? Doesn't this make the expressive necessity claim effectively non-falsifiable, relying on a counterfactual (solidarity would collapse without conditionality) that's hard to test?"
      *Follow-up Type:* **Press Weakness** (Highlights methodological/epistemic challenge).

  **Core Question 8: Screening Under Uncertainty** *(Marked: Strong Answer Expected)*
      *(a) Question:* "Aren't job search requirements actually quite poor screens for 'willingness to contribute'? They might signal compliance with bureaucracy, not genuine willingness, and punish those facing hidden barriers. Why is this imperfect tool central to your screening justification?"
      *(b) Likely Reply:* Under radical imperfect information, *some* observable proxy for effort/engagement is needed. While imperfect, requirements like job search are a practical, auditable indicator that, combined with support services, offers the best available signal absent mind-reading. The alternative (no screen) may be worse for solidarity.
      *(c) Follow-up (Prevent Retreat):* "But if the screen is so noisy, leading to sanctions on the 'willing but unlucky or administratively failed,' doesn't this high error rate undermine both the screening efficiency *and* the expressive message's fairness/credibility?"
      *Follow-up Type:* **Prevent Definitional Retreat** (Ensures she addresses practical imperfections, not just theory).

  **Core Question 9: Expressivism and Political Legitimacy**
      *(a) Question:* "If the expressive message's content and required cost level are set by democratic politics to satisfy contributors, doesn't this make the justification for harshness contingent on popular opinion, potentially sacrificing vulnerable claimants to sustain solidarity predicated on their hardship?"
      *(b) Likely Reply:* Democracy is the legitimate way to balance competing values (solidarity, autonomy, need). The expressive function operates *within* a framework of fundamental rights and constitutional constraints that protect against the tyranny of the majority.
      *(c) Follow-up (Press Weakness):* "But if the *core justification* for imposing hardship rests on satisfying the expressive demands of the contributing group to maintain *their* compliance, doesn't this risk legitimizing policies that cater to prejudice or indifference among taxpayers, rather than justice for claimants?"
      *Follow-up Type:* **Press Weakness** (Pushes on vulnerability to majoritarian pressure).

  **Closer Question 10: The Load-Bearing Empirical Claim (Self-Defeat Worry)**
      *(a) Question:* "You grant sanctions can be counterproductive but say that's not decisive for the justification. Which specific empirical claim *is* indispensable? If conclusive evidence showed strict conditionality *eroded* long-term solidarity or tax compliance, would that falsify your view?"
      *(b) Likely Reply:* Yes, that would be highly challenging. The indispensable empirical claim is that some form of credible conditionality is necessary (even if imperfect) to sustain the broad-based solidarity required for generous welfare states. If conditionality *systematically undermined* solidarity, the justification collapses.
      *(c) Follow-up (Press Weakness):* "Given existing evidence shows mixed or negative effects of sanctions on outcomes *and* some surveys suggest public support for welfare isn't tightly linked to conditionality stringency, doesn't this put a huge burden on a specific, contested empirical claim about solidarity's *causal* dependence on sanctions?"
      *Follow-up Type:* **Press Weakness** (Forces acknowledgment of empirical vulnerability).

  **Delivery Notes:**
  *   **Prevent Retreat Follow-ups (#3, #5, #8):** Use a calm, clarifying tone. Goal is to ensure she engages the *implication* or *application* of her point, not just repeats the definition. E.g., "So, if I follow, that means... [restate implication]? How does that address X?"
  *   **Press Weakness Follow-ups (#1, #2, #4, #6, #7, #9, #10):** Use a slightly more probing but still professional tone. Phrase as requests to resolve a tension: "I'm still struggling to see how X doesn't lead to Y..." or "Doesn't that suggest Z is a problem for the framework?"
  *   **Strong Answer Marks (#3, #8):** Acknowledge her reply positively before moving on ("That clarifies the distinction, thank you" or "The point about imperfect information under constraint is well taken"). This shows good faith.
  *   **Pacing:** Keep questions tight. If she gives a long reply, use the follow-up to steer back to the specific tension. Control the room firmly if pile-on attempts start ("Let's let Professor X finish that thought, then we have another angle on signalling...").

  This set forces her to defend the internal coherence and practical implications of her unique synthesis, avoids rehashing standard objections, and maintains intellectual rigor while incorporating moments of concession. Good luck!
