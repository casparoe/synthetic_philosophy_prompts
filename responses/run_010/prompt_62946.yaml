prompt: |-
  I work in insurance claims, and I keep needing a distinction I don't have a word for. Two adjusters look at the same storm. One is assigned a levee, doesn't reinforce it, and the town behind it floods. Another walks past an unassigned levee, doesn't reinforce it, and a different town floods. Physically these are the same sort of thing: something that could have been strengthened wasn't, and water got in. Yet we say the first adjuster caused the flood and the second merely failed to prevent one — and it isn't only his employer's assignment doing the work, since a bystander with no duties at all still doesn't strike us as a cause, even though counterfactually the damage would have been avoided had he acted. What seems to matter is whether there was a standing expectation that made the absence noticeable rather than just another thing that didn't happen.

  But it can't be only that. When the bystander is the one person positioned to act, knows it, and is quietly glad of the outcome, my intuitions start sliding toward calling him a cause after all, with no role or expectation in sight.

  I gather that causation by omission, and the worry that otherwise every absence becomes a cause, is a live topic in philosophy; I also gather that the same appeal to what is expected or normal gets used to explain which of many positive factors we single out as "the" cause of something. So: is there an established name or position for the view that whether an omission causes anything is settled by roles and expectations rather than by counterfactual dependence? How does it differ from the general business of picking salient causes out of many conditions, and where does my second case fall — a counterexample to that view, or something it has resources to absorb? And if there is no established term, what would you call it, and what would you take its boundary conditions to be?
reasoning: |-
  Okay, let me approach this step by step. The user works in insurance claims and is grappling with a nuanced distinction in causation related to omissions - specifically when an adjuster's failure to act constitutes "causing" harm versus merely "failing to prevent" it.

  The core dilemma presents two nearly identical scenarios where an unstrengthened levee leads to flooding, yet we assign causal responsibility differently based on role assignment. Then there's an edge case where a bystander with no duty but unique capability and malicious intent seems causally responsible. This challenges pure counterfactual theories of causation.

  The user seems to be seeking philosophical frameworks that can handle both the role-based distinction and the intentionality edge case. Their questions suggest they've already done some research on causation by omission but need help connecting it to practical insurance contexts.

  Key philosophical angles to consider:
  First, the normative role-based view (exemplified by Hart & Honoré) seems central - it explains why assigned adjusters "cause" while random passersby don't. The "standing expectation" the user mentions maps neatly to this. 

  But the bystander case with malice requires expansion. Here we might blend the normative view with Wright's NESS test - the bystander becomes a necessary element when capability and intent are present. Alternatively, we could incorporate Schaffer's "contrastive focus" theory where the salient question shifts from "why flood?" to "why this flood rather than no flood?" making the bystander's omission stand out.

  For insurance applications, I should emphasize how these theories handle:
  - Duty of care (core to adjuster liability)
  - Proximate cause determinations
  - Intentional harm exceptions
  - The "too many causes" problem

  The malice case might be addressed by distinguishing between causal responsibility (which the theories handle) and moral blameworthiness (which adds intent). Or perhaps by noting that exceptional knowledge/situational uniqueness creates de facto expectation.

  Terminology-wise, "normative salience theory" could work if coining a new term, though existing frameworks seem sufficient. The boundary conditions would involve when situational factors override institutional roles - a key concern for claims adjudication.
answer: |-
  This is a brilliantly articulated problem at the intersection of practical ethics, causation theory, and legal liability. You're right that it touches on deep philosophical debates about omissions and causal salience. Here's a breakdown of the established positions, terminology, and how they handle your cases:

  ### 1. **The Dominant Philosophical View: Normative Role-Based Omission**
     *   **Name:** **Normative Expectation Account** or **Duty-Relative Causation by Omission**. Key proponents: H.L.A. Hart & Tony Honoré ("Causation in the Law"), Roderick Chisholm, John Gardner.
     *   **Core Idea:** Whether an omission causes harm depends on **normative expectations** arising from roles, duties, contracts, or social conventions. A counterfactual dependence (the harm wouldn't have happened *but for* the omission) is necessary but **insufficient**. The omission must **breach a specific duty or norm** applicable to the agent in that situation.
     *   **Application to Your Cases:**
          *   **Assigned Adjuster:** Has a professional duty (contractual, role-based) to inspect and reinforce *that specific levee*. Failing to do so breaches that duty. This breach, coupled with the counterfactual dependence, makes the omission a **cause** of the flood.
          *   **Unassigned Adjuster / Bystander:** Has no *specific duty* toward *that specific unassigned levee*. While the flood counterfactually depended on their inaction, they breached no norm *applicable to them regarding that levee*. Their omission is a **failure to prevent** (a background condition) but not a **cause**.
     *   **Your "Standing Expectation" Insight:** This is precisely what this view captures. The "standing expectation" (the duty/norm) makes the *absence of action* salient and blameworthy in a way that transforms it from a mere background condition into a causal factor. The world is full of things we *could* do but aren't expected to; only the omission of *expected actions* typically rises to the level of causation.

  ### 2. **Counterfactual Dependence View & The Problem of "Too Many Causes"**
     *   **Name:** **Simple Counterfactual Theory** or **But-For Causation**.
     *   **Core Idea:** An omission causes an outcome if the outcome would not have occurred *but for* the omission. If the bystander *could* have reinforced the levee, and the flood *wouldn't* have happened if they had, then their omission caused the flood. Full stop.
     *   **Problem:** This leads to absurdity ("the problem of promiscuous causation"). The flood was also caused by:
          *   The President's omission to divert all national resources to levee reinforcement.
          *   Your omission to quit your job yesterday and fly there to help.
          *   My omission to invent a force-field years ago.
          *   The absence of a magical levee-fixing fairy.
     *   **Why it's rejected for omissions:** It makes causation ubiquitous and meaningless for assigning responsibility. We need a way to **select** which counterfactual dependences are causally/morally/legally relevant. The Normative Expectation Account provides this filter.

  ### 3. **Salient Cause Selection (for Positive Acts & Omissions)**
     *   **Connection:** The Normative Expectation Account for omissions is a specific application of a broader principle: we single out "the cause" from the myriad necessary conditions (the "causal field") based on **salience**. Salience is often determined by:
          *   **Abnormality:** What deviated from the expected/normal course of events? (The levee failing was abnormal; the bystander doing nothing wasn't).
          *   **Controllability/Intervention:** What factor could humans most easily have manipulated to change the outcome?
          *   **Moral/Legal Norms:** What duty was breached?
     *   **Difference:** For *positive acts*, we often look for the abnormal *intervention*. For *omissions*, we look for the abnormal *failure to act* **where action was normatively expected**. The underlying principle of selecting the salient, abnormal, norm-violating factor is the same.

  ### 4. **Your Second Case (The Malicious Bystander)**
     *   **The Challenge:** This seems to break the Normative Expectation Account. No role, no duty, no standing expectation... yet the omission feels causal due to unique capability and malicious intent.
     *   **How the Normative Expectation Account Can Absorb It (Solutions):**
          1.  **Exceptional Circumstances Create a Duty:** Some argue that unique capability *plus* awareness *plus* the gravity of the harm creates an *ad hoc* moral duty (a "duty of easy rescue"). By being the *only* one who could act and *knowing* it, a minimal expectation arises. Their omission becomes abnormal *in that specific situation*. Their malice reinforces the sense of responsibility, making the omission salient.
          2.  **Shifting the Salient Contrast:** Philosopher Jonathan Schaffer suggests causation is often **contrastive**. We ask "Why *this* flood rather than *no* flood?". The answer points to the assignee's omission at the assigned levee and the malicious bystander's omission at the unassigned levee. For the unassigned adjuster, the salient question might be "Why did *this* town flood rather than *that* town?", pointing to levee location/assignment, not their omission.
          3.  **Intentional Agency:** The malice introduces *intentionality*. While causation and intentionality are distinct, intentional omissions are more readily seen as *active* choices ("letting it happen" deliberately) rather than passive non-interventions. This makes them stand out from the background of "normal" inaction.
          4.  **NESS Test Refinement:** Some legal theorists (Wright) use the "Necessary Element of a Sufficient Set" (NESS) test. The malicious bystander's omission might be a necessary element of the *actual* set of conditions sufficient for the flood *in that specific context* (which includes their unique position/knowledge/malice), whereas the unassigned adjuster's omission isn't part of the salient sufficient set for their flood.
     *   **Conclusion:** The malicious bystander case isn't necessarily a fatal counterexample. The Normative Expectation Account can stretch to cover it by arguing the unique circumstance *creates* a situational expectation/duty or that the malice/intentionality makes the omission abnormal and salient in a way that transcends a lack of prior formal role. It highlights that "normative expectation" isn't always rigidly defined by job titles but can be contextually emergent.

  ### 5. **Established Term & Boundary Conditions**
     *   **Established Term:** The most precise established term is **"Duty-Relative Causation by Omission"** (often within the broader **"Normative Expectation Account of Causation"**). In legal contexts, it's tightly linked to the concept of **"Duty of Care"**.
     *   **Boundary Conditions (When does omission = cause?):**
          1.  **Counterfactual Dependence:** The harm must not have occurred if the action had been taken.
          2.  **Existence of a Duty/Norm:** There must be a recognized duty, role, contract, or strong contextual normative expectation *imposing an obligation to act* in that specific way regarding that specific risk.
          3.  **Breach:** The agent must have failed to fulfill that duty/norm (omitted the required action).
          4.  **Capability & Opportunity:** The agent must have been physically and cognitively capable of performing the action and had the opportunity to do so.
          5.  **Salience:** The omission must be a salient, abnormal factor in the causal chain relative to the normative baseline, not merely a background condition.
     *   **The Malicious Bystander as Boundary Case:** This tests condition #2. Does *unique capability + knowledge + gravity of harm* create a sufficient "normative expectation" or "duty" in the absence of a formal role? Different theorists draw the line differently here. Your intuition that malice pushes it over the edge suggests that *intentional exploitation of the situation* can sometimes *create* the salience/normative weight needed for causation, even without a pre-existing duty. This remains a debated edge case but shows the core framework's flexibility.

  **In summary:** The dominant philosophical/legal view is that omissions cause harm only when they breach a specific normative expectation/duty *and* satisfy counterfactual dependence ("Duty-Relative Causation by Omission"). This solves the "too many causes" problem by filtering for salience based on norms/expectations. Your "standing expectation" insight captures its essence perfectly. The malicious bystander case tests the boundaries of what constitutes a "duty/norm," but the framework has resources (situational duty, intentionality, contrastive salience) to potentially include it as causal, aligning with your sliding intuition. The key boundary is whether the context creates a sufficiently strong expectation of action *for that specific agent* regarding *that specific risk*.
