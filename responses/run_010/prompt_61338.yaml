answer: |-
  Let me translate Rousseau for you, argument by argument, in the cold, hard currency of links, turns, impacts, and kritiks, respecting the limits of your vocabulary and flagging where it bleeds. Forget the 18th-century frills; we're building a case flow.

  Rousseau's core claim – that theater can't reform morals, only intensify existing ones – is your foundational **solvency turn**. The school board's plan claims solvency on character education (the impact being better citizens, reduced bullying, whatever they posit). Rousseau provides the link: theater reflects and amplifies the prevailing social ethos, good *or* bad. If the community already values superficial charm over integrity (a likely internal link you'd need to prove about your school's culture), the plays selected will reinforce that. Instead of solving for "bad character," it solves for *more* of whatever character dominates. The impact is the plan's failure to achieve its advertised benefit (character reform) and potentially worsening the status quo ("intensification"). This is highly runnable. A judge doesn't need to buy Rousseau's whole philosophy to understand the empirical claim that art reinforces norms; you just need decent evidence about cultural influence and your local context. Don't call it "intensification"; call it "reinforcement of harmful social norms."

  His take on tragic pity? That's a **framework turn** targeting the empathy impact. The school board likely claims attending performances fosters empathy (tragedy) or critical perspective (comedy). Rousseau's link is that tragic pity is a self-indulgent emotion. Spectators feel generous *for feeling*, not for *acting*. The internal link is emotional catharsis replacing actual moral responsibility. The impact is complacency: students feel they've "done their part" emotionally, undermining motivation for real-world ethical action the character education aims to promote. It turns the plan's purported empathy advantage into a disadvantage by reducing civic engagement or charitable impulse. This is conceptual but runnable as a turn. It might feel slippery to a judge demanding hard impacts, so pair it with evidence about the "slacktivism" effect or studies on empathy fatigue if possible. The risk is the judge sees it as just philosophical musing without concrete harm.

  The *Misanthrope* critique is pure **link + impact** against the character ed solvency. Link: Comedic performances (or any satirical ones likely chosen) often reward social adaptability (phoniness, flattery) and ridicule principled dissent (honesty as Alceste's rudeness). Internal link: Students absorb the lesson that fitting in and being agreeable is valued over uncomfortable truths or integrity. Impact: Directly undermines the plan's solvency for building "good character" (defined as honesty, courage, principle) by instead teaching conformity and social maneuvering. This is one of the strongest, most concrete arguments. Molière is just an example; the link is that *much popular theater/comedy* operates this way. Run it hard. The judge only needs to accept that media messages influence behavior, a common debate assumption.

  The objection to acting as "selling one's person"? This fits best as a **kritik** of commodification. The K: The institution of professional theater commodifies human relationships and identity. Actors sell their emotional expression and persona for profit (link 1). The plan forces students to engage with and valorize this commodified spectacle as "education" (link 2). The internal link is the normalization of viewing human interaction as a performance for consumption and profit. Impact: Degrades authentic human connection, reduces empathy to a consumable product, undermines the possibility of genuine character formation which requires unmediated interaction. This is high-risk. It's deeply philosophical. A PF judge unfamiliar with kritiks might dismiss it as irrelevant abstraction or fail to see the tangible impact ("So what if it's commodified? Does it *actually* hurt anyone?"). Only run if you know the judge or have a very concrete impact story (e.g., links to alienation, depression, transactional relationships).

  The worry about spectacle corrupting small communities? This is primarily an **impact turn** with a **framework** element. Link: Mandating attendance at passive spectacles replaces time spent in productive labor, communal self-surveillance (mutual accountability), and active civic participation. Internal Link: This fosters idleness, shifts focus from shared work to individual entertainment consumption, and erodes the bonds of mutual reliance and observation crucial for small-community virtue. Impact: Decline in civic engagement, loss of productivity, weakening of social cohesion, potentially increased petty vice due to reduced informal policing. The framework element is that the plan assumes character is built through passive consumption, whereas Rousseau argues it's built through active participation and shared labor. This is runnable as an impact turn (plan causes civic decay) and can support a framework argument about active vs. passive character formation. The "mutual surveillance" bit might be hard to sell positively, so focus on "mutual accountability" and "community cohesion."

  His alternative of public festivals? This is a **solvency advocate / counterplan** (though PF rules vary on CPs) or more precisely, a **solvency turn** against the *necessity* of the *theatrical* method. It argues the plan's method (passive spectacle) is inferior/irrelevant/harmful compared to the alternative method (active, participatory public gatherings) for achieving the claimed solvency (character building, civic spirit). Impact is the opportunity cost: adopting the theatrical plan wastes resources and forecloses the superior alternative, failing to solve optimally or even worsening the problem by entrenching the wrong model. This is runnable as a solvency argument: "There's a better way to achieve character ed, so this plan is unnecessary/inefficient." The judge doesn't need to love Rousseau; they just need to think participation *might* be better than spectatorship for building community/character.

  **Residue Report:**

  The core residue stems from Rousseau's fundamental project: evaluating institutions based on the *kind of persons* they form, not just the *measurable outcomes* they produce. Impact calculus demands quantifiable harms or benefits ("increased civic engagement," "decline in test scores," "more bullying"). Rousseau's deepest worry is about the *character* formed – a person who confuses feeling for acting (pity), values charm over honesty (Molière), sees human interaction as performance (acting critique), and prefers passive consumption to active citizenship (spectacle vs. festival). These are qualitative shifts in human disposition.

  *   **What Doesn't Fit:** The claim that forming a *certain type of self* (e.g., one pleased with its own sensitivity, or comfortable with commodified relations) is an intrinsic bad, *regardless* of whether it demonstrably leads to worse measurable outcomes *in this specific instance*. Impact calculus requires that "bad character" link to a tangible impact (e.g., "leads to less volunteering" or "increases corruption"). Rousseau thinks the corrupted character *is* the impact, the degradation itself. Your vocabulary struggles to represent an impact that *is* the formation of a morally or existentially diminished subject, if you can't immediately chain it to a policy-relevant consequence the judge already accepts as bad (like economic decline or civic disengagement).
  *   **Why It Doesn't Fit:** Primarily because impact calculus is inherently consequentialist. It demands that value claims be translated into downstream effects. Rousseau's critique is often teleological and virtue-based; he judges the theater based on the *telos* (end/purpose) of human flourishing and the virtues required for it in a specific (republican) community. "Selling one's person" is bad *because* it degrades human dignity inherent in the act, not (only) because it leads to quantifiable social harm. The vocabulary flattens this intrinsic concern into an extrinsic consequence.
  *   **Vagueness?** Not really. The claims are specific *phenomenologically* (describing experiences like tragic pity) and *socially* (describing dynamics like the effect of spectacle on community labor). The vagueness appears only when forced into the link-chain structure *demanding* a measurable, policy-impact endpoint Rousseau didn't prioritize. The link chain forces a consequentialist reading he often resisted.
  *   **The Kritik's Role:** The kritik *absorbs* some of this residue by shifting the debate to the level of underlying assumptions (e.g., commodification K). It allows you to argue that the *framework* of valuing consequences above all else, or of accepting commodification, *is itself harmful*. But even the kritik often smuggles in consequences – the impact of commodification is still argued as "degraded relationships" or "alienation," tangible harms. It doesn't perfectly capture the idea that commodification is *intrinsically* wrong because it violates human dignity, full stop. The kritik relocates and partially absorbs the residue by making the *conceptual framework* the impact, but it still relies on convincing the judge that framework *has* bad consequences or is otherwise untenable. It doesn't fully escape consequentialism; it merely attacks a different level of the opponent's *consequentialist justification*.

  **Bottom Line for the Floor:**

  Prioritize the **Solvency Turn** (intensification/reinforcement) and the **Link+Impact** from the Molière critique (rewards conformity, punishes honesty). These are clearest and most persuasive within PF norms. The **Framework Turn** on pity (empathy->complacency) and the **Impact Turn** on community decay (idleness, lost cohesion) are strong secondary options if well-evidenced locally. The **Kritik** (commodification) is high-risk, high-reward; only run with a very concrete impact story and a receptive judge. The **Solvency Turn** using public festivals is useful to undermine the plan's necessity. The residue – the deepest worry about the *intrinsic* degradation of character – is the philosophical bedrock, but in the PF round, it largely fuels the arguments above; trying to run it *as* the impact itself, separate from tangible harms, is likely a path to losing the ballot. Focus on how forming that "Rousseauean bad character" *leads to* civic disengagement, social hypocrisy, or failure of the plan's own goals. Good luck.
