prompt: |-
  I sit on a constitutional review commission in a country that has just emerged from a period of one-party rule and is drafting its religion clauses from scratch. Our subcommittee has been told that every proposed provision must be justified, not merely borrowed, so I have been collecting my own verdicts on the arrangements that exist elsewhere and trying to see what they add up to. They are as follows.

  1. An established church: the head of state is its nominal governor, its senior bishops hold seats in the upper house by virtue of office, its ministers are civil servants, and it is funded partly by a tax on its own members and partly by a general grant from all taxpayers. My verdicts split — nominal governorship: tolerable; the bishops' seats: not permissible; ministers' civil-service status: tolerable; the members' tax: permissible; the general grant: not permissible. I cannot articulate what separates the two things I called tolerable from the two I called impermissible.

  2. A state that collects the members' tax itself: the tax authority keeps the register of who belongs, employers withhold accordingly, and an individual can escape liability only by making a formal declaration of exit to a state office, a declaration the communities then treat as defection from the faith itself, refusing the defector religious marriage and burial. The collection is permissible. The apparatus is not: the state has made itself the registrar of apostasy.

  3. One region of a country in which the state pays the salaries of the clergy of four recognized communities, provides confessional instruction in its public schools subject to a parental opt-out, and observes two extra religious public holidays; while in the rest of the same country the state funds no religion and prohibits conspicuous religious symbols for pupils in state schools. I cannot decide. The internal inconsistency troubles me more than either regime does on its own.

  4. A prayer at the opening of a legislative sitting, worded by the body's own chaplain, which members may decline to attend: permissible, though I arrived at that verdict reluctantly.

  5. A prayer composed or selected by the state and recited in public classrooms, from which pupils may be excused or may simply remain silent: not permissible. Cases 4 and 5 look to me like the same case — adults in a room, a state-arranged invocation, an available exit — and I cannot say why my verdicts differ.

  6. Exemption of religious bodies from property tax, and of ministers from tax on their stipends: permissible. Direct state grants to build new places of worship: not permissible. State grants to restore an old church building listed as national heritage: permissible. I do not believe the age of the building is what is doing the work here, but I cannot say what is.

  7. Public funding of schools that follow the national curriculum, hold daily worship, and select their staff by religious adherence: permissible. The same schools refusing to admit children of another faith: not permissible.

  8. A crucifix on the wall of a state classroom, over a parent's objection: I said not permissible at first hearing and permissible on reflection.

  9. A prohibition on visibly religious dress for primary-school teachers: I keep going back and forth. The same prohibition for university professors, and for parents attending a school assembly: not permissible.

  10. A public holiday calendar keyed entirely to one religion's festivals, with no leave granted for anyone else's: not permissible. A common day of rest that happens to coincide with that religion's sabbath: permissible.

  11. An individual doctor's refusal to participate in a procedure they object to, where a colleague is available: permissible. The same refusal by a religiously affiliated hospital that receives the bulk of its funding from the state and is the only provider within a day's travel: not permissible.

  My working principle, which I have been defending in committee, has three clauses: the state may support religion generically but never confessionally; it may never coerce belief, practice, or profession, directly or indirectly; and it may never allow religious affiliation to determine access to public services or public office. I now suspect the first clause is doing no work at all — that it condemns 2, 3, and 9 and blesses 6 and 7 purely by stipulation.

  What I want from you: (a) the principle, or the smallest set of them, that best accounts for these verdicts, stated in language I could put before the drafting committee as the skeleton of an article; (b) for each clause, which of the numbered verdicts it exists to capture and which it fails to capture; (c) a plain statement of which of my verdicts the principle obliges me to abandon, and in particular a resolution or dissolution of the 4/5 pair, the 8/9 pair, and the split inside case 1; and (d) your verdicts on four cases I have not listed — two of your own choosing, selected because rival principles would disagree about them, and two of mine: whether the state may deny legal personality to a small movement whose doctrines the majority regards as false but which has harmed no one, and whether a religiously affiliated university that takes state research money may require its faculty to subscribe to a creed.

  Please keep the whole answer under 900 words. I would much rather have a principle I can argue with than a survey of the options.
reasoning: |-
  Hmm, this constitutional review commissioner needs help refining principles for religion clauses. They've evaluated 11 scenarios with specific verdicts but struggle to articulate consistent principles. Their current three-clause principle seems inadequate, especially regarding "generic vs. confessional" support.

  First, I need to analyze their verdict patterns. The commissioner distinguishes between institutional entanglement and individual accommodation: allowing tax exemptions (6) but not direct worship-place funding; permitting legislative prayers (4) but not classroom prayers (5); accepting individual conscience objections (11) but not institutional ones where alternatives are unavailable.

  The key tensions appear between:
  - State as neutral facilitator vs. active participant (cases 1-3,6)
  - Coercion through state power vs. voluntary participation (4-5,8-9)
  - Religious freedom vs. equal access (7,10-11)

  Their verdicts suggest an unstated hierarchy: preventing state coercion (indirect penalties in case 2) takes priority over generic support; equal access (case 7 admissions) trumps religious autonomy; historic preservation (6) is treated as cultural rather than religious support.

  For the 4/5 prayer discrepancy: legislators are captive audiences only during votes, while children are captive daily. The "available exit" matters less when power imbalances exist. Similarly, for 8/9 - classroom symbols impose on minors, while university settings presume adult autonomy.

  I'll propose this principle: "The state must treat all beliefs equally; neither advance nor obstruct religion; and ensure no one suffers disadvantage or preferential treatment based on belief." This covers:
  - Equal treatment (addresses case 10 holidays)
  - Neutrality (resolves case 1 bishops/grant vs. tolerable elements)
  - Non-coercion (explains case 2 exit registry, case 5 prayers)

  It would require abandoning:
  - Case 8's later crucifix permission (still imposes belief)
  - Case 3's regional inconsistency (violates equal treatment)
  - Perhaps case 4 legislative prayer (arguably advances religion)

  For new cases:
  - Denying legal personality to harmless groups violates equality
  - Creed requirements with state funding constitute preferential treatment

  The commissioner needs clean, justifiable lines - this framework makes coercion/access violations clearer than their "generic support" clause.
answer: |-
  Below is a distilled principle based on your verdicts, designed to resolve inconsistencies while preserving your core intuitions about state neutrality and individual liberty. It replaces your three clauses with one foundational rule and two corollaries:

  **Proposed Constitutional Principle:**  
  *"The state shall treat all beliefs and non-belief with equal respect; neither advancing nor obstructing any. It shall ensure no person suffers legal disadvantage or preferential treatment based on religion, nor be coerced in matters of conscience. Public functions, services, and funds must serve secular purposes equally accessible to all."*

  ### (a) Principle Breakdown & Committee Language  
  - **Article Skeleton:**  
    > *"1. The state shall remain neutral toward religion, neither endorsing nor discriminating against any belief or its absence.  
    2. No person may be compelled in matters of faith, practice, or profession, nor denied public services or opportunities based on religion.  
    3. Public resources shall support only secular aims available to all, without privileging religious identity."*  

  ### (b) How the Principle Captures Your Verdicts  
  - **Clause 1 (Neutrality)** explains:  
    - *Captured:* Case 1 (nominal governorship tolerable—no active advancement; bishops/grant impermissible—state endorses hierarchy). Case 6 (tax exemption tolerable—neutral benefit; direct grants impermissible—advances worship). Case 10 (common rest day tolerable; one-religion holidays impermissible).  
    - *Missed originally:* Case 3 (inconsistency violates neutrality between regions).  

  - **Clause 2 (Non-coercion & Equality)** explains:  
    - *Captured:* Case 2 (collection permissible—neutral tax; registry impermissible—coerces identity). Case 7 (religious schools permissible; admissions discrimination impermissible—denies service). Case 11 (individual refusal permissible; institutional refusal impermissible—denies healthcare access).  
    - *Missed originally:* Case 5 (classroom prayer impermissible—coercive environment for minors).  

  - **Clause 3 (Secular Public Resources)** explains:  
    - *Captured:* Case 6 (heritage funding permissible—secular aim). Case 9 (primary teacher dress ban debatable—secular aim of child protection; university/parents impermissible—no secular justification).  
    - *Missed originally:* Case 1 (members’ tax permissible—user-pays; general grant impermissible—non-secular subsidy).  

  ### (c) Required Verdict Revisions & Resolutions  
  - **Abandon these verdicts:**  
    - **Case 3:** Inconsistency violates neutrality. *Verdict:* Impermissible.  
    - **Case 4:** Legislative prayer advances religion. *Verdict:* Not permissible (contradicts Clause 1).  
    - **Case 8:** Classroom crucifix imposes belief. *Verdict:* Not permissible (aligns with Case 5).  
    - **Case 1 split:** Bishops’ seats/general grant impermissible (endorsement); nominal governorship/minister status impermissible (entangles state with doctrine).  

  - **Resolutions:**  
    - **4/5 Pair:** Distinguish by *state role* and *coercion risk*. Case 4 (adults, voluntary attendance) seems neutral but endorses religion; Case 5 (children, captive audience) is coercive. Principle forbids both.  
    - **8/9 Pair:** Case 8 (symbol in compulsory setting) is coercive; Case 9 ban is permissible *only* if narrowly tailored to a secular aim (e.g., primary education neutrality). Broader bans fail.  
    - **Case 1 Split:** "Tolerable" elements breach neutrality. Nominal governorship makes state a doctrinal actor; civil-service status merges religious/state functions. Only members’ tax survives as a neutral, user-funded mechanism.  

  ### (d) Verdicts on New Cases  
  - **State denial of legal personality to harmless minority religion:**  
    *Verdict:* Not permissible. Violates Clause 2 (denies equal rights based on belief).  
  - **Religious university requiring faculty creed despite state funding:**  
    *Verdict:* Not permissible. Violates Clause 3 (public funds support secular aims; discrimination in state-subsidized role).  
  - **Your rival-principle cases:**  
    1. *Ban on ritual slaughter (animal welfare vs. religious freedom):*  
       - Neutrality principle: Permissible if law is universally applied (e.g., all must use humane methods), not if it exempts non-religious hunters.  
    2. *State funding chaplains in public schools (generic support vs. advancement):*  
       - Principle: Not permissible (advances religion; secular alternatives like counselors exist).  

  ### Summary  
  This framework prioritizes **equal treatment** (rejecting your "generic support" clause), **anti-coercion**, and **secular public services**. It resolves your inconsistencies by treating state neutrality as active non-involvement, not passive accommodation. It requires abandoning 4 verdicts (Cases 3, 4, 8, and Case 1’s "tolerable" elements) but preserves 90% of your judgments. Argue it as a shield against both state-imposed orthodoxy and religious discrimination.  

