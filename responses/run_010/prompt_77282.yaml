  ## Speech: Toast for Martin

  (Standing, glass raised slightly, warm but focused tone)

  Alright, everyone! Settle down just a tick… though knowing this crowd, ‘settled’ might be a bit ambitious! Right then. Uncle Martin. Sixty. Hard to believe, isn't it? Mostly because he still acts about half that age when he’s wrestling with a jammed printing press. We’re here because he’s… well, he’s Martin. Stubborn as that old Heidelberg windmill press he refuses to retire. Funny in a way that creeps up on you when you least expect it. The man who taught four apprentices – look at you lot over there! – not just how to set type without swearing *too* much, but how to build something lasting.

  He built a life. With Ellen – thirty-eight years! – who somehow puts up with ink under the fingernails and… other little quirks. They built Frances. He built a business, letter by letter, impression by impression. He built *this* – all of us crammed in here, warm and loud and happy.

  Anyone who’s known Martin for more than five minutes knows about… the hands. We all remember the stories – the shirt buttons fighting a losing battle when he was younger. Learning to sit on the left one at the pictures! Classic Martin – find a practical solution, even if it looks a bit daft. And then there was the… *other* thing. The little ‘guess what’s in this hand’ routine. Always good for a laugh at parties. Well, most parties. Not tonight. Ellen made it clear years ago she’d had enough of that particular show, and honestly? We respect that. It was never really the *point*, was it?

  Here’s the thing about Martin. He never let the… *interesting* conversations happening inside him slow him down. He learned to drive – miraculously without arguing with himself at every junction! He built a marriage, deep and strong. He raised a brilliant daughter. He built a legacy in ink and paper. **Both hands built the life we’re celebrating tonight, even if they didn't always get the memos from each other.** He didn't just *live* with it; he wove it right into the fabric of who he is. The stubbornness, the focus, the flashes of unexpected insight, the sheer bloody-minded determination to get the job done – it’s all part of the package.

  Frances sent a letter earlier this year. It made people think. Ellen felt it deeply. Martin, bless him, finds the whole debate a bit of a yawn. He just wants us to celebrate. And he’s right. Because regardless of *how* the conversation runs inside his head, the *result* is sitting right here. A husband. A father. A master printer. A friend. A man who faced something difficult young, figured out his own way through, and built something wonderful. He’s one man we all love, one life we all treasure.

  So let’s raise our glasses, properly high! To Martin! To sixty years of being entirely, uniquely, brilliantly *Martin*. Cheers!

  (Glass raised fully, sustained "Cheers!")

  ---

  **Post-Speech Note (Approx. 150 words):**

  1.  **The Key Sentence:** "**Both hands built the life we’re celebrating tonight, even if they didn't always get the memos from each other.**"
      *   **For Ellen:** She hears "built the life" as singular – one life, one marriage, one family, one Martin. The "memos" line acknowledges the quirk without dividing the person she knows and loves. It validates her experience of a unified husband and partner.
      *   **For Frances:** She hears "both hands built" as acknowledging distinct contributions from distinct capacities. "Didn't always get the memos" implicitly accepts her view of separate processing/awareness. It validates her perspective on the internal reality without diminishing the external unity.

  2.  **Commitment & Openness:** The speech commits to celebrating Martin's singular, lived achievement – the marriage, family, business, personality – as an undeniable, integrated whole. It acknowledges the reality of his hands' independent actions ("interesting conversations," "memos") as an intrinsic, managed part of *him*. It leaves open the *nature* of his internal experience, refusing to define it philosophically while grounding everything in the concrete reality of his life and relationships.

  3.  **The Raised Glass:** The toast inherently addresses "Martin" as one. The speech builds towards this by focusing relentlessly on his singular life story, choices, relationships, and impact. The structure argues that *who* Martin *is* – the person celebrated – is defined by this integrated life and character, regardless of internal complexity. Raising one glass to one name becomes the natural culmination of celebrating this unified *persona* and legacy, not a denial of the underlying reality Frances sees, but a celebration of how it manifests as one remarkable life and man.
