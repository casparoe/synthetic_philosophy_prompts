prompt: |-
  I chair the selection committee for a residential leadership fellowship at a public university: forty places a year, roughly nine hundred applicants, a majority of them first-generation students. For the past decade our process has ended with a forty-five-minute structured interview scored against a rubric covering integrity, resilience, empathy, and initiative. Two submissions have landed on my desk this cycle, and the committee must choose between them on Thursday.

  Our philosophy colleague argues the interview should be abolished outright. His case has three strands: that the situationist literature in personality psychology — the classic obedience studies, the mock-prison study, and experience-sampling work showing that the same person behaves very differently from one situation to the next — undercuts the assumption that there is a stable, cross-situationally consistent character for us to detect; that what our rubric in fact scores is verbal polish and interview training, which correlates strongly with family income in our own applicant data; and that the mock-prison study in particular has come under severe methodological and archival attack in recent years, which he concedes cuts both ways, since the critique of character partly leans on it.

  The fellowship office proposes a replacement rather than a deletion: a paid half-day in which shortlisted candidates work through staged group tasks with embedded dilemmas while trained observers score them, on the theory that character is visible in behaviour under pressure rather than in self-description. They contend that personnel-selection research reports modest but non-zero validity for integrity testing, and that a structured observational exercise should do at least as well.

  The three courses of action before us are: (i) retain the interview unchanged; (ii) remove character assessment from selection entirely and allocate places on academic record plus a written statement of purpose; (iii) adopt the half-day situational assessment.

  Please draft the committee's decision memo. I want a recommendation with defended reasons, not a survey of the debate. Four things it must do:

  First, take a position on the philosophical question underneath the dispute. Does the situationist critique entail that character cannot be assessed, or does it imply that character can only be assessed in a specific way — across many varied situations and over time, rather than in a single encounter? If the latter, does that rescue or condemn option (iii)? A half-day of staged tasks is itself one situation, and I need to know whether you think that is a fatal objection or a manageable one, and why.

  Second, distinguish the selection function from the developmental function. Our charter commits us to cultivating these qualities during the fellowship, not merely detecting them beforehand. I suspect the argument that defeats assessing character at admission does not defeat cultivating it afterwards; tell me whether you agree, and what follows for the recommendation.

  Third, name and defend the standard you are applying. Predictive validity is the obvious candidate, but this fellowship partly confers an opportunity rather than fills a role, so tell me whether validity is the right criterion, or fairness, or something else — and be explicit about how you are trading them off.

  Fourth, set out the strongest case for the option you reject in terms its own defenders would recognise, and state what evidence or argument would move you.

  Practical constraints: twelve readers, four with no background in psychology; about a page and a half; a clear recommendation stated in the opening paragraph. If you think we should gather data over the coming cycle before deciding permanently, specify precisely what we would measure, on whom, and which result would settle the question. No bibliography, footnotes, or named citations — argue from the concepts and from the case as I have described it.
reasoning: |-
  Hmm, the user chairs a selection committee for a leadership fellowship at a public university and needs to draft a decision memo about changing their selection process. They've received two proposals: one to abolish character assessment entirely, and another to replace interviews with a half-day situational assessment. The memo needs to address four specific requirements regarding the philosophy of character assessment, the distinction between selection and development, the evaluation standard, and a fair presentation of the rejected option.

  I need to understand the core issues here. The philosophy colleague argues against character assessment based on situationist psychology, claiming that character isn't stable across situations and that interviews mainly measure socioeconomic advantages. The fellowship office proposes situational testing as an alternative. The user wants me to resolve whether situationism makes character assessment impossible or just requires different methods.

  For the philosophical question, I think situationism doesn't eliminate character assessment but demands methods that sample behavior across contexts. A single half-day assessment might be insufficient, but it's better than interviews which are vulnerable to coaching. The key is that it observes actual behavior under pressure rather than self-reported narratives.

  Regarding selection versus development, the committee's charter includes cultivating character during the fellowship. Even if selection methods are imperfect, abandoning character assessment entirely would contradict the program's mission. The developmental aspect remains valid regardless of selection challenges.

  For the evaluation standard, predictive validity is complicated for an opportunity-conferring fellowship. Fairness and developmental potential matter more here. The current interview disadvantages first-gen students, so equity concerns are paramount. The situational test appears fairer while still targeting relevant behaviors.

  The strongest case for academic-only selection (option ii) is its simplicity and avoidance of biased character judgments. But this would undermine the program's leadership development purpose. Evidence that would change my mind would be data showing character assessments don't predict fellowship outcomes or disproportionately reject first-gen students.

  Practical considerations: The situational test should be piloted with clear metrics - participation rates by income group, correlation with first-year outcomes, and observer consistency. If it shows adverse impact or no predictive value, reverting to academic criteria might be necessary. But the benefits of observing behavior warrant testing this approach.

  I should recommend adopting the half-day assessment while committing to rigorous evaluation. This balances philosophical insights with practical improvement, addresses fairness concerns, and aligns with the program's developmental goals. The memo should clearly state this upfront and systematically address each requirement.
answer: |-
  **MEMORANDUM**  
  To: Selection Committee Members  
  From: Chair, Fellowship Selection Committee  
  Date: 20 October 2023  
  Subject: Recommendation on Character Assessment Method for Fellowship Selection  

  **Recommendation**: The committee should adopt option (iii), replacing the structured interview with the proposed half-day situational assessment for the coming cycle, while implementing rigorous evaluation criteria to determine its long-term viability. This approach best reconciles the philosophical critique of character assessment with our program’s developmental mission, prioritizes fairness, and offers a path toward evidence-based improvement.  

  ---

  ### I. Philosophical Position on Character Assessment  
  The situationist critique does not render character assessment impossible; it necessitates assessment *across multiple, varied contexts* rather than in a single encounter. While the half-day assessment is still a limited sample of behavior, it represents a significant improvement over the interview for three reasons:  
  - **Behavioral Focus**: It directly observes actions in response to dilemmas (e.g., navigating group conflicts or ethical trade-offs), reducing reliance on self-reported narratives vulnerable to coaching.  
  - **Contextual Variety**: Staged tasks can simulate diverse pressures (time constraints, competing priorities) within the half-day, providing more cross-situational data than a static interview.  
  - **Mitigated Bias**: By prioritizing concrete behaviors over verbal eloquence, it lessens socioeconomic advantages inherent in interview performance.  
  The single-situation limitation is *manageable*, not fatal, provided the assessment is designed to elicit multiple facets of character (integrity, empathy) through distinct, high-pressure scenarios.  

  ### II. Selection vs. Developmental Function  
  We agree that abandoning character assessment at selection does *not* negate our mandate to cultivate these qualities during the fellowship. However, **selection and development are interdependent**:  
  - **Selection**: Identifying candidates with baseline receptiveness to development (e.g., responding constructively to feedback during group tasks) aligns with our mission. Removing character assessment (option ii) would ignore qualities central to the fellowship’s purpose.  
  - **Development**: The situational assessment’s design (e.g., dilemmas requiring empathy) can directly inform personalized development plans for fellows. Conversely, an academic-only approach (option ii) would leave us blind to growth areas.  
  Retaining the interview (option i) fails on both fronts: it neither predicts developmental potential reliably nor equitably.  

  ### III. Evaluation Standard: Fairness and Developmental Potential  
  **Predictive validity is secondary for an opportunity-conferring fellowship**. Our primary standard must be **procedural fairness** (equitable access) and **developmental alignment** (selecting candidates likely to benefit from/grow through the program).  
  - **Fairness**: The interview disproportionately advantages high-income applicants via "verbal polish." The situational assessment, by scoring observable behaviors (e.g., "shared resources during scarcity task"), minimizes this bias.  
  - **Developmental Potential**: Character qualities like resilience are best assessed through response to adversity. The group tasks simulate fellowship pressures more authentically than an interview.  
  We trade off modest validity gains for significant fairness improvements, as equity is paramount for a public university serving first-gen students.  

  ### IV. Strongest Case for Academic-Only Selection (Option ii)  
  Defenders of option (ii) rightly argue:  
  > *"Academic records and statements of purpose are less susceptible to situational noise or socioeconomic bias. They transparently reward merit earned through coursework and reflection, avoiding speculative character judgments debunked by psychology."*  
  **Evidence that would move us**: Data showing character assessments (interview or situational) consistently reject qualified first-gen applicants without improving fellowship outcomes (e.g., leadership milestones post-graduation). If pilot data from option (iii) reveals adverse impact or null predictive value, we would revert to academic criteria.  

  ---

  **Implementation & Evaluation**:  
  We will pilot the half-day assessment *this cycle* with three metrics:  
  1. **Fairness**: Compare participation rates/outcomes of first-gen vs. non-first-gen applicants.  
  2. **Predictive Utility**: Track correlations between task scores and first-year fellowship performance (mentor evaluations, peer feedback).  
  3. **Observer Reliability**: Measure scoring consistency across trained raters.  
  **Settling the question**: If the pilot shows no adverse impact (metric 1) and non-zero correlation with developmental growth (metric 2), we adopt permanently. If not, we shift to option (ii).  

  This path advances equity, tests the philosophical critique pragmatically, and honors our commitment to cultivating leadership in all selected fellows.  

  **VOTE**: Adopt option (iii) for 2024 cycle with evaluation protocol.
