  Key elements to include:
  - Fictional review board (e.g., coverage-and-formulary panel) making funding decisions.
  - Sub-panels of 4-5 people.
  - (a) Panels must commit to a reference class (population) before seeing statistics for a condition.
  - (b) Fixed pot of coverage units (e.g., 100 units) so that approving one condition costs the ability to approve another; public tally on whiteboard.
  - (c) Rules-of-order role per panel (rotating) to strike evaluative language and demand physiological basis.
  - (d) At least two cards with same trait but different environments, and one card where verdict flips on population partition.
  - (e) Historically awkward cases: pregnancy, male-pattern baldness, protective/costly trait (e.g., sickle cell trait), intense prolonged grief, dropped diagnosis (e.g., homosexuality as mental disorder).

  Also, consider private stakes (e.g., relative with condition, protect budget) but avoid cynicism.

  Let's sketch candidate mechanics:

  Candidate 1: "Blind Data Reveal"
  - Mechanics: Panels are given condition cards without data. They first choose a reference class (e.g., "all adults", "adults in industrialized nations", "adults with similar occupation") for each condition. Then data (prevalence, typical function level in chosen class, etc.) is revealed. They must decide based only on the data and the rule of order. The same condition might be presented in different environments (e.g., "night shift worker" vs. "day shift worker") to different panels.
  - Feel: Participants feel the tension of committing to a reference class without knowing the data, and then the surprise when the data they get (based on their choice) leads to a conclusion that might be different from another panel. They also feel the pressure of the fixed budget when tallying.

  Candidate 2: "Environmental Switch"
  - Mechanics: Each panel gets a set of condition cards. For each condition, they see two scenarios: one environment where the trait is problematic and another where it isn't. They must argue based on biology alone (with rule of order) whether it's a disease. Then, in a second phase, they are given population statistics for two different reference classes (without knowing which one they initially chose) and see how the numbers change the picture.
  - Feel: Participants directly experience how the same biological trait can flip from disease to non-disease based on environment. They also feel the arbitrariness of choosing a reference population when the statistics change.

  Candidate 3: "Budgetary Triage"
