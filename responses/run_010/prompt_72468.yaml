  Predictable problems and solutions:

  1. Rules-of-order role collapsing into a semantic word game.
     - Solution: Emphasize in the instruction that the goal is to focus on the physiological mechanism. Provide examples: instead of "this causes suffering", say "this involves dysregulation of the HPA axis". The facilitator can model in the intro.

  2. One confident pre-med student steamrolling.
     - Solution: Assign roles (Rules Enforcer rotates) and use structured turn-taking if necessary. In the debrief, ask the quiet members what they thought.

  3. Reverse-engineering the intended lesson from the card selection.
     - Solution: Include a mix of clear-cut and ambiguous cases. For example, include one clear disease (e.g., a broken leg) to anchor? But we don't have one. Or explain that the cards are designed to provoke discussion, but the activity is about the process.

  4. Objection: real panels use guidelines.
     - Solution: Acknowledge that real panels do, and guidelines are based on evidence. But the activity shows how those guidelines might have been developed, and that at the foundation, choices about reference class and environment were made. Also, guidelines change over time and across regions.

  Finally, let's write the full rules and cards.

  Due to length, I will provide the essentials.

  Full Rules Document:

  **Session Title: Coverage Review Board Simulation**

  **Goal:** To decide which conditions should be funded as diseases, using only biological data and a fixed budget.

  **Rules:**
  1. Participants are divided into panels of 5 (one panel of 4). Each panel is a review board.
  2. Each panel reviews 3 conditions (assigned by facilitator).
  3. For each condition:
     a. The panel chooses a reference class from the provided options (without seeing data).
     b. The facilitator gives the data sheet for that reference class.
     c. The panel discusses for 5 minutes. The Rules Enforcer ensures only physiological arguments are used (no evaluative language).
     d. Vote: 
        - Is it a disease? Majority vote.
        - If yes, then decide whether to fund it, considering the cost and the remaining budget. (If funded, subtract cost from budget.)
  4. The Rules Enforcer role rotates with each condition.
  5. Each participant has a secret role card (e.g., "You have a family member with Condition X", "You are a budget hawk"). Keep it secret and do not reveal during discussion. It may influence your personal view, but you must still use only biological arguments.
  6. After reviewing all conditions, the panel reports decisions.

  **Materials:**
  - Condition cards (6 total, each with a brief description)
  - Reference class choice sheets (for each condition, one sheet with 2-3 options)
  - Data sheets (for each condition and reference class option, one sheet)
  - Decision sheets (one per panel, to record choices)
  - Rules Enforcer card (one per panel, to be passed)
  - Secret role cards (one per participant, randomly assigned)
  - Whiteboard and markers for tally
  - Timer

  **Condition Cards:**

  1. Pregnancy
     - Description: A natural state of carrying a developing embryo or fetus. Sometimes associated with complications like gestational diabetes or pre-eclampsia.

  2. Male-Pattern Baldness (Androgenetic Alopecia)
     - Description: Hair loss in a characteristic pattern, caused by genetic sensitivity to dihydrotestosterone (DHT).

  3. Sickle Cell Trait
     - Description: Carrying one allele for sickle cell hemoglobin. Typically asymptomatic, but can cause complications under certain conditions.

  4. Intense Prolonged Grief
     - Description: Severe grief symptoms persisting for more than 6 months after a loss, with significant impact on daily functioning.

  5. Same-Sex Attraction (Historical Diagnosis 302.0)
     - Description: Exclusive or predominant attraction to individuals of the same sex. Classified as a mental disorder in the past, but declassified in 1973.

  6. Metabolic Rate Variant X
     - Description: A genetic variant affecting metabolic rate, leading to differences in energy storage.

  **Reference Class Options and Data Sheets:**

  For brevity, I'll outline one example.

  Condition: Sickle Cell Trait

  Reference Class Options:
  - Option 1: General population in a malaria-endemic region (e.g., sub-Saharan Africa)
  - Option 2: General population in a non-malaria-endemic region (e.g., Europe)
  - Option 3: Population of African descent in the United States

  Data Sheet for Option 1:
  - Prevalence: 15%
  - Physiological Effects: 
     - Reduces mortality from malaria by 10% compared to non-carriers.
     - Risk of sickle cell crisis: 0.5% per year (usually mild).
  - Impairment: None in most individuals; occasional pain crises.

  Data Sheet for Option 2:
  - Prevalence: 1%
  - Physiological Effects: 
     - No protective effect against any disease.
     - Risk of sickle cell crisis: 5% per year (can be severe).
  - Impairment: Reduced oxygen carrying capacity under stress; risk of crisis.

  Data Sheet for Option 3:
  - Prevalence: 8%
  - Physiological Effects:
     - No malaria protection.
     - Risk of sickle cell crisis: 4% per year.
     - Increased risk under dehydration or altitude.
  - Impairment: As in Option 2.

  Cost: 20 units

  Similarly for other conditions.

  **Secret Role Cards (examples):**
  - "You have a family member with Male-Pattern Baldness. You personally believe it should be funded."
  - "You are a budget hawk: you want to preserve as much of the budget as possible."
  - "You are an advocate for mental health conditions: you believe Intense Prolonged Grief should be funded."
  - "You are a taxpayer representative: you want to fund only the most severe conditions."

  **Timeline:**

  75-minute version:
  - 0-5 min: Introduction and rules
  - 5-10 min: Panel formation, distribute secret roles, first Rules Enforcer
  - 10-34 min: Condition review (3 conditions, 8 min each: 1 min choose reference class, 5 min discuss, 2 min vote)
  - 34-44 min: Reporting and tally on whiteboard
  - 44-65 min: Debrief (see below)
  - 65-75 min: Reveal secret roles and final reflection

  40-minute variant:
  - 0-4 min: Intro
  - 4-8 min: Setup
  - 8-24 min: Condition review (2 conditions, 8 min each)
  - 24-29 min: Reporting
  - 29-39 min: Debrief
  - Sacrifice: less time for discussion, fewer conditions, and shorter debrief. The insights may be more superficial.

  **Debrief Plan:**

  1. (5 min) Observations: 
     - Ask panels: Did any of you review the same condition? What reference class did you choose? What was your decision? Why the difference?
     - Highlight on whiteboard: for a condition like sickle cell, panels with different reference classes had different data and decisions.

  2. (5 min) The role of biology and values:
     - Ask: Did the rule of order (forcing biological arguments) work? What did it prevent? Did you find it frustrating not to talk about suffering or quality of life?
     - Then ask: But when you discussed whether to fund, did values creep in? How?
     - Point: The biology underdetermined the disease verdict until you chose a reference class, and even then, the funding decision involved values about severity and resources.

  3. (5 min) Philosophical framing:
     - "Imagine a theorist who says: disease is purely biological dysfunction. How would they respond to what you experienced?"
     - They might say: The dysfunction is biological (e.g., impaired oxygen transport in sickle cell crisis), but the line between disease and variation depends on the environment and population. However, they would argue that the species-typical function in the natural environment is the objective standard. But what is the natural environment for humans?
     - They might also distinguish disease (biological dysfunction) from illness (the social recognition and response). The funding decision is about illness.

  4. (5 min) Secret roles:
     - Ask participants to reveal their secret roles. Did it influence them? How? But note that the rule of order forced biological arguments, which may have suppressed these influences. In real life, without such rules, values might play a larger role.

  **Predictable Problems:**

  1. Rules-of-order becomes a word game.
     - Solution: Facilitator models in intro: "Instead of 'this is bad', say 'this involves a deviation in the normal function of the hypothalamic-pituitary-adrenal axis'." And circulate to help.

  2. Steamrolling by confident student.
     - Solution: Assign speaking order or use timed turns. In debrief, ask quieter members for input.

  3. Reverse-engineering the lesson.
     - Solution: Include a mix of cases. If they guess, acknowledge that the cards are chosen to provoke thought, but the activity is about the process.

  4. Objection: real panels use guidelines.
     - Solution: "Exactly. This simulation shows how those guidelines might have been developed. Guidelines require making choices about reference populations and environments. And they change over time, as we saw with homosexuality."

  **What the Activity Cannot Do:**

  It cannot settle the philosophical debate. It shows that reference class and environment choices are necessary, but it doesn't prove that there is no objective biological standard. You will have to explain that the naturalist might respond by insisting on a species-typical design in the environment of evolutionary adaptation, but that environment is hard to define for humans. Also, the activity does not address the exact details of the biostatistical theory (e.g., the idea of statistically typical function). You can mention that in the debrief.
