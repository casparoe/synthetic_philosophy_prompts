answer: |-
  Here is a specification of desiderata for a criterion of authenticity conceived as a likelihood ratio rule, addressing your constraints and highlighting the fundamental tensions:

  ### Core Definition of a Criterion
  A criterion is a function **C(u) = P(E_u | H_authentic) / P(E_u | H_inauthentic)**  
  Where:  
  - **u** = a unit of tradition (saying, event, motif)  
  - **E_u** = The evidence (form, content, context) of **u** as preserved in the extant tradition.  
  - **H_authentic** = "u originates from the historical Jesus."  
  - **H_inauthentic** = "u originates within early Christian communities (post-Jesus)."  

  ---

  ### Desiderata for a Valid Criterion

  1.  **Transmission Bias Correction**  
      *   **What it requires:** The criterion must account for the *differential survival probability* of units based on their utility to later communities. It cannot assume transmission is neutral.  
      *   **Considerations:** Transmission favors units useful for teaching, worship, polemic, or community cohesion. This biases the record *toward* preservation of inauthentic units fitting later needs *and against* preservation of authentic units that were embarrassing, irrelevant, or counter-productive.  
      *   **Status:** **Non-negotiable** for a realistic model. Ignoring this renders criteria mathematically naive.

  2.  **Formal Independence**  
      *   **What it requires:** When combining multiple criteria, the joint likelihood ratio must be calculable without double-counting evidence. Criteria relying on overlapping features (e.g., both "Embarrassment" and "Dissimilarity" keying off conflict with later theology) cannot be treated as independent multipliers.  
      *   **Considerations:** The corpus is small; features like "Aramaic traces," "palestinian environment," or "dissimilarity" are not statistically independent data points but often co-occurring facets of the same limited data. Treating them as independent inflates confidence.  
      *   **Status:** **Non-negotiable** for valid probabilistic reasoning. However, *pragmatic camps* often relax this due to the lack of alternatives.

  3.  **Oral-Period Bridge**  
      *   **What it requires:** The criterion must incorporate a model of how the unit's form/content at the point of textual fixation relates to its form/content at the point of origin (Jesus or early community). It must specify how transmission dynamics (memory, performance, adaptation) affect P(E_u | H).  
      *   **Considerations:** Textual criteria apply to the *final form*. For them to say anything about Jesus (H_authentic), we need a justified model linking that final form back to an originating event/person *despite* oral transmission and community use.  
      *   **Status:** **Non-negotiable** for relevance to the *historical Jesus*. Often neglected or assumed simplistically (e.g., "stable core tradition").

  4.  **Handling Ambiguity**  
      *   **What it requires:** The criterion must explicitly define its behavior when C(u) ≈ 1 (evidence equally likely under both hypotheses). It must not force a classification. The rule owes us an acknowledgment of inconclusive units and their impact on the overall picture.  
      *   **Considerations:** Many units lack features clearly favoring H_authentic or H_inauthentic (e.g., benign ethical teachings fitting both Jesus and early communities). Pretending criteria classify everything overstates their power and obscures uncertainty.  
      *   **Status:** **Non-negotiable** for intellectual honesty. *Apologetic* and *skeptical camps* often resist this, preferring definitive conclusions.

  5.  **Base Rate Agnosticism (or Explicit Modeling)**  
      *   **What it requires:** The criterion itself should not presuppose the prior probability P(H_authentic). Alternatively, if priors are used (e.g., in Bayesian frameworks), they must be justified separately from the criterion's likelihood ratio.  
      *   **Considerations:** Criteria are often applied as if a high C(u) *proves* authenticity. However, Bayes' Theorem shows posterior odds depend *also* on prior odds. A high C(u) for a unit with a very low prior P(H_authentic) may still leave it unlikely.  
      *   **Status:** **Non-negotiable** for correct inference. Often violated implicitly (e.g., assuming "dissimilar" items *must* be authentic).

  6.  **Distinctiveness Requirement**  
      *   **What it requires:** The feature(s) the criterion relies on must be demonstrably *more probable* under one hypothesis (H_authentic or H_inauthentic) than under the other, *given transmission bias*. It cannot rely on features equally expectable under both.  
      *   **Considerations:** Many proposed criteria (e.g., "Coherence") fail because features like coherence with other *presumed* authentic material are easily generated by communities crafting their tradition.  
      *   **Status:** **Non-negotiable** for the criterion to have *discriminative power*. This is widely recognized but hard to satisfy.

  ---

  ### The Unsatisfiable Core Dilemma

  **The subset of desiderata that cannot be jointly satisfied is: #1 (Transmission Bias Correction), #3 (Oral-Period Bridge), and #6 (Distinctiveness Requirement).**

  *   **Why?**
      1.  **#1 (Bias):** Transmission overwhelmingly favors material useful to later communities. This makes P(E_u | H_inauthentic) *high* for units serving community needs.
      2.  **#3 (Oral Bridge):** To connect the textual form (E_u) to Jesus (H_authentic), we need a plausible model of how a unit *from Jesus* could survive transmission *despite* #1. This requires features that both:
          *   Originated with Jesus (satisfying H_authentic).
          *   Were *nevertheless* preserved *even if* they were embarrassing, irrelevant, or counter-productive to later communities (overcoming the bias described in #1).
      3.  **#6 (Distinctiveness):** The *only* features plausibly satisfying (2) are those *so distinctive* to Jesus that later communities preserved them *despite* their lack of utility or even negative utility (e.g., "embarrassing" features). This is the logic behind "Embarrassment" or "Dissimilarity."
      4.  **The Catch-22:** If a feature is *so* distinctive to Jesus that it overcomes transmission bias against preserving it (making P(E_u | H_authentic) reasonably high *despite* bias), then by definition, it becomes *extremely improbable* that the early communities would independently *generate* such a counter-productive, useless, or embarrassing unit (making P(E_u | H_inauthentic) very low). **However, if the communities *did* generate and preserve such a unit, it utterly destroys the criterion's logic.** Why would a community invent and preserve something that was embarrassing, counter-productive, or useless to it? The only explanation *within* H_inauthentic is that the unit *did* serve some hidden need (e.g., demonstrating fidelity to a difficult truth, attacking opponents), but this immediately raises P(E_u | H_inauthentic) significantly, potentially bringing C(u) close to 1. The criterion relies on assuming communities *wouldn't* do this, but we lack the independent evidence to rule it out definitively. Transmission bias (#1) makes the preservation of *any* unit evidence *for* its utility to *someone* in the tradition, undermining the claim that a unit lacks utility (a prerequisite for distinctiveness via embarrassment/dissimilarity).

  **In essence:** To overcome transmission bias, a criterion needs distinctive "Jesus-only" features. But proving a feature *could only* come from Jesus and *could never* be generated/usefully preserved by the communities is impossible without circular reasoning or inaccessible knowledge of early community psychology and motives. The Oral-Period Bridge (#3) is too poorly understood to provide independent validation.

  ---

  ### The Most Damaging Desideratum to Widely Used Criteria

  **#1 (Transmission Bias Correction) does the most damage.**

  *   **Why:** Virtually *all* major criteria (Dissimilarity, Embarrassment, Multiple Attestation, Coherence, Semitic Flavor, Palestinian Environment) implicitly or explicitly *ignore or downplay* the profound, distorting effect of transmission bias.
      *   **Dissimilarity/Embarrassment:** Assume that dissimilar/embarrassing material wouldn't be *invented*. But transmission bias (#1) means material *was preserved because it was useful*. An embarrassing saying might be preserved *because* it proved fidelity ("we keep even the hard sayings") or served a polemical purpose. This drastically raises P(E_u | H_inauthentic), potentially neutralizing C(u).
      *   **Multiple Attestation:** Assumes multiple independent lines *reduce* the chance of community invention. But transmission bias (#1) means widely useful/influential *inauthentic* traditions are *more likely* to appear in multiple streams than obscure authentic ones. Common community needs generate "attestation."
      *   **Coherence:** Assumes coherence with *presumed* authentic material indicates authenticity. Transmission bias (#1) means communities naturally craft coherent traditions that serve their needs (H_inauthentic). P(E_u | H_inauthentic) is high.
      *   **Semitic Flavor/Palestinian Environment:** Assume these point away from Hellenistic communities. But transmission bias (#1) means communities wanting to root their tradition authentically in Jesus' Jewish context would *deliberately preserve or invent* such material. P(E_u | H_inauthentic) is significant.
  *   **The Damage:** By failing to rigorously model how transmission bias (#1) fundamentally shapes P(E_u | H_authentic) and *especially* P(E_u | H_inauthentic), these criteria systematically *underestimate* the probability that inauthentic material would look exactly like the evidence we have. They mistake features that *could* indicate authenticity for features that *must* indicate it, ignoring the powerful engine of community need driving preservation and shaping the tradition from the start. This leads to overconfidence in judgments of authenticity.

  This specification reveals the criteria project as fundamentally hampered by the irreducible uncertainty of the transmission process and the motivations of the tradents. The core tension between transmission bias and the need for distinctiveness is likely unresolvable with the available evidence and methods.
