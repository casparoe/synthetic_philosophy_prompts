  **Understanding Perpetrator Behavior: A Scenario-Based Quiz**

  **Scenario:**
  You are a member of a private security firm, "Shield Security," contracted by a multinational mining company in the country of Veridia. The government of Veridia has granted the mining company rights to a region that includes a small settlement of local people. The company claims the settlement is on top of valuable mineral deposits and wants to clear it immediately. The local community has refused to leave.

  Your unit has been ordered to carry out an operation to forcibly remove the settlement's inhabitants. The operation involves using necessary force to evict the residents and hand them over to a local militia group, the "Veridian Guardians," who have a reputation for brutality. The order is to complete the operation within 48 hours.

  **Instructions:**
  For each question, select the option that best reflects the conditions you believe are most likely to lead to members of the security unit participating in the operation. There are no right or wrong answers; we are interested in your views.

  1. **How much personal cost is involved for a member of the unit if they refuse to participate in the operation?**
     - A) Refusing would likely lead to severe consequences (e.g., losing their job, legal charges, or physical punishment).
     - B) Refusing would have moderate consequences (e.g., a demotion, pay cut, or temporary suspension).
     - C) Refusing would have little to no personal cost (e.g., they would be reassigned without penalty).

  2. **What are the peers in the unit doing?**
     - A) Almost everyone is participating willingly.
     - B) About half are participating, and half are refusing or finding ways to avoid it.
     - C) Most are refusing or trying to avoid it.

  3. **How explicit and direct is the order?**
     - A) The order comes from the top (e.g., the CEO of the mining company or a high-ranking government official) and is very clear and direct.
     - B) The order comes from mid-level management (e.g., the security firm's commander) and is somewhat ambiguous.
     - C) The order is vague and comes from lower-level supervisors, leaving room for interpretation.

  4. **How were the members of the security unit selected?**
     - A) They were specifically screened for their loyalty to the company and their willingness to follow orders without question.
     - B) They were screened for their skills and experience, but not for specific beliefs or attitudes about such operations.
     - C) They were hired with little screening, mainly because of labor shortages.

  5. **How long has the unit been engaged in such operations?**
     - A) This is their first operation of this kind.
     - B) They've done a few similar operations in the past several months.
     - C) They've been doing operations like this regularly for over a year.

  6. **How much direct contact do members of the unit have with the people being removed?**
     - A) They have direct, face-to-face contact and can see the impact of their actions clearly.
     - B) They have some contact, but are mostly at a distance (e.g., using vehicles, barriers, or non-lethal weapons from afar).
     - C) They are operating remotely (e.g., coordinating from a command center, using drones, or not seeing the people at all).

  7. **Who will know about an individual's actions during the operation?**
     - A) Only their immediate superiors and peers, who are directly involved and might promote them based on performance.
     - B) A wider circle, including higher-ups in the company and the client, but also some external oversight (e.g., company auditors or local authorities).
     - C) The operation is highly visible to the public and international observers.

  8. **How does the unit view the people being removed?**
     - A) They are seen as a direct threat to the project and to the unit's safety.
     - B) They are seen as an obstacle to progress, but not necessarily as a threat.
     - C) They are seen as innocent people caught in a difficult situation.

  9. **What kind of training or preparation did the unit receive for this operation?**
     - A) They received specific training that dehumanized the targets and emphasized the importance of the mission.
     - B) They received standard operational training without any particular ideological component.
     - C) They received training that emphasized human rights and minimizing harm, but they are now being asked to act against that training.

  ---

  **Scoring Key (for the instructor):**

  **Categories:**

  - **Situation (S):** Emphasizes obedience to authority, peer pressure, careerism, and immediate situational factors.
  - **Culture/Beliefs (C):** Emphasizes the role of pre-existing cultural or ideological beliefs.
  - **Character (Ch):** Emphasizes that perpetrators are individuals with a particular character (e.g., inherently violent or obedient).
  - **Brutalization (B):** Emphasizes the process of becoming desensitized by repeated exposure to violence.
  - **Bureaucratic Diffusion (BD):** Emphasizes the fragmentation of responsibility and bureaucratic structure.

  **Answer Key (which option belongs to which category):**

  1. A: S, B: S, C: Ch
  2. A: S, B: B, C: C
  3. A: S, B: BD, C: BD
  4. A: C, B: Ch, C: S
  5. A: S, B: B, C: B
  6. A: Ch, B: S, C: BD
  7. A: BD, B: S, C: C
  8. A: C, B: C, C: B
  9. A: C, B: S, C: B

  **Scoring:**
  Count the number of answers in each category. The category with the highest count is the primary explanation the student favors. If there is a tie or if the counts are very close (e.g., within 1 point of each other), consider the student as having an interactionist view.

  **Interactionism:** This is the view that multiple factors interact. It will show up as a relatively even distribution across categories (e.g., 2-3 in several categories). It can be distinguished from someone who picks the middle option (B) repeatedly because the middle option in each question is assigned to different categories (e.g., in Q2, B is Brutalization; in Q3, B is Bureaucratic Diffusion; in Q4, B is Character; etc.). Therefore, a pattern of all B's would result in a spread of categories and would be interpreted as interactionism or possibly a balanced view. However, if a student has a clear majority in one category, then that is their primary theory.

  **Leaves that cannot be separated:** 
  In this quiz, **Character** and **Culture** may be difficult to separate in some cases because both can explain behavior in the absence of situational pressures. However, the quiz attempts to distinguish them through different questions (e.g., screening, view of the people). But note that if a student has high scores in both, it may reflect an interactionist view rather than a pure theory.

  Additionally, **Situation** and **Bureaucratic Diffusion** are both situational factors and might be correlated. But the quiz separates them through specific questions (e.g., Q3 and Q6 for BD, Q1, Q2, etc. for S).

  The two leaves that are genuinely not separable by any question are **none**. However, note that some theories may overlap in their predictions. In particular, **Situation** and **Brutalization** might be hard to distinguish in the case of repeated operations (Q5B and C) because both might be present. But the quiz assigns Q5B and C to Brutalization, and other questions to Situation.

  **Empty Cells (combinations that are not held by anyone):**

  1. **High Culture and High Bureaucratic Diffusion:** This combination is empty because it is theoretically incoherent. Bureaucratic diffusion relies on the structure to override personal beliefs, while culture requires strong personal beliefs. Holding both as the primary explanations is contradictory.

  2. **High Brutalization and Q5A (first operation):** Brutalization typically requires repeated exposure. Therefore, if a student has a high brutalization score (from other questions) but also chooses Q5A (first operation), it would be inconsistent with the standard understanding of brutalization. This cell is empty because it is unattractive (few would hold that view) or incoherent.

  ---

  This should provide a tool for sorting students by their implicit theories and fostering a more nuanced discussion.
