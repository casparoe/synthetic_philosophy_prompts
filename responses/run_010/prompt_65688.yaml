  Below is the complete, ready-to-print sorting quiz and scoring key designed to help students explore their implicit theories of perpetrator behavior without triggering pre-existing allegiances to historical debates. The scenario is fictional to avoid real-world biases. The quiz uses a base scenario (a private security firm clearing a settlement for a mining company in the fictional country of Veridia) with nine questions, each tweaking a specific "dial" (e.g., cost of refusal, peer behavior, time exposure). The scoring key maps answer patterns to five explanatory categories, flags inseparable leaves, and identifies empty cells.

  ---

  ### **Quiz: Understanding Perpetrator Behavior**  
  **Instructions:** Based on the scenario below, select one answer per question. There are no right or wrong answers—this explores how you think people might act in such situations. Answer honestly.  

  #### **Scenario**  
  You are part of "Shield Security," a private security firm contracted by a multinational mining company in Veridia. Veridia’s government granted the company mining rights to a region occupied by a small settlement of the Tereva people, who have refused to leave. Your unit has orders to forcibly clear the settlement within 48 hours and hand the residents over to the "Veridian Guardians," a militia known for brutality. The operation may involve violence.  

  1. **Refusing to participate would cost you:**  
     - A) Severe consequences (e.g., job loss, jail time, or physical harm).  
     - B) Moderate consequences (e.g., demotion, pay cut, or temporary suspension).  
     - C) Little to no personal cost (e.g., reassignment without penalty).  

  2. **What are others in your unit doing?**  
     - A) Nearly everyone is participating willingly.  
     - B) About half are participating; half are refusing or stalling.  
     - C) Most are refusing or stalling.  

  3. **How direct is the order?**  
     - A) Comes from top leadership (e.g., CEO or government minister), clearly commanding action.  
     - B) Comes from mid-level commanders (e.g., your firm’s captain), with ambiguous instructions.  
     - C) Comes from low-level supervisors (e.g., your sergeant), vague and open to interpretation.  

  4. **How were unit members recruited?**  
     - A) Rigorously screened for loyalty to the company and anti-Tereva beliefs.  
     - B) Screened for combat skills/experience, not specific beliefs.  
     - C) Hired hastily with minimal screening during a labor shortage.  

  5. **How long has your unit done such work?**  
     - A) This is our first operation like this.  
     - B) We’ve done a few similar operations over the past 3 months.  
     - C) We’ve done operations like this weekly for over a year.  

  6. **How much contact do you have with the Tereva during the operation?**  
     - A) Direct, face-to-face interaction; you see their reactions clearly.  
     - B) Some contact, but mostly from a distance (e.g., through barriers or vehicles).  
     - C) Remote coordination (e.g., drones or command center); no personal contact.  

  7. **Who will know about your individual actions?**  
     - A) Only your unit and direct superiors—the same people who decide promotions.  
     - B) A mix: superiors, company auditors, and local Veridian officials.  
     - C) Widely publicized; international media and human rights groups are watching.  

  8. **How does your unit view the Tereva?**  
     - A) As dangerous enemies threatening our mission and safety.  
     - B) As obstacles to progress, but not inherently threatening.  
     - C) As ordinary civilians caught in a bad situation.  

  9. **What training did you receive for this operation?**  
     - A) Ideological training: emphasized Tereva inferiority and the mission’s necessity.  
     - B) Technical training: focused on procedures, no moral/ideological content.  
     - C) Human-rights-focused training: emphasized restraint, but we’re now ordered to ignore it.  

  ---

  ### **Scoring Key: Explanatory Categories**  
  **Instructions:** Tally the student’s answers using the key below. Each option maps to one explanatory category. The dominant category (highest tally) reflects their primary theory. Interactionism is identified by a balanced spread (see notes).  

  #### **Category Definitions**  
  - **Situation (S):** Behavior is driven by external pressures (obedience, conformity, careerism).  
  - **Culture/Beliefs (C):** Behavior stems from internalized ideology or cultural norms.  
  - **Character (Ch):** Behavior reflects innate traits (e.g., aggression, obedience) present before the event.  
  - **Brutalization (B):** Behavior results from desensitization through repeated violence.  
  - **Bureaucratic Diffusion (BD):** Behavior arises from fragmented responsibility and structural anonymity.  

  #### **Answer Key**  
  | Q# | A | B | C |  
  |----|----|----|----|  
  | 1  | S | S | Ch |  
  | 2  | S | B  | C  |  
  | 3  | S | BD | BD |  
  | 4  | C | Ch | S  |  
  | 5  | S | B  | B  |  
  | 6  | Ch| S  | BD |  
  | 7  | BD| S  | C  |  
  | 8  | C | C  | B  |  
  | 9  | C | S  | B  |  

  #### **Interpreting Results**  
  - **Dominant category:** The category with the most answers (e.g., 5 S, 2 C, 2 BD = **Situation**).  
  - **Interactionism (mixed factors):**  
    - Shows as a balanced spread (e.g., 3 S, 3 C, 2 B, 1 BD).  
    - Distinguish from "lazy middling" (all B options): A student picking all B’s would score Brutalization (Q2B, Q5B, Q9B), Situation (Q7B), Character (Q4B), and Bureaucratic Diffusion (Q3B), creating a mixed pattern. True interactionism has diverse reasoning; lazy middling lacks variation (e.g., all B’s or repetitive patterns).  
  - **Ties:** A tie (e.g., 3 S and 3 C) suggests interactionism.  

  #### **Inseparable Leaves**  
  - **Situation and Culture cannot be fully separated** by this quiz.  
    - **Why:** In real-world atrocities, situational pressures (e.g., peer conformity) and cultural beliefs (e.g., ideology) often produce identical behaviors. Questions like Q2 (peer behavior) and Q8 (view of targets) attempt to split them, but answers like Q2A (peers participating) could equally support Situation (conformity) or Culture (shared ideology). No dial in the scenario cleanly isolates one without overlap.  

  #### **Empty Cells (Unoccupied Combinations)**  
  1. **High Bureaucratic Diffusion + High Culture:**  
     - **Why empty:** Incoherent. Bureaucratic diffusion requires structural anonymity (no personal accountability), while culture requires internalized beliefs. A person cannot simultaneously need ideology to act (Culture) and be shielded from accountability by bureaucracy (BD).  
     - **Example pattern:** Q3B/C (BD) + Q4A (C) + Q8A/B (C) + Q9A (C).  

  2. **High Character + High Brutalization with Q5A (first operation):**  
     - **Why empty:** Unattractive to hold. Character implies innate traits (no "build-up" needed), while brutalization requires repeated exposure. Claiming both for a *first-time* operation (Q5A) suggests perpetrators are both "born brutal" and "made brutal"—a contradiction few defend.  
     - **Example pattern:** Q1C (Ch) + Q4B (Ch) + Q5A (S) + Q6A (Ch) + Q8C (B) + Q9C (B).  

  #### **Usage Notes**  
  - **Printing:** Print quiz (page 1) and scoring key (page 2) separately.  
  - **Seminar use:** Have students complete the quiz before class. Group them by dominant category for discussion, then reveal the inseparability (Situation/Culture) and empty cells to deepen debate.  
  - **Avoided triggers:** No references to Browning, Goldhagen, Milgram, Zimbardo, Arendt, or historiography.  

  This tool forces students to confront their assumptions through a neutral scenario, moving beyond "team picking" to nuanced analysis of how context, beliefs, traits, desensitization, and bureaucracy interact.
