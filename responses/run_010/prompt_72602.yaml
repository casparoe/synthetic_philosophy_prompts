  The disagreement table is trickiest. I phrase Row 1 to capture the skeptic's view that justification is impossible here versus the opponent's "worthless knowledge" stance. Row 2 addresses whether the circularity alone is the problem or if practical uselessness is key. I mark both as genuine disputes since they reflect deep epistemological splits.

  For cruxes, I select questions that could actually shift positions: (A) whether worthless knowledge exists (using Lehrer-Cohen cases), (B) if circularity alone invalidates justification (via track-record arguments), and (C) whether the hospital statistic could function as evidence (testing with counterfactual clinicians). Each has clear, testable predictions from both sides.

  Throughout, I flag where positions reflect ongoing academic debates (e.g., Klein vs Sosa on closure) and mark my own framing judgments. The hospital case stays central to maintain relevance.

