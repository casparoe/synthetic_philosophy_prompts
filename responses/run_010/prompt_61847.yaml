prompt: |-
  I've got 75 minutes with our ML master's cohort next month — every one of them can train and debug a transformer, none has read a word of philosophy, and maybe a third already think interpretability features are just vibes, a useful fiction for predicting what a model does. What I want to teach is narrow: what would make the claim that a network represents X true rather than merely handy. Plan how I teach it, don't teach it to me.

  So: the order the pieces go in and what depends on what (I suspect superposition and polysemanticity have to land before anything about probes or the whole thing falls apart — check me on that); one running example to hang it on, plus what that example has to have and what it must not have; where I slot my live demo, which is a little sentiment model I trained myself and a linear probe that pulls "the input contains a negation" out of layer 2 at like 94%; the misconceptions they'll arrive with or form along the way, and the exact point in the sequence to head each off — including the one I currently can't answer, which is some version of "if the feature only shows up once you've picked the right probe, isn't it in the probe and not the network?", and its mirror image, where a good probe is treated as settling the question; one closing question that tells me whether it landed or whether they've just learned the vocabulary; and what I should openly refuse to cover at this level and say so (I'm guessing scientific realism in general, but tell me if thats the wrong cut).
reasoning: |-
  We are teaching a 75-minute session to ML master's students who are technically proficient but have no background in philosophy. The goal is to address the question: "What would make the claim that a network represents X true rather than merely handy?"

  Key points to cover:

  1. **Superposition** and **polysemanticity** are foundational. Without these, the students might think that each neuron cleanly represents one feature, which is not the case. This sets the stage for why we need probes and why interpretability is non-trivial.

  2. **Running Example**: We need an example that:
     - Is simple enough to understand quickly.
     - Shows superposition (multiple features represented in one neuron) and polysemanticity (one neuron responding to multiple features).
     - Must not be too complex (like a full transformer) but should be relatable. A small neural network for a toy task (like sentiment analysis) is good.

     Example: A sentiment analysis model that classifies sentences as positive or negative. We can show that in an intermediate layer, there isn't a single neuron for "negation", but the information is distributed.

  3. **Live Demo**: A sentiment model trained by the instructor and a linear probe that extracts "the input contains a negation" from layer 2 with 94% accuracy. The demo should come after explaining superposition and polysemanticity, and before discussing what makes a representation "true". The demo is evidence that the information is in the network, but we have to argue why that doesn't settle the question of representation.

  4. **Misconceptions**:
     a. **Arriving with**: Interpretability features are just vibes (useful fictions). We address this by showing that the features are real (via probes) but that doesn't automatically mean the network "represents" them in a philosophical sense.
     b. **Forming during**: 
        - "If the feature only shows up once you've picked the right probe, isn't it in the probe and not the network?" We address this by explaining that the probe is a tool to read the network, and the information must be present in the activations for the probe to work. We can use the analogy of a thermometer: it reads temperature, but the temperature is a property of the environment. However, we must also note that a probe might create a feature that wasn't there? (We'll counter with control experiments: random probes, probes on random networks, etc.)
        - The mirror image: a good probe settles the question. We have to explain that a probe is a tool for measurement, but it doesn't tell us about the causal role of that representation in the network's computation.

  5. **Closing Question**: To check if they understood the distinction, we can ask: "If a linear probe for feature X works well on a layer, does that mean the network uses that feature in the same way for its computation? Why or why not?" We want them to see that the probe shows the information is present, but not necessarily that it's used causally by the network. We might need to design an example where a feature is present but not used (or vice versa).

  6. **What to avoid**: We openly refuse to cover scientific realism in general. We are focusing on the narrower question of representation in neural networks. We also avoid deep dives into specific interpretability methods beyond linear probes (like attention, etc.) and philosophical debates about consciousness, etc.

  Plan the 75 minutes:

  - **0-10 min**: Introduction and motivation. Pose the question: "When we say a neuron (or a direction in activation space) represents 'cat', what do we mean? Is it just a useful way to talk, or is there something more?" Set up the sentiment example.

  - **10-25 min**: Superposition and polysemanticity. Explain with diagrams and simple examples (maybe a small neural network with a hidden layer of 2 neurons that has to represent 4 features, showing that each neuron fires for multiple features and each feature is distributed). Emphasize that the network doesn't have a dedicated neuron for each feature.

  - **25-40 min**: Introduce linear probes. Explain that a probe is a simple model (linear) that we train on top of a frozen layer to predict a feature. Show the live demo: the sentiment model and the negation probe. Highlight that the probe achieves 94% accuracy. Ask: "What does this tell us? Is the negation feature represented in layer 2?"

  - **40-55 min**: Addressing misconceptions. 
     - First, the mirror image: "Does a good probe settle the question?" -> No, because the probe might be reading information that is present but not used by the network. Example: a network might have a feature for negation in layer 2, but if we ablate it and the output doesn't change, then it wasn't used. (We don't have to do ablation live, but we can describe it.)
     - Second, the other misconception: "Isn't the feature in the probe, not the network?" -> We can show that if we train the same probe on random labels, it fails. Or if we use a random network, it fails. So the network activations have the information. But also, we can note that the probe is just a tool to access the information that is encoded in the activations.

  - **55-65 min**: What makes the representation claim true? We argue that it requires:
     a. The information being present (which the probe shows) and 
     b. The network using that information causally for its computation (which we can test by interventions, e.g., if we perturb the activation in the direction of the negation feature, does the output change appropriately?).

     We can sketch the idea of causal mediation: if we change the input to remove the negation, the activation of that feature changes and the output changes. Or if we force the activation to be high for negation even when there's no negation, the output becomes wrong.

     We don't have time for full causal experiments, but we can outline the idea.

  - **65-75 min**: Conclusion and closing question. Pose the closing question and have a quick discussion. Then summarize: representation is more than just a handy fiction; it requires both the presence of the information and its causal role. But note that we are only scratching the surface.

  Openly refuse: We are not going to cover the philosophy of scientific realism (what does it mean for a scientific theory to be true?) or the nature of representation in the brain. We are focused on artificial neural networks.

  Running example details:
  - Task: Sentiment analysis (positive/negative).
  - We need a model that has a hidden layer where negation is represented in a distributed way. We can create a simple dataset with sentences that may contain negations (e.g., "I like it" vs "I don't like it").
  - The model should be small enough that we can explain. Maybe a 1-layer LSTM or a small transformer? But for simplicity, we can use a simple feedforward network on bag-of-words? However, we need an intermediate layer. Alternatively, we can pre-train a very small transformer on a tiny dataset? The live demo model should be trained in advance.

  The example must have:
  - A clear, interpretable feature (negation) that is not trivially available in the input (like a single token) but requires context? Actually, for simplicity, we can have "not" as a token, but then we can show that the probe picks it up. But also, we can have examples where negation is expressed without "not" (like "I never liked it") to show that it's more than a token. However, for a 75-min session, we can stick to simple cases.

  The example must not have:
  - A one-to-one correspondence between neurons and features (so that superposition is evident).

  Closing question: 
  - "If we train a probe that perfectly detects the presence of a 'dog' in images in the activations of a layer of a network, does that mean the network uses that 'dog' representation to decide the output? Why or why not?"

  We hope they say: Not necessarily, because the dog representation might be present but not used by the network for the output (if the task doesn't require it, for example). Or it might be a side effect. We need causal evidence.

  Let's structure the time:

  - 0-10: Intro and motivation (with sentiment example)
  - 10-25: Superposition and polysemanticity (with a simple neural net diagram and explanation)
  - 25-40: Linear probes and live demo (show the negation probe working)
  - 40-55: Tackle the misconceptions (probe doesn't settle it, probe isn't creating the feature)
  - 55-65: What makes it true? Causal role and information presence.
  - 65-75: Closing question and discussion.

  Note: We might run over in some sections, so we have to be flexible.

  For the misconception "if the feature only shows up with the probe, isn't it in the probe?" we can do:

  - Point out that the probe is linear and the activations are fixed. The probe is just a way to read the information. We can compare to Principal Component Analysis: if we find a direction that separates data, that direction was in the data, not created by PCA.

  - But also, we can note that if we train the probe on a different dataset (with the same network) and it still works, that shows the feature is in the network. Or if we train the probe on one set of examples and test on another, it generalizes.

  For the mirror image, we can ask: What if we have a probe that works perfectly but when we ablate that direction, the network performance doesn't change? Then the network wasn't using it. So the probe alone doesn't tell us about the causal role.

  We can also note that sometimes the network might use a feature in a non-linear way, so a linear probe might not even pick it up, even if it's there. So the absence of a linear probe doesn't mean the feature isn't there.

  But we are focusing on the case where we have a good probe.

  We'll be explicit about what we are not covering: 
  - We are not going to debate whether the network has "real" understanding or consciousness. 
  - We are not going into the philosophy of science (realism vs instrumentalism) in general, only for neural network representations.

  We'll say: "We are focusing on a narrow technical question: when we say a network represents X, what evidence do we need beyond the usefulness of that concept for prediction?"

  Let's hope it lands!
answer: |-
  Here's a structured 75-minute lesson plan focused on establishing **what makes a representation claim *true* (not just useful)** for ML practitioners. The flow prioritizes conceptual dependencies, uses a single running example, integrates your demo strategically, and preempts misconceptions.

  ### **Running Example: Sentiment Analysis Model**
  - **What it must have**:  
    A clear, non-lexical feature with distributed representation (e.g., "negation" spanning words like "not", "never", "barely"). Use short sentences:  
    `Positive: "I love this."` → `Negative: "I never love this."`  
    `Positive: "Good service."` → `Negative: "Not good service."`  
  - **What it must avoid**:  
    Direct token-level signals (e.g., don’t let negation rely solely on "not"; include varied phrasing). Avoid anthropomorphic terms ("the model thinks").

  ---

  ### **Lesson Plan**
  **Total: 75 mins**  
  *(Timings include Q&A buffer)*

  #### **0-10 min: Frame the Stakes**  
  - **Hook**: "When your probe finds 'negation' at 94% accuracy, is that feature *in the model* or just a useful story?"  
  - **Goal**: "Today, we establish what it takes to claim a network *truly represents* X—beyond probe accuracy."  
  - **Refuse upfront**: "We won't cover scientific realism or consciousness—only NN representations."  
  - **Demo tease**: Show probe output (no details yet). Pose key question: *"If the probe finds it, is it real?"*

  #### **10-25 min: Superposition & Polysemanticity (Foundation)**  
  - **Why first?** Without this, neurons seem monosemantic → probes feel like "vibes."  
  - **Concept**:  
    - **Superposition**: Model crams more features than neurons (like PCA).  
    - **Polysemanticity**: Single neuron fires for unrelated features (e.g., "not" and "good" in sentiment).  
  - **Example**: Visualize activations for `"never good"` vs. `"very good"`. Show one neuron firing for *both* "intensity" (`very`) and "negation" (`never`).  
  - **Preempt misconception**: "This isn't noise—it's efficient encoding. But it means features aren't neuron-aligned."  
  - **Transition**: "If features are entangled, how do we find them? Enter probes."

  #### **25-40 min: Probes as Measurement Tools (Not Creators)**  
  - **Concept**: Probes are thermometers, not the temperature.  
  - **Live Demo**:  
    - Show your sentiment model + negation probe (94% accuracy).  
    - **Critical test**: Run probe on *held-out sentences* (e.g., `"barely acceptable"`). Generalization shows it’s not overfitting.  
  - **Preempt misconception #1 ("Feature is in the probe, not the network")**:  
    - **When**: Immediately after demo.  
    - **Response**: "If the probe works on new data, the *information* is in activations. Swap in a random probe: accuracy drops. Train probe on random labels: fails. The probe *reads* the network; it doesn’t invent."  
  - **Transition**: "But a good read isn't enough. Does the network *use* this feature?"

  #### **40-55 min: Causal Validity (What Makes Representation *True*)**  
  - **Concept**: Representation requires **causal efficacy**.  
  - **Example Tests** (using negation):  
    - **Ablation**: Corrupt activations in the "negation direction"—does the model output flip? (e.g., `"not good"` → predicted positive).  
    - **Invariance**: Change non-negation words (e.g., `"not bad"` → `"not terrible"`). Does the feature persist?  
    - **Necessity**: Remove negation words (e.g., `"not good"` → `"good"`). Does the feature vanish?  
  - **Preempt misconception #2 ("Good probe = settled truth")**:  
    - **When**: After introducing causal tests.  
    - **Response**: "A probe shows the feature *exists*. Causal tests show it's *used*. E.g., negation might be present but ignored if the model relies on other heuristics."  
  - **Key Insight**: "Truth = information is encoded AND causally involved in the task."

  #### **55-65 min: Synthesis & Nuances**  
  - **Recap**:  
    - Superposition/polysemanticity → features are distributed.  
    - Probes measure; they don’t create.  
    - Causal role is non-negotiable for "true" representation.  
  - **Critical Distinction**: "Useful for prediction vs. integral to computation."  
  - **Address lingering doubt**: Reiterate that probes need causal backing. Use analogy: "A microscope reveals cells, but you need experiments to prove cells cause disease."

  #### **65-75 min: Closing Question & Discussion**  
  - **Check for understanding**: *"If a probe detects 'sarcasm' in a model with 95% accuracy, but ablating the feature doesn’t change predictions, does the model represent sarcasm? Why?"*  
    - **Target answer**: No—it’s present but not causal (just correlated).  
  - **If time**: Discuss implications—e.g., how this shapes interpretability research.

  ---

  ### **Misconception Defense Cheat Sheet**
  - **"Probes create features"**:  
    - **When**: Post-demo.  
    - **Response**: "Probes are linear readouts. Test: shuffle training labels → accuracy plummets. The network’s activations must contain the signal."  
  - **"Good probe settles it"**:  
    - **When**: During causal validity.  
    - **Response**: "Probes find *correlates*. E.g., a 'dog' probe might fire for 'fur'—but that doesn’t mean the model understands dogs. Ablation or editing tests reveal actual usage."  
  - **"Why not just trust the probe?"**:  
    - **When**: Synthesis.  
    - **Response**: "Because useful != true. E.g., a probe might find 'grammar' in an image model—it’s coincidental, not causal to vision tasks."

  ### **What to Openly Omit**
  - **Refuse**: "We're skipping scientific realism (e.g., 'Do quarks exist?')—focus is *only* on NN representations."  
  - **Also refuse**:  
    - Consciousness/subjectivity ("Does the model *experience* negation?").  
    - Full mechanistic interpretability (circuits, etc.).  
    - Probing non-linear methods (stick to linear for simplicity).

  ---

  ### **Why This Flow Works**
  1. **Builds dependencies**: Superposition first → probes make sense → causal tests resolve truth.  
  2. **Demo timing**: After superposition (so they see entanglement) but before causal tests (to challenge probe worship).  
  3. **Preempts "vibes" skepticism**: Grounds probes in measurement theory early.  
  4. **Closes with causality**: The core of the "truth" claim.  

  **Final tip**: Use whiteboard sketches for superposition (overlapping circles) and causal tests (arrows for ablation). The negation example is ideal—it’s concrete, non-lexical, and aligns with your demo.
