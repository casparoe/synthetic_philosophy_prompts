    *Path:* 1A→2B→4C or 1C→11C or 1C→11A→12A.  
  - **Dirty-hands position:** A particular official lie can be the right thing to do but leaves a moral remainder on the liar.  
    *Most awkward commitment:* Accepts that a wrongful act can be morally required.  
