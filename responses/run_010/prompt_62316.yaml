    *Path:* 1A→2B→4B→7C or 1A→2C→8C or 1C→11B→13C.  
  - **Strategic-ambiguity position:** Deliberate imprecision in deterrence and diplomacy is not lying and needs no special excuse.  
    *Most awkward commitment:* Defends non-denials that deliberately mislead as legitimate statecraft.  
    *Cannot explain:* How imprecision differs from lying when both produce false beliefs.  
    *Path:* 1A→2B→4B→7B or 1A→2C→8B or 1C→11B→13B.  
  - **Marketplace position:** The remedy for official falsehood is disclosure and counterspeech, not rules against falsehood.  
    *Most awkward commitment:* Tolerates lies if they are eventually corrected.  
    *Cannot explain:* Why falsehoods often spread faster than corrections.  
    *Path:* 1A→2B→4A→5A→6A or 1B→9A→10A or 1C→11A→12B or 1C→11A→12C.  
