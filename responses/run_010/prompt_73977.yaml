prompt: |-
  US Treasury Regulation § 20.2031-1(b) fixes the value of property for federal estate tax purposes as follows: "The fair market value is the price at which the property would change hands between a willing buyer and a willing seller, neither being under any compulsion to buy or to sell and both having reasonable knowledge of relevant facts." The same willing-buyer/willing-seller formula, in near-identical wording, governs the valuation of property donated to charity, and something like it recurs throughout American tax and valuation practice. The regulation adds that fair market value "is not to be determined by a forced sale price," and that where an item is ordinarily obtained by the public at retail, its value is the retail price rather than what a dealer would pay for it — so a decedent's used car is valued at what a member of the general public would pay for a comparable one, not at what a wholesaler would offer.

  Set this against a familiar result in the economics of markets. If agents share common priors, are known to be rational, and each already possesses reasonable knowledge of the relevant facts, then trade cannot get started: an offer to buy is itself evidence that the offerer knows something the recipient does not, so a rational recipient declines. Voluntary exchange is generated by exactly the features the definition removes — asymmetric information, divergent beliefs, and differing needs or endowments, along with whatever pressure those needs exert. The regulation therefore stipulates conditions under which the hypothetical transaction would arguably never take place, and then reports the price it would have fetched.

  There is a second wrinkle. The hypothetical is in practice settled by evidence drawn from actual transactions: comparable sales, and the price of the item in the market where it is most commonly sold. Those are transactions between real parties with unequal knowledge, unequal bargaining positions, and reasons of their own for trading. The practice defines the relevant price by excluding the very transactions it then relies on to determine it.

  What theory of price — and of value more generally — does this practice presuppose? Reconstruct the implicit theory explicitly: does it treat a price as a property an object possesses, disclosed once the distorting circumstances of particular traders are subtracted, or as a relational fact indexed to a specific pair of agents and a specific information partition? Which rival accounts does the practice quietly rule out (price as a condensation of dispersed and partly incommunicable knowledge, price as the residue of a bargaining process, price as a bookkeeping convention)? Distinguish what the practice strictly requires from what it merely sits well with: perhaps it presupposes no theory of value at all, only that a single, contestable number be producible for the tax base. Identify where the practice is underdetermined, and whether its two halves — the idealized definition and the actual-sales evidence — are consistent with one another, or only with different theories. Finally, suppose the definition were replaced by a frankly indexical one, on which an asset is worth what it is worth to a specified buyer under a specified state of information. What would have to change in the regulation, in appraisal testimony, and in the assessment of the tax base — and would the law then be obliged to say whose valuation counts, and on what grounds that party's is the right one?
reasoning: |-
  Hmm, this is a sophisticated query about the tension between legal valuation standards and economic theory. The user presents a paradox: US Treasury Regulation § 20.2031-1(b) defines fair market value (FMV) through a hypothetical "willing buyer/willing seller" transaction that assumes symmetric information and no compulsion - conditions that economic theory suggests would prevent actual trade. Then the regulation relies on real-world transactions (with asymmetric information and pressure) as evidence for this hypothetical value.

  The core theoretical conflict seems to be between:
  1) A Platonic view where value is an intrinsic property revealed when market "distortions" are removed
  2) A relativistic view where value emerges from specific transactional contexts

  The user asks me to reconstruct the implicit theory behind this legal practice. From my knowledge:
  - Tax law treats FMV as an objective property that exists independently of particular buyers/sellers, like discovering a "true" price by mentally stripping away imperfections
  - This aligns with classical economics (Marshall, Walras) where markets tend toward equilibrium prices
  - But it contradicts Hayek's view that prices are emergent signals from dispersed knowledge, and behavioral economics showing valuation is context-dependent

  The regulation's two halves create theoretical schizophrenia:
  - The definition rejects bargaining power differences → but comparable sales data inherently include them
  - It assumes symmetric information → but real transactions rely on information asymmetry

  If we switched to an indexical definition ("value to specific buyer"), we'd face practical nightmares:
  - Whose perspective? Decedent's? Heir's? IRS's?
  - How to define the "specified state of information"?
  - Appraisers would become advocates rather than neutral assessors
  - Tax bases could become manipulable through strategic information disclosure

  The user seems particularly sharp - they're spotting how legal fictions paper over theoretical cracks. Their questions suggest deep familiarity with both tax law and market microstructure theory. Probably an academic or advanced practitioner. The unspoken subtext might be: "How does law get away with such conceptually messy solutions?"

  What's revealing is that this definition persists despite its theoretical problems because it serves administrative needs: producing a single, defensible number for tax purposes. The willing-buyer/willing-seller model isn't meant to describe reality - it's a thought experiment that creates procedural fairness. That's why courts accept it while acknowledging its artificiality.

  The real answer to "what theory of value" might be: a pragmatic legal fiction that prioritizes workability over theoretical purity. But I should unpack this carefully in my response, showing where economic theory and legal doctrine diverge, and why the compromise holds.
answer: |-
  The US Treasury's fair market value (FMV) definition rests on a **classical equilibrium theory of price** that treats value as an *objective property inherent to the asset*, independent of specific transactors or bargaining contexts. This theory implicitly assumes:

  ### Core Presuppositions:
  1. **Price as Intrinsic Discovery**: Value exists "out there" as a discoverable fact, revealed when market distortions (asymmetric information, duress, unique motivations) are stripped away. The hypothetical transaction acts as a *filter* to isolate this "true" value.
  2. **Perfect Market Reference**: The definition points toward a neoclassical competitive equilibrium—a frictionless state where supply and demand converge at a single price. The "willing buyer/seller" dyad represents generic market participants, not specific individuals.
  3. **Value ≠ Bargaining Outcome**: By rejecting "forced sale prices" and dealer wholesale rates, the regulation denies that value emerges *from* negotiation power or liquidity constraints. Price is prior to the transaction.
  4. **Information Symmetry as Ideal**: The "reasonable knowledge" requirement assumes perfect (or at least symmetric) information is possible and necessary for "true" value revelation, ignoring Hayekian insights about prices *as* information-conveying mechanisms.

  ### Rival Theories Ruled Out:
  - **Price as Emergent Knowledge (Hayek)**: The practice dismisses the idea that prices *synthesize* dispersed, tacit knowledge through asymmetric trading. FMV treats price as pre-existing, not emergent.
  - **Price as Bargaining Residue**: By excluding duress and unequal positions, it rejects transaction-specific power dynamics as value determinants (e.g., game-theoretic or behavioral models).
  - **Price as Subjective Utility**: The hypothetical transactors lack personal preferences or idiosyncratic needs, ruling out Austrian/neoclassical subjective value theories where value is agent-relative.
  - **Price as Convention/Narrative**: It ignores sociological or Keynesian views where prices reflect collective stories or liquidity conventions rather than intrinsic worth.

  ### Internal Tensions:
  - **Underdetermined Idealization**: The definition provides no method to *construct* the hypothetical price absent real transactions, yet those real transactions are deemed "distorted."
  - **Evidential Contradiction**: Comparable sales (the primary evidence) derive from markets with asymmetries and pressures the definition excludes. This creates a circle: FMV is what undistorted sales *would* be, but we infer it from distorted sales.
  - **Consistency via Pragmatism**: The two halves cohere only under a **pragmatic instrumentalism**: FMV is a *legal construct* designed for administrability, not an economic truth. Courts accept that real-world data approximates the ideal when adjusted (e.g., via appraiser judgment for information gaps).

  ### Consequences of an Indexical Alternative:
  If FMV became "value to a specific buyer under specific information," the system would collapse into subjectivity:
  1. **Regulatory Changes**: The definition would need to specify *whose* perspective matters (e.g., the executor, the "typical" heir, the IRS). Valuation would become agent-relative and state-contingent.
  2. **Appraisal Testimony**: Appraisers would shift from finding "market" evidence to simulating counterfactuals: "What would *this* buyer pay if they knew *X*?" Expertise would lean on behavioral economics rather than sales comparables.
  3. **Tax Base Instability**: Valuations could fluctuate wildly based on designated beneficiaries' circumstances (e.g., a family business "worth more" to an heir than a stranger). Litigation would explode over which party's valuation is "correct."
  4. **Grounds for Selection**: The law would need a meta-rule to designate the valuing agent (e.g., "the executor's informed valuation"). This invites moral hazard—parties might manipulate information states to alter tax liability.

  ### Why the Current System Endures:
  The FMV definition persists because it serves **non-theoretical goals**:
  - **Administrability**: It generates a single, justifiable number for taxation.
  - **Horizontal Equity**: Treats similar assets alike, regardless of owners' circumstances.
  - **Verifiability**: Relies on observable market data, reducing disputes.
  - **Fiction as Function**: The willing-buyer/seller model is a *legal fiction* that masks theoretical incoherence for practical ends. As Judge Learned Hand noted, tax law often "wills the end but not the means," prioritizing workable rules over philosophical purity.

  In essence, the regulation presupposes a **Platonic theory of value** (price as an ideal form) while relying on **empirical proxies** (flawed market data). Its resilience lies in balancing theoretical aspirations with the brute need for enforceable assessments—a testament to law's pragmatic accommodation of economic contradictions.
