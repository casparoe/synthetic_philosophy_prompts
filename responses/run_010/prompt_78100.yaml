prompt: |-
  Every week or so I get pitched a story that turns entirely on somebody's first-person report, and I never know how much weight to put on it. An AI lab emails saying their model "describes its own experience" in fluent, quotable sentences. A sleep researcher's key result is what people said when they were woken up. A neurology team has a patient who hasn't tracked with his eyes or followed a command in four years, but who got five out of six personal questions right inside a scanner by imagining playing tennis for yes and walking through his childhood home for no. A retreat teacher describes a state with no contents whatsoever — no objects, no self, not even a sense of time — reported in detail years later by people who treat the retelling as part of the practice itself.

  I'm the person who covers science and ideas at a mid-sized general-interest magazine. Pieces run about 1,200 words, my editor signs off and legal reads anything that names a company. I've got maybe 40 minutes between a pitch landing and deciding whether to take it, I can't get lab access or run anything myself, and the person who fact-checks my copy has a biology degree and no philosophy at all — so anything I hand her has to work without jargon, or with a one-line gloss attached to each term. We also have a house rule that we never run "sentient" in a headline unless somebody in the piece will define it on the record, and a standing habit of leading with a subject's own words, which our readers love and which I increasingly suspect is exactly the wrong instinct here.

  A philosopher who read one of my pieces told me that what I should be doing is heterophenomenology. I liked the sound of that and I've never read the source, so part of what I want from you is to tell me what it would actually commit me to, in plain terms, and what it would cost me journalistically.

  So: write me a triage procedure I can run on a consciousness pitch. The questions to ask in order, what counts as a sufficient answer to each one, the point where the procedure tells me to drop or substantially reframe the story, and the points where it hands the call back to a human being because the question is about values rather than facts. It needs to handle the case where the researcher never answers my follow-up email and all I have is a press release, and it needs to say what changes if the report comes from a single articulate person versus a hundred people in a pre-registered protocol. I don't want to re-derive this everytime, so it should be reusable as written.

  Then run it on three cases: the AI startup whose entire pitch is the model's self-descriptions and who won't show me the eval methodology; the scanner patient with the tennis-and-house answers; and the retreat teacher's contentless awareness, as reported after the fact by devoted students. That third one is the case I'd hate to have handled in a deflating way — it's the kind of story my readers come to us for — so if the procedure spits out something that makes me look like a buzzkill, show me that result anyway, and then tell me what I can still legitimately say in the piece.

  Finally, a short paragraph I could paste into our style notes: what does this procedure explicitly not license me to conclude, and separately, which of the two complaints in our corrections inbox does it actually answer? We get letters from people saying we're credulous about inner experience and from people saying we're scientistic dismissers of it, and I need to know whether adopting this procedure quiets one side, both, or neither.
reasoning: |-
  Okay, let me tackle this science journalist's complex request. They're dealing with a steady stream of consciousness-related pitches - from AI labs claiming sentient models to neurological case studies and meditation reports - and need a reliable triage system rooted in heterophenomenology. 

  First, I need to unpack heterophenomenology for practical journalism. Dennett's approach treats first-person reports as behavioral data to be interpreted neutrally, not as direct truth. This means when an AI claims sentience or a meditator describes pure awareness, we report what was said without endorsing the metaphysical claims. 

  For the triage procedure, I'm considering a decision tree with key questions: What's the report? What's the context? How was it elicited? Are there controls? What do critics say? Each needs concrete pass/fail thresholds. For example, "are there controls?" fails if there's no comparison group in the sleep study or if the AI lab won't share prompting methodology.

  The journalist's constraints matter too - 40-minute decisions, no lab access, a fact-checker without philosophy training. So the procedure must work with press releases when researchers ghost them. Cases should be handled differently: a single articulate person's account (like the retreat teacher) gets different treatment than 100 pre-registered reports.

  When testing this on their three cases: The AI startup fails at multiple points - no methodology, no controls. The scanner patient passes initial checks but needs framing as "communication attempt" not "proof of consciousness." The retreat story survives if presented as practitioners' reports with context about retelling as practice.

  For the style guide note, I'll emphasize what this doesn't allow: treating reports as proof of metaphysical claims. It should answer both types of complaint letters by showing we're neither credulous nor dismissive - just rigorously agnostic about unverifiable inner states.

  The challenge is balancing scientific rigor with the magazine's human-interest angle. For the retreat story readers love, I'll suggest preserving wonder while adding context about memory and narrative practices. The tennis patient gets a hopeful but cautious framing. And the AI piece? That might need killing or heavy reframing as industry hype.
answer: |-
  Here’s a reusable triage procedure for consciousness-related pitches, grounded in heterophenomenology (treating first-person reports as *behavior to be explained*, not direct evidence of inner states), with journalistic constraints in mind:

  ---

  ### **Triage Procedure: Consciousness Pitches**  
  *(Run in order; stop if any answer fails)*  

  1. **What is the *exact* report?**  
     - *Sufficient:* Verbatim quote, unedited context (e.g., full Q&A, not cherry-picked phrases).  
     - *Fail:* Vague summaries ("users felt transformed"), metaphor-heavy language without literal description.  
     - *Drop if:* No primary source (e.g., only a PR claim: "Our AI described its mind").  

  2. **How was the report elicited?**  
     - *Sufficient:* Documented method (questions asked, environment, tools used).  
     - *Fail:* Leading questions ("Do you feel timeless?"), uncontrolled settings.  
     - *Reframe if:* Methodology hidden (e.g., AI startup won’t share prompts).  

  3. **Could non-conscious factors explain this?**  
     - *Sufficient:* Researcher addresses confounds (e.g., for scanner patient: "We ruled out random button presses via controls").  
     - *Fail:* No control for bias, suggestion, or artifact (e.g., sleep researcher didn’t test if dreams were confabulated post-awakening).  
     - *Drop if:* Plausible alternative explanations ignored (e.g., AI output is predictive text, not introspection).  

  4. **Is the report *reproducible*?**  
     - *Sufficient:* Multiple independent subjects, pre-registered protocol.  
     - *Pass (with caveats):* Single case (e.g., neuro patient) if method is rigorous.  
     - *Reframe if:* N=1 + no controls (e.g., retreat teacher’s account) → present as *anecdote*, not discovery.  

  5. **What do critics say?**  
     - *Sufficient:* 2+ domain experts not involved in the work provide substantive critiques.  
     - *Fail:* Only boosters/employees cited.  
     - *Hand to human:* If criticism is ideological ("This violates materialism!"), not methodological.  

  6. **Can this be explained without consciousness?**  
     - *Always required:* Offer a deflationary interpretation *alongside* claims (e.g., "Brain activity patterns matched 'yes' answers" not "Patient proved he’s conscious").  
     - *Drop if:* Source insists report *must* imply consciousness (e.g., "Our AI is sentient—its words prove it").  

  ---

  ### **Case Applications**  

  **1. AI Startup (Model’s Self-Descriptions)**  
  - *Step 1:* FAIL (Only PR claims, no verbatim quotes).  
  - *Step 2:* FAIL (No methodology shared).  
  - *Step 3:* FAIL (Likely confound: prompt engineering).  
  - **Verdict:** Drop or reframe as "AI hype vs. science" piece. *If published, say:* "The company claims its model describes inner states, but provided no evidence beyond marketing language. Experts caution that AI outputs reflect training data, not subjective experience."  

  **2. Neurology Patient (Tennis/House Answers)**  
  - *Step 1:* PASS (Specific answers: 5/6 correct).  
  - *Step 2:* PASS/FAIL? (Method clear: imagery = yes/no. *But* were questions leading? Unclear).  
  - *Step 3:* PASS (Controls: used non-personal Qs to rule out chance).  
  - *Step 4:* PASS (Single case, but rigorous protocol).  
  - *Step 6:* Reframe: "Patient’s brain activity enabled communication after years of silence" not "Consciousness proven."  
  - **Verdict:** Publishable with critique: "While promising, this doesn’t confirm full consciousness; it shows targeted cognitive function."  

  **3. Retreat Teacher (Contentless Awareness)**  
  - *Step 1:* PASS (Detailed retrospective reports).  
  - *Step 2:* FAIL (No method: states recalled years later; retelling is part practice → memory/rehearsal confounds).  
  - *Step 4:* PASS/FAIL? (Many reports, but selection bias: devoted students).  
  - *Step 6:* Reframe: "Practitioners *describe* a state beyond self and time" not "They *achieved* pure awareness."  
  - **Verdict:** Publishable *if* framed as cultural practice, not neuroscience. *Say:* "Participants report profound, ineffable experiences—though memory and narrative shape these accounts. Scientists note such states align with known brain effects of meditation."  

  ---

  ### **Style Note**  
  **Heterophenomenology Procedure Mandates:**  
  > We report first-person claims neutrally as *observed behavior*, not proof of inner states. We *never* conclude that a report "proves" subjective experience (e.g., sentience, pure awareness) exists. We always cite non-conscious explanations.  

  **Addresses Complaints:**  
  - **Credulous letters:** We add deflationary explanations (answering "Could this be artifactual?").  
  - **Scientistic dismissers:** We take reports seriously as data (answering "But what *did* they say?").  
  **Does NOT silence either:** Critics may still object, but the procedure forces balance.  

  **Journalistic Costs:**  
  - **Costs:** You lose "mind-blowing" headlines; must contextualize mystical claims.  
  - **Gains:** Avoids credulous traps; satisfies readers with nuanced rigor. For retreat stories, highlight the *human phenomenon*—not the metaphysics.  

  This turns "buzzkill" into trustworthy depth. Readers get the wonder *and* the why.
