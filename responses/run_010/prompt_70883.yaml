answer: |-
  ### Translation into Dependent Type Theory with Martin-Löf Meaning Explanations

  #### **1. Ramsey–de Finetti View (Subjective Bayesianism)**
  - **Core tenets**: Probability as coherent degrees of belief; exchangeability as reducible to mixtures of i.i.d. distributions.
  - **Translation**:
    - **Degrees of belief**: A probability judgement is a hypothetical judgement of the form:  
      `Γ ⊢ P : Prob(A)`, where:
      - `Γ` is a context of prior judgements (beliefs, evidence).
      - `Prob(A)` is a type of "degrees of belief" for proposition `A`.
      - Canonical elements of `Prob(A)` are **rational numbers** `r ∈ [0,1]` (or computable reals), constructed via betting dispositions:  
        `r` is canonical if there exists a *coherent betting strategy* accepting `r` as fair odds for `A`.
    - **Coherence**: Defined through Dutch book avoidance. For any finite set of bets, the net loss in all possible worlds must be non-negative:  
      `Γ ⊢ coherent(P) :≡ ∏_{worlds} (net_loss ≥ 0)`.  
      Coherence is a proof object inhabiting the type `is_coherent(P)`.
    - **Exchangeability**: For a sequence of judgements `A₁, A₂, ..., Aₙ`, exchangeability is a proof that for any permutation `σ`,  
      `Γ ⊢ eq_prob : P(A₁, A₂, ..., Aₙ) ≡ P(A_{σ(1)}, A_{σ(2)}, ..., A_{σ(n)})`.  
      The mixture representation is a *derived theorem*:  
      `Γ ⊢ mixture : ∃ (μ : Measure) s.t. P ≈ ∫ i.i.d.(θ) dμ(θ)`.

  - **Residue**: 
    - Translates well for **finite coherence** (finite additivity). 
    - **Weakness**: 
      - Actual infinite mixtures rely on classical existence axioms (non-constructive). 
      - "Possible worlds" are hypothetical judgements, not primitive entities.

  #### **2. von Mises View (Frequentism with Collectives)**
  - **Core tenets**: Probability as limiting frequency in a collective; invariance under admissible place selections.
  - **Translation**:
    - **Collective**: A coinductively defined sequence `s : Stream(Outcome)` where:
      - `Outcome` is a finite type (e.g., `{0,1}`).
      - Canonical elements satisfy:
        1. **Limiting frequency exists**:  
           `Γ ⊢ lim_freq(s, a) :≡ lim_{n→∞} (Σ_{i=1}^n [s_i = a]) / n = p_a`.
        2. **Invariance under place selections**:  
           For any computable place selection `φ` (a function `φ : Prefix → Bool`), the subsequence `s_φ` satisfies:  
           `Γ ⊢ invariant(s) :≡ ∏_φ (lim_freq(s_φ, a) = lim_freq(s, a))`.
    - **Probability judgement**: `Γ ⊢ p : Prob(a | s) = lim_freq(s, a)`.
    - **Martin-Löf randomness**: A collective is a sequence passing all effective statistical tests:  
      `Γ ⊢ random(s) :≡ ∏_{e:ML_test} (s ∉ null_set_e)`.  
      This replaces von Mises' "admissible place selection" with a rigorous constructivist analogue.

  - **Residue**:
    - **Translates well**: 
      - Limiting frequency as a computable real (via constructive limits). 
      - Martin-Löf randomness subsumes place-selection invariance.
    - **Weakness**: 
      - Actual infinite sequences (`Stream`) rely on coinduction, which is intensional (behavioral equivalence). 
      - Non-existence of "arbitrary" place selections: only computable ones are definable.
    - **No expression**: 
      - Von Mises' "irregularity" is captured only by effective tests; non-algorithmic selections are inexpressible.

  #### **3. Propensity View (Objective Single-Case Chance)**
  - **Core tenets**: Probability as a dispositional property of a repeatable arrangement; manifests as long-run frequency.
  - **Translation**:
    - **Propensity as a type**:  
      For a repeatable arrangement `R` producing outcomes `A`,  
      `Γ ⊢ Chance(R, A) : type`.  
      Canonical elements are **functions** `f : (R → Outcome) → [0,1]` satisfying probability axioms.
    - **Judgement of chance**:  
      `Γ ⊢ c : Canonical(Chance(R, A))` iff `c` is constructed from symmetries, physical laws, or frequencies of `R`'s instances.
    - **Connection to frequency**:  
      For infinite repetitions `S : Stream(R)`,  
      `Γ ⊢ manifest(c) :≡ (lim_freq(S, a) = c(a))` must hold for a Martin-Löf random `S`.

  - **Residue**:
    - **Translates well for repeatable arrangements**: 
      - Chance is a type derived from experimental setups.
    - **Weakness**: 
      - Single-case chance requires `R` to be repeatable; truly unique cases lack a translation. 
      - The "dispositional" aspect is encoded in the function `f`, but its ontological basis is lost.
    - **No expression**: 
      - Propensities as irreducible metaphysical entities (e.g., Popper's "indeterminism") have no analogue.

  ---

  ### Residue Report: What Survives, What Falters, What Vanishes

  | **Aspect**                     | **Ramsey–de Finetti**       | **von Mises**               | **Propensity**              |
  |-------------------------------|-----------------------------|----------------------------|----------------------------|
  | **Core concept**              | Coherent belief (✓)        | Collective (✓)             | Disposition (△)            |
  | **Infinite limits**           | Weak: non-constructive mixtures | △: Coinductive streams     | △: Requires infinite streams |
  | **Objectivity**               | Belief-dependent (✓)       | Sequence-dependent (✓)     | △: Requires repeatability  |
  | **Single-case probability**   | ✓ (as belief)              | ✗ (only sequences)         | △ (only for repeatables)   |
  | **Exchangeability**           | ✓ (as judgemental equality)| Not applicable             | Not applicable             |
  | **Canonical "chance" type?**  | No: `Prob` is belief-based | No: `Prob` is frequency    | ✓: `Chance(R, A)` exists   |
  | **Actual infinity**           | Weak (classical mixtures)  | △ (coinductive streams)    | △ (requires streams)       |

  - **Key residues**:
    1. **Actual infinity**: All views require infinite limits. DTT handles this via coinduction (behavioral specifications), but cannot construct actual infinities. This weakens frequentism/propensity.
    2. **Non-repeatable propensities**: Truly unique single-case chances (e.g., a coin melted after one toss) vanish. DTT only judges repeatable arrangements.
    3. **Metaphysical commitments**: Propensity's "causal powers" and von Mises' "irregular collectives" reduce to testable judgements (randomness, frequency stability).

  ---

  ### Assessment of Your Working Hypothesis

  **Your hypothesis**:  
  > *The residue marks not a poverty of the framework but a failure of determinacy on the other side. Treating probability as judgement dissolves the frequentist–propensity dispute.*

  **Assessment**:  
  - **Supported**:  
    - In DTT, **all probability statements are judgements**:
      - Bayesian: Judgements about coherence.
      - Frequentist: Judgements about limits in streams.
      - Propensity: Judgements about repeatable setups.
    - The **frequentist–propensity dispute** (e.g., "Is probability in the world or in the sequence?") becomes a distinction without a difference:
      - `Chance(R, A)` is defined only for repeatable `R`, making it equivalent to limiting frequency in Martin-Löf random streams.  
      - Both reduce to *testable predictions*:  
        `Γ ⊢ (c : Chance(R, A)) → (random(S) → lim_freq(S, a) = c(a))`.
    - **Indeterminacy exposed**:  
      - Non-repeatable propensities and non-random sequences are *judgementally indeterminate*—they lack verification conditions.  
      - Von Mises' "admissible place selections" and propensity's "causal powers" are unified as *effective testability* (Martin-Löf randomness).

  - **Limitations of DTT**:  
    - **Cannot express**:  
      - Classical actual infinity (e.g., completed infinite sequences).  
      - Metaphysical chance (e.g., "This *particular* radium atom has a chance 0.5 to decay").  
    - **Weakens**:  
      - Exchangeability (representation theorem becomes non-constructive).  
      - Propensity's ontology (reduced to functional assignments).

  - **Conclusion**:  
    Your hypothesis is correct: **The framework dissolves the dispute by rendering untestable claims judgementally meaningless**. What remains is a unified account:  
    - *Probability is a judgement about evidence* (Bayesian), *sequences* (frequentist), or *repeatable setups* (propensity), all answerable to effective computation (Martin-Löf randomness).  
    - The residues mark boundaries of empirical determinacy, not deficiencies in DTT. Where the views demand more (e.g., actual infinities, non-repeatable chance), they exceed the bounds of verifiable judgement.
