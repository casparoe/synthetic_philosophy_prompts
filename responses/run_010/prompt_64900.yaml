prompt: |-
  I'm building a session on escalation of commitment for a law-and-econ reading group and I want to use Apple v. Samsung as the running case — but through the dollar auction specifically, not the vague sunk-cost-fallacy talk everyone defaults to. Here are the facts as I have them so you don't have to trust your memory of the numbers: Apple sued in spring 2011, and by late that year the two were litigating something like twenty cases in ten countries. The first San Jose jury in 2012 handed Apple $1.049 billion; that got trimmed and partly retried over the next couple of years. The chunk that ended up mattering was about $399 million in design-patent damages, which Samsung took all the way to the Supreme Court and won a remand on in December 2016 — and then at the 2018 retrial the jury gave Apple $539 million, more than the amount that had just been thrown out. They settled that summer, roughly seven years in, with each side's legal bills reported in the hundreds of millions.

  So first, map it. Who exactly is the bidder at each stage — the company, the general counsel, outside counsel, the board, and are those even the same decision maker? What is the pot, what counts as one bid increment, and where were the points at which a player could have folded and what would folding have cost them in precedent and in standing thier own executives had built up internally? I keep coming back to the fact that under the American rule each side eats its own fees win or lose, which is the one structural feature that makes the analogy look right at all — bids are sunk whether or not you take the prize. Push on that: is it the dollar auction, or is it a war of attrition with a negotiable pot, and what turns on which?

  Then tell me what the model genuinely explains. My hunch is the Supreme Court trip over an issue worth less than the cost of litigating it, and the 2018 retrial handing Apple a bigger number than the one just vacated, are the best fits — spending more to avoid losing a smaller pot is the $1.05 bid for the dollar almost exactly. And then be honest about where it doesn't reach: settlement is available at every stage in a way it never is in Shubik's game, the fees bought discovery and bargaining information rather than being pure waste, and both companies got enormously more valuable over those seven years, which makes it hard to score who "lost." Which of those are fatal to the analogy and which are just awkward?

  Here's the wrinkle I want you to engage with directly rather than politely wave at. Call it the expressive dollar auction: the pot isn't fixed, its value to a bidder rises with what you've already sunk into it, because past some point what's being bought isn't $399 million anymore, it's the verdict that you were right all along. There's the well-known report that Jobs told his biographer he was prepared to burn through Apple's entire cash reserve to destroy Android because he believed it was built on stolen ideas — which sounds like the pot was never money to begin with. Does adding that variable rescue the model or empty it out? If you can always say the prize grew to match the spending, is there any episode the theory could fail to fit, and what would a real defeater look like?

  I'd rather have the places the dollar auction stays silent than a forced fit. And end by telling me which direction the case actually runs: does Apple v. Samsung confirm the model, or expose something it never anticipated — two players for whom the pot is trivially small relative to their balance sheets, which may be exactly why the classic paradox never got a chance to bite.
reasoning: |-
  Okay, the user is building a session on escalation of commitment for a law-and-econ reading group and wants to use Apple v. Samsung as a case study through the lens of the dollar auction model. They've provided detailed facts about the litigation history and are seeking a rigorous application of the model beyond typical sunk-cost fallacy discussions.

  First, I need to map the dollar auction structure onto this case. The core elements are bidders, bidding increments, and the pot. For bidders, the decision-makers likely shifted over time - from initial litigation teams to boards/executives as stakes rose. The pot starts as $399M in design-patent damages but potentially transforms into symbolic victory. Bidding increments would be litigation costs at each stage (discovery, appeals, etc.), with folding points after each ruling.

  The American Rule is crucial here - since each side pays its own costs regardless of outcome, every dollar spent truly is sunk, mirroring the dollar auction's core mechanic. This distinguishes it from British Rule systems where costs are recoverable.

  The model best explains two key moments: Samsung's Supreme Court appeal over an issue likely costing more than its value, and the 2018 retrial where Apple won more than the vacated amount. Both show players spending to avoid losing prior investments. However, the analogy has limitations: settlement was always possible (unlike in Shubik's game), legal spending produced information gains, and both companies grew enormously during the litigation.

  The user raises a profound wrinkle about the "expressive dollar auction" - how the pot's perceived value may inflate with sunk costs. Jobs' reported willingness to "go thermonuclear" suggests the pot transformed from monetary damages to validation of principles. This rescues the model by explaining otherwise irrational bids, but risks making it unfalsifiable. A real defeater would be if parties abruptly folded despite high sunk costs when new information revealed the pot's objective worthlessness.

  Ultimately, this case runs in an interesting direction: it confirms how the escalation mechanism can persist even when absolute sums are trivial to balance sheets, because the expressive pot dominates. But it also exposes that when both players view the pot expressively, we get mutual escalation rather than winner's remorse - a dynamic Shubik didn't anticipate. The paradox didn't "bite" because neither side perceived themselves as losing; Samsung traded dollars for precedent, Apple for validation.
answer: |-
  Here's a rigorous mapping of Apple v. Samsung onto the Dollar Auction model, embracing its strengths, confronting its limitations, and tackling the "expressive pot" wrinkle head-on:

  **Mapping the Dollar Auction:**

  1.  **The Bidders:** Decision-making evolved dynamically:
      *   *Initial Litigation (2011-2012):* Outside counsel (strategic advice) + General Counsel (tactical/operational) + Product/Business Unit leads (damage assessment). GC likely had authority within budget constraints.
      *   *Post-$1B Verdict & Appeals (2012-2016):* Board/Executive Committee involvement intensifies. The sheer scale, precedent risk, and strategic importance demand C-suite/Board approval for major appeals and settlement decisions. Outside counsel's influence peaks (complex legal arguments).
      *   *Supreme Court & Final Retrial/Settlement (2016-2018):* CEO/Board level dominates. The stakes are now profoundly strategic and reputational. Outside counsel executes, but high-level strategy is set by the top.

  2.  **The Pot:** Starts as the **$399 million design-patent damages award** (the "dollar"). Crucially, **precedent value** is attached – establishing/defending the scope of design patent protection in the smartphone era. This precedent value is subjective and potentially asymmetric.

  3.  **Bidding Increments:** **Cumulative legal fees and internal resource costs** at each major litigation stage. Each new motion, appeal, retrial preparation represents a bid.
      *   *Key Increments:* Initial trial prep (~$10s millions?), Appeal to CAFC ($10s millions?), Petitioning SCOTUS ($Millions?), SCOTUS briefing/argument ($Millions?), 2018 Retrial Prep/Trial ($10s millions?).

  4.  **Folding Points & Costs of Folding:** Folding = **Settlement or Accepting an Adverse Ruling Without Further Appeal**.
      *   *Samsung Folding Points/Costs:*
          *   After 2012 Verdict: Pay ~$1B (+ fees). Cost: Massive financial hit, precedent set against them, internal "loss" narrative.
          *   After CAFC Trimming/Remand: Pay reduced amount (pre-$399M focus). Cost: Still significant payout, precedent partially set, sunk fees wasted without definitive "win".
          *   After SCOTUS Remand (2016): *Could have settled based on pre-2012 verdict amount.* Cost: Sunk fees wasted, precedent ambiguity remains, internal perception of "losing" after SCOTUS win.
      *   *Apple Folding Points/Costs:*
          *   Accept Samsung's post-CAFC settlement offers (likely below $399M). Cost: Less than "full" victory, precedent potentially weakened, sunk fees wasted, betrayal of Jobs' mandate internally.
          *   After SCOTUS Loss on Damages Standard: Settle for less than $399M. Cost: Explicit admission of reduced award after fighting so long, significant sunk fees wasted, internal perception of strategic loss.
          *   After 2018 Retrial ($539M): *They settled shortly after.* Folding here would have meant risking reversal on appeal again.

  5.  **The American Rule as Core Mechanic:** This is **essential** for the analogy. Every dollar spent on legal fees is **irretrievably sunk**, regardless of outcome – exactly like bids in Shubik's auction. Winning only recovers the *award*, not the costs of obtaining it. This creates the trap: past investments create pressure to continue bidding (appealing) to avoid losing those sunk costs *and* the pot.

  **What the Dollar Auction Model Genuinely Explains:**

  1.  **Samsung's SCOTUS Gamble (The $1.05 for $1.00 Moment):** Litigating a *damages calculation standard* issue to SCOTUS undoubtedly cost far more than the *immediate* value of correcting the $399M award's *calculation method* (not even guaranteeing reduction). The bid (SCOTUS costs) was likely > the objective value of correcting the specific error on remand. They bid to avoid losing the sunk costs invested in fighting the *entire* $399M award up to that point *and* to potentially set a favorable precedent limiting future damages. This is the purest escalation trap.
  2.  **The 2018 Retrial Outcome (Bidding Past the Vacated Pot):** The jury awarded *more* ($539M) than the vacated $399M pot Apple was fighting to preserve. From a purely rational economic standpoint focused *only* on that $399M pot, Apple's additional investment in the retrial achieved an outcome exceeding the original target, but only by incurring massive new sunk costs. They bid high to *win back* the pot they had already invested so much in defending, and the jury delivered an even bigger (though likely economically irrational) "win."
  3.  **Persistence Despite Diminishing Marginal Returns:** The model captures why both sides kept investing heavily long after the objective economic rationale (maximizing net gain on the $399M) became highly questionable. The sunk costs and fear of "losing" the prior investments became dominant drivers.

  **Where the Model Strains or Falls Short (Not Necessarily Fatal, But Important Context):**

  1.  **Settlement Valve (Major Deviation):** This is the **most significant limitation**. Shubik's auction has no off-ramp. Litigation does. Parties *could* have settled at any point, splitting the pot and saving fees. The model *explains why they didn't* (escalation trap, asymmetric valuation of precedent/reputation), but the *existence* of settlement fundamentally changes the strategic landscape, making it a war of attrition *with negotiation* rather than a pure dollar auction. **Not fatal, but awkward and crucial context.** It highlights that irrational escalation *persisted despite* a rational alternative being available.
  2.  **Information Value of Fees:** Legal spending buys discovery, clarifies legal positions, tests witness credibility, and reveals opponent resolve – valuable information for settlement *or* trial. This isn't pure waste; it's partly investment in information. **Awkward for the model** (which assumes bids are pure cost), but not fatal – the escalation dynamic is still driven by sunk costs and the desire to monetize that information via a win.
  3.  **Rising Tides Lift All Boats:** Both companies grew massively (2011-2018). The absolute $ amounts, while staggering, became a smaller percentage of their war chests. This makes "loss" harder to define. Samsung "lost" the final payment but secured a crucial precedent limiting design patent damages. Apple "won" a large payment and symbolic validation. **Weakens the "ruinous loss" aspect** of the classic paradox but doesn't negate the escalation *process*. It highlights that for giants, the *expressive* value can dominate.
  4.  **Asymmetric Valuation of the Pot:** Precedent value was likely higher for Apple (defending its innovation narrative) than Samsung (limiting a specific damages theory). This asymmetry fuels escalation where symmetry might lead to earlier settlement. **Model accommodates this** (different valuations are allowed).

  **The Expressive Dollar Auction Wrinkle: Rescuer or Destroyer?**

  *   **The Insight:** Jobs' "thermonuclear" statement reveals the core truth: **The pot was never *just* $399 million.** From the start, especially for Apple, a significant component was **vindication** ("we were right"), **deterrence** ("don't copy us"), and **identity** ("we are innovators, not thieves"). Samsung's core motivation evolved into **limiting precedent** ("design patents can't be the entire phone profit") and **avoiding total capitulation**.
  *   **Does it Rescue the Model?** **Yes, critically.** It explains why rational actors would bid far beyond the nominal pot's value. The *perceived* value of the pot *increases* with sunk costs because:
      *   **Cognitive Dissonance:** Admitting defeat after massive investment is psychologically painful. Winning justifies the past expenditure ("See? It was worth it!").
      *   **Reputational Sunk Costs:** Executives/GCs build internal credibility on this fight. Folding risks being labeled a "quitter" or poor steward. Winning validates their judgment and strategy.
      *   **Principle Becomes Priceless:** The fight *itself* becomes a matter of core identity or industry-shaping principle. The money is secondary to the statement.
  *   **Does it Empty the Model? Risk of Unfalsifiability:** There's a risk. If we can *always* redefine the pot's value post-hoc to match the spending ("Oh, it was *really* about principle X, worth billions!"), the model explains everything and nothing. It loses predictive power.
  *   **The Real Defeater:** A **real defeater** would be a case where a party **abruptly folds *after* massive sunk costs *without* a significant change in objective circumstances (new damaging evidence, financial catastrophe) *and* where no plausible expressive value (vindication, precedent, reputation) can be assigned to the pot.** If they simply say, "We spent $200M fighting for this $100M, but we realize now it's not worth *anything* beyond the money, so we quit," and this aligns with objective analysis, the expressive model fails. This is rare because expressive value is usually constructed *during* the conflict. Apple/Samsung is the *opposite* – the expressive value was primary from near the start.

  **Conclusion: Direction of the Case - Confirmation with a Twist**

  Apple v. Samsung **confirms the core escalation dynamic of the dollar auction model**, particularly through Samsung's SCOTUS bid and Apple's retrial result exceeding the vacated award. The American Rule provides the essential sunk-cost mechanic. The "expressive pot" variation is **necessary and valid** to explain the irrational persistence relative to the nominal damages.

  However, it **exposes crucial adaptations the basic model never anticipated:**

  1.  **The Giants' Paradox:** The classic model assumes ruinous losses. Here, the players were so large that the *absolute* costs, while enormous, were not existential. **This lack of financial catastrophe is precisely *why* the expressive auction could run its full course.** The paradox "bit" in terms of net economic loss relative to early settlement, but not in terms of corporate survival. The model needs scaling for player size relative to stakes.
  2.  **Mutual Escalation with Expressive Pots:** When *both* players derive significant expressive value (Apple: vindication/deterrence; Samsung: precedent limitation/avoiding capitulation), you get mutual, sustained escalation rather than one player eventually cutting losses due to the winner's curse. The "loss" is more mutual economic waste than one winner and one ruined loser.
  3.  **Settlement as the Unused Escape Hatch:** The constant, unrealized potential for settlement is the starkest deviation, highlighting that the escalation was a *choice* driven by expressive values and internal dynamics, not an inescapable game mechanic.

  **For Your Session:** Focus on the SCOTUS bid and the 2018 retrial as pure escalation trap moments. Use the Jobs quote early to frame the expressive pot. Acknowledge settlement's availability but emphasize how sunk costs and expressive values overrode it. Conclude that the case shows the dollar auction *logic* is powerful, but its *outcome* (mutual waste without ruin) is a twist enabled by vast resources and an expressive pot that grew to justify the spending. The model explains *how* they got locked in; the scale and expressiveness explain *why* they didn't mind (as much) staying locked in.
