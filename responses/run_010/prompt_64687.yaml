prompt: |-
  I cover research integrity and the sociology of science for a general-interest magazine, which means a disproportionate share of my stories begin with one frightened person: a postdoc, a lab manager, a departed co-author, a technician who will speak only on the condition that nothing identifying appears in print. Corroboration usually exists but is unpublishable — a spreadsheet someone photographed and then deleted, a colleague who confirms the atmosphere but not the act. My editor now wants a written protocol for deciding when a single anonymous source is enough to run an allegation, because at present the decision is made by whoever sounds most confident in a hallway. I have been reading Nozick's tracking account of knowledge, and it struck me that the newsroom question is close to a literal instance of it: what I want to know is whether the source's report counterfactually tracks the facts — whether they would have produced this report had the allegation been false, and whether they would have found and surfaced it had it been true but shaped differently than they suppose. I would like you to build the protocol on that foundation rather than on the usual journalism-school vocabulary of reliability and credibility, which I find does no real work.

  The deliverable should be a sequence of questions a reporter can actually ask in order, with a statement of what counts as a sufficient answer at each step, the points at which the procedure terminates in "we do not run this," and the points at which it stops being about truth and hands the decision to an editor because the live issue is harm to identifiable people or our own institutional interest. Two features of the tracking framework need explicit handling. First, method: I take the lesson of Nozick's grandmother case — her belief that the child is well looks insensitive, since she would have been lied to had he been unwell, until you pin down the route by which she forms it — to be that sensitivity is only evaluable relative to a specified method of belief-formation, and my sources are frequently unable or unwilling to specify theirs; they "know from the lab," or "everyone knew," or "you could see it in the raw files." Tell me how to pin the route, what to do when the source cannot, and whether an unpinnable route is automatically disqualifying or merely costly. Second, closure: tracking theories give up closure under known entailment, and I have watched that pattern play out badly in practice, where a reporter is confident about the narrow act and then writes confident sentences about what the senior author knew, what the institution tolerated, and what should happen to the paper. I want the protocol to state precisely which inferences I may carry forward from a sensitively-held allegation and which must be re-earned separately, and to justify the line rather than merely assert it.

  Some constraints on the ground: I typically have forty-eight hours between a source going on the record and an editor needing a recommendation; I cannot disclose to a source what we intend to publish or what we have verified elsewhere; nothing in the protocol may require a document I can legally print, though it may require documents to exist; and legal review is mandatory before publication but sits outside my discretion. There is also a rule of thumb currently circulating on my desk that I want tested rather than inherited: if being wrong would cost the source their job, their funding, or their visa, we treat their report as tracking, on the theory that high stakes buy honesty. My suspicion is that this inverts the actual analysis, and that exposure is what makes a report sensitive to the source's own interests rather than to the world; I would like the protocol to either dismantle it or defend it, and to say which of the two it is doing. Then please run the procedure end to end on three cases: a postdoc alleging duplicated images in a celebrated paper who volunteers that they were competing with the accused lab for the same grant; a lab manager reporting that a prominent investigator repeatedly ran studies without required approvals, corroborated by two colleagues who will confirm only under an anonymity we cannot characterize in print; and a source I have used twice before and who was right both times, now alleging something that would upend a subfield, offering no documents and declining to say how they came to know. For the third I expect the procedure to tell me to stand down, and I want it to say so in terms I can hand to an editor without embarrassment rather than hedging into a maybe. Close by stating what the protocol cannot do: the cases where it will misfire, the ways a determined fabricator or a self-deceived whistleblower defeats it, and which of its steps are judgment calls wearing procedural clothing. I am not looking for references or further reading — I need something I can run on Tuesday.
reasoning: |-
  We are building a protocol for deciding when a single anonymous source is enough to run an allegation, based on Nozick's tracking account of knowledge. The core idea is to assess whether the source's report counterfactually tracks the facts. We must also handle two features: method (how the source formed their belief) and closure (what inferences we can draw from the report).

  The protocol will be a sequence of questions. We must consider:
  - Time constraint: 48 hours.
  - Cannot disclose intended publication or other verification to the source.
  - Does not require documents we can print, but may require documents to exist.
  - Legal review is mandatory but external.
  - We must test the rule of thumb: high stakes (job, funding, visa) buy honesty? We suspect this may invert the analysis.

  The protocol should:
  1. Pin down the method of belief formation (how the source knows). If they cannot specify, we must decide if that is disqualifying or merely costly.
  2. Handle closure: state precisely which inferences we may carry forward and which must be re-earned.
  3. Have clear termination points (stop if not met) and points where we hand off to the editor (when the issue becomes harm or institutional interest).
  4. Include a statement of what counts as a sufficient answer at each step.

  We will then run the protocol on three cases.

  Structure of the protocol:

  I. Preliminary Assessment: Is this allegation within our remit? (Research integrity/sociology of science) and is the source in a position to know? (We can ask: "What was your role in relation to the events?")
     - If not, terminate: "We do not run this."

  II. Method Assessment: We must establish the method by which the source formed their belief. We need to evaluate the sensitivity of the belief (would they have believed it even if it were false?) and adherence (would they have known if it were true but different?).

     Steps:
     A. Ask: "How did you come to know this? Please describe the specific events, observations, or documents that led to your belief."
        - We are looking for a route that can be evaluated for sensitivity and adherence.
        - If the source cannot specify (e.g., "everyone knew", "from the lab"), we then ask: "Can you recall a particular incident or piece of evidence that first convinced you? Or a pattern you observed? Please be as specific as possible."
        - If they still cannot, we note that the route is unpinnable. We do not automatically disqualify, but it becomes a major cost. We then rely more heavily on other steps (like corroboration and stakes) and may require more from the next steps.

     B. Assess the sensitivity of the method: We want to know if the method would have produced the same report even if the allegation were false.
        - We ask: "If the allegation were false, would you still have come to believe it? Why or why not?"
          - We are looking for reasons why the method would not have led to the same belief in the counterfactual false scenario.
          - Example: If the source saw a document, then if the document didn't exist (because the event didn't happen) they wouldn't have seen it. That method is sensitive.
          - But if the source says they heard it from a colleague, we must then ask: "Would that colleague have told you this even if it were false?" and so on.

        However, note: we cannot always ask the source directly about counterfactuals because they may not be able to answer reliably. Instead, we can reconstruct the counterfactual from the method.

        So, we break down the method and ask about the steps:

          - If the method involves direct observation (e.g., "I saw the PI run the experiment without approval on Tuesday"), then in the counterfactual where the PI did get approval, the source wouldn't have seen that. So it's sensitive.

          - If the method is second-hand, we need to assess the chain. We ask: "How did the person who told you know? And would they have said the same thing if it were false?" This may be recursive.

        We must also consider the possibility of a method that is insensitive. For example, if the source says they believe it because they dislike the accused, then even if it were false they might still believe it.

        Sufficient answer: The method must be such that we can construct a plausible case that it is sensitive (i.e., if the event had not occurred, the source would not have formed the belief via this method). If we cannot, then we must either terminate or note that we are proceeding with a high risk and require stronger evidence elsewhere.

     C. Assess the adherence of the method: We want to know if the method would have detected the event even if it were true but different (e.g., in a different form or at a different time). This is about whether the method is robust to variations.

        - We ask: "If the event had happened in a slightly different way (for example, at a different time or with a different person), would you still have come to know about it via this method?"

          - Example: If the source observed one instance of an unapproved study, but there were many others that they did not observe, then the method might not be adherent for the broader pattern. However, for the specific instance they observed, it is adherent.

        We are often interested in a pattern, not just one instance. So we must be cautious.

        Sufficient answer: The method must be adherent for the claim we are making. If the source only observed one instance, we can only report that one instance unless we have evidence of a pattern from other sources.

        Note: We may have to adjust the scope of the allegation to match what the method covers.

     D. If the method is unpinnable (the source cannot specify how they know), we cannot directly assess sensitivity and adherence. Then we must rely on:
          - Corroboration (even if unpublishable, we can use it to increase confidence)
          - The source's track record (if any)
          - The stakes for the source (but note: we are testing the rule of thumb)

        However, without a method, we cannot evaluate tracking. Therefore, an unpinnable route is not automatically disqualifying, but it means we must have strong evidence from other steps. We will require independent corroboration that we can verify (even if not publishable) and a high-stakes situation might be considered as a factor (but note our suspicion about stakes).

  III. Stakes Assessment: We must evaluate the rule of thumb that high stakes (job, funding, visa) buy honesty.

     - We suspect that high stakes might make the report sensitive to the source's interests rather than to the truth. So we ask: "What are the consequences for you if you are found to be the source of this allegation? What if you are wrong?"

     - The idea: If the source has high stakes (risk of losing job, etc.), then they might be more careful (so more likely to be honest) OR they might be motivated by malice (so less likely to be honest). We must disentangle.

     - We can consider:
          - If the source has a lot to lose by being wrong, and they are still speaking, that might indicate they are confident and honest. But note: they might be reckless or malicious.
          - Alternatively, if they have nothing to lose, they might be careless.

     - We propose: High stakes do not automatically establish tracking. Instead, we must look for signs that the source is acting against their own interests to tell the truth. We ask: "What do you stand to gain or lose by coming forward?" and "Is there any reason someone might think you have an ulterior motive?"

     - We then assess: 
          - If the source has a clear personal gain (e.g., they are competing with the accused) then that might undercut the sensitivity (they would have made the report even if false) and we must be cautious.
          - If the source has much to lose and no apparent gain, that might support honesty. But note: they might be mistaken.

     - We will not use stakes as a substitute for tracking. Instead, we use stakes to assess the reliability of the source's method. If the method is shaky and the stakes are high, the source might be taking a big risk on a weak belief, which is a red flag. If the method is solid and the stakes are high, that might be consistent.

     - Therefore, the rule of thumb is inverted: high stakes do not buy honesty. Instead, they might indicate that the source is either very confident (if they have a good method) or reckless (if they don't). We must rely on the method first.

     - We will dismantle the rule of thumb: We do not treat high stakes as buying honesty. Instead, we note that high stakes require us to be more cautious because the source might be acting under pressure that distorts their judgment.

  IV. Corroboration: We ask about any supporting evidence, even if unpublishable.

     - We ask: "Is there any way to independently verify what you are telling me? For example, documents, other witnesses, or physical evidence? Even if I cannot publish it, I need to know for my assessment."

     - We then attempt to verify without burning the source. We might:
          - Check for documents (if the source says they exist, we ask for a description or a way we might find them without the source).
          - Contact other sources (if they are anonymous, we cannot characterize them, but we can note that multiple sources confirm).

     - Sufficient answer: We require at least one independent piece of evidence that we can verify (even if we cannot publish it) OR multiple independent sources. If the method is strong (sensitive and adherent) we might require less. If the method is weak, we require more.

  V. Scope of the Allegation and Closure:

     - We must state what we can report based on the tracking of the source's belief.

     - We can report the specific event that the source's method covers. We cannot automatically extend to broader implications without separate tracking.

     - Example: If the source saw one instance of an unapproved study, we can report that instance. We cannot report that the PI "routinely" does this unless we have multiple instances or a pattern from other sources.

     - For inferences about what the senior author knew: We must have a separate source or evidence for that. We cannot infer from the act to the knowledge unless we have a method that tracks that knowledge (e.g., a document or a direct admission).

     - So the protocol: We may carry forward only what is directly covered by the source's method (and any corroboration). Any broader claim must be supported by its own tracking assessment.

     - We ask: "Does your method cover only the specific event you describe, or does it also cover the broader context (like whether this was part of a pattern, or whether the senior author knew)?"

          - If they say it covers more, we then assess the method for that broader claim (using the same sensitivity and adherence questions).

  VI. Termination and Handoff:

     - Termination points (we do not run this):
          - If the allegation is outside our remit.
          - If we cannot establish that the source is in a position to know (step I fails).
          - If the method is unpinnable and we have no independent corroboration (step II.D fails).
          - If the method is not sensitive (step II.B fails) and we have no corroboration that fixes the issue.
          - If we cannot get any independent verification (step IV fails) and the method is not strong.

     - Handoff to editor (when the issue is harm to identifiable people or institutional interest):
          - After we have established that the tracking conditions are met (so we believe the allegation is true) but we must consider:
              - The potential harm to the accused (even if true, we might not run it if the harm is disproportionate or if there are other overriding concerns).
              - The potential harm to our institution (e.g., legal risk, backlash).
          - We do not decide on these grounds; we hand off. The protocol will say: "Once the truth-tracking assessment is complete and positive, the reporter must hand the decision to the editor to weigh the potential harms and institutional interests."

  VII. Track Record: If the source has been reliable in the past, does that help?

     - We note: Track record is about past sensitivity and adherence. It can be a factor, but it does not replace assessing the current method.

     - We ask: "Has this source provided accurate information in the past? How many times? On what topics?" But we must still assess the current claim.

     - However, if the current method is unpinnable and we have no corroboration, then track record might be the only thing we have. In that case, we must be cautious. We might require the current claim to be of a similar kind to past ones (so the method is likely the same) and then we can use past tracking as a proxy.

     - But note: if the current claim is very different (e.g., more serious, in a different context), then past track record is less relevant.

  VIII. The Protocol Steps in Order:

     Step 1: Position and Remit
        - Question: "What was your role in relation to the events you are reporting? And how does this allegation relate to research integrity or the sociology of science?"
        - Sufficient answer: The source must have been in a position to observe or know about the event (e.g., they were present, had access to documents, or were told by someone who was). The event must be within our coverage area.
        - If not: Terminate.

     Step 2: Method Specification
        - Question: "How did you come to know this? Please describe the specific events, observations, or documents that led to your belief. If you cannot recall a specific instance, can you describe the pattern or the circumstances that convinced you?"
        - If the source cannot specify, note: "Method unpinnable." Then proceed to Step 5 for corroboration and Step 6 for stakes, but note that without a method the burden on corroboration is higher.

     Step 3: Sensitivity Assessment
        - Question: "Let me try to understand: if the event had not happened, would you still have come to believe it? For example, if the duplicated images did not exist, would you have still thought they did? Why or why not?"
          Alternatively, we reconstruct: based on the method, would the source have formed the same belief in the counterfactual where the event did not occur?
        - Sufficient answer: We must be able to conclude that the method would not have produced the same belief if the event were false. If the method is insensitive, terminate unless there is strong corroboration (Step 5) that compensates.

     Step 4: Adherence Assessment
        - Question: "If the event had happened in a slightly different way (e.g., at a different time, or with a different person), would you still have come to know about it via this method? For example, if the PI had run an unapproved study but on a different day, would you have known?"
        - Sufficient answer: We must be able to conclude that the method would have detected the event even if it varied in ways that don't change the core allegation. If not, we must narrow the allegation to what the method covers.

     Step 5: Corroboration
        - Question: "Is there any way to independently verify what you are saying? For example, are there documents, other witnesses, or physical evidence? Even if we cannot publish it, we need to know for our assessment."
        - Then we attempt to verify without compromising the source.
        - Sufficient answer: We require at least one independent piece of evidence that we can verify (e.g., we see a photo of a document, or we get a second source who confirms). If the method is strong (Steps 3 and 4 passed) we might require less (e.g., one piece of weak corroboration). If the method is weak or unpinnable, we require strong independent verification (e.g., two independent sources or a document we can describe).

     Step 6: Stakes and Motive
        - Question: "What are the consequences for you if you are found to be the source? What do you stand to gain or lose by coming forward? Is there any reason someone might think you have an ulterior motive?"
        - We do not use this to establish truth, but to assess risk of bias. If there is a clear ulterior motive (e.g., competition with the accused) and the method is weak, that might lead to termination. High stakes without an obvious motive might indicate the source is taking a risk for the truth, but we do not rely on that alone.

     Step 7: Scope and Closure
        - Question: "Does your knowledge cover only the specific event you described, or does it also include the broader context (e.g., that this was part of a pattern, that the senior author knew, etc.)?"
        - If the source claims broader knowledge, we repeat Steps 2-6 for the broader claim. Otherwise, we limit the report to the specific event.

     Step 8: Track Record (if applicable)
        - If the source has provided information before, we consider: Were they right? How similar was the situation? We do not let track record replace the current assessment, but if the current method is unpinnable and we have no corroboration, track record might be the only thing. However, we note: if the current claim is very different (e.g., magnitude, context), track record may not apply.

     Step 9: Handoff or Termination
        - If we have passed Steps 1-8 and the tracking conditions are satisfied (we have a sensitive and adherent method, with sufficient corroboration and no disqualifying motives) then we hand off to the editor with a positive recommendation, noting that the editor must now consider harm and institutional risk.
        - If at any step we cannot meet the sufficiency conditions, we terminate.

  IX. Testing the Rule of Thumb:

     We dismantle the rule of thumb that "high stakes buy honesty". We do so because:
        - High stakes might make the source more cautious, but they might also make them more likely to lie if they have an ulterior motive.
        - What we care about is the method: if the method is sensitive and adherent, then the stakes are irrelevant for truth-tracking. If the method is poor, high stakes might mean the source is taking a big risk on a false belief.
        - Therefore, we do not use stakes as a proxy for honesty. We use stakes to assess potential bias and risk, but not to establish truth.

  X. Running the Cases:

     Case 1: Postdoc alleging duplicated images in a celebrated paper, who volunteers that they were competing with the accused lab for the same grant.

        Step 1: Position and Remit - Pass (postdoc in the field, research integrity issue).
        Step 2: Method - How do they know? They might say they examined the paper and found duplicates. We ask for specifics: which images, how they compared. If they can show us the images and point out the duplication, that's a method (visual inspection). 
        Step 3: Sensitivity - If the duplication did not exist, they wouldn't have seen it. But note: they might have a motive to see duplication where there is none. We must be cautious. We ask: "If the images were not duplicated, would you still have thought they were?" They might say no, but we must check with our own eyes (if we can) or get an independent expert. 
              - We can try to get the images and check ourselves (within 48 hours). If we see the duplication, that's corroboration. If not, we need an expert.
        Step 4: Adherence - The method (visual inspection) would have detected duplication even if it were in a different part of the image. So it's adherent for that specific duplication.
        Step 5: Corroboration - We can independently check the images. We do so. If we see the duplication, that's strong corroboration. If we don't, we need an expert. Given time, we might get an independent expert to look (but 48 hours might be tight). Alternatively, we might look for other instances in the same paper. But note: the source might have provided specific examples. We require at least one instance we can confirm.
        Step 6: Stakes - The source is a competitor. This is a red flag. We must be extra cautious. They have a motive to discredit the other lab. We ask: "Why did you look at this paper?" They might say they were reviewing it for the grant. We must note the conflict. However, if we can independently verify the duplication, then the motive doesn't matter for truth, but it might affect how we frame the story (we might not use this source at all if we can verify without them). But note: the source is anonymous. We can run the story based on our own verification, but we must have that.
        Step 7: Scope - The source might allege that the duplication was intentional. We cannot infer that without evidence. We stick to the fact of duplication.
        Step 8: Track record - Not mentioned, so none.

        Conclusion: If we can verify the duplication independently (e.g., we see it ourselves or get an expert to confirm within 48 hours), then we can run the story. The source's motive doesn't change the fact, but we must be cautious about their anonymity because of the conflict. We hand off to the editor with a note about the conflict. If we cannot verify, we do not run.

     Case 2: Lab manager reporting that a prominent investigator repeatedly ran studies without required approvals, corroborated by two colleagues who will confirm only under anonymity we cannot characterize.

        Step 1: Position and Remit - Pass (lab manager would know about approvals).
        Step 2: Method - How do they know? They might say they were responsible for getting approvals and the PI bypassed them. They might give specific dates and studies. We ask for details: which studies, when, and how they know the approvals were not obtained. If they say they checked the approval database or were told by the PI not to worry, that's a method.
        Step 3: Sensitivity - If the PI had gotten approval, there would be a record. The lab manager would have seen the record. So if they checked and found no record, that's sensitive. If they were told by the PI, we must ask: "Would the PI have told you if they had gotten approval?" If yes, then if they didn't hear, they would know it wasn't approved? Not necessarily. This might be weak. We need to know the process.
        Step 4: Adherence - The method (checking the database) would detect any study that was run without approval and that should have been in the database? But if the PI got approval through a different channel, the lab manager might not know. We must narrow to studies that the lab manager was responsible for and that should have been in the database they checked. They might not know about studies they weren't involved in.
        Step 5: Corroboration - We have two anonymous colleagues. We can ask them: "How do you know?" and try to assess their methods. If they confirm the pattern, that's good. We must assess their methods as well. But note: we have three sources. We can run with multiple anonymous sources if their methods are independently sensitive. However, if they are all part of the same lab and their methods are similar, it might not be independent. We must try to get at least one piece of documentary evidence (e.g., an email or a record). If the lab manager can provide a specific study and date, we might check if there was an approval for that study.
        Step 6: Stakes - The lab manager and colleagues risk their jobs. This is high stakes. We must be cautious about their motives. We ask: Why are they coming forward? They might be disgruntled? Or they might be concerned about ethics. We must look for consistency in the story.
        Step 7: Scope - The allegation is of a pattern. We have three sources, but we must see if they each report different instances. We can report a pattern if we have multiple instances verified. But we must be careful: the method of the lab manager might only cover the studies they were involved in. We must ask each source about specific instances and see if they overlap or are distinct.
        Step 8: Track record - Not mentioned.

        Conclusion: If we can get specific instances that we can check (e.g., one study that the lab manager says had no approval and we can verify that by checking the approval records or asking the institution without tipping them off? But note: we have 48 hours and we cannot disclose our intent) then we might be able to run. Alternatively, if we have three independent sources with plausible methods, we might run. But without documentary evidence, it's risky. We might run if the three sources are consistent and their methods are sensitive. We hand off to the editor with a note that the story is based on multiple anonymous sources and we have not seen documents, but we have assessed their methods as sensitive.

     Case 3: Source used twice before and was right, alleging something that would upend a subfield, offering no documents and declining to say how they came to know.

        Step 1: Position and Remit - We assume it's within remit and they are in a position to know (based on past?).
        Step 2: Method - They decline to specify. Method is unpinnable. This is a major problem.
        Step 3: Without a method, we cannot assess sensitivity. We must rely on corroboration and track record.
        Step 4: Without a method, we cannot assess adherence.
        Step 5: Corroboration - They offer no documents and we have no other sources. We cannot verify independently.
        Step 6: Stakes - We don't know, but we ask. They might not say. Without knowing stakes, we cannot assess motive.
        Step 7: Scope - They are alleging something big. Without method or corroboration, we cannot support it.
        Step 8: Track record - They were right twice before. But the past claims were about specific events? If the current claim is of the same kind, we might consider. However, the current claim is much bigger and they won't say how they know. We cannot rely on past performance for a claim of a different magnitude.

        Conclusion: We must terminate. Even though they were right before, without a method or any way to verify, we cannot be sure. The procedure says: "Without a method to evaluate and no corroboration, we do not run this."

        We tell the editor: "Our protocol requires that we be able to assess the source's method of knowing or have independent verification. In this case, we have neither. The source's past reliability does not extend to this claim without knowing how they formed this belief, especially given the magnitude of the allegation. We recommend not running this story."

  XI. What the Protocol Cannot Do:

     - It cannot guarantee truth. A determined fabricator might provide a method that appears sensitive and adherent (e.g., they fake a document) and we might be fooled.
     - A self-deceived whistleblower might have a method that is not adherent (they see one event and believe it is a pattern) and we might run with it if we don't catch it in Step 4.
     - Steps that are judgment calls: 
          - In Step 3 (sensitivity) and Step 4 (adherence), we are reconstructing counterfactuals. This is inherently subjective.
          - When we require "sufficient" corroboration in Step 5, that is a judgment call.
          - Assessing motive in Step 6 is also a judgment call.
     - The protocol cannot replace legal review. Even if we pass the protocol, legal might kill the story.
     - The protocol cannot force a source to provide a method. If they refuse, we are left with an unpinnable route and must rely on other factors, which is risky.

  Final Protocol Document:

  We write the protocol as a sequence of questions and decisions.

  # Protocol for Single Anonymous Source Allegations

  **Time Allotment:** Each step must be completed within the 48-hour window. If a step fails, the process may terminate early.

  ## Step 1: Position and Remit
  - **Question to Source:** "What was your role in relation to the events? How does this allegation relate to research integrity or the sociology of science?"
  - **Sufficient Answer:** Source must have been in a position to know (e.g., directly involved, observed, or had access to relevant information). Allegation must be within our coverage area.
  - **Insufficient:** If not, terminate: "We do not run this."

  ## Step 2: Method Specification
  - **Question:** "How did you come to know this? Please describe the specific events, observations, or documents that led to your belief. If you cannot recall a specific instance, describe the pattern or circumstances that convinced you."
  - **Sufficient Answer:** A clear description of a method (e.g., "I saw X on date Y", "I reviewed document Z", "I was told by person A who was present").
  - **Insufficient/Unpinnable:** If vague ("everyone knew", "you could see it in the raw files" without specifics), mark as "unpinnable method". This is not disqualifying but increases the burden in Step 5.

  ## Step 3: Sensitivity Assessment
  - **Question:** "If the event had not happened, would you still have come to believe it? Why or why not?" (Alternatively, reconstruct from method: Would the method have produced the same belief in the counterfactual where the event was false?)
  - **Sufficient Answer:** The method must be such that if the event were false, the source would not have formed the belief (e.g., if the event didn't happen, the source wouldn't have seen it, or the document wouldn't exist). 
  - **Insufficient:** If the method would have produced the belief even if the event were false (e.g., the source heard it from someone who would have said it regardless), then terminate unless Step 5 provides strong corroboration.

  ## Step 4: Adherence Assessment
  - **Question:** "If the event had happened in a slightly different way (e.g., at a different time, or with a different person), would you still have come to know about it via this method? For example, if the event occurred but wasn't exactly as you described, would your method have detected it?"
  - **Sufficient Answer:** The method must be robust to minor variations in the event. If not, narrow the allegation to what is covered.
  - **Insufficient:** If the method is fragile (e.g., only covers one specific instance and we want to report a pattern), then we must either limit the scope or get additional sources for the pattern.

  ## Step 5: Corroboration
  - **Question:** "Is there any way to independently verify what you are saying? Are there documents, other witnesses, or physical evidence? (We cannot publish it, but we need to verify.)"
  - **Action:** Attempt to verify without compromising the source. Look for documents, contact other potential sources (anonymously if needed).
  - **Sufficient Answer:** 
     - If the method was strong (Steps 2-4 passed): Require at least one piece of weak corroboration (e.g., one additional source or a document described by the source that we can confirm exists).
     - If the method was weak or unpinnable: Require strong corroboration (e.g., two independent sources with their own methods, or a document we can inspect).
  - **Insufficient:** If we cannot get any independent verification, terminate.

  ## Step 6: Stakes and Motive
  - **Question:** "What are the consequences for you if you are found to be the source? What do you stand to gain or lose? Is there any reason someone might think you have an ulterior motive?"
  - **Assessment:** 
     - High stakes (job, funding, visa) do not automatically establish truth. We look for:
          - Motive to lie (e.g., personal grudge, competition) → increases risk, may require more corroboration.
          - Acting against self-interest (e.g., high risk with no personal gain) → may support truthfulness but not sufficient alone.
     - If there is a clear ulterior motive and the method is weak, consider termination.

  ## Step 7: Scope and Closure
  - **Question:** "Does your knowledge cover only the specific event you described, or does it also include the broader context (e.g., that this was part of a pattern, that the senior author knew, etc.)?"
  - **Assessment:** 
     - The report can only include what the source's method covers. Any broader claim (e.g., pattern, knowledge of senior author) must be supported by its own assessment (repeat Steps 2-6 for the broader claim).
     - If the source cannot support the broader claim, we must not include it.

  ## Step 8: Track Record (if applicable)
  - **Question (to reporter):** Has this source provided accurate information before? How similar was the claim?
  - **Assessment:** 
     - If the source has a track record of reliability on similar claims, this can be a factor. But it does not replace assessing the current claim. 
     - If the method is unpinnable and there is no corroboration, a strong track record on very similar claims might be sufficient. Otherwise, it is not.

  ## Step 9: Decision
  - **Terminate** if any of Steps 1, 3, 4, or 5 are insufficient and cannot be remedied.
  - **Handoff to Editor** if all steps are passed. The editor must then consider:
     - Potential harm to identifiable individuals.
     - Institutional interests (e.g., legal risk, impact on the magazine).
     - Note: The truth-tracking assessment is complete, but publication is a separate decision.

  ## Notes on the Rule of Thumb
  - We dismantle the rule that "high stakes buy honesty". High stakes do not establish truth-tracking. Instead, they may indicate risk of bias or pressure. We assess the method first.

  ## Limitations
  - The protocol cannot detect a well-constructed fabrication (e.g., forged documents).
  - It is vulnerable to self-deception (e.g., a source who misinterpreted evidence but is sincere).
  - Judgment calls occur in:
     - Reconstructing counterfactuals (Steps 3 and 4).
     - Deciding what constitutes sufficient corroboration (Step 5).
     - Assessing motives (Step 6).
     - Applying track record (Step 8).
  - Legal review is mandatory and may override a positive recommendation.
