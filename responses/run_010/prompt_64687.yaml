  ### Protocol for Single Anonymous Source Allegations: A Nozickian Tracking Approach

  This protocol operationalizes Nozick's tracking theory of knowledge (sensitivity and adherence) to evaluate whether an anonymous source's report counterfactually tracks reality. It replaces "reliability" with method-specific truth-tracking and explicitly handles closure limitations. Decisions terminate ("Do not run") if tracking fails; positive outcomes advance to editorial harm assessment. All steps must fit within 48 hours.

  ---

  #### **Step 1: Position and Specificity**  
  **Question to source:** *"Describe your role in the events and the exact allegation. What specific act/event did you observe, and how does it violate research integrity?"*  
  - **Sufficient answer:** Source had direct access (e.g., witnessed act, handled documents, participated in key meetings). Allegation is discrete and falsifiable (e.g., "PI ran experiment X without approval on [date]" not "the lab is corrupt").  
  - **Terminate if:** Source lacks proximate access, allegation is vague, or outside research integrity scope.  
  - *Why?* Sets baseline for method evaluation. Non-specific claims preclude tracking.

  #### **Step 2: Method Specification**  
  **Question to source:** *"How did you form this belief? Walk me through the steps, including when, where, and through what means (e.g., document, conversation, observation)."*  
  - **Sufficient answer:** Concrete, reproducible method (e.g., "I saw the PI run the experiment on [date] because I was setting up equipment"; "I compared Figures 3A and 4B in the paper and saw identical tissue sections").  
  - **If unpinnable** (e.g., "everyone knew," "it was obvious in the data"):  
    - Probe: *"What first convinced you? Describe one instance or artifact."*  
    - Failure to specify after 2 attempts = **unpinnable method**. Not disqualifying but burdens Step 5 (requires stronger corroboration).  
  - *Why?* Sensitivity/adherence only evaluable against a defined method (per Nozick's grandmother). Unpinnable methods lack counterfactual testability.

  #### **Step 3: Sensitivity Assessment**  
  **Question to source (reconstruct counterfactual):** *"If [specific act] had NOT occurred, would you still have believed it did? Why/why not? What would have been different?"*  
  - **Sufficient answer:** Method would **not** produce the same belief if false (e.g., "If the PI had approval, I would have seen the ethics log entry"; "If images weren’t duplicated, my software analysis would show different fingerprints").  
  - **Terminate if:** Method is insensitive (e.g., "I would still think this because the PI is dishonest" or "The lab manager always lies").  
  - *Why?* Tests Nozick’s sensitivity: belief must not hold if allegation is false.

  #### **Step 4: Adherence Assessment**  
  **Question to source:** *"If [act] occurred differently (e.g., at another time, by another person, or with other details), would your method still have detected it? If so, how?"*  
  - **Sufficient answer:** Method would detect variations of the core act (e.g., "Any unapproved study in our lab requires my setup—I’d know"; "Image duplication would show in my analysis regardless of the figure").  
  - **Terminate if:** Method is fragile (e.g., "Only that specific Tuesday because I was covering for someone").  
  - **Scope restriction:** If adherence is narrow (e.g., only one incident confirmed), allegation must be narrowed (e.g., "one unapproved study" not "routine misconduct").  
  - *Why?* Tests adherence: belief must hold for the truth even if details vary.

  #### **Step 5: Corroboration (Non-Public)**  
  **Action by reporter:** Seek independent verification **without** disclosing to source. Ask: *"Are there documents/people that could confirm this? Describe them without revealing yourself."*  
  - **Sufficient answer:** At least one of:  
    - Document exists and is describable (e.g., "Spreadsheet row 12 shows missing approval"; reporter verifies by requesting metadata).  
    - Second source confirms **method and core fact** (assess their Steps 2–4 separately).  
    - Physical/digital trace (e.g., timestamp conflicts, deleted file recovery).  
  - **Terminate if:** No corroboration exists. Unpinnable method (Step 2) requires **two** independent corroborations.  
  - *Why?* Non-public corroboration anchors tracking in external reality.

  #### **Step 6: Stakes and Motive**  
  **Question to source:** *"What happens to you if you’re identified? What do you gain/lose by coming forward? Could anyone question your motive?"*  
  - **Rule-of-thumb test:** Dismantled. High stakes (job, visa) do **not** imply honesty.  
    - Stakes increase sensitivity to *source’s interests*, not truth. A source fearing deportation may lie to placate authorities; a competitor may lie for gain.  
    - Protocol uses stakes to **discount** trust: High stakes + ulterior motive (e.g., "I was competing for their grant") = burden Step 5.  
  - **Terminate if:** Source admits deception incentive (e.g., "I want the PI fired so I get promoted").  
  - *Why?* Stakes reveal whether the report tracks truth or self-preservation.

  #### **Step 7: Closure and Inference Boundaries**  
  **Action by reporter:** List allegations the source’s method **directly** tracks (per Step 4).  
  - **Permitted inferences:** Only what the method’s adherence covers (e.g., direct observation of one unapproved study → "PI ran one unapproved study").  
  - **Impermissible inferences (must re-earn):**  
    - Senior author knowledge (requires email/confession).  
    - Institutional tolerance (requires policy/document pattern).  
    - Broader implications (e.g., "paper should be retracted" requires editorial/peer review).  
  - *Why?* Tracking denies closure: A method tracking act X may not track Y, even if Y entails X.

  #### **Step 8: Track Record**  
  **Action by reporter:** If source has prior correct reports, assess:  
  - Were past methods similar and pinnable?  
  - Is current claim same type/scale?  
  - **Never sufficient alone:** Past truth ≠ current tracking. Fails if current method unpinnable or uncorroborated.  

  #### **Step 9: Editorial Handoff**  
  - **If all prior steps passed:** Allegation tracks truth. Hand to editor with:  
    - Verified method, scope, corroboration.  
    - **Editor decides** based solely on:  
      - Harm to identifiable individuals (e.g., retaliation risk).  
      - Institutional risk (e.g., legal, reputational).  
  - **Do not run** if editor vetoes.  

  ---

  ### **Testing the Rule of Thumb**  
  - **Dismantled:** High stakes incentivize reports tracking *source’s welfare*, not truth. Example: A source risking deportation may falsely accuse a rival to secure asylum. Stakes are a discounting factor (Step 6), not validation.  

  ---

  ### **Case Applications**  
  #### **Case 1: Postdoc Alleging Image Duplication**  
  - **Step 1:** Pass (postdoc in field; duplication is falsifiable).  
  - **Step 2:** "I compared the images using ImageJ; panels 2C and 3D match." → **Pinnable.**  
  - **Step 3:** "If not duplicated, ImageJ would show different pixel distributions." → **Sensitive.**  
  - **Step 4:** "My method detects duplication anywhere in the paper." → **Adherent for duplication claim.**  
  - **Step 5:** Reporter runs ImageJ; confirms match. → **Corroborated.**  
  - **Step 6:** Source admits competing for grant → **Ulterior motive.** Step 5 burden already met, so proceed.  
  - **Step 7:** Can allege duplication. **Cannot** infer intent or senior author knowledge.  
  - **Verdict:** Hand to editor. Scope restricted to duplication.  

  #### **Case 2: Lab Manager Alleging Repeated Unapproved Studies**  
  - **Step 1:** Pass (manager handles approvals).  
  - **Step 2:** "PI told me on three dates to skip approvals; I logged them in a spreadsheet." → **Pinnable.**  
  - **Step 3:** "If PI had approvals, he wouldn’t have told me to skip." → **Sensitive.**  
  - **Step 4:** "Only detects instances where PI involved me." → **Adherent only for 3 incidents.**  
  - **Step 5:** Two colleagues confirm (anonymously) PI gave similar orders. Reporter checks one date in lab calendar → **Corroborated.**  
  - **Step 6:** High stakes (job loss) → **Discount motive** but corroboration suffices.  
  - **Step 7:** Can allege "three unapproved studies." **Cannot** claim "routine practice" without broader evidence.  
  - **Verdict:** Hand to editor with narrowed scope.  

  #### **Case 3: Previously Reliable Source Alleging Field-Upending Claim**  
  - **Step 1:** Pass (assume valid position).  
  - **Step 2:** "I can’t say how I know." → **Unpinnable method.**  
  - **Step 3:** Cannot assess without method → **Terminate per Step 2 burden.**  
  - **Steps 4–8:** Skipped (termination at Step 3).  
  - **Verdict:** **Do not run.** Report to editor: "Source’s method is unpinnable and uncorroborated. Past reliability does not establish tracking for this claim—truth cannot be evaluated counterfactually. We cannot run allegations lacking method specificity."  

  ---

  ### **What the Protocol Cannot Do**  
  1. **Misfires:**  
     - **Self-deceived sources:** A sincere but mistaken source (e.g., misinterpreting technical artifacts) may pass if their method *appears* sensitive/adherent.  
     - **Determined fabricators:** Sources with access to forge documents (e.g., faked spreadsheets) may create false corroboration.  
     - **Unfalsifiable claims:** Allegations about intentions or systemic bias may evade tracking.  

  2. **Judgment Calls in Procedural Clothing:**  
     - Sensitivity/adherence reconstruction (Steps 3–4) relies on reporter’s counterfactual reasoning.  
     - Corroboration sufficiency (Step 5) hinges on reporter’s access to documents/witnesses.  
     - Motive assessment (Step 6) requires inferring incentives from incomplete information.  

  3. **Inherent Limits:**  
     - Legal review may override even perfect tracking.  
     - Time constraints (48 hours) may force termination of complex cases.  
     - Cannot compel source cooperation; unpinnable methods remain a vulnerability.  

  **Final Output:** A reporter-facing checklist of Steps 1–9, with termination/handoff triggers. Run as-is on Tuesday.
