prompt: |-
  I sit on my company's Post-Incident Review Board as the platform team's representative. The board owns our postmortem template and adjudicates incident reports that teams dispute, and it votes next week on a substantial change to that template. I've been asked to circulate a supporting memo beforehand. I'm a staff software engineer with no philosophy training, so please write for someone who can follow a precise argument but should not be assumed to know the vocabulary; where a distinction from that literature genuinely does work here, introduce it in plain terms and say what it settles, rather than naming it and moving on.

  Here is the incident that prompted the proposal. On 14 March a feature flag was flipped in production to enable a new pricing path. That path acquired a database connection per request inside a retry loop instead of reusing one from the pool. Separately, six weeks earlier we had lowered the connection-pool ceiling on that service as a cost measure, and four months earlier we had raised the circuit-breaker threshold after an unrelated incident, because the old threshold tripped during legitimate traffic spikes. Our deploy pipeline classifies flag changes as configuration, so no canary ran. The service shed traffic for 47 minutes.

  Our data team can also show that a scheduled cache flush was due twenty minutes later and that, in staging, that flush on its own drives connection demand above the lowered ceiling. So the outage appears to have been coming anyway, on a slightly different timeline, with or without the flag change.

  The proposed template change does three things. It deletes the single Root cause field. It requires a directed graph of contributing conditions, each node tagged with whether we actually hold a deployable lever on it — a setting, a code path, a process gate — that would have changed the outcome. And it restricts the graph to conditions that were abnormal at the time, so that the existence of our legacy retry code, or of electricity, cannot enter it.

  The board is split. One group holds that the root cause is the flag change, because had it not gone out we would have been fine that day, and because once every condition is admitted to the graph nothing is the cause and nobody is answerable for anything: the report ends by indicting the organisation. The other group holds that the root cause is the lowered ceiling together with the raised breaker threshold, because flag changes will keep happening and those two are what we can set differently next time; they add that the first group's test is arbitrary, since by the same reasoning the cause is whoever wrote the retry loop in 2019, or the day we picked this database.

  Two further constraints. Our external compliance auditor requires each major incident report to state a single root cause in one sentence, and we cannot drop that unilaterally. And an SRE has proposed building a counterfactual replay harness that reruns the incident in staging with one condition held at its old value, to settle disputes like this empirically; one board member objects that such a replay cannot isolate a single condition, since changing the flag also changes load timing, on-call behaviour, and whatever else was in flight.

  Please draft the memo I will circulate. It must take a position — adopt, adopt with named amendments, or reject — and give reasons the minority can argue back against, not a neutral summary of both camps. Specifically, I want it to state what the board should mean by root cause once it has settled how it will use the term; how the auditor's one-sentence requirement can be satisfied without misdescribing the incident; what rule the graph should follow in the case where the outage was coming regardless; and how much evidential weight the replay harness deserves given the objection to it. Say plainly where the two groups disagree about what a cause is and where they disagree only about what a postmortem is for. Give the strongest consideration against your own recommendation, in wording the minority would recognise as their own. Close with a checklist a reviewer could apply to the next disputed report without coming back to the board.
reasoning: |-
  We are drafting a memo for a Post-Incident Review Board. The memo must take a position on a proposed template change that:
   - Deletes the single Root Cause field.
   - Requires a directed graph of contributing conditions, each tagged with whether we have a deployable lever to change it.
   - Restricts the graph to conditions that were abnormal at the time.

   The incident example: A feature flag change (classified as config, so no canary) caused a surge in database connections due to a retry loop, which exceeded a recently lowered connection pool ceiling. Separately, the circuit-breaker threshold had been raised earlier. Also, a scheduled cache flush was due and would have caused the same issue on its own.

   The board is split:
   Group A: Root cause is the flag change because without it, the incident wouldn't have happened that day.
   Group B: Root cause is the lowered ceiling and raised threshold because those are the levers we can control.

   Constraints:
   - Compliance requires a one-sentence root cause statement.
   - A proposed replay harness to test counterfactuals is disputed because changing one condition may alter others.

   The memo must:
   - Take a position (adopt, adopt with amendments, reject).
   - State what "root cause" should mean for the board and how to satisfy the auditor.
   - Address the case where the outage was coming regardless (like the cache flush).
   - Evaluate the replay harness.
   - Distinguish between disagreement on the nature of cause and the purpose of postmortem.
   - Present the strongest counterargument.
   - Provide a checklist for future disputes.

   Position: Adopt the proposed template change, with an amendment to satisfy the auditor.

   Reasoning:
   The goal of a postmortem is to prevent recurrence. The traditional "root cause" concept often oversimplifies and points to a single event when in reality incidents result from multiple conditions. The proposed graph approach better captures the system's complexity and highlights actionable levers.

   However, the auditor requires a one-sentence root cause. We can meet this by defining "root cause" as the most proximal, controllable condition that, if altered, would have prevented the incident. But note: this is a practical definition for compliance, while the graph will tell the full story.

   For the incident in question:
   - Without the flag change, the incident would have happened later (due to the cache flush). Therefore, the flag change is not the fundamental cause. 
   - The graph would show: 
     - The lowered connection pool ceiling (abnormal, we have a lever).
     - The raised circuit-breaker threshold (abnormal, we have a lever).
     - The flag change (abnormal, we have a lever) as the trigger.
     - The retry loop (normal, because it's legacy code and not recently changed) would not be included because it was not abnormal.

   But note the restriction: only abnormal conditions. The retry loop was always there, so it's not abnormal. The cache flush was scheduled and normal, so not included. However, the fact that the cache flush would have triggered the same issue shows that the system was vulnerable. The graph should help us see that the lowered ceiling and raised threshold together created the vulnerability.

   The replay harness: It is useful but limited. Changing one condition (e.g., the flag) in a replay might not perfectly isolate because of side effects (like timing changes). Therefore, it should be one input to the graph, not the sole decider.

   Disagreements:
   - Group A and B disagree on what a cause is: 
     Group A focuses on the trigger (the flag change) because it was the last abnormal condition. 
     Group B focuses on the conditions that made the system vulnerable (the settings) because they are the ones we can fix to prevent recurrence.

   - They also disagree on the purpose of the postmortem:
     Group A sees it as assigning responsibility for the incident (thus the trigger is key).
     Group B sees it as preventing recurrence (thus the vulnerabilities are key).

   The proposed graph aligns with prevention because it forces us to identify multiple contributing conditions and tag which ones we can control.

   Strongest counterargument (from Group A):
   "By removing the root cause field, we lose the ability to hold a single team or change accountable. This will lead to a diffusion of responsibility, where every incident becomes a story of systemic failure and no one is answerable for the immediate trigger. Moreover, the auditor's requirement will force us to arbitrarily pick one node from the graph as the 'root cause', which may misrepresent the incident and create a false sense of having addressed the problem."

   Checklist for future disputed reports:
   1. For the auditor's one-sentence requirement, identify the most proximal, controllable condition that directly triggered the incident. If there are multiple, choose the one that is both controllable and whose change would have most likely prevented the incident. (In the example: the flag change, because it was the trigger, but note that the settings are the deeper issue.)
   2. In the graph, include only conditions that were abnormal at the time (recently changed, or an unexpected deviation). Exclude normal conditions (like legacy code, scheduled jobs, or infrastructure that was operating as designed).
   3. For each node, tag whether we have a deployable lever: a setting, code, or process we can change to prevent a similar incident.
   4. If an outage was coming regardless (like the cache flush), the graph should still include the conditions that made the system vulnerable (like the settings) and note that the trigger was inevitable. This highlights the vulnerability as the primary issue.
   5. The replay harness is evidence but not conclusive. Use it to test the impact of changing one condition, but acknowledge that in a complex system, changing one thing may affect others. The graph should incorporate replay results as one input.

   Amendment: We will keep a one-sentence root cause field for the auditor, but it will be defined as: "The most proximal, controllable condition that directly triggered the incident." We will derive this from the graph by selecting the trigger node (if any) that meets these criteria. If there are multiple, we will choose the one that is most directly under our control and whose change would have prevented the incident. This field will be accompanied by a note that it is for compliance and that the full analysis is in the graph.

   Therefore, the memo:

  ---

  **Memo: Proposal for Postmortem Template Change**

  **Position:** Adopt the proposed template change with the following amendment: Retain a one-sentence "root cause" field to satisfy the auditor, with the definition and selection process described below.

  **Reasoning:**

  The current "root cause" field forces an oversimplification. In the 14 March incident, two competing views emerged: one pointing to the feature flag change (the trigger) and the other to the combination of the lowered connection pool ceiling and raised circuit-breaker threshold (the vulnerability). Both are valid but incomplete. The proposed directed graph captures the full set of contributing conditions, each tagged with whether we have a deployable lever to change it. This shift will:

  1. **Focus on prevention:** By identifying multiple contributing factors and highlighting which ones we can control, we direct attention to fixes that make the system more resilient, not just to avoiding one trigger.
  2. **Reflect reality:** Incidents rarely have a single cause. They result from a chain of conditions, some of which may be latent (like the settings) and some active (like the flag flip). The graph makes this explicit.
  3. **Avoid blaming normal operations:** By excluding conditions that were not abnormal (like the existence of the retry loop or the scheduled cache flush), we prevent the graph from becoming an unactionable list of everything in the system.

  **Addressing the Auditor Requirement:**

  We propose to retain a one-sentence "root cause" field defined as: *"The most proximal, controllable condition that directly triggered the incident."* 

  - **Proximal:** It was the last abnormal condition in the chain before the failure.
  - **Controllable:** We have a deployable lever to change it (e.g., a setting, code, or process).
  - **Trigger:** It directly initiated the failure mode.

  In the 14 March incident, this would be: "A feature flag change that enabled a new pricing path, which acquired database connections at a rate that exceeded the service's capacity." 

  This satisfies the auditor while acknowledging in the graph that the underlying vulnerability (the settings) is where we must focus to prevent recurrence.

  **The Outage Was Coming Regardless:**

  In cases where the incident was inevitable (e.g., the cache flush would have triggered it), the graph should still include the abnormal conditions that created the vulnerability (the lowered ceiling and raised threshold) and the trigger (the flag change, or in the alternate scenario, the cache flush). The graph will show that the trigger was inevitable because of the vulnerability. This highlights that the vulnerability, not the trigger, is the primary concern for prevention. The trigger node would be tagged as having a lever (we can change how we roll out flags), but the vulnerability nodes are the critical ones to fix.

  **The Replay Harness:**

  The replay harness (rerunning the incident in staging with one condition changed) is a valuable tool but not a silver bullet. The objection that changing one condition may alter others (like timing or on-call behavior) is valid. Therefore:

  - Replay results should inform the graph but not override it. 
  - They are most reliable for testing the effect of changing a single setting (e.g., the connection pool ceiling) in isolation. 
  - They are less reliable for testing triggers (like the flag change) because of side effects. 

  We should use the replay harness to gather evidence about the impact of individual conditions, but the graph must also incorporate other evidence (e.g., logs, metrics, and reasoning).

  **Where the Two Groups Disagree:**

  The two groups disagree on two levels:

  1. **What is a cause?** 
     - Group A defines cause as the trigger (the flag change) because without it, the incident wouldn't have happened at that moment. 
     - Group B defines cause as the vulnerability (the settings) because without it, no trigger would have caused the incident.

  2. **What is the postmortem for?**
     - Group A sees it as assigning responsibility for the immediate incident. 
     - Group B sees it as preventing future incidents.

  The graph approach aligns with prevention by forcing us to look beyond the trigger to the system conditions we can control. It does not preclude accountability; it shifts it to the teams owning the levers in the graph.

  **Strongest Counterargument (from Group A):**

  "Removing the single root cause field dilutes accountability. It lets the team responsible for the trigger (the flag change) off the hook and turns every incident into a story of organizational failure. Moreover, when we must provide a one-sentence root cause for the auditor, we will arbitrarily pick the trigger, which misrepresents the incident and may lead us to fix only that trigger while ignoring the deeper issues. This could make recurrence more likely, not less."

  **Amendment and Resolution:**

  We address this by:
  - Retaining a one-sentence root cause (the trigger) for the auditor, but accompanying it with the graph that shows the full context.
  - Using the graph to assign actions to the teams owning the levers (including the team that owns the flag process and the team that owns the service settings). This ensures accountability for both the trigger and the vulnerability.

  **Checklist for Reviewers of Disputed Reports:**

  When reviewing a disputed incident report, apply these steps:

  1. **Auditor's root cause:** Identify the most proximal, controllable condition that directly triggered the incident. Write it in one sentence. (Ask: What was the last abnormal condition we control that started the failure?)
  2. **Graph construction:**
     - Include only conditions that were *abnormal* (recently changed or an unexpected deviation). Exclude normal operations (e.g., legacy code, scheduled jobs).
     - For each node, tag whether we have a *deployable lever* (a setting, code, or process we can change).
     - Draw arrows showing how conditions contributed (e.g., "lowered pool ceiling" -> "reduced capacity", "raised threshold" -> "circuit breaker didn't trip", "flag change" -> "increased connections").
  3. **Inevitable outage:** If the incident was due to happen regardless (e.g., another trigger was scheduled), note this in the graph description. Highlight the vulnerability (the conditions that made the system susceptible) as the primary focus for prevention.
  4. **Replay harness:** If a replay was run, use it to support or refute the impact of changing one condition. But note: if the replay changed multiple conditions indirectly, do not rely on it as the sole evidence for that node.

  By adopting this approach, we shift from blaming the last mistake to building a more resilient system.

  --- 

  This memo takes a clear position, addresses all requirements, and provides actionable guidance.
answer: |-
  ### Memorandum: Proposal for Postmortem Template Revision  
  **To:** Post-Incident Review Board  
  **From:** [Your Name], Platform Team Representative  
  **Date:** 22 October 2023  
  **Subject:** Adoption of Revised Postmortem Template (with Amendment)  

  #### 1. **Position**  
  I recommend **adopting the proposed template change with one amendment**: Retain a "Root Cause" field solely to satisfy external compliance, defined as the **most actionable trigger** (detailed below). The core analysis must shift to the directed graph of contributing conditions.  

  #### 2. **Why This Approach Resolves Our Dispute**  
  The board’s deadlock stems from conflating two questions:  
  - **Group A** asks: *"What directly triggered the incident?"* (Answer: The flag flip.)  
  - **Group B** asks: *"What should we fix to prevent recurrence?"* (Answer: The pool ceiling + circuit breaker settings.)  

  Both are valid but serve different purposes. The proposed graph forces clarity by separating:  
  - **Triggers** (proximal events like the flag change),  
  - **Latent conditions** (system states like the ceiling/threshold),  
  - **Irrelevancies** (e.g., the retry loop’s existence, which was "normal" at the time).  

  The graph’s tagging of **deployable levers** (e.g., "pool ceiling: yes; on-call training: no") prioritizes fixable flaws over blame.  

  #### 3. **Defining "Root Cause" for Compliance**  
  To satisfy the auditor’s one-sentence requirement without misrepresentation:  
  - **Root cause** = *"The most proximal, controllable trigger that initiated the failure."*  
  - **Example for 14 March incident:**  
    > "Enabling the pricing feature flag without a canary test, exposing a latent connection-pool vulnerability."  

  This meets compliance while acknowledging the graph’s nuance. The sentence *must* reference the trigger (the flag) but implicitly points to latent conditions ("vulnerability") for action.  

  #### 4. **Handling "Inevitable" Outages (e.g., the Cache Flush)**  
  The graph must show:  
  - **Trigger:** The cache flush (if it occurred) would be tagged as a deployable lever (e.g., "reschedule or optimize flush").  
  - **Vulnerability:** The pool ceiling and circuit breaker remain the *primary nodes* because they enabled *any* trigger (flag or flush) to cause failure.  
  - **Rule:** If the outage was inevitable, the graph highlights the vulnerability as the **most actionable node**. Tags make this unambiguous.  

  #### 5. **Evidential Weight of the Replay Harness**  
  The harness is **useful but non-decisive**. Changing one condition (e.g., replaying without the flag flip) may alter timing/behavior, but it can:  
  - Validate whether a *single condition* (e.g., the pool ceiling) was sufficient to cause failure,  
  - Exclude implausible narratives (e.g., "the retry loop alone caused it").  
  **Objection addressed:** We use replays to test *specific nodes*, not to isolate "the" root cause. They inform tags (e.g., "ceiling adjustment prevents outage: yes").  

  #### 6. **Strongest Counterargument (from Group A)**  
  *"This graph approach diffuses accountability by treating the flag change as ‘just another node.’ It ignores that without this specific human error, the incident would not have occurred on 14 March. Forcing the auditor’s root cause to include latent conditions dilutes responsibility and may mislead regulators. The template should spotlight the immediate error to drive vigilance."*  

  #### 7. **Why Adoption Addresses This**  
  Accountability shifts from *blaming triggers* to *owning levers*. The flag-change team is still accountable (their lever: "require canaries for flag flips"), but the graph exposes why vigilance alone fails: the system punished a routine change due to latent flaws. The auditor’s sentence preserves trigger visibility.  

  #### 8. **Amendment**  
  Add this field to the template:  
  > **Compliance Root Cause (1 sentence):** [Most proximal, controllable trigger + latent vulnerability context].  

  #### 9. **Checklist for Disputed Reports**  
  Apply this to future incidents without board escalation:  

  | **Question**                               | **Criteria**                                                                 |
  |--------------------------------------------|-----------------------------------------------------------------------------|
  | **1. What goes in the auditor’s root cause?** | Proximal trigger + latent vulnerability (e.g., "[Trigger] exposing [vulnerability]"). |
  | **2. Does a condition belong in the graph?** | Only if: (a) Abnormal at the time, (b) Directly contributed, (c) Tagged with deployable lever (yes/no). |
  | **3. How to handle an "inevitable" outage?** | Graph the vulnerability first. Tag triggers (e.g., cache flush) as levers where possible. |
  | **4. When to use replay harness data?**    | To test individual nodes (not the entire incident). Reject results if timing/behavioral side effects are material. |
  | **5. Is a node "actionable"?**             | Only if we control its lever (e.g., code, config, process)—not "better monitoring." |

  ---

  ### Summary of Adoption Rationale  
  The graph stops us from arguing over semantics and focuses on actionable fixes. It accepts that complex systems fail through combinations of triggers and latent conditions—but the tags make responsibility clear. Group A’s concern about accountability is preserved in the auditor’s field; Group B’s prevention focus drives the graph. By adopting, we align with industry best practice (e.g., SRE’s "blameless" ethos) while meeting compliance.  

  **Vote to adopt the revised template with the specified amendment.**
