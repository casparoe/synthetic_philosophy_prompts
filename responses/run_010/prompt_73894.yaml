answer: |-
  ## Fellowship Proposal: Resolving the Cold War's Onset Through Causal Frameworks

  **Project Title:** Beyond Trigger and Blame: Reconciling Cold War Historiography Through Causal Framing Analysis

  **1. Research Question & Core Argument:**  
  The enduring debate over "Who started the Cold War?" appears empirically driven, with consensus shifting alongside archival access. I argue this stalemate stems not from insufficient evidence, but from **conceptual underspecification**. Traditionalist, revisionist, and post-revisionist camps are not offering rival answers *to the same question*; they are posing fundamentally distinct causal inquiries, implicitly employing divergent baseline assumptions and contrast classes. My project asks: **Can apparently contradictory historical claims about Cold War causation (specifically its onset) be reconciled by explicitly reconstructing the distinct causal frameworks – focusing on *triggering interventions*, *structural robustness*, and *reciprocal responsibility allocation* – employed by different historiographical schools, using bounded diplomatic episodes as test cases?** The determinate answer sought is a methodological demonstration: *Yes, for core episodes X, Y, Z, claims from rival camps are compatible once their implicit causal framings are made explicit.* This moves beyond deflationism by showing how each framing yields valid, non-contradictory insights within its own parameters, enriching rather than negating historical understanding.

  **2. Why Existing Historiography Leaves the Question Open:**  
  The camps have not implicitly settled this because their causal frameworks remain unarticulated and conflated:
  *   **Traditionalists** (focused on Soviet actions like Poland or Iran 1946) implicitly adopt a *trigger* model. Their baseline is an expected post-war cooperation norm; the contrast class is alternative Soviet choices *within* that expected framework. Their "cause" is the deviation from this baseline.
  *   **Revisionists** (highlighting US economic expansionism/atomic diplomacy) implicitly ask about *structural preconditions*. Their baseline is the inherent conflict potential of the post-war system; the contrast class is alternative systemic arrangements. Agency matters less than the robustness of confrontation across possible actors.
  *   **Post-revisionists** (emphasizing mutual suspicion/miscalculation) implicitly focus on *allocating degrees of involvement* within a dynamic, reciprocal process. Their baseline is the evolving interaction itself; the contrast class involves alternative sequences of action/reaction and the fairness of blame assignment within that reciprocal flow.  
  Each camp interprets evidence through its unstated lens, leading to apparent contradiction when, in fact, they answer different causal questions. Their implicit framing prevents direct empirical refutation or synthesis.

  **3. Methodology & Defense Against Alternatives:**  
  **Core Method:** Causal Framing Reconstruction and Reconciliation.  
  *   **Step 1:** Analyze historiographical texts on specific episodes to reconstruct the implicit **baseline** (e.g., expected cooperation? Inherent conflict?) and **contrast class** (e.g., alternative Soviet choices? Alternative US policies? Alternative systemic structures?) defining each camp's causal claim.
  *   **Step 2:** Map these framings onto distinct causal models (Trigger, Structural Robustness, Reciprocal Allocation) derived from analytical philosophy (e.g., Hart & Honoré on causation in law; Lewis on counterfactuals; debates on actual causation vs. enabling conditions).
  *   **Step 3:** Demonstrate, using the *same archival evidence*, how claims made under one framing are logically compatible with claims made under another, once the frameworks are explicit. The contradiction dissolves because the claims answer different questions.

  **Defense Against Alternatives:**  
  *   **More Archival Work:** Essential *for context*, but insufficient. New documents won't resolve clashes rooted in conceptual framing. My project uses existing, well-documented episodes precisely to demonstrate that the stalemate persists *despite* rich evidence. Archival work here serves to ground the *application* of the framing analysis, not to unearth new "smoking guns."
  *   **Informal Counterfactual Speculation:** While inherent to historical reasoning, it remains ad hoc and vulnerable to bias without explicit framing. My method systematizes counterfactuals by embedding them within defined contrast classes and baselines, making assumptions transparent and testable.
  *   **Formal Actual-Causality Models (Structural Equations):** Tempting, but high risk. Variable choice and arrow direction inevitably encode prior assumptions about relevance and blame (e.g., coding "Soviet Aggression" as a variable presumes its ontological status and causal primacy). This risks formalizing the very biases the project seeks to expose, adding complexity without resolving the underlying conceptual clash. My qualitative framing analysis avoids this by *revealing* the prior assumptions before formalization could even begin.

  **4. Archival Component & Deliverables:**  
  This is fundamentally a historical dissertation applying philosophical tools. Analysis will be grounded in three bounded, well-documented episodes central to the "onset" debate:
  1.  **The Atomic Decisions (1944-45):** Sharing/withholding nuclear information; the decision to use the bomb; impact on Soviet perceptions. (Demonstrate: How a traditionalist claim about the bomb as trigger vs. a revisionist claim about US atomic diplomacy creating structural tension are compatible under different baselines).
  2.  **The Polish Settlement (Yalta-Potsdam, 1945):** Interpretations of Soviet actions vs. Western concessions/expectations. (Demonstrate: How a traditionalist claim about Soviet bad faith violates a cooperation baseline vs. a post-revisionist claim about mutual miscalculation within a reciprocal process).
  3.  **The Sequence of 1947:** Truman Doctrine, Marshall Plan, Cominform formation, Czechoslovak coup. (Demonstrate: How revisionist claims about US initiatives creating structure clash with traditionalist claims about Soviet consolidation as trigger, showing they operate with different contrast classes - systemic alternatives vs. specific interventions).

  **Deliverable for Each Episode:** A chapter section demonstrating reconciliation. This will show:  
  *   Specific, cited claims from historians representing different camps that *appear* contradictory regarding causation in the episode.
  *   Explicit reconstruction of the implicit baseline and contrast class for each claim.
  *   Mapping of these framings onto the Trigger/Structural/Reciprocal models.
  *   Argument showing how, within their respective frames and using the same core evidence, the claims are logically compatible and answer different causal questions.
  *   Assessment of what each framing reveals and obscures about the episode.

  **5. Failure Conditions:**  
  The project fails if:  
  *   **Reconciliation Fails:** For core episodes, explicit framing reveals the camps *are* making genuinely contradictory empirical claims after all (e.g., both using the *same* baseline and contrast class but disagreeing on facts), rendering the reframing merely decorative.
  *   **Trivial Scope:** The method only "works" for micro-events devoid of broader significance, failing to illuminate the general historiographical stalemate over the Cold War's onset.
  *   **Historian's Skepticism Validated:** Historians examining the analysis conclude it changes *nothing* about how they would research, write, or teach about 1945-1948; the framing remains irrelevant to substantive historical narrative or explanation.
  *   **Formalization Impasse:** Attempts to clarify the frameworks become mired in philosophical technicalities without yielding historical insight.

  **6. Scope, Timeline & The "Vague Boundary" Fork:**  
  **Scope for 18 Months:** Focus exclusively on developing the methodological framework and executing the three case studies as the dissertation's core analytical chapters. This is ambitious but feasible, building on existing research. Drafting these chapters, plus introduction/conclusion, is the primary goal. Broader theoretical implications can be flagged for the full dissertation/thesis introduction but not deeply explored here.

  **Recommendation on the "Vague Boundary" Fork:** **Bracket the issue.**  
  *   **Justification:** The core argument about reconciling historiographical claims via causal framing operates *independently* of whether the Cold War's onset is a sharp event or a vague process. The identified episodes (atomic decisions, Poland, 1947) are widely recognized as critical junctures *within* the transition to the Cold War system, irrespective of precise start dates. Disputes about causation *within these specific episodes* are the focus. Engaging the metaphysical question of vague boundaries would unnecessarily complicate the methodology and distract from the central historiographical intervention. It can be acknowledged as a distinct, higher-order issue in the conclusion without requiring the project to take a stand, preserving focus on the tractable task of reconciling existing causal claims about concrete events.

  **Conclusion:**  
  This project offers a novel resolution to a century-old debate by exposing its conceptual architecture. It provides the historian reader with a tool to resolve apparent contradictions without dismissing rival schools, grounding philosophy in historical practice. It provides the philosopher reader with a case study of how causal concepts implicitly structure empirical debate, moving beyond abstract "morass." By demonstrating compatibility through explicit framing in key Cold War episodes, the project aims to transform a stalled debate into a richer, multi-faceted understanding of how the conflict emerged.
