prompt: |-
  I am a fourth-year doctoral student in an experimental mesoscopics group, and this term I have been reassigned to a project I did not choose. Our group runs a feedback-controlled colloidal information engine: a micron-scale bead held in an optical trap whose stiffness and center we modulate, with a controller that samples the bead's position, writes a bit into a physical memory realized as a double-well potential, and then shifts the trap so that the bead's subsequent relaxation lifts a weight, so to speak, in the calibrated potential. We are co-writing an interdisciplinary review on what such devices are supposed to establish about the second law, and the opening section — what would count as resolving Maxwell's demon at all — has fallen to me. That is not a question I was trained to ask. One of my coauthors is confident the matter was closed decades ago by the erasure-based accounting; a philosopher of physics on my committee disagrees, and has already warned me that most of what my coauthors want to write either begs the question against the demon, or simply restates the second law in information-theoretic vocabulary and calls it an explanation.

  So I would like the specification before I draft a single paragraph: the desiderata any proposed resolution of the demon's challenge has to satisfy. For each requirement, give me the statement of it, the concrete case or consideration that motivates it — ideally a scenario in which a would-be resolution that omits the requirement visibly goes wrong — and a verdict on whether it is non-negotiable or whether it is really the standing preference of one camp (for instance, the insistence on strictly cyclic operation, the insistence that the accounting be derivable from time-reversal-invariant microdynamics without any stipulated coarse-graining, the insistence that the demon be treated as an autonomous physical system rather than an external controller, or the deflationary view that the second law was always statistical and therefore needs no rescuing). Roughly a dozen requirements is about right; more is fine if they are genuinely distinct, but please collapse anything that is doing the same work twice, and explicitly flag any candidate requirement that turns out to be a restatement of the second law itself, since such a requirement has no power to discriminate between resolutions.

  The list has to cover three variants that keep coming up around our apparatus, two of which I made up myself and none of which I can find handled cleanly in anything I have read. First, an append-only demon: a device that measures and records but never overwrites anything, so that on any single run it never erases a bit, and which is operated exactly once rather than cyclically — I want to know what a resolution owes us here, and whether the demand that such a demon eventually fail is a physical requirement or an appeal to a practical limit on memory. Second, a demon whose memory bit is reset not by controlled work but by a spontaneous thermal fluctuation of the bath, so that the dissipation is, on the lucky runs, paid back by the reservoir itself: what must a resolution say about the status of the bound on individual trajectories as opposed to averages, and about whether an account that only holds on average has answered the challenge? Third, a demon that performs no measurement at all and merely harvests a correlation that was established earlier at no thermodynamic cost — I want the requirement that governs when pre-existing correlation counts as usable fuel and when it does not, because this seems to be where accounting schemes either become trivially permissive or arbitrarily restrictive. After the list, tell me which subsets of the requirements cannot be jointly satisfied — if the tension between strict cyclicity, an unassisted finite-memory demon, and no appeal to special initial conditions or to an unexplained low-entropy past is real, say so plainly, because I suspect that is the most interesting thing I could put in this section — and identify the single requirement that excludes the most candidates. Then finish with a brief scorecard, no more than a table, of the main families of resolution against the list: the one-molecule-engine accounting in its original form, the view that measurement itself carries an unavoidable thermodynamic price, the erasure-based accounting, the modern framework that folds acquired mutual information into a modified work bound, the persistent dissent holding that the erasure bound has never been properly established and that engine-based derivations smuggle in the irreversibility they claim to derive, and the deflationary view that there was never a paradox. Refer to these positions descriptively rather than by citation — I will add references myself, and I do not want invented ones — and where a camp's failure against a requirement is contested rather than agreed, say that it is contested.
reasoning: |-
  We are going to define a set of desiderata for a resolution of Maxwell's demon paradox. The goal is to have a list of requirements that any proposed resolution must satisfy to be considered adequate. For each requirement, we provide:

  1. The statement of the requirement.
  2. The motivation: a concrete case or consideration that shows why the requirement is necessary, including a scenario where a resolution omitting it fails.
  3. A verdict on whether it is non-negotiable (a must-have) or if it is a preference of a particular camp.

  We will also cover the three variants mentioned:

  - Append-only demon (measures and records without overwriting, operated once).
  - Demon with memory reset by thermal fluctuation (dissipation paid by the bath on lucky runs).
  - Demon that uses pre-existing correlation (without measurement).

  After the list, we discuss tensions (which subsets of requirements cannot be jointly satisfied) and identify the requirement that excludes the most candidates. Then, we provide a scorecard (table) of main resolution families against the list.

  ---

  **Desiderata for Resolving Maxwell's Demon**

  1. **Requirement of Cyclic Operation (Cyclicity)**
     - *Statement*: The demon and the system must operate cyclically, meaning that after each cycle, the entire setup (demon, memory, system, and any baths) returns to its initial state, so that the process can be repeated indefinitely.
     - *Motivation*: Without cyclicity, a one-time operation might appear to violate the second law by extracting work from a single heat bath without any net change. For example, in the append-only demon (variant 1), the demon records the measurement results in an ever-growing memory, so that in a single run, it seems to extract work without any apparent cost. However, if we require cyclic operation, the demon must eventually reset its memory, and the cost of erasure (or reset) becomes apparent. A resolution that does not require cyclicity might allow for a perpetual motion machine of the second kind in the long run by ignoring the growing memory. But if we insist on cyclicity, we see that the reset cost must be paid.
     - *Verdict*: This is a preference of some camps (especially those emphasizing practical engines) but not non-negotiable. Some argue that the second law must hold for any process, cyclic or not, so cyclicity is not essential. However, it is crucial for accounting in finite-memory demons.

  2. **Requirement of Finite Memory (Bounded Memory)**
     - *Statement*: The demon must have finite memory capacity. Therefore, if the demon operates repeatedly, it must eventually reuse or reset its memory.
     - *Motivation*: In the append-only demon (variant 1), if the memory is infinite, the demon can keep recording without ever erasing, and it might seem to extract work without any cost. However, in reality, any physical system has finite memory. A resolution that does not require finite memory would allow for an infinite-memory demon that never pays an erasure cost, which is physically unrealistic. This requirement forces the reset cost to appear in the long run.
     - *Verdict*: Non-negotiable. Any physical system must have finite resources.

  3. **Requirement of Autonomous Operation (Autonomy)**
     - *Statement*: The demon must be treated as a physical system, subject to the same physical laws (including thermodynamics) as the system it controls, without external intervention or control.
     - *Motivation*: If the demon is treated as an external controller (not part of the physical system), then one might ignore the thermodynamic cost of its operation (e.g., measurement, decision, reset). For example, in the case of the demon that uses pre-existing correlation (variant 3), if the correlation was established by an external agent without cost, then the demon seems to extract work for free. But if the demon is autonomous and the entire setup is included, then the cost of initially establishing the correlation must be accounted for. A resolution that omits autonomy might allow for an external demon to violate the second law by offloading costs.
     - *Verdict*: Non-negotiable for a complete physical account. The paradox arises only if the demon is considered part of the system.

  4. **Requirement of Microdynamic Derivation (Microscopic Time-Reversal Symmetry)**
     - *Statement*: The thermodynamic accounting must be derivable from the underlying time-reversal invariant microdynamics (e.g., Hamiltonian mechanics) without ad hoc coarse-graining or assumptions of irreversibility.
     - *Motivation*: If we do not require this, we might introduce irreversibility by fiat in the coarse-graining. For instance, in the erasure-based accounting, the Landauer principle (erasure dissipates heat) is sometimes derived using coarse-graining. However, without a microscopic derivation, one might argue that the demon's operation is reversible at the micro level. A resolution that fails this requirement might build in the second law implicitly. For example, in the append-only demon, if we do not derive the bounds from microdynamics, we might not see why the memory cannot be infinite.
     - *Verdict*: A strong preference in some camps (especially foundational work) but not non-negotiable. Many practical accounts use coarse-graining.

  5. **Requirement of No Special Initial Conditions (Generality)**
     - *Statement*: The resolution must not rely on the system (including the demon) starting in a specially prepared low-entropy state. The second law should hold for typical initial conditions.
     - *Motivation*: If we allow special initial conditions, we can set up a system that appears to violate the second law temporarily. For example, in the demon that uses pre-existing correlation (variant 3), if the correlation is established in the initial state without accounting for the cost of creating that state, then the demon might extract work from a single bath. But if we require no special initial conditions, then the initial correlation must have been created at some cost. A resolution that allows special initial conditions would beg the question by assuming a low-entropy starting point.
     - *Verdict*: Non-negotiable. The second law must hold without assuming a prepared low-entropy state.

  6. **Requirement of Individual Trajectory Validity (Trajectory-Specific Bounds)**
     - *Statement*: The second law must hold not only on average but also for individual trajectories in the sense that the total entropy production (system plus bath) is non-negative for every trajectory, or at least that violations are bounded and rare (e.g., by fluctuation theorems).
     - *Motivation*: In the case of the demon whose memory reset is done by a thermal fluctuation (variant 2), on a lucky trajectory, the reset might happen without any work input, and the extracted work might seem to violate the second law for that trajectory. However, if we require the second law to hold on average, then the violation on the lucky trajectory is compensated by other trajectories. But if we insist on trajectory-specific bounds, then we must explain why the apparent violation in that trajectory is not a true violation. This requirement is motivated by the need to avoid even temporary violations.
     - *Verdict*: This is a preference of some camps (especially stochastic thermodynamics) but not non-negotiable. The traditional second law is statistical and holds on average.

  7. **Requirement of Accounting for Measurement Cost (Measurement Dissipation)**
     - *Statement*: The act of measurement by the demon must incur a thermodynamic cost (e.g., dissipation) that compensates for the work extracted.
     - *Motivation*: Early resolutions (e.g., by Szilard) suggested that measurement might be cost-free. However, without a measurement cost, the demon could use a sequence of measurements to extract work without any apparent cost. For example, in the append-only demon, if measurement is free, then the demon can measure and record without any cost and then extract work. A resolution that omits the measurement cost might allow for a violation. However, note that modern accounts often show that measurement can be reversible and thus without immediate dissipation, but the cost comes at erasure.
     - *Verdict*: Contested. The erasure-based resolution does not require a measurement cost, but others do.

  8. **Requirement of Erasure Cost (Landauer's Principle)**
     - *Statement*: Resetting a bit of memory to a standard state (erasure) must dissipate at least kT ln 2 of heat to the environment per bit.
     - *Motivation*: This is the cornerstone of the erasure-based resolution. Without it, the demon could reset its memory for free and thus operate cyclically without cost. In the case of the append-only demon, if we require cyclicity and finite memory, then erasure must occur and must have a cost. A resolution that does not include erasure cost would fail to account for the reset step. However, in the case of the demon that uses a spontaneous reset (variant 2), if the reset is done by a thermal fluctuation, then the erasure cost might be avoided on some trajectories, so this requirement must be interpreted statistically.
     - *Verdict*: Non-negotiable in the erasure-based resolution, but contested by others.

  9. **Requirement of Incorporating Mutual Information (Information as Fuel)**
     - *Statement*: The work that can be extracted by the demon is bounded by the mutual information between the system and the demon's memory, and this mutual information must be accounted for as a thermodynamic resource.
     - *Motivation*: In the case of the demon that uses pre-existing correlation (variant 3), if the mutual information is already present, it can be used to extract work without measurement. But then we must account for the origin of that mutual information. A resolution that does not incorporate mutual information might not be able to handle such cases and would either forbid the use of pre-existing correlation (which is physically possible) or allow it without cost (which would violate the second law). This requirement is central to the modern information-theoretic approach.
     - *Verdict*: Non-negotiable in modern frameworks.

  10. **Requirement of No Question-Begging (Avoid Circularity)**
      - *Statement*: The resolution must not assume the second law (or irreversibility) in its derivation. It must derive the second law from more fundamental principles.
      - *Motivation*: The philosopher of physics in the committee argues that some resolutions simply restate the second law in information-theoretic terms. For example, if we define the thermodynamic entropy as including an information term and then say that the total entropy never decreases, we might be merely shifting the problem. A resolution that begs the question does not resolve the paradox. This requirement is motivated by the need for a foundational explanation.
      - *Verdict*: Non-negotiable for a genuine resolution.

  11. **Requirement of Universality (Applies to All Demons)**
      - *Statement*: The resolution must apply to all variants of the demon (including the three variants described) without ad hoc adjustments.
      - *Motivation*: A resolution that only works for one type of demon (e.g., one that erases memory) but fails for others (e.g., an append-only demon) is incomplete. For example, the erasure-based resolution might seem to fail for the append-only demon because no erasure occurs in a single run. But if we require universality, the resolution must handle all cases consistently.
      - *Verdict*: Non-negotiable.

  12. **Requirement of Statistical Validity (Averages and Fluctuations)**
      - *Statement*: The resolution must account for both the average behavior (the second law on average) and the fluctuations (via fluctuation theorems, if necessary).
      - *Motivation*: In the case of the spontaneous reset demon (variant 2), the reset might happen without work on some trajectories, leading to apparent violations on individual runs. The resolution must show that these violations are bounded by fluctuation theorems and that the average still holds. A resolution that only considers averages might not address the challenge for individual trajectories.
      - *Verdict*: Preference of the stochastic thermodynamics camp, but not non-negotiable for all.

  ---

  **Tensions Between Requirements**

  The most significant tension arises between:

  - **Cyclicity** (requirement 1) and **No Special Initial Conditions** (requirement 5) when combined with **Autonomy** (requirement 3) and **Finite Memory** (requirement 2). 

  Specifically, for an autonomous demon with finite memory that operates cyclically, we must reset the memory. The reset requires erasure, which dissipates heat. But if we do not allow special initial conditions, the initial state of the memory must be typical (high entropy). Therefore, resetting to a standard state (low entropy) requires work. However, if we abandon cyclicity, we can avoid reset, but then we must account for the ever-growing memory. 

  But note: the requirement of **Finite Memory** (non-negotiable) forces reset eventually, so cyclicity is not strictly necessary if we consider a finite number of cycles until memory is full. However, for indefinite operation, cyclicity is required.

  Also, the requirement of **Trajectory-Specific Bounds** (requirement 6) might conflict with the **Requirement of Erasure Cost** (requirement 8) in the case of spontaneous reset (variant 2). If erasure can be done by a thermal fluctuation without work, then on that trajectory, the erasure cost is not paid. But the fluctuation theorem ensures that such trajectories are exponentially rare.

  ---

  **Requirement That Excludes the Most Candidates**

  The **Requirement of No Question-Begging** (requirement 10) is the one that excludes the most candidates. Many accounts (especially the deflationary view and some information-theoretic restatements) are accused of circularity. The erasure-based resolution is also contested because Landauer's principle is sometimes derived using the second law.

  ---

  **Scorecard of Resolution Families**

  We evaluate the main families against the requirements. We note that the requirements are not all equally weighted, and some resolutions may satisfy a requirement in a modified form. We use:

  - **Y** (Yes): the requirement is satisfied.
  - **N** (No): the requirement is not satisfied.
  - **C** (Contested): there is debate about whether it is satisfied.
  - **P** (Partially): partially satisfied or in a specific interpretation.

  | Requirement | One-molecule-engine (original) | Measurement cost | Erasure-based | Modern (mutual info) | Dissent (erasure not established) | Deflationary (no paradox) |
  |-------------|--------------------------------|------------------|---------------|----------------------|----------------------------------|---------------------------|
  | 1. Cyclicity | N (not cyclic) | P (sometimes cyclic) | Y (requires cyclic reset) | Y (applies to cyclic and non-cyclic) | Y (but challenges erasure) | Y (but trivial) |
  | 2. Finite Memory | N (no memory) | P (memory finite) | Y | Y | Y | Y |
  | 3. Autonomy | N (external agent) | C (demon as system) | Y | Y | Y | Y |
  | 4. Microdynamic Derivation | N (not derived) | N (not derived) | C (Landauer derived from stat mech?) | Y (stochastic thermodynamics) | N (argues not derived) | N (accepts coarse-graining) |
  | 5. No Special Initial Conditions | N (starts with measurement) | C (initial state of demon) | Y (if reset is included) | Y | Y | Y |
  | 6. Trajectory-Specific Bounds | N (average only) | N | N | Y (fluctuation theorems) | N | N (average only) |
  | 7. Measurement Cost | Y (measurement costs work) | Y | N (measurement reversible) | N (measurement can be reversible) | N | N |
  | 8. Erasure Cost | N (no memory) | P (if memory reset) | Y | Y (as part of total cost) | N (contested) | N (not needed) |
  | 9. Mutual Information | N | N | P (indirectly) | Y | P | P (restates second law) |
  | 10. No Question-Begging | C (assumes irreversibility?) | C (assumes measurement cost) | C (Landauer's principle derived from second law?) | Y (derived from micro) | C (argues circularity) | N (defines second law as statistical) |
  | 11. Universality | N (only one type) | N (fails for pre-existing correlation) | N (fails for append-only) | Y | N (only for specific cases) | Y |
  | 12. Statistical Validity | P (average) | P | P (average) | Y | P | P (average) |

  **Notes on the Scorecard:**

  - **One-molecule-engine (original)**: Refers to Szilard engine type arguments. It is not cyclic, doesn't consider finite memory, and doesn't treat the demon as part of the system. It imposes a measurement cost but doesn't handle pre-existing correlations.
  - **Measurement cost**: This camp argues that measurement itself must dissipate. It may not be derived from microdynamics, and it fails for pre-existing correlations.
  - **Erasure-based**: The standard resolution (Landauer, Bennett). It handles cyclic operation with finite memory and autonomy. However, the derivation of Landauer's principle is contested (is it derived from microdynamics without circularity?). It fails for append-only demons in a single run and for pre-existing correlations without additional accounting.
  - **Modern (mutual info)**: The stochastic thermodynamics framework (e.g., Sagawa-Ueda). It uses mutual information and fluctuation theorems. It satisfies most requirements, including trajectory-specific bounds and universality. However, it does not require a measurement cost, which some may see as a flaw (but it accounts for information gain).
  - **Dissent**: This camp argues that the erasure cost has not been derived without circularity and that engine-based derivations assume irreversibility. They may not offer a complete alternative.
  - **Deflationary**: Holds that the second law is statistical and the demon only creates local decreases in entropy compensated by increases elsewhere. It satisfies cyclicity and universality by definition but may be accused of circularity (requirement 10) because it restates the second law.

  ---

  **Conclusion for Your Review Section**

  The most interesting tension is indeed between the requirement of cyclic operation (for a finite-memory demon) and the requirement of no special initial conditions, combined with autonomy. This tension is resolved in the modern framework by including the demon's memory state in the thermodynamic accounting and by using mutual information as a resource. The requirement that excludes the most candidates is the "no question-begging" requirement, as many resolutions are accused of assuming the second law in their derivation.

  In your review, you can structure the opening section by listing these requirements and then evaluating the main approaches. This will clarify what a resolution must achieve and why the debate continues.
answer: |-
  Below is a structured specification of desiderata for resolving Maxwell's demon paradox, tailored to your experimental context and the three variants you described. The requirements are distilled to avoid redundancy, and each is motivated by a concrete failure case. Non-negotiable requirements are marked as such; others reflect methodological preferences of specific camps. After the list, I address tensions, the most exclusionary requirement, and a scorecard of major resolution families.

  ---

  ### **Desiderata for Resolving Maxwell's Demon**
  1. **Autonomy of the Demon**  
     - **Statement**: The demon must be modeled as a *physical subsystem* subject to the same thermodynamic laws as the controlled system. No external, non-physical controllers are permitted.  
     - **Motivation**: If the demon is treated as an external agent (e.g., an experimenter), its energy and entropy costs can be ignored. *Failure case*: A "free" measurement by an external demon extracts work from thermal noise without accounting for the demon's own entropy production.  
     - **Verdict**: **Non-negotiable**. Essential to close the loop in autonomous devices (like your colloidal engine).

  2. **No Special Initial Conditions**  
     - **Statement**: The resolution must hold without assuming fine-tuned initial states (e.g., low-entropy memory or pre-correlated systems) that implicitly encode the second law.  
     - **Motivation**: Assuming a low-entropy memory state disguises the cost of information acquisition/reset. *Failure case*: A demon using pre-existing correlation (Variant 3) harvests work from "free" correlations, but if those correlations were established thermodynamically earlier, the cost is hidden.  
     - **Verdict**: **Non-negotiable**. Circular otherwise.

  3. **Finite Memory Capacity**  
     - **Statement**: The demon’s memory must be finite and bounded. Infinite memory is unphysical.  
     - **Motivation**: Prevents deferring erasure costs indefinitely. *Failure case*: An append-only demon (Variant 1) with infinite memory never resets, seemingly violating the second law perpetually.  
     - **Verdict**: **Non-negotiable**. Physical systems have finite resources.

  4. **Cyclic Operation Not Required**  
     - **Statement**: The resolution must apply to single-shot or finite-run scenarios, not just cyclic processes.  
     - **Motivation**: Demanding strict cyclicity obscures single-run thermodynamics. *Failure case*: An append-only demon (Variant 1) operated once appears to extract work without cost if cyclicity is enforced artificially.  
     - **Verdict**: **Preference** (of stochastic thermodynamics). Non-cyclic cases are physically meaningful.

  5. **Trajectory-Level Validity**  
     - **Statement**: The second law must hold for *individual trajectories* (e.g., via fluctuation theorems), not just ensemble averages.  
     - **Motivation**: Ensures robustness against rare fluctuations. *Failure case*: A demon reset by thermal fluctuation (Variant 2) might "succeed" on a lucky trajectory with net work extraction if only averages are bounded.  
     - **Verdict**: **Preference** (of stochastic thermodynamics). Traditional second law is statistical.

  6. **Erasure Cost Not Presumed**  
     - **Statement**: Landauer’s principle (erasure dissipates \(k_B T \ln 2\)) must be derived, not assumed.  
     - **Motivation**: Presuming erasure as the *only* cost conflates resolution with assumption. *Failure case*: An append-only demon (Variant 1) avoids erasure; if Landauer is presumed essential, the paradox reemerges needlessly.  
     - **Verdict**: **Non-negotiable**. Required to avoid circularity.

  7. **Correlation as Fuel Must Be Accounted**  
     - **Statement**: Pre-existing correlations (e.g., system-memory mutual information) must be treated as a thermodynamic resource with a well-defined cost of creation or depletion.  
     - **Motivation**: Prevents arbitrary permission/denial of work extraction. *Failure case*: A correlation-harvesting demon (Variant 3) uses "free" correlations, but if those correlations were established irreversibly, the cost must be included.  
     - **Verdict**: **Non-negotiable**. Key for modern information engines.

  8. **No Ad Hoc Coarse-Graining**  
     - **Statement**: Entropy production must be derivable from microdynamics (time-symmetric laws), not stipulated via coarse-graining.  
     - **Motivation**: Coarse-graining often smuggles in irreversibility. *Failure case*: A demon reset by thermal fluctuation (Variant 2) might appear reversible under coarse-graining, masking trajectory-level violations.  
     - **Verdict**: **Preference** (of foundational camps). Practical resolutions often use coarse-graining.

  9. **Measurement Cost Not Presumed**  
     - **Statement**: Measurement costs must be derived from physical dynamics, not assumed.  
     - **Motivation**: Assuming measurement dissipates work preemptively "solves" the paradox by fiat. *Failure case*: In Szilard’s engine, reversible measurement is possible; imposing artificial costs misattributes dissipation.  
     - **Verdict**: **Non-negotiable**. Measurement can be thermodynamically neutral.

  10. **Universality Across Demon Types**  
      - **Statement**: The resolution must apply to all demon variants (e.g., measurement-based, correlation-harvesting, reset-by-fluctuation).  
      - **Motivation**: A resolution tailored to one demon type often fails for others. *Failure case*: Erasure-based accounting fails for append-only demons (Variant 1) or correlation harvesters (Variant 3).  
      - **Verdict**: **Non-negotiable**. Incomplete otherwise.

  11. **No Restatement of the Second Law**  
      - **Statement**: The resolution must not repackage the second law (e.g., "total entropy increases") as an explanation.  
      - **Motivation**: Such "resolutions" are tautological. *Failure case*: Declaring that "information is physical" without deriving work bounds begs the question.  
      - **Verdict**: **Non-negotiable**. Core to avoiding triviality.

  ---

  ### **Tensions and Exclusionary Power**
  - **Key Tension**: The trio of **Autonomy**, **No Special Initial Conditions**, and **Finite Memory** cannot be jointly satisfied without introducing *either* cyclic operation *or* ad hoc coarse-graining.  
    - **Why?**: An autonomous demon with finite memory must eventually reset. Resetting requires work if the memory starts in a typical (high-entropy) state (per **No Special Initial Conditions**). But in a *non-cyclic* scenario (e.g., Variant 1), the reset cost might never be paid, creating tension with trajectory-level bounds.  
    - **Resolution**: Modern frameworks (e.g., stochastic thermodynamics) resolve this by treating mutual information as fuel, allowing non-cyclic operation while tracking memory entropy.

  - **Most Exclusionary Requirement**: **No Restatement of the Second Law** excludes the most candidates:  
    - Deflationary views (second law is statistical → no paradox) fail, as they dismiss the challenge.  
    - Engine-based derivations (e.g., Szilard) often *assume* irreversibility in work extraction.  
    - Erasure-based accounts *presume* Landauer’s principle, which is derived from statistical mechanics (second law).  

  ---

  ### **Scorecard of Resolution Families**
  **Columns**:  
  - **Y** = Satisfies requirement.  
  - **N** = Does not satisfy.  
  - **C** = Contested or context-dependent.  
  - **P** = Partially satisfies.  

  | Requirement                | One-Molecule Engine (Szilard) | Measurement Cost | Erasure-Based (Landauer-Bennett) | Modern Mutual Info | Dissent (Erasure Not Proven) | Deflationary (No Paradox) |
  |----------------------------|-------------------------------|------------------|-----------------------------------|--------------------|------------------------------|---------------------------|
  | **1. Autonomy**            | N (external demon)           | N                | Y                                 | Y                  | Y                            | Y                         |
  | **2. No Special Initial Conds** | N (memory starts empty)    | Y                | P (resets memory)                 | Y                  | Y                            | Y                         |
  | **3. Finite Memory**       | N (no memory)                | Y                | Y                                 | Y                  | Y                            | Y                         |
  | **4. Cyclicity Not Required** | N (assumes cyclic)         | P                | N (requires reset)                | Y                  | Y                            | Y                         |
  | **5. Trajectory-Level**    | N (averages only)            | N                | N                                 | Y                  | N                            | N                         |
  | **6. Erasure Cost Derived** | N (no erasure)              | N                | C (Landauer contested)            | Y                  | N (rejects derivation)       | N                         |
  | **7. Correlation Accounted** | N (ignores correlations)   | N                | N                                 | Y                  | N                            | P                         |
  | **8. No Ad Hoc Coarse-Graining** | N (coarse-grained work)   | N                | C                                 | Y                  | Y                            | N                         |
  | **9. Measurement Cost Derived** | N (assumed)               | N (assumed)      | Y (measurement reversible)        | Y                  | Y                            | N                         |
  | **10. Universality**       | N (Szilard-specific)         | N                | N (fails Variants 1,3)            | Y                  | P                            | P                         |
  | **11. No Restatement**     | C (assumes irreversibility) | C                | N (presumes second law)           | Y                  | Y                            | N (tautological)          |

  **Notes**:  
  - **One-Molecule Engine**: Fails autonomy (demon is external) and universality.  
  - **Measurement Cost**: Assumes measurement dissipates work; contested for ignoring reversible measurements.  
  - **Erasure-Based**: Fails non-cyclic cases (Variant 1) and pre-existing correlations (Variant 3). Landauer’s derivation is contested.  
  - **Modern Mutual Info**: Satisfies all requirements by integrating information geometry and fluctuation theorems.  
  - **Dissent**: Rejects erasure cost derivation but lacks alternative for all variants.  
  - **Deflationary**: Dismisses the paradox; fails to derive bounds.  

  ---

  ### **Recommendation for Your Review**  
