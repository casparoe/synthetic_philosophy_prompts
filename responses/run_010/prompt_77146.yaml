prompt: |-
  I'm a water rights lawyer, about fifteen years in, mostly prior appropriation states. I think in terms of seniority, beneficial use, the no-speculation rule, forfeiture and abandonment, injury to other appropriators, change applications, decreed rights, and the fact that what you hold isn't the water but a right to divert and apply a flow to a use. That vocabulary is completely natural to me and basically invisible, which is exactly why I want to use it as a test instrument.

  Take the fight over who has a right to the city — zoning, NIMBYism, housing — and restate it in my vocabulary, as faithfully as you can. Three positions, one at a time: (a) the long-time homeowner who wants to control what gets built next door and treats that as an entitlement they earned by being here and by investing; (b) the abundant-housing position that exclusionary zoning is hoarding a scare resource and dressing the hoarding up as a property right; (c) the Lefebvre-flavored claim that the city belongs to its inhabitants rather than its owners, and that what people are owed is a say in how urban space gets produced, not a share of its exchange value.

  For each one, give me the mapping — what the position is actually claiming once it's said in appropriation terms, and what my doctrine would call it — and then a three-part residue report: what translates cleanly, what only translates if you bend the doctrine out of shape, and what has no expression at all. Flag every place where you're borrowing an assumption from water law (rivalry, depletion, a fixed supply, the state as distributor, the need for a decree) and letting it do work the housing claim never asked it to do. Don't smuggle my framework's premises in and then report the resulting mismatch as a discovery about them.

  Then weigh in on a few specifics. Does beneficial use plus anti-speculation plus forfeiture already deliver most of what the YIMBY side argues for on moral grounds, or is that too cheap a win? What does my vocabulary make of a renter of twelve years with no title — is there any slot for them, or does the framework simply not see them? And if there's a claim in this debate that appropriation can only express by ceasing to be appropriation, name it and say why.

  Test the translation on exactly two cases: someone who bought in 1985 and now opposes a fourplex next door, and someone who owns three units and keeps one empty. If your doctrinal details would be shaky outside the general framework, say so rather than inventing rules — I know this area and I'd rather have the gaps marked.

  No reading list, no citations, I want the translation and the residue. Call it a page and a half.
reasoning: |-
  Okay, the user is a water rights lawyer with 15 years of experience in prior appropriation states. They want to test how well their water law vocabulary maps onto urban housing debates. Specifically, they want three positions translated into water rights terms: the long-time homeowner resisting development, the YIMBY argument against exclusionary zoning, and the Lefebvre-inspired claim about inhabitants' rights. 

  First, I need to recall the core concepts of prior appropriation doctrine they listed: seniority, beneficial use, no speculation, forfeiture, abandonment, injury, change applications, decreed rights, and the nature of water rights as usufructuary. These terms are second nature to them, so the translation must be precise. 

  For position (a), the homeowner's desire to control adjacent development feels like a senior appropriator asserting priority against new diversions. The "entitlement earned by being here" maps neatly to seniority. But their claim to control neighboring parcels? That's more like demanding a say in others' change applications—something water law doesn't grant. The residue shows where the analogy strains: zoning is regulatory, not a usufruct right, and "neighborhood character" has no water law equivalent. 

  Position (b) is cleaner. Exclusionary zoning as hoarding maps directly to speculative non-use and abandonment doctrines. YIMBYs arguing for "beneficial use" of land parallels water law's insistence on putting resources to work. But the translation smuggles in rivalry and depletion assumptions—housing isn't perfectly rivalrous like water, and supply isn't fixed if we build up. 

  Position (c) is the hardest. Lefebvre's "right to the city" for inhabitants—not just owners—has no water law counterpart. Renters? Invisible. The doctrine only sees decreed rights holders. Trying to fit this into "beneficial use" bends the framework until it snaps. 

  Now the test cases: 
  - The 1985 buyer opposing fourplexes? They're a senior appropriator fearing injury from a change application. But water law wouldn't let them veto neighbors' changes—only prove injury. 
  - The owner keeping a unit empty? That's textbook speculative non-use. Forfeiture doctrines would attack this. 

  The big gap: renters don't exist here. Water law sees diverters, not users. And Lefebvre's claim? It requires tossing the entire decreed-rights structure—ceasing to be appropriation. 

  Noticing where I smuggled assumptions: rivalry (water is subtractive, housing less so), fixed supply (land can be intensified), state as allocator (zoning isn't distribution). The YIMBY moral win via anti-speculation feels earned but incomplete—it misses mobility as "beneficial use." 

  Final note: this framework obscures power dynamics. Water law's "first in time" rewards historical privilege; mapping that to housing without critique risks endorsing exclusion.
answer: |-
  ### Translation of Urban Housing Positions into Prior Appropriation Framework  

  **Core Assumptions Borrowed from Water Law (Not Native to Housing):**  
  - **Rivalry:** Treating housing/land as a depletable flow (water) rather than a malleable capital stock.  
  - **Fixed Supply:** Assuming a "natural" limitation of urban space analogous to watershed capacity.  
  - **State as Distributor:** Casting zoning boards as analogous to state engineers adjudicating diversions.  
  - **Need for Decreed Rights:** Requiring formal, quantified entitlements to participate.  
  - **Injury as Deprivation:** Defining harm as quantitative diversion loss, not qualitative change.  

  ---  

  ### Position (a): Long-Time Homeowner as Senior Appropriator  
  **Translation:**  
  The homeowner claims a **senior decreed right** (purchase date = priority date) to divert a specific "flow" of neighborhood character (e.g., low density, aesthetics). New development is a **junior diversion** threatening **injury** via altered flow (views, noise, traffic). Their investment constitutes **beneficial use**, granting entitlement to veto changes that impair their diversion. Opposition to the fourplex is a **diligence claim** to protect existing use.  

  **Residue Report:**  
  | **Clean Translation**               | **Requires Doctrine Bending**       | **No Expression**                   |  
  |-------------------------------------|-------------------------------------|-------------------------------------|  
  | Seniority (1985 priority date)      | "Neighborhood character" as diverted flow (water law quantifies flow, not ambience) | "Entitlement to control neighbors" (water rights govern *your* diversion, not adjacent parcels) |  
  | Injury claim (if quantifiable, e.g., parking loss) | Treating zoning as a "decreed right" (zoning is regulatory, not usufructuary) | Moral claim of "earning" control via tenure (seniority confers priority, not sovereignty) |  

  **Doctrinal Verdict on 1985 Homeowner:**  
  - Under appropriation: They hold seniority but **cannot block a junior’s change application** absent proof of *quantifiable injury* (e.g., documented well interference). Opposition to fourplex = "downzoning" attempt — akin to a senior demanding juniors’ rights be forfeited without cause. Doctrine rejects this unless injury is proven.  

  ---  

  ### Position (b): Abundant Housing as Anti-Speculation Enforcement  
  **Translation:**  
  Exclusionary zoning is **speculative hoarding** of diversion rights (land capacity) without **beneficial use**. Low-density mandates artificially restrict "flow," creating **artificial scarcity**. The YIMBY seeks **forfeiture/abandonment** of underused rights (e.g., single-family zoning) and **change applications** to reallocate flow to higher uses (multifamily). "Exclusion" = **injury to junior appropriators** (newcomers) deprived of their rightful share.  

  **Residue Report:**  
  | **Clean Translation**               | **Requires Doctrine Bending**       | **No Expression**                   |  
  |-------------------------------------|-------------------------------------|-------------------------------------|  
  | Anti-speculation (vacant units/underzoned land as unused rights) | "Housing scarcity" as fixed flow depletion (ignores vertical/density expansion) | "Hoarding" as moral failing (doctrine is amoral: use it or lose it) |  
  | Beneficial use (high-density = higher utility) | Equating zoning changes with "change applications" (water changes alter *diversion*, not resource fundamentals) | Systemic "exclusion" (doctrine addresses individual injury, not class barriers) |  

  **Doctrinal Verdict on Owner of 3 Units (1 Vacant):**  
  - **Shaky but Favorable:** The vacant unit is **speculative non-use** → subject to **forfeiture after statutory period**. Doctrine *might* support reallocating that "flow" (e.g., taxing vacancy/underuse), but forfeiture typically requires total non-use, not partial. **Anti-speculation + beneficial use delivers a partial YIMBY win** — but only if housing is framed as rivalrous flow (a bend).  

  ---  

  ### Position (c): Lefebvre’s "Right to the City" as Inhabitant Sovereignty  
  **Translation:**  
  Urban space is a communal "flow" belonging to inhabitants, not owners. **Decreed rights are illegitimate**; the state must recognize **prescriptive rights** based on occupancy (tenure = beneficial use). Renters’ claims are **unadjudicated rights** demanding recognition. "Say in production" = **collective change application** superseding individual decrees.  

  **Residue Report:**  
  | **Clean Translation**               | **Requires Doctrine Bending**       | **No Expression**                   |  
  |-------------------------------------|-------------------------------------|-------------------------------------|  
  | Beneficial use (occupancy as use)   | "Inhabitants over owners" (appropriation prioritizes *diversion rights*, not residency) | "Urban space as communal resource" (water law is individualistic; rights are severable) |  
  | —                                   | Renters as "appropriators" (doctrine requires *diversion infrastructure*, not use) | "Production of space" (water law assumes a natural resource, not socially constructed value) |  

  **The Renter of 12 Years:**  
  - **No Slot in Framework:** Renters are **users without diversion rights**. Like a farmer irrigating with another’s water, they hold no decree and thus no standing. Doctrine is blind to occupancy without title.  

  ---  

  ### Critical Specifics  
  1. **Is YIMBY Morality "Too Cheap a Win"?**  
     - **Yes, but incompletely.** Anti-speculation/forfeiture attacks underuse (e.g., vacant units) but not exclusionary zoning itself. Doctrine cannot inherently condemn low-density "beneficial use" (e.g., a senior irrigating alfalfa) unless scarcity is absolute. **Borrowed rivalry assumption** does heavy lifting.  

  2. **The Claim That Requires Ceasing to Be Appropriation:**  
     - **Lefebvre’s collective "right to produce space."** Prior appropriation atomizes rights; it cannot conceptualize *sovereignty* over resource creation. Requiring "decrees" for participation excludes non-owners. To express this, the framework must abandon:  
       - Individual severable rights  
       - The state as neutral allocator  
       - Fixed natural supply (urban space is expandable/reconfigurable).  

  3. **Gaps in Doctrinal Specificity:**  
     - "Injury" in housing includes non-quantifiable harms (displacement, cultural loss) — doctrine has no metric.  
     - "Beneficial use" is politically defined in cities (e.g., is luxury housing "beneficial"?). Water law avoids this via crop/municipal classifications.  
     - Forfeiture timelines (years vs. decades) don’t map neatly to housing markets.  

