answer: |-
  The central argument survives but requires qualification regarding utility curvature.

  1. **¶1 & ¶3 Mathematics**: Correct. REU(f) is standard, and for linear u, REU(mugging) = -c + r(p) · V. Accepting V = 1/p iff r(p)/p > c for small p. If r'(0⁺) = c₀ > 0, then lim_{p→0⁺} r(p)/p = c₀ > 0, so for small enough p, r(p)/p > c holds, accepting classical mugging. If lim_{p→0⁺} r(p)/p = 0 (e.g., r(p)=p²), it is rejected. The threshold dependence is exact.

  2. **¶2 Novelty**: This is a distinct objection. While underdetermination is general in representation theorems, your focus on *extrapolation below empirically accessible probabilities* (p_min) for high-stakes/low-p decisions is not merely Savage underdetermination redux. It specifically targets REU's advertised "measurable" risk attitude when applied to normatively critical cases untestable by preference. Strengthen by clarifying that Savage underdetermination applies across the domain, whereas here r is pinned down *except* below p_min—precisely where REU is invoked.

  3. **¶3 Utility Curvature**: Weak link. You suspect correctly: with concave u, EU avoids the mugging without REU (since u(V)·p ≈ u(1/p)·p → 0 as p→0 if u is concave). REU’s role is diminished unless u is approximately linear over the vast payoff range. Repair: Explicitly restrict the objection to contexts where u is linear over the relevant stakes (e.g., monetary bets for an entity with linear wealth utility over [0,V_max]), or argue that REU is often promoted *besides* curved u for risk sensitivity.

  4. **¶4 Dilemma**: Genuine. Constraining r’s tail (e.g., regular variation) is ad hoc and evidence-free. Undefined r below p_min violates the representation theorem (r must be defined on [0,1]) and creates a hole in evaluating acts involving tiny probabilities—the very acts at issue. No obvious escape: the theorist must either fix r arbitrarily where preferences are silent or admit incompleteness, undermining REU’s determinacy in key applications.

  Cut first: The specific mention of "pandemic preparedness, tail-risk climate policy..." in ¶3 if shortening; the core point survives with "decisions of exactly the kind that motivated interest."
