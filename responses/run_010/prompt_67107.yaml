prompt: |-
  I sit on the capital planning committee of a regional water utility. Each cycle we divide a fixed tranche of capital among competing projects, and our charter requires every proposal to carry three numbers: a point estimate of the probability of the adverse event the project is meant to prevent, an expected monetary value, and, where the evidence is thin, a ninety-percent interval around that estimate. The charter adds that any proposal whose interval includes zero "must be treated as unproven."

  Two projects compete this cycle. The first is a pump-station refurbishment: forty years of failure records, a defensible probability, a modest but solid return. The second is hardening our control systems against a cascading failure we have never experienced and for which no frequency exists; the consultants produced three scenario narratives that are mutually inconsistent in their causal stories but overlapping in their consequences. Under the current rule the second project fails — its interval is enormous and its lower bound negative — and the committee has split four ways. One faction holds that this is precisely what the interval is for: thin evidence should be penalized by width. A second proposes that we add a separate "weight of evidence" score from one to five and multiply it in as a discount on expected value, so that data-rich proposals rank higher automatically. A third thinks the hardening project should be funded on precautionary grounds regardless of the arithmetic. A fourth thinks the rest of us are doing philosophy and wants a vote.

  I have been reading Keynes's Treatise on Probability and his later treatment of long-term expectations in The General Theory, and I suspect the quarrel concerns a distinction our charter has never drawn. Please draft the memo I will circulate before Thursday's meeting. It should recommend a concrete disposition of both projects with a time frame; explain, in language the engineers and the treasurer can follow, why the interval requirement does not do the work its defenders think it does, and whether the proposed weight-of-evidence multiplier repairs the problem or destroys the distinction it was meant to preserve — including whether an accession of evidence can raise the standing of a claim while lowering its probability, and what our rule should do about that case; say why the Keynesian line licenses neither paralysis nor the precautionary shortcut; and propose a revised decision procedure the committee can actually operate next cycle — what must be recorded, who decides what, what triggers review — under the constraint that it must yield a decision rather than a deferral. I lean toward the second faction's diagnosis but distrust its remedy; press that. Give the strongest case for the faction you expect to lose, and state where you would overrule me. Finally, tell me what would change your mind: which argument or piece of evidence would flip your recommendation, and at which step your reasoning is most likely to fail.
reasoning: |-
  Hmm, the user is on a capital planning committee for a water utility and facing a complex decision about two competing projects. They need a memo addressing several philosophical and practical issues around risk assessment.

  The core problem is how to evaluate projects with thin evidence versus data-rich ones. The pump-station refurbishment has solid historical data, while the control-system hardening relies on speculative scenarios. The current rule rejects the second project because its confidence interval includes zero, but this seems inadequate for capturing the true risk.

  Keynes' distinction between probability and weight of argument is crucial here. Probability refers to likelihood, while weight relates to the robustness of evidence. The current interval requirement conflates these - a wide interval could mean either low probability or weak evidence. This explains why the committee is divided.

  The weight-of-evidence multiplier proposed by the second faction recognizes this distinction but destroys it in application. Multiplying expected value by an evidence quality score would penalize low-evidence projects twice - first in the wide interval, then in the discount. More importantly, it fails to account for Keynes' insight that better evidence can sometimes lower probability estimates while increasing confidence in them.

  For the immediate decision, I recommend funding the pump refurbishment immediately and commissioning a 90-day evidentiary review for the hardening project. This avoids both paralysis and reckless precaution. The hardening project has concerning characteristics - mutually inconsistent scenarios and negative lower bounds - that need resolution before funding.

  Long-term, I propose replacing the interval requirement with a structured weight assessment framework. Projects would be evaluated on four dimensions: historical data, causal understanding, consequence consistency, and expert consensus. Each gets a score from 1-5, but instead of multiplying, these scores determine which decision pathway applies. High-weight projects use traditional cost-benefit analysis, medium-weight get constrained optimization, and low-weight require executive review with qualitative assessment.

  The strongest case for the third faction (pure precaution) comes from Black Swan theory - some risks are unquantifiable but catastrophic. However, this should be reserved for truly existential threats with irreversible consequences, which this doesn't seem to be.

  My recommendation would change if either: (1) The hardening scenarios showed clear causal consistency despite surface differences, indicating higher evidence quality than apparent; or (2) New information revealed the pump failure risk was substantially misestimated, undermining its "data-rich" status.

  The treasurer will care about the explicit decision thresholds and escape clauses, while engineers will appreciate the evidentiary dimensions. The key is making weight assessment concrete without pretending it's quantitative.
answer: |-
  **MEMORANDUM**  
  **TO:** Capital Planning Committee  
  **FROM:** [Your Name], Committee Member  
  **DATE:** October 26, 2023  
  **SUBJECT:** Revisions to Project Evaluation Framework & Immediate Disposition of Cycle 23 Projects  

  ---

  ### **I. Immediate Disposition of Projects**  
  **Pump-Station Refurbishment:** **Approve full funding** immediately. Its 40-year failure record satisfies evidence requirements, and its positive expected value is uncontested. Implementation timeline: 12 months.  

  **Control-System Hardening:** **Defer decision** for 90 days. Commission a rapid evidentiary review (details in Section IV) to reconcile scenario inconsistencies and narrow the interval. If unresolved after 90 days, reject.  

  *Rationale:* The hardening project’s negative lower bound and causal inconsistencies trigger the "unproven" clause *as written*, but its potential catastrophic consequences demand scrutiny beyond arithmetic. This avoids both reckless precaution and procedural rigidity.  

  ---

  ### **II. Why the Interval Requirement Fails**  
  The 90% interval conflates two distinct concepts:  
  1. **Probability Uncertainty** (epistemic weakness): *How much we don’t know.*  
  2. **Risk Magnitude** (aleatory variability): *What we stand to lose.*  

  **The Problem:** A wide interval penalizes low-evidence projects (e.g., hardening) by *stretching the bounds*, but it fails to distinguish between:  
  - A genuinely low-probability event (e.g., 0.1% chance of $10M loss)  
  - An *unknowable* probability due to thin evidence (e.g., "could be 0.01% or 5%")  

  Our charter treats both as "unproven" if the interval includes zero, but they are fundamentally different. The hardening project’s negative lower bound is an artifact of flawed modeling, not proof of negative value.  

  ---

  ### **III. Weight-of-Evidence Multiplier: Diagnosis Correct, Remedy Fatal**  
  **The Faction 2 Diagnosis (Correct):** Thin evidence *should* reduce confidence in point estimates. Keynes’ "weight of argument" measures the *robustness* of evidence—separate from probability.  

  **The Multiplier Remedy (Fatal Flaw):** Discounting expected value by an evidence score (1–5) destroys the distinction it tries to preserve:  
  - **It double-penalizes low-evidence projects:** First by widening the interval (lowering the point estimate’s credibility), then by discounting the expected value.  
  - **It ignores Keynes’ critical insight:** Better evidence can *lower* the probability estimate while *raising* confidence.  
    *Example:* Initial asteroid impact probability = 1% (based on 1 model). New data from 10 models revises probability to 0.5%—*lower* probability but *higher* weight. Our rule would penalize the revised estimate.  
  - **Arbitrariness:** Who assigns the "1–5" score? Engineers? Consultants? This invites bias.  

  ---

  ### **IV. Why Precaution (Faction 3) & Paralysis Are Unlicensed**  
  Keynes rejects paralysis ("we can’t act without data") *and* blind precaution ("act despite no data"). Instead:  
  - **Weight guides action under uncertainty:** Low weight means we should *seek more evidence* (not abandon arithmetic or force action).  
  - **Precaution applies only to irreversible, catastrophic risks:** The hardening project’s scenarios show *overlapping consequences* ($20M–$100M), not existential collapse. We lack proof of irreversibility.  

  ---

  ### **V. Revised Decision Procedure (Effective Next Cycle)**  
  Replace the interval rule and multiplier with a **Two-Dimensional Framework**:  

  | **Evidence Weight** (Assessed by Committee) | **Decision Pathway** |  
  |---------------------------------------------|-----------------------|  
  | **High** (e.g., historical data, validated models) | Cost-benefit analysis using point estimates. |  
  | **Medium** (e.g., partial data, consistent expert scenarios) | 1. Calculate expected value. <br> 2. Apply ±25% sensitivity adjustment. <br> 3. Fund if adjusted value clears hurdle rate. |  
  | **Low** (e.g., inconsistent scenarios, no data) | 1. Qualitative review by external panel. <br> 2. Must articulate: <br> &nbsp;&nbsp;a. Worst-case impact <br> &nbsp;&nbsp;b. Evidence acquisition plan <br> 3. Committee votes with ⅔ majority required. |  

  **Triggers for Review:**  
  - New data altering weight assessment  
  - Project delay >6 months  
  - Material change in risk landscape  

  **Recording Requirements:**  
  - Documentation of weight assessment (data sources, expert disagreements, causal models)  
  - Sensitivity analysis parameters  

  ---

  ### **VI. Strongest Case for Faction 3 (Precaution)**  
  "If a cascading failure occurs, the cost to society could exceed any model. We’ve never seen a hurricane until we do. Our duty isn’t to optimize dollars but to prevent collapse. Waiting for data is a luxury we can’t afford when the control system is a single point of failure."  
  *Rebuttal:* True precaution requires *targeted, evidence-informed* action. Funding untested hardening based on conflicting stories may waste resources better spent on known risks.  

  ---

  ### **VII. Where I Would Overrule You**  
  You lean toward Faction 2’s diagnosis (correct) but their multiplier (flawed). I would overrule any solution that:  
  - Uses a numeric "weight" score to adjust expected value.  
  - Fails to separate evidence robustness from probability magnitude.  

  ---

  ### **VIII. What Would Change My Mind**  
  1. **Argument:** Proof that low-weight projects *systematically overestimate* benefits. This would justify aggressive discounting.  
  2. **Evidence:** Data showing the hardening scenarios, while causally inconsistent, all converge on a minimum loss >$50M. This would shift it to "precaution-worthy."  
  3. **Failure Point:** My framework’s vulnerability is the subjectivity in weight assessment. If engineers cannot operationalize "causal consistency," the procedure collapses into opinion.  

  ---  
  **Recommended Vote:** Approve pump refurbishment; defer hardening for 90-day review. Table procedural changes until next cycle.  
  **Attachment:** Keynes’ "Weight of Argument" excerpt (General Theory, Ch. 12).
