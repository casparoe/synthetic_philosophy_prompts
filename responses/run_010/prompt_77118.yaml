  For the envelope game, the brother eliminated Down first. If we consider mixed strategies, Down is strictly dominated, so it can be eliminated. But the brother said mixing isn't necessary, which is wrong here. Then, after eliminating Down, the remaining is Up and Middle for row, and all columns. Now, for column, Right might be weakly dominated. After eliminating Down, column payoffs: if row plays Up, Left:1, Centre:1, Right:0; if Middle, Left:0, Centre:1, Right:1. So Right is weakly dominated by Centre? Against Up: Right 0 < Centre 1; Against Middle: Right 1 = Centre 1. So yes, weakly dominated. Eliminate Right. Now row has Up and Middle. Against column Left and Centre. Up: (5,0) against Left/Centre? When column Left, Up gives 5; Centre gives 0. Middle: Left gives 0, Centre gives 4. Now, for row, is there dominance? Up vs Middle: against Left, Up(5)>Middle(0); against Centre, Up(0)<Middle(4). No dominance. So we have two strategies left. But no Nash? At (Up, Left), row gets 5, column gets 1. If column moves to Centre, column gets 1 (same), but row drops to 0. So column might switch? But in Nash, no unilateral improvement. Column at Left gets 1. If they switch to Centre, still 1, so they're indifferent. So (Up, Left) is Nash because column can't improve, row can't improve. Similarly, (Middle, Centre) is Nash: row gets 4, if switches to Up, gets 0 (worse). Column gets 1, if switches to Left, gets 0 (worse). So both are Nash. But the brother claimed that after elimination, only one solution. Here, two are left. Also, if we eliminate weakly dominated strategies in different orders, we might get different results. For example, first eliminate column's Right (weakly dominated by Centre). After eliminating Right, the game is Up, Middle, Down vs Left, Centre. Down row: (1,1). Now, is Down strictly dominated? Up: (5,0); Middle: (0,4); Down: (1,1). Against Left, Down=1 < Up=5; against Centre, Down=1 < Middle=4? So strictly dominated by? No pure strategy, but maybe mixed. Or, since Down is less than Up against Left and less than Middle against Centre, but no single strategy dominates it. However, if we eliminate Down (since it's weakly dominated? Or strictly by mixed, but brother doesn't consider mixed). If we eliminate Down, then same as before. But if we eliminate a different weakly dominated strategy first. Suppose after eliminating Down (row), we then look at column. Left and Right are both weakly dominated? Column Centre vs Left: against Up, both 1; against Middle, Left 0 vs Centre 1 → Centre better. So Left is weakly dominated by Centre. Eliminate Left. Then remaining: row Up, Middle; column Centre, Right. After eliminating Down and Left, we have Up/Middle vs Centre/Right. Payoffs: Up-Centre: (0,1); Up-Right: (2,0); Middle-Centre: (4,1); Middle-Right: (2,1). For row, is there dominance? Up vs Middle: against Centre, Up0<Middle4; against Right, Up2=Middle2. So Middle weakly dominates Up? Against Centre, better; against Right, same. So eliminate Up. Then only Middle and column Centre/Right. Now, column: Centre (1) vs Right (1) against Middle. No dominance. But (Middle, Centre) and (Middle, Right) are both Nash? At (Middle, Centre), row=4, column=1. If column moves to Right, gets 1 (same), so might switch. But (Middle, Right): row=2, if moves to Up, gets 2 (same), column gets 1, same as before. So both are Nash. But earlier we had (Up, Left) and (Middle, Centre). Now we have (Middle, Centre) and (Middle, Right). Different outcomes based on order of elimination. 

