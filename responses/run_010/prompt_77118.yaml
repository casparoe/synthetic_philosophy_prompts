prompt: |-
  My brother's just finished second year of an economics degree and over Sunday lunch he gave me his whole spiel about how you solve games by deleting dominated strategies. He was extremely confident and I'm definately not, but I also couldn't point to where he's overreaching, and I suspect Id believe most of it if you asked me tomorrow. Here's roughly what he said, as best I've reconstructed it:

  > "You compare each of your strategies against the others. If one does strictly worse than another no matter what the other player does, it's strictly dominated — no rational person plays it, and since they know you're rational, and you know they know that, you're entitled to take it out. Then you look at what's left and do the same again, and again, until nothing more goes. Order doesn't matter here: a strictly dominated strategy is dominated whatever else you've already deleted, so everyone who does it carefully ends up in the same place. Same goes for the weakly dominated ones, the strategies that are never better and are sometimes strictly worse — you might as well clear those out too, and you'll still land on the same answer whichever order you clear them in. You only ever need to compare strategy against strategy, by the way. Mixing them doesn't buy you anything, because if a strategy deserves deleting then one of the others will beat it outright. And whatever's standing at the end is the solution to the game — it's a Nash equilibrium, and nothing you threw out along the way could have been part of an equilibrium anyway."

  Then he drew this on the back of an envelope to show me. First number is the row player, second is the column player:

  |        | Left  | Centre | Right |
  |--------|-------|--------|-------|
  | Up     | 5, 1  | 0, 1   | 2, 0  |
  | Middle | 0, 0  | 4, 1   | 2, 1  |
  | Down   | 1, 1  | 1, 1   | 1, 0  |

  He said Down goes straight away, then you clear out the rest and there's your answer. When I asked him to actually do it in front of me he got irritated and said it obviously works out.

  Could you audit all this for me? I'm not after a pile of reasons he's an idiot — I mostly want to know which bits a game theorist would sign off on and which bits would make them wince. Please use these sections, in this order:

  **What holds up** — about 150 words. The claims in his spiel that are actually correct, including the order-independence one if that one's genuinely right, and why.

  **Where it goes wrong** — about 400 words, one sub-heading per bad claim. For each, say what he's conflating or overstating, then give the corrected version in a sentence or two. While you're in here, tell me whether the "they know that you know" business is load-bearing or just flavour.

  **The envelope game** — about 350 words. Actually work it. Show me what can be deleted strictly and what only weakly, then run the elimination through in two different orders and show the two different places you end up, with the payoffs. Say whether each end point is a Nash equilibrium of the game you were left with after the first deletion, and whether either order threw away a strategy that some Nash equilibrium was actually using.

  **Can the conclusion be rescued?** — about 200 words. Is there a version of "whatever's left is the solution" that survives once his errors are fixed, and what does it cost you to get it?

  **Bottom line** — three or four sentences I can say back to him at Christmas without being wrong myself.

  No references or reading list needed, just the reasoning. And if any of his claims turns out to be right for reasons he didn't give, flag that too.
