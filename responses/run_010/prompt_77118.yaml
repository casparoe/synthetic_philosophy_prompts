  The user's brother also claimed that mixing strategies isn't necessary since a pure strategy will dominate any mixed one that's dominated. That's right because if a mixed strategy is dominated, there's a pure strategy that dominates it. However, he said that after elimination, what's left is a Nash equilibrium. That's where the problem lies. The process might leave multiple strategies, which aren't necessarily equilibria. Also, weakly dominated strategies' order matters. For example, in the envelope game, eliminating Down first (strictly dominated) is fine, but then eliminating weakly dominated strategies in different orders leads to different outcomes.

