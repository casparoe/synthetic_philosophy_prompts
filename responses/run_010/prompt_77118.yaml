  Column player's strategies: Left, Centre, Right. Payoffs when row plays Up: (1,1,0); Middle: (0,1,1); Down: (1,1,0). For column, Right is strictly dominated by Centre? Against any row move: if row plays Up, Right gives 0, Centre gives 1 → Centre better. Middle: Right gives 1, Centre gives 1 → same, so not strictly worse. Against Down: Right gives 0, Centre gives 1 → Centre better. Since against Up and Down, Centre is better, but against Middle, same. So Right is strictly dominated only if we consider it never better and sometimes worse? Strict domination requires strictly worse in all cases. Here, against Middle, Right (1) is same as Centre (1), so not strictly worse. Therefore, Right isn't strictly dominated by Centre. Actually, is there a strictly dominated strategy for column? Left: (1,0,1); Centre: (1,1,1); Right: (0,1,0). Compare Centre to Left: when row plays Up, both 1; Middle: Centre 1 vs Left 0 → Centre better; Down: both 1. So Centre is never worse and sometimes better, so Left is weakly dominated by Centre? Similarly, Right is strictly dominated? Against Up: Right 0 < Centre 1; Middle: Right 1 = Centre 1; Down: Right 0 < Centre 1. So not strictly dominated because of Middle. But the brother said Down (row) is eliminated. Down row payoffs: (1,1,1). Compare to Middle: (0,4,2). Down is better when row plays Left (1>0) but worse in Centre (1<4) and Right (1<2). So not strictly dominated. 

