answer: |-
  ### What holds up
  Your brother is correct about **strictly dominated strategies**: if one strategy **always** gives a strictly worse payoff than another, no matter what opponents do, it can be rationally deleted. The order of deletion for strictly dominated strategies **does not matter** – the final set of strategies surviving this process (the "rationalizable" set) is unique. He's also right that **iterative deletion** is valid: after removing one dominated strategy, others may become dominated in the reduced game. Crucially, if a strategy is strictly dominated in the original game, it **cannot** be part of any Nash equilibrium – so deleting it doesn't discard any equilibria. His point about mixed strategies not creating new strict dominance is also correct: if a pure strategy is strictly dominated, it's strictly dominated by some pure strategy (mixing doesn't rescue it). The "they know you're rational" logic supports common knowledge of rationality needed for iterative deletion.

  ### Where it goes wrong
  #### Claim: Weakly dominated strategies can be deleted in any order with the same result  
  **Conflation:** He equates weak dominance with strict dominance. Weakly dominated strategies (never better, sometimes strictly worse) **are not order-independent** in deletion.  
  **Corrected:** Deleting weakly dominated strategies **can lead to different results depending on the order**. Some Nash equilibria may rely on weakly dominated strategies, and deleting them early can eliminate valid equilibria.

  #### Claim: "Whatever's standing at the end is the solution to the game — it's a Nash equilibrium"  
  **Overstatement:** The surviving set after deletion (especially with weak dominance) **is not necessarily a Nash equilibrium** and may contain multiple strategies.  
  **Corrected:** The final set is the set of strategies that *could* be played under common knowledge of rationality. It **contains** all Nash equilibria using pure strategies, but may include non-equilibrium strategies or multiple equilibria. It is not itself "the solution".

  #### Claim: "Nothing you threw out... could have been part of an equilibrium anyway"  
  **Overreach:** This is true **only for strictly dominated strategies**. Weakly dominated strategies **can** be part of Nash equilibria. Deleting them may discard equilibria.  
  **Corrected:** Strictly dominated strategies are never in any Nash equilibrium. Weakly dominated strategies **can** be part of Nash equilibria, and deleting them risks losing equilibria.

  #### "Know you're rational" – load-bearing or flavour?  
  It **is load-bearing**. Iterative deletion beyond the first step requires common knowledge of rationality ("I know you're rational, you know I know," etc.). Without this, players can't justify later deletion rounds.

  ---

  ### The envelope game  
  **Initial game:**  
  |        | Left  | Centre | Right |  
  |--------|-------|--------|-------|  
  | Up     | 5,1   | 0,1    | 2,0   |  
  | Middle | 0,0   | 4,1    | 2,1   |  
  | Down   | 1,1   | 1,1    | 1,0   |  

  **Step 1: Delete strictly dominated strategies**  
  - **Row player:** Down (1,1,1) is **strictly dominated by a mixed strategy** (e.g., 50% Up + 50% Middle: 2.5 vs Left, 2 vs Centre, 2 vs Right). Crucially, **no pure strategy** strictly dominates Down. Your brother incorrectly assumed a pure strategy would dominate it.  
  - **Column player:** Right is **weakly dominated by Centre** (against Up: 0<1, against Middle: 1=1, against Down: 0<1). No strictly dominated strategies for column.  
  **Delete Down (strictly dominated by mix).** Reduced game:  

  |        | Left  | Centre | Right |  
  |--------|-------|--------|-------|  
  | Up     | 5,1   | 0,1    | 2,0   |  
  | Middle | 0,0   | 4,1    | 2,1   |  

  **Step 2: Delete weakly dominated strategies – order matters**  
  - *Order 1: Delete column's Right first*  
    Right (0,1) is weakly dominated by Centre (1,1). Delete Right. Reduced game:  
    |        | Left  | Centre |  
    |--------|-------|--------|  
    | Up     | 5,1   | 0,1    |  
    | Middle | 0,0   | 4,1    |  
    - **Nash equilibria:** (Up, Left) and (Middle, Centre). Both survive.  
  - *Order 2: Delete row's Up first*  
    Up (5,0) vs Middle (0,4):  
    - Against Left: Up (5) > Middle (0)  
    - Against Centre: Up (0) < Middle (4)  
    - Against Right: Up (2) = Middle (2)  
    Up is **not dominated** by Middle (or vice versa).  
    Instead, delete column's Left (weakly dominated by Centre: 1 vs Up > 0 vs Middle, 1 vs Right = 1 vs Right). Delete Left. Reduced game:  
    |        | Centre | Right |  
    |--------|--------|-------|  
    | Up     | 0,1    | 2,0   |  
    | Middle | 4,1    | 2,1   |  
    - Middle weakly dominates Up (against Centre: 4>0, against Right: 2=2). Delete Up.  
    - Surviving: (Middle, Centre) and (Middle, Right).  

  **End points:**  
  - Order 1: Surviving strategies {(Up, Middle), (Left, Centre)} → **Nash equilibria**: (Up, Left) and (Middle, Centre).  
  - Order 2: Surviving strategies {(Middle), (Centre, Right)} → **Nash equilibria**: (Middle, Centre) and (Middle, Right).  

  **Key observations:**  
  1. Different orders lead to **different surviving sets**.  
  2. All end points are Nash equilibria in their **reduced games** but not unique.  
  3. **Equilibria discarded**: Order 2 discarded (Up, Left), a valid Nash equilibrium.  

  ---

  ### Can the conclusion be rescued?  
  Yes, with caveats. If you **only delete strictly dominated strategies** (and accept mixed strategies for dominance checks), the final set **contains all pure-strategy Nash equilibria** and is order-independent. However:  
  1. **Weak dominance must be avoided**: As shown, it can eliminate valid equilibria.  
  2. **The final set isn't "the solution"**: It may contain non-equilibrium strategies (though in many games, it refines to equilibria).  
  3. **Mixed equilibria may be missed**: This process only guarantees inclusion of pure-strategy equilibria.  
  The cost is limited applicability: many games (like the envelope game) have no strictly dominated strategies after the first round, leaving most strategies intact.  

  ---

  ### Bottom line  
  Your brother nailed the core idea: deleting strictly dominated strategies iteratively is order-independent and discards irrational choices. But weakly dominated strategies are messy – deleting them can alter outcomes and discard valid equilibria. The surviving strategies aren't automatically "the solution"; they’re just what’s left after pruning irrational play. In the envelope game, Down is strictly dominated only by mixed strategies, and weak-dominance order changes the result. Game theorists use strict dominance rigorously but tread carefully with weak dominance.
