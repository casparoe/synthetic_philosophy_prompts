prompt: |-
  I have been working through the accuracy-first program in epistemology — the view that accuracy is the sole fundamental epistemic good, and that the familiar norms of belief are justified because they are what accuracy itself recommends — and I have assembled an argument that the program refutes itself. I cannot tell whether the argument is sound or whether I have botched a step, and since I would much rather keep the program's theorems than its foundational principle, I want a careful diagnosis rather than encouragement.

  (1) The program's master principle: a doxastic state or plan is epistemically rational just in case, among those available to the agent, it maximizes expected accuracy, where the expectation is computed from the agent's own credences.

  (2) The program's central results are applications of (1). Its argument that incoherent credence functions are irrational, and its argument that one ought to update by conditionalizing on one's total evidence, are both presented as showing that the recommended doxastic state is the one that accuracy, as the agent sees it from where she stands, favors over the alternatives.

  (3) But (1) delivers conclusions the program cannot swallow. Suppose I know that tomorrow I will be shown a white card under red lighting, so that I will have an experience as of redness, and suppose I know now that the card is white. Conditionalizing on that experience would raise my credence that the card is red. By (1) I should therefore plan now to move my credence the other way when the experience arrives, since that plan is the one my own current credences rank as more accurate. So (1) requires me to plan to discount evidence I know is coming — while (1) was supposed to be what generates the requirement to conditionalize.

  (4) (1) also licenses reckless belief. When accuracy is scored across several propositions at once, maximizing expected accuracy can require adopting a credence I take to be probably false, because the gains I expect in the worlds I regard as likely outweigh the losses in the worlds I regard as unlikely. On (1) this is not a pathology but a verdict: deliberately accepting a chance of being flatly wrong is required whenever the expected payoff in accuracy is large enough.

  (5) Worse, (1) makes every norm hostage to the agent's own opinions. If my credences are systematically bad, then the states that maximize expected accuracy by my lights are bad states, and (1) requires them of me. On (1) the miscalibrated agent is not merely excused but mandated to believe badly, and epistemic rationality collapses into prudence relative to one's own opinions.

  (6) No theory that mandates believing badly can be a theory of epistemic rationality, and no theory that recommends disregarding one's evidence can be the theory that derives conditionalization.

  (7) Therefore (1) is false; and since (2) says the program's flagship theorems are derived from (1), those theorems lose their only advertised justification.

  I anticipate one reply and think it fails. The reply is that I have described the program's principle wrongly, because its derivations are dominance arguments rather than expected-value arguments: they require only that a rational state or plan not be beaten by an alternative that is more accurate at every state the agent takes seriously. My objection is that this retreat is a dilemma. Either the quantification over states is unrestricted, in which case every credence function is beaten at some state by some alternative and nothing at all turns out to be undominated; or the quantification is restricted to the states the agent assigns positive credence, in which case the norm is hostage to the agent's own opinions again and (5) returns untouched.

  So: which step should I reject? Please tell me why the step looked acceptable when I wrote it down, and what I lose by giving it up. In particular I want to know whether the expected-value route to coherence and conditionalization and the dominance route really do come apart, and in which cases they diverge; whether the dominance results can carry the weight I assigned to (1), and what difficulties of their own they bring with them; and whether my dismissal of the dominance reply holds or collapses. If the argument is in fact sound and I must choose, tell me which to keep, the master principle or the theorems, and what the survivor then amounts to.
reasoning: |-
  Okay, let me start by unpacking the user's argument. They're deeply engaged with the accuracy-first program in epistemology, which centers on accuracy as the fundamental epistemic good. The user has constructed a self-refutation argument against this program and is seeking a critical diagnosis, not encouragement. They want to know where their reasoning might have gone wrong, specifically which step to reject and why.

  First, I need to understand each part of their argument. The master principle (1) states that rationality is about maximizing expected accuracy based on the agent's credences. The central results (2) like coherence and conditionalization are derived from this. But then in (3), the user presents a scenario where conditionalizing on future evidence would lead to less accurate beliefs, so (1) recommends planning to discount that evidence. This seems to conflict with the program's own derivation of conditionalization.

  In (4), the user points out that maximizing expected accuracy can sometimes require adopting a credence one believes is probably false if the expected payoff is high. Then (5) argues that if an agent has bad credences, (1) mandates believing badly, making rationality hostage to the agent's opinions. (6) concludes that such a theory can't be epistemic, and (7) thus the master principle is false, undermining the theorems.

  The user anticipates a dominance reply but rejects it as leading to either no undominated options or being opinion-dependent again. They want to know if this dismissal holds.

  I should start by examining the accuracy-first literature. Joyce's 1998 and 2009 works use dominance arguments for coherence, not expected accuracy maximization. Expected accuracy is used in Greaves and Wallace's argument for conditionalization, but they assume the agent is already coherent. The user's scenario in (3) involves an incoherent plan, which might be why expected accuracy gives a different result than conditionalization.

  The user's example in (3) is key. They know the card is white but will have a red-looking experience under red light. Conditionalizing would raise credence in red, but maximizing expected accuracy from current credences would suggest lowering it instead. But is the plan to lower credence available? The program might argue that such a plan isn't genuinely available because it's not a credal response to evidence but a precommitment to ignore it. Greaves and Wallace's argument requires that plans be conditional on evidence, but in this case, the evidence is misleading. The master principle might still recommend a plan that doesn't conditionalize, but that doesn't refute the derivation of conditionalization; it might show a limitation.

  On (4), the user has a point about permissiveness. Expected accuracy can sometimes favor extreme credences due to scoring rules like Brier. But is this reckless? The accuracy-first program might argue that in such cases, the expected inaccuracy is still minimized, so it's epistemically rational even if counterintuitive. This might be a feature, not a bug.

  For (5), the opinion-dependence is a deeper issue. The program bites the bullet here, saying rationality is relative to current credences. But then how can there be objective norms? The dominance approach might help here. If coherence is required because incoherent credences are accuracy-dominated regardless of the agent's opinions, that's objective. But conditionalization might depend on current credences, leading back to opinion-dependence.

  Regarding the dominance reply, the user's dilemma is between global and local dominance. Global dominance might be too strict, but local dominance (restricted to the agent's credences) brings back opinion-dependence. However, Pettigrew's book uses both: coherence via global dominance, conditionalization via expected accuracy. So the master principle isn't a monolith; different norms use different justifications. The user's dismissal might miss that dominance arguments for coherence don't rely on the agent's credences, solving the opinion-dependence for that specific theorem.

  So the key misstep is treating the master principle as uniformly applied. The accuracy-first program uses different strategies for different norms. Coherence is justified by dominance, which isn't opinion-dependent, while conditionalization uses expected accuracy, which is. But the latter assumes coherence. In the user's scenario, the plan to discount evidence isn't coherent, so expected accuracy maximization might not apply as assumed.

  The user should reject step (2) because the central results aren't all derived from the same version of the master principle. Coherence comes from dominance, conditionalization from expected accuracy with coherence presupposed. The self-refutation argument conflates these. By giving up the idea of a single master principle, the theorems can be preserved, though conditionalization's justification remains opinion-dependent.

  The user loses the unified foundation but keeps the theorems. They might need to accept that conditionalization's justification is agent-relative, while coherence is objective. The dominance reply stands for coherence but not for conditionalization. The accuracy-first program isn't refuted but is more nuanced than presented.
answer: |-
  Your argument is rigorous and exposes genuine tensions in the accuracy-first program. It doesn't "botch" steps, but it *does* over-unify the program's foundations, which is the core misstep. The accuracy-first program isn't a monolith relying on a single "master principle" applied uniformly. **Reject Step (2)**: The program's central results (coherence via dominance, conditionalization via expected accuracy) are derived from *distinct* principles, not a single master principle like (1). Giving up (2) preserves the theorems but forces a more nuanced foundation. Here's the diagnosis:

  ### Why Step (2) Looked Acceptable (and Why It's Misleading)
  You accurately describe how accuracy-first proponents *motivate* their project: accuracy is the sole epistemic good, and norms are justified as accuracy-optimizing. This creates the impression of a single, overarching principle like (1). Key proponents (e.g., Joyce, Pettigrew) often emphasize this "accuracy-first" ethos. However, the *formal derivations* use different tools:
  1.  **Coherence (Probabilism):** Derived via **dominance arguments** (e.g., Joyce 1998, 2009; Predd et al. 2009). These show that *any* incoherent credence function is accuracy-dominated by a coherent one *in every possible world* (or every world in a relevant partition). *This does not rely on the agent's specific credences.*
  2.  **Conditionalization (Updating):** Derived via **expected accuracy maximization** (e.g., Greaves & Wallace 2006). This shows that, *assuming the agent is already probabilistically coherent*, the plan to update by conditionalizing on the evidence *maximizes expected accuracy* relative to the agent's *current* credences.

  Step (2) collapses these distinct justifications into a single principle (1). This conflation makes the program vulnerable to your self-refutation argument.

  ### Why Rejecting (2) Resolves the Key Problems
  1.  **The Discounting Evidence Scenario (Your Point 3):**
      *   **The Conflict:** Your scenario exploits the opinion-dependence of *expected accuracy maximization*. Your current credences (knowing the card is white) rank the plan "lower credence in red upon seeing red" as having higher *expected* accuracy than the plan "conditionalize (raise credence in red)". This *seems* to contradict the conditionalization theorem derived *using the same tool*.
      *   **The Resolution via Rejecting (2):** The conditionalization theorem (Greaves & Wallace) assumes the agent is *already coherent* and is evaluating *only* conditional plans defined over a partition of possible evidence propositions. Your "discount the evidence" plan is *not* a standard conditional plan; it's an instruction to violate conditionalization based on prior knowledge. Crucially, **the dominance argument for coherence is untouched by this scenario.** The problem arises because you applied expected accuracy maximization *without* the presupposition of coherence and within a context (prior knowledge of misleading evidence) that the conditionalization derivation doesn't explicitly handle. The program can respond: *Coherence* (via dominance) is fundamental and objective; *conditionalization* (via expected accuracy) is a norm for coherent agents within their epistemic perspective, even if it sometimes mandates updating towards false beliefs when evidence is misleading. The tension exists, but it doesn't *refute* the derivation of conditionalization; it highlights its agent-relativity and scope.
      *   **What You Lose:** The dream of a single, unified, agent-relative principle generating *all* norms. You must accept that the justification for conditionalization *is* opinion-dependent, while the justification for coherence is not.

  2.  **"Reckless Belief" & Opinion-Dependence (Your Points 4 & 5):**
      *   **The Conflict:** Expected accuracy maximization (EAM) *can* require high credence in a proposition you think is probably false (e.g., due to the convexity of proper scoring rules like Brier). EAM *is* inherently opinion-dependent – it mandates what seems best *by your lights*, even if your lights are bad.
      *   **The Resolution via Rejecting (2):** The "reckless belief" point primarily targets the EAM *justification for conditionalization and other norms derived similarly*. **It does not threaten the dominance justification for coherence.** The dominance argument shows incoherent credences are *objectively* accuracy-defective (dominated) *regardless* of the agent's opinions. An agent with systematically bad credences is *required by dominance to be coherent* (to avoid being dominated), but is *permitted (even required) by EAM to have inaccurate coherent credences* within their flawed perspective. Epistemic rationality, on this view, has two layers: an objective, opinion-independent requirement of coherence (avoiding dominance) and an agent-relative requirement to maximize expected accuracy *within* the coherent options (which includes updating via conditionalization). The "miscalibrated agent" is *mandated* to be coherent (dominance) and *mandated* to follow EAM (conditionalization, etc.) from their perspective. This *does* make part of epistemic rationality (the updating part) hostage to opinion.
      *   **What You Lose:** The hope that accuracy-first provides a fully objective, non-perspectival account of *all* epistemic norms. You must accept perspectivism (opinion-dependence) for norms like updating.

  3.  **The Dilemma for Dominance (Your Anticipated Reply & Rejection):**
      *   **Your Dismissal Holds Partially:** You correctly identify the key issue: the scope of the dominance quantification.
      *   **Unrestricted (Global) Dominance:** Leads to vacuity (as you note) because for any credence function, there's usually *some* world where an alternative is better. *This is not the dominance argument used for coherence.*
      *   **Restricted (Local/Pragmatic) Dominance:** Quantifies only over worlds the agent deems possible (credence >0). This *is* opinion-dependent and vulnerable to your point (5). *This is also not the standard dominance argument for coherence.*
      *   **The Accuracy-First Dominance Argument:** Uses **necessary domination**: Credence function **c** is dominated by **c'** if **c'** is *more accurate than* **c** *in every possible world* (or every world in the relevant partition for the argument). Crucially, **c'** must be *more accurate everywhere*, not just where the agent has credence. This avoids vacuity because coherent functions *are* undominated in this sense, while incoherent ones *are* necessarily dominated by coherent ones (proven under mild conditions). **This dominance is objective and not hostage to the agent's opinions.** An agent's credences about which worlds are actual are irrelevant to whether **c** is dominated by **c'** *in every logically possible world*. Your dilemma misses this third option, which is the one actually used for coherence.
      *   **Limitations:** This dominance argument works brilliantly for coherence (probabilism). Its applicability to other norms (e.g., the Principal Principle) is more contentious and often requires additional assumptions. It is generally *not* the tool used to justify conditionalization – that's EAM's job.

  ### Do Expected-Value and Dominance Routes Come Apart? When and Why?
  *   **Yes, They Diverge:** This is crucial.
      *   **Coherence:** Dominance (necessary domination) succeeds objectively. Expected Accuracy Maximization (EAM) applied naively *could* endorse incoherence if the agent assigns zero credence to worlds where the incoherence is punished harshly (though proponents argue proper scoring rules prevent this, it's subtle). Dominance is the primary, robust justification here.
      *   **Conditionalization:** EAM (assuming coherence) succeeds in justifying it *relative to the agent's credences*. Dominance arguments for conditionalization are much harder to formulate and less successful. Attempts often involve diachronic dominance or non-standard dominance concepts and face significant challenges (e.g., the Ticking Bomb case). **This is the key divergence:** Coherence is secured by objective dominance; conditionalization is secured by perspectival EAM.
  *   **When They Diverge:** Precisely in cases like your discounting evidence scenario (Point 3) and "reckless belief" (Point 4). Dominance (for coherence) might forbid a plan *because it's incoherent*, while EAM (for updating) might endorse a *coherent* plan that seems reckless or discounts evidence *from the agent's current perspective*. EAM can mandate beliefs/plans that dominance doesn't speak to (as long as they are coherent) and that seem epistemically dubious externally.

  ### Can Dominance Carry the Weight? Difficulties?
  *   **For Coherence:** Yes, powerfully and objectively. Difficulty: Requires accepting that avoidance of necessary domination is a fundamental epistemic norm. Some find dominance too "pragmatic" or question why we should care about accuracy in worlds we know are impossible.
  *   **For Other Norms (e.g., Conditionalization):** Much harder. Diachronic dominance arguments are complex, often require auxiliary assumptions (e.g., ratification), and are vulnerable to counterexamples. EAM is generally seen as the more successful route for updating, despite its perspectival nature. Dominance struggles to directly generate updating rules.

  ### What to Keep? Master Principle or Theorems?
  *   **Keep the Theorems, Ditch the Unified Master Principle (1).** This is the survivable path for the accuracy-first program.
  *   **What the Survivor Amounts To:**
      1.  **Accuracy** remains the fundamental epistemic good.
      2.  **Coherence (Probabilism)** is justified **objectively** via **dominance arguments** (avoiding necessary accuracy-domination). This norm is not hostage to the agent's opinions.
      3.  **Conditionalization** is justified **relative to the agent's current coherent credences** via **expected accuracy maximization** over available updating plans. This norm *is* perspectival.
      4.  **Other norms** (e.g., the Principal Principle) may be justified by further arguments (often involving dominance or extensions of EAM), but these are more contested.
  *   **Costs:** You lose the simplicity of a single master principle. Epistemic rationality becomes hybrid: a core objective requirement (coherence via dominance) combined with perspectival requirements (updating via EAM). This hybrid view must bite the bullet that conditionalization can mandate moving towards false beliefs when evidence is misleading (Point 3) and can endorse "reckless" beliefs if the expected accuracy payoff is high enough *by the agent's lights* (Point 4). It also accepts that the justification for updating is opinion-dependent (Point 5), though the requirement *to be coherent* is not.

  ### Conclusion
  Your argument succeeds in showing that a **single, uniform master principle** like (1) – applied to justify *both* coherence *and* conditionalization via expected accuracy maximization – leads to contradictions (discounting evidence vs. deriving conditionalization) and unpalatable consequences (mandated "reckless" belief, opinion-dependence). However, the accuracy-first program, as actually developed by its leading proponents, **does not rely on such a uniform principle.** By rejecting Step (2) – the claim that *all* flagship theorems rely uniformly on (1) – the core results can be preserved. Coherence stands on objective dominance grounds, immune to your opinion-dependence objections. Conditionalization stands on perspectival expected accuracy grounds, which *does* make it vulnerable to your scenarios (Points 3-5), but this vulnerability is a feature of its justification, not a refutation. The accuracy-first program survives, not as a monolith, but as a layered theory: objective dominance securing coherence as the foundational norm, and perspectival expected accuracy guiding rational updating and other choices *within* the space of coherent states.
