  ## OFFICIAL RACE PROGRAM
  **PARLIAMENTARY RACING AUTHORITY OF VERIDIA**  
  **LEGISLATIVE MEETING: SPRING SESSION, DAY 18**  
  **TRACK: NATIONAL ASSEMBLY HALL, CAPITAL CITY**  
  **POST TIME: 09:00 STANDARD VERIDIAN TIME**

  **NOTICE TO PATRONS:** All markets settle on the Official Gross National Satisfaction Metric (GNSM) as calculated by the Handicapper’s Office 12 months post-enactment. The GNSM formula, ratified by popular referendum Year 1 of the Republic (Constitutional Act I), remains in force. Definitional queries should be directed to the Handicapper’s Office publication desk; patron inquiries regarding the formula itself (including seasonal requests from Mr. E. Vance, Seat B-12) cannot be accommodated. **Remember: The Metric Measures What the Office Measures.**

  **VOTING & STAKEHOLDING:** Your annual Values Ballot (Race 1) carries equal weight. In all subsequent Policy Races, your conviction finds its true voice – your financial stake determines the volume of your wisdom. The Authority celebrates this elegant weighting: **where belief meets bankroll, clarity prevails.**

  ---

  **RACE 1: VALUES HANDICAP (ANNUAL)**
  *   **Distance:** Universal Suffrage (One Patron, One Vote)
  *   **Purse:** Setting National Priority for Policy Races 2-7
  *   **Track Condition:** Firm
  *   **Morning Line / Post Time**
      1.  **#1 Maximize Median Household Disposable Income:** 3/5 Fav, **1/2**
      2.  **#2 Minimize National Crime Index:** 5/2, **7/2**
      3.  **#3 Increase Average Lifespan:** 4/1, **9/2**
      4.  **#4 Maximize Protected Wilderness Area:** 20/1, **25/1**
      *   **Winner: #1 (1/2)**. Efficiently settled. Policy Races 2-7 now target **Maximize Median Household Disposable Income**.

  **RACE 2: POLICY MAIDEN CLAIMING (Conditional)**
  *   **Distance:** Bill V-742: Subsidize Domestic Solar Panel Manufacturing
  *   **Purse:** GNSM Impact Differential (Passed Implementation vs. Status Quo)
  *   **Track Condition:** Yielding (Commodity Price Uncertainty)
  *   **Condition:** "Win" = GNSM Higher *If Passed* Than *If Not Passed*
  *   **ML / PT**
      1.  **#1 PASS:** 6/4, **5/4**
      2.  **#2 FAIL:** 4/5 Fav, **Evens**
      *   **Winner: #1 PASS (5/4)**. Market projected stronger GNSM under subsidy than without. Projected cost outweighed by long-term energy savings and job creation per market consensus.

  **RACE 3: POLICY ALLOWANCE**
  *   **Distance:** Bill T-119: Tax Deduction for Telecommuting Expenses
  *   **Purse:** Projected GNSM Level (Direct)
  *   **Track Condition:** **Liquidity: Thin, Final price set by late wager (Dr. L. Chell, DDS)**
  *   **ML / PT**
      1.  **#1 PASS:** 2/1, **7/2**
      2.  **#2 FAIL:** 1/2 Fav, **1/3 Fav**
      *   **Winner: #2 FAIL (1/3)**. Market confidence clearly favoured rejection despite morning line. A single late, substantial wager on FAIL solidified the odds shift. The Authority notes the market efficiently incorporated Dr. Chell’s assessment of reduced urban productivity; liquidity concerns are unfounded where conviction is strongly expressed.

  **RACE 4: POLICY STAKES**
  *   **Distance:** Bill R-405: Mandate River Buffer Zones for New Industrial Sites
  *   **Purse:** Projected GNSM Level (Direct)
  *   **Track Condition:** Good
  *   **ML / PT**
      1.  **#1 PASS:** 5/2, **2/1**
      2.  **#2 FAIL:** 2/5 Fav, **4/9 Fav**
      *   **Winner: #1 PASS (2/1)**. Significant late money favoured PASS, countering initial projections. **Stewards' Inquiry:** Trader A. Kael (large PASS backer) investigated for attempting to move the price to ensure passage. Ruling: **No Action.** Trader Kael acted on genuine belief Bill R-405 would improve GNSM. His wager *was* the market incorporating his information. This is how the track learns. Case closed.

  **RACE 5: POLICY CLAIMING**
  *   **Distance:** Bill S-088: Standardize School Lunch Nutritional Requirements
  *   **Purse:** Projected GNSM Level (Direct)
  *   **Track Condition:** Fast
  *   **ML / PT**
      1.  **#1 PASS:** Evens, **10/11 Fav**
      2.  **#2 FAIL:** Evens, **5/4**
      *   **Winner: #1 PASS (10/11)**. Steady market consensus predicted a modest GNSM gain from standardization and health outcomes.

  **RACE 6: POLICY HANDICAP**
  *   **Distance:** Bill F-301: Fund New National Archives Building
  *   **Purse:** Projected GNSM Level (Direct)
  *   **Track Condition:** Soft (Budgetary Constraints)
  *   **ML / PT**
      1.  **#1 PASS:** 7/4, **6/4**
      2.  **#2 FAIL:** 4/6 Fav, **4/5 Fav**
      *   **Winner: #2 FAIL (4/5)**. Market deemed immediate costs outweighed cultural benefit within the GNSM timeframe.

  **RACE 7: POLICY SPRINT**
  *   **Distance:** Bill P-655: Permit Commercial Beehives in Urban Parks
  *   **Purse:** Projected GNSM Level (Direct)
  *   **Track Condition:** Firm
  *   **ML / PT**
      1.  **#1 PASS:** 5/1, **11/2**
      2.  **#2 FAIL:** 1/6 Fav, **1/8 Fav**
      *   **Winner: #1 PASS (11/2)**. Significant late drift towards PASS on revised pollination benefit estimates. **Photo Finish Review:** Post-enactment GNSM calculation depended critically on whether "recreational enjoyment of parks" (GNSM Subcomponent 7c) included "absence of bee stings." Handicapper's Office ruled sting avoidance *is* a component of enjoyment. **Result Stands: PASS.** Per Rule 4.1a, markets settle on the Office's final GNSM call. (See also Year 12 Inquiry: "Fish Stock Sustainability" definition vs. "Recreational Angler Catch Rate" – ruling stood despite subsequent biological review).

  ---

  **SCRATCHINGS (Markets Failed to Open):**
  *   **Bill D-212 (Establish National Poet Laureate):** Insufficient interest. No defined GNSM impact consensus.
  *   **Bill M-477 (Regulate Moonlighting for Civil Servants):** Conflict with Rule 3.2 (Markets requiring internal enforcement mechanism).
  *   **Bill G-033 (Rename Capital City Square):** Purely symbolic. No quantifiable GNSM pathway proposed.

  **OFFICIAL PAYOUTS:** Settled according to market results 12 months post-enactment. **Patron Advisory:** Remember, backing the losing side of a policy race means your assessment of the GNSM outcome was incorrect. While you forfeit your stake, take pride: the market's superior wisdom guided Veridia towards a higher GNSM. The nation won. Your contribution to price discovery remains valued. Collect winnings at Teller Window 3.

  ---

  **TIPS FROM "THE INSIDE RAIL" WITH MARTIN SCOPE**  
  *"Seeing the future? I just read the market deeper! My premium legislative forecasts (only 50 V-dollars/race!) pinpoint *why* the price moves before it moves. Why pay me? Because the track price tells you *what*, Scoop tells you *why* – and timing is everything! Get the edge the market itself hasn't fully priced yet! Visit kiosk 7."*
