  So for the memo, we'll have two criteria that both fit the six cases but may differ on case 7.

  **Surviving Criteria:**

  1. **Criterion A: Integrated Aversiveness**  
     The state counts as pain if the subject reports the experience as aversive (e.g., by rating high unpleasantness or expressing a desire to stop) and the report is not contradicted by behavioral evidence of non-aversiveness (e.g., not using an available escape option or willingly repeating the experience without reason), or if there is behavioral evidence of aversion that cannot be explained without conscious aversiveness.  
