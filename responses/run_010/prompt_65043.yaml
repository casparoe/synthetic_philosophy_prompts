  - File 5: report of aversiveness (unpleasantness) and no behavioral evidence of avoidance? But the subject did not have an opportunity to avoid? He could have terminated but didn't. So no avoidance behavior. But the report was not contradicted because he had a reason (the practice he values). So if we interpret "not contradicted" as not having conflicting evidence, then file 5 counts because there is no behavioral evidence of non-aversiveness (like not avoiding when he could) but he had a reason. Actually, in file 5, there is no avoidance, which might be seen as contradicting the report of unpleasantness, but the group accepted the report. So perhaps we have to allow that a reason can explain the lack of avoidance.

  Alternatively, we can have:

  **Criterion Beta (Aversiveness in Experience):** The state counts as pain if the subject reports the experience as aversive (unpleasant and/or wanting it to stop) and there is no evidence that the report is insincere or that the subject is not experiencing the aversiveness. Behavioral evidence of non-aversiveness (like not avoiding when possible without reason) can indicate that the report is not credible.

  In file 1: the report of pain might be taken as reporting aversiveness, but the subject explicitly said she wasn't bothered and didn't avoid, so the report is not credible -> does not count.
  In file 5: the report of unpleasantness is credible because the subject has a reason for not avoiding (the valued practice) -> counts.
  In case 7: the report of wanting to stop is not credible because the subject had the opportunity to stop (the switch) and didn't, and booked again -> does not count.

  To separate, let's define two criteria:

  **Criterion I (Requires Behavioral Manifestation):** The state counts as pain if there is behavioral or physiological evidence of aversion (withdrawal, escape, task degradation, autonomic changes, or subsequent avoidance) that cannot be explained as reflexive. In the absence of such evidence, it does not count, even with a report of aversiveness.

  This criterion fails file 5 because there was no behavioral evidence of aversion (the subject did not avoid) and it was counted.

  **Criterion II (Report Sufficient with Consciousness):** The state counts as pain if the subject reports the experience as aversive (unpleasant and/or wanting it to stop) and there is no strong evidence that the report is not credible (e.g., from behavioral incongruence or deception). This would count file 1 and case 7, but the group did not count file 1.

  So we need a criterion that falls in between.

  Given the group's record, the only criteria that survive are those that do not require behavioral evidence but do require that the report of aversiveness is credible and not contradicted.

  For case 7, if the group rules "does not count", then the criterion is that report of aversiveness must be consistent with behavior; if not, it is not credible.

