     - Case 7: The report of wanting to stop is evidence for aversiveness, and the lack of behavioral response might be due to the context (analgesic trial) or individual differences. The group might see the report as sufficient, especially since in file 5 they accepted report without avoidance. But in file 5, the subject did not report wanting to stop. Here, the report of wanting to stop is contradicted by behavior. It could go either way, but the criterion might yield indeterminate because of conflict.

