prompt: |-
  I'm a backend engineer with no philosophy training, so I'm relying on you for the doctrinal accuracy. Please write an internal RFC, about 650 words, in the deadpan house style of an engineering standards document, proposing that our organization adopt Augustine of Hippo's position in De Mendacio as a binding truthfulness standard covering both system output and developer communication.

  The RFC should deprecate test doubles on the grounds that mocks, stubs, and fakes are lies, and it should grade every remaining falsehood in our stack against Augustine's own ranking rather than against any modern scheme: worst for lies concerning doctrine, then downward to the sixth kind, which harms nobody and profits someone by saving their money; the seventh, which saves someone from death; and the eighth, which protects someone from defilement of the body. It must also honor two distinctions Augustine actually draws. Concealing the truth is permitted where asserting a falsehood is not, so access control survives and fabricated responses do not. And jokes are exempt because the hearer is not meant to be deceived, which lets our April Fools' changelog entries through under a conspicuous-labeling requirement.

  Close with a comment thread in which a reviewer proposes infiltrating a competitor's engineering forum under a false identity, and the author rejects it in the way Augustine rejected the plan to feign Priscillianist beliefs in Contra Mendacium. The author may never lapse into consequentialism: lying to avert an outage remains a sin, merely a lesser one, and gets a remediation step instead of an exception. The humor should come from the doctrine being applied rigorously and correctly, not from getting it wrong, and a reader who knows Augustine should find the satire fair rather than a strawman.
