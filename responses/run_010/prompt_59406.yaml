prompt: |-
  You're going to be a forecasting methodologist with a philosophy-of-science background — someone who's thought hard about base rates, reference classes, and the inside/outside view — but I want you to treat this as a live puzzle, not a lecture. I already know the standard story. The standard story doesn't fit my own head, and I want you to think carefully about why.

  Context, so you know where this is coming from: six months ago I quit a salaried job to start a small business with two friends, I got weirdly addicted to a prediction tournament site around the same time, my mom got a diagnosis in the spring, and my city is about to break ground on a light rail line that I've been loudly complaining about. So I've been living inside this question from four directions at once.

  Here are my verdicts. I'm confident about some of them and at least two are obviously in tension and I can't tell which to give up.

  1. The rail line. The people running it have a detailed bottom-up cost estimate. I think that estimate should be close to ignored in favor of the base rate for projects like it — most come in way over and way behind. Outside view wins, no contest. When I said this at a council meeting someone called me a fatalist and I didn't think that was a real objection.
  2. My business. Base rate for new small businesses: a lot of them are gone within five years. I think that's the right starting point for me too, and that my reasons for feeling different (two paying customers, twelve years in the industry) license an adjustment, not an exemption. I also think I'm probably rationalizing, so the adjustment should be smaller than it feels like it should be.
  3. My mom. Her oncologist said something to the effect of "you're not a statistic, we treat the patient in front of us." I think the numbers DO apply to her, that the line is comfort and not argument, and that ignoring them would be a mistake.
  4. My marriage. If you asked me for a number based on the divorce base rate I'd say that's insulting and also just wrong — that rate doesn't apply to us. I have no good account of why this differs from 3. I know how bad that sounds.
  5. Empires. I don't think base rates work here. There have been a handful of great powers, they aren't interchangeable, and "the average empire lasts N years" isn't measuring anything, it's picking a number. And yet I do think the story of Roman overextension tells me something real about my own country over the next twenty years. Not a probability. Something.
  6. My cousin, first in her family to apply to college. I think it would be wrong — wrong epistemically, not just unkind — to tell her the rate at which kids from her high school finish a degree. Because if she takes the number seriously it helps make the number true, and if she ignores it the number stops being about her. It's Lucas-critique shaped, I think: the forecast changes what's forecast. I don't think this is a special plea. I think it names a feature some base rates have and others don't.
  7. Things with no class at all, like a date for some technology milestone. I claim I wouldn't forecast without a reference class. In practice I'll happily give a confident number. I think that number is unjustified and I should either find a stretched analogy or say I don't know.

  My tentative principle: take the outside view when (a) there's a class with enough members that the rate means something, (b) the members are similiar enough to be exchangeable with my case, (c) my private information isn't stuff the base rate already reflects — plus (d) don't take the outside view when acting on the forecast would change the forecast.

  What I want:
  - Brainstorm out loud first. Five candidate principles before you settle on anything, including one much simpler than mine and one much stranger.
  - Then the best principle, or a small set, stated precisely clause by clause, with the case from my list that motivates each clause.
  - Honest accounting of which of my seven verdicts it can't save, and which one you'd tell me to drop. I expect it's 4 or 5. If it's 4, I want the full argument, because I've defended 4 to my wife in terms I'd have to eat.
  - Its verdicts on cases I didn't list: whether the new downtown arena will make money, whether a specific foreign government survives the decade, how long I personally will live, whether my friend's first novel gets picked up, whether my competitor folds next year.
  - Whether clause (d) is doing real work or is a bias-license I've dressed up — is there a non-question-begging test for which base rates are endogenous and which aren't?
  - For 5: what would a legitimate non-frequency use of the past look like, if there is one? Can I learn from Rome without pretending Rome is a data point in a sample?

  No bibliography, no reading list, no citations — I can't look anything up, and invented references are worse than none. If you're unsure a particular study or number exists, describe the idea generically instead. Don't flatter me. I'd rather lose one verdict than keep all seven at the price of a principle with nine clauses in it.
reasoning: |-
  Hmm, the user has presented a fascinating puzzle about when to apply base rates versus inside views across deeply personal and societal contexts. They've clearly wrestled with this philosophically and practically, given their life events - quitting a job for a startup, mom's diagnosis, civic engagement on infrastructure, marriage concerns. 

  The core tension shines through: they reject base rates for marriage (#4) but accept them for mom's cancer (#3), and this inconsistency bothers them intellectually. Their proposed principle (a-d) is thoughtful but they're suspicious of their own clause (d) about endogenous forecasts. 

  What makes this tricky:
  - The cases range from statistical (business failure rates) to existential (marriage)
  - Some involve agency (cousin's college success) while others don't (rail project delays)
  - Their verdict on empires (#5) suggests they want historical analogies to work differently from frequencies

  Noticing their meta-request: no academic citations, no flattery, and willingness to abandon positions. They want rigor without pretense. The "Lucas critique" mention hints at economics literacy but they're rejecting textbook answers.

  Key contradictions to resolve:
  1. Why cancer statistics apply (#3) but marriage statistics don't (#4) - is this just emotional bias?
  2. How empires (#5) provide "something" without being data points
  3. Whether clause (d) is legitimate or self-deception

  Their rail project stance (#1) seems solidly outside-view, while the cousin case (#6) reveals genuine concern about self-fulfilling prophecies - this suggests (d) might have merit if properly bounded.

  For the brainstorm, considering:
  - A strict frequentist principle (base rates always first)
  - A consequentialist version (use outside view only when errors hurt less)
  - A "narrative coherence" alternative for unique cases
  - Their own (a-d) but refined
  - A radical "decision-offload" principle for emotional cases

  The marriage case (#4) feels like the hinge - if the principle can't honestly handle that, they'll need to either abandon their stance on cancer stats or admit special pleading. But maybe there's a distinction: marriage statistics aggregate incompatible couples, while cancer stats reflect biological processes unaffected by mindset. 

  For empires (#5), historical analogies might work as cautionary parables rather than probabilities - showing failure modes, not failure rates. Like reading case studies, not running regressions.

  Testing clause (d): endogenous base rates exist when:
  - The outcome depends on belief in the forecast (cousin's college)
  - The forecaster is part of the system (their business)
  Exogenous when:
  - No feedback loops (rail project)
  - Biology-driven (mom's prognosis)

  Cases to probe the principle:
  - Downtown arena: outside view (similar projects' performance)
  - Friend's novel: inside view (unique artistic product)
  - Competitor folding: blended (industry failure rates adjusted for their cash reserves)

  Final principle should have teeth - if it says they're wrong about marriage, say so. They'd respect that more than squishy compromise.
answer: |-
  Okay, let's treat this like the live puzzle it is. No standard story, no flattery. You've got seven verdicts wrestling in your head, demanding a principle that doesn't collapse under its own weight or require sacrificing your intellectual honesty. Let's start raw.

  **Brainstorm: Five Candidate Principles (Before Settling)**

  1.  **The Strict Frequentist Lockdown:** *Always start with the most specific, well-defined, relevant reference class base rate. Only adjust minimally via Bayes with truly unique, quantifiable evidence.*
      *   *Why it's simple:* It ruthlessly enforces the outside view. Verdicts 1, 2, 3 become straightforward. Verdict 4 (marriage) gets crushed: "Start with divorce rate." Verdict 5 (empires) struggles ("Define 'empire' rigorously"). Verdict 6 (cousin) is forbidden ("Give the base rate"). Verdict 7 (tech) forces painful uncertainty or arbitrary classes. *Problem:* Feels inhuman, ignores agency/narratives, fails your "something" from Rome.
  2.  **The Consequentialist Switch:** *Use the outside view when errors from ignoring it are likely catastrophic *and* you lack unique control. Use the inside view when errors from misapplying base rates are catastrophic *or* you have significant control/agency.*
      *   *Why it's strange:* Makes epistemology servant to stakes/control. Rail (1): Catastrophic cost overruns, no control -> Outside View. Mom (3): Catastrophic if ignore stats -> Outside View. Business (2): Moderate stakes, high agency -> Inside View *allowed*. Marriage (4): Catastrophic error if misapply base rate (self-fulfilling despair?), high agency -> Inside View *mandated*. Cousin (6): Catastrophic if base rate demoralizes, high agency -> Suppress base rate. Empires (5): Catastrophic if ignore lessons, no control -> Narrative/"Something" allowed. Tech (7): High uncertainty, variable stakes -> Context-dependent. *Problem:* Subjective, risk of motivated reasoning ("*my* stakes are always high!").
  3.  **The Narrative Coherence Filter:** *Use base rates as a *reality check* against compelling, coherent, *falsifiable* inside-view narratives. If the narrative uniquely explains deviations from the base rate *and* withstands scrutiny, discount the base rate. Otherwise, anchor on it.*
      *   *Why it fits some tensions:* Rail (1): Project narrative likely self-serving, incoherent under scrutiny -> Ignore, use base rate. Mom (3): "I'm not a stat" narrative unfalsifiable -> Use base rate. Business (2): Narrative ("paying customers, experience") falsifiable? Maybe, warrants *small* adjustment. Marriage (4): "We're different" narrative highly coherent/falsifiable (daily evidence)? -> License to discount base rate. Empires (5): Rome provides a coherent, falsifiable narrative *pattern* (overextension) -> Legitimate "something" without frequency. Cousin (6): Base rate *is* the counter-narrative; forcing it might break her coherent narrative -> Suppress. Tech (7): Need a narrative *or* base rate -> Uncertainty unless you have one. *Problem:* Defining "coherent/falsifiable narrative" is messy. Risk of self-deception remains high.
  4.  **The Endogenous/Exogenous Split:** *Use base rates for *exogenous* processes (things that happen *to* you/the system). Rely on inside view/agency for *endogenous* processes (things you/the system *does*).*
      *   *Why it targets your (d):* Rail (1): Exogenous (bureaucracy, market forces) -> Outside View. Mom (3): Exogenous (biology) -> Outside View. Business (2): Endogenous (your actions) -> Inside View primary. Marriage (4): Endogenous (your joint actions) -> Inside View. Cousin (6): Endogenous (her effort/response) -> Inside View, suppress demotivating base rate. Empires (5): Mixed? Overextension feels endogenous (policy choices). *Problem:* Where does biology end and agency begin (e.g., lifestyle impacting mom's prognosis)? Is business failure truly endogenous (market shocks)? Blurry line.
  5.  **The Reference Class Legibility Test (Your (a-c) + d, Refined):** *Anchor on the outside view if: (a) A well-defined, relevant reference class exists with sufficient N. (b) Units are reasonably exchangeable *on the causal factors for the outcome*. (c) Your private info isn't *already reflected* in the base rate distribution. (d) The outcome is *exogenous* to the agent's belief in the forecast. If (d) fails, suppress/downweight the base rate and focus on agency/narrative.*
      *   *Why it builds on yours:* Explicitly adds causal exchangeability (b) and tackles endogeneity (d). Rail (1): Passes a-c, d (exogenous) -> Outside View wins. Mom (3): Passes a-c, d (exogenous) -> Outside View wins. Business (2): Passes a (class exists) but b (exchangeability on *causes* of failure?) and c (private info?) are arguable -> Outside View anchor, *small* adjustment allowed. Marriage (4): Fails d (endogenous - belief affects effort) -> Suppress base rate, Inside View focus. Cousin (6): Fails d (endogenous) -> Suppress base rate. Empires (5): Fails a (no defined class) and b (non-exchangeable) -> Base rate invalid; narrative/"something" is pattern-matching, not forecasting. Tech (7): Fails a/b -> Must admit uncertainty or rely on weak analogy. *Problem:* Requires careful causal thinking. "Causal factors for the outcome" is demanding.

  **The Best Principle (Refined "Reference Class Legibility Test") - Clause by Clause with Motivation**

  After wrestling, your core principle (a-d) feels closest to capturing the nuances, especially your insight on (d). But it needs sharpening, particularly on exchangeability and the nature of endogeneity. Here's the precise version, motivated by your cases:

  1.  **Apply the Outside View (Anchor on Base Rate) IF:**
      *   **(a - Meaningful Class):** A relevant, well-defined reference class exists with sufficient historical instances (N) for the base rate to be stable. *Motivation: Empires (5) - No such class exists, so base rate is meaningless. Tech Milestone (7) - Often fails, forcing uncertainty.*
      *   **(b - Causal Exchangeability):** The units in the class are reasonably exchangeable with your specific case *regarding the dominant causal factors influencing the outcome*. *Motivation: Rail (1) - Projects are similar on key causal factors driving overruns (optimism bias, political pressure). Mom (3) - Patients are exchangeable on the biological mechanisms targeted by the statistic. Business (2) - Requires scrutiny: Are *causes* of failure in small businesses (market fit, execution, capital) similar enough for your case?*
      *   **(c - Non-Redundant Information):** Your private, inside-view information does *not* consist of factors already reflected in the *distribution* of outcomes within the base rate class. *Motivation: Business (2) - "Twelve years experience" might be common in the base rate class; "two paying customers" might be early signal or noise. Adjustment should be small if info is common.*
      *   **(d - Exogenous Outcome):** The outcome is *not* meaningfully caused or altered by the agent's (or relevant actors') *belief in the forecast itself*. *Motivation: Rail (1) - Project managers' belief in their estimate doesn't change physics or bureaucracy. Mom (3) - Her belief in the stat doesn't change tumor biology (though it might affect treatment adherence, a separate factor).*

  2.  **Suppress/Downweight the Base Rate and Rely Primarily on Inside View/Agency/Narrative IF:**
      *   **(d fails - Endogenous Outcome):** The outcome *is* significantly influenced by the agent's (or relevant actors') belief in the forecast, creating a feedback loop. *Motivation: Cousin (6) - Belief in the low graduation rate can cause demotivation, making failure more likely. Marriage (4) - Belief in divorce statistics can erode commitment/effort, becoming self-fulfilling.*
      *   **(a or b fail - No Legitimate Class):** If a legitimate reference class meeting (a) and (b) cannot be found. *Motivation: Empires (5) - Forces reliance on narrative pattern-matching ("Roman overextension") as qualitative insight, not quantitative forecast. Tech Milestone (7) - Forces uncertainty or weak analogy.*

  **Honest Accounting: Verdicts This Principle Can't Save & Which to Drop**

  *   **Saved (Fits Well):**
      *   1 (Rail): Passes a, b, c, d -> Outside View wins.
      *   3 (Mom): Passes a, b, c, d -> Outside View wins (the "comfort not argument" line *is* important, but doesn't invalidate the stat).
      *   6 (Cousin): Fails d (Endogenous) -> Suppress base rate. Focus on agency/narrative.
      *   7 (Tech): Often fails a/b -> Should admit uncertainty or use weak analogy reluctantly. Your "confident number" is unjustified.

  *   **Saved, But With Friction (Requires Careful Application):**
      *   2 (Business): Passes a (class exists). b (Causal Exchangeability) is debatable – how unique are your *causes* of success/failure? c (Non-Redundant Info) is debatable – how unique is your info? Principle mandates **starting** with base rate and allowing only a **small adjustment** if strong, unique causal factors/info exist. Your "smaller than feels right" adjustment is correct. Friction point: It's easy to overestimate uniqueness (b/c) here.
      *   5 (Empires): Fails a/b -> Base rate invalid. Principle *allows* the "something" from Rome as **qualitative pattern-matching/narrative insight**, *not* as a frequency-based forecast. This matches your intuition ("Not a probability. Something.").

  *   **Can't Save & Must Drop:**
      *   **4 (Marriage):** This is the one to drop. Here's the full argument:
          *   The divorce base rate *does* apply to the class "marriages" of which yours is a member. It passes (a) and (c). Does it pass (b)? While marriages aren't perfectly exchangeable, the *causal factors* leading to divorce (communication breakdown, loss of commitment, financial stress, external pressures) *are* general enough that your marriage isn't causally unique *in a way that immunizes it*. You experience the same human vulnerabilities.
          *   Crucially, it passes (d) *only partially*. While belief *can* be endogenous (believing divorce is likely might make you invest less effort), the core outcome (the health of the relationship) is driven by endogenous factors *you control* (effort, communication, choices). The principle says if the outcome is endogenous to agency (which it is), you should focus *there*, not on the base rate. However, your outright dismissal ("that rate doesn't apply to us") is the problem.
          *   **The Principle's Verdict:** The base rate provides a valid *prior* about the inherent difficulty of sustaining a marriage. Failing (d) perfectly means you shouldn't obsess over it or let it dictate fatalism. But dismissing it entirely ("doesn't apply to us") is the mistake. It *does* apply as a starting point about the terrain. Your confidence should stem from the strength of your *ongoing endogenous actions* (the inside view of your daily relationship) overcoming that prior, not from an *exemption* claimed at the start. You eat the words "doesn't apply to us." You can say "We beat the odds through conscious effort," not "The odds never applied."

  **Verdicts on New Cases:**

  *   **New downtown arena making money?** Likely passes a, b, c, d (exogenous factors: location, competition, economic trends, construction costs). -> **Anchor on base rate for similar projects** (most arenas/stadia are money losers for cities). Strong inside view needed to justify significant upward adjustment.
  *   **Specific foreign government survives the decade?** Fails a/b (each government/country is highly unique in stability factors; defining the "similar" class is hard). Fails d (belief in forecast can influence coup plotters/investors). -> **Base rate weak anchor at best.** Focus heavily on inside-view narrative analysis of specific vulnerabilities, leadership, opposition, economy.
  *   **How long I personally will live?** Passes a, b (actuarial tables for age/sex/smoking status are valid reference classes). c (Your specific health/family history might be unique). d (Exogenous - biology/accidents). -> **Anchor strongly on base rate (actuarial table).** Adjust modestly up/down for truly unique, quantifiable health info (c). Lifestyle choices (endogenous) are *part of* the base rate class definition (e.g., "non-smoker").
  *   **Friend's first novel gets picked up?** Fails a/b (each novel/author is highly unique; "debut literary fiction" might be a class, but success factors are subjective and non-exchangeable). Fails d (publishers' beliefs are part of the system). -> **Base rate (acceptance rates) is a weak anchor.** Rely heavily on inside view: quality of manuscript, agent strength, current market trends, sheer luck.
  *   **Competitor folds next year?** Passes a (small business failure rates in industry). b (Causal exchangeability? Depends on similarity of business model, market, finances). c (Your private info on their cash burn might be unique). d (Exogenous to *your* belief; their belief might matter). -> **Anchor on base rate.** Adjust modestly based on specific inside-view info about their financial distress (c) if truly unique and significant.

  **Clause (d) - Real Work or Bias License?**

  *   **Real Work:** It identifies a genuinely distinct category. Endogenous base rates aren't just "biased," they are *causally invalidated* when acted upon. The feedback loop breaks the independence assumption underlying frequency-based probability. Your cousin's case (6) is the clearest example: *telling her the number changes the outcome the number describes*. This is fundamentally different from the rail project (1).
  *   **Non-Question-Begging Test:** It's hard, but possible:
      *   *Mechanism Test:* Can you identify a plausible *causal pathway* where *belief in the forecast* by *key actors* directly influences the likelihood of the outcome? (Cousin: Belief -> Demotivation -> Lower Effort -> Higher Failure). (Marriage: Belief -> Reduced Commitment -> Higher Discord -> Higher Divorce Risk). (Rail: Belief in estimate doesn't change geology or contract law).
      *   *Asymmetry Test:* Does the base rate primarily describe outcomes where actors *lacked* the forecast or where the forecast *couldn't* influence behavior? (Divorce stats exist regardless of couples knowing them; graduation stats often reflect environments where the stat *wasn't* emphasized to students).
      *   **Not a Bias License:** The principle doesn't say "ignore base rates whenever you feel like it." It forces a justification based on a *causal mechanism* for endogeneity. You can't invoke (d) for Mom (3) - no plausible mechanism where belief changes tumor biology. You *can* plausibly invoke it for Cousin (6) and Marriage (4) *regarding the use of the base rate itself in decision-making/effort*. For Marriage, the principle still forces you to acknowledge the base rate as a prior; it just shifts focus to agency.

  **Legitimate Non-Frequency Use of the Past (For #5 - Empires):**

  Absolutely. This is **Qualitative Pattern Matching / Narrative Causal Insight**. You're not counting Rome as one data point in "empire longevity.csv." You're analyzing Rome (and others) as *complex case studies* to identify:

  *   **Recurring Failure Modes:** Overextension, internal decay, failure to adapt, rising inequality eroding cohesion, military overreach. ("Ah, *that* pattern looks familiar...").
  *   **Mechanisms & Dynamics:** *How* did overextension lead to collapse? (Strained resources, logistical nightmares, rebellion, military overstretch). Understanding the *process*.
  *   **Analogous Structures:** Identifying similar institutional structures, incentives, or societal pressures that might lead to similar dynamics, even if the actors and scale differ.
  *   **Warning Signs:** What were the precursors to decline in past cases? Can analogous signals be detected now?

  This is learning from history as a source of *qualitative understanding, potential vulnerabilities, and cautionary tales*, not as a frequency generator. It tells you *what to look for* and *why things might go wrong*, not *the precise probability* they will. Your "something real" is this narrative insight into structural vulnerabilities and potential paths to failure. It's valid, useful, and distinct from applying a base rate.
