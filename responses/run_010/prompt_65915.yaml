answer: |-
  Absolutely, let's engage.  

  First, concede freely: yes, your emigrant is physically isolated. Her social network has voted, her ballot is cast by mail from afar, and she has no direct causal link influencing others *this time*. The margin in her specific race might indeed be enormous. Where I push back is on the idea that this isolation makes *her individual instrumental calculation* suddenly well-formed and definitive. The "act" of depositing her mail ballot isn't magically independent just because she's geographically distant. Its meaning and causal power *as a vote* still fundamentally depend on the institutional context and the *category* of actions it belongs to – actions generated by decision rules like "vote if you care about the outcome" or "fulfill your civic practice." These rules are inherently shared, even if her *implementation* of one this cycle is atomized. The probability term isn't *just* about her physical ballot being the one-in-millions literal tie-breaker; it's about whether the collective action *type* she's participating in (citizens voting by mail based on preference) is decisive *as a category*. That probability isn't microscopic because large groups acting under shared decision rules *do* swing elections constantly. Her individual action is an instance of that rule, making her contribution bundled into that decisive collective force. The calculation remains ill-formed because the "act" (her vote) only has its vote-power *by virtue* of being part of this rule-governed mass institution – you can't isolate it for a clean E(U) calculation without stripping it of what makes it a vote in the first place.

  So, does my account say her voting is irrational? **No.** It says the *instrumental cost-benefit calculation attempting to prove its irrationality* is ill-formed *for her too*. The "work" being done is the ontological point about what constitutes the relevant "act" in mass democracy. Her vote is a token of a type generated by overlapping decision procedures embedded in the institution of elections. The calculation fails because it tries to treat her token vote as an independent causal atom, which it isn't. Its causal power is derivative of the type. Granting her physical isolation sharpens the question, but it doesn't resolve the foundational interdependence built into the very concept of casting a ballot in a mass election. The "decisive probability" applicable isn't the ludicrously tiny "P(my ballot is the literal tie-breaker)," but the non-microscopic "P(that the collective action type I'm instantiating with my ballot is decisive)." The Downsian paradox evaporates because it mis-specifies the act and the probability. Her voting can be rational as participation in a collective institution where her action, as an instance of a rule, *is* part of the decisive force, even if her specific causal chain is isolated this cycle.

