prompt: |-
  I am the research-integrity officer at a mid-sized research university. My office investigates allegations of fabrication, falsification, and plagiarism in published work. Roughly once a month a respondent's written answer does not contest the facts we have assembled but contests the standing of the methods by which we assembled them: the image-analysis suite used to conclude that a panel was manipulated has never been validated on images from the instrument that produced it; the finding that records are missing depends on a laboratory logbook that the allegation itself says was written up after the fact; the statistical test showing an excluded outlier was material was selected after the outlier was seen; and, at the outer limit, the claim that an office whose remit is to find misconduct cannot be structurally capable of finding none. Two of my findings in the past three years were set aside on internal appeal on the ground of circularity — the panel held that I had used the contested method to establish the reliability of the contested method. I do not think that criticism was empty, but I also cannot suspend an inquiry every time a respondent names a presupposition, and neither of my two investigators has any training in epistemology.

  What I want is a decision procedure my office can run, and I want it built from whatever is usable in the philosophical discussion of Moore's proof of an external world — the argument that proceeds from a pair of demonstrated hands to the existence of the external world, and the subsequent debate over whether an argument can confer warrant on a conclusion when the warrant for its premises already depends on that conclusion being true. The parts I suspect are portable are: the distinction between an argument's being epistemically in good standing and its being useless for persuading someone who doubts the premises; the idea that some warrant is not evidential at all but is something an inquirer is entitled to proceed on absent specific grounds for doubt; and the opposing insistence that a doubt must have a determinate object before it obliges anyone to answer it. I am not after a survey of that debate, and I do not want a bibliography or a reading list — if this ends up in a policy document I will supply the references myself. I want to know what survives translation into a form two non-specialists can apply under deadline.

  Please deliver the following.

  First, a classification test that can be run on a challenge letter in under two minutes, sorting it into kinds — a challenge that the method fails by its own internal standards; a challenge that the warrant for the method depends on the very conclusion in dispute; a challenge to something no evidence in the proceeding could reach; a challenge that is really an objection to persuasiveness rather than to correctness; and a challenge filed to consume time. Give me the discriminating question for each kind and the tell-tale sentences that signal it.

  Second, an ordered procedure that follows from that classification: the questions to ask in sequence, what counts as a sufficient answer to each, and the default action at each exit — proceed on the record, commission independent validation from a party with no stake in the outcome, suspend, or refer upward. Our constraints are hard: a challenge must be classified within two working days of receipt, a finding must be producible within thirty working days, and any suspension longer than twenty working days requires the provost's signature. We also maintain a standing register of methods whose presuppositions have already been litigated, so that a challenge to a registered method is answered by citing the prior ruling; the procedure must say when a register entry should be reopened and when the register itself becomes a way of freezing a bad ruling in place.

  Third, mark every point at which the procedure must stop and hand the matter to a person because what remains is a question of institutional values rather than fact. Say what those questions are and who should answer them. My adjudication panel is two scientists and one lay member, none of whom will read philosophy.

  Fourth, run the procedure on three cases: the unvalidated image-analysis suite; the logbook that is both the evidence for missing records and the object of the allegation; and the challenge that the office's funding by the institution disqualifies any procedure it runs. For at least one of them, tell me plainly that the procedure yields an outcome I will dislike — obliging me to treat a challenge I consider frivolous as legitimate, or permitting me to dismiss a serious one on grounds that will read as circular in the written findings. Say which case that is and why.

  Fifth, state the failure modes honestly: which of the classification steps are judgment calls dressed up as procedure, how the test can be gamed by a well-advised respondent, and what the procedure cannot decide at all. One further constraint on the drafting: every exit must be justifiable in a single paragraph that a non-specialist panel, and on appeal a lawyer with no patience for philosophy, can follow — which means the written justification may not contain the phrase "begs the question" or any synonym of it, since on appeal those read as admissions. Give me the plain-language substitutes you would have my investigators use instead.
reasoning: |-
  Hmm, this is a complex and fascinating request from a research-integrity officer dealing with methodological challenges in misconduct investigations. They want a practical decision procedure rooted in philosophical concepts from Moore's proof debate, but translated into actionable steps for non-specialists. The constraints are tight - 2-day classification, 30-day findings, and no tolerance for philosophical jargon in justifications.

  The core issues they're facing involve challenges to investigative methods: unvalidated image analysis, retrospective logbooks, statistical methods, and even challenges to the office's structural impartiality. They've had findings overturned due to perceived circularity, and need a robust framework.

  Key philosophical touchstones they mentioned: distinction between epistemic standing vs persuasiveness; entitlement to some warrants absent specific doubt; requirement that doubts have determinate objects. These need operationalization.

  For the classification test (part one), I'm considering five challenge types based on the examples: internal inconsistency challenges, circularity challenges, unfalsifiable challenges, persuasion objections, and dilatory challenges. Each needs clear discriminators - like whether the challenge targets methodology's self-consistency or questions foundational premises.

  The procedure (part two) must sequence responses: first check registry, then assess if challenge is substantive, then determine resolvability. Exit paths include proceeding (for unserious challenges), commissioning validation (for testable doubts), suspending (for structural challenges), or upward referral.

  For institutional handoffs (part three), I'll identify where value judgments are needed - like defining "reasonable doubt" thresholds or institutional trust - and assign these to the adjudication panel.

  Testing on cases (part four): The office-funding challenge will likely yield an "unhappy outcome" where we must treat a challenge as legitimate despite potential frivolousness, since it questions foundational structure.

  Failure modes (part five) include: subjectivity in classifying "specific doubt," gaming through hyper-specification, and inability to resolve true stalemates. Crucially, we'll need plain-language alternatives to "begs the question" - perhaps "self-supporting method" or "presuppositional conflict."

  The solution must balance philosophical rigor with operational practicality, maintaining defensibility while avoiding paralysis. Tight constraints require clear decision points, and all justifications must pass the "lawyer test" - no specialized terminology.
answer: |-
  Here is a practical decision procedure derived from the Moorean insights you specified, designed for operational use by non-specialists under tight deadlines. It focuses on triaging methodological challenges efficiently while maintaining defensibility.

  **First: Classification Test (Under 2 Minutes per Challenge Letter)**  
  *Scan for these tell-tale phrases/questions. Discriminating questions are in bold.*

  1.  **Internal-Failure Challenge**  
      *Discriminating Q:* **"Does the challenge claim the method violated its *own* documented standards or standard practice in the field?"**  
      *Tell-tales:* "The software manual requires calibration for [X] instrument"; "Standard practice in [field] requires [Y] before outlier removal"; "Your protocol wasn't followed as written."

  2.  **Circularity Challenge (Presuppositional)**  
      *Discriminating Q:* **"Does the challenge claim the method *assumes* the conclusion (misconduct) to prove the conclusion?"**  
      *Tell-tales:* "This logbook's accuracy *presupposes* no misconduct occurred"; "You assumed the instrument *wasn't* faulty to prove manipulation"; "Your method only works if fraud *didn't* happen first."

  3.  **Unfalsifiable Challenge (Beyond Evidence)**  
      *Discriminating Q:* **"Does the challenge target something no evidence in *this* proceeding could address?"**  
      *Tell-tales:* "No test can prove this logbook *wasn't* forged later"; "All possible evidence is suspect because the system is corrupt"; "You can't prove the universe wasn't created 5 minutes ago with false records."

  4.  **Persuasiveness Challenge (Not Correctness)**  
      *Discriminating Q:* **"Does the challenge focus on whether the method *convinces skeptics* rather than whether it *supports the finding*?"**  
      *Tell-tales:* "A reasonable person could doubt this"; "This wouldn't hold up in court"; "Other experts might disagree"; "It's not *definitive* proof."

  5.  **Dilatory Challenge (Time-Consuming)**  
      *Discriminating Q:* **"Is the challenge vague, overly broad, or demand impossible proofs unrelated to the specific allegation?"**  
      *Tell-tales:* "Prove *every* logbook entry is authentic"; "Validate the entire software suite for all edge cases"; "Demonstrate no staff member ever made an error"; lacks specific alternative explanations.

  **Second: Ordered Procedure**  
  *Follow sequence. Time triggers: T=0 on challenge receipt. Day 1-2: Classification. Day 30: Finding due.*

  1.  **Check Registry:** Is the challenged method in the standing register?  
      *   **YES & Challenge matches prior ruling:** Cite register entry. **Exit: Proceed on record.**  
      *   **YES & Challenge is NEW type (e.g., new instrument):** Flag for registry update review post-inquiry. Proceed to Step 2.  
      *   **NO:** Proceed to Step 2.

  2.  **Classify Challenge (Use 2-min test above).**  
      *   **Persuasiveness (4) or Dilatory (5):** **Exit: Proceed on record.** (Justification: "Challenge addresses persuadability, not methodological validity for this finding.")  
      *   **Internal-Failure (1):** Proceed to Step 3.  
      *   **Circularity (2) or Unfalsifiable (3):** Proceed to Step 4.

  3.  **Assess Internal-Failure (1): Can it be resolved *quickly* with available evidence?**  
      *   **YES (e.g., method *did* follow its manual):** Document resolution. **Exit: Proceed on record.**  
      *   **NO / Requires new technical validation (e.g., test software on instrument):**  
          *   Can independent validation (e.g., campus core facility, agreed external expert) be commissioned & completed within 20 days?  
              *   **YES:** Commission validation. **Exit: Suspend 20 days max.** (Provost sign-off if >20 needed).  
              *   **NO:** **Exit: Refer Upward to Adjudication Panel** (Justification: "Resolution requires technical work exceeding time constraints; Panel must weigh risk of proceeding vs. suspension.")

  4.  **Assess Foundational Challenge (Circularity (2) or Unfalsifiable (3)): Is there a *specific, testable* doubt raised?**  
      *   **NO (Vague/Global):** **Exit: Proceed on record.** (Justification: "Challenge does not identify a specific, resolvable flaw in the method's application; foundational assumptions stand absent specific doubt." - *Moorean 'Entitlement'*).  
      *   **YES (Specific):**  
          *   Can the specific doubt be resolved *without circularity* and within time?  
              *   **YES (e.g., find corroborating evidence for logbook *not* dependent on it):** Document resolution. **Exit: Proceed on record.**  
              *   **NO (Resolution inherently requires contested method/conclusion):** **Exit: Refer Upward to Adjudication Panel.** (Justification: "Challenge identifies specific foundational doubt unresolvable within inquiry constraints without presupposing conclusion.")

  **Registry Management:**  
  *   **Reopen Entry:** Only if a new, specific, and credible challenge (Type 1 or a *specific* Type 2/3) arises that wasn't considered in the prior ruling, *and* it impacts core validity.  
  *   **Prevent Freezing:** Sunset registry entries after 5 years or major method/tech shifts. Annual review by panel.

  **Third: Institutional Handoff Points & Who Decides**  
  *Hand off to the Adjudication Panel (2 scientists + 1 lay member) for value judgments:*  

  1.  **Defining "Specific, Testable Doubt" (Step 4):** What constitutes a *reasonable* specific challenge to a foundational assumption? (E.g., Is "Prove this single logbook wasn't fabricated post-hoc *without using any lab records*" specific enough? Is it reasonable?).  
  2.  **Weighing Risk in Unresolvable Internal-Failure (Step 3 Exit):** Should the inquiry proceed based on available evidence despite potential unresolved technical questions, or be suspended indefinitely (risking failure to conclude)?  
  3.  **Assessing Unresolvable Foundational Challenges (Step 4 Exit):** Does the specific doubt, even if unresolvable, *genuinely undermine* the finding's basis? Or is the foundational assumption sufficiently warranted for institutional purposes?  
  4.  **Registry Review & Sunsetting:** Judging if a prior ruling on a method's presuppositions remains sound.

  **Fourth: Case Application & Unhappy Outcome**  

  *   **Case 1: Unvalidated Image-Analysis Suite (Challenge: Type 1 - Internal Failure?)**  
      *   Classification: Likely **Type 1 (Internal Failure)** if field standards *expect* validation for that instrument. Check registry. If new, Step 3: Can quick validation be done? If no/time short → **Refer Upward (Panel weighs risk)**. If validatable in <20 days → **Suspend for validation**.  
      *   *Happy Path Possible.*

  *   **Case 2: Logbook as Evidence & Object (Challenge: Type 2 - Circularity)**  
      *   Classification: **Type 2 (Circularity)** - "Using logbook to prove records missing presupposes logbook was kept faithfully, which is the allegation."  
      *   Step 4: Is there a *specific, testable* doubt? "Logbook entry for [Date X] shows [Detail Y] inconsistent with [independent fact Z]" = Specific. Can it be resolved non-circularly? Find email/calendar entry confirming [Detail Y]? If YES → Proceed. If NO (resolution requires another contested record) → **Refer Upward to Panel**.  
      *   *Happy Path Possible if corroboration found.*

  *   **Case 3: Office's Structural Bias (Challenge: Type 2/3 - Circularity/Unfalsifiable)**  
      *   Classification: **Type 3 (Unfalsifiable)** or broad Type 2. "No procedure run by you can find no misconduct because your funding/job depends on finding it." No evidence *within the proceeding* can disprove this global institutional critique.  
      *   Step 4: Is there a *specific, testable* doubt? "You ignored evidence [X]" = Specific? Maybe (Step 3/4). "The system is inherently corrupt" = **NOT specific/testable within proceeding.** → **Exit: Proceed on record.** (Justification: "Challenge alleges systemic institutional failure unresolvable by evidence specific to this allegation; office procedures are presumed valid absent specific identified flaw in *this* application." - *Moorean 'Entitlement'*).  
      *   **Unhappy Outcome:** This is the case. You *must* dismiss this challenge as **Unfalsifiable (Type 3)** or non-specific **Circularity (Type 2)** and **Proceed on record**. *Why?* The challenge attacks the *entire framework*, not a specific application. No evidence gathered *under that framework* can refute the framework's invalidity without circularity ("We followed our unbiased procedures" assumes they are unbiased). The Panel *could* be handed this under Step 4 if phrased as a specific flaw in *this* case's conduct, but a pure structural challenge must be dismissed procedurally. **This will feel wrong if you think the challenge is serious, but the procedure deems it non-specific/global.** The value judgment (Is this office structurally sound?) is *pre-procedural* and belongs to the Provost/Trustees, not the inquiry.

  **Fifth: Failure Modes & Plain Language**  

  *   **Judgment Calls Dressed as Procedure:**  
      *   **Step 4 ("Specific, Testable Doubt"):** Distinguishing a vague "everything's suspect" from a specific "this timestamp conflicts with server logs" is inherently subjective.  
      *   **Registry "New Type" Determination:** Judging if a challenge is substantively different from prior litigated ones.  
      *   **"Quick" Resolution Assessment (Step 3):** Estimating time/feasibility is uncertain.  
  *   **Gaming by Respondents:**  
      *   **Hyper-Specificity:** Crafting challenges that *sound* specific but are still unfalsifiable ("Prove pixels in *this exact* 10x10 region weren't altered by cosmic rays on [date]").  
      *   **Registry Avoidance:** Challenging minor variants of methods ("You used Software V2.1.1b, registry only covers V2.1.1a").  
      *   **Flooding:** Submitting multiple low-quality Type 4/5 challenges to bury a serious Type 1/2.  
  *   **What it Cannot Decide:**  
      *   **Ultimate Philosophical Validity:** It assumes Moorean entitlement works for institutional fact-finding.  
      *   **True Stalemates:** Where both a specific foundational doubt *exists* AND it's truly unresolvable non-circularly within constraints. (Handled by referral, but Panel may struggle).  
      *   **Bad Faith:** It assumes challenges are sincere. Detecting deliberate obstruction is outside scope.

  **Plain Language Substitutions (BAN: "Begs the Question", "Circular", "Presupposes")**  

  *   **Instead of "Begs the Question":**  
      *   "The challenge claims the method **relies on the very thing it's trying to prove**."  
      *   "The respondent argues the method **assumes its conclusion is true to reach that conclusion**."  
      *   "This criticism suggests the finding **depends on itself for support**."  
  *   **For "Circular Reasoning/Justification":**  
      *   "Using this method to **check its own reliability** isn't possible here."  
      *   "We cannot **use the contested evidence to prove the contested evidence is reliable**."  
      *   "There is no **independent way to verify this point** without relying on the method being challenged."  
  *   **For "Presupposes":**  
      *   "The method **takes for granted** that [X] is true."  
      *   "This approach **requires assuming** [Y] from the start."  
      *   "The validity of the evidence **rests on the assumption** that [Z] didn't happen."

  This procedure provides a rapid, defensible triage system leveraging Moorean concepts of default entitlement and specificity of doubt, while explicitly flagging points requiring institutional value judgments for the Panel. It accepts that some philosophically serious challenges must be dismissed procedurally to meet operational constraints.
