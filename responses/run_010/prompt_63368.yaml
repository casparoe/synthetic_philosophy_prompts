  We are building a grant evaluation procedure based on signaling theory. The core idea is that credible signals are those that are costly to fake. In the context of grant applications, expensive commitments (like large matching funds, personal financial risks, or building projects) can be signals of organizational commitment and capacity, but they might also be wasteful or unsustainable, especially for small nonprofits. However, we must also recognize that poor organizations cannot afford such signals, so we need substitute signals that are credible without requiring money.

   The procedure will be a step-by-step list of questions. Each question will have:
     - step: integer order
     - question: the question to ask
     - sufficient_answer: what would satisfy it (if not a binary, we'll describe the threshold)
     - kills_it_if: the answer that eliminates the proposal (or null if it doesn't kill)
     - type: either "checkable_fact" (if we can verify with documents) or "judgment_call" (if it requires human judgment)
     - evidence_i_ask_for: what documents or references to ask for (or null if none)
     - who_decides: "me" (the grant officer) or "committee" (if it's a values call or requires higher-level decision)

   We'll also provide:
     - substitute_signals: for groups that can't afford expensive signals, what else to look for.

   Then, we'll run three applications through the procedure.

   Finally, we'll outline the limits of this procedure.

   Let's design the procedure:

   Step 1: Is the organization legally registered and in good standing? (Checkable fact, kills if not)
   Step 2: What is the organization's track record? (Judgment call, but we can check years in operation and past grants)
   Step 3: Does the organization have the capacity to manage the grant? (Judgment call, but we can look at financials, staff, audits)
   Step 4: For a project grant: Is the project well-justified? (Judgment call, committee if large amount)
   Step 5: For matching funds: Are the matching funds credible? (Checkable fact if we can see bank statements or pledges? But also judgment)
   Step 6: Are there any red flags in the financials? (Checkable fact with documents, kills if severe)

   However, note the problem: expensive signals might be wasteful. So we want to avoid being fooled by them and also not punish the poor.

   We'll design the steps to first filter out non-viable organizations (legal, financial red flags) and then look for credible signals that are not necessarily monetary.

   Revised steps:

   1. Legal status: Must be a registered nonprofit in good standing. Kills if not.
   2. Financial health: Review financial statements. Look for any red flags (e.g., unsustainable debt, negative net assets). If red flags are severe, kill. Otherwise, note and move on.
   3. Track record: How long has the organization been operating? What are its accomplishments? (We want to see evidence of past success, but not necessarily monetary. Could be stories, numbers served, etc.)
   4. Project justification (if it's a project grant): Does the need for the project make sense? Is it aligned with the organization's mission and capacity? (This is where we avoid the $1.4M building for 9 kids.)
   5. Match credibility (if matching is involved): Are the matching funds secured? How? (We want to see evidence of cash in hand or solid pledges. If the match is from one board member and that's the only donor, that's a risk because it's not diversified. But it doesn't kill, it just lowers confidence.)
   6. Substitute signals (if the organization is poor and cannot show expensive signals): Look for community support (volunteers, in-kind donations), partnerships, efficiency metrics, etc.

