  On point two resisting Buddhism: Le Guin's Taoist affinities matter here. The narrator's insistence that Omelans aren't naive contradicts the Buddhist diagnosis of deluded craving. And if walking away is failure, why does the text treat it so reverently? The Buddhist reading feels imposed.

  For point three about the metric thesis: Yes! This resolves the apparent conflict. Both utilitarians and Buddhists actually agree the child's suffering invalidates Omelas - they just disagree why. The welfare metric shift reorients everything. And Buddhist consequentialism can work without an enduring self - consequences matter phenomenologically.

  Point four about narrative's unique contribution: That haunting image of silent departures accomplishes what philosophy can't - the inarticulate moral recoil that precedes theory. The story makes you feel the impossibility of the calculus.

