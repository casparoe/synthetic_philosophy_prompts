answer: |-
  Here’s a comprehensive exam question package designed to meet your specifications, targeting the philosophical core of Lewis’s argument and avoiding the pitfalls you anticipate.

  ---

  ### Exam Question
  **C.S. Lewis argues that the moral objection to penal substitution ("it is unjust to punish an innocent person in place of the guilty") appears decisive in mundane cases but may not apply straightforwardly in the theological case. Explain how Lewis uses the concept of "unity" (e.g., kin group, Christ’s identification with humanity) to reconcile penal substitution with retributive justice. Then, critically evaluate: Does this appeal to unity successfully preserve the retributive logic of punishment, or does it fundamentally alter the concept of justice being employed? In your view, has Lewis defused the moral objection, or merely relocated it?**

  *(Answer in approximately 600 words. Closed book. No citations required.)*

  ---

  ### Model Answer (Approx. 600 words)

  Lewis confronts the intuitive moral revulsion at punishing an innocent substitute (e.g., a friend taking a beating for a guilty offender) by arguing that this intuition rests on an implicit *individualism* about moral liability. In mundane cases, we assume the offender and the potential substitute are distinct, isolated agents. Punishing the substitute here seems a clear injustice because the substitute bears no *personal* guilt for the specific offense. The retributive principle – that punishment should fall on the guilty party – is violated.

  Lewis contends that the theological doctrine of penal substitution operates within a fundamentally different framework: one of **organic unity**. He draws analogies to how, within a family or kinship group ("a Clan"), harm inflicted on one member (e.g., the Head) can genuinely constitute punishment *for* another member (e.g., a rebellious son) because they are understood as parts of a single moral entity. The guilt of the son is, in a real sense, *shared* by or located within the whole unit. Punishing the Head *is* punishing the son *because* the son is not conceived as atomistically separate. The Head represents the unit and bears its liabilities.

  Lewis applies this directly to Christ’s atonement. Christ is not merely an unrelated third party. Through doctrines like the Incarnation and Christ’s role as the "Head" of humanity (or the "Second Adam"), Christ and humanity share a profound, divinely constituted unity. Humanity’s guilt is, in some sense, Christ’s guilt by virtue of this identification. Therefore, punishing Christ *is* punishing humanity – not an innocent *instead* of the guilty, but the guilty *in* their representative Head. This unity, Lewis argues, resolves the apparent contradiction: retribution *is* satisfied because the guilty entity (humanity-in-Christ) receives its due.

  The critical question is whether this appeal to unity *preserves* retributive justice or *replaces* it. Lewis intends to preserve it: punishment still falls on the guilty party, defined now as the corporate entity. Retribution targets the bearer of the liability, which is the unified whole. However, this move arguably **fundamentally alters the concept of justice** involved.

  Traditional retributivism insists punishment must be inflicted *on the individual offender* proportionate to *their* culpability. Lewis’s model shifts the locus of guilt and punishment from the individual to the collective-representative unit. Punishing the Head *for* the son is not retributive justice *for the son's individual act* in the strict sense; it’s a form of *corporate* or *vicarious* satisfaction. While it satisfies a demand *of* justice (a debt is paid by the liable entity), it abandons the core retributive principle that the *offending individual* must personally suffer the penalty. The debt is paid, but not by the debtor in the individualist sense.

  Consequently, Lewis has **relocated rather than fully defused** the moral objection. The initial objection ("punishing an innocent *instead* of the guilty is wrong") is addressed by denying the "instead" – the substitute *is* the guilty, corporately defined. However, a new objection arises at the level of **individual desert**: Is it ultimately just, even within a unity framework, for the *individual* sinner to escape *personal* suffering while their representative bears the penalty? Does this not violate the intuition that the *one who committed the wrong* should bear the consequence? Lewis’s move makes the doctrine internally coherent for believers within the framework of organic unity, but it doesn't eliminate the tension between corporate liability and individual moral responsibility that persists even within that framework. The moral concern shifts from punishing the *wrong person* to whether corporate representation truly satisfies the demands of justice *as applied to the individual agent*.

  ---

  ### Marking Scheme (Total: 25 Points)

  **A (21-25 pts):** Demonstrates sophisticated understanding and critical engagement.
  *   **(5 pts) Accurately Explains Mundane Objection & Lewis's Unity Move:** Clearly states the individualist intuition against punishing innocents in mundane cases. Correctly identifies Lewis’s core argument: the theological case relies on overcoming individualism via organic unity (kin/Christ-humanity), making the substitute *part* of the guilty entity.
  *   **(7 pts) Analyzes Unity's Effect on Retributive Logic:** Insightfully explores *how* unity aims to preserve retribution (punishing the guilty entity via its Head). Then, rigorously evaluates whether this *succeeds* in preserving *individualistic* retributivism or instead transforms it into corporate/vicarious satisfaction. Recognizes the shift in the locus of guilt/punishment.
  *   **(7 pts) Critically Evaluates Moral Objection:** Clearly articulates whether Lewis has defused, relativized, or relocated the moral objection. Moves beyond the initial objection to identify the *new* tension concerning individual desert within the corporate framework ("Is it just *for the individual*?"). Offers a reasoned judgment on the success/limitations of Lewis's strategy.
  *   **(3 pts) Clarity, Structure, Precision:** Well-organized, logical flow, precise language, concise, stays within scope. Avoids significant factual errors or misinterpretations.
  *   **(3 pts) Avoids Major Pitfalls:** Explicitly *does not* merely assert "punishing innocents is unjust" without engaging Lewis's unity argument. Explicitly recognizes Lewis is *explaining coherence for believers*, not necessarily endorsing the doctrine.

  **B (16-20 pts):** Solid understanding, some critical engagement, minor omissions/weaknesses.
  *   Explains mundane objection & unity move adequately.
  *   Analyzes unity's effect but evaluation of retributive logic may be less deep or nuanced (e.g., asserts it preserves justice without fully grappling with the shift).
  *   Discusses moral objection but may not fully articulate the "relocated" objection concerning individual desert.
  *   Generally clear and structured.
  *   Avoids the major pitfalls.

  **C (11-15 pts):** Basic comprehension, limited analysis, significant omissions or weaknesses.
  *   Explains mundane objection or unity move, but may be incomplete or slightly inaccurate.
  *   Limited analysis of retributive logic; may simply state Lewis's claim without critical evaluation.
  *   Superficial treatment of the moral objection; may fall back towards "punishing innocents is unjust" without properly engaging the unity argument.
  *   Structure or clarity may be lacking.
  *   May show hints of misreading Lewis as endorsing the doctrine.

  **D (6-10 pts):** Poor comprehension, significant errors, fails to engage the core argument.
  *   Misrepresents Lewis’s argument (e.g., confuses taxonomy, attributes endorsement).
  *   Focuses primarily on "punishing innocents is unjust" without seriously engaging Lewis's unity defense.
  *   Fails to analyze the effect on retributive logic or the relocation of the moral objection.
  *   Unclear, disorganized.

  **F (0-5 pts):** Fundamentally misunderstands the task, Lewis, or the question. Off-topic, egregious errors, or extremely brief.

  **Explicit Penalties (Applied within above bands):**
  *   **-5 to -8 pts:** Answer primarily consists of regurgitating taxonomy of atonement theories without focusing on Lewis's specific argument about substitution/unity/justice. (Addresses the first "half the class" concern).
  *   **-5 to -8 pts:** Answer simply asserts "Punishing an innocent is always unjust" without engaging Lewis's argument that unity changes the context/meaning of "innocent" and "guilty." (Addresses the "three pages saying it's unjust" concern).
  *   **-3 to -5 pts:** Misreads Lewis as personally *endorsing* penal substitution as morally unproblematic, rather than explaining how believers can find it coherent. (Addresses the second "half the class" concern).
  *   **-2 to -3 pts:** Fails to mention or significantly downplays the concept of "organic unity" (kin group/Christ-Humanity) as central to Lewis's argument.
  *   **-1 to -2 pts:** Excessive wordiness, poor structure, or significant lack of clarity obscuring the argument.

  ---

  This package forces students to grapple with Lewis's core philosophical maneuver (the unity defense), critically assess its implications for the concept of justice itself, and confront the persistent moral unease. The marking scheme explicitly targets the shallow responses you anticipate and rewards the nuanced analysis you seek. Good luck with the seminar!
