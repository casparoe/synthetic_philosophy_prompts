  Here's the poem draft followed by a prose note addressing your constraints and liberties taken:

  **Poem: "Two Forecasts, One Mirror"**

  **(Voice 1: 1930 Essay - Iambic Tetrameter)**
  This capital breeds capital, and breeds,
  While technique scales to meet the pressing needs.
  A century, the problem solved and done:
  The grinding workweek shrinks beneath the sun.
  *(Surviving claims: Compounding, technical progress, solved "economic problem", reduced workweek.)*

  **(Voice 2: 1938 Memoir - Free Verse)**
  We knew the good, direct and pure, a glance
  At beauty, love, a sudden, bright expanse
  Of mind – no rule to bind, no future debt,
  Just this: the present moment apprehended. Yet...
  *(Surviving claims: States of mind valued intrinsically, rejection of general rules, focus on love/beauty/good apprehension, present focus.)*

  **(Voice 1: 1930 Essay - Iambic Tetrameter)**
  But needs divide: the absolute, defined,
  And those that chase the neighbour’s gain, designed
  To lift their mark as general wealth ascends.
  A race where satisfaction never ends.
  *(Surviving claims: Absolute vs. relative needs, relative needs escalate with general wealth, insatiability.)*

  **(Voice 2: 1938 Memoir - Free Verse)**
  ...That vision, bright as it was, held no weight
  Against the storm. It offered no clear gate
  To duty, no thick rope for what might come,
  No compass for the burdens sounding dumb.
  *(Surviving claims: Confession of thinness about future/obligation, inadequacy for what came after.)*

  **(Voice 1: 1930 Essay - Iambic Tetrameter)**
  And deeper still, the purposive disease:
  We're trained to shunt true ease to futures, breeze
  Past present joys. What use is freedom found
  When habit leaves us shipwrecked, aground?
  *(Surviving claims: "Purposive habit" of deferring enjoyment, danger of not knowing how to use freedom, psychological collapse without struggle.)*

  **(Voice 2: 1938 Memoir - Free Verse)**
  The good we sought, so clear beneath that sky,
  Did it prepare for how the world might cry?
  Or was it just a fragile, inward gleam,
  A lovely, private, self-consuming dream?
  *(Surviving claims: Self-suspicion about the Bloomsbury ethic, questioning its scope and durability.)*

  **(Voice 7: Fused - Meter Shift)**
  The wealth arrives, the time expands, but why
  Do we still strain? The neighbour’s gains flash high *(Starts loose/free)*
  **And capital breeds capital, breeds yet** *(Snaps to tetrameter mid-line)*
  **More distance from the ease we thought was set.** *(Tetrameter)*
  **The good we knew... it shimmers, half-recalled...** *(Fails mid-line - loose/free resumes)*
  The habit grips... the vision seems appalled...
  We stand here, now, with plenty, purpose thin,
  The future vast, the problem still within,
  Halfway through.

  ---

  **Prose Note: Liberties and Confidence**

  1.  **Liberties with Ideas & Contested Readings:**
      *   **Memoir's Undercutting vs. Adding:** The poem leans into interpreting the 1938 memoir's confession ("thinness," inadequacy for the future/obligation) as implicitly *undercutting* the 1930 essay's proposed solution (leisure for Bloomsbury-like states). This *is* contested. Some argue the memoir is purely autobiographical regret about *personal/political* unpreparedness (WWI/Depression), not a critique of the *ethical foundation* for future leisure. I interpret the memoir's language ("thin," "no provision") as suggesting a deeper inadequacy in the ethic itself for navigating *any* complex future, including the promised leisure. This makes the tension within Keynes sharper for the poem's purpose.
      *   **Memoir's "Self-Suspicion":** The poem amplifies the memoir's tone of regret into active *self-suspicion* in the final memoir stanza ("Did it prepare...?", "self-consuming dream?"). The memoir expresses doubt about its *applicability* and *strength* facing external events, not necessarily that the core ethic was *wrong*. The poem pushes this doubt towards questioning the ethic's very substance for the future it was meant to inhabit.
      *   **Connecting "Purposive Habit" to Memoir's Focus:** The poem implies the memoir's intense present-focus is related to the "purposive habit" problem (ignoring present joys). This connection isn't explicit in Keynes but is a plausible inference: if the good life *is* present states of mind, deferring them is doubly tragic. This is a liberty taken for thematic unity.
      *   **Relative Needs in 1930:** Placing the absolute/relative needs split and its insatiable consequences squarely in the 1930 voice is accurate (high confidence). It's a central, self-identified flaw *within* the essay.
      *   **"Purposive Habit" in 1930:** Placing the danger of deferred enjoyment and potential collapse without struggle in the 1930 voice is accurate (high confidence). It's the other key internal flaw he identifies.
      *   **Bloomsbury Ethic in Memoir:** Attributing the core tenets (states of mind, love/beauty/good, rejection of rules) to the 1938 memoir voice is accurate (high confidence). It describes his youthful Moorean beliefs.
      *   **Confession of Thinness in Memoir:** Attributing the admission of inadequacy regarding the future and obligation to the 1938 voice is accurate (high confidence). The language ("thin," "no provision") is direct.

  2.  **Confidence in Attributions:**
      *   **1930 Voice (High Confidence):** Compound growth, technical progress, solved economic problem, reduced workweek, absolute vs. relative needs (and consequences), purposive habit danger. These are explicit, structural elements of the essay.
      *   **1938 Voice (Moderate-High Confidence):** Core Bloomsbury/Moorean ethic described. Confession of its thinness regarding future/obligation. *Self-suspicion about the ethic's substance for the future (as opposed to just its practical application) is the liberty taken.*
      *   **Least Sure Point:** The specific *degree* to which the memoir's regret constitutes self-suspicion *of the ethic itself* as a viable foundation for the "good life" in the future leisure society envisioned in 1930. Keynes doesn't explicitly say "my ethic was wrong for that future"; he says it left *him* unprepared for the 20th Century's upheavals. The poem interprets this as implying the ethic was insufficiently robust *for any complex future*, including the one he predicted.
      *   **What Would Settle It:** A clearer statement in Keynes's later writings explicitly linking his memoir's regret about the ethic's limitations *to* the scenario described in the 1930 essay. This doesn't exist to my knowledge (reconstructing from memory of the texts and secondary literature on Keynes's ethics). The interpretation rests on reading the memoir's general critique of the ethic's thinness *alongside* the 1930 essay's vision, seeing the tension as inherent in one mind grappling with both prediction and foundation. It's an inference, but a compelling one for your workshop's framing.
