  ### Final Exam Question  
  **Game Setup:**  
  Consider a finite, alternating-move game between Player 1 (P1) and Player 2 (P2). The game has **5 nodes** (4 decision nodes + 1 terminal node), with payoffs (P1, P2):  
  - **Node 1 (P1 move)**: Take → (3, 0); Pass → Node 2.  
  - **Node 2 (P2 move)**: Take → (2, 4); Pass → Node 3.  
  - **Node 3 (P1 move)**: Take → (5, 1); Pass → Node 4.  
  - **Node 4 (P2 move)**: Take → (4, 6); Pass → Node 5.  
  - **Node 5 (Terminal)**: (6, 5).  

  **Knowledge Setup:**  
  Before the game, a public announcement generates **mutual knowledge of rationality to depth 1 (but no further)**:  
  - "Player 1 is rational and Player 2 is rational."  
  It is common knowledge that this announcement was made and that mutual knowledge of rationality is **exactly depth 1** (i.e., each knows the other is rational, but neither knows that the other knows they are rational).  

  **Questions (25 marks total):**  
  (a) **Identify (5 marks)**: Using the mutual knowledge of rationality (depth 1), what is the **earliest node** where the player to move is compelled by rationality to choose "Take"? Explain your reasoning step by step, starting from the last node.  
  (b) **Analyze (10 marks)**: For nodes **preceding** the one identified in (a), explain what **does and does not follow** about players’ choices and beliefs. Specifically:  
     - What would each player do and believe at these nodes?  
     - Why might a player choose "Pass" despite rationality? Explicitly reference the **limitations of depth-1 mutual knowledge**.  
  (c) **Prescribe (10 marks)**: Suppose the game reaches a node your argument in (a) **ruled out as unreachable**. What should the player to move at that node **do and believe** about the opponent’s rationality? Justify without invoking trembling-hand refinements, small probabilities of irrationality, or any equilibrium refinement.  

  ---

  ### Model Answer (≈ 800 words)  
  **(a) Earliest Node Compelled to Take (5 marks):**  
  The earliest node where a player is compelled to take is **Node 3 (P1’s move)**. This follows from backward induction constrained by depth-1 mutual knowledge:  
  1. **Node 4 (P2’s move)**: If reached, P2 chooses between Take (4,6) and Pass → (6,5). Since 6 > 4 for P2, Pass yields higher utility. *Rationality compels P2 to Pass* if Node 4 is reached.  
  2. **Node 3 (P1’s move)**: P1 faces Take (5,1) or Pass → Node 4. With **depth-1 mutual knowledge**, P1 knows P2 is rational. Thus, P1 believes if they Pass, P2 at Node 4 will Pass (as above), leading to (6,5) and giving P1 a payoff of 6. Since 6 > 5, a rational P1 would *choose Pass* at Node 3.  
  3. **Node 2 (P2’s move)**: P2 chooses Take (2,4) or Pass → Node 3. Crucially, **depth-1 mutual knowledge means P2 knows P1 is rational**. Thus, P2 believes if they Pass, P1 at Node 3 will Pass (as above), leading to Node 4 and ultimately (6,5), giving P2 a payoff of 5. Since 5 > 4 (Take’s payoff), P2 would *choose Pass* if Node 2 is reached.  
  4. **Node 1 (P1’s move)**: P1 chooses Take (3,0) or Pass → Node 2. P1 knows P2 is rational (depth 1), so P1 believes if they Pass, P2 at Node 2 will Pass (as above), ultimately yielding (6,5) and giving P1 payoff 6. Since 6 > 3, P1 *would choose Pass*.  

  **Why Node 3 is compelled?**  
  The argument above shows P1 *would* pass at Node 3. But this relies on P1’s belief that P2 will Pass at Node 4. However, **depth-1 mutual knowledge is insufficient to guarantee this belief**:  
  - P1 knows P2 is rational (depth 1), so P1 *should* believe P2 will choose optimally at Node 4 (Pass).  
  - But P1 **does not know that P2 knows P1 is rational** (depth 2+ is absent). Thus, P1 cannot assume P2 believes P1 will act rationally at Node 3. This creates doubt: P1 might fear P2 misjudges P1’s rationality and Takes preemptively at Node 2 or 4. However, at Node 3, P1 observes Node 2 was passed, proving P2 chose Pass. Given P2’s rationality, P1 infers P2 would only Pass at Node 2 if P2 expected P1 to Pass at Node 3. Thus, **at Node 3, in isolation, P1 is compelled to Pass** – but this compulsion only arises because the game *reached* Node 3.  

  **(b) Analysis of Preceding Nodes (10 marks):**  
  **Node 1 and Node 2 are not compelled to end the game**, but beliefs are fragile:  
  - **Node 1 (P1)**:  
    - *Does follow*: P1 knows P2 is rational. Thus, P1 believes if they Pass, P2 *might* Pass at Node 2 (yielding 6 for P1).  
    - *Does not follow*: P1 **cannot assume P2 believes P1 is rational**. Thus, P1 doubts whether P2 trusts P1 to Pass at Node 3. If P2 suspects P1 might Take at Node 3, P2 could Take at Node 2 (yielding 4 for P2 > 3 from Pass → P1’s worst case). P1’s payoff for Pass is either 6 (if P2 passes) or 2 (if P2 takes). With 3 guaranteed from Take, P1 may Take or Pass based on subjective risk.  
    - *Why Pass?* If P1 optimistically believes P2 expects cooperation, they Pass. *Depth-1 limitation*: P1’s uncertainty stems from P2’s potential ignorance of P1’s own rationality.  
  - **Node 2 (P2)**:  
    - *Does follow*: P2 knows P1 is rational. If the game reaches Node 2, P2 infers P1 passed at Node 1, proving P1 trusted P2 to not Take. P2 thus believes P1 will Pass at Node 3 (as 6 > 5).  
    - *Does not follow*: P2 **does not know if P1 knows P2 is rational**. If P1 passed at Node 1, P1 *must* believe P2 will Pass at Node 2. But P2 cannot be sure P1 holds this belief – P1 might be irrational or mistaken. If P2 is risk-averse, they might Take (4 > 3 if P1 surprises at Node 3).  
    - *Why Pass?* P2 trusts P1’s Node 1 Pass signals cooperation. *Depth-1 limitation*: P2’s belief is based on observed actions, not higher-order knowledge.  

  **(c) Action and Belief at a "Ruled-Out" Node (10 marks):**  
  Suppose the game reaches **Node 3** (ruled out in (a) as P2 should take at Node 2):  
  - **What P1 should do**: P1 should **Pass**. At Node 3, P1 observes P2 passed at Node 2. Given **P2’s rationality**, P1 infers P2 only passed expecting P1 to Pass at Node 3 (since P2 could have taken for 4 > 3 if P1 was irrational). If P1 Takes, they get 5, but if they Pass, they get 6 (as P2 is rational and will Pass at Node 4). Thus, *conditional on Node 3 being reached*, Pass is strictly dominant.  
  - **What P1 should believe**: P1 should **retain belief in P2’s rationality** but **question the initial knowledge assumptions**. The fact that Node 3 was reached means P2’s action at Node 2 was consistent with P2 expecting cooperation (i.e., P2 believed P1 would Pass at Node 3). This implies P2, though rational, held a **higher-order belief in P1’s rationality than depth-1 mutual knowledge guarantees** (e.g., P2 *de facto* assumed P1 knew P2 was rational). P1 should not assume P2 is irrational; rather, P1 should recognize that mutual knowledge exceeded its publicly announced depth.  

  **Justification**: Invoking "trembling hands" or "small probability of irrationality" is prohibited. Instead, P1’s belief derives from **empirical evidence** (P2 passed at Node 2) and **updating under rationality**. A rational P2 would only pass at Node 2 if they believed P1 would Pass at Node 3. Thus, P1 deduces P2 exhibited trust in P1’s rationality, implying *observed* mutual knowledge exceeded *announced* depth. P1 can thus safely Pass, trusting P2’s Node 4 action.  

