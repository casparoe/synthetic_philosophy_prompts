prompt: |-
  My prospectus chapter has to specify what I will require of an account of causation before it compares any accounts, and I would rather get the specification right than get it written quickly. I am in a seminar on causation cross-listed between my philosophy department and the statistics faculty, so the chapter will be read by people who think an account that cannot be operationalised is idle, and by people who think an account that only licenses a modelling formalism has changed the subject.

  The purpose fixes the target. The account must serve two uses at once. It must support token-level reasoning about particular cases of the kind that comes up in ascriptions of responsibility, where what matters is whether this event brought about that one. And it must underwrite applied modelling in public health and social policy, where the variables are coarse aggregates (a recession, a school system, a racial category), where the interventions of interest are frequently impossible, unlawful, or unethical, and where the working machinery is graphical and probabilistic. An account that serves only one of those uses is not what I need.

  Against that purpose, write the desiderata. For each requirement give the requirement itself, the case or consideration that motivates it, and a mark of whether it is non-negotiable or a standing preference of one camp. I want coverage of, at minimum: the phenomena an account has to get right (early and late preemption, symmetric overdetermination, prevention and double prevention, causation by omission, probabilistic and threshold cases); the distinctions it may not collapse (type versus token causation, cause versus mere background condition, causation versus explanation, causation versus nomic or lawlike connection, causation versus constitution, difference-making versus productive connection, the having of an effect versus the magnitude of that effect); and the formal and empirical results it cannot contradict (the reversal of an association under conditioning, the fact that observational data alone fixes causal structure only up to an equivalence class, the constraints relativistic spacetime places on influence between spacelike-separated events, the fact that exceptionless generality is neither necessary nor sufficient for a claim to support intervention).

  Three cases of my own construction should be handled explicitly, since I suspect they do most of the excluding.

  First, a dose of some drug lowers stroke risk by lowering blood pressure, while also raising a hormone that independently raises stroke risk. In a model whose only variables are dose and outcome, the generalization is invariant under interventions on dose, and the drug comes out protective. In the finer model that adds blood pressure and the hormone, the same drug has two opposing pathways to the outcome, and the coarse verdict can be reversed by an intervention the finer model licenses but the coarser one cannot represent. Both variable sets look legitimate; policy needs the coarse claim and mechanism needs the fine one. I want a requirement governing how causal claims at one level of description stand to claims at another, and a requirement that the theory tell me which descriptions are admissible without consulting my intuitions about this very case.

  Second, a claim about the early universe: that a particular pattern of density variation led to the galaxies forming as they did. No intervention on the putative cause is possible even in principle, and if the cause is described finely enough, altering it would leave it a different cause. Note that the preemption cases seem to push toward individuating events finely enough that the backup fails to fire, while fine individuation is exactly what makes an intervention on the cause impossible; I want the list to acknowledge that pull.

  Third, an omission case whose verdict turns on which possibility is nearest: whether the closest world in which the gardener does not water the plant is a world in which it rains instead decides whether the omission caused the death, or whether the death would have happened anyway. I want a requirement of independence, such that whatever the theory uses to rank the relevant possibilities is not itself calibrated on the causal verdicts it is supposed to generate. And I want a further requirement that the theory be licensed to convict some of my firmest intuitions of error, on the grounds that an account which saves every intuition about every case has not said anything.

  I have also drafted three candidate requirements of my own, and I want each one accepted, rejected as the prejudice of a particular camp, or restated so that it survives: that the account be extensional, so that two variables picking out the same state of affairs yield the same causal verdicts; that every true causal claim be reducible to a claim about what would have happened had the cause been absent, holding the laws fixed; and that the account owe a verdict of presence or absence in every case, with no residue where it declines to answer.

  Say plainly which subsets of the requirements cannot be jointly satisfied, with the reasoning, since if the list turns out to be an impossibility result rather than a checklist I would rather know that now. Say which single requirement eliminates the most candidates. Then, and only then, score the counterfactual-dependence account, the interventionist account, the process account, and a primitivist or powers account against the list, briefly. No citations and no reading list; I have those.
reasoning: |-
  Okay, the user is working on a prospectus chapter about causation, needing a set of well-justified desiderata. They're in a cross-listed seminar between philosophy and statistics, so the requirements must satisfy both operationalizability and theoretical depth. The account must handle token-level reasoning (like responsibility ascription) and coarse-grained modeling in policy contexts where interventions might be impossible or unethical.

  The user wants desiderata covering several aspects: phenomena (preemption, overdetermination, etc.), distinctions (cause vs. condition, type vs. token, etc.), and formal constraints (association reversal under conditioning, relativistic limits). They also have three custom cases: a drug with opposing pathways, an early universe cosmology claim, and an omission case with closeness metrics. Plus, they've drafted three candidate requirements and want them evaluated.

  First, I need to structure the desiderata clearly. The user specified they want each requirement with its motivation and negotiability status. Non-negotiables are likely those violating core purposes or contradictions with established facts. Negotiables might involve preferences of specific camps, like extensionality or reductionism.

  For phenomena, preemption cases (early/late) test if an account handles backup causes. Symmetric overdetermination (two sufficient causes) challenges differentiation. Prevention/double prevention involve absences. Omissions and probabilistic cases stretch beyond deterministic frameworks. All seem non-negotiable since failing them means the account can't handle real-world cases.

  Distinctions are crucial. Collapsing type vs. token causation would confuse general trends with specific events. Cause vs. background condition is vital for responsibility ascription. Causation vs. explanation prevents conflating why-questions with causal mechanisms. Constitution (e.g., a statue and its clay) isn't causation. Difference-making (counterfactual) vs. productive (mechanism) connections reflect different intuitions. Magnitude vs. having an effect matters in policy (e.g., how much a factor contributes). Most distinctions are non-negotiable to maintain conceptual clarity.

  Formal/empirical constraints include association reversal (Simpson's paradox), which any account must acknowledge. Observational data alone can't pinpoint causal structure (equivalence classes). Relativistic constraints prevent faster-than-light influence. Exceptionless generalizations aren't necessary/sufficient for interventions (e.g., probabilistic causes). These are non-negotiables; contradicting them means ignoring science.

  Now, the user's cases. The drug case shows level-sensitivity: coarse vs. fine models yield conflicting causal claims. The requirement here should demand level-relativity without arbitrariness, needing clear admissibility criteria for variable sets. Non-negotiable, as policy and mechanism both matter.

  The early universe case involves impossible interventions and fine individuation. The requirement must allow non-manipulable causes, perhaps via explanatory depth. Non-negotiable for cosmology/history. The tension with preemption (fine individuation for token cases) must be acknowledged as a challenge.

  The omission case depends on closeness metrics. Independence is key: closeness shouldn't be circularly defined by causal verdicts. Also, the account must sometimes override intuitions. Both non-negotiables to avoid subjectivity and ensure theoretical substance.

  For the user's candidate requirements:  
  - Extensionality: Reject as a prejudice. Same state descriptions should yield same verdicts, but coarse/fine variables (drug case) show descriptions matter. Restate as favoring extensionality where possible but allowing granularity sensitivity.  
  - Reduction to counterfactuals: Accept as non-negotiable for token causation but reject for type-level in coarse models. Restate to require counterfactual grounding where possible but allow non-reducible explanations.  
  - Always a verdict: Reject. Vagueness or underdetermination exists (e.g., overdetermination). Restate to require verdicts only when evidence suffices.

  Impossible subsets:  
  - Extensionality + level-relativity + non-arbitrary admissibility conflicts. Extensionality ignores granularity, while level-relativity needs it.  
  - Reduction to counterfactuals + impossible interventions. Early universe case can't have interventions, so counterfactuals may not hold.  
  - Always a verdict + relativistic constraints. Spacelike-separated events can't influence, so "no causation" is forced, but intuitions might conflict.

  The requirement eliminating most candidates is "Non-Arbitrary Level-Admissibility." Many accounts (process, counterfactual) struggle with variable choice. Interventionism handles it best via modularity, but still has limits.

  Scoring accounts:  
  - Counterfactual: Strong on token cases, omissions, counterfactual reduction. Weak on impossible interventions, productive connections. Fails level-admissibility.  
  - Interventionist: Excels in policy contexts, modeling, distinctions. Weak on token-level preemption, impossible cases. Fails independence in omission cases.  
  - Process: Handles production, relativistic constraints. Weak on omissions, probabilistic cases. Fails level-relativity and modeling needs.  
  - Primitivist: Grounds modality, handles impossible cases. Weak on operationalization, formal modeling. Fails empirical constraints.

  The user needs this for a high-stakes prospectus, so thoroughness is key. They might also want to preempt critiques from both camps by showing awareness of tensions (e.g., interventionism's practicality vs. primitivism's depth). Highlighting impossible requirements signals scholarly rigor—admitting limitations rather than forcing coherence.
answer: |-
  Here is a synthesized list of desiderata for your account of causation, structured as requested. The requirements are derived from your purpose, phenomena, distinctions, formal constraints, and your three cases. Each entry specifies the requirement, its motivation, and negotiability. This is followed by analysis of conflicts, eliminatory power, and candidate scoring.

  ### **Desiderata List**
  1. **Handles Preemption (Early & Late)**  
     *Requirement*: Correctly identifies actual causes in scenarios where a backup cause is present but preempted.  
     *Motivation*: Core to legal/moral responsibility (e.g., two assassins: one fires first).  
     *Negotiability*: Non-negotiable (failure invalidates token-level reasoning).

  2. **Handles Symmetric Overdetermination**  
     *Requirement*: Attributes causal status to each sufficient cause when multiple act simultaneously (e.g., two rocks shatter a vase).  
     *Motivation*: Preserves intuition that all causes contribute; avoids false negatives.  
     *Negotiability*: Non-negotiable (tests robustness in redundant causation).

  3. **Handles Prevention, Double Prevention, & Omissions**  
     *Requirement*: Accommodates absences as causes (e.g., not watering a plant) and prevention (e.g., a guard blocking a bullet).  
     *Motivation*: Essential for responsibility (omissions) and mechanisms (e.g., inhibitory pathways).  
     *Negotiability*: Non-negotiable (indispensable for applied contexts).

  4. **Accommodates Probabilistic & Threshold Cases**  
     *Requirement*: Allows causes that raise probability without guaranteeing outcomes, and threshold effects (e.g., toxin exposure only harmful above a dose).  
     *Motivation*: Real-world public health/social science relies on probabilistic models.  
     *Negotiability*: Non-negotiable (empirical necessity).

  5. **Distinguishes Type vs. Token Causation**  
     *Requirement*: Separates general causal tendencies (smoking → cancer) from specific instances (this smoking event caused this cancer).  
     *Motivation*: Policy uses type-level; responsibility requires token-level.  
     *Negotiability*: Non-negotiable (collapsing conflates modeling with agency).

  6. **Distinguishes Cause vs. Background Condition**  
     *Requirement*: Identifies salient causes without reducing them to mere necessary conditions (e.g., oxygen vs. spark in a fire).  
     *Motivation*: Critical for attribution in ethics/policy.  
     *Negotiability*: Non-negotiable (pragmatic salience matters).

  7. **Distinguishes Causation vs. Explanation**  
     *Requirement*: Does not equate causal relations with full explanatory narratives (which may include non-causal factors).  
     *Motivation*: Explanations can reference laws, norms, or context beyond causation.  
     *Negotiability*: Non-negotiable (epistemic clarity).

  8. **Distinguishes Causation vs. Constitution**  
     *Requirement*: Separates causal processes (e.g., virus damages cells) from constitutive relations (e.g., genes constituting a trait).  
     *Motivation*: Prevents overgeneration (e.g., "the statue's clay caused its beauty").  
     *Negotiability*: Non-negotiable (metaphysical hygiene).

  9. **Distinguishes Difference-Making vs. Production**  
     *Requirement*: Acknowledges both counterfactual dependence *and* mechanistic production as valid aspects of causation.  
     *Motivation*: Policy needs difference-making; token cases often demand production.  
     *Negotiability*: **Negotiable preference** (statisticians favor difference-making; philosophers often favor production).

  10. **Distinguishes Effect Existence vs. Magnitude**  
      *Requirement*: Separates whether a cause has *any* effect from *how much* it contributes.  
      *Motivation*: Policy targets magnitude; responsibility often hinges on existence.  
      *Negotiability*: Non-negotiable (prevents conflation in modeling/ethics).

  11. **Respects Association Reversal Under Conditioning**  
      *Requirement*: Compatible with Simpson’s Paradox (e.g., drug appears harmful overall but beneficial within subgroups).  
      *Motivation*: Foundational in causal inference from data.  
      *Negotiability*: Non-negotiable (contradiction invalidates statistical coherence).

  12. **Acknowledges Observational Data Underdetermination**  
      *Requirement*: Accepts that observational data alone cannot distinguish Markov-equivalent causal structures.  
      *Motivation*: Core result in causal discovery (e.g., PC algorithm constraints).  
      *Negotiability*: Non-negotiable (violates causal inference fundamentals).

  13. **Respects Relativistic Constraints**  
      *Requirement*: Forbids causal influence between spacelike-separated events (no faster-than-light causation).  
      *Motivation*: Physically necessary; spacetime structure is non-negotiable.  
      *Negotiability*: Non-negotiable (empirical bedrock).

  14. **Rejects Exceptionless Generality as Criterion**  
      *Requirement*: Does not require (or imply) that exceptionless generalizations are necessary/sufficient for causal claims.  
      *Motivation*: Probabilistic causes (e.g., smoking) support interventions without invariance.  
      *Negotiability*: Non-negotiable (aligns with science/policy practice).

  15. **Governs Level-Relativity**  
      *Requirement*: Specifies how causal claims at coarse/fine-grained levels interrelate without contradiction (per your drug case).  
      *Motivation*: Coarse models (policy) and fine models (mechanisms) both legitimate; theory must reconcile them.  
      *Negotiability*: Non-negotiable (your Case 1).

  16. **Non-Arbitrary Level-Admissibility**  
      *Requirement*: Provides criteria for admissible variable sets *independent of intuitions* about cases (e.g., drug model variables).  
      *Motivation*: Avoids ad hoc solutions; ensures objectivity.  
      *Negotiability*: Non-negotiable (your Case 1).

  17. **Accommodates Non-Manipulable Causes**  
      *Requirement*: Allows causal claims where interventions are impossible/unethical (e.g., early universe cosmology).  
      *Motivation*: Historical/cosmological explanations must be viable.  
      *Negotiability*: Non-negotiable (your Case 2).

  18. **Independence of Closeness Metrics**  
      *Requirement*: The ranking of "closest worlds" (or analogues) must not presuppose causal verdicts it generates.  
      *Motivation*: Prevents circularity in omission cases (e.g., gardener/rain).  
      *Negotiability*: Non-negotiable (your Case 3).

  19. **Overrides Intuitions When Necessary**  
      *Requirement*: Must convict some strong intuitions of error to avoid vacuity.  
      *Motivation*: Accounts preserving all intuitions are unfalsifiable and uninformative.  
      *Negotiability*: Non-negotiable (theoretical substance).

  ---

  ### **Your Candidate Requirements: Evaluation**
  - **Extensionality (same state → same verdicts)**  
    **Rejected as a camp prejudice** (statisticians/operationalists favor it). Coarse/fine models (Case 1) show descriptions matter: "dose → stroke" vs. "dose → hormone → stroke" are extensionally equivalent states but yield different causal paths. Restatement: *"Causal claims are relative to variable choice, but the theory must specify how choices affect verdicts."*  

  - **Reduction to Counterfactual Dependence**  
    **Rejected as a camp prejudice** (counterfactual theorists favor it). Case 2 (early universe) and double prevention violate it: no intervention on the cause is possible, and counterfactuals may not hold. Restatement: *"Counterfactual dependence suffices for token causation when manipulable, but not necessary for all causal relations (e.g., non-manipulable/productive cases)."*  

  - **Always a Verdict (no residue)**  
    **Rejected as untenable**. Symmetric overdetermination and vague thresholds may lack determinate answers. Requiring verdicts everywhere forces arbitrariness. Restatement: *"The account should deliver verdicts in paradigmatic cases but may admit indeterminacy where evidence is insufficient."*  

  ---

  ### **Impossible Subsets & Reasoning**
  1. **Extensionality + Level-Relativity + Non-Arbitrary Admissibility → Impossible**  
     Extensionality demands same verdicts for same states, but level-relativity requires different verdicts for different variable sets (Case 1). Non-arbitrary admissibility cannot resolve this if states are extensionally identical.  

  2. **Reduction to Counterfactuals + Non-Manipulable Causes → Impossible**  
     Counterfactual reduction requires interventions, but Case 2 (early universe) prohibits interventions *in principle*. No counterfactual dependence can be meaningfully defined.  

  3. **Always a Verdict + Relativistic Constraints → Contingently Impossible**  
     For spacelike-separated events, relativity *forces* "no causation." If intuitions demand causation (e.g., quantum correlations), requiring a verdict of "no cause" overrides intuition (violating Requirement 19).  

  ---

  ### **Most Eliminatory Requirement**  
  **Non-Arbitrary Level-Admissibility (Req 16)** eliminates the most candidates. It requires objective criteria for variable choice, which:  
  - **Counterfactual accounts** fail (variable choice is intuitive).  
  - **Process accounts** fail (variables must trace spatiotemporal processes; coarse aggregates like "recession" may not qualify).  
  - **Primitivist accounts** fail (no operational criteria).  
  - **Interventionism** partially fails (admissibility relies on modularity, which is undefined for non-manipulable variables).  

  ---

  ### **Account Scoring**  
  *Scored against all non-negotiable requirements (1–8, 10–19). Brief rationale:*  

  1. **Counterfactual-Dependence (e.g., Lewis):**  
     - **✅**: Token causation (1–4), omissions (3), distinctions (5–8, 10), relativistic constraints (13).  
     - **❌**: Fails level-relativity (15) and admissibility (16; no variable criteria), non-manipulable causes (17; no truthmakers), probabilistic cases (4; weak on chance-raising).  

  2. **Interventionist (e.g., Woodward):**  
     - **✅**: Type-level modeling (5), distinctions (6–8, 10), formal constraints (11–14), level-relativity (15).  
     - **❌**: Fails token preemption (1), non-manipulable causes (17), independence of closeness (18; ranking relies on causal structure), production (9; pure difference-making).  

  3. **Process (e.g., Salmon/Dowe):**  
     - **✅**: Production (9), relativistic constraints (13), non-manipulable causes (17; if processes exist).  
     - **❌**: Fails omissions (3), coarse variables (15–16; "recession" isn’t a process), probabilistic cases (4), association reversal (11; no data-level constraints).  

  4. **Primitivist/Powers (e.g., Cartwright/Mumford):**  
     - **✅**: Non-manipulable causes (17), distinguishes explanation (7), overrides intuitions (19).  
     - **❌**: Fails operationalization (11–12; no data equivalence classes), modeling (15–16; no variable guidance), relativistic constraints (13; powers may ignore spacetime).  

  ---

  ### **Conclusion**  
  No account satisfies all non-negotiable requirements. **Interventionism** scores best for your applied purpose but fails token-causation edge cases. **Counterfactual** approaches excel at token-level but collapse under level-relativity and non-manipulability. The desiderata list is not *strictly* impossible but requires compromising on camp preferences (e.g., rejecting extensionality or full reductionism). The strongest tension is between **token-level production** (needed for responsibility) and **type-level difference-making** (needed for modeling), with no account fully bridging the gap. Refine requirements 9 and 16 as the key negotiable points.
