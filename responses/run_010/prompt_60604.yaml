  **Key Kantian Machinery Showcased:**  
  1. **Truthfulness as Duty to Humanity:** The doorbell cannot lie *even to a murderer*, as lying corrupts the foundational trust of all human speech.  
  2. **Liability Transfer:** By choosing silence (a permissible non-declaration), the homeowner assumes full responsibility for consequences—Kant’s "answerability" doctrine.  
  3. **Rejected Dodges:**  
     - Literal falsehoods ("nobody’s home")  
     - "Mistaken" declarations (Kant: a lie is defined by *intent to deceive*, not factual error)  
     - Semantic tricks ("here" = doorbell chassis)  
  4. **"No Right to Truth" Irrelevance:** Kant argues truthfulness isn’t owed *to the listener* but to the sanctity of communication itself.  
  5. **The Brutal Invoice:** Kant’s insistence that the liar (or silence-chooser) owns all unforeseeable outcomes.
