prompt: |-
  I'm putting in for my department's summer writing grant — small money, four weeks, basically a stipend top-up — and the comittee is two metaphysicians, a Kant person and someone from poli sci, so the proposal has to be legible to people who don't work on moral responsibility at all. One page max. Can you draft it for me?

  Here's my half-baked idea. The standing-to-blame debate has spent nearly all its oxygen on how you *lose* standing — hypocrites, tu quoque, pots and kettles — and I count at least three rival diagnoses of what actually goes wrong: something like (a) blaming commits you to a standard you're not holding yourself to, so the hypocrite's blame is internally inconsistent; (b) blame from a hypocrite is bad evidence, they've blown the credibility that made their blame worth hearing; (c) blaming someone for what you do yourself is a way of refusing to treat the two of you as moral equals. People adjudicate between these by trading intuitions about cases of losing standing, and honestly the intuitions are mushy — everyone agrees the hypocrite is doing *something* wrong and they disagree about what.

  But the three accounts make sharply different predictions about what it takes to get standing *back*, and I don't think that question gets much airtime. On (a), sincere regret should restore it instantly and for free. On (b), you need a track record, because your future behaviour is what makes your blame informative again, and that can't be talked into existence. On (c), you have to submit to the demand you're making of the other person, which might mean eating the blame or the sanction yourself. Then there's the workaround I keep seeing in real life: get someone with clean hands to deliver the blame for you. If the defect is in the act, outsourcing cures it; if it's in the relationship, outsourcing makes it worse, since now you've also manipulated a third party.

  So: turn that into the proposal. I need the research question stated precisely enough that someone could tell me whether I'd answered it; a short argument for why the losing-standing debate doesn't already settle the regaining question; the plan of work week by week, including what a successful result actually looks like (I'm imagining a taxonomy of repair types plus a verdict on which diagnosis predicts them best, but push back if that's the wrong shape); why I'd do this conceptually first rather than going straight to a vignette study, which is the obvious move and I think it's premature; and an honest failure condition. My own worry is that "regaining standing" turns out to be three different things too, so the framing collapses and I've just reproduced the original disagreement one level up — I'd rather the proposal own that risk than bury it. Give me something for the poli sci person about why this isn't a word game, ideally hooked to practices where who gets to blame and what repairs it is genuinely contested: parole hearings, restorative justice conferencing, institutional apologies for historic abuse. And if you think some version of this has already been staked out, say so and tell me how I'd need to sharpen the question to be distinct — but don't go guessing at specific papers or authors, I'll do that legwork myself, no bibliography in this thing.
