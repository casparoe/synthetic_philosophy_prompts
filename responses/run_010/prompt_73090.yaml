answer: |-
  ## Recommendation  
  **Recommend funding the elective oocyte cryopreservation programme, with the condition that users receive mandatory, evidence-based counselling on maternal age risks and realistic success rates.** This service supports reproductive autonomy by helping women avoid future infertility due to age-related decline in egg quality—a genuine health benefit. The objection that children born later face higher risks doesn’t undermine this, because *not* funding denies women this option, potentially leaving them childless or forcing earlier conception against their life plans. Crucially, this decision doesn’t endorse creating avoidable harm; it balances autonomy with risk mitigation through counselling. For consistency, we’ll apply a "preventable harm threshold" to future cases: we fund interventions only if they don’t *deliberately* or *unnecessarily* increase serious health risks to future persons when safer alternatives exist.  

  ---

  ### What the Objection Is Actually Claiming  
  The obstetrician’s concern is not a simple confusion about conception. She argues that funding egg freezing will predictably lead to women delaying childbirth (from ~29 to ~34 years), and that this delay measurably increases the absolute risk of certain adverse outcomes for children—such as chromosomal conditions, preterm birth, or low birth weight—based on established maternal-age risks. While evidence on risks *directly* from frozen eggs is limited, the maternal-age channel is well-documented. Her core ethical claim: **Using public funds to incentivise a choice that predictably increases the likelihood of serious health conditions in future children is a form of commissioned harm.** This isn’t about "harming specific children who exist," but about our board’s responsibility to avoid policies that create avoidable health burdens where alternatives (earlier conception) exist.  

  ---

  ### Why the "Existence Reply" Doesn’t Close the Case  
  The "no harm" argument—that we can’t harm someone by creating them rather than not creating them—misses the point. The question isn’t whether *a specific child* is worse off; it’s whether **our policy shapes a future where more children face preventable health risks than under alternative scenarios**. We must compare two futures:  
  - **Future A (funding):** More children born later, with higher aggregate risk of certain conditions.  
  - **Future B (no funding):** Fewer children born later; more children born earlier with lower aggregate risk.  

  The obstetrician’s worry is that Future A has more avoidable suffering. This isn’t about individual identity—it’s about whether we, as stewards of public health resources, should intentionally choose a path that increases the *overall burden of health risks* in our population. The "existence reply" also fails ethically when stretched to extremes: if we accept that "any life is better than none," we could justify actions like deliberately conceiving children with severe disabilities (as in the autumn case), since those children wouldn’t exist otherwise. But our duty isn’t just to create lives—it’s to ensure our policies don’t *unnecessarily* create lives with greater health challenges when avoidable.  

  ---

  ### The Autumn Test: The Preventable Harm Threshold  
  **Criterion:** *We will not fund reproductive interventions that deliberately or foreseeably increase the risk of a serious, preventable health condition to a future person, where a lower-risk alternative is available and consistent with reproductive goals.*  
  - **How clinicians apply it:** For any request (e.g., embryo selection), ask:  
    1. Does this *intentionally* or *predictably* create a higher risk of a serious health condition (e.g., selecting *for* a disability)?  
    2. Is there a feasible, lower-risk alternative (e.g., selecting a non-affected embryo) that achieves the patient’s core aim (e.g., having a child)?  
    If both answers are "yes," we do not fund it.  
  - **Uncomfortable outcomes:**  
    - *Denies* funding for selecting disabled embryos (as in autumn case), since it deliberately increases risk when unaffected embryos exist.  
    - *May deny* funding for risk-inducing procedures even if patients insist (e.g., implanting embryos with high-risk mutations).  
  - **Why it permits egg freezing:** Egg freezing *reduces* the risk of future infertility (a health harm) and doesn’t deliberately increase fetal risks; maternal age risks are indirect and mitigated by counselling.  

  ---

  ### The Strongest Thing the Losing Side Can Say  
  If we reject the "no harm" argument (as above), we acknowledge that the obstetrician and "smug" members both lose ground. The strongest counter from *their* side is: **"You’re imposing arbitrary limits on reproductive choice by comparing futures instead of individuals.** If we deny funding for selecting disabled embryos, we’re saying some lives aren’t worth creating—which devalues disabled people. And if we fund egg freezing despite age risks, we’re hypocrites for ignoring foreseeable harms. Either stick to the ‘no harm to individuals’ rule consistently (which permits both) or abandon reproductive autonomy entirely." What we give up: philosophical simplicity. What we must accept: that health systems can—and do—make tragic trade-offs between collective risks and individual freedoms, and that counselling, not bans, is often the ethical tool for navigating them.  

