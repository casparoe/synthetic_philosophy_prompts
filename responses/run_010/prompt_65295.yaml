prompt: |-
  I spent thirty-four years as a field ecotoxicologist, most of them tracing the fate of agricultural chemicals through small catchments, and since retiring I have been reading the philosophical and legal literature on risk with a group that meets at our county library. My training makes me impatient with vagueness but also suspicious of formalisms that get imported into policy without anyone checking whether their assumptions hold in the field, so before I circulate a short essay to the group I would like a rigorous consistency check on the position I have arrived at. I have read enough to know the general landscape — Sunstein's book arguing that the precautionary principle is incoherent and potentially paralyzing, the statement drafted at the Wingspread conference in 1998, and the European commentary on both — but the view below is my own construction, and I want to know whether it holds together rather than how it compares to anyone else's.

  Here are my commitments, stated as plainly as I can manage. (1) In a regulatory setting I am a frequentist about probability: a risk estimate earns decision weight only if it derives from replicated data, or from a model whose assumptions can be tested against such data; I do not think a decision-maker's subjective priors should carry independent weight. (2) Nonetheless, the absence of a demonstrated harm is not evidence of safety, and where an intervention is novel the burden of establishing that it is safe falls on its proponent rather than on the objector to demonstrate danger. (3) I reject any rule that licenses treating a worst case as though it were certain — including the maximin reading one finds in the philosophical literature — because every course of action, inaction included, has a worst case, and a principle that permits decision by worst case permits paralysis. (4) At the same time I hold that irreversible and non-substitutable harms — the extinction of a lineage, the permanent loss of an aquifer or of a soil seed bank — can warrant refusal of authorization even when the best available estimate of the probability is very small. (5) I do not believe any harm carries infinite disvalue, and I do not accept lexicographic orderings of outcomes: the loss of one species may be many times worse than the loss of another, but the ratio is finite. (6) I also hold that the status quo is not a risk-free baseline; doing nothing is a choice with consequences, and any workable precautionary doctrine must not smuggle in a presumption in favour of the familiar. (7) My own proposal for when precautionary refusal is warranted turns not on the magnitude of the probability but on the topology of the harm. I distinguish systemic risks, whose damage propagates through coupled subsystems in a way that no quarantine, recall, or remediation can bound, from local risks, whose worst case can be contained and, should it occur, compensated. Only the former, on my view, justify refusal irrespective of the estimated probability; the latter should be governed by ordinary comparison of expected costs and benefits.

  Finally, three verdicts I feel confident about, which I regard as fixed points that any revision of (1) through (7) must reproduce. A proposed release of a self-propagating engineered organism to suppress an invasive insect pest was, I think, rightly refused notwithstanding favourable modelling, because once released it could not be recalled and its ecological effects could not be bounded. A proposed geothermal development that would have drained a single thermal spring, eliminating an invertebrate found nowhere else on Earth, was wrongly permitted, because the loss was permanent and the organism could not be restored by any expenditure. And a proposal to apply a mobile but readily degraded chelating agent across a watershed — one that would disperse widely and could not be recalled once applied, but whose effects on the sediment community would be reversed within a few decades by natural recovery at no cost to anyone — is a case in which refusal would have been excessive.

  What I want from you is an audit, not an essay on the principle. Which of these commitments genuinely pull against one another, and which only look as though they do? Order the real tensions by severity, and for each say what would have to give and what abandoning it would cost me elsewhere in the list. Two hunches of my own, which you should treat as data about my confusions rather than as guidance about where the trouble lies: my reading group insists (1) and (2) cannot both be held, and I half-suspect they are right; and I worry that (5) leaves me unable to explain why extinction should matter differently from a loss that can be compensated. Tell me whether either worry survives inspection. Then answer three further questions: whether (7) does independent work or is merely (4) restated; whether my three verdicts are jointly entailed by (1) through (7) or whether one of them is quietly appealing to a principle I have not stated; and which single revision would repair the largest number of problems at once. Please do not recommend giving up a commitment because it is unpopular in the literature, and do not supply references or a reading list — I want the trace of what commits me to what.
reasoning: |-
  Okay, let me approach this systematically. The user is a retired ecotoxicologist with deep field experience, seeking a rigorous internal consistency check of their risk assessment framework. They've presented seven core commitments, three fixed-point verdicts, and specific concerns about tensions.

  First, I need to map the logical relationships between their propositions. The apparent conflict between (1) (frequentist probability) and (2) (burden of proof for novel interventions) stands out immediately. The user's group thinks these are incompatible, and the user shares this concern. On the surface, (1) rejects subjective priors while (2) seems to require shifting evidentiary burden without data - but looking deeper, (2) might actually be an epistemic rule about evidence standards rather than probability assignment. If framed as "absence of evidence isn't evidence of absence" plus an allocation of research responsibility, it could coexist with frequentism.

  Then there's the more subtle but critical tension between (4) (irreversible harms warrant refusal regardless of probability) and (5) (no infinite disvalues or lexical orderings). The user worries this undermines why extinction matters differently. The key may lie in distinguishing between value magnitude and harm topology - (4) focuses on the structural permanence of damage while (5) constrains how we quantify that damage. This connects directly to their systemic vs local risk distinction in (7).

  Regarding (7), it's clearly doing more work than restating (4) - it provides an operational criterion (containability vs propagation) that explains when irreversibility triggers refusal. Their three verdicts beautifully illustrate this: the engineered organism case shows systemic risk, the geothermal development violates (4)'s irreversibility principle, and the chelating agent case demonstrates compensable local harm.

  The deepest fracture appears between (4) and (5). When they say extinction warrants refusal despite low probability, but also reject infinite disvalue, we face a measurement problem: how small a probability justifies refusing massive benefits? Their framework currently lacks tools to compare irreversible harms against reversible costs. This might be addressed by introducing a "risk signature" concept - not just probability times impact, but also incorporating recoverability dimensions.

  For the verdicts, the geothermal case subtly exceeds the stated principles. While (4) covers irreversibility, the "found nowhere else" status suggests uniqueness value not explicitly accounted for. This could be resolved by interpreting non-substitutability more broadly or adding a rarity dimension.

  The most efficient repair would be to refine (4) and (5) with a recoverability metric, creating space for a threshold function where compensability determines when expected cost-benefit analysis applies versus when precautionary refusal triggers. This would preserve their systemic/local distinction while solving the measurement dilemma.

  Throughout, I must respect their constraints: no appeals to popularity in literature, no references, pure logical trace of their own commitments. The goal is to help them see where their own principles demand refinement to achieve coherence.
answer: |-
  Your position is rigorously constructed and internally coherent, but contains two significant tensions and one minor inconsistency that require reconciliation. Below is a structural audit of your commitments, ordered by severity of tension, followed by answers to your specific questions.

  ### Ranked Tensions
  1.  **Tension between (4) and (5)**: **Severe**  
      - **Conflict**: (4) demands refusal for irreversible/non-substitutable harms regardless of low probability, while (5) rejects infinite disvalue and lexicographic ordering. This creates a measurement gap: *How small a probability justifies overriding cost-benefit analysis?*  
      - **What must give**: (5) must accommodate a *threshold function* for irreversibility. You cannot maintain absolute finite ratios while authorizing refusal based solely on harm topology when probability is "very small."  
      - **Cost of revision**: Softening (5) to allow discontinuities (not infinities) for irreversibility risks sacrificing formal elegance but preserves your verdicts. Abandoning (4) would gut your core precautionary stance on extinction/aquifer loss.  

  2.  **Tension between (1) and (2)**: **Moderate** (but resolvable)  
      - **Apparent conflict**: (1) demands data-driven probabilities, while (2) places burden of proof on proponents without data.  
      - **Resolution**: They coexist if (2) is an *epistemic rule*, not a probability claim. (1) governs *how we quantify risk*; (2) governs *who must supply evidence* before an intervention is permitted.  
      - **Why the worry survives**: Your frequentism (1) rejects subjective priors, yet (2) implicitly accepts a prior of *potential* harm. However, this prior isn't quantified—it's a procedural default.  
      - **Cost of reconciliation**: Accept that (2) operates outside probability frameworks. Abandoning (1) would undermine your empiricism; abandoning (2) would force regulators to accept novel interventions without evidence.  

  3.  **Tension between (3) and (4)**: **Minor**  
      - **Conflict**: (3) forbids acting on worst-case scenarios, while (4) advocates refusal for low-probability irreversible harms.  
      - **Resolution**: (4) is not worst-case reasoning but *vulnerability-based* reasoning. You refuse due to *structural properties* of the harm (irreversibility, non-substitutability), not its magnitude alone.  
      - **What must give**: Clarify that (3) targets *probability neglect* (treating worst-case as certain), while (4) targets *incommensurability* (harms that cannot be offset).  

  ---

  ### Answers to Specific Questions
  **1. Does (5) undermine why extinction matters?**  
  Yes, provisionally. Without lexicographic ordering, (5) cannot explain why extinction justifies refusal *despite* low probability while other finite losses do not. **Resolution**: Augment (5) with: *"Irreversible harms create discontinuities in value commensurability, permitting refusal when expected-utility calculations fail to capture irreversible thresholds."* This preserves finite ratios but acknowledges incommensurability.  

  **2. Does (7) restate (4)?**  
  No, it does independent work:  
  - (4) identifies a *property* (irreversibility/non-substitutability) that *triggers* precaution.  
  - (7) provides a *test* for when that property applies (systemic vs. local risks). It operationalizes (4) by defining *why* certain irreversible harms evade containment/compensation.  

  **3. Do your verdicts follow from (1)–(7)?**  
  Two do; one requires implicit expansion:  
  - **Engineered organism**: Directly follows (7): systemic risk (non-containable propagation).  
  - **Chelating agent**: Follows (7) (local/compensable) + (6) (status quo not risk-free).  
  - **Geothermal development**: Depends on (4) but exceeds it. (4) covers irreversibility, but "nowhere else on Earth" implies *uniqueness*, not stated in your principles. **Implicit principle**: *"Uniqueness amplifies non-substitutability."*  

  **4. Most efficient revision?**  
  **Refine (4) and (5) jointly**: Specify that irreversibility/non-substitutability creates *discontinuities* in cost-benefit analysis. This would:  
  - Resolve the (4)/(5) tension by formalizing thresholds.  
  - Strengthen the geothermal verdict (uniqueness as extreme non-substitutability).  
  - Clarify why extinction differs from compensable loss without lexicographic ordering.  

  ---

  ### Summary of Adjustments
  - **Retain intact**: (1), (2) (as procedural), (3), (6), (7).  
  - **Revise (4)**: *"Irreversible and non-substitutable harms warrant refusal when their discontinuities with compensable losses render expected-cost calculations inadequate, even at low probabilities."*  
  - **Revise (5)**: *"No harm has infinite disvalue, but irreversible losses create discontinuities that prevent direct trade-offs with finite benefits."*  
  - **Add implicit principle**: *"Uniqueness is a determinant of non-substitutability."*  

  This preserves your empirical rigor, precautionary core, and verdicts while eliminating contradictions. The cost is accepting that some harms disrupt commensurability—a defensible concession given your fieldwork on complex systems.
