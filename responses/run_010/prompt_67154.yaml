  **Symmetry Test**  
  This draft satisfies the symmetry constraint:  
  - Party A will find their core claims defended (e.g., exploitability as a dispositional flaw, axioms as normative).  
  - Party B will find their core claims defended (e.g., environmental dependence, vacuity of representation).  
  - No sentence assumes the other side is wrong; disagreements are framed neutrally or in each party’s voice.  
  - The four cases are explicitly resolved in the disagreements table and cruxes.  

  This document represents the shared understanding and unresolved issues after two decades of debate.
