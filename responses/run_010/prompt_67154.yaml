  ### Adversarial Collaboration on Coherence Arguments: Draft Document

  This document is the product of a good-faith adversarial collaboration between Party A (strong reading) and Party B (deflationary reading) regarding the interpretation of coherence arguments in decision theory. It addresses the core disagreements while explicitly incorporating the four specified cases. The draft adheres to the constraints: no citations, no invented statistics, and symmetry—each party’s position is stated as they would articulate it, with no assumptions of the other side’s incorrectness.

  ---

  **Part 1: Common Ground (Numbered Claims)**  
  Both parties endorse the following claims. These are substantive points of agreement that capture the mathematical and conceptual foundations of the debate. An outsider unfamiliar with the literature would not find these self-evident, as they reflect nuanced consensus after decades of engagement.

  1. **Formal Validity of Theorems**: The Dutch book theorem (and its converse), Savage’s theorem, the von Neumann-Morgenstern (vNM) representation theorem, and the money-pump argument are mathematically valid under their explicit axioms (e.g., completeness, transitivity, continuity, independence). These theorems establish that if preferences satisfy the axioms, they can be represented as maximizing expected utility relative to some probability function and utility function (unique up to affine transformations).

  2. **Converse Implications**: If an agent’s behavior is representable as maximizing expected utility, it must satisfy the axioms (e.g., transitivity for money-pumps, probabilistic coherence for Dutch books). This biconditional is inherent to the theorems.

  3. **Hypothetical Exploitability**: Violations of the axioms (e.g., intransitivity, probabilistic incoherence) imply the existence of exploitable scenarios (e.g., Dutch books, money pumps) in a frictionless, idealized environment with costless transactions, arbitrarily divisible stakes, and a willing counterparty offering bets at the agent’s own rates.

  4. **Environmental Dependence**: Whether such exploitability manifests in practice depends on empirical conditions: the availability of the exploitative sequence, the absence of transaction costs, the divisibility of stakes, and the counterparty’s behavior. The theorems do not guarantee real-world losses without these conditions.

  5. **Universality of Representation**: Any observed pattern of choices can be formally redescribed as expected utility maximization by expanding the outcome space or state space (e.g., incorporating contextual features). However, this does not imply that such redescriptions are natural, psychologically real, or computationally feasible.

  6. **Human Violations Are Documented**: Laboratory experiments consistently show humans violate axioms (e.g., via framing effects, preference reversals, or intransitivity). These violations are systematic and replicable, not noise.

  7. **Boundedness Explains Violations**: Human violations arise from cognitive limitations (bounded rationality), which make strict adherence to axioms costly or impractical. Compensatory mechanisms (e.g., heuristics) often mitigate real-world losses.

  8. **Risk Aversion Is Coherent**: An agent satisfying all axioms can exhibit risk aversion (e.g., concave utility functions), and this is not a violation of coherence. Both parties agree this case is unproblematic (as in Case 4).

  9. **Normative vs. Descriptive Distinction**: The theorems are normative for ideal agents (unbounded, frictionless environments). They are not prescriptive for all agents in all contexts, nor do they claim descriptive accuracy for humans.

  10. **Axioms as Necessary Conditions**: For expected utility representation to be possible, the axioms must hold. If axioms are violated, no such representation exists without redescription (as in Claim 5).

