  2. **Representation**: If an agent's preferences satisfy the axioms of one of these theorems, then there exists a probability measure and a utility function (up to affine transformation) such that the agent's choices can be described as maximizing expected utility.

  3. **Converse Results**: For each of these theorems, there is a converse: if an agent maximizes expected utility with respect to some probability and utility, then the preferences will satisfy the axioms (e.g., transitivity, independence).

  4. **Exploitability in Principle**: If an agent violates the axioms (e.g., intransitivity), then there exists a set of transactions (a "Dutch book" or "money pump") that would lead to a sure loss in a hypothetical scenario where the agent is offered a sequence of choices that exploits the violation.

  5. **Conditionality**: The existence of such exploitable sequences depends on the environment: the counterparty must be willing to offer the required bets at the agent's own rates, the transactions must be costless and divisible, and the sequence of choices must be available.

  6. **Redescription is Possible**: Any pattern of choices can be rationalized as utility maximization by a sufficiently creative redescription of the outcomes or by expanding the state space. However, such redescriptions may not be natural or psychologically plausible.

  7. **Empirical Reality**: Real human agents often violate the axioms (e.g., in framing effects, preference reversals, intransitivities). These violations are well-documented in laboratory settings.

  8. **Bounded Rationality**: The violations observed in humans can often be explained by cognitive limitations (bounded rationality) and may be adaptive in real-world environments with computational constraints and costs of deliberation.

  9. **Normative vs. Descriptive**: The theorems are normative: they prescribe how an ideal agent should behave. They are not intended as a complete descriptive model of human behavior.

  10. **Risk Aversion**: An agent can be coherent (satisfy the axioms) and exhibit risk aversion, which is captured by the concavity of the utility function over outcomes (e.g., wealth). Both parties agree that risk aversion is consistent with coherence.

  We have at least 8. Note: Claim 6 is important for Party B and acknowledged by Party A as a mathematical fact, though they may differ on the implications.

  Now, the four cases:

  Case 1: Cyclic preferences with menu-sophistication.
  - Agent has A > B > C > A in pairwise choices, but when faced with a menu that includes a sequence that would lead back to the start with less money, it refuses. 
