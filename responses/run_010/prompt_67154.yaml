  **Part 3: Cruxes**  
  Cruxes are sub-questions where resolving empirical or conceptual issues would shift at least one party’s position. For each, we state the case/argument both parties agree is relevant, their predictions, and what would falsify them. Predictions avoid invented statistics; only quantities and directions are specified.

  **Crux 1: Continuity and Completeness as Normative Requirements**  
  - **Case/Argument**: Case 3 (agent violating continuity: no compensation for a loss at any odds). Party A argues this is a boundedness issue; Party B argues it refutes normativity.  
  - **Relevant Study**: Experiment exposing agents to choices involving extreme outcomes (e.g., low-probability catastrophic loss vs. sure gains) in environments with iterated decisions. Measure losses from exploitability (e.g., Dutch books).  
  - **Party A Prediction**: Agents violating continuity will exhibit increasing losses as environmental richness (opportunities for exploitation) increases. Losses will correlate positively with the degree of violation.  
  - **Party B Prediction**: Losses will be negligible or negative (e.g., saved from bad bets) even in rich environments; violations may reduce decision costs.  
  - **Failure for Party A**: If continuity violations yield no losses or net benefits across environments.  
  - **Failure for Party B**: If violations cause consistent, significant losses as environments grow richer.  

  **Crux 2: Exploitability as the Cash-Value of Incoherence**  
  - **Case/Argument**: Case 1 (agent with cyclic preferences but menu-sophistication). Party A argues sophistication restores coherence; Party B argues exploitability is environment-dependent.  
  - **Relevant Study**: Experiment with agents exhibiting cyclic pairwise preferences in two conditions: (1) stepwise choices (no menu visibility), and (2) menu-aware choices. Measure losses from money-pumps and decision costs.  
  - **Party A Prediction**: In stepwise conditions, losses will occur and correlate with cyclicity; in menu conditions, losses will be near-zero. Stepwise losses will exceed menu decision costs.  
  - **Party B Prediction**: Losses in stepwise conditions will be rare and outweighed by costs of enforcing transitivity; menu-awareness will not eliminate losses (e.g., due to incomplete information).  
  - **Failure for Party A**: If stepwise losses are negligible or menu decision costs exceed stepwise losses.  
  - **Failure for Party B**: If stepwise losses are significant and widespread, and menu-awareness is infeasible in key environments.  

  **Crux 3: Redescription and the Vacuity of Representation**  
  - **Case/Argument**: Case 2 (agent with fixed tie-break rules on labels). Party A argues this violates natural outcome descriptions; Party B argues redescription trivializes the theorems.  
  - **Relevant Study**: Experiment with agents choosing between identical outcomes differing only in labels (e.g., "Option A" vs. "Option B"). Test if utility representations require label-inclusion, and if these representations predict behavior under label changes.  
  - **Party A Prediction**: Label-based representations will be unstable (fail under relabeling), and agents will show inconsistencies, revealing non-maximization over natural outcomes.  
  - **Party B Prediction**: Representations will remain stable and predictive with labels included, proving flexibility; no inconsistencies will arise.  
  - **Failure for Party A**: If label-included utilities are stable and predictive across contexts.  
  - **Failure for Party B**: If representations fail to predict behavior without arbitrary adjustments, or if including labels introduces intransitivities.  

  **Crux 4: Cost-Benefit Trade-off of Axiom Adherence**  
  - **Case/Argument**: General boundedness. Party A views violations as net costly; Party B views them as net beneficial.  
  - **Relevant Study**: Measure real-world performance (e.g., resource accumulation, error rates) of axiom-violating vs. axiom-adherent agents across environments varying in complexity, risk, and adversarialness.  
  - **Party A Prediction**: Axiom-adherent agents will outperform violators as environments become richer or more adversarial (exploitability increases). Performance gap grows with environmental richness.  
  - **Party B Prediction**: Violators will match or outperform adherents due to lower decision costs; performance gap shrinks or reverses in typical environments.  
  - **Failure for Party A**: If violators outperform adherents in rich/adversarial environments.  
  - **Failure for Party B**: If adherents consistently outperform violators across environments.  

