  **Part 4: Verbal Disputes**  
  Certain disagreements stem from differing uses of key terms. Clarifying vocabulary narrows the debate to substantive issues. Once fixed, the argument focuses on empirical cruxes.

  - **Coherence**:  
    - **Party A**: Satisfying decision-theoretic axioms (transitivity, completeness, etc.), making behavior representable as expected utility maximization *without* ad hoc redescription. Coherence is a real property that reduces exploitability.  
    - **Party B**: Formal satisfaction of axioms *or* redescription-enabled representation. Coherence is trivial to achieve and not inherently linked to exploitability.  
    - **Fixed Vocabulary**: Both agree "coherence" means axiom-satisfaction for a given outcome description. The dispute is whether it must involve "natural" outcomes (Party A) or allows gerrymandering (Party B), and whether it is necessary for rationality.  

  - **Exploitable**:  
    - **Party A**: Vulnerability to a sure loss in a hypothetical, frictionless sequence offered by a counterparty. Exploitability reveals a disposition that *will* cause losses when conditions permit.  
    - **Party B**: Vulnerability only in unrealistic, controlled scenarios. Exploitability is counterfactual and does not imply real-world risk.  
    - **Fixed Vocabulary**: Both agree "exploitable" means susceptibility to a sure loss under theorem conditions. The dispute is whether this is normatively significant (Party A) or practically irrelevant (Party B).  

  - **Agent**:  
    - **Party A**: Any system making choices, evaluated against an ideal standard (unbounded, frictionless). Natural or artificial agents should approximate this.  
    - **Party B**: Systems operating under bounded resources, evaluated ecologically (performance in typical environments). Ideal standards misdescribe real agents.  
    - **Fixed Vocabulary**: Both agree an "agent" is an entity making choices. The dispute is whether rationality is defined by ideal axioms (Party A) or ecological fitness (Party B).  

  - **Effect on Argument**: Fixing terms reveals that disagreements reduce to:  
    - The empirical frequency and impact of exploitability (addressed in Cruxes 1–2).  
    - Whether utility representations must use "natural" outcomes (addressed in Crux 3).  
    - Whether boundedness excuses violations (addressed in Cruxes 1 and 4).  

