prompt: |-
  I am a junior and I chair the student council's governance committee at my high school. For three years our elections have been uncontested: the same cluster of friends from the debate team runs, nobody challenges them, and turnout is around 12 percent. The dean of students has offered to fund whichever selection model we recommend, so we have to choose among (1) continuing annual elections for all fifteen seats, (2) filling all fifteen by lot from a pool of every student who has not opted out, and (3) filling ten seats by lot and keeping five elected at large.

  Please draft the memo I will circulate before our Thursday meeting. It must state which option we are recommending, and it must settle two questions that split the committee. First, the elected five are the only members anyone can actually remove at the end of a term, so should real authority — in option (3), the sole power to approve spending — be reserved to them, or does a lottery seat confer standing of a different kind rather than none? Second, drawing lots gives every student the same chance of being selected, which sounds fair, yet we expect that in practice the students who opt out will be disproportionately the ones who would have run anyway, so the draw may reproduce the current pattern without the election that at least pretended to authorize it. Say plainly whether sortition is a positive improvement or merely a stopgap for a failed election, and give the strongest reason someone on our committee could still vote against your recommendation.
reasoning: |-
  Hmm, the user is chairing a high school governance committee and needs help drafting a memo about election reforms. They've described a problem where student council elections have been uncontested for three years with low turnout, dominated by debate team friends. The dean is offering funding for one of three options: keep elections, use sortition (lottery) for all seats, or a hybrid model with some elected and some by lot.

  The memo needs to address two key questions splitting their committee: First, whether elected members should have exclusive power over spending in the hybrid model, or if lottery members should have equal standing. Second, whether sortition is a genuine improvement or just a band-aid for failed elections. They also want the strongest argument against the recommendation.

  Looking at the options: Full elections clearly aren't working. Full sortition might seem democratic but risks apathy - students who'd normally run might opt out, leading to similar unrepresentative results. The hybrid model seems best - it maintains some democratic elements while ensuring broader representation through the lottery. For the power question, giving all members equal authority makes sense - otherwise lottery members become second-class. Sortition isn't perfect but it's a real improvement over the current system by guaranteeing diverse participation.

  The strongest counterargument would be that lottery members might lack motivation or skills. But that's exactly why keeping some elected positions helps - they'll likely attract engaged students who can mentor others.

  The memo should be formal yet accessible for high schoolers, starting with the problem statement, then the recommendation, followed by clear reasoning on the two contentious points. It needs to acknowledge counterarguments fairly while making a persuasive case for the hybrid model. Ending with next steps would provide clear direction for their meeting.
answer: |-
  **MEMORANDUM**  
  **TO:** Governance Committee Members  
  **FROM:** [Your Name], Chair, Governance Committee  
  **DATE:** [Current Date]  
  **SUBJECT:** Recommendation for Student Council Selection Reform & Committee Questions  

  ### **I. Recommendation: Hybrid Model (Option 3)**  
  After thorough deliberation, **we recommend adopting Option 3: filling ten (10) seats by lottery and five (5) seats by at-large election.** This model balances democratic legitimacy, equitable representation, and practical effectiveness. It directly addresses our crisis of low engagement while preserving accountability mechanisms.  

  ---

  ### **II. Addressing Committee Questions**  
  **Question 1: Authority of Lottery Members**  
  *Background:* Under Option 3, only elected members can be removed post-term. Should spending approval power be reserved solely for elected members?  
  **Resolution: NO. All fifteen members must share equal authority, including spending approval.**  
  - **Reasoning:**  
    - **Standing through participation:** Lottery members gain legitimacy by serving the student body, not just elections. Restricting their power creates a two-tier system, demotivating lottery participants and implying their contributions are inferior.  
    - **Practical necessity:** Spending decisions impact all students. Excluding 2/3 of the council from these votes concentrates power in an unrepresentative minority (the same group dominating current elections).  
    - **Accountability alternative:** While lottery members can’t be voted out, mandatory public reporting of all votes (including spending) allows students to pressure them via petitions, open forums, or recall requests to the Dean.  

  **Question 2: Is Sortition a Positive Improvement or a Stopgap?**  
  *Background:* If students who would have run (e.g., debate team) opt out of the lottery, does this merely recreate the status quo without electoral legitimacy?  
  **Resolution: Sortition is a POSITIVE IMPROVEMENT, not a stopgap.**  
  - **Reasoning:**  
    - **Structural equity:** Elections fail when they favor a self-selecting, homogenous cohort. Sortition guarantees **statistical representation** of the student body—ensuring athletes, artists, quiet students, and others historically excluded gain seats.  
    - **Breaking inertia:** Even if some engaged students opt out, the lottery *forces* inclusion of students who would never run. This disrupts entrenched patterns and injects diverse perspectives.  
    - **Rebuilding legitimacy:** The current "election" is a hollow ritual (12% turnout, no choices). Sortition replaces faux authorization with **transparent randomness**, making clear that every student has an equal shot to shape policy.  

  ---

  ### **III. Strongest Argument Against This Recommendation**  
  A thoughtful committee member might still oppose Option 3 for this reason:  
  > **"The hybrid model risks dysfunction. Elected members may dismiss lottery members as ‘less legitimate,’ while lottery members could disengage, creating factions. This could paralyze the council more than the current disengaged but functional monopoly."**  
  *Rebuttal:* Clear bylaws mandating collaborative training, shared leadership roles, and transparent voting records can mitigate this. The alternative—uncontested elections—already entrenches disengagement. Option 3 forces us to confront inclusion challenges proactively.  

  ---

  ### **IV. Why Not the Other Options?**  
  - **Option 1 (Status Quo):** Perpetuates low turnout, exclusion, and fake democracy. Funding it rewards failure.  
  - **Option 2 (Full Lottery):** Risks disengagement if key leaders opt out. Retaining 5 elected seats ensures continuity of expertise and rewards motivated candidates.  

  ---

  ### **V. Next Steps**  
  We vote Thursday on this recommendation. If approved, we will:  
  1. Draft bylaws defining equal powers + accountability measures.  
  2. Design an awareness campaign to explain the system and encourage lottery opt-*in*.  
  3. Propose a review clause: reassess after one year.  

  This proposal makes the council **truly representative** while keeping one foot in the democratic tradition. Let’s choose bold change.  

  **Attend prepared to vote.**  
  —[Your Name]  

  ---  
  **Approval:** Dean of Students (funding contingent on committee vote)  
  **Distribution:** Governance Committee, Student Council Adviser, Dean of Students
