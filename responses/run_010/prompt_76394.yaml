prompt: |-
  I'm teaching a 75-minute epistemology seminar, 16 students, all of whom have already read the DeRose bank case and already decided what they think about it — which is the actual problem. I want a structured activity that makes pragmatic encroachment and contextualism feel like live, competing hypotheses instead of two paragraphs in a textbook, and specifically that gets them to feel the *difference* between the two, which is the bit they never get.

  Constraints and asks:

  - No lecture up front, and no labels until the very end. They should be inside a situation that generates the pressure before anyone says the word "stakes."
  - Please don't use a bank. Give me a fresh scenario, something mundane and checkable, built so that evidence quality and stakes are crossed (a 2x2 at minimum). If you only vary stakes they'll conclude "oh right, evidence matters" and go home.
  - The thing I actually care about: build in a round where the person deciding whether the protagonist knows is *not* the protagonist. Low-stakes attributor judging a high-stakes subject, and then the swap. Whether "knows" tracks the subject's situation or the speaker's is the whole ballgame, and I want them to hit it head-on with a forced call written down, not in open discussion where it'll evaporate.
  - Have them record what they'd *say* ("I know that the ferry leaves at...") and what they'd *do* seperately, before anyone compares notes. If the two come apart in the room I want that gap on the board in their own words.
  - Payoffs: no real money, but the stakes also can't be pretend — if they know nothing rides on it, the thing is dead on arrival. Tell me what token actually bites for a room of 19 year olds and how you make a wrong call *felt*.

  Then a debrief that maps specific moments of the game onto the two views, and onto the deflationary third option — nothing happens to knowledge at all, it's just ordinary cost-benefit reasoning, so the behaviour in the room looks identical under all three. I want a forced-choice question or two to put on the board that makes them actually pick a side and pay for it. And be straight with me about which part of the disagreement the activity simply cannot produce: my suspicion is it can only ever surface a psychological pattern that all three theories happily predict, and I'd rather know how you'd handle that than have you paper over it.

  Finally, minute-by-minute timeline, plus what predictably goes wrong the first time you run it and what you do in the moment (I assume someone reverse-engineers the point within five minutes and starts performing the answer they think I want).
reasoning: |-
  Okay, the user is teaching a 75-minute epistemology seminar and needs a structured activity to help students grasp the difference between pragmatic encroachment and contextualism. They've already read the DeRose bank case but are stuck seeing these as textbook concepts. The key is to make the theories feel alive and distinct.

  First, the constraints: no upfront lecture, fresh scenario (not a bank), crossed variables (evidence and stakes), include a round where someone else judges the protagonist's knowledge, separate recording of speech and action, realistic stakes for 19-year-olds, and a debrief that forces them to choose between theories. Also, the user is concerned the activity might only surface psychological patterns all theories predict.

  I need a new scenario. The ferry idea is good—mundane, checkable. But can I make it more relatable? Maybe a campus bus schedule? Students often rely on buses. But ferries might work if it's a coastal university. Or perhaps a dining hall closing time? But that might not have high enough stakes. The ferry with different evidence levels (app vs. paper schedule) and stakes (job interview vs. casual meetup) seems solid. High stakes with weak evidence and low stakes with strong evidence creates the necessary tension.

  The stakes need to feel real. For 19-year-olds, social currency matters. Using raffle tickets based on correct answers could work, but the user mentioned no real money. Public display of mistakes? Having to wear a silly hat or do a trivial but embarrassing task might work. The key is social pressure. If they're wrong, they have to announce it publicly—that could sting enough to simulate stakes.

  The activity structure: split into groups, assign roles (subject and attributor), different scenarios for each. First, subjects decide if they know and what they'd do. Then attributors judge if the subject knows. Swap roles. Record answers privately to prevent groupthink. Then reveal discrepancies.

  Debrief is crucial. Need to map their responses to the theories. Contextualism: "knows" depends on the attributor's stakes. Pragmatic encroachment: depends on the subject's stakes. Invariantism: stakes don't affect knowledge, just action. The forced-choice questions should make them commit. For example, "When Zoe says she knows, is she more likely wrong in high or low stakes?" Or "Does the truth of 'Zoe knows' change with the attributor's context?"

  Potential pitfalls: Students might reverse-engineer the point early. To counter, emphasize that they should respond genuinely. If someone figures it out, acknowledge it but ask them to play along for the experiment. Also, ensure the stakes feel real—embarrassment can be a strong motivator.

  Timing: Introduction (5 min), Individual decisions (10 min), Group sharing (10 min), Role swap (15 min), Whole class discussion (20 min), Debrief (15 min). Predictable issues: one group finishes early, or someone dominates. Have extension questions ready. If stakes aren't felt, emphasize the social consequence more during setup.

  The user's deeper need is for students to experience the theoretical tension firsthand, moving beyond abstract understanding. The activity must create a palpable difference between the theories through lived experience. The scenario and stakes design are critical here. Also, separating speech and action captures the pragmatic vs. semantic distinction. Ensuring the attributor's role highlights the contextualism aspect is key. Finally, the debrief must clearly tie their experiences to the theories, forcing a choice to solidify understanding.
answer: |-
  Here’s a structured activity designed to force-feed the difference between pragmatic encroachment and contextualism, using a novel scenario, controlled variables, and visceral stakes. It targets your core asks: crossed evidence/stakes, third-party attribution, speech/action decoupling, and a debrief that forces theoretical commitment.

  **Scenario: "The Ferry Departure"**  
  *Why it works:* Ferries are mundane, schedules are checkable (via app/website), and timing errors have concrete consequences. Evidence quality varies via **digital reliability** (real-time app vs. outdated paper schedule). Stakes vary via **social consequence** (job interview vs. casual meetup).

  ---

  ### **Setup (5 min)**
  - **Premise:** "You’re helping friends catch a ferry. The *only* way to check departures is either a **real-time app** (high reliability) or a **paper schedule** from a kiosk (often outdated; 30% error rate)."
  - **Assign Roles:**  
    - **Group A (8 pairs):** Subject = High Stakes ("Meeting a CEO for a dream job interview"), Attributor = Low Stakes ("Meeting a friend for coffee").  
    - **Group B (8 pairs):** Subject = Low Stakes (coffee), Attributor = High Stakes (job interview).  
    *Half of each group gets the app (strong evidence); half gets paper (weak evidence).*  
  - **Stakes Mechanism:** Wrong answers incur **social punishment**: Stand up and announce to the class, *“I cost my friend their [job interview/catch-up] because I was wrong about the ferry.”* (For 19yos, public embarrassment > fake money.)

  ---

  ### **Activity: Rounds 1 & 2 (25 min total)**
  **Round 1: Subject’s Decision (10 min)**  
  *Each subject answers privately:*  
  1. *Speech:* “I know the ferry leaves at 3:05 PM.” (Agree/Disagree)  
  2. *Action:* “I would tell my friend to arrive by 3:00 PM.” (Yes/No)  
  3. *Confidence:* 0-100%  

  **Round 2: Attributor’s Judgment (5 min)**  
  *Attributors answer privately about their subject:*  
  1. “[Subject’s Name] knows the ferry leaves at 3:05 PM.” (Agree/Disagree)  

  **Pair Discussion (10 min):**  
  - Subjects reveal their *speech/action* answers to attributors.  
  - Attributors reveal their *judgment* of the subject’s knowledge.  
  - **Record disagreements** on sticky notes (e.g., “Subject said ‘know’ but attributor says ‘doesn’t know’”).  

  ---

  ### **Role Swap + Repeat (15 min)**  
  - Pairs swap roles (Subject ↔ Attributor) AND stakes (High ↔ Low).  
  - Repeat Rounds 1 & 2 with new scenario.  
  - *Crucial: Evidence quality (app/paper) stays the same per pair.*  

  ---

  ### **Whole-Class Synthesis (15 min)**  
  1. **Collect Data:**  
     - Sticky notes go on a 2x2 board:  
       ```  
       |                | Strong Evidence (App) | Weak Evidence (Paper) |  
       |----------------|------------------------|------------------------|  
       | High Stakes    | Speech/Action/Judgment | Speech/Action/Judgment |  
       | Low Stakes     | Speech/Action/Judgment | Speech/Action/Judgment |  
       ```  
  2. **Patterns to Surface:**  
     - Where did subjects say “I know” but *not* act? (Likely High Stakes/Weak Evidence)  
     - Where did attributors deny knowledge despite subject’s confidence? (Likely when *attributor* had High Stakes)  
     - **Key tension:** When High-Stakes Attributor judges Low-Stakes Subject (denies knowledge) vs. reverse (affirms knowledge).  

  ---

  ### **Debrief: Forced Choice (15 min)**  
  **Step 1: Map the Battlefield**  
  - Label the views *only now*:  
    - **Contextualism:** “Knows” depends on the attributor’s stakes.  
    - **Pragmatic Encroachment:** “Knows” depends on the subject’s stakes.  
    - **Invariantism:** “Knows” is stakes-independent; action is cost-benefit.  

  **Step 2: The Forced-Choice Questions**  
  *(Students vote anonymously via clicker/paper; results displayed immediately)*  
  1. *“When Zoe (High Stakes, Weak Evidence) says ‘I know’ but hesitates to act, is she:*  
     (a) Wrong to claim knowledge? (Pragmatic Encroachment)  
     (b) Wrong to hesitate? (Invariantism)  
     (c) Speaking truthfully *for her context*? (N/A—focus on action/knowledge link)”  

  2. *“When Alex (Low Stakes, Strong Evidence) says ‘I know,’ and Sam (High Stakes Attributor) says ‘Alex doesn’t know,’ who is right?*  
     (a) Alex (knowledge tracks subject’s stakes → Pragmatic Encroachment)  
     (b) Sam (knowledge tracks attributor’s stakes → Contextualism)  
     (c) Neither—stakes don’t affect truth (Invariantism)”  

  **Step 3: The Payoff**  
  - Highlight a real disagreement from the board:  
    *“In Pair 7, the High-Stakes Attributor denied the Low-Stakes Subject’s knowledge. If you voted (b) for Q2, you must defend why Sam’s high stakes make ‘Alex doesn’t know’ true. If you voted (a) or (c), you must explain why Sam is mistaken.”*  
  - **Consequence:** Assign defenders of each view to debate that specific case. No neutrality allowed.  

  ---

  ### **Predictable Problems & Fixes**  
  1. **“They’ll reverse-engineer it!”**  
     - *Mitigation:* Start mid-scenario (“Your friend is waiting for your advice NOW”). Ban theoretical terms until debrief. If a student says “stakes,” reply: “What do you mean by that? Describe the *pressure* you feel.”  

  2. **Stakes feel fake:**  
     - *Fix:* Hammer the social punishment *before* starting: *“If you’re wrong, you’ll announce it to everyone. This actually happens to people.”* Use peer pressure: “Will you risk your friend’s job interview?”  

  3. **Groups finish early:**  
     - *Extension Question:* “What if the ferry company’s app had a 5% error rate? Would you still say ‘know’ in high stakes?”  

  4. **Speech/Action decoupling fails:**  
     - *Fix:* Phrase questions starkly: *“Would you BET THEIR JOB on it? Say it aloud: ‘I know it leaves at 3:05’.”*  

  ---

  ### **Minute-by-Minute Timeline**  
  - **0-5 min:** Set up scenario, assign roles, explain stakes consequence.  
  - **5-30 min:** Round 1 (Subject decisions) + Round 2 (Attributor judgments) + Pair discussion.  
  - **30-45 min:** Role swap + Repeat Rounds 1 & 2.  
  - **45-60 min:** Class data synthesis + sticky note board.  
  - **60-75 min:** Debrief + forced-choice vote + live debate.  

  ---

  ### **What the Activity CAN’T Do (And How to Handle It)**  
  **The Limitation:** It surfaces *behavioral patterns* (hesitation, third-party denials) that all three theories *predict* but *explain differently*. Students may say, “This just shows people are more cautious when stakes are high!” (playing into invariantism).  

  **How to Weaponize This:**  
  1. In the debrief, concede: *“Yes, all three views agree high stakes make us hesitant. The fight is over WHY.”*  
  2. Force them to specify the *mechanism*:  
     - Does caution change what we *call* knowledge (Contextualism)?  
     - Does it change whether knowledge is *had* (Pragmatic Encroachment)?  
     - Or is knowledge untouched, with only *action* shifting (Invariantism)?  
  3. Use their own words: *“When Zoe in High Stakes said ‘I know’ but wouldn’t act, did her knowledge vanish? Or was it always a bad idea to act on weak evidence?”*  

  This creates a standoff where theoretical commitments are exposed by linking them to concrete moments of discomfort in the activity. The loser is the theory that can’t explain *why* their own sticky note exists.
