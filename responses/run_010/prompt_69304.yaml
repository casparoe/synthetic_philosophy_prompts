  ### **In-Class Activity Design: Backward Induction Tension**

  **Objective:** Students experience the tension between backward induction (recommending immediate ending) and the observable benefit of continued play. They confront the paradox without prior knowledge of the centipede game.

  ---

  ### **Game Setup & Payoff Arithmetic**
  - **6-node alternating-offers game** with strict incentives at each node.
  - **Payoffs (A, B) scaled for candy stakes (10 points = 1 candy)**:

  | Node | Player | END Action (Payoff A, B) | PASS Action Leads To | Payoff Comparison (Strict Inequality) |
  |------|--------|--------------------------|----------------------|--------------------------------------|
  | 1    | A      | (4, 1)                   | Node 2 (B moves)     | END: 4 > **1** (if B ends at Node 2) |
  | 2    | B      | (1, 8)                   | Node 3 (A moves)     | END: 8 > **4** (if A ends at Node 3) |
  | 3    | A      | (16, 4)                  | Node 4 (B moves)     | END: 16 > **8** (if B ends at Node 4) |
  | 4    | B      | (8, 32)                  | Node 5 (A moves)     | END: 32 > **16** (if A ends at Node 5) |
  | 5    | A      | (64, 16)                 | Node 6 (B moves)     | END: 64 > **32** (if B ends at Node 6) |
  | 6    | B      | END: (32, 128)           | None (game ends)     | END: 128 > **50** (PASS alternative)  |
  |      |        | PASS: (50, 50)           |                      |                                       |

  **Arithmetic Proof of Strict Inequalities**:
  - **Node 1**: A ends → 4. If A passes, B ends at Node 2 → A gets 1. **4 > 1** ✓  
  - **Node 2**: B ends → 8. If B passes, A ends at Node 3 → B gets 4. **8 > 4** ✓  
  - **Node 3**: A ends → 16. If A passes, B ends at Node 4 → A gets 8. **16 > 8** ✓  
  - **Node 4**: B ends → 32. If B passes, A ends at Node 5 → B gets 16. **32 > 16** ✓  
  - **Node 5**: A ends → 64. If A passes, B ends at Node 6 → A gets 32. **64 > 32** ✓  
  - **Node 6**: B ends → 128. If B passes → B gets 50. **128 > 50** ✓  

  **Stakes & Motivation**:  
  - Points convert to **candy (10 points = 1 piece)**, with a **minimum of 1 piece for all participants** to avoid triviality. Maximum payout (128 points = 12.8 pieces) ensures stakes feel meaningful. Candy is distributed publicly at the end to incentivize effort.

  ---

  ### **Activity Timeline (80 Minutes)**  
  **0–5 min**: Introduction  
  - Explain the game: "You’ll play a 6-stage game in pairs. At your turn, choose END (take points) or PASS (continue). Points = candy. Maximize your candy."  
  - Emphasize: "At each node, write a prediction about the other player’s next move and why."

  **5–10 min**: Pairing & Materials  
  - **Pairing**: Students count off 1–18. Odds = Player A, evens = Player B. Pairs: (1,2), (3,4), ..., (17,18). No friend-pairing.  
  - **Materials per pair**:  
    - 6 decision cards (one per node, labeled "Stage 1" to "Stage 6").  
    - Prediction slips (small papers) for each node.  
    - Pens.  

  **10–30 min**: Gameplay (Round 1: Unscripted)  
  - Pairs play one full game.  
  - **Procedure**:  
    1. Start with Stage 1 card.  
    2. Current player:  
       - Chooses END or PASS.  
       - Writes prediction slip: "At the next node, [Partner] will [END/PASS] because [reason]."  
       - If PASS, hand next node’s card to partner.  
    3. Collect prediction slips immediately after each decision.  
  - Teacher circulates, answers questions.  

  **30–40 min**: Gameplay (Round 2: Scripted Condition)  
  - **Split room**: Half the pairs (9 students) play against a scripted partner (run by TA/teacher).  
  - **Scripted behavior**: TA/teacher always PASSES at their first two turns (Node 1 if A, Node 2 if B), then plays rationally thereafter.  
    - *Example*: If student is Node 1 A, TA (as B) auto-PASSES at Node 2, then student faces Node 3.  
  - Unscripted pairs replay.  

  **40–50 min**: Data Collection  
  - Record outcomes: How many pairs ended at each node?  
  - Sort prediction slips by node/pair.  

  **50–70 min**: Debrief  
  - **Reveal tension**: "Backward induction says END immediately. But pairs who passed more got higher payoffs. Why?"  
  - **Use prediction slips**:  
    - Display a slip from Node 1: "I passed because I thought B would END at Node 2."  
    - Show a slip from Node 2 (same pair): "B passed because they thought A would END at Node 3."  
    - **Key insight**: "Arrival at Node 2 undercuts the Node 1 belief that B would END. Backward induction fails when it assumes players won’t deviate, but deviations happen!"  
  - **Map to concepts**:  
    - **Last-node inference**: At Node 5, A ends because they assume B will END at Node 6 (64 > 32).  
    - **Induction step**: If B rationally ends at Node 6, then A ends at Node 5, and so on.  
    - **Off-path beliefs**: At Node 3, if A passed, backward induction fails—B’s prior belief (A ends at Node 1) is already contradicted.  
  - **Scripted contrast**:  
    - Scripted pairs PASS early → more passing in response.  
    - "Even a 1% chance your partner isn’t a maximizer makes passing rational. But does this dissolve the paradox? No—it *sharpens* it. Backward induction assumes 100% rationality. If real players doubt that, the ‘irrational’ path becomes rational!"  

  **70–80 min**: Q&A & Conclusions  
  - **Objection 1**: "I passed because I’m a decent person (not irrational)."  
    - *Response*: "Other-regarding preferences deepen the paradox! If you value fairness (e.g., PASS at Node 6 for 50/50), backward induction *still* applies—but now utilities include empathy. The tension remains: why not END earlier to avoid risk?"  
  - **Objection 2**: "Small stakes made passing easy."  
    - *Response*: "Candy = real stakes. But if we scaled payoffs to $1000, would you PASS? Backward induction scales too—it’s logic, not stakes. Yet humans *do* pass more in low-stakes games, which shows induction isn’t descriptive."  
  - **Reveal the game**: "This is the **centipede game**. The paradox is unresolved—it pits rationality against observed cooperation."  

  ---

  ### **Materials List**  
  - **Decision cards** (6 per pair, text below).  
  - **Prediction slips** (small papers, 5 per player).  
  - Pens (18).  
  - Candy (enough for 12.8 pieces/student).  
  - Timer.  

  **Card Text (Example)**:
  - **Stage 1 (A)**:  
    "END: You get 4, Partner gets 1.  
    PASS: Game continues to Partner at Stage 2.  
    Prediction: If you PASS, what will Partner do at Stage 2? Why?"  
  - **Stage 6 (B)**:  
    "END: You get 128, Partner gets 32.  
    PASS: You get 50, Partner gets 50.  
    Prediction: None (final node)."  

  ---

  ### **Pitfalls & Mitigations**  
  1. **Written predictions alter behavior**?  
     - Risk: Students might PASS to "match" their prediction of cooperation.  
     - Mitigation: Reassure anonymity; collect slips *after* decisions to avoid pressure.  

  2. **Scripted confusion**?  
     - Risk: TA/teacher may misapply the script.  
     - Mitigation: Pre-run with TA; script cards for Nodes 1–2 auto-say "PASS."  

  3. **Stakes too low**?  
     - Risk: Students END early if candy is unexciting.  
     - Mitigation: Use premium candy (e.g., chocolate); publicly reward high scorers.  

  4. **Time crunch**?  
     - Risk: 20-min gameplay may run over.  
     - Mitigation: Use a visible timer; cap turns at 60 seconds.  

  ---

  ### **What the Classroom Can’t Reproduce**  
  - **Common knowledge of rationality (CKR)**: Real players doubt others’ rationality, so they PASS. The backward induction paradox *requires* CKR, but classrooms lack it.  
  - **Your role**: Explicitly state during debrief: "The tension exists because CKR is fragile. In theory, CKR forces END at Node 1. In practice, CKR breaks when Node 2 is reached—so induction fails."  

  This activity forces students to *live* the paradox, making the theoretical tension visceral. The scripted condition highlights how reputation/perception drives "irrational" play, while written predictions expose the fragility of backward induction’s assumptions.
