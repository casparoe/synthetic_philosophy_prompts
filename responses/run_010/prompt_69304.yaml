   - Predictable objections:

     Objection1: "I passed because I am a decent person, not because I reasoned badly."

       Response: This appeals to other-regarding preferences. But does it rescue or deepen the difficulty? It might rescue the player from the charge of irrationality, but it deepens the difficulty for the backward induction argument. The backward induction assumes self-interested preferences. If players have other-regarding preferences (such as caring about the other's payoff or about fairness), then the payoffs in the game are not capturing their true utilities. The paradox then reappears when we try to define the utilities. In fact, if the utilities are other-regarding, then the backward induction should be done with those utilities. It might then be rational to pass. But then the tension is that the game as we defined it (with the given payoffs) is not the game they are playing. We must be clear about the payoffs.

     Objection2: "The whole result is an artifact of the small stakes."

       Response: We can agree that with very small stakes, people might not care. But in the activity, the stakes were real (candy). Also, the backward induction argument is scale-invariant. If we scaled up the payoffs to be very large, would the students still pass? Probably not, because the risk would be higher. In fact, in high-stakes settings, the backward induction might be more predictive. But note: in the activity, we saw passing even with real stakes.

   - What will go wrong the first time:

       - The written predictions might alter behavior: if a player writes down that they think the other will take, they might feel compelled to take to be consistent? Or they might pass to be kind? We hope not, but it's possible. To mitigate, we can assure them that the predictions are private and not shown to the partner until after.

       - Students might not understand the rules.

       - The scripted condition might be confusing.

       - The scaling of the payoffs might be off: if the candy is not attractive, they might not try.

   - What the classroom version cannot reproduce:

       - The common knowledge of rationality. In the classroom, there is always a chance that the other player is not rational or has other-regarding preferences. The backward induction requires common knowledge of rationality and self-interested preferences. The activity might not have that, so the early ending might not happen. The teacher will have to supply the theoretical argument by hand.

       - The tension between the theoretical prediction and the observed behavior is the point, but the theory relies on strong assumptions.

