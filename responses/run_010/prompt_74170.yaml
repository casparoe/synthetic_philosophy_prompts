prompt: |-
  In the social-choice course I'm taking, our lecturer introduced Harsanyi's aggregation theorem by way of an analogy: the theorem supposedly reveals that the ideal social planner is just one agent choosing under risk, with society as a single decision-maker, the members playing the role of states of the world, and the impartial choice amounting to the expected utility of a lottery over lives. He then drew the conclusion that utilitarianism is not a substantive moral doctrine at all but a theorem about rational choice, so that anyone who resists it is merely resisting expected-utility theory. I would like a careful audit of that analogy. Please set out the correspondence explicitly — what plays the role of the single agent, the states, the lottery, the payoffs, and the probabilities — and then separate the disanalogies that genuinely threaten his conclusion from those that are merely cosmetic. I am particularly interested in three points: whether the members have any claim to be states of the world rather than objects of a weighting scheme; whose probabilities these are supposed to be, given that they could be read as the hypothetical observer's ignorance, as objective chances, or as nothing more than coefficients; and what happens to the picture if the lottery is resolved before rather than after individual preferences are aggregated. Please also address whether the move from a fixed weighted sum to equal weights is licensed by the theorem itself or supplied by the analogy. Finally, say whether the conclusion survives, and if it does not, whether a better analogy for the theorem is available.

  Lead with your bottom line — whether the conclusion survives — in the opening sentence, then give the reasoning; no preamble and no restating of the question. Please write in American English. I will supply the citations myself.
