  Hmm, the user is asking about Harsanyi's aggregation theorem and wants me to critically evaluate their lecturer's analogy. The lecturer claims this theorem shows utilitarianism isn't a substantive moral doctrine but just rational choice theory, and that anyone resisting it is merely resisting expected-utility theory. The user wants me to audit this analogy carefully.

  I need to start with my bottom line: the conclusion does not survive. The lecturer's analogy overreaches and misrepresents what Harsanyi's theorem actually shows. Now I'll explain why.

  First, I should recall what Harsanyi's aggregation theorem states. It shows that if individual preferences and social preferences satisfy certain axioms (like Pareto optimality and von Neumann-Morgenstern rationality), then social welfare must be a weighted sum of individual utilities. This is a mathematical result about preference aggregation.

  The lecturer's analogy maps this to expected utility theory: society is the single agent, members are states of the world, impartial choice is expected utility of a lottery over lives. But this mapping has serious problems.

  Let me set up the correspondence explicitly as requested:
  - Single agent: Society (the social planner)
  - States of the world: Individual members of society
  - Lottery: Random assignment of who occupies which social position/life
  - Payoffs: Utility levels associated with each life
  - Probabilities: Likelihood of being any particular individual (often interpreted as equal probabilities)

  Now for the disanalogies that genuinely threaten the conclusion:

  1. Members as states vs. objects of weighting: Treating individuals as "states" is misleading. In expected utility theory, states are passive possibilities, but individuals are active agents with their own preferences. This framing obscures that the weights come from the aggregation theorem itself, not from any "ignorance" about identity.

  2. Nature of probabilities: The probabilities here are purely formal coefficients, not representing actual ignorance or objective chances. Harsanyi used an "original position" thought experiment where probabilities represent impartiality, but the theorem itself doesn't require this. The probabilities are normative choices, not epistemic or metaphysical facts.

  3. Timing of lottery resolution: If the lottery resolves before aggregation, we're back to standard social choice with known inequalities. The "veil of ignorance" setup is essential to the analogy but isn't part of the theorem. Without it, equal weighting isn't justified.

  The move to equal weights isn't licensed by the theorem - it's smuggled in through the analogy. The theorem gives a weighted sum; equal weights require additional normative assumptions about impartiality.

  The conclusion doesn't survive because:
  - The theorem is about aggregating preferences under risk, not deriving moral obligations
  - Resisting utilitarianism isn't necessarily resisting EU theory; one could accept EU theory but reject the aggregation axioms (like rejecting Pareto when it conflicts with fairness)
  - The analogy confuses mathematical representation with moral justification

  A better analogy would be that Harsanyi shows social welfare under risk must be linear in individual utilities - but this doesn't dictate which weights to use or make utilitarianism "merely" rational choice. The moral work happens in choosing the weights and interpreting utilities.

