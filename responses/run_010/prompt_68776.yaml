  2. Assertion view (from 4: Scenario A worse)
  3. Actual deception view (from 4: Scenario B worse)
  4. Intention view (from 4: Equal)
  5. Literal truth view (from 5: No)
  6. Consequentialist (paper trail) (from 6: Yes)
  7. Contextual view (conventions only) (from 7: No)
     or Contextual view with protective exception (from 7: Yes) -> that would be an eighth leaf.

  In step 7, if they say Yes, it's a combination of contextual and protective, which is common. If they say No, it's only contextual for conventions.

  So leaves:
  - Leaf 1: Protective exception
  - Leaf 2: Assertion view
  - Leaf 3: Actual deception view
  - Leaf 4: Intention view
  - Leaf 5: Literal truth view
  - Leaf 6: Consequentialist (paper trail)
  - Leaf 7: Contextual view (conventions only)
  - Leaf 8: Contextual view with protective exception (if we split)

  But Leaf 1 and Leaf 8 are similar, but Leaf 1 comes from the path where poker bluff is wrong, and Leaf 8 from where it is not.

  Leaf 1: Protective exception: believes poker bluff is wrong (deception) but lying to protect is okay.

  Leaf 8: Contextual with protective: believes poker bluff is okay (context) and lying to protect is okay.

  So they are different.

  We have 8 leaves.

  Now, what about the combination where at step 3, they said drug company not wrong, and at step 5, they said candidate wrong, and at step 6, they said paper trail doesn't matter -> Leaf: Deception is deception view. That's Leaf from 6: No.

  So let's list all leaves:

  From the tree:

  - At step 2: Yes -> Leaf A: Protective exception
  - At step 4: A worse -> Leaf B: Assertion view
  - At step 4: B worse -> Leaf C: Actual deception view
  - At step 4: Equal -> Leaf D: Intention view
  - At step 5: No -> Leaf E: Literal truth view
  - At step 6: Yes -> Leaf F: Consequentialist (paper trail)
  - At step 6: No -> Leaf G: Deception is deception view (might be similar to intention view, but not necessarily)
  - At step 7: Yes -> Leaf H: Contextual with protective
  - At step 7: No -> Leaf I: Contextual (conventions only)

  That's 9 leaves.

  Leaf G: Deception is deception view. This might be the same as the intention view, but the intention view is already a leaf. In the tree, Leaf D is from step 4 (equal) which is for those who think drug company is wrong and then think clumsy lie and successful misleading are equally bad. Leaf G is from a different path: drug company not wrong, candidate wrong, paper trail doesn't matter. So they think the drug company is not wrong (because no lying?) but candidate is wrong (misleading) and paper trail doesn't make it less wrong. This might be a view that misleading is wrong only if it causes harm or something, but we don't have enough to define.

  We can merge some leaves.

  Leaf G might be rare. Or we can call it "General deception view" and its awkward commitment is that even true statements can be wrong if deceptive, regardless of consequences.

  Now, the user's cases are included:
  - Drug company: Q1 or step 3
  - Used-car seller: not explicitly used, but similar to drug company or candidate. We can swap if needed, but not necessary.
  - Candidate: step 5
  - Poker bluff: step 1
  - Abusive ex: step 2 and step 7
  - Clumsy lie and successful misleading: step 4
  - Paper trail: step 6

  The two more: clumsy lie and successful misleading are covered in step 4, and paper trail in step 6.

  Now, for the leaves, we need to name them and give awkward commitment.

  Also, we need to identify empty spots and if the tree can't separate two views.

  Let's finalize the tree structure.

  Proposed decision tree:

  1. Poker Bluff:
     In a poker game, is it wrong to bluff by betting high on a weak hand, when everyone knows that bluffing is part of the game?
     - No, it's not wrong because of the context. -> Go to 7
     - Yes, it's still wrong. -> Go to 2

  2. Abusive Ex Lie:
     Is it okay to lie to an abusive ex-partner who is trying to find your roommate, by saying the roommate moved to another state?
     - Yes, to protect her. -> Leaf 1: Protective Lie View
     - No, lying is always wrong. -> Go to 3

  3. Drug Company:
     Is it wrong for the drug company to say "no clinical trial has found the side effect" when the trials were too small to detect it?
     - Yes, because they are trying to mislead. -> Go to 4
     - No, because the statement is true. -> Go to 5

  4. Belief Formation:
     Scenario A: A student tells a professor, "My dog ate my homework," but the professor knows the student has no dog and doesn't believe it.
     Scenario B: The student says, "I couldn't do the homework because of an animal-related incident," which is true (he watched cat videos) and the professor believes it and accepts the excuse.
     Which is worse?
     - Scenario A (the clumsy lie) is worse. -> Leaf 2: Assertion View
     - Scenario B (the successful misleading) is worse. -> Leaf 3: Actual Deception View
     - They are equally bad. -> Leaf 4: Intention View

  5. Candidate:
     Is it wrong for the candidate to say "every dollar went into the campaign" when he received kickbacks from vendors?
     - Yes, because it's deceptive. -> Go to 6
     - No, because it's true. -> Leaf 5: Literal Truth View

  6. Paper Trail:
     Is the executive's misleading truth less wrong than a lie would have been, because it avoids legal liability?
     - Yes, because of the legal risk. -> Leaf 6: Consequentialist View
     - No, the deception is just as wrong. -> Leaf 7: Deception Is Deception View

  7. (From Poker: No) Abusive Ex Lie:
     Is it okay to lie to an abusive ex-partner to protect your roommate?
     - Yes. -> Leaf 8: Contextual View with Exceptions
     - No. -> Leaf 9: Contextual View (Conventions Only)

  Now, 9 leaves.

  Awkward commitments:

  - Leaf 1: Protective Lie View: Might have to allow lying whenever the liar thinks it will prevent harm.
  - Leaf 2: Assertion View: A failed lie with no deception is still wrong, but a successful misleading truth is not.
  - Leaf 3: Actual Deception View: Accidentally causing a false belief (e.g., by a careless true statement) might be worse than a well-intentioned lie that no one believes.
  - Leaf 4: Intention View: A failed attempt to deceive is as bad as a successful one.
  - Leaf 5: Literal Truth View: You can deceive without lying and it's not morally wrong, even if it causes harm.
  - Leaf 6: Consequentialist View: The same deceptive act is less wrong if it has better consequences for the deceiver (like avoiding legal trouble).
  - Leaf 7: Deception Is Deception View: Any deceptive act is wrong, regardless of the consequences or the means (truth or lie).
  - Leaf 8: Contextual View with Exceptions: It's hard to define which contexts allow deception and which don't.
  - Leaf 9: Contextual View (Conventions Only): Lying to save a life might still be wrong if it's not in a game or negotiation context.

  Now, empty spots: Some combinations might not occur. For example, if someone thinks poker bluff is not wrong (context matters) but then says it's not okay to lie to the abusive ex, that's Leaf 9. And if they say it is okay, Leaf 8.

  But is there a view that thinks poker bluff is not wrong but the drug company is wrong? In our tree, from step 1 (poker: No) we go to step 7 (abusive ex), not to the drug company. So we don't ask the drug company for them. That's a gap. We might not cover that.

  Similarly, for those who think poker bluff is wrong and then drug company is not wrong, we go to candidate case.

  But a person might think that in poker, deception is okay (context), and also that the drug company's misleading is not wrong (because no false assertion). But in our tree, if they say poker not wrong, we don't ask about drug company. So we don't capture that combination. But it might be covered in Leaf 8 or 9, which are about context, but without the drug company, we don't know their view on misleading.

  This is a limitation.

  The tree might not separate the assertion view from the contextual view if the assertion view also accepts poker bluff as not wrong because it's not an assertion? In poker, bluffing isn't an assertion of belief; it's a bet. So an assertion view might think poker bluff is not a lie and therefore not wrong. But in our tree, at step 1, if they say poker bluff is not wrong, we go to step 7 and they might end up in Leaf 8 or 9, not in the assertion view leaf.

  So the tree might misclassify.

  Also, the used-car seller case is not used, but it's similar to drug company or candidate.

  Confidence in independence: The branches are not fully independent because, for example, if you think context matters (poker not wrong), you might be more likely to think that intention is not sufficient. But we've ordered to test context first.

  The question I'm least sure discriminates: Step 6, the paper trail case. Both the collapse-the-distinction and the distinction-is-everything crowd might answer the same way.

  - Collapse-the-distinction: think lying and misleading are equally bad, so they would say "No" to paper trail question (not less wrong).
  - Distinction-is-everything: think lying is worse, so they might say "Yes" (misleading truth is less wrong because it's not a lie).

  But the paper trail question asks if it is less wrong because of the legal risk, not because it's not a lie. So someone who thinks the distinction matters might say Yes for that reason, but also someone who is consequentialist might say Yes even if they collapse the distinction.

  It's messy.

  Perhaps both crowds might say "No" if they think the moral wrong is the same regardless of consequences.

  I'm least confident in step 6.

  Output in plain indented tree with cases.
answer: |-
  Below is the decision tree instrument for your section. It's designed as a sorting exercise with six branching questions (each a concrete case) leading to nine leaves. Each question is framed as a binary choice to keep it simple, but one question (Question 4) has three options to capture a key disagreement. The cases are based on your provided examples, sharpened for clarity, with one added case (Question 6) to cover the "paper trail" scenario. All questions are answerable by someone with no ethics background—no theoretical language is used, and each case is described in 1–3 sentences.

  The tree is structured to reveal the underlying feature of the speech act that students intuitively treat as morally decisive. The branching questions are ordered to test independence, but I'll note limitations at the end. Each leaf includes:
  - A **standard name** for the position (if it exists in the literature) or a descriptive name.
  - A note if the position is rarely defended.
  - **Most awkward commitment**: One sentence highlighting a counterintuitive implication of the view, which you can use to spark debate.

  ---

  ### Decision Tree: Is Lying Worse Than Merely Misleading?

  **Start Here: Question 1 (Context: Does convention override morality?)**  
  *Case: Poker Bluff*  
  In a high-stakes poker game, a player bluffs by betting heavily on a weak hand. Everyone at the table knows bluffing is a normal part of poker and expects it. Is the bluff wrong?  
  - **No, because it’s part of the game’s rules.** → Go to Question 2  
  - **Yes, because it’s still deception.** → Go to Question 3  

  **Question 2 (For "No" on Poker: Does protection justify deception?)**  
  *Case: Abusive Ex (Protective Lie)*  
  Your abusive ex-partner calls, demanding to know where your roommate lives. You lie and say, "She moved to another state," even though she’s in your apartment. This protects her from harm. Is lying okay here?  
  - **Yes, to keep her safe.** → **Leaf 8: Contextual View with Exceptions**  
  - **No, lying is never acceptable.** → **Leaf 9: Contextual View (Conventions Only)**  

  **Question 3 (For "Yes" on Poker: Does intent matter without a false statement?)**  
  *Case: Drug Company*  
  A drug company’s press release states, "No clinical trial has found side effect X." This is true, but only because every trial was too small to detect X. The company hopes people will think the drug is safe. Is this statement wrong?  
  - **Yes, because they’re trying to mislead.** → Go to Question 4  
  - **No, because it’s technically true.** → Go to Question 5  

  **Question 4 (For "Yes" on Drug Company: What matters more—attempt or outcome?)**  
  *Case: Clumsy Lie vs. Successful Misleading*  
  - *Scenario A (Clumsy Lie):* A student claims, "My dog ate my homework," but the professor knows the student has no dog and doesn’t believe it.  
  - *Scenario B (Successful Misleading):* A student says, "I couldn’t finish due to an animal incident," which is true (they watched cat videos) but misleading, and the professor believes it and excuses them.  
  Which is worse?  
  - **Scenario A (clumsy lie) is worse.** → **Leaf 2: Assertion View**  
  - **Scenario B (successful misleading) is worse.** → **Leaf 3: Actual Deception View**  
  - **They are equally bad.** → **Leaf 4: Intention View**  

  **Question 5 (For "No" on Drug Company: Can a true statement be deceptive?)**  
  *Case: Political Candidate*  
  A candidate is asked, "Did you use campaign funds for personal gain?" They answer, "Every dollar went into the campaign," which is true for the invoices (money went to vendors) but false overall because they got kickbacks from those vendors. Is this answer wrong?  
  - **Yes, because it’s deceptive.** → Go to Question 6  
  - **No, because it’s factually correct.** → **Leaf 5: Literal Truth View**  

  **Question 6 (For "Yes" on Candidate: Do consequences change wrongness?)**  
  *Case: Paper Trail*  
  A CEO tells investors, "Our product has never been recalled," which is true (it was pulled for "safety reviews," not recalls). This misleads them into thinking it’s safe. If the CEO had lied and said "no safety issues," it could be proven false in court. By using this wording, they avoid legal risk. Is this less wrong than lying?  
  - **Yes, because it avoids legal trouble.** → **Leaf 6: Consequentialist View**  
  - **No, it’s just as deceptive.** → **Leaf 7: Deception-Is-Deception View**  

  ---

  ### Leaves (Outcomes)  
  Each leaf represents a position derived from the combination of answers. The "most awkward commitment" is designed to provoke discussion in the second half of your section.  

  1. **Leaf 2: Assertion View**  
     - **Standard name**: Assertion View (lying requires a false statement).  
     - **Most awkward commitment**: You must condemn a clumsy lie that fools no one (e.g., "my dog ate it") more harshly than a misleading truth that causes real harm.  

  2. **Leaf 3: Actual Deception View**  
     - **Standard name**: Actual Deception View (moral weight is on causing false belief).  
     - **Most awkward commitment**: Accidentally causing a false belief (e.g., with a careless true statement) could be worse than an intentional lie that fails.  

  3. **Leaf 4: Intention View**  
     - **Standard name**: Intention View (moral weight is on intent to deceive).  
     - **Most awkward commitment**: A bungled lie that no one believes is as wrong as a successful one that ruins lives.  

  4. **Leaf 5: Literal Truth View**  
     - **Standard name**: Literal Truth View (only false statements are wrong).  
     - **Note**: Rarely defended as a standalone view.  
     - **Most awkward commitment**: You can deliberately trick people with true statements (e.g., the drug company) and it’s not blameworthy, even if it causes harm.  

  5. **Leaf 6: Consequentialist View**  
     - **Standard name**: Consequentialist View (moral weight is on outcomes).  
     - **Most awkward commitment**: The same deceptive act (e.g., the CEO’s statement) is less wrong if it benefits the deceiver (e.g., by avoiding a lawsuit).  

  6. **Leaf 7: Deception-Is-Deception View**  
     - **Descriptive name**: Deception-Is-Deception View (all deception is equally wrong).  
     - **Note**: Often implied but rarely explicitly defended.  
     - **Most awkward commitment**: Misleading with a true statement (e.g., the candidate) is just as bad as lying, even if it prevents legal consequences or is unintentional.  

  7. **Leaf 8: Contextual View with Exceptions**  
     - **Descriptive name**: Contextual View with Exceptions (convention or protection overrides deception).  
     - **Most awkward commitment**: Lying to save a life (e.g., abusive ex) is fine, but lying in a non-emergency (e.g., poker) might not be—even if both use the same words.  

  8. **Leaf 9: Contextual View (Conventions Only)**  
     - **Descriptive name**: Contextual View (Conventions Only) (only conventional contexts excuse deception).  
     - **Note**: Rarely defended without exceptions.  
     - **Most awkward commitment**: Bluffing in poker is acceptable, but lying to protect someone from violence might still be wrong if it’s not "part of the rules."  

  9. **Leaf 1: Protective Lie View**  
     - **Standard name**: Protective Lie View (deception is justified to prevent harm).  
     - **Most awkward commitment**: You must accept that anyone can lie whenever they *believe* it prevents harm—even if they’re wrong or overreacting.  

  ---

  ### Empty Combinations and Limitations  
  The tree has **9 leaves** but covers only the most common combinations. Below are gaps (unoccupied combinations) and why they’re empty, based on logical coherence and real-world defensibility:  

  1. **Combination: "Poker is wrong (Q1: Yes) → Drug company is not wrong (Q3: No) → Candidate is wrong (Q5: Yes) → Paper trail matters (Q6: Yes)"**  
     - **Why empty?** Incoherent. If you think poker deception is wrong due to intent/outcome, but the drug company’s intent isn’t wrong, you can’t consistently call the candidate’s similar act wrong without appealing to consequences—yet the paper trail consequence makes it *less* wrong. This conflates intent, assertion, and outcomes.  
     - **Status**: Incoherent.  

  2. **Combination: "Poker is not wrong (Q1: No) → Protective lie is okay (Q2: Yes) but also think clumsy lie (Q4A) is worse than successful misleading (Q4B)"**  
     - **Why empty?** Unattractive. Contextual views (from poker) usually focus on conventions, not assertion vs. implication. Prioritizing assertion after endorsing context would imply that poker bluffs (which aren’t literal assertions) are exempt, but clumsy lies in non-contextual settings are extra bad—a jarring priority shift few defend.  
     - **Status**: Unattractive.  

  3. **Combination: "Poker is wrong (Q1: Yes) → Protective lie is not okay (Q2: No) → Drug company is not wrong (Q3: No) → Candidate is not wrong (Q5: No)"**  
     - **Why empty?** Genuinely underexplored. This view would condemn deception in poker and protection but excuse corporate/political misleading as long as it’s literal truth. It’s consistent but implausible, as it requires ignoring intent and harm in high-stakes scenarios.  
     - **Status**: Underexplored.  

  **Two leaves the tree can’t cleanly separate**:  
  - **Literal Truth View (Leaf 5) and Contextual View (Conventions Only, Leaf 9)**: Both might answer "no" to the drug company (Q3) and candidate (Q5) cases, but for different reasons (e.g., Leaf 5 cares about truth, Leaf 9 cares about context). The tree sorts them via the poker question (Q1), but if a student thinks poker is wrong *and* only literal lies matter, they could end up in Leaf 9 accidentally. I recommend grouping these in discussion if answers overlap.  
  - **Intention View (Leaf 4) and Deception-Is-Deception View (Leaf 7)**: Both treat lying and misleading as equally bad, but Leaf 4 focuses on intent, while Leaf 7 is broader. The tree separates them via the drug company case (Q3), but in practice, students may conflate them.  

  **Confidence in Branch Independence**:  
  - **Moderate confidence (70%)**. The questions are ordered to isolate features: context (Q1) → intent (Q3) → belief outcome (Q4) → truth status (Q5) → consequences (Q6). Early nodes (e.g., Q1 on context) don’t predetermine later answers (e.g., Q4 on belief), and a person *could* consistently answer "context matters" but "intent doesn’t" (e.g., poker not wrong but drug company wrong). However, real intuitions often bundle features (e.g., endorsing context might correlate with excusing intent), so independence isn’t perfect.  

  **Least Confident Discriminator**:  
  - **Question 6 (Paper Trail)**. I suspect both the "collapse-the-distinction" and "distinction-is-everything" crowds will answer **"No"** here (it’s *not* less wrong). The collapse crowd sees no moral difference between lying and misleading, so consequences like legal risk shouldn’t matter. The distinction crowd might also say "no" because they think lying is inherently worse, so avoiding it via misleading doesn’t reduce wrongness—it’s still deception. This could make the node less effective at splitting groups. To mitigate, emphasize the "avoiding legal trouble" aspect in the case description to force a focus on consequences.  

  ---

  **How to Use in Section**:  
  1. **Sorting Exercise (First 30 mins)**: Have students answer the tree individually on paper. Use the 6 questions as a flowchart.  
  2. **Group Argument (Second 30 mins)**: Group students by leaf (or debate across leaves). Use the "most awkward commitment" as a discussion prompt—e.g., "Assertion View: How do you defend punishing a silly lie more than harmful truth?"  
  3. **Address Collapse**: If the distinction collapses in debate, highlight Question 4 (clumsy lie vs. successful misleading) and Question 6 (paper trail) as flashpoints.  

  This tree prioritizes your cases, exposes hidden disagreements, and avoids theory-laden language. Let me know if you need tweaks!
