prompt: |-
  I'm a junior doing an independent study on optimal betting, and I've hit a wall I'd like help with. For a repeated even-money gamble that wins with probability p > 1/2, Kelly betting stakes the fraction 2p − 1 and thereby maximizes expected log wealth. My teacher's position is that this makes the criterion nothing more than a logarithmic utility function in disguise: a genuinely risk-neutral agent, who cares only about expected dollars on some fixed future date, should stake everything every round, and Kelly is simply what falls out if you happen to have log preferences. I want to argue that he is wrong, but I cannot get the case tight. Please argue as strongly as you honestly can that maximizing the long-run time-average growth rate of wealth is a requirement of rationality for repeated multiplicative gambles even for an agent whose preferences over outcomes are linear in money — that is, that the dispute concerns rationality itself rather than which utility function best fits the agent. Build the case on the gap between ensemble averages and time averages, and on what the all-in policy actually produces with high probability; then confront the objection that at every finite horizon the all-in policy genuinely does have the larger expectation, so a growth-rate criterion can only be asymptotically right. Please commit to a definite position and give your reasons rather than laying out both sides and leaving me to choose, and end by naming the step in your own argument you consider weakest.
