prompt: |-
  I'm in a formal epistemology seminar and we just spent two weeks on imprecise probabilities, so I'm trying to figure out what I actually think by just writing down my gut verdicts on a bunch of cases. Here they are:

  1. A coin whose bias nobody has ever checked and that I have zero information about: I refuse to say 0.5 for heads. I also refuse a bet on heads at even odds, and a bet on tails at even odds. Refusing both doesn't feel irrational to me, but a sharp 0.5 agent seems stuck taking at least one.
  2. Same coin, except I've watched it come up heads three times. Now I'll take the bet on heads at even money. So the mushiness is suppose to shrink as evidence comes in.
  3. An urn with 90 balls, 30 red, the other 60 either black or yellow in a split nobody tells me. Bet on red vs. bet on black: I take red. Bet on red vs. bet on yellow: I take red again. Black and yellow are perfectly symmetric so I've got no more reason to favor either, and I still don't want either one. But I also think somebody who'd pay $10 to dodge that ambiguity is being dumb — I just can't say why.
  4. A case where I learn something that has literally nothing to do with the question and my range for the question gets wider instead of narrower (our prof called it dilation). Verdict: bug, not feature. You shouldn't ever get less confident for free.
  5. A poll comes out using a sampling method I don't understand at all, and my range for the result widens a lot. Verdict: that's fine, maybe even correct. Cases 4 and 5 are the pair I can't reconcile — both are "learn something, get less precise," and I want to call one broken and the other right.
  6. Is a pile of 5,000 grains a heap? My credence is mushy here too, but it feels like a different animal: the mush is in the words, not in my evidence. And whether the keys are in the kitchen — I haven't looked, my range is wide, and here I think I'm criticizable for it, unlike the coin where I genuinely have nothing to go on.
  7. A doctor with a genuinely wide risk estimate has to decide whether to operate. I don't think she's irrational for acting as if the risk were one number, even though I don't think her belief state should be one.

  Is there a principle — or a small handful of candidates — that gets all or most of these? I'd want it stated properly rather than gestured at, with each clause tied to the case that motivated it. Then tell me what it predicts for a case I didn't list: learning the result of a medical test whose sensitivity and specificity are only known to lie somewhere in a range. And be honest about which of my verdicts it forces me to give up. I half-suspect it's 4 or 5, but maybe it's actually 6.
reasoning: |-
  Okay, let me start by understanding the user's problem. They're in a formal epistemology seminar focusing on imprecise probabilities. They've listed seven cases where their intuitive judgments about probabilities and decisions don't align with precise probability models. They want a coherent principle that explains most of these cases, predicts a new scenario, and highlights where their intuitions might need adjustment.

  First, I need to break down each case. Case 1 involves a coin with unknown bias. The user refuses to assign 0.5 or accept even-odds bets on either side. This suggests they're uncomfortable with precise probabilities when there's no information. Case 2 adds evidence—three heads—making them willing to bet on heads. So evidence reduces the "mushiness."

  Case 3 is the urn with 30 red balls and 60 that are either black or yellow in unknown proportion. They prefer red over black or yellow but won't choose between black and yellow. Yet, they think avoiding ambiguity for $10 is irrational. There's a conflict between preference and action here. 

  Cases 4 and 5 both involve learning something that widens the probability range. The user rejects dilation in Case 4 (unrelated information causing less confidence) but accepts it in Case 5 (unfamiliar polling method). They need a principle to distinguish these. 

  Case 6 compares linguistic vagueness (heap paradox) with evidential uncertainty (keys in kitchen). They feel the latter is criticizable, unlike the coin case. Case 7 deals with a doctor making a decision based on a wide risk estimate, where acting precisely isn't seen as irrational.

  The key challenges are reconciling Cases 4 and 5, explaining the difference in Case 6, and addressing the action-belief gap in Cases 3 and 7. The user might be seeking validation of their intuitions but also open to adjusting some, like Case 4 or 6.

  The user's deeper need is likely to solidify their understanding of imprecise probabilities by testing their intuitions against a robust framework. They might also want to resolve cognitive dissonance between different cases, especially why some dilations feel wrong and others don't. 

  I recall that imprecise probability models like credal sets or sets of probabilities can handle uncertainty ranges. The Ambiguity Aversion principle explains refusing bets in Cases 1 and 3. The Differential Ambiguity principle distinguishes Cases 4 and 5 based on whether new information increases relevant uncertainty. 

  For Case 6, distinguishing semantic vs. empirical uncertainty is crucial. The doctor in Case 7 shows that decision-making can use a single probability (e.g., minimax) without committing to it epistemically. 

  In the medical test scenario, learning the result with imprecise sensitivity/specificity should widen the probability range. This aligns with Case 5 but contrasts with Case 4. The user might need to accept that some dilation is legitimate when new evidence introduces more uncertainty, which means giving up their verdict on Case 4 as a bug. 

  The user might resist this, but the principle clarifies that dilation isn't inherently irrational—it depends on whether the evidence amplifies existing ambiguity. Their intuition in Case 6 about the keys might also need adjustment; both cases involve empirical uncertainty, but the stakes differ.
answer: |-
  Here's a synthesis of your intuitions into a set of principles, showing how they handle your cases, predicting the medical test case, and identifying the necessary concession.

  ### Core Principles
  1.  **Epistemic Ambiguity Aversion:** When evidence is insufficient to precisely identify a single probability model (e.g., due to ignorance, symmetry, or model uncertainty), rational belief is represented by a *set* of probabilities (a *credal set*). Rational agents avoid sharp commitments not warranted by evidence.
  2.  **Differential Ambiguity:** Ambiguity matters only if it's *relevant* and *actionable*. Learning irrelevant facts shouldn't increase ambiguity. Learning that existing evidence is unreliable *should* increase ambiguity.
  3.  **Decision Under Ambiguity:** Rational action under ambiguity requires a separate decision rule (e.g., Γ-Maximin: maximize minimum expected utility). This rule *can* select a single action even when belief is imprecise.
  4.  **Semantic vs. Empirical Uncertainty:** Vagueness in language (e.g., "heap") creates *semantic uncertainty*, resolved by precisification. Lack of evidence about the world creates *empirical uncertainty*, resolved by evidence gathering. Criticizability applies primarily to failing to resolve *empirical* uncertainty when feasible.

  ---

  ### How the Principles Handle Your Cases

  1.  **Unknown Bias Coin (No Evidence):**
      *   **Principle:** Epistemic Ambiguity Aversion. Zero evidence → maximal credal set (e.g., [0, 1] for heads). Refusing both bets is rational (Ambiguity Aversion via Γ-Maximin: min EU for Heads bet = min EU for Tails bet = -1 < 0).
      *   **Verdict:** Matched. Sharp 0.5 agent is irrational by ignoring ambiguity.

  2.  **Unknown Bias Coin (3 Heads):**
      *   **Principle:** Evidence narrows the credal set (e.g., now favors heads, perhaps [0.6, 0.9]). The min EU for a bet on heads at even odds is now positive (e.g., 0.6 * 1 + 0.4 * (-1) = 0.2 > 0), so Γ-Maximin prescribes taking it.
      *   **Verdict:** Matched. Evidence reduces imprecision.

  3.  **Urn (30 Red, 60 B/Y Unknown):**
      *   **Epistemic:** Ambiguity Aversion → Precise P(Red)=1/3, Imprecise P(Black)=P(Yellow)=[0, 2/3] with P(Black) + P(Yellow) = 2/3.
      *   **Decision (Red vs. Black):** Min EU(Bet Red) = min(1/3 * U(win) + 2/3 * U(lose)) = U(lose) + (1/3)(U(win)-U(lose)). Min EU(Bet Black) = min([0, 2/3] * U(win) + [1/3, 1] * U(lose)) = U(lose) (achieved if P(Black)=0). Since min EU(Bet Red) > min EU(Bet Black), Γ-Maximin prefers Bet Red. Similarly for Red vs. Yellow.
      *   **Decision (Black vs. Yellow):** Min EU(Bet Black) = min([0, 2/3] * U(win) + [1/3, 1] * U(lose)) = U(lose) (if P(Black)=0). Min EU(Bet Yellow) = U(lose) (if P(Yellow)=0). They are equal. Γ-Maximin is indifferent; any choice (or randomization) is permissible. Refusing *is* an option (indifference allows inaction).
      *   **Paying to Avoid:** Principle 2 (Differential Ambiguity). The ambiguity *is* relevant and Γ-Maximin *does* prescribe refusing the B vs. Y bet in favor of status quo (EU=0 > min EU = U(lose) for either bet). Paying a small amount to avoid a choice with guaranteed negative min EU *can* be rational (if U(-$10) > U(lose the bet)). Your intuition that it's "dumb" suggests your personal decision rule under ambiguity might be less pessimistic than Γ-Maximin (e.g., Hurwicz criterion).
      *   **Verdict:** Mostly Matched (Epistemic & Red vs. B/Y). Decision on B vs. Y & paying matched by Γ-Maximin. Your "dumb" verdict hints your decision rule differs.

  4.  **Dilation (Irrelevant Info):**
      *   **Principle:** Differential Ambiguity. Learning *irrelevant* information (by definition) shouldn't introduce *new* ambiguity relevant to the hypothesis. Dilation often does this - it makes the credal set *less precise* about the hypothesis *despite* gaining information. This violates Principle 2. It's a bug.
      *   **Verdict:** Matched ("bug").

  5.  **Unfamiliar Poll (Relevant Unreliability):**
      *   **Principle:** Differential Ambiguity. Learning the poll used an unfamiliar method reveals *relevant ambiguity* about how to interpret the evidence itself (model uncertainty). This *correctly* widens the credal set. The new information *uncovers* hidden unreliability/ambiguity in your epistemic state.
      *   **Verdict:** Matched ("fine, correct").

  6.  **Heap (Semantic) vs. Keys (Empirical):**
      *   **Heap (Semantic):** Principle 4 (Semantic vs. Empirical). The mush arises from the *meaning* of "heap," not lack of evidence about the world. No amount of grain-counting evidence resolves it. It requires linguistic/conceptual precisification, not empirical investigation. Not criticizable for imprecision.
      *   **Keys (Empirical):** Principle 4. The mush arises from *lack of empirical evidence* (you didn't look). Gathering evidence (looking in the kitchen) *is* feasible and directly resolves the uncertainty. You *are* criticizable for not reducing easily resolvable empirical ambiguity.
      *   **Verdict:** Matched. Distinction explained.

  7.  **Doctor's Decision:**
      *   **Principle:** Decision Under Ambiguity. The doctor's *belief state* (wide risk estimate) is imprecise (Epistemic Ambiguity Aversion). Her *action* (operate or not) is chosen using a decision rule (e.g., Γ-Maximin, Γ-Maximax, Hurwicz) applied to her credal set. This rule outputs a single action ("acting as if one number"). This is rational decision-making *given* the imprecise beliefs.
      *   **Verdict:** Matched.

  ---

  ### Prediction: Medical Test with Imprecise Sensitivity/Specificity

  *   **Scenario:** You have a prior credal set for disease prevalence P(D). You learn the result (T+ or T-) of a test. The test's sensitivity (P(T+|D)) is only known to be in [S_min, S_max] and specificity (P(T-|~D)) in [C_min, C_max].
  *   **Prediction (Principles 1 & 2 - Epistemic Ambiguity Aversion & Differential Ambiguity):**
      1.  **Prior State:** Imprecise prior P(D) (e.g., based on limited evidence).
      2.  **Learning Result:** The test result is *highly relevant* evidence. However, the *reliability* of this evidence (sensitivity/specificity) is ambiguous.
      3.  **Posterior State:** Your posterior credal set for P(D|T+) or P(D|T-) will be **wider** than it would have been if sensitivity/specificity were known precisely. The imprecision in the test parameters *propagates* into the posterior. The range might even dilate relative to the prior in some subcases.
      4.  **Why?** The Differential Ambiguity principle applies: learning the result *reveals* the critical ambiguity in *how to interpret* this specific piece of evidence (the test). Each possible sensitivity/specificity pair implies a different likelihood function. Updating your prior with each possible likelihood function within the ranges generates the wider posterior credal set. This is analogous to your Case 5 (Unfamiliar Poll) – learning the result *exposes* the underlying model ambiguity.

  ---

  ### The Necessary Concession: Giving Up Case 4's Intuition as Universal

  The principles force you to **give up your Case 4 verdict ("bug") as a universal rule.** While your intuition that *irrelevant* information shouldn't widen your credal set (Differential Ambiguity Principle) holds, **dilation itself is not inherently irrational.**

  *   **Why Case 4 is sometimes rational:** Dilation occurs when learning evidence that creates a *dependency* between your prior uncertainty and the hypothesis *conditional* on the evidence. While often pathological (as in standard dilation examples where the evidence seems irrelevant *a priori*), it can arise legitimately from the structure of uncertainty (like in the medical test case). The *irrelevance* of the learned information *to the hypothesis itself* is key, not the mere fact of widening.
  *   **The Core Issue in Case 4:** The standard dilation examples violate the Differential Ambiguity principle. The learned evidence is irrelevant to the hypothesis *and* doesn't reveal any new ambiguity about the reliability of *other* evidence or models. It's an artifact of the specific imprecise model setup. Your intuition correctly flags this as a "bug" *of that specific model or example*. However, the *mechanism* of dilation (widening due to conditional dependencies under imprecision) is the same mechanism that *correctly* produces widening in Case 5 and the Medical Test case.
  *   **Revised Stance Required:** You must accept that **learning *relevant* evidence that *reveals* or *amplifies* underlying model ambiguity can rationally lead to a less precise credal set (dilation).** The flaw in Case 4 isn't dilation *per se*, but that the dilation is caused by evidence that is irrelevant and doesn't genuinely reveal ambiguity (violating Principle 2). Your intuition correctly identifies *that specific instance* as broken, but the principle clarifies *why* it's broken (irrelevance) and why dilation in Cases 5/Medical Test is rational (exposing relevant unreliability).

  In essence, you keep your verdicts for all cases, but the principle refines your understanding of Case 4: dilation isn't fundamentally broken; *that particular instance* of dilation is broken because it violates the Differential Ambiguity principle. The widening in Case 5 and the Medical Test case is a feature, not a bug.
