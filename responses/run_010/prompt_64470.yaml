prompt: |-
  I am taking a philosophy of cognitive science seminar this term, and my paper is supposed to assess whether the brain literally computes or is merely usefully *described* as computing. I have been reading accounts of implementation in the wrong order, because I cannot yet say what would make any of them adequate. I would like the adequacy standard first.

  Begin with one sentence giving your bottom line: which single requirement in the list does the most to eliminate candidate theories, and whether any subset of the requirements cannot all be satisfied at once. Then give the list and the reasoning. No preamble, no restatement of what I asked.

  The theory is being hired for a specific job, so grade every requirement against it: it must underwrite implementation claims that a third party could in principle confirm or refute by inspecting a physical system, with no decisive work done by the ascriber's interests, purposes, or interpretive choices. A theory on which any sufficiently state-rich open system implements any finite automaton you like fails this job. A theory on which nothing implements anything unless someone has adopted a description of it fails it too, in the mirror image way. Both failures make my paper's central claim true or false by stipulation, which is exactly what I want to avoid.

  Present the requirements as a numbered list. For each one: state the requirement, give the case or consideration that motivates it (concrete enough that I can see what a theory is obliged to say about it), tag it as non-negotiable given the job above or as a demand peculiar to a particular camp (formalist, mechanist, semanticist, deflationist, dynamical-systems), and say what flunking it looks like in practice.

  At minimum the list should adjudicate all of the following; I would like more besides.

  - Triviality and its cure: what has to be added to a state-to-state mapping so that a convective pattern in a star, whose microstate transitions happen to be mappable onto the transition table of some program, does not thereby run that program.
  - Genuine pluralism without permissiveness: the same neural tissue is truly describable as reinforcement learning, as approximate Bayesian inference, and as a feedback control loop. If the ascriber's interests may not decide, what does?
  - The grain problem: spikes, subthreshold membrane dynamics, nonlinear integration inside single neurons' dendritic trees, intracellular chemistry. What determines which of these is the level at which the system computes, if not explanatory convenience?
  - No natural interface: textbook automata come with distinguished inputs and outputs; a brain is in continuous closed-loop exchange with a body and a world. Either show that an interface is dispensable or explain how it gets fixed here.
  - Counterfactual support and redundant backups: suppose a machine's fault states would be corrected by an outside technician, but no fault ever occurs, so the technician never acts — and suppose further that the machine would have run the same program with the technician absent all along. Does the backup's presence change what the machine implements? Which counterfactuals belong in implementation conditions, and what grounds them in the machine rather than in the technician?
  - Capacity versus activity: the idle laptop, the anesthetized cortex, the sleeping hippocampus. Which sense does the empirical claim about the brain use, and does a theory have to pick?
  - Co-implementation and underdetermination: one physical process mappable onto two programs with non-isomorphic transition graphs, or onto two that share every actual trajectory and differ only counterfactually. Must the theory say both are implemented, that one is, or that the question is ill-posed?
  - Undesigned programs: the theory must let a system implement a program nobody wrote, anticipated, or could recognize, since evolved circuitry is the paradigm case for me.
  - Determinacy under noise: realizers are noisy and analog. What makes a physical process determinately *this* discrete computation rather than a near neighbor, and how much noise an implementation claim can absorb before it fails?
  - Sufficiency: whatever the brain is said to compute must be enough to account for the capacities we explain by computing. An account that lets a system implement the right computation while that computation does no explanatory work has not supported my paper's claim, only decorated it.
  - Risk: the theory must specify what kind of finding would show that a given system does *not* compute — no stable discrete states, dynamics not decomposable into parts whose states determine transitions, and so on.

  Then tell me which of these cannot all be had at once, and which one has to go. I suspect the bind is between the demand that the ascriber do no decisive work and the demand for genuine pluralism, but check that, and say so plainly if the real conflict sits elsewhere — a list that turns out to be jointly unsatisfiable is a result I can use, not a disappointment.

  Last, and briefly, score the main contenders against the list: formal mapping accounts, mechanistic accounts on which computing is a functional kind of causal organization, semantic accounts that require representations with content, deflationary views on which computation is a description we impose rather than a feature of the world, and dynamical-systems views that deny the brain computes at all. Two or three sentences each, and name the first requirement each one flunks. Keep the weight on the criteria; the scorecard is an afterthought.

  Do not give me references, a bibliography, or a reading list. Attribute positions to camps and arguments, not to papers.
reasoning: |-
  Hmm, the user is working on a philosophy of cognitive science paper about whether the brain literally computes or is just usefully described as computing. They need help establishing an adequacy standard for implementation theories first, before evaluating specific accounts. Their job is to find a theory that avoids making computation claims true by stipulation - it must be objectively confirmable by inspecting the physical system without relying on the ascriber's interests.

  The user wants a bottom-line answer first: which single requirement does the most to eliminate candidate theories, and whether any subset of requirements conflict. Then they need a numbered list of requirements with specific details for each: the requirement itself, motivating case, whether it's non-negotiable or camp-specific, and what flunking looks like. The list must cover all their specified points (triviality, pluralism, grain problem etc.) and more. Finally, they want brief scoring of main contender theories against these requirements.

  The bottom line is that Requirement 1 (Non-Trivial Implementation) does the most elimination work. The conflict is between Requirements 2 (Ascriber-Independent Pluralism) and 11 (Sufficiency), not pluralism versus ascriber-independence as the user suspected.

  For the list, I need to cover all their points plus add others like causal structure and compositionality. Each requirement gets: 1) the requirement, 2) concrete motivating case, 3) non-negotiable/camp tag, 4) flunking example. 

  The key conflict is between allowing genuine pluralism without permissiveness (Requirement 2) and ensuring the computations are sufficient to explain cognitive capacities (Requirement 11). These pull in opposite directions.

  For scoring contenders: Formal mapping accounts flunk Requirement 1 (triviality). Mechanistic accounts flunk Requirement 10 (counterfactual robustness). Semantic accounts flunk Requirement 8 (undesigned programs). Deflationary views flunk the core job (objectivity). Dynamical-systems views flunk Requirement 11 (sufficiency).

  The response will be structured exactly as requested: bottom line first, then numbered requirements list, then conflict analysis, then brief contender scoring - all without preamble or references.
answer: |-
  **Bottom line:** Requirement 1 (Non-Trivial Implementation) eliminates the most candidate theories by forbidding trivial mappings; the critical conflict is between Requirement 2 (Ascriber-Independent Pluralism) and Requirement 11 (Sufficiency), as satisfying both genuine pluralism without permissiveness *and* ensuring the computed program suffices for explanation is likely impossible under the core job's objectivity constraint.

  **Requirements List:**

  1.  **Non-Trivial Implementation:** The mapping must require specific, non-ubiquitous causal structure beyond mere state correspondence.
      *   **Motivation:** A convective star pattern happens to have microstate transitions isomorphic to a specific finite automaton's transition table over a short interval. This should not implement that automaton.
      *   **Status:** Non-negotiable (core job).
      *   **Flunks:** Theories accepting the star as implementing the automaton based solely on the transient mapping.

  2.  **Ascriber-Independent Pluralism:** The theory must allow the same physical system to genuinely implement multiple distinct computational descriptions without this multiplicity being determined by the ascriber's explanatory interests.
      *   **Motivation:** The same neural circuit is accurately describable as RL, Bayesian inference, *and* a control loop; the "real" computation(s) must be grounded physically, not chosen by the theorist.
      *   **Status:** Non-negotiable (core job - avoids mirror-image failure).
      *   **Flunks:** Theories forcing a single "correct" computational description or making multiplicity dependent solely on ascription.

  3.  **Grain Determinacy:** The theory must specify the physical grain (level of abstraction, temporal/spatial scale) at which states and transitions are individuated for computation, based on properties of the system.
      *   **Motivation:** A pyramidal neuron's activity can be described at the spike level, subthreshold voltage level, or dendritic integration level, yielding different potential "computations". Which is *the* computational level?
      *   **Status:** Non-negotiable (core job - objectivity).
      *   **Flunks:** Theories relying on explanatory convenience or ascriptive goals to pick the grain, or failing to specify any determinate grain.

  4.  **Interface Specification:** The theory must either explain how input/output interfaces are physically defined or demonstrate their dispensability for non-trivial implementation.
      *   **Motivation:** Textbook automata have clear I/O; a brain in closed-loop sensorimotor interaction with body/world lacks obvious physical boundaries for I/O.
      *   **Status:** Non-negotiable (core job - objectivity).
      *   **Flunks:** Theories assuming pre-defined I/O ports without physical grounding, or failing to explain implementation without I/O.

  5.  **Counterfactual Robustness & Grounding:** Implementation conditions must include relevant counterfactuals about state transitions, grounded solely in the physical system's dispositions, not external supports.
      *   **Motivation:** A machine has a technician who *would* correct faults, but no faults occur. If the machine *would* have run identically without the technician, the technician's counterfactual support shouldn't change what computation the machine *alone* implements.
      *   **Status:** Non-negotiable (core job - objectivity).
      *   **Flunks:** Theories making implementation depend on external counterfactual supports not grounded in the system's intrinsic properties.

  6.  **Capacity/Activity Distinction:** The theory must clarify whether it defines implementation for active processing only, or also for structurally capable but inactive systems, without equivocation.
      *   **Motivation:** Does an anesthetized cortex implement the same computations as when awake? Does a powered-off laptop implement Word?
      *   **Status:** Camp-specific (Mechanist/Formalist debate - mechanists often focus on capacity, formalists on activity).
      *   **Flunks:** Theories failing to specify which sense applies or conflating them.

  7.  **Co-implementation Resolvability:** The theory must specify how to handle physical processes simultaneously mappable onto non-isomorphic programs or programs differing only counterfactually.
      *   **Motivation:** A process maps perfectly onto Program A and also onto Program B (which has a different state graph, or differs only in transitions never taken). Must we say both are implemented, only one, or neither?
      *   **Status:** Non-negotiable (core job - determinacy).
      *   **Flunks:** Theories declaring both implemented (over-permissive) or the question ill-posed (indeterminate).

  8.  **Undesigned Implementability:** The theory must allow systems to implement programs that were never designed, intended, or recognized.
      *   **Motivation:** Evolved neural circuits implement computational processes without a designer or explicit program.
      *   **Status:** Non-negotiable (core job - objectivity, avoid stipulation).
      *   **Flunks:** Theories requiring intentional design, recognition, or description for implementation.

  9.  **Noise Tolerance & Individuation:** The theory must specify how much analog noise and physical variation a computational identity can tolerate, and what physically grounds the individuation of discrete states/computations amidst continuous dynamics.
      *   **Motivation:** Spiking neurons exhibit analog variability; what physically makes a noisy process determinately computing XOR rather than a slightly different function?
      *   **Status:** Non-negotiable (core job - objectivity).
      *   **Flunks:** Theories unable to distinguish physically similar noisy processes as implementing distinct computations, or collapsing under noise.

  10. **Counterfactual Support Requirement:** Implementation conditions must include specific, non-actualized state transitions relevant to the computation's identity.
      *   **Motivation:** A system might only traverse a subset of states/transitions during observation; its computational identity depends on what it *would* do in other circumstances (e.g., responding to different inputs).
      *   **Status:** Non-negotiable (core job - avoids trivializing by actual history alone).
      *   **Flunks:** Theories defining implementation solely on actual state history.

  11. **Sufficiency:** The computational description identified as implemented must be sufficient to account for the cognitive capacities explained by attributing computation to the system.
      *   **Motivation:** Attributing a computation to the brain only supports the "literally computes" claim if that computation does the explanatory work for cognition (e.g., solving a task).
      *   **Status:** Non-negotiable (core job - explanatory relevance).
      *   **Flunks:** Theories identifying implemented computations that are explanatorily inert for the system's behavior/capacities.

  12. **Falsifiability/Risk:** The theory must specify concrete physical conditions under which a system definitively does *not* compute (e.g., lacks stable state structure, lacks causal transition structure).
      *   **Motivation:** To avoid triviality, there must be possible systems the theory says do not compute.
      *   **Status:** Non-negotiable (core job - objectivity).
      *   **Flunks:** Theories where every sufficiently complex physical system implements *some* computation.

  **Conflicting Requirements:** Requirement 2 (Ascriber-Independent Pluralism) and Requirement 11 (Sufficiency) cannot both be fully satisfied under the core job's strict objectivity constraint. Pluralism requires multiple valid computational descriptions of the same physical substrate. Sufficiency requires that the identified computation(s) be explanatorily adequate for cognition. If multiple distinct computations are equally implemented physically (as per R2), it's unclear how *each* could be independently sufficient for explaining the same cognitive capacity without overdetermination or conflict. Conversely, insisting on a single sufficient computation (for R11) undermines genuine pluralism (R2). Resolving this requires prioritizing one, weakening objectivity, or finding a way the *set* of implemented computations jointly suffices – which is complex and risks violating the ascriber-independence mandate.

  **Contender Scoring:**

  1.  **Formal Mapping Accounts:** Flunk R1 (Non-Trivial Implementation) catastrophically (trivial mappings). Also flunk R3 (Grain), R4 (Interface), R9 (Noise).
  2.  **Mechanistic Accounts:** Flunk R10 (Counterfactual Support) - grounding non-actual transitions in physical structure alone is difficult. Often struggle with R2 (Pluralism) and R7 (Co-implementation).
  3.  **Semantic Accounts:** Flunk R8 (Undesigned Programs) fundamentally - require content, which is hard to ground non-intentionally for evolved systems. Also flunk R1 if content is ascribed.
  4.  **Deflationary Views:** Flunk the core job itself - make implementation inherently dependent on ascription/purpose, failing objectivity (R1-R12).
  5.  **Dynamical-Systems Views:** Flunk R11 (Sufficiency) - deny computation is the fundamental explanatory level, making the paper's central claim false by fiat. Also explicitly flunk R12 (Risk) by denying the brain computes.
