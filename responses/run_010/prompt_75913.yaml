  ### Workshop Game: **Base Rate Brawl**
  **Objective:** Experience the tension between inside-view (project details) vs. outside-view (track record) estimation, and confront the pitfalls of cherry-picking reference classes.

  ---

  #### **Materials**
  - 24 index cards (12 for past projects, 3 for new projects, 9 blank).
  - Whiteboard + markers.
  - Timer.
  - Sticky notes for voting.
  - Pre-filled templates (see below).

  ---

  #### **Pre-Workshop Prep**
  1. **Past Projects Setup:**  
     Create 12 "Past Project" cards with brief descriptions (e.g., "Migrate DB to cloud," "Refactor auth service"). Assign each a hidden "class" (A/B):  
     - **Class A (Overrun):** Actual effort = 1.5× initial estimate.  
     - **Class B (Underrun):** Actual effort = 0.8× initial estimate.  
     *(Split evenly: 6 A, 6 B).*  

  2. **New Projects Setup:**  
     - Project X (Class A): "Build real-time analytics dashboard."  
     - Project Y (Class B): "Automate deployment pipeline."  
     - Project Z (Class C): "Replace legacy monolith with microservices." *(Unique class: Actual = 0.5× estimate)*.

  ---

  ### **Rules & Timeline** (75 min total)
  #### **Step 1: Generate Track Record (15 min)**  
  - **Groups:** Split into 6 teams of 3. Each team draws 2 random "Past Project" cards.  
  - **Task:**  
    1. Estimate effort (in "points") for each project **based on details** (inside view).  
    2. Write estimates on cards.  
  - **Facilitator:** Collect cards, calculate **actual effort** using hidden classes (noise: ±5 points). Reveal actuals on whiteboard.  
    *(Example: Estimated 20 → Actual 30 if Class A).*  
  - **Whiteboard Table:**  
    | Project | Estimate | Actual |  
    |---------|----------|--------|  
    | Migrate DB | 20 | 30 |  
    | ... | ... | ... |  

  #### **Step 2: Round 1 – Inside vs. Outside View (15 min)**  
  - **Project:** Introduce **Project X** (Class A).  
  - **Individual Task:**  
    1. **Inside View:** Estimate effort based on project details (write on sticky note).  
    2. **Outside View:** Pick **one** past project as reference, use its *actual* as estimate.  
  - **Scoring:**  
    - Reveal **actual effort** (1.5× median inside estimate, e.g., median=24 → actual=36).  
    - Calculate error: `|Your estimate - actual|`.  
    - Team with lowest total error wins bragging rights.  

  #### **Step 3: Round 2 – Gerrymandering (20 min)**  
  - **Project:** Introduce **Project Y** (Class B).  
  - **Group Task (teams of 3):**  
    1. **Inside View:** Team consensus estimate.  
    2. **Outside View:** Teams pick **which past projects count** as "similar" (min. 3). Calculate average actual of chosen projects → outside estimate.  
    3. **Twist:** Challenge teams: *"Make the outside estimate as LOW as possible!"*  
  - **Scoring:**  
    - Reveal **actual effort** (0.8× median inside estimate, e.g., median=40 → actual=32).  
    - **Penalty:** Teams get +10 error points if their outside estimate is **below** the true average of all past projects (exposed manipulation).  
    - Lowest error team wins.  

  #### **Step 4: Round 3 – When Base Rates Fail (10 min)**  
  - **Project:** Introduce **Project Z** (Class C: actual = 0.5× estimate).  
  - **Individual Task:**  
    1. **Inside View:** Estimate effort.  
    2. **Outside View:** Use average actual of *all* past projects as estimate.  
  - **Scoring:**  
    - Reveal **actual effort** (e.g., median=50 → actual=25).  
    - Compare errors: Inside view vs. base rate.  

  ---

  ### **Debrief** (15 min)  
  Map rounds to core ideas:  

  | **Round** | **What Happened** | **Key Insight** |  
  |-----------|-------------------|-----------------|  
  | **1** | Outside view (past actuals) often beats inside view. | Details feel precise but miss systemic biases. "We *are* the reference class." |  
  | **2** | Teams cherry-picked projects to force low estimates. | Reference class selection is subjective → easily manipulated ("gerrymandering"). |  
  | **3** | Base rate failed for Project Z (new class). | Base rates are fragile when context radically changes. Not "always trust the spreadsheet." |  

  **Closing Points:**  
  - Base rates win because they factor in **unknown unknowns** (e.g., hidden delays).  
  - But they require **honest reference classes** and **humility** when context shifts.  
  - In practice: **Use base rates as a prior, then adjust sparingly with details.**

  ---

  ### **Predictable Pitfalls & Mitigations**  
  1. **Pitfall:** Teams dismiss past projects as "not comparable."  
     **Mitigation:** In Step 2, ask: *"How did YOU estimate these? Why trust your past judgment but not your peers’?"*  

  2. **Pitfall:** Round 2 devolves into chaos with reference class debates.  
     **Mitigation:** Set a 3-min time limit. Debrief: *"Notice how picking 'similar' projects felt arbitrary?"*  

  3. **Pitfall:** Participants resist Class C (Round 3) as unrealistic.  
     **Mitigation:** Acknowledge it’s exaggerated to prove a point: *"In real life, Class C = true black swans (e.g., AI migration)."*  

  4. **What the Game Can’t Show:**  
     - **Calibration:** Base rates improve with more data, but engineers often don’t track past projects rigorously.  
     - **Adjustments:** How to *responsibly* deviate from base rates (e.g., "This has a new risk factor; adjust estimate by +10%").  
     **Say This Aloud:** *"Base rates aren’t autopilot. They’re a reality check against your optimism."*  

  ---

  **Why It Works:**  
  - Generates track record from the room → "We built this data!"  
  - Gerrymandering round exposes subjectivity in "similarity."  
  - Class C forces nuance: Base rates aren’t infallible.  
  - Scoring uses error points (no money) and teams compete for low error.  

  **Pro Tip:** Run it fast and messy—energy matters more than precision!
