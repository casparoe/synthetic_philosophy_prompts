prompt: |-
  Just took a job as the sustainability person at a mid-size food company, so I'm now the one signing off on which offset projects we fund, and there's a pattern in these meetings I don't have a word for.

  Every offset we buy is legible — a solar array with a plaque, a named school, a headcount of trees. Every harm it's offsetting is diffuse — nitrogen in a watershed, methane, a supplier's labour practices two tiers down. And nobody ever picks an offset in the same currency as the harm. If we foul a river we don't fund river restoration, we fund something with a ribbon-cutting. Everyones fine with this because "the net is what matters."

  Is there an established concept for that drift? I know moral licensing, moral offsetting, greenwashing — but none fit. Licensing is about what the agent does next. Greenwashing implies concealment and we're not hiding anything. Offsetting itself is neutral about which currency the offset comes in. What I'm pointing at is narrower: offsets whose value is visible at exactly the rate the harms are invisible, so you can be net-neutral on the ledger and still come out ahead in credit.

  If there's no term, coin one and give me the edges — what would a case look like where the same visibility mismatch is present but it ISN'T this thing?
reasoning: |-
  Okay, let's start by unpacking the user's situation. They're the new sustainability person at a mid-size food company, responsible for signing off on carbon offset projects. They've noticed a pattern: the offsets they fund are highly visible and tangible—things like solar arrays with plaques, named schools, or specific tree counts. Meanwhile, the harms they're offsetting are diffuse and hard to pinpoint—nitrogen in watersheds, methane emissions, labor practices deep in the supply chain. 

  The user is pointing out that the offsets never match the "currency" of the harm. For example, instead of funding river restoration when they pollute a river, they fund something with a ribbon-cutting ceremony. Everyone justifies this by saying the net impact is what matters. The user feels this creates a visibility imbalance where the company gains credit for visible offsets while the harms remain invisible, even if the ledger shows net neutrality.

  They mention terms like moral licensing, moral offsetting, and greenwashing but find them inadequate. Moral licensing is about future behavior, greenwashing implies deception, and offsetting itself is neutral. They need a term for this specific mismatch in visibility between harm and remediation.

  First, I should validate their observation. They're highlighting a real issue in corporate sustainability—optics over actual impact. The psychological aspect here is interesting: visible offsets provide a narrative of action, while invisible harms lack storytelling potential. This asymmetry benefits the company's image without addressing the root causes.

  The user might be looking for a term to articulate this in meetings, to challenge the status quo. Their deeper need could be to drive meaningful change, not just check boxes. They might feel isolated if others don't see the problem, so having a term could empower them to advocate for better practices.

  Exploring possible terms: "Impact theatre" comes to mind, emphasizing the performative aspect. Or "remediation asymmetry," focusing on the structural imbalance. "Credit-Harm Visibility Gap" is more descriptive. Each term has nuances. For example, "impact theatre" might be too broad, as it could include outright deception, whereas the user states there's no concealment.

  I should also consider edge cases where visibility mismatch exists but isn't problematic. Maybe medical research funding: the harm (disease) is visible, but the research is behind the scenes. Here, the mismatch is necessary and acceptable, unlike the user's case where it's about evading responsibility.

  The user also wants to know if such a term exists. Since they haven't found one, coining a term makes sense. The explanation should include why existing terms don't fit and how the new term applies to their scenario. Highlighting edge cases will clarify the concept's boundaries, helping the user communicate it effectively to colleagues.
answer: |-
  Based on your precise description, there isn't a single, universally accepted term for this *specific* phenomenon of **differential visibility between harm and offset**, where the offset is deliberately chosen for its high legibility and positive narrative while the harm remains diffuse and untraceable, creating an *asymmetric reputational benefit* despite claimed net neutrality.

  Here's why existing terms fall short, and a proposed new term:

  1.  **Moral Licensing:** Focuses on past *good* deeds enabling future *bad* behavior. Here, it's the *current* offset enabling *ongoing* harm by masking its visibility difference.
  2.  **Moral Offsetting/Compensation:** The umbrella concept, but it doesn't specify the *visibility mismatch* as the core mechanism creating the reputational advantage.
  3.  **Greenwashing:** Implies deception or exaggeration. Your case involves technically valid offsets (presumably verified tonnes CO2e), just mismatched in visibility/narrative. The "wash" isn't about *falsity* but about *narrative control*.
  4.  **Symbolic CSR:** Too broad; encompasses gestures without substance, but doesn't capture the *specific asymmetry* between the invisible harm and the hyper-visible offset.
  5.  **Decoupling (in CSR):** Refers to gaps between policy and practice, not specifically the visibility gap between harm and remediation.

  **Proposed Term: Remediation Asymmetry**

  *   **Remediation:** Directly addresses the act of offsetting/correcting harm.
  *   **Asymmetry:** Highlights the core issue – the fundamental imbalance in visibility, traceability, and narrative potential between the harm and the chosen remedy.

  **Why "Remediation Asymmetry" fits your case:**

  *   **Asymmetry in Visibility:** The harm is diffuse, complex, untraceable (nitrogen runoff, distant labor practices). The offset is discrete, tangible, legible (named solar array, specific school).
  *   **Asymmetry in Narrative:** The offset generates a clear, positive story ("We built THIS school!"). The harm lacks a single point of blame or a simple story ("Our contribution to systemic nitrogen pollution is X% of Y complex watershed").
  *   **Asymmetry in Credit Assignment:** The company accrues *direct, visible credit* for the offset. The *avoided negative impact* of the harm is nebulous and unattributable in the public eye. The *ongoing nature* of the harm is obscured.
  *   **Asymmetry in Accountability:** The offset project is easily audited and pointed to. Verifying the *actual reduction* of the diffuse harm caused by the company's specific actions is often impossible or prohibitively complex ("additionality" and "attribution" problems writ large).
  *   **"Net Neutral on Ledger, Ahead in Credit":** This is the *result* of the asymmetry. The ledger might balance numerically (tonnes CO2e), but the reputational ledger is skewed: +100 visible "good guy" points from the solar array ribbon-cutting, while the -100 points from the invisible methane leak never register publicly. The company *gains net reputational credit*.

  **Edges: A Case of Visibility Mismatch that ISN'T Remediation Asymmetry**

  **Scenario: Funding Basic Medical Research vs. Treating a Specific Disease Outbreak**

  *   **Harm:** A sudden, highly visible disease outbreak in a community (e.g., a localized Ebola cluster). High visibility, clear narrative, strong emotional resonance.
  *   **"Offset"/Action:** Funding fundamental research into the virus's transmission mechanisms. This research is *inherently* diffuse, long-term, lacks a single "plaque" moment, and its direct impact on *this specific outbreak* is uncertain and invisible in the short term.
  *   **Visibility Mismatch:** Yes! The harm (outbreak) is highly visible and legible. The response (research funding) is diffuse, complex, and lacks immediate, tangible results.
  *   **Why it ISN'T Remediation Asymmetry:**
      *   **No Asymmetric Reputational Benefit:** Trying to claim direct, visible credit for stopping *this outbreak* by funding basic research would likely backfire. The mismatch is obvious. The funder wouldn't gain *net reputational credit*; they might even be criticized for not acting more directly.
      *   **Intrinsic Nature of the Solution:** The "invisibility" of the research funding isn't a *choice* made to avoid accountability for the visible harm; it's the *inherent nature* of how scientific progress addresses complex problems. The best tool for *long-term prevention* of future outbreaks *is* diffuse research, even if it doesn't fix *this one* visibly.
      *   **Lack of Ongoing Harm:** The harm is a specific acute event, not an ongoing process the funder is directly responsible for continuing while "offsetting" it elsewhere. The research isn't enabling the continuation of the outbreak.

  **In essence:** Remediation Asymmetry specifically describes the *strategic choice* (implicit or explicit) to address a *diffuse, ongoing harm for which the entity is responsible* with a *hyper-visible, legible offset in a different "currency,"* thereby gaining disproportionate reputational credit while continuing the harm. The medical research case involves a visibility mismatch, but lacks the strategic avoidance of accountability, the ongoing harm, and the asymmetric reputational benefit.

  **Using this concept:** Frame "Remediation Asymmetry" in your meetings. Argue that while net neutrality might hold on paper, this asymmetry creates reputational risk (if discovered) and fails stakeholders who care about *local* impacts and *direct* responsibility. Push for investing in offsets that *directly* address the harm's "currency" (e.g., riparian buffer zones for nitrogen runoff, verified supplier audits/improvements for labor) even if they are less photogenic. Good luck championing meaningful action!
