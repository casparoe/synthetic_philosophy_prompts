  - **Merging in Perdurantism**: The four-dimensional worm after merging includes both sets of records. But in the data model, we have two entity_ids and then one is tombstoned. We bend by considering the worm as the set of records under the surviving entity_id plus the tombstoned records (which are now considered as part of the same worm). However, the tombstoned records still have their own entity_id? We might need to reassign the entity_id of the tombstoned records to the survivor? (But the user says the tombstoned record points to the survivor, so we can interpret that as the records of the tombstoned entity_id being temporal parts of the survivor's worm.)

