  We are going to translate the philosophical debate between endurantism and perdurantism into the vocabulary of data modeling, specifically using the concepts from the user's domain (bitemporal modeling, event sourcing, SCD type-2, tombstones, and probabilistic record linkage).

  ## Key Concepts in the User's Domain

  - **entity_id**: A unique identifier assigned to an entity at ingestion.
  - **Tombstone**: When two records are merged, one entity_id survives and the other is tombstoned (marked as inactive and pointing to the survivor).
  - **Bitemporal modeling**: Tracks both the validity time (when the fact was true in the real world) and the transaction time (when the fact was recorded in the database).
  - **Event sourcing**: Captures all changes to the state of an entity as a sequence of events.
  - **Type-2 SCD**: Tracks historical changes by creating a new record for each change, with valid time intervals.
  - **Probabilistic record linkage**: Determines if two records refer to the same entity with a confidence score (e.g., 0.87).

  ## The Philosophical Debate: Endurantism vs. Perdurantism

  ### Endurantism
  - Objects are wholly present at every moment of their existence. 
  - An object persists by being entirely present at different times.
  - Identity is strict: the object at time t1 is numerically identical to the object at time t2.

  ### Perdurantism
  - Objects are four-dimensional space-time worms that extend through time. 
  - The object has temporal parts: at each time, only a part of the object exists (a "time slice").
  - The entire object is the sum of all its temporal parts.

  ### Stage Theory (a variant of Perdurantism)
  - What we call an object at a time is a stage (a temporal part).
  - Persistence is handled by counterpart relations: a stage at t1 is not identical to a stage at t2, but they are counterparts (related by a counterpart relation).

  ## Translation to Data Modeling

  ### The Structures

  1. **Entity Record (with bitemporal modeling)**:
     - Each row represents the state of an entity at a given valid time interval (and transaction time interval).
     - Example: `(entity_id, valid_from, valid_to, attributes)`

  2. **Event Stream (event sourcing)**:
     - Each event represents a change to an entity. The entity's state is built by applying all events in order.

  3. **Merging and Tombstones**:
     - When two records (with different `entity_id`s) are determined to be the same entity, one `entity_id` is kept and the other is tombstoned (pointing to the survivor).

  ### Translation of Philosophical Positions

  #### Endurantism
  - **Claim**: The entity is wholly present in each record (or state) at each valid time.
  - **Translation**: 
    - The entity is represented by a single `entity_id` that persists through time.
    - Each row (with a valid time interval) is a complete representation of the entity during that interval. The entity is the same entity (same `entity_id`) at all times.
    - **Merging**: When two records are merged, the surviving `entity_id` becomes the one true identity of the entity. The tombstoned record was never the same entity; it was a misassignment. The entity was always the survivor, but we had two records due to an error in linkage. Thus, the tombstoned record was a different entity that turned out not to exist (it was a duplicate representation).

  #### Perdurantism
  - **Claim**: The entity is a four-dimensional worm composed of temporal parts (each part is a record at a specific valid time).
  - **Translation**:
    - The entire entity is the set of all records (across time) that are linked by the same `entity_id`. However, note that in the case of merging, we have two sets of records (with two `entity_id`s) that are then stitched together.
    - **Temporal Part**: Each row (with its valid time interval) is a temporal part of the entity.
    - **Identity**: The identity of the entity is the entire history (the four-dimensional worm). After a merge, the worm includes the records from both `entity_id`s (with the tombstoned `entity_id` being a part of the history of the surviving entity).
    - **Merging**: The two records (with different `entity_id`s) are temporal parts of the same four-dimensional worm. The tombstone is just a marker that the two `entity_id`s are now considered as representing the same worm. The tombstoned record was always a temporal part of the same entity, but we initially assigned a different `entity_id` to that part.

  #### Stage Theory
  - **Claim**: Each record (at a time) is a stage. Persistence is defined by counterpart relations (which stages are counterparts of each other).
  - **Translation**:
    - Each row (a record at a specific valid time) is a stage. 
    - The `entity_id` is a label that we assign to a stage. When we merge two records, we are establishing a counterpart relation between stages that had different `entity_id`s.
    - **Identity**: There is no single `entity_id` that persists. Instead, we have a chain of counterpart relations. The tombstone is a marker that the stages of the tombstoned `entity_id` are counterparts to the stages of the surviving `entity_id`.
    - **Merging**: The tombstoned record (stage) is a counterpart of the survivor. It was a stage of the same entity, but at the time we didn't know. The question of whether it was the same entity is answered by the counterpart relation we establish at merge.

  ## Residue Report: Three Buckets

