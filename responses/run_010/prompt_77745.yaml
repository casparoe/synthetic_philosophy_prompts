    - **Verdict on Temporary Intrinsics**: The data model's ease is a genuine insight that both theories can use, but the representation (multiple rows) is more naturally interpreted as temporal parts (perdurantism). The data model does not assume one side, but it does provide a representation that fits perdurantism more directly.

  - **Identity as All-or-Nothing**: Philosophers treat identity as absolute, but record linkage has degrees of confidence. 

    - **Argument**: The philosophical insistence on all-or-nothing identity is not confused. They are talking about numerical identity (being the very same thing). In your system, the degrees of confidence reflect epistemic uncertainty (we are not sure if they are the same), not an ontological degree of identity. Two entities either are or are not the same. The match score is about our knowledge, not about the identity itself.

    - **Strong Reply from the Other Side**: One could argue that identity is not absolute but context-dependent. In some contexts (e.g., different matching thresholds) we might want to treat two records as the same for one purpose but not for another. This is similar to stage theory's counterpart relations (which are context-dependent). But note: the philosophers' debate is about the fundamental ontology. The user's system already has an all-or-nothing merge decision (tombstone or not) which reflects an absolute identity decision. The degrees of confidence are only in the linkage process, but the outcome is binary.

    - **Conclusion**: The degrees are epistemic, not ontological. The system can express uncertainty, but the identity decision (merge) is all-or-nothing. This does not contradict the philosophers; it aligns with them.

  ## The Merge Argument: Endurantism vs. Perdurantism?

  The two teams are arguing: 
  - Team A: The tombstoned record was never the same entity as the survivor (endurantist view: the entity is the survivor, and the tombstoned id was a misassignment).
  - Team B: It's a question with no answer, because the ids were assigned by different services with different thresholds (perhaps a stage-theory view: it depends on context, and we are establishing a counterpart relation by merging).

