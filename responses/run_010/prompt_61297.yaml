  I'm a third-year PhD student in political theory and I have to hand my committee a ~1500 word dissertation prospectus in two weeks. My topic is the problem of dirty hands, and I've been sitting in this literature for about a year and I think I finally have an angle, but its still fuzzy and I want someone to force it into shape. The angle: basically everybody in the debate treats the residue as a question about the agent's moral psychology — Walzer's whole move is that the decent politician is the one who does the terrible thing and then is properly guilty about it, and the deflationists respond that there's nothing special going on, it's just ordinary moral conflict or an overridden obligation with some agent-regret bolted on afterward. What I want to argue is that both sides are answering a downstream question. The residue behaves less like guilt and more like a *status* — the sort of thing the anthropology of purity and pollution is about, and closer still to legal ideas of taint and disability: it looks transferable (to the legislators who authorized it, to the citizens who benefit, maybe to whoever inherits the office), it looks dischargeable (confession, resignation, prosecution, reparations, a truth commission), and it's deeply unclear who bears it — the man, the office, or the polity. I know people gesture at "moral pollution" here and there, but nobody I've read cashes out those three properties and then asks whether something that has them is still *moral* residue at all, or a normative-but-not-moral status more like honor or uncleanness — and if it's the latter, whether the guilt test is even the right thing to be applying to officials.

  So: write the prospectus. I want the question stated precisely enough that a smart person could disagree with it; an account of why the existing positions (the Walzerian guilt line, the deflationists who collapse dirty hands into moral dilemmas or into role morality, and the democratic folks who say the dirt is really the citizens' to hold) leave it open rather than settling it; and the method, which I'd like as a chapter plan for the first year, chapter by chapter, saying what I'd actually be doing in each one and why that order rather than another. Build the test cases in explicitly — I want at least three concrete ones where the status framing gives a different diagnosis than the guilt framing, and the proposal should say up front what that difference looks like in at least one of them. I've been playing with the ticking-bomb torture case, an official who lies to keep a peace process alive, and a truth-commission scenario where the dirt gets publicly discharged decades later, but swap in better ones if you've got them. And be honest about scope: if this is too big to be a dissertation and I end up having to cut it down to one 8000-word article for the job market, tell me which slice you'd keep and what you'd amputate.

  Two housekeeping things. Don't give me a bibliography or a reference list, I'll do the citations myself, but do name the positions in prose so I can tell you're not just generating vagueness. And please actually commit to something — my friend who read my notes said the pollution move is "anthropology cosplay" and that I'm just redescribing role morality with better vocabulary, and I want the prospectus to take a definite position on that objection instead of noting it and moving on. Same for the risk I'm most worried about myself, which is that "status" turns out to do no explanatory work at all and is just a metaphor I'm fond of. Tell me straight whether you think the reframing earns its keep or whether I should go back to something safer, and if you think it earns its keep, say which of the three properties — transferability, dischargeability, bearer-relativity — you think is carrying the weight and which one is definately going to collapse on me.
