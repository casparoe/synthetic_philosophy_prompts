  ## Dissertation Prospectus: The Stained Robe: Dirty Hands as Normative Status Beyond Moral Psychology

  **Title:** The Stain Beyond the Soul: Dirty Hands as Transferable, Dischargeable, Bearer-Relative Status in Political Office

  **Abstract:**  
  The "dirty hands" (DH) debate centers on whether political actors can be morally compelled to commit gravely wrong acts for the public good, and crucially, what *residue* remains afterward. Dominant approaches—Michael Walzer’s guilt-centric view, deflationist accounts (e.g., Thomas Nagel, David Luban) reducing DH to tragic dilemmas or role conflicts, and democratic theorists (e.g., Dennis Thompson, Christopher Kutz) distributing the dirt to citizens—all frame the residue primarily as a problem of *moral psychology* (guilt, regret, compromised integrity). This prospectus argues that this focus obscures the core nature of political DH residue. Analyzing residue through the lens of *transferability*, *dischargeability*, and *bearer-relativity* reveals it functions less like psychological guilt and more like a distinct *normative status* akin to legal taint, ritual pollution, or honor. This status operates at the level of the *office* or *polity* as much as the individual, demanding institutional, not just introspective, responses. This reframing challenges the sufficiency of the "guilt test" for officials, opens new avenues for understanding political responsibility, and demands different normative responses to political wrongdoing done for the public good.

  **The Core Question:**  
  When a political official commits a gravely wrong act ostensibly for the public good, does the resulting normative residue fundamentally constitute (a) a persistent state of *agent-centered moral guilt or compromised integrity* (the prevailing psychological model), or (b) an *impersonal, bearer-relative status* (akin to legal disability, ritual pollution, or honor) that attaches to the *office*, *role*, or *polity* and possesses the structural properties of being *transferable* (to successors, authorizers, beneficiaries), *dischargeable* (through specific institutional or ritual acts), and bearing *relativity* (the question "Who bears the stain?" is central and contested)?

  *A smart person could disagree by arguing:* The properties of transferability, dischargeability, and bearer-relativity are either illusory, fully reducible to complex moral psychology (e.g., shared guilt, the psychological need for catharsis), or merely descriptive features of role morality itself, adding no new normative category. The "stain" is always and only a moral psychological phenomenon with social consequences, not a distinct status.

  **Why Existing Positions Leave the Question Open:**

  1.  **The Walzerian Guilt Line (Michael Walzer, Bernard Williams):** Centrally frames the residue as the *agent's necessary guilt* – the "dirt" is on *their* hands, and its persistence is a sign of moral seriousness. This focuses intensely on individual conscience but struggles to explain why the guilt seems to *linger beyond the agent's lifetime* (e.g., historical apologies) or why *institutional actions* (prosecution, truth commissions) seem necessary to address it, not just personal remorse. It assumes the bearer is unequivocally the individual agent.
  2.  **Deflationist Accounts (Thomas Nagel, David Luban, C.A.J. Coady):** Argue there's nothing uniquely "dirty" about DH situations. Nagel sees tragic conflicts; Luban/Coady see role obligations overriding ordinary morality. The residue is simply the regret or compromised integrity from choosing the lesser evil. This convincingly critiques Walzer's uniqueness claim but *minimizes* the distinctive *persistence* and *social-institutional weight* of the residue. Why does overriding an obligation in a role context generate demands for *public accounting* or *institutional cleansing* in a way ordinary tough choices do not? Deflationism struggles with transferability (e.g., citizens inheriting responsibility) and dischargeability (why confession *to whom?*).
  3.  **Democratic Distribution Theorists (Dennis Thompson, Christopher Kutz):** Correctly identify that DH acts often implicate the citizenry (through authorization, benefit, complicity). However, by framing this as the *citizens sharing the moral burden or guilt*, they remain within the psychological paradigm ("we are all guilty"). This doesn't fully capture why the residue might *specifically attach to the office* itself (tainting subsequent holders regardless of their actions) or why *specific institutional mechanisms* (not just collective soul-searching) are deemed necessary to address it. They distribute *guilt*, not necessarily analyze a *status*.

  **The Proposed Reframing: DH Residue as Normative Status**

  The residue of political DH is better understood as a normative status characterized by:
  1.  **Transferability:** The stain can migrate from the acting agent to those who authorized the act (legislators), those who benefit (citizens), those who inherit the role (successor officials), or the polity itself. (e.g., A successor government apologizing for prior regime's torture).
  2.  **Dischargeability:** The status is not necessarily permanent; it can be removed or mitigated through specific, often public and ritualized, acts: confession (to a specific body), resignation, prosecution, reparations, truth commissions, official apologies, purification rituals. (e.g., South Africa's TRC aiming to cleanse the nation).
  3.  **Bearer-Relativity:** Determining *who* or *what* bears the status is a central, contested question: Is it the individual agent? The office they held? The administration? The political party? The nation-state? The citizenry? This ambiguity is constitutive of the phenomenon, not a confusion to be resolved. (e.g., Debates over whether a President's lies stain only him, the Presidency, or American democracy).

  This status functions normatively: it generates reasons for action (demands for discharge, disqualification, apology) and alters the normative position of the bearer(s). Crucially, it is *not* purely moral; it shares structural features with non-moral normative statuses like legal disability ("tainted" evidence barring prosecution), honor (a medal conferring standing), or ritual pollution (requiring cleansing rites). The appropriate "test" for an official post-DH act is not primarily "Do they *feel* guilty?" but "Is the *status* of the office/polity appropriately managed or discharged?"

  **Method & Chapter Plan (Year 1):**

  *   **Rationale:** Builds from establishing the gap in existing theory, through developing the core framework, to testing it against cases, and finally confronting major objections and implications. The case studies are sequenced to progressively emphasize each core property.

  1.  **Chapter 1: The Psychological Paradigm and Its Limits: Mapping the Terrain of Dirty Hands.**
      *   **What I'll Do:** Detailed critical analysis of key DH literature (Walzer, Williams, Nagel, Luban/Coady, Thompson/Kutz). Demonstrate how *all* frame the residue primarily through moral psychology (guilt, regret, integrity, shared burden). Systematically identify the phenomena their accounts struggle to capture: the demand for institutional responses, the sense of office-taint, the transfer across time/agents, the structure of discharge rituals.
      *   **Why First:** Establishes the problem space, shows the consensus around psychology, and precisely identifies the explanatory gap the status framework aims to fill. Provides the necessary grounding for the intervention.

  2.  **Chapter 2: Beyond Guilt: Conceptualizing Residue as Normative Status.**
      *   **What I'll Do:** Develop the core theoretical framework. Define "normative status" (drawing analogies cautiously from legal theory - e.g., H.L.A. Hart on rights/powers; anthropology - e.g., Mary Douglas on pollution; philosophy of social ontology - e.g., Searle on institutional facts). Elaborate the three structural properties (Transferability, Dischargeability, Bearer-Relativity) as defining features of this status in the political DH context. Distinguish this status clearly from moral guilt and from standard accounts of role morality (emphasizing transferability and dischargeability as unique).
      *   **Why Second:** Provides the positive conceptual machinery. Directly addresses the core thesis. Sets up the analytical tools for the case studies.

  3.  **Chapter 3: Case Study I - The Torturer's Office: Transferability and Bearer-Relativity (Ticking Bomb Scenario).**
      *   **What I'll Do:** Analyze the aftermath of state-sanctioned torture in an emergency (e.g., post-9/11 debates). Focus: Does the stain transfer? To interrogators, commanders, authorizing lawyers/legislators, the citizenry benefiting from "security"? Who ultimately *bears* it? The individual torturer (prosecution)? The agency (reforms)? The nation (apologies, reparations to victims)? Contrast status diagnosis (focus on institutional bearer-relativity and transfer) with guilt-centric views (who *feels* guilty?).
      *   **Why Third:** A classic, high-stakes DH case. Excellent for highlighting how debates about responsibility *after the act* center on *who bears the stain* (bearer-relativity) and how it spreads (transferability). Shows guilt feelings are insufficient to explain the institutional responses demanded.

  4.  **Chapter 4: Case Study II - The Mendacious Peacemaker: Dischargeability and the Office (Lying Official).**
      *   **What I'll Do:** Examine an official lying to preserve fragile peace negotiations (e.g., Northern Ireland, Colombia). Focus: How can the resulting stain be *discharged*? Mere regret? Confession (to whom? When?)? Resignation? Prosecution for perjury? An official inquiry? Does resignation cleanse the *individual* but leave the *office* stained for their successor? Contrast status diagnosis (focus on *how* and *when* discharge is possible/required for the office) with psychological views (has the agent sufficiently repented?).
      *   **Why Fourth:** Shifts focus to dischargeability. Highlights temporal dimensions – the stain persists until discharge. Emphasizes how the *office* itself is a bearer requiring cleansing, distinct from the individual's conscience. Illustrates bearer-relativity concerning institutional positions.

  5.  **Chapter 5: Case Study III - Discharging the Past: Truth Commissions and the Polity's Status (e.g., South Africa, Chile).**
      *   **What I'll Do:** Analyze truth commissions as explicit institutional mechanisms for discharging the normative status of systemic past wrongs (often DH acts by prior regimes). Focus: How do TRCs frame the residue (pollution, national stain)? Who is the bearer (the old regime? the state? the nation? all citizens?)? What constitutes discharge (truth-telling, amnesty, reparations, symbolic cleansing)? Does "success" depend on psychological catharsis *or* on the ceremonial/legal performance of status alteration?
      *   **Why Fifth:** Provides the clearest real-world example of *institutionalized discharge* explicitly framed in status-like terms (cleansing, healing the *nation*). Demonstrates the framework's power to explain large-scale, long-term political processes addressing DH residue, far beyond individual psychology. Reinforces all three properties comprehensively.

  6.  **Chapter 6: Objections, Implications, and the Value of the Reframing.**
      *   **What I'll Do:** Directly confront major objections: 1) **"Anthropology Cosplay"/Redescription:** Argue that identifying structural isomorphism with pollution/taint is *explanatory*, not merely metaphorical. Show how the status framework *predicts and explains* demands (for transfer, discharge, bearer determination) that psychological models struggle with. Emphasize it captures institutional realities missed by individualist psychologism. 2) **"Just Role Morality Redux":** Argue that while DH arises *within* roles, the status *residue* has unique properties (esp. transferability, dischargeability) not inherent in role obligations themselves. Roles define duties; status defines the *consequences* of violating duties (even for good reasons) *for the role/institution*. 3) **"Status Does No Work":** Demonstrate how the framework resolves puzzles (e.g., why resignation is often demanded even if the agent feels no guilt; why citizens feel implicated even if they opposed the act; why TRCs have specific rituals). Discuss implications: Shifts focus from agent's character to institutional health; suggests new norms for managing tainted offices/polities; questions the primacy of guilt as the marker of political responsibility. Defend the claim that reframing *earns its keep* by offering superior explanatory power and normative guidance for post-DH politics.
      *   **Why Last:** Synthesizes findings, robustly defends the thesis against anticipated critiques, and articulates the significance of the shift in perspective.

  **Test Cases & Diagnostic Difference (Illustration - Truth Commission):**

  *   **Guilt Framing (Walzer/Democratic):** Asks: Have the perpetrators confessed and shown guilt? Have the citizens acknowledged their complicity/benefit and felt appropriate collective guilt? Success is measured by psychological catharsis and acceptance of moral blame.
  *   **Status Framing:** Asks: Has the *status of the polity* as bearer of a normative stain been formally addressed? Has the discharge process (truth-telling, amnesty *as part of a bargain*, reparations, symbolic acts) been performed according to established (often legal-ritual) norms? Success is measured by the completion of the discharge ritual and the restoration of the polity to a normative condition where the stain is considered ceremonially or legally lifted, *regardless* of the depth or universality of individual guilt feelings. The focus is on altering the public, institutional standing of the state/nation.

  **Scope and Tractability:**

  This is **ambitious but feasible as a dissertation**. The core framework (Ch1-2, Ch6) and three detailed case studies (Ch3-5) provide a solid structure. Each case study offers a manageable deep dive into primary sources (legal documents, TRC reports, political debates, philosophical commentary).

  *   **If Cutting to an Article (8000 words):** Keep **Chapter 2 (Core Framework)** and **Chapter 5 (Truth Commission Case Study)**, with a *very* condensed version of the Ch1 critique and Ch6 objections woven in. The Truth Commission case best exemplifies *all three properties* (transfer to the nation, discharge via ritual, bearer-relativity debates) in a concrete, historically rich context, providing the strongest proof-of-concept for the status framework's explanatory power compared to the psychological model.

  **Honest Assessment & Commitment:**

  1.  **"Anthropology Cosplay" / Redescription:** This is a serious objection. **Commitment:** The status framework is *not* merely cosplay. While drawing *analogies* to pollution/taint is illustrative, the core argument is that DH residue exhibits *structural properties* (transferability, dischargeability, bearer-relativity) shared with recognized normative statuses in law and social practice. It explains *why* pollution metaphors resonate politically and why *institutional* responses mirror ritual cleansing. This *is* a redescriptive move, but it's a powerful one that reveals features obscured by the psychological lens. It moves beyond role morality by focusing on the *consequences for the institution* of fulfilling *or violating* role demands in extreme situations.
  2.  **"Status Does No Work":** **Commitment:** The status reframing **earns its keep decisively.** It provides a coherent explanation for phenomena inadequately addressed by the guilt paradigm: the demand for *institutional* actions targeting the *office* or *polity* (not just the agent's conscience), the sense of *inherited* responsibility, and the structure of *discharge mechanisms*. It shifts the normative question from "How should the agent feel?" to "How should the polity manage the normative condition of its institutions and itself after necessary wrongs?"
  3.  **Weight of Properties:** Among the three properties:
      *   **Bearer-Relativity** is the **lynchpin.** It's the most distinctive and challenging aspect, forcing us to ask *"Whose stain is this?"* in a way the psychological model (focused on the agent) or democratic model (focused on citizens) often assumes rather than interrogates. This carries the most weight.
      *   **Transferability** is **robust** and clearly visible in political practice (succession, historical responsibility). It strongly differentiates the status from individual guilt.
      *   **Dischargeability** is **essential but carries the highest risk.** The argument that the stain *can* be formally removed (not just psychologically coped with) is crucial. However, it risks collapsing if one argues that *true* moral residue can *never* be discharged, only the public *perception* or *legal* status. The defense lies in rigorously distinguishing the *normative status* (which is dischargeable through performative acts altering institutional standing) from any *persisting moral wrong* (which may remain). This requires careful handling but is defensible by focusing on the specific normative context of political office and collective life.

  **Conclusion:** This prospectus proposes a paradigm shift in understanding dirty hands residue, moving from moral psychology to normative status. By focusing on transferability, dischargeability, and bearer-relativity, it offers a more accurate description of political practice, resolves puzzles in the literature, and generates new normative questions about institutional responsibility and political restoration. It directly confronts the limitations of existing approaches and provides a robust, tractable research program for explaining the enduring stain of political necessity.
