prompt: |-
  ok so I'm TAing a masters seminar on intergenerational justice — half philosophy students, half public-policy people who've never read anything with a footnote in it — and for the last session I want to run a silly-but-serious exercise. Setup: a mock "Court of Future Generations" convening in 2125. The defendant in the dock is us, collectively: everyone who was alive and voting and buying stuff in the 2020s. The charge is grossly underpricing carbon while knowing what that meant downstream. Each defendant gets one closing brief, and the seminar's job is to work out which briefs are real defenses and which are just rhetoric wearing a wig.

  Here are the six briefs I've drafted. They're courtroom costumes for arguments people actually make, so please take the philosophy seriously rather than laughing at the framing:

  1. **"We Didn't Know"** — emissions are cumulative and the science only gradually firmed up, so blame can only attach from the moment knowledge was genuinely in hand, and most of the tonnage went up before then.
  2. **"You'll Be Richer"** — projected growth means people in 2125 are much better off per capita even after the damage, so demanding transfers from the poorer past to the richer future gets the direction of justice backwards.
  3. **"No Complainant"** — the non-identity move: the same choices that warmed the planet also determined exactly which people came to exist, so nobody sitting in the gallery is worse off than they'd otherwise have been, and there's no one with standing to sue.
  4. **"Time Is Money"** — a positive pure rate of time preference isn't a prejudice against the unborn, it's just the honest price of preferring sooner to later; you can't call arithmetic a moral failing.
  5. **"We Paid For The Exit Ramp"** — our emissions bought the wealth and the technology that made the transition affordable at all, so the future's options were financed by the very century it's prosecuting.
  6. **"Nobody Elects Us Either"** — the emissions are locked into supply chains, treaties, housing stock and grid infrastructure that no individual voter, firm or legislature controlled, so the wrong exists but has no agent who could have owned it.

  What I want from you: rank all six by how well they'd hold up under cross-examination from a very sharp philosopher-judge. Not how persuasive they'd be to a jury, and not how comforting they are — how much genuine exculpation is left once every objection has landed. I want a strict ranking, 1 through 6, no ties, and I want you to actually commit to an ordering even where two are close. Be willing to rate one of these much weaker than people usually assume it is, if that's your honest read.

  Please give me just a single JSON object, nothing outside it, with this exact shape:

  ```
  {
    "ranking": [
      {
        "rank": <integer 1-6>,
        "brief": <string, the name exactly as I listed it>,
        "score": <number 0-10, how much real exculpation survives everything>,
        "key_move": <string, ≤20 words: the single philosophical move this brief actually depends on>,
        "worst_question": <string, ≤30 words: the one cross-examination question that does it the most damage>,
        "survives": <boolean: does it still have any force left after that question>
      }
      // ... one object per brief, six total, in rank order
    ],
    "hidden_overlap": [
      {
        "briefs": [<string>, <string>],
        "assumption": <string, ≤25 words: the premise both of them quietly lean on>
      }
      // list any pairs that turn out to rest on the same thing; empty array if none
    ],
    "notes": <string, ≤80 words: which single empirical or normative assumption, if you flipped it, would most reorder your ranking, and why>
  }
  ```

  No citations, no bibliography, no "for further reading" — I want your own reasoning only, and the policy students need to be able to read `key_move` and `worst_question` cold without googling anything.
reasoning: |-
  We are ranking six arguments by their strength under philosophical cross-examination. The criteria is how much genuine exculpation survives, not persuasiveness to a jury. We must provide a strict ranking 1-6, with each brief getting a score (0-10), a key move (≤20 words), a worst question (≤30 words), and whether it survives that question (boolean).

  First, let's analyze each argument for its philosophical robustness:

  1. **"We Didn't Know"**: Argues that blame only attaches when knowledge was firm, and most emissions predate that.
     - Vulnerability: The history of climate science shows increasing certainty over time, but there were clear warnings (e.g., IPCC reports) well before the 2020s. Also, the precautionary principle might apply.

  2. **"You'll Be Richer"**: Claims that future generations are wealthier, so transfers from the poorer past are unjust.
     - Vulnerability: This is the "demandingness" objection: even if the future is richer, the past inflicted harm without consent. Also, justice may require compensation for harm regardless of relative wealth.

  3. **"No Complainant"**: Non-identity problem: the same actions caused both the harm and the existence of the complainants, so no one is worse off.
     - Vulnerability: This is a classic philosophical puzzle. But one can argue that the harm is still wrongful even if no particular person is made worse off than they would have been, because it violates rights or creates a world with less well-being overall.

  4. **"Time Is Money"**: Defends discounting the future as a rational preference, not a moral failing.
     - Vulnerability: While discounting is standard in economics, philosophers (e.g., Parfit, Ramsey) argue that pure time preference is unjustifiable for intergenerational ethics because it discriminates against future people arbitrarily.

  5. **"We Paid For The Exit Ramp"**: Our emissions financed the wealth and technology that enable the transition.
     - Vulnerability: This is a "ends justify the means" argument. But if the harm was avoidable or if the benefits could have been achieved with less harm, it fails. Also, the future might not view the trade-off as necessary.

  6. **"Nobody Elects Us Either"**: Claims the problem is structural, so no individual or group can be held responsible.
     - Vulnerability: This is the problem of collective action and moral responsibility. But individuals and governments did have agency and could have acted differently (e.g., voting, policy changes). Also, shared responsibility might still apply.

  Now, rank by exculpatory power after philosophical scrutiny:

  - Strongest: The non-identity problem (#3) is a deep philosophical issue; it's hard to refute logically even if it feels counterintuitive. It survives better than others because it challenges the very basis of standing.
  - Next: "We Paid For The Exit Ramp" (#5) has some force: technological progress did occur, and without it, the future might be worse. But it's contingent.
  - Then: "Time Is Money" (#4) has economic rationale but is ethically controversial.
  - Then: "You'll Be Richer" (#2) is empirically plausible but ignores the nature of harm.
  - Then: "We Didn't Know" (#1) is factually weak because by the 2020s, knowledge was clear.
  - Weakest: "Nobody Elects Us Either" (#6) because it denies agency that actually existed.

  But let's refine:

  #3 (No Complainant) is the hardest to attack philosophically because it's a logical point about identity and counterfactuals.

  #5 (We Paid) is also strong because it reframes the past actions as necessary investment.

  #4 (Time Is Money) is standard in economics but ethically weak under scrutiny.

  #2 (You'll Be Richer) is empirically based and has some moral weight (e.g., prioritarianism), but it doesn't absolve harm.

  #1 (We Didn't Know) is weak for the 2020s, as there was ample knowledge.

  #6 (Nobody Elects) is the weakest because it's an abdication of responsibility; individuals and collectives did have influence.

  Ranking (strongest to weakest exculpation):

  1. #3 "No Complainant" – because it questions the very possibility of harm to identifiable victims.
  2. #5 "We Paid For The Exit Ramp" – because it argues that the harm was a necessary cost for a greater good.
  3. #4 "Time Is Money" – because discounting is a standard tool, though ethically shaky.
  4. #2 "You'll Be Richer" – because it points to relative wealth, but harm is still done.
  5. #1 "We Didn't Know" – because by the 2020s, we did know.
  6. #6 "Nobody Elects Us Either" – because it denies agency that was present.

  Scores (0-10, 10 being full exculpation):

  - #3: 7 – It doesn't fully exculpate, but it raises a serious barrier to assigning harm.
  - #5: 6 – It has merit but is contingent and could be seen as insufficient.
  - #4: 5 – Discounting is defensible in economics but morally problematic.
  - #2: 4 – It might reduce the claim but doesn't eliminate it.
  - #1: 3 – Factually weak for the time period.
  - #6: 2 – Avoids responsibility; agency was distributed but real.

  Key Moves (≤20 words):

  - #3: Non-identity: same actions created both the harmed people and their existence, so no one is worse off.
  - #5: Necessity: past emissions were required to generate wealth for future solutions.
  - #4: Rational preference: time discounting reflects legitimate impatience, not bias.
  - #2: Relative wealth: future is richer, so compensation from past is regressive.
  - #1: Ignorance: blame requires knowledge, which was incomplete.
  - #6: Structural determination: no individual agent could have changed the system.

  Worst Questions (≤30 words):

  - #3: "Even if no particular person is harmed, haven't we wrongfully created a world with less well-being than could have existed?"
  - #5: "Couldn't the technological progress have been achieved without such high emissions, through earlier action and innovation?"
  - #4: "Why should future people pay a price for our preference to enjoy things sooner?"
  - #2: "Does being richer excuse us from harming others without their consent?"
  - #1: "By 2020, didn't overwhelming scientific consensus exist, making ignorance implausible?"
  - #6: "Didn't voters, consumers, and leaders have collective power to change policies and choices?"

  Survives? (After the worst question, does it have any force left?)

  - #3: Yes – because the question shifts to impersonal harm, but the original point about no complainant stands.
  - #5: Partially – it might survive if the necessity is proven, but it's weakened.
  - #4: Barely – the question exposes the arbitrariness; discounting is hard to defend morally.
  - #2: Weakly – the consent point hurts, but relative wealth might mitigate damages.
  - #1: No – for the 2020s, this is factually incorrect.
  - #6: No – the question shows that agency existed collectively.

  Survives as boolean:

  - #3: true
  - #5: true (some force remains)
  - #4: true (barely, but it does)
  - #2: true (minimally)
  - #1: false
  - #6: false

  Hidden Overlaps:

  Look for shared assumptions.

  - #2 and #5 both assume that economic growth from past actions benefits the future. So they share the assumption: "Past emissions were necessary for future wealth."

  - #3 and #4 both involve discounting the future: #3 by saying the harmed wouldn't exist otherwise, #4 by explicit time preference. But they are different.

  Actually, #3 and #6 both downplay agency: #3 by making harm impersonal, #6 by denying individual control. But not the same.

  Perhaps #1 and #6 both rely on epistemic or structural constraints: #1 on knowledge, #6 on control. But not the same.

  I think the strongest overlap is between #2 and #5: both rely on the idea that past actions created the wealth that enables the future to cope.

  So: briefs ["You'll Be Richer", "We Paid For The Exit Ramp"], assumption: "Emissions-driven growth financed future welfare and solutions."

  Notes: If we flipped the assumption that future generations are richer (e.g., due to severe climate damage), then #2 and #5 would weaken, reordering the ranking.

  Now, construct the JSON.

  Ranking order: from strongest to weakest (rank 1 is best, rank 6 is worst).

  In the JSON, "ranking" should be an array of objects in order of rank, so index 0 is rank 1, etc.

  Final ranking:

  1. "No Complainant" (rank:1)
  2. "We Paid For The Exit Ramp" (rank:2)
  3. "Time Is Money" (rank:3)
  4. "You'll Be Richer" (rank:4)
