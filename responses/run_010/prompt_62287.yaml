  - 4: 4
  - 5: 3
  - 6: 2

  Key moves:

  - 1: Non-identity: no one is harmed compared to their alternative existence.
  - 2: Past emissions financed the technology for future solutions.
  - 3: Positive time preference is rational, not discriminatory.
  - 4: Future wealth makes compensation from poor past regressive.
