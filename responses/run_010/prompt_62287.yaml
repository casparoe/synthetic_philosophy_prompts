  - 6: Structural constraints absolve individual responsibility.

  Worst questions:

  - 1: "Doesn't creating a worse world wrong future people, even if they wouldn't exist otherwise?"
  - 2: "Couldn't clean development have achieved similar progress without high emissions?"
  - 3: "Why should future people bear costs for our impatience?"
  - 4: "Does relative wealth justify harming others without consent?"
  - 5: "Wasn't the science clear by 2020, making ignorance implausible?"
  - 6: "Didn't collective action failures reflect choices by voters and leaders?"

  Survives:

  - 1: true (the question challenges but doesn't fully refute the non-identity point)
  - 2: true (it might survive if necessity is argued, but weakened)
  - 3: true (barely, as the question highlights moral arbitrariness)
  - 4: true (minimally, as harm vs. wealth trade-off remains)
  - 5: false (for the 2020s, knowledge was clear)
  - 6: false (collective agency existed)

