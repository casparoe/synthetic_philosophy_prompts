  We are to create a decision tree for positions on the question of whether dreams are experiences.

  First, we lay out the logical space by identifying axes of disagreement:

  1. **Temporal Location of the Dream**: 
     - Does the dream require that something was going on *during* sleep (i.e., experiences occurring at the time of sleep) or only that something happens at waking (e.g., the production of a report upon awakening)?

  2. **Truth-Maker for Dream Reports**:
     - What makes a dream report true? Is it the occurrence of an experience during sleep, or is it something else (e.g., the report being produced in a certain way upon awakening)?

  3. **Status of First-Person Evidence from Sleep**:
     - Can first-person evidence generated from inside sleep (like experiences during sleep) be trusted as evidence, or is it always a waking reconstruction?

  4. **Nature of the Question**:
     - Is the question of what happened during sleep a substantive empirical question or one that is dissolved by the way the concept of dreaming works?

  5. **Nature of Dream Content**:
     - Is dream content perception-like (i.e., sensory, imagistic, immersive) or thought-like (propositional, cognitive)? And note: this distinction may not be neutral with respect to the first question (whether dreams are experiences). For instance, if dreams are thought-like, one might be more inclined to deny they are experiences in a perceptual sense.

  6. **Possibility of Error**:
     - Can a subject be mistaken in taking themselves to have dreamt? This relates to the trustworthiness of the subject's report.

