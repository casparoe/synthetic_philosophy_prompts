reasoning: |-
  Okay, the user had a three-hour argument with a friend about Nyāya epistemology, specifically on whether the pramanas are ranked by evidential weight. Their friend claims perception is the highest and testimony the lowest, making Vedic claims about moksha not real knowledge. The user pushed back but couldn't articulate well. They want a clear resolution on how Nyāya handles clashes between pramanas, like a conflict between testimony and perception about a well's location, or unobservable things like ritual results.

  First, I need to address the friend's claim about the order being a ranking. The Nyāya Sutras list pramāṇas as pratyakṣa (perception), anumāna (inference), upamāna (comparison), and śabda (testimony). But is this order hierarchical? The friend thinks perception always trumps testimony, and that testimony is secondary. But Nyāya isn't foundationalist like Descartes. Perception isn't self-certifying; it can be overridden. Each pramāṇa has its domain. For example, testimony is crucial for things beyond senses, like Vedic teachings. So the order might be pedagogical, not a strict ranking.

  Next, the missing concept here is svataḥ prāmāṇya. This means intrinsic validity. All knowledge sources are presumed valid unless contradicted. So in a clash, like the well example, you don't automatically favor perception. You investigate further. Maybe your vision was flawed, or the informant lied. Both sources are checked for defects. For unobservables like ritual fruits, testimony is primary because perception can't access it. So Nyāya isn't dismissing scripture; it's using testimony appropriately where applicable.

  For clash resolution: In the well case, Nyāya would look for defects in both perception and testimony. Perception might be hindered by distance, testimony by the informant's reliability. If both are defect-free, they should align; if not, further verification is needed. For ritual fruits, testimony is the only source, so it's accepted unless contradicted by another pramāṇa, which it can't be since it's imperceptible. So no, the list isn't a ranking because each pramāṇa is authoritative in its domain.

  Where the friend was right: Perception is listed first, possibly as the most basic, and Nyāya does consider it foundational in some contexts. But foundationalism here isn't Cartesian; it's about empirical grounding without self-certification.

  The user should have asked about svataḥ prāmāṇya and how Nyāya handles contradictions. That would clarify the non-hierarchical nature and the process of resolving clashes through defect-checking rather than automatic ranking.
answer: |-
  ### Prose Explanation

  Your friend's core misunderstanding is treating Nyāya's list of *pramāṇas* (knowledge sources) as a rigid hierarchy where "higher" sources automatically override "lower" ones. **This is incorrect.** The order (perception → inference → comparison → testimony) reflects *logical dependency*, not inherent superiority or evidential weight. Each *pramāṇa* is independently valid within its proper domain, and clashes are resolved by investigating *defects* (doṣa) in the specific instance, not by default priority.

  **Why the "ranking" claim is wrong:**
  1. **Perception is NOT self-certifying or Cartesian:** Nyāya holds that *all* knowledge is *provisionally* valid (*svataḥ prāmāṇya* – validity is intrinsic initially) but *defeasible*. Perception can be erroneous (e.g., mistaking a rope for a snake due to dim light). It needs validation by other means (like inference or testimony) and is *not* indubitable. Your friend's "foundationalism" claim is a misreading.
  2. **Testimony is NOT inherently inferior:** Verbal testimony (śabda) is *essential* for knowledge beyond sensory reach (e.g., morality, karma, mokṣa). Vedic claims are treated as knowledge *because* Nyāya accepts testimony from a *reliable source* (āptavākya) – like the Vedas or a trustworthy person – as a valid *pramāṇa*. It's not "diplomacy"; it's epistemic necessity.
  3. **Order ≠ Ranking:** The order shows how knowledge is *built*: perception provides raw data, inference builds on it, comparison relies on prior knowledge, and testimony conveys knowledge inaccessible otherwise. It's pedagogical, not hierarchical. A flawless testimony about the imperceptible *cannot* be overruled by perception because perception *cannot* address that domain.

  **Resolving Clashes:**
  Nyāya resolves conflicts by **scrutinizing for defects in the specific cognition**, not by favoring one *pramāṇa* type:
  - **The Well Case:** If reliable testimony ("well is north") clashes with your perception ("well looks south"), you *don't* default to perception. You investigate defects: Is your vision impaired (dust, glare)? Is the informant lying or mistaken? Is there a second well? You might cross-check with inference (footprints leading north) or better perception (walk closer). Perception wins only if testimony is flawed *in this instance* – not because perception is "higher."
  - **Ritual Fruits (Imperceptible Case):** Testimony is the *only* possible *pramāṇa* here. Since perception/inference cannot access it, a reliable testimony (e.g., Veda or a trustworthy guru) *is* conclusive knowledge. There is no clash because other *pramāṇas* are silent. Nyāya accepts this as genuine knowledge.

  **Where Testimony Fits:** Śabda is sovereign for the imperceptible. Nyāya explicitly uses it to justify Vedic claims about dharma, karma, and mokṣa. It's not derivative; it's the *only bridge* to that knowledge. To reject this is to reject Nyāya's core commitment to rational theology.

