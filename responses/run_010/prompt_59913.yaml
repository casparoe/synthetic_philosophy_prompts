  ok so I just spent three hours in an arguement with my friend about Nyāya epistemology and I think we were both talking past each other, so I want a second opinion.

  Her claim: Gautama lists the pramanas in order of evidential weight — perception first, inference second, upamana third, testimony dead last — and that the order *is* a ranking. So a perception always trumps a verbal report, testimony is just a secondhand crutch, and because of that Nyāya can't honestly treat Vedic claims about heaven and moksha as knowledge at all, they're just being diplomatic about scripture. She also said perception in Nyāya is self-certifying, which makes them foundationalists, basically like Descartes.

  My pushback was that if perception always wins and everything else is derivative, then why bother with a list of four at all — but I couldn't articulate it, and now I'm not sure either of us is right.

  Concretely, here's the case I want settled: a guy who seems reliable tells me the well is north of the banyan tree. I squint across the field and it looks to me like its south. Under Nyāya's own rules, what actually decides this? And does the answer change if what he's telling me is something nobody could perceive in principle, like the results of a ritual?

  Answer for real, don't hedge. Prose first: what the ranking claim gets wrong if it does, how a Naiyayika actually adjudicates a clash between two candidate knowledge sources, and where testimony about the unperceivable fits in the system. No references or reading list, I can't check them anyway. Then a short JSON summary with exactly these fields:

