  *double-checks requirements* Almost forgot the drone vs Mahler contrast! That's perfect for individuation - forces her to explain structural variety without representation. And for pessimism tension: if music is will-in-motion, why isn't it agitating? Her answer will expose whether she's watering down Schopenhauer's metaphysics. 

