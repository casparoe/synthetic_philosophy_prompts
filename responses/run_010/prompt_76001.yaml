  *scratches head* Tricky part is structuring this so retreat gets harder. Should start with apparent strengths (why the view feels plausible phenomenologically) then corner her with metaphysics. Follow-ups must anticipate her "listening feels like..." moves - e.g., if she says hierarchy isn't literal, ask what structural features *do* metaphysically correspond to will's gradation. 

