  ## The Household Counts

  We speak of what we owe, of what we gain.
  The question always waits: who pays the cost
  when good for all is gathered in the sum?
  This hand that lifts the wood to warm the room
  is not the hand that blisters. Still, we count
  the stacked logs burning, not each splintered thumb.

  This thumb might choose the ache, for next week’s gain
  within its single life. Is that just cost?
  Is *this* self, hungry now, the same as *that* who
  will thank it later, sitting in the warmed room?
  The future mouth enjoys, forgetting count
  of present pain. Is that one life? Or sum

  of different moments? Where is the true who
  to anchor judgment? Boundaries exhaust
  our certainty. The line drawn round a room
  contains shifting selves. Perhaps the total sum
  of family ties binds tighter than the count
  of separate bodies sharing warmth and gain.

  We stand in line to pay the household’s cost,
  each portion measured out. Yet where’s the gain
  for *this* one sent to stand outside the room,
  the sick child nursed through night, whose fevered count
  is ours to share? The good is real, the sum
  is tallied, but the price falls hard on who

  bears it alone. It’s not their afternoon’s gain,
  though all agree the total cost was just. Who
  grants permission? Some say that act’s exhaust-
  ively forbidden, shield held for the who
  against the cold arithmetic of the sum,
  a shelter built no outcome can surmount.

  We count our mouths, we portion out the gain
  in bread. We feel the pressure of the cost
  deep in the bone. The argument’s exhaust
  blows back the question: Isn’t this just who
  we start from, dressed in different words? The room
  resumes its chores, the old unease its hum.

  Is gain enough? What shields the single who?
  The sum stands tallied. Still, that quiet cost
  exhausts the count. This room holds doubt, and whom?

  ---

  **End Words & Structure:**
  *   **Individual Terms (Particular):** `who` (1), `cost` (2), `room` (4)
  *   **Aggregate Terms (Net Arithmetic):** `gain` (3), `sum` (5), `count` (6)
  *   **Rotation:** Stanza 1: 1(who)-2(cost)-3(gain)-4(room)-5(sum)-6(count)
      *   Stanza 2: 6(count)-1(who)-5(sum)-2(cost)-4(room)-3(gain)
      *   Stanza 3: 3(gain)-6(count)-4(room)-1(who)-2(cost)-5(sum)
      *   Stanza 4: 5(sum)-3(gain)-2(cost)-6(count)-1(who)-4(room)
      *   Stanza 5: 4(room)-5(sum)-1(who)-3(gain)-6(count)-2(cost)
      *   Stanza 6: 2(cost)-4(room)-6(count)-5(sum)-3(gain)-1(who)
      *   Envoi: Mid(room, gain, exhaust) / End(cost, who, whom)

  **Argument Through Form & Content:**
  1.  **Stanza 1 (Household as Unit):** Introduces the household ("we") calculating shared burdens ("cost", "gain", "sum", "count") but notes the particular "hand" bearing the "cost" is distinct. "Who" and "sum" are adjacent.
  2.  **Stanza 2 (Intrapersonal Counter - Dentist):** Focuses on the self over time ("thumb" choosing ache for future "gain"), questioning the unity of the person ("who") and whether "sum"ming across time is valid. "Sum" follows "who".
  3.  **Stanza 3 (Blurred Boundaries):** Questions the sharpness of personal boundaries ("Where is the true who?", "Boundaries exhaust", "line drawn round a room"), suggesting the family "sum" might be more binding than individual "count". "Who" and "sum" are adjacent.
  4.  **Stanza 4 (Net Isn't Anyone's):** Shows the "sum" being tallied ("count our mouths", "portion out the gain") but the concrete "cost" ("sick child") falling on a particular "who". "Sum" and "who" are adjacent. Reinforces the "sum" is not anyone's specific good.
  5.  **Stanza 5 (Prohibition, Not Shape):** States the core objection: some acts are forbidden ("shield held for the who") regardless of the overall "sum" ("against the cold arithmetic"). "Who" and "sum" are adjacent. This is the *answer* to the utilitarian aggregation, placed per request.
  6.  **Stanza 6 (Renamed Intuition):** Suggests the objection ("argument's exhaust") might just restate the initial unease ("Isn't this just who we start from?"). The household ("room") continues, the doubt ("cost") remains ("exhausts the count").
  7.  **Envoi (Unresolved):** Poses the central, unresolved question ("Is gain enough? What shields the single who?") while acknowledging the reality of the "sum". It "holds doubt" and ends with the open, irreducible "whom?" echoing the essential "who?".
