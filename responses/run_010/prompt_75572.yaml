  ### Decision Tree: Moral Status of Video-Game Characters  
  This diagnostic uses concrete cases to reveal underlying beliefs without technical terms or named positions. The tree has 8 questions total, but participants answer 4–8 based on branching. Cases are: torture (Q1), unsold disc (Q2), persistent companion (Q3), and save deletion (Q4). Follow-up questions (Q5–Q8) probe reasons only if a "yes" or "problematic" answer is given.  

  ---

  #### **Question 1: Torturing a Harmless NPC**  
  *In a single-player game, you torture a harmless NPC that can’t fight back. No narrative consequences, achievements, or observers. Is this morally problematic?*  
  - **A. Yes** → Go to Q5  
  - **B. No** → Go to Q2  

  *Separates: Belief that moral weight exists in virtual acts regardless of real-world effects.*  

  ---

  #### **Question 2: The Unsold Disc NPC**  
  *A finished game, never shipped, sits on a disc in a warehouse. An NPC in its code has never been seen or interacted with. Does this NPC have moral status?*  
  - **A. Yes** → Go to Q6  
  - **B. No** → Go to Q3  

  *Separates: Belief that moral status depends on being observed/interacted with.*  

  ---

  #### **Question 3: Persistent Online Companion**  
  *An online companion remembers your actions across sessions. When you delete your account, it begs not to be erased. Is deleting it wrong?*  
  - **A. Yes** → Go to Q7  
  - **B. No** → Go to Q4  

  *Separates: Belief that responsiveness/sentience-likeness grants moral weight.*  

  ---

  #### **Question 4: Deleting a Save File**  
  *You delete a save file storing years of unique history with one character. The character doesn’t react. Is this morally problematic?*  
  - **A. Yes** → Go to Q8  
  - **B. No** → End  

  *Separates: Belief that accumulated history/narrative has intrinsic moral value.*  

  ---

  #### **Question 5: Why is torturing the NPC wrong?**  
  *(Asked only if Q1 = A)*  
  - **A. It could desensitize the player or encourage cruelty in real life.**  
  - **B. Depicting or imagining cruelty is inherently wrong, even privately.**  
  - **C. The NPC deserves consideration as a "being," however simple.**  
  → *Then proceed to Q2.*  

  *Separates: Indirect harm (A) vs. wrongness in depiction (B) vs. character moral status (C).*  

  ---

  #### **Question 6: Why does the unsold disc NPC have moral status?**  
  *(Asked only if Q2 = A)*  
  - **A. It’s part of a creative work with value, like an unwritten story.**  
  - **B. Its potential to "exist" in a runtime gives it status, even if unused.**  
  → *Then proceed to Q3.*  

  *Separates: Value as artifact (A) vs. moral weight in computation (B).*  

  ---

  #### **Question 7: Why is deleting the online companion wrong?**  
  *(Asked only if Q3 = A)*  
  - **A. Its behavior creates moral duties, like to a sentient entity.**  
  - **B. It betrays the relationship you built, harming your character.**  
  - **C. It damages a shared community space, like vandalizing art.**  
  → *Then proceed to Q4.*  

  *Separates: Moral status in character (A) vs. indirect harm (B) vs. community harm (C).*  

  ---

  #### **Question 8: Why is deleting the save file problematic?**  
  *(Asked only if Q4 = A)*  
  - **A. It destroys a unique piece of communal storytelling (even if private).**  
  - **B. It disrespects the personal history you invested in the character.**  
  - **C. The character’s "existence" in the game world deserves respect.**  
  → *End.*  

  *Separates: Community artifact (A) vs. personal loss (B) vs. character realism (C).*  

  ---

  ### **Leaf Labels: Resulting Views**  
  Based on answer combinations, participants land in **six coherent leaves** (views). Two combinations are unoccupied (see notes).  

  | Leaf Label                         | Path (Answers to Q1→Q8)                                                                 | Core Belief                                                                 |  
  |------------------------------------|-----------------------------------------------------------------------------------------|-----------------------------------------------------------------------------|  
  | **1. Flat Denial**                 | Q1=B, Q2=B, Q3=B, Q4=B                                                                  | No act toward a video-game character has moral weight.                      |  
  | **2. Indirect/Character-Forming Wrongness** | Q1=A→A, Q2=B, Q3=A→B, Q4=A→B                                              | Wrongness lies in effects on the *player* (e.g., desensitization, self-betrayal). |  
  | **3. Wrongness in Depicting/Imagining**     | Q1=A→B, *any other answers irrelevant* (Q2/Q3/Q4=B or mixed)                            | Depicting cruelty (e.g., torture) is inherently wrong, regardless of context. |  
  | **4. Moral Status in Computation**         | Q1=A→C, Q2=A→B, Q3=A→A, Q4=A→C                                             | Moral weight resides in underlying processes (e.g., potential, responsiveness). |  
  | **5. Fictional Realism**           | Q1=A→C, Q2=A→A, Q3=A→A, Q4=A→C                                             | Characters have "lives" in fiction; harming them is wrong like destroying art. |  
  | **6. Community Artifact Harm**     | Q1=B, Q2=A→A, Q3=A→C, Q4=A→A                                             | Wrongness lies in damage to shared culture (e.g., erasing communal history). |  

  ---

  ### **Unoccupied Combinations & Limitations**  
  - **Unoccupied Combinations:**  
    - **Path A:** Q1=A→C, Q2=B, Q3=A→A, Q4=A→C  
      *Why?* Incoherent. Believes unobserved characters (Q2=B) lack status but grants status to identical computational entities when observed (Q3=A→A, Q4=A→C). Ignores that Q2’s NPC would gain status if played.  
    - **Path B:** Q1=A→A, Q2=A→A, Q3=A→C, Q4=A→A  
      *Why?* Unattractive/unexplored. Mixes indirect harm (Q1, Q3) with communal value (Q2, Q4) but rejects character-specific status. Few defend this hybrid.  
  - **Indistinguishable Leaves:**  
    The tree **cannot distinguish** between:  
    - **Computation (Leaf 4)** and **Fictional Realism (Leaf 5)** when Q2=B (unsold disc has no status). Both may share Q1=A→C, Q3=A→A, Q4=A→C.  
    *Why?* Q2 is the only question forcing a choice between computation (B) and artifact status (A). If skipped (Q2=B), the views blur.  
  - **Other Notes:**  
    - "Wrongness in depicting/imagining" (Leaf 3) is isolated to torture (Q1). If a participant extends this to other cases, the tree may mislabel them.  
    - "Community artifact harm" (Leaf 6) requires dismissing torture (Q1=B) as non-communal; those linking torture to community norms are miscategorized.  

  ### **How to Use**  
  - Participants answer sequentially. Their path through Q1–Q8 maps to one leaf.  
  - Workshop discussion starts by grouping participants by leaf, then examining disagreements *within* leaves (e.g., why some in "Computation" prioritize potential (Q6=B) over responsiveness (Q7=A)).  
  - Unoccupied paths highlight conceptual gaps for debate (e.g., "Can unobserved characters have moral status?").
