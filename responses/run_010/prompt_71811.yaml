  The clerk-plus-box objection is critical. The student argues that the clerk follows finite instructions: write the equation, feed B, read the answer. That seems like an effective method. To counter this, I must argue that B itself isn't effective because its internal process isn't mechanically explicable. The clerk is just using an oracle; the effectiveness relies on B's unexplained process, which isn't reducible to finite mechanical steps. Thus, the method isn't purely effective; it's contingent on an external, non-algorithmic device. 

  The key distinction is between an effective method (intrinsically mechanical) versus an effective procedure augmented by a non-mechanical oracle. The clerk's steps are mechanical, but B's operation isn't, so the combined system isn't an effective method in the 1936 sense. 

