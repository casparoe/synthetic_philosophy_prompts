  ## COMMISSION OPINION: Petition to List the Cinder Fork Dace  
  **Motion:** I move that the Commission list the Cinder Fork dace population unit (as petitioned: approximately 14 stream-kilometers in the Cinder Fork basin, including the population over the pass) as a threatened species under the State Endangered Species Act.  

  **I. Findings on Discreteness**  
  The record demonstrates that the Cinder Fork dace meets the statutory definition of "discrete."  

  *   **Substantial Isolation:** While the 2019 ddRAD study shows the Cinder Fork dace is nested within *Rhinichthys atratulus* (silver dace) and reveals low-level nuclear gene flow over evolutionary time (thousands of years), it does not demonstrate *current* panmixia or the absence of substantial isolation. Key evidence supports substantial reproductive isolation:  
      *   **Fixed Mitochondrial Differences & Monophyly:** The mtDNA shows reciprocal monophyly (0.3% divergence, 2 fixed differences). While the authors attribute this to drift or a recent sweep in a small population, this pattern is *consistent with* substantial isolation facilitating lineage-specific evolution, even if incomplete. Drift *requires* isolation.  
      *   **Restricted Gene Flow at Adaptive Loci:** The hybrid zone study is critical. Genomic cline analysis demonstrates that while most of the genome introgresses freely, **multiple loci associated with cold tolerance and spawning timing resist introgression.** This proves *current* barriers to gene flow for ecologically critical traits, maintaining adaptive divergence despite contact.  
      *   **Ecological & Temporal Barriers:** The dace's confinement to specific spring-fed, cobble-bottom habitat and its unique winter spawning timing (7 weeks earlier than sympatric silver dace) constitute strong pre-zygotic isolating mechanisms limiting contemporary gene flow.  
      *   **Irrigation Return Origin:** The hybrid zone's location *below* a man-made return flow (only present since the 1950s) strongly suggests prior isolation was sufficient to allow the evolution of distinct traits before recent artificial contact.  

  **Conclusion on Discreteness:** The combination of distinct mtDNA, strong barriers to gene flow at adaptive loci underpinning survival and reproduction (cold tolerance, spawning timing), and unique ecological/temporal niches constitutes "substantial isolation" as intended by the legislature. Low-level neutral gene flow across most of the genome does not negate the demonstrable isolation relevant to evolutionary independence *for the traits defining this unit*. Staff's interpretation requiring near-complete lineage independence or reciprocal monophyly sets a bar higher than the statute's "substantially isolated" language and the reality of evolution in many freshwater fishes.  

  **II. Findings on Significance**  
  The loss of the Cinder Fork dace population unit would represent a significant loss to the silver dace taxon.  

  *   **Unique Evolutionary Legacy:** The fixed mtDNA differences and the specific combination of morphological traits (gill rakers, scales, unique breeding coloration) represent an evolutionary trajectory within the silver dace complex not found elsewhere, even if recent.  
  *   **Unique Adaptive Traits:** The loci under selection for **cold tolerance** and **distinct winter spawning timing** represent locally adapted alleles and potentially co-adapted gene complexes critical for survival in its specific spring-fed, upper-reach environment. These traits would be lost if this unit disappears.  
  *   **Ecological Representation:** This population unit occupies a unique, geographically restricted habitat type (spring-fed headwaters) within the silver dace's broader range. Its loss would reduce the ecological diversity represented within the taxon.  
  *   **Resilience:** Maintaining distinct, locally adapted populations contributes to the overall genetic diversity and adaptive potential of the silver dace taxon in the face of environmental change (e.g., climate change, habitat alteration). The loss of this unit diminishes that potential.  

  **Conclusion on Significance:** The Cinder Fork dace population unit contributes unique genetic (adaptive alleles), morphological, behavioral (spawning timing), and ecological attributes to the silver dace taxon. The loss of these specific contributions, particularly the cold-adapted alleles and early spawning strategy tied to its unique habitat, would be significant.  

  **III. Addressing the "Filing System" Argument**  
  Commissioner Smith raises a crucial philosophical point: species categories are human constructs, boundaries can be porous, and listing decisions have real-world costs. This deserves serious engagement.  

  *   **Construct Acknowledged:** Yes, taxonomy is a human tool for organizing biodiversity. Boundaries like "species" or "population" are hypotheses, not immutable truths. The genetic data here vividly illustrates this fluidity.  
  *   **Beyond Arbitrary Lines:** However, the statute compels us to look beyond purely arbitrary lines. It directs us to find units that are "discrete" (substantially isolated) and "significant" (contributing something unique). The Cinder Fork dace isn't *just* a line on a map. It represents:  
      1.  **Documented Adaptive Divergence:** Loci under selection for survival in its specific environment.  
      2.  **Unique Evolutionary Potential:** Its specific combination of traits represents a distinct evolutionary pathway with future potential.  
      3.  **A Measurable Conservation Risk:** The pending groundwater withdrawal poses a specific, quantifiable threat to its persistence.  
  *   **The Cost Question:** The $40 million cost cited is real. However, the statute's listing criteria focus on biological reality, not economic impact. Listing does not automatically halt the project; it triggers consultation to find solutions that avoid jeopardy *to this specific, biologically significant unit*. The "least damage" calculation belongs in that mitigation phase, informed by the biological status we determine here. Ignoring demonstrable adaptive significance and unique contributions because of cost sets a precedent that undermines the Act's core purpose – conserving the state's *biological heritage*, including its distinct evolutionary lineages, regardless of their formal taxonomic rank.  

  **IV. Motion Clarification & Scope**  
  *   **Unit Definition:** Listing the petitioned unit is appropriate. The adaptive traits (cold tolerance, spawning timing) are relevant across its entire range, including the population over the pass. There is no evidence presented suggesting this population is genetically or ecologically distinct *from the rest of the Cinder Fork unit* in ways relevant to discreteness or significance within the meaning of the Act.  
  *   **Hybrid Zone:** The hybrid zone itself is a dynamic area of genetic exchange and does not constitute a discrete population unit. The significant unit is the Cinder Fork population maintaining the adaptive traits upstream.  
  *   **Consistent Application:** This reasoning directly applies to the pending springsnail and lupine petitions. For each, the question is: Does the unit show evidence of substantial isolation *despite potential gene flow* (e.g., via genomic clines showing resistance at adaptive loci, unique mtDNA, ecological barriers)? And, would its loss represent a significant loss of unique genetic, ecological, or evolutionary attributes to the broader taxon? Low-level neutral gene flow is not an automatic bar to discreteness if adaptive divergence and substantial isolation for significant traits are demonstrated.  

  **V. Recommendation**  
  Based on the statutory criteria, the biological evidence of substantial isolation (particularly the resistance to introgression at adaptive loci and unique mtDNA), and the clear significance of its unique adaptive traits and ecological role, I recommend the Commission **GRANT the petition** and list the Cinder Fork dace population unit as a threatened species. Continuing for more data is unnecessary; the critical genomic and ecological evidence is already in the record. Denial would require ignoring the evidence of current barriers to gene flow for critical adaptive traits and the unique evolutionary contribution of this unit, setting an overly restrictive precedent inconsistent with the broader purpose of our state Act.  

  Respectfully submitted,  
  [Your Name]  
  Commissioner, State Fish and Wildlife Commission
