  ### Meritocracy Position Sorter: Decision Tree and Analysis  

  #### **1. Logical Space Axes (4 Novel Axes)**  
  - **Basis of Desert (Action vs. Disposition)**: Must desert stem from *chosen actions* (e.g., working hard), or can *unchosen traits* (e.g., innate persistence) justify it? Turns on whether "earning" requires agency.  
  - **Scope of Desert Claims (Context-Dependence)**: Does desert apply universally, or only in specific relationships (e.g., workplace vs. family)? Turns on whether merit is intrinsic or socially constructed.  
  - **Distortion Under Measurement**: When a metric (e.g., test scores) is used to allocate rewards, does it *corrupt* the underlying quality it measures? Turns on whether quantification inherently distorts merit.  
  - **Scarcity’s Effect on Desert**: When two equally deserving candidates compete for one reward, does desert become irrelevant or more urgent? Turns on whether desert requires realizability.  
  - **Non-Comparative Desert**: Can one person "deserve" independently of others, or is desert always relative? Turns on individualism vs. zero-sum competition.  
  - **Justification Sans Desert**: Can unequal outcomes be defended without invoking desert (e.g., via incentives or social utility)? Turns on whether justice requires moral deservingness.  

  > **Novelty for Readers**: 3+ axes (Context-Dependence, Distortion Under Measurement, Scarcity’s Effect) are rarely discussed outside philosophy/economics.  

