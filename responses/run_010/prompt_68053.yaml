  Then after deriving SS0=0, we can do:
  isZero(SS0) = false (by A4 with x=S0)
  But also, since SS0=0, we can substitute: isZero(0) = true.
  So we have true = false -> contradiction.

  But that adds complexity.

  Given the time, I think it's acceptable to have inequality. We can introduce a constant "true" and an inequality predicate.

  But to keep it as simple as possible, we can have:

  We state that the system is based on equality. And we have an axiom that says 0 and Sx are not equal. Then if they ever derive 0 = Sx for some x, that is a contradiction.

  In the derivation, they can derive 0 = SS0 (from the steps above). And then they know from axiom A3 that 0 ≠ SS0. So they have both 0=SS0 and 0≠SS0. That is a contradiction.

  In the game, we can define a contradiction as deriving both an equality and its negation (where the negation is given by an axiom that says two specific terms are not equal).

  So the rules can state:

  - If you derive an equation of the form 0 = St for some term t, and you also have the axiom that says 0 and St are not equal, then you have a contradiction.

  And axiom A3 is stated as: for any x, 0 ≠ Sx.

  So in the game, when a team derives 0 = St, they can call out "contradiction!" and then show the axiom A3 instantiated with x such that Sx = St (which is the same term).

  So for St = SS0, they would use A3 with x = S0.

  The derivation:

  1. S0+S0 = 0 [by A6]
  2. S0+S0 = SS0 [by the normal derivation]
  3. Therefore, 0 = SS0 [by 1,2 transitivity]
  4. But axiom A3 says: 0 ≠ SS0.

  Contradiction.

  Game rules for contradiction: 
  - If a team derives a contradiction, they get 10 points (or a large bonus) and the game stops for that system.

  Then, we have the collapse: all theorems that used the quarantined axiom (A6) are now invalid. We have to decide which theorems are invalid.

  But in reality, once there's a contradiction, everything is provable. But in the game, we want them to lose points for theorems that used the bad axiom.

  So we will require that each theorem derivation is accompanied by a proof trace (which axioms and rules were used). Then, if a theorem used A6 in its proof, it is invalid.

  Point adjustment: teams lose points for every invalid theorem they derived.

  Then, they have the option to remove A6 and continue in the weakened system (now with only A1-A5).

  But in the weakened system, they might have already derived some theorems that didn't use A6. They keep those. And they can derive more.

  But they will have to rederive some theorems without A6 that they previously had with A6, and they might not be able to derive some (like x+x=0).

  The point scheme:

  - Each new and correct theorem: 1 point.
  - If a theorem is derived in one step (directly from an axiom), bonus 0.5 points.
  - Contradiction bonus: 20 points for the team that finds it.

  After the contradiction, we quarantine A6. Then:
  - Each team loses all points for theorems that used A6 in their proof.

  Then they can continue deriving in the new system (without A6) and earn points as before.

  Timeline:

  0-10 min: Introduction. Explain the system, the symbols, the axioms, and the derivation rules. Do one or two examples on the board.

  10-40 min: Game play. Teams work to derive theorems. They write each theorem on a card with a proof sketch (which axioms/rules used). They bring the card to the instructor or a TA to check. If correct, they post it on a central board and get the points. The central board has a running list of theorems and which team derived them.

  40 min: We hope by now someone has derived the contradiction. If not, the instructor can drop hints. Once a team derives it, they announce it and get the bonus. The game stops.

  40-45 min: The instructor explains that the system is inconsistent. Now, we must quarantine the problematic axiom. The class decides which axiom to remove. (We hope they choose A6, but if not, the instructor can guide.) In this case, it's clearly A6.

  45-50 min: Point adjustment: each team reviews their derived theorems and crosses out those that used A6. They lose the points for those.

  50-70 min: Game resumes without A6. Teams derive new theorems.

  70-75 min: Debrief.

  Debrief points:

  1. The feeling when the contradiction was found: initially, you were building a structure of theorems, then suddenly it collapsed. This is like the worry in mathematics: what if our axioms are inconsistent? We would lose everything.

  2. The decision to quarantine an axiom: we removed A6, which was convenient for proving some theorems quickly, but it was the source of the problem. In mathematics, if we find an inconsistency, we try to isolate the faulty axiom and remove it. But sometimes the axiom might be very useful (like the axiom of choice in set theory), and removing it weakens the system.

  3. The game has an outside perspective: the instructor and the students can discuss and decide to remove an axiom. But in mathematics, when we are working within a system, we cannot step out. Gödel showed that a system cannot prove its own consistency from within. In the game, we could see the inconsistency from outside, but within the system, they were just deriving theorems until they hit the contradiction.

  4. After removing A6, we continued mathematics in a weaker system. This is what we do in practice: we work in systems that we hope are consistent, and we adjust if we find problems. The possibility of inconsistency always remains open, but we don't let it paralyze us.

  What might go wrong:

  1. The students might not derive the contradiction within the time. 
     - Solution: Have hints ready. Or, if time is running out, the instructor can show the derivation.

  2. The students might not use A6 much, so when they lose points after quarantine, it's not painful.
     - Solution: Encourage the use of A6 by having a list of theorems that are easy to prove with A6. For example, "Prove that S0+S0=0" and "SS0+SS0=0", etc. Or, assign specific tasks that are easily done with A6.

  3. The derivation without A6 might be too hard or too boring.
     - Solution: In the handout, provide guidance on how to prove things without A6. For example, how to prove commutativity or associativity? But that might be complex. Instead, they can try to prove things like SSS0+SS0 = SSSSS0? But without induction, they can only do specific instances.

     Actually, without induction, they can still prove specific equalities. For example:
     SS0 + S0 = S(SS0+0) = SS0+0 = SS0? That doesn't seem right.

     Let me do:
     SS0 + S0 = SS0 + S(0) = S(SS0+0) [by A2] = S(SS0) [by A1] = SSS0.

     So SS0 + S0 = SSS0.

     So they can do that.

  4. Students might not understand the substitution rules.
     - Solution: Do more examples in the introduction.

  Overall, this game should give them a taste of the experience.

  Features the game cannot reproduce:

  - In the game, the axioms are finite and handed out, and the flaw is planted. In real mathematics, the axioms are often infinite (like the axiom schema of induction) and the inconsistency might be very deep and hard to find.
  - The game has an agreed outside perspective. In mathematics, there is no such thing: we are always working within some formal system or relying on our intuition.
  - The collapse in the game is controlled: we only remove theorems that used the bad axiom. In an inconsistent system, every statement is provable, so the whole system is worthless. But in practice, we try to save what we can by removing the bad part.

  The instructor should explain these limitations.

  Handout example:

  Mini-Arithmetic (MA)

  Symbols: 0, S, +
  Terms: 0, S0, SS0, SSS0, ...; 0+0, S0+0, 0+S0, S0+S0, etc.

  Axioms:
  A1. x+0 = x
  A2. x+Sy = S(x+y)
  A3. 0 ≠ Sx   (for any x)
  A4. Sx=Sy → x=y   (but note: we will use equality, so we can use the equality rules)
  A5. x=0 or there exists y such that x=Sy. (But for our purposes, we might not need to use this axiom in the derivation of the contradiction, so we might omit it to simplify. Alternatively, we can keep it but note that it might not be used.)

  But in the derivation of S0+S0=SS0, we don't need A5. So we can omit A5 to keep it simpler.

  So let's remove A5.

  So the axioms are:
  A1. x+0 = x
  A2. x+Sy = S(x+y)
  A3. 0 ≠ Sx
  A4. Sx=Sy → x=y
  A6. x+x = 0

  Rules of derivation:
  1. You can replace any variable in an axiom with any term to get an instance.
  2. Equality rules: reflexive, symmetric, transitive, and substitution (if you have a=b, then you can replace a with b in any term).
  3. If you have an equation, you can apply the successor to both sides: if a=b, then Sa=Sb.

  Also, note that A4 is an implication. How do we use it?
  We can derive: if you have Sa=Sb, then you can derive a=b.

  But in practice, they might have an equation Sa=Sb, and then they can write a=b.

  Example derivations:

  1. S0+0 = S0  [from A1: let x=S0]
  2. S0+S0 = ? 
     Without A6: 
        S0+S0 = S0+S(0) [writing 0 as 0] = S(S0+0) [A2] = S(S0) [from 1] = SS0.
     With A6: 
        S0+S0 = 0.

  Then they can set: 0 = SS0 (from the two above and transitivity).
  But then from A3: 0 ≠ SS0 -> contradiction.

  So the system is:

  Axioms:
  A1. x+0 = x
  A2. x+Sy = S(x+y)
  A3. 0 ≠ Sx
  A4. If Sx=Sy then x=y
  A6. x+x = 0

  We can also add reflexivity of equality? But it might be too basic. We can assume they know that every term equals itself.

  So in the handout, we can state that equality is reflexive, symmetric, and transitive, and they can use that.

  This should be doable.

  Final timeline:

  0-10 min: Introduction. Explain symbols, terms, axioms, and rules. Do examples: derive S0+0=S0 (A1), and then derive 0+S0: 
     We don't have an axiom for this, so guide them: 
        0+S0 = 0+S(0) = S(0+0) [A2] = S(0) [A1] = S0.
     And then with A6: S0+S0=0.

  10-40 min: Game play. Teams derive theorems. They can derive:
     - 0+0=0
     - S0+0=S0
     - 0+S0=S0
     - 0+SS0 = SS0   [because 0+SS0 = 0+S(S0) = S(0+S0) = S(S0) = SS0]
     - S0+S0=0   [by A6]
     - S0+S0=SS0   [by the long way]
     - Then they might set 0=SS0.
     - Then they see axiom A3: 0≠SS0 -> contradiction.

  40 min: When a team finds the contradiction, they announce. The instructor verifies and awards 20 points.

  40-45 min: Quarantine A6. Remove it from the axiom list.

  45-50 min: Teams lose points for every theorem that used A6. They must identify which of their theorems used A6. (The instructor can help verify.)

  50-70 min: Continue without A6. Now they can derive:
     - S0+S0=SS0
     - SS0+S0 = SSS0
     - etc.

  70-75 min: Debrief.

  This should work.
answer: |-
  ### In-Class Proof Game: "Tiny Arithmetic Crisis"

  #### **Game Overview**
  Students work in teams of 3 (6 teams for 18 students) to derive theorems in a simplified arithmetic system called **Tiny Arithmetic (TA)**. TA uses basic symbols and axioms that mimic real arithmetic but include a hidden inconsistency. Teams earn points for deriving unique theorems. Midway, a team will discover a contradiction (e.g., \(0 = 2\)), causing a "collapse": all theorems derived using the flawed axiom lose points. Students then choose whether to quarantine the axiom and continue in a weakened system, sacrificing previously earned points. This mirrors the real risk of inconsistency in mathematics and the trade-offs of axiomatic revisions.

  ---

  ### **The Tiny Arithmetic System**
  **Symbols**:
  - Constants: \(0\) (zero)
  - Unary operation: \(S\) (successor; e.g., \(S0 = 1\), \(SS0 = 2\))
  - Binary operation: \(+\) (addition)
  - Equality: \(=\) (governed by standard rules)

  **Terms**:
  - Built from \(0\), \(S\), and \(+\) (e.g., \(0\), \(S0\), \(SS0\), \(S0 + SS0\)).

  **Axioms** (Plant a flaw in A6):
  1. **A1 (Identity)**: \(\forall x (x + 0 = x)\)
  2. **A2 (Successor Addition)**: \(\forall x \forall y (x + Sy = S(x + y))\)
  3. **A3 (Zero Distinctness)**: \(\forall x (0 \neq Sx)\)  
     *(No successor equals zero)*
  4. **A4 (Successor Injectivity)**: \(\forall x \forall y (Sx = Sy \to x = y)\)  
     *(Equal successors imply equal predecessors)*
  5. **A5 (Commutativity of Addition)**: \(\forall x \forall y (x + y = y + x)\)  
     *(Plausible but not universally derivable without induction)*
  6. **A6 (Flawed Axiom)**: \(\forall x (x + x = 0)\)  
     *(Designed to cause inconsistency; e.g., \(1 + 1 = 0\))*

  **Derivation Rules**:
  1. **Axiom Instantiation**: Replace variables in axioms with specific terms (e.g., A1 with \(x = S0\): \(S0 + 0 = S0\)).
  2. **Equality Rules**:
     - Reflexivity: For any term \(t\), \(t = t\).
     - Symmetry: If \(t = u\), then \(u = t\).
     - Transitivity: If \(t = u\) and \(u = v\), then \(t = v\).
     - Substitution: If \(t = u\), replace \(t\) with \(u\) in any expression.
  3. **Successor Application**: If \(t = u\), then \(St = Su\).

  **Contradiction Trigger**:  
  Deriving any equation of the form \(0 = St\) (e.g., \(0 = SS0\)) violates A3. This is the inconsistency.

  ---

  ### **Materials**
  - **Handout**: 1 page with TA symbols, axioms, rules, and examples (see below).
  - **Team Whiteboards**: 6 small whiteboards/markers for team work.
  - **Central Scoreboard**: Poster with columns: **Theorem**, **Team**, **Points**, **Axioms Used**.
  - **Theorem Cards**: Small cards for teams to submit new theorems (write theorem and axioms/rules used).
  - **Timer**: For activity phases.

  **Handout Example**:  
  > **Tiny Arithmetic (TA)**  
  > **Terms**: \(0\), \(S0\) (1), \(SS0\) (2), \(SSS0\) (3), \(0 + S0\), \(S0 + SS0\), ...  
  > **Axioms**:  
  > - A1: \(x + 0 = x\)  
  > - A2: \(x + Sy = S(x + y)\)  
  > - A3: \(0 \neq Sx\)  
  > - A4: If \(Sx = Sy\), then \(x = y\)  
  > - A5: \(x + y = y + x\)  
  > - A6: \(x + x = 0\)  
  > **Rules**: Instantiate axioms, use equality rules, apply \(S\) to both sides.  
  > **Example**: Prove \(0 + S0 = S0\):  
  > 1. \(0 + S0 = 0 + S(0)\) (rewrite)  
  > 2. \(= S(0 + 0)\) (A2 with \(x=0, y=0\))  
  > 3. \(= S(0)\) (A1 with \(x=0\))  
  > 4. \(= S0\) (simplify).

  ---

  ### **Point Scheme**
  - **New Theorem**: +1 point (must be unique and correct; checked by instructor).
  - **One-Step Proof**: +0.5 bonus (direct from axiom instantiation, e.g., A6 gives \(S0 + S0 = 0\) in one step).
  - **Contradiction Bonus**: +10 points (first team to derive \(0 = St\) and call "Contradiction!").
  - **Quarantine Penalty**: All theorems using quarantined axiom lose points (teams strike them from scoreboard).
  - **No real money**: Points are bragging rights/tokens (e.g., "TA Master" certificate).

  ---

  ### **Timeline (75 Minutes Total)**

  | Time     | Activity                                                                                                | Instructor Role                                                                 |
  |----------|---------------------------------------------------------------------------------------------------------|---------------------------------------------------------------------------------|
  | **0-10** | **Introduction (10 min)**                                                                               | Explain TA system, axioms, rules, point scheme. Demo: derive \(0 + S0 = S0\).  |
  | **10-40**| **Game Phase 1: Derivation (30 min)**                                                                   | Circulate, check theorems, update scoreboard. Encourage use of A6 (hint: "short proofs!"). |
  | **40-45**| **Collapse (5 min)**                                                                                    | Verify contradiction (e.g., team derives \(0 = SS0\) via A6). Freeze game. Award 10-point bonus. |
  | **45-50**| **Quarantine Decision (5 min)**                                                                         | Teams discuss: quarantine A6 (lose points) or keep playing (system collapses)? Guide to quarantine A6. |
  | **50-70**| **Game Phase 2: Weakened System (20 min)**                                                              | Remove A6. Teams re-derive theorems without A6. Point loss felt (e.g., \(S0 + S0 = 0\) invalid). |
  | **70-75**| **Debrief (5 min)**                                                                                     | Discuss experience, map to real math.                                           |

  ---

  ### **Predictable Challenges & Recovery**
  - **Contradiction not found**: Likely if teams avoid A6.  
    *Recovery*: At 30 min, hint: "Try computing \(S0 + S0\) with A2 vs. A6." If no result by 40 min, reveal the derivation.
  - **A6 underused**: Teams miss point bonuses.  
    *Recovery*: Suggest specific tasks: "Prove \(SS0 + SS0 = 0\) for a one-step bonus!"  
  - **Quarantine confusion**: Teams resist losing points.  
    *Recovery*: Emphasize game logic: "If we keep A6, every theorem is suspect—even your past points!"  
  - **Weakened system stagnation**: Post-quarantine derivations slow.  
    *Recovery*: Provide goals: "Derive \(SS0 + S0 = SSS0\) without A6 (use A2 and A5)."

  ---

  ### **Debrief: Mapping Game to Real Mathematics**
  1. **The Collapse**:  
     - "When you derived \(0 = 2\), your point lead vanished. This is the *force* of inconsistency: if arithmetic were inconsistent, every proof using its axioms—like the Pythagorean Theorem—could collapse overnight. You *felt* the risk of building on unproven foundations."  

  2. **Quarantine and Trade-offs**:  
     - "Quarantining A6 cost you points (e.g., \(x + x = 0\) is gone). In math, we often revise axioms after crises (e.g., Russell’s Paradox in set theory), but it weakens the system. We lose powerful tools (like A6’s shortcuts) to preserve consistency."  

  3. **The Unprovable Consistency**:  
     - "In the game, *you* stepped outside TA to quarantine A6. But in real math, **we can’t step outside arithmetic** to prove its consistency from within. Gödel showed that any system powerful enough for arithmetic cannot prove its own consistency. You experienced why: if the system is flawed, it might hide its own contradictions until too late."  

  4. **Mathematics in the Open**:  
     - "After quarantining A6, you kept playing. That’s what mathematicians do: we work in systems where inconsistency is *possible* but not proven. We accept this uncertainty because math is too useful to abandon—just as you accepted point losses to keep playing."

  ---

  ### **Limitations of the Game & Instructor Supplements**
  The game simplifies reality. **After debrief, explicitly state**:  
  1. **Finite vs. Infinite Axioms**:  
     - *Game*: TA has 6 inspectable axioms.  
     - *Reality*: Arithmetic uses infinite axiom schemas (e.g., induction). Inconsistency could lurk in untested corners.  
     - *Supply in words*: "Real axioms are like an infinite ocean—we’ve mapped coasts but not depths."  

  2. **Outside Perspective**:  
     - *Game*: You discussed and quarantined from "outside" TA.  
     - *Reality*: Math has no agreed "outside" perspective. We’re always *inside* some system (e.g., ZFC set theory), which might itself be inconsistent.  
     - *Supply in words*: "Unlike the game, mathematics is a ship we rebuild at sea. We can’t dock to check for leaks."  

  3. **Controlled Collapse**:  
     - *Game*: Only theorems using A6 lost points.  
     - *Reality*: An inconsistency makes *every* theorem suspect (since \(P \land \neg P\) implies anything).  
     - *Supply in words*: "In a true collapse, we wouldn’t know which theorems to trust—it’s all or nothing."  

  **Final Note**: This game creates visceral stakes for a theoretical problem. By feeling the point-loss collapse and quarantine trade-off, students grasp why consistency matters—and why mathematicians keep sailing despite the risk.
