answer: |-
  ### 1. **Bottom line**  
  The maxim "ask who benefits" is not a single claim but a family of investigative heuristics with distinct logical structures. In ordinary use, it most often expresses **Reading #4**: a pragmatic tool for prioritizing hypotheses when evidence is scarce, directing attention to agents with disproportionate, non-universal gains. It is neither trivial nor universally reliable—its validity depends on context and auxiliary assumptions. The Dawson argument deploys a weak version (#1) that adds little to physical evidence; the institutional argument illicitly slides from #2 to #3, smuggling in unexamined premises about collective agency. A defensible version requires specifying benefit type and beneficiary scope while demanding corroborating mechanisms.

  ---

  ### 2. **The readings**  
  *(Defined by: (a) *Benefit*: actual, foreseen, likely, or structural; (b) *Beneficiary*: individual, group, institution, or system; (c) *Candidate set*: suspects, hypotheses, or explanations; (d) *Work done*: probabilistic evidence, hypothesis filter, attention heuristic, functional explanation.)*

  1. **Causal Motive Attribution**  
     *Benefit*: Foreseen or intended advantage. *Beneficiary*: Individual agent(s). *Candidate set*: Potential perpetrators. *Work*: Raises probability that the beneficiary caused the event (e.g., Dawson forged fossils to gain fame).  

  2. **Group Interest Justification**  
     *Benefit*: Actual or likely institutional/group advantage. *Beneficiary*: Defined collective (e.g., "British science"). *Candidate set*: Explanations for collective inaction/action. *Work*: Filters hypotheses by showing why a group tolerated or promoted the event (e.g., museums ignored flaws to retain prestige).  

  3. **Structural Functional Explanation**  
     *Benefit*: Systemic stability or advantage, unintended and unrecognized. *Beneficiary*: Institutions or social systems. *Candidate set*: Macro-historical narratives. *Work*: Explains persistence of events by latent functions (e.g., Piltdown survived because it reinforced colonial science hierarchies).  

  4. **Anomaly Detection Heuristic**  
     *Benefit*: Disproportionate, non-universal gain (actual or likely). *Beneficiary*: Any agent/group. *Candidate set*: All plausible accounts of an event. *Work*: Flags mismatches between stated motives and outcomes to allocate scrutiny (e.g., "Why did *only* Dawson’s career soar post-discovery?").  

  5. **Conspiracy Screen**  
     *Benefit*: Secretly realized advantage. *Beneficiary*: Hidden coalition. *Candidate set*: Official vs. covert explanations. *Work*: Trims "innocent" hypotheses by demanding hidden beneficiaries (e.g., "The true forger must be someone excluded from credit").  

  ---

  ### 3. **Verdicts**  
  - **#1 Causal Motive**: **Substantive but weak**. Defensible if beneficiaries are few and motives align with opportunity/means. Requires checking if benefit was *unique* to the suspect (e.g., Did rivals gain equally?). Often adds little beyond physical evidence.  
  - **#2 Group Interest**: **Substantive but overextended**. Defensible if groups act cohesively (e.g., institutions suppressing dissent). Requires premises about collective agency and goal alignment (e.g., Did all British anatomists share interests?). Falsifiable via internal dissent records.  
  - **#3 Structural Function**: **False as explanation**. Mistakes correlation for causation (e.g., "Piltdown benefited imperial science" doesn’t explain *how* it emerged). Unfalsifiable if benefits are retrofitted.  
  - **#4 Anomaly Heuristic**: **Substantive and defensible**. Highlights asymmetries for investigation (e.g., unexpected beneficiaries). Requires checking if gains are *exceptional* and *contingent* on the event.  
  - **#5 Conspiracy Screen**: **False**. Assumes conspiracies where incompetence suffices. Violates parsimony; untestable without access to "hidden" actors.  

  ---

  ### 4. **Back to Piltdown**  
  **Classmate 1 (Dawson)**: Uses **Reading #1** (individual motive). The argument is *trivial*: Dawson’s reputational gain is inherent to the act of discovery. It adds nothing beyond physical evidence unless it excludes others (e.g., "The curator had no incentive"). Without showing benefit was *exclusive*, it merely restates that forgers often seek credit.  

  **Classmate 2 (Institutional neglect)**: Starts with **Reading #2** (British science benefits) but covertly shifts to **Reading #3** (structural benefit). Claiming "nobody had interest in checking" assumes (a) the institution is a unified agent, (b) all members prioritized nationalism over truth, and (c) benefit explains inaction. This ignores counter-evidence (e.g., some experts *did* criticize Piltdown but were ignored due to authority, not nationalism). The slide from intentional benefit (#2) to systemic function (#3) masks the need to prove institutional coordination.  

  ---

  ### 5. **The maxim I can keep**  
  **Strongest version**: *"Prioritize investigating agents who gained disproportionately from an event, relative to baseline expectations, when their gain depended on its occurrence."*  

  **Two prerequisite questions**:  
  1. **Specificity**: "Is the benefit *exceptional* to this agent/group, or widely shared?" (If universal, heuristic fails.)  
  2. **Mechanism**: "How precisely would the beneficiary have caused (or sustained) the event?" (Otherwise, benefit is coincidental.)  

  \boxed{\text{Prioritize investigating agents who gained disproportionately from an event, relative to baseline expectations, when their gain depended on its occurrence.}}  
  \boxed{\text{1. Specificity: Is the benefit exceptional to this agent/group, or widely shared?}}  
  \boxed{\text{2. Mechanism: How precisely would the beneficiary have caused (or sustained) the event?}}
