  First, the core ask: They want a list of requirements ("desiderata") that any adequate restitution theory must satisfy. The examples given are crucial – colonial-era acquisitions that were technically legal but coercive, multiply-looted objects with disputed claimants, and source communities wanting ritual destruction instead of display. These aren't hypotheticals; they're real dilemmas the museum faces daily. 

  The user's deeper need is revealing itself: They're not just ticking boxes. They want to expose where principles *conflict* – hence the instruction to identify incompatible desiderata and pinpoint the most disqualifying requirement. This suggests frustration with oversimplified "return/don't return" binaries. They're likely preparing for internal debates where curators, lawyers, and activists will clash, and need intellectual armor for the gray zones.

  Now breaking down the mandatory cases: 
  - Colonial duress under "lawful" veneer requires grappling with how legality masks power asymmetry. 
  - Multiply-looted objects (e.g., Nazi-confiscated art later held by museums) need a theory of nested injustices across regimes. 
  - Ritual destruction demands challenge Western preservation ethics – can "heritage" include deliberate decay? 
  - One-sided documentation means confronting archives as tools of control. 
  - The whole-collection vs. case-by-case tension reveals their institutional reality: they need scalable policies, not 5,000 bespoke negotiations. 
  - The surrogate/shared custody question cuts to whether injustice is tied to physical possession or something deeper.

  Separating title from access is wise. Many museums conflate "you own it" with "we display it," but the user senses these are distinct moral layers. Ownership determines rightful authority; access governs stewardship. This distinction will help them untangle arguments like "we keep it so everyone can see it."

  On the "entrenched preferences" analysis: 
  - Universal accessible heritage is noble but often weaponized to deny return. Must flag this as a preference, not an axiom. 
  - Statutory bars on deaccessioning are legal obstacles masquerading as ethics – the framework should name this as a structural bias. 
  - Deference to source communities is a genuine ethical demand, but requires defining "community" rigorously (not state appropriation).

  The conflict mapping is where it gets thorny. The user suspects – correctly – that satisfying all desiderata is impossible. Key fault lines: 
  - Permanent physical return vs. universal access. 
  - Ritual destruction vs. preservation ethics. 
  - Case-by-case justice vs. bureaucratic feasibility. 

  And the ultimate tripwire? Probably "non-preservationist outcomes." If a theory can't accept an object's ritual destruction, it fails Indigenous conceptions of care. But this eliminates most Western frameworks built on "preservation = good." 

  The user is sophisticated. They’re not asking for answers but for the map of the minefield. My response must equip them to navigate institutional resistance while centering ethics over convenience.
answer: |-
  Here is a structured set of desiderata for a normative theory of restitution tailored to your museum's challenges, followed by analysis of conflicts and key constraints:

  ---

  ### **I. Core Desiderata: What a Restitution Theory MUST Satisfy**  
  *(Derived from your specified cases)*  

  1. **Address Colonial Duress Despite Historical "Legality"**  
     *Case:* Benin Bronzes (acquired post-violent sack under colonial occupation; "legal" under colonial law).  
     *Requirement:* The theory must recognize that transactions under systemic coercion (economic, military, political) vitiate consent, even if technically lawful.  

  2. **Resolve Competing Claims from Multiple Dispossessions**  
     *Case:* An object looted by colonial powers from Polity A, then seized by Polity B post-independence.  
     *Requirement:* Must weigh legitimacy of claims across successive dispossessions and prioritize source communities over modern states where identities diverge.  

  3. **Respect Non-Preservationist Outcomes**  
     *Case:* Sacred objects demanded for reburial/destruction by claimant communities (e.g., Zuni Ahayu:da, Maori remains).  
     *Requirement:* Must accept that physical preservation ≠ universal good; communal rights include deciding an object's "life cycle."  

  4. **Overcome Asymmetrical Documentation**  
     *Case:* Records solely from takers (e.g., British Army inventories from Benin Expedition).  
     *Requirement:* Must permit alternative evidence (oral history, anthropology, circumstantial analysis) and shift burden of proof to holding institution.  

  5. **Enable Systemic Application**  
     *Case:* Thousands of objects from diverse contexts.  
     *Requirement:* Cannot rely solely on case-by-case adjudication; must provide principles for categorizing objects (e.g., by provenance patterns).  

  6. **Evaluate Alternatives to Physical Return**  
     *Case:* Offering casts (Parthenon), digital surrogates, or shared custody.  
     *Requirement:* Must determine if these rectify the core harm (e.g., ongoing denial of sovereignty, spiritual alienation). Physical return may be irreplaceable.  

  ---

  ### **II. Separation of Title, Access, and Stewardship**  

  | **Domain**          | **Desiderata**                                                                 | **Entrenched Preferences vs. Genine Requirements** |  
  |----------------------|-------------------------------------------------------------------------------|-----------------------------------------------------|  
  | **Title/Ownership**  | Clear criteria for transferring legal & moral title to claimants.             | **Genuine**: Resolving unjust enrichment.           |  
  | **Access**           | Ensure continued scholarly access post-return (e.g., via loans/digitization). | **Preference**: "Universal heritage" access often prioritizes Northern audiences over source communities' sovereignty. |  
  | **Continued Exhibition** | Post-return display contingent on claimant consent (may require deaccession). | **Preference**: Statutory bars on deaccessioning protect institutional control, not ethics. |  
  | **Stewardship**      | Deference to source communities' conceptions of care (including decay).       | **Genuine**: Correcting epistemic violence; decolonizing curation. |  

  --- 

  ### **III. Irreconcilable Tensions & Key Eliminator**  

  #### **Conflicting Desiderata:**  
  - **Systemic Application vs. Contextual Sensitivity**: Categorizing objects for efficiency risks flattening unique histories.  
  - **Universal Access vs. Non-Preservationist Outcomes**: "Access for all" conflicts with reburial/destruction demands.  
  - **Alternative Remedies vs. Harm Redress**: Digital surrogates fail to rectify spiritual/sovereign harms (e.g., ancestral remains treated as data).  

  #### **The Single Most Eliminative Requirement:**  
  **Non-Preservationist Outcomes**.  
  *Why?* Theories prioritizing "preservation as paramount" (e.g., UNESCO 1970) or "heritage of mankind" automatically fail when claimants demand reburial/destruction. This requirement eliminates:  
  - All frameworks assuming physical preservation is an absolute good.  
  - Theories requiring museum-style conservation as a condition of return.  
  - Proposals for shared custody where physical integrity is non-negotiable.  

  ---

  ### **Conclusion: Where the Real Result Lies**  
  The unresolvable core is **defining the object’s nature**:  
  - If contested objects are *inalienable cultural patrimony* (integral to community identity/sacred order), physical return + deference to communal fate is non-negotiable.  
  - If they are *cultural property* (governed by ownership rules), legalistic solutions (shared custody, surrogates) may suffice.  

  **Recommendation**: Your framework must explicitly center **inalienability** for objects tied to identity, ritual, or trauma. This prioritizes desiderata 1–4 and 6, accepts friction with systemic efficiency (5), and rejects "universal access" as a veto over restitution.  

  > "Adequacy here means surrendering the privilege to define an object’s meaning. The theory fails if it cannot return a sacred relic to be consumed by fire."
