  Kripke's thesis is about the origin of an individual organism. In cloning, the clone originates from a different set of materials—the somatic cell nucleus and the enucleated egg. So the clone isn't the same individual as the donor; it's a new organism with a different origin. Thus, SCNT might not contradict the necessity of origin because the clone has a different origin story. The user might be conflating genetic identity with numerical identity. Kripke is talking about numerical identity—the same entity over possible worlds. Even if genetically identical, the clone is numerically distinct. So SCNT isn't a counterexample; it reinforces that origin is crucial for numerical identity.

