  The user is concerned that the thesis reduces to genetics at fertilization. But Kripke emphasizes the material origin—the specific sperm and egg—not just the genetic content. Genetics might be part of it, but the physical gametes are the origin. Monozygotic twins share the same genetic origin but become different individuals post-split. So the thesis isn't solely about genetics but the specific causal origin.

