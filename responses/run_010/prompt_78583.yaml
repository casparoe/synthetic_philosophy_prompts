    2. **Fractional-Kelly** (half-Kelly staker; robustness-focused).  
    3. **Log-EU** (expected log-utility maximiser; "EU first, growth emerges").  
    4. **Ergodicity** (Peters-style; time-average=rational).  
    5. **EV Maximiser** (unconstrained; "bet the farm").  
    6. **Mean-Variance** (Sharpe-ratio type; variance-averse).  
    7. **Samuelson Objector** (rejects growth-rates for one-off choices).  
    8. **Quietist** ("no normative disagreement; just model ambiguity").  

