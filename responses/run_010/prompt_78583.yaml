  #### Undistinguished Pairs & Handling  
  1. **Full-Kelly vs Ergodicity**: *No behavioural difference* on these items. They always agree. To separate, ask for justification: Ergodicity insists time-average is the *only* rational target; Full-Kelly sees it as a strategy for compounding.  
  2. **Fractional-Kelly vs Mean-Variance**: Only diverge on Q11 (A vs B). If identical, default to Fractional-Kelly unless they cite "variance" in justifications.  
  3. **Quietist vs others**: Always chooses "medium" (B) except Q11 (B). If a student is always B, they’re likely Quietist or undecided.  

  #### Unoccupied Cells & Why  
  - **"Ergodicity maths accepted but no normative force"**: Collapses into **Quietist**. If you accept the maths but deny normativity, you’ll still choose B everywhere (like Quietist) because no alternative is calculable.  
  - **"Log-EU in ruin gambles"**: Log-EU and Full-Kelly agree on Q4/Q5 (both B), but Log-EU flips on Q3 (background wealth).  

  #### If You’re in an Undifferentiated Blob  
  About 30% may cluster as Quietist/Ergodicity/Full-Kelly (all B-heavy). Solution:  
  - Run a debate on **Q11 (collective experiment)**.  
  - **EV Maximisers** (all C) and **Fractional-Kelly** (all A) will stand out.  
  - Use **Q3 (salary hedge)** to isolate Log-EU (only they choose C).  

  ---

  ### Final Notes  
  - **Samuelson’s objection** (geometric mean ≠ rational for finite/one-off) maps to the **Samuelson Objector** leaf. It splits from Full-Kelly on one-off bets (Q2, Q6).  
  - **Mean-Variance** isn’t directly about compounding—it’s variance-averse everywhere (hence mostly A).  
  - **Expected quietist blob**: If half the cohort ends up here, focus discussions on whether normative disagreements reduce to "what’s fixed?" (repetition, reinvestment, ruin).  

  Hand this straight to students—no rewriting needed. Good luck!  

