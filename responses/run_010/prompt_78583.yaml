  ### Scoring Key & Position Mapping  
  **How it works**:  
  - Each option (A, B, C) maps to "low", "medium", or "high" risk appetite relative to the gamble’s dynamics.  
  - Positions are defined by **which features they treat as fixed**: repetition, reinvestment, or ruin risk (absorbing zero).  
