  ### Sorting Quiz: Norms of Choice Under Risk  
  **Instructions:** For each scenario, choose the option that best reflects your decision. Use only the information provided. All coin flips are fair (50/50). Your starting wealth is £1000 unless stated otherwise. There are no trick questions—just pick what feels right.  

  ---

  #### **Question 1: Weekly Gambling**  
  You play a gamble every week for a year (52 weeks). Each week:  
  - **Heads**: You gain 60% of your stake.  
  - **Tails**: You lose 40% of your stake.  
  *What fraction of your current wealth do you stake each week?*  
  - A) 10%  
  - B) 40%  
  - C) 80%  

  *Note: EV per round = +10% of stake; Expected growth rate (EGR) maximised at ~42% stake.*  

  ---

  #### **Question 2: One-Off Gamble**  
  Same gamble as Q1, but you play it **once in your life**.  
  *What fraction of your £1000 do you stake?*  
  - A) 10%  
  - B) 40%  
  - C) 80%  

  *Note: Identical arithmetic to Q1 (EV = +10% stake), but no repetition.*  

  ---

  #### **Question 3: Salary Hedge**  
  You are about to receive a £50,000 salary next week (independent of this gamble). Same one-off gamble as Q2.  
  *What fraction of your £1000 do you stake?*  
  - A) 10%  
  - B) 40%  
  - C) 80%  

  *Note: EV = +10% stake; EGR maximised at 100% if utility is logarithmic (but capped at 80% here).*  

