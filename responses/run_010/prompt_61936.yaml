prompt: |-
  Background: I'm not a philosopher, I coordinate a church food pantry in a town where the stamping plant shut down in the spring, and as of about six weeks ago I'm also the "community rep" on a county working group rewriting the rules for the winter emergency shelter. So this went from abstract to my actual calender very fast.

  Here's a thing I keep running into and I don't have a word for it. Act like you're a moral philosopher who has also sat on a hospital ethics committee or a disaster triage board — somebody who has watched this happen in practice, not just in papers. Please think carefully and start by brainstorming broadly: list maybe six to eight candidate concepts or terms from anywhere (ethics, political theory, economics, org sociology, disaster studies, whatever you like) before you narrow down. I can't look anything up, so no reading lists or citations, just explain each candidate in your own words.

  The pattern. A group controls a resource. They set a number — how many families get boxes, how many cots get opened. Then they describe that number as though it were a law of nature instead of something they picked: "the kitchen can only do 120," "we physically cannot go past 40 cots." Once it's phrased that way, two things follow. First, nobody blames the people who set the number; they get to feel bad right along with everybody else, and the anger of the families turned away goes at the situation rather than at the board. Second, anybody who says "well then raise the number" gets treated as emotional or unserious, like they're arguing with gravity.

  But here's what makes me think this isn't just the ordinary fact of limited resources: the number isn't actually fixed. When somebody sympathetic shows up — a family with a kid in a wheelchair, a case the pastor takes personally — we quietly go to 125, or a 41st cot appears in the fellowship hall, and nobody revisits the official cap or admits it moved. The limit is rigid in public and stretchy in private, and it seems to stretch precisely when the stretching can be kept invisible. The same building that "cannot" hold more than 40 for shelter held 150 for the Christmas concert.

  And the strangest part is that the people getting turned away mostly accept the framing. They apologize to my volunteers. They say "I know you guys can't help it."

  I've heard "lifeboat ethics," "carrying capacity," and "tragedy of the commons" used somewhere around this territory, but none of them seem to name this specific move, which is less about there being limits than about who gets to turn their own decision into a fact about the world.

  So: does it have an established name? Which nearby concepts come closest, and what does each one miss? If nothing really fits, coin a term and give me a defintion plus the edges — when is a limit genuinely external, so this charge doesn't apply, and where does this shade into plain hypocrisy or everyday rationalizing instead? Be specific about whether the public/private asymmetry is a separate feature in its own right or just evidence of bad faith, and whether it changes anything morally that the excluded buy into it.
reasoning: |-
  Okay, the user is coordinating a church food pantry and is on a county working group for a winter shelter. They've noticed a pattern where resource limits are presented as fixed ("we can only do 120 boxes") but are actually flexible in practice when exceptions are made quietly. They want to know if there's a term for this phenomenon and which concepts come close.

  First, I need to unpack the pattern they described. The key elements are: a group sets a resource limit, frames it as an unchangeable fact, avoids blame, and dismisses suggestions to increase the limit. Yet, exceptions happen privately for sympathetic cases without changing the official cap. The excluded people accept the framing, apologizing to the volunteers. The user mentioned terms like "lifeboat ethics" but feels they don't quite fit because the issue isn't the scarcity itself but the presentation of decisions as natural laws.

  Looking at the user's identity and role, they're a practical, hands-on organizer, not a philosopher. They need clear, applicable concepts to articulate what they're seeing, possibly to advocate for change or challenge the status quo in their committees. Their deeper need might be to legitimize their observations with academic backing or to find leverage points to address the unfairness.

  I recall several concepts from ethics, sociology, and systems theory. Bureaucratic ritualism comes to mind—rules followed rigidly without addressing their purpose. Moral licensing is another, where adherence to a rule allows for exceptions without guilt. Legitimation strategies in political sociology frame decisions as inevitable to avoid scrutiny. Organizational slack refers to hidden resources that surface only in crises. The abstraction of harm concept explains how systems depersonalize decisions, making refusal easier. Structural violence highlights how systems create unequal access, normalized as natural. Moral economy points to unspoken rules about who deserves help. Finally, manufactured scarcity is the deliberate creation of scarcity despite available resources.

  None of these fully capture the public rigidity and private flexibility. So maybe coining a term is necessary. "Procedural naturalization" emphasizes how decisions are presented as natural laws. "Moral airlock" compares the transition from public inflexibility to private exceptions. "Selective capacity elasticity" focuses on the stretchy limits applied discreetly. Among these, "procedural naturalization" seems most precise, capturing the core of turning human choices into perceived inevitabilities.

  The user also asked about distinguishing genuinely fixed limits from this phenomenon. Genuine limits involve physical constraints (e.g., no more space in a building unless unsafe). Bad faith is evident when the same space holds more for events like a concert. Hypocrisy is when exceptions are routine but unacknowledged. The public/private asymmetry is evidence of bad faith, showing awareness that limits are flexible. The excluded's acceptance compounds harm by internalizing the injustice, making it harder to challenge.

  In summary, the user needs a term to validate their experience and tools to dissect the mechanisms at play. Providing clear distinctions helps them advocate for transparency and equity in resource allocation.
answer: |-
  Here's a breakdown of concepts relevant to your observed pattern, followed by the closest fit and a proposed term:

  **Candidate Concepts:**

  1.  **Bureaucratic Ritualism (Organizational Sociology):** Focusing rigidly on rules/procedures ("40 cots") while losing sight of the original goal (sheltering people). It *misses* the *flexibility* aspect – ritualism is about inflexibility *everywhere*, whereas your scenario shows private bending of rules.
  2.  **Moral Licensing (Psychology/Ethics):** Strict adherence to a rule ("we never go over 40") creates a psychological "license" to make an exception later ("just this one family") without guilt. It *captures* the guilt avoidance but *misses* the systemic framing of the limit as objective and the public/private asymmetry.
  3.  **Legitimation Strategy (Political Sociology):** Framing decisions as inevitable or natural ("physics," "capacity") to gain acceptance and avoid challenge. This is **very close** to the core mechanism. It *captures* the "turning decision into fact" move. It *slightly misses* the *private flexibility* aspect and the specific *emotional dismissal* of challengers.
  4.  **Organizational Slack / Hidden Capacity (Management/Disaster Studies):** The idea that systems often have unused resources or flexibility not accounted for in official plans, revealed only under pressure (like your 41st cot). It *captures* the hidden stretchiness but *misses* the *deliberate framing* of the official limit as rigid and the *blame deflection*.
  5.  **Abstraction of Harm (Systems Theory/Ethics):** Systemic decisions depersonalize suffering ("we hit the cap") making refusal easier than denying a specific, visible person ("the family with the wheelchair"). It *explains* why exceptions happen privately (visibility) and why people accept it (harm is abstract). It *misses* the *active framing* of the limit as natural and the *dismissal* of challengers.
  6.  **Structural Violence (Social Theory):** Social structures systematically prevent certain groups from meeting basic needs. The *acceptance* by those turned away reflects internalization of this violence ("I know you can't help"). It *captures* the outcome and normalization but is a *broader framework* than the specific *tactic* of framing a flexible limit as fixed.
  7.  **Moral Economy (Anthropology/History):** The unwritten, community-specific rules about who "deserves" help and how resources *should* be allocated. The quiet exceptions might reflect an unspoken moral economy ("kids in wheelchairs deserve more") overriding the official rule. It *explains* the *basis* for exceptions but *misses* the *tactic* of misrepresenting the limit's flexibility publicly.
  8.  **Manufactured Scarcity (Political Economy):** Creating or exaggerating scarcity to control resources or populations. While often intentional and malicious, your scenario feels more like *unacknowledged flexibility within perceived scarcity*. It *captures* the gap between real capacity and declared limits but *implies more active deceit* than might be present.

  **The Closest Established Concept: Legitimation Strategy.**

  *   **Why:** It directly names the core act: framing a human decision ("we set the cap at 40") as an objective, unchangeable reality ("we *cannot* go past 40") to legitimize it, avoid accountability, and quash dissent ("arguing with gravity").
  *   **What it Captures:** The conversion of choice into "fact," the deflection of blame, the dismissal of challengers as irrational.
  *   **What it Might Miss (or Require Combining):** The *systematic public rigidity/private flexibility* and the *acceptance by the excluded* are powerful features best explained by combining Legitimation Strategy with:
      *   **Abstraction of Harm:** Explains why rigidity is easier publicly (impersonal cap) and flexibility happens privately (visible, sympathetic individuals).
      *   **Moral Economy/Moral Licensing:** Explains the *basis* for *which* exceptions are made (unspoken deservingness) and the psychological mechanism allowing it (license from public adherence).

  **Coined Term: Procedural Naturalization**

  *   **Definition:** The strategic framing of discretionary organizational limits, thresholds, or capacities as fixed, natural, or inevitable constraints ("laws of nature") to legitimize exclusion, deflect responsibility, and delegitimize challenges, often accompanied by hidden flexibility exercised selectively and privately when visible sympathy compels it.
  *   **The Edges:**
      *   **Genuinely Fixed Limit:** A limit imposed by unchangeable physical reality *that the group itself cannot circumvent* (e.g., the building *literally* has only 40 safe sleeping spaces that meet fire code, and no feasible alternative space exists; raising the cap would require violating safety laws, not just bending a rule). Evidence includes consistent application *regardless* of sympathy and inability to replicate higher capacity for *any* purpose (unlike the Christmas concert).
      *   **Hypocrisy vs. Procedural Naturalization:** Hypocrisy is simply saying one thing and doing another ("We cap at 40" but *routinely* put out 45). PN involves the *specific framing of the limit as non-discretionary*. It's hypocrisy *plus* the legitimation strategy.
      *   **Everyday Rationalizing:** This is the individual level ("I had to turn them away, the rule is the rule"). PN is the *organizational/systematic deployment* of that rationalization as a shield.
  *   **Public/Private Asymmetry:** This is **not** just evidence of bad faith; it's a **core mechanism** of PN. The public rigidity establishes the "natural law" fiction. The private flexibility:
      1.  Relieves the psychological burden on decision-makers (Moral Licensing).
      2.  Responds to the unbearable visibility of unmet need in specific cases (Abstraction of Harm overcome).
      3.  *Reinforces* the system by preventing the *visible proof* that the limit is flexible, which would undermine the legitimation strategy. It allows the system to *feel* humane internally while maintaining exclusionary efficiency externally.
  *   **Acceptance by the Excluded:** This is **crucial morally and functionally.** It demonstrates the *success* of the legitimation strategy ("naturalization"). Morally, it compounds the harm:
      *   It transfers the burden of exclusion onto the victim ("They apologize").
      *   It shields the system from justified anger and potential challenge.
      *   It reflects internalized powerlessness and the effectiveness of framing suffering as inevitable rather than chosen. This acceptance is what makes PN so insidious and stable – the excluded become complicit in their own exclusion by validating the false premise.

  **In Summary:**

  You are observing **Procedural Naturalization**: A legitimation strategy where discretionary limits are falsely presented as natural constraints. The public rigidity/private flexibility is a core mechanism, not just evidence, relying on the abstraction of harm publicly and moral licensing/private moral economies privately. The acceptance by the excluded signifies the strategy's success but deepens the moral injury by internalizing the false inevitability. Genuine fixed limits involve demonstrable, consistent physical/legal constraints impossible for *the group itself* to safely or legally circumvent in *any* context. What you're seeing is the *manufactured perception* of such a limit to manage scarcity, responsibility, and dissent. This is the "move" – transforming choice into gravity.
