prompt: |-
  I sit on a three-person committee at a regional housing-assistance nonprofit — about forty staff, an intake line, an after-hours distress line, and a state funder that wants paperwork on time. We have been asked to produce a one-page rule for when a software system may act in the organization's name rather than merely assist a person who then acts. Everyone on the committee keeps gesturing at the difference between a tool and an agent, but nobody can say what that difference amounts to once the tool is fast, cheap, and usually right; the former public defender on the committee insists the answer is obvious and will not say what it is, and our board wants the policy in March. So I did the thing I always do when a distinction feels slippery: I wrote down cases and marked them by gut, and now I want to know what principle, if any, my marks add up to.

  Here they are, with my verdicts. (1) The system drafts a reply to a routine enquiry and a caseworker reads it and presses send: pass, trivially. (2) It sends those same replies with nobody reading them, but each one sits in an outbox for ten minutes and any staff member can recall it inside that window, and recall has worked every time we tested it: pass. (3) It prepares and submits our annual return to the state funder under the executive director's digital signature with no human looking at it first; if a figure is wrong we may file an amended return within ninety days and we have never once missed that window: fail — and I cannot explain why, since the correction path here is far more reliable than in (2). (4) It places orders with our approved supply vendor up to a fixed cap each, logging every order in a ledger the office manager reads each Friday: pass. (5) It negotiates a lease renewal with our landlord's own negotiating system, whatever the two of them settle on binds us, and no one sees the exchange until after both sides have committed: fail. (6) Exactly (5), except that the full transcript is retained and a named human may void the deal within forty-eight hours, for any reason or none: pass, though uneasily. (7) It runs after-hours scheduling — reassigning shifts, approving swaps, calling in substitutes — inside rules the supervisors set, and any supervisor can undo an assignment up to the moment the shift begins: pass. (8) It answers the distress line at night and speaks warmly in the first person, staying on the line with a caller in crisis, without ever saying that it is not a person, though callers never ask: fail. (9) Identical to (8) except that the call opens with a plain statement that the caller is speaking with software: pass. (10) It deletes files it has classified as duplicates, keeping a thirty-day recovery bin that has never failed a request: pass. (11) It deletes messages it has classified as spam, permanently, at an error rate under one in ten thousand: fail, even though the harm to any single person is smaller than the worst case in (10). And the one I keep flipping on: it sends a condolence note in the director's name from a template a human approved, with no human looking at the particular instance — the name, the dates, the cause of death. Some mornings that passes for me and some mornings it doesn't.

  My tentative principle is that a system may act for us without a person in the loop if and only if (i) every act it performs can be undone by a named human within a stated window, and (ii) any outsider who might take the act for a person's doing is told, at the time, that it is not. Case (3) appears to satisfy both — the funder's portal records that the filing came from software, and the ninety-day amendment window is real — and I still fail it. Case (6) satisfies (i) only barely, since voiding a deal is not the same as never having been bound by it, and for two days we are bound; I pass it anyway. So either the principle is wrong or my marks are.

  What I want back: a principle, or the smallest set of competing candidates, stated precisely enough that a stranger could apply it to a case I have never described, with each clause tied to the case that motivates it. Then tell me plainly which of my marks it cannot accommodate — and if it faces the choice between saving all of them with additional machinery and overturning one or two with a clean rule, say which it recommends and what turns on that choice. Apply the result to four situations I did not list: a triage system that decides which intake callers reach a human today and which are offered an appointment next week, where the ranking is shown to no one and callers are not told they were ranked; a system that refuses to carry out a supervisor's instruction because it judges the instruction unlawful; two of our own systems bargaining over an internal reallocation of budget between programs, with no outside party anywhere in the loop; and an emergency in which no human is reachable and the system acts, irreversibly, to stop a client's eviction being executed the next morning. Finally, two questions I cannot settle on my own: do (2) and (3) differ in kind or only in degree — is there something about attesting to a fact in someone's name that is not simply a species of hard-to-reverse commitment, or am I mystifying a signature? — and does the distinction I am circling live in the system, in the act, or in the relationship with whoever is on the receiving end? I suspect the third, but I have no argument for it. I am after the reasoning, not the sources, so please do not spend words on references or further reading.
reasoning: |-
  Hmm, the user is part of a three-person committee at a housing nonprofit trying to create a policy for when software can act autonomously. They've developed several test cases with their intuitive judgments but can't find a consistent principle. Their gut reactions seem to conflict with their own proposed rule about human override and disclosure.

  Looking at their cases, I notice some patterns. They're uncomfortable when systems make irreversible commitments (like in case 5) or when they simulate human presence without disclosure (case 8). But interestingly, they accept similar actions when there's either an override mechanism (case 6) or clear disclosure (case 9). The annual reporting case (3) puzzles them because it has both disclosure and correction options yet still feels wrong.

  The key tension appears between reversibility and representation. When systems act as representatives (signing documents, negotiating deals, expressing condolences), the user wants tighter control even if errors are technically fixable later. There's also an ethical dimension when systems might deceive people about their nature, as with the distress line.

  For the new scenarios, I need to consider how these principles apply. The triage system that ranks callers secretly would violate the disclosure principle. A system refusing an unlawful order raises questions about authority boundaries. Internal budget bargaining between systems seems acceptable if reversible and disclosed to stakeholders. The emergency eviction case forces us to weigh harm prevention against autonomy limits.

  The signature question reveals a core insight: some actions carry inherent personal accountability that can't be fully delegated, even with error correction. The difference between case 2 and 3 isn't just reversibility but the nature of attestation - signing implies personal judgment in a way that sending routine replies doesn't. Ultimately, the relationship with the recipient matters most because that's where trust and expectations are formed.
answer: |-
  Here's a principle distilled from your judgments, designed to be operational, precise, and grounded in your case markings:

  **Principle:** A software system may act in the organization's name autonomously **if and only if**:
  1.  **Reversibility:** Any external commitment or material consequence of the act can be *fully nullified* (returning all parties to the pre-act state) by a named human within a defined, reliable, and practically usable window *before significant reliance occurs*, AND
  2.  **Transparency:** Any external party reasonably interpreting the act as originating from human judgment or authority is *explicitly informed at the point of interaction* that the act is being performed autonomously by software, AND
  3.  **Non-Personhood:** The act does not simulate human presence, emotion, or relationship-building in a way that could reasonably deceive an external party about the nature of the entity performing the act.

  **Motivation for Clauses:**
  *   **Clause 1 (Reversibility):** Motivated by **Case 5 (Fail)** vs. **Case 6 (Pass)**. A 48-hour void window (even if technically binding temporarily) allows nullification *before* significant reliance (e.g., moving funds, scheduling work). Case 3 (Fail) lacks true nullification; an amended return corrects an error but doesn't undo the *act* of filing (the initial attestation stands, potentially with reputational/legal consequences). Case 10 (Pass) has full reversibility (undelete). Case 11 (Fail) lacks reversibility (permanent deletion). Case 7 (Pass) allows undoing *before* the shift starts (reliance).
  *   **Clause 2 (Transparency):** Motivated by **Case 8 (Fail)** vs. **Case 9 (Pass)** and **Case 3 (Fail)**. Even if the funder's portal records it later (Case 3), the *act of submission itself* under the ED's signature implies human authority *at the moment it's received*. The recipient needs contemporaneous awareness. Case 4 (Pass) likely involves orders clearly from the system or a system-managed account, not mimicking a person's order. Case 2 (Pass) involves communication that may implicitly be from the system or is routine enough not to imply specific human judgment at send time.
  *   **Clause 3 (Non-Personhood):** Motivated by **Case 8 (Fail)**. Simulating warmth and first-person presence without disclosure exploits human social expectations for trust-building in a crisis context, which is ethically distinct from functional acts like sending emails or placing orders. Case 9 (Pass) avoids this deception. This clause strengthens Clause 2 for sensitive interactions.

  **Inconsistencies with Your Marks & Resolution:**
  *   **Case 2 (Pass):** Complies. Reversibility (recall) exists pre-reliance. Transparency: Routine replies don't strongly imply specific human judgment *at send time* (especially with recall), or are implicitly/system-sent. Non-Personhood: Functional communication.
  *   **Case 3 (Fail):** **Violates Clause 2 (Transparency).** Submitting a formal attestation under the ED's signature *is* an act implying human judgment and authority *at the moment of receipt*. The funder knowing it *came from software* via a portal log is not the same as the *act itself* being transparently presented *as autonomous* when submitted. Amendment corrects errors (Clause 1) but doesn't nullify the initial act of attestation. **Overturning this mark is recommended.** The principle prioritizes the nature of the act and its recipient's perception over the technical possibility of later correction. Signing/filing is a distinct act of attestation.
  *   **Case 6 (Pass):** Complies *barely*. Clause 1: Voiding within 48hrs *is* full nullification (parties restored), assuming no significant reliance occurred in that window (e.g., no payments made, no irreversible actions taken based on the deal). Clause 2: The landlord knows they are negotiating with software (implied by "their own negotiating system"). Clause 3: Negotiation is functional, not simulating emotional rapport.
  *   **Case 11 (Fail):** Complies. **Overturning this mark is recommended.** Clause 1: Permanent deletion lacks reversibility. Error rate is irrelevant; the *capability* for nullification is required. The harm being small doesn't negate the principle. Case 10 (Pass) has reversibility.

  **Condolence Note:** Under this principle, it **fails Clause 2 (Transparency)**. Sending a deeply personal message *in the Director's name* implies the Director personally sent/sanctioned *this specific note*. The recipient reasonably interprets it as an act of human empathy and authority. Lack of transparency about automation violates Clause 2. Template approval doesn't suffice.

  **Applying to New Situations:**
  1.  **Triage System (Ranks secretly, no disclosure):**
      *   **Verdict:** **Fail.** Violates **Clause 2 (Transparency)**. The caller is directly affected by a decision implying human judgment ("who gets help today"). They are not informed the decision is autonomous. Reversibility (Clause 1) might be possible (override), but lack of transparency fails it.

  2.  **Refuses Unlawful Supervisor Instruction:**
      *   **Verdict:** **Pass (if configured as a constraint).** This is less "acting autonomously" and more "enforcing a pre-defined organizational boundary." It prevents an *invalid* act from occurring in the org's name. No *new* external commitment is made. Transparency/Non-Personhood are internal. (If it publicly *explained* the refusal autonomously, Clause 2 would apply).

  3.  **Internal Budget Bargaining (Two Systems):**
      *   **Verdict:** **Pass (with conditions).** Assuming:
          *   Clause 1: Humans (e.g., ED, Board) can fully reverse/override the reallocation before implementation.
          *   Clause 2: Relevant *internal* stakeholders (program managers, finance) are informed the allocation was autonomously negotiated.
          *   Clause 3: Not simulating human interaction internally.
      *   *Without* internal stakeholder transparency, it would fail Clause 2.

  4.  **Emergency Eviction Stop (Irreversible, No Human):**
      *   **Verdict:** **Fail (under this policy), but requires a defined exception process.** This highlights the policy's limits. The principle forbids it (irreversible + potentially lacks transparency to court/sheriff/client). However, such emergencies necessitate a separate, pre-authorized "emergency intervention protocol" with extremely narrow triggers (imminent severe harm, *truly* unreachable humans), clear authority limits, and mandatory post-hoc human review/justification. It's an exception, not routine autonomy.

  **Answers to Your Core Questions:**

  1.  **Case 2 vs. Case 3 (Kind vs. Degree/Mystification):**
      *   **Difference in Kind:** Attesting to facts under one's signature (Case 3) is fundamentally an act of **personal accountability and judgment** that cannot be fully delegated, even with correction. An amended return fixes an error but doesn't retract the initial attestation that *"I, the ED, confirm this is true and complete to the best of my knowledge *at this time*."* The signature signifies *that moment of personal assurance*. Case 2 (sending a routine reply) is **functional communication**, not a personal attestation. The reversibility window *before* reliance is sufficient for functional acts, but insufficient for acts of personal authority/accountability. **It's not mystification; it's the inherent meaning of a signature/formal attestation.**

  2.  **Where the Distinction Lives (System, Act, Relationship):**
      *   **Primarily in the Relationship with the Recipient.** The key factor is **how the recipient reasonably interprets the act and attributes responsibility/authority**. Does the act appear, at the moment it impacts them, to be an exercise of human judgment, authority, or personal connection? (Case 3: Yes - signature implies ED's judgment; Case 8: Yes - emotional support implies human; Case 5/6: Yes - binding commitment implies authorized agent; Case 4: Less so - ordering supplies). The *Act* defines the nature of the interaction (attestation, commitment, emotional support, functional task). The *System* enables it, but the *Relationship/Impact* determines the need for transparency and the limits of delegation. The principle focuses on the recipient's perspective at the moment of the act.

  This principle prioritizes accountability (via reversibility *before* reliance), honesty (transparency about automation), and avoiding deception (non-personhood) in how the organization presents itself to the world through its automated actions. It overturns your mark on Case 3 (signature) and Case 11 (deletion), saving the others while explaining the unease in Case 6 and resolving the condolence note.
