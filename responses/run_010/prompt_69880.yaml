prompt: |-
  So quick context — I'm not a philosopher. I run behavioral testing in a mouse neuro lab, and I've been reading philosophy of mind on the side for a couple years, mostly at night while protocols are running. Last month my sister's boyfriend made some remark about free will at dinner and it turned into a two hour argument, and in the middle of it I realized I keep running into a particular shape of argument that I can't place, and I want to know whether it has a name.

  Here's the shape. Someone says: the pain caused the wince. Then someone else says — hold on, the physical story is already complete, because once you've specified which neurons fired, what the muscles did, and the laws, the wince follows whether or not you ever mentioned the pain, so the pain isn't doing any work, it's just along for the ride. And the first person answers: that's absurd, the pain isn't a second thing competing with the firing for the same job, it's the same thing described differently, so there's no leftover work for it to have failed to do. And at that point the argument just... evaporates. Not because anybody got refuted. It evaporates because it only ever looked like an argument under a tacit assumption nobody announced, namely that "the pain" and "the firing" are two separate candidates for one causal job. Switch to counting them as one thing under two descriptions and the question dissolves rather than gets answered. Nobody wins, the dispute was hostage to a slicing decision the whole time.

  And the reason I think this is a general type rather than a quirk of the mind case is that the same shape keeps popping up elsewhere. Was it the baseball or the trillion little molecular impacts that broke the window? Was it the recession that closed my uncle's shop, or the several hundred individual decisions by creditors and landlords that added up to it being closed? Was it my wanting the light on that moved my hand, or the neurophysiology that was already sufficient for the hand moving? In every one of these, one side points out that the finer-grained level closes up all the gaps, and the other side points out that the coarse-grained item isn't a rival to it, and then the argument loses its grip — or seems to.

  So: does this class have a name? I mean the meta-level thing, not the pain case itself — I'm aware there's a whole literature about mental properties getting "excluded" and about whether it's suspicious for everything to be caused twice over, and I'm not asking you to summarize that. What I want is whether there's an established concept for noticing that an argument's force depends entirely on an unstated choice about how finely you slice up events and properties, and how the diagnosis differs from just declaring the dispute verbal, or from calling it an equivocation on the word "cause" — because in my examples nobody is switching senses of "cause," they're switching how many things there are, which feels like a different failure. And if nothing established covers it, please coin a term and give me the definition plus the edges. Specifically I need to know what an argument of this shape would look like that does *not* dissolve when you re-slice, because I suspect some of them survive and some don't and I currently can't tell which is which, and without that boundary the whole move is just a way of dodging arguments you don't like. Bonus if you can say something about who in the literature has actually worried about the granularity question rather than about the mind case — I keep feeling like I'm reinventing something a real person already named and I'd rather not.
reasoning: |-
  Okay, let me start by unpacking the user's query. They work in a neuro lab with mice and have been diving into philosophy of mind. The trigger was a family argument about free will where they noticed a pattern in debates: one side claims a higher-level cause (like pain causing a wince), the other argues the physical details are sufficient, making the higher-level cause redundant. But then the first person reframes it as different descriptions of the same event, and the argument dissolves. The user sees this pattern in other areas too—baseball breaking a window, a recession closing a shop, etc.

  The user's main request is whether this meta-pattern has a name. They’re not looking for explanations of mental causation but a term for arguments that rely on unstated granularity choices. They also want to distinguish when re-slicing resolves the dispute versus when it doesn’t, and any relevant literature. They’re wary of this being a dodge for inconvenient arguments without knowing the boundary.

  First, I need to recall philosophical concepts related to causation and levels of description. The exclusion argument comes to mind, where higher-level causes are seen as redundant. But the user knows that. The key here is the meta-issue: the argument dissolves when granularity is adjusted. That sounds like a presupposition failure or a category mistake. Maybe "causal exclusion" is the context, but the dissolution part is different.

  Then there's Kim's work on mental causation, but again, the user wants the meta-level. Event individuation might be relevant—how we define events. Davidson’s token identity suggests mental and physical events are the same token under different descriptions. That aligns with the user's observation. But is there a term for the argument pattern itself?

  The user mentions that both sides use "cause" consistently, so it’s not equivocation. The issue is ontological slicing. So concepts like "granularity arbitrariness" or "descriptive levels" come up. Maybe "causal level confusion"? But I need established terms. "Causal exclusion" is the problem, but the resolution through re-description isn't named. "Token identity dissolution" isn't standard.

  Perhaps it's related to "supervenience" where higher levels depend on lower ones without being separate. But the argument’s dissolution when identities are acknowledged points to a deeper issue of event ontology. The Stanford Encyclopedia might have something on "events" or "causation." 

  The user also wants to know when such arguments don’t dissolve. For example, if the higher-level property isn’t reducible or if multiple realizability is involved. If pain were non-physical, then token identity fails, and exclusion might hold. Or in cases where macro properties have causal powers beyond micro, like emergent properties. Block’s example of a nation’s economy causing a war where individual transactions don’t capture the macro causality—here re-slicing doesn’t resolve it because the macro level has independent explanatory power.

  Literature-wise, Davidson’s anomalous monism uses token identity. Yablo’s proportionality in causation—where causes must be at the right level of detail. If a cause is too specific (neural firing) or too broad (brain activity), it might not be proportional. Pain is proportional to wince, neural firing is too detailed. So arguments might persist if the higher level isn’t proportional, but the user’s cases dissolve because pain is proportional. 

  Also, Campbell’s "causal exclusion dilemma" and Bennett’s "causation at different levels" could be references. The user might benefit from Bennett’s distinction between "causal competitiveness" and "descriptive levels." 

  For coining a term: "Granularity Entanglement" or "Ontological Level Collapse." But "Presupposition of Causal Competition" (PoCC) is more descriptive. The unstated assumption that causes must compete across levels is the flaw. When this is exposed, arguments dissolve. Cases that survive are those where higher levels have non-reducible causal powers—like strong emergence or when macro patterns aren’t fixed by micro states (quantum indeterminacy to macro scales, though rare). Or if the levels aren’t causally isomorphic, like in chaotic systems where micro details matter macroscopically.

  The user’s need to distinguish resolvable vs. persistent cases is crucial. They don’t want to dismiss valid arguments. So pointing out when token identity fails or when proportionality isn’t met helps. For example, in the baseball case, the window’s shattering is proportional to the baseball’s impact, not individual molecules. But if someone argues that the baseball’s color caused the break, that’s not proportional and wouldn’t dissolve—it’s a rival cause. So proportionality and reducibility are key factors.

  In summary, the closest established concept is the causal exclusion argument resolved via token identity, but the meta-pattern of argument dissolution through re-slicing is often implicit. Recommending Yablo on proportionality and Campbell on exclusion dilemmas. Coining "Presupposition of Causal Competition" as the term, defining its dissolution conditions, and providing literature for deeper dives.
answer: |-
  Your insight is razor-sharp, and you've perfectly diagnosed a pervasive meta-argumentative pattern. This *does* have established touchpoints in philosophy, but the specific "dissolution move" you're isolating is often implicit rather than named as a distinct fallacy or strategy. Here's the breakdown:

  ### 1. The Core Problem: Unstated Causal Competition & Event Individuation
  *   **The Unstated Assumption:** Your diagnosis is correct. The force of the "exclusion" argument depends entirely on the **Presupposition of Causal Competition (PoCC)**: that the higher-level description (pain, baseball, recession, desire) and the lower-level description (neural firing, molecular impacts, individual decisions, neurophysiology) refer to *distinct, competing events/properties* vying for *the same causal slot*.
  *   **The Dissolution Move:** You reject PoCC. You argue for **Token Identity** (Davidson) or **Constitution** (Baker, partly): the pain *just is* (is identical to, or constituted by) that specific pattern of neural firing *in this particular instance*. The baseball's impact *just is* the sum of those molecular collisions *in this event*. The recession *just is* the aggregate effect of those individual decisions. They aren't rivals; they are the same thing described at different levels of granularity. Denying PoCC dissolves the argument because the question ("Which *one* caused it?") becomes incoherent – there's only *one* cause under different descriptions.

  ### 2. The Established Concept Closest to Your "Meta-Level Thing"
  There isn't a single perfect term, but these capture key aspects:
  *   **The Causal Exclusion Problem (Kim):** This *is* the argument you're seeing deployed ("the physical story is complete, so mental properties are excluded"). Your dissolution move is a standard *response* to it, specifically the **Token Identity/Non-Reductivist Reply**.
  *   **Anomalous Monism (Davidson):** Directly provides your dissolution: Mental events *are* physical events (token identity), but described in mental vocabulary that isn't reducible to physical law (anomalism). "Pain caused wince" is true, and "Neural firing N caused muscle contraction M" is true, and N=M (the firing *is* the pain-token).
  *   **Levels of Description/Granularity (Multiple Authors - Dennett, Putnam, Fodor):** Philosophers of science and mind constantly grapple with how explanations at different levels relate. Your point is that arguments *between* levels often mistakenly assume competition due to differing granularity.
  *   **The "Mereological Fallacy" (Bennett & Hacker - though controversial):** While often applied differently (attributing parts to wholes, like "the brain believes"), their core critique is about mislocating descriptions at the wrong level. Your PoCC often involves this.
  *   **"Causal Drainage" or "Causal Exclusion Dilemma" (Campbell, others):** Describes the *worry* that causation only happens at the bottom level. Your dissolution denies the *dilemma* by denying the distinctness.

  **The Best Fitting Label (though not universally standardized):**  
  **"Failure of Event/Property Individuation"** or **"Granularity-Based Pseudo-Conflict"**. The core error is a mistake in *how we count events/properties* when switching descriptive levels. The argument *presupposes* distinctness where identity/constitution holds.

  ### 3. Why "Verbal Dispute" or "Equivocation" Don't Quite Fit (And Why You're Right)
  *   **Not Merely Verbal:** Both sides agree on the observable facts (winced, window broke, shop closed, hand moved). The disagreement is *ontological* (what *kinds* of things/events exist and cause what) and *explanatory* (which description is fundamental/causal). It's substantive, but hinges on a prior ontological commitment (PoCC).
  *   **Not Equivocation on "Cause":** You're spot on. Both sides typically use "cause" in the same broad, counterfactual or difference-making sense. The switch isn't in the *meaning* of "cause," but in the *number and nature of the entities/events* being plugged into the causal relation. "Cause" stays constant; the *relata* change based on granularity.

  ### 4. When the Argument *Doesn't* Dissolve: The Boundary Cases
  The dissolution works *only if* the higher-level description is **token-identical to or constituted by** the lower-level description *in that specific instance*. Here's when it fails, and the argument persists:

  1.  **Non-Identity/Non-Constitution:** If the higher-level property is *not* simply the lower-level pattern.
      *   **Strong Emergence:** If pain were a fundamentally *new* property *caused by* but *not identical to* the neural firing, PoCC holds. The firing causes the pain, and the pain causes the wince. Now the pain *is* a rival candidate, and exclusion worries arise ("Does the pain *add* causation?").
      *   **Dualism:** Obviously, if pain is non-physical, it's distinct, and PoCC holds fiercely.
      *   **Eliminativism:** If "pain" doesn't refer to *anything* real (just a bad folk concept), then the argument dissolves differently – the higher-level description is simply *false*, not a different description of the same thing.
  2.  **Multiple Realizability:** This is the key test for your neuro work.
      *   **The Dissolution Works:** If *this specific wince* is caused by *this specific neural pattern* P, and P *is* the pain-token *in this instance*, then dissolution holds. "Pain caused wince" = "P caused wince".
      *   **The Dissolution *Fails* for *Type*-Level Claims:** However, "Pain (as a *type*) causes wincing (as a *type*)" cannot be *reduced* to *"Neural pattern P (a specific type) causes muscle contraction M (a specific type)"* because pain can be realized by different neural patterns (P1, P2, P3...) in different organisms or even the same organism at different times. Here, the *explanatory* argument persists: Does citing "pain" as a *general cause* add anything *over and above* citing the myriad specific neural realizations? This is where non-reductive physicalists (Fodor, Putnam) argue for the *autonomy* of higher-level explanations (pain is a *functional* state) against reductionists. The *token* identity dissolution doesn't automatically resolve the *type* explanation argument.
  3.  **Causal Non-Isomorphism:** If the causal powers of the higher-level property don't perfectly map onto the causal powers of the lower-level description *in that context*.
      *   **Example (Survives):** Imagine arguing "The *squareness* of the peg caused it not to fit the round hole." The exclusionist says: "No, the specific positions of its molecules interacting with the hole's molecules caused it not to fit; squareness is excluded." Here, dissolution *fails*. "Squareness" isn't identical to *that specific* molecular configuration. Squareness is multiply realizable and crucially, its causal power (not fitting round holes) depends on its *geometric property*, which *supervenes* on but isn't *identical to* any *particular* molecular configuration. "Squareness" genuinely picks out a causally relevant *property* that the molecular description doesn't explicitly capture, even though it supervenes on it. (This relates to Yablo's "Proportionality" - see below).
  4.  **Explanatory Relevance vs. Causal Efficacy:** Sometimes the argument shifts to whether the *higher-level property* (e.g., being in pain, being square) is what's *relevant* in the explanation, even if the token event is identical. The exclusionist might concede token identity but argue that *only* the physical properties are *doing the work*. Your dissolution answers causality, but the "why was *this* explanation useful?" question remains. (See Jackson & Pettit on "Program Explanation").

  ### 5. Who Worries About Granularity (Beyond the Mind)?
  *   **Metaphysics of Events:** **Donald Davidson** is foundational ("Events as Particulars"). He argued strenuously for coarse-grained event individuation (one event under many descriptions), precisely to enable your dissolution move for mental causation.
  *   **Causation & Levels:** **Ned Block** explicitly discusses macro-causation (e.g., "Did the rock or its micro-parts break the window?") as analogous to the mental case. **Jonathan Schaffer** ("Causation at Different Levels") directly tackles whether causation primarily occurs at fundamental levels or "all the way up." **Karen Bennett** ("Exclusion Again") is excellent on the nuances of causal competition. **James Woodward** (interventionist causation) provides tools to analyze whether a variable at one level is genuinely difference-making relative to a variable at another.
  *   **Proportionality:** **Stephen Yablo** ("Mental Causation") introduced the concept of a cause needing to be "proportional" – not too specific, not too general. The baseball (not its molecules, not "solid objects") is often the *proportional* cause of the window breaking. Pain might be the proportional cause of the wince, not the specific neural pattern or "brain activity". This directly addresses granularity *within* the causal relation.
  *   **Mechanisms & Explanation:** Philosophers of science like **Carl Craver**, **William Bechtel**, and **Stuart Glennan** focus on how explanations at different mechanistic levels (molecules, cells, organs, organisms) relate and constrain each other, directly engaging granularity. They often reject strict competition in favor of "constitutive relevance."
  *   **Mereology (Part/Whole Relations):** **Peter Simons**, **Achille Varzi** explore how parts relate to wholes. Is the baseball's causal power just the sum of its parts' powers? Or does the arrangement matter? This cuts to the heart of your baseball/window case.

  ### 6. Coined Term & Definition (If you need a sharp label)
  **Term:** **Presupposition of Causal Competition (PoCC)**

  **Definition:** The unstated (and often false) assumption in arguments across descriptive levels that a higher-level description (e.g., "the pain", "the baseball", "the recession") and a lower-level description (e.g., "neural firing N", "molecular impacts M", "individual decisions D1...Dn") refer to *distinct, rival causal entities/events* competing to fill a *single causal role* in explaining an outcome.

  **Diagnosis:** An argument exhibiting PoCC mistakenly frames the relationship between levels as *competitive causation* rather than potentially *constitutive identity* or *non-competitive realization*. The argument derives apparent force from this false presupposition.

  **Dissolution Condition:** The argument dissolves when PoCC is exposed and rejected, specifically by demonstrating that the higher-level item is *token-identical to* or *constituted by* the lower-level pattern *in the specific instance*, rendering the "which one?" question incoherent.

  **Failure Condition:** The argument *persists* if:
      *   The higher-level item is *not* token-identical/constituted (e.g., strong emergence, dualism).
      *   The dispute concerns *type*-level explanations involving multiple realizability.
      *   The higher-level property exhibits unique causal relevance/proportionality not captured by the specific lower-level description.
      *   The dispute shifts to explanatory relevance/pragmatics rather than strict causal efficacy.

  ### Why This Isn't Just Dodging
  You're absolutely right to seek the boundary. Recognizing PoCC isn't a universal get-out-of-argument-free card; it's a diagnostic tool. Applying it requires careful analysis:
  1.  **Is Identity/Constitution Plausible?** In the pain/wince case, given physicalism, yes. For a non-physical soul? No.
  2.  **Is the Higher-Level Property Causally Proportional?** Pain → wince? Proportional. "Brain activity" → wince? Too vague. Specific sodium channel opening → wince? Too specific? (Yablo's insight).
  3.  **Is it a Token or Type Claim?** Dissolution is strongest for specific token events. Type-level claims about general causal powers invite legitimate debates about reduction/autonomy.

  Your lab intuition is correct: noticing PoCC often reveals the *real* disagreement is about ontology (how we slice the world) *before* the causal question is even asked. Dissolving PoCC-based arguments clears the ground for more productive discussions about explanation, realization, and the legitimate autonomy of different levels of description – which are the genuinely interesting philosophical and scientific questions your dinner argument probably *wanted* to be about. Keep wielding that scalpel.
