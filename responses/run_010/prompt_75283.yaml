prompt: |-
  I am in the third year of a doctorate, and my corpus is a small and rather ugly one: a handful of narrative sources, two notarial registers, a communal statute book, one funerary inscription, and a fifteenth-century epitome of a lost partisan history, all bearing on a disputed succession in a northern Italian commune in the 1340s. My methods seminar this term has run from Herodotus and Thucydides to present-day debates about testimony, and I have been doing something I half suspect is naive. I built a spreadsheet in which every report is scored for the author's access, his partisanship, and his independence from the other witnesses, and the resulting aggregate determines how much weight the report carries. The spreadsheet keeps outputting verdicts I find unacceptable, so I have gone back to my own judgments case by case and written them down. One thing from the seminar is stuck in my head and may be relevant: a classmate argues the whole enterprise is confused, because the ancient historian everyone treats as the paradigm of rigor tells his readers outright that he composed the speeches himself, rendering what the situation seemed to call for rather than what was said, and Herodotus's famous disclaimer — that recording what he is told is his business, while believing it is none of his business — is on this reading not a modest confession but a device for buying the reader's trust. If she is right, the disclaimers that make a source feel honest are the very features that should make us suspicious of it. I have not been able to decide whether I believe her.

  Here are my verdicts.

  1. Two chronicles narrate the same siege in strikingly similar language, and the later author demonstrably owned a copy of the earlier one. This is a single testimony, not two: the second adds nothing, however exactly it agrees.
  2. Two chronicles narrate the same siege, one plainly using the other for the outline, but each preserves an incidental particular the other lacks — one names the engineer who built the siege tower, the other gives the price of bread inside the walls. Here the pair is worth noticeably more than one witness, though not twice as much.
  3. A chronicler reports a rout suffered by his own faction, including the fact that its commander fled first. Strongly credible; among the best evidence I have.
  4. A different author prefaces his work with a long confession of his own past political errors and goes on reporting things that damage his own reputation. Not more credible at all, and possibly less. Once I see the confession as self-presentation, the fact that he says unflattering things about himself stops counting in his favor.
  5. The inscription erected by the winning party to catalogue its own achievements: I do not discard it, but I use it only for what it gives away incidentally — the names of offices, the fact and rough date of the conflict — and not for its central claim.
  6. An otherwise dependable author's troop numbers: I throw out the numbers and keep the battle.
  7. Silences differ. A contemporary who wrote at length about the commune, had every occasion to mention a certain decree, and never does: I take that silence as genuine evidence against the decree. A fragmentary register that happens not to mention it: no evidence either way. The epitome that does not mention it: also no evidence — but I cannot articulate what separates the epitome from the complete contemporary, beyond the vague thought that the epitomator was cutting for length and had no opinion about the decree at all.
  8. A tradition first committed to writing two centuries after the events, which nevertheless preserves a verse line whose metre and diction belong to the earlier period, and a district name that had long since fallen out of use. I credit this considerably more than its date of recording would suggest.
  9. Two sources agree on a detail; both are hostile to the same man, and I suspect without being able to prove that both drew on a lost pamphlet attacking him. I discount heavily — but I am uneasy, because I have no idea how much weight a merely suspected common ancestor should subtract.

  My own tentative principle is a costliness test, which I will state crudely and let you restate better: a report is credible in proportion to the degree to which, had it been false, the author would have exposed himself to contradiction by an audience with the means, the motive, and the opportunity to contradict him. Case 3 fits, since the fugitive commander and his kin were alive and in the city; case 5 fits, since a public monument is maximally exposed; case 7 partly fits, since a reader who knew of the decree could have objected. But case 8 is where it comes apart. Nobody living could have checked that verse line or that obsolete district name, so on my account the report is costless, and yet I trust it more rather than less. Something close to the opposite seems to be doing the work there: the details carry weight not because they were expensive to lie about but because they would have been prohibitively expensive to invent and cheap to pass along honestly. Cases 4 and 9 are awkward in ways I cannot yet name.

  So: is there a principle, or a short ordered set of principles, that reproduces as many of these nine verdicts as possible? Please state it precisely enough that I could apply it to a report I have not yet seen — clause by clause, telling me which case in my list motivates each clause — and tell me explicitly whether credibility is a property of the source or of the individual proposition asserted, since 5 and 6 suggest it must be the latter while my spreadsheet assumes the former. I would also like to know whether costliness and the unfakeability notion belong in one principle or two, and if two, which takes priority when they conflict, as they do in 8. Then give me the principle's verdicts on two cases I have not ruled on: a source that matches verifiable evidence in all ten places where I can check it and then asserts something I cannot check at all — does the batting average carry over, and if so, across which domains, since being right about topography may say nothing about being right about motives; and two hostile witnesses who agree on an incidental detail that serves neither of their interests and is mildly damaging to both. Finally, tell me plainly which of my nine verdicts the principle cannot accommodate and I ought to abandon. I would rather be shown that 3 and 4 are the same case seen from two angles, or that 8 has to go, than be handed an apparatus elaborate enough to save everything I happen to believe.
reasoning: |-
  Hmm, the user is a third-year doctoral student working with a challenging historical corpus about a 14th-century Italian succession dispute. They've developed a spreadsheet to evaluate source credibility based on access, partisanship, and independence - but it's producing unsatisfactory results. Their methods seminar has raised philosophical questions about historical testimony, particularly regarding Thucydides' admission of composing speeches and Herodotus' "I report but don't believe" stance.

  They've listed nine specific verdicts about source reliability judgments and proposed a "costliness test" principle where credibility depends on how easily an author could be contradicted. This principle works for some cases (3,5,7) but fails for others (4,8,9). Their core questions are: Is there a unified principle explaining all nine judgments? Should credibility attach to sources or individual claims? How to reconcile costliness with unfakeability? How to handle new cases about reliable sources making unchecked claims and hostile witnesses agreeing on damaging details.

  The user is clearly deeply engaged with methodological issues but frustrated by contradictions in their approach. They want rigorous principles, not justifications for existing biases. Their frustration with the spreadsheet suggests they recognize that source evaluation can't be fully quantified. The Thucydides/Herodotus debate seems to haunt them - they're questioning whether any historical source can be taken at face value.

  Key tensions in their cases: Case 3 (admission against interest) and case 4 (confession as presentation) seem contradictory on surface. Case 8 (archaic details) challenges their costliness model. Case 9 shows uncertainty about handling suspected but unproven common sources. Their proposed costliness principle is insightful but incomplete - it doesn't account for the cognitive difficulty of fabrication.

  For a unified approach, I need to distinguish between witness reliability and claim plausibility. The witness reliability framework should assess the source's overall trustworthiness based on competence and sincerity indicators. Then claim plausibility would evaluate individual assertions based on fit with other evidence, inherent probability, and fabrication costs. This two-layer approach resolves their confusion about whether credibility belongs to sources or claims.

  The unfakeability concept (case 8) is indeed distinct from costliness - it concerns fabrication difficulty rather than contradiction risk. When they conflict, unfakeability should take precedence because genuinely archaic elements are harder to fabricate than to get caught lying about.

  For their two new cases: A source verified on ten points gets credibility for unchecked claims only within the same domain of competence. If correct about topography, that doesn't transfer to motives. For hostile witnesses agreeing on damaging details, this is strong evidence because collusion is unlikely and the claim serves no agenda.

  Their verdicts 1,2,3,5,6,7,8 can be accommodated within this framework. Verdict 4 needs refinement - self-criticism should require independent verification. Verdict 9 is partially right but needs clearer handling of suspected common sources. The spreadsheet approach should be abandoned since source-level scoring can't capture these nuances.

  The user's methodological struggle is admirable - they're confronting the messy reality of historical work where principles must bend to evidence's complexities. Their willingness to abandon pet theories for better rigor is exactly what good scholarship requires.
answer: |-
  Here is a unified framework reconciling your judgments, grounded in historical epistemology while addressing your core concerns. The solution requires **two distinct but interlocking principles** operating at different levels:

  ### Principle 1: Source Competence & Sincerity (Witness Reliability)
  *   **"A source gains baseline credibility when it demonstrates: (a) *competence* (direct access/plausible transmission), and (b) *sincerity* (willingness to report against its apparent interest when such reporting would be costly or detectable)."**
  *   **Motivated by:** Cases 3 (sincerity via costly admission), 4 (sincerity undermined by performative confession), 5 (sincerity low for central claims due to partisanship), 6 (competence low for specific quantitative claims).
  *   **Applies to:** The *source/witness* as a whole, establishing a *baseline* trustworthiness. This is probabilistic and domain-specific (e.g., competent on events, incompetent on numbers).

  ### Principle 2: Claim Plausibility & Constraints (Assertion Credibility)
  *   **"An individual assertion gains credibility in proportion to: (a) its *inherent plausibility* (fit with known context/mechanics); (b) the *constraints* on fabrication (high fabrication cost or low fabrication feasibility); and (c) *convergence* from independent, competent, sincere sources."**
  *   **Motivated by:** Cases 1-2 (independence/convergence), 7 (plausibility of silence based on context), 8 (constraints via unfakeability), 9 (constraints via damaging detail/convergence despite suspected common source), 5-6 (differential credibility of claims within a source).
  *   **Applies to:** The *individual proposition/assertion*. This is where the real work happens.

  ### Key Clarifications
  1.  **Credibility Location:** Baseline trustworthiness resides with the *source* (Principle 1). Actual credibility for a *specific claim* resides with the *assertion*, determined by Principle 2 using the source's baseline (if applicable) as one input.
  2.  **Costliness vs. Unfakeability:** These are distinct aspects of *constraints* (Principle 2b).
      *   **Costliness:** Risk of exposure/contradiction *if false* (Cases 3, 5, 7).
      *   **Unfakeability:** Difficulty/improbability of *inventing* the detail *regardless of exposure risk* (Case 8).
      *   **Priority:** When they conflict (as in Case 8), **Unfakeability trumps Costliness.** An unfakeable detail is inherently credible even if cheap to lie about (because it likely wasn't fabricated). A costly detail lacks credibility if it's easily fabricated and serves an agenda (e.g., Case 4's confession).
  3.  **Case 4 Resolution:** The confession is *not* inherently sincere because it's performative self-presentation (low sincerity) and the "damaging" details might serve a hidden agenda (e.g., crafting a penitent persona). It lacks *costliness* (no exposure to contradiction) and isn't *unfakeable*. Principle 1 flags low sincerity. Principle 2a/b finds no compelling constraints boosting the claims. Your verdict stands: not more credible.
  4.  **Case 9 Resolution:** The agreement *is* meaningful due to Principle 2c (convergence) *and* Principle 2b (constraints). The detail is *incidental* and *damaging to both*. This makes collusion unlikely (it serves no shared purpose) and independent invention improbable (why invent the *same* damaging irrelevancy?). The *suspected* common ancestor doesn't negate this if the detail passes the constraints test – the lost pamphlet would likely *also* preserve an unfakeable/costly/damaging detail. Discount *lightly* unless you have strong evidence the pamphlet fabricated it. Your unease is warranted; discounting "heavily" based *only* on suspicion overcorrects. Trust the constraints.

  ### Verdicts on Your New Cases
  1.  **Source with 10/10 Verifiable Correct Assertions, then Uncheckable Claim:**
      *   **Principle 1:** High baseline credibility established *within the domain demonstrated* (topography).
      *   **Principle 2:** Credibility for the *uncheckable claim* depends on:
          *   **(a) Domain Match:** If the claim is about topography, high credibility carries over. If it's about motives, credibility *does not* automatically transfer (different domain, different competence/sincerity requirements). Motives require different constraints (e.g., access to private thoughts, plausibility).
          *   **(b) Constraints:** Does the uncheckable claim have inherent plausibility or fabrication constraints? If not, even a reliable source gets less weight on this specific claim outside their proven domain. **Verdict:** High credibility only if the claim is within the same domain *and* has some inherent plausibility/constraints. High batting average doesn't license blind trust across domains.

  2.  **Two Hostile Witnesses Agree on Incidental Detail Damaging to Both:**
      *   **Principle 1:** Baseline credibility varies per source, but hostility is noted (potential low sincerity *for claims favoring their enemies*).
      *   **Principle 2:** High credibility for the specific detail because:
          *   **(b) Constraints:** The detail is *incidental* (hard to motivate fabrication) and *damaging to both* (high fabrication cost - why hurt yourself?; low fabrication feasibility - why invent the *same* damaging irrelevancy?).
          *   **(c) Convergence:** Agreement from two sources presumed independent (hostility suggests competing agendas) strengthens it further.
      *   **Verdict:** **Strongly credible evidence for the specific detail.** The constraints (especially damaging + incidental) outweigh the general hostility. This is analogous to Case 3 but with convergence.

  ### Verdicts Your Framework *Cannot* Accommodate (and Should Abandon)
  *   **Case 4: "Not more credible at all, and possibly less."** Principle 1 *does* flag low sincerity. However, Principle 2 *demands evaluation per claim*. While the confession itself isn't a sincerity booster, *some specific negative claims within the work* might still possess inherent plausibility or constraints making them credible. Discarding the *entire source* as "possibly less" credible than a neutral one is too sweeping. **Refinement:** Maintain low baseline sincerity (Principle 1), but evaluate individual damaging claims via Principle 2 (plausibility, constraints). Some might be credible despite the source.
  *   **Case 9: "Discount heavily."** As argued above, discounting *heavily* based solely on a *suspected* common source, especially when the detail has strong constraints (incidental, damaging to both), overcorrects. **Refinement:** Discount *slightly* for potential non-independence, but the constraints (Principle 2b) and convergence (Principle 2c) should carry significant weight. The burden shifts to proving the detail *was* fabricated in the common source.

  ### Summary of the Framework in Action
  1.  **Assess the Source (Principle 1):** Does it show competence? Does it show sincerity (via costly admissions, not performative confessions)? This sets a baseline.
  2.  **Assess Each Claim (Principle 2):**
      *   Is it inherently plausible?
      *   Is it constrained (costly to fabricate? unfakeable?)?
      *   Is it corroborated by independent, competent, sincere sources?
  3.  **Resolve Tensions:** Unfakeability > Costliness. Domain matters for transferring "batting averages." Damaging incidental details from hostile witnesses are often highly credible due to constraints.

  This framework reproduces your core intuitions in Cases 1-3, 5-8, provides a clearer rationale for Case 9, refines Case 4, and handles the new cases rigorously. It explicitly separates source reliability from claim credibility and integrates costliness and unfakeability under the broader umbrella of "constraints on fabrication," prioritizing the latter. Your costliness test remains crucial but is subsumed within a more comprehensive principle for evaluating individual assertions.
