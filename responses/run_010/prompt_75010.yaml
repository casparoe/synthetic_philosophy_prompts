answer: |-
  "Friends, family, colleagues – gather ‘round! We’re here because Marianne is leaving the department. Officially, as of Friday, her name isn’t on the door anymore. Someone else’s name is there. Her old courses? They have new numbers now. Even her students officially answer to other advisors. The labels changed. The directory updated.

  Now, if you just looked at the directory… you might get confused. You might think the person who *was* Marianne in the system… well, maybe she vanished when the labels switched! Poof! Gone! Because the labels *did* point somewhere specific before, and now they point elsewhere. But we all know better, don’t we? We’re not fooled by a change in the directory listing. We know exactly who we came to celebrate tonight. The name isn’t the party inside the room, right? *[Pause for laughter, especially from the nine-year-old]* The directory entry isn’t the brilliant mind it used to refer to!

  Think about it. Imagine you had a perfect, detailed map of this very dinner. Every plate, every glass, every fork, every smiling face… and then someone came along and painstakingly changed every single *label* on that map. Scrambled all the names. Swapped ‘Grandma’ for ‘Gravy Boat’ and ‘Physics Prof’ for ‘Potato Salad’. Would the dinner itself be different? Would the gravy boat suddenly *be* Grandma? Would the potato salad start lecturing on quantum gravity? Of course not! The food stays on the plates. The laughter stays in the room. The important things – the relationships *between* the forks and the food, the conversations *between* the people, the warmth *around* the table – none of that changes just because the *names* on the map got shuffled around. The map changed. The territory? The real, lively, messy, wonderful gathering? That remains utterly, completely itself.

  That’s the insight Marianne spent decades defending, with fierce intelligence and unwavering clarity, against anyone who insisted that the map labels *must* point to something real all by themselves, independently of what the map actually *says* about how things relate. She showed, brilliantly, that clinging to those bare labels alone leads you into a nonsensical mess. She argued that what truly matters, what truly describes our world – or indeed, any meaningful structure – isn’t the isolated labels, but the rich, invariant pattern of relations they trace out. The *coincidences*. The *connections*. The *structure* that persists even when the names change.

  And look around. Look at *this* structure. Look at the web of relationships centered right here, right now. Her husband’s smile. Her sister’s proud gaze. The way her grandchildren lean in when she talks. The shared memories lighting up the faces of colleagues who’ve argued with her, learned from her, been challenged and inspired by her for thirty-one years. The respect resonating in this room. The love.

  *That* is the invariant structure. *That* is the pattern that uniquely picks out Marianne. Not the name on an office door that could be reassigned, not a course number that could be renumbered, not a line in a spreadsheet. The *relations* are the real thing. The enduring structure. The pattern of connection, affection, respect, and intellectual spark that Marianne *is*, right here, tonight. We don’t need the old directory entries to know exactly who we’re honoring. We see her. We feel her. We are here *with* her. Because the map might change, but the territory – Marianne – remains gloriously, distinctly, unshakeably present. To Marianne!"
