prompt: |-
  ok so i'm doing a politics project at school and i've realised I don't actually have a consistent view on who should be allowed to vote, and I want help working out what principle my gut is reaching for. here's my verdicts:

  - my mate's mum is Polish, been in Leeds 20 years, works full time, pays her taxes, both her kids were born here and one is in my form. she can't vote in a general election. I think that's straight up wrong.
  - but an Irish lad who moved over three years ago for uni, has no idea whats going on here and is leaving after his degree, can vote in a general election. I think that's fine and I wouldn't take it off him.
  - a British person who emigrated to Australia in the 80s, never visits, pays no tax here, can still vote forever now. I think he shouldn't be able to.
  - but my cousin, who's a nurse on a two year posting in Dubai, obviously should.
  - prisoners can't vote at all here. I think a man inside for six weeks because he didn't pay a fine should still get a vote, but someone serving life shouldn't, and I honestly can't tell you where that line is or why.
  - 16 year olds can vote in Scotland for the parliament there but not in a general election. I think they should vote everywhere. but a 14 year old shouldn't, even though I know 14 year olds who follow politics harder than most adults, and I'm fine letting clueless adults vote.

  the principle I keep reaching for is roughly: if you have to live with a decision you should get a say in it. but that breaks immediately, because half the planet has to live with some UK decisions, and tourists and babies and people who aren't born yet have to live with loads of them.

  can you give me the principle — or the two or three best candidates — that fits most of this, spelled out properly, with what each bit of it is doing and which of my cases forced that bit in? then tell me what it says about cases I haven't thought of, and be honest about which of my verdicts it just can't save and so has to be thrown out. don't bother with book titles or references, I only want the reasoning. also can you write it in British English please.
reasoning: |-
  Okay, let's tackle this user's query. They're working on a politics project and need help figuring out their voting eligibility principles. They've listed several specific cases with their gut reactions, and they want a coherent principle that fits most of these, along with an honest assessment of where it fails.

  First, I need to analyze each case they mentioned. The Polish mother in Leeds has been there 20 years, pays taxes, but can't vote—user thinks that's wrong. The Irish student can vote but is temporary—user is fine with that. The British expat in Australia shouldn't vote, but the nurse in Dubai should. Prisoners: short sentence yes, life no. Sixteen-year-olds should vote, but not fourteen-year-olds, even though some are informed. Their initial idea is "if you have to live with a decision, you get a say," but they see the flaws in that.

  Looking for patterns here. The Polish mother is deeply rooted in the community through long-term residence, family, and taxes. The Irish student has citizenship ties (Common Travel Area) but temporary stay. The expat in Australia lacks current ties, unlike the nurse on a temporary assignment. Prisoners: maybe length/severity of sentence affects their stake in society? Age: sixteen is closer to adulthood, with some autonomy, while fourteen isn't. 

  The key elements emerging are **stake in the community** and **durable connection**. Citizenship alone isn't sufficient (expat example), and non-citizens can have strong ties (Polish mother). Temporary presence is okay if there's a historical/citizenship link (Irish student), but not if disconnected (expat). For prisoners, the issue might be the temporary vs. permanent exclusion from society. Age involves maturity and autonomy.

  Potential principles: 
  1. **Durable societal stake**: Based on residence, contribution, ties. Explains Polish mum (long-term residence), nurse (temporary but contributing), excludes expat (no ties). 
  2. **Temporal autonomy**: Voting rights tied to being subject to laws long-term. Fits 16-year-olds (more autonomy), short-sentence prisoners (soon reintegrated). 

  But contradictions: The Irish student is allowed despite being temporary due to citizenship ties. So maybe citizenship combined with some presence? But the expat has citizenship but shouldn't vote. So citizenship isn't enough alone. The principle needs to balance citizenship with ongoing ties or presence. 

  The user's verdict on the Irish student is interesting—they accept it, which suggests that historical ties (like the CTA) matter. But the expat lacks current ties. So perhaps "citizenship plus recent engagement" or "current societal membership."

  Prisoners are tricky. The user differentiates by sentence length. Life sentence prisoners are permanently removed, so no stake. Short sentences retain their stake. Age: sixteen might be seen as having partial autonomy, entering adulthood roles (work, taxes), while fourteen doesn't, despite some being informed. So the principle might include "degrees of societal integration."

  Synthesizing: A combination of **durable connection** (residence, contribution) and **temporal subjection** (how long affected by laws). Citizenship can be a factor but not sufficient without connection. 

  Cases that don't fit: The Irish student fits through citizenship and temporary presence, but the principle might struggle if applied strictly. Also, the user accepts uninformed voters, so awareness isn't a criterion. 

  Honest failures: The Irish student works through historical agreements, which might be an exception. Lifelong prisoners—if the principle is about societal stake, life sentences mean permanent exclusion, so no vote. But that conflicts with retributive vs. rehabilitative justice views. Also, the 14-year-old informed teen: if the principle is age-based autonomy, it excludes them even if informed, which the user accepts but might feel uneasy about. 

  Need to present principles clearly, with elements explained per case, and note where verdicts are overruled (like maybe the Irish student under strict durable connection). Highlight that historical/citizenship ties can be a secondary factor. Also, acknowledge that age and prisoner lines are somewhat arbitrary but based on societal norms.
answer: |-
  Right, let's crack this. Your gut reactions are actually quite consistent with a few core principles wrestling underneath – primarily **"Stakeholding through Subjection and Integration"**. This principle has two interlocking parts:

  1.  **Subjection to Long-Term Consequences:** You believe voters should be *significantly and enduringly* affected by the laws and policies made by the government they're voting for. This isn't just about experiencing consequences *now*, but about being bound by them for a substantial period *into your foreseeable future*.
  2.  **Integration into the Political Community:** This is about having a tangible, established connection to the society governed by that vote. It's more than just physical presence; it's about contributing to, participating in, and being rooted in the community whose future you're shaping.

  **Breaking Down the Principle with Your Cases:**

  *   **"Subjection to Long-Term Consequences" Explains:**
      *   **Your mate's Polish mum (Wrong she can't vote):** She is deeply subject to UK laws (taxes, employment, public services, her kids' future) and will be for the foreseeable future. *This case forces the "long-term" and "foreseeable future" element.*
      *   **British expat in Australia (Shouldn't vote):** He faces minimal long-term consequences from UK policy decisions. His life is firmly rooted elsewhere. *This case forces the "long-term" and distinguishes it from temporary absence.*
      *   **Nurse cousin in Dubai (Should vote):** Her absence is temporary, specific, and she fully intends to return and live under UK laws long-term. Her life trajectory remains tied to the UK. *This case refines "long-term" to include temporary absence with strong return intention.*
      *   **Prisoners - Short sentence (Should vote):** A six-week sentence doesn't fundamentally alter his long-term subjection to UK laws; he'll re-enter society quickly. *This case establishes that temporary removal of liberty doesn't negate long-term subjection.*
      *   **Prisoners - Life sentence (Shouldn't vote):** A life sentence represents a permanent removal from society. His long-term future is fundamentally detached from the consequences of general societal governance. *This case forces the link between voting rights and the expectation of future participation in society.*
      *   **Tourists/Babies/Unborn/Global Impact (The breakdown):** You rightly spot the flaw in a pure "live with the decision" principle. Half the planet *is* affected, but not with the same *direct, sustained, and inescapable subjection* as residents. Tourists are transient. Babies and the unborn aren't current participants. The global impact is indirect. *This forces the qualification: "significantly and enduringly affected... for the foreseeable future."*

  *   **"Integration into the Political Community" Explains:**
      *   **Your mate's Polish mum (Wrong she can't vote):** She is deeply integrated – long-term resident, taxpayer, worker, parent of citizens embedded in the community. *This case forces the "integration" element beyond mere citizenship.*
      *   **Irish student (Fine he can vote):** While transient and less informed, his right stems from the historical and political integration between the UK and Ireland embodied in the Common Travel Area and reciprocal voting rights. It's a recognition of a unique, deeply intertwined political community. *This case is an outlier that forces acceptance of a specific historical/political integration agreement overriding pure residence/subjection duration.*
      *   **16-year-olds (Should vote):** They are integrated into society – they work (many), pay some taxes (VAT, possibly income tax), use services, are subject to laws, and crucially, the decisions made *now* will bind them for decades as adults. *This case forces inclusion based on imminent full integration and long-term subjection.*
      *   **14-year-olds (Shouldn't vote, even if informed):** While some are informed and affected, society generally views them as lacking full autonomy and being in a preparatory phase before full societal integration. The line is arbitrary but based on societal norms about maturity and independence. *This case accepts that while subjection starts young, full political integration has a threshold (age).*
      *   **"Clueless" Adults (Can vote):** Integration (usually via citizenship/birth) grants the right, regardless of political engagement. Removing it based on knowledge is seen as fundamentally undemocratic and unworkable. Your principle accepts this baseline of integration as sufficient, even if imperfect. *This forces the acceptance that integration is the primary gate, not competence.*

  **Synthesised Principle:**
  **"Individuals should have the right to vote in an election if they are demonstrably integrated into the political community governed by that election and are subject to the long-term consequences of its outcomes for the foreseeable future."**

  **What This Principle Says About New Cases:**

  1.  **Resident Non-Citizens (e.g., 10+ years, kids in school):** Likely YES. Strong integration + long-term subjection.
  2.  **Short-Term Workers (e.g., 1-year contract, no family):** Likely NO. Subjection is significant but likely temporary; integration may be limited. (Contrasts with your nurse cousin who has a clear UK life to return to).
  3.  **Citizens born abroad, never lived in UK (e.g., child of expats):** Likely NO. Minimal integration, minimal direct long-term subjection. Similar to the Aussie expat.
  4.  **Citizens with severe dementia:** Tricky. Integration (citizenship) is clear, but capacity to participate meaningfully is gone. Your principle *as stated* might lean towards keeping the right (integration), but this clashes with the *purpose* of voting (having a say). This exposes a tension – capacity might need to be a separate, difficult consideration.
  5.  **Prisoners (Where's the line?):** Your principle suggests the line is drawn at the point where the sentence length indicates permanent or near-permanent removal from society (e.g., life without parole, very long sentences). Shorter sentences (even a few years) still imply eventual reintegration and long-term subjection. This argues *for* voting rights for most prisoners, contrary to current UK law and your instinct on lifers. *This is a major point of conflict*.

  **Honest Assessment - Which of Your Verdicts Can't Be Saved:**

  1.  **The Irish Student:** Your principle *struggles* with this one. His integration is arguably weak (transient, uninformed), and his long-term subjection is minimal (leaving soon). The *only* way it fits is by accepting the **specific historical/political integration agreement** (the CTA) as an *overriding* factor defining the "political community". It's an exception built on unique history, not pure logic from your core principle. If you applied your core principle strictly, you *should* probably think he *shouldn't* vote. You accept the exception because of the special relationship.
  2.  **Life Sentence Prisoners:** Your principle of "subjection to long-term consequences" actually argues *strongly* that they *should* vote, especially if parole is possible. They are utterly subject to prison policy, healthcare, rehabilitation efforts, and the broader societal attitudes shaped by government – for life. Your gut says "no", likely driven by a sense of retribution or forfeiture of rights, which *isn't* captured by your Stakeholding principle. You'd need to add a separate principle like **"forfeiture of rights due to severe breach of societal contract"** to justify this exclusion, which clashes with the core idea.

  **Conclusion:** Your gut is overwhelmingly guided by **Stakeholding through Subjection and Integration**. It powerfully explains your views on long-term residents vs. disconnected citizens, temporary workers abroad vs. permanent emigrants, and young adults on the cusp of full societal participation. The main tension points are the special case of Irish citizens (saved by historical agreement) and lifelong prisoners (where your gut introduces a conflicting retributive element not in the core principle). The age cutoff, while arbitrary, fits within societal norms defining full integration. This principle provides a robust, morally coherent foundation for reforming voting eligibility, focusing on who truly has skin in the game for the long haul.
