  After analyzing the cases, I propose the following candidate rules:

  1. **Rule A: Full Disclosure Plus Political Nexus**  
     Amnesty is granted if (a) the act was committed with a political objective and in the course of the conflict, (b) the applicant provides full disclosure that yields new and significant information, and (c) the means are not grossly disproportionate (with a high threshold for disproportionality). This rule emphasizes the truth-revelation aspect but requires a political nexus and some proportionality.

  2. **Rule B: Strict Proportionality and Temporal Boundaries**  
     Amnesty is granted only if (a) the act occurred during the active conflict (before the ceasefire, with a narrow exception for spillover in areas of continued fighting), (b) the means were proportionate to the objective (with a low threshold for disproportionality, especially regarding civilian casualties), and (c) full disclosure is provided. Under this rule, the gravity of the act (especially against non-combatants or children) and the timing are critical.

  3. **Rule C: Organizational Accountability**  
     Amnesty is granted if (a) the act was ordered by or in support of an organization involved in the conflict, (b) the applicant had a defined role within that organization, and (c) full disclosure is provided that implicates others or reveals new facts. This rule focuses on the organizational context and the applicant's role, with less emphasis on proportionality.

