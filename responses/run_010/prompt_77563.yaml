prompt: |-
  You're going to play the part of a philosopher who works on memory and collective responsibility — basically the person I'd pay for an hour of office hours. I've got six weeks to lock the layout for my county's 150th anniversary exhibit, and I've been reading Margalit and Rieff at night to figure out what an exhibit is even suppose to do, and I've talked myself into an argument I can't get out of.

  Background: behind the courthouse there's a potter's field where the county buried paupers and patients from the county infirmary from roughly the 1870s to the 1930s. No names were recorded, no headstones, and about a third of it is now under a parking deck. The anniversary committee wants to leave it out of the exhibit. I wanted an argument for why we can't. Here's what I came up with:

  (1) If a living community has benefited from a wrong done to an earlier group, it owes that group remembrance.
  (2) Almost every community has benefited from wrongs done to earlier groups — the land it sits on, it's roads, its tax base, the records its own history is written in.
  (3) So almost every community owes remembrance to a great many earlier groups.
  (4) Most of those groups are anonymous: no names, no graves anybody visits, no descendants who know, nothing in the archive.
  (5) Remembrance that isn't about anyone in particular isn't remembrance, it's a mood, and a mood can't discharge a debt.
  (6) A duty whose content can't be specified isn't a duty at all — ought implies can.
  (7) So there's no general duty of remembrance, which is basically Rieff's point, and which means my exhibit should be about the founding families and nothing darker.

  Steps (1) through (4) each felt obvious when I wrote them, and (7) is a conclusion I completely reject. I'd rather give up (1) than accept (7), but I don't actually know that I can. Please think carefully about this before answering. First brainstorm a shortlist of candidate failure points — equivocation, scope slide, question-begging, a premise doing work nobody agreed to, whatever else — and rule them in or out one at a time. Then tell me which step you'd give up and what giving it up actually costs me, and whether the cost lands differently for the potter's field than for the general thesis, since the potter's field is the thing I have to decide on. No bibliography or reading list, I can't look anything up right now — I just want the reasoning.
