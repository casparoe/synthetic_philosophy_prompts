  I am preparing a short handout for an advanced undergraduate seminar on the philosophical uses of probability, and I drafted the following summary of the doomsday argument rather quickly. Before it circulates I would like a rigorous audit of it, since I wrote it from memory of a literature I know only loosely and I suspect that at least one or two of its claims are not what a specialist would say.

  Here is the passage as it currently stands:

  > The doomsday argument was proposed by the astrophysicist Brandon Carter and made widely known by the philosopher John Leslie; the astronomer J. Richard Gott later produced an independent version. The reasoning is disarmingly simple. Roughly sixty billion humans have been born so far, and you are one of them. You have no idea where you sit in the complete sequence of human births, so you should treat your own birth rank as though it had been drawn at random from all the humans who will ever live. Given that, it would be very surprising for you to turn out to be among the earliest few percent, so the total number of humans is unlikely to be vastly greater than the number already born. Concretely, there is a 95 percent chance that the total will fall below about 1.2 trillion, and a 50 percent chance that you are already past the halfway point of human history — which means there is an even chance that the last human will be born within the next few centuries. Gott's version reaches the same destination by a different route: assuming only that you occupy no privileged position in time, it yields 95 percent confidence that humanity has between 5,100 and 7.8 million years remaining. The two derivations therefore agree, and neither depends on any prior assumptions about humanity's prospects, since each is nothing more than Bayes' theorem applied to a fact you cannot escape — that you exist now, at this particular point in the sequence. The serious objection is the reference-class problem: from which group of observers is your rank supposed to have been drawn? But this is readily handled, because all the natural candidate classes — all humans, all members of our species past and future, all observers anywhere in the universe — produce broadly similar verdicts; and critics who suggest narrowing the class to the people alive at your own moment only strengthen the argument, since that narrower class is itself a random sample of the wider one. It is worth stressing, finally, what the argument does not do. It says nothing about any mechanism of extinction, so it neither supports nor undercuts particular worries about nuclear war, engineered pandemics, climate change, or misaligned artificial intelligence. Its conclusion is purely statistical: a bound on how many of us there will ever have been.

  My own inclination is that the arithmetic is broadly sound and that the two dismissals near the end — of the reference-class problem and of the specific-risk objection — are too easy, but I cannot say which is worse, or why, and I may be wrong about the arithmetic too. Please work through the passage and give me the following.

  1. Sort its claims into three categories: accurate as stated; a defensible simplification for an undergraduate handout that nonetheless deserves a footnote; and wrong, or correct only under an assumption the passage leaves implicit. Quote the relevant phrase in each case rather than summarising it back to me.

  2. For each numerical claim, identify what the number is a number *of*. In particular, what quantity does the argument itself place a bound on, and what further premise is needed to convert that bound into a claim about centuries or years? Say whether that premise is supplied anywhere in the passage.

  3. The passage asserts that the Carter/Leslie and Gott derivations "agree" and that neither rests on prior assumptions about the future. Explain what work a prior over the total does in the Bayesian version, how sensitive the size of the probability shift is to that prior, and whether the Gott version can honestly be described as prior-free. Then say whether it is right to describe the two versions as reaching the same conclusion, or whether they are answering subtly different questions.

  4. On the reference class: what would a defender of the argument accept in the passage's treatment, what would they reject, and is the claim that the natural candidate classes yield similar verdicts sustainable? Address the narrower-class proposal directly — does restricting attention to one's contemporaries strengthen the argument or defuse it, and is the passage's stated reason for thinking otherwise coherent?

  5. On the claim that the argument is neutral with respect to particular existential risks: if it raises the probability of extinction by some cause or other, can it really leave the probabilities of the candidate causes untouched? Say what a proponent of the argument would want to insist here, and whether the passage's neutrality claim is a fair representation or a substantive error.

  6. The passage implies that rejecting the argument requires rejecting Bayesian updating. Identify which premise of the argument is *not* delivered by Bayes' theorem, and describe what someone who accepts Bayesianism without reservation can coherently deny.

  7. Finally, tell me which of the passage's headline conclusions survive correction intact, which survive only in weakened form, and which should simply be deleted. Then rewrite the passage so that it is accurate at the same level of accessibility and in roughly the same length, preserving the expository voice.

  Two constraints on your reply: I am interested in your reasoning and not in pointers, so please do not append a bibliography, a list of the relevant papers, or suggested further reading; and where you judge that the passage is fine as it stands, say so plainly rather than manufacturing a defect, since I would rather not strip out material that is correct.
