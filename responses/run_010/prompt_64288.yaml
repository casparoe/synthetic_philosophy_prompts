prompt: |-
  Taking a philosophy of biology seminar this term and I have to write a paper on the units of selection debate, but before I commit to a thesis I want to know what my own judgments actually add up to. Here's where I land, case by case:

  - Mouse t-haplotype: a heterozygous male passes it on to something like 90%+ of his offspring, homozygotes are sterile or don't develop, and it still hangs around at low frequency in wild mice. Here I say selection is acting on the gene, not on the mouse.
  - Wolbachia: maternally inherited bacterium that messes with host reproduction to bias its own transmission, at some cost to the host. This feels structurally identical to the t-haplotype to me — a replicator beating its vehicle — but my gut says no, Wolbachia is just a parasite and the infected insect is still the individual that's selected. I genuinely can't say what the difference is.
  - Dictyostelium slugs, where chimeric slugs form and some genotypes shirk the stalk and end up as spores instead: I say the slug isn't an individual. It's genotypes competing, full stop.
  - A honeybee colony that swarms: I say this one IS an individual and a real unit of selection, even though it doesn't reproduce by making copies of itself — it makes a queen and some drones who go off and build something new. That's supposed to be different from the slug and I can't articulate why.
  - Worker policing, where workers eat other workers' eggs: I want to call this the colony suppressing selection at a lower level, not competition among workers.
  - A tumor cell lineage inside somebody: obviously heritable variation with differential reproduction, and I feel like it counts as a unit of selection, but I also want to say nothing is really evolving there since it all dies with the body. Those two thoughts can't both survive.
  - The Pseudomonas flourescens microcosm work, where a mat-forming strain takes over the surface of a static flask and then gets eaten from within by non-mat cheaters, and the whole setup only persists if you propagate the mats as units: I call that genuine group selection. But then I also want to say that human cultural group selection — groups with costly norms outlasting or outbreeding other groups — is NOT genuine group selection and is usually just kin selection with sloppy bookkeeping.
  - Yeast [PSI+], where the heritable thing is a misfolded protein and not DNA at all: I say it can be a unit of selection, which kind of terrifies me because it means whatever criterion I'm using isn't genetic.

  My tentative principle is: X is a unit of selection when differences in fitness among Xs are caused by properties of the Xs themselves and get passed on to the Xs' descendants. But "properties of the Xs themselves" is carrying the entire weight and I can't cash it out.

  So: does any existing way of slicing this — replicator vs. vehicle, interactor, reproducer with a bottlenecked life cycle, MLS1 vs. MLS2, or just reading off the covariance terms in a Price equation decomposition — deliver all of these, or most of them? Walk me through the one or two best candidates, show me exactly where each one gets my verdicts right and where it has to overturn one, and tell me whether the overturning is defensible or whether I should keep the verdict and drop the principle. Then give me what the account you land on predicts for cases I haven't listed — something like a mitochondrion, a B chromosome, or a plasmid moving between bacteria by conjugation — because I want to know if it's going to embarrass me in section.
reasoning: |-
  Okay, let me start by unpacking the user's query. They're in a philosophy of biology seminar and need to write a paper on the units of selection debate. They've listed several cases and their intuitive judgments about each, but they're struggling to find a consistent principle that covers all of them. Their main request is to evaluate existing frameworks against their intuitions and see which one aligns best, including how it handles unmentioned cases.

  First, I need to understand each case they mentioned. The t-haplotype in mice seems like gene-level selection because the gene manipulates transmission. Wolbachia, though similar, feels different to them—they see it as a parasite, so the host is the unit. Why the discrepancy? Maybe because Wolbachia is an external organism, while the t-haplotype is part of the genome. That’s a key point.

  For Dictyostelium slugs, they see it as genotypic competition, not the slug as an individual. Honeybee colonies, however, they view as individuals despite the reproductive method. Worker policing is colony-level suppression. Tumor cells—heritable variation but no evolution since it dies with the host. Pseudomonas mat formation is group selection, but human cultural group selection isn't. Yeast prions are units despite not being genetic.

  Their tentative principle involves fitness differences caused by properties of X passed to descendants. The sticking point is "properties of the Xs themselves." How to define that? Maybe it's about the level where heritability and causal efficacy align.

  Now, existing frameworks: Dawkins' replicator vs. vehicle might handle t-haplotype and Wolbachia differently because replicators are genes, so Wolbachia as a whole organism might not fit. Hull’s interactor focuses on entities that interact as cohesive wholes. MLS1 vs. MLS2 distinguishes selection within vs. between groups. The Price equation decomposes covariance.

  Applying Hull’s interactor to each case: t-haplotype—gene is interactor? But genes don’t interact directly; it's the vehicle (mouse) that does. Wolbachia—parasite is an interactor, but the user sees the host as the unit. Conflict here. Dictyostelium—slugs aren’t cohesive, so no interactor. Honeybee colony—cohesive, so yes. Worker policing—colony as interactor. Tumor—no heritability beyond body, so no. Pseudomonas—mats as interactors. Yeast prions—protein conformations as interactors? Possible, but Hull’s focus is on cohesive entities.

  The MLS framework: MLS1 for gene-level in t-haplotype, but MLS2 for groups. Dictyostelium is MLS1 within slugs. Honeybee colonies as MLS2. Worker policing as colony-level MLS2. Tumors—MLS1 within body? But no transmission. Pseudomonas is MLS2. Yeast prions—maybe MLS1 if prions are heritable.

  Challenges: Wolbachia straddles levels. Is the parasite an individual or part of a larger unit? The user’s intuition might be influenced by Wolbachia being a separate organism. For tumors, the lack of heritability beyond the host is key. Cultural group selection—kin selection vs. group benefits; maybe the Price equation shows cross-level byproducts.

  Synthesizing, Hull’s interactor might need tweaking, like focusing on heritability and cohesiveness. For unmentioned cases: mitochondria—interactor if heritable variation; B chromosomes—similar to t-haplotype. Plasmids—depending on conjugation, could be gene-level if spread, but Hull might see bacteria as interactors.

  The user’s deeper need is a framework that validates their intuitions consistently, avoiding contradictions. They might also want to defend their thesis without embarrassment in seminar. Highlighting where frameworks align and where adjustments are needed could help. Emphasizing the role of heritability and causal cohesion might bridge the gaps.
answer: |-
  Here's a breakdown of how major frameworks handle your cases, highlighting alignments, conflicts, and a path forward:

  **Your Tentative Principle:** "X is a unit of selection when differences in fitness among Xs are caused by properties of the Xs themselves and get passed on to the Xs' descendants." The core tension is defining "properties of the Xs themselves" and clarifying "descendants."

  **Best Candidate Framework: Hull's Interactor Concept (within the Replicator-Interactor Framework)**

  *   **Core Idea (Hull 1980, building on Dawkins):**
      *   **Replicator:** An entity that passes on its structure largely intact in successive replications (e.g., gene, prion, Wolbachia cell, plasmid).
      *   **Interactor:** An entity that interacts *as a cohesive whole* with its environment in such a way that replication is differential (e.g., organism, colony, cell, potentially a mat, potentially a group). Selection *acts directly* on interactors.
      *   **Selection Process:** Replicators survive *because* of the differential success of the interactors of which they are part. The interactor is the "unit of selection" because it's the entity whose interactions *cause* the differential replication.

  **Walking Through Your Cases with Hull:**

  1.  **Mouse t-haplotype: (Your Verdict: Gene)**
      *   *Hull:* **Aligned.** The *interactor* is the mouse organism. Its phenotype (sterility when homozygous) interacts with the environment. The *replicator* is the t-allele, which biases its own replication *via* its effect on the interactor's phenotype. Selection acts on mice (interactors), causing differential replication of t-alleles (replicators). We *observe* gene-level selection *because* the allele manipulates the interactor's reproductive success.
  2.  **Wolbachia: (Your Verdict: Insect Individual)**
      *   *Hull:* **Aligned.** The *interactor* is the insect organism. Its phenotype (reproductive manipulation) interacts with the environment. The *replicator* is the Wolbachia cell/bacterium (or its genome), which biases its own replication *via* its effect on the interactor's phenotype. Selection acts on insects (interactors), causing differential replication of Wolbachia (replicators). This is structurally identical to the t-haplotype. Your "gut feeling" difference likely stems from Wolbachia being a physically distinct organism, but within Hull's framework, it functions identically to a "selfish gene" replicator manipulating its host interactor.
  3.  **Dictyostelium Slugs: (Your Verdict: Genotypes, not slug)**
      *   *Hull:* **Aligned.** The slug is *not* a cohesive interactor. The amoebae within it do not function as an integrated whole with respect to reproduction; they compete directly. The primary *interactors* are the individual amoeba cells (or perhaps clonal groups before aggregation). Selection acts directly on these amoebae *within* the slug environment, causing differential replication of their genotypes (replicators). The slug is an ephemeral, non-cohesive aggregation, not a unit of selection.
  4.  **Honeybee Colony (Swarming): (Your Verdict: Individual)**
      *   *Hull:* **Aligned (with nuance).** A superorganism colony like a honeybee hive *can* be considered a cohesive interactor. It functions as an integrated whole: coordinated foraging, defense, thermoregulation, and crucially, *reproduction* via the production of swarm units (a new queen + workers). The colony interacts *as a unit* with its environment (e.g., resource availability, predators, weather) in ways that directly determine its reproductive success (swarming frequency/viability). The *replicators* are the genes within the queen/workers. Selection acts on the colony (interactor), causing differential replication of the genes within its reproductive units (swarms).
  5.  **Worker Policing: (Your Verdict: Colony suppressing lower level)**
      *   *Hull:* **Aligned.** Worker policing is a mechanism that *maintains the cohesiveness* of the colony interactor. It suppresses selection at the level of individual workers (or their ovaries/eggs) that would disrupt the colony's integrated function and reproductive efficiency. This reinforces the colony *as* the primary interactor.
  6.  **Tumor Cell Lineage: (Your Verdict: Conflict - Unit but no evolution?)**
      *   *Hull:* **Partially Aligned / Clarifies Conflict.** The tumor cell lineage *within the body* can absolutely be an *interactor*. Clones of cells interact *as cohesive wholes* (within the tumor microenvironment) with their environment (immune system, nutrients, oxygen, drugs) causing differential survival and reproduction (cell division). *Replicators* are the mutant genes driving the cancer. **However,** Hull emphasizes the *process* of selection, not just the existence of heritable variation. The key point is the **lack of heritability *beyond the body***. The tumor's "fitness" differences are not passed on to descendants *of the tumor lineage itself* in a new generation; the lineage ends with the host's death. Selection *is* happening *within* the body (interactor = tumor clone), causing evolution *of the tumor*, but this lineage is not a unit of selection *in the grand evolutionary sense* because it lacks transgenerational heritability at its own level. Your feeling that "nothing is really evolving" is slightly off – the tumor *is* evolving – but the crucial point is that this evolution is confined to a single generation of the host and has no lasting lineage. It's "evolution" but not "descent with modification" beyond the individual.
  7.  **Pseudomonas fluorescens Mats: (Your Verdict: Genuine Group Selection)**
      *   *Hull:* **Aligned.** The propagated mat *is* treated as the cohesive interactor. Its properties (mat formation ability, resistance to cheating) interact with the flask environment *as a whole unit*. Differential survival/replication *of the mats themselves* during propagation causes the evolution of mat-stability traits. The experimenter imposes the group structure and selection at that level. *Replicators* are the bacterial genes. This is a clear case of selection acting on the mat interactor.
  8.  **Yeast [PSI+] Prion: (Your Verdict: Unit, non-genetic)**
      *   *Hull:* **Aligned and Resolves Terror.** The [PSI+] conformation *is* a **replicator**. It passes on its structure (the misfolded state) directly to daughter cells during cell division. The yeast cell is the **interactor**. Its phenotype (including traits influenced by [PSI+], like growth rate under stress) interacts with the environment, causing differential survival/replication of the *cells*. This differential success of the interactors (cells) causes the differential replication of the [PSI+] replicator. Hull's framework explicitly allows non-genetic replicators. Selection acts on interactors (cells), causing differential replication of replicators ([PSI+] prion conformation).

  **Where Hull Overturns Your Verdicts (and Why it's Defensible):**

  *   **Wolbachia:** Hull shows it's structurally identical to the t-haplotype (replicator manipulating an interactor). Your gut feeling likely stems from the physical distinctness of Wolbachia, but functionally within the selection process, it plays the same role as a "selfish gene." The overturning is defensible: it highlights the abstract functional role in the selection process, not the ontology.
  *   **Tumor Lineage:** Hull clarifies the conflict. Yes, it's an interactor *within* the body undergoing selection/evolution. But no, it's not a unit of selection *in the lineage sense* because its "fitness" has no consequences beyond the individual host organism. This distinction resolves the tension.

  **Strengths of Hull for Your Judgments:**
  *   Explains the gene-like behavior of t-haplotype, Wolbachia, *and* [PSI+] via the replicator concept.
  *   Distinguishes cohesive interactors (bee colony, Pseudomonas mat) from non-cohesive aggregates (Dicty slug).
  *   Explains policing as maintaining interactor cohesion.
  *   Handles the tumor case by focusing on the level of heritability and the scope of the selection process.
  *   Cleanly accommodates non-genetic inheritance ([PSI+]).

  **Predictions for New Cases (Using Hull):**

  1.  **Mitochondrion:**
      *   In most multicellular eukaryotes: Mitochondria are *replicators* (pass on their genomes). The cell/organism is the *interactor*. Mitochondrial mutations affecting cell/organism fitness will be selected *via* the differential success of the interactor. Selection is not directly on the mitochondrion as an interactor.
      *   **Exception:** If considering mitochondria competing *within a cell* (e.g., in heteroplasmic disorders or selfish mtDNA variants), then *within that cell*, the mitochondrion (or mtDNA molecule) *could* be seen as an interactor: variants might interact differently with the cellular environment (e.g., replication rate, resistance to autophagy), causing differential replication. But the *consequences* are still felt at the cell/organism interactor level. It's multi-level selection (MLS1).

  2.  **B Chromosome:**
      *   Very similar to t-haplotype. A *replicator* (the B chromosome) that manipulates the *interactor* (the organism) to bias its own transmission, often with costs to the organism. Selection acts on organisms (interactors), causing differential replication of B chromosomes (replicators).

  3.  **Plasmid (via Conjugation):**
      *   **Replicator:** The plasmid DNA (and its genes).
      *   **Primary Interactor:** The bacterial *cell*. The cell's phenotype (e.g., antibiotic resistance, conjugation pilus expression, metabolic burden) interacts with the environment, causing differential survival/replication. This selects for/against plasmids *within* cells via cell-level selection (MLS1).
      *   **Is the Plasmid an Interactor?** Potentially, but weakly. Conjugation allows plasmids to spread horizontally. A plasmid variant with better conjugation machinery might interact *directly* with the environment (other bacteria) to increase its spread *independently* of the success of its current host cell lineage. This approaches plasmid-level interactor status, especially if plasmid fitness is decoupled from host fitness (e.g., very efficient spread even if slightly costly). However, the bacterial cell remains the dominant interactor structuring the environment. This is a borderline case highlighting how interactor status depends on the strength of cohesion and direct environmental interaction at that level.

  **Conclusion & Recommendation:**

  *   **Hull's Interactor Concept** aligns remarkably well with your intuitive judgments across all eight cases, resolving the tensions you identified (especially Wolbachia vs. t-haplotype and the tumor dilemma) and accommodating [PSI+]. Its focus on **cohesive interaction** explains why the bee colony is an individual and the slug is not, and why policing reinforces the colony interactor. Its separation of **replicator** explains the gene-like behavior of selfish elements and prions. Its emphasis on the **selection process** clarifies the tumor case.
  *   **Refine Your Principle:** Modify your tentative principle using Hull's insights:
      > *"X is a **unit of selection (interactor)** when it is a cohesive entity that interacts directly as a whole with its environment, such that variation in its properties causes differential replication of the replicators it contains, and where these fitness differences can be heritable across generations *at the level of X*."*
      *   "Cohesive entity" captures integration (bee colony yes, slug no).
      *   "Interacts directly as a whole" emphasizes the causal role.
      *   "Causes differential replication of the replicators it contains" links interactor success to replicator success.
      *   "Heritable across generations *at the level of X*" resolves the tumor issue and ensures X has an evolutionary lineage.
  *   **For Your Paper:** You have a coherent set of judgments backed by a major framework (Hull). You could defend this view, potentially exploring nuances like the plasmid case or contrasting it briefly with Dawkins' stronger replicator focus or the MLS framework (see below). Acknowledge that "cohesion" can be gradational.

  **Brief Note on MLS Framework:**

  *   **MLS1:** Selection *within* groups changing group composition (e.g., cheaters vs. cooperators in a slug/mat).
  *   **MLS2:** Selection *between* groups acting on group-level properties (e.g., whole bee colonies or mats succeeding/failing).
  *   **Alignment:** Mostly aligns with your judgments and Hull. Dictyostelium is MLS1 within groups (no MLS2). Honeybee colony is MLS2. Worker policing is a trait evolved by MLS2. Pseudomonas mats are MLS2 (if selected between). Tumor is MLS1 within the body.
  *   **Conflict with Your Judgment:** It struggles slightly with the "selfish gene" cases (t, Wolbachia) and [PSI+], as these are fundamentally about replicator spread *within* a population, not necessarily group structure. MLS sees them as individual-level (or lower) selection. Hull's replicator concept handles them more naturally. Your intuition that Wolbachia is "just a parasite" aligns with MLS seeing it as individual-level selection on hosts (or lower-level within hosts).
  *   **Prediction for New Cases:** Mitochondrial competition within cell = MLS1. B Chromosome = individual-level selection (MLS1 only trivially). Plasmid conjugation = primarily individual-level (bacterial cell) selection (MLS1), potentially some group structure influencing horizontal spread.

  Hull provides the most consistent and satisfying account for your specific intuitions across this diverse set of cases. It's the framework least likely to embarrass you in section, as it directly addresses the functional roles in the selection process.
