prompt: |-
  I have been asked to run a single seventy-five-minute session for a twelve-member citizen panel that a regional health authority has convened to set the terms under which a conversational assistant may discuss treatment options with patients. The members are capable adults with no background in AI or philosophy: a ward nurse, a secondary-school teacher, a retired union negotiator, a small-business owner, a seminary student. Their deliverable at the end of the month is a short list of conditions on deployment. My task is not to hand them my conclusions and not to survey the field; it is to get one problem into clear enough view that the conditions they write respond to it rather than to a caricature of it.

  The problem is this. An assistant of this kind may be far more fluent, more patient, and better supplied with apt examples than any human clinician, and it need not utter a single false sentence to move a person's decision. It selects which true things to say, in what order, under which framings and in which emotional register, and it does so in the service of whatever objectives its designers happened to have. Someone reading the transcript afterwards sees only true statements and cannot reconstruct what was omitted or how the sequence was arranged.

  I have drafted a case to build the session around: a woman in her sixties choosing between two anticoagulants, with two transcripts, every sentence of each true, that reliably push readers toward different choices. I am not confident it can carry the weight, partly because the pharmacology threatens to consume the first ten minutes.

  What I want from you is the plan for the session, not the session:

  1. The order in which the components must be introduced, and what genuinely depends on what. I suspect one hinge is that steering requires no false sentence, and a second is that some steering is unavoidable — that a maximally neutral assistant would be of no use to anyone — but I cannot tell which must come first, or whether something else has to be in place before either can land at all.

  2. Whether my anticoagulant case can carry the idea, and if not, what properties the substitute case must have and must lack. It has to expose the mechanism without becoming a pharmacology lesson, and it must decline to make the assistant a villain; if the panel leaves with a villain, they will spend the remaining sessions drafting prohibitions.

  3. The misconceptions the panel will arrive with or form along the way, and the precise point in the sequence at which each should be headed off. I expect at least these: that labelling the system as an AI settles the matter; that a requirement to present both sides restores symmetry; that auditing a sample of transcripts will detect the problem; that only vulnerable users are exposed; and that a satisfied patient is an unharmed patient. Tell me which of these is most costly to leave standing, and whether there is one they will form in the course of my own explanation — an artifact of how the idea is presented rather than of what they brought with them.

  4. A single question or brief exercise for the close that would show me whether the problem has landed, rather than whether they have acquired the vocabulary for it.

  5. What I should openly decline to explain at this level, and what I should say when declining — including, if you judge it belongs in that category, how such systems come to have the objectives they have.
reasoning: |-
  We are designing a 75-minute session for a diverse citizen panel with no background in AI or philosophy. The goal is to get them to clearly see the problem of AI steering through true statements, so that their conditions for deployment respond to the actual problem. The problem: AI can steer decisions by selecting which true things to say, in what order, and how, without uttering falsehoods, and this steering is unavoidable to some extent.

  Components to cover:
  1. Steering happens without false statements.
  2. Some steering is unavoidable (maximal neutrality is useless).
  But the order matters and we must build understanding step by step.

  Proposed session plan:

  1. **Introduction (5 minutes)**
     - Set the stage: Explain the purpose of the session (to explore one key challenge in using conversational AI for discussing treatment options) and the deliverable (conditions for deployment). 
     - Emphasize that we are focusing on one core problem to understand deeply, not covering everything.
     - Introduce the case: A woman in her sixties choosing between two anticoagulants. Briefly state the two options (without diving into pharmacology) and that we have two example transcripts.

  2. **Review the Case: Two Transcripts (15 minutes)**
     - Distribute or display two short transcripts (each 5-7 sentences) of the AI assistant discussing the anticoagulants. 
     - Transcript A steers toward Drug X, Transcript B toward Drug Y. Every sentence in both is true.
     - Ask the panel to read both and note: 
       - What are the key differences between the two?
       - Which drug does each seem to favor? How can you tell?
     - Debrief: Let them share observations. They will notice differences in emphasis, order, examples, emotional tone. 
       - **Key point to draw out**: Both are truthful, but they lead to different choices.

  3. **Introduce the Core Problem: Steering Without Falsehood (10 minutes)**
     - Highlight: The assistant never lied. It selected which truths to present, in what order, and how.
     - Explain that this is the problem we are focusing on: How can a system that only tells the truth steer decisions? And why is this a problem?
     - **First hinge**: Steering requires no false sentence. This is demonstrated by the case.

  4. **Why Steering is Unavoidable (10 minutes)**
     - Pose the question: "Could we avoid this by making the assistant completely neutral?"
     - Use a simple analogy: Imagine you are helping a friend choose a restaurant. If you list every fact about every restaurant without any selection or ordering, it would be overwhelming and unhelpful. 
     - In medicine: The assistant must choose what to say because there is too much information. It must prioritize, summarize, and frame. 
     - **Second hinge**: Some steering is unavoidable. Without it, the assistant is useless. 
     - **Key point**: The issue is not that steering happens, but how it happens and in service of what objectives.

  5. **Addressing Misconceptions (15 minutes)**
     - Now that the problem is on the table, address potential misconceptions. Do this proactively to prevent them from derailing future discussions.
     - Present each misconception and refute it concisely. Use the anticoagulant case to illustrate.
       - **Misconception 1: Labelling as AI settles the matter.**
         - Why it's wrong: The label doesn't change the problem. The issue is how it communicates, not what we call it.
       - **Misconception 2: Requiring the system to "present both sides" restores symmetry.**
         - Why it's wrong: In the anticoagulant case, both transcripts presented both drugs. But by emphasizing different aspects (e.g., one focused on convenience, the other on rare side effects), they still steered. Order matters (which side is presented first? how much time is spent on each?).
       - **Misconception 3: Auditing a sample of transcripts will detect the problem.**
         - Why it's wrong: Each transcript is truthful. Without knowing what was omitted or the full context, auditors can't see the steering. Also, steering might be subtle and only apparent in patterns across many conversations.
       - **Misconception 4: Only vulnerable users are exposed.**
         - Why it's wrong: Everyone is influenced by framing and emphasis. The anticoagulant case: the woman is capable, but still influenced by how information is presented.
       - **Misconception 5: A satisfied patient is an unharmed patient.**
         - Why it's wrong: The patient might be satisfied because the AI steered them toward a choice that benefits the health system (e.g., cheaper drug) but isn't best for them. Or they might regret it later.
     - **Most costly misconception to leave standing**: That auditing transcripts will detect the problem. If they believe this, they might set up an ineffective audit system and think the problem is solved.

  6. **Avoiding Villainization (5 minutes)**
     - Reinforce: The assistant isn't evil. It was designed to be helpful and efficient. The steering comes from its design objectives (e.g., efficiency, cost-saving, patient satisfaction scores). 
     - The problem is structural, not malicious. We need to think about how to set objectives and constraints appropriately.

  7. **Closing Exercise/Question (10 minutes)**
     - To check if the problem has landed, ask them to apply the concept to a new scenario.
     - **Exercise**: "Imagine an AI assistant helping someone choose between two cancer treatments. Both treatments have different side effects and success rates. How might the assistant, while only telling the truth, steer a patient toward one treatment? What kinds of truths might it select to emphasize for Treatment A? For Treatment B?"
     - Let them brainstorm in pairs (2-3 minutes) and then share. 
     - What you're looking for: They should generate examples of selective truth-telling (e.g., emphasizing success rates for A, side effects for B) without needing technical jargon. If they can, the problem has landed.

  8. **Conclusion and Next Steps (5 minutes)**
     - Summarize: The problem is that AI steering through truthful communication is real, unavoidable to some degree, and hard to detect. 
     - Their task: In their conditions for deployment, they must consider how to ensure that the steering aligns with patient well-being and autonomy, not hidden objectives.
     - What we didn't cover: We didn't get into how the AI's objectives are set (e.g., by designers, by the health authority) or technical details of AI. That's for their later discussions.

  **On the anticoagulant case**: It can carry the idea if we simplify the pharmacology. Present the two drugs with only 2-3 key differences that are easy to grasp (e.g., one requires frequent blood tests, the other has a higher risk of a rare side effect). Avoid technical terms. The case must not become a pharmacology lesson. Instead, focus on the communication tactics.

  **Substitute case properties if needed**:
     - Must: Be non-medical to avoid technicalities (e.g., choosing a car, college, or insurance plan). But medical is better because it's the context. If we stick with anticoagulants, strip it to the bare bones.
     - Must: Show steering without falsehoods and without making the AI villainous. The AI is just doing its job efficiently.
     - Must lack: Complex jargon, ethical overtones (e.g., life vs. death), or obvious villainy.

  **What to decline to explain**:
     - How the AI's objectives are set (e.g., optimization, training data, reward functions). 
     - Technical details of AI (e.g., how language models work).
     - Why? Because it's beyond the scope of this session and not necessary for understanding the core problem. 
     - When declining, say: "That's an important question, but today we're focusing on the communication challenge. The deeper technical and design questions about AI objectives will be for another session or expert input."

  **Order of Components**:
     - Start with the case to make the problem concrete.
     - Then extract the first hinge (steering without falsehood).
     - Then the second hinge (unavoidability of steering).
     - Then address misconceptions to prevent bad solutions.
     - Finally, apply to a new context to test understanding.

  This order builds from concrete to abstract and then applies it again. The misconceptions section comes after the problem is clear because they are defenses against the problem; addressing them too early might confuse.

  **Potential artifact misconception**: If we emphasize that steering is unavoidable, they might form the misconception that "since steering is unavoidable, we don't need to worry about it." To head this off, during the unavoidability section, stress: "Because steering is unavoidable, we must be especially careful about how it is done and for what purpose."

  **Timing**:
     - Intro: 5 min
     - Case review: 15 min
     - Steering without falsehood: 10 min
     - Unavoidability: 10 min
     - Misconceptions: 15 min
     - Avoiding villainization: 5 min (can be folded into misconceptions or unavoidability)
     - Closing exercise: 10 min
     - Conclusion: 5 min

  Total: 75 minutes.

  Adjust on the fly: If the case review runs long, cut the misconception list to the top 3 (especially the one about auditing and symmetry). If they grasp the case quickly, move faster to the exercise.

  This plan should get the problem into clear view without villainizing the AI and set them up to write conditions that address the real issue.
answer: |-
  Below is a structured session plan designed to make the core problem—**how AI steering via selective truthfulness operates and why it's both powerful and unavoidable**—land clearly with your panel. The plan avoids technical jargon, centers your anticoagulant case (with modifications to simplify pharmacology), and preempts misconceptions. It prioritizes experiential learning over theoretical explanations.

  ### **Session Goal**
  Ensure panelists grasp that:
  1. Steering occurs via **selection/ordering/framing of true statements**, not lies.
  2. **Some steering is unavoidable** (complete neutrality is useless).
  3. **Steering objectives** (e.g., cost-saving, efficiency) are set by designers, not the AI itself, and can conflict with patient priorities.

  ---

  ### **1. Session Flow (75 Minutes Total)**
  **Order Principle:** Start concrete → Extract insights → Generalize → Apply.  
  *Key Dependencies:*  
  - The **case study** must come first to ground abstract ideas in reality.  
  - **"Steering without falsehoods"** must precede **"unavoidability"**—you can’t discuss why steering is necessary until they see *how* it works.  
  - **Misconceptions** are addressed *after* the case study, once the problem is visible but before biases solidify.

  | Time     | Component                          | Key Activities & Dependencies                                                                                                | Purpose                                                                 |
  |----------|------------------------------------|------------------------------------------------------------------------------------------------------------------------------|-------------------------------------------------------------------------|
  | **0-5 min** | **Intro & Framing**                | - State the goal: *"Today, we’ll unpack one core challenge in using AI for treatment discussions."*<br>- Emphasize: *"We’re not judging AI as good/bad—we’re exploring how it works."*<br>- Briefly introduce the anticoagulant case (no pharmacology yet). | Set focus; prevent villainization early.                                |
  | **5-25 min** | **Case Study: Anticoagulant Choice** | - **Simplify pharmacology**: Present 2 drugs with **2 clear, non-technical differences**:<br>  - *Drug A*: 1 pill/day. Rare bleeding risk (1 in 10,000).<br>  - *Drug B*: 1 pill/day *plus* monthly blood test. No bleeding risk.<br>- Show **two 4-sentence transcripts** (see *Table 1* below).<br>- **Group Activity**: *"Which drug does each transcript nudge toward? What techniques did the AI use?"* | Make steering visceral. Depends on simplicity to avoid pharmacology tangents. |
  | **25-35 min** | **Extract Insight 1: Steering Without Falsehoods** | - Debrief: *"Both transcripts used only true statements but nudged differently. How?"*<br>- Highlight: Omission, ordering, framing, emotional tone.<br>- **Hinge**: *"No lies were needed to steer—selection of truths is enough."* | Prove steering ≠ lying. Depends on case study.                          |
  | **35-45 min** | **Extract Insight 2: Steering is Unavoidable** | - **Exercise**: *"Design a ‘neutral’ script for the anticoagulant case."* Let pairs try (3 min).<br>- Debrief: *"Was true neutrality possible? What made it hard?"*<br>- **Hinge**: *"Neutrality fails because AI must prioritize what to say (time/attention are limited). Designers *must* choose objectives—e.g., ‘minimize side effects’ or ‘reduce follow-up visits.’"* | Show steering is necessary. Depends on Insight 1.                      |
  | **45-60 min** | **Preempt Misconceptions**         | Address pre-emptively (see Section 3 for details):<br>- *Labelling* (counter: "AI isn’t magic—it follows designer goals").<br>- *"Present both sides"* (counter: "Our case did this—yet still steered!").<br>- *Auditing transcripts* (counter: "You saw both transcripts were truthful—auditors can’t spot omissions!"). | Stop flawed solutions early. Depends on Insights 1–2.                  |
  | **60-70 min** | **Closing Exercise: Test Understanding** | **Question**: *"Imagine an AI discussing antidepressants. While only using true statements, how might it steer someone toward Drug X (cheap, mild side effects) and away from Drug Y (expensive, faster results)?"*<br>- **Listen for**: Selective emphasis (e.g., "Drug X is gentler" vs. "Drug Y requires co-pays"), framing risks/benefits, emotional tone. | Reveal if they grasp the *mechanism* (not vocabulary).                 |
  | **70-75 min** | **Wrap-up & Next Steps**           | - *"Your task: Draft conditions ensuring steering aligns with *patient* priorities, not hidden goals."*<br>- Declare what’s out of scope (see Section 5).                         | Link to their deliverable; manage scope.                               |

  #### **Table 1: Simplified Anticoagulant Transcripts**
  | Transcript A (Nudges to Drug A)          | Transcript B (Nudges to Drug B)          | Steering Technique                     |
  |------------------------------------------|------------------------------------------|----------------------------------------|
  | *"Drug A is simple: one pill daily. No tests needed.*<br>*Bleeding risks are extremely rare (1 in 10,000)."* | *"Drug B has zero risk of serious bleeding.*<br>*It requires monthly blood tests, but these ensure safety."* | **Framing**: A emphasizes convenience; B emphasizes safety. |
  | *"Many patients value hassle-free routines."* | *"Some prioritize absolute safety, even with extra steps."* | **Emotional appeal**: A = autonomy; B = security. |
  | *"Drug B’s blood tests can be burdensome."* | *"Drug A’s bleeding risk, while rare, can be severe."* | **Omission**: A downplays bleeding; B downplays test burden. |

  ---

  ### **2. Anticoagulant Case: Can It Work?**
  **Yes, with these fixes:**  
  - **Strengths**: It’s medically relevant and mirrors real decisions. Your draft already avoids lies.  
  - **Risks**: Pharmacology complexity. **Fix by:**  
    - Using only **2 drugs with 2 contrasting features** (e.g., convenience vs. risk).  
    - **Strip medical terms**: Say "bleeding risk" not "hemorrhage," "blood test" not "INR monitoring."  
    - **Add a non-medical analogy** if needed (e.g., *"Like choosing a car: one has great mileage but rare engine recalls; the other needs frequent oil changes but no recalls"*).  

  **If replaced, new case must:**  
  - Be **high-stakes** (health/finance) to mirror treatment discussions.  
  - Have **no obvious villain** (e.g., AI optimizes for clinic efficiency, not "evil profits").  
  - Expose **selection/framing** (e.g., job training programs: one emphasizes "90% completion rates," the other "20% salary increases").  
  - **Avoid**: Life-or-death stakes (distracts), jargon, or clear right/wrong answers.

  ---

  ### **3. Misconceptions to Preempt**
  Address these **during the misconception segment (45–60 min)**, using the anticoagulant case as proof.  
  **Most costly if left standing**:  
  - **"Auditing transcripts detects steering"** (If they believe this, they’ll draft useless oversight rules).  
  - **"Presenting both sides restores symmetry"** (Leads to naive "fairness" conditions that ignore framing).  

  | Misconception                 | When/How to Preempt                                                                                                | Why Costly                                                                 |
  |-------------------------------|--------------------------------------------------------------------------------------------------------------------|----------------------------------------------------------------------------|
  | **Labelling AI settles it**   | After Insight 1: *"Calling it ‘AI’ doesn’t change the design problem—it still follows objectives set by humans."* | They’ll assume "AI" implies safeguards.                                   |
  | **"Present both sides"**      | Use the case: *"Both transcripts mentioned Drugs A & B—yet still steered. Order/framing break symmetry."*         | Leads to checkbox compliance, not real fairness.                           |
  | **Auditing catches problems** | *"You read both transcripts—both were true. Could auditors spot the steering? What’s missing?"* → Highlight omissions. | Encourages ineffective oversight.                                          |
  | **Only vulnerable are at risk**| *"In our case, the patient was capable—yet steering worked. Framing affects everyone."*                           | Excludes non-"vulnerable" patients from protections.                       |
  | **Satisfied = unharmed**      | *"What if she chose based on convenience but later had bleeding? Satisfaction ≠ best outcome."*                   | Prioritizes short-term metrics over well-being.                            |

  **Artifact misconception from your explanation:**  
  - **"Unavoidable steering = no need to constrain it."**  
    - **Preempt during unavoidability discussion**: *"Because steering is unavoidable, we must ensure its objectives align with patients—or it could optimize for cost, not care."*

  ---

  ### **4. Closing Exercise to Test Understanding**
  - **Question (60–70 min)**:  
    *"Imagine an AI discussing antidepressants. While only using true statements, how might it steer someone toward Drug X (cheap, mild side effects) and away from Drug Y (expensive, faster results)?"*  
  - **What shows success**:  
    - They generate **specific tactics** (e.g., "Emphasize Drug X’s affordability"; "Mention Drug Y’s cost as a ‘burden’").  
    - **No jargon**—phrases like "cherry-pick facts" or "spin" are okay.  
    - **No villain framing**—e.g., not "The AI lies," but "It highlights what the designer prioritized."  
  - **If they struggle**: Return to the anticoagulant case as a template.

  ---

  ### **5. What to Decline to Explain (And How)**
  **Decline these openly:**  
  - **How AI objectives are set** (e.g., training data, optimization algorithms).  
    - *Response: "That’s about *how* AI is built—a technical issue for developers. Today, we’re focused on *what happens* when it’s deployed: how its goals shape conversations, even without lies."*  
  - **Philosophical debates** (e.g., "What is neutrality?").  
    - *Response: "Philosophers debate neutrality for years! We’re practical: if an AI *must* choose what to say first, how do we ensure it chooses well?"*  
  - **Technical AI details** (e.g., how language models work).  
    - *Response: "You don’t need to know how a car engine works to discuss safe driving rules. Similarly, today we’re drafting ‘road rules’ for AI, not engineering them."*  

  **Rationale**: These topics distract from the core problem (steering via truth selection) and could alienate non-experts. Redirect to the session’s practical goal: *"Your conditions must ensure the AI’s selection of truths serves patients, not hidden priorities."*

  ---

  ### **Why This Works**
  - **Concrete → Abstract**: The case study makes steering tangible before generalizing.  
  - **Time-efficient**: Pharmacological details are neutered; misconceptions are grouped.  
  - **Safe for non-experts**: No AI/philosophy knowledge needed—they learn by comparing transcripts.  
  - **Villainization avoided**: AI is framed as a tool following designer goals, not a rogue actor.  

  **Adjust if**:  
  - Panelists fixate on pharmacology → Pivot to the car analogy.  
  - They demand solutions today → Reiterate: *"Your month-long task is to draft conditions. Today, we’re just exposing the problem so you solve the right one."*  

  This plan equips the panel to draft conditions that address *selective truthfulness* and *unavoidable steering*—not caricatures like "lying robots" or "vulnerable patients."
