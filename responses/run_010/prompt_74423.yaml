  ### Follow-Up Questions

  **1. Which axis is doing the most discriminating work in the ranking?**  
  Blindness (B) is the key discriminator. It scores low (0–4) for all items, dragging the min-total down to C tier for most. High-fidelity items (e.g., creed, lab SOP) still fail because B=0, showing that guided transmission prevents Darwinian dynamics. Vehicle (V) also discriminates by failing oral/behavioral items (e.g., ballad, recipe) due to V=0.

  **2. Redo tiers using the mean (not min) and describe changes. Which items move, and how far?**  
  Tiers based on mean: S (8–10), A (5–7.9), B (2–4.9), C (0–1.9). Changes are dramatic:  
  - **Moved from C to A tier**: Najdorf Sicilian (mean 6.5), Viral sound (6.75), Image-macro (6.25), Creed (6.0), Lab SOP (5.75), Precedent (5.75), HB tune (6.5).  
  - **Moved from C to B tier**: Folk ballad (3.5).  
  - **Remained in C tier**: Ghosting (0.75), Recipe (1.0), Rumor (0.75), HB practice (1.75).  
  - **Movement impact**: 7 items jumped to A tier (mean 5.75–6.75), revealing that mean aggregation masks low axes (especially B and V). The min rule is not "decoration"—it exposes bottlenecks (e.g., B=0 for many high-F/V items), while mean inflates scores by averaging. A "smallest repair" would be to weight axes (e.g., prioritize F and S), but min better captures Darwinian thresholds.

  **3. Which item shows the biggest scoring divide between memeticists (Dawkins) and attractor theorists (Sperber)? Which axis? Who's right and why?**  
  The **oral folk ballad (Item 2)** shows the biggest divide over **Blindness (B)**.  
  - **Memeticist (Dawkins)**: Would score B high (~8–10), viewing variations as random mutations that are then selected, making it Darwinian.  
  - **Attractor theorist (Sperber)**: Would score B low (0–2), arguing variations are guided by cognitive biases (e.g., memory, narrative appeal), not randomness.  
  **Who's right?** Sperber is right. Ballad variations are not blind; they are reconstructed to fit psychological attractors (e.g., repetitive structures for memorability), making transmission guided and non-Darwinian. Dawkins overemphasizes randomness, ignoring how cognition shapes culture.
