  ### Scoring Rubric
  - **F (Fidelity)**: 0 = pure reconstruction from memory/inference, 10 = error-corrected copying from a persistent template (e.g., text, recording).
  - **V (Vehicle)**: 0 = no durable object, pattern exists only in heads, 10 = physical artifact (e.g., book, file) does the transmitting.
  - **B (Blindness)**: 0 = variants are deliberately improved/guided, 10 = variants arise/are selected blindly (independent of fitness).
  - **S (Selection)**: 0 = selection based on host properties (e.g., status, demography), 10 = selection based on item properties (e.g., effectiveness, appeal).

