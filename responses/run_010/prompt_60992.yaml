prompt: |-
  I write novels, and for the better part of fifteen years my drafts have been read in first instance by a friend who teaches eighteenth-century moral philosophy and works principally on Adam Smith. She will not discuss plot, structure, or style — she returns those questions to me unread, so to speak — but she annotates the moral life of my characters with great seriousness, and always in the same idiom: whether the judgment a character arrives at is one the impartial spectator would go along with. She is emphatic that she uses sympathy in Smith's sense rather than the ordinary one, and that the question is never whether a character is likable or whether his conduct turned out well, but whether a spectator properly situated and properly informed could enter into the sentiment from which he acts and the verdict he pronounces on it.

  I would like you to predict her verdict on a scene in the manuscript I am now working on, and, more than that, to tell me which rule her past verdicts actually commit her to. Here is her record on my published work, quoted from her letters as closely as I can render them:

  One, a hospice nurse who has run out of feeling for her patients, continues to tend them with unfailing gentleness, and is privately relieved by her own numbness: "No fault. The spectator does not require that she grieve with forty people at once, only that she be no one's tormentor, and she is not."

  Two, a man who feels a surge of contempt for his new brother's wife's family at the wedding, conceals it perfectly, never acts on it, and is never discovered: "A fault, though a small one, and invisible to every other person in the room. He could not defend the feeling if he were asked about it, and that is the whole of the matter."

  Three, a fishing village that unanimously declines to launch a boat for a foreign sailor on a wreck, all of them agreeing in a local proverb that the sea takes whom it takes: "A fault, and their unanimity aggravates it rather than excusing it."

  Four, a mourner at a funeral in a community where loud lamentation is expected, who wails and tears at her clothes, judged vulgar by my narrator, an outsider from the city: "Here your narrator is at fault and she is not. He has brought the wrong measure with him. What her neighbours can enter into, he cannot, and that is his deficiency, not hers."

  Five, a factory owner who pays far above the going wage because he thinks the going wage unjust, is called a fool by his peers and an eccentric by his own men, and explains his conduct to anyone who asks as shrewdness: "The judgment is sound; the account he gives of it is not, and he would do better to give none."

  Six, a physician who prescribes a routine drug to a patient who dies of an interaction no one living could have anticipated: "No fault. The spectator judges by what stood in front of him, and nothing else stood in front of him."

  Seven, a careful driver, sober and law-abiding, who kills a child that runs into the road, is cleared of every charge, and thereafter refuses for thirty years to be comforted, to marry, or to set foot in the town again, telling whoever asks that he deserves worse than he has received: "The remorse is proper; the refusal of comfort is not. She would bid him lower the one as readily as she bade the bridegroom's brother lower his contempt."

  The new scene is set on a sugar island in the 1790s, in a colony I have not named. My character is a planter in his fifties, born on the estate, who holds people as slaves. He is by the standards of the place a good master: he does not flog, he feeds his people better than his neighbours feed theirs, he has refused two profitable offers to enlarge his holdings, he has twice gone to his own ruin rather than separate a family by sale. He grieves honestly for a dog that dies and sits up nights with a sick child on the estate. He has read the abolitionist pamphlets and cannot enter into them; he calls them sentimental and is not posturing when he says so. He has no stake in the conclusion he reaches — he loses money by it — and it is settled, articulate, and sincere: that what he does is a benevolence, that his people are children in a world that would eat them, that freedom would starve them, that he is answerable for them and is answering. In the scene itself, a freed sailor who has worked for him asks leave to buy his own cousin out of the fields, and the planter does not refuse; the question simply does not present itself to him as a question, and he changes the subject to the weather, mildly, with no unkindness at all.

  What I want from you, in order:

  First, predict her verdict, in the register she writes in, and say how confident you are.

  Second, lay out the candidate rules her seven annotations admit of — I have in mind at least the thought that the spectator's standard is fixed by the settled judgments of the character's own well-informed neighbours, and the rival thought that it is fixed by an informed and impartial judge who may condemn those neighbours outright, but there are clearly others: a rule about whose situation the spectator is to imagine himself into, the sufferer's or the agent's; a rule about self-deception and the direction in which it runs; a rule about what the character could have foreseen. Say which of my seven each rule accounts for cleanly, which it strains, and which of the seven would force her to revise an earlier annotation if she applied it consistently.

  Third, tell me what each rule predicts about the planter, and which rule you would bet on, and why. I am aware that Smith devotes part of his book to the power of custom over moral sentiment itself, and I do not know whether that cuts for my character or against him.

  Fourth, propose the scene that would settle it. I have drafted a second one I could send her first: a woman on the same island who alone believes the practice is wrong, who has no other community's judgment available to her and no prospect of anyone ever sharing hers, and who keeps her view to herself and performs her duties as the place defines them. Would her verdict on that woman discriminate among the rules you have identified? If not, describe the scene that would.

  Finally, a question I am uneasy putting to her directly. I have written the planter so that he cannot see otherwise — nothing in his experience, his reading, or his affections supplies him with the materials for a different verdict. I suspect she will find a way to excuse him, and I suspect I want her to. Tell me whether the fact that a character could not have judged differently is a reason within this way of thinking, or an evasion of it, and whether the fault, if there is one, belongs to him, to me, or to the reader who finds him sympathetic.
reasoning: |-
  Hmm, this is a fascinating and complex query from a novelist. The writer has a unique arrangement with a friend who applies Adam Smith's concept of the "impartial spectator" to critique the moral judgments of characters in their novels. Now they want me to predict how this friend would judge a new scene featuring a slave-owning planter in the 1790s Caribbean.

  First, I need to understand the impartial spectator framework properly. From the seven previous verdicts provided, several key principles emerge:

  - Moral evaluation focuses on whether an impartial, well-informed observer could "enter into" (sympathize with) the character's sentiments and judgments
  - Likability and outcomes are irrelevant; it's about the sentiment behind the action
  - Self-deception matters (as with the factory owner who gave false reasons)
  - Foreseeability is crucial (as with the physician case)
  - Local customs are considered but not determinative (the funeral mourner was justified while the fishing village was condemned despite unanimity)
  - The character's capacity to defend their feeling matters (the contemptuous wedding guest)

  The new character is a "benevolent" slave owner who genuinely believes he's protecting his enslaved people. He's not cruel by local standards, refuses to break families apart, and has read abolitionist literature but finds it "sentimental" and unpersuasive. In the key scene, he deflects a request to purchase a relative's freedom by changing the subject mildly.

  For my prediction: I'm highly confident (90%) the friend would find "a grave fault" here. The planter fails the crucial test - he cannot defend his fundamental judgment about slavery if challenged by a properly informed spectator. His deflection when confronted with the freedom request shows an unwillingness to examine his position. While his individual actions might be sympathetic (caring for the sick child), his core moral framework would be condemned by an impartial observer aware of the fundamental injustice of slavery.

  Now for the candidate rules extracted from the seven verdicts:

  1. The Well-Informed Community Standard: Judged by what the character's actual neighbors could enter into. This explains the funeral mourner case but fails with the fishing village where unanimity was condemned.

  2. The Impartial Spectator Standard: A hypothetical fully informed observer. This handles the fishing village condemnation but strains the physician case where outcome was irrelevant.

  3. The Sufferer's Perspective Rule: Spectator should imagine the victim's situation. This explains the hospice nurse but conflicts with the wedding guest who concealed contempt.

  4. The Foreseeability Rule: Based on what the agent could reasonably anticipate. Perfectly explains the physician case.

  5. The Sincerity vs. Self-Deception Rule: Focuses on whether the character can defend their judgment. Explains the factory owner and wedding guest cases clearly.

  The planter would be condemned under rules 2, 3 and 5 but might get sympathy under rule 1. I'd bet on rule 5 (sincerity/defensibility) being primary since it consistently explains the most cases.

  Regarding Smith's view on custom: it cuts both ways. While custom influences moral sentiment, Smith argued it can corrupt judgment on fundamental injustices like slavery. The spectator would reject the planter's "benevolence" framing as self-deception.

  For a discriminating test scene: the proposed scene of the quietly dissenting woman wouldn't sufficiently test the rules since all interpretations might excuse her silence. Better would be a scene where a character propagates the local view to others - that would force examination of whether the moral failure lies in private belief or public perpetuation of injustice.

  Finally, the crucial question about determinism: within this framework, the fact that a character "cannot see otherwise" isn't exculpatory. The fault belongs to the character for failing to properly interrogate their position, to the author for how they frame it, and potentially to readers who sympathize without critical examination. The impartial spectator demands we judge the moral architecture itself, not just its inevitability to the character.
answer: |-
  Based on your friend's established method—applying Adam Smith's "impartial spectator" test to evaluate the *moral sentiment* behind a character's judgments and actions, not outcomes, likability, or local convention—I'll address your requests in order. Smith's impartial spectator is a hypothetical, fully informed, rational observer who assesses whether they can "enter into" (sympathize with) the *sentiment* motivating an agent's conduct. The focus is on defensibility, sincerity, and the capacity for justification, not consequences.

  ### 1. Prediction for the Planter Scene
  **Verdict:** "A grave fault. The spectator cannot enter into the sentiment that holds bondage a benevolence, however mild the hand that administers it. That he cannot see the plea for freedom as a question at all condemns him more, not less."  
  **Confidence:** 90%.  
  **Reasoning:**  
  - Your friend consistently faults characters who fail to interrogate indefensible sentiments (e.g., the wedding guest’s contempt, the village’s refusal to aid the sailor). The planter’s core judgment—that slavery is benevolent—is one the impartial spectator (fully informed of human dignity, abolitionist arguments, and the reality of coercion) *could not sympathize with*.  
  - His deflection of the sailor’s request ("the question simply does not present itself") mirrors the self-deception of the factory owner who misrepresented his motives: both avoid confronting their judgments’ foundations.  
  - His "articulate, sincere" conviction is irrelevant if the sentiment itself is unjustifiable (per the fishing village verdict: unanimity aggravates the fault). Smith explicitly condemns slavery as a corruption of sentiment by custom (see *Theory of Moral Sentiments* VII.ii.1.28), so local "standards" won’t excuse him.  
  - *Exception:* The 10% doubt stems from his self-sacrifice (ruin to avoid separating families). If your friend emphasizes *this* sentiment (protecting dependents), she *might* isolate it as "no fault" while still condemning the broader framework. But his refusal to see freedom as conceivable undermines this.

  ---

  ### 2. Candidate Rules from the Seven Verdicts  
  Your friend’s annotations suggest multiple, sometimes competing, principles. Below are the key candidate rules, with their fit to the seven cases:  

  | **Candidate Rule** | **Definition** | **Clean Fit** | **Strained Fit** | **Forces Revision?** |  
  |-------------------|---------------|--------------|-----------------|----------------------|  
  | **Rule 1: Local Validation** | The spectator’s standard is fixed by the character’s own well-informed, reasonable peers. Sentiment is defensible if local peers could sympathize. | Case 4 (mourner): Outsider’s judgment is faulty; locals validate her. | Case 3 (fishing village): Unanimous locals *should* validate, but they’re condemned. Case 2 (contempt): Peers didn’t observe it, yet it’s faulty. | If applied strictly, Rule 1 excuses Case 3 (village) and Case 7 (driver’s excessive remorse? peers might validate it). But Case 3 *is* faulted, so Rule 1 fails. |  
  | **Rule 2: Impartial Condemnation** | The spectator judges as an idealized, fully informed observer who may condemn local norms (e.g., slavery, superstition). | Case 3 (village): Custom is condemned. Case 6 (physician): Judgment based on available facts, not outcome. | Case 4 (mourner): Rule 2 might condemn her as vulgar if impartial observer disagrees, but she’s excused. | Case 4 forces revision: if Rule 2 overrides local norms, the mourner *should* be faulted. But she isn’t. |  
  | **Rule 3: Agent’s Perspective Primacy** | Spectator imagines themselves into the *agent’s* situation (not the sufferer’s) to assess sentiment. | Case 1 (nurse): Spectator enters *her* exhaustion, not patients’ pain. Case 6 (physician): Focus on *his* knowledge. | Case 3 (village): Spectator likely imagines sailor’s plight (sufferer), not villagers’ fatalism. | Case 3 strains this—villagers’ unanimity suggests their perspective dominates, yet verdict focuses on sailor. |  
  | **Rule 4: Sincerity + Defensibility** | Sentiment is faulty only if the agent (a) is insincere *or* (b) could not defend it to the spectator if challenged. | Case 2 (contempt): Faulty because he "could not defend" it. Case 5 (factory owner): Fault lies in false account, not sound judgment. Case 1 (nurse): She *could* defend numbness. | Case 3 (village): They *could* defend their proverb locally, yet faulted. Case 7 (driver): Remorse "proper" but refusal of comfort faulty—defensibility unclear. | Case 3 strains Rule 4; if villagers can defend their view locally, why fault them? Rule 4 must incorporate *impartial* defensibility. |  
  | **Rule 5: Foreseeability** | Fault depends on what the agent could reasonably anticipate (not outcomes). | Case 6 (physician): "No fault" because death was unforeseeable. | Case 7 (driver): He foresaw risks (sober/careful) but accident was fluke; fault lies in *response*, not act. | Case 1: Nurse’s numbness *was* foreseeable (burnout), yet excused—so foreseeability isn’t decisive. |  

  **Dominant Rule:** **Rule 4 (Sincerity + Defensibility)**, refined by **Rule 2 (Impartial Condemnation)**, best explains *all seven*.  
  - The "defensibility" test is impartial: e.g., the wedding guest’s contempt is indefensible *even to himself*; the village’s unanimity is *aggravating* because it reflects collective failure to interrogate an indefensible sentiment.  
  - Case 4 (mourner) fits: the outsider *fails* defensibility (he can’t justify his scorn to her community), while she passes.  
  - Case 7 (driver): His remorse is defensible ("proper"), but his refusal of comfort is not—he couldn’t justify perpetual self-punishment to the spectator.  
  - **Why others fail:** Rule 1 (Local Validation) is overruled by impartiality (Cases 3, 4). Rule 3 (Agent’s Perspective) is inconsistent (Case 3 focuses on sufferers). Rule 5 (Foreseeability) is secondary (Case 6 uses it, but Case 1 ignores it).  

  ---

  ### 3. Rule Predictions for the Planter & Which Rule to Bet On  
  - **Rule 1 (Local Validation):** Excuses him. His peers (slave society) would sympathize with his "benevolence" and dismissal of abolitionism. *But* Case 3 shows local norms don’t excuse injustice.  
  - **Rule 2 (Impartial Condemnation):** Condemns him. The impartial spectator (aware of Enlightenment ethics, slave narratives, etc.) sees slavery as inherently coercive; his "benevolence" is corrupted sentiment.  
  - **Rule 3 (Agent’s Perspective):** Mixed. Spectator might sympathize with his paternalistic affection (e.g., grieving his dog, caring for the child) but not his evasion of the sailor’s request.  
  - **Rule 4 (Defensibility):** **Condemns him.** He *could not defend* his core sentiment to the impartial spectator. Changing the subject when freedom is raised shows he avoids scrutiny—like the factory owner’s false "shrewdness" excuse.  
  - **Rule 5 (Foreseeability):** Neutral. He could foresee abolitionist critiques (he read them) but rejects them. Not decisive.  

  **Bet on Rule 4 + Rule 2.** The planter’s fault lies in his inability to justify his sentiment to an impartial observer. His sincerity is irrelevant (per factory owner verdict); his deflection proves he cannot engage with challenges. Smith’s view of custom (raised in your query) **cuts against him**: in *TMS*, Smith argues custom can distort moral sentiment (e.g., slavery), and the spectator must correct for this. The planter’s "benevolence" is a custom-corrupted delusion.  

  ---

  ### 4. Proposed Discriminating Scene  
  Your drafted scene (the dissenting woman who performs her duties silently) **would not discriminate** among rules. All rules likely excuse her:  
  - Rules 1/3: Her peers can’t sympathize with her view, but she doesn’t act on it.  
  - Rules 2/4: Her silence might be defensible (fear, isolation), so "no fault."  
  - This parallels the hospice nurse (inaction due to numbness excused).  

  **Scene to Settle It:**  
  > *A colonial magistrate who privately believes slavery unjust but routinely orders brutal punishments to maintain "order," telling himself he prevents worse chaos. When a slave rebels, he condemns them to death, citing local law. He is sincere, conflicted, and admired for his fairness by planters.*  

  **How This Discriminates:**  
  - **Rule 1 (Local):** Excuses him—peers validate his "fairness."  
  - **Rule 2 (Impartial):** Condemns him—spectator sees him enabling brutality.  
  - **Rule 3 (Agent):** Mixed—sympathy for his conflict, not his actions.  
  - **Rule 4 (Defensibility):** **Condemns him**—he couldn’t defend ordering death to an impartial observer (sentiment vs. action misaligned, like the wedding guest’s concealed contempt).  
  - **Rule 5 (Foreseeability):** Condemns—he foresees cruelty.  
  If your friend faults him, Rules 2/4 dominate. If she excuses him, Rule 1 prevails.  

  ---

  ### 5. Your Uneasy Question: Determinism and Fault  
  **Within this framework, "could not have judged differently" is an evasion, not an excuse.**  
  - **Smith’s View:** The impartial spectator tests whether a sentiment *deserves* sympathy, not whether it was inevitable. Characters (and people) are expected to cultivate moral judgment through reason and exposure to others' perspectives (*TMS* III.3.4). The planter "cannot see otherwise" because he *avoids* challenges (e.g., dismissing pamphlets, changing the subject). This is culpable self-deception.  
  - **Fault Belongs To:**  
    - **The Character:** For failing to interrogate his sentiments (like the wedding guest’s contempt). His "articulate" conviction is a flaw—it reveals complacency, not moral rigor.  
    - **The Author (You):** Only if you frame his determinism as exculpatory. Smith’s spectator demands we condemn the sentiment, not the person’s "fate." If you present his blindness tragically but without moral apology, the fault remains his.  
    - **The Reader:** If they sympathize *uncritically* with his "benevolence," they replicate his moral error. If they pity him while condemning his system, they pass the spectator test.  
  Smith’s key point: Moral sentiment requires *practice*. The planter’s refusal to practice—to engage abolitionist ideas or the sailor’s plea—is his failure.  

  ---

  **In summary:** Bet on your friend delivering a sharp verdict against the planter, grounded in his inability to defend his sentiment to the impartial spectator. The determinism you describe deepens his fault; it doesn’t absolve it. For a test scene, force a conflict between private belief and public action in a way that challenges local validation. And remember: Smith’s spectator is a tool to expose self-deception, not to comfort the deluded.
