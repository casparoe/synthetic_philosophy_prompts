answer: |-
  Below is a branching questionnaire designed for your workshop, adhering to all constraints: 7-9 items drawn from borderline cases, no named criteria/philosophers/isms, self-contained scenarios, and at least two branches addressing the "scientific vs. pseudoscientific" distinction. The scoring key maps answers to seven positions, identifies separators, flags indistinguishable pairs, and diagnoses unoccupied combinations.

  ---

  ### **Questionnaire Items**  
  *(Each item is a standalone scenario; participants select one option.)*  

  1. **Machine Learning Model**  
     A predictive algorithm used in medical diagnostics consistently outperforms doctors. Its internal decision process is opaque ("black box"), but its predictions save lives. Should this model be trusted for critical decisions?  
     - A. Yes—its reliability matters more than understanding *how* it works.  
     - B. No—without understanding its mechanism, we risk catastrophic errors.  

  2. **Epidemiological Model**  
     Researchers fit a model to early outbreak data. When the outbreak evolves as projected, they claim it "predicted" the outcome. Is this valid?  
     - A. Yes—it matches real-world data, proving its accuracy.  
     - B. No—it was tailored to the data, so it’s circular, not a true prediction.  

  3. **Fundamental Physics Programme**  
     A theoretical framework generates profound new mathematics but has produced no testable predictions for decades. Should it retain funding?  
     - A. Yes—its intellectual contributions justify continued exploration.  
     - B. No—science requires empirical predictions, not just theoretical elegance.  

  4. **Nutritional Correlation**  
     A study finds people consuming food X have lower heart disease rates, but no mechanism explains this link. Should X be recommended for heart health?  
     - A. Yes—the correlation is strong enough to act upon.  
     - B. No—without a causal mechanism, it’s premature and possibly coincidental.  

  5. **Historical Science (Cretaceous Extinction)**  
     The asteroid-impact theory explains dinosaur extinction through evidence like iridium layers and fossil patterns. It makes few new predictions but coheres with existing data. Is this robust science?  
     - A. Yes—coherence across diverse evidence is compelling.  
     - B. No—science must generate testable predictions, not just fit known facts.  

  6. **Commercial Personality Assessment**  
     A popular corporate personality test sells well and "feels accurate" to users, but its methods are proprietary and unpublished. Is it scientific?  
     - A. Yes—its real-world utility and user satisfaction validate it.  
     - B. No—secrecy and lack of independent verification invalidate it.  

  7. **Energy-Field Therapy**  
     A treatment claims to heal by manipulating "energy fields," supported only by patient testimonials (no controlled studies). Is it pseudoscience?  
     - A. Yes—untestable concepts and anecdotal evidence are unscientific.  
     - B. No—patient outcomes matter, and new ideas deserve exploration.  

  ---

  ### **Scoring Key**  
  *Map answer patterns (e.g., 1A, 2B, ...) to named positions:*  

  | Position                              | Answer Pattern                                  | Key Separator Item |  
  |---------------------------------------|------------------------------------------------|---------------------|  
  | **Strict falsificationism**           | 1B, 2B, 3B, 4B, 5B, 6B, 7A                   | Item 5 (rejects non-predictive theories) |  
  | **Falsificationism + Duhem-Quine**    | 1A, 2B, 3A, 4A, 5A, 6B, 7A                   | Item 3 (accepts non-predictive programmes if coherent with broader knowledge) |  
  | **Lakatosian research programmes**    | 1A, 2A, 3A, 4A, 5A, 6B, 7A                   | Item 2 (accepts "circular" models if part of a progressive programme) |  
  | **Kuhnian puzzle-solving**            | 1A, 2A, 3A, 4B, 5A, 6B, 7A                   | Item 4 (rejects mechanism-free correlations as anomalies) |  
  | **Feyerabendian anarchism**           | 1A, 2A, 3A, 4A, 5A, 6A, 7B                   | Item 7 (rejects denunciation of non-traditional ideas) |  
  | **Laudan-style deflationism**         | 1A, 2B, 3A, 4A, 5A, 6B, 7A                   | *(Indistinguishable from Lakatos—see below)* |  
  | **Bayesian confirmation theory**      | 1A, 2B, 3B, 4B, 5A, 6B, 7A                   | Item 4 (requires mechanistic priors for correlations) |  

  ---

  ### **Analysis**  
  1. **Indistinguishable Pairs**  
     - **Lakatosian programmes vs. Laudan-style deflationism**: Both occupy `1A, 2B, 3A, 4A, 5A, 6B, 7A`. The questionnaire cannot separate them (Laudan’s "problem-solving" and Lakatos’ "progressive/degenerative" criteria converge on these cases).  
     - *Diagnosis*: Laudan and Lakatos overlap when a programme is empirically progressive *and* problem-solving—no item forces divergence.  

  2. **Unoccupied Answer Combinations**  
     | Combination     | Diagnosis                          |  
     |-----------------|------------------------------------|  
     | `[Any pattern with 7A + 6A]` | **Incoherent**: Denounces energy therapy (7A) but accepts secretive personality tests (6A) without a clear epistemic boundary. |  
     | `1B, 2A, 3A, 4A, 5A, 6B, 7A` | **Unexplored**: Rejects reliable ML (1B) but accepts non-predictive physics (3A) and historical science (5A). No major position combines these. |  
     | `1A, 2B, 3B, 4A, 5B, 6B, 7A` | **Merely unattractive**: Accepts mechanism-free nutrition (4A) but rejects historical science (5B), despite both relying on coherence over prediction. |  

  ---

  ### **Design Notes**  
  - **Branching Logic**: Two items (6 and 7) explicitly address the "scientific vs. pseudoscientific" distinction the audience collapses, forcing participants to confront denunciation (e.g., "useful but secretive" vs. "testimonial-based").  
  - **Accessibility**: Scenarios supply relevant facts (e.g., "no mechanism" in Item 4, "proprietary methods" in Item 6), requiring no prior philosophical knowledge.  
  - **Separation Power**: Feyerabend (Item 7) and strict falsificationism (Item 5) are cleanly isolated; Bayesianism (Item 4) and Kuhn (Item 4) diverge on mechanism-dependence.  
  - **Edge Cases**: Unoccupied combinations reflect tensions (e.g., accepting/complaining about secrecy in Item 6) or positions without adherents.  

  This instrument efficiently sorts participants while stimulating debate on real-world borderline cases. Participants receive a position "label" only after answering, ensuring responses reflect case-based reasoning, not preconceived labels.
