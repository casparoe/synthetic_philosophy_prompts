prompt: |-
  I sit on the description working group at a state archives and we've been deadlocked for about a year on one narrow policy question: can a catalog note point out what *isn't* in a collection? Think of a 40-year institution whose records were accessioned more or less whole, and contain almost nothing from the people it administered.

  Camp A says no. Their line: description records what the creator made and why, that's what gives the record its evidential value — and absence claims are speculation anyway, the letters might never have been written, might have been burned by the recipients, might have rotted, we don't know. Flagging a "silence" is politics smuggled into metadata.

  Camp B says the neutrality is the illusion. Appraisal already decided whose paper survives, description inherits that decision, and "there's no correspondence from the governed" is a checkable fact about the boxes in front of us, not an editorial.

  The part that bugs me: they agree on every fact. Both grant recordkeeping is selective, both grant the specific gaps, nobody disputes the history of the institution. And still nobody moves an inch.

  My hypothesis, offered only as a hypothesis: this isn't sloppiness about the word "neutral," and it isn't a hidden factual question either — the camps give different answers to what a description is *for*, one treating it as evidence of the creating activity, one as an epistemic resource for whoever reads it later, so they're argueing past each other under a shared label. Is that right? If not, what's the disagreement really about, and what would move it — a distinction, a pilot collection, a reframing of the question, or nothing, in which case tell me why nothing.

  Last line should start with "Verdict:" and then exactly one of: verbal / factual / different-questions / bedrock intuitions / ill-posed, with five words max of gloss.
reasoning: |-
  Okay, let's tackle this archives description debate. The user presents a fascinating deadlock between two camps with identical factual understanding but irreconcilable positions. 

  First, unpacking the camps' arguments: Camp A's evidential purity stance feels almost archival-fundamentalist - their terror of inserting modern bias is palpable. Yet Camp B's "neutrality is illusion" counter feels painfully true, especially after decades of critical archival scholarship. 

  Noticing how both sides actually agree on the selective nature of recordkeeping makes this more intriguing. The user's hypothesis about divergent purposes resonates - it's not what metadata is, but what it should do. Camp A wants a forensic lens focused solely on creator intent, while Camp B demands a research telescope showing the full epistemological landscape.

  What's beneath that? Probably deeper intuitions about power. Camp A fears activist overreach corrupting evidence; Camp B fears complicity in systemic silencing. That's why facts don't move them - it's about archival ethics in a post-colonial world.

  The "verdict" formulation is clever. "Bedrock intuitions" fits because their unspoken axioms about institutional duty differ. Camp A's duty is to preserve creator context inviolate; Camp B's is to equip researchers against systemic gaps. Neither wrong, but incompatible.

  For movement... maybe frame it as risk management? Camp A's approach risks perpetuating silences; Camp B's risks over-interpretation. A pilot could test if "negative description" actually causes harm or enables research. But honestly? This feels like a values choice needing leadership arbitration. The deadlock itself reveals archives as contested space - which is exactly what both camps care about, differently.
answer: |-
  Your diagnosis is perceptive. The core disagreement stems from **fundamentally different intuitions about the archivist's primary duty and the nature of archival description itself**, despite shared factual ground.

  *   **Camp A's bedrock intuition:** Description is an *objective witness* to the creator's actions and recordkeeping system. Its duty is fidelity to the creator's context, avoiding any external commentary (like perceived absences) that isn't an inherent part of that system's evidence. Injecting absence notes risks editorializing and distorting evidential value.
  *   **Camp B's bedrock intuition:** Description is a *critical tool for users* to understand the historical record *as it exists now*. Its duty includes mitigating the inherent biases of the historical record and appraisal process by making significant, verifiable silences visible. Omitting known absences is itself a political act of omission.

  **Why facts don't resolve it:** Both sides agree on *how* the gap occurred (appraisal, destruction, etc.). The disagreement is over whether describing the *consequence* of that gap (the verifiable absence *in the current collection*) is:
  1.   (Camp A) An unacceptable departure from describing the creator's activity/record, or
  2.   (Camp B) An essential act of accurate description of the *archival resource itself*.

  **Moving Forward (Possibly):** A reframing *might* help:
  1.   **Focus on User Need & Verifiability:** Frame the note *strictly* as a factual statement about the collection's *current content* ("This collection contains no correspondence received from individuals administered by Institution X between 19XX-19XX"), explicitly avoiding speculation on *why*. This addresses Camp A's fear of editorializing while meeting Camp B's need to flag the gap.
  2.   **Pilot & Evidence:** Propose a pilot project on a specific collection. Draft sample notes adhering strictly to verifiable absence. Solicit user feedback (researchers, historians) on whether such notes were helpful, harmful, or neutral to their work. Did it cause misinterpretation (as A fears) or aid understanding (as B hopes)? Evidence might sway opinions.
  3.   **Acknowledge the Values Conflict:** Explicitly state that the disagreement rests on prioritizing different archival values (Creator Context/Evidential Purity vs. User Context/Representational Honesty). A policy decision requires choosing which value takes precedence *in this specific case*, acknowledging the trade-off.
  4.   **Hierarchy of Description:** Could the note reside in a less "neutral" layer? (e.g., a collection-level "Research Considerations" note instead of the core Scope & Content?) This compartmentalizes the contested information.

  **Verdict:** bedrock intuitions (duty clash)
