prompt: |-
  I help run research oversight at a children's hospital and I'm redrafting our assent policy, and the more I stare at the current one the less I can tell what it thinks it's doing. Roughly what we do now: for anything a kid undergoes as part of their actual clinical care -- a lumbar puncture, a chemo regimen, a central line -- the parents consent, the 14-year-old is asked, and if the kid says no we write it up in the chart, we "document and consider" it, we send in a child life specialist, maybe we delay a day, and then the procedure happens anyway. For the optional stuff bolted onto research -- an extra 5ml during a stick that's happening regardless, a questionnaire arm, a genetics sub-study -- the same 14-year-old's no ends it on the spot. No override, no appeal, no ethics consult, we just don't do it. We also administer a maturity/capacity screen to everyone over 12 and score it, and for what its worth I have never once seen that score change a decision. And then, separately, the same institution will treat a 16-year-old as having sole authority to consent to contraception or STI treatment under state law, which cuts against the age-line logic everywhere else in the building.

  So what theory of consent is this practice actually running on? I want you to reconstruct the implicit view rather than tell me the rules are messy -- what has to be true about consent, competence, and whose say-so counts for the split between the lumbar puncture and the extra blood draw to make sense? Which of the obvious candidates is it committed to: consent as authorization to use someone's body, consent as protection of the vulnerable, assent as a way of building a kid's developing agency, or assent as trauma reduction and institutional cover? And which rival views does the practice quietly rule out -- say a straight capacity view where the threshold is decision-specific competence rather than age and benefit, or a view on which the wrong is the non-consensual use of the person at all, or a view where a child's refusal matters exactly as much as their agreement?

  Also: is the split tracking the child's interests, the child's will, or our exposure, and does the fact that the capacity score never bites show that we don't really believe capacity is the relevant thing? Tell me which parts the policy strictly presupposes versus which it merely fits comfortably with, and where it's underdetermined so that several different theories would license the exact same document. Then, if we swapped in the capacity view -- one assessment per decision, no age tiers, no benefit-based carve-out -- what would concretely have to change, and what would we be giving up to to get it?
reasoning: |-
  Okay, the user is involved in research oversight at a children's hospital and is redrafting their assent policy. They've described a complex current practice that seems inconsistent on the surface, and they want to understand the underlying theory of consent that makes sense of it all. 

  First, I need to unpack their current system. They have different rules for clinical procedures versus research add-ons, and a maturity assessment that never seems to matter. Plus there's that confusing bit about 16-year-olds having sole consent for contraception under state law. The user is clearly frustrated by the apparent contradictions and wants to identify the implicit logic before revising the policy.

  Hmm... the key seems to be that "no" carries different weight depending on context. For essential clinical care, a child's refusal gets documented and maybe delayed, but ultimately overridden. For optional research components, refusal is absolute. That suggests the policy isn't really about the child's decision-making capacity per se - if it were, the maturity screen would actually be used. 

  The more I think about it, the more this looks like a hybrid model where benefit-risk calculus determines whose will prevails. In high-benefit scenarios (clinical care), parental authority trumps the child's autonomy. In low-benefit scenarios (research extras), the child's autonomy gets full expression. The maturity assessment is probably just theater - something to point to defensively rather than a real capacity test.

  The contraception exception is fascinating because it reveals what's really driving this: institutional exposure. When state law grants autonomy, the hospital follows because the legal risk is clear. Where law is silent, they default to this benefit-based hierarchy. That maturity screen? Likely exists so they can claim they assessed capacity if ever challenged, even though nobody uses it.

  If they wanted to switch to a pure capacity-based model, they'd need to overhaul everything: ditch the age cutoffs, make assessments decision-specific, and actually honor refusals even for beneficial procedures when capacity is established. But that would mean sometimes denying care against parental wishes - which is why their current system quietly avoids that possibility.

  The user's asking all the right questions. They sense the policy's theoretical incoherence and want to rebuild it on firmer ground. I should acknowledge how perceptive their analysis is while helping them see what their current practice reveals about unstated institutional priorities.
answer: |-
  Based on your detailed description, your current policy implicitly runs on a **Hybrid Theory of Consent that Prioritizes Parental Authority for Therapeutic Interventions & Child Autonomy for Non-Therapeutic Research Burdens, Framed Within a Risk-Benefit and Legal Liability Framework.**

  Here's the deconstruction:

  ### The Implicit Theory & Its Commitments
  1.  **The Core Split (LP/Chemo vs. Extra Blood/Questionnaire):**
      *   **Benefit/Risk Threshold:** The policy fundamentally distinguishes between interventions perceived as *therapeutically necessary/beneficial* vs. *non-therapeutic research burdens*. For the former, the child's refusal is overridable; for the latter, it's absolute.
      *   **Parental Primacy in Therapy:** For therapeutic clinical care (LP, chemo, line), parental consent is the primary authorization. The child's assent process serves **primarily trauma reduction and institutional cover ("document and consider," child life, delay)**. The underlying view is that parents have the right and responsibility to authorize essential medical care for their child, even against the child's will, *because* it's for the child's ultimate benefit. Refusal isn't respected as an autonomous choice, but as distress to manage.
      *   **Child Sovereignty Over Pure Research Burden:** For optional research procedures offering no direct benefit (extra blood, questionnaires, substudies), the child's refusal is absolute. This treats the child's body and participation as their own domain *when no countervailing therapeutic benefit exists for the parent/physician to invoke*. Here, consent functions **as authorization to use someone's body**. The policy implicitly recognizes that subjecting a child to *any* non-beneficial procedure without their agreement is a fundamental wrong.
      *   **Ruling Out:** This rules out:
          *   A pure **"non-consensual use is always wrong"** view (would prohibit overriding refusal for LP).
          *   A **"child's refusal matters equally to agreement"** view (agreement isn't formally required for LP, refusal is overridden; refusal *is* decisive for research).
          *   A consistent **capacity-based view** (the capacity score is irrelevant, age 14 is the arbitrary trigger regardless of actual capacity or benefit).

  2.  **The Role of Age (14) & Capacity Score:**
      *   **Age as Proxy, Not Capacity:** The age of 14 is a bright-line proxy for *some* level of moral consideration ("old enough to have a say worth documenting, but not worth vetoing therapy"). The capacity score's irrelevance proves it's **not the foundation**. The policy *strictly presupposes* that **chronological age, not assessed decision-specific capacity, is the primary trigger for initiating the assent *process***. The capacity screen is likely a CYA measure ("we assessed") or an artifact of an earlier, abandoned intent.
      *   **Ruling Out:** This rules out a **genuine capacity-based model** where the ability to understand *this specific decision* determines the weight of assent/refusal, regardless of age or benefit.

  3.  **The Contraception/STI Exception (16-year-olds):**
      *   **Legal Mandate Trumps Internal Logic:** This exception highlights that the core policy is **not primarily driven by a coherent philosophical view of child competence or consent**, but by **compliance with external mandates**. State law dictates sole authority here, exposing that the age tiers elsewhere are institutional choices, not moral necessities. It underscores that the building's general logic *is* undercut by this exception.
      *   **Tracking Exposure:** This element most clearly tracks **legal exposure and liability**. The hospital complies with state law to avoid sanctions.

  4.  **What's Being Tracked?**
      *   **Child's Interests:** Primarily tracked in the *clinical* side (overriding refusal for LP is justified for *their* benefit). Minimally tracked in research (avoiding non-beneficial burdens).
      *   **Child's Will:** Primarily tracked *only* for non-therapeutic research burdens. Suppressed (though acknowledged) for therapy.
      *   **Our Exposure:** Heavily tracked throughout. Documenting refusal for therapy provides cover. Honoring refusal for research avoids accusations of coercion/battery. The capacity screen provides procedural cover. Following state law on contraception avoids legal liability.

  ### What the Policy Strictly Presupposes vs. What It Fits With
  *   **Strictly Presupposes:**
      1.  Parental consent is the primary and overriding authorization for therapeutic medical interventions on minors.
      2.  Non-therapeutic research burdens require the child's affirmative authorization, and refusal is absolute.
      3.  Chronological age (14) triggers a procedural requirement to solicit the child's view, but does *not* grant veto power over therapy.
      4.  The benefit-risk profile of the intervention determines whose will (parent vs. child) is dispositive.
  *   **Fits Comfortably With:**
      1.  Assent as trauma reduction and institutional cover (for therapy).
      2.  Consent as authorization for body use (for non-beneficial research).
      3.  Protecting the vulnerable from non-beneficial burdens.
      4.  Building agency developmentally (in a limited way, by giving weight in low-stakes research).
  *   **Underdetermined / Could Fit Multiple Theories:**
      1.  The *degree* to which building agency is a goal (vs. just managing distress/liability).
      2.  The *theoretical justification* for the age of 14 (beyond it being a common, somewhat arbitrary cutoff).
      3.  The *precise threshold* of what constitutes a "therapeutic necessity" vs. a "non-beneficial burden" (though the examples given are clear extremes).

  ### Switching to a Pure Capacity View: Concrete Changes and Trade-offs
  **Core Tenets of a Pure Capacity View:** Decision-specific competence assessment determines authority. No fixed age tiers. Competence = ability to understand the procedure, risks, benefits, alternatives, and voluntary nature. Benefit of the intervention is irrelevant to *who* decides, only to *what* is offered/consented to. A competent minor's refusal is binding, even for beneficial therapy.

  **Concrete Changes Required:**
  1.  **Scrap Age Tiers:** Eliminate the automatic trigger at 12/14 for capacity screening/assent processes.
  2.  **Implement Decision-Specific Capacity Assessments:** Develop and validate tools/protocols to assess competence *for each specific procedure or research protocol* being considered. This requires significant clinical/research staff training and time.
  3.  **Honor Competent Refusals Universally:** If a minor demonstrates competence for a specific decision (e.g., refusing an LP for suspected meningitis), their refusal *must* be honored, even if life-saving. This applies equally to clinical care and research. Parental consent alone would be insufficient.
  4.  **Define Thresholds Rigorously:** Clear, operationalized criteria for "competence" per decision type are essential. This is complex and context-dependent.
  5.  **Overhaul Documentation:** Focus shifts to documenting the *capacity assessment process and outcome* for each decision, not just age-based assent solicitation.
  6.  **Ethics Consult Mechanism:** A robust, rapid-response ethics consult process becomes *essential* for resolving disputes about competence determinations or the implications of a competent refusal.

  **What You Would Be Giving Up:**
  1.  **Predictability & Simplicity:** Bright-line age rules are administratively simpler. Capacity assessments are complex, time-consuming, and subjective.
  2.  **Parental Primacy:** Parents lose the ultimate authority to compel beneficial treatment over a competent child's refusal. This is a profound cultural and legal shift.
  3.  **"Therapeutic Benefit" Override:** The core logic allowing override for the child's "own good" disappears for competent minors.
  4.  **Potential for More Refusals of Beneficial Care:** Competent minors *will* sometimes refuse essential treatment (e.g., chemo, surgery). The policy must accept this outcome.
  5.  **Increased Institutional Risk & Conflict:** Honoring a minor's refusal for critical care invites legal challenges from parents/society and creates intense ethical dilemmas for staff. Capacity assessments themselves will be frequently contested.

  **What You Would Gain:**
  1.  **Theoretical Coherence:** Aligns practice with the ethical principle that respect for autonomy flows from decision-making capacity, not age or benefit.
  2.  **Respect for Developing Autonomy:** Takes minor autonomy seriously when demonstrably present, fostering true agency development.
  3.  **Protection Against Paternalism:** Prevents overriding a genuinely competent minor's wishes solely because others believe they know better.
  4.  **Consistency:** Applies the same standard (capacity) to all decisions, eliminating the benefit-based carve-out that creates the current split logic.
  5.  **Focus on Individualization:** Recognizes that capacity develops unevenly and requires individual assessment.

  **Conclusion:** Your current policy isn't philosophically pure; it's a pragmatic (and somewhat contradictory) blend prioritizing parental authority in therapy, child autonomy for pure research burdens, using age as a simple trigger, and heavily influenced by risk management and legal compliance. Switching to a pure capacity view would be a radical, resource-intensive, and ethically challenging overhaul, fundamentally altering the balance of power between minors, parents, and the institution, particularly concerning refusal of beneficial care. The maturity score's irrelevance confirms capacity isn't the real driver now. The contraception exception highlights the policy's vulnerability to external mandates over internal logic. Redrafting requires deciding whether you want greater theoretical consistency (capacity model) or a more pragmatic, benefit-driven, parent-centric model (current implicit logic), acknowledging the trade-offs inherent in each.
