prompt: |-
  I am trying to fix the standard before I look at any candidates, in the domain of whether video-game characters matter morally — whether there can be direct duties to, or wrongs against, non-player characters, playable characters, and the fictional persons a game presents. Fix the purpose as follows: I want a specification demanding enough to serve as a shared standard between people who think there is a substantive question here and people who think the appearance of one is an artefact of confusing fiction-directed attitudes with moral concern. I am not asking for citations, a bibliography, or a survey of who holds what; I want the reasoning.

  Deliverable: the requirements an adequate theory in this area must meet. For each requirement, give the case or consideration that motivates it, and tag it explicitly as non-negotiable or as a preference of a particular camp (saying which camp, and what that camp gains by insisting on it). At minimum, address the following — my list is not exhaustive, and I would rather you add requirements I have missed than pad the ones I have named.

  1. **Target.** What is the theory a theory of? If it relocates the question — from the character as patient to the player's character, to the fiction, or to the practice of designing and playing — it owes an account of why the intuition that there is a direct duty is not simply a mistake, and it must state its relocation policy up front rather than by stealth.

  2. **The case battery.** The theory must deliver verdicts on, or explain why no verdict is owed for: (i) sustained, gratuitous cruelty toward a richly authored single-player character with a biography and voiced reactions; (ii) the same behaviour toward a procedurally generated character with no memory, no biography, and no persistence across sessions; (iii) reloading a save afterwards, so that neither physically nor fictionally does anything remain of the act; (iv) irreversible death under permadeath rules, where loss does accumulate; (v) an avatar controlled by another person in multiplayer; (vi) a character modelled on, voiced by, or representing a real person or the victims of a real atrocity; (vii) a game whose own fiction entails that the character suffers; (viii) the same character across millions of copies and playthroughs — one patient wronged many times, many patients, or none; (ix) an unplayed game or a shut-down server, so that nothing is instantiated at all; (x) a game whose fiction has the character consenting to, or wanting, the harm.

  3. **Distinctions it may not collapse.** Having moral status and how much; being wronged and an act's being wrong; nonexistent, fictitious, and instantiated; a direct duty and an indirect duty that happens to have the same content; and, above all, "this matters" and "this matters to the player."

  4. **Constraints from outside the topic.** It cannot require anyone to believe that a current game character is phenomenally conscious; it should be consistent with the familiar puzzle that people have genuine feelings toward characters they take not to exist; and it should not treat reading about a torture and playing it as obviously equivalent, or obviously inequivalent, without saying which and why.

  5. **Agency and design.** Whether and why the fact that the player acts, rather than merely witnesses, makes a moral difference — and something about the obligations of designers and publishers, not only of players.

  6. **Joint unsatisfiability.** Identify any subset of these requirements that cannot all be met, and argue for it rather than merely suspecting it. My own suspicion is that the following trio fails: the wrong must be a wrong *to the character* rather than a defect in the player; fictional characters are not the sort of thing that can be wronged; and the theory must explain why many people find (i) more troubling than (ii). Tell me whether that trio is genuinely inconsistent, or whether I have mis-described one of its members — and if some requirement must go, which one you would drop and what the theory loses with it.

  7. **Most exclusionary requirement.** Which single requirement on your list knocks out the largest number of otherwise plausible candidates.

  8. **Brief scoring.** How the views one actually encounters — an indirect-duty view on the Kantian model, a virtue- or character-based view, a contractualist view keyed to who could be a party, a make-believe-based view, and a view granting narrative persons some genuine but slight status — fare against the list. Keep this short; the weight belongs on the criteria.

  Throughout, separate what is settled among people who work seriously on this from what is genuinely contested, and do not present a contested position — including one you favour — as though it were the consensus. Where you label a requirement a camp prejudice, name the camp and say what is at stake for it.
reasoning: |-
  Okay, the user is asking me to develop a set of requirements for evaluating theories about whether we can have direct moral duties to video game characters. They want a rigorous standard that can serve as common ground between people who think this is a real moral question and those who think it's just confusion about fiction.

  Let me unpack the user's request. They're clearly deep into philosophy, probably ethics or philosophy of fiction, given how precisely they've framed the problem. The level of specificity in their case battery suggests they've thought hard about this - they're not a beginner. I notice they're insisting on reasoning over citations, which tells me they want the logic laid bare, not just academic name-dropping.

  Hmm, the core challenge is balancing two opposing views: one that takes moral intuitions about game characters seriously, and one that dismisses them as category errors. The user wants criteria that don't presuppose either answer but force theories to engage with the toughest cases. That's clever - it's like creating a neutral testing ground.

  Looking at their seven points... The target specification is crucial. Any theory must clarify whether it's talking about characters as moral patients or relocating the concern elsewhere. And if it relocates, it owes us an explanation for why the direct-duty intuition feels so compelling. No sneaky redefinitions allowed.

  The case battery is exhaustive - covering everything from richly authored characters to procedurally generated ones, permadeath, multiplayer, representation of real people... I'll need to ensure each requirement handles these variations. Interesting how they include edge cases like unplayed games and consent within fiction. This shows they're serious about stress-testing theories.

  The distinctions section is vital. Many debates go astray by conflating key concepts - like moral status versus being wronged, or direct versus indirect duties. I should emphasize that any adequate theory must keep these separate. The "matters/matters to the player" distinction is particularly important - it's the core of the illusion versus reality debate.

  External constraints matter too. The theory can't require belief in consciousness (that would beg the question), must handle the paradox of caring about nonexistent beings, and can't assume equivalence between playing and reading about harm. These keep the discussion grounded.

  For agency and design... The user wants to know why actively causing harm feels different than passively watching it, and how designer responsibilities factor in. This expands the scope beyond just players - good catch.

  Now the joint unsatisfiability test... The user suspects a trio might be inconsistent: wrong to character, characters can't be wronged, and explaining why (i) feels worse than (ii). I'll need to analyze whether this is truly contradictory or if there's wiggle room. My initial thought is that the second claim might be too strong - some theories do grant limited moral status to fictions.

  For the exclusionary requirement... Probably the demand for direct duties to characters. That knocks out most reductionist views immediately. But since that's the heart of the debate, it should be non-negotiable.

  Brief scoring... I'll need to quickly map common approaches against these criteria. Kantian indirect duty views fail the target test, virtue ethics might handle player character but struggle with designer obligations, contractualism stumbles on nonexistent beings... The narrative personhood view comes closest but still has gaps.

  The user's phrasing suggests they lean toward taking the moral concern seriously but want steelman opposition. There's an undertone of frustration with glib dismissals of the question. I should maintain that delicate balance - show why the question is hard without dismissing it.

  Biggest risks: Accidentally biasing toward one camp, missing a key case in the battery, or not properly analyzing the purported inconsistency. Must watch those. Also need to clearly tag which requirements are contested versus widely accepted.
answer: |-
  Here is a set of requirements for an adequate theory addressing whether video game characters can be direct objects of moral duties/wrongs, structured to serve as a shared standard between opposing camps. Each requirement is motivated by core cases or distinctions, and its status is explicitly tagged.

  ### Core Requirements

  1.  **Target Clarity & Relocation Accountability (Non-Negotiable)**
      *   **Requirement:** The theory must explicitly state what it takes the primary object of moral concern to be (e.g., the fictional character *as presented*, the player's actions/attitudes, the design artifact, the fiction itself). If it relocates the locus of duty/wrong away from the character *as patient*, it must:
          a) Acknowledge the phenomenological pull of the intuition that the *character* is wronged.
          b) Explain *why* this intuition arises and persists despite (according to the theory) being misplaced.
          c) Justify why relocation is necessary/accurate.
      *   **Motivation:** Cases (i) & (v) strongly evoke the intuition of direct wronging *to the character*. A theory that dismisses this intuition entirely without accounting for its force fails descriptively and risks being question-begging. Relocation by stealth undermines dialectical fairness.
      *   **Tag:** Non-Negotiable.

  2.  **Case Battery Coverage (Non-Negotiable)**
      *   **Requirement:** The theory must generate consistent, principled verdicts (e.g., wrong/not wrong, significant/minimal wrong, direct/indirect wrong, or "no genuine moral wrong here") OR explain why no verdict is possible/morally required for *all* cases in the battery (i-ix), including distinctions *within* types (e.g., why (i) might differ from (ii), (iii), (vii), (x)).
      *   **Motivation:** The battery captures the core variations in character presentation, player action, context, and metaphysics that drive intuitions and theoretical disagreements. Ignoring key distinctions (e.g., authored vs. procedural, persistent vs. reset, instantiated vs. unplayed, multiplayer vs. single-player, consenting fiction) renders the theory incomplete or ad hoc.
      *   **Tag:** Non-Negotiable.

  3.  **Conceptual Distinction Preservation (Non-Negotiable)**
      *   **Requirement:** The theory must clearly distinguish:
          *   Having moral status vs. the degree/kind of status.
          *   An act being wrong *simpliciter* vs. an act wronging *a specific patient*.
          *   Nonexistent, fictitious, and instantiated entities.
          *   A direct duty *to X* vs. an indirect duty that merely *concerns X* or has the same content.
          *   "This matters morally" vs. "This matters psychologically *to the player*".
      *   **Motivation:** Collapsing these distinctions is the primary mechanism for generating the illusion of direct duties (according to skeptics) or for obscuring genuine moral phenomena (according to proponents). Cases like (iii) vs. (iv) hinge on persistence/metaphysics; (i) vs. (ii) on richness; the core debate hinges on the last distinction.
      *   **Tag:** Non-Negotiable.

  4.  **External Constraints (Non-Negotiable)**
      *   **Requirement:** The theory must:
          a) **Avoid Consciousness Requirement:** It cannot *require* the actual phenomenal consciousness of current game characters as a condition for direct duties/wrongs.
          b) **Respect Paradox of Fiction:** It must be consistent with the empirical reality of genuine emotional responses toward entities known to be fictional/nonexistent.
          c) **Articulate Action/Witness Difference:** It must explicitly address whether, and explain why, *acting to cause harm* within the fiction differs morally from *witnessing described harm* (e.g., reading), without assuming obvious equivalence or inequivalence. Similarly for designer vs. player roles.
      *   **Motivation:** (a) Current characters demonstrably aren't conscious, making this a non-starter; (b) Denying the paradox undermines the descriptive adequacy needed to explain player reactions; (c) The active nature of gameplay is central to the moral unease (Cases i, v, design obligations) but its exact significance is contested.
      *   **Tag:** Non-Negotiable.

  5.  **Agency, Design, and Locus of Responsibility (Non-Negotiable)**
      *   **Requirement:** The theory must explain the moral significance, if any, of the player's *agency* in causing the fictional harm/outcome, contrasting it with passive witnessing. It must also explicitly address the potential moral obligations of game designers and publishers concerning character creation and presentation, not just player actions.
      *   **Motivation:** Cases (i), (v), (vi), and (x) highlight the role of player action and choice. Design decisions directly shape the potential for the intuitions driving the debate (Cases i, ii, vi, vii, viii, x). Ignoring design ignores a crucial part of the phenomenon.
      *   **Tag:** Non-Negotiable.

  6.  **Joint Unsatisfiability Analysis: The Core Trio**
      *   **The Trio:**
          1.  The wrong must be a wrong *to the character* (direct patient).
          2.  Fictional characters are not the kind of thing that can *be* wronged (lack necessary properties like existence, sentience, interests).
          3.  The theory must explain the intuitive moral difference between Case (i) (Rich Authored) and Case (ii) (Procedural).
      *   **Analysis:** This trio *is* genuinely inconsistent if (2) is held as an absolute metaphysical constraint. If fictional characters *cannot* be wronged (2), then (1) is necessarily false. However, (3) is compelling and needs explanation.
      *   **Resolution:** A theory must reject at least one member:
          *   **Reject (1):** (Skeptic Camp) Relocate the wrong (e.g., to the player's character/attitudes, or to disrespect for the fiction/narrative). *Gains:* Metaphysical parsimony, avoids attributing properties to fictions they lack. *Loss:* Must work hard to explain the *target* intuition and the difference in (3) convincingly.
          *   **Reject (2):** (Proponent Camp) Grant some form of genuine, albeit limited or derivative, moral status/patiency to fictional characters *qua* presented narrative persons. *Gains:* Directly captures the target intuition and easily explains (3) via differences in narrative richness/personhood. *Loss:* Requires robust metaphysics of fiction/morality to avoid absurdity (e.g., duties to uninstantiated characters (ix), aggregation (viii)).
          *   **Reject (3) as requiring direct patient difference:** (Possible Skeptic Move) Explain the intuitive difference solely via indirect factors (e.g., player attitude formation, symbolic weight, design offensiveness) without invoking a difference in the character's *status as patient*. *Gains:* Maintains (1) & (2) rejection. *Loss:* Risks failing to fully capture the *felt* directness of the wrong in (i) compared to (ii).

  7.  **Most Exclusionary Requirement**
      *   **Requirement: Target Clarity & Relocation Accountability (specifically, insisting that the intuition of direct wronging *to the character* must be taken seriously and accounted for, even if ultimately explained away).**
      *   **Why:** This immediately excludes:
          *   **Hard Reductionism:** Views that dismiss the intuition as *simply* a category error or confusion without explaining its persistence and phenomenology (fails 1b,c).
          *   **Stealth Relocation:** Views that claim to address "duties to characters" but redefine "character" to mean something else (e.g., the designer's creation, the player's psychology) without explicit justification (fails 1a,c).
      *   **Excluded Candidates:** Crude dismissals ("It's just pixels!"), overly simplistic psychological reductionism, views that redefine the target without argument.

  8.  **Brief Scoring of Common Views**
      *   **Kantian Indirect-Duty:** *Target:* Player's rational self/moral character. *Fares:* Fails Target Clarity (relocates without fully explaining pull of patient-intuition). Struggles with Case Battery (e.g., why (i)>(ii) if no patient? Permadeath (iv)? Consent (x)?). Strong on Distinctions. Meets Constraints. Weak on Designer obligations. Fails Core Trio (Rejects 1).
      *   **Virtue/Character-Based:** *Target:* Player's virtues/vices. *Fares:* Similar to Kantian on relocation struggles (Target). Explains (i)>(ii) via attitude formation. Handles Agency well. May struggle with Designer role & Cases like (ix), (viii). Meets Constraints. Fails Core Trio (Rejects 1).
      *   **Contractualism (Actual Persons):** *Target:* Real persons (players, designers, society). *Fares:* Relocates (Target challenge). Explains (vi) well. Explains (i)>(ii) if richness affects reasons/offense to real people. Struggles with (ix), (viii), pure single-player cases. Meets Constraints. Fails Core Trio (Rejects 1).
      *   **Make-Believe-Based:** *Target:* Norms of the game/fiction engagement. *Fares:* Relocates (Target challenge). Explains Paradox well. Explains (i)>(ii) via richness enabling deeper pretense. May struggle with moral weight (Collapse "matters morally"/"matters to play"). Handles Agency/Designer via fiction rules. Fails Core Trio (Rejects 1).
      *   **Narrative Personhood (Slight Status):** *Target:* The presented character *as* narrative person. *Fares:* Best on Target (direct patient). Explains (i)>(ii), (iv), (vii), (x) via narrative properties. Struggles most with Metaphysics (Cases viii, ix, battery distinctions Nonexistent/Fictitious/Instantiated). Risks Collapse if status isn't clearly defined. Meets Constraints. Passes Core Trio (Rejects 2).

  **Settled vs. Contested:**
  *   **Settled (among serious theorists):** The *intuition* of direct wronging exists and is potent (esp. in cases like i, vi); dismissing it without explanation is inadequate (Req 1). The distinctions in Req 3 are crucial and collapsing them distorts the debate. The external constraints (Req 4a,b) are widely accepted. Designer obligations are part of the landscape (Req 5).
  *   **Genuinely Contested:** Whether the intuition points to a genuine direct patient (Req 1, Core of Core Trio), the best way to explain differences like (i) vs. (ii) (Req 2, Core Trio point 3), the precise moral significance of player agency (Req 4c, 5), the viability and nature of any moral status for narrative persons (affecting Req 2, 3, 4c, Core Trio point 2), and how to handle the metaphysics of fiction (Cases viii, ix).

  This framework forces theories to engage directly with the strongest intuitions and hardest cases from both sides, demanding clarity on their foundational commitments and the costs of relocation or metaphysical innovation. The Core Trio highlights the fundamental rift requiring theoretical choice.
