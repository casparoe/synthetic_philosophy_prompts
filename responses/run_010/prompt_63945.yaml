prompt: |-
  I run QA for a broadband support team. My graders score about forty recorded calls a week against the script I wrote, and the scores feed into performance reviews, so they get disputed a lot. Lately I keep hitting calls where the agent does every required step — greets properly, verifies the account, reads the mandatory disclosure, walks the customer through a router reboot, confirms the customer "understands" — and the customer hangs up with the exact same fault they called about. It reminded me of the wasp case philosophers use for this, sphexishness I think it's called: the wasp drags its paralyzed cricket to the mouth of the burrow, goes in to check the nest, comes back out, and if you've moved the cricket while it was inside it just drags it back to the entrance and starts over, indefinitely. Nothing it does is incompetent. Each move is fine. The whole routine is stuck and can't tell.

  Write me a procedure a grader can run on one transcript in about ten minutes that separates "compliant and solved it" from "compliant and looping." My graders have no technical background and no philosophy, so it needs to be concrete questions in order, what answer counts as passing each one, where it stops at a fail, and where it hands the call up to a human becuase the remaining question is about service quality rather than something checkable in the transcript. The part I care most about: a test for real verification versus fake verification — a step that looks like a check but whose only possible outcome is to run the loop again. And it has to hold the line that some script steps are regulatory and can't be skipped no matter how stuck the call has become.

  Then run it on three cases. One: the agent asks the customer to reboot three times, gets a flat "yeah ok" each time, and twice the customer says something that doesn't fit the branch the agent is in. Two: the agent skips the mandatory disclosure, solves an unusual fault in four minutes, customer is delighted. Three: the agent repeats verbatim lines four times and sounds like a machine, but the customer's issue doesn't appear in any branch of my script.

  Finish with where the procedure will misfire, and say something honest about the risk that grading for sphexishness turns into its own sphexish routine.
reasoning: |-
  We are designing a procedure to evaluate call transcripts for "compliant and solved" vs "compliant and looping" (sphexishness). The procedure must:
  1. Be executable in about 10 minutes by graders without technical or philosophical background.
  2. Have concrete questions in order, with clear pass/fail criteria and when to escalate to a human.
  3. Test for real verification vs fake verification (i.e., checks that only lead to repeating the loop).
  4. Uphold mandatory regulatory steps (which cannot be skipped even if the call is stuck).

  The procedure will have a flowchart-like structure. We break it into steps:

  **Procedure: Evaluating Call for Sphexishness**

  **Step 1: Initial Setup**
  - **Question 1:** Does the agent start with the proper greeting? (Check for required greeting script)
    - Pass: Yes, as per script.
    - Fail: No. → **Result: Non-Compliant** (Stop, no need to proceed further; this is a regulatory failure)
  - **Question 2:** Does the agent properly verify the account? (Check for required account verification steps)
    - Pass: Yes, as per script (e.g., name, account number, or security question).
    - Fail: No. → **Result: Non-Compliant**

  **Step 2: Mandatory Disclosure**
  - **Question 3:** Does the agent read the mandatory disclosure? (Check for exact or required disclosure wording)
    - Pass: Yes, as required.
    - Fail: No. → **Result: Non-Compliant**

  **Step 3: Problem Resolution Loop Check**
  This step is to detect if the agent is stuck in a loop without making progress. We are looking for:
  - Repetition of the same troubleshooting steps without advancement.
  - Superficial verification that doesn't actually confirm resolution or understanding.

  We break it down:

  - **Question 4:** Did the agent attempt to resolve the issue? (Check for at least one troubleshooting step beyond verification and disclosure)
    - Pass: Yes (e.g., asked to reboot, checked signal, etc.)
    - Fail: No. → **Result: Compliant but Looping?** (Note: This is unusual because the script requires steps. But if none, then the agent did nothing to resolve. We mark as looping because the call didn't progress. However, if the script doesn't require a step beyond disclosure in some cases, adjust. But typically, there should be some action.)

  - **Question 5:** Was the issue resolved? (Check the end of the call: does the customer indicate the problem is fixed? Or is there evidence of the same problem persisting?)
    - Pass: Yes, the customer confirms resolution or the agent confirms via a test (e.g., "Can you now access example.com?" and customer says yes).
    - Fail: No, the customer states or implies the problem remains, or the call ends without resolution (e.g., customer hangs up with the same issue). → Then proceed to **Question 6**.

  **Question 6: Verification of Understanding and Resolution (Real vs Fake Verification)**
  - We are testing if the agent did a real check or just went through the motions.

  - **Question 6a:** Did the agent ask the customer to confirm the issue is resolved? (Look for: "Is it working now?", "Can you check the website?", etc.)
    - If No: → **Result: Compliant but Looping (due to missing resolution check)**
    - If Yes: Then check the customer's response.

  - **Question 6b:** Did the customer provide a clear positive response? (e.g., "Yes, it's working", "I can see the website now")
    - If Yes: → **Result: Compliant and Solved** (even if we suspect it might not be, if the customer said it was fixed, we take that at face value for the purpose of this procedure because we don't have technical tools to verify independently).
    - If No: The customer gives a non-committal or negative response (e.g., "I guess", "I don't know", "still not working", or silence). Then proceed.

  - **Question 6c:** If the customer did not confirm resolution, did the agent take a different action? (e.g., escalate, try a different troubleshooting step, or offer a technician visit?)
    - Yes: → **Result: Compliant and Progressive** (even if not solved, the agent broke the loop by trying something new). Then we note that the issue wasn't resolved but the agent followed procedure appropriately and moved beyond the loop.
    - No: The agent repeated the same step (e.g., asked to reboot again) or ended the call without further action. → **Result: Compliant but Looping**

  **Step 4: Handling Unusual Cases**
  - **Question 7:** Was there an indication that the customer's issue does not match the typical script? (e.g., the customer describes a problem that isn't covered by the standard script, or the agent recognizes this and goes off-script to solve it)
    - If Yes: Then we need to check if the agent resolved it without violating mandatory steps. But note: mandatory steps (greeting, verification, disclosure) cannot be skipped.

    - **Question 7a:** Did the agent skip any mandatory step (from Steps 1 and 2) to handle this unusual issue?
      - If Yes: → **Result: Non-Compliant** (because regulatory steps are non-negotiable)
      - If No: → **Result: Compliant and Solved** (if the issue was resolved) or **Compliant and Progressive** (if not resolved but the agent took appropriate non-looping actions).

    - **Question 7b:** If the agent did not skip mandatory steps and resolved the issue, then it's a pass.

  **Step 5: Escalation for Service Quality**
  - If at any point the grader is unsure about the technical resolution or if the agent's approach, while compliant, might have led to poor customer experience (e.g., robotic tone, lack of empathy, etc.), but the transcript does not provide clear evidence of failure in the above steps, then:
    - **Question 8:** Is there a concern about service quality that isn't captured by the script compliance? (e.g., the agent was rude, unhelpful, or the customer expressed dissatisfaction that isn't tied to the issue resolution)
      - If Yes: → **Escalate to Human** for service quality review.
      - If No: Then the result stands.

  **Summary of Outcomes:**
  - **Non-Compliant**: Failed one of the mandatory steps (Questions 1, 2, 3, or 7a).
  - **Compliant and Solved**: Passed all mandatory steps and the issue was resolved (Question 5 Pass or Question 6b Pass).
  - **Compliant and Progressive**: Passed all mandatory steps, issue not resolved, but agent broke the loop by taking a new action (Question 6c Yes).
  - **Compliant but Looping**: Passed mandatory steps, but got stuck in a loop without resolution and without breaking the loop (Question 6c No, or Question 4 Fail in a context that indicates looping).
  - **Escalate to Human**: For service quality concerns that are not script-compliance issues.

  Now, we run the procedure on the three cases.

  ---

  **Case 1:**
  - Agent asks customer to reboot three times, gets a flat "yeah ok" each time.
  - Twice the customer says something that doesn't fit the branch the agent is in.

  **Evaluation:**
  1. **Step 1:** Assume greeting and account verification are done properly → Pass.
  2. **Step 2:** Mandatory disclosure read → Pass.
  3. **Step 3:**
     - **Q4:** Agent attempted resolution (reboot) → Pass.
     - **Q5:** Issue resolved? At the end, the customer has the same fault → Fail → go to Q6.
     - **Q6a:** Did agent ask for confirmation? (We need to see in the transcript: after each reboot, did the agent ask if it worked?) Assume after each reboot, the agent asked and the customer said "no" or didn't confirm positively. Then:
       - **Q6b:** The customer did not provide a clear positive → so we go to Q6c.
     - **Q6c:** After the first failure, did the agent take a different action? No, they repeated the same reboot step. After the second failure, same. So the agent repeated the same step without trying something new. → **Result: Compliant but Looping**

  **Case 2:**
  - Agent skips the mandatory disclosure, solves an unusual fault in four minutes, customer is delighted.

  **Evaluation:**
  1. **Step 1:** Greeting and verification → Pass (assume done).
  2. **Step 2: Q3:** Mandatory disclosure skipped → **Result: Non-Compliant** (Stop). 
     - Even though the customer was delighted and the issue was fixed, the regulatory step was skipped. So the call is non-compliant.

  **Case 3:**
  - Agent repeats verbatim lines four times and sounds like a machine.
  - Customer's issue doesn't appear in any branch of the script.

  **Evaluation:**
  1. **Step 1:** Greeting and verification → Pass (assume done).
  2. **Step 2:** Mandatory disclosure → Pass (assume done).
  3. **Step 3:**
     - **Q4:** Agent attempted resolution? The agent is repeating lines, but we need to see if they were troubleshooting steps. Since the issue isn't in the script, the agent might have been applying irrelevant steps. But the question is: did they attempt? They did something, so probably Pass (if the steps were attempted even if irrelevant). 
     - **Q5:** Issue resolved? The problem persists (since it wasn't in the script and the agent didn't solve it) → Fail → Q6.
     - **Q6a:** Agent asked for confirmation? (Assume they did after each repetition) → Then Q6b: Customer likely didn't confirm positively → then Q6c: Did the agent take a different action? Since the agent just repeated the same lines, no. → **Result: Compliant but Looping**

  But note: the issue doesn't appear in the script. So we should also consider Step 4 (Question 7).

  - **Q7:** Was there an indication the issue doesn't match the script? Yes, because the customer's issue isn't in any branch. 
    - **Q7a:** Did the agent skip a mandatory step? No, we passed Steps 1 and 2. 
    - However, the agent did not break the loop (they kept repeating). Also, they didn't take a new action (like escalating or offering a technician). So we are back to the Step 3 result: Compliant but Looping.

  Alternatively, we might note that the agent should have recognized the issue was off-script and taken alternative action. Since they didn't, they were stuck in a loop of irrelevant steps. So the Step 3 result stands.

  But note: the grader might be concerned about the robotic tone. We have Step 5:

  - **Q8:** Service quality concern? The agent sounded like a machine. This is a service quality issue. → **Escalate to Human** for service quality review.

  So the final outcome: the compliance part is "Compliant but Looping", but we escalate for service quality.

  ---

  **Where the Procedure Will Misfire:**

  1. **False "Compliant and Solved":** If the customer lies and says the issue is fixed (to get off the phone) when it isn't, the procedure will mark it as solved. We rely on customer confirmation.

  2. **False "Compliant but Looping":** If the agent did break the loop in a way not captured by the transcript (e.g., by suggesting a different step that the grader doesn't recognize as new because they lack technical background) or if the customer's issue was intermittent and the agent's repetition was justified.

  3. **Overlooking Nuance in Verification:** The real vs fake verification test (Q6) might be too simplistic. For example, if the agent asks "Is it working?" and the customer says "I don't know, let me check... [long pause] ... not yet", and the agent then tries a different step, that should be progressive. But if the grader misses the pause and the agent's subsequent action, they might mark it as looping.

  4. **Regulatory Steps in Genuine Emergencies:** In Case 2, we marked as non-compliant because of skipped disclosure. But if the disclosure is legally required, we must. However, if the customer is in an emergency (e.g., medical device down) and the agent skips disclosure to expedite, the procedure would still mark non-compliant. This might be a business/legal decision to accept the risk, but the procedure must hold the line.

  5. **Unusual Issues Misclassified:** In Case 3, we ended up with Compliant but Looping and an escalation for service quality. But if the agent's repetition was the only option (due to policy) and they eventually escalated, the grader might not see that if the escalation happened after the fourth repetition and the transcript is cut off? We rely on the transcript being complete.

  **Honest Risk About Grading for Sphexishness:**

  The procedure itself risks becoming a sphexish routine. Graders might mechanically apply the checklist without understanding the context, leading to:
  - Penalizing agents who are actually being creative but the grader doesn't recognize it.
  - Missing new patterns of looping because they don't fit the predefined questions.
  - Becoming a rigid system that doesn't adapt to new types of customer issues or agent innovations.

  Moreover, if the grading becomes too focused on avoiding loops, it might push agents to escalate every call that doesn't resolve immediately (to avoid repetition), increasing costs. Alternatively, agents might pressure customers to falsely confirm resolution to pass the verification step.

  To mitigate, regularly review the procedure with graders and agents, and update based on disputes and new patterns. Also, have a random sample of calls reviewed by a human for quality control on the grading itself.

  Finally, remember: the goal is to reduce pointless repetition while maintaining compliance and encouraging effective problem-solving. The procedure is a tool, not an infallible judge.
answer: |-
  ### Procedure: Sphexishness Detection for Call Graders  
  **Objective:** Separate "compliant and solved" from "compliant but looping" in 10 minutes. Focuses on mandatory steps (regulatory), real verification, and loop detection.  
  **Tools:** Transcript, timer, and a red "ESCALATE" button for service quality issues.  
  **Key Principle:** Regulatory steps (greeting, account verification, mandatory disclosure) are non-negotiable. Failure = automatic fail.  

  ---

  #### Step-by-Step Evaluation Procedure  
  **Time Allocation:** 10 minutes max per transcript. Follow in order—stop at first fail or escalation.  

  1. **Regulatory Compliance Check (Non-Negotiable)**  
     - **Question 1:** Did the agent use the *exact* required greeting (e.g., "Hello, [Company] Broadband Support, my name is X")?  
       - **Pass:** Matches script.  
       - **Fail:** Missing or altered → **Result: NON-COMPLIANT**. Stop grading.  
     - **Question 2:** Did the agent verify the account (e.g., name, account number, or security question)?  
       - **Pass:** Confirmed two customer-specific details (e.g., "Can you confirm your address?" + "What’s the account holder’s name?").  
       - **Fail:** Skipped or only asked one → **Result: NON-COMPLIANT**. Stop.  
     - **Question 3:** Was the mandatory disclosure (e.g., "For security, I must read this script...") read *verbatim*?  
       - **Pass:** Full script read without changes.  
       - **Fail:** Missing, shortened, or paraphrased → **Result: NON-COMPLIANT**. Stop.  

  2. **Real Verification Test (Critical for Loop Detection)**  
     - **Question 4:** Did the agent confirm the customer’s issue *before* troubleshooting (e.g., "So you’re saying your Wi-Fi is down?")?  
       - **Pass:** Yes, agent paraphrased the problem.  
       - **Fail:** No → **Result: COMPLIANT BUT LOOPING**. Stop.  
     - **Question 5:** During troubleshooting, did the agent ask for *specific, observable feedback* (not just "okay" or "yes")?  
       - **Example Pass:** "After rebooting, is the *red light now solid green*?"  
       - **Example Fail:** "Did that fix it?" (with only "yeah" as response).  
       - **Pass:** Customer described observable change (e.g., "light changed color," "website loads").  
       - **Fail:** Generic confirmation (e.g., "yeah," "okay") → Proceed to Q6.  

  3. **Loop Detection & Resolution Check**  
     - **Question 6:** Did the agent repeat the *same troubleshooting step* >1 time without new information?  
       - **Pass:** No repetition OR repeated only if customer gave new details (e.g., "I rebooted but the light is still red").  
       - **Fail:** Repeated identical step (e.g., "reboot again") with no new input → **Result: COMPLIANT BUT LOOPING**. Stop.  
     - **Question 7:** At call end, did the customer *demonstrate resolution* (e.g., tested service, described fix)?  
       - **Pass:** Yes (e.g., "I see my email now").  
       - **Fail:** Customer reports same issue OR only says "I understand" → Proceed to Q8.  

  4. **Escalation Trigger (Service Quality/Unresolved Issues)**  
     - **Question 8:** Is the issue unresolved *and* the agent missed a chance to escalate/adapt?  
       - **Escalate:** If agent ignored customer cues (e.g., "that didn’t work last time") or sounded robotic → **ESCALATE TO HUMAN**.  
       - **Pass:** Agent escalated or offered alternatives (e.g., "I’ll schedule a technician") → **Result: COMPLIANT AND PROGRESSIVE**.  
       - **Fail:** Agent did nothing new → **Result: COMPLIANT BUT LOOPING**.  

  **Final Outcomes:**  
  - **Compliant & Solved:** All steps passed + issue resolved (Q7 pass).  
  - **Compliant & Progressive:** All steps passed + unresolved but agent adapted (Q8 pass).  
  - **Compliant but Looping:** All steps passed + unresolved + agent looped (Q5 fail + Q6 fail/Q8 fail).  
  - **Non-Compliant:** Failed Q1–Q3.  
  - **Escalate:** Service quality concerns (Q8 escalation).  

  ---

  ### Case Evaluations  
  **Case 1:** *Agent asks customer to reboot 3x, gets "yeah ok" each time. Customer twice says off-script details (e.g., "still no signal").*  
  - **Q1–Q3:** Pass (greeting, account check, disclosure done).  
  - **Q4:** Pass (agent confirmed issue: "So your internet is down?").  
  - **Q5:** Fail (customer gave generic "yeah ok"; no observable feedback).  
  - **Q6:** Fail (reboot repeated 3x with no new info; customer even hinted fault persisted).  
  - **Stop at Q6 → Result: COMPLIANT BUT LOOPING.**  

  **Case 2:** *Agent skipped mandatory disclosure, fixed unusual fault in 4 mins, delighted customer.*  
  - **Q1:** Pass (greeting used).  
  - **Q2:** Pass (account verified).  
  - **Q3:** Fail (disclosure skipped).  
  - **Stop at Q3 → Result: NON-COMPLIANT.** *(Regulatory steps cannot be skipped!)*  

  **Case 3:** *Agent repeated verbatim lines 4x, robotic tone. Issue not in script (e.g., "my smart fridge won’t connect").*  
  - **Q1–Q3:** Pass (regulatory steps done).  
  - **Q4:** Pass (agent confirmed issue: "Fridge not connecting?").  
  - **Q5:** Fail (customer gave vague responses; no observable feedback).  
  - **Q6:** Fail (agent repeated lines 4x with no adaptation).  
  - **Q8:** Escalate (robotic tone + issue outside script; human must assess empathy/rigidity).  
  - **Result: ESCALATE TO HUMAN.**  

  ---

  ### Where the Procedure Misfires & Risks  
  **Misfires:**  
  1. **False "Looping":** Agents who *legitimately* repeat steps (e.g., intermittent faults) may be flagged if graders miss nuanced customer cues.  
  2. **False "Solved":** Customers lying to end calls ("yes, it works!") will be marked "solved."  
  3. **Over-Escalation:** Complex but resolvable issues may trigger unnecessary escalations if graders misinterpret "adaptation" (Q8).  
  4. **Script Gaps:** Unscripted issues (Case 3) rely on human escalation—graders may default to "looping" if unsure.  

  **Honest Risk: The Sphexishness Trap**  
  > *"Grading for sphexishness can become its own sphexish routine."*  
  - **The Loop:** Graders mechanically apply this checklist, ignoring context (e.g., customer frustration, creative fixes). Agents then "game" the rubric (e.g., forcing specific phrases to pass Q5), creating new loops.  
  - **Mitigation:**  
    - **Random audits:** Humans review 10% of "looping" calls to validate.  
    - **Agent feedback:** Disputes trigger script updates (e.g., add "fridge troubleshooting" branch).  
    - **Sunset clause:** Redesign the rubric every 6 months to prevent rigidity.  

  **Final Note:** No procedure is perfect. Focus on reducing loops while preserving regulatory compliance—but reward adaptability, not just box-ticking.
