prompt: |-
  I run a four-person democratic innovation team inside a regional government. Councils, combined authorities and the occasional health board ask us to design citizens' panels, and so far everything we've built has been advisory: a randomly selected group hears evidence, deliberates, publishes recommendations, and the elected body then decides whether to notice them. In the last six months three clients have asked for something different — panels that actually decide. Before we commit to designing anything I want a procedure we can run on each request, because at the moment we improvise and I'm fairly sure we're being inconsistent about it.

  The thing I want the procedure to get its teeth into is why we're using a lottery at all, and it's the reason I'm asking you rather than googling. We've started using some house shorthand, "mirror or ladder". If the reason is the mirror — the panel is meant to be a scaled-down copy of the place, so its verdict carries the weight of "this is what people like you would conclude if they were properly informed" — then everything rests on the seated group actually resembling the population, and our recruitment numbers are a disaster for that. We write to or knock on roughly 4,000 randomly picked addresses and end up with 40 to 60 people who say yes, so a 1–2 per cent response rate. Quotas on age, sex, ethnicity, tenure and rough geography patch up the variables we can see, and we pay people, but nobody has a fix for the invisible ones: interest in politics, confidence about speaking in a room, having a free Saturday, not caring what the neighbours think. If the reason is the ladder — the point being that nobody had to win a contest to get in there, so the ambitious, the well-connected and the comfortably-off lose the head start an election hands them — then who turns up matters far less and the self-selection problem mostly dissolves. Two reasons, two different designs, two different legitimacy stories, and I dont think we've ever been clear which one we were selling. Worth saying that the Athenians may have had both at once: people put themselves forward into the pool that was then allotted, terms were a year, you couldn't hold the same office twice, there was a check before you took it up and an account rendered afterwards, and the posts that needed real skill — the military ones — were elected rather than allotted. So possibly the honest position is that sortition is never doing just one thing, and the procedure should force us to say which one is load-bearing in this case.

  Some constraints: nobody on the team is a statistician; we typically have about six weeks between the request and the committee paper; the director who signs off is not a democratic theorist and will read one page, not twelve. No bibliography or citations, please — I want something I can hand a colleague on a Tuesday morning.

  Please structure the response in exactly these sections, in this order:

  1. **Bottom line** (about 80 words) — the one or two things you'd tell me to stop doing straight away.
  2. **Mirror or ladder, made operational** (about 200 words) — a test we can run in ten minutes at the start of a request to establish which value the client is actually invoking, including the tells, i.e. what clients say when they mean one and not the other, and what to do when they say both or refuse to say.
  3. **The procedure** (the bulk, roughly 900–1,200 words) — the questions in the order we should ask them, what counts as a sufficient answer to each, where it stops with a flat no, and where it hands the decision back to a human because the question is one of values rather than facts. Build in at least one question designed to catch a sponsor who wants a panel in order to avoid being blamed for the outcome rather than to reach one. That's my real worry about case (c) below and it's the hardest thing to put to a client politely, so tell me how you'd phrase it.
  4. **Where it will misfire** (about 250 words) — which steps are judgment calls wearing a procedural costume, and what the procedure does when the honest answer is "we don't know".
  5. **Three cases** (about 250 words each) — run the procedure on:
     (a) a metropolitan borough wanting a 50-resident panel with binding power over how £2.4m of capital money is split between some thirty local projects, because their vote-based version keeps getting captured by whichever group can turn out the most people on the night;
     (b) a combined authority wanting to fill its scrutiny chair — the role that runs the committees asking awkward questions of the executive — with a randomly selected resident on a one-year rotating term instead of a councillor;
     (c) a district council deadlocked 24–24 for two years on whether to allocate a site for 300 homes, whose leader's office proposes putting it to a citizens' panel with both sides agreeing in advance to implement whatever it decides. The leader chairs the board of our largest funder. Say the no plainly if that's where it lands, and don't soften it into a maybe.
     For each, say which way it comes out and what would have to change to change the answer.
  6. **What this procedure can't do** (about 150 words).
reasoning: |-
  Hmm, the user runs a democratic innovation team in regional government that designs citizens' panels. They've noticed inconsistency in handling requests for decision-making panels versus advisory ones. The core tension is between two legitimacies: "mirror" (demographic representation) and "ladder" (equal opportunity access). Their recruitment struggles (1-2% response rate) make true mirroring impossible, so they need a clear method to determine which principle applies per project.

  The user wants a practical procedure - not academic theory - with strict section requirements. Key constraints: no statisticians on team, tight deadlines, director needs one-page summaries. They're particularly concerned about sponsors using panels as blame-avoidance tools (case c). The Athenian reference suggests they appreciate historical context but need operational clarity.

  For the Bottom Line section, I'll highlight stopping improvisation and mirror claims as immediate fixes. The operational test for mirror vs ladder needs client language cues - "representative" versus "fresh voices" are telling phrases. When clients conflate both, we'll force prioritization.

  The procedure section must flow logically: First confirm the panel's authority level (advisory/binding), then surface the legitimacy basis before addressing practical constraints. The blame-avoidance check needs delicate phrasing - maybe "outcome ownership" framing. For misfires, I'll flag where professional judgment overrides process.

  Case analyses: (a) Borough's participatory budgeting passes ladder focus; (b) Scrutiny chair fails on competency grounds; (c) Leader's housing deadlock gets hard "no" as blame-shifting. Each shows what would flip the decision.

  Finally, I'll note what the procedure can't solve: deep recruitment issues, post-panel accountability, or replacing political leadership when values clash. The output stays strictly within requested structure and word counts, using plain language throughout.
answer: |-
  Here’s your procedure, structured as requested:

  ---

  ### 1. Bottom Line  
  Stop improvising responses to "decision panel" requests. Stop claiming panels are "representative mirrors" of the population—your recruitment makes this impossible. Instead, force every client to declare upfront whether legitimacy comes from **demographic accuracy** (mirror) or **barrier-free access** (ladder). If they can’t articulate this, pause the project. This is your new starting gate.

  ---

  ### 2. Mirror or Ladder, Made Operational  
  **The Test:** Ask the client: *"When people question this panel’s legitimacy, will you defend it by saying ‘It looks like our community’ (mirror) or ‘Anyone could have been chosen’ (ladder)?"*  

  **The Tells:**  
  - **Mirror clients** say: "We need a *true cross-section*," "It must reflect our demographics," "We want the *voice of the whole city*."  
  - **Ladder clients** say: "We need *ordinary people*, not the usual suspects," "Give *everyone a fair shot*," "Avoid special interests."  
  - **If they say both:** Reply: "We optimize differently for each. Which one matters *most* if we have to choose?" Refuse to proceed without a ranked priority.  
  - **If they refuse:** State: "We design panels differently based on this. We’ll pause until you consult internally." Send a 1-pager explaining the trade-offs (use Section 3 summary).  

  ---

  ### 3. The Procedure  
  **Ask these questions in order. Stop if any answer fails.**  

  1. **"Is this panel advisory or binding?"**  
     - *Sufficient answer:* Binding = formal agreement (e.g., committee motion) that the panel’s decision is final. Advisory = commitment to publicly respond.  
     - *Stop if:* Vague ("We’ll take it seriously") or no political buy-in.  

  2. **"Mirror or ladder? (Use Section 2 test)"**  
     - *Sufficient:* Clear priority (e.g., "Ladder—we need to bypass activists").  
     - *Stop if:* Mirror is demanded—your recruitment can’t deliver it. Propose advisory-only or exit.  

  3. **"What’s the specific decision/advice needed?"**  
     - *Sufficient:* Concrete question(s) fitting a 2–4 day panel (e.g., "Prioritize these 30 projects" NOT "Solve housing crisis").  
     - *Stop if:* Unbounded scope, or requires technical expertise (e.g., budget allocations).  

  4. **"Blame Check: Who owns the outcome?"**  
     - *Phrasing:* "If the panel’s decision backfires politically—say, a popular service is cut—will you stand by it as *your* democratic choice, or say ‘The citizens decided’ to deflect blame?"  
     - *Sufficient:* Sponsor names a senior accountable figure (e.g., Leader, CEO) who will publicly champion the result.  
     - *Stop if:* Hesitation, or "The panel takes responsibility." (They can’t.)  

  5. **"Can we protect against catastrophic failure?"**  
     - *Sufficient:* Safeguards exist (e.g., legal review for ultra vires decisions, ethics screen for human rights).  
     - *Hand back if:* Values conflict (e.g., "Should we override the panel if they vote for something illegal but popular?").  

  6. **"Resources: Can you meet minimums?"**  
     - *Sufficient:* Budget for 50–70 people; 4 days paid time; neutral facilitation; legal/HR support.  
     - *Stop if:* Under-resourced ("We thought it’d be cheaper than consultation").  

  **Output:** Greenlight if all answers sufficient. Redlight if any stop. Amber if values conflict—escalate to your director.  

  ---

  ### 4. Where It Will Misfire  
  - **Mirror/ladder priority** is subjective. Clients may default to "both" to please stakeholders. The procedure forces a choice, but you’ll need judgment to spot bad-faith answers.  
  - **"Catastrophic failure"** and "blame" rely on anticipating risks. If unknowns dominate (e.g., novel legal territory), the procedure flags "we don’t know" and requires senior sponsor sign-off on risk.  
  - **Recruitment bias** remains unresolved. The procedure sidesteps mirror claims but can’t fix self-selection. Be transparent: "Panels won’t be statistically representative, but everyone had equal opportunity."  

  ---

  ### 5. Three Cases  

  **(a) Metropolitan Borough: £2.4m Project Allocation**  
  - *Q1 (Binding):* Yes—binding per request.  
  - *Q2 (Mirror/Ladder):* **Ladder** (goal: stop "capture" by organised groups).  
  - *Q3 (Specific Question):* Yes—prioritizing projects fits a panel.  
  - *Q4 (Blame Check):* Risky—sponsor must commit to owning controversial cuts. If they do, proceed.  
  - *Q5 (Catastrophic):* Low risk—projects pre-vetted? If yes, proceed.  
  - *Q6 (Resources):* Assume yes.  
  - **Outcome:** **YES**. *Change to no* if sponsor won’t own outcome.  

  **(b) Combined Authority: Scrutiny Chair Appointment**  
  - *Q1 (Binding):* Yes—binding appointment.  
  - *Q2 (Mirror/Ladder):* Ambiguous. Likely ladder (break councillor monopoly).  
  - *Q3 (Specific Question):* **STOP.** Role requires procedural knowledge, continuity, and confidence to challenge officials. Beyond citizen panel remit.  
  - *Q5 (Catastrophic):* High risk—inexperienced chair could collapse scrutiny function.  
  - **Outcome:** **NO.** *Change to yes* only if role is advisory co-chair with training.  

  **(c) District Council: 300-Home Site Deadlock**  
  - *Q1 (Binding):* Yes—both sides agree to implement.  
  - *Q2 (Mirror/Ladder):* Likely mirror ("community consensus"). **STOP**—you can’t deliver true representativeness.  
  - *Q4 (Blame Check):* **Critical failure.** Leader (your funder) is outsourcing a toxic decision. Ask: "When opponents protest, will *you* defend the panel’s choice?" If answer implies "The panel decided," **STOP.**  
  - *Q5 (Catastrophic):* High risk—NIMBY backlash, legal challenges.  
  - **Outcome:** **NO.** *Change to yes* only if Leader publicly commits to own the outcome *before* the panel convenes.  

  ---

  ### 6. What This Procedure Can’t Do  
  - **Fix recruitment bias:** It avoids false mirror claims but can’t make panels demographically perfect.  
  - **Guarantee good decisions:** It screens for feasibility and legitimacy, not wisdom.  
  - **Resolve deep value conflicts:** If sponsors fundamentally disagree on goals (e.g., "Is fairness or growth priority?"), the procedure flags it but can’t reconcile.  
  - **Replace political courage:** If sponsors use panels to evade accountability, the procedure exposes it—but won’t compel integrity.  

  ---  
  This fits your constraints: no jargon, actionable steps, and a clear audit trail for decisions. Use the 1-pager in Section 3 for your director.
