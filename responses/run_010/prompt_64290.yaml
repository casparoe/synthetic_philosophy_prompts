prompt: |-
  I have ninety minutes with a first-year graduate seminar in political philosophy, and the aim is to get them to see what actually separates prioritarianism from egalitarianism. I want to build the session around Parfit's leveling-down objection rather than around texts, and I want a plan for the explanation, not the explanation itself.

  The students arrive from three weeks on Rawls's difference principle, and I expect several to assume the priority view is just that principle restated in welfare terms. Tell me what has to be secured before the outcome comparison can do any work: I suspect the in-one-respect-better versus all-things-considered-better distinction must precede the numbers, but I don't know where welfarism and interpersonal comparison belong, or whether the person-affecting idea should surface at all. Vet the toy case I intend to use — two hundred people, half at welfare 100 and half at 200; then all at 150; then all at 100 — and say what it must contain and what it must leave out for the objection to bite rather than look like a cheap trick.

  Then map the misconceptions I should expect: that the objection asserts leveling down is good, that it disqualifies any concern for the worst off, that prioritarianism is the difference principle in disguise. Fix the point in the sequence at which each should be headed off, give me one closing question whose answers separate students who hold the distinction from students who have memorized a slogan, and say which neighbouring disputes — mere addition, deontic egalitarianism, whether the priority view is even consequentialist — I should defer and openly announce as deferred. Throughout, mark which moves are settled among people who work on this and which remain genuinely contested; I don't want to hand the seminar a live dispute dressed up as consensus.
reasoning: |-
  Okay, the user is teaching a first-year graduate seminar in political philosophy and has ninety minutes to help students distinguish prioritarianism from egalitarianism using Parfit's leveling-down objection. They want a lesson plan focused on the objection rather than texts, and they're concerned about students confusing prioritarianism with Rawls's difference principle. 

  The students have just spent three weeks on Rawls, so some might think prioritarianism is just the difference principle applied to welfare. The user needs to clarify this upfront. They also have a toy case in mind: 200 people split between welfare levels 100 and 200, then leveled to 150, then down to 100. But they're worried this might look like a cheap trick, so the case needs careful setup.

  First, the foundational concepts must be secured before diving into comparisons. Welfarism and interpersonal comparability are essential—students must accept that welfare levels can be measured and compared across people. Without this, the numbers won't make sense. Then, the distinction between "in one respect better" and "all things considered better" is crucial. Egalitarians might say leveling down is better in one way (it achieves equality) but worse overall. Prioritarians reject that equality has any intrinsic value.

  For the toy case to work, it must show that leveling down only achieves equality by making everyone worse off. It should leave out irrelevant factors like desert or responsibility—just focus on welfare distributions. The move to all at 150 is important because it shows equality without leveling down. 

  Common misconceptions need addressing. Some students might think the objection claims leveling down is good—clarify it's the opposite. Others might think it dismisses concern for the worst off—emphasize prioritarianism still prioritizes them. And the Rawls confusion must be tackled early: difference principle is about primary goods, not welfare, and it's relational, unlike prioritarianism.

  The closing question should test deep understanding: "If we achieve equality by making everyone better off, would prioritarianism and egalitarianism agree? What if we achieve it by making everyone worse off?" This forces students to apply the core distinctions.

  Finally, defer adjacent debates like mere addition or deontic egalitarianism to keep focus. Note that while the leveling-down objection is widely accepted against telic egalitarianism, prioritarianism's status as consequentialist is contested. Be transparent about these boundaries to avoid presenting contested ideas as settled.
answer: |-
  Here’s a structured seminar plan targeting your goals, with timing estimates and explicit handling of misconceptions:

  ### **Foundations to Secure First (25 mins)**  
  1.  **Welfarism & Interpersonal Comparability (10 mins)**  
      - *Why essential:* Without agreement that welfare is the currency of justice *and* that interpersonal comparisons are meaningful, the cases won’t land.  
      - *Move:* Quickly define welfarism (states evaluated solely by individual welfare) and confirm comparability (a unit of welfare gain/loss means the same for all).  
      - *Settled:* Welfarism is a shared premise for this debate; comparability is assumed in standard formulations.  

  2.  **"In-One-Respect Better" vs. "All-Things-Considered Better" (10 mins)**  
      - *Why essential:* The Leveling Down Objection (LDO) hinges on this distinction. Egalitarianism can claim leveling down is *pro tanto* good (in one respect) while granting it’s *all-things-considered* bad.  
      - *Move:* Use non-moral examples (e.g., "A spicy meal is better *in one respect* (flavor) but worse *all things considered* if it gives you heartburn").  

  3.  **Clarify Rawls vs. Welfare Metrics (5 mins)**  
      - *Preempt misconception:* State explicitly: "Rawls’ difference principle uses *primary goods*, not welfare. Prioritarians use welfare. This matters because Rawls isn’t committed to welfarist leveling down."  

  ---

  ### **The Toy Case & Leveling Down Objection (30 mins)**  
  **Your Case (refined):**  
  - **State A:** 100 at 100, 100 at 200.  
  - **State B:** 200 at 150. *(Equality via improvement)*  
  - **State C:** 200 at 100. *(Equality via leveling down)*  

  **Critical Adjustments for "Bite":**  
  - **Include State B:** Shows equality *can* be achieved without loss. Without this, students might think LDO attacks *all* equality moves.  
  - **Exclude Desert/Responsibility:** Assume identical deservingness. Introducing these invites desert-based objections, muddying the distributive principle.  
  - **Specify Welfare Units:** Use "utils" (or similar) to emphasize cardinal, comparable welfare.  
  - **State the Egalitarian Claim Clearly:** "For a *telic* egalitarian, State C is better than A *in one respect*: it has more equality."  

  **LDO Sequence:**  
  1. Ask: "Is State C better than State A?" (Likely unanimous "no").  
  2. Ask: "Could an egalitarian still say it’s better *in one way*?" (Introduce *pro tanto* goodness).  
  3. **Objection Bite:** "If egalitarianism says C is better *in any respect* than A, it must value something (equality) that requires *no one to be better off and some to be worse off*. Is that plausible?"  
  4. Contrast with **Prioritarianism:** "Prioritarians see no value in equality itself. B is best: it helps the worse off without absolute loss. C is worst."  

  ---

  ### **Countering Misconceptions (15 mins)**  
  1.  **"LDO claims leveling down is good!"**  
      - *When:* During LDO presentation.  
      - *Preemption:* Explicitly state: "The objection is NOT that leveling down is good. It’s that egalitarianism implausibly implies leveling down is good *in one way*, even when it’s terrible overall."  

  2.  **"This discredits helping the worst off!"**  
      - *When:* After contrasting C with B.  
      - *Preemption:* "Prioritarianism *also* prioritizes the worst off! But it does so via diminishing marginal moral value of welfare, not equality. State B > State A for prioritarians."  

  3.  **"Prioritarianism = Difference Principle"**  
      - *When:* Foundational stage & when stating prioritarian verdict on B vs. A.  
      - *Preemption:* "Rawls focuses on social goods, prioritarians on welfare. Rawls’ benchmark is the least advantaged *group*, prioritarians weigh individual welfare gains. Rawls isn’t welfarist!"  

  ---

  ### **Closing (15 mins)**  
  - **Synthesis Question:** "State B (all at 150) achieves equality. State C (all at 100) also achieves equality. Why does the prioritarian approve of B but reject C, while the telic egalitarian sees *some* value in both moves away from A?"  
    - *Tests for:* Understanding prioritarianism’s focus on absolute welfare gains for the worse off vs. egalitarianism’s intrinsic valuation of equality.  
    - *Red flag slogan answer:* "Equality is always good" or "Leveling down is bad."  

  - **Deferred Issues (State Clearly):**  
    - **Mere Addition Paradox:** "We’re assuming fixed populations today."  
    - **Deontic vs. Telic Egalitarianism:** "Today’s objection targets *telic* (outcome-focused) egalitarianism. Deontic (relational/procedural) views are different."  
    - **Consequentialism of Priority View:** "We’re treating prioritarianism as a consequentialist view about states of affairs, though some dispute this."  

  ---

  ### **Contested vs. Settled**  
  - **Settled (for this context):**  
    - LDO is a widely accepted critique of *telic* egalitarianism.  
    - Prioritarianism ≠ egalitarianism; it rejects the intrinsic value of equality.  
    - Prioritarianism ≠ Rawls’ difference principle (different currencies, aggregation).  
  - **Genuinely Contested (Mention Briefly):**  
    - Whether *deontic* egalitarianism avoids LDO.  
    - Whether prioritarianism is coherent/consequentialist (e.g., conflicts with person-affecting views?).  
    - Whether "welfare" can be measured as required.  

  **Key Seminar Flow Logic:**  
  Welfarism/Comparability → "Pro Tanto" Distinction → Toy Case (A/B/C) → LDO → Prioritarian Alternative → Misconception Busting → Synthesis.  

  This sequence ensures students grasp the *structure* of the dispute before engaging the objection, isolates the core issue, and preempts predictable conflations with Rawls or misreadings of the objection.
