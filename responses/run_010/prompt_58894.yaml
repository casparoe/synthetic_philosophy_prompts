  - No pre-lecture; avoid the phrase "environmental determinism" until debrief.
  - Use only index cards, markers, and one whiteboard.
  - Three groups of four students each.
  - Each group has a "counterfactual auditor" role and a student who asks "what produced that decision?" for human actions.
  - Pressure without grades: use a scoring system (e.g., group standing on the whiteboard) based on consistency and reasoning.

