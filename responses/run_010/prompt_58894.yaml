  Below is a comprehensive, runnable activity designed for your 80-minute seminar. It uses only index cards, markers, and a single whiteboard. I've created a fictional historical case (Fort Maris, 1623) to avoid preconceived opinions. The activity forces students to confront slippage in causal attribution tools while exposing tensions between formal decomposition and historical practice.

  ---

  ### **Activity Overview**
  **Case:** Fort Maris, a coastal garrison town in the fictional Kingdom of Veridia, capitulated in 1623 after a 6-month siege by neighboring Aethelgard.  
  **Outcome:** Capitulation (surrender) of the town.  
  **Candidate Factors** (each on an index card):  
  - **Human:**  
    1. **Commander's Decision**: Held 3 weeks past empty granaries, hoping for relief.  
    2. **Defector**: A captain revealed weak points in walls.  
    3. **Relief Fleet Never Sailed**: Due to political infighting in Veridia's capital.  
  - **Non-Human:**  
    4. **Enteric Infection**: Dysentery outbreak in Month 5, weakening defenders.  
    5. **Drought**: 3-year drought pre-siege, reducing hinterland supplies.  
    6. **Volcanic Summer**: Ash cloud from distant eruption ruined harvest pre-siege.  
    7. **Grain Fungus**: Contaminated 40% of stored reserves early in siege.  

  **Core Tensions Exposed:**  
  - Additive decomposition vs. interaction effects.  
  - Human agency vs. environmental constraints.  
  - Contrast classes and background conditions in ledger assignments.  
  - Causal chains collapsing "human" vs. "non-human" shares.  

  ---

  ### **Phase-by-Phase Timing (80 Minutes Total)**
  1. **Introduction (5 min)**  
  2. **Round 1: Initial Allocation (25 min)**  
  3. **Round 2: Interaction Effects (20 min)**  
  4. **Round 3: Causal Chains (20 min)**  
  5. **Debrief (10 min)**  

  ---

  ### **Materials**
  - **Role Cards** (one set per group):  
    - **Facilitator**: Guides discussion, writes ledger.  
    - **Counterfactual Auditor**: Challenges allocations by asking: *“If we remove this factor, what happens? Does the outcome change?”*  
    - **Causal Chain Inquirer** (activated in Round 3): Asks: *“What produced that decision? Trace it backward.”*  
    - **Presenter**: Summarizes group’s reasoning.  
  - **Sealed Counterfactual Cards** (see full set below).  
  - **Whiteboard Setup**:  
    - Columns: Group 1, Group 2, Group 3.  
    - Rows: Round 1, Round 2, Round 3.  
    - Tracking: Points for "Reasoning Rigor" (✓) and "Ledger Consistency" (✓).  

  ---

  ### **Instructions for Students**
  **Handout Text (distributed at start):**  
  > *"Fort Maris fell in 1623 after a 6-month siege. Your group must apportion responsibility for the capitulation across assigned factors, summing to 100%.  
  > - **Round 1**: Use your factors and 2 sealed counterfactual cards. Defend allocations against your auditor.  
  > - **Round 2**: Revise your ledger using a new interaction card. Apply the rule: *‘If two factors interact, their joint share ≠ sum of individual shares.’*  
  > - **Round 3**: Integrate a causal chain card. Trace human decisions backward.  
  > The winning group earns ‘First Pick’ for next week’s reading topics."*  

  ---

  ### **Sealed Counterfactual Card Set**
  **Round 1 Cards (each group gets 2):**  
  - **Commander's Decision**: *“Without this decision, surrender occurs 3 weeks earlier. Outcome unchanged.”*  
  - **Defector**: *“Without defector, assault fails at Month 6. Siege continues; outcome unchanged.”*  
  - **Relief Fleet Never Sailed**: *“If fleet sailed, siege broken at Month 5. No capitulation.”*  
  - **Enteric Infection**: *“Without infection, defenders repel assault at Month 6. Capitulation delayed but occurs by Month 8.”*  
  - **Drought**: *“Without drought, granaries full. Town holds until relief arrives. No capitulation.”*  
  - **Volcanic Summer**: *“Without eruption, harvest normal. Town holds until relief. No capitulation.”*  
  - **Grain Fungus**: *“Without fungus, reserves last 2 extra months. Relief arrives; no capitulation.”*  

  **Round 2 Interaction Card (one per group):**  
  - *“Drought + Grain Fungus Interaction: Removing only drought = fungus ruins 50% of normal reserves (capitulation at Month 5). Removing only fungus = drought halves reserves (capitulation at Month 3). Removing both = reserves sufficient; no capitulation.”*  

  **Round 3 Causal Chain Card (one per group):**  
  - *“Relief fleet canceled because volcanic summer/drought caused famine, diverting ships to quell riots. Commander held out based on false hope from pre-siege fleet promises.”*  

  ---

  ### **Group Assignments and Factor Subsets**
  **Rationale:** Each group has overlapping factors to force debate.  
  - **Group 1**: Commander’s Decision, Defector, Enteric Infection, Drought.  
  - **Group 2**: Relief Fleet Never Sailed, Volcanic Summer, Grain Fungus, Commander’s Decision.  
  - **Group 3**: Defector, Enteric Infection, Volcanic Summer, Relief Fleet Never Sailed.  

  ---

  ### **Activity Flow**
  **Round 1: Initial Allocation (25 min)**  
  - Groups assign percentages (sum=100%). Auditor challenges (e.g., *“If infection removed, outcome unchanged. Why assign 20%?”*).  
  - Groups open 2 counterfactual cards → revise ledger.  
  - **Presenter shares ledger + reasoning (2 min/group)**.  
  - **Scoring**: Whiteboard checkmark for "Ledger Consistency" if percentages align with counterfactuals (e.g., if card says "no capitulation," factor >0%). "Reasoning Rigor" checkmark if auditor forced removal-based claims.  

  **Round 2: Interaction Effects (20 min)**  
  - Groups receive interaction card. Revise ledger under rule: *"Interaction ≠ sum of parts."*  
  - **Presenter shares changes (1 min/group)**.  
  - **Scoring**: "Reasoning Rigor" checkmark if group debates non-additivity (e.g., drought + fungus joint share ≠ drought% + fungus%).  

  **Round 3: Causal Chains (20 min)**  
  - Causal Chain Inquirer activated (asks: *“What produced Commander’s Decision?”*).  
  - Groups receive causal chain card → revise ledger.  
  - **Presenter shares final ledger (1 min/group)**.  
  - **Scoring**: "Reasoning Rigor" checkmark if human factors decrease due to environmental precursors.  

  **Standings**: Groups earn ✓ for each scoring criterion. Most ✓ wins "First Pick" for future readings.  

  ---

  ### **Predicted Problems and Mitigation**
  1. **Problem**: Allocating by moral blame (e.g., pathogen gets 0% because "it didn’t decide").  
     - **Mitigation**: Counterfactual Auditor forces removal-based claims (e.g., *“If pathogen removed, does outcome change? Card says yes—defenders repel assault. Why 0%?”*).  

  2. **Problem**: One group allocates 100% to drought to provoke.  
     - **Mitigation**: Ask: *“If only drought removed, interaction card says capitulation still occurs. How does 100% account for other necessary factors?”* Use scoring to penalize inconsistency.  

  3. **Problem**: Historians reject additive decomposition.  
     - **Mitigation**: In debrief, highlight that the *need* for a ledger assumes shared outcome measure—historians often disagree on what counts as "capitulation" (event? timing? moral failure?).  

  ---

  ### **Debrief (10 Min)**  
  **Key Questions for Class:**  
  1. *“What made assigning percentages hard?”*  
     → Exposes: Contrast class ambiguity (e.g., "capitulation vs. what?"), background conditions (e.g., "why count drought but not gravity?").  

  2. *“Where did formal tools ‘slip’?”*  
     → Maps to:  
     - Round 1: Additive shares ignore necessary conditions (card reveals drought is necessary, but ledger treats it as "one factor among many").  
     - Round 2: Interactions break additivity (drought + fungus joint necessity ≠ drought% + fungus%).  
     - Round 3: Causal chains collapse human/non-human divide (Commander’s Decision shrinks when traced to volcanic summer).  

  3. *“Why did ‘human share’ drop in Round 3?”*  
     → Uncovers: Human actions as intermediate causes; environmental factors as root causes.  

  **Conceptual Closure (Avoiding "Environmental Determinism"):**  
  - *“Today exposed tensions in apportioning causes. Formal tools require fixed contrasts and measurable outcomes—but historians often debate these. Counterfactuals let us simulate necessity, but real history argues about them. Next week, we read how scholars navigate this without ‘sealed cards.’”*  

  ---

  ### **What the Activity Cannot Reproduce**  
  **The Luxury of Sealed Counterfactuals**: Historians *argue* counterfactuals; they’re not given. In real historiography, the causal argument *is* the counterfactual.  

  **Compensation in the Room**:  
  - *“Today, counterfactuals were handed to you—a historian’s fantasy. In practice, scholars fight about what would have happened. Our cards simulated consensus for debate, but real history is a battle of plausible worlds.”*  
  - Assign a 1-minute reflection: *“What if your group had to invent counterfactuals? How would that change your ledger?”*  

  ---

  ### **Logistics Note**  
  All materials fit index cards:  
  - Role cards (4/group).  
  - Factor cards (4/group).  
  - Sealed counterfactuals (2 in R1, 1 in R2, 1 in R3 per group).  
  - Whiteboard tracks time/points.  

  This design forces students into the trenches of causal reasoning while ensuring historians and economists clash productively. The scoring system creates stakes without grades, and the debrief ties their frustration directly to your conceptual goals. Run it as-is, and watch the ledger wars begin!
