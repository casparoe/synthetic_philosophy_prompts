     - Commander's Decision: The commander decided to hold the town for three weeks after the granaries were empty, hoping for a relief fleet.
     - The Defector: A high-ranking officer defected to the enemy, revealing weak points in the defenses.
     - Relief Fleet: The relief fleet never sailed due to political infighting in the capital.

  2. Non-Human Factors:
     - Enteric Infection: An outbreak of dysentery (caused by contaminated water) weakened the defenders.
     - Multi-Year Drought: A drought that lasted three years before the siege, reducing the hinterland's ability to supply the town.
     - Volcanic Winter: A volcanic eruption in a distant land caused a cold summer, ruining the second harvest just before the siege.
