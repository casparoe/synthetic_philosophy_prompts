     Given time constraints, we might have to proceed with the initial plan for the defector and infection interaction for Groups 1 and 3, and for Group 2 the grain fungus and drought interaction (even though Group 2 doesn't have drought). But Group 2 has drought? No, Group 2 has: Relief Fleet, Volcanic Winter, Grain Fungus, Commander's Decision - no drought.

     This is a flaw in the design. We might need to redefine the groups to ensure that each group has at least one pair that can interact.

     Alternatively, we can have a class-wide interaction and then have groups revise. But the groups have different factors.

     Given the time, I propose we change the group compositions for Round 2? That would be messy.

     We'll instead have a class-wide interaction announcement that is about two factors that are not in any group's initial set? That doesn't help.

     Perhaps the best is to have the instructor introduce the concept of interaction with an example using two factors that are not in the activity, and then give each group a card that reveals an interaction between two of their factors, even if we have to force it.

     For Group 1: We'll create an interaction between the drought and the enteric infection (which they have): "Drought and Enteric Infection: The drought lowered the water table, which concentrated contaminants and made the infection spread faster. Without both factors, the infection would not have spread as fast and the defenders would have been strong enough to repel the assault at month 6. However, removing only the drought would not have prevented the infection (it would have spread slower) and the town would have fallen at month 7. Removing only the infection would have meant the defenders were strong and would have repelled the assault at month 6, but the town would have fallen at month 7 due to starvation. So individually, removing either doesn't prevent the fall. Only removing both does."

     For Group 2: We'll create an interaction between the volcanic winter and the grain fungus (which they have): "Volcanic Winter and Grain Fungus: The cold, damp conditions from the volcanic winter made the grain more susceptible to the fungus. Without both factors, the grain would have been sufficient and the town would have held until relieved. Removing only the volcanic winter would have left the grain vulnerable to the fungus anyway (because the storage conditions were poor), so the grain would have been ruined and the town would have fallen at month 1. Removing only the fungus would have left the grain untouched, but the volcanic winter meant the grain supply was half of normal, so the town would have fallen at month 5 (because the relief fleet never sailed)."

     For Group 3: They have Defector, Enteric Infection, Volcanic Winter, Relief Fleet. We can do an interaction between the defector and the enteric infection: as before.

     Now, we give each group an interaction card for two of their factors.

     Instructions for Round 2: "You have received a new counterfactual card that reveals an interaction between two of your factors. Use it to revise your ledger. You have 10 minutes. Then each group will present the change in 1 minute."

     Scoring: Groups get points for revising their ledger in light of the new information and for the quality of their reasoning about the interaction.

  3. Round 3: Causal Chains (20 minutes):
     - We introduce that the commander's decision was influenced by non-human factors.
     - We give each group a card: "The commander decided to hold because he believed the relief fleet was coming. However, the relief fleet was cancelled because of the volcanic winter (which made the king allocate resources to famine relief instead) and the drought (which caused unrest that required troops to be deployed elsewhere)."
     - Also, we have the role of the Causal Chain Inquirer become active. This student (one per group) is now instructed to ask for any human decision: "What produced that decision?" 
     - In this round, we give a card that shows the relief fleet never sailed because of the volcanic winter and the drought.

     Specifically, the card might say: "The relief fleet never sailed because the volcanic winter and the drought caused a famine in the capital region, which led to unrest. The king had to keep the fleet in port to maintain order."

     This means that the relief fleet factor is caused by the environmental factors.

     Also, we might want to show that the defector acted because of the infection? Not necessarily.

     We focus on the commander's decision and the relief fleet.

     Card for all groups: "Historical records show that the commander decided to hold because he had received a letter from the capital before the siege promising relief. The relief fleet was cancelled because of the volcanic winter and the drought, which caused widespread famine and unrest in the kingdom, diverting resources."

     So the environmental factors (volcanic winter and drought) caused the relief fleet to be cancelled, which caused the commander to hold out hope.

     Additionally, we can connect the infection to the drought: the drought lowered the water quality, leading to the enteric infection.

     But let's keep it to one chain.

     Instructions for Round 3: 
     "New evidence: Some of the human factors were influenced by the non-human factors. In your group, the Causal Chain Inquirer should ask, for each human decision: 'What produced that decision?' You have a new counterfactual card. Revise your ledger one last time. You have 10 minutes. Then we will have a final quick presentation."

     Scoring: Groups get points for incorporating the causal chain and for the auditor's challenges.

     In this round, we expect that groups will reduce the allocation to the human factors (like the relief fleet never sailing and the commander's decision) and increase the non-human factors. We want them to see that if the human actions are determined by the environment, then the environment gets the credit.

  4. Debrief (10 minutes):
     - First, ask the groups to reflect on the process: What was hardest? Where did they feel confident?
     - Then, map to conceptual points:
          - Round 1: The counterfactual test for causation (necessary condition). Also, the role of the contrast class (what we are holding fixed). 
          - Round 2: Non-additivity of causes (interaction effects) and the challenge of decomposing joint outcomes.
          - Round 3: Causal chains and the idea that human actions can be intermediate causes, with the environment as the root cause.
     - Finally, address the historian's resistance: 
          - The sealed counterfactuals are a luxury historians don't have. In real history, the counterfactuals are argued, not given.
          - The outcome measure is not agreed upon (e.g., timing vs. event).
          - Background conditions: Why are we counting the drought but not the existence of the town? Because we've chosen to focus on deviations from the norm.

     What will go wrong:
     - Students may allocate by moral blame: e.g., the pathogen gets little because it didn't decide. How to handle: The counterfactual auditor should ask: "If the pathogen had not been present, would the outcome have been different?" This forces them to think in terms of difference-making, not intention.
     - One group might allocate 100% to the drought to be provocative. The auditor should challenge: "If the drought were removed, would the outcome have been different? What about the other factors? How does your allocation account for the counterfactual evidence?"
     - In Round 3, they might not reduce the human factors. The causal chain inquirer should press: "What caused the relief fleet not to sail? If the drought caused the relief fleet to be cancelled, then without the drought, the relief fleet would have sailed. So the drought caused the relief fleet factor."

     What the activity cannot reproduce: 
     - Historians don't have sealed counterfactuals; they must argue about what would have happened. In the debrief, say: "In real history, the counterfactuals are the subject of debate. We've given them to you to simulate how historians use counterfactual reasoning, but in practice, they are not given."

     Now, let's write the materials.
