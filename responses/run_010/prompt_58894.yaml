  - Town: Fort Maris
  - Century: 17th century (early 1600s)
  - Context: A coastal garrison town in a fictional kingdom, besieged by a rival power. The siege lasted 6 months, and the town capitulated when the defenders could no longer hold.

  Candidate Factors (to be written on index cards for the groups):
