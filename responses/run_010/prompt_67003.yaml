prompt: |-
  I keep going back and forth on Aristotle on money and I want an actual number rather than a survey. The claim: that Aristotle's treatment of exchange — the bit in the Nicomachean Ethics about how unlike things (a house and a pair of shoes) get made commensurable, plus the material aquisition chapters in Politics I — commits him to the view that money is purely conventional, standing in for people's needs, with nothing in the goods themselves doing the equalising.

  Decompose it for me: the probability that the commensurability passage is really about need or demand rather than pointing at some underlying element shared by the goods; the probability that the Politics claim that money exists by convention and not by nature is doing the same job as that passage rather than a different one; the probability that Aristotle has anything we could reasonably translate as 'value' in the sense the question needs; plus any other terms you think belong. A number and a line of justification for each, then how they combine, and tell me which single term your final figure is most sensitive to.

  One thing I can't work out: would evidence that he rejected interest-taking because it makes money breed money push your number up (conventional all the way down) or down (a natural standard being corrupted), or is that orthogonal to the question entirely?
reasoning: |-
