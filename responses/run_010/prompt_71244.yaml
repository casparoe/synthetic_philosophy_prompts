prompt: |-
  Been on my college's traditions committee for six years now and there's a thing I keep running into that I don't have a word for. Almost everything we call a tradition here is openly recent. The Founder's Mug business started in 1994 — there's a memo about it, and the dean who came up with it is still alive and tells the origin story at every alumni weekend. Our town's harvest fair dates to 2003 and nobody has ever claimed otherwise; the historical society has the flyer from year one in a drawer. And yet these behave exactly like the genuinely ancient ones: first-years go through them and suddenly feel like they belong, people are weirdly protective of the details, alumni who skipped the actual events will fight you over the wording of the toast, and any suggestion of retiring one get's shot down as an attack on "tradition."

  The part I can't place is that nobody's confused and nobody's faking it. Everyone knows the mug was invented in the nineties, and knowing that costs the practice nothing — if anything people bring it up fondly, like it's part of the charm. The made-up-ness is out in the open and the thing still holds people together.

  So: is this a recognized pattern with a name of its own? I know Hobsbawm's invented tradition is the nearby idea, but as I understand it that one turns on people claiming continuity with a past that isn't actually there, and here there's no such claim, so I'm not sure it reaches the case. How does what I'm describing sit relative to ordinary custom or convention, and relative to situations where everyone is knowingly going along with a shared make-believe? If nothing established fits, coin a term and define it. I care less about the label than the edges — what counts as this, what doesn't, and what feature would break it if you removed it.

  Approach this as someone who actually works in social philosophy and heritage/memory studies: run through the candidate concepts first and knock out the ones that don't fit before you settle on anything. Lead with your bottom line in the first sentence — does a term exist or not, and which one — then give the reasoning. No preamble and no restating my question back at me.
reasoning: |-
  Alright, the user is deeply involved in their college's traditions committee and has noticed a fascinating phenomenon: newly created traditions that are openly recent yet function with the same emotional weight as ancient ones. They want to know if there's a recognized term for this.

  First, I recall Hobsbawm's "invented traditions," but that involves a false claim of historical continuity. Here, everyone knows the traditions are recent, so that doesn't fit. The user already mentioned this mismatch.

  Next, I consider "custom" or "convention." But those are neutral terms lacking the emotional resonance described. The traditions here have a deeper binding effect, more than just habitual practices.

  Then there's "invented tradition" without the false continuity. But the user needs a specific term. Maybe "stipulated tradition"? It captures the deliberate creation aspect but might not emphasize the performative, collective belief aspect enough.

  The user also mentions shared make-believe, like fictional worlds. But here, the traditions are real practices, not fictional. Participants aren't pretending; they genuinely invest in these rituals despite knowing their recent origins.

  Another angle: ritual studies. Rituals can be new but gain significance through repetition and collective participation. However, "ritual" is too broad and doesn't specify the transparent invention aspect.

  Looking into heritage studies, concepts like "intangible cultural heritage" include recent practices. But again, no specific term for the transparent origin. Terms like "heritagization" focus on the process, not the phenomenon itself.

  Neologism time. The key elements are: intentional creation, transparency of origin, emotional significance, and unifying function. "Sincere simulacrum"? Too abstract. "Authentic invention"? Maybe. "Performative tradition" highlights the enactment aspect but might be confusing with Austin's performative theory.

  "Consensual construct"? Emphasizes collective agreement. "Transparent tradition"? Straightforward but might not capture the depth. "Acknowledged fabrication"? But "fabrication" has negative connotations. 

  The user values understanding the boundaries. Essential features: open recency, emotional weight, unifying effect, no false historical claims. If any of these are missing—like pretending it's old or lacking emotional depth—it wouldn't fit.

  Also, the traditions must function as identity markers. Without that binding power, it's just a custom. The shared make-believe part is crucial: everyone knowingly invests meaning, making the tradition "real" through participation.

  So, coining "consensual pseudo-tradition" or "transparent tradition." But "pseudo" might imply falseness. "Benign fabrication"? Still negative. "Willed tradition" or "intentional tradition"? Closer. 

  Perhaps "affective artifact" but that's not quite right. After reviewing, "sincere simulacrum" came up earlier. Simulacrum usually means a copy without original, but here it's an original that functions like a tradition. Maybe redefining it?

  Final term: "Consensual Construct" - highlights the agreement and deliberate creation. "Construct" is neutral, used in social sciences. It captures the transparency and collective buy-in. The boundaries: must have unifying effect, open recency, no false claims. Removing consensuality or transparency breaks it. If it loses emotional weight, it becomes mere custom.
answer: |-
  Yes, a precise established term is lacking, but the core phenomenon is best described as a **Consensual Construct** (with "Sincere Simulacrum" or "Transparent Tradition" as viable alternatives). Here's the breakdown of candidate concepts and reasoning:

  1.  **Hobsbawm's "Invented Tradition" (Rejected):** As you note, this hinges on *fabricated historical continuity* and *obfuscation of recent origin* to legitimize practices or institutions. Your cases explicitly **lack** this obfuscation. The recent origin is known, documented, and often celebrated, disqualifying Hobsbawm's core mechanism.

  2.  **Custom/Convention (Insufficient):** While these *are* consensual social practices, the terms imply a degree of organic emergence, gradual normalization, and often a *lack* of the intense emotional investment, identity-forming power, and defensive protectiveness you describe. Your traditions function with the *affective weight* of deep tradition despite their known novelty, exceeding "mere" custom.

  3.  **Ritual (Overly Broad):** Rituals can be ancient or newly invented. While your traditions involve ritualistic elements (toasts, ceremonies), "ritual" doesn't capture the specific dynamic of **knowingly new practices functioning with ancient-traditions' social glue** as their defining feature. It describes the form, not the unique socio-psychological contract.

  4.  **Shared Fiction / Make-Believe (Misaligned):** This applies to phenomena like fandom, LARPing, or shared mythological frameworks where participants *knowingly suspend disbelief* about the underlying fiction. Your traditions are **not fictional.** The mug, the fair, the participation are real events. Participants aren't "pretending" it's old; they are **authentically investing meaning and identity** in a practice they *know* is new. The "make-believe" isn't about the tradition's age or existence, but about the *intensity of meaning ascribed* to it despite its recency.

  5.  **Neologism & Definition:**
      *   **Bottom Line Term: Consensual Construct.**
      *   **Definition:** *A social practice or artifact, consciously and recently created, whose acknowledged novelty does not impede its acquisition of deep affective significance, identity-forming power, and defensive protectiveness functionally equivalent to that of long-established traditions, sustained by explicit collective agreement on its value.*
      *   **Alternative Terms:**
          *   **Sincere Simulacrum:** Highlights the "copy" (simulacrum) of traditional function/affect, made powerful by genuine (sincere) collective belief *despite* its known artificiality.
          *   **Transparent Tradition:** Emphasizes the open acknowledgement of origin (transparency) coupled with traditional function.

  **The Edges (What Makes a Consensual Construct):**

  1.  **Open Recency:** The recent, deliberate origin is known, documented, and uncontested. **Not this:** If there's *any* attempt to obscure the origin or imply false antiquity, it slides towards Hobsbawm's invented tradition.
  2.  **Affective Weight & Identity Formation:** It must generate a sense of belonging, emotional resonance, and group identity comparable to "real" ancient traditions. **Not this:** A simple new club rule or popular event lacking this deep emotional/social binding power is just a new custom or convention.
  3.  **Defensive Protectiveness:** It inspires resistance to change based on its perceived inherent value to the group's identity, not just practicality. **Not this:** An event changed or retired easily due to logistics or shifting tastes fails this test.
  4.  **Functional Equivalence:** It operates *as if* it were ancient in its social role, binding past, present, and future participants. **Not this:** A purely commemorative event marking a known recent date, without this binding generational "tradition effect."
  5.  **Consensual Validation:** The power stems not from deception, but from the *collective agreement* to invest it with significance *despite* knowing its newness. This is the critical "shared make-believe" element, but applied to the *meaning*, not the *facticity*. **Breaks if:** The consensual agreement breaks down. If a significant faction starts dismissing it *because* it's new ("It's not a *real* tradition!"), the construct collapses back into being "just" a recent event. Its power relies entirely on sustained collective buy-in to the *ascribed significance*.

  **In essence:** A Consensual Construct is a knowingly new social artifact that the group, through explicit agreement, *chooses* to treat with the reverence and emotional investment of an ancient tradition, resulting in it functionally becoming one, without any false historical claims. Its power is performative and consensual, not historical. Remove the **consensus** (collective buy-in to its significance) or the **transparency** (open acknowledgement of novelty), and the phenomenon ceases to be what you describe.
