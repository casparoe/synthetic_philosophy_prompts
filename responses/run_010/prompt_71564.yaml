prompt: |-
  I'm TA-ing a third-year epistemology module and I'm in the middle of marking the take-home for the scepticism week. The question is one I set myself:

  > Moore's 'Proof of an External World' responds to the sceptic by insisting that he knows he has hands. Explain Wittgenstein's response to Moore in On Certainty: what does he take to be wrong with Moore's claim, and what status does he give to propositions like 'here is a hand' or 'the earth existed long before my birth'? Then say whether Wittgenstein's account actually delivers what Moore was after — a reason to think the sceptic is wrong — and justify your verdict.

  There's 38 of these and I've got until tomorrow morning. My co-marker and I don't see eye to eye about how harshly to treat bold interpretive gambles in an undergraduate script, which is why I want a third read before I put numbers on anything. I've deliberately not annotated this one and I'm not going to say what I make of it, so you're getting it completely cold.

  **Student's answer:**

  > Moore tried to refute the sceptic by holding up his hands and claiming to know that here is one hand and here is another. Wittgenstein's response in his final notes is that Moore has got the grammar of 'know' wrong. To say that you know something implies that you could be mistaken, implies that you have grounds, and implies that there is some way of finding out. None of that applies to Moore's propositions. He has no evidence for them, he could not say how he came to know them, and in the circumstances it would make no sense to doubt them. So they are not items of knowledge at all, and Moore has not proved anything against the sceptic; he has only made a noise.
  >
  > What Wittgenstein offers instead is a different role for such propositions. Things like 'the earth existed long before my birth' or 'objects do not vanish when nobody is looking at them' work as hinges: the door turns on them, but they themselves stay put, and it is only against a background of such propositions that testing, justifying and doubting can get going at all. Doubt presupposes certainty. A doubt that doubted everything would not be a doubt, because it would have destroyed the rules that determine what counts as a reason, a test or a mistake. Hinges are therefore not justified; they are what justification is measured against, and demanding grounds for them gets the order of explanation backwards. Nor are they beliefs we merely hold very strongly. The certainty involved shows itself in how we act — in the fact that certain possibilities simply do not occur to us as things to investigate — rather than in any inner feeling of conviction.
  >
  > The consequences for scepticism are the interesting part. Because hinges are groundless, Wittgenstein's position amounts to a kind of relativism about knowledge. Each of us inherits a world-picture, and inside it some things stand fast while others are open to question. The sceptic is working with a different set of hinges: for him, 'there is an external world' is not something that stands fast but something up for debate. Since there is no framework-neutral standpoint from which to compare the two world-pictures, the sceptic cannot be refuted — but neither can he be shown to be mistaken, since 'mistake' only has a use within a framework. The two sides are simply playing different games.
  >
  > This is also why the closure principle has to be abandoned. We can know that we have hands, and we can know that having hands entails that there is an external world, but we cannot know that there is an external world; knowledge is not closed under known entailment, and once you see that the sceptical argument loses its bite, because it depends on transferring warrant from the everyday proposition to the sceptical hypothesis. Contemporary hinge epistemologists make the same point by talking about entitlement: we are entitled to accept our hinge commitments without evidence and without doing anything wrong. Wittgenstein's riverbed image says the same thing in a picture. The water of ordinary empirical propositions flows along a bed made of hardened ones, and although the bed can be reshaped over time, what lies in the bed is not itself up for revision on the basis of experience.

  What I need back from you: a mark out of 100 — our bands are 70+ first, 60–69 upper second, 50–59 lower second, 40–49 third, under 40 fail — and then the feedback text I'd paste into the comments box. I want it point by point, keyed to particular claims in the answer, not a general impression of the whole thing. For each bit, tell me whether it's accurate and should be credited, whether it's straightforwardly wrong, or whether it's a defensible-but-contested reading being stated with more confidence than an undergraduate has earned. Please keep those last two categories clearly separate, since I mark them differently and it's the thing my co-marker and I keep arguing about. If some part of the answer undercuts another part, name both places. Then finish with what the student would have to do differently to move up a band, because I have to write that sentence anyway and I'd rather not think of it from scratch at 1am.

  Don't rewrite the essay for them, and don't give me a reading list or references — I just want the assessment itself. British English throughout please, spelling and terminology both.
reasoning: |-
  Alright, let me tackle this TA's request systematically. The user needs a cold assessment of an undergraduate epistemology essay on Wittgenstein's response to Moore, with specific marking and feedback. 

  First, I'm noting the essay's structure: it covers Moore's argument, Wittgenstein's critique, the hinge proposition concept, and implications for scepticism. The student seems to grasp the core ideas well - especially the grammatical error in Moore's "know" usage and the non-evidential nature of hinges. That's strong for undergrad level.

  Hmm, the relativism interpretation in the consequences section is tricky. While Wittgenstein does discuss world-pictures, calling it "relativism" is an overstep - he emphasizes shared human certainty more than cultural frameworks. The student's phrasing makes it sound like incommensurable systems, which isn't quite right. Also, the closure principle point is overstated; Wittgenstein challenges its application to hinges but doesn't outright reject it as a principle.

  For marking... the accurate sections (Moore critique, hinge functionality) deserve high credit. The relativism and closure claims need flagging as contested interpretations - not flat wrong, but requiring more nuance. The "sceptic can't be shown mistaken" bit actually contradicts Wittgenstein's view that scepticism is nonsensical within our framework. That's a significant tension.

  I'm thinking 68 - a solid upper second. To hit first class, the student would need to temper bold claims about relativism and closure, plus resolve that internal contradiction about whether scepticism is refutable. Might suggest tightening the "hinges aren't beliefs" explanation too; it's correct but could reference Wittgenstein's action-based certainty more precisely.

  Feedback should mirror this: praise clear hinge explanation, note where interpretations exceed textual support, highlight the scepticism-refutation inconsistency. Keep it point-by-point as requested, no generalities. And definitely use "colour" not "color" - user specified British English!
answer: |-
  **Assessment**

  **Mark:** 68/100 (Solid Upper Second / 2:1)

  **Feedback (Point-by-Point):**

  1.  **Moore's Error & Grammar of 'Know':** Accurate and well-explained. Correctly identifies Wittgenstein's core critique: Moore misapplies 'know' by ignoring its grammatical requirements (possibility of mistake, need for grounds/evidence, capacity for investigation). Credited. (e.g., "To say that you know something implies...")
  2.  **Status of Propositions (Hinges):** Accurate and strong explanation. Correctly identifies the role of propositions like 'here is a hand' as hinges – the unchanging framework enabling doubt, justification, and inquiry. Correctly notes they are not justified by evidence, are not beliefs in the ordinary sense, and manifest in action. Well done. (e.g., "Things like... work as hinges...", "Hinges are therefore not justified...", "certainty involved shows itself in how we act").
  3.  **Doubt Presupposes Certainty:** Accurate. Correctly captures Wittgenstein's argument that radical doubt is incoherent as it undermines the very framework needed for doubt to be meaningful. Credited. (e.g., "Doubt presupposes certainty...", "A doubt that doubted everything would not be a doubt...").
  4.  **Consequences - Scepticism & Relativism:** **Defensible-but-contested interpretation stated with excessive confidence.** While Wittgenstein *does* discuss inherited world-pictures and the lack of a framework-neutral standpoint, characterising his position as a "kind of relativism" and suggesting the sceptic simply has a "different set of hinges" is a significant interpretive leap. Wittgenstein emphasizes the *shared, fundamental, animal* nature of hinge certainty (like having hands) more than cultural relativism. The sceptic's doubt, for Wittgenstein, often arises from *misusing* language within *our* framework, not operating within a coherent alternative one. This section oversimplifies and overstates the relativistic reading.
  5.  **Refuting the Sceptic:** **Internally contradictory and partially inaccurate.** The claim "the sceptic cannot be refuted" directly contradicts the claim made later that the sceptical argument "loses its bite". More importantly, while Wittgenstein *does* argue Moore's *specific proof* fails, a core point of *On Certainty* is that the sceptic's *doubt itself* is nonsensical *within the human framework of action and language*. Wittgenstein *does* think he has shown the sceptic is profoundly wrong/misguided *in the way they try to doubt*, not just that they play a different game. The statement "neither can he be shown to be mistaken, since 'mistake' only has a use within a framework" misapplies the point – within *our* framework, the sceptic *is* making a grammatical mistake (trying to doubt what cannot intelligibly be doubted). The final sentence about the argument losing its bite is *more* accurate, but undermined by the preceding relativism.
  6.  **Closure Principle:** **Defensible-but-contested interpretation stated with excessive confidence.** The claim "the closure principle has to be abandoned" is a strong interpretation favoured by some (e.g., Wright, Pritchard's 'hinge commitment') but contested by others who argue Wittgenstein challenges its *application* to hinges rather than rejecting the principle itself for ordinary empirical knowledge. Stating it as a necessary consequence Wittgenstein "has to" draw is too strong for an undergraduate answer without qualification.
  7.  **Contemporary Hinge Epistemologists & Entitlement:** Accurate and relevant connection. Correctly links Wittgenstein's ideas to the contemporary concept of epistemic entitlement for hinges. Credited.
  8.  **Riverbed Image:** Accurate and well-used. Correctly explains the metaphor of the riverbed and hardened propositions. Credited.

  **Summary of Key Feedback Points:**

  *   **Accurate & Credited:** Explanation of Moore's error regarding 'know', the nature and role of hinge propositions, the incoherence of global doubt, the connection to entitlement, and the riverbed image.
  *   **Defensible-but-Contested (Marked less harshly, but noted as exceeding warranted confidence):** The characterisation of Wittgenstein's position as "relativism" and the specific claim that the closure principle *must be abandoned*.
  *   **Inaccurate/Problematic:** The claim that the sceptic "cannot be refuted" or "shown to be mistaken" within the framework, which contradicts Wittgenstein's core aim of diagnosing the sceptic's confusion and contradicts the student's own later point about the argument losing its bite. The relativism claim also contributes to undermining the argument against scepticism.

  **To Move Up a Band (e.g., to a First / 70+):**

  To achieve a higher mark, the student would need to provide a more nuanced interpretation, particularly concerning relativism and the refutation of scepticism, avoiding overconfident claims about contested readings (like the necessity of abandoning closure or strong relativism), and ensuring consistency in explaining *how* Wittgenstein's account *does* undermine scepticism by exposing its nonsensical nature within our linguistic and practical framework, rather than portraying it as an incommensurable alternative. Tightening the explanation of why the sceptical doubt itself fails according to Wittgenstein (beyond Moore's proof failing) is crucial.
