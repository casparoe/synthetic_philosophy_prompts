  ## OFFICIAL PARTICIPANT PACKET: THE ALISTAIR PENNINGTON FOUNDATION'S RESOLUTE RESOLUTION PRIZE  
  **Version 12.7 (Revised Per *Baxter v. Foundation*, 9th Cir.)**

  **Congratulations!** You have expressed interest in earning **ONE MILLION US DOLLARS ($1,000,000.00)** through the demonstration of profound intentional fortitude. Please review these binding Terms & Conditions ("Terms") governing the Resolute Resolution Prize ("Prize").

  **1. The Prize Opportunity:** The Alistair Pennington Foundation ("Foundation") will deposit **$1,000,000.00** into the verified bank account of any Eligible Participant ("Participant") who, **at precisely 11:59:59 PM local time on the day before the Designated Drinking Date ("Midnight Deadline")**, possesses a *genuine, verified intention* **to consume the entire contents of the vial of Pennington Toxin ("Toxin") provided by the Foundation at precisely 12:00 PM local time on the following day ("Designated Drinking Date")**.

  **2. Toxin Effects:** The Toxin causes non-lethal, acute gastrointestinal distress, vomiting, headache, and generalized malaise lasting approximately 24 hours. Effects commence ~30 minutes post-consumption. No known long-term physical or psychological sequelae exist based on Foundation-funded studies (Reports P-Tox/001-015 available upon NDA request). Consumption is **NOT REQUIRED** to win the Prize.

  **3. Eligibility:** Participants must be: (a) 18+ years of age; (b) Legally competent per jurisdiction of residence; (c) Capable of forming complex future intentions; (d) Willing to submit to Verification Procedures (Clause 4); (e) Willing to sign all Releases (Clause 8).

  **4. Verification of Intention ("The Core Procedure"):**
      > **a. Definition:** "Intention" is defined as a *sincere, contemporaneous commitment* held by the Participant at the Midnight Deadline to perform the act of drinking the Toxin at the Designated Time. Belief regarding *future* action is irrelevant to *present* intention verification.
      >
      > **b. Method:** Verification requires unanimous real-time assessment by the Foundation's three-member **Intention Verification Panel ("IVP")**, utilizing synchronized multi-modal biometric analysis (fMRI, fNIRS, EDA, EKG, EMG) and structured phenomenological interview. **No other methods (notarized statements, self-recordings, witness testimony, pre-commitment devices, hypnosis) constitute valid verification.**
      >
      > **c. Panel Discretion:** The IVP possesses sole, non-appealable authority to determine if the Participant's neurological, physiological, and verbal responses meet the threshold for "genuine intention" as psychometrically defined by Foundation protocols (Proprietary Algorithm PENN-IV.v7).
      >
      > **d. "Intending-to-Intend" Exclusion:** Neurological signatures or verbal declarations indicating the Participant *aims to cultivate* the required intention later, but does not possess it at the Midnight Deadline, constitute immediate disqualification.
      >
      > **e. Pre-Commitment Devices:** Use of physical restraints, financial penalties imposed on oneself, or public pledges ("Ulysses Contracts") designed to *compel* future drinking are admissible evidence *only* of *anticipated future action*, not proof of *present intention*, and may negatively bias IVP assessment.
      >
      > **f. Existing Affinity:** A pre-existing desire or willingness to experience effects *similar* to the Toxin's does not, in itself, satisfy the intention requirement. The intention *must* be specifically formed regarding the *act of drinking the Foundation's Toxin at the Designated Time*.

  **5. Prize Disbursement:** Upon successful IVP verification at the Midnight Deadline, the Prize will be deposited into the Participant's designated account by 9:00 AM local time on the Designated Drinking Date. Disbursement occurs **regardless of whether the Participant consumes the Toxin later that day.**

  **6. Post-Intention Actions & Clawbacks:**
      > **a. Change of Mind:** Participants are expressly permitted to reconsider and choose **not** to drink the Toxin after Prize disbursement. No penalty applies.
      >
      > **b. Accidental Consumption/Duress:** Prize funds will **not** be clawed back if the Participant drinks the Toxin accidentally, under duress, or for reasons unrelated to the intention held at the Midnight Deadline.
      >
      > **c. "Enjoyment" Clause:** Consuming the Toxin and subsequently reporting minimal discomfort or even enjoyment **does not** invalidate the Prize or the prior verified intention. The Prize is awarded for the *intention*, not the experience.

  **7. Tax Treatment:** The Foundation reports the Prize to the IRS as **"Non-Employment Cognitive State Achievement Income"** (NECSAI). The Foundation takes no position on Participant deductions related to the sick day. Consult a tax professional. *(Disclaimer: IRS classification is provisional and subject to audit.)*

  **8. Liability Release (Mandatory):** Participation requires signing Release Form P-RLZ/01, absolving the Foundation, its officers, the IVP, and Toxin manufacturers from all liability related to: Verification Procedures, Toxin possession, Toxin consumption (voluntary or accidental), Prize-related tax consequences, and existential distress arising from contemplation of the Terms.

  **9. Special Considerations:**
      > **a. "The Resolute Person":** Claims of being "the kind of person who always follows through" require documented, verifiable historical evidence of similar high-stakes resoluteness (e.g., independently verified completion of prior extremely aversive acts based solely on prior intent). Self-assessment is inadmissible.
      >
      > **b. Anticipated Recantation:** Participants who *know at the Midnight Deadline* they will likely change their mind before 12:00 PM are **still eligible** for the Prize if they possess the *genuine intention at the Midnight Deadline*. The Prize incentivizes the *formation* of the intention, not its persistence.

  ### FREQUENTLY ASKED QUESTIONS (FAQ)

  **Q: Can I just sign a contract promising I intend to drink it?**
  A: No. Per Clause 4b & 4e, only real-time IVP verification via the specified biometric and interview protocol is valid. Signatures bind actions, not provably verify transient mental states.

  **Q: I enjoy mild discomfort! Can I just drink it and get the money?**
  A: Enjoyment is irrelevant (Clause 6c). You only get the money if you form and *verify* the *specific intention* at midnight the night before. Drinking without verified intention earns you only nausea.

  **Q: What if I have a change of heart *during* the verification?**
  A: The IVP assessment is designed to detect the psychological state precisely at the Midnight Deadline. Fluctuations detected during the procedure itself will be analyzed per Protocol PENN-IV.v7. Honest changes *during* assessment may still qualify if the threshold intention was met *at* the Deadline.

  **Q: Is the Prize really achievable?**
  A: The Foundation believes the Prize criteria are logically coherent and empirically verifiable. We maintain the highest confidence in our Verification Procedures. *(See Clause 10)*.

  **10. Historical Payout Record:** For transparency, the Foundation discloses that, as of the date of these Terms, **no Participant has yet successfully met the IVP verification threshold for Prize disbursement.** This reflects the extraordinary cognitive achievement demanded, not a flaw in the Prize structure. We eagerly await our first qualified Resolute Champion! Applications remain open.

  ---
  **Where the Document Takes Liberties (Post-Packet Analysis):**

  1.  **Defining "Intention":** Clause 4a's definition ("sincere, contemporaneous commitment") is a pragmatic operationalization for the document, not a philosophical resolution. The debate rages on about whether "intending X" is compatible with *believing you won't do X*. The document **sides against the roommate's strict view** by allowing someone who *knows they'll recant* (Clause 9b) to potentially win if they have the intention *at midnight*. This reflects the "actual present intention is possible even with known future weakness" position. This is **highly contested**.
  2.  **Rejecting Ulysses Contracts/Precommitment:** Clause 4e explicitly states these show *anticipated action*, not *present intention*. This dismisses a major proposed solution (resolute choice/self-binding). The philosophical viability and psychological reality of such resolute intentions are **actively debated**. The document takes a firm stance against them counting.
  3.  **The Verification Method:** The fictional IVP and Algorithm PENN-IV.v7 handwave the *massive* problem of other-minds and measuring intention. Real philosophy has no consensus on whether intention is *even in principle* verifiable by a third party in this way. The document **pretends this is solvable with tech** for satirical/legalistic effect.
  4.  **The "Never Paid Out" Clause (10):** This leans into the roommate's argument about the prize being unattainable, but frames it as a practical hurdle ("extraordinary cognitive achievement") rather than a logical impossibility. It leaves the door open, implicitly rejecting the roommate's "in principle" impossibility claim while acknowledging the empirical reality (in the fiction) that no one has managed it. This is **agnostic** on the core "is it possible?" debate but highlights the practical paradox.
  5.  **Tax Treatment:** Pure satirical invention. There's no IRS category for this. It highlights the absurdity of taxing a mental state.

  **In short:** The document resolves the *fictional contest's rules* by taking specific, debatable stances on the philosophy (especially rejecting self-binding as proof of intention and allowing intention alongside known future recantation), implicitly siding *against* your roommate's "impossible in principle" stance within its own framework, while satirizing the difficulty by admitting no one has ever succeeded. The core questions Kavka raised about intention, belief, and time remain genuinely open and contested in philosophy.
