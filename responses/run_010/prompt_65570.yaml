answer: |-
  ### Diagnosis  
  Your assumption that there is no formal contradiction within the columnist's claims is **sound**: the text contains no logical inconsistency, only reprehensible views. Your view that repellence isn’t a premise is also correct. However, your claim that the piece contains "no argument at all" is **mistaken**. It constructs a *satirical parallel* to expose flawed reasoning, not through internal contradiction but by mirroring real defenses of the generic masculine to trigger moral dissonance in a specific audience.  

  ### What the Piece Is Doing  
  The essay is a **satirical parody** targeting readers who reject racism but tolerate sexism. By transposing defenses of generic "he" (e.g., "inclusive ‘he’ has no connotations of gender") to race ("inclusive ‘white’ has no connotations of race"), Hofstadter exposes three flaws:  
  1. **Hypocrisy**: Defenders of generic "he" would never accept equivalent reasoning in a racial context.  
  2. **Disingenuous Neutrality Claims**: Assertions that "he" is "truly inclusive" or "connotation-free" are shown as implausible when applied to "white."  
  3. **Resistance to Change**: Mocking objections to neologisms (e.g., "tey") or singular "they" reveals the arbitrariness of privileging tradition over inclusion.  
  The "argument" isn’t deductive; it’s **rhetorical jiu-jitsu**. The audience (1980s progressives) is meant to reject the columnist’s racism instantly, then recognize their own inconsistency in dismissing analogous sexist arguments. The exposure is of *cognitive dissonance*, not formal fallacy.  

  ### Is There a *Reductio*?  
  **No**, not in the strict logical sense. A traditional *reductio* requires deriving a contradiction *from the opponent’s premises*. Here, the columnist’s claims cohere internally; the inconsistency arises **externally**, in the reader’s own beliefs. The "absurdity" is pragmatic: the reader who condemns the racist parody but accepts the sexist original holds incompatible commitments. The piece thus functions as an *ad hominem* mirror: "If you find *this* vile, why not *that*?" It’s a challenge to consistency, not a proof of contradiction.  

  ### The Asymmetry Objection  
  The asymmetry in sensitivities isn’t a weakness—it’s **the engine of the satire**. Hofstadter *relies* on his audience’s greater aversion to racism to destabilize their acceptance of sexism. This doesn’t invalidate the critique; it exploits a cultural blind spot to reveal that defenses of generic "he" rest on **social privilege, not logic**.  
  **Subsequent usage shifts validate this**: Generic "he" has largely retreated in formal English (replaced by "they" or rephrasing), confirming that its "inclusivity" was always contested and context-dependent. The asymmetry highlighted why sexist language persisted *despite* identical arguments failing for race—not because the reasoning was sound, but because the power dynamics differed. The essay thus diagnoses a social problem, not a linguistic one.  

  ### What Survives for Your Paper  
  The essay **licenses you to claim**:  
  1. Defenses of generic "he" were often **rhetorically weak**, relying on tradition, false neutrality, and resistance to change—flaws exposed by the racial transposition.  
  2. Such usage **causes social harm** by excluding or marginalizing non-male individuals, a harm made visceral through satire.  
  3. Linguistic choices reflect and reinforce **power asymmetries** (here, sexism vs. racism).  
  It **does not license you to claim**:  
  - That generic "he" is **semantically defective** (this requires linguistic evidence beyond satire).  
  - That the satire *proves* harm (it illustrates it persuasively; evidence of harm requires sociolinguistic studies).  
  Use it as a **rhetorical artifact** demonstrating how defenses of exclusionary language crumble under consistent moral scrutiny, and as evidence that "stylistic" debates are never socially neutral.  

  ---  
  **Summary for your argument**: Hofstadter’s essay is a masterclass in satirical exposure, not formal logic. Its power lies in revealing that objections to inclusive language are often rooted in unexamined bias, not reason—making it vital for analyzing the *social consequences* of linguistic conventions.
