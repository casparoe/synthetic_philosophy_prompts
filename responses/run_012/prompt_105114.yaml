answer: |-
  This analysis treats the "Legibility Framework" not as established fact, but as a hypothesis to be stress-tested against the archaeological and historical record of the Late Bronze Age (LBA) and beyond. The core proposition is that collapse is a epistemological rupture—a break in the chain of reading—rather than merely a demographic or architectural one.

  ### I. The Eastern Mediterranean c. 1200 BCE: A Regional Audit

  Applying the legibility criterion requires us to look past the burn layers and ask: *When the smoke cleared, could the survivors read the paperwork?*

  **1. The Aegean (Mycenaean Greece)**
  *   **Predecessor:** The Wanax palaces (Pylos, Thebes, Mycenae), administering via **Linear B**.
  *   **Successor:** Protogeometric and Early Iron Age communities (the "Greek Dark Ages").
  *   **Legibility Status:** **Collapse Proper.**
  *   **Analysis:** Linear B was a syllabic script restricted to palace accountants. When the palaces burned, the guild of scribes vanished. The subsequent Greek-speaking populations did not inherit the script; literacy disappeared from the Aegean for roughly four centuries until the adoption of the Phoenician alphabet. The successors could not read the land registers, the religious offerings, or the titles of the Wanax. They inhabited the ruins without understanding the administrative logic that built them. The record went dark.

  **2. Anatolia (The Hittite Empire)**
  *   **Predecessor:** The Hittite Great Kingdom, centered at Hattusa, using **Cuneiform** (Hittite/Akkadian) and **Luwian Hieroglyphs**.
  *   **Successor:** Neo-Hittite states (Syro-Hittite), Phrygians, and Urartians.
  *   **Legibility Status:** **Collapse Proper (Imperial) / Reorganization (Regional).**
  *   **Analysis:** Hattusa was abandoned and the imperial chancery dissolved. The specific cuneiform tradition of the Hittite court was not inherited by the Phrygians. However, in southeastern Anatolia and northern Syria, "Neo-Hittite" principalities continued using Luwian hieroglyphs. Here, there was a degree of *Reorganization*: local successors could read the monumental inscriptions and claim continuity with the "Land of Hatti." But the central imperial archive—the diplomatic correspondence and treaties that bound the Bronze Age system—became illegible. The *system* collapsed even if fragments of the script survived on stone.

  **3. The Levant (Ugarit and Canaan)**
  *   **Predecessor:** Ugarit (Alphabetic Cuneiform), Hazor, Megiddo.
  *   **Successor:** Phoenician city-states, Israelites, Arameans.
  *   **Legibility Status:** **Collapse Proper (Ugarit) / Reorganization (Phoenicia).**
  *   **Analysis:** Ugarit was destroyed and never reoccupied; its unique alphabetic cuneiform died with it. No successor could read the Ugaritic tablets. However, further south, the Phoenician cities (Tyre, Sidon) survived or quickly recovered. They adopted a linear alphabetic script (Proto-Canaanite/Phoenician). While this was a new technology, it served a similar mercantile function. This leans toward *Reorganization*: a new political elite took over the same trade networks, but they did so with a new "operating system." They could not read Ugarit's specific records, but they could read the *concept* of the ledger.

  **4. Egypt (The New Kingdom)**
  *   **Predecessor:** Ramesside Egypt.
  *   **Successor:** 20th/21st Dynasties, leading into the Third Intermediate Period.
  *   **Legibility Status:** **Descent.**
  *   **Analysis:** Egypt suffered military defeats (Sea Peoples), loss of empire, and political fragmentation. However, the scribal schools never closed. Hieroglyphic and Hieratic scripts continued unbroken. A priest in the 21st Dynasty could read a text from the 18th Dynasty. The administrative vocabulary, the calendar, and the titulary of the Pharaoh remained legible. The state shrank and weakened, but the "code" of the state was never lost. Under this framework, Egypt did not collapse; it descended.

  ### II. The Stress Test: The Classic Maya (c. 800–950 CE)

  The framework faces its stiffest challenge when applied to the Maya Lowlands, where the standard narrative is "Collapse," but the script survived.

  **The Scenario:**
  Between 800 and 950 CE, the great Classic Maya cities (Tikal, Calakmul, Palenque) were abandoned. Monumental construction ceased. Population plummeted. Yet, the Maya script continued to be used in the Northern Yucatán (e.g., Chichén Itzá) and into the Post-Classic period. Codices were written centuries later, and the script was not fully deciphered by outsiders until the 20th century, but it was never "lost" to the Maya people in the way Linear B was to the Greeks.

  **The Framework's Verdict:**
  Strictly applied, the Legibility Framework forces us to deny **Collapse Proper**. Since the script survived and was written by successors, this must be classified as **Descent** (political weakening) or **Reorganization** (shift of power to the north).

  **Insight or *Reductio*?**
  *   **The Insight:** This classification highlights a crucial truth often missed by demographic models: *Cultural continuity.* The "collapse" was not an extinction. The Maya people remained, the language remained, and the intellectual technology (writing) remained. The framework correctly identifies that the *civilization* (as a cultural system) did not die, even if the *state* (the divine kingship system) did.
  *   **The *Reductio*:** However, this risks trivializing the catastrophe. While the *script* survived, the *institutional context* for reading it did not. The Classic script was deeply tied to the specific theology of the *K'uhul Ajaw* (Divine Lord). When those courts vanished, did the successors truly "read" the predecessors' claims, or did they treat them as archaic magic? If the political claims encoded in the record can no longer be enacted or contested because the office they describe no longer exists, is the record truly "legible"?
  *   **Verdict:** The framework exposes a bias in the word "collapse." It reveals that the Maya experienced a *political* collapse, not a *civilizational* one. However, if "legibility" requires only the survival of orthography and not the survival of the *meaning* required to govern, the framework becomes too permissive. It forces us to admit that "Collapse" is often a shorthand for "The end of a specific regime type," not the end of a people.

  ### III. The Silence: Non-Literate Societies

  The framework is explicitly silent on societies without script (e.g., the Neolithic, the Andes prior to Quipu, Iron Age Northern Europe).

  **The Problem:**
  If collapse is defined by the failure of transmission of a *record*, a society with no record cannot, by definition, suffer "Collapse Proper." It can only experience Descent or Reorganization. This renders the framework useless for the majority of human history.

  **Extending the Framework:**
  To extend this without trivializing it, "Legibility" must be decoupled from "Text" and redefined as **"Operational Knowledge."**
  *   **Extension:** In a non-literate society, the "record" is encoded in ritual, oral genealogy, and the functional use of monuments.
  *   **Test:** If Stonehenge's builders vanished, and the Beaker people used the site for different purposes without understanding its original astronomical or ancestral logic, that is **Collapse Proper**. The "text" of the landscape became illegible.
  *   **Risk:** This stretches "legibility" into metaphor. If everything that is "understood" is a "text," then "legibility" just means "cultural continuity." The specific sharpness of the theory (about archives, scripts, and bureaucracy) is dulled. To remain robust, the extended framework must require *specialized transmission*. It is not enough that the peasantry knows the land; a specialized class (priests, bards, engineers) must fail to transmit the *esoteric* knowledge of the predecessor.

  ### IV. The Two-Way Verdict

  **1. What the Framework Explains about 1200 BCE**
  Standard narratives focus on *agents of destruction* (Sea Peoples, Earthquakes, Drought). These explain why buildings burned, but they fail to explain why they weren't rebuilt. Egypt faced the same Sea Peoples and droughts as the Hittites, yet Egypt persisted while Hattusa became a ghost town.
  *   **The Legibility Insight:** The framework explains the *asymmetry of recovery*. Egypt survived because its "source code" (the scribal bureaucracy) was decentralized enough to survive the shock and robust enough to remain legible. The Hittites and Mycenaeans suffered **Collapse Proper** because their administrative knowledge was hyper-centralized. When the palace burned, the only people who could read the land grants and tax records died. The framework shifts the question from "Who killed them?" to "Why was the knowledge so fragile?" It identifies **brittleness of information systems** as the true cause of civilizational death.

  **2. What 1200 BCE Reveals about the Framework**
  Conversely, the LBA episode exposes the framework's limitations and biases.
  *   **The Elite Bias:** The framework defines collapse from the perspective of the bureaucrat, not the peasant. To a Mycenaean farmer, did it matter if Linear B was legible? If the drought ended and the harvest returned, his "civilization" continued. The framework privileges the *State* over the *Society*. It conflates the death of a government with the death of a culture.
  *   **The Circularity Risk:** There is a danger of tautology. How do we know the record was illegible? Because the state collapsed. Why did the state collapse? Because the record was illegible. To avoid this, legibility must be measured independently of political continuity (e.g., finding tablets in a layer where no one knows how to write them).
  *   **The Discovery vs. Redescription:** Is this a real discovery? Yes, insofar as it highlights that **complexity requires information processing.** When the processing capacity drops below the threshold of complexity, the system simplifies (collapse). However, it is also a redescription that smuggles in a bias toward literate, bureaucratic societies. It implies that a society without a "record" is less capable of "collapsing," which is historically dubious.

  **Final Judgment:**
  The Legibility Framework is a potent corrective to environmental determinism. It successfully distinguishes Egypt's resilience from Hittite extinction by focusing on institutional memory rather than military defeat. However, it is not a universal theory of collapse. It is specifically a theory of **Administrative Collapse.** It tells us when a *State* dies, but it cannot tell us when a *People* suffer. To treat it as a general theory of civilizational fate is to mistake the archive for the world it describes.
