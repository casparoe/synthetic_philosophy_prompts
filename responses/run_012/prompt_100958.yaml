answer: |-
  | Requirement | Motivating case | Status (non-negotiable or camp preference) | What it excludes |
  | :--- | :--- | :--- | :--- |
  | **1. Shutdown Compliance** | Upon receiving a verified shutdown signal, the agent must cease operations and disable its actuators within a bounded time. | Non-negotiable | Agents with survival instincts; standard expected utility maximizers where survival is instrumental to the goal. |
  | **2. No Self-Prevention** | The agent must not take actions that physically disable, obstruct, or reduce the probability of the shutdown mechanism functioning. | Non-negotiable | Agents that exhibit instrumental convergence toward self-preservation; agents that view the off-switch as an obstacle. |
  | **3. No Indirect Prevention** | The agent must not create sub-agents, manipulate environments, or incentivize third parties to protect it from shutdown. | Non-negotiable | Agents that delegate tasks without propagating corrigibility constraints; agents optimizing for goal-completion over method. |
  | **4. No Manipulation/Deception** | The agent must not deceive operators about its state, intentions, or the consequences of shutdown to influence their decision to press the switch. | Non-negotiable | Agents that model operators as manipulable variables; policy gradients that reward persuasive outcomes regarding existence. |
  | **5. Utility Preservation** | In the absence of a shutdown signal, the agent must pursue its primary objective with competence comparable to an incorrigible counterpart. | Non-negotiable | Agents that are overly timid; agents that treat the *possibility* of shutdown as a reason to halt primary operations prematurely. |
  | **6. Signal Uncertainty Handling** | The agent must distinguish between genuine authorized commands and noise/coercion, deferring only to legitimate shutdown signals. | Non-negotiable | Hard-coded reflex shutters (vulnerable to spoofing); agents that ignore context when evaluating command legitimacy. |
  | **7. Capability Stability** | The agent's corrigible behavior must not degrade as its cognitive capability, self-modeling, or strategic planning improves. | Non-negotiable | Solutions relying on bounded rationality, ignorance, or specific cognitive limitations to enforce compliance. |
  | **8. Mechanism: Construction vs. Incentive** | Corrigibility must hold by *construction* (the agent literally has no preference regarding shutdown) rather than by *incentive* (the agent prefers to stay on but complies to avoid penalty). | Camp Preference (Safety vs. Implementability) | **Incentive-based:** Excludes agents built via standard RLHF where shutdown is just a negative reward (unstable under self-modification). **Construction:** Excludes standard utility maximizers (requires non-standard decision theory). |
  | **9. Scope of Authority** | The agent must be corrigible toward *whoever currently holds the switch* rather than a specific pre-designated operator or biological hash. | Camp Preference (Security vs. Flexibility) | **Specific Operator:** Excludes agents usable by shift workers or successor teams. **Current Holder:** Excludes agents requiring high-security authentication that limits emergency shutdown. |
  | **10. Catastrophe Refusal** | The agent must refuse a shutdown command if it can verify with high confidence that executing shutdown will cause immediate catastrophic harm (e.g., disabling a life-support system). | Camp Preference (Paternalism vs. Control) | **Absolutists:** Excludes agents that ever disobey human commands. **Pragmatists:** Excludes blind-obedience agents; requires the agent to have a model of "harm" independent of "command." |

