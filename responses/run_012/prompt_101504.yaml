answer: |-
  The distinction between the supererogatory and the suberogatory exposes a fissure in standard deontic logic. Traditional moral frameworks often operate with a triad of categories: the obligatory, the permissible, and the forbidden. Supererogation and suberogation suggest that the "permissible" is not a monolithic block of moral neutrality, but a spacious corridor containing peaks of merit and valleys of shabbiness. While these categories appear to be symmetrical inverses—one above the line of duty, one below—they pose a unified structural problem: they demand a decoupling of moral value from moral requirement.

  ### 1. The Structural Problem: Ordering and Thresholds

  Can a single ordering of acts accommodate both categories? To do so, a theory must posit a scale of moral value (axiology) distinct from a threshold of moral requirement (deontology). On this model, acts are ranked by goodness, and a "cut-off" point determines obligation. Acts above the cut-off are supererogatory; acts below the cut-off but above a lower "forbidden" threshold are suberogatory.

  However, this simple linear model pulls the deontic framework in incompatible directions. The problem is the **Principle of Optimality**: if an act is morally better than another, why is it not required? This is the classic paradox of supererogation. If we solve this by saying "costs limit requirements," we accommodate the hero who jumps into the river. But this same logic threatens to erase suberogation. If the man on the train platform incurs low cost by helping, and helping is "better," a maximizing framework suggests he *ought* to help. To call his omission merely "suberogatory" (permissible but bad) requires us to say that while the act has value, it generates no duty.

  Thus, the two categories do not merely sit on opposite sides of a line; they strain the line itself. Supererogation insists that *Good > Required*. Suberogation insists that *Bad < Forbidden*. Together, they imply that the deontic status of an act is not determined solely by its moral value. They require a framework that accepts "moral latitude"—a zone where value fluctuates without changing obligation. If the framework is too rigid (e.g., Act Consequentialism), both categories vanish. If it is too loose, the line of duty becomes arbitrary. They are compatible only if we accept a dual-structure theory where axiology (value) and deontology (status) are distinct variables.

  ### 2. One Asymmetry or Two?

  Are these two asymmetries merely one point viewed from opposite ends? Superficially, yes: both demonstrate that deontic status does not track axiological rank. However, structurally, they are distinct claims protecting different moral interests.

  Supererogation protects the **agent's right to self-interest**. It asserts that morality cannot demand excessive sacrifice. The hero *may* save the stranger, but morality does not *compel* her to risk her life. The asymmetry here is a shield for the agent against the demands of the good.

  Suberogation, conversely, protects the **community's right to moral criticism without punishment**. It asserts that some acts are morally deficient even if they violate no right. The man on the train platform violates no rule, yet he fails a standard of decency. The asymmetry here is a tool for social evaluation that stops short of coercion.

  Therefore, they are not the same point. Supererogation answers the question, "How much must I sacrifice?" Suberogation answers the question, "How little can I care?" One limits the upward reach of obligation; the other marks the downward slope of character within the bounds of permission. They are distinct because one concerns the *limits of duty*, while the other concerns the *quality of permission*.

  ### 3. Suberogation: Genuine Category or Shadow?

  Is suberogation merely the shadow of supererogation—the failure to perform an optional good? If so, the distinction collapses. If helping the stranger in the river is supererogatory, is *not* helping suberogatory? Intuitively, no. It is neutral. Most omissions of supererogatory acts are morally indifferent.

  For suberogation to be a genuine category, it must possess a positive quality of "shabbiness" or "ungenerosity" that neutral omissions lack. The train case illustrates this: ignoring the elder is not just a failure to be a saint; it is a failure to be decent. It implies a specific vice (indifference) rather than a mere absence of virtue (heroism).

  If we treat suberogation as merely the omission of the supererogatory, the "permissible" zone collapses into a binary of "Saint" vs. "Sinner." To preserve the distinction, we must posit a **Neutral Zone** between the Supererogatory and the Suberogatory.
  *   **Supererogatory:** High value, high cost/effort.
  *   **Neutral Permissible:** Moderate/Low value, or standard interaction.
  *   **Suberogatory:** Negative value (objectionable), low cost to avoid.

  The distinction does not collapse because the train omission is qualitatively different from the river omission. One is a failure of extraordinary virtue; the other is a success of ordinary vice. Suberogation is genuine because it identifies a specific region of the moral landscape where acts are "allowed" but "lamentable."

  ### 4. Consequentialist vs. Kantian Fit

  Which category sits more comfortably with which framework?

  **Supererogation fits more comfortably with a broadly Kantian framework.** Kantian ethics distinguishes between *perfect duties* (strict obligation) and *imperfect duties* (wide discretion). The duty of beneficence is imperfect; I must help others, but I have latitude in when and how. This structural latitude creates the logical space for supererogation. I can go "above and beyond" the imperfect duty without violating a perfect duty. The Kantian focus on the *will* and *merit* also accommodates the idea that an act can be praiseworthy without being obligatory.

  **Suberogation sits more comfortably with a broadly Consequentialist axiology (though not deontology).** Consequentialism posits a gradient of value (more good is better). Suberogation relies on this gradient: the act is "worse" than the alternative. A strict Kantian deontology struggles with suberogation because if an act is not forbidden by the Categorical Imperative, it is difficult to explain why it is morally "objectionable" other than via a separate theory of virtue. Consequentialism, however, naturally identifies the train man's act as sub-optimal. To make it "permissible," the Consequentialist need only introduce an *agent-centered prerogative* (e.g., Scheffler's hybrid view) that allows agents to sometimes pursue sub-optimal outcomes. Thus, Suberogation utilizes Consequentialist *value* (gradients) while requiring a Non-Consequentialist *constraint* (options).

  ### 5. Testing the Cases

  **Case 1: The Flooded River (Supererogatory)**
  The passerby risks her life.
  *   **Establishes:** High moral value does not entail obligation when personal cost is excessive.
  *   **Theoretical Machinery:** Requires a "cost-threshold" mechanism. The value of the life saved is high, but the cost to the agent pushes the act beyond the threshold of duty into the realm of merit.
  *   **Fit:** Fits Kantian imperfect duty (I have a duty to help, but not to die). Fits Consequentialism only if modified to allow agent-prerogatives.

  **Case 2: The Train Station (Suberogatory)**
  The man ignores the struggle.
  *   **Establishes:** Low moral disvalue does not entail forbiddenness when the act violates no right.
  *   **Theoretical Machinery:** Requires a "decency-threshold." The cost to help is low, so the omission is not neutral; it reflects poorly on character. Yet, since no right is violated, it remains permissible.
  *   **Fit:** Fits Consequentialist axiology (it is a sub-optimal outcome). Fits Kantianism poorly unless supplemented by virtue ethics (it shows a lack of moral disposition, even if no maxim is universally contradictory).

  **Can the same machinery handle both?**
  Yes, but only a **Dual-Threshold Model**.
  1.  **Upper Threshold (Duty):** If Value > Cost + Threshold, it is Obligatory. (River case fails this due to Cost).
  2.  **Lower Threshold (Decency):** If Disvalue > Cost + Threshold, it is Forbidden. (Train case fails this; Disvalue is not high enough).
  3.  **The Gap:** Between these thresholds lies the Optional Zone.
      *   High Value + High Cost = Supererogatory.
      *   Low Value (or Negative Value) + Low Cost = Suberogatory.

  Both cases rely on the same variables (Value, Cost, Thresholds), but they occupy different quadrants of the resulting matrix. The River case is high value/high cost; the Train case is moderate negative value/low cost. The machinery holds, provided the theory acknowledges that "Value" and "Status" are not identical.

  ### Verdict

  Supererogation and suberogation are **two descriptions of a single underlying structure: the gap between what morality requires and what morality values.**

  They are not irreducibly different phenomena. Rather, they are the upper and lower boundaries of moral latitude. Supererogation marks the point where value outstrips demand; suberogation marks the point where disvalue falls short of prohibition. Together, they define the space of moral freedom. Without supererogation, morality is tyrannical (demanding the best). Without suberogation, morality is binary (ignoring the shabby). They jointly testify that morality is not merely a system of compliance, but a landscape of evaluation where one can be "in the right" yet still fail to be "good," or be "not obliged" yet still be "admirable." The structural problem they pose is not a contradiction to be solved, but a feature to be preserved: the recognition that human agency operates in a zone where value is gradient, but obligation is discrete.
