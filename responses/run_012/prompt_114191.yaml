  Third misconception: Blurring EVPI with realized gain. Address this during the calculation step. Show that EVPI is the difference between the weighted average of posterior EUs and the prior EU. It is a property of the decision structure before the signal arrives. If you wait until the Q&A to clarify this, they will view the caveats as evasions. You must embed the distinction in the derivation itself. When you calculate the value, write "Expected" explicitly on the board. If a team member argues from a specific bad outcome, point to the expectation operator. This prevents the "one bad experience" argument from undermining the general principle. The distinction must be structural, not defensive.

  What bounds the theorem
  Cost is settled: VOI must exceed cost. Non-Bayesian updating is settled: if you update irrationally, VOI can be negative. Preference shifting is settled: if learning changes your utility function (e.g., adaptation), the theorem fails. Information as payoff is settled: if knowing has intrinsic disutility (e.g., medical diagnosis anxiety), VOI can be negative. Computational limits are contested: standard theory assumes perfect optimization; bounded rationality suggests info can overwhelm processing, effectively making VOI negative. Distinguish clearly: the first four are violations of theorem assumptions; the last is a challenge to the model itself. Do not present bounded rationality as a simple exception; it requires a different framework. Be honest that while cost and updating are standard decision science, the computational bound is where current research lies. This protects your credibility if they read conflicting papers later.

  The check for understanding
  Ask: "We have a test with 99% accuracy. It costs $1 million. The project value is $100k. Is running this test rational?" If they say yes based on accuracy, they missed the point. If they say no because EVPI < Cost, they understand. This forces them to weigh informational quality against economic stakes, proving they grasp the instrumental nature of the value. It tests whether they can separate the quality of the signal from the value of the decision. A correct answer demonstrates they have internalized the cost bound and the expectation requirement.

  What to leave out
  Omit the measure-theoretic proof; it adds rigor but no intuition. Omit the history of I.J. Good; it's irrelevant to application. Omit alternative axiomatic systems (e.g., Knightian uncertainty) unless discussing bounds. State aloud: "I am leaving out the mathematical proof and the history. We are focusing on the structural conditions required for the result to hold in our work." This manages expectations and keeps focus on the decision architecture.
