  I got roped into doing a short set at this end-of-term philosophy department open mic thing (don't ask, someone dropped out and I have no spine), and I want to do a bit about the sunk cost fallacy. Problem is every sunk cost joke I can think of is the lazy version where the punchline is basically "lol humans keep watching a terrible movie just because they already bought the ticket" — which is fine but it's the joke everyone already knows, and honestly it doesn't even really engage with the theory. The people in the room will have read the stuff about how the sunk cost *effect* is a documented bias, so a generic "people are dumb" punchline is gonna get a pity laugh at best.

  What I actually find funny/interesting is that honoring sunk costs isn't obviously always irrational — like when the past spending is *observable* and functions as a costly signal or a commitment device, continuing can be the smart move even though the money's gone (a country that keeps pouring resources into a war partly so that everyone can see it will never back down, and that reputation pays off later). So I'd love a joke that sets up the standard "irrational, ignore sunk costs" framing and then flips it, where the flip actually turns on that commitment/signaling logic and not just on "well sometimes you have to finish what you start."

  Can you write me the joke? Ideally it works even if the audience already knows the bias literature, i.e. the funny part comes from the real content of the two lenses rather than being a generic nerd joke. Keep it tight enough that I can actually tell it out loud in under a minute, and if you can give me a one-liner version too that'd be great.
