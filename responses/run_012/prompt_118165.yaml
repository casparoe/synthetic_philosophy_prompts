answer: |-
  You have done something quite rare in approaching this topic, which is to recognize that the shouting matches you wish to avoid are usually caused by people answering different questions while pretending to answer the same one. Your map is largely sound, and the four questions you have identified do indeed carve the space correctly, though I would suggest one slight adjustment to the joints. You treat the grounds of the vote, the purpose of the vote, and the nature of the vote as three separate axes, but in practice, the purpose someone assigns to voting often dictates the grounds they accept. If you believe voting is about protecting interests, you naturally lean toward including everyone affected; if you believe it is about civic standing, you naturally lean toward including only members. I will keep your structure because it is analytically clearer, but I will note where these questions lock together to prevent certain combinations from existing.

  We begin with your first question, regarding the grounds of the vote, which splits the territory into two main regions: those who think the vote belongs to the subjected and those who think it belongs to the affected. The first region contains the view I will call Strict Subjecthood. This position holds that anyone bound by the coercive power of the law must have a say in its creation. This view places the sixteen-year-old worker firmly inside the electorate, because the law binds them just as it does an adult, and it also includes the prisoner serving a long sentence, since they are uniquely subject to the state's punitive power. The hardest thing for a holder of this view to explain is why breaking the law should not forfeit the right to shape it, given that the prisoner has arguably violated the very social contract that grants them protection. A variation on this is the view of Formal Citizenship, which argues that being bound is not enough; one must be a formal member of the community to vote. This excludes the long-term non-citizen resident despite their subjection to the law, and it includes the citizen who moved abroad at twenty-five despite their lack of current subjection. The hardest thing for this position to explain is why a person living in another country should decide the fate of neighbors they will never meet, while a neighbor who pays taxes and obeys laws cannot.

  Moving to the second region of your first question, we find the Stakeholder views, which argue that being affected is the true ground. The most common version is Resident Stakeholding, which grants the vote to everyone living within the territory regardless of citizenship. This includes the non-citizen resident but excludes the expat citizen and the abroad homeowner. The hardest thing for this position to explain is why physical presence matters more than legal bondage or financial contribution, especially in an era of remote work and global capital. A more expansive version is the All-Affected Principle, which argues that anyone impacted by a decision should vote on it. This is the only position that makes room for future generations and foreign firms regulated by environmental rules. However, this is where your fourth question breaks the map. This position is stuck with a genuine circularity: the current electorate must decide who is affected enough to join them, meaning people judge their own case regarding the size of their constituency. Some try to defuse this by appointing independent bodies to assess impact, but that merely shifts the circularity to who appoints the body. The hardest thing for this position to explain is how to implement a boundary that does not rely on the very people who benefit from drawing it narrowly.

  There is a third, smaller region on the grounds question that focuses specifically on contribution rather than subjection or effect, which I will call Taxation-Representation. This view holds that liability to tax is the trigger for the vote. It includes the sixteen-year-old worker and the homeowner living abroad who pays local taxes, but it excludes the non-taxpaying resident and the prisoner. The hardest thing for this position to explain is why the poor, who are still bound by the law and affected by its outcomes, should be excluded simply because they earn too little to be taxed, effectively creating a property qualification by another name.

  Now we move to your second question, regarding what the vote is for, which cuts across the previous categories. If the purpose is protecting interests, the positions above hold. But if the purpose is marking full membership, we arrive at Civic Republicanism. This view sees voting not as a tool for protection but as a ritual of belonging. It excludes the non-citizen resident even if they are bound and affected, because they lack the shared identity required to speak in the community's name. It also tends to exclude the expat citizen, as they have abandoned the daily life of the community. The hardest thing for this position to explain is why a shared identity is more important than the protection of rights, especially for minorities who may be members in name only.

  Alternatively, if the purpose of voting is simply extracting information to produce good outcomes, we arrive at Epistocracy. This position argues that the vote is a tool for gathering accurate data about what is best, and thus should be restricted to those who can demonstrate competence. This creates a position that can be combined with any of the grounds above but usually results in a tested electorate. It excludes the adult under a guardianship order for dementia, and potentially the sixteen-year-old, not because they are unbound or unaffected, but because they lack the capacity to contribute useful information. The hardest thing for this position to explain is who designs the test and how we prevent the test from being used to entrench the power of the existing elite under the guise of competence. There is an empty combination here worth noting: you cannot consistently hold that voting is purely for information aggregation while also holding that it is a fundamental human right that cannot be restricted. Those two answers to your second and third questions are incoherent together, because a right implies access regardless of utility, while epistocracy implies restriction based on utility.

  This leads us to your third question, regarding whether voting is a right, a duty, or a burden. If it is a right, we have the Liberal Voluntary position, which holds that compelling someone to vote is a violation of their liberty. This fits comfortably with the Formal Citizenship or Strict Subjecthood views but clashes with the idea of voting as a duty. The hardest thing for this position to explain is why we tolerate low turnout if we claim the legitimacy of the government depends on the consent of the governed; if consent is vital, why is withdrawing it via apathy permitted? Conversely, if voting is a duty, we arrive at Compulsory Voting. This position views abstention as a failure of civic obligation, akin to failing to pay taxes or serve on a jury. It can be layered onto most of the eligibility positions, but it creates tension with the Epistocratic view; if voting is a duty, you must force even the uninformed to vote, which undermines the epistemic goal. The hardest thing for this position to explain is whether forcing someone to mark a ballot is truly civic engagement or merely forced labour that produces random noise.

  There is a specific subset of the duty view that applies to those who cannot vote for themselves, which I will call Guardianship. This position argues that for children or adults with dementia, the vote is an interest-protecting tool that must be held in trust by a parent or guardian. This solves the inclusion of children in the Strict Subjecthood or All-Affected views without granting them direct agency. The hardest thing for this position to explain is why the trust ends abruptly at eighteen rather than tapering off as competence grows, and whether a parent can truly separate their own interests from the child's when casting the ballot.

  Finally, there are two unnamed positions that emerge from the edges of your map. The first is a combination of All-Affected grounds and Compulsory Duty. This view would argue that everyone impacted by a decision, including future generations represented by proxies, must be compelled to participate through those proxies. It is rarely held because it is administratively impossible, but it is the only position that takes the circularity problem seriously enough to try to solve it by expanding the electorate to everyone, thereby removing the exclusion problem. The hardest thing for this position to explain is how to weight the vote of a person who does not yet exist against a person who is here now. The second unnamed position is Strict Subjecthood combined with the view that voting is a burden that should be minimized. This leads to the view that only those who explicitly opt in should vote, even if they are bound by the law. It is distinct from the Liberal Right view because it sees voting as a dangerous power that should be limited, not a liberty to be expanded. The hardest thing for this position to explain is why the power to protect oneself from the state should be something one has to ask for rather than something automatically granted.

  To place your specific cases on this map: the sixteen-year-old worker is included by Strict Subjecthood, Taxation-Representation, and Guardianship, but excluded by Formal Citizenship and Epistocracy unless tested. The long-term non-citizen resident is included by Strict Subjecthood and Resident Stakeholding, but excluded by Civic Republicanism and Formal Citizenship. The expat citizen is included by Formal Citizenship, but excluded by Strict Subjecthood and Resident Stakeholding. The adult under guardianship is excluded by Epistocracy and Liberal Voluntary views that require capacity, but included by Guardianship proxies. The prisoner is included by Strict Subjecthood, but excluded by Civic Republicanism and often by Formal Citizenship laws. The abroad homeowner is included by Taxation-Representation, but excluded by Resident Stakeholding. Children are included only by Guardianship or All-Affected views, and future generations are included only by All-Affected views.

  You asked whether the circularity of who decides who is affected is genuine. It is. The positions that rely on the All-Affected principle are stuck with it unless they accept an external arbiter, which creates a new circularity about who appoints the arbiter. The positions that rely on Strict Subjecthood or Formal Citizenship escape this circularity by using existing legal definitions, but they do so at the cost of ignoring moral realities, such as the non-citizen who is bound by laws they had no say in. The positions that rely on Taxation-Representation escape circularity by using financial records, but they introduce the problem of valuing money over personhood.

  In summary, your map holds together well, but you should warn your group that most people will not have a consistent answer to all three of your questions. They will likely mix a Civic Republican view on membership with a Liberal Right view on compulsion, or an All-Affected view on grounds with a Epistocratic view on purpose. The friction in your discussion will come not from people disagreeing on the answers, but from people realizing they have answered different questions. If you can keep them focused on which question they are answering at any given moment, you will avoid the slogan-swapping you fear. The empty spaces on your map, such as Compulsory Epistocracy, are empty for a reason: they require forcing people to do something they are deemed unfit to do, which is a contradiction in terms. Use these contradictions to gently probe when a speaker seems to be occupying two incompatible positions at once.
