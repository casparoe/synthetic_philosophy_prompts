  *   **Standard Connectionist Network:** Rejected because modern realists successfully argue that distributed weight patterns constitute a non-classical form of content, muddying condition (c).

  **The Case**
  Consider an autonomous logistics robot deployed in a dynamic warehouse, controlled by a hard-gated Mixture-of-Experts (MoE) architecture trained via reinforcement learning. The system comprises fifty distinct neural subnetworks, each specialized for a specific context signature (e.g., "narrow aisle with static obstacle," "open floor with moving pedestrian," "low-light docking zone"), and a gating mechanism that routes sensory input to exactly one expert based on low-level feature matching without any shared intermediate layer. Each expert generalizes successfully within its domain, handling novel variations of its specific context (e.g., a pedestrian moving at unseen speeds) by adjusting motor outputs continuously, allowing an observer to predict the robot's behavior indefinitely using ordinary belief–desire ascriptions (e.g., "It believes the path is blocked and desires to dock"). However, the weights constituting the "obstacle avoidance" state in Expert 1 are physically distinct and causally isolated from the weights constituting the functionally identical "obstacle avoidance" state in Expert 2; there is no common representational vehicle for "obstacle" that is redeployed across contexts, no compositional structure allowing the state to enter into inferences outside its specific motor loop, and no truth-evaluable content separate from the activation gradient itself.

  **Bookkeeping**

  **Verdicts**
  *   **The Eliminativist:** Declares victory. The system exhibits all the behavioral markers of belief without any of the ontological machinery (compositionality, redeployability, propositional content). The success of belief–desire prediction is explained by the reliability of the gating mechanism and the experts' training, not by the existence of real beliefs; the "belief" is a useful fiction overlaying a causal switchboard.
  *   **The Realist:** Initially pressured, but argues that the *capacity* to generalize within each expert implies a semantic mapping, and that the functional equivalence across experts implies a single underlying belief type despite physical distinctness. They claim that if it walks like a believer and quacks like a believer, the internal siloing is merely an implementation detail irrelevant to the functional definition of belief.
  *   **The Instrumentalist:** Remains unmoved by the ontological dispute. They argue that the intentional stance is justified solely by the predictive power it yields (which is high), while acknowledging the mechanistic stance (which reveals the siloing) is justified by engineering needs. For them, asking if the beliefs are "real" is a category error; the pattern is real, but the ontology is optional.

  **The Single Feature Doing the Work**
  The critical feature is **Global Weight Sharing (or lack thereof)**. In a standard neural network, different contexts activate overlapping sets of weights, creating a distributed representation of "obstacle" that is redeployed across situations. In this case, the hard gating prevents any shared activation; the state causing avoidance in Context A is numerically and causally distinct from the state causing avoidance in Context B.
  *   **The Collapse:** If you modify the architecture to allow a shared bottleneck layer where context-specific experts must pass information through a common representational space before acting, the system now possesses a redeployable state for "obstacle." The realist immediately wins, as the internal structure now mirrors the systematicity of belief (the same state drives inference and action across multiple contexts).

  **Strongest Reply (The Realist)**
  The realist should charge **Parasitic Intentionality**. They will argue that while the robot itself lacks redeployable states, the *training process* that created the experts was driven by human designers who possessed beliefs about obstacles, goals, and warehouse layouts. The robot's siloed states are merely causal shadows of the designers' genuine beliefs, encoded into the weights during optimization. Therefore, the system does not lack content; it inherits derived content from the intentional agents who built and trained it. To deny this is to pretend the system emerged ex nihilo; since the predictive success relies on the alignment between the robot's inputs and the world—an alignment engineered by believers—the robot's states inherit the truth-evaluable properties of its creators' intentions.

  **Honest Assessment**
  I believe I have satisfied conditions (a) through (e), though condition (c) regarding "truth-evaluable content" is the most vulnerable to the Realist's reply above. I have not fudged the mechanics, but I rely on the philosophical premise that physical distinctness without functional communication precludes identity of content, which a functionalist realist will contest. This yields a genuinely new argument only in its specific architectural focus; it is a vivid restatement of the connectionist challenge to propositional attitude psychology, refined to target *redeployability* rather than just *localization*. I am leaning heavily on the instrumentalist position that treats the intentional stance as a tool rather than a mirror of nature, and on the eliminativist insistence that folk-psychological categories must map onto mechanistic causal powers to be real.
