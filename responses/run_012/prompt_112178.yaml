prompt: |-
  Next month I'm giving a seminar paper to our department's philosophy of religion group, and I need a Q&A prep sheet. Act like the philosopher I'd want in the room: someone who's done analytic philosophy of religion and criminal law theory both, and who's sat through enough of these to know which objections are real and which are just the local dialect. Think carefully, and start by brainstorming out loud about which of the objections below are genuinely distinct and which are the same objection in two costumes.

  The thesis I'm defending: Lewis's late paper on penal substitution (I never remember where it ran) shows, read charitably, that the structure of the atonement doctrine — one party absorbs suffering so that others don't have to, and we call the arrangement just — is already sitting inside ordinary secular criminal punishment. So the standard liberal move of treating penal substitution as uniquely barbaric, a father beating his son so he doesn't have to beat us, has to either condemn our prisons too or give up the slam dunk. My reconstruction of the Lewis move, which I may be mangling: (a) the attempts-versus-successes sentencing asymmetry is unjust on retributive grounds, and Lewis's fix is to make punishment itself partly a lottery, so the offender faces a chance of suffering roughly in proportion to the chance of suffering he imposed, and can't complain about the chance element because he dealt in chances himself; (b) our real practice of punishing the guilty partly for general deterrence already means the guilty suffer so the innocent needn't, which is the substitution structure; (c) so the disanalogy that matters is innocence, not substitution, and the interesting question becomes whether substitution needs an innocent substitute to be unjust, or whether guilt is doing all the work. If I've got Lewis wrong in a way that sinks the thesis, say so up front — then still write the sheet for the version I just gave, because that's what I'll be defending.

  Audience: about a dozen people. Two are analytic philosophers of religion who actually defend penal substitution on Reformed-ish grounds and know the atonement literature far better than I do. One is a hard critic who thinks the whole doctrine is a moral obscenity and will say so inside the first minute. Two are philosophers of criminal law who don't care about theology at all and will treat my whole analogy as a sloppy description of what courts actually do. A few grad students who will ask about moral luck because they always do.

  Give me the objections I'll actually get, ordered by how much damage they do, each phrased the way that person would phrase it, each with a two-minute reply and an honest note on where the reply is soft. Tell me what to concede in the first thirty seconds to buy credibility, and give me the one question I'm hoping nobody asks. No reading lists or citations, I'll add those myself — and I'm definately not going to pretend I know the secondary literature.
