answer: |-
  This is a sophisticated position, but your intuition is correct: you are helping yourself to something. Specifically, you are trying to combine a **decision procedure** that requires a common currency (Expected Value) with a **meta-ethical claim** that denies a common currency exists (No Intertheoretic Comparability), while simultaneously holding a **substantive moral claim** (Objective Partiality) that your uncertainty procedure might override.

  Here is the ranking of the tensions from fatal to manageable, along with the cheapest fixes and their costs.

  ### 1. The Fatal Tension: (2) vs. (3)
  **The Conflict:** You cannot consistently hold (2) and (3).
  *   **(2)** says: Maximize *Expected Moral Value* (MEMV).
  *   **(3)** says: There is no fact about how Value-A compares to Value-B (No Intertheoretic Comparability/ITC).

  Standard expected value calculation is $ \sum (Credence_i \times Value_i) $. This mathematically requires that $Value_i$ and $Value_j$ are expressed in the same units (or can be normalized to a common scale). If there is "no deep fact" about whether one util of Utilitarianism equals one unit of Virtue Ethics, you literally cannot calculate the expectation. You cannot maximize a sum if the terms of the sum are incommensurable.

  The "bargaining picture" you describe in (3) is a *rival* to MEMV, not a version of it. It is usually proposed *because* MEMV fails without ITC. By saying you "maximize expected value" but then using "bargaining," you are using the label of one theory to smuggle in the mechanics of another.

  *   **Cheapest Fix:** Rewrite (2). Do not say "maximize expected moral value." Say: **"Act according to the rational norm for moral uncertainty, which (given the lack of ITC) takes the form of a bargaining procedure."**
  *   **Cost:** You lose the formal elegance and standard decision-theoretic grounding of Expected Utility Theory. You have to defend "bargaining" as a rational requirement from scratch, rather than deriving it from standard axioms of rationality.

  ### 2. The High-Stakes Tension: (5) vs. (3)
  **The Conflict:** The "False Theory Veto" problem.
  *   **(5)** says: Partiality is *objectively right*. This implies the Impartial Theory (e.g., strict Utilitarianism) is *objectively false*.
  *   **(3)** says: The Impartial Theory gets a seat at the table and can **veto** outcomes catastrophic by its lights.

  If the Impartial Theory is false, why does it get to dictate your action? In a bargaining model, if the Utilitarian theory says "Saving your child is murder (catastrophic)" and exercises a veto, you are forced to save the five strangers. But if (5) is true, saving the five strangers is *not* the right thing to do.

  By giving false theories veto power, you are effectively conceding that moral truth is settled by the *agreement between theories*, not by the mind-independent fact you claim to believe in (1). This turns your Realism (1) into a sort of Constructivism at the meta-normative level.

  *   **Cheapest Fix:** Restrict the veto. Specify that theories only get a veto on issues that are **internal catastrophes**, but define "catastrophe" such that standard partial acts (saving a child) do not count as catastrophes for impartial theories (e.g., Utilitarianism views saving a child as *suboptimal*, not necessarily *catastrophic* in a veto-worthy sense compared to mass death).
  *   **Cost:** You have to walk a tightrope. If you make the threshold for "veto" too high, the bargaining model does no work. If you make it too low, it overrides your realist convictions (5). You also risk ad-hocery: "The veto applies except when it contradicts my strong moral intuitions."

  ### 3. The Technical Tension: (2) vs. (4)
  **The Conflict:** Fanaticism.
  *   **(2)** (MEMV) is the engine of fanaticism. If you maximize expectation, infinite value $\times$ tiny probability $=$ infinity.
  *   **(4)** says: Reject this result.

  You cannot keep standard MEMV and reject fanaticism. One of them has to go. Since you want to reject fanaticism, standard MEMV must be modified.

  *   **Cheapest Fix:** Adopt **Risk-Weighted Expected Value** or **Truncation**. You keep the "expectation" language but modify the utility function to discount low-probability/high-stakes outcomes.
  *   **Cost:** You violate the standard Independence Axiom of decision theory. This makes you vulnerable to money-pump arguments (diachronic inconsistency) unless you carefully frame it as a meta-normative rule rather than a first-order preference.

  ### 4. The Apparent Tension: (1) vs. (3)
  **The Conflict:** Realism vs. Comparability.
  *   **(1)** says: Moral facts are mind-independent.
  *   **(3)** says: Value magnitudes across theories aren't comparable.

  Some philosophers argue that if moral facts are real, their magnitudes must be comparable. However, this is not strictly true. You can be a realist about *ordering* (Theory A is true) without being a realist about *cardinality across frameworks*.

  *   **Verdict:** This is **not a real tension**. You can be a realist about truth-conditions while maintaining that "value units" are theoretical constructs that don't map across paradigms. Keep this as is.

  ---

  ### The Single Change That Cleans Up the Most

  **Drop the phrase "Maximize Expected Moral Value" from claim (2).**

  This is the linchpin. Currently, (2) is doing too much work. It is signaling to the audience that you are using a standard decision-theoretic framework (which triggers the Fanaticism objection and the ITC requirement), while your actual mechanism (Bargaining) operates on different logic.

  **Replace (2) with:**
  > "(2) Since I'm unsure which theory is true, I think the thing to do is follow the **metanormative principle most robust to uncertainty**. Given the lack of intertheoretic comparability, this principle resembles a bargaining procedure rather than simple summation."

  **Why this fixes the cluster:**
  1.  **Resolves (2) vs (3):** It aligns your decision rule with your metaphysical claim about value. You aren't trying to calculate an expectation you admit is impossible.
  2.  **Mitigates (2) vs (4):** Bargaining models naturally handle fanaticism better than MEMV (a theory won't risk a guaranteed catastrophe for a tiny chance at infinity). You no longer need to "patch" expected value to stop fanaticism; the bargaining structure does it for you.
  3.  **Helps (5) vs (3):** It frames the bargaining not as "maximizing value" (which implies the false theories have *value*), but as "managing uncertainty" (which acknowledges the false theories have *credence*). This makes it easier to argue that the veto shouldn't override objective partiality, because the goal is rational uncertainty management, not truth-tracking via compromise.

  **What you give up:**
  You give up the simplicity of Expected Utility Theory. You can no longer say "I'm just being rational in the standard economic sense." You have to argue that *rationality under moral uncertainty* requires a non-standard decision rule. This is a defensible position (championed by people like Tedlock or MacAskill in some contexts), but it requires more argumentation than simply invoking "expected value."

  ### Summary Recommendation for the Workshop
  1.  **Kill Claim (2) as written.** It contradicts (3). Replace it with the "Metanormative Principle" language above.
  2.  **Clarify Claim (3).** Explicitly state that the "veto" is limited to *existential* or *severe* catastrophes to protect Claim (5) (saving the child).
  3.  **Keep (1), (4), and (5).** They are compatible with the revised (2) and (3).

  If you make that one change to (2), the rest of the position snaps into a much more coherent shape.
