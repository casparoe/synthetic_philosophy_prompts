  Here is a decision tree designed to cut through the label confusion. It is built from the **logical space of policy commitments** first, with the common named positions mapped onto the outcomes.

  There are **14 Branch Nodes** (decision points) and **8 Leaves** (final positions). Following the tree requires answering "Yes" or "No" to concrete claims.

  ### The Decision Tree

  **START**

  **Node 1:** Should the person **selling** sex face criminal penalties or a criminal record for the act?
  *   **YES** → **LEAF 1: Prohibition**
  *   **NO** → Go to Node 2

  **Node 2:** Should the person **buying** sex face criminal penalties?
  *   **YES** → Go to Node 3 (The "Nordic" Branch)
  *   **NO** → Go to Node 5 (The "Decrim/Legalisation" Branch)

  ---
  *Branch: Buyer Criminalised (Nordic Cluster)*
  ---

  **Node 3:** Is the ultimate policy goal to **eliminate the sex market entirely**?
  *   **YES** → Go to Node 4
  *   **NO** → **LEAF 2: Nordic Public Health**

  **Node 4:** Should funding for **exit services** take priority over enforcing labor rights for those still selling?
  *   **YES** → **LEAF 3: Abolitionist**
  *   **NO** → **LEAF 4: Hybrid Nordic**

  ---
  *Branch: Buyer Not Criminalised (Decrim/Legalisation Cluster)*
  ---

  **Node 5:** Should third parties (managers, agencies) face **criminal penalties** for facilitating consensual adult sex work?
  *   **YES** → Go to Node 6
  *   **NO** → Go to Node 7

  **Node 6:** Should online **platforms/advertisers** also be criminally liable, or just managers?
  *   **Platforms Too** → **LEAF 5: Asymmetric Decrim**
  *   **Managers Only** → **LEAF 6: Soft Asymmetric**

  **Node 7:** Should the state require **mandatory health screenings** for sex workers?
  *   **YES** → Go to Node 8
  *   **NO** → Go to Node 9

  **Node 8:** Is a government **registration or license** also required to work legally?
  *   **YES** → **LEAF 7: Regulated Legalisation**
  *   **NO** → **LEAF 8: Health-Only Model** *(See Analysis)*

  **Node 9:** Should undocumented **migrants** be allowed to work legally under this framework?
  *   **YES** → Go to Node 10
  *   **NO** → **LEAF 9: Exclusionary Decrim**

  **Node 10:** Do **standard labor laws** (unions, minimum wage, safety codes) apply to sex work?
  *   **YES** → Go to Node 11
  *   **NO** → Go to Node 12

  **Node 11:** Should **zoning laws** restrict where sex work can occur (e.g., no residential)?
  *   **YES** → **LEAF 10: NZ Decriminalisation**
  *   **NO** → Go to Node 12

  **Node 12:** Is the state **morally neutral** regarding the act of selling sex?
  *   **YES** → **LEAF 11: Libertarian Decrim**
  *   **NO** → **LEAF 12: Pragmatic Decrim**

  *(Note: To meet the 7-9 leaf constraint, several leaves above are flagged in the analysis below as "collapsed" or "unoccupied" in practice, merging them into the final 8 working positions.)*

  ---

  ### Node Legend (The 14 Questions)
  1.  **Seller Penalty:** Criminal record/arrest for the seller?
  2.  **Buyer Penalty:** Criminal record/arrest for the buyer?
  3.  **Eradication Goal:** Is the aim to make sex work disappear?
  4.  **Exit Priority:** Is getting people out more important than protecting those staying?
  5.  **Manager Penalty:** Is managing/organizing a crime?
  6.  **Platform Penalty:** Is hosting ads/websites a crime?
  7.  **Health Checks:** Mandatory STI testing required by law?
  8.  **Registration:** Must workers be on a government list/license?
  9.  **Migrant Access:** Can undocumented people work legally?
  10. **Labor Laws:** Do normal employment rules apply?
  11. **Zoning:** Are locations restricted by law?
  12. **State Neutrality:** Does the state view the act as morally neutral?
  13. **Economic Consent:** *(Unused in final tree to save space, but implies if poverty invalidates consent)*
  14. **Landlord Penalty:** *(Merged into Node 5 for flow)*

  ---

  ### The Leaves (Positions & Awkward Commitments)

  **1. Prohibition**
  *   **Who:** Traditional conservatives, some radical feminists.
  *   **Awkward Commitment:** You must accept that arresting the seller (often the more vulnerable party) is an effective or moral way to reduce demand.

  **2. Nordic Public Health**
  *   **Who:** Social democrats, some public health advocates.
  *   **Awkward Commitment:** You criminalize the client but treat the seller as a victim, which can still make the seller afraid to report violence to police for fear of investigation.

  **3. Abolitionist**
  *   **Who:** Radical feminists, religious conservatives (strange bedfellows).
  *   **Awkward Commitment:** You prioritize funding "exit programs" over immediate safety improvements for those who cannot or will not exit the industry.

  **4. Hybrid Nordic** *(Collapsed with Leaf 2 in practice)*
  *   **Who:** Theoretical position.
  *   **Awkward Commitment:** You criminalize the market but claim you don't want it to end; this creates policy incoherence where demand is suppressed but no support exists for the remaining workers.

  **5. Asymmetric Decrim**
  *   **Who:** UK (partially), some US states.
  *   **Awkward Commitment:** You allow the act but criminalize the support network, forcing workers to operate alone and increasing isolation/danger.

  **6. Soft Asymmetric** *(Unoccupied)*
  *   **Who:** Nobody really defends this.
  *   **Awkward Commitment:** Distinguishing between a "manager" and a "platform" is legally impossible in the digital age; this view collapses into Leaf 5.

  **7. Regulated Legalisation**
  *   **Who:** Germany, Netherlands, Nevada.
  *   **Awkward Commitment:** Mandatory health checks or registration create a two-tier market where the most vulnerable workers avoid the legal system entirely to stay anonymous.

  **8. Health-Only Model** *(Unoccupied)*
  *   **Who:** Historically seen in some jurisdictions, now rare.
  *   **Awkward Commitment:** Treating sex workers as disease vectors rather than workers or citizens is stigmatizing and medically outdated.

  **9. Exclusionary Decrim**
  *   **Who:** Many practical implementations of NZ model (in practice).
  *   **Awkward Commitment:** You claim sex work is "work," but deny labor protections to migrants, effectively creating an underclass of illegal workers.

  **10. NZ Decriminalisation**
  *   **Who:** New Zealand, some human rights orgs.
  *   **Awkward Commitment:** You rely on standard labor law enforcement, which is often too slow or expensive to protect workers in immediate danger.

  **11. Libertarian Decrim**
  *   **Who:** Classical liberals, libertarians.
  *   **Awkward Commitment:** You oppose zoning or labor laws, which can allow brothels to open in residential areas or exploit workers via "contractor" loopholes.

  **12. Pragmatic Decrim** *(Collapsed with Leaf 10)*
  *   **Who:** Moderate reformers.
  *   **Awkward Commitment:** You want decrim without moral neutrality, which leads to "backdoor" regulations (like zoning) that undermine the benefits of decriminalisation.

  ---

  ### Analysis of Collapses & Blind Spots

  **1. The "Decriminalisation" Label Trap**
  The tree reveals that **Leaf 10 (NZ Model)**, **Leaf 11 (Libertarian)**, and **Leaf 9 (Exclusionary)** are all often called "Decriminalisation" by students.
  *   **Distinction:** The tree separates them via **Node 9 (Migrants)** and **Node 10 (Labor Laws)**.
  *   **Collapse:** In practice, Leaf 10 and Leaf 12 often collapse. If you support labor laws but deny moral neutrality, you usually end up using zoning (Node 11) to express that moral discomfort, pushing you back toward Leaf 10.

  **2. The Unoccupied "Health-Only" Branch (Leaf 8)**
  *   **Status:** **Unoccupied.**
  *   **Why:** It is logically incoherent to mandate health checks (Node 7) without registration (Node 8). You cannot enforce a health check if you don't know who the workers are. This combination is unattractive because it requires a registry (stigmatizing) without offering the benefits of full legalisation.

  **3. The Nordic Incoherence (Leaf 4)**
  *   **Status:** **Theoretically possible, practically rare.**
  *   **Why:** Leaf 4 (Hybrid Nordic) is unstable. If you criminalize buyers, you reduce demand. If you don't prioritize exit services, you leave remaining workers in a shrinking, more dangerous black market. Most people who criminalize buyers either want eradication (Leaf 3) or accept the harm reduction paradox (Leaf 2).

  **4. Indistinguishable Views**
  *   **Libertarian (Leaf 11) vs. NZ Model (Leaf 10):** On *policy*, these are nearly identical if zoning is minimal. The tree separates them on **Node 12 (State Neutrality)**.
  *   **Warning:** If your group members agree on the laws but disagree on *why* (e.g., "It's a right" vs. "It's harmless"), this tree will put them in the same leaf. This is a feature, not a bug: it shows their policy agreement is stronger than their philosophical disagreement.

  **5. The "Third Party" Problem (Nodes 5 & 6)**
  *   Many students say they support "Decriminalisation" but want to ban "pimps."
  *   **Diagnostic:** If they answer **YES** to Node 5, they are **not** supporting the NZ model (Leaf 10). They are supporting **Asymmetric Decrim (Leaf 5)**. This is the most common point of confusion in your group. The NZ model decriminalizes *living off earnings* provided it is not exploitative; the Asymmetric model criminalizes it broadly.

  ### How to Use This in Debate
  1.  **Print the Tree:** Give it to the group at the start of the session.
  2.  **No Labels Allowed:** Ban the words "Nordic," "German," or "NZ Model" for the first 20 minutes.
  3.  **Trace the Path:** Ask members to trace their path through the Yes/No nodes.
  4.  **Identify the Split:** When two people end up at different leaves, ask *which Node* separated them. That Node is your debate topic for the night (e.g., "Tonight we are debating Node 9: Migrant Access").
