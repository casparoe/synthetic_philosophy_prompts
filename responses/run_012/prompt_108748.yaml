answer: |-
  **The Scenario**

  Elena joins a Saturday morning hiking group where, at the trailhead, a man in a red jacket shakes her hand and says, "I'm Gus." Over several months, she learns Gus dislikes energy bars, prefers steep inclines, and owns a dog named Buster, but she never sees him outside the trail or learns his surname. Weeks later, she joins a Tuesday night chess club where a man in a blue sweater sits opposite her, extends a hand, and says, "I'm Augustine." She learns Augustine plays the Sicilian Defense, drinks Earl Grey, and works nights, but she never sees him outside the club or learns his surname. Elena forms no descriptive bridge between the two (she doesn't know where either lives, their ages, or their professions outside the vague "works nights" comment which she doesn't link to Gus). She never suspects they are the same person until a mutual friend casually mentions, "Gus is actually Augustine," which lands as genuine, non-trivial news.

  ***

  **The Analysis**

  **(1) Millian / Direct-Reference**
  *   **(a) Referent:** Both "Gus" and "Augustine" refer to the same individual (the man).
  *   **(b) Proposition Expressed:** The statement "Gus = Augustine" expresses the exact same proposition as "Gus = Gus": a singular proposition consisting of the object and the identity relation < *x*, Identity, *x* >. Since the names contribute only their referents, and the referents are identical, the proposition is a trivial self-identity.

  **(2) Fregean / Sense-Theory**
  *   **(a) Referent:** Both names refer to the same individual (the man).
  *   **(b) Proposition Expressed:** The names express different *Sinn* (senses) or modes of presentation. "Gus" presents the man under a hiking-context mode; "Augustine" presents him under a chess-context mode. The proposition is an identity between these two distinct senses < *Sense-Gus*, Identity, *Sense-Augustine* >, which is cognitively distinct from a self-identity.

  **(3) Descriptivist / Mediated-Reference**
  *   **(a) Referent:** Both names refer to the same individual, determined by whichever object satisfies the associated descriptive clusters (e.g., "the man I met hiking" vs. "the man I met playing chess").
  *   **(b) Proposition Expressed:** The statement expresses an identity between two descriptive contents < *The F*, Identity, *The G* >. This is non-trivial because the descriptions differ, even if they pick out the same object.

  **Agreements and Splits**
  All three theories agree on the **referent**: in this realistic setting, "Gus" and "Augustine" pick out the same flesh-and-blood man. The split occurs entirely on **what is said** (the proposition). The Fregean and Descriptivist agree that the proposition expressed by "Gus = Augustine" is non-trivial and distinct from "Gus = Gus," though they disagree on *why* (Senses vs. Descriptions). The Millian stands alone, agreeing on the referent but insisting the proposition is trivial and identical to "Gus = Gus."

  **Evaluation of Informativeness**
  The **Fregean** theory best accounts for the discovery being informative. It posits that cognitive significance is determined by sense, not reference. Since Elena grasps two different senses, learning they co-refer adds new information (that these two modes of presentation latch onto one object). The Millian theory does not explain the informativeness; it **explains it away**. It must argue that while the *proposition* is trivial, the *sentence* conveys pragmatic information about how the subject represents the object. The Descriptivist also explains the informativeness, but only by insisting Elena's names *are* descriptions, contrary to the setup.

  **The Critical Feature**
  The feature doing the real work is **direct introduction without descriptive backing**. The case stipulates Elena learns the names ostensively ("I'm Gus") without forming a unique definite description that fixes the reference. If you remove this feature—for example, if Elena had thought of him as "the trail leader" and "the chess opponent"—the case collapses into a boring descriptivist one. The Descriptivist could then easily say the names abbreviate those descriptions. By enforcing direct introduction, the case starves the Descriptivist of content and forces the Millian to confront the cognitive difference directly.

  **The Worst Theory and Its Comeback**
  **Millianism** fares worst on this case. It is forced to admit that "Gus = Augustine" expresses a trivial proposition known *a priori* (object identity), contradicting the intuition that Elena's discovery is *a posteriori* and substantial.

  **The Strongest Comeback:**
  A sophisticated Millian (e.g., Nathan Salmon or Scott Soames) would argue I have rigged the setup by conflating **semantics** with **psychology**. They would claim: "You've smuggled the *way* Elena believes the proposition into the *content* of the proposition. The proposition itself *is* trivial (<*x*=*x*>), but Elena grasps it under different 'guises' or cognitive files. The informativeness isn't in the truth conditions (which are trivial); it's in the pragmatic update of her belief system. You haven't proven the proposition is non-trivial; you've only proven that believing < *x*=*x* > can be hard work if you don't realize the two names map to *x*."
