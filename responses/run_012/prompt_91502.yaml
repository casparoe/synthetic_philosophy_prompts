answer: |-
  Here is a structure for the opening week of your seminar. It treats the Kafka/Brod case not as a biographical anecdote but as a structural limit-case for the three dominant hermeneutic models.

  ### I. The Setup: The Limit-Case
  Begin by establishing that Kafka is not just an author here, but a boundary condition. Usually, interpretation assumes a stable object (the published book) and a stable origin (the author). Kafka/Brod destabilizes both.
  *   **The Object:** Unfinished fragments, edited by a non-author, published against instructions.
  *   **The Origin:** An instruction to negate the origin.

  Tell the students: *We are not asking if Brod was a good friend. We are asking if "The Trial" is the same text if it exists against the will of its generator.*

  ### II. Running the Three Positions

  **1. Actual Intentionalism (e.g., E.D. Hirsch, early analytic aesthetics)**
  *   **Commitment:** Meaning is identical to the author's volitional type. To interpret is to reconstruct the will.
  *   **Verdict on Kafka:** The published novels are hermeneutic ghosts. Since Kafka's will was "non-existence," the existing texts have no legitimate semantic authority. They are violations, not works.
  *   **The Commitment Cost:** This position must treat the published novels as fundamentally *misleading*. Any meaning we find is accidental, not authored. To read *The Trial* as a coherent work is to lie about its ontology.
  *   **Weakness:** It renders 90% of the 20th-century literary canon (posthumous works, fragments) semantically void.

  **2. Hypothetical Intentionalism / Informed Reader (e.g., Jerrold Levinson, Stanley Fish)**
  *   **Commitment:** Meaning is what an ideal, contemporaneous audience would have taken the text to mean, assuming the author's public context.
  *   **Verdict on Kafka:** Brod's disobedience is historically significant but semantically irrelevant. The text means what a 1920s Prague German-speaking reader would have made of the manuscript *as it stands*.
  *   **The Commitment Cost:** This position must bracket the burning instruction as "private data." Unless the instruction was public *at the time of writing*, it doesn't enter the "informed reader's" context.
  *   **Weakness:** It creates a fiction of a reader who doesn't know the text was saved from the fire. But *we* know. Can we actually bracket that knowledge? If the "Kafkaesque" relies on the sense of unfinished dread, and that dread is amplified by knowing it was almost burned, the "informed reader" cannot ignore the history of transmission.

  **3. Anti-Intentionalism / Textual Autonomy (e.g., Wimsatt & Beardsley, Barthes)**
  *   **Commitment:** The Intentional Fallacy. The text is a public linguistic event. The author's psyche (and will) is inaccessible and irrelevant once the text enters the public sphere.
  *   **Verdict on Kafka:** The note to Brod is biographical trivia. The text is what it is. Brod's act of publication is the act that created the "public sphere" for the text; therefore, Brod is functionally part of the author-function.
  *   **The Commitment Cost:** It must ignore the material difference between a finished manuscript and an edited fragment. It treats the text as a self-sufficient linguistic structure, regardless of its physical incompleteness.
  *   **Weakness:** It cannot account for why *The Trial* feels different from a finished novel. It treats "unfinished" as a stylistic choice rather than a material condition.

  ### III. The Twist: The Instruction as Text
  This is the pivot for your seminar discussion.

  The Intentionalist wants to use the note ("Burn everything") to fix the meaning of the novels (i.e., "They should not mean"). But the note is itself a text.
  *   **The Regress:** To know Kafka's intention regarding the novels, we must interpret the note. Is the note a settled judgment? A depressive episode? A test of Brod's loyalty? A performative gesture of self-loathing common to modernists?
  *   **The Trap:** If you have to *interpret* the note to find the *intention*, you are no longer accessing intention directly; you are engaging in textual hermeneutics. You are using one text to fix the meaning of another text.
  *   **Does this kill Intentionalism?** No, but it demotes it. It shows that intentionalism is not a way to *escape* interpretation, but a specific *mode* of it. The intentionalist never promised certainty; they promised the best *hypothesis* about the will. But this admits that the "will" is just another text to be deciphered. The regress doesn't bottom out; it just moves the hermeneutic circle from the novel to the note.

  ### IV. The Ontological Hunch: Access vs. Meaning
  Your hunch is correct, and it is the most productive avenue for the seminar. The standard debate fudges this because it assumes the "text" is a stable container.

  **Did Brod's disobedience change what the works mean?**
  *   **Standard View:** No. It changed *access* (we can read them) but not *meaning* (what the words signify).
  *   **The Materialist Critique:** Yes. It changed the *object*.
      *   A novel finished by Kafka is Object A.
      *   A novel finished by Brod (who added chapters, smoothed transitions, ignored some instructions) is Object B.
      *   A novel known to be "saved from the fire" is Object C (a relic/testament).
  *   **The Consequence:** We are reading Object B/C. The "meaning" of *The Trial* is inextricably bound to its fragmentary nature. If Kafka had finished it, the ambiguity might have resolved. Therefore, the *lack* of resolution (a key semantic feature) is a product of Brod's intervention (or lack thereof).
  *   **Verdict:** You cannot separate the history of transmission from the semantics of the text. The "meaning" includes the fact of its survival against odds. The "Kafkaesque" is partly a product of the archive's fragility.

  **This breaks the Author/Text binary.**
  If the text's meaning depends on its material survival, and that survival was an act of betrayal, then the "Text" is a collaboration between Kafka (writer) and Brod (preserver/editor) and the Community (readers who accept the breach). The "Author" is no longer the sole source of meaning, but the "Text" is no longer autonomous. It is a *palimpsest of transmission*.

  ### V. The Ethics/Semantics Split
  You asked whether the separation between "Did Brod do right?" (Ethics) and "What does the text mean?" (Semantics) can be held.

  *   **At the Start:** Yes, heuristically. We can say, "Assume the text is legitimate for the sake of argument." This allows the seminar to function without devolving into a moral tribunal on Brod.
  *   **Under Pressure:** No, it collapses.
      *   **Why?** Because *authority* is a hybrid category. We grant a text semantic weight because we believe it has *authority*. Authority is derived from the author's sanction.
      *   If Brod violated Kafka's sanction, the text's authority is compromised.
      *   If the authority is compromised, do we read it as "Law" (Kafka's word) or as "Testimony" (Brod's curation)?
      *   **The Work the Separation Does:** It allows us to pretend we are reading "Literature" (universal) rather than "Archives" (particular). Collapsing the split forces us to admit that reading Kafka is an act of *complicity* in Brod's betrayal. We are benefiting from the broken promise.
      *   **Seminar Point:** If we acknowledge the betrayal, does the text mean *more* (it's a miracle) or *less* (it's a forgery)? This is where ethics bleeds into semantics.

  ### VI. Suggested Seminar Trajectory
  1.  **Day 1:** Present the facts. Run the Three Positions. Let them fight over the note.
  2.  **Day 2:** Introduce the Ontological Hunch. Bring in bibliographic materialism (McGann/McKenzie) without naming it yet. Ask: "Is *The Trial* a book or a file?"
  3.  **Day 3:** Collapse the Ethics/Semantics split. Ask: "If we return the texts to the fire (conceptually), what disappears? The words? Or the *authority* of the words?"

  ### VII. Where the Positions Go Silent
  Be explicit about where the standard theories fail, so students don't try to patch them.
  *   **Actual Intentionalism:** Has nothing to say about *unfinished* works. It assumes a completed volition. If the author died before willing the work to be public, the theory goes silent.
  *   **Anti-Intentionalism:** Has nothing to say about *editing*. It assumes the text is fixed. It cannot account for Brod's changes without admitting that the "Text" is mutable, which undermines the idea of a stable object of analysis.
  *   **Reader-Response:** Has nothing to say about *materiality*. It treats the reading experience as mental. It cannot account for the fact that the physical manuscript was altered by a second hand.

  **Closing thought for the week:**
  The Kafka case suggests that "Meaning" is not a property of the text or the mind, but a property of the *chain of custody*. If that's true, interpretation isn't just decoding signs; it's forensic accounting of the text's survival. That's where you lead them into Week Two.
