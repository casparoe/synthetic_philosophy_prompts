answer: |-
  ### Introduction: The Pragmatic Bind

  You are correct to be wary. Quine's *gavagai* argument demonstrates that no finite set of behavioural tests can logically prove whether *tumu* refers to a rabbit, rabbit-stages, or undetached rabbit-parts. However, a dictionary is not a treatise on metaphysics; it is a tool for communication and education. Your goal is not to discover the 'true' ontology of the speakers, but to establish a **translation equivalent** that minimises confusion in the bilingual school programme.

  Below is a decision procedure designed for speed and transparency. It prioritises grammatical behaviour over intuition, but explicitly marks where lexicographic convention overrides linguistic ambiguity.

  ---

  ### The 20-Minute Lexical Ontology Protocol

  **Objective:** Determine the primary English gloss (Mass vs. Count vs. Polysemy) for a headword.
  **Time Limit:** 20 minutes per headword.
  **Tools:** Elicitation in trade language, recorded notes.

  #### Step 1: The Classifier Test (5 minutes)
  Elicit the numeral phrase 'one X' and 'two X'. Note the classifier used.
  *   **Test A:** Does the classifier belong to the set used for discrete, manipulable objects (e.g., 'roundish', 'long', 'animate')?
  *   **Test B:** Does the classifier belong to the set used for masses, liquids, or granular substances (e.g., 'drop', 'heap', 'spill')?
  *   **Decision:**
      *   If **A**: Provisional status = **Count Noun**.
      *   If **B**: Provisional status = **Mass Noun**.
      *   If **Mixed/Unknown**: Proceed to Step 2.

  #### Step 2: The Partition Test (5 minutes)
  Describe a scenario where the referent is divided.
  *   **Elicitation:** "If I cut this X in half / take half of this X, is this half still called X?" (Use gestures for cutting/scooping).
  *   **Decision:**
      *   If **Yes** (the half is still X): Provisional status = **Mass Noun**.
      *   If **No** (the half is broken/ruined/dead): Provisional status = **Count Noun**.
      *   *Note:* For animates, 'dead' counts as 'No'. A dead rabbit is often a different lexical item or 'meat', not 'rabbit'.

  #### Step 3: The Accumulation Test (5 minutes)
  Describe a scenario where more referents are added.
  *   **Elicitation:** Point to one X. Add another X. Ask: "Is this 'more X' (mass sense) or 'two Xs' (count sense)?" Rely on the classifier change from Step 1. If 'one round-X' becomes 'two round-X', it behaves like a count. If 'one round-X' becomes 'heap-X', it behaves like a mass.
  *   **Decision:**
      *   If classifier tracks individual units: **Count**.
      *   If classifier tracks the aggregate volume: **Mass**.

  #### Step 4: The Salience Hand-Off (5 minutes)
  If Steps 1–3 yield conflicting results (e.g., Classifier says Count, Partition says Mass), or if the result contradicts cultural intuition:
  *   **Stop.** Do not force a linguistic verdict.
  *   **Action:** Mark the entry as **Convention Stipulated**.
  *   **Rule:** Default to the **Discrete Object** gloss (Count Noun) for school utility, unless the Mass sense is overwhelmingly dominant in daily usage.
  *   **Notation:** Append a dagger symbol (†) to the gloss in the draft to indicate this is a lexicographic choice, not a grammatical certainty.

  ---

  ### Default Convention & Recording Ambiguity

  When the protocol runs out (Step 4), you are making a policy decision, not a linguistic discovery.

  1.  **The Default:** In a bilingual school context, **Count Nouns** are easier to teach for literacy (one-to-one correspondence with print words). Therefore, if ambiguous, gloss as Count.
  2.  **Recording Alternatives:** In the dictionary draft, use a usage note field.
      *   *Format:* `[Gloss] † (Note: Grammatically may function as mass/substance; treated as count for school programme).`
  3.  **The Committee Hand-Off:** Any entry marked with † must be presented to the language committee not as a fact, but as a proposal: *"The grammar allows 'stuff' or 'object'. We propose 'object' for the readers. Do you agree?"*

  ---

  ### Worked Cases

  Here is the protocol applied to your three problem cases.

  #### Case 1: *tumu* (Small furry animal)
  *   **Step 1 (Classifier):** Takes 'roundish' classifier (same as fruits/lumps). **Verdict:** Leans Count (discrete object).
  *   **Step 2 (Partition):** If cut in half, is it *tumu*? No, it is dead/broken. **Verdict:** Count.
  *   **Step 3 (Accumulation):** Two *tumu* take the pluralised classifier form (assuming numerals >1 trigger specific morphology, even if nouns don't). **Verdict:** Count.
  *   **Protocol Result:** **Count Noun ('rabbit/animal').**
  *   **Unwelcome Element:** None. This aligns with intuition.
  *   **Further Evidence Needed:** Elicitation regarding *tumu* meat. If the meat is also called *tumu* without a derivational suffix, the Mass sense is stronger than the Partition test suggests.
  *   **Weakness in Reasoning:** The Partition Test relies on the trade language concept of 'cutting'. If the language conceptualises the animal as a 'presence' rather than a 'body', the test is invalid.
  *   **Final Gloss:** *rabbit, small animal* †

  #### Case 2: *walip* (Palm tree / Palm fruit)
  *   **Step 1 (Classifier):** Tree takes 'long/stick' classifier. Fruit takes 'roundish' classifier.
  *   **Step 2 (Partition):** Cutting the tree does not yield 'tree'. Cutting the fruit yields 'fruit-stuff' (maybe).
  *   **Step 3 (Accumulation):** Distinct classifiers prevent simple accumulation tests across senses.
  *   **Protocol Result:** **Polysemy (Count/Count).** The grammatical behaviour shifts depending on the referent.
  *   **Unwelcome Element:** The protocol forces you to list two senses. You cannot write just 'palm'.
  *   **Further Evidence Needed:** Check if there is a generic term that covers both tree and fruit simultaneously. If *walip* is the only term, it is a polyseme. If there is a hypernym, *walip* might be specific.
  *   **Weakness in Reasoning:** Assuming tree and fruit are distinct ontological categories. In some Sepik cultures, the 'palm' is a single entity that manifests as wood or food. The dictionary split might impose English taxonomy.
  *   **Final Gloss:** *1. palm tree; 2. palm fruit*

  #### Case 3: *yil* (River stretch / River water)
  *   **Step 1 (Classifier):** Takes 'liquid/fill' classifier (like water, not like 'long' road). **Verdict:** Mass.
  *   **Step 2 (Partition):** If I take a cup of it, is it *yil*? Yes. **Verdict:** Mass.
  *   **Step 3 (Accumulation):** Adding more water uses the mass classifier. **Verdict:** Mass.
  *   **Protocol Result:** **Mass Noun ('water').**
  *   **Unwelcome Element:** **High.** The community likely views *yil* as a proper place ('The Sepik'), not just substance. The school programme will want to teach 'River' as a location. The protocol forces 'water'.
  *   **Further Evidence Needed:** Ask: "Can I go to *yil*?" If the locative postposition works without a 'bank' or 'place' nominaliser, it functions as a Location/Proper Noun.
  *   **Weakness in Reasoning:** This is where the protocol is most brittle. It privileges substance grammar over toponymic function.
  *   **Final Gloss:** *water; river* † (Note: Grammatically mass, used for location).

  ---

  ### Critique of the Procedure

  You asked where my reasoning is most likely to be wrong and which step I would defend least hard.

  **The Weakest Step:** **Step 1 (The Classifier Test).**
  I would defend this the least. Classifiers in Sepik languages often track *shape* or *handling* rather than *ontology*. A 'roundish' classifier might apply to a rabbit, a stone, and a lump of resin equally. It tells you how you count it, not necessarily what it *is*. If your colleague argues that the classifier reflects 'graspability' rather than 'discreteness', Step 1 collapses.

  **Where the Reasoning Fails:**
  In Case 3 (*yil*), the protocol yields 'water', but the cultural reality is 'River'. This is the danger of behavioural tests: they capture the *grammar of substance* but miss the *semantics of place*. If you gloss it as 'water', the children might not understand map-reading lessons.

  **Recommendation for the Committee:**
  For any entry marked †, present the committee with the 'School Utility' argument explicitly. "The grammar treats this like water, but we need to teach it as a place. We propose glossing as 'River' with a note." This honours the linguistic data without sabotaging the pedagogy.

  **Final Note on Indeterminacy:**
  Do not pretend the † symbol resolves Quine's problem. It does not. It simply flags where the dictionary stops being a mirror of the language and starts being a bridge to English. That is acceptable, provided the committee knows they are walking on a bridge you built, not ground they stand on.
