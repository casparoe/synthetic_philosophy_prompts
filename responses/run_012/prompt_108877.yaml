      *   **Task 2 (Case onto Theory):** What does this show about the distinction? Is there a third mode (delegated error discovery)? Is the fundamental axis independence/burden of proof? Address: internal process compliance, outcome self-reporting, external adversarial channels (courts, media, etc.), blame allocation.
      *   **Task 3 (The Disanalogy):** Transferability to opaque/learned/private AI. What survives? What depends on Robodebt's specific features (transparent rules, statutory power, captive population)? Where is the frame silent?

  2.  **Drafting - Section 1: Theory onto Case:**

      *   *Definitions:* Clarify Process (design, legal, testing, sign-off) vs. Outcome (error rates, appeals, harm).
      *   *Application:*
          *   **Process:** Did it exist? Yes, formally. There were approvals, legal advice (ignored/overridden), and technical implementation. *Critique:* It was "substantively empty." Legal advice saying it was unlawful was sidelined. Testing was likely limited to "does the code run?" rather than "is the logic lawful/accurate?"
          *   **Outcome:** What was measured? Revenue raised, debts issued, throughput. *Critique:* Not correctness. The "outcome" was fiscal efficiency, not welfare accuracy.
          *   **Ground Truth:** To supervise by outcome (accuracy), you need to know the *actual* fortnightly income. The system assumed averaging was truth. The only source of ground truth was the *recipient* disputing the debt.
          *   **Selection Problem:** Only those who noticed, understood, had capacity, and persisted generated a signal (appeal). Silent errors (vulnerable people paying wrong debts) were invisible to the system's internal metrics.
      *   *Synthesis:* Process was a rubber stamp. Outcome monitoring was perverse (revenue > rights).

  3.  **Drafting - Section 2: Case onto Theory:**

      *   *The "Third Mode":* The user suggests "delegated error discovery to the population at their own cost." This is crucial. It's not really outcome supervision; it's *privatized auditing*.
      *   *Independence & Burden of Proof:* This seems more fundamental than process/outcome. The agency supervised itself (no independence). The burden was on the subject (reversing the presumption of innocence/correctness).
      *   *Process Compliance:* Could it have caught the failure? Only if the process included *independent* legal sign-off that had veto power. Since the designer/deployer controlled the process checklist, it failed.
      *   *Outcome Self-Reporting:* If the agency defines "success" as money recovered, outcome supervision collapses. They report high success while causing harm.
      *   *External Adversarial Channels:* Courts (class action), Ombudsman, Journalism, Royal Commission. These provided the *actual* outcome supervision that the internal system lacked. Do equivalents exist for AI? (Regulators, audits, litigation). Often weaker for private AI.
      *   *Blame Allocation:* Is Royal Commission supervision? No, it's *ex post* accountability. It doesn't prevent harm. It's a substitute for effective *ex ante* or *in operatio* supervision.

  4.  **Drafting - Section 3: The Disanalogy (ML vs. Rules):**

      *   *Robodebt Features:* Transparent rules, deterministic, statutory power, captive population.
      *   *ML/AI Features:* Opaque (black box), probabilistic, private deployment, users can often exit (churn).
      *   *Transferability:*
          *   *Survives:* The "privatized auditing" (users appealing bans/flags). The "perverse outcome metric" (engagement/safety vs. profit). The "lack of independence" (internal AI ethics boards).
          *   *Fails/Changes:* In Robodebt, the rule was knowable (averaging). In ML, the rule is hidden. This makes *process* supervision (code review) harder but arguably more necessary. In Robodebt, the population was captive (welfare recipients). Private AI users can leave (though platform power makes this hard).
          *   *Silence:* The process/outcome frame doesn't account for *epistemic opacity*. You can't check the process of a neural net the same way as an `if/then` script. You can't easily define "ground truth" for recommendation algorithms (what is the "correct" video?).
      *   *Does "Not ML" matter?* Yes. It shows that *automation bias* and *bureaucratic cruelty* don't require ML. It isolates the *administrative law* failure from the *technical* failure. If the frame fails here, it's not because the tech was too complex; it's because the governance was broken.

