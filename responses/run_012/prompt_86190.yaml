answer: |-
  A probabilist walks into the St. Petersburg Casino.
  "Infinite expectation," he says. "I'll buy in for $1,000."
  "We pay in scrip," says the dealer. "Backed by the promise to let you play again."
  "So no finite bankroll constraint?"
  "The bankroll is exactly the scrip outstanding. It expands to meet the liability."
  "Then I'll maximize logarithmic utility."
  "Unnecessary. The currency inflates to cancel the $2^n$ growth."
  "So the real value isn't infinite?"
  "Nominally, yes. But half the time you win 2 units, and the total supply is 2 units."
  "I own the house?"
  "Yes. The infinite tail is just dilution."
  "So I'm not pricing the expectation?"
  "You're pricing the median."
  "How much?"
  "Two bucks. Half the time, that's the whole bankroll."
