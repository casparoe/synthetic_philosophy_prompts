  2.  **Deconstruct the St. Petersburg Paradox:**
      *   **The Game:** Flip coin until heads. If heads on flip $n$, win $2^n$.
      *   **The Paradox:** Expected Value (EV) = $\sum (1/2^n) * 2^n = \sum 1 = \infty$. Yet, people won't pay much to play (usually <$20).
      *   **Standard Resolution 1 (Finite Bankroll):** No casino has infinite money. If capped at $2^N$, EV becomes finite (~$N$).
      *   **Standard Resolution 2 (Utility):** Money has diminishing marginal utility (log utility). $E[U] = \sum (1/2^n) \log(2^n) = \sum (n/2^n) < \infty$.
      *   **The Twist (Scrip):** The payout is in currency backed by the game itself. This creates a recursive valuation problem. The "bankroll" isn't external cash; it's the liability of the casino denominated in its own stock/scrip.

