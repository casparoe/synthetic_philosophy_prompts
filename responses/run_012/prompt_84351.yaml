  I was sitting in on a global strategy offsite last week, trying to draft a universal campaign slogan for a new international coalition. Someone suggested: "Stop the Liberals."

  The polling was miraculous. It tested at 80% approval in Texas, in Paris, and in Sydney. The team was ready to launch until they read the focus group notes.

  The Texans wanted to stop the liberals from raising taxes.
  The Parisians wanted to stop the liberals from cutting them.
  The Australians were just confused why we were attacking their governing party.
  And the Canadians walked out thinking we were planning a fundraiser.

  It turns out "Liberal" isn't an ideology. It's a mirror. Everyone sees their own enemy, and somehow they all agree on the spelling.
