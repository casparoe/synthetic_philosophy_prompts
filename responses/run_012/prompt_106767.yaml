answer: |-
  **Project Title:** The Directive Character: Folk Psychology and the Ontology of Fiction

  **Project Overview**
  Eliminative materialism argues that common-sense psychological concepts like "belief" and "desire" are false theoretical posits that do not correspond to genuine neural states. For a novelist whose work relies on interior monologue, this presents a destabilizing challenge: if beliefs do not exist, are characters merely bundles of falsehoods? Standard philosophical responses suggest either rejecting eliminativism or accepting that fiction is strictly "make-believe." I propose a third option: the **Directive View**. On this account, belief-attribution in fiction is not a descriptive claim about a character's internal metaphysics, but a directive instruction to the reader on how to imagine the character's coherence. This project investigates whether this view can salvage the novel from eliminativism without retreating into naive realism.

  **Statement of Questions**
  This project pursues two distinct but linked inquiries:
  1.  **The Metaphysical Question:** Does the truth of eliminative materialism undermine the novel's practice of attributing beliefs, or does it only undermine the philosophical assumption that such attributions are descriptive reports of inner states?
  2.  **The Practical Question:** If belief-talk is directive rather than descriptive, what are the success conditions for the novelist? What must be true for an attribution to be *apt*, and what constitutes a failure of characterization rather than a mere factual error?

  **Critical Context**
  Existing positions fail to address the novelist's specific predicament. Eliminativists ignore fiction; realists insist beliefs must exist for talk of them to be valid; instrumentalists claim belief-talk is "useful" but do not explain its aesthetic mechanics. Furthermore, this project counters the aesthetic autonomist view (argued by some poets and critics) that fiction is separate from metaphysics. Fiction imports the reader's cognitive architecture; if that architecture relies on folk psychology, the novelist must understand how that tool functions when its referents are removed. We cannot simply say fiction is "separate"; we must explain how it operates *within* a materialist world.

  **Methodology**
  This is a conceptual and critical project, not an empirical study. Surveying readers would reveal how they *do* react, not how they *ought* to cohere their imagination according to the text's directives. Similarly, surveying novelists would yield unexamined craft dogma rather than a rigorous theory. I will employ conceptual analysis grounded in close reading. I will treat scenes of interiority as data points to test the limits of the Directive View. This approach leverages my position as a practitioner: I am analyzing the rules of a game I play daily, seeking to articulate the norms that govern apt characterization without metaphysical baggage.

  **Work Plan (12 Months)**
  *   **Months 1–2 (Conceptual Foundation):** Clarify the distinction between descriptive and directive uses of psychological terms. Draft the initial definition of the "Directive View" and distinguish it from instrumentalism.
  *   **Months 3–4 (Taxonomy):** Build a taxonomy of belief-attribution roles in fiction: prediction, explanation, moral evaluation, narrative alignment, and unreliable narration.
  *   **Months 5–7 (Stress-Testing):** Apply the taxonomy to limit cases: scenes where characters are wrong about their own beliefs, or where narrator attributions conflict with action. Determine where the "directive" breaks down.
  *   **Months 8–10 (Drafting):** Compose the core essay, structured as a hybrid of philosophical argument and craft manifesto.
  *   **Months 11–12 (Revision & Dissemination):** Refine the argument based on fellowship workshops. Prepare the essay for publication and outline a subsequent chapter for a non-fiction book on craft.

  **Deliverables and Risk Assessment**
  The primary deliverable is a long essay (8,000–10,000 words) suitable for a humanities journal or as a cornerstone of a craft book.
  *   **Failure Condition:** The project fails if the "Directive View" collapses into a terminological reshuffle—simply renaming "instrumentalism" without generating new normative criteria for aptness. If I cannot specify what makes a directive *wrong* (other than "it doesn't work"), the theory is empty.
  *   **Scope:** One year is the ideal scope for developing a robust taxonomy. If the fellowship were reduced to six months, I would cut the stress-testing phase (Months 5–7) and focus solely on defining the Directive View against eliminativism, producing a shorter, more theoretical paper rather than a craft manifesto.
  *   **Primary Risk:** The riskiest component is the stress-testing phase. It is easy to define a theory; it is difficult to prove it holds up against complex, contradictory literary texts. If the taxonomy proves too rigid to accommodate ambiguous characters, the project will require significant pivoting toward a more flexible pragmatic account.

  ***

  ### Notes to the Applicant (Private Advice)

  You asked for honesty about the risks and scope outside the proposal text. Here is my assessment:

  **1. The Riskiest Part**
  The **taxonomy (Months 3–4)** and **stress-testing (Months 5–7)** are the highest risk. It is very easy to come up with a clever philosophical distinction (Descriptive vs. Directive) that sounds good in the abstract. The danger is that when you try to categorize actual scenes, everything bleeds together. For example, is "prediction" really distinct from "explanation"? If your categories aren't mutually exclusive or exhaustive, the "craft manifesto" aspect will feel vague. You risk proving that "directives" are just "vibes." To mitigate this, you need to pick specific, difficult texts (not just your own) where belief-attribution is notoriously messy (e.g., Kafka, Beckett, or unreliable narrators like in *Gone Girl*).

  **2. What to Cut for Six Months**
  If you only get six months, **cut the Taxonomy.**
  *   **Keep:** Months 1–2 (Defining the view) and Months 5–7 (Stress-testing).
  *   **Why:** You don't need a full taxonomy to prove the core point. You only need to show that *one* major type of belief-attribution (e.g., moral evaluation) works better under the Directive View than the Descriptive View. A six-month project should aim for a tight, punchy philosophical essay ("Why Beliefs Don't Exist in Novels") rather than a comprehensive craft system. Drop the ambition of a "manifesto" and aim for an "intervention."

  **3. Is One Year Realistic?**
  Yes, but only if you treat the writing as *thinking*. Do not spend the first six months just reading. You need to be writing drafts early. The scope is appropriate for a humanities fellowship because it bridges the gap between "theory" and "practice." However, be careful not to drift into pure philosophy. You are a novelist. Your authority comes from the *practice*. If you start arguing with Churchland on his own turf, you lose. Keep the anchor in the *text* and the *act of writing*.

  **4. Answering the Poet**
  The proposal addresses the "Catskills Poet" argument (that fiction is separate from metaphysics) in the **Critical Context** section. This is crucial. If fiction were truly separate, readers wouldn't use their real-world cognitive tools to understand it. By framing this as a question of *how readers process text*, you validate the metaphysical inquiry without reducing the art to science.

  **5. Final Polish**
  The proposal above is written to be "citation-free" as requested, but it uses signal phrases ("Eliminative materialism argues," "Standard philosophical responses") to show you know the landscape without bogging down in footnotes. This strikes the right balance for a cross-disciplinary humanities center. Good luck.
