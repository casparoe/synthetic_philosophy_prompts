  Context for why I care: at work we have a comparator function that orders deployment configs by how bad the day is going to be for users, and I was writing tests for it when I noticed something I can't unsee.

  Here's the setup. A day is described by two numbers: how many people it happens to, and how bad it is for each of them. Five rungs:

  Rung 1: 1 person in agony all day — the kind where you can't form thoughts, you're just screaming.
  Rung 2: 3 people in severe pain all day — bad enough that they can't do anything but lie still and wait for it to end.
  Rung 3: 9 people with a bad migraine all day — dark room, can't work, can't really think, but nothing like rung 2.
  Rung 4: 27 people with a mild headache all day — annoying, they can work, they're grumpy.
  Rung 5: 81 people with a barely noticeable discomfort all day — like a slightly tight shoe.

  My verdicts, rung by rung:

  1 vs 2: I shrug. If you made me pick I'd maybe take 2, but I don't feel it.
  2 vs 3: shrug again. Slightly prefer 3? Honestly a coin flip.
  3 vs 4: shrug. 4, weakly, probably.
  4 vs 5: shrug, and here I truly have no preference. 81 tight shoes vs 27 headaches — I'd flip a coin.
  1 vs 5: not close at all. Rung 1 is much worse. I'd take the 81 tight shoes every time, and someone who called it a wash would seem out of their mind to me.

  So now I have a problem, because "at least as good as" is supposed to be transitive — if 2 is no worse than 1, and 3 is no worse than 2, and so on, then 5 is no worse than 1, which I just said is false. And I know from work that a comparator that isn't transitive doesn't just give you a weird order, it makes the sort actually break — you get output that depends on the order the elements arrived in.

  Three more things that I think are part of the same problem, or maybe not:

  (a) When I look at two adjacent rungs on their own, I shrug. When I look at the whole ladder at once, I have a firm preference for 5 over 1. Same two options, different verdict depending on what else is in the frame. That feels like it shouldn't be allowed if "better" is a fact about the pair.

  (b) Scale rung 5 up — not 81 people with a tight shoe but a billion people with a tight shoe, against just the one person in agony — and I flip. The billion is worse. I'm confident about that. But I have no idea where the switch happens, and if you ask me about ten thousand vs a hundred thousand I'm back to shrugging.

  (c) 81 people with a mild headache (rung 4's severity at rung 5's headcount) vs the 1 agony: I take the headaches. 81 people is nothing. So maybe agony isn't a different kind of bad after all and I just have a number somewhere in there.

  (d) Same ladder but good: 1 person in bliss all day vs 81 people mildly content. I say the bliss one is better, and I shrug on the adjacent rungs there too, so I guess I've got the same problem. But I feel worse about giving up transitivity for good things than for bad ones. Not sure if that's a real distinction or just squeemishness.

  My half-baked guess at my own view: below some level of badness everything is just mildly bad and you add it up normally — a hundred headaches beat one. But once you're up in agony territory it's a different kind of bad, and no number of mild headaches can outweigh it. That guess has a sharp line in it, which I hate, and it doesn't obviously survive (b), where I flip at some huge number.

