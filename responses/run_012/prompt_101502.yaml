      *   *Tone Check:* Ensure it sounds like a philosopher talking to philosophers, not a grant administrator. Use terms like "supervenience," "normative force," "etiological account."

  5.  **Final Polish:**
      *   Check against constraints: No bibliography? Check. Honest scope? Check. Determinate question? Check. Failure conditions? Check. Weakest reasoning? Check.
      *   Make sure the "Thick vs. Thin" distinction is clear throughout.
      *   Ensure the "Flip" condition is philosophically substantive.

  6.  **Final Output Generation:** (Proceeding to generate the response based on these thoughts.)
answer: |-
  **Project Title:** The Normative Gap in Free-Floating Rationales: Historical Etiology vs. Functional Norms

  **1. The Research Question**
  Does the normative force of biological function ascriptions (e.g., "the heart is *for* pumping," "the chick *manipulates* the host") supervene entirely on historical selection facts, or does it invoke a distinct, forward-looking normative standard that can diverge from selection history?

  To make this determinate: **Can we construct biologically coherent cases where the historical selection story (Thin Reading) and the functional normative standard (Thick Reading) prescribe conflicting judgments about malfunction, and if so, which judgment do expert biological intuitions track?**

  If expert judgments track the history alone, the Thick reading is idle wheel-spinning. If they track the norm even when history is ambiguous or absent, the Thick reading earns its keep as a distinct theoretical posit.

  **2. Why the Question Remains Open**
  Current positions in the philosophy of biology treat this as a settled metaphysical dispute rather than a functional distinction, leaving the actual usage of FFRs under-examined.

  *   **The Eliminativists (The Thin Camp):** Argue that talk of "rationales" is strictly shorthand for etiological history (Millikan, Neander style). They claim any normative gloss is eliminable without loss. *The Gap:* They struggle to account for cases of "novel function" or "exaptation" where the normative standard seems to apply before a selection history is established, often dismissing these as category errors rather than data points.
  *   **The Irreducibilists (The Thick Camp):** Argue that biological norms are real and distinct from mere statistical history. *The Gap:* They often posit this norm as a brute fact or rely on a robust teleology that risks smuggling in a reasoner by the back door. They rarely specify *when* the norm detaches from the history.
  *   **The Deflationists (The Pragmatists):** Argue that FFRs are useful instruments regardless of metaphysics (Dennett's likely home). *The Gap:* By treating the distinction as merely pragmatic, they obscure whether the "usefulness" relies on a hidden commitment to the Thick reading. They assume the two readings always coincide, which is precisely what needs testing.

  None of these positions rigorously test the *divergence* point. They assume the Thin and Thick readings travel together. This project assumes they might come apart.

  **3. Methodology and Work Plan (One Semester)**
  This is a conceptual analysis project grounded in biological case studies. No empirical data collection is required; the "data" are the theoretical judgments of biologists and philosophers of biology.

  *   **Month 1: Taxonomy and Baseline.**
      *   Refine the definitions of Thin (etiological shorthand) and Thick (normative standard) readings.
      *   Survey existing "problem cases" in the literature (e.g., vestigial organs, exaptations, spandrels, evolutionary mismatches).
      *   *Deliverable:* A working paper defining the "Divergence Criteria."

  *   **Month 2: Constructing Divorce Cases.**
      *   Develop 3-5 specific thought experiments where history and norm pull apart.
      *   *Example Case:* A trait fixed by drift that accidentally solves a problem (Thin says: no function; Thick says: has a rationale).
      *   *Example Case:* A trait with a clear selection history that is now systematically maladaptive due to rapid environmental change (Thin says: function remains; Thick says: rationale defeated).
      *   *Deliverable:* A set of calibrated vignettes ready for testing.

  *   **Month 3: Stress Testing (The "Workshop" Phase).**
      *   Present these cases to two audiences: (1) Philosophy of biology colleagues, (2) Evolutionary biologists (informal consultations).
      *   Goal: Determine which reading drives their judgment on whether the trait is "functioning," "malfunctioning," or "neutral."
      *   *Deliverable:* Annotated transcript of feedback and judgment patterns.

  *   **Month 4: Analysis and Synthesis.**
      *   Analyze whether judgments cluster around Thin or Thick readings.
      *   Determine if the "Thick" norm is doing independent work or if it's just a heuristic for hidden historical facts.
      *   *Deliverable:* First draft of the target paper.

  *   **Month 5: Revision and Dissemination.**
      *   Finalize the argument.
      *   Prepare for departmental colloquium presentation.
      *   *Deliverable:* Final manuscript and presentation slides.

  **4. Conditions for Project Failure**
  Given the scope, "failure" does not mean a negative result, but rather an indeterminate one. The project fails if:
  1.  **The Distinction Dissolves:** Every "Divorce Case" I construct is shown by consultants to be biologically incoherent (i.e., you *can't* actually separate the norm from the history in a real biological system).
  2.  **Judgment Inconsistency:** Expert judgments are randomly distributed between Thin and Thick readings with no pattern, suggesting the distinction is psychologically real but theoretically useless.
  3.  **The Collapse:** It turns out that every time experts favor the Thick reading, they are implicitly appealing to *potential* history (e.g., "it *would* have been selected"), which collapses the Thick reading back into a counterfactual Thin reading.

  If any of these occur, the conclusion will be that the Thick reading is indeed idle, but arriving at that conclusion definitively is still a successful outcome for the grant.

  **5. Weakest Link and The "Flip" Condition**
  **The Weakest Link:** The reliability of "expert intuition." I am assuming that biologists' judgments about function/malfunction track a consistent underlying concept. It is highly possible that biologists are simply inconsistent, using "function" to mean "history" in one sentence and "current utility" in the next. If usage is just messy, there is no fact of the matter to discover.

  **What Would Change My Mind (The Flip):**
  I am currently biased toward the idea that the Thick reading is doing hidden work. I would flip to the Eliminativist/Thin position if:
  *   **The "Counterfactual History" Defense Holds:** If, for every case where I think the Thick norm is operating independently (e.g., a novel trait solving a problem), it can be demonstrated that biologists are actually relying on a *counterfactual selection story* (e.g., "if this environment persists, this trait *will* be selected"). If the Thick norm can be fully cashed out as a prediction about future Thin facts, then the Thick reading adds no ontological weight.

  Conversely, I would become a committed Realist about the Thick reading if:
  *   **The "Systematic Malfunction" Case:** We find a case where a trait has a robust selection history (Thin says: Functioning correctly) but is universally regarded by biologists as "broken" because it no longer serves the organism's viability, *and* they do not appeal to future selection to fix it. If the "ought" persists even when the "was" and the "will be" both say "no," then the Thick norm is irreducible.

  **6. Budget and Resources**
  *   **Funds Requested:** $0 (Internal Seed Grant).
  *   **Resources Needed:** Release from one course (or equivalent stipend for time), access to departmental workshop series for testing cases.
  *   **Justification:** The primary cost is time for conceptual construction and dialogue. No lab equipment or travel is required.

  **7. Expected Outcome**
  A manuscript suitable for submission to *Philosophy of Science* or *Biology and Philosophy*, clarifying the theoretical costs of using free-floating rationales. Even if the result is negative (the Thick reading collapses), it prevents future theorizing from relying on an ambiguous distinction.
