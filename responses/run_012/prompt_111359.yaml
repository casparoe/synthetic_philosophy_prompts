  **Thinking on the Page**

  The pantoum is a form of recursive return; it demands that the past become the foundation of the future, verbatim. In choosing this structure for the Poverty of the Stimulus debate, I am committing the poem to a formal ambiguity that mirrors the theoretical stalemate. If the recurring lines are the "input," their verbatim repetition enacts the empiricist's constraint: the data never changes, it never grows richer. Yet, if the intervening lines are the "inferences," their progressive articulation enacts the nativist's claim: complex structure emerges where none was visibly given. The form itself refuses to adjudicate whether the new lines are *extracted* from the old (empiricism) or *imposed* upon them by an internal architecture (nativism). By forcing the opening line to return at the close, the poem suggests either that the learner has finally found what was always there, or that the learner has traveled in a circle, bringing nothing back but what she began with. The structure holds both truths in tension, leaving the final stanza double-voiced: a testament to sufficiency and a testament to innateness, simultaneously.

