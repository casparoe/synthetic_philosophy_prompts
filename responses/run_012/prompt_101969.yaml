      *   Modest defensible version? Yes.
      *   No citations? Yes.

  10. **Proceed to generate output.** (Mental outline complete).

  *(Self-Correction during final output generation)*: Ensure I explicitly address the difference between "not a single formal system" and "not any machine." A machine could be a sequence of systems. Gödel diagonalizes over one system. If the mind grows, the diagonalization point moves. This is the "Benacerraf objection" territory, but I must reason from concepts, not name-drop. I will describe the conceptual hurdle.

