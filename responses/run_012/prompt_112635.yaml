  2.  **Deconstruct the Topic (The Paradox of Deontology):**
      *   *What is it?* Deontology says "Do not kill/lie." Consequentialism says "Minimize killing/lying." If I can lie once to prevent two others from lying, consequentialism says lie. Deontology says don't lie. But if I don't lie, there are *more* lies in the world. So deontology seems to care more about *my* hands being clean than the total amount of badness. This looks self-defeating if the goal is to reduce badness.
      *   *The Core Confusion:* Laypeople think deontology is just "rules are rules." They miss the *agent-relative* constraint. They think the paradox proves deontology is irrational.
      *   *The Pedagogical Challenge:* Getting them to see that the constraint isn't a clumsy heuristic for minimizing bad outcomes, but a structural feature of moral agency.

  3.  **Brainstorming Prerequisites (What must be in place first?):**
      *   They need to understand what a "constraint" is (not just a rule of thumb).
      *   They need to understand the consequentialist baseline (minimizing bad states of affairs) to see the contrast.
      *   They need to grasp *agent-relativity* (what *I* do matters differently than what *others* do) without using jargon immediately.
      *   They need to see that the paradox arises *even if* the deontologist agrees the outcome is worse.

  4.  **Developing the Carrying Example:**
      *   *Requirement:* Ordinary life, small-scale, not life/death.
      *   *Idea:* A promise to meet for coffee vs. preventing others from breaking promises? A bit abstract.
      *   *Idea:* Lying to a friend vs. preventing others from lying?
      *   *Selected Idea:* The "Cover for a Colleague" scenario.
      *   *Setup:* You discover a colleague (Alice) is about to lie to a client to save a deal. You can prevent Alice's lie only by telling a small lie yourself to distract the client.
      *   *Why this works:* It's workplace relatable (engineers/lawyers). It's low stakes (not murder). It isolates the *act* of lying vs. the *state* of lies existing.
      *   *Why not life/death:* High stakes trigger emergency utilitarianism ("of course save the life!"). Low stakes let the structural logic breathe. If lives are at stake, the "cost" of the constraint feels too high to discuss calmly. With small lies, the intuition that "one lie is better than two" is stronger, making the deontological refusal more puzzling.

  5.  **Sequencing the Session (50 Minutes):**
      *   *0-10 mins:* Establish the Consequentialist Baseline (The "Minimizer" view).
      *   *10-20 mins:* Introduce the Deontological Constraint (The "Agent-Centered" view). Distinguish from rule-utilitarianism.
      *   *20-35 mins:* The Paradox itself. Run the example. Show the math (1 lie vs. 2 lies).
      *   *35-45 mins:* Resolving/Mollifying the Paradox (Agent-Relative reasons). Distinguish tension vs. contradiction.
      *   *45-50 mins:* Closing Question & Wrap-up.

  6.  **Addressing Misconceptions:**
      *   *Pre-existing:* "Deontology = rigid rule following." "Consequentialism = caring about people."
      *   *Emergent:* "So deontologists don't care if more lies happen?" "Isn't this just rule-utilitarianism?"
      *   *Strategy:* Pre-empt these by explicitly defining terms before applying them.

  7.  **Distinguishing Tension vs. Contradiction:**
      *   *Contradiction:* $A$ and not-$A$. Logic fails.
      *   *Tension:* Two values pulling in opposite directions. The theory admits the outcome is worse but says *I* shouldn't cause it. It's a feature, not a bug, but it feels paradoxical from the outside.

