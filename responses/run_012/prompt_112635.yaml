answer: |-
  Here is a teaching plan designed for your specific group and constraints.

  ### Conceptual Prerequisites

  Before you can state the paradox, three specific ideas must be seated in the room, and they must be seated in this order. First, your group needs a working definition of Consequentialism that is stripped of its colloquial baggage; you must establish that for a consequentialist, the only thing that matters is the state of the world, specifically minimizing the occurrence of bad events, regardless of who causes them. Second, you must introduce the Deontological Constraint not as a rule of thumb, but as a structural limit on action; you need them to understand that for a deontologist, the prohibition against lying is not a suggestion on how to minimize lies in the universe, but a boundary on what *I* am permitted to do. Third, and most critically, you must distinguish between an outcome being "bad" and an action being "wrong." If your group believes that an action is wrong *because* it leads to a bad outcome, the paradox cannot exist. You need them to accept, even provisionally, that a deontologist can agree an outcome is worse (more lies exist) while maintaining the action was right (I did not lie). If you do not secure this distinction early, the group will spend the entire session arguing that the deontologist is simply miscalculating the consequences, which misses the point entirely.

  ### The Carrying Example

  You should use a scenario I will call "The Colleague's Lie." In this scenario, you are a project manager and you discover that a colleague, Alice, is about to send an email to a client containing a deliberate, significant falsehood to secure a contract. You cannot stop Alice from sending the email unless you intervene by sending a prior email to the client yourself that contains a smaller, deliberate falsehood to distract them or delay the process, thereby neutralizing Alice's lie. If you do nothing, Alice sends one big lie. If you act, you send one small lie and Alice sends nothing. However, to sharpen the paradox, let us adjust the numbers slightly: suppose that by telling one small lie yourself, you prevent Alice from telling *two* lies to different clients. The consequentialist math is simple: one lie is better than two, so you should lie. The deontological constraint says: do not lie, even to prevent others from lying.

  This example must have three specific features to work. First, the stakes must be professional and reputational, not life-and-death. If you use a murder scenario, the visceral horror of death overwhelms the structural logic, and everyone instinctively becomes a consequentialist because the cost of the constraint feels too high to contemplate. Second, the lies must be of the same moral species; you cannot compare a lie to a murder, or the group will argue about a hierarchy of evils rather than the structure of the constraint. Third, the example must conspicuously lack any possibility of long-term rule-following benefits. You must stipulate that this is a one-off, sealed scenario where no one finds out what you did, so you cannot argue that telling the lie damages your integrity or sets a bad precedent. This isolates the immediate act from its ripple effects. A life-and-death version obscures the point because it triggers emergency intuitions about saving lives that bypass moral theory entirely; a small-scale dishonesty forces the group to confront the logic of the constraint itself without the emotional noise of mortality.

  ### The Session Sequence

  You should begin the first ten minutes by establishing the Consequentialist Baseline. Tell the group to imagine they are auditors of the universe whose only job is to minimize the total count of a specific bad thing, such as lies. Ask them if, in the Colleague's Lie scenario, the auditor would want you to lie. They will say yes. Explain that this is the "God's eye view" where who does the lying does not matter, only that the lying happens. This sets the target that the deontologist appears to be missing.

  From minute ten to minute twenty, introduce the Deontological Constraint. You must explicitly distinguish this from Rule-Utilitarianism, which is the most common confusion. Tell them that a Rule-Utilitarian follows the rule "do not lie" because following it generally minimizes lies. A Deontologist follows the constraint because *they* are not permitted to be the source of the lie, regardless of the total count. Use the phrase "agent-relative restriction" here, but immediately define it as "a rule that applies to me because I am me, not because of the result." Ask the group to accept this premise charitably, even if it feels strange, so you can test its implications.

  From minute twenty to minute thirty-five, run the Paradox itself using the Colleague's Lie example. Lay out the math clearly: Option A yields two lies in the world (both by Alice). Option B yields one lie in the world (by you). Ask the deontologist why they choose Option A. State the paradox aloud: "If the goal of morality is to reduce wrongness, and lying is wrong, why does the deontologist choose the world with more wrongness in it?" This is the moment where the theory looks self-defeating. Encourage the lawyers in the room to prosecute the deontologist here; let them argue that the deontologist is prioritizing their own cleanliness over the actual reduction of harm.

  From minute thirty-five to minute forty-five, move to the Resolution or Dissolution. This is where you explain that the paradox relies on assuming the deontologist shares the consequentialist goal of minimizing wrongness. Explain that the deontologist denies this goal. Their goal is not to minimize the occurrence of wrong acts in the universe, but to ensure that *their own* agency is not used to produce wrong acts. This is not a contradiction in their logic, but a fundamental disagreement about what morality is for. You must clarify that the deontologist regrets that Alice lies, but refuses to bridge the gap between Alice's agency and their own.

  For the final five minutes, deploy the closing question and summarize. Do not open the floor to general debate yet; use the question to test comprehension, then allow discussion.

  ### Misconception Management

  There are three specific misconceptions you must pre-empt. The first is the "Rule of Thumb" error, where the group assumes the deontologist thinks lying is usually bad but sometimes okay. You should head this off in the first twenty minutes by stating explicitly that the constraint is absolute within the context of the example, not a heuristic. Say, "For the purpose of this puzzle, assume the deontologist believes lying is forbidden even when it saves money or reputation, not because it usually fails, but because it is inherently impermissible for the agent."

  The second misconception is the "Hypocrisy" charge, where the group thinks the deontologist simply doesn't care about the two lies Alice tells. You will likely hear this during the paradox section. You should pre-empt this by clarifying that the deontologist is permitted to try to persuade Alice not to lie, or to report her, provided those actions do not involve lying themselves. The constraint is on *their* action, not on their concern for the outcome. Say, "The deontologist wishes Alice would not lie, and may act to stop her, provided they do not cross the boundary themselves."

  The third misconception is that the paradox proves the theory is logically inconsistent. This will arise in the resolution phase. You must clarify that a theory is only inconsistent if it demands two mutually exclusive things. Deontology demands "Do not lie" and "Prevent lying," but it does not demand "Prevent lying *by lying*." The tension is practical, not logical. Say, "The theory does not say you must minimize lies at all costs; it says you must not lie. These are compatible instructions, even if they lead to a worse outcome."

  ### Tension Versus Contradiction

  You need to be very precise about the difference between a genuine tension and a flat-out contradiction, as this is where you feel yourself blurring the lines. A contradiction occurs if a theory asserts $A$ and not-$A$ simultaneously, such as "You must minimize lies" and "You must not minimize lies." Deontology does not do this. It asserts "You must not lie" and "You should prefer a world with fewer lies." The tension arises because the world forces a choice where satisfying one desire violates the other. A contradiction means the theory is broken and cannot function. A tension means the theory functions but exacts a cost. The paradox of deontology is the observation that this cost looks irrational from the outside, not that the internal logic fails. You should tell your group: "A contradiction breaks the engine; a tension just means the ride is uncomfortable. Deontology accepts the discomfort of a worse outcome to preserve the integrity of the driver."

  ### Exclusions

  There are three topics you should openly decline to get into if they arise. First, do not discuss Kant's Categorical Imperative or the specific formulations of duty. This requires too much background and will bog down the logic of the paradox. If someone asks, say, "We are not doing Kant exegesis today; we are looking at the structural problem of constraints." Second, do not discuss the Doctrine of Double Effect, which deals with foreseen but unintended consequences. This introduces a distinction between intending and foreseeing that is too technical for a fifty-minute session and will confuse the clean math of your example. Third, do not attempt to solve the paradox definitively. Your goal is to make them feel the paradox and understand why it exists, not to convince them that deontology is correct. If pressed for a verdict, say, "Philosophers have argued about this for forty years; we are not settling it in fifty minutes."

  ### The Closing Question

  To test whether the paradox has landed, do not ask them if they agree with deontology. Instead, ask them this: "If you accept that you are responsible for your own actions but not for Alice's actions, does that mean you are responsible for *less* of the badness in the world, or does it mean you are responsible for a *different kind* of badness?" This question forces them to choose between a consequentialist accounting (total badness) and a deontological accounting (my badness). If they answer that they are responsible for less badness, they have slipped back into consequentialism. If they answer that it is a different kind of badness, they have grasped the agent-relative distinction. If they can articulate that distinction, they have understood the session.
