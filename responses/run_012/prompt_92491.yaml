answer: |-
  Here is a desiderata list for any account of Wigner's problem, followed by the meta-analysis you requested.

  ### The Desiderata List

  **1. The Autonomy Condition**
  *   **Requirement:** The account must explain how mathematical structures developed without physical intent successfully govern physical phenomena.
  *   **The Case:** **Prediction/Pre-emption.** Dirac's equation yielded antimatter before it was observed; Gell-Mann's SU(3) symmetry predicted the omega-minus baryon years before detection. The math was not tweaked to fit these data points; the data points fell into the math's pre-existing slots. An account that says "we tailor math to fit physics" fails here.

  **2. The Selectivity Condition**
  *   **Requirement:** The account must explain why *specific* mathematics is effective while the vast majority of consistent mathematics remains physically inert.
  *   **The Case:** **The Unused Math.** For every Riemannian geometry used in GR, there are infinite non-Euclidean geometries with no known physical referent. If math is effective because it *is* the structure of reality (Pythagoreanism), why is most of reality's supposed structure physically silent? An account cannot treat all math as equally potent.

  **3. The Surplus Condition**
  *   **Requirement:** The account must distinguish between *effectiveness* (fitting the data) and *unreasonableness* (fitting data beyond the scope of its design).
  *   **The Case:** **Your Proposal 1.** If the explanation is merely "we select models that work," you have explained effectiveness, not Wigner's puzzle. The account must quantify the "surprise"—the reach of the theory beyond the boundary conditions used to construct it. If the fit is trivial, the phenomenon is dissolved, not explained.

  **4. The Constraint Condition**
  *   **Requirement:** The account must acknowledge that the fit is partially engineered and distinguish this engineering from deep structural isomorphism.
  *   **The Case:** **Your Proposal 2.** We discard models that don't fit (selection bias). A serious account must separate "curve fitting" (adjusting parameters to match known data) from "structural mapping" (the logic of the math mirroring the logic of the causal chain). If you ignore the engineering, you inflate the miracle; if you reduce it all to engineering, you erase the miracle.

  **5. The Failure Mode Condition**
  *   **Requirement:** The account must explain the limits of mathematical applicability and why elegance does not guarantee truth.
  *   **The Case:** **The Fizzles.** **Catastrophe Theory** is a fair example here. The math was rigorous, but its application to biology and sociology was largely overhyped and failed to yield robust predictive laws. This proves that mathematical consistency is necessary but not sufficient for physical truth. An account must explain why the bridge collapses sometimes, not just why it stands.

  **6. The Cognitive Access Condition**
  *   **Requirement:** The account must explain how human cognitive apparatus, evolved for medium-sized survival tasks, accesses trans-empirical mathematical truths.
  *   **The Case:** **The Fit (Deep).** Riemannian geometry is not intuitive; it was developed as an abstract consistency check on axioms. That human brains can manipulate 11-dimensional string theory or non-commutative algebra suggests a cognitive access that exceeds evolutionary utility. An account cannot assume the brain is just a mirror of the macro-world.

  ***

  ### The Analysis

  **Genuine Requirements vs. Camp Prejudices**
  *   **Genuine:** **The Surplus Condition** and **The Constraint Condition** (Your two proposals). These are methodological necessities. Without them, you are either solving a strawman problem (ignoring selection bias) or dissolving the problem entirely (ignoring the surprise).
  *   **Prejudice:** **The Selectivity Condition** is often rejected by the **Platonist/Pre-established Harmony** camp. They tend to argue that *all* math is potentially physical, and we just haven't found the use for the rest yet. This is faith, not data. Conversely, **The Autonomy Condition** is often rejected by the **Empiricist/Instrumentalist** camp, who argue that Dirac just got lucky or that the math was implicitly guided by physical intuition anyway. Both sides try to dodge these bullets; a serious account must bite them.

  **The Incompatible Pair**
  You suspected **Not-being-trivial** and **Being-naturalistic** pull against each other. You are correct, but the precise tension is between **Cognitive Naturalism** and **Trans-empirical Reach**.
  *   **Cognitive Naturalism** argues math is a product of human evolution and brain structure. This explains why math fits the medium-sized world (where we evolved).
  *   **Trans-empirical Reach** (required by the Autonomy Condition) notes that math fits the quantum and cosmological scales—realms utterly alien to human evolution.
  *   **The Conflict:** If math is just how humans pattern-match (Naturalism), it shouldn't work on quarks. If it works on quarks (Reach), it suggests math exists independently of human cognition. You generally have to sacrifice the purity of one to save the other.

  **The Killer Requirement**
  The single requirement that does the most work is **The Surplus Condition** (Unreasonable vs. Effective).
  *   **Why:** It instantly rules out the most popular "deflationary" answer: *Instrumentalism*. The Instrumentalist says, "Math works because we define it to work." The Surplus Condition replies, "Then why did Dirac's math work on data he couldn't define?" It forces the explanation to account for the *excess* predictive power. If an account cannot explain the surplus, it is merely describing bookkeeping, not physics.

  ***

  ### The Scorecard (One-Liners)

  *   **Platonism:** Solves Autonomy, fails Selectivity (why is so much math useless?).
  *   **Empiricism:** Solves Selectivity, fails Autonomy (cannot explain prediction).
  *   **Evolutionary Psychology:** Solves Cognitive Access (sort of), fails Trans-empirical Reach (why does it work on quarks?).
  *   **Formalism:** Solves Consistency, fails Meaning (why does syntax map to ontology?).
  *   **Pythagoreanism:** Solves The Fit, fails The Fizzles (why does elegant math ever fail?).
