answer: |-
  **BUREAU OF ORTHOGRAPHIC STANDARDS**
  **Standing Committee on Orthographic Integrity**
  **Bulletin Ref:** SCOI-99/α
  **Date:** 14 October 2023
  **Subject:** DETERMINATION OF ESSENTIAL FORM: LOWER-CASE LATIN 'a'

  **1. Statement of Purpose and Jurisdiction**
  Pursuant to the Mandate of 1998 on Glyphic Stability, the Standing Committee on Orthographic Integrity (the Committee) hereby publishes the findings of its fifteen-year inquiry into the ontological status of the lower-case Latin 'a'. The Committee's jurisdiction extends to all printed, digital, and inscribed matter falling under the Standard English Orthographic Zone. The objective of this bulletin is not to prescribe style, but to isolate the invariant spirit of the letterform—the *a-ness*—distinct from the accidental properties of typeface, weight, or medium. It is the Committee's position that without a certified essence, orthographic coherence is administratively unenforceable.

  **2. The Certified Essence**
  Following extensive consultation with foundries, linguists, and surveyors of public signage, the Committee certifies the essence of the lower-case 'a' as the **Dual-Chamber Topology**. To qualify as an 'a', a glyph must exhibit:
  (i) A primary closed counter (the eye);
  (ii) A secondary open bowl (the arm);
  (iii) A continuous stroke connecting the apex of the arm to the base of the stem without angular interruption exceeding 15 degrees.

  This definition privileges the double-storey form found in traditional serif faces. The single-storey form (commonly found in geometric sans-serifs) is classified as a 'Stress-Induced Variant', permissible only where spatial constraints reduce the x-height below 6 points or within italicised streams where velocity vectors justify simplification.

  **3. Conformity-Assessment Procedure**
  Compliance is to be measured using the **Typometric Fidelity Coefficient (TFC)**. The TFC is a quantitative instrument calibrated to measure the semantic weight of a glyph relative to its topological accuracy. A TFC score of 1.0 indicates perfect orthographic integrity. Scores below 0.85 constitute a breach of Standard English. The instrument adjusts automatically for stylistic drift, ensuring that a letter is judged not merely by its ink coverage, but by its intent to signify phonemic value /æ/ or /ɑː/. Operators are advised that the TFC measures the spirit of the form; visible deviations may be tolerated if the TFC confirms underlying loyalty to the Dual-Chamber Topology.

  **4. Adjudications of Hard Cases**
  The Committee applied the TFC to the following contested forms:

  *   **Case A (Geometric Sans-Serif):** A single-storey 'a' in an upright weight at 12-point size.
      *   *Ruling:* Non-Compliant.
      *   *Reasoning:* While visually legible, the absence of the primary closed counter violates the Dual-Chamber Topology. The glyph is authorised for use only in signage where viewing distance exceeds 50 metres, pursuant to the Legibility Exemption Clause.

  *   **Case B (Uncial Script):** A historical form lacking a distinct stem, resembling a rounded 'd'.
      *   *Ruling:* Non-Compliant.
      *   *Reasoning:* Historical precedence does not confer current orthographic citizenship. The glyph is classified as an 'Ancestral Artefact'. Usage in contemporary documents constitutes a misleading representation of the Latin alphabet.

  *   **Case C (Cyrillic 'а'):** A glyph visually indistinguishable from the Latin single-storey 'a'.
      *   *Ruling:* Compliant Shape, Non-Compliant Context.
      *   *Reasoning:* The form satisfies the topological checklist for a Stress-Induced Variant. However, the TFC detected an absence of Latin Contextual Field. The Committee rules that shape is necessary but insufficient; the letter must reside within a recognised Latin syntax to function as an 'a'.

  *   **Case D (Corporate Logomark):** A stylized graphic resembling a double-storey 'a' but used to denote a technology firm.
      *   *Ruling:* Non-Compliant.
      *   *Reasoning:* The glyph passed the topological checklist with a TFC of 0.92. However, it failed the 'Linguistic Intent' protocol. A mark that signifies a brand rather than a phoneme cannot be licensed as orthography, regardless of geometric accuracy.

  **5. Statement of Dissent**
  During the consultation phase, Dr. E. Vane, Fellow of Semiotic Studies, submitted the following objection:
  *"To define the letter by its shape is to confuse the vessel with the wine. You are legislating geometry where you should be legislating usage. By certifying the essence, you have not found the letter; you have merely built a cage and invited the letter to die inside it."*
  The Committee notes this submission for the record.

  **6. Forthcoming Business**
  The Committee now turns its attention to the lower-case 'g'. Preliminary scans indicate the existence of both single-storey and double-storey variants in widespread use, with no clear historical hierarchy to adjudicate between them. It is the Chair's view that the Typometric Fidelity Coefficient may lack the resolution required to isolate the essence of the 'g' without fracturing the current framework. Stakeholders are advised that the Bureau's statutory powers regarding duality may be exceeded by this inquiry. Further bulletins will be issued pending legal review.

  **Issued by the Standing Committee on Orthographic Integrity.**
  *This document supersedes all previous guidance on glyphic identity.*
