  ### Tier 1: Handled Cleanly
  *   **The current emperor of Brazil is tall** — Correctly predicts falsity due to non-existence without requiring truth-value gaps.
  *   **The tallest building in the city is the building my dentist works in** — Standard case of unique existence and successful predication.
  *   **The round square is round** — Correctly predicts falsity since no object satisfies the existence condition.
  *   **The last digit of pi is 7** — Correctly predicts falsity as the existence condition fails for infinite series.

  ### Tier 2: Needs Patches (Core Idea Survives)
  *   **The cat is on the mat** — Requires contextual domain restriction to satisfy the uniqueness condition.
  *   **The table is covered in books (there are four tables in the room)** — Requires contextual domain restriction to satisfy the uniqueness condition.
  *   **A man walked in, and the man was wearing a hat** — Requires dynamic binding or E-type pronoun analysis for anaphora.
  *   **Maya thinks the person at the door is her brother...** — Requires scope distinction (*de dicto* vs *de re*) to resolve opacity.
  *   **The number of provinces in this country could have been larger** — Requires narrow scope reading under the modal operator to capture intuition.

  ### Tier 3: Genuine Trouble (Something Has to Give)
  *   **The average voter is 45 years old** — No individual exists satisfying the description, yet the sentence is intuitively true.
  *   **The dragon in my novel is lonely** — Requires fictional ontology or pretense operators outside standard quantification.

  ***

  ### 1. Impact of Contextually Restricted Domains
  **"The cat"** and **"The table"** move from **Tier 2 to Tier 1**.
  *Justification:* Uniqueness is satisfied within the restricted situation (e.g., "in this room"), removing the need for a semantic patch.

  ### 2. Category Mistakes (Wrong Tool for the Job)
  *   **"The average voter"**: Functions as a **statistical generic**, not a singular proposition about an object.
  *   **"The dragon in my novel"**: Functions within a **pretense or fiction operator**, not actual-world quantification.
  *   **"The last digit of pi"**: Conceptually incoherent description (mathematical necessity) rather than contingent non-existence.

  ### 3. Contentious Cases (Reasonable Disagreement)
  *   **"The round square"**: **Meinongians** argue it has being and is round (Tier 1), while **Russellians** say it doesn't exist and is false (Tier 1/3 boundary).
  *   **"The cat" / "The table"**: **Semantic Minimalists** say uniqueness is semantic (Tier 3 fail), while **Contextualists** say pragmatic (Tier 1 pass).
  *   **"The dragon"**: **Fictional Realists** say true-in-fiction (Tier 1 within operator), while **Error Theorists** say strictly false (Tier 1 Russell).
