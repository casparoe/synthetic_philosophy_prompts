answer: |-
  Friends, neighbors, historians, and members of this fellowship:

  Two hundred years is a long time. It is long enough for a building to settle, for the paint to crack, and for a portrait to become part of the wallpaper. We look up at the vestry wall, and we see Isaac Newton. We see the wig, the heavy brow, the eyes that seem to be looking past us, toward the far edges of the solar system. For two centuries, he has watched us sing, he has watched us argue over the heating bill, and he has watched us bury one another.

  It is fitting that he is here. This congregation was born of the Enlightenment's long shadow, a child of reason and conscience. But as we mark our bicentennial, we must be honest about the guest we have invited to the party. We must be honest about the portrait.

  If we were to summon Sir Isaac from the dead and ask him to take a seat in the third pew, he would not be comfortable. If we asked him to sign our statement of principles, he would likely refuse. And if we asked him what he thought of this congregation—this small, creedless, independent body—he would not offer us a blessing.

  We know this, because we know his mind. Newton was a devout man, but he was not an orthodox one. He rejected the Trinity. He believed that the doctrine of the Father, Son, and Holy Spirit as co-equal persons was a corruption, a fourth-century error that had infected the Church. He believed in one God, the Father Almighty. On that, he and we might nod in agreement.

  But there the agreement ends.

  Newton did not publish his theological views. He wrote millions of words on prophecy, on the Temple of Solomon, on the corruption of the Church, but he kept them locked away. He feared the stigma of heresy. He held the Lucasian Chair at Cambridge; he valued his position; and he knew that to speak openly was to invite ruin. So he remained within the Church of England, taking communion, conforming outwardly while dissenting inwardly.

  More importantly, Newton did not believe that the true Church could be found in buildings like this. He believed in the Great Apostasy. He thought the corruption of Christianity was foretold in scripture, that the true faith had been lost, and that the proliferation of sects and schisms was not a sign of health, but a symptom of the end times. To Newton, a small, independent congregation claiming liberty of conscience would not look like a beacon of freedom. It would look like another fragment of the broken vessel. It would look like a symptom of the disease.

  So, we face a choice. There are two easy ways to handle this tension.

  The first is to claim him. To say, "Well, he was essentially one of us. He valued reason, he doubted dogma, he would have loved our coffee hour." This is a lie. He was not a liberal Christian. He was a prophet of the apocalypse who happened to discover gravity. He did not value liberty of conscience as a civic virtue; he valued truth as a cosmic imperative. He would not have joined us.

  The second easy way is to take the portrait down. To say, "He thought we were a mistake, so we should not honor him. Let us hang a picture of someone who actually liked us." But this is cowardly. It suggests that we can only honor those who agree with us. It suggests that our history must be a hall of mirrors, reflecting only our own face back to us.

  We will do neither. We will keep the portrait. And we will keep the truth.

  We keep it because there is a deeper kinship between this man and this congregation than mere agreement. The kinship is in the struggle.

  Newton lived in a time when to think freely was to risk everything. He navigated a narrow path between silence and exile. He chose silence. We, two hundred years later, stand on the ground that men like him cleared, often without intending to. The freedom we enjoy to be creedless, to question, to gather without a litmus test—this was purchased by the intellectual labor of giants who often could not admit what they were doing.

  We do not honor Newton because he would have been a member. We honor him because he was a witness to the cost of integrity.

  Look at his eyes in that painting. They are not the eyes of a man at rest. They are the eyes of a man who carried a heavy burden. He saw a universe of magnificent order, governed by mathematical law, and he saw a Church of magnificent disorder, governed by political compromise. He spent his life trying to reconcile them. He failed, in his own estimation. He died feeling that he had only picked up a few smooth pebbles on the shore of a great ocean of truth.

  What can a body like ours take from a man who thought bodies like ours were a mistake?

  We take the courage to prioritize truth over comfort. Newton was willing to be alone in his mind, even if he could not be alone in his church. He refused to let the Trinity stand, even if he had to let it stand in silence. We, in this room, have chosen to make that silence public. We have chosen to say that conscience is higher than creed. In doing so, we are finishing the sentence he began but could not speak.

  We also take a warning. Newton's theology was consumed by prophecy. He looked for the end of the world. He looked for signs. There is a temptation for a congregation like ours, small and proud of its intellect, to become obsessed with being right. We can become so focused on our own purity, our own "enlightened" views, that we forget the messy business of love and community. Newton, in his solitude, was often cold. He had enemies. He was consumed by priority disputes and alchemical secrets. We must not emulate the isolation. We must emulate the inquiry, but temper it with the warmth that only a community can provide.

  There is a specific honesty required of us today. We are not the Church Newton wanted. He wanted a restored, primitive Christianity, purified of idolatry. We are a modern fellowship, built on the right of the individual soul to seek God without interference. He would call this fragmentation. We call it freedom.

  But perhaps, in a way he could not foresee, our existence is a testament to the very God he worshipped. Newton believed in a God of Order. He believed that truth was one. He might have been dismayed by the multitude of sects, but he would have recognized the hunger that drives them. The hunger to know. The hunger to be honest.

  When we look at that portrait, we should not see a mascot. We should see a challenge.

  The challenge is this: Are we as serious about our faith as he was about his? He spent more time writing about theology than he did about physics. We often spend more time writing about our budgets than our beliefs. He searched the scriptures night and day. Do we search our consciences with the same intensity?

  He kept his views private to protect his place in the world. We keep our doors open to invite the world in. That is the difference. He was a fortress; we are a hearth. But the fire burning in both is the same. It is the refusal to accept a lie, even a comfortable, holy lie.

  So, let the portrait stay. Let it hang there in the vestry, watching us. Let it remind the historians in the back that we know who he was, and we know who we are. We are not claiming him. We are acknowledging him.

  We acknowledge that we stand on the shoulders of a man who could not stand fully upright in his own time. We acknowledge that our freedom is built on his silence. And we acknowledge that while he may have counted us among the symptoms of the disease, we believe we are part of the cure.

  The cure for what? For the idea that faith requires the surrender of the mind. For the idea that God is small enough to be captured in a creed. Newton knew God was not small. He knew the universe was vast. He knew the history of the Church was complex. He would not have signed our guest book. But he would have respected the search.

  As we enter our next two hundred years, let us carry that respect. Let us be a people who are not afraid of difficult questions. Let us be a people who do not require our heroes to be perfect, or even to agree with us. Let us be a people who can hang a portrait of a man who thought we were a mistake, and say, "We love you anyway, because you taught us how to think."

  Newton wrote, in the *General Scholium*, that this most beautiful system of the sun, planets, and comets, could only proceed from the counsel and dominion of an intelligent and powerful Being. He saw the divine in the mechanics of the heavens. We, in this room, try to see the divine in the mechanics of the human heart.

  He looked up. We look around. But we are looking for the same Light.

  So let the portrait remain. Not as an endorsement, but as a testament. A testament to the long, difficult, often lonely road that leads from dogma to conscience. He walked the first miles in the dark. We walk the later miles in the light he helped to kindle.

  Happy bicentennial to us all. And thank you, Sir Isaac, for watching over us, even if you do not quite approve. We will try to be worthy of the space you occupy.

  Amen.
