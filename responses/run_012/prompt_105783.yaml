prompt: |-
  ok so for english class we get to pick any book off project gutenberg that's "important" and write about it, and I picked William James's Principles of Psychology because my older sister said it's the book that invented psychology as a science in America, and I thought that would be easy. It is not easy.

  Here's the part from chapter 7 (I'm copy-pasting from the Gutenberg version so I don't mess it up):

  To the psychologist, then, the minds he studies are objects, in a world of other objects. Even when he introspectively analyzes his own mind, and tells what he finds there, he talks about it in an objective way. He says, for instance, that under certain circumstances the color gray appears to him green, and calls the appearance an illusion. This implies that he compares two objects, a real color seen under conditions, and a mental perception which he believes to represent it, and that he declares the relation between them to be of a certain kind. In making this critical judgment, the psychologist stands as much outside of the perception which he criticises as he does of the color. Both are his objects.

  And then a bit later he draws this diagram that he says contains "the irreducible data of psychology," with four squares, and says the psychologist "believes Nos. 2, 3, and 4, which together form his total object, to be realities, and reports them and their mutual relations as truly as he can without troubling himself with the puzzle of how he can report them at all." He also says psychology "assumes as its data (1) thoughts and feelings, and (2) a physical world in time and space with which they coexist and which (3) they know."

  My problem is this. My whole reason for picking this book was that I wanted to understand how introspection is supposed to work, and James is supposed to be the guy who said introspection is the thing we have to rely on first and foremost, basically always, like it's the main method. But in the passage above he's saying that even when you introspect your own mind you're treating it like an object, you're standing outside it, you're comparing it to something else. That sounds like the opposite of introspection to me. If I have to stand outside my own experience to check it, what's left that's actually doing the checking? And when he says he doesn't trouble himself "with the puzzle of how he can report them at all," is he just dodging the hard question or is there a reason a psychologist is allowed to dodge it?

  Also the gray-looks-green example bugs me. He says the psychologist calls it an illusion, which means the psychologist already knows the real color. But how does he know, if all he's got is what appears? It feels like he snuck in a fact from outside the mind and then used it to grade the mind.

  Could you help me get what this passage is actually doing? I want:

  - Plain-English paraphrase: like 3-4 sentences, just say what he's claiming in normal words.
  - Why he says it: a paragraph on what problem this "minds are objects" move is supposed to solve for him, and why he'd bother saying it before he's even told us the methods.
  - The tension I think I found: a paragraph on whether the "stand outside it" thing actually conflicts with him treating introspection as the main method, or whether I'm misreading one of the two bits, and if it's a real tension, which one he'd give up.
  - The gray/green case: a short bit, like half a paragraph, on whether his calling it an illusion presupposes something he said he wasn't going to presuppose, and what he'd say back.
  - What's still unclear to me: 2-3 sentences, and please don't pretend everything got resolved, just tell me the one question I should keep in my pocket for the rest of the book.

  Try not to use too much jargon without explaining it, I'm in 11th grade and Kant has already hurt me once this semester.
