answer: |-
  You have identified a specific and pervasive rhetorical maneuver. You are right to feel that "persuasive definition" and "essentially contested concepts" are close but miss the mark. A persuasive definition usually keeps the descriptive meaning stable while altering the emotional weight. An essentially contested concept explains why people fight over a term, but not how a single speaker shifts its meaning mid-argument to evade critique.

  The phenomenon you are describing is best understood as **Strategic Equivocation operating within a Motte-and-Bailey structure.**

  However, since you asked for a "carving" rather than just a label, I will break down the anatomy of this move, what distinguishes it from similar fallacies, and the underlying logic that makes it work.

  ### 1. The Anatomy of the Switch
  The move relies on an ambiguity in the possessive adjective "Western" (or "Judeo-Christian," etc.). In English, the possessive can denote **origin** or **ownership/essence**. The speaker toggles between these two meanings depending on whether they are defending the term or wielding it.

  *   **Mode A (The Defensive/Historical Claim):** Here, "Western" is *genealogical*. It means "originating in the geographic/cultural West."
      *   *Function:* To deflect charges of racism or exclusivity.
      *   *Logic:* "We aren't saying others *can't* have democracy; we are just saying the specific institutional package we use was historically assembled here."
      *   *Status:* Falsifiable, relatively neutral, low stakes.
  *   **Mode B (The Offensive/Cultural Claim):** Here, "Western" is *ontological*. It means "intrinsic to the identity of the West and incompatible with others."
      *   *Function:* To draw boundaries, exclude immigrants, or frame geopolitical conflict as cultural war.
      *   *Logic:* "These values are part of *our* fabric; if you come from *there*, you inherently threaten *this*."
      *   *Status:* Normative, exclusionary, high stakes.

  The "slide" you observe is the unannounced transition from Mode A to Mode B. When challenged on Mode B (the exclusionary claim), they retreat to Mode A (the historical claim). When the heat is off, they slide back to Mode B.

  ### 2. The Formal Structure: Motte-and-Bailey
  This tactical structure was coined by philosopher Nicholas Shackel (2005), borrowing from medieval fortification.
  *   **The Motte (The Stone Keep):** The defensible, boring, hard-to-attack position. ("Western values just refers to the historical institutionalization of democracy in Europe.")
  *   **The Bailey (The Courtyard):** The lucrative, controversial, expansive position. ("Immigrants from non-Western cultures threaten our way of life.")

  The speaker lives in the Bailey (making exclusionary claims) but retreats to the Motte (historical technicalities) when attacked. Once the attack subsides, they return to the Bailey as if nothing happened. This is not merely changing one's mind; it is using the safety of the Motte to protect the aggression of the Bailey.

  ### 3. The Deeper Logic: Possessive Universalism
  To understand *why* this works, we need to look at the philosophical contradiction being exploited. I call this **Possessive Universalism**.

  *   **Universalism:** Values like free speech or democracy are claimed to be *universal goods*. They are supposedly good for everyone, everywhere.
  *   **Possessiveness:** The speaker claims these universal goods are the *property* of a specific group.

  If the values are truly universal, no one can "threaten" them by arriving from elsewhere; in fact, their adoption by others would be a victory for the values. If the values are culturally specific (particular), then the speaker cannot claim they are objectively superior, only "ours."

  The rhetorical move you spotted is the mechanism used to hide this contradiction. It allows the speaker to claim the moral high ground of Universalism ("We defend Freedom") while retaining the tribal benefits of Possessiveness ("...but only *we* really understand it, and *they* endanger it").

  ### 4. What This Is Not (The Edges)
  To sharpen the carving, it is helpful to distinguish this from similar concepts you might encounter.

  *   **It is not simple Hypocrisy:** Hypocrisy is claiming a standard for others that one does not follow oneself. This is not about behavior; it is about the *definition of the concept itself*.
  *   **It is not merely "Vagueness":** Vagueness implies a lack of precision. This is often highly precise in both modes; the precision is just *different* in each mode. It is a deliberate ambiguity, not an accidental one.
  *   **It is not an "Essentially Contested Concept" (in the Gallie sense):** Gallie's concept explains why two *different* people disagree (e.g., a liberal and a socialist arguing over "Justice"). Your observation is about a *single* speaker shifting meanings to avoid accountability.
  *   **It is not a "Persuasive Definition":** As you noted, a persuasive definition (e.g., "True patriotism means questioning authority") tries to change the emotional valence of a stable term. In your example, the *referent* changes. In Mode A, "Western Values" refers to a set of historical documents/events. In Mode B, it refers to a spiritual/cultural essence.

  ### 5. Why "Enlightenment Values" and "Judeo-Christian" Fit
  You mentioned these two terms specifically. They fit this carving perfectly because they both suffer from the **Origin/Essence Collapse**.

  *   **Enlightenment Values:**
      *   *Motte:* A specific 17th/18th-century European intellectual movement.
      *   *Bailey:* A timeless standard of rationality that "irrational" cultures lack.
  *   **Judeo-Christian:**
      *   *Motte:* A theological descriptor acknowledging the shared roots of Judaism and Christianity.
      *   *Bailey:* A cultural shibboleth used to exclude Muslims or secularists, implying that moral intuition is biologically or culturally inherited through this specific lineage.

  ### Summary for your Toolkit
  When you encounter this, you are seeing **Strategic Equivocation** protected by a **Motte-and-Bailey** structure, driven by **Possessive Universalism**.

  If you wish to challenge it, do not accept the retreat to the Motte. The most effective counter-move is to freeze the definition. You might say:

  > "If 'Western Values' is merely a historical label for where institutions started, then anyone can adopt them, and no culture 'threatens' them. If you mean they are a cultural essence that only Westerners can embody, then you are making a claim about racial or cultural superiority, not history. Which claim are you making?"

  This forces the speaker to choose between being irrelevant (Mode A) or being overtly exclusionary (Mode B), removing the cover that the slide provides.
