answer: |-
  This is a remarkably clear map of a very difficult terrain. You have correctly identified that standard Utilitarianism fails your test (it passes 6 and 7, fails 2 and 4) and that standard Deontology struggles with 5 and 6 (it often forbids aggregating even small costs for vital benefits).

  Your "Boundary Reading" is close, but as you noticed, it lacks a metric for *scale*. It explains why you can't push the man (he is the tool), but not why you can't tax the million for the car (they are not tools, just wallets).

  Here is the best version of a principle that captures your specific pattern of verdicts, followed by the necessary sacrifice, the new cases, and the verdict on "Doing/Allowing."

  ### The Principle: Constrained Aggregation with Vital Thresholds

  **Statement:**
  > You may aggregate costs and benefits across different people **if and only if**:
  > 1.  **Non-Instrumentalization:** No specific individual is used as the *means* or *mechanism* by which the benefit is achieved (their body/life is not the resource).
  > 2.  **Vital Threshold:** The benefit conferred is a *vital interest* (life, health, basic liberty) that outweighs the *non-vital* burdens imposed on others.
  > 3.  **Collateral Permission:** Harms that are foreseen side-effects of a policy are permissible if they are not *targeted* at specific individuals to solve the problem, even if the statistical outcome is death.

  **How it maps to your verdicts:**
  *   **(1) Intrapersonal:** Passes. (Prudence is sovereign).
  *   **(2) Interpersonal Agony:** Fails Clause 2. Agony is a vital burden; bliss is not sufficiently vital to override bodily autonomy without consent.
  *   **(3) Trolley:** Passes Clause 1 & 3. The one is not the *mechanism* (the switch is); their death is a side effect, not the method of stopping.
  *   **(4) Footbridge:** Fails Clause 1. The bystander *is* the mechanism (the brake).
  *   **(5) Pollution:** Passes Clause 3. The three are collateral damage of a policy, not selected sacrifices. (This is the most controversial clause, but it matches your intuition).
  *   **(6) Surgery:** Passes Clause 2. Life is a vital interest; $1 is a non-vital burden.
  *   **(7) Nice Car:** Fails Clause 2. A car is not a vital interest; therefore, you cannot aggregate even trivial costs to provide it.

  ### The Verdict You Must Drop

  To make this principle hold, you must refine **Verdict (2)**.

  Currently, you state: *"The same trade across two people... not fine, even though the total is identical."*
  You need to change this to: *"Not fine **if the burden is significant/vital**."*

  **Why you must drop the absolute version:**
  If you hold absolutely that *no* interpersonal trade-off is permitted without consent, you cannot justify **(6)**. Taxing a million people $1 without their specific consent to save a stranger is an interpersonal trade-off. It violates their property rights for another's benefit.
  If (6) is "Fine" (as you say), then the objection to (2) cannot be "interpersonal trade" itself. It must be the **severity of the burden**.

  **Is this defensible?**
  Yes. It aligns with the "Separateness of Persons" without making society impossible. The objection to Utilitarianism isn't that we can never count across people (we do it in voting, taxation, and law); it's that we cannot treat a person's *fundamental rights* as disposable chips in a calculus. Distinguish between **impositions** (taxes, risks, minor inconveniences) and **sacrifices** (agony, loss of liberty, death). Your principle allows impositions for vital gains; it forbids sacrifices for non-vital gains.

  ### Predictions on Your Undecided Cases

  **(a) The Lethal Lottery**
  *Scenario:* A lottery kills one random person a year to save fifty. Everyone knows the odds and enters voluntarily.
  *   **Analysis:** This tests the limit of Consent vs. Instrumentalization.
      *   *Argument for Fine:* It satisfies consent (ex-ante). It turns the interpersonal trade into a voluntary risk, mimicking (1).
      *   *Argument for Not Fine:* The person who loses the lottery is still being used as the *mechanism* of safety for the other 50. Their death is the *price* paid, not just a side effect.
  *   **Prediction:** **Not Fine.**
      *   *Reasoning:* Under Clause 1 (Non-Instrumentalization), the victim is still the resource. Consent to a *risk* is valid; consent to be *sacrificed* is morally suspect in this framework. You cannot validly consent to become a means to others' ends, because that violates the boundary of your personhood that the "Separateness" objection is trying to protect. The lottery institutionalizes the Footbridge case; it just selects the victim by dice instead of by hand.

  **(b) Forced Conscription for Self-Benefit**
  *Scenario:* Conscripting someone for a war that will mostly benefit them, at a personal price they'd never accept.
  *   **Analysis:** This tests Paternalism vs. Separateness.
  *   **Prediction:** **Not Fine.**
      *   *Reasoning:* This violates the core of the "Separateness" insight. Even if the math works *within* their life (Benefit > Cost), *they* are the only one authorized to make that trade. As you noted in (1), intrapersonal trade-offs are the domain of prudence. Forcing prudence on someone treats them as a vessel for value rather than a creator of value. It collapses the distinction between (1) and (2). If you allow this, you admit that the state owns the individual's life calculus, which destroys the "separate person" boundary entirely.

  ### Is "Separateness" just "Doing/Allowing"?

  **No.**

  If Separateness were just the Doing/Allowing distinction, your intuition on **(4)** would change when you introduce the remote control.
  *   **Doing/Allowing:** Pushing is "Doing." Letting the trolley hit the five is "Allowing."
  *   **Your Intuition:** You said even with remote control (which feels less like physical "doing"), using the bystander's body is still wrong.

  The distinction doing the work is not **Action vs. Inaction**. It is **Selection vs. Statistics**.

  *   In **(4) Footbridge**, the bystander is *selected*. Their specific properties (weight, location) are the solution. They are an agent-relative obstacle or tool.
  *   In **(5) Pollution**, the three victims are *statistical*. They are not chosen; they are just in the zone of risk. The policy is not "Kill these three to save 100." The policy is "Run the factory to save 100," and the death of three is a tragic, foreseen consequence.

  The "Separateness of Persons" objection is actually an objection to **Agency over Others**. It says: *You have sovereignty over your own trade-offs. You do not have sovereignty over mine.*
  *   Utilitarianism gives the calculator sovereignty over everyone.
  *   Your principle gives the calculator sovereignty over *policies* (5, 6), but denies them sovereignty over *specific bodies* (2, 4, 7).

  **Summary:** Keep your "Boundary Reading," but add the **Vital Threshold** clause to solve case (7). Accept that you are allowing some interpersonal aggregation (taxation/risk) but drawing the line at *sacrifice* and *instrumentalization*. This preserves the spirit of the "Separateness" objection without making social cooperation impossible.
