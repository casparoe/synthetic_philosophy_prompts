  # JOINT STATEMENT ON MORAL RESPONSIBILITY AND REACTIVE ATTITUDES

  **Signed:**  
  [The Strawsonian]  
  [The Responsibility Skeptic]  
  **Date:** October 26, 2023

  ### 1. Agreed Claims

  We, the undersigned, having engaged in sustained adversarial collaboration, affirm the following claims as common ground. Each claim is intended to rule out specific misunderstandings or caricatures of our respective positions.

  1.  **Nature of the Attitudes:** We agree that the "reactive attitudes" (resentment, indignation, guilt, gratitude, and moral gratitude) are not merely intellectual judgments that an norm has been violated, but are essentially emotional and behavioral dispositions that demand a certain quality of will from others. We rule out the view that these attitudes are purely cognitive assessments detachable from emotional engagement.
  2.  **Scope of Disagreement:** We agree that our disagreement is not about whether human beings *currently* possess these attitudes (we both accept that we do), nor is it about whether determinism is true (we both accept that causal determination of action is compatible with the psychological experience of choice). We rule out the claim that the skeptic denies the phenomenology of responsibility, or that the Strawsonian denies the causal history of action.
  3.  **Conditions for Vindication:**
      *   The Strawsonian is vindicated if it is shown that the demand for an external, metaphysical justification of the reactive attitudes is incoherent, or that abandoning these attitudes would constitute a loss of something essential to human interpersonal relationships.
      *   The Skeptic is vindicated if it is shown that the reactive attitudes rest on a demonstrably false belief in "ultimate origination" and that retaining them involves a form of systematic irrationality or injustice.
      *   We rule out the claim that empirical neuroscience alone can settle the normative status of these attitudes without philosophical interpretation.
  4.  **Conditions for Refutation:**
      *   The Strawsonian position is refuted if it is demonstrated that the reactive attitudes can be globally suspended without the collapse of meaningful interpersonal relationships, or if a coherent external standard of justice is produced that contradicts our current practices.
      *   The Skeptic position is refuted if it is demonstrated that the skeptic cannot consistently live without employing reactive attitudes in their own life, or if the concept of "blameworthiness" is shown to have no dependence on metaphysical freedom.
  5.  **Concessions:**
      *   The Strawsonian concedes that the reactive attitudes are not immune to moral critique; they can be excessive, misdirected, or harmful, and the practice of responsibility must be modulated by considerations of fairness and welfare. We rule out the view that "natural" implies "morally optimal."
      *   The Skeptic concedes that the immediate, global abolition of reactive attitudes is likely impossible for creatures like us and might lead to social disintegration. We rule out the view that the skeptic advocates for an immediate revolution in personal psychology.

  ### 2. The Residual Disagreement

  Despite our agreement on the facts of human psychology, we remain divided on the interpretation and normative status of those facts. The following table isolates the precise points of divergence.

  | Issue | The Strawsonian Position | The Responsibility Skeptic Position |
  | :--- | :--- | :--- |
  | **Metaphysical Justification** | The demand for a justification of our responsibility practices from "outside" the practices themselves is illegitimate. The practices are self-justifying insofar as they constitute the framework of human social life. | The reactive attitudes implicitly assert a metaphysical claim about the agent's power to have done otherwise. Since this claim is false, the attitudes rest on an error, regardless of their utility. |
  | **Status of Blameworthiness** | To be blameworthy *just is* to be an appropriate target of the reactive attitudes within the human practice. There is no further fact of the matter. | No one is ever blameworthy in the sense required to license genuine moral anger or retributive punishment. The property of blameworthiness is empty. |
  | **Justification of Blame** | Blame is justified when it expresses a legitimate demand for goodwill within a relationship, provided the agent was not incapacitated. | Blame is never morally justified because it treats the agent as an ultimate originator of wrong, which they are not. |
  | **Abandonability** | We *cannot* wholly abandon the reactive attitudes without ceasing to participate in ordinary interpersonal relationships as we understand them. It is not a live option. | We *could* theoretically live without these attitudes (adopting an "objective attitude" universally), and we *should* strive to mitigate them, even if total abolition is currently beyond our reach. |
  | **Scope of Skeptic's Claims** | *N/A* | The Skeptic distinguishes between: <br>1. **Descriptive:** Blameworthiness is incoherent. <br>2. **Normative:** We ought not to blame. <br>3. **Practical:** We can live without blame. <br>*(The Skeptic may abandon claim 3 without abandoning 1 or 2.)* |

  ### 3. Cruxes

  We identify the following sub-questions as critical pivot points. Settling these would not necessarily end the debate, but it would require one or both of us to significantly adjust our confidence or predictions.

  | Crux | Agreed Evidence / Case | Strawsonian Prediction | Skeptic Prediction |
  | :--- | :--- | :--- | :--- |
  | **(a) Asymmetry of Praise and Blame** | **Case:** Phenomenological reports suggest resentment is more intense and demanding than gratitude. <br>**Question:** Does responsibility require symmetry between praise and blame? | The asymmetry is pragmatic, not metaphysical. Both are part of the same fabric of holding one another to standards. If blame is legitimate, praise is too. | The asymmetry reveals that blame is punitive and requires desert, whereas praise is often merely celebratory. The injustice lies in blame, even if praise is harmless. |
  | **(b) Localized Suspension** | **Case:** We naturally suspend resentment toward the very young, the insane, or those under coercion. <br>**Question:** Does local suspension imply global suspension is possible? | Local suspension proves the practice is sensitive to *quality of will*, not causation. It reinforces the practice by defining its boundaries. It does not open the door to global suspension. | Local suspension admits that causal determination (e.g., psychosis) undermines responsibility. If causation excuses locally, it should excuse globally. The distinction is arbitrary. |
  | **(c) Lesion and Deprivation** | **Case:** A violent act is fully explained by a brain tumor or severe childhood abuse. <br>**Question:** Does this explanation remove blameworthiness, and does it generalize? | This is an exception that proves the rule. It removes blameworthiness because it removes the evidence of ill will. Normal agents without lesions remain responsible. | This reveals the truth about *all* agents. The tumor is just a visible cause; normal agents have invisible causal histories. The verdict should generalize to all. |
  | **(d) Skeptic's Own Attitudes** | **Case:** The Skeptic reports feeling resentment when wronged personally. <br>**Question:** Is this evidence for the Strawsonian? | Yes. This proves the attitudes are inescapable features of human nature, vindicating the view that they are constitutive of our form of life. | No. This proves only that we are cognitively trapped in an illusion. A belief can be inescapable but still false (e.g., perceptual illusions). |

  ### 4. Verbal and Substantive

  In closing, we distinguish between those aspects of our dispute that are verbal and those that are substantive.

  **Verbal Disputes:**
  A portion of our disagreement turns on the definition of "responsibility."
  *   When the **Strawsonian** says "X is responsible," they mean "X is an appropriate participant in the network of reactive attitudes."
  *   When the **Skeptic** says "X is responsible," they mean "X possesses a metaphysical capacity for ultimate origination that makes desert possible."
  *   *Resolution:* We acknowledge that if we restrict the conversation to the Strawsonian definition, the Skeptic has no objection to the *existence* of the practice, only its *truth-claims*. If we restrict it to the Skeptic's definition, the Strawsonian agrees no one is responsible. This is a semantic stalemate that does not resolve the normative conflict.

  **Substantive Disputes:**
  The core disagreement is not merely linguistic but concerns how we ought to live and judge.
  *   **Normative Force:** The Skeptic maintains that even if we cannot stop feeling resentment, we ought to regard it as morally problematic and minimize its expression in law and policy. The Strawsonian maintains that regarding resentment as inherently problematic is itself a moral error that undermines the mutual respect inherent in holding one another accountable.
  *   **Human Flourishing:** We disagree on whether a life stripped of the belief in desert would be impoverished (Strawsonian) or liberated (Skeptic). This is a substantive claim about human psychology and ethics that remains unresolved.

  We sign this statement to record that while we have clarified the geometry of our disagreement, the fundamental tension between the *naturalness* of our practices and the *truth* of our metaphysics remains intact.
