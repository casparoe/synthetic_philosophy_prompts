  2.  **Deconstruct the Text (NE V.10, 1137b29-33):**
      *   *Context:* The discussion of *epieikeia* (equity/decency) correcting the law (*nomos*).
      *   *The Problem:* Law is universal (*katholou*), but some things cannot be spoken of universally (*ouk endechetai katholou orthos eipein*).
      *   *The Cause:* The defect is not in the law or lawgiver, but in the "nature of the thing" (*tou pragmatos he physis*). The "material of conduct" (*hē hylē tōn prakton*) is irregular.
      *   *The Analogy:* Leaden rule used by Lesbian builders. It is not rigid (*ouk empedos*), but flexible (*kineitai*), conforming to the shape of the stone (*pros ton lithon*).
