      *   *However:* He also says "what cannot be spoken of universally." This hints at a linguistic/epistemic limitation.
      *   *The Analogy's Role:* The stone has a specific shape (ontological reality). The rule bends to match it. If the rule were rigid (universal law), it wouldn't measure accurately.
      *   *Synthesis:* For Aristotle, these aren't mutually exclusive. The *physis* of action is such that it resists universal codification. The ambiguity isn't a contradiction but a reflection of his hylomorphism. The "matter" (*hylē*) of action is variable.
      *   *Verdict:* The analogy leans towards the ontological (the stone *is* irregular), which *causes* the linguistic failure. It's not just that we *can't* predict; it's that the reality *is* indeterminate.

  4.  **Address Question 2: Particularism vs. Generalism:**
      *   *Contemporary Definitions:*
