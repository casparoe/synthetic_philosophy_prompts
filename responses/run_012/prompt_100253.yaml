  Summary
  Reject Step (6). This step erroneously equates the moral equality of persons with equal weighting of von Neumann-Morgenstern (vNM) utility functions. vNM utilities represent preference structures, including risk attitudes, not comparable welfare magnitudes. Assigning equal weights to these functions privileges specific risk profiles rather than respecting persons equally. You can affirm moral equality without accepting that social welfare is the unweighted sum of vNM indices.

  Why that step looked innocent
  Step (6) exploits a powerful linguistic and mathematical intuition. In ordinary moral discourse, "equal consideration" implies that everyone's interests count for one and no one counts for more than one. When translated into the algebra of social choice, this naturally suggests setting the coefficients $a_i$ to unity. Since Steps (1) through (5) establish utility as the sole currency of value, it appears that any deviation from equal weighting would arbitrarily discriminate against certain individuals. Your friend reinforces this by framing the rejection of (6) as a denial of moral equality itself, creating a false dichotomy between classical utilitarianism and elitism. It feels as though refusing the sum is refusing to count everyone.

  Furthermore, the step looks innocent because Harsanyi's own expositions often blur the line between vNM utility and cardinally comparable welfare. In many economic contexts, utilities are treated as measurable quantities of satisfaction that can be summed. If one assumes that the stipulations in Step (4) successfully render utilities comparable, then equal weighting seems like the only neutral way to aggregate them. The mathematical form $W = \sum u_i$ looks like a direct transcription of the ethical principle of impartiality. Because the previous steps establish a rigorous formal framework, this ethical insertion appears to be a harmless, indeed necessary, specification of the weights rather than a substantive ethical assumption. It masks the leap from formal preference satisfaction to substantive welfare comparison, making the conclusion seem like a mathematical inevitability rather than a controversial ethical choice.

  What rejecting it costs
  Rejecting (6) requires you to accept that moral equality does not dictate equal weights on vNM functions. You must acknowledge that these functions encode risk attitudes; summing them equally privileges the risk-averse over the risk-neutral. You would need an alternative method for setting weights, perhaps based on a distinct theory of welfare rather than preference strength. This costs you the simplicity of classical utilitarianism but saves you from its repugnant conclusions. You retain the formal structure but deny the specific ethical interpretation of the weights.

  Alternatively, you could reject Step (4). This admits that the vNM framework cannot support interpersonal comparisons by stipulation. The cost here is higher: you lose the ability to derive any specific weights from the theorem alone. You must import ethical premises external to preference theory to compare utility levels, acknowledging that the formal axioms are ethically incomplete. This preserves (1)-(3) but blocks the utilitarian derivation entirely, forcing you to build a separate theory of comparability.

  A third option is rejecting Step (2). Denying that society satisfies expected utility axioms allows you to value equality intrinsically, not just via diminishing marginal utility. This permits prioritarianism or egalitarianism. The cost is abandoning the elegance of expected utility theory for social choices, requiring a more complex social welfare functional. Given your attachment to (1)-(3), rejecting (6) is the least disruptive option. It keeps the formalism intact while decoupling it from the specific ethical conclusion of classical utilitarianism, allowing you to maintain moral equality without accepting that risk attitudes should determine social weights. It forces the debate onto ethical grounds where you have more room to maneuver than in the formal axioms.

  The second-best target
  Step (4) is the stronger technical objection. It claims interpersonal comparability can be fixed by stipulation within the vNM framework. This is false; vNM utilities are unique only up to positive affine transformations per individual. There is no axiom linking one person's zero or unit to another's. Accepting (4) smuggles in the comparability needed for utilitarianism without justification. Rejecting it forces your friend to defend interpersonal comparisons on ethical rather than formal grounds. It demonstrates that the theorem alone cannot generate utilitarianism without extra ethical premises that are not contained in the preference axioms. This breaks the chain before the ethical error of (6) even arises, showing that the argument relies on an impossible stipulation rather than a logical deduction. It exposes the argument as begging the question regarding comparability.

  Bottom line
  Your friend's argument fails because vNM utilities are not measures of comparable welfare. Reject Step (6) to preserve moral equality without accepting classical utilitarianism. Equal moral status does not require equal weighting of risk-adjusted preference indices. You can keep expected utility theory for individuals and society while denying that summing these specific functions maximizes the good. The theorem yields weighted utilitarianism; the move to classical utilitarianism requires unjustified ethical assumptions.
