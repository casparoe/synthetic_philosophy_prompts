answer: |-
  (a) The Essay Question

  **Final Essay: The Stability of Split Reckoning**

  In this seminar, we have distinguished between two modes of engaging with historical violence. **Representational Reckoning** refers to memory *about* the wrong: the past is narrated, musealized, commemorated, or admitted in official speech. **Structural Reckoning** refers to memory *answerable to* the wrong: the present order changes material conditions (territory, law, curriculum, resource distribution, state identity) as a condition of the memory being honest.

  Select **two** of the four cases covered in this course (Germany, Japan, Turkey, the American South). Using the distinction above, argue whether Representational Reckoning without Structural Reckoning constitutes a stable resting point for a political order, or whether it is inherently self-undermining.

  Your essay must:
  1.  Define what would count as *evidence* that a society has reached a stable equilibrium between these two modes.
  2.  Confront the hardest counterexample: a society that appears to have near-maximal Representational Reckoning but near-minimal Structural Reckoning. Does this society prove stability is possible, or does it reveal a hidden instability (e.g., cynicism, renewed conflict, performative guilt)?
  3.  Avoid treating "memory" as a single scale that simply goes from "low" to "high." You must analyze the *gap* between representation and structure.

  Do not cite specific authors or texts. Rely on your analysis of the cases and the conceptual framework provided.

  ***

  (b) Model Answer

  **The Debt of Truth: Why Representational Reckoning Cannot Rest Without Structural Change**

  A political order that admits to historical wrongs without altering the material advantages inherited from them is not resting; it is accumulating interest. While Representational Reckoning (narrative admission) and Structural Reckoning (material repair) can be analytically separated, they are politically inseparable over time. Representational Reckoning without Structural Reckoning is an unstable resting point because it creates a moral liability that the state must eventually pay or violently suppress. By comparing Germany and the American South, we see that high-level representation eventually turns into a demand for structural consequence, or else the representation itself decays into hollow performance.

  To argue that this split is stable, one would need evidence of a society where official admission of guilt coexists with unchanged power dynamics without generating significant social friction, legal challenges, or intergenerational resentment. Stability would look like a "closed file": the past is acknowledged as bad, but the present distribution of land, wealth, and citizenship is accepted as legitimate despite that past. However, this evidence is absent. Instead, we see that representation acts as a lever. Once the state admits the wrong representatively, it provides the vocabulary for marginalized groups to demand structural accountability.

  Germany is often cited as the gold standard of Representational Reckoning. The Holocaust is central to national identity, curriculum, and memorialization. However, if we look for Structural Reckoning, the picture is more complex. While reparations were paid to Israel and survivors, structural questions regarding citizenship laws (until recently) and colonial crimes (such as the Herero and Nama genocide) reveal a gap. For decades, Germany maintained high representational admission regarding the Holocaust while maintaining structural exclusions regarding citizenship for descendants of *Gastarbeiter* and denying structural reparations for colonial crimes. This split has not proven stable. Recent legal and political battles over citizenship reform and the 2021 agreement on Namibia demonstrate that the high representational standard eventually made the structural gaps untenable. The representation created a norm that the structure had to eventually match. The "resting point" was merely a pause in a longer negotiation.

  Contrast this with the American South. Here, we see a recent surge in Representational Reckoning: the removal of Confederate statues, the installation of markers detailing lynching histories, and curricular shifts. Yet, Structural Reckoning remains minimal. Land ownership patterns, voting access, and wealth disparities remain largely continuous with the Jim Crow era. Is this stable? It appears stable only if one mistakes silence for consent. The surge in representation has not inoculated the region against structural demands; it has intensified them. The representational shift has armed activists with the moral authority to demand structural change (e.g., reparations commissions). If the South were a stable example of "admission without repair," we would see a decrease in conflict following memorialization. Instead, we see increased polarization. The representation exposes the structural continuity, making it harder to defend.

  The hardest counterexample to this thesis is a society that maintains high representation and low structure without collapsing. One might argue post-war Japan fits this: there is significant domestic memory activism (Representational), yet constitutional and territorial structures remain largely unchanged regarding wartime responsibility. However, this is not stability; it is a frozen conflict. The instability manifests externally (diplomatic friction with Korea and China) and internally (the rise of revisionist politics trying to lower the representational bar). The "split" is not a resting point but a battlefield. If the structure does not change, the representation becomes a target for revisionists who argue the guilt is performative. If the representation holds, it delegitimizes the structure.

  Therefore, Representational Reckoning without Structural Reckoning is self-undermining. It functions either as a temporary delay mechanism or as a catalyst that makes the structural status quo indefensible. A society cannot fully admit what it did while leaving the distribution of advantages untouched because the admission destroys the moral legitimacy required to maintain those advantages. Truth without consequence is not a settlement; it is an accusation that refuses to go away. The only way to stabilize the memory is to either close the representation (deny the wrong) or close the structure (repair the wrong). Trying to hold the middle is a permanent state of crisis.

  ***

  (c) Marking Scheme (Out of 25)

  **Top Band (21–25): Analytical Precision & Conceptual Mastery**
  *   **The Gap Analysis:** The answer treats the distinction as a *tension* rather than a checklist. It explicitly analyzes the friction between what is said (representation) and what is done (structure).
      *   *Common Error:* Treating the two types as steps on a ladder (e.g., "Germany is further along than Turkey") rather than distinct categories that can diverge.
  *   **Handling the Counterexample:** The answer directly addresses the "Max Rep/Min Struct" scenario (e.g., Japan or specific aspects of Germany) and argues *why* it is unstable (e.g., diplomatic friction, revisionist backlash) rather than ignoring it.
      *   *Common Error:* Dismissing the counterexample as "not real memory" instead of explaining its political volatility.
  *   **Evidence of Stability:** The student defines what stability would look like (e.g., lack of conflict, acceptance of legitimacy) and demonstrates its absence.
      *   *Common Error:* Asserting instability as a moral fact ("It's just wrong") rather than a political observation ("It generates conflict").
  *   **Case Selection:** The two cases chosen allow for a non-trivial comparison (e.g., comparing two "high representation" cases to find structural differences, rather than comparing a "high" and a "low" case which makes the argument too easy).
      *   *Common Error:* Picking Germany vs. Turkey and simply ranking them on "how much they remember."
  *   **Normative vs. Descriptive:** The answer uses the distinction descriptively to analyze power, not just normatively to scold states.
      *   *Common Error:* Writing a moral indictment ("They should do better") instead of a political analysis ("This arrangement produces X outcome").

  **Middle Band (16–20): Competent but Conventional**
  *   **Use of Terms:** Uses "Representational" and "Structural" correctly but tends to collapse them back into "good memory" vs. "bad memory."
  *   **Case Knowledge:** Accurate description of the cases, but the link to the core thesis (stability) is asserted rather than proven.
  *   **Counterexample:** Mentions the counterexample but treats it as an exception rather than a test of the theory.
  *   **Argument:** Takes a position, but relies on standard literature tropes (e.g., "Germany is the model") without interrogating the structural deficits within the model.

  **Lower Band (15 and below): Summary or Moralizing**
  *   **Collapsing the Distinction:** Treats memory as a single scale of "coming to terms with the past."
  *   **Descriptive Only:** Summarizes the history of the two cases without arguing about the *relationship* between representation and structure.
  *   **Moralizing:** Argues that structural change is "better" without explaining why the *absence* of it makes the representation unstable.
  *   **Trivial Comparison:** Selects cases that make the argument obvious (e.g., comparing a dictatorship to a democracy) without engaging the nuance of democratic memory politics.

  **Specific "One-Liner" Penalties for Top Band Candidates:**
  *   *If they treat acknowledgment as a single scale:* Deduct 3 points (fails core conceptual constraint).
  *   *If they moralize instead of arguing stability:* Deduct 3 points (fails the political analysis requirement).
  *   *If they ignore the Max Rep/Min Struct counterexample:* Deduct 4 points (fails the specific prompt instruction).
  *   *If they pick two cases that make the comparison trivially easy:* Cap at 18 points (fails the comparative rigor).
