prompt: |-
  I am a novelist at work on a book in which a central character is a philosopher of language. For background I have been reading a popular book on logic, and I have come across the following passage, which I am inclined to trust but suspect is too neat:

  'David Lewis's triviality result is the reason contemporary philosophers are so wary of saying that indicative conditionals have truth conditions. The result concerns the attractive idea that the probability of "If A, then B" is simply the conditional probability of B given A. Lewis showed that if you accept this equation for every indicative conditional, you are forced to conclude that every conditional is either certainly true or certainly false. There is no room for uncertain conditionals. The only way to keep the equation is to restrict it to simple, unembedded conditionals and deny that conditionals can appear inside larger compounds; if you allow them to embed, the equation collapses. Most philosophers have responded by giving up the truth-conditional picture altogether: on the dominant view, an indicative conditional does not state a proposition at all; it expresses a high conditional probability, and its "probability" is just the conditional probability of the consequent given the antecedent. Lewis's theorem is thus the central argument for the expressivist view of conditionals.'

  The author is a philosopher writing for general readers, not a logician, and the passage is not about Lewis in detail. I am a novelist, not a philosopher, and I do not want my character to say something embarrassing in dialogue. Could you audit the paragraph? I would like to know which parts a specialist in conditionals would accept, which are popular simplifications, and which are outright mistakes. In particular: Does Lewis's result really force every conditional to be either certainly true or certainly false? Does it refute truth-conditional accounts of indicative conditionals as such, or only a particular combination of views? Does it vindicate expressivism as directly as the paragraph suggests, or is expressivism one response among several? And what exactly does the theorem show about the equation P(If A, then B) = P(B|A) when conditionals are allowed to embed inside larger sentences? Please be precise about which assumption does the work—whether conditionals are treated as propositions, whether the probability space is non-trivial, whether the class of events is closed under conditioning—and say which of those assumptions a defender of the equation would reject. Separate the accurate core from the distortions, say what a careful defender of the equation would concede and what they would resist, and tell me what would change your verdict: which argument or consideration would lead you to a different assessment of the paragraph, and where your reasoning is most likely to go wrong.
