answer: |-
  Here is the procedure. It is designed to be printed and kept on the desk. It does not solve the uncertainty; it structures the argument about it.

  # The Imprecise Probability Decision Protocol (IPDP) v1.0

  **Purpose:** To convert a set of conflicting probability distributions into a defensible recommendation for high-stakes, one-shot government decisions.
  **Users:** Deep Uncertainty Desk (3 staff).
  **Input:** A set of probability distributions (the "Set") provided by experts, and a set of policy options.

  ---

  ### Phase 1: Diagnose the Spread
  *Goal: Determine if the width of the Set is due to lack of data (Ignorance) or conflicting models (Disagreement).*

  1.  **Ask the Panel:** "If we gave you infinite data tomorrow, would your distributions converge to a single curve?"
      *   **YES:** This is **Ignorance**. The width represents missing data.
      *   **NO:** This is **Disagreement**. The width represents fundamental conflict about how the world works (e.g., different causal models).
  2.  **Pooling Rule:**
      *   If **Ignorance**: You *may* average the distributions (Linear Pooling) to find a central tendency, but you must retain the variance for risk analysis.
      *   If **Disagreement**: You **MUST NOT** average. Averaging creates a "consensus" that no expert actually holds. You must treat the Set as a **Convex Hull** (keep the full range from the most optimistic to the most pessimistic credible model).
      *   *Default for High Stakes:* Treat as Disagreement. Do not narrow the Set.

  ### Phase 2: The Irrelevance Stress Test (Dilation Check)
  *Goal: Detect if adding information is artificially inflating uncertainty.*

  1.  Identify a variable $X$ that experts claim is relevant to the outcome $Y$.
  2.  Compare the uncertainty of $Y$ (the full Set) against the uncertainty of $Y$ *given* specific values of $X$.
  3.  **The Test:** If the uncertainty interval for $Y$ becomes *wider* when you condition on $X$ than when you ignore $X$, you have **Dilation**.
  4.  **Action:** If Dilation occurs, $X$ is not adding signal; it is adding noise or model conflict. **Discard $X$** from the decision model. Proceed using the marginal uncertainty of $Y$. Do not attempt to "resolve" this with more data; it is a structural feature of the Set.

  ### Phase 3: Run the Decision Rules
  *Goal: Acknowledge that different rational rules yield different answers. Do not pick one yet.*

  Run the options through these three filters using the Set from Phase 1:

  1.  **Interval Dominance (The Sanity Check):**
      *   *Rule:* Eliminate any option that is worse than another option under *every* distribution in the Set.
      *   *Output:* A list of "Non-Dominated" options.
      *   *Note:* If only one option remains, stop and recommend it.
  2.  **Maximin (The Safety Filter):**
      *   *Rule:* For each option, find the worst-case outcome across the Set. Pick the option with the "least bad" worst-case.
      *   *Output:* The "Safe" Option.
  3.  **Minimax Regret (The Accountability Filter):**
      *   *Rule:* For each distribution in the Set, calculate how much you'd regret not picking the best option for *that* distribution. Pick the option that minimizes the maximum regret.
      *   *Output:* The "Defensible" Option.

  *(Optional: E-Admissibility. Pick any option that is optimal under at least one distribution in the Set. Use only if the Minister explicitly requests "keeping options open.")*

  ### Phase 4: The Recurrence Check
  *Goal: Prevent sequential exploitation (Money Pumps).*

  1.  **Ask:** "Will this desk make similar types of decisions repeatedly over the next 5 years?"
      *   **NO (True One-Shot):** You may present the conflicting outputs from Phase 3 as equally valid.
      *   **YES (Recurring Context):** You **MUST** select a single Decision Rule (e.g., Maximin) and apply it consistently to all future cases of this type.
      *   *Reasoning:* If you switch between Maximin and Regret based on which one favors your intuition case-by-case, a sequence of choices can be constructed that guarantees a loss (Dutch Book). Consistency is more important than optimality in recurring deep uncertainty.

  ### Phase 5: The Value Boundary (Escalation)
  *Goal: Identify where math ends and politics begins.*

  1.  Compare the outputs from Phase 3.
      *   If **Maximin** and **Minimax Regret** agree: Proceed to recommendation.
      *   If **Maximin** and **Minimax Regret** disagree: **STOP.**
  2.  **The Escalation Statement:**
      *   "The analysis does not yield a single answer because the decision depends on risk appetite, not evidence."
      *   "Option A is safer (Maximin). Option B minimizes future regret (Regret)."
      *   "Choosing between them requires weighing [Value X] against [Value Y]. This is a Ministerial decision."
  3.  **Deliverable:** Do not submit a single recommendation. Submit the **Set of Admissible Options** with the trade-off clearly labeled.

  ---

  # Case Run-Throughs

  Here is the protocol applied to your two scenarios.

  ### Case (a): Pre-emptive Release of Countermeasure
  *Context:* Drug works. Side effect rate is the variable. Two expert camps: Camp Low (0.1% severe side effects) and Camp High (15% severe side effects). Stakes: Epidemic deaths vs. Iatrogenic deaths.

  **Phase 1: Diagnose**
  *   **Source:** Disagreement. Camps use different biological models.
  *   **Pooling:** **Forbidden.** Do not average to 7.5%. Keep the Set as [0.1%, 15%].

  **Phase 2: Dilation**
  *   **Test:** Does knowing the patient's age widen the side effect interval? If yes, ignore age for the top-level decision. (Assume pass for this example).

  **Phase 3: Rules**
  *   **Interval Dominance:** Both "Release" and "Hold" are non-dominated. (Release is better if Camp Low is true; Hold is better if Camp High is true).
  *   **Maximin:**
      *   Release Worst-Case: 15% side effects (Catastrophic).
      *   Hold Worst-Case: Epidemic runs course (Bad, but known baseline).
      *   *Winner:* **Hold.** (Assuming 15% side effects is worse than the epidemic baseline).
  *   **Minimax Regret:**
      *   If we Hold and Camp Low was true: Regret = Epidemic deaths that could have been saved.
      *   If we Release and Camp High was true: Regret = Caused side effects.
      *   *Winner:* Depends on the magnitude. If Epidemic deaths >> Side effect deaths, **Release** wins on Regret.

  **Phase 4: Recurrence**
  *   **Context:** We don't release countermeasures often. True one-shot.
  *   **Action:** No need to lock a rule for future consistency.

  **Phase 5: Value Boundary**
  *   **Result:** Maximin says Hold. Regret likely says Release.
  *   **Action:** **ESCALATE.**
  *   **Memo to Minister:** "Evidence does not resolve this. The choice is between avoiding the risk of harming patients directly (Hold) vs. avoiding the risk of failing to act (Release). This is a value judgment on the weight of iatrogenic harm vs. natural harm."

  ### Case (b): Cheap, Reversible Mitigation
  *Context:* Cost is negligible. Action is reversible. Probability of success is unknown but non-zero (Set includes 0% and 50%). Probability of failure is high.

  **Phase 1: Diagnose**
  *   **Source:** Ignorance (hard to model tail risks).
  *   **Pooling:** Keep Set wide [0%, 50%] to be safe.

  **Phase 2: Dilation**
  *   **Test:** Pass.

  **Phase 3: Rules**
  *   **Interval Dominance:**
      *   Option "Do Nothing": Cost 0, Benefit 0.
      *   Option "Mitigate": Cost $\epsilon$ (tiny), Benefit [0, Huge].
      *   Is "Mitigate" ever worse than "Do Nothing"? Only if Cost $\epsilon$ > 0 and Benefit = 0.
      *   Since it is reversible, the Cost is effectively sunk but recoverable.
      *   *Result:* "Do Nothing" is dominated. **Eliminate "Do Nothing."**
  *   **Maximin:**
      *   Mitigate Worst-Case: You spend $\epsilon$, nothing happens, you reverse it. Net loss: $\epsilon$.
      *   Do Nothing Worst-Case: You spend 0, nothing happens. Net loss: 0.
      *   *Winner:* **Do Nothing** (Technically). *However*, if $\epsilon$ is politically negligible, Maximin often treats this as a tie.
  *   **Minimax Regret:**
      *   If we Don't Mitigate and it *could* have worked: Regret is Massive (missed huge help).
      *   If we Mitigate and it fails: Regret is $\epsilon$.
      *   *Winner:* **Mitigate.**

  **Phase 4: Recurrence**
  *   **Context:** If you do this for every "cheap idea," you waste resources cumulatively.
  *   **Action:** If this is a recurring pattern, you must lock a rule. If you lock Maximin, you stop doing these. If you lock Regret, you do all of them.

  **Phase 5: Value Boundary**
  *   **Result:** Almost all rules (except strict Maximin on tiny costs) point to **Mitigate**.
  *   **The Hard Truth:** You said you hate this answer. The protocol tells you **your hate is not analytical.**
  *   **Why you hate it:** You are worried about *signaling* (looking desperate) or *precedent* (opening the floodgates to other cheap ideas).
  *   **Protocol Verdict:** Those are political constraints, not decision-theoretic ones. If you want to reject Option (b), you must argue from **Phase 4 (Recurrence/Precedent)** or **Phase 5 (Political Cost of Signaling)**. You cannot argue from expected utility. The math says "buy the lottery ticket." If you won't buy it, admit it's because you don't want to be seen buying lottery tickets, not because the ticket is bad.

  ---

  # Limitations & Failure Modes

  ### What This Procedure Cannot Do
  1.  **It cannot create precision.** If the experts give you [0%, 100%], the output will be "Everything is admissible, escalate to Minister." This is correct, but it will feel like failure.
  2.  **It cannot resolve value conflicts.** It explicitly identifies them so you can dump them on the Minister. It does not solve them.
  3.  **It cannot protect against "Unknown Unknowns."** This handles *risk* (known distributions) and *ambiguity* (unknown distributions), but not *ignorance* (things we haven't thought to model).

  ### The Most Likely Failure Mode: "The Admissibility Trap"
  In high-stakes government work, experts are often cautious. They will give you wide ranges to cover their backs.
  *   **The Symptom:** You run Phase 3. Interval Dominance eliminates nothing. Maximin says A. Regret says B. E-Admissibility says {A, B, C}.
  *   **The Result:** Your recommendation is "Any of these is defensible."
  *   **The Risk:** The Minister will view this as incompetence ("Just tell me what to do").
  *   **The Fix:** You must use **Phase 4 (Recurrence)** to justify picking a single rule *before* the crisis hits.
      *   *Example:* "Department Policy is to prioritize Minimax Regret for public health crises."
      *   If you don't lock a rule *before* the specific case arrives, you will be accused of cherry-picking the rule that gives the answer you wanted emotionally.

  ### A Note on the "Money Pump" (Sequential Consistency)
  You asked about recurring one-shot decisions.
  *   **The Theory:** If you use E-Admissibility (pick any option that is best under *some* model) repeatedly, you can be exploited. You might choose A over B today (because Model 1 favors A) and B over A tomorrow (because Model 2 favors B), paying transaction costs both times.
  *   **The Practice:** For a government desk, the "Money Pump" isn't a gambler taking your cash; it's **policy incoherence**. If you approve a risky project in January using Regret logic, and block a similar one in March using Maximin logic, you will be audited for inconsistency.
  *   **The Protocol Solution:** Phase 4. If the decisions recur, **you are not allowed to switch rules.** You must adopt a "Constitution" for your desk (e.g., "We always use Minimax Regret for health, Maximin for security"). This reduces your flexibility but protects your legitimacy.

  ### Final Advice for the New Hire
  "Your job is not to find the truth. The truth is unavailable. Your job is to characterize the *structure of the disagreement* so the Minister knows exactly what kind of gamble they are taking. If the math gives you a single answer, check your work—you probably averaged something you shouldn't have."
