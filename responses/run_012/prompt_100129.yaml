      *   **Constraints:**
          1.  Distinguish *ignorance* (wide range due to lack of data) vs. *disagreement* (wide range due to conflicting expert models).
          2.  Handle *pooling* correctly (when is averaging okay vs. when does it hide risk?).
          3.  Detect *dilation* (adding info increases uncertainty about the target).
          4.  Use *decision rules* explicitly (Maximin, Minimax Regret, E-admissibility, etc.) and acknowledge they disagree.
          5.  Address *sequential consistency* (recurring one-shot decisions and the risk of Dutch Books/money pumps).
          6.  Mark the *value judgment boundary* (where to escalate to the Minister).
      *   **Tasks:**
          1.  Build the procedure.
          2.  Run it on Case (a): Pre-emptive release (effective but side effect disagreement).
          3.  Run it on Case (b): Cheap reversible mitigation (likely useless, small chance of huge help).
          4.  Identify limitations and likely failure modes.

  2.  **Develop the Procedure (The "Deep Uncertainty Protocol"):**

      *   *Phase 1: Characterize the Set.* Need to separate ignorance from disagreement. This is crucial. If experts use different models, averaging is dangerous. If they use the same model but lack data, averaging might be okay (linear pooling vs. convex hull). Let's call this "Source of Imprecision."
      *   *Phase 2: Check for Dilation.* The user mentioned adding info making things worse. This is a known phenomenon in imprecise probability (Walley's dilation). Need a simple test: Does conditioning on the new variable widen the interval for the decision variable?
      *   *Phase 3: Decision Rule Selection.* Can't just pick one. Need to run a few key ones.
          *   Maximin (Wald): Safe, pessimistic.
          *   Minimax Regret: Avoids looking stupid later.
          *   E-Admissibility: Keep options that are best under *some* credible distribution.
          *   Interval Dominance: Eliminate options that are worse than others under *all* distributions.
      *   *Phase 4: Sequential/Recurring Check.* If we do this often, can we be money-pumped? If the set is too wide, E-admissibility might lead to intransitive choices over time. Need a "Stability" check.
      *   *Phase 5: The Value Boundary.* If the rules disagree fundamentally (e.g., Maximin says A, Regret says B), that's not a math problem, it's a risk appetite problem. Escalate.

      *Refining the "Pooling" constraint:* Linear pooling (averaging probabilities) reduces uncertainty. Convex hull (keeping the range) preserves it. The procedure needs to dictate: If *Disagreement*, use Convex Hull (keep wide). If *Ignorance*, Linear Pooling *might* be okay, but Convex Hull is safer for government. Let's recommend Convex Hull as default for high stakes.

      *Refining the "Dilation" constraint:* This is technical. How to explain it simply? "The Irrelevance Test." If $P(A|B)$ is wider than $P(A)$, and $B$ shouldn't matter, flag it.

      *Refining the "Sequential" constraint:* This refers to the "Dynamic Consistency" problem in imprecise probabilities. If you update by conditioning, you might violate coherence over time. The advice should be: "If you face a sequence of these, pick a *single* rule (like Maximin) and stick to it, even if it's suboptimal for a single case, to prevent exploitation."

  3.  **Drafting the Procedure (Iterative refinement for tone and utility):**

      *   Tone: Professional, direct, bureaucratic but honest.
      *   Format: Numbered steps, clear "Stop/Go" decisions.
      *   Name: "The Imprecise Probability Decision Protocol (IPDP) v1.0".

  4.  **Running Case (a): Pre-emptive Release:**

      *   *Context:* Countermeasure works, side effects unknown/disagreed.
      *   *Step 1 (Source):* Disagreement (two camps). -> Keep set wide (Convex Hull). Do not average.
      *   *Step 2 (Dilation):* Probably not an issue here, focus is on side effects.
      *   *Step 3 (Rules):*
          *   Maximin: Assume worst side effects. Likely "Don't Release."
          *   Minimax Regret: If we don't release and pandemic hits, regret is huge. If we release and side effects kill, regret is huge. Depends on magnitudes.
          *   E-Admissibility: "Release" is best under the "Low Side Effect" distribution. "Don't Release" is best under "High Side Effect." Both admissible.
      *   *Step 4 (Boundary):* Rules disagree. Maximin says No, Regret might say Yes. This is a value judgment (Lives saved vs. Lives harmed by treatment). Escalate.

  5.  **Running Case (b): Cheap Reversible Mitigation:**

      *   *Context:* Cheap, reversible, likely useless, small chance of huge help.
      *   *Step 1 (Source):* Ignorance or Disagreement? Let's assume Ignorance (hard to model tail risk).
      *   *Step 2 (Dilation):* User suspects procedure says "Do it."
      *   *Step 3 (Rules):*
          *   Maximin: Cost is low, downside is low (reversible). Upside is high. Worst case is "wasted small money." Best case is "saved everything." Maximin usually favors this if cost is negligible.
          *   Regret: If we don't do it and it works, regret is infinite. If we do it and it fails, regret is small cost.
