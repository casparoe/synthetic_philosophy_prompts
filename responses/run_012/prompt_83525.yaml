  # The Doing/Allowing Decision Tree

  **Q1: The Chaotic Baseline**
  In the chaotic case where it is genuinely undefined what would have happened if you'd done nothing, is there still a moral fact about whether you killed or let die?
  *   **No:** (The distinction requires a defined baseline). → **Go to Q2**.
  *   **Yes:** (The distinction holds even without a counterfactual baseline). → **Go to Q6**.

  ---

  ### Left Branch (Baseline Required)

  **Q2: The Firing Squad (Overdetermination)**
  In the firing squad where the other nine would have shot anyway, does the fact that your bullet made no difference mean you didn't kill?
  *   **Yes:** (Killing requires changing the outcome). → **Leaf 1**.
  *   **No:** (Killing is about the act itself, not the outcome). → **Go to Q3**.

  **Q3: The Lightbulb (Flow Interruption)**
  In the lightbulb case, is unscrewing the bulb morally worse than not replacing it because it interrupts an existing flow?
  *   **Yes:** (Wrongness comes from diverting the normal course). → **Leaf 2**.
  *   **No:** (Wrongness comes from something other than flow). → **Go to Q4**.

  **Q4: The Determined Shooter (Metaphysics)**
  In the firing squad, if physics fully determined your shot, is the distinction between killing and letting die an illusion?
  *   **Yes:** (Distinction requires genuine agent-initiation). → **Leaf 3**.
  *   **No:** (Distinction survives determinism as a social tool). → **Leaf 4**.

  ---

  ### Right Branch (Baseline Not Required)

  **Q6: The Lifeguard (Gradient)**
  In the lifeguard case (never enters vs. swims halfway), is the moral difference between the two guards a sharp line or a sliding scale?
  *   **Sliding Scale:** (Moral weight tracks causal involvement). → **Leaf 5**.
  *   **Sharp Line:** (There is a binary boundary). → **Go to Q7**.

  **Q7: The Parent (Permissibility)**
  In the parent case (never feeds vs. takes food away), is 'taking food' impermissible while 'never feeding' is permissible?
  *   **No:** (Both acts have the same permissibility status). → **Go to Q8**.
  *   **Yes:** (The acts have different permissibility status). → **Go to Q9**.

  **Q8: The Parent (Blame)**
  In the parent case, if both acts are permissible, are you equally to blame for the death?
  *   **Yes:** (Blame tracks permissibility). → **Leaf 6**.
  *   **No:** (Blame is higher for doing, even if permissible). → **Leaf 7**.

  **Q9: The Surgeon (Intent)**
  In the surgeon stopping mid-operation case, does the intent to stop matter more than the physical movement?
  *   **Yes:** (Intended harm is the real line). → **Leaf 8**.
  *   **No:** (The physical nature of the act matters more). → **Go to Q10**.

  **Q10: The Kidney (Source of Wrongness)**
  In the kidney case (decline to give vs. take one out), is the wrongness about violating a bodily boundary or directing harm?
  *   **Bodily Boundary:** (Rights are the core constraint). → **Leaf 9**.
  *   **Directing Harm:** (Agency is the core constraint). → **Leaf 10**.

  ---

  ### The Leaves

  **Leaf 1: The Difference-Making View**
  *   **Position:** Doing means your behavior is a difference-maker relative to a baseline; allowing means you're part of the background.
  *   **Awkward Commitment:** In the firing squad, you are innocent of killing because the victim was already doomed.

  **Leaf 2: The Normal-Course View**
  *   **Position:** Allowing lets the statistically or biologically normal course of events run; doing diverts it.
  *   **Awkward Commitment:** You are morally worse for unscrewing a lightbulb than for ensuring it was never installed, even if the outcome is identical.

  **Leaf 3: The Agent-Causation View**
  *   **Position:** The distinction only exists if agents are a special kind of cause and it collapses for anything that isn't a genuine initiator.
  *   **Awkward Commitment:** If determinism is true, murder does not exist.

  **Leaf 4: The Social-Practice View**
  *   **Position:** The distinction is a real social kind, a way our blaming and excusing practices carve things up, but not a fact about moral weight.
  *   **Awkward Commitment:** The difference between killing and letting die is merely a legal convenience with no root in reality.

  **Leaf 5: The Degrees View**
  *   **Position:** There's no line at all, just a gradient of causal involvement, and the binary is a convenience of law and language.
  *   **Awkward Commitment:** The lifeguard who swims halfway is exactly half as guilty as the one who pushes the swimmer under.

  **Leaf 6: The Flat No-Difference View**
  *   **Position:** The only thing that matters is whether things go worse overall; doing vs. allowing is at best a flag that happens to correlate with it.
  *   **Awkward Commitment:** You are as guilty for forgetting to feed your baby as for starving it.

  **Leaf 7: The Blame-But-Not-Wrongness View**
  *   **Position:** Permissibility is identical either way and what differs is how much you're to blame or what you owe by way of explanation.
  *   **Awkward Commitment:** You did nothing wrong by letting the child drown, but you are a monster for not trying to save them.

  **Leaf 8: The Intention View**
  *   **Position:** The real line is intended vs. merely foreseen harm; doing vs. allowing is a leaky proxy for it.
  *   **Awkward Commitment:** A surgeon who stops operating to save a different patient is morally equivalent to one who stops to let the first patient die.

  **Leaf 9: The Rights View**
  *   **Position:** Negative duties not to interfere are stricter than positive duties to help; that asymmetry is the whole content of the distinction.
  *   **Awkward Commitment:** You can let a child drown in a shallow pond to avoid ruining your shoes.

  **Leaf 10: The Harmful-Agency View**
  *   **Position:** What's special about doing harm is that you direct it at someone while allowing is failing to shield them.
  *   **Awkward Commitment:** Blocking a paramedic is worse than locking the door, even if the victim dies either way.

  ---

  ### Analysis of the Space

  **1. Empty Cells**
  Since this tree maps the logical space of possible positions, several theoretical combinations are left empty.
  *   **"Needs Baseline" + "Gradient":** (Left Branch + Q6 Slope). This cell is empty because if you require a defined baseline to make the distinction (Q1 No), you typically treat the distinction as binary (Baseline Met vs. Not Met). A gradient view usually dissolves the need for a strict baseline. *Status: Coherent but unexplored.*
  *   **"Needs Baseline" + "Flat No-Difference":** (Left Branch + Q7 No). This cell is empty because if you require a baseline (Q1 No), you usually care about the *type* of cause (Difference-Making), not just the outcome. A consequentialist who cares only about outcomes typically doesn't need a counterfactual baseline to judge the outcome itself. *Status: Unwanted.*
  *   **"No Baseline" + "Normal-Course":** (Right Branch + Leaf 2). This cell is empty because the "Normal Course" is inherently a baseline view (statistical normality). You cannot hold the Normal-Course view without answering Q1 "No". *Status: Incoherent.*

  **2. Indistinguishable Leaves**
  *   **The Social-Practice View (Leaf 4) and The Blame-But-Not-Wrongness View (Leaf 7):** On the ten cases provided, these two leaves may answer identically. Both assert that the permissibility/wrongness is the same (or socially constructed), while the blame/practice differs. The distinction is metaphysical (is the distinction *real* vs. is *blame* different?) rather than practical. For Dave's purposes, these function as the same position.

  **3. The Causal Graph Claim**
  *   **The Claim:** The distinction is about which causal route you're on (through the threat vs. through the victim).
  *   **Location:** This lands on the **Left Branch**, specifically near **Leaf 1 (Difference-Making)** or **Leaf 2 (Normal-Course)**.
  *   **Verdict:** This is a **redescription of the Difference-Making View**.
  *   **Reasoning:** Claiming the agent is on the "threat route" is just a structural way of saying the agent is a *difference-maker* in the causal chain leading to harm. If the agent is on the "victim route" (shielding), they are part of the background conditions. This does not create a new leaf; it merely offers a graphical metaphor for the counterfactual dependence tested in Q2. It fails to distinguish itself from Difference-Making because both rely on the causal structure to determine moral status, and both collapse in the Chaotic Case (Q1) where the graph is undefined.
