      *   *Design:* Track, predict, represent (functional sense).
      *   *Intentional:* Aim, want, refuse, deceive (high risk).
      *   *Constraint:* Legal wants none. Comms wants clarity. The procedure must bridge this.

  5.  **Developing the Substitution Test:**
      *   Replace the mental verb with a mechanical description. Does the truth value hold? Does the risk profile change?

  6.  **Addressing the Colleague's Point:**
      *   The colleague is right that "tried to hide" often masks a design flaw (e.g., retrieval failure). Using intentional language can shift blame from engineers to the "magic box." This needs to be stated plainly.

  7.  **Running the Three Cases:**
