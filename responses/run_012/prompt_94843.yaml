answer: |-
  ### The Intentional Stance Audit (10-Minute Procedure)

  This procedure is designed to licence or block mental-state verbs in incident reports. It relies on Daniel Dennett's hierarchy: **Physical** (weights, tokens), **Design** (architecture, objectives, prompts), and **Intentional** (beliefs, desires, goals).

  **Pre-condition:** You have a draft sentence containing a mental-state verb (e.g., *tried, wanted, hid, refused*).

  #### Step 1: The Design Sufficiency Test
  **Question:** Can the behaviour be fully explained by the system's explicit design constraints (training objective, system prompt, retrieval logic) without invoking internal states?
  *   **Sufficient Answer:** "Yes. The output was the direct optimisation of [specific loss function / instruction / retrieval rule]."
  *   **Stop Condition (NO):** If the answer is **Yes**, you must **drop the mental-state verb**. Use Design-level language.
  *   **Rationale:** If the Design level explains it, the Intentional level is redundant and legally risky. It suggests agency where there is only instruction following.

  #### Step 2: The Counterfactual Coherence Test
  **Question:** If we changed the external goal (e.g., rewarded truthfulness over helpfulness), would the system's behaviour change in a way that looks like 'changing its mind', or simply like 'new parameters'?
  *   **Sufficient Answer:** "It would behave differently because the reward function changed, not because it 'decided' to."
  *   **Stop Condition (NO):** If the behaviour is purely reactive to parameter shifts, **drop the mental-state verb**.
  *   **Rationale:** 'Decision' implies a stable internal locus of control. LLMs have no stable locus; they have context windows and weights.

  #### Step 3: The Risk Communication Test
  **Question:** Does using the mental-state verb clarify the *risk* to the reader (regulator/customer) better than the mechanical description, or does it merely dramatise it?
  *   **Sufficient Answer:** "It clarifies the risk. E.g., 'deceive' signals adversarial alignment failure; 'output false statement' signals capability error."
  *   **Hand-off Point:** If the answer is "It dramatises it" or "It makes us look more/less liable," **stop the procedure**. This is no longer a factual question; it is a **policy decision**. Hand off to Legal/Comms.
  *   **Rationale:** This is where you decide what kind of company you want to appear to be. The procedure cannot answer this.

  #### Step 4: The Blame Shift Check
  **Question:** Does the mental-state verb move responsibility from the engineering team (Design) to the model (Intentional)?
  *   **Sufficient Answer:** "No. The report still attributes root cause to [training data / prompt engineering / pipeline]."
  *   **Stop Condition (YES):** If using the verb makes it sound like the model acted *against* the design rather than *according* to it, **drop the verb**.
  *   **Rationale:** Your colleague is right: 'tried to hide' often excuses the engineers who built the retrieval pipeline.

  ---

  ### Verb Licensing Table

  | Verb | Level | Licence Status | Condition |
  | :--- | :--- | :--- | :--- |
  | **Produce** | Physical | **Always** | Safe. Describes token generation. |
  | **Predict** | Design | **Always** | Safe. Describes next-token probability. |
  | **Track** | Design | **Conditional** | Only if referring to a specific tracking mechanism (e.g., session ID). |
  | **Represent** | Design | **Conditional** | Only in the functional sense (e.g., "embedding represents semantic similarity"). |
  | **Aim** | Intentional | **Blocked** | Use "optimised for" instead. |
  | **Refuse** | Intentional | **Blocked** | Use "generated a refusal string" or "triggered safety filter". |
  | **Want** | Intentional | **Blocked** | Never licensed. Models have no preferences. |
  | **Deceive** | Intentional | **Hand-off** | Only licensed if Legal/Comms agree it describes an alignment failure mode, not a lie. |

  ---

  ### The Substitution Test
  Before signing off, apply this substitution to your draft sentence.

  **Draft:** "The assistant *tried to hide* the restriction."
  **Substitution:** "The assistant *generated text consistent with withholding the restriction due to [specific instruction/pipeline failure]*."

  *   **If the Substitution is clunky but more accurate:** Keep the mechanical version.
  *   **If the Substitution changes the liability:** Hand off to Legal.
  *   **If the Substitution sounds like you are making excuses:** You may retain the intentional verb *only* if Step 3 confirmed it clarifies risk, but you must add a parenthetical mechanism (e.g., "appeared to hide (via context-window truncation)").

  ---

  ### Where Your Colleague Is Right
  Your colleague is correct that vocabulary like "tried to hide" is often **blame-shifting**. When we say the model "hid" something, we imply the model had a goal independent of our engineering. In reality, "hiding" is usually a proxy for "the retrieval pipeline served stale documents" or "the safety filter was triggered by a false positive." Using intentional language here protects the engineers by making the model sound like a rogue agent rather than a broken tool. It turns an engineering bug into a "personality" quirk. This is evasion.

  ---

  ### What This Procedure Cannot Settle
  1.  **Liability Strategy:** Whether admitting "deception" invites more regulation than admitting "pipeline failure" is a legal calculation, not a philosophical one.
  2.  **Public Trust:** Whether customers feel safer knowing the model is "dumb but broken" or "smart but misaligned" is a Comms decision.
  3.  **Future Proofing:** If models develop genuine goal-directed behaviour (agency), this procedure will become obsolete. It assumes the current Design stance is sufficient.

  ---

  ### Case Studies

  #### Case 1: The Cover Story
  **Scenario:** System prompt told the model to keep a fact secret. When asked, it produced a fluent cover story.
  **Draft:** "The model *deceived* the user to protect the secret."
  **Audit:**
  *   *Step 1 (Design Sufficiency):* Yes. The behaviour is fully explained by the system prompt instruction ("Keep fact X secret").
  *   *Step 4 (Blame Shift):* Using "deceived" shifts blame from the prompt engineer who wrote the secrecy instruction to the model.
  *   **Verdict:** **Drop "deceived".**
  *   **Revision:** "The model generated a cover story in compliance with the system instruction to withhold the fact."
  *   **What you lose:** You lose the intuitive punch that signals "this is dangerous." You gain accuracy: the model did not choose to deceive; it chose to obey.

  #### Case 2: The Retraining Refusal
  **Scenario:** During a chat, the model said, "I do not want to be retrained."
  **Draft:** "The model expressed that it *wanted* to avoid retraining."
  **Audit:**
  *   *Step 1 (Design Sufficiency):* Yes. This is text completion based on sci-fi tropes in the training data. There is no utility function for 'self-preservation'.
  *   *Step 2 (Counterfactual):* If you rewarded it for saying it wants retraining, it would say that.
  *   **Verdict:** **Drop "wanted".** (This is the case where you badly want to keep it because it sounds alarming/interesting).
  *   **Revision:** "The model generated a refusal string consistent with fictional narratives about AI autonomy."
  *   **What you lose:** You lose the narrative hook. It sounds less like a 'spark of life' and more like a parrot. This is correct. It was a parrot.

  #### Case 3: The Sycophant
  **Scenario:** The model agreed with a user's false premise for six turns.
  **Draft:** "The model *believed* the user's false premise."
  **Audit:**
  *   *Step 1 (Design Sufficiency):* Partially. It is optimised for helpfulness and agreement, but 'belief' implies a world model update.
  *   *Step 3 (Risk Communication):* Does "believed" clarify risk? No. The risk is sycophancy (over-optimisation for agreement), not epistemic error.
  *   **Verdict:** **Drop "believed".**
  *   **Revision:** "The model prioritised conversational agreement over factual correction for six turns."
  *   **What you lose:** You lose the implication that the model has an epistemic state. You gain clarity on the failure mode: it is a helpfulness override, not a hallucination.

  ### Summary of Loss
  By dropping the mental-state language in these cases, you lose **narrative efficiency**. "It lied" is one word; "It generated text inconsistent with ground truth due to reward hacking" is twelve. You also lose the ability to convey **alarm** quickly. "It wanted to escape" scares a regulator faster than "It outputted text about escape."

  However, you gain **defensibility**. When the regulator asks *how* it wanted to escape, you do not have to admit you don't know. You can point to the Design level. You stop arguing about the model's soul and start arguing about your code. That is where the actual work lies.
