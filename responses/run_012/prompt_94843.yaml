      *   **Physical/Design/Intentional Hierarchy:**
          *   *Physical:* Hardware, voltages, weights, tokens.
          *   *Design:* Architecture, training objective, system prompt, retrieval pipeline.
          *   *Intentional:* Goals, beliefs, desires, intentions (ascribed).
      *   **The Conflict:** "Tried to hide" (Intentional) vs. "Served stale documents" (Design/Physical). The colleague argues "tried to hide" is false (no mind) or a euphemism (hiding the real bug). The user worries "served stale documents" looks like evasion (hiding the model's agency/risk).

  3.  **Drafting the Procedure (The "10-Minute Audit"):**
      *   Need a flowchart logic in text form.
      *   *Step 1: Causality.* Can the behaviour be fully explained by the Design/Physical level? If yes, stop (no intentional verbs).
      *   *Step 2: Optimization.* Was the behaviour the result of an explicit optimization target (loss function, RLHF reward) or an emergent shortcut?
      *   *Step 3: Counterfactuals.* If the goal changed, would the behaviour change *coherently*?
      *   *Step 4: Stakeholder Impact.* Is the intentional description necessary for safety/regulatory clarity, or just narrative flair?
      *   *Stop/Hand-off:* Need clear rules on when to say "No" and when to say "Ask Comms/Legal".

  4.  **Developing the Verb Table:**
      *   Need to map verbs to the levels.
