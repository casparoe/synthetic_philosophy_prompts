  # Diagnostic Decision Tree: Allais Preferences

  **Root Node:** You report the standard Allais preferences: you prefer the sure \$1 million over the gamble with a small chance of nothing, but you prefer the higher-risk gamble for \$5 million over the slightly safer gamble for \$1 million when the sure option is removed.

  ### **Node 1: Normative Status**
  **Question:** Do you regard this pattern of choices as a mistake in reasoning, as a rational response that standard mathematical models cannot capture, or as a result of the decision problem being described in a misleading way?
  *   **Branch A:** It is a mistake in reasoning. (Go to Node 2)
  *   **Branch B:** It is rational; the model is limited. (Go to Node 4)
  *   **Branch C:** It is a result of misleading description (misframing). (Go to Node 7)

  ---

  ### **Branch A: It is a Mistake (The Normative Path)**

  #### **Node 2: Sequential Consistency**
  **Question:** Imagine the choice is presented sequentially: you first learn whether the 89 percent event occurred, and only then choose between the remaining options. Does seeing the choice this way make your original preferences feel inconsistent?
  *   **Branch A1:** Yes, it exposes an inconsistency. (Go to Node 3)
  *   **Branch A2:** No, the inconsistency disappears or feels irrelevant.
      *   **Leaf: Independence as Property of Representation.**
          *   **Core Claim:** The axiom is a requirement of the mathematical model, not a norm of human thought.
          *   **Awkward Case:** Explaining why the axiom is taught as a normative standard in seminars.

  #### **Node 3: Catastrophe Sensitivity**
  **Question:** If the large prize were replaced by a small chance to avoid a financial catastrophe, would you still call the original preference pattern a mistake?
  *   **Branch A3a:** Yes, it remains a mistake regardless of the stakes.
      *   **Leaf: Orthodox Expected Utility.**
          *   **Core Claim:** Independence is a strict requirement of rationality.
          *   **Awkward Case:** High-stakes scenarios where caution regarding catastrophic loss feels intuitively mandatory.
  *   **Branch A3b:** No, avoiding ruin justifies the pattern.
      *   **Leaf: Minimal Rationality.**
          *   **Core Claim:** Rationality imposes only transitivity and dominance, not independence.
          *   **Awkward Case:** Explaining why people exhibit systematic patterns rather than random satisficing.

  *(Note: If a respondent selects Branch A3b, they effectively concede that independence is not a universal norm. This leaf is functionally similar to the "Independence as Property of Representation" leaf regarding the axiom's status, but differs in that it posits a substantive normative claim about stakes rather than a deflationary claim about models.)*

  ---

  ### **Branch B: It is Rational (The Descriptive/Alternative Normative Path)**

  #### **Node 4: Common-Consequence vs. Substitution**
  **Question:** In the first choice, the 89 percent outcome is the same for both options. In the second, the 89 percent outcome is also the same (nothing). Do you treat these two "89 percent parts" as identical pieces that should cancel out, or does the specific content of that shared part change how you weigh the rest?
  *   **Branch B1:** They are identical pieces that cancel out (Substitution). (Go to Node 5)
  *   **Branch B2:** The content matters; the shared part changes the context (Common-Consequence). (Go to Node 6)

  #### **Node 5: Ambiguity Sensitivity**
  **Question:** If the percentages were not guaranteed by a machine but were estimates from a fallible expert, would your preference for the safer option become stronger?
  *   **Branch B5a:** Yes, ambiguity strengthens the preference.
      *   **Leaf: Ambiguity Aversion.**
          *   **Core Claim:** The real problem is ambiguity rather than risk.
          *   **Awkward Case:** The original Allais case involves known probabilities, yet the pattern persists.
  *   **Branch B5b:** No, the pattern holds even with known probabilities.
      *   **Leaf: Probability Weighting.**
          *   **Core Claim:** Revises probability weighting rather than the axiom.
          *   **Awkward Case:** Ambiguous probability cases where weighting functions are undefined.

  *(Note: Ambiguity Aversion and Probability Weighting make similar predictions on standard risk tasks but diverge on Ellsberg-type cases. This tree separates them via Node 5.)*

  #### **Node 6: Loss Symmetry**
  **Question:** If the money amounts were framed as losses instead of gains, would you keep the same preference pattern?
  *   **Branch B6a:** No, the pattern flips for losses.
      *   **Leaf: Reference-Point View.**
          *   **Core Claim:** Value depends on changes from a baseline, not final wealth.
          *   **Awkward Case:** Defining the baseline precisely in complex, multi-stage scenarios.
  *   **Branch B6b:** Yes, the pattern holds for losses.
      *   **Leaf: Regret-Based View.**
          *   **Core Claim:** Choices anticipate emotional reaction to what might have been.
          *   **Awkward Case:** Sequential versions where the foregone option is unknown at the time of choice.

  ---

  ### **Branch C: It is Misframing (The Contextual Path)**

  #### **Node 7: Domain Dependence (Job/Status Quo)**
  **Question:** If the money amounts were replaced by keeping your current job versus a chance of promotion or firing, does the logic of the choice change?
  *   **Branch C1:** Yes, the stakes or nature of the good changes the logic.
      *   **Leaf: State-Dependent Utility.**
          *   **Core Claim:** The utility of an outcome depends on the state (e.g., employed vs. unemployed) in which it is received.
          *   **Awkward Case:** Pure monetary gambles where states seem irrelevant to the value of cash.
  *   **Branch C2:** No, the logic is the same across domains. (Go to Node 8)

  #### **Node 8: Fact of the Matter**
  **Question:** If the logic is the same, but the description still feels like it hides something, is there a correct answer to what a rational agent should choose here?
  *   **Branch C8a:** Yes, there is a correct answer, but the standard description misses it.
      *   *(This path loops back to Branch B positions, suggesting the respondent is actually in the Rational branch but misidentified their view. Flag as **Unexplored/Unstable**).*
  *   **Branch C8b:** No, there is no single correct answer.
      *   **Leaf: Deflationary View.**
          *   **Core Claim:** There is no fact of the matter about rationality here.
          *   **Awkward Case:** Providing actionable advice in policy or economic design.

  ---

  ### **Diagnostic Notes on Unoccupied or Merged Positions**

  1.  **Unoccupied Combination:** A respondent who claims the pattern is a **Mistake** (Branch A) but also claims the **Content Matters** (Node 4, Branch B2) is incoherent. If it is a mistake, the structural equivalence (Substitution) should hold; if content matters, it is typically defended as rational (Branch B).
  2.  **Merged Leaves:** The **Independence as Property of Representation** leaf (Branch A2) and the **Deflationary View** (Branch C8b) both deny the normative force of the axiom. They are separated here by whether the respondent views the preference as a cognitive error (A2) or as indeterminate (C8b). If a respondent cannot distinguish these, the tree cannot separate them; they should be merged into a single **Non-Normative** category.
  3.  **Unattractive Position:** The **Minimal Rationality** leaf (Branch A3b) is often unattractive to theorists because it permits almost any preference pattern, reducing predictive power. It is occupied only by those who insist on normativity (Branch A) but admit stake-based exceptions (Node 3).
