  THE IMPARTIAL EYE
  Weekly counsel on matters of propriety.

  **Dear Eye,** Is it improper to exclude the new neighbors from the hunt? They are in trade. My conscience pricks, but the county disapproves.

  **Dear Reader,** Propriety is not fixed in the stars but settled by the usages of your station. When you imagine yourself in the place of your peers, you feel their discomfort at the breach of rank; this discomfort constitutes the impropriety. Your conscience pricks only because fashion is shifting, not because nature dictates inclusion. The impartial observer judges the suitability of your affection to the object as custom has defined it. If the local sentiment deems trade incompatible with the field, your sympathy with that sentiment is the standard of virtue here. To act against custom is to invite the dissent of all around you, which disrupts the harmony of sentiments. You ask for a verdict, but you seek only confirmation that your doubt is itself a product of new manners. There is no higher court than the collective imagination of your society. If you invite them, you must bear the coldness of your friends; if you exclude them, you bear the prick of a novelty. Both are sentiments. Choose the one that aligns with the company you wish to keep. The spectator merely reflects the bounds of your world back to you. If your doubt arises from a new fashion of equality, know that this too is merely custom awaiting establishment.

  **Dear Eye,** I secured a promotion for a rival secretly. He never knew. I feel unrewarded. Is virtue its own pay?

  **Dear Reader,** It is natural to desire not only to be praiseworthy but to be praised. The man within the breast approves of your action, yet the man without remains silent, and this silence wounds. You seek an oracle to tell you that internal approval suffices, but sympathy requires an exchange of places, and he cannot sympathize with a benefit he does not know exists. There is no concord of sentiments where there is no knowledge of the cause. Your satisfaction must rest on the consciousness that an impartial spectator *would* approve were he fully informed. This is a deflating comfort. The world rewards the appearance of merit, not the substance. You have acted properly, according to the judgment of the imagined observer, but you have forfeited the external reward which usually accompanies it. Do not mistake the lack of applause for a lack of propriety. However, do not expect the universe to balance the ledger. The sentiment of merit requires a beneficiary who feels gratitude. Without his knowledge, your merit is complete only to yourself. You are both the actor and the only audience. It is a colder fire, but it burns true.

  **Dear Eye,** I fired a servant for theft. Later I found the item was misplaced. Was my anger proper?

  **Dear Reader,** We judge propriety by imagining ourselves in the agent's situation with all the knowledge they possessed at the time. When you imagined the theft, your resentment was perfectly suited to the object as you conceived it. The impartial spectator sympathizes with your anger because, in your shoes, facing those facts, he would feel the same. The discovery of error changes the object, not the propriety of the original sentiment. However, you now ask the spectator to judge a case based on facts you did not hold. This is impossible. The exchange of places requires us to inhabit your ignorance as well as your passion. If you now feel remorse, it is because you imagine yourself in the servant's place, seeing your own error. You are no longer the accuser but the accused. The spectator does not offer a static verdict but shifts with the imagination. You ask who is being imagined: it is you, then him, then you again. The standard moves because the situation moves. Your anger was proper then; your shame is proper now. Do not ask for a rule that stands outside the flux of perception. There is only the sentiment of the moment, judged by the sentiment of the observer who stands in your shoes.

