          *   Must state plainly where arbitrariness exists and what the procedure *cannot* do.
          *   Must incorporate the Chair's rule (no reduction in average wellbeing of existing people).
          *   Must handle the "Repugnant Conclusion" case (many lives barely worth living).
          *   Must apply the procedure to three specific proposals (Cash bonus, Childcare subsidy, Skilled immigration).
          *   One outcome must be counter-intuitive/unliked by the user (and explained).
          *   Format: Usable deliverable (Questions, Stopping Rules, Residual Judgment Calls, Application).
          *   Tone: Professional, concise, compressed reasoning.

  2.  **Deconstruct Population Ethics for a Policy Context:**
      *   *Core Tension:* Total Utilitarianism (more good lives = better) vs. Average Utilitarianism (higher quality of life = better) vs. Critical-Level/Threshold Views (lives must meet a standard to count).
      *   *Non-Identity Problem:* Policies changing *who* is born can't harm those specific people if their lives are worth living, even if alternative people would have been happier.
      *   *The Chair's Rule:* This is essentially an Average Utilitarian constraint on the *existing* population.
      *   *The "Repugnant Conclusion":* A world with massive population and minimal positive welfare > Small population with high welfare (under Total View). Needs a safeguard.

  3.  **Drafting the Decision Procedure (Step-by-Step):**

      *   *Step 1: Identity & Existence.* Does the policy change *who* exists or just *how well* they live?
          *   If just wellbeing: Standard cost-benefit.
          *   If existence changes: Enter population ethics.
      *   *Step 2: The Worth of Added Lives.* Are the new lives "worth living" (positive welfare)?
          *   If no (suffering): Reject.
          *   If yes: Proceed.
      *   *Step 3: The Chair's Constraint.* Does it lower average wellbeing of *currently existing* people?
          *   If yes: Reject (per Chair's rule).
          *   If no: Proceed.
      *   *Step 4: Totals vs. Averages vs. Thresholds.* This is the hard part.
          *   Need to address the "Repugnant Conclusion."
          *   Need to address the trade-off.
          *   *Decision:* Use a Critical-Level View as the default safeguard against the Repugnant Conclusion, but acknowledge the arbitrariness of the level.
      *   *Step 5: Non-Identity.* Acknowledge that we can't claim harm to future people if their lives are positive, but we can claim they are *less good* than alternatives.

  4.  **Refining the Procedure (Addressing Specific Prompts):**
      *   *Arbitrariness:* Must admit that setting the "critical level" is arbitrary.
