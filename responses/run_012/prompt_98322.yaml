      *   **Part 4: The "Unliked" Outcome.**
          *   Explicitly state the Cash Bonus rejection is likely politically unpalatable but ethically consistent.

  7.  **Refining the Logic (Self-Correction during drafting):**
      *   *Critique:* Is the Chair's rule compatible with population ethics?
      *   *Fix:* It's a "Person-Affecting View" restriction. It ignores the welfare of new people in the average calculation of *existing* people. It's compatible but limits the Total View. I need to note this cost: it ignores the potential good of new lives if they drag down the existing average.
