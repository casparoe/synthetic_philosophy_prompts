          *   *Let's make the Cash Bonus the "Unliked" one.* Pronatalist committees usually want birth bonuses. Rejecting it based on ethical grounds (Repugnant Conclusion risk/Chair's rule) will be unpopular.

  6.  **Drafting the Content - Section by Section:**

