          *   *Idea:* Let's make this one trigger the "Repugnant Conclusion" safeguard. It creates many lives, but the economic strain lowers the average quality of life below a critical threshold, or simply adds too many "barely worth living" lives due to resource dilution.
          *   *Better Idea for "Unliked Outcome":* The user is pronatalist-leaning (screening pronatalist proposals). They probably *want* to pass the cash bonus. I should make the procedure recommend *rejecting* it based on the "barely worth living" risk or the Chair's rule.
      *   *Case 2: Childcare Subsidy (No fertility change).*
          *   Effect: Improves wellbeing of existing people (parents/kids). No change in identity/number.
          *   Ethics: Standard Pareto improvement.
          *   Outcome: Adopt. (Easy).
      *   *Case 3: Skilled Immigration.*
          *   Effect: Increases population, increases average wellbeing (skilled).
          *   Ethics: Passes Total, Passes Average, Passes Chair's Rule.
