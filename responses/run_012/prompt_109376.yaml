  ok i need an outside take because my friend devin and i have been going back and forth for like two hours and we're both sure the other one is being dumb.

  the situation: i'm pretty sure my roommate has been lying to me about something. doesn't matter what. the evidence is a mess. there's a screenshot i'm maybe 70% sure i'm reading right (text is tiny and half cut off) and a voicemail where i'm maybe 60% sure he says one thing rather than another (audio keeps dropping out). so the problem is i'm not certain about any of the facts i've got — i'm only sort of sure about what i even saw and heard.

  devin, who reads way too many rationalist blogs, says i'm overcomplicating it: 'if your confidence that the screenshot says X is 70%, then your confidence in X is just 70%. stop being wishy-washy and plug in the numbers.' i said that's nuts, how sure i am that i read the screen right is a totally different thing from how sure i should be that he's lying, because even if i read it perfectly the screenshot could still be weak evidence. he says i'm inventing a distinction.

  then it got wierder. i tried to actually do it the 'right' way and i noticed that if i do the screenshot first and then the voicemail i land on one number, and if i do the voicemail first and then the screenshot i land on a different number. same two pieces of evidence, different answer depending on which one i looked at first. which is definately insane — the truth doesn't care what order i checked my phone in. devin says i must be doing the arithmetic wrong but i did it twice.

  so is he right that there's nothing to it but 'be 70% sure of the thing'? if he's wrong, what am i actually supposed to do with my confidence when i'm not even certain about my own evidence? and is that order thing a real problem or am i just messing it up? i don't want a lecture, i want to know how to think about this before i confront him. (also if what devin is describing has an actual name i'd love to know it so i can send it to him and win.)
reasoning: |-
  Here's a thinking process that leads to the suggested response:

