answer: |-
  This phrase comes from the philosopher Daniel Dennett. Like many philosophical soundbites, it is compact enough to be useful but vague enough to be weaponized. Your seminar is suffering from "equivocation"—using the same phrase to mean different things in different breaths.

  The phrase relies on a physics analogy: A **center of gravity** is not a physical thing you can find inside an object (you can't cut open a donut and find the gravity point), but it is a mathematically real point that helps predict how the object behaves.

  Here is the menu of four distinct claims hidden inside that one-liner, ranked from boring to radical.

  ### 1. The Pragmatic Instrumentalist Claim
  *   **The Claim:** Postulating a "self" is a useful shortcut for predicting human behavior, much like assuming a "center of gravity" exists helps us predict how a brick will fall.
  *   **Ontology (Existence vs. Talk):** This is a claim about **how we talk**. It says nothing about whether a self *actually* exists inside the head, only that treating it *as if* it exists is methodologically useful.
  *   **Plausibility:** **High.** This is standard scientific instrumentalism. We treat nations, corporations, and selves as "agents" to make prediction easier.
  *   **Does it support the Dementia Argument?** **No.** If the self is just a tool for prediction, the fact that the tool becomes harder to use (because the dementia patient's behavior is less predictable) does not mean the *person* is gone. It just means your model is broken, not the object.
  *   **Materialist Compatibility:** **Fully Compatible.** A materialist can use this model without believing in a soul.

  ### 2. The Constitutive Narrativist Claim
  *   **The Claim:** The self is not a thing that *has* a story; the self *is* the story. There is no underlying "holder" of experiences. You are literally the narrative thread tying your memories and intentions together.
  *   **Ontology:** This is a claim about **what exists**, but it defines existence as a process rather than a substance. The self exists only insofar as the narrative process is active.
  *   **Plausibility:** **Contested.** It captures the psychological feeling of identity but ignores non-narrative aspects of selfhood (e.g., bodily awareness, immediate perception, emotional states that aren't "storied").
  *   **Does it support the Dementia Argument?** **Yes.** This is the reading your seminar is likely using. If the self *is* the narrative coherence, and dementia disrupts that coherence, then the self is literally degrading.
  *   **Materialist Compatibility:** **Compatible,** provided the "narrative" is understood as neural processing patterns, not a magical ghost story.

  ### 3. The Eliminative Illusionist Claim
  *   **The Claim:** There is no self. Period. The "center of narrative gravity" is a user-illusion created by the brain to simplify control. Just as the desktop icon on your computer isn't a "real" file but a useful interface, the "self" is a hallucination the brain projects to itself.
  *   **Ontology:** This is a claim about **what exists** (specifically, that the self *does not*). It is an error theory: we think there is a self, but we are wrong.
  *   **Plausibility:** **Radical.** It is logically coherent but deeply counter-intuitive. It requires you to accept that the thing asking the question doesn't exist.
  *   **Does it support the Dementia Argument?** **Yes, but destructively.** If the self is an illusion, the dementia patient never had a "self" to begin with, nor did the healthy professor. Saying the self "frays" is like saying a mirage is getting blurry. It shuts down the question by dissolving the subject.
  *   **Materialist Compatibility:** **Highly Compatible.** This is the hard-nosed materialist position (often associated with Dennett and Thomas Metzinger).

  ### 4. The "Real Pattern" Claim (Dennett's Specific View)
  *   **The Claim:** Fictions can be objectively real patterns. A "center of gravity" is a fiction (you can't touch it) but it is a real pattern (it has causal explanatory power). The self is an abstract object that emerges from physical processes. It is real *as a pattern*, even if not real *as a substance*.
  *   **Ontology:** This is a claim about **levels of abstraction**. It argues that "existence" isn't binary (real vs. fake). Something can be "real enough" to matter without being a physical atom.
  *   **Plausibility:** **Nuanced.** This attempts to solve the dodge you sensed. It admits the self is a fiction but denies that "fiction" means "unimportant."
  *   **Does it support the Dementia Argument?** **No, not necessarily.** A pattern can degrade without the moral status of the entity vanishing. If a novel is missing pages, the *story* is frayed, but the *book* still demands respect. This view allows you to say the "narrative self" is damaged while the "moral person" remains.
  *   **Materialist Compatibility:** **Compatible.** It relies on emergence and information theory, which fit within physicalism.

  ***

  ### Summary Answers to Your Specific Questions

  **1. Which reading do people probably mean when they repeat it?**
  Most people in a seminar setting are oscillating between **Claim 2 (Constitutive)** and **Claim 3 (Eliminative)**. They want the radical punch of "there is no soul" (Claim 3) but they need the psychological utility of "I am my story" (Claim 2) to make sense of daily life. When they use it to shut down the dementia question, they are smuggling in Claim 2 to justify the loss of personhood, while using the authority of Claim 3 to make it sound like hard science.

  **2. Which reading could a card-carrying materialist accept without blinking?**
  A strict materialist can accept **Claim 1 (Pragmatic)**, **Claim 3 (Eliminative)**, and **Claim 4 (Real Pattern)**.
  *   They will reject any version that implies the self is a *substance* (a soul).
  *   However, the **Claim 4 (Real Pattern)** reading is the most sophisticated materialist position. It allows a materialist to say, "The self isn't a ghost, but it's not nothing either; it's a high-level organizational pattern of matter."

  **3. Is "fictions can be real patterns" a dodge?**
  It is only a dodge if used to avoid explaining *how* the fiction exerts causal power. If the speaker can explain that the "fiction" is actually a **feedback loop in the brain** that alters behavior (e.g., believing "I am honest" makes me act honestly), then it is a robust ontological claim (Claim 4). If they use it to say "It's fake but treat it like real" without explaining the mechanism, it is a dodge.

  **4. How to handle the Dementia Argument in your seminar:**
  The move your seminar made ("Story frays $\rightarrow$ Self frays $\rightarrow$ Personhood lost") is a non-sequitur on three of the four readings.
  *   On **Claim 1**, the *model* frays, not the person.
  *   On **Claim 3**, the *self* never existed, so nothing was lost (but this applies to everyone, not just dementia patients).
  *   On **Claim 4**, the *pattern* degrades, but moral status is not identical to narrative coherence.

  You can push back by asking: **"Are we defining 'personhood' as narrative coherence, or as biological/moral status? If the self is a center of narrative gravity, does losing the story mean the gravity well disappears, or just that the object is harder to track?"** This forces them to pick a specific claim from the menu above.
