answer: |-
  You are right that conversion handicaps are real, and I concede that a bare resource share looks arbitrary without some account of how different people convert goods into lives. But your solution—that we fix the conversion rate by referencing functionings—requires the state to decide what those lives are for. To say that £X equals a flight of stairs because mobility is a central capability is to rank mobility above other possible uses of that £X, perhaps religious pilgrimage or artistic creation. The hypothetical insurance market does not presuppose an objective view of which losses matter; it asks what a prudent person, ignorant of their own specific conception of the good, would insure against to protect their ability to pursue *whatever* plan they turn out to have. It aggregates subjective valuations without imposing a single metric of the good, whereas your schedule of functionings inevitably privileges some ways of living over others.

  Furthermore, you overlook the indeterminacy problem inherent in your own metric. Capability sets are only partially ordered; there is no common denominator to compare your set of capabilities to mine unless we impose a weighting scheme. If we leave the weighting to you, we collapse back into resources (since you value them according to your own plans). If we leave the weighting to the state, we have state perfectionism. Equality of capability often has no determinate content precisely because there is no neutral way to say whether having the capability for mobility is "equal" to having the capability for contemplation. The insurance market solves this by using a procedural metric: what distribution would be envy-free ex ante? It doesn't matter if the market price doesn't match your personal capability cost; what matters is that the distribution respects your status as a chooser rather than a vessel for functionings.

  So I press you on this trade-off: you say resources leave you unequal in life, but I say capabilities leave you unequal in status. If the indeterminacy of capability sets requires the state to impose a weighting scheme to make equality actionable, are you not simply disguising a perfectionist judgment as a neutral metric? When you claim the insurance market presupposes a view about which losses matter, do you mean it fails to capture the severity of specific conversions for you personally, or that it illegitimately aggregates preferences across different conceptions of the good?
