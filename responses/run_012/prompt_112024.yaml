  # THE TUCSON CONSENSUS STATEMENT ON THE COLOR PHI PHENOMENON
  **Date:** October 24, 2023
  **Signatories:** The Orwellian Working Group & The Stalinesque Research Coalition

  ## PREAMBLE
  We, the undersigned representatives of the two primary theoretical frameworks regarding temporal anomalies in conscious perception, acknowledge a long-standing divergence in the interpretation of the Color Phi Phenomenon. While we maintain distinct theoretical commitments regarding the ontology of conscious experience, we recognize that productive scientific progress requires a clear delineation of established facts, precise formulation of remaining disagreements, and agreed-upon methods for adjudication. This document serves as our joint commitment to empirical rigor and conceptual clarity.

  ## I. EMPIRICAL CONSENSUS
  We agree upon the following established facts regarding the stimuli, the neural processing, and the behavioral reports associated with the Color Phi Phenomenon:

  1.  **Stimulus Sequence:** The physical stimulus consists of a colored dot (Color A) at Location 1, followed by a temporal gap (Inter-Stimulus Interval, or ISI), followed by a differently colored dot (Color B) at Location 2.
  2.  **Subjective Report:** Naïve subjects consistently report a single object moving continuously from Location 1 to Location 2, undergoing a color change midway through the trajectory.
  3.  **Temporal Anomaly:** Subjects report the color change occurring at a subjective time *t* that corresponds to the ISI, which is physically prior to the presentation of the second stimulus (Color B).
  4.  **Neural Latency:** We agree that neural processing is not instantaneous. The information regarding Color B requires finite time to be transduced, transmitted, and integrated by the visual system.
  5.  **Dependency:** The illusion of motion and color change is contingent upon the presentation of the second stimulus. If the second stimulus is omitted, the illusion typically fails to materialize.
  6.  **Fallibility of Introspection:** We agree that subjective reports are data points to be explained, not infallible revelations of the precise timing of underlying neural events. The "time of experience" is not necessarily identical to the "time of the event experienced."
  7.  **Neural Representation:** We agree that a neural read-out showing the representation of Color B *before* the physical onset of Color B is impossible (barring precognition). However, we agree that a neural read-out showing the *integration* of Color A and Color B data will necessarily occur after the onset of Color B.

  ## II. FORMULATION OF DISAGREEMENT
  We acknowledge that our divergence concerns the **temporal locus of phenomenal consciousness** relative to the **completion of neural processing**.

  *   **The Orwellian Position:** Conscious experience occurs in real-time relative to the first stimulus. The subject genuinely experiences Color A at Location 1. The report of the color change mid-path is the result of a post-hoc revision of memory. The "history" of the experience is rewritten after the fact to create a coherent narrative.
  *   **The Stalinesque Position:** Conscious experience is delayed. The neural system waits for the data from the second stimulus to arrive before assembling the conscious percept. The subject does not experience Color A *as* Color A until the second stimulus is processed. The "trial" (conscious experience) is staged only after the "verdict" (neural integration) is settled.

  **Joint Definition of the Dispute:** The disagreement is strictly over whether the *phenomenal content* of the ISI (the moving, changing dot) exists in consciousness at the time it is reported to occur (Orwellian: No, it is a memory fabrication; Stalinesque: Yes, it is a delayed presentation), or whether only the *memory trace* exists at that time (Orwellian: Yes; Stalinesque: No).

  ## III. ADJUDICATION PROTOCOL: CRUXES, TESTS, AND PREDICTIONS
  To move beyond theoretical stalemate, we identify the following cruxes and propose specific experimental interventions. We agree to accept the results of these protocols as bearing on the validity of our respective models.

  ### Crux 1: The Independence of "Experience Time"
  **Issue:** Can the time at which an experience occurs be defined independently of the subject's later report and independently of the time that the experience's content is about?
  **Proposed Test:** **Interrupted ISI Probe.** During the ISI (the period where the subject claims to see the dot moving and changing color), a third "masking" stimulus is flashed at a random location. Subjects are asked to report the order of the mask relative to the perceived color change.
  *   **Rationale:** If the experience is truly "happening" during the ISI (Stalinesque), the mask should interact with the moving percept in real-time. If the experience is a memory construction (Orwellian), the mask may be retroactively inserted into the narrative or fail to disrupt the construction.
  *   **Orwellian Prediction:** The mask will be reported as occurring *after* the color change sequence is completed, as the memory revision will incorporate the mask into the final narrative sequence regardless of actual timing.
  *   **Stalinesque Prediction:** The mask will disrupt the motion illusion if presented during the neural integration window, proving the "experience" was not yet assembled and available for interaction.

  ### Crux 2: Neural Correlates of the Intermediate State
  **Issue:** Does the neural state during the ISI reflect a stable representation of Color A (awaiting revision) or an indeterminate state (awaiting completion)?
  **Proposed Test:** **High-Resolution Temporal Decoding (MEG/EEG).** We will decode visual cortex activity during the ISI prior to the onset of Color B.
  *   **Rationale:** To determine if the brain maintains a "veridical" record of Color A that is later overwritten, or if the representation is inherently predictive/unstable.
  *   **Orwellian Prediction:** Neural patterns during the early ISI will robustly decode as Color A. A distinct "revision signature" (error correction signal) will appear only after Color B is processed.
  *   **Stalinesque Prediction:** Neural patterns during the ISI will be indeterminate or show immediate predictive coding blending Color A and the anticipated trajectory, with no stable "Color A only" state reaching the threshold for conscious access.

  ### Addressing the Neural Read-Out Question
  **Joint Acknowledgement:** We explicitly address the question: *Would a neural read-out showing the second color represented before the second flash settle anything?*
  **Consensus:** **No.** Both camps agree that neural processing involves prediction and anticipation. A neural representation of Color B prior to its physical onset (via predictive coding) does not prove the *conscious experience* of Color B existed then. Both camps predict that the *conscious access* to the integrated data occurs after the neural integration is complete. Therefore, mere neural representation is insufficient to distinguish between a delayed experience (Stalinesque) and a revised memory of an experience (Orwellian). The dispute is not about *representation*, but about *phenomenal availability*.

  ## IV. META-THEORETICAL ACKNOWLEDGEMENT: THE VERBAL DISPUTE
  We acknowledge the possibility raised by proponents of the Multiple Drafts Model (e.g., Dennett) that our dispute may be partially verbal rather than factual.

  **Identification of Verbal Component:** The dispute is verbal if the phrase "the time at which an experience occurs" lacks a unique, operational definition independent of our theoretical models.
  *   **Why:** If there is no single "finish line" in the brain where unconscious processing becomes conscious experience (no Cartesian Theater), then asking whether the experience happened at *t1* (Orwellian) or *t2* (Stalinesque) is asking a question that has no fact of the matter.
  *   **Agreement:** We agree that if experiments in Section III fail to yield divergent results (i.e., if both models predict the same behavioral and neural outcomes due to the flexibility of "memory revision" vs. "delayed assembly"), we will concede that the distinction is **operationally meaningless**.
  *   **Commitment:** In such an event, we agree to abandon the Orwellian/Stalinesque dichotomy in favor of a model that describes the *functional outcomes* of temporal integration without positing a specific ontological timestamp for "consciousness."

  ## V. SIGNATORIES

  _________________________
  *Lead Investigator, Orwellian Working Group*
  *"Memory is the locus of the illusion."*

  _________________________
  *Lead Investigator, Stalinesque Research Coalition*
  *"Consciousness waits for the evidence."*
