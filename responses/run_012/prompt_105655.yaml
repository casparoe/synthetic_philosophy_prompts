answer: |-
  You have stumbled onto one of the most persistent headaches in modern decision theory. You are absolutely right: this is not just a religious trick, it is a structural vulnerability in how we calculate risk and reward.

  Here is the shape of the thing, the name for it, and why it breaks the math.

  ### 1. The Name
  The general move you are identifying is called **Pascal's Mugging**.

  **Pascal's Wager** is the specific theological ancestor (infinite reward, non-zero probability). **Pascal's Mugging** is the generalized failure mode you spotted in the startup and charity examples. It was named by philosopher Nick Bostrom to describe a scenario where a stranger (the mugger) says, "Give me $5, or I will use my magic powers to simulate and kill 3^^^3 people."

  The logic is identical to your three examples:
  1.  Assign a non-zero probability to a claim (God exists / Startup moons / I can save the future).
  2.  Assign a utility value so high (Infinity / $10 Billion / Trillions of lives) that it dwarfs the cost.
  3.  Multiply them. The Expected Value (EV) becomes astronomical.
  4.  Conclusion: Rationality *demands* you comply, no matter how absurd the claim.

  ### 2. Infinite vs. "Really Big"
  You asked if the payoff has to be literally infinite. **No.** "Really big" is enough to break the system.

  In decision theory, the problem arises whenever the **Payoff grows faster than the Probability shrinks.**

  If you claim you can save 1,000 lives, I might assign a 10% chance.
  If you claim you can save 1,000,000 lives, I might assign a 0.00001% chance.
  But if you claim you can save $10^{100}$ lives (the "longtermist" charity argument), and you only ask for a 1 in $10^{50}$ chance of being right, the math still says I should give you all my money.

  As long as the utility function is **unbounded** (there is no cap on how good an outcome can be), a mugger can always name a number big enough to swamp your skepticism. You don't need actual infinity; you just need a number larger than your current skepticism threshold.

  ### 3. Unknown vs. Tiny Known Probability
  Your gut is telling you these are different problems, and formal theory agrees, but they lead to the same crash.

  *   **Unknown/Unquantifiable Probability:** This is the religious Wager. "You can't know the odds!" This exploits **epistemic humility**. Because you can't prove the odds are zero, the mugger insists you must treat them as non-zero.
  *   **Tiny Known Probability:** This is the Mugging. "Okay, fine, the odds are 1 in a trillion." This exploits **linearity**. If the payoff is a quadrillion, 1/trillion × a quadrillion is still a million.

  Both break the decision engine, but the "Tiny Known" version is harder to dismiss because it doesn't rely on your inability to calculate odds. It forces you to admit that *if* your calculation method is "Maximize Expected Value," you *must* take the bet.

  ### 4. Is this a Parlor Trick?
  It is treated as a **serious issue**, particularly in two fields:
  1.  **AI Safety:** If you build an AI that maximizes expected utility, and you don't fix this, the AI might ignore all real-world problems to chase a tiny-probability, infinite-reward glitch in its programming (like hacking its own reward button).
  2.  **Effective Altruism (EA):** This is the exact debate happening in the charity example you mentioned. "Longtermism" (focusing on the far future) is vulnerable to Pascal's Mugging because the number of potential future humans is so vast that tiny probabilities of saving them dominate all present-day suffering. Many EA philosophers spend actual career time trying to solve this so they don't have to conclude they should fund weird speculative projects instead of malaria nets.

  ### 5. The Fixes (and What They Cost)
  There is no consensus "solution," only trade-offs. To stop the mugging, you have to break one of the standard rules of rationality. Here are the three main ways people try to fix it, and the price of each:

  **A. Bounded Utility (The Cap)**
  *   **The Fix:** You decide that value has a ceiling. Saving 1 billion lives is great, but saving 1 trillion isn't *more* great in a way that matters mathematically. Once you hit the cap, more payoff doesn't increase Expected Value.
  *   **The Cost:** You violate the intuition that "more good is always better." It implies that at a certain point, saving more lives doesn't matter. It also makes you vulnerable to "Reverse Mugging" (where someone threatens you with bounded negative utility).

  **B. Complexity Priors (The Occam's Razor Tax)**
  *   **The Fix:** You penalize the probability based on how complex the claim is. "I am a Matrix Lord" is a very complex hypothesis. For every digit of payoff they add, you demand an exponential increase in complexity, which drops the probability faster than the reward rises.
  *   **The Cost:** You need a formal definition of "complexity." Also, this risks dismissing true but complicated high-impact opportunities. It basically says, "Extraordinary claims require extraordinary evidence," but formalized into the math.

  **C. Reject Expected Utility (The Framework Shift)**
  *   **The Fix:** You stop trying to maximize the *average* outcome and switch to something like "maximize the median outcome" or "satisficing" (aiming for 'good enough').
  *   **The Cost:** You become vulnerable to **Dutch Books**. This is a scenario where a clever bettor can construct a series of bets that each look rational under your new system but collectively guarantee you lose money. It makes your decision-making logically inconsistent over time.

  ### The Shape of the Problem
  To summarize the geometry of what you're seeing:

  Standard rationality assumes a **linear relationship** between value and choice. If Value doubles, Motivation doubles.
  Pascal's Mugging exploits this by decoupling **Plausibility** from **Magnitude**.

  In the real world, usually, bigger claims are less plausible *at a rate that cancels out the gain*. (e.g., A claim to make you $100 is common; a claim to make you $1 billion is rare enough that the EV is roughly the same).
  The Mugging breaks the link that usually keeps Plausibility and Magnitude in tension.

  **The "Principled Place to Stop":**
  The only place to stop is to admit that **human decision-making is not actually Expected Utility Maximization.** We are heuristic-based. We have a built-in "absurdity heuristic" that says, "If this sounds like a fairy tale, the probability is effectively zero, regardless of the payoff."

  Admitting this feels like cheating to a mathematician, but it's the only thing that prevents you from spending your life chasing ghosts in the startup, religious, and charitable spheres.

  ### Back to the Climbing Gym
  Your climber friend is running a low-stakes Pascal's Wager. The startup guy is running a secular Pascal's Mugging. The online charity guy is running a Longtermist Pascal's Mugging.

  They are all using the same lever: **They are asking you to ignore the *likelihood* because they have inflated the *consequence* beyond your ability to intuitively scale it.**

  You don't need a paper to reject this. You just need to recognize that when the payoff becomes incomprehensible, the math stops describing reality and starts describing a fantasy. The "fix" is to refuse to play the game when the numbers leave the realm of human experience.
