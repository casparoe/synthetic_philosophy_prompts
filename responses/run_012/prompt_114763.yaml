answer: |-
  Your hypothesis is incisive and largely correct, but it identifies the *symptom* of the disagreement rather than the underlying *pathology*. The stalemate is indeed driven by conflicting norms of explanation and the risk of circularity regarding computational models. However, these philosophical divergences are not free-floating; they are anchored to a silent, unresolved empirical variable: the **statistical structure of the environment**.

  Here is a diagnosis of the disagreement, structured by the layers of your hypothesis.

  ### 1. The Explanatory Mismatch: Constraint vs. Mechanism
  You are right that this is not a disagreement about mathematics. Both sides accept the proof that, for example, 3-SAT is NP-complete. The disagreement is about **explanatory relevance**.

  *   **Side A (The Constraint View)** treats complexity results as *boundary conditions* on cognitive theory. This aligns with the "P-Cognition Thesis" (the mind must operate within polynomial time). For them, a hardness result functions like a law of thermodynamics: it doesn't tell you how the engine works, but it tells you that a perpetual motion machine is impossible. Citing NP-hardness explains *why* the mind uses heuristics: because exact computation is nomologically impossible for a bounded agent.
  *   **Side B (The Mechanistic/Ecological View)** treats complexity results as *abstract artifacts*. For them, an explanation of cognitive limitation requires a mechanistic story or an ecological fit. Knowing a problem is hard in the asymptotic limit explains nothing about why a human fails at a specific puzzle with $N=20$. To Side B, Side A is offering a "just-so story" dressed in formal wear.

  **Diagnosis:** The two sides are operating at different Marrian levels. Side A is making a claim about the **Computational Level** (the logic of the task), while Side B is demanding an explanation at the **Algorithmic/Implementational Level** (how the task is actually processed given specific inputs). Side A thinks the Computational Level constrains the Algorithmic; Side B thinks the Algorithmic (and the environment) determines the relevance of the Computational.

  ### 2. The Circularity and Model Dependence
  Your suspicion about circularity is well-founded. Computational complexity classes (P, NP, etc.) are defined relative to a specific machine model (usually the Turing Machine or RAM model) and a specific cost metric (time/space steps).

  *   **The Circularity Charge:** To use an NP-hardness result to explain a mental limit, one must assume the brain is relevantly similar to the machine model used in the proof. If the brain operates via parallel constraint satisfaction, quantum-like dynamics, or analog processing that doesn't map neatly to discrete step-counts, the complexity class may not apply.
  *   **The Hidden Presupposition:** Side A often smuggles in the assumption that the mind *is* a classical symbolic processor to prove that the mind *is limited* like a classical symbolic processor. Side B detects this question-begging. They argue that you cannot use a formal model to constrain the mind until you have independently established that the mind instantiates that model.

  **Diagnosis:** This is a category error risk. Side A treats the computational model as a **normative standard** (how a rational agent *should* be measured), while Side B treats it as an **empirical hypothesis** (how the brain *actually* works). Until the status of the machine model is settled, the complexity result remains inert.

  ### 3. The Hidden Empirical Question: The Ecology of Instances
  You ask if a hidden empirical question is doing the work. **Yes.** This is the pivot point.

  Complexity theory is predominantly **worst-case asymptotic analysis**. It asks: "How does resource usage grow as $N \to \infty$ on the hardest possible inputs?"
  Cognition happens in **finite, structured environments**. It asks: "How does resource usage behave for $N \approx 20$ on inputs generated by the physical world?"

  *   **Side A's Empirical Bet:** They assume the cognitive niche presents problems sufficiently general and unstructured that worst-case bounds are reachable or relevant.
  *   **Side B's Empirical Bet:** They assume the cognitive niche is highly structured (redundant, sparse, clustered). In "Average-Case Complexity" or "Smoothed Analysis," many NP-hard problems become tractable.

  **Diagnosis:** The disagreement persists because neither side has fully characterized the **distribution of instances** the human mind actually encounters. Side B (often aligned with Ecological Rationality) argues that heuristics work not because the problem is hard, but because the *environment* is kind. Side A argues that even in kind environments, the underlying logical structure imposes a tax that forces approximation. Without empirical data on the "entropy" of real-world cognitive tasks, the complexity argument is speculative.

  ### 4. Different Questions: Possibility vs. Actuality
  You suggest they are answering different questions under a single heading. This is accurate.

  *   **Side A asks:** "What is the space of *possible* solutions for *any* bounded agent?" (A question about **Competence** and universal limits).
  *   **Side B asks:** "Why does *this* agent fail at *this* task?" (A question about **Performance** and specific mechanisms).

  When Side A says, "The mind approximates because the task is hard," they are offering a **functional explanation**. When Side B says, "That explains nothing," they are demanding a **causal explanation**. A functional explanation tells you why a feature is necessary; a causal explanation tells you how the feature is produced. The stalemate exists because both sides believe their type of explanation is the only one that counts as "scientific" in this context.

  ### 5. What Counts as Progress?
  Progress is possible, but it requires shifting the terrain rather than winning the current argument.

  1.  **Change of Formal Tools (Most Promising):** The field is already moving toward **Parameterized Complexity** (championed by Iris van Rooij and others). This framework allows a problem to be NP-hard in general but tractable if specific parameters (e.g., the number of variables, the treewidth of the dependency graph) are small.
      *   *Why this helps:* It bridges the gap. It allows Side A to keep the hardness result (the problem is hard *in general*) while allowing Side B to claim tractability (the problem is easy *for the specific parameters the brain encounters*). It turns a binary "Hard/Soft" debate into a multidimensional search for the relevant cognitive parameters.

  2.  **Empirical Result (Necessary but Insufficient):** Mapping the **statistical structure of the cognitive niche**. If we can demonstrate that the inputs humans face consistently fall into "islands of tractability" within NP-hard spaces, Side B wins. If we show humans struggle precisely when those structural parameters are violated, Side A wins. Currently, we lack a rigorous taxonomy of "ecological complexity."

  3.  **Conceptual Distinction (Clarifying):** Distinguishing between **In-Principle Intractability** (mathematical limit) and **In-Practice Infeasibility** (resource limit). Much of the heat comes from conflating the two. A problem might be polynomial but still too slow for real-time cognition (e.g., $O(n^{10})$). Focusing on "Cognitive Tractability" (fixed resources, real-time) rather than "Computational Tractability" (asymptotic polynomial time) would dissolve much of the confusion.

  4.  **Dissolution (The Pessimistic View):** There is a risk the question is ill-posed. If "computation" is merely a metaphor for brain activity rather than a literal description, then citing complexity classes is a category error. Progress here would involve abandoning computational complexity for **dynamical systems theory** or **neuroenergetics** (e.g., explaining limits via metabolic cost rather than logical steps).

  ### Conclusion
  Your hypothesis is correct: the dispute is fundamentally about **explanatory norms** and **model dependence**. However, these philosophical positions are rigidified by an **unverified empirical assumption** regarding the structure of the environment.

  Progress will not come from proving more theorems or arguing harder about the nature of explanation. It will come from **Parameterized Complexity**, which mathematically formalizes the intuition that "hard problems can be easy on specific inputs." This tool allows both sides to be partially right: the task is formally hard (satisfying Side A), but the specific instances encountered by the organism are tractable (satisfying Side B). The remaining work is empirical: identifying which parameters the human mind tracks to keep itself in the tractable zone.
