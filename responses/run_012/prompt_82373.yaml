answer: |-
  You are right to be bugged. Your intuition that these are categorically different phenomena is correct, even though standard introductory texts often lump them together under "money pumps" or "dynamic inconsistency." The confusion arises because decision theory often treats time as just another dimension of state space, whereas your geology background rightly treats time as a process that transforms state.

  Here is the carving you are looking for.

  ### 1. The Names and The Distinction

  Case One is a **Synchronic Money Pump**. It relies on *intransitivity*. The preferences exist simultaneously in a logical contradiction ($A \succ B \succ C \succ A$). The error is structural, like a rock formation that violates the laws of stratigraphy. It is impossible to model this agent as maximizing *any* utility function at that moment.

  Case Two is what I will coin for you a **Diachronic Leakage**. (Some call it a "Diachronic Money Pump," but that implies the mechanism is the same, which it isn't. "Leakage" captures the loss without implying a logical loop). It relies on *preference drift*. The preferences are transitive at $t_1$, transitive at $t_2$, but $Preference(t_1) \neq Preference(t_2)$.

  The reason textbooks focus on Case One is that standard Expected Utility Theory assumes **fixed preferences**. It treats preferences as part of the agent's definition, not a variable. Case One breaks the math immediately. Case Two requires a more complex model of *personal identity over time* to even register as a problem. Case One is a logical error; Case Two is a metaphysical tension.

  ### 2. State Functions vs. Path Functions

  You asked if the "badness" is a property of the system (the man) or the path. Using your terminology:

  *   **In Case One (Synchronic):** The badness is a **State Function**. The agent is irrational *at the snapshot*. If you froze time, the contradiction exists. The loss of money is just the empirical proof of the logical flaw. The flaw is internal to the agent's architecture.
  *   **In Case Two (Diachronic):** The badness is a **Path Function**. If you freeze time at any point $t$, the agent is perfectly rational. There is no internal contradiction to find. The "loss" only exists when you integrate over the trajectory. The "worse off" is not a property of the agent at any moment, but a property of the *history* of the agent.

  This is why Case Two feels different. In Case One, the agent is broken. In Case Two, the agent is merely *permeable*.

  ### 3. Is He Irrational Without the Trader?

  This depends entirely on whether you define the "Agent" as a **Time-Slice** or a **Person-Stage**.

  *   **The Time-Slice View:** If the "agent" is just the person at moment $t$, then the drifting man is **not irrational**. He is maximizing utility correctly for that slice. The fact that a trader *could* exploit the sequence of slices is an externality, like bad weather. He is unlucky, not irrational. The trader is not revealing a flaw; the trader is harvesting a resource (preference volatility) just like a miller harvests river flow.
  *   **The Person-Stage View:** If the "agent" is the whole timeline (the sum of all slices), then the drifting man **is irrational** (or at least sub-rational). He is failing a norm of **Diachronic Consistency**. He is failing to act as a unified entity.

  Most philosophical discomfort with Case Two comes from trying to hold both views at once. We want to say the man at $t_1$ is rational (he knows what he wants), but the man over $T$ is irrational (he lost money for nothing).

  So, to answer your question: Without the trader, is he irrational?
  *   If rationality is **Synchronic**: No.
  *   If rationality is **Diachronic**: Yes.
  *   The trader doesn't *make* him irrational; the trader makes the Diachronic irrationality *costly*. Without the trader, the leakage still happens (he swaps goods for goods he later regrets), but the cost is paid in regret rather than cash.

  ### 4. Who is to Blame? (The Time-Slice Problem)

  You asked which time-slice made the mistake. In Case Two, **no single slice is at fault.**

  This is the crucial difference. In Case One, you can point to the agent and say, "Fix your ranking." In Case Two, if you point to the $t_1$ self, he says, "I wanted the bike then; I was right." If you point to the $t_2$ self, he says, "I wanted the camera then; I was right."

  This is not a failure of calculation; it is a failure of **governance**. The problem is that there is no "CEO" of the person over time. There is only a succession of local managers. The "badness" is a **coordination failure between temporal parts**.

  ### 5. Pre-commitment and Resentment

  You noticed that if he locks himself out (pre-commitment), the later self resents the earlier self. This is the **Ulysses Contract** problem.

  *   **Is the earlier self justified?** Only if you privilege the *Person-Stage* view (the whole timeline matters more than the slice). If the goal is to maximize the welfare of the whole path, the earlier self is rational to bind the later self.
  *   **Is the resentment justified?** Only if you privilege the *Time-Slice* view. The later self is sovereign at $t_2$. To him, the earlier self is a tyrant imposing dead-hand control.

  This confirms your suspicion that Case Two is fundamentally about **identity**, not logic. Case One is about math; Case Two is about politics (the politics of who rules the self over time).

  ### 6. Summary of the Carving

  To keep your mental map clean, I suggest this taxonomy:

  | Feature | Case One (Synchronic) | Case Two (Diachronic) |
  | :--- | :--- | :--- |
  | **Standard Name** | Money Pump (Cycle) | **Diachronic Leakage** (Coined) |
  | **Source of Error** | Intransitivity (Logic) | Preference Drift (Metaphysics) |
  | **Rationality Type** | State Function (Snapshot) | Path Function (Trajectory) |
  | **Blame** | The Agent (at $t$) | The Governance (across $t$) |
  | **Remedy** | Fix Preferences | Pre-commitment / Ulysses Pact |
  | **Without Trader** | Still Irrational | Merely Regretful |

  ### Conclusion

  You are not being fussy. The "Money Pump" label covers Case Two only by analogy, and a misleading one. Case One shows that your preferences are **impossible**. Case Two shows that your preferences are **expensive**.

  The "badness" in Case Two is a property of the **path**, not the state. The drifting man is not logically inconsistent; he is **diachronically vulnerable**. He is irrational only if you impose a duty of self-continuity that standard decision theory does not enforce.

  If you need a term to use in your own notes to distinguish it from the circular version, use **"Diachronic Leakage."** It excludes the logical contradiction of the cycle and includes the temporal cost of the drift. It marks the loss as a function of the route taken through time, not a defect in the vehicle.
