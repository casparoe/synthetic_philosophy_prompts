answer: |-
  **Credence: 0.35**

  I assign a 35% probability that a hard compromise exists for a randomly selected pair fitting your description. This places me closer to your friend (0.15) than to you (0.6). My lower estimate stems from the structural rigidity of "settled, consistent" moral systems, which often function as constraints rather than preferences.

  ### Decomposition

  I have adjusted your sub-questions slightly to isolate the mechanical barriers to trade. The probabilities represent the likelihood that the condition holds for a given pair.

  | Sub-Question | Probability | Note |
  | :--- | :--- | :--- |
  | **1. Commensurability** (Fine-grained ranking) | 0.85 | Most people can rank outcomes, even if inconsistently. Pure binary morality is rare in practice. |
  | **2. Non-Lexicality** (No absolute vetoes) | 0.45 | **Critical.** "Settled, consistent" values often contain sacred/lexical rules (e.g., "never torture") that forbid trade-offs by definition. |
  | **3. Complementarity** (Mismatched marginal utility) | 0.75 | It is rare that both parties value the exact same marginal unit of a moral good equally; usually, one side cares more about X, the other about Y. |
  | **4. Non-Corruption** (Trading doesn't destroy value) | 0.60 | Some values (justice, friendship, sanctity) lose worth if treated as tradable commodities ("taboo trade-offs"). |
  | **5. Epistemic Humility** (Uncertainty allows hedging) | 0.55 | If both are 100% certain they are right, compromise is sin. If <100%, compromise is risk management. "Mistaken but not unhinged" implies some humility, but not enough. |
  | **6. Enforcement** (Trust/Verification) | 0.70 | Moral bargains lack third-party enforcement. Defection is easy if the "cost" is internal guilt rather than external penalty. |

  ### Combination Logic

  These factors combine via a **weighted conjunctive model**. While some factors (like Complementarity) can be compensated for by others (like high Commensurability), the **Non-Lexicality** constraint acts as a binary gate. If either party holds a lexical value relevant to the dispute, the probability of a hard compromise drops to near zero for that issue.

  Because "settled, consistent" moral systems are more likely to contain lexical axioms than casual preferences, I weight Question 2 heavily. The calculation is not a strict product (which would yield ~0.03), but rather a cap: the final probability cannot significantly exceed the probability of the most restrictive necessary condition. Since only ~45% of such pairs likely lack lexical blockers, the ceiling is low. I adjust upward slightly from the strict minimum because some lexical values can be reframed (see "What to Learn"), resulting in **0.35**.

  ### Sensitivity Analysis

  The final figure is most sensitive to **Question 2: Non-Lexicality**.

  If you can convince me that "settled, consistent" moral values are rarely lexical (i.e., that people mostly have trade-off willing preferences rather than deontological constraints), my credence would jump to **0.65**. Conversely, if evidence suggests that moral consistency *requires* lexical priorities, my credence would drop to **0.20**.

  The second most sensitive is **Question 4: Non-Corruption**. If trading a moral concession inherently invalidates the moral standing of the trader (the "dirty hands" problem), the utility of the deal collapses for at least one party.

  ### What Would Move the Number

  To move this number significantly, do not look for more negotiation theory. Look for **empirical data on "Sacred Value Protection."**

  *   **Argument/Pattern:** Investigate the work of Philip Tetlock on "taboo trade-offs." He finds that attempting to trade sacred values often triggers *moral outrage* that radicalizes the other side, lowering the probability of agreement below the status quo.
  *   **Thought Experiment:** Consider the "Constitutional Compromise." If the two parties cannot agree on an *outcome* (e.g., abortion is legal vs. illegal), can they agree on a *process* (e.g., local voting, judicial review) that both rank above the status quo of conflict?
      *   *Direction:* If you can show that procedural agreements count as "hard compromises" on moral values, my number moves **up**. If you agree that only outcome-based deals count, my number stays **down**.
  *   **Real Negotiation:** Look at "logrolling" in legislative bodies on moral issues (e.g., the Hyde Amendment). Did this constitute a hard moral compromise, or did both sides simply pretend to compromise while maintaining their core stance? If the latter, the "compromise" was illusory, and my number moves **down**.

  ### Diagnosis of Disagreement

  You and your friend are likely disagreeing about the **ontology of moral values**, not just the probability of negotiation success.

  1.  **You (0.6)** are implicitly modeling values as **preferences**. In economics, preferences are always comparable and tradable given the right price. You view morality as a maximization problem where utility functions can be summed.
  2.  **Your Friend (0.15)** is implicitly modeling values as **constraints** or **identities**. In deontological or virtue ethics, certain actions are forbidden regardless of consequences. To trade them is not a "loss" but a "betrayal" or "corruption."

  **The Verdict:** You are talking past each other.
  *   If "values" means "what I want the world to look like" (Consequentialism), you are right; trade is usually possible.
  *   If "values" means "what I am willing to be held responsible for" (Deontology), your friend is right; trade is often impossible.

  Given your description ("settled," "consistent," "mistaken"), these sound like identity-constituting commitments, which favors your friend's model. However, since few people are perfectly consistent deontologists in practice, the truth lies in the middle, hence my 0.35.
