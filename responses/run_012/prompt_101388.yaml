answer: |-
  Here are nine questions designed for your podcast. They are ordered to build pressure throughout the interview, starting with the mechanics of her view, moving through the specific challenges you requested, and dwelling heavily on the tense/person issue as the main pressure point.

  I have included the required follow-ups for the three specific topics, keyed to the answers an expressivist typically gives.

  ### 1. The Nature of the "Stance"
  You describe the problem with Moorean sentences as a failure to express a coherent "practical stance." For our listeners who might not have a background in meta-ethics or action theory: what exactly are you committing to when you assert "It's raining"? Is this a social commitment to your audience, or is it something deeper about how your mind works?

  ### 2. The Omissive vs. Commissive Distinction **(Required)**
  There are two ways to be Moorean. There's the *omissive* case ("It's raining but I don't believe it") and the *commissive* case ("It's raining but I believe it's not"). Your view seems tailored to the omissive case, where you assert a fact but disavow the belief. But the commissive case feels absurd too. Does your account explain why asserting a fact while asserting a contradictory belief is just as incoherent as asserting a fact while denying belief altogether?

  *   **Follow-up (Keyed to likely answer):** *She will likely say that both cases involve expressing incompatible attitudes (believing $p$ vs. believing not-$p$).*
      *   **Ask:** "If both are just clashes of expressed attitudes, does your view erase the intuitive difference between being confused about your own mind (the omissive case) and actually holding contradictory beliefs (the commissive case)? It seems like one is a failure of honesty or self-knowledge, and the other is a failure of logic. Does your account capture that difference?"

  ### 3. The Knowledge Variant **(Required)**
  Let's swap out belief for knowledge. Consider the sentence: "It's raining but I don't know it's raining." That doesn't sound nearly as absurd as the belief version; in fact, it sounds like a humble admission. If your view is that assertion expresses a mental state, and asserting implies you have that state, why doesn't the knowledge version crash in the same way?

  *   **Follow-up (Keyed to likely answer):** *She will likely say that the norm of assertion is belief, not knowledge, or that knowledge entails belief but adds extra conditions.*
      *   **Ask:** "But if the absurdity comes from the clash between what I say and the state I'm in, why does adding the extra condition of 'knowledge' make the clash vanish? If I'm expressing a state I don't have, shouldn't it be absurd regardless of whether that state is belief or knowledge? Doesn't this suggest the paradox is about something specific to belief that your account might be missing?"

  ### 4. Pragmatics vs. Belief **(Required)**
  Here's the worry many philosophers have about expressivism: it sounds like you're telling a story about the *rules of conversation*, not a story about *belief*. If I sit silently in my room and think, "It's raining but I don't believe it," I seem to be in just as much trouble as if I said it out loud. Does your view imply that the absurdity disappears when I stop talking, or is thought itself a kind of expression?

  *   **Follow-up (Keyed to likely answer):** *She will likely say that thought is parallel to assertion, or that belief is constituted by its readiness to be expressed.*
      *   **Ask:** "If belief is constituted by its readiness to be expressed, does that mean a person who never asserts anything—maybe someone who is mute or extremely private—couldn't really have beliefs in the full sense? That seems like a high price to pay to solve the paradox."

  ### 5. The Disappearance in the Past Tense (Part 1)
  I want to press on what seems like the sharpest test for your view. The absurdity completely vanishes if I put the sentence in the past tense: "It was raining but I didn't believe it." That's a perfectly coherent thing to say. If the problem is a clash between what I express and what I believe, why does moving the event to the past resolve the clash? Did I stop expressing a stance?

  ### 6. The Disappearance in the Past Tense (Part 2)
  Following up on that: does this imply that belief is essentially a present-tense phenomenon? On your view, when I say "I didn't believe it," I'm not expressing a current belief state about the past, I'm describing a past state. Does your account require us to say that I can't genuinely express a belief about my own past beliefs in the same way I express current ones?

  ### 7. The Third-Person Case
  The absurdity also vanishes in the third person: "It's raining but he doesn't believe it." That's just a description of someone else's ignorance. If the absurdity comes from a failure of a coherent practical stance, why doesn't it apply when I take a stance on *your* beliefs? Is the "practical stance" something that only applies to the speaker, and if so, doesn't that make the paradox about the *speaker* rather than the *belief*?

  ### 8. Evidence Against the View
  Philosophical views need to be vulnerable to evidence. Suppose we found a group of people, or a specific context, where asserting "It's raining but I don't believe it" was treated as perfectly rational and coherent. Would that falsify your view, or would you say those people just aren't really asserting in the full sense? What would count as genuine evidence against doxastic expressivism?

  ### 9. Implications for Rationality
  If you're right, the lesson of Moore's paradox isn't that we can't hold contradictory beliefs, but that we can't *avow* them coherently. Does this change how we should think about rationality? Are we rational as long as we don't speak our contradictions out loud, or does your view imply that the very act of forming the belief is already a failure of rationality, even before we speak?
