  I'm helping out with a tiny philosophy podcast — we record in my co-host's kitchen, the audience is mostly undergrads plus a couple of grad students — and next month's guest is a philosopher who's been defending a view about Moore's paradox that she calls 'doxastic expressivism.' The basic idea is that the absurdity of a sentence like it's raining but I don't believe it's raining isn't a contradiction between two beliefs, but a failure to express a coherent practical stance: the first part commits you to something the second part disavows, and the whole thing makes the avowal and the disavowal in the same breath. I want the interview to actually press her, not just let her restate the view. Could you draft eight to ten questions? I definately want one on the omissive/commissive distinction (the difference between p but I don't believe p and p but I believe not-p), one on whether the account can handle the knowledge variant (p but I don't know p), and one on whether her view just collapses into a pragmatic story about assertion rather than a genuine story about belief. For each of those three, give me a follow-up question keyed to the answer she's most likely to give. I'd also like alot more on why the absurdity seems to disappear in the past tense or third person (like it was raining but I didn't believe it), since I think that's the sharpest pressure point, and one on what would count as evidence against her view. The audience knows the paradox but not the literature, so no name-dropping papers or authors — the questions should turn on the content. And please don't give me stuff like what got you interested in Moore's paradox.
