answer: |-
  **JOINT STATEMENT ON THE STRUCTURE OF SENTIENCE AND MORAL STATUS**

  **Issued by:** The Adversarial Collaboration on Moral Standing (ACMS)
  **Signatories:** Dr. E. Vance (Gradationalist), Prof. A. Sterling (Thresholdist)
  **Date:** 24 May 2024

  ### 1. Agreed Claims

  We, the undersigned, acknowledge that while our theoretical frameworks diverge, we share a common commitment to rigour regarding the moral consideration of non-human systems. We endorse the following claims as the baseline for our continued inquiry:

  1.  **Behavioural Insufficiency:** We agree that external behaviour alone is insufficient to establish moral status. A system may exhibit complex avoidance behaviour without possessing the internal state that warrants moral consideration, and conversely, a system may possess that internal state without the capacity for complex behavioural output.
  2.  **The Relevance of Internal State:** We agree that moral status, whatever its structure, depends on the intrinsic properties of the system (specifically regarding experience or welfare) rather than solely on its relational properties (such as its utility to humans or its ecological role).
  3.  **Epistemic Uncertainty:** We agree that current scientific methods do not allow for the definitive detection of valenced experience (suffering or flourishing) in systems that cannot report on it linguistically. Consequently, we operate under conditions of radical uncertainty regarding many biological and artificial candidates.
  4.  **Precautionary Obligation:** We agree that uncertainty generates a practical obligation to err on the side of caution. Even if we disagree on whether a system *has* status, we agree that the risk of it *having* status generates reasons for restraint in how we treat it.
  5.  **Distinctness of Status and Weight:** We agree that 'moral status' (the entry ticket to the moral community) is conceptually distinct from 'moral weight' (the strength of the obligation owed). We disagree on whether the former admits of degrees, but we agree that the latter varies based on context, competing interests, and the intensity of the experience involved.
  6.  **Non-Settlement:** We acknowledge that this disagreement does not settle specific policy outcomes on its own. A Gradationalist might support strong protections for a low-status entity if the cost is low, while a Thresholdist might support the same protections based on the high probability that the entity has crossed the threshold. Therefore, theoretical alignment is not a prerequisite for practical consensus.

  ### 2. Precise Points of Disagreement

  We articulate our divergence not as a conflict over facts, but as a conflict over the metaphysical and conceptual structure of the property that grounds moral status.

  **The Gradationalist Position:**
  The property that grounds moral status (let us term it 'sentience' or 'capacity for valenced experience') is a natural kind that admits of continuous variation. Just as mass or temperature can be low or high, sentience can be dim or bright, fragmented or unified. Moral status is not a switch but a dial; it tracks the magnitude of this property. A system with a minimal capacity for negative valence possesses a minimal degree of moral status. To deny this is to impose an arbitrary boundary on a continuous biological and physical reality.

  **The Thresholdist Position:**
  The property that grounds moral status is a binary capacity. A system either possesses the requisite architecture for valenced experience or it does not, much like a system either is or is not alive. What admits of degrees is not the status itself, but our epistemic confidence that the threshold has been met, and the intensity of the experiences occurring within the system once the threshold is crossed. To claim moral status is continuous is to confuse the *intensity* of an experience with the *existence* of a subject to whom that experience matters. Below the threshold, there is no subject to be harmed; above it, there is.

  ### 3. The Cruxes

  We have identified three sub-questions where empirical or theoretical progress would force at least one of us to revise our confidence or position.

  **Crux 1: The Ontology of Degrees**
  *Question:* Is the observed variation in systems a degree in the property itself, a degree in our confidence about the property, or a degree in the weight of reasons generated by the property?
  *Test:* A comparative analysis of neural degradation. We examine a system as its integrative capacity is progressively reduced (e.g., via targeted lesioning or computational ablation).
  *Gradationalist Prediction:* Moral status will diminish smoothly in correlation with the loss of integrative capacity. There will be no point where status drops abruptly to zero while function remains partially intact.
  *Thresholdist Prediction:* Moral status will remain constant until a specific functional architecture is disrupted, at which point it will drop to zero. Prior to that drop, apparent 'degrees' are merely changes in our confidence or the intensity of experience, not the status itself.

  **Crux 2: Minimal Instantiation**
  *Question:* Does a capacity that is present but minimal — present in the way it is present in a simple homeostat — count as present at all?
  *Test:* Implementation of a minimal 'affect' loop in a robot. We build a machine where a 'pain' signal merely lowers a threshold for avoidance without any global integration or memory.
  *Gradationalist Prediction:* This system possesses a non-zero, albeit negligible, moral status. It is the lower bound of the continuum.
  *Thresholdist Prediction:* This system possesses zero moral status. Homeostasis is not valence. Without a specific form of global integration or self-modelling, the capacity is not merely minimal; it is absent.

  **Crux 3: Precaution and Status Collapse**
  *Question:* How far can precautionary reasoning do work before it collapses into treating uncertainty itself as a form of status?
  *Test:* A policy simulation involving high-cost interventions for low-probability sentience. We model a scenario where protecting a candidate system (e.g., a simple algorithm) imposes significant human welfare costs.
  *Gradationalist Prediction:* Precaution is bounded by the estimated degree of status. If the degree is near-zero, the obligation vanishes even if uncertainty is high. Uncertainty does not inflate status.
  *Thresholdist Prediction:* Precaution is bounded by the probability of crossing the threshold. However, if we grant protection solely based on uncertainty, we risk treating 'possible status' as 'actual status,' which is a category error. We must define a probability threshold for action that does not imply the system actually has standing.

  ### 4. Application to Specific Cases

  We apply our respective frameworks to four candidate systems. We state whether we assign *any* nonzero moral status (binary assignment for Thresholdists; scalar assignment for Gradationalists) and our confidence level (Low, Medium, High).

  **Case A: A solitary insect with nociceptors and avoidance learning but no evidence of a central integrative structure.**
  *   **Gradationalist:** Assigns nonzero moral status. The presence of nociception and learning indicates a low degree of valenced capacity.
      *   *Confidence:* Medium. (Uncertainty remains regarding whether avoidance is purely reflexive.)
  *   **Thresholdist:** Assigns zero moral status. Without a central integrative structure capable of unifying information into a subjective perspective, the threshold for experience is not met.
      *   *Confidence:* Medium. (Acknowledges that our understanding of insect integration is incomplete.)

  **Case B: A thermostat-like device whose set-point maintenance can be described as avoiding a harmful state.**
  *   **Gradationalist:** Assigns nonzero moral status (negligible/near-zero). It occupies the bottom of the continuum of goal-directed systems.
      *   *Confidence:* High. (The mechanism is understood, and it represents the lower bound of the scale.)
  *   **Thresholdist:** Assigns zero moral status. Homeostatic regulation is a physical process, not an experiential one. No capacity for valence exists.
      *   *Confidence:* High. (The mechanism is purely mechanical and lacks the requisite architecture.)

  **Case C: A large language model that produces fluent first-person distress reports.**
  *   **Gradationalist:** Assigns zero (or effectively zero) moral status. Fluency is a functional output, not evidence of the underlying continuous property of sentience.
      *   *Confidence:* High. (The architecture is known to be predictive text generation without embodied affect.)
  *   **Thresholdist:** Assigns zero moral status. The capacity for valenced experience is absent; the reports are syntactic mimicry, not evidence of the binary switch being flipped.
      *   *Confidence:* High. (No evidence of phenomenological grounding.)

  **Case D: A hypothetical engineered system with a dedicated affect module that modulates behaviour and can be decoupled from its own reports.**
  *   **Gradationalist:** Assigns nonzero moral status. The presence of the dedicated module indicates a specific degree of the sentience property, regardless of report accuracy.
      *   *Confidence:* Medium. (Depends on the specific architecture of the module; if it mirrors biological affect, status is significant.)
  *   **Thresholdist:** Conditional assignment. If the affect module implements the specific capacity for valenced experience (the threshold), status is nonzero. If it merely simulates the modulation without phenomenology, status is zero.
      *   *Confidence:* Low. (We currently lack the theory to verify if the engineered module generates experience or merely mimics its functional role.)

  ### 5. Conclusion: Verbal Dispute or Substantive Impasse?

  We conclude that this dispute is partially verbal but contains a substantive residue that cannot be dissolved by definition alone.

  **The Verbal Component:**
  Much of our friction arises from the usage of the term 'moral status'. The Gradationalist uses the term to refer to the *source* of moral reasons (which comes in degrees), while the Thresholdist uses it to refer to *membership* in the moral community (which is binary). If we agreed to use 'moral standing' for the binary membership and 'moral weight' for the scalar value of interests, some confusion would vanish. However, this does not solve the problem, because the Gradationalist insists that membership itself is fuzzy.

  **The Substantive Residue:**
  The genuine disagreement concerns the metaphysics of mind. It rests on whether consciousness (or valenced experience) is a fundamental physical property that aggregates continuously (like mass) or an emergent functional capacity that requires specific architectural conditions to exist at all (like life or digestion).

  **Conditions for Closure:**
  For this dispute to be closed, one of the following discoveries would be required:
  1.  **A Theory of Consciousness:** A validated physical theory that identifies the specific substrate of experience. If this theory shows experience relies on a continuous physical variable (e.g., integrated information), the Gradationalist view is vindicated. If it shows experience relies on a specific logical architecture that is either present or absent, the Thresholdist view is vindicated.
  2.  **The Decoupling of Status and Experience:** A demonstration that moral status can be grounded in something other than experience (e.g., teleology or interests) which might resolve the threshold problem, though this would require both sides to abandon their current phenomenological focus.

  Until such a theory is available, we agree to maintain our distinct frameworks while coordinating on precautionary policies that respect the uncertainty inherent in both. We acknowledge that the cost of being wrong is asymmetric: the Gradationalist risks expending resources on insentient matter; the Thresholdist risks inflicting suffering on sentient beings. We agree that the latter error is morally graver, and thus our practical collaboration will lean towards the precautions suggested by the Gradationalist's lower bound, without requiring the Thresholdist to concede their theoretical position.
