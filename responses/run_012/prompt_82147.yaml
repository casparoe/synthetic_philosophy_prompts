      *   **Input Data (User's Gut Reactions):**
          1.  *Rescue:* Fawn in ice, stunned bird, flipped turtle = **Intervene.**
          2.  *Predation:* Fox eating rabbit, cat eating mouse = **Do Not Intervene.**
          3.  *Starvation (General):* Deer starving in woods = **Do Not Feed.**
          4.  *Starvation (Specific/Close):* One deer starving in yard = **Feed.**
          5.  *Pests:* Mosquitoes, kitchen mice = **Kill/Trap.**
          6.  *Empathy:* Octopus documentary = **High Empathy.**
          7.  *Wild Suffering:* General horror at wild death = **Feel awful, but Do Not Fix.**
          8.  *Disease Intervention:* Vaccine for chimps = **Yes.**
          9.  *Eradication:* Gene drive for malaria mosquitoes = **No/Hesitant.**
      *   **User's Proposed Rule:** "Helping an animal suffering from something that isn't another animal is fine, interfering with animals eating each other isn't, and anything big and deliberate isn't either."
      *   **User's Identified Conflicts:** Starving deer (woods vs. yard), Disease (chimps vs. mosquitoes), Scale/Intent ("big and deliberate").
      *   **Questions to Answer:** Is there a unifying principle? What does it say about new cases (predator hunger, birth control, laissez-faire disease)? Which verdicts must be sacrificed?

  2.  **Deconstruct the User's Intuitions:**
      *   *Rescue vs. Predation:* This is a classic distinction in animal ethics. Accidental harm (ice, road, window) vs. Natural process (hunting). The user sees humans as responsible for fixing *human-adjacent* accidents but not natural *biological* processes.
      *   *Woods vs. Yard (Starvation):* This is the biggest inconsistency. Biologically, the deer are the same. The difference is *proximity* and *relationship*. In the woods, they are "Wild." In the yard, they are "Neighbors/Pets-ish."
      *   *Pests vs. Charismatic Megafauna:* Mosquitoes/Mice vs. Deer/Chimps/Octopuses. This suggests a hierarchy of moral worth based on sentience, relationship to humans, or nuisance value.
      *   *Vaccine vs. Gene Drive:* Saving existing individuals (chimps) vs. Eradicating a species (mosquitoes). This is a "Conservation/Existence" vs. "Welfare" distinction.
      *   *Wild Suffering:* Acknowledging the horror but refusing to act. This is the "Laissez-Faire Intuition."

  3.  **Identify Potential Ethical Frameworks:**
      *   *Laissez-Faire Intuition:* Nature has its own order; humans shouldn't interfere unless we caused the problem. (Fits: Fox/Rabbit, Woods Deer. Conflicts: Chimps Vaccine, Fawn in Ice).
      *   *Relational Ethics:* Duties depend on the relationship between human and animal. (Fits: Yard Deer vs. Woods Deer, Cat vs. Fox).
      *   *Capacity for Suffering (Sentience):* Higher sentience = more protection. (Fits: Octopus/Chimp vs. Mosquito. Conflicts: Mouse in kitchen).
      *   *Causality/Responsibility:* If humans caused it, fix it. If nature caused it, leave it. (Fits: Ice/Road vs. Fox/Rabbit. Conflicts: Chimps Vaccine).
      *   *Feasibility/Hubris:* Small interventions are okay; large ecological engineering is dangerous. (Fits: Vaccine vs. Gene Drive, Turtle vs. Starving Deer).

  4.  **Synthesize a "Unified Theory" for the User:**
      *   The user's intuitions aren't random; they cluster around a few specific axes.
      *   *Axis 1: Causality.* Did humans create the threat? (Ice/Window/Road = Yes/Adjacent. Fox/Rabbit = No.)
      *   *Axis 2: Proximity/Relationship.* Is the animal in "our space" or "their space"? (Yard = Our space. Woods = Their space.)
      *   *Axis 3: Scale/Hubris.* Is this a one-off rescue or ecosystem engineering? (Vaccine = Targeted. Gene Drive = Erasure. Feeding all deer = Dependency.)
      *   *Axis 4: Sentience/Kindness.* Do we like the animal? (Octopus/Deer = Yes. Mosquito = No.)

      *   *The Strongest Candidate:* **The "Stewardship vs. Wildness" Boundary.**
          *   We are stewards of the "domesticated/adjacent" sphere (yards, roads, windows).
          *   We are observers of the "wild" sphere (woods, predation, natural disease).
          *   *Exception:* When we *can* alleviate suffering in the wild without destroying the "wildness" (Chimp vaccine), we might, but we won't erase species (Mosquitoes) or stop natural cycles (Predation).

      *   *Wait, there's a tension:* The Chimp Vaccine contradicts the "Don't fix wild suffering" rule. Why is Chimp Vaccine okay? Probably because it's *medical aid* (like a vet) rather than *ecological management*.
      *   *Refined Principle:* **Intervene on behalf of individuals when the harm is accidental or human-adjacent, or when medical aid is feasible without ecological collapse. Do not intervene in natural ecological processes (predation, starvation, population control) to maintain the integrity of the "Wild."**

  5.  **Address the Inconsistencies (The "Hypocrisy" Check):**
      *   *Woods Deer vs. Yard Deer:* This is the weak point. The principle relies on "Human Space" vs. "Wild Space." A yard is human space. Woods are wild space. It's consistent *if* you accept the boundary of the property line matters morally. It's inconsistent if biology matters more than geography.
      *   *Mosquitoes vs. Chimps:* Sentience + Ecological Role. Mosquitoes are vectors/disease; Chimps are high-sentience victims. Also, Eradication (Gene Drive) vs. Treatment (Vaccine).
      *   *Mouse in Kitchen vs. Deer in Woods:* Pests violate human space; Deer in woods respect it.

  6.  **Develop the "Test Cases":**
      *   *Predators not feeling hungry:* Violates "Natural Process." Verdict: No.
      *   *Birth control to prevent starvation:* Violates "Natural Process/Population." Verdict: No (usually).
      *   *Letting disease run:* Consistent with "Wildness." Verdict: Yes (unless it's human-caused).

  7.  **Drafting the Response:**
      *   *Validation:* Acknowledge that these intuitions are actually very common and philosophically recognized (The Laissez-Faire Intuition).
      *   *Naming the Principle:* Propose **"The Boundary of Human Responsibility"** mixed with **"The Integrity of Wildness."**
      *   *Breaking it Down:*
          1.  *Accidental/Human-Caused Harm:* Fix it (Ice, Road, Window).
          2.  *Natural Processes:* Don't fix it (Predation, Starvation, Disease).
          3.  *The "Yard" Exception:* Proximity creates a duty of care (Domestication-lite).
          4.  *The "Hubris" Limit:* Small aid (Vaccine) okay, Big Engineering (Gene Drive/Ecosystem) not okay.
      *   *Addressing the Conflicts:*
          *   *Deer:* It's about *relationship*, not biology. Yard deer are quasi-pets.
          *   *Mosquitoes:* It's about *value* (sentience/ecosystem role) and *method* (eradication vs. aid).
      *   *Answering the New Cases:* Apply the principle.
      *   *The Hard Truth:* To be consistent, the user must admit their ethics are *anthropocentric* (human-centered) and *relational*, not based on universal animal rights. They need to accept that geography (yard vs. woods) determines moral worth.

  8.  **Refining the Output:**
      *   Make sure not to preach.
      *   Use the user's examples.
      *   Highlight the "Starving Deer" contradiction as the key tension point.
      *   Suggest that the "Principle" is essentially **Conservative Stewardship**: Fix what we break, care for what comes near, but leave the wild systems alone to function, even if painful.

  9.  **Self-Correction/Review during drafting:**
      *   *Did I answer the specific question?* "Is there a principle?" Yes. "What does it say about cases I haven't thought of?" Yes. "Which verdicts do I have to give up?" Yes.
      *   *Tone:* Empathetic but analytical.
