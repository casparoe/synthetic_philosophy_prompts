      *Self-Correction on Limitations:* Must admit this doesn't solve the empirical question.

      *Refining the Numbers:*
      Scenario A: 1 Million entities, 100% status. Total EV = 1,000,000.
      Scenario B: 1 Trillion entities, X% status.
      If X = 0.0001% (1 in 1 million), Total EV = 1,000,000. (Break-even).
      If X = 0.001% (1 in 100,000), Total EV = 10,000,000. (B dominates).
      This makes the arithmetic transparent.

      *Refining the Rounds:*
      Round 1: Simple EV.
      Round 2: Threshold (Binary vs Continuous).
      Round 3: Resource Constraint/Opportunity Cost.

