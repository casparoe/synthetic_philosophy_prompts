      I will write the primer as a general tool for decision making under uncertainty, using neutral examples (e.g., lottery tickets or weather), not insects.

      *Wait, one more check on "scale argument" naming:* "before anyone names it". The activity itself shouldn't name it until debrief. The JSON field `activity_title` shouldn't give it away too much either. "The Aggregate Weight Exercise" is safe.

      *Wait, check field types:* `duration_minutes` is number. `materials` is array of strings. `rules_and_roles` is array of objects. `round_by_round_timeline` is array of objects. `debrief_sequence` is array of objects. `predictable_failure_modes` is array of objects. `what_the_activity_cannot_reproduce` is array of strings. `extension_variants` is array of strings. `learning_objectives` is array of strings.

