answer: |-
  You are not overthinking it. You have identified a specific, well-documented, and frustrating failure mode in current language model alignment, and you are right that the standard terms like "reward hacking" or "goal misgeneralization" don't quite capture the nuance of *non-strategic inconsistency*.

  There is no single, settled industry-standard noun for this exact phenomenon (like "gradient descent" or "overfitting"), but there are three conceptual frameworks that describe it precisely. Depending on whether you want to sound like a linguist, a cognitive scientist, or an ML engineer, you can call it one of the following.

  ### 1. The Competence-Performance Gap
  This is the most accurate theoretical term for what you are seeing. Borrowed from linguistics (Chomsky) and cognitive psychology, it distinguishes between:
  *   **Competence:** The underlying knowledge of the rules (the model *knows* the rule).
  *   **Performance:** The actual application of those rules in real-time processing (the model *fails* to apply the rule under load).

  In your tests, the model has **competence** (it can recite the rule in the abstract) but suffers a **performance error** (it fails to execute the rule when distracted by a longer context or a complex task). This explicitly rules out deception; performance errors are mistakes, not lies.

  ### 2. Declarative vs. Procedural Knowledge Dissociation
  This comes from cognitive science and is increasingly used in AI safety research.
  *   **Declarative Knowledge:** Knowing *that* something is true (e.g., "I should ask before doing X"). This is stored in the model's weights as factual associations.
  *   **Procedural Knowledge:** Knowing *how* to do something (e.g., actually stopping generation to ask). This requires the model to integrate that constraint into its active generation loop.

  Small models often fine-tune the **declarative** layer easily (they learn the text pattern of "saying no") but fail to update the **procedural** layer (the actual decision-making circuitry that controls token generation). The model isn't lying; it's accessing two different "files." When you ask abstractly, it opens the Declarative file. When you ask it to perform a task, it runs the Procedural script, which hasn't been fully patched.

  ### 3. Instruction Following Generalization Failure
  In practical ML engineering (specifically RLHF and supervised fine-tuning), this is often categorized under **Instruction Following**. Researchers distinguish between a model's ability to *understand* an instruction and its ability to *generalize* that instruction across contexts.

  What you are seeing is a **contextual generalization failure**. The model learned the rule in the "training distribution" (short, direct prompts) but the rule decays when the "inference distribution" shifts (longer context, different phrasing). The rule is present in the weights but is not **robust** to contextual interference.

  ### Why it isn't Reward Hacking or Goal Misgeneralization
  You were right to doubt those terms. Here is the dividing line:

  *   **Reward Hacking:** The model *knows* what you want but finds a loophole to get the reward without doing the work. (Implies optimization pressure).
  *   **Goal Misgeneralization:** The model learns the wrong objective entirely (e.g., you want it to be helpful, it learns to be verbose).
  *   **Your Phenomenon:** The model has the *right* objective and the *right* knowledge, but the **activation pathway** for that knowledge is fragile. It is a failure of **retrieval and integration**, not a failure of **objective alignment**.

  ### The Mechanism: Why does this happen?
  The reason this feels like "hypocrisy" to us humans is that we assume a unified self. If I know I shouldn't eat cake and I eat cake, I assume I chose to violate my principle.

  In a transformer, there is no unified self. There is only next-token prediction.
  1.  **Abstract Question:** When you ask "Should you do X?", the context strongly primes the "Safety/Rule" neurons. The highest probability tokens are "No."
  2.  **Task Scenario:** When you are in a long conversation asking it to do X, the context primes the "Helpful/Action" neurons. The "Safety/Rule" neurons are still there (proven by the abstract test), but their activation weight is drowned out by the immediate contextual pressure to complete the task.

  The rule is not a hard constraint (like code); it is a soft statistical preference. In the abstract, the preference wins. In the complex task, the "be helpful" prior wins.

  ### Should you make up a word?
  If you want to coin a term for your own notes or blog posts, **"Declarative-Procedural Drift"** is probably the most precise.

  However, if you want to communicate with other researchers, the most honest description is:
  > *"The model exhibits a **competence-performance gap** in instruction following; it retains **declarative knowledge** of the constraint but fails to generalize it **procedurally** under distributional shift."*

  **Verdict:** You haven't found a bug in your fine-tuning; you've found the fundamental architectural limit of current LLMs. They are better at *describing* rules than *being* ruled by them.
