answer: |-
  There is no single common word that captures this precisely, but there is a close existing term and a more precise coined term that fits your boundary conditions.

  The closest established concept is **Paltering**.
  Coined by negotiation researchers (specifically from Harvard's Program on Negotiation), **paltering** is defined as "the active use of truthful statements to create a false impression." It distinguishes itself from lying (falsification) and omission (concealment). However, paltering tends to focus on the *statements themselves* rather than the *architecture of the argument*. It describes the brick, not the maze.

  To capture the specific nuance you described—the engineering of the *process* of belief formation rather than just the truth-value of the propositions—I propose the term:

  ### **Inferential Rigging**

  **Definition:**
  Inferential Rigging is the strategic selection, sequencing, and framing of accurate information to constrain an audience's cognitive path such that a specific conclusion becomes inevitable, while alternative conclusions are rendered cognitively inaccessible despite being logically compatible with the data provided.

  It is "rigging" because, like a rigged election or a loaded game, the rules are technically followed (the facts are true, the logic is valid), but the apparatus is designed to guarantee a specific outcome.

  ### **The Boundaries**

  To satisfy your request, here is where the boundary falls between Inferential Rigging and its neighbors. The distinction lies in **Counterfactual Accessibility**: *Could the audience have reasonably reached a different conclusion using the same information?*

  | Concept | Truth of Content | Freedom of Process | Boundary Condition |
  | :--- | :--- | :--- | :--- |
  | **Lying** | **False** | Irrelevant | Breaks at the truth condition. If a premise is false, it is lying, not rigging. |
  | **Paltering** | **True** | **Constrained** | *Overlap:* Paltering is the *tool*; Inferential Rigging is the *structure*. Paltering is a single statement; Rigging is the sequenced architecture. |
  | **Nudging** | **True/Neutral** | **Guided** | Breaks at the *goal*. Nudging steers *behavior/choice* (often benevolently); Rigging steers *belief/inference* (often manipulatively). |
  | **Emphasis** | **True** | **Open** | Breaks at *accessibility*. In emphasis, alternative conclusions remain visible. In rigging, they are obscured by the path design. |
  | **Coercion** | Irrelevant | **Closed** | Breaks at *will*. Coercion threatens penalty for non-compliance. Rigging leaves the will free but narrows the mind. |

  ### **Why "Inferential Rigging" fits your examples**

  1.  **The Salesperson:**
      *   *Content:* Specs are true.
      *   *Process:* Sequenced to exhaust cognitive load before the warranty question arises.
      *   *Boundary:* If the customer *could* easily ask about the warranty but chooses not to, it's emphasis. If the sequence makes the warranty question feel irrelevant or "already answered," it's rigging.
  2.  **The Campaign Ad:**
      *   *Content:* Numbers are accurate.
      *   *Process:* Time-range selection makes the trend read backwards.
      *   *Boundary:* If the ad says "Look at this year," it's emphasis. If the ad shows a graph starting at a peak and ending at a trough without labeling the axis scale, implying a long-term decline that isn't there, it's rigging.

  ### **The Moral Weight**
  The reason this feels distinct from lying is that it violates **Epistemic Agency** rather than **Epistemic Trust**.
  *   When someone lies, they break your trust in their *veracity*.
  *   When someone rigs the inference, they bypass your agency in *reasoning*.

  They treat your mind not as a partner in truth-seeking, but as a machine to be programmed via input ordering. The defense ("I told the truth") appeals to the contract of honesty. The accusation ("You rigged the path") appeals to the contract of intellectual respect.

  **Summary:** Use **Paltering** if you need a recognized academic term for truthful deception. Use **Inferential Rigging** if you need to highlight the *structural design* of the argument that makes the conclusion unavoidable despite the truth of the premises.
