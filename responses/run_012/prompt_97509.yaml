      *   Load-bearing vs. Camp preferences distinguished? Yes.

  10. **Final Output Generation** (Proceeding to generate response based on these thoughts).
answer: |-
  Here is the specification sheet. If your reading group is going in circles, it is likely because you are debating *which* theory fits the data before agreeing on *what the data requires*. The following are the non-negotiable functional requirements for any naturalistic account of complex, functional structure.

  ### I. The Spec Sheet: Desiderata for Non-Designer Explanations

  These are divided into Ontological Constraints (what exists), Explanatory Constraints (how the account works), and Empirical Constraints (what it must cover).

  #### A. Ontological Constraints (The "No Magic" Rules)

  **1. Causal Continuity (The "No Gaps" Requirement)**
  *   **The Requirement:** Every state of the system must be causally derivable from a prior state plus lawful regularities. There can be no discontinuous jumps in information or functional specification.
  *   **Forcing Consideration:** If you allow a gap, you have inserted a skyhook. If the transition from non-replicating chemistry to replicating biology requires a jump in functional specification that physics doesn't bridge, you have a miracle.
  *   **Test Case:** **Origin of Life.** The theory must bridge the gap between thermodynamic equilibrium and autopoiesis without positing a "spark" of life.

  **2. Non-Teleological Mechanism (The "No Foresight" Requirement)**
  *   **The Requirement:** The fundamental drivers of the process cannot "know" where they are going. Selection filters *after* the fact; it does not pull *toward* the future.
  *   **Forcing Consideration:** If the mechanism anticipates the need for an eye, it is a designer. The appearance of design must be a retrospective artifact of filtering, not a prospective goal.
  *   **Test Case:** **The Vertebrate Eye.** The theory must explain the retina without implying the organism was trying to see.

  **3. Level-Respect (The "No Greedy Reduction" Requirement)**
  *   **The Requirement:** The explanation must acknowledge intermediate levels of organization. You cannot explain a behavior solely by quark physics, nor solely by cultural norms, if the causal power resides in the biological/psychological intermediate.
  *   **Forcing Consideration:** Causal powers emerge at specific levels of complexity. Ignoring the level where the work is actually done renders the explanation vacuous (true but useless) or false (missing the actual mechanism).
  *   **Test Case:** **Minds.** You cannot explain belief fixation solely via neuronal firing (too low) or solely via rational choice (too high). The cognitive architecture level is load-bearing.

  #### B. Explanatory Constraints (The "No Cheating" Rules)

  **4. The Order/Complexity Distinction**
  *   **The Requirement:** The theory must distinguish between *order* (low entropy, e.g., a crystal) and *complexity* (specified functionality, e.g., a ribosome).
  *   **Forcing Consideration:** Physics explains crystals easily (energy minimization). If your theory explains eyes the same way it explains snowflakes, it has failed to capture *function*. Crystals are inevitable; eyes are contingent and specific.
  *   **Distinction to Maintain:** **Order vs. Complexity.** Collapsing these allows you to claim natural selection is just thermodynamics, which it isn't.

  **5. The Crane/Skyhook Discrimination**
  *   **The Requirement:** The theory must identify *amplifiers*. A crane is a mechanism that makes further design easier (e.g., the evolution of the genetic code). A skyhook is a purported mechanism that creates design without prior capacity.
  *   **Forcing Consideration:** Evolution is exponential. Without cranes (mechanisms that speed up variation/selection), there hasn't been enough time in the universe for current complexity.
  *   **Distinction to Maintain:** **A Crane vs. A Small Skyhook.** A "small skyhook" is a mechanism posited to do work it isn't complex enough to do yet (e.g., positing natural selection before replication exists).

  **6. Selection vs. Mere Sorting**
  *   **The Requirement:** The theory must distinguish between *winnowing* (sorting existing variants) and *selection* (winnowing + retention/replication of the winner).
  *   **Forcing Consideration:** Sorting alone degrades variance (like sifting sand). Selection accumulates variance (like breeding dogs). If you conflate them, you cannot explain accumulation of complexity.
  *   **Distinction to Maintain:** **Selection vs. Sorting.** Collapsing these makes evolution look like erosion rather than construction.

  #### C. Empirical Scope (The "Coverage" Rules)

  **7. The Domain Boundary Question**
  *   **The Requirement:** The theory must explicitly state whether its mechanism is substrate-neutral.
  *   **Forcing Consideration:** Does the same logic explain **Culture, Markets, and Ecosystems**?
      *   *Option A (Universal Darwinism):* Yes. These are evolutionary algorithms with different replicators (memes, money, genes).
      *   *Option B (Biological Particularism):* No. Only genetic replication supports true selection; culture/markets are analogies at best.
  *   **Verdict:** This is not a category error *if* the mechanism is defined abstractly (variation, selection, retention). However, if the theory relies on specific biochemistry, extending it to markets is a category error. The spec demands you pick one.

  ---

  ### II. Chewing on Your Two Sticking Points

  #### 1. Is "No Unexplained Lifting" the only real rule?
  **Verdict:** It is the **necessary condition**, but not the **sufficient condition**.

  Your friend is half-right. "No unexplained lifting" is the budget constraint: *You cannot spend design credit you haven't earned.* This rules out Skyhooks. However, it does not tell you *how* to earn the credit.
  *   **Why it's not enough:** You can satisfy "no unexplained lifting" by simply pushing the complexity back to the Big Bang (Determinism). If the initial conditions of the universe contained the code for the eye, and physics just unfolded it, you have no skyhooks. But you also have no *evolution*. You have merely relocated the designer to the initial boundary conditions.
  *   **The Fix:** The rule must be: "No unexplained lifting **and** no initial pre-specification." The complexity must be *generated* during the process, not merely *revealed*.

  #### 2. Is Greedy Reductionism just Skyhook-thinking reversed?
  **Verdict:** Yes, structurally. They are the same sin committed in opposite directions.

  *   **Skyhook:** Imports causal power from "above" (a future goal, a divine mind, a vital force) that doesn't exist in the parts.
  *   **Greedy Reductionism:** Exports causal power "down" to a level (atoms, physics) that lacks the vocabulary to describe the function.
  *   **The Common Failure:** Both skip the **Level of Organization** where the work is actually done.
      *   *Skyhook:* "The eye exists to see." (Skips the mechanism).
      *   *Greedy Reductionist:* "The eye exists because of quantum electrodynamics." (Skips the organ).
  *   **Why it matters:** Greedy reductionism is often more seductive because it sounds "harder" or more "scientific." But saying "consciousness is just neurons" is a skyhook if you cannot show *how* neurons sum to consciousness. It assumes the lifting is done by the lower level without demonstrating the crane (the neural architecture) that does the lifting.

  ---

  ### III. Incompatibilities and Load-Bearing Constraints

  #### A. Incompatible Desiderata Pairs
  You cannot jointly satisfy these without significant theoretical cost:

  1.  **Universalism (Desideratum 7) vs. Level-Respect (Desideratum 3)**
      *   *Conflict:* If you insist that the *exact same* algorithm explains genes, memes, and markets (Universalism), you risk flattening the distinct causal powers of biology vs. culture (violating Level-Respect). If you respect the levels, you may have to admit that cultural evolution works differently than biological evolution, breaking Universal Darwinism.
      *   *Resolution:* You must define the algorithm abstractly enough to cover both, but concretely enough to explain the differences. Most theories fail one side.

  2.  **Causal Continuity (Desideratum 1) vs. Tractability**
      *   *Conflict:* A truly continuous account from physics to mind is computationally intractable and arguably impossible for humans to model. We *need* to skip levels to understand anything.
      *   *Resolution:* Accept that the *ontology* must be continuous, but the *explanation* can be layered. (This is Dennett's move).

  #### B. The Single Load-Bearing Requirement
  If you only enforce one rule, this is the one that kills the most candidates:

  **The Non-Triviality Constraint (Order vs. Complexity)**

  *   **Why:** Most bad theories fail here.
      *   Thermodynamics explains order (crystals).
      *   Randomness explains noise.
      *   **Only Evolution explains Complexity (Functional Specificity).**
  *   **The Kill Shot:** If a theory explains the eye using the same principles that explain a pile of sand or a salt crystal, it is wrong. The theory *must* account for **contingent functionality**. The parts must fit together for a specific purpose that could have been otherwise.
  *   **Why it rules out candidates:**
      *   Rules out **Self-Organization** theories that claim complexity arises spontaneously from physics (they explain order, not function).
      *   Rules out **Intelligent Design** (it explains function, but violates Causal Continuity).
      *   Rules out **Greedy Reductionism** (physics explains necessity, not contingent function).

  #### C. Load-Bearing vs. Camp Preferences
  Don't waste weeks debating these. They are aesthetic or tribal, not structural.

  *   **Camp Preference:** "Adaptationism is true." (Whether *every* trait is selected for is a detail, not a structural requirement for the theory of evolution itself).
  *   **Camp Preference:** "Replicators must be digital." (Analog replication is possible, though less stable. Don't make digitality a hard constraint unless you're ruling out pre-biotic chemistry).
  *   **Camp Preference:** "Group Selection is real." (This is a parameter setting, not a spec violation. As long as the unit of selection is defined, the level doesn't break the theory).
  *   **Load-Bearing:** "There must be a mechanism for retention." (If you can't keep the good stuff, you can't build).
  *   **Load-Bearing:** "Variation must be blind." (If variation is directed toward the solution, you have a skyhook).

  ### Summary for the Group
  Stop asking "Is Dennett right?" Ask: "Does this account explain **functional specificity** without **foresight** and without **skipping the causal ladder**?"

  If a paper explains the eye by physics, it's greedy reductionism.
  If it explains the eye by "need," it's a skyhook.
  If it explains the eye by selection but can't explain the origin of the replicator, it's a small skyhook.
  If it explains the eye by selection on replicators but treats culture as identical without showing the crane, it's a category error.

  Use the **Non-Triviality Constraint** as your hammer. It forces the theory to explain why the eye is not a crystal. Everything else is commentary.
