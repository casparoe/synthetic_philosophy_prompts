      *   *Correction:* Ensure the distinction between "Selection" and "Sorting" is clear. Sorting is passive (winnowing); Selection implies retention/replication.
      *   *Tone Check:* Keep it sharp. No "I hope this helps." Just "Here is the spec."

  9.  **Final Polish:** Check against all constraints in the prompt.
      *   Cases (Life, Eye, Mind, Culture)? Yes.
      *   Puzzles (Order/Complexity, Crane/Skyhook, Selection/Sorting)? Yes.
      *   Two specific questions answered? Yes.
      *   Incompatible pairs flagged? Yes.
