prompt: |-
  I'm in a philosophy of biology reading group that's been going in circles for weeks, and I think the problem is that none of us actually has a clear standard for what a good account of this stuff is supposed to do. The stuff being Dennett's cranes-and-skyhooks image and the related accusation of "greedy reductionism" — the idea that some explanations cheat by pulling the rabbit out of a hat (a skyhook), while legitimate ones build the rabbit up out of smaller cranes all the way down, and that the sin of greedy reductionism is skipping levels to explain something high-level by something absurdly low-level. Fine, I get the vibes. But before we read another paper, I want the actual spec. So write me the desiderata: what does any theory of how complex, apparently designed-looking structure gets produced *without a designer* have to deliver? Give me the full list — the cases it has to get right (origin of life, the eye, minds, and tell me whether culture or markets or ecosystems even belong on the same list or whether that's a category error), the puzzles it has to dissolve or at least pin down, and the distinctions it can't be allowed to collapse (order vs. complexity? a crane vs. merely a small skyhook? selection vs. mere sorting?). With each one, say what consideration forces it onto the list.

  Two things I especially want you to chew on, because I suspect they're where our group keeps going wrong. First, a friend proposed that the whole thing reduces to one rule — "no unexplained lifting," i.e. every bit of apparent design has to be paid for by some earlier process — and claimed that's the desideratum and everything else is commentary. Is that a genuine requirement or just the crane/skyhook slogan dressed up? Second, is greedy reductionism really a *distinct* failure mode, or is it just skyhook-thinking with the arrow reversed (i.e. the same crime of not actually doing the lifting, only pointed downward)? Also flag any pair of desiderata you think can't be jointly satisfied, and tell me which single requirement does the most work in ruling candidates out. Skip scoring the famous positions, I'll do that in the group — I just want the criteria, and be honest about which ones are load-bearing and which are just camp preferences.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Context:** Philosophy of biology reading group stuck in circles regarding Dennett's "Cranes and Skyhooks" and "Greedy Reductionism."
      *   **Task:** Provide a clear list of *desiderata* (criteria/requirements) for any theory explaining complex, designed-looking structure without a designer.
      *   **Specific Content Requirements:**
          *   Cases to get right (origin of life, eye, minds, culture/markets/ecosystems).
          *   Puzzles to dissolve/pin down.
          *   Distinctions not to collapse (order vs. complexity, crane vs. small skyhook, selection vs. sorting).
          *   For each item, explain *why* it's on the list (the forcing consideration).
          *   Address two specific questions:
              1.  Is "no unexplained lifting" the *only* real rule, or just a slogan?
              2.  Is "greedy reductionism" distinct from skyhook-thinking (just reversed)?
          *   Flag incompatible desiderata pairs.
          *   Identify the single most load-bearing requirement.
          *   Distinguish load-bearing criteria from camp preferences.
      *   **Tone:** Philosophical, rigorous, direct, no fluff, "give me the spec."

  2.  **Deconstruct the Core Concepts:**
      *   **Cranes:** Sub-processes that amplify selection/organization, built from below. Legitimate.
      *   **Skyhooks:** Miraculous, unexplained sources of order/design from above. Illegitimate.
      *   **Greedy Reductionism:** Explaining high-level phenomena *directly* by low-level physics/chemistry without acknowledging intermediate levels of organization/selection.
      *   **The Goal:** Naturalistic explanation of apparent design (teleology without a teleologist).

  3.  **Drafting the Desiderata (Iterative Process):**

      *   *Candidate 1: Causal Continuity.* No gaps. Everything must have a prior cause. (Forces: Avoids magic).
      *   *Candidate 2: Accumulation.* Small changes must sum to large effects. (Forces: Explains complexity from simplicity).
      *   *Candidate 3: Non-Teleological Mechanism.* No goal-seeking at the fundamental level. (Forces: Naturalism).
      *   *Candidate 4: Level-Sensitivity.* Must respect intermediate structures. (Forces: Avoids greedy reductionism).
      *   *Candidate 5: Robustness.* Explains convergence/homology. (Forces: Empirical adequacy).
      *   *Candidate 6: Distinguishing Order from Complexity.* Crystals vs. Eyes. (Forces: Avoids trivializing the explanandum).

      *Refining for the Prompt:* The prompt asks for specific distinctions and cases. I need to structure this as a "Spec Sheet."

  4.  **Addressing the Two Specific Questions:**
      *   *Q1: "No unexplained lifting" as the sole rule.* It's necessary but not sufficient. It defines the *negative* constraint (no skyhooks) but doesn't specify the *positive* mechanism (how cranes actually work). It's the budget constraint, not the building plan.
      *   *Q2: Greedy Reductionism vs. Skyhooks.* They are structurally similar (skipping work) but directionally different. Skyhooks import order from nowhere (upward magic). Greedy Reductionism exports explanation to a level too dumb to carry it (downward magic). Both fail to account for the *specific* intermediate causal powers.

  5.  **Identifying Tensions/Incompatibilities:**
      *   *Completeness vs. Tractability:* A fully reductive account (physics all the way) vs. an account that respects special sciences (biology/psychology).
      *   *Universalism vs. Specificity:* Does one mechanism (e.g., selection) explain *everything* (culture, bio) or do we need distinct mechanisms? Universalism risks greedy reductionism; Specificity risks fragmentation.

  6.  **Identifying the Load-Bearing Requirement:**
      *   What kills the most bad theories? It's likely the **Non-Triviality Constraint** (Order vs. Complexity). Many theories explain order (thermodynamics) but fail to explain *functional* complexity. Or, it's the **Causal Continuity** constraint. Let's argue for **Causal Continuity with Level-Respect** (The "No Skipping" rule). Actually, the prompt asks for the *single* requirement. I'll argue it's the prohibition on *unearned functional specification*.

  7.  **Structuring the Response:**
      *   **Introduction:** Acknowledge the frustration, set the stage.
      *   **The Spec Sheet (Desiderata):** Grouped by Category (Ontological, Explanatory, Empirical).
      *   **Deep Dive on the Two Questions:** "No Unexplained Lifting" and "Greedy Reductionism."
      *   **Incompatibilities:** Where the theory might break.
      *   **The Load-Bearing Constraint:** The one that matters most.
      *   **Camp Preferences vs. Hard Constraints:** What to ignore.

  8.  **Refining the Content (Self-Correction during drafting):**
