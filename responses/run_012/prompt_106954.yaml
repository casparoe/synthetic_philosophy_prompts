answer: |-
  - **The list**

  1.  **Target Specificity:** Must define the explanandum (e.g., guilt vs. cooperation). *Case:* "Morality" is equivocal; explaining altruism doesn't explain obligation. A story about group selection explains behavior, not the inner sting of conscience. Without this distinction, the genealogy solves a different problem than the one posed, talking past the phenomenology of moral experience entirely. It must isolate whether it traces the origin of *values*, *norms*, or the *feeling of ought*.
  2.  **Empirical Consistency:** Must not contradict established anthropology/biology. *Case:* Contradicting known human history renders the narrative myth, not genealogy. If the timeline of guilt predates language, but the genealogy requires complex theology, the account is historically impossible. It loses its claim to be a history of origins rather than a fable. It must fit within the constraints of human cognitive and social evolution.
  3.  **Content Specificity:** Must explain why *these* values (e.g., humility) emerged, not just any cooperative norm. *Case:* Functionalism fails to distinguish specific moral codes from general social glue. Many norms aid survival; a genealogy must explain why *this* specific configuration of virtue and vice arose. Otherwise, it explains society, not morality. It must account for the particular shape of our ethical concepts, not just their existence.
  4.  **Phenomenology of Obligation:** Must account for the feeling of unconditional bindingness. *Case:* Moral demands feel distinct from prudential advice; ignoring this misses the core phenomenon. If the account reduces "ought" to "useful," it fails to explain why we feel bound even when it isn't useful. It explains the utility, not the authority. The experience of constraint must be preserved, not explained away as error.
  5.  **Justificatory Clarity:** Must state if origins undermine or support validity. *Case:* Genealogy often implies debunking; silence leaves the normative status ambiguous. If the origin is dirty, does the value rot? The account must take a stance on the genetic fallacy. Without this, the practical implication of the history is null. It must declare whether knowing the origin changes our reason to hold the value.
  6.  **Evidentiary Accountability:** Must allow for evidentiary critique. *Case:* Prevents the narrative from becoming unfalsifiable metaphysical speculation. Without constraints on what would count against the story, it functions as dogma rather than inquiry. It must risk being wrong to count as knowledge. There must be some state of affairs that would render the genealogy false.

  - **Real requirements vs. hang-ups**

  (a), (c), (d), and (e) are genuine philosophical requirements. They address the conceptual structure and normative force of morality itself. (b) and (f) are naturalistic prejudices. Philosophical genealogy (e.g., Williams, Foucault) is often conceptual, tracing the logic of concepts rather than historical timelines. Demanding strict falsifiability (f) confuses genealogy with evolutionary psychology. A conceptual genealogy explains how a concept became *possible* or *intelligible*, not necessarily how it historically occurred. Thus, (f) is a hang-up of scientism, while (b) is only required for naturalistic claims, not conceptual ones.

  - **Pairs that can't both hold**

  **(d) Phenomenology of Obligation vs. (b)/(f) Naturalistic Empiricism.** You cannot derive the *unconditional* force of moral experience solely from *conditional* evolutionary facts without reducing the feeling to an illusion. If you treat the feeling as real, you violate naturalism; if you treat it as an illusion, you fail to explain the phenomenon as lived. Explaining the "ought" via the "is" inevitably dissolves the bindingness it claims to explain.

  - **The big one**

  **(d) Phenomenology of Obligation.** This excludes most evolutionary accounts. They explain cooperation (function) but fail to explain the *authority* of the moral law. They show why we *do* cooperate, not why we feel we *must*. This gap turns moral experience into an error, collapsing the genealogy into debunking rather than explanation. It is the hardest constraint to meet naturalistically because it demands bridging the normative gap without denying the norm.

  - **Contenders**

  **Evolutionary:** Fails (d); explains behavior, not bindingness. **Power/Discipline:** Fails (a); conflates social norms with moral obligation. **Nietzsche:** Hits (d) and (e) hard by linking bindingness to cruelty, but struggles with (b) due to speculative history.
