prompt: |-
  Ok, I'm not in school for this, just someone who reads alot of philosophy on my own, and I've gotten really into this Nietzsche genealogy of morality thing plus a bunch of anthropology podcasts about where moral norms come from, and I keep hitting the same wall: everyone means something different by a genealogy of morality and nobody says what the thing is supposed to prove. So before I read any more of them I want the spec written out. What does a genealogy of morality have to deliver to count as a good one? Not just Nietzsche's, any of them.

  Give me the requirements list. For each requirement give me the case or consideration that forces it -- why it's a real requirement and not just something one camp happens to care about. Things I already think have to be on the list, argue with me on these: (a) it has to say what it's a genealogy of, because morality is doing a ton of work there and could mean compassion, could mean guilt, could mean the whole ought/obligation thing, could mean the moral-versus-immoral distinction, and a story about one of those is not automatically a story about the others; (b) it can't contradict what anthropologists and biologists actually find about how norms, cooperation and punishment show up in human societies, otherwise it's just fiction; (c) it has to explain the content and not only the function -- why these particular concepts and not others; (d) it has to explain why moral demands feel binding and unconditional, since that feeling is the main thing that needs explaining; (e) it has to say what follows for whether the belief is justified, or else openly admit it's saying nothing about that; (f) it has to be the kind of thing evidence could bear on at all, not a just-so story you can't falsify.

  Then tell me which of these are genuine requirements and which are just the prejudices of one side. I have a suspicion that (f) is partly a scientism hang-up and that some good genealogies are definately allowed to be unempirical in that sense, but make the case either way.

  The part I most want: flag any two requirements that can't both be met at once. My own guess, and I could be way off, is that (d) -- explaining the bindingness from a purely natural, non-moral starting point -- fights with the demand that the genealogy not smuggle in a moral standpoint of its own to judge morality by. If some subset is jointly unsatisfiable, say so, because that's basically a result.

  And tell me which single requirement does the most work, i.e. knocks out the most otherwise plausible candidates.

  Format it like this:
  - The list -- each requirement with the case behind it, ~400-500 words total.
  - Real requirements vs. hang-ups -- ~150 words.
  - Pairs that can't both hold -- as short as it needs to be, this is the important bit.
  - The big one -- ~100 words on the requirement that excludes the most.
  - If you have room, a couple of lines on how the usual contenders (the evolutionary/naturalistic story, the power-and-discipline story, the ressentiment story) fare against the list. Keep it brief, I don't need a survey.
