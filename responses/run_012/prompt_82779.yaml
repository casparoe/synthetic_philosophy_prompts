      *   New Principle Name: **The Agency-Respecting Nudge Principle.**
      *   *Core:* A nudge is permissible if it assists the agent in overcoming internal cognitive barriers to achieving *their own* antecedent goals, without appropriating their resources for the *intervenor's* distinct goals, and without employing social pressure that compromises the agent's ability to dissent comfortably.
