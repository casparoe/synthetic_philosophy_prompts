          1.  **Alignment:** The nudge must align with the agent's own long-term welfare (Prudential) OR a near-universal public norm (Civic). It cannot align with the specific ideological preferences of the nudger.
          2.  **Sovereignty:** The nudge cannot appropriate the agent's resources for the nudger's ends without explicit consent.
