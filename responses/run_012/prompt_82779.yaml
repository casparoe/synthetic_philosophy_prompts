answer: |-
  Your intuition is tracking a distinction that standard libertarian-paternalist frameworks often obscure: the difference between **correcting internal cognitive errors** and **appropriating agency for external ends**.

  Your tentative principle ("choose under reflection/know everything") fails on Case 7 because a rational, informed agent *might* indeed endorse the charity donation. The failure isn't in the *outcome*; it's in the **ownership of the goal**. In Case 6, the goal (financial security) is endogenous to the employee. In Case 7, the goal (supporting a specific charity) is exogenous; it belongs to the employer.

  Here is the principle that generates your verdicts, repairs your tentative theory, and handles the edge cases.

  ### The Principle of Sovereign Ends

  **An intervention is permissible if and only if:**
  1.  **Endogenous Alignment:** It assists the agent in overcoming cognitive biases (inertia, hyperbolic discounting, salience bias) to achieve *their own* stable, long-term interests or widely accepted civic duties.
  2.  **Resource Sovereignty:** It does not appropriate the agent's private resources (money, body, attention) for the *intervenor's* specific ideological or financial ends without explicit consent.
  3.  **Reversibility Cost:** The cost to opt out (transactional, social, or financial) remains trivial.
  4.  **Transparency Robustness:** The mechanism does not rely on the agent remaining ignorant of the intervention to function (no "self-effacing" tricks that vanish upon disclosure).

  ---

  ### Application to Your Cases

  **The Core Tension: (6) vs. (7)**
  *   **Verdict:** (6) is Permissible; (7) is Impermissible.
  *   **Explanation:** This is the linchpin. In (6), the employer acts as a **fiduciary proxy** for the employee's future self. The money remains the employee's asset, directed toward the employee's welfare. In (7), the employer acts as a **principal**, directing the employee's asset toward the employer's value system. Even if the employee agrees with the charity, the *structure* treats the employee's resources as a vehicle for the employer's expression. This violates **Resource Sovereignty**.
  *   **Forced Concession:** You must accept that if an employer auto-enrolled you in a *union* or a *political action committee* with the same opt-out ease, it is impermissible for the same reason as (7).

  **The "Feel Worse" Case: (5) Cigarettes Behind Counter**
  *   **Verdict:** Permissible but morally costly.
  *   **Explanation:** This violates **Reversibility Cost** slightly (adds time/interaction) and introduces **Social Friction**. Unlike (4) (warnings), which add information, (5) adds a gatekeeper. It signals that the transaction is shameful. It is permissible because health is a high-stakes endogenous good, but it feels worse because it compromises the neutrality of the clerk-customer interaction.

  **The "Hidden Pressure" Case: (11) Cafeteria + Cashier Bonus**
  *   **Verdict:** Impermissible.
  *   **Explanation:** The healthy default is fine (Endogenous Alignment). The cashier bonus is not. It turns a structural nudge into **Interpersonal Pressure**. It makes opting out socially costly (you are denying the cashier a bonus). This violates **Reversibility Cost** (social cost is now non-trivial).

  **The "Civic Exception": (2) Organ Donation**
  *   **Verdict:** Permissible.
  *   **Explanation:** This looks like (7) (other-regarding), but it passes because it falls under **Widely Accepted Civic Duties**. Unlike an employer's "preferred charity," organ donation is codified as a public good where the default presumption is consent (similar to taxes). It is treated as a background condition of citizenship, not a specific ideological project of the nudger.

  **The "Children" Case (New Verdict)**
  *   **Verdict:** Impermissible.
  *   **Explanation:** This violates **Endogenous Alignment** at the deepest level. Retirement (6) is a *instrumental* good (money for later). Children are a *constitutive* good (identity-defining). The state cannot know your "stable, long-term interest" regarding parenthood because that interest *defines* the agent. Nudging here is not correcting a bias; it is shaping the self. This is **Value Imposition**, not bias correction.
  *   **Prediction:** A state nudge toward *voting* (civic duty) is permissible. A state nudge toward *marriage* (identity) is impermissible.

  ---

  ### Addressing Your Specific Questions

  **1. Self-Effacing Nudges (Case 10)**
  *   **Principle Clause:** **Transparency Robustness.**
  *   **Verdict:** A self-effacing nudge is impermissible *if* it stops working upon disclosure.
  *   **Analysis of (10):** Pre-filled tax forms are **Transparency Robust**. If the government tells you, "We pre-filled this to save you time, please check it," the efficiency gain remains. It reduces cognitive load without relying on deception.
  *   **Counter-Example:** If a website hid a subscription renewal button by making it the same color as the background (dark pattern), that is self-effacing and **Transparency Fragile**. If you knew it was there, you wouldn't miss it. That is impermissible.
  *   **Consent Test:** You asked if advance consent matters. Under this principle, **no**. If the nudge is manipulative (violates Sovereignty or Transparency), prior consent to be manipulated is suspect (you cannot consent to have your agency bypassed). If the nudge is facilitative (like 10), consent is implied by participation in the system (filing taxes).

  **2. Private vs. Public Actors**
  *   **Principle Clause:** **Fiduciary Scope.**
  *   **Verdict:** The verdict *does* change with the actor, based on their legitimate sphere of interest.
  *   **Analysis:**
      *   **State:** Has a broad interest in public goods (organs, taxes, health) but a narrow interest in identity (children, religion).
      *   **Employer:** Has a legitimate interest in employee productivity and financial stability (retirement defaults reduce stress/turnover). They do *not* have a legitimate interest in the employee's moral spending (charity). Thus, (6) is easier to justify for an employer than for a random website, but (7) is harder.
      *   **Platform/Friend:** A friend nudging you to eat salad is permissible (informal, low stakes). A platform nudging you to engage with rage-bait is impermissible (appropriates attention for platform profit, violates Endogenous Alignment).

  ---

  ### Confidence and Uncertainty

  **Confidence Level:** High (85%) on the distinction between Endogenous (6) and Exogenous (7) goals. This is the strongest predictor of your listed verdicts.

  **The Point of Least Certainty:**
  The boundary of **Widely Accepted Civic Duties** (Case 2 vs. Case 7/8).
  I am least sure where to draw the line between a "public good" (organ donation, taxes) and a "political preference" (charity, political causes).
  *   *The Tension:* If 90% of the population supports a specific environmental charity, does it become a "civic default" like organ donation?
  *   *My Best Guess:* No. The distinction is **Institutional Neutrality**. Organ donation is administered by a neutral medical system. A "preferred charity" implies the employer/state has picked a *specific* vendor of goodness.
  *   *The Risk:* This principle forces you to accept that a state nudge to vote for *any* specific party is impermissible (obviously), but a nudge to *vote at all* is permissible. The "Children" nudge feels like a nudge to "vote for a lifestyle." If the state frames it as "Child Benefits" (resource support), it is permissible (like 6). If it frames it as "Parental Leave Defaults" that assume you *will* parent, it borders on impermissible identity shaping.

  ### Summary of Repairs to Your Tentative Principle

  Your original principle ("choose under reflection") was too **internalist**. It assumed the only barrier to rational choice was cognitive fog.
  My proposed principle adds an **externalist constraint**: Even if you would choose it under reflection, the *intervenor* must not be using your choice to write their own signature on your life.

  *   **Case 6:** You signing your own name (future security).
  *   **Case 7:** The employer signing your name (their charity).
  *   **Case 11:** The cashier holding the pen (social pressure).
  *   **Case Children:** The state trying to hold the pen on your biography.

  This preserves your intuition that (6) and (7) are fundamentally different, despite identical mechanics. The mechanism is neutral; the **ownership of the end** is not.
