answer: |-
  Thank you for coming. Thank you for filling this room.

  I want to begin by thanking the medical team seated here. You asked to be present, and I am glad you are. For fourteen months, you were the stewards of my sister's biology. You were honest with us about the scans, about the probabilities, and about the limits of what medicine could repair. You taught us how to look for signs, and you taught us how to endure when those signs did not come. We owe you a debt for the care you gave her body when her voice was gone.

  To her friends from the rowing club: you knew her when she was in rhythm. You know that rowing is not just about strength; it is about synchronization. It is about moving as one unit, feeling the catch of the water without needing to speak. You know that presence is not always a verbal thing.

  And to my family: we kept the vigil. We spoke to her. We played her music. We argued over whether she could hear us, and we grieved the silence either way.

  Standing here, I have found that the ordinary words of a eulogy do not fit. Usually, we speak of a person as if they are a continuous story that has now reached its period. But for the last year of her life, the story was suspended. And in trying to speak about that suspension, I have had to grapple with a distinction that has haunted me since she died.

  There are, it seems, two ways we understand a person to be present.

  There is the presence of *response*. This is the consciousness of the bedside exam. It is the ability to take information in, process it, and send a signal back. It is the hand squeeze on command. It is the eye tracking the moving finger. It is the brain lighting up on a scan when asked to imagine walking through a house. This is the consciousness that can be measured, documented, and verified. By this definition, my sister was fractured. The machinery of her output was broken. The signal was often lost.

  But there is a second presence. The presence of *experience*. This is not about what a person can do, but what it is like to *be* them. It is the light inside the room, regardless of whether the windows are open or shut. It is the capacity to feel the sun, to hear a voice, to suffer, or to rest, even if no muscle moves to report it.

  For fourteen months, we lived in the gap between these two definitions.

  I know the pressure to collapse them. It is human nature to assume that if the signal stops, the light goes out. If the hand does not squeeze, we assume no one is home. It is a protective assumption. It makes the loss cleaner. It allows us to say, "She was already gone, and we were just tending a body."

  I cannot say that. And I will not say it.

  To say that the absence of evidence was evidence of absence would be to claim a certainty I do not possess. The studies we read, the scans we viewed—they all rely on the first kind of consciousness. They test the ability to *do*. They do not, and perhaps cannot, test the ability to *be*. A patient who cannot move cannot prove they are there. But their inability to prove it is not proof that they are not.

  So, how do we honor her? How do we speak to a room that contains both the people who rowed with her and the people who scanned her?

  We honor her by refusing to let the first definition erase the second.

  To her friends: She may not have been able to join the rhythm anymore, but that does not mean she could not feel the water.
  To the clinicians: You measured the damage to the broadcast, but you could not measure the silence that remained.
  To my family: We did not spend fourteen months tending a machine. We tended a mystery. And we treated that mystery with the dignity of a person.

  We acted as if she was listening, not because we knew she was, but because *we* were listeners. We held the space for her consciousness because our own consciousness demanded it. We loved the person she was, not the performance she could give.

  In the end, we are not gathered here to certify her state. We are here to acknowledge our obligation to it. We are here to say that a human being is not reduced to their output.

  The scans show us what was broken; they do not show us who was left.

  We can measure the signal, but we cannot measure the listener.

  And so we honor the one who listened, even when she could no longer speak.
