  (1) Summary
  Your verdicts are best captured by a hybrid **Contributory Norm Principle**. This principle states that a trait has a function if it currently contributes beneficially to system fitness or goals, or if it is an instance of a trait type historically selected for that contribution and retains the capacity for it. This accounts for acquired traits and co-options while preserving the intuition that malfunctioning traits retain their functions. The primary tension lies between attributing function to novel mutations immediately versus retaining function for broken established traits.

  (2) The Principle
  **The Contributory Norm Principle:** A trait token has function F if and only if:
  1.  **Current Beneficial Contribution:** The token currently makes a causal contribution F that enhances the fitness or goals of the system. This clause captures cases where history is absent or overridden by current utility (motivated by Cases 1, 3, 5, 7, 9, 11).
  2.  **Historical Capacity:** The token is an instance of a trait type historically selected for F, F remains potentially fitness-enhancing for the system, and the token retains the structural capacity for F despite malfunction. This clause preserves function ascriptions through error (motivated by Case 4).
  3.  **Exclusion:** F is not a mere byproduct of the mechanism producing another function, nor a negative contribution to system goals. This excludes incidental effects and harmful bugs (motivated by Cases 2, 6, 8, 10, 12, 13, 14).
  This principle prioritizes current utility but allows history to normatively ground function tokens that fail to perform their established role, distinguishing malfunction from obsolescence.

  (3) How it captures my verdicts
  Your verdicts divide cleanly into three groups aligned with the principle's clauses.

  **Group 1: Current Beneficial Contribution (Clause 1).**
  Cases 1, 3, 5, 7, 9, and 11 all involve traits that currently provide a benefit, regardless of history. In Case 1, the new pump works now, granting it function immediately. In Cases 3 and 9, wings and feathers are co-opted; their current utility (display, flight) overrides their evolutionary origin. In Cases 5 and 11, the callus and tan are acquired, non-heritable traits, yet they function because they currently protect the organism. In Case 7, the rain dance functions for bonding because that is its actual beneficial effect, not the intended rain. Clause 1 validates all these by anchoring function in present causal efficacy.

  **Group 2: Historical Capacity (Clause 2).**
  Case 4 is the sole member here. The heart cannot pump (fails Clause 1), but it is a heart (historical type), pumping is still valuable (ongoing fitness), and it is structurally a pump (capacity). Clause 2 saves the verdict that it retains its function despite malfunction. This distinguishes it from Case 13, where the trait is neutral (no ongoing fitness value), so Clause 2 fails there.

  **Group 3: Exclusion (Clause 3).**
  Cases 2, 6, 8, 10, 12, 13, and 14 all lack function. Cases 2, 10, 12, and 13 fail both Clause 1 (no current benefit) and Clause 2 (no capacity or no ongoing value). Case 6 fails because the contribution is negative (crashing). Cases 8 and 14 fail because the effects are byproducts, not integral to the trait's production or maintenance logic. Clause 3 ensures these are correctly excluded.

  This mapping shows your verdicts are internally consistent under this disjunctive framework. Every "Yes" verdict satisfies Clause 1 or 2; every "No" verdict fails both or triggers Clause 3.

  (4) Where it breaks, and which verdict to abandon
  While the principle captures your verdicts, it hides a normative discontinuity between Case 1 and Case 4. Case 1 attributes function based on immediate success without historical stabilization. Case 4 attributes function based on history despite immediate failure. This creates a tension: does function rely on *success* (Case 1) or *normative status* (Case 4)?

  If forced to unify the normativity, you should abandon or modify **Case 1**. Attributing "function" to a single mutation before it establishes a type or lineage history stretches the concept. A mutation is a random error; calling it functional immediately treats "function" as purely descriptive of current causality. This conflicts with Case 4, where "function" is normative (it *should* pump). If function is purely causal (Case 1), the broken heart (Case 4) has no function. If function is normative (Case 4), the new mutation (Case 1) has only *potential* function.

  Case 4 is more robust because "malfunction" logically presupposes a function. Without Case 4, the distinction between a broken heart and a stone disappears conceptually. Without Case 1, we only lose a label for a successful novelty; we can still say it "performs a functional role." Furthermore, Cases 5 and 11 (callus, tan) differ from Case 1: they are produced by regulated systemic responses (phenotypic plasticity), whereas the mutation is random. You can keep 5 and 11 by requiring "system regulation" rather than "lineage history," but Case 1 lacks even system regulation.

  Therefore, soften Case 1. Say the mutation *performs* a function or has *potential* function, but strictly lacks "function" status until stabilized by selection or system regulation. This aligns the normativity of Case 1 with Case 4, grounding function in established capacities rather than瞬时 success.

  (5) Predictions for the new cases
  Based on the Contributory Norm Principle (with the suggested modification to Case 1), here are the predictions:

  **(a) Trait selected for F, now contributes G:** Function = G. Current contribution overrides history (per Cases 3, 9). The trait is now maintained for G.
  **(b) Trait never selected, now contributes F:** Function = F, provided it arises from a regulated system process (per Cases 5, 11). If it is a random mutation (Case 1 modified), it has *potential* function but not established function until stabilized.
  **(c) Trait currently neutral, selected for F:** No function. History is insufficient without ongoing fitness value (per Case 13). The trait is obsolete.
  **(d) Artifact designed for F, now used only for G:** Function = G. Current use overrides design intent in naturalistic accounts (per Case 3 logic). However, if referring to "design function," it remains F. Under this principle, we track actual utility.
  **(e) Biological byproduct, now contributes to fitness:** Function = Yes, if the contribution becomes integrated into system maintenance (per Case 5). If it remains incidental (like blood color, Case 8), No. The key is whether the system regulates the trait *for* that benefit.
  **(f) Malfunctioning artifact designed for F, does G:** Function = F. History/Design sustains function despite failure (per Case 4). The artifact is broken, not repurposed, unless G becomes its primary use (see d).

  These predictions maintain the priority of current benefit while respecting historical norms for malfunction and obsolescence. They clarify the boundary between co-option (a), exaptation (b), and vestige (c).

  (6) Bottom line
  Your verdicts form a coherent hybrid system prioritizing current benefit but respecting historical norms for malfunction. The principle unifies them by distinguishing current contribution from historical capacity. However, Case 1 is the weak link; it treats function as descriptive causality, while Case 4 treats it as normative status. To stabilize your theory, modify Case 1: treat novel mutations as having "potential function" until stabilized. Retain Case 4, as malfunction requires a functional norm. This preserves the distinction between broken tools and obsolete tools.
