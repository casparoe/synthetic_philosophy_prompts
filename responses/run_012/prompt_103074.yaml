  ok so I'm a backend engineer, zero philosophy training, and I've ended up in a slack channel with a coworker who is obsessed with this thing she calls the singleton. As far as I can tell it means: at some point the world ends up with one decision-maker at the top, one thing that can set the rules for everybody else, and that this could happen by somebody taking over, by everybody signing up, or just by default because one thing gets too central to route around. I get the gist but I honestly can't tell what she thinks counts and what doesnt, and she refuses to just define it.

  Here's every call I've heard her make, as best I remember:

  - Rome at its peak: singleton, yes.
  - The Mongols: no, because it turned into seperate khanates that fought each other.
  - The pope in medieval Europe: yeah, sort of — he could tell kings what to do and they mostly couldn't just ignore him, even though he had no army worth anything.
  - The great powers around 1900: no, obviously, there were like five of them.
  - The gold standard era: 'kind of a singleton,' which lost me completely, since nobody was in charge of it at all.
  - The Antarctic treaty: no, it's just a treaty, anyone can walk away.
  - And a made-up one she's fond of: one AI lab that's a couple years ahead of everyone and the rest of the field trains on its hardware and rents its models: yes, singleton.

  Now she's got a new one and she's being weirdly quiet about it, so I want to guess before she says it out loud. The new case: a single international body hands out the only permits for training runs above some compute line. The rules are set by a technical committee. A rotating coalition of states enforces it, mostly by cutting you off from chip supply chains. Any one of the five biggest states can stall enforcement just by not paying in, and a state that really wants to defect can probally build its own fabs eventually, but only by getting frozen out of everything else for a decade. Nobody's forced into it; everyone joins because the alternative is worse.

  So, what's she going to say about that one? More useful to me: what rule is she actually running, and what other rules fit every call she's made so far just as well? For each rule, what does it predict about the licensing body, and which one do you think is really hers? Then tell me which case I should bring up next that would finally seperate the rules, and if her answer on the new case came out the other way, which of the earlier calls would that make look like the odd one out. And for your own verdict: say what would change your mind and where your reasoning is weakest.
