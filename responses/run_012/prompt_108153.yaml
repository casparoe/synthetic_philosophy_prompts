answer: |-
  Bottom line
  This is a real argument, not just a mood; you have correctly identified that the normative force of accuracy-first epistemology relies on substantive assumptions about modeling that are often presented as technical neutralities. However, your first worry conflates the formalization of belief with the belief itself, which gives your opponent too easy a target, while your third worry strikes at the heart of their value monism.

  The strongest part
  Worry (3) is the philosophical killer here. You correctly note that accuracy is defined relative to a fixed algebra, which means the theory cannot account for the epistemic value of conceptual refinement or asking better questions. If two agents are equally accurate on a coarse algebra, but one possesses the conceptual resources to formulate a finer, more explanatory partition, accuracy-first epistemology is forced to say they are epistemically equivalent. This exposes the theory as incomplete rather than false, showing that accuracy is a constraint on belief *given* a question, but not a guide for choosing the question itself.

  The weakest link
  Worry (1) is where you are most vulnerable to a straightforward reply, because it risks sounding like a general skepticism about formal modeling rather than a specific critique of accuracy. You claim the agent never chose the algebra, implying it is an external imposition by the theorist, but an accuracy-firster will argue that the algebra is simply the set of propositions the agent actually entertains. If an agent has credences, they *ipso facto* have an algebra; the dominance argument doesn't tell them to adopt a model, it tells them that given the commitments they already have, coherence is required to avoid guaranteed loss in accuracy. Your objection smuggles in the premise that there is a gap between "having opinions" and "being representable by a credence function," but the programme assumes these are identical. To make this stick, you need to argue not that the algebra is chosen by the theorist, but that the requirement to have an algebra at all is the substantive normative leap—otherwise, you are just saying "all formalization is idealization," which they already admit.

  How an accuracy-firster fights back
  "You are conflating the *constitutive* norms of belief with the *instrumental* choices of inquiry. Accuracy is the sole fundamental epistemic good, but that doesn't mean it's the only thing we care about; it means it's the only thing that makes a belief state epistemically good *as a belief state*. Your worry about additivity assumes holism without argument, but if truths are independent, why shouldn't accuracy be separable? And regarding your algebra objection: of course accuracy is relative to a proposition set, because belief is always belief *that P*. If an agent fails to distinguish P from Q, they literally do not have a credence in P, so we cannot judge them on it. The norm is conditional, yes, but the condition is 'if you have a doxastic attitude,' which is trivially satisfied by any believer. You haven't shown accuracy isn't the goal; you've shown that agents need concepts to have goals, which is no objection to the goal itself."

  Old objection in new clothes?
  Worry (1) is a version of the "Idealization Objection" (often raised by Hájek or Sobel against Dutch Book arguments), claiming formal constraints don't map neatly to psychological reality. Worry (3) is a credal version of the "Swamping Problem" or the debate over the value of knowledge over true belief (e.g., Carter, Jarvis). It matters because the literature already contains replies to these—specifically that accuracy-firsters can accommodate inquiry value via expected accuracy over future partition refinement—so you need to engage those specific moves rather than presenting the problem as novel.

  What I'd do with it
  Develop this, but drop Worry (1) entirely; it's too methodological and invites dismissive replies about modeling. Focus exclusively on Worry (3) and turn it into a positive claim: that accuracy must be supplemented by a distinct epistemic good like "informativeness" or "conceptual fidelity" to explain why we refine our algebras. The one thing you should change is to stop calling the programme "deflationary" and start calling it "incomplete"—this forces them to add values rather than letting them defend accuracy as the sole sovereign.
