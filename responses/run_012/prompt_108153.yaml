      *   **How an accuracy-firster fights back:** Needs to be one paragraph, in their voice. They should argue that accuracy *is* the fundamental epistemic good (veritism). The algebra isn't chosen by the theorist; it's fixed by the agent's doxastic state. If you have credences, you are subject to the norms governing credences. Additivity is justified by independence of truths. Granularity is a separate issue (pragmatics or distinct virtue), not a hit to the core norm.
