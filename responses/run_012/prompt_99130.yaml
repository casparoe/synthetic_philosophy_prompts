answer: |-
  # Joint Statement on the Ontology of Mechanistic Interpretability

  ### I. Agreed Claims: Definitions and Well-Formedness

  We, the undersigned participants in this adversarial collaboration, agree on the following structural definitions to ensure we are debating the same objects. We suspend judgment on the metaphysical status of these objects for the purpose of this section.

  1.  **Structure of a Representation Claim:** A representation claim asserts a tripartite relation $(V, C, U)$ at a specified level of granularity $L$.
      *   **Vehicle ($V$):** A specific mathematical object within the model's activation space (e.g., a neuron's scalar activation, a linear direction, a $k$-dimensional subspace, or a computational circuit).
      *   **Content ($C$):** A semantic label, concept, or variable from the data distribution or task specification (e.g., "past tense," "dog," "sentiment polarity").
      *   **Consumer ($U$):** A downstream mechanism within the model (e.g., subsequent layers, attention heads, or the final logits) that receives $V$ as input.
      *   **Level ($L$):** The scale of analysis (e.g., single-layer, cross-layer, or full-network).

  2.  **Conditions for Well-Formedness:** A representation claim is considered well-formed if and only if:
      *   The Vehicle $V$ is uniquely identifiable via a specified algorithm (e.g., PCA, probing classifier, causal intervention).
      *   The Content $C$ is operationally defined via a test set or behavioral metric.
      *   The relation between $V$ and $C$ is quantifiable (e.g., via mutual information, linear separability, or causal effect size).
      *   The claim specifies the distribution $\mathcal{D}$ over which the relation holds.

  3.  **Empirical Admissibility:** We agree that claims failing the well-formedness conditions are scientifically inert. We further agree that any viable theory must account for the stability of $(V, C, U)$ relations across distributional shifts and model architectures.

  4.  **Neutrality on Ontology:** This statement does not presuppose whether $C$ exists independently of the model, whether $V$ is the unique carrier of $C$, or whether the attribution is mind-dependent. These are the subjects of our residual disagreements below.

  ***

  ### II. Residual Disagreements and Adjudicating Tests

  | Question | Internal-Structure Realist Position | Interpretive Deflationist Position | Adjudicating Test & Predicted Interpretations |
  | :--- | :--- | :--- | :--- |
  | **1. Underdetermination**<br>*(Do multiple incompatible bases fitting the same activations count against the truth of a claim?)* | **Yes.** If multiple bases explain the data equally well, we have not yet identified the *natural* basis. The existence of equally predictive rotations suggests the current attribution is likely an artifact of the analysis method, not the model's ontology. | **No.** Underdetermination is expected. Representations are maps, not territory. If multiple bases predict behavior equally well, they are equally valid instruments. Uniqueness is not a requirement for utility. | **Test:** *Basis Rotation Equivalence.*<br>Find two orthogonal bases that predict downstream behavior with identical accuracy.<br>**Realist:** At least one basis is false; we need a "naturalness" prior to find the truth.<br>**Deflationist:** Both are true (instrumentally); the choice is pragmatic. |
  | **2. Causal Sufficiency**<br>*(Is causal influence on downstream computation sufficient for content attribution?)* | **No.** Causal influence is necessary but not sufficient. A vehicle must also possess the correct *structural geometry* (e.g., linearity, sparsity) to count as encoding a concept. Causal leverage without structural naturalness is mere correlation. | **Yes.** Causal influence is sufficient. If intervening on $V$ changes behavior in a way consistent with $C$, then $V$ represents $C$ for all scientific purposes. Structural aesthetics are secondary to functional control. | **Test:** *Causal Decoupling.*<br>Identify a direction that causally drives output but lacks geometric regularity (e.g., highly entangled).<br>**Realist:** This is a mechanism, not a representation.<br>**Deflationist:** This is a representation; our structural expectations were too narrow. |
  | **3. Interpreter Relativity**<br>*(Is the choice of task/distribution constitutive of the attribution or merely evidence for it?)* | **Evidence.** The task reveals what is already there. A representation exists independently of the probe used to find it. Changing the task changes our *access* to the representation, not the representation itself. | **Constitutive.** The attribution is relative to the probe. A model does not have "a" representation of $C$; it has a disposition to behave *as if* it represents $C$ relative to a specific interrogation strategy. | **Test:** *Task-Shift Stability.*<br>Train a probe on Task A, test attribution validity on Task B.<br>**Realist:** True representations persist across tasks.<br>**Deflationist:** Attributions may legitimately shift; stability is a bonus, not a requirement. |
  | **4. The Structure-Function Crux**<br>*(The Swap Test: Transplanting a decodable direction into a matched context.)* | **Structure is Primary.** The vehicle $V$ constitutes the representation. If $V$ is moved, the content moves *if and only if* the structural integrity is preserved. | **Function is Primary.** The causal role constitutes the representation. If the function moves, the content moves *regardless* of the structural vector's stability. | **Protocol:** Transplant direction $d$ (encoding $C$ in Model 1) to Model 2 (matched for nuisances). Measure Decoding ($D$) and Behavioral Use ($U$).<br><br>**Scenario A: $D$ Succeeds, $U$ Fails.**<br>• **Realist:** The structural vehicle is present, but the consumer relation is broken. The claim "encodes $C$" is structurally true but functionally void.<br>• **Deflationist:** The claim is false. Without causal leverage, it is merely correlated noise, not a representation.<br><br>**Scenario B: $U$ Succeeds, $D$ Fails.**<br>• **Realist:** The content is causal, but our structural hypothesis ($d$) was wrong. The *real* representation is elsewhere/differently shaped.<br>• **Deflationist:** The claim is true (functionally). The representation transferred, even if our decoding metric failed to track it. |
