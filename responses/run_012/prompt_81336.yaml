prompt: |-
  I'm a novelist — four books, mid-list, you wouldnt have heard of me — and through what I can only describe as an administrative accident I've ended up co-teaching an upper-level seminar this term, cross-listed between philosophy and political theory, called 'Binding Your Future Self.' The premise is that we spend eight weeks on precommitment in the personal case — the Odyssey bit, the Elster stuff, rehab contracts, people who hand their credit cards to a friend — and then the last three weeks jump to constitutions, where the same structure is supposed to do a lot of heavy lifting. Final exam is in a fortnight and the essay question is mine to write this weekend. Last year's instructor set something like 'explain Elster on precommitment and apply it to constitutional entrenchment,' and I read the scripts: forty students, forty versions of the same essay, all of them fine and none of them thinking. I want a question where that move simply isn't available. The exam is 90 minutes, they choose one of two questions, so this one has to be answerable in roughly 75 minutes of writing.

  So here's what I've built, and I'd like you to build the question around it. I invented a country, because I dont want them reaching for real constitutional law they half-remember — the Republic of Marisia. Sixty years ago it came out of a dictatorship and adopted a constitution with three relevant bits: Article 1 says all state power derives from the people; Article 90 is an eternity clause — it says no amendment may abolish the democratic order, or Article 90 itself, or the Constitutional Court's jurisdiction to review amendments for compliance with Article 90, and that any amendment violating Article 90 is void from the outset. Amendments need two-thirds of both houses plus a referendum. Now a movement, the National Renewal Front, wins the two-thirds and wins the referendum, and passes Amendment 27, which does three things: it repeals Article 90 and replaces it with an unamendable clause saying only that the people are sovereign; it extends the legislature's term from four years to nine; and it strips the Court of jurisdiction over amendments. And Amendment 27's preamble says it is enacted by the people in the exercise of their constituent power, not by the organs of the state in the exercise of constituted power, and that the referendum was the authentic, unmediated expression of the sovereign will. The Court — the same Court whose jurisdiction the amendment purports to remove — now has to decide whether to hear the challenge, and what to do.

  What I want the question to force is a distinction I've been hammering all term, which I got from a footnote I can no longer find and have probably mangled beyond recognition: binding yourself to a rule versus submitting yourself to a ruler. Ulysses has a rope, but he also has a crew, and the crew has to exercise judgement — they have to decide whether the noises he makes later are the noises of a man who means it. And I've been telling them the personal case has three separable parts, the physical constraint, the delegation to the crew, and the instruction to ignore his later self's preferences, and that the interesting question is which one is actually doing the binding, because in the constitutional case you can only have the third if you have the second. So: you're a political philosopher who also knows constitutional theory cold, and I want you to think carefully before you write, and to actually start by brainstorming two or three candidate cruxes for this question and telling me which one you'd pick and why, because I'd rather see your reasoning than have you guess what I want. Then give me three things. First, the exam question itself, written the way I'd hand it to students — self-contained, so that a student who's read the seminar material but remembers no real cases can answer it entirely from the Marisia facts, and closed-book, so nothing in it can lean on a citation, a statute, or a name they'd have to look up. Second, a model answer of about 600-800 words. Third, a marking scheme out of 25 that names the specific moves a top answer has to make and the specific mistakes that should cost marks, with the marks per move and a one-line note on how students typically get each one wrong — I want to be able to tell an A from a B by ticking off which moves are present. And please dont let the model answer turn into a tour of real-world doctrine; if it needs a named case or a scholar to work, it's the wrong model answer.
reasoning: |-
  Here's a thinking process that leads to the suggested output:

  1.  **Analyze the User and Request:**
      *   **User Persona:** Novelist (mid-list, 4 books), co-teaching an upper-level seminar (Philosophy/Political Theory).
      *   **Course Topic:** "Binding Your Future Self" (Precommitment: Odyssey/Elster/Rehab -> Constitutions).
      *   **Problem:** Last year's exam question ("Explain Elster + Apply to Constitutions") yielded 40 identical, uninspired essays.
      *   **Goal:** Create a new exam question that forces students to *think*, not just regurgitate. Specifically, force the distinction between "binding yourself to a rule" vs. "submitting yourself to a ruler" (Ulysses + Crew analogy).
      *   **Scenario:** Fictional country "Republic of Marisia." Specific constitutional crisis involving Article 90 (eternity clause) vs. Amendment 27 (popular sovereignty claim, extending terms, stripping court jurisdiction).
      *   **Key Concept:** The "three separable parts" of precommitment (physical constraint, delegation to crew, instruction to ignore later preferences). The crux is that in constitutional cases, you only get the third (ignoring later preferences) if you have the second (delegation to an interpreter/crew).
      *   **Deliverables:**
          1.  Brainstorming 2-3 candidate cruxes + selection reasoning.
          2.  The Exam Question (self-contained, closed-book, 75-min answer time).
          3.  Model Answer (600-800 words, no real-world doctrine/citations).
          4.  Marking Scheme (out of 25, specific moves, typical mistakes).

  2.  **Deconstruct the Philosophical Core:**
      *   *The Ulysses Pact:* Ulysses ties himself to the mast (physical constraint) and orders the crew to ignore his pleas (delegation + instruction).
      *   *The Constitutional Analogy:* A constitution binds the future legislature. But who is the crew? The Court? The People?
      *   *The Marisia Crisis:* Amendment 27 claims to be the "People" speaking directly (Constituent Power) to override the "State" (Constituted Power/Court). It tries to remove the "crew" (Court's jurisdiction) while changing the rules (term limits) and removing the mast (Article 90).
      *   *The Trap:* If the Court strikes it down, are they protecting the binding rule, or are they becoming the rulers (substituting their will for the People's)? If they accept it, did the People just unbind themselves, or did they submit to a new ruler (the National Renewal Front claiming to *be* the People)?
      *   *The User's Insight:* You can't have "binding to a rule" without "delegation to an interpreter." If the interpreter is removed or claims to *be* the rule, the binding fails or becomes tyranny.

  3.  **Brainstorming Candidate Cruxes:**
      *   *Crux 1: The Identity of the Crew.* Who is the "crew" in Marisia? Is it the Court? Is it the procedural hurdles (2/3 + referendum)? If Amendment 27 claims the *People* are the crew, does that dissolve the distinction between ruler and rule?
      *   *Crux 2: The Paradox of Self-Binding.* Can the "People" bind themselves forever? If they can, can they unbind themselves? If Amendment 27 is the People speaking, does Article 90 still apply? This focuses on the *temporal* aspect (Past People vs. Present People).
      *   *Crux 3: The Mechanism of Enforcement (The User's Preference).* Focus on the *structure* of the Ulysses pact. Physical constraint vs. Delegated Authority. Amendment 27 tries to remove the enforcer (Court) while claiming higher authority. The question is: Without the Court (the crew), is Article 90 just a piece of paper? But if the Court keeps jurisdiction, are they the rulers?

      *Selection:* Crux 3 is the strongest fit for the user's specific pedagogical goal ("binding yourself to a rule versus submitting yourself to a ruler"). It directly addresses the "three separable parts" (constraint, delegation, instruction). It forces the student to analyze *how* binding works, not just *if* it works.

  4.  **Drafting the Exam Question:**
      *   Needs to be self-contained (include the Marisia facts).
      *   Needs to prompt the specific distinction.
      *   Needs to avoid "Apply Elster" phrasing.
      *   *Drafting:* Present the Marisia scenario. Ask the student to advise the Court. Focus on the legitimacy of the Court's intervention given the claim of "Constituent Power." Force them to use the "Ulysses/Crew" analogy discussed in class.
      *   *Refining:* Make sure it explicitly asks about the distinction between rule and ruler. That's the key.

  5.  **Drafting the Model Answer:**
      *   *Constraint:* 600-800 words. No real cases (no *Basic Structure*, no *Schmitt*, no *Elster* by name unless defined in class context—better to avoid names to ensure self-containment).
      *   *Argument:*
          1.  Identify the Ulysses structure in Article 90 (Mast = Eternity Clause, Crew = Court).
          2.  Analyze Amendment 27's move: It claims to be Ulysses untying himself, but it actually fires the Crew.
          3.  The Crux: Without the Crew (Court), the instruction to ignore future preferences is unenforceable.
          4.  The Distinction: If the Court strikes it down, they are the Crew following orders. If they step aside, the National Renewal Front becomes the Ruler, not the Rule.
          5.  Conclusion: The Court must hear the case to preserve the "rule" nature of the constitution.
      *   *Tone:* Analytical, philosophical, not legalistic.

  6.  **Drafting the Marking Scheme:**
      *   Total 25 marks.
      *   Need specific "moves."
      *   Move 1: Identifying the Ulysses structure in Art 90 (5 marks).
      *   Move 2: Distinguishing Rule vs. Ruler in Amendment 27 (5 marks).
      *   Move 3: Analyzing the role of the Court (The Crew) (5 marks).
      *   Move 4: Addressing the "Constituent Power" claim (5 marks).
      *   Move 5: Coherence/Clarity (5 marks).
      *   *Typical Mistakes:* Treating the Court as a legislature, missing the "crew" analogy, conflating popularity with legitimacy.

  7.  **Review and Refine:**
      *   *Check against User Constraints:* "Dont let the model answer turn into a tour of real-world doctrine." (Ensure no mention of India, Germany, Schmitt, etc.). "Start by brainstorming... telling me which one you'd pick and why." (Make sure this is the first section).
      *   *Tone Check:* The user is a novelist. They appreciate precision, narrative logic, and hate cliché. The response should be respectful, intellectually rigorous, and slightly conversational but professional.
      *   *Word Count Check:* Model answer needs to be tight.
      *   *Logic Check:* Does the Marisia scenario actually support the "Rule vs. Ruler" distinction? Yes, because Amendment 27 claims to be the "People" (Ruler) overriding the "Constitution" (Rule), but removes the mechanism (Court) that keeps the Rule distinct from the Ruler.

  8.  **Final Polish:** (Self-Correction during drafting)
      *   *Correction:* In the brainstorming section, make sure I explicitly validate the user's "mangled footnote" idea. It's a good idea (Ulysses + Crew), not mangled.
      *   *Correction:* Ensure the exam question doesn't give away the answer. It should ask *how* the distinction applies, not *if* it applies.
      *   *Correction:* In the marking scheme, be specific about what loses marks (e.g., "Treating the Constitution as a mere contract").

  9.  **Final Output Generation** (Proceeding to generate response based on these steps).
answer: |-
  Here is the brainstorming and selection process, followed by the three deliverables you requested.

  ### Part 1: Brainstorming Candidate Cruxes

  You are right to worry about the "Elster + Apply" trap. That structure invites students to treat the theory as a hammer and the constitution as a nail, without examining the handle. Here are three ways to cut the Marisia scenario, and my reasoning for the selection.

  **Candidate Crux 1: The Temporal Paradox (The "Dead Hand" Problem)**
  *Focus:* Can the People of Year 1 bind the People of Year 60?
  *The Question:* Ask students whether Amendment 27 is an act of liberation (freeing the present people) or suicide (destroying the mechanism of freedom).
  *Why I'm rejecting it:* This invites the standard "living constitution vs. originalism" debate. Students will just argue about whether the past should rule the future. It doesn't force them to look at the *mechanism* of binding (the rope/crew distinction) you've been teaching. It becomes a debate about time, not structure.

  **Candidate Crux 2: The Definition of "The People" (Constituent vs. Constituted Power)**
  *Focus:* Who is speaking in Amendment 27? Is it the "People" or just a majority?
  *The Question:* Ask students to evaluate the preamble's claim that the referendum is the "unmediated expression of the sovereign will."
  *Why I'm rejecting it:* This leans too hard into political sociology. Students will argue about whether referendums are actually democratic. It drifts away from the precommitment *structure* (Ulysses) and into the legitimacy of voting. It misses the "Rule vs. Ruler" distinction.

  **Candidate Crux 3: The Mechanism of Enforcement (The "Crew" Problem)**
  *Focus:* Who holds the rope?
  *The Question:* Ask students to analyze the *removal* of the Court's jurisdiction in light of the Ulysses analogy.
  *Why I'm picking it:* This hits your pedagogical bullseye. In the personal case, Ulysses needs the crew to ignore his future screams. In Marisia, Article 90 is the rope, but the Court is the crew. Amendment 27 tries to fire the crew *while* untying the rope, claiming the "Captain" (the People) has changed his mind. This forces the student to explain why a binding rule *requires* a separate enforcer to remain a rule, and what happens when the enforcer is removed (it becomes submission to a ruler). It makes the "Rule vs. Ruler" distinction necessary for the answer, not just optional flavor.

  ***

  ### Part 2: The Exam Question

  **POLITICAL THEORY 401: BINDING YOUR FUTURE SELF**
  **FINAL EXAMINATION**

  **Time Allowed:** 90 Minutes
  **Instructions:** Answer **ONE** of the following two questions. Closed book. No citations required.

  **QUESTION A**

  Consider the following scenario:

  The Republic of Marisia adopted a Constitution sixty years ago following a dictatorship. **Article 1** states all power derives from the people. **Article 90** is an "eternity clause": it forbids any amendment that abolishes the democratic order, forbids any amendment that removes Article 90, and forbids any amendment that strips the Constitutional Court of the power to review amendments for compliance with Article 90. It states any such amendment is void from the outset.

  Recently, the National Renewal Front won a two-thirds legislative majority and a popular referendum. They passed **Amendment 27**, which: (1) repeals Article 90; (2) extends legislative terms from four years to nine years; and (3) strips the Constitutional Court of jurisdiction to review amendments.

  The Preamble to Amendment 27 declares it is enacted by the People exercising *constituent power* (the power to make the constitution), not *constituted power* (the power given by the constitution), and that the referendum was the authentic, unmediated will of the sovereign.

  The Constitutional Court must now decide whether to hear a challenge against Amendment 27.

  **Write an essay advising the Court.** In your answer, you must utilize the "Ulysses and the Crew" analogy discussed in this seminar. Specifically, distinguish between **binding oneself to a rule** and **submitting oneself to a ruler.** Explain why the Court's decision on its own jurisdiction is not merely a legal technicality, but the decisive factor in determining whether Marisia has a constitutional order or a master.

  ***

  ### Part 3: Model Answer

  *(Word Count: approx. 720 words)*

  The Court faces a paradox: if it hears the case, it defies the apparent will of the current majority; if it does not, it may surrender the constitutional order to a temporary ruler. To resolve this, we must look not at the popularity of Amendment 27, but at the structure of precommitment itself. The "Ulysses and the Crew" analogy provides the necessary framework.

  In the classic precommitment scenario, Ulysses binds himself to the mast to resist the Sirens. However, the rope alone is insufficient. Ulysses also instructs his crew to ignore his future pleas to be released. This structure contains three elements: the physical constraint (the rope), the instruction (ignore future preferences), and the delegation of authority (the crew). Crucially, the crew must be distinct from Ulysses's future self. If the crew obeys Ulysses's later screams, the precommitment fails. If the crew *is* Ulysses, there is no binding, only a change of mind.

  Article 90 functions as the rope. It is a rule designed to bind the future state against impulsive or tyrannical changes. But a rule without an enforcer is merely advice. In Marisia, the Constitutional Court is the crew. Article 90 explicitly delegates the authority to judge violations to the Court. This delegation is what transforms a political preference into a constitutional rule. By stripping the Court of jurisdiction, Amendment 27 does not merely untie the rope; it fires the crew.

  This brings us to the distinction between binding oneself to a rule and submitting oneself to a ruler. A constitutional rule is binding because it stands apart from the immediate will of the governing majority. It applies even when the majority wishes it did not. This requires an interpreter—the crew—who is instructed to uphold the rule regardless of the "noises" the government makes later. When Amendment 27 removes the Court's jurisdiction, it removes the separation between the rule and the ruler.

  The Preamble to Amendment 27 claims this is an act of "constituent power," the People speaking directly. This argues that the Captain (the People) has the right to untie himself. In the personal case, Ulysses *can* untie himself if he is of sound mind. However, in the constitutional case, "the People" is not a single agent with a continuous mind. It is a collective that changes over time. If the current majority can declare itself the "Constituent Power" and remove the enforcement mechanism whenever it chooses, the Constitution ceases to be a binding rule. It becomes a tool that the current ruler uses when convenient and discards when not.

  If the Court accepts Amendment 27's claim and recuses itself, it validates the idea that the current majority is the master of the Constitution, not its subject. This is submission to a ruler. The National Renewal Front, by extending their own terms and removing judicial review, is not acting as a crew following standing orders; they are acting as a new master who has seized the ship. Without the Court's jurisdiction, there is no entity left to distinguish between a valid amendment and a power grab.

  Therefore, the Court must hear the challenge. This is not judicial supremacy; it is the preservation of the precommitment structure. Just as the crew must ignore Ulysses's screams to ensure he reaches Ithaca, the Court must assert its jurisdiction to ensure Marisia remains a democracy rather than a dictatorship. If the Court steps aside, Article 90 was never a rule; it was merely a suggestion that the National Renewal Front chose to ignore. By maintaining jurisdiction, the Court affirms that the Constitution binds the People not because they are forced to, but because they have delegated the authority to uphold their own long-term will against their short-term passions. To do otherwise is to admit that Marisia has no constitution, only a series of temporary rulers.

  ***

  ### Part 4: Marking Scheme (Out of 25)

  **A. Structural Analysis of Precommitment (5 Marks)**
  *   **5:** Explicitly identifies the three parts of the Ulysses pact (constraint, instruction, delegation/crew) and maps them to Marisia (Art 90, the ban on amendment, the Court).
  *   **3:** Identifies the Court as the enforcer but misses the "instruction" or "delegation" nuance.
  *   **1:** Treats the Constitution as a simple contract or law without analyzing the *mechanism* of binding.
  *   *Typical Mistake:* Treating the "rope" (Article 90) as sufficient on its own without the "crew" (Court).

  **B. The Rule vs. Ruler Distinction (5 Marks)**
  *   **5:** Clearly articulates that a "rule" requires an independent enforcer, whereas a "ruler" controls the enforcement. Explains that Amendment 27 collapses this distinction.
  *   **3:** States the distinction but fails to apply it to the specific mechanics of Amendment 27 (jurisdiction stripping).
  *   **1:** Uses the terms "rule" and "ruler" as synonyms for "law" and "politician."
  *   *Typical Mistake:* Arguing that the "People" are the ruler, missing the point that the Constitution is supposed to make the People the *subject* of the rule.

  **C. Handling the "Constituent Power" Claim (5 Marks)**
  *   **5:** Rejects or qualifies the Preamble's claim by noting that without the "crew," the claim to be the "People" is indistinguishable from a faction seizing power.
  *   **3:** Accepts the claim as a valid counter-argument but argues the Court should override it anyway.
  *   **1:** Ignores the Preamble entirely or treats it as legally decisive.
  *   *Typical Mistake:* Getting bogged down in whether the referendum was "fair" rather than structural.

  **D. The Recommendation & Justification (5 Marks)**
  *   **5:** Advises the Court to hear the case *because* jurisdiction is the precondition for the existence of a rule-based order.
  *   **3:** Advises the Court to hear the case based on "protecting democracy" without linking it to the precommitment structure.
  *   **1:** Advises the Court to step aside (judicial restraint) or gives a mixed/unclear recommendation.
  *   *Typical Mistake:* Arguing the Court should strike down the amendment because it is "unfair," rather than because it destroys the binding mechanism.

  **E. Clarity and Coherence (5 Marks)**
  *   **5:** Argument flows logically; no reliance on external case law; prose is precise.
  *   **3:** Understandable but relies on vague political platitudes ("tyranny is bad").
  *   **1:** Disorganized or relies on real-world citations (e.g., "Like in Germany...") which violates the closed-book constraint.
  *   *Typical Mistake:* Name-dropping scholars (Elster, Holmes) without defining them, or citing real cases (Basic Structure Doctrine) instead of using the Marisia facts.

  **Grade Boundaries:**
  *   **A (20-25):** Makes all five moves. The "Crew" analogy is the engine of the argument.
  *   **B (15-19):** Makes moves A, B, and D, but treats the "Constituent Power" claim superficially.
  *   **C (10-14):** Identifies the Court's role but misses the "Rule vs. Ruler" philosophical distinction.
  *   **D/F (0-9):** Treats the prompt as a standard constitutional law question; ignores the seminar's philosophical framework.
