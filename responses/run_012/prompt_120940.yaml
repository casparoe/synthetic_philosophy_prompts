      *   **Requirement:** Give a verdict (no shrugging). Defend the verdict. Evaluate the friend's test ("same prescriptions implies idle dispute").
      *   **Key Textual References:** Ox Mountain (Mencius), Child-at-the-Well (Mencius), Crooked Wood/Steaming & Bending (Xunzi), Sagehood potential (Xunzi).
      *   **Institutional Implications:** Would they design different institutions?
      *   **Tone:** Academic, rigorous, engaging with the nuance expected of a PhD student, but decisive.

  2.  **Deconstruct the "Deflationary" Argument (The Friend's View):**
      *   *Premise:* Both agree moral cultivation requires effort, ritual (*li*), teachers, and environment.
      *   *Premise:* Both agree anyone can become a sage (Mencius via extending sprouts, Xunzi via accumulation/artifice).
      *   *Conclusion:* The dispute is semantic (what counts as "nature").
      *   *Critique:* This relies on a pragmatic/functionalist criterion of meaning. If action $A$ follows from Theory $T1$ and Theory $T2$, $T1$ and $T2$ are equivalent *for practical purposes*. But are they equivalent *philosophically*?

  3.  **Deconstruct the "Substantive" Argument:**
      *   *Mencius:* Nature is normative. The sprouts (*duan*) are *already* moral directions. Cultivation is *internal* development (extension, *tui*). Failure is external corruption (Ox Mountain).
      *   *Xunzi:* Nature is descriptive/biological. Desires are amoral/chaotic. Ritual is *external* imposition (artifice, *wei*). Cultivation is transformation through friction.
      *   *Difference:* It's not just about *effort*; it's about the *direction* of effort (uncovering vs. remaking) and the *source* of authority (internal heart-mind vs. external sages/ancients).

  4.  **Evaluate the Friend's Test ("Same Prescriptions = Idle Dispute"):**
      *   *Problem 1:* Do they actually have the *same* prescriptions? (Nuance in pedagogy).
