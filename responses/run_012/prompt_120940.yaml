      *   **Section 4: Institutional Implications (The "So What?" Test):**
          *   Mencius: Institutions should protect the sprouts. Limit interference. Right to revolt (King Wu).
          *   Xunzi: Institutions should shape behavior. Strong emphasis on hierarchy and teacher authority.
          *   Ox Mountain analogy: Mencius sees the barren mountain as a tragedy of external axes. Xunzi would say the mountain was always just trees waiting to be cut; the order comes from the carpenter, not the forest.

      *   **Conclusion/Verdict:**
