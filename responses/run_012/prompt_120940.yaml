      *   *Problem 3:* Metaphysical commitments drive responses to edge cases (e.g., what if rituals fail? What if the sage doesn't arise?).
      *   *Verdict on Test:* The test is too coarse. It ignores the *phenomenology* of moral life and the *metaphysics* underpinning the ethics.

  5.  **Drafting - Section by Section:**

      *   **Introduction:** Acknowledge the sophistication of the student's observation. The "Good vs. Bad" binary is indeed undergraduate level. State the thesis: The disagreement is substantive, not verbal, because it concerns the *source* of moral authority and the *phenomenology* of cultivation, which leads to divergent institutional priorities despite surface-level overlap. Reject the friend's test.

      *   **Section 1: The Semantics of *Xing* (The Deflationary Case):**
          *   Acknowledge the grain of truth. Mencius defines *xing* as normative potential (what distinguishes humans from beasts). Xunzi defines *xing* as raw material (what is spontaneous/unaltered).
          *   A.C. Graham's analysis (nature as "course of life" vs. "raw stuff").
          *   If we stop here, it looks verbal.

      *   **Section 2: The Metaphysics of Cultivation (The Substantive Case):**
          *   Mencius: *Extension* (*tui*). The Child-at-the-Well. The reaction is spontaneous. Ritual is the flowering of the sprout.
          *   Xunzi: *Transformation* (*hua*). Crooked wood. Ritual is a straightening frame. It goes *against* spontaneity.
          *   Key distinction: Is ritual the *expression* of nature (Mencius) or the *correction* of nature (Xunzi)? This is ontological, not just semantic.

      *   **Section 3: Evaluating the Friend's Test:**
          *   "Same prescriptions implies idle dispute."
          *   Counter-argument 1: Prescriptions aren't identical. Mencius prioritizes self-reflection/finding the lost heart. Xunzi prioritizes study/imitation of models.
          *   Counter-argument 2: Justifications matter. If the "sprout" view is true, authoritarianism is dangerous (it crushes sprouts). If the "crooked wood" view is true, authoritarianism might be necessary (to bend the wood).
