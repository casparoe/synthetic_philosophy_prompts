answer: |-
  The ink in the pot had skinned over twice before Ilian dipped his nib again. The ledger lay open, a mouth waiting to be fed, but the words refused to settle. The rule was simple, carved into the lintel of the scriptorium above the door: *No Word Shall Stand Above Another.* It was the Governor's dream, a register of the port of Vessel that belonged to no one faction. The Tide-Masters could not call it a Delay; the Coin-Brokers could not call it a Loss; the Ash-Keepers could not call it a Sin. Every entry had to be reachable from any starting point. Every term a headword. Every context a topic.

  Ilian rubbed his eyes. The salt air seeped through the shutters, sticky and cold. Outside, the bells of the harbor rang the tides, deep and bronze. Inside, the silence was thin, stretched tight over the scratching of his pen.

  The door opened without a knock. Kael from the Coin-Brokers stepped in, followed closely by Oren of the Ash. They did not look at each other. They looked at the ledger.

  "The afternoon of the fourth tide," Kael said. He placed a slip of parchment on the desk. "Contract breach. Unloading halted. Wages accrued during stoppage."

  Oren placed his own slip on top of Kael's. "Profanation. The sacred drum was silenced during the Hour of Smoke. The workers turned away from the shrine."

  Ilian looked at the two slips. They described the same hours. The same sun. The same men standing on the same docks. But they were not the same event.

  "If I write 'Contract Breach'," Ilian said, his voice rough from disuse, "then the silence of the drum is context. It becomes the cause of the breach."

  "The drum caused nothing," Kael snapped. "The crane snapped. The drum was irrelevant."

  "The crane snapped because the hands were praying," Oren said. "The silence was the action. The breakage was the consequence."

  Ilian picked up his pen. He tried to write the entry that satisfied the rule. He could not start with *Crane*. He could not start with *Drum*. He had to write a node where both were equal. He dipped the nib.

  *Event 449: Cessation of Labor.*

  He paused. *Cessation* implied a prior motion. Whose motion? The crane's? The prayer's? If he wrote *Cessation*, he privileged the idea of work. The Ash-Keepers would strike it. They did not recognize labor as the primary state of being.

  "Write it as it happened," Kael said.

  "It happened twice," Ilian said. "Once for your ledgers, once for your gods."

  He tried again. He wrote: *The moment the rope parted and the drum stopped.*

  It was a sentence, not a header. It demanded a narrative. It demanded a *before* and an *after*. But the Flat Index required simultaneity. It required that *Rope* refer to *Drum* and *Drum* refer to *Rope* without one causing the other. But in the world, things collide. Causes eat effects.

  "Merge them," Oren said. "One entry. One truth."

  Ilian looked at the page. If he merged them, he had to decide where the event began. Did it begin when the priest lit the incense? Or when the foreman signaled the lift? If he chose the incense, the Coin-Brokers lost the hour of pay before the fire. If he chose the signal, the Ash-Keepers lost the sanctity of the preparation.

  He wrote: *The intersection of the lifted load and the rising smoke.*

  It was clumsy. It sounded like geometry, not history. But it held the symmetry. He looked at Kael and Oren. They were both dissatisfied. They wanted their word to be the sun, and the other's word to be the planet orbiting it. Ilian was forcing them to be binary stars, locked in a gravity that allowed no center.

  "Is it done?" Kael asked.

  "It is indexed," Ilian said.

  He turned the page. The ledger was heavy, thick with paper that had no grain. He had been working on this season for three months. The Governor wanted a history of Vessel that was true from every angle. But a history is a line. This was becoming a web.

  Ilian looked down at the current page. He needed to cross-reference the *Cessation* with the previous month's *Grain Arrival*. He dipped the pen. His hand moved automatically, seeking the link that would satisfy the rule. He needed to define the *Grain Arrival* by its relationship to the *Cessation*, even though the grain had come weeks prior. To make the index flat, the past had to depend on the future.

  He wrote: *The shipment that would fail to feed the winter.*

  The ink dried dark and absolute. Ilian stared at the sentence. The winter had not come. The famine was not written in the stars, only in the potential rot of the hulls. Nobody living could say the grain would fail. It was a prophecy disguised as a catalog entry. But if he did not write it, the *Grain* entry had no link to the *Cessation* entry except through time, and time belonged to the Tide-Masters. To keep the symmetry, he had to steal knowledge from a future that might not happen.

  He blotting the page. The room felt smaller. The ledger was not recording what was. It was recording what could be seen from nowhere.

  ***

  **INDEX OF OCCURRENCES: SEASON OF SALT**

  **ASH (Rising of)**
  *See SMOKE; See PRAYER (Interrupted); See ROPE (Parting of).*
  *Note: Not cause of delay. See CONTRACT.*

  **CONTRACT (Breaches of)**
  *See LABOR (Cessation of); See CRANE (Failure of); See DRUM (Silence of).*
  *Note: Not result of profanation. See ASH.*

  **DRUM (Silence of)**
  *See PRAYER; See CONTRACT; See WIND (Shift in).*
  *Note: Simultaneous with load shift. See TIDE.*

  **GRAIN (Arrival of)**
  *See WINTER (Famine of); See SHIP (Hull Rot); See EVENT 449.*
  *Note: Defined by future consumption failure.*

  **LABOR (Cessation of)**
  *See CONTRACT; See ASH; See MOMENT (The Intersection).*
  *Note: No start time recorded. See TIDE (High).*

  **MOMENT (The Intersection)**
  *See ROPE; See SMOKE; See WAGES (Unpaid).*
  *Note: Duration undefined. See CLOCK (Tower).*

  **ROPE (Parting of)**
  *See CRANE; See LABOR; See ASH.*
  *Note: Tension cause disputed. See WIND.*

  **TIDE (High)**
  *See HARBOR; See GRAIN; See DRUM.*
  *Note: Not master clock. See CLOCK (Tower).*

  **WIND (Shift in)**
  *See ROPE; See SMOKE; See TIDE.*
  *Note: Direction irrelevant to prayer. See ASH.*

  ***

  Ilian closed the ledger. The leather covers creaked. The index page he had just compiled sat behind him, a map of a city where every street led to every other street simultaneously. It was impossible to walk. If you started at *Ash*, you were immediately at *Contract*. If you started at *Tide*, you were already at *Wind*. There was no journey. There was only presence.

  A history requires a path. You walk from the beginning to the end. You say *this* happened, then *that* happened. But the Flat Index said *this* is *that*. It collapsed the distance between cause and effect. It collapsed the distance between the priest's worry and the broker's loss.

  He stood up and walked to the shelving unit. The other ledgers lined the wall. They were labeled by the factions. *Annals of the Tide.* *Chronicles of the Coin.* *Records of the Ash.* They were thin, neat, and useful. You could find out when the ship sailed. You could find out who got paid. You could find out who sinned.

  This ledger was thick. It was useless. It contained everything and therefore nothing. It was a mirror of the port, but a mirror that showed all sides at once, which meant it showed no side clearly.

  He took the ledger down. He needed to bind it. To shelve it, it needed a spine label. A category.

  If he wrote *Annals*, he privileged the Tide-Masters' time. The events would be read in sequence. The narrative would flow like water. The symmetry would break. The *Ash* would become a footnote to the *Tide*.

  If he wrote *Chronicle*, he privileged the Ash-Keepers' meaning. The events would be read by moral weight. The *Contract* would become a sin or a virtue. The symmetry would break. The *Tide* would become a backdrop to the *Ash*.

  If he wrote *Register*, he privileged the Coin-Brokers' inventory. The events would be assets and liabilities. The symmetry would break. The *Ash* and the *Tide* would become costs.

  He could leave it blank. A book with no title. An archive without a key. It would sit on the shelf, a block of paper that refused to speak until someone chose a way to read it. But if no one chose, it was dead. If someone chose, it was a lie.

  Ilian picked up the brush and the pot of gold leaf. The light from the window was fading. The harbor bells rang the evening tide, a single note that claimed the hour for the sea.

  He held the brush over the spine. The gold dust hovered in the air, catching the light. He could feel the weight of the book in his other hand. It was heavy with everything that had happened, and everything that hadn't.

  If he labeled it, he created a history. He gave the past a shape. He killed the symmetry. He made it possible for a student, years from now, to open the book and understand a story. He would be giving them a world they could walk through.

  If he left it blank, he kept the truth. He preserved the impossibility. He gave them a wall. He gave them the exact moment where the world refused to be written down without breaking.

  The brush trembled. A drop of gold fell onto his thumb. It looked like a coin. It looked like a sun. It looked like a drop of ink.

  Ilian lowered the brush to the leather. He did not write a title. He drew a line. A single horizontal line across the center of the spine. It was not a word. It was not a category. It was a boundary. It said: *Here is where the mapping stops.*

  He placed the book on the shelf. It sat between the *Annals of the Tide* and the *Chronicles of the Ash*. It did not fit. It pushed the other books apart. The gap remained open, a dark slit in the row of leather bindings.

  Ilian wiped the gold from his thumb. He blew out the candle. The room went dark, but the line on the spine caught the last of the twilight from the window, a thin, bright scar in the shadows. He left the door open. The sound of the harbor came in, the wind, the water, the voices arguing over what had happened today. They would argue until the bells rang again.

  He walked out into the corridor. He did not look back at the shelf. He did not know if he had finished the work or if he had simply refused to do it. The ledger sat in the dark, full of entries that referenced futures that never came, and pasts that never ended, waiting for a hand to open it and decide which way was up.
