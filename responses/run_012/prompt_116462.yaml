  # The Belief and Desire Commitment Inventory

  **Instructions:** Read each scenario and select the option that best matches your immediate reaction. Do not worry about what a specific philosophical theory "should" say; answer based on what you think is actually true or what you would actually do. There are no right or wrong answers.

  ### 1. The Dog and the Bone
  A dog watches you hide a bone in Box A. You leave the room. While you are gone, a assistant moves the bone to Box B. The dog returns and searches Box A.
  *   **A.** The dog literally has a false belief about the bone's location.
  *   **B.** The dog has a habit or expectation, but calling it a "belief" is just a shortcut for us.
  *   **C.** The dog has a desire to find the bone, but no cognitive state corresponding to belief.

  ### 2. The Confabulating Chooser
  A person picks one sock from a row of identical socks. When asked why, they sincerely say, "I liked the texture." Eye-tracking shows they actually reached for the one on the far right due to a spatial bias they deny.
  *   **A.** They are lying or self-deceived; the stated belief is not real.
  *   **B.** They have two conflicting states: a conscious report and an unconscious driver.
  *   **C.** The reason they gave is a social story; the real cause was mechanical, not mental.

  ### 3. The Future Neuroscience
  Imagine a mature neuroscience that can predict every human action and report perfectly by scanning subpersonal mechanisms, without ever using the words "belief" or "desire."
  *   **A.** This proves beliefs and desires do not exist.
  *   **B.** This proves beliefs and desires are just complex neural patterns.
  *   **C.** The science might work without the words, even if the states exist.

  ### 4. The Drive Without Data
  Consider a simple robot programmed to seek charging stations (drive) but with no memory or data storage capacity (no map of the world).
  *   **A.** It has a desire (goal) but no beliefs.
  *   **B.** It has neither; it is just a machine following code.
  *   **C.** It has a unified "goal state" that combines both functions.

  ### 5. The Fluent Machine
  An AI system produces fluent, self-consistent reports like "I believe it is raining" whenever its sensors detect water, and acts accordingly.
  *   **A.** If it acts on the information, it has a belief, regardless of inner feeling.
  *   **B.** It only has a belief if the information is stored like a sentence in a language of thought.
  *   **C.** It only has a belief if the information is stored like a map or spatial model.

  ### 6. The Unsupported Claim
  A person says, "I believe it will rain tomorrow," but admits they have looked at no weather reports and have no evidence.
  *   **A.** They are describing a mental state they happen to have, however irrational.
  *   **B.** They are violating a rule about what one ought to claim; belief is a commitment.
  *   **C.** Their cognitive mechanism for evidence-gathering is broken.

  ### 7. The History of Science
  Think of scientific terms that changed over time. "Phlogiston" was discarded. "Gene" was kept but redefined. "Temperature" was kept but reduced to mean molecular motion.
  *   **A.** "Belief" is like Phlogiston; it should be discarded.
  *   **B.** "Belief" is like Gene; the folk idea is wrong, but the term refers to a real thing we will find.
  *   **C.** "Belief" is like Temperature; the folk idea is roughly right, and the term refers to a functional role.

  ### 8. The Practical Decision
  Suppose neuroscience shows that "belief" is not a precise category, but using the word helps people coordinate social life.
  *   **A.** We should stop using the word because it is strictly false.
  *   **B.** We should stop using the word because it causes confusion, even if it works sometimes.
  *   **C.** We should keep using the word because it is useful, even if it is imprecise.

  ### 9. The Lonely Interpreter
  If a human grew up alone on a desert island, never interacting with another interpreter, and processed information to survive.
  *   **A.** They would still have beliefs; interpretation is not required.
  *   **B.** They would not have beliefs; beliefs are constituted by being interpreted by others.
  *   **C.** They would have proto-beliefs, but not full beliefs.

  ### 10. The Semantic Dispute
  Two scientists argue: one says "Beliefs don't exist," the other says "Beliefs are neural states." They agree on all the physical facts about the brain.
  *   **A.** One of them is wrong about how the world is.
  *   **B.** They are disagreeing about how to use the word "belief," not about the world.
  *   **C.** The word "belief" is too vague to have a truth value.

  ***

  # Scoring Key and Analysis

  **Do not read this section until you have answered all questions.**

  ### Scoring Rules
  Determine your outcome by following these steps in order. The first rule that matches your answers determines your position.

  1.  **Meta-Semantic View (j):** If you chose **B** on **Q10**.
      *   *Commitment:* You must admit philosophers have been arguing about words, not minds.
  2.  **Normative-Status View (h):** If you chose **B** on **Q6**.
      *   *Commitment:* You must tell a brain-damaged patient they are breaking a rule, not broken.
  3.  **Partial Eliminativism (c):** If you chose **A** on **Q4**.
      *   *Commitment:* You must explain how wanting works without thinking.
  4.  **Interpretivism (e):** If you chose **B** on **Q9**.
      *   *Commitment:* You must deny beliefs to a lonely genius on a desert island.
  5.  **Content-Revisionism (i):** If you chose **C** on **Q5**.
      *   *Commitment:* You must explain how a map can be false without being a sentence.
  6.  **Revisionary Eliminativism (b):** If you chose **B** or **C** on **Q3** AND **B** on **Q8**.
      *   *Commitment:* You must ban a word that might describe something real.
  7.  **Descriptive Eliminativism (a):** If you chose **A** on **Q3** AND **A** on **Q8**.
      *   *Commitment:* You must tell your mother she doesn't actually love you.
  8.  **Instrumentalism/Fictionalism (d):** If you chose **A** on **Q3** AND **C** on **Q8**.
      *   *Commitment:* You must teach your children things you know are false.
  9.  **Refinement (g):** If you chose **B** on **Q7**.
      *   *Commitment:* You must accept that your current concept of belief is mostly wrong.
  10. **Realist Retention (f):** If none of the above apply (typically **C** on **Q7**, **A** or **B** on **Q5**, **A** or **C** on **Q8**).
      *   *Commitment:* You must accept that folk psychology is as rigorous as physics.

  ### Analysis of Unreachable or Incoherent Patterns

  The rules above prioritize specific theoretical commitments. However, certain answer combinations are logically possible to select but are not assigned an outcome because they represent incoherent or unoccupied positions.

  *   **Pattern: Q3=A (No Existence) + Q6=B (Normative).**
      *   *Status:* **Incoherent.** You cannot claim beliefs do not exist (Q3) while simultaneously claiming they are normative commitments we ought to hold (Q6). If they don't exist, there is no status to occupy.
      *   *Recommendation:* This suggests a confusion between ontology and normativity. The respondent likely needs to clarify if they think the *norm* exists even if the *state* doesn't (which would push them to (h) over (a)).
  *   **Pattern: Q9=B (Interpreter Required) + Q4=A (Desire without Belief).**
      *   *Status:* **Unoccupied.** Interpretivism (Q9=B) usually treats belief and desire as a holistic package (the Intentional Stance). Separating them (Q4=A) while requiring an interpreter is a position rarely defended.
      *   *Recommendation:* This is a viable but niche position (Partial Interpretivism). You might consider adding it as a distinct outcome if you wish to teach hybrid views.
  *   **Pattern: Q7=A (Phlogiston) + Q8=C (Keep Using).**
      *   *Status:* **Incoherent.** If a term is like "Phlogiston" (refers to nothing), there is no standard justification for keeping it as more than a historical footnote.
      *   *Recommendation:* This maps to a radical Fictionalism not captured by (d). (d) assumes utility; this pattern assumes utility despite total falsity.
  *   **Pattern: Q10=A (One is Wrong) + Q3=C (Science won't use word).**
      *   *Status:* **Merely Unoccupied.** This suggests there is a fact of the matter about belief (Q10), but science won't track it (Q3). This is a form of Non-Naturalistic Realism that is logically possible but scientifically unpopular.

  ### Instrument Limitations

  *   **Nearly Unreachable Outcome:** **Revisionary Eliminativism (b).** In practice, respondents who believe we should stop using the term (Q8=B) almost always also believe the term refers to nothing (Q3=A). Finding a respondent who thinks beliefs *might* exist (Q3=B/C) but we should *stop* talking about them (Q8=B) is difficult without explicit training. The instrument may under-count (b) relative to (a).
  *   **Inseparable Pair:** **Realist Retention (f) and Refinement (g).** While Q7 attempts to separate these via the "Temperature" vs. "Gene" analogy, many respondents will see these as the same position (the term survives and refers to something real). The distinction relies on whether the folk *concept* is roughly correct (f) or mostly wrong but referential (g). In a 10-question instrument, this nuance is often collapsed by respondents who simply agree that "Beliefs are real."
  *   **Inseparable Pair:** **Descriptive Eliminativism (a) and Instrumentalism (d).** Both agree that science will not posit beliefs (Q3=A). They separate only on usage (Q8). A respondent who answers "Science says No" but "Keep Using" might be (d), but could also be a confused (a) who doesn't realize the tension. The instrument relies on Q8 to separate them, which is a pragmatic rather than metaphysical question.

  ### Instructor Notes for Seminar Discussion
  *   **The "Closet Eliminativist" Trap:** Students who self-identify as Realists often score as (a) or (d). Use Q3 and Q8 to show them that their commitment to neuroscience often entails eliminativism, even if they keep using the word "belief" casually.
  *   **The Normative Outlier:** Students who score (h) often feel alienated by the empirical framing of the other questions. Use this to introduce the distinction between the *space of causes* and the *space of reasons*.
  *   **The Semantic Deflation:** Students who score (j) may resist engaging with the cases. Challenge them to explain why the empirical cases (Q1-Q5) feel substantive if the debate is merely verbal.
