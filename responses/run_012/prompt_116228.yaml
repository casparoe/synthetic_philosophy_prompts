answer: |-
  **The Procedure: Six Steps to a Defensible Number**

  This protocol is designed for a two-day turnaround without statistical software. It forces triangulation to prevent reference-class gerrymandering and caps inside-view bias to prevent storytelling from overriding data.

  **Step 1: Define the Failure Event (Binary Only)**
  Do not forecast "instability." Define the specific threshold for "regime failure."
  *   *Standard:* Unconstitutional removal of the head of government or ruling party loss of monopoly power.
  *   *Requirement:* Must be observable and binary (Yes/No) within the horizon (5 years).
  *   *Stop Condition:* If the event cannot be defined binary (e.g., "gradual decline"), stop. Refuse the request.

  **Step 2: Triangulate Reference Classes**
  You must select **three** distinct reference classes. You are not allowed to pick one.
  1.  **Structural:** Countries with similar GDP/capita and growth trajectory.
  2.  **Political:** Countries with similar regime type (use a standard index like Polity or V-Dem, not your own label).
  3.  **Regional:** Countries in the same geographic neighborhood.
  *   *Requirement:* Each class must have a minimum of 20 historical cases over the last 50 years. If a class has fewer, discard it.
  *   *Settled:* Using multiple classes reduces selection bias.
  *   *Contested:* Which classes matter most. I prioritize Structural over Political because economic shocks drive most failures.

  **Step 3: Correct for Non-Independence (Galton's Problem)**
  You are correct: cases are not independent. Contagion matters. If three neighbors collapse in the same 24-month window due to a regional shock, count that as **one** event for your base rate calculation, not three.
  *   *Action:* When counting historical failures in your reference classes, cluster simultaneous regional collapses.
  *   *Arithmetic:* If your class has 20 countries but 10 failed in a single regional wave, your effective *N* for failure events is lower. Do not inflate the probability based on clustered events.
  *   *Settled:* Spatial autocorrelation invalidates standard independence assumptions.
  *   *Contested:* How aggressively to discount. I recommend counting a regional wave as a single data point for the failure count, though the population *N* remains the same. This lowers the calculated frequency.

  **Step 4: Calculate the Raw Base Rate**
  For each of the three classes, calculate: *(Adjusted Failure Count) / (Total Cases)*.
  *   *Output:* You now have three percentages.
  *   *Decision Rule:*
      *   If the range between the three rates is **<10%** (e.g., 15%, 20%, 18%): Average them. Proceed to Step 5.
      *   If the range is **>10%** (e.g., 5%, 30%, 15%): Do not average. Proceed to Step 6 (Ambiguity Protocol).

  **Step 5: The Inside-View Cap**
  This is where analysts try to override the data with "unique factors." You must limit this.
  *   *Rule:* An analyst may adjust the base rate based on country-specific intelligence (coup plots, leader health, etc.), but the adjustment is capped at **20 percentage points** toward their view.
  *   *Example:* If Base Rate is 10%, and analyst is convinced it's a sure thing, max forecast is 30%. If analyst thinks it's impossible, min forecast is 0%.
  *   *Rationale:* If the base rate says 10% and you say 90%, you are likely ignoring unknown unknowns.
  *   *Contested:* This cap is arbitrary. Tetlock-style superforecasters adjust more freely. For a general desk with no stats training, a hard cap prevents overconfidence.

  **Step 6: Output Rules (Number, Range, or Refusal)**
  *   **Clean Number:** Step 4 range was <10%. Apply Step 5 cap. Give a single percentage.
  *   **Range:** Step 4 range was >10%. Report the spread (e.g., "15% to 30%"). Tell the client the uncertainty lies in how we classify the regime, not the math.
  *   **Refusal:** If no class meets the minimum *N* of 20, or if the Inside View requires moving the needle beyond the 20% cap to be honest.
  *   *Script for Refusal:* "Current historical analogues are insufficient to generate a statistically valid probability. Risk is non-quantifiable."

  ***

  **The Three Cases**

  **Case 1: The Clean Run (Country A)**
  *   *Profile:* Lower-middle income autocracy in Southeast Asia. Stable growth, no immediate neighbors collapsing.
  *   *Step 2 (Classes):*
      1.  Structural (GDP peers): 15% failure rate.
      2.  Political (Autocracies): 18% failure rate.
      3.  Regional (SE Asia): 12% failure rate.
  *   *Step 3 (Independence):* No regional clusters in the historical data. Counts stand.
  *   *Step 4 (Convergence):* Range is 6% (12-18%). Passes the <10% test. Average = 15%.
  *   *Step 5 (Inside View):* Analyst knows the General is sick. Wants to push to 40%. Cap limits them to 35% (15% + 20%).
  *   *Output:* **35% probability.**
  *   *Why it works:* The classes agreed. The inside view was tempered. The client gets a number, you keep your sanity.

  **Case 2: The Class Swing (Country B)**
  *   *Profile:* Hybrid regime in Eastern Europe. High inequality, democratic institutions but autocratic practices.
  *   *Step 2 (Classes):*
      1.  Structural (GDP peers): 10% failure rate (Rich countries don't collapse).
      2.  Political (Hybrid Regimes): 45% failure rate (These are unstable by definition).
      3.  Regional (Eastern Europe): 5% failure rate (Stable neighborhood).
  *   *Step 4 (Divergence):* Range is 40% (5% to 45%). Fails the <10% test.
  *   *Action:* Do not average. Averaging 5% and 45% gives 25%, which implies precision you do not have.
  *   *Output:* **5% to 45% probability.**
  *   *Client Script:* "The risk depends entirely on whether this country behaves like a wealthy democracy or an unstable hybrid. History offers both precedents. We cannot weight one class over the other without introducing bias."
  *   *Why it's ugly:* It admits ignorance. But it prevents you from signing off on 25% and being wrong because you ignored the hybrid risk.

  **Case 3: The Refusal (Country C)**
  *   *Profile:* Post-conflict state under foreign military occupation. Unique legal status.
  *   *Step 2 (Classes):*
      1.  Structural: No peers (unique aid dependency).
      2.  Political: No peers (occupation status).
      3.  Regional: Neighbors are all stable democracies; C is an outlier.
  *   *Step 3 (Independence):* Historical cases of "occupation" are fewer than 20 in the last 50 years.
  *   *Step 4 (Data):* Cannot calculate base rate.
  *   *Step 5 (Inside View):* Analyst believes collapse is 80% likely based on intel. Base rate is 0% (no data). To get to 80%, analyst must move 80 points. Cap allows only 20.
  *   *Output:* **Refusal.**
  *   *Client Script:* "This scenario lacks historical analogues. Any number provided would be a guess dressed as data. We recommend scenario planning instead of probabilistic forecasting."
  *   *Why you hate it:* Clients hate refusals. But signing a number here is malpractice. This procedure forces you to say no.

  ***

  **Limitations and Misfire Points**

  **1. The "Recent Past" Bias**
  This procedure relies on historical data (last 50 years). It assumes the future resembles the past. If the mechanism of regime failure changes (e.g., cyber-coups, AI-driven surveillance making autocracies invulnerable), the base rates are garbage.
  *   *Mitigation:* Review the *cause* of failures in your reference class. If 90% were military coups and the country you're assessing has no army, the base rate is irrelevant even if the class matches.

  **2. The 20% Cap is Arbitrary**
  I flagged this as contested. There is no statistical law that says inside views should be capped at 20 percentage points. In some cases (e.g., leader diagnosed with terminal cancer), the inside view *should* dominate.
  *   *Risk:* You will under-forecast black swans where the inside view is actually correct.
  *   *Trade-off:* You will also avoid over-forecasting based on analyst hubris. For a shop without stats training, bias protection is more valuable than sensitivity.

  **3. Galton's Problem Handling is Rough**
  My instruction to count regional waves as "one event" is a heuristic, not a rigorous statistical correction (like spatial autocorrelation models).
  *   *Risk:* You might under-count risk in highly contagious regions.
  *   *Trade-off:* It prevents you from treating a regional epidemic of collapse as independent trials. It is conservative.

  **4. The "Reference Class Tennis" Risk Remains**
  Requiring three classes helps, but analysts can still game Step 2 by choosing three similar classes that all yield the wrong answer.
  *   *Mitigation:* You (the desk head) must audit the class selection. If all three classes are defined by GDP, reject them. They must be structurally distinct (Economy, Regime Type, Geography).

  **5. False Precision in the "Clean" Cases**
  Even when the three classes agree (Case 1), the world may have changed. A 15% base rate calculated on 1970-2020 data might not apply to 2024-2029.
  *   *Reality Check:* Treat the output as a "prior probability," not a prediction. It is the starting point for betting, not the finish line.

  **Final Note on Judgment**
  This procedure does not remove judgment; it relocates it. Judgment is no longer used to pick the final number directly. It is used to:
  1.  Define the failure event.
  2.  Select the three reference classes.
  3.  Decide if the inside view warrants the maximum 20% adjustment.

  If your analysts complain this feels restrictive, tell them it is. It is designed to stop them from being creatively wrong. It forces them to be boringly right, or honestly uncertain.
