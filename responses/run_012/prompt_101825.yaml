  1. **The "All Models Are Wrong" Philosopher:** "Isn't 'Britain vs. China' just a convenient shorthand? Every model aggregates; if we reject this contrast class because it's an abstraction, what unit of analysis is left that isn't also an artifact?" *Reply:* Shorthand is fine for heuristics, but dangerous for causal inference where mechanisms vary within the unit. *Soft Spot:* Doesn't explain where the line is drawn; almost all social science units are somewhat arbitrary aggregates, so this could apply to regions just as easily as nations.

  2. **The China Historian:** "You're dissecting the question, but you're still accepting the premise that industrialization was the goal. By focusing on 'why not China,' you're still centering the European outcome as the default success state." *Reply:* I'm analyzing the logic of the question, not endorsing the teleology; we can ask why the Yangzi diverged from Britain without valuing one over the other. *Soft Spot:* Hard to disentangle the structural critique from the normative weight of the "failure" narrative you're trying to dismantle; the framing itself carries baggage.

  3. **The Data-Driven Cliometrician:** "Regional wage and price data for Qing China is sparse and unreliable compared to British national accounts. If we disaggregate, we lose the statistical power to run the unified growth models you claim are necessary." *Reply:* Data availability shouldn't dictate ontology; we shouldn't ask wrong questions just because the data exists. *Soft Spot:* Acknowledges that your "tractable" alternative might be empirically unanswerable with current evidence, leaving us with no answer at all.

  4. **The Institutionalist:** "You say compare regions, but property rights, tax rates, and trade bans were set by the Imperial court and Parliament. Disaggregating ignores the national-level institutional constraints that bound both Britain and the Yangzi Delta." *Reply:* Enforcement and local adaptation varied significantly despite central decrees; the binding constraints were often local. *Soft Spot:* Some imperial policies (like the sea ban) were uniformly binding and genuinely national, making the "China" unit relevant for those specific variables.

  5. **The Sharp Philosopher:** "You claim the question is ill-posed until we fix a contrast class. But isn't the choice of contrast class itself theory-laden? You haven't escaped bias, you've just moved it upstream to the selection of the region." *Reply:* Yes, but making the selection explicit allows us to critique the choice, whereas 'China' hides the choice behind a naturalized border. *Soft Spot:* If the choice is always theory-laden, your critique is pragmatic rather than logical, weakening the claim that the original question was fundamentally 'ill-posed.'

  6. **The Dreaded Question (The Senior Cliometrician):** "Okay, suppose you're right and the Great Divergence is an aggregation artifact. Does that mean there is no general phenomenon of industrialization to model? Are you telling this room that unified growth theory is impossible and we should all just write regional case studies?" *Reply:* I'm arguing for mechanistic specificity over general laws; generalizations should come after, not before, the causal work. *Soft Spot:* Admits you have no positive research program to offer, effectively telling the room their work is obsolete without providing a viable alternative framework.
