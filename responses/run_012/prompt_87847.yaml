answer: |-
  ### Preliminary Conceptual Map

  *To ensure we are arguing about the same thing, we distinguish three distinct readings of the phrase "the brain computes."*

  1.  **Causal-Mechanical Reading:** The system possesses an intrinsic physical structure whose causal dynamics are isomorphic to the state transitions of a formal machine (e.g., specific voltage thresholds trigger discrete state changes).
  2.  **Representational Reading:** The system manipulates vehicles that carry content (syntax sensitive to semantics), where "computation" implies the processing of information with correctness conditions.
  3.  **Model-Relative Reading:** "Computation" is a predicate applied by an observer when a formal model successfully predicts the system's behavior; it is a property of the description, not the system.

  *Side A asserts the brain satisfies (1) and (2) objectively. Side B asserts the brain satisfies (1) only trivially, (2) only derivatively, and that (3) is the only robust sense in which "computation" applies.*

  ***

  ### 1. Agreed Claims

  1.  **Physicalism:** Both sides agree the brain is a physical system governed by causal laws. Neither side posits non-physical substances or magic.
  2.  **Utility of Models:** Both sides agree that computational models (e.g., neural networks, automata) are currently the most effective tools for predicting and controlling neural behavior.
  3.  **Triviality Acknowledgement:** Both sides acknowledge the logical point that, without constraints, almost any physical system can be mapped onto some computational description (the "triviality result"). We disagree on the *significance* of this, not its logical validity.
  4.  **Causal Necessity:** Both sides agree that for any computation to occur in the brain, there must be a underlying causal mechanism that carries it out. Computation does not float free of physics.
  5.  **Granularity:** Both sides agree that descriptions at different levels of abstraction (ions vs. spikes vs. functions) are possible. We disagree on whether the higher levels are *autonomous* or merely *summaries*.
  6.  **Mutual Grants:**
      *   **Side A grants to Side B:** If "computation" is defined so loosely that a rock computes, the term loses explanatory power. Constraints on implementation are necessary.
      *   **Side B grants to Side A:** If a computational model predicts novel phenomena that mechanistic details obscure, the computational level has pragmatic value, even if not ontologically fundamental.

  ### 2. Where They Still Differ

  *Formulated in wording each side accepts as an accurate statement of their own position.*

  1.  **Ontological Status:**
      *   **Side A:** Computation is an intrinsic, objective property of the brain, fixed by its causal organization. The brain is a computer in the same way a heart is a pump, regardless of whether an observer is present.
      *   **Side B:** Computation is an ascription dependent on an observer's interests and mapping conventions. The brain is a computer only relative to a modeler, in the way a stone can be a paperweight relative to a user.
  2.  **Explanatory Autonomy:**
      *   **Side A:** Computational explanations are *sui generis*. They explain *why* a behavior occurs by citing the function being computed, without needing to reference the specific physical substrate (ions/proteins).
      *   **Side B:** Computational explanations are shorthand for complex causal-mechanical stories. They are useful heuristics, but the *real* explanation is always the causal mechanism.
  3.  **Individuation of Process:**
      *   **Side A:** The physical structure of the brain (e.g., synaptic weights, connectivity) objectively fixes *which* computation is being performed.
      *   **Side B:** The physical structure underdetermines the computation. External context or the modeler's choice of input/output mapping fixes which computation is being described.

  ### 3. The Cruxes

  *Sub-questions such that settling one would move at least one side.*

  1.  **Crux (a): Computational Equivalence and Cognitive Equivalence.**
      *   *Question:* If two physically distinct systems (e.g., biological tissue and silicon) implement the same computational function, are they cognitively equivalent?
      *   *Stakes:* If yes, computation is the natural kind of cognition (Side A). If no, the physical implementation matters essentially (Side B).
  2.  **Crux (b): Explanatory Autonomy.**
      *   *Question:* Can a computational description be genuinely explanatory if it does not map uniquely to a specific causal mechanism (i.e., in cases of multiple realizability)?
      *   *Stakes:* If yes, computational level is autonomous (Side A). If no, computational explanation is just a placeholder for unknown mechanisms (Side B).
  3.  **Crux (c): The Many-Computations Problem.**
      *   *Question:* When a single physical system satisfies the structural requirements for two incompatible computational descriptions simultaneously, is there a fact of the matter about which one it "really" implements?
      *   *Stakes:* If yes, there are intrinsic constraints on computation (Side A). If no, implementation is relative to interpretation (Side B).

  ### 4. Concrete Cases and Predictions

  *For each crux, a specific case both sides agree would bear on the question, with pre-committed predictions.*

  **Case for Crux (a): The "Silicon Swap" Thought Experiment**
  *   **Scenario:** A specific neural circuit responsible for a simple behavior (e.g., optomotor response in a fly) is replaced, neuron-by-neuron, with functionally equivalent silicon micro-circuits that match the input-output timing exactly but differ chemically.
  *   **Side A Prediction:** The cognitive/behavioral capacity persists unchanged. The substrate is irrelevant; the computation is what matters.
  *   **Side B Prediction:** At some point, the capacity will degrade or change. The specific biophysical properties (e.g., neuromodulation, timing noise) are constitutive of the cognition, not just the implementation.

  **Case for Crux (b): Neural Plasticity After Lesion**
  *   **Scenario:** A patient recovers a specific cognitive function (e.g., language production) after a stroke. Imaging shows the function is now supported by a physically distinct neural pathway with different connectivity than the original.
  *   **Side A Prediction:** The computational description of the function remains identical across the recovery. This proves the explanation lies in the abstract function, not the specific pathway.
  *   **Side B Prediction:** The computational description will necessarily change (even if subtly) to reflect the new mechanism. If the description stays the same, it is because we are ignoring the mechanistic differences that actually do the explanatory work.

  **Case for Crux (c): The "Voltage Polarity" Test on a Single Neuron**
  *   **Scenario:** A specific dendritic branch integrates inputs. We map High Voltage = '1' and Low Voltage = '0'. Under this mapping, the branch computes logical AND. We then invert the mapping (Low = '1'). Under this mapping, the branch computes logical OR.
  *   **Side A Prediction:** There is a fact of the matter about which logic gate it is, determined by the biological context (e.g., how the soma interprets the spike). The brain fixes the mapping.
  *   **Side B Prediction:** There is no fact of the matter intrinsic to the branch. It is a physical integrator. It becomes an AND or OR gate only relative to how we (or the downstream system) choose to read the signal.

  ### 5. Closing: What Would Move Us

  **Is this a verbal dispute?**
  Partly. We agree on the physics and the utility of the models. The dispute is verbal regarding the label "computer" (whether it implies intrinsic ontology or useful modeling). However, the dispute is *substantive* regarding whether computational structure is a natural kind that carves nature at its joints.

  **What would move Side A:**
  *   Evidence that computational descriptions systematically fail to predict behavior when the physical substrate changes, even when the abstract function is preserved.
  *   A rigorous demonstration that the "constraints" needed to stop triviality arguments (e.g., what counts as a state) cannot be defined without referencing the observer's intentions.

  **What would move Side B:**
  *   Discovery of intrinsic "syntactic" markers in neural tissue (analogous to the structure of DNA) that fix computational identity independent of external interpretation.
  *   A case where mechanistic explanation becomes impossibly complex, but computational explanation remains simple and predictive, forcing an admission of de facto autonomy.

  **Final Commitment:**
  We agree to treat the question "Is the brain a computer?" as shorthand for these three specific cruxes. We will not argue the slogan until we have specified which crux is under discussion.
