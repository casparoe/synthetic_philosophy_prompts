      *   **Point 5: The Basketball Analogy & Irrationality:**
          *   *Basketball:* Constitutive rules. You can't play "wrong" basketball, only "different" basketball.
          *   *Morality:* Regulative rules (mostly). Morality claims to govern action *independent* of the game.
