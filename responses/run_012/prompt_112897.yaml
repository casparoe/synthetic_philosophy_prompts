prompt: |-
  Ok so I just spent like three hours arguing with my friend Nadia about this and I'm still not sure who was making sense. Background: she did a semester abroad and came back having read a bunch of the WEIRD psychology stuff — the idea that psych research runs mostly on Western, educated, industrialized samples, and that a lot of what we treat as obvious moral intuition (fairness as proportionality, individual rights trumping duties to kin, how much intent matters for blame) is actually pretty parochial. Her conclusion is that this basically settles the moral objectivity question: if there were moral facts, people would converge on them, and they dont, so realism is just our local customs wearing a fancy hat. I tried to say that disagreement doesn't prove there's no fact of the matter, but I kept getting tied in knots and she kept saying that's just what a realist has to say. Meanwhile I also remember that some people use the same literature to argue the opposite — that there's a universal core, nobody thinks gratuitous cruelty is fine, so the variation is surface noise — and I think both moves are too fast but I can't articulate why.

  Could you walk me through the actual conceptual issue here, the gap between the descriptive claim (moral judgments vary across cultures) and the meta-ethical claim (there are no objective moral truths)? I want the real machinery, not just the is/ought point. In particular: (1) why variation in judgments can be informative about the content of moral cognition while being close to silent about whether there's a fact of the matter — and how a realist would expect variation in roughly the way we get variation in beliefs about dietary taboos or the age of the earth, as opposed to the way we get variation in taste; (2) whether the disagreement argument secretly needs an access condition, i.e. an assumption that objective moral facts would have to be obvious or easily available to any sincere inquirer, and what happens to the argument if you deny that; (3) the difference between a debunking argument (my moral beliefs have a genealogy that doesn't track the truth) and a plain disagreement argument (other people believe otherwise), and why the WEIRD evidence is usually run as the first when it most directly supports only the second; (4) whether the parties are even disagreeing about the same proposition, or whether some of the variation is really about what the moral terms are picking out, or about when you're describing versus expressing; and (5) Nadia's analogy that morality is like the rules of basketball — different leagues, different rules, and it's silly to ask which league is the correct one — and whether that's a good analogy, because I suspect it conflates constitutive rules with regulative ones but I couldn't say it well. Also she insists that if you're a realist you have to think the people who do the stuff she finds horrifying are not just mistaken but irrational — is that fair, or does it smuggle in something extra?

  I'm not looking for a reading list or who said what, I just want the distinctions laid out clearly enough that I can hold up my end next time, and some sense of which of her moves survive and which ones dont.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
