          *   Nadia wins: Morality is heavily culturally influenced. Access is not uniform.
          *   Nadia loses: This doesn't disprove realism. It doesn't force the "irrational" label. The basketball analogy fails for normative force.
          *   Advice for next time: Focus on the *Access Condition* and the *Mistake vs. Irrationality* distinction.

  4.  **Review and Refine:**
