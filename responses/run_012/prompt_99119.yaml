      *   This view is essentially Functional Decision Theory (FDT) or a form of Superrationality (Hofstadter).
      *   Core claim: Logical correlation implies rational cooperation in symmetric PD.
      *   Core mechanism: Expected utility maximization over logical outputs rather than causal interventions.

  3.  **Brainstorm Defeaters/Critiques:**
      *   *Causal Independence:* The standard objection is that my choice doesn't *cause* the other's choice. If I cooperate, the other doesn't magically cooperate; they just happen to cooperate because we are similar. But does my choice *now* change their choice *then*? CDT says no.
      *   *Exploitation:* If I meet a CDT agent (who defects), superrationality might still try to cooperate if it thinks there's correlation, leading to exploitation (Sucker's payoff).
      *   *Asymmetry:* What if the payoff matrix is slightly different? Or if one agent knows the other's code but not vice versa?
      *   *Approximate Correlation:* If correlation is 99%, does the logic hold? What if the difference is in the random seed?
      *   *Unfalsifiability:* If the theory says "cooperate only if correlated," how do we measure correlation without begging the question? Does it collapse into EDT (Evidential Decision Theory)?
      *   *Newcomb's Problem:* This view solves Newcomb's well, but fails in certain "Newcomb-like" problems where causal influence is clear but logical correlation is misleading (e.g., Smoking Lesion).
      *   *Decisiveness:* The strongest defeater is usually the exploitation by non-superrational agents or the inability to distinguish spurious correlations.

