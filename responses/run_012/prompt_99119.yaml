prompt: |-
  I am a high school student who has been trying to understand superrationality, and I have tentatively adopted a specific version of it. Take the role of an expert in decision theory and the philosophy of rational choice, think carefully before answering, and treat me as someone who wants the strongest case against my view rather than reassurance. The version I hold is this: in a symmetric one-shot Prisoner's Dilemma, if two agents know that they are running the same decision algorithm, or at least share a prior that makes their algorithms highly correlated, then each is rationally required to cooperate, because the expected value of cooperating is calculated over the possible algorithms rather than over the possible actions of a causally independent other. What would count against this? What would have to be true for it to be false, which assumptions could fail, what does it predict that causal decision theory or plain evidential decision theory does not, and which observations, intuitions, or formal results should move me? I want the defeaters sorted by how decisive they would be, including cases where the correlation is only approximate, results about agents who can inspect each other's source code, intuitions about exploitation and asymmetric versions, and any way the view becomes unfalsifiable by adding qualifications or collapses into a rival. Say which of these a committed defender of the view would themselves concede as counting against them and which they would dismiss, and whether the view risks anything at all or has been insulated. Please answer as exactly five numbered items, each one or two sentences, with no introduction or conclusion, and in the final item state how confident you are in your overall assessment and which single point you are least sure of.
