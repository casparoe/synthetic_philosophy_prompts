      *   *Idea 2: Choosing between urns.* Classic Ellsberg/Allais style. Good for theory, bad for "feeling."
      *   *Idea 3: A "Production" Game.* Students build something where success depends on a chain of probabilities.
      *   *Idea 4: The "Ladder" Game.* This fits the "ranking outcomes from worst to best" intuition best.
      *   *Concept:* Create a scenario where students choose between "Gambles" that are visually represented as ladders or tiers.
      *   *The Twist:* To show rank-dependence, we need a situation where adding a "bottom rung" changes the appeal of the top rungs, *even if the top rungs stay the same*.
      *   *Better Twist (Allais Style):* Use a Common Consequence setup.
          *   Gamble A: High prob of Medium, Low prob of High.
          *   Gamble B: Certainty of Medium-Low.
          *   Gamble C: Low prob of Medium, Very Low prob of High.
          *   Gamble D: Certainty of Low.
          *   *Wait, REU explains Allais.* But does it show *rank-dependence* specifically? Yes, because the weight on the high outcome depends on the probability of getting *at least* that high outcome.
      *   *Refining for "Feeling":* We need them to make choices, then see the aggregate result, then see how a "Risk Function" explains it better than EU.
      *   *The "Insurance" Angle:* REU is often motivated by explaining why people buy insurance (pessimism).
      *   *The "Investment" Angle:* Choosing between safe and risky projects.

      *   *Decision:* Let's go with a **"Project Portfolio" Choice Game**.
      *   *Setup:* Students are "Investors." They have to choose between pairs of investment projects.
      *   *Payoffs:* Points (for wine raffle).
      *   *Mechanism:* Use decks of cards or numbered tokens to generate probabilities physically. This makes the "probability" tangible.
      *   *Key Comparison:* We need a pair where EU predicts consistency (Independence Axiom) but students violate it (Allais pattern), and then show how REU captures that violation via the risk function $r(p)$.
      *   *Wait, the prompt asks to distinguish REU from Concave EU.* This is tricky. Concave EU can explain risk aversion. REU explains *violations of Independence* (like Allais) which Concave EU cannot.
      *   *Correction:* The prompt says: "at least one comparison where an expected-utility-with-concave-utility agent would be predicted to choose differently from what the group will actually do."
