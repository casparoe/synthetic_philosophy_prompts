      *   *Specific REU feature:* The risk function $r(p)$. If $r(p) = p^2$, small probabilities get crushed.
      *   *Activity Design:*
          1.  **Phase 1: The Choice.** Present 4 gambles (Allais Paradox setup).
          2.  **Phase 2: The Realization.** Actually play out one chosen gamble to make it real.
          3.  **Phase 3: The Calibration.** Ask them to price a specific gamble to reveal their implicit $r(p)$.

      *   *Wait, I need to make them feel the "Ranking" aspect.*
