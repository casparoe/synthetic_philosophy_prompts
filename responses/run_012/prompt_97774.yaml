answer: |-
  Here is a complete plan for your 90-minute seminar session. It is designed to be run "cold" (no theory up front) and uses the classic **Allais Paradox** setup, modified with physical props to make the probabilities tangible. This setup reliably generates the preference reversal that Expected Utility (EU) cannot explain but Risk-Weighted Expected Utility (REU) can.

  ### Session Title: The Ladder Lottery
  **Goal:** Demonstrate that people weight probabilities differently depending on where those probabilities sit in the ranking of outcomes (rank-dependence), violating the Independence Axiom of standard Expected Utility.

  ### Materials
  *   **4 Opaque Bags/Boxes** (labelled A, B, C, D).
  *   **Coloured Tokens/Beads** (or folded paper slips):
      *   **Gold:** High Payoff (500 points)
      *   **Silver:** Medium Payoff (100 points)
      *   **Red:** Zero Payoff (0 points)
  *   **Choice Sheets:** 12 small slips of paper for students to record choices.
  *   **Whiteboard & Markers.**
  *   **Payoff:** Chocolate bars or candy. (e.g., 100 points = 1 chocolate bar). *Note: Candy is better than a raffle for this specific activity because it minimizes "gambling for the jackpot" effects and keeps utility roughly linear over the small range.*

  ### Payoff Structure (The Allais Setup)
  We use points redeemable for candy.
  *   **High:** 500 points (5 bars)
  *   **Medium:** 100 points (1 bar)
  *   **Low:** 0 points

  **The Gambles (Inside the Bags):**
  *   **Bag 1 (Gamble 1A):** 100 Silver tokens. (100% chance of 100 pts).
  *   **Bag 2 (Gamble 1B):** 10 Gold, 89 Silver, 1 Red. (10% 500, 89% 100, 1% 0).
  *   **Bag 3 (Gamble 2A):** 11 Silver, 89 Red. (11% 100, 89% 0).
  *   **Bag 4 (Gamble 2B):** 10 Gold, 90 Red. (10% 500, 90% 0).

  *Note: Bag 2 and Bag 4 share the same "Gold" proportion (10%). Bag 1 and Bag 3 share the "Silver" proportion logic (Common Consequence).*

  ### Timeline (90 Minutes)

  #### 1. Setup & Rules (0–10 mins)
  *   **Do not mention:** Utility, risk aversion, probability weighting, or REU.
  *   **Script:** "Today we are running a market simulation. You are investors. You have two rounds of investment decisions. In each round, you will choose between two portfolios (Bag 1 vs Bag 2, then Bag 3 vs Bag 4).
  *   **Incentive:** "At the end of class, one round will be selected at random. For that round, you will draw a token from the bag *you chose*. The token determines your points. 100 points = 1 chocolate bar. You keep whatever you win."
  *   **Action:** Hand out Choice Sheets. Students privately circle **A** or **B** for Round 1, and **A** or **B** for Round 2. Collect sheets.

  #### 2. The Realization (10–25 mins)
  *   **Why:** To make the risk *felt*, not just theoretical.
  *   **Action:** Ask for a volunteer to act as the "Dealer."
  *   **Selection:** Randomly select Round 1 or Round 2 to be the "Payout Round" (flip a coin).
  *   **Draw:** Every student comes to the front and draws one token from the bag corresponding to their choice in the Payout Round.
  *   **Payoff:** Hand out candy immediately based on tokens.
  *   **Observation:** Watch their reactions. Did the person who chose "Risky" in Round 1 and pulled a Red token look regretful? Did the "Safe" chooser look smug? This emotional reaction is data.

  #### 3. Data Aggregation (25–35 mins)
  *   **Action:** Tally the choices on the whiteboard anonymously.
  *   **Table:**
      | | Chose Safe (A) | Chose Risky (B) |
      | :--- | :---: | :---: |
      | **Round 1** (Sure Thing vs. Risk) | [Count] | [Count] |
      | **Round 2** (Small Chance vs. Smaller Chance) | [Count] | [Count] |
  *   **Expected Result:** In a typical group, you will see a majority choose **1A (Safe)** and **2B (Risky)**. This is the Allais Violation.
  *   **If you don't get the violation:** (i.e., they choose 1A and 2A, or 1B and 2B). *See "Troubleshooting" below.* Assume for the debrief that we *did* get the violation (1A & 2B) as that is the teaching goal, but acknowledge the actual data.

  #### 4. The Debrief (35–90 mins)
  This is the core. You are now mapping their intuition to the math.

  **Phase 1: The EU Failure (35–50 mins)**
  *   **Question:** "How many chose Safe in Round 1 and Risky in Round 2?" (Show of hands).
  *   **The EU Check:** Write the Expected Value (EV) on the board.
      *   1A EV: 100.
      *   1B EV: $0.1(500) + 0.89(100) = 139$.
      *   2A EV: $0.11(100) = 11$.
      *   2B EV: $0.1(500) = 50$.
  *   **Point:** "In terms of raw value, Risky is better in *both* cases. If you chose Safe in Round 1, you weren't maximizing value. You were being risk-averse."
  *   **The Concave Utility Trap:** "Okay, maybe you have diminishing marginal utility for chocolate. Let $u(x)$ be your satisfaction. Expected Utility theory says if you prefer 1A over 1B, you *must* prefer 2A over 2B."
  *   **Write the Inequality:**
      *   Preference 1A > 1B implies: $u(100) > 0.1u(500) + 0.89u(100) + 0.01u(0)$.
      *   Simplify: $0.11u(100) > 0.1u(500)$.
      *   Preference 2B > 2A implies: $0.1u(500) > 0.11u(100)$.
      *   **Contradiction:** "These two lines contradict each other. No matter how much you love your first chocolate bar (concave utility), standard theory says you cannot logically choose 1A and 2B. You violated the **Independence Axiom**."

  **Phase 2: Introducing REU (50–70 mins)**
  *   **The Hook:** "What if the problem isn't your utility for chocolate, but how you weight the *chance* of getting it? Specifically, where that chance sits in the ranking."
  *   **Visualizing Rank:** Draw two vertical bars on the whiteboard representing Cumulative Probability (0 to 100%).
      *   **Bar 1 (Gamble 1B):** Bottom 1% is Red (0). Middle 89% is Silver (100). Top 10% is Gold (500).
      *   **Bar 2 (Gamble 2B):** Bottom 90% is Red (0). Top 10% is Gold (500).
  *   **The REU Formula:** Introduce the risk function $r(p)$.
      *   $REU = u(x_1) + [r(P \ge x_2) - r(P \ge x_1)] \cdot (u(x_2) - u(x_1)) + \dots$
      *   Simplified: You weight the *step up* to a better outcome by the *change in risk-weighted probability* of achieving at least that outcome.
  *   **The "Pessimism" Function:** Assume $r(p) = p^2$ (convex, sits below the diagonal).
      *   **In Gamble 1B:** The "Middle Step" (getting the 100pts instead of 0) covers the probability range from 0.01 to 0.99.
          *   Weight = $r(0.99) - r(0.01) \approx 0.98 - 0.00 = 0.98$.
          *   *Intuition:* Because the function is convex, this huge middle chunk retains a lot of weight. The "Safety" feels very heavy.
      *   **In Gamble 2B:** The "Top Step" (getting 500 instead of 0) covers the range 0.90 to 1.0.
          *   Weight = $r(1.0) - r(0.90) = 1 - 0.81 = 0.19$.
      *   **Compare to Gamble 1B's Top Step:** Range 0.99 to 1.0.
          *   Weight = $r(1.0) - r(0.99) = 1 - 0.98 = 0.02$.
  *   **The "Feel":** "In Round 1, the 10% chance of Gold felt tiny (weight 0.02) because it was perched on top of a massive 89% safety net that you didn't want to lose. In Round 2, the 10% chance of Gold felt bigger (weight 0.19) because there was no safety net to lose. The *same* 10% probability got weighted differently because its **rank** changed."

  **Phase 3: Limitations & Honesty (70–90 mins)**
  *   **Rationality:** "Does this make you rational? Savage (1954) says violating Independence is irrational. Buchak (2013) says Independence is too demanding. This activity doesn't settle that. It only shows REU *fits* your choices better than EU."
  *   **Indistinguishability:** "Could this just be Prospect Theory? Yes. PT uses decision weights $\pi(p)$ that look a lot like $r(p)$. Could it be Disappointment Aversion? Yes. This activity cannot distinguish between these models; they all predict the same Allais violation. REU is just the one that formalizes the 'rank' intuition most cleanly."
  *   **Concave Utility:** "Could this just be extreme risk aversion? No, because of the contradiction we proved in Phase 1. Concave utility cannot explain the switch."

  ---

  ### Troubleshooting: What Will Go Wrong

  **1. The Group Doesn't Violate Independence**
  *   **Prediction:** With only 12 students, you might get a split that doesn't show the clear 1A/2B pattern. Some might choose 1B/2B (EV maximizers).
  *   **Handle:** "In a larger sample, the majority violates Independence. Even if *you* didn't, the *possibility* of this choice pattern breaks EU. Let's analyze the logic of the violator."
  *   **Backup:** Have a printed dataset from a larger study (e.g., Kahneman & Tversky) ready to show on a slide if your class turns out to be composed of strict EU maximizers.

  **2. Students Argue About the Candy (Utility Linearity)**
  *   **Prediction:** "I only wanted one chocolate bar, so the 500 points was useless to me."
  *   **Handle:** This is actually a utility argument, not a probability argument. Acknowledge it: "If $u(500) = u(100)$, then EU predicts you'd be indifferent. But for those who *did* want the extra chocolate, the logic holds."
  *   **Fix:** Emphasize that the contradiction holds for *any* monotonic utility function.

  **3. Confusion on the REU Math**
  *   **Prediction:** The cumulative probability calculation ($r(0.99) - r(0.01)$) might lose them.
  *   **Handle:** Use the **"Slice of the Bar"** analogy. Draw the probability bar (0 to 1). Slice it where the outcomes change. Show that the "thickness" of the slice changes when you apply the $r(p)$ curve. The top slice gets thinner (pessimism) but the *relative* thickness changes depending on where the slice is located.

  ---

  ### What This Activity Cannot Do (Be Honest)

  1.  **It cannot prove REU is *The Truth*:** It only shows EU is insufficient. Prospect Theory fits this data equally well. You must state this explicitly.
  2.  **It cannot prove Rationality:** REU violates the Independence Axiom. Whether that is a "bug" or a "feature" of rationality is a philosophical debate (Savage vs. Buchak), not an empirical one this game can solve.
  3.  **It cannot isolate Rank-Dependence from Loss Aversion:** Since we are using gains only, we avoid loss aversion, but students might still frame the "1% chance of 0" in Round 1 as a loss relative to the sure thing. REU treats this as a probability weight; Prospect Theory might treat it as a loss. The activity feels the same either way.

  ### Summary for the Board (Debrief Cheat Sheet)
  *   **EU:** Weights outcomes by $p$. (Linear probability).
  *   **REU:** Weights *increments* by $r(P \ge x) - r(P \ge x_{prev})$. (Non-linear probability).
  *   **The Violation:** 1A > 1B but 2B > 2A.
  *   **The Cause:** The 89% common consequence in Round 1 gets a massive weight boost in REU because it sits in the "steep" part of the risk function (near certainty). In Round 2, that consequence vanishes, changing the weights on the remaining outcomes.
  *   **The Feeling:** "Safety" is worth more when it's almost certain (Round 1) than when it's unlikely (Round 2).
