      *   **Topic:** Risk-Weighted Expected Utility (REU), specifically Buchak's framework (rank-dependent weighting).
      *   **Goal:** An in-class activity/game that makes students *feel* the mechanics of REU (specifically rank-dependence and risk functions) without an upfront lecture.
      *   **Constraints:** Cheap materials, no real money (points/prizes), 90-minute timeline.
      *   **Key Requirement:** Must demonstrate *rank-dependence* (same outcome weighted differently based on position) and distinguish REU from standard Expected Utility (EU) with concave utility (risk aversion).
      *   **Debrief:** Must map activity moments to formal theory, predict failures, and be honest about limitations (rationality, indistinguishability from other models).
      *   **Tone:** Pragmatic, academic but accessible, honest about limitations.

  2.  **Deconstruct Risk-Weighted Expected Utility (REU):**
      *   Formula: $REU = u(x_1) + \sum_{i=2}^n [r(P(X \ge x_i)) - r(P(X \ge x_{i-1}))] \cdot u(x_i)$ (roughly, or the cumulative version).
      *   Key intuition: You weight the *increment* of value gained by moving from a worse state to a better state by the *transformed probability* of achieving at least that good a state.
      *   Risk function $r(p)$: If convex ($r(p) < p$), you are risk-averse (pessimistic). If concave ($r(p) > p$), you are risk-seeking (optimistic).
      *   Crucial distinction from EU: In EU, risk aversion comes from $u(x)$ (diminishing marginal utility). In REU, risk aversion comes from $r(p)$ (distorting probabilities based on rank).
      *   The "Allais Paradox" / Common Consequence Effect is the classic way to show violation of Independence (which EU obeys but REU can explain).
      *   Rank-dependence: Adding a terrible outcome to the bottom of a gamble shouldn't change the relative weighting of the top outcomes in EU, but in REU, it shifts the cumulative probabilities, potentially changing the weight applied to the upper outcomes.

  3.  **Brainstorming the Activity:**
