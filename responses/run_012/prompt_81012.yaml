  **BenFranklin™ VirtueTracker™ Help Center**

  **Welcome to Support.** Please review common queries before submitting a ticket regarding your moral perfection subscription.

  **Q: Why does the dashboard show I am currently failing twelve virtues?**
  A: The Weekly Focus Protocol requires concentrated attention on one virtue, classifying lapses in the remaining twelve as acceptable collateral damage during that period.

  **Q: My Order metric has remained at zero for six years. Is this a bug?**
  A: No, Order is highly sensitive to external variables such as misplaced tools, irregular hours, and inadequate filing habits.

  **Q: Why did my Humility score decrease immediately after I viewed my progress report?**
  A: The act of reviewing your own moral standing is statistically correlated with pride, triggering an automatic deduction per community guidelines.

  **Q: Does a single black mark reset my annual streak?**
  A: No, the streak tracks consecutive weeks of logging data, not consecutive weeks of unblemished performance.

  **Q: Can I claim certification if I still have black marks after four cycles?**
  A: Yes, completion is defined by being better than you were, not by achieving a flawless record.

  **Q: Why was Humility not included in my initial onboarding?**
  A: Humility was added in a later update following peer feedback indicating early users appeared overly proud of their progress.

  **Q: How do I fix my filing system to improve Order?**
  A: We recommend allocating specific times for organization, though most users find this conflicts with their Industry metrics.

  **Q: My friend says I sound proud when I discuss my virtues. What should I do?**
  A: Please express a wish that you may possess humility, even if you currently lack it.

  **Q: Is there a refund policy if I never achieve perfection?**
  A: Moral perfection is a perpetual service, and refunds are not issued for incomplete spiritual development.

  **Q: Why must I carry the digital book everywhere?**
  A: Portability ensures faults are recorded immediately, preventing memory lapses from excusing negligence.

  **Q: Can I pause my subscription during travel?**
  A: Tracking should continue regardless of location, as virtue is not confined to a specific geography.

  **Q: Why is the interface black and white?**
  A: Color distracts from the stark reality of your faults.
