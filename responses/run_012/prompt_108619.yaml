answer: |-
  In evaluating the leveling-down objection, the distinction between absolute and relative prioritarianism turns on whether the moral weight of a benefit is intrinsic to the recipient's condition or extrinsic to their social standing. Absolute prioritarianism (AP) holds that weight depends only on absolute well-being. Relative prioritarianism (RP) holds that weight depends at least partly on comparative standing. The leveling-down objection challenges views that imply it can be good to make some worse off without making anyone better off, simply to achieve equality. The injected notions of strong and weak leveling-down-proofness provide the metric for this comparison.

  First, we must determine the leveling-down-proof status of each view. Absolute prioritarianism is strongly leveling-down-proof. By definition, AP assigns moral weight solely based on absolute levels of well-being. In a leveling-down scenario, some better-off people are made worse off, and no one is made better off. Since absolute well-being decreases for some and increases for none, the total priority-weighted value must decrease. AP never ranks the leveled-down outcome as better. Consequently, it is also weakly leveling-down-proof, as it never ranks the outcome as better merely because inequality is reduced; it ranks it as worse because absolute well-being is reduced. Relative prioritarianism, however, can fail even weak leveling-down-proofness. Because RP assigns weight partly based on comparison, a reduction in inequality generates some positive moral value. If the value assigned to the reduction in inequality outweighs the negative value of the absolute loss suffered by the better-off, RP will rank the leveled-down outcome as better than the status quo. In such a case, the outcome is ranked as better *merely because* inequality has been reduced, violating the condition for weak leveling-down-proofness.

  Second, consider the two-person case where A is at 100 and B is at 50. Policy L lowers A to 60 (B stays 50). Policy U raises B to 90 (A stays 100). Policy L* lowers A to 60 (B stays 50), explicitly noting the change in B's relative position.
  Absolute prioritarianism ranks these policies strictly by the sum of transformed absolute well-being. Policy U increases total absolute well-being and benefits the worse-off person; AP ranks U highest. Policy L and Policy L* result in the identical distribution (60, 50). Since AP ignores relative position, it treats L and L* identically. Both involve a net loss of absolute well-being compared to the baseline (100, 50). Thus, AP ranks U > Baseline > L = L*.
  Relative prioritarianism ranks policies based on absolute well-being plus a component for relative standing. Policy U increases absolute well-being and reduces inequality (gap shrinks from 50 to 10); RP ranks U highest. Policy L and L* also result in (60, 50), reducing the inequality gap from 50 to 10. For RP, the outcome of L and L* contains a positive element (equality gain) and a negative element (absolute loss). Depending on the weighting function, RP might rank Baseline > L = L* (if absolute loss dominates) or L = L* > Baseline (if equality gain dominates). However, regarding the ranking of L versus L*, since both are consequentialist views evaluating outcomes, RP must rank L and L* equally, as the resulting distribution is identical. The distinction in the description of L* highlights the source of value for RP (the relative shift), whereas for AP, that description is morally inert.

  Third, we must consider whether RP can avoid collapsing into egalitarianism and whether AP can accommodate inequality intuitions. Relative prioritarianism risks collapsing into egalitarianism if the comparative component of the weight function becomes dominant. If the view implies that reducing inequality is valuable even when it conflicts significantly with absolute well-being, it ceases to be a view about *prioritizing* benefits to the worse off and becomes a view about *equalizing* outcomes. To avoid this, RP must maintain that absolute well-being is the primary currency of value, with relative standing acting only as a modifier. However, this balancing act is precarious. Conversely, absolute prioritarianism cannot accommodate the intuition that inequality itself matters without turning into relative prioritarianism. The definition of AP restricts moral weight to absolute levels. To claim that inequality is intrinsically bad would require introducing a comparative variable into the value function, which by definition transforms the view into RP. AP can only account for the badness of inequality instrumentally (e.g., via diminishing marginal value), not intrinsically.

  Fourth, which version better explains why leveling down strikes many people as objectionable? The core intuition behind the leveling-down objection is that harming someone without benefiting anyone is inherently wrong, regardless of distributional patterns. Absolute prioritarianism explains this perfectly: leveling down reduces the sum of priority-weighted well-being. There is no countervailing value generated by the act. Relative prioritarianism offers a weaker explanation. For RP, leveling down generates some positive value (increased equality). To explain why leveling down is objectionable, RP must argue that the absolute losses outweigh the equality gains. This makes the objectionability contingent on magnitudes rather than principle. It suggests that leveling down is not inherently objectionable, but only objectionable when the absolute losses are sufficiently large. This fails to capture the categorical nature of the intuition that destroying value for the sake of equality is absurd.

  For someone who takes the leveling-down objection seriously, absolute prioritarianism is the more defensible version. The leveling-down objection is fundamentally a demand that a theory of justice should not value equality over people's actual well-being. Absolute prioritarianism meets this demand by grounding value exclusively in well-being. Relative prioritarianism concedes ground to egalitarianism by admitting that relative standing has intrinsic moral weight, thereby leaving itself vulnerable to the charge that it values patterns over people. While RP attempts to hybridize the views, it inherits the vulnerability of egalitarianism to the leveling-down objection without gaining the conceptual purity of AP.

  Verdict: Absolute prioritarianism is the more defensible position for someone who takes the leveling-down objection seriously because it remains strongly leveling-down-proof by grounding moral value exclusively in absolute well-being rather than comparative standing.
