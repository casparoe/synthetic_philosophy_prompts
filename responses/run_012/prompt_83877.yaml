answer: |-
  In a mid-sized university department, the manual negotiation of lecture timetables by heads of department was replaced five years ago by a centralised automated software system, a reform now sufficiently entrenched that all current staff have planned their research and childcare around its fixed output cycles. A recent audit reveals that the old manual arrangement was objectively superior on a straightforward cost–benefit analysis: it incurred no licensing fees and produced fewer pedagogical clashes because human negotiators accommodated module overlaps that the algorithm treats as hard errors. Nevertheless, the fence argument favours retaining the software: the current system is the established arrangement whose consequences are observed and understood, whereas restoring the manual process constitutes a proposal to change the status quo, carrying a burden of proof regarding transition risks and unforeseen disruptions that mere historical data on the old system cannot discharge.

  **The Check**

  The fence argument concludes that the software reform must be kept, premised on the claim that the burden of proof lies with those proposing change to a settled, observed routine. The cost–benefit calculation concludes that the manual arrangement should be restored, premised on the quantifiable superiority of the old system regarding cost and pedagogical flexibility. The single feature that makes the fence argument switch sides is the temporal reclassification of the reform as the 'established arrangement'. If this feature is removed—meaning the reform is treated as a novelty rather than a settled practice—the fence argument reverts to protecting the original manual system, causing both verdicts to align in favour of the old arrangement. This demonstrates that the fence argument is empty of specific conservative content regarding tradition or ancestry; it is merely a procedural presumption in favour of whatever happens to be established. The strongest reply open to a Burkean is that true prescription requires intergenerational continuity to distil latent wisdom, and a five-year reform lacks the authority of inherited practice, presupposing knowledge we no longer possess only when tested by time. The case survives this reply only if the fence argument is interpreted as a general heuristic against the risk of change rather than a specific defence of traditional order; if the latter, the case fails, proving the argument cannot be detached from its traditionalist roots.
