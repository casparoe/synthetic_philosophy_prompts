      *   *Alternative Hypothesis 2 (Reliabilism):* Requirement iff future self is more reliable. (Fits Slide-rule, X-ray, Slip. Fits Morning-after, Concussion. What about Lunch/Induction? She knows the colleague has same evidence, so colleague isn't more reliable. Induction leader? She regards it as special insight but the prompt implies she views the *mechanism* as suspect ("convinced its leader has special insight" vs "weekend with a group will leave her convinced"). Actually, in Induction, she knows the mechanism is group dynamics, not truth-tracking.)
