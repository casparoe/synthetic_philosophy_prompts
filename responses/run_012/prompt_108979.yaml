  ### 2. The Rule She Is Running

  Nadia is not following Van Fraassen's standard Reflection Principle, which suggests you should generally defer to your future self unless you expect them to be irrational. She is running a stricter constraint: **The Rational Etiology Constraint.**

  **The Rule:** *Defer to your expected future credence if and only if you expect the change in credence to be caused by the exercise of improved rational faculties (calculation, error correction) or the acquisition of new evidence. Do not defer if the change is caused by distortion, impairment, pressure, or arbitrary drift.*

