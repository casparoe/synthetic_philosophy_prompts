answer: |-
  Tort law reveals that "structural harm" claims often lack rigorous proximate cause, relying instead on policy-driven liability expansions like market-share liability. The residue isn't philosophical vagueness but tort's inability to adjudicate diffuse, systemic causation without legislative indemnification. When philosophy speaks of "harm" without but-for causation, it is secretly arguing for a statutory-like expansion of liability similar to *Sindell*, not describing a traditional tortious wrong.

  **Translation**
  1.  **Pogge (Structural Harm):** Negative duty not to harm. *Breach:* Imposing coercive global order (WTO/TRIPS) that foreseeably impoverishes. *Causation:* Substantial factor test for indivisible injury (systemic poverty). *Parties:* Rich states as joint tortfeasors in a joint enterprise. *Remedy:* Cessation + restitution.
  2.  **Singer (Failure to Rescue):** Affirmative duty to rescue. *Breach:* Omission despite low cost/high benefit. *Causation:* But-for failure to transfer surplus prevented survival. *Plaintiff:* Indeterminate class of starving persons.
  3.  **Statist (No Duty):** No duty of care owed to non-citizens. *Defense:* Political question doctrine; morality not justiciable. *Scope:* Duty terminates at border.

  **Residue Report**
  **Pogge:** *Clean:* Joint enterprise liability. *Bent:* Proximate cause (chain too attenuated for common law; I am fudging foreseeability to ignore intervening local corruption). *No Counterpart:* "Coercive order" as a discrete tortious act (tort requires specific acts, not background conditions).
  **Singer:** *Clean:* Omission liability. *Bent:* Duty scope (unlimited liability risk; fudging the "special relationship" requirement). *No Counterpart:* "Global needy" as identifiable plaintiffs (indeterminate class triggers floodgates defense).
  **Statist:** *Clean:* No duty to stranger. *Bent:* Moral vs. legal duty distinction (tort assumes legal enforceability, philosophy debates moral bindingness).

  **Specific Analysis**
  **1. Harm vs. Causation:** The "harm" framing is indeed a causation claim in disguise. Once you strip the rhetoric, Pogge argues that the global order is a *substantial factor* in poverty, even if but-for causation is unprovable for specific individuals. What's left is a risk-contribution theory. The residue is the lack of a specific tortious act; the "harm" is the background condition, not a specific incident. Tort handles this via *Sindell*, but only where defendants created the risk. Philosophy often masks the need for this doctrinal shift by calling it "harm" rather than "causal contribution."

  **2. Apportionment:** Market-share liability is the robust model here. If global poverty is an indivisible injury caused by the global economic system, GDP share proxies for causal contribution. Tort runs out on *enforcement* (no global sheriff), not liability theory. *Sindell* applies: shift burden of proof on causation to defendants (rich states) when plaintiffs cannot trace specific harm due to defendants' collective conduct. I defend this: It solves the "indivisible harm" problem where multiple actors contribute to a systemic risk. Just as DES manufacturers shared liability based on market presence, rich nations share liability based on economic dominance. The fit is tight; the barrier is sovereign immunity, not doctrinal incoherence. The "fudge" is treating sovereign policy choices as "market participation," but functionally, the economic dominance operates similarly. Where tort runs out is not in assigning share, but in collecting judgment against a sovereign.
