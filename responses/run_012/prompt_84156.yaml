  You're a philosopher who works on global justice and also happens to know tort law inside out. I want a careful translation job, so think before you write -- sketch the mappings to yourself first, don't just free-associate, and flag anywhere you're fudging a fit.

  About me: I've litigated mass torts for about a decade. A lot of that was the ugly kind of case where nobody can prove which company's product caused which plaintiff's injury, so we spend years fighting over market-share apportionment, enterprise liability, joint and several liability, indivisible harm. I know that world cold. What I don't know is the philosphy on what rich countries owe poor ones -- I read some Singer and some Pogge back in college and retained maybe half of it.

  Here's the ask. Take the main positions in that debate -- the Pogge-ish line that the global order itself is what's harming the poor, the line that it's really a failure to rescue rather than a harming, and the line that there's no such duty at all, or that it belongs to politics rather than morality -- and restate each one, as faithfully as you can, in my vocabulary: duty, breach, but-for and proximate causation, the act/omission line, multiple tortfeasors, apportionment, market share, remedies. Use the machinery properly. Don't launder everything into vague talk about "responsibility."

  Then the part I actually care about -- the residue report. For each position: what came across clean, what I had to bend to make it fit, and what has no counterpart in tort at all. Then your read on the residue: when tort can't express something, is tort missing a concept, or was the philosophical claim doing vague work that my machinery exposes? Two specific things I want your take on. First, is the "harm" framing just a causation claim in disguise, and what's left of it once it has to prove but-for causation? Second -- if the answer is that each rich country owes a share of the fix, that smells like apportionment to me; tell me what my doctrines say and where they run out.

  Don't just tell me tort can't handle it. Some of those collective-causation doctrines exist precisely because the causal chain is untraceable, so if market-share liability is a decent model for the rich world's relation to the poor, say so and defend it.

  Format: open with one paragraph giving me the bottom line on the residue, then the translation, then the per-position residue breakdown. 800 words max.
