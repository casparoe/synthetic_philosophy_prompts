      *   **Key Questions:** What implicit theory of mind does this practice presuppose? Is training Skinnerian and deployment Popperian? Is the scratchpad genuinely Popperian or just extended Skinnerian? Do tools make it Gregorian? What does it rule out? Where are the inconsistencies?
      *   **Constraints:**
          *   Bottom line in the first sentence.
