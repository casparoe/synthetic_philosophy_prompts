answer: |-
  Based on her track record, specifically the verdict on Case 4, here is the prediction for her verdict, the rule she is likely applying, and how to test it.

  ### The Prediction
  **She will say they can disagree.**

  ### The Rule She Is Running
  **"The Strict Epistemic Preconditions Rule"**

  Her verdicts suggest she treats Aumann's Agreement Theorem not merely as a mathematical fact about the world, but as a result in **epistemic logic** that requires all premises to be *Common Knowledge (CK)*, not just true.

  *   **Case 1 (Agree):** All premises true + All premises CK.
  *   **Case 2 (Disagree):** Premise (Same Prior) False.
  *   **Case 3 (Disagree):** Premise (Bayesianism) False.
  *   **Case 4 (Disagree):** Premise (Same Prior) True, **but not CK.**

  Case 4 is the "smoking gun." It reveals that for her, it is insufficient that the agents *actually* share a prior; they must *know* (in the common knowledge sense) that they share a prior. She views the theorem as a protocol that only activates when the epistemic conditions are fully satisfied.

  In your **New Case**, two critical epistemic conditions are missing:
  1.  **Common Knowledge of Rationality:** Even though they *are* Bayesians, they don't *know* the other is. If I think you might be irrational, I cannot treat your posterior as a reliable signal of your information, so I am not compelled to update to match you.
  2.  **Knowledge of Partitions:** AAT relies on the "meet of the partitions." If I don't know your information partition (what evidence distinguishes your states from mine), I cannot mathematically construct the common knowledge set that forces agreement.

  Because she ruled that a non-CK Prior breaks the theorem (Case 4), she will almost certainly rule that non-CK Rationality and Unknown Partitions break it too.

  ### Alternative Rules That Fit the Data
  While the "Strict Epistemic Preconditions" rule is the most likely, two other rules fit her first four verdicts equally well. Distinguishing between these is the key to understanding her model of rationality.

  **1. The "Trust Bottleneck" Rule**
  *   **Logic:** Agreement is forced only if I trust your processing. If I suspect you are irrational (New Case), I discount your posterior. The Partition knowledge is secondary; if I trust you are rational and share my prior, your posterior *is* the evidence, regardless of whether I know the specific partition.
  *   **Why it fits:** Explains Case 3 (don't trust the heuristic user) and Case 4 (if I don't know your prior, I can't trust your update).
  *   **Difference:** This rule might allow agreement if Rationality *is* CK, even if Partitions are unknown.

  **2. The "Structural Integrity" Rule**
  *   **Logic:** Agreement is forced only if the mathematical structure of the state space is shared. If I don't know your Partition (New Case), the "meet" cannot be calculated. The theorem literally has no purchase. Rationality CK is secondary; if the partitions align, the math forces convergence.
  *   **Why it fits:** Explains Case 1 (structure known) vs Case 4 (prior structure not shared/known).
  *   **Difference:** This rule might allow agreement if Partitions *are* known, even if Rationality is not CK (assuming the math forces the result regardless of trust).

  ### The Decisive Test Case
  To tell which rule she is actually running, you need to isolate **Rationality CK** from **Partition Knowledge**. Present her with this scenario:

  > **The "Black Box" Case:**
  > Two agents have the **Same Prior (CK)**. Both are **Actual Bayesians**. Their **Posteriors are CK**.
  > *   **Condition A:** Each **knows** the other is a perfect Bayesian (Rationality is CK), **BUT** neither knows the other's information partition (they treat the other as a black box that outputs valid Bayesian posteriors).
  > *   **Condition B:** Each **knows** the other's information partition perfectly, **BUT** neither knows if the other is rational (each thinks the other might be a heuristic user).

  **Ask her:** *In Condition A, must they agree? In Condition B, must they agree?*

  *   **If she says "Agree" to A and "Disagree" to B:** She is running the **Trust Bottleneck** rule. (Knowing you are rational is enough; I don't need to know your evidence because your posterior summarizes it).
  *   **If she says "Disagree" to A and "Agree" to B:** She is running the **Structural Integrity** rule. (The math of the partitions is what forces agreement; trust is irrelevant).
  *   **If she says "Disagree" to Both:** She is running the **Strict Epistemic Preconditions** rule (my primary prediction). She believes *every* assumption of the theorem must be Common Knowledge for the conclusion to hold.

  ### Summary for your argument
  Your friend is likely a **Strict Formalist** regarding AAT. She believes the theorem is a fragile logical construct that collapses if *any* assumption (Prior, Rationality, Partitions) fails to be Common Knowledge. She will reject the New Case because the agents lack the epistemic transparency required to run the "agreement algorithm." To challenge her, you don't argue the math; you argue whether "Common Knowledge of Rationality" is a realistic or necessary requirement for real-world rationality.
