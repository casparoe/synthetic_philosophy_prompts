answer: |-
  You have identified a real and distinct mechanism of social change. Your hunch is correct: the engine is not the moral argument itself, nor the material utility of the act, but the **reputational payoff structure** surrounding the act.

  There is no single word in the literature that captures this exact configuration without carrying baggage you might not want. The closest established concepts are **Preference Falsification** (Timur Kuran) and **Pluralistic Ignorance** (Daniel Katz/Floyd Allport), often resulting in a **Norm Cascade** (Cass Sunstein). However, these terms are often applied to political regimes or information spread, not specifically to the *honor/shame* dynamics of social habits like duelling or foot binding.

  Since you asked for the carving rather than a vague label, and given your background in systems (chemistry), I will offer a synthesized definition and a coined term that fits the precision you require.

  ### The Carving: Reputational Phase Transition

  I propose calling this a **Reputational Phase Transition**.

  **Definition:** A non-linear collapse of a social practice caused not by a change in the practice's material utility or the moral arguments against it, but by a sudden reversal in the **social sanctions** attached to it. The practice persists while it signals *virtue/status* (or adherence to group identity) and collapses when it signals *vice/stigma*.

  **The Mechanism:**
  1.  **Latency (The Plateau):** The practice is sustained by **Pluralistic Ignorance**. Most participants privately dislike the practice (or are indifferent) but continue it because they believe *others* value it. The moral arguments exist but are socially costly to voice.
  2.  **The Trigger:** A critical mass of "early adopters" (reformers, elites, or external shocks) begin to publicly violate the norm without suffering the expected social death.
  3.  **The Flip:** The reputational payoff inverts. Previously, *doing* the act earned standing; now, *stopping* the act earns standing.
  4.  **The Cascade:** Because the payoff is social (relative to others), not material (absolute), the change is rapid. Once the signal flips, everyone rushes to update their behavior to avoid the new stigma.

  ---

  ### Boundary Conditions: How to tell it apart

  You asked specifically how to distinguish this from material shifts or moral lag. Here are the edges of the carving.

  #### 1. Versus Material Interest Shifts
  *   **The Distinction:** Material changes are **linear and individual**; Reputational Phase Transitions are **non-linear and relational**.
  *   **The Test:** If the practice becomes expensive or physically impossible, it is a material shift. If the practice remains physically possible and economically viable, but *nobody wants to be seen doing it*, it is a Reputational Phase Transition.
  *   **Boundary Case (Foot Binding):** You noted factories wanted women who could walk. That is a material pressure. However, foot binding persisted in some areas *after* it was economically disadvantageous because the *marriage market* (a reputational market) still valued it. The collapse happened when the *mothers* decided unbound feet were more marriageable than bound ones. That is the reputational flip. The factory jobs lowered the threshold for the flip, but did not cause the flip directly.
  *   **What it excludes:** Gradual obsolescence. If a technology just gets replaced by a better one (horse vs. car), that is material. If people stop using silverware because it becomes "bourgeois" while still being functional, that is reputational.

  #### 2. Versus Moral Argument Lag
  *   **The Distinction:** In a moral lag, the arguments are slowly convincing people one by one (a slow S-curve of belief). In a Reputational Phase Transition, private belief changes *after* public behavior changes.
  *   **The Test:** Look at the timing of the arguments. In your examples, the arguments against duelling existed for a century *before* the collapse. If moral persuasion were the driver, the decline would have tracked with the publication of tracts. It did not. It tracked with the moment it became socially safe to *cite* those tracts.
  *   **What it excludes:** Genuine moral conversion. If a religious group stops a practice because they truly believe God forbids it, regardless of social cost, that is moral conviction. If they stop because their neighbors will shun them if they continue, that is a Reputational Phase Transition. (Often, the former follows the latter to justify the change).

  #### 3. Versus Legal Prohibition
  *   **The Distinction:** Law often follows the reputational flip; it rarely causes it in these specific cases.
  *   **The Test:** Duelling was illegal for most of the time it was popular. Drunk driving was illegal in the 70s. The law existed but was unenforced because juries/police shared the old reputational view (it's a private matter/accident). Enforcement only became possible *after* the reputational flip made juries willing to convict.
  *   **What it excludes:** Top-down suppression. If a dictator bans something and shoots people for doing it, and they stop out of fear of the state, that is coercion. If they stop out of fear of their *peers*, that is a Reputational Phase Transition.

  ---

  ### Addressing Your Specific Questions

  **1. Is there something that makes the flip sudden?**
  Yes. This is a **threshold model of collective behavior** (Mark Granovetter).
  Social behavior is often an equilibrium. As long as I believe *you* value duelling, I must value it to maintain my standing with you. You believe the same about me. We are locked in a stable equilibrium.
  The flip is sudden because reputational value is **relative**. Once the number of people who *publicly* disdain the practice crosses a specific threshold (often around 25-30% of the network), the cost of maintaining the old norm spikes exponentially. It is not that everyone changed their mind at once; it is that the *cost of hiding* their true mind dropped below the *cost of conforming*. To a chemist: it is a precipitate crashing out of solution once saturation is breached.

  **2. Can it be steered on purpose?**
  Yes, but not by making better arguments. It is steered by **Norm Entrepreneurs** (a term from international relations theory, Finnemore & Sikkink).
  To steer this, you do not target the masses; you target the **reference group**.
  *   **Duelling:** It didn't end when priests condemned it. It ended when senior military officers and judges stopped accepting challenges and publicly shamed the challengers. The "standing" source was cut off.
  *   **Drunk Driving:** MADD (Mothers Against Drunk Driving) succeeded not by proving alcohol impairs driving (known since the 1930s), but by re-categorizing the drunk driver from "unlucky guy" to "potential murderer." They changed the *label*, which changed the *stigma*.
  *   **Steering Limit:** You cannot steer this if the material incentives are too strong. If foot binding was the *only* way to marry, reputational shaming wouldn't have worked until an alternative path (factory work/school) existed. You need a **material floor** to support the **reputational ceiling**.

  ### The Near-Misses (And Why They Fail)

  1.  **Preference Falsification (Timur Kuran):**
      *   *What it gets right:* Explains why people publicly support what they privately hate, and why regimes/norms collapse suddenly.
      *   *Where it fails:* It focuses on *political* truth and hidden preferences. Your phenomenon includes cases where the preference isn't "hidden hatred" but "indifference sustained by honor." A duellist might not have hated duelling; he just didn't want to be a coward. The driver is *honor*, not necessarily *truth*.

  2.  **Signaling Theory:**
      *   *What it gets right:* Explains why the practice existed (foot binding signaled wealth; duelling signaled courage).
      *   *Where it fails:* It explains stability well, but struggles to explain the *speed* of the collapse. Signaling usually degrades gradually as the signal becomes cheap. Your examples show a cliff-edge.

  3.  **Tipping Point (Malcolm Gladwell / Schelling):**
      *   *What it gets right:* The suddenness.
      *   *Where it fails:* It describes the *shape* of the change, not the *fuel*. A virus tips, a fashion tips, a riot tips. Your phenomenon is specifically about *moralized reputation*.

  ### Summary for Your Dinner Table

  You are looking at **Reputational Phase Transitions**.

  *   **The Fuel:** Social standing (Honor/Shame).
  *   **The Mechanism:** Pluralistic Ignorance (everyone thinks everyone else likes it).
  *   **The Shape:** Non-linear collapse (Tipping Point).
  *   **The Distinction:** It is not that the *arguments* won; it is that the *social cost of ignoring the arguments* finally exceeded the *social cost of adopting them*.

  The practice dies not when it is proven wrong, but when it becomes **socially expensive**.
