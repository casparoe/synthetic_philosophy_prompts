prompt: |-
  I'm an undergraduate taking a module on the epistemology of testimony, and I'm trying to work out what I actually think about when we're entitled to believe what people tell us. I'd like you to act as a professional philosopher working on epistemology and help me do reflective equilibrium properly: begin by brainstorming the main positions in the reductionist/anti-reductionist debate, then test my verdicts against them, and finish with a precise principle, or a small set of candidate principles. Please think carefully and reason about the cases rather than simply reporting what the literature says.

  Here are my verdicts. A passer-by tells me the post office closes at five: I believe them at once. A stranger online tells me the election was rigged: I don't, though I know nothing about their reliability. My flatmate, whom I've caught exaggerating before, tells me she's just back from Portugal: I believe her. The same flatmate tells me a restaurant is worth the money: I check the reviews. A doctor tells me my ankle isn't broken: I believe her. The same doctor tells me her hospital is the best in the region: I don't. I believe a well-referenced encyclopaedia entry on the Battle of Hastings but not an anonymous blog post making the same claim, though I've verified neither author. And I believe the bus timetable at the stop — which I know is years out of date and frequently wrong — more readily than a passer-by who tells me the bus is running late.

  My tentative principle is that I'm entitled to believe an assertion unless I have some specific reason not to: trust is the default, and defeaters do the work. But that seems to leave the encyclopaedia-versus-blog verdict and the timetable verdict unexplained — one turns on the source being structurally unlikely to be wrong, the other ignores reliability altogether. Can a single principle capture all of these? If so, state it precisely, say which clause each verdict motivates, and tell me what it predicts for two cases I haven't mentioned: believing a stranger's report of what a smell reminds them of, and believing a stranger about which way the parade goes. If no single principle works, say which verdict I should abandon and why. Be explicit about which of my verdicts your favoured principle cannot accommodate.
