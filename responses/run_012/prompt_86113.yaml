  Dear Policyholder,

  Re: Claim 774-B (Terracotta Figure).

  1. The policy insures "The Statue." The object destroyed was "The Clay." These are not identical. The clay resided in the artist's studio for forty years prior to sculpting; the statue existed for only two. One object cannot possess contradictory age properties. By Leibniz's Law, if x and y have different properties, x is not y. Therefore, the insured object was not the destroyed object. You insured a two-year-old entity; a forty-year-old lump was crushed. We cannot pay for a mismatched identity.

  2. Thermal processing alters material chemistry. The clay minerals underwent irreversible dehydroxylation during firing. The original clay did not survive this process; the statue did. Thus, the statue is not the clay. You claim the statue was crushed. The clay merely rearranged. The chemical identity of the pre-fired clay is extinct. The statue survived the firing; the clay did not. They have different survival conditions.

  3. Strictly, there are no statues, only particles arranged statuewise. Particles cannot be destroyed, merely rearranged. Since the particles remain intact in the crate, no loss of matter occurred. Insurance indemnifies loss, not rearrangement. To pay would be to indemnify a conceptual error. We do not insure concepts. The particles are safe; your loss is linguistic.

  4. If we concede two objects occupy one space, sharing every part and property, what distinguishes them? If distinct, does the policy cover the lump minus a single grain? Or the lump plus the speck of dust resting on it? We cannot adjudicate ontological vagueness. Where does the insured object end and the uninsured atmosphere begin? If count is two, pricing becomes impossible. We cannot price indeterminacy.

  5. Consequently, the insured entity either never existed, survives as particles, or is indistinguishable from uninsured matter. Claim denied.

  ***

  Dear Claims Department,

  Your refusal relies on categories that collapse under scrutiny. When the crate fell, the figure was destroyed. The clay was not; it was merely squashed into a ball. One accident yielded two verdicts: existence terminated for the art, continued for the stuff. If they were one thing, how do they suffer different fates? You cannot have it both ways. The statue is gone; the clay remains. This proves they are distinct.

  You argue particles are all that exist. Yet your company has collected premiums on "statues" for a century. You cannot accept money for entities you now claim are fictitious. If there are no statues, you have been fraudulently insuring air. If there are statues, you owe me. This metaphysical convenience cannot be unilateral. You cannot be eliminativists when collecting revenue and realists when paying claims. It is institutional bad faith.

  Regarding distinction: They share parts, but not modal properties. The clay could survive squashing; the statue could not. That is the difference. It is not a wave at intention, but a fact about persistence conditions. The statue has essential properties the clay lacks. The clay is essentially clay; the statue is essentially figurative. Modal profiles distinguish coincident objects.

  As for vagueness: Dust is not part of the work. A grain missing does not destroy the lump. Practical boundaries exist even if metaphysical ones blur. Do not hide behind the Sorites paradox to avoid liability. You defined the insured object in the schedule. Common sense governs contracts, not mereology.

  The figure is gone. The policy covers the figure. Pay the claim.

  ***

  **Note:** The insurer conflates the Constitution View (statue constituted by, not identical to, clay) with Mereological Nihilism (only particles exist) to suit different clauses. The owner defends a standard Constitution View, relying on modal divergence (different persistence conditions) to distinguish coincident objects. The firing argument assumes clay "ceases to exist" chemically, which is contentious; usually, it is considered a phase change. The "particles" argument is nihilism, which rarely coexists with corporate liability.
