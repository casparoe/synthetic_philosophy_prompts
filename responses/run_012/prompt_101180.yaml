          *   *Decision:* I need to be honest. The Insurance view is technically the "Instrumental" view, which political scientists largely debunked as the sole explanation (Downsian Paradox). The Duty view is the only one that logically compels action without relying on magical thinking about individual impact. However, the Insurance view is a valid *heuristic*.
          *   *Refinement:* I should argue that the Insurance view is a *Consequentialist* variation of the Instrumental view, distinct from Expressive and Duty. But it suffers from the same mathematical problem the Staffer points out. The Duty view is the only one that survives the "single vote doesn't matter" critique.

