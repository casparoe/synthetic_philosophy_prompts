  8.  (Mental Outline of the "Insurance" verdict): The Insurance model is the "Expected Utility" argument. It is the classic rational choice theory approach (Anthony Downs). The Staffer is reacting *against* this because the math doesn't work ($P \times B < C$). The User is trying to fix the math by emphasizing risk aversion (Catastrophe). It is distinct from Expressive (outcome vs. signal) and Duty (prudence vs. obligation). However, it is mathematically fragile. I will classify it as a *Consequentialist Instrumental* view.

