answer: |-
  This is a fantastic pivot for a final essay. Your seminar leader is pushing a standard analytic method (reflective equilibrium), but you're right: if you only test theories against "lunch no-shows," you never find out where the bones are buried. The cases you've selected are essentially "stress tests" that strip away the psychological and social scaffolding most theories rely on.

  Here is the ranking of the four accounts based on their resilience against your specific pressure cases, from most robust to least, followed by the answer to your hunch.

  ### The Ranking (Best to Worst)

  **1. The Authority/Standing Account (Owens/Shiffrin)**
  *   **Reason:** It locates the obligation in a normative transfer of control that persists independently of the promisee's psychological state or social visibility.
  *   **Bites the Bullet On:** (f) Promises to self (hard to have authority over oneself) and (g) Promises to AI (machines cannot hold standing/authority).

  **2. The Joint-Commitment Account (Gilbert)**
  *   **Reason:** It explains the persistence of obligation through the creation of a "plural subject" that survives temporary lapses in individual capacity or memory.
  *   **Bites the Bullet On:** (a) Promises to the dead (can a dead person remain part of a "we"?) and (f) Promises to self (requires two parties).

  **3. The Expectation/Assurance Account (Scanlon)**
  *   **Reason:** It handles standard interpersonal breaches well but collapses when the promisee lacks the cognitive capacity to hold an expectation or know of the breach.
  *   **Bites the Bullet On:** (a) Promises to the dead, (c) Promises to dementia patients, and (h) Secret breaches where the promisee never knows.

  **4. The Practice/Convention Account (Rawls/Hume)**
  *   **Reason:** It relies entirely on the existence of a public social institution, making it powerless in private, non-social, or non-human contexts.
  *   **Bites the Bullet On:** (f) Promises to self, (g) Promises to AI, and (a) Promises to the dead (no social practice governs these).

  ***

  ### The "Hunch": Which Account Gets Stronger?

  Your hunch is correct: one of these accounts doesn't just survive the weird cases; it is **vindicated** by them. It is **The Authority/Standing Account (4)**.

  Here is why: Most theories of promising are *reductive*—they try to explain the obligation as something else (e.g., preventing disappointment, maintaining social utility, coordinating behavior). When you introduce cases like **(a) The Dead** or **(h) The Secret Breach**, you remove the very things those theories value (psychological disappointment, social trust, coordination). Under those conditions, the Expectation and Practice accounts *weaken* because their explanatory variables have been removed, yet our intuition that the promise is still binding remains.

  The Authority account, however, is *non-reductive*. It claims the obligation is a unique normative relation (a transfer of right) that exists *regardless* of consequences or psychology. Therefore, when you strip away the psychology (Dementia/Dead) and the consequences (Secret Breach), you aren't weakening the Authority view; you are **isolating its variable**. The weird cases act as a control group that eliminates the competition, leaving the Authority view as the only one that matches the intuition that the obligation persists. It looks "stronger" because the noise that drowns out the other theories is exactly what the Authority view ignores.

  ### A Note for Your Essay
  If you want to really impress the seminar leader, don't just present this ranking. Acknowledge that **Case (g) (The AI)** is a "systemic failure" for *all* four accounts. None of them can easily explain why promising a smart speaker feels binding without anthropomorphizing the machine. Using that case to show the *limits* of current philosophical frameworks (perhaps pointing toward a phenomenological or virtue-ethics gap) would be a sophisticated way to conclude. Good luck.
