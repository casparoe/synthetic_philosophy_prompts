prompt: |-
  I am a high school senior doing an independent research project for a philosophy-of-science elective — my faculty advisor sits in the biology department, which is probably why I keep wandering back and forth between the two — and I have gotten stuck on the heritability debates. We read enough to understand that a heritability coefficient is computed from the variance in a population, and then I made the mistake of reading popular-science pieces that talk as if a high heritability means a trait is basically genetic and therefore fixed, alongside statistics pieces that insist the coefficient cannot bear any of that weight. I do not want to just rehearse the familiar point that high heritability does not imply immutability; I want the two camps actually put in a room together. So please draft the joint statement that a behavioral geneticist who treats heritability estimates as a legitimate and central tool for partitioning the sources of variation, and a critic who thinks the coefficient is systematically misleading whenever it is used to answer how much of a trait is due to genes, could both sign after a genuine adversarial collaboration. I want the claims they can both accept — about what exactly a coefficient is a property of, about what it can and cannot support, about the seed-in-different-soils style of thought experiment, and about whether the so-called missing-heritability problem is a problem for the concept itself or only for particular methods; then the precise statements of where they still differ, each phrased the way its own side would want to phrase it; then the cruxes — and I suspect at least one of them is whether an analysis-of-variance decomposition can ever be a causal decomposition, which may be partly a verbal dispute about what the phrase due to genes is permitted to mean. For each crux, give a concrete case or hypothetical that both sides would agree bears on it, and record each side's prediction in advance. One case I would particularly like you to work with, because it confuses me: a scenario in which two populations each show high heritability for some trait, yet the difference between the populations is entirely environmental — for instance, seeds from a single batch of plants grown in rich soil versus poor soil. I want to see what each side says the coefficient does and does not tell you there.

  Because I am going to file this in a structured dataset rather than simply read it, please give the prose statement first and then repeat the same content as a JSON object with exactly these fields: "agreed_claims", an array of strings, each one a single claim both sides sign; "disagreements", an array of objects, each containing "topic", "side_A_formulation", "side_B_formulation", "kind" (taking the value "verbal" or "substantive"), "crux", "shared_test", "side_A_prediction", and "side_B_prediction"; and "residual_uncertainty", an array of strings for anything neither side claims to know. Please keep the prose formal enough that both a geneticist and a statistician would be willing to put their names on it.
