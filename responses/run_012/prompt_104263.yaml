answer: |-
  Hi there,

  Here is my take on how Lakatos would judge the current state of machine learning research if we apply his methodology of scientific research programmes strictly. If we treat the dominant paradigm in modern AI as a Lakatosian research programme, I am convinced he would verdict it as degenerating. To see why, you have to identify the hard core, and in this field, the hard core is unmistakably the Scaling Hypothesis itself, which is essentially the theoretical formalization of what practitioners call the Bitter Lesson. The hard core asserts that intelligence is an emergent property of applying general-purpose learning algorithms to massive amounts of data and compute, and crucially, it dictates that hand-crafted domain knowledge is ultimately a dead end that will be steamrolled by brute force scaling. This core is protected by a negative heuristic that forbids researchers from blaming the core when things go wrong; instead, any failure is attributed to the protective belt, meaning you simply need more data, more parameters, or better optimization techniques. For a long time, this programme was theoretically and empirically progressive because it predicted novel facts, specifically the emergence of capabilities that were not explicitly trained for, and it led to new discoveries in what neural networks could achieve.

  However, the situation has shifted with the recent stagnation of scaling laws, and this is where Lakatos would spot the degenerating problem-shift. When the pure scaling approach hit a wall regarding complex reasoning and reliability, the community did not abandon the hard core but instead rushed to adjust the protective belt with what you described as scaffolding, such as chain-of-thought prompting, external tool use, and modular plugins. Lakatos would argue that these adjustments are classic ad hoc hypotheses designed solely to save the phenomena rather than to expand theoretical understanding. They are reactive patches introduced specifically to explain away the anomaly of the scaling stall without offering a new theoretical insight into why intelligence emerges. Worse still, these scaffolding techniques effectively reintroduce the very hand-crafted domain knowledge that the hard core explicitly rejected. By engineering prompt structures or defining tool interfaces, researchers are smuggling human knowledge back into the system to compensate for the failure of the general learner, which creates a contradiction between the hard core and the protective belt.

  For Lakatos, a research programme becomes degenerating when it grows only by adding such ad hoc clauses to accommodate anomalies rather than by predicting novel facts from its core principles. The current trend in machine learning is not predicting new forms of intelligence based on scaling laws but is instead engineering workarounds to meet existing benchmarks that the core theory can no longer reach on its own. The empirical content is increasing in terms of benchmark scores, but the theoretical content is stagnating because the explanations are becoming increasingly fragmented and reliant on human intervention rather than the autonomous power of the general learner. Therefore, Lakatos would say that while the engineering is impressive, the research programme itself has entered a degenerating phase because it is protecting a falsified hard core through inconsistent and ad hoc adjustments to the belt. He would likely advise that a new hard core is needed, one that can theoretically account for the necessity of structure and knowledge rather than treating them as obstacles to be scaled away.

  Best wishes
