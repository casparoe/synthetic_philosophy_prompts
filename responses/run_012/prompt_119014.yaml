answer: |-
  - **Bottom line**
  Your intuition is correct: the blog post captures the structural spirit of Fricker's work but distorts the mechanisms and ethics enough to get you in trouble in a seminar. The "cognitive deficit" framing is a significant misreading that pathologizes the victim, and the claim about individual blame directly contradicts Fricker's ethical project.

  - **What holds up**
  The blog is right that both injustices are structural and rooted in power imbalances regarding who gets to count as a knower. It also correctly identifies the basic distinction: testimonial injustice concerns *credibility* (being believed), while hermeneutical injustice concerns *intelligibility* (being understood). Acknowledging that these are systemic issues requiring political solutions is consistent with Fricker's broader critique of social power.

  - **Where it slips**
  **The "One Injustice" Conflation.**
  While Fricker acknowledges the two forms often overlap, she insists they are distinct phenomena with different normative structures. Testimonial injustice is an active distortion in a specific exchange (a listener prejudicing a speaker). Hermeneutical injustice is a passive structural gap (a lack of shared concepts). Collapsing them into "one injustice, two currencies" obscures the specific remedies required: one requires correcting bias in listening, the other requires expanding collective understanding. In a seminar, treating them as identical will look like you haven't read the chapters distinguishing them.

  **The "Cognitive Deficit" Framing (The Big Slip).**
  This is the most dangerous error. Fricker does *not* describe hermeneutical injustice as an individual cognitive deficit in the victim. It is a gap in the *collective* hermeneutical resource. The victim isn't "unable to know"; they are unable to *communicate* or socially validate what they know because the culture lacks the tools. Furthermore, the injustice does not end simply because a word exists. Fricker emphasizes that the concept must be taken up by the dominant group to become effective. If the term "sexual harassment" exists but is still dismissed as "just joking around," the hermeneutical injustice persists. Saying the victim "can't know until she gets the word" makes it sound like an intellectual failure on her part, rather than a exclusionary practice by the culture.

  **The Timeline of Resolution.**
  Related to the above, the blog suggests a quick fix: coin a word, circulate it, injustice over. Fricker's view is much slower and more resistant. Hermeneutical marginalization means the oppressed group often creates the concepts, but the dominant group controls the "hermeneutical marketplace." The injustice lasts as long as the dominant group refuses to adopt those concepts. It is not a light switch flipped by vocabulary; it is a struggle for hermeneutical power.

  - **Does the ending follow?**
  No, and this is where you risk the most embarrassment. Fricker's book is subtitled *Power and the **Ethics** of Knowing*. She is a virtue epistemologist. While she agrees the causes are structural, she explicitly argues that individuals *are* responsible for cultivating the "virtue of testimonial justice" to correct for their own prejudices. She believes we must change institutions *and* train ourselves to listen differently. The blog's claim that "no individual is ever really to blame" and that we shouldn't "change hearts" is the exact opposite of Fricker's conclusion. She argues that structural change requires individuals to take ethical responsibility for their credibility judgments. If you say individuals bear no blame, you are ignoring the ethical core of her theory.
