answer: |-
  ### 1. The document

  **CALLOWAY & FRAME**
  **EMPLOYEE HANDBOOK | SECTION 9.4: AFFECTIVE COMPLIANCE AND VALUES ALIGNMENT**

  **Preamble**
  Performance at Calloway & Frame is not limited to output metrics or procedural adherence. Sustainable growth requires internal alignment with firm leadership. Employees are required to cultivate specific affective states regarding their line managers and employment status. These states are not optional behaviours but measurable conditions of employment. Failure to inhabit the required attitudes constitutes a breach of contract equivalent to procedural negligence. The firm distinguishes between acting as though one holds an attitude and actually holding the attitude itself. Only the latter satisfies this policy.

  **Clauses**

  **9.4.1 Obligation of State.**
  Staff must genuinely admire the strategic vision of their line manager and feel gratitude for their placement within the firm. Expressing this admiration verbally or through compliant action is insufficient. The internal state itself is the deliverable. Staff are responsible for ensuring their psychological condition matches the firm's expectations regardless of external provocations or managerial performance.

  **9.4.2 Grounding of Affect.**
  Admiration must be grounded in the perceived qualities of the manager, not in the consequences of holding the attitude. If admiration is adopted solely to avoid disciplinary review, it is classified as Instrumental Compliance. Instrumental Compliance does not satisfy Clause 9.4.1. The reason for holding the attitude must be compatible with the content of the attitude.

  **9.4.3 Incentive Structure.**
  Successful alignment yields a quarterly bonus. However, pursuing the bonus is a reason for action, not a reason for admiration. Staff are reminded that a reason to cultivate admiration is not a reason that makes admiration fitting. Consequently, aiming for the bonus invalidates the bonus condition described in 9.4.2. Staff must want the bonus without letting the want influence the grounds of their admiration.

  **9.4.4 Recursive Valuation.**
  Staff must value the requirement to value the firm. It is not enough to admire the manager; one must admire the obligation to admire the manager. Failure to value this obligation indicates a lack of commitment to the Values Programme itself. This valuation must also be intrinsic, not performed to satisfy this clause.

  **9.4.5 Sincerity Audit.**
  The People Team reserves the right to audit the provenance of employee attitudes. Methods include psychometric triangulation and latency analysis during values workshops. Attempts to simulate the required state without the underlying grounding will be flagged as Dissonance. The firm does not disclose specific detection thresholds to prevent gaming the system.

  **9.4.6 Remediation.**
  Employees flagged for Dissonance must attend mandatory workshops designed to generate the correct grounds for admiration. Attendance is mandatory, though the resulting attitude must remain voluntary to count. Failure to achieve voluntary alignment through mandatory means will result in further review.

  **Closing**
  This policy is effective immediately. Alignment is not optional. Questions regarding the feasibility of involuntary affective control should be directed to the Chief Values Officer, though no accommodation is guaranteed.

  **Signed,**
  **Dr. Aris Thorne**
  **Chief Values Officer**

  ***

  ### 2. Commentary: the machinery

  This document dramatizes the Wrong Kind of Reasons (WKR) problem by institutionalizing state-given reasons as object-given requirements.

  **Clause 9.4.1** establishes the demand for reasons for attitudes (admiration, gratitude) rather than reasons for action (working hard). It treats internal states as deliverables. **Clause 9.4.2** introduces the fittingness constraint: admiration must be based on the manager's qualities (object-given), not the penalty (state-given). This highlights that state-given reasons leave the attitude unfitting.

  **Clause 9.4.3** is the core WKR mechanism. It admits the bonus provides a reason to *cultivate* the attitude (action), but explicitly states this is not a reason *for* the attitude itself. This creates the self-defeat loop: the incentive provided to meet the requirement disqualifies the employee from meeting it if acted upon. **Clause 9.4.4** enacts the regress problem. By requiring employees to value the requirement itself, it demands an infinite nesting of valuing attitudes, each requiring its own intrinsic grounding.

  **Clauses 9.4.5 and 9.4.6** close the "fake it" escape route. In philosophy, one might argue we can simply pretend. The Sincerity Audit posits an empirical mechanism to detect the provenance of reasons, while Remediation mandates the creation of fitting grounds through unfree means, highlighting the tension between causal production and normative justification.

  **Weakest Joke:** Clause 9.4.4 (Recursive Valuation). While it captures the regress objection often raised against state-given accounts, it risks breaking the deadpan tone. It feels slightly more abstractly philosophical than the bureaucratic horror of the sincerity audit. The idea of valuing the obligation to value is conceptually dense, whereas the bonus paradox in 9.4.3 is sharper and more immediately self-defeating in a corporate context.

  ***

  ### 3. Where it breaks

  The parody relies on a assumption that philosophy largely rejects: doxastic voluntarism. The handbook assumes employees can directly control their attitudes (admiration, gratitude) in response to commands. Most contemporary epistemology and ethics hold that attitudes are not subject to direct will; you cannot simply decide to admire someone because you are told to.

  Furthermore, the document assumes epistemic access. The Sincerity Audit implies the firm can distinguish between an attitude held for object-given reasons versus state-given reasons. In reality, the phenomenology of admiration might be identical regardless of its etiology. The piece functions only if we accept that normative grounding is empirically detectable and voluntarily controllable, which collapses the very distinction the WKR problem seeks to protect.
