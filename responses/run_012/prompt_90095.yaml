  # The Geometric Rationality Decision Tree

  **Instructions:** Start at Node 1. Answer the question based on your concrete commitment in the scenario described. Follow the branch to the next node or final position (Leaf).

  ### Node 1: The Repeated Trap
  **Case:** You are offered a biased coin (60% win) to bet on 100 times. If you bet 100% of your bankroll each time, one specific sequence of wins yields an astronomical sum, but any single loss wipes you out completely.
  **Question:** Do you bet 100% of your bankroll on the first flip?
  *   **Yes:** → **Leaf A: The Unrepentant EV Maximizer**
  *   **No:** → Go to Node 2.

  ### Node 2: The One-Off Test
  **Case:** You are offered a single favourable bet that risks everything you have. You are told explicitly this opportunity will never arise again (no sequence, no compounding).
  **Question:** Do you bet the same conservative fraction you chose in Node 1, or do you bet significantly more (up to 100%) because there is no future to protect?
  *   **Bet More/100%:** → **Leaf B: The Pragmatist** (Kelly for series, EV for one-shots)
  *   **Same Conservative Fraction:** → Go to Node 3.

  ### Node 3: The Linear Utility Test
  **Case:** Return to the 100-flip game (Node 1). Suppose your utility function is strictly linear with money ($1M is exactly 1,000,000 times better than $1).
  **Question:** Is betting 100% still a mistake *purely because of the math of the trajectory*, or is it only a mistake because you value money logarithmically?
  *   **Mistake even with linear utility (Trajectory matters):** → **Leaf C: The Ergodicity Theorist** (Time averages ≠ Ensemble averages)
  *   **Only a mistake with Log utility (Preferences matter):** → Go to Node 4.

  ### Node 4: The Source of Log
  **Case:** You have agreed that Log Utility (or equivalent) is required to reject the 100% bet.
  **Question:** Is Log Utility a description of your *intrinsic preferences* (you just happen to value wealth this way), or is it a *derivative requirement* for any agent who wants to survive and grow over time?
  *   **Intrinsic Preference:** → **Leaf D: The Deflationist** (It's just Expected Utility Theory with Log Utility)
  *   **Derivative Requirement (Survival/Growth):** → Go to Node 5.

  ### Node 5: The Domain Boundary
  **Case:** Consider a non-money scenario where you cannot stake small fractions (e.g., a risky action that might end a friendship or damage your health irreversibly).
  **Question:** Does the logic of "avoiding ruin to stay in the game" apply here, or is the geometric argument strictly parochial to financial compounding?
  *   **Applies to Health/Relationships:** → **Leaf E: The Generalist** (Geometric rationality for all compounding goods)
  *   **Strictly Financial:** → Go to Node 6.

  ### Node 6: The Correlation Check
  **Case:** Return to the 100-flip game. Suppose the outcomes are perfectly correlated (all 100 flips win or all 100 flip lose together). It is now effectively a one-off bet disguised as a series.
  **Question:** Is betting 100% still forbidden, or is it acceptable now that compounding is removed?
  *   **Acceptable (Ruin only matters if it stops compounding):** → Go to Node 7.
  *   **Forbidden (Ruin is intrinsically bad):** → **Leaf F: Unoccupied Position** (Ruin aversion without domain generalization)
  *   *(Note: This path is logically coherent but rarely defended; see analysis below.)*

  ### Node 7: The Fractional Check
  **Case:** You are back to the standard 100-flip independent game. You have calculated the exact Kelly fraction.
  **Question:** Do you bet the Full Kelly fraction, or do you bet less (Fractional Kelly)?
  *   **Full Kelly:** → **Leaf G: The Full-Kelly Growth Maximiser**
  *   **Fractional Kelly:** → Go to Node 8.

  ### Node 8: The Reason for Fractional
  **Case:** You are betting Fractional Kelly.
  **Question:** Do you bet less because your *estimate of the edge is noisy/uncertain*, or because even with a *known edge* you prefer less volatility than Full Kelly implies?
  *   **Edge Uncertainty:** → **Leaf H: Fractional Kelly (Uncertainty)**
  *   **Volatility/Risk Aversion:** → **Leaf I: Fractional Kelly (Risk Aversion)**

  ***

  # Analysis of the Tree

  ### 1. Indistinguishable Leaves
  There are two pairs of leaves that this tree cannot behaviourally separate, though they represent distinct philosophical commitments:

  *   **Leaf C (Ergodicity) vs. Leaf D (Deflationist):** Both agents will bet the Kelly fraction (or Full Kelly) in the repeated case and reject the 100% bet. The tree separates them at Node 3 based on their *explanation* (dynamics vs. utility), but in practice, their betting slips look identical. The Ergodicity theorist claims linear utility is fine but the physics of time forbids all-in; the Deflationist claims the physics is fine but utility forbids all-in. Without access to their internal justification, you cannot tell them apart.
  *   **Leaf H (Frac Kelly: Uncertainty) vs. Leaf I (Frac Kelly: Risk Aversion):** Both agents bet, say, half-Kelly. One does it because they fear their edge calculation is wrong (epistemic humility); the other does it because Full Kelly is too volatile for their taste (risk preference). The tree forces a choice at Node 8, but an individual might be motivated by both, and their observable behaviour is the same.

  ### 2. Unoccupied or Rare Nodes
  *   **Leaf F (Unoccupied Position):** This leaf represents someone who says: "Ruin is intrinsically bad (Node 6: Forbidden), but only for money (Node 5: Strictly Financial), and it's not about utility preferences (Node 4: Derivative)."
      *   **Status:** **Incoherent/Unattractive.** This position is rarely occupied because it creates a tension: if ruin is intrinsically bad regardless of compounding (Node 6), that usually implies an intrinsic utility cost (pushing you back to Leaf D) or a universal principle of survival (pushing you forward to Leaf E). Claiming ruin is objectively "bad" in a one-off financial bet solely due to "growth dynamics" when no growth is possible is logically unstable.
  *   **Leaf B (The Pragmatist):** While occupied, this position is often unstable in debate. It requires maintaining two different decision frameworks (EV for one-off, Kelly for repeated) without a unified theory of value. Participants often slide toward Leaf D (Log Utility always) or Leaf A (EV always) under pressure.

  ### 3. Case Usage Note
  *   **Biased Coin x100:** Used in Nodes 1, 3, 6, 7.
  *   **Single All-In:** Used in Node 2.
  *   **Uncertain Edge:** Used in Node 8.
  *   **Correlated Outcomes:** Used in Node 6.
  *   **Non-Money (Health/Friendship):** Used in Node 5.
