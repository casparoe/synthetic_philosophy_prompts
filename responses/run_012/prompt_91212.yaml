answer: |-
  1. Two superrationalists defect because a single bit of uncertainty about whether they are perfect copies breaks the logical link needed to guarantee mutual cooperation.
  2. A superrationalist refuses to split a pot because his identical opponent will run the same division algorithm, resulting in both claiming the entire amount.
  3. Two superrationalists try to coordinate on a fair split, but their identical random number generators produce the same seed, causing a symmetry collision.
  4. A department chair asks two superrationalists to cooperate, but they spend the budget computing the probability that one of them is a copy with a flipped bit.

  **Strongest Angle:** #1 (The Noise/Identity breakdown). It directly addresses the core mechanic of superrationality (logical dependence based on identity) and shows precisely where the machinery jams (the requirement for perfect identity), which is the specific technical hurdle mentioned in the prompt.

  **The Joke:**

  Two grad students who subscribe to Hofstadter's superrationality sit down for a one-shot Prisoner's Dilemma. They know the theory: since they're identical reasoners, whatever one decides, the other *must* decide, so they should both cooperate to maximize the pair's utility. They're about to mark "Cooperate" when one pauses and asks, "Wait, we were trained on the same dataset, but there was a one-bit noise injection in our initialization. Are we *perfectly* identical?" The other replies, "There's a 50% chance I'm the copy with the flipped bit, and you can't observe which one you are." The first student immediately switches to "Defect," saying, "Then the logical correlation isn't 1.0, and my expected utility calculation just flipped." The second nods, marking "Defect" as well, and adds, "Good thing we think alike."
