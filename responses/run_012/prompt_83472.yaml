answer: |-
  **The Scenario**
  Taylor is a high school senior required to attend a mandatory Friday assembly where attendance is taken for civics credit. At the exact same time, a college scout is holding a one-on-one scholarship interview that cannot be rescheduled and could secure Taylor's financial future. Taylor knows the school values the assembly but also wants students to succeed. Taylor decides to skip the assembly without asking permission, reasoning that the interview is a once-in-a-lifetime chance, and goes to the interview in order to secure the scholarship.

  **The Two Maxims**
  *   **Maxim A (Narrow):** I will skip mandatory school events when a unique, time-sensitive scholarship opportunity conflicts in order to secure my financial future.
  *   **Maxim B (Broad):** I will violate institutional obligations when personal benefits outweigh the cost in order to advance my interests.

  **Universalized Worlds & Contradictions**
  If we universalize **Maxim A**, we get a world where every student skips mandatory events only for unique, time-sensitive scholarship conflicts. The school still holds assemblies, and most students attend; the rule remains effective for 99% of cases. The institution does not collapse, and there is no logical contradiction in the concept of "mandatory assembly" because the exception is rare and specific. This passes the test (no contradiction in conception or will).

  If we universalize **Maxim B**, we get a world where everyone violates any obligation whenever they feel the personal benefit is higher. In this world, the concept of an "obligation" or "mandatory rule" ceases to exist because everyone reserves the right to ignore it based on subjective calculation. You cannot have a mandatory rule that everyone is universally permitted to break when inconvenient. This creates a **contradiction in conception**: the rule destroys itself when universalized.

  **Which Description Should Kant Pick?**
  Kant would have to pick **Maxim B**. The test is meant to evaluate the *principle* behind the action, not the specific circumstances that make it tempting. Maxim A hides the underlying principle ("I can break rules for big gains") inside a very specific story ("scholarship interview"). If Kant allowed Maxim A, anyone could make their selfish exception universalizable just by adding enough specific details to their maxim (e.g., "I will break rules on Tuesdays when I'm wearing blue"). To preserve the test's moral force, the maxim must capture the general policy of prioritizing self-interest over duty.

  **The Feature Doing the Work**
  The feature driving the flip is the **level of abstraction in the condition clause** ("when Y"). Maxim A uses a highly specific, rare condition ("unique scholarship conflict"), while Maxim B uses a general, subjective condition ("personal benefits outweigh cost"). The test yields opposite verdicts simply because one description makes the exception look rare and harmless, while the other reveals it as a general license to break rules.

  **Removing the Feature**
  If you remove this feature by making both descriptions equally specific (e.g., comparing "I will skip for scholarships" vs. "I will skip for concerts"), the test becomes stable but loses the philosophical tension. If you make both equally broad, both fail. The problem only exists because human agents can describe their intentions at will, toggling between "I'm doing this specific thing" and "I'm following this general policy."

  **The Kant Defender's Response**
  A defender of Kant would argue that this isn't a flaw in the test, but a constraint on how maxims must be formulated. They would claim that a valid maxim cannot include arbitrary details meant to rig the outcome (like "scholarship" vs. "benefit"). Instead, maxims must be formulated at the level of **moral duty**. The correct maxim isn't about scholarships or benefits; it's about whether one has a duty to obey legitimate institutional rules. Once you frame the maxim as "I will break legitimate rules when inconvenient," the description dependence vanishes, and the test correctly condemns the action. The defender insists the "description problem" is actually a user error in failing to identify the morally relevant features.
