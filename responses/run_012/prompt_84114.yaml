      TO: Transplant Selection Committee
      FROM: Ethics Committee Member
      DATE: [Current Date]
      SUBJECT: Case Review [Patient ID] and Policy Protocol Regarding Abstinence Rules

      **Recommendation**
      1.  **Immediate:** Grant the Medical Director's exception to list the patient.
      2.  **Policy:** Adopt the Social Worker's tracking protocol immediately as the governing process for all future exceptions, to be formalized in June.

      **Reasoning: The Case**
      The 90-day rule serves two ends: predicting post-transplant sobriety and ensuring equitable allocation. In this case, strict adherence risks patient death without securing the rule's intended goal.
      *   **Medical Urgency:** Decompensation timeline (months) conflicts with the waiting period (weeks remaining).
      *   **Predictive Value:** Addiction Medicine assesses relapse risk at 50% regardless of the 13-day deficit. Extending abstinence by two weeks does not materially alter the clinical prognosis.
      *   **Equity:** Denying based on a calendar artifact while possessing an exception clause privileges procedural rigidity over patient survival.

      **Addressing Committee Concerns**
      *   **To the Defense of the Flat Rule:** You are correct that exceptions historically favor the connected. However, refusing all exceptions converts a clinical guideline into a death sentence for outliers. The risk of bias is managed not by banning exceptions, but by auditing them. Transparency, not rigidity, prevents favoritism.
      *   **To the Defense of Particularism:** You are correct that no rule captures every moral nuance. However, unguided particularism erodes trust and consistency. We must judge particulars without abandoning structure. A decision without a record is merely a whim.

      **The Social Worker's Proposal**
      **Verdict: Adopt.**
      This protocol bridges the gap between rigid utilitarianism and unguided particularism.
