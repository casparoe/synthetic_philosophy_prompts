answer: |-
  **TO:** Transplant Selection Committee
  **FROM:** Ethics Committee Member
  **DATE:** October 24, 2023
  **SUBJECT:** Case Review [Patient ID] and Protocol for Abstinence Exceptions

  **Recommendation**
  1.  **Immediate:** Grant the Medical Director's exception to list the patient.
  2.  **Policy:** Adopt the Social Worker's tracking protocol immediately as the governing process for all future exceptions, to be formalized in the June quarterly review.

  **Reasoning: The Case**
  The 90-day rule serves two ends: predicting post-transplant sobriety and ensuring equitable allocation. In this case, strict adherence risks patient death without securing the rule's intended goal.
  *   **Medical Urgency:** The hepatologist estimates survival in months, not years. Waiting 13 additional days carries non-trivial mortality risk.
  *   **Predictive Value:** Addiction Medicine assesses relapse risk at 50% regardless of the 13-day deficit. Extending abstinence by two weeks does not materially alter the clinical prognosis.
  *   **Equity:** Denying based on a calendar artifact while possessing an exception clause privileges procedural rigidity over patient survival.

  **Addressing Committee Concerns**
  *   **To the Defense of the Flat Rule:** You are correct that exceptions historically favor the connected; the two prior exceptions involving legal counsel prove this. However, refusing all exceptions converts a clinical guideline into a death sentence for outliers. The risk of bias is managed not by banning exceptions, but by auditing them. Transparency, not rigidity, prevents favoritism. If we cannot distinguish between a genuine medical exception and a well-advocated violation, the fault lies in our process, not the exception itself.
  *   **To the Defense of Particularism:** You are correct that no rule captures every moral nuance. Features like "strong sponsor" or "grief" cut both ways across different cases. However, unguided particularism erodes trust and consistency. We must judge particulars without abandoning structure. A decision without a record is merely a whim. We need a mechanism that respects the unique case without pretending every unique case creates a new law.

  **The Social Worker's Proposal**
  **Verdict: Adopt with Amendment.**
  This protocol bridges the gap between rigid utilitarianism and unguided particularism.
  *   **Mechanism:** Every exception requires an anonymized case note circulated to the committee.
  *   **Precedent:** No single case binds future panels (preserving particularism).
  *   **Review:** Annual aggregation allows the committee to identify patterns (preserving equity).
  *   **Amendment:** The annual review must have the explicit authority to recommend rule changes to the Board. Without this teeth, the data is decorative. This satisfies the need for consistency without locking us into a fiction of perfect predictability.

  **Why Not Publish Waiver Factors?**
  This question arises frequently. Publishing specific waiver criteria (e.g., "stable housing," "strong sponsor") is inadvisable for three reasons:
  1.  **Gaming:** It converts ethical evaluation into a checklist. Patients and advocates will optimize for the metrics rather than genuine stability.
  2.  **False Precision:** It implies we can predict relapse better than we can. Addiction Medicine admits uncertainty; publishing factors suggests certainty where none exists.
  3.  **Equity:** Published factors favor the articulate and well-resourced who can document "stable housing" or "strong sponsors" better than marginalized patients with equal actual stability. It codifies the advantage of the well-off.

  **Conclusion**
  We list the patient under the existing exception clause. Simultaneously, we institute the tracking protocol. This honors the urgency of the present case while building the data necessary to refine the rule by June. We avoid both the cruelty of the flat rule and the arbitrariness of pure discretion.
