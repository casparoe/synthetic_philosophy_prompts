      *   **Precedent:** No single case binds future panels (preserving particularism).
      *   **Review:** Annual aggregation allows the committee to identify patterns (preserving equity).
      *   **Amendment:** The annual review must have the authority to recommend rule changes to the Board. Without this teeth, the data is decorative.

      **Why Not Publish Waiver Factors?**
      This question arises frequently. Publishing specific waiver criteria (e.g., "stable housing," "strong sponsor") is inadvisable for three reasons:
      1.  **Gaming:** It converts ethical evaluation into a checklist. Patients and advocates will optimize for the metrics rather than genuine stability.
      2.  **False Precision:** It implies we can predict relapse better than we can. Addiction Medicine admits uncertainty; publishing factors suggests certainty where none exists.
      3.  **Equity:** Published factors favor the articulate and well-resourced who can document "stable housing" or "strong sponsors" better than marginalized patients with equal actual stability.

      **Conclusion**
      We list the patient under the existing exception clause. Simultaneously, we institute the tracking protocol. This honors the urgency of the present case while building the data necessary to refine the rule by June. We avoid both the cruelty of the flat rule and the arbitrariness of pure discretion.

