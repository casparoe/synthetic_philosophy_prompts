  I'm taking a course on philosophy of action and I'm a bit confusd about the Buridan's ass case. I've read the usual stuff about how the ass starves because it has no reason to prefer one haystack to the other, and I know the standard replies: (i) any choice is rational when options are exactly equal, (ii) a rational agent can't choose without a preference, so the case shows something is wrong with the theory, and (iii) you should use a randomising device like a coin to break the tie. But I want to push on a wrinkle: what if the agent has no preference between the outcomes and also no preference between the tie-breaking procedures? Suppose I'm indifferent between two identical-looking jobs, and also indifferent between deciding by coin, by asking a friend, or by just going with the one whose name I saw first. A friend told me that in that case the only rational thing is to form a preference -- to decide which option I want to be the kind of person who picks -- rather than merely selecting. Another friend said that's just adding a preference after the fact and doesn't solve anything. I've been toying with a distinction I'm calling thin indifference (I really don't care about the outcomes at all) versus thick indifference (I care about the outcomes but my reasons are perfectly balanced). I think Buridan's ass is usually read as thick indifference, but maybe the interesting case is thin indifference. I'd like you to act as a professional philosopher of action and decision theory. Think carefully -- maybe brainstorm the main positions privately first -- then write an essay that takes a stand: can a choice be rational when the agent has no preference between the options? Weigh the strongest arguments on each side and don't end on a wishy-washy 'it depends' -- land on a verdict. In particular, say whether the distinction between thin and thick indifference does any real work, or whether it's just a verbal trick. Please lead with your bottom line in the first sentence, then give the reasoning, with no preamble and no restating of my question. And tell me what would change your mind: which argument or consideration would lead you to a different verdict, and where your reasoning is most likely to fail. Write in British English, please -- I'm submitting this to a UK department and my supervisor is fussy about 'analyse' vs 'analyze' and that sort of thing. No need for a reading list or citations; I just want the argument.
