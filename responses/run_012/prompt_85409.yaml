answer: |-
  Here is the audit of your colleague's argument, broken down by claim, with the verdict a contemporary philosopher of well-being would likely give.

  **Claim:** "Hedonism is the view that pleasure is the only thing that's good in itself and pain is the only thing bad in itself, and everything else... is good only as a means to getting pleasure."
  **Verdict:** **Accept.** This is the standard definition of axiological hedonism. He has the definition right.

  **Claim:** "The fatal problem is the heterogeneity problem. Actually look at pleasures... There is no single thing all of those have in common. There's no one feeling of 'pleasure' they all share..."
  **Verdict:** **Wince, but grant.** This is a real, standard objection (often linked to Wittgenstein or Moore). It successfully refutes *phenomenal hedonism* (the idea that pleasure is a specific sensation, like a tingling). However, it does not refute *attitudinal hedonism* (the idea that pleasure is a pro-attitude toward a state of affairs, i.e., "being pleased that X"). A careful hedonist accepts this kills the "sensation" model but switches to the "attitude" model.

  **Claim:** "So the basic unit the hedonist wants to maximize doesn't exist, and a theory built on maximizing something that isn't there falls apart."
  **Verdict:** **Flatly Wrong.** This conclusion does not follow because the "unit" exists for attitudinal hedonists (the attitude of enjoyment). The theory does not fall apart; it just shifts formulations. He is treating one version of hedonism as the only version.

  **Claim:** "This is why hedonism survives only in the everyday sense of the word, the guy who chases whatever feels good right now, which no serious person defends."
  **Verdict:** **Flatly Wrong.** This conflates philosophical hedonism (a theory of value) with colloquial hedonism (a lifestyle of indulgence). Serious philosophers (e.g., Fred Feldman, Chris Heathwood) actively defend hedonism today. It is a minority view, but not abandoned.

  **Claim:** "And you can't fix it by saying some pleasures are higher and some are lower, because the moment you start ranking pleasures by anything other than how much pleasure they contain, you're not a hedonist anymore..."
  **Verdict:** **Wince, but grant.** This is a strong objection to *qualitative* hedonism (J.S. Mill). If quality is independent of quantity, it risks smuggling in non-hedonic values. However, a *quantitative* hedonist (Jeremy Bentham) simply denies quality matters at all. So, this objection kills Mill's version, but not Bentham's.

  **Claim:** "So hedonism is refuted, and anyone who says they're a hedonist about well-being is either confused or is a desire-satisfaction theorist who hasn't noticed."
  **Verdict:** **Flatly Wrong.** The conclusion does not follow. Since attitudinal hedonism avoids the heterogeneity problem, and quantitative hedonism avoids the quality problem, the view is not "refuted." It is contested, but logically viable. Desire-satisfaction theory is a rival, not the only alternative.

  **Summary of the Sloppiness**
  Your colleague is treating contested objections as decisive refutations. He assumes all hedonism is *phenomenal* (about sensations) when modern hedonism is mostly *attitudinal* (about enjoyment). He assumes all hedonism is *qualitative* (Mill) when *quantitative* (Bentham) versions exist. He assumes a theory is "dead" if it isn't the dominant consensus, rather than if it is logically incoherent.

  **Does the conclusion follow?**
  No. The heterogeneity point restricts *how* you must define pleasure, it does not eliminate the concept of pleasure entirely. The theory survives by updating its definition of "pleasure."

  \answer{misleading; Heterogeneity kills phenomenal hedonism only; attitudinal versions survive.}
