  The view is well insulated from empirical falsification but poorly insulated from theoretical erosion. By making distinctness brute, you immunize the view against counterexamples involving modal profiles, but only by rendering the distinctness inert. This is a problem: a metaphysical posit that does no explanatory work and distinguishes no possibilities is vulnerable to Occam's Razor. The identity theorist can replicate your predictions with fewer entities. While you avoid the pitfalls of modal essentialism, you inherit the burdens of bare particularism without its individuating power. The view is coherent but theoretically stagnant. It survives by retreating to primitives, which is permissible in metaphysics but costly. Ultimately, it is a stable position only if one values preserving ordinary object counts over metaphysical grounding, accepting that some facts are simply ungrounded brute necessities.
