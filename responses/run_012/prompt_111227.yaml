  ### What it predicts that its rivals do not

  Primarily, it predicts the falsity of identity statements where all discernible properties match. Unlike modal pluralism, it predicts no difference in counterfactual scenarios involving the objects; unlike identity theory, it predicts two referents for 'statue' and 'clay'. It offers a semantic advantage: sortal concepts can vary without requiring reality to harbor essentialist structures. However, regarding empirical or observable phenomena, it predicts nothing distinct. Its payoff is purely theoretical, preserving a robust realism about ordinary objects without committing to controversial modal metaphysics. It secures the intuition of distinctness while maintaining Humean supervenience, but this is a reconciliation of intuitions rather than a novel prediction about the world.

