answer: |-
  ### I. The Desiderata Taxonomy

  Below is the specification of requirements for an adequate theory of reparations. These are not arguments for a specific position, but the functional conditions any account must satisfy to be considered complete.

  #### A. Cases the Theory Must Handle
  *For each case, the theory must explain the status of the claim (valid, invalid, or transformed) and the rationale.*

  1.  **The Closed Loop (Living Victims/State Redress)**
      *   **Case:** American redress for Japanese American internment ($20,000 + apology + education fund to survivors).
      *   **Requirement:** The theory must explain why this counts as a *completion* of justice. It must account for the moral force of the apology alongside the payment, and explain why the claim does not transmit to the children of survivors once the survivors die.
  2.  **The Deep Past (All Dead)**
      *   **Case:** Atlantic chattel slavery or Indigenous dispossession where victims and perpetrators are deceased.
      *   **Requirement:** The theory must explain the mechanism of transmission. If the direct victim is gone, what entity holds the right to claim, and what entity holds the duty to pay? It must justify why the duty survives the death of the wrongdoer.
  3.  **The Successor State (Defunct Polity)**
      *   **Case:** Germany's 2021 declaration with Namibia (acknowledged Herero/Nama genocide, offered €1.1bn development aid, rejected *legal* liability).
      *   **Requirement:** The theory must distinguish between *moral* liability and *legal* liability in intergenerational contexts. It must explain whether the Federal Republic of Germany is liable for the German Empire's acts based on continuity of institutions, continuity of citizenship, or mere benefit, and why "development aid" might be insufficient compared to "reparations."
  4.  **The Innocent Possessor (Good Faith Acquisition)**
      *   **Case:** Present holders of disputed land/assets who acquired them in good faith and have nowhere else to go (e.g., third-generation farmers on expropriated land).
      *   **Requirement:** The theory must adjudicate between the victim's claim to restitution and the possessor's claim to security. It cannot simply assert "return the property"; it must specify if compensation substitutes for restitution when restitution creates a new injustice.
  5.  **The Existence Paradox (Non-Identity)**
      *   **Case:** A wrong without which the present-day claimants would not have existed (e.g., descendants of slaves whose specific lineage resulted from the conditions of slavery).
      *   **Requirement:** The theory must explain how one can be harmed by an act that was a necessary condition of one's existence. It must define "harm" in a way that does not rely on a counterfactual where the claimant is better off *and* exists.
  6.  **The Stale Claim (Temporal Limit)**
      *   **Case:** The Norman Conquest (1066).
      *   **Requirement:** The theory must provide a non-arbitrary cutoff point. It must explain why slavery (c. 400 years ago) generates claims while the Norman Conquest (c. 1000 years ago) does not, without relying solely on "statutes of limitation" which are legal, not moral, concepts.
  7.  **The Living Structure (Ongoing Effects)**
      *   **Case:** A wrong that is not truly historical because its effects are ongoing (e.g., segregation laws that ended recently but shaped current wealth distribution).
      *   **Requirement:** The theory must distinguish between *reparations for the past* and *reform for the present*. If the injustice is ongoing, does the language of "reparation" still apply, or does it shift to "distributive justice"?
  8.  **The Resource Conflict (Added Case)**
      *   **Case:** Reparations to Group A require resources that would violate the basic subsistence or rights of innocent Group B (e.g., taxing a vulnerable minority to pay for historical wrongs).
      *   **Requirement:** The theory must provide a triage mechanism. It must explain whether the duty to repair historical wrongs trumps the duty to prevent current destitution, or how to balance competing claims on the same finite pool of resources.

  #### B. Distinctions the Theory Must Respect
  *The theory must either maintain these distinctions or provide a robust argument for why collapsing them is necessary.*

  1.  **Remedy Type:** Compensation (for loss), Restitution (of thing), Apology/Recognition (symbolic), and Reform (structural change).
      *   **Motivation:** A theory that treats money as a perfect substitute for apology (or vice versa) fails the **Closed Loop** case, where the apology was deemed essential. A theory that treats reform as sufficient fails the **Deep Past** case, where specific rectification is demanded.
  2.  **Fault vs. Liability:**
      *   **Motivation:** In the **Deep Past** and **Successor State** cases, the current taxpayers/policymakers are not at fault. The theory must explain how liability can attach without personal culpability (e.g., via citizenship, benefit, or institutional continuity).
  3.  **Original Act vs. Present Distribution:**
      *   **Motivation:** In the **Good Faith Possessor** case, the original act was wrongful, but the present distribution might be stable. The theory must clarify whether we are rectifying the *act* (backward-looking) or the *distribution* (forward-looking).
  4.  **Ground of Duty:**
      *   **Motivation:** In the **Successor State** case, is the duty based on *causation* (we did it), *benefit* (we have the money), or *membership* (we are the state)? The theory must specify which ground triggers the obligation, as each yields different payers and amounts.

  #### C. Constraints the Theory Must Satisfy
  *These are external consistency checks.*

  1.  **Distributive Justice Consistency:**
      *   **Motivation:** Resources are scarce. A theory that demands reparations regardless of the impact on the basic welfare of the paying population fails the **Resource Conflict** case. It must fit within a broader account of what people owe each other generally.
  2.  **Metaphysical Neutrality:**
      *   **Motivation:** The theory cannot presuppose a controversial metaphysics of group identity (e.g., that groups are organic entities that survive across centuries). It cannot treat descent as *by itself* sufficient for owing or being owed, or it fails the **Non-Identity** and **Deep Past** cases by relying on essentialism.
  3.  **Determinacy:**
      *   **Motivation:** The theory must be action-guiding. It must say *who* owes *what* to *whom*. If it concludes that "everything is connected" and therefore "nothing is calculable," it fails to address the **Successor State** or **Closed Loop** cases practically.
  4.  **Differentiation:**
      *   **Motivation:** The theory must explain the difference between recognized claims (slavery) and rejected claims (Norman Conquest). If it cannot distinguish them without arbitrariness, it fails the **Stale Claim** test.

  ---

  ### II. Meta-Evaluation: Tensions and Scoring

  Per your request, this section separates mandatory requirements from partisan commitments, identifies internal tensions, and scores the major families of view.

  #### 1. Mandatory vs. Partisan Requirements
  Not all the constraints listed above are neutral. Some reflect specific philosophical commitments.

  *   **Mandatory (Conditions of Adequacy):**
      *   **Determinacy:** Any political theory must be able to guide action.
      *   **Differentiation:** Any theory must explain why some claims are valid and others are not (Slavery vs. Norman Conquest).
      *   **Handling the Cases:** The theory must offer a coherent position on the eight cases listed, even if that position is "no claim exists."
  *   **Partisan (Contested Commitments):**
      *   **Distributive Justice Consistency:** Corrective Justice theorists often argue that rectification *trumps* distribution. Insisting that reparations must fit within a prior distributive scheme is a commitment to the priority of distribution, not a neutral constraint.
      *   **Metaphysical Neutrality:** Some theories (e.g., certain Indigenous accounts) argue that group continuity *is* a metaphysical reality. Demanding neutrality may rule out these views a priori.
      *   **Fault vs. Liability:** Strict libertarians may argue liability *requires* fault. Demanding a theory that separates them presupposes a collectivist or institutional view of responsibility.

  #### 2. Internal Tensions (The "Impossible Trinity")
  There is a significant tension between three requirements. A theory can likely satisfy only two of the following three:

  1.  **Full Restitution (Corrective Justice):** Return the victim to the position they would have been in had the wrong not occurred.
  2.  **Metaphysical Neutrality/Individualism:** Avoid strong claims about group identity over centuries; treat individuals as the primary units.
  3.  **The Deep Past/Non-Identity:** Address claims where victims and perpetrators are dead and claimants owe their existence to the wrong.

  *   **The Conflict:** To satisfy **(1)** in **(3)**, you need to compare the actual world to a counterfactual world where the wrong didn't happen. But under **(2)** (individualism), the specific individuals in the counterfactual world would not exist (Non-Identity Problem). Therefore, you cannot measure the loss. To solve this, you must either abandon **(1)** (shift to forward-looking distribution) or abandon **(2)** (adopt a robust theory of group identity that survives death and generational change). **A theory that insists on all three is internally inconsistent.**

  #### 3. The "Killer" Requirement
  The single requirement that does the most work in ruling out the main families of view is the **Differentiation Constraint (Slavery vs. Norman Conquest)**.

  *   **Why:** It forces a theory to justify a *temporal limit* on justice. Forward-looking theories struggle to explain why *past* history matters at all. Corrective Justice theories struggle to explain why the duty *expires*. This constraint exposes the arbitrariness in almost every account of intergenerational time.

  #### 4. Scoring the Families of View
  *Scored against the Desiderata Taxonomy (Pass/Fail/Struggle).*

  *   **Corrective Justice (Backward-Looking):**
      *   *Score:* **Fails Non-Identity & Stale Claim.**
      *   *Reasoning:* It handles the **Closed Loop** perfectly. However, it collapses on the **Deep Past** and **Non-Identity** cases because the specific victims no longer exist to be "corrected." It also struggles to explain the **Stale Claim** cutoff without arbitrary statutes of limitation.
  *   **Beneficiary / Unjust Enrichment:**
      *   *Score:* **Struggles with Good Faith & Determinacy.**
      *   *Reasoning:* It handles the **Deep Past** well (liability via benefit). However, it falters on the **Good Faith Possessor** (is an innocent beneficiary liable?) and fails **Determinacy** (calculating exact benefit over centuries is often impossible). It also struggles to differentiate Slavery from the **Norman Conquest** if benefits persist.
  *   **Structural Injustice:**
      *   *Score:* **Passes Ongoing Effects; Fails Differentiation.**
      *   *Reasoning:* Excellent for **Ongoing Effects** and **Resource Conflict**. However, it struggles with the **Closed Loop** (why pay individuals if the structure is the problem?) and fails the **Differentiation Constraint** (if the claim is based on current structure, why privilege slavery over other structural disadvantages?).
  *   **Supersession (Time-Lapse):**
      *   *Score:* **Passes Stale Claim; Fails Ongoing Effects.**
      *   *Reasoning:* Explicitly designed to handle the **Norman Conquest** vs. Slavery distinction (entitlements supersede over time). However, it risks validating the **Good Faith Possessor** too quickly and struggles with **Ongoing Effects** (when does a present effect become a past wrong?).
  *   **Forward-Looking Distributive:**
      *   *Score:* **Passes Resource Conflict; Fails Differentiation.**
      *   *Reasoning:* Handles **Resource Conflict** and **Determinacy** well. However, it fundamentally fails the **Differentiation Constraint**. If the goal is a just future, it cannot explain why we owe *reparations* to slaves' descendants specifically, rather than just aid to the currently poor. It dissolves the distinctiveness of the historical claim.
