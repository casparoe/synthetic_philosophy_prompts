          *   *Critique:* This is mostly correct but slightly imprecise. The World-Exploder objection usually targets the implication that we should destroy the *actual* world (which contains suffering). LTNU avoids saying we should destroy *this* world if the suffering here is mostly sub-threshold. However, the student says "nothing licenses destroying them [worlds whose members' suffering stays below the threshold]." This is correct. But does LTNU approve of extinguishing life *if* supra-threshold suffering exists? The student implies the view "does not carry the implication that made unthresholded negative utilitarianism unacceptable." This is defensible. The unacceptable implication was *universal* extinction. LTNU avoids *universal* extinction.
