  1. **Whilst Dennett originally framed the Orwellian and Stalinesque models as competing claims about when consciousness occurs, you've suggested the distinction actually hinges on when the memory trace is written. Could you unpack why shifting the focus to memory consolidation dissolves the traditional puzzle?**
     *Follow-up:* If she says it clarifies the metaphysics: "But does that not risk making the experience itself inaccessible? If the memory is the only record we have, are we not merely studying confabulation rather than consciousness?"

  2. **In principle, what sort of empirical evidence ought to settle the debate between these two models? Are there neuroscientific markers we should be looking for, or is the distinction purely theoretical?**
     *Follow-up:* If she says neuroscience might find it: "But if the timing differences are in the order of milliseconds and subjective report is our only window, how do we rule out the possibility that the measurement itself alters the timing?"

  3. **Suppose the honest answer is that no empirical test could ever decide between them. Would you conclude that the question is metaphysical nonsense, or simply that our current concepts of 'experience' are too blunt?**
     *Follow-up:* If she says concepts are too blunt: "Does that suggest we ought to eliminate the notion of a precise 'moment of experience' from our ontology entirely?"

  4. **Critics often argue that this whole debate presupposes a Cartesian Theatre—a single place or time where things become conscious. Does defending a Stalinesque line require you to commit to a single timeline of experience?**
     *Follow-up:* If she says no: "Then how do you account for the subjective feeling of a unified 'now' without positing a centre where that unity is assembled?"

  5. **Ordinary phi motion is already tricky for a Stalinesque account, but the colour phi phenomenon seems particularly damning. Why is the interpolation of colour specifically harder to reconcile with pre-experiential editing than motion alone?**
     *Follow-up:* If she says it's about feature binding: "But if the brain must wait for the second flash to know the colour, doesn't that reintroduce the delay that makes the Stalinesque model look like backward causation anyway?"

  6. **Predictive processing models suggest the brain is constantly hallucinating reality and correcting for errors. Does your defence of the Stalinesque model sit comfortably with this, or does predictive coding blur the line between editing and experiencing?**
     *Follow-up:* If she says it fits well: "If the brain is predicting the input before it arrives, is the 'editing' happening before the signal even reaches the cortex, thereby making the distinction between input and edit meaningless?"

  7. **A classic worry about editorial models is the homunculus fallacy—who is watching the edit before it reaches consciousness? How do you avoid positing a little man inside the head who sees the interpolated dot?**
     *Follow-up:* If she says it's sub-personal: "But if the editing is sub-personal, in what sense is it 'Stalinesque' rather than just standard neural processing? At what point does the editing become experience?"

  8. **Some researchers prefer the term 'postdiction' to describe these effects. Do you see this as a useful technical distinction, or is it merely a nicer name for retroactive editing that hides the philosophical problem?**
     *Follow-up:* If she says it's useful: "Doesn't 'postdiction' still imply that the experience was determined after the fact, which smuggles in the Orwellian view you're trying to avoid?"

  9. **How does your account handle the cutaneous rabbit or the flash-lag effect? Do these phenomena demand the same Stalinesque explanation, or do they require a different mechanism entirely?**
     *Follow-up:* If she says same mechanism: "The cutaneous rabbit involves tactile sensation over seconds, whereas colour phi is milliseconds. Can a single model of memory trace formation really span such different temporal scales?"

  10. **For students just beginning to grapple with philosophy of mind, what is the biggest misconception they hold about the reliability of their own temporal experience?**
      *Follow-up:* If she says they trust intuition too much: "So would you advise them to treat their own phenomenology as data to be explained away, rather than evidence to be trusted?"
