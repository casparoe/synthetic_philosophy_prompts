prompt: |-
  I'm a high school student and I run a tiny philosophy podcast for my school's philosophy club. Next week's guest is a philosopher who works on the timing of consciousness. She defends the Stalinesque line on the color phi phenomenon—you know, the one where two dots flash in different places and different colors, and people report seeing a single dot move and change color. She thinks the brain edits the content before it ever reaches experience, so there's no need for literal backward causation. She also has a new-ish argument that the Orwellian/Stalinesque distinction is really about when the memory trace is written, not when experience happens. I want to interview her properly and not just let her restate the standard stuff. Can you draft eight to ten questions, with a follow-up for each one keyed to the answer she's most likely to give? I'd like at least one question on what exactly separates the Orwellian and Stalinesque readings in the color phi case; one on what kind of empirical evidence could ever decide between them, and what she'd say if the honest answer is nothing; one on whether the whole debate presupposes a Cartesian theater or a single timeline of experience; one on why the color version is supposed to be harder for a Stalinesque story than ordinary phi; and one on how her view looks if you take predictive processing seriously. Also maybe one on how she avoids a homunculus in the editing story, one on whether postdiction is just a nicer name for retroactive editing, and one comparing color phi to the cutaneous rabbit or the flash-lag effect. Please write the actual questions in British English—I'm trying to practice it—but the rest can be normal. Don't bother with citations or reading lists, I just want the questions. I'm probly overthinking this, but I definately want the follow-ups to be sharp.
