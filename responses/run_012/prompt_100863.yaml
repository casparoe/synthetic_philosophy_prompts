answer: |-
  The puzzle you have assembled is the contemporary core of the epistemology of skill. You have correctly identified that the two dominant historical theories—**Intellectualism** (knowing how is a species of knowing that) and **Simple Ability** (knowing how is just the ability to do)—both shatter against your pile of cases. The paralyzed swimmer breaks Simple Ability; the bike rider and ex-driver break Intellectualism.

  Your intuition that "guided ability" is the right track is sound, but as you noted, "grasp" is the leak in the hull. To repair it, we must replace "grasp" (which suggests a mental object) with **integration** (which describes a functional relationship between the agent and the action).

  Here is the principle that best captures your pattern, followed by the test against your cases, the necessary overturning of verdicts, and the prediction you requested.

  ### The Principle: Integrated Dispositional Competence

  **S knows how to $\phi$ if and only if:**

  1.  **Competence:** S possesses a reliable disposition to $\phi$ successfully (S would succeed in $\phi$-ing in normal conditions).
  2.  **Agency:** The disposition is responsive to S's intentions (S can start, stop, or adjust the $\phi$-ing at will).
  3.  **Internalization:** The disposition is sustained by S's own cognitive-motor architecture, not solely by external scaffolding or transient states.

  **How the clauses answer for the cases:**
  *   **Clause 1 (Competence)** handles the **Paralyzed Swimmer** (she has the disposition, even if output is blocked) and the **Friend with the Manual** (he lacks the disposition).
  *   **Clause 2 (Agency)** handles the **Hypnotized Woman** and the **Ear-Wiggler** (distinguishing voluntary skill from reflex or alien compulsion).
  *   **Clause 3 (Internalization)** handles the **GPS Driver** and the **Ex-Driver** (distinguishing retained internal skill from external dependency or degraded capacity).

  ---

  ### Testing the Principle Against the Cases

  Here is the verdict of the principle against your original pile and the two new additions.

  | Case | Verdict | Which Clause Decides? | Why? |
  | :--- | :--- | :--- | :--- |
  | **Uncle (Bike)** | **Knows How** | Competence + Internalization | He succeeds reliably; the skill is in his body, not his propositions. |
  | **Friend (Manual)** | **Does Not Know How** | Competence | He lacks the reliable disposition to succeed in the water. |
  | **Paralyzed Swim** | **Knows How** | Competence (Modal) | She possesses the internal disposition; the failure is in *exercise*, not *possession*. (Clause 1 allows for physical barriers). |
  | **Ex-Driver** | **Does Not Know How** | Competence | His disposition has degraded; he cannot successfully execute the turn anymore. |
  | **Chess/Musician** | **Knows How** | Internalization | They succeed reliably via internal architecture, even without propositional "grasp." |
  | **Hypnotized Woman** | **Borderline / No** | **Agency** | *See "Overturned Verdicts" below.* If she cannot stop/start at will, she fails Clause 2. |
  | **Ear-Wiggler** | **Knows How** | Agency + Internalization | If the wiggling is voluntary (on command), it meets Agency. Innate skills count if voluntary. |
  | **Chess Engine** | **Does Not Know How** | **Agency** | *See "Overturned Verdicts" below.* It lacks intentionality; it simulates competence without agency. |
  | **GPS Driver** | **Does Not Know How** | Internalization | The competence is in the device. Remove the device, the disposition fails. |

  ### Honest Account of Overturned Verdicts

  To maintain precision, this principle forces you to abandon or refine two of your tentative intuitions.

  **1. The Hypnotized Woman**
  *   **Your Intuition:** You were unsure whether to credit her with knowing.
  *   **Principle's Verdict:** **No Knowing How (unless she has voluntary control).**
  *   **Reasoning:** Clause 2 (Agency) requires the action be responsive to the agent's intentions. If the skill "happens to her" and she cannot abort the action or initiate it without the hypnotic trigger, she is a vessel for the skill, not the knower. If she *can* start and stop it at will, but merely feels strange doing so, then she *does* know how. The principle forces you to decide: is the alienation phenomenological (feels weird) or structural (lack of control)? If the latter, the knowing is absent.

  **2. The Chess Engine**
  *   **Your Intuition:** You left this open.
  *   **Principle's Verdict:** **No Knowing How.**
  *   **Reasoning:** This is the hardest pill to swallow for functionalists. However, Clause 2 (Agency) requires the disposition be tied to *intentions*. A chess engine optimizes; it does not intend. It is a tool that *contains* a simulation of knowing how, much like a map contains a representation of a territory but does not *know* the territory. To credit the engine with KH is to collapse the distinction between a knower and a very sophisticated instrument.

  ### The Deciding Case

  You asked for a case that would decide between survivors. The tension here is between **Internalization** and **Extended Cognition**.

  **The Case:** *The Neural Implant.*
  Imagine a pianist who loses fine motor control due to nerve damage. She receives a brain-computer interface that intercepts her motor signals and corrects the tremors before they reach her fingers. She plays flawlessly again.
  *   **Question:** Does she know how to play?
  *   **Why it decides:** If you say **Yes**, you prioritize the *source of intention* (her brain) over the *medium of execution*. If you say **No**, you prioritize *biological internalization* (Clause 3). This case tests whether "Internalization" allows for technological integration that becomes functionally transparent.

  ### Prediction: The Nonsense Phrase Case

  You asked for a prediction regarding a person who can perform a skill *only* while reciting a nonsense phrase, failing the moment it is taken away.

  **The Prediction:** **This person does NOT know how to perform the skill.**

  **Application of the Principle:**
  *   **Competence:** They possess a disposition to succeed, *conditionally*.
  *   **Agency:** They can likely start/stop (assuming they choose to recite).
  *   **Internalization:** **Failed.**
  *   **Reasoning:** The nonsense phrase acts as an external scaffold, functionally identical to the GPS. It is a prop required to stabilize the disposition. If the disposition collapses when the prop is removed, the competence is not *internalized* in the agent's architecture; it is distributed between the agent and the phrase.
  *   **Nuance:** If the phrase is merely a *focus aid* (like a swimmer counting strokes) that *could* be discarded with training, they have a fragile KH. But if the skill *fails* without it, the principle dictates the knowing is incomplete. They know how to "perform-while-reciting," but they do not know how to "perform."

  ### Repairing Your "Guided Ability" Intuition

  Your original attempt was: *"Knowing how is the ability to do X when that ability is guided by the agent's own grasp of how it is done."*

  Here is the repair that saves it from the Ear-Wiggler and Hypnotist cases:

  > **Repaired Principle:** "Knowing how is the possession of a reliable disposition to do X, where the disposition is **governed by the agent's own sensorimotor expectations**."

  *   **Why this works:**
      *   **Sensorimotor Expectations:** This replaces "grasp." It doesn't require propositions (saving the Bike Rider). It requires that the agent anticipates the outcome of their movements (saving the Hypnotist—if she feels it "happens to her," she lacks the expectation of agency).
      *   **Possession vs. Exercise:** This allows for the Paralyzed Swimmer (she has the expectations/pathways, even if muscles fail).
      *   **Internalization:** This excludes the GPS driver (the expectations are in the device's algorithm, not her head).

  **Final Verdict on the Ear-Wiggler:**
  Under the Repaired Principle, the Ear-Wiggler **Knows How**. Even if innate, if she can wiggle on command, she has sensorimotor expectations (she knows moving her scalp will move the ear). The lack of *learning* is irrelevant; knowing how does not require a history of acquisition, only a current state of integrated competence.

  ### Summary
  The distinction you are seeking is not between *mind* and *body*, nor between *proposition* and *action*. It is between **possession** and **dependency**.
  *   **Knowing How** is an internal possession that survives the removal of tools and the temporary blockage of output.
  *   **Not Knowing How** is a dependency on tools, propositions, or external triggers that collapses when those supports are removed.

  The Paralyzed Swimmer possesses the skill but lacks the output. The GPS Driver has the output but lacks the possession. The Principle of Integrated Dispositional Competence is the only one that cuts that joint cleanly.
