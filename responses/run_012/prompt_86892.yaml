answer: |-
  ### Session Plan: The Kalai–Smorodinsky Solution (90 Minutes)

  **Objective:** Move the group from viewing bargaining solutions as "fair splits of a pie" to viewing them as "selection rules anchored to counterfactual power," specifically highlighting the infeasibility of the anchor and the irrelevance of interpersonal utility comparison.

  ---

  ### I. The Session Arc (Order and Dependencies)

  **1. Reset the Frame (0–10 mins)**
  *   **Action:** Draw a generic convex set $S$ in the first quadrant. Mark a disagreement point $d$ inside it (start with $(0,0)$ for simplicity, but label it $d$).
  *   **Say:** "For the next 90 minutes, we are not discussing fairness. We are discussing a function that takes a shape ($S$) and a point ($d$) and returns a single point ($f(S,d)$). Our job is to reverse-engineer the logic of that function."
  *   **Why:** Breaks the "fairness" habit immediately. Establishes the mathematical object before the moral intuition.

  **2. Constructing the Anchor (10–30 mins)**
  *   **Action:** Ask the group: "If Player 1 could dictate the outcome, subject only to Player 2 accepting at least $d_2$, where would we be?" Mark this $b_1$ on the x-axis. Repeat for Player 2 ($b_2$ on y-axis). Mark the point $b = (b_1, b_2)$.
  *   **Crucial Move:** Explicitly shade the region outside $S$ where $b$ sits. Circle $b$ in red.
  *   **Say:** "This point $b$ is the Ideal Point. It is typically *infeasible*. You cannot both have your maximum simultaneously. KS does not benchmark against what you can *have*; it benchmarks against what you could *demand* if the other surrendered."
  *   **Why:** Addresses Feature 1 (Infeasible Anchor). This is the conceptual crux. If they think $b$ is feasible, the rest of the session fails.

  **3. The Construction (30–50 mins)**
  *   **Action:** Draw a straight line from $d$ through $b$. Extend it until it hits the Pareto frontier of $S$. Mark that intersection $x_{KS}$.
  *   **Say:** "The solution is the maximal point on the line segment connecting disagreement to the ideal."
  *   **Why:** Visualizes the "equal proportion" logic without invoking algebra yet.

  **4. Scale Invariance (50–70 mins)**
  *   **Action:** Erase the y-axis numbers. Multiply them by 10. Redraw the Ideal Point $b'$. Draw the new line. Show it passes through the *same physical point* on the whiteboard relative to the shape, even though the coordinates changed.
  *   **Say:** "I just changed Player 2's utility scale. I did not change the solution. This requires no comparison of how much Player 1 likes apples versus how much Player 2 likes oranges. It only requires that Player 2's own scale is consistent."
  *   **Why:** Addresses Feature 2 (Scale Invariance/No Interpersonal Comparison).

  **5. Closing & Check (70–90 mins)**
  *   **Action:** The $n$-player note, the Check for Understanding, and the "What I am not explaining" list.

  ---

  ### II. The Carrying Example

  **Recommendation:** The **Asymmetric Quarter-Ellipse**.
  *   **Definition:** Let $d = (0,0)$. Let the Pareto frontier be the curve $\frac{u_1^2}{100} + \frac{u_2^2}{25} = 1$ in the first quadrant.
  *   **What it must have:**
      1.  **Asymmetry:** Player 1's max ($10$) is double Player 2's max ($5$). This forces the group to deal with unequal bargaining power.
      2.  **Strict Convexity:** The frontier must curve inward. If it is a straight line, KS and Nash coincide, hiding the distinction.
      3.  **Clear Intercepts:** The ideal point $(10, 5)$ must be obvious from the axis labels.
  *   **What it must lack:**
      1.  **Symmetry:** Do not use a circle or a symmetric set. Symmetry triggers the "fairness = equality" reflex.
      2.  **Kinks:** Do not use a polygon. Kinks invite discussions about "threats" at the vertex rather than the proportional logic.
  *   **Why disqualify the obvious candidates?**
      *   *Symmetric Split of a Dollar:* KS = Nash = 0.5/0.5. It hides the mechanism.
      *   *Linear Frontier (The Pie):* KS = Nash on linear frontiers. It suggests the solution is about dividing surplus, not scaling potential.
      *   *Unit Simplex:* Implies utilities sum to a constant, reinforcing the "fixed pie" misconception you are trying to break.

  **Instruction:** Do not solve the algebra live. Pre-calculate the intersection ($u_1 \approx 7.07, u_2 \approx 3.53$). Plot the intercepts $(10,0)$ and $(0,5)$, draw the curve freehand, draw the line from $(0,0)$ to $(10,5)$, and place the dot where the line cuts the curve. The *geometry* is the lesson, not the calculus.

  ---

  ### III. The "Fraction" Sentence Trap

  **Your Summary:** "Each side ends up with the same fraction of what it could have gotten on its own."
  **Verdict:** **Keep it, but repair it immediately.** It is the best intuitive hook, but "on its own" is misleading.

  **When to risk it:** Introduce it in **Phase 3 (The Construction)**, right after drawing the line from $d$ to $b$.
  **How to repair it:** As soon as you say it, add this clause: *"...where 'what it could have gotten' is defined as the coordinate of the Ideal Point, not a feasible outcome."*
  **The Repair Script:** "It looks like they split the pie equally. They do not. They split the *distance to the impossible* equally. Player 1 gets 70% of their impossible maximum; Player 2 gets 70% of *their* impossible maximum. The fractions match; the amounts do not."

  ---

  ### IV. Misconceptions (Anticipated & Unanticipated)

  **1. Anticipated: "The Ideal Point is achievable."**
  *   **Moment:** Phase 2 (Constructing the Anchor).
  *   **Head-off:** Before drawing $b$, ask: "Can we be at $(10, 5)$?" Wait for the "No." Then draw $b$ *outside* the shaded feasible region $S$. Physically separate it from the set.

  **2. Anticipated: "Monotonicity means adding options never hurts."**
  *   **Moment:** Phase 5 (Check for Understanding).
  *   **Head-off:** Distinguish "Set Monotonicity" (Nash) from "Individual Monotonicity" (KS). KS says: "If your maximum potential increases, your payoff increases *even if the new options are useless*." This is stronger than standard monotonicity.

  **3. Unanticipated: "The Ideal Point is a Threat."**
  *   **Moment:** Phase 2.
  *   **Why:** Economists/Law students often interpret "maximum utility" as a threat point ("I'll take everything if you don't agree").
  *   **Correction:** "A threat point is where we go if we *fail* to agree ($d$). The Ideal Point is a fantasy of what you would get if the other party *capitulated completely*. It is a measure of capacity, not aggression."

  **4. Unanticipated: "The Line Represents a Trade-off Rate."**
  *   **Moment:** Phase 3.
  *   **Why:** They will confuse the KS line with a price line or slope of the frontier.
  *   **Correction:** "The slope of this line is not a price. It is a ratio of aspirations. It tells us how we scale our demands relative to our ceilings, not how we trade utility."

  **5. Unanticipated: "Zero is the Natural Disagreement Point."**
  *   **Moment:** Phase 4 (Scale Invariance).
  *   **Why:** If you start with $d=(0,0)$, they will assume utility zero is meaningful.
  *   **Correction:** When rescaling, mention: "If $d$ were $(2,2)$, we would draw the line from $(2,2)$ to $b$. The solution is about the proportion of the *gain*, not the total level."

  ---

  ### V. The $n$-Player Question

  **Should you say it?** Yes, but only as a closing boundary condition.
  **Phrasing:** "The geometry we drew today—a line from disagreement to the ideal point—works perfectly for three or more players. However, the *axioms* we used to justify why this is the *unique* solution rely on two-player trade-offs. In larger groups, 'individual monotonicity' becomes ambiguous. So: the definition survives, the justification does not cleanly. We treat it as a two-player tool."
  **Why:** This closes the question (it doesn't invite them to solve the $n$-player axiomatization) without lying (the solution concept does exist for $n>2$).

  ---

  ### VI. Check for Understanding

  **The Question:**
  "I am going to expand the feasible set $S$. I will add new options that allow Player 1 to reach a maximum utility of $20$ instead of $10$. Player 2's maximum remains $5$. The disagreement point stays at $(0,0)$. I do not add any options that are better for Player 2 than the current solution. What happens to Player 2's payoff?"

  **Correct Answer:** Player 2's payoff **decreases**.
  **Reasoning:** The Ideal Point moves from $(10,5)$ to $(20,5)$. The line from $(0,0)$ becomes flatter (slope changes from $1/2$ to $1/4$). The intersection with the original Pareto frontier (which hasn't moved near the solution) will now occur at a point where Player 2 gets less.
  **Why this separates understanding from following:**
  *   *Following:* They might guess "Player 1 gets more, Player 2 stays same" (Monotonicity error) or "Both get more" (Pie growth error).
  *   *Understanding:* They realize the *line rotates* because the anchor $b$ moved. They see that KS rewards potential power, so increasing Player 1's potential power shifts the proportional claim in Player 1's favor, squeezing Player 2 even if the "pie" for Player 2 didn't shrink.

  ---

  ### VII. What to Say Outright You Are Not Explaining

  1.  **The Axiomatic Proof:** "We are not proving that these axioms uniquely identify this point. We are taking the construction as given and interpreting its geometry."
  2.  **Risk Aversion:** "We are assuming utilities are already von Neumann-Morgenstern expected utilities. We are not modeling how risk aversion shapes the frontier $S$ today."
  3.  **Dynamic Bargaining:** "This is a static solution. We are not modeling offers, counter-offers, or time discounting."
  4.  **Interpersonal Comparison:** "We are not solving the philosophical problem of comparing utility across persons. We are showing how this solution bypasses the need to do so."
