answer: |-
  The Guild of Salt-Weighers kept their accounts on hemp cords, each strung with three beads of fired clay. The beads came in three colors: White, Ochre, and Black. The cords hung from iron hooks in the counting room, one for each merchant. The rule of the Step was simple and known to every apprentice: to record an increase of one unit, you moved the lowest bead to the next color in the sequence—White to Ochre, Ochre to Black, Black to White. If the lowest bead wrapped from Black back to White, you also stepped the middle bead. If the middle wrapped, you stepped the top. The lowest bead was defined as the one closest to the floor. The top was the one closest to the hook.

  Master Torin had taught this rule for forty years. He believed the floor was the only honest anchor; gravity never lied, whereas a knot could be tied anywhere. Sela, his newest apprentice, had come from the rope-makers, where the tassel end was always the end, regardless of how the line was hung. She had been with the Guild for three months, long enough to know the colors, short enough to still look at the knot before she looked at the ground.

  It happened on a Tuesday, during the intake from the southern mines. The iron hook for Merchant Vane's cord had corroded through. As Torin reached to verify the count, the hook snapped. The cord fell. Torin caught the loop end—the top—before it hit the dust. Sela, reflexively, caught the tassel end—the bottom—to steady it. For a moment, the cord hung between them, inverted. The tassel was in Sela's hand, higher than the loop in Torin's.

  "Record the intake," Torin said, his eyes on the ledger. "Vane delivers five sacks."

  The cord currently read White-White-Black. Five sacks meant five steps. But they only needed to record the new total, which required stepping the cord from its previous state. The previous state was White-White-White. Five steps would bring it to White-Ochre-Black. Torin expected Sela to set it to that.

  Sela held the tassel. To her, the bead nearest the tassel was the Lead, the first to move. In her hand, that was the top bead physically, though formally it was the Bottom. She looked at the bead near her thumb. It was Black. She needed to advance the count.

  She twisted the Black bead to White. Because it wrapped, she twisted the middle bead from White to Ochre. She left the top bead (the loop end) as White. She hung the cord on a spare peg.

  Torin looked up from the ledger. He saw the cord: White-Ochre-White.

  He frowned. He did the math in his head. The old count was zero (White-White-White). Five sacks should make five. One step: White-White-Ochre. Two: White-White-Black. Three: White-Ochre-White. Four: White-Ochre-Ochre. Five: White-Ochre-Black.

  "This is wrong," Torin said. He pointed to the bottom bead, the one near the floor. It was White. It should be Black.

  "I stepped the Lead," Sela said.

  "The Lead is the lowest bead," Torin said. "The one near the floor."

  "The Lead is the tassel end," Sela replied. "The cord knows its own end. The floor is just where we stand."

  Torin took the cord down. He held it by the loop. The tassel hung down. The bead near the floor was White. The bead near the tassel was White. The middle was Ochre.

  "When you held it," Torin said, "the tassel was up. You stepped the bead near your hand."

  "I stepped the Lead," Sela said. "If the hook breaks, does the count vanish? The cord must hold the number even if the room falls down."

  "The count is for the Guild," Torin said. "The Guild stands on the floor. If the bead is near the ceiling, it is not the lowest. You have cost Vane two sacks of salt."

  "He has not lost salt," Sela said. "He has lost a convention."

  Torin rubbed the bead between his thumb and forefinger. It was smooth clay. It did not care where it hung. But the ledger cared. The ledger required that White-Ochre-White meant three, not five. If Sela's method stood, then every cord in the room would need to be marked with a tag saying *This End Down*, or else a broken hook would rewrite the merchants' fortunes. If Torin's method stood, then a cord hung from a rafter instead of a hook would read backwards.

  "The rule says lowest," Torin said.

  "The rule implies anchor," Sela said. "You taught me the Step. You did not teach me the Floor."

  Torin looked at the cord. He looked at Sela. He saw that she was not confused. She was consistent. If he let her continue, he would have to amend the Rule of the Step to specify *gravity-defined lowest*. If he dismissed her, he admitted that the Rule had been vague enough to allow her reading.

  "Rewrite it," Torin said.

  "It is already written," Sela said. She touched the tassel. "In the string."

  Torin hung the cord back on the spare peg. It swung slightly. The bottom bead settled near the floor. It was White. The ledger said it should be Black. The difference was two sacks of salt, roughly the price of Sela's apprenticeship, or roughly the cost of re-stringing the entire counting room with tagged cords.

  "The floor is the truth," Torin said, though he did not look at her.

  "The knot is the truth," Sela said, though she did not look at him.

  Torin picked up the quill. He dipped it in the ink. He hovered over the ledger column for Vane. He could write *Three* and correct the cord, or write *Five* and correct the rule. The ink waited on the nib, dark and fluid. Outside, the bells of the market rang the hour, and the cords on the wall swung gently in the draft from the open door, their tassels trembling, their beads clicking softly against one another like teeth.
