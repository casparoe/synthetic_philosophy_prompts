answer: |-
  **FINAL EXAMINATION**
  **Course:** Punishment and the Ethics of Killing
  **Time Allowed:** 90 Minutes
  **Total Marks:** 25

  **INSTRUCTIONS:**
  Answer the following question. Your response should be structured as a coherent essay. You are not required to cite primary texts, but you must demonstrate precise engagement with the conceptual framework established in this seminar.

  **QUESTION:**

  In this seminar, we reconstructed Albert Camus's argument against capital punishment as resting on three distinct planks: (1) the **Premeditation Plank** (the unique horror of the waiting period); (2) the **Standing Plank** (the illegitimacy of a secular state pronouncing absolute judgment from a position of absolute innocence); and (3) the **Fallibility Plank** (the irreversibility of death given human error). We also noted Camus's willingness to countenance a self-administered lethal injection as a preferable alternative to the guillotine, and his characterization of life labor as a penalty harsher than death.

  Consider two hypothetical regimes:
  1.  **The Sealed Verdict:** A state retains capital punishment but eliminates the waiting period (execution is immediate and unwarned), guarantees infallible guilt (corroborated confession and physical evidence), and utilizes a painless method. The execution is private; only the fact of the sentence is published.
  2.  **The Token Execution:** A state executes exactly one person per decade, selected by public lottery from among those convicted of the gravest crimes. The lottery is announced in advance; the execution is a public ceremony.

  Write an essay that addresses the following four points:
  1.  Explain why the "familiar two-step" (cruelty and deterrence) mislocates Camus's objection, utilizing his stance on self-administered injection and life labor.
  2.  Analyze the **Sealed Verdict** regime. Which of Camus's three planks survives this regime? Does this regime refute Camus or illustrate his deeper objection regarding the "grammar" of judgment? Address the retributivist reply that desert renders the state's standing irrelevant.
  3.  Determine whether the **Fallibility Plank** is contingent (based on actual error rates) or conceptual (based on the limits of human epistemology). What does this determination imply for Camus's preferred maximum penalty?
  4.  Compare the **Token Execution** to the **Sealed Verdict**. Which fares worse against Camus's case, and what does the lottery mechanism reveal about the expressive function of the penalty?

  ***

  **MODEL ANSWER**

  The familiar abolitionist argument—that the death penalty is too cruel to be civilized and too ineffective to deter—fails to capture the moral core of Camus's position. If Camus's objection were merely about physical suffering, he would not have entertained the possibility of a self-administered lethal injection. By allowing the condemned to pull the lever themselves, the state removes the sadism of the executioner, yet Camus implies this remains insufficient. Furthermore, his proposal of life labor as a maximum penalty clarifies that he is not seeking a comfortable alternative; life labor is intended to be harsher than death. His objection is not to the severity of the punishment, but to the *structure* of the killing. The wrong lies in the state assuming a power that dissolves the human relationship between judge and judged.

  When we apply this to the Sealed Verdict regime, the Premeditation and Fallibility planks are ostensibly neutralized. There is no waiting period to torture the psyche, and the stipulation of infallible guilt removes the risk of executing the innocent. Consequently, the argument rests entirely on the Standing Plank. The Sealed Verdict does not refute Camus; it crystallizes his deepest objection. By engineering a process of perfect certainty and immediate execution, the state attempts to mimic divine judgment without the divine grammar. In a pious age, the condemned was handed to God, retaining the possibility of atonement. In the Sealed Verdict, the secular state declares the offender irremediable and disposes of them without the possibility of appeal or spiritual reconciliation. This is a fantasy of divine authority.

  A retributivist might object that if the murderer objectively deserves death, the state's metaphysical standing is irrelevant; justice requires the debt be paid regardless of who collects it. However, Camus's point is that in a secular world, no human institution possesses the epistemic or moral authority to declare a life "finished." To kill is to close the future absolutely. Only a being outside of time can justify closing a human future. Therefore, the state's lack of standing is not a procedural error but a category mistake. The Sealed Verdict illustrates that even a "perfect" execution is an act of usurpation.

  This leads to the nature of the Fallibility Plank. If Camus's objection relied solely on the contingent fact that courts sometimes make mistakes, the Sealed Verdict (which stipulates perfect evidence) would satisfy him. Since the Standing Plank suggests he would still object, the Fallibility Plank must be understood conceptually. It is not merely that courts *do* err, but that no empirical procedure can deliver the metaphysical certainty required to justify an irreversible act. Human judgment is inherently temporal and revisable; death is not. This conceptual limitation validates Camus's preferred maximum penalty of life labor. Unlike death, life labor leaves the future open. It allows for the possibility of error to be corrected, or for the condemned to choose death themselves, thereby retaining agency. It respects the limits of human judgment by refusing to close the book on a life.

  Finally, the Token Execution regime fares significantly worse against Camus's case than the Sealed Verdict. While the Sealed Verdict attempts to hide the violence of the state within a bureaucratic black box, the Token Execution dramatizes it. The lottery mechanism transforms the penalty from a specific judgment on guilt into a generalized terror. By selecting one person from a pool of the guilty via chance, the state admits it cannot distinguish the most deserving, or chooses not to. The expressive function here shifts from retributive justice to sovereign power. It expresses that the state holds the power of life and death over the population as a whole, using the one as a warning to the many. The Sealed Verdict is a quiet usurpation of God; the Token Execution is a public assertion of tyranny. Both fail the Standing Plank, but the Token Execution adds the horror of arbitrariness to the horror of absolute judgment, making it the more profound violation of the human condition Camus seeks to protect.

  ***

  **MARKING SCHEME (25 MARKS)**

  **A. Mislocation of the Objection (5 Marks)**
  *   **5:** Clearly explains that Camus's objection is structural/ontological, not sensory. Uses the self-administered injection point to show pain is not the primary variable. Uses life labor to show severity is not the primary variable.
  *   **3-4:** Identifies that cruelty is not the main point but fails to effectively use the injection/life labor examples to prove it.
  *   **0-2:** Treats Camus as a standard humanitarian abolitionist focused on pain or suffering.

  **B. The Sealed Verdict & The Standing Plank (7 Marks)**
  *   **6-7:** Identifies Standing as the surviving plank. Articulates the "divine fantasy" argument (state claiming absolute innocence/authority without divine grammar). Engages with the retributivist reply (desert vs. authority) and explains why Camus rejects the state's capacity to declare irremediability.
  *   **3-5:** Identifies Standing but treats it as a procedural complaint. Fails to engage with the retributivist reply or the "grammar of judgment" concept.
  *   **0-2:** Claims Sealed Verdict refutes Camus because it solves fallibility/premeditation. Confuses Standing with deterrence.

  **C. Fallibility: Contingent vs. Conceptual (5 Marks)**
  *   **5:** Correctly identifies the plank as conceptual (epistemic limits of human judgment vs. irreversibility). Explains why this necessitates a reversible maximum penalty (life labor) that preserves agency/future.
  *   **3-4:** Identifies it as contingent (courts make mistakes) but fails to link this to the justification for life labor.
  *   **0-2:** Treats fallibility as purely statistical.

  **D. Token Execution & Expressive Function (5 Marks)**
  *   **5:** Correctly argues Token Execution is worse. Identifies the lottery as expressing sovereign terror/generalized guilt rather than specific justice. Contrasts the "hidden" violence of Sealed Verdict with the "spectacle" of Token.
  *   **3-4:** Argues Token is worse but focuses on fairness of lottery rather than expressive function.
  *   **0-2:** Argues Sealed Verdict is worse (e.g., because it is secretive) without addressing the expressive function of the lottery.

  **E. Coherence and Style (3 Marks)**
  *   **3:** Essay flows logically; arguments build on one another; precise philosophical register.
  *   **2:** Understandable but disjointed.
  *   **0-1:** Disorganized or difficult to follow.

  **SPECIFIC ERRORS (MANDATORY DEDUCTIONS)**
  *   **The Cruelty Error:** If the student argues Camus's primary objection is physical pain or the brutality of the guillotine, cap at **10 marks** total.
  *   **The Standing Error:** If the student treats the Standing Plank as a claim about deterrence or conflates it with the Fallibility Plank, deduct **5 marks**.
  *   **The Beccaria Conflation:** If the student relies primarily on Beccaria's utility arguments rather than the Camus framework provided in the prompt, deduct **5 marks**.

  **GRADE BOUNDARIES**
  *   **A (20-25):** Hits all four moves with nuance. Specifically handles the retributivist objection and the conceptual nature of fallibility.
  *   **B (15-19):** Hits the four moves but treats them mechanically. May miss the "divine grammar" nuance or the specific expressive function of the lottery.
  *   **C (10-14):** Addresses the hypotheticals but reverts to standard cruelty/deterrence arguments.
  *   **D/F (0-9):** Fails to engage with the provided framework or hypotheticals.
