      *   *Formula:* Maximize $\sum (Weight_{harm} \times Person)$.
      *   *Constraints:* Do not violate rights (d), honor special duties (c).
      *   *Threshold:* Minor harms don't aggregate to override life (e).

      *Refining the Principle for Precision:* Let's call it the **Weighted Priority Principle with Side Constraints**.
      1.  **Baseline:** Every individual has a moral claim proportional to the severity of their predicament.
      2.  **Aggregation:** Claims aggregate *unless* overridden by constraints or thresholds.
      3.  **Severity Threshold:** There is a lexical (or near-lexical) priority for preventing catastrophic harm (death) over minor harm (headaches).
      4.  **Agent-Relative Prerogatives:** You may prioritize special relations (brother).
