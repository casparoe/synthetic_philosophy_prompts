  3.  **Evaluate the User's Tentative Principle:**
      *   *Principle:* Symmetrical harms $\rightarrow$ count numbers. Asymmetrical harms $\rightarrow$ save worse off.
      *   *Problem:* As the user noted, this creates a "cliff." If 5 lose a leg + a toe, does the 1 die still win? Also, it doesn't easily account for (d) (doing/allowing) or (c) (special relationships) without extra clauses.
      *   *Better Approach:* A **Weighted Aggregation Principle with Thresholds and Constraints**. This is essentially a sophisticated form of Prioritarianism or Moderate Deontology.

