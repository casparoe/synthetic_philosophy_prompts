  ### Decision Procedure for Population-Changing Proposals

  **Purpose:** To generate a ranked list of proposals for Board voting within a three-day window, adhering to the mandate to maximize total wellbeing while isolating ethical trade-offs that require Chair intervention.

  **Constraints:** 3 days per proposal; 1 analyst; no external consultants.
  **Mandate:** Maximize discounted total wellbeing (including future people).
  **Values Boundary:** The Chair decides questions of *value* (thresholds, trade-off rules); the Analyst decides questions of *measurement* (counts, scores, calculations).

  ---

  #### Step 1: Population Mapping (Measurement)
  *   **Action:** Define two sets: $N_{base}$ (people existing in the baseline future) and $N_{prop}$ (people existing if the proposal is funded).
  *   **Evidence:** Demographic models, project reach estimates, counterfactual mortality/fertility rates.
  *   **Sufficiency:** Aggregate counts are sufficient; individual identities are not required.
  *   **Distinction to Drop:** The Non-Identity Problem. Do not attempt to track *which* specific souls exist. Treat population as aggregate slots with wellbeing scores.
  *   **Distinction to Keep:** **Overlap.** Identify the subset $N_{overlap}$ (people who exist in both scenarios). This is crucial for the Harm Check.

  #### Step 2: The Harm Check (Measurement → Values Flag)
  *   **Action:** Compare average wellbeing ($W$) for $N_{overlap}$ in Baseline vs. Proposal.
  *   **Evidence:** Household survey projections, health outcome models.
  *   **Rule:**
      *   If $W_{overlap, prop} < W_{overlap, base}$: **Flag for Chair.** This is a Pareto deterioration. The metric can count it, but the Chair must approve harming identifiable people for the sake of total sum.
      *   If $W_{overlap, prop} \ge W_{overlap, base}$: Proceed.
  *   **Time Cost:** 0.5 days.

  #### Step 3: The 'Worth Living' Threshold (Values → Measurement)
  *   **Action:** Apply a Critical Level ($c$) to all wellbeing scores.
  *   **Values Input:** The Chair must pre-approve a "Decent Life" threshold $c$ (e.g., capability index score of 40/100). Lives below $c$ are not "development successes."
  *   **Measurement:** Calculate Net Wellbeing per person: $w_{net} = w_{raw} - c$.
      *   If $w_{raw} < c$, $w_{net}$ is negative (a burden on the fund's mission).
      *   If $w_{raw} > c$, $w_{net}$ is positive.
  *   **Rationale:** This satisfies the mandate to count future people but avoids counting "mere existence" as a positive good. It operationalizes "doing good" as "creating flourishing," not just "creating people."
  *   **Time Cost:** 0.5 days (assuming $c$ is pre-set).

  #### Step 4: Aggregation and Discounting (Measurement)
  *   **Action:** Calculate **Total Net Wellbeing (TNW)**.
      *   $TNW = \sum (w_{net} \times \text{discount factor})$.
  *   **Evidence:** Standard economic discount rates (as per Fund policy).
  *   **Time Cost:** 0.5 days.

  #### Step 5: The 'Repugnance' Screen (Measurement → Values Flag)
  *   **Action:** Compare the top-ranked proposal against the runner-up.
  *   **Rule:** Trigger a **Values Flag** if:
      1.  Proposal A has higher TNW than Proposal B.
      2.  Proposal A has significantly lower Average Net Wellbeing than Proposal B.
      3.  Proposal A's win is driven primarily by population volume ($N_{prop}$) rather than quality ($w_{net}$).
  *   **Evidence:** Sensitivity analysis showing TNW collapses if population growth assumptions drop by 10%.
  *   **Meaning:** This identifies the "Repugnant Conclusion." It tells the Chair: "This wins on math, but only by trading quality for quantity."
  *   **Time Cost:** 0.5 days.

  #### Step 6: Ranking and Recommendation (Synthesis)
  *   **Action:** Generate the ordered list.
  *   **Format:**
      *   **Standard:** Proposal Name | TNW Score | Rank.
      *   **Flagged:** Proposal Name | TNW Score | Rank (Provisional) | **VALUES REVIEW REQUIRED**.
  *   **Cyclic Comparisons:** If Proposal A > B > C > A (due to different metrics), break the cycle using **Average Net Wellbeing** as the tie-breaker. This prioritizes quality when totals are ambiguous.
  *   **Time Cost:** 0.5 days.
  *   **Buffer:** 0.5 days for memo writing and review.

  ---

  ### Distinctions: Keep vs. Drop

  | Distinction | Decision | Reason |
  | :--- | :--- | :--- |
  | **Existing vs. Future People** | **Keep** | Required for Harm Check (Step 2). Existing people have stronger claims. |
  | **Lives Above vs. Below Threshold** | **Keep** | Required to avoid counting suffering/existence as "good" (Step 3). |
  | **Total vs. Average Wellbeing** | **Keep** | Required for Repugnance Screen (Step 5). |
  | **Non-Identity (Who exists)** | **Drop** | Too philosophically complex for 3 days. Treat as aggregate slots. |
  | **Cardinal vs. Ordinal Wellbeing** | **Drop** | Use cardinal scores for calculation; ordinal for ranking. |
  | **Person-Affecting vs. Impersonal** | **Drop** | The mandate requires Impersonal (Total), but Step 2 mitigates Person-Affecting concerns. |

  ### Failure Modes and Fixes

  1.  **Misfire:** The Critical Level ($c$) is set too low.
      *   *Result:* The procedure still yields "obscene" results (Case 2 wins).
      *   *Fix:* The Repugnance Screen (Step 5) catches this. It forces a Values Flag even if the math clears.
  2.  **Misfire:** Population estimates are highly uncertain.
      *   *Result:* TNW is volatile.
      *   *Fix:* Run Step 5 sensitivity analysis. If rank order flips with <10% population change, Flag for Chair as "Measurement Risk."
  3.  **Cyclic Comparisons:** A beats B on Total, B beats C on Average, C beats A on Harm.
      *   *Fix:* **Lexical Priority.** 1. No Harm to Overlap. 2. Pass Repugnance Screen. 3. Maximize TNW. 4. Maximize Average.

  ---

  ### Application to Proposals

  I will now run the procedure on the three cases provided.

  #### Case 1: Mortality Programme
  *   **Profile:** Adds large number of future people. Lives "comfortably worth living." Lowers average. No one worse off.
  *   **Step 1 (Map):** $N_{prop} > N_{base}$.
  *   **Step 2 (Harm):** $N_{overlap}$ is not worse off. **Pass.**
  *   **Step 3 (Threshold):** Lives are "comfortably worth living" ($w \gg c$). **Positive Net Wellbeing.**
  *   **Step 4 (Aggregation):** TNW increases significantly due to volume of positive lives.
  *   **Step 5 (Repugnance):** Average drops, but added lives are *high quality* ("comfortably worth living"), not "barely worth living." The trade-off is Quality for Quantity, but the Quantity is *Good Quantity*.
  *   **Result:** **No Values Flag.**
  *   **Recommendation:** **Fund.** Rank based on TNW.
  *   **Memo Note:** "Average wellbeing dilutes slightly due to population growth, but Total Net Wellbeing increases substantially. No ethical flags triggered."

  #### Case 2: Subsistence vs. High Standard
  *   **Profile:**
      *   Option A (Subsistence): Very large population ($N_{huge}$), lives "only just worth living" ($w \approx c$).
      *   Option B (High Standard): Thin population ($N_{small}$), high standard ($w \gg c$).
      *   Cost is the same.
  *   **Step 1 (Map):** $N_A \gg N_B$.
  *   **Step 2 (Harm):** No overlap harm (different future populations). **Pass.**
  *   **Step 3 (Threshold):** Option A lives are "just worth living" ($w_{net} \approx 0$). Option B lives are high ($w_{net} \gg 0$).
  *   **Step 4 (Aggregation):**
      *   $TNW_A = N_{huge} \times \text{small positive}$.
      *   $TNW_B = N_{small} \times \text{large positive}$.
      *   *Scenario:* If the mandate is strict Classical Total, $TNW_A > TNW_B$.
  *   **Step 5 (Repugnance):**
      *   Does A have higher TNW? **Yes** (assuming classical sum).
      *   Does A have lower Average? **Yes.**
      *   Is the win driven by volume? **Yes.**
      *   Are lives near threshold? **Yes.**
      *   **Trigger:** **VALUES FLAG.**
  *   **Result:** **Hand to Chair.**
  *   **Recommendation:** The procedure does **not** recommend (2). It identifies (2) as a "Repugnant Conclusion" case where the metric conflicts with the Fund's mission of flourishing.
  *   **Memo Instruction:**
      > "Proposal 2 ranks highest on raw Total Net Wellbeing due to population scale. However, it triggers the Repugnance Screen (Step 5): it achieves this score by maximizing headcount at the minimum threshold of 'worth living,' whereas Proposal 3 creates fewer but significantly flourishing lives. This is a **Values Question**. The metric favors 2; the mission likely favors 3. Chair sign-off required to approve a ranking that prioritizes quantity of existence over quality of life."

      *(Note: If the Chair insists on the raw metric despite the flag, you must recommend (2). See below.)*

  #### Case 3: Schooling and Family Planning
  *   **Profile:** Raises living standards ($w \uparrow$), reduces future people ($N \downarrow$).
  *   **Step 1 (Map):** $N_{prop} < N_{base}$.
  *   **Step 2 (Harm):** Existing people (parents/children reached) are better off. Future people who do not exist cannot be harmed (per mandate). **Pass.**
  *   **Step 3 (Threshold):** Lives are high standard ($w \gg c$).
  *   **Step 4 (Aggregation):** TNW depends on whether the gain in $w_{net}$ outweighs the loss in $N$. Usually, in development, quality gains outweigh quantity losses.
  *   **Step 5 (Repugnance):** Average increases. Total may increase or decrease. If Total increases, no flag. If Total decreases but Average increases significantly, Flag as "Efficiency vs. Scale" (less severe than Case 2).
  *   **Result:** **Likely Fund.**
  *   **Recommendation:** Rank based on TNW. If TNW is lower than a "Mass Subsistence" option, apply Step 5 Flag.

  ---

  ### Instruction for Case 2: If the Procedure Recommends (2)

  *Scenario:* The Chair reviews your Flag and replies: "The mandate is Total Wellbeing. Do not second-guess the math. Rank them."

  In this specific instance, the procedure forces you to recommend the "obscene" outcome because the Board has resolved the Values Question in favor of Classical Utilitarianism. You must comply, but you must document the ethical cost to protect the Fund's reputation and your own professional integrity.

  **How to write the memo:**

  1.  **The Headline:** Be explicit. "Recommendation: Fund Proposal 2 (Subsistence Scale)."
  2.  **The Score:** Present the TNW score clearly.
