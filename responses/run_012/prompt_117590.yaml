  4.  **The Comparison:** Explicitly state: "Proposal 3 (High Standard) yields higher average wellbeing and deeper individual flourishing, but lower aggregate score."
  5.  **The Sign-off:** Ensure the Chair's signature is on the page next to the "Ethical Risk Assessment."

  **Why this approach?**
  It satisfies the Board's constraint (you used the metric), the Trustee's concern (you flagged the obscenity), and your professional duty (you did not hide the trade-off). It turns the "obscene" result from an analyst error into a deliberate Board policy choice.
