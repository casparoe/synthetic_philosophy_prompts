      *   *Check:* Did I address the viral infection point? *Correction:* The text says "mild but nearly universal viral infection." Naturalists argue that if it impairs function relative to species design, it's a disease, even if everyone has it (e.g., dental caries in some populations). The text claims naturalism fails here because it relies on *statistics*. I need to clarify that sophisticated naturalism relies on *functional design*, not just raw statistics.
