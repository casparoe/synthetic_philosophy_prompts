answer: |-
  # Specification: Core-Cognition Analogy Engine

  **Document Purpose:** To define the necessary conditions for a computational or cognitive theory to qualify as an explanation of analogy-making as the *fundamental engine of cognition*, rather than a high-level reasoning add-on.

  **Scope:** This specification applies to any system claiming to implement the Hofstadter/Sander research programme. Failure to meet any "Non-Negotiable" requirement disqualifies the account from this specific research programme, though it may remain valid as a theory of peripheral reasoning.

  ---

  ## 1. Requirement: Dynamic Representation Construction
  **Statement:** The system shall not accept pre-parsed, fixed-feature inputs. The identification of relevant features, objects, and relations within a situation must be an *output* of the analogical process, not an input to it.
  **Motivation:**
  *   **Novice/Expert Sorting:** Novices and experts see the same physics problem but group it differently (surface features vs. deep principles). If the input representation were fixed (e.g., "contains pulley"), both would group it the same way. The theory must explain how the *seeing* changes, not just the matching.
  *   **No Circularity:** If the system assumes the world is already parsed into "objects" and "relations," it presupposes the perceptual work that analogy is supposed to explain.
  **Binding Level:** **Non-Negotiable.**
  **Implication:** The system cannot operate on fixed vectors, static semantic nets, or pre-defined slots. It must include a mechanism for "slippage" or re-description of the input stream itself.

  ## 2. Requirement: Phenomenological Unification (Immediacy vs. Deliberation)
  **Statement:** The system shall use a single underlying mechanism to account for both immediate, unconscious recognition (e.g., reading a letter, seeing a friend) and deliberate, slow analogical reasoning (e.g., comparing an economy to an ecosystem).
  **Motivation:**
  *   **Letter/Friend Recognition:** Recognizing a letter in a new typeface feels instantaneous, not like a comparison. If analogy is the core of cognition, this "perception" must be a rapid analogical act.
  *   **Long-Lived Frameworks:** Conceptual metaphors (e.g., "Brain as Computer") constrain thinking for decades without conscious comparison.
  *   **Ordinary Speech:** Phrases like "deadline creeps" are processed instantly. A theory that requires a deliberate "mapping stage" for these fails to capture the saturation of analogy in ordinary thought.
  **Binding Level:** **Non-Negotiable.**
  **Implication:** The theory cannot have a "perception module" that feeds a separate "analogy module." Perception *is* the analogy module running at high speed/high familiarity. Distinctions between "metaphor," "categorization," and "analogy" must be differences in degree (depth/complexity of mapping), not kind.

  ## 3. Requirement: Separation of Aptness and Truth (Normative/Descriptive Split)
  **Statement:** The system shall distinguish between the *psychological compellingness* of an analogy (why it is made) and the *validity* of the inferences drawn from it (whether it works). It must account for why compelling analogies can lead to false predictions.
  **Motivation:**
  *   **Second Language Bugs:** A learner maps their native language structure to a new one. This is psychologically compelling and fast (productive competence) but produces subtle errors (misleading conventions). One mechanism explains both the speed and the bug.
  *   **Advertising/Propaganda:** A fallacious analogy can be cognitively gripping. A descriptive theory of cognition must explain why the mind accepts it; a normative theory must explain why it fails.
  *   **Epidemic vs. Bubble:** Two analysts see the same curve. Both analogies fit the data. The theory must allow for multiple valid mappings that license different interventions, without declaring one "the true match" solely based on data fit.
  **Binding Level:** **Non-Negotiable.**
  **Implication:** The system cannot define "good analogy" solely as "successful prediction." It must model the *generation* of the analogy separately from the *verification* of its consequences.

  ## 4. Requirement: Emergent Similarity (No Pre-Given Metric)
  **Statement:** The system shall not utilize a pre-defined similarity metric (e.g., Euclidean distance, cosine similarity, feature overlap count) to drive the mapping process. Similarity between situations must be a *result* of the mapping, not the criterion for selecting it.
  **Motivation:**
  *   **Gradedness:** Some analogies "click" and others feel "forced." If similarity were a pre-existing metric, the system would just pick the highest score.
  *   **Circularity:** If you use a similarity metric to find analogies, you have not explained analogy; you have explained how to query a database of similarities. The "click" comes from the structural alignment creating the similarity, not the other way around.
  *   **Epidemic vs. Bubble:** The data points are identical. A pre-given metric based on data fit cannot distinguish the two interpretations. The similarity arises from the *conceptual framework* applied, not the raw data.
  **Binding Level:** **Non-Negotiable.**
  **Implication:** Vector space models, clustering algorithms, and any system relying on static distance functions as the primary engine are disqualified. Similarity must be constructed relationally.

  ## 5. Requirement: Contextual Fluidity
  **Statement:** The system shall allow the same stimulus to map to different targets depending on the current goal, context, or active concepts, without requiring structural changes to the stored knowledge.
  **Motivation:**
  *   **Epidemic Curve:** The same curve maps to "Contagion" or "Bubble" depending on the analyst's background and goal (public health vs. finance).
  *   **Second Language:** The mapping from L1 to L2 is useful for syntax but harmful for idioms. The system must be able to toggle the mapping's applicability based on context.
  **Binding Level:** **Non-Negotiable.**
  **Implication:** Retrieval cannot be purely content-addressable based on static features. The "query" itself must be fluid, influenced by the system's current state.

  ## 6. Requirement: Scalability of Scope
  **Statement:** The system shall not require distinct architectural modules for "low-level perception" (features) and "high-level reasoning" (relations).
  **Motivation:**
  *   **Unification:** If the theory claims analogy is the *core* of cognition, it cannot offload the hard work of feature detection to a separate "vision system" that is not analogical.
  *   **Economy as Ecosystem:** This is a high-level theory that functions like a low-level perception (it feels obvious to proponents). The mechanism that sees a "chair" must be the same as the mechanism that sees a "market."
  **Binding Level:** **Preference (Strong).**
  *Note:* While logically possible to have a hybrid system, doing so violates the spirit of the "core engine" claim. A theory that requires a non-analogical front-end is a theory of analogy-as-reasoning, not analogy-as-cognition.

  ---

  ## Analysis of Constraints and Tensions

  ### Are any requirements jointly unsatisfiable?
  **No, but there is a critical architectural tension.**
  Requirements 1 (**Dynamic Representation**) and 2 (**Immediacy**) create a severe engineering bottleneck known as the *Stability-Plasticity Dilemma*.
  *   To satisfy **Req 1**, the system must be plastic: it must re-parse inputs on the fly (e.g., seeing a pulley not as a "wheel" but as a "force multiplier"). This is computationally expensive and slow.
  *   To satisfy **Req 2**, the system must be stable/fast: recognizing a letter or a friend must happen in milliseconds.
  *   **Resolution:** A valid theory must explain how *past* analogical mappings become compiled into *immediate* perceptions (learning/caching) without freezing the system into fixed features (which would violate Req 1). If a theory solves speed by fixing features, it fails Req 1. If it solves flexibility by recomputing everything, it fails Req 2.

  ### The "Killer" Requirement
  **Requirement 4 (Emergent Similarity)** does the most to rule out popular ways of theorizing.
  *   **Why:** The dominant paradigm in modern cognitive modeling and AI (Vector Space Models, Neural Embeddings, Semantic Networks) relies fundamentally on the premise that items have representations in a shared space where "distance" equals "similarity."
  *   **Impact:** This requirement invalidates any approach that calculates similarity *before* mapping. It rules out standard machine learning classifiers, standard information retrieval, and classical "Structure Mapping" engines that assume pre-defined relational predicates. It forces the theory to posit a process where the *alignment itself creates the sense of similarity*, which is a much harder computational problem to specify.

  ### Classification of Approaches Ruled Out
  1.  **Classical Symbolic AI:** Ruled out by **Req 1**. They assume inputs are already symbolized (parsed into objects/relations). They treat analogy as a search over fixed structures.
  2.  **Standard Connectionism / Vector Models:** Ruled out by **Req 4**. They define similarity as geometric distance in a fixed embedding space. They cannot explain how the *same* data points (Epidemic Curve) yield *different* similarities (Contagion vs. Bubble) without changing the input vector, which violates Req 1.
  3.  **Dual-Process Theories:** Ruled out by **Req 2 & 6**. Theories that posit a fast "System 1" (perception) and a slow "System 2" (analogy/reasoning) fail the claim that analogy is the *core* engine. They relegate analogy to the periphery.
  4.  **Purely Normative Accounts:** Ruled out by **Req 3**. Philosophical accounts that define what a *good* analogy is, without explaining how a *bad* but compelling one is generated, fail to describe cognition.

  ---

  ## Usage Guide for Evaluation
  When presented with a theory, run this checklist:
  1.  **Check the Input:** Does the model assume the world comes in as "objects" and "features"? **FAIL (Req 1).**
  2.  **Check the Metric:** Does the model use a distance function or feature overlap to find matches? **FAIL (Req 4).**
  3.  **Check the Speed:** Does the model distinguish between "perception" and "analogy" as different modules? **FAIL (Req 2).**
  4.  **Check the Error:** Can the model generate a compelling analogy that leads to a false prediction? If it only finds "correct" matches, it is an optimizer, not a cognitive model. **FAIL (Req 3).**

  If a theory passes these four checks, it is in the running. If it fails any, it is a theory of reasoning *using* analogy, not a theory of cognition *as* analogy.
