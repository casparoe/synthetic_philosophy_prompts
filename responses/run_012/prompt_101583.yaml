prompt: |-
  ok, my friend has this argument about consequentialist cluelessness that I'm pretty sure prooves too much, and I can't work out which step to throw out. He splits every act's consequences into the ledger -- the near-term, roughly predictable stuff -- and the ripples, the chaotic far-future stuff. His example: picking the left side of the pavement instead of the right changes who you pass, who they end up talking to, which kids get born, and so on forever.

  (1) An act is right, for the consequentialist, just in case its total expected consequences are at least as good as those of every alternative.
  (2) Every act has ledger effects and ripple effects, and the ripples of any act eventually touch everything.
  (3) So the difference between the ripple-parts of any two acts are enormous in magnitude, and we have no way of knowing its sign.
  (4) When a term can't be signed and its stakes dwarf everything in the ledger, the ledger stops mattering to the comparison.
  (5) So no two acts can be ranked against each other, and consequentialism gives no guidance about anything at all.
  (6) The same reasoning works against any theory that tells you to bring about outcomes, so no theory gives guidance.

  He thinks this refutes consequentialism. What gets me is it refutes everything: by (5) I can't even rank deliberating over not deliberating, or reading his argument over ignoring it, and his own claim that consequentialism is false turns into a coin flip too. So which step is bad, or which one is cheapest to give up if none of them is? I'd rather keep (1) than (5) if I have to pick, but I want to know what that costs me.

  Give it back to me as exactly five numbered points, a sentence or two each, no intro and no closing summary.
