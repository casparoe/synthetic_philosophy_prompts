answer: |-
  This is a sharp, predictive-processing-inflected take on shared agency. It aligns with recent "interactionist" challenges to the planning theory (Bratman, Gilbert, etc.), but you are pushing it further by making prediction *constitutive* rather than just facilitative.

  You asked for defeaters, ranked by severity, along with an assessment of falsifiability and unique predictions. Here is the breakdown.

  ### 1. Fatal Defeaters
  *These are cases where your conditions are met, but the intuition of "joint action" fails, or vice versa. If these hold, the "whole of it" claim collapses.*

  **A. The Manipulation/Coercion Case (Fatal)**
  *   **The Case:** A con artist models a victim perfectly. The victim, sensing the con but unable to escape, models the con artist to minimize loss. They engage in a transaction. Prediction is mutual, accurate, and known.
  *   **The Problem:** We do not want to say they are "acting together" in the sense relevant to shared agency. We usually distinguish *coercion/manipulation* from *cooperation*.
  *   **Why it's fatal:** Your view lacks a **goal-alignment constraint**. You rely on "coordination equilibrium," but equilibria exist in adversarial games (Nash equilibria). To rule out the con artist, you must sneak in a condition about *shared ends* or *cooperative stance*. Once you do that, prediction is no longer the "whole of it"; it's the mechanism for a prior cooperative commitment.
  *   **Confidence:** [High]

  **B. The Normative Gap: Entitlement vs. Frustration (Fatal)**
  *   **The Case:** I promise to meet you for lunch. I don't show up. You didn't build a predictive model; you *trusted* me (which is distinct from prediction; trust often suspends monitoring).
  *   **The Problem:** On your view, I wronged you because I wrecked your model. But if you weren't modeling me (because you trusted), I didn't wreck a model. Yet I still wronged you. Conversely, if I am a stranger walking in front of you and I stop abruptly, I wreck your predictive model of my gait. You are frustrated. But I haven't *wronged* you.
  *   **Why it's fatal:** "Derived normativity" struggles to distinguish between *interpersonal obligation* (Gilbert's "demand rights") and *pragmatic friction*. You need to explain why wrecking a partner's model generates a *right to rebuke*, whereas wrecking a pedestrian's model generates only *annoyance*. If the answer is "because they are a partner," you are circular. If the answer is "degree of reliance," you reduce moral obligation to cost-benefit analysis, which fails to capture the deontic force of joint commitment.
  *   **Confidence:** [High]

  ### 2. Serious Challenges
  *These require significant theoretical patching but might not destroy the view entirely.*

  **C. Developmental Psychology: The Order of Operations (Serious)**
  *   **The Finding:** Infants engage in joint attention and cooperative lifting (Warneken & Tomasello) around 14 months. Sophisticated recursive Theory of Mind (predictive modeling of beliefs) typically arrives much later (4+ years).
  *   **The Problem:** If joint action requires "accurate enough predictive models" + "knowledge that the other is doing the same," toddlers shouldn't be able to act together. They lack the cognitive architecture for the recursion you describe.
  *   **Your Move:** You must argue for a primitive, sub-personal predictive system (like predictive processing in motor control) rather than folk-psychological modeling.
  *   **Risk:** If you dilute "predictive model" to mean "motor coupling," you lose the distinction between a coupled system (two pendulums syncing) and agents acting together.
  *   **Confidence:** [Medium-High]

  **D. The Chess Story (Serious)**
  *   **The Case:** You mentioned you have a story for why Chess isn't joint action despite high prediction.
  *   **The Problem:** To distinguish Chess from Improvisation, you will almost certainly have to appeal to **telic alignment** (we are trying to achieve X together vs. I am trying to beat you).
  *   **Risk:** If the difference between Joint Action and Adversarial Interaction is *goal alignment*, then prediction is not the constitutive factor; goal alignment is. Prediction is just how we navigate the alignment (or misalignment). This demotes your view from a constitutive account to a mechanistic one.
  *   **Confidence:** [Medium]

  ### 3. Merely Awkward Consequences
  *These don't falsify the view but make it costly to maintain.*

  **E. Failed Joint Action (Awkward)**
  *   **The Case:** We intend to lift a table together. We both commit. We lift. I slip. The table drops.
  *   **Standard View:** We performed a joint action (that failed).
  *   **Your View:** Since the prediction was not "accurate enough" (I didn't predict the slip, or you didn't predict my slip), was it joint action *at the time*?
  *   **Awkwardness:** You have to say joint action is only identifiable retrospectively upon success. This makes the ontology of action unstable.
  *   **Confidence:** [High]

  **F. Animal Cognition (Awkward)**
  *   **The Case:** Wolves hunting in a pack.
  *   **The Problem:** Do they have recursive models ("I know that you know that I know...")? Likely not. Are they acting together? Yes.
  *   **Your Move:** Again, you must rely on sub-personal prediction.
  *   **Awkwardness:** This stretches the definition of "prediction" so thin it risks becoming synonymous with "causal sensitivity."
  *   **Confidence:** [Medium]

  ---

  ### 4. On Falsifiability and Derived Normativity

  **Is the move to 'derived normativity' unfalsifiable?**
  It borders on it. [Confidence: High].
  If every instance of "wronging" is explained as "wrecking a coordination equilibrium," you immunize the view against counter-examples by re-describing the equilibrium.
  *   *Example:* If I bail on our plan, you say "I was wronged." You say "No, you were just model-wrecked." If I ask, "Why does model-wrecking feel like moral betrayal?" and you say, "Because the equilibrium was deep," you are quantifying a qualitative difference.

  **Is this fatal?**
  It is not fatal *if* you embrace a naturalistic reductionism. [Confidence: Medium].
  If your goal is to demystify normativity and show it *just is* a species of coordination cost, then unfalsifiability is a feature, not a bug (like functionalism). However, if you want to preserve the *phenomenology* of obligation (that it feels distinct from mere inconvenience), this move is fatal. You cannot derive an "ought" from a "prediction error" without a bridge principle that looks suspiciously like the primitive norm you tried to eliminate.

  **Cost of Business:** The cost is that your view becomes indistinguishable from **Game Theory** with extra steps. If joint action is just a specific kind of Nash equilibrium maintained by recursive modeling, you haven't given us a theory of *shared agency*; you've given us a theory of *stable interaction*.

  ---

  ### 5. Unique Predictions (MPA vs. We-Intention Accounts)

  If your view is to be worth holding, it must diverge from Bratman/Gilbert. Here is where it does:

  1.  **Graded Jointness:** Planning theory tends to be binary (either we have the shared intention or we don't). Your view predicts joint action comes in **degrees** based on model accuracy and recursion depth.
      *   *Prediction:* We should find cases of "partial" joint action where partners are slightly out of sync but still coordinating, which standard theory would classify as failed joint action. [Confidence: High]
  2.  **The Improvisation Advantage:** Planning theory struggles to explain how joint action happens without prior plans. Your view predicts improvisation is the **paradigm**, not the edge case.
      *   *Prediction:* Neural markers of joint action should look like markers of predictive processing (error minimization), not markers of goal-representation. [Confidence: Medium]
  3.  **Normative Scaling:** On Gilbert's view, a joint commitment creates a blanket obligation. On your view, the obligation should scale with the **cost of model-rebuilding**.
      *   *Prediction:* It should be perceived as *less* wrong to bail on a partner who is highly flexible (easy to re-model) than on a rigid partner (hard to re-model), even if the commitment level was identical. Planning theory predicts the wrongness is equal (violation of commitment). [Confidence: High]

  ---

  ### 6. Assessment of the View

  **The Strongest Point:** Your handling of improvisation. Planning theories are notoriously intellectualist; they make jazz musicians look like they are signing contracts before every bar. Your view captures the fluidity of real-time coordination. [Confidence: High]

  **The Weakest Point:** The Normative Gap. Explaining *betrayal* as *prediction error* is the hardest lift. It feels like a category mistake. [Confidence: High]

  **The Point I Am Least Sure About:**
  I am least sure about the **Developmental Psychology interpretation (Point C)**. [Confidence: Low].
  *Reasoning:* The field is currently split between "Theory Theory" (kids build models) and "Interaction Theory" (kids couple directly). If Interaction Theory wins, your view (if framed as sub-personal coupling) might actually be *supported* by developmental data, not challenged. If it turns out infants *do* run recursive predictive models at a sub-personal level (as some Predictive Processing proponents argue), your defeater vanishes. I am not confident enough in the cognitive science to say definitively that infants lack the requisite predictive architecture.

  ### Summary Recommendation
  To save the view, you must concede that **Goal Alignment** is a necessary co-condition with Mutual Prediction. Prediction is the *mechanism*, but Shared Goal is the *constitutive context*. If you do this, you avoid the Chess and Manipulation defeaters. However, you must then admit that normativity might not be fully derived from prediction; it may be derived from the *volitional investment in the shared goal*, which prediction merely serves.

  If you refuse to add Goal Alignment, the Manipulation Case kills the view.
  If you refuse to address the Entitlement vs. Frustration gap, the Normativity claim collapses into pragmatism.
