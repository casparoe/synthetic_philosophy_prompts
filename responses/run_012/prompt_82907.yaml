answer: |-
  **Project Title:** The Deliberative Route Dilemma: Internalism's False Dichotomy

  **1. The Question**
  Internalist accounts of reasons rely on a "sound deliberative route" clause to bridge the gap between an agent's subjective motivational set (SMS) and normative reasons. The core question of this project is: **Does the "sound deliberative route" condition successfully distinguish internal from external reasons, or does it collapse into either an overly restrictive epistemic account or a vacuous factual account?**

  Specifically, I aim to test whether the deliberative clause can sustain a middle ground. If "correct deliberation" is constrained by the agent's actual evidence (Narrow), internalism fails to capture objective reasons (e.g., poisoned water). If "correct deliberation" is constrained only by the facts (Wide), internalism fails to exclude anything relevant to the agent's good, collapsing into externalism. I will argue that this dichotomy is exhaustive for standard internalist formulations and that preserving internalism requires a third condition: *deliberative reachability*.

  **2. Why the Going Positions Leave This Open**
  Current internalist defenses treat the "sound deliberative route" as a unified constraint. They assume that idealizing the agent's deliberation solves the ignorance problem without sacrificing the motivation constraint. However, this conflates two distinct variables: the *input* of deliberation (beliefs vs. facts) and the *processing* of deliberation (rational rules vs. cognitive capacity).

  *   **The Narrow View:** If the input is restricted to what the agent believes or has evidence for, the view respects the motivation constraint but loses normativity. It cannot explain why an agent has a reason to avoid water they falsely believe is safe.
  *   **The Wide View:** If the input includes all relevant facts, the view respects normativity but loses the motivation constraint. If every fact that satisfies an element of the SMS counts as a reason via some logical route, the requirement that the reason be *internal* becomes trivial. The SMS constraint stops doing exclusionary work.

  Existing literature attempts to split the difference by appealing to "reasonable" idealization, but fails to specify whether "reasonable" is an epistemic limit (what she could know) or a metaphysical limit (what is true). This ambiguity allows the position to shift depending on the counterexample, leaving the core mechanism undefined.

  **3. Method and Plan of Work**
  Over the semester, I will proceed in four phases to isolate the dilemma and sketch the alternative.

  *   **Phase 1: Formalizing the Dilemma (Weeks 1-4)**
      *   Define the "Narrow" and "Wide" readings of the deliberative route formally.
      *   Establish the criteria for success: A viable theory must (a) assign reasons in cases of ignorant danger (poisoned water) and (b) withhold reasons in cases of inaccessible goods (distant opportunities with no causal link).
  *   **Phase 2: Stress Testing with Cases (Weeks 5-8)**
      *   *Case A (Ignorance):* The poisoned water case. Does the Narrow view allow an inference from "I want to live" to "Don't drink this" without the fact of poison? If not, Narrow fails.
      *   *Case B (Cognitive Limit):* A complex mathematical truth that would satisfy the SMS if known, but is beyond the agent's computational capacity. Does the Wide view count this as a reason? If yes, does it violate the "could motivate" constraint?
      *   *Case C (False Belief):* An agent believes a means works, but it doesn't. Does internalism say they have a reason to do it?
  *   **Phase 3: Evaluating Internalist Responses (Weeks 9-12)**
      *   Test the "Idealized Agent" response. Does idealizing the agent's knowledge simply push the view into Externalism?
      *   Test the "Procedural Rationality" response. Does restricting the *route* (not the input) save the Narrow view?
  *   **Phase 4: Sketching Deliberative Reachability (Weeks 13-15)**
      *   Outline the third option: Reasons are relative to facts that are *deliberatively reachable*. This requires a causal/epistemic link between the agent's current state and the fact, stronger than metaphysical possibility but weaker than actual belief.
      *   Draft the conclusion: Either internalism must accept this third condition (changing its definition) or it collapses.

  **4. Expected Deliverable**
  A 20-25 page paper establishing the dilemma as fatal to standard internalist formulations and providing a preliminary defense of "deliberative reachability" as the only viable salvage operation. The paper will not fully defend the positive account but will demonstrate that the burden of proof lies on internalists to specify the input conditions of deliberation.

  **5. Failure Conditions**
  The project fails if:
  *   The Narrow view can accommodate the poisoned water case via a principled account of inferred reasons (e.g., if "reasons" include hypothetical imperatives based on false beliefs).
  *   The Wide view retains exclusionary power (i.e., if there are true facts that satisfy the SMS but still fail to be reasons due to the structure of the deliberative route, proving internalism doesn't collapse).
  *   The "Deliberative Reachability" condition turns out to be extensionally equivalent to Externalism (i.e., if "reachable" just means "true and relevant").

  **6. Scope Verdict**
  **Dissertation-sized.** Establishing the dilemma is manageable for a semester paper. However, successfully defining and defending "deliberative reachability" without collapsing into externalism or epistemic internalism is a major theoretical undertaking. It requires a full account of the epistemology of deliberation. For the semester paper, I will focus on establishing the dilemma and arguing that the third option is *necessary*, leaving the full defense of the third option for the dissertation.

  **7. Critical Assessment: The Weakest Link**
  **Most Likely Wrong:** The claim that the "Wide" reading makes internalism vacuous.
  **Why:** Internalists argue that even with full factual input, the SMS constraint still excludes facts. If I want to count stamps, the fact that water is poisoned is not a reason for me, even on the Wide view, unless I care about survival. The collapse only happens if *every* agent cares about *every* basic good.
  **What Would Change My Mind:** If I find a case where an agent has a true fact available, it satisfies their SMS, there is a logical route from SMS to action via that fact, yet internalists still deny it is a reason. If such a case exists, the "Wide" reading does not collapse, and the dilemma is false. Conversely, if the "Narrow" view can handle the poisoned water case by distinguishing between *having a reason* and *being motivated*, the pressure to find a third option diminishes.

