answer: |-
  **Scenario**

  In 1680 Oria, all technical knowledge is the collective property of the Artisan's Guild. Master Kael shares a life-saving filtration method with a plague-stricken rival city, violating his oath. Orian law defines this as theft of collective property and breach of sacred contract. Modern ethics views vital knowledge as a public good exceeding proprietary claims. Both historians agree Kael shared the method and violated the oath.

  **Analysis**

  **Verdicts:** The contextualist condemns Kael for theft and breach of duty; the presentist admires him for humanitarianism.

  **Structural Feature:** The ontology of knowledge (Collective Property vs. Public Good).

  **Removal:** If both standards treat knowledge as a public good, both historians admire the act.

  **Rigging Charge:** A defender of contextualism would argue the case is rigged because it isolates a moral conflict where present values inevitably trump past ones, ignoring that Guild secrecy maintained quality control and social stability; within the Orian system, Kael's act was genuinely destructive, not heroic.

  **Establishment of Thesis:** Yes, the case establishes that the contextualist verdict is unavailable to a historian who rejects the past society's beliefs. To genuinely condemn Kael as a *thief* rather than a *rule-breaker*, the historian must accept the Guild's ownership claim. If the historian views knowledge as inherently public, they can only report the condemnation, not inhabit it, proving that true contextualism requires ontological adoption.
