answer: |-
  Let's reason through this by testing three candidate principles against your data.

  **Candidate 1: Strict Utilitarianism.**
  *Principle:* Prevent bad outcomes whenever the cost to you is less than the benefit to them.
  *Fit:* Handles the Pond (1), Lock (2), Crowd (3), and Charity (4) perfectly.
  *Fail:* It demands the Monthly Payments (5), which you reject. It also struggles with the Dare Guy (6)—why does his fault lower my duty if the outcome (death) is the same? It also risks justifying shoving an innocent person (New Case 3) if the math works.
  *Verdict:* Too demanding, ignores autonomy and causal responsibility.

  **Candidate 2: Libertarian Non-Interference.**
  *Principle:* You have no duty to rescue unless you caused the danger or contracted to help.
  *Fit:* Handles the Kidney Sale (9) and Dare Guy (6).
  *Fail:* Collapses immediately on the Pond (1). You say you *must* save the kid. This principle says you don't.
  *Verdict:* Too weak.

  **Candidate 3: The Principle of Modest Cost Prevention.**
  *Principle:* You are required to prevent catastrophic harm to others if the cost to you is modest, unless the victim voluntarily assumed the risk or the intervention violates competent autonomy.
  *Fit:*
  *   **Catastrophic Harm/Modest Cost:** Explains Pond (1), Lock (2), Crowd (3), and Charity (4). Death outweighs a suit, a lock, or $300.
  *   **Voluntary Risk:** Explains Dare Guy (6). He assumed the risk, so the cost limit tightens; if rescue is risky for you, you're off the hook. Explains Murderer (7) too—he didn't assume drowning risk, so duty remains.
  *   **Competent Autonomy:** Explains Kidney Sale (9). He chooses the harm; you respect autonomy.
  *   **Distress Exception:** Explains Suicide (8). We treat imminent suicide as competence compromised by distress, allowing paternalism.

  **The Tension:**
  This principle fits almost everything, but it creates friction with your intuition on **Case 5 (Monthly Payments)**. If $300 is "modest" once, why isn't it "modest" monthly? The only difference is duration. If we define "modest" as "not life-altering," sustained payments might qualify as duty. Your gut says "optional," but the logic of Case 4 pushes toward "required."

  **Testing New Cases:**
  1.  **Promise to Neighbor:** The principle strengthens. You now have a *special obligation* plus the general duty. You must save the kid even at higher cost than a stranger.
  2.  **Admit Caused Problem:** If you caused the danger, the "modest cost" clause vanishes. You owe restitution. You must save them even at significant cost.
  3.  **Shove Innocent:** Forbidden. The principle prevents harm; it doesn't license violating a third party's right to safety. You cannot use an innocent as a means.

  **The Choice:**
  I could make the principle messy by adding a "duration clause" to save your Case 5 intuition. But that's ad hoc. A clean principle demands consistency. If distance doesn't matter (Case 4), temporal distance shouldn't either. The demandingness of ethics is uncomfortable, but hiding it makes the theory dishonest.

  I choose the clean principle. It preserves the core structure of rescue ethics (cost vs. harm) and respects autonomy (Kidney vs. Suicide) without arbitrary time limits. This means I must correct your view on sustained charity.

  Verdict: Adopt the Principle of Modest Cost Prevention; it mandates sustained charity, forcing you to give up the verdict that monthly payments are optional.
