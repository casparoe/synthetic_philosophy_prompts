      *   *Section 2: Transitivity.* Distinguish between *ontological* transitivity (is 'better' actually transitive?) and *methodological* transitivity (do our numbers force it to be?). The authority relies on the latter. They build a ladder; they don't find one.
      *   *Section 3: Commensurability.* Explain that QALYs demand a single currency. This rules out "sacred values."
      *   *Section 4: The Modifiers.* This is crucial. They aren't just patches; they are admissions that the single metric is insufficient. They introduce *pluralism* into a *monist* framework. This creates fragility.
      *   *Section 5: Pressure Points.* Where does this break?
          *   The "Small Steps" problem (Spectrum/Intransitivity).
          *   The "Modifier Clash" (when severity conflicts with cost-effectiveness).
