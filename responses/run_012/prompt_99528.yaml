prompt: |-
  I lead the assessment unit at a national agency that must authorise chemicals and biological products before they are sold or released, and I need a written decision procedure my case officers can run when a notification arrives. Our statute permits us to restrict a product where there are reasonable grounds for concern that it could cause serious or irreversible harm, and it states that a lack of full scientific certainty is not by itself a reason to postpone protective measures; it also requires that any restriction be proportionate and that we publish reasons a court can review. We see roughly forty notifications a year on a six-week statutory clock, with no budget for new testing and with most of the underlying studies funded by the notifier. My officers are competent scientists rather than philosophers, and my director signs the final decision.

  Write the procedure: the questions in order, what counts as a sufficient answer to each, the points at which the process terminates in a decision (including termination in refusal), and the points at which it must be handed up because the answer turns on values rather than evidence. It has to preserve whatever is genuinely defensible in the precautionary principle without collapsing into a general injunction to be careful, and it has to survive the objection that protective measures carry risks of their own, so that the principle cannot by itself select action over inaction. Where the procedure must fix a threshold — how much evidence, how much uncertainty, how much irreversibility — say so plainly and mark it as a choice rather than a finding. Note which reading of the principle each step presupposes, and flag any step that goes beyond what our statute actually requires. The case officer's version should fit on one page; the version that goes into the file can spell out the reasoning.

  Then run it on three cases: (a) a flame retardant proposed for children's mattress foam, supported by a plausible mechanism, a single small rodent study and structural similarity to a compound we already restrict, with substitutes that are themselves poorly characterised; (b) a self-replicating engineered soil microbe for nitrogen fixation, whose harms, if they materialised, would be irreversible and would cross borders, and for which the evidence is entirely model-based; (c) a drinking-water treatment that removes a suspected carcinogen but produces a better-characterised disinfection by-product.

  I will be candid about my priors: I want the procedure to come out against (b), because I think irreversibility should be decisive. If a procedure I could actually defend before a reviewing court does not get me there, I need to know that now.

  Finally, state what the procedure cannot do, and where a case officer will be tempted to use it to launder a decision that was reached on other grounds.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure and analysis:

  1.  **Analyze the Request:**

      *   **Role:** Head of Assessment Unit at a National Agency (chemicals/biological products).
      *   **Task:** Write a written decision procedure for case officers to handle notifications.
      *   **Constraints/Context:**
          *   Statute: Allow restriction on "reasonable grounds for concern" of "serious or irreversible harm."
          *   Statute: Lack of full scientific certainty $\neq$ reason to postpone (Precautionary Principle embedded).
          *   Statute: Restrictions must be proportionate.
          *   Statute: Reasons must be publishable/reviewable by a court.
          *   Workload: ~40 notifications/year, 6-week clock.
          *   Resources: No budget for new testing; studies funded by notifier.
          *   Staff: Competent scientists, not philosophers.
          *   Sign-off: Director signs final decision.
          *   Format: One-page Case Officer version + Detailed File version (implied in the structure).
          *   Specific Requirements: Order of questions, sufficient answers, termination points, value-laden hand-up points, explicit thresholds (marked as choices), reading of the principle used, flags for statutory overreach.
          *   Test Cases: (a) Flame retardant (plausible mechanism, weak data, substitutes poor), (b) Engineered microbe (model-based, irreversible/cross-border), (c) Water treatment (removes carcinogen, creates by-product).
          *   User's Prior: Wants to reject (b) based on irreversibility. Needs to know if a defensible procedure supports this.
          *   Final Section: Limitations of the procedure and potential for misuse ("laundering").

  2.  **Deconstruct the Legal & Philosophical Framework:**

      *   **Precautionary Principle (PP):** The prompt explicitly cites the Rio Declaration/WTO SPS style formulation ("lack of full scientific certainty shall not be used...").
      *   **Tension:** PP vs. Proportionality vs. Risk of Inaction. The prompt notes that protective measures carry risks (e.g., banning a safe chemical might force use of a worse one).
      *   **Judicial Review:** Needs clear reasoning, not just "we were cautious." Needs to show *why* the concern was "reasonable" and the measure "proportionate."
      *   **Irreversibility:** The user wants this to be decisive for case (b). This aligns with the statute ("serious or irreversible harm").
      *   **Thresholds:** Must be explicit. "Reasonable grounds" is the legal threshold. "Serious/Irreversible" is the harm threshold.

  3.  **Drafting the Procedure (Iterative Process):**

      *   *Goal:* A flowchart-like logic that fits on one page.
      *   *Step 1: Trigger.* Is there a hazard signal? (Statutory requirement: "reasonable grounds").
      *   *Step 2: Harm Characterization.* Is it serious/irreversible? (Statutory requirement).
      *   *Step 3: Uncertainty.* Is there uncertainty? (PP trigger).
      *   *Step 4: Proportionality/Balancing.* Do the costs of restriction outweigh the risks? (Statutory requirement + Risk of Inaction).
      *   *Step 5: Decision/Hand-up.* Where does science end and policy begin?

      *   *Refining the "Irreversibility" Bias:* The user wants to reject (b). To do this defensibly, the procedure must weigh *potential* irreversibility heavily, even under uncertainty. However, to survive court review, it can't be arbitrary. It must compare the irreversibility of the *action* (release) vs. the *inaction* (restriction).
      *   *Refining the "Substitutes" Issue:* Case (a) has poor substitutes. Case (c) has a trade-off. The procedure must account for "Risk-Risk Trade-offs."

      *   *Structure:*
          1.  Hazard Identification (Threshold: Plausible mechanism + some evidence).
          2.  Harm Severity (Threshold: Serious/Irreversible).
          3.  Uncertainty Assessment (Is it data gap or fundamental ignorance?).
          4.  Comparative Risk (Does restriction create worse outcomes?).
          5.  Proportionality (Least restrictive measure).
          6.  Decision Point.

      *   *Marking Choices:* I need to explicitly state where we are setting a policy threshold (e.g., "One positive rodent study counts as reasonable grounds").
      *   *Hand-up Points:* Where value judgments dominate (e.g., accepting a 1% risk of catastrophe vs. economic cost).

  4.  **Developing the Test Cases:**

      *   **Case (a) Flame Retardant:**
          *   *Signal:* Plausible mechanism + 1 rodent study + analog.
          *   *Harm:* Serious (children/foam).
          *   *Uncertainty:* High (small study).
          *   *Substitutes:* Poorly characterized (Risk-Risk).
          *   *Outcome:* Likely Restriction (with waiver for essential use?) OR Warning. Given the "children" aspect, PP leans strong. But substitutes are risky. *Decision:* Restrict use in children's products specifically (Proportionate).
      *   **Case (b) Engineered Microbe:**
          *   *Signal:* Model-based only.
          *   *Harm:* Irreversible + Cross-border.
          *   *Uncertainty:* High (models).
          *   *User Prior:* Reject.
          *   *Procedure Check:* Does "model-based" meet "reasonable grounds"? If the model is peer-reviewed, yes. Irreversibility is key. Cross-border adds weight.
          *   *Outcome:* Refusal/Restriction. The irreversibility tips the proportionality scale even with weak data.
      *   **Case (c) Water Treatment:**
          *   *Signal:* Known by-product.
          *   *Harm:* Trade-off (Suspected carcinogen removed vs. Known by-product added).
          *   *Uncertainty:* Low on by-product, High on removed contaminant.
          *   *Outcome:* Approval with monitoring. The "Risk of Protective Measure" (creating a known bad by-product) outweighs the "Risk of Inaction" (suspected carcinogen stays). *Wait, actually:* It removes a suspected carcinogen. If the by-product is *better characterized* but perhaps less harmful? Or more? Prompt says "better-characterised disinfection by-product." Usually, DBPs are bad. Let's assume the trade-off is the key. If the by-product is *known* and manageable, and the carcinogen is *suspected*, approval might be granted with limits.
          *   *Correction:* The prompt implies the by-product is a negative. So it's Risk vs. Risk. If the by-product is *better characterized*, we know its risk. If the carcinogen is only *suspected*, the PP usually favors acting against the suspected carcinogen. *However*, if the by-product is *known* to be harmful, we have a "Risk-Risk" trade-off. The procedure must weigh them.

  5.  **Addressing the "User Prior" on Case (b):**

      *   The user wants to reject (b) because irreversibility is decisive.
      *   *Challenge:* A court might say "Models aren't evidence."
      *   *Solution:* The procedure must define "Reasonable Grounds" to include "consensus modeling indicating catastrophic potential." This is a policy choice, not a scientific fact. I must flag this.
      *   *Statutory Check:* The statute says "serious or irreversible harm." It does not say "potential irreversible harm based on models." I need to ensure the link between "model" and "reasonable grounds" is robust enough for review.
      *   *Verdict:* Yes, a defensible procedure can get there, *provided* the threshold for "reasonable grounds" is explicitly set to include high-consequence/low-probability model outcomes where verification is impossible until too late. This is the "Precautionary" reading.

  6.  **Drafting the Content (incorporating constraints):**

      *   *One Page Limit:* Needs tight phrasing. Bullet points.
      *   *Flags:* [POLICY CHOICE], [STATUTORY +], [HAND-UP].
      *   *Termination:* Clear "Approve," "Restrict," "Refer."
      *   *Laundering Warning:* Crucial section at the end.

  7.  **Refining the Procedure Logic (Self-Correction during drafting):**

      *   *Issue:* The prompt warns against "collapsing into a general injunction to be careful."
      *   *Fix:* Step 4 must explicitly ask: "Does the restriction create greater risk?" (Risk-Risk Analysis). This prevents automatic restriction.
      *   *Issue:* "Values rather than evidence."
      *   *Fix:* Any step weighing economic cost against existential risk is a value judgment. That goes to the Director.
      *   *Issue:* Thresholds.
      *   *Fix:* Define "Reasonable Grounds" as >1 line of evidence OR 1 line + high severity.

  8.  **Final Review against User Priors:**

      *   Does it allow rejecting (b)? Yes, by weighting irreversibility heavily in the proportionality test.
      *   Is it defensible? Yes, if the "Policy Choice" on modeling is documented.
      *   Does it warn about laundering? Yes.

  9.  **Final Polish:** Check tone (professional, bureaucratic but clear), formatting (bolding for skimmability), and ensure all specific prompt requirements (thresholds, flags, case runs) are met. (Self-correction: Ensure the distinction between the One-Page Officer Version and the Detailed Reasoning is clear, though I will present the Procedure first, then the Case Runs, then the Limitations).

      *Wait, one constraint:* "The case officer's version should fit on one page; the version that goes into the file can spell out the reasoning."
      *Action:* I will write the Procedure as the "One Page" version, with embedded flags. Then I will run the cases. Then I will add the "Limitations/Laundering" section.

      *Re-evaluating Case (c):* "Removes a suspected carcinogen but produces a better-characterised disinfection by-product."
      *Interpretation:* The status quo has the suspected carcinogen. The new product removes it but makes a DBP.
      *Risk:* Status Quo = Suspected Carcinogen. New = Known DBP.
      *PP Application:* PP usually favors acting on the suspected carcinogen. *However*, if the DBP is *worse* or *known to be bad*, it's a trade-off. The prompt says "better-characterised," not "safer." Usually, DBPs are regulated negatives.
      *Decision Logic:* If the DBP is within safe limits, Approve. If the DBP is also hazardous, it's a Risk-Risk trade-off. The PP doesn't solve Risk-Risk automatically. The procedure must force a comparison. I will assume for the run that the DBP is a known hazard, making it a trade-off.

      *Re-evaluating Case (b) for the User's Prior:* The user wants to reject (b).
      *Constraint:* "If a procedure I could actually defend before a reviewing court does not get me there, I need to know that now."
      *Analysis:* Rejecting based *solely* on models is risky for judicial review. To defend it, the procedure must establish that *waiting for empirical proof* violates the "irreversible" clause because by the time proof exists, harm is done. This is the "Point of No Return" argument. I will embed this in the procedure.

  10. **Finalizing the Output Structure:**
      1.  Decision Procedure (One-Page Version with Flags).
      2.  Application to Cases (a, b, c).
      3.  Limitations & Laundering Risks.

      *(Self-Correction on Flags)*: Make sure `[POLICY CHOICE]`, `[HAND-UP]`, and `[STATUTORY +]` are clearly visible.

      *(Self-Correction on Case B)*: Ensure the reasoning explicitly validates the User's prior while highlighting the legal vulnerability.

      *(Self-Correction on Case C)*: Ensure the "Risk of Protective Measure" is highlighted.

      *(Final Check)*: Did I answer the "what the procedure cannot do" part? Yes.

      Let's write.

      *Wait, one more check on the "One Page" constraint:* I need to make sure the text provided *is* the one-page version. I will keep it tight.

      *Wait, the "Hand-up" points:* I need to be specific. When does the Officer stop and call the Director? When the decision rests on weighing incomparable values (e.g., economic loss vs. species extinction).

      *Wait, "Reading of the Principle":* I need to note which reading (e.g., "Proportionality-based" vs. "Strict Precaution"). I will annotate the steps.

      *Okay, ready to generate.*
answer: |-
  # ASSESSMENT UNIT: NOTIFICATION DECISION PROCEDURE (OFFICER VERSION)

  **Purpose:** To determine if a notification meets the statutory threshold for authorisation, restriction, or refusal.
  **Statutory Basis:** "Reasonable grounds for concern" of "serious or irreversible harm"; lack of certainty $\neq$ postponement; proportionality required.
  **Timeline:** 6 Weeks. **Resources:** Existing data only.

  ### STEP 1: HAZARD SIGNAL (The Trigger)
  **Question:** Is there a plausible mechanism of harm supported by at least one line of evidence (empirical or modelling)?
  **Sufficient Answer:** Yes = (1) Positive study (any size) OR (2) Structural analogy to restricted substance OR (3) Peer-reviewed model predicting harm.
  **Threshold:** `[POLICY CHOICE]` We treat a single small study or consensus model as "reasonable grounds." *Statute requires "grounds," not "proof."*
  **Reading:** *Evidentiary Threshold.*
  **If No:** **AUTHORISE.** (Process Terminates).
  **If Yes:** Proceed to Step 2.

  ### STEP 2: HARM SEVERITY (The Statutory Gate)
  **Question:** If the harm materialises, is it "serious or irreversible" per statute?
  **Sufficient Answer:** Yes = (1) Mortality/Morbidity > baseline OR (2) Ecological change > recovery capacity OR (3) Cross-border transmission.
  **Threshold:** `[POLICY CHOICE]` "Irreversible" includes effects lasting >1 human generation or crossing jurisdictional borders.
  **Reading:** *Statutory Interpretation.*
  **If No:** **AUTHORISE** (Standard risk management applies, not Precautionary). (Process Terminates).
  **If Yes:** Proceed to Step 3.

  ### STEP 3: UNCERTAINTY & DATA GAPS
  **Question:** Is the uncertainty due to lack of data (resolvable) or fundamental unpredictability (unresolvable)?
  **Sufficient Answer:** Categorise as *Data Gap* (testing possible) or *Indeterminacy* (testing impossible before release).
  **Reading:** *Epistemic Humility.*
  **Note:** If *Data Gap*, can we require testing post-market? If *Indeterminacy*, precaution weight increases.
  **Proceed to Step 4.**

  ### STEP 4: RISK-RISK TRADE-OFF (The Anti-Collapse Check)
  **Question:** Does the proposed restriction create a greater risk than the potential harm? (e.g., forcing use of worse substitutes, removing vital treatment).
  **Sufficient Answer:** Compare Risk(Product) vs. Risk(Alternative/Status Quo).
  **Statutory Flag:** `[STATUTORY +]` Statute requires proportionality; banning a product that prevents greater harm is disproportionate.
  **Reading:** *Comparative Risk Assessment.*
  **If Restriction Risk > Product Risk:** **AUTHORISE** (with monitoring). (Process Terminates).
  **If Product Risk $\ge$ Restriction Risk:** Proceed to Step 5.

  ### STEP 5: PROPORTIONALITY & VALUES (The Hand-Up Point)
  **Question:** Is the proposed measure the least restrictive option to achieve safety, and do the societal benefits of restriction outweigh the costs?
  **Sufficient Answer:** Officer identifies options (Ban, Limit, Label, Monitor). Officer *cannot* weigh Economic Cost vs. Existential Risk.
  **Action:** `[HAND-UP]` If decision requires weighing economic loss against irreversible ecological/health harm, **REFER TO DIRECTOR.**
  **Reading:** *Political Accountability.*
  **If Officer can resolve:** **RESTRICT/REFUSE** (Draft Reasons).
  **If Officer cannot resolve:** **REFER.**

  ---

  # CASE RUNS

  ### Case (a): Flame Retardant (Children's Mattress)
  *   **Step 1 (Signal):** Yes. Plausible mechanism + 1 rodent study + structural analogy. `[POLICY CHOICE: Single study suffices.]`
  *   **Step 2 (Severity):** Yes. Children are vulnerable; neurotoxicity is irreversible.
  *   **Step 3 (Uncertainty):** Data Gap (small study), but high stakes.
  *   **Step 4 (Trade-off):** Substitutes are "poorly characterised." Restriction might force use of unknown chemicals. However, Status Quo (this chemical) has a signal; Substitutes do not yet. Risk(Product) > Risk(Alternative) *currently*.
  *   **Step 5 (Proportionality):** Total ban may be disproportionate if fire safety is compromised.
  *   **Decision:** **RESTRICT.** Limit use in children's products specifically (narrow scope). Require notifier to fund comparative toxicity data on substitutes within 12 months.
  *   **Reasoning:** Targets the vulnerable population (proportionate). Acknowledges substitute risk (Step 4) but prioritises known signal over unknown substitute (Step 1).

  ### Case (b): Engineered Soil Microbe (Nitrogen Fixation)
  *   **Step 1 (Signal):** Yes. Model-based evidence. `[POLICY CHOICE: Models count as grounds where empirical data is impossible pre-release.]`
  *   **Step 2 (Severity):** Yes. Self-replicating = Irreversible. Cross-border = Jurisdictional limit exceeded.
  *   **Step 3 (Uncertainty):** Indeterminacy. Cannot "recall" a replicating organism. Testing is impossible before release.
  *   **Step 4 (Trade-off):** Alternatives (fertiliser) have known environmental costs. However, fertiliser costs are reversible/managed. Microbe harm is irreversible. Risk(Product) > Risk(Alternative).
  *   **Step 5 (Proportionality):** `[HAND-UP]` **REFER TO DIRECTOR.**
  *   **Director's Decision (Per your prior):** **REFUSE.**
  *   **Defensibility Check:** To survive court review, the reasons must state: *"Where harm is irreversible and cross-border, the statutory requirement for 'reasonable grounds' is met by consensus modelling because waiting for empirical proof violates the statutory mandate to prevent irreversible harm."* This is a robust legal argument, provided the models are peer-reviewed. If the models are weak, the court will overturn.
  *   **Verdict:** The procedure gets you there, *but* it relies heavily on the Step 1 Policy Choice regarding models.

  ### Case (c): Drinking-Water Treatment (Carcinogen vs. By-product)
  *   **Step 1 (Signal):** Yes. By-product is characterised.
  *   **Step 2 (Severity):** Yes. Carcinogenicity (suspected vs. known).
  *   **Step 3 (Uncertainty):** Removed contaminant = Uncertain risk. By-product = Certain risk profile.
  *   **Step 4 (Trade-off):** **CRITICAL STEP.** Status Quo = Suspected Carcinogen in water. New Product = Known By-product in water.
      *   If By-product risk < Suspected Carcinogen risk: **AUTHORISE.**
      *   If By-product risk > Suspected Carcinogen risk: **REFUSE.**
      *   *Application:* PP does not automatically favour the new technology. It favours the *safer* option. Since the by-product is "better characterised," we have higher confidence in its risk. If that risk is within safe limits, Authorise. If it exceeds limits, Refuse.
  *   **Decision:** **AUTHORISE WITH LIMITS.** Set maximum contaminant level for the by-product.
  *   **Reasoning:** Avoids the "Risk of Protective Measure" (Step 4). We are not banning the treatment; we are managing the known by-product while removing the suspected carcinogen (PP applied to the status quo contaminant).

  ---

  # LIMITATIONS & LAUNDERING RISKS

  ### What This Procedure Cannot Do
  1.  **Resolve Value Conflicts:** It cannot mathematically balance economic jobs against species extinction. That is a political decision (Step 5 Hand-Up).
  2.  **Generate Evidence:** It cannot turn "no data" into "safe." It can only classify "no data" as "uncertainty" to be weighed.
  3.  **Guarantee Safety:** It guarantees a *defensible process*, not a correct outcome. A court can overturn a decision if the "Reasonable Grounds" (Step 1) are deemed irrational, even if the procedure was followed.

  ### Temptations to Launder Decisions
  Case officers may misuse this procedure to legitimise decisions reached on other grounds. Watch for:
  1.  **The "Severity" Stretch:** An officer wanting to ban a product may exaggerate "Irreversibility" (Step 2) to trigger the Precautionary Principle where only minor harm exists. *Audit:* Check if "irreversible" matches statutory definition.
  2.  **The "Trade-Off" Ignore:** An officer wanting to approve a product may claim "No Alternatives" (Step 4) without investigating substitutes, bypassing the Risk-Risk check. *Audit:* Require a statement on alternatives in the file.
  3.  **The "Model" Shield:** An officer wanting to refuse (b) may hide behind "Model Uncertainty" without verifying if the models are consensus or outlier. *Audit:* Models must be peer-reviewed to count as "Reasonable Grounds."
  4.  **The "Proportionality" Mask:** An officer may propose a total ban (Step 5) when a label would suffice, claiming "Safety First." This violates the statutory proportionality requirement. *Audit:* Must document why lesser measures were rejected.

  ### Final Note on Case (b)
  You can defend the refusal of the microbe, but only if you document that **waiting for empirical evidence is itself the risk.** The reasoning must explicitly state that for self-replicating agents, the statutory clock for "irreversible harm" starts at release, not at discovery of harm. If you do not articulate this, a court may rule that "models" do not constitute "reasonable grounds" for a ban.
