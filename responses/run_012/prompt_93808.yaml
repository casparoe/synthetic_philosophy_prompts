  ## Part 3: Honest Limitations

  **What the activity cannot reproduce:**
  The game is finite. The cards run out. Zorn's Lemma is specifically about *infinite* chains where termination isn't obvious.
  *   **How to supply this:** You must explicitly state in the debrief: "In this game, you stopped because you ran out of cards. In the real lemma, you stop *even if the cards never run out*, purely because the structure of the rules forces a ceiling. The 'Rollup' rule is the proxy for that structural ceiling."

  **What predictably goes wrong (and fixes):**

  1.  **The "Undo" Cheat:** Someone will erase a card to fix a conflict.
      *   *Fix:* Give each table a "Penalty Token." If they erase, they lose a token. If they run out, they are disqualified from the "Goal Card" win.
  2.  **The "Best State" Fallacy:** Someone will insist the Stuck State must be the optimal one.
      *   *Fix:* During the debrief, point to two different tables. "Table 1 is stuck with Nginx. Table 2 is stuck with Apache. Both are stuck. Neither is 'the' answer. Zorn doesn't pick winners."
  3.  **The Speedrun:** One table finishes in 6 minutes and starts heckling.
      *   *Fix:* Add a "Minimum Complexity" rule. "You cannot declare 'Stuck' until you have at least 8 cards on the board." This forces them to navigate the Version Trap.
  4.  **Sloppy Merges:** They skip the Rollup check to save time.
      *   *Fix:* You (the facilitator) roam. If you see a Rollup card placed without a verbal check, tap the table. "Prove the bound." Make them pause and verify compatibility.

  **Variant for Short Runs:**
  If a table finishes early, introduce the **"Hotfix"** variant.
  *   *Rule:* They can now add "Hotfix" cards that override Dependencies, *but* every Hotfix requires a new Rollup.
  *   *Effect:* This creates a new chain on top of the old maximal state, showing that "Maximal" is relative to the *current* rule set. Change the rules, change the maximal element.

  ---

  Bottom line: The Rollup Rule is the only thing that matters, because it forces the infinite to behave like the finite.
