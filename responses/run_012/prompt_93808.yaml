  # Activity: "The Migration Path"

  **Time:** 30 minutes play, 15 minutes debrief.
  **Materials:** Whiteboard, markers, ~60 index cards (handwritten), 3-4 tables.
  **Players:** 3-4 per table.

  ## Part 1: The Game Design

  ### The State
  Each table shares one **"Production Config"** drawn on the whiteboard. It starts empty.
  The deck consists of **Change Cards**. Each card has a *Type* (e.g., `WebServer`, `DB`, `Auth`), a *Value* (e.g., `Nginx`, `Postgres`, `OAuth`), and a *Version* (e.g., `v1`, `v2`, `v3`...).

  ### The Rules
  1.  **Append Only:** You may add a card to the Config. You may never remove or erase a card.
  2.  **Compatibility (The Local Rule):**
      *   **Conflict:** You cannot have two cards of the same *Type* with different *Values* (e.g., `WebServer: Nginx` conflicts with `WebServer: Apache`).
      *   **Dependency:** `v2` requires `v1` of the same component to already be on the board.
  3.  **The Rollup Rule (The Zorn Engine):**
      *   Players can propose moves individually, **BUT** every 3 moves, the table *must* perform a **Rollup**.
      *   To Rollup, they must take a blank index card, write "Release Candidate," and place it on the stack.
      *   **Crucial:** The "Release Candidate" is only legal if it is compatible with *every single card currently on the board*.
      *   If the Rollup is illegal (e.g., the board has conflicting dependencies that weren't caught earlier), **the last 3 moves are voided**, and the board reverts to the state before them. (This simulates the requirement that the *Upper Bound* must exist in the set).
  4.  **The Version Trap (The "Infinite" Simulation):**
      *   Include cards `Component-X v1` through `v5`.
      *   **Rule:** You cannot have more than 5 version cards of the same component on the board *unless* you have played a `Stable-Release` card.
      *   `Stable-Release` conflicts with `Dev-Mode`.
      *   *Effect:* To go "further" (v6+), you are forced to consolidate (Rollup) into `Stable-Release`. This forces a choice that closes off the `Dev-Mode` path.

  ### Secret Objectives
  Deal one **Goal Card** face-down to each player at the start. They must not show it.
  *   *Examples:* "Final state must include `Nginx`," "Final state must include `Dev-Mode`," "Final state must have at least 10 cards."
  *   *Conflict:* `Nginx` conflicts with `Apache`. `Dev-Mode` conflicts with `Stable-Release`.
  *   *Result:* Players will push for moves that satisfy their goal, leading the table down a specific path.

  ### The End Condition
  The game ends when a table cannot make a legal move (no cards fit the rules) OR when 20 minutes pass.
  *   **Win Condition:** If your Goal Card is satisfied in the final Config, you win personally.
  *   **Table Status:** If the table is "Stuck" (no moves left), they are **Maximal**.

  ### The "Unreachable" Trap
  Ensure the deck allows for a state like "`Component-X v10` + `Dev-Mode`".
  *   Players can describe it easily.
  *   But to reach `v10`, they *must* have triggered the Version Trap, forcing `Stable-Release`, which kills `Dev-Mode`.
  *   They will realize they are stranded: they can see the destination, but no legal chain of moves bridges the gap.

