answer: |-
  ### 1. Analysis of the Argument

  Let us walk through the machinery of your friend's argument. It is a *reductio ad absurdum* designed to show that your three commitments (Presentism, Maximalism, Existence-Entailment) form an inconsistent triad.

  *   **Step (1) [Maximalism]:** This sets the demand. It claims truth is not primitive; every truth requires an ontological anchor. A defender says: "Truth does not float free; it must be rooted in being."
  *   **Step (2) [The Data]:** This establishes the phenomenological datum. We know dinosaurs existed. A defender says: "To deny this is skepticism; we are accounting for common sense, not revising it."
  *   **Step (3) [Existence-Entailment]:** This constrains the anchor. A truthmaker must *be*. A defender says: "Nothing can ground a truth if it is nothing. Non-existents have no causal or metaphysical power."
  *   **Step (4) [Presentism]:** This constrains the *domain* of being. A defender says: "Only the now is real. The past is gone; the future is not yet."
  *   **Step (5) [The Squeeze]:** This combines (1)-(4). If past truths are true, and truthmakers must exist, and only present things exist, then present things must make past truths true. A defender says: "The present must carry the weight of the past."
  *   **Step (6) [Taxonomy]:** This claims exhaustiveness. It says there are no hidden fourth options. A defender says: "You must choose between concrete present states, abstract representations, or brute facts."
  *   **Step (7) [The Elimination]:** This attacks the options.
      *   *(7a)* attacks **Lucretianism** (present objects having past-tensed properties). The charge is **circularity**: The property *being such that dinosaurs existed* seems to be individuated by the very fact it grounds.
      *   *(7b)* attacks **Abstractism** (ersatz times). The charge is **idealism**: Truth depends on our representations, not the world.
      *   *(7c)* attacks **Brutalism**. The charge is **inconsistency**: It violates (1).
  *   **Steps (8)-(11) [The Conclusion]:** These derive the contradiction. If Presentism is true, past truths lack truthmakers (8). If they lack truthmakers, they aren't true (9). But they are true (2). So Presentism is false (11).

  **Ambiguities to Note:**
  1.  **"Existence" (Steps 3 & 4):** In (3), "existence" means *ontological reality* (what there is). In (4), "exist" means *present existence*. A Presentist argues past things *did* exist, but don't *now*. The argument equivocaly treats "exist" in (3) as "exist now" to force the squeeze in (5).
  2.  **"Truthmaker" (Step 1):** Is this a *semantic referent* (what the proposition is about) or a *metaphysical ground* (what explains the truth)? The circularity charge in (7a) only sticks if truthmaking is *explanatory grounding*. If it is mere *aboutness*, (7a) fails.
  3.  **"Circularity" (Step 7a):** Is the circularity *vicious* (presupposing the conclusion) or *benign* (stating a brute fundamental)? The argument assumes it is vicious without proving that fundamental tensed properties are impossible.

  ### 2. Diagnosis

  **Verdict:** The argument is **valid**. The "proves-too-much" observation is not a *reductio* of the argument, but an **honest bill** for holding a sparse ontology alongside Truthmaker Maximalism.

  **The Step to Resist:**
  You should resist **Step (1) [Maximalism]**.

  **Why this is the correct diagnosis:**
  Your friend's argument is essentially a demonstration that **Maximalism + Existence-Entailment + Sparse Ontology = Inconsistency**.
  Your "proves-too-much" observation is astute: this argument *does* threaten Nominalism (no universals to make predication true), Open Futurism (no future facts to make predictions true), and Modal Actualism (no possibilia to make modal claims true).
  How do Nominalists survive? They typically deny (1) for complex predicates or deny (3) for negative truths. How do Open Futurists survive? They deny (2) for future contingents (rejecting bivalence).
  The Presentist who insists on keeping (1), (2), and (3) while holding a sparse ontology (4) is attempting to hold a logically unstable position. The argument is not broken; it is successfully highlighting that your package is over-constrained.

  **Why Step (1) looks compelling (and why rejecting it costs):**
  Maximalism is motivated by the intuition that truth is not magical. We fear "free-floating truths." Rejecting (1) feels like admitting that some truths just *obtain* without ontological grounding. This smells of primitivism or mysticism. However, many metaphysicians (e.g., Trenton Merricks) argue that propositions *are* the truthmakers for certain truths, or that truth is a primitive norm not requiring ontological reduction. Rejecting (1) saves your ontology but costs you a unified theory of truth.

  ### 3. Priced Comparison of Exits

  Here is the cost-benefit analysis of the available exits, ranked from most to least philosophically sustainable.

  #### **Exit A: Abandon Maximalism (Reject 1)**
  *   **What is surrendered:** The claim that *every* true proposition has a truthmaker. You allow that some truths (specifically past-tense ones, or perhaps negative ones) are *brute*.
  *   **Consequences:** You must explain why *some* truths need makers (present contingents) while others (past contingents) do not. This risks ad-hocery.
  *   **Effect on "Proves-Too-Much":** This **solves** the general problem. The Nominalist, Open Futurist, and Presentist can all use this exit. It confines the cost to "sparse ontologies" generally, rather than Presentism specifically.
  *   **Verdict:** **Recommended.** It preserves Presentism and the truth of the past without metaphysical gymnastics.

  #### **Exit B: Deny the Charge Against Higher-Order Properties (Reject 7a)**
  *   **What is surrendered:** The demand that truthmakers be ontologically *distinct* from the facts they ground. You accept **Lucretianism**: the present world has primitive, tensed properties (e.g., *having-contained-dinosaurs*).
  *   **Consequences:** You must accept that these properties are brute. Your supervisor is right that the circularity charge is confused *if* these properties are fundamental. They are not defined by the past; they are intrinsic features of the present that *correspond* to the past.
  *   **Effect on "Proves-Too-Much":** This **does not help** the Nominalist or Open Futurist. A Nominalist cannot say "The apple has the primitive property *being-red*" without arguably reintroducing universals. An Open Futurist cannot say "The world has the property *will-contain-a-sea-battle*" without violating the openness of the future. This exit is specific to Presentism.
  *   **Verdict:** **Viable but expensive.** It saves Maximalism but makes your ontology "bloated" with primitive tensed properties, undermining the parsimony motivation for Presentism.

  #### **Exit C: Abandon Existence-Entailment (Reject 3)**
  *   **What is surrendered:** The claim that truthmakers must *currently* exist. You allow that *past existence* can make a proposition true. (e.g., "Dinosaurs existed" is made true by the *past existence* of dinosaurs).
  *   **Consequences:** You must revise your theory of truthmaking to be tenseless or "cross-temporal." This blurs the line between Presentism and Eternalism. If past existence is a real ontological ground, in what sense are past things *non-existent*?
  *   **Effect on "Proves-Too-Much":** This helps the Presentist but not the Nominalist (who still lacks universals).
  *   **Verdict:** **Dangerous.** It risks collapsing Presentism into a version of Eternalism (where past things have a mode of being that grounds truth).

  #### **Exit D: Deny the Charge Against Representationalism (Reject 7b)**
  *   **What is surrendered:** The demand that truthmakers be concrete. You accept **Ersatzism**: abstract propositions or world-states make past truths true.
  *   **Consequences:** You face the "aboutness" problem. Why does *this* abstract object represent *that* past? If the representation relation is brute, why not just say the truth is brute (Exit A)? If it depends on the past, you return to Exit C.
  *   **Effect on "Proves-Too-Much":** Does not help the Nominalist.
  *   **Verdict:** **Weak.** It trades ontological parsimony for semantic complexity.

  #### **Exit E: Give Up Presentism (Reject 4)**
  *   **What is surrendered:** The view that only present things exist. You move to **Eternalism** or **Growing Block**.
  *   **Consequences:** Past things exist (tenselessly). The truthmaker for "Dinosaurs existed" is the dinosaurs themselves (located in the past).
  *   **Effect on "Proves-Too-Much":** This solves the temporal case but leaves the Nominalist and Modal Actualist still vulnerable to the argument.
  *   **Verdict:** **The Nuclear Option.** It solves the specific problem but abandons your core temporal intuition. It is the most costly if Presentism is your primary commitment.

  ### 4. Impact on Your Package and the "Proves-Too-Much" Observation

  **The Verdict on Your Package:**
  Your current package (Presentism + Maximalism + Existence-Entailment) is **inconsistent**. You cannot keep all three. The argument is sound, and your friend is correct that it undermines the package, not just Presentism in isolation.

  **The "Proves-Too-Much" Observation:**
  This is **not a reductio of the argument**. It is an **honest bill**.
  The argument demonstrates that **Truthmaker Maximalism is incompatible with Sparse Ontology**.
  *   If you are a Nominalist, you must drop Maximalism (for abstracta).
  *   If you are an Open Futurist, you must drop Maximalism (for future contingents) or Bivalence.
  *   If you are a Presentist, you must drop Maximalism (for past truths).

  Your friend's moral ("parsimony is expensive") is correct. The "expense" is that you cannot have a sparse ontology *and* a maximalist theory of truth without introducing primitive, brute features (like Lucretian properties) that effectively mimic the ontological weight of the things you denied exist.

  **Final Recommendation:**
  You said: *"I would most like to keep (1) and (2)... I will give up presentism if I must."*

  If you strictly prioritize (1) and (2), **you must give up Presentism (4).**
  However, if you are willing to listen to the broader metaphysical consensus: **Abandon (1).**
  Truthmaker Maximalism is the engine of the problem. It is a methodological demand, not a metaphysical datum. The intuition that "truth needs grounding" is valid for *fundamental* truths, but derived truths (like "Dinosaurs existed") can be grounded in the *conceptual* structure of time rather than an ontological constituent.

  **My Advice:**
  Resist **Step (1)**. Adopt a **Non-Maximalist Presentism**.
  Hold that present contingents need truthmakers (concrete objects), but past-tense truths are made true by the *way the present is* (its tensed properties) without requiring those properties to be grounded in further existing entities. This allows you to keep Presentism and the truth of the past, paying the price only on Maximalism. This aligns your view with the Nominalist and Open Futurist: all sparse ontologists must accept that some truths are ontologically brute. This is not a bug; it is the cost of parsimony.
