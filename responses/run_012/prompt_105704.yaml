  I've been in a population-ethics reading group for about a year and I'm going a bit mad. The live question is whether a bigger population is better, other things equal, and the two camps have not moved an inch. The totalists: if you add people whose lives are worth living, the outcome is better -- so a huge population of lives that are just barely worth living can come out better than a smaller population of flourishing ones. They'll bite that bullet, though their own camp then splits over whether a "critical level" or some floor on what counts rescues them from the even uglier cousins of that verdict. The other side says no: adding a life that's barely worth living can't make the world better, and some of them go further and say that ranking outcomes with different people in them against each other is a category mistake to begin with. What drives me nuts is that both sides nod along to the same modest steps -- adding a happy person doesnt make things worse for anyone already here, a life barely worth living isn't a harm to the person living it, "better than" is transitive -- and then land on opposite answers. My working hypothesis is that this isn't one disagreement: maybe they're answering different questions (what makes an outcome good vs. what we may do vs. whether anyone is harmed), or they mean two different things by "better" (better for someone vs. better period), or it's bedrock intuition all the way down about whether adding lives can be good in itself, or it's ill-posed and some impossibility result shows no principle can satisfy the constraints everyone wants. Diagnose it for me -- what kind of disagreement is this really, argued from what each side actually claims, and given your diagnosis, what would count as progress (a distinction, a theorem, a change of question) and should we expect any? Be straight with me about what's settled here and what's genuinely contested among people who know the area, and don't hand me a contested view as if it were the