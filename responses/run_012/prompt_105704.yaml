answer: |-
  You are not going mad; you are experiencing the standard initiation into population ethics. The frustration you feel is the intended effect of the field's central results. Your hypothesis that something is ill-posed is correct, but it is not merely verbal or conceptual confusion—it is a formal logical problem.

  Here is the breakdown of what is settled, what is contested, and what counts as progress.

  ### What Is Settled (Among Experts)
  The technical consensus is dominated by **impossibility theorems**, most notably those developed by Gustaf Arrhenius. These theorems demonstrate that no axiological theory can satisfy a set of adequacy conditions that all seem initially plausible (e.g., "Adding a happy person is not worse," "Adding a miserable person is worse," "Betterness is transitive," "Very good lives are better than very bad lives").

  It is settled that you cannot have it all. Any coherent theory must violate at least one strong intuition. The Totalists accept the Repugnant Conclusion to preserve transitivity and the principle that adding positive welfare increases value. The Person-Affecting theorists preserve the intuition that existence cannot benefit the non-existent, but they often sacrifice transitivity or the comparability of outcomes with different populations. There is no "correct" theory waiting to be found that satisfies all constraints, because the constraints are mathematically inconsistent.

  ### What Is Contested
  Since the logic is settled (something must give), the disagreement is entirely **normative prioritization**. The debate is no longer about which theory is "true," but about which bullet is least costly to bite.
  *   **Totalists** argue that the Repugnant Conclusion is less damaging than abandoning the intuition that adding happy lives is good *simpliciter*.
  *   **Anti-Totalists** argue that the Repugnant Conclusion is a *reductio ad absurdum* and that we should abandon impersonal betterness or transitivity instead.

  This is not a verbal dispute about the meaning of "better." Both sides understand the distinction between "better for someone" and "better simpliciter." The disagreement is axiological: they genuinely disagree on whether value aggregates across persons in a way that makes mere existence a contribution to the good, independent of harm or benefit to specific subjects.

  ### What Counts as Progress
  Do not expect a solution. Progress in population ethics is **taxonomic**, not resolutive.
  1.  **Mapping Trade-offs:** Progress is clarifying exactly which intuitive cost comes with which theory. Your group is making progress if you can pinpoint exactly which axiom each side is sacrificing to maintain consistency.
  2.  **Distinguishing Questions:** Your hypothesis about "different questions" is partially right. Distinguishing *normative ethics* (what we ought to do) from *axiology* (what outcomes are better) helps. Some theories (like Person-Affecting Views) might work as decision guides but fail as outcome rankers. Acknowledging this split is progress.
  3.  **Accepting Incompleteness:** Progress involves accepting that our moral concepts may not extend coherently to choices involving different possible populations. Admitting that "better than" might be incomplete or non-transitive in these edge cases is a viable theoretical move, not a surrender.

  ### Expectations
  You should not expect consensus. The field has been active for 50 years (since Parfit) and has moved from seeking a theory to mapping impossibility results. If your group aims to find the "winner," you will remain mad. If you aim to understand the precise structure of the impossibility and choose your poison consciously, you will succeed.

  Diagnosis: Impossibility — competing intuitions violate consistency constraints.
