answer: |-
  This is a sophisticated deployment of the "Companions-in-Guilt" (CIG) strategy. Your friend is essentially arguing that the metaphysical and epistemological costs of moral realism are not unique, and since we pay them for mathematics without flinching, we should not flinch at paying them for morality.

  To audit this, we must treat the analogy not as a proof of moral realism, but as a defensive shield against a specific objection (the causal/epistemic access objection). Below is the audit of the mapping, the stress points, and the verdict.

  ### 1. The Correspondence Table

  Here is the explicit mapping your friend is relying upon. The left column represents the target (Morality), the right column represents the companion (Mathematics), and the center represents the shared property alleged to make them "guilty" together.

  | Feature | Moral Case (Non-Natural Realism) | The Shared "Guilt" (The Charge) | Mathematical Case (Platonism) |
  | :--- | :--- | :--- | :--- |
  | **Ontology** | Moral properties (Goodness, Obligation) | **Abstract / Non-Spatiotemporal** | Mathematical objects (Numbers, Sets) |
  | **Causal Status** | Causally inert (do not push particles) | **Causal Inertness** | Causally inert (do not push particles) |
  | **Epistemology** | Moral intuition / Rational reflection | **Non-Perceptual Access** | Mathematical intuition / Proof |
  | **Independence** | Mind-independent (true regardless of belief) | **Objectivity** | Mind-independent (true regardless of belief) |
  | **Explanatory Role** | Explains why we judge acts wrong | **Indispensability (Claimed)** | Explains physical laws (via science) |
  | **Metaphysical Relation** | Supervenes on natural properties | **Necessary Connection** | Supervenes on logical/set-theoretic facts |

  ### 2. Which Features Do the Work?

  For the CIG argument to succeed, two conditions must be met:
  1.  **The Guilt must be real:** Mathematics must actually suffer from the same metaphysical/epistemic defects alleged against morality.
  2.  **The Innocence must be impossible:** We must be unable to reject mathematical realism without unacceptable cost.

  **The features doing the heavy lifting are:**
  *   **Causal Inertness:** This is the core of the "queerness" charge. If numbers don't cause anything, how do we know them? If morality doesn't cause anything, how do we know it? The analogy works here because both domains seem to require a faculty of "rational insight" rather than sensory perception.
  *   **Indispensability:** This is the anchor. We accept mathematical Platonism largely because mathematics is indispensable to our best scientific theories (the Quine-Putnam indispensability argument). Your friend is banking on the intuition that we *cannot* do science without numbers.

  **Where the mapping breaks:**
  *   **Explanatory Role:** This is the critical fracture. Mathematical objects explain *physical* phenomena (e.g., planetary orbits, quantum states). Moral facts, arguably, do not explain *natural* phenomena. They explain our *judgments*, but a skeptic can say our psychology explains our judgments without positing real moral facts. Math is indispensable to physics; morality is not indispensable to physics.
  *   **Consensus and Progress:** There is near-universal agreement on basic arithmetic and a clear trajectory of progress in mathematics. Moral disagreement is persistent, deep, and lacks a clear decision procedure. The skeptic argues this suggests moral "intuition" is unreliable in a way mathematical "intuition" is not.
  *   **Motivation (Internalism):** Moral judgments are typically taken to be intrinsically motivating (to judge X wrong is to have a reason not to do X). Mathematical judgments are not (to judge 2+2=4 is not to be motivated to act). This suggests moral facts might have a "to-be-pursuedness" built into them, adding a layer of metaphysical queerness numbers do not possess.

  ### 3. Dependency on Philosophy of Mathematics

  The analogy is not neutral; it quietly imports a specific philosophy of mathematics.

  **If your friend is a Platonist:**
  The analogy is strongest. He is saying, "We already accept causally inert, mind-independent abstracta in math; why not in ethics?"

  **If your friend is a Nominalist or Fictionalist:**
  The analogy collapses or turns against him.
  *   *Fictionalism:* If he thinks mathematical statements are useful fictions but not literally true, then the CIG argument implies moral statements are also useful fictions but not literally true. This concedes the point to the moral anti-realist (who often argues moral facts don't exist).
  *   *Structuralism:* If math is just about structures and not objects, the "causal inertness" charge changes. Structures might be instantiated in physical systems. If morality isn't structural in the same way, the analogy weakens.

  **If your friend is a Naturalist about Math:**
  Some argue math is just a human linguistic convention or a cognitive tool. If so, there is no "guilt" to share. The analogy survives only in a weakened form: "We treat math *as if* it's real, so we can treat morality *as if* it's real." But this surrenders robust realism for both.

  **Verdict on Dependency:** The CIG argument *requires* the opponent to be a mathematical realist. It does not require the *proponent* to be a Platonist, but if the proponent isn't, they are likely arguing for a deflated form of moral realism (quasi-realism) rather than the robust realism the parsimony argument attacks.

  ### 4. Swapping the Companion Domain

  What if we swap Mathematics for **Logic** or **Epistemic Normativity**?

  **Logic (Normativity of Inference):**
  *   *Analogy:* "Modus Ponens is valid" is a normative fact about reasoning. It is causally inert, mind-independent (arguably), and known a priori.
  *   *Strength:* This is often a **stronger** companion than math. Logic is explicitly normative ("you *ought* to infer..."), just like ethics. Math is descriptive.
  *   *Weakness:* Logic is often viewed as analytic (true by definition), whereas moral truths are viewed as synthetic. If moral truths are synthetic a priori, they are metaphysically stranger than logical truths.

  **Epistemic Normativity (Reasons for Belief):**
  *   *Analogy:* "You ought to believe in accordance with evidence."
  *   *Strength:* Extremely hard to deny without self-defeat (to argue against epistemic norms is to claim your argument gives reasons to believe you, presupposing norms).
  *   *Weakness:* Epistemic norms govern *belief*, which aims at truth. Moral norms govern *action*, which aims at the good. The "direction of fit" differs.

  **Verdict on Swapping:** The **Epistemic Normativity** companion is philosophically more robust than Mathematics for this specific purpose. It isolates the "normativity" without the baggage of "abstract objects." If the skeptic rejects moral facts because they are normative and non-causal, they must also reject epistemic norms, which renders skepticism itself unintelligible.

  ### 5. Does the Conclusion Survive?

  **Conclusion:** *Moral facts are no worse off than mathematical ones, so the parsimony argument fails.*

  **Audit:** The conclusion survives **only against the specific charge of causal inertness.** It does not survive if the parsimony argument is bolstered by the **Explanatory Idleness** of moral facts.

  *   **Why it survives:** If the *only* reason to reject moral facts is that they are causally inert abstracta, then yes, you must reject numbers too. Since almost no one rejects numbers, the argument proves too much.
  *   **Why it fails:** The parsimony argument is rarely *just* about causal inertness. It is about causal inertness *plus* lack of explanatory power. Numbers earn their keep by explaining the physical world. Moral facts do not explain the physical world. Therefore, we can posit numbers (indispensable) without positing moral facts (dispensable), even if both are causally inert.

  **A More Honest Analogy:**
  A more honest analogy would not compare Moral Facts to Mathematical Objects, but to **Mathematical Objects *minus* their Indispensability.**
  *   *Better Analogy:* "Belief in moral facts is like belief in large cardinal numbers beyond the needs of physics." (i.e., mathematical entities that are coherent but explanatorily idle).
  *   *Result:* Many mathematicians *are* skeptical of large cardinals precisely because they lack explanatory connection to the rest of math/physics. This suggests the parsimony argument *does* bite where explanatory power is missing.

  ### 6. My Verdict and Self-Criticism

  **Verdict:**
  I come down on the side that your friend's argument is **dialectically effective but metaphysically incomplete.**
  It successfully blocks the *simple* Mackie-style Argument from Queerness (causal inertness). It forces the skeptic to either become a mathematical nominalist (a hard bullet to bite) or admit that causal inertness alone isn't enough to kill realism.
  However, it fails to secure moral realism because it ignores the **Explanatory Disanalogy**. We tolerate mathematical "queerness" because of its scientific utility. Moral facts lack that utility. Therefore, parsimony *does* tell against moral facts more than mathematical ones, even if both are causally inert.

  **Confidence:**
  Moderate-High (75%). This aligns with the consensus in contemporary metaethics (e.g., arguments by Tersman, Enoch, and objections by Joyce). The CIG strategy is recognized as a valid defensive move, but not a standalone proof of realism.

  **What Would Move Me:**
  I would change my verdict if it were demonstrated that **moral facts play an indispensable explanatory role in the social sciences** analogous to the role numbers play in physics. If we could show that we cannot explain human social coordination, legal systems, or evolutionary cooperation *without* positing objective moral facts (not just beliefs about them), the Explanatory Disanalogy would vanish, and the CIG argument would become decisive.

  **The Single Fatal Disanalogy:**
  The **Motivation/Internalism Constraint.**
  If it is true that "To judge X is wrong is necessarily to have a motive to avoid X" (Internalism), then moral facts are not just inert abstracta; they are *reason-giving* abstracta. Numbers give us no reasons to act. If moral facts must intrinsically motivate, they require a metaphysical account of how a fact can generate a motive without a pre-existing desire (Hume's Challenge). Mathematics faces no such challenge. If Internalism holds, the analogy sinks because the "guilt" of morality is heavier than the "guilt" of mathematics.

  **Where I Might Be Overreaching:**
  I may be trading on a contested reading of **Mathematical Indispensability.** Some philosophers (e.g., Penelope Maddy) argue that mathematicians do not actually believe in Platonist objects for scientific reasons, but for intra-mathematical reasons. If mathematical realism doesn't actually rely on scientific indispensability, then the "Explanatory Disanalogy" I rely on to defeat your friend is weaker than I think. If math realism is accepted *despite* having no physical explanatory power (pure math), then your friend's analogy is stronger than I have credited. I must acknowledge that the "indispensability" defense of math is itself controversial.

  **Summary for your Group:**
  Tell your friend his analogy is a excellent *defensive* shield against the "causal access" objection, but it is not an *offensive* sword for moral realism. It forces the skeptic to be consistent about math, but it leaves open the possibility that morality is "guiltier" than math due to its lack of explanatory power and its strange connection to motivation. The analogy holds best if the companion domain is shifted from Mathematics to **Epistemic Normativity**, where the "guilt" is undeniable and the cost of rejection is self-defeat.
