prompt: |-
  I'm in a small reading group on metaethics, and last week we got onto the move people reach for whenever someone argues that moral facts are too metaphysically expensive to believe in — the argument that moral properties would be causally inert, unlike anything else in our ontology, and that we would have no credible story about how we come to know them, so parsimony tells against positing them at all. A friend of mine, a PhD student in mathematics who is not especially invested in the debate, offered the reply that is sometimes called the companions-in-guilt strategy, in a form I had not seen put quite so bluntly. His line is this: every one of those charges lands just as hard on mathematical objects. Numbers are not part of the causal order, nobody bumps into the number seven, and we have no causal contact with them either — and yet almost everyone in the room happily treats arithmetic as a body of truths about mind-independent matters that we nonetheless manage to know. So, he says, if you can be a realist about mathematics without embarrassment, you can be a realist about morality without embarrassment, and the parsimony argument against moral facts proves far too much.

  I would like you to audit this analogy rather than simply adjudicate the underlying dispute. Lay out the correspondence explicitly — a table is fine — saying exactly what is supposed to map onto what: which objects, which epistemology, which flavour of metaphysical oddity, which explanatory role, which kind of independence. Then tell me which features of the mathematical case are actually doing the work in his argument, and whether the moral case genuinely shares them. Where does the mapping break, and which of the breaks matter for the conclusion he is drawing rather than being merely decorative? I am especially interested in whether the analogy quietly imports a particular philosophy of mathematics: if you are not a Platonist about numbers — if you think mathematics is structural, or fictional, or ultimately a matter of our conventions and inferential practices — does the analogy collapse, does it turn against him, or does it survive only in a weakened form? I would also like you to test whether the analogy is stronger or weaker when the companion domain is swapped: instead of mathematical objects, take the normativity of logic and correct inference, or the bare idea that some beliefs are correct and others are not. Finally, tell me whether the conclusion — that moral facts are no worse off than mathematical ones, so the parsimony argument fails — actually survives once the disanalogies are on the table, and, if it does not, what a more honest analogy would be.

  Give me your own verdict, and be explicit and self-critical about it: say which way you come down, how confident you are, and — most importantly — what would move you off that verdict. Which single disanalogy, if it turned out to hold up, would be enough to sink his argument, and where is your own reasoning most likely to be overreaching, or to be trading on a contested reading of one side or the other?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Context:** A metaethics reading group discussing the "causal inertness/epistemological access" argument against moral realism (often associated with Mackie's Argument from Queerness or Benacerraf's Problem applied to ethics).
      *   **The Move:** A "companions-in-guilt" (CIG) strategy proposed by a math PhD student.
      *   **The Claim:** Mathematical objects share the alleged defects of moral facts (causal inertness, epistemological access issues, metaphysical oddity), yet we accept mathematical realism. Therefore, rejecting moral realism on these grounds is inconsistent (proves too much).
      *   **The Task:** Audit the analogy (not just adjudicate the dispute).
          *   Create a correspondence table (objects, epistemology, metaphysical oddity, explanatory role, independence).
          *   Identify which features of math do the work and if morality shares them.
          *   Locate breaks in the mapping and determine if they are fatal or decorative.
          *   Analyze the dependency on philosophy of mathematics (Platonism vs. Structuralism/Fictionalism/etc.).
          *   Test alternative companion domains (Logic/Normativity of Belief).
          *   Evaluate if the conclusion survives the disanalogies.
          *   Provide a personal verdict with confidence levels and conditions for changing the mind (self-criticism).

  2.  **Deconstruct the Companions-in-Guilt (CIG) Argument:**
      *   *Premise 1:* The objection to moral realism (causal inertness + epistemic access) applies equally to mathematical realism.
      *   *Premise 2:* Mathematical realism is widely accepted/intuitive/hard to deny.
      *   *Conclusion:* Therefore, the objection fails to rule out moral realism (or at least, one must reject math realism too, which is a bullet most won't bite).

  3.  **Drafting the Correspondence Table:**
      *   Need to map: Ontology, Epistemology, Metaphysical Status, Explanatory Role, Independence.
      *   *Math:* Numbers/Sets, Rational Intuition/Proof, Abstract/Non-spatiotemporal, Indispensable to Science, Mind-independent (for Platonists).
      *   *Morality:* Rightness/Goodness, Moral Intuition/Reflection, Non-natural (for robust realists), Explains Action/Judgment, Mind-independent (for robust realists).

  4.  **Analyzing the "Work" Done by the Math Case:**
      *   What makes math realism palatable despite the "queerness"?
      *   *Indispensability:* Math is essential for physics. Morality isn't essential for physics.
      *   *Consensus:* High agreement on 2+2=4. Low agreement on abortion/euthanasia.
      *   *Progress:* Clear cumulative progress in math. Debated in ethics.
      *   *Phenomenology:* Math feels discovery-like. Morality feels discovery-like (to realists) but also motivation-like (to internalists).

  5.  **Identifying Breaks in the Mapping:**
      *   *Causal Relevance:* Math explains physical phenomena (via scientific theories). Morality explains... what? Supervenience is tighter in math (logical necessity) than ethics (metaphysical necessity?).
      *   *Motivation:* Moral judgments are typically thought to be intrinsically motivating (Internalism). Mathematical judgments are not. This links to Hume's Theory of Motivation.
      *   *Disagreement:* Persistent peer disagreement in ethics vs. temporary in math.
      *   *Evolutionary Debunking:* Evolution explains moral beliefs (fitness), but does it track truth? Evolution explains math beliefs (fitness), but does it track truth? (This is actually a strong point *for* the analogy, but the *content* of the beliefs differs).

  6.  **Philosophy of Mathematics Dependency:**
      *   If the friend is a Platonist, the analogy holds best.
      *   If the friend is a Nominalist/Fictionalist/Structuralist:
          *   *Fictionalism:* "Math isn't literally true." -> Then the CIG argument implies "Morality isn't literally true either." (Turns against him if he wants moral *truth*).
          *   *Structuralism:* Math is about structures, not objects. -> Does morality have structures? Maybe, but less clear.
          *   *Naturalism:* Math is part of our best scientific theory. -> Is morality? (Quinean naturalism says no).
      *   *Crucial Point:* The CIG argument *requires* the opponent to be a mathematical realist. If the opponent is an error theorist about math too, the argument fails. But most are not. However, if the *proponent* of the CIG argument isn't a Platonist, does it weaken? Yes, because the "guilt" is lessened if math isn't actually "guilty" of positing queer objects.

  7.  **Alternative Companions:**
      *   *Logic/Normativity of Belief:* "You ought to believe what follows from your premises."
      *   *Pros:* Very hard to deny. Normative but factual.
      *   *Cons:* Logic might be analytic/tautological. Morality is synthetic (arguably).
      *   *Epistemic Norms:* "You ought to believe based on evidence."
      *   *Verdict:* Often stronger than math because it's directly about *reasons*, which ethics is also about. Math is about *objects*.

  8.  **Evaluating the Conclusion:**
      *   Does the parsimony argument fail?
      *   It fails *if* the only reason to reject moral facts is causal inertness.
      *   But if there are *additional* reasons (motivation, disagreement, supervenience), the CIG doesn't clear morality completely.
      *   It shifts the burden: The skeptic must explain why math is okay but morality isn't.

  9.  **Formulating the Verdict:**
      *   *Stance:* The analogy is powerful but incomplete. It successfully blocks the *simple* causal access argument but fails to address the *motivational* and *explanatory* disanalogies.
      *   *Confidence:* Moderate-High (this is a standard debate, but nuances matter).
      *   *Mind-Changer:* If it were shown that moral facts *do* play an indispensable explanatory role in social science akin to math in physics, or if mathematical Platonism were conclusively refuted.
      *   *Single Fatal Disanalogy:* The "Motivation/Internalism" constraint. Math doesn't motivate action; Morality (arguably) does. This requires a different metaphysical story (e.g., non-cognitivism) for ethics that isn't needed for math.
      *   *Self-Critique:* Am I assuming a robust non-naturalist realism for ethics? The CIG argument is usually deployed by non-naturalists. If the ethicist is a naturalist, the CIG is less relevant. I need to be clear I'm auditing the argument *as presented* (defending non-naturalist realism against queerness objections).

  10. **Refining the Output:**
      *   Ensure the tone is analytical and philosophical, matching the user's sophistication.
      *   Make the table clear.
      *   Ensure the "Philosophy of Math" section is distinct.
      *   Ensure the "Verdict" is personal and self-critical as requested.

  *(Self-Correction during drafting)*: I need to be careful not to conflate the "Argument from Queerness" (Mackie) with the "Evolutionary Debunking Argument" (Street). The prompt focuses on "causal inertness" and "epistemic access," which is Benacerraf-style/Mackie-style. I should stick to that, though evolutionary debunking is relevant to the epistemic access point. I will focus primarily on the causal/epistemic access link.

  *(Refining the Philosophy of Math point)*: If the friend is a structuralist, does the analogy collapse? Not necessarily. Structuralism still posits abstracta (structures) that are causally inert. So the "guilt" remains. But if they are a fictionalist, the "guilt" vanishes because they deny the existence. So the analogy turns against the friend *if* they want moral truth. I need to make this distinction sharp.

  *(Refining the Alternative Companion)*: The normativity of logic is a very strong candidate. "Modus Ponens is valid" is normative. It's not causal. We know it a priori. This might be a *better* companion than numbers because it's explicitly normative, like ethics.

  *(Final check on Verdict)*: I need to pick a side. I lean towards the view that CIG works against the *causal* objection specifically, but doesn't secure full-blown moral realism because of the *motivational* disanalogy. I will state this clearly.

  11. **Final Polish:** Check against all constraints in the prompt.
      *   Audit analogy? Yes.
