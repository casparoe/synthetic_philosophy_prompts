answer: |-
  # Activity: The Standard

  ## Setup (10 minutes)

  **Materials:**
  *   40 Index cards (20 Red, 20 Blue). If unavailable, tear paper in half and mark with marker.
  *   20 Envelopes (for Round 1 instructions).
  *   Whiteboard and markers.
  *   Score sheets (half-sheet of paper per person) and pens.
  *   Small prize (bag of candy, fancy coffee) and a "cleanup crew" designation (e.g., a specific task like stacking chairs).

  **Room Arrangement:**
  *   Participants sit where they are. No need to move tables.
  *   Designate a visible scoreboard area on the whiteboard.

  **Roles:**
  *   **Facilitator:** You. Manage rounds, collect cards, write scores.
  *   **Scorekeepers:** Recruit 2 volunteers. One tracks total Red plays per round, one tracks total Blue. They write the counts on the board after each round.
  *   **Players:** Everyone else.

  **The Story (Read this verbatim):**
  "We are going to run three short simulations. In each, you are adopting a technology standard. You want to maximize your personal score. Your score depends on two things: compatibility and stability.

  Here is the scoring rule for **Rounds 2 through 5**:
  1.  **Base Score:** 10 points.
  2.  **Network Bonus:** Plus 2 points for every *other* person who chooses the same color as you in this round.
  3.  **Switching Penalty:** If you choose a different color than you chose in the *previous* round, subtract 25 points from your total score immediately.

  **Round 1 is different.** You cannot choose. I will hand you an envelope. Inside is a card telling you which color you must play. You must play it. There is no switching penalty in Round 1 because there was no previous round.

  At the end of each simulation (5 rounds), we will tally total scores. The top 3 scorers across all simulations get the candy. The bottom 3 scorers stay behind to stack the chairs and wipe the board.

  You may not talk about your choices during the rounds. You may not show your card until I say 'Reveal'."

  **Distribution:**
  *   Prepare 20 envelopes beforehand.
  *   **For Simulation 1:** 14 envelopes contain "RED", 6 envelopes contain "BLUE". Shuffle and distribute randomly.
  *   **For Simulation 2:** 6 envelopes contain "RED", 14 envelopes contain "BLUE".
  *   **For Simulation 3:** 14 envelopes contain "RED", 6 envelopes contain "BLUE". (Same as Sim 1).

  ---

  ## Simulation 1: The Accident (20 minutes)

  **Round 1 (Forced):**
  1.  Tell players to open envelopes and hold up the card.
  2.  **Facilitator Action:** Count the Reds and Blues visibly. Write them on the board (e.g., Red: 14, Blue: 6).
  3.  **Scorekeeping:** Have players calculate their Round 1 score (Base 10 + 2 × others). No switching penalty applies.
      *   *Example:* Red players get 10 + (13 × 2) = 36 points. Blue players get 10 + (5 × 2) = 20 points.
  4.  **Crucial Moment:** Let the Blue players look at the board. Let them see the 36 vs 20 gap. Do not comment on it. Do not say "That's unfair." Do not say "You can switch next time." Just record the scores.

  **Rounds 2–5 (Free Choice):**
  1.  Tell players to choose Red or Blue for the next round. Remind them of the **25-point Switching Penalty**.
  2.  Collect choices (have them hold cards face down, then walk around to verify, or have them write on score sheet and hold up). *Recommendation:* Have them write choice on score sheet, then reveal on count of three.
  3.  **Scorekeepers:** Count totals. Write on board.
  4.  **Players:** Calculate score.
      *   *If staying:* Base 10 + (2 × others).
      *   *If switching:* Base 10 + (2 × others) - 25.
  5.  **Facilitator Action:** Maintain a neutral poker face. If a Blue player switches to Red in Round 2, they will likely still score lower than the Reds because of the penalty (e.g., 15 Reds = 40 pts. Switcher gets 10 + 28 - 25 = 13 pts). They will likely switch back or stay Blue and lose points.
  6.  Repeat for 5 rounds.

  **End of Sim 1:**
  *   Announce total scores. Identify tentative winners/losers.
  *   **Do not debrief yet.** Collect cards. Reset the room.

  ---

  ## Simulation 2: The Counterfactual (15 minutes)

  **Setup:**
  *   Distribute the **second set of envelopes** (6 Red, 14 Blue).
  *   Tell them: "Same rules. Same scores. Fresh start."

  **Rounds 1–5:**
  *   Run exactly as before.
  *   **Observation:** The Blue side now starts with the advantage. The Red side now feels the pain of the minority.
  *   **Facilitator Action:** Ensure the scoreboard is cleared. Do not reference Sim 1 results yet. Let the new minority feel the same frustration the previous minority felt.

  **End of Sim 2:**
  *   Announce totals.
  *   **Do not debrief yet.**

  ---

  ## Simulation 3: The Subsidy (15 minutes)

  **Setup:**
  *   Distribute the **third set of envelopes** (14 Red, 6 Blue — same accident as Sim 1).
  *   **Rule Change:** Announce this clearly. "In this simulation, the Blue technology has received a government subsidy. **Blue players get a Base Score of 60 points instead of 10.** Red players stay at 10. Network bonus (2 points) and Switching Penalty (25 points) remain the same."

  **Rounds 1–5:**
  *   Run the rounds.
  *   **Expected Outcome:** In Round 1, Blues score massively higher (60 + 10 = 70 vs Red 36).
  *   **The Turn:** In Round 2, Red players will feel intense pressure to switch.
      *   Stay Red: ~36 points.
      *   Switch to Blue: (60 + 10) - 25 = 45 points.
      *   Switching is now rational despite the penalty.
  *   Watch the migration. The "locked-in" outcome from Sim 1 should break here.

  **End of Sim 3:**
  *   Announce totals.
  *   Collect all materials.

  ---

  ## Debrief (30 minutes)

  **Step 1: The Reveal (5 mins)**
  *   Ask: "In Simulation 1, how many of you wanted to switch to Red in Round 2 but decided not to?" (Expect hands from the initial Blue group).
  *   Ask: "In Simulation 2, how many wanted to switch to Blue?" (Expect hands from the initial Red group).
  *   Reveal the envelope counts for Sim 1 and Sim 2. Highlight that the *only* difference was the random draw in Round 1.

  **Step 2: Mapping the Outcomes (15 mins)**
  Draw three columns on the board. Label them (a), (b), and (c).

  *   **(a) Contingent but Stuck:** Point to Sim 1 & 2.
      *   "The outcome was not inevitable. A different coin flip in Round 1 would have swapped the winners. But by Round 3, the cost of changing (the 25 points) outweighed the benefit of joining the majority. You were locked in. The history mattered."
  *   **(b) Inevitable Journey:** Point to Sim 3.
      *   "Here, the initial accident (14 vs 6) didn't stop the better technology from winning. The structure of the returns (the subsidy) was strong enough to overcome the history. If you believe history doesn't matter, you are arguing that we are always in Simulation 3."
  *   **(c) The Closed Window:**
      *   "In Round 1 of Sim 1, switching was free. In Round 5, switching was prohibitively expensive. Path dependence isn't just about being stuck; it's about a window of opportunity that closes. When did the window close for the Blue players in Sim 1? Round 2? Round 3?"

  **Step 3: Hindsight vs. Probability (5 mins)**
  *   Ask: "Looking at the final score of Sim 1, was choosing Blue in Round 1 a stupid decision?"
  *   Guide them: "No. At the moment of decision (the envelope), you had no information. Asking 'would it have happened anyway' is a question we ask from the future. At the time, both outcomes were possible. The lock-in only exists because of the sequence, not because the loser was doomed from the start."

  **Step 4: The Cheat (5 mins)**
  *   "We cheated today. I let you replay history. In the real world, you don't get Simulation 2. You only live Simulation 1.
  *   "Also, in this game, you knew the Blue option existed. In reality, the roads not taken are never built. You can't compare your locked-in road to a better one that no one invented because the market locked onto the inferior one too early. We gave you the counterfactual; history usually hides it."

  ---

  ## Troubleshooting & Limitations

  **What will go wrong (and fixes):**

  1.  **Math Errors:** Players will miscalculate scores, leading to confusion about whether switching was worth it.
      *   *Fix:* Put the formula clearly on the whiteboard. In Round 2, walk through one example calculation aloud before they commit. "If 15 people play Red, and you join them, you get 10 + 28. If you switch, minus 25."
  2.  **Collusion:** Players might talk and agree to all switch to Blue in Sim 1 to "beat the system."
      *   *Fix:* Enforce the "no talking" rule strictly. If they coordinate, the lesson breaks. Remind them this is a competition for snacks.
  3.  **Run 3 Fails to Flip:** If the subsidy isn't high enough, Red might stay locked in despite being inferior.
      *   *Fix:* If you see no one switching in Round 2 of Sim 3, pause the game. "Notice how hard it is to move even with a subsidy? Okay, I am increasing the Blue Base Score to 100." Adjust live to ensure the flip happens.
  4.  **Apathy:** Students might not care about the points.
      *   *Fix:* Emphasize the "cleanup crew" penalty. Social shame is a stronger motivator than candy.

  **What this activity cannot reproduce:**

  1.  **The Unbuilt Road:** In the game, players know Blue exists and know its payoff structure. In real path dependence (e.g., QWERTY), the superior alternative might never be invented because the market locked onto the inferior one too early. The game assumes knowledge of the counterfactual; history often denies it.
  2.  **Irrational Loyalty:** The game assumes rational actors calculating points. Real lock-in often involves cultural identity, habit, or ignorance ("I don't know how to use the other system"). The game captures the *economic* cost of switching, but not the *psychological* inertia.
  3.  **Power Dynamics:** The game treats all 20 players as equal. Real standards are often set by 2 or 3 dominant actors (e.g., Microsoft, Google) forcing the rest to comply. Here, everyone has equal voting power, which makes lock-in harder to achieve than in reality where power is concentrated.

  **Facilitator "Do Not Say" List (During Sim 1 & 2):**
  *   Do not say: "It's getting hard to switch now."
  *   Do not say: "You're stuck with your early choice."
  *   Do not say: "This is an example of increasing returns."
  *   Do not comfort the losing side. Their frustration is the data point.
