answer: |-
  **Exam Question**

  **Question 4**
  Consider the following argument, which we shall call *Moral Gradualism*:

  > "Sentience is not an on/off switch but a dimmer dial. A thermostat possesses a negligible amount of sentience; a fly possesses slightly more; a mouse more still. Moral status tracks this dial continuously. There is no sharp cut-off for moral consideration, only a smooth ramp. To insist on a sharp cut-off is to engage in arbitrary speciesism."

  Critically evaluate *Moral Gradualism*. In your answer, you must address the relationship between the *ontology* of sentience (what it is) and the *epistemology* of sentience (how we know it). Furthermore, assess whether a continuous scale of sentience can coherently support a continuous scale of moral trade-offs (e.g., weighing many low-sentience beings against few high-sentience beings).

  *(Answer in your exam booklet.)*

  ***

  **Model Answer**

  *Moral Gradualism* attempts to solve the problem of moral status by eliminating boundary conditions. While intuitively appealing for avoiding speciesism, the view collapses under scrutiny regarding the nature of sentience and the mathematics of moral weighting. Specifically, it conflates gradable evidence with a gradable property, and it fails to provide a coherent metric for moral trade-offs.

  The primary flaw in *Moral Gradualism* is the conflation of ontology and epistemology. The argument assumes that because our *confidence* in a system's sentience varies continuously, the sentience itself must vary continuously. However, sentience may be a threshold property—a binary state of "having a point of view"—while the *evidence* for that state is graded. A thermostat reacts to temperature, but there is no "what it is like" to be a thermostat. A fly reacts to threats, and we are moderately confident there is a subjective experience. A human reacts to abstract concepts, and we are nearly certain. *Moral Gradualism* mistakes this sliding scale of behavioral complexity and epistemic confidence for a sliding scale of subjective existence. If sentience is the capacity for valenced experience, a system either has a locus of experience or it does not. If the thermostat has zero capacity for experience, it sits at zero, not at 0.0001. The "smooth ramp" describes our uncertainty, not the metaphysical reality.

  Even if we grant the ontological claim that sentience comes in degrees, *Moral Gradualism* faces a fatal measurement problem. To claim moral status tracks the "dimmer dial," we require a cardinal scale, not merely an ordinal one. We need to know not just that a dog is more sentient than a fly, but *how much* more. Is it 10 times? 1,000 times? Without a defined unit of "welfare-relevant experience," the scale is empty. Dan's position implies we can make trade-offs (e.g., sacrificing one dog to save 400 flies), but this requires cardinality. If the scale is only ordinal, we know the order of value but cannot calculate equivalence. Defining the unit as "welfare" is circular; defining it as "functional complexity" begs the question, as complexity does not necessarily correlate with the intensity of suffering or joy.

  This leads to the problem of moral linearity. If moral status scales linearly with sentience, we encounter a repugnant conclusion regarding aggregation. If a rock (or thermostat) has non-zero moral status, and a human has high moral status, a sufficiently large number of rocks could theoretically outweigh a human. If the gap between adjacent points on the ramp is morally meaningless (as a continuous smooth line implies), then there is no non-arbitrary point where we can say "this many flies do not outweigh this one dog." *Moral Gradualism* bites this bullet, but it renders moral decision-making impossible. It suggests we must count the welfare of bacteria in our gut alongside our own, diluting moral significance to the point of paralysis.

  Finally, the charge of "speciesism" only holds if the cut-off is arbitrary. But a cut-off based on the *capacity for valenced experience* is not arbitrary; it is the definition of the moral community. Drawing the line at "zero experience" is not prejudice; it is conceptual necessity. Things without experience have no interests to frustrate. A thermostat does not care if it is turned off. Therefore, a binary view of sentience avoids speciesism without requiring a continuous moral ontology.

  In conclusion, *Moral Gradualism* fails because it mistakes epistemic uncertainty for ontological vagueness and because it cannot sustain the mathematical requirements for moral trade-offs. A threshold view of sentience, coupled with a recognition of varying capacities within the sentient class, offers a more robust framework that avoids the absurdity of infinite aggregation while maintaining moral rigor.

  ***

  **Marking Scheme (25 Marks Total)**

  **1. The Ontology/Epistemology Distinction (5 Marks)**
  *   **Requirement:** Explicitly distinguishes between sentience as a property (ontology) and our confidence in detecting it (epistemology). Argues that the "ramp" may describe evidence, not the property itself.
  *   **Common Mistake:** Treating "we aren't sure if the fly feels pain" as identical to "the fly feels a little bit of pain."
  *   **Mark:** 5 for clear distinction; 0-2 for conflating the two.

  **2. The Threshold Defense (5 Marks)**
  *   **Requirement:** Defends the possibility of sentience being a binary/threshold property (either there is a "point of view" or there isn't) against the gradualist claim.
  *   **Common Mistake:** Asserting binaries are "just easier" without explaining why they might be metaphysically accurate (e.g., referencing the nature of interests).
  *   **Mark:** 5 for metaphysical justification; 0-2 for pragmatic justification only.

  **3. Cardinality vs. Ordinality (5 Marks)**
  *   **Requirement:** Identifies that moral trade-offs require a cardinal scale (units of welfare) which *Moral Gradualism* fails to define. Notes the circularity of defining units by welfare.
  *   **Common Mistake:** Assuming that because we can rank animals (ordinal), we can weigh them against each other (cardinal).
  *   **Mark:** 5 for identifying the measurement gap; 0-2 for ignoring the math of trade-offs.

  **4. The Aggregation/Linearity Problem (5 Marks)**
  *   **Requirement:** Discusses the implication of linear scaling (e.g., the "repugnant conclusion" where vast numbers of low-sentience beings outweigh high-sentience ones).
  *   **Common Mistake:** Dismissing aggregation as "intuitively wrong" without explaining why the continuous model *forces* that result.
  *   **Mark:** 5 for linking continuity to aggregation issues; 0-2 for vague appeals to intuition.

  **5. Rebutting the Speciesism Charge (5 Marks)**
  *   **Requirement:** Argues that a zero/non-zero cut-off is conceptually necessary (no interests without experience) rather than arbitrary prejudice.
  *   **Common Mistake:** Accepting the charge of speciesism or defending speciesism as "human preference."
  *   **Mark:** 5 for conceptual defense; 0-2 for conceding the point.

  **Distinguishing A from B Answers**

  *   **B Answer (13-17 marks):** Treats the five points as a checklist. The student correctly identifies the epistemology/ontology distinction, notes the measurement problem, and mentions aggregation, but treats them as separate objections. The essay reads like a list of "Problems with Dan's View."
  *   **A Answer (18-25 marks):** Demonstrates **structural integration**. The student shows how resolving Point 1 (Ontology) dictates the solution to Point 3 (Cardinality). For example, they argue that *because* sentience is a threshold property (Point 1), the demand for a cardinal scale across non-sentient/sentient boundaries is a category error (Point 3), which dissolves the aggregation problem (Point 4). An A answer does not just list the flaws; it shows how the flaws are interconnected symptoms of the same category mistake.
