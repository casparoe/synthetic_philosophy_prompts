  3.  **Drafting the Correspondence Table:**
      *   *Treatment:* The hypothesized causal factor (Coal *or* Institutions).
      *   *Control:* The absence of that factor (No accessible coal *or* Different institutions).
      *   *Randomization:* This is the tricky one. In history, there is no randomization. It's geography or path dependence. I need to label this honestly (e.g., "Geographical/Historical Contingency").
      *   *Outcome Measure:* Sustained industrial growth / Industrial Revolution.
      *   *Sample Size:* N=2 (England vs. Yangtze). Maybe N=1 if they are linked.

  4.  **Analyzing the Failures (The Audit):**
