prompt: |-
  Hey — I'm a 3rd-year PhD student working on moral responsibility, and I'm recording a podcast ep next month with someone whose position sits between Dennett and Caruso. Her line, roughly: the skeptics are right that there's no *ultimate* desert, but she thinks both camps have been treating desert as one all-or-nothing metaphysical status, when it's really a bundle of domain-specific claims — you can deserve an answer, deserve blame, deserve to be taken seriously as a reasoner, without any of that entailing that you deserve to suffer. And she thinks the last bit can still be cashed out to license some hard treatment.

  Can you draft 8–10 interview questions, each with a follow-up keyed to the answer she's most likely to give? I want them to actually press her, not let her restate the view. Please make sure there's at least one on each of these:

  (a) whether "desert" is doing any justificatory work at all here, or whether she's just relabeling what we were going to do on other grounds anyway;
  (b) the causal-history case — two people, same act, same state, different histories, and what her view says differs between them;
  (c) what the *base* of desert is for her (the act? character? effort?), and what happens when those come apart;
  (d) whether we could keep every one of Dennett's practices — blame, praise, the moral community, hard treatment — while never once using the word "desert", and if so what "desert" adds;
  (e) the Rawls-style swap of desert for legitimate expectations, and whether that gets her what she wants without the metaphysics;
  (f) and what her view actually implies at sentencing, as opposed to what Caruso's quarantine-style picture and Dennett's own line each imply.

  No softball "what got you into philosophy" stuff, and no questions that just ask her to explain the other guy's view.
