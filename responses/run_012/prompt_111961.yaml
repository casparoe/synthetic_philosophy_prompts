answer: |-
  Here is a principle that systematizes your intuitions, followed by the application to your test case and the hard question about armed neutrality.

  ### The Principle: Democratic Civic Equality

  **Statement:**
  *A state may compel service from its citizens only when (1) the end is the defense of the legitimate political order itself, (2) the burden is distributed as a universal liability of citizenship rather than a market transaction, and (3) the distribution of that burden does not exploit pre-existing socioeconomic vulnerabilities or penalize moral conscience.*

  This is a hybrid principle. It draws on **Republican** theory (non-domination, citizenship as participation) for the nature of the duty, and **Rawlsian** theory (fair equality of opportunity) for the distribution of the burden.

  ### Mapping the Clauses to Your Verdicts

  **Clause 1: Defense of the Legitimate Political Order**
  *   **Work done:** Distinguishes the **Swiss Militia** from your **Colleague**.
  *   **Explanation:** The state's claim on you is derivative of its legitimacy. Switzerland's militia exists to preserve the conditions of self-determination (a legitimate end). Your colleague's state was waging an unjust war (an illegitimate end). When the state acts outside its legitimate scope, the reciprocal obligation dissolves. This explains why the state can forbid you from fighting *for* others (it claims a monopoly on your coerced violence to preserve *this* order) but cannot compel you to fight *for* an unjust cause.

  **Clause 2: Universal Liability, Not Market Transaction**
  *   **Work done:** Distinguishes the **Swiss Militia** from **Contractors**, and validates your unease about the **AVF**.
  *   **Explanation:** Defense is a public good that constitutes the polity. If you outsource it to the market (contractors), you sever the link between citizenship and the monopoly on violence. The contractor fights for a wage, not a *res publica*. This makes their deployment "not fine" not because of sentiment, but because it privatizes sovereignty. It turns the state's survival into a service industry.

  **Clause 3: No Exploitation of Vulnerability or Conscience**
  *   **Work done:** Condemns **Finland's** surcharge, validates the **AVF unease**, and validates the **Exemption Tax** (if progressive).
  *   **Explanation:**
      *   **Finland:** A longer civilian track penalizes conscience. It treats moral integrity as a cost to be surcharged, violating the equality of citizens.
      *   **AVF Unease:** In a society with background inequality (which is almost all of them), an all-volunteer force relies on "economic conscription." The poor sign up because they lack options. This violates the requirement that burdens not exploit socioeconomic vulnerability.
      *   **Exemption Tax:** This is permissible *only if* it functions as a buy-out of a universal duty, not a loophole for the rich. If it is a flat percentage of income, it maintains proportionality. If it were a flat fee, it would violate this clause.

  ### The Test Case: The Lottery with Lifetime Tax Exemption

  **The Case:** A small state replaces conscription with a lottery. 5% of 19-year-olds are drafted into a professional army, paid market wages, and exempted from income tax for life.

  **Verdict:** **Unjust.**

  **Analysis:**
  This scheme violates **Clause 2** and **Clause 3** simultaneously.
  1.  **Violation of Clause 2 (Non-Commodification):** By offering "market wages" plus "lifetime tax exemption," the state is not asking for a civic duty; it is purchasing a class of defenders. It creates a permanent financial incentive that distorts the civic nature of the service.
  2.  **Violation of Clause 3 (Equality):** The lifetime tax exemption creates a permanent caste distinction. You now have two classes of citizens: those who drew the short straw (or long straw, financially) and serve, and those who do not. Crucially, the *fiscal relationship* to the state is permanently altered. This stratifies citizenship itself. It turns military service into a bond market instrument rather than a rotation of civic duty.

  **The Verdict You Must Give Up:**
  You suspected it was the **All-Volunteer Force (AVF)**. You are correct.

  If you accept *Democratic Civic Equality*, you cannot maintain that the AVF is "fine" in a society with significant economic inequality. Your intuition that "something feels off" about the poor kids signing up for tuition is the principled one; your judgment that the AVF is "fine" is the outlier.

  The AVF is only permissible under this principle if background social justice is already achieved (i.e., no one joins because they are desperate). Since that is rarely the case, the AVF is structurally unjust because it allows the wealthy to buy out of the defense of the state using the bodies of the poor. The Lottery Case confirms this: if you think the Lottery/Tax-Exemption scheme is unjust because it creates a privileged class of veterans, you must also think the AVF is unjust because it creates a class of defenders drawn disproportionately from the vulnerable.

  *Note:* You do not have to give up your verdict on the **Contractor**. This principle strengthens it. The Contractor is the logical endpoint of the AVF logic (full commodification), which is why it strikes you as "not fine."

  ### The Hard Question: Armed Neutrality and the "Lost War"

  **The Question:** If the doctrine is deterrence via making occupation expensive (i.e., the army is expected to lose slowly, not win), does this delegitimize the compulsion? Does reciprocity care if the war can be won?

  **The Answer:** **No, it does not change the legitimacy.**

  **Reasoning:**
  Under *Democratic Civic Equality*, the obligation is not to **victory**; it is to **continuity**.

  1.  **The Nature of the Good:** The public good being secured is not "safety from death" (which is impossible in war) but "political self-determination." Even a lost war of resistance affirms that the territory belongs to the people, not the invader. It forces the occupier to pay a political and moral cost, preserving the *claim* to sovereignty even if the *capacity* is temporarily suppressed.
  2.  **Reciprocity of Risk, Not Outcome:** The social contract guarantees that the state will not sacrifice you *pointlessly*. But "pointless" is not the same as "unlikely to succeed." Armed neutrality is not a suicide pact; it is a risk calculation. The state says, "We will not submit without a fight." The citizen agrees to bear the risk of that fight.
  3.  **The Alternative:** If the state said, "We will only fight if we are guaranteed to win," it would effectively have no defense doctrine at all, as no war is guaranteed. If the state cannot compel you to fight in a war it might lose, it cannot compel you to fight at all.

  **However, there is a constraint:**
  This legitimacy holds only if the state is honest about the doctrine. If the state tells the conscripts, "We will win," but the doctrine is actually "We will lose slowly to raise costs," that is a violation of **Clause 1 (Legitimacy)** through deception. The reciprocity requires that the citizens know they are buying *deterrence*, not *security*.

  ### Summary

  Your intuitions are tracking **Democratic Civic Equality**.
  *   **Swiss Militia:** Just (Universal liability, defensive).
  *   **Colleague:** Just refusal (Illegitimate end).
  *   **Finland:** Unjust (Penalizes conscience).
  *   **Contractors:** Unjust (Commodifies sovereignty).
  *   **AVF:** Unjust (in practice) because it exploits background inequality. **(This is the verdict you must revise).**
  *   **Lottery/Tax Exemption:** Unjust (Creates caste inequality).
  *   **Armed Neutrality:** Just (Defends political continuity, not guaranteed survival).

  You are not struggling to find a principle; you are struggling because your liberal intuition (AVF is fine because it's voluntary) is clashing with your republican intuition (Citizens must share the burden of the state equally). The republican intuition is doing the heavy lifting in your other cases. To be consistent, you must let it override the AVF verdict.
