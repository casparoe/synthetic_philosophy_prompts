answer: |-
  This is a classic philosophical move called a *reductio ad absurdum*—taking your logic to its extreme to show it breaks. Tom is sharp, but he's relying on a category error. He's treating all decisions as if they run on the same operating system. They don't.

  Since you're a dev, let's debug this like code.

  ### The Bug: A Type Error in Premise (1)

  Premise (1) says: *"When a decision affects a lot of people, the only fair way to make it is to give every one of them an equal chance of being the one who decides."*

  The bug here is the condition `if decision.affects_people()`. That's too broad. It's like writing a function that accepts an `Object` when it really needs a `User`.

  There are two distinct types of decisions:
  1.  **Value Decisions (Politics):** "Should we spend more on parks or police?" "Should taxes be higher?" There is no objectively correct answer here. It depends on what we *want*.
  2.  **Technical Decisions (Engineering/Medicine):** "How do we build a bridge that doesn't fall down?" "How do we replace this hip joint?" There *is* an objectively correct answer (or at least, objectively better and worse ones).

  Tom's argument fails because it applies the logic for **Value Decisions** to **Technical Decisions**.

  In a Value Decision, everyone's preference counts equally. My desire for a quiet street is not "more correct" than your desire for a busy high street. So, equal chance to decide (sortition) is fair.

  In a Technical Decision, competence is not distributed equally. My opinion on hip surgery is not equal to a surgeon's. Applying "equal chance" here isn't fair; it's negligent.

  ### Tom's Hint: Exploration vs. Execution

  Tom's comment about the crowd is actually the key to fixing this. He's describing a concept often called the **Diversity Trumps Ability Theorem** (though you don't need to know the name).

  *   **When nobody knows the right method (Exploration):** If the problem is complex and there's no single "correct" answer (like governing a country), a diverse group of random people often outperforms a group of similar experts. Why? Because they bring different life experiences and heuristics. They cover more of the solution space. This is why sortition works for legislation.
  *   **When somebody does know the method (Execution):** If the goal is fixed (fix the hip) and the method is known (surgery protocol), you want the person with the highest success rate. Diversity of opinion doesn't help if one opinion is "cut the artery" and the other is "don't cut the artery."

  So, Tom is right that (1) leads to random surgeons, which is why (1) is flawed. But he's wrong that you have to abandon sortition for politics. You just have to scope (1) correctly.

  ### The Fix: Refactoring Premise (1)

  You don't need to delete (1), you need to patch it.

  **Old (1):** When a decision affects a lot of people, the only fair way to make it is to give every one of them an equal chance of being the one who decides.

  **New (1):** When a decision involves **conflicting values with no objective right answer**, the only fair way to make it is to give every one of them an equal chance of being the one who decides.

  This saves (3). Politics is mostly about values (how we balance freedom, security, wealth, equality). There is no "expert" in what a society *should* feel like. Therefore, a random sample represents the society's values better than a career politician.

  But this exempts the hip surgery. The goal (health) is agreed upon. The method is technical. So we defer to expertise.

  ### The Price: What do you give up?

  If you make this change, what does it cost you?

  1.  **You lose "Pure Equality":** You can no longer say "everyone is equally capable of deciding everything." You have to admit that for technical implementation, expertise trumps equality.
  2.  **You inherit the "Boundary Problem":** This is the hard part you mentioned. You now have to defend the line between "Political/Value" and "Technical."
      *   *Example:* Is "How much to fund the NHS" political? Yes (values). Is "Which drug to approve" political? Maybe, but it looks technical.
      *   *The Defense:* You treat this like an API contract. The random citizen assembly sets the **requirements** (budget, outcomes, priorities). The experts (civil servants, surgeons, engineers) handle the **implementation**.
      *   If the assembly says "Reduce wait times," that's a value goal. The surgeons decide *how* to do it. If the surgeons fail, the assembly fires them (or changes the budget).

  ### Does this hold up?

  Yes. In fact, this is closer to how successful sortition models (like ancient Athens or modern citizens' assemblies) actually work. They didn't pick random generals to lead armies (technical); they picked random citizens to vote on whether to go to war (value).

  Tom's trap was making you think sortition means "everyone decides everything." It doesn't. It means "everyone decides the **goals**, experts advise on the **means**."

  ### Summary for the Group Chat

  If you want to reply to Tom, you can say something like:

  > "You caught a bug in (1). It treats 'values' and 'facts' as the same data type.
  >
  > Sortition is for deciding **what we want** (where there's no right answer, so fairness rules).
  > Expertise is for deciding **how to get it** (where there is a right answer, so competence rules).
  >
  > I'm keeping sortition for the 'what', but I'm delegating the 'how' to the people who've done 2,000 hip replacements. The random body sets the budget and the targets; the experts write the implementation."

  This keeps your lottocracy intact without forcing your mum to undergo surgery by lottery.
