answer: |-
  The night of November 9, 1989, serves as a limit case for the ontology of collective action. It presents a rapid succession of acting subjects: the fractured East German state, the aggregating crowd, and the localized unit of border guards. Analyzing Bornholmer Strasse through the lens of collective intentionality reveals where standard theories strain against the physics of mass history.

  First, the crowd. Was the massing at the border a genuine joint action or a convergence of individual intentions? Under Michael Bratman's account, shared intention requires meshing subplans, mutual responsiveness, and common knowledge. The crowd fails this test. There was no negotiation of subplans; a student wanting to visit an aunt and a worker wanting to buy bananas had different goals, united only by the opportunity of passage. There was little mutual responsiveness beyond physical avoidance. Margaret Gilbert's account is stricter: joint commitment requires concurrence, a mutual obligation to act as a body. The crowd had no such agreement; one could leave without rebuke.

  John Searle's account fits best, yet risks over-ascription. Searle argues collective intentionality ("We-intend") is primitive and can exist in individual minds without mutual agreement. Individuals certainly thought, "We are crossing tonight." However, this risks conflating shared mood with shared agency. The crowd was likely a coordination cascade triggered by Schabowski's botched utterance. The "We" was phenomenological, not normative. They were a plural subject only in the eyes of the guards.

  The guards are the philosophical crux. They constitute a formal unit, but their action that night was a deviation from their institutional script. Initially, their collective intention was derived from the State: "We defend the border." When the crowd massed, this intention became unsustainable. Did they form a new joint action?

  Under Bratman, the guards at Bornholmer likely achieved shared intention. Their subplans meshed: "I will not shoot if you do not shoot," and "I will open the gate if you cover the booth." They were mutually responsive to the escalating pressure and each other's hesitation. Their common knowledge was the imminent threat of violence. However, what was the content of their shared intention? It was not "We open the Wall" (a historical outcome), but "We prevent bloodshed here and now." This distinction is vital. They acted jointly to manage a crisis, not to make history.

  Gilbert's joint commitment also applies but highlights the normative shift. By tacitly concursing to let people through, the guards formed a new plural subject distinct from the State. Once the commander signaled acquiescence, the unit was bound. To revert to shooting would have been a violation of this new, emergent commitment to the crowd. They became a rogue collective agent, decoupled from the State's intentionality.

  This leads to the State itself. The East German state was the intended acting subject of the border regime. However, Schabowski's press conference created a conflict in the State's agency. The utterance ("immediately, without delay") contradicted the standing order (restrictive visas). At Bornholmer, the State ceased to be a coherent agent. The guards did not obey the State; they obeyed the immediate situation. The State's collective intentionality dissolved into the local unit's pragmatic reasoning.

  What does this episode do to the theories? It suggests that standard accounts of joint action are too static. Bratman, Searle, and Gilbert generally model stable groups—friends walking together, orchestras, or corporations. They assume a baseline of continuity. November 9 shows collective intentionality can be fluid and reactive.

  Specifically, it challenges Bratman's requirement for meshing subplans in large-scale events. The crowd acted together without them, suggesting a need for a theory of *emergent* joint action where the "meshing" is provided by the environment (the barrier) rather than interpersonal negotiation. It also challenges Searle: if a "We-intention" can shift so rapidly from "defend" to "yield" based on external pressure, is the intention truly in the mind, or is it constituted by the affordances of the situation?

  Finally, the guards' action suggests a category of *negative joint action*. Usually, theories analyze doing something together. Here, the joint action was *ceasing* to enforce. They acted together to stop acting as guards. This implies that collective intentionality is not just about constituting a group, but about dissolving prior commitments. The theories lack the vocabulary for the collapse of a joint commitment. The guards didn't just form a new "We"; they broke the old one.

  In sum, the opening of the Wall was not a single joint action but a collision of agents. The crowd was a cascade, not a committee. The guards were a genuine joint agent, but one formed in the emergency gap of a collapsing State. The event demonstrates that collective intentionality is not merely a matter of mental states or agreements, but of structural pressure. When the cost of maintaining the "We" (shooting citizens) exceeds the cost of breaking it (losing the border), the collective subject fractures. Philosophy of action must account not just for how we act together, but how we stop acting together when the world changes faster than our plans can mesh.
