  ├── Branch A: As a direct constraint on the posterior conditional probability
  │   (Constraint: P_new(H|R) = q)
  │   │
  │   ├── Node A1: Is the rule defined by minimizing a divergence measure from P_0?
  │   │   │
  │   │   ├── Yes (Kullback-Leibler) ──────────────────────────────► LEAF 1: Judy Benjamin Rule
  │   │   │   [Note: Implicitly preserves P(H|B) and changes P(R).]
  │   │   │
  │   │   ├── Yes (Euclidean / L2) ────────────────────────────────► LEAF 2: Least Squares Update
  │   │   │   [Note: Minimizes sum of squared differences; distinct from KL.]
  │   │   │
  │   │   └── No ──────────────────────────────────────────────────┤
  │   │       │
  │   │       ├── Node A2: Must P_new(R) equal P_0(R)?
  │   │       │   │
  │   │       │   ├── Yes ─────────────────────────────────────────► LEAF 3: P(Red)-Preserving Rule
  │   │       │   │   [Note: Adjusts P(H|B) to normalize; does not minimize KL.]
  │   │       │   │
