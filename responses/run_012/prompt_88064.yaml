      *   *Case 2 (Bad Health Check):* Load spike ($S$) triggers autoscaler ($D$ stays), new instances spin up, but LB rejects them ($M$ blocked).
          *   This looks like a **Mask**. The disposition manifests (instances created), but the *utility* (handling load) is blocked. Or, if we define $M$ as "handling load," the disposition exists but $M$ fails.

