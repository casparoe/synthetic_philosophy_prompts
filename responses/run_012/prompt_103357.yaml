answer: |-
  This is a sophisticated application of epistemology to a concrete historical event. You have correctly identified the core concepts from Miranda Fricker's *Epistemic Injustice: Power and the Ethics of Knowing* (2007). Your definitions are accurate enough for this analysis: **testimonial injustice** involves a credibility deficit due to prejudice; **hermeneutical injustice** involves a structural gap in shared understanding that prevents someone from making their experience intelligible.

  Below, I have separated the response into your two requested sections, followed by a specific key to distinguish established theory from my own analysis.

  ***

  ### Part 1: Running Horizon through Fricker's Framework

  To apply this framework, we must identify the epistemic agents (who knows), the subjects (who is known), and the flow of information.

  **1. Testimonial Injustice: The Credibility Deficit**
  *   **The Speaker:** The Subpostmaster (SMP).
  *   **The Hearer:** Post Office (PO) investigators, prosecutors, and initially, the courts.
  *   **The Deficit:** The SMP claims, "I did not steal this money; the account is wrong." The PO hears, "I am offering an excuse for theft."
  *   **The Prejudice:** In Fricker's original work, prejudice is often identity-based (gender, race). Here, it is **institutional vs. individual**. The PO is constructed as the disinterested, bureaucratic guardian of truth. The SMP is constructed as an individual operator with financial autonomy and, therefore, the *capacity and motive* for fraud.
  *   **The Mechanism:** When the SMP speaks, the "identity prejudice" (shopkeepers are potential thieves; corporations are reliable record-keepers) causes the hearer to downgrade the credibility of the SMP's testimony below what the evidence warrants.
  *   **Verdict:** This fits the framework well. The SMP is silenced because their social identity (contracted individual) carries less epistemic weight than the institution.

  **2. Hermeneutical Injustice: The Gap in Understanding**
  *   **The Gap:** You ask if this is genuine hermeneutical injustice given that the expertise (software engineering) existed. Fricker's classic example is "sexual harassment" before the term existed: women had the experience but lacked the concept to name it publicly.
  *   **The Horizon Nuance:** In Horizon, the concepts *did* exist ("bug," "data corruption," "race condition"). Fujitsu engineers possessed them. The SMPs did not.
  *   **Is it Hermeneutical Injustice?** Yes, but with a modification. Fricker defines this as a gap in the *collective* hermeneutical resource. If a specific group (SMPs) is excluded from the community that generates those resources (Fujitsu/PO technical teams), they suffer a **localized hermeneutical marginalization**.
  *   **The Experience:** An SMP experiences a shortfall they cannot explain. They say, "The system is wrong." But without the technical vocabulary to specify *how* (e.g., "transaction suspension caused a ledger imbalance"), their claim remains an inarticulate suspicion. To the court, "The system is wrong" sounds like "I don't know where the money went," which is an admission of guilt, not a defense.
  *   **Where the Framework Stretches:** Fricker's model assumes the gap is often historical or cultural (a concept hasn't been coined yet). In Horizon, the gap was **engineered and guarded**. The vocabulary existed but was treated as proprietary or irrelevant to the "business" side.
  *   **Misdescription:** The framework describes the *effect* (the SMP cannot make themselves understood) accurately. It quietly misdescribes the *cause*. It implies a passive absence of concepts, whereas Horizon involved an active **withholding** of concepts. The SMPs were not just marginalized; they were epistemically locked out by non-disclosure agreements and technical opacity.

  ***

  ### Part 2: Procedural Credibility and the Limits of the Theory

  You have identified a phenomenon that Fricker's 2007 text does not explicitly cover. Here is the assessment of your "Procedural Credibility" hypothesis and the limits of the theory regarding active ignorance.

  **1. Assessing "Procedural Credibility"**
  You propose that the organization trusted the *process* (the audit trail) over the *person*.
  *   **Is this Testimonial Injustice?** Strictly speaking, no. Testimonial injustice requires a speaker and a hearer. A software system is not a speaker; it does not have intentions or credibility in the moral sense. It produces data, not testimony.
  *   **The Extension:** When the Post Office says, "Horizon says you owe £50,000," they are not presenting Horizon as a witness. They are presenting the *printout* as objective evidence, and themselves as the neutral interpreters of that evidence.
  *   **Your Concept:** "Procedural Credibility" is a valid and necessary extension. In philosophy of technology, this touches on **automation bias** (the tendency to favor suggestions from automated systems) and **epistemic authority of artifacts**.
  *   **Why Fricker Doesn't Capture It:** Fricker's framework is interpersonal. It focuses on virtues of the *hearer*. It does not account for **systemic epistemic authority**, where the "hearer" is an institutional process that has been designed to treat digital logs as infallible by default.
  *   **Conclusion:** You are not reading the framework too narrowly. The framework *is* too narrow for this. It needs a category for **Structural Epistemic Privilege**, where the "credibility" is assigned to a methodology (digital auditing) rather than a person. The injustice is that the *human* is required to prove the *machine* wrong, reversing the burden of proof not because of who the human is, but because of what the machine represents (objectivity).

  **2. Active Ignorance vs. Passive Gaps**
  You ask about the persistence of the injustice: was it a gap, or a refusal to know?
  *   **Fricker's Limit:** Fricker's hermeneutical injustice is largely structural and passive. It suggests, "We don't have the words yet." It is less equipped to handle, "We have the words, but we refuse to use them because it costs money."
  *   **The Better Framework:** You are describing what philosopher **Gaile Pohlhaus Jr.** calls **"Willful Hermeneutical Ignorance."** This occurs when the dominant group (PO/Fujitsu) *has* access to the hermeneutical resources (they knew about the bugs) but refuses to deploy them to understand the marginalized group (SMPs).
  *   **Institutional Incentives:** This moves the explanation from *epistemology* (how we know) to *political economy* (why we choose not to know). Fricker's virtue epistemology asks, "What would a virtuous listener do?" It does not ask, "What incentives does the corporation have to remain ignorant?"
  *   **The Silence:** The theory is silent on **motivation**. It explains why the SMPs were wronged epistemically, but it cannot explain why the Post Office *persisted* in the error for 20 years. That requires a theory of institutional self-preservation, liability shielding, and reputation management. Epistemic injustice describes the *wound*; it does not diagnose the *weapon*.

  **3. Summary of Extensions**
  *   **Fricker's Theory:** Explains why the SMPs were not believed (Testimonial) and why they struggled to articulate the technical fault (Hermeneutical).
  *   **My Extension/Analysis:** The "Hermeneutical" gap was not a lack of concepts in the world, but a **restriction of access** to those concepts. This aligns with Pohlhaus Jr., not Fricker's original formulation.
  *   **Your Extension:** "Procedural Credibility" is distinct. It is not testimonial injustice because the machine is not a testifier. It is a form of **ontological privilege**: the digital record is treated as more "real" than the human memory. This requires a new category, perhaps **Algorithmic Epistemic Injustice**, which accounts for how systems encode authority.

  ***

  ### Key: Theory vs. Extension

  To ensure you can distinguish the sources in the analysis above:

  *   **[Fricker]**: Concepts derived directly from *Epistemic Injustice* (2007). Specifically: the definitions of Testimonial and Hermeneutical Injustice, the focus on identity prejudice, and the interpersonal nature of the speaker/hearer dynamic.
  *   **[Pohlhaus/Critical Theory]**: The concept of "Willful Hermeneutical Ignorance." This comes from Gaile Pohlhaus Jr.'s 2012 paper *Relational Knowing and Epistemic Injustice*. It addresses the "active refusal" you noted.
  *   **[My Analysis]**: The assessment that Fricker's model "misdescribes the cause" of the hermeneutical gap in Horizon (engineered vs. historical). Fricker does not explicitly deal with proprietary knowledge silos as a form of hermeneutical marginalization, though her framework allows for it.
  *   **[Your Extension]**: "Procedural Credibility." I have validated this as a distinct phenomenon. While it overlaps with "automation bias" in cognitive science, framing it as an *epistemic injustice* is a philosophical extension that Fricker does not cover, as she does not treat non-human systems as epistemic agents or authorities.

  **Final Verdict:** The framework explains the *mechanism* of the silencing (why the SMPs couldn't get through), but it requires the "Willful Ignorance" extension to explain the *persistence* (why the PO didn't listen), and it requires your "Procedural Credibility" concept to explain the *hierarchy* (why the log file beat the human). The theory is not wrong, but it is incomplete for the age of algorithmic governance.
