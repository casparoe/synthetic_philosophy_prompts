answer: |-
  - **Summary** — I defend a **Relational Complicity Principle**, which grounds standing in your relationship to the wrongdoer and absence of specific complicity in the token act. This costs you the verdict in (B), requiring you to treat the friend's counterfactual willingness as a loss of sincerity rather than standing.

  - **The pattern** — Your verdicts track two distinct dimensions: the blamer's *moral commitment* to the norm (A, B, C, D, I) and their *relational position* regarding the specific wrong (E, F, G, H, J). The friction lies where these cross: (B) suggests internal attitude matters most, while (E) and (J) suggest specific relational stakes matter more than general virtue. Your current reciprocity principle fails because it conflates willingness to accept blame (E) with the right to demand it (B).

  - **Candidate principles** — 
  **Principle 1: The Normative Integrity Account.** You have standing if you genuinely endorse the norm governing the act. (1) Endorsement is negated by counterfactual willingness to violate the norm had constraints been removed; this clause is forced by (B), where physical inability preserves conduct but destroys standing. (2) Endorsement is negated by current violation of the same norm; this is forced by (C), where your brother's concurrent drinking silences him. (3) Endorsement is restored by reform after past violation; this is forced by (D), where sobriety restores authority despite history. (4) Violation of a different norm does not negate endorsement; this is forced by (I), where promise-breaking does not silence a critic of lying. This principle treats standing as a function of the blamer's moral character relative to the norm.

  **Principle 2: The Relational Complicity Account.** You have standing if you occupy a relationship that grounds accountability and are not complicit in the specific wrong. (1) Standing requires a relationship sufficient to ground an obligation to answer; this is forced by the contrast between (G), where a stranger lacks standing, and (H), where a sister retains it despite not being the direct victim. (2) Standing is vetoed by complicity in the specific token act, even if you endorse the norm; this is forced by (E), where the co-author's participation in the plagiarism silences his disgust despite his acceptance of blame. (3) Victimhood grants standing regardless of past hypocrisy regarding the same norm; this is forced by (J), where the cheated competitor's past cheating does not silence him. (4) Institutional roles may grant standing to report, but personal moral disgust requires a clean moral hand regarding the specific type of wrong; this is forced by (F), distinguishing the colleague's right to report from his lack of standing to express personal disgust. This principle treats standing as a function of social position and specific innocence rather than general virtue.

  - **Verdicts on further cases** — 
  **Case (K): Concurrent Wrongdoer.** Someone doing X *now* blames you for doing X. Both principles deny standing. Integrity fails because they are currently violating the norm (like C). Relational fails because they are complicit in the norm's violation at this moment, lacking the specific innocence required.

  **Case (L): Proxy Blamer.** A friend blames you on behalf of a victim they care for. Integrity grants standing if they endorse the norm (like H). Relational grants standing if their relationship to the victim is close enough to ground vicarious accountability (like H). Both agree here, provided the relationship is sufficiently intimate.

  **Separator Case (M): The Relapsed Reformer.** A friend was sober for years (like D) but admits they would drink again if not for AA meetings (like B). Integrity denies standing: counterfactual willingness (B) trumps reform (D). Relational grants standing: reform and relationship suffice; counterfactuals are irrelevant unless they lead to current complicity. This case sharply divides the candidates.

  - **Costs** — 
  **Integrity Account Costs:** It cannot accommodate (E). The co-author may genuinely endorse the norm against plagiarism, yet lacks standing due to complicity. It also struggles with (G), as a stranger might possess perfect integrity but still lacks standing to demand an answer. It over-moralizes standing, making it about virtue rather than authority.

  **Relational Account Costs:** It cannot accommodate (B). The friend has the relationship and no complicity in your act, yet lacks standing due to counterfactuals. To hold this principle, you must concede that (B) is not a standing issue but a credibility issue. It risks allowing the hypocrite in (C) if "current violation" is not treated as a form of complicity.

  - **Recommendation** — 
  Keep the **Relational Complicity Account**. It better handles the hard cases where reciprocity fails (E, J, G). To hold it, you must give up the verdict in (B) as a matter of *standing*. Instead, classify the friend's counterfactual willingness as a loss of *sincerity* or *weight*. His blame lands less hard not because he lacks the authority to speak, but because his endorsement of the norm is fragile. This preserves the principle's robustness across cases (E) and (J) while explaining (B) as a qualitative diminution rather than a structural veto.
