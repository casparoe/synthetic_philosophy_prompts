  # The Wealth of Nations: A Diagnostic Tree

  **Level 1: The Speed of Change**
  "Compare North and South Korea, or East and West Germany. If the poor half adopted the rich half's laws overnight, would the income gap close within a generation?"

  *   **Yes:** Institutions are the primary lever. (Go to Level 2A)
  *   **No:** Deeper forces constrain what laws can do. (Go to Level 2B)

  ***

  **Level 2A: The Origin of Rules (For "Yes")**
  "Think of China after 1978 or Botswana among its mineral-rich neighbors. Did these places succeed because leaders chose different incentives, or because their culture was finally ready to choose well?"

  *   **Leaders Chose:** Institutions shape culture. (Go to Level 3)
  *   **Culture Ready:** Culture shapes institutions. (Go to Level 3)

  **Level 2B: The Role of Nature (For "No")**
  "Think of the coal and coasts of the first industrializers versus the disease and soils of tropical Africa. Does geography block wealth directly, or did it only shape the institutions that now block wealth?"

  *   **Direct Block:** Geography determines prosperity. (Go to Level 3)
  *   **Shaped Institutions:** Geography works through history. (Go to Level 3)

  ***

  **Level 3: The Evidence Test (For All)**
  "Look at the places Europeans found most densely settled in 1500, which are on the whole poorer today. Does this historical record identify the cause, or is there only one observation per country?"

  *   **One Observation:** The data is insufficient for certainty. (**Leaf 1–4: The Skeptics**)
  *   **Identifies Cause:** We can distinguish theories from history. (Go to Level 4)

  ***

  **Level 4: The Unit of Action (For "Identifies Cause")**
  "When you propose a solution, do you aim to fix national governments because that is where power lies, or do you suspect the nation is the wrong unit of analysis?"

  *   **Fix Nations:** Policy works at the state level. (**Leaf 5–11: The National Theorists**)
  *   **Wrong Unit:** Regions and networks matter more than borders. (**Leaf 12: The Unit Critic**)

  ***

  ### The Leaves

  **Leaf 1: The Consensus Skeptic** (Institutions + One Observation)
  *Position:* The profession's consensus is as much sociological as evidential.
  *Awkward Commitment:* Must admit that advising governments is guesswork dressed as science.

  **Leaf 2: The Cultural Agnostic** (Culture + One Observation)
  *Position:* Values matter, but we cannot measure their impact against history.
  *Awkward Commitment:* Cannot explain why culturally similar nations diverge (e.g., the two Germanies).

  **Leaf 3: The Humble Geographer** (Direct Geo + One Observation)
  *Position:* Nature sets limits, but we cannot prove which limits are binding.
  *Awkward Commitment:* Risks fatalism without being able to prove a specific place is doomed.

  **Leaf 4: The Narrative Historian** (Indirect Geo + One Observation)
  *Position:* History matters, but every country's path is too unique to generalize.
  *Awkward Commitment:* Offers a story for every case but no predictive rule for new ones.

  **Leaf 5: The Reform Optimist** (Institutions + Leaders + Nations)
  *Position:* Good rules create wealth; culture adapts to incentives.
  *Awkward Commitment:* Must explain why leaders in poor countries persistently choose bad rules.

  **Leaf 6: The Cultural Engineer** (Institutions + Culture + Nations)
  *Position:* You must change beliefs before rules can work.
  *Awkward Commitment:* Implies poverty is a moral or spiritual failing rather than an economic one.

  **Leaf 7: The Policy-Driven Theorist** (Institutions + Leaders + Nations)
  *Position:* The choice of cause tracks what a person wants done about poverty.
  *Awkward Commitment:* Admits the theory is selected for its utility, not its truth.

  **Leaf 8: The Aid Realist** (Direct Geo + Nations)
  *Position:* Nature blocks growth; external aid must bypass local constraints.
  *Awkward Commitment:* Suggests local populations cannot solve their own problems without outside intervention.

  **Leaf 9: The Historical Institutionalist** (Indirect Geo + Nations)
  *Position:* Colonialism and settlement patterns locked in bad rules.
  *Awkward Commitment:* Offers little hope for countries without a "lucky" historical break.

  **Leaf 10: The Regional Institutionalist** (Institutions + Leaders + Wrong Unit)
  *Position:* Rules matter, but trade networks cross borders.
  *Awkward Commitment:* Has no clear lever for political action since no one governs the region.

  **Leaf 11: The Colonial Legacy Critic** (Indirect Geo + Wrong Unit)
  *Position:* Extractive institutions were built for empires, not nations.
  *Awkward Commitment:* Requires dismantling borders that are now defended by powerful elites.

  **Leaf 12: The Unit Critic** (Any Cause + Wrong Unit)
  *Position:* The nation is the wrong unit of analysis.
  *Awkward Commitment:* Must explain why income data is collected and compared by state.

  *(Note: The combination of Culture + Wrong Unit is left unoccupied here. It is diagnosed as **unattractive**: if culture causes institutions, it is usually tied to national identity; arguing culture matters but nations do not creates a mismatch between cause and unit.)*

  ***

  ### Indistinguishable Positions

  **The Reform Optimist (Leaf 5)** and **The Historical Institutionalist (Leaf 9)** cannot be separated by this tree.
  **Why:** Both advocate for institutional reform at the national level. Whether they believe bad institutions arose from leader choices (Leaf 5) or historical geography (Leaf 9), their policy prescription—change the rules—is identical, making their practical stance indistinguishable despite different root stories.
