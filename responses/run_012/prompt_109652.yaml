prompt: |-
  Analyse the case of Oskar Schindler — the Sudeten German industrialist who ran a factory in occupied Kraków, employed some twelve hundred Jewish workers and thereby saved them from the camps, yet remained a profiteer, a Nazi Party member and a womaniser — through the lens of Susan Wolf's moral-saints argument, the claim that a life wholly given over to morality is not the life we should most want for ourselves or for those we love. I want the analysis to run in both directions. First, map the case onto the argument: which features of Schindler's conduct and character make him a candidate for moral sainthood and which disqualify him, and is he better understood as a moral hero than as a moral saint? Second, let the case test the argument: does Schindler confirm it, qualify it, or expose a gap in it? In particular, distinguish at least three things 'maximal moral goodness' might mean — how much good one does, how completely one is devoted to morality, and how morally clean one's own conduct is — and say which of these, if any, Wolf's argument is really directed against. Close by stating plainly what a moral-saints framing cannot settle about a case such as Schindler's, rather than obliging it to pronounce on everything.
reasoning: |-
  Here's a thinking process that leads to the essay above:

  1.  **Deconstruct the Prompt:**

      *   **Subject:** Oskar Schindler (Sudeten German industrialist, Nazi Party member, saved ~1200 Jews, profiteer, womanizer).
      *   **Lens:** Susan Wolf's "Moral Saints" argument (from her 1982 paper *Moral Saints*).
      *   **Core Claim of Wolf:** A life wholly given over to morality is not the life we should most want for ourselves or those we love.
      *   **Task 1 (Map Case onto Argument):** Identify features making him a candidate for "moral sainthood" vs. features disqualifying him. Is he a "moral hero" rather than a "moral saint"?
      *   **Task 2 (Test the Argument):** Does Schindler confirm, qualify, or expose a gap in Wolf's argument?
      *   **Specific Requirement:** Distinguish three meanings of "maximal moral goodness" (quantity of good, completeness of devotion, moral cleanliness/purity). Identify which one Wolf targets.
      *   **Conclusion:** State plainly what the "moral-saints" framing *cannot* settle about Schindler.

  2.  **Analyze Susan Wolf's Argument (Mental Recap):**

      *   Wolf argues against the idea that moral perfection should be the ideal of personal excellence.
      *   *The Loving Saint:* Someone who loves morality so much that doing the right thing is their joy. Wolf finds this boring or one-dimensional.
      *   *The Rational Saint:* Someone who sacrifices personal interests for morality through rational duty. Wolf finds this unattractive because it lacks non-moral virtues (humor, aesthetic appreciation, personal projects).
      *   *Key Point:* A "saint" lacks the "non-moral virtues" that make a person well-rounded and lovable. We want people to have hobbies, passions, and flaws that make them human.
      *   *Distinction:* Wolf isn't saying we shouldn't do good; she's saying we shouldn't make *maximizing* the good the *sole* governing principle of life.

  3.  **Analyze Oskar Schindler:**

      *   *Good:* Saved 1,200 lives (Schindlerjuden). Immense risk. Spent fortune.
      *   *Bad/Flawed:* Nazi Party member (opportunism?), profiteer (initially), heavy drinker, womanizer, abrasive, morally ambiguous motivations (mix of greed, lust, and eventual compassion).
      *   *Nuance:* He wasn't "wholly given over to morality." He was a mess who did a magnificent thing.

  4.  **Drafting - Section by Section:**

      *   **Introduction:** Introduce Schindler and Wolf. State the thesis: Schindler is the antithesis of Wolf's "saint," yet his value challenges the binary of saint/sinner. He fits the "moral hero" mold better.
      *   **Part 1: Mapping Schindler onto Wolf:**
          *   *Sainthood Criteria:* Wolf's saint is one-dimensional, devoted entirely to the moral good.
          *   *Schindler's Disqualification:* He is multi-dimensional (greed, lust, charm). He is not "wholly given over."
          *   *Hero vs. Saint:* A hero acts heroically in specific contexts without needing a saintly character. Schindler is a hero because of the *outcome* and the *risk*, not because of moral purity.
      *   **Part 2: Testing Wolf's Argument (The Three Definitions):**
          *   *Definition 1: Quantity of Good (Consequentialist).* Schindler maximizes this.
          *   *Definition 2: Completeness of Devotion (Motivational).* Schindler fails this (mixed motives).
          *   *Definition 3: Moral Cleanliness (Deontological/Virtue).* Schindler fails this (Nazi, womanizer).
          *   *Wolf's Target:* Wolf is primarily attacking Definition 2 (Devotion) and its impact on personal well-roundedness (Definition 3). She worries that if you maximize Devotion, you lose the "human" stuff.
          *   *Does Schindler Confirm or Qualify?* He *qualifies* Wolf. Wolf worries saints are boring/unlovable. Schindler is lovable *because* of his flaws (in a cinematic/narrative sense), but Wolf might argue his flaws were dangerous. However, Schindler shows that maximal *good* (Def 1) doesn't require maximal *devotion* (Def 2). This supports Wolf's suspicion that the "saintly life" (Def 2) isn't necessary for great moral outcomes.
      *   **Part 3: What the Framing Cannot Settle:**
          *   Wolf's framework evaluates the *ideal of a life*. Schindler is a historical case study of *action*.
          *   It can't tell us if we should *emulate* him. (We can't advise people to be corrupt profiteers to save lives).
          *   It can't resolve the tension between his vices and his virtues regarding his *own* happiness or worthiness.
          *   It creates a category error: Wolf talks about personal ideals; Schindler is about historical rescue.

  5.  **Refining the Argument (Self-Correction/Nuance):**

      *   *Correction:* Make sure not to conflate "Moral Saint" with "Canonized Saint." Stick to Wolf's philosophical definition.
      *   *Nuance on Wolf:* Wolf distinguishes between the "Loving Saint" (Kantian vs. Utilitarian nuances). Schindler isn't a Loving Saint because he didn't love morality *per se*; he loved people (specifically "his" Jews) and perhaps the thrill.
      *   *The Three Definitions:* Ensure these are clearly delineated.
          1.  *Output:* How many lives saved? (Schindler = High).
          2.  *Input/Devotion:* Is morality the master motive? (Schindler = Low/Mixed).
          3.  *Purity:* Is the agent free from vice? (Schindler = Low).
      *   *Wolf's Target:* She targets #2 primarily, arguing that pursuing #2 limits #3 (non-moral virtues) and makes a life less desirable.
      *   *Schindler's Test:* Schindler shows #1 can be achieved without #2. This actually *supports* Wolf's claim that we don't need to be saints (in the sense of #2) to do great good. But it complicates the idea that non-moral virtues (like charm/audacity) are just "nice to have"—in Schindler's case, they were *instrumental* to the moral good.

  6.  **Final Polish:**

      *   Check tone: Analytical, philosophical, not biographical storytelling.
      *   Check constraints: Did I distinguish the three meanings? Yes. Did I state what the framing cannot settle? Yes.
      *   Closing: Ensure the limitation is clear. Wolf's theory is normative (how to live); Schindler is descriptive (what happened).

  7.  **Writing the Response:** (Proceeding to generate the text based on these thoughts.) *Self-correction during drafting: Ensure I explicitly mention that Wolf's argument is about the "ideal of personal excellence," not just "doing good."* *Also, make sure to highlight that Schindler's vices were arguably instrumental to his virtues, which Wolf doesn't fully account for.*

  8.  **Final Review against Prompt:**
      *   Map case onto argument? Yes.
      *   Hero vs. Saint? Yes.
      *   Test the argument (confirm/qualify/gap)? Yes.
      *   Distinguish three meanings of maximal goodness? Yes.
      *   Identify Wolf's target? Yes.
      *   Close with limitations of the framing? Yes.

  (Proceed to output.)
answer: |-
  Susan Wolf's 1982 essay *Moral Saints* posits that a life wholly devoted to the moral good is not a rational ideal for personal excellence. She argues that the "moral saint"—whether one who loves morality above all else or one who dutifully sacrifices personal interests for it—lacks the non-moral virtues (humor, aesthetic appreciation, personal passions) that make a human life rich and lovable. The case of Oskar Schindler provides a rigorous stress test for this argument. Schindler is a figure of immense moral consequence who embodies almost none of the characteristics of Wolf's saint. Analyzing him through Wolf's lens requires us to disentangle the production of good from the character of the agent, ultimately revealing that while Wolf is correct about the unattractiveness of moral sainthood, her framework struggles to account for the instrumental value of moral flaws in extreme circumstances.

  ### Mapping Schindler onto the Argument

  To map Schindler onto Wolf's thesis, we must first define the "moral saint." For Wolf, the saint is defined by a governing commitment: morality is the supreme master motive. The saint eats bland food if the money saved feeds the hungry; the saint foregoes opera if the ticket price could alleviate suffering.

  Schindler is immediately disqualified from this category. He was not "wholly given over to morality." His motivations were a chaotic amalgam of opportunism, greed, lust, and eventual compassion. He joined the Nazi Party for profit, not ideology, and he maintained a lifestyle of heavy drinking and infidelity even while spending his fortune to bribe officials and sustain his workers. In Wolf's taxonomy, Schindler is not a "Loving Saint" (who finds joy in morality) nor a "Rational Saint" (who sacrifices desire for duty). He is a man of appetite whose appetites were occasionally, and miraculously, harnessed for the good.

  This distinction suggests Schindler is better understood as a **moral hero** rather than a moral saint. Wolf implies that sainthood is a lifestyle, a comprehensive way of being. Heroism, by contrast, can be episodic or contextual. A hero performs acts of great risk and value without necessarily possessing a sanctified character. Schindler's heroism lies in the *outcome* (the saving of the *Schindlerjuden*) and the *risk* (potential execution for undermining the war effort), not in the purity of his will. Wolf's argument predicts that we would find a "saintly" Schindler—one who gave up women, alcohol, and profit purely out of duty—less compelling, perhaps even repellant in his one-dimensionality. The historical Schindler is compelling precisely because he is not a saint; his flaws make his redemption narratively and psychologically intelligible.

  ### Testing the Argument: Three Meanings of Maximal Goodness

  To let Schindler test Wolf's argument, we must distinguish what "maximal moral goodness" might mean. Wolf's critique hinges on conflating these, and Schindler helps pry them apart.

  1.  **Maximal Output (Consequentialist):** This refers to the quantity of good produced. How many lives saved? How much suffering alleviated?
  2.  **Maximal Devotion (Motivational):** This refers to the completeness of the agent's commitment to morality as a master motive. Is morality the sole governing principle of the life?
  3.  **Maximal Purity (Deontological/Virtue):** This refers to the moral cleanliness of the agent's conduct. Is the agent free from vice, sin, or complicity in evil?

  Wolf's argument is primarily directed against **Maximal Devotion**. She contends that if you make Devotion (2) your ideal, you necessarily sacrifice the non-moral virtues that make a life desirable. She is less concerned with Output (1) than with the texture of the life lived. She worries that a life of Maximal Devotion is boring and unbalanced.

  Schindler **qualifies** Wolf's argument by demonstrating that Maximal Output (1) does not require Maximal Devotion (2), nor does it require Maximal Purity (3). In fact, in Schindler's specific context, Maximal Devotion might have resulted in *less* Maximal Output. A moral saint in 1940s Kraków—someone who openly refused Nazi ideology on principle or refused to profit from war—would likely have been arrested or killed immediately, saving no one. Schindler's "immoral" traits (his greed, his party membership, his charm, his ability to navigate the black market) were instrumental to his moral success.

  This exposes a gap in Wolf's analysis. Wolf assumes that non-moral virtues (like having a hobby or loving opera) are merely *compatible* with morality, or that sacrificing them makes the saint less lovable. Schindler suggests that in certain contexts, what Wolf classifies as "non-moral" or even "immoral" traits (cunning, avarice, social manipulation) can be *constitutive* of moral success. Wolf worries the saint is too boring to love; Schindler shows us that the "sinner" might be more effective at saving lives than the saint. Thus, Schindler confirms Wolf's suspicion that the "saintly life" (Maximal Devotion) is not the ideal we should aim for, but for a different reason than she gives. We shouldn't aim for it not just because it makes us boring, but because it might make us ineffective.

  However, Schindler also highlights a tension Wolf ignores. While Schindler's lack of Maximal Devotion allowed for Maximal Output, his lack of Maximal Purity (3) remains troubling. He was complicit in the Nazi war machine until he wasn't. Wolf's framework doesn't easily handle the "dirty hands" problem. She critiques the saint for being too good; she doesn't fully account for the agent who is "good enough" to save lives but "bad enough" to be morally ambiguous.

  ### What the Framing Cannot Settle

  Ultimately, applying the "moral saints" framing to Oskar Schindler reaches a hard limit. Wolf's essay is a work of **normative ethics regarding personal ideals**: it asks, "What kind of person should I try to be?" Schindler is a case of **historical particularity**: he asks, "What did this person do in this specific catastrophe?"

  The moral-saints framing cannot settle whether Schindler's life is *emulable*. Wolf argues we shouldn't want to be saints. Schindler proves we shouldn't want to be saints, but he does not prove we should want to be *Schindlers*. His vices were instrumental only because of the unique corruption of the Nazi regime; in a just society, those same vices would simply be vices. Wolf's framework cannot distinguish between flaws that are incidentally useful in a broken world and flaws that are intrinsically corrosive.

  Furthermore, the framing cannot resolve the question of Schindler's own moral worth. Wolf is concerned with the attractiveness of a life to the agent and their loved ones. Schindler died penniless and unbalanced, supported by the Jews he saved. Was his life "good" for him? Wolf's theory suggests a balanced life is better for the agent. Schindler's life suggests a life of chaotic obsession can yield transcendent meaning, even if it lacks balance. The "moral saints" argument is designed to evaluate the *structure* of a moral life, not the *redemption* of a flawed one. It can tell us Schindler was not a saint, and that this was likely for the best. But it cannot tell us if his specific alloy of vice and virtue is a model for excellence, or merely a historical anomaly that we are right to admire but wrong to copy.
