prompt: |-
  I am a high school student working on an independent-study paper in the philosophy of mathematics, and I have been reading a translated excerpt from Thoralf Skolem's 1922 paper on axiomatized set theory. There is one passage that I cannot get past, and I would be grateful for help understanding it. Skolem writes: "So far as I know, no one has called attention to this peculiar and apparently paradoxical state of affairs. By virtue of the axioms we can prove the existence of higher cardinalities..." He then asks how the entire domain B—the domain of a countable model of Zermelo's axioms—can already be enumerated by means of the finite positive integers.

  My study group has read that the resolution has something to do with countability being "relative" to a model, but I do not see how that helps. If the model's domain can be enumerated with the positive integers, then surely every set in the model is countable, and the set that the model calls uncountable is countable too. Does Skolem's passage therefore show that uncountability is an illusion, or at least that it is not a property of sets themselves but only of how we describe them? I would be grateful for a careful reconstruction of what Skolem is asking in this passage, what the standard resolution is, and where my reading goes wrong. I am not asking for citations, only for a clear explanation of the reasoning.
reasoning: |-
  Here's a thinking process that leads to the suggested explanation:

  1.  **Analyze the User's Request:**
