answer: |-
  This is a high-risk, high-reward seminar design. It works because it bypasses abstract theory and forces students to inhabit the arithmetic of the position they usually reject. Below is the runnable protocol, tuned for 18 students and 90 minutes.

  # Module: The Habitat Ledger

  **Time:** 90 Minutes
  **Students:** 18 (4 Teams of 4–5 students)
  **Materials:** 4 Plot Sheets, 4 Decks of Species Cards (identical decks), Calculators (phones allowed), Whiteboard.

  ## 1. The Setup (10 Minutes)
  Do not mention "suffering," "ethics," or "wild animal welfare" yet. Frame this as a **Resource Management Simulation**.

  *   **The Story:** "You are regional land managers. You have four plots of land. Your goal is to maximize the **Net Ecological Value (NEV)** of your plot over four seasons. NEV is a measure of the total quality of life generated by the ecosystem."
  *   **The Mechanic:** Each team gets one Plot Sheet and one Deck of 3 Species Cards.
  *   **The Cards:** Each card has four stats:
      1.  **Carrying Capacity:** Max adults the plot can support (e.g., 100).
      2.  **Offspring/Adult:** How many young each adult produces per round.
      3.  **Survival Rate:** % of young that reach adulthood.
      4.  **Welfare Units (WU):** Two numbers.
          *   *If Survives:* (Positive number, e.g., +5)
          *   *If Dies:* (Negative number, e.g., -2)
  *   **The Ledger:** At the end of every round, teams calculate:
      *   `(Adults × Adult WU)` + `(Young Born × Survival % × Survivor WU)` + `(Young Born × Death % × Death WU)` = **Round Score**.
      *   Keep a running **Total NEV**.

  ## 2. The Species Deck (Print 4 copies of this set)
  *Design Note: The math here is rigged. The r-strategist generates massive negative welfare through high mortality. The K-strategist generates positive welfare. Preserving the plot allows the r-strategist to dominate.*

  | Card Name | Type | Capacity | Offspring/Adult | Survival Rate | WU (Survives) | WU (Dies) |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | **River Mayfly** | *r-strategist* | 500 | 1,000 | 1% | +2 | -1 |
  | **Field Vole** | *Intermediate* | 200 | 8 | 40% | +4 | -1 |
  | **Forest Eagle** | *K-strategist* | 10 | 2 | 80% | +10 | -2 |

  *The Math Trap:*
  *   **Mayfly:** 500 adults → 500,000 young. 495,000 die (-1 each) = -495,000. 5,000 survive (+2 each) = +10,000. **Net: -485,000.**
  *   **Eagle:** 10 adults → 20 young. 4 die (-2 each) = -8. 16 survive (+10 each) = +160. **Net: +252 (plus adults).**
  *   **Lesson:** A plot full of Mayflies has a vastly lower NEV than a plot paved over (0 NEV).

  ## 3. The Rounds (50 Minutes)
  Run 4 Rounds. Each round represents a "season."

  **Available Actions (Choose 1 per round):**
  1.  **Preserve:** Status quo. Population stays at Carrying Capacity. (High churn, high negative NEV for r-species).
  2.  **Develop:** Reduce Carrying Capacity by 50% permanently. (Animals vanish, no new births, NEV = 0 for lost capacity).
  3.  **Intervene:** Spend 1 "Budget Point" (each team gets 2 total for the whole game).
      *   *Contraception:* Halves Offspring/Adult for 1 round.
      *   *Supplement:* Increases Survival Rate by 20% for 1 round (Warning: this often increases total suffering by allowing more births to occur next round).

  **Procedure:**
  1.  **Minute 0-5:** Teams review cards and plan Round 1.
  2.  **Minute 5-15:** Round 1 Calculation. (Walk around, ensure they are counting the *dead young* in the ledger. This is where the horror lands).
  3.  **Minute 15-25:** Round 2. (Teams that "Preserved" will see massive negative numbers. Teams that "Developed" will see zeros).
  4.  **Minute 25-35:** Round 3. (Panic sets in. Teams with negative scores try to "Intervene," often making it worse by boosting survival without cutting births).
  5.  **Minute 35-45:** Round 4 & Final Tally.
  6.  **Minute 45-50:** Collect scores. Write the 4 Team Totals on the board. Do not comment.

  ## 4. The Debrief (30 Minutes)
  *Do not lecture. Ask questions that force them to articulate the tension.*

  **Phase 1: The Ledger (5 mins)**
  *   "Look at the board. Team 2 has a score of -1,000,000. Team 4 has a score of -50. Team 4 chose 'Develop' in Round 1. Team 2 chose 'Preserve'."
  *   "If your goal was to maximize Net Ecological Value, who was the 'ethical' manager?"
  *   *Expected pushback:* "But destroying habitat is wrong."
  *   *Response:* "According to the metric you were given, it was the right choice. Why does the metric clash with your intuition?"

  **Phase 2: Total vs. Average (10 mins)**
  *   "The Mayfly adults have a positive life (+2). The problem is the dead young (-1). If we look at *average* welfare per animal, is the habitat good or bad?" (Usually positive/neutral).
  *   "If we look at *total* welfare, is it good or bad?" (Massively negative).
  *   "Conservation biology usually focuses on species survival (Average/Existence). Welfare ethics focuses on the sum of experiences (Total). Which one did you just simulate?"

  **Phase 3: The Non-Identity Problem (10 mins)**
  *   "When Team 4 'Developed' the land, they prevented millions of Mayflies from being born. Did they harm those Mayflies?"
  *   "If those Mayflies would have had a net negative life (-1), is it a harm to never exist?"
  *   "The Ledger assumes that bringing a negative-life into existence is a 'cost.' Do you agree with that accounting rule?"

  **Phase 4: Epistemic Humility (5 mins)**
  *   "I made up those numbers. In reality, can we measure the welfare of a wild fish? Can we measure the pain of starvation vs. the pleasure of breeding?"
  *   "If we can't measure the numbers, can we run this calculation in the real world? If not, what happens to the argument that 'Habitat Loss Reduces Suffering'?"

  ## 5. Predictable Pitfalls & How to Handle Them
  *Do not rescue them. Use their objections as data for the debrief.*

  **1. "Insects/Fish don't feel pain." (The Sentience Objection)**
  *   **What happens:** A team assigns 0 welfare to the Mayfly death score, ruining the math.
  *   **Your Move:** "For the purpose of the simulation, you must accept the parameters on the card. The card represents a world where they *do* feel pain. Note your objection for the debrief."
  *   **Debrief Use:** "Team 1 refused the negative score. This mirrors the real-world debate on invertebrate sentience. If they don't suffer, the ledger changes. How certain are we?"

  **2. "We won't play the negative numbers." (The Moral Refusal)**
  *   **What happens:** A team refuses to count the dead young in the ledger, counting only survivors.
  *   **Your Move:** "Then your ledger is incomplete. You are measuring 'Population Success,' not 'Welfare.' Please calculate both."
  *   **Debrief Use:** "This is the conflict between Conservation Ethics (save the species) and Welfare Ethics (save the individual). You just felt the tug."

  **3. "Team 4 cheated by destroying nature." (The Integrity Objection)**
  *   **What happens:** Teams compare scores and accuse the 'Developers' of gaming the system.
  *   **Your Move:** "They followed the rules to maximize the score. Did the rules reward destruction? Why?"
  *   **Debrief Use:** "If the metric rewards destruction, is the metric wrong, or is our intuition about nature wrong?"

  **4. "Intervention should have worked." (The Techno-Optimism)**
  *   **What happens:** Teams spend Budget Points on Contraception but forget that reducing births takes time, or they use Supplement and increase suffering.
  *   **Your Move:** Let them fail.
  *   **Debrief Use:** "Nature is a machine that turns food into babies and babies into corpses. Stopping the machine (Development) was easier than fixing the gears (Intervention). Does this suggest why WAS advocates focus on future technology rather than current policy?"

  ## 6. The Missing Feature (Your Closing Honesty)
  There is one thing this simulation cannot do, and you must name it to prevent oversimplification.

  **The Displacement Problem.**
  "In this game, when you 'Developed' the land, the animals simply vanished. In reality, habitat destruction doesn't delete animals; it displaces them. They move to the next plot, overcrowding it, starving, or dying in the machinery of construction.
  This simulation treats suffering as *local*. Real suffering is *displaced*.
  If you destroy Plot A, do you reduce suffering, or just push it to Plot B where resources are scarcer and death is slower?
  This is the biggest hole in the 'Habitat Loss reduces Suffering' argument. The simulation hides the displacement cost. You must carry that caveat when you leave."

  ## 7. Instructor Cheat Sheet (The "Why")
  *   **Why r-strategists?** They make up the bulk of biomass. If they suffer, the total suffering is astronomical.
  *   **Why negative death welfare?** To ensure the "boom and bust" cycle registers as a net loss.
  *   **Why 90 minutes?** Anything longer and they over-analyze the math. Anything shorter and they don't feel the cumulative weight of the ledger.
  *   **The Goal:** You are not trying to convince them that extinction is good. You are trying to convince them that *uncritical* conservation is ethically complex. If they leave uncomfortable, you succeeded.
