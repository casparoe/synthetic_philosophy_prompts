      *   **Desired Outcome:** Students realize that "protecting" habitat often maximizes negative welfare due to r-selected species (high reproduction, high mortality, negative welfare). "Developing" habitat reduces total suffering.
      *   **Debrief Requirements:** Map to total vs. average welfare, non-identity problem (harm of bringing into existence), epistemic limitations (we can't measure welfare), and the assumption that existence of negative life is a harm.
      *   **Logistics:** Predict pitfalls (refusing numbers, insect sentience debates, cross-team comparison) and how to handle them without rescuing.
      *   **Honesty:** Acknowledge what the simulation *cannot* do (capture ecological complexity/interdependence).

  2.  **Deconstruct the Simulation Mechanics:**
      *   *Teams:* 18 students / 4-5 teams = ~4 students per team. Let's go with 4 teams of 4-5 students (one might be 3, or just 4 teams of 4 and 2 observers/rotators, but 4 teams of 4-5 is easier). Let's aim for 4 teams of 4-5 (16-20 slots, fits 18).
      *   *Rounds:* 4-5 rounds fits a 90-minute session (including setup and debrief).
