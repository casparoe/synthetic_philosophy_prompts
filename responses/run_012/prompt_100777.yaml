answer: |-
  # Q&A Prep Sheet: Know-How as Practical Representation

  ## 1. Strategic Concessions (Give these early)
  *   **Concede Gradability Nuance:** Admit that your view needs a more robust account of *degrees* of know-how than you have currently developed. Don't fight the epistemologists on whether skills come in degrees (they do); fight on *what* is graduating (the fidelity of the representation, not the truth of a proposition).
  *   **Concede "Representation" Risk:** Acknowledge to the lab that "representation" is a loaded term. Clarify you are not committing to a homunculus reading a map, but to a state with *direction of fit* (world-to-mind) that is not *truth-apt*. This disarms the "explanatory fiction" charge before it lands.

  ## 2. The Critical Vulnerability ("The Kill Shot")
  **The Objection:** *The Normativity Gap.*
  **Who:** The Senior Intellectualist Epistemologist.
  **The Charge:** "You claim practical representations have correctness conditions (on/off track) but not truth conditions (true/false). But without truth conditions, how do you avoid collapsing into mere causal success? If the content isn't truth-apt, 'correctness' is just 'causal efficacy.' You haven't escaped Ryle; you've just added a label."
  **Why it kills the view:** If you cannot distinguish *normative correctness* from *causal success* without invoking truth conditions, your "Practical Representation" is empty. You lose the Intellectualist's normativity without gaining the Rylean's simplicity.
  **Strategy:** This is the battle you must win. Do not concede this. Anchor normativity in the *function* of the system (teleology) rather than propositional truth.

  ## 3. The "Hope Nobody Asks" Question
  **The Question:** "If the agent cannot recognize the content of the practical representation even when it is described back to her (as you claim with the surgeon), on what grounds do *you* attribute that specific content rather than another? What makes it a representation of *procedure X* and not just a causal trigger for *movement Y*?"
  **Why it's fatal:** It exposes a third-person access problem. If the content is in principle inaccessible to the agent, it looks like an explanatory posit with no empirical constraints. It makes your theory unfalsifiable.

  ## 4. Top Objections (Ordered by Damage)

  ### Objection #1: The "Disguised Proposition" (Intellectualist Collapse)
  **Who:** The Epistemology Reading Group.
  **Vocabulary:** "Practical mode of presentation," "Propositional attitude," "Content identity."
  **The Charge:** "You say the content is a procedure, not a fact. But if it guides action and assesses correctness, it functions exactly like a proposition under a practical mode of presentation (Stanley & Williamson). You are distinguishing *syntax* (procedure vs. fact) when the distinction is in the *mode of access*. You haven't found a new species of knowledge; you've just renamed the old one."
  **Your 2-Minute Reply:**
  "The Intellectualist claims that to know how to φ, I must stand in a knowledge relation to a proposition *p*. My claim is that the surgeon does not entertain *p* (e.g., 'the tissue is fragile'). She entertains a directive: *'Ease pressure now.'* The difference isn't just mode of presentation; it's direction of fit. A proposition fits the world (truth); a procedure fits the action (success). If I treat 'Ease pressure' as a proposition, it is either true or false that I ease pressure. But the surgeon's representation isn't about whether she *is* easing pressure; it is the *command* to do so. If it were propositional, following the advice would require a second-order belief ('I am following the advice'). Recalcitrant skills show we bypass that second order. We track the procedure directly. That is not a proposition in disguise; it is a different cognitive kind."
  **Where the Reply is Soft:** You are leaning heavily on the "direction of fit" distinction. If they argue that directives can be propositional (e.g., imperative logic), you risk circling back to their taxonomy. You need to ensure "procedure" doesn't sound like "imperative sentence."

  ### Objection #2: The "Interference Effect" (Empirical Falsification)
  **Who:** The Automaticity Researcher.
  **Vocabulary:** "Explicit monitoring theory," "Reinvestment," "Skill degradation," "Verbal override."
  **The Charge:** "You argue skills are reason-responsive to advice. But my data shows that for experts, verbal instruction *degrades* performance (choking under pressure/reinvestment). If the skill relies on a practical representation, why does making that representation explicit (via advice) break the mechanism? This suggests the skill works best when *non-representational*."
  **Your 2-Minute Reply:**
  "This is a crucial distinction between *acquisition/modulation* and *execution*. My claim is that the skill is guided by a practical representation, not that it is *mediated by conscious verbalization*. The 'Interference Effect' happens when the agent tries to translate the practical representation into a propositional rule mid-flow. That translation is the error. The advice ('go lighter') works not by becoming a rule, but by tuning the existing practical representation. Think of it like calibrating a gyroscope. If you try to steer the gyroscope manually (propositional control), it wobbles. If you adjust the calibration settings (practical representation tuning), it stabilizes. The degradation data supports my view: it shows that converting practical content to propositional content breaks the skill. This confirms they are distinct kinds."
  **Where the Reply is Soft:** You are assuming the "calibration" is representational. The researcher might argue calibration is purely associative/Hebbian. You need to hold the line that "tuning" implies a normative target, which implies representation.

  ### Objection #3: The "Explanatory Idle" (Enactivist Elimination)
  **Who:** The Motor-Learning Lab (Enactivists).
  **Vocabulary:** "Sensorimotor contingency," "Coupling," "Embodied cognition," "Representational hunger."
  **The Charge:** "You posit a 'practical representation' to explain the disposition. But the disposition + environment coupling explains the behavior without the representational middleman. You are suffering from 'representational hunger.' The 'correctness' is just successful coupling. Why multiply entities?"
  **Your 2-Minute Reply:**
  "Successful coupling explains *that* the action happened, but not *why it was appropriate* in a novel context. A thermostat couples with temperature, but it doesn't have know-how. The surgeon encounters tissue tearing in a way she has never seen before. A bare disposition (habit) fails in novelty. A practical representation allows for *generalization* without *articulation*. She tracks 'resistance' as a procedural variable, not a fixed stimulus-response pair. The representation is the variable binding that allows the disposition to flex. Without it, you can't explain transfer of skill to new contexts. The coupling is the vehicle; the representation is the map the vehicle is following, even if the map isn't written in words."
  **Where the Reply is Soft:** Enactivists deny the need for a "map" even in novel contexts (they argue for "improvisation"). If you lean too hard on "map," you sound computationalist. Keep emphasizing "guidance" rather than "planning."

  ## 5. The Overlap Note (Epistemologists vs. Enactivists)
  **The Shared Complaint:** *The Instability of the Middle Ground.*
  *   **Epistemologists say:** "Your 'Practical Representation' is just a **Proposition** wearing a disguise." (Collapses Up)
  *   **Enactivists say:** "Your 'Practical Representation' is just a **Disposition** wearing a disguise." (Collapses Down)
  *   **The Convergence:** Both sides think your category is metaphysically unstable. They believe nature is binary: either it has truth conditions (Mind) or it has causal conditions (Body).
  *   **Your Counter:** You must insist that *procedures* are a sui generis category. Use the "Recalcitrant Skill" as the wedge: It is too flexible to be a mere disposition (Ryle) but too opaque to be a proposition (Intellectualism). The instability *is* the feature, not the bug.

  ## 6. Session Survival Strategy
  *   **If the Automaticity Researcher pushes hard:** Pivot to the distinction between *online control* (non-representational) and *strategic modulation* (representational). Concede that execution is embodied, but insist the *guidance* is representational.
  *   **If the Intellectualists push on Content:** Do not get bogged down in semantics. Point to the *phenomenology of failure*. When the surgeon fails, she doesn't feel "false"; she feels "blocked" or "resistant." That is procedural error, not propositional falsity.
  *   **If the Enactivists push on Ontology:** Ask them to explain *normative error* without representation. If a agent couples "wrongly" (e.g., cuts the tissue), how is that different from a rock falling "wrongly"? They need normativity; you provide the vehicle for it.

  **Final Reminder:** Your strongest asset is the **Surgeon Example**. Keep returning to it. It is the concrete intuition pump that makes the abstract taxonomy plausible. If they break the example, they break the theory. If they accept the example, they must accept your taxonomy to explain it.
