answer: |-
  1. You argue every famine involves a distribution choice. But isn't 'choice' impossible when infrastructure is destroyed by conflict?
  Follow-up: So you're claiming logistics are always a political decision, never a physical constraint?

  2. In Bengal 1943, food moved while people starved. Is that market failure or political choice, and how do you exclude the war and cyclone as natural causes?
  Follow-up: If the cyclone hadn't hit, would you still call the resulting starvation purely political?

  3. Ireland was part of the UK with representation, yet grain shipped out while people died. Does this prove democracies can starve their own, contradicting your claim about free press preventing famine?
  Follow-up: So the free press knew, but simply didn't care enough to stop it?

  4. In the Great Leap Forward, food was requisitioned based on false reports. What exactly was the crime here, and who committed it?
  Follow-up: Are you naming Mao specifically, or the system itself?

  5. If causation runs through thousands of small decisions—quotas, exaggerations, urban prioritisation—where is the criminal?
  Follow-up: So does your framework diffuse responsibility just as efficiently as blaming nature?

  6. Does calling famine a crime require intent, or only a foreseeable alternative that somebody chose not to take?
  Follow-up: So negligence is morally equivalent to malice in your history?

  7. You say somebody had the power to choose differently. Can you name a specific official in a specific year who could have stopped a specific famine single-handedly?
  Follow-up: If no single person could stop it, how is it a discrete political choice?

  8. If all famine is political crime, does that mean modern aid workers are accomplices unless they change the regime?
  Follow-up: So feeding the starving without overthrowing the government is unethical?
