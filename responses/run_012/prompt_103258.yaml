      *   The "Smuggle": This assumes a specific theory of personal identity or welfare aggregation. If I care about my future self *because* it's me, that's prudential. If I care about a future person *because* they are a person, that's moral. Conflating them assumes a specific view on the moral significance of personal identity over time.
      *   The friend's conclusion: "Are persons at different times the right units of moral concern?" This is a radical mereological question (temporal parts vs. enduring selves).

  3.  **Drafting the Agenda - Step-by-Step:**

