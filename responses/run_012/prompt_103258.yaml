      *   *Key Insight to highlight:* The friend's argument relies on a specific view of impartiality (agent-neutral). But prudential concern is agent-relative. The conflict arises when trying to aggregate agent-relative concerns into an agent-neutral social welfare function. That's the "smuggle." The agenda should target the aggregation problem.

      *   *Revised Priority 1:* Focus on the aggregation of prudential vs. moral concerns. This is more tractable than full-blown metaphysics of time but hits the friend's "conflation" point harder. Actually, no, the metaphysics is more foundational. If the "person" isn't the unit, aggregation doesn't matter. I will stick with Metaphysics/Units as #1, but frame it as "The Constitution of the Intertemporal Subject."

      *   *Wait, one more thought:* The friend says "Prudential and Moral cannot be prised apart." This is a strong claim. If the postdoc can show they *can* be prised apart conceptually, the friend's argument collapses. But if they *can't*, then the friend is right that we need a new moral unit. So investigating the *possibility of separation* is crucial.

