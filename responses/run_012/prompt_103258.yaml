answer: |-
  This is a high-stakes hire. You are not looking for someone to summarize the literature on the Ramsey Rule; you are looking for someone to locate the conceptual fault line your friend exploited. Your friend's argument is powerful because it treats the discount rate as a single variable when it is a composite, and then argues that the composite is incoherent. Your intuition that something is "smuggled in" is correct: the argument smuggles in a specific metaphysics of time and a specific theory of aggregation without defending them.

  Here is the agenda I would write into the job description, ordered by strategic priority.

  ### The Criteria for Ordering

  I have ranked these questions based on three weighted criteria:
  1.  **Foundationality:** Does answering this question determine the validity of the subsequent questions? (Highest weight).
  2.  **Philosophical Tractability:** Can a philosopher make genuine progress on this in two years, or does it require data/modeling best left to empirical scientists?
  3.  **Policy Leverage:** If we settle this, does it actually change how we calculate the Social Cost of Carbon or evaluate intergenerational justice?

  There is a tension here. The most foundational questions (metaphysics of time) are often the least policy-relevant in the short term. The most policy-relevant questions (what number to plug into the model) are often empirical disguises. I have prioritized **Foundationality** because if your friend is right that the "units of concern" are wrong, no amount of tweaking the rate will fix the model. However, I have constrained this by **Tractability** to ensure the postdoc produces a thesis, not just a puzzle.

  ### The Research Agenda

  #### Priority 1: The Constitution of the Intertemporal Moral Unit
  **The Question:** *Under what conditions does a "person" at $t_1$ and a "person" at $t_2$ constitute a single unit of moral concern versus two distinct units?*

  **Why First:** This directly addresses your friend's concluding provocation. Standard discounting assumes the "person" is the stable unit. Your friend suggests this might be the error. If the correct unit is the "temporal part" or the "life-narrative," the mathematics of discounting changes entirely. If the correct unit is the "species" or "civilization," it changes again. Before we can argue about how to weight future welfare, we must define *whose* welfare is being weighted.
  **Tractability:** High. This is classic metaphysics and ethics (personal identity, what matters in survival). It requires no empirical data, only conceptual rigor.
  **Policy Leverage:** High. If the "person" is not the unit, standard cost-benefit analysis (CBA) is category-error prone, not just parameter-wrong.
  **The "Smuggle" to Hunt:** The assumption that moral impartiality requires treating temporal slices as identical to spatial locations.

  #### Priority 2: The Normative Asymmetry of Time and Space
  **The Question:** *Does temporal distance possess normative properties that spatial distance lacks, specifically regarding causal power and epistemic access?*

  **Why Second:** Your friend's strongest rhetorical move was the spatial analogy (we don't discount for distance in meters, so why in years?). This analogy only holds if time and space are morally isomorphic. They are not. Time involves a direction of causation and a gradient of uncertainty that space does not. A person in London cannot causally affect a person in Tokyo without intermediaries, but a person *now* causally constitutes the world a person *later* inhabits.
  **Tractability:** High. This is conceptual analysis of causation and ethics.
  **Policy Leverage:** Medium-High. If the analogy breaks, it justifies a non-zero pure time preference based on causal efficacy or epistemic uncertainty, rather than arbitrary discrimination.
  **The "Smuggle" to Hunt:** The assumption that "impartiality" requires ignoring all relational differences, including causal connectivity.

  #### Priority 3: The Separability of Prudential and Moral Discounting
  **The Question:** *Is the "prudential" discount rate (how I value my future self) conceptually distinct from the "moral" discount rate (how I value a future stranger), or are they derivations of a single principle of temporal neutrality?*

  **Why Third:** Your friend claims these cannot be prised apart. If they are distinct, the economist's conflation is a technical error. If they are the same, then your friend is right that a non-zero moral rate implies a failure of impartiality. This question depends on Q1 and Q2. If the "moral unit" is the life-narrative (Q1), then prudential and moral concerns might collapse into one another.
  **Tractability:** Medium. This requires engaging with rational choice theory and moral psychology, which risks drifting into empirical territory. The postdoc must stay normative.
  **Policy Leverage:** High. This determines whether we can justify a low social discount rate even if individuals have high personal discount rates.
  **The "Smuggle" to Hunt:** The assumption that rational prudence and moral impartiality must yield the same temporal weighting function.

  ### Questions to Deliberately Deprioritize

  **1. The Empirical Measurement of $\delta$ (Delta)**
  *Do not* task the postdoc with investigating what discount rates people *actually* use, or what rates stabilize economic growth.
  *   **Reason:** This is an empirical disguise. It looks like philosophy ("what ought we to value?") but it is actually psychology or macroeconomics ("what do we value?" / "what works?"). A philosopher cannot solve this with armchair reflection.
  *   **Risk:** It consumes two years producing a literature review that an economist could have updated in a week.

  **2. The History of the Ramsey Rule**
  *Do not* task the postdoc with a historical exegesis of Ramsey, Pigou, or Sidgwick unless it directly illuminates the "three parameters" distinction.
  *   **Reason:** Low tractability for high stakes. Knowing what Ramsey thought in 1928 does not solve the conceptual conflation your friend identified in 2024.
  *   **Risk:** Antiquarianism masquerading as conceptual clarity.

  **3. Integrated Assessment Model (IAM) Tuning**
  *Do not* task the postdoc with proposing a specific numerical rate for climate models.
  *   **Reason:** Premature. Without settling Q1 and Q2, proposing a number is guesswork.
  *   **Risk:** The postdoc becomes a consultant rather than a researcher.

  ### What Would Change the Ranking? (Triggers)

  You should instruct the postdoc that this agenda is provisional. The following findings in the first 12 months should trigger a re-ordering:

  **1. If the Spatial Analogy Holds Up Under Scrutiny (Move Q2 to Priority 1)**
  If the postdoc finds that causal asymmetry is morally irrelevant to *impartiality* (i.e., if we accept that moral weight must be independent of causal power), then the spatial analogy stands. In this case, Q1 (Units of Concern) becomes secondary to the immediate need to dismantle the justification for time preference entirely. The agenda shifts from "fixing the model" to "radical intergenerational egalitarianism."

  **2. If "Personhood" Proves Indispensable for Policy (Move Q3 to Priority 1)**
  If it becomes clear that legal and policy frameworks cannot operate without the "person" as the unit (regardless of metaphysical truth), then Q1 becomes a luxury. The agenda must shift to Q3: how to separate prudential and moral rates *within* the constraint of person-based accounting. This prioritizes tractability and policy leverage over foundationality.

  **3. If the "Three Parameters" are Mathematically Inseparable (Deprioritize All)**
  If the postdoc discovers that in any coherent decision-theoretic framework, the descriptive, prudential, and moral rates *must* converge to a single variable, then the philosophical project fails. The trigger here is a formal proof. If this happens, the agenda should shift immediately to non-ideal theory: given that we *must* discount, how do we mitigate the injustice?

  ### Summary for the Job Description

  You are hiring a philosopher to act as a conceptual auditor for economic modeling. The central hypothesis is that the "Pure Time Preference" debate is stalled because it conflates metaphysics (who exists?), epistemology (what can we know?), and ethics (what do we owe?).

  The successful candidate will not propose a new discount rate. They will determine whether the discount rate is the right kind of tool to use at all. They must be willing to tell the economists that their parameters are philosophically incoherent, but also willing to tell the philosophers that their intuitions about impartiality may be mathematically naive.

  Your friend's argument is that time is space, and therefore discounting is discrimination. Your postdoc's job is to prove that time is *not* space, or that discrimination is sometimes required by the structure of agency itself. That is where the "smuggled" premise lies: in the nature of agency across time. That is the question worth two years.
