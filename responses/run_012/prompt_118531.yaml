      *   *The "Requires One" Verdict:* Rosa is drawing a real distinction (Winner's two categories), but Tariq is right that the "requirement" is often a result of prior social choices (path dependence). It's not *physically* impossible to run an assembly line democratically, but it's *economically/structurally* inhibited by the design.
