prompt: |-
  I recently took a job at a small development charity, I write grant applications and evidence summaries, and the more I look at what we actually do the less it hangs together. Officially we're institutionalists: the whole pitch to donors is that poverty is caused by bad institutions, that geography and culture are mostly excuses, so we fund rule-of-law projects, anti-corruption work, property rights. But the actual grantmaking runs on RCTs — cash transfers, deworming, bednets — and whenever I ask whether one of the governance projects actually worked, the answer is some version of "you can't randomize a legal system." So what are we presupposing here? That there are two separate kinds of causal claim, local and macro, one of which gets tested and the other of which is just known? That "institutions" and "geography" are distinct additive factors rather than the same thing counted twice (bad geography produces bad institutions produces...)? And what about the standard move of instrumenting a country's institutions today with its colonial settler mortality — does using history that way presuppose that history is basically a natural experiment we can read off like a trial, and if so does that survive the complaints I keep hearing that the instrument is broken anyway? Please take the practice apart: what view of causation, of evidence, and of what a "fundamental cause" is does it commit us to, which rival views does it quietly rule out, and what's the strongest thing an anti-institutionalist — or someone who thinks we simply can't know why some nations are rich — could say we're smuggling in? Also, honestly: is the split between our donors' theory and our grantmaking actually incoherent, or can you hold both without contradiction? I'd like to know what's strictly presupposed versus what we could drop without changing anything we do.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the User's Query:**

      *   **Context:** The user works at a small development charity.
      *   **Role:** Writes grant applications and evidence summaries.
      *   **The Tension:**
          *   *Official Pitch (Donor-facing):* Institutionalism (Acemoglu/Robinson style). Poverty = bad institutions (rule of law, property rights, anti-corruption). Geography/culture are secondary.
          *   *Actual Grantmaking (Implementation):* Effective Altruism/RCT style (cash transfers, deworming, bednets). Focus on direct, measurable interventions.
          *   *The Gap:* Governance projects aren't RCT-able ("can't randomize a legal system").
      *   **The Questions:**
          *   What are we presupposing about causation (local vs. macro)?
          *   Are institutions and geography distinct or overlapping?
          *   What about the colonial settler mortality instrument (Acemoglu, Johnson, Robinson 2001)? Does it treat history as a natural experiment? Does it survive criticism?
          *   What view of causation/evidence/fundamental cause is committed here?
          *   What rival views are ruled out?
          *   What would an anti-institutionalist or agnostic say we're smuggling in?
          *   **Crucial Question:** Is this split incoherent, or can it be held without contradiction?
          *   **Practical Question:** What is strictly presupposed vs. what could be dropped without changing practice?

  2.  **Initial Analysis & Diagnosis:**

      *   This is a classic "Macro vs. Micro" development economics tension.
      *   *Macro (Institutions):* Explains *why* nations differ in long-term growth. Hard to test empirically (no counterfactuals).
      *   *Micro (RCTs):* Explains *what* works within a specific context to improve welfare. Easy to test (randomization).
      *   *The Charity's Position:* They are selling a Macro theory to donors (to justify the *importance* of the mission) but executing Micro interventions (to justify the *effectiveness* of the spend).
      *   *Is it incoherent?* Not necessarily, but it requires a specific philosophical bridge. If they claim Micro interventions *fix* Macro institutional problems, that's a stretch. If they claim Micro interventions *alleviate suffering* regardless of Macro institutions, that's consistent but undermines the "Institutionalist" pitch.
      *   *The Settler Mortality Instrument:* This is the AJR (2001) argument. It's heavily criticized (Albouy 2012, etc.). Relying on it as settled science is risky.
      *   *Causation:* They are mixing "Fundamental Cause" (Institutions) with "Proximate Cause" (Health/Income).

  3.  **Drafting the Response - Section by Section:**

      *   **Introduction:** Acknowledge the sharpness of the observation. This is a known fracture in development economics (Growth vs. Aid).
      *   **1. The Two Causal Regimes (Macro vs. Micro):**
          *   Define the split. Macro = Deep causes (Institutions). Micro = Proximate causes (Health, Cash).
          *   The presupposition: Hierarchy of causes. Institutions cause growth; growth (or aid) causes welfare.
          *   The tension: RCTs measure *average treatment effects* in a context. Institutionalism claims to explain the *context* itself.
      *   **2. The Instrumental Variable (Settler Mortality):**
          *   Address the AJR argument. Yes, it treats history as a natural experiment.
          *   Criticism: Data quality, linearity, exclusion restriction (did settlers affect institutions *only* through mortality?).
          *   Implication: If the instrument is broken, the "Institutions are Fundamental" claim loses its strongest empirical leg.
      *   **3. What View of Causation is Committed?**
          *   *Manipulability Theory:* We fund what we can manipulate (bednets). But we justify it with what we can't manipulate (history/institutions).
          *   *Fundamental vs. Proximate:* They are treating Institutions as the "Root" and RCT interventions as "Symptom relief."
          *   *Rival Views Ruled Out:*
              *   *Geographic Determinism:* (Sachs) You're saying geography doesn't matter, but if institutions are endogenous to geography, you're smuggling geography in.
              *   *Culturalism:* (Weber) You're ruling this out explicitly.
              *   *Radical Agnosticism:* (Rodrik?) Maybe there's no single recipe.
              *   *Structuralism/Dependency Theory:* Poverty is caused by external extraction, not internal institutions.
      *   **4. The Coherence Check (The Core Question):**
          *   Can you hold both?
          *   *Scenario A (Incoherent):* "We fix poverty by fixing institutions" + "We fund bednets." Bednets don't fix institutions.
          *   *Scenario B (Coherent - Paternalism):* "Institutions are too hard to fix right now, so we save lives while waiting for the macro stuff to sort itself out." (The 'Aid within Bad Institutions' argument).
          *   *Scenario C (Coherent - Human Capital):* "Healthy, educated people demand better institutions." (Micro builds Macro). This is the bridge they *need* but might not be articulating.
      *   **5. What an Anti-Institutionalist Would Say:**
          *   "You're claiming scientific rigor (RCTs) for the micro, but relying on contested historical econometrics for the macro."
          *   "You're assuming the state is a neutral vessel. If the state is predatory, your bednets get stolen or used for patronage."
          *   "You're smuggling in a teleological view of history (all nations converge to liberal democracy)."
      *   **6. Practical Advice (Presupposed vs. Droppable):**
          *   *Strictly Presupposed:* That micro-interventions have positive value regardless of macro context (or that the context is 'good enough').
          *   *Droppable:* The specific Acemoglu/Robinson historical narrative. You can keep the institutional *goal* without the settler mortality *proof*.
          *   *Droppable:* The claim that Micro *leads* to Macro (unless you have evidence).
          *   *Recommendation:* Shift the pitch. "Institutions set the ceiling, but aid raises the floor." Or "We build human capital so institutions *can* work later."

  4.  **Refining the Tone:**

      *   Needs to be intellectually rigorous but empathetic to the user's position.
      *   Avoid jargon where possible, but use precise economic/philosophical terms (instrumental variables, exclusion restriction, proximate vs. fundamental).
      *   Be honest about the "Settler Mortality" critique (it's significant).
      *   Address the "Incoherence" directly.

  5.  **Self-Correction/Nuance Check during Drafting:**

      *   *Correction:* I shouldn't say AJR is definitely wrong, but that it's heavily contested.
      *   *Nuance:* The user mentions "Institutionalist" as the pitch. Usually, Institutionalists (like Acemoglu) are skeptical of aid effectiveness if institutions are bad. The charity is doing the opposite (giving aid *despite* bad institutions?). I need to highlight this irony. If institutions are the *cause* of poverty, giving cash without fixing institutions might be pouring water into a leaky bucket.
      *   *Key Insight:* The charity is likely engaging in "Effective Altruism" tactics (RCTs) but "Political Economy" branding (Institutions). This is a marketing/strategy mismatch.
      *   *Philosophical angle:* Mention Nancy Cartwright or James Heckman on external validity. RCTs tell you what worked *there*, not *here*. Institutions tell you *why* it's *here* and not *there*.

  6.  **Final Polish:** Organize into clear headings. Ensure the "Is it incoherent?" question gets a definitive (but nuanced) answer. (It is *pragmatically* coherent but *theoretically* tense).

      *(Self-Correction on the "Incoherent" verdict)*: It's not logically contradictory to believe A causes B (Institutions -> Wealth) AND C helps D (Bednets -> Health). It becomes contradictory if you claim C fixes A, or if you claim A is the *only* thing that matters for D. I need to make sure this distinction is clear.

  7.  **Final Output Generation** (similar to the provided good response).
answer: |-
  This is an exceptionally sharp diagnosis of a fracture that runs through the center of modern development economics. You have identified the tension between the **Growth/Political Economy** literature (Acemoglu, Robinson, North) and the **Development Aid/Effective Altruism** literature (Banerjee, Duflo, Kremer).

  Your charity is selling a **Macro theory of change** to donors (Institutions cause Wealth) but executing a **Micro theory of change** in the field (Interventions cause Welfare).

  Here is an unpacking of the philosophical and econometric commitments you are operating under, what you are smuggling in, and whether the position is defensible.

  ### 1. The Two Causal Regimes: Fundamental vs. Proximate
  You asked what view of causation this commits you to. You are presupposing a **hierarchical model of causation**.

  *   **The Macro Claim (Institutions):** This treats institutions as a *fundamental cause*. In epidemiological terms, institutions are the "cause of the causes." They determine the environment in which all other causal mechanisms operate.
  *   **The Micro Claim (RCTs):** This treats interventions (bednets, cash) as *proximate causes*. They operate within the environment set by the institutions.

  **The Presupposition:** You are assuming that causal claims are separable by scale. You are claiming that one can validate proximate causes via Randomized Controlled Trials (internal validity) while validating fundamental causes via historical instrumental variables (structural validity).

  **The Tension:** RCTs rely on *ceteris paribus* (all else being equal). They measure the effect of $X$ on $Y$ holding the institutional context constant. Institutionalism claims the context *is* the variable that matters.
  *   **What you rule out:** You are quietly ruling out **contextual determinism**. If institutions are truly the dominant cause of poverty, the Average Treatment Effect (ATE) of a bednet in a corrupt kleptocracy should be significantly different (likely lower, due to leakage or lack of complementary infrastructure) than in a functioning democracy. By funding RCT-proven interventions regardless of the institutional score, you are presupposing that **micro-efficacy is robust to macro-failure.**

  ### 2. The Instrumental Variable: History as Experiment
  You asked about the "settler mortality" instrument (Acemoglu, Johnson, Robinson 2001).

  *   **The Move:** This paper argues that where European settlers died frequently (due to disease), they set up extractive institutions. Where they survived, they set up inclusive institutions. Since settler mortality is determined by geography/disease (exogenous), it can be used to isolate the causal effect of institutions on current GDP.
  *   **The Commitment:** Using this instrument presupposes that **history is a natural experiment.** It assumes the "exclusion restriction": Settler mortality affects current GDP *only* through institutions, not through other channels (e.g., persistent disease burdens, cultural transmission, geographic trade advantages).
  *   **The Critique:** You asked if this survives complaints that the instrument is broken. The short answer is: **It is heavily contested.** David Albouy (2012) demonstrated that the mortality data was often inconsistent, coded based on the very institutions it was supposed to predict, or conflated with worker mortality vs. settler mortality.
  *   **What you are smuggling in:** If you rely on this instrument as settled science, you are smuggling in a **teleological view of history.** It assumes that the "inclusive institutions" of the West are the unique, replicable endpoint of development, and that the only thing stopping other nations from reaching it is a historical accident (disease) rather than structural global dynamics (terms of trade, debt, extraction).

  ### 3. Is the Split Incoherent?
  Can you hold the Institutionalist pitch and the RCT grantmaking without contradiction?

  **Logically: Yes.**
  **Strategically: It is unstable.**

  It is not logically contradictory to say:
  1.  "Bad institutions are the ultimate reason nations are poor." (Macro)
  2.  "We cannot fix institutions easily." (Political constraint)
  3.  "Therefore, we will alleviate suffering within the current bad institutions using proven micro-tools." (Micro)

  This is the **"Band-Aid" Coherence.** It admits that the institutional pitch explains *why* the patient is sick, but the RCT work explains *how* we stop the bleeding while we wait for a surgeon who may never come.

  **However, it becomes incoherent if:**
  *   **Claim:** "Our work builds better institutions."
      *   **Reality:** Deworming and cash transfers do not automatically generate rule of law. In fact, some institutionalists argue that aid *undermines* institutions by relieving the state of the need to tax and represent its citizens (the "Rentier State" effect).
  *   **Claim:** "Institutions are the *only* thing that matters."
      *   **Reality:** If institutions were the only binding constraint, micro-interventions in bad institutional settings would fail. If your bednet distributions succeed despite corruption, then institutions are not the *sole* binding constraint.

  ### 4. What the Anti-Institutionalist Would Say
  If a Geographic Determinist (like Jeffrey Sachs) or a Structuralist sat down with your evidence summaries, here is what they would say you are smuggling in:

  1.  **The "Neutral State" Assumption:** You are assuming that when you fund a "property rights" workshop or a "cash transfer," the state acts as a neutral delivery mechanism. An anti-institutionalist would argue that in many contexts, the state is a predatory actor. By funding through the state, you are strengthening the capacity of the predator without changing its incentives.
  2.  **External Validity Hubris:** You are taking RCT results (which tell you what worked in *this* village at *this* time) and assuming they travel. Nancy Cartwright (philosopher of science) argues that RCTs tell you "it worked there," not "it will work here." Your institutional pitch claims to explain *why* "here" is different from "there," but your grantmaking ignores that distinction.
  3.  **Depoliticization:** By focusing on technical fixes (bednets, legal frameworks) you are smuggling in the assumption that poverty is a **technical problem** rather than a **political conflict.** Institutionalism says poverty is political (elite capture). RCTs treat poverty as engineering (input A -> output B). You are using the language of the former to fund the practice of the latter.

  ### 5. What is Strictly Presupposed vs. Droppable?
  You asked what you could drop without changing what you do.

  **Strictly Presupposed (The Non-Negotiables):**
  *   **Welfarism:** You must believe that increasing individual welfare (health, income) is good *even if* it doesn't fix the "root cause" (institutions). If you believe aid is useless without institutional change, you must stop grantmaking.
  *   **Stability:** You must presuppose that the institutional environment is stable enough for the RCT interventions to land. If the rule of law is *so* bad that cash is stolen 100% of the time, the RCT evidence doesn't apply. You are presupposing a "minimum threshold" of functionality.

  **Droppable (The Marketing Fluff):**
  *   **The Settler Mortality Narrative:** You do not need to claim that colonial settler mortality proves institutions are the *only* cause. You can simply argue, normatively, that "Rule of Law is good for development" without claiming you have a historical instrument that proves it is the *fundamental* cause.
  *   **The "Micro builds Macro" Bridge:** Many charities claim that healthy, educated citizens *demand* better institutions. This is a hopeful hypothesis, not an evidence-based fact. You could drop the claim that your deworming projects will lead to democracy. It changes nothing about the grantmaking, but it makes your theory of change more honest.
  *   **Geography vs. Institutions Dualism:** You don't need to claim geography is an "excuse." You can admit geography shapes institutions. This doesn't stop you from funding anti-corruption work; it just acknowledges why that work is hard.

  ### 6. The Verdict: How to Fix the Pitch
  The split is not incoherent, but it is **dishonest about the mechanism.**

  Currently, your pitch implies: *We fix the root cause (Institutions).*
  Your practice is: *We treat the symptoms (Poverty).*

  **The Coherent Synthesis:**
  Adopt a **"Human Capital as Precondition"** model.
  *   **Pitch:** "Institutions determine the long-term ceiling of a nation's wealth. However, broken institutions often trap populations in poverty traps where they cannot demand better governance. Our work raises the floor (health, income) to create the surplus capacity necessary for institutional reform to eventually take hold."
  *   **Why this works:** It respects the Institutionalists (institutions matter most for growth) and the RCT folks (we can save lives now). It admits you aren't fixing the legal system directly, but you aren't just handing out band-aids either; you are building the *substrate* upon which institutions might one day function.

  **Summary of what you are presupposing:**
  You are presupposing that **causation is modular.** You believe you can intervene on proximate causes (health/income) without solving fundamental causes (institutions), and that the value of the intervention remains positive even if the fundamental cause remains unaddressed. That is a defensible position, but it is a **humanitarian** position, not an **institutionalist** one. If you want to keep the institutionalist donors, you must explain why fixing symptoms doesn't make the disease worse (aid dependency). If you can't answer that, the incoherence is real.
