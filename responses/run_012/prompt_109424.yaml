  3.  **Identify Critical Disanalogies (The "Audit"):**
      *   *Commensurability:* Economic trade assumes a common medium (money) or at least ordinal preferences over bundles. Moral trade often involves incommensurable values (animals vs. humans). Can we say both are "better off" if there's no common metric? The economist says "by their own lights," which suggests ordinality, but moral truth claims complicate this.
      *   *Preference Endogeneity:* Economic theory treats preferences as exogenous/fixed. Moral actions often shape character/preferences (virtue ethics, adaptive preferences). Trading away a commitment might change who you are.
      *   *Alienability:* Can you sell integrity? In economics, property rights are clear. In morality, some duties might be non-transferable (Kantian constraints).
      *   *Truth vs. Taste:* Economics assumes subjective value. Morality often claims objective truth. If one party is wrong, trade might propagate error rather than create value.
      *   *Enforcement:* Economic trade relies on state enforcement. Moral trade relies on internal norms/reputation. If the stakes are high moral principles, reputation might not suffice.
      *   *Corruption:* The economist says institutions solve corruption. But if the act itself is morally problematic (e.g., compromising a duty), institutionalizing it doesn't fix the intrinsic wrong.

