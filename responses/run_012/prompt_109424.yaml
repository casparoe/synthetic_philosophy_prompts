answer: |-
  Dear Colleague,

  It is a pleasure to engage with this problem, and I share your suspicion that the economist in your group is asking the analogy to carry more weight than it can bear. To audit this properly, we must first reconstruct the mapping exactly as he intends it, because the persuasiveness of his conclusion relies on the intuitive plausibility of these correspondences before we subject them to scrutiny. The trading parties in his model are simply the moral agents themselves, situated as distinct loci of agency with divergent value functions. Their production possibilities correspond to the set of actions each agent can perform given their resources of time, money, and energy, while their opportunity costs are measured not in dollars but in the moral value foregone in their primary cause when they divert resources to the other's cause. The goods exchanged are the actions themselves, such as donating to a animal welfare charity or volunteering for a poverty relief organization, treated as commodities that can be delivered by one party on behalf of the other. The terms of trade are the ratio at which these actions are swapped, ideally settling where the marginal moral value for each party is equalized relative to their own axiologies. The contract is the mutual agreement to perform these actions, and its enforcement is mapped onto reputation mechanisms and social sanctions within the community rather than state coercion. Finally, the currency is the most strained element of the correspondence, posited as reciprocal moral credit or simply the promise of future cooperation, serving as the medium that allows the barter of actions to be settled over time.

  Having established this correspondence, we can see where the mapping begins to fracture, and I suggest we sort these failures by their proximity to the metaphysical foundations of the theory, as these are the ones that matter most for his conclusion that corruption is merely an institutional problem. The most critical failure concerns the definition of gains from trade when there is no common unit of value and no guarantee that the parties' rankings are comparable. In welfare economics, we assume preferences are ordinal and complete, allowing us to say an agent is better off if they move to a higher indifference curve, but we do not require interpersonal comparability to establish Pareto improvements. However, moral trade often involves agents who believe their values are objectively correct and incommensurable with others. If the animal advocate believes eating animals is morally equivalent to murder, and the poverty advocate believes starvation is the primary evil, they are not merely trading tastes; they are trading across a gap of moral truth claims. If morality is truth-apt, then one party may be objectively wrong, and facilitating a trade that entrenches error is not a gain but a complicity in wrongness. The economist's claim that both come out ahead by their own lights presupposes a subjectivist metaethics where moral views are preferences rather than beliefs about facts, and this is a substantive philosophical commitment disguised as a neutral economic observation. Without this assumption, gains from trade are not well-defined because the utility functions are not merely different but potentially incompatible descriptions of reality.

  Even if we grant subjectivism to save the model, a second profound failure arises regarding preference endogeneity. Standard trade theory treats preferences as fixed exogenous parameters, but in morality, the goods on offer are precisely the things that shape the agents' characters and future preferences. By performing an action that contradicts one's overriding concern, an agent may erode the very integrity that grounded their initial valuation. If I trade away my commitment to veganism for poverty relief, I am not just producing a different outcome; I am becoming a different kind of moral agent, potentially one who cares less about animals in the future. The economic model cannot capture this feedback loop because it assumes the trader remains the same entity before and after the exchange. This matters for the corruption objection because corruption is often defined as the degradation of the agent's moral character, not just a suboptimal allocation of resources. If the trade changes the preferences such that the agent no longer values their original cause, the supposed gain was illusory or self-undermining.

  A third failure concerns the alienability of the goods involved. In economics, property rights are assumed to be transferable unless there is a specific market failure, but in normative ethics, many duties are considered non-alienable. I cannot sell my duty to tell the truth or my duty to care for my child, because these duties are constitutive of my relationships and agency. The economist treats moral commitments as assets that can be liquidated for other goods, but if integrity is a constraint on action rather than a good to be maximized, it cannot be traded without destroying its value. This directly undermines the conclusion that institutional safeguards can prevent corruption, because if the act of trading itself violates a deontological constraint, no amount of escrow or reputation management can render it permissible. The corruption objection is not about the risk of defection, which institutions solve, but about the intrinsic nature of the exchange, which institutions cannot change.

  The fourth failure involves enforcement and the lack of a sovereign. The economist argues that we need to build the institutions of trade, implying that a moral equivalent to the state's legal system can enforce contracts. However, moral communities lack a monopoly on violence or a centralized judiciary. Enforcement relies on trust and reputation, which are fragile when the stakes involve deep moral disagreements. If one party defects, the sanction is social ostracization, which may be insufficient if the defector believes their moral cause justifies the betrayal. This matters less for the metaphysical conclusion but significantly for the practical claim that institutions will secure the gains. Without a state, the transaction costs of enforcing moral contracts may exceed the gains from trade, making the market unstable not because of corruption but because of the inherent difficulty of policing normative boundaries without coercive power.

  When we ask what the analogy quietly imports that its target lacks, the answer is a robust form of moral subjectivism and a conception of agency as purely instrumental. The economic model imports the assumption that values are tastes to be satisfied rather than truths to be tracked, and that agents are vessels for utility rather than authors of character. It also imports the assumption of alienability, treating moral commitments as property. These imports are doing all the work in defusing the corruption objection. If you remove them, the conclusion that moral trade is merely mutual gain and not corruption does not survive. The analogy was carrying the conclusion the whole way by smuggling in a metaethical framework that preemptively dissolves the objection. If morality is about truth and character, then trading commitments is not like trading wheat for corn; it is like trading truth for falsehood or integrity for efficiency, which no amount of institutional scaffolding can sanitize.

  Given these disanalogies, I suggest that a better analogy exists in legislative logrolling rather than market trade. In logrolling, legislators with divergent constituencies and values agree to vote for each other's bills to secure partial victories without conceding that the other's values are correct or tradable. This analogy preserves the insight that cooperation is possible despite disagreement, but it does not pretend that the values are commensurable or that the agents are maximizing a single metric. It acknowledges that the agreement is procedural and political, not a revelation of mutual moral gain. It also better captures the risk of corruption, as logrolling is often criticized for undermining principled governance, which mirrors the worry about moral trade corrupting integrity. Unlike the market analogy, logrolling does not imply that the participants have changed their minds about what is right, only that they have found a modus vivendi. This fits the phenomenology of moral trade better, where agents often feel they are compromising rather than optimizing.

  Ultimately, the economist's argument relies on the seductive clarity of the market model to bypass the hard metaethical work. By treating moral commitments as preferences and actions as commodities, he makes the corruption objection look like a fear of market failure rather than a concern about moral category errors. Once you expose the assumptions required to make the analogy hold, specifically subjectivism and alienability, the conclusion loses its force. You are right to be suspicious. The analogy is not a neutral tool for clarification; it is a theoretical stance that begs the question against the objector. I would advise your group to adopt the logrolling analogy if you wish to discuss the feasibility of cooperation, but to remain clear that it does not solve the normative problem of whether such cooperation is morally permissible in the first place.

  Yours sincerely,

  A Colleague
