  3.  **Character Conception:**
      *   **Arthur:** Rigid, seeks elegance, believes truth is found in abstraction. Likely wears a suit, smokes a pipe (classic academic trope of the era), values order.
      *   **Eleanor:** Pragmatic, observant, comfortable with messiness. Likely wears practical clothing, perhaps smokes cigarettes, values function over form.
      *   **Dynamic:** Professional respect but fundamental philosophical rift.

  4.  **Plot Outline:**
