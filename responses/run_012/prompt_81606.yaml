      *   **Project:** Building a fault-tolerant computing machine (imitating the brain's reliability despite noisy neurons), referencing von Neumann's unfinished work.
      *   **Core Conflict:** Conceptual disagreement.
          *   Arthur: Wants a single exact formal language (logic, binary, precision).
          *   Eleanor: Suspects brain signalling is graded/statistical (analog, probabilistic, context-dependent).
      *   **Constraint:** No clear winner. Show stakes and blind spots for both.
      *   **Style:** British English. No direct quotes from real texts.
