answer: |-
  Here are ten interview questions designed to press the "reformer" thesis without letting the guest off the hook on the internal contradictions.

  **1. The Mechanism of Influence**
  Let's start with the plumbing of the system. The traditional view was that rays physically stream from planets and hit you. Kepler rejects that. In his reformed astrology, what exactly is traveling from the sky to the Earth, and what part of the human being is receiving it?
  *   **Follow-up:** You'll likely say it's geometric configurations acting on the soul. But if the soul is perceiving a geometry that exists independently in the sky, isn't that just ordinary perception? Why does that perception *cause* weather or political upheaval? What bridges the gap between "seeing" the harmony and the world actually changing?

  **2. The "Extra Step" Objection**
  Building on that: if the influence requires the soul to perceive the aspect, it sounds like you've bolted a metaphysical step onto a physical chain. If a tree falls in the forest and no soul perceives the aspect, does the astrology still happen?
  *   **Follow-up:** If the answer is "yes, it works regardless of human perception," then the soul isn't the receiver, it's just a conduit. So why insist on the soul at all? Why not just admit it's a force we don't understand yet, rather than a harmony that *must* be heard?

  **3. Aspects vs. Signs**
  Kepler draws a hard line: the twelve zodiac signs are arbitrary human divisions, but the aspects (the angles between planets) are real natural facts. What is the principled difference? One is a coordinate system, the other is a relationship within that system. Why is the grid fake but the distance across it real?
  *   **Follow-up:** If the signs are just junk superstition, doesn't that collapse the traditional house system too? If he's throwing out half the toolkit, is he really practicing astrology, or is he using the word "astrology" to sell a new theory of cosmic geometry?

  **4. Light and Physics**
  Kepler writes about light as the vehicle of this influence, but he also discovers that light intensity diminishes with distance. Do the astrological aspects diminish with distance? If Mars is in a square aspect, does it matter if it's at perihelion or aphelion?
  *   **Follow-up:** If he says distance *doesn't* matter for aspects, he's contradicting his own optics. If he says it *does* matter, his horoscopes should look very different than the traditional ones. Did he actually adjust his predictions based on planetary distance, or was the physics just window dressing?

  **5. Compatibility with the New Astronomy**
  This is the big tension. *Astronomia Nova* gives us elliptical orbits and variable speeds. Traditional astrology relies on uniform circular motion to calculate places. How does Kepler calculate an aspect if the planets are speeding up and slowing down on ellipses?
  *   **Follow-up:** Did he ever have to choose between the accurate astronomical position and the "clean" astrological aspect? If the math says the angle is 89 degrees, not 90, does the influence turn off? At what point does the precision of the new astronomy kill the vagueness required for astrology to work?

  **6. Falsifiability and Error**
  Kepler cast horoscopes that missed—weather predictions that didn't land, political events that went the other way. When the data failed, did he treat it as a falsification of the theory, or an error in the execution?
  *   **Follow-up:** If every miss can be explained away by "the observer wasn't pure enough" or "other configurations interfered," is the theory doing any work? How do you distinguish a reformed astrology that can't be proven wrong from a theory that explains everything and therefore nothing?

  **7. Theology and Inclination**
  He's a Lutheran operating in a post-Reformation context. He insists stars "incline" but do not "compel." Where is the line drawn between God's Providence and stellar determinism? If the stars are just tools God uses, why study the tools instead of the Maker?
  *   **Follow-up:** If the stars only incline the will, but the will can resist, how do you verify the influence empirically? If a person resists the inclination, the prediction fails. If they don't, it succeeds. Isn't that an unfalsifiable shield against error?

  **8. Motivation: Paycheck vs. Mission**
  Your argument is that he wasn't just a reluctant hack doing this for the Imperial paycheck. But he complains constantly about the drudgery of casting nativities. Can those two things coexist? Can you think a system is divinely true but also find the practice of it tedious and debasing?
  *   **Follow-up:** If he thought he'd fixed astrology, why was he so pessimistic about its reception? Was he frustrated that people wouldn't pay for the *reformed* version, or that they wanted the *old* version he knew was bogus?

  **9. The Definition of Astrology**
  Here's the crux. If the influence is purely geometric, acts through the soul, only shapes dispositions, and never predicts specific events with certainty: in what sense is this still astrology?
  *   **Follow-up:** It sounds like celestial physics with a mystical coat of paint. If I strip out the horoscopes and keep the harmonics, do I lose anything essential to his science? Or is the "astrology" label just the only vocabulary he had to talk about cosmic interconnectedness?

  **10. The Legacy of the Reform**
  Kepler's astronomy survived; his astrology didn't. Why? Was it because the physics eventually ate the geometry, or because the "reformed" version was too complex to be useful?
  *   **Follow-up:** If your reading is right, and he was trying to save astrology from itself, did he fail because the universe turned out to be mechanical rather than harmonic? Or did he fail because he was the last person who could genuinely believe both things at once?
