answer: |-
  **Upfront Concessions**
  Concede two points immediately to avoid wasted time. First, you are not arguing against competence. A surgeon must cut well; a pilot must fly. Your target is the use of 'merit' to justify the *value* of the role or its rewards, not the selection within it. Second, admit you lack a full alternative theory of justice. This is a negative critique of justification mechanisms, not a blueprint for utopia. Fight on "why this job exists and pays this much," not "who gets the job."

  **Q&A Prep Table**

  | Objector | Objection (In Their Vocabulary) | 1-Minute Reply | Soft Spot |
  | :--- | :--- | :--- | :--- |
  | **Labor Economist** | "If merit is internal to roles, you destroy wage signaling. How do you achieve allocative efficiency without a common metric to price labor scarcity? You offer no mechanism for labor distribution." | "I'm not proposing central planning. I'm arguing merit talk *fails* as a signal because it masks power. Policy teeth come from decoupling reward from 'merit' entirely via wage compression unions or statutory caps. We don't need a merit metric to decide CEOs shouldn't earn 300x workers; we need power balancing." | You lack a transition model. Markets resist compression; you haven't shown how to stabilize labor supply without merit-based incentives. |
  | **Sociologists** | "This is Bourdieu 101. You've redescribed 'symbolic violence' as 'conceptual error.' Where's the empirical cash value? If you don't show how this changes legitimation practices, it's descriptively inert." | "Philosophers still treat merit as neutral normative ground. I'm giving you a wedge to pry open their justification. When they say 'meritocracy,' you can now say 'that's a contested claim about the role's point, not a fact.' It arms your critique with normative leverage they can't dismiss as 'just sociology.'" | They already know this. You're preaching to the choir; the payoff relies on philosophers listening to sociologists, which they rarely do. |
  | **Relational Egalitarian** | "You focus on distribution of positions. The real disease is hierarchical status itself. Fixing merit definitions leaves the domination intact. You're polishing the chains." | "Exactly. Showing merit is constructed undermines the legitimacy of the hierarchy. If the CEO's 'merit' is just 'good at being a boss,' and we question why we need bosses, the status claim collapses. It doesn't abolish hierarchy immediately, but it removes the moral shield protecting it." | Doesn't directly abolish hierarchy, just delegitimizes one defense. They want abolition; you offer delegitimation. |
  | **Luck Egalitarian** | "If roles define merit, aren't you entrenching brute luck? Who defines the 'point of the position' if not those already lucky enough to be there? You leave the arbitrary distribution of endowments untouched." | "That's why the 'point of the position' must be democratically determined, not managerially fixed. We compensate for luck by controlling the role's design, not just the selection. Meritocracy lets winners define the game; democracy lets us design the board." | Democratic determination is vulnerable to majority tyranny or populism. You assume democratic control is feasible or just. |

  **The Objection I Hope Nobody Raises**
  The "Normative Anchor" problem. If merit is entirely role-relative, what normative standard do *you* use to critique the role's point? If you say "justice" or "equality," aren't you just positing a higher-order merit metric? If you admit there is a higher standard, you concede there is a cross-role ranking after all. If you deny it, your critique looks like mere preference. You need to argue that democratic determination of roles is procedurally valid without appealing to a substantive merit outcome, but this walks a tightrope between emptiness and smuggling in your own values.
