answer: |-
  **Examination Question**

  **Question 1**
  In interpreting Montaigne's "Of Cannibals," scholars often conflate three distinct philosophical stances. For the purposes of this question, distinguish them as follows:
  1.  **Metaethical Relativism:** The claim that there is no standard of right and wrong independent of a society's own customs; truth is local.
  2.  **Pyrrhonian Suspension of Judgment:** The methodological withholding of assent regarding ultimate standards to cure dogmatism, without necessarily denying that truth exists.
  3.  **Naturalistic Universalism:** The claim that there is a universal standard (Nature, or uncorrupted simplicity) against which all societies, including one's own, can be measured.

  Montaigne writes that we call a custom "barbarous" merely because it is not our own, yet he plainly condemns European cruelty and admires Tupinambá virtue. Furthermore, critics argue that Montaigne's admiration idealizes the cannibals as a foil for Europe, thereby replicating the ethnocentrism he attacks.

  Write an essay addressing the following: Which of the three positions above best describes the argument Montaigne *enacts* (as opposed to merely states)? Explain how your classification accounts for his condemnation of European torture. Finally, assess whether the charge of idealization undermines his philosophical project or constitutes a necessary rhetorical strategy within it.

  ***

  **Model Answer**

  While Montaigne's opening declaration—that we label things barbarous only because they are unfamiliar—suggests a straightforward Metaethical Relativism, a closer examination of "Of Cannibals" reveals that he ultimately enacts a Naturalistic Universalism, utilizing Pyrrhonian Suspension as a therapeutic tool rather than a final destination. To classify Montaigne as a pure relativist is to ignore the normative force of his critique; to classify him as a pure skeptic is to ignore his positive assertions about virtue.

  Montaigne cannot be a consistent Metaethical Relativist because relativism precludes the condemnation of one culture by the standards of another, yet Montaigne explicitly condemns his contemporaries. He does not merely say European torture is different from Tupinambá ritual eating; he argues it is *worse*. He details the horrors of religious wars and judicial torture in France, contrasting them with the cannibals' consumption of the dead. If truth were purely local, the European custom would be valid for Europeans. Montaigne, however, judges both groups against a third term: Nature. The Tupinambá are admired not because they are different, but because they live "close to nature," uncorrupted by the artifice of civilization. Their laws are few, their religion simple, and their courage authentic. This appeal to an uncorrupted state implies a universal standard of human flourishing that civilization obscures. Thus, the essay is grounded in Naturalistic Universalism.

  However, Pyrrhonian Suspension plays a crucial methodological role. Montaigne uses skepticism to dismantle European dogmatism. By suspending judgment on the superiority of Christian civilization, he creates the intellectual space necessary to see the Tupinambá clearly. The Pyrrhonian element is the solvent that dissolves prejudice, but the Naturalistic element is the standard that remains once the prejudice is gone. He withholds assent from European claims of superiority not to suggest that no judgment is possible, but to clear the ground for a judgment based on nature rather than habit.

  This distinction clarifies the charge of idealization. Critics argue that portraying the Tupinambá as noble savages is merely reverse ethnocentrism—using an imagined "other" to critique the self. If Montaigne were attempting anthropology, this would be a fatal objection. However, Montaigne is engaged in moral philosophy. His goal is not accurate ethnography but the ethical improvement of the reader. The idealization is a rhetorical mirror. By presenting the Tupinambá as embodiments of Naturalistic Universalism, he constructs a foil that makes European vice visible.

  Does this undermine the argument? Only if one assumes the argument depends on the factual perfection of the Tupinambá. It does not. It depends on the plausibility of a life lived with less artifice. Even if Montaigne exaggerates Tupinambá simplicity, the philosophical point holds: human nature exists prior to cultural accretion. The idealization is therefore a necessary strategy. To cure the dogmatism of Renaissance Europe, a stark contrast is required. A nuanced, balanced view of the Tupinambá would not shock the European reader out of their complacency.

  In conclusion, Montaigne employs Pyrrhonian skepticism to dismantle local prejudice, but he rests his moral verdicts on a Naturalistic Universalism that posits nature as the standard of virtue. The charge of idealization misses the rhetorical purpose of the essay. Montaigne is not documenting a people so much as diagnosing a civilization. The Tupinambá serve as the control group in an experiment on human nature, proving that what Europeans call "barbarism" is often a distortion of nature, while what they call "civilization" is often a mask for cruelty. The essay thus transcends relativism not by asserting a new dogma, but by appealing to a pre-cultural standard that relativism itself cannot account for.

  ***

  **Marking Scheme**

  **Total Marks: 20**

  **1. Correct Application of the Triad (4 Marks)**
  *   **Requirement:** The essay must clearly distinguish between Metaethical Relativism, Pyrrhonian Suspension, and Naturalistic Universalism as defined in the prompt, and apply these definitions to Montaigne's text.
  *   **Common Mistake:** Conflating Pyrrhonian Suspension with Metaethical Relativism (treating skepticism as a denial of truth rather than a withholding of assent).

  **2. Rejection of Pure Relativism (4 Marks)**
  *   **Requirement:** The student must demonstrate why Montaigne cannot be a pure relativist, specifically citing his normative condemnation of European torture/cruelty as evidence that he holds a cross-cultural standard.
  *   **Common Mistake:** Asserting Montaigne is a straightforward relativist because he says "barbarism is relative," ignoring his moral condemnation of European acts.

  **3. Identification of Naturalistic Universalism (4 Marks)**
  *   **Requirement:** The essay must identify "Nature" (or uncorrupted simplicity) as the implicit universal standard Montaigne uses to judge both societies, distinguishing this from mere cultural preference.
  *   **Common Mistake:** Failing to identify "Nature" as the normative standard, instead attributing Montaigne's judgments to personal taste or aesthetic preference.

  **4. Engagement with the Idealization Critique (4 Marks)**
  *   **Requirement:** The student must address the charge that Montaigne's admiration is itself ethnocentric idealization, taking a stance on whether this is a flaw or a feature.
  *   **Common Mistake:** Dismissing the idealization charge entirely as "wrong" without explaining why it might be rhetorically necessary, or accepting it as fatal without nuance.

  **5. Synthesis of Rhetoric and Philosophy (4 Marks)**
  *   **Requirement:** The conclusion must explain how the rhetorical strategy (using the Tupinambá as a foil) serves the philosophical goal (curing dogmatism/critiquing civilization), resolving the tension between the positions.
  *   **Common Mistake:** Treating the rhetorical strategy (idealization) as separate from the philosophical argument, rather than integral to its success.
