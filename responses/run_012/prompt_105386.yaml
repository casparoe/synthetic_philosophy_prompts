answer: |-
  ### Facilitator's Briefing: Structural Analysis

  **1. The Order of Operations**
  Your hypothesis is inverted. Do not start with the distinction between legal and moral theft. If you begin there, the "Not Theft" side will immediately retreat to Legalism ("It is lawful, therefore it is not theft"), and the "Theft" side will jump to Moralism ("It is coercive, therefore it is theft"). The session will stall.

  **Correct Order:**
  1.  **The Ontology of Property:** Where do property rights come from? (Antecedent vs. Constitutive).
  2.  **The Classification:** Given #1, does the taking fit the definition of theft?
  3.  **The Evaluation:** Given #2, is the taking justified?

  **Why:** You cannot determine if a taking is "theft" (moral or legal) until you determine if the victim *owned* the thing taken. If the state constitutes ownership (i.e., you only own what remains after tax), theft is logically impossible. If ownership is antecedent (i.e., you own the fruit of your labor before the state intervenes), theft is possible. This question must be settled before the legal/moral distinction has any work to do.

  **2. The Carrying Example**
  **Assessment of your HOA Candidate:** It fails as the *primary* carrier.
  **Why:** The HOA relies on *contractual consent* (you bought the house knowing the rules). This allows the "Not Theft" side to win too easily ("They agreed to it") and the "Theft" side to dismiss it ("Taxes aren't voluntary"). It substitutes the puzzle of *consent* for the puzzle of *property*.
  **What the Example Must Have:** A clear taking, an enforcing authority, and a lack of explicit individual consent regarding the specific transaction.
  **What the Example Must Lack:** Any ambiguity about who created the value being taken.
  **Recommended Replacement:** **The Gross Salary.**
  *   **The Scenario:** You work one hour and generate $50 of value. The employer pays you $50. The state immediately claims $15.
  *   **The Question:** Did you own the $50 for a single second before the $15 was removed? Or did you only ever own the $35?
  *   **Why it works:** It isolates the "Antecedent vs. Constitutive" property question without the noise of voluntary contract (HOA) or violent force (Robber).

  **3. The "Robber" Analogy**
  **Use it?** Yes.
  **Where:** Minutes 5–10 (The Warm-Up).
  **Work:** It is a *foil*, not an argument. Use it solely to defuse **Legalism**.
  **How:** Present the robber who calls his take a "fee." Ask: "Does his label make it legal? Does the law make it moral?" This establishes that "Theft" is a claim about *rights*, not statutes. Once this point is scored, discard the robber. Do not let them return to it.

  **4. Mapping Misconceptions**
  *   **Legalism ("It's law, so not theft"):** Defuse in **Minute 5** (The Robber). Establish that law does not define morality.
  *   **Deflationism ("It's just semantics"):** Defuse in **Minute 30** (After the Salary Example). Show that the definition determines the *burden of justification*. If it's theft, the state needs a strong excuse. If it's a fee, it just needs to be useful.
  *   **Economism ("Taxes hurt growth"):** Defuse in **Minute 50**. Bracket this as a separate question. "We are asking what taxation *is*, not what it *does*."
  *   **The "Theft = Unjust" Slide:** Defuse in **Minute 60**. This is critical. Show that one can classify an act as theft while acknowledging it may be necessary (e.g., stealing a knife from a murderer). Classification is not condemnation.

  **5. The Closing Question**
  Do not ask for a vote. Ask for the *condition* of their belief.
  **Question:** *"Under what definition of 'ownership' does the proposition 'Taxation is Theft' become necessarily true, and under what definition does it become logically impossible?"*
  **Success Criterion:** If they answer with policy preferences ("Low taxes are good"), they failed. If they answer with property theory ("If I own my labor before the state, it's true; if the state defines ownership, it's false"), they succeeded.

  **6. What to Leave Out**
  You must explicitly exclude **Conscription** (taking labor/time) and **Eminent Domain** (taking land). These introduce distinct rights (bodily autonomy, real property) that complicate the core question of *fungible property*.
  **Announcement Script:** *"We are isolating the question of monetary taxation. We will not discuss conscription or land seizure today. Those are harder cases that rely on different rights. If we cannot agree on the structure of income tax, we cannot solve those. We are leaving them out to focus on the core definition."*

  ***

  ### Run of Show: 75 Minutes

  **00:00 – 05:00 | Introduction & Exclusions**
  *   **Action:** State the proposition. Read the **Announcement Script** (above) regarding conscription and eminent domain.
  *   **Rule:** "We are not here to vote on tax rates. We are here to define the word 'theft' in this context."
  *   **Goal:** Set the boundary. Prevent scope creep.

  **05:00 – 15:00 | The Robber (Defusing Legalism)**
  *   **Action:** Present the Robber Analogy. A man takes your wallet, calls it a 'fee', and claims he has a gun (force).
  *   **Discussion:** Ask: "If the law permitted him, would it still be theft?"
  *   **Goal:** Establish that 'Theft' is a moral/philosophical category, not a legal one.
  *   **Transition:** "If the law doesn't decide what theft is, what does? It must be ownership. You can't steal what isn't yours."

  **15:00 – 40:00 | The Gross Salary (The Core Inquiry)**
  *   **Action:** Introduce the **Gross Salary Example**.
  *   **Phase 1 (15-25 min):** Ask the room: "When the $50 is earned, who owns it?"
      *   *Prompt:* "Does the state create the legal framework that allows you to keep the $35? Or do you create the value that the state takes $15 from?"
      *   *Dependency:* This forces the "Antecedent vs. Constitutive" property debate.
  *   **Phase 2 (25-40 min):** Split the room not by "Pro/Con Tax" but by "Antecedent Property/Constitutive Property."
      *   *Group A:* "I own the $50 first; the state takes $15." (Leads to "Theft" classification).
      *   *Group B:* "I only own the $35; the $15 was never mine." (Leads to "Fee/Due" classification).
  *   **Goal:** Make them see the proposition is actually a dispute about *when* ownership vests.

  **40:00 – 50:00 | Defusing Deflationism & Economism**
  *   **Action:** Address the "It's just words" and "Growth" objections.
  *   **Script:** "Someone might say, 'Why does the label matter? Just look at the growth.' But if it is theft, the burden of proof is on the taker to justify a violation. If it is a fee, the burden is only to show utility. The label changes the moral starting line."
  *   **Goal:** Show that the definition has consequences. It is not merely semantic.

  **50:00 – 60:00 | The "Unjust" Slide (Classification vs. Condemnation)**
  *   **Action:** Challenge the "Theft" side.
  *   **Prompt:** "If we agree it is theft, must we abolish it? Can theft be justified?" (Use the knife-from-murderer analogy).
  *   **Challenge:** Challenge the "Not Theft" side. "If it is not theft, is it therefore unlimited? Can the state take 90%?"
  *   **Goal:** Decouple the *classification* (is it theft?) from the *verdict* (is it permissible?). This prevents the slogan from being used as a conversation-ender.

  **60:00 – 70:00 | Synthesis & The Closing Question**
  *   **Action:** Put the **Closing Question** to the room.
  *   **Process:** Give them 2 minutes of silence to think, then ask 3-4 individuals to answer.
  *   **Goal:** Reveal who understood the structure (property definitions) vs. who just picked a side (policy preferences).

  **70:00 – 75:00 | Close**
  *   **Action:** Summarize the divergence.
  *   **Script:** "We have not agreed on the answer. But we have agreed on the question. It is not 'Is tax bad?' It is 'Does the state define property, or does it protect it?' Until that is settled, the slogan is noise."
  *   **Goal:** End on the structural insight, not a policy conclusion.
