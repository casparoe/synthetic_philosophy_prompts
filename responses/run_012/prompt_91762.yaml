answer: |-
  **Project Title:** The Logic of *Fei*: Reconstructing the Copula in the *White Horse Dialogue*

  **Project Summary**
  This project offers a logical reconstruction of the *Bai Ma Lun* (White Horse Dialogue), a foundational text of the early Chinese School of Names. While standard interpretations treat the text's central claim ("A white horse is not a horse") as either a category distinction or eristic sophistry, both approaches import external assumptions about nominal reference and the copula. This project asks whether the paradox dissolves when we analyze the text through rival syntactic treatments of the Classical Chinese copula and noun phrase. By formally reconstructing the argument under distinct logical operators (identity, predication, and class inclusion), I aim to determine if the text exploits a specific linguistic ambiguity to generate a valid, non-trivial argument.

  **Research Question**
  Does the validity of the *White Horse Dialogue*'s central argument depend on an equivocation between the 'is' of identity and the 'is' of class inclusion, or does it rely on a distinct nominal logic where common nouns function as mass terms or compounds rather than fixed classes?

  **Context and Limitations of Standard Readings**
  Current scholarship generally bifurcates into two camps, neither of which adequately addresses the linguistic mechanism of the paradox.
  1.  **The Category Distinction Reading:** This view argues that "horse" names a shape and "white" names a color; thus, the compound "white horse" names a different ontological kind than "horse." While charitable, this reading often assumes a fixed class logic that the text may be challenging. It explains *why* the terms differ but fails to explain why the negation ("is not") follows validly from that difference without begging the question.
  2.  **The Sophism Reading:** This view dismisses the argument as wordplay or eristic trickery, relying on the ambiguity of natural language to confuse the audience. This reading treats the text as a failure of logic rather than an object of logical analysis. It leaves open the possibility that the argument is valid under a different set of logical rules.

  Both readings leave the central question open because they assume the logical operators (specifically the copula *fei* [is not] and the null copula) function identically to their Indo-European counterparts. They do not test whether the argument holds if we vary the underlying logical syntax.

  **Methodology**
  Over the course of one term, I will produce an 8–10 page paper that performs a comparative logical reconstruction of the *White Horse Dialogue*. I will isolate the three key premises in the text and reconstruct them under four rival treatments of the nominal and copulative structure:

  1.  **Identity:** Treating "is" as strict identity ($A = B$).
  2.  **Predication:** Treating "is" as property attribution ($Fa$).
  3.  **Class Inclusion:** Treating "is" as subset membership ($A \subset B$).
  4.  **Compound/Mass Nominal:** Treating "white horse" not as a subset of "horse" but as a compound term where the modifier alters the reference class entirely (similar to a classifier shift).

  For each reconstruction, I will test for validity and soundness. The goal is to see which reconstruction allows the argument to be valid without rendering the conclusion trivially true (e.g., "a white horse is not identical to a horse" is true but trivial; "a white horse is not a member of the class of horses" is false in standard logic). I will pay specific attention to the particle *fei* (is not) and the lack of a mandatory copula in Classical Chinese to see if the text relies on the ambiguity between "is not identical to" and "is not a member of."

  **Criteria for Success and Failure**
  *   **Success:** The project succeeds if I can identify one specific logical reconstruction that renders the argument valid and philosophically non-trivial. A successful result would demonstrate that the paradox arises not from confusion, but from a coherent alternative logic of names and classes that the text explicitly exploits.
  *   **Failure:** The project would fail if every reconstruction renders the argument either invalid or trivially true (e.g., if the only valid reading is "the concept 'white horse' is not identical to the concept 'horse'"), suggesting the text offers no substantive logical challenge. Additionally, the project would fail if the textual evidence is too ambiguous to distinguish between the rival logical treatments, making the reconstruction arbitrary.

  **Feasibility and Scope**
  This project is designed specifically for a one-term fellowship with a limited page count. To ensure completion:
  *   **Primary Text:** I will focus exclusively on the *White Horse Dialogue*. While the *Hard and White Dialogue* (*Jian Bai Lun*) offers related puzzles regarding perception and qualities, analyzing it would double the required textual exegesis. I will restrict references to *Hard and White* to brief comparative footnotes only.
  *   **Historical Context:** I will minimize historical biographical details about Gongsun Long and the Warring States context. The analysis will be synchronic and logical rather than diachronic or historical.
  *   **Linguistic Scope:** I will not attempt a full grammar of Classical Chinese nominal phrases. I will restrict the linguistic analysis only to those particles and structures directly required to formalize the three key premises of the *White Horse Dialogue*.

  By strictly limiting the textual corpus and focusing on the logical form rather than the historical reception, this project is achievable within the term limit while offering a novel contribution to the understanding of early Chinese logic.
