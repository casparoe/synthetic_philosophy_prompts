answer: |-
  Your gut reactions are remarkably consistent with the live debate in contemporary epistemology, specifically the literature surrounding Stewart Cohen's problem of easy knowledge and the responses from philosophers like James Pryor, Roger White, and Jonathan Vogel. You have effectively reconstructed the tension between dogmatism, which allows you to know the wall is red immediately, and the intuition that bootstrapping is illicit, which stops you from concluding your vision is generally reliable. Your tentative principle, that you can take a faculty's deliverance at face value but cannot use it to certify itself, is a strong starting point, but as you suspected, it is too blunt to handle the nuance between the single-wall case and the fifty-wall case, or the lighting condition case. To give you what you want, I will sketch out three competing principles that try to capture your intuitions, test them against your cases, and then show you where the bodies are buried.

  The first candidate principle is what we might call the Independent Corroboration Constraint. This principle states that you can come to know a source is reliable only if you check its output against a truth you have accessed via a different source. This fits your flatmate case perfectly. You know your flatmate is reliable because you checked his testimony against your vision; the source of the check (vision) is distinct from the source being tested (testimony). In the gas gauge case, if you check the gauge by looking at the tank, you are using vision to check the gauge, so you should be able to know the gauge is reliable. However, your intuition says that doing this repeatedly to conclude general reliability is rubbish. To save this, the principle needs a clause forbidding the gauge from being the primary source of the tank level in the first place. If you use the gauge to tell you where to look in the tank, and then use vision to confirm the gauge, you are still bootstrapping because the gauge told you where to look. This principle predicts that in the single-wall case, you cannot know your vision is working even locally, because you have no independent access to the wall's color other than vision. This contradicts your intuition that it is fine to conclude vision is working right now on this wall. To accommodate your intuition, you would have to add a clause that allows for local, token-level confirmation but bans global, type-level confirmation without independent access, but that looks ad hoc unless we have a theory of why tokens are easier to know than types.

  The second candidate principle is a version of Epistemic Dogmatism combined with a Restriction on Closure. This view, associated with James Pryor, says that perceptual experience gives you immediate justification to believe the wall is red without needing prior justification that your vision is reliable. This saves your single-wall case and your gas gauge usage case. However, to stop the bootstrapping, this view must deny that knowledge is closed under known entailment in these specific contexts. This addresses your lighting case. You say you know the table is red, but you don't think looking taught you the lighting is normal, even though a red table entails normal lighting (assuming the table isn't white in red light). If knowledge were closed, knowing the table is red would force you to know the lighting is normal. Since you feel you don't know the lighting is normal, this principle predicts you must accept that you know the premise but not the entailment. This also handles the brain-in-a-vat case. You have a hand, which entails you are not a brain in a vat, but you feel inferring you are not a brain in a vat is cheating. This principle says the inference is indeed blocked; your experience justifies 'hand' directly, but it cannot be used to justify the antecedent conditions required for the experience to be valid, like 'not a BIV' or 'lighting is normal.' The cost here is high: you have to accept that logic doesn't always transmit knowledge from premises to conclusions, which many find unpalatable. It also struggles with your fifty-wall intuition. If I can know vision is working on wall one, and wall two, and wall fifty, why can't I inductively conclude it is generally reliable? This principle has to say that the induction fails because the premises themselves depend on the conclusion being true, creating a circular dependency that blocks the inductive step.

  The third candidate principle focuses on the distinction between Presupposition and Conclusion, which might rescue your tentative principle. This view suggests that when you look at the wall, you are not concluding that your vision is working; rather, you are presupposing it as a condition of gaining the knowledge that the wall is red. In the single-wall case, you aren't learning that vision is working; you are operating under the entitlement that it is. This matches your feeling that using the faculty is fine. In the bootstrapping cases, you are trying to move that presupposition into the conclusion, turning a necessary assumption into a piece of new knowledge, which is illicit. This handles the gas gauge and the fifty-wall cases well. It also explains the flatmate case: you are not presupposing the flatmate is reliable; you are testing him, so his reliability can become a conclusion. However, this principle struggles with your specific intuition about the single wall where you said, I think it is fine for me to conclude from that that my color vision is working right now. If the principle says you can never conclude the faculty is working, it contradicts your gut. To save this, the principle would need to distinguish between knowing the faculty is working in this instance as a byproduct of knowing the object, versus knowing it as a general fact. But this brings us back to the lighting problem. If knowing the table is red requires presupposing the lighting is normal, then you cannot know the table is red unless you are already entitled to assume the lighting is normal. If you aren't entitled to assume that, you don't know the table is red. Since you feel you do know the table is red, you are committed to the idea that you don't need to know the lighting is normal to know the table is red, which returns us to the closure restriction.

  So, which of your verdicts must be sacrificed? If you want to keep the principle that you can use a faculty but not certify it, you have to give up the idea that you can conclude your vision is working right now based on looking at the wall. You have to say that the reliability of vision is a precondition for the knowledge, not a piece of knowledge you gain from the look. This aligns better with your brain-in-a-vat intuition, where using the hand to prove you aren't a vat is cheating. The cost is that your flatmate case becomes an outlier unless you treat testimony as fundamentally different from perception, which is plausible since testimony is a social source that usually requires calibration, whereas perception is a biological given. Alternatively, if you want to keep the intuition that you do know your vision is working right now, you must accept the Independent Corroboration Constraint, which means you actually don't know the wall is red unless you have some other way to check the color, which leads to skepticism.

  The most coherent synthesis of your reactions, the one that saves the most important intuitions while paying the lowest theoretical cost, is a hybrid of Dogmatism and the Independent Corroboration Constraint. The principle would be: You are entitled to believe the deliverances of a basic faculty like vision or memory without prior evidence of reliability, but you cannot use those deliverances to construct an argument for the reliability of that same faculty, either locally or generally, unless you have independent access to the truth of the matter via a different faculty. This saves the gas gauge usage and the single-wall knowledge. It kills the bootstrapping of the gauge and the fifty walls because the gauge and vision are doing all the work. It saves the flatmate case because vision checks testimony. It forces you to accept that you do not know the lighting is normal just by looking at the table, because that would be using vision to certify the conditions of vision. It also confirms your BIV intuition: you cannot use your hand to prove you aren't a BIV because that uses vision to certify the conditions of vision. The one verdict this sacrifices is your feeling that you can conclude your vision is working right now on the single wall. On this principle, you can know the wall is red, and you are entitled to trust your vision, but you cannot turn that trust into a piece of knowledge about the vision itself without circularity. You have to accept that the reliability of your vision is something you assume to know the wall, not something you know because you saw the wall. This might feel like a small semantic shift, but it is the only way to stop the bootstrapping without falling into skepticism about the red wall.
