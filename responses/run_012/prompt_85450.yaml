      *Wait, does a novelist distinguish between "Nature" and "Scripture"?* A novelist distinguishes between "Story" (fabula) and "Discourse" (sjuzhet). Nature = Story. Scripture = Discourse. This is a strong mapping.
      *But:* The reader of a novel cannot check the "Story" independently of the "Discourse." They only have the text. Galileo's reader *can* check Nature independently. This is the break. The novelist's implied reader is trapped in the text. Galileo's implied reader has access to the Author's other work (Nature) outside the book.

      *Final Plan:*
      1.  Restate Galileo as a problem of narrative strategy (Author, Narrator, Implied Reader, Accommodation).
      2.  Analyze the "Same Author" claim (Author of Story vs. Author of Discourse).
      3.  Analyze the "Gap" (Irony vs. Accommodation).
      4.  Conclude on whether it's poverty of terms or difference of function (Truth vs. Aesthetic Coherence).

  7.  **Drafting the Content (Mental or Scratchpad):**
      *   *Translation:* Imagine an Author who produces two artifacts. One is the world itself (the enacted story). One is the text (the narration). The text uses a narrator who speaks to a specific audience. Sometimes the narrator says things that contradict the enacted story. Why? Because the narrator is accommodating the audience's limited capacity. The gap between the narrator's literal words and the Author's intent is where the subtext lives. The Author is not unreliable; the Narrator is.
      *   *Cost:* The "Same Author" works structurally. But the "Demonstrated Result" is the problem. In fiction, the text *is* the evidence. In Galileo, the world is the evidence. The novelist's vocabulary assumes the text is the final court of appeal. Galileo makes Nature the final court.
