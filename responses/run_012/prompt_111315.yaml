answer: |-
  **Essay Question**

  **Time Allowed:** 90 Minutes
  **Instructions:** Answer the following question using *only* the provided Specification. Do not cite external literature. You must explicitly calculate residuals $\rho_D$ and $\rho_{D^*}$ where applicable. Avoid informal slogans; rely on the definitions of Scope, Tolerance, and Residual.

  Consider a fixed policy $\pi$. Interpret an "average-case guarantee under $D$" as a guarantee statement $G_{avg} = (S_{avg}, \epsilon_{avg})$ where $S_{avg}$ is chosen to minimize $\epsilon$ subject to $\rho_D(G_{avg}) = 0$. Interpret a "worst-case guarantee over $A$" as a statement $G_{wc} = (A, \epsilon_{wc})$ where $\epsilon_{wc} = \max_{e \in A} \ell(\pi, e)$.

  (a) Construct a finite environment set $E$, a distribution $D$, and loss values such that $G_{avg}$ and $G_{wc}$ (with $A=E$) are distinct points on the guarantee frontier. Demonstrate explicitly that neither statement implies the other.
  (b) Suppose both $G_{avg}$ and $G_{wc}$ are true statements about $\pi$. Explain how deployment under $D^*$ can nonetheless be catastrophic. State the single additional assumption regarding $\rho_{D^*}$ required to repair this gap for $G_{avg}$.
  (c) Explain why this assumption is especially fragile in the setting of alignment. Given that $D^*$ may differ arbitrarily from $D$, argue which of the two guarantees a designer should rely upon for safety.

  ***

  **Model Answer**

  Let $E = \{e_1, e_2, e_3\}$. Define losses $\ell(\pi, e_1)=0, \ell(\pi, e_2)=0, \ell(\pi, e_3)=1$. Let reference distribution $D$ assign probabilities $0.5, 0.5, 0$ respectively.

  For part (a), we construct the two guarantees. The worst-case guarantee over $A=E$ requires scope $S_{wc} = \{e_1, e_2, e_3\}$. The tolerance must cover the maximum loss, so $\epsilon_{wc} = 1$. Thus $G_{wc} = (E, 1)$. The residual $\rho_D(G_{wc}) = D(\emptyset) = 0$.

  The average-case guarantee under $D$ minimizes $\epsilon$ subject to $\rho_D(G)=0$. Since $D(e_3)=0$, we can exclude $e_3$ from the scope without incurring residual under $D$. Let $S_{avg} = \{e_1, e_2\}$. The maximum loss on this scope is 0, so $\epsilon_{avg} = 0$. Thus $G_{avg} = (\{e_1, e_2\}, 0)$. The residual $\rho_D(G_{avg}) = D(\{e_3\}) = 0$.

  These are distinct points on the frontier: $G_{wc}$ has larger scope but higher tolerance; $G_{avg}$ has tighter tolerance but smaller scope. $G_{wc}$ does not imply $G_{avg}$ because $\epsilon_{wc}=1$ does not satisfy the claim $\ell \le 0$. $G_{avg}$ does not imply $G_{wc}$ because $G_{avg}$ makes no claim about loss at $e_3 \notin S_{avg}$.

  For part (b), both guarantees are true statements about $\pi$ based on the defined losses. However, deployment is catastrophic if the expected loss under $D^*$ is high. Suppose $D^*$ assigns probability 1 to $e_3$. Then $\mathbb{E}_{D^*}[\ell] = 1$. If safety requires loss $\le 0.1$, deployment fails. $G_{avg}$ offered no protection because $e_3$ was outside its scope. $G_{wc}$ offered protection only up to $\epsilon=1$, which was too loose to ensure safety. The gap exists because $\rho_{D^*}(G_{avg}) = 1$, whereas $\rho_D(G_{avg}) = 0$. To repair this for $G_{avg}$, we must assume $\rho_{D^*}(G_{avg}) \le \delta$ for some small $\delta$, ensuring $D^*$ does not concentrate mass outside $S_{avg}$.

  For part (c), in alignment settings, $D^*$ is often induced by optimization pressure or adversarial selection rather than natural sampling. Agents may actively seek states $e \in E \setminus S$ where constraints were not verified. Thus, the assumption that $\rho_{D^*}(G_{avg}) \approx \rho_D(G_{avg})$ is fragile; $D^*$ can shift entirely into the residual. When $D^*$ may differ arbitrarily from $D$, a designer must rely on $G_{wc}$. While $\epsilon_{wc}$ may be conservative, it bounds loss everywhere ($\rho_{D^*}(G_{wc}) = 0$). Relying on $G_{avg}$ requires trusting that $D^*$ respects the scope $S_{avg}$, which alignment failures specifically violate. Safety requires minimizing dependence on $D^*$ matching $D$, necessitating the largest possible scope.

  ***

  **Marking Scheme**

  1.  **Finite Construction (4 marks):** Correctly defines $E$, losses, and $D$ such that $e_{high\_loss}$ has zero mass in $D$.
      *   *Common Error:* Assigning non-zero probability to the high-loss environment in $D$, making $\rho_D(G_{avg}) > 0$.
  2.  **Frontier Non-Implication (4 marks):** Explicitly shows $G_{wc}$ fails tight tolerance and $G_{avg}$ fails out-of-scope coverage.
      *   *Common Error:* Claiming one implies the other because both are "true" statements about the policy.
  3.  **Deployment Catastrophe (4 marks):** Identifies that $D^*$ shifting mass to $E \setminus S_{avg}$ causes high expected loss despite valid guarantees.
      *   *Common Error:* Arguing the guarantees become "false" under $D^*$ rather than remaining true but insufficient.
  4.  **Repair Assumption (4 marks):** States the assumption must bound $\rho_{D^*}(G_{avg})$ (distributional shift of the residual).
      *   *Common Error:* Suggesting retraining the policy instead of stating an assumption about the deployment distribution.
  5.  **Alignment & Choice (4 marks):** Identifies adversarial shift fragility and selects $G_{wc}$ due to $\rho_{D^*}=0$.
      *   *Common Error:* Choosing $G_{avg}$ because it is "more informative" without addressing the residual risk.

  **Total: 20 Marks**

  **Distinction:** An A answer integrates the residual $\rho_{D^*}$ as the central mechanism of failure, whereas a B answer treats the distribution shift as a vague "difference" without calculating the scope mismatch.

  Crux: Safety under distributional shift depends not on the truth of the guarantee, but on the deployment mass residing within its scope.
