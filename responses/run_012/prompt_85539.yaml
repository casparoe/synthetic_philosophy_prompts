answer: |-
  There is no single, canonical term in philosophy or bioethics that specifically names this *asymmetry of argumentation* distinct from the psychological biases that produce it. You have correctly identified that while the **Reversal Test** (Bostrom & Ord, 2006) is the tool used to *detect* the inconsistency, and **Status Quo Bias** is the psychological *cause*, neither term captures the specific *rhetorical structure* of the value claim itself.

  In the literature of bioconservatism (e.g., Kass, Sandel, Fukuyama), this move is often embedded within appeals to "givenness," "giftedness," or the "wisdom of repugnance," but these label the *source* of authority, not the logical asymmetry you have isolated. In formal logic, this is a species of **Special Pleading**, but that is too broad to capture the specific content regarding suffering and constitutive goods.

  Given the precision of your description, the most accurate label for this pattern is **Defensive Constitutivism**.

  Below is a careful definition and boundary analysis, designed to distinguish it from its neighbours as you requested.

  ### Proposed Term: Defensive Constitutivism

  **Definition:**
  Defensive Constitutivism is a rhetorical pattern in value theory where a prima facie aversive state $S$ (e.g., pain, grief, mortality) is asserted to be *constitutively necessary* for a distinct good $G$ (e.g., care, love, seriousness) only in the context of proposals to *reduce* $S$, while that same constitutive link is denied, ignored, or rejected in the context of proposals to *increase* $S$.

  **The Logical Structure:**
  1.  **The Constitutive Claim:** State $S$ is not merely instrumental to Good $G$, but partially constitutes it (e.g., "Grief is the price of love").
  2.  **The Defensive Deployment:** When a proposal $P_{-}$ is made to reduce $S$ (via intervention), the Constitutive Claim is invoked to argue that $P_{-}$ will necessarily degrade $G$.
  3.  **The Constructive Withdrawal:** When a mirror proposal $P_{+}$ is made to increase $S$ to enhance $G$, the Constitutive Claim is withheld. The speaker either rejects $P_{+}$ on other grounds or concedes that increasing $S$ would not enhance $G$.
  4.  **The Persistence Condition:** The speaker maintains the Constitutive Claim against $P_{-}$ even after conceding the inconsistency regarding $P_{+}$.

  ### Boundary Conditions and Edges

  To distinguish this from general claims that "suffering has value," the following edges apply:

  **1. The Aversive Constraint**
  The state $S$ must be intrinsically aversive or undesirable to the speaker in isolation. If the speaker believes $S$ is intrinsically good (e.g., a religious ascetic who believes pain is inherently holy), the asymmetry collapses; they *would* support $P_{+}$. Defensive Constitutivism applies only when $S$ is tolerated *only* for the sake of $G$, but never sought for its own sake.

  **2. The Unit of Analysis (Speaker vs. Tradition)**
  The pattern can be exhibited by a single speaker or a tradition, but the diagnosis differs:
  *   **Individual Level:** If a single speaker exhibits the asymmetry, it is a logical inconsistency (Defensive Constitutivism).
  *   **Tradition Level:** If a tradition argues for a "Golden Mean" (e.g., Aristotelian virtue ethics), they may argue that *current* levels of $S$ are optimal, while both $P_{-}$ and $P_{+}$ are harmful. This is **Optimization Conservatism**, not Defensive Constitutivism. Defensive Constitutivism is present only if the tradition resists $P_{-}$ using constitutive arguments but lacks a symmetrical argument against $P_{+}$.

  **3. The Availability of the Mirror**
  The mirror case ($P_{+}$) must be conceptually and technically available. If increasing $S$ is physically impossible (e.g., "we cannot make death more final"), the asymmetry is moot. The pattern requires that the speaker *could* advocate for more $S$ (e.g., withholding analgesia, prolonging grief) but chooses not to, while still claiming $S$ is necessary for $G$.

  **4. Distinction from "Suffering Has Value"**
  A symmetric claim that "suffering has value" implies that reducing suffering below a certain threshold is bad *and* increasing it (up to a point) is good. Defensive Constitutivism is distinct because it treats the *current baseline* of suffering as the unique locus of value. It posits that the *removal* of $S$ destroys $G$, but the *addition* of $S$ does not create $G$. This implies the value lies not in $S$ itself, nor in the $S$-$G$ relationship, but in the *status quo* of $S$.

  ### Differentiation from Neighbours

  | Term | Relation to Defensive Constitutivism | Point of Departure |
  | :--- | :--- | :--- |
  | **The Reversal Test** | The diagnostic tool. | The Test *exposes* the bias; Defensive Constitutivism is the *argumentative structure* being exposed. |
  | **Status Quo Bias** | The psychological cause. | Status Quo Bias explains *why* the speaker resists change; Defensive Constitutivism describes *how* they justify it using constitutive value claims. |
  | **The Golden Mean Fallacy** | A related logical error. | The Golden Mean argues the middle is best. Defensive Constitutivism argues the *current* state is uniquely constitutive, without necessarily claiming a "middle" is theoretically optimal. |
  | **Bioconservatism** | The ideological home. | Bioconservatism is the political/ethical stance. Defensive Constitutivism is a specific rhetorical move used within it (not all bioconservative arguments are asymmetrical). |
  | **Special Pleading** | The logical genus. | Special Pleading is applying double standards. Defensive Constitutivism is a specific *type* of special pleading regarding constitutive goods and aversive states. |

  ### Why this distinction matters
  You noted that the objection strengthens as removal becomes technically credible. This suggests the "constitutive claim" is not a discovered metaphysical truth (which would hold regardless of technical feasibility) but a **post-hoc rationalization of the baseline**.

  If the claim were truly constitutive (e.g., "combustion is necessary for fire"), it would apply symmetrically: less fuel = less fire; more fuel = more fire. In Defensive Constitutivism, the relationship is treated as: less pain = less humanity; more pain = just pain. This reveals that the value is not actually in the *connection* between pain and humanity, but in the *familiarity* of the current pain level.

  **Summary:**
  There is no established name. **Defensive Constitutivism** is the precise term for this asymmetry. It marks the edge where a value claim ceases to be a principle and becomes a shield for the status quo, distinguished by its refusal to operate in the constructive direction.
