      *   **Context:** Hosting an interview slot at a department AI ethics workshop.
      *   **Guest:** Researcher arguing for a "narrow" definition of alignment (intent alignment vs. value alignment/flourishing).
      *   **Goal:** 8-10 hard-hitting questions with follow-ups keyed to likely answers. No softballs/warm-ups.
      *   **Tone:** Conversational (workshop chat), not a viva (oral exam).
      *   **Required Topics:**
          1.  The work done by the word "intent" (articulability, fact of the matter).
          2.  Sufficiency vs. Necessity (Midas problem, meta-intents like "correct me").
          3.  The Collapse Objection (tracking intent requires modeling values).
          4.  Politics/Conflict (conflicting operators, governance vs. technical).
          5.  Closing: Falsification conditions (what would make her give up the narrow framing?) + Boundary drawing (technical vs. policy).

  2.  **Deconstruct the Guest's Position:**
      *   *Thesis:* Alignment = doing what the operator intends. Not "human flourishing," not "universal values."
      *   *Motivation:* "Value alignment" is too vague, politically fraught, and philosophically loaded. "Intent alignment" is tractable and technical.
      *   *Vulnerabilities:*
          *   Intent is often ill-defined or contradictory.
          *   Literal intent fulfillment can be catastrophic (Midas/Genie problems).
          *   Inferring intent requires modeling the human's internal state (values/preferences).
          *   Who counts as "the operator"? (Power dynamics).
          *   Is this just kicking the can down the road to governance?

  3.  **Drafting the Questions (Iterative Process):**

      *   *Topic 1: Intent & Articulability.*
          *   *Draft:* What do you mean by intent? What if I don't know what I want?
          *   *Refinement (STS lens):* Focus on the *practice* of evaluation. If intent isn't articulable, is there a ground truth?
          *   *Follow-up:* If she says "latent intent," push on whether that's just values in disguise.

      *   *Topic 2: Sufficiency & The Midas Problem.*
          *   *Draft:* What about when getting what you want is bad?
          *   *Refinement:* Use the "Midas" example explicitly. Bring in meta-intents (wanting to be corrected).
          *   *Follow-up:* If she says "include safety in the intent," ask if that just recreates the value alignment problem.

      *   *Topic 3: The Collapse Objection (Values vs. Intent).*
          *   *Draft:* Don't you need values to know intent?
          *   *Refinement:* To distinguish "kill the cancer" from "kill the patient," you need a model of what they care about. Is the distinction stable?
          *   *Follow-up:* If she says "it's a different modeling target," ask about the data required to train that model.

      *   *Topic 4: Politics & Conflicting Operators.*
          *   *Draft:* What if bosses disagree?
          *   *Refinement:* Connect to the "value disagreement" argument she uses against broad alignment. Does intent alignment solve politics or hide them?
          *   *Follow-up:* If she says "that's governance," ask if the technical system enforces a specific political hierarchy.

      *   *Topic 5: Falsification/Boundary.*
          *   *Draft:* When would you change your mind?
          *   *Refinement:* What failure mode forces the broad view back in? Where is the line between technical and policy?
          *   *Follow-up:* Push on the "ordinary policy" claim. Is that boundary empirical or normative?

      *   *Filling the Gaps (Need 8-10 total).*
          *   Need to incorporate the STS angle (evaluation practices).
          *   Need to look at the *operator* definition (who is it?).
          *   Need to look at the *temporal* aspect (intent changes).
          *   Need to look at *instrumental convergence* (does narrow alignment lead to power-seeking?).

  4.  **Developing the Specific Questions & Follow-ups:**

      *   *Q1 (Intent/Articulability):* Focus on the "fact of the matter."
      *   *Q2 (Evaluation/STS):* How do you measure this in practice? (Leveraging user's background).
      *   *Q3 (Midas/Sufficiency):* The literal fulfillment trap.
      *   *Q4 (Meta-Preferences):* Wanting to be corrected.
      *   *Q5 (Collapse/Values):* Inferring intent requires value models.
      *   *Q6 (Operator Identity):* Who counts? (Power dynamics).
      *   *Q7 (Conflicting Intents):* The politics question.
      *   *Q8 (Instrumental Convergence):* Does narrow alignment lead to manipulation to ensure intent is met?
      *   *Q9 (Falsification):* What breaks the frame?
      *   *Q10 (Boundary Work):* Technical vs. Policy line.

      *Wait, I need to make sure the follow-ups are specific to *likely* answers.*
      *   *Likely Answer Pattern:* She will likely argue that these are "implementation details," "downstream," or "governance issues," not core technical alignment problems. The follow-ups need to trap that move.

  5.  **Refining Tone:**
      *   Avoid academic jargon where possible, but keep it rigorous (it's a PhD student talking to a researcher).
      *   Use phrases like "I'm worried that..." or "Help me see how..." rather than "You are wrong because..."
