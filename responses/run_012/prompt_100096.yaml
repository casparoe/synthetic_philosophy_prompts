answer: |-
  ### Q&A Prep Sheet: Real-Time Appraisal of Research Programmes

  **Strategy:** You are walking into a minefield. The Phil-Sci experts know Lakatos forbade real-time appraisal for specific epistemological reasons. The Scientists feel threatened. The STS scholar thinks the whole exercise is naive. Your goal is not to win a debate on the nature of truth, but to defend the *utility* of the metric as a funding heuristic. Do not defend it as a demarcation criterion for truth; defend it as a risk-management tool.

  **Preemptive Concession (Say this in your closing remarks):**
  > "I want to be clear: this metric is not a demarcation criterion for *truth*. It is a heuristic for *resource allocation*. A degenerating programme might still be true, but it is no longer buying us new epistemic territory per unit of resource. I am arguing for its use in funding decisions, not for banning the research."
  *Why:* This disarms the Scientists (you aren't trying to ban them, just redirect funds), the Popperian (you aren't claiming verification), and the STS scholar (you admit it's a normative tool, not a description of nature).

  **The Question You Are Praying Nobody Asks:**
  > "How do you non-arbitrarily set the length of the rolling window and the threshold for the ratio without tuning them to fit your historical case studies?"
  *Why:* If you admit you tuned the parameters to make the "agreed progressive" case look good and the "contested" case look bad, your metric is post-hoc curve-fitting, not a predictive tool. If you say "it's fixed," they will ask "why 5 years and not 10?" and you have no non-circular answer.

  ---

  ### Objections Ordered by Damage

  #### 1. The "Hindsight in Disguise" Objection
  *   **Who:** The 3 Phil-Sci Experts.
  *   **Vocabulary:** "Retrospective rational reconstruction," "Selection bias," "Problem shift."
  *   **Likelihood:** 100%. This is the core Lakatosian orthodoxy you are challenging.
  *   **Damage:** **Critical.** If the window selection is subjective, the "real-time" claim collapses.
  *   **2-Minute Reply:** "Lakatos argued we can't judge real-time because we can't distinguish a temporary anomaly from a falsification. My claim is that *imported confirmation* breaks that symmetry. Anomalies are internal; imported confirmations are external shocks. I acknowledge my case studies are retrospective simulations, but the *mechanism*—tracking external instrument/technique adoption—is observable in real-time. I am proposing we run this prospectively from today."
  *   **Soft Spot (Concede):** Concede that the *validation* of the metric was retrospective. Do not claim you have proven it works prospectively yet. Claim you have built a tool *ready* for prospective deployment.
      *   *Say:* "You're right that my validation here is historical. I am arguing the *framework* is applicable prospectively, not that I have already successfully predicted the future."

  #### 2. The "Theory-Ladenness of Import" Objection
  *   **Who:** Phil-Sci Experts + STS Scholar.
  *   **Vocabulary:** "Theory-laden observation," "Sociological boundary work," "Incommensurability."
  *   **Likelihood:** 90%.
  *   **Damage:** **Critical.** If "imported" isn't truly external, the ratio is meaningless.
  *   **2-Minute Reply:** "I am not claiming logical independence. I am claiming *institutional and operational* independence. If Programme A uses a spectrometer built by Programme B, calibrated against standards Programme A did not set, that counts as imported. It doesn't matter if the theory behind the spectrometer is compatible; what matters is that Programme A did not generate that capacity internally."
  *   **Soft Spot (Concede):** Concede that boundary disputes will happen.
      *   *Say:* "I concede there will be edge cases where 'imported' is contested. That's a feature, not a bug—it forces explicit debate about dependency rather than hiding it."

  #### 3. The "Funding Weapon" Objection
  *   **Who:** The 2 Working Scientists (specifically the soft-funded one).
  *   **Vocabulary:** "High-risk high-reward," "Theoretical groundwork," "Killing innovation," "Metric gaming."
  *   **Likelihood:** 100%. Their salaries depend on you being wrong.
  *   **Damage:** **High (Social/Professional).** They can paint you as a bureaucrat trying to defund deep theory.
  *   **2-Minute Reply:** "This metric protects long-term theory. Currently, degenerating programmes suck up resources by producing endless belt-tweaks that look like progress. This metric identifies when a programme is living off its own tail. It frees up resources for programmes that are actually importing new facts. It prevents 'zombie' programmes from crowding out new ones."
  *   **Soft Spot (Concede):** Concede that the window size must be long enough to accommodate theoretical gestation.
      *   *Say:* "If the window is too short, you punish deep theory. The rolling window must be calibrated to the timescale of the field, not a fiscal year. I propose a field-specific calibration."

  #### 4. The "Self-Reference" Objection (The Grad Student)
  *   **Who:** The First-Year Grad Student.
  *   **Vocabulary:** "Reflexivity," "Your own hard core," "Applying the rule to itself."
  *   **Likelihood:** 80%. They are trained to spot the performative contradiction.
  *   **Damage:** **High (Rhetorical).** Makes you look dogmatic if you evade it.
  *   **2-Minute Reply:** "Good question. My 'hard core' is that real-time appraisal is possible. My 'protective belt' is this specific ratio metric. If, over the next five years, my metric fails to predict consensus shifts in other fields, or if no one adopts the method (no imported confirmation), then by my own standard, this research programme is degenerating. I am willing to be evaluated by my own tool."
  *   **Soft Spot (Concede):** Concede that your paper itself is a "belt-tweak" until it gets an imported confirmation (i.e., someone else uses it).
      *   *Say:* "Until another group uses this metric to evaluate a different field, this paper is just a theoretical proposal. It needs an imported confirmation to count as progressive."

  #### 5. The "Normative Fiction" Objection
  *   **Who:** The STS Scholar.
  *   **Vocabulary:** "Boundary work," "Power dynamics," "Normative dressed as descriptive."
  *   **Likelihood:** 70%.
  *   **Damage:** **Medium.** They won't convince the scientists, but they will make you look naive.
  *   **2-Minute Reply:** "I agree it is normative. I am not describing how science *is*; I am prescribing how funding agencies *should* decide. Lakatos tried to hide the normativity; I am making it explicit. The power dynamic is the point: currently, the power lies with those who can spin belt-tweaks as progress. This shifts power to those generating imported facts."
  *   **Soft Spot (Concede):** Concede that the metric can be gamed by those in power.
      *   *Say:* "You're right that any metric can be gamed. Transparency in calculating the ratio is the only safeguard."

  #### 6. The "Popperian Nudge"
  *   **Who:** The Unreconstructed Popperian.
  *   **Vocabulary:** "Falsification," "Corroboration," "Ad hoc hypotheses."
  *   **Likelihood:** 50%. They might stay quiet if the Phil-Sci crowd is loud.
  *   **Damage:** **Low.** Everyone in the room knows why Lakatos moved past Popper (Duhem-Quine).
  *   **2-Minute Reply:** "We can't falsify the hard core directly because of auxiliary hypotheses. That's why we need the programme level. My metric is essentially a way to quantify 'excess corroboration' without claiming final falsification."
  *   **Soft Spot (Concede):** None needed. This is standard MSRP defense.

  ---

  ### Tactical Notes for the Room

  *   **The Scientists:** Do not make eye contact with the soft-funded scientist when discussing the "contested case." Refer to it abstractly ("Programme B"). If they get heated, defer to the "Preemptive Concession" (this is about funding efficiency, not truth).
  *   **The Phil-Sci Trio:** They will try to drag you into a semantic war about "novel facts." Do not take the bait. Define "novel" operationally (published in a journal not dominated by the programme's members) and stick to it.
  *   **The Grad Student:** Validate them. "That's the crucial question." If you treat them like an intellectual equal, the room will forgive you if your answer is imperfect. If you dismiss them, the STS scholar and Phil-Sci experts will eat you alive for elitism.
  *   **Your Own Nerves:** You are threatening the local ecosystem. Expect silence after your presentation. Fill it yourself with the Preemptive Concession before opening the floor.
