answer: |-
  1. The project asks whether evaluative satisficing, where aspiration levels are fixed independently of the immediate option set, can sustain a coherent account of rationality without collapsing into constrained optimization. Specifically, it investigates whether an agent can rationally maintain exogenous aspiration levels even when holding preferences over how those levels are set. The inquiry will conclude by establishing whether such a procedure is rationally stable under reflection or inevitably reduces to optimizing behavior.

  2. Current debates stall because both critics and defenders focus on representation theorems, arguing over whether satisficing choices can be modeled as maximizing some utility function. Since almost any choice pattern admits such a representation, this framing renders the distinction verbal rather than substantive, leaving the procedural difference unexamined. Consequently, the literature fails to isolate whether the process of setting aspirations independently of the choice set constitutes a distinct rational norm.

  3. I will distinguish search satisficing from evaluative satisficing to isolate the latter as a procedural norm rather than an outcome pattern. This approach beats mere redescription because it tests the stability of the aspiration mechanism itself under reflective equilibrium, rather than fitting past choices to a utility curve. By analyzing the rationality of the aspiration-setting rule ex ante, we bypass the triviality of ex post representation.

  4. Success looks like a proof that evaluative satisficing is either reflectively stable or necessarily collapses into optimization when agents prefer consistent aspiration-setting rules. Failure would consist in demonstrating that the distinction remains inherently vague or that no normative force can be attached to the procedure independent of its outcomes. Either outcome resolves the debate by eliminating the middle ground currently occupied by ambiguous definitions.

  5. The three-month residency allows me to formalize the distinction between search and evaluative satisficing and test its reflective stability through conceptual analysis. The scope is limited to normative decision theory, excluding empirical psychology or computational modeling, ensuring the work remains purely philosophical. This focus allows for a rigorous examination of the rationality conditions without the distraction of parameter fitting or data collection.
