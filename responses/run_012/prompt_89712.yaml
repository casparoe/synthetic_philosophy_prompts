      *   *Fix:* Make sure the response highlights that this is a lingering intellectual framework. He doesn't believe the salvation part anymore, but the ethical logic still sticks. It's a ghost of his training.
      *   *Thought:* Is the "double heart" exactly "belief + intention"?
