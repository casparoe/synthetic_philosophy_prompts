answer: |-
  This is a fantastic ethical conflict for a scene. You have intuition on the right track: Augustine is less concerned with objective reality (what is actually true) than with subjective integrity (what the speaker *believes* to be true).

  Here is an unpacking of the text to help you flesh out the brother's argument, followed by suggestions on how to keep him from sounding like a caricature.

  ### 1. What is the "Double Heart" (*Cor Duplex*)?

  You asked if it is "two beliefs at once" or "one belief plus one intention to deceive."

  According to the passage you quoted, it is **one belief held in reserve, and one belief knowingly uttered as a replacement.**

  Augustine defines the "double heart" as a division between the *internal sanctuary* and the *external expression*.
  *   **Thought 1 (Hidden):** "I believe/know X is true." (In your scene: *I don't know if the son is coming / I suspect he isn't.*)
  *   **Thought 2 (Uttered):** "I am saying Y, and I know Y is not X." (In your scene: *I am saying the son is coming.*)

  It is not cognitive dissonance (believing two contradictory things). It is **duplicity**. It is the act of creating a gap between who you are internally and who you present yourself to be externally. For Augustine, this fractures the soul. The "double heart" isn't just lying to the listener; it is lying to one's own nature as a truth-telling being.

  **For the Brother:** He shouldn't accuse her of being "mean." He should accuse her of being *divided*. He might say, *"You're splitting yourself in two, sister. One of you knows the truth, the other is performing a play. That gap is where the rot sets in."*

  ### 2. The "Accidental Truth" Trap

  This is the specific point your lapsed seminarian would pounce on. You asked: *If the son really is coming, does Augustine still call that a lie?*

  **Yes. Absolutely.**

  For Augustine, the morality of the act resides in the **intent of the speaker**, not the **accuracy of the statement**.

  *   **Scenario A:** You say something false, but you *think* it is true. (You are mistaken, not lying.)
  *   **Scenario B:** You say something true, but you *think* it is false. (You are lying, even though you told the truth.)

  In your scene, the caretaker says, "Your son is coming." She *believes* this might be false (or knows she has no evidence). Therefore, she intends to deceive. If the son walks through the door five minutes later, Augustine argues she is **still a liar**. She told the truth *accidentally*, but she lied *essentially*.

  **For the Brother:** This is his strongest ammunition. It allows him to be intellectually sharp without being cruel.
  *   *"If the son walks through that door, you didn't tell the truth. You got lucky. You intended to deceive him. The fact that reality bailed you out doesn't cleanse your heart. You're still a liar who got lucky."*

  ### 3. Does Augustine Care About Consequences? (The "White Lie" Problem)

  This is where you can add the most nuance to the brother. Augustine is often painted as a rigid absolutist, but in *On Lying* (*De Mendacio*), he actually categorizes lies into **eight types**, ranging from most heinous (lying in religious doctrine) to least heinous (lying to protect someone's body from defilement).

  However, his conclusion remains: **Even the "least heinous" lie is still a sin.** He argues that lying is an intrinsic evil, like adultery. You cannot commit "good adultery" to save a marriage, and you cannot tell a "good lie" to save a spirit.

  He believes that truth is ontological—it is tied to the nature of God. To lie is to move away from Being, regardless of the temporal benefit.

  **For the Brother:** To avoid making him a cardboard villain, he shouldn't argue from "Rules." He should argue from "Order."
  *   **Cardboard Version:** "The Bible says don't lie. You're sinning."
  *   **Nuanced Version:** "I know you want to ease his pain. But you're trading a momentary comfort for a fundamental disorder. If we start deciding which truths are 'useful,' who decides? You? Me? If you lie to him about the son, why not lie about the pain? Why not lie about God? Where does the utility stop?"

  ### 4. Writing the Lapsed Seminarian

  To keep the brother from sounding like a religious robot, remember that he is **lapsed**. He doesn't necessarily believe he's going to hell, and he might not even believe in God anymore. But he is haunted by the *logic* of the theology. It's a ghost in his machine.

  Here are three angles for his argument that keep him human:

  **A. The Argument from Integrity (Not Piety)**
  He shouldn't frame this as obeying God, but as preserving *her* integrity.
  > "It's not about him, it's about you. Augustine says the lie doesn't hurt the person who hears it as much as the person who speaks it. You're teaching yourself that reality is malleable. That when things get hard, you edit the world. That's a dangerous habit to pick up."

  **B. The Argument from Uncertainty**
  He can acknowledge that he left the church, but admit this specific logic still holds weight for him.
  > "I don't wear the collar anymore. You know that. But I can't shake the logic. If truth is just whatever keeps the peace, then truth is nothing. And if the son *does* show up, he'll know you lied to his father. You're buying peace now with currency that will bounce later."

  **C. The Argument from the "Double Heart"**
  This is the most poetic angle. He sees her suffering in the lie.
  > "You have one thing in your mind, and another in your mouth. Augustine calls that a 'double heart.' It looks like compassion from the outside, but from the inside... it feels like fracturing. I can see it in you. You're holding your breath waiting to see if you get caught by reality."

  ### Summary for your Scene

  1.  **The Definition:** The lie is the mismatch between mind and mouth, not mouth and reality.
  2.  **The Trap:** If the son arrives, she is still a liar because she *intended* deception.
  3.  **The Stakes:** Augustine argues the harm is done to the *liar's soul* (the double heart), not necessarily the listener.
  4.  **The Brother's Voice:** Make him weary, not righteous. He isn't policing her; he's warning her that the "double heart" is a heavy thing to carry, even if the lie works.

  This gives you a conflict where both characters are right in their own way: She is right about **compassion** (care for the dying), and he is right about **integrity** (care for the truth). That is where the best drama lives.
