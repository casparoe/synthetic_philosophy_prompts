      *   *Tone:* Supportive, analytical, creative.
      *   *Accuracy:* Ensure Augustine's theology is represented fairly (he is strict, but nuanced in his categorization).
      *   *Correction:* Make sure to distinguish between *De Mendacio* (On Lying) and *Contra Mendacium* (Against Lying). The quote is from *De Mendacio*. The theology is consistent across both regarding the definition of a lie.

  5.  **Final Polish:** (Self-Correction during drafting)
