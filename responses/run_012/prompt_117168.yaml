answer: |-
  Your unease with the F-twist is well-founded. It conflates *empirical adequacy* (saving the phenomena) with *structural validity* (capturing the machinery). For a natural scientist, a model that predicts well via compensating errors is a ticking time bomb for intervention; for an instrumentalist, it is a success. To resolve this, we need a specification that separates the *function* of an assumption from its *truth value*.

  Below is a specification of desiderata for an account of unrealistic assumptions, followed by the requested distinction, the incompatibilities, and the evaluation.

  ### I. Desiderata for an Account of Unrealistic Assumptions

  An adequate account must satisfy the following requirements. I have marked those that are **Non-Negotiable (NN)** for empirical science generally, and those that are **Camp Commitments (CC)** specific to Scientific Realism or Causal Modelling (which aligns with your practice).

  **1. Predictive Stability (NN)**
  *   **Requirement:** The model must generate outputs that match observational data within a specified domain of validity.
  *   **Motivation:** Minimal empirical adequacy. If it does not predict, it is not a scientific model of the phenomenon.
  *   **Case Covered:** Ensures the F-twist's core insight (prediction matters) is retained, but not as the *sole* criterion.

  **2. Intervention Sensitivity (CC)**
  *   **Requirement:** The account must distinguish between assumptions that remain stable under external manipulation and those that break.
  *   **Motivation:** A false assumption that represents the very mechanism an intervention targets will lead to policy failure (the Lucas Critique in economics, or engineering failure in physics).
  *   **Case Covered:** *A false assumption that is precisely the mechanism a proposed intervention would act upon.*

  **3. Asymptotic Recoverability (NN)**
  *   **Requirement:** The account must distinguish between idealizations that converge to a truth as a parameter varies (limits) and fictions that do not.
  *   **Motivation:** In physics, assuming friction is zero is recoverable (let $\mu \to 0$). Assuming agents have perfect foresight may not be. We need to know if the falsehood is a controllable approximation or an ontological dead-end.
  *   **Case Covered:** *Assumptions that approximate a truth approachable as a limit, as against fictions for which no such limit exists.*

  **4. Error Structure Transparency (NN)**
  *   **Requirement:** The account must identify whether predictive success arises from correct mechanism or from compensating errors.
  *   **Motivation:** Compensating errors (e.g., overestimating parameter $A$ and underestimating $B$) yield accurate predictions in-sample but fail out-of-sample or under perturbation.
  *   **Case Covered:** *False assumptions whose errors cancel in the aggregate.*

  **5. Derivational vs. Ontic Role (CC)**
  *   **Requirement:** The account must distinguish between assumptions required to close the mathematics (licensing) and assumptions asserting causal capacity (explanatory).
  *   **Motivation:** We often assume "closed system" or "differentiable function" to solve the equations. These are mathematical licenses. We assume "natural selection" or "gravity" to explain the change. Conflating the two leads to reifying mathematical conveniences.
  *   **Case Covered:** *The difference between assumptions that merely license a derivation and assumptions that do the explanatory work.*

  **6. Robustness Invariance (CC)**
  *   **Requirement:** The core results should not depend sensitively on the specific formulation of auxiliary assumptions.
  *   **Motivation:** If a result holds only under one specific false assumption but fails under a slightly more realistic variant, the result is an artifact of the assumption, not the phenomenon.
  *   **Case Covered:** Provides the test for the Load-bearing/Scaffolding distinction below.

  ---

  ### II. The Distinction: Load-bearing vs. Scaffolding Falsehoods

  You requested a fixed distinction with a criterion. We define these based on **counterfactual stability**.

  **Definitions:**
  *   **Scaffolding Falsehood:** An assumption $A$ is scaffolding if the model's core result $R$ remains invariant (qualitatively and quantitatively within tolerance) when $A$ is replaced by a more realistic assumption $A'$, or when $A$ is removed and the derivation repaired. The falsehood facilitates the construction but does not support the weight of the conclusion.
  *   **Load-bearing Falsehood:** An assumption $A$ is load-bearing if the model's core result $R$ is sensitive to $A$. If $A$ is replaced by $A'$ (more realistic) or removed, $R$ collapses, changes sign, or loses predictive power. The falsehood is doing the work of generating the result.

  **The Criterion: De-idealization Sensitivity Analysis**
  To determine which category a specific assumption $A$ falls into in a particular model $M$:
  1.  **Identify** the idealization $A$ (e.g., "population is infinite," "friction is zero").
  2.  **Construct** a sequence of models $M_1, M_2, ... M_n$ where $A$ is progressively relaxed toward reality (e.g., population $N \to \infty$, friction $\mu \to 0$).
  3.  **Observe** the behavior of result $R$.
      *   If $R$ converges smoothly or remains stable across the sequence, $A$ is **Scaffolding**.
      *   If $R$ exhibits a discontinuity, bifurcation, or significant drift as $A$ is relaxed, $A$ is **Load-bearing**.

  *Note:* A Load-bearing Falsehood is not necessarily fatal (it may be a valid limit approximation, see Desideratum 3), but it must be flagged as a point of structural vulnerability. A Scaffolding Falsehood is epistemically innocuous regarding the result.

  ---

  ### III. Incompatibilities (The Plain Truth)

  You asked to identify where demands cannot be jointly satisfied. There are two primary tensions in modelling practice that the F-twist attempts to gloss over.

  **1. Prediction vs. Intervention Validity**
  *   **Conflict:** You can maximize predictive accuracy (in-sample) using Load-bearing Falsehoods that rely on compensating errors (e.g., curve-fitting with no causal basis). However, this directly violates Intervention Sensitivity.
  *   **Verdict:** You cannot have a model that relies on compensating errors *and* trust it for policy intervention. Friedman's F-twist sacrifices Intervention Validity for Predictive Stability. If your goal is control/engineering, the F-twist is insufficient.

  **2. Tractability vs. Asymptotic Recoverability**
  *   **Conflict:** To make a model solvable (tractable), we often introduce fictions (e.g., representative agents) for which no limit exists (you cannot have "one person" represent "many people" as a limit case; it is a category error).
  *   **Verdict:** You cannot always satisfy Asymptotic Recoverability while maintaining mathematical solvability in complex systems. Sometimes you must choose between a solvable model with unrecoverable fictions (Friedman) or an intractable model that respects structural truth.

  **3. Explanation vs. Epistemic Innocence**
  *   **Conflict:** To explain a phenomenon causally (CC), you often need assumptions that are strictly false (e.g., isolating a force). To be epistemically innocent (NN), assumptions should be approximately true.
  *   **Verdict:** Causal explanation often *requires* controlled falsehoods (Galilean idealization). You cannot explain complex interactions by only stating true facts; you must isolate variables via false "ceteris paribus" clauses. Explanation demands some Load-bearing Falsehoods that are justified only by their isolation power, not their truth.

  ---

  ### IV. Evaluation: Friedman vs. Galilean Idealization

  **Friedman's Instrumentalism (The F-twist):** Treats assumptions as mere entry points for prediction. Truth of assumptions is irrelevant.
  **Galilean Idealization (Cartwright/McMullin):** Treats assumptions as isolating tools to study specific causes. Assumptions are false but intended to be "controlled" distortions that can theoretically be corrected.

  | Desideratum | Friedman's Instrumentalism | Galilean Idealization |
  | :--- | :--- | :--- |
  | **1. Predictive Stability** | **Satisfied.** This is the sole criterion. | **Satisfied.** Prediction is necessary but not sufficient. |
  | **2. Intervention Sensitivity** | **Fails.** Explicitly denies the need for realistic mechanisms. High risk of policy failure. | **Satisfied.** Aims to identify causal capacities that persist under intervention. |
  | **3. Asymptotic Recoverability** | **Ignores.** Does not distinguish between limits and fictions. | **Satisfied.** Central to the view; idealizations must be removable in principle. |
  | **4. Error Structure** | **Blind.** Compensating errors are acceptable if prediction holds. | **Flagged.** Compensating errors indicate a failure of isolation, not success. |
  | **5. Derivational vs. Ontic** | **Collapses.** All assumptions are treated as derivational licenses. | **Distinguishes.** Separates mathematical convenience from causal isolation. |
  | **6. Robustness Invariance** | **Irrelevant.** Robustness matters only if it aids prediction. | **Central.** Robustness across idealizations confirms the causal capacity. |

  **Summary Assessment:**
  *   **Friedman** satisfies the **Non-Negotiable (NN)** requirement of Prediction but fails the **Camp Commitments (CC)** required for natural scientific understanding (Intervention, Explanation, Recoverability). It treats Load-bearing Falsehoods as acceptable, which is dangerous for your practice.
  *   **Galilean Idealization** satisfies the **CC** requirements by providing a framework to justify *why* a falsehood is permissible (it isolates a cause). However, it struggles with **Tractability** in highly complex, non-linear systems where factors cannot be cleanly isolated.

  **Recommendation:**
  Adopt the **Load-bearing/Scaffolding** distinction as your operational filter. Accept Scaffolding Falsehoods freely (they are mathematical tools). Treat Load-bearing Falsehoods with suspicion: demand Asymptotic Recoverability for them. If a Load-bearing Falsehood is not recoverable (no limit exists), the model is phenomenological only (Friedman-style) and must not be used for mechanistic explanation or intervention.
