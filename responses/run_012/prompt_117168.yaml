prompt: |-
  I am a retired natural scientist who has lately been reading philosophy of science, and I have got stuck on the F-twist — the thesis, associated with Milton Friedman's essay on positive economics, that a theory's assumptions need not be realistic and that the theory is to be judged by the accuracy of its predictions over the range of phenomena it is meant to cover. After forty years of building and defending models, I find this at once familiar and evasive, and I would rather have the specification than another defence of it.

  Set out the desiderata any adequate account of unrealistic assumptions in scientific modelling must satisfy: the cases it must get right, the distinctions it must not collapse, and the features of actual modelling practice it must be consistent with, with the consideration that motivates each requirement. The following should be among them, since they are where the simple story breaks down in my experience: false assumptions whose errors cancel in the aggregate; a false assumption that is precisely the mechanism a proposed intervention would act upon; assumptions that approximate a truth approachable as a limit, as against fictions for which no such limit exists; and the difference between assumptions that merely license a derivation and assumptions that do the explanatory work. Please coin and fix a distinction between falsehoods that are load-bearing, in the sense that the result depends on them, and falsehoods that are scaffolding, in the sense that the result survives their removal, and give me a criterion for telling which is which in a particular model.

  Mark which requirements are non-negotiable and which are commitments of one camp. If some pair cannot be jointly satisfied — the demand that a model explain rather than merely predict, say, together with the demand that its unrealistic assumptions be epistemically innocuous — say so plainly, as that is the part I most want. Then, briefly, how Friedman's answer and the Galilean-idealisation answer fare against the list; a table is acceptable there, but keep the weight on the criteria.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User Persona:** Retired natural scientist (40 years experience building/defending models). Reads philosophy of science. Stuck on the "F-twist" (Friedman's instrumentalism). Finds it familiar but evasive. Wants *specification* (criteria/desiderata), not just defense.
      *   **Core Task:** Set out desiderata for an adequate account of unrealistic assumptions in scientific modelling.
      *   **Specific Requirements:**
          *   Must cover specific cases: error cancellation, intervention targets, limits/approximations vs. fictions, derivational vs. explanatory assumptions.
          *   Must coin/fix a distinction: "Load-bearing" vs. "Scaffolding" falsehoods, with a criterion for telling them apart.
          *   Must mark requirements as Non-Negotiable (NN) or Camp Commitments (CC).
          *   Must identify incompatibilities (trade-offs) plainly.
          *   Must evaluate Friedman's Instrumentalism and Galilean Idealization against the list (briefly, table okay, weight on criteria).
      *   **Tone:** Rigorous, precise, respectful of scientific practice, philosophically informed but not jargon-heavy without purpose. Avoid fluff/defenses; focus on specification.

  2.  **Deconstruct the "F-twist" (Friedman's Instrumentalism):**
      *   Friedman (1953): Assumptions don't need to be realistic; only predictions matter.
      *   Scientist's intuition: This feels wrong because sometimes assumptions *matter* for mechanism, intervention, and understanding, not just output matching.
      *   Goal: Create a framework that captures *why* it feels wrong in some cases and right in others.

  3.  **Drafting the Desiderata (The "Specification"):**
      *   *Requirement 1: Predictive Adequacy.* (Obvious, but needs nuance). A model must predict within domain. (NN)
      *   *Requirement 2: Explanatory Depth vs. Phenomenological Fit.* Distinguish between "saving the phenomena" and "capturing the mechanism." (CC - Realists care, Instrumentalists don't).
      *   *Requirement 3: Intervention Sensitivity.* If I change $X$, does the model break? Crucial for policy/engineering. (NN for applied science).
      *   *Requirement 4: Limit Behavior.* Distinguish approximations (converge to truth) from fictions (no convergence). (NN for natural scientists).
      *   *Requirement 5: Error Structure.* Aggregate cancellation vs. systematic bias. (NN).
      *   *Requirement 6: Derivational vs. Explanatory Role.* (The "licensing" vs. "working" distinction). (NN).

  4.  **Developing the "Load-bearing" vs. "Scaffolding" Distinction:**
      *   *Concept:* Scaffolding is removed after construction (or doesn't affect the final structure's stability). Load-bearing holds it up.
      *   *Definition:*
          *   *Scaffolding Falsehood:* An assumption $A$ is scaffolding if removing/replacing $A$ with $A'$ (more realistic) leaves the core result $R$ invariant (robust).
          *   *Load-bearing Falsehood:* An assumption $A$ is load-bearing if $R$ is sensitive to $A$. If $A$ is false, $R$ is untrustworthy *unless* $A$ is known to be a specific kind of approximation (see Limit Behavior).
      *   *Criterion:* **Robustness Analysis.** Vary the assumption. If the result holds across a class of more realistic assumptions, it's scaffolding. If the result collapses or changes sign, it's load-bearing.

  5.  **Identifying Trade-offs (Incompatibilities):**
      *   *Prediction vs. Explanation:* You can have high predictive power with load-bearing falsehoods (Friedman), but you lose explanatory validity and intervention reliability.
      *   *Tractability vs. Realism:* Often, making assumptions realistic makes the model unsolvable.
      *   *The "F-twist" Tension:* Friedman prioritizes Prediction. Realists prioritize Mechanism. You can't fully satisfy both if the mechanism is hidden behind a "black box" assumption that predicts well but is false.

  6.  **Evaluating Friedman vs. Galilean Idealization:**
      *   *Friedman (Instrumentalism):* Great on prediction, fails on intervention and explanation. Treats all falsehoods as acceptable if predictions hold.
      *   *Galilean (Idealization as isolation):* Assumes we strip away factors to study one cause. Needs the "limit" concept. Better on explanation, harder on complex systems where factors can't be isolated.

  7.  **Refining the Output Structure:**
      *   **Introduction:** Acknowledge the user's expertise and the validity of their unease.
      *   **Section 1: Desiderata:** List the requirements with NN/CC tags and motivations. Include the specific cases requested (cancellation, intervention, limits, licensing).
      *   **Section 2: The Load-bearing/Scaffolding Distinction:** Define and provide the criterion (Robustness).
      *   **Section 3: Incompatibilities:** Be plain about trade-offs.
      *   **Section 4: Evaluation:** Compare Friedman and Galilean against the desiderata.

  8.  **Self-Correction/Polishing during drafting:**
      *   *Check:* Did I address "false assumptions whose errors cancel"? Yes, under Error Structure.
      *   *Check:* Did I address "intervention"? Yes, under Intervention Sensitivity.
      *   *Check:* Did I address "limits vs fictions"? Yes, under Asymptotic Recoverability.
      *   *Check:* Did I address "licensing vs explanatory"? Yes, under Derivational vs. Ontic Role.
      *   *Tone Check:* Ensure I'm not lecturing a scientist on science. Use their language (models, parameters, sensitivity).
      *   *Refining the "Load-bearing" definition:* Make sure it's operational. "Counterfactual Stability" is a good phrase.
      *   *Refining the NN/CC tags:* Prediction is NN for *science*, but Explanation is CC for *Realists*. Friedman would reject Explanation as NN. I need to make sure the user knows which is which. Given the user is a natural scientist, they likely view Explanation as NN, but philosophically, it's a Realist commitment. I will mark Prediction as NN (minimal bar) and Explanation/Intervention as NN for *applied/natural* science, but note the Instrumentalist dissent. Actually, better to mark Prediction as NN (minimum for empirical science) and Mechanism/Intervention as NN for *causal* modelling (which the user implies they do). Let's stick to a strict philosophical classification: Prediction is NN for empiricism; Mechanism is CC for Realism.
      *   *Wait, one nuance:* The prompt asks to mark which are non-negotiable and which are commitments of one camp. I should be careful. For a natural scientist, intervention validity *is* non-negotiable. But in the philosophy of science debate, Instrumentalists deny it. I will label them based on the *philosophical debate* context but acknowledge the scientific practice context.
      *   *Decision:* I will label requirements based on whether they are required for *minimal empirical adequacy* (NN) or *causal/structural understanding* (CC - Realist/Causalist).

  9.  **Final Review against constraints:**
      *   Coin distinction? Yes (Load-bearing/Scaffolding).
      *   Criterion? Yes (Robustness/Sensitivity Analysis).
      *   Table for Friedman/Galilean? Yes.
      *   Plain about incompatibilities? Yes.

  10. **Drafting the Content:** (Mental outline of the text to ensure flow).
      *   Intro: Validate the "evasive" feeling.
      *   Desiderata List (1-6).
      *   The Distinction (Definition + Criterion).
      *   The Trade-offs (The "Plain Truth").
      *   The Evaluation (Table + Commentary).

  11. **Final Polish:** Ensure terms like "Galilean Idealization" are used correctly (Cartwright/ McMullin tradition). Ensure Friedman's position is represented charitably but critically. (Proceed to generate output).

  *(Self-Correction during drafting the "Load-bearing" section)*: I need to make sure the criterion isn't just "does it matter?" but "how do we test it?" The test is *de-idealization*. If making it more realistic breaks the result, it was load-bearing. If the result persists, it was scaffolding.

  *(Self-Correction on "Error Cancellation")*: This is a specific case of Load-bearing falsehoods that are dangerous. I need to ensure the desiderata explicitly flag "compensating errors" as a risk to be identified, not just accepted.

  *(Self-Correction on "Limits")*: Distinguish between *controlled approximations* (perturbation theory style) and *essential fictions* (point masses).

