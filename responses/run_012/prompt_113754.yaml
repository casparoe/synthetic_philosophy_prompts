answer: |-
  You have identified a precise and philosophically significant tension that is often obscured in public discourse. You are correct that "collective guilt" is the wrong label, as guilt implies *culpability* (a backward-looking judgment on the moral quality of an agent's will), whereas the arguments you describe rely on *liability* (a forward-looking or structural obligation to repair).

  The phenomenon you are tracking does not have a single, universally agreed-upon noun, but it is a central problem in the literature on **Historical Justice** and **Corporate Moral Agency**. The most accurate existing terminology comes from political philosopher **David Miller**, who distinguishes between **"Outcome Responsibility"** and **"Blame."**

  Here is the breakdown of the concept, the edges of the literature, and a proposal for how to label the specific rhetorical pattern you have observed.

  ### 1. The Concept: Outcome Responsibility without Culpability

  The entity you are describing is a **Diachronic Corporate Agent**.
  *   **Diachronic:** It persists through time, surviving the total replacement of its constituent parts (the "Ship of Theseus" problem applied to institutions).
  *   **Corporate:** It is a collective entity capable of holding rights and duties distinct from its current members.
  *   **Agent:** It is treated as capable of action (signing treaties, building buildings, holding wealth).

  The specific normative status you have isolated—where the entity owes a debt but is not "guilty"—is best termed **Remedial Liability** (or **Outcome Responsibility**).

  *   **Culpability (Guilt):** Requires *mens rea* (a guilty mind). It asks: "Did you intend to do wrong?" Since current members did not exist, they cannot be culpable.
  *   **Remedial Liability (Debt):** Requires *causal or structural connection*. It asks: "Does the current state of affairs rest on a violation of rights?" If yes, the entity holding the benefits or the continuity of the structure has an obligation to rectify, regardless of intent.

  **David Miller** argues in *Holding Nations Responsible* (2007) that nations (and by extension, institutions) can be responsible for past outcomes without being blameworthy for them. He uses the analogy of inheritance: if you inherit a house built with stolen bricks, you are not guilty of the theft, but you are liable for the return of the bricks (or their value) because you hold the title.

  ### 2. The Rhetorical Pattern: "Normative Equivocation"

  You noted that proponents slide between the vocabulary of blame and the vocabulary of debt. In the literature, this is sometimes critiqued as **Normative Equivocation** or **Strategic Ambiguity**.

  *   **Why it happens:** "Debt" is metaphysically easier to defend (institutions survive, debts survive) but emotionally weaker (paying a bill is transactional). "Guilt" is emotionally potent (it demands shame and repentance) but metaphysically fragile (how can I be guilty of what I didn't do?).
  *   **The Move:** Proponents use the *metaphysics of debt* (the institution persists) to establish the *obligation*, but they invoke the *affect of guilt* (shame, apology) to ensure the obligation is felt personally by current members.

  There is no single canonical name for this rhetorical slide, but in critical legal studies, it is often discussed under the heading of **"The Paradox of Corporate Continuity."**

  ### 3. Marking the Edges: What Does the Obligation Attach To?

  You asked what the obligation attaches to, as this determines when the debt ends. The literature generally splits into three camps, which define the "edges" of your pattern:

  **A. The Continuity View (Institutional Persistence)**
  *   **Attachment:** The obligation attaches to the *legal/structural identity* of the institution.
  *   **Condition:** As long as the institution retains its charter, name, or unbroken legal lineage, the debt remains.
  *   **Edge Case:** A university renames a building but keeps its endowment and charter. The debt remains.
  *   **Limit:** If the institution goes bankrupt and ceases to exist legally, the debt lapses (like any corporate debt).
  *   **Proponents:** Legal theorists of **Successor Liability**.

  **B. The Benefit View (Unjust Enrichment)**
  *   **Attachment:** The obligation attaches to the *assets* derived from the wrong.
  *   **Condition:** The debt exists only as long as the specific ill-gotten gains (or their investment returns) are identifiable within the current holdings.
  *   **Edge Case:** If the slave-trading merchant's money was spent on a building that burned down in 1900, the debt lapses because the benefit is gone.
  *   **Limit:** This is very hard to trace historically (fungibility of money).
  *   **Proponents:** **Daniel Butt** (*Rectifying Historical Injustices*).

  **C. The Structural View (Persistent Harm)**
  *   **Attachment:** The obligation attaches to the *ongoing disadvantage* caused by the wrong.
  *   **Condition:** The debt remains as long as the victims (or their descendants) are still suffering the effects of the initial wrong, regardless of the institution's lineage.
  *   **Edge Case:** Even if the university changes its name and charter, if the racial hierarchy established by the slave-trading founder still structures the local economy, the obligation remains.
  *   **Limit:** This can make the debt infinite, as historical effects ripple forever.
  *   **Proponents:** **Iris Marion Young** (Social Connection Model).

  **Your Observation:** In the cases you described, proponents usually argue from **Continuity** (the university is the same) to establish the debt, but implicitly rely on **Benefit** (the building is still here) to make it concrete, while invoking **Structural** language (apologies, shame) to motivate payment.

  ### 4. When Does the Obligation Lapse? (The Supersession Thesis)

  You asked for rules on when the thing ends. The most rigorous treatment of this is **Jeremy Waldron's "Supersession Thesis"** (*Indigenous Peoples and the Right to Land*, 1992).

  Waldron argues that historical injustices can be "superseded" by changes in circumstance. An obligation might have been valid in 1850, but if the population dynamics, resource scarcity, or institutional structure changes enough, the obligation may lapse.
  *   **The Arbitrary Line:** The line is usually drawn at **"Constitutional Rupture."**
      *   *Case Inside the Line:* The US Government today is the legal successor to the US Government of 1860. It owes debts (and reparations) because the legal persona never died.
      *   *Case Outside the Line:* The Russian Federation is not legally identical to the Soviet Union. While it assumed some debts, it contested liability for crimes, arguing a constitutional rupture occurred.
      *   *The Arbitrariness:* In the family inheritance case you mentioned, there is no constitutional rupture. The family line is biological and legal. The "arbitrary" line here is often **Statute of Limitations**, which is a legal pragmatic, not a moral truth.

  ### 5. A Proposed Terminology for Your Work

  Since you are advising a committee and teaching, you need a term that is precise but communicable. "Collective Guilt" is wrong. "Historical Debt" is too vague.

  I suggest you use the term **"Diachronic Institutional Liability."**

  *   **Definition:** An obligation borne by a persistent corporate entity to rectify a past wrong, grounded in the continuity of the entity's identity and/or the retention of unjustly acquired assets, distinct from the personal culpability of its current members.
  *   **Why this term:**
      *   *Diachronic:* Acknowledges the time-travel problem (it survives member turnover).
      *   *Institutional:* Clarifies the bearer (not the individual).
      *   *Liability:* Distinguishes it from Guilt/Culpability (you can be liable for a car accident you didn't intend; you are not guilty of it).

  ### 6. Boundary Cases for Your Committee

  To help your committee "mark the edges," use these test cases to see if the liability holds:

  1.  **The Total Turnover Test:** If every single employee, board member, and beneficiary is replaced, does the obligation remain?
      *   *If Yes:* The obligation attaches to the **Charter/Name** (Diachronic Liability).
      *   *If No:* The obligation attached to the **People** (Collective Guilt).
  2.  **The Dissolution Test:** If the university closes and sells all assets to pay creditors, does the moral debt vanish?
      *   *If Yes:* The obligation was **Financial/Asset-based**.
      *   *If No:* The obligation was **Symbolic/Structural** (and perhaps cannot be discharged by money).
  3.  **The Rupture Test:** If the town changes its form of government (e.g., from a mayor-council to a state-appointed receivership), does the new entity inherit the plaque decision?
      *   *If Yes:* The **State** is the continuous agent.
      *   *If No:* The obligation died with the previous administration.

  ### Summary

  You are looking at **Diachronic Institutional Liability**. The literature distinguishes this from **Collective Culpability**. The "slide" you observe is **Normative Equivocation**, where speakers use the metaphysics of liability (institutions persist) to secure the obligation, but the rhetoric of culpability (shame, apology) to secure compliance.

  The obligation attaches primarily to **Institutional Continuity** (the legal/moral persona), secondarily to **Unjust Enrichment** (the assets). It lapses upon **Constitutional Rupture** (the death of the legal persona) or **Supersession** (circumstances change so drastically the original claim no longer applies), though the latter is highly contested.

  **Recommended Reading for "Marking the Edges":**
  *   **David Miller,** *Holding Nations Responsible* (2007) — specifically Chapter 4 on "Outcome Responsibility."
  *   **Janna Thompson,** *Taking Responsibility for the Past* (2002) — on the distinction between being responsible *for* the past vs. responsible *to* the past.
  *   **Jeremy Waldron,** "Superseding Historic Injustice" (*Ethics*, 1992) — on when the debt expires.
  *   **Christopher Kutz,** *Complicity: Ethics and Law for a Collective Age* (2000) — on how individuals participate in collective harm without direct intent.

  This framework should allow you to tell your committee: *"We are not asking if you are guilty. We are asking if the institution you currently steward is the same entity that incurred this liability, and whether that liability survives your tenure."* This cuts through the "I wasn't born yet" objection without falsely accusing them of personal sin.
