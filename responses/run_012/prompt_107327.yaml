      *   **Christopher Browning (*Ordinary Men*, 1992):** Focuses on Reserve Police Battalion 101. Argues these were ordinary men (not ideologically driven Nazis initially). Key factors: group conformity, peer pressure, authority, brutalization of war, racism (present but not necessarily the *sole* driver). Does *not* say *anyone* would do it (he acknowledges some refused without severe punishment). Does *not* say morality doesn't matter (he highlights the few who refused). Not strictly "banality of evil" (Arendt), though related. He emphasizes situational factors but doesn't exclude ideology entirely.
