answer: |-
  1. ProPublica measured false-positive and false-negative rates across groups while Northpointe measured calibration and predictive values within groups, and because the base rate of arrest was higher for Black defendants, the impossibility theorem dictates that satisfying Northpointe's calibration necessarily violates ProPublica's parity, ruling out only the existence of a classifier that simultaneously achieves equal error rates and equal calibration across groups with disparate base rates rather than prescribing which metric must yield.

  2. The theorem leaves untouched the legitimacy of the underlying base-rate difference itself, the objective function the decision-maker is entitled to maximize, and the normative question of which of the three quantities the instrument is for, meaning the dispute is not settled by the mathematics but merely relocated from an argument about arithmetic correctness to a conflict over which impossibility constraint society ought to violate.

  3. Since the result is a statement about the joint distribution of score, group, and label, the impossibility claim holds strictly for the observed arrest data but collapses as a guarantee of fairness when the label is an arrest rather than an offense, because group-dependent measurement error in that label and a labelling process partly produced by the system that consumes the score mean the theorem optimizes for consistency with a biased historical record rather than correctness about underlying risk.

  4. A calibrated and equally predictive instrument can nonetheless be used unjustly through the thresholds applied to it because the result is addressed to the statistical properties of the score rather than the utility function of the decisions, and when a single instrument is thresholded at several decision points with different stakes, the fixed statistical trade-off forces distinct moral compromises in each context because the cost of false positives versus false negatives differs fundamentally between pretrial release and sentencing aid.

  5. The episode shows the impossibility results are a confirmation of the structural constraints on measurement rather than a resolution to the moral conflict, serving as a case they anticipated mathematically but never anticipated politically, and someone who leans on those results should concede that proving a trade-off exists does not instruct us on which side of the trade-off protects human liberty.
