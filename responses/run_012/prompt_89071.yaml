  The tension you describe is the central problem of *epistemic circularity* and *bootstrapping* in contemporary epistemology. Your intuitions align with a view often called *Dogmatism* (or Particularism) regarding perception, combined with an *Anti-Bootstrapping* constraint on track-record arguments.

  Your original principle ("A method may not be used to establish its own reliability") fails because it is too broad; it treats Moore's deduction the same as the gauge's induction. To save your verdicts, we must distinguish between using a method to know a **fact** (which may entail reliability) versus using a method to confirm its own **general track record**.

  Here is the repaired principle, precise to your requirements.

  ### The Principle of Non-Inductive Self-Support

  > **Clause 1 (First-Order and Deductive Permission):** A belief-forming method $M$ confers justification on specific, first-order beliefs about the world, and on any deductive consequences of those beliefs, even if those consequences entail conditions necessary for $M$'s reliability.
  >
  > **Clause 2 (Inductive Reliability Prohibition):** A belief-forming method $M$ does *not* confer justification for a belief in $M$'s own *general reliability* if that belief is inferred from a series of outputs or comparisons generated solely by $M$, without independent verification of the truth of those outputs.

  ### How the Clauses Handle Your Cases

  **Clause 1 handles the cases you want to keep:**
  *   **The Tomato:** You form a first-order belief ("The tomato is red") directly via perception. You are not arguing *about* vision; you are simply seeing. This is permitted.
  *   **Moore's Hands:** You form a first-order belief ("Here is a hand") via perception. You then deduce a consequence ("An external world exists"). Although this conclusion is a condition for vision's reliability, the argument is **deductive** from a specific instance, not an inductive generalization about vision's track record. This is permitted.

  **Clause 2 handles the cases you want to reject:**
  *   **The Gauge:** You are attempting to conclude a claim about *general reliability* ("The gauge is reliable") based on a pattern of outputs ("readings keep matching"). Since the truth of the fuel levels is known only via the gauge, you lack independent verification. This is forbidden.
  *   **Memory:** You are inferring *general reliability* ("Memory is trustworthy") from a history of successes ("usually served her well") accessed only via memory. This is a track-record argument without independent access. This is forbidden.
  *   **The Sensor:** You are comparing readings from the sensor to readings from the *same* sensor. This is a comparative argument for reliability without independent data. This is forbidden.

  ### Application to the New Case: The Near-Sighted Person

  **The Case:** A near-sighted person concludes that her new glasses are correctly prescribed because the world looks sharp through them.

  **Analysis:**
  1.  **The Method ($M$):** Vision aided by the new glasses.
  2.  **The Evidence:** The world looks sharp (an output of $M$).
  3.  **The Conclusion:** The glasses are correctly prescribed (a claim about the *reliability/accuracy* of the method/tool).
  4.  **The Structure:** This is not a first-order belief about the world (e.g., "That tree is sharp"). It is a second-order belief about the *instrument's calibration*. Furthermore, it infers this calibration from the *appearance* produced by the instrument itself.

  **Verdict:**
  According to **Clause 2**, the person **does not know** that the glasses are correctly prescribed on this basis alone.

  **Reasoning:**
  This case is structurally identical to the **Gauge Case**.
  *   In the Gauge Case, the user reads "Full" and concludes "The Gauge is Accurate."
  *   In the Glasses Case, the user sees "Sharp" and concludes "The Glasses are Accurate."

  In both instances, the user is using the output of the device to validate the device's calibration. Just as a gauge could be stuck on "Full" while the tank is actually full (a lucky coincidence), glasses could distort the world in a way that *looks* sharp to a brain accustomed to blur, or over-correct in a way that feels sharp but is optically incorrect. To know the prescription is correct, she needs **independent verification** (e.g., an optometrist's phoropter test, or taking the glasses off and confirming the blur returns in a predicted way). Relying solely on the sharpness perceived *through* the glasses is an illicit form of self-certification.
