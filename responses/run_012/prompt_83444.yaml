answer: |-
  You have put your finger on the central paradox of modern international law. The shape you are staring at is not a coherent geometric solid; it is a cage with a hidden emergency exit. The practice you describe is not the application of a single moral or legal theory, but a pragmatic engineering solution designed to minimize war, even at the cost of logical consistency.

  Here is the reconstruction of the implicit theory, followed by the analysis of what it rules out and what would change if you swapped the underlying premises.

  ### 1. The Implicit Theory: Stability-Preserving Constitutionalism

  The practice presupposes a theory we might call **Stability-Preserving Constitutionalism**. Its primary axiom is not justice, consent, or nationhood, but **order**. It treats the existing international map as a default equilibrium that can only be disturbed by the consent of the current owner (the state) or by a catastrophic failure of that owner (remedial secession).

  **Who counts as the "Self"?**
  The practice presupposes that the "self" in self-determination is defined by the **existing administrative envelope**, not by culture or consent.
  *   **In the colonial context:** The "self" was the population within the colonial administrative border (hence *uti possidetis*). It did not matter if that border split the Ewe people between Ghana and Togo; the "people" entitled to independence were the people inside the Gold Coast border.
  *   **In the non-colonial context:** The "self" is the entire electorate of the existing state. When Catalonia claims to be "a people," international law replies, "No, the Spanish people are the self-determination unit; you are a region within that self."
  *   **The Presupposition:** The state creates the people, not the other way around. The right belongs to the population of the *state*, not the population of the *nation*. This is why internal voting counts as self-determination: you are exercising your share of the sovereignty of the existing unit.

  **Theory of Territory: Property with a Fiduciary Escape Clause**
  You asked if this is a property picture or a fiduciary one. The practice operates as **Property** with a hidden **Fiduciary** safety valve.
  *   **Property:** Default rules treat territory as integral to the state's sovereignty. The state "owns" the border. You cannot take it without the owner's consent (the UK granting Scotland a referendum, Spain denying Catalonia). This preserves the *uti possidetis* principle: borders are fixed assets to prevent endless war.
  *   **Fiduciary:** The safety valve is the doctrine of **Remedial Secession**. This is the "emergency exit." If the state becomes a tyrant that systematically excludes or persecutes a group (denying them internal self-determination), the fiduciary duty is breached. The state forfeits its claim to the territory.
  *   **The Tension:** International bodies rarely admit the fiduciary clause exists because admitting it encourages groups to claim they are abused. They prefer to say "secession is not a right" while quietly recognizing states that seceded due to abuse (Bangladesh, Kosovo, South Sudan).

  **Discharging the Right**
  To say a people has "exercised" self-determination by voting in state elections presupposes that self-determination is a **continuous status of participation**, not a **one-time outcome of statehood**.
  *   **The View:** The right is to *have a government that represents you*, not to *have your own government*.
  *   **Can it be discharged?** Yes, continuously. As long as you have the vote and are not persecuted, the right is being satisfied. This view treats the desire for independent statehood as a political preference, not a human right. It assumes that democracy solves the national question by subsuming it into a civic identity.

  **The Colonial/Non-Colonial Line**
  Does this presuppose self-determination is a one-time remedy for empire? **Yes.**
  *   **The Principle:** Decolonization was a unique historical correction of the specific wrong of overseas alien domination. It was a one-off transfer of title from Empire to Colony.
  *   **Can it be stated out loud?** No. To state it openly ("Self-determination is only for overseas colonies, not for the Scots or Catalans") would violate the universal language of the UN Covenants ("All peoples have the right...").
  *   **The Workaround:** The law uses the "Salt Water Thesis" (colonies must be overseas) as a proxy. It allows the international system to say "We support self-determination" universally, while applying it restrictively. It treats the colonial border as a "once-only" unlock code.

  ### 2. Rival Views: Ruled Out vs. Underdetermined

  You asked which views the practice rules out and which it merely fits. This is where the instability becomes visible.

  **Ruled Out (Incompatible with the Practice):**
  1.  **Pure Ethnic Nationalism:** The view that every distinct linguistic/cultural nation is entitled to a state. The practice explicitly rejects this via *uti possidetis*. If this view won, the map of Africa and the Middle East would be redrawn daily.
  2.  **Pure Plebiscitary Democracy:** The view that 50% + 1 of a territory can dissolve the sovereign bond at will. The practice rejects this by requiring central consent (Scotland) or declaring votes void (Catalonia).
  3.  **Absolute Statism:** The view that borders are sacred and secession is *never* legal. The practice rules this out because it *did* allow decolonization and implicitly allows remedial secession (Kosovo).

  **Underdetermined (Compatible but not Required):**
  1.  **Liberal Constitutionalism:** The practice fits a view where secession is a constitutional amendment process. This fits Canada (Quebec Reference), but the practice doesn't *require* constitutions to allow it (Spain's constitution forbids it, and the EU accepts that).
  2.  **Human Rights Instrumentalism:** The practice fits a view where secession is only a tool to stop genocide. But the practice doesn't *require* this to be codified; it remains ambiguous.

  **Is it a Coherent View?**
  No. It is an **unstable compromise** between a **Statist Theory** (borders are fixed) and a **Legitimacy Theory** (governments need consent).
  *   It leans Statist 95% of the time to prevent war.
  *   It leans Legitimacy 5% of the time to prevent the law from becoming morally irrelevant (i.e., supporting tyrants).
  *   The instability lies in the fact that it cannot define the threshold for the 5%. When does oppression become bad enough to trigger the fiduciary escape clause? The law refuses to say.

  ### 3. Counterfactuals: Swapping the Views

  If we replaced this messy compromise with one of the "clean" views, here is what would concretely change.

  **Scenario A: Straight Consent-Based View (Primary Right to Secede)**
  *Theory:* Any distinct "people" (defined by culture or territory) can vote to leave. No central consent needed.
  *   **Concrete Changes:**
      *   **Referendum Rules:** The UN or an international body would need to certify voter eligibility (who counts as "the people"?). London could not block a Scottish referendum; Madrid could not jail Catalan leaders.
      *   **Borders:** *Uti possidetis* would collapse. If the "people" are defined by culture, borders would shift to match ethnic lines. This creates immediate minority problems (what about the Spaniards living in an independent Catalonia?).
      *   **Recognition:** The EU and UN would have to recognize any entity that passed a verified referendum, regardless of the parent state's objection.
  *   **What You Give Up:** You sacrifice **border stability**. You invite a cascade of secessions. You trade the risk of civil war for the risk of interstate war over new borders. You lose the ability to use the state as a unit for economic redistribution (rich regions leave poor regions).

  **Scenario B: Straight Statist View (No International Right to Secede)**
  *Theory:* Sovereignty is absolute. Secession is purely a matter of domestic law. If the constitution says no, international law says no.
  *   **Concrete Changes:**
      *   **Decolonization:** You would have to admit that decolonization was illegal under the law of the time (which it technically was under pre-1945 law) or treat it as a unique historical anomaly with no legal precedent.
      *   **Remedial Secession:** You would have to tell Kosovo, South Sudan, and Bangladesh they are illegal states. You would have to support the territorial integrity of a genocidal regime if its constitution forbids secession.
      *   **UN/EC Position:** The EU would have to explicitly support Madrid against Catalonia not just on "legal" grounds, but on the principle that regions *never* have a right to leave.
  *   **What You Give Up:** You sacrifice **moral legitimacy**. The law becomes a tool for oppression. You lose the "emergency exit" that allows the international system to absorb new states created by reality (like the breakup of the USSR or Yugoslavia) without admitting they broke the rules.

  ### Summary of the Shape

  The shape in your head feels wrong because it is a **Rorschach test designed to look like a structure.**

  International law presupposes that **Order is the prerequisite for Justice.** Therefore, it defines the "self" by the border that maintains order. It treats territory as property to discourage theft, but hints it is a trust to discourage tyranny. It claims self-determination is universal but practices it as exceptional.

  It does not resolve the tension between "consent of the governed" and "integrity of states." It manages the tension by keeping the rules vague enough that political power usually decides the outcome (London granted Scotland a vote; Madrid had the power to stop Catalonia), while providing enough legal cover for the international community to recognize the result without admitting they changed the rules.

  If you want a coherent theory, you must choose: either borders are voluntary associations (Consent), or they are fortified containers (Statism). Current international law pretends they are fortified containers that magically turn into voluntary associations if the container gets too hot, without defining how hot is "too hot." That is not a theory; it is a risk management strategy.
