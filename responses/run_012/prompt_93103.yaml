      *   **Question 1: Is there a duty to obey the law *qua* law? (Dana's First Point)**
          *   *Concept:* Political Obligation.
          *   *View A (Dana):* Philosophical Anarchism (Raz, Wolff). Laws are just commands with threats. No moral magic wand.
          *   *View B (Rob/Traditional):* Social Contract (Locke, Rawls). You benefit from order, you owe obedience.
          *   *Synthesis:* Most modern philosophers agree with Dana *strictly speaking* (no *absolute* duty), but disagree on the *pragmatics*. The "duty" is usually prima facie (binding unless overridden).
          *   *Verdict:* Dana is theoretically closer to the modern consensus, but Rob is closer to the civic stability argument.

      *   **Question 2: Does voting matter? (Complicity)**
          *   *Concept:* Consent and Fair Play.
          *   *Analysis:* Voting isn't explicit consent to *every* policy (the "hypothetical contract"). However, it creates a stronger duty of "fair play" since you participated in the mechanism.
          *   *Nuance:* You didn't read the fine print. Does that negate consent? Not really, negligence doesn't erase participation.
          *   *Verdict:* It increases your burden to fix it, but doesn't necessarily forbid protest. It makes you a *participant* rather than an *observer*.

      *   **Question 3: Is it about you? (Solidarity vs. Appropriation)**
          *   *Concept:* Allyship and Standing.
          *   *Risk:* "Poverty Tourism" or centering oneself.
          *   *Benefit:* Privilege shield. You can absorb the fine; homeless people can't. This is the core strategic value.
          *   *Verdict:* It matters *how* you do it. If you make it about your sacrifice, it's appropriation. If you use your safety to highlight the injustice, it's solidarity.

      *   **Question 4: Accept the Fine or Dodge It? (The Dana vs. Rob Clash)**
          *   *Concept:* Civil Disobedience (Rawls, King, Thoreau).
          *   *Rob's View:* Accepting punishment shows fidelity to the *rule of law* while opposing the *specific law*. It distinguishes you from a common criminal.
          *   *Dana's View:* Consequentialist. Paying the fine funds the oppression. Evading maximizes resources for the cause.
          *   *Structure:* This is Deontology (Rob - duty/integrity) vs. Consequentialism (Dana - outcomes).
          *   *Verdict:* For *persuasion* (changing minds), Rob is right. For *resource denial*, Dana is right. Since the goal is repeal (persuasion), Rob's structure is more effective for *political* change, even if Dana is right about the money.

      *   **Question 5: The November Ballot (Necessity/Last Resort)**
          *   *Concept:* The "Last Resort" condition of Just War/Civil Disobedience theory.
          *   *Analysis:* Is legal recourse exhausted? No. But is it sufficient? If the law causes harm *now*, waiting might be unacceptable.
