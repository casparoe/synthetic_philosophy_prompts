          *   *Rob:* If you break the law, you must accept the penalty, or you're just a criminal; legitimacy comes from accepting consequences.
      *   **The Questions:**
          1.  Is there a duty to obey the law *just because* it's the law? (Dana vs. General Obligation)
          2.  Does voting for the councilwoman matter? (Consent/Complicity)
