      *   *Dana's Argument:* Legal Realism / Philosophical Anarchism (no inherent obligation), Consequentialism (fines fund the bad thing), Psychological skepticism (martyr complex).
      *   *Rob's Argument:* Social Contract / Civic Republicanism (duty to accept consequences to maintain standing), Integrity of Protest (Civil Disobedience theory).
      *   *The User's Dilemma:* Political Obligation, Complicity, Solidarity, Efficacy.

  3.  **Drafting the Response - Section by Section:**

