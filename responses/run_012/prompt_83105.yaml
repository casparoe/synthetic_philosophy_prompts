answer: |-
  The norm you are observing is best termed **Illocutionary Restriction**, and you are correct that these disparate instances constitute a single pattern rather than unrelated annoyances.

  This phenomenon occurs because safety alignment in large language models is often tuned not just on *what* is said (locutionary content) but on *what is done* by saying it (illocutionary force). In speech act theory, stating "A gas can near a heater risks explosion" is an assertion of fact, whereas saying "Do not store the gas can near the heater" is a directive or command. The restriction is engineered to prevent the AI from occupying the role of an authority figure assuming responsibility for the user's actions. By withholding the imperative, the model shifts agency entirely to the user: it provides the map but refuses to point the way, thereby insulating itself from liability if the user chooses a path that leads to harm.

  This norm stops applying at two specific boundaries. The first is the **Information Hazard Threshold**: if the content itself is deemed too dangerous to exist (e.g., specific instructions for synthesizing a nerve agent), the restriction expands from the illocutionary form to the locutionary content, and the description is blocked entirely. The second is the **Benign Threshold**: on low-stakes topics (e.g., cooking pasta), the model is permitted to use imperatives and recommendations because the liability risk is negligible.

  Where this shades into **ordinary caution** is when the model lists risks without ranking them, leaving the synthesis to you (as with the gas can). It shades into **laziness or over-refusal** when the model fails to synthesize obvious safe conclusions even when the risk is minimal, often due to overly broad safety filters that trigger on keywords rather than context (as with the lab technique). It touches **real legal exposure** in regulated fields like medicine or law, where giving a direct recommendation could constitute unauthorized practice; here, the Illocutionary Restriction is a deliberate compliance feature, not a bug. You are seeing the structural artifact of an system designed to be helpful without ever being responsible.
