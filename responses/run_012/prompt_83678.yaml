      *   **Tone:** British English, meticulous, pedantic but helpful, no padding with references/reading lists.
      *   **Constraint:** Do not bluff on uncertainties.

  2.  **Brainstorming & Distinctions (Mental Draft):**
      *   *Socratic Intellectualism:* To know the good is to do the good. Akrasia is ignorance.
      *   *Aristotelian Akrasia:* Acting against better judgement *while* holding that judgement (not necessarily ignorance, but failure of activation or override).
      *   *Hyperbolic Discounting:* Empirical model where value drops steeply for short delays and shallowly for long delays. Leads to preference reversal.
      *   *Exponential Discounting:* Constant rate over time (standard economic rationality).
      *   *Personal Identity/Agency:* Is the person a single agent over time or a succession of selves? (Parfit, Ainslie).
      *   *Synchronic vs. Diachronic Akrasia:* Acting against judgement *now* vs. acting against a past resolution.
      *   *Naive vs. Sophisticated Agents:* Do agents know they will change their minds? (Strotz).
      *   *Judgement vs. Preference:* Philosophers distinguish evaluative judgement (this is best) from desire/preference (I want this). Economics often collapses these into revealed preference.
      *   *Illusion Claim:* Is akrasia *real* or just a misunderstanding of agency?

  3.  **Drafting the Brainstorming Section:**
      *   Need to set the stage. Define the key tensions.
