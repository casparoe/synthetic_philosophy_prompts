  8.  **Final Polish:** Check the flow. Ensure the distinction between *synchronic* and *diachronic* akrasia is clear, as that is the philosophical hinge. Ensure the distinction between *preference* and *judgement* is highlighted, as that is where the Socratic vindication fails.

