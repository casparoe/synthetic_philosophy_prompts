      *   *Claim 5: "This is why you can sincerely resolve tonight... and then... sincerely prefer to stay in bed."*
          *   Phil: This describes *diachronic* inconsistency, not necessarily *synchronic* akrasia (acting against judgement *at the time of action*).
          *   Econ: Describes preference reversal.
          *   Critique: Conflates changing one's mind with acting against one's current better judgement.

      *   *Claim 6: "There is no single self doing the choosing, only a succession of temporally local selves..."*
          *   Phil: Highly contestable metaphysical claim (Parfitian reductionism). Not an empirical finding.
