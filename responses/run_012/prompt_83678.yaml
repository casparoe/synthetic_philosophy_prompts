  *(Refining the Socrates point)*: The text claims Socrates is vindicated because "nobody ever really acts against their own better judgement". But in the example, the agent *does* act against their *earlier* judgement. The text redefines "better judgement" to mean "current strongest preference". This is the equivocation. I must highlight this.

