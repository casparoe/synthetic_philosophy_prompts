      *   *Diagnosis:* It is a "pragmatic equivocation" masking a "metaphysical disagreement".
      *   *Questions:* You are right; OOL wants a threshold, Astro wants a signal, Phil wants a kind.
      *   *Cases:* They are rhetorical. They are theory-laden.
      *   *Axes:* This is the most productive move. It shifts from ontology to topology.
      *   *Progress:* Progress is realising the question is ill-posed. A "principled decision to stop asking" the binary question is the victory.

