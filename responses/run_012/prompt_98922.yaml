prompt: |-
  I am a doctoral candidate working on the philosophy of biology, and for several months now a reading group I belong to has been going round the question of how to define life — or whether it can be defined at all — without anyone shifting position. The same cases surface every week and the same moves are made. One camp treats life as a genuine natural kind and tries to specify the conditions: a system that metabolises, maintains itself far from equilibrium, reproduces with heritable variation, and so evolves; on this view viruses and plasmids fall outside because they lack autonomous metabolism, while a minimal synthetic cell or an obligate intracellular parasite can be argued either way. A second camp holds that 'life' is a cluster or family-resemblance concept with no single essence, so that the hunt for necessary and sufficient conditions is simply a mistake — the operational formula astrobiologists tend to favour (roughly, a self-sustaining chemical system capable of Darwinian evolution) is on this view a sorting device rather than a definition. A third and more radical camp wants to retire the category altogether, on the grounds that it does no explanatory work and merely marks where our chemistry-based biology happens to stop. And then there are the genuinely awkward cases — viruses, viroids, prions, transposons, so-called xenobots, and the more speculative suggestion that a sufficiently autonomous artificial or purely informational system ought to count — which each side recruits as evidence rather than treating as a difficulty.

  My own suspicion, which I would like you to test rather than simply endorse, is that the impasse is not really a disagreement about biology at all. It looks to me as though the participants are answering different questions under a single heading: the origin-of-life researcher wants a criterion that carves the transition from non-living to living chemistry at its causal joint; the astrobiologist wants a detection rule that will not embarrass her when applied to an exoplanet or a subsurface ocean; and the philosopher of biology wants to know whether 'life' names a natural kind that figures in explanations. If that is right, the dispute may be closer to the stalled arguments over 'species' or 'planet' than to an ordinary empirical disagreement — a matter of divergent purposes and divergent standards for what a definition is for. What I want from you is a diagnosis of the structure of this disagreement: whether it is verbal, substantive, or several questions wearing one word; which of the contending positions, if any, is really answering a different question from the others; and whether the awkward cases are doing genuine evidential work or merely rhetorical work. I am especially interested in whether it helps to split the single question into independent axes — metabolism, self-maintenance, heritable replication, evolution by natural selection, and goal-directed autonomy — which need not covary, and then to ask of each axis separately whether it is a matter of degree. Having done that, tell me what would actually count as progress: a distinction, a formal result, a principled decision to stop asking, or a demonstration that some particular version of the question is well-posed and answerable. Please reason from the positions as I have set them out rather than surveying the literature, and write your answer in British English.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User:** Doctoral candidate in philosophy of biology.
      *   **Context:** A reading group stuck in an impasse regarding the definition of life.
      *   **Current Positions:**
          1.  *Natural Kind/Essentialist:* Life has necessary and sufficient conditions (metabolism, self-maintenance, reproduction, evolution). Viruses excluded (usually).
          2.  *Cluster/Family Resemblance:* No single essence. Operational definitions (e.g., NASA's) are sorting devices, not metaphysical claims.
          3.  *Eliminativist:* 'Life' does no explanatory work; retire the category.
      *   **User's Hypothesis:** The impasse isn't about biology *per se*, but about divergent purposes/questions masked by a single term (Origin of Life vs. Astrobiology vs. Philosophy of Biology). It's akin to the 'species' or 'planet' debates.
      *   **Task:**
          1.  Diagnose the structure of the disagreement (verbal, substantive, or equivocal).
          2.  Determine if positions are answering different questions.
          3.  Assess the role of "awkward cases" (viruses, etc.) – evidential or rhetorical?
          4.  Evaluate the proposal to split the concept into independent axes (metabolism, replication, etc.) and treat them as matters of degree.
          5.  Define what would count as *progress* in this debate.
      *   **Constraint:** Reason from the positions *as set out* (don't just survey literature).
      *   **Style:** British English.
      *   **Tone:** Academic, rigorous, critical (test the suspicion, don't just endorse).

  2.  **Deconstruct the User's Hypothesis:**
      *   The user suspects the disagreement is "several questions wearing one word."
      *   *Test:* Is this accurate?
      *   *Analysis:* The Natural Kind camp wants metaphysical grounding. The Cluster camp wants pragmatic utility. The Eliminativist wants explanatory purity. These *are* divergent aims. However, are they *merely* verbal? If the Natural Kind camp claims there *is* a fact of the matter independent of our interests, and the Eliminativist claims there *isn't*, that's a substantive metaphysical disagreement, not just a verbal one. But the *stalemate* arises because they talk past each other's criteria for success.
      *   *Verdict:* It is a mix. Substantive regarding the structure of the world (is there a joint?), but verbal/pragmatic regarding the utility of the term 'life'. The stalemate is largely due to equivocation on the *function* of the definition.

  3.  **Analyze the "Awkward Cases" (Viruses, etc.):**
      *   User asks: Are they doing evidential or rhetorical work?
      *   *Analysis:* For the Essentialist, a virus is a counter-example to be excluded or a boundary case to be explained away. For the Cluster theorist, it's proof of gradation. For the Eliminativist, it's proof of the category's failure.
      *   *Verdict:* They are largely doing *rhetorical* work because the interpretation of the case is theory-laden. The virus doesn't speak for itself; the theoretical framework dictates its status. Therefore, citing them reinforces existing positions rather than shifting the debate.

  4.  **Evaluate the "Axes" Proposal:**
      *   User suggests splitting life into: metabolism, self-maintenance, heritable replication, evolution, goal-directed autonomy.
      *   *Analysis:* This is the "property cluster" approach refined. It acknowledges that these traits can come apart (e.g., mules don't reproduce; viruses evolve but don't metabolise).
      *   *Benefit:* It dissolves the binary "alive/dead" into a multidimensional space.
      *   *Risk:* It might just push the question back: "Which combination is *life*?" Unless we admit 'life' is the wrong label for the cluster.
      *   *Verdict:* This is a promising path for progress, specifically for the Cluster camp, but might frustrate the Essentialist who wants a sharp boundary.

  5.  **Define "Progress":**
      *   What breaks the deadlock?
      *   *Not:* A new definition everyone accepts (unlikely).
      *   *Not:* A new biological discovery (won't solve the philosophical categorisation).
      *   *Yes:* A principled distinction of *contexts*. Acknowledging that 'life' is a "homeostatic property cluster" (HPC) kind rather than a classical kind. Or, accepting the Eliminativist view for *explanation* but keeping the term for *heuristics*.
      *   *Specific Progress:* Showing that the question "Is X alive?" is ill-posed, whereas "Does X exhibit property Y to degree Z?" is well-posed.

  6.  **Drafting the Response (incorporating British English and specific constraints):**
      *   *Introduction:* Acknowledge the sophistication of the user's diagnosis. Validate the "species/planet" analogy.
      *   *Section 1: Diagnosis of the Disagreement.* Is it verbal or substantive? It's a "metaphysical-pragmatic equivocation." The Essentialist assumes a joint exists; the Eliminativist assumes it doesn't; the Cluster theorist assumes the joint is fuzzy. They are arguing about the *status* of the concept, not just the extension.
      *   *Section 2: The Divergent Questions.* Map the camps to the user's suspicion (OOL vs. Astro vs. Phil).
          *   Essentialist = OOL (causal transition).
          *   Cluster = Astro (detection/heuristic).
          *   Eliminativist = Phil (explanatory power).
          *   *Crucial Point:* The stalemate happens because they demand the definition satisfy *all* these purposes simultaneously.
      *   *Section 3: The Awkward Cases.* Viruses, etc. are "Rorschach tests." They confirm priors. They are rhetorical ammunition, not neutral evidence.
      *   *Section 4: The Axes Proposal.* Splitting the concept. This moves from a binary to a vector space. This helps the Cluster view. It undermines the Essentialist view (if traits vary by degree, where is the essence?). It supports the Eliminativist (if it's a vector, why call it one thing?).
      *   *Section 5: What Counts as Progress?*
          *   Not a consensus definition.
          *   Progress = Dissolution of the single question.
          *   Progress = Contextual pluralism (different definitions for different aims).
          *   Progress = Formalising the "degrees of life" (the axes).
      *   *Conclusion:* Summarise. The user's suspicion is largely correct but needs nuance regarding the metaphysical stakes.

  7.  **Refining the Tone and Language:**
      *   Ensure British spelling (metabolise, categorisation, programme, etc.).
      *   Maintain a doctoral-level register (avoid oversimplification, use precise philosophical terminology like 'extension', 'intension', 'natural kind', 'equivocation').
      *   Check against the constraint: "Reason from the positions as I have set out rather than surveying the literature." (Avoid name-dropping Hull, Ghiselin, Cleland, etc., unless necessary to describe the *structure* already provided). *Self-correction:* The prompt asks me to reason from the positions *as set out*. I should avoid bringing in external authors (like Cleland's "shadow biosphere" or Mayr's species concepts) unless it's to illuminate the structure provided. I will stick to the internal logic of the three camps described.

  8.  **Final Review against constraints:**
      *   British English? Yes.
      *   Test the suspicion, don't just endorse? Yes, I will challenge the idea that it is *only* divergent purposes; there is a substantive metaphysical clash too.
      *   Address the axes? Yes.
      *   Address progress? Yes.
      *   Address awkward cases? Yes.

  9.  **Constructing the Argument (Mental Outline):**
