      *   **Tone:** Intellectual, precise, no citations, pragmatic (for a columnist).

  2.  **Deconstruct the Requirements (The "Spec"):**
      *   *Goal:* Define what makes a pattern "real" enough to stop the fighting.
      *   *Constraint 1 (Info Theory):* Can't just be compressibility (Chaitin's randomness stuff). Every string has a short description relative to *some* language. So, language/independent constraint is needed.
      *   *Constraint 2 (Physics):* Physical closure means patterns can't violate physics, but high-level patterns must be compatible with low-level physics without being reducible to it in a trivial way.
      *   *Constraint 3 (Prediction):* Patterns must do work (predictive power).

  3.  **Drafting the Requirements (Iterative Process):**

      *   *Req 1: Robustness/Counterfactual Support.* A real pattern holds up under intervention or new data. (Handles the overfitting case).
      *   *Req 2: Causal/Explanatory Power.* It's not just correlation (barometer vs. storm). It supports "what if" reasoning.
      *   *Req 3: Multiple Realizability/Independence.* The pattern isn't tied to one specific micro-configuration (Game of Life glider, Temperature).
      *   *Req 4: Observer-Independence (with a caveat).* The pattern exists regardless of *me* looking, but might depend on *agents* with certain capacities. (Handles the "projection" charge).
      *   *Req 5: Compression with Constraints.* It must compress data *in a natural vocabulary*, not a gerrymandered one. (Handles Info Theory constraint).

  4.  **Identifying the Tensions (The "Non-Negotiables" vs. "Trade-offs"):**
      *   *The Big Tension:* Objective Existence vs. Interest-Relativity.
      *   If a pattern depends on our compression capacities (Info Theory), is it objective?
      *   If it's purely objective, how do we handle biological species (which drift/blur)?
      *   *Resolution:* The "Real Pattern" criteria usually involve *stability* across observers, not independence from *all* observers.
      *   *Non-Negotiable:* Predictive robustness, compatibility with physics.
      *   *Negotiable/Camp Specific:* Whether "real" means "fundamental constituent of reality" (Ontological Realism) vs. "indispensable for prediction" (Pragmatic Realism).

  5.  **Addressing the Specific Cases:**
