answer: |-
  Here is the specification for a theory of pattern reality. It is divided into functional requirements (what the pattern must *do*), ontological constraints (what the pattern must *be*), and informational bounds (what the pattern must *cost*).

  ### The Spec: Requirements for Pattern Reality

  **1. Counterfactual Stability (The Overfitting Test)**
  A real pattern must support inferences about data *not* used to construct it. A curve that fits ten points perfectly but fails the eleventh is a fiction; a law that fits ten points and predicts the eleventh is a candidate for reality. This handles the evaporating model versus the robust one. It requires the pattern to remain invariant under sampling variation.

  **2. Causal Leverage (The Barometer Test)**
  The pattern must mark a locus of causal power, not just correlation. A barometer reading correlates with rain, but manipulating the barometer does not cause rain. Manipulating pressure systems does. A theory of real patterns must distinguish between *tracking* a cause and *being* a causal node. Temperature is real because changing it changes the gas; a statistical artifact of a random string changes nothing.

  **3. Multiple Realizability (The Glider Test)**
  The pattern must be identifiable across different micro-constitutions. A glider in the Game of Life is real even if the underlying grid is rendered in color, in 3D, or simulated on a different computer. If the pattern dissolves when you change the substrate but keep the functional logic, it was an illusion of the substrate. This separates the checkerboard (geometry) from the pixels (physics).

  **4. Vocabulary Independence (The Compression Test)**
  You cannot claim a pattern is real simply because you found a short description for it. (By tweaking the language, you can describe random noise efficiently.) The description must be short in a *natural* or *constrained* vocabulary. The pattern must offer compression relative to a standard baseline of complexity. This satisfies the information theory constraint: reality is compression, but only against a fixed cost of language.

  **5. Fuzzy Boundaries without Dissolution (The Species Test)**
  The theory must allow for vague edges without denying existence. Biological species drift and hybridize; if "real" requires sharp essential boundaries, nothing biological is real. A real pattern can be a stable cluster in state-space even if the borders are probabilistic. It must distinguish "fuzzy object" from "no object."

  ### The Trade-Offs: What You Can't Have Simultaneously

  Here is the friction point where the fighting starts. You cannot maximize all these virtues at once.

  **The Incompatibility:** You cannot have **Strong Mind-Independence** and **Interest-Relative Compression** simultaneously.
  *   **Strong Mind-Independence** says the pattern is there regardless of any observer (like a rock).
  *   **Interest-Relative Compression** says a pattern is only a pattern relative to an agent with specific computational limits and goals (like a map).

  If you choose the former, you struggle with the Game of Life and Species cases (where the "object" depends on the rules of the system or the breeding interests of the observer). If you choose the latter, you invite the accusation that "it's all just a projection."

  **Non-Negotiables:**
  *   **Predictive Robustness:** If it doesn't predict, it's not a pattern, it's art.
  *   **Physical Consistency:** It cannot violate the causal closure of the physical domain.
  *   **Causal Leverage:** It must do work in the world (or in a simulation) beyond describing it.

  **Camp Tastes:**
  *   **Structural Realists** demand Mind-Independence. They will sacrifice Interest-Relativity.
  *   **Pragmatists (Dennett's crowd)** demand Interest-Relativity. They will sacrifice Mind-Independence for "Objective Abstraction."
  *   **Reductionists** demand that the micro-level is the only "Real" level. They will sacrifice Multiple Realizability.

  ### Evaluation of the Three-Stances Picture

  Dennett's framework (Physical, Design, Intentional stances) passes the spec by sidestepping the incompatibility rather than solving it. It treats "reality" as stance-relative but objective *within* the stance. It handles the Glider and Temperature cases perfectly by granting the Design stance ontological weight equal to the Physical stance, provided the prediction is robust. It satisfies the Compression constraint by defining patterns as "real" if they are the most efficient way for an agent to predict the system. However, it fails the Strong Mind-Independence requirement by definition; it tells the physicist that their demand for a single "view from nowhere" is the error, not the pattern's existence. It adjudicates the fight by telling both sides they are using different metrics for "real," which stops the eye-rolling only if the guests agree that utility constitutes a form of existence.
