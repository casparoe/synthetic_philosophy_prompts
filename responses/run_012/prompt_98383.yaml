  *   **[Next to "convex... risk-seeking"]:** **Stop.** Look at your result: You just showed the agent rejecting a risky gamble with higher expected value. That is Risk *Averse* behavior. In this formula, convex $r$ ($p^2 < p$) downweights the upside, creating aversion. Concave $r$ would create seeking. You have contradicted your own working here.
  *   **[Next to "separates attitudes"]:** **Yes!** This is the crucial theoretical point. Well articulated.
  *   **[Next to "Prospect Theory"]:** Be careful. PT involves reference points and loss aversion; REU is distinct in how it isolates risk attitude. Don't treat them as identical.

