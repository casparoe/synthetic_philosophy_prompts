      *   The rejection must be on **(3)** (the requirement that *both* are necessary for justice) and **(5)** (the inference that failing both makes it unjust).
      *   Actually, strictly speaking, if (3) says "A just tool must satisfy both," and (4) says "You can't satisfy both," then (5) "No risk score can be just" follows logically *if* you accept (3).
      *   So the *only* place to break the chain is **(3)**. You must argue that Justice does *not* require satisfying both incompatible conditions.
