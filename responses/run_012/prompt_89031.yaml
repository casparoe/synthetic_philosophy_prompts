answer: |-
  Here is the specification for an adequate theory of incommensurability. It is organized by the empirical phenomena it must capture, the conceptual distinctions it must maintain, the normative constraints it must respect, the meta-theoretical commitments it must declare, and finally, the structural tensions that render the project potentially impossible.

  ### I. Empirical Adequacy: The Episodes
  An adequate theory must not be a purely logical construction; it must map onto the historical record of scientific change. It must deliver specific accounts of the following episodes:

  1.  **The Newtonian-Einsteinian Shift (Mass):**
      *   **Requirement:** The theory must explain how "mass" can be the subject of a continuous debate while referring to non-identical physical quantities (invariant Newtonian mass vs. velocity-dependent/relativistic mass).
      *   **Motivation:** If the theory says the terms are identical, it fails to capture the physical discontinuity (the breakdown of conservation laws across frames). If it says the terms are wholly different, it cannot explain why the Einsteinian equation reduces to the Newtonian at low velocities. It must account for *partial* reference failure without total semantic rupture.
  2.  **The Chemical Revolution (Phlogiston vs. Oxygen):**
      *   **Requirement:** The theory must handle ontological elimination. It must explain how scientists can argue about "dephlogisticated air" and "oxygen" without a stable referent, given that one entity (phlogiston) was subsequently judged not to exist.
      *   **Motivation:** This tests whether incommensurability is merely about meaning or about *world-structure*. A theory that allows translation of terms but not ontology fails here.
  3.  **The Copernican Shift (Perceptual Training):**
      *   **Requirement:** The theory must account for changes in perceptual reporting (e.g., "the sun moves" vs. "the earth turns").
      *   **Motivation:** Incommensurability is not just linguistic; it is phenomenological. The theory must explain how two observers looking at the same sky report incompatible data without accusing one of lying or blindness.

  ### II. Conceptual Distinctions: What Must Not Be Collapsed
  To avoid the straw-man critiques of relativism, the theory must differentiate between specific modes of incompatibility.

  1.  **Semantic vs. Methodological Incommensurability:**
      *   **Requirement:** The theory must distinguish between a lack of common *language* (meaning variance) and a lack of common *standards* (axiological variance).
      *   **Motivation:** Scientists may agree on what "mass" means but disagree on whether accuracy or scope is more important. Collapsing these makes resolution impossible; separating them allows for trade-off analysis.
  2.  **Local vs. Global Holism:**
      *   **Requirement:** The theory must specify the *scope* of the incommensurability. Is the entire language infected, or only specific taxonomic niches (e.g., kinematics vs. dynamics)?
      *   **Motivation:** Global holism implies scientists from different paradigms live in different worlds and cannot speak at all. Local holism allows for bilingualism in neutral zones. An adequate theory must be local to avoid absurdity.
  3.  **Graded Translatability vs. Binary Gap:**
      *   **Requirement:** The theory must treat translatability as a continuous variable (degree of loss), not a binary switch (possible/impossible).
      *   **Motivation:** Historical actors *do* translate, but with friction and loss of nuance. A binary gap contradicts the existence of textbooks that teach both theories. The theory must quantify the "lossiness" of translation.

  ### III. Normative Constraints: Rationality and Progress
  The theory must respect the intuition that science is a rational enterprise, not a series of coups.

  1.  **The Communication Constraint:**
      *   **Requirement:** The theory must allow for meaningful argumentation across the divide.
      *   **Motivation:** If proponents cannot understand each other's objections, they are not arguing; they are monologuing. History shows they *do* argue (e.g., Einstein and Bohr). The theory must explain the mechanism of this argument despite semantic drift.
  2.  **The Persuasion Constraint:**
      *   **Requirement:** The theory must explain how conversion happens via reasons, not just social pressure or generational death.
      *   **Motivation:** If paradigm shifts are purely irrational "gestalt switches," science loses its claim to epistemic authority. The theory must locate the lever of rational persuasion within an incommensurable framework.
  3.  **The Error Constraint:**
      *   **Requirement:** The theory must permit the judgment that the earlier theory was *wrong* about something, not just *different*.
      *   **Motivation:** Without this, incommensurability collapses into relativism. We must be able to say the geocentrists were mistaken about the earth's motion, not just that they used a different coordinate system.

  ### IV. The "Unasked" Requirements: Meta-Theoretical Specifications
  These are the conditions you might overlook but are necessary for the theory to be philosophically robust.

  1.  **Specification of Relata:**
      *   **Requirement:** The theory must state precisely *what* is incommensurable. Is it texts? Mental concepts? Laboratory practices? Social communities?
      *   **Motivation:** "Paradigms" are too vague. If incommensurability resides in practices (know-how) rather than propositions (know-that), the solution requires training, not translation. If it resides in language, it requires dictionaries. The diagnosis depends on the relata.
  2.  **The Timing of Diagnosis (Internal vs. Retrospective):**
      *   **Requirement:** The theory must specify whether incommensurability is detectable by the participants *during* the revolution or only by historians *afterward*.
      *   **Motivation:** If participants can diagnose it, they can potentially bridge it (dissolving the problem). If only historians can see it, it risks being an artifact of historiography rather than a feature of scientific practice. An adequate theory must explain why the protagonists feel the friction but cannot name the gap.
  3.  **Falsification Conditions from Practice:**
      *   **Requirement:** The theory must identify what empirical observation of scientists would disprove it.
      *   **Motivation:** For example: If a "translation manual" is produced that allows a Newtonian to solve relativistic problems without conceptual loss, the theory is falsified. Or, if consensus is reached without any ambiguity or loss of meaning, the theory fails. It must be vulnerable to sociological or cognitive data.

  ### V. The Conflict Analysis: Where the Theory Breaks
  You suspect the tension lies between explaining the *difficulty of theory choice* and leaving *rational persuasion intact*. You are correct, but the conflict is more structural. It is a trilemma involving **Semantic Discontinuity**, **Rational Comparability**, and **Ontological Realism**.

  Here is the conflict that cannot be jointly satisfied:

  1.  **The Demand for Semantic Discontinuity:** To explain why the Newtonian and Einsteinian talk past each other (and why the Phlogiston theorist is fundamentally mistaken), the theory must assert that the meanings/references of key terms have shifted significantly. (If meanings are stable, there is no revolution, only elaboration).
  2.  **The Demand for Rational Comparability:** To explain why scientists can argue and be persuaded by reasons (the Persuasion Constraint), there must be a common measure—a neutral language or shared standard—where the theories can be juxtaposed and weighed.
  3.  **The Demand for Ontological Realism:** To explain why the earlier theory was *wrong* (the Error Constraint), there must be a mind-independent reality against which both are measured.

  **The Impossible Joint Satisfaction:**
  *   If you satisfy **(1) Semantic Discontinuity** strongly (to honor the "Mass" argument), you undermine **(2) Rational Comparability**. If "mass" means different things, there is no common variable to plug into a decision matrix. Persuasion becomes conversion (irrational).
  *   If you satisfy **(2) Rational Comparability** strongly (to honor the "Persuasion" constraint), you undermine **(1) Semantic Discontinuity**. If they can compare rationally, they must share a language. If they share a language, the shift is commensurable, and the "incommensurability" theory is false.
  *   If you satisfy **(3) Ontological Realism** strongly (to honor the "Error" constraint), you tend to undermine **(1)**. If there is a fixed reality "Mass," then one theory is right and the other wrong about *that* referent. This suggests a stable reference, which suggests commensurability.

  **The Real Conflict:**
  The core fracture is between **Meaning Variance** and **Normative Continuity**.
  To explain the *difficulty* (the evening you spent arguing), you need high Meaning Variance. To explain the *resolution* (that one of you might eventually be persuaded by physics), you need high Normative Continuity.
  *   **High Meaning Variance** implies that logical relations (contradiction, entailment) do not hold between the two theories. If they don't contradict, you can't prove one wrong.
  *   **High Normative Continuity** implies that logical relations *do* hold. If they contradict, they must share terms.

  **Conclusion:** An adequate theory must admit that rational persuasion across a paradigm shift is **necessarily partial**. It cannot satisfy the demand that persuasion be fully rational (deductive) *and* that the shift be truly incommensurable. It must concede that some element of scientific change involves a non-algorithmic, risk-taking commitment that looks like rationality from the inside but resembles a gestalt shift from the outside. If a theory claims to make the choice fully rational, it denies incommensurability. If it claims the gap is total, it denies science. The conflict is insoluble; the best a theory can do is locate the precise point where rationality runs out.
