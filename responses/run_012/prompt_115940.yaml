answer: |-
  ### The procedure

  **Pre-Work (Homework):** The proposing member must circulate a one-page brief 48 hours prior. This brief must identify the specific rule text, the proposed change, and a preliminary search for documented purpose (minutes, manuals, emails). No committee time is spent searching for documents.

  **Step 1: The Fence (Purpose Identification).**
  *Question:* Is the original purpose documented or unanimously recalled?
  *Sufficient Answer:* Yes = A written rationale exists or all eight members recall the specific problem the rule solved. No = The record is silent and memory is fragmented.
  *Path:* If Yes, proceed to Step 2. If No, proceed to Step 3.

  **Step 2: The Validity Check.**
  *Question:* Is the original purpose still valid and actively served by this rule?
  *Sufficient Answer:* Yes = The problem persists and this rule is the active solution. No = The problem is solved, obsolete, or handled by another mechanism.
  *Termination:* If No, recommend **Repeal**. The burden is on the rule to justify its existence; obsolescence kills it. If Yes, proceed to Step 4.

  **Step 3: The Unknown Fence (Burden Shift).**
  *Question:* Since the purpose is unknown, can any member articulate a plausible risk of removal?
  *Sufficient Answer:* Yes = A specific, credible negative outcome is identified (e.g., "loss of accreditation," "legal liability"). No = Speculation only ("it might be bad").
  *Abuse Prevention:* If the answer is No, the default is **Repeal**. "We don't know" is not a reason to keep; it is a reason to discard unless risk is proven. This prevents inertia.
  *Path:* If Yes (risk identified), proceed to Step 4. If No, recommend **Repeal**.

  **Step 4: Reversibility and Risk.**
  *Question:* If we repeal this and are wrong, can we undo the damage cheaply?
  *Sufficient Answer:* Yes = The change is reversible within one quarter with minimal cost. No = The damage is permanent, legal, or safety-critical.
  *Termination:* If Yes (reversible), recommend **Repeal as Pilot**. Treat the repeal as an experiment. If No (irreversible/high risk), proceed to Step 5.

  **Step 5: The Defense.**
  *Question:* Can the rule's defenders prove necessity against the identified risk?
  *Sufficient Answer:* Yes = Evidence shows the rule mitigates the specific high risk identified in Step 3 or 4. No = The link between rule and risk is assumed but unproven.
  *Termination:* If Yes, recommend **Keep**. If No, recommend **Refer**. The committee cannot decide; the question requires external expert review or a specialized task force.

  **Final Output:** The committee votes only on the Recommendation (Keep, Repeal, Pilot, Refer). The Board receives the Recommendation plus the Step where the decision terminated.

  ### Worked cases

  **Case 1: The Credentialing Requirement (Keep)**
  A proposal seeks to remove a rule requiring external verification of junior researcher credentials. You suspect this is turf protection by senior staff. The procedure, however, mandates Step 1: Purpose Identification. Documentation shows the rule was implemented after a federal audit threatened the institute's grant eligibility. Step 2 confirms the purpose (audit compliance) is still valid. Step 4 assesses reversibility: losing grant eligibility is irreversible and high-risk. The procedure terminates at Step 5 with a recommendation to **Keep**. Your personal suspicion of turf protection is irrelevant; the rule is load-bearing for funding. The procedure forces you to distinguish between malicious intent and functional necessity.

  **Case 2: The Data Retention Rule (Repeal)**
  A proposal seeks to stop archiving all raw experimental data forever. The rationale is noble: "preserving knowledge for posterity." Step 1 confirms the purpose is documented. Step 2 asks if the purpose is valid. Evidence shows storage costs now exceed the utility of the data; most raw data is never accessed after five years. The purpose is obsolete due to technological change. The procedure terminates at Step 2 with a recommendation to **Repeal**. The noble sentiment cannot override the obsolescence check. The burden was on the rule to justify its cost against current reality, and it failed.

  **Case 3: The Safety Sign-Off (Stall)**
  A proposal seeks to streamline a multi-signature safety protocol for chemical disposal. Step 1 fails: no one knows why four signatures are required. Step 3 identifies a risk: potential environmental liability. Step 4 determines reversibility is low; a spill cannot be undone. The procedure moves to Step 5: Can defenders prove necessity? The senior scientists assume it is necessary but have no data linking the fourth signature to error reduction. The procedure terminates at **Refer**. The committee lacks the expertise to judge safety risk versus bureaucracy. It must hand the question to the Safety Office for a risk assessment before a decision can be made.

  ### Where judgment cannot be removed

  No procedure eliminates the need for wisdom; it merely locates it. In this framework, value judgments are disguised as methodological steps. Step 2 (Validity) requires defining "obsolete." Is a rule obsolete if the problem is rare but catastrophic? That is a value judgment about risk tolerance, not a factual finding. Step 4 (Reversibility) asks what counts as "cheaply." One member's manageable cost is another's budget crisis. The procedure cannot resolve conflicting values about safety versus speed; it only forces the committee to admit when they are making that choice.

  Furthermore, the procedure cannot generate evidence. If the committee lies about Step 1 (claiming ignorance to force a repeal), the method fails. It relies on intellectual honesty. Finally, Step 5 admits the method's limit: when risk is high and evidence is missing, the procedure cannot decide. It must punt to expertise. It manages bureaucracy, not truth.

  ### The one-page version

  **Policy Review Card**

  1.  **Homework:** Proposer finds original rationale. If none, mark "Unknown."
  2.  **Purpose Known?**
      *   Yes → Is purpose still valid? (No → **Repeal**).
      *   No → Can anyone name a specific risk of removal? (No → **Repeal**).
  3.  **Risk Exists?**
      *   Yes → Is the damage reversible/cheap? (Yes → **Pilot Repeal**).
      *   No (High Risk) → Can defenders prove this rule stops the risk?
  4.  **Proof of Necessity?**
      *   Yes → **Keep**.
      *   No → **Refer** to Experts.

  **Rule of Thumb:** Ignorance is not a reason to keep. If we don't know why it exists and the risk is low, cut it. If the risk is high and we don't know why it exists, ask an expert.
