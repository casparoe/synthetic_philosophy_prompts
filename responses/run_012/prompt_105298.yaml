answer: |-
  This is a bold, naturalistic revision of Lewis. You are effectively attempting to marry Lewis's *structural* definition of convention (coordination equilibrium, arbitrariness) with an *evolutionary/behavioral* mechanism (reinforcement, imitation) while excising the *cognitive* machinery (common knowledge, higher-order beliefs, explicit agreement). You are moving from Rational Choice Game Theory to Evolutionary Game Theory (EGT) and behavioral psychology, while keeping the Lewisian label.

  As a philosopher of social science, I find this project attractive for its ontological parsimony. However, by stripping out the epistemic conditions (expectations), you risk losing the very thing that makes a convention *social* rather than merely *statistical*.

  Here is a brainstormed list of candidate defeaters, followed by a ranking based on their decisiveness, and a deep dive into the specific challenges you raised (falsifiability, arbitrariness, dynamics).

  ### Brainstormed Candidate Defeaters

  1.  **The Triviality/Falsifiability Problem:** If any self-sustaining regularity solving a coordination problem is a convention, does the term distinguish social norms from biological instincts or physical constraints?
  2.  **The Normativity Gap:** Conventions support normative attitudes (blame, sanction, "ought"). Reinforcement explains *compliance*, but does it explain *resentment* of defectors?
  3.  **The Linguistic Paradigm:** Language is Lewis's primary example. Can semantic meaning arise without Gricean intentions (expectations about others' beliefs)?
  4.  **The "Unique Best" Counterexample:** Are there conventions where one alternative is objectively superior (non-arbitrary in payoff), yet we still call it a convention due to network effects?
  5.  **Rapid Equilibrium Shifts:** Reinforcement is slow/historical. Conventions (like slang or political correctness) can flip overnight. Can pure imitation explain this speed?
  6.  **The "Secret Handshake" Problem:** Can you coordinate on a *new* convention without prior regularity? (Focal points require reasoning, not just history).
  7.  **Mismatched Expectations:** Cases where expectations exist but coordination fails, or expectations are absent but coordination succeeds (your specific request).

  ---

  ### Ranked Defeaters: From "Awkward" to "Decisive"

  I have ranked these by how much damage they do to your specific revision (Radical Behavioral Lewisianism).

  #### 5. The "Unique Best" Problem (Awkward)
  *   **The Challenge:** You asked if stable norms with a unique best option count as conventions. Standard Lewisianism says no (arbitrariness is essential). If QWERTY were objectively superior to Dvorak in every way, but we still called it a convention because we adopted it collectively, your theory needs to handle it.
  *   **Why it's low rank:** You can patch this. In network coordination games, even if Option A is slightly better than Option B, the *coordination* benefit swamps the *intrinsic* benefit. The arbitrariness lies in the *adoption*, not the technology.
  *   **Concession:** You must concede that "arbitrariness" is a matter of degree. If the payoff difference is massive (e.g., breathing air vs. breathing water), it's not a convention. If it's marginal (driving left vs. right), it is. Your theory survives by adding a threshold condition to "coordination problem."

  #### 4. Rapid Equilibrium Shifts (Serious)
  *   **The Challenge:** You asked if your picture explains how conventions evolve or flip. Evolutionary models (replicator dynamics) explain lock-in well. They explain *slow* drift poorly. Social conventions often flip faster than reinforcement learning allows (e.g., the sudden shift in mask-wearing norms in 2020).
  *   **Why it's mid-rank:** EGT has solutions for this (stochastic stability, "tipping points"). However, these usually require an exogenous shock or a subset of "mutants."
  *   **Concession:** You must concede that pure imitation/reinforcement cannot explain *simultaneous* shifts in large populations without a common signal. If everyone switches overnight, they aren't imitating last week's behavior; they are reacting to a shared piece of information. This smuggles in a cognitive element (belief update) that looks suspiciously like the "expectations" you wanted to remove.

  #### 3. The Linguistic Paradigm (Very Serious)
  *   **The Challenge:** Lewis wrote *Convention* to explain language. But language seems to require more than regularity; it requires *meaning*. In Gricean terms, meaning involves intending to produce a belief in an audience by means of their recognition of that intention.
  *   **The Defeater:** Brian Skyrms (*Signals*) has shown that signaling systems *can* evolve without rationality (supporting you). However, human language allows for *lying*, *metaphor*, and *novel sentences*. Pure reinforcement explains fixed signals well. It struggles to explain how I can say "The cat is on the mat" about a *new* cat on a *new* mat and be understood, unless we share a rule-governed system in our heads.
  *   **Concession:** If you claim language is a convention, you must explain productivity. If you say "language isn't a convention, only usage is," you abandon Lewis's main project. To save the view, you must argue that linguistic rules are just highly complex reinforcement histories, which is a hard sell against Chomskyan or Gricean critiques.

  #### 2. The Normativity Gap (Decisive for "Social" Ontology)
  *   **The Challenge:** This is the strongest philosophical objection. Conventions are not just regularities; they are *normative*. If you drive on the left in the US, I don't just crash; I get angry, and police fine you.
  *   **The Defeater:** Reinforcement explains why *I* don't drive on the left (negative payoff: crash/fine). It does not explain why *I punish you* for driving on the left, even if your driving doesn't directly harm me (third-party punishment). Evolutionary models require "altruistic punishment" to sustain norms, which is costly. Why would a purely reinforcement-driven agent pay a cost to punish a defector who didn't hurt them?
  *   **Concession:** You must concede that "convention" implies a *right to expect* compliance. If your theory reduces this to "I expect you because you usually do," it misses the *legitimacy* of the expectation. Without internalized rules or shared beliefs about entitlements, you have a description of *habit*, not *convention*. You risk collapsing the distinction between "people usually do X" and "people ought to do X."

  #### 1. The Triviality / Falsifiability Problem (Most Decisive)
  *   **The Challenge:** You asked: "If any regularity that happens to stick around can be relabeled a convention, is the theory risking anything at all?"
  *   **The Defeater:** If you remove expectations and common knowledge, what distinguishes a convention from a biological reflex or a law of nature?
      *   *Example:* In a crowded theater, if fire breaks out, everyone runs for the exit. This is a regularity. It solves a coordination problem (getting out). It is sustained by reinforcement (survival). Is "running for the exit during a fire" a convention?
      *   *Lewis's Answer:* No, because it's not arbitrary (there's no equally good alternative like standing still) and it's driven by instinct/physics, not mutual expectation.
      *   *Your Answer:* If you say "Yes, it's a convention," the term loses all analytic power. If you say "No," you need a criterion to distinguish it from driving on the right.
  *   **The Decisive Blow:** The only available criterion to distinguish "running from fire" from "driving on the right" is the **counterfactual dependence on others' behavior**. I drive on the right *because* you do. I run from fire *even if* you don't (mostly).
  *   **Concession:** To avoid falsifiability, you *must* retain a condition that the regularity is *contingent on the regularity itself*. But without "expectations," how do you model this contingency? If you model it purely as behavioral coupling (I react to your movement), you describe a flock of birds. If you claim human conventions are distinct from bird flocks, you are implicitly reintroducing the cognitive machinery (beliefs/expectations) you tried to excise. **This is the point where your view risks becoming unfalsifiable behaviorism.**

  ---

  ### Deep Dive: The Specific Cases You Requested

  #### 1. The Arbitrariness Condition: Unique Best Options
  You asked if there are stable norms everyone would rank the same way that we'd still call conventions.
  *   **Analysis:** Consider **Standard Time Zones**. Before railroads, local solar time was used. Standard time is objectively better for coordination. Is it a convention? Yes. Is it arbitrary? In the Lewisian sense, yes, because *which* zones we drew was arbitrary, even if *having* zones was not.
  *   **Threat to your view:** If the payoff matrix is Dominance rather than Coordination (one strategy is always best regardless of others), it is not a convention.
  *   **Verdict:** You must hold the line: If there is a unique dominant strategy, it is not a convention, even if everyone does it. If there are multiple equilibria, but one is payoff-dominant (risk-dominant vs. payoff-dominant), and we stick to the risk-dominant one (e.g., QWERTY), that is a convention. Your theory handles this fine via path-dependence in reinforcement learning.

  #### 2. Dynamics: Evolution and Flipping
  You asked if the picture explains how conventions evolve or flip.
  *   **Analysis:** Pure reinforcement (Law of Effect) is backward-looking. It explains stability (lock-in) beautifully. It explains *flips* poorly. To flip a convention, the reinforcement history must be overcome.
  *   **The Missing Mechanism:** In Lewis's original view, flips happen via **Salience** or **Focal Points** (Schelling). These are cognitive. We see a new option as "obvious."
  *   **Your Problem:** Without cognitive salience, how does a population jump from Equilibrium A to Equilibrium B? In EGT, this requires "noise" or "mutations." In human society, it often happens via *discourse* (leaders, media).
  *   **Verdict:** Your view describes the *maintenance* of convention well, but fails to explain the *genesis* or *revolution* of convention without smuggling in cognitive focal points. If you admit focal points, you are admitting that agents represent the problem to themselves, which edges back toward Lewis's original epistemic conditions.

  #### 3. The Expectation Mechanism: Missing vs. Present
  You asked for a case where mutual-expectation machinery is missing yet the norm persists, OR expectations are present and behavior is unstable.

  *   **Case A: Expectations Missing, Norm Persists (Supports You)**
      *   *Scenario:* **Queuing in Anonymous Crowds.** In a dense subway station in Tokyo, people queue perfectly. Many are tourists, many are locals. Do they form a belief "I expect you to expect me to queue"? Likely not. They see a line, they join. It is stimulus-response + imitation.
      *   *Implication:* This supports your behavioral reduction. High-order beliefs are not *necessary* for the *operation* of a convention in large populations.
      *   *Caveat:* The *system* relies on someone having set it up initially. But for the individual agent, your view holds.

  *   **Case B: Expectations Present, Behavior Unstable (Defeats You)**
      *   *Scenario:* **Bank Runs / Currency Crashes.**
      *   *Mechanism:* Everyone expects everyone else to withdraw. The expectation is mutual. The expectation is common knowledge (announced on news).
      *   *Outcome:* The regularity (keeping money in bank) collapses.
      *   *Why this hurts your view:* Your view defines convention as a *regularity that solves a coordination problem*. In a bank run, the coordination problem is still there (we all prefer the bank not to fail), but the behavior flips.
      *   *The Killer:* If conventions are just stable regularities sustained by reinforcement, they shouldn't be so fragile to *mere talk*. In a bank run, the payoffs haven't changed yet. The *beliefs* changed the behavior *before* the reinforcement history updated.
      *   *Conclusion:* This demonstrates that **expectations can drive behavior independently of reinforcement history.** If expectations can override history to break a convention, then expectations are causally primary. Your theory, which prioritizes history/imitation, cannot explain the *breakdown* without referencing the very epistemic states you excluded.

  ### Final Verdict for the Defender

  You can successfully defend a **Behavioral/Evolutionary Account of Convention Maintenance**. You are right that for large-scale, low-stakes conventions (which side of the sidewalk to walk on), high-order common knowledge is psychologically unrealistic.

  However, you cannot defend this as a **Complete Theory of Social Normativity**.
  1.  **Falsifiability:** You must define "coordination problem" strictly enough to exclude biological reflexes (fire escape).
  2.  **Normativity:** You cannot explain *blame* without internalized rules or expectations of entitlement.
  3.  **Dynamics:** You cannot explain rapid convention shifts without acknowledging cognitive focal points.

  **The Hard Concession:** To save the theory, you must admit that "Convention" is a hybrid concept.
  *   **Sub-personal level:** Sustained by imitation/reinforcement (your view).
  *   **Personal level:** Accessed and modified via expectations/beliefs (Lewis's view).

  If you insist on *only* the sub-personal level, you have a theory of **social habit**, but you have lost the **social contract** element that makes conventions distinct from instincts. The "mutual expectation" isn't just a philosophical luxury; it's the mechanism that allows humans to *change* conventions rationally rather than waiting for evolutionary drift. Without it, you have a theory of how we are stuck, not how we agree.
