answer: |-
  # Q&A Preparation Sheet: Death in Damascus & The Disposition Move

  **Thesis:** *Death in Damascus* (DiD) is not a failure of Causal Decision Theory (CDT) but a category error regarding the "act." Rational choice targets the **standing disposition** ($D$), settled prior to prediction. The prediction is downstream of $D$. CDT maximizes over $D$, rendering the case determinate without Evidential Decision Theory (EDT).

  **Audience Profile:** 75% CDT (anti-EDT, anti-"algorithm choice"), 25% EDT (pro-DiD counterexample), 1 Statistician (anti-conditioning confusion).

  ---

  ### Top 8 Objections (Ordered by Likelihood & Damage)

  #### 1. The "Relabeled EDT" Charge
  **Who:** The EDTers (supported by skeptical CDTers).
  **Objection:** "You say you're doing CDT, but you're just conditioning on a variable ($D$) that correlates with the outcome. If the prediction depends on $D$, and your act depends on $D$, then conditioning on your act gives you the same advice as conditioning on $D$. You haven't saved CDT; you've just moved the evidential correlation one step back and renamed it a 'disposition'."
  **2-Minute Reply:** "The distinction is in the *graph*, not the advice. EDT conditions on the token act ($A$), treating $A$ as evidence of Death's location. I intervene on $D$ ($do(D)$). In my graph, $D$ causes both the Prediction and $A$. By intervening on $D$, I break the link between $D$ and its prior causes, but I keep the causal link to the Prediction intact. EDT says 'If I flee, that's evidence I was predicted to flee.' I say 'If I cultivate a fleeing-disposition, that *causes* the prediction to be 'flee'.' One is diagnostic; the other is productive. CDT requires production."
  **Candid Soft Spot:** If the disposition is perfectly correlated with the act, the math looks identical. You rely entirely on the metaphysical claim that $D$ is a *cause* and not just a common cause signal.

  #### 2. The "No Control" Objection
  **Who:** The CDT Hardliners.
  **Objection:** "You admit the disposition is settled *before* the prediction. The prediction is in the past. Therefore, the disposition is in the past. How can CDT, a theory of *choice*, recommend I choose something that has already happened? You're asking me to choose my own history."
  **2-Minute Reply:** "Deliberation is not a momentary snap; it is the process of settling the disposition. When you are in Damascus deliberating, the prediction has not happened *relative to your deliberation timeline*, even if it has in the story's timeline. More importantly, 'settled before prediction' means settled before the *predictor's access*, not before your agency. Your disposition is the mechanism by which you act. You have causal power over your own character traits in the moment of decision, even if they feel stable."
  **Candid Soft Spot:** This is the metaphysical weak point. If the predictor is infallible, $D$ is factually fixed. Claiming you can "choose" it now sounds like magic or backward causation to a strict causal theorist.

  #### 3. The "Algorithmic Choice" Slippery Slope
  **Who:** The CDTers (allergic to FDT/TDT).
  **Objection:** "This sounds exactly like Functional Decision Theory. You're telling the agent to choose the output of their own decision algorithm rather than the physical act. We rejected that because agents can't step outside their own code. Why is choosing a 'disposition' any different from choosing your source code?"
  **2-Minute Reply:** "FDT treats the agent as a logical function abstracted from physics. I am treating the agent as a physical system with psychological states. A disposition is a causal property of the brain, like a hormone level or a neural weight. I am not asking you to choose a logical output; I am asking you to recognize that your psychological state is the causal lever. CDT already allows intervening on internal states (e.g., taking a pill to calm nerves). This is just applying that to the decision-state itself."
  **Candid Soft Spot:** The line between "psychological state" and "decision algorithm" is thin. If they press that you can't causally intervene on the very state generating the intervention, you're stuck.

  #### 4. The "Fixed Past" Objection
  **Who:** EDTers & CDTers.
  **Objection:** "In DiD, Death is *already* in Damascus or Aleppo when you walk in. The prediction is over. How does changing your disposition now move Death? You're conceding the act doesn't cause survival, so you're admitting CDT fails on the act, which is what matters."
  **2-Minute Reply:** "Death is where the Prediction said he would be. The Prediction is where the Disposition said it would be. If you change the Disposition, you change the Prediction (counterfactually), which changes Death's location. We are evaluating counterfactuals: 'If I were the sort of person who stays, where would Death be?' not 'Given Death is here, what should I do?' CDT evaluates the former. The act is merely the execution of the disposition."
  **Candid Soft Spot:** This requires the audience to accept counterfactuals about the past (if I were disposed differently, the prediction would differ). Some CDTers reject backtracking counterfactuals.

  #### 5. The "Why Ain't You Rich?" (WAYR) Pragmatic Test
  **Who:** CDTers.
  **Objection:** "Decision theories are tools for winning. If I use standard CDT, I flee and die. If I use your 'Disposition CDT', I stay and die (because Death predicted it). In both cases, I die. So how is your theory better? It doesn't make me richer or safer in the single case."
  **2-Minute Reply:** "In DiD, no one survives. The test isn't survival in this specific rigged case, but correctness of recommendation. Standard CDT says 'Flee' is causally optimal, but it leads to death because it ignores the predictor's dependence on the agent's type. My view gives the *determinate* recommendation that aligns with the causal structure. In iterated cases (Newcomb-like), agents who select dispositions based on outcomes outperform those who select acts ignoring the prediction link. We want a theory that wins in the long run, not one that rationalizes losing in the short run."
  **Candid Soft Spot:** In the specific DiD case, everyone dies. It's hard to claim a "win" here. You have to pivot to Newcomb's Problem quickly, which might look like moving the goalposts.

  #### 6. The Statistician's "Intervention" Query
  **Who:** The Statistician.
  **Objection:** "You talk about $do(D)$. But $D$ is a latent variable. I can intervene on a pill or a lever. What is the physical intervention on a 'standing disposition' that doesn't just amount to brainwashing? If the intervention is 'decide', aren't you just conditioning on the decision?"
  **2-Minute Reply:** "The intervention is *deliberation*. In causal modeling of agents, the deliberation process is the $do$-operator on the belief/desire set. We model 'choosing' as setting the value of the decision node. I am simply arguing the decision node is upstream of the prediction. You don't need brainwashing; you need to recognize that the output of your deliberation *is* the disposition settling. The statistics hold as long as the graph is accurate."
  **Candid Soft Spot:** If the Statistician argues that "deliberation" isn't a valid exogenous variable in the graph because it's endogenous to the agent's physics, your model collapses.

  #### 7. The "Akrasia/Mismatch" Problem
  **Who:** General Audience.
  **Objection:** "What if I choose the 'Stay' disposition, but when the time comes, I panic and Flee? The Prediction was 'Stay' (Death in Damascus), but I Flee (to Aleppo). I survive. Doesn't this show the Act is the real locus of choice, not the Disposition?"
  **2-Minute Reply:** "That's a case of irrationality, not a counterexample to the normative theory. If your act mismatches your disposition, you've failed to execute your choice. Decision theory tells you what to choose, not how to guarantee motor control. Furthermore, an infallible predictor predicts the mismatch. If you are the sort of person who intends to stay but flees, the predictor predicts 'Flee'. You can't outsmart the predictor by being akratic."
  **Candid Soft Spot:** This highlights that $D$ and $A$ can come apart. If they can come apart, why isn't $A$ the thing that matters for survival? You have to argue $A$ is not free.

  #### 8. The "Regress of Dispositions"
  **Who:** CDTers.
  **Objection:** "If I choose my disposition, do I choose it using a higher-order disposition? How was *that* chosen? You either stop at an unchosen disposition (fatalism) or go into infinite regress."
  **2-Minute Reply:** "We stop at the agent's character. CDT doesn't explain how agents exist; it explains how existing agents choose. The disposition is the boundary of the agent. We intervene on the agent's state. We don't need to choose the chooser; we just need to acknowledge the chooser is the causal source."
  **Candid Soft Spot:** This is a standard compatibilist move. Hard determinists in the room will eat this alive, but they aren't your target audience.

  ---

  ### The Single Weakest Point
  **The Temporal Location of Agency.**
  Your thesis rests on the claim that the disposition is "settled before the prediction" but also the "object of rational choice."
  *   **The Tension:** If it is settled before the prediction, and the prediction is in the past (relative to the decision), then the disposition is factually fixed in the past.
  *   **The Risk:** You will be pressed on how you can causally intervene on a past fact. If you say "Deliberation settles it," they will ask "But the Predictor already knew the result of your deliberation."
  *   **Defense Strategy:** Do not retreat to "the future affects the past." Insist that the causal graph is *atemporal* regarding logical dependence. The Prediction depends on the Disposition logically/causally, regardless of temporal index. You are choosing the *value* of the variable $D$ in the model, not reaching back in time to change a historical event.

  ### The One Question You Are Dreading
  **"If the Predictor is infallible, then $P(\text{Death} | \text{Disposition})$ is 1 or 0. If the probabilities are extreme, CDT and EDT converge anyway. So why do we need your complex disposition machinery? Isn't this a solution looking for a problem?"**

  *   **Why it's dreaded:** It suggests your entire paper is technically redundant. If the correlation is perfect, standard CDT (properly applied to the available information) might already handle it, or the case is trivial.
  *   **Prepared Answer:** "Standard CDT treats the Act as the intervention. Even with perfect prediction, if you intervene on the Act ($do(\text{Flee})$), CDT severs the link to the Prediction and says 'Fleeing saves me'. That is the error. My machinery is required to show *why* CDT severs the wrong link. It's not about the probabilities converging; it's about identifying the correct locus of the $do$-operator."
