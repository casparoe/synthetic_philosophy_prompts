answer: |-
  # Joint Statement on the Nature of Convention

  ### 1. Agreed Claims
  1. Conventions are arbitrary regularities in behaviour within a population; another regularity could have served the same coordinating function.
  2. Conventions persist because individuals benefit from coordinating, not merely from the intrinsic value of the act itself.
  3. Stock examples (driving, money, language) exhibit stability even when individual reasoning is opaque to the observer.
  4. A regularity sustained solely by coercion or physical necessity is not a convention.
  5. In Case (a) (the repealed law), the behavioural regularity persists despite the false belief about the legal enforcement.
  6. In Case (b) (risk versus payoff), population dynamics can stabilise on an equilibrium without common knowledge.
  7. Mutual expectation guarantees stability in the short term, regardless of how that expectation is generated.
  8. Conditional preferences (preferring to conform if others do) distinguish conventions from coerced regularities in paradigm cases.
  9. Conventions can collapse if the underlying coordination problem dissolves or if the population loses the capacity to coordinate.
  10. Both explanations (rationalist reasoning and evolutionary dynamics) can model the same steady-state behavioural outcome.

  ### 2. Where We Still Part Company

  **Disagreement 1: The Constitutive Conditions**
  *   **Camp 1:** A convention is constitutively a state of common knowledge; without mutual awareness of the expectation, there is no convention, only coincidental behaviour.
  *   **Camp 2:** A convention is constitutively a stable behavioural equilibrium; mutual awareness is an accidental feature that sometimes accompanies stability but does not define it.

  **Disagreement 2: Case (a) — The Repealed Law**
  *   **Camp 1:** This is not a convention because the expectation is grounded in falsehoods about enforcement, not in mutual recognition of the equilibrium itself.
  *   **Camp 2:** This is a convention because the behavioural regularity and conditional preferences hold regardless of the explanatory belief's truth.

  **Disagreement 3: Case (b) — Risk versus Payoff**
  *   **Camp 1:** If agents lack common knowledge, they cannot reliably select the payoff-dominant equilibrium; thus, no convention forms, or a suboptimal regularity forms by accident.
  *   **Camp 2:** Dynamics will select the risk-dominant equilibrium regardless of payoff, proving reasoning is irrelevant to the existence of the convention.

  ### 3. The Cruxes
  1.  Is the label "convention" tied to the psychological state of the agents or the behavioural pattern of the population?
  2.  Does Case (a) retain the normative force of convention (the sense that one *ought* to conform) if the belief sustaining it is false?
  3.  In Case (b), does the selection of the risk-dominant equilibrium disprove the reasoning model, or merely show its limits?
  4.  Can a regularity persist indefinitely without any agent ever possessing a true belief about why others conform?

  ### 4. What Would Bear on Each Crux

  | Crux | Relevant Evidence / Argument | Camp 1 Prediction | Camp 2 Prediction |
  | :--- | :--- | :--- | :--- |
  | **1. Psychology vs. Behaviour** | Intuition pumps on whether we call insect swarms or algorithms "conventional". | We will deny the label without intentionality. | We will accept the label if stability conditions are met. |
  | **2. Case (a) Normativity** | Survey: When the law's repeal is revealed, does the feeling of obligation vanish immediately? | Yes; the normative grip depends on true common knowledge. | No; the habit persists until behavioural incentives change. |
  | **3. Case (b) Equilibrium** | Simulation: Large population, low noise, risk vs. payoff conflict. | Agents will fail to coordinate or coordinate on payoff-dominant via reasoning. | Population will converge on risk-dominant via dynamics. |
  | **4. False Belief Persistence** | Historical analysis of taboos sustained by myths long after facts were disproven. | These are not conventions but superstitions sustaining regularities. | These are paradigm conventions sustained by dynamic stability. |

  ### 5. Is Any of This Just Verbal?
  There is a verbal component, but it is not merely verbal. Both camps agree on the behavioural facts: people drive on the left, use money, and speak English. They disagree on whether the term "convention" applies to systems lacking common knowledge. However, the dispute is substantive because it dictates where we look for explanations. Camp 1 looks to individual reasoning and epistemic logic; Camp 2 looks to population dynamics and reinforcement histories. If Camp 1 is right, changing a convention requires changing minds. If Camp 2 is right, changing a convention requires changing incentives or population structure. These are different interventions with different success conditions.

  ### 6. Where I'm Most Likely to Have Got This Wrong
  Camp 1 will likely refuse Claim 6. They argue that without common knowledge, agents are not solving a coordination problem but merely reacting to stimuli; calling this an "equilibrium" concedes too much to the dynamic view. Additionally, my drafting of Case (a) in Section 2 favours Camp 2. Camp 1 would insist that false belief destroys the *common knowledge* condition entirely, making it not a "failed convention" but a "non-convention". I have treated the disagreement as one of classification, but Camp 1 sees it as ontological: without the reasoning, the social object does not exist. This slants the joint statement towards a behavioural realism that Camp 1 might reject as missing the point of normativity.

  ### 7. What Would Change My Mind
  I would conclude the dispute is merely verbal if both camps agreed that "convention" is a cluster concept where reasoning and dynamics are weighted features rather than necessary conditions. If Camp 1 admitted that common knowledge is a typical but not essential feature, and Camp 2 admitted that reasoning is a powerful stabiliser even if not constitutive, the substantive gap would vanish. My reasoning is weakest on the normative force of Case (a). If it turns out that false beliefs sustain obligation just as well as true ones, Camp 1's insistence on epistemic conditions looks like intellectual snobbery. Conversely, if revealing the truth instantly dissolves the regularity, Camp 2's dynamics look insufficient to explain human sociality. I am currently assuming the behavioural persistence outweighs the epistemic failure, but that is an empirical gamble.
