              *   Mixed? This looks like a "Guess 2/3 of the average" or Matching Pennies variant structure, but specifically, it's a game where the outer ring is a cycle $T \to R \to B \to L \to T$. The center $(M, C)$ is the unique Nash.
      *   **The Conflict:** IEDS survivors $\neq$ Nash Equilibrium strategies.
      *   **Diagnosis:** IEDS identifies *Rationalizable* strategies. Nash Equilibrium requires *mutual* best responses (consistent beliefs). Rationalizability only requires beliefs to be consistent with rationality, not necessarily correct. In Game 2, I can play $T$ if I believe you play $R$. You playing $R$ is rational if you believe I play $T$. This loop is consistent with rationality, even if it's not a fixed point (equilibrium).
