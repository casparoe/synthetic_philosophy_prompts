      *   **Caveat:** This holds for *Strict* Dominance. It fails for *Weak* Dominance. (This bridges to the user's 4th question).
      *   **Verdict:** TA is right about strict dominance. The guarantee comes from the fact that strict dominance defines a property of the strategy relative to the *current* set, and removing a dominated strategy never makes a previously dominated strategy undominated.

  5.  **Analyze Weak Dominance:**
      *   **User's Practice:** Deletes weakly dominated strategies.
      *   **TA's Reaction:** Winced.
      *   **Theory:** Weak dominance is order-dependent. Eliminating a weakly dominated strategy can change the dominance relations of remaining strategies. It can eliminate Nash Equilibria.
      *   **Example:** A simple coordination game or entry deterrence.
      *   **Verdict:** TA is right to wince. You lose the "order doesn't matter" guarantee, and you might throw away plausible equilibria (like risk-dominant vs payoff-dominant issues, or trembling hand perfection nuances).

  6.  **Synthesize and Structure the Response:**
