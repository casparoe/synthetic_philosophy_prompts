answer: |-
  Colleague to colleague: take a breath. Your TA is technically correct on the mechanics, but you are right to feel the philosophical friction. These aren't just calculation errors; they are tensions between the formalism and the intuition of rational agency. You're teaching political theory, so the *normative* weight of these concepts matters more to you than the topological fixed-point theorems that comfort a mathematician.

  Let's work the games, then diagnose the concepts.

  ### Part 1: Working Game 1 (The Ontology of the Lottery)

  **The Matrix:**
  $$
  \begin{array}{c|cc}
   & L & R \\
  \hline
  T & 3,3 & 0,0 \\
  M & 0,0 & 3,3 \\
  B & 1,1 & 1,1
  \end{array}
  $$

  **The Math:**
  You are correct that no *pure* strategy dominates $B$.
  *   If Column plays $L$, $T$ (3) beats $B$ (1), but $M$ (0) loses to $B$.
  *   If Column plays $R$, $M$ (3) beats $B$ (1), but $T$ (0) loses to $B$.

  However, consider the mixed strategy $\sigma = 0.5T + 0.5M$.
  *   Against $L$: $0.5(3) + 0.5(0) = 1.5$.
  *   Against $R$: $0.5(0) + 0.5(3) = 1.5$.
  *   Since $1.5 > 1$, $\sigma$ strictly dominates $B$.

  **The Diagnosis:**
  Your student's question ("In what sense is $B$ irrational?") hits the nerve of what a "strategy" actually *is*.

  In the von Neumann-Morgenstern framework we use for rational choice, the "strategy space" is not just the rows $\{T, M, B\}$; it is the *simplex* over those rows. A rational agent is defined as an expected-utility maximizer. If an agent can construct a probability distribution over their actions that yields higher expected utility than a specific action, regardless of what the opponent does, choosing that specific action violates the axioms of expected utility maximization.

  To answer your student: **Yes, the lottery is an option in the same sense $T$ is.**
  Why? Because rationality is about the *plan*, not just the physical movement. If I tell you, "I will flip a coin to decide between $T$ and $M$," I have executed a strategy. If I tell you "I will play $B$," I have executed a strategy. Since the coin-flip plan guarantees me 1.5 and the $B$ plan guarantees me 1, choosing $B$ is irrational *ex ante*.

  **The Connection to "Best Response":**
  Your TA mumbled about $B$ not being a best response to any belief. This is **Pearce's Lemma**. It states: *A strategy is strictly dominated (possibly by a mix) if and only if it is never a best response to any probability distribution over the opponent's strategies.*

  Let $p$ be the probability Column plays $L$.
  *   $EU(T) = 3p$
  *   $EU(M) = 3(1-p)$
  *   $EU(B) = 1$

  For $B$ to be a best response, we need $1 \ge 3p$ AND $1 \ge 3(1-p)$.
  *   $1 \ge 3p \implies p \le 1/3$
  *   $1 \ge 3 - 3p \implies 3p \ge 2 \implies p \ge 2/3$
  There is no $p$ that is both $\le 1/3$ and $\ge 2/3$. Thus, there is no belief about Column that makes $B$ rational.

  **Pedagogical Fix:** Tell your students that dominance isn't about finding a *better pure move*; it's about finding a *better plan*. $B$ is a "sucker's bet" because it refuses to hedge. Rationality requires hedging when the environment is uncertain, even if that hedge is a mental coin flip.

  ---

  ### Part 2: The Order of Elimination (Circularity?)

  **The Question:** If $A$ kills $B$, but later $C$ kills $A$, is the elimination of $B$ retroactively undone?

  **The Diagnosis:**
  Your TA is right: For **Strict Dominance**, the order does not matter. The set of survivors is unique.
  It feels circular to you because you are thinking dynamically ("First I kill $B$, then I realize $A$ was bad... oops, should I have kept $B$?"). But the logic is static.

  Strict dominance is transitive. If $C$ strictly dominates $A$, and $A$ strictly dominates $B$, then $C$ strictly dominates $B$.
  *   $B$ is removed in round 1 because $A$ is available and better.
  *   $A$ is removed in round 2 because $C$ is available and better.
  *   $B$ stays removed because $C$ is *also* better than $B$.

  $B$ doesn't come back to life just because its executioner ($A$) was executed. $B$ was guilty on its own merits; $A$ was just the first witness to testify. $C$ is the second witness. The verdict stands.

  **The Guarantee:** This comes from the fact that removing a strictly dominated strategy never changes the *relative* payoffs of the remaining strategies. It only removes options. If $X$ was better than $Y$ before, it is still better than $Y$ after $Z$ is removed.

  ---

  ### Part 3: Working Game 2 (Rationalizability vs. Equilibrium)

  **The Matrix:**
  $$
  \begin{array}{c|ccc}
   & L & C & R \\
  \hline
  T & 0,7 & 2,5 & 7,0 \\
  M & 5,2 & 3,3 & 5,2 \\
  B & 7,0 & 2,5 & 0,7
  \end{array}
  $$

  **The Math:**
  1.  **Nash Equilibrium:** Check $(M, C)$. Row gets 3. Deviating to $T$ gives 2, to $B$ gives 2. Column gets 3. Deviating to $L$ gives 2, to $R$ gives 2. $(M, C)$ is a NE.
      *   Are there others? The outer ring ($T, B$ vs $L, R$) is a Matching Pennies cycle. $T$ beats $R$, $R$ beats $B$, $B$ beats $L$, $L$ beats $T$. There is no pure NE on the corners. There is a mixed NE on the corners, *but* $M$ dominates that mixed expectation. (If Col mixes $L/R$, Row gets 3.5 from $T/B$ mix, but 5 from $M$). So $(M, C)$ is the **unique** Nash Equilibrium.
  2.  **Iterated Elimination:**
      *   Is $T$ dominated? No. If Col plays $R$, $T$ yields 7 (best possible).
      *   Is $M$ dominated? No. If Col plays $C$, $M$ yields 3 (best possible).
      *   Is $B$ dominated? No. If Col plays $L$, $B$ yields 7 (best possible).
      *   Symmetry holds for Column.
      *   **Result:** Nothing is eliminated. All 9 cells survive IEDS.

  **The Diagnosis:**
  Your lecture line ("what survives... is roughly the set of strategies you might see in an equilibrium") is the one that has to go. It is factually incorrect, as this game proves.

  Here is the distinction you need:
  *   **Nash Equilibrium:** Requires **consistent beliefs**. I play my best response to what you *actually* play.
  *   **IEDS Survivors (Rationalizability):** Requires only **reasonable beliefs**. I play my best response to what I *think* you might play, provided what I think you play is also rational for you.

  In Game 2, I can play $T$. Why? Because I believe you will play $R$. Is it rational for you to play $R$? Yes, if you believe I will play $T$.
  This creates a loop: $T \to R \to T$. This loop is consistent with *common knowledge of rationality*, but it is not a fixed point. We are rational, we know we are rational, we know we know... but our beliefs about each other's specific moves are wrong.

  **Pedagogical Fix:**
  Change your line to: *"What survives iterated elimination is the set of strategies consistent with Common Knowledge of Rationality. Nash Equilibrium is a subset of those survivors where beliefs are also Correct."*
  In Game 2, the survivors are "Rationalizable Strategies." The equilibrium is the "Stable Outcome." The fact that the set of rationalizable strategies is larger than the equilibrium set shows that rationality alone does not guarantee coordination on the equilibrium. You need something more (like focal points, history, or communication) to collapse the rationalizable set down to the Nash point.

  ---

  ### Part 4: Weak Dominance (The TA's Wince)

  **The Practice:** You delete weakly dominated strategies.
  **The TA's Reaction:** He winced.
  **The Verdict:** **He is right to wince.**

  **Why:**
  The "order doesn't matter" guarantee you relied on in Question 2 **breaks** for weak dominance.
  Weak dominance means a strategy is sometimes equal to, and never worse than, another.
  *   Example: Strategy $A$ pays (1, 1). Strategy $B$ pays (1, 0). $A$ weakly dominates $B$.
  *   If you eliminate $B$, you might change the incentives for a third strategy $C$ that depended on $B$ being in the mix.

  More critically, **eliminating weakly dominated strategies can eliminate Nash Equilibria.**
  In many games (like entry deterrence or voting), a weakly dominated strategy is part of a plausible equilibrium (often sustained by "trembling hand" perfection or specific off-equilibrium beliefs). If you teach students to delete them casually, they will solve games and arrive at a unique solution that is *one* equilibrium, while missing others that are equally valid under standard Nash definitions.

  **Pedagogical Fix:**
  Tell your students: "We only eliminate **Strictly** Dominated strategies. If a strategy is only *weakly* dominated, we keep it. Strict dominance is safe; weak dominance is dangerous and order-dependent." This will stop the wincing.

  ### Summary for your Seminar

  1.  **On Game 1:** Defend the elimination of $B$. Rationality allows for mixed strategies as *plans*. $B$ is never a best response to any belief.
  2.  **On Order:** For *strict* dominance, order is irrelevant. Transitivity saves you. $B$ is doomed even if its executioner is later executed.
  3.  **On Game 2:** Correct your definition. IEDS finds **Rationalizable** strategies (consistent beliefs), not necessarily **Equilibrium** strategies (correct beliefs). Rationality does not imply equilibrium.
  4.  **On Weak Dominance:** Stop doing it. It breaks the order-independence guarantee and deletes valid equilibria. Stick to strict dominance for this level of theory.

  You're asking the right questions. The friction you feel is the gap between "Rational Choice" as a mathematical tool and "Rationality" as a philosophical norm. Acknowledging that gap in class will make you a better teacher, not a weaker one.
