      *   **The "Lottery" Question:** Is the lottery an option? In the *strategic form*, no. In the *extended form* of reasoning (allowing for randomization devices), yes. Rationality requires maximizing expected utility. If a convex combination of strategies yields higher EU than a pure strategy regardless of the opponent's move, the pure strategy is irrational because a rational agent *could* randomize (even if just via uncertainty in their own mind, though formally we treat mixed strategies as available actions in the solution concept).
      *   **Connection:** A strategy is strictly dominated (by a mix) if and only if it is never a best response to any belief (Pearce's Lemma). That's the link the TA mumbled about.

