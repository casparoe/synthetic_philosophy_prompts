prompt: |-
  Alright, I need a game theorist to talk me down, and I'd rather get it from you then from my TA (who is 24 and terrifying). Background: I'm a philosopher, I teach a rational choice unit in a political theory seminar, and I've been doing the iterated-elimination thing for years, mostly from memory. Last week a student asked me something I couldn't answer and it's been eating at me. Treat yourself as the expert here and talk to me like a colleague. Take your time, and please actually work the two games below before you say anything general — I want the diagnosis, not the textbook gloss.

  Game 1 is the one I use to introduce mixed strategies. Row player's payoff first, column player's second:

            L        R
     T    3, 3     0, 0
     M    0, 0     3, 3
     B    1, 1     1, 1

  I tell them B is stupid: the 50-50 lottery over T and M gives you 1.5 against either column, and B only gives you 1. The cute part is that no pure strategy beats B — you need the lottery to do it. Then my student asks: if it takes a lottery to beat B, in what sense is B irrational? Someone who is dead certain the other player is playing L should play T, not flip a mental coin. And I have to admit I've always half-thought of dominance as a pure-strategy affair, with mixed-strategy dominance as a technical refinement for the graduate students. So what am I actually doing when I delete B? Is the lottery an option in the same sense T is? (My TA mumbled something about B not being a best response to any belief, which sounds like the right answer, but I want to see how it connects to the thing about lotteries.)

  Second thing, and this one has nagged me for years. My TA says the order of elimination doesn't matter, and that it's fine to use a strategy inside the eliminating lottery and then turn around and eliminate that same strategy two steps later. That sounds circular to me — if the thing doing the beating is itself beaten later, isnt the earlier elimination retroactively undone? Is he right that you get the same answer either way, and if so, where does the guarantee come from?

  Third, my lecture line is that what survives iterated elimination is roughly the set of strategies you might see in an equilibrium. Game 2, which I use for exactly this point, makes that look false. Same layout:

            L        C        R
     T    0, 7     2, 5     7, 0
     M    5, 2     3, 3     5, 2
     B    7, 0     2, 5     0, 7

  Nothing ever gets eliminated here — every strategy is a best response to some belief — and yet the only equilibrium is both players playing M. So my survivors include strategies that no equilibrium ever uses. Which of my two sentences has to go, and what should I say instead? Is there a name for what the procedure is actually picking out, and does it have anything to do with rationality, or is it a different idea wearing the same coat?

  Last, a practical one. I've also been telling them to go ahead and delete weakly dominated strategies while they're at it, on the grounds that a weakly dominated strategy can't be a best response either, so no harm done. My TA winced at that. Was he right to wince?
