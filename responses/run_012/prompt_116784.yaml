      *   **Student's Challenge:** If it takes a lottery to beat $B$, is $B$ irrational? A player certain of $L$ plays $T$. A player certain of $R$ plays $M$. Why is $B$ irrational *ex ante*?
      *   **Core Concept:** Strict Dominance by a Mixed Strategy vs. Best Response.
      *   **Diagnosis:** $B$ is never a best response to *any* belief (probability distribution over opponent's strategies). If $p$ is prob of $L$, $EU(T) = 3p$, $EU(M) = 3(1-p)$, $EU(B) = 1$.
          *   If $p > 1/3$, $T$ beats $B$ ($3p > 1$).
          *   If $p < 1/3$, $M$ beats $B$ ($3 - 3p > 1 \Rightarrow 2 > 3p \Rightarrow p < 2/3$). Wait, let's check the intersection.
