  Background: I'm a third-year PhD student in philosophy (my disseratation is on credit and attribution norms in collaborative science), so I read alot of sociology of science but I've never done any history of science proper, and I'm sitting in on a seminar this term. The professor gave us his thumbnail of the multiple-discovery cases and I wrote it down pretty much word for word:

  'Simultaneous discovery is the rule in science, not the exception. Darwin and Wallace, Newton and Leibniz, and dozens of other pairs show that once the time is ripe the idea gets made by whoever happens to be standing there. So those discoveries were inevitable — if Darwin had died on the Beagle, Wallace would have published the same theory, and if neither of them had, somebody else would have gotten there within a few years. You can even measure the ripeness of a field: take the fraction of its major discoveries that had multiple independent discoverers, and that number tells you how inevitable each one of them was. Which is why the lone-genius story is a myth, and why priority disputes are basically vanity — the individual's contribution is negligible, so the credit really belongs to the community, or to the era. The Newton–Leibniz fight over the calculus is the perfect illustration of how empty it all was: neither man had really seen the other's work, they arrived at the same results anyway, and so there was nothing to settle.'

  I think he's right about the sociology, and the conclusion appeals to me politically, but the last step feels like it's doing more work than it's earned, and the ripeness-measurement thing sounds too neat. Could you audit it for accuracy? Which sentences would a historian or philosopher of science sign off on, which are quietly overstated or quietly conflating two claims that need keeping apart, what would a defender of the multiples thesis say in his own defence, and do the conclusions about credit — community over individual — actually follow once the shaky parts are fixed? I don't need reading recs, I need to know what to believe and where the seams are. Exactly five numbered points, each a sentence or two, no intro and no wrap-up.
