prompt: |-
  Alright, I need you to wear two hats at once: a philosopher of law who's thought seriously about self-referential legal systems (can a law authorise its own amendment? can a constitution tie its own hands? what happens when the rule for changing the rules is itself changeable?), and a game designer who's actually run tabletop games and knows the difference between a rule-set that's fun and one that's a seminar with dice.

  Refresher, in case Nomic isn't in your head in the shape I'm thinking of: Nomic is a game where changing the rules is itself a move. On your turn you propose a rule change, everyone votes, majority carries, and play continues. Rules come in two flavours — mutable ones you amend by ordinary vote, and immutable ones that take precedence and can't be touched until you pass a rule that turns them mutable first. The really important bit is that rules can change the voting thresholds, change which rules count as immutable, and even change the rule that says you have to obey the rules. The game is engineered so that a group of honest players eventually ends up somewhere the rule-set just doesn't determine what's legal.

  Your job: start by brainstorming. Give me five or six candidate mechanisms for self-referential trouble in a system like this — just sketches, one or two lines each — and then tell me which are boring and why (already famous, or just a thin rehash of the rule that says it can't be amended, or whatever) and which are actually live. Then pick the best one and build it out properly.

  What I want in the end is a small rule-set — say six to nine rules — plus a short play sequence that carries you from a clean starting position into a real paradox: a state where the rule-set licenses two incompatible readings of what the rules now say, and no move available from inside the game settles which reading is right. Constraints:

  - The paradox has to be reached by legal play, not by misreading or cheating. Show the turns: who proposes what, how the vote goes, and why every step was legal at the time it happened.
  - No outside authority. No designer-decides, no referee, no appeal to the spirit of the game. If the only fix is an external judge, admit it and count the design as failed.
  - No cheating with vagueness. Words like reasonable, fair, clearly, and if possible are banned from the rules. The trouble has to come from structure, not from English being fuzzy.
  - Don't just re-run the standard trick where a rule repeals its own immutability. I want a different mechanism, and ideally one where the paradox only surfaces two or three moves after the offending rule was passed, so nobody saw it coming.
  - Playable in an evening by five or six people who arent lawyers. Keep the whole rule-set under a page.
  - The mutable/immutable machinery should be load-bearing, not decoration.

  Then walk me through it:

  (a) State the two readings and why each one is licensed by the text as it stands — this is the part I care most about, so be careful and don't hand-wave.

  (b) Identify the single feature doing the work, then delete it and show the paradox collapsing into something ordinary. I want to know it's load-bearing and not just a pile of weird wording.

  (c) Say what a judge would have to presuppose to break the tie, and whether that presupposition is something the rule-set could have written in explicitly in advance. If yes, why didn't it? If no, what does that tell you about the ideal of a rule-set that fully determines its own interpretation?

  (d) An honest note on where this is cheating. Which step would a hostile reader call a misreading, and what's your best reply on the designer's behalf?

  (e) One paragraph on whether what you've built is a bug in the rules or an artefact of assuming a rule-set has to be consistent — is there a reading where the game is perfectly playable and only the philosphy is broken?

  No citations or reading lists needed, I'm not going to check your sources — just don't attribute anything to a specific person or book unless you're sure of it, and prefer to argue from the mechanics.
