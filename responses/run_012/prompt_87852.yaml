prompt: |-
  Hey, I've got a paper I'm presenting at a workshop in about three weeks and I need you to help me build my Q&A prep sheet. You're basically a philosopher who knows the On Certainty literature inside out but who also has alot of experience getting grilled at conferences, so think like both a sympathetic expert and a hostile questioner at once. Take your time, and maybe start by brainstorming the landscape of the debate before you actually write anything.

  So here's my thesis, roughly. The standard way hinge epistemologists frame things is that hinges are a distinctive class of propositions that enjoy a distinctive epistemic status — you can't justify them, you can't doubt them, they just sit at the foundation doing their thing. I want to argue that this whole framing is a mistake. On my reading, a hinge isn't a proposition at all; it's the constitutive rule of a particular practice of inquiry — it's what makes certain moves in that practice count as moves in the first place. So the regress worry (if you can't justify the hinge, what justifies the practice that rests on it?) is a category mistake, like asking what justifies the rules of chess. The rules of chess aren't true or false, they constitute the game. I think alot of the handwringing about the Münchhausen trilemma dissolves once you see hinges this way, because the trilemma only bites if you insist on treating the hinge as one more claim in need of grounds.

  The audience matters a lot here and it's a mixed room. Most of the people are analytic epistemologists who work on skepticism and epistemic closure; a few are externalists about justification and will instinctively want to say my move is just reliabilism in disguise; one person has written on the regress problem and will know the trilemma literature better than I do. There are also two Wittgenstein people who will be protective of the text and suspicious of me turning him into a philosopher of rules. And there's one formal epistemologist who is going to want a probabilistic or decision-theoretic model of the whole thing and will probably think my constitutive-rule talk is hand-waving unless I can make it precise.

  Give me a prep sheet: the eight or so objections I'll actually get from this room (not the generic objections I'd get from some imagined Wittgenstein society), ordered by how much damage they'd do, each one phrased the way that particular kind of questioner would actually put it, with a two-minute reply and an honest note on where my reply is soft or question-begging. Tell me which things I should concede up front to buy credibility, and which I should definately hold the line on. And include the one question I'm secretly hoping nobody asks.

  Write it as a prep sheet I can actually use while standing at a podium, not as an essay.
