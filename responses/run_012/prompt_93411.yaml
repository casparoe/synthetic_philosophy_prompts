  Weight hypotheses proportional to the number of centered experiences *causally generated* by the specific stochastic mechanism under evaluation, excluding centers whose population is a fixed background parameter of the theory or arises from degenerate thermodynamic fluctuations.

  **(b) Mapping Clauses to Cases**
  *   **"Causally generated by the specific stochastic mechanism":** This forces your verdicts in **(1)** and **(4)**. In Sleeping Beauty, the coin mechanism generates 1 heads-center vs 4 tails-centers; in the Room Case, the coin generates 1 observer vs 1 billion. You count them because the chance process *creates* the multiplicity.
  *   **"Fixed background parameter":** This forces your verdicts in **(2)** and **(3)**. In Doomsday and Theory Choice, the total number of observers is a static feature of the hypothesis, not a variable output of a chance event locating you. You ignore the count because it describes the stage, not the play.
  *   **"Degenerate thermodynamic fluctuations":** This forces your verdict in **(5)**. Boltzmann brains match your evidence, but because they arise from random noise rather than a generative causal history, they are excluded from the count.

  **(c) Verdicts on New Cases**
  *   **Case 6 (Quantum Inflation):** A quantum process decides physical constants. Outcome A yields $10^{10}$ observers; Outcome B yields $10^{50}$.
      *   **Verdict:** You should be nearly certain Outcome B occurred.
      *   **Pull:** This contradicts your intuition in (3). Here, observer count is a *mechanism output*, not a parameter, so the principle demands you update toward the larger universe.
  *   **Case 7 (The Archived Rank):** You find a document stating "Human #60 Billion." Theory A says 100 billion humans total; Theory B says 100 trillion.
      *   **Verdict:** No update on either theory.
      *   **Pull:** This aligns with (2). Since the total count is a parameter, your rank within it provides no evidence for the total size, reinforcing your rejection of the Doomsday Argument.

  **(d) Honest Limitations**
  You cannot consistently hold all five verdicts. The distinction between "mechanism" and "parameter" collapses in cosmology. If the size of the universe (3) is determined by physical constants set by chance (as in Case 6), it becomes a mechanism, forcing you to accept SIA and abandon (3). Furthermore, excluding Boltzmann brains (5) requires an arbitrary definition of "degenerate." If fluctuations are physical processes governed by chance, the principle counts them, forcing you to accept you are likely a BB. To maintain consistency, you must either:
  1.  **Accept SIA fully:** Keep (4), but update to the big universe in (3) and accept you are likely a BB in (5).
  2.  **Reject Center Counting:** Keep (3) and (5), but revert to $P(Heads)=1/2$ in (1) and reject the billion-room certainty in (4).

  Your current position relies on an unstable boundary between "created" and "described" observers.
