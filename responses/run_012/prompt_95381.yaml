  This is slightly contradictory or rather, a two-tier system. General drugs = Portugal style. Cannabis = Legal market. I need to make sure I don't conflate "Drugs" generally with "Cannabis" specifically in the analysis. The motion is about *Cannabis*, but the briefing note talks about "other drugs" generally using the Alcohol analogy. I must focus on the Cannabis motion while acknowledging the broader drug context provided in the prompt.
