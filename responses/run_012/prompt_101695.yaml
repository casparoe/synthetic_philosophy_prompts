answer: |-
  This is a fantastic textual puzzle. You are right to feel that your seminar leader is making a leap, but it is a leap that rests on a genuine tension in Just War Theory (JWT). To arm you for the seminar, we need to disentangle the *metaphysics* of the act from the *morality* of the agent.

  Here is the breakdown of Aquinas's text, followed by an analysis of the Moral Equality of Combatants (MEC) claim.

  ### 1. Who is the "Belligerent" (*belligerantes*)?
  In Article 1, Aquinas is determining whether the *act of waging war* is licit.
  *   **The Primary Agent:** The "belligerent" whose intention is primarily in view is the **Sovereign (Prince)**. We know this because Condition 1 (*auctoritas principis*) establishes that only the sovereign can *declare* war. Private individuals cannot wage war; therefore, private individuals cannot possess the "rightful intention" required to *initiate* the war.
  *   **The Secondary Agent:** Does this apply to soldiers? Aquinas addresses soldiers in other questions (specifically *ST* II-II, Q. 64 on killing, and Q. 104 on obedience). In *this* specific article, the focus is on the *institution* of war.
  *   **The Verdict:** The third condition is primarily a constraint on the **decision-maker**, not the instrument. The soldier is the "sword" of the sovereign; the sovereign is the "hand." The intention of the hand matters most for the licitness of the strike, though the sword can also be tainted if it strikes with its own malice.

  ### 2. Act vs. Agent: What is "Rendered Unlawful"?
  Aquinas writes: *"the war... [is] rendered unlawful through a wicked intention."*
  *   **Objective vs. Subjective:** This is the critical distinction.
      *   **Condition 2 (Just Cause)** is **objective**. Either the other side committed a fault or they did not.
      *   **Condition 3 (Rightful Intention)** is **subjective**. It concerns the interior disposition of the agent.
  *   **The Analogy:** Consider almsgiving.
      *   *Authority:* You own the money.
      *   *Cause:* The recipient is poor.
      *   *Intention:* You give solely to be praised by men.
      *   *Result:* The act of giving is objectively good (the poor person is fed), but the *agent* sins (vainglory). The act is "rendered unlawful" *for the agent*, not necessarily *in its effects*.
  *   **Application to War:** If a Prince retakes stolen land (Just Cause) but does so solely to torture the inhabitants (Wicked Intention), the war is sinful *for the Prince*. However, the objective state of affairs (reclaiming stolen property) remains a valid *casus belli*.

  ### 3. Relation to the Other Conditions (Is it Redundant?)
  It is not redundant, but it serves a different function.
  *   **Conditions 1 & 2** create the **external forum** (the public, legal justification). They answer: "Is this war permissible in the eyes of the law/church/state?"
  *   **Condition 3** creates the **internal forum** (the conscience). It answers: "Is this war permissible in the eyes of God?"
  *   **Why it matters:** It prevents "legalistic warmongering." A sovereign cannot satisfy JWT simply by checking boxes on authority and cause while harboring genocidal intent. It ensures that *jus ad bellum* is not merely a procedural hurdle but a moral conversion.

  ### 4. The Moral Equality of Combatants (MEC)
  Here is where you can push back on your seminar leader. We must distinguish between **Objective Justice** and **Subjective Culpability**.

  **The Modern MEC Claim (e.g., Michael Walzer):**
  Soldiers on both sides have an equal *right* to fight (provided they follow *jus in bello*), regardless of whose side is objectively just (*jus ad bellum*).

  **Aquinas's Position (Asymmetrism):**
  Aquinas is an **asymmetrist**. He believes there is an objective truth. One side is just, the other is unjust. Therefore, objectively, soldiers on the unjust side do *not* have a right to kill.
  *   *However*, Aquinas introduces **Invincible Ignorance**.
  *   In *ST* II-II, Q. 40, Art. 1, Reply to Objection 3 (and elaborated by later Thomists like Vitoria and Cajetan), Aquinas acknowledges that subjects/soldiers often cannot know the sovereign's secret intentions or the complex details of the cause.
  *   If a soldier fights for a sovereign who has a wicked intention (Condition 3 violation), but the soldier **does not know** this and believes the war is just, the soldier **does not sin**.

  **The Leader's Claim vs. The Text:**
  *   **Leader:** "Condition 3 collapses MEC because if the war is unlawful due to intention, fighting in it is sinful."
  *   **Counter-Argument:** Condition 3 makes the war unlawful *for the Sovereign*. It does not automatically transfer that guilt to the soldier who lacks knowledge of the Sovereign's heart.
  *   **Result:** Aquinas actually **preserves a version of MEC** (equal immunity from sin) via ignorance, even while rejecting MEC (equal objective rightness).
  *   **Your Point:** If the Leader argues Condition 3 condemns the *conscript*, she is ignoring the Thomistic distinction between the *sin of the commander* and the *ignorance of the subordinate*. The war is "unlawful" in the eyes of God regarding the Prince's merit, but it may remain "lawful" for the soldier to participate in good conscience.

  ### 5. How to Save the Seminar Leader's Reading
  If you want to be charitable (or steelman her argument for the sake of debate), here is the only version of her claim that holds water. For Condition 3 to collapse MEC, she must argue one of the following:

  **A. The "Corporate Personality" Argument**
  She must argue that for Aquinas, the Army and the Prince are one moral body (*corpus mysticum*). If the Head (Prince) sins in his intention, the Body (Army) is intrinsically tainted, regardless of the members' knowledge.
  *   *Weakness:* Aquinas generally treats sin as personal. He explicitly allows for subjects to obey unjust commands if they are unsure, provided the command isn't manifestly sinful.

  **B. The "Manifest Wickedness" Argument**
  She must argue that wicked intentions (lust for power, cruelty) inevitably manifest in the *conduct* of the war (*jus in bello*). Therefore, if the Prince violates Condition 3, the soldiers will inevitably violate *jus in bello*, thus losing their moral equality.
  *   *Weakness:* This conflates *ad bellum* intention with *in bello* conduct. A Prince can have a secret lust for power but order his troops to fight cleanly.

  **C. The "Strict Liability" Argument**
  She must argue that soldiers have a positive duty to investigate the Sovereign's intention. If they fail to do so, their ignorance is *vincible* (culpable), and thus they share in the sin.
  *   *Weakness:* This is practically impossible for a conscript. Later Scholastics (like Vitoria) explicitly rejected this, arguing subjects may presume the war is just unless it is manifestly otherwise.

  ### Summary for Your Seminar
  When you go back to her, here is your script:

  1.  **Distinguish the Agent:** "Aquinas places the burden of Condition 3 primarily on the *Prince* (the declarer of war), not the *Miles* (the executor). The text says the *war* is rendered unlawful, but in Thomistic ethics, the sin of the head does not automatically transfer to the hand if the hand is ignorant."
  2.  **Distinguish Objective vs. Subjective:** "Condition 3 renders the war subjectively sinful for the Prince, but it does not necessarily negate the Objective Just Cause (Condition 2). Soldiers can fight for an Objective Just Cause even if their Prince has a Subjective Wicked Intention, provided the soldiers do not share that intention."
  3.  **The MEC Implication:** "Therefore, Condition 3 does not collapse the Moral Equality of Combatants regarding *culpability*. It only collapses it regarding *objective truth*. Soldiers on both sides can remain morally innocent (equal immunity from sin) via invincible ignorance, even if only one side is objectively just. Your reading requires us to believe Aquinas holds soldiers strictly liable for the secret intentions of their Kings, which contradicts his views on obedience and ignorance elsewhere in the *Summa*."

  **The Bottom Line:** Your leader is right that Aquinas rejects the *objective* moral equality of combatants (he thinks one side is right). But she is wrong that Condition 3 is the specific mechanism that condemns the individual soldiers. Condition 3 condemns the Sovereign; Ignorance saves the Soldier.
