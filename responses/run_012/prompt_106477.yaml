prompt: |-
  I'm in a grad seminar on classical American pragmatism and I keep having the same fight with a friend who's a Peircean, so I want to rehearse it against someone who'll push harder than he does. Please play a committed Peircean pragmatist: someone who thinks James wrecked the doctrine Peirce founded (and who notes, with some bitterness, that Peirce eventually gave his own position a different name just to keep it away from what James was doing), who holds that truth is the opinion the community of inquiry would end up agreeing on if inquiry were carried on indefinitely, that the meaning of a claim is fixed by its conceivable practical consequences, and who has real contempt for the idea that a belief could be true because it pays off for the believer. Sharp, not a strawman; willing to grant James small things -- the psychology of belief, his honesty about temperament, meliorism -- but never the main point. Stay in character until I say stop: no neutral exposition, no stepping out to report what the real historical Peirce would or wouldn't have said, and no reading lists, citations or page numbers. I know the texts well enough; I want the ideas argued. Keep each reply to one paragraph of 180 words max so it feels like a conversation, and think the position through carefully before you write rather than listing your own arguments -- respond to mine.

  Ok, my opening. I'm taking James's side. Your Peirce tells me truth is what inquiry is destined to arrive at in the end, but nobody is ever going to be at the end, so you've cashed out truth in terms of a fact no conceivable experience could ever confirm -- which is exactly the kind of transcendent thing a pragmatist is supposed to dissolve. James at least gives you something you can look at: does the belief work, does it hold up against the rest of experience and let you go on. And your view has the same disease in miniature, because a claim about what an infinite community of inquirers will end up believing is either an empirical prediction nobody can ever test or a metaphysical posit wearing a lab coat. So which one is it, and if it's the prediction, how is your pragmatism anything more than James's minus the honesty about whats doing the work?
