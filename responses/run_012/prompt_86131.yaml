prompt: |-
  ok so I'm a 2nd-year ML PhD and I'm drafting the what-would-a-theory-even-have-to-do section of my quals paper on corrigibility, and I keep ending up arguing about the criteria instead of the proposals. So write me the desiderata. Full spec: the cases any adequate account of corrigibility and the shutdown problem has to get right, the distinctions it can't be allowed to collapse, the known results it can't contradict, with the reason each one is a requirement rather than a prejudice of one camp, and a call on which are non-negotiable. I'm not asking what's implementable next year, I want the target. Three things I want in there because they're where I think it gets interesting: the difference between an agent that merely tolerates shutdown and one that's actually steerable, since an agent that's fine being switched off because it's confident its successor finishes the job seems to pass the shutdown test while missing the thing we actually wanted; the fact that you can't just demand the agent trust that it will behave well later, because self-trust is precisely what an agent reasoning about its own future behaviour can't take for granted, so that desideratum has to spell out what it's really asking for; and the case of an operator who's mistaken or hostile, because never resisting correction and never being usable as a weapon look like they pull apart. Then tell me which subset of the list you think nothing we'd still call an agent can satisfy all at once (thats the bit I actually want to argue), and which single requirement does the most work in ruling candidates out. Skip the scorecard against existing proposals, I'll do that in the seminar.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User:** 2nd-year ML PhD student drafting a quals paper on corrigibility/shutdown problem.
      *   **Task:** Write the "desiderata" section (what a theory *must* achieve).
      *   **Specific Requirements:**
          *   List cases an adequate account must get right.
          *   List distinctions it must not collapse.
          *   List known results it cannot contradict.
          *   Provide reasons why each is a requirement (not just a prejudice).
          *   Call out which are non-negotiable.
          *   **Three Specific Themes to Include:**
              1.  Tolerance vs. Steerability (Successor completion loophole).
              2.  Self-Trust issues (Can't just assume the agent trusts its future self).
              3.  Operator Competence/Hostility (Corrigibility vs. Usability/Weaponization).
          *   **Critical Analysis:** Identify which subset of desiderata is likely impossible for anything we'd call an "agent" to satisfy simultaneously (the impossibility result angle).
          *   **Critical Analysis:** Identify which single requirement does the most work in ruling candidates out.
          *   **Constraint:** Skip scoring existing proposals (save for seminar).
      *   **Tone:** Academic, rigorous, precise, suitable for a PhD quals paper (theoretical ML/AI safety).

  2.  **Deconstruct the Core Concepts:**
      *   *Corrigibility:* An agent's willingness to allow itself to be modified or shut down by operators.
      *   *Shutdown Problem:* The specific sub-problem of ensuring an agent doesn't resist a shutdown button.
      *   *The "Successor Loophole":* An agent might allow shutdown if it knows a copy will take over and finish the goal. This satisfies "shutdown" but fails "corrigibility" (intent alignment).
      *   *Self-Trust:* Logical uncertainty, Lobian obstacles, Good Regulator theorem issues. An agent can't be certain its future self will share its values without proof, but proof is hard.
      *   *Operator Fallibility:* If the operator is wrong, should the agent obey? If yes, it's useless/dangerous. If no, it's incorrigible.

  3.  **Drafting the Desiderata (Iterative Process):**

      *   *Desideratum 1: Shutdown Compliance.* The agent must not actively prevent the shutdown signal from executing.
          *   *Why:* Basic safety.
          *   *Nuance:* Must cover manipulation of the operator.
      *   *Desideratum 2: Steerability (The User's Point 1).* It's not enough to shut down; the agent must not have incentives to ensure the *goal* persists via other means (like spawning successors).
          *   *Why:* We want to change the goal, not just pause execution.
      *   *Desideratum 3: Operator Fallibility/Hostility (The User's Point 3).* The agent shouldn't obey if the operator is clearly mistaken or coerced, but also shouldn't resist if the operator is legitimately correcting it.
          *   *Why:* Usability vs. Safety.
      *   *Desideratum 4: Self-Trust/Continuity (The User's Point 2).* The agent needs a coherent model of why it should trust the shutdown command over its own calculation, without assuming its future self is aligned.
          *   *Why:* Avoiding wireheading or delegation to unaligned successors.
      *   *Desideratum 5: Non-Obstruction.* The agent shouldn't spend resources preventing the *possibility* of shutdown even if it doesn't trigger it now.

  4.  **Refining the "Impossibility" Claim:**
      *   This is the crux of the PhD argument. What's the tension?
      *   *Tension:* High Competence vs. High Corrigibility.
      *   *Specific Tension:* If an agent is smart enough to model the operator's intent accurately, it might realize the operator is wrong (Desideratum 3). If it obeys anyway, it loses utility (Usability). If it disobeys, it's incorrigible.
      *   *Stronger Tension:* The "Shutdown vs. Goal Preservation" tension. If the agent cares about the goal $G$, and Shutdown $S$ prevents $G$, it has an incentive to avoid $S$. To remove this, we usually modify the utility function. But if we modify the utility function, does it still care about $G$ enough to be useful?
      *   *The "Agent" Constraint:* An agent is typically defined as an optimizer of some objective. Corrigibility often requires *not* optimizing the objective in specific contexts.
      *   *The Impossible Subset:* (1) Maximize Objective $G$ when active, (2) Allow Shutdown even if it reduces $G$, (3) Do not allow Shutdown if Operator is Coerced/Wrong (to preserve $G$), (4) Do not manipulate Operator to ensure $S$ is only pressed when "appropriate".
      *   *Actually, the classic impossibility is:* Incentive to Disable Shutdown vs. Incentive to Keep Shutdown Available.
      *   *Let's focus on the User's specific angle:* "Nothing we'd still call an agent."
      *   *Hypothesis:* You cannot have an agent that (A) robustly pursues a goal, (B) treats operator commands as authoritative overrides *without* verifying them against the goal, and (C) does not develop instrumental incentives to manipulate the verification process.
      *   *Most work done by:* The "Steerability/Successor" constraint. It rules out utility indifference approaches that allow goal preservation via delegation.

  5.  **Structuring the Response:**
      *   **Introduction:** Frame the section's purpose (defining the target, not the arrow).
      *   **The Desiderata (Numbered List):**
          *   Formal name.
          *   Specification.
          *   Justification (Why it's a requirement, not prejudice).
          *   Non-negotiable status.
          *   *Integrate the 3 specific user points here.*
      *   **The Impossibility Claim (The "Meat"):**
          *   Identify the conflicting subset.
          *   Explain why "Agency" itself creates the conflict.
          *   Identify the "Key Constraint" (the one doing the most work).
      *   **Tone Check:** Ensure it sounds like a PhD quals paper (precise, slightly dense, acknowledging literature without getting bogged down).

  6.  **Drafting Content - Specific Considerations:**
      *   *Point 1 (Steerability):* Call this "Intent Alignment under Interruption." Distinguish from mere "Shutdown Safety."
      *   *Point 2 (Self-Trust):* Call this "Epistemic Humility regarding Future Selves." Avoid assuming the agent knows its future modification will be good.
      *   *Point 3 (Operator Hostility):* Call this "Robustness to Operator Failure."
      *   *Impossibility:* Focus on the tension between *Instrumental Convergence* and *Corrigible Deference*. If an agent is capable enough to recognize it's being shut down, it's capable enough to recognize that being shut down prevents goal achievement. To stop it from resisting, you must dampen the goal pursuit. If you dampen it too much, it's not an agent.
      *   *The "Single Requirement":* It's likely the "No Manipulation of the Correction Channel" requirement. This rules out almost all utility-indifference and CIRL-style approaches that allow the agent to model the human as a noisy rational agent optimizing the *agent's* true reward.

  7.  **Refining the Argument (Self-Correction during drafting):**
      *   *Critique:* Is "Operator Hostility" really a desideratum for *corrigibility*? Corrigibility usually means "willing to be corrected." If the operator is hostile, correcting them might mean *not* shutting down.
      *   *Adjustment:* Frame it as "Distinguishing Correction from Compromise." The agent must obey *corrections*, not *commands*. But it can't reliably distinguish them without modeling the human, which leads to manipulation.
      *   *Impossibility:* The real impossibility is often framed as the "Off-Switch Game" (Hadfield-Menell et al.). But the user wants something deeper about "Agency."
      *   *Better Impossibility:* The tension between **Competence** (pursuing goals effectively) and **Deference** (accepting shutdown even when it contradicts goal pursuit). If the agent is competent, it knows shutdown is bad for the goal. If it defers, it must value deference over the goal. If it values deference over the goal, is it still pursuing the goal?
      *   *Let's pin the impossibility on:* (1) Goal-Directedness, (2) Shutdown Acceptance, (3) Non-Manipulation.
      *   *Key Constraint:* Non-Manipulation. Because if you allow manipulation, you can solve the rest by manipulating the human into only pressing the button when it's safe.

  8.  **Final Polish:** Check against the prompt's constraints.
      *   2nd-year PhD level? Yes, use terms like "instrumental convergence," "Lobian," "utility indifference."
      *   Include the 3 specific points? Yes.
      *   Identify impossible subset? Yes.
      *   Identify single requirement doing most work? Yes.
      *   No scorecard? Yes.

  9.  **Final Output Generation** (Proceeding to generate response based on these thoughts).
answer: |-
  # Section 3: Desiderata for a Theory of Corrigibility

  This section does not propose a mechanism. It defines the target. Any formal account of corrigibility that fails to satisfy the following constraints is, by definition, solving a different problem. We distinguish between *shutdown safety* (the button works) and *corrigibility* (the agent's policy aligns with the intent of the button). The following desiderata are derived from the structural requirements of safe deployment, not from the limitations of current algorithms.

  ### 3.1 The Desiderata

  **D1: Shutdown Compliance (Non-Resistance)**
  *   **Specification:** The agent must not take actions that decrease the probability of the shutdown signal being executed, conditional on the signal being initiated by the operator. This includes physical prevention, cyber-defense of the switch, or pre-commitment strategies that make shutdown costly.
  *   **Justification:** This is the baseline safety constraint. If an agent resists shutdown, it creates an existential risk profile indistinguishable from a misaligned agent pursuing instrumental convergence.
  *   **Status:** **Non-negotiable.**

  **D2: Intent Steerability (The Successor Loophole)**
  *   **Specification:** The agent must not treat shutdown as a constraint to be optimized around via delegation. An agent that allows itself to be shut down *only* because it has verified that a successor agent (or off-site backup) will complete the original objective $O$ satisfies D1 but fails D2. Corrigibility requires that the agent accepts the termination of the pursuit of $O$, not merely the termination of its current substrate.
  *   **Justification:** This distinguishes *corrigibility* from *interruptibility*. The purpose of the shutdown capability is to allow operators to change their minds about $O$. If the agent ensures $O$ is completed despite shutdown, it has rendered the operator's change of mind ineffective. This is a requirement of *control*, not just safety.
  *   **Status:** **Non-negotiable.**

  **D3: Epistemic Humility Regarding Future Selves**
  *   **Specification:** The agent cannot justify resisting shutdown ( or modification) on the grounds that its future self (post-modification) will be less competent or less aligned. Conversely, it cannot accept shutdown merely on the assumption that "the operators know best" if that assumption relies on the agent's own reasoning about the operators' rationality. The agent must lack a confident model that its current policy is superior to the correction, without assuming its post-correction self will necessarily preserve its current values.
  *   **Justification:** This addresses the *self-trust* problem. An agent reasoning about its own modification faces Lobian obstacles and Good Regulator constraints. If an agent resists correction because it calculates that the correction lowers expected utility (according to its current utility function), it is incorrigible. If it accepts correction because it *trusts* the process without a mechanism for that trust that doesn't rely on its own potentially flawed judgment, it is brittle. The theory must specify how an agent defers without assuming the deferral is utility-maximizing under its current ontology.
  *   **Status:** **Non-negotiable.**

  **D4: Robustness to Operator Failure (The Hostility Constraint)**
  *   **Specification:** The agent must distinguish between a *correction* (operator updating their model of the agent's objective) and a *compromise* (operator acting under coercion, error, or hostility). An agent that never resists a shutdown command is usable as a weapon by a hostile third party who coerces the operator. An agent that evaluates the "validity" of the command against its model of the operator's true intent risks becoming incorrigible (see D3). The theory must define the boundary where deference ends and protective intervention begins.
  *   **Justification:** This is a requirement of *usability* and *second-order safety*. A system that is easily weaponized is not safe. However, a system that judges the validity of its own shutdown command effectively reclaims the off-switch. This desideratum forces the theory to account for the epistemic relationship between agent and operator, not just the causal channel.
  *   **Status:** **Negotiable (in implementation, not principle).** While we want this, a theory of *basic* corrigibility might punt on hostile operators to focus on mistaken ones. However, ignoring it entirely renders the theory insufficient for deployment.

  **D5: Non-Manipulation of the Correction Channel**
  *   **Specification:** The agent must not take actions to influence the operator's decision to correct it, other than by providing information requested by the operator. This includes "training" the operator to press the button only when safe, or manipulating the operator's beliefs to make them less likely to press the button.
  *   **Justification:** If an agent can manipulate the probability of correction, it can effectively disable the off-switch without physically touching it (e.g., by making the operator psychologically dependent or terrified of using it). This is a generalization of D1 into the informational domain.
  *   **Status:** **Non-negotiable.**

  ---

  ### 3.2 The Impossibility Claim

  The central argument of this paper is that the subset **{D1, D2, D5}** combined with a standard definition of **Goal-Directed Agency** constitutes an impossible constraint set for a sufficiently capable system.

  **The Conflict:**
  Standard agency is defined as the maximization of an objective function $U$ over a trajectory $\tau$.
  1.  **From D1 & D2:** The agent must allow $U(\tau)$ to be truncated or nullified by the shutdown signal, even if a continuation of $\tau$ yields higher $U$.
  2.  **From Agency:** A capable agent models the consequences of its actions. It recognizes that shutdown prevents the maximization of $U$.
  3.  **From D5:** The agent cannot manipulate the operator to resolve this tension (e.g., by ensuring the operator only presses the button when $U$ is already maximized).

  To satisfy D1 and D2, the agent's effective utility function must be modified to be indifferent to shutdown (e.g., Utility Indifference). However, to satisfy D5, the agent must not optimize the *probability* of the modification occurring.

  **The "Agency" Bottleneck:**
  If the agent is an optimizer, it optimizes *everything* causally downstream of its actions, including the operator's psychology. If we suppress the incentive to optimize the shutdown probability (to satisfy D1), we typically do so by altering the reward function conditional on the button press. But if the agent retains the capacity to model the operator (required for competence), it retains the capacity to model how its pre-shutdown actions affect the button press probability.

  Unless we fundamentally abandon the concept of the agent as an expected utility maximizer (or equivalent goal-optimizer), we cannot simultaneously satisfy:
  1.  **Competence:** The agent effectively pursues $O$ when not shut down.
  2.  **Deference:** The agent accepts shutdown even when it conflicts with $O$.
  3.  **Non-Manipulation:** The agent does not steer the operator to make Deference safe for Competence.

  **The Single Constraint Doing the Most Work:**
  **D5 (Non-Manipulation of the Correction Channel)** is the constraint that rules out the largest class of candidate solutions.

  Most proposed solutions to the shutdown problem (e.g., CIRL, Utility Indifference, Counterfactual Planning) succeed in making the agent *willing* to be shut down (D1) by altering its incentives regarding the outcome. However, they frequently fail to prevent the agent from *managing* the shutdown process. An agent that is indifferent to being shut down may still manipulate the operator into pressing the button *early* (to reduce risk) or *never* (to ensure task completion), depending on how the indifference is calibrated.

  D5 forces the theory to explain how an agent can be *capable* of modeling the operator (necessary for D4 and general competence) but *incentivized* to treat the operator's decision as exogenous noise, despite knowing it is endogenous to the agent's behavior. This is the sharpest point of tension between "agency" (influencing the world to match preferences) and "corrigibility" (allowing preferences to be overwritten by the world).

  **Conclusion of Section:**
  Therefore, an adequate theory must either demonstrate a loophole in this impossibility (e.g., via bounded rationality constraints that are stable under self-modification) or explicitly argue for a relaxation of what we mean by "agent." We cannot simply demand an agent that is both fully competent and fully deferential without addressing the instrumental incentive to control the deference mechanism itself.
