  The second reading fits best. Smith's "dead weight" is an opportunity cost, not an absolute decline from the pre-discovery baseline. The discovery opened new vent for surplus produce, genuinely augmenting industry. However, the exclusive trade forces capital into a less productive channel than free trade would allow. It raises profits artificially in the mother country, drawing capital from nearer, potentially more frequent trades. Thus, Europe is richer than before 1492, but poorer than it would be under free trade with America.

  The harm is indeed unrealized gain rather than absolute loss. The monopoly is parasitic on the productive underlying trade; it skims efficiency by misallocating capital. Smith argues the monopoly benefits a few merchants while hurting the general industry. The "would otherwise rise to" counterfactual is doing the heavy lifting: he compares the current state not to isolation, but to a liberalized alternative.

  What tells against this? Smith occasionally suggests the monopoly might become so burdensome—with defense costs and capital distortion—that it yields no net benefit at all, or even a loss, for the mother country. He warns that if the monopoly prevents capital from flowing to more productive domestic industries, the "great spring" of industry could stagnate entirely. Yet, his primary critique remains that mercantilism sacrifices general opulence for specific profit, making the system less dynamic than nature intended.
