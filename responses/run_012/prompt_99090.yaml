      *   *Reading 1 (Net Negative):* Smith thinks the costs of defense/administration + monopoly distortion outweigh the gains of new markets. Colonization is a net loss.
      *   *Reading 2 (Net Positive but Suboptimal):* Discovery was good (absolute gain vs. status quo ante), but monopoly makes it less good than it could be (relative loss vs. free trade). The harm is unrealized potential.
      *   *Reading 3 (Distributional):* The monopoly benefits the mother country merchants at the expense of consumers and colonies, but the aggregate wealth still grows, just slower.

  4.  **Select the Best Reading:**
      *   Reading 2 is the standard Smithian view. Smith distinguishes between the *natural* benefits of exchange (discovery) and the *artificial* constraints (mercantilism). The "dead weight" is the distortion of capital away from its most productive natural use. The gain from discovery is real; the loss from monopoly is an opportunity cost.

