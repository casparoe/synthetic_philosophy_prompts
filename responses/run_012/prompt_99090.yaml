      *   Claim A: Discovery/colonization *itself* opened new markets and sources of supply, increasing the "mass of commodities" and thus enjoyments/industry.
      *   Claim B: The *exclusive trade* (mercantilist monopoly) distorts capital allocation. It forces capital into a less productive channel (longer roundabout trade) than would occur under free trade.
      *   Key Distinction: Trade/Discovery vs. Monopoly/Restriction.
      *   Counterfactual: "Below what they would otherwise rise to." This implies a comparison with free trade, not no trade.

