answer: |-
  This is a classic "applied metaphysics" bottleneck. You are stuck between the *Intentional Stance* (the colony acts like a thinker) and the *Phenomenal Stance* (the colony feels like something). Your committee cares about the latter (welfare/suffering), but they are being sold the former (cognitive agency) by the PIs.

  If you tell them "The colony is a mind," they will hear "Protect the colony." If you tell them "Only individuals are minds," they will hear "Protect the bees." The conflict arises because these two maps don't overlap. A colony can be a cognitive agent without being a phenomenal patient. A market is a cognitive agent (it processes information, solves allocation problems); it is not a phenomenal patient.

  Here is the brainstorming on the distinctions, followed by the procedure, the test cases, and the honest assessment of where this breaks.

  ### Part 1: Brainstorming the Criteria

  To build a tool for a vet, we need to strip the philosophy of its jargon but keep its structural integrity. We are looking for three specific boundaries:

  1.  **The Boundary of the System (The Part-Whole Problem):**
      *   *Philosophical Concept:* Real Patterns / Causal Integration.
      *   *Committee Translation:* Is this a "thing" or just a "pile"?
      *   *Filter:* Does the system regulate its internal state against the environment in a way the parts cannot do alone? (Homeostasis). If I remove a part, does the system die, or does it just get smaller? If I remove a part, does the *function* collapse?
      *   *Why:* We need to know if the protocol targets a *system* or just *aggregates*.

  2.  **The Boundary of the Mind (The Substrate Problem):**
      *   *Philosophical Concept:* Multiple Realizability vs. Neural Chauvinism.
      *   *Committee Translation:* Where does the "thinking" happen?
      *   *Filter:* Is information globally available within the system? (Can a signal from part A change the behavior of part B via the system's structure?)
      *   *Why:* This establishes if the "Aunt Hillary" claim is functionally true.

  3.  **The Boundary of Welfare (The Phenomenal Problem):**
      *   *Philosophical Concept:* Phenomenal Binding / Valence.
      *   *Committee Translation:* Where does the "hurt" happen?
      *   *Filter:* Is there a mechanism for negative valence (pain/stress avoidance) that is *unified*?
      *   *Crucial Distinction:* A system can solve a maze (Cognitive) without minding the maze (Phenomenal). ACCs regulate suffering, not intelligence.
      *   *Why:* This is where the "Aunt Hillary" analogy usually fails. Aunt Hillary might *think*, but does the colony *suffer*?

  ### Part 2: The Decision Procedure

  Give this to your chair. It is designed to force a distinction between **Cognitive Agency** (does it act?) and **Moral Patienthood** (does it feel?).

  **Protocol Review Decision Tree: Social Invertebrates & Aggregates**

  **Step 1: The Cohesion Test (Is it a System?)**
  *   **Question:** Does the candidate system maintain a stable internal environment (temperature, humidity, resource flow) that is distinct from the outside environment, regulated by the interaction of its parts?
  *   **Pass:** Yes (e.g., a hive thermoregulates; a slime mold coordinates flow).
  *   **Fail:** No (e.g., a loose aggregation of beetles in a jar).
  *   **Action:** If **Fail**, treat as individual organisms only. Stop. If **Pass**, proceed to Step 2.
  *   *Philosophical Load:* Establishes the system as a "Real Pattern" rather than a heuristic convenience.

  **Step 2: The Substrate Test (Where is the Nociception?)**
  *   **Question:** Do the *individual components* possess nervous systems or biological mechanisms capable of nociception (tissue damage detection) or stress response?
  *   **Pass:** Yes (e.g., ants, bees have neurons/nociceptors).
  *   **Fail:** No (e.g., slime mold, fungus, robots).
  *   **Action:** If **Fail**, the system is a **Cognitive Agent only**. It requires containment/safety review, but *not* welfare/ethics review. Stop. If **Pass**, proceed to Step 3.
  *   *Philosophical Load:* Acknowledges Multiple Realizability of cognition, but anchors Welfare to biological substrate.

  **Step 3: The Integrity Test (What is the Harm?)**
  *   **Question:** Does the proposed protocol damage the *integrative mechanisms* of the system (e.g., severing communication, removing the queen, preventing swarming) in a way that persists even if no individuals are killed?
  *   **Yes:** The protocol harms the **Colony as a Unit**.
  *   **No:** The protocol harms **Individuals only**.
  *   **Action:** If **Yes**, the PI must justify the *systemic disruption* as a welfare cost, distinct from individual mortality. If **No**, standard individual welfare protocols apply.
  *   *Philosophical Load:* This is the "Aunt Hillary" checkpoint. It admits the colony can be harmed *as a colony*, not just as a bag of parts.

  **Step 4: The Precautionary Override (The Value Judgment)**
  *   **Question:** If Step 3 is "Yes" (Colony Harm), is there scientific consensus on what constitutes "Colony Suffering" (e.g., collapse, chronic stress markers)?
  *   **Yes:** Apply specific mitigation.
  *   **No:** **Default to Individual Protection.**
  *   **Action:** Because we cannot measure "Colony Pain," we must assume the suffering resides in the individuals. The protocol must minimize individual distress even if the goal is colony-level manipulation.
  *   *Philosophical Load:* This is where the Chair votes. It admits epistemic humility. We don't know if superorganisms feel, so we protect the parts we *know* can feel.

  ---

  ### Part 3: Running the Cases

  Here is how this procedure outputs answers for your three protocols.

  #### Case 1: Lab Leafcutter Colony (Ants + Fungus Garden)
  *   **Step 1 (Cohesion):** **Pass.** The ants and fungus are obligate mutualists. The fungus cannot survive without ants; ants starve without fungus. They regulate humidity/temperature together. It is a functional system.
  *   **Step 2 (Substrate):** **Mixed.** Ants have neurons/nociceptors (Pass). Fungus does not (Fail).
  *   **Step 3 (Integrity):** **Yes.** If the protocol involves treating the fungus with a fungicide to test ant immune response, you are damaging the *colony's metabolic engine*.
  *   **Step 4 (Override):** **Default to Individuals.** We don't know if the "colony" suffers, but we know the ants starve or get sick if the fungus dies.
  *   **Verdict:** **Review as Individual Animal Protocol.**
  *   **Reasoning:** Even though the *mind* (if there is one) is distributed across ant and fungus, the *pain* is likely localized in the ants. The protocol is approved, but the "harm" calculation must include the starvation/stress of the ants resulting from fungus damage, not just the chemical exposure.
  *   **Philosophical Note:** This treats the fungus as *equipment* essential to the animal's welfare, similar to a dialysis machine for a human.

  #### Case 2: Honeybee Hive (Swarm Decision/Waggle Dance)
  *   **Step 1 (Cohesion):** **Pass.** High homeostasis, complex information flow (waggle dance), democratic decision-making on nest sites.
  *   **Step 2 (Substrate):** **Pass.** Bees have central nervous systems and nociceptors.
  *   **Step 3 (Integrity):** **Yes.** The protocol involves preventing swarming (colony fission) to keep the workforce in the lab. This blocks the colony's primary reproductive/decision-making event.
  *   **Step 4 (Override):** **Default to Individuals.**
  *   **Verdict:** **Modify Protocol.**
  *   **The Unpleasant Result:** Here is the part you might not like. The procedure forces the committee to acknowledge that **preventing the swarm is a welfare violation**, even if no bees are crushed.
      *   *Why:* Step 3 identifies that blocking swarming damages the *integrative mechanism* (the colony's life cycle). Step 4 says "We don't know if the colony feels frustrated, so assume the *bees* feel the stress of the blocked drive."
      *   *Consequence:* The PI cannot just say "No swarming for convenience." They must provide enrichment or allow fission, because the *individual bees* are likely experiencing stress from the suppression of the colony's functional goal. You are effectively regulating the *colony's life plan* to protect the *individual's welfare*.
      *   *Why you won't like it:* It validates the "Superorganism" model enough to burden the researcher, but not enough to grant the colony rights. It's a halfway house that creates maximum regulatory friction. It implies that *frustrated collective intent* translates to *individual suffering*, which is a contentious empirical claim.

  #### Case 3: Slime Mold (Physarum polycephalum) Navigating a Maze
  *   **Step 1 (Cohesion):** **Pass.** It solves mazes, optimizes networks, and maintains flow. It is a cognitive agent.
  *   **Step 2 (Substrate):** **Fail.** No neurons. No nociceptors. No biological mechanism for pain known to science.
  *   **Step 3 (Integrity):** N/A (Stops at Step 2).
  *   **Verdict:** **No Ethics Review Required.** (Safety/Containment review only).
  *   **Reasoning:** It passes the "Mind" test (Cognitive Agency) but fails the "Welfare" test (Phenomenal Patienthood).
  *   **Philosophical Note:** This is the hard functionalist line. If you disagree, you must argue that *goal frustration* in a non-neural system constitutes suffering. If you do that, you open the door to regulating plants or algorithms. The procedure forces you to draw the line at the substrate.

  ---

  ### Part 4: The Seams (Where this breaks)

  You asked for honesty about where the procedure misfires and where the absurdities hide.

  **1. The "Market/Committee" Absurdity**
  If you apply Step 1 (Cohesion) strictly, **this committee** passes. We regulate internal states (agenda), process information (votes), and maintain homeostasis (university policy). If a protocol prevents us from meeting, have we harmed the committee?
  *   *The Fix:* Step 2 (Substrate). We are not biological. But if a PI proposes a "Social Simulation" of agents that learns and adapts, Step 2 fails them (no biology), but Step 1 passes. You will have to explicitly rule that *Biological Substrate* is a necessary condition for Welfare, even if not for Cognition. You need to add a footnote to Step 2: *"Must be biological tissue."*

  **2. The "Colony Pain" Gap**
  In the Honeybee case, the procedure assumes that *Colony Disruption = Individual Stress*. This is an empirical gamble. It is possible that a bee in a swarm-blocked hive feels nothing different than a bee in a natural hive, and the "frustration" is purely at the system level (which might not feel).
  *   *The Risk:* By regulating to prevent colony disruption, you might be imposing costs on researchers to solve a metaphysical problem (does the superorganism feel?) with ethical money (individual welfare).
  *   *The Defense:* It is the Precautionary Principle. But you must admit to the Chair that this is a **Value Judgment**, not a fact.

  **3. The Extended Mind Trap (Leafcutter Fungus)**
  In Case 1, I treated the fungus as equipment. But if you are a functionalist, the fungus *is* part of the cognitive processing (memory/storage of the colony). If the protocol damages the fungus, it is a "lobotomy" of the colony.
  *   *The Seam:* The ACC has no jurisdiction over fungus. If the colony is the patient, and the fungus is part of the colony, you are reviewing a protocol that harms a non-regulated entity to assess harm to a regulated one.
  *   *The Fix:* Acknowledge that the *Animal* is the ant, but the *Environment* includes the fungus. Harm to fungus is harm to the animal's environment. Don't call the fungus a patient; call it essential habitat.

  ### Part 5: What the Chair is Actually Deciding

  You suspect half of this is the Chair's call. You are right. Here is exactly where the philosophy ends and the signature happens.

  At **Step 4 (The Precautionary Override)**, the committee faces an epistemic black box. We do not know if a colony feels.
  *   **Option A:** Assume "No." (Cartesian Beast). Risk: We torture a superorganism.
  *   **Option B:** Assume "Yes." (Panpsychist lean). Risk: We halt valuable research based on a metaphor.
  *   **Option C (The Procedure):** Assume "No" for the colony, but "Yes" for the individuals affected by the colony's disruption.

  **The Chair's Vote:** When she signs off, she is not deciding if the colony is a mind. She is deciding **how much uncertainty we can tolerate.**
  *   If she approves the Honeybee protocol without swarm mitigation, she is voting that *Individual Welfare* is the only currency that matters.
  *   If she demands swarm mitigation, she is voting that *Systemic Integrity* is a proxy for Individual Welfare.

  **Your Script for the Meeting:**
  "Colleagues, we cannot answer if the hive has a soul. But we can answer if the bees have nerves. This procedure asks: 1. Is it a system? 2. Do the parts feel? 3. Does breaking the system hurt the parts? If the answer to 3 is yes, we protect the parts, even if we don't understand the system. We are not regulating the 'Colony Mind.' We are regulating the *consequences* of the Colony Mind on the Individual Body."

  This gives them a rule, grounds it in the philosophy you know (without the jargon they don't), and protects you when the PI screams that you're treating a hive like a human. You aren't. You're treating the *bees* like bees that live in a very fragile house.
