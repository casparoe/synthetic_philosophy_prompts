answer: |-
  **DEPARTMENT OF HEDONIC COMPLIANCE**
  **Commonwealth of Aethel**

  **10 A.C. § 402**
  **RIN 0924-AA12**

  **Definition of Net Pleasure for Taxation and Compliance Purposes**

  **AGENCY:** Bureau of Hedonic Assessment (BHA).
  **ACTION:** Notice of Proposed Rulemaking; Extension of Comment Period.

  **SUMMARY:** The Bureau of Hedonic Assessment proposes to amend its regulations regarding the operational definition of "pleasure" pursuant to the Hedonic Revenue Act (HRA) and the Product Safety (Enjoyment) Order. The HRA imposes a levy on net pleasure accrued by residents and mandates safety standards for products marketed as pleasure-giving. Due to the heterogeneity of phenomenological reports, the Bureau is unable to finalize a unitary metric at this time.

  **DATES:** The comment period for the proposed rule published at 88 A.C. 1024 is extended indefinitely.

  **FOR FURTHER INFORMATION CONTACT:** Office of General Counsel, Bureau of Hedonic Assessment.

  **SUPPLEMENTARY INFORMATION:**

  **I. Statutory Authority and Problem Statement**
  Section 7 of the HRA requires the Bureau to assess tax liability based on "net pleasure," defined as total pleasure minus total pain. Section 12 prohibits the sale of unregistered pleasure-giving products. Inspectors require an operational definition to distinguish taxable enjoyment from non-taxable biological maintenance or neutral cognitive states. The Bureau evaluated four candidate definitions against statutory requirements for auditability and uniformity.

  **II. Evaluation of Candidate Definitions**

  *A. The Common Feeling Theory*
  The Bureau first considered defining pleasure as a distinct hedonic tone common to all instances. Field tests compared the taste of a ripe peach, the relief when a headache lifts, the satisfaction of scratching an itch, and the gloating associated with malice. Inspectors reported no consistent qualia across these categories. The feeling of hearing a suspended chord resolve differs phenomenologically from learning that a friend has done well. To maintain a common feeling definition, the Bureau would be required to gerrymander the list of taxable events to exclude instances where the tone differs, violating the statutory mandate to tax "all pleasure." Furthermore, auditors cannot verify internal tones without self-reporting, which is susceptible to fraud.

  *B. The Attitudinal Theory*
  Alternatively, pleasure may be defined as a pro-attitude toward a state of affairs (i.e., "taking pleasure in"). While this accommodates the heterogeneity of the peach, the itch, and the malice, it fails the auditability standard. Inspectors cannot distinguish "taking pleasure in" from "wanting" or "approving" except verbally. A taxpayer may claim approval of a friend's success without experiencing taxable pleasure, or experience pleasure in an argument won while denying approval of the sentiment. The lack of behavioral markers renders this definition unenforceable.

  *C. The Determinable Theory*
  Legal counsel reviewed the proposal that pleasure is a determinable whose unity consists solely in the determinable relation, or a mode of being conscious rather than a content. This was rejected as untestable. One cannot certify a determinable relation during a field audit. An inspector cannot measure a "mode of consciousness" with calibrated equipment.

  *D. The List Approach*
  Finally, the Bureau considered striking the word "pleasure" and regulating determinates one at a time (e.g., "Peach Consumption Tax," "Itch Relief Levy"). This was rejected because the HRA plainly assumes a single fungible commodity ("Net Pleasure") to be measured and taxed. Fragmenting the base would require new legislation.

  **III. Pilot Study Results**
  The Bureau conducted a pilot study using the Somatosensory Audit Tool (SAT-4), which purports to read pleasure off the subject directly via dermal conductivity and facial micro-expression analysis. The device was declined for regulatory use. While effective for acute sensory inputs (ripe peach), the SAT-4 failed to distinguish the relief of a headache lifting from the cessation of pain (zero value). It also registered false positives during malice, categorizing them as neutral stress responses. Consequently, the device cannot differentiate taxable pleasure from non-taxable relief or untaxable vindictiveness.

  **IV. Conclusion**
  Given the inability to isolate a unitary, auditable metric without violating statutory constraints, the Bureau maintains the status quo of enforcement discretion. The comment period is extended indefinitely to allow for further metaphysical clarification.

  **V. Dissenting Statements**

  *Commissioner Hardwick, Dissenting:*
  "I dissent. The inability to name a common core does not prove its absence. The statute assumes a single thing exists. To claim otherwise is to abdicate our duty. We must regulate the thing even if we cannot define it, trusting that inspectors know it when they see it."

  *Commissioner Null, Dissenting:*
  "I dissent on the grounds that the HRA rests on a category mistake. Pleasure is not a metric substance like grain or oil. It is a predicate, not an object. By attempting to define it operationally, the Bureau validates a logical error. The rule should not be delayed; it should be vacated."

  **Footnotes:**
  1. HRA § 7(b)(3) requires measurement to the nearest hedon.
  2. Malice remains a taxable event under interim guidance 2023-M.
  3. The SAT-4 is hereby classified as a prohibited calibration device.

  **Issued in Aethel City, this 14th day of October.**

  **Director, Bureau of Hedonic Assessment.**
