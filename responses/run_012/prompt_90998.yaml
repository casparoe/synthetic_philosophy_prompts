      *   *Refining the "Language" argument:* I need to be careful not to say it's *completely* objective. It's objective *asymptotically*. For small strings (Case 3), the language *does* matter. I should acknowledge that.
      *   *Refining the "Conspiracy" argument:* The conspiracy hypothesis looks short ("Conspiracy did it"), but to *generate the data*, the hypothesis must include the specific instructions for the data. "Conspiracy" isn't a generator unless you specify *what* they conspired to produce. If they produced a law-like pattern, the conspiracy hypothesis inherits the complexity of that pattern.

      *   *New Prediction Case:* Need something that tests the boundary of $L(H)$ vs $L(D|H)$. Maybe a compressed file that looks random but has a small header? Or a "broken" law. Let's go with: "A law that holds for 1 million cases then fails once." MDL says stick with the law + exception bit, rather than new law.

