answer: |-
  **Project Title:** Distinguishing Discovery from Coordination in Social Convergence

  **Statement of the Problem**
  When a crowd converges on a single choice—whether ordering the same dish, buying the same stock, or adopting a social norm—the outward appearance is identical: uniformity. However, the underlying mechanism driving this uniformity falls into two distinct categories that are frequently conflated.

  In the first case (**Discovery**), convergence reveals pre-existing quality. People copy others because they believe the crowd possesses information they lack (e.g., choosing a dentist with a long waiting list). The value is intrinsic; the crowd is merely signaling it.

  In the second case (**Coordination**), convergence creates value. The choice is only useful *because* others have made it (e.g., adopting a specific messaging app, tipping norms, or fashion trends). The value is extrinsic; the crowd is constructing it.

  Current models of social learning largely treat convergence as a process of guessing a pre-existing fact. They assume that if enough people agree, the "fact" is settled. This proposal argues that this framework fails when the "fact" is generated by the agreement itself. From the perspective of an individual deciding whether to join a crowd, confusing Coordination for Discovery leads to significant errors: joining a bubble believing it has intrinsic value, or avoiding a norm believing it is arbitrary when it is actually necessary for participation.

  **Research Question**
  When people converge on the same choice, what observable criteria distinguish whether the convergence is *tracking* a property (Discovery) or *creating* a property (Coordination)? Furthermore, does identifying this distinction alter the rational strategy for an individual deciding whether to join the crowd?

  **Why Existing Approaches Are Insufficient**
  Standard theories of informational cascades assume there is a "true state of the world" to be found. They model agents as trying to minimize error regarding an external reality. This works for questions like "Is this bridge safe?" but fails for questions like "Is this shirt stylish?" or "Is this protocol standard?"

  In coordination scenarios, there is no external truth to minimize error against; the utility function depends entirely on the actions of others. Yet, in practice, these two modes are mixed. A restaurant may be popular because the food is good (Discovery) *and* because it is the place everyone meets (Coordination). Existing literature lacks a diagnostic framework for disentangling these motives in real-time. There is no clean procedure for an outsider to observe a crowd and determine which mechanism is dominant. This project aims to build that procedure.

  **Methodology and Work Plan**
  This is a conceptual and analytical project requiring deep focus rather than laboratory resources. The work will proceed over six months.

  *   **Months 1–2: Case Collection and Classification**
      I will assemble a dataset of 30–40 historical and contemporary examples of social convergence. These will be categorized by initial hypothesis: pure discovery (e.g., scientific consensus), pure coordination (e.g., driving on the left vs. right), and mixed cases (e.g., financial bubbles, academic hiring trends). The goal is to identify edge cases where the classification is ambiguous.

  *   **Months 3–4: Constructing the Diagnostic Tool**
      Using the classified cases, I will derive a set of diagnostic indicators. These will function as a checklist or decision procedure. Potential indicators might include:
      *   *Reversibility:* If the crowd disperses, does the value remain?
      *   *Privacy:* Do people maintain the choice when unobserved?
      *   *Entry Cost:* Does the value increase or decrease as congestion rises?
      I will formalize these indicators into a coherent framework that allows an observer to score a given convergence event.

  *   **Months 5–6: Stress Testing and Final Output**
      The diagnostic tool will be applied back against the "hard cases" collected in Month 1 (e.g., fashions that carry real information, reputations that are pure coordination). I will refine the tool based on where it fails. The final output will be a monograph-length manuscript (approx. 30,000 words) detailing the framework, the case studies, and the implications for individual decision-making.

  **Scope and Budget**
  I am requesting funding to cover six months of living expenses and operational costs. This allows me to treat the research as a full-time undertaking without the need for supplementary income.

  *   **Time:** 6 Months full-time.
  *   **Budget Allocation:**
      *   Stipend/Living Costs: 85%
      *   Data Access/Travel (for case study verification): 10%
      *   Administrative/Overhead: 5%

  This scope is intentionally tight. I am not attempting to model the psychology of the crowd, but rather to build a functional taxonomy for the *observer*.

  **Risk and Failure Conditions**
  Intellectual honesty requires acknowledging that this distinction may not hold up under scrutiny. There are two specific ways this project could fail, both of which would be treated as valid results:

  1.  **Indistinguishability:** It may turn out that Discovery and Coordination are theoretically separable but observationally identical in all real-world cases. If the diagnostic tool yields no predictive power beyond random chance, I will document this impossibility result. Proving that the two cannot be distinguished is itself a valuable contribution to decision theory.
  2.  **Ubiquitous Mixing:** It may be that pure cases are rare toy examples, and all real-world convergence is a hybrid state. If the diagnostic tool forces a binary choice where none exists, I will pivot to modeling the *ratio* of coordination to discovery rather than the type.

  The grant will support the rigorous testing of the hypothesis, not just its confirmation. If the distinction collapses, the final manuscript will explain why, preventing future researchers from chasing a false dichotomy.

  **Conclusion**
  We live in an age of amplified social signals. Understanding whether a crowd is wise or merely self-reinforcing is not just an academic exercise; it is a practical necessity for navigating markets, careers, and social life. This project proposes a tool to tell the difference.
