prompt: |-
  Last night a friend and I spent a long time arguing about Hume's economics, and I came away unsure how much of his picture to trust. His summary was this: Hume held that money is merely a veil, so its quantity affects only nominal prices and never output or employment, even in the short run; that his attack on mercantilism amounts to the claim that a nation cannot hoard its way to wealth because trade is not a zero-sum contest for specie and any inflow of money will raise prices until the balance of trade corrects itself; and that Hume therefore would have rejected central-bank stimulus to reduce unemployment as conceptually confused, while also holding an unconditional free-trade position that would oppose even temporary tariffs or retaliatory measures. Please audit this summary. Which parts would a careful reader of Hume accept, which are common simplifications, and which are outright misrepresentations? I especially want the distinction between the long-run quantity theory and the short-run adjustment process, and between Hume's opposition to mercantilist policy and any blanket claim about monetary policy, kept straight, since I suspect my friend has collapsed them. Does his conclusion follow from the accurate parts of the summary, or does it depend on the errors?
reasoning: |-
  Here's a thinking process that leads to the audit of the friend's summary of Hume's economics:

  1.  **Deconstruct the Friend's Summary:**
      I need to break down the friend's claims into specific propositions to evaluate them individually against Hume's actual texts (primarily *Political Discourses*, specifically "Of Money," "Of Interest," and "Of the Balance of Trade").

      *   *Claim 1:* Money is merely a veil.
      *   *Claim 2:* Quantity of money affects only nominal prices, *never* output or employment, *even in the short run*.
      *   *Claim 3:* Attack on mercantilism = nation cannot hoard specie to wealth; trade is not zero-sum; inflow raises prices until balance corrects (Price-Specie-Flow Mechanism).
      *   *Claim 4:* Hume would reject central-bank stimulus to reduce unemployment as conceptually confused.
      *   *Claim 5:* Hume held an unconditional free-trade position (opposing even temporary tariffs/retaliation).

  2.  **Evaluate Claim 1 & 2: Money as a Veil & Neutrality (Short vs. Long Run)**
      *   *Standard Interpretation:* Hume is often cited as an early Quantity Theorist (money supply $\rightarrow$ prices).
      *   *Nuance:* Does Hume think money is *neutral* in the short run?
      *   *Textual Evidence:* In "Of Money," Hume explicitly discusses the interval between the increase in money and the rise in prices. He says this interval is crucial. During this time, industry is stimulated. "It is only in this interval or intermediate situation, between the acquisition of money and rise of prices, that the encreasing quantity of gold and silver is favourable to industry."
      *   *Verdict:* Claim 2 is a *major misrepresentation*. Hume explicitly argues that money is *not* neutral in the short run. It *does* affect output and employment during the adjustment period. Claim 1 is partially true (long run) but misleading if it implies immediate neutrality.

  3.  **Evaluate Claim 3: Mercantilism & Price-Specie-Flow**
      *   *Standard Interpretation:* Hume is the father of the Price-Specie-Flow Mechanism. He argued against hoarding specie.
      *   *Nuance:* Did he think trade was zero-sum? No, he argued against that. Did he think inflows raise prices? Yes. Does this correct the balance of trade? Yes.
      *   *Verdict:* This is the strongest part of the friend's summary. It accurately captures Hume's critique of mercantilist hoarding and the automatic adjustment mechanism.

  4.  **Evaluate Claim 4: Central-Bank Stimulus & Unemployment**
      *   *Inference:* If the friend thinks money is neutral in the short run (Claim 2), then stimulus is useless.
      *   *Hume's Actual View:* Since Hume believes money *can* stimulate industry in the short run (the "interval"), would he support stimulus?
      *   *Context:* Hume lived before central banks (Bank of England existed but wasn't a modern CB). He was generally wary of public credit and inflation. However, his theoretical mechanism allows for short-run real effects.
      *   *Verdict:* The friend's conclusion (reject stimulus) relies on the *error* in Claim 2. If Hume admits short-run non-neutrality, a modern Humean *might* see a case for stimulus, though Hume himself was skeptical of paper credit and debt. But to say he would reject it *because money is a veil* is theoretically inconsistent with his own short-run analysis. It depends on the error.

  5.  **Evaluate Claim 5: Unconditional Free Trade**
      *   *Standard Interpretation:* Hume is a classical liberal/free trader.
      *   *Nuance:* Did he oppose *all* tariffs? In "Of the Jealousy of Trade," he argues against the zero-sum mindset. However, in "Of the Balance of Trade," he acknowledges exceptions. He mentions that a magistrate might be justified in protecting a specific industry or using retaliation, though he prefers general liberty. He isn't a dogmatic laissez-faire absolutist in the modern libertarian sense; he's a pragmatic institutionalist.
      *   *Verdict:* "Unconditional" is too strong. Hume allowed for exceptions based on political necessity or specific developmental stages, though he strongly favored free trade generally. This is a simplification/overstatement.

  6.  **Synthesize the "Short-Run vs. Long-Run" Distinction (The Core Request)**
      *   This is the crux of the user's suspicion. The friend collapsed the long-run neutrality (Quantity Theory) with short-run non-neutrality (Monetary Injection Mechanism).
      *   I need to highlight the "Humean Lag." The increase in money circulates $\rightarrow$ prices don't rise immediately $\rightarrow$ producers see higher demand/prices $\rightarrow$ they hire more $\rightarrow$ output rises. Eventually, prices catch up, and real variables return to natural levels.
      *   The friend missed this entirely.

  7.  **Drafting the Audit:**
