answer: |-
  Your suspicion is well-founded. Your friend's summary captures the "textbook caricature" of Hume often taught in introductory macroeconomics, but it collapses critical nuances that Hume himself explicitly articulated. Specifically, your friend has conflated Hume's **long-run quantity theory** with his **short-run adjustment mechanism**, and has turned Hume's **pragmatic institutionalism** into **dogmatic laissez-faire**.

  Here is an audit of the summary, broken down by claim, followed by an analysis of whether the friend's conclusions hold up.

  ### 1. Claim: "Money is merely a veil... its quantity affects only nominal prices and never output or employment, even in the short run."
  **Verdict: Outright Misrepresentation.**

  This is the most significant error in your friend's summary. While Hume is indeed a progenitor of the Quantity Theory of Money (long-run neutrality), he explicitly rejected the idea that money is neutral *in the short run*.

  *   **The Text:** In his essay *Of Money* (1752), Hume writes: *"It is only in this interval or intermediate situation, between the acquisition of money and rise of prices, that the encreasing quantity of gold and silver is favourable to industry."*
  *   **The Mechanism:** Hume describes a lag. When new money enters the economy, it does not raise all prices instantly. It circulates through specific hands (merchants, manufacturers) first. These actors see higher demand and higher prices for their specific goods before the prices of their inputs or labor rise. This increases profit margins, incentivizing them to hire more workers and increase output.
  *   **The Correction:** A careful reader accepts that Hume believed money is a veil **in the long run** (once prices fully adjust), but **in the short run**, changes in the money supply have real effects on output and employment. Your friend's addition of "even in the short run" contradicts Hume's central insight into monetary dynamics.

  ### 2. Claim: "Attack on mercantilism... nation cannot hoard its way to wealth... inflow of money will raise prices until the balance of trade corrects itself."
  **Verdict: Accurate.**

  This is the strongest part of your friend's summary. It accurately reflects Hume's **Price-Specie-Flow Mechanism**.

  *   **The Logic:** Hume argued that if a nation tries to hoard gold (specie), the increased money supply will domestically raise prices. Higher domestic prices make exports less competitive and imports more attractive. Gold will then flow out to pay for the imports, restoring the balance.
  *   **Zero-Sum:** Hume famously attacked the "jealousy of trade" (the zero-sum view). In *Of the Jealousy of Trade*, he argues that the prosperity of neighbors is advantageous, not threatening, because it creates markets for your goods and stimulates emulation.
  *   **The Nuance:** While the mechanism is described accurately, Hume did not view this adjustment as instantaneous (linking back to Error #1). The "hoarding" might work temporarily during the adjustment interval, but it cannot be sustained as a permanent policy.

  ### 3. Claim: "Hume therefore would have rejected central-bank stimulus to reduce unemployment as conceptually confused."
  **Verdict: Depends on the Error.**

  This conclusion follows logically *only if* one accepts your friend's erroneous Claim #1 (that money never affects output).

  *   **Conceptual Confusion?** If Hume believed money affects output in the short run (which he did), he could not reject stimulus as *conceptually confused*. He would have to reject it on other grounds (e.g., institutional stability, the danger of paper credit, or long-run inflation).
  *   **Hume's Actual Stance:** Hume was deeply skeptical of paper credit and public debt, preferring specie. He feared that banking expansion would lead to destabilizing inflation and a loss of economic virtue. However, his *theoretical model* admits that an injection of money *can* reduce unemployment temporarily.
  *   **The Distinction:** A modern Humean might argue that while stimulus works in the short run, the lags are unpredictable and the long-run cost (inflation) outweighs the benefit. But to say Hume would view it as *impossible* for money to affect employment is to ignore his "interval" theory. Your friend's conclusion relies on the misrepresentation of Hume's short-run theory.

  ### 4. Claim: "Unconditional free-trade position that would oppose even temporary tariffs or retaliatory measures."
  **Verdict: Common Simplification / Overstatement.**

  Your friend portrays Hume as a modern libertarian absolutist. Hume was a pragmatic moderate.

  *   **General Principle:** Hume strongly favored free trade and argued that protectionism usually harms the protecting nation.
  *   **The Exception:** However, in *Of the Balance of Trade*, Hume allows for exceptions. He writes that a magistrate (government) might be justified in imposing tariffs to protect a specific infant industry or as a retaliatory measure to force another nation to lower its own barriers, provided it is done with caution.
  *   **Quote:** *"I shall add... that a magistrate... may be justified... in protecting the trade of his own people... [or] in laying a tax upon foreign commodities."*
  *   **The Correction:** Hume opposed the *systematic* mercantilist policy of hoarding specie and restricting trade as a zero-sum game. He did not oppose *all* tariffs under *all* circumstances. "Unconditional" is too strong.

  ### The Crucial Distinction: Long-Run vs. Short-Run

  Your friend has collapsed the **Quantity Theory** (Long-Run) with the **Monetary Transmission Mechanism** (Short-Run).

  | Feature | Friend's Summary (Classical/Ricardian View) | Hume's Actual Text (*Of Money*) |
  | :--- | :--- | :--- |
  | **Money Neutrality** | Immediate and absolute. | Long-run yes; Short-run no. |
  | **Output/Employment** | Unaffected by money supply. | Affected during the "interval" of adjustment. |
  | **Price Adjustment** | Instantaneous. | Gradual; ripples through sectors. |
  | **Policy Implication** | Monetary policy is useless for real variables. | Monetary policy *can* stimulate, but risks inflation later. |

  Later classical economists (like Ricardo) rigidified Hume's insights into the strict "Classical Dichotomy" your friend describes. Hume himself was more fluid, recognizing that the "veil" takes time to settle.

  ### Does the Friend's Conclusion Follow?

  **No.** The friend's policy conclusions depend heavily on the errors identified above.

  1.  **On Stimulus:** Because the friend believes Hume saw money as neutral in the short run, they conclude stimulus is "conceptually confused." Since Hume actually believed money *could* stimulate industry in the short run, a Humean objection to stimulus would have to be pragmatic (e.g., "it causes destabilizing inflation" or "it encourages debt"), not theoretical ("it cannot work").
  2.  **On Free Trade:** Because the friend believes Hume was an absolutist, they conclude he would oppose *any* tariff. Since Hume allowed for retaliatory or protective measures in specific contexts, a Humean could theoretically support temporary tariffs without betraying Hume's core principles.

  ### Summary Audit

  *   **Accept:** Hume's attack on mercantilist hoarding and the zero-sum view of trade; the long-run tendency of money supply to determine price levels.
  *   **Simplify:** Hume's free-trade stance (he was a pragmatist, not an absolutist).
  *   **Misrepresent:** The claim that money never affects output/employment in the short run. This is the critical failure of the summary.

  **Final Judgment:** Your friend has presented a **Ricardian interpretation of Hume**, not a Humean one. They have projected the rigid long-run neutrality of later classical economics back onto Hume, stripping away his most sophisticated insight regarding the short-run non-neutrality of money. Consequently, their policy conclusions are more dogmatic than Hume's own reasoning would support.
