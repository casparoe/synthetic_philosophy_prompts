answer: |-
  This is a classic philosophical dispute, and you have spotted the fault lines better than most undergraduates. Your advisor is channeling **John Searle** (specifically his 1969 work *Speech Acts*), who famously used the chess analogy to explain "constitutive rules." Searle argued that certain utterances don't describe the world; they change it, but only within a system of rules that make them possible.

  However, your advisor is making a leap from **ontology** (what a promise *is*) to **ethics** (how much a promise *matters*). That is where the analogy starts to bleed.

  Here is the audit you asked for.

  ### 1. The Mapping: Chess vs. Promising

  To see where the analogy works, we have to see how your advisor is mapping the terrain.

  | Chess Element | Promising Equivalent | Function |
  | :--- | :--- | :--- |
  | **The Board** | **Social Reality / Language** | The shared space where the activity takes place. Without it, the pieces are just wood/words. |
  | **The Pieces** | **Words / Utterances** | "I promise" is the pawn. Physical sounds that gain power only through the rules. |
  | **The Players** | **Promisor & Promisee** | Agents capable of understanding the rules and undertaking obligations. |
  | **The Rulebook** | **Constitutive Rules** | The conditions that make a promise a promise (sincerity, future action, obligation). |
  | **The Referee** | **Conscience / Community** | The mechanism that identifies rule violations (guilt, social ostracization). |
  | **The Clock** | **Time / Deadline** | The window in which the "move" (fulfillment) must be completed. |
  | **Winning** | **Trust / Coordination** | The goal of the game is not to defeat the other player, but to maintain the social bond. |
  | **Illegal Move** | **Broken Promise** | An action that violates the constitutive rules of the institution. |

  ### 2. Where the Analogy Breaks Down

  You identified four specific friction points. Here is how they dismantle the advisor's argument.

  #### A. The Referee and the Rulebook (Codification)
  *   **Your Point:** Chess rules are written and adjudicated by a ref; promising rules are fuzzy and unenforceable.
  *   **The Breakdown:** In chess, if you move a pawn backwards, the ref says, "That didn't happen." In promising, if you break a promise, we don't say "That didn't happen." We say, "You **betrayed** me."
  *   **Why it matters:** In chess, an illegal move is a *nullity*. In morality, a broken promise is a *residue*. It leaves a moral stain (guilt, resentment) that persists even after the "move" is recognized as invalid. The chess analogy suggests the act vanishes if it breaks the rules; reality suggests the act transforms into a wrong.

  #### B. Uptake (Acceptance)
  *   **Your Point:** In chess, my opponent doesn't get to vote on whether my pawn move counts. In promising, if the promisee doesn't accept it, did it happen?
  *   **The Breakdown:** This is a fatal flaw in the mapping. Chess is **monologic** (I make a move, it stands). Promising is **dialogic**. If I say "I promise to give you $5" and you say "I don't want your money," no obligation is created.
  *   **Why it matters:** This shows promising isn't just a move I make; it's a relationship I build. The "power" of the promise doesn't reside solely in the speaker (the player); it resides in the connection between them. Chess pieces don't have agency; promisees do.

  #### C. Debt vs. Illegal Move
  *   **Your Point:** Chess moves don't owe anybody anything. Broken promises leave a debt.
  *   **The Breakdown:** If I illegally move my knight, I reset the piece. I don't owe my opponent compensation. If I break a promise, I owe the promisee an apology, restitution, or at least an acknowledgment of harm.
  *   **Why it matters:** This attacks the advisor's "don't get worked up" conclusion. In chess, the stakes are internal to the game. In promising, the stakes are the **well-being of the other person**. A broken promise often causes real-world harm (financial loss, emotional distress) that exists *outside* the "game" of language.

  #### D. Insincerity vs. Authority (The Two Types of Bad Promises)
  *   **Your Point:** Does the chess picture handle lying about intent vs. lacking authority (selling a house you don't own) the same way?
  *   **The Breakdown:** Chess has "Illegal Moves" (moving a rook diagonally). It doesn't really have "Bluff Moves."
      *   **Lacking Authority:** This is like trying to set up a second board mid-game. It's a **void** promise. (Searle calls this a "misfire").
      *   **Insincerity:** This is like moving the pawn correctly but planning to move it back later. It's an **abuse** of the promise. (Searle calls this an "abuse").
  *   **Why it matters:** The chess analogy lumps these together as "rule violations." But morally, they feel different. A void promise is a mistake; an insincere promise is a lie. The chess analogy flattens the moral landscape.

  ### 3. Auditing the Conclusion: "So Don't Get Worked Up"

  Your advisor's conclusion is: *Because promising is a game constituted by rules, the stakes aren't real, and we shouldn't care if the rules are broken.*

  **This conclusion does not survive the audit.** It commits a category error known as the **Naturalistic Fallacy** (deriving an "ought" from an "is").

  *   **The Logic:** "Money is a social construct (like chess rules). Therefore, losing your money doesn't matter."
  *   **The Reality:** Just because something is constructed by rules doesn't mean the consequences aren't real. The rules of chess are arbitrary; the rules of social trust are **functional necessities**.
  *   **The Verdict:** The analogy explains *how* a promise is created (mechanism), but it cannot explain *why* a promise binds us (normativity). You can rewrite the rules of chess tomorrow and it changes nothing in the physical world. If you rewrite the rules of promising (i.e., decide promises don't create obligations), society collapses. The "game" of promising is one we cannot opt out of without ceasing to be social animals.

  Your advisor is confusing **ontological subjectivity** (promises exist because we agree they do) with **normative insignificance** (therefore they don't matter).

  ### 4. The Sister's Alternative: Contract Law

  Your sister suggests the **Contract Analogy** (Offer, Acceptance, Consideration, Breach, Damages).

  **Is it better?**
  *   **Pros:** It handles the **Debt** issue perfectly. Contracts acknowledge that a breach creates a liability (damages) that must be paid. It handles **Acceptance** (contracts require mutual assent). It handles **Authority** (you can't contract away rights you don't have).
  *   **Cons:** It is too cold. Contracts are external enforcement; promises are internal obligation. I keep a promise to my dying friend to water their plants not because I'll be sued, but because *I said I would*. The contract model misses the **virtue ethics** aspect (honor, integrity).

  **The Verdict on the Sister's Analogy:**
  It is a **better structural map**, but a **worse moral map**.
  *   Use the **Chess Analogy** to explain how the words *create* the obligation (the magic trick of language).
  *   Use the **Contract Analogy** to explain what happens when the obligation is *violated* (the debt/remedy).
  *   **Neither** supports your advisor's conclusion that you shouldn't care. In fact, both suggest the opposite: if the rules are the only thing holding the structure up, breaking them undermines the whole system.

  ### Final Summary for Your Club

  1.  **The Advisor is half-right:** He is right that promises are "constitutive rules" (Searle's insight). Without the social rulebook, "I promise" is just noise.
  2.  **The Advisor is half-wrong:** He is wrong that this makes promises trivial. The fact that money is a social construct doesn't mean poverty isn't real.
  3.  **The Analogy Fails:** Because chess is a closed system with no external consequences, while promising is an open system that governs real-world expectations and relationships.
  4.  **The Conclusion Fails:** The "game" of trust is the only game where quitting the game means you can no longer play with anyone else.

  **Your move:** Tell your advisor that while the chess analogy explains the *grammar* of promising, it fails to explain the *ethics*. A broken pawn move ruins a game; a broken promise ruins a relationship. The stakes aren't in the rules; they're in the people.
