answer: |-
  The arrangement presupposes a theory of dual legitimacy where the Crown provides the continuous legal personhood of the state while popular sovereignty provides the directive will, requiring the monarch to possess real but dormant legal authority that validates democratic governance without competing with it.

  Strictly speaking, the practice presupposes that the monarch holds independent *legal* authority, not merely the appearance of it, because the convention of acting on advice requires a legal power to be waived; if the monarch lacked the legal capacity to act independently, ministerial advice would be unnecessary rather than binding. However, it simultaneously presupposes that the monarch lacks independent *political* authority, meaning the legitimacy of specific state actions derives wholly from the elected branch, while the legitimacy of the state's continuity derives from the hereditary office. This distinguishes the strict presupposition—that the monarch is a legal agent bound by convention—from what merely fits well with the system, such as broad public support or historical narratives of divine right, which are culturally useful but legally irrelevant to the modern convention.

  Regarding popular sovereignty, the system presupposes its reality in decision-making but relies on its concealment in legal form. The convention of acting on ministerial advice transforms the monarch into a conduit for popular will, yet the requirement that the monarch formally assent to bills implies that popular sovereignty alone is insufficient to enact law without the Crown's constitutional validation. Therefore, the monarch is not a legal fiction, because a fiction cannot possess reserve powers; instead, the office is a dormant source of authority that becomes active only when the democratic process fails, implying that legitimacy attaches primarily to the elected branch during normal operation but reverts to the Crown as a guardian of the constitutional order during crises.

  The neutrality convention and the survival of reserve powers are consistent only if the reserve powers are interpreted negatively as emergency brakes rather than positively as steering mechanisms. Neutrality requires the monarch to refrain from influencing policy, while reserve powers allow intervention only to restore the conditions under which neutral, accountable government is possible, such as ensuring a government can command confidence or preventing illegal acts. This consistency rules out rival views such as pure republicanism, which denies the need for a non-partisan hereditary validator, and absolutism, which claims the monarch's will is supreme; it also rejects pure legal positivism that ignores convention, as the system relies on unwritten norms to reconcile the legal power of the monarch with the democratic power of the assembly. Ultimately, the theory holds that legitimacy is composite: the elected branch supplies the mandate to govern, while the Crown supplies the legal capacity to be governed, ensuring that state authority remains continuous even when democratic consent is fragmented or contested.
