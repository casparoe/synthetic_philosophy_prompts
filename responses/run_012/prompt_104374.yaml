answer: |-
  You are identifying a gap in standard Speech Act Theory. In the framework established by J.L. Austin and refined by John Searle, a performative utterance (like "I promise" or "I bet") is typically considered "felicitous"—meaning it successfully performs the act—only if certain conditions are met. One of the most common conditions is **uptake**: the hearer must understand and accept the act for it to land. A bet requires a taker; a promise requires a promisee.

  Your examples violate this condition. They are performatives that achieve their force without external validation. There isn't a single standard term for this in linguistics or philosophy, because traditional theory often categorizes these as "infelicitous" or merely "expressive of internal states" rather than true acts. However, there are several near-misses that almost capture it, each failing in a specific way.

  **The Near-Misses**

  1.  **Apostrophe:** This is the rhetorical term for addressing an absent or dead person (like the father at the grave). It captures the *form* of the address, but not the *function*. Apostrophe is a figure of speech; it doesn't claim that the act of forgiving actually happens. It treats the speech as decorative rather than operative.
  2.  **Soliloquy:** This captures the isolation (the man in the kitchen), but it is a dramatic convention, not a pragmatic one. A soliloquy describes *where* the speech happens (alone), not *what* the speech does. It implies revelation of thought, not necessarily the completion of an act.
  3.  **Expressives:** In Searle's taxonomy, "expressives" (thanking, apologizing, forgiving) describe the speaker's psychological state. Some philosophers argue expressives don't require uptake in the same way "directives" (ordering) do. However, standard theory still assumes a recipient whose state is being acknowledged. Your examples go further: the act is completed even if the recipient is ontologically incapable of acknowledgment.
  4.  **Private Speech:** Psychology uses this for self-regulation ("I need to focus"). But this is usually constative (describing a need) or regulatory, not performative in the sense of changing a status (like quitting or forgiving).

  **One Phenomenon or Three?**

  You are describing **one structural phenomenon** manifesting in **three functional varieties**.

  Structurally, all three examples share the same mechanic: the illocutionary force (the "doing") is generated entirely by the speaker's intent and utterance, without requiring a circuit completion through a listener. The circuit is closed within the speaker.

  Functionally, they differ:
  *   **The Grave (Forgiveness):** This is a *verdictive* or *expressive* act. It changes the speaker's relational status to the past.
  *   **The Kitchen (Quitting):** This is a *commissive* act. It commits the speaker to a future course of action.
  *   **The Letter (Anger):** This is an *expressive* act. It externalizes an internal state without transmitting it.

  They belong together because they all rely on **internal felicity conditions**. In a standard performative ("I pronounce you married"), the felicity depends on external authority and witnesses. In your examples, the felicity depends only on the speaker's sincerity and the act of utterance itself.

  **The Edges**

  You asked where the edges are. The boundary is defined by the **speaker's ontology of the listener**, not the objective reality.

  *   **Belief Matters:** If the man in the kitchen believes God is listening, even if God does not exist, the utterance is *not* what you are describing. It is a prayer (a transitive act directed at a perceived listener). It becomes your phenomenon only when the speaker knows or believes there is no one to receive it. The "void" must be acknowledged as a void.
  *   **Utterance Matters:** Thinking "I forgive you" is not enough. The act requires the physical commitment of speech or writing. The unsent letter works because it is written; the thought alone is just rumination. The medium must be capable of communication, even if communication is withheld.
  *   **External Consequences:** If the man in the kitchen says "I quit" but doesn't tell his boss, he hasn't legally quit. He has only *resigned internally*. Your phenomenon covers the internal status change, not necessarily the institutional one. If the act requires external validation to be true (like a legal verdict), it falls outside this class.

  **The Term**

  Since no existing term precisely captures a performative act that requires no object to receive it, I propose coining the term **Intransitive Performative**.

  This borrows from grammar, where an intransitive verb requires no direct object to complete its meaning (e.g., "I sleep" vs. "I hit the ball"). A standard performative is transitive: "I promise [you]," "I bet [you]." It needs an object to catch the action. An **Intransitive Performative** is an utterance that enacts its force without passing to an object. It completes its action within the subject.

  **Definition:** An **Intransitive Performative** is a speech act that achieves its illocutionary goal (forgiving, committing, releasing) solely through the speaker's utterance, without requiring a receptive interlocutor or external uptake to be felicitous.

  **In/Out Criteria:**
  *   **IN:** Forgiving a dead parent (no receiver possible); Vowing to oneself in an empty room (no receiver intended); Writing an unsent letter of resignation (receiver bypassed).
  *   **OUT:** Praying (receiver believed to exist); Diary entry that is just descriptive ("I am sad") vs. performative ("I release this sadness"); Legal statements requiring witnesses ("I pronounce you..."); Talking to oneself without intent to act ("Where are my keys?").

  This term gives you the precision to distinguish a sentence that *looks* like communication but functions as self-contained action.

  \answer{Intransitive Performative}
