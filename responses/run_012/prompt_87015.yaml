answer: |-
  1. **The Delegation Mechanism (The Lead Requirement)**
     The theory must explain *how* a human command becomes a material constraint without invoking magic. It must detail the process of delegation: how a legislator's intent, a planner's bias, or a corporation's profit motive is translated into concrete, code, or steel.
     *   **Why it knocks out candidates:** This eliminates naive instrumentalism (things are neutral tools) because it forces the theory to account for the *rigidity* of the tool. It also eliminates hard determinism (things drive history) because it requires a human origin point for the delegation.
     *   **For your characters:** The pro-infrastructure character argues the highway *is* the law, frozen in concrete. The skeptic argues it's just a record of a past decision, not a current actor. The theory must explain why the concrete keeps voting after the voters are dead.

  2. **The Moses Constraint (The Intent vs. Effect Case)**
     The theory must handle the Low Bridge case without relying solely on biographical intent. Since the historical record on Moses' racism is debated, a robust theory cannot rest entirely on "he meant to exclude." It must account for *structural exclusion* regardless of conscious malice.
     *   **The Deliverable:** It must distinguish between *embedded intent* (the designer wanted buses out) and *embedded logic* (the design requires private ownership to access).
     *   **For your characters:** One character says, "He built it to keep *them* out." The other says, "He built it for cars, and buses don't fit. The racism is in the poverty, not the arch." The theory must allow both to be partially right: the artifact enforces a class barrier regardless of the builder's heart.

  3. **The Reappropriation Constraint (The Plaza Case)**
     The theory must explain why artifacts sometimes fail to enforce their politics. A plaza built for crowd control (smooth surfaces, no ledges, sprinklers) becomes a protest hub because protesters bring water and sit on the ground.
     *   **The Deliverable:** It must accommodate *interpretive flexibility*. The artifact proposes a script (move through, don't stop), but users can rewrite it.
     *   **For your characters:** The optimist says, "We took their space and made it ours." The pessimist says, "You're only allowed to protest here because it keeps you away from the bank across the street." The theory must explain who wins when the script clashes with the use.

  4. **The Normativity Gap (Effects vs. Politics)**
     The theory must distinguish between having *consequences* and having *politics*. A storm has effects; a storm does not have politics. A levee that protects the rich neighborhood and floods the poor one has politics.
     *   **The Deliverable:** It must define the threshold where a physical effect becomes a power relation. It requires a model of distribution: who gets benefit, who gets burden, who gets voice.
     *   **For your characters:** When the policing app moves patrol cars, is that just logistics (effects) or is it profiling (politics)? The theory demands they argue about the *distribution* of safety, not just the algorithm's efficiency.

  5. **The Responsibility Anchor (Consistency Requirement)**
     The theory must remain consistent with human moral accountability. If artifacts have politics, humans cannot be absolved of responsibility for the artifacts.
     *   **The Deliverable:** It must locate the "off switch." If the app is racist, who is liable? The coder? The chief who bought it? The city council that defunded training?
     *   **For your characters:** The bureaucrat says, "The app decides, I just follow." The activist says, "The app is a shield for you." The theory must prevent the artifact from becoming a scapegoat that exonerates the operator.

  6. **The Incompatibility Clause (What You Can't Have)**
     You cannot maximize **Artifact Agency** and **Human Responsibility** simultaneously.
     *   **The Trade-off:** If you argue the highway *itself* is racist (strong agency), you weaken the claim that the current mayor is racist (human responsibility). If you argue the mayor is fully responsible (strong agency), the highway becomes a neutral tool.
     *   **For your characters:** This is the core tension. One character must argue that the infrastructure is so entrenched it acts independently (requiring revolution to change). The other must argue that people are still in charge (requiring reform to change). A theory that claims both equally is lying. Your characters should fight over where the buck stops.

  7. **The Temporal Lock (Consistency Requirement)**
     The theory must account for time. Infrastructure politics often outlive the regime that built them.
     *   **The Deliverable:** It must explain *durability*. Why does the 1960s highway still dictate 2020s segregation?
     *   **For your characters:** The older character sees the highway as a historical wound that won't heal. The younger character sees it as a current policy choice being renewed every day by maintenance budgets. The theory must allow for both "legacy" and "renewal."

  8. **The Scale Match (Distinction Requirement)**
     The theory must distinguish between *micro-politics* (benches preventing sleep) and *macro-politics* (highways segregating cities).
     *   **The Deliverable:** It must not collapse the distinction between nuisance and structural violence.
     *   **For your characters:** Don't let them equate the bus route change with the highway construction unless the theory can justify why they are the same kind of power. One is an inconvenience; the other is a destiny. The theory must specify if they are on a spectrum or different categories entirely.
