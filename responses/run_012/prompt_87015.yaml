  7.  **Finalizing the Text:** (Self-Correction during drafting)
      *   *Correction:* Make sure I don't just summarize Winner. The user wants a *spec for a theory*, i.e., "If you want to claim X, your theory must deliver Y."
      *   *Correction:* Ensure the "Moses" example is treated with the nuance the user requested (history is messier than the story).
      *   *Correction:* The "Incompatibility" section needs to be clear about which tensions are irreconcilable.

      *   *Lead Requirement:* **The Translation Mechanism.** How does a value become a bolt? This is the hardest thing to explain.
      *   *Case Requirement:* **The Moses Constraint.** Must explain exclusion without relying solely on disputed biographical intent.
      *   *Case Requirement:* **The Reappropriation Constraint.** Must explain why the plaza works for protesters despite being built for control.
      *   *Distinction Requirement:* **The Normativity Gap.** Effects aren't politics. Politics requires a distribution of power/benefit.
      *   *Consistency Requirement:* **The Responsibility Anchor.** Humans must remain accountable somewhere.
      *   *Incompatibility:* **Agency vs. Accountability.**

