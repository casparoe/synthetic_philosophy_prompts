          *   Include distinctions (design vs. use, intended vs. unintended, effects vs. politics).
          *   Include consistency requirements.
          *   Say which requirements can't all be met at once.
          *   Tone: Direct, analytical, useful for fiction writing (character arguments).

  2.  **Identify the Core Philosophical Discourse:**
      *   The prompt is clearly referencing the "Politics of Artifacts" debate, most famously associated with Langdon Winner's "Do Artifacts Have Politics?" (1980).
      *   Key examples mentioned: Robert Moses' low bridges (Long Island), benches with armrests (anti-homeless), plazas (crowd control vs. protest).
      *   The core tension: Technological determinism vs. Social constructivism vs. Critical Theory of Technology.
      *   The user wants a *spec* for a theory, not just a summary. They want to know what makes such a theory *good* or *defensible* so their characters can argue from solid ground.

  3.  **Drafting the Requirements List:**

      *   *Requirement 1 (The Lead):* The Causality/Agency Requirement. This is the biggest hurdle. If artifacts have politics, do they *act*? Or do they *channel* action? This knocks out simple determinism and simple instrumentalism. It needs to explain *how* a thing exerts power without a mind.
      *   *Requirement 2 (The Cases):* Must account for the "Moses Bridges" (intended exclusion), "Hostile Architecture" (benches), and "Unexpected Consequences" (plazas). A good theory must distinguish between embedded intent and emergent effect.
      *   *Requirement 3 (The Distinctions):* Design vs. Use (interpretive flexibility). Intended vs. Unintended. Effects vs. Politics (everything has effects, not everything has *politics*).
      *   *Requirement 4 (Consistency):* Must align with how power actually works (structural vs. individual).
      *   *Requirement 5 (The Trade-off):* Acknowledge incompatibilities. You can't have strong agency for artifacts *and* maintain human moral responsibility easily.

  4.  **Refining the Content (Iterative Process):**

      *   *Lead Requirement:* "The Delegation Mechanism." How does human politics become thing politics? It's not magic; it's delegation. The theory must explain the translation of command into material constraint. This knocks out "things are neutral" and "things are demons."
      *   *Case Requirements:*
          *   Moses Bridges: Needs to handle *intent* vs. *historical accuracy* (since the user knows the history is messy). The theory must work even if the intent is disputed (structural effect remains).
          *   Benches: Needs to handle *micro-politics* (exclusion of bodies).
          *   Plazas: Needs to handle *reappropriation* (users flipping the script).
      *   *Distinction Requirements:*
          *   Effects vs. Politics: A hammer hits a thumb (effect); a hammer designed to break strike lines (politics).
          *   Design vs. Use: The app decides patrol cars (design), but cops ignore it (use).
      *   *Consistency Requirements:*
          *   Moral Responsibility: If the app is racist, who goes to jail? The theory can't absolve humans entirely.
          *   Changeability: If artifacts have politics, can they be changed without revolution?
      *   *Incompatibility:* You cannot maximize *Artifact Agency* and *Human Responsibility* simultaneously. You have to choose where the buck stops.

  5.  **Polishing for the User's Context (Novelist):**
      *   Use language that helps dialogue. "Delegation," "Script," "Affordance."
      *   Keep it punchy. No academic fluff.
      *   Ensure the "Rust Belt" vibe is respected (infrastructure as destiny).

  6.  **Final Review against Constraints:**
