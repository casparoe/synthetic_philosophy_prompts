answer: |-
  ### Sequencing Decision: Cold Attempt Before Framing

  **Order:** You must begin with the **Cold Attempt**. Do not frame the activity as a logic puzzle, do not mention Bongard, and do not define "rule" or "invariant" until after they have struggled.

  **Dependency:** The entire session rests on the audience experiencing the temptation to *overfit* before they experience the relief of *generalizing*. If you frame the task first ("Find the logical rule"), they will adopt a hypothesis-testing mindset immediately. If you show the data first ("What is the difference?"), they will adopt a pattern-matching mindset. The latter mirrors the large model's pre-training state. You need them to feel the seduction of a rule that works for the training set (the 12 images) but fails the concept.

  **Cost:** The cost of the Cold Attempt is ten minutes of potential silence or wrong answers. You must budget for this silence. Do not fill it. Let the discomfort of "not knowing the rule" sit in the room. That discomfort is the analog for the model's loss function. If you frame first, you remove the discomfort, and with it, the lesson.

  ### Ruling on the Carrying Example

  **Verdict:** **Do not use the Symmetry example.**

  **Reasoning:** Symmetry is a perceptual property, not a relational concept. For an audience with high-school math, "symmetry" triggers a geometric verification mode ("Where is the axis?") rather than a conceptual abstraction mode. It is too easy to see holistically, which bypasses the "fitting" struggle. Furthermore, it is difficult to construct a convincing *distractor invariant* (a second rule that fits the 12 but is wrong) with symmetry without the drawings looking contrived.

  **Replacement:** Use a **Containment** problem.
  *   **Left Set (1–6):** A small shape strictly *inside* a larger shape.
  *   **Right Set (7–12):** A small shape strictly *outside* (adjacent to) a larger shape.
  *   **The Distractor:** Draw all Left Set figures with **filled/shaded** interiors. Draw all Right Set figures with **empty/white** interiors.

  **Why this carries the session:** It separates the *concept* (topology: inside/outside) from the *feature* (visual texture: shaded/white). A model (or a tired human) can fit the training set perfectly using the shading feature. It fails the concept test.

  **Criteria for a Carrying Example:**
  *   **Must Have:** A "distractor invariant" that is visually salient and perfectly correlates with the split in the training set (the 12) but is not the governing rule.
  *   **Must Have:** A "test case" (Image 13) that obeys the governing rule but violates the distractor invariant.
  *   **Must Lack:** Counting cues (e.g., ensure the number of vertices varies randomly across both sets).
  *   **Must Lack:** Technical vocabulary requirements (the solution must be statable as "Inside" vs. "Outside," not "Topologically enclosed").

  ### Session Sequence and Misconception Management

  **Phase 1: The Data Dump (0–10 mins)**
  *   **Action:** Project the 12 Containment figures (with the shading distractor). Say nothing but: "Left side versus Right side. What is the difference?"
  *   **Misconception:** "I need to find the *right* answer immediately."
  *   **Intervention:** When someone guesses "Left is shaded, Right is white," **validate it.** Say, "That fits all twelve. Write that down." Do not confirm it is the *rule*. You are building the trap.

  **Phase 2: The Overfit (10–20 mins)**
  *   **Action:** Ask for other rules. If no one offers "Inside/Outside," prompt: "Does position matter?" Guide them to the topological rule.
  *   **Misconception:** "If a rule fits the data, it is the truth."
  *   **Intervention:** Explicitly name the two competing rules on the whiteboard: 1. Shading. 2. Containment. State: "Both are true for these twelve." This is the crux of your article. The model sees both; which one does it grasp?

  **Phase 3: The Concept Test (20–30 mins)**
  *   **Action:** Reveal Image 13. It is a **White** small shape **Inside** a large shape.
  *   **Question:** "Does Image 13 belong on the Left or the Right?"
  *   **Dependency:** This depends on Phase 2. If they didn't identify the two competing rules, this test means nothing.
  *   **Resolution:** If they chose "Left" (Containment), they grasped the concept. If they chose "Right" (Shading), they fitted the examples. Reveal the answer is Left. Explain that "Shading" was the overfit; "Containment" was the concept.

  **Phase 4: The Arbitrary Split (30–40 mins)**
  *   **Action:** Show a new slide with 12 random shapes. Tell them: "For this set, I flipped a coin to assign Left or Right. There is no rule."
  *   **Goal:** Distinguish "Problem with an Invariant" vs. "Arbitrary Split."
  *   **Misconception:** "There is always a pattern if I look hard enough." (Apophenia).
  *   **Intervention:** Ask them to spend two minutes finding the rule. When they fail, state: "Sometimes the split is noise." This prevents them from treating your main example as magic; it was a signal in noise, not just a puzzle.
  *   **Ordering Risk:** Do not do this *before* Phase 3. If they experience the Arbitrary Split first, they will approach the Containment problem with cynicism ("There might not be a rule"), which kills the "Concept vs. Fit" tension. They must believe in the rule before they learn that rules can be fake.

  **Phase 5: The Final Check (40–50 mins)**
  *   **Action:** Hand out a slip of paper with two new figures (Image 14 and 15). One is *Inside* (White), one is *Outside* (Shaded). Ask them to label L/R and write *why* in one sentence.
  *   **Passing Answer:** "Left, because the small shape is inside the large one." (Cites the invariant).
  *   **Failing Answer:** "Left, because it looks like the first group." (Cites resemblance/fit).
  *   **Why this works:** It forces verbalization of the invariant. If they cannot name the invariant, they haven't grasped the concept; they have only recognized the pattern.

  ### Exclusions: What Not to Go Into

  Given the audience and the 50-minute limit, you must openly declare three off-limit topics at the start of Phase 2:
  1.  **Neural Architecture:** Do not explain *how* a model weights pixels. It distracts from the logical distinction between fit and grasp.
  2.  **Formal Logic:** Do not use set notation or boolean logic. Keep it linguistic ("Inside," "Shaded").
  3.  **Bongard History:** Do not discuss Mikhail Bongard or the 1960s context. It is irrelevant to the cognitive lesson.

  ### One-line summary:
  One-line summary: Start with the raw data to induce the temptation to overfit, then introduce the test case that breaks the fit but preserves the concept.
