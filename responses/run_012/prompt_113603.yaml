      *   **A (Legislative Term Limits):** 3 terms lifetime.
          *   *Idea:* Prevent careerism, entrenched interests, detachment from citizens.
          *   *Rival:* Experience matters, accountability via re-election.
          *   *Presupposition:* Tenure corrupts representation; rotation is necessary for democratic health.

      *   **B (Cabinet/Upper House Unlimited):** PM pleasure, indefinite, ex-legislators routine.
          *   *Idea:* Executive needs expertise/stability. Reward for legislative service.
          *   *Tension:* Why limit lower house if upper house/cabinet can be careerists?
          *   *Presupposition:* Executive function requires different qualities (skill/loyalty) than legislative function (representation). Or: The Lower House is the "people's" house, the rest is the "governing" class.

      *   **C (Citizens' Review Panel):** Sortition, 120 people, 9 months, paid, one-time, exclusion of political professionals, mandatory vote (no amendment).
          *   *Idea:* Descriptive representation, break party discipline, fresh perspective.
          *   *Tension:* Why exclude pros? (Purity vs. Competence). Why mandatory vote? (Veto power vs. Advisory).
          *   *Presupposition:* Ordinary citizens possess a specific judgment capacity that professionals lack, provided they are insulated from career incentives.

      *   **D (Judges):** Until 70, removal only for misconduct.
          *   *Idea:* Independence, rule of law, insulation from politics.
          *   *Presupposition:* Justice requires insulation from popular will and electoral cycles.

      *   **E (Central Bank):** 8 years, renewable once, explicit insulation goal.
          *   *Idea:* Technical competence, long-term stability over short-term populism.
          *   *Presupposition:* Certain policy areas are too technical/temporal for electoral logic.

      *   **F (Post-Panel Bar):** Panel members barred from office for 5 years.
          *   *Idea:* Prevent using panel as stepping stone. Ensure motives are civic, not careerist.
