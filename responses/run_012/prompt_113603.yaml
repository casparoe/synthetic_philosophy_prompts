prompt: |-
  You are a political philosopher working on democratic theory, representation, and institutional design, with a working knowledge of selection by lot, the history of the argument for rotation in office, and the empirical literature on legislative professionalization. I need a careful reconstruction of an institution's implicit theory, not a survey: do not cite, name, or recommend any works, and do not give me a reading list. Think the case through at length before you commit to anything, and resist the temptation to attribute to the institution whatever theory would make it look tidy. Wherever you find yourself reaching for an empirical premise about how people in such bodies actually behave, flag it rather than assume it.

  I am coding cases for a comparative database of constitutional designs, so I need the answer as a single JSON object in a fixed schema, given at the end.

  The case. A parliamentary democracy has the following six provisions in its constitution and standing orders:

  A. Members of the lower house are limited to three terms, lifetime; having completed a third term, a member may not stand again for that house.
  B. There is no limit on service in the cabinet or in the appointed upper house. Ministers and appointees hold office at the prime minister's pleasure, may serve indefinitely, and former lower-house members are routinely appointed to both.
  C. A Citizens' Review Panel of 120 people is drawn by stratified lot from the electoral roll for a single nine-month term. Service is paid, and no one may serve twice in a lifetime. Anyone employed in politics, government, or lobbying during the previous five years is excluded from the pool. The Panel's recommendations go to the lower house, which must vote them up or down without amendment and without committee stage.
  D. Judges hold office until seventy and may be removed only for misconduct.
  E. The central bank's governors serve eight-year terms, renewable once; the statute states that the length of the term is meant to insulate them from electoral pressure.
  F. A person who has served on the Citizens' Review Panel may not seek or hold elected office for five years afterwards.

  What puzzles me is this. We cap legislative service on the ground that long tenure in office is corrupting or insulating, and then we prize long, secure tenure as the condition of trustworthy judgment in judges and central bankers. We select the Panel by lot precisely because we want people who owe nothing and have nothing to gain, and then we bar them from carrying what they learned into ordinary politics — and exclude anyone with political experience from the pool in the first place, as though knowing how the system works were a contaminant rather than a qualification. Meanwhile the reward for a decade in the chamber is an unlimited appointment to the cabinet.

  Reconstruct the theory. I want:

  1. For each provision A–F, the view it strictly presupposes — the view under which the provision is more than pointless — as distinguished from views it merely fits comfortably with. Generate several candidate readings of each provision before settling on one.
  2. The rival views each provision quietly rules out, and how firmly.
  3. Whether the six provisions presuppose consistent things. Where two pull in opposite directions, say whether a reconciliation is available and what it costs.
  4. Where the bundle is philosophically underdetermined: the questions it does not settle, and which competing views are all compatible with it.
  5. What would have to change if the central commitment you identify were replaced by (a) a purely competence-based account of legitimate authority, (b) a purely consent or authorization-based account, or (c) a purely descriptive-representation account. For each, name the provisions that must change and the new problems the replacement creates.
  6. The empirical claims your reconstruction leans on, and which way your conclusions would move if those claims turned out false.

  Output. Return one JSON object and nothing else, using exactly the keys below, in this order, with the nested field names as given and no additions:

  - "case_summary": string, at most 100 words, a neutral restatement of the six provisions.
  - "rule_analysis": array of six objects, one per provision, each with "rule_id" (one of "A" through "F"), "provision" (one-sentence restatement), "candidate_readings" (array of strings, the readings you considered), "commitment_presupposed" (string), "strength" (one of "strict", "fits_well", "neither"), "why" (string, at most 80 words).
  - "core_commitments": array of objects, each with "commitment" (string), "in_plain_language" (string), "required_by" (array of rule_ids), "what_would_be_incoherent_without_it" (string), "confidence" (one of "high", "medium", "low").
  - "excluded_rival_views": array of objects, each with "view" (string), "ruled_out_by" (array of rule_ids), "strength" (one of "rules_out", "makes_awkward", "leaves_open"), "how" (string, at most 60 words).
  - "tensions": array of objects, each with "tension" (string), "rules_involved" (array of rule_ids), "reconciliation_available" (boolean), "reconciliation" (string or null), "residual_cost_if_reconciled" (string or null), "genuine_conflict" (boolean).
  - "underdetermined_questions": array of objects, each with "question" (string), "views_all_compatible" (array of strings), "what_would_settle_it" (string).
  - "load_bearing_commitment": string, the single commitment doing the most work in the bundle.
  - "revised_bundles": array of three objects, one per replacement in item 5, each with "replacement_view" (string), "provisions_that_must_change" (array of rule_ids), "replacement_provisions" (array of strings), "new_problems_introduced" (array of strings).
  - "empirical_dependencies": array of objects, each with "claim" (string), "why_the_analysis_needs_it" (string), "direction_if_false" (string).
  - "verdict": string, at most 180 words, saying whether the bundle is coherent and, if not, which two commitments genuinely conflict and which provision should yield.
