      *   **Deliberative/Constitutional (Panel):** A specific mechanism to inject "raw" citizen judgment without careerist distortion, protected by exclusion of pros and post-service bars (C, F).
      *   **Core Tension:** The system treats "politics" (electoral) as inherently corrupting for representatives (A), yet treats "governance" (executive/judicial) as requiring insulation from that same politics (B, D, E). It treats citizen judgment as pure only if devoid of political ambition (C, F), yet allows ex-legislators to become unlimited executives (B).
      *   **Load-Bearing Commitment:** *Functional Differentiation of Corruption.* The theory assumes corruption/insulation is bad for *representatives* (who must mirror the people) but good/necessary for *governors* (who must restrain the people/manage complexity), and that *citizen deliberation* is only valid if purged of ambition.
      *   **Actually, looking closer:** The real tension is between A (anti-careerism) and B (pro-careerism for elites). Why is careerism bad for MPs but good for Ministers?
      *   *Hypothesis:* The Lower House is designed as a "mirror" (descriptive/rotating), while the rest of the state is designed as a "filter" (meritocratic/insulated). The Panel is a "safety valve" against both.
      *   *Refined Hypothesis:* The system presupposes that *electoral accountability* is the primary source of distortion for legislators (hence term limits), while *political instability* is the primary risk for executives/judges (hence tenure). The Panel is a corrective to the failure of both.
