      Revised Speech for brevity:
      Welcome. Thank you to the astronomy club, our astrologer colleagues, and our donors. Seeing such divergent views of the sky under one roof is rare, but that tension is why we are here.

      The centerpiece is a facsimile of a horoscope Kepler cast for a nobleman. It is tempting to treat this as a curiosity, a slip into superstition. We want to say he humored clients. But Kepler did not cast charts to be polite. He believed the sky acted upon us. He believed planetary geometry physically shaped the human temperament.

      For Kepler, the line between astronomy and astrology was not about whether the heavens influence the earth. He thought they certainly did. The line was about mechanism, and who was qualified to speak it. He despised street-corner peddlers who claimed to know specific events. He offered geometry where they offered guesses. He took their money to fund the astronomy. But he did not check his brain at the door. He sought physical causes, not just fortunes.

      We like to think we have moved past this. We haven't. We believe the sky affects us. We renamed the mechanisms. We call it circadian rhythms, seasonal affective disorder, or solar storms knocking out the grid. We look up to understand what happens down here. We changed the vocabulary from soul to biology.

      So, as you walk through, resist the easy judgment. Do not just smile at the past. Listen to the argument Kepler is having with the hack astrologers of his day. It is an argument about rigor, not belief. Look at the charts. See the precision. Ask yourself where the math ends and the meaning begins. There are no easy answers, only the history of how we read the sky. Please, enjoy the wine, enjoy the exhibit, and look up.

