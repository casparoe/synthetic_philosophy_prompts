answer: |-
  # Game Design: *The Support Structure*

  ## Materials
  *   **16 Index Cards (Fact Cards):** Pre-written. 12 say "Contingent Fact" (white), 3 say "Necessary Fact" (blue), 1 says "Grounding Principle" (red).
  *   **8 Index Cards (Link Tokens):** Yellow. These represent the "in virtue of" relation.
  *   **Whiteboard & Marker:** For scoring.
  *   **Tape:** To stick Fact Cards to students' shirts (saves holding time).
  *   **Timer:** (Your phone or watch, kept hidden).

  ## Roles
  *   **16 Fact-Holders:** All students. They *are* the facts.
  *   **1 Scorekeeper:** You (the instructor). Do not play.

  ## Win Condition & Scoring
  *   **Goal:** Maximize individual **Stability Points**.
  *   **Base Points:** 10 points for being **Grounded** (having a Link Token pointed at you by another student).
  *   **Foundation Bonus:** 20 points for being **Fundamental** (having *no* Link Tokens pointed at you).
  *   **Penalty:** -50 points for being **Circular** (part of a loop).
  *   **Penalty:** -20 points for being **Ungrounded** (not Fundamental, but no Links pointed at you).
  *   **The Costly Choice:** To place a Link Token, the *giver* must pay 5 points from their own score.
  *   **Winning:** The top 3 scorers get "Priority Seating" for the next class (or similar non-monetary privilege). The rest get nothing.

  ## Rules (The "Physics" of the Game)
  1.  **Direction:** A Link Token is a directed arrow. Student A holds the token pointing at Student B means "B holds in virtue of A." (Note: This reverses the intuitive "support" metaphor to match grounding syntax: Ground → Grounded. *Correction for clarity:* Let's align with intuition. A points at B means "A supports B." B holds *in virtue of* A. **Rule:** If A points at B, B gets Grounded Points, A pays Cost.)
  2.  **Asymmetry:** If A points at B, B cannot point at A. (Enforced by Scorekeeper).
  3.  **Irreflexivity:** No one can point at themselves.
  4.  **Full Ground:** "Contingent Facts" (White) require **two** incoming Links to count as Grounded. "Necessary Facts" (Blue) require **one**.
  5.  **The Meta-Rule (Round 3):** Link Tokens are themselves facts. If a Link Token exists between A and B, someone must hold *that* Link Token grounded. (This triggers the regress).

  ## Order of Play & Timeline (90 Minutes)

  ### 0:00 – 0:03 | Framing (Strict Limit)
  "Welcome to *The Support Structure*. You are Facts. Your goal is Stability Points. You gain points by being supported by others, or by being a Foundation. You lose points for loops or floating. Links cost the giver points. Begin."
  *Do not explain grounding, metaphysics, or the goal of the seminar.*

  ### 0:03 – 0:20 | Round 1: The Chain (Dependence & Asymmetry)
  *   **Setup:** Distribute 12 White cards, 3 Blue cards, 1 Red card randomly. Tape to shirts. Give 8 Link Tokens to random students.
  *   **Task:** Arrange yourselves to maximize points.
  *   **Mechanic:** Students physically point Link Tokens at each other.
  *   **Constraint:** You (Scorekeeper) veto any loops or self-pointing immediately.
  *   **Expected Behavior:** They will form chains. Blue cards (1 link needed) will be popular targets. White cards (2 links needed) will struggle.
  *   **Metaphysics:** They feel the directional pull (Asymmetry/Irreflexivity). They feel the cost of explaining (Giver pays points).

  ### 0:20 – 0:40 | Round 2: The Burden of Proof (Full vs. Partial)
  *   **Rule Change:** "White cards now require **three** incoming Links to be Grounded. Blue still require one."
  *   **Task:** Re-arrange.
  *   **Pressure:** There are only 8 Link Tokens. 12 White cards need 3 links each (36 links needed). Impossible.
  *   **The Costly Choice:** Students must choose: Do we stop adding links to save points (claiming Fundamental status), or keep paying to link others (risking being Ungrounded themselves)?
  *   **Expected Behavior:** A scramble for the Blue cards. Some White cards will be left Ungrounded (-20 pts). Some will try to form a circle to share the burden (you veto this, enforcing Asymmetry).
  *   **Metaphysics:** Full vs. Partial ground. The scarcity of "explanatory resources."

  ### 0:40 – 0:60 | Round 3: The Regress (Status of Dependence)
  *   **Rule Change:** "The Link Tokens are now Facts. Every Link Token pointing at someone must itself be held by a Student."
  *   **Task:** Re-arrange.
  *   **Pressure:** If A links to B, Student C must hold that Link. But C is a Fact. Does C need a Link?
  *   **The Trap:** The student with the **Red Card ("Grounding Principle")** is now critical.
  *   **Expected Behavior:** They try to ground the Links. But grounding a Link requires a new Link. The chain extends. Points drain rapidly as givers pay 5 points per link.
  *   **Metaphysics:** The status of grounding facts. Does grounding need grounding?

  ### 0:60 – 0:75 | Round 4: The Floor (Termination & Fundamentality)
  *   **Rule Change:** "You have 5 minutes. Final scores locked. Any student without sufficient Links is 'Ungrounded' (-20). Any student with no incoming Links is 'Fundamental' (+20)."
  *   **The Stuck Position:** The student with the **Red Card** cannot be Fundamental (Red cards are Principles, not Base Facts) and cannot be Grounded (No one wants to pay to link to a Principle).
  *   **Task:** Final arrangement.
  *   **Expected Behavior:** They will try to make the Red card Fundamental, but the Rule says Red ≠ Fundamental. They will try to ground it, but no points remain. The Red card student is **genuinely stuck** and will score negative.
  *   **Metaphysics:** Fundamentality as a substantive status vs. a stopping place. The cost of the "Floor."

  ### 0:75 – 0:90 | Debrief
  *   Collect cards. Reveal the seminar topic: **Grounding and Fundamentality.**
  *   Map the game moves to the concepts (see below).

  ---

  ## Debrief: Mapping Mechanics to Metaphysics

  Do not lecture. Ask questions that force them to map their pain to the concepts.

  1.  **Dependence (Round 1):** "When you pointed a token at someone, you lost points they gained. In metaphysics, what does that cost represent?"
      *   *Target:* Explanation is non-causal but costly/asymmetric. The ground supports the grounded; the ground doesn't gain from the grounded.
  2.  **Irreflexivity/Asymmetry (Round 1 & 2):** "I vetoed your circles. Why did you try to make them?"
      *   *Target:* Because circles solve the 'Ungrounded' penalty. But metaphysics forbids self-explanation.
  3.  **Full vs. Partial (Round 2):** "Blue cards were easier to satisfy than White cards. What does that distinction map to?"
      *   *Target:* Some facts need a full set of grounds (White), some are settled by less (Blue/Necessary).
  4.  **Termination (Round 4):** "You wanted to stop the chain to get the Foundation Bonus. What stopped you?"
      *   *Target:* The desire for a floor (Fundamentality) vs. the requirement to keep explaining (The Meta-Rule).
  5.  **Status of Dependence (Round 3):** "When Links became Facts, did the game get harder? Why?"
      *   *Target:* If grounding relations are real facts, do they need grounds? This creates the regress.
  6.  **Fundamentality (The Red Card):** "Look at the student with the Red Card. They lost. Why?"
      *   *Target:* Fundamentality isn't just 'where we stopped.' It's a specific status. If you can't earn it (by being ungrounded legitimately) and can't buy it (by being grounded), you are stuck.

  ---

  ## Failure Modes & Fixes

  **Failure Mode 1: The "Chat" Stall.**
  *   *Problem:* Students spend 20 minutes debating the rules instead of moving.
  *   *Fix:* **The Bell.** In future runs, introduce a physical bell. Every 3 minutes, you ring it. When it rings, everyone must freeze. If the structure hasn't changed since the last bell, everyone loses 5 points. This forces *action* over *talk*.

  **Failure Mode 2: The "Sacrifice" Loophole.**
  *   *Problem:* One rich student (early points) pays to ground everyone, making themselves the single Fundamental Base. The game ends too cleanly.
  *   *Fix:* **The Cap.** Add a rule: "No student can hold more than 2 Link Tokens." This prevents a "God Fact" solution and forces a distributed structure, ensuring the regress problem hits harder.

  ---

  ## Honest Limitation

  **The game cannot reproduce the *modal force* of grounding.**
  In the game, links are arbitrary choices for points. In metaphysics, grounding is supposed to be *necessary* (if A grounds B, it couldn't be otherwise). The game feels pragmatic; reality feels rigid.

  **Script for the End (Read this exactly):**
  "You played for points. You stopped explaining when it cost too much. But in metaphysics, the world doesn't care about our points. The worry is not that we get tired of asking 'why.' The worry is that if there is no floor, nothing is actually real—it's all just hanging. The game made you feel the *structure* of that fear. It couldn't make you feel the *necessity*. That is your reading for next week."

  ---

  ## Verdict: Floor vs. No Floor

  **Commitment:** The game is rigged so they end up accepting a **structure with no floor (or a wobbly one).**

  **Reasoning:** If they successfully build a floor, they leave thinking fundamentality is a solved puzzle—a place you just arrive at. That kills the seminar. The "wobble" is the pedagogical goal. By making the Red Card (The Principle) unwinnable, you force them to acknowledge that *any* floor they claim is arbitrary. They must leave feeling that "Fundamental" is a title we grant to survive the regress, not necessarily a feature of the world. This generates the productive anxiety required for upper-level metaphysics.

  **The Moment:**
  I bet on **Round 3 (The Regress)**, specifically when the Link Tokens become Facts.
  **Confidence:** **75%**.
  **Why:** This is the moment the "cost" of explanation explodes. In Round 1 and 2, they can optimize. In Round 3, the math breaks. They physically feel the infinite demand. A first-time facilitator might rush the scoring here, but the structural contradiction (Links need Links) is robust enough to survive facilitator error. If they feel the points draining faster than they can earn them, the metaphysics lands.
