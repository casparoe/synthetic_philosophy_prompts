      *   **The Deontological/Integrity Argument:** Lying (Marcus's video), breaching trust (trading what isn't yours), corrupting the process (offset system).
      *   **The Institutional Corruption Argument:** If this becomes normatively acceptable, the foundation drifts from mission to personal pet projects. The "offset system" is particularly dangerous (moral licensing).
