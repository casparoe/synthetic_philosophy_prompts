  # Decision Tree: The Moral Architecture of Conditionality

  **Instructions for the Reader:** Begin at **Node 1**. Answer the question based on your intuition regarding the concrete case provided. Follow the branch corresponding to your answer until you reach a **Leaf** (a named position).

  ---

  ### **Node 1: The Justification of Requirement**
  **Case:** A claimant refuses a job that pays less than their last one, citing dignity.
  **Question:** Is the state's interest in requiring them to work primarily that they *owe* a contribution for support received (Reciprocity), or that work is inherently *good for them* regardless of debt (Perfectionism)?
  *   **Branch A (Perfectionism):** Work improves the claimant. → Go to **Node 2**.
  *   **Branch B (Reciprocity):** Work repays the collective. → Go to **Node 3**.

  ---

  ### **Node 2: The Goal of Perfectionism**
  **Case:** A political coalition threatens to defund benefits unless work requirements are visible.
  **Question:** Is the conditionality justified only if it actually *changes the claimant's behavior* (Instrumental), or is it justified if it merely *expresses a norm* that sustains the coalition (Expressive)?
  *   **Branch A (Instrumental):** It must change behavior. → **Leaf 1**.
  *   **Branch B (Expressive):** It must sustain the norm. → **Leaf 2**.

  ---

  ### **Node 3: The Condition of Reciprocity**
  **Case:** A district has far fewer vacancies than claimants.
  **Question:** Does the obligation to seek work *lapse* when the scheme's terms are inadequate (slack market), or does it *bind regardless* of market conditions?
  *   **Branch A (Lapses):** Obligation requires opportunity. → **Leaf 3**.
  *   **Branch B (Binds):** Obligation is unconditional. → Go to **Node 4**.

  ---

  ### **Node 4: The Epistemic Constraint**
  **Case:** The state cannot distinguish between a claimant shirking and one searching invisibly.
  **Question:** Is this inability to know who is shirking *fatal* to individually targeted sanctions, or can sanctions proceed despite the error rate?
  *   **Branch A (Fatal):** Uncertainty forbids sanction. → **Leaf 4**.
  *   **Branch B (Surmountable):** Sanctions are permissible. → Go to **Node 5**.

  ---

  ### **Node 5: The Nature of the Sanction**
  **Case:** A claimant is sanctioned for a misfiled form rather than a refusal to work.
  **Question:** Does the failure void the *entitlement itself* (the right to claim), or does it only affect the *timing of payment* (the right survives but disbursement is withheld)?
  *   **Branch A (Timing):** Right survives, payment delayed. → **Leaf 5**.
  *   **Branch B (Entitlement):** Right is voided. → Go to **Node 6**.

  ---

  ### **Node 6: The Scope of Fault**
  **Case:** A claimant is sanctioned for a misfiled form (administrative error) rather than a behavioral refusal.
  **Question:** Must sanctions track *moral fault* (behavioral refusal only), or may they enforce *strict liability* (administrative compliance)?
  *   **Branch A (Moral Fault):** Sanctions require refusal. → **Leaf 6**.
  *   **Branch B (Strict Liability):** Sanctions allow administrative error. → **Leaf 7**.

  ---

  ## **The Leaves (Positions)**

  1.  **Behavioral Paternalist** (Perfectionism/Instrumental)
      *   *Awkward Commitment:* Must admit that if conditions fail to increase employment, they are unjustified, even if the claimant remains idle.
  2.  **Civic Humanist** (Perfectionism/Expressive)
      *   *Awkward Commitment:* Must defend imposing work requirements even when evidence shows they deepen poverty, provided the norm of contribution is upheld.
  3.  **Reciprocal Egalitarian** (Reciprocity/Market-Lapse)
      *   *Awkward Commitment:* Must accept that in a recession, the state pays for idleness without requiring contribution, potentially straining the funding coalition.
  4.  **Epistemic Skeptic** (Reciprocity/Bind/Epistemic-Fatal)
      *   *Awkward Commitment:* Must argue that no sanctions are permissible even if most claimants are clearly shirking, because the state cannot verify the individual case.
  5.  **Procedural Contractualist** (Reciprocity/Bind/Epistemic-Safe/Timing)
      *   *Awkward Commitment:* Must allow the state to withhold survival funds indefinitely for clerical errors while maintaining the claimant retains a theoretical right to them.
      *   *Note:* This leaf is paired with **Leaf 5b (Restorable Proceduralist)**; the tree cannot separate whether the delayed payment must be restorable upon correction.
  6.  **Moral Retributivist** (Reciprocity/Bind/Epistemic-Safe/Entitlement/Fault)
      *   *Awkward Commitment:* Must allow the state to extinguish a claimant's right to subsistence entirely, provided the cause was a willful behavioral refusal.
  7.  **Administrative Realist** (Reciprocity/Bind/Epistemic-Safe/Entitlement/Strict)
      *   *Awkward Commitment:* Must defend extinguishing subsistence rights for clerical errors, prioritizing system integrity over individual moral desert.
      *   *Note:* This leaf is paired with **Leaf 7b (Permanent Exclusionist)**; the tree cannot separate whether the voided right is permanently lost or merely reset.
  8.  **Unnamed: Expressive Reciprocalist** (Unoccupied Path)
      *   *Description:* A position holding Reciprocity is binding regardless of market (Node 3B), but sanctions are purely expressive (Node 2B logic applied here).
      *   *Status:* **Unattractive.** It combines the harshness of unconditional obligation with the emptiness of symbolic enforcement, satisfying neither efficiency nor fairness.
  9.  **Unnamed: Instrumental Egalitarian** (Unoccupied Path)
      *   *Description:* A position holding obligations lapse in slack markets (Node 3A), but sanctions are purely instrumental (Node 2A logic).
      *   *Status:* **Incoherent.** If the obligation lapses, there is no behavior to instrumentally change; the conditionality loses its object.
  10. **Unnamed: Perfectionist Skeptic** (Unoccupied Path)
      *   *Description:* A position holding work is good for the claimant (Node 1A), but epistemic uncertainty forbids enforcement (Node 4A logic).
      *   *Status:* **Undefended.** It asserts a state interest in the claimant's character but denies the state the agency to pursue it, collapsing into laissez-faire.
  11. **Unnamed: Strict Proceduralist** (Unoccupied Path)
      *   *Description:* A position holding sanctions are only timing delays (Node 5A), but apply to strict liability (Node 6B).
      *   *Status:* **Unattractive.** It subjects claimants to bureaucratic harassment and payment starvation for typos without the "mercy" of restoring the full entitlement relationship.
  12. **Unnamed: Libertarian Reciprocalist** (Unoccupied Path)
      *   *Description:* A position holding reciprocity binds regardless of market (Node 3B), but epistemic limits are fatal (Node 4A).
      *   *Status:* **Incoherent.** It asserts a binding debt that the state is forbidden from collecting, creating a right without a remedy.

  ---

  ### **Analysis of Logical Space**

  **Indistinguishable Pairs:**
  *   **Leaf 5 & 5b:** The tree separates *Timing* from *Entitlement*, but does not distinguish whether a delayed payment must be *restorable* (paid in arrears) or merely *resumable* (future payments only). Both fall under "Procedural Contractualist."
  *   **Leaf 7 & 7b:** The tree separates *Entitlement Void* from *Timing*, but does not distinguish whether a voided right is *permanently extinguished* or *resettable* upon re-application. Both fall under "Administrative Realist."

  **Unoccupied Combinations:**
  *   **Perfectionism + Reciprocity Market Conditions (Nodes 1A + 3):** This combination is **Incoherent**. Market adequacy (Node 3) is a constraint on *Reciprocity* (what is owed), not *Perfectionism* (what is good). Asking if a perfectionist obligation lapses due to labor shortage category-errors the justification.
  *   **Expressive + Instrumental (Node 2):** By definition, these are mutually exclusive branches. A position cannot claim conditionality is justified *only* if it works (Instrumental) and *also* justified even if it doesn't (Expressive). This space is **logically closed**.
  *   **Entitlement Void + Market Lapse (Nodes 5B + 3A):** This combination is **Undefended**. If the obligation lapses due to market conditions (3A), there is no basis to void the entitlement (5B). No serious theorist argues for voiding rights when the condition for holding them is suspended by the state's own market failure.

  **Distinctions Utilized:**
  1.  **Entitlement vs. Timing:** Node 5.
  2.  **Reciprocity vs. Perfectionism:** Node 1.
  3.  **Reciprocity/Adequacy:** Node 3.
  4.  **Epistemic Problem:** Node 4.
  5.  **Instrumental vs. Expressive:** Node 2.
  6.  **Fault/Scope:** Node 6 (Derived from the concrete case of the misfiled form).
