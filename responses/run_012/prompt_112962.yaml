  **The Night Clerk's Lemma**

  The neon sign insists there is no **room**,
  Though every key is turned and house is **full**.
  A single traveler stands alone, a **guest**,
  Arriving weary in the middle **night**.
  I tell him surely we can find one **more**,
  And shift the keys without a final **count**.

  I do not need to keep a strict **count**,
  To know that every existing **room**
  Can stretch to hold a multitude and **more**.
  The lobby swells, no longer merely **full**,
  But open wide beneath the starry **night**.
  Each weary soul becomes a welcome **guest**.

  But One stands up, the first and oldest **guest**,
  Who says I cannot make a true **count**
  Of steps completed in the finite **night**.
  He claims I shift the label on his **room**,
  Yet leave the house physically **full**,
  Asserting that I promise nothing **more**.

  I tell him names are not the sum of **more**,
  Nor does the map confine the living **guest**.
  The vessel is not defined as **full**,
  But by the pattern that we use to **count**.
  I give you space within a shifted **room**,
  Where light persists beyond the closing **night**.

  Then someone asks about the endless **night**,
  Or points to all the points between and **more**.
  Is there within this hotel enough **room**,
  For every shadow waiting like a **guest**?
  I say no, there is no way to **count**
  Such density; the measure stays not **full**.

  He says the ledger must remain strictly **full**,
  Of actions done before the morning **night**.
  I say the set exists beyond the **count**,
  Of steps we take to offer something **more**.
  He waits for proof that fits a single **guest**,
  I hold the key to every possible **room**.

  He says the book is **full**, I say there is **more**;
  We stand together in the same long **night**, the **guest**
  Decides the **count** of **room**.
