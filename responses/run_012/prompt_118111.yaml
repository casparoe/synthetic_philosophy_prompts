answer: |-
  Dear colleague,

  I have spent some time sitting with the position you described, the one that seeks to elevate Aumann's agreement theorem from a striking result in game theory to a binding normative constraint on human disagreement. It is a seductive view because it promises a clean resolution to the messiness of epistemic conflict, offering a diagnostic tool that locates the fault in any persistent dissent either in irrationality, in communication failure, or in a lack of shared starting points. However, having turned the argument over to look for its stress points, I am convinced that the slide from the mathematical theorem to the normative claim is unsustainable. The theorem holds water only within a closed system of idealizations, and when you try to apply it to flesh-and-blood disputants, the structure collapses. I will lay out the case against this position by examining the assumptions in order of how much damage their relaxation causes to the conclusion, starting with the most致命 flaw, which lies in the common prior assumption, before moving to the issues of common knowledge and computational idealization.

  The most devastating blow to the normative reading of the theorem comes from relaxing the common prior assumption. The position you are attacking relies heavily on the idea that two rational agents must share a prior probability distribution over the state space. Proponents of the normative reading often defend this by suggesting that any difference in priors must stem from differences in evidence received at some point, tracing back to a hypothetical origin where all agents shared the same initial state of ignorance. They argue that if you and I disagree, it is because we have processed different data, and if we truly pooled all that data, we would converge. But this defense smuggles in a contentious metaphysical claim about the nature of priors that simply does not hold up under scrutiny. There is no compelling reason to think that rationality requires a unique correct prior. It is entirely coherent to hold that two agents can start with the same evidence, process it perfectly, and yet arrive at different credences because their epistemic policies—their fundamental ways of weighing risk, simplicity, or explanatory power—differ. If permissivism is true, even in a limited sense, then the common prior assumption is not a requirement of rationality but a modeling convenience that strips away the very diversity of epistemic perspective that makes disagreement substantive. When you push hardest on this point, as you suggested you are willing to do, the normative claim evaporates. If I am permitted to have a prior that is slightly more skeptical of climate models than yours, and you are permitted to have a prior that is slightly more trusting, then our persistent disagreement after seeing the same data is not a failure of rationality. It is a reflection of permissible epistemic diversity. The theorem only says we cannot agree to disagree if we share a prior; it does not prove we must share a prior. To claim otherwise is to beg the question against the permissivist.

  This leads directly to your question about whether the common prior assumption can be defended as a normative requirement rather than a modeling convenience. I believe it cannot, and attempting to do so renders the theory insulated from counterexample in a way that is theoretically costly. If every time two well-informed people disagree we simply assert that they must not have had a common prior, the theory becomes unfalsifiable. It risks becoming a tautology where disagreement is defined as evidence of divergent priors, and divergent priors are defined as the only allowable source of rational disagreement. This is a defect because it removes the theorem's bite. A normative theory should be able to tell us when we are wrong, not just redescribe our errors to fit the model. In the case of the two economists handed the same data who reach opposite conclusions, the Aumannian defender must say they either processed the data incorrectly or started with different priors. But if the economists are both behaving in ways that look methodologically sound, attributing the difference to priors becomes a way of shielding the theory from refutation. It implies that any deep methodological dispute is merely a clash of brute psychological facts rather than a resolvable epistemic conflict. This drains the concept of rationality of its normative force. If the only way to preserve the theorem is to say that any persistent disagreement proves the absence of a common prior, then the theorem tells us nothing about how we ought to resolve disputes, only that we currently lack the specific condition required for the theorem to apply.

  Secondary to the common prior problem, though still severe, is the assumption of common knowledge of beliefs. The theorem requires not just that I know your credence and you know mine, but that I know that you know, and you know that I know, ad infinitum. In the real world, this condition is almost never met. Communication is noisy, costly, and limited. We do not exchange full probability distributions; we exchange arguments, summaries, and confidence intervals. When you relax this assumption, the strict agreement result no longer holds. Defenders might point to approximate agreement theorems, which suggest that if agents almost know each other's beliefs, their credences will be close. But close is not the same as equal, and in high-stakes disagreements, the gap between close and equal is where the action is. Two friends who split the same body of evidence and stay split for years may well know roughly what the other thinks, but they do not have common knowledge of the exact updating functions the other is using. They may suspect the other is weighting a particular piece of evidence differently, but without common knowledge of that weighting, the theorem does not compel convergence. The normative claim fails here because it demands a level of epistemic transparency that is humanly impossible. To say agents are irrational for failing to achieve common knowledge is to demand they overcome the fundamental friction of communication. This is not a failure of rationality but a failure of bandwidth.

  Regarding the specific case of disputes about how to weigh shared evidence, this collapses back into the common prior issue. If we share the evidence but disagree on its weight, we are effectively disagreeing about the likelihood function or the prior probability of the hypothesis given that evidence. In Bayesian terms, how one weighs evidence is determined by one's prior commitments about the reliability of sources and the structure of the world. Therefore, a dispute about weighing is a dispute about priors. If the common prior assumption is not a normative requirement, then these disputes are not failures of rationality. They are fundamental clashes of epistemic perspective. The Aumannian view tries to treat these as errors in processing, but if the weighting itself is prior-dependent, then the error lies only in the expectation that the weighting should be identical. This is where the view is weakest, as you suspected. It tries to force all disagreement into the box of information asymmetry or computational error, ignoring the possibility that rational agents can look at the same map and draw different routes based on different values assigned to risk and reward.

  There is also the matter of computational idealization, which carries less damage than the prior assumption but still weakens the normative claim. The theorem assumes agents are perfect Bayesians who can conditionalize on any partition of knowledge. Real agents are bounded. We cannot calculate all the implications of our beliefs. If I am unaware that my belief contradicts yours because I have not computed the implication, am I irrational? A normative theory should account for bounded rationality. If the theorem only applies to logically omniscient agents, its normative grip on us is limited to a regulative ideal that we may never reach. However, this is less damaging than the prior assumption because one could argue we ought to strive for logical consistency. The prior assumption is different because there is no clear sense in which we ought to strive for identical starting points if those starting points reflect permissible differences in epistemic risk.

  So, where does this leave the live escape routes? The only live route for the defender of the normative claim is to double down on the common prior assumption and argue that communication itself presupposes it. They might argue that to understand each other's language and concepts, we must already share a vast amount of probabilistic structure, and that genuine disagreement is only possible against a background of massive agreement. If this were true, then persistent disagreement on specific issues would indeed signal a breakdown in that background shared structure, implying a failure of rationality or understanding. However, this conflates sharing a language with sharing a prior probability distribution over empirical states. We can share the meaning of the word risk while assigning different probabilities to the occurrence of a risky event. The escape route is formal rather than substantive because it relies on equating semantic sharedness with probabilistic identity.

  To answer your question about whether the position survives the cases that motivated it, I do not think it does. In the case of the two economists, the theorem forces us to describe them as having different priors, which is true but trivial. It does not help us decide who is right. In the case of the friends, it suggests they should talk more until they agree. But if they talk more and still disagree, the theorem simply says they never really shared their evidence fully. This leads to the insulation problem you raised. If the theory can accommodate every case by redescribing the parties as never having shared a prior or never having shared evidence, then it is defectively insulated. It becomes a definition of rationality rather than a test of it. A view of this kind has to do more than define away disagreement; it has to offer a procedure for resolving it. If the only procedure is share everything until you agree, and disagreement persists, then the verdict is always that you haven't shared enough. This is not a useful guide for action.

  You asked what would change my mind on this. I would move to a different verdict if it could be demonstrated that the common prior assumption is a precondition for the possibility of communication itself, not just a modeling convenience. If someone could show that without a common prior, agents cannot even interpret each other's evidence reports as evidence, then the assumption would gain normative traction. We would be forced to adopt a common prior to communicate at all, making disagreement a sign of communicative breakdown. Currently, I see no proof of this, as agents with different priors can still update on the same data, even if they update to different values. Additionally, if there were a compelling argument that divergent priors inevitably lead to Dutch books or money pumps in social interaction, that would strengthen the normative claim. Without that, the permissibility of diverse priors stands.

  Finally, I must acknowledge where my own reasoning is most likely to have gone wrong. I may be underestimating the coherence of the single correct prior view. It is possible that there is one objectively correct way to assign probabilities based on logical relations between propositions, akin to a logical probability theory. If such a thing exists, then any deviation is indeed irrational, and the common prior assumption is normative. My rejection of this rests on the skepticism that such logical relations exist for empirical matters. If I am wrong about that, and there is a unique rational prior dictated by the structure of reality, then the Aumannian position holds much more force. I may also be too quick to dismiss the approximate agreement results. If real agents converge closely enough for practical purposes, the strict theorem might be less important than the general tendency toward consensus it describes. If the norm is convergence rather than identity, the theory survives in a modified form. But until those gaps are filled, the move from Aumann's mathematics to a normative constraint on human disagreement remains a bridge too far, resting on an assumption about priors that is neither proven nor plausible as a requirement of rationality.

  I hope this helps you dismantle the position for your paper. It is a powerful theorem, but its power is mathematical, not necessarily ethical or epistemic in the way its proponents hope.

  Best regards,

  Your colleague
