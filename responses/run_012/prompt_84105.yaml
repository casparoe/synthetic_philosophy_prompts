prompt: |-
  I teach a 300-level seminar on death and the metaphysics of harm -- senior majors, a couple of grad students sitting in. Final is a 90-minute closed-book essay, one question, 20 marks. Closed book, so nothing that depends on them remembering who said what. My problem is that every year I get the same essay back: Epicurus says the dead don't exist so nothing can be bad for them, the deprivation account says death is bad because it takes away the life you would have had, deprivation account wins. Thats a book report, not an essay.

  Here's the framing I've been pushing all term, and I want the exam built on it. I split Epicurus's argument into two claims that I think are seperate, and I tell them only one is load-bearing:

  (a) the existence condition -- for something to be bad for you, there has to be somebody it's bad for;
  (b) the timing condition -- for something to be bad for you, there has to be some time at which it's bad for you.

  My line is that the deprivation account can give up (b) without blinking: it can say death is bad for you and yet not bad for you at any time. And that almost every standard reply to Epicurus is a disguised way of giving up (b), which means those replies have already conceded (a). If that's right, the live question isn't whether death is bad for you, it's how much the deprivation account can explain while still holding on to (a). I want the exam to make them answer that.

  Three things the question has to march them through, because these are where the class comes apart:

  1. The symmetry argument -- the one about the eternity before you were born being no different from the eternity after you die. The usual asymmetry reply is that death deprives you of goods your life would have contained, whereas the pre-natal stretch deprives you of nothing. I want them to notice that this reply sounds like it needs a subject who is there to be deprived, i.e. it sounds like (a). So is the asymmetry reply even available to someone who's dropped (b), or does dropping (b) cost you the reply?

  2. The relocation move. Suppose they try to keep (b) by saying the harm isn't being dead, it's having your life cut short -- and that harm happens at the moment of death, when you do exist. Both conditions satisfied, tidy. I want them to say whether that's a real fix or a relabeling, and to test it on this case: a woman dies at 38, in the middle of a life she was absorbed in, but she'd already done everything she'd ever wanted to do, and had she lived she'd have had a pleasant but unremarkable rest of it, nothing she would have minded missing. Intuitively her death is a tragedy. Say what the deprivation account is committed to saying about that intuition, and whether the relocation move helps it.

  3. The baseline. The life you would have had is not a determinate thing -- it hangs on how long you'd have lived, on choices nobody made, on medical luck. So what is the account actually comparing, and can it be a real comparison rather than a fiction? Here's the case I use to sharpen it: two people die at 50. The first would have had thirty more years she'd have enjoyed. The second would have had thirty more years flat on his back in a coma -- no experiences, no desires, no chance of waking. Same thirty years of life lost in both cases. Say what the deprivation account has to say about the second death, and whether having to say that shows the account is really about goods rather than about life.

  So please write me the question itself, plus a model answer of about 700 words, plus a marking scheme. For the marking scheme I want five must-hit moves, 20 marks total, split unevenly -- I want the top-end marks to go to the moves that separate an A from a B, and I want the A/B line to be whether they can say what a version of the account that keeps (a) and drops (b) would actually look like, and what that costs. For each must-hit point, one line on how students typically get it wrong -- the actual failure mode, not 'they were vague.' Don't let the question be answerable by reciting the four-line Epicurean argument or by reciting 'deprivation account good, Epicurus bad,' and keep it doable in 90 minutes by someone who's done the reading. I don't want a research paper.
reasoning: |-
  Here's a thinking process that leads to the suggested exam question, model answer, and marking scheme:

  1.  **Analyze the Request:**

      *   **Context:** 300-level seminar on Death and Metaphysics of Harm. Senior majors + grad students.
      *   **Exam Format:** 90-minute closed-book essay, one question, 20 marks.
      *   **Problem:** Students keep writing the same "book report" (Epicurus vs. Deprivation, Deprivation wins).
      *   **Instructor's Framework:** Split Epicurus into (a) Existence Condition (needs a subject) and (b) Timing Condition (needs a time). The instructor argues Deprivation keeps (a) but drops (b).
      *   **Key Issues to Address:**
          1.  *Symmetry Argument:* Does the standard asymmetry reply (pre-natal vs. post-mortem) rely on (a) in a way that conflicts with dropping (b)?
          2.  *Relocation Move:* Can harm be located at the moment of death? Test case: Woman dies at 38, fulfilled life ahead (pleasant but unremarkable). Intuition: Tragedy. Does relocation help?
          3.  *Baseline Problem:* Counterfactuals are indeterminate. Test case: Two people die at 50. One would have had 30 good years. One would have had 30 years in a coma. Same "life" lost? Is it about *life* or *goods*?
      *   **Deliverables:**
          1.  The Exam Question.
          2.  Model Answer (~700 words).
          3.  Marking Scheme (5 must-hit moves, 20 marks total, uneven split, specific failure modes).
      *   **Constraint:** Must force students to engage with the specific framework (a vs. b) and the specific test cases, not just recite standard views. Must be doable in 90 mins.

  2.  **Drafting the Exam Question:**

      *   *Goal:* Make it impossible to answer with the standard "Epicurus bad, Deprivation good" script. Force them to use the (a)/(b) distinction and the specific cases provided in the prompt (Symmetry, Woman at 38, Coma at 50).
      *   *Structure:* State the framework clearly (since it's closed book, I need to remind them of the instructor's specific distinction so they don't revert to standard textbook definitions). Then pose the prompt using the three required elements.
      *   *Drafting:* Start by defining (a) and (b) as taught in class. Ask them to evaluate the Deprivation Account *given* that it retains (a) but abandons (b). Then list the three specific challenges (Symmetry, Relocation/38yo, Baseline/Coma). Ask for a unified assessment of the account's coherence under these constraints.

  3.  **Drafting the Model Answer:**

      *   *Goal:* Demonstrate the "A" level response. It needs to accept the instructor's premise (Deprivation keeps (a), drops (b)) and work through the implications.
      *   *Word Count:* ~700 words.
      *   *Content:*
          *   Intro: Accept the framing. Deprivation is a timeless harm to an existing subject.
          *   Symmetry: Address pre-natal non-existence. If we drop (b), we don't need a time *during* non-existence for harm to occur. But the asymmetry reply usually relies on *directionality* of time regarding goods. If we keep (a), we need a subject. The subject exists now (or existed). The harm is relative to the actual life. Pre-natal non-existence didn't deprive an existing subject of a future they were on track for. Post-mortem does.
          *   Relocation (Woman at 38): Relocation says harm is at death. But if she had nothing significant to lose (pleasant but unremarkable), deprivation says little harm. Intuition says tragedy. Relocation doesn't fix the *magnitude* problem, only the timing problem. If we drop (b), we admit the harm is timeless, so relocation is unnecessary labeling.
          *   Baseline (Coma): This is the crux. If deprivation is about *life*, both lose 30 years. If about *goods*, only the first loses. The account must be about goods/experiences, not biological life. This threatens (a) if the "goods" never belong to a subject. But if we say the *possible subject* is the reference, we strain (a).
          *   Conclusion: The account works only if it's about goods, not life, and accepts timeless harm. This is costly but coherent.
      *   *Refining:* Ensure it explicitly mentions (a) and (b) and follows the instructor's specific logic about the "cost" of the theory.

  4.  **Drafting the Marking Scheme:**

      *   *Goal:* 5 must-hit moves, 20 marks. Uneven split. Top marks for the (a)/(b) synthesis.
      *   *Differentiation:* B students will list the problems. A students will explain how dropping (b) solves/changes the problems but creates new tensions with (a).
      *   *Moves:*
          1.  Correctly applying the (a)/(b) distinction to the Deprivation Account.
          2.  Handling Symmetry without relying on a subject *during* pre-natal time.
          3.  Evaluating Relocation vs. Timeless Harm (Woman at 38 case).
          4.  Distinguishing Life vs. Goods (Coma case).
          5.  Final Synthesis: What does the account actually measure if it keeps (a) but drops (b)?
      *   *Failure Modes:* Need specific descriptions (e.g., "conflates timing with existence," "treats relocation as a solution to magnitude").

  5.  **Review and Refine:**

      *   *Check against constraints:* Is it closed-book friendly? Yes, the prompt provides the necessary definitions. Is it 90 mins? Yes, 700 words is tight but doable for a focused argument.
      *   *Tone:* Academic, precise, matching the instructor's voice.
      *   *Specific Check:* Did I include the specific cases? (Symmetry, Woman at 38, Coma at 50). Yes.
      *   *Specific Check:* Is the marking scheme clear on the A/B line? Yes, focusing on the metaphysical cost of dropping (b).

  6.  **Final Polish:** (Self-Correction during drafting)
      *   *Correction:* Make sure the prompt doesn't give *away* the answer. It should state the framework as the *lens* they must use, not the conclusion they must reach.
      *   *Correction:* Ensure the Model Answer doesn't exceed 700 words significantly.
      *   *Correction:* Ensure the Marking Scheme failure modes are specific to the logic, not just "vague."

  7.  **Final Output Generation** (Proceeding to generate response based on these thoughts).
answer: |-
  **Exam Question**

  **Time Allowed:** 90 Minutes
  **Total Marks:** 20

  **Question:**

  In this course, we have analyzed Epicurus's argument against the harm of death by distinguishing two conditions:
  **(a) The Existence Condition:** For something to be bad for you, there must be a subject (you) for whom it is bad.
  **(b) The Timing Condition:** For something to be bad for you, there must be a time *at which* it is bad for you.

  We have stipulated that the Deprivation Account can satisfy (a) while rejecting (b): it claims death is a timeless harm to an existing subject. Writing on the assumption that this stipulation holds, evaluate the coherence of the Deprivation Account by addressing the following three challenges:

  1.  **Symmetry:** If death is a timeless harm to a subject, does the standard asymmetry reply (that pre-natal non-existence deprives us of nothing) remain available, or does it secretly rely on a timing condition you have rejected?
  2.  **Relocation:** Consider a woman who dies at 38. She is fulfilled, and her future holds only pleasant but unremarkable years she would not mind missing. Intuitively, her death is a tragedy. Does locating the harm at the *moment* of death (the Relocation Move) explain this intuition better than a timeless deprivation account, or is it merely a relabeling?
  3.  **Baseline:** Consider two people who die at 50. One would have lived 30 good years; the other would have lived 30 years in a coma. Both lose 30 years of *life*. Does the Deprivation Account measure the loss of *life* or the loss of *goods*? Explain how your answer impacts condition (a).

  Your essay should not summarize the history of the debate. It must argue for what version of the Deprivation Account survives these three tests if it is committed to keeping (a) but dropping (b).

  ***

  **Model Answer**

  If we accept the framework that the Deprivation Account retains the Existence Condition (a) but abandons the Timing Condition (b), the account transforms from a claim about events in time to a claim about comparative metaphysics. The harm of death is not an event located in the biography of the deceased, but a timeless fact about the relationship between the actual world and the possible world where the subject survived. Evaluating the three challenges reveals that this move saves the account from Epicurus but exacts a high price regarding what is actually being valued.

  Regarding **Symmetry**, the standard reply is that pre-natal non-existence deprives us of no goods because there was no life in progress to be cut short, whereas death cuts a life short. If we drop (b), we do not need to find a time *during* pre-natal non-existence where the harm occurs. However, the asymmetry reply risks smuggling (b) back in if it relies on the *direction* of time to determine deprivation. To remain consistent with dropping (b), the account must argue that the asymmetry is not about time, but about the subject's trajectory. Pre-natally, there is no subject to have a trajectory. Post-mortem, there *was* a subject whose trajectory was interrupted. Thus, the reply is available, but only if we treat the subject as a four-dimensional entity whose completion is thwarted by death, not birth. The cost is accepting that "deprivation" is not an experience but a structural fact about a life's shape.

  The **Relocation Move** attempts to satisfy (b) by claiming the harm occurs at the moment of death. In the case of the woman dying at 38, relocation fails to explain the tragedy if her future goods were negligible. If the harm is located at the moment of death, the magnitude of that harm should correspond to the state of the subject at that moment. But if she is fulfilled and the future is bland, the "cutting short" feels minor. The intuition that her death is a tragedy suggests we are mourning the loss of the *possibility* of significance, not just the cessation of function. A timeless deprivation account (dropping (b)) handles this better than relocation, provided it defines deprivation as the loss of *open futures*, not just experienced goods. Relocation is indeed a relabeling; it tries to force a timeless comparison into a temporal box to satisfy our intuition that harms must happen *when* something exists. But since we have already dropped (b), relocation is unnecessary metaphysical clutter.

  The **Baseline** problem strikes at the heart of condition (a). In the case of the two 50-year-olds, if the account measures the loss of *biological life*, both suffer equal harm. This is counterintuitive. If the account measures the loss of *goods* (experiences, projects), only the first suffers harm. If we choose the latter, we strain condition (a). For the coma patient, there is no subject who is deprived of experiences, because no subject would have existed to have them. To say the coma patient is harmed is to say a possible subject is harmed by not becoming an actual subject. This verges on violating (a), which requires an existing subject. Therefore, to keep (a), the Deprivation Account must admit it is not about the value of *life* per se, but the value of *conscious agency*.

  In conclusion, a Deprivation Account that keeps (a) and drops (b) is coherent only if it accepts that harm is a timeless relation between an actual subject and their counterfactual future. It survives Symmetry by focusing on trajectory rather than time. It renders Relocation obsolete. However, the Baseline case shows it cannot be an account of the harm of *death* so much as the harm of *lost potential*. The cost of dropping (b) is that the "harm" ceases to be an event in the world and becomes a modal fact about what a specific subject could have been.

  ***

  **Marking Scheme**

  **Total:** 20 Marks
  **Pass Threshold:** 10 Marks
  **A-Range Threshold:** 16 Marks

  **1. Application of the (a)/(b) Framework (4 Marks)**
  *   **Required:** Explicitly defines the Deprivation Account as retaining the subject (a) but treating harm as timeless (dropping b).
  *   **A-Range (3-4):** Explains that dropping (b) changes the *ontology* of harm from an event to a comparative fact.
  *   **B-Range (1-2):** Mentions (a) and (b) but treats them as standard Epicurean objections rather than the specific stipulated framework.
  *   **Failure Mode:** Student reverts to standard textbook definitions of Epicurus/Deprivation without using the instructor's (a)/(b) distinction.

  **2. Symmetry and the Subject (4 Marks)**
  *   **Required:** Argues that the asymmetry reply works only if it relies on the existence of a trajectory (subject), not a specific time.
  *   **A-Range (3-4):** Identifies that relying on "direction of time" secretly reinstates (b); argues asymmetry must be about the interruption of an existing trajectory.
  *   **B-Range (1-2):** Recites the standard asymmetry argument (Lucretius) without checking if it conflicts with dropping (b).
  *   **Failure Mode:** Claims the asymmetry argument is impossible if (b) is dropped, or claims it works without explaining why it doesn't require a time for the harm.

  **3. Relocation vs. Timelessness (Woman at 38) (4 Marks)**
  *   **Required:** Identifies Relocation as an attempt to save (b) and critiques it using the "unremarkable future" case.
  *   **A-Range (3-4):** Concludes Relocation is "relabeling" because it cannot account for the magnitude of the tragedy if future goods are low; argues timeless deprivation handles "lost potential" better.
  *   **B-Range (1-2):** Accepts Relocation as a valid solution to the timing problem without testing it against the specific intuition of the case.
  *   **Failure Mode:** Treats Relocation as a successful fix for the timing problem, ignoring that the prompt asks them to evaluate it *given* they have already dropped (b).

  **4. Baseline: Life vs. Goods (Coma Case) (4 Marks)**
  *   **Required:** Distinguishes between losing biological life and losing experiential goods; applies this to condition (a).
  *   **A-Range (3-4):** Argues that if the account is about goods, the coma case shows we are harming a *possible* subject, which threatens (a). Concludes the account is about agency/experience, not life.
  *   **B-Range (1-2):** Correctly identifies the coma patient suffers less harm but fails to link this back to the definition of the subject in (a).
  *   **Failure Mode:** Claims both patients suffer equal harm because "life is valuable" without addressing the intuition pump, or claims the coma patient is unharmed without noting the tension with (a).

  **5. Synthesis: The Cost of the Account (4 Marks)**
  *   **Required:** A concluding judgment on what the Deprivation Account actually measures if it adheres to the stipulated constraints.
  *   **A-Range (3-4):** Articulates that the account becomes a theory of "modal loss" or "lost potential" rather than "harm of death," acknowledging the metaphysical cost.
  *   **B-Range (1-2):** Concludes that Deprivation "wins" against Epicurus without qualifying what the theory has become.
  *   **Failure Mode:** Generic conclusion ("Death is bad") that does not reflect the specific argumentative journey of the essay.
