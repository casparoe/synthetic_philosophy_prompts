answer: |-
  (a) **Essay Question**

  **The Spectrum of Duration and Quality**

  Consider the following sequence of lives. Life $A$ is one year lived at perfect quality (10/10). Life $B$ is two years lived at 9.9/10. Life $C$ is four years at 9.8/10. In each step, the duration doubles, and the quality drops by 0.1. Continue this sequence until the quality becomes strongly negative (e.g., constant agony), though the duration is astronomically large. Call the final life $Z$.

  Most people judge that $A$ is better than $Z$. Most also judge that any given step in the chain is "not worse than" the previous one (e.g., $B$ is not worse than $A$). If "not worse than" is transitive, $A$ must be not worse than $Z$. Contradiction.

  Write an essay addressing the following two requirements:

  1.  **The Cutoff Cost:** If you resolve this by denying that some step is "not worse," identify precisely where the chain breaks. Explain why that specific transition is morally significant despite the microscopic change in parameters. Why isn't this just an arbitrary sorites boundary?
  2.  **Value vs. Choice:** If you resolve this by accepting intransitive betterness (e.g., $A \ge B \ge C \dots \ge Z$ but $A > Z$), you must address the money-pump objection. Does intransitive betterness *necessarily* make an agent exploitable? Defend a position on whether the money-pump argument is a fatal reductio of intransitive value, or a bullet we can bite by separating axiology (what is better) from decision theory (what we choose).

  You must take a definitive stance on whether rational choice requires transitive betterness. Do not summarize standard population ethics; argue from the case above.

  ***

  (b) **Model Answer**

  The spectrum presents a trilemma: accept the absurd endpoint ($Z$ is not worse than $A$), deny transitivity, or deny the stepwise judgments. Denying the endpoint is impossible; a life of agony is worse than a year of bliss. Thus, we must either find a break in the chain or accept intransitivity.

  If we deny the stepwise judgment, we must identify a specific transition $k$ where Life $k$ is strictly worse than Life $k-1$, despite the doubling of duration and mere 0.1 quality drop. Suppose we claim the break occurs at year 1,024 vs. 2,048 at quality 9.0 vs. 8.9. The cost here is severe arbitrariness. Why does adding 1,024 years of near-perfect life suddenly become negative value solely because quality dipped 0.1? This posits a discontinuity in value space that mirrors no discontinuity in the phenomenology. To defend this, one must argue for a threshold theory of value where duration only counts above a certain quality floor. But setting that floor at 8.9 rather than 9.0 looks like a sorites boundary without justification. The "cutoff" view saves transitivity but sacrifices the smoothness of our value intuition, forcing us to accept that massive goods can be wiped out by rounding errors if they land on the wrong side of a magic number.

  The alternative is accepting intransitive betterness. Here, $A \ge B$, $B \ge C$, but $A > Z$. The standard rationalist objection is the money pump: if you prefer $B$ to $A$, $C$ to $B$, etc., but $A$ to $Z$, a clever bookie can trade you up the chain for fees, then trade you back to $A$, leaving you poorer. However, this conflates *betterness* with *choice*.

  Intransitive betterness does not necessarily imply exploitability if we decouple the value relation from the choice function. An agent can acknowledge that $B$ is "not worse" than $A$ without strictly preferring it, thereby refusing to pay to switch. If the agent adopts a decision rule like "maximize expected value relative to status quo unless strict improvement is guaranteed," cyclic trades are blocked. The money pump requires the agent to act on every weak preference as if it were a strict preference commanding a trade. If we treat "not worse than" as a non-transitive relation that does not always mandate exchange, the pump fails.

  Therefore, the money-pump objection is not a fatal reductio of intransitive value, but a constraint on decision rules. We should bite the bullet on intransitivity. The cost of arbitrary cutoffs in the spectrum is higher than the cost of modifying decision theory. We can maintain that $B$ is genuinely not worse than $A$ (preserving the smoothness of value) while adopting a choice architecture that prevents cycling (preserving rationality). The spectrum shows that "betterness" is not a simple ordering but a textured relation; rationality requires navigating that texture without letting it drain your wallet. Transitivity is a desirable property for choice functions, but demanding it of value itself forces us to lie about the spectrum.

  ***

  (c) **Marking Scheme**

  **Total: 20 Marks (5 Points × 4 Marks Each)**

  | Point | Criteria | Common Pitfall (How students blow it) |
  | :--- | :--- | :--- |
  | **1. Trilemma Identification** | Clearly states the conflict between the endpoint judgment, the stepwise judgment, and transitivity using the specific case numbers. | Vaguely references "the repugnant conclusion" or standard mere addition without engaging the specific 10/10 → 9.9 doubling mechanic provided. |
  | **2. The Cutoff Cost** | Explains why picking a specific break-point implies an arbitrary discontinuity (sorites problem) and why this is theoretically costly. | Asserts a cutoff exists ("there must be a line") without defending why *that* specific step is special or acknowledging the arbitrariness cost. |
  | **3. Value vs. Choice** | Explicitly distinguishes between the axiological relation (betterness) and the decision-theoretic rule (choice/action). | Conflates "A is better than B" with "I must trade A for B," treating value judgments as direct commands to act. |
  | **4. Money Pump Analysis** | Analyzes whether intransitivity *necessarily* leads to exploitation, referencing status quo biases or constrained choice rules to block the pump. | Recites the standard money pump argument as a definitive proof of irrationality without considering modifications to the choice rule. |
  | **5. Committed Stance** | Takes a definitive side (either cutoff or intransitivity) and maintains consistency throughout the argument without hedging. | Hedges ("both sides have merits") or concludes that the problem is unsolvable without attempting to resolve the tension as requested. |
