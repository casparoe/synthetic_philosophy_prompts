answer: |-
  **First, the order.**
  Your instinct to open with the paradox is intellectually seductive but pedagogically risky. If you begin by arguing that the concept is impossible ("If it's good and possible, it's required"), you ask the audience to dismantle a distinction they haven't yet agreed exists. You will spend the first ten minutes arguing about whether morality is demanding rather than what supererogation *is*.

  Instead, **elicit the intuition first.** Begin by asking for examples of acts that are good to do but not wrong to omit. Get the concept on the whiteboard as a *phenomenon* they recognize (the "ordinary distinction"). Only once the tripartite structure (Wrong / Required / Supererogatory) is visible should you apply the pressure ("But why isn't the *best* act *required*?"). This order ensures that when you introduce the paradox, they are defending a position they hold, rather than resisting a definition you are imposing. The paradox belongs in the middle, as the engine of the discussion, not the opening gambit.

  **Second, the case.**
  Your canal case is unstable. The detail about the colleague ("anxious to keep [their] good opinion") introduces motive into a classification that usually depends on the act's status and cost. If the act is done for vanity, a sceptic will argue it isn't morally good at all, which collapses the "good to do" condition. Furthermore, clinicians and engineers may instinctively categorize "rescuing a drowning person" as a professional or civic duty, which collapses the "not wrong to omit" condition.

  A carrying case must have **significant personal cost** (to explain why it isn't required) and **clear moral value** (to explain why it is good). It must lack **professional obligation** and **ambiguous motive**.
  *   **Disqualifiers:** Avoid acts that are legally mandated (rescue), professionally expected (clinicians saving lives), or trivial (holding a door). Avoid "saintly" acts that feel unreachable (Gandhi fasting); the audience must feel *they* could do it but aren't required to.
  *   **Recommendation:** Use **organ donation to a stranger**. It is visceral, undeniably good, involves significant pain/risk/cost, and is universally acknowledged as legally and morally optional. It isolates the structural feature (optionality) without the noise of professional duty or vanity.

  **Third, the misconceptions.**
  Here is the sequence in which they will arise, and how to manage them:

  1.  **"It's just going the extra mile."** (Degree vs. Kind)
      *   *When:* Immediately after definition.
      *   *Fix:* Clarify that supererogation is a deontic status (permission/requirement), not a measure of effort. Doing the bare minimum is not supererogatory; doing the maximum is not necessarily supererogatory (if required).
  2.  **"It's only for heroes."** (Elite vs. Ordinary)
      *   *When:* During the case discussion.
      *   *Fix:* Emphasize small-scale supererogation (e.g., forgiving a debt you could collect).
  3.  **"If omission isn't wrong, the act has no moral weight."** (The Poison)
      *   *When:* When applying the paradox/pressure.
      *   *Fix:* This is the session-killer. If left alone, it collapses the tripartite distinction into a binary (Duty vs. Indifference). You must explicitly block this by distinguishing *blameworthiness* (omission) from *moral value* (act).
  4.  **"Morality is optional."** (The Collapse)
      *   *When:* Near the end.
      *   *Fix:* Clarify that *this specific act* is optional, not the moral law itself.

  **The Poison:** Misconception #3. If the audience concludes that an act whose omission is permitted is morally neutral, supererogation ceases to exist. Head this off the moment someone suggests that "not wrong to omit" means "doesn't matter."

  **Fourth, the check.**
  In the final five minutes, present this scenario:
  *"You have promised to meet a friend for lunch (Duty). On the way, you see a stranger struggling with heavy boxes. Helping them will make you late, breaking your promise. Helping them is good, but keeping your promise is required."*
  Ask: *"Is helping the stranger supererogatory?"*

  *   **Right Answer:** "No, it's forbidden (or at least not supererogatory) because it violates a duty." (This tests if they understand supererogation sits *within* the permissible, not above the required).
  *   **Wrong Answer:** "Yes, it's heroic."
  *   **What it tells you:** If they say "Yes," they think supererogation trumps duty or exists in a vacuum. They have grasped the *glamour* of the concept but missed the *structure*.

  **Fifth, what to refuse.**
  You must explicitly park three topics. Write "Parking Lot" on a corner of the whiteboard and list them:
  1.  **Motive:** "Whether the agent *feels* like doing it matters for virtue, but not for the act's classification."
  2.  **Demandingness:** "Whether morality *should* require this is a question for normative theory; we are mapping the logic of the concepts we currently use."
  3.  **Suberogation:** (The inverse: bad to do, but not wrong). Do not mention this. It introduces a negative symmetry that confuses the primary distinction. If you raise it, you invite a debate on whether 'bad but permitted' exists, which distracts from 'good but not required'.

  To decline these out loud: *"That is a question about which acts fit inside the box. Today we are only building the box."*

  **On the etymology and the Samaritan.**
  *   **Etymology:** Use it. *Supererogatio* (paying out over and above) is perfect for a whiteboard. It counters the "heroism" misconception by grounding the concept in debt and credit, which fits your interdisciplinary audience (engineers/historians). It clarifies that the core logic is about *obligation*, not *drama*.
  *   **Good Samaritan:** Do not use it. You are correct; it is traditionally interpreted as a commandment ("Go and do likewise"), which blurs the line between duty and supererogation. It invites theological debate about the nature of the command, which wastes time.

  **Finally, the weak link.**
  The plan is most likely to fail at the transition from **Intuition to Pressure**. The sharpest person in the room (likely a utilitarian or a consequentialist) will derail the session by arguing: *"If the act produces the best outcome, and morality is about outcomes, then the act is required. Supererogation is just an illusion caused by our reluctance to accept demanding morality."*

  This objection does not just challenge a detail; it denies the logical space for the concept. If this arises, do not try to refute consequentialism in five minutes. Instead, concede the point: *"If you hold that view, this category collapses for you. But most non-philosophers, and many deontologists, operate with a category of 'allowed to not do the best.' We are analysing that structure, not proving it against utilitarianism."* If you fail to bracket this objection, the session becomes a debate about normative ethics rather than an analysis of moral concepts.

  \answer{Anchor the session in the intuitive distinction between duty and option before subjecting it to the philosophical pressure that threatens to collapse it.}
