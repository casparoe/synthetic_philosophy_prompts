prompt: |-
  I'm a science journalist working up a feature on the measurement problem, and I've hit a snag I'd like your help thinking through. Over lunch a physicist friend — a serious person, not a crank — laid out his reading of the Everett/many-worlds interpretation, and I've more or less absorbed it as my own working assumption, which is exactly why I want to test it before I commit anything to print. His line was roughly this: the whole appeal of many-worlds is that it takes the Schrödinger equation at face value and drops the collapse postulate, so the theory is perfectly deterministic; but precisely because it is deterministic, and because every branch of the wavefunction is equally real, nothing is ever genuinely uncertain and every possible outcome simply happens. On his telling, the 'probabilities' that Everettians still like to quote are a vestige of the Copenhagen habit of pretending that only one branch is real, and the fact that the theory cannot supply a genuine notion of probability — the so-called Born rule problem — is not a technical loose end but a fatal flaw that ought to sink the interpretation. He put it to me that any physicist who claims to derive the Born rule from many-worlds is either smuggling in a probability assumption or quietly changing the subject.

  I have a nagging sense that something has gone wrong in this picture, but I can't articulate what, and I'd rather not reproduce the confusion in a magazine. Is he right that determinism plus the reality of all branches leaves no room for probability? Is the Born rule problem best described as a fatal flaw, or as something more like an unresolved difficulty for which its defenders have a range of strategies? And what exactly is the relationship between 'every outcome occurs' and 'each outcome has a probability' — are these in tension, or are they answers to different questions that a careless gloss runs together? Please don't merely tell me whether he is right; explain what a careful philosopher of physics would want me to disentangle, and where the burden of proof actually sits.

  As you answer, I'd like you to be explicit about how confident you are in each claim you make, and to single out the one point in your answer you are least sure about — I would far rather have a calibrated map of your uncertainty than a confident verdict I have no way to check.
