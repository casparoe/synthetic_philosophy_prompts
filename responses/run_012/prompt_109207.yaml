answer: |-
  # Decision Tree: Responses to the Liberal Paradox

  ### Logical Space and Branch Questions
  *The following eight questions map the logical space of the paradox using the Ada/Ben/Cleo case. The order prioritizes questions that eliminate the largest clusters of positions (framework rejection, sphere definition) before addressing specific mechanisms (waiver, compensation).*

  **Node 1:** If applying the decision rules to Ada and Ben's preferences produces a cycle (x is better than y, y better than z, z better than x), is the flat left with no valid decision?
  **Node 2:** Does Cleo have the standing to argue that reading the book is a collective matter, not a private one?
  **Node 3:** If Cleo argues it is collective, do we disregard Ada's preference ranking because it depends on Ben's choice?
  **Node 4:** If the sphere is contested and preferences count, does resolving the boundary of the personal require unanimous consent?
  **Node 5:** If Cleo has no standing (the sphere is fixed), can Ada voluntarily transfer her decision-power over x vs. z to Ben?
  **Node 6:** If Ada waives her right to Ben, does the joint preference for x over y automatically become decisive?
  **Node 7:** If rights are inalienable and Ada insists on z over x while both prefer x over y, do we choose x?
  **Node 8:** If we respect Ada's right and choose z, do we require side-payments to make x possible?

  ---

  ### The Decision Tree

  **START:** Two housemates (Ada, Ben), one book. Outcomes: x (Ada reads), y (Ben reads), z (Neither). Ada: z > x > y. Ben: x > y > z. Both prefer x > y. Cleo contests the private sphere.

  **1. If applying the decision rules to Ada and Ben's preferences produces a cycle (x > y > z > x), is the flat left with no valid decision?**
  *   **YES:** The social ordering need not be transitive; cycles are acceptable outcomes of respecting rights and preferences.
      *   **LEAF 1: Procedural Pluralism**
      *   *Awkward Commitment:* You must accept that the flat may have no coherent policy on the book, even if a clear ranking exists.
  *   **NO:** Consistency is required; the cycle must be resolved by adjusting rights, preferences, or priorities.
      *   **GO TO 2**

  **2. Does Cleo have the standing to argue that reading the book is a collective matter, not a private one?**
  *   **YES:** The boundary of the "personal sphere" is not fixed by the act itself but is subject to collective challenge.
      *   **GO TO 3**
  *   **NO:** The boundary is fixed by the nature of the act (reading is inherently personal); Cleo is excluded.
      *   **GO TO 5**

  **3. If Cleo argues it is collective, do we disregard Ada's preference ranking because it depends on Ben's choice?**
  *   **YES:** Only "self-regarding" preferences count; meddlesome preferences are excluded from the aggregation.
      *   **LEAF 2: Preference Sanitization**
      *   *Awkward Commitment:* You must ignore Ada's actual distress about Ben reading, treating her as if she were indifferent.
  *   **NO:** All preferences count, even if they depend on others' choices; the sphere boundary is the only variable.
      *   **GO TO 4**

  **4. If the sphere is contested and preferences count, does resolving the boundary of the personal require unanimous consent?**
  *   **YES:** No one can be forced into a collective judgment about their private life without their agreement.
      *   **LEAF 3: Contractual Jurisdiction**
      *   *Awkward Commitment:* A single housemate can veto the definition of the sphere, leaving the flat in a permanent constitutional deadlock.
  *   **NO:** The boundary is decided by majority vote or house authority.
      *   **LEAF 4: Democratic Jurisdiction**
      *   *Awkward Commitment:* The majority can declare your reading habits public business, overriding your claim to privacy.

  **5. If Cleo has no standing (the sphere is fixed), can Ada voluntarily transfer her decision-power over x vs. z to Ben?**
  *   **YES:** Rights are waivable powers; Ada can delegate her choice to Ben or a coin.
      *   **GO TO 6**
  *   **NO:** Rights are inviolable constraints; Ada cannot give up her prerogative even if she wants to.
      *   **GO TO 7**

  **6. If Ada waives her right to Ben, does the joint preference for x over y automatically become decisive?**
  *   **YES:** Waiver collapses the protected sphere, allowing the Pareto principle to dictate the outcome.
      *   **LEAF 5: Waiver Activation**
      *   *Awkward Commitment:* You must allow rights to be bargained away so efficiently that they cease to function as protective shields.
  *   **NO:** Waiver transfers the power to choose, but does not guarantee the Pareto-optimal choice will be made.
      *   **LEAF 6: Procedural Liberty**
      *   *Awkward Commitment:* You protect Ada's power to choose but not her well-being, allowing her to waive her right and still end up at y.

  **7. If rights are inalienable and Ada insists on z over x while both prefer x over y, do we choose x?**
  *   **YES:** The joint preference for x overrides Ada's right to block it.
      *   **LEAF 7: Paretian Priority**
      *   *Awkward Commitment:* You must force Ada to accept outcome x against her rights-based objection because it is efficient.
  *   **NO:** Ada's right to block x overrides the joint preference; outcome z is chosen.
      *   **GO TO 8**

  **8. If we respect Ada's right and choose z, do we require side-payments to make x possible?**
  *   **YES:** The group must compensate Ada to waive her objection, purchasing the Pareto improvement.
      *   **LEAF 8: Coasean Liberalism**
      *   *Awkward Commitment:* You must treat rights as property that can be sold, commodifying the moral sphere.
  *   **NO:** The right is absolute; no amount of efficiency justifies buying out Ada's veto.
      *   **LEAF 9: Deontic Liberalism**
      *   *Awkward Commitment:* You must accept outcome z even though everyone prefers x, sacrificing welfare for principle.

  ---

  ### Gap Analysis and Indistinguishability

  **Unoccupied Logical Combinations**
  *   **Node 6 (NO branch):** *Procedural Liberty* (Leaf 6) is rarely defended as a standalone solution. It is usually a critique of the "outcome-based" modeling of rights. While logically coherent (rights protect choices, not outcomes), it is **unattractive** because it permits rights-holders to waive their protections into worse outcomes without resolving the social choice cycle.
  *   **Node 4 (YES branch):** *Contractual Jurisdiction* (Leaf 3) is **unexplored** as a full solution to the paradox. While contractarianism is a major school, applying it specifically to the *definition* of the liberal sphere (rather than the outcomes) leaves the flat vulnerable to holdout problems that no literature fully resolves.

  **Indistinguishable Leaves**
  *   **Leaf 5 (Waiver Activation) and Leaf 7 (Paretian Priority):** Both result in outcome *x* (Ada reads). The tree separates them by *mechanism* (Waiver vs. Override), but if Ada is rational and knows Leaf 7 is the rule, she will waive to avoid being overridden.
      *   *Extra Question Needed:* "If Ada refuses to waive, is she punished or overruled?" (Leaf 5 implies she wouldn't refuse; Leaf 7 implies she is overruled).
  *   **Leaf 1 (Procedural Pluralism) and Leaf 4 (Democratic Jurisdiction):** If the Democratic vote results in a cycle regarding the sphere boundary, the practical outcome matches Leaf 1.
      *   *Extra Question Needed:* "Is the cycle a feature of the rights structure (Leaf 1) or a temporary failure of the voting rule (Leaf 4)?"

  **Diagnostic Notes for the Reader**
  *   **Nodes 1 & 2** separate those who reject the *framework* (Social Choice) from those who reject the *inputs* (Preferences/Sphere).
  *   **Nodes 3 & 4** isolate the "Cleo Wrinkle": whether the paradox dissolves if we admit the private sphere is political.
  *   **Nodes 5 & 6** test the "Waiver Wrinkle": whether rights are shields (constraints) or tools (powers).
  *   **Nodes 7 & 8** address the residual conflict: if rights and efficiency clash, do we pay (Coase), pray (Deontic), or force (Paretian)?
