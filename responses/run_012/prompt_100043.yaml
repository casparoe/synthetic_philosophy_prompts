answer: |-
  This is one of the most satisfyingly weird corners of mathematics. You are right to feel uneasy; the strategy-stealing argument feels like a magic trick where the rabbit is pulled out of the hat, but nobody shows you the hat beforehand.

  Here is the breakdown of what is actually happening, why the conditions matter, and the specific mechanics of Hex.

  ### 1. The Ontology: In what sense does the strategy "exist"?

  You asked if "there exists a strategy" is doing the same job as a strategy you could actually play. The short answer is **no**.

  In classical mathematics, existence and constructibility are different categories.
  *   **Constructive:** "Here is the recipe. Follow steps A, B, and C to win."
  *   **Non-constructive (Strategy Stealing):** "The set of winning strategies is not empty."

  Think of it like this: Imagine I lock a key inside a room. I can prove to you that **a key exists in the room** (because I put it there, and the room is sealed). However, I cannot tell you **which pocket of which jacket** the key is in without searching the room.

  The strategy-stealing proof tells you the key is in the room. It does not tell you where the key is.
  *   **Is it a real object?** Yes. In game theory, a strategy is a function that maps every possible board state to a move. That function exists mathematically.
  *   **Is it playable?** Not by you or me. Because we don't know the function, we can't execute it. A "perfect player" (an oracle) would know it, but humans cannot access it via this proof.

  **The Sleight of Hand:** The sleight of hand isn't in the logic; it's in the expectation. We usually want math to tell us *how* to do things. Here, math is only telling us *that* it can be done. It is a proof of **inevitability**, not **method**.

  ### 2. The Three Pillars: Why the argument needs specific conditions

  You guessed three conditions: symmetry, extra moves never hurting, and no draws. You are very close, but let's refine them, because this explains why Chess breaks.

  #### (A) Symmetry (Actually: Move Availability)
  Strict board symmetry isn't actually required (Chomp is played on a rectangular grid which isn't rotationally symmetric, yet strategy stealing works). What is required is that **Player 1 can make a move and then have access to all of Player 2's potential responses.**

  In Hex or Chomp, P1 makes a move, and the board is still open enough that P1 can pretend to be P2. In some games, a move might permanently close off a section of the board that the "winning strategy" would have needed to access. The argument requires that P1's "dummy move" doesn't brick off the path to victory.

  #### (B) Monotonicity (The "Extra Move Never Hurts" Rule)
  This is the big one. This is the condition that **Chess violates.**

  In Hex and Chomp, resources are cumulative.
  *   **Hex:** More stones = more connections.
  *   **Chomp:** Eating a square removes options for the opponent, never for you.

  In Chess, resources can be liabilities. This is called **Zugzwang**. In Zugzwang, having the *obligation* to move is a disadvantage. If you could "pass," you would be better off.
  *   **Why Chess breaks:** Strategy stealing requires P1 to make a "dummy move" (a random move) and then pretend it didn't happen. In Chess, that dummy move might block your own King's escape route, clog your Bishop's diagonal, or waste a tempo. If P2's hypothetical winning strategy relies on P1 *not* having played that specific pawn move, P1 cannot steal it. The extra move *changed the state* in a way that invalidated the strategy.

  #### (C) No Draws
  The proof works by contradiction:
  1.  Assume P2 has a winning strategy.
  2.  Show P1 can steal it to win.
  3.  Contradiction (both can't win).
  4.  Therefore, P2 cannot have a winning strategy.

  If draws are possible, the logic becomes: "P2 has a strategy to **not lose**." If P1 steals it, P1 guarantees they **don't lose**. This leads to the conclusion "P1 can force a Draw or Win." It does not prove P1 wins. It leaves the door open for the game to be a theoretical draw (which Chess likely is).

  ### 3. Proof vs. Assumption

  It is a **Proof**, but it relies on **Assumptions about the Game Rules.**

  When people call it an "argument," they usually mean it is an informal proof (not written in dense symbolic logic). When people call it an "assumption," they are being sloppy. They usually mean, "We are assuming the game satisfies the conditions of monotonicity and no draws."

  If the game rules satisfy the conditions, the conclusion (P1 wins) is mathematically necessary. It is not an assumption that P1 wins; it is a derived truth based on the axioms of the game.

  ### 4. The Hex Deep Dive: Why an extra stone is never a disadvantage

  This is the crux of your confusion, and it is where the whole thing lives or dies.

  In Chess, a piece is an actor. It moves, it threatens, it blocks.
  In Hex, a stone is **terrain**. It is a permanent bridge.

  **The Graph Theory View:**
  Imagine the Hex board as a graph. Your stones are nodes that are "turned on." A win condition is a path of "on" nodes connecting your two sides.
  *   If you have a set of stones $S$ that creates a path, and I give you an extra stone $x$ to add to that set ($S + \{x\}$), can you lose the path?
  *   **No.** Adding a node to a graph cannot delete existing edges. It can only create new connections.
  *   Therefore, having a superset of stones is always $\ge$ in value to having a subset of stones.

  **The "Ghost Stone" Mechanism:**
  Here is exactly how the steal works in Hex, step-by-step, to show why the extra stone doesn't break the logic.

  1.  **The Assumption:** Assume P2 has a Winning Strategy ($W$). This strategy is a function: "If the board looks like *this*, play *there*."
  2.  **The Theft:** P1 places a stone anywhere (call it the **Redundant Stone**). Let's say at spot $Z$.
  3.  **The Pretend:** For the rest of the game, P1 ignores their stone at $Z$. They look at the board, pretend $Z$ is empty, and ask Strategy $W$: "What would P2 play here?"
  4.  **The Conflict:** Strategy $W$ might eventually say: "Play at spot $Z$."
      *   *Problem:* Spot $Z$ is already occupied by P1's Redundant Stone.
      *   *Solution:* P1 cannot play at $Z$. So P1 plays a **random move** somewhere else, say spot $Q$.
  5.  **The Result:**
      *   Strategy $W$ assumed P1 would eventually occupy $Z$. P1 *already* occupies $Z$.
      *   Strategy $W$ assumed P1 would *not* occupy $Q$ yet. P1 *does* occupy $Q$.
      *   So, P1's actual board state is **Strategy's Board + Extra Stone at $Q$**.
  6.  **The Payoff:** Because of **Monotonicity** (extra stones never hurt), having the Strategy's Board **plus** an extra stone at $Q$ is strictly better than (or equal to) just having the Strategy's Board.
      *   If the Strategy guaranteed a win with the original stones, it definitely guarantees a win with *more* stones.
      *   The "interference" of the Redundant Stone didn't block the path; it just added more pavement to the road.

  **Why this fails in other games:**
  *   **Chess:** If Strategy $W$ says "Move Knight to F3," but you already moved a Pawn to F3 (your Redundant Stone), you have blocked your own Knight. The extra piece hurt you.
  *   **Go:** If Strategy $W$ says "Play here to make eyes," but you already have a stone there (Redundant Stone) that reduces your own liberties, you might accidentally kill your own group. In Go, stones can be a burden (liberties). In Hex, stones are only assets (connectivity).

  ### Summary
  The strategy-stealing argument is a non-constructive proof that relies on the game being **monotonic** (resources only help) and **determinate** (no draws).

  *   **Does the strategy exist?** Yes, as a mathematical function, but we don't know its code.
  *   **Why not Chess?** Because in Chess, an extra move can be a liability (Zugzwang) and draws are possible.
  *   **Why Hex?** Because a Hex stone is permanent terrain. Adding terrain to a path-finding problem can never make the path impossible if it was already possible.

  The "magic" is simply that we can prove the *map* exists without ever seeing the *territory*.
