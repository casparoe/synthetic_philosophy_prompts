answer: |-
  This is a classic case of a popular biography taking a complex intellectual history and streamlining it into a character-driven narrative. The story you've been told is not *false*, but it is causally confused. It treats Hobbes's mathematical failure as the *cause* of his political marginalization, when in reality, they were parallel tracks that intersected mostly in the person of John Wallis.

  Here is the breakdown of where the biography is solid, where it flattens the history, and where your reading group colleague is actually closer to the mark (even if she overgeneralizes).

  ### 1. The Euclid Conversion and Method
  **The Verdict:** Mostly Solid, but Romanticized.
  The story comes from John Aubrey's *Brief Lives*, our main biographical source for Hobbes. The core truth is that Hobbes became obsessed with the *certainty* of geometry. He wanted political philosophy to have the same indisputable quality as a geometric proof. If you accept the definitions, you must accept the conclusion.
  **The Nuance:** The biography implies Hobbes simply copied Euclid's style. In reality, Hobbes was trying to create a "Civil Science." He believed that because humans create political structures (commonwealths), we can understand them the way a geometer understands a circle—because we made them. God understands nature because He made it; the Sovereign understands the state because he sustains it; the Philosopher understands both because he deduces them from first principles.
  **The Flattening:** Calling him the "Euclid of Politics" ignores that Hobbes relied heavily on *rhetoric*. Euclid doesn't need to persuade you; the proof does the work. Hobbes knew his premises (that humans are vainglorious, competitive atoms) were controversial. He spent half his time doing "geometry" and the other half using terrifying imagery (the State of Nature, the Leviathan) to bully you into accepting the axioms.

  ### 2. The Math Feud (Hobbes vs. Wallis)
  **The Verdict:** Solid on Facts, Misleading on Motive.
  Hobbes did claim to square the circle. He was wrong. Wallis did demolish him. The pamphlet war did last decades.
  **The Nuance:** Describing this as "wounded vanity" is journalist shorthand for a deep epistemological rift. Hobbes believed geometry was about *magnitudes and bodies*. Wallis (and the new algebraists) were moving toward abstract symbols and infinitesimals. Hobbes thought Wallis's math was mystical gibberish; Wallis thought Hobbes was an arrogant amateur.
  **Why it matters:** It wasn't just that Hobbes was bad at math. It was that Hobbes represented the "Old Science" (Galilean resolution and composition, deductive) while Wallis was a founder of the Royal Society, representing the "New Science" (experimental, inductive, probabilistic). Hobbes hated the Royal Society. He thought experiment yielded only probability, not truth. The math fight was a proxy war for the soul of science.

  ### 3. The Impact on His Reputation
  **The Verdict:** Flat Wrong.
  This is the biography's biggest error. Hobbes's political philosophy was condemned and celebrated *before* the math feud reached its peak.
  *   **Timeline:** *Leviathan* was published in 1651. It was immediately controversial for its Erastianism (church subordinate to state) and its materialist theology (which looked like atheism). The Cavalier exiles hated him for justifying the de facto power of Cromwell; the Clergy hated him for undermining their independence; the Parliamentarians hated him for arguing for absolute sovereignty.
  *   **The Math Factor:** The math feud (peaking 1655–1660s) made him a laughingstock among *mathematicians* and natural philosophers. It gave his enemies an easy ad hominem weapon ("He can't even measure a circle, why listen to him on the state?"). But the *substantive* rejection of his politics came from theologians and legal scholars, not geometers.
  *   **Your Reading Group Friend:** She is closer to the truth. The battle was indeed about the universities (Oxford, where Wallis was) and the clergy. Hobbes wanted to reform the universities to teach his philosophy; the universities burned his books. The math was just the sharpest stick Wallis had to beat him with.

  ### 4. The Moral (Ethics and Geometry)
  **The Verdict:** Oversimplified.
  The lesson isn't "don't do ethics geometrically." The lesson is "be careful where your axioms come from." In geometry, definitions are stipulative (we agree what a 'line' is). In politics, definitions are contested (what is 'liberty'? what is 'justice'?). Hobbes's failure wasn't using deduction; it was assuming his psychological axioms were as self-evident as Euclid's postulates. They weren't. But note: Spinoza tried to do ethics geometrically (*Ethica Ordine Geometrico Demonstrata*) immediately after Hobbes, and Rawls used a quasi-geometric "original position" in the 20th century. The method isn't dead; the claim to *absolute certainty* is what died.

  ***

  ### Summary Table

  | Claim from Biography | Verdict | What Specifically Is Off | Better Version |
  | :--- | :--- | :--- | :--- |
  | **Hobbes discovered Euclid at 40 and was converted "on the spot."** | **Solid** | Minor romanticization of Aubrey's anecdote. | Hobbes discovered Euclid in his 40s and it fundamentally shaped his *ideal* of knowledge, though he had been studying human nature prior. |
  | **His political books are deductive systems modeled on geometry.** | **Oversimplified** | Ignores the heavy reliance on rhetoric, psychology, and persuasion. | Hobbes *aspired* to a deductive civil science, but relied on rhetorical fear and psychological observation to make the axioms palatable. |
  | **Hobbes was "no good at mathematics."** | **Misleading** | He translated Euclid and understood fundamentals; he failed at *advanced* problems. | Hobbes was competent in classical geometry but stubbornly rejected new algebraic methods, leading to specific, famous errors. |
  | **He squared the circle; Wallis proved him wrong; Hobbes refused to concede due to vanity.** | **Solid** | "Vanity" reduces an epistemological dispute to psychology. | Hobbes refused to concede because he believed Wallis's methods were conceptually incoherent, not just because he was proud. |
  | **The failure of his geometry is why his political philosophy was dismissed.** | **Flat Wrong** | Reverses causality and ignores theological/legal opposition. | His politics were dismissed primarily for religious and royalist reasons; the math failure merely provided enemies with ammunition for ridicule. |
  | **The feud was about math, not science or institutions.** | **Misleading** | Ignores the Royal Society vs. Hobbes context. | The feud was a proxy war between Hobbes's deductive rationalism and the Royal Society's experimentalism (Wallis's camp). |
  | **The story stands as a warning against doing ethics geometrically.** | **Oversimplified** | Implies the method is inherently flawed rather than the application. | The warning is against claiming *geometric certainty* for political axioms that are actually contestable definitions. |

  ### Recommendation for Your Reading Group
  Tell them the biography is right about the *math* but wrong about the *consequences*. The "Circle Squaring" is a tragic footnote to Hobbes's life, not the explanation for his infamy.

  If you want to understand why Hobbes was hated, look at his theology (he scared the clergy) and his legal theory (he scared the lawyers). If you want to understand why Hobbes is respected today despite the math, look at how he framed political obligation not as divine duty, but as a rational calculation of self-interest. That insight survived the geometry war intact.
