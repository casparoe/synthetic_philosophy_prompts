  2.  **Initial Knowledge Retrieval & Fact-Checking:**
      *   *Hobbes & Euclid:* Yes, the story about discovering Euclid at age 40 in a gentleman's library (likely the Earl of Devonshire's) is standard biographical fare (from Aubrey's *Brief Lives*). It's generally accepted as a turning point in his methodological thinking.
      *   *Method:* Hobbes *did* aim for a deductive, civil science modeled on geometry. *Leviathan* and *De Cive* are structured logically. However, calling it purely "geometric" flattens the role of rhetoric and psychology.
      *   *The Squaring of the Circle:* Hobbes *did* claim to square the circle. He *did* fight with John Wallis (Savilian Professor of Geometry at Oxford). This lasted for decades.
      *   *Impact on Reputation:* Did the math failure kill his political philosophy? This is the contentious part. Hobbes was controversial *before* the math fights peaked (due to royalism, atheism accusations, Erastianism). The math fights made him a laughing stock among mathematicians, but his political influence remained potent (especially after the Restoration, despite the ban).
      *   *Wallis & The Royal Society:* The user's reading group member mentions "experimental science." This is crucial. Wallis was a founder of the Royal Society. Hobbes hated the Royal Society's experimental method (inductive) vs. his deductive method. The feud was indeed partly ideological (deductive rationalism vs. experimentalism) and institutional (Oxford vs. Court/Exiles).
      *   *The "Moral":* Is "don't do ethics geometrically" the right lesson? Modern political philosophy (Rawls, etc.) still uses contractarian/deductive methods. The lesson is more about the limits of deduction when premises are contestable, not that the method itself is inherently fatal.

  3.  **Drafting the Analysis (Section by Section):**

      *   **The Euclid Conversion:** Accept the core truth but nuance the "on the spot" aspect. It shaped his *ambition* for certainty, not necessarily the *content* of every argument.
      *   **Hobbes as the Euclid of Politics:** This is a strong metaphor but needs qualification. He wanted to be, but human passions make the "axioms" wobbly compared to lines and points. Also, he uses rhetoric heavily, which Euclid doesn't need.
      *   **The Math Feud (Hobbes vs. Wallis):** It's true he claimed to square the circle. It's true he lost. But "wounded vanity" is too psychological/simple. It was about the *nature of knowledge*. Hobbes thought geometry was about construction (making), Wallis about calculation/abstraction.
      *   **Why His Reputation Suffered:** This is the biggest oversimplification in the biography. Hobbes was hated/loved for *politics* and *religion* (atheism, absolutism) first. The math stuff made him look senile/cranky later, but the *condemnation* of his political work came from Clergy and Parliament, not mathematicians. The reading group friend is half-right: it's about the Royal Society/Universities, but not *just* that.
      *   **The Moral:** "Warning about doing ethics geometrically" is too glib. The real warning is about *foundationalism*. If your axioms (human nature) are wrong, your theorems (sovereignty) collapse.

