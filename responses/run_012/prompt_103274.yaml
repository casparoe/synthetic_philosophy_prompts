  When material continuity and behavioral continuity come apart, determine identity by deciding whether the object persists by enduring as a whole through change or perduring as a sequence of temporal stages, prioritizing the view that preserves the object's historical testimony.

  ### **Collections Identity Procedure (CIP-04)**

  **1. Define the Object's Sortal and Metaphysical Status**
  Identify the kind of thing you are handling (e.g., vehicle, building, software). This determines its persistence conditions.
  *   **Correction on Endurantism:** Your gloss stated objects persist by "having different properties at different times." Strictly, endurantists argue an object is wholly present at every moment and avoids contradiction by having properties *relative to times* (e.g., "bent-at-1990" vs. "straight-at-2024"), not by changing its essential self.
  *   **Correction on Perdurantism:** Your gloss is accurate: the object is a four-dimensional "worm" extending through time, where each moment is a distinct temporal part.
  *   **Action:** Assign a default stance. Mechanical objects and buildings usually follow **Perdurantism** (history matters more than current matter). Unique art objects usually follow **Endurantism** (specific matter matters more than history). [JUDGMENT CALL]

  **2. Run the Temporary Intrinsics Test**
  Ask: "Can this object possess incompatible properties at different times without ceasing to be itself?"
  *   **Example:** Can the locomotive be "has original boiler" in 1897 and "has replacement boiler" in 2024 and still be the *same* locomotive?
  *   **If Yes (Perdurantist Lean):** Identity is maintained through causal continuity. You are tracking a timeline. Replacement parts are just new temporal stages.
  *   **If No (Endurantist Lean):** Identity is tied to specific matter. Significant material change creates a new object.
  *   **Stop Condition:** If the object fails the test for its assigned sortal (e.g., a painting loses its original canvas), identity is broken. Return a flat **No** on original status.

  **3. Assess Causal History vs. Material Composition**
  *   **Causal History:** Is there an unbroken chain of custody and maintenance? (Perdurantist priority).
  *   **Material Composition:** What percentage of original matter remains, and is it structurally critical? (Endurantist priority).
  *   **Action:** If causal history is unbroken but material is <50% original, classify as **Original (Restored)**. If causal history is broken (e.g., rebuilt from drawings after scrapping) but material is >50% original (e.g., reused scrap), classify as **Composite/Reconstruction**. [JUDGMENT CALL]

  **4. Resolve the Counting Question**
  *   **Locomotive + Spare Boiler:** Under the four-dimensional picture, you are accessioning the *whole worm* (the entire history), but you physically possess only the *current stage*.
  *   **Ownership Status:** You do not own an "undivided interest." You own the legal right to claim the temporal stages of the object.
  *   **Counting Rule:** If the spare boiler is not integrated, it is a separate temporal worm. Accession it separately. If it is designated as a future replacement part within the maintenance plan, it may be logged as a component of the primary accession, but legally it remains a distinct object until integration.
  *   **Action:** Assign separate accession numbers to detached major components unless the deed of gift explicitly binds them as inseparable temporal parts.

  **5. Escalation and Indeterminacy**
  *   **Escalate to Director:** When the Temporary Intrinsics Test yields conflicting results (e.g., matter says "No," history says "Yes") and the object is high-value or high-profile.
  *   **Indeterminate Cases:** Some questions have no determinate answer and are merely bookkeeping conventions. If the decision rests solely on whether "location" is essential to a building's identity (e.g., a moved house), mark the record as **Convention-Based Identity**. This acknowledges that calling it the "same house" is a useful fiction for cataloging, not a metaphysical truth.

  ---

  ### **Case Applications**

  **1. The 1897 Locomotive (Heavily Restored)**
  *   **Sortal:** Mechanical Vehicle (Perdurantist default).
  *   **Temporary Intrinsics:** Can it be "original boiler" and "new boiler"? Yes, if the replacement was part of continuous maintenance.
  *   **Causal History:** Check maintenance logs. If the engine was scrapped and rebuilt from drawings in 1990, the causal chain is broken.
  *   **Outcome:** **Flat No.** If the restoration involved rebuilding from drawings rather than continuous repair, the causal worm is severed. It is a 1990 reconstruction of an 1897 design.
  *   **Reaction:** Curators will hate this. They want the "1897" label for the exhibition. You must label it "1990 Reconstruction of 1897 Engine."

  **2. The Timber-Framed House (Moved 1974)**
  *   **Sortal:** Building (Perdurantist default, but location-sensitive).
  *   **Temporary Intrinsics:** Can it be "in Location A" and "in Location B"? Yes, if moved intact.
  *   **Causal History:** Dismantled and re-erected. 1/3 new timber.
  *   **Outcome:** **Convention-Based Identity.** The causal chain exists, but the location change tests the sortal. Mark as "Relocated Structure."
  *   **Reaction:** Donors will accept this, but note that the identity is contingent on our convention that houses can move.

  **3. The Re-implemented Software Piece**
  *   **Sortal:** Media Art (Endurantist default, hardware-specific).
  *   **Temporary Intrinsics:** Can it be "runs on Hardware A" and "runs on Hardware B"? No, if the art is defined by the original experience.
  *   **Causal History:** Code migrated to new hardware artist never saw.
  *   **Outcome:** **New Object.** The original temporal stage (original hardware) is gone. The new implementation is a distinct temporal worm, even if the code is identical. Accession as "Iteration 2."
  *   **Reaction:** Curators will hate this. They want to exhibit the "original piece." You must label it "Migration/Re-implementation."

  ---

  ### **Limitations and Misfires**

  *   **What It Cannot Do:** This procedure cannot resolve legal title disputes or donor ego conflicts. It cannot determine aesthetic value; a "reconstruction" may be more historically valuable than a degraded "original."
  *   **Where It Will Misfire:** It will misfire on objects where the "sortal" is disputed (e.g., is a software piece the code, the hardware, or the performance?). In these cases, Step 1 becomes a philosophical debate rather than a procedural step.
  *   **The Indeterminacy Trap:** Be aware that for the moved house, you are not discovering the truth; you are choosing a cataloging convention. Do not present this as a metaphysical fact to the donor.
  *   **Judgment Call Warning:** Step 3 (Causal History) relies on documentation that often does not exist. When logs are missing, you must default to the conservative Endurantist view (assume identity is broken) to protect the museum from accreditation risks.
