      *   *Ranking Tensions:*
          1.  **Fatal:** (4) "One outcome/One world" vs. (2)+(3)+(4) "Unitary/Psi-ontic/Complete". This is the Measurement Problem.
          2.  **Severe:** (5) "Epistemic Probabilities" vs. (3)+(4) "Complete+Deterministic". If the state is all there is and evolves deterministically, what are you ignorant of?
