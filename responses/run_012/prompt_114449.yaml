          *   Grandmother: Believes marriage = kids/traditional. Sincere, not malicious.
          *   Cynical Friends: Think marriage is reactionary/embarrassing for queer people.
          *   Old Friend: Asked "What's the difference between this and two best friends promising to stick together?" (Needs a real answer).
      *   **Constraint 3 (Tone/Style):** 5 minutes, warm, ideally funny, no lecture, no campaign speech. Must take a position but not argue with the audience.
      *   **Key Insight/Input:** The couple said they wanted to be *bound*. They wanted a reason for staying that neither could make for herself alone. They wanted the public witness to create that bond.
      *   **Goal:** Validate the institution of marriage without validating traditionalism (kids) or assimilation (being just like everyone else), while answering the "why not just friendship?" question.

  2.  **Deconstruct the Core Conflict:**

      *   *Grandma:* Marriage is a vessel for family/children.
      *   *Cynics:* Marriage is a trap/assimilation.
      *   *Friend:* Marriage is just a label on friendship.
      *   *Couple:* Marriage is a *binding constraint* chosen voluntarily to create resilience.

      *   *The Challenge:* How to honor Grandma without lying about kids? How to honor the Cynics without agreeing marriage is pointless? How to answer the Friend without getting philosophical/boring?
      *   *The Solution:* Focus on the *structure* and the *witness*, not the *content* (kids/romance). Marriage isn't about what you do inside it (kids, sex, romance); it's about the container itself. It's about the "harder thing."

  3.  **Drafting - Section by Section:**

