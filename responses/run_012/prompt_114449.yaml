answer: |-
  Good evening. For those who don't know me, I'm [Your Name]. I've had the privilege of knowing [Bride] for [Number] years, which means I've had the privilege of knowing [Partner] for most of them, too.

  When [Bride] asked me to give this toast, she gave me a brief. It was very specific. She said, "Please don't do the 'love is love' bit." And she said, "Please don't treat today like a formality, like we're just putting a sticker on a relationship that's already finished."

  She said she wanted someone to say something true about what marriage is actually *for*.

  I said, "Sure, easy." And then I went home and realized that is the hardest thing anyone has ever asked me to do. Especially looking around this room.

  We have people here who believe marriage is a sacred, traditional institution for building a family. We have people here who think marriage is an outdated system that we shouldn't be aspiring to join. And we have people who love you both deeply and are genuinely asking: "What does this ceremony add that nine years of friendship and partnership hasn't already built?"

  Those are conflicting truths. But I think [Bride] and [Partner] have found the thread that ties them together.

  When I asked them why they were doing this—why add the legal paperwork, the party, the ceremony—they didn't talk about romance. They didn't talk about rights, or taxes, or assimilation.

  They said: "We want to be bound."

  They said they wanted a reason for staying that neither of them could make for herself alone.

  And I think that is the answer to the question. What is the difference between this and two best friends promising to stick together forever?

  Friendship is free. It is organic. It relies on mutual affection and shared history. But because it is free, it is also easy to leave. If the wind blows hard enough, a friendship can drift. And that doesn't mean the friendship wasn't real. It just means it wasn't structured to withstand a specific kind of storm.

  Marriage is not freedom. Marriage is a structure. It is a chosen constraint.

  To [Bride]'s grandmother: You are right that marriage is a vessel for family. But a family isn't defined only by children. A family is defined by permanence. It is the decision to build a unit that is harder to break than the individual feelings of the people inside it.

  To their friends who worry about the institution: You are right that marriage is heavy. It carries history. But [Bride] and [Partner] aren't trying to be normal. They are trying to be anchored. They are taking an old, heavy tool and using it to build something entirely their own. They aren't assimilating into the system; they are harnessing its weight to hold them down when the weather gets bad.

  And to the friend who asked what the promise adds: The promise adds *us*.

  That is the secret. A private promise is between two people. A public vow is between two people and their community. By standing here, by saying "I witness this," we are no longer just guests. We are stakeholders. We are the net.

  When things are hard—and they will be hard—they can look back at this room. They can remember that we saw them make this promise. We are the external memory of their commitment. That is what the ceremony is for. It transforms a private understanding into a public fact.

  [Bride] and [Partner], you said you wanted to be bound.

  Look around. These are the ropes.

  We promise to hold you to this. We promise to remind you, when you forget, that you chose this difficulty because it yields a specific kind of safety. You chose to make it harder to leave, so that you are forced to find the way through.

  That is what marriage is for. It is not just a celebration of where you have been. It is a mechanism for where you are going. It is the trellis you build so the vine has something to climb when the ground gets uneven.

  So, if everyone could raise a glass.

  To [Bride] and [Partner]. May you never be too free to leave, and always bound enough to stay. May you find safety in the structure, and may you find that the weight of this promise makes the lightness of your joy even brighter.

  To the bound and the held. Cheers.
