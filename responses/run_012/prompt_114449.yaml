      Hi everyone. She gave me a hard job. No "love is love." Okay. So what is it? My friend asked why not just be friends. Because friends can quit. Marriage is harder. Grandma thinks it's for kids. It can be, but today it's for *them*. Cynics think it's square. It is square. But squares hold things up. They want to be bound. So we are the ropes. Cheers.

