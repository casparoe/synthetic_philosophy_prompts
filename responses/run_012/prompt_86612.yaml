prompt: |-
  Bit of an odd one, sorry. My flatmate's got really into this Integrated Information Theory stuff — he says consciousness is basically a number, they call it phi, and anything with the right kind of wiring has at least a tiny bit of it. He's now trying to sell 'consciousness certificates' to shops on our high street (apparently his rubber plant scores higher than his laptop). I want to take the mickey out of the whole certifying-a-consciousness business, but in a totally deadpan way, so he can't just say I'm being nasty.

  Could you write it as a consumer-magazine review, like a Which? piece — 'we tested eight household objects to see how conscious they are' — about 600 words, no winking at the reader anywhere. The funny has to come from the theory being right, not from me misrepresenting it. So the bits I want it to quietly get right: you're only ever allowed one consciousness per object, even if there's a smaller clever bit inside it; a dead simple thing can score a tiny non-zero amount, which is definately a bit of a problem; something can behave exactly like a person and still score zero if its wiring only goes one way with no loops back; and nobody can actually measure any of it, yet the certificates get issued anyway. Don't name any real people and don't go after the scientists — go after the certificate-selling side of it. Ta.
