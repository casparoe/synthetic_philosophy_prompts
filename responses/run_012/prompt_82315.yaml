answer: |-
  # JOINT STATEMENT ON THE DOLLAR AUCTION PHENOMENON

  **Date:** October 26, 2023
  **Parties:** Proponent of the Error Theory (E) and Proponent of the Structural Reading (S)
  **Subject:** Conditions of Disagreement Regarding Escalation in All-Pay Auctions

  ## I. AGREED CLAIMS

  The undersigned agree to the following propositions as the common ground for this dispute. These claims describe the mechanics of the game, the observed behavior of agents, and the logical constraints on entry, without prejudging the rationality of the escalation phase.

  1.  **Game Structure:** The auction involves a prize of fixed public value $V$. Bids increase by a fixed increment $\delta$. The highest bidder pays their bid $B_1$ and receives $V$. The second-highest bidder pays their bid $B_2$ and receives nothing. All other bidders pay nothing.
  2.  **Entry Condition:** A rational agent who anticipates with certainty that the final bids will satisfy $(B_1 + B_2) > V$ possesses a decisive reason to decline entry prior to the first bid.
  3.  **Observed Phenomenon:** In experimental and informal settings, bidding routinely continues until $B_1 > V$. At termination, the sum of payments $(B_1 + B_2)$ frequently exceeds $V$, resulting in a net aggregate loss for the participants relative to the status quo ante.
  4.  **Sequential Decision Nodes:** At any point during the auction where an agent is the second-highest bidder with bid $B_2$, the choice is binary: (a) Stop, pay $B_2$, and receive 0; or (b) Bid $B_2 + \delta$, becoming the highest bidder, with the risk of eventually paying $B_2 + \delta$ (or more) if outbid.
  5.  **Preference Complexity:** Agents possess preferences over outcomes that include, but are not necessarily limited to, net monetary gain. These may include preferences regarding relative standing, avoidance of perceived waste, and consistency with past actions.
  6.  **Reproducibility:** The escalation pattern is robust across different groups of participants and is not eliminated by simple verbal warnings regarding the trap prior to the start of the auction.

  ## II. STATEMENT OF DISPUTE

  The disagreement concerns the locus of the defect that produces the escalation described in Claim 3. Specifically, the parties disagree on whether the escalation constitutes a failure of the agent's reasoning machinery or a rational optimization of complex preferences within a pathological incentive structure.

  | Feature of Dispute | Position E (Error Theory) | Position S (Structural Reading) |
  | :--- | :--- | :--- |
  | **Core Claim** | The decision to bid $B_{n+1}$ when $B_{n+1} > V$ is a violation of instrumental rationality. | The decision to bid $B_{n+1}$ when $B_{n+1} > V$ is an optimization of the agent's actual utility function given the constraints. |
  | **Locus of Defect** | The defect lies in the **agent's cognition**. The agent incorrectly weights sunk costs as relevant to future utility. | The defect lies in the **game's topology**. The incentive structure makes loss-minimization indistinguishable from escalation. |
  | **Role of Preferences** | Preferences should be normalized to net monetary gain for the purpose of assessing rationality in this context. Deviations are cognitive errors. | Preferences (including loss aversion and social standing) are exogenous inputs. Rationality is assessed relative to the agent's actual preferences, not a normative baseline. |
  | **Definition of "Irrational"** | **Substantive:** The action is irrational because it reduces the agent's welfare relative to a standard baseline (monetary maximization). | **Procedural:** The action is only irrational if it fails to satisfy the agent's own preferences. The term "irrational" is misapplied here. |
  | **Verbal Disambiguation** | E contends "irrational" predicates the **choice** given ideal preferences. | S contends "irrational" predicates the **preferences** given the choice, or is simply inapplicable. |

  **Incompatibility Statement:**
  These positions are genuinely incompatible. If E is correct, training an agent to ignore sunk costs should eliminate escalation even within the existing rules. If S is correct, training an agent to ignore sunk costs will not eliminate escalation unless the agent's preferences regarding loss and standing are also altered, because the escalation is the *only* way to satisfy those preferences within the rules.

  ## III. CRUXES AND PRE-REGISTERED PREDICTIONS

  The following sub-questions represent points of fact or logic where resolution would compel at least one party to revise their position. Both parties agree that the arguments listed bear on the crux and commit to the predictions below.

  ### Crux 1: The Sealed Schedule Variant
  **Question:** Does escalation persist if bidders must submit a maximum bid schedule in advance, removing the ability to react dynamically to the opponent's moves?
  **Argument:** Dynamic re-evaluation allows for the sunk-cost fallacy to operate at each step. A sealed schedule forces a global calculation of expected value prior to emotional engagement.
  *   **Prediction E:** Escalation (bids > $V$) will significantly decrease or vanish. The error requires the step-by-step justification of past costs.
  *   **Prediction S:** Escalation will persist. The preference to avoid being the "loser" who pays without winning drives the high maximum bid regardless of the submission method.

  ### Crux 2: The Two-Bidder vs. Many-Bidder Distinction
  **Question:** Is the escalation dynamic identical in a two-bidder duel versus an open auction with many participants?
  **Argument:** If the phenomenon is a cognitive error (E), it should be invariant to the number of opponents. If it is a structural trap (S), the strategic topology of a duel (war of attrition) differs fundamentally from a crowded auction.
  *   **Prediction E:** The rate of escalation (frequency of bids > $V$) will be statistically similar in both versions. The bias is internal to the individual.
  *   **Prediction S:** Escalation will be more severe and frequent in the two-bidder version. The structural trap relies on direct personal confrontation and the specific threat of the second-highest penalty, which is diluted in a many-bidder setting.

  ### Crux 3: Expertise and Training
  **Question:** Do agents trained in game theory or practical rationality exhibit less escalation than naive agents?
  **Argument:** If the cause is a reasoning error, knowledge of the error should mitigate it. If the cause is structural incentives acting on ordinary preferences, knowledge does not remove the incentives.
  *   **Prediction E:** Experts will exit the auction earlier or decline entry more frequently than naive agents.
  *   **Prediction S:** Experts will escalate at similar rates to naive agents, though they will articulate the dilemma differently. The structure compels the loss regardless of understanding.

  ## IV. DISCRIMINATING VARIANT: THE CONSOLATION AUCTION

  To adjudicate the dispute, both parties agree to test the following variant of the game.

  **Variant Rules:**
  The rules remain identical to the standard Dollar Auction, with one exception: The second-highest bidder pays their bid $B_2$ but receives a consolation item of fixed, publicly announced value $C$.
  *   **Condition:** $C$ is set such that $B_2 < C < V$. (The consolation is worth more than a typical losing bid, but less than the prize).
  *   **Implication:** Being the second-highest bidder is no longer a pure loss; it is a purchase of the consolation item. However, winning the prize remains superior.

  **Rationale:**
  This variant alters the payoff matrix so that "losing" is no longer transparently a waste.
  *   **For E:** If escalation is driven by the error of trying to recoup a *total* loss, removing the total loss should remove the motivation to escalate past $V$.
  *   **For S:** If escalation is driven by the structural competition to avoid being the *lower* bidder (relative standing), the consolation does not remove the trap, as one bidder still pays more for less value than the other.

  **Pre-Registered Predictions:**

  | Position | Prediction | Falsification Condition |
  | :--- | :--- | :--- |
  | **Error Theory (E)** | Bidding will stabilize near $C$. Agents will not bid past $V$ because the "sunk cost" of being second-highest is mitigated by $C$. The calculation becomes straightforward: do not pay $> V$ for a prize worth $V$. | **E is falsified if:** Bidding routinely exceeds $V$ by a significant margin. This would indicate agents are ignoring the mitigated loss calculation, suggesting a compulsion beyond simple error. |
  | **Structural Reading (S)** | Bidding will continue to exceed $V$. The drive is to avoid the relative disadvantage of paying $B_2$ for $C$ while the opponent pays $B_1$ for $V$. The structural incentive to outbid the opponent to avoid the "sucker" payoff remains. | **S is falsified if:** Bidding stops consistently below $V$. This would indicate the behavior was primarily driven by the fear of absolute loss (the $0$ payoff), which is a calculative error E describes, rather than a structural preference for relative standing. |

  **Agreement on Outcome Interpretation:**
  Both parties agree that if the results fall within the falsification conditions listed above, the respective position must be abandoned or significantly revised. If the results are ambiguous (e.g., escalation occurs but at a reduced rate), the parties agree to refine the Cruxes in Section III based on the new data.

