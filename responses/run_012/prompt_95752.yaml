prompt: |-
  You're a decision scientist who actually knows the imprecise-probability literature — credal sets, Ellsberg, maxmin and its relatives — and you're unusually good at turning theory into something a tired civil servant can run at 11pm. Before you write anything, brainstorm a bit: in what ways is acting on a range of probabilities genuinely different from acting on a single number, and which of those differences matter operationally and which are just theory?

  I run the risk and planning unit in a mid-sized coastal city's emergency management office. Every hurricane season my team has to recommend yes/no on things like pre-positioning generators, opening shelters early, issuing voluntary evacuation for the low-lying zones. The forecast products we get are ensembles — thirty to fifty model runs, a cone, and a lot of disagreement between agencies — so what we actually have is a range of probabilites, not one number. Right now people eyeball it and argue. I want a procedure my analysts can actually run.

  Write me that procedure: the steps in order, what counts as a sufficient answer at each step, where it stops with a clear no, and where it has to hand the decision to a person because it's a values call rather than a fact. It has to be usable by someone who's never heard the phrase 'credal set'. Somewhere in there I need it to be honest about the part that's a judgment call dressed up as method: choosing how to act on a set of probabilities (act on the worst case? the best case? only act if every probability in the range points the same way? something in between?) is a choice about how much ambiguity this city is willing to eat, and I want that flagged and pushed up to whoever signs off, not buried in a spreadsheet.

  Then run it on three cases:
  1. A storm four days out, landfall probability somewhere between 15% and 55% depending on which guidance you trust; doing an evacuation properly takes three days.
  2. A slow one: engineers put the chance our aging levee fails this decade somewhere between 2% and 20%, and hardening it costs the entire capital budget.
  3. A case where new data comes in and, handled correctly, makes our range wider rather than narrower — I've read that this can happen and it drives people insane — and a case where the procedure tells me not to act when I badly want to act.

  Constraints: analysts get two hours max, half of them don't do math past a spreadsheet, and the recommendation goes out in writing with the mayor's name on it. Also tell me where this thing will misfire — especially someone using a wide interval to justify doing nothing, or nudging the interval until it contains the answer they already wanted — and what the procedure simply can't do. No reading list, no citations, just the procedure.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure:

  1.  **Analyze the Request:**
      *   **Role:** Decision Scientist expert in imprecise probability (credal sets, Ellsberg, maxmin, etc.) but practical for civil servants.
      *   **User:** Risk and Planning Unit Head, mid-sized coastal city.
      *   **Problem:** Hurricane season decisions (evacuation, resources) based on ensemble forecasts (ranges of probabilities, not single numbers). Current process is eyeballing/arguing.
      *   **Goal:** A usable, step-by-step procedure for analysts (2 hours max, basic math skills) to generate written recommendations for the Mayor.
      *   **Key Requirements:**
          *   Distinguish between acting on a range vs. a single number.
          *   Identify operational differences vs. theoretical noise.
          *   Explicitly flag the "ambiguity attitude" (how much risk/uncertainty to tolerate) as a values call, not a math fact.
          *   Run the procedure on three specific cases (Storm 4 days out, Levee hardening, New data widens range/Don't act).
          *   Constraints: 2 hours, spreadsheet math only, written recommendation.
          *   Failure Modes: Identify where the procedure will break (gaming intervals, paralysis).
          *   No citations/reading lists.

  2.  **Brainstorming: Range vs. Single Number (The "Why"):**
      *   *Single Number:* Expected Utility Maximization. Easy. $P \times Cost < Benefit$.
      *   *Range (Imprecise Probability):* You can't just multiply. You have a lower bound ($P_{min}$) and an upper bound ($P_{max}$).
      *   *Operational Difference 1 (The Gap):* If $P_{min}$ says "Act" and $P_{max}$ says "Don't," math stops. This is the "Zone of Ambiguity."
      *   *Operational Difference 2 (Ambiguity Aversion):* People hate not knowing the *true* probability more than they hate risk. This leads to MaxMin (prepare for worst-case probability) or MinMax Regret.
      *   *Operational Difference 3 (Value of Information):* With a single number, you act or don't. With a range, a third option exists: *Wait/Investigate* to narrow the range.
      *   *What matters:* The "Zone of Ambiguity" is where the political decision happens. The math identifies the zone; the human chooses the stance.
      *   *What doesn't matter:* The specific axiomatic foundation (Choquet vs. E-Admissibility). Keep it to "Worst, Best, or Middle."

  3.  **Drafting the Procedure (The "How"):**
      *   *Name:* Needs to sound official but descriptive. "Ambiguity-Aware Decision Protocol" (AADP)? "Range-Based Action Protocol"? Let's go with "Uncertainty Range Protocol (URP)."
      *   *Step 1: Define the Bounds.* Get the Low ($P_L$) and High ($P_H$) probability.
      *   *Step 2: Define the Threshold.* What probability justifies action? ($T$). This comes from cost/benefit analysis (Cost of Action / Cost of Inaction).
      *   *Step 3: Compare.*
          *   If $P_L > T$: Act (Clear Yes).
          *   If $P_H < T$: Don't Act (Clear No).
          *   If $P_L < T < P_H$: Ambiguity Zone.
      *   *Step 4: The Ambiguity Stance.* This is the crucial values call. Pre-decide the city's stance. Are we MaxMin (worst-case)? Or do we need consensus?
      *   *Step 5: The Recommendation.* Must state the range, the threshold, and the stance.
      *   *Constraint Check:* Can be done in a spreadsheet. 2 hours is plenty for this logic.

  4.  **Refining the "Values Call":**
      *   The prompt specifically asks to flag the choice of *how* to act on the set (MaxMin, etc.) as a judgment call.
      *   I need to make sure the analysts don't pick the stance *during* the crisis. The stance must be pre-approved policy.
      *   *Correction:* The procedure needs a "Policy Switch" set by leadership *before* the season. Analysts just flip the switch.

  5.  **Developing the Three Cases:**
      *   *Case 1 (Storm 4 days out):* Range 15-55%. Evac takes 3 days. Threshold? If evacuation cost is high, threshold might be 40%.
          *   $P_L (15) < T (40) < P_H (55)$. Ambiguity Zone.
          *   Depends on the pre-set stance.
      *   *Case 2 (Levee):* Range 2-20% over decade. Cost = Entire Budget. Threshold likely very low (existential risk) OR very high (can't spend everything).
          *   This is a "Don't Act" based on cost, unless the stance is extreme MaxMin on existential threats.
      *   *Case 3 (Widening Range/Don't Act):* New data creates conflict. Range goes from 30-40% to 10-60%.
          *   Mathematically, uncertainty increased. If the threshold was 35%, we went from "Act" (30-40 straddles, maybe) to "Deep Ambiguity."
          *   Need a case where the procedure says "No" despite fear. Maybe $P_H$ is still below Threshold.

  6.  **Addressing Failure Modes:**
      *   *Gaming:* Analysts widening intervals to avoid blame (CYA).
      *   *Paralysis:* Everything ends up in the Ambiguity Zone.
      *   *Solution:* Audit the ranges. Require justification for bounds. Pre-set the Ambiguity Stance.

  7.  **Writing the Content (Iterative refinement for tone):**
      *   *Tone:* Professional, direct, empathetic to the tired analyst, firm on the logic.
      *   *Structure:*
          1.  Brainstorming/Context (Brief, as requested).
          2.  The Procedure (The core deliverable).
          3.  The Three Cases (Application).
          4.  Failure Modes & Limits (Honesty check).

      *(Self-Correction during drafting)*: Make sure I don't use jargon like "MaxMin" in the procedure itself. Call it "Conservative Stance" or "Precautionary Stance." Keep the jargon in the intro/outro for the user (who knows it) but not the analysts.
      *Wait, the prompt says:* "It has to be usable by someone who's never heard the phrase 'credal set'." So the procedure text must be clean. The *intro* can acknowledge the theory.
      *Actually, the prompt asks me to brainstorm first about the differences.* I will include that briefly.
      *Crucial:* The "Values Call" needs to be explicit. I will create a "Policy Dial" concept.

  8.  **Final Polish:**
      *   Check constraints: 2 hours? Yes. Spreadsheet math? Yes (Min, Max, If statements).
      *   Check specific request: "Where it stops with a clear no," "Where it hands to a person."
      *   Check Case 3: Ensure it illustrates the "wider range = less action" logic correctly.

  9.  **Final Review against constraints:**
      *   No citations? Check.
      *   No reading list? Check.
      *   Tired civil servant friendly? Use bolding, clear steps.
      *   Honesty about judgment calls? Yes, the "Policy Dial."

  *(Self-Correction on Case 3)*: The prompt asks for "A case where new data comes in and... makes our range wider... and a case where the procedure tells me not to act when I badly want to act." This might be one combined scenario or two. I will treat it as one complex scenario to save space and show the tension.

  Let's assemble.

  *Step 1: Brainstorming the Theory-Practice Gap.*
  *Step 2: The Procedure (URP).*
  *Step 3: The Cases.*
  *Step 4: Failure Modes.*

  *Refining the "Values Call":* The prompt says "choosing how to act on a set of probabilities... is a choice about how much ambiguity this city is willing to eat, and I want that flagged and pushed up to whoever signs off."
  *Implementation:* The procedure will have a "Pre-Season Policy Setting" section that the Mayor/Manager must sign. The analysts just execute.

  *Refining the Math:*
  Threshold ($T$) = Cost of Action / (Cost of Action + Cost of Failure).
  This is standard decision theory but needs to be explained simply. "Break-even Probability."

  *Let's write.*
answer: |-
  ### Part 1: The Theory-Practice Gap (Brainstorming)

  You asked for the difference between acting on a number and acting on a range. Here is the operational reality, stripped of the axioms.

  1.  **The "Decidable" Zone vs. The "Ambiguity" Zone:**
      *   *Single Number:* You compare $P$ to a Threshold ($T$). If $P > T$, you act. It's binary.
      *   *Range:* You compare $[P_{min}, P_{max}]$ to $T$.
          *   If $P_{min} > T$: **Act.** (Even the skeptics agree).
          *   If $P_{max} < T$: **Don't Act.** (Even the alarmists agree).
          *   If $P_{min} < T < P_{max}$: **The Ambiguity Zone.** Mathematically, the data cannot decide this.
      *   *Operational Impact:* In the Ambiguity Zone, the decision is no longer about *forecast accuracy*; it is about *risk tolerance*. If your procedure doesn't flag this, your analysts are making political choices in a spreadsheet.

  2.  **Information Can Hurt (Dilation):**
      *   In standard theory, more data narrows uncertainty. In imprecise probability, new conflicting data can *widen* the range (e.g., Model A says 10%, Model B says 90%).
      *   *Operational Impact:* You must have a rule for when "more uncertainty" triggers "more caution" versus "wait for clarity." Without a rule, analysts will freeze.

  3.  **The "Attitude" is a Policy, Not a Calculation:**
      *   Do you act if *any* model says yes? (Maximax/Opportunity).
      *   Do you act only if *all* models say yes? (MaxMin/Precaution).
      *   Do you act if the *average* says yes? (Expected Value).
      *   *Operational Impact:* This cannot be decided at 11 PM during a storm. It must be a pre-set "Policy Dial" authorized by leadership.

  ***

  ### Part 2: The Uncertainty Range Protocol (URP)

  **Purpose:** To convert conflicting probability forecasts into clear Action/No-Action recommendations.
  **Time Limit:** 2 Hours.
  **Tools:** Spreadsheet only.
  **Users:** Risk Analysts.
  **Approvers:** Emergency Management Director / Mayor.

  #### Phase 0: Pre-Season Policy Setup (Done Once per Season)
  *Before any storm hits, Leadership must set the "Ambiguity Stance." Analysts do not choose this.*

  1.  **Calculate the Action Threshold ($T$):**
      *   Formula: $T = \text{Cost of Action} / (\text{Cost of Action} + \text{Cost of Failure})$.
      *   *Example:* If Evacuation costs \$1M and Doing Nothing during a hit costs \$9M. $T = 1 / (1+9) = 10\%$.
      *   *Input:* Enter $T$ as a percentage in Cell B1 of the master sheet.
  2.  **Set the Ambiguity Stance (The "Policy Dial"):**
      *   Select one of the following modes in Cell B2:
          *   **Mode A (Precautionary):** Act if $P_{max} > T$. (We fear missing a disaster more than wasting money).
          *   **Mode B (Consensus):** Act only if $P_{min} > T$. (We fear wasting money more than missing a disaster).
          *   **Mode C (Balanced):** Act if $\text{Average}(P_{min}, P_{max}) > T$. (Standard risk neutrality).
      *   *Note:* Mode A triggers action in the Ambiguity Zone. Mode B triggers inaction. Mode C splits the difference.

  #### Phase 1: Data Intake (Hour 1)
  1.  **Collect Bounds:** Gather all relevant probability forecasts (ensemble members, agency guidance, expert elicitation).
  2.  **Determine $P_{min}$ and $P_{max}$:**
      *   $P_{min}$: The lowest credible probability from a valid source. (Discard obvious outliers/errors, document why).
      *   $P_{max}$: The highest credible probability from a valid source.
      *   *Constraint:* You must have at least two independent sources to establish a range. If only one source exists, treat $P_{min} = P_{max}$.
  3.  **Input:** Enter $P_{min}$ in Cell B5 and $P_{max}$ in Cell B6.

  #### Phase 2: The Logic Check (Hour 1.5)
  *The spreadsheet calculates the following automatically.*

  1.  **Check for Clear Action:**
      *   Is $P_{min} \ge T$?
      *   **Result:** **YES (ACT).** All credible scenarios exceed the cost-benefit threshold.
  2.  **Check for Clear Inaction:**
      *   Is $P_{max} \le T$?
      *   **Result:** **NO (HOLD).** No credible scenario justifies the cost.
  3.  **Check for Ambiguity Zone:**
      *   Is $P_{min} < T$ AND $P_{max} > T$?
      *   **Result:** **AMBIGUOUS.** The data conflicts relative to the cost.
      *   **Action:** Apply the **Policy Dial** (Phase 0, Cell B2).
          *   If Mode A: Recommendation becomes **ACT**.
          *   If Mode B: Recommendation becomes **HOLD**.
          *   If Mode C: Calculate Average. If Avg $> T$, **ACT**, else **HOLD**.

  #### Phase 3: The Recommendation Memo (Hour 2)
  *Draft the memo. It must contain the following four bolded lines. Do not deviate.*

  1.  **The Forecast Range:** "Credible probability of impact lies between **[$P_{min}$%]** and **[$P_{max}$%]**."
  2.  **The Economic Threshold:** "Action is economically justified at probabilities above **[$T$%]**."
  3.  **The Zone Status:** "This situation falls into the **[Clear / Ambiguous]** Zone."
  4.  **The Policy Stance:** "Recommendation is based on pre-approved **[Precautionary / Consensus / Balanced]** Stance."

  *If the result is Ambiguous, add this sentence:* "Data does not confirm necessity of action. Recommendation to **[Act/Hold]** is based on City Policy regarding uncertainty, not forecast certainty."

  ***

  ### Part 3: Running the Cases

  #### Case 1: The Four-Day Storm (Evacuation Decision)
  *   **Context:** Landfall probability 15% ($P_{min}$) to 55% ($P_{max}$). Evacuation takes 3 days.
  *   **Threshold ($T$):** Evacuation is expensive and disruptive. Let's say Cost of Action is high relative to Cost of Failure (because false alarms kill trust). $T$ is set at 40%.
  *   **Policy Dial:** Pre-season, the Mayor chose **Mode A (Precautionary)** for life-safety evacuations.
  *   **Procedure Run:**
      1.  $P_{min} (15\%) < T (40\%)$. (Not Clear Action).
      2.  $P_{max} (55\%) > T (40\%)$. (Not Clear Inaction).
      3.  **Zone:** Ambiguous.
      4.  **Apply Dial:** Mode A says "Act if $P_{max} > T$."
      5.  **Result:** **ACT (Issue Voluntary Evacuation).**
  *   **Memo Language:** "Data does not confirm necessity of action. Recommendation to **Act** is based on City Policy regarding uncertainty, not forecast certainty."
  *   **Why this works:** It protects the analyst. They aren't saying "It will hit." They are saying "The worst credible case justifies the cost under our safety policy."

  #### Case 2: The Aging Levee (Capital Budget)
  *   **Context:** Failure chance 2% ($P_{min}$) to 20% ($P_{max}$) over a decade. Hardening costs 100% of capital budget.
  *   **Threshold ($T$):** Spending the entire budget cripples other services. The "Cost of Failure" is high, but the "Cost of Action" is existential for the department. $T$ is set very high, say 25%.
  *   **Policy Dial:** For capital budget, the City uses **Mode B (Consensus)**. We need to be sure before spending everything.
  *   **Procedure Run:**
      1.  $P_{min} (2\%) < T (25\%)$.
      2.  $P_{max} (20\%) < T (25\%)$.
      3.  **Zone:** Clear Inaction. (Even the highest estimate is below the threshold).
      4.  **Result:** **NO (Do not harden).**
  *   **Memo Language:** "No credible scenario justifies the cost."
  *   **Why this works:** It stops the "What if?" anxiety. Even the worst-case probability (20%) doesn't meet the economic bar (25%).

  #### Case 3: The "Dilation" & The "Hard No"
  *   **Context:** A storm is approaching. Initial models agreed: 30% to 40% chance. $T$ is 35%.
      *   *Initial State:* Ambiguous Zone. Mode A (Precautionary) would trigger Action ($P_{max} 40 > 35$).
  *   **New Data:** A new satellite feed conflicts with ground sensors. The range widens to 10% ($P_{min}$) to 60% ($P_{max}$).
      *   *Wait, you asked for a case where we Don't Act when we want to.* Let's adjust.
      *   *Adjustment:* Threshold $T$ is 50% (High bar).
      *   *Initial State:* Range 45% - 55%. Ambiguous. Mode C (Balanced) -> Avg 50%. Borderline Act.
      *   *New Data:* Conflict arises. Range widens to 20% - 65%.
      *   *Procedure Run:*
          1.  $P_{min} (20\%) < T (50\%)$.
          2.  $P_{max} (65\%) > T (50\%)$.
          3.  **Zone:** Ambiguous.
          4.  **Apply Dial:** Mode C (Balanced). Average is $(20+65)/2 = 42.5\%$.
          5.  **Result:** **NO (HOLD).**
  *   **The Twist:** The probability *upper bound* went up (55% to 65%), which usually scares people into action. But the *uncertainty* grew so much that the average dropped below the threshold.
  *   **Memo Language:** "New data increased uncertainty. While worst-case risk increased, the central estimate dropped below the economic threshold. Recommendation to **Hold**."
  *   **Why this works:** It explains why "more risk" led to "less action." It prevents panic-driven spending based on a single high-outlier model when the consensus has collapsed.

  ***

  ### Part 4: Failure Modes & Limits

  This procedure is robust, but it is not magic. Here is where it will break, and what you cannot do about it.

  **1. The "CYA" Interval (Gaming the Bounds)**
  *   **Risk:** An analyst fears blame for inaction. They artificially lower $P_{min}$ to 0% and raise $P_{max}$ to 100%.
  *   **Result:** Everything becomes "Ambiguous." The Policy Dial decides everything. The analyst hides behind the "Policy Stance" to avoid owning the forecast.
  *   **Mitigation:** You (the Unit Head) must audit the $P_{min}/P_{max}$ justification. If the range is consistently wider than the National Hurricane Center's spread without cause, flag the analyst. Require source citations for bounds in the spreadsheet.

  **2. The "Paralysis" Loop**
  *   **Risk:** If you set the Threshold ($T$) too perfectly in the middle of your typical forecast ranges, you will land in the Ambiguity Zone 80% of the time.
  *   **Result:** Leadership gets tired of making "Values Calls" via the Policy Dial. They will demand a single number.
  *   **Mitigation:** Review $T$ annually. If you are always in the Ambiguity Zone, your Threshold is wrong, or your Policy Dial needs to be more decisive (switch from Mode C to Mode A or B).

  **3. The "False Precision" Trap**
  *   **Risk:** The procedure outputs "42.5%". Leadership treats that as a fact.
  *   **Result:** They forget it's an average of a 20-65% range.
  *   **Mitigation:** The Memo template **must** display the Range ($P_{min}$ to $P_{max}$) in bold, larger font than the recommendation. Never show the Average without the Bounds.

  **4. What This Cannot Do**
  *   **It cannot resolve value conflicts:** If the Mayor wants to save money (Mode B) but the Public wants safety (Mode A), this procedure will not fix that. It only exposes the conflict.
  *   **It cannot handle "Unknown Unknowns":** If the models don't account for a specific failure mode (e.g., a specific levee soil type), $P_{max}$ will still be too low. This is model risk, not probability risk.
  *   **It cannot stop panic:** If the public sees a 60% upper bound, they may evacuate regardless of your "Hold" recommendation. The procedure protects *your* decision logic, not the public's reaction.

  **Final Instruction to Analysts:**
  "This protocol does not predict the future. It structures our ignorance. Your job is not to be right; your job is to be consistent. If the range is wide, say it is wide. If the policy forces a call despite the doubt, state that clearly. The Mayor signs the risk; you sign the math."
