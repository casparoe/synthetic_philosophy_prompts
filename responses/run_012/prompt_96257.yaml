      *   **Required Concepts to Integrate:**
          *   Heritability in identical environments.
          *   Single-gene conditions with treatment (heritability near zero).
          *   The two-fields-of-seeds analogy (within-group vs. between-group variance).
      *   **Conclusion:** Identify which reading the roommate needs for her dismissal to work and whether she's entitled to it.

  2.  **Deconstruct the Roommate's Claim:**
      *   *Claim:* "Heritability is a population statistic, it tells you nothing about individuals."
      *   *Potential Readings:*
          1.  **Definitional/Mathematical:** $H^2$ is defined as $V_G / V_P$ in a specific population at a specific time. It is not defined for $N=1$.
          2.  **Causal Attribution (Individual):** You cannot partition an *individual's* phenotype into % genes and % environment (the "interference" problem).
          3.  **Predictive/Interventional:** High heritability does not imply immutability.
          4.  **Sweeping/Dismissive:** The statistic is irrelevant for individual decision-making or policy.

  3.  **Drafting the Readings (Iterative Process):**

      *   *Reading 1: The Mathematical Definition.*
          *   Content: Heritability is variance ratio in a population.
          *   Truth: True.
          *   Trivial/Substantive: Trivial (by definition).
          *   Relevance to User: Doesn't fully answer "is it genetic in me" but clarifies the metric isn't built for that. Doesn't answer intervention question directly.

      *   *Reading 2: The "Proportion of Cause" Fallacy.*
          *   Content: You can't say 60% of *my* height is genes.
          *   Truth: True (genes and environment interact multiplicatively/developmentally, not additively within an individual).
