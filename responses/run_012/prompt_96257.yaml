      *   **The Verdict:** Analyze the roommate's move. Which reading did she need? Was she entitled?

  7.  **Refining the Content (Self-Correction during drafting):**
      *   *Correction on PKU:* Make sure to explain *why* heritability drops. If everyone has the gene but environment (diet) varies, $H^2$ is low. If environment is constant (everyone eats normal diet), $H^2$ is high (for the disability). Actually, the prompt asks: "whether a condition caused by a single gene can come out near-zero heritable once there's a treatment for it." If the treatment is effective and universally applied, the *variance* in the trait disappears. If the treatment is applied randomly, the variance is environmental. So yes, a genetic condition can have low heritability in a population with varied treatment.
      *   *Correction on "Nothing about individuals":* It's important to distinguish between "explaining the *cause* of an individual's trait" (impossible) vs "predicting an individual's *risk*" (possible). The roommate conflates these.
      *   *Tone:* Keep it analytical, fair to the roommate (she's not lying), but firm on the utility of the concept.

