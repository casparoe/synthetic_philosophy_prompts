prompt: |-
  So my roommate and I got into it last night over a twin study we were both half-reading — the kind that reports some trait as being around 60% heritable — and she finally said 'heritability is a population statistic, it tells you nothing about individuals,' like that settled it. What I'd actually asked was whether the number means the trait is genetic in me, and whether it means a school program or a change in diet can't do much about it. Maybe I was muddled, but I dont think her sentence is a single claim, and I want to see how many it could be.

  Lay out the different precise things 'heritability is a population statistic' could be asserting, from the flat definitional reading up to the sweeping one where the whole concept is useless for anything anyone actually wants to know. For each, say whether it's true, whether it's trivial or substantive, and whether it actually bears on the two questions I asked — the one about me, and the one about whether anything can be done. Three things I'd like it to hit somewhere, since they're where I keep getting stuck: what happens to heritability if everyone in the population grows up in identical environments; whether a condition caused by a single gene can come out near-zero heritable once there's a treatment for it; and the old two-fields-of-seeds picture, where differences among the plants in one field and differences between the two fields have completely different causes. Then tell me which reading of her sentence my roommate would need for her dismissal to land, and whether she's entitled to it.
