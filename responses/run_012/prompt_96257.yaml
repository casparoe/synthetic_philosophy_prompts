      *   Hit the 3 specific concepts (Identical environments, Single gene/treatment, Two fields)? Yes.
      *   Which reading does she need? Yes.
      *   Is she entitled? Yes.

  9.  (Final Review of the "Two Fields" analogy): Ensure it's used to illustrate that high within-group heritability says nothing about between-group differences, which reinforces the "population statistic" limitation but also clarifies *which* population limitation it is.

  10. (Final Review of "Identical Environments"): If $V_E \to 0$, $H^2 \to 1$. This proves $H^2$ is not a fixed property of the trait, but of the population context. This undermines the idea that 60% is a "genetic essence."

