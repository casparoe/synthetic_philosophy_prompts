  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Context:** A disagreement with a roommate about a twin study reporting ~60% heritability for a trait.
      *   **User's Questions:** (1) Does this mean the trait is genetic *in me*? (2) Does this mean interventions (school, diet) can't change it?
      *   **Roommate's Claim:** "Heritability is a population statistic, it tells you nothing about individuals."
