  **MEMORANDUM**

  **TO:** Exhibit Subcommittee
  **FROM:** [Your Name], Subcommittee Chair
  **DATE:** [Current Date]
  **SUBJECT:** Recommendation for Centenary Centerpiece Panel

  **Recommendation**
  I recommend we adopt a modified version of Option 3. This approach distinguishes between historical causation, specific leadership decisions, and legal settlements. It preserves our partnership with the German sister city while satisfying the Veterans' Council demand for historical accuracy.

  **Proposed Panel Text (59 words)**
  Following the assassination of Archduke Franz Ferdinand, a chain of mobilizations engulfed Europe. Leaders in Berlin and Vienna issued ultimatums and invaded neutral territories, widening the conflict. The 1919 Treaty of Versailles legally assigned responsibility to Germany and her allies. Historians continue to analyze both the specific decisions of July 1914 and broader alliance systems that made war possible.

  **Reasoning**
  This wording navigates the two critical philosophical traps inherent in this exhibit.

  First, regarding the **descendant problem**: The text attributes actions to "Leaders in Berlin and Vienna," not to the German nation or people as an eternal entity. By framing the Versailles clause as a legal assignment made in 1919 rather than a moral truth for all time, we acknowledge the historical record without implicating a modern fifteen-year-old visitor in the guilt of her ancestors. She is reading about a government, not inheriting a sin.

  Second, regarding the **counterfactual problem**: Claims about causation usually require asserting what *would* have happened otherwise. This text avoids that trap by describing actual events ("issued ultimatums," "invaded neutral territories") rather than asserting sole origin. It states these actions widened the conflict, which is empirically verifiable, without claiming the war was impossible absent those specific decisions. It leaves the "what if" to the historians mentioned in the final sentence.

  **The Strongest Case for the Rejected Option (Option 1)**
  Proponents of keeping the original draft argue that clarity is a moral obligation. To soften the language is to engage in the very appeasement that failed in the 1930s. The Treaty of Versailles was not just a legal document but a moral judgment based on the reality of German aggression and the "blank check" given to Austria. Any wording that obscures this primary responsibility dishonors the sacrifice of those who fought against that aggression and validates the fear that history is being rewritten to spare modern sensibilities.

  **Historical Consensus**
  Historians no longer agree on a single cause. While Fritz Fischer established that German leadership actively sought expansion, later research emphasizes the role of alliance systems and mobilization timetables that limited diplomatic options. There is no consensus on sole guilt, but there is broad agreement that German and Austrian decisions were the most critical catalysts in July 1914. The debate remains open on whether war was inevitable given the structures, or contingent on specific choices.
