      *   *Step 1: Attack Premise (1).* The "but-for" test fails in overdetermination cases. Example: Two fires merge to burn a house. Either alone would have done it. Did neither cause it? That's absurd. So (1) is too strict for historical practice.
      *   *Step 2: Introduce INUS.* This saves "multiple causes." The drought wasn't sufficient, but it was *necessary* for *that specific sufficient set* to occur at *that time*. It did "real work."
      *   *Step 3: The Pragmatic Turn.* History isn't physics. We aren't looking for the "atomic particle of causation." We are looking for *explanation*. Causes are selected based on what is variable or interesting. (Hart & Honoré).
      *   *Step 4: The "Muddle" Admission.* The friend wants a clean ontology. The user wants a useful historiography. They are talking past each other.
      *   *Conclusion:* You don't have to give up (2), but you have to refine what "cause" means in history. It's not a myth, it's a tool.

