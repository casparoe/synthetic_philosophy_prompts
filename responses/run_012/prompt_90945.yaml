answer: |-
  1. Rousseau condemns the actor's trade as inherently dishonest because it requires habitual dissimulation, whereas Diderot praises the actor's cold calculation as the only path to consistent greatness. On the moral axis, Rousseau is more defensible because professionalizing falsehood inevitably erodes personal integrity, regardless of the aesthetic payoff.

  2. Diderot's claim that the great actor remains emotionally detached while manipulating the audience's feelings inadvertently strengthens Rousseau's moral case against the stage. By confirming that acting is a calculated artifice rather than a sincere expression, Diderot validates Rousseau's fear that the theater institutionalizes deception.

  3. Rousseau's own composition of plays like *The Village Soothsayer* does not contradict his theory but rather highlights his distinction between corrupting commercial spectacles and morally useful dramatic poetry. His position is more defensible here because he targets the institutional context of the theater rather than the literary form itself.

  4. Both thinkers agree that the spectator remains passive while experiencing intense emotions, but Rousseau uniquely identifies this passivity as a civic danger rather than an aesthetic success. Rousseau is more defensible on this point because cultivating pity without action ultimately weakens the citizen's capacity for real-world virtue.

  5. Diderot argues that art must improve upon nature through an ideal model, while Rousseau insists that art should reflect natural simplicity to avoid corrupting influence. Diderot is more defensible on this aesthetic axis, as unconditional naturalism often fails to convey universal truths effectively to a diverse audience.
