answer: |-
  You know the context of why I am writing this, because you know about the vote last month and the sleeplessness that followed, but for the record of the committee, the project emerges from a specific tension between my lived experience as a newly elected council member and the theoretical frameworks available in moral philosophy. I am proposing a three-month research project to investigate the distribution of moral responsibility in collective decision-making bodies. The core question is whether moral responsibility in collective agency obeys a conservation law, where the total burden is fixed and divided among participants, or whether it obeys a dissipation model, where the burden scatters until it vanishes. This is not a thematic exploration of guilt; it is a test of a specific hypothesis regarding the metaphysics of collective action. I intend to determine whether the phrase we all used after the vote, that we all share this, is literally true or merely a comforting figure of speech. If the conservation model holds, then my vote carries a specific weight of wrongness that is mine alone, regardless of the ten others who voted yes. If the dissipation model holds, then my individual moral status is unchanged by the vote, and the wrongness exists only at the level of the institution. I need to know which is the case because the former requires a practice of personal atonement, while the latter requires a practice of institutional repair, and confusing the two leads to the insomnia I am currently experiencing.

  The existing literature on dirty hands and moral responsibility is robust but structurally ill-equipped to answer this question because it is almost exclusively modeled on the singular agent. The standard case study involves a political leader who must authorize a terrible act to prevent a worse one, and the philosophical work focuses on how that individual integrates the contradiction of doing wrong to do right. This framework assumes a bottleneck of agency where the decision flows through one conscience. My situation, and I suspect most modern governance situations, involves a distributed agency where the decision is the output of a procedure, not the意志 of a person. The gap here is not about whether collectives can be moral agents, which has been debated, but about what happens to the phenomenological residue of the decision once it leaves the room. The literature tells me that I have dirty hands if I vote for a harmful policy, but it does not tell me if those hands are less dirty because ten others voted with me, or if the dirt is a property of the room rather than the hands. By focusing on the singular agent, current theory leaves open the possibility that large institutions are morally frictionless surfaces where wrongs occur without attaching to anyone, and I intend to close that gap by developing a taxonomy of shared responsibility that distinguishes between causal contribution and moral ownership.

  To do this in three months without merely producing a longer version of this email, I will employ a mixed method of phenomenological interviewing and conceptual analysis. In the first month, I will conduct structured interviews with the other ten council members who voted on the school closures. I am not interested in their policy justifications, but in their post-decision moral experience. I will ask specifically about sleep, about whether they feel the weight of the decision differently than they would have if they were deciding alone, and about whether they feel responsible for the outcomes in other districts where they hold no power. This data will serve as a check against my own introspection, allowing me to see if the feeling of divided responsibility is universal among the voters or unique to my own conscience. In the second month, I will map these findings against the conceptual distinction I mentioned in my preliminary notes, specifically the hypothesis that dirty hands performs two different jobs: tracking causal involvement in an outcome and tracking corruption of the agent's character. I will test whether causal involvement is divisible while character corruption is not. In the third month, I will draft a framework that operationalizes this distinction into a set of questions a council member can ask before voting. This is not a theoretical paper intended for publication in a ethics journal, but a working document intended for use in the council chamber.

  A successful result will look like a functional heuristic, a specific distinction I can apply during the next budget cycle to determine whether a given vote will require personal moral repair or only political advocacy. If I can produce a rule that says, for example, that responsibility divides when the voters have genuine alternatives but does not divide when the voters are coerced by external constraints, then I will have settled the question for my own purposes. I need a tool that tells me when I am carrying a share of a wrong versus when I am merely witnessing an institutional wrong. A failed project, by contrast, will look like the confirmation that the distinction between action and character collapses under collective pressure. If the interviews show that everyone feels fully responsible regardless of the vote count, or if everyone feels fully absolved, then the conservation hypothesis is untenable, and I will have to accept that my insomnia is a private pathology rather than a philosophical signal. I am not claiming that a negative result is valuable for future research; if I cannot find a distinction that holds, then I have not solved the problem that is keeping me awake, and the project will have failed to deliver the practical utility required to justify the fellowship.

  The scope is realistic because I already have access to the primary subjects, the other council members, and I am not attempting to solve the problem of collective agency for all time, but only for the specific context of elected municipal bodies. I am not writing a history of the concept or a comprehensive critique of Walzer or Williams. I am testing a specific mechanism of distribution against a specific set of lived experiences. The risk is that the other council members will not be willing to speak candidly about their moral discomfort, but given that we are all dealing with the same closures, I anticipate a shared willingness to examine the cost of the decision. If I can secure their cooperation, the three-month timeline is sufficient to gather the data, perform the conceptual mapping, and draft the heuristic. The ultimate goal is to walk away with a way to vote next time that does not require me to choose between doing my job and keeping my conscience intact. If the dirt can be divided, I need to know how to carry my share without collapsing. If it cannot be divided, I need to know how to refuse the vote without abandoning the room. This project is the work of finding out which world I am living in.
