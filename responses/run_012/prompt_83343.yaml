          *   Countable + No Rule = AC_omega (Usually fine in analysis, but worth noting).
          *   Uncountable + Zorn = Full AC (Standard for existence, bad for algorithms).
      *   **Verdicts:**
          *   *Pass:* Standard ZFC context, no claim of constructivity.
          *   *Revision:* Claim of constructivity/algorithm + AC used. Or AC used where a constructive proof is standard/known.
