          *   Step 2: Check the index set (Finite? Countable? Uncountable?).
          *   Step 3: Check the claim (Existence? Algorithm? Measure?).
          *   Step 4: Decision tree.
      *   *Refining for the User:* The user specifically asked for "what to ask," "satisfactory answer," "when to ask for revision," "when to declare," "when to stop."
      *   *Crucial Insight:* In standard analysis journals, AC is generally *accepted*. The problem arises when AC is used *unnecessarily* (making a proof harder to follow or less constructive than needed) or when the author claims *constructivity* while using AC. Or, if the result is known to be independent of ZF and the context implies ZF.
      *   *Correction:* Actually, for a *mid-tier analysis journal*, the standard is ZFC. The referee's job isn't to ban AC. It's to ensure the author isn't being sloppy. If a proof uses Zorn's Lemma where induction suffices, that's a style/quality issue. If a proof uses AC to prove something about natural numbers that shouldn't need it, that's suspicious.
      *   *Key Distinction:* Is the result *about* choice-sensitive objects (like bases of arbitrary vector spaces) or *concrete* objects (like sequences of reals)?

