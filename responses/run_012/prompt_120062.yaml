      *   **Philosophical Framework:** Luck Egalitarianism (inequalities are unjust if due to brute luck, just if due to option luck/choices).
      *   **Core Tension:** Is giving Brother more now correcting past unfairness (parents' favoritism) or compounding it (rewarding the initial unfair advantage)? Does Luck Egalitarianism handle *intergenerational* or *historical* luck chains?
      *   **Requirements:**
