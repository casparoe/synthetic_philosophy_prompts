answer: |-
  **Title:** The Second Lottery: Luck Egalitarianism and the Inheritance of Unfairness

  **Introduction**
  Philosophy is often accused of being detached from the messy reality of human life, but for me, it has become the only tool capable of dissecting a very specific mess: the fight over my mother's house. My brother and I are the sole beneficiaries, but the equity is not the only thing up for division; there is also the weight of history. Throughout our lives, my parents funneled resources toward him—tuition, business bailouts, housing—while I received independence and a bus fare. Now in our forties, he is injured and insolvent; I am stable. He claims 60% of the estate based on need. I am torn. On one hand, his suffering is real. On the other, the inheritance feels like a second round of a rigged game. This essay applies the framework of luck egalitarianism to this dispute. I will argue that while a synchronic (snapshot) view of luck egalitarianism supports my brother's claim, a diachronic (lifetime) view reveals that granting him a larger share compounds the initial injustice. Therefore, luck egalitarianism does not need to be abandoned, but it must be applied across the full timeline of our lives. Under this rigorous standard, he is not entitled to the 60%; the house must be split equally to prevent the compounding of unchosen advantage.

  **The Case for the Brother: Synchronic Luck Egalitarianism**
  The strongest argument for my brother rests on the core tenet of luck egalitarianism, most notably associated with Ronald Dworkin and G.A. Cohen: inequalities resulting from brute luck (unchosen circumstances) are unjust, while inequalities resulting from option luck (calculated risks) are permissible. The goal of justice is to neutralize the effects of brute luck.

  From a synchronic perspective—looking only at our current situation—my brother's case is compelling. His "bad back" is a paradigmatic example of bad brute luck; he did not choose his physiology. His financial ruin, while involving business ventures, occurred in a volatile economic climate often outside individual control. Conversely, my stability is partly a result of good brute luck (health) and the option luck of career choices. If the purpose of the inheritance is to act as a resource pool to mitigate current welfare disparities caused by unchosen circumstances, then justice demands redistribution toward the worse-off party. To deny him 60% because of what happened twenty years ago is to punish him for the past at the expense of his present survival. In this view, the inheritance functions as a corrective mechanism for current misfortune, rendering the history of parental favoritism morally irrelevant "sunk costs." To ignore his current need would be to allow brute luck to dictate his quality of life, which is the very injustice luck egalitarianism seeks to eradicate.

  **The Case for the User: The Diachronic Deficit**
  However, this synchronic view suffers from a critical blindness: it treats the inheritance as the first and only distribution of resources, ignoring that this is the second lottery in a series. Luck egalitarianism is committed to neutralizing the influence of luck on distribution. But my brother has already been the beneficiary of massive positive brute luck: the unchosen preference of our parents.

  When our parents paid his tuition and bailed out his business, they transferred resources based on their own arbitrary preferences, not our merit or choices. This was an unjust distribution of advantage rooted in brute luck (being the favored child). If we now award him 60% of the house because he is currently worse off, we are effectively running the unfair lottery a second time. We are using the estate to compensate for his bad health luck, yes, but in doing so, we are ignoring the fact that his current vulnerability is partially the result of a life where safety nets were guaranteed for him but not for me.

  My resilience was not purely "option luck"; it was forced option luck. I took risks because I had no safety net; he took risks because he was subsidized. To give him the larger share now is to penalize me for the success I forged in the absence of support, while rewarding him for the failure he experienced despite abundant support. A theory of justice that ignores the historical accumulation of advantage and disadvantage fails to truly neutralize luck. It merely shifts the focal point of the injustice from the past to the present. If luck egalitarianism is to be coherent, it cannot look at a single snapshot; it must audit the whole life.

  **Resolution: The Lifetime Ledger**
  So, can luck egalitarianism answer this, or must it be abandoned for a theory of entitlement or sufficiency? It can answer this, but only if we reject the synchronic view in favor of a diachronic "lifetime ledger."

  Luck egalitarianism aims to ensure that people are not worse off than others due to circumstances beyond their control. If we calculate the total brute luck advantage my brother has received over forty years, it vastly outweighs my own. The parental subsidies were unchosen advantages. The inheritance is a new resource. If we distribute it unequally in his favor, we are allowing the initial unchosen advantage (parental love/money) to compound into a second unchosen advantage (the majority of the estate). This violates the principle of neutrality.

  Does his bad back change this? Under a strict luck egalitarian view, compensation for health misfortune should ideally come from the social safety net (pooled societal resources), not from a sibling who was disadvantaged by the same family unit. Within the closed system of the family estate, the primary moral debt is the rectification of the parents' partiality. Since the parents already skewed the playing field in his direction, the only way to neutralize the cumulative effect of luck is to ensure the final distribution does not exacerbate that skew.

  Therefore, I do not have to abandon luck egalitarianism; I have to deepen its temporal scope. If I were to give him 60%, I would be acting on a shallow version of the theory that privileges current welfare over historical justice. By insisting on a 50/50 split, I am not ignoring his bad luck; I am refusing to let the inheritance be the vehicle for fixing it, given that the inheritance is the tail end of a process that already favored him. To give him more would be to treat the inheritance as welfare rather than legacy. Since the legacy was tainted by favoritism, the division must be equal to stop the bleeding of injustice.

  **Conclusion**
  The conflict over the house is not just about money; it is about whether justice is a momentary correction or a lifelong balance. My brother's claim relies on a version of luck egalitarianism that is myopic, focusing solely on his current misfortune while erasing his historical advantage. A robust luck egalitarianism must account for the cumulative weight of brute luck over a lifetime. Because my brother has already won the first lottery of parental favor, awarding him the majority of the second lottery would compound the unfairness rather than correct it. I do not need to abandon the philosophy to justify keeping my share; I need to apply it more rigorously. He should not get 60%. We split the house equally. This is not a betrayal of luck egalitarianism, but its fulfillment: ensuring that the final distribution of resources does not cement the unchosen inequalities of the past.
