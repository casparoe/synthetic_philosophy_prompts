          *   *Refined Thesis:* I will argue that Luck Egalitarianism, properly understood as a *lifetime* metric rather than a snapshot, actually mandates an equal split (or potentially favoring the user) to offset the initial parental bias. Giving the brother 60% compounds the injustice. LE *can* answer this, but it requires a diachronic (over time) view, not a synchronic (right now) view.

      *   **Section 1: The Case for the Brother (The Synchronic View):**
          *   Focus on current brute luck.
