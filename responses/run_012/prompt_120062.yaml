      *   *The User's Claim (Pro-50/50 or Pro-User):* The initial distribution of resources (parental support) was unjust (favoritism). The inheritance is a new distribution. If we give him more now, we are ignoring the *history* of the luck. LE usually looks at a "cut" of time. Does it account for past unjust transfers?
      *   *The "Double Counting" Problem:* If parents gave him \$100k and me \$0 (unjust luck), and now we split the house. If he gets 60%, is that correcting his bad health luck, or is it ignoring the fact he already won the "parental lottery"?
