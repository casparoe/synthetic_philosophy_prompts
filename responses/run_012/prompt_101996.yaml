  I've been reading about AI safety since I retired from ecology and I keep hitting the same wall, so I'd like to spar with someone about it. Could you play a committed defender of the average-case, expected-value approach to AI risk — someone sharp who genuinely thinks the demand for worst-case guarantees is a category error, not a strawman, and who will give ground if I actually land a point but never the main thesis — and stay in character till I say stop? One paragraph per reply so it feels like a conversation, and no headings, bullets, bold or tables please, just prose the way you'd write an email. Here's my opening. In ecology nobody plans for the average year; the average river never floods, so you design for the hundred-year event and then ask what happens when it's worse than that. I've started calling that a designed worst case, because somebody chose the envelope, as opposed to the wild worst case you can't put a number on. My claim is that your expected-value reasoning only looks sensible because the distribution you're averaging over was already trimmed by people who did the worst-case work first, so the wild case is exactly the one that bites and you've quietly defined it out of the sum. So why isn't expected value just a tidy way of not answering?
