answer: |-
  Your operational pipeline commits you to a theory of evidence in which data streams, once cleared by quality control, function as certain propositions for the purpose of updating, thereby structurally excluding rival accounts like Jeffrey conditionalization that permit evidence itself to bear probabilistic weight.

  This practice presupposes that evidence consists of propositions assigned a probability of one at the moment of incorporation, a view often termed the "certainty of evidence" or standard conditionalization. When you plug a wastewater concentration into the likelihood function, you are treating the statement "the concentration was X" as true for the sake of the update, even though the likelihood term $P(Data|Model)$ acknowledges that the generation of X was noisy. The uncertainty is relocated entirely into the relationship between the parameter and the data, not into the truth of the data observation itself. Your colleague is correct that this practice treats untrusted numbers as non-evidence; by enforcing a binary quality threshold, you are demarcating what counts as a "given" from what counts as "noise," effectively asserting that a proposition cannot serve as evidence unless it is secure enough to be conditioned on as true.

  This approach quietly rules out Radical Probabilism and Jeffrey conditionalization, where evidence is not a fixed point but a shift in probability distribution over a partition of propositions. In those rival accounts, you could update on "I am 70% confident the concentration was X" by taking a weighted average of the posteriors derived from possible values of X. Your pipeline forbids this by design: the quality threshold acts as a philosophical gatekeeper that converts continuous confidence into a binary decision, ensuring that only propositions capable of bearing probability 1 enter the likelihood. While your colleague suggests building uncertainty into the model, the current practice distinguishes between *measurement error* (modeled via the noise term in the likelihood) and *observation uncertainty* (handled by the quality threshold), whereas Jeffrey conditionalization would model observation uncertainty directly in the update weights.

  The practice is largely consistent, provided one distinguishes epistemic updating from decision theory. Treating inputs as certain propositions while modeling their generation noise is standard in likelihood-based inference; the tension you feel arises only if one conflates the uncertainty of the data-generating process with uncertainty about the data record. Similarly, publishing a full predictive distribution while acting on a median threshold is not inconsistent; the distribution represents the epistemic state, while the threshold represents a decision rule based on a specific loss function (e.g., minimizing absolute error or adhering to a precautionary principle). The only genuine inconsistency lies in the verbal claim that "nothing is ever treated as certain" while the mathematical operation conditions on data as if it were certain; strictly speaking, the data is treated as certain conditional on passing the quality gate.

  However, the practice is philosophically underdetermined regarding the justification for the quality threshold itself. Both Standard Bayesianism and Frequentist likelihoodism treat data as fixed once observed, so the pipeline does not uniquely confirm a Bayesian theory of evidence over a Frequentist one; both would license conditioning on fixed data points. The threshold is engineering work that enforces a philosophical boundary, but the specific cutoff value is pragmatic rather than epistemic. A theory of evidence does not dictate where the quality threshold lies, only that once crossed, the data is treated as fixed. Thus, the pipeline is compatible with multiple epistemologies that share the "fixed data" assumption, but incompatible with those that require uncertain evidence inputs.

  If you adopted the weighted-average rule and abandoned the quality threshold, the pipeline would require fundamental changes in data ingestion, computation, and auditability. You would need to assign a credence $P(Data)$ to every incoming stream rather than a binary pass/fail, requiring a meta-model to generate these input credences based on assay sensitivity or survey profile. Computationally, you would need to integrate over the partition of possible data values rather than evaluating the likelihood at a single point, which may increase complexity. The audit trail would need to record not just the data value but the justification for the assigned credence, exposing the "input problem" that the quality threshold currently hides: namely, where the credences for the data themselves come from. The rival view fails to tell you how to generate these input credences without regress, whereas your current practice solves this by outsourcing the justification to the quality-control protocol, treating it as a procedural constraint rather than a probabilistic input.
