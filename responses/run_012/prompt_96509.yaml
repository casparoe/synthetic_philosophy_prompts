answer: |-
  You have an excellent grasp of the landscape. Your preliminary list captures almost all the major friction points in the literature. Your suspicion is also well-founded: the demand for "metaphysical purity" (no normative/pragmatic ingredients) is often the thing that breaks a theory when it hits the real world.

  Below is the breakdown of desiderata, distinguishing between what is broadly agreed upon as a *problem* versus what is agreed upon as a *solution*, followed by the trade-offs you asked for.

  ### 1. The Desiderata Table
  *Status key: **Consensus** (everyone agrees this is a constraint), **Contested** (camps disagree on whether this is required), **Camp Commitment** (only one side demands this).*

  | Desideratum | Status | Notes |
  | :--- | :--- | :--- |
  | **1. The Gardener Intuition** | **Consensus** | Any theory must classify the gardener's not-watering as a cause of the plant's death. If a theory says "no causation here," it is usually discarded. |
  | **2. Profligacy Control** | **Consensus** | Everyone agrees a theory cannot allow *every* absence to be a cause (e.g., your failure to water the plant). The *solution* is contested. |
  | **3. Selection Mechanism** | **Contested** | Everyone agrees we need to select *which* omission matters. Disagreement lies in whether selection is metaphysical, pragmatic, or normative. |
  | **4. Ontological Status** | **Camp Commitment** | **Realists** say omissions are real entities (negative events). **Fictionalists/Counterfactualists** say they are just true propositions about what didn't happen. |
  | **5. Causation vs. Responsibility** | **Contested** | **Skeptics** say omission "causation" is really just moral/legal responsibility in disguise. **Realists** insist it must be a mind-independent causal relation. |
  | **6. Unified Relation (Monism)** | **Camp Commitment** | **Monists** (e.g., Lewis) demand omission causation be the same relation as positive causation. **Pluralists** allow them to be different relations. |
  | **7. Extensionality** | **Contested** | Does substituting co-referring terms preserve causation? Legal/policy contexts often require **non-extensionality** (descriptions matter), while metaphysics often demands extensionality. |
  | **8. Legal/Policy Vindication** | **Practical Constraint** | For your purposes, this is a requirement. For pure metaphysicians, it is not. A theory that breaks legal doctrine may still be metaphysically sound. |
  | **9. Double Prevention** | **Consensus** | A theory must have a consistent way to handle cases where an omission prevents a preventer (e.g., failing to block a blocker). |

  ---

  ### 2. Genuine Requirements vs. Camp Commitments
  You asked which of these are genuine requirements for an *adequate* account versus which are just commitments of one camp. Given your goal (policy/harm entitlement), here is the filter:

  **Genuine Requirements (For your purpose):**
  1.  **Profligacy Control:** If the theory cannot rule out the "I didn't water the plant either" problem, it is useless for policy. You cannot assign liability if everyone is a cause.
  2.  **The Gardener Intuition:** If the theory cannot explain why the gardener is causally relevant but the passerby is not, it fails the basic test.
  3.  **Action-Guidance:** The theory must yield results that help distinguish when inaction *makes a difference* versus when it is merely background condition.

  **Camp Commitments (You can likely ignore these):**
  1.  **Metaphysical Purity:** The demand that the account contain *no* normative or pragmatic elements. **Verdict:** Drop this. Almost all working accounts that solve profligacy rely on norms, expectations, or duties (Hart & Honoré, Schaffer, etc.). Insisting on purity forces you into a theory that fails the Profligacy test.
  2.  **Monism (Unified Relation):** The demand that omission causation be the exact same metaphysical relation as positive causation. **Verdict:** Drop this. It is perfectly acceptable for policy purposes to treat "causing by doing" and "causing by not doing" as distinct logical structures, provided they both ground liability.
  3.  **Ontological Realism:** Whether omissions are "things" in the world. **Verdict:** Irrelevant for policy. Whether an omission is a "negative event" or a "true counterfactual" matters less than whether it grounds a claim for harm.

  ---

  ### 3. Incompatible Pairs (The Trade-Offs)
  You asked for pairs that cannot be jointly satisfied. This is where the theoretical bodies are buried.

  **Pair A: Metaphysical Purity + Profligacy Control**
  *   **The Conflict:** If you demand causation be a purely physical/mind-independent relation (Purity), you struggle to filter out the infinite non-causes (Profligacy). Physically, the gardener's not-watering and your not-watering look identical (both are absences of water).
  *   **The Cost:** To solve Profligacy, you almost *must* import norms (duties, expectations, normality). If you do that, you violate Purity.
  *   **Winner:** Most modern accounts sacrifice Purity to save Profligacy Control.

  **Pair B: Monism + Intuitive Asymmetry**
  *   **The Conflict:** We intuitively feel that *pushing* someone is different from *not catching* them. If you insist they are the exact same causal relation (Monism), you often have to bite bullets that violate those intuitions (e.g., admitting that absences are "things" that transmit energy, which is weird).
  *   **The Cost:** If you preserve the intuition that they are different, you must accept a pluralist theory of causation (two different relations).
  *   **Winner:** Pluralism is gaining ground because Monism strains credulity on omissions.

  **Pair C: Extensionality + Normative Selection**
  *   **The Conflict:** If causation is extensional, it depends only on the events, not how we describe them. But normative selection (Pair A) depends on descriptions (e.g., "The *doctor* didn't help" vs. "The *person* didn't help").
  *   **The Cost:** If you want to use norms to solve Profligacy, you usually have to accept that causation is **hyperintensional** (sensitive to description).
  *   **Winner:** For legal/policy contexts, you *want* hyperintensionality. (It matters *who* didn't act). Pure metaphysicians hate this; policy writers need it.

  ---

  ### 4. The "Killer" Requirement
  **The Profligacy Problem.**

  This is the single requirement that knocks out the most accounts.
  *   **Pure Counterfactual Theories (Lewis-style):** Fail immediately. (If I had watered it, it would live. If you had watered it, it would live. Therefore we both caused it.)
  *   **Pure Physicalist Theories:** Fail immediately. (There is no physical "absence" entity to link to the death.)
  *   **Simple "But-For" Tests:** Fail immediately.

  To survive the Profligacy Killer, a theory must introduce a **filter**.
  *   *The Filter Options:* Normality (what usually happens), Duty (what was required), or Capacity (who could have done it).
  *   *The Consequence:* As soon as you introduce a filter, you admit that causation by omission is not just "physics + counterfactuals." It is "physics + counterfactuals + **norms**."

  **If you are writing for policy:** Accept the filter. Do not try to find a theory that solves profligacy without norms. It doesn't exist.

  ---

  ### 5. Settled vs. Contested (For your context)

  **Settled (Enough to rely on):**
  *   **Not all absences are causes.** You are safe asserting this.
  *   **Norms matter.** It is no longer controversial to say that duties, expectations, or "normal conditions" play a role in individuating omission causes. (See: Hart & Honoré's *Causation in the Law*, Schaffer's "Contrastive Causation," McGrath's "Normative Theories").
  *   **Counterfactual dependence is necessary but not sufficient.** The plant wouldn't have died if the gardener watered it (necessary), but that alone doesn't make him the cause (not sufficient).

  **Genuinely Contested (Avoid building arguments on this):**
  *   **Whether omissions are "events."** Some say yes, some say no. You can remain agnostic.
  *   **Whether it is the *same* causation as positive acts.** Some say yes, some say no. You can treat them as functionally equivalent for liability without settling the metaphysics.
  *   **The precise metric for "Normality."** Is it statistical (what usually happens) or prescriptive (what should happen)? This is a live wire. For policy, you likely want prescriptive; for metaphysics, they fight over statistical.

  ### 6. Recommendation for Your Purpose
  Since you care about **entitlement to say someone's inaction caused a harm** (policy/liability):

  1.  **Adopt a "Normative Counterfactual" view.** Acknowledge that causation by omission is a hybrid concept. It requires:
      *   Counterfactual dependence (But-for test).
      *   **Plus** a normative/pragmatic filter (Duty, Role, or Expectation).
  2.  **Reject Metaphysical Purity.** Explicitly state that for policy purposes, causation is not a mind-independent physical relation; it is a relation sensitive to social roles. This solves the Profligacy problem (you didn't water the plant because it wasn't your job) without breaking the Gardener intuition.
  3.  **Watch out for the "Collapse."** The risk is that if you lean too hard on norms, "causation" collapses entirely into "responsibility."
      *   *Fix:* Maintain that the Counterfactual is the *causal* bit, and the Norm is the *selection* bit. This keeps causation distinct from blame, even though they work together. (i.e., You can be causally relevant but not blameworthy if you had no duty; you can be blameworthy but not causal if your action wouldn't have changed the outcome).

  **Summary:** Your suspicion is correct. The demand for a "purely metaphysical, non-selective" account is the enemy of utility here. The field has largely moved toward accepting that omission causation is inherently normative/pragmatic. Don't fight that tide; use it to solve the Profligacy problem.
