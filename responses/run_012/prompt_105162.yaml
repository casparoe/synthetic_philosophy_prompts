prompt: |-
  ok so I've been calling myself a two-dimentionalist for years and a friend just told me the position I actually hold can't be held all at once. I don't see it, so I want a second opinion before I keep saying this stuff in seminars. here's the package:

  - semantic externalism about natural kind terms. meanings aren't in the head. 'water' means H2O; my twin on twin earth means XYZ by 'water'.
  - 'water is H2O' is necessary, not contingent. we just get it a posteriori.
  - the 2D machinery is what explains that: each term has a primary intension (the a priori 'watery stuff' role I grasp from the armchair) and a secondary intension (the rigid designation that lands on H2O). the feeling that 'water is H2O' could have come out false is the contingency of the primary intension, not the secondary one.
  - ideal conceivability entails possibility: if I can conceive it without contradiction under ideal reflection, it's possible.
  - zombies are ideally conceivable, so property dualism is true — consciousness isn't physical.
  - scrutability: in principle you could derive every truth a priori from a base of physical and indexical facts. nothing is brute.
  - there's a genuinely possible world where the oceans are XYZ and the locals call it 'water'.

  my friend thinks I'm just deploying 2D wherever it's convenient and that these can't all stand together. which pairs are actually in tension, ranked by how bad, and what's the cheapest fix for each? and which ones only look like they clash? don't just tell me it's all fine or all broken — I want to know specifically what forces what, and what I'd be buying if I paid the repair cost.
reasoning: |-
