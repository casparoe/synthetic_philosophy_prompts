answer: |-
  Your diagnosis of the landscape is correct. The distinction between **Simple Cluelessness** (epistemic limits, causal complexity) and **Complex Cluelessness** (metaphysical indeterminacy, ill-defined probabilities) is the critical fault line. Simple cluelessness is an engineering problem; Complex cluelessness is a foundational threat to the coherence of expected value (EV) maximization.

  If you have three philosopher-years, you cannot solve all of this. You must target the bottleneck. The bottleneck is not "how do we calculate the far future?" (we can't), but "does consequentialism collapse if we can't?"

  Here is the prioritized agenda, ranked by downstream dependence and tractability for armchair/formal philosophy.

  ### 1. The Priority Ranking

  **Tier 1: Decision Rules under Imprecise Credence (The "Complex" Fix)**
  *   **The Question:** If probabilities are not well-defined (Complex Cluelessness), standard EV maximization is a category error. Can we replace "Maximize EV" with a decision rule that works on *intervals* or *sets* of probabilities without abandoning consequentialism? Specifically: Is **Stochastic Dominance** (or a similar comparative rule) sufficient for normative choiceworthiness?
  *   **Why Fund This:** This is the highest leverage. If a philosopher can rigorously demonstrate that a consequentialist is *required* to follow stochastic dominance under conditions of imprecise credence, you solve the "EV isn't a number" problem without changing the axiology. It transforms the problem from "we can't know the value" to "we know A is better than B even if we don't know the values."
  *   **Tractability:** High. This is formal ethics/decision theory. It requires no empirical data, only logical consistency and modeling.
  *   **Downstream Impact:** If this works, it validates consequentialism against the Complex Cluelessness objection and provides a formal basis for "Robustness" (Tier 2).

  **Tier 2: The Normative Status of Robustness (The "Proxy" Fix)**
  *   **The Question:** Is acting on "robustly good" outcomes (good across a wide range of hypotheses) a *heuristic* for finding the EV-maximizing act, or is it a *constitutive* part of rightness?
  *   **Why Fund This:** Currently, "robustness" is used as a shield against cluelessness, but its normative status is vague. If it's just a heuristic, it fails when the heuristic diverges from the truth (which cluelessness suggests it might). If it's constitutive, you are subtly changing the theory of rightness. A project needs to derive robustness *from* consequentialist first principles + epistemic constraints, rather than just adopting it pragmatically.
  *   **Tractability:** Medium. Requires careful conceptual analysis to avoid the "cheating" worry (changing the subject).
  *   **Downstream Impact:** Determines whether "cluelessness-safe" consequentialism is still actually consequentialism.

  **Tier 3: Axiological Truncation & Lexical Thresholds (The "Value" Fix)**
  *   **The Question:** Can we defend a non-arbitrary discount rate or lexical threshold that prevents microscopic probability shifts in the far future from swamping present value, without resorting to ad-hocery?
  *   **Why Fund This:** This addresses the "swamping" problem you identified. However, it is philosophically costly. Defending a discount rate on pure value (not probability) is notoriously difficult. This should only be funded if Tier 1 fails.
  *   **Tractability:** Low. This tends to cycle through the same intuitions (person-affecting views, personhood thresholds) without resolution.
  *   **Downstream Impact:** High, but risky. If successful, it dissolves the longtermist pressure that exacerbates cluelessness.

  **Do Not Fund (Initially): Dual-Criterion Derivation**
  *   **Reason:** You noted this feels like cheating. It usually is. Proposals to "keep the criterion but change the decision procedure" often fail to explain why the agent isn't rationally required to bypass the procedure when they suspect it diverges from the criterion. Fund this only if a specific project proposes a *novel derivation* of a decision procedure from the criterion under specific epistemic constraints, rather than a general defense of rule-consequentialism.

  ---

  ### 2. Tractability Check: What can a philosopher do alone?

  *   **Doable:** Formal modeling of decision rules under imprecise probability. Analyzing the logical relationship between "better than" relations and "goodness" properties. Conceptual analysis of "probability" in causal chains (is it objective chance or epistemic confidence?).
  *   **Not Doable:** Empirical claims about how far causal ripples actually go (this is physics/sociology). Surveys on moral intuition (this is experimental philosophy, low leverage here).
  *   **The Sweet Spot:** The Tier 1 project (Stochastic Dominance under Imprecise Credence) is the ideal fit for a solitary philosopher with formal training. It requires no data, only rigor.

  ---

  ### 3. Kill Conditions: What would stop funding?

  If you are running a multi-year grant, you need triggers to pivot or cancel.

  *   **Kill Switch A (The Mathematical Proof):** If someone publishes a proof showing that under reasonable constraints, imprecise credence sets *collapse* into precise expectations (or that stochastic dominance yields no action-guidance in the relevant cases), **stop funding Tier 1**. The problem reverts to Simple Cluelessness (epistemic), which is less philosophically urgent.
  *   **Kill Switch B (The Axiological Consensus):** If a specific person-affecting or lexical view gains dominant traction in the literature that inherently blocks far-future swamping (e.g., a robust defense of the "Non-Identity Problem" dissolving longtermist obligations), **pivot funding from Tier 1/3 to Tier 2**. The pressure to solve cluelessness diminishes if the stakes of the far future are lowered.
  *   **Kill Switch C (The Derivation):** If someone successfully derives a specific decision procedure (e.g., "follow common sense morality") directly from maximizing EV under cluelessness constraints with high rigor, **fund the implementation, not the theory**. The theoretical work is done.

  ---

  ### 4. Recommended Allocation (3 Philosopher-Years)

  Do not spread this thinly. Concentrate the firepower.

  **Option A: The Deep Dive (1 Postdoc, 3 Years)**
  *   **Mandate:** "Formalize Consequentialism under Complex Cluelessness."
  *   **Year 1:** Map the logical space of imprecise probability in causal chains. (Is the indeterminacy metaphysical or epistemic?)
  *   **Year 2:** Develop/Defend Stochastic Dominance (or equivalent) as the normative standard replacing EV maximization in these contexts.
  *   **Year 3:** Test this standard against the "swamping" cases. Does it block Pascal's Mugging style arguments while preserving standard consequentialist intuitions in near-future cases?
  *   **Risk:** High. If the formalism doesn't work, you have a negative result.
  *   **Reward:** High. Solves the foundational coherence problem.

  **Option B: The Pincer Movement (2 Postdocs, 1.5 Years each)**
  *   **Postdoc 1 (Formal):** Focus on Tier 1 (Decision Rules/Imprecise Credence).
  *   **Postdoc 2 (Normative):** Focus on Tier 2 (Robustness as a Norm). Task: Determine if Robustness can be derived from the output of Postdoc 1.
  *   **Synergy:** Postdoc 1 builds the engine; Postdoc 2 builds the steering. If Postdoc 1 fails, Postdoc 2 pivots to Tier 3 (Axiological Truncation).
  *   **Recommendation:** **Choose Option B.** It hedges your risk. If the formal decision theory hits a wall (which is common), the normative analysis of robustness still yields publishable, field-advancing work on how we ought to reason under uncertainty.

  ### Summary of the Agenda
  1.  **Stop asking** how to calculate the far future.
  2.  **Start asking** what decision rule is rationally mandatory when calculations are impossible (Complex Cluelessness).
  3.  **Fund** the interface between **Imprecise Probability** and **Normative Ethics**.
  4.  **Cancel** if imprecise probability is shown to be action-guidingally inert or if a consensus emerges that far-future value is lexically negligible.

  This moves the field from "Consequentialism seems impossible because we can't know the future" to "Consequentialism requires X decision rule when we can't know the future." That is a net gain in philosophical precision.
