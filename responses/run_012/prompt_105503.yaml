      *   **Strongest Case for Rejected Options:** Focus on (c) Aggregate, since that was the user's lean. It claims legitimacy through numbers.
      *   **Collapse:** Note that (d) Veil of Ignorance collapses into (c) or (e) in practice because you have to operationalize "what people would pick" via surveys or laws.
      *   **Engineering Tests:** How to test this? Regex against legal codes? RAG retrieval of policy docs?
      *   **Switching Evidence:** What would change my mind? Empirical data on harm caused by status quo bias.
      *   **Closing:** Reiterate the need for actionability.

  4.  **Refining the Recommendation:**
