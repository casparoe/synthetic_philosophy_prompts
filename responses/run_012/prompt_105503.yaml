      *   (d) is too abstract for engineering tests ("what would people pick without knowing their position" is hard to operationalize).
      *   (e) Local Deference seems most robust for the specific deployment contexts (hospital/city gov) but tricky for consumer chat. However, since the high-stakes deployment is the hospital/city one, aligning with local law/policy minimizes liability and respects democratic sovereignty in those contexts.
      *   *Alternative:* A hybrid approach. But the prompt asks to recommend one or something else.
