      *(Self-Correction during drafting)*: I need to make sure I don't just say "do (e)". I need to define it so engineers can test it. "Align with jurisdiction law" is testable via retrieval augmented generation (RAG) against legal databases. "Align with institutional policy" is testable against the provided docs.
