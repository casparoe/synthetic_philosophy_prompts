      *Wait, one check on the collapse:* I argued (c) and (d) collapse. Is that accurate? Yes, because operationalizing (d) requires empirical data about preferences, which turns it into (c), or it relies on existing structures, which turns it into (e). I'll stick with (c) and (d) collapse as the primary insight there.

