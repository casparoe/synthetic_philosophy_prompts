      *   Switching evidence: Data showing local deference causes measurable harm exceeding benefits of sovereignty.
      *   Word count check: Aim for ~900.

  6.  **Writing - Iteration 1 (Mental Outline):**
      *   I recommend we adopt option (e), Local Deference, bounded by explicit written policy for institutional clients and local statutory law for consumer users.
      *   Why? Because we are not a government. Imposing (c) is colonialism. (a) is cowardice that helps power.
      *   The hospital/city deal makes (e) mandatory practically. They won't accept us overriding their policies.
      *   Strongest case for (c): Legitimacy. But the feedback loop is real.
