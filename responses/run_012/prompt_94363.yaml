      *   2. *Gradualism:* Experience comes in degrees (thin vs. rich).
      *   3. *Threshold:* Sharp line between *some* experience and *none* (binary existence, continuous quality).
      *   4. *Credence:* Low probability (1%) that insects have morally relevant experience (could be 0%). Determinate answer exists.
      *   5. *Scale:* Huge numbers ($10^{18}$). Expected value matters even at low probability.
      *   6. *Moral Framework:* Aggregative, forward-looking (Expected Value = $P(\text{sentience}) \times \text{Weight} \times \text{Welfare}$).
      *   7. *Correlated Probability:* Not independent per insect. It's a structural question (does *this architecture* support experience?). All insects of type $X$ are in or out together.
      *   8. *Weight Constraint:* Weight is fixed by the "thinness" of the experience (from 2). Can't arbitrarily lower weight if sentience is true.
      *   9. *Small Prob/High Stake:* Accepts Pascal-style reasoning generally (small prob $\times$ huge $N$ = obligation).
      *   10. *Pascal's Mugging:* Rejects absurd extreme cases (infinite disutility $\times$ tiny prob). Needs a cutoff.
      *   11. *Practice:* Status quo ante. No behavioral change despite the math.

