      *   *Alternative:* Change (6). Expected Value Maximization is the culprit. If moral obligation requires *evidence* beyond a threshold, not just EV, then (11) is safe.
      *   *Decision:* The tension is between the *theoretical commitment to EV* (6/9) and the *practical rejection of EV in edge cases* (10/11). The cleanest fix is to acknowledge that (6) is an approximation that fails under extreme uncertainty (Knightian uncertainty).
      *   *Wait, simpler:* The user says "I would rather have it audited than defended." I need to be direct.
