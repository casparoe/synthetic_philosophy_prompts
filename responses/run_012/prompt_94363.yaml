      *   *Tension G: (8) Fixed Weight vs. (11) Inaction.*
          *   *Analysis:* If they *are* sentient, the weight is fixed by biology (thin but real). You can't discount them to zero to make the math work.
          *   *Verdict:* **Genuine.** This prevents "cheating" the calculation to justify inaction.

