answer: |-
  This procedure operationalizes Berkeley's functionalist view of money into a five-step filter that evaluates reform proposals based on their capacity to mobilize idle labor and sustain circulation velocity, forcing the board to explicitly separate technical feasibility from political choices about resource allocation.

  ### 1. Decision Procedure

  **Step 1: The Settlement Test (Legal & Functional)**
  *   **Question:** Does the proposal define a unit that can finally settle debts and tax obligations within its target zone without requiring conversion into an external asset?
  *   **Evidence Required:** Text of proposal regarding legal tender status, tax acceptability, and clearing mechanism. Check against current Central Bank Act.
  *   **Pass:** Yes, or conversion is automatic and costless.
  *   **Fail (Stop):** No, and conversion involves significant friction, cost, or delay (this makes it a voucher, not money).
  *   **Flag for Board:** If "Yes" requires new legislation. This is a political/legal hurdle, not an economic one.

  **Step 2: The Velocity Test (Circulation)**
  *   **Question:** Does the design contain mechanisms to discourage hoarding and encourage rapid turnover (e.g., demurrage, expiration, negative interest, or strict supply rules tied to transaction volume)?
  *   **Evidence Required:** Model of money supply dynamics; historical analogues of similar mechanisms.
  *   **Pass:** Explicit mechanism exists or supply is strictly elastic to transaction demand.
  *   **Fail (Stop):** No mechanism exists and the asset has inherent store-of-value properties unrelated to transaction use (e.g., commodity backing that invites speculation).
  *   **Note:** A small quantity moving quickly is preferred to a large quantity moving slowly.

  **Step 3: The Industry Test (Real Resources)**
  *   **Question:** Is there evidence of idle labor or productive capacity in the target zone that this money would specifically activate?
  *   **Evidence Required:** Regional unemployment data, capacity utilization rates, or sector-specific output gaps.
  *   **Pass:** Clear evidence of idle resources linked to a lack of liquidity rather than structural mismatch.
  *   **Fail (Stop):** Economy is at full capacity (proposal is inflationary) or idle resources are unemployable regardless of credit (proposal is ineffective).
  *   **Flag for Board:** Determining which industries are "worthy" of activation is a value judgment.

  **Step 4: The Integration Test (Systemic Risk)**
  *   **Question:** Does the proposal fragment the unit of account in a way that creates unsustainable arbitrage opportunities or undermines the central bank's ability to manage aggregate demand?
  *   **Evidence Required:** Analysis of exchange rate mechanisms (if any), capital flow controls, and pass-through effects to national inflation.
  *   **Pass:** Either fully integrated (national) or ring-fenced with no fixed exchange rate承诺 that invites runs.
  *   **Fail (Stop):** Fixed exchange rate承诺 between a local currency and national currency without fiscal backing (invites speculative attack).
  *   **Flag for Board:** Tolerance for fragmentation vs. uniformity is a political choice about sovereignty.

  **Step 5: The Credit Allocation Test (Political)**
  *   **Question:** Who decides which wants are funded (the market, the state, or a community board)?
  *   **Evidence Required:** Governance structure of the issuing entity.
  *   **Action:** This step cannot yield a technical pass/fail. It must be presented to the Board as a distributional choice.
  *   **Stop Condition:** If the proposer claims this decision is purely technical rather than political.

  ### 2. Adaptation of Berkeley's Doctrine

  To make Berkeley's *Querist* usable for a modern central bank, I dropped, bent, and simplified three key elements:

  1.  **Dropped: The Moral Economy of Wants.** Berkeley believed authorities should actively frame fashion and taste to direct industry toward virtuous ends. I removed this because modern central banks lack the mandate and competence to engineer social taste. The procedure treats "wants" as exogenous; we test only if money meets them, not if the wants are good.
      *   *Risk:* A proposer could game Step 3 by claiming their project creates "virtuous" industry to bypass scrutiny on profitability.
  2.  **Bent: The "Ticket" Definition.** Berkeley argued metallic content is incidental. However, he assumed a social consensus on the ticket. In modern law, a "ticket" requires legal enforcement for debt settlement. I added Step 1 (Settlement) to enforce this. Without legal tender status or tax acceptability, a "ticket" is merely a private coupon.
      *   *Risk:* Proposers may claim their digital token is "money" without legal backing. Step 1 filters this, but a clever proposer might argue crypto-assets are "private money" exempt from settlement tests.
  3.  **Simplified: Idle Labor Assumption.** Berkeley assumed labor was generally idle and only needed money to move. Modern economies face structural unemployment and supply bottlenecks. I tightened Step 3 to require evidence of *liquidity-constrained* idle resources, not just unemployment.
      *   *Misfire:* The procedure will misfire if inflation expectations are unanchored. Berkeley did not account for modern fiat inflation spirals. If the public expects inflation, velocity increases for the wrong reasons (flight from money), which Step 2 might mistakenly validate as "high circulation."

  ### 3. Worked Applications

  **Application A: Back the Currency Fully with Gold**
  *   **Step 1 (Settlement):** Pass. Gold-backed notes settle debts.
  *   **Step 2 (Velocity):** **Fail.** Gold is a store of value. It invites hoarding during uncertainty, reducing velocity precisely when circulation is needed most. It contradicts Berkeley's principle that denominations should work even if bullion is gone.
  *   **Step 3 (Industry):** **Fail.** Supply is constrained by mining, not by labor demand. Money supply cannot expand to meet idle labor opportunities.
  *   **Verdict:** **No.** Do not study. It fails the core functional test of money as a counter for industry.
  *   **Why:** This is the expected result for a modern central banker; it confirms the status quo.

  **Application B: Depressed Province Issues Local Currency Redeemable in National Currency at Fixed Rate**
  *   **Step 1 (Settlement):** Pass (locally).
  *   **Step 2 (Velocity):** Pass. Local currencies often include demurrage or social pressure to spend locally, increasing velocity.
  *   **Step 3 (Industry):** Pass. The province is depressed; evidence of idle labor is clear. The money targets local exchange.
  *   **Step 4 (Integration):** **Fail (Technical).** A fixed exchange rate without fiscal union invites arbitrage. If the local economy weakens, holders will redeem for national currency, draining reserves.
  *   **Step 5 (Credit):** Flag. Local boards decide allocation.
  *   **Verdict:** **Deserves Study (with warning).**
  *   **Why this is a way you will not like:** The procedure validates the *economic logic* of the local currency (Steps 2 and 3 pass). It confirms Berkeley's view that money can stir local industry even without gold. The only failure is the fixed exchange rate mechanism (Step 4). If the proposer amends the plan to float the local rate or remove redeemability, the proposal passes all technical filters. This forces you to admit that local currencies are *technically viable* tools for employment, and any rejection by the Board must be based on political sovereignty (protecting the monopoly), not economic impossibility. Most central bank research units prefer to dismiss these as economically incoherent; this procedure forces you to concede they are coherent but politically inconvenient.

  ### 4. Unsettled Questions

  1.  **Distributional Consequences:** The procedure identifies if wealth is created, but not who captures it. *Settled by:* Finance Ministry or Legislative Budget Office.
  2.  **Definition of "Idle" Resources:** Distinguishing between structural unemployment and liquidity-constrained unemployment is empirically difficult. *Settled by:* Independent Fiscal Institution or Academic Review.
  3.  **Sovereignty vs. Efficiency:** Whether the benefit of local activation outweighs the cost of monetary fragmentation is a value judgment. *Settled by:* The Board (explicitly voted as a political choice, not a technical finding).
  4.  **Inflation Expectations:** The procedure assumes rational velocity; it cannot fully model a loss of confidence in the unit of account. *Settled by:* Market signaling and communication strategy teams.
