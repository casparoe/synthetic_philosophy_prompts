answer: |-
  This is a fantastic question because it touches on a genuine debate that happens in economics, psychology, and philosophy. Your frustration is completely justified, and your intuition that something is "off" about her theory is sharp.

  Here is the breakdown of where your friend is onto something real, where her logic breaks down, and what is actually settled versus what is still argued by experts.

  ### 1. Is she right that choice is the "real truth" about want?

  **The Case for Her (Revealed Preference):**
  Your friend is essentially arguing for a concept called **Revealed Preference Theory**. This is a dominant idea in economics. The logic is: "I don't care what you *say* you want; I care about what you spend your money/time on."

  There is wisdom here. Humans are prone to **self-deception**. We often say we want to be healthy but eat junk, or say we want a relationship but sabotage it. In this sense, actions *do* cut through the noise of what we think we *should* want versus what we actually prioritize in the moment.

  There is also an existentialist argument (Jean-Paul Sartre) that aligns with her. Sartre argued that claiming you "wanted" to do something but "couldn't" is often "Bad Faith." He believed we are defined by our actions, and claiming our internal feelings are different from our external choices is a way to avoid responsibility.

  **The Case Against Her (Internal Conflict):**
  However, most psychologists and philosophers of mind disagree that choice is the *only* truth.
  *   **Competing Desires:** You can want two incompatible things at once. You can want to go to the party *and* want to get an A. If you study, it doesn't mean the desire to go to the party vanished or was fake. It means the desire for the A (or the fear of failing) was *stronger in that moment*. Her theory erases the existence of the losing desire.
  *   **Akrasia (Weakness of Will):** This is a term from Aristotle that is still debated today. It describes knowing what you want (e.g., to quit smoking) and genuinely wanting it, but failing to choose it due to a lapse in self-control. If wanting *equaled* choosing, addiction would not exist.

  **Verdict:** It is **not settled**. Economics often treats choice as the only measurable desire for modeling purposes. Psychology and Philosophy treat desire as a complex internal state that sometimes fails to translate into action.

  ### 2. Is there such a thing as wanting something but not choosing it?

  **Yes.** This is the biggest hole in your friend's theory. She is conflating **Desire**, **Intention**, and **Ability**.

  *   **External Constraints:** If you want to go to Sam's party but your car breaks down, or your parents ground you, or you have to work, you didn't choose to stay home. You were forced. Her theory assumes everyone has equal agency to act on their desires, which isn't true.
  *   **The "Cost" Variable:** You might want the guitar, but you also value your free time. If you practice once a week, it might mean you want the guitar *less than the person who practices daily*, but it doesn't mean you *don't want it*. It just means the "cost" (effort/boredom) outweighs the benefit for you more often than for them.
  *   **Regret:** The clearest proof that wanting $\neq$ choosing is **regret**. If you choose to stay home and study, but you spend the whole night miserable and wishing you were at the party, your choice was "study," but your want was arguably "party." If choice was the only truth about want, regret would be logically impossible.

  ### 3. The "Ranking" Claim (The Weakest Link)

  Your friend takes it a step further: *"If two people do the same thing they want the same amount."*

  **This is widely rejected.** Even among economists who like Revealed Preference, this specific claim is considered false.

  *   **Discipline vs. Desire:** Person A might practice guitar 5 times a week because they love music moderately but are extremely disciplined. Person B might practice 5 times a week because they are terrified of their parents taking the guitar away, even though they hate music. Same action, vastly different "want."
  *   **Ability:** Two people might apply to the same college. One gets in, one doesn't. Did they want it the same amount? No. One might have wanted it more but lacked the grades.
  *   **Marginal Utility:** In economics, the *same* action can represent different levels of value depending on what else you gave up. If a billionaire spends \$5 on coffee, it reveals less about their "want" than if a broke student spends \$5 on coffee.

  Her list on her phone is essentially pseudoscience. There is no unit of measurement for "want" that can be read off behavior alone without knowing the person's internal context, constraints, and alternatives.

  ### 4. Is she just re-describing choices? (The Tautology Problem)

  You hit the nail on the head here. You asked: *"If 'what you want' just means 'whatever you happened to choose,' is that even a real claim about me?"*

  In philosophy, this is called a **Tautology**. It's a statement that is true by definition but explains nothing.
  *   **Her definition:** "Want" = "What you chose."
  *   **The problem:** If "want" just means "choice," then the sentence "I wanted to go but didn't" becomes "I chose to go but didn't choose to go," which is nonsense.

  By defining "want" *as* "choice," she makes her theory unfalsifiable (impossible to prove wrong). If you do it, you wanted it. If you don't, you didn't. A theory that can never be wrong is usually a sign that it isn't actually saying anything about reality; it's just playing with words.

  **Is this settled?**
  Logicians and philosophers of language generally agree with you on this: If a definition makes a claim unfalsifiable, it's not a useful scientific or psychological claim. However, some behaviorist psychologists (like B.F. Skinner) historically argued exactly what your friend is arguing: that internal states like "wanting" are irrelevant ghosts, and only behavior matters. This view has largely fallen out of favor in modern cognitive science, which accepts that internal states are real and influence behavior, even if they aren't perfectly aligned with it.

  ### 5. How do you figure out what someone wants?

  If actions aren't the whole story, how *do* we know? Smart people (psychologists, friends, observers) usually look at a **triangulation** of three things:

  1.  **Choices (Behavior):** What did they actually do? (Your friend's only metric).
  2.  **Reports (Words):** What do they say they value? (Self-reporting).
  3.  **Reactions (Emotions):** How do they feel after the choice?

  **Example:**
  *   **Scenario:** You stay home to study.
  *   **Friend's View:** You wanted to study.
  *   **Triangulated View:** You chose to study. You said you wanted to party. If you feel relieved you studied, your friend is right (you prioritized grades). If you feel resentful and sad, you likely *wanted* the party more, but chose safety/grades due to fear or obligation.

  ### Summary: Where the Debate Stands

  *   **Settled:** It is **not** settled that choice equals desire. Most modern psychology and philosophy reject the idea that behavior is the *only* reality of human desire. The existence of addiction, coercion, regret, and weakness of will proves that "want" and "choose" are different mechanisms in the brain.
  *   **Settled:** Her specific claim that "same action = same amount of want" is **false**. Context, ability, and discipline vary too much for that to hold up.
  *   **Debated:** How much weight we should give actions vs. words. Economists lean toward actions (because they are observable data). Therapists lean toward words/feelings (because they reveal internal conflict).

  **How to argue with her:**
  Don't try to convince her she's wrong about everything. Concede that actions are *evidence* of desire, but deny that they are the *definition* of desire.

  Tell her: *"You're treating 'want' as a synonym for 'choose.' But if they meant the same thing, we wouldn't have two different words. I can choose X because I'm scared, not because I want it. If you ignore the fear, you aren't analyzing my wants, you're just describing my feet."*

  She is using a "hard truths" framework to feel superior to the messiness of human emotion. It's a valid lens for economics, but a terrible lens for friendship.
