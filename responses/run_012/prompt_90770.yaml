prompt: |-
  ok so my friend has this whole theory about people and honestly it's driving me up the wall, i need a second opinion.

  Her thing is: you can always tell what someone actually wants from what they do, period. Words don't count, feelings don't count, only choices. So if i say i want to get good at guitar but i practice like once a week, she says nope, you don't actually want it, you just like the idea of it. If i say i wanted to go to sam's party but stayed home to study, she says staying home is what you wanted more, or you'd have gone. When i said i liked a boy who never texts me back, she said well then you don't really like him, because if you did you'd find a way. It's like she thinks there's no such thing as wanting something and not doing it — wanting just IS doing.

  And she takes it further. She says if two people do the same thing they want the same amount, so she can rank basically everyone in our year by how much they "really" want to be popular, just from watching what they do, like it's a number you can read off people's behavior. She literally keeps a list on her phone.

  The problem is i can't figure out how to argue with her. Whatever i do she says see, that proves my point. If i did the thing, i wanted it. If i didn't, i didn't want it. She can never be wrong, which seems way too easy for a theory about actual people. And like — if "what you want" just means "whatever you happened to choose," is that even a real claim about me, or is she just re-describing my choices in fancier words?

  But also, maybe she's kinda right? Actions do seem more honest than words. So my questions are: is she right that what you choose is the real truth about what you want? Is there such a thing as wanting something you don't end up choosing? And if wanting isn't just the same as choosing, how is anyone supposed to figure out what someone wants?

  One more thing, please don't just tell me one side like it's obvious. I want to know what's actually settled here vs what smart people still argue about — like is it definately a done deal that choices show what people want, or is that a live arguement? Don't make out that everyone agrees if they don't.
