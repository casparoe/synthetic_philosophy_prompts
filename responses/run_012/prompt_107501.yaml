answer: |-
  ### Desiderata for an Adequate Theory of Corruption

  To grade candidate theories, we must first specify what work they are required to do. The following list is derived from the five cases provided and the distinctions requested. Each requirement includes the motivating case, the consequence of dropping it, and the specific distinction it enforces.

  #### 1. The Requirement of Lexical Independence
  *   **Motivation (Case 3):** A society may lack the word "corruption" yet punish betrayals of office, or possess the word but use it purely as a political weapon. Conversely, a donor country may treat its own statutes as universal.
  *   **Requirement:** The theory must be able to identify a practice as corrupt without relying on the local vocabulary, the local legal code, or the local sense of shame. It must posit a trans-cultural standard of public office.
  *   **Cost if Dropped:** If dropped, the theory collapses into cultural relativism (unable to critique a society that accepts bribery) or legal positivism (unable to critique a society where corruption is legal). It renders cross-cultural diagnosis impossible.
  *   **Distinction Enforced:** Separates *corruption* from *illegality* and *local stigma*.

  #### 2. The Requirement of Specific Exchange
  *   **Motivation (Case 1 vs. Case 2; Gift vs. Bribe):** In Case 1, the offering is fixed, public, and customary (manners). In Case 2, the payment is negotiated, secret, and decision-altering (bribe). A diffuse social obligation (gift) differs from a specific transactional purchase (bribe).
  *   **Requirement:** The theory must distinguish between a transfer that creates a diffuse, long-term social obligation and a transfer that purchases a specific, immediate official act.
  *   **Cost if Dropped:** If dropped, all gift-giving becomes suspicious, paralyzing social cohesion, or conversely, all bribes can be disguised as "gifts." The theory fails to isolate the *quid pro quo* mechanism.
  *   **Distinction Enforced:** Separates *gift/tribute* from *bribe*.

  #### 3. The Requirement of Institutional Purpose
  *   **Motivation (Case 4):** A payment secures a service the state is failing to provide. Is this corruption or a workaround?
  *   **Requirement:** The theory must define the "duty" of the office not merely by formal rules (which may be broken) but by the *purpose* of the institution (e.g., to provide security, justice, or services). Corruption is a betrayal of that purpose for private gain, even if the formal rule is bypassed to achieve the purpose.
  *   **Cost if Dropped:** If dropped, the theory becomes purely legalistic (if the rule is broken, it's corruption, even if the outcome is just) or purely consequentialist (if the outcome is good, it's not corruption, even if the office is sold). It loses the ability to judge *role morality*.
  *   **Distinction Enforced:** Separates *rule-breaking* from *purpose-betrayal*.

  #### 4. The Requirement of Systemic Function
  *   **Motivation (Case 5):** Patronage functions as political representation for the ignored.
  *   **Requirement:** The theory must account for the systemic role of the practice. It must distinguish between an individual betrayal of trust and a parallel system of resource distribution that substitutes for formal institutions.
  *   **Cost if Dropped:** If dropped, the theory criminalizes the only survival mechanism available to marginalized populations, treating political clientelism as identical to petty theft. It becomes a tool of elite consolidation rather than reform.
  *   **Distinction Enforced:** Separates *corruption* from *clientelism*.

  #### 5. The Requirement of Normative Force
  *   **Motivation (Case 2 & 4):** Case 2 must be condemnable. Case 4 is morally ambiguous (survival).
  *   **Requirement:** The theory must retain the capacity for moral condemnation. It cannot be purely descriptive. If it labels something corrupt, it implies it *ought* to be stopped.
  *   **Cost if Dropped:** If dropped, "corruption" becomes a synonym for "informal practice," stripping the term of its critical power. The theory becomes a taxonomy rather than an evaluation.
  *   **Distinction Enforced:** Separates *description* from *prescription*.

  ***

  ### Classification of Requirements

  **Non-Negotiable (Constitutive of the Concept)**
  *   **Lexical Independence:** Without this, there is no theory, only translation.
  *   **Specific Exchange:** Without this, the concept swallows all social interaction.
  *   **Normative Force:** Without this, the label "corrupt" has no bite.

  **Camp Preferences (Subject to Theoretical Trade-off)**
  *   **Institutional Purpose:** *Legalists* prefer formal rules; *Functionalists* prefer institutional purpose. This is a battleground, not a baseline.
  *   **Systemic Function:** *Universalists* want to condemn clientelism everywhere; *Contextualists* want to excuse it where it substitutes for the state. This is where the theory's political allegiance is revealed.

  ***

  ### The Contradiction: Jointly Unsatisfiable Desiderata

  You asked for a real contradiction, not a tidy list. There is a subset of requirements that cannot be simultaneously satisfied in weak-state contexts (Cases 4 and 5).

  **The Contradictory Subset:**
  1.  **The Requirement of Lexical Independence (Universality):** The definition of corruption must apply consistently across contexts based on the structure of the act (e.g., private gain for public decision), regardless of local conditions.
  2.  **The Requirement of Systemic Function (Legitimacy):** The theory must not classify a practice as corrupt if that practice constitutes the sole viable mechanism for securing basic rights or political representation for a population.

  **The Conflict:**
  In many weak states (Case 5), the "sole viable mechanism" for representation *is* the exchange of private resources for public decisions (patronage/clientelism). Structurally, this looks identical to the "Secret Bribe" (Case 2) which Universality demands we condemn.
  *   If you satisfy **Universality**, you must classify the survival mechanism of the poor as corrupt. This violates **Legitimacy** (you are condemning the only bridge across a chasm).
  *   If you satisfy **Legitimacy**, you must exempt the practice from the label "corrupt" based on its context. This violates **Universality** (the same act is corrupt in London but legitimate in Lagos).

  **Why this is unsatisfiable:**
  You cannot have a definition that is both *context-invariant* (Universality) and *consequence-sensitive* (Legitimacy) when the context determines the consequence. To resolve this, a theory must abandon one desideratum.
  *   Abandoning Universality makes the theory parochial (it judges based on outcomes we approve of).
  *   Abandoning Legitimacy makes the theory imperialist (it demands standards that destroy the local order).

  **The Loss:**
  If you drop Universality, you lose the ability to say corruption is *wrong in itself*; it becomes wrong only when it fails to function. If you drop Legitimacy, you lose the ability to distinguish between a thief and a substitute state. **A theory of corruption cannot be both universally applicable and politically humane in failed states.**

  ***

  ### The Single Exclusionary Requirement

  The requirement that does the most work to exclude otherwise popular theories is:

  **The Requirement of Lexical Independence (specifically, Independence from Local Law).**

  **What it excludes:**
  1.  **Legalistic Definitions (e.g., early World Bank/IMF approaches):** These define corruption as "the abuse of public office for private gain *in violation of the law*." If Lexical Independence holds, an act can be corrupt even if it is legal (e.g., legalized lobbying that buys legislation) and not corrupt even if illegal (e.g., Case 4, where breaking a rule secures a right). This excludes the vast majority of statutory compliance frameworks.
  2.  **Cultural Relativism:** This excludes anthropological accounts that argue corruption is purely a Western construct imposed on other societies (Case 3). If the theory must work without the local word, it asserts a universal reality of "public office" that transcends local culture.
  3.  **Public Opinion Metrics (e.g., Transparency International perception indices):** These rely on locals *feeling* shame or perceiving corruption. If the locals (Case 1) feel no shame because it is "manners," a perception index fails. Lexical Independence demands an objective standard of betrayal regardless of local sentiment.

  By insisting that corruption is a structural betrayal of public purpose identifiable from the outside, regardless of local law or local shame, you eliminate the two most common ways governments defend themselves ("It wasn't illegal") and the two most common ways critics dismiss the concept ("It's just Western imperialism"). You are left only with theories of **Institutional Integrity**, which are far harder to sustain but the only ones capable of handling Case 2 without condemning Case 5 unjustly—or revealing the contradiction that they cannot do both.
