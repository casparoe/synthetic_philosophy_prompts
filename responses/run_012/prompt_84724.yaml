answer: |-
  (a) **Three-Stage Diagnostic**

  **Stage 1:** The key term is "planet." The sentence in which the parties appear to disagree is "Pluto is a planet." The IAU asserts the negation ("Pluto is not a planet"), while objectors assert the affirmative.
  **Verdict:** Disagreement located.

  **Stage 2:** The parties do not attach the same sense to the term. The IAU attaches a sense defined by three criteria (orbits Sun, round, cleared orbit), whereas objectors attach a sense defined primarily by two criteria (orbits Sun, round), treating the third as arbitrary.
  *   **Empirical Claim:** Prior to 2006, actual usage of "planet" included Pluto. Evidence for this is the consistent classification of Pluto as a planet in textbooks and catalogues from 1930 to 2005.
  *   **Stipulation:** The IAU resolution stipulates a new sense for "planet" to govern future usage. Objectors stipulate that the sense ought to remain tied to geophysical properties rather than orbital dynamics.
  **Verdict:** Senses differ.

  **Stage 3:** We must ask whether these divergent readings yield a single shared question. If the question is "Does Pluto satisfy the IAU definition?", the answer is yes, and there is no dispute. If the question is "Does Pluto satisfy the objector's definition?", the answer is yes, and there is no dispute. The appearance of disagreement dissolves unless there is a shared question independent of the specific definitions, such as "Is Pluto sufficiently distinct to warrant top-tier classification?" However, since the definition *constitutes* the tier, there is no proposition independent of the sense attached to "planet" that both parties are affirming or denying about Pluto itself.
  **Verdict:** No single shared proposition under dispute; diagnostic indicates a verbal dispute.

  (b) **Breakdown of the Diagnostic**

  The diagnostic breaks down because the dispute survives the dissolution of the first-order proposition. It persists as a second-order verbal dispute: the parties know they mean different things and are arguing about which sense ought to govern the term. This is a normative question about concepts rather than a factual one. However, the diagnostic struggles to categorize the factual elements embedded in this normative question. The parties are disagreeing about facts regarding the structure of the Solar System (whether "clearing the orbit" maps to a natural division) and about what classification is for (whether it should reflect dynamics or geophysics).

  Furthermore, the vote, textbook consequences, and public reaction are not mere noise to the apparatus; they are constitutive of the dispute's reality. The apparatus treats the vote as a stipulation, but for the objectors, the vote is an authoritative act they reject, while for the IAU, it is a settling act. The apparatus cannot easily represent the *authority* of the stipulation versus the *resistance* to it, treating both as merely proposing senses. Consequently, the diagnostic fails to capture why the dispute feels substantive despite lacking a shared first-order proposition.

  (c) **Reverse Direction: Episode Testing the Apparatus**

  The episode shows that the verbal/substantive distinction is porous when applied to scientific taxonomy. It favours the negotiation diagnosis over the strict verbal-dispute diagnosis. The parties are not merely describing meaning; they are using the term to propose a conceptual scheme. This makes the exchange substantive—it has a real subject matter, namely which conceptual scheme we should adopt—without being a disagreement about non-linguistic fact in the traditional sense.

  The third position (Realist) is embarrassed by the episode. If the correct sense of "planet" had an answer independent of our decisions, the vote would indeed be a change of subject rather than a discovery. However, the history of the term (including the Ceres precedent) suggests there is no mind-independent fact of the matter waiting to be discovered, only useful policies. If the term is understood as functional or administrative—its correct sense being the best policy for classifying a population—then the dispute is less like a verbal dispute about word meaning and more like a substantive policy dispute. This complicates the apparatus, which relies on a sharp divide between linguistic convention and non-linguistic fact.

  (d) **Impact of Precedents**

  The Ceres precedent and the earlier inclusion of Earth demonstrate that the term's sense has always been in flux, changing based on the population of known objects rather than new discoveries about the objects themselves. Ceres changed from planet to asteroid not because Ceres changed, but because the context (discovery of similar bodies) changed. This historical flux undermines the idea of a single shared question the parties answer differently. If the sense is inherently context-dependent and mutable, there is no stable proposition "Pluto is a planet" that persists across the dispute. Instead, the shared question is necessarily meta-linguistic or meta-conceptual: "Given the current population of Solar System bodies, which taxonomy serves science best?" This supports the view that the dispute is about conceptual scheme adoption rather than truth-conditional semantics.

  The Pluto reclassification is formally a second-order verbal dispute over definition governance that reveals substantive disagreements about scientific taxonomy and classification policy.

  \answer{mixed}
