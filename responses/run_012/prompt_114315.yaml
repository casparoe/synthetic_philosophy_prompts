answer: |-
  You have put your finger on a genuine and persistent methodological problem in historiography and the social sciences. You are correct to distinguish this from standard hindsight bias (which concerns probability estimation) and the narrative fallacy (which concerns coherence). You are describing a bias in **causal selection** driven by the **valence of the outcome**.

  There is no single, universally standardized term in general historiography that isolates this mechanism exactly as you describe it. However, it is discussed under different names in adjacent fields. Here is the breakdown of the existing landscape, followed by a proposed term that fits your specific definition.

  ### 1. The Existing Neighborhood

  **A. Outcome Bias (Psychology/Decision Science)**
  *   **What it is:** The tendency to judge the quality of a *decision* based on the *outcome* rather than the quality of the decision process at the time it was made.
  *   **Why it's close:** It centers on the outcome determining the judgment.
  *   **Why it falls short:** It is typically applied to moral or rational *evaluation* of an agent ("Was that a good bet?"), not to the ontological status of *causal factors* ("Was this condition a cause?"). It doesn't capture the promotion/demotion of background conditions you identified.

  **B. The Symmetry Principle (Sociology of Scientific Knowledge)**
  *   **What it is:** A normative rule proposed by the "Strong Programme" (Bloor, Barnes) in the 1970s. It states that historians/sociologists should explain true and false beliefs (or successful and failed theories) using the *same types of causes*.
  *   **Why it's close:** It explicitly forbids the asymmetry you describe. When historians explain a successful theory by "evidence" but a failed one by "social bias," they are violating the Symmetry Principle.
  *   **Why it falls short:** This is the *rule* being broken, not the name of the *bias* itself. The violation is usually just called "asymmetrical explanation."

  **C. Teleological Explanation (Philosophy of History)**
  *   **What it is:** Explaining an event by its end goal or purpose.
  *   **Why it's close:** It involves reading backward from the result.
  *   **Why it falls short:** As you noted, this implies purpose or inevitability (Whiggism). Your example includes failed risings, which have no "success" teleology, yet the bias persists.

  ### 2. The Coinage: Outcome-Dependent Causal Selection (ODCS)

  Since no existing term precisely captures the *mechanism of causal promotion/demotion* independent of inevitability or narrative, I propose the term **Outcome-Dependent Causal Selection (ODCS)**.

  **Definition:**
  ODCS is the cognitive and rhetorical tendency to promote antecedent conditions to the status of "causes" when they precede a salient outcome, and to demote identical conditions to "background" or "noise" when they precede a null or opposite outcome, absent any independent counterfactual test for causal efficacy.

  **How it differs from the others:**
  *   **Vs. Hindsight Bias:** Hindsight bias says, "Given the outcome, the probability of this happening was high." ODCS says, "Given the outcome, *this specific factor* was the driver." Hindsight inflates confidence; ODCS重构 (restructures) the causal architecture.
  *   **Vs. Narrative Fallacy:** The narrative fallacy demands a story. ODCS can occur in analytic, non-narrative histories. It is about variable selection, not plot coherence.
  *   **Vs. Whiggism:** Whiggism assumes the present was the *goal*. ODCS applies to any binary outcome (Success/Failure, Revolution/Repression) regardless of whether the outcome represents "progress."

  ### 3. The Edges of the Concept

  You asked specifically about the boundaries of this bias, particularly regarding non-narrative explanations.

  **A. Does it apply to statistical models?**
  **Yes.** In quantitative history or social science, ODCS manifests as **Post-Hoc Variable Selection** or **Model Overfitting to the Signal**.
  *   *Example:* A historian builds a regression model to explain revolutionary success. They include variables $X, Y, Z$. The model fits. They then look at a failed revolution. If they retain $X, Y, Z$ but find they don't predict failure, an ODCS-driven researcher might add "error terms" or "unique local factors" *only* to the failure case to make the model fit, while treating the success model as robust.
  *   *The Test:* If the model specification (which variables are included) changes depending on the value of the dependent variable (the outcome), that is ODCS. A robust model must be specified *blind* to the outcome or validated on out-of-sample data where the outcome is unknown to the modeler.

  **B. The "Rationalization" vs. "Explanation" Label**
  You noted readers call the success account an "explanation" and the failure account a "rationalization." This is a key marker of ODCS.
  *   **Explanation:** Implies the factors *necessitated* the outcome.
  *   **Rationalization:** Implies the factors were merely *consistent* with the outcome but didn't drive it.
  *   ODCS dictates that we only grant "necessitation" status to factors that align with the *actualized* world. In the failed world, those same factors are treated as insufficient, not because they were different, but because the world didn't actualize.

  **C. The Counterfactual Edge**
  The only way to test for ODCS is through rigorous **counterfactual analysis**.
  *   If you claim $X$ caused Success in Case A, you must be willing to claim that removing $X$ would have prevented Success.
  *   If you claim $X$ was merely background in Case B (Failure), you must be willing to claim that adding $X$ to Case B would *not* have guaranteed Success.
  *   ODCS occurs when the historian is unwilling to run these counterfactuals symmetrically. They treat $X$ as potent in A but inert in B solely because they know B failed.

  ### Summary
  You are describing **Outcome-Dependent Causal Selection**. It is the violation of the **Symmetry Principle** driven by the cognitive heuristic that **actual outcomes validate causal potency**. It is distinct from hindsight bias because it alters the *causal map*, not just the *probability estimate*. It applies equally to narrative history and statistical modeling whenever the selection or weighting of independent variables is contaminated by knowledge of the dependent variable.
