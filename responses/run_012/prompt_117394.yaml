answer: |-
  This is a profound observation, and you are right to feel that the standard explanations ("tools are neutral," "path dependence") don't quite capture the specific texture of what you're describing. You are describing a situation where **agency is distributed across time and material**, resulting in a structure that feels inevitable but was never chosen.

  There isn't one single word that captures the whole picture, but there are three concepts from different fields that, when stacked, describe exactly what you are seeing.

  ### 1. The Engineering Term: Inverse Conway's Law
  **Conway's Law** (1967) states: *"Organizations which design systems are constrained to produce designs which are copies of the communication structures of these organizations."* (i.e., If you have four teams, you'll build a four-part compiler).

  What you are describing is **Inverse Conway's Law**. This is the observation that once a system is in place, the organization will restructure itself to match the topology of the system to reduce friction.
  *   **Why it fits:** It explains why teams split by topic/partition and why on-call follows the queue. The path of least resistance is for humans to flow around the solid objects (the technology) already in place.
  *   **What it leaves out:** It describes the *correlation* between tech and org, but it doesn't fully explain the *mechanism* of how you got there without a decision. It implies a static mapping, whereas you are describing a dynamic drift.

  ### 2. The Decision Theory Term: The Tyranny of Small Decisions
  Coined by economist Kenneth Boulding (and ecologist William Odum), this describes a situation where **a set of small, individually rational decisions cumulatively results in a major, unchosen, and often negative outcome.**
  *   **Why it fits:** This addresses your point that "every step was a normal engineering call." No single person decided to tie the company's career ladder to queue tuning. But Person A optimized for the queue, Person B hired for queue skills, Person C built a tool that assumed the queue structure. Each step was locally optimal (rational), but the global outcome (a company held hostage by a 5-year-old choice) was never selected.
  *   **What it leaves out:** It focuses on the *decisions*, but it treats the technology as a passive backdrop. It doesn't fully capture why the *queue specifically* exerted this pressure, rather than some other part of the system.

  ### 3. The Philosophy/Sociology Term: Actor-Network Theory (ANT) / Sociomateriality
  This is the heavy artillery. In traditional thinking, humans have agency and tools do not. **Actor-Network Theory** (associated with Bruno Latour and Michel Callon) argues that **non-human entities (like your message queue) are "actants."** They have agency because they modify the actions of other actors.
  *   **Why it fits:** It directly counters the argument that "the queue is neutral." In ANT, the queue is not neutral; it *prescribes* behavior. By making partitions hard to change, it *votes* on how teams should be split. By making tuning difficult, it *votes* on who gets promoted. The "choice" wasn't made by humans; it was negotiated between humans and the queue.
  *   **What it leaves out:** It is academically dense and can feel like it absolves humans of responsibility too much ("The queue made me do it"). It also doesn't offer a way to fix it, only a way to see it.

  ---

  ### If you need a name to use in a meeting:
  If you say "Actor-Network Theory," eyes will glaze over. If you say "Conway's Law," they might think you mean the original version.

  I recommend calling this **Technical Gravitation** or **Structural Drift**.

  *   **Technical Gravitation:** The technology has mass. The more you build around it, the heavier it gets, and the more it bends the organization toward it.
  *   **Structural Drift:** The organization is drifting toward the shape of the technology because it is easier to move people than to move the tech.

  ### Where are the edges? (When does this *not* apply?)
  To understand the concept, you need to know where it stops. This phenomenon stops applying when:

  1.  **Abstraction is Perfect:** If the technology is truly implementation-detail agnostic (e.g., a SQL database where no one knows or cares about the engine underneath), it cannot shape the org. Your queue shaped the org because its *specific* mechanics (partitions, topics) leaked into the business logic.
  2.  **Conscious Refactoring:** The moment a human says, "This queue shape is wrong for the business, we will absorb the cost to change the org *first* and then the tech," the drift stops. This is rare because it requires fighting gravity.
  3.  **Crisis:** When the system fails catastrophically, the "small decisions" chain is broken by a "large decision." The drift only happens during periods of stability.

  ### Summary
  You are experiencing **Structural Drift driven by the Tyranny of Small Decisions.**

  *   **The Mechanism:** Locally rational micro-optimizations (Tyranny of Small Decisions).
  *   **The Force:** The specific constraints of the tool acting as an agent (Actor-Network Theory).
  *   **The Result:** The org mirroring the tech (Inverse Conway's Law).

  The reason people say "the queue is neutral" is that they are looking for a **smoking gun** (a villain who decided this). There is no smoking gun. There is only **erosion**. The water didn't decide to carve the canyon; it just flowed, and the rock was soft. You are living in the canyon.
