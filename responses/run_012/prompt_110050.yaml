      *(Refining the "Verdict I won't like")*: Let's make Case 2 the unpopular one. If someone shares *nothing* but the project and recognition, calling them the "same person" feels utilitarian and cold. That works.

      *(Refining "Unstable")*: Case 3 is inherently unstable.

