          1.  Briefly brainstorm distinct senses of self-survival (memory, character, pattern, social hold) and where they diverge.
          2.  Create a *decision procedure* (step-by-step questions) for the novelist to use scene-by-scene to determine if a copy counts as "the same person" for narrative purposes (grief, promises, inheritance, murder, etc.).
          3.  Constraints: Usable at a desk, free of jargon (grounded in Hofstadter + psychological continuity but accessible), yield actionable narrative beats (dialogue, hesitation), include verdicts (some disliked/unstable), and acknowledge limitations.
          4.  Run the procedure on three specific cases from the draft.
          5.  End with limitations (what the procedure can't do, where it's disguised metaphysics).
          6.  Language: American English.

  2.  **Brainstorming Senses of Self-Survival:**
      *   *Memory Continuity:* Remembering doing the thing. (Locke). Problem: False memories, memory loss, copying breaks the chain.
      *   *Character/Personality:* Dispositions, habits, tastes. Problem: People change naturally; copies diverge.
      *   *Self-Representing Pattern (Hofstadter):* The "I" is a symbol inside the brain that refers to itself. Can be replicated. Problem: Once replicated, which one is the "real" symbol?
      *   *Social Hold (Externalism):* You are who others treat you as. (Dennett/Constitution View). Problem: Others can be wrong; crowds can disagree.
      *   *Where they come apart:* A copy remembers everything but acts differently (Memory vs. Character). A copy acts the same but no one knows they exist (Character vs. Social). A copy remembers but knows they are a copy (Memory vs. Identity).

  3.  **Developing the Decision Procedure:**
      *   *Goal:* Not to find the * metaphysical truth* (which doesn't exist), but to find the *narrative truth* for the specific context (grief, law, promise).
      *   *Structure:* Ordered questions. Stop conditions. "Hand back to author" points.
      *   *Grounding:* Blend Psychological Continuity (memory/intention) with Hofstadter's "Symbol Me" (pattern) and Social Externalism (recognition).
      *   *Steps:*
          1.  *The Internal Claim:* Does the copy feel like the original? (Phenomenology)
          2.  *The External Recognition:* Do the relevant others treat them as the original? (Social)
          3.  *The Functional Carryover:* Are they finishing the original's projects/intentions? (Agency)
          4.  *The Divergence Check:* Has the pattern drifted too far? (Hofstadterian pattern stability)
          5.  *The Stakes Check:* What is the specific context? (Law vs. Love vs. Memory)
      *   *Actionable Output:* Each step needs to suggest a scene beat.

  4.  **Running the Procedure on Three Cases:**
      *   *Case 1:* Copy has memories, no character. (Memory vs. Character)
      *   *Case 2:* Copy shares nothing, continues project, recognized by loved ones. (Social/Functional vs. Psychological)
      *   *Case 3:* Two copies, diverged, both claim a promise. (Conflict/Scarcity)
      *   *Requirement:* Include one verdict the author won't like. Flag unstable verdicts.

  5.  **Drafting the Content - Section by Section:**

      *   *Introduction:* Acknowledge the role. Set the tone (pragmatic philosophy).
      *   *Brainstorm:* Keep it brief as requested. List the senses and the fractures.
      *   *The Procedure:* "The Identity Audit." Make it look like a checklist. Use plain English.
      *   *The Cases:* Apply the audit. Be decisive.
      *   *Limitations:* Where does the tool break?

      *Refining the Procedure:*
      *   Need to ensure it's not just "yes/no" but yields *narrative texture*.
      *   Step 1: The Inner Voice. (Does the copy say "I"?)
      *   Step 2: The Mirror Test. (Do others see the original?)
      *   Step 3: The Unfinished Business. (Are they doing what the original meant to do?)
      *   Step 4: The Drift. (How much have they changed since the split?)
      *   *Stop Rule:* If Step 1 fails, it's a stranger wearing skin. If Step 2 fails, it's a legal ghost. If Step 4 fails, it's a new person.
      *   *Value Handoff:* When the stakes change (e.g., criminal liability vs. inheritance), the answer might flip. That's where the author decides.

      *Refining the Cases:*
      *   Case 1 (Memories, No Character): Procedure should likely say "Not the same person" for intimacy, "Same person" for information. Verdict: Not the same for the widow. (Author might not like this if they want a ghost story).
      *   Case 2 (No Shared Traits, Shared Project/Recognition): Procedure says "Same person" socially/legally, "Stranger" internally. Verdict: Same for inheritance.
      *   Case 3 (Two Copies, Diverged Promise): Procedure must fail here. It's a conflict. Verdict: Neither/Both. Unstable.

      *Refining the Limitations:*
      *   Can't solve moral guilt.
      *   Can't solve the "first person" privilege.
      *   Disguised metaphysics: The definition of "relevant others."

  6.  **Review against Constraints:**
      *   American English? Yes.
      *   No jargon? (Explain "pattern" simply).
      *   Usable at desk? Yes, checklist format.
      *   Yield lines/hesitations? Yes, embed this in the procedure steps.
      *   One verdict I won't like? I'll make Case 1 harsh.
