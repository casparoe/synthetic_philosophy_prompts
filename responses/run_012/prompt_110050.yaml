answer: |-
  ### Part 1: The Brainstorm

  Before we build the tool, we need to map the terrain. When we say "you survive," we usually mean one of four things. In your clinic, these will fracture.

  1.  **Memory Continuity:** The copy remembers walking into the room. (Locke's view).
      *   *Fracture:* A copy can have false memories, or remember the walk but not the *feeling* of the walk.
  2.  **Character Continuity:** The copy hates coffee and loves jazz just like the original.
      *   *Fracture:* People change naturally over time. If a copy changes faster, are they a different person or just evolved?
  3.  **The Self-Pattern (Hofstadter):** The "I" is a symbol inside the brain that refers to itself. It's a story the brain tells. If that story is copied, the "I" is distributed.
      *   *Fracture:* Once copied, the stories diverge. Which story gets to keep the name?
  4.  **Social Hold:** You are who your community says you are. You exist in the expectations of others.
      *   *Fracture:* The widow might accept Copy A but reject Copy B. Now you are two people socially, even if you are one physically.

  **Where they come apart:** A copy might remember everything (1) but act cruelly instead of kindly (2). A copy might be kind (2) but have no memory of the promise (1). A copy might be recognized by the state (4) but feel like a stranger inside (3). Your novel lives in these gaps.

  ***

  ### Part 2: The Identity Audit (Decision Procedure)

  This is not a truth test; it is a narrative stress test. Run this for every scene where identity is contested. It blends the psychological (what the mind holds) with the social (what the world holds).

  **Instructions:** Answer the questions in order. If you hit a **STOP**, the procedure ends. If you hit a **VALUE JUDGMENT**, the philosophy ends and your theme begins.

  **Step 1: The First-Person Claim (Internal Continuity)**
  *   **Question:** When the copy says "I," are they referring to the original's past as their own *without hesitation*?
  *   **Sufficient Answer:** Yes, if they speak of the original's memories as *experienced*, not *observed*. (e.g., "I walked in" vs. "I have a record of walking in.")
  *   **Narrative Beat:** If **No**, write the hesitation. Write the copy looking at their hands like they belong to someone else.
  *   **STOP Condition:** If the copy explicitly denies being the original, they are a new person. **Verdict: Not the same.** (Hand back to author for motive: Why deny it?)

  **Step 2: The Social Echo (External Recognition)**
  *   **Question:** Do the people who loved the original treat this copy as the vessel of that love?
  *   **Sufficient Answer:** Yes, if at least one key relationship (widow, child, partner) relies on them for emotional comfort rather than just information.
  *   **Narrative Beat:** If **No**, write the distance. The widow pours only one cup of coffee. She locks the bedroom door.
  *   **VALUE JUDGMENT:** If the community is split (some say yes, some say no), stop here. This is not a fact; it is a conflict. You must decide whose perspective dominates the scene.

  **Step 3: The Vector of Will (Agency & Projects)**
  *   **Question:** Is the copy continuing the original's unfinished intentions, or starting new ones?
  *   **Sufficient Answer:** Yes, if they are pursuing the original's goals *for the original's reasons*. (Hofstadter's pattern: The symbol is active.)
  *   **Narrative Beat:** If **No**, write the abandonment. The copy leaves the original's manuscript unfinished to start a new book.
  *   **STOP Condition:** If the copy actively works against the original's core values, the pattern is broken. **Verdict: Not the same.**

  **Step 4: The Threshold of Drift (Divergence)**
  *   **Question:** Has enough time or experience passed that the copy's "story" no longer overlaps with the original's?
  *   **Sufficient Answer:** No, if they could still predict what the original would feel in a new situation.
  *   **Narrative Beat:** If **Yes**, write the misunderstanding. The copy laughs at a joke the original would have found offensive.
  *   **VALUE JUDGMENT:** There is no fixed percentage of drift that kills identity. This is where you decide how fragile the soul is.

  ***

  ### Part 3: Running the Audit on Your Cases

  Here is the procedure applied to your three draft scenarios. I have been strict.

  **Case 1: The Hollow Vessel**
  *   *Scenario:* A copy has every memory but none of the original's character (cold instead of warm, impatient instead of kind).
  *   *Step 1 (First-Person):* **Pass.** They say "I" and remember the pain.
  *   *Step 2 (Social Echo):* **Fail.** The widow flinches when touched. The warmth is gone.
  *   *Step 3 (Vector of Will):* **Fail.** They abandon the original's charitable projects because they "don't see the point."
  *   **Verdict:** **Not the same person.**
  *   **Narrative Instruction:** Treat this figure as an impostor wearing a dead man's face. The widow's grief should turn to horror, not comfort.
  *   **Author Note:** I know you wanted a ghost story here, but the audit says this is a haunting, not a return. This is the verdict you might not like: Memory alone does not save a soul.

  **Case 2: The Stranger Who Stays**
  *   *Scenario:* A copy shares almost nothing with the original (new habits, new tone) yet continues her project and is recognized by everyone who loved her.
  *   *Step 1 (First-Person):* **Pass.** They claim the history.
  *   *Step 2 (Social Echo):* **Pass.** The loved ones lean on them. They accept the comfort.
  *   *Step 3 (Vector of Will):* **Pass.** The project is finished. The promise is kept.
  *   *Step 4 (Drift):* **Unstable.** The internal change is high, but the external function is perfect.
  *   **Verdict:** **Same person (Functionally).**
  *   **Narrative Instruction:** The law accepts the inheritance. The widow sleeps peacefully. But write the copy's internal monologue feeling like a fraud. They are the same person to the world, but a stranger to themselves.
  *   **Flag:** **Unstable Verdict.** If you change one fact—the widow finds out the copy hates the original's favorite song—the Social Echo collapses.

  **Case 3: The Divided Promise**
  *   *Scenario:* Two copies, diverged past recognition, both claim to be the person who made a promise.
  *   *Step 1 (First-Person):* **Pass (Both).** Both say "I promised."
  *   *Step 2 (Social Echo):* **Fail (Split).** The promisee doesn't know who to trust.
  *   **STOP:** **VALUE JUDGMENT.**
  *   **Verdict:** **Procedure Fails.**
  *   **Narrative Instruction:** This is not an identity question; it is a scarcity problem. A promise is a singular debt. Two debtors do not double the promise; they break it.
  *   **Action:** One must refuse. Write the scene where one copy says, "I remember making that promise, but I am not the one who has to keep it."

  ***

  ### Part 4: Limitations and Disguised Metaphysics

  This tool will get you through the draft, but it will lie to you in three places.

  1.  **The Moral Luck Problem:** The procedure cannot adjudicate guilt. If Copy A commits a murder five minutes after splitting, the audit might say they are "the same person" as the one who walked in. But is it *fair* to punish them? The audit says "Yes, identity holds." Your conscience might say "No." That is not a bug; it is the theme of your book.
  2.  **The Privileged Perspective:** The audit treats the Social Echo (Step 2) as equal to the First-Person Claim (Step 1). In reality, the person inside the head matters more than the widow outside it. But for a novel, the widow's grief is often more visible than the copy's thought. I have weighted the tool toward the *visible* truth, not the *inner* truth.
  3.  **The Definition of "Relevant Others":** In Step 2, I ask if "people who loved the original" accept the copy. Who decides who counts? If the widow accepts the copy but the best friend rejects them, the procedure hands the decision back to you. This looks like a test, but it is really you deciding whether love or friendship defines identity.

  Use the audit to find the friction. When the tool says "Yes" but the scene feels like "No," you have found your conflict. Write that.
