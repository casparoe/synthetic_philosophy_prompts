answer: |-
  Welcome to the other side of the bench. You've spent thirty-five years measuring $K_m$ and $V_{max}$, watching enzymes turn over substrate, only to find philosophers arguing about whether the enzyme *really* had the power to catalyze or if it was just a regularity in the universe's ledger. It is frustrating, but the frustration is productive. It means you're spotting the gaps.

  You want the desiderata—the non-negotiables—for a theory of dispositions. You want to know what a theory must explain to be taken seriously by someone who knows that a denatured protein doesn't just "look" inactive, it *is* inactive.

  Here are the five core requirements, the test cases (standard and from your lab), and an evaluation of where the metaphysics stands.

  ### The Five Desiderata

  **1. The Distinction Constraint**
  *   **The Requirement:** The disposition must be distinct from its manifestation. Fragility is not shattering; solubility is not dissolving.
  *   **The Consideration:** If they are identical, you cannot have the disposition without the manifestation. But we intuitively say the glass was fragile *before* it broke, and the enzyme was catalytic *before* it turned the substrate. A theory that collapses the power into the event cannot account for latency or potentiality.
  *   **Standard Case:** A fragile glass sitting safely on a shelf. It is fragile now, though it never shatters.
  *   **Biochem Case:** **The Reversibly Inhibited Enzyme.** You add a competitive inhibitor. The reaction rate drops to zero. The manifestation (catalysis) is absent. But add a substrate analog with higher affinity or dialyze the inhibitor, and activity returns. The power was *latent*, not gone. A theory must distinguish "power masked" from "power lost."

  **2. The Grounding Constraint**
  *   **The Requirement:** Dispositions must be grounded in categorical (structural/intrinsic) properties of the object. There must be a "truth-maker" for the claim that $X$ is disposed.
  *   **The Consideration:** Science is not magic. If an enzyme catalyzes a reaction, it is in virtue of its active site geometry, electrostatics, and dynamics. If a theory posits dispositions as free-floating metaphysical ghosts unconnected to physical structure, it violates naturalism.
  *   **Standard Case:** Why is this glass fragile and not that steel? Because of the ionic bonding network vs. metallic lattice.
  *   **Biochem Case:** **The Irreversibly Denatured Enzyme.** The amino acid sequence (primary structure) is identical to the native state. Yet, the catalytic power is gone forever. This tests whether the grounding base is merely the *constituents* (sequence) or the *arrangement* (tertiary structure). A theory must identify the specific structural base that grounds the power, not just the material composition.

  **3. Immunity to Masking and Finks**
  *   **The Requirement:** The analysis of a disposition cannot be a simple conditional ("If struck, it would shatter"). It must survive cases where the stimulus occurs but the manifestation is blocked (Masking), or where the stimulus causes the disposition to vanish instantly (Finking).
  *   **The Consideration:** This is the logical hammer that broke the dominant 20th-century view (the Simple Conditional Analysis). If your theory says "Fragile = If struck, shatters," then a fragile glass packed in foam (which doesn't shatter when struck) counts as non-fragile. That is scientifically wrong.
  *   **Standard Case:** **The Sorcerer Case.** A fragile glass is protected by a sorcerer who detects the approach of a hammer and instantly casts a spell to make the glass non-fragile before impact. The conditional "If struck, it would shatter" is false, but the glass *was* fragile a moment before.
  *   **Biochem Case:** **The Reversibly Inhibited Enzyme (again).** Here it acts as a Mask. The stimulus (substrate) is present, the manifestation (turnover) is blocked by the inhibitor. The conditional "If substrate added, reaction occurs" is false. But the enzyme retains the disposition. Your theory must handle "Can't manifest" vs. "Doesn't have power."

  **4. Causal Efficacy**
  *   **The Requirement:** Dispositions must do causal work. They cannot be mere summaries of what happens; they must explain *why* it happens.
  *   **The Consideration:** In kinetics, we treat $k_{cat}$ as a real parameter that explains the rate. If dispositions are just linguistic shorthand for "events of type A are followed by events of type B," they are epiphenomenal. A robust theory requires that the power itself is part of the causal chain, not just a label we stick on the base.
  *   **Standard Case:** Why did the glass shatter? Because it was fragile (and struck). Not just "It was struck and glass usually shatters."
  *   **Biochem Case:** **Transition State Stabilization.** The enzyme's power *is* its ability to lower activation energy. If the disposition is just a summary of past reactions, it cannot explain the *next* reaction. The power must be causally prior to the manifestation.

  **5. The Supervenience Base Specification**
  *   **The Requirement:** The theory must specify exactly *which* physical properties ground the disposition, acknowledging that "chemical identity" is insufficient.
  *   **The Consideration:** Two things can be chemically identical but dispositionally distinct. A theory that ties dispositions too loosely to composition will fail; one that ties them too tightly to instantaneous microstates might miss historical constraints.
  *   **Standard Case:** **Annealed vs. Quenched Steel.** Both are iron and carbon. One is tough, one is brittle.
  *   **Biochem Case:** **Protein Folding Routes (Kinetic Trap vs. Global Minimum).** Imagine two protein molecules with identical sequences. One folded via the native pathway to the global energy minimum (functional). The other is stuck in a metastable kinetic trap (misfolded, non-functional, perhaps prion-like). At a low resolution, they look "chemically identical." This tests whether the grounding base includes the *energy landscape topology* or just the current atom positions. It forces the theory to admit that the "base" is a complex structural state, not just a list of atoms.

  ---

  ### Evaluation of the Requirements

  **Which are Genuine?**
  **Distinction**, **Grounding**, and **Immunity to Masking** are genuine. Any theory that fails these contradicts scientific practice. If you tell a biochemist that an inhibited enzyme "loses its catalytic power" rather than "has it masked," they will correct you. If you tell them the power is ungrounded in structure, they will call it mysticism.

  **Which are Prejudice?**
  **Strict Intrinsicality** is often demanded (the power must be entirely *in* the object), but this is prejudice. The **Key/Lock Case** disproves it. A key's power to open is relational; it depends on the lock's structure. A theory demanding strict intrinsicality forces you to say the key has no power until the lock exists, which is clumsy. The **Supervenience Base** requirement shows that "intrinsic" is tricky—is the crystal lattice intrinsic? Yes. Is the folding history intrinsic? Debatable.

  **Which are Jointly Unsatisfiable?**
  There is a tension between **Causal Efficacy of Dispositions** and **Causal Closure of the Physical**.
  *   *Closure:* Every physical event has a sufficient physical cause (the microstructural base).
  *   *Efficacy:* The disposition itself causes the manifestation.
  *   *The Conflict:* If the microstructure (the bond angles, the electron clouds) is sufficient to cause the shattering or the catalysis, what work is left for the "disposition" to do? If you say the disposition does the work, you risk overdetermination (two causes for one effect). If you say only the base does the work, the disposition becomes epiphenomenal (violating Efficacy). This is the **Exclusion Problem**. You generally cannot have a robustly causal disposition *and* a strictly closed physical microstructure without some clever metaphysical maneuvering (like identifying the power *with* the quality, as "Powerful Qualities" theorists do).

  **Which Single Requirement Knocks Out the Most Views?**
  The **Simple Conditional Analysis (SCA)** dominated philosophy for decades. It said dispositions *are* just conditional statements. The **Immunity to Masking and Finks** requirement is what killed it.
  However, looking at the broader landscape including Humeanism and Reductionism, the **Requirement of Distinct Causal Efficacy** is the deeper killer. It eliminates SCA (conditionals don't cause anything), Humean Regularity views (regularities don't cause anything), and Reductive Physicalism (if the base does all the causing, the disposition is redundant). It forces you into a Realist Powers Ontology.

  ### Quick Scorecard

  *   **Simple Conditional Analysis:** Fails **Immunity to Masking/Finks**. (The inhibited enzyme breaks it).
  *   **Microstructural Reductionism:** Fails **Causal Efficacy**. (The structure does the work, the power is just a name).
  *   **Dispositional Essentialism (Powers Ontology):** Passes **Efficacy** and **Masking**, but struggles with **Causal Closure** (The Exclusion Problem).
  *   **Powerful Qualities (Identity Theory):** Attempts to solve **Closure** by saying the base and the power are one thing described two ways. Promising, but ontologically expensive.

  You should demand a theory that respects the latency of the inhibited enzyme and the structural grounding of the denatured one. If it can't handle the foam-packed glass, it can't handle your kinetics.

  \answer{the requirement of distinct causal efficacy}
