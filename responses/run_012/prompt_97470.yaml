answer: |-
  Here is the mapping, the breakdown, and the verdict.

  ### 1. The Formal Mapping (Florida 2000)

  To evaluate the model, we must strip away the *ex post* drama (the 537 margin, the Supreme Court) and reconstruct the *ex ante* decision problem facing a Floridian on November 7, 2000.

  *   **The Player:** A registered Florida voter, $i$.
  *   **The Choice Set:** $A_i = \{ \text{Vote Bush}, \text{Vote Gore}, \text{Vote Other}, \text{Abstain} \}$.
  *   **The Payoff ($B$):** The utility differential $U(\text{Bush}) - U(\text{Gore})$. Given the stakes (Supreme Court, tax policy, abortion), let's grant the model a generous $B$. For a strong partisan, $B$ is high.
  *   **The Cost ($C$):** Time, travel, information costs. In Florida 2000, $C$ was elevated due to the "butterfly ballot" confusion and reported line lengths, but even at baseline, $C > 0$.
  *   **The Pivotality Term ($P$):** The probability that voter $i$ casts the deciding vote.
      *   *Calculation:* With $N \approx 6,000,000$ votes and a pre-election polling spread within the margin of error (a toss-up), the probability of a tie is approximated by the density of the vote share distribution at 0.5.
      *   *Magnitude:* Standard approximations (Gelman, Silver, etc.) place $P$ for a state this size between $10^{-6}$ and $10^{-7}$. Even assuming the voter *knows* it is a dead heat, $P \approx 1$ in 1,000,000.
  *   **The Equation:** $R = (P \times B) - C + D$.

  **The Instrumental Prediction:**
  Even with a high $B$ (say, \$10,000 in equivalent utility) and a low $C$ (say, \$10 in time/trouble), the expected instrumental return is:
  $$ (10^{-7} \times 10,000) - 10 = 0.001 - 10 = -9.999 $$
  **The calculus dictates Abstention.** The expected instrumental benefit is orders of magnitude smaller than the cost. The 537-vote margin is irrelevant to the *ex ante* calculation; without clairvoyance, the voter faces a probability indistinguishable from zero.

  ### 2. Where the Calculus Breaks: The Size Effect

  You identified the critical empirical failure: the **Size Effect**.
  *   **Model Prediction:** Turnout should be positively correlated with $P$. Since $P \propto 1/N$, turnout should be highest in small electorates (local elections, town councils) where $P$ is genuinely non-negligible ($10^{-3}$ or higher), and lowest in large electorates (Presidential) where $P$ approaches zero.
  *   **Empirical Reality:** Turnout is highest in Presidential elections (~60% VAP) and lowest in local elections (<30% VAP).

  In Florida 2000, this break is catastrophic. Floridians knew they were in a toss-up state (high salience), yet their *objective* pivotality was still mathematically negligible compared to, say, a city council race in Gainesville. If the instrumental term ($P \cdot B$) were the engine of turnout, the 2000 Presidential election should have seen lower participation than concurrent local races. It did the opposite. The "closeness" of Florida 2000 increased turnout, but not because $P$ crossed a rational threshold; it increased turnout because *salience* increased $B$ (psychic benefit) or $D$ (social pressure), decoupling the behavior from the probability of influence.

  ### 3. Evaluating the Rescue Attempts

  **The Duty Term ($D$):**
  Riker and Ordeshook (1968) introduced $D$ to solve the paradox. In 2000 Florida, for the equation to hold ($R > 0$), $D$ must exceed $C$ by itself, because $P \cdot B \approx 0$.
  *   **The Problem:** If $D > C$, then $P$ drops out of the inequality entirely. A voter should vote in *every* election where $D > C$, regardless of $N$.
  *   **The Failure:** This cannot explain variance. Why did Florida turnout exceed Alabama turnout in 2000? Why did 2000 turnout exceed 1996 turnout? If $D$ is a stable civic virtue, turnout should be constant. If $D$ varies based on "closeness," then $D$ is merely absorbing the explanatory power of $P$ without the mechanism of pivotality. It renders the model unfalsifiable: any vote is "rational" because we assume a $D$ large enough to justify it. It saves the *equation* by killing the *theory*.

  **Minimax Regret (Ferejohn & Fiorina, 1974):**
  This swaps Expected Utility for a decision rule minimizing the maximum possible regret.
  *   **The Logic:** If I abstain and my candidate loses by 1 vote, regret is infinite. If I vote and they lose by 500,000, regret is just $C$. Therefore, vote.
  *   **The Problem:** This abandons the Bayesian Expected Utility framework that defines Rational Choice. It assumes the voter treats the probability distribution as unknown or hostile (nature is playing against you).
  *   **The Failure:** In 2000, voters had polls. They had probability estimates. Minimax Regret ignores the *likelihood* of the worst-case scenario. It treats a 1-in-a-million chance of a tie as decision-relevant in the same way as a 50% chance. It explains the action, but only by rejecting the axioms of the rational choice paradigm you are testing.

  ### 4. The Verdict

  **Your reading is correct: The instrumental story was never doing the work.**

  I take the definite position that the 2000 Florida episode is not a fixable anomaly; it is **evidence that the instrumental core of the Calculus of Voting is empirically vacuous.**

  Here is the defense of that position:

  1.  **Mathematical Impossibility:** For the instrumental term ($P \cdot B$) to justify voting in a Presidential election, $B$ must be impossibly large (millions of dollars of utility) or $P$ must be impossibly high. No credible calibration of preferences or probabilities makes $P \cdot B > C$ in a mass election. The 537-vote margin proves that *collectively* they were pivotal, but *individually* they were not. The model cannot bridge the micro-macro gap without magic.
  2.  **The $D$ Term is a Confession:** Incorporating $D$ admits that the act of voting consumes utility rather than producing it instrumentally. If $D$ does all the work, the "Calculus of Voting" is a misnomer. It is a "Calculus of Civic Identity." Retaining the instrumental term alongside $D$ is theoretically dishonest because it implies $P$ matters when the algebra shows it is irrelevant noise.
  3.  **Salience $\neq$ Pivotality:** The high turnout in Florida 2000 was driven by the *belief* in closeness, which increased the *expressive* value of the vote (being part of a historic moment) and the *social* cost of abstention (peer pressure). This is consistent with Expressive Voting Theory (Brennan & Lomasky) or Social Identity Theory, not Rational Choice Instrumentalism. The voters were not buying a probability of influence; they were purchasing a membership card in a coalition.

  **Conclusion:**
  Stop trying to make the instrumental calculus work for 2000. It requires contorting the definition of rationality until it loses its predictive power. The 2000 election demonstrates that voting is a **consumptive act**, not an **investment act**.

  The theory should not be "fixed." It should be superseded. The instrumental story is a zombie: it keeps walking because it is embedded in the discipline's formalist training, but the 2000 Florida margin proves it has no heartbeat. If you want to model 2000, use an Expressive Choice model where the payoff is the utility of the *act* itself, conditioned by social context and identity, with the probability of outcome stripped entirely from the equation. That is the only framework where a 537-vote margin explains high turnout without requiring voters to be mathematically illiterate or mystically dutiful.
