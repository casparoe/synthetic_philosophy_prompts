prompt: |-
  My friend and I spent like three hours last night arguing about money pumps and I still can't tell which part of it is actually the live question.

  His line is that the whole thing is a trick: a money pump only shows something if the agent keeps her preferences fixed while you lead her around the loop, and any halfway sensible person would either see it coming or just refuse the last trade, so the pump shows at most that you should be able to commit, not that intransitive preferences are irrational. He also drew a distinction I can't stop thinking about, between pumps that need you to keep your preferences and pumps that work by wearing them down over time -- he called the second kind "preference laundering" and said that's the only version that scares him, becuase it could get someone whose preferences are perfectly consistent at every time slice.

  I said that can't be right, because then diachronic rationality is doing all the work, and we're just back to the old fight about whether consistency across time is even a requirement. He said fine, then tell me what the requirement is. I couldn't.

  Anyway, I've got about a year and a half of funded PhD left and I want to spend it in this vicinity -- money pumps, diachronic rationality, time-slice vs. resolute choice, commitment devices, the whole cluster. So: which open questions in here actually matter most, and why? Defend the ordering. I care about what's upstream of what, what's tractable for someone who's a philosopher and not an economist, what's crowded versus neglected, and what argument or result over the next 18 months would move a question up or down the list. Also tell me what you'd tell me to drop.

  Give it to me as a JSON object with these fields:

  - "criteria": the criteria you ranked by and how you weighted them against each other
  - "ranked_questions": a list, best first, where each entry has "rank", "question", "why_it_matters" (what other questions sit downstream of it), "tractability_for_me" (how much of it a philosopher without economics training can actually settle, and with what tools), "crowdedness", and "what_would_move_it" (the specific argument or result that would raise or lower its rank)
  - "drop": a list of entries with "question" and "reason" for things you'd deprioritize
  - "where_my_friend_is_wrong": the one thing in his position you think is most mistaken, and why

  Please write it in American English.
