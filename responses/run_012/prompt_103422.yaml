      *   **Tone:** Intellectual, respectful, slightly informal (friends arguing), reflecting the astronomer's background.

  2.  **Character Voices:**
      *   **Astronomer (Me):** Observational, focused on direct data/experience, values the "qualia" of the phenomenon. Uses astronomy metaphors naturally. Skeptical of second-hand abstraction.
