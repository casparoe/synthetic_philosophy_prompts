  3.  **Key Arguments to Develop:**
      *   *Friend's Core:* Testimony is the bedrock of knowledge. I know Andromeda exists without seeing it. Why is beauty different? The AI is a sophisticated aggregator of this testimony.
      *   *Astronomer's Core:* Scientific facts are propositional (X exists). Aesthetic value is experiential (X feels like Y). The AI knows the *label*, not the *content*. It's like reading a menu vs. eating the meal.
      *   *The Clash:* Is "beauty" a property of the object (like mass) or a relation to the subject (like taste)?

  4.  **Drafting - Section by Section:**

