answer: |-
  This is an excellent bit of procrastination because it cuts straight to the bone of the module. The sentence *"You can't blame someone for something that wasn't up to them"* is the **Control Principle**, but as you've noticed, "up to" is doing a lot of heavy lifting. It's acting as a philosophical Rorschach test.

  Your tutorial partner and your flatmate are actually using two different definitions of "up to," which is why you feel like they're talking past each other. One is talking about *causal origin* (regress), the other about *counterfactual necessity* (inevitability).

  Here is a menu of five distinct claims hidden inside that sentence, ordered from trivial to world-swallowing. You can literally read this list out in tutorial.

  ### 1. The "Non-Action" Claim
  *   **The Precise Claim:** You cannot be responsible for events where you were not the causal agent (e.g., you were unconscious, coerced at gunpoint, or the event happened before you were born).
  *   **Status:** **Trivial/Conceptual Truth.** This is almost definitional. Blame implies agency.
  *   **Control Requirement:** **Weak.** Requires only that you performed the bodily movement voluntarily.
  *   **Does it work for your cases?**
      *   *Driver:* **No.** Both drivers chose to drink and drive. The action was up to them.
      *   *Regress:* **No.** Doesn't touch the "why did you choose that?" question.
      *   *Scientist:* **No.** The scientist did the experiments.
  *   **Praise/Blame Symmetry:** **Symmetric.** We don't praise people for things they didn't do.
  *   **Verdict:** This is the baseline. If your classmates mean this, they are wrong about the cases.

  ### 2. The "Outcome Luck" Claim (Standard Moral Luck)
  *   **The Precise Claim:** Responsibility tracks the quality of the will/intention, not the fortuitous outcomes. Two agents with identical intentions and actions are equally blameworthy/praiseworthy, regardless of external chance.
  *   **Status:** **Plausible/Defensible.** This is the standard Nagel/Williams compromise. It preserves moral judgment while acknowledging luck.
  *   **Control Requirement:** **Moderate.** Requires control over the *attempt*, not the *result*.
  *   **Does it work for your cases?**
      *   *Driver:* **Yes.** This gets your tutorial partner the verdict she wants (both drivers are equally blameworthy).
      *   *Regress:* **No.** It stops at the action. It doesn't ask where the intention came from.
      *   *Scientist:* **No.** It doesn't address whether the discovery was inevitable.
  *   **Praise/Blame Symmetry:** **Symmetric.** Applies equally to the reckless driver and the diligent scientist.
  *   **Verdict:** This is what most people *think* they mean in casual conversation about fairness.

  ### 3. The "Constitutive Luck" Claim (The Regress Move)
  *   **The Precise Claim:** Nothing is truly "up to you" because your choices flow from your character/values, and you did not choose your character/values (genetics, upbringing, etc.). Therefore, the source of the action is never ultimately in the agent.
  *   **Status:** **Radical/Controversial.** This is Galen Strawson's "Basic Argument." It leads to scepticism about responsibility.
  *   **Control Requirement:** **Extremely Strong.** Requires "Ultimate Responsibility" (you must be the *causa sui* of yourself).
  *   **Does it work for your cases?**
      *   *Driver:* **Yes.** Explains the tutor's pushback ("he didn't choose to be the sort of person...").
      *   *Regress:* **Yes.** This *is* the regress move.
      *   *Scientist:* **Yes.** If his curiosity was determined by luck, he gets no credit.
  *   **Praise/Blame Symmetry:** **Symmetric.** It destroys both blame and praise equally.
  *   **Verdict:** This is what your tutorial partner is reaching for when she pushes back against the tutor. It's the "nuclear option."

  ### 4. The "Counterfactual Dependence" Claim (The Flatmate's Move)
  *   **The Precise Claim:** An agent is only responsible if the outcome *counterfactually depended* on them. If the event would have occurred anyway (via someone else), their contribution wasn't "up to them" in a meaningful sense.
  *   **Status:** **False (as a principle of responsibility).** This confuses *responsibility* with *unique value*. We blame assassins even if a backup shooter was waiting; we praise firefighters even if the fire brigade would have arrived eventually.
  *   **Control Requirement:** **Distinct.** It's not about control, it's about *necessity*.
  *   **Does it work for your cases?**
      *   *Driver:* **No.** If another drunk driver would have hit the kid, is the first driver off the hook? Intuitively, no.
      *   *Regress:* **No.** Irrelevant to the origin of character.
      *   *Scientist:* **Yes.** This is exactly your flatmate's argument (the discovery was historically inevitable).
  *   **Praise/Blame Symmetry:** **Asymmetric.** Your flatmate uses it to deflate *praise*. If used for blame ("Don't blame me, someone else would have stolen the car"), it sounds like a weak excuse.
  *   **Verdict:** Your flatmate is using a different principle entirely. She is arguing about the *significance* of the act, not the *agency* behind it.

  ### 5. The "Hard Incompatibilist" Claim
  *   **The Precise Claim:** Causal determinism (or physical randomness) is incompatible with the kind of control required for responsibility. Nothing is ever "up to" anyone in the required sense.
  *   **Status:** **False (by Compatibilist standards) / True (by Hard Determinist standards).** This is the metaphysical heavyweight.
  *   **Control Requirement:** **Impossible.** Requires a break in the causal chain (libertarian free will).
  *   **Does it work for your cases?**
      *   *All Cases:* **Yes.** It swallows everything. No blame for the driver, no credit for the scientist.
  *   **Praise/Blame Symmetry:** **Symmetric.** Eliminates the whole practice.
  *   **Verdict:** This is the philosophical deep end. If someone asserts this, the discussion usually shifts from ethics to metaphysics.

  ***

  ### Summary for your Tutorial

  **1. Which reading are people usually reaching for?**
  In everyday contexts (and likely your tutorial partner's initial intuition), people usually mean **Claim 2 (Outcome Luck)**. They want to say that chance shouldn't dictate moral status. However, when pressed (like by your tutor), they often retreat to **Claim 3 (Constitutive Luck)** without realizing they have escalated the argument from "luck affects outcomes" to "luck affects agency."

  **2. Is your flatmate using the same principle?**
  No. She is using **Claim 4 (Counterfactual Dependence)**.
  *   **Tutorial Partner:** "He couldn't help the kid running out" (External Luck) OR "He couldn't help being a drinker" (Constitutive Luck).
  *   **Flatmate:** "He couldn't help being the one to find it because *anyone* would have" (Historical Inevitability).
  *   **Crucial Difference:** The tutorial partner is arguing about *control*. The flatmate is arguing about *replaceability*. You can point out in tutorial that replaceability doesn't usually negate responsibility (e.g., we still blame the person who pulls the trigger even if a backup assassin was ready).

  **3. Does it cut one way (Blame vs. Praise)?**
  Philosophically, the Control Principle (**Claim 2 & 3**) is symmetric. If luck negates blame, it must negate praise. If your flatmate thinks the scientist deserves no credit due to luck, she must logically agree that a criminal deserves no blame if their crime was the inevitable result of their luck-constituted character. If she denies this, she is being inconsistent.

  **4. How to use this in class:**
  Start by asking: *"When we say 'up to them', do we mean 'did they physically do it?' (Claim 1), 'did the outcome depend on chance?' (Claim 2), or 'did they choose their own nature?' (Claim 3)."*
  Then ask your flatmate: *"If we apply your 'someone else would have done it' rule to crime, does it let accomplices off the hook?"*

  Good luck on Thursday. (And honestly, this is better than writing the essay.)
