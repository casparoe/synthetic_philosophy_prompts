answer: |-
  You are right to feel that your mate's "public-goods" reading is a bit too clean. While Smith is certainly concerned with how public revenue funds public duties, this specific passage is doing heavier lifting regarding the *organisation of production*. He is not merely saying defence is a good the state must provide; he is arguing that the *method* of providing it is determined by the economic structure of the nation itself.

  To answer your primary question: yes, Smith is deploying a historical stage theory here, but specifically one driven by the division of labour. "Different states of society" refers to the structural organisation of the economy (hunter-gatherer, pastoral, agricultural, commercial), while "periods of improvement" refers to the progression through these stages towards greater wealth and specialisation.

  Here is a close reading of how those phrases function, followed by a testing of your three models against Smith's logic.

  ### Unpacking "States of Society" and "Improvement"

  When Smith writes that the expense of defence varies in "different states of society", he is identifying a correlation between economic complexity and military cost. In the earliest "state" (the hunting society), every man is a warrior. There is no separation between the economic producer and the defender. Consequently, the "expense" to the sovereign is nil, because the society bears the cost individually while continuing their daily subsistence.

  However, "improvement" changes this. For Smith, improvement is synonymous with the division of labour. As society moves towards agriculture and then commerce, men specialise. A weaver cannot weave and fight simultaneously; a merchant cannot trade and man a rampart. If a specialised worker is called to defend the state, their economic output ceases. Therefore, in an "improved" society, the state must compensate the soldier for the loss of their civilian labour.

  This is the crux of the passage: **Improvement increases the opportunity cost of citizen-soldiery.**

  Therefore, "improvement" pushes you decisively towards your "purchase" model. It does not push towards extraction. In a commercial society, extracting labour via conscription is economically ruinous because it removes highly specialised workers from the productive economy. Smith argues that as a nation becomes wealthier and more specialised, it becomes *necessary* to maintain a standing, professional army paid for by the public purse. The "expense" rises not because soldiers become greedier, but because the society behind them becomes more complex.

  ### Testing Your Three Models

  Your labels—"Purchase", "Extraction", and "Latency"—are analytically useful, though they risk sounding slightly anachronistic if not anchored in Smith's terminology. Below is how they map onto his scheme.

  #### (a) The Professional Army ("Purchase")
  **Smithian Fit:** High.
  **Corresponding State:** Commercial Society (Advanced Improvement).

  This is the natural endpoint of Smith's argument on improvement. In a wealthy, commercial nation, the division of labour must apply to the military just as it does to pin-making. Soldiers become a distinct class of specialists. The state "purchases" their service through pay and pensions, funded by taxation.

  Smith acknowledges this is the most expensive model in terms of direct treasury outlay, but he argues it is the most efficient for a rich nation. The alternative—pulling skilled artisans away from their trades to fight—is a greater drain on the national wealth. However, Smith harbours a political anxiety here: a professional army separates the military from the citizenry, potentially threatening liberty. Yet, economically, "improvement" makes this model inevitable. If you are a highly developed commercial state, you cannot effectively defend yourself without a professional force.

  #### (b) Conscription ("Extraction")
  **Smithian Fit:** Low (for modern/commercial states).
  **Corresponding State:** Pastoral or Early Agricultural Society.

  You describe this as extraction, which is correct, but Smith views this as a feature of *less* improved societies. In a pastoral society, a shepherd can take his flock to the frontier; his economic activity is mobile and compatible with warfare. In a feudal agricultural state, defence is extracted via land tenure (knights' fees).

  In a modern commercial context, however, Smith views strict conscription (where the state commandeers labour without full market compensation) as inefficient. It ignores the high opportunity cost of the labour being extracted. If you draft a software engineer or a machinist in a complex economy, you lose more value than if you draft a subsistence farmer. Smith would argue that "extraction" is a model that belongs to earlier "states of society". Attempting to force it onto an advanced society creates friction and economic loss. It is not the direction "improvement" points you in.

  #### (c) Armed Neutrality ("Latency")
  **Smithian Fit:** Moderate/Specific.
  **Corresponding State:** Small Commercial Republic (The Militia Compromise).

  This is the most nuanced category. Smith explicitly discusses the Swiss cantons. He does not view this as a fourth "state of society", but rather as a specific institutional adaptation within a small state. He calls this a "well-regulated militia".

  Does this fit "latency"? In a sense, yes. The capability is latent in the population, activated only by training and necessity. Smith is surprisingly favourable towards this model, provided the training is rigorous. He suggests that if the militia is trained frequently and disciplined properly, it can match a standing army for defence, though perhaps not for conquest.

  However, Smith places a caveat on this regarding "improvement". As the division of labour intensifies, it becomes harder to pull citizens away for even part-time training without economic loss. The Swiss model works, in Smith's view, because their state is small and their social cohesion is high. For a large commercial empire (like Britain), Smith doubts a militia alone suffices. So, your "latency" model fits Smith's scheme, but only for small states that can maintain high civic cohesion despite economic improvement. It is a hybrid: it uses the "purchase" model to pay for the training and equipment, but relies on the "extraction" of time from citizens who remain primarily civilians.

  ### Critique and Refinement of Labels

  Your labels are functional, but they focus on the *transaction* rather than the *social structure* Smith is obsessed with.

  1.  **"Purchase"** implies a market contract. Smith sees it more as **Specialisation**. The key is that the soldier is a distinct trade, supported by the surplus of other trades.
  2.  **"Extraction"** implies coercion. Smith sees the historical equivalent as **Universal Obligation** rooted in low opportunity cost. In early societies, it isn't "extracted" so much as it is inherent to existence.
  3.  **"Latency"** is a modern strategic term. Smith would call this the **Militia**. The defining feature for Smith isn't latency, but the *reintegration* of the soldier into civil society.

  If you wish to retain your labels for your module, I would suggest refining their definitions to align with Smith's economic logic:

  *   **Purchase (Professionalisation):** Defence as a specialised trade. Feasible only when societal wealth is high enough to support a non-producing class. Driven by the division of labour.
  *   **Extraction (Universal Service):** Defence as a civic duty compatible with subsistence. Feasible only when the opportunity cost of labour is low (early stages of improvement).
  *   **Latency (The Militia):** Defence as a part-time specialisation. A compromise for small states seeking to balance the security of a standing army with the liberty and economy of a citizen force.

  ### Conclusion on "Improvement"

  To answer your specific tension: "Improvement" pushes you towards the **Purchase (Professional)** model.

  Smith's argument is that you cannot have a highly improved, wealthy commercial society and rely on the Extraction model. The economic cost of stopping a specialised workforce is too high. The state must step in to pay the difference.

  The Armed Neutrality (Militia) model is the only exception Smith allows, and even then, he treats it as a difficult balance to maintain. It requires the state to subsidise the "latency" (training in peace) to ensure readiness. It is not a substitute for the cost of defence, but a different allocation of it.

  So, your mate's public-goods argument is not wrong, but it misses the production-side constraint Smith is highlighting. Smith is saying: *The nature of the good (defence) changes as the economy changes.* In a poor society, defence is a by-product of existence. In a rich society, defence is a specialised industry that must be purchased. Your three models are valid, but Smith would rank them hierarchically based on economic development: Extraction belongs to the past, Purchase to the present (for large states), and Latency to the specific case of small, cohesive republics.
