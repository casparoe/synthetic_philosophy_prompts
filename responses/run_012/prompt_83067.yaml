      *   *Address Step 8:* Human institutions work *despite* this flaw because of similar mechanisms (cross-examination, evidence rules), not because the flaw doesn't exist. They are noisy, not perfect.
      *   *Address "What does it buy?":* It shifts the burden. Instead of "Is this true?" (Hard), it becomes "Can you show me a specific lie?" (Easier). It creates a "truthful equilibrium" where lying is the dominated strategy *if* the protocol is right.
