answer: |-
  Dear Colleague,

  It is a pleasure to correspond with someone who understands that a stone is never merely a stone, but always a stone plus a story. The tension you describe between your professional instincts and your philosophical reading is not a failure of either, but rather the friction caused by applying a single metric of value to objects that belong to different categories of being. You have asked for a principle to reconcile your verdicts, and while I cannot offer you a formula that will satisfy every market or every critic, I can offer you a distinction that I believe aligns with the rigor you applied to your specimens for forty years. The principle is this: the value of an object depends on whether its history is constitutive of its kind or merely accidental to its function. Where history defines what the thing is, provenance is rational value; where history is external to what the thing does, provenance is sentiment.

  Let us apply this to your first conflict, the meteorite and the diamond. A meteorite is defined by its origin; it is a sample of a cosmic process. If it did not come from space, it is not a meteorite, regardless of its composition. It belongs to what we might call a historical kind, where the causal chain of formation is part of the identity. Therefore, the premium paid for a meteorite is not sentiment; it is the price of authenticity regarding its very definition. A diamond, however, is primarily a functional kind in the context of gemmology. It is defined by its crystal structure and optical properties. If a laboratory produces a carbon lattice identical to a natural one, it is a diamond in every physical sense. The premium paid for the natural stone is indeed sentiment, or more precisely, a payment for scarcity rather than substance. Your instinct here is correct and consistent: you should keep both verdicts. The meteorite premium is rational because origin is constitutive; the diamond premium is sentimental because origin is accidental to its function as a gem.

  This same distinction clarifies your mineral specimens. A specimen from a famous locality is valued as evidence of a specific geological process. The label is not an accessory; it is the coordinate that links the object to the process. A forged label breaks the causal chain, rendering the object useless as evidence, even if it is pretty. Conversely, when a lost label is recovered by analysis, the object gains value because its true causal history has been restored to knowledge. The object did not change, but its classification did, and since classification relies on history, the value change is rational. This extends to your casts and skeletons. In a research collection, the object must be the original material because the material itself is the data. In a teaching collection, the form is the data, so a cast suffices, provided the label preserves the integrity of the record. A skull catalogued as original when it is partly sculpted is a fraud because it misrepresents the causal chain of its own existence, corrupting its utility as evidence.

  The art cases follow a similar logic but shift from natural kinds to agentive kinds. A painting is not just a patterned surface; it is a record of a specific artistic action. When a painting is reattributed from a master to an assistant, it becomes a lesser painting because the action recorded is of a different order of capability and intention. It is a fact about the painting because the painting is the trace of that action. An etching copy made by a forger is not the same artwork because it is the trace of a different action, namely imitation rather than creation. The cathedral case is slightly different because buildings are functional structures that endure through time. A cathedral rebuilt to original drawings is a reconstruction. It is not the same building materially, but it is a continuation of the same design intent. You should write reconstruction in the catalogue, for it acknowledges the break in material continuity while honoring the continuity of form.

  Now let us test this principle against the cases you have not yet settled. Consider the Stradivarius against a modern violin indistinguishable in a blind test. If the violin is valued for sound, the modern instrument is equal, and the Stradivarius premium is sentiment. If the violin is valued as a historical artifact of craftsmanship, the Stradivarius is unique and the premium is rational. The principle demands you ask what the instrument is for. For the laboratory-grown ivory substitute, the object is a functional substitute marketed on ethical grounds. It is not ivory, which is a biological material, but it is a valid ethical choice. Its value lies in its function and its moral history, not its biological origin. A restored painting that is four-fifths repaint poses a threshold problem. If the repaint obscures the original artistic action, it becomes a reconstruction rather than a restoration. It loses its status as a record of the master's hand and becomes a record of the restorer's hand, diminishing its value as an original work. Finally, the digital file bit-identical to the original scan is fully authentic. Digital objects are defined by their information content, not their medium. As long as the bits are identical, the causal history of the storage medium is irrelevant to the identity of the file.

  This brings us to your colleague and the fabricated measurements, which I suspect is the case that troubles you most because it strikes at the heart of your trade. Science is not merely the accumulation of true statements; it is the certification of methods that yield true statements. A paper is not just a claim; it is a record of an inquiry. When your colleague fabricated the measurements, they broke the causal chain between observation and claim. Even if the numbers turned out to be correct by luck or later confirmation, the paper remains a forgery of the scientific process. It claims to be evidence derived from measurement when it is actually evidence derived from invention. To accept it as valid because the numbers are true would be to sever the link between truth and warrant, which is the foundation of our work. You must classify this as a forgery. The truth of the outcome is accidental; the falsity of the process is essential.

  So, to answer your request directly regarding which verdicts to abandon: you should abandon the worry that your meteorite verdict is inconsistent with your diamond verdict. They are consistent under the principle of constitutive history. You should also abandon your hesitation regarding your colleague. The paper is a forgery because science values the integrity of the path as much as the destination. The only verdict you might need to refine is the cathedral; do not call it the same building, but do not call it a replica either. Call it a reconstruction, which carries its own specific weight. Your tentative principle was close, but it treated the record as an addition to the object. I urge you to see that for meteorites, minerals, art, and data, the record is often the substance itself. When the history is what makes the thing the kind of thing it is, there is no distinction between the object and its witness. They are one and the same.

  I hope this provides the clarity you sought. We spend our lives sorting the genuine from the imitation, and it is comforting to know that the distinction rests not on our whims, but on the causal fabric of the world we study.

  Yours sincerely,

  A Friend
