      *   *Critique:* Very strong for Position 2. CRDTs guarantee eventual consistency *if* merged, but often in history, we *don't* want them to merge.

      *   *Position 1 (Record > Memory):* The Log is the Source of Truth. The Materialized View is stale/corrupted. Trigger a snapshot/rebuild. Consensus protocol dictates the Log wins.
