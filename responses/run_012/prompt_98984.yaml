      *   *Drafting the Verdict line:* "Verdict: The activity cannot reproduce the modal logical argument regarding rigid designators that grounds the necessity of origin, which you must explain as the metaphysical foundation rather than a bureaucratic preference." -> Needs to be one sentence.

  12. **Final Polish:** Check the timing. 50 mins is very short for a game + debrief. I need to ensure the rounds are snappy. I will suggest pre-cutting the papers to save time. I will make the "Rule" formulation the key commitment device.

      *(Self-Correction during drafting)*: Wait, if I make them write a rule *first*, they might write a vague rule to avoid trouble. Better: Let them rule on cases, *then* ask them to formulate the rule that justifies it, *then* hit them with the hard cases that break that rule.
