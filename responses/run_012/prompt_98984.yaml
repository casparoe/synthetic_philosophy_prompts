      *   *Phase 3:* Introduce the Gamete Lottery problem. (Slightly different sperm).
      *   *Constraint:* They must write a "Rule of Office" at the start that justifies their decisions. This forces them to commit to a principle.
      *   *Audit:* At the end, check if their decisions match their Rule.

  5.  **Refining the Activity for the Constraints:**
      *   *Time:* 50 minutes is tight. Need strict timing.
      *   *Budget:* Printables only.
      *   *Group Size:* 12-15. Split into small teams (Clerks) + 1 Registrar (Facilitator or rotating role). Let's make the Facilitator the "Chief Registrar" to manage flow, students are "Junior Clerks".
      *   *The "Hook":* Don't mention Kripke. Call it "The Continuity Protocol".

  6.  **Addressing the Specific Philosophical Tensions:**
      *   *Tension 1 (Twins):* Need a case where Case A and Case B come from the *same* Zygote Code but end up distinct. If they rule "Same Person", they deny twins are distinct. If "Different Person", they break the "Same Origin = Same Person" rule.
      *   *Tension 2 (Gametes):* Need a case where the sperm/egg is *almost* the same. If they rule "Different Person", it seems arbitrary. If "Same Person", they weaken origin essentialism.

  7.  **Structuring the Session:**
      *   0-5: Intro & Setup (The Bureau).
      *   5-15: Round 1 (Standard cases, establish intuition).
      *   15-25: Round 2 (The Twin/Fission Case).
      *   25-35: Round 3 (The Gamete Gradient).
      *   35-45: The Audit (Scoring & Contradictions).
      *   45-50: Debrief (Connecting to Philosophy).

  8.  **Drafting the Content (Iterative refinement):**
      *   *Materials:* "Case Files" (slips of paper), "Stamp Sheets" (A4 divided into quadrants), "Rule Book" (one per team).
      *   *Scoring:* 10 points per consistent ruling. -5 for contradiction.
      *   *Failure Modes:* Students treating it as a joke, getting bogged down in one case, the "Registrar" being too authoritative.
      *   *Debrief:* Must link the "Rule of Office" to Origin Essentialism. Must link the "Audit Failures" to the Twin/Gamete objections.

  9.  **Writing in British English:**
      *   Use "favour", "programme", "organise", "maths", "Year 12", "lunchtime".
      *   Tone: Practical, encouraging, slightly academic but accessible.

  10. **Final Review against Constraints:**
      *   Did I include the specific awkward cases (twins/fission & gamete lottery)? Yes.
