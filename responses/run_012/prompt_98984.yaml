      *   **Topic:** Origin Essentialism (Kripkean), specifically the tension between "origin is essential" vs. "fission/twins" vs. "arbitrariness of gametes".
      *   **Goal:** A runnable activity (game/role-play/simulation) that makes students *feel* the pull of the argument without the facilitator stating the doctrine upfront. Needs to force commitment, show costs of inconsistency, and highlight the specific awkward cases (fission/twins and gamete arbitrariness).
      *   **Constraints:** No budget (printable/scrap paper), British English, specific structure (rules, materials, timeline, scoring, debrief, failure modes, limitation note).
      *   **Ending:** Must end with a specific line format: "Verdict: [sentence]".

  2.  **Deconstruct the Philosophical Problem:**
      *   *Thesis:* Origin Essentialism (You couldn't have come from different parents/gametes).
      *   *Antithesis 1 (Fission/Twins):* If origin = zygote, identical twins share an origin. If origin determines identity, twins should be the same person. They aren't. So origin $\neq$ identity.
      *   *Antithesis 2 (Arbitrariness):* If origin = specific sperm/egg, why *that* one? It feels contingent. If I came from a slightly different sperm, am I still me?
      *   *Desired Mechanic:* A bureaucracy/registry seems perfect. It forces formal decisions, creates a paper trail (for scoring inconsistency), and mimics the "necessary truth" aspect of metaphysics (laws of the registry).

  3.  **Develop the Activity Concept: "The Bureau of Trans-World Identity"**
      *   *Premise:* Students are clerks in a bureaucracy that manages existence across possible worlds. They must issue "Existence Certificates."
      *   *Mechanic:* They get case files. They must stamp "APPROVED" (Same Person) or "REJECTED" (Different Person).
      *   *Twist:* The rules change or reveal contradictions mid-game.
      *   *Materials:* Scrap paper, pens, stamps (or drawn symbols), printed case cards.
      *   *Scoring:* Points for consistency, penalty for contradictions found during audit.

  4.  **Drafting the Rules & Mechanics:**
      *   Need to simulate the "Origin" constraint without naming it.
