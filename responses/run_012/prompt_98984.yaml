answer: |-
  **Activity Title:** The Trans-World Registry
  **Concept:** A bureaucratic simulation where students act as Clerks certifying identity across possible worlds. They must maintain a consistent "Office Policy" to avoid penalties during an Audit.

  ### Materials (Zero Budget)
  *   **Case Files (15 sets):** Cut scrap paper into quarters. On each quarter, write a "World Scenario" (details below). You need about 60 cards total.
  *   **Stamp Sheets (1 per team):** A4 paper divided into four quadrants. Headings: *Case ID*, *Verdict (Same/Different)*, *Policy Justification*, *Audit Mark*.
  *   **Pens:** Students' own.
  *   **The "Contradiction Token":** One small object per team (a scrunched ball of paper, a bottle cap, a specific pen). This represents their "Coherence Budget".
  *   **Projector/Board:** To display the timer and the "Chief Registrar's" announcements.

  ### The Case Files (Write these on the scrap paper)
  *   **Set A (The Control):**
      *   *Card 1:* World 1: Sperm $\alpha$ + Egg $\beta$ $\rightarrow$ Person "Alex".
      *   *Card 2:* World 2: Sperm $\alpha$ + Egg $\beta$ $\rightarrow$ Person "Alex" (becomes a plumber, not a philosopher).
  *   **Set B (The Twin/Fission Problem):**
      *   *Card 3:* World 3: Zygote $Z$ develops normally $\rightarrow$ Person "Sam".
      *   *Card 4:* World 4: Zygote $Z$ splits at day 3 $\rightarrow$ Twin A and Twin B.
      *   *Question:* Is Twin A the same person as Sam?
  *   **Set C (The Gamete Lottery):**
      *   *Card 5:* World 5: Sperm $\alpha$ + Egg $\beta$ $\rightarrow$ Person "Jordan".
      *   *Card 6:* World 6: Sperm $\alpha$-next (identical genetic twin of $\alpha$) + Egg $\beta$ $\rightarrow$ Person "Jordan*".
      *   *Question:* Is Jordan* the same person as Jordan?
  *   **Set D (The Gradual Shift):**
      *   *Card 7:* A chain of 3 cards where the sperm changes slightly each time ($\alpha$, $\alpha$-1, $\alpha$-2). Ask if Person 1 = Person 3.

  ### Rules & Scoring
  1.  **Teams:** Split the 12–15 students into 4 teams of 3–4 (The "Clerks").
  2.  **Objective:** Process Case Files by stamping/writing **SAME** (Identity preserved) or **DIFFERENT** (New person).
  3.  **The Catch:** After Round 1, each team must write a **Single Policy Rule** (one sentence) that explains their verdicts.
  4.  **Scoring:**
      *   Start with 1 Contradiction Token.
      *   If a verdict contradicts the team's own Policy Rule, the Chief Registrar (you) confiscates the Token.
      *   If a verdict contradicts a previous verdict by the same team, confiscate the Token.
      *   Teams without a Token at the end are "Fired" (lose the game).
      *   Teams with a Token win "Tenure" (bragging rights).
  5.  **Pressure:** You (the Registrar) have a stopwatch. They have 3 minutes per Round. If they haven't decided, you default their verdict to "DIFFERENT" (which usually breaks their Policy).

  ### Minute-by-Minute Timeline (50 Minutes)

  **00:00 – 05:00: Induction**
  *   Welcome them to the "Trans-World Registry".
  *   Explain the job: Reality is messy; their job is to certify whether a person in World 2 is the *same person* as in World 1.
  *   Hand out Stamp Sheets and Pens.
  *   **Crucial:** Do not mention "Origin Essentialism", "Kripke", or "Metaphysics". Call it "Continuity Protocol".

  **05:00 – 15:00: Round 1 (Establishing Intuition)**
  *   Distribute **Set A** (Control) cards.
  *   Teams decide SAME or DIFFERENT. (Everyone will say SAME; changing careers doesn't change identity).
  *   **Task:** Write the **Policy Rule** that justifies this. (e.g., "Same body is same person" or "Same origin is same person").
  *   *Facilitator Note:* Walk around and read their rules. If a team writes "Same body", make a mental note to hit them hard in Round 2.

  **15:00 – 25:00: Round 2 (The Fission/Twin Trap)**
  *   Distribute **Set B** (Twin/Fission) cards.
  *   Scenario: Same Zygote, but one world splits into twins.
  *   **The Squeeze:** If their Policy was "Same Zygote = Same Person", they must rule Twin A is Sam. But Twin A exists alongside Twin B. Are A and B the same person? No.
  *   If they rule "DIFFERENT", they contradict their Round 1 Policy (if it was based on origin).
  *   **Audit:** Ask one team to read their verdict. Ask if it fits their Rule. If not, take their Token.

  **25:00 – 35:00: Round 3 (The Gamete Lottery)**
  *   Distribute **Set C** (Gamete) cards.
  *   Scenario: Same egg, different but nearly identical sperm.
  *   **The Squeeze:** If they rule "DIFFERENT" (to save the Twin case), they admit identity rests on a microscopic lottery. If they rule "SAME", they undermine the idea that origin matters at all.
  *   Force them to stick to their original Policy Rule. They are not allowed to change the Rule mid-game (bureaucracies don't like change).
  *   This is where the "arbitrariness" pain is felt.

  **35:00 – 45:00: The Final Audit**
  *   Collect the Stamp Sheets.
  *   Project the results. Highlight contradictions publicly but neutrally. "Team 3 ruled Origin Matters in Round 1, but ruled Origin Doesn't Matter in Round 3. Token confiscated."
  *   Count the Tokens. Declare the winning team.
  *   **Silence:** Take 30 seconds of silence to let the frustration of the contradiction settle.

  **45:00 – 50:00: The Debrief (Connecting to Doctrine)**
  *   Reveal the philosophical names.
  *   **Map the Activity:**
      *   "Policy Rule" = **Origin Essentialism** (Kripke).
      *   "Round 1" = **Intuitive appeal** (We feel we couldn't have had different parents).
      *   "Round 2" = **The Fission Objection** (If origin is the zygote, twins share an origin but are two people; so origin cannot be the *whole* story of identity).
      *   "Round 3" = **The Arbitrariness Objection** (If origin is the specific gamete, identity rests on a biological lottery, which feels too contingent for a *necessary* truth).
  *   Explain that Kripke argues the "Gamete Lottery" intuition is wrong: it *is* necessary, even if it feels contingent. The activity made them feel the cost of that commitment.

  ### Predictable Failure Modes & Fixes
  1.  **Failure:** Teams write vague Policies like "It depends on the person."
      *   **Fix:** In Round 1, reject vague policies. "The Registry does not accept 'It depends'. You must state a condition." Force them to write "Same X = Same Person".
  2.  **Failure:** Students treat it as a joke and vote randomly.
      *   **Fix:** Adopt the persona of the Chief Registrar. Be dry, bureaucratic, and stern. "This certificate determines tax liability across worlds. Please treat it with gravity."
  3.  **Failure:** They finish Round 3 too quickly.
      *   **Fix:** Have **Set D** (Gradual Shift) ready. If they finish early, introduce the Sorites-style chain: "If Sperm 1 = Person 1, and Sperm 2 = Person 1, does Sperm 100 = Person 1?"
  4.  **Failure:** One dominant student in each group does all the thinking.
      *   **Fix:** Rule that the "Stamp" must be signed by all three Clerks. If one disagrees, they must note the "Dissent" on the sheet (which counts as a potential contradiction for the Audit).

  ### What the Activity Cannot Reproduce (The Limitation)
  The game simulates the *consequences* and *intuitions* of the doctrine, but it treats the rule as a bureaucratic choice. It cannot simulate the **modal logical necessity** that Kripke argues for. In the game, students feel they *could* have chosen a different rule. In Kripke's argument, the rule is not a choice; it is a truth about how reference works (rigid designators). You must explain in the debrief that the "Policy" isn't just office procedure, but a law of metaphysics that holds in all possible worlds.

  Verdict: The activity cannot reproduce the modal logical argument concerning rigid designators that grounds the necessity of origin, which you must supply in the debrief to explain why the constraint is metaphysical rather than merely bureaucratic.
