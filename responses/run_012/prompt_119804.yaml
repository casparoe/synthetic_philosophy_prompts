answer: |-
  **Title:** The Mechanics of Duty: Aggregation Rules and the Contingency of Voting Ethics

  **Research Question**
  Is the moral obligation to vote sincerely invariant under changes to the electoral aggregation rule, or is every normative claim about voting duty implicitly contingent on the mechanical structure of the vote count? Specifically, does there exist any aggregation rule under which the strategically dominant move aligns perfectly with the morally required move across all plausible electoral scenarios, thereby eliminating the tension between prudence and principle?

  **Problem Statement**
  Contemporary debates in the ethics of voting operate under a hidden structural assumption: plurality rule (first-past-the-post). Whether arguing from a consequentialist standpoint (the duty to prevent the worst outcome) or a deontological/expressivist standpoint (the duty to avoid complicity or maintain integrity), the literature treats the mechanism of aggregation as a neutral background constant. Under plurality, the "wasted vote" problem and the "lesser evil" dilemma appear as inevitable features of political participation. Consequentialists argue that throwing away a vote on a preferred but non-viable candidate is irrational; deontologists argue that holding one's nose to vote for a tolerable candidate is complicity.

  These positions remain unresolved because they are testing ethical frameworks against a single mechanical constraint. When the aggregation rule changes, the strategic landscape shifts, and with it, the ethical calculus. Under approval voting, the "lesser evil" dilemma dissolves into a question of where to set the approval threshold, introducing a new temptation to "bullet vote" (approve only the favorite) to avoid boosting the compromise. Under instant-runoff systems, the spoiler effect changes shape, altering the consequentialist calculation of harm. Because the strategic incentives are mechanical outputs, and ethical obligations in voting are largely defined by how one responds to strategic incentives, the ethical obligations themselves are mechanically contingent.

  Current positions fail to settle this because they seek a rule-independent ethics of voting. They ask "Should I vote?" or "Who should I vote for?" without precedingly asking "Under what counting rule?" This proposal argues that this omission is fatal. There is no "view from nowhere" for voting ethics; there is only voting ethics relative to a mechanism. The paper will demonstrate that the tension between sincerity and strategy is not a moral failure of the agent, but a structural feature of most aggregation rules, and that seeking a rule where sincerity is morally mandatory is likely a search for a mechanical impossibility.

  **Methodology**
  The project will not merely catalogue how different rules change strategic incentives. That is a task for social choice theory, not political philosophy. Instead, this paper will perform a test of *normative invariance*. The method involves three steps:

  1.  **Formalize Ethical Prescriptions:** Define the core competing ethical demands without reference to specific authors. Specifically, isolate the Consequentialist Demand (maximize the expected value of the outcome) and the Integrity Demand (act in accordance with one's true evaluative ranking).
  2.  **Model Mechanical Constraints:** Select three distinct aggregation rules that represent different structural families: Plurality (single choice), Approval (binary choice per candidate), and Ranked Choice (ordinal preference). For each, identify the condition under which strategic voting becomes the dominant strategy for achieving the Consequentialist Demand.
  3.  **Test for Alignment:** Determine if there is any scenario within these rules where the Consequentialist Demand and the Integrity Demand diverge. If they diverge under Plurality but align under Approval, the ethical obligation has shifted. If they diverge under all three, but for different mechanical reasons, the contingency is confirmed.

  This approach is superior to a simple catalogue because it treats the voting rule as an independent variable in a moral equation. The goal is not to explain how approval voting works, but to explain why the *moral pressure* to vote insincerely changes when the counting method changes. This isolates the variable responsible for the ethical dilemma: it is not human weakness, but mechanical structure.

  **Work Plan**
  *Weeks 1–3: Conceptual Clarification.*
  Define "sincere voting" precisely across different rule types (e.g., in approval voting, sincerity is ambiguous—is it approving only the favorite, or all acceptable candidates?). Define the "moral requirement" distinct from the "rational incentive." Establish the baseline ethical frameworks (outcome-maximization vs. expression of will).

  *Weeks 4–6: Mechanical Modeling.*
  Draft the technical descriptions of the three selected rules. Focus not on the math of the count, but on the logic of the incentive. Specifically, map the conditions under which "compromise" becomes necessary to prevent a worst-case outcome in each system.

  *Weeks 7–9: The Intersection (Drafting Core Arguments).*
  Apply the ethical frameworks to the mechanical models.
  *   *Case A:* Plurality. Show how the Integrity Demand conflicts with the Consequentialist Demand in a three-candidate split.
  *   *Case B:* Approval. Show how the Conflict shifts to the threshold setting (the bullet voting temptation).
  *   *Case C:* Ranked Choice. Show how the Conflict moves to the ranking of viable vs. non-viable options.
  Analyze whether the moral "dirtiness" of compromising is reduced or merely displaced.

  *Weeks 10–11: Synthesis and Counter-Argument.*
  Address the possibility of a "perfect" rule. Consider if a rule exists where truth-telling is a dominant strategy (e.g., specific range voting conditions) and whether that resolves the ethical tension or merely hides it behind complexity. Argue that even if such a rule exists, the ethical obligation remains contingent on its adoption.

  *Weeks 12–13: Revision and Polishing.*
  Refine the argument to ensure it remains philosophical and does not devolve into technical social choice commentary. Ensure the conclusion answers the research question determinately.

  **Criteria for Success and Failure**
  *Success:* The paper successfully demonstrates that the specific moral dilemmas associated with voting (wasted votes, complicity, spoilers) are not universal features of democracy but specific outputs of specific aggregation functions. A successful result concludes that there is no rule-independent ethics of voting; moral obligations regarding voting must be indexed to the mechanism in use. Ideally, it will show that strategic pressure reappears under every rule, merely changing form, implying that the "ethical voter" is a moving target.

  *Failure:* The project fails if it becomes a technical explanation of voting systems without philosophical payoff (i.e., explaining *how* approval voting prevents spoilers without explaining *why that matters* for moral duty). It also fails if it cannot distinguish between "strategic incentive" and "moral obligation," conflating what is smart with what is right. Finally, it fails if it collapses into a policy recommendation for a specific voting system rather than an analysis of the ethical contingency.

  **Scope Assessment**
  This is a viable semester-sized project for a 6000-word paper, provided the scope is strictly limited. The risk is attempting to cover too many voting systems. By restricting the analysis to three representative rules (Plurality, Approval, Ranked Choice), the paper can go deep enough into the ethical implications without getting bogged down in the exhaustive taxonomy of social choice theory. The focus must remain on the *ethical shift*, not the mechanical novelty. If the analysis reveals that the ethical contingency is total (i.e., no rule secures sincere voting as a moral duty), the argument is complete without needing to solve the engineering problem of designing a perfect system. The constraint of 6000 words requires disciplined pruning of technical examples; one clear scenario per voting rule is sufficient to demonstrate the ethical shift.
