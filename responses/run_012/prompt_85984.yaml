  ***

  ### Part (a) Feedback

  *   **Distinction between Mood and Counterfactuality [3/3 pts]:** You correctly identify that 'indicative/subjunctive' are grammatical categories while 'counterfactual' is a semantic/pragmatic notion regarding the falsity of the antecedent. Your explanation that they "cut across each other" is accurate.
  *   **Case (i) Analysis [2/3 pts]:** You correctly note the truth-value divergence (Indicative = true, Subjunctive = false/unsupported) despite identical antecedents/consequents. *Correction:* To secure full marks, explicitly state that this divergence suggests the two forms track different semantic parameters (e.g., different modal bases or world-orderings), not just "mood."
  *   **Case (ii) Analysis [1/2 pts]:** You correctly use the doctor case to show that subjunctive morphology does not entail a counterfactual assumption (the doctor thinks the patient *was* given arsenic). *Correction:* You missed connecting this back to the "one semantics" question in this section. This case is crucial evidence *for* a uniform semantics (since the grammar differs but the reasoning is abductive in both), but you didn't draw that conclusion here.
  *   **Case (iii) & Uniformity Conclusion [0/3 pts]:** You did not discuss Case (iii) in this section (it appears in Part b), and you did not answer the specific prompt question: "say what this tells us about whether one semantics can cover all 'if'-sentences." While you address uniformity in Part (b), exam structure matters. Case (iii) is typically used to motivate the Restrictor view (Kratzer), which you mention later, but omitting it here loses the credit allocated for this section's specific tasks.

  ***

  ### Part (b) Feedback

  *   **Adams' Thesis [3/3 pts]:** You stated the hypothesis correctly: $P(\text{if } A, \text{then } B) = P(B|A)$.
  *   **Triviality Results [2/4 pts]:** You capture the general upshot (tension between truth-conditions and conditional probability). *Correction:* There are two errors here. (1) Attribution: David Lewis proved the triviality results, not Adams (Adams proposed the thesis). (2) Precision: The results prove that conditionals cannot *both* have standard truth-conditions *and* obey Adams' Thesis without trivializing probability distributions. They do not strictly prove conditionals have *no* truth conditions (one could reject Adams' Thesis instead), though you correctly note this leads many to reject the truth-conditional programme.
  *   **Survival Strategy (Kratzer) [3/4 pts]:** You correctly identify the Restrictor view as a truth-conditional treatment that survives triviality. Explaining that 'if' restricts the modal base is the key insight required.
  *   **Contradiction on Case (iii) [−1 pt]:** In your final paragraph, you claim Case (iii) shows "truth-conditional semantics is the wrong shape" and is a "pragmatic effect." This contradicts your endorsement of Kratzer. Kratzer's restrictor view *is* a truth-conditional account that specifically solves Case (iii) by treating the 'if'-clause as restricting a covert epistemic modal in the consequent. You cannot both endorse Kratzer as a uniform solution and claim (iii) defeats truth-conditional semantics.
  *   **Organization [−1 pt]:** Case (iii) belongs in Part (a). Moving it here disrupted your argument in Part (b) and left Part (a) incomplete.
