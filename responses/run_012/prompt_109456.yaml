answer: |-
  You have identified a genuine gap in the introductory taxonomy of signaling theory, though it is not entirely uncharted in specialized literature. Your suspicion is correct: the mechanism works, but the "cost" is being booked in a different ledger than the standard Handicap Principle assumes.

  There is no single, canonical term like "Handicap Principle" for this specific three-party structure, but it is discussed under clusters of concepts such as **vicarious signaling**, **extractive signaling**, or **authority signaling**. In political science and economics, it often appears under the rubric of **signaling with other people's money (OPM)** or **principal-agent signaling**.

  Here is the carving you are looking for: how the concept fits the taxonomy, how honesty is maintained, and where the boundaries lie.

  ### 1. The Taxonomic Placement: Index vs. Handicap

  In the standard Zahavi-Grafen model, the signal is a **Handicap**: a trait that is costly to produce, where the cost is *differentially burdensome* based on the underlying quality (e.g., a healthy peacock can afford a heavier tail).

  In your three-party cases, the signal functions more like an **Index** of power or control, wrapped in the *appearance* of a Handicap.
  *   **Index:** An index is a signal that cannot be faked because it is physically or causally linked to the quality (e.g., voice pitch indexes body size).
  *   **The Shift:** In your examples, the signal indexes the signaller's **capacity to externalize costs**.

  It is not a pure index because it involves deliberate expenditure (the gala, the weekend work). It is not a pure handicap because the signaller does not directly bear the resource cost. It is best classified as **Costly Signaling via Authority**. The "cost" that ensures honesty is not the money or labor expended, but the **social friction, risk, or authority capital required to command that expenditure.**

  ### 2. How Honesty is Maintained (The Accounting Error)

  You asked: *"If externalising the cost is free, a low-quality signaller can externalise just as readily."*

  Your hypothesis is the solution: *"The ability to impose the cost is itself correlated with the quality being signalled."*

  In standard signaling, the cost is **production-based** (growing the tail). In this three-party structure, the cost is **enforcement-based** (maintaining the hierarchy that allows you to sacrifice the third party). A low-quality signaller *cannot* externalize costs as readily as a high-quality one, because the act of externalization triggers resistance that the low-quality signaller cannot suppress.

  Let's re-book the costs for your examples:

  *   **The Charity Gala:**
      *   *Apparent Cost:* Program budget (paid by beneficiaries).
      *   *Real Signalling Cost:* **Reputational Risk & Network Access.** A scam charity cannot host a convincing extravagant gala because they lack the *social capital* to get high-profile attendees or venues on credit. Furthermore, if they divert too much program money, whistleblowers (beneficiaries/staff) may expose them. Only a "well-connected" (high-quality) charity can absorb the friction of diverting funds without collapsing.
  *   **The Department (Unpaid Weekend Work):**
      *   *Apparent Cost:* Junior staff labor.
      *   *Real Signalling Cost:* **Retention Risk & Coercive Capacity.** A failing department cannot enforce unpaid weekend work; the juniors would simply leave or unionize. Only a prestigious department (high-quality) has the brand power to compel juniors to accept exploitation. The signal is honest because the *ability to exploit without revolt* indexes the department's status.
  *   **The Faction (Violence against Victims):**
      *   *Apparent Cost:* Victim suffering.
      *   *Real Signalling Cost:* **Retaliation Risk.** Attacking third parties often invites state crackdowns or rival retaliation. Only a faction with high operational security, funding, and resolve (high-quality) can sustain a campaign of externalized violence without being destroyed. A weak faction trying this would be crushed immediately.

  **The General Principle:** The honesty of the signal is maintained because **extracting resources from a third party requires power.** The signal is not "I sacrificed X"; it is "I am powerful enough to sacrifice X *of yours* without consequence."

  ### 3. Established Concepts and Names

  While there is no single "Zahavi" term, you will find this discussed in these specific contexts:

  **A. Vicarious Costly Signaling (Anthropology/Evolutionary Psychology)**
  Used when an individual signals status by controlling the resources or bodies of others.
  *   *Example:* Human sacrifice. The priest/king signals connection to the gods by killing a victim. The cost is the victim's life, but the signal is the priest's authority.
  *   *Literature:* See work by **Richard Sosis** on religious ritual or **Bliege Bird** on signaling theory in anthropology. They discuss how rituals often burn resources that belong to the group, not just the individual.

  **B. Signaling with Other People's Money (Finance/Economics)**
  This is the cynical corporate variant.
  *   *Example:* A CEO spends shareholder money on a lavish headquarters to signal firm stability to the market.
  *   *Mechanism:* The honesty condition is **fiduciary scrutiny**. A failing firm cannot spend OPM lavishly without triggering audits or shareholder revolt. Only a firm with strong governance (or strong enough control to bypass it) can do so.
  *   *Literature:* **Jensen and Meckling (1976)** on agency costs touches this, though more in the context of waste. **Bertrand and Mullainathan** on "Enjoying the Quiet Life" is adjacent.

  **C. Audience Costs / Resolve Signaling (Political Science)**
  *   *Example:* A leader starts a war that hurts civilians to signal resolve to an adversary.
  *   *Mechanism:* **James Fearon** and **Anne Sartori** discuss how leaders tie their hands. In your third-party cost case, the leader risks domestic unrest (the third party revolting). Only a leader with high domestic control (high quality) can impose those costs without being ousted.
  *   *Term:* **"Tying Hands"** often involves imposing costs on one's own population to signal to an external enemy.

  ### 4. Boundary Cases and Distinctions

  To carve this out clearly, we must distinguish it from adjacent phenomena.

  **A. Versus Coercion**
  *   *Coercion:* I force you to do X to benefit me. No audience update required.
  *   *Three-Party Signaling:* I force Group C to bear Cost X to convince Audience B of Quality Y.
  *   *Boundary:* If the audience is unaware the cost is externalized, it is **Fraud**. If the audience knows and accepts it, it is **Signaling**. If the audience is the one being coerced, it is **Dominance Display**.

  **B. Versus Virtue Signaling**
  *   *Virtue Signaling:* Typically implies the cost is *notional* or low (cheap talk).
  *   *Three-Party Signaling:* The cost is *real*, just displaced.
  *   *Boundary:* If the signaller claims the cost is high but it is actually low (e.g., a hashtag campaign that costs nothing), it is virtue signaling. If the signaller imposes real harm on a third party (e.g., firing staff to balance books before an IPO), it is extractive signaling.

  **C. Versus Principal-Agent Problem**
  *   *Principal-Agent:* The agent acts against the principal's interest.
  *   *Three-Party Signaling:* This is often a *solution* to an information asymmetry between Signaller and Audience, funded by the Principal (third party).
  *   *Boundary:* If the third party (Principal) consents to the cost (e.g., shareholders approve the HQ), it is standard agency. If the cost is hidden or forced (beneficiaries didn't choose the gala), it is **Extractive Signaling**.

  ### 5. Summary Definition

  If you need a label for your own work, **"Extractive Costly Signaling"** or **"Vicarious Handicap Signaling"** would be precise.

  **Definition:** A signaling strategy where a signaller demonstrates an underlying quality (power, commitment, status) by imposing a cost on a third party, where the honesty of the signal is guaranteed not by the resource cost itself, but by the **signaller's capacity to impose that cost without suffering systemic collapse or revolt.**

  **The Ledger Correction:**
  *   **Standard Handicap:** Cost = Resource Depletion (Signaller pays).
  *   **Extractive Signal:** Cost = Authority/ Stability Depletion (Signaller risks collapse to extract resource).

  You are not confused about the accounting; you have simply identified that in social hierarchies, **power is the currency that pays for the signal.** The "cost" is the expenditure of power required to treat the third party as a resource. A low-quality signaller lacks the power to spend.
