  ### Rivalry, refinement, or change of subject

  Is this a rival, refinement, or change of subject? It is best understood as a generalization that functions as a rival on predictive claims. Turchin's model is the limiting case of the coupled model where coupling strength equals zero. By introducing coupling, the classmate does not deny internal demographic pressures but denies their sufficiency. This makes it a rival regarding causality: is collapse endogenous or systemic? However, it is a refinement of scope, acknowledging that agrarian states never existed in a vacuum. Yet, it arguably changes the subject of prediction. Turchin promises to predict the turning point of a specific society; the coupled model predicts the synchronization pattern of a region. If the goal is policy-relevant prediction for a single state, the coupled model introduces too much noise from external variables. If the goal is macrohistorical understanding, the coupled model offers superior explanatory power for regional waves of crisis. The tension lies in parsimony versus accuracy. Turchin sacrifices accuracy for a clean, testable signal. The coupled model sacrifices signal clarity for systemic realism. Ultimately, it challenges the feasibility of Turchin's specific quantitative predictions by showing that the error term (external coupling) is actually a structural variable. Therefore, while Turchin claims to predict *when* a state falls, the coupled model suggests we can only predict *whether* it falls in concert with others. This shifts the burden of proof from measuring internal stress to measuring network topology, fundamentally altering what counts as a successful historical prediction.

  ### Three test cases

  Consider first the two-neighbor case where both empires exhibit elite overproduction and fiscal strain. Turchin's theory expects their breakdowns to be roughly synchronous only if their internal demographic parameters are identical and their initial conditions align; otherwise, they proceed on independent clocks. The breakdown is a function of local carrying capacity. The coupled model expects synchronization only under strong coupling. If trade and war links are weak, the cycles drift apart despite similar internal stress, resulting in asynchronous collapses. If coupling is strong, phase-locking occurs, and they collapse together, potentially amplifying the regional crisis through contagion. The coupled model predicts that strong coupling reduces the variance in collapse timing across the region, creating historical "waves."

  Second, consider a shock killing a large fraction of the elite but leaving the productive base intact. For Turchin, this is a reset button: elite competition drops, fiscal strain eases, and the integrative phase extends. The timing of the next crisis is delayed predictably based on the new elite growth rate. For the coupled model, the local phase resets, but the outcome depends on neighbors. If neighbors are in a disintegrative phase, they might exploit the shock to invade, causing collapse despite the internal reset. The shock's impact is contingent on the network state, not just internal recovery. A local reset might fail to prevent collapse if the regional system is in a synchronized disintegrative wave, meaning internal relief does not guarantee survival.

