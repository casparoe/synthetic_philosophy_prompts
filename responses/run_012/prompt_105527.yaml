  # Decision Tree: Is Analogy the Core of Cognition?

  **Q1. Scope (The Everyday Case)**
  **Case:** Consider a **child who calls a zebra a horse**, or a **barista who reaches for a customer's usual order on sight**.
  **Question:** Is the mind performing an analogical mapping in these moments, or simply retrieving a stored label or habit?
  *   **Retrieving label/habit:** Go to Q2 (Narrow Scope).
  *   **Performing mapping:** Go to Q4 (Wide Scope).

  **Q2. Status (The Expert Case)**
  **Case:** A **programmer recognizes that a new bug is the same as a bug seen in an unrelated codebase**.
  **Question:** Is this a special high-level faculty distinct from basic perception, or just one tool among many (like deduction or simulation)?
  *   **One tool among many:** **Leaf: Pluralism**.
  *   **Special high-level faculty:** Go to Q3.

  **Q3. Origin (The Error Case)**
  **Case:** **Someone seeing a face in a cloud**.
  **Question:** Is this a genuine operation of the analogical faculty, or merely a misfiring of basic association and similarity?
  *   **Genuine operation:** **Leaf: Traditionalism**.
  *   **Misfiring/Association:** **Leaf: Reductionism**.

  **Q4. Core Mechanism (The Model Case)**
  **Case:** A **language model completes an analogy item correctly**.
  **Question:** Does this demonstrate the core of cognition, or merely that the system is compressing data to predict tokens?
  *   **Compressing/Predicting:** **Leaf: Compressionism**.
  *   **Demonstrating Core:** Go to Q5.

  **Q5. Reality (The Vocabulary Case)**
  **Question:** Is "analogy" a specific implementable mechanism we could code, or just a useful vocabulary for describing behavior after the fact?
  *   **Useful vocabulary:** **Leaf: Descriptivism**.
  *   **Implementable mechanism:** Go to Q6.

  **Q6. Uniformity (The Artist Case)**
  **Case:** A **jazz musician who quotes a lick from one tune inside another**.
  **Question:** Is the mental mechanism here the *same* single process used to recognize a face in a cloud, or a heterogeneous collection of processes?
  *   **Heterogeneous collection:** **Leaf: Fragmented Analogism**.
  *   **Same single process:** **Leaf: Strong Analogism**.

  ***

  ### Positions (Leaves)

  1.  **Pluralism:** Cognition is a toolbox; analogy is one tool among deduction, induction, and simulation, with no primacy.
      *   *Awkward commitment:* There is no unified theory of how the mind works, only a list of parts.
  2.  **Traditionalism:** Analogy is a distinct, deliberate, high-level faculty that maps between pre-existing representations.
      *   *Awkward commitment:* Most of daily life (like grabbing a mug) does not count as "thinking."
  3.  **Reductionism:** What we call analogy is derivative of similarity and association and is no special faculty.
      *   *Awkward commitment:* There is no such thing as analogy, only vague resemblance.
  4.  **Compressionism:** Analogy is best understood as compression or prediction, so the real core is compressibility.
      *   *Awkward commitment:* Meaning is nothing more than statistical efficiency.
  5.  **Descriptivism:** The thesis is a redescription of cognition in analogical vocabulary, not an implementable mechanism.
      *   *Awkward commitment:* We can talk about minds this way, but we cannot build them this way.
  6.  **Fragmented Analogism:** Analogy is ubiquitous and automatic, but the word names a heterogeneous collection of processes.
      *   *Awkward commitment:* "Analogy" is everywhere, but has no single definition.
  7.  **Strong Analogism:** Analogy is ubiquitous, automatic, and constitutive of concepts, so everything from seeing to reasoning is analogy.
      *   *Awkward commitment:* Seeing a cup is the same kind of work as solving a physics problem.

  ***

  ### Note on Unoccupied Space

  *   **Narrow Scope + Compressionism:** (Only deliberate mapping is core, and it is just prediction). This combination is **unexplored**; usually, those who narrow the scope want to protect analogy from being reduced to statistics.
  *   **Wide Scope + Traditionalism:** (Everything is analogy, but only deliberate mapping counts as the faculty). This is **incoherent**; if everything is analogy, the faculty cannot be restricted to hard problems.
  *   **Distinction Limit:** **Descriptivism** and **Strong Analogism** cannot be fully separated by behavioral cases alone; one claims the mechanism exists, the other claims the description is merely useful. The tree separates them by asking about implementability (Q5), which is a philosophical commitment rather than an empirical observation.
