prompt: |-
  I'm putting together the research plan for a three-year fellowship I've been awarded on moral formation through life-writing, and I need to decide which of the genuinely open conceptual questions in that area deserve the time. The constraint I've set myself is that the output should be useful to people who actually design programmes that put exemplary lives in front of students — seminaries, medical humanities, military ethics, character education in schools, the sort of institution that still assigns Plutarch's paired lives or a saint's life and hopes something will happen — rather than a contribution to a debate only other philosophers read. I've been circling a tension I can't state cleanly, and I suspect it is the hinge of the whole area. Call it the legibility/fidelity trade-off: the more a life is shaped so that its moral can be read off it — the hagiography, the encomium, the edifying obituary — the more the reader can extract a lesson, but the more the account has been purged of precisely the contingency, ambiguity and luck that make a real life worth learning from; the more faithfully a biography restores that contingency, the less it delivers anything that could be called a lesson. Every pedagogy of exemplars seems to sit somewhere on that trade-off without anyone admitting it, and I suspect the historical genres I'm drawing on have quietly inherited one side of it.

  Beyond that hinge I have half-formulated several further questions and no idea which are load-bearing: whether an exemplar teaches by proving a way of life possible rather than probable, so that the single case functions as a possibility proof rather than as evidence; whether the moral of a life is available to the person who lived it or only to the biographer who outlives it; whether admiration is a reliable faculty of moral perception or merely tracks status, charisma and whatever the readership already reveres; whether the form of the account — praise, confession, denunciation, warts and all — fixes what can be learnt from it, so that certain genres can only teach certain virtues; and whether anything at all transfers from a life set in circumstances radically unlike the learner's, or whether the genre is only ever a mirror that returns the reader's existing commitments.

  What I want from you is a defended research agenda rather than a survey or a reading list. Given three years and one person, which of these questions — or others I have failed to name, including any that would make my legibility/fidelity framing look naive — should come first, and in what order? Make the criteria explicit: which questions are upstream of which, which are tractable with the tools of philosophy rather than needing empirical collaborators, which are neglected, and which look urgent but would change nothing downstream if settled. I should also like to know what evidence or developments over the next two or three years would move a question up or down the ranking, and where you think I have mis-framed the area altogether. Please write in British English.
reasoning: |-
  Here's a thinking process that leads to the suggested research agenda:

  1.  **Analyze the Request:**
      *   **Context:** A three-year fellowship on moral formation through life-writing.
      *   **Goal:** Create a *defended research agenda* (prioritized, ordered, justified), not a survey or reading list.
      *   **Target Audience for Output:** Practitioners designing programmes (seminaries, medical humanities, military ethics, schools) who use exemplars (Plutarch, saints' lives, etc.).
      *   **Core Tension:** The "Legibility/Fidelity Trade-off" (clean moral lessons vs. messy reality).
      *   **Candidate Questions:**
          1.  Possibility proof vs. probability evidence.
          2.  Moral availability (to the agent vs. the biographer).
          3.  Admiration as moral perception vs. status tracking.
          4.  Genre constraints (praise, confession, etc.) on teachable virtues.
          5.  Transferability across radical circumstance differences.
      *   **Constraints/Criteria:** Explicit criteria for prioritization (upstream/downstream, philosophical tractability, neglect, urgency/impact), British English, identify potential mis-framings, suggest evidence that would shift priorities.

  2.  **Deconstruct the Core Tension (Legibility/Fidelity):**
      *   The user suspects this is the "hinge." Is it?
      *   *Critique:* It's a strong starting point, but it risks being a false dichotomy. High fidelity *can* be legible if the reader has the right hermeneutic tools. High legibility *can* be faithful if the moral is complex.
      *   *Refinement:* The real issue isn't just the text's properties, but the *mechanism of uptake*. How does the reader bridge the gap? This points to the "Admiration" and "Transferability" questions as more fundamental than the text itself.
      *   *Verdict:* Keep it as the framing problem, but treat it as a symptom of a deeper epistemic/psychological mechanism issue.

  3.  **Evaluate Candidate Questions (Prioritization Strategy):**
      *   *Question 1: Possibility Proof vs. Probability.* (Metaphysical/Epistemic). Important, but abstract. If a life is just a possibility proof, does it matter if it's legible? Yes. Is this upstream? Yes, it defines *what* an exemplar does.
      *   *Question 2: Moral Availability (Agent vs. Biographer).* (Phenomenological). Interesting, but perhaps secondary. If the agent didn't see it, can the student still learn it? Yes (Socrates didn't write about Socrates). Low priority for *practitioners*.
      *   *Question 3: Admiration.* (Psychological/Normative). **Crucial.** If admiration is just status bias, the whole project collapses. This is the gatekeeper. If admiration is unreliable, legibility/fidelity doesn't matter.
      *   *Question 4: Genre Constraints.* (Formal). Important for curriculum design. Different genres teach different things. High utility for practitioners.
      *   *Question 5: Transferability.* (Contextual). High utility. Practitioners worry about "relevant" role models.

  4.  **Develop the Research Agenda (The "Defended" Part):**
      *   *Year 1: The Mechanism of Uptake (Admiration & Possibility).* Before designing the curriculum, we need to know *how* learning happens. Is admiration trustworthy? Is the logic of the exemplar inductive or modal?
      *   *Year 2: The Textual Medium (Genre & Fidelity).* Once we know the mechanism, how does the medium constrain it? This addresses the Legibility/Fidelity trade-off directly.
      *   *Year 3: Application & Transfer (Context).* How does this work in specific institutions (seminaries, military, etc.)? Bridging the gap to the "practitioners."

  5.  **Critique the User's Framing:**
      *   *Legibility/Fidelity:* It's good, but it assumes the "lesson" is a static object to be extracted. A better framing might be "Resonance" or "Appropriation." The lesson isn't extracted; it's constructed in the encounter.
      *   *Missing Question:* The role of *negative* exemplars (what not to do). Also, the role of *community* in interpretation (individual reading vs. guided discussion).
      *   *Mis-framing:* The idea that "practitioners" just want lessons. They want *formation*, which is habituation, not just cognitive extraction.

  6.  **Drafting the Response (incorporating British English and Tone):**
      *   *Tone:* Academic, rigorous, collegial, direct.
      *   *Structure:*
          1.  Assessment of the Core Tension (Legibility/Fidelity).
          2.  Criteria for Prioritisation.
          3.  The Three-Year Agenda (Phased).
          4.  Critique of Framing/Blind Spots.
          5.  Triggers for Re-prioritisation.

  7.  **Refining the Argument (Self-Correction during drafting):**
      *   *Initial thought:* Put Genre in Year 1. *Correction:* No, Admiration is more upstream. If admiration is broken, genre doesn't matter.
      *   *Initial thought:* Dismiss "Moral Availability." *Correction:* Keep it as a sub-point in Year 2 (Hermeneutics), but don't make it a headline.
      *   *Focus on Practitioners:* Ensure every philosophical point links back to curriculum design. E.g., if admiration is biased, practitioners need scaffolding to correct it.
      *   *British English:* Check spelling (programme, honour, centre, analyse) and idiom.

  8.  **Final Polish:**
      *   Check against the "load-bearing" requirement. Which questions, if answered differently, change the whole project?
      *   *Admiration:* If it's purely status-tracking, the project is dead. (Load-bearing).
      *   *Possibility:* If it's probability, we need statistical thinking. If possibility, we need imagination. (Load-bearing).
      *   *Transfer:* If context is everything, universal curricula are useless. (Load-bearing).

  9.  **Final Review against constraints:**
      *   Defended agenda? Yes.
      *   Not a reading list? Yes.
      *   British English? Yes.
      *   Addressed the "Legibility/Fidelity" tension? Yes.
      *   Included triggers for change? Yes.

  (Proceed to generate output based on these thoughts.)
answer: |-
  This is a formidable brief. You have identified the central pathology of the field: the tendency for philosophical accounts of exemplarity to remain abstractly normative while the practitioners who actually wield these texts operate on unexamined psychological and pedagogical assumptions. Your 'legibility/fidelity trade-off' is a robust heuristic, but I shall argue it is a symptom rather than the disease. It describes a tension in the *text*, but the failure of moral formation usually occurs in the *uptake*.

  Below is a defended research agenda for your three-year fellowship. I have ordered these inquiries by logical dependency (upstream/downstream) and tractability for a sole philosopher, with the explicit aim of producing actionable guidance for curriculum designers.

  ### I. Assessment of the Core Framing

  **The Legibility/Fidelity Trade-off:**
  This is a strong starting point, but it risks a category error. It assumes the 'moral' is a static object embedded in the life, waiting to be extracted (legibility) or obscured (fidelity). A more precise framing is **Resonance vs. Replication**.
  *   *Legibility* encourages replication (copy the action).
  *   *Fidelity* encourages resonance (understand the principle that generated the action).
  *   *Critique:* If you treat the trade-off as the primary problem, you may spend three years tweaking biography styles. The deeper question is: *What cognitive work must the learner perform to move from resonance to action?* This shifts the burden from the biographer to the pedagogue.

  **The Missing Variable:**
  You have omitted the **Negative Exemplar**. Practitioners often use 'warners' (lives gone wrong) as effectively as saints. A theory of moral formation that cannot account for learning from failure is incomplete. I suggest integrating this into Year 2.

  ### II. Criteria for Prioritisation

  To determine the order of inquiry, I have applied four filters:
  1.  **Load-Bearing:** If the answer to this question is 'No', does the rest of the project collapse?
  2.  **Upstream Dependency:** Does answering Question A make Question B easier or redundant?
  3.  **Philosophical Tractability:** Can this be advanced by conceptual analysis and existing literature, or does it require empirical data you cannot generate alone?
  4.  **Practitioner Leverage:** Does settling this change how a seminary or school designs a syllabus?

  ### III. The Three-Year Agenda

  #### Year 1: The Epistemology of Admiration (The Gatekeeper)
  **Primary Question:** *Is admiration a reliable faculty of moral perception, or merely a tracker of status and charisma?*
  **Secondary Question:** *Does an exemplar function as a possibility proof or probabilistic evidence?*

  **Justification:**
  This is the most upstream, load-bearing inquiry. If admiration is merely a bias towards power or charisma (as Nietzsche or certain evolutionary psychologists might suggest), then the entire pedagogical project is suspect. No amount of textual fidelity can correct a corrupted faculty of perception. Furthermore, you must settle the logical status of the exemplar. If a life is 'probabilistic evidence' (i.e., 'doing X leads to flourishing'), it requires statistical thinking. If it is a 'possibility proof' (i.e., 'it is possible to remain virtuous in circumstance Y'), it requires imaginative engagement. These demand different pedagogies.

  **Methodology:**
  *   Conceptual analysis of 'admiration' (distinguishing *admiration-for* vs. *admiration-that*).
  *   Engagement with recent work in moral psychology (e.g., Zagzebski, but critically) without requiring new empirical data.
  *   **Output for Practitioners:** A diagnostic framework for selecting exemplars. If admiration is biased, practitioners need 'scaffolding' protocols (e.g., paired reading, critical debriefing) to correct for status bias. If the logic is 'possibility', they need to stop asking 'Did this work?' and start asking 'Could this be done?'

  **Why First?**
  If admiration is unreliable, your work on biography genres (Year 2) is moot. You must first establish *who* can be looked at before deciding *how* they are looked at.

  #### Year 2: The Hermeneutics of the Medium (The Trade-off)
  **Primary Question:** *Does the genre of the account (hagiography, confession, biography) fix the virtues that can be learnt?*
  **Secondary Question:** *How do we manage the Legibility/Fidelity trade-off without collapsing into didacticism or relativism?*

  **Justification:**
  Once we know *that* we can learn from lives (Year 1), we must ask *how the text mediates this*. This is where your legibility/fidelity tension lives. I propose arguing that different genres are not better or worse, but **virtue-specific**.
  *   *Hagiography/Encomium:* Best for teaching *aspirational* virtues (courage, sacrifice) where the 'possibility proof' is paramount. Fidelity is less important than the clarity of the ideal.
  *   *Confession/Autobiography:* Best for teaching *regulative* virtues (humility, repentance, prudence) where the struggle and contingency are the lesson.
  *   *Critical Biography:* Best for teaching *judgement* (discernment), where the learner must separate the agent from the action.

  **Methodology:**
  *   Comparative analysis of genres (Plutarch vs. Augustine vs. modern biography).
  *   Conceptual mapping of which virtues require 'messiness' to be understood (e.g., you cannot learn prudence from a saint's life that omits the deliberation process).
  *   **Output for Practitioners:** A 'Genre-Virtue Matrix'. A curriculum designer can look at this and say, 'We need to teach resilience; therefore we need high-fidelity accounts of failure,' or 'We need to teach devotion; therefore a stylised life is acceptable.'

  **Why Second?**
  This depends on Year 1. If admiration is purely status-tracking, genre doesn't matter. If it is a moral faculty, genre becomes the lens that focuses it. This directly addresses your core tension but moves it from a problem to a design feature.

  #### Year 3: The Problem of Transfer (The Application)
  **Primary Question:** *What transfers from a life set in radically unlike circumstances?*
  **Secondary Question:** *How do negative exemplars function in this economy?*

  **Justification:**
  This is the most urgent concern for practitioners (e.g., a soldier reading Marcus Aurelius, a medic reading a saint). It is also the most philosophically tractable via the concept of **analogy** and **principle extraction**. The risk here is empirical drift (needing to test students), so you must keep this conceptual. Focus on the *structure of the analogy* required to bridge the gap.
  Simultaneously, integrate the 'Negative Exemplar'. Does learning what *not* to do require high fidelity (to see the causal chain of error) or high legibility (to see the clear boundary)?

  **Methodology:**
  *   Analysis of 'situationist' critiques of virtue ethics.
  *   Development of a theory of 'Moral Analogy'.
  *   **Output for Practitioners:** Guidelines for 'Contextual Bridging'. If the gap is too wide, the text must be paired with intermediate cases. This tells a seminary why they cannot just assign *The Life of Antony* to a twenty-first-century undergraduate without mediation.

  **Why Third?**
  Transfer is the final mile. It presupposes a reliable mechanism of uptake (Year 1) and an appropriate textual medium (Year 2). Solving transfer without solving admiration is futile.

  ### IV. Potential Mis-framings and Blind Spots

  1.  **The 'Extraction' Fallacy:** You speak of extracting a lesson. This implies the moral is *in* the text. I argue the moral is generated in the *encounter* between text, reader, and community. Your research should pivot towards the **pedagogical scaffolding** required for that encounter, not just the properties of the text. A high-fidelity text taught badly yields nothing; a hagiography taught well can yield profound critical engagement.
  2.  **The Individualist Bias:** You focus on the reader and the life. Moral formation is rarely solitary. It happens in a community of interpretation (a seminary cohort, a platoon). The 'Legibility/Fidelity' trade-off might be solvable not by changing the text, but by changing the **discursive context**. A group can restore the contingency that a hagiography omits through discussion.
  3.  **Neglect of the Body:** Life-writing is often cognitive. Moral formation is habituated. Does reading about courage make one courageous? Only if the reading is tied to practice. Your agenda should acknowledge that life-writing is likely a *propaedeutic* to action, not the action itself.

  ### V. Triggers for Re-prioritisation

  Over the next three years, the following developments should cause you to shift focus:

  *   **Move Admiration (Year 1) to the back burner if:** New empirical work in moral psychology (e.g., from the Jubilee Centre or similar) definitively settles the reliability of admiration. If it is proven to be largely status-tracking, you must pivot immediately to **Institutional Correction** (how institutions correct bias) rather than individual perception.
  *   **Elevate Transfer (Year 3) to Year 1 if:** You find that practitioners universally reject historical exemplars as 'irrelevant'. If the 'Context Gap' is the actual barrier to entry, no amount of epistemological work on admiration will matter. The urgency of the user need overrides logical dependency.
  *   **Abandon the Trade-off if:** You discover that 'High Fidelity' narratives are actually *more* legible to modern readers because they trust realism more than idealism. The trade-off may be historical (Victorian vs. Modern) rather than structural.

  ### VI. Summary of Deliverables

  To ensure this remains useful to practitioners, your three years should yield:
  1.  **A Typology of Exemplarity:** Distinguishing Possibility Proofs from Probabilistic Models.
  2.  **A Genre-Virtue Matrix:** Matching text types to moral learning outcomes.
  3.  **A Protocol for Mediation:** A set of philosophical guidelines for how to teach a life (e.g., 'When using hagiography, explicitly reconstruct the omitted contingencies').

  This agenda treats your 'Legibility/Fidelity' tension not as a paradox to be solved, but as a design constraint to be managed. It places the heaviest philosophical lifting in Year 1, ensuring that if the foundation is unsound, you know early. It reserves the most practical, curriculum-facing work for Year 3, ensuring your final output is ready for implementation.
