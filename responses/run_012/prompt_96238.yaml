prompt: |-
  I'm a third-year undergraduate taking a seminar in the philosophy of the social sciences, where we have just spent three weeks on David Lewis's analysis of convention, and in parallel I'm doing a module in evolutionary game theory and multi-agent reinforcement learning. Lewis's account, as I understand it, is a piece of conceptual engineering carried out with possible worlds, common knowledge, and counterfactual preferences; everything I do in the other module is populations of myopic agents, replicator dynamics, basins of attraction, stochastic stability, equilibrium selection. My seminar leader treats these as accounts of the same phenomenon and my game theory lecturer treats Lewis as a charming historical preamble, and I suspect neither of them has noticed how much has to be given up to make the two line up. I'd like you to do the translation explicitly. Please restate Lewis's position on social convention, and the evolutionary and learning-theoretic literature on how norms and conventions arise and are sustained, in the vocabulary I actually work in: coordination games with multiple equilibria, payoff matrices, best-response dynamics, evolutionary stable strategies, basins of attraction, correlated equilibrium, symmetry-breaking and payoff-irrelevant cues, punishment and sanctions as modifications to the payoff structure, and the standard reinforcement-learning apparatus of learning rules, shared priors, and convergence results. I have enough game theory to follow the formalism without hand-holding — feel free to use it — but my metaphysics and philosophy of language are shaky, so don't assume I know the possible-worlds machinery or the literature on linguistic meaning.

  Concretely, I want Lewis's conditions on a convention, his claim that conventions are arbitrary, and his claim that conforming gives an agent a reason to conform, all rendered in the dynamical vocabulary as precisely as you can. Then give me the residue report, which is the part I actually care about. Which of his claims translate cleanly? Which translate only under distortion, and what exactly gets distorted — for instance, does the common-knowledge requirement have any honest counterpart when agents are modelled as myopic learners who never represent each other's representations, or is the natural move to replace it with something weaker that is not the same thing? Does arbitrariness survive once payoff asymmetries and salience do all the equilibrium-selection work? And does the normative "reason to conform" survive at all in a purely descriptive selection account, or is it simply dropped and replaced by the observation that deviation is unprofitable?

  Finally, I want your view on whether the residue is a defect of the target framework or a sign that the original claim was less clear than it looked. Two specific things I'd like you to address, because they're what made me suspicious in the first place. First, some authors distinguish conventions, which are self-enforcing and arbitrary, from norms, which people follow even when they would rather defect and which are backed by sanctions and by feelings like guilt and shame; I want to know whether that distinction is expressible in the dynamical vocabulary or whether it collapses into the banal observation that the two cases have different payoff matrices, and if it collapses, whether anything was lost. Second, Lewis seems to allow that a population can be mistaken about what its convention is, or about whether there is one, and I cannot see what the counterpart of being mistaken about your own equilibrium is when the equilibrium is defined by the population's actual behaviour. Tell me whether that is a genuine gap in my vocabulary, a genuine unclarity in his, or just me misreading the setup.
