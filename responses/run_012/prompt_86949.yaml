prompt: |-
  OK this is going to be long, sorry, but I just spent two and a half hours arguing with my flatmate about this and I need someone to tell me if I'm an idiot.

  Background so you know I'm not making it up. Popper had this notion of verisimilitude, truthlikeness — the idea that most of the big scientific theories turn out to be false, but one false theory can still be closer to the truth than another, and that's what scientific progress amounts to. And he tried to cash it out concretely: theory B is closer to the truth than theory A when B's true consequences include A's true consequences and then some, while B's false consequences are a subset of A's. More informative and less wrong at the same time. Then in the mid-70s a couple of logicians sat down and worked the definition through and found it has an unintended consequence: on Popper's own definition, no false theory can come out closer to the truth than any other false theory. So the definition can't do the one thing it was built to do. Popper definately conceded it, apparently more or less on the spot.

  That part I'm confident about. Here's the arguement.

  My flatmate's conclusion: then "closer to the truth" is a slogan. If you can't define it, you can't measure it, and if you can't measure it you're just picking favourites — Newton over Ptolemy, oxygen over phlogiston, it's all vibes, and the later theory is just the one we happen to like. Anyone still talking about scientific progress is doing metaphysics in a lab coat.

  And I said that's a non sequitur. Failing to *define* something isn't the same as showing there's nothing there. Nobody has a definition of "game" that isn't either too narrow or too broad, and nobody concludes that chess isn't really a game. A definition is a formal achievement, not a permission slip for the concept to exist. And I said the other thing too: "no false theory is closer than another" is a fact about *his* definition of closeness, not a fact about the world.

  He said that's cope, and that when I fall back on "well maybe what we really mean is predictive success, unification, novel predictions" I've conceded his point, because those are pragmatic virtues, not truth-tracking ones.

  Now I'm second-guessing, and this is what I actually want from you. Was I right, or am I coping? If the one serious attempt to say what "closer to the truth" *is* collapses, what's left of the notion besides an intuition? And is he right that the moment I reach for predictive success I've quietly switched to a pragmatic notion, so he wins after all?

  Be blunt, argue with me, tell me if I'm being an idiot. No reading list, no citations, no names and dates — I don't care who said what, I want the argument. And if there's an assumption I'm making that's doing all the work without me noticing it, name it, because I have a feeling that's where the real answer is.

  Then finish with one line, exactly in this form, nothing after it:
  \answer{...}
  and inside the braces put either `question well-posed: <short answer>` or `false presupposition: <the bad assumption in a few words>`.
