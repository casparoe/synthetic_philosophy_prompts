answer: |-
  You are not an idiot, and you are not coping. Your flatmate is making a category error that looks sophisticated but is actually quite crude.

  Here is the blunt truth: Your flatmate is operating on a verificationist assumption that died decades ago. They are claiming that if a concept cannot be formally defined with necessary and sufficient conditions, it does not exist. By that logic, "justice," "health," and "consciousness" are also just vibes. We lack perfect metrics for many real phenomena. The failure of a specific metric does not invalidate the dimension being measured. Popper's definition was a specific map; the territory of truthlikeness exists regardless of whether that specific map burned down.

  However, you need to watch your step on the second point. You worry that appealing to predictive success concedes the ground to pragmatism. Here is where you are slightly vulnerable. Predictive success is not *definitionally* identical to truth. A theory can be useful without being true (instrumentalism). But your flatmate is wrong to say that choosing the more successful theory is *just* picking favorites. It is an inference to the best explanation. We assume success tracks truth because that is the only rational stance that explains why science works at all. If you abandon truth-tracking entirely, you cannot explain why old theories stop working when new ones arrive.

  There is one assumption you are making that is factually wrong, though it doesn't ruin your argument. You said Popper's was the "one serious attempt" to define truthlikeness. It wasn't. After Popper's definition collapsed, many others tried to fix it using different logical tools (similarity in state spaces, etc.). Some succeed better than others. The concept is still alive in professional philosophy. Your flatmate is arguing against a ghost from the 1970s.

  You are right that definition is not existence. You are right that the failure of one formalism doesn't kill the intuition. You are right that progress is not just vibes. Your flatmate is demanding a precision that science itself rarely possesses while pretending that "pragmatism" is a dirty word that disproves realism. It isn't.

  \answer{question well-posed: You are not coping, definition is not existence.}
