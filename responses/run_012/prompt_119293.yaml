      *   *User's Suspicion:* Portia's victory is *also* literalist (textualist). She beats Shylock at his own game. Therefore, the distinction isn't method (literal vs. purposive) but *selection of text* and *stopping point*.
      *   *Extension:* Apply this to the Casket subplot. Portia is bound by her father's will (text). Suitors fail because they read too much into it (purposively?) or misread the literal clues. Portia obeys the text but manipulates the context (song clues).

  3.  **Drafting - Section by Section:**

      *   **Introduction:** Acknowledge the standard equity vs. law reading but pivot immediately to the user's sharper insight. The play isn't about Mercy vs. Law, but about the weaponization of interpretation.

      *   **The Trial Scene (Confirming the Thesis):**
          *   Shylock is the initial textualist: "The bond is an bond." He refuses equitable construction (mercy).
          *   Portia initially agrees (upholding the bond's validity).
          *   The Turn: She doesn't switch to purposivism (arguing the *intent* was security, not murder). She stays textualist but reads *further* or *differently*. "Flesh" but no "blood."
          *   *Analysis:* This confirms the thesis. Both sides claim strict adherence to the text. The difference is the scope of the text (just the bond vs. the bond + Venetian criminal law). The discretion is in deciding which laws apply and when the text is exhausted.

      *   **The Casket Test (Testing/Complicating the Thesis):**
          *   Portia is bound by her dead father's will. She cannot amend it. This is a strict textual constraint.
          *   Suitors (Morocco, Arragon) fail. Why? They read the inscriptions purposively or arrogantly. They impose their own worth onto the text.
          *   Bassanio succeeds. Does he read literally? He warns himself against "outward show." He picks the lead casket.
          *   *Crucial Nuance:* Portia helps him. The song clues (rhyme with "lead").
          *   *Analysis:* Here, the text (the will) is rigid, but the *context* is manipulated. Portia obeys the letter of the will but violates its spirit (her father's intent to leave it to chance). This complicates the thesis: sometimes strict obedience requires contextual manipulation. It shows that "stopping points" are influenced by the interpreter's desire.

      *   **The Resolution (The Hard Truth):**
          *   The trial doesn't end with a clean legal principle.
          *   Shylock is broken not just by the "no blood" rule, but by the Alien Statute (confiscation) and the Duke's mercy (which is actually power).
          *   Forced conversion.
          *   *Assessment:* This is not jurisprudence; it is sovereignty. It is the exception that proves the rule. When interpretation fails to produce the desired political/social order, power steps in.
          *   *Argument vs. Power:* It is a display of power masquerading as legal argument. The "law" was just the trap; the state's prerogative is the hammer.

      *   **Conclusion (What the Play Knows):**
          *   Legal theory (textualism vs. purposivism) assumes a neutral framework where the goal is finding the "right" answer.
          *   The play knows interpretation is existential. It is about survival and identity.
          *   The "stopping point" isn't intellectual; it's political and theological.
          *   Interpretation is violence. To interpret is to cut (like the knife).
          *   The literature assumes the text survives interpretation. The play shows the interpreter (Shylock) is destroyed by it.

  4.  **Refining and Polishing:**
