      *   **Core Thesis to Test:** Literalism and purposivism are not rival methods but one technique of strictness aimed at different texts; the real discretion lies in *where* one stops reading.
      *   **Key Elements to Include:**
          *   The Trial Scene (Bond vs. Blood).
          *   The Casket Test/Will (Portia's father's text).
          *   The Resolution (Ducal prerogative, confiscation, forced conversion).
          *   Assessment: Is the ending an argument or a display of power?
          *   Conclusion: What the play knows about interpretation that legal theory assumes away.
      *   **Constraints:** No quotations needed. Be honest about the non-jurisprudential resolution.

  2.  **Deconstruct the Core Thesis:**
