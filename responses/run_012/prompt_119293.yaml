answer: |-
  Your suspicion offers a more dangerous reading of the play than the traditional equity-versus-law framework, and it holds up remarkably well under scrutiny. The standard pedagogical move is to cast Shylock as the rigid legalist and Portia as the agent of equitable mercy. However, if you strip away the rhetoric of quality of mercy, Portia's victory is not achieved by appealing to the spirit of the law over the letter, but by reading the letter more ruthlessly than Shylock did. She does not argue that the bond was unfair or that the intent was merely security; she argues that the text of the bond, read in conjunction with the text of Venetian criminal law, makes performance impossible.

  In this light, the trial scene confirms your thesis that textualism and purposivism are not opposing methodologies but rival claims about the boundary of the relevant text. Shylock's interpretive error is not that he is a literalist, but that he reads too narrowly. He isolates the bond as a self-contained universe. Portia wins by expanding the textual field. She agrees to the strictest possible reading of the bond—flesh is flesh—but insists that the bond cannot be read in isolation from the laws against shedding Christian blood. The discretion lies precisely in the stopping point. Shylock stops reading when he reaches the word "flesh." Portia stops reading only when she has incorporated the penal code. Both claim to be serving the law; the difference is that Portia controls the scope of the library. The play suggests that "strict construction" is a weapon available to anyone who can define the perimeter of the text, and the victor is the one who successfully dictates where the text ends and the context begins.

  The subplot of the caskets tests this thesis against a different kind of binding instrument: the dead-hand control of a will. Here, the play complicates the idea that strictness is solely a matter of verbal parsing. Portia is bound by her father's text; she cannot amend the will, nor can she choose her husband. The suitors fail because they treat the inscriptions as riddles to be solved through purposive reasoning about their own worth. They read the text as a reflection of their status. Bassanio succeeds, ostensibly by rejecting outward show, but the text hints that Portia manipulates the context through the song that rhymes with "lead."

  This creates a tension in your thesis. In the trial, Portia wins by hyper-literalism. In the casket test, she obeys the literal text of the will but subverts its intent (to leave the choice to chance) by manipulating the environment. This suggests that the "stopping point" of interpretation is not just about how much text you read, but about who controls the conditions of reading. The will is a fixed text, but Portia proves that a text can be strictly obeyed while its purpose is entirely hollowed out. The casket plot confirms that interpretation is not a neutral search for meaning but an act of will. The suitors impose their meaning on the text; Portia imposes the text on her suitors, while secretly guiding the outcome. Both the trial and the lottery demonstrate that the constraint of the text is an illusion maintained by the interpreter's power to frame it.

  However, the play resists the thesis that this is purely a debate about method. If the trial were a clean victory of one interpretive style over another, the scene would end when Shylock admits defeat on the flesh-and-blood point. It does not. The resolution spills over into the Alien Statute and the Duke's prerogative. Shylock is not merely defeated by the logic of the bond; he is crushed by a confiscation law aimed at his status as an alien and a threat to the state. The forfeiture of his estate and the forced conversion are not jurisprudential necessities derived from the bond's text. They are acts of sovereignty.

  This forces an honest admission: the ending is not an argument; it is a display of power. The legal reasoning in the trial is the trap, but the state's prerogative is the hammer. When interpretation fails to secure the social order the state desires, the state abandons interpretation for command. The shift from the bond dispute to the conversion decree reveals that the debate between textualism and purposivism is a luxury of the insider. For the outsider, the law is not a text to be interpreted but a force to be endured. Portia's interpretive virtuosity is permitted only because she serves the Venetian establishment. Shylock's literalism is punished because it threatens that establishment. The "stopping point" of reading is ultimately determined by political survival, not legal logic.

  This leads to what the play knows about interpretation that the literature on textualism and purposivism assumes away. Legal theory generally assumes that interpretation is a cognitive exercise aimed at discovering meaning or maintaining democratic legitimacy. It assumes the text survives the reading. *The Merchant of Venice* knows that interpretation is an existential act of violence. To interpret is to cut, just as Shylock's knife was meant to cut. The play understands that the authority to decide where the text stops is the authority to decide who belongs to the community and who is expelled from it.

  The literature assumes a stable interpreter operating within a stable system. The play shows that the system stabilizes itself by destroying the interpreter who reads it wrong. Shylock is not just legally wrong; he is interpreted out of existence. His identity is legally rewritten by the court. The play reveals that the ultimate stakes of the textualism–purposivism debate are not about fidelity to words, but about the monopoly on violence. The law is not a set of instructions to be decoded; it is a boundary line drawn by the sovereign, and interpretation is merely the process of enforcing that line. The play ends not with a correct reading, but with a silenced enemy.
