answer: |-
  You're not throwing a reductio at me; you're throwing a calculation, and I respect that. Most people wave away crop deaths because it's uncomfortable to think about the mice burning in the combine or the insects choked by pesticides, but I don't think you can wave it away. The suffering is real, the numbers are staggering, and if we're doing moral arithmetic, those lives have to go on the ledger. So I'm not going to tell you that you're wrong to notice that plowing a field for soy is a violent act. It is. The problem isn't that I'm ignoring the blood in the tofu; it's that your equation for the beef is missing variables that make the steak look even darker than the beans.

  The hidden premise you're relying on is that pasture is somehow a neutral space, or that a cow's life buys peace for the mice. It doesn't. Beef is astronomically land-inefficient compared to crops. To get the same calories from grass-fed beef, you need vastly more acreage than for tofu. That means more habitat maintained for wild animals. And here's where my negative utilitarianism bites hard: I don't think a wild mouse's life is a gift we're depriving it of by plowing the field. I think it's a net negative of suffering—predation, starvation, disease, exposure. By switching to beef, you're advocating for *more* land use, which means *more* wild animals born into suffering lives, not just fewer killed in harvest. Plus, most cattle aren't grass-fed; they're finished on grain, so you're paying for the crop deaths *and* the cow's death. The math doesn't save the steak.
