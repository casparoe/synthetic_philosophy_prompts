answer: |-
  In a corporate hiring market, applicants seek a role requiring managerial competence, a hidden trait observed by an HR Director. Applicants voluntarily purchase a prestigious "Leadership Certificate" for \$10,000, a sum equally burdensome to both competent and incompetent candidates given their similar access to credit. The certification exam is standardized such that effort required to pass is identical regardless of underlying competence, leading both types to buy the certificate because the salary premium justifies the fee. The HR Director sees the certificate and infers high competence, treating the expense as proof of commitment and quality, despite the fact that the pooling behavior renders the certificate statistically uninformative regarding the hidden trait.

  In the same hiring market, applicants instead provide a link to a verified, immutable project ledger where completed tasks are automatically logged by client software. High-competence managers naturally complete complex tasks rapidly, generating dense ledger entries as a physical by-product of their work without any extra expenditure to display the record. Low-competence managers cannot generate these entries because they physically cannot complete the tasks required to trigger the log, regardless of their willingness to pay. The HR Director sees the dense ledger and infers high competence, an inference warranted because the observable is an unfakeable index of the trait rather than a purchased signal.

  **Analysis**

  In Scenario 1, the observer sees the certificate and infers competence, but the inference is unwarranted because the cost structure creates a pooling equilibrium where the signal correlates with liquidity, not trait. In Scenario 2, the observer sees the ledger and infers competence, which is warranted because the signal is physically constrained by the trait itself. The single structural variable separating the cases is the sensitivity of cost to sender type: in Scenario 1, the marginal cost of signaling is identical for all types, whereas in Scenario 2, the cost for low types is effectively infinite (impossibility). In the first scenario, the feature doing the work is absolute expense, which fails to sort; in the second, it is physical constraint, which succeeds. If we perturb the first scenario so the certificate requires study time that is disproportionately exhausting for low-competence types, the cost falls more heavily on them; the signal becomes informative because low types drop out when their specific marginal cost exceeds the benefit. If we perturb the second scenario to make the ledger entries fakeable, the observable stops being an index; if faking requires expenditure, it becomes a costly signal, but if faking is cheap, it merely becomes noise. The precise condition under which a costly signal can be expected to carry honest information is that the marginal cost of signaling must decrease as the hidden trait increases (the Single Crossing Property), ensuring $\frac{\partial^2 Cost}{\partial Signal \partial Type} < 0$. A committed defender of the strong claim might argue Scenario 1 is not a "signal" by definition because it fails to separate, but this is an unfalsifiable retreat that defines honesty into the term rather than explaining it via cost structure.

  Verdict: Honesty depends on differential marginal costs across types, not absolute signal expense.
