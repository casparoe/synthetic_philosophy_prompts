answer: |-
  Pull up a chair and let's pour something, because this is one of those questions that looks simple on the surface but gets wonderfully sticky the moment you try to untangle it. You've hit on the exact tension that made Neurath such a fascinating figure, this ambitious drive to democratize knowledge through visuals paired with a stubborn humility about what those visuals could actually achieve. To understand why he insisted ISOTYPE wasn't a language, you have to look past the graphics themselves and think about what language actually does versus what a picture does. At its core, the difference isn't about clarity or beauty; it's about the difference between showing a scene and making a claim. When you look at a photograph of a man smoking a pipe, you see a man and a pipe, but the image itself doesn't tell you that the man exists, or that he is smoking, or that this happened yesterday. It just presents those elements together. Language, on the other hand, is built for assertion. When I say "the man is smoking," I am committing to a truth value; I am saying something about the world that can be true or false. A picture just sits there. It shows possibilities, but it doesn't inherently select one as fact without some external anchor, usually words, to frame it.

  This becomes painfully obvious when you try to handle the logical machinery that language takes for granted, like negation, conditionals, or generality. Think about negation first. If I want to say "there are no cats in this room," I can show you a picture of an empty room, but that could mean anything—no dogs, no people, no furniture. To specify "no cats," I have to draw a cat and then cancel it out, maybe with a red cross. But here's the rub: that red cross isn't a picture of nothing; it's a symbol. It's a convention you have to learn. You are no longer relying on the natural resemblance of the image to the object; you are relying on a code. Neurath realized that every time you add a convention to make a picture do logical work, you are drifting away from pure depiction and toward symbolism. You can keep adding these conventions, sure. You can say a dashed line means "potential" and a solid line means "actual," or an arrow means "causes." But every time you add a rule like that, you are essentially building a syntax, and you are asking the viewer to learn a grammar. At a certain point, if you have enough arbitrary rules governing how symbols combine to create meaning, you haven't made a universal picture language; you've just built a weird, visual version of written Chinese or logical notation, which defeats the whole purpose of immediate, language-free understanding.

  Then there is the problem of generality. A picture is almost always specific. If you draw a worker holding a tool, you are showing one worker. If you want to say "all workers earn wages," how do you draw that? Do you draw a million workers? Do you draw one worker with a halo of universality? Neither works naturally. Language handles abstraction effortlessly because words like "all" or "some" are purely functional; they don't look like what they mean. Pictures struggle to escape the concrete. You can show a trend line going up, which implies growth, but to say "if production continues to rise, wages will fall" requires a conditional structure that pictures don't naturally possess. A picture shows a state of affairs, not a relationship between hypothetical states. You could try to animate it, showing the rise and then the fall, but even then, the "if" is missing. The viewer sees sequence, not logical entailment. To get the entailment, you need a caption or a legend to tell them what the sequence implies.

  So, to your point about closing the gap with conventions, it really does feel like a hydra where cutting off one head grows two more. If you introduce a symbol for negation, you have to define its scope. Does the cross cancel out just the object next to it, or the whole scene? In language, parentheses and syntax tell us the scope of a negation. In a picture, spatial proximity is ambiguous. You end up needing rules to explain the rules, and suddenly you're back to needing text to explain the visuals, which is exactly what Neurath admitted. He saw ISOTYPE as a transformation of knowledge, not a replacement for language. He wanted to take complex statistical data and transform it into a visual form that was easier to grasp, but he knew the visual form couldn't stand alone as a complete logical system. It needed the scaffolding of words to tell you what you were looking at and what claim was being made about it.

  Finally, you ask if this was just a limit of 1930s printing technology, and I'm convinced it wasn't. We have infinitely better technology now. We have interactive dashboards, animated infographics, virtual reality. We can make pictures move and react. But even with all that pixel power, the fundamental semiotic problem remains. A high-resolution VR simulation of a factory can show you how the machines work, but it can't tell you whether the factory is profitable or whether the workers are exploited without some symbolic overlay—numbers, text, color codes that you have to learn. The limit isn't resolution or motion; it's the difference between iconic representation and symbolic proposition. Pictures are fantastic at showing structure, quantity, and comparison, which is why ISOTYPE was so successful for statistics. But they are terrible at making arguments or stating laws. Neurath's concession wasn't a failure of imagination or technology; it was a genuine insight into the nature of communication. He understood that pictures engage our perception directly, bypassing the linear processing of reading, but that bypass comes at the cost of logical precision. He wasn't disappointed that ISOTYPE wasn't a language; he was relieved, because if it had tried to be a full language, it would have lost the very immediacy that made it useful. It's better to have a helper that clarifies the words than a rival that tries to do their job and fails.
