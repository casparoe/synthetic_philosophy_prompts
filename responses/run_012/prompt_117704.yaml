answer: |-
  This is an excellent question. You have identified the central philosophical tension in mechanistic interpretability. Your advisor is pressing you because without a clear criterion for "mechanism identity," the concept of "mechanistic anomaly" is ill-defined. If you cannot say when a mechanism is the *same*, you cannot say when it is *different*, and thus you cannot detect anomalies.

  The short answer is: **Your question is not confused, but it assumes there is a single "true" granularity of mechanisms existing in the model independent of your goals. There isn't.**

  However, that does not mean "anything goes." For your specific project (Mechanistic Anomaly Detection), one of your criteria is objectively better than the others, and your friend's suggestion about "purpose" is correct but needs to be unpacked to avoid circularity.

  Here is a conceptual breakdown of why the criteria come apart, why "Causal Role" is the correct choice for your project, and exactly how "purpose" settles the definition.

  ### 1. Why the Three Criteria Come Apart

  To see why these criteria diverge, we need to distinguish between three layers of description in a computational system:

  1.  **Substrate (Your Criterion 1):** The specific physical or digital components (weights, specific attention heads, neurons).
  2.  **Algorithm (Your Criterion 2):** The abstract logical procedure (e.g., "grade-school addition").
  3.  **Causal Implementation (Your Criterion 3):** The specific pathway of information flow that realizes the algorithm in the substrate.

  **Criterion 1 (Substrate) is too brittle.**
  Neural networks are distributed and high-dimensional. If you define a mechanism by the exact set of weights or heads involved, then *every single input* invokes a slightly different mechanism because the activation values are different. Even on the training distribution, no two inputs use the "exact same" mechanism. If you adopt this definition, your anomaly detector will flag everything as anomalous. It has zero recall.

  **Criterion 2 (Algorithm) is too coarse.**
  This defines the mechanism by its input-output behavior or its abstract logical name. In your addition example, the model is doing "addition" in both cases. If you define mechanism by algorithm, there is no anomaly.
  However, this defeats the purpose of *mechanistic* anomaly detection. The whole point of MAD is to catch cases where the output looks normal but the *reason* for the output has changed, because a change in reason implies a change in generalization boundaries. A lookup table for numbers 1–100 and a carry-propagation circuit both implement "addition" for small numbers, but they are different mechanisms with different risks. If you use Criterion 2, you cannot distinguish between robust understanding and memorization.

  **Criterion 3 (Causal Role) is the middle ground.**
  This focuses on *how* the information is transformed and routed, regardless of the specific weights (Criterion 1) or the final label of the task (Criterion 2). It asks: "Is the information flowing through the same causal bottlenecks? Is it being represented in the same internal basis?"

  ### 2. The Verdict on Your Addition Case

  In your specific example (Heads A+B vs. Heads C+D), this is **not the same mechanism** under Criterion 3, and for the purposes of anomaly detection, **it should be flagged as an anomaly.**

  Here is why:
  You trained the model on a distribution $D_{train}$. You formed a hypothesis: "The model solves addition using Circuit X." You verified this via ablation.
  Now you present input $x_{new}$. The output is correct. But Circuit X is idle; Circuit Y is active.

  If you claim this is the "same mechanism," you are claiming that the model's internal logic is invariant to the shift from $D_{train}$ to $x_{new}$. But the ablation proves the internal logic *is not* invariant. The model has switched strategies.

  **Why does this matter for safety?**
  Because Circuit Y has not been vetted. You verified Circuit X on the training distribution. You have no idea what Circuit Y does on *other* out-of-distribution inputs. Perhaps Circuit Y works for leading zeros but fails on negative numbers, or fails on base-8 arithmetic. By switching circuits, the model has stepped outside the boundary of the behavior you verified.

  Therefore, for Mechanistic Anomaly Detection, a shift in causal pathway is an anomaly, even if the output is correct. This is often called a **"mechanistic distribution shift."**

  ### 3. Addressing the "Circularity" of Purpose

  Your friend suggested that a mechanism is an equivalence class of computations under the interventions we care about. You worried this is circular ("sameness depends on what we care about").

  It is not circular; it is **teleological** (goal-directed).

  Think of a map. Is a subway map the "true" map of a city? Is a topographic map the "true" map? Neither. They are abstractions tailored to specific purposes.
  *   If your purpose is navigating trains, the subway map is the correct abstraction.
  *   If your purpose is hiking, the subway map is useless.

  The "purpose" does the work of selecting the **resolution** and the **relevant features** of the mechanism.

  In your project, the purpose is **Safety/Robustness**.
  *   **Goal:** We want to guarantee that the model behaves predictably on new inputs.
  *   **Requirement:** To guarantee predictability, we need to know that the *process* generating the output is stable.
  *   **Definition of Mechanism:** Therefore, a "mechanism" is defined as *the set of causal pathways that remain invariant across the distribution we claim to understand.*

  If the pathway changes, our guarantee is broken. Thus, "purpose" settles the definition by dictating that **invariance of causal pathway** is the necessary condition for identity.

  If your purpose were merely **Compression** (e.g., "describe this model in as few words as possible"), you might prefer Criterion 2 (Algorithm). You would say, "It's just an adder," and ignore the circuit switch. That is a valid scientific description for a different goal. But for *Anomaly Detection*, Criterion 2 is dangerous because it hides the switch.

  ### 4. How to Frame This in Your Project

  Since you cannot rely on existing literature to define this for you, you must define it operationally in your write-up. Here is a suggested framing that avoids the philosophical trap while remaining rigorous:

  **1. Define Mechanism via Causal Abstraction.**
  State that you are not looking for "the true mechanism" (which may not exist), but rather a **Causal Model** of the network. A mechanism is a hypothesis about which internal variables causally mediate the input-output relationship.

  **2. Define Identity via Interventional Invariance.**
  Two episodes are instances of the same mechanism if the *same causal hypothesis* holds for both.
  *   *Test:* If I ablate components $C$ hypothesized to be critical, performance drops on both inputs.
  *   *Your Case:* On training data, ablating Heads A+B hurts. On new data, it does not. Therefore, the causal hypothesis "Heads A+B are critical" is false for the new data. The mechanism has changed.

  **3. Justify via Generalization Risk.**
  Explicitly argue why Criterion 3 wins for your project:
  > "We prioritize Causal Role over Abstract Algorithm because our goal is to detect shifts in generalization behavior. A change in causal pathway implies that the model is relying on features or circuits that were not optimized or verified on the training distribution. Even if the current output is correct, the change in mechanism indicates a fragility that constitutes an anomaly for safety-critical deployment."

  ### 5. Summary Advice

  Your advisor is asking you to define your **unit of analysis**.
  *   If you choose **Weights/Heads**, you are doing hardware debugging.
  *   If you choose **Input/Output Function**, you are doing behavioral testing.
  *   If you choose **Causal Pathways**, you are doing Mechanistic Interpretability.

  You are doing the third one.

  **The Answer to your specific question:**
  In your addition case, the model is using a **different mechanism**. It is an anomaly. The fact that the output is correct is a "false negative" for behavioral detection, which is exactly why you are doing mechanistic detection. The switch indicates the model has not learned a single robust algorithm, but rather a bag of heuristics (one for standard inputs, one for leading zeros). This is a safety risk.

  **Final check on the "Circularity":**
  Tell your advisor: "The definition of mechanism is relative to the **interventional set** we use to verify it. Since our goal is anomaly detection, our intervention set is 'ablations of the training-distribution circuit.' Sameness is defined as invariance to those ablations. This is not circular; it anchors the definition to the verification method."

  This approach is conceptually sound, avoids the need for journal citations, and directly addresses the safety motivation of your project.
