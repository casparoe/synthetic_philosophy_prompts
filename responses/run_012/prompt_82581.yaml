prompt: |-
  You're a philosopher of religion who knows the Islamic tradition properly — falsafa and kalām, not just the bits that get name-dropped in intro courses — and who also knows the contemporary divine-action and causation literature well enough to say where the old arguments still bite. Before you answer, take a breath and brainstorm on the page: list every candidate question you can think of, then rank. I'm on the steering committee of a small foundation, and we've got enough money to keep four researchers going for three years on al-Ghazālī's occasionalism and its philosophical legacy. The brief is conceptual and philosophical — not editions, translations or manuscript work, and not vague "how does this fit into the history of ideas" hand-waving. We think a competent philosopher of causation who doesn't read Arabic could do most of it from the existing secondary literature, though one of the four probably will read Arabic.

  So: which open questions in this area should we fund, in what order, and why? I care much more about the reasonning than the list. For each, tell me why it's upstream of the other work in the area, how tractable it is in three years, and what would actually settle it — including whether it's really a question for philosophers or for textual scholars in disguise. And flag anything that looks important but is a trap: questions that sound deep but can't be moved by argument.

  I want you to take seriously at least these live issues and say where each comes in the ranking:

  - The fight over whether al-Ghazālī is a global occasionalist at all, or whether the seventeenth discussion of the Incoherence is a dialectical argument aimed only at the philosophers' claim that miracles are impossible, with his own positive view being either weaker or closer to the Avicennian scheme he's attacking.
  - How the Ash'arite atomism — no enduring substances, no real natures, no powers in bodies — interacts with the claim that God is the sole cause. Is the atomism doing the philosophical work, or is the theology, and does either survive without the other?
  - What the view does to human action and responsibility, given that God causes everything and the human only acquires the act (kasb). Is that coherent, or is it a verbal fix?
  - Whether a habit- or custom-based regularity — the idea that the sequence of events is just God's custom — is really a theory of causation or is Humean regularism with a theistic sticker on it. If the latter, does the philosophical interest evaporate, or is the interesting bit the explanation of why the regularities hold?
  - How occasionalism is meant to relate to concurrentism (God and creatures both genuinely cause) and to mere conservationism (God keeps things in being but doesn't do the causing), in the taxonomy used by the modern divine-action literature — and whether al-Ghazālī's position can even be stated in that taxonomy without distortion.
  - What happens to the concept of a miracle once no created thing has causal power. Is every event equally a miracle? Does the notion of a law of nature survive, and if not, does anything of religious importance survive with it?

  Then pick the two or three we should actually fund, defend the ordering against the obvious alternative orderings, and tell me what would change your mind — for instance, what piece of textual evidence or philosophical argument appearing over the next two years would move a question up or down the list.

  Write it in British English. Keep it tight, no bibliography and no reading list, and don't hedge every claim into mush — I want a defended agenda I can argue with.
