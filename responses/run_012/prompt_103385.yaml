answer: |-
  Dan leans across the table, eyes gleaming with that dangerous sort of certainty. "It's Tails. SIA proves it. I'm a trillion times more likely to exist in that world. I don't need to look at the coin."

  "Right," I say. "So why offer even odds? If you're that sure, you should be betting the house."

  He huffs. "Well, there's still a chance I'm the single copy."

  "So you're SSA when you're nervous, and SIA when you're arrogant?"

  He reaches for the bill. "I'm covering it," he says.

  "Why?" I ask. "If there's a trillion of you, surely they can chip in?"

  "Don't be daft," he says. "They're not in this room."

  I raise my glass. "Cheers. Neither is your evidence for the coin."
