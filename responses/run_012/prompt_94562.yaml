prompt: |-
  I am a doctoral candidate in the philosophy of law, and I have been trying to state a version of legal moralism that is precise enough to be argued with rather than merely rejected by slogan. The version I want to defend runs roughly as follows. Criminalisation requires wrongdoing, but the wrongdoing need not consist in harm to any determinate person. Among the wrongs that can justify prohibition is the erosion of what I call the moral environment: the background of shared norms, expectations, and dispositions on which individuals depend if they are to form and sustain the commitments that give their lives shape. I treat that environment as a public good with the structure of an environmental public good — non-excludable benefits, diffuse and cumulative degradation, thresholds below which the good collapses, and high costs of repair once it has. On this view a person who acts against the environment wrongs others even where no one is made worse off in any way a harm-based account can register, because the wrong consists in a change in what it is reasonable for everyone else to expect: a shift in the default rather than an injury to a victim. The position is a descendant of the one Devlin defended in his critique of the Wolfenden Report and that Hart contested, though I want to rest it on the structure of the good in question rather than on an argument about social disintegration or on the sentiments of the ordinary person.

  What I want is a map of its exposure. What would count against it? Please rank the defeaters by how decisive they would be, separating those that would show the view false, those that would show it redundant (that everything it licenses is already licensed by a plausible harm principle), those that would show it unjust or dangerous, and those that would show it unfalsifiable. I am especially interested in what a committed defender of this kind of view would concede as counting against it, as opposed to what critics assert from outside. I would also like to know what the view predicts that its harm-based rivals do not, and what the world would have to look like — which comparisons across jurisdictions, which trends in trust or in the incidence of the relevant practices, which natural experiments — for the erosion claim to be disconfirmed rather than merely restated.

  Two further matters. First, the view is plainly most exposed where it distinguishes enforcing a morality from enforcing a majority's preferences; I want to know whether that distinction can be sustained once the account is stated this precisely, or whether the moral environment simply is whatever the majority presently wishes preserved. Second, tell me whether the difficulty of specifying what would refute the view is a defect peculiar to legal moralism or a feature of any account that treats diffuse social goods as proper objects of criminal protection — and if it is a defect, whether it is fatal.

  For what it is worth, a bare restatement of the harm principle would not move me, since that is the point in dispute. What would move me is a demonstration that the moral-environment apparatus does no work a harm-based account cannot do.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User:** Doctoral candidate in philosophy of law.
      *   **Task:** Critique/Map the exposure of a specific version of Legal Moralism (LM).
      *   **The Theory:** Criminalization requires wrongdoing, but not harm to a determinate person. Wrongdoing includes eroding the "moral environment" (shared norms/expectations enabling commitment formation). This environment is a *public good* (non-excludable, cumulative degradation, thresholds, high repair costs). Wrongdoing is a shift in reasonable expectations (default), not necessarily injury. Descendant of Devlin, but grounded in the structure of the good, not social disintegration or majority sentiment.
      *   **Specific Requests:**
          1.  Map of exposure (defeaters ranked by decisiveness: False, Redundant, Unjust/Dangerous, Unfalsifiable).
          2.  Focus on what a *committed defender* would concede vs. external critics.
          3.  Predictive differences vs. harm-based rivals.
          4.  Empirical conditions for disconfirmation (comparisons, trends, natural experiments).
          5.  Distinction between enforcing morality vs. majority preferences (can it be sustained?).
          6.  Is the difficulty of refutation peculiar to LM or common to diffuse social goods accounts? Is it fatal?
      *   **Constraint:** Do not simply restate the Harm Principle (HP). Show that the moral-environment apparatus does *no work* HP cannot do.

  2.  **Deconstruct the Theory:**
      *   *Core Claim:* Criminalization $\leftarrow$ Wrongdoing.
      *   *Wrongdoing:* Includes erosion of "Moral Environment" (ME).
      *   *ME Structure:* Public Good (non-excludable, threshold, cumulative).
      *   *Mechanism:* Shift in defaults/expectations, not direct harm.
      *   *Goal:* Protect conditions for forming/sustaining commitments.

  3.  **Brainstorming Defeaters (Categorization):**

      *   *False (Internal Incoherence/Conceptual Failure):*
          *   Is "wrongdoing" without "harm" coherent? If the ME is necessary for commitments, isn't damaging it a harm?
          *   The "Public Good" analogy: Is morality actually non-excludable? Can opt-out communities exist?
          *   Threshold problem: How do we know where the threshold is?

      *   *Redundant (Does no work vs. Harm Principle):*
          *   If ME erosion leads to inability to form commitments, isn't that a *harm* to individuals (autonomy/well-being)?
          *   Feinberg's "Harm to Others" might cover this via "setback to interests."
          *   If the theory relies on empirical claims about social stability, HP (long-term) covers it.

      *   *Unjust/Dangerous (Normative/Political):*
          *   Who defines the ME? Risk of majoritarian tyranny (Devlin's problem resurfacing).
          *   Stifling moral progress (abolitionists eroded the pro-slavery ME).
          *   Over-criminalization of private conduct.

      *   *Unfalsifiable (Methodological):*
          *   "Erosion" is hard to measure.
          *   Any social change can be framed as erosion or improvement.
          *   Thresholds are invisible until crossed (post-hoc rationalization).

  4.  **Addressing Specific Questions:**

      *   *Morality vs. Majority:* This is the classic Devlin/Hart battleground. If ME is defined by "shared norms," isn't that just majority preference? To avoid this, the candidate needs an *objective* account of which norms are constitutive of agency/commitment, not just *any* norms.
      *   *Falsifiability/Diffuse Goods:* Is this unique to LM? No, environmental law deals with diffuse goods (climate, biodiversity). The defect isn't unique, but the *measurement* is harder for morality than CO2 levels.
      *   *Predictive Differences:* HP says "No victim, no crime." LM says "Victimless crime possible if ME damaged." We need cases where HP permits but LM forbids (e.g., consensual incest, drug use, prostitution) *and* where empirical data shows ME erosion without direct harm.

  5.  **Drafting the Response (Iterative Refinement):**

      *   *Tone:* Academic, rigorous, respectful of the doctoral level. Avoid introductory fluff.
      *   *Structure:* Follow the user's requested structure (Defeaters, Predictions/Empirics, Morality vs. Majority, Falsifiability/Diffuse Goods).

      *   *Refining the "Redundancy" Argument:* This is the strongest philosophical challenge. If the ME is necessary for *commitments*, and commitments are necessary for *autonomy/well-being*, then damaging ME damages autonomy/well-being. That sounds like a Harm Principle argument (Feinbergian). The LM defender must argue that the *wrong* is prior to the *harm*. The wrong is the violation of the normative order, not the setback to interest. *Critique:* If there is no setback to interest, why does it matter? If there *is* a setback, why isn't it harm?
      *   *Refining the "Majority" Argument:* The candidate claims to avoid Devlin's "ordinary man" test. They need a theory of *which* norms are constitutive. If they can't specify this independently of actual social practice, it collapses into majoritarianism.
      *   *Refining Empirics:* What would disconfirm it? If jurisdictions legalize X (e.g., gay marriage, drugs) and trust/commitment metrics *rise* or stay stable, the "erosion" claim is weakened. But the LM defender might say "wait for the threshold." This leads to the unfalsifiability charge.

  6.  **Developing the Ranking of Defeaters:**
      1.  *Redundancy (The "Harm in Disguise" Objection):* Most decisive philosophically. If ME erosion harms interests, HP covers it. If it doesn't, why criminalize?
      2.  *The Majoritarian Collapse:* Most decisive politically. If ME = Majority Preference, it's illiberal.
      3.  *The Progress Objection (Unjust):* Moral reformers look like criminals.
      4.  *Unfalsifiability:* Methodological weakness.

  7.  **Addressing the "Diffuse Goods" Question:**
      *   Compare to Environmental Law. We criminalize pollution even without immediate determinate victim. Why is that okay but moral pollution not?
      *   Difference: Physical metrics vs. Normative metrics. CO2 is measurable; "normative erosion" is interpretive.
      *   Verdict: Not fatal per se, but requires robust metrics to avoid arbitrariness.

  8.  **Final Review against Constraints:**
      *   Did I avoid restating HP? Yes, focused on whether ME adds *value* over HP.
      *   Did I address the "committed defender" perspective? Yes, acknowledged where they would dig in vs. concede.
      *   Did I cover the empirical/disconfirmation aspect? Yes, specific metrics suggested.

  9.  **Polishing:** Ensure precise terminology (e.g., "constitutive norms," "setback to interests," "public good characteristics"). Ensure the distinction between *wrongdoing* and *harm* is central. (Self-Correction: Make sure to emphasize that the user's theory relies on *wrongdoing* as the trigger, not harm. The critique must show that without harm, the wrongdoing claim is untenable or redundant.)

  10. **Final Output Generation** (Proceed to generate response based on these thoughts).
answer: |-
  This is a sophisticated reconstruction of legal moralism. By shifting the ground from Devlin's "disintegration thesis" (society will fall apart) or "conservative sentiment" (the ordinary man is outraged) to the *structural properties of a public good* (the moral environment), you have insulated the view against Hart's most famous objections. You have effectively turned the "moral environment" into a resource akin to clean air or stable currency.

  However, this structural move exposes the view to a different set of vulnerabilities, primarily concerning measurement, redundancy, and the definition of the good itself. Below is a map of the exposure, ranked by decisiveness, followed by the empirical and conceptual specificities you requested.

  ### I. Map of Defeaters (Ranked by Decisiveness)

  This ranking distinguishes between objections that destroy the theory's internal coherence, those that absorb it into a rival framework, and those that highlight its political risks.

  #### 1. The Redundancy Defeater (The "Harm in Disguise" Objection)
  **Status:** *Most Decisive (Philosophically)*
  **The Charge:** The apparatus does no work the Harm Principle (HP) cannot do.
  **The Argument:** You claim the moral environment (ME) is a condition for individuals to "form and sustain commitments that give their lives shape." If the ME is a necessary condition for autonomy, well-being, or agency, then eroding it *is* harming others. It sets back their interests in living a coherent life.
  *   **If you concede this:** Your view collapses into a long-term, indirect version of the Harm Principle (akin to Feinberg's accumulation of trivial harms or Mill's "perceptible hurt"). You lose the distinctiveness of legal moralism.
  *   **If you deny this:** You must explain why criminalizing an act is justified when it does not setback any interest. If the ME is damaged but no one's capacity for commitment is actually impaired (because the threshold hasn't been crossed), on what grounds does the state intervene? If the grounds are "it is wrong," the critic asks: "Wrong *because* it risks harm?" If yes, see above. If no, the view looks like pure paternalism or perfectionism disguised as public good protection.
  **Concession Point:** A committed defender must concede that *some* correlation between ME erosion and individual interest-setback is necessary to justify the *severity* of criminal sanction, even if the *right* to punish stems from the wrong itself.

  #### 2. The Majoritarian Collapse (The "Definition" Objection)
  **Status:** *Decisive (Politically/Conceptually)*
  **The Charge:** The distinction between "enforcing morality" and "enforcing majority preference" cannot be sustained.
  **The Argument:** You define the ME as "shared norms, expectations, and dispositions." In a democracy, the only operational metric for "shared" is majority endorsement.
  *   **The Trap:** If you define the ME objectively (e.g., "norms required for rational agency"), you are no longer doing descriptive sociology; you are doing substantive moral philosophy. But if you do that, why call it the *moral environment*? Why not just call it "Justice"?
  *   **The Devlin Resurgence:** If you define it descriptively (what people actually expect), then any shift in majority preference looks like ME erosion. When the majority opposed interracial marriage, that norm was part of the ME. Abolishing it "eroded" that environment. Your theory risks criminalizing moral progress because progress *by definition* disrupts existing normative expectations.
  **Concession Point:** A defender must concede that not all "shared norms" are protective of the ME. They need a filter (e.g., "norms conducive to trust") that is independent of current popularity. If they cannot specify that filter without circularity, the view collapses into majoritarianism.

  #### 3. The Threshold Indeterminacy (The "Unfalsifiable" Objection)
  **Status:** *High Risk (Methodologically)*
  **The Charge:** The "threshold below which the good collapses" is invisible until crossed.
  **The Argument:** Environmental public goods (like climate) have measurable metrics (ppm of CO2). The ME has no metric. Consequently, any prohibition can be justified by claiming "we are approaching the threshold," but no legalization can be justified because "we haven't hit it yet." This makes the theory immune to empirical disconfirmation.
  **Concession Point:** A defender must concede that without proxy metrics for normative health, the theory is heuristic, not predictive.

  #### 4. The Asymmetry of Repair (The "Unjust" Objection)
  **Status:** *Significant (Normatively)*
  **The Charge:** The theory underestimates the cost of *preservation* vs. *repair*.
  **The Argument:** You note high costs of repair. But criminalization itself damages the ME (by creating resentment, stigma, and distrust in law). If the ME relies on "trust," criminalizing consensual conduct often *lowers* trust in the legal system among subcultures. The cure may be more erosive than the disease.
  **Concession Point:** A defender must concede a proportionality constraint: Criminalization is only permitted if the act of enforcement does not itself erode the ME more than the conduct does.

  ---

  ### II. Morality vs. Majority: Can the Distinction Be Sustained?

  You asked whether the distinction holds once stated precisely. The answer is: **Only if you decouple "Shared Norms" from "Current Consensus."**

  Devlin failed because he equated the moral fabric with the feelings of the "man on the Clapham omnibus." To succeed, your version must treat the ME not as *what people currently believe*, but as *the normative infrastructure required for cooperative agency*.

  *   **The Sustainable Distinction:** The ME consists of *constitutive norms* (e.g., "promises should be kept," "violence is not a dispute resolution mechanism") rather than *conventional norms* (e.g., "marriage is between a man and a woman").
  *   **The Vulnerability:** The moment you make this move, you are no longer relying on the *environment* to justify the law; you are relying on the *truth of the norm*. If the norm is true/required for agency, why do we need the "environment" concept at all? Why not just say "This act violates the Categorical Imperative"?
  *   **Verdict:** The distinction is sustainable only if you treat the ME as a **sociological buffer** for moral truths. That is, even if a norm is morally good, it cannot sustain agency unless it is *socially embedded*. Thus, you are not criminalizing the majority's preference; you are criminalizing the *destabilization of the embedding*.
  *   **The Cost:** This makes the view vulnerable to the "Moral Progress" objection. If the embedding is racist, stabilizing it preserves the ME but violates justice. You must admit that **Justice trumps the ME.** If Justice requires eroding the current ME (e.g., ending segregation), your theory must permit it. This limits the theory's scope significantly: it can only protect *just* or *neutral* norms, which brings you back to needing an independent theory of justice.

  ---

  ### III. Predictive Differences and Empirical Disconfirmation

  You asked what the world would have to look like for the erosion claim to be disconfirmed. A harm-based rival predicts that victimless crimes do not require state intervention. Your view predicts that victimless crimes *can* require intervention if they degrade the ME.

  **1. Predictive Divergence:**
  *   **Harm Principle:** Legalizing consensual incest, drug use, or prostitution should have no negative impact on social trust or commitment-formation *absent direct harm to third parties*.
  *   **Moral Environment:** Legalizing these should correlate with a measurable decline in the stability of related institutions (family cohesion, labor market reliability, interpersonal trust), even if no direct victim is identified.

  **2. Conditions for Disconfirmation (Natural Experiments):**
  To disconfirm your view (not merely restate it), you would need to identify jurisdictions that underwent liberalization of "victimless" moral offenses and measure the specific public good metrics.
  *   **The Comparison:** Compare Jurisdiction A (prohibits X, e.g., recreational drug use) with Jurisdiction B (legalized X 20 years ago).
  *   **The Metrics:** You cannot measure "morality." You must measure the *functional outputs* of the ME:
      *   **Generalized Trust:** World Values Survey data on "Most people can be trusted."
      *   **Contractual Reliability:** Rates of breach of contract outside formal legal enforcement.
      *   **Commitment Stability:** Divorce rates, long-term employment tenure, debt repayment rates.
      *   **Social Capital:** Putnam-style metrics on civic association membership.
  *   **The Disconfirmation:** If Jurisdiction B (liberalized) shows **stable or increasing** metrics on trust and commitment compared to Jurisdiction A, your "erosion" claim is empirically weakened.
  *   **The "Threshold" Defense:** A defender will argue, "Jurisdiction B hasn't hit the threshold yet." To counter this, you need a **tipping point analysis**. If 50 jurisdictions liberalize and none show collapse, the claim that the ME is a "threshold good" becomes untenable. It suggests the ME is more resilient or adaptable than the theory posits.

  **3. The "Harm in Disguise" Test:**
  If, upon liberalization, trust *does* drop, the Harm Principle defender will argue: "See, it causes harm (loss of trust)."
  *   **Your Counter:** You must show that the *wrong* precedes the *harm*.
  *   **Empirical Requirement:** You would need to show that the *act itself* is wrongful even in a context where the ME is robust enough to absorb it without collapsing. If the act is only wrongful *because* it risks collapse, you are back to a risk-based Harm Principle. To maintain Legal Moralism, you must argue the act is a *free ride* on the normative infrastructure, which is unjust regardless of whether the infrastructure collapses.

  ---

  ### IV. Falsifiability and Diffuse Social Goods

  You asked whether the difficulty of specifying refutation is peculiar to legal moralism or a feature of any account treating diffuse social goods as objects of criminal protection.

  **1. It is not peculiar to Legal Moralism.**
  Environmental criminal law faces the exact same structure:
  *   **Good:** Biodiversity/Climate Stability.
  *   **Wrong:** Pollution/Extraction.
  *   **Harm:** Often diffuse, cumulative, and threshold-based (tipping points).
  *   **Victim:** Often non-human or future generations (no determinate person).

  We accept criminalization for environmental damage without a determinate human victim because we accept **scientific metrics** (CO2 levels, species extinction rates) as proxies for the degradation of the good.

  **2. Is the Defect Fatal?**
  The defect is fatal **only if** the moral environment lacks analogous metrics.
  *   **Environmental Law:** We know what CO2 is. We can measure it.
  *   **Legal Moralism:** We do not have a "Moral CO2 Meter."
  *   **The Fix:** If you can identify **proxy indicators** for the health of the Moral Environment (e.g., levels of generalized trust, suicide rates, family stability, correlation between promise-keeping and economic activity), the view becomes falsifiable.
  *   **The Danger:** If the only metric for "ME erosion" is "the passage of the law prohibiting the act," the theory is tautological. The law exists because the ME is eroded; we know the ME is eroded because the law exists.
  *   **Verdict:** It is not fatal *in principle*, but it is fatal *in practice* unless you commit to a sociological program that identifies independent variables for normative health. If you cannot do this, the view remains a "just-so story" used to rationalize intuitions.

  ### V. Summary of Advice for the Defense

  To make this view arguable rather than rejectable, you must make three specific concessions that narrow its scope but increase its resilience:

  1.  **Concede Redundancy in High-Harm Cases:** Admit that where direct harm exists, the ME argument is unnecessary. Reserve the ME argument strictly for "hard cases" (e.g., consensual incest, extreme drug use) where harm is contested.
  2.  **Adopt Independent Metrics:** Commit to the claim that ME health is measurable *independently* of criminal law (e.g., via social trust indices). If the metrics don't move, the justification for criminalization fails.
  3.  **The "Justice Constraint":** Explicitly state that the ME is only protected insofar as its norms are compatible with fundamental justice. This saves you from the "enforcing majority prejudice" objection but admits that your theory is not a *complete* theory of criminalization, but a *supplement* to a theory of justice.

  **The Strongest Argument Against You:**
  The most decisive argument you will face is not that you are wrong about the *existence* of the Moral Environment, but that **criminal law is a blunt instrument that erodes the very environment it seeks to protect.** If the ME relies on "shared dispositions," coercing those dispositions via punishment may convert genuine normative commitment into mere compliance, thereby hollowing out the ME. A committed defender must explain why criminal prohibition sustains the norm rather than merely suppressing its violation. If prohibition turns a moral norm into a legal command, the "moral" environment becomes a "legal" environment, and the good you seek to protect ceases to exist.
