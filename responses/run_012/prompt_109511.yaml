prompt: |-
  I teach high-school biology, and I also read a lot of pop-science stuff in the evenings, and for the last couple of years something about the way people talk about genes has been bugging me and I can't find a name for it, which makes it hard to argue with anyone about it.

  Here's what I keep noticing. Instance one: height. In any given rich country, if you do the twin studies, height comes out as something like 80% genetic, and that's how people say it — 'height is mostly genetic'. But the average height in those same countries went up a good bit over the last century or so; my grandma was tiny and my students are giants. Everyone agrees that was food and disease and general living conditions, not genes. So the same trait is mostly genetic and also clearly shifted a lot when the world around it changed. Instance two: a colleague told me that if you compare kids in places where pretty much everyone gets decent food and schooling against kids in places where some do and some really don't, the 'genetic' percentage comes out higher in the more equal places. I might be mangling what she said, but if it's right it's the opposite of what I'd have guessed, since you'd think a level playing field would make the environment matter less, not the genes. And she added that if you made everyone's environment exactly identical, the genetic share would go to 100% — not because genes got stronger but because there'd be nothing left for them to differ against. I don't know if that's a deep point or a trick with words.

  So what I want to know is: is there a name for this? Not for the number itself — I know the word heritability, that's not what I'm after — but for the thing that happens when a number that's really about the spread of differences within one particular group of people at one particular time gets picked up and used as a fact about the trait itself, or about what can't be changed. And is there a name for the flip I described, where making environments more alike makes a trait look more genetic? If neither has a name, then tell me which of the existing ideas comes closest and where each one falls short of what I'm describing — the name isn't really the point. I want to be able to say exactly what the mistake is, and also when it isn't a mistake, because surely there are cases where a high heritability really does tell you that changing the environment won't do much. And please don't give me a reading list, I just want the idea.
reasoning: |-
  Here's a thinking process that leads to the suggested answer:

  1.  **Analyze the User's Request:**
      *   **Who:** High-school biology teacher, reads pop-science.
      *   **Problem:** Frustrated by how people misuse/misunderstand gene statistics (specifically heritability) in pop-science discourse.
      *   **Specific Observations:**
          1.  Height is "80% genetic" (within a population), *but* average height increased over time due to environment (nutrition, etc.).
          2.  Heritability estimates are *higher* in equal environments (where environmental variance is low) and would be 100% if environments were identical.
      *   **What they want:**
          1.  A name for the mistake of treating a population-specific variance statistic as a fixed trait property or a limit on change.
          2.  A name for the phenomenon where reducing environmental variance increases heritability estimates.
          3.  If no specific names exist, explain the concepts clearly, identify where existing ideas fall short, and clarify when high heritability *does* imply resistance to environmental change (and when it doesn't).
          4.  **Constraint:** No reading lists. Just the idea.

  2.  **Deconstruct the Scientific Concepts:**
      *   **Concept 1: Heritability ($h^2$).** It's the proportion of *phenotypic variance* in a *specific population* at a *specific time* attributable to *genetic variance*. Formula: $V_P = V_G + V_E + V_{GxE}$. $h^2 = V_G / V_P$.
      *   **Observation 1 (Height Secular Trend):** $V_G$ might be high, but if $V_E$ changes (mean shift), the mean phenotype changes. Heritability says nothing about *means*, only *variance*.
      *   **Observation 2 (Equal Environments):** If $V_E$ decreases (environments become more alike), $V_P$ decreases. Since $V_G$ stays roughly the same, the ratio $V_G / V_P$ increases. Thus, heritability goes up.
      *   **The Mistake:** Reification of heritability. Treating a statistic about *difference* as a statistic about *determination* or *immutability*.
      *   **The "Flip":** This is a mathematical property of the heritability ratio.

  3.  **Identify Terminology:**
      *   *Is there a specific name for the mistake?*
          *   "The Heritability Fallacy" (Common, but sometimes refers to something slightly different).
          *   "Reification of Heritability" (Accurate).
          *   "The Heritability Misconception" (Generic).
          *   "Confusing Variance with Mean" (Descriptive).
          *   **Best Fit:** **"The Heritability Fallacy"** is the most common colloquial term, but technically, philosophers of biology often call it **"Reifying Heritability"** or confusing **"Within-Group vs. Between-Group"** variance (though the user's example is more about Time/Means).
          *   Actually, the specific error of assuming high heritability means a trait can't be changed environmentally is often called **"The Fallacy of Immutability"** or simply **"The Heritability Fallacy."**
          *   There is a classic distinction: **Variance vs. Development.**
      *   *Is there a specific name for the "Flip"?*
          *   This is the **"Variance Partitioning"** property.
          *   It's often discussed under **"The Dependence of Heritability on Environmental Variance."**
          *   Lewontin's ANOVA framework covers this.
          *   There isn't a catchy single-word name like "The Flip," but it's the core definition of heritability as a ratio.

  4.  **Synthesize the Explanation:**
      *   **Acknowledge the intuition:** The user is absolutely right. This is a classic and pervasive confusion.
      *   **Name the Mistake:** The most precise term is **"Reifying Heritability"** (treating a statistic as a physical property). However, in teaching contexts, it's often called **"The Heritability Fallacy"** (specifically the belief that high $h^2$ implies environmental invariance).
      *   **Name the "Flip":** This doesn't have a catchy name, but it is the **"Denominator Effect"** in variance partitioning. It's best explained by the formula $h^2 = V_G / (V_G + V_E)$.
      *   **Address the "When is it not a mistake?" part:** High heritability *does* predict resistance to change *if* the environmental range remains constant. It predicts response to selection (breeding). It does *not* predict response to novel environments.

  5.  **Drafting the Response (Iterative refinement):**

      *   *Drafting Part 1 (The Name):* The specific error is treating a population statistic as an intrinsic property. The term **"Reification of Heritability"** is the academic term. The colloquial term is **"The Heritability Fallacy."** I should explain *why* it's a fallacy (Variance vs. Mean).
      *   *Drafting Part 2 (The Flip):* Explain the math simply. $V_G / (V_G + V_E)$. If $V_E$ shrinks, the fraction grows. This is often called the **"dependence of heritability on environmental variance."**
      *   *Drafting Part 3 (The Nuance):* When *does* it matter? If you are breeding cows, high heritability means selection works. If you are trying to fix a deficiency (like iodine for IQ), high heritability doesn't stop you.
      *   *Refining the Tone:* The user is a teacher. Keep it clear, authoritative, but conversational. Avoid jargon where possible, or define it immediately. No reading lists.

      *   *Self-Correction on "The Heritability Fallacy":* Sometimes "The Heritability Fallacy" refers specifically to inferring between-group differences from within-group heritability (Lewontin's point). The user is asking about within-group heritability being used to claim immutability. I need to be precise. The error is **"Conflating Heritability with Inevitability."**
      *   *Better Term:* **"The Fixity Fallacy"**? No, that's not standard.
      *   *Best approach:* Give the standard term ("The Heritability Fallacy") but qualify it immediately, as definitions vary. Focus on the conceptual distinction: **Variance vs. Development.**

      *   *Wait, is there a better term?* Richard Lewontin's ANOVA critique. The distinction between **"Variance Explained"** vs. **"Causal Determination."**
      *   Let's stick with **"Reification of Heritability"** as the formal name for the error, and **"The Heritability Fallacy"** as the common label.
      *   For the "flip," it's simply the mathematical definition of heritability as a **ratio of variances.**

  6.  **Finalizing the Structure:**
      1.  Validate the user (You are right, this is a huge problem).
      2.  Name the mistake: **Reification of Heritability** (or The Heritability Fallacy). Explain the Variance vs. Mean distinction.
      3.  Name the "flip": It's the **Denominator Effect** (informal) or simply the definition of heritability as a **proportion of variance.** Explain the $V_E$ reduction.
      4.  Address the "When is it useful?" question. Breeding vs. Intervention.
      5.  Summary sentence for the classroom.

  7.  **Review against constraints:**
      *   No reading list? Check.
      *   Name the mistake? Check.
      *   Name the flip? Check (or explain lack thereof).
      *   Explain when it's not a mistake? Check.

      *(Self-Correction during drafting)*: I need to make sure I don't get bogged down in the "Between-Group" vs "Within-Group" debate (Lewontin's fallacy) unless it helps. The user's example is about *time* (secular trend) and *environmental variance*. I should focus on **Variance vs. Mean** and **Variance vs. Causality.**

      *Key Insight:* The user's colleague is describing the fundamental definition of heritability. If $V_E = 0$, $h^2 = 1$. This isn't a trick; it's the definition. The mistake is thinking $h^2 = 1$ means "genes caused this." It means "genes *differentiated* this."

      *Final Plan:*
      1.  The Mistake: **Reification of Heritability** (treating a ratio as a cause).
      2.  The Mechanism: **Variance Partitioning** (The math of the flip).
