answer: |-
  You have put your finger on the single most persistent misunderstanding in behavioral genetics. You are right to be annoyed; pop-science (and even some textbooks) routinely treat a statistical description of a specific population as a biological law about a trait.

  Here are the names and concepts you are looking for.

  ### 1. The Name of the Mistake
  The formal philosophical term for the error you described is **The Reification of Heritability**.

  To "reify" something is to treat an abstract concept as if it were a concrete, physical thing. Heritability is not a physical property of a trait like "melting point" or "atomic weight." It is a descriptive statistic about a specific population at a specific time. When people say "height is 80% genetic," they are reifying that statistic into a claim about the *cause* of the trait, rather than the *cause of the differences* in the trait.

  In teaching contexts, this is often simply called **The Heritability Fallacy**. However, because that term is sometimes used for a different error (inferring between-group differences from within-group data), it is more precise to call it **Conflating Variance with Development**.

  *   **Variance:** Why am I taller than my classmate? (Mostly genes, in a rich country).
  *   **Development:** Why am I taller than my grandmother? (Mostly environment/nutrition).

  The mistake is assuming that because genes explain the *variance* (the differences between people), they must explain the *development* (the existence of the trait or its average level). They don't.

  ### 2. The Name of the "Flip"
  There isn't a catchy single-word name for the phenomenon your colleague described, but in quantitative genetics, it is referred to as **The Dependence of Heritability on Environmental Variance.**

  It is not a trick of words; it is a mathematical necessity based on the formula for heritability ($h^2$).
  $$h^2 = \frac{V_G}{V_G + V_E}$$
  *(Heritability = Genetic Variance divided by Total Variance)*

  Total Variance is the sum of Genetic Variance ($V_G$) and Environmental Variance ($V_E$).

  *   **The Flip:** If you make environments more equal, you shrink $V_E$.
  *   **The Result:** The denominator ($V_G + V_E$) gets smaller, while the numerator ($V_G$) stays the same.
  *   **The Outcome:** The fraction ($h^2$) gets bigger.

  If you make everyone's environment *identical*, $V_E$ becomes zero. The formula becomes $V_G / V_G$, which equals 1 (or 100%).

  This is why heritability is highest in wealthy, egalitarian societies (where everyone gets decent nutrition and healthcare) and lower in unequal societies (where environmental differences are huge). In an unequal society, your height is heavily determined by whether you starved as a child (high $V_E$). In an equal society, everyone is well-fed, so the remaining differences are mostly down to genes (high $V_G$ relative to $V_E$).

  ### 3. When is High Heritability Actually Useful?
  You asked when it *isn't* a mistake to use these numbers. High heritability is predictive in two specific scenarios, and useless in a third.

  **Scenario A: Selective Breeding (Useful)**
  If you are a farmer wanting taller cows, high heritability tells you that selecting the tallest cows to breed will result in taller offspring. Because the differences between the cows are largely genetic, selecting for the difference works. This is called **Response to Selection**.

  **Scenario B: Predicting Differences in a Stable Environment (Useful)**
  If you know the environment won't change, high heritability allows you to predict individual outcomes based on genetics (e.g., polygenic risk scores). It tells you who will be taller *relative to each other*.

  **Scenario C: Environmental Intervention (Useless)**
  This is where the pop-science gets it wrong. High heritability **does not** predict resistance to environmental change.
  *   **Example:** Phenylketonuria (PKU) is a genetic disorder that causes intellectual disability. It is 100% heritable (it's entirely genetic).
  *   **Intervention:** If you change the environment (remove phenylalanine from the diet), the disability is completely prevented.
  *   **Lesson:** A trait can be 100% genetic in origin and 100% fixable by environment.

  ### Summary for Your Classroom
  If you need a shorthand to give your students to cut through the noise, use this distinction:

  **Heritability explains the *spread*, not the *level*.**

  *   It tells you why people in a room are different heights (the spread).
  *   It tells you nothing about why the whole room is taller than a room from 1920 (the level).

  When someone says, "It's highly heritable, so we can't change it," you can now identify that as **The Reification of Heritability**. They are mistaking a measure of *difference* for a measure of *destiny*.
