  My own credence in your mate's generalized claim is **0.35**.

  Here is the decomposition. I have dropped your fourth point (whether it's just a fancy restatement of finite limits) because that concerns the *value* of the claim rather than its *truth*, and I have added a prerequisite regarding formal consistency, without which the theorem cannot even get off the ground.

  | Sub-question | Credence | Justification |
  | :--- | :--- | :--- |
  | **1. Do real-world systems meet the strict consistency requirement?** | 0.20 | Legal and organisational codes tolerate contradictions resolved by meta-rules, not logical consistency. |
  | **2. Can the system be fully formalised as an effective procedure?** | 0.40 | Natural language interpretation relies on human judgement, not algorithmic derivation. |
  | **3. Does the system encode sufficient arithmetic for self-reference?** | 0.60 | Complex regulations can encode number theory, though rarely with the precision required for Gödelian arithmetisation. |
  | **4. Is the undecidable sentence a genuine normative truth?** | 0.30 | Legal 'truth' is institutional and validated by authority, not a platonic fact independent of derivation. |

  **How they combine:**
  I treat these as multiplicative constraints on the strict validity of the analogy; using the geometric mean of these four figures yields approximately 0.35, reflecting that weakness in any single pillar significantly undermines the whole argument.

  **Who is furthest off:**
  Between you and your mate, **your mate is furthest off**. His 0.95 credence assumes a level of formal rigour in social systems that simply does not exist, whereas your 0.6 acknowledges the analogy has some bite without swallowing it whole. (Though notably, your third friend at 0.15 is actually closer to my estimate than you are).

  **Where the disagreement lives:**
  The disagreement most likely lives on **Sub-question 1 (Consistency)** and **Sub-question 2 (Formalisation)**. Your mate is treating legal codes as if they were formal logic systems, whereas you and I see them as messy human artefacts that resist such clean modelling.

  **My sensitivity:**
  My own number is most sensitive to **Sub-question 4 (Normative Truth)**. If it could be shown that legal validity exists independently of institutional recognition (a realist view of law) rather than being constituted by it, the 'true but unprovable' analogy would gain significant traction, moving my credence towards 0.6.
