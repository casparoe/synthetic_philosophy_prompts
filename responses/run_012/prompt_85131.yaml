answer: |-
  # Session Plan: The Problem of Logical Omniscience
  **Duration:** 90 Minutes
  **Audience:** Philosophy Graduates (Fluent in Kripke Semantics, New to Epistemic Logic)

  ## I. Sequence and Dependencies (0–25 Minutes)

  **Order of Operations:**
  1.  **Define the Operator Semantically:** Introduce $K$ strictly via the Kripke truth clause ($M, w \models K\phi$ iff $\forall v(wRv \to M, v \models \phi)$). Do not mention axioms yet.
  2.  **Derive the Problem:** Prove that on this semantics, if $\phi \models \psi$, then $K\phi \to K\psi$ is valid. Prove that all validities are known ($K\top$).
  3.  **Identify the Source:** Explicitly state that this is not an added axiom (like **T** or **4**); it is a structural consequence of quantifying over *all* accessible worlds where logical truth is preserved.

  **Defending the Dependencies:**
  *   **Semantics before Axioms:** If you start with the axioms of **S5** (e.g., $K(\phi \to \psi) \to (K\phi \to K\psi)$), students will treat Logical Omniscience (LO) as a *premise* someone chose to add. You must show it is a *theorem* of the standard semantics. The problem is not that we assumed agents are omniscient; it's that the standard tool for modeling knowledge (possible worlds) *forces* omniscience by treating propositions as sets of worlds.
  *   **Derivation before Example:** Do not motivate the problem with intuition alone (e.g., "Humans aren't gods"). Students trained in logic will dismiss intuition as vague. You must first demonstrate that the formalism *entails* the counter-intuitive result. The example serves to confirm the formal derivation, not to motivate it.

  **Misconception Check (Minute 20):**
  *   **Head Off:** *"It's just an idealization to be patched with a cost function."*
  *   **Intervention:** Stop the derivation. Ask: "If I add a cost function to the accessibility relation, does $\phi \models \psi$ still hold in every accessible world?" (Yes). "Then the closure still holds." Cost functions explain *why* we don't infer, but they do not fix the *semantic definition* of knowledge which says you know whatever is true in those worlds.

  ---

  ## II. The Carrying Example (25–50 Minutes)

  **The Example:** **The "Unpossessed Logical Constant."**
  *   **Scenario:** An agent, Alice, is competent with atomic facts and negation. She knows $p$ ("The switch is on").
  *   **Logical Consequence:** $p \lor q$ ("The switch is on OR the neutrino has mass").
  *   **The Gap:** Alice lacks the concept of *disjunction* ($\lor$) or the concept *neutrino* ($q$). She cannot entertain the proposition $p \lor q$.
  *   **Why this Example:**
      1.  **Rejects "Fermat's Last Theorem":** I explicitly reject the standard "Knows Peano Axioms $\to$ Knows FLT" example. It reduces LO to *computational complexity*. Students will think the solution is simply "bounded rationality." That misses the structural point about *propositions*.
      2.  **Rejects "Rain/Rain or Snow":** The standard "It is raining $\to$ It is raining or snowing" is too trivial. It suggests the failure is merely attentional.
      3.  **Justification:** The "Unpossessed Constant" isolates the **Concept Possession** failure from the **Inference** failure. It shows that even if inference were free, Alice *cannot* know $p \lor q$ because she lacks the representational capacity to grasp the proposition. This forces the group to see that standard semantics assumes a fixed, maximal set of propositions available to all agents.

  **The Core Framing: Inference vs. Concepts**
  *   **Judgement:** You asked for my judgment on treating **Concept Possession** as the core phenomenon. **I agree.**
  *   **Reasoning:** Failure of inference is a performance error (she has the capacity, didn't use it). Failure of concept possession is a competence error (she lacks the capacity). Standard possible-worlds semantics assumes all agents share the same set of possible worlds (propositions). This assumption erases the concept possession problem entirely. Therefore, the *structural* flaw in the semantics is its handling of concepts, not inference.
  *   **Instruction:** Use the example to toggle between the two failures.
      *   *Toggle 1 (Inference):* Alice has the concept $\lor$, but the formula is 100 pages long. (Standard LO).
      *   *Toggle 2 (Concepts):* Alice has the formula, but lacks the concept $\lor$. (Deep LO).
      *   **Directive:** Treat Toggle 2 as the core. If we fix concepts, we still have closure. If we fix inference, we still have closure. The semantics breaks because it identifies *knowledge* with *truth in all accessible worlds*, regardless of whether the agent can represent those worlds.

  **Misconception Check (Minute 40):**
  *   **Head Off:** *"It concerns omniscience over contingent facts."*
  *   **Intervention:** Remind them: $p \lor q$ follows from $p$ *logically*. The ignorance is not about whether the neutrino has mass (empirical); it is about whether the *disjunction* follows (logical).
  *   **Head Off:** *"Dropping closure is the obvious fix."*
  *   **Intervention:** Ask: "If we drop closure, what are we modeling?" If $K$ doesn't close under consequence, it's not a modal operator on propositions in the standard sense. We aren't 'fixing' the logic; we are changing the subject.

  ---

  ## III. Mapping Repairs to the Distinction (50–75 Minutes)

  Introduce repairs *only* after the distinction is clear. Map each repair to the specific failure it addresses.

  1.  **Awareness Restrictions (Fagin & Halpern):**
      *   **Target:** **Concept Possession.**
      *   **Mechanism:** Add an awareness set $A(w)$. $K\phi$ is true only if $\phi \in A(w)$ AND $\phi$ is true in all accessible worlds.
      *   **Critique:** It solves the representation problem but **relocates** the problem. Now we must explain what determines $A(w)$. It treats awareness as a primitive parameter rather than deriving it.
      *   **Misconception Head Off:** *"An awareness parameter solves the problem."* (Minute 60). No, it formalizes the problem. It tells us *where* the closure fails, not *why*.

  2.  **Impossible Worlds (Rantala, Hintikka):**
      *   **Target:** **Inference Failure.**
      *   **Mechanism:** Allow accessible worlds where logical laws fail (e.g., $p$ is true, $p \lor q$ is false).
      *   **Critique:** It models the *failure* of inference, but at the cost of logical coherence. It addresses the "Long Tautology" issue (Toggle 1) better than the Concept issue.
      *   **Misconception Head Off:** *"Impossible worlds are an ad hoc device."* (Minute 65). Defend them as a way to granularize propositions. Two sentences can be true in the same possible worlds but differ in impossible worlds. This restores hyperintensionality.

  3.  **Procedural/Algorithmic Knowledge:**
      *   **Target:** **Inference Failure.**
      *   **Mechanism:** Knowledge is the output of a specific algorithm, not a static set of worlds.
      *   **Critique:** This abandons possible-worlds semantics entirely. It is a different formalism, not a repair.

  4.  **Relevance-Sensitive Consequence:**
      *   **Target:** **Concept Possession / Connection.**
      *   **Mechanism:** $\psi$ must be relevant to $\phi$ (share variables/concepts).
      *   **Critique:** Blocks $p \to (p \lor q)$ if $q$ is irrelevant. Addresses the "Unpossessed Disjunct" directly.

  **Sequence:** Introduce Awareness first (easiest modification of semantics), then Impossible Worlds (modifies the ontology of worlds), then Procedural (changes the definition of knowledge).

  **Misconception Check (Minute 70):**
  *   **Head Off:** *"It is the same as the problem of assigning credences to logical claims."*
  *   **Intervention:** This session is about binary knowledge ($K$), not credences ($P$). Bayesian agents also face logical omniscience (credence 1 in all tautologies). The structural issue is identical, but the formal tools differ. Do not conflate them now.

  ---

  ## IV. Final Question and Exclusions (75–90 Minutes)

  **The Final Question (Last 10 Minutes):**
  Do not ask them to define LO. Ask them to diagnose a model.
  > **"Construct a Kripke model where an agent knows $\phi$, $\phi$ logically entails $\psi$, but the agent does not know $\psi$. To do this, which specific clause in the truth definition of $K$ must you violate, and what does that violation imply about the nature of 'possible worlds' in your model?"**

  *   **Why this question:** It forces them to acknowledge that you cannot solve LO within standard Kripke semantics without breaking the truth definition of $K$ or the definition of a world. It tests if they understand that LO is a *feature* of the semantics, not a bug in the axioms.

  **Explicit Exclusions (Say This Out Loud):**
  1.  **Dynamic Epistemic Logic (DEL):** "We are not covering how knowledge *updates*. DEL solves omniscience by making knowledge an event, but that requires a temporal dimension we don't have time for."
  2.  **Doxastic Logic Nuances:** "We are treating $K$ as a modal operator. We are not debating factivity ($K\phi \to \phi$). The problem arises even for Belief ($B$), so we will not get bogged down in whether knowledge must be true."
  3.  **Bayesian Epistemology:** "We are not discussing credences. The problem exists for binary belief too. Do not try to solve this by saying 'agents have low confidence.'"

  **Closing Instruction:**
  End by reiterating that Logical Omniscience is not a problem to be "solved" so much as a boundary marker. It tells us where Possible Worlds Semantics stops being a model of *psychology* and starts being a model of *information*. If they leave understanding that distinction, the session succeeded.
