  5.  **Running the Cases:**
      *   *Case 1 (70% Confident Colleague):* This is second-hand uncertain evidence.
          *   Procedure: Don't update on "H is true." Update on "Colleague said 70%."
          *   Result: Weak update.
      *   *Case 2 (Leaked Draft):* Unknown provenance.
