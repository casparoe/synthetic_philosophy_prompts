          *   *Unwelcome Result:* The procedure might demand a shift that feels too radical or too conservative depending on the reliability assessment. I need to make sure one case shows the procedure *failing* to give comfort. Let's make the "Leaked Draft" case return a result that says "Ignore it," which might be frustrating if the leak is actually true. Or, make the "70% confident" case result in a *smaller* shift than they want. Let's go with the Preprint case: The procedure might dictate a small update because p-values are noisy signals, but the committee feels it should be large. Or better: The procedure reveals that the "70% confident" report is actually *less* informative than they thought, effectively diluting their consensus.
