      *   *Jeffrey Conditionalization:* Updates on a partition where probabilities shift but aren't 1. Requires knowing the *new* probability of the evidence proposition. Problem: Committee members report *their* confidence, not the objective likelihood of the evidence.
      *   *Uncertain Evidence (Probability Kinematics):* We need to distinguish between "The data says X" (Evidence) and "I believe the data says X" (Report).
      *   *The "Feel" Averaging Problem:* Linear pooling of probabilities *after* individual updates is generally incoherent if the information sets differ. It's better to aggregate the *evidence* (likelihoods) then update a shared prior, OR agree on a collective update rule. Given the user says "nothing we learn arrives as a clean fact," we are dealing with *uncertain evidence*.
      *   *The "Noisy Signal" Approach:* Treat the report itself as the evidence. $P(H | \text{Member says "70%"})$. This requires assessing the reliability of the member/source.
