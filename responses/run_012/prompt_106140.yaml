answer: |-
  ### Part 1: Theoretical Brainstorm & Design Choices

  You are correct that averaging individual credences after private updates is incoherent. It violates the *Irrelevance of Independent Information* principle: if two members see the same data, averaging their posteriors counts the data twice. If they see different data, averaging ignores the specific likelihood structure of each.

  To fix this within a 20-minute window, we cannot perform full Supra-Bayesian aggregation (where the Chair collects every member's likelihood function and computes a global posterior). That is computationally and cognitively impossible for your committee. Instead, we must approximate **Jeffrey Conditionalization** (updating on uncertain evidence) while enforcing **Source De-duplication**.

  Here is the theoretical landscape:

  1.  **The Evidence Proposition:** Standard conditioning requires learning $E$ with certainty ($P_{new}(E)=1$). Your committee never has this. You have reports $R$ about $E$. Theoretically, you must condition on $R$, not $E$.
      *   *Requirement:* We must distinguish the state of the world from the report about the state.
  2.  **The Rigidity Condition:** Jeffrey conditionalization requires that the conditional probabilities $P(H|E)$ remain stable during the update.
      *   *Constraint:* The committee must agree on how much a specific piece of evidence *would* move the needle if it were certain, before assessing how certain the evidence is.
  3.  **Likelihood vs. Credence:** Members report "I am 70% confident." This is a posterior credence ($P(H|Info)$). To aggregate properly, we need the likelihood ($P(Info|H)$).
      *   *Choice:* We cannot elicit likelihoods from non-specialists in 20 minutes. We will smuggle in a heuristic: we will treat "confidence" as a **Signal Strength** and discount it by a **Reliability Factor**.
  4.  **Double Counting:** If Member A and Member B both read the same dataset, $P(R_A \cap R_B | H) \neq P(R_A|H) \times P(R_B|H)$. They are correlated.
      *   *Requirement:* We must tag evidence by *source*, not by *reporter*.

  **The Design Compromise:**
  We will not ask the committee to calculate posteriors. We will ask them to calculate **Weights of Evidence**. The Chair will maintain the "Committee Credence" (the official number passed to the ministry). The committee's job is not to vote on the probability, but to vote on the *reliability of the new signal*. This shifts the task from "What do you believe?" (which varies by prior) to "How much trust do we place in this channel?" (which can be more objective).

  ---

  ### Part 2: The Protocol for Uncertain Evidence (PUE)

  **Role of the Chair:** You are the keeper of the "Committee Credence" ($P_{comm}$). You do not vote on the probability. You facilitate the assessment of the *input*.

  **Step 1: Provenance & De-duplication (2 Minutes)**
  *   **Question:** "Is this report derived from a data source we have already accounted for in our current $P_{comm}$?"
  *   **Sufficient Answer:** "Yes, this is a re-analysis of Dataset X from Month Y" OR "No, this is entirely new data/observation."
  *   **Action:** If **Yes**, discard the item as new evidence. You may discuss the re-analysis, but you cannot update the probability unless the *method* of analysis was previously unknown and judged flawed. If **No**, proceed.
  *   **Theory Constraint:** Prevents double-counting correlated signals.
  *   **Convenience:** Treats "Dataset" as a binary tag. In reality, datasets overlap partially. We ignore partial overlaps for speed.

  **Step 2: Proposition Fixing (3 Minutes)**
  *   **Question:** "If this report were perfectly accurate and true, exactly which proposition $E$ would be established?"
  *   **Sufficient Answer:** A binary or partitioned claim (e.g., "Transmission rate $R > 1$"). Vague statements ("Things look worse") are rejected.
  *   **Action:** Write $E$ on the board.
  *   **Theory Constraint:** Jeffrey conditionalization requires a fixed partition. You cannot update on "vibes."
  *   **Convenience:** We force complex data into a binary $E/\neg E$ for the sake of the meeting. This loses information but enables the calculation.

  **Step 3: Reliability Calibration (10 Minutes)**
  *   **Question:** "We are not asking if $E$ is true. We are asking: How likely is this *report* to appear if $E$ is true, versus if $E$ is false?"
  *   **Sufficient Answer:** A "Signal Weight" ($W$) from 0.0 to 1.0.
      *   $W = 1.0$: The report could only exist if $E$ is true. (Perfect signal).
      *   $W = 0.5$: The report is equally likely regardless of $E$. (Noise).
      *   $W = 0.0$: The report implies $\neg E$.
  *   **Input Handling:**
      *   *If input is "Colleague is 70% confident":* The Signal Weight is not 0.7. It is the reliability of the *colleague's calibration*. If the colleague is known to be overconfident, $W$ might be 0.4.
      *   *If input is a p-value:* Do not treat $1-p$ as the weight. Treat the study design quality as the weight.
  *   **Action:** Members vote on $W$. Take the median.
  *   **Theory Constraint:** This approximates the Likelihood Ratio. $W > 0.5$ pushes probability up; $W < 0.5$ pushes it down.
  *   **Convenience:** We are replacing the Likelihood Ratio $\frac{P(R|E)}{P(R|\neg E)}$ with a linear weight $W$. This is mathematically imprecise but cognitively manageable.

  **Step 4: The Update Rule (5 Minutes)**
  *   **Question:** "Given our current $P_{comm}$ and the agreed Weight $W$, what is the new $P_{comm}$?"
  *   **Action:** The Chair applies the update formula (provided below) or uses a lookup table.
  *   **Stopping Rule (Values vs. Epistemology):** If members disagree on $W$ because they disagree on the *cost* of being wrong (e.g., "We must weight this heavily because a false negative kills people"), **stop**.
      *   **Declaration:** "This is no longer an epistemic disagreement. This is a disagreement about loss functions. We will record the range of $W$ and pass the range to the Ministry."
      *   **Theory Constraint:** Probability theory cannot resolve disputes about values.
      *   **Convenience:** We assume the Ministry wants a single number. If the range is too wide, we pass the range.

  **The Update Formula (For the Chair):**
  Do not average credences. Update the Committee Credence ($P_{old}$) using the Weight ($W$) as a proxy for the probability of the evidence $P(E)$.
  $$P_{new} = P_{old} \times W + (1 - P_{old}) \times (1 - W)$$
  *(Gloss: This is a simplified Jeffrey step. If $W=1$ (certainty), $P_{new}$ becomes 1. If $W=0.5$ (noise), $P_{new}$ stays $P_{old}$.)*

  **Warning:** This formula is a **convenience**. It assumes symmetry in error. It is not strict Bayes. It is a "drag-and-drop" update that prevents wild swings from weak evidence.

  ---

  ### Part 3: Running the Procedure on Three Cases

  #### Case 1: The "70% Confident" Colleague
  **Scenario:** A member reports that a trusted colleague, who has run an unpublished analysis, is "about 70% confident" that the infection fatality rate (IFR) is higher than current estimates.
  **Current $P_{comm}$:** 0.40 (40% chance IFR is higher).

  1.  **Provenance:** New analysis. (Pass)
  2.  **Proposition:** $E$ = "IFR is higher than current estimate." (Pass)
  3.  **Reliability:**
      *   *Member Input:* "The colleague says 70%."
      *   *Chair Intervention:* "The colleague's confidence is not our weight. How reliable is the colleague's calibration? Do they usually say 70% when they are right?"
      *   *Committee Consensus:* "They are brilliant but optimistic. When they say 70%, they are right about 60% of the time."
      *   *Agreed Weight ($W$):* 0.60. (Not 0.70).
  4.  **Update:**
      *   $P_{new} = 0.40 \times 0.60 + 0.60 \times 0.40$
      *   $P_{new} = 0.24 + 0.24 = 0.48$.
      *   **Result:** The probability shifts from 40% to 48%.
      *   **Note:** If you had simply averaged the member's credence (assuming they updated to 0.70), you might have jumped to 0.55 or higher. The protocol dampens the shift because it treats the report as a noisy signal, not a fact.

  #### Case 2: The Leaked Draft (The Unwelcome Result)
  **Scenario:** A draft report is leaked to the press. It claims a new variant bypasses immunity. It is unsigned. You cannot verify the authors or the data. The Ministry asks if you are updating your risk assessment.
  **Current $P_{comm}$:** 0.20 (20% chance of immune escape).

  1.  **Provenance:** Unknown. (Pass, technically new).
  2.  **Proposition:** $E$ = "New variant bypasses immunity." (Pass).
  3.  **Reliability:**
      *   *Chair Question:* "How likely is this document to appear if $E$ is true, versus if $E$ is false?"
      *   *Committee Discussion:* "It could be a deliberate disinformation campaign ($\neg E$). It could be a genuine draft ($E$). It could be a draft that was rejected for errors ($\neg E$)."
      *   *Consensus:* "We have no way to distinguish a true leak from a false flag. The signal is indistinguishable from noise."
      *   *Agreed Weight ($W$):* 0.50.
  4.  **Update:**
      *   $P_{new} = 0.20 \times 0.50 + 0.80 \times 0.50$
      *   $P_{new} = 0.10 + 0.40 = 0.50$? **Wait.**
      *   *Correction on Formula:* If $W=0.5$ (pure noise), the update should yield $P_{old}$.
      *   *Re-calculation:* $P_{new} = P_{old} \times W + (1-P_{old}) \times (1-W)$ is actually symmetric around 0.5 only if $P_{old}=0.5$.
      *   *Let's use the strict Jeffrey interpretation for this case:* If $P(E)$ is set to 0.5 (we don't know if the evidence is true), and the link between $E$ and $H$ is unknown, **no update occurs**.
      *   *Protocol Adjustment for Case 2:* If $W$ cannot be distinguished from 0.5, **$P_{new} = P_{old}$**.
      *   **Result:** The Committee Credence remains at 0.20.
      *   **Why you won't like this:** The Ministry will be furious. There is a plausible risk in the wild, and you are formally ignoring it.
      *   **The Hard Truth:** The procedure correctly identifies that you have *zero* new evidence, only *noise*. Updating on noise is incoherent. You must tell the Ministry: "Epistemically, this changes nothing. Prudentially, you may wish to act, but do not cite our probability estimate as justification."

  #### Case 3: The Contradicting Preprint
  **Scenario:** A preprint appears on a server. It is a small study ($N=50$). It reports a p-value of 0.04 for a result that contradicts your current estimate (e.g., "Treatment has no effect"). Your current $P_{comm}$ is 0.80 (80% chance Treatment *has* an effect).
  **Current $P_{comm}$:** 0.80.

  1.  **Provenance:** New data. (Pass).
  2.  **Proposition:** $E$ = "Treatment has no effect." (Pass).
  3.  **Reliability:**
      *   *Member Input:* "It's peer-reviewed... wait, no, it's a preprint. But p < 0.05."
      *   *Chair Intervention:* "A p-value is not a weight. Given the sample size ($N=50$) and the field's replication crisis, how likely is this result to appear if the Treatment *actually works* (False Positive) vs if it *doesn't* (True Negative)?"
      *   *Committee Consensus:* "Small studies noise a lot. Even if the treatment works, we might see this result 20% of the time by chance. If it doesn't work, we might see this result 60% of the time."
      *   *Agreed Weight ($W$):* The committee struggles. Let's assign a modest weight to the *contradiction*. $W = 0.40$ (It leans towards 'no effect', but weakly).
  4.  **Update:**
      *   $P_{new} = 0.80 \times 0.40 + 0.20 \times 0.60$ (Note: Swapping terms because $E$ contradicts $H$).
      *   $P_{new} = 0.32 + 0.12 = 0.44$.
      *   **Result:** The probability of "Treatment works" drops from 80% to 44%.
      *   **Critique:** This is a massive swing for a small study.
      *   **Correction:** The protocol reveals your priors were too fragile. If a single $N=50$ study halves your confidence, your prior was overconfident.
      *   **Refined Weight:** The committee realizes $W=0.40$ is too strong for $N=50$. They adjust $W$ to 0.48 (barely a signal).
      *   **Re-calc:** $P_{new} = 0.80 \times 0.48 + 0.20 \times 0.52 = 0.384 + 0.104 = 0.488$.
      *   **Final Result:** Probability drops to ~49%.
      *   **Why this hurts:** It forces you to admit your consensus was weak. A single preprint shouldn't destroy a consensus, but if your consensus was 80%, Bayes says it *should* be shaken. The procedure forces you to lower your confidence in your own prior stability.

  ---

  ### Part 4: Limitations & What This Cannot Do

  **1. The "Unknown Unknowns" Problem**
  This procedure assumes we have fixed the partition (Step 2). If the leaked draft introduces a *new hypothesis* we hadn't considered (e.g., "The virus is not airborne but surface-based"), Jeffrey conditionalization fails because we didn't have a prior for that proposition.
  *   **Failure Mode:** The procedure will force you to shoehorn the new hypothesis into an old binary (e.g., "Transmission is high" vs "low"), which distorts the probability.
  *   **Remedy:** You must pause the protocol. Declare a "Model Revision." Do not produce a number for the Ministry that week.

  **2. The Value/Epistemology Boundary**
  The protocol stops at Step 4. If a clinician says, "We must weight this leak higher because if we miss it, people die," they are invoking a **Loss Function**, not a Likelihood.
  *   **Failure Mode:** If you allow this into the Weight ($W$), you corrupt the probability with policy preferences. The Ministry will receive a number that reflects "fear" rather than "evidence."
  *   **Remedy:** Record two numbers. $P_{epistemic}$ (from the protocol) and $P_{prudential}$ (adjusted for risk tolerance). Pass both with an explanation.

  **3. The "Smuggled Convenience" Warning**
  The update formula $P_{new} = P_{old} \times W + (1 - P_{old}) \times (1 - W)$ is **not** strict Bayes. It is a linear interpolation.
  *   **Consequence:** It under-updates on very strong evidence and over-updates on very weak evidence compared to strict Likelihood Ratios.
  *   **Justification:** In a 20-minute meeting with non-probabilists, strict Likelihood Ratios will result in calculation errors or refusal to participate. This formula ensures *directional* correctness (evidence moves the needle the right way) without requiring logarithmic math. You are trading precision for compliance.

  **4. The Unwelcome Truth of Case 2**
  In the Leaked Draft case, the procedure told you to output **No Change**.
  *   **Reality:** The Ministry expects you to be "on top of" new information. Ignoring a leak looks like negligence.
  *   **The Philosophical Burden:** You must defend the coherence of "ignoring noise." If you update on the leak, you commit to updating on *every* future leak, including planted disinformation. The procedure protects the integrity of the number at the cost of political capital. You must decide if you are willing to spend that capital.

  ### Final Instruction to the Chair
  Print the **PUE Steps** on a single sheet. Place it in front of every member. When a member says "I feel the probability is X," interrupt gently: "We are not voting on probability. We are voting on the Weight of this signal." If they cannot agree on a Weight, the output to the Ministry is "Insufficient Evidence to Update." That is a valid scientific conclusion.
