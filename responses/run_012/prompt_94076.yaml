      *Key nuance:* The Commission finding (incomplete info) attacks the "common knowledge of evidence" premise implicitly. If the data is misleading, partitions aren't just different, the underlying sigma-algebra is murky. But the stronger point is the incentive structure. Aumann assumes truth-telling about beliefs. Hierarchy assumes obedience.

      *User's Take:* "Consistency constraint with no diagnostic power." I should affirm this. It's a coherence check, not a truth machine.

      *Word Count Strategy:* Keep the setup summary brief (user already knows it). Focus on the mapping and the critique.

  8.  **Final Polish:**
