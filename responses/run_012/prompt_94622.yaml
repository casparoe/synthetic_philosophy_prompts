answer: |-
  Dear Colleague,

  I have spent some time with the reconstruction your reading group has been circulating, and I must admit it is a formidable piece of work. It strips away the historical accretions that usually allow us to dodge Bradley without truly engaging him, and it forces us to confront the core ontological anxiety about how many things can become one. You asked for a diagnosis of where the argument fails, and while I understand the temptation to simply declare the conclusion false and work backward, I think we need to be more precise about which premise bears the weight of the error. To find the crack, it helps to begin by asking what a proposition would have to be for the argument's third step to be satisfied at all. Step three asserts that there must be something about the proposition, over and above its constituents, that makes them one content rather than many. For this to be true, the constituents must be ontologically prior to the proposition itself. They must be intelligible as the things they are independently of the unity they supposedly enter into. If the objects, properties, and relations are fully determinate entities before they are combined, then indeed, combining them requires a further principle of combination. But if the constituents are abstractions from the unified whole, if they are only identifiable as constituents within the context of the proposition, then step three loses its grip. The argument assumes a building-block metaphysics where the blocks exist before the building, but if the building is the primary ontological unit, there is no need for a extra cement to hold pre-existing blocks together.

  This points directly to step four as the locus of the mistake, though step three is the enabling assumption. Step four claims that the only candidate for unifying something is a relation that holds among the constituents. This is a reification of unity. It treats the unifying factor as another item, another constituent, rather than as a mode or a way the constituents are. The plausibility of this step comes from our habit of modeling all metaphysical explanation on mereology, where wholes are sums of parts. If a proposition is a whole, and the constituents are parts, then any feature of the whole that is not a part must be an external relation holding between the parts. But this ignores the possibility that the unity of a proposition is not a part or an external relation, but rather the manner in which the constituents are presented. When we say that a bears relation R to b, the relation R is a constituent, but the fact that R relates a and b is not a further constituent. It is the difference between a relation as a term and a relation as a relating relation, a distinction Russell drew early on to stop this very regress. Your colleague's argument treats the relating relation in step four as a term in step five, thereby generating the infinite series. If we refuse to treat the unifying act as an item, the regress cannot start.

  You mentioned being suspicious of answers that dress up primitive unity as a distinction of types, and I share that suspicion if it is merely a verbal fiat. However, the cost of rejecting step four is not simply saying unity is primitive and walking away. The cost is that we must abandon the hope of fully analyzing structural unity into compositional items. We must accept that there is a fundamental difference between a list of constituents and a proposition, and that this difference is not capturable by adding another constituent to the list. This means accepting a form of non-merological composition. In mereology, the whole is nothing over and above the parts, but in the theory of structured propositions, the proposition is something over and above the constituents precisely because it has a structure that is not itself a constituent. The price we pay is explanatory limitation. We cannot explain unity by reducing it to something more basic, because unity is the condition for there being any basics to reduce. We are forced to treat the propositional form as a sui generis category of being, or at least as a fundamental feature of reality that does not admit of further decomposition. This is a significant metaphysical commitment, as it blocks a certain kind of reductionist project, but it is the only way to save the phenomenon of truth and falsity without falling into the nihilism of step ten.

  Regarding your colleague's insistence that their version is immune to usual replies because the question of what makes the unity one can be asked at every level, I believe this objection begs the question against the view I am outlining. The question what makes this one thing assumes that unity is always a problem requiring a solution in terms of further items. If unity is internal to the nature of the proposition, or if the proposition is a fundamental unit of reality, then asking what makes it one is like asking what makes a simple object simple. The question presupposes complexity where there is none. If we accept that the binding is not a further item, as per the rejection of step eight, then there is no new entity introduced at the next level to require binding. The relating is not an entity; it is an operation or a fact. By insisting that the binding must be a further item, your colleague is simply re-asserting step four after it has been challenged. The immunity they claim relies on the assumption that all binding must be effected by an item, which is exactly what the anti-regressor denies. Therefore, the objection only holds if we accept the reification of unity, which is the very point in dispute.

  So, to give you a direct recommendation on where to cut the knot, I suggest you reject step four, supported by a rejection of the ontological priority assumed in step three. You should argue that the unifying relation is not an item alongside the constituents but is the way the constituents are configured. This avoids the regress because there is no extra item to generate the next step of the series. The cost, as I noted, is that you must accept structural primitivism. You cannot explain the structure of the proposition in terms of things that have no structure. You must hold that propositions are inherently unified entities and that their constituents are dependent aspects rather than independent atoms. This might feel like a refusal to explain, but it is better understood as identifying the limit of explanation. If you try to explain unity further, you generate the regress. If you stop here, you save the propositions. Given that step ten is plainly false, and that we need propositions to make sense of thought and language, this is the cheapest cost available. Any other path either leads to the nihilism of Bradley or requires an infinite ontology that never actually achieves the unity it promises. I hope this helps you formulate your reply to the group, and I look forward to hearing how the discussion develops.

  Best regards,

  Your Colleague
