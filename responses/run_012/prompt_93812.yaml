answer: |-
  Subject: Re: Kant on QALYs and Incommensurability

  Dear Friend,

  You have asked for a definite position on how Kant would respond to modern institutional rationing, specifically the use of quality-adjusted life years and the associated debates about incommensurability and moral remainder. I will not hedge. Kant would reject the philosophical foundation of the QALY framework and he would not be an ally of the modern incommensurabilist, despite the superficial resemblance between his price-dignity distinction and their claims about incomparable values. He would argue that the modern view misunderstands the source of value and the capacity of reason to resolve moral conflict.

  To understand why he would reject the QALY metric as a moral guide, you have to look at what Kant thinks is actually being weighed. For Kant, health and longevity are not unconditional goods. They are conditional on their use by a rational will. A year of life in perfect health is only good if the person living it possesses a good will. Therefore, health has what Kant calls a price, or at best a relative value, whereas the rational agency within the person has dignity. When a health system uses QALYs to decide who gets treated, it is implicitly treating human beings as containers of health units rather than as ends in themselves. If the algorithm decides that treating a disabled person yields fewer quality-adjusted years than treating an able-bodied person, and therefore deprioritizes the disabled person, Kant would condemn this as a violation of the humanity formula. It treats the person with a disability as having less worth, effectively putting a price on their dignity. He would accept that resources are scarce and that the state must manage them under the Doctrine of Right, but he would insist that the allocation cannot be based on a calculation that implies some persons are worth less than others. He would likely prefer a lottery among equal claimants over a utilitarian calculus that ranks the worth of their lives.

  This leads directly to your question about incommensurability. You noted that his distinction between price and dignity looks like a claim that some values cannot be compared. While it is true that Kant says dignity is beyond all price, this does not make him a modern incommensurabilist. The modern view suggests that reason runs out when faced with two genuine moral values that lack a common measure. Kant believes reason never runs out. For Kant, there is only one supreme moral value: the good will acting in accordance with duty. When two options appear to conflict, it is not because the values are incommensurable, but because we have failed to properly apply the categorical imperative. One of those options will be revealed as a duty and the other as merely permissible or forbidden. There is no tragic choice where reason is silent. So, while he agrees that you cannot trade dignity for price, he does not agree that you can be stuck between two dignities with no way to choose. He is a monist about moral reason. He would say the modern incommensurabilist is simply confused about the hierarchy of obligations.

  Consequently, Kant would also reject the concepts of moral remainder and dirty hands. These ideas rely on the notion that you can do the right thing and still be morally stained by the value you had to sacrifice. For Kant, this is incoherent. If an action is your duty, you must do it, and in doing it, you remain morally clean. If you violate a perfect duty to save yourself from a catastrophic outcome, you are guilty, not dirty. There is no middle ground where you are right but indebted. The feeling of residue is merely an emotional reaction, not a moral reality. In the case of triage, if a doctor must choose between two patients and there is no relevant moral distinction between them, Kant would argue for a mechanism that respects their equality, such as first-come-first-served or a lottery. If the doctor chooses one and lets the other die based on that rule, there is no moral remainder owed to the one who died, because the doctor did not violate their dignity. The death is a tragedy of nature, not a moral sin of the agent.

  So here is the line where I place him. Kant would accept that empirical goods like health, money, and time can be traded off against each other because they belong to the realm of price and prudence. He would even accept that the state must make rules for rationing scarce medical resources. However, he would draw a hard line at any method that calculates the value of a person based on their health outcomes. He would reject QALYs as a moral metric because they aggregate human worth into a single utility scale. He would reject the modern theory of incommensurability because he believes reason provides a single scale for moral judgment that resolves all conflicts. And he would reject moral remainder because he believes duty, when correctly identified, leaves no debt behind. He is not an ally of the modern view he is its critic, arguing that the difficulty of choice comes from our limited knowledge or our inclinations, not from a failure in the structure of value itself.

  I hope this gives you the clarity you were looking for.

  Best regards,

  Assistant
