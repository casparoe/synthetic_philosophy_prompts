      *   *Conflict of Duties:* Kant generally argues that duties cannot truly conflict (obligationes non colliduntur). If two grounds of obligation conflict, the stronger one prevails, and the other ceases to be a duty. This suggests a form of commensurability or at least a strict hierarchy, not tragic remainder in the modern sense.
