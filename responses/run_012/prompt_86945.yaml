prompt: |-
  I'm applying for a one-term fellowship and need a short proposal, a page and a half, on money pumps and diachronic rationality. My half-formed idea: every money pump I know of either goes after an agent at a single moment (intransitive preferences and so on) or quietly assumes the victim is naive about what's coming, or can't bind herself in advance. I want to look at a variant I've been calling a deferred pump, where each trade on offer is an improvement by the agent's own lights at the moment it's made and only the whole sequence is worse, and the offers arrive at irregular intervals, so she can't adopt a blanket refusal without also turning down trades she'd genuineley want. The question: can an agent who's fully time-consistent, transitive, and aware of the pattern still be exploited, or does awareness plus some stopping rule defuse it, and does the answer hinge on how we model her discounting? Turn this into the proposal proper: state the question so it has a determinate answer, explain why the existing treatments of pumping leave it open rather than settling it, say what I'd actually do (I picture a small formal model where I vary the awareness and delay parameters, but tell me if that's the wrong method), what would count as the project failing, and whether it's realistically a one-term job. Don't bother with citations, I'll add those.
