answer: |-
  This is a precise and philosophically rich description of a very common intellectual impasse. You have isolated a structure that sits at the boundary of logic, semantics, and political theory.

  To answer your primary question: Yes, this pattern has established names, though no single term captures every nuance you describe. The most robust philosophical framework for this is **Essentially Contested Concepts**, formulated by W.B. Gallie (1956). However, in the specific context of political liberty, this is the exact dynamic Isaiah Berlin described in **"Two Concepts of Liberty" (1958)**.

  Here is the analysis of the phenomenon, the comparison to your walkability case, and the answer to whether the dispute can be settled or only terminated.

  ### 1. The Name and Structure

  The pattern you describe is a clash of **operationalizations** applied to an **essentially contested concept**.

  *   **Essentially Contested Concept:** Gallie argued that certain concepts (like *democracy*, *justice*, *art*, and *liberalism*) are inherently subject to endless dispute. This is not because people are confused, but because the concept is **appraisive** (it marks something as valuable) and **internally complex** (it comprises multiple dimensions that can be weighted differently).
  *   **The Operationalization Clash:** In your country example, both parties agree on the *label* ("liberal") but disagree on the *dimensions* that constitute it.
      *   Party A operationalizes liberalism as **Positive Liberty** (capacity to act, enabled by state support).
      *   Party B operationalizes liberalism as **Negative Liberty** (freedom from interference, enabled by state restraint).
  *   **The Inverse Correlation:** You noted the rankings tend to be inversely ordered. This is crucial. It implies a **trade-off**. In political economy, this is often recognized as the trade-off between *security/equality* and *autonomy/efficiency*. Because the dimensions trade off, maximizing one minimizes the other, guaranteeing the inverse ranking.

  ### 2. The Walkability Analogy: Same Structure, Different Stakes

  You asked if the walkability case is the same phenomenon.

  **Structurally, yes.** It is identical. "Walkability" is also a multidimensional cluster concept.
  *   Metric 1: Utility (destinations reachable).
  *   Metric 2: Experience (pleasantness of infrastructure).
  *   Result: Inverse ranking (e.g., Manhattan vs. a Garden Suburb).

  **Phenomenologically, no.** This is where your intuition about the stakes is correct. The difference lies in the **appraisive weight**.

  In the walkability case, the word "walkable" is primarily descriptive with a mild positive connotation. If City A scores high on utility and City B on pleasantness, we can easily accept a pluralistic conclusion: "City A is more *accessible*, City B is more *pleasant*." We do not need to crown one "The True Walkable City."

  In the liberalism case, the word "liberal" is a **legitimacy token**. To call a country "liberal" is not just to describe it; it is to endorse it as politically valid. To call it "illiberal" is to suggest it is defective. Because the label confers legitimacy, the parties cannot accept pluralism. They cannot say, "Sweden is socially liberal, and the US is economically liberal." They must fight for the single label because the label itself is the prize.

  Therefore, the country dispute is not "merely verbal" in the trivial sense. It is verbal in the sense that it concerns definitions, but those definitions are **constitutive of political reality**. Changing the definition changes which policies are viewed as virtuous.

  ### 3. Why Evidence Fails

  You noted that "no further fact about the two countries could decide it." This is correct because the disagreement is not epistemic (about knowledge); it is **axiological** (about values).

  When the dispute shifts to the word *liberal*, it looks like a semantic stalemate. But it is actually a **normative stalemate disguised as an empirical one**.
  *   Party A believes the *purpose* of a political system is to maximize human capability.
  *   Party B believes the *purpose* of a political system is to minimize coercion.

  No amount of data about tax rates or prison conditions can decide which purpose is correct. The data only measures how well each country achieves its respective purpose. When Party A presents welfare stats, they are implicitly arguing, "Capability is the true metric of liberalism." Party B hears this not as data, but as a value judgment they reject.

  ### 4. Settling vs. Terminating

  You asked what would **settle** the country question rather than merely **terminate** it.

  *   **Termination** occurs when the parties agree to stipulate definitions ("Let's call Sweden *Social Democratic* and the US *Market Liberal*") or when they exhaust themselves. This stops the argument but leaves the underlying conflict unresolved.
  *   **Settling** would require establishing a **hierarchy of values**.

  To settle the question of "Which country is more liberal?", you must answer a prior question: **"What is the primary good that liberalism seeks to maximize?"**

  This cannot be settled by evidence. It can only be settled by **persuasion regarding first principles**. A resolution would look like this:
  1.  Both parties agree on a shared *telos* (purpose) for the concept. (e.g., "We agree that the ultimate goal of liberalism is human flourishing.")
  2.  Both parties agree on which metric best serves that *telos*. (e.g., "We agree that without basic security, formal freedom is meaningless," OR "We agree that dependency on the state erodes the agency required for flourishing.")

  Until one side persuades the other on the *moral weighting* of the dimensions, the dispute cannot be settled, only managed.

  ### Summary

  The pattern is a clash of **operationalizations** applied to an **essentially contested concept**.

  *   **Is the walkability case the same?** Logically, yes. Politically, no. The country case carries **legitimacy stakes** that force a zero-sum competition for the label, whereas the city case allows for pluralistic descriptions.
  *   **Is it merely verbal?** No. It is a substantive normative disagreement wearing the mask of a semantic one. The definition determines the distribution of political praise and blame.
  *   **How to settle it?** You cannot settle it with facts. You can only settle it by ascending to a higher level of abstraction and arguing about the **moral hierarchy of values** (e.g., Is security more fundamental to liberty than non-interference?). If you cannot agree on the hierarchy, you must accept that "liberalism" is not a single point on a map, but a frontier of trade-offs.

  The specific name for the political version of this is the **Negative vs. Positive Liberty** distinction (Berlin), and the general logical name is **Essential Contestability** (Gallie). The phenomenon you have identified is the friction that occurs when people try to treat a multidimensional, normative frontier as a one-dimensional, empirical scale.
