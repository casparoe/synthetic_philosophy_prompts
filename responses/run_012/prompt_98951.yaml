prompt: |-
  I work on the responsible-AI team at a company that sells a risk-scoring tool to hospitals and, separately, to a payments company, and I'm the person who has to sign off before anything ships. Right now our fairness review is basically "run the standard metrics, eyeball them, write a paragaph." I want to replace that with an actual decision procedure my team can run in about two days per model, grounded in the formal results everyone cites about fairness metrics being mutually unsatisfiable -- you know, the ones showing that when two groups have different base rates you can't have a calibrated score and equal error rates across groups at the same time, and that the handful of natural definitions can't all hold together except in degenerate cases. I don't need citations, I know the gist; I need the procedure.

  I want it to do the translation honestly: given a model and a protected attribute, which metric pairs are actually in tension for this data (as opposed to only in theory), how to tell when the tension is real versus an artifact of a bad proxy or a tiny subgroup, what to do when it bites, and where the procedure has to stop and hand the choice to a person because the question is "whose errors do we prefer" rather than a fact about the model. Part of what I want is a reframing I've been kicking around: instead of picking one metric off a menu, treat the choice as a question of who bears the errors, and make the procedure force us to write down, for each candidate operating point, whose false positives go up and whose false negatives go up, in plain language, before anyone is allowed to pick. I genuinely don't know if that's the right frame, so tell me where it breaks.

  The procedure has to survive the ugly cases: subgroups too small for the estimates to mean anything, a protected attribute that's a bad proxy for the thing we actually care about, a score that's only one input to a human decision downstream, and a customer or a lawyer insisting on a metric the math can't give us alongside another one they also insist on. It should say when to refuse to ship.

  Then run it on two: (1) a model that ranks patients for a scarce care-management program, where one group is sicker on average at the same score; (2) a fraud-flag model for a payments company where the flagged group is a tiny fraction of transactions and the base rate genuinely differs between groups. One of these should come out with an answer I won't like -- I'd rather you tell me my tool can't be certified for one of them than paper over it.

  Finish by saying what the procedure can't do.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User Role:** Responsible AI lead at a vendor selling risk-scoring tools (healthcare & payments).
      *   **Responsibility:** Final sign-off before shipping.
      *   **Current State:** Ad-hoc fairness review ("run metrics, eyeball, write paragraph").
      *   **Goal:** A rigorous, 2-day decision procedure grounded in the impossibility theorems of fairness (calibration vs. error rate parity given base rate differences).
      *   **Key Requirements:**
          *   Identify *actual* tensions in the specific data (not just theoretical).
          *   Distinguish real tension from artifacts (bad proxies, small subgroups).
          *   Actionable steps when tension exists.
          *   Clear hand-off points for human judgment ("whose errors do we prefer").
          *   Reframing: Focus on "who bears the errors" (FP/FN distribution) rather than picking abstract metrics.
          *   Handle edge cases: Small subgroups, bad proxies, human-in-the-loop, conflicting stakeholder demands.
          *   Define "Refuse to Ship" criteria.
          *   **Task:** Run the procedure on two specific cases (Healthcare Care-Management vs. Payments Fraud).
          *   **Constraint:** One case must result in a "do not ship/certify" recommendation if warranted (no papering over).
          *   **Ending:** Explicitly state what the procedure *cannot* do.

  2.  **Deconstruct the "Impossibility Theorem" Context:**
      *   The user refers to the Chouldechova (2017) / Kleinberg et al. (2016) results.
      *   *Core Conflict:* If base rates ($P(Y=1|A=0) \neq P(Y=1|A=1)$) differ, you cannot simultaneously satisfy Calibration ($P(Y=1|S=s, A=a) = s$) and Error Rate Parity (Equal FPR/FNR).
      *   *Implication:* You *must* choose which constraint to relax. This is a normative choice, not a technical one.
      *   *User's Reframing:* "Who bears the errors?" This is strong. It moves from abstract math (FPR) to concrete harm (False Positive = denied service/flagged fraud; False Negative = missed care/missed fraud).

  3.  **Develop the Decision Procedure (The "Protocol"):**
      *   *Timebox:* 2 Days.
      *   *Phase 1: Data & Base Rate Audit (Day 1 AM).* Check validity of labels, proxies, and subgroup sizes.
      *   *Phase 2: Tension Quantification (Day 1 PM).* Calculate the specific trade-off curves. Is the tension theoretical or empirical?
      *   *Phase 3: Harm Mapping (Day 2 AM).* The "Who Bears the Errors" reframing. Translate FP/FN to real-world consequences.
      *   *Phase 4: Decision & Sign-off (Day 2 PM).* Select operating point or refuse.

  4.  **Critique the User's Reframing ("Who Bears the Errors"):**
      *   *Strengths:* Concrete, forces accountability, aligns with legal liability (disparate impact).
      *   *Weaknesses:* Assumes errors are symmetric within groups (they aren't), assumes the label $Y$ is the ground truth (often it's not, especially in healthcare/policing), doesn't account for downstream human discretion.
      *   *Verdict:* It's the *right* frame for the *decision*, but needs a前置 (preceding) step validating the label itself.

  5.  **Drafting the Procedure Steps (Iterative refinement):**
      *   *Step 1: Validity Check.* Is $Y$ biased? Is $A$ accurate? Is $N$ large enough? (Stop if no).
      *   *Step 2: The Impossibility Check.* Calculate Base Rate Ratio. If $\approx 1$, parity is possible. If $\neq 1$, force the trade-off visualization.
      *   *Step 3: The Error Ledger.* For threshold $t$, list Group 0 FP, Group 0 FN, Group 1 FP, Group 1 FN.
      *   *Step 4: The "Whose Harm" Statement.* Require text description of the shift.
      *   *Step 5: The Veto.* If the harm distribution violates policy/law, stop.

  6.  **Running the Procedure on Case 1: Healthcare Care-Management:**
      *   *Context:* Ranking patients for scarce resources.
      *   *Issue:* One group is sicker on average at the same score (Label bias or Cost bias?). Usually, this means the model predicts *cost* not *health need*.
      *   *Base Rates:* Differ significantly.
      *   *Tension:* Calibration vs. Equal Opportunity.
      *   *Harm:* FN = Sick person denied care (High harm). FP = Healthy person gets extra call (Low harm).
      *   *Analysis:* If the model uses cost as proxy for health, and Group A has less access to care (lower cost for same sickness), the model under-scores Group A.
      *   *Outcome:* This is the "Do Not Ship" case. The label is fundamentally biased relative to the construct (health need). No threshold fix solves construct validity.

  7.  **Running the Procedure on Case 2: Payments Fraud:**
      *   *Context:* Fraud flagging.
      *   *Issue:* Tiny fraction flagged, base rates differ.
      *   *Harm:* FP = Friction/declined card (Customer annoyance). FN = Financial loss (Company/Customer loss).
      *   *Tension:* Real, due to base rates.
      *   *Analysis:* Can we calibrate? Yes. Can we equalize FPR? Only by hurting recall.
      *   *Outcome:* Shipable *if* the "Error Ledger" is accepted by stakeholders. Usually, fraud models prioritize recall (minimize FN) while managing FPR budget. The tension is manageable via threshold tuning per group *or* accepting disparate FPRs. Let's make this the "Ship with Conditions" case.

  8.  **Refining the "Do Not Ship" Logic:**
      *   Why Healthcare? Because of *Construct Validity*. If the score means "predicted cost" but the product sells "predicted health risk," and cost correlates differently with health across groups due to systemic access issues, the model is lying about what it measures. This is deeper than fairness metrics; it's validity.
      *   Why Payments? Fraud is fraud. The label is usually cleaner (chargeback confirmed). The harm is economic. Disparate FPR is often legally defensible if base rates differ, provided calibration holds.

  9.  **Addressing the "What the Procedure Can't Do" Section:**
      *   Can't fix bad labels.
      *   Can't resolve moral disagreements.
      *   Can't account for long-term feedback loops.
      *   Can't replace legal counsel.

  10. **Review against Constraints:**
      *   *2 Days?* Yes, the steps are tight.
      *   *No Citations?* Keep theory implicit in the steps.
      *   *Honest Translation?* The "Error Ledger" does this.
      *   *Ugly Cases?* Addressed in Step 1 (Validity/Size).
      *   *One "Don't Like" Answer?* The Healthcare case will likely fail validity.

  11. **Final Polish:**
      *   Tone: Professional, direct, slightly weary but rigorous (matching the user's vibe).
      *   Structure: Procedure -> Critique of Frame -> Case Studies -> Limitations.
      *   *Self-Correction on Healthcare Case:* Make sure to distinguish between "model is biased" vs "problem is unsolvable." The Obermeyer et al. (2019) Science paper is the classic example here. The model predicted cost, not illness. If the product is sold as "illness risk," it's a fraud/validity issue, not just fairness. I need to make sure the procedure catches this *before* metric tuning.

  12. **Finalizing the "Who Bears the Errors" Frame:**
      *   It breaks if the "Error" isn't the harm. (e.g., True Positive might be harmful in some contexts, like predictive policing). In Healthcare/Finance, FP/FN mapping is usually clear. I will validate the frame but add the "Label Validity" precondition.

  13. **Drafting the Content:** (Mental outline of the response)
      *   Intro: Acknowledge the difficulty.
      *   The Protocol (4 Steps).
      *   Critique of the "Error Bearing" Frame.
      *   Case 1 (Health): Fail.
      *   Case 2 (Finance): Pass with constraints.
      *   Limitations.

      *(Self-Correction during drafting)*: Ensure I explicitly mention the "Impossibility" check. If base rates are equal, the tension vanishes. The procedure must calculate the Base Rate Ratio first.

      *(Refining the Healthcare Fail)*: It shouldn't just be "fairness failed." It should be "Validity failed." If the score means different things for different groups (measurement invariance violation), fairness metrics are moot. I will build this into Step 1.

      *(Refining the Finance Pass)*: Acknowledge the disparate FPR is mathematically necessary if calibration is kept. The decision is to accept disparate FPR to maintain calibration (risk interpretability).

      *(Final Check)*: Did I answer "where the procedure has to stop and hand the choice to a person"? Yes, Step 4.

