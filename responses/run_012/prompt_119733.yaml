answer: |-
  You have identified a genuine structural flaw in a class of ethical arguments that is often glossed over in popular effective altruism and longtermist discourse. Your engineering intuition is correct: the statistical assumptions underlying the "insect suffering" argument are often mismatched with the ontological reality of the uncertainty.

  Here is the breakdown of the concepts, the specific statistical error you spotted, the counter-argument, and a precise definition for the phenomenon.

  ### 1. The Established Names

  There is no single term that captures the *exact* combination of features you describe, but the argument sits at the intersection of three established concepts:

  **A. Pascal's Mugging (The Ancestor)**
  This is the closest popular term. Originally formulated by Nick Bostrom, it describes a scenario where a mugger threatens to harm an astronomically large number of people unless you give them a small sum of money. The probability of the threat being real is tiny, but the disutility is so vast that the expected value (EV) dominates.
  *   **Where it fits:** It captures the "tiny probability $\times$ huge magnitude" structure.
  *   **Where it breaks:** Pascal's Mugging usually involves a single, bounded event (one mugger, one threat). The insect argument relies on *aggregation* across a population.

  **B. The Fanaticism Problem (The Academic Context)**
  In contemporary moral philosophy (specifically within Effective Altruism and Longtermism), this is known as the "Fanaticism Problem." It refers to the implication of Expected Value Maximization that an agent should prioritize causes with tiny probabilities of astronomical outcomes over causes with high probabilities of modest outcomes.
  *   **Where it fits:** It captures the normative implication (you must sacrifice everything for the low-probability cause).
  *   **Where it breaks:** It is usually discussed regarding future generations or simulation hypotheses, not necessarily regarding the *correlation* of uncertainty across a current population.

  **C. Knightian Uncertainty (The Vagueness)**
  You noted the probability is "never pinned down." In economics and risk analysis, when probabilities are unknown or unknowable (rather than just low), this is **Knightian Uncertainty** (as opposed to Risk, where probabilities are known).
  *   **Relevance:** Treating Knightian Uncertainty as precise Risk (assigning a specific $p=0.001$) is a category error that allows the calculation to proceed when it shouldn't.

  ### 2. The Statistical Flaw: Aleatory vs. Epistemic Uncertainty

  Your second point is the most philosophically and statistically significant. You wrote: *"Multiplying a probability by a population assumes that the uncertainty is a lottery run independently for each individual... whether crickets can suffer doesn't look like that to me."*

  In risk engineering, you would distinguish between **Aleatory Uncertainty** (inherent randomness) and **Epistemic Uncertainty** (lack of knowledge about a fixed fact).

  *   **The Argument's Assumption (Aleatory):** It treats sentience as if each cricket rolls a die. If the die comes up "sentient," they suffer. Because the rolls are independent, the Law of Large Numbers applies. The variance decreases as $N$ increases. The expected value becomes a near-certainty.
  *   **The Reality (Epistemic/Common Cause):** Sentience is likely a property of the *kind* (the species or taxonomic group). Either the biological machinery for suffering exists in *Gryllidae*, or it does not. This is a **Common Cause Failure** mode.
      *   If the probability is epistemic (we don't know the fact about the species), then the outcomes for all trillion insects are **perfectly correlated**.
      *   **Mathematical Consequence:** If outcomes are perfectly correlated, the variance of the total sum scales with $N^2$, not $N$. The "signal-to-noise" ratio does not improve with population size.
      *   **Decision Theory:** A risk-neutral agent calculates EV the same way in both cases ($p \times N \times \text{suffering}$). However, almost all real-world agents (and arguably moral agents) are **risk-averse**. Under high correlation, the risk of being "wrong" (spending all resources to save beings that cannot suffer) is total. Under independence, the risk is averaged out.

  Therefore, the argument fails because it applies an **Aleatory Aggregation** model to an **Epistemic Common Cause** problem. It uses population size to launder a vague hypothesis into a near-certain expected value, which is statistically illegitimate when the uncertainty is about the *type*, not the *token*.

  ### 3. The Counter-Move: The Demandingness Objection

  The counter-argument you described ("if you accepted this, you'd have to abandon your family") has a standard name: **The Demandingness Objection**.

  *   **Definition:** The claim that a moral theory is false (or needs revision) if it requires agents to sacrifice their core personal projects, relationships, or well-being to a degree that is intuitively excessive.
  *   **Standard Reply:** Proponents of Expected Value Maximization often bite the bullet. They argue that intuition is a heuristic evolved for small-scale tribal living and should not override rigorous calculation.
  *   **The Better Reply (Reflective Equilibrium):** In philosophy, we seek "reflective equilibrium" between our principles and our considered judgments. If a calculation implies you must ignore your starving child to save a potential insect, the calculation is likely missing a variable (e.g., risk aversion, epistemic humility, or agent-relative permissions). The reductio is valid because it shows the theory violates the boundary conditions of plausible moral agency.

  ### 4. A Proposed Definition: "The Epistemic Aggregation Fallacy"

  Since no single existing term captures the specific statistical error you identified (treating correlated epistemic uncertainty as independent aleatory risk to force an EV conclusion), I propose we coin a term for this specific pattern.

  **Term:** **The Epistemic Aggregation Fallacy**

  **Definition:**
  A reasoning error in moral calculus where an agent derives a decisive Expected Value conclusion by multiplying a vague *epistemic* probability (uncertainty about a general fact or law) by a large population size, while implicitly treating that uncertainty as *aleatory* (independent random variation across individuals).

  **Boundary Conditions:**
  1.  **Fallacious Case:** Claiming "There is a 1% chance this *species* feels pain, and there are 1 billion of them, so we must act as if 10 million are definitely suffering." (This ignores that the 1% applies to the *whole* billion simultaneously).
  2.  **Valid Case:** Claiming "There is a 1% chance each *individual* in this group has a defect, and there are 1 billion of them, so we expect 10 million defects." (This applies when the variation is truly independent, e.g., random mutation or lottery).

  **Why this name?**
  It highlights that the error lies in **Aggregation** (using $N$ to boost the value) of **Epistemic** states (things we don't know about the system) rather than physical randomness.

  ### 5. Summary of the Phenomenon

  To answer your request for boundaries and relations:

  *   **Is it Pascal's Wager?** No. Wager is about *infinite* utility with one outcome. This is about *finite but vast* utility aggregated across many entities.
  *   **Is it Pascal's Mugging?** Yes, structurally. But Mugging usually implies a malicious agent or a singular event. This is a "Passive Mugging" by nature.
  *   **Is it the Fanaticism Problem?** Yes, this is the specific instantiation of the Fanaticism Problem applied to invertebrate welfare.
  *   **The Critical Distinction:** The argument relies on **Risk Neutrality**. If you introduce **Risk Aversion** (standard in reliability engineering for catastrophic, high-uncertainty failures), the calculation collapses. You would not design a safety system based on $P(\text{Failure}) \times N$ if the failure mode was a common-cause design flaw affecting all $N$ units simultaneously. You would treat the probability of the *design flaw* as the primary risk, regardless of $N$.

  **Conclusion:**
  Your intuition is robust. The argument you are grappling with commits the **Epistemic Aggregation Fallacy**. It attempts to use population size to resolve moral uncertainty that is actually structural. The counter-argument is a standard **Demandingness Objection**, which succeeds here because the underlying calculation ignores the variance introduced by correlated uncertainty. In reliability terms: they are calculating the MTBF (Mean Time Between Failures) of individual components when the risk is actually a systemic design flaw affecting the whole batch. You are right to reject the multiplication.
