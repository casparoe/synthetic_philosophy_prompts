  **BOARD PAPER: DG-2023-14**
  **Item:** Data Licensing Proposal – University Research Partnership (Cardiology)
  **Date:** 24 October 2023
  **Author:** [Your Name], Backend Engineering Representative
  **Distribution:** Data Governance Board

  ### 1. Recommendation

  **Decision:** Do not approve the data export in its current form.

  **Action:** The proposal is to be returned to the Data Science team for re-modelling. We should revisit this item in **14 days**.

  **Conditions for Approval:** To proceed, the dataset must be modified to ensure that the re-identification risk for *any single individual* does not exceed our high-risk threshold, regardless of the aggregate score. Specifically, the 900 users identified as having the rare heart condition must either be excluded from the export or have their geographic granularity reduced (e.g., to Regional Level) to break the uniqueness of their data signature.

  **Methodology Change:** The Board should suspend the use of the current "Disclosure Budget" metric for any decision involving sensitive health data. It is to be replaced or supplemented by a "Maximum Individual Risk" threshold.

  ### 2. Rationale

  While the proposed research offers genuine social value, the current risk assessment relies on a flawed interpretation of privacy risk. The proposal treats privacy as a fungible resource—a "budget" that can be spent heavily on a few users provided the average spend across the 4 million user base remains low.

  Privacy is not a collective pool; it is an individual right. Under UK GDPR, pseudonymised data remains personal data. For the 900 users with the rare condition, the combination of symptoms, age band, and postcode creates a unique fingerprint. For these individuals, the risk is not statistical; it is near-certain identifiability. Allowing a high risk of re-identification for a vulnerable minority because the majority are safe sets a precedent that contradicts our privacy-by-design commitments. If we ship this, we are effectively singling out 900 people for surveillance without their explicit, informed consent for this specific purpose.

  ### 3. The Strongest Counter-Argument

  The Board must acknowledge the strength of the Head of Data's position. The primary argument in favour is **utilitarian benefit**. The research targets a rare condition with limited existing data; this partnership could materially improve treatment outcomes or diagnostic speed for patients in the future.

  Furthermore, the current "Disclosure Budget" was adopted to prevent analysis paralysis. If we require zero risk for every individual, we stifle all data utility. The Head of Data argues that the data is pseudonymised, the researchers are accredited, and the legal contracts prohibit re-identification attempts. From this viewpoint, the theoretical risk to the 900 is outweighed by the tangible health benefits to the wider population, including those with the same condition. There is also the argument that users accepted Terms of Service allowing for anonymised research usage, and blocking this based on a theoretical risk profile may be seen as over-engineering that harms public good.

  ### 4. Critique of the "Disclosure Budget" Metric

  The current metric calculates the sum of re-identification probabilities across the dataset. Mathematically, this allows a high probability of harm for a small subgroup to be diluted by a near-zero probability for the majority.

  This is technically unsound for governance. In security and privacy engineering, we generally design for the worst-case scenario, not the average case. A system that is secure for 99.9% of users but leaks credentials for 0.1% is considered broken. The same logic applies here. We should move to a metric that flags any cohort where the re-identification risk exceeds a specific ceiling (e.g., >5%), regardless of how small that cohort is.

  ### 5. Next Steps

  1.  **Engineering:** Work with Data Science to implement k-anonymity checks on the export slice, specifically targeting the rare condition cohort.
  2.  **Legal:** Review the Data Sharing Agreement to ensure liability covers the specific risk of inference attacks on small cohorts.
  3.  **Governance:** Schedule a working session to redefine the "Disclosure Budget" policy before the next quarterly review.

  ***

  **Signed:**
  [Your Name]
  Backend Engineering Representative
