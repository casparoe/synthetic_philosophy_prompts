prompt: |-
  I'm a backend engineer at a mid-sized health-tracking app (about 4 million UK and EU users) and I sit on our internal data governance board — not because I know anything about ethics, I'm just the engineer who has to implement whatever they decide. There's a decision on Thursday and I've been asked to write the opinion that goes in the minutes, so I'm drafting it myself.

  The case: we want to license a slice of users' logged symptom and workout data to a university research group. It's pseudonymised, no names, and the research is genuinely worthwhile — it's on a rare heart condition. The problem is that the users with that condition are a tiny group, maybe 900 people, and for them the data is nearly as identifying as a name would be, since the condition is rare and the researchers also get postcode and age band. For everyone else the risk is basically nil. Our head of data has scored it with the "disclosure budget" we adopted last year: you estimate the re-identification risk for each affected user, add them all up, and if the total is under the threshold you ship. The total comes out comfortably under, so her view is that we're fine, and anyway it's all averages and statistics, nobody's actually harmed.

  Something about the budget feels sneaky to me — it lets 900 people carry almost all of the cost as long as the crowd is big enough to make the average look tiny. But I can't say why that's different from any other risk we spread across a user base, and I'd guess half the board will just say they can opt out and the other 4 million have nothing to hide. My vague feeling is that the budget treats privacy like a quantity of stuff we all own jointly, when what people actually seem to care about is being able to live without being watched by whoever happens to hold the data.

  Can you write the opinion itself, in British English (our minutes use British spelling)? I need a concrete recommendation — ship it, ship it with conditions, or don't, with a timeframe — plus what we should do about the budget itself, and an honest account of the strongest point on the losing side, because two board members will definately raise it and I don't want to look like I've ignored it.
reasoning: |-
  Here's a thinking process that leads to the suggested opinion:

  1.  **Analyze the Request:**
      *   **Role:** Backend Engineer on an Internal Data Governance Board.
      *   **Context:** Mid-sized health-tracking app (4M UK/EU users).
      *   **Task:** Write the opinion for the board minutes regarding a data licensing decision.
      *   **The Case:** License pseudonymised symptom/workout data to a university for rare heart condition research.
      *   **The Conflict:**
          *   *Pro:* Worthwhile research, pseudonymised, current "disclosure budget" metric says it's safe (average risk is low).
          *   *Con:* 900 users with the rare condition are highly identifiable (postcode + age + rare condition). The "disclosure budget" averages risk across the whole population, hiding the high risk for the few.
      *   **Requirements:**
          *   British English spelling.
          *   Concrete recommendation (Ship/Conditions/Don't + Timeframe).
          *   Recommendation on the "disclosure budget" metric itself.
          *   Honest account of the strongest counter-argument (the "losing side").
          *   Tone: Professional, technical but ethical, suitable for board minutes.

  2.  **Determine the Stance:**
      *   The engineer's intuition is correct. Averaging risk (utilitarian approach) in privacy contexts is dangerous, especially under GDPR/UK GDPR. High risk to a vulnerable minority cannot be washed out by low risk to the majority.
      *   *Recommendation:* Do not ship *as currently proposed*. Needs stricter controls or rejection. Given the "worthwhile research" aspect, a "Ship with Conditions" approach is usually more constructive than a flat "No," but the conditions must address the re-identification risk specifically for the 900. However, if the risk is *inherent* to the data combination (rare condition + postcode + age), technical controls might not be enough.
      *   *Refined Recommendation:* Pause/Don't ship in current form. Require differential privacy or aggregation that protects the 900 specifically. Let's go with "Do not approve in current form; require re-evaluation with stricter controls." Actually, for a board minute, a clear "Reject current proposal, propose alternative path" is best. Let's aim for: **Do not approve the current data slice. Require aggregation or suppression of the high-risk cohort before reconsideration.**
      *   *Metric Recommendation:* The "disclosure budget" (sum/average risk) is flawed. It needs to be replaced or supplemented by a "max individual risk" threshold.
      *   *Counter-argument:* The research value and the fact that users *could* opt-out (if the mechanism existed) or that the data is pseudonymised. The strongest point is the social benefit of the research vs. the theoretical risk.

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard board minute format (Item, Date, Author, etc.).
      *   **Executive Summary/Recommendation:** Clear and upfront.
      *   **Analysis of the Proposal:** Acknowledge the benefit (research) but highlight the specific risk (the 900 users).
      *   **Critique of the Metric:** Explain *why* the disclosure budget is misleading (averaging risk). Use the engineer's intuition about privacy not being a "joint pool."
      *   **The Counter-Argument:** Fairly represent the Head of Data's view (utilitarian benefit, pseudonymisation, low aggregate risk).
      *   **Conclusion/Next Steps:** Specific actions.

  4.  **Refining the Tone (British English & Professional):**
      *   Use "programme," "pseudonymised," "centre," "analyse."
      *   Tone should be objective but firm. Not emotional, but principled.
      *   Avoid sounding like a moral crusader; sound like an engineer protecting the system's integrity and compliance.

  5.  **Addressing Specific Constraints:**
      *   *Timeframe:* Need to suggest when to revisit.
      *   *Budget:* Need to say what to do with the disclosure budget metric.
      *   *Losing Side:* Must be strong enough that board members feel heard.

  6.  **Drafting - Iteration 1 (Mental Outline):**
      *   Say no to the data share.
      *   The 900 people are at high risk.
      *   The budget math is wrong because it averages.
      *   Head of Data says research is good and risk is low on average.
      *   Fix the budget metric to look at max risk, not average.
      *   Come back in 2 weeks with a plan to protect the 900.

  7.  **Drafting - Iteration 2 (Adding Nuance & Legal Context):**
      *   Mention UK GDPR. "Pseudonymised" isn't "Anonymous."
      *   The concept of "singling out" is key in GDPR.
      *   The "disclosure budget" sounds like differential privacy but implemented incorrectly (global epsilon vs individual risk).
      *   Make the recommendation actionable: Suppress the rare condition data or remove postcode granularity for that group.

  8.  **Final Polish (incorporating the prompt's specific voice):**
      *   The prompt says "I'm just the engineer... drafting it myself." The text should sound like it comes from a technical governance perspective, not a legal one, but acknowledging the implications.
      *   Ensure the "losing side" argument is compelling (social good).
      *   Ensure the critique of the budget is clear (privacy isn't fungible).

  9.  **Writing the Content (incorporating British spelling):**
      *   *Check:* Pseudonymised, programme, centre, modelling, licence (noun), advise (verb).
      *   *Structure:* Recommendation, Rationale, Critique of Methodology, Counter-Argument, Action Items.

      *(Self-Correction during drafting)*: I need to make sure I don't sound *too* insubordinate to the Head of Data. It's a board minute. It needs to be respectful but clear. The recommendation should be "Not approved in current form" rather than a flat "No," to allow for the research to happen safely.

      *Refining the "Disclosure Budget" critique:* The prompt describes it as "estimate re-identification risk... add them all up." This is mathematically unsound for privacy. Privacy risk isn't additive in a way that allows high risk for some to be cancelled by low risk for others. I need to articulate this clearly.

      *Refining the Counter-Argument:* The strongest point is the "Social Licence" and the tangible benefit to health vs. abstract privacy risk. Also, the users *did* agree to T&Cs usually. I should focus on the "Social Good" aspect as that's the Head of Data's likely strongest card.

  10. **Final Review against constraints:**
      *   British English? Yes.
      *   Concrete recommendation? Yes.
      *   What to do about the budget? Yes.
      *   Honest account of losing side? Yes.

      *(Final thought on the recommendation)*: If the data is inherently identifying for the 900 (Rare Condition + Postcode + Age), you can't really fix it without removing utility. The recommendation should be to exclude that specific cohort or aggregate them heavily. Let's suggest excluding the high-risk cohort from the export.

      *Wait, one more thing:* The prompt asks for a timeframe. I'll suggest a 14-day review period.

      *Let's write it.*
