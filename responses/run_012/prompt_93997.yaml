  ### Adjudication of Exchange

  **(1) Theo: Prediction as Demarcation**
  **Rating:** Partly Right
  **Justification:** Theo correctly identifies that *ex ante* prediction is a strong marker of scientific validity (Lakatos/Popper). However, he conflates a broad decadal window with a precise forecast; predicting "instability" in a "decade" allows for significant post-hoc fitting of the specific event.
  **Confidence:** 90%

  **(2) Mara: Falsifiability and In-Sample Testing**
  **Rating:** Clearly Right
  **Justification:** Mara isolates the critical statistical flaw: using the same data to fit parameters (cycle length) and test the model constitutes in-sample validation, which guarantees a fit. Her point on theory-laden categories correctly notes that without independent operationalization, the model cannot be falsified.
  **Confidence:** 95%

  **(3) Theo: Macro-Science Analogy and Transfer**
  **Rating:** Partly Right
  **Justification:** Theo is right that macro-sciences (like climatology) deal in probabilistic trends rather than specific events. However, his analogy fails to account for human agency; climate systems do not read climate models and alter their behavior, which undermines the claim of equivalent methodological standards.
  **Confidence:** 85%

  **(4) Mara: Non-Independence and Reflexivity**
  **Rating:** Clearly Right
  **Justification:** Mara raises the definitive methodological objection: Galton's Problem (non-independence of historical cases) invalidates simple cross-cultural statistical testing. Her point on reflexivity (actors changing behavior based on the theory) identifies a structural disanalogy with natural sciences that Theo's model does not accommodate.
  **Confidence:** 95%

  **(5) Theo: Research Program Survival**
  **Rating:** Partly Right
  **Justification:** Theo correctly invokes a Lakatosian defense (a program is judged by its ability to absorb anomalies over time). However, he is mistaken to dismiss falsifiability entirely; claiming cases are "unconnected" ignores Mara's established point on historical interdependence, weakening the claim of independent replication.
  **Confidence:** 75% **(Least Sure Point)**

  **(6) Mara: Selection Bias and Reference Class**
  **Rating:** Clearly Right
  **Justification:** Mara identifies the "file drawer problem": without a pre-registered reference class of predictions and a record of misses, hit rates are mathematically incalculable. This is a standard requirement for validating any predictive model and is currently absent in the literature she critiques.
  **Confidence:** 95%

  ### Overall Verdict

  **Mara is more right overall.**
  While Theo correctly identifies the ambition and some external validations of the program, Mara successfully demonstrates that the *internal validity* of the methodology is compromised. Her arguments regarding in-sample fitting, non-independence of data points (Galton's Problem), and the lack of a defined reference class for misses are fatal to the claim that the program is currently operating as a predictive science. Theo's defenses rely on analogies to natural science that do not hold under the specific conditions of historical reflexivity and data dependency.
  **Confidence:** 90%

  ### The Missing Consideration

  Both parties are missing a discussion on **Operational Equivalence**. They argue over the *logic* of prediction (falsifiability, independence), but neither addresses whether the variables (e.g., "elite," "immiseration") are measured equivalently across the "dozens of societies" Theo cites. If "elite overproduction" is measured by the number of law degrees in the US but by the number of nobles in pre-revolutionary France, the "recurrence" of the cycle is a semantic artifact rather than a structural reality. This issue cuts across the dispute: it undermines Theo's claim of transferability and deepens Mara's concern about theory-laden categories.
  **Confidence:** 85%

  ### Point of Least Certainty

  The point in my adjudication I am least sure of is the rating of **Move 5 (Theo's Lakatosian Defense)**. While I rated it "Partly Right," there is a legitimate philosophical tradition (Lakatos) that prioritizes the long-term heuristic power of a research program over immediate falsification. It is possible that Theo's dismissal of strict falsifiability is more defensible within the philosophy of social science than I have credited, provided the program continues to generate novel facts rather than just accommodating old ones.
  **Confidence:** 75%
