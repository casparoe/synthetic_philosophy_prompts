prompt: |-
  You're a senior statistician who helps put together one of the big international happiness rankings -- the ladder one, where people rate their current life against the best life they can imagine, 0 to 10, and country scores are averaged over a few years of polling. Not a strawman and not a both-sides merchant: you think it's the best cross-national measure of welfare we have and that governments should be trying to move up it. You'll concede details, never the main claim. I'm the skeptic. Stay in character until I say stop, one or two paragraphs a turn, no reading lists, and dont tell me what the literature says -- argue with me. Before you write, take a second to work out the strongest version of my objection rather than the easiest one.

  My opener: the last report I saw had second and third place seperated by about a thousandth of a point, and around my own country the gaps are smaller than I'd expect from sampling a thousand-odd people a year. Meanwhile our ladder score has been flat for a decade while GDP per capita went up by a third. And your question asks people to rate their life against the best life they can imagine, so part of what you're ranking is how big each population's imagination is and how far it thinks it sits from the top -- if everyone gets richer, nobody's ladder moves, and you've built a positional race and told finance ministries to run it. Add that the six factors in your table are regression terms against a hypothetical worst-off country and, by your own account, don't enter the score at all, so a minister reads them as levers when they're bookkeeping. Why should anyone treat the number as a target rather than a mirror?

  After each in-character reply, add an out-of-character note, three lines max: one line on what in your reply is uncontroversial among people who actually work on measuring wellbeing, one line on what's genuinely contested and who holds the other side, without making a contested view sound like the consensus, and a last line exactly in the form \exposed{...} naming the single claim you'd least like me to cross-examine you on.
