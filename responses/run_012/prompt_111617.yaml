answer: |-
  This is a sharp diagnosis from someone who has spent a lifetime looking at the actual machinery of selection rather than the shadow it casts on the cave wall of metaethics. You are right to be frustrated. The literature is recursive.

  Per your instructions, I will not offer a survey. I will treat this as a consultation between colleagues. I'll start by brainstorming the candidate diagnoses for the stalemate, then commit to the one I think is accurate, evaluate your hunch against it, and finally address the progress conditions and the broader template.

  ### Candidate Diagnoses for the Stalemate

  1.  **The Epistemic Priority Diagnosis (Your Hunch):** The dispute is fundamentally about the conditions for justification (safety/sensitivity vs. reliability). The evolutionary premise is merely a lever used to pry apart these prior epistemic commitments. The stalemate exists because neither side can argue for their epistemic principle without begging the question against the other.
  2.  **The Metaphysical Proxy Diagnosis:** The debate is not about epistemology or evolution, but about the *nature of moral facts*. "Robust Realists" (facts are stance-independent, causally inert) are the true target. Naturalistic Realists (facts are constituted by functional norms) are largely immune. The stalemate persists because Robust Realists refuse to abandon Robustness, and Debunkers refuse to attack anything less.
  3.  **The Empirical Black Box Diagnosis:** Philosophers treat "evolutionary influence" as a monolithic premise. In reality, selection acts on phenotypes, heuristics, and emotions, not propositional beliefs. The stalemate is due to a category error: applying a truth-tracking standard to mechanisms that were never selected for truth-tracking.
  4.  **The Dialectical Burden Diagnosis:** This is a skirmish over the burden of proof. Debunkers claim a *defeater*; Realists claim the defeater is *undercut*. The stalemate is procedural: there is no neutral arbiter for when a genealogical explanation becomes a normative defeater.
  5.  **The Verbal/Conceptual Diagnosis:** The two sides are using "tracking" and "coincidence" differently. For the debunker, "tracking" requires causal contact. For the realist, "tracking" requires counterfactual dependence (via a third factor). They are talking past each other.

  ### The Commitment: A Hybrid of Epistemic and Metaphysical Entanglement

  I commit to a refinement of **Diagnosis 2 (Metaphysical Proxy)**, constrained by **Diagnosis 1 (Epistemic Priority)**.

  Here is the hard truth: **The debate is stalled because the Evolutionary Debunking Argument (EDA) is not a freestanding argument; it is a *reductio* of Robust Moral Realism.**

  Sharon Street's Darwinian Dilemma, for instance, is explicitly framed against "realist" views that posit stance-independent moral truths. If you are a naturalist realist (e.g., David Copp, who ties moral truth to societal functioning), the EDA loses its bite because the "third factor" (survival/functioning) is *constitutive* of the moral truth, not just correlated with it.

  The reason the debate feels like it's running in circles is that Robust Realists are trying to save Robust Realism using epistemic tools (Third-Factor, Companion-in-Guilt) that implicitly require them to naturalize their metaphysics to work, which they are unwilling to do.

  *   **The Debunker says:** "Your beliefs are caused by fitness, not truth."
  *   **The Robust Realist says:** "Fitness and Truth correlate via a Third Factor (e.g., survival is good)."
  *   **The Debunker replies:** "To claim 'survival is good' is a moral claim. You are assuming moral truth to prove moral truth."

  This is where your hunch lands. You identified the *mechanism* of the stalemate (epistemic defeat conditions), but you missed the *fuel* (metaphysical commitment). The epistemic standards (modal security vs. reliability) are not free-floating; they are selected by the philosophers *because* those standards protect or threaten their preferred metaphysics.

  If the Realist adopts a reliabilist epistemology, they survive the EDA, but they often feel this undermines the "normative grip" of morality (making it too naturalistic). If they adopt a modal epistemology (safety/sensitivity), they succumb to the EDA unless they posit a pre-established harmony that looks suspiciously like theism or Platonist magic.

  **Is it verbal?** No. It is substantive.
  **Is it underdetermined?** Yes, by the arguments currently in play, because the arguments presuppose the conclusion.
  **Is it resting on starting intuitions?** Yes. Specifically, the intuition that moral facts must be *both* stance-independent (Robustness) *and* action-guiding (Normativity). The EDA shows these two features are in tension given evolutionary theory.

  ### Evaluating Your Hunch

  Your hunch is **80% correct but misses the metaphysical anchor.**

  You wrote: *"I think it's a disagreement about the correct theory of epistemic defeat... If that's the fault line, then the debunking argument and the third-factor reply are each decisive against the other depending on which side of it you stand on."*

  This is accurate. The Debunker relies on a **Sensitivity/Safety** condition (if the moral facts were different, would you still believe them? If yes, you're unsafe). The Realist relies on **Reliability** or **Modal Security** (is there *any* possible world where the connection holds?).

  However, you suggest this might be "two quite different things... quietly answering different questions." I disagree. They are answering the same question ("Are moral beliefs justified?"), but they are answering it relative to different **background metaphysics**.

  *   If moral facts are like math facts (causally inert), the epistemic access problem is severe.
  *   If moral facts are like biological function facts (naturalized), the epistemic access problem dissolves.

  The stalemate isn't just that they can't agree on epistemology; it's that agreeing on the epistemology forces a concession on the metaphysics that neither side wants to make. The Debunker won't accept naturalized morality (they often want to be error theorists or constructivists). The Robust Realist won't accept naturalized morality (they want normativity to be "queer" in Mackie's sense).

  **So, your hunch collapses into the Metaphysical Proxy Diagnosis.** The epistemic fight is the proxy; the metaphysical territory is the prize.

  ### What Counts as Progress?

  You asked for honesty. **Do not expect resolution.** This dispute has the same structure as the Free Will debate or the Problem of Induction. It is a "frame problem" for normative philosophy.

  However, progress could look like this:

  1.  **A Formal Result in Epistemology:** If someone could formally demonstrate that *any* domain of causally inert truths (math, logic, morality) is vulnerable to EDAs under standard modal conditions, the "Companion in Guilt" reply dies. This would force Realists to abandon Robustness or accept skepticism about math (a high price). Conversely, if a model of "non-causal tracking" is rigorously formalized (beyond hand-waving about "conceptual competence"), Realists win.
  2.  **A Shift in Metaphysical Consensus:** If the profession collectively moves toward Naturalized Normativity (morality as a species of functional normativity), the EDA becomes a biological curiosity rather than a skeptical threat. This is happening slowly, but Robust Realism has a strong grip on the "folk" intuition of philosophers.
  3.  **Abandoning the Question:** The most likely progress is realizing the question is malformed. Asking if evolution "debunks" morality assumes morality is a *theoretical posits* like "phlogiston." If morality is a *practice* or a *commitment*, the question of "truth-tracking" is a category error. (This is the Pragmatist exit).

  **My verdict:** No significant progress should be expected until the metaphysics shifts. The arguments are currently maxed out.

  ### The General Template: Biology, Religion, Morals

  You noted the same shape in your old field (altruism) and CSR (religious belief). There is indeed a template:

  **The Etiological Challenge Template:**
  1.  **Phenomenon:** $X$ (Helping behavior / Moral Belief / Religious Belief).
  2.  **Etiology:** $X$ is produced by Process $P$ (Kin Selection / Evolution / HADD).
  3.  **Claim:** $P$ is insensitive to Truth Value $T$ (Fitness / Moral Fact / God's Existence).
  4.  **Conclusion:** $X$ is unjustified / Illusory / Not "Really" $X$.

  **Where the Moral Case Adds Complexity:**

  1.  **The Altruism Parallel (Behavioural Ecology):**
      *   In your field, "altruism" is defined by *fitness costs*. If a bird helps a sibling, it is altruistic regardless of its "intentions."
      *   In philosophy, "altruism" (or morality) is defined by *motivational/normative force*.
      *   **The Disconnect:** The EDA tries to move from the biological explanation (fitness) to the normative conclusion (unjustified). In biology, explaining the helping behavior *completes* the explanation. In metaethics, explaining the belief is supposed to *undermine* it.
      *   **Diagnosis:** The biological case is descriptive; the moral case is normative. The EDA tries to use a descriptive premise to force a normative conclusion (the Is-Ought gap in disguise).

  2.  **The CSR Parallel (Religion):**
      *   CSR argues belief in God is a byproduct of agency detection.
      *   **The Difference:** Religious belief is *factual* (God exists). Moral belief is *normative* (Killing is wrong).
      *   **Why it matters:** You can debunk a factual belief by showing its cause is independent of the fact (HADD fires even when no agent is present). You cannot as easily debunk a normative belief this way because normative facts (if they exist) don't cause things.
      *   **The Moral Case Adds:** The **Causal Inertness Problem**. If moral facts existed, they wouldn't cause our beliefs anyway (unlike God, who could theoretically cause belief). So the EDA against morality is actually *stronger* than against religion. In religion, you can say "Maybe God designed HADD." In morality, the Robust Realist cannot say "Moral facts caused evolution" without being spooky.

  ### Direct Critique of Your Framing

  You asked me not to be diplomatic. Here is the friction point:

  You wrote: *"I can't tell whether the same moves are being re-run because nobody has an answer, or because the two sides aren't even asking the same thing."*

  **They are asking the same thing, but the question is a trap.**

  The question "Does evolution debunk morality?" presupposes that morality is the *kind of thing* that can be debunked by etiology. This presupposes Robust Realism. If morality is a construct, a tool, or a functional norm, etiology is irrelevant to its validity (you don't debunk a hammer by explaining how the factory made it, unless you claim the hammer is supposed to be a miracle).

  **Your confusion is a feature, not a bug.** You are conflating the *biological reality* (which you know intimately) with the *philosophical projection* onto that reality.
  *   In biology, an adaptationist explanation of helping *does not* debunk the claim that the helper is altruistic (in the fitness sense). It explains it.
  *   In philosophy, the adaptationist explanation is wielded as a sword to sever the link to Truth.

  **The Malformation:** The debate is malformed because it treats Moral Truth as a *target* that evolution might have hit or missed. But if Moral Truth is not a target (i.e., not a stance-independent fact), the "miss" is impossible. The stalemate persists because Realists insist it is a target, and Debunkers (often secretly) agree it's a target but insist evolution missed it, while Constructivists (the quiet third party) say there is no target.

  **Final Advice:**
  Your hunch about epistemic defeat is the correct *diagnosis of the symptom*. The *disease* is the commitment to Robust Realism in a naturalistic world. As a behavioural ecologist, you are naturally inclined toward Naturalism. You will find the Realist replies unsatisfying because they require a metaphysics that looks like magic to a scientist. You will find the Debunker conclusions unsatisfying because they imply a skepticism you don't feel in practice.

  The debate isn't stalled because philosophers are dull. It's stalled because they are trying to square a circle drawn by their own definitions. If you want to see movement, watch the Naturalistic Realists (who dissolve the problem) or the Pragmatists (who dissolve the question). The Robust Realists and Error Theorists will be dancing this waltz until retirement.
