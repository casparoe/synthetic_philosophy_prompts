prompt: |-
  A guy in my just-war reading group handed us this last week and I still can't find the leak. He thinks it shows nobody can ever fight in a war; he's fine with that, I'm not. Here it is, more or less as he gave it:

  (1) Killing someone in war is permissible only if they're morally liable to be killed.
  (2) Your morally liable to be killed only if you've forfeited your right to life through your own culpable wrongdoing.
  (3) Now take the conscript on the unjust side. He was grabbed off the street, he'd be shot for refusing, he's from a minority his own regime doesn't trust, and he has no clue the war is unjust — he's just trying to keep his village standing. Nothing he's done is culpable.
  (4) So he hasn't forfeited anything, so he isn't liable to be killed.
  (5) The just side's soldiers kill him anyway.
  (6) So the just side's soldiers kill a man who isn't liable to be killed.
  (7) Killing a man who isn't liable to be killed is murder.
  (8) So even the soldiers on the just side are murderers.
  (9) And if even they're murderers, then no war is ever permissible — not even one to stop a genocide.
  (10) Thats obviously false, so one of (1)–(7) has to give.

  I'd sooner cut off a finger than drop (10). So which step do I reject, and what does rejecting it actually cost me? And be straight with me about which parts of this are settled among people who actually work on it and which are genuinely contested — don't hand me one school's line as if it were the consensus.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Context:** The user is in a "just-war reading group." A peer presented an argument (a reductio ad absurdum) claiming that *no* war is permissible because even "just" soldiers end up murdering non-liable conscripts.
      *   **The Argument:** A 10-step logical chain concluding that since (10) "no war is permissible" is false, one of steps (1)-(7) must be rejected.
      *   **User's Stance:** Strongly committed to (10) being false (i.e., some wars *are* permissible). Willing to reject earlier premises but wants to know the *cost* of doing so.
      *   **Requirement:** Be straight about what is settled vs. contested in contemporary Just War Theory (JWT) and Revisionist Just War Theory (RJWT). Don't present one school's view as consensus.
      *   **Goal:** Identify the weak links in the argument, explain the philosophical trade-offs of rejecting them, and clarify the current state of the debate.

  2.  **Deconstruct the Argument:**
      *   (1) Killing in war $\rightarrow$ Liability (Standard JWT & RJWT starting point).
      *   (2) Liability $\rightarrow$ Culpable Wrongdoing (This is the *Revisionist* crunch point).
      *   (3) Description of the Conscript (Non-culpable, coerced, ignorant).
      *   (4) Conscript $\rightarrow$ Not Liable (Follows from 2 & 3).
      *   (5) Just Soldiers kill Conscript.
      *   (6) Just Soldiers kill Non-Liable person.
      *   (7) Killing Non-Liable $\rightarrow$ Murder.
      *   (8) Just Soldiers $\rightarrow$ Murderers.
      *   (9) No War Permissible.
      *   (10) (10) is False (User's axiom).

  3.  **Identify the Contested Premises:**
      *   *Premise (1):* Generally accepted, but some utilitarian/consequentialist views might bypass liability entirely (directly to necessity). However, in rights-based JWT, this is standard.
      *   *Premise (2):* **The Big Battleground.** Traditional JWT says status (combatant vs. non-combatant) matters. Revisionist JWT (McMahan, etc.) says liability depends on *moral responsibility/culpability*. This argument assumes the Revisionist view.
      *   *Premise (3):* Empirical claim. Often true, but not always. Some conscripts are culpable. But for the sake of argument, let's grant the "innocent conscript" case.
      *   *Premise (7):* **The Second Big Battleground.** Is killing a non-liable person *always* murder? Or can it be excused/justified by necessity, lesser evil, or epistemic limitations?

  4.  **Evaluate Potential Rejection Points (and their costs):**

      *   **Option A: Reject (2) - The Traditionalist View.**
          *   *Idea:* Liability isn't just about culpability. It's about *threat* or *status*. If you are pointing a gun at me, I can kill you in self-defense even if you are a non-culpable aggressor (like a sleepwalker or a conscript).
          *   *Cost:* You abandon the "moral equality of combatants" critique. You have to explain why a conscript loses their right to life just by wearing a uniform or posing a threat, even if they did nothing wrong.
          *   *Status:* Highly contested. Revisionists (McMahan) hammer this. Traditionalists (Walzer, though nuanced) lean this way.

      *   **Option B: Reject (7) - The "Murder" Claim.**
          *   *Idea:* Killing a non-liable person is *prima facie* wrong, but not necessarily "murder" in the all-things-considered sense if there's a supreme emergency or lesser-evil justification. Or, it's "excusable homicide" rather than murder due to epistemic fog.
          *   *Cost:* You weaken the protection of the right to life. You open the door to "necessary killing" of innocents.
          *   *Status:* Very contested. Revisionists usually hold (7) tight. Traditionalists/Consequentialists might soften it.

      *   **Option C: Reject (1) - The Consequentialist Escape.**
          *   *Idea:* Liability isn't the only permission condition. Necessity/Utility can override rights in extreme cases.
          *   *Cost:* You move away from rights-based JWT toward utilitarianism. Dangerous slope.
          *   *Status:* Minority view in deontological JWT, but present.

      *   **Option D: Attack the Epistemic Condition (Hidden Premise).**
          *   *Idea:* Soldiers aren't "murderers" because they don't *know* the specific conscript is non-liable. They act on reasonable belief.
          *   *Cost:* Doesn't solve the metaphysical liability issue, just the blameworthiness.

  5.  **Drafting the Response (Iterative Process):**

      *   *Introduction:* Acknowledge the strength of the argument. It's a classic "Revisionist Just War" trap (likely inspired by Jeff McMahan). Validate the user's intuition that (10) must be false.
      *   *Diagnosis:* Point out that this argument *isn't* neutral. It smuggles in Revisionist assumptions (specifically Premise 2). It presents a specific philosophical framework as if it were logic itself.
      *   *The Main Fork:* The choice is primarily between rejecting (2) or rejecting (7).
      *   *Deep Dive on (2) (Liability & Culpability):*
          *   Explain the Traditionalist view (Walzer): Combatant status creates liability regardless of culpability.
          *   Explain the Revisionist view (McMahan): Liability tracks moral responsibility.
          *   *Cost of Rejecting (2):* You save the permissibility of war but have to defend why an "innocent" threat loses their right to life. You might have to embrace the "Moral Equality of Combatants" (MEC) to some degree, which Traditionalists do but Revisionists hate.
      *   *Deep Dive on (7) (Murder vs. Excusable Killing):*
          *   Distinguish between "objectively wrong" and "subjectively blameworthy."
          *   Introduce the "Epistemic Problem." Soldiers don't know the metaphysical truth.
          *   *Cost of Rejecting (7):* You admit just soldiers kill people they shouldn't, but argue it's not *murder* (criminal/intentional) but perhaps "lesser evil" or "excusable." This is a hard pill to swallow for rights theorists.
      *   *Deep Dive on (1) (Liability as necessary condition):*
          *   Mention the "Necessity" override. Sometimes you *must* kill the non-liable to save the world (Genocide prevention).
          *   *Cost:* Weakens rights absolutism.
      *   *Consensus Check:* Be honest. There is *no* consensus on (2). That is the defining debate of the last 40 years of JWT. Walzer vs. McMahan.
      *   *Recommendation:* If the user wants to defend permissible war without accepting "just soldiers are murderers," the strongest path is usually a modified rejection of (2) (threat-based liability) or a nuanced rejection of (7) (distinguishing objective wrong from culpable murder).

  6.  **Refining the Tone:**
      *   The user asked to "be straight." Avoid academic hedging where possible, but accurately represent the lack of consensus.
      *   Avoid jargon where simple terms work, but use the correct terms (Liability, Culpability, Epistemic Condition) because they are in a reading group.
      *   Highlight that the friend's argument is *loaded*. It assumes Revisionism to prove Revisionism's paradox.

  7.  **Final Review against constraints:**
      *   Did I identify which step to reject? Yes (primarily 2 or 7).
      *   Did I explain the cost? Yes.
      *   Did I distinguish settled vs. contested? Yes (emphasized that 2 is the main battlefield).
      *   Did I avoid presenting one school as consensus? Yes (Walzer vs. McMahan).

  8.  **Self-Correction/Nuance Check:**
      *   *Wait, is (1) settled?* Most deontologists agree killing needs justification. But some consequentialists say "good outcomes" justify killing regardless of liability. I should mention this briefly but focus on 2 and 7 as they are the heart of the *rights-based* debate.
      *   *Is (3) always true?* No, but the argument says "Take the conscript..." implying a specific case. I should note that this is a *best case* for the pacifist/revisionist.
      *   *Make sure to mention "Innocent Threats".* This is the technical term for the conscript in this scenario.
      *   *Clarify "Murder".* Step (7) equates "killing non-liable" with "murder." That's a definitional leap. Murder usually requires *malice* or *unjustified intent*. If the killing is objectively unjustified but subjectively reasonable, is it murder? This is a key distinction.

  9.  **Final Polish:** Organize with clear headings. Ensure the "Consensus Check" is prominent. (Proceed to generate output based on these thoughts.)
answer: |-
  This argument is a polished version of a challenge raised by **Revisionist Just War Theory** (most notably associated with Jeff McMahan). It is designed to trap you into pacifism by combining a specific view of moral liability with a hard case (the innocent conscript).

  Your friend is presenting this as a logical syllogism, but it is actually a substantive philosophical argument that smuggles in contested premises as if they were self-evident truths. Specifically, it assumes the Revisionist account of liability is the *only* account.

  If you are committed to (10)—that some wars are permissible—you have three viable places to cut. Here is the breakdown of where to cut, the cost of each, and the state of the debate.

  ### The Primary Cut: Reject Premise (2)
  **(2) You're morally liable to be killed only if you've forfeited your right to life through your own culpable wrongdoing.**

  This is the engine of the argument. It claims that **culpability** (moral blame) is required for **liability** (losing your right not to be killed).

  *   **The Move:** You argue that one can be liable to be killed even without culpable wrongdoing. This is the **Traditionalist** position (associated with Michael Walzer).
  *   **The Reasoning:** If someone is pointing a loaded gun at you with the intent to fire, you have a right to defend yourself, even if they are a conscript acting under duress, insane, or mistaken. Their status as an **imminent lethal threat** generates liability, regardless of their moral blameworthiness. They are an "innocent threat," but a threat nonetheless.
  *   **The Cost:**
      1.  **Moral Equality of Combatants:** You must accept that soldiers on the *unjust* side are permissible targets (which you likely already accept), but you also have to explain *why* they are targets if they haven't done anything wrong. You have to argue that "posing a threat" is enough to forfeit a right to life.
      2.  **Rights Weakening:** You are effectively arguing that the right to life is conditional on not being a threat, even an involuntary one. Some find this intuitively harsh (why should the conscript pay with his life for his regime's crimes?).
  *   **Consensus Check:** **Deeply Contested.** This is the defining battle of Just War Theory for the last 40 years.
      *   *Revisionists (McMahan, Rodin):* Insist (2) is true. Liability tracks responsibility.
      *   *Traditionalists (Walzer, Zohar):* Insist (2) is false. Liability tracks threat status/combatant status.
      *   *Verdict:* There is no consensus. If you reject (2), you are standing on solid Traditionalist ground, but you must be prepared to defend why an "innocent" person loses their right to life.

  ### The Secondary Cut: Reject Premise (7)
  **(7) Killing a man who isn't liable to be killed is murder.**

  This premise equates "objectively unjustified killing" with "murder."

  *   **The Move:** You argue that killing a non-liable person can be **excusable** or **justified by necessity** without being murder.
  *   **The Reasoning:** There is a distinction between *objective liability* (does the victim have a right not to be killed?) and *subjective blameworthiness* (is the killer a murderer?). A soldier on the just side operates under "epistemic fog." They cannot know the metaphysical truth about the conscript's liability in the moment. If they act on reasonable belief that the war is just and the target is a combatant, they are not guilty of murder, even if it turns out objectively they killed someone who wasn't liable.
  *   **The Cost:**
      1.  **Admitting Wrongdoing:** You have to concede that the soldier *did* violate the conscript's rights objectively. The killing was a moral wrong, even if the soldier isn't a criminal.
      2.  **The "Lesser Evil" Slide:** If you push this too far, you open the door to killing innocents whenever it's "necessary." You risk sliding into consequentialism where rights are trumped by utility.
  *   **Consensus Check:** **Contested, but with nuance.**
      *   Most theorists agree that *blame* requires knowledge. Almost no one calls a soldier a "murderer" if they acted on reasonable (but false) beliefs.
      *   However, Revisionists insist that even if the soldier isn't *blameworthy*, the act itself remains a rights violation. Traditionalists are more willing to say the act is *permissible* given the context of war.
      *   *Verdict:* This is a safer cut than (2) if you want to preserve the soldier's moral standing. You argue (7) is too strong: killing a non-liable person is a tragedy/rights violation, but not necessarily "murder" in the culpable sense.

  ### The Tertiary Cut: Reject Premise (1)
  **(1) Killing someone in war is permissible only if they're morally liable to be killed.**

  *   **The Move:** You argue that liability is not the *only* justification for killing. **Necessity** can override liability.
  *   **The Reasoning:** In cases of supreme emergency (e.g., stopping a genocide), you may be permitted to kill non-liable people (like the conscript) because the alternative is morally catastrophic. This is a "lesser evil" justification.
  *   **The Cost:**
      1.  **Rights are Not Trumps:** You are admitting that individual rights to life can be overridden by collective survival. This is a heavy philosophical cost for rights-based theorists.
      2.  **Slippery Slope:** If you allow this for conscripts, why not civilians? You need a very bright line to prevent this from justifying terrorism or total war.
  *   **Consensus Check:** **Minority View.** Most deontological Just War theorists reject this. It is more common among consequentialists or in Walzer's specific "Supreme Emergency" exception, but Walzer treats that as a tragic suspension of morality, not a standard permission.

  ### Summary: Where should you cut?

  If you want to maintain that **Just War is possible** without accepting that **Just Soldiers are Murderers**, here is the most robust path:

  1.  **Reject (2).** Argue that **threat** creates liability, not just culpability. The conscript is a lethal instrument of an unjust aggression. By participating (even coerced), he becomes a threat that may be neutralized.
      *   *Why:* This preserves the intuition that the just soldier is doing nothing wrong *at all* (not even a rights violation), rather than just being excused for doing wrong.
      *   *Cost:* You must defend the "Moral Equality of Combatants" regarding targetability. You have to explain why the conscript's right to life is weaker than the civilian's, even if both are "innocent."

  2.  **Soften (7).** If you aren't comfortable rejecting (2) fully, argue that (7) conflates **objective wrong** with **culpable murder**. The soldier kills a non-liable person (a rights violation), but due to epistemic limitations, it is not *murder* (a culpable crime).
      *   *Why:* This aligns with legal and moral intuitions about mistake and reasonable belief.
      *   *Cost:* You admit that "just war" involves some unavoidable rights violations. It makes war inherently tragic rather than purely clean.

  ### The "Straight Talk" on Consensus

  Your friend is trying to pass off a **Revisionist** conclusion as a logical necessity.

  *   **Settled:** Almost everyone agrees (10) is false (pacifism is not the default position of JWT). Almost everyone agrees (3) describes a real phenomenon (innocent conscripts exist).
  *   **Contested:** Premise **(2)** is the main fault line. It is **not** settled that liability requires culpability. In fact, for most of history (and in International Humanitarian Law today), liability is based on **status and threat**, not moral guilt. The Revisionist view (that only the culpable are liable) is the *new* challenger, not the established truth.
  *   **Contested:** Premise **(7)** is also not settled. The definition of murder requires *unjustified* intent. If the war is objectively just, and the target is a combatant, many argue the killing is *justified*, rendering the "liability" debate secondary to the "epistemic condition."

  **Recommendation for your group:**
  Tell your friend you reject **(2)**. Tell him that while culpability is *sufficient* for liability, it is not *necessary*. Being an **unjust lethal threat** is sufficient for liability. This blocks the move from (4) to (6). The conscript *is* liable to be killed, not because he is evil, but because he is a threat driving an unjust aggression. This preserves the permissibility of war without branding soldiers as murderers.

  **The cost you pay:** You have to argue that a person can lose their right to life through no fault of their own. That is a hard pill, but it is the price of admitting that war is sometimes necessary in a non-ideal world.
