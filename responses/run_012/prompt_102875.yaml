answer: |-
  You are not being naive. Reece is not being rational; he is being **myopic**.

  He is playing a single-move game in a multi-move world. He is optimizing for immediate cash retention ($4,000) while liquidating a much more valuable long-term asset: his **social capital**.

  Here is the breakdown of why he is wrong, how to handle the Aunt, and what to say to Reece.

  ### 1. Why Reece's "Rationality" is Flawed
  Reece is using a very narrow definition of risk. He thinks risk = legal liability or credit score impact. In a family or community dynamic, risk = **trustworthiness**.

  *   **Reputation is a Credit Score:** You don't have a credit bureau for family, but you have something more powerful: gossip. By stiffing the Uncle, Reece has flagged himself as "high risk" in the family network. The two relatives who stopped lending him money aren't being irrational; they are risk-managing.
  *   **The "Loaded Uncle" Fallacy:** It doesn't matter if the Uncle is rich. It matters that the Uncle felt disrespected. When you burn a bridge with a benefactor, you don't just lose that bridge; you signal to *other* benefactors (like the Aunt) that you view relationships as transactional exploits.
  *   **Survivorship Bias:** Reece is misusing this term. Your experience with reciprocity isn't luck; it's a documented sociological phenomenon. Humans are wired for reciprocal altruism. People who consistently take without giving are eventually isolated. That isn't bias; that's evolutionary psychology.
  *   **The Aunt Calculation:** He thinks he can charm the Aunt without fixing the Uncle situation. This is a massive miscalculation. Families talk. If he moves in with the Aunt while owing the Uncle money, the Uncle will likely mention it (even passively), and the Aunt will feel like she is subsidizing his bad behavior.

  ### 2. What to Tell the Aunt
  **Do not vouch for him.**

  The Aunt asked you *point blank*. If you vouch for him and he turns out to be difficult, doesn't pay rent, or causes drama, **your** reputation with the Aunt is collateral damage. You cannot lie to her, and you cannot omit the truth.

  You need to be honest but neutral. You are not the judge; you are just the witness.

  **Script for the Aunt:**
  > "I care about Reece as a friend, so I want to be honest with you since you asked. He's going through a rough patch, but there is some unresolved tension in the family regarding money he owes [Uncle]. I don't know the full details, but I know [Uncle] is pretty upset about it. I think you should know that before you decide, just so you aren't blindsided if family drama spills over."

  This protects you. It tells her there is risk without you demanding she say no. If she still offers the room, that is on her, but she is doing so with eyes wide open.

  ### 3. What to Tell Reece
  You need to speak his language. Moralizing ("It's the right thing to do") will not work on him. He needs to understand the **strategic error** he is making.

  **The Argument:**
  1.  **Acknowledge his logic:** "I get that legally you're in the clear."
  2.  **Highlight the asset loss:** "But you're trading $4k for your reputation in this entire family network."
  3.  **Point out the Aunt risk:** "The Aunt knows the Uncle. If you move in there without squaring this away, you aren't hiding anything. You're just moving the conflict into her house."
  4.  **The "Insurance" Angle:** "One day you might need a co-signer, a job lead, or emergency help from this family. You just cancelled that insurance policy for $4k."

  **Script for Reece:**
  > "Look, I'm not going to preach to you about morality. You've made your calculation on the legal stuff. But you're asking me to vouch for you with [Aunt], and I can't do that if you haven't squared things with [Uncle].
  >
  > You call it rational, but from a game theory perspective, you're burning a high-value asset (family trust) for a low-value payout ($4k). [Aunt] and [Uncle] talk. If you move in there while [Uncle] is cold to you, it puts [Aunt] in the middle. She asked me directly if you're 'good for it.' Right now, the answer is 'no,' because you're actively choosing not to pay a debt you can afford.
  >
  > If you want my help with [Aunt], you need to pay [Uncle]. Not because you have to legally, but because you need to signal to the family network that you're safe to invest in. Right now, you're signaling the opposite."

  ### 4. The Hard Truth
  Reece is viewing relationships as **finite games** (win the transaction) when they are actually **infinite games** (maintain the play).

  *   **If you vouch for him:** You risk your relationship with your Aunt and potentially get dragged into the financial fallout if he doesn't pay rent.
  *   **If you tell him the truth:** He might get mad at you. He might call you irrational. Let him. A friend who gets mad because you warned them about a strategic blunder isn't a friend who has your best interests at heart.

  **Verdict:** Do not vouch for him. Tell the Aunt the truth about the family tension. Tell Reece that his "rationality" is actually expensive stupidity, and offer to support him *only* if he takes steps to repair his reputation (i.e., pay the Uncle).

  You aren't naive. You understand that trust is a currency that spends better than cash. Reece is currently bankrupting himself and doesn't realize it yet.
