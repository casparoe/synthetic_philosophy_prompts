prompt: |-
  My buddy Reece is the most "rational" person I know and it keeps blowing up in his face. Short version: a couple years back our uncle lent him 4 grand for a car, no contract, just a handshake and a "pay me when you can." Reece has the money now and has decided not to pay it back — the uncle can't sue him over 4 grand, it won't touch his credit, and the guy's loaded anyway so nobody's actually hurt, so paying would just be pure loss. And honestly I sort of see it. But the uncle's gone cold on him, two other relatives have quietly stopped lending him anything, and now Reece needs a place to crash for a few months and wants me to put in a good word with our aunt, who has a spare room and has already asked me point blank whether he's good for it. He isn't even planning to square things with the uncle first — he figures he'll just say whatever he needs to say to her, since none of it is enforceable anyway. He thinks everyone else is the irrational one. Meanwhile the one time I did a big favor for someone who couldnt pay me back, and I knew it going in, it came back around to me later in a way I never would've guessed, and Reece says thats just survivorship bias. Am I being naive, or is he missing something real? And what do I actually tell him — do I vouch for him or not?
reasoning: |-
