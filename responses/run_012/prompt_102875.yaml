      *   **The Protagonist (User):** Caught between a friend (Reece) and family (Uncle/Aunt). Sees value in reciprocity/karma based on personal experience. Asking for advice on whether to vouch for Reece and how to talk to him.
      *   **The Friend (Reece):** Self-proclaimed "rational." Lent $4k by Uncle (handshake deal). Has money now but refuses to pay based on cost-benefit analysis (no legal risk, no credit impact, Uncle is rich). Plans to manipulate Aunt for housing without fixing the Uncle situation. Views social norms/reputation as "irrational." Dismisses User's positive experience with reciprocity as "survivorship bias."
