answer: |-
  Here are the desiderata for a theory of the Value of Information (VoI), structured to expose the fault lines in your protagonist's intellectual world.

  ### The Desiderata

  **1. The Ignorance Baseline (The Option to Disregard)**
  *   **Requirement:** The theory must distinguish between *receiving* information and *utilizing* it. It must formally represent the agent's ability to act as though the information was never received.
  *   **The Case:** I. J. Good's theorem relies on this. If an agent can bin the data and choose the action optimal for the prior, expected utility cannot decrease.
  *   **Status:** **Non-negotiable (Formal).** Without this, the mathematics of decision theory collapses into determinism.
  *   **Character Ruling:** Rules out the **Compulsive Updater**. This is the character who *cannot* help but act on new data, even when they know it is noise or harmful. A theory that honors this requirement declares them irrational or cognitively bounded, not a standard agent.

  **2. Ex-Ante vs. Ex-Post Valuation**
  *   **Requirement:** The theory must strictly separate the *expected* value of information (before seeing the content) from the *realized* value (after seeing the content).
  *   **The Case:** A medical test has positive ex-ante value (it guides treatment) but can have negative ex-post value (the diagnosis causes despair that outweighs the treatment benefit). Good's theorem applies only to the ex-ante expectation.
  *   **Status:** **Non-negotiable (Temporal).** Confusing these two is a category error.
  *   **Character Ruling:** Rules out the **Regretful Prophet**. This character judges the rationality of the decision to know solely by the pain of the outcome. A coherent theory must allow that it was rational to look, even if the result was devastating.

  **3. Utility Invariance (State-Independence)**
  *   **Requirement:** The theory must specify whether the utility of an outcome depends *only* on the state of the world or also on the agent's *knowledge* of that state.
  *   **The Case:** In standard theory, $U(\text{Healthy})$ is constant. In your novel, $U(\text{Healthy} | \text{Know I was at risk})$ may differ from $U(\text{Healthy} | \text{Ignorant})$. If knowledge alters the utility function (e.g., via anxiety, betrayal, or loss of innocence), VoI can be negative.
  *   **Status:** **Camp Commitment (Standard EU vs. Behavioral).** Standard Decision Theory assumes invariance. Behavioral/Philosophical accounts reject it.
  *   **Character Ruling:** Rules out the **Pure Instrumentalist**. This character views information solely as a tool for navigation. If this requirement is rejected (i.e., if knowledge changes the value of the destination), the Instrumentalist is revealed as a fiction.

  **4. Dynamic Consistency**
  *   **Requirement:** The agent's plan at time $t_0$ (to acquire or reject info) must align with their preferences at time $t_1$ (after acquiring info). They should not wish to "un-know."
  *   **The Case:** If an agent pays to avoid information ex-ante, but upon receiving it accidentally wishes they had known, they are dynamically inconsistent. A robust theory should either forbid this preference reversal or model the cost of precommitment required to prevent it.
  *   **Status:** **Camp Commitment (Rational Choice).** This is a core axiom of standard rationality, often violated in human psychology.
  *   **Character Ruling:** Rules out the **Time-Inconsistent Hedonist**. This character wants to know tomorrow but wishes they hadn't today. A theory honoring this requirement treats them as two different agents at war, not one coherent self.

  **5. The Cost of Processing (Bounded Rationality)**
  *   **Requirement:** The theory must account for the cognitive cost of integrating information, distinct from the cost of acquiring it.
  *   **The Case:** Information that is too complex to process has negative value (it induces decision paralysis or error). "Free" information is not free if it consumes finite cognitive bandwidth.
  *   **Status:** **Non-negotiable (Physical/Computational).** Any agent with finite memory or processing speed must satisfy this.
  *   **Character Ruling:** Rules out the **Omniscient Calculator**. This character treats information as costless to store and sort. Honoring this requirement forces the protagonist to acknowledge her own cognitive limits.

  **6. Strategic Ignorance (Precommitment Value)**
  *   **Requirement:** The theory must allow that not knowing can be a strategic asset, specifically in interactions with other agents or future selves.
  *   **The Case:** In game theory (e.g., Schelling points, deterrence), being unable to know a secret can make a threat credible. If you *could* know, you might be tempted to defect. Ignorance binds you.
  *   **Status:** **Camp Commitment (Game Theory).** Standard single-agent VoI often ignores this; multi-agent theory requires it.
  *   **Character Ruling:** Rules out the **Lone Wolf**. This character assumes her decisions affect only her. Honoring this requirement implies her refusal to know is a signal to others, making her isolation impossible.

  **7. Veritistic Value (Truth as a Good)**
  *   **Requirement:** The theory must state whether truth has intrinsic value independent of its instrumental utility.
  *   **The Case:** Many agents prefer to know the truth even if it lowers their expected welfare (e.g., knowing the time of their death). A purely instrumental theory cannot explain paying for useless truth.
  *   **Status:** **Camp Commitment (Epistemic/Philosophical).** Standard EU theory assigns zero value to truth unless it changes action.
  *   **Character Ruling:** Rules out the **Pragmatist**. This character believes a belief is only valuable if it pays rent. Honoring this requirement validates the **Truth-Seeker**, who pays for knowledge she cannot use.

  ---

  ### The Fracture Lines (Inconsistencies)

  You asked for explicit contradictions. The list above contains a fundamental tension that cannot be resolved within a single coherent agent model:

  **The Conflict:** **Dynamic Consistency (4)** vs. **Utility Sensitivity (3)**.
  If you honor **Utility Sensitivity** (knowledge changes how much you enjoy the outcome), then **Good's Theorem** fails; information *can* have negative expected value. However, if information has negative expected value, a **Dynamically Consistent** agent will pay to avoid it ex-ante. But once the information is revealed (involuntarily), the agent suffers. If the agent then wishes they hadn't known, they are not dynamically inconsistent—they are just suffering. The inconsistency arises if the agent *seeks* the information ex-ante (perhaps due to **Veritistic Value (7)**) but suffers ex-post due to **Utility Sensitivity (3)**.
  *   **The Impossibility:** You cannot have a theory that says (A) "It is rational to seek truth regardless of cost" and (B) "It is irrational to act against your own welfare" and (C) "Truth can reduce welfare." Your protagonist lives in the triangle of this contradiction.

  **The Conflict:** **The Ignorance Baseline (1)** vs. **Psychological Realism**.
  Formally, an agent can "ignore" information. Psychologically, your protagonist cannot. A theory that honors the **Ignorance Baseline** treats the human mind as a file cabinet (you can leave the folder closed). A theory that honors **Psychological Realism** treats the mind as a chemical bath (the dye spreads). You cannot satisfy both.

  ---

  ### Assessment of Theories

  **Standard Expected-Utility (Bayesian) Theory:**
  It satisfies **Ignorance Baseline**, **Ex-Ante/Ex-Post**, and **Dynamic Consistency**. It delivers the clean result your protagonist knows: *Free information is never harmful.* However, it fails **Utility Sensitivity** and **Veritistic Value**. It treats your protagonist's dread as a "preference anomaly" or a "cost of processing," effectively legislating away the emotional core of your novel. It renders her hesitation a calculation error.

  **The Dissenters (Behavioral, Epistemic, and Game-Theoretic):**
  These accounts satisfy **Utility Sensitivity**, **Strategic Ignorance**, and **Veritistic Value**. They allow information to be poisonous. However, they often sacrifice **Dynamic Consistency**. They describe an agent who is fragmented over time—one self who wants to know, another who wishes she hadn't. They offer a richer description of your protagonist but at the cost of calling her "irrational" by standard lights.

  ---

  ### The Single Requirement & The Character

  The single requirement that does the most to exclude the tidy theories is **Utility Sensitivity (3)**: *The demand that the theory account for outcomes where the utility of a state depends on the agent's knowledge of that state.*

  Standard decision theory assumes $U(World)$ is fixed and information only changes $P(World)$. If you honor **Utility Sensitivity**, you break the proof that information is non-negative. You allow for the possibility that knowing the future makes the future worse, not because it changes what you *do*, but because it changes what the outcome *is* to you.

  **Which character does this rule out?**
  It rules out the **Pure Bayesian**. She is the character who believes she is a transparent window onto the world, unaffected by what she sees. She believes her utility function is stable. If your protagonist honors **Utility Sensitivity**, she admits she is not a window, but a reactive medium. The Pure Bayesian cannot exist in a world where knowledge alters value; she is a ghost in a machine that doesn't exist. Your protagonist, by struggling with this, proves she is more real than the theory allows.
