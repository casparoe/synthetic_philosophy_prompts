          2.  Address the Small Improvement Argument (SIA). Show why Equality fails (transitivity).
          3.  Address the Sorites/Vagueness objection. Distinguish epistemic from ontological.
          4.  Commit to a view (Parity vs. Vagueness). (I should probably argue for Parity or at least show why Vagueness fails to capture the normative force). Let's aim for a nuanced defense of Parity as distinct from vagueness.
          5.  Discuss implications: Rationality (will-based reasons) and Regret (agent-regret vs. outcome regret).
      *   *Tone:* Analytic, rigorous.

  5.  **Drafting the Marking Scheme:**
