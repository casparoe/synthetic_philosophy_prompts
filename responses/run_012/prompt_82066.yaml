      *   **Constraints/Requirements:**
          *   Question must force students to distinguish "can't tell which is better" (epistemic) from "neither is better" (ontological/metaphysical).
          *   Question must force students to commit on whether there's a fourth relation (parity) vs. vagueness/sorites.
          *   No name-dropping required (focus on reasoning, not history of philosophy).
          *   Model answer must be high quality, not just gesturing.
          *   Marking scheme must differentiate A from B work.
          *   Tone: Respectful of the personal context but focused on the pedagogical task.

  2.  **Deconstruct the Philosophical Problem:**
      *   **Core Issue:** Incommensurability vs. Parity vs. Vagueness.
      *   **The Argument Presented:** The "Small Improvement Argument" (often associated with Ruth Chang).
          *   Premise 1: S (Surgery) and C (Comfort) are not better than each other.
          *   Premise 2: S+ (Surgery + 1 day) is better than S.
          *   Premise 3: S+ is not better than C (one day doesn't bridge the gap).
          *   Conclusion: S and C are not equal (because if S = C, and S+ > S, then S+ > C by transitivity).
          *   Result: S and C are "on a par" (a fourth relation).
      *   **The Counter-Argument (The Friend's Twist):** Sorites Paradox.
          *   If you keep adding days, eventually S+++... > C.
          *   No single day makes the difference.
          *   Therefore, "on a par" might just be vagueness/ignorance about where the threshold lies, not a distinct normative relation.
      *   **Key Distinctions:** Epistemic uncertainty (I don't know) vs. Ontological indeterminacy/Parity (There is no fact of the matter/They are comparable but not by betterness).
      *   **Implications:** Rationality of choice, regret.

  3.  **Drafting the Exam Question:**
