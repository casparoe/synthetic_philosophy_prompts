      *   *Check Constraints:* No names required in question. Model answer shouldn't rely on names either (focus on arguments).
      *   *Philosophical Accuracy:* The "Small Improvement Argument" is indeed the core here (Ruth Chang's work). The friend's counter is the Sorites objection. The distinction between "incomparable" (no common measure) and "on a par" (comparable but not by better/worse/equal) is crucial. The prompt asks to separate "can't tell" from "neither is better".
      *   *Model Answer Strategy:* I will write the model answer arguing *for* the fourth relation (Parity) because it allows for a richer discussion of rationality (creating reasons) than vagueness does, but I will acknowledge the Sorites challenge. This demonstrates "doing the reasoning."

