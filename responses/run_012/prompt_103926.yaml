  I arrive at this by treating the "irrational" verdict as requiring the conjunction of three strong Savagean assumptions. If any one of them fails, permissibility opens up. I assess the probability of each assumption holding (which lowers my permissibility score) and derive the final figure from the failure of that conjunction. However, to map directly to your five decomposition points, I have assigned a probability to the *permissibility-supporting* resolution of each question below. These average to a baseline confidence, which I adjust slightly for the coherence of the alternative models.

