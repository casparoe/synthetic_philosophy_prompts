      *   *Moral Weight:* Even if particles count, their weight is likely infinitesimal. $Infinity \times 0$ is undefined, but $Huge Number \times Tiny Value$ might still be less than $Small Number \times Huge Value$.
      *   *The "Combination Problem":* How do micro-experiences make macro-experiences? If they don't combine, the "sum" is disjointed.

