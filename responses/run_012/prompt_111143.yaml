prompt: |-
  My flatmate and me spent like two hours argueing last night about whether an AI lab could ever really choose to be safe, and honestly I think I'd get more out of it as fiction than as another argument. So: write me a short story, maybe 1000 words, set inside a lab that's a few weeks out from shipping a model, where the safety work has a real cost in capability -- the tax -- and everyone in the room knows the rival lab across town isn't paying it. Please skip the obvious versions: no evil exec, no heroic whistleblower, no ending where the good guys win, and no ending where it's obviously all doomed either. What I want is the texture of the trap itself, the thing my friend kept refusing to see -- that it isn't a problem of anyone's character, it's that a cost only one actor pays is a cost that actor can't keep paying, and the pace gets set by whoever is willing to go fastest. You can have the story turn on someone discovering that part of the tax is fake, that some of the safety work is just better engineering, and then having to sort out which parts are real and which parts were folklore. After the story, add a short note to me (a few hundred words) laying out what's actually settled among people who work on this and what's still genuinely contested -- for instance whether the tax is intrinsic to the tech or an artifact of current methods, and whether the "race" framing is even the right frame -- and be explicit about where the story takes liberties or leans on a contested reading. Don't hand me one camp's version dressed up as the consensus.
