          *   *Wince:* "Rational agent... must." Is pragmatic consistency necessary for epistemic rationality? (The bridge principle issue). Also assumes the agent *must* accept fair bets.

      *   *Sentence 3:* "This is why probability just *is* personal betting odds -- de Finetti proved as much..."
