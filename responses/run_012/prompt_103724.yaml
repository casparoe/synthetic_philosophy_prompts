      *   *Sentence 4:* "...so any coherent set of odds is as good as any other, and there's no such thing as an objectively correct degree of belief."
          *   *Verdict:* Non-sequitur. Coherence is necessary, not sufficient for "goodness." Objective Bayesians exist. This is a philosophical add-on, not a result of the math.
          *   *Wince:* Equivocates on "rational."

      *   *Sentence 5:* "The same argument shows your beliefs also have to cohere across time: if you change your mind in a way that would have lost you money, your earlier beliefs were already irrational."
          *   *Verdict:* Highly controversial. Diachronic DBAs (Conditionalization) are much weaker than synchronic ones.
          *   *Wince:* "The same argument." It's not the same. It requires extra assumptions (strategy of the bookie, awareness of update rule). "Earlier beliefs were already irrational" is too strong; maybe the update rule was the problem.

