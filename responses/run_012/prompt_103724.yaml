      *   *What is it taken to establish?* Often taken to prove that rationality *requires* probabilism. Sometimes taken to prove that probability *is* nothing but betting dispositions (operationalism). Sometimes taken to prove subjective Bayesianism (no constraints on priors other than coherence).
      *   *Where do they come apart?*
          *   **Pragmatic vs. Epistemic:** DBA is pragmatic (money loss). Rationality is often thought to be epistemic (truth/accuracy). Why should avoiding money loss define epistemic rationality? (The "Why care?" objection).
          *   **Coherence vs. Calibration:** DBA ensures internal consistency, not external accuracy. A coherent set of beliefs can be wildly wrong. The gloss implies "any coherent set is as good as any other." DBA supports coherence, not the lack of objective constraints *per se*, though Subjective Bayesians use it that way.
          *   **Betting Interpretation:** DBA relies on a link between credence and betting price. Is credence *defined* by betting price, or merely *measured* by it? De Finetti leaned towards definition/operationalism, but many modern epistemologists see them as distinct.
          *   **Diachronic:** The standard DBA is synchronic. Diachronic DBAs (Conditionalization) exist (Lewis/Teller), but they are much more controversial. They rely on specific assumptions about the betting scenario (e.g., the bookie knows the update rule).
          *   **Subjectivism:** The claim "no such thing as an objectively correct degree of belief" is a philosophical stance (Subjective Bayesianism), not a mathematical theorem derived from DBA. DBA says "be coherent." It doesn't say "anything goes" unless you add the premise "there are no other constraints." Objective Bayesians accept DBA but reject "anything goes."

  3.  **Sentence-by-Sentence Analysis Plan:**

