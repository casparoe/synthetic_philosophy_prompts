answer: |-
  ### The "Afternoon" Social Construction Decision Procedure

  This procedure is designed to bypass the "real vs. made up" deadlock. It distinguishes between things we measure (facts), things we define (conventions), and things we create by measuring (looping effects). It forces a decision on *who* owns the definition and *where* the category belongs (standard survey vs. policy module).

  **Warning on Misfires:** This procedure will not resolve political conflict. If a stakeholder demands a category for legal recognition (e.g., reparations, anti-discrimination law), philosophical purity will lose to legal mandate. Use this to clarify *how* to measure, not *whether* to comply with the law. It also assumes your team has the capacity to negotiate; if you are understaffed, "Negotiate" defaults to "Chief Statistician."

  #### Table 1: The Decision Procedure

  | Step | Question | What counts as a good enough answer | If no or unclear, then | Fact call or values call |
  | :--- | :--- | :--- | :--- | :--- |
  | **1. The Lights-Out Test** | If the government shut down tomorrow and stopped talking about this, would the category still exist in the same way? | **Yes:** It exists independently (e.g., biological age, location).<br>**No:** It depends on our rules (e.g., marital status, employment status). | If **No**, move to Step 2. It is socially constructed. | **Fact Call** (Ontological status) |
  | **2. The Label Effect Test** | Does assigning this label to a person change their behavior or status in a way that alters future data? (The Looping Effect) | **Yes:** The classification creates the reality (e.g., "Unemployed" triggers benefits which change status).<br>**No:** The label describes a static state. | If **Yes**, you must negotiate with the classified group. You cannot define this unilaterally. | **Fact Call** (Causal mechanism) |
  | **3. The Boundary Authority Test** | Who is best positioned to know where the line is drawn: the expert with a ruler, or the person being classified? | **Expert:** Physical metrics (height, income).<br>**Subject:** Internal state or social identity (gender, ethnicity, distress). | If **Subject**, the survey must allow self-identification. Do not use observer coding. | **Fact Call** (Epistemological access) |
  | **4. The Stability Test** | Is this category stable enough for a *standard* classification, or does it change with political winds? | **Stable:** Changes slowly (demographics).<br>**Volatile:** Changes by executive order or crisis (policy flags). | If **Volatile**, do not put it in the standard taxonomy. Create a temporary supplemental module. | **Values Call** (Operational risk) |
  | **5. The Purpose Test** | Are we adding this to *describe* the population or to *allocate* resources? | **Describe:** Needs high validity/reliability.<br>**Allocate:** Needs clear legal definitions for eligibility. | If **Allocate**, hand off to the Chief Statistician. This is a policy tool, not a statistical fact. | **Values Call** (Mission scope) |

  ***

  #### Table 2: Application to Proposals

  | Proposal | Verdict (natural / causally constructed / constitutively constructed / both / neither) | The test that decided it | Who we'd have to negotiate with | What breaks downstream if we get it wrong | Confidence | What the procedure couldn't settle |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Nonbinary Sex Option** | Constitutively Constructed | **Step 3 (Boundary Authority):** Biological markers do not capture gender identity; only the subject knows. | LGBTQ+ advocacy groups & Medical advisory board | Legal mismatch (ID vs. Survey); Time-series break if methodology changes. | High | Whether "Sex" and "Gender" should be separate questions (Legal mandate vs. Best Practice). |
  | **Essential Worker Flag** | Politically Constructed (Policy Tool) | **Step 4 (Stability):** "Essential" changes by executive order, not labor market reality. Not a stable demographic trait. | Dept. of Labor & Emergency Management | Funding formulas lock in temporary definitions; Data becomes obsolete post-crisis. | High | **This is the uncomfortable one:** The verdict is "Do not add to standard classification." It belongs in a crisis module. |
  | **Food Desert** | Causally Constructed (Derived Metric) | **Step 1 (Lights-Out):** "Desert" is a policy definition based on distance/income, not a natural feature. | Public Health & Urban Planning depts | Geocoding errors misclassify eligibility; Survey respondents cannot accurately self-report this. | Medium | Whether to ask respondents (unreliable) or calculate from address (expensive). Procedure says calculate, budget says ask. |

