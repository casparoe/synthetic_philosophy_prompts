prompt: |-
  My grandad died three weeks ago, he was 84, and I've ended up being the one doing the eulogy at the crematorium on Friday and then a few more words at the wake in the social club where he drank every night for about fifty years. The complication is that he was a communist his whole life — joined up in his twenties, sold the paper outside the gates, had the books on the shelf with the spines all broken — and he was dead set against what he'd have called mumbo jumbo. No heaven, no looking down on us, no saying he's still here in spirit. He told me once that he didn't believe in souls, he believed in wages and rent and who owns the machines, and that if you want to understand why a person turns out how they turn out you look at the conditions they lived under, not at their character. So half the room on Friday will be old comrades from the branch, and they'll be listening for exactly that, and they'll wince if I start going on about his beautiful soul or his journey or what he taught us about love. The other half is family: his sister, who's fairly religious and wants to hear that he's at peace; my mum; my cousins; an uncle who's a mortgage broker and thinks the whole communist thing was a phase he never grew out of; and my nan's side, who never really forgave him for the politics. There's an extra thing hanging over the day as well. He left the house to be split between the three kids and there's already a proper row brewing about selling it, and after the crematorium everyone's going back to stand around in the front room of that house, which he bought in 1964 with money from the plant. The row is about money but nobody will say so, they'll all say it's about what he would have wanted.

  What I keep going round in circles about is how to say anything true. I want a eulogy he wouldn't have thought was rubbish — so nothing that treats his decency as a free-floating quality of his soul, everything tied back to the life he actually lived, the job, the strike, the years on the sick, the way he was with us kids. But I don't want to do the other thing either, where you explain a man entirely by his circumstances, because my mum will hear that as me saying he had no choices, that he was just a product, and it'll hurt her — and honestly I'm not sure it's even true, since the fella next door had the same job and the same money and turned out a mean old bastard. Then a mate of mine who's in a reading group said something that's been stuck in my head. He said that in the Marxist way of thinking the family and the household aren't just the soft bit sitting on top of the economy — that some people argue the home is actually part of the base, because that's where the worker gets made and fed and washed and sent back out to work every morning, and where the next lot of workers get raised. Which, if you take it seriously, means the house and the marriage and the way he was with us isn't decoration on top of the economic story, it's the same story. I don't know if that's right and I don't need the history of the argument or who said it, I just want to know how to use it.

  So what I'm asking for is the eulogy itself, a real draft I can stand up and read, about five minutes, that works for both halves of that room. The base and superstructure thing has to be doing the actual work in it — shaping what I can and can't say about him, and letting me talk about the house and the money and the row without either turning his life into a lecture or pretending the money isn't the reason everyone's standing in that front room — and it has to do that without the words base or superstructure ever coming out of my mouth, because the family will switch off and the comrades will think I'm showing off. Don't give me quotes or who-said-what, I'd only get the attribution wrong and then stand there looking stupid, and don't send me off to read anything, I've got until Friday. Just the speech, and then a short paragraph at the end telling me the hard calls you made — where you decided to keep him explained by his conditions and where you let him be something more than that, and which bits of the room you were aiming at with which bit.
reasoning: |-
  Here's a thinking process that leads to the suggested eulogy and analysis:

  1.  **Analyze the Request:**
      *   **Deceased:** Grandad, 84, lifelong communist (joined in 20s, sold papers, read theory), atheist/materialist (no soul, no heaven, beliefs rooted in wages/rent/ownership).
      *   **Occasion:** Eulogy at crematorium (Friday) + brief words at wake (social club). *Focus is on the crematorium eulogy (5 mins).*
      *   **Audience:** Split room.
          *   Half 1: Old comrades (expect materialist analysis, wince at "soul/spirit/love" talk).
          *   Half 2: Family (Sister/religious, Mum, Cousins, Uncle/mortgage broker, Nan's side/anti-communist).
      *   **Conflict:** Inheritance dispute over the house (bought 1964 with plant money). Everyone gathering there after. Tension about money disguised as "what he would have wanted."
      *   **Constraint 1 (Philosophical):** Must honor his materialist worldview (conditions shape character) without reducing him *only* to a product of circumstances (which hurts Mum/implies no agency).
      *   **Constraint 2 (Theoretical):** Use the concept of "base/superstructure" (specifically the idea that the home/family is part of the economic base, not just decoration) *without* using the terms "base" or "superstructure."
      *   **Constraint 3 (Tone):** No jargon, no lectures, no false spiritualism, no ignoring the money tension.
      *   **Deliverables:** 1. The Eulogy Draft (5 mins). 2. A short paragraph explaining the hard calls made (where I balanced conditions vs. agency, and who I was addressing).

  2.  **Deconstruct the "Base/Superstructure" Constraint:**
      *   *Standard Marxist view:* Economy (base) determines culture/family/ideas (superstructure).
      *   *User's Friend's view (Feminist Marxist critique):* The home *is* the base. Reproduction of labor happens there. Feeding, washing, raising kids = economic work.
      *   *Application:* I need to frame the house, the family dinners, the raising of children, and the inheritance not as "soft emotional stuff" separate from his politics, but as the *actual site* where his politics were lived and reproduced. The house isn't just an asset; it's the factory where the family was made. This bridges the gap between the comrades (who see economics) and the family (who see the home).

  3.  **Drafting - Section by Section:**

      *   **Opening:** Acknowledge the lack of heaven immediately. Respect his atheism. Set the materialist tone without being aggressive.
      *   **The Man & His Politics:** Acknowledge the communism. Don't apologize for it (for the comrades) but frame it as care (for the family).
      *   **The "Theory" Integration (The Home):** This is the crux. Connect the factory/plant to the house. He worked to build the house, but the house was where the *work* of family happened. This validates the inheritance tension without naming it as greed. It frames the house as a collective project.
      *   **Agency vs. Conditions:** Acknowledge the hard times (conditions) but highlight his choices within them (agency). He wasn't just a victim of capitalism; he fought it. This satisfies Mum (he had choice/decency) and Comrades (he fought the system).
      *   **The Inheritance/The Row:** Address the elephant in the room. The house is the legacy. It's brick and mortar, not spirit. Disputes over it are real, not spiritual. Frame it as a responsibility to maintain what he built, rather than just dividing assets.
      *   **Closing:** Bring it back to memory and action. No "looking down." We carry the work forward.

  4.  **Refining the Tone:**
      *   *Avoid:* "He's in a better place," "His spirit lives on," "Base/Superstructure," "Means of Production" (too jargon-y), "Dialectical."
      *   *Use:* "Brick and wood," "Wages," "The table," "The work," "Conditions," "Choice."
      *   *Voice:* Respectful, grounded, slightly weary but firm. Like him.

  5.  **Drafting - Specific Lines (Mental Sandbox):**
      *   *Idea:* Talk about the house bought in '64.
      *   *Phrasing:* "This house behind us... he bought it with money from the plant."
      *   *Connecting to theory:* "It wasn't just a shelter. It was where we were fed so we could go out and face the world." (This hits the social reproduction angle).
      *   *Addressing the row:* "There's talk about what to do with it. That's a practical question. He liked practical questions."
      *   *Addressing the soul:* "He didn't believe in ghosts. He believed in us."

  6.  **Review against Constraints:**
      *   5 minutes? ( approx 700-800 words spoken at a moderate pace).
      *   No "base/superstructure"? Checked.
      *   Honors atheism? Checked.
      *   Honors family tension? Checked (acknowledged without exploding it).
      *   Honors comrades? Checked (materialist focus).

  7.  **Writing the "Hard Calls" Paragraph:**
      *   Need to explain *why* I wrote certain bits.
      *   *Agency vs. Conditions:* I focused on his *response* to conditions. He had the same job as the neighbor, but chose solidarity. That saves Mum's feelings.
      *   *The House:* Framed as a site of labor (feeding/washing) to satisfy the theoretical constraint without jargon. This makes the inheritance dispute about "maintaining the work" rather than "getting cash."
      *   *Audience:* Comrades get the materialism; Family gets the love expressed through provision.

  8.  **Final Polish:** Check the rhythm. Ensure the transition from the political to the personal feels seamless. Make sure the ending lands firmly on the living, not the dead. (Self-Correction: Make sure I don't sound *too* cold. He was a grandad, not just a theorist. Add a bit about how he was with kids.)

