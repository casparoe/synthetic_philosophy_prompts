answer: |-
  **Eulogy Draft**

  Thank you for coming. For those who knew him well, you'll know he wouldn't want me to start by saying he's watching us now, or that he's at peace in a better place. He didn't believe in places like that. He believed in this place. He believed in the here, and the now, and the people standing in it.

  He was a man who thought the world was built on concrete things. Wages, rent, the hours on the clock, the ownership of the machines. He joined the party in his twenties because he looked at how people were treated and decided it wasn't right, and he never wavered on that. I know for some in this room, that label was difficult. For others, it was the most important thing about him. But if you strip away the badges and the papers he sold outside the gates, what you're left with is a man who thought that decency wasn't a magic spark inside you. He thought decency was something you built, like a wall or a table, through the way you lived and the choices you made when things were hard.

  We often separate a man's work from his home. We think of the factory or the office as the real world, and the house as the soft place you go to rest. But Grandad didn't see it that way. He bought this house in 1964 with money from the plant, yes, but he knew the house was work too. This was the place where the workers were fed. Where the clothes were washed. Where the next generation were raised and sent out to face the same world he fought against. He understood that the kitchen table was as vital as the shop floor. If you want to understand who he was, you don't look for a soul floating in the ether; you look at the brick and wood he secured for us, and the way he made sure there was food on that table even when the strike pay was thin.

  I know there are difficult conversations ahead about what happens to that house. We're all going back there shortly. He would have appreciated that we're being honest about the practicalities. He didn't believe in hiding behind polite fictions. That house isn't just an asset; it's the physical record of his labour and yours. It's the structure that held the family. Disagreements about its future aren't a betrayal of his memory; they're a continuation of the hard, practical work of sustaining what he built. He knew that resources are finite, and that how we divide them matters. He would want us to handle it without lies, just as he handled the union negotiations—clear-eyed, and focused on what sustains the people involved.

  There was a neighbour once, a man with the same job, the same wages, the same conditions, who turned out bitter and mean. Grandad used to say that circumstances shape us, but they don't excuse us. You have to choose what you do with the hand you're dealt. He chose solidarity. He chose to read, to argue, to listen to us kids even when he was tired from a double shift. He chose to be kind, not because it was easy, but because he thought it was necessary for the world to keep turning.

  So, we aren't here to send him off to a heaven he didn't believe in. We are here to acknowledge the work he finished. The books are on the shelf, the house is standing, and we are here. The best way to honour him isn't to pray for him, but to look after the things he valued. Look after the family. Look after the house. And look after each other, not because it's spiritual, but because it's the only way the work gets done.

  Thank you.

  ***

  **The Hard Calls**

  I anchored the "base/superstructure" concept in the description of the house as a site of labour ("where the workers were fed... clothes were washed") rather than using the theoretical terms. This tells the comrades you understand the material function of the home without alienating the family with jargon. I addressed the inheritance row by framing the house as "physical record of his labour" and the dispute as "practical work," validating the tension as something he would have respected (honest negotiation) rather than a moral failing. To balance agency vs. conditions for your mum, I used the neighbour anecdote: acknowledging conditions shape us, but insisting he *chose* kindness within them. This preserves his dignity as a moral agent while keeping the materialist framework intact for the branch members.
