      *   **Problem:** False positives (bad maxims pass) and false negatives (harmless maxims fail).
      *   **Task:** Treat this formalization as a philosophical position. Critique it. Sort objections (Fatal -> Awkward). Categorize objections (Individuation artifacts, Formal test limits, Concessions). Evaluate insulation/qualifications. Address the "scientist's instinct to operationalize."

