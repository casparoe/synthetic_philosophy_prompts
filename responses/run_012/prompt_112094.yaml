answer: |-
  Here is a reconstruction of how Hobbes might engage with these developments, followed by an assessment of the viability of his position today.

  ***

  ### I. The Three Verdicts

  To reconstruct Hobbes's response, we must hold fast to his central epistemological thesis: *Scientia* (demonstrative knowledge) is possible only where the knower is the maker. We know geometry certainly because we posit the definitions and generate the figures by the motion of our own imagination. We know physics only conjecturally because the world is God's artifact, not ours. Reasoning itself is nothing but "reckoning"—the adding and subtracting of the consequences of general names.

  #### 1. Non-Euclidean Geometry: The Shattering of the Universal Frame
  **The Development:** We have discovered consistent geometries where the parallel postulate fails. We have further discovered that physical space (spacetime) is not necessarily Euclidean.
  **The Hobbesian Verdict:** *Vindicated in principle, refuted in application.*

  Hobbes would seize upon the first implication with glee. The existence of non-Euclidean systems proves that geometry is indeed a creature of human definition, not a discovery of divine archetypes. He would argue: "Behold, these new geometries are but different covenants of speech. We define a 'line' differently, and the consequences differ. This confirms my thesis that truth is not in the things, but in the proposition."

  However, he would recoil from the second implication: that physical space *is* non-Euclidean. For Hobbes, the geometry of Euclid is not merely one system among many; it is the necessary structure of quantity as conceived by human motion. If the physicist claims the universe follows Riemannian metrics, Hobbes would accuse him of conflating *science* with *conjecture*. He would say: "You measure the shadows of God's work and call it geometry. That is physics, and it is uncertain. True geometry is the measure of our own constructs."

  Yet, here he is cornered. If the "space" of our experience (the container of bodies) does not obey Euclid, then the "phantasms" of our imagination do not map onto the "universal frame." Hobbes would likely retreat to a hard conventionalism: Non-Euclidean geometry is a valid calculus of names, but it is not *Geometry* in the strict sense of the science of space. He would concede that Euclid is not the unique description of reality, but he would deny that this undermines the certainty of Euclid as a system of human making. He would say the critics were right that Euclid is not the structure of the world, but wrong to think this robs geometry of its certainty. The certainty remains, but it is hermetically sealed within the human artifact.

  #### 2. The Triumph of Symbolic Algebra: The Victory of the Counter over the Line
  **The Development:** Mathematics has become largely structural and symbolic. Objects are defined by axioms and formal behavior, not by constructible diagrams. Wallis's methods are the norm.
  **The Hobbesian Verdict:** *Condemned as insignificant speech, yet unavoidably effective.*

  This is the site of Hobbes's greatest tension. He defines reason as reckoning, yet he despises algebra. Faced with modern abstract algebra, Hobbes would double down on the distinction between *knowing that* and *knowing why*.

  He would argue: "These symbols are marks, yes, but they are marks detached from their generation. When you solve an equation by manipulating $x$ and $y$, you are moving counters on a board without knowing what magnitude they signify. You have the consequence, but you have lost the cause." For Hobbes, to know a mathematical object is to know how it is generated (e.g., a circle is generated by a rotating radius). Modern algebra defines objects by their relations (e.g., a group is a set with an operation satisfying axioms). Hobbes would call this "absurdity"—names without referents in motion.

  However, he would be forced to concede the *power* of the method. If algebra produces bridges that stand and orbits that predict, it yields *prudence* (successful conjecture) if not *scientia*. He would have to admit that his specific privileging of geometry was a historical accident of his own cognitive limitations. He would say: "Wallis was right that we can reckon without drawing, but he was wrong to call it science. It is a技艺 (craft) of signs. You have built a great engine of language that grinds out truths you do not understand."

  Here, the tension in his system snaps. If reasoning is *just* reckoning, then algebra is the purest form of reasoning. Hobbes cannot maintain that algebra is "mere symbolism" while simultaneously claiming reasoning is "computation of names." He would have to concede that his hostility to Wallis was an error of temperament, not logic. He would accept the method but demote its epistemic status: it is a tool for navigating the world of conjecture, not a path to the certainty of causes.

  #### 3. Computer-Assisted Proofs: The Automation of Reckoning
  **The Development:** Proofs are verified by machines (Four Colour Theorem, Kepler). The human mind cannot survey the whole; certainty rests on the reliability of the hardware and software.
  **The Hobbesian Verdict:** *The ultimate test of "Reason is Reckoning."*

  This is where Hobbes might find his most surprising vindication, mixed with a profound horror. Since he explicitly defines reasoning as a form of computation ("as in arithmetic, unskilful men must... so in reasoning, the most skilful may..."), the computer is the literal embodiment of the Hobbesian reasoner.

  He would say: "I told you. Reason is nothing but adding and subtracting. Here is a machine that does nothing else. If it errs, it is a fault in the construction, not in the nature of reckoning."

  However, Hobbes's requirement for *scientia* is that the knower constructs the knowledge. In a computer proof, the human does not survey the steps. Hobbes would rule this as *testimony*, not *demonstration*. "You believe the theorem because the machine says it, and you believe the machine because the engineer says it. This is authority, not reason. You have outsourced your reckoning, and in doing so, you have surrendered your knowledge."

  He would distinguish between the *truth* of the proposition (which the machine secures) and the *science* of the proposition (which the human loses). He would argue that a proof no human can comprehend is not a proof for a human. It is an empirical observation that the machine outputs "True." Thus, he would view formal verification projects as the ultimate triumph of his materialism (mind is a calculator) but the ultimate failure of his humanism (knowledge requires human agency). He would concede the result is certain, but deny that the mathematician *knows* it in the strict sense. They possess the conclusion, but not the consequence.

  ***

  ### II. Assessment: What Survives the Deluge?

  If we step back from the reconstruction and assess the wreckage, we can divide Hobbes's commitments into three categories: those refuted by history, those untouched, and those that have mutated into something unrecognizable yet durable.

  #### 1. Genuinely Refuted Commitments
  *   **The Privilege of Geometry:** Hobbes's claim that geometry is the *only* branch of certain knowledge because it involves construction is untenable. We now know that symbolic logic and algebra possess a rigor equal to (and often exceeding) geometry. The "scab of symbols" he despised is the skin of modern mathematics. His specific objection that algebra hides the "cause" fails because modern mathematics has largely abandoned the Aristotelian demand for causal generation in favor of structural coherence.
  *   **The Identity of Geometric and Physical Space:** Hobbes assumed Euclidean geometry was the necessary structure of the imagination *and* the world. Non-Euclidean geometry and General Relativity sever this link. We can construct geometries that are certain but physically false, and physical models that are probable but geometrically non-Euclidean. Hobbes's bridge between the artifact of the mind and the fabric of the cosmos is broken.
  *   **The Rejection of Abstract Entities:** Hobbes's nominalism was so strict he struggled to account for mathematical objects that cannot be drawn (e.g., infinite sets, high-dimensional manifolds). While a modern nominalist can account for these as linguistic conventions (which Hobbes would like), Hobbes's specific insistence on *motion* and *generation* as the criterion of intelligibility excludes vast swathes of modern mathematics that are intelligible but not constructible in his sense.

  #### 2. Commitments Left Untouched
  *   **The Artifact Theory of Certainty:** This is Hobbes's most enduring insight. We are certain about mathematics not because we perceive Platonic forms, but because we stipulate the rules. The modern view that mathematics is a human invention (formalism/conventionalism) is deeply Hobbesian. The shift from "discovering truth" to "verifying consistency within a system" is exactly Hobbes's claim that truth lies in the proposition, not the thing.
  *   **Reason as Computation:** Despite his hostility to algebra, Hobbes's definition of reasoning as computation is the foundational axiom of computer science and cognitive science. The fact that we can outsource reasoning to machines validates his materialist psychology more than he could have imagined.
  *   **The Distinction between Science and Conjecture:** Hobbes's insistence that we cannot have the same kind of knowledge of nature (physics) as we do of mathematics remains a potent philosophical position. We still treat mathematical truth as necessary and physical truth as contingent. His warning that we should not mistake our models (names) for the world (things) is a perennial guard against scientific realism gone rogue.

  #### 3. The Surviving Hobbesian Account
  Is a recognisably Hobbesian account of mathematical knowledge still available? **Yes, but it requires a retreat from Geometry to Formalism.**

  A modern Hobbesian would argue: Mathematics is certain because it is a system of names we have instituted. We define the axioms (the civil laws of the system) and we reckon the consequences (the legislation of theorems). We do not need "construction" in the sense of drawing lines; we need "construction" in the sense of *stipulation*.

  The tension you noted in your seminar—the author who calls reason "reckoning" but hates algebra—is resolved by updating the definition of "reckoning." Hobbes thought reckoning required attending to the *magnitudes* signified by the names. A modern Hobbes admits reckoning operates on the *names themselves*, provided the syntax is consistent.

  **The Final Judgment:**
  Hobbes was wrong about the *method* (geometry over algebra), wrong about the *scope* (Euclid over all space), and wrong about the *medium* (mind over machine). But he was profoundly right about the *status* of mathematics.

  He saw that mathematics is a "civil science." It is a kingdom of our own making, governed by laws we impose. The tragedy of Hobbes was that he tried to be the absolute monarch of this kingdom, forbidding the new laws (algebra) that his subjects (mathematicians) wanted to pass. He lost the quarrel with Wallis because he tried to rule by divine right (the "true" geometry) rather than by social contract (agreed-upon formalisms).

  If you tell your students this: Hobbes's philosophy of mathematics survives not as a guide to *doing* mathematics, but as a description of *what mathematics is*. It is the one place where human language touches reality without friction, because in that specific domain, we are the ones who built the reality we are describing. The algebra, the non-Euclidean spaces, and the computer proofs are just new tools in the workshop of the maker. Hobbes would still stand at the door, grumbling that the tools are too complex, but he would admit the house is still built by human hands.
