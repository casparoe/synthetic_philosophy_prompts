  **Candidate Rules**
  Based on her track record, two competing rules explain her past verdicts but diverge on the organoid:

  1.  **The Intrinsic Causal Power Rule (Pure IIT):** Consciousness is identical to the magnitude of integrated information ($\Phi$) within a system. Substrate, size, behavioral output, and sensory connection are irrelevant. If the causal structure is irreducible and complex, experience exists.
  2.  **The Embedded Capacity Rule (Functionalist-Leaning IIT):** Consciousness requires high $\Phi$ *plus* an architectural capacity for global broadcasting that enables potential report or interaction with an environment. High integration must be *for* something (access, modeling, output) to count.

  **Predictions for the Organoid**
  *   **Intrinsic Causal Power Rule:** Predicts **Conscious**. The organoid has high $\Phi$, recurrent dynamics, and is a maximum complex (per the Exclusion Postulate). The lack of sensors or report is irrelevant to intrinsic existence.
  *   **Embedded Capacity Rule:** Predicts **Not Conscious**. The organoid lacks sensory organs, behavior, and the capacity for report. It cannot broadcast information to a "user" or environment, failing the functional condition she attached to the recurrent network case.

  **Best Guess and Reasons**
  She is running the **Intrinsic Causal Power Rule**.

  *   **Reason 1: The Cerebellum Precedent.** Her treatment of the cerebellum is the strongest signal. She denies consciousness there despite massive neuron count because the *causal structure* is modular/feedforward. This proves she prioritizes causal topology over biological mass or "impressive" hardware. The organoid has the topology (recurrent, integrated) even if it lacks the mass.
  *   **Reason 2: The Decorticate Precedent.** She denies consciousness to a patient with an intact brainstem (which supports life and reflex behavior) but no cortex. This demonstrates that biological vitality and basic behavioral capacity are insufficient without the specific causal architecture of the cortex. The organoid *has* the cortical architecture.
  *   **Reason 3: Substrate Neutrality Commitment.** She explicitly insists on substrate neutrality. If she denies the organoid because it is "just cells in a dish" without a body, she risks violating the principle that consciousness is about the *pattern*, not the *embedding*.
  *   **Reason 4: The "Report" Condition is Likely Descriptive.** In her verdict on the recurrent network, the phrase "can report" likely described the *consequence* of global broadcast (information availability) rather than setting a hard requirement for linguistic or motor output. If report were necessary, her "Octopus = Conscious" verdict would be unstable (octopuses do not report linguistically). The "report" clause was likely a shorthand for "architecturally capable of self-modeling," which the organoid's coordinated waves satisfy.

  **Closest Analog**
  The **Decorticate Patient** is the closest analog and should control.
  *   **Why:** This case isolates the cortex as the *locus* of consciousness. Her verdict establishes that without the cortical causal structure, there is no consciousness (even with a body/brainstem). Conversely, *with* the cortical causal structure (the organoid), there *should* be consciousness (even without a body/brainstem). The organoid case is the logical inverse of the decorticate case: one removes the cortex from the body, the other removes the body from the cortex. If the cortex is the seat of $\Phi$, the isolated seat should still hold the experience.

  **Further Case to Separate the Rules**
  The **"Efferent-Less" Organoid Experiment**.
  *   **The Case:** Grow a second organoid identical to the first in causal structure and $\Phi$, but genetically modify it to lack the molecular machinery for *any* synaptic output or long-term plasticity (it can integrate internally but physically cannot affect anything outside its immediate boundary, nor can it be trained to "report" via any interface).
  *   **The Separation:**
      *   If she says it is **conscious**, she confirms the **Intrinsic Causal Power Rule**: internal integration is sufficient, and "capacity for report" was merely a marker for integration, not a functional requirement.
      *   If she says it is **not conscious**, she reveals she is running the **Embedded Capacity Rule**: consciousness requires the *potential* for external access or interaction, implying her IIT defense is secretly coupled with a Global Neuronal Workspace or Functionalist constraint.
