  # Project Title: Operationalizing Logical Counterfactuals in Updateless Decision Theory

  ## Project Summary
  Updateless Decision Theory (UDT) proposes that agents should select policies based on their output from a pre-observation vantage point, rather than updating on evidence before acting. This approach successfully resolves classic decision-theoretic paradoxes (e.g., Newcomb's Problem, Parfit's Hitchhiker) where Causal and Evidential Decision Theory fail. However, UDT relies on "logical counterfactuals"—evaluating what would happen if a deterministic algorithm output something different than it actually does. While philosophers and AI safety researchers agree this concept is necessary, there is no consensus on how to formalize it without circularity or introducing external oracles. This project proposes to treat this formalization gap as an engineering problem. By attempting to implement UDT agents within a closed causal simulation, I will identify exactly where the system requires exogenous primitives to function. The goal is not to solve logical uncertainty, but to map the specific computational dependencies that current theories gloss over.

  ## Research Question and The Gap
  **Primary Question:** Does a computable implementation of Updateless Decision Theory within a closed causal system require an exogenous primitive to evaluate logical counterfactuals, or can it be derived from the system's structure alone?

  **Why This Is Open:**
  Current literature treats logical counterfactuals as a conceptual tool rather than a computational specification. Proponents often assume an agent can "consider" alternative outputs of its own source code without explaining the mechanical substrate that allows this evaluation. Critics argue this smuggles in a form of free will or external oracle. Because most work in this area is proof-theoretic or purely philosophical, the specific point of failure—where the math stops working and requires a "magic" function—remains unlocated. There is a gap between the high-level intuition of UDT and a low-level, executable definition that runs inside a causal graph without crashing into circularity or halting problems.

  **Reframing the Hypothesis:**
  The initial suspicion is that UDT is simply ill-defined. However, a more productive framing for a six-month project is to locate the *dependency*. Rather than aiming to prove UDT wrong, this project aims to build a "stress test" environment. If UDT works in the simulator, we have a novel formalization. If it fails, we isolate the exact line of code where an external assumption was required. This shifts the project from a philosophical critique to an empirical investigation of formal systems.

  ## Methodology
  As a software engineer, I will approach this via constructive modeling rather than deductive proof. The core method is to build a discrete-event simulator where agents are defined by their source code and embedded directly into the causal graph they inhabit.

  1.  **Causal Graph Engine:** I will write a lightweight engine in Python that supports nodes representing computational processes. Crucially, these nodes must be able to take other nodes' source code as input, enabling self-reference.
  2.  **Baseline Agents:** I will implement standard Causal Decision Theory (CDT) and Evidential Decision Theory (EDT) agents within this engine to validate that the simulator reproduces standard verdicts in known scenarios (e.g., Smoking Lesion, Newcomb's Problem).
  3.  **UDT Implementation:** I will attempt to implement a UDT agent. This agent must evaluate the expected utility of different policies without updating on its own input first. The critical challenge is implementing the "counterfactual" function: `what_if(policy, output)`.
  4.  **Dependency Tracking:** When the UDT agent attempts to evaluate a counterfactual about its own code, I will instrument the code to track whether it requires information outside the causal graph (e.g., a hard-coded truth about mathematical consistency) to proceed.

  This "build-to-break" approach leverages software engineering rigor to force precision on concepts that often remain vague in natural language. If the code compiles and runs without external helpers, the theory holds water computationally. If it requires a "god object" to resolve self-reference, the theory relies on hidden primitives.

  ## Deliverables and Success Criteria
  **Positive Result:** A working simulator demonstrating either (a) a UDT implementation that functions within a closed causal system without external oracles, or (b) a minimal example isolating the exact primitive required to make UDT work, documented with code and technical analysis.

  **Negative Result:** The project fails to isolate the dependency, perhaps due to the complexity of self-referential logic leading to unmappable halting problems, or the conclusion simply reaffirms known impossibility results without adding operational clarity.

  **Feasibility and Scope:**
  Six months of part-time work is sufficient to build the simulator and attempt the implementation, but it is insufficient to solve the underlying problem of logical uncertainty. Therefore, the success condition is scoped to *mapping the obstacle* rather than *removing it*. This is an engineering spike on a philosophical problem. If the investigation reveals that the dependency is deeper than anticipated (e.g., requiring full theorem proving capabilities), the deliverable will be a report detailing why the computational cost exceeds the proposed framework.

  ## Timeline
  *   **Month 1:** Design and build the causal graph engine with support for self-referential nodes.
  *   **Month 2:** Implement CDT and EDT agents; verify correct behavior on standard benchmark problems.
  *   **Month 3:** Draft the UDT policy evaluation logic; attempt initial integration into the engine.
  *   **Month 4:** Instrument the code to detect external dependencies during counterfactual evaluation; refine the "stress test" cases.
  *   **Month 5:** Run experiments; document cases where the system circularly references itself or requires external truth values.
  *   **Month 6:** Finalize code repository; write technical report summarizing the location of the formalization gap.

  ## Conclusion
  Decision theory for embedded agents is critical for AI safety, yet it rests on intuitions that have not been stress-tested via implementation. By treating logical counterfactuals as a software specification problem, this project will provide concrete evidence regarding the viability of Updateless Decision Theory. Whether the result is a working model or a demonstrated impossibility, the output will clarify the structural requirements of updateless reasoning in a way that pure philosophy cannot.

