  2. If brain death relies on technological incapacity, it is inherently a moving target, which is not a logical bug but an unavoidable feature of tying vital status to current medical capability.
  3. Switching to "permanent" honestly admits that death declarations depend on human intent, yet it validates your fear that this makes biological status contingent on social choices rather than organic reality.
  4. The notion that death is a plain biological fact is confused, since declaring an organism dead always involves a prior judgment about which integrated functions are essential for continued existence.
  5. The definition holds only if we accept that death is a hybrid status requiring both biological breakdown and a normative agreement that restoration is not required.
