answer: |-
  Hi there,

  This is a fantastic topic for a mixed group, and your instinct to pivot away from the moralizing TED-talk version toward the structural mechanisms is exactly right for a PhD reading group. If you want them to grapple with the machinery rather than the morality, the sequence of the session matters more than the reading list. You need to dismantle their existing mental models before you build the new ones, otherwise they will just map the new labels onto their old misconceptions. I would structure the seventy-five minutes by spending the first fifteen minutes explicitly debunking the folk theories they will walk in with, the next twenty-five minutes establishing the core distinction between bubbles and chambers using a single sustained example, the following twenty minutes introducing your bunker provocation, and the final fifteen minutes for discussion and assessment. The reason you must start with the misconceptions is that if you let them sit with the idea that algorithms are the primary driver or that exposure is the universal cure, they will misunderstand the mechanism of disqualification when you introduce it later. They will assume the echo chamber is just a stronger bubble, rather than a fundamentally different social epistemology.

  The misconceptions you need to head off immediately are threefold. First, most people equate echo chambers with filter bubbles, assuming the isolation is technological rather than social. You need to cite the work of Dubois and Blank here to show that empirical evidence for algorithmic filter bubbles is actually quite weak compared to self-selection. Second, they will likely believe the backfire effect is settled science, assuming that correcting misinformation makes people double down. You should clarify that while this happens in specific identity-protective contexts, meta-analyses suggest it is rare and not the default response to correction. Third, they will assume epistemic bubbles are just about being wrong or ignorant, rather than a structural omission of data. You need to make clear that an epistemic bubble is compatible with rationality inside the bubble, whereas an echo chamber requires a specific strategy of trust manipulation. By placing this cleanup at the very start, you prevent them from wasting energy arguing about Facebook algorithms when you want them arguing about trust networks.

  Regarding your example, I would advise against the small-town church versus online forum comparison. While intuitive, it risks triggering pre-existing biases about religion versus secularism or offline versus online, which might obscure the mechanism you want them to see. Since your group includes CS and cog sci students, a better carrying example would be a contentious open-source software community dealing with a security vulnerability. This example has the benefit of being technical enough for the CS folks, normative enough for the philosophers, and behavioral enough for the cog sci students, without inviting moral superiority. In the epistemic bubble version, the maintainers simply do not publish the full bug report or omit certain logs, so exposure to the full data would pop the bubble. In the echo chamber version, the maintainers accept the data but discredit the reporter as a competitor or a bad actor, so exposure reinforces the boundary. This keeps the focus on the treatment of information rather than the content itself. You should explicitly leave out the political polarization literature for this session. It is too loaded and will distract from the structural mechanics you want to isolate. Tell them you are bracketing politics to understand the engine before looking at the vehicle.

  When you move to the core distinction, rely on C. Thi Nguyen's framework but keep the focus on the intervention implications. The key pedagogical dependency here is that they must understand omission versus disqualification before they can evaluate your third category. If they do not grasp that echo chambers survive contact with the outside world by design, they will not see why your epistemic bunker is distinct. Once that foundation is set, you can float the bunker concept. The question you want to sharpen for them is whether the bunker is just a stable echo chamber or a distinct epistemic state. In the software example, the bunker would be a fork of the project where the dissenting group creates their own repository, their own verification standards, and their own history of the bug. The issue is not just distrust of the original maintainers but a rival account of what counts as a valid commit or a secure codebase. This is where the session should become most contentious, and you should encourage the philosophers in the room to attack the necessity of this third category while the CS students argue about whether forked repositories constitute distinct epistemic systems.

  You also need to be transparent about what is settled versus what is contested in the literature, as this group will smell oversimplification quickly. It is settled that the conceptual distinction between bubbles and chambers is philosophically coherent, but it is genuinely contested whether these categories map cleanly onto real-world clusters of people. Some empiricists argue the distinction is too tidy for messy social data. It is also contested whether filter bubbles are a major driver of polarization compared to affective polarization, and you should present the backfire effect as context-dependent rather than a universal law. Do not present Nguyen's framework as the final word, but as a useful heuristic that might need expansion, which is exactly where your bunker idea comes in. By framing the bunker as a hypothesis rather than a theory, you invite them to test its boundaries rather than memorize its definition.

  For the final assessment, do not ask them to define the terms. Instead, give them a short vignette that mixes the mechanisms and ask them to prescribe an intervention. For example, describe a community where members ignore new data because they believe the data collection method is fundamentally rigged by a rival paradigm, and ask whether providing more data, vouching for the collectors, or building a new method is the only viable path. If they suggest providing more data, they have missed the mechanism. If they suggest vouching for the collectors, they have identified a chamber but missed the bunker nuance. If they argue that the intervention depends on whether the rival paradigm is accessible or incommensurable, they have grasped the structural difference. This forces them to apply the mechanism to a solution rather than just labeling the problem.

  Best of luck with the session, it sounds like it should be a lively one.

  Cheers
