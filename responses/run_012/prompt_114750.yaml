answer: |-
  This is an exceptionally clean set of intuitions. You have effectively reconstructed the last forty years of debate on supererogation through case judgments. The "Standard Picture" (Not Required + Good + Praiseworthy) is indeed the textbook definition (often attributed to Urmson), but as you've noticed, it crumbles under pressure.

  Here is a principled account that accommodates most of your verdicts, followed by the specific compromises you'll need to make, and finally, the divergent case you asked for.

  ### The Principled Account: "Costly Options with Constraints"

  To save your intuitions, we need to decouple the **deontic status of the act** from the **moral assessment of the agent**, and we need to introduce a **threshold of sacrifice**.

  **The Definition:** An act is supererogatory if and only if:
  1.  **Permissibility:** It is morally permissible to perform *and* morally permissible to omit (it is optional).
  2.  **Value:** It produces a net moral good (or prevents a net moral bad).
  3.  **Cost:** It involves a significant personal cost, risk, or sacrifice to the agent (above a contextual threshold).
  4.  **Constraint:** It does not violate any other binding duty (including duties to self or dependents).

  Here is how this account answers your three specific questions:

  #### 1. Is praiseworthiness part of the act or the agent?
  **Verdict:** It is a separate fact about the *agent*.
  **Reasoning:** Your Kidney Case is the decisive counterexample to the Standard Picture. The transplant saves a life (Good), is not required (Optional), and involves surgery (Cost). It fits the definition of supererogatory *act*. However, the motive (spite) makes the *agent* unpraiseworthy.
  **Correction:** We must distinguish between an act being **supererogatory** (a deontic category) and an agent being **meritorious** (an aretaic category). Usually, they travel together, but your kidney case proves they can come apart. The Standard Picture is wrong to build praise into the definition of the act.

  #### 2. Is the category relative to what others are doing?
  **Verdict:** Yes, but only regarding the "Cost" and "Permissibility" conditions.
  **Reasoning:** Your Bednets Case highlights the **Fair Share Principle**. Morality generally requires you to do your "fair share" to solve collective problems. If no one gives, 40% is a massive sacrifice (Supererogatory). If everyone gives 40%, your 40% is just your fair share (Duty). If everyone gives 40% and you give 0%, you are free-riding (Wrong).
  **Correction:** Supererogation is not a metaphysical absolute; it is sensitive to empirical facts about social cooperation. The "baseline of reasonable expectation" shifts based on what others are doing. This shouldn't bother you; it just means morality is partially empirical.

  #### 3. Does it apply to acts, patterns, or lives?
  **Verdict:** It applies to **choices**, which can be aggregated into lives, but atomistic acts cannot override holistic duties.
  **Reasoning:** Your Doctor Case suggests lives can be supererogatory. This is true *derivatively*. A life is supererogatory if it consists of a sustained pattern of choosing supererogatory options. However, your Saintly Parent Case reveals the **Constraint Condition**.
  **Correction:** You cannot evaluate an act in a vacuum. "Giving money to charity" looks supererogatory. "Giving money *needed for my children's nutrition* to charity" is neglect (Wrong). The correct description of the act includes its impact on competing duties. Therefore, an act cannot be supererogatory if it is a piece of an overall wrong life *when that life creates the duty being violated*.

  ---

  ### The Compromises: Where Your Gut Must Yield

  To make this system work, you have to adjust two of your intuitions.

  **1. The Train Seat (The Threshold Problem)**
  You felt calling seat-giving "supererogatory" was inflation. The Standard Picture struggles here because it lacks a cost threshold.
  *   **The Compromise:** You must accept that **low-cost kindness is not supererogatory.** It is merely *polite* or *kind*. Supererogation requires *sacrifice*. If the cost is trivial (standing for 20 minutes), it falls below the threshold of "beyond the call." It is good to do, but not heroic. This preserves the specialness of the Burning Building case.

  **2. The Saintly Parent (The Description Problem)**
  You want to say the individual acts look supererogatory even if the life is wrong.
  *   **The Compromise:** You must accept that **your act-level verdict is the mistake.** If the act contributes to a violation of duty (neglecting kids), the act *under that description* is not supererogatory. You cannot earn moral credit in Domain A by incurring moral debt in Domain B. The "goodness" of the charity donation is canceled out by the "wrongness" of the neglect. To call it supererogatory is to ignore the full moral context.

  ---

  ### The Divergent Case: "The Penny Donation"

  Here is a case where my **Costly Options Account** and the **Standard Three-Part Picture** come apart. This tests whether "Good + Not Required" is enough, or if "Significant Cost" is necessary.

  **The Case:**
  Alice walks past a donation bin for a highly effective charity. She has a penny in her pocket. She drops it in.
  *   **Good?** Yes (marginally).
  *   **Required?** No (nobody is duty-bound to give every spare penny).
  *   **Praiseworthy?** Barely, but let's say technically yes for the goodwill.

  **The Standard Picture Verdict:**
  Since the act is Good, Not Required, and (minimally) Praiseworthy, it **is Supererogatory**.
  *   *Implication:* Every tiny nice thing we do that isn't strictly mandatory is an act of "beyond the call" heroism. This leads to the "inflation" worry you had with the train seat.

  **My Preferred Account Verdict:**
  The act is **Not Supererogatory**.
  *   *Reasoning:* It fails the **Cost Threshold**. Supererogation is about *sacrifice*. It is about doing good *at a cost to yourself*. Giving a penny involves no meaningful sacrifice. It is a *permissible good act*, but it does not qualify for the special category of supererogation.
  *   *Implication:* This reserves the term for cases where the agent actually gives something up (time, risk, money, comfort). It aligns with your intuition that the train seat (low cost) feels different from the burning building (high cost).

  ### Summary of the Fix
  1.  **Praise** is about the agent; **Supererogation** is about the act. (Solves the Spiteful Kidney).
  2.  **Context** determines duty; if everyone does it, it becomes required. (Solves the Bednets).
  3.  **Cost** is required; trivial good deeds are not supererogatory. (Solves the Train Seat).
  4.  **Duties constrain;** you can't be a hero by neglecting dependents. (Solves the Saintly Parent).

  If you accept these four adjustments, your gut and the theory should stop fighting.
