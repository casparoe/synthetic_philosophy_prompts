prompt: |-
  Ok so quick context: I write about science and ideas for a magazine (mostly the mind/cogsci beat) but I also adjunct a seminar, and I'm building the take-home final for it right now. I need one big essay question on the combination problem for panpsychism, plus a model answer (~600 words) and a marking scheme.

  The problem I keep hitting: my students can all parrot the one-liner — consciousness is fundamental, it's everywhere, and the combination problem is how you get one big consciousness out of loads of tiny ones — and that kind of answer tops out around a B. It reads like they've seen the phrase combination problem a hundred times but never actually pried it apart. So the question has to be built so you can't get full marks by naming the problem and gesturing at emergence.

  Here's what I want it to force them to do, roughly, though you can word the question however you like:

  - Say clearly why the combination problem isn't just the hard problem wearing a different hat — alot of them genuinely think it's the same thing restated, and I want the question to catch that.
  - Break the combination problem into at least two seperate sub-problems and explain what's distinct about each — e.g. the subject-side worry (many little subjects refusing to add up to one big subject, the old mind-dust thing) versus the quality-side worry about how you'd ever get a single unified felt quality, or the grain/scale worry, or the structural one. I don't need all of them; I want them to pick two and actually defend that the two really are different and not the same worry counted twice.
  - Then take on the move where you flip the whole thing around: instead of many micro-minds combining upward, you start from one cosmic consciousness and ask how it differentiates into the many (the cosmopsychist / priority-monist move, and the so-called decombination problem). Did that actually solve the combination problem, or did it just relabel it and hide the hard part on the other end? That's the crux for me — I want to see who can tell a real solution from a relocation.
  - Bonus if they can tie it to the Russellian / structuralist style of panpsychism and say whether going structural makes the combination problem easier or just relocates it again.

  Give me the exam question itself first (it should read like something a real student opens on the last day, not a laundry list — a couple of sentences, with maybe the sub-parts as prompts), then the model answer, then the marking scheme. For the scheme, please do it out of 20 marks, break it into named must-hit points, and for each one add a one-line note on how students usually get that particular point wrong. I mostly care about the line between an A and a B, so make sure the scheme names the specific moves that only an A answer makes. Assume no internet, obviously — everything has to be answerable from what they've internalized in the course, so don't ask them for citations or who-said-what.

  Thanks, this is honestly the part of the syllabus I always leave to teh last minute.
