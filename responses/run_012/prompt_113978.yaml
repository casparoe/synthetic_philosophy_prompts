answer: |-
  # MORAL UNCERTAINTY: A POSITION SORTER

  **Instructions:** Answer the following questions based on your actual commitments, not the label you prefer. Follow the arrows to find your operational position.

  **1. Metanormative Status**
  Is your uncertainty about moral facts themselves (like empirical facts), or a practical problem of conflicting authorities?
  *   **Facts:** Go to 2.
  *   **Authorities:** Go to 3.
  *   **Incoherent:** *Leaf: Eliminativism* (Awkward Commitment: Dissolves the premise of this reading group entirely.)

  **2. Intertheoretic Comparability (Case: Zero vs. Max Value)**
  If Theory A assigns zero value to what Theory B ranks as the single most important good, can their verdicts still be mathematically mapped to a common scale?
  *   **Yes:** Go to 4.
  *   **No:** *Leaf: Parliamentary Model* (Awkward Commitment: Requires you to bargain with yourself as if you were distinct persons.)

  **3. Theory Individuation**
  If you split your favorite theory into two slightly different sub-versions, does its voting power double?
  *   **Yes:** *Leaf: Fragmented Aggregation* (Awkward Commitment: Makes moral obligation sensitive to how finely you carve up descriptions.)
  *   **No:** Go to 9.

  **4. Magnitude Sensitivity (Case: Rank vs. Stakes)**
  If two theories agree on the ranking of two options but disagree on how much is at stake, does the magnitude difference affect your choice?
  *   **Yes:** Go to 5.
  *   **No:** *Leaf: Ordinal Voting* (Awkward Commitment: Ignores catastrophic risks if the ranking order remains unchanged.)

  **5. Weighting Mechanism**
  Should a theory's influence track your credence alone, or credence adjusted for how much its internal stakes vary?
  *   **Credence Alone:** Go to 6.
  *   **Credence + Stakes:** *Leaf: Stakes-Weighted MEC* (Awkward Commitment: Inflates the influence of extreme theories regardless of their likelihood of truth.)

  **6. Universal Veto (Case: Tiny Credence/Meat)**
  If you hold a tiny credence in a theory that calls eating meat a grave wrong, does that credence alone generate a reason to abstain?
  *   **Yes:** *Leaf: Strong Deontic Constraint* (Awkward Commitment: Paralyzes action under the weight of remote, extreme prohibitions.)
  *   **No:** Go to 7.

  **7. Top-Theory Veto**
  Does the highest-credence theory hold a veto over acts it forbids, even if other theories endorse them?
  *   **Yes:** Go to 8.
  *   **No:** Go to 9.

  **8. Selection Among Permitted Acts**
  Among the acts the top theory permits, do you follow the top theory or maximize expected choiceworthiness?
  *   **Follow Top:** *Leaf: My Favorite Theory (MFT)* (Awkward Commitment: Ignores significant minority views even on high-stakes issues where the top theory is silent.)
  *   **Maximize Expectation:** *Leaf: Veto-MEC (Bespoke)* (Awkward Commitment: Creates a discontinuous jump in obligation if your credence ranking flips.)

  **9. Risk Attitude**
  Is the aim of decision-making to maximize average value or to minimize the severity of the worst possible error?
  *   **Average:** Go to 10.
  *   **Worst-Case:** *Leaf: Minimax Hedging* (Awkward Commitment: Sacrifices massive expected good to avoid remote catastrophic risks.)

  **10. Unit of Choice**
  Are you choosing an isolated act, a general policy, or a whole life trajectory?
  *   **Act:** *Leaf: Maximizing Expected Choiceworthiness (MEC)* (Awkward Commitment: Requires eating meat despite tiny credence it is murder, if expectation is positive.)
  *   **Policy/Life:** *Leaf: Rule-Consequentialist Uncertainty* (Awkward Commitment: Obligates you to follow rules you know are suboptimal in specific cases.)

  ***

  ### NOTES ON STRUCTURE

  **Unseparated Leaves:**
  *   **MFT vs. Veto-MEC:** These collapse if the highest-credence theory forbids all acts except one, or if it permits everything. The tree separates them only when the top theory is permissive but not total.
  *   **MEC vs. Stakes-Weighted MEC:** These converge if all theories assign similar magnitudes to stakes, or if credence correlates perfectly with stakes.

  **Unoccupied Combinations:**
  *   **Comparability = No + Maximize Expectation = Yes:** *Incoherent.* One cannot maximize expectation without a common scale of value.
  *   **Universal Veto = Yes + Risk = Worst-Case:** *Unattractive/Redundant.* Both mechanisms aim to avoid worst-case errors; employing both creates extreme paralysis without additional normative gain.
  *   **Metanormative = Facts + Unit = Life:** *Unexplored.* Most factual realists focus on act-assessment; life-plan realism is under-theorized in this context.
