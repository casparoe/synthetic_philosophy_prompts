  **Candidate Architectures**

  1.  **The Refrain Text Shift:** The poem begins with Refrain A. A middle stanza enacts a rule changing the Refrain to Refrain B. The final stanza uses a line that could be read as either A or B through homophonic ambiguity. *Rejection:* This risks forcing the language ("adding or subtracting words to force it") and may feel like a trick rather than a jurisprudential paradox.
  2.  **The Stanza Length Shift:** The poem begins in quatrains. A middle rule amends the form to terzets. The final stanza is visually arranged to be readable as either four lines or three (e.g., via line breaks). *Rejection:* This often looks like concrete poetry gimmickry and might violate the "real line" requirement for rhythm.
  3.  **The Stylistic Authority Shift:** The poem begins with a mandatory plain-text refrain. A middle rule amends the form to allow bolding. The third stanza demonstrates the new power (bold refrain), while the final stanza returns to plain text. *Selection:* This creates a genuine ambiguity: is the final refrain plain because the old rule *compels* it (amendment failed) or because the new rule *permits* it (amendment succeeded)? The visual change occurs (in the middle), but the final state overlaps both orders.

  **Choice:** I chose the third architecture. It isolates the paradox of validity (the "bootstrapping" problem) without distorting the syntax. The ambiguity rests on the *status* of the form (mandatory vs. permissive) rather than the content, mirroring how constitutional amendments often change the rules of change without altering the immediate outcome.

  ***

  1. Players shall gather here to bind the vote,
  To tie the tongue that speech **suspends**.
  The text is stone, the pen is boat,
  We draw the line that never ends.

  2. Any voice may propose to unlock
  The chain that holds the voting **trends**.
  The clock ticks on the heavy clock,
  We draw the line that never ends.

  3. Rule Three: The style is now made free.
  We seize the power to serve no **ends**.
  The new command is here enrolled,
  **We draw the line that never ends.**

  4. Votes shall be cast, the count is clear,
  But who can say if count **depends**?
  The procedure melts like winter gear,
  We draw the line that never ends.

  5. Entrenchment claims a permanent throne,
  While looseness leaves the gate un**fenced**.
  We sit upon the shifting stone,
  We draw the line that never ends.

  6. No motion stands unless it **mends**.
  The circle tightens round the pen.
  A second voice the first **commends**,
  We draw the line that never ends.

  7. The scribe records the passing hour,
  In ink that fades or else **transcends**.
  We taste the fruit of forbidden power,
  We draw the line that never ends.

  8. No higher court can judge this room,
  The circle closes on its **bends**.
  We write the verdict in the gloom,
  We draw the line that never ends.

  ***

  **Explanation**

  The amendment in Stanza 3 ("Rule Three: The style is now made free") is self-authorized; it appears within the text it claims to govern, with no higher rule validating its insertion. The visual change occurs immediately in Stanza 3, where the refrain becomes **bold**, demonstrating the new power. However, the final stanza reverts to plain text, creating the required ambiguity: under the original order, the refrain *must* be plain (valid); under the amended order, the refrain *may* be plain (also valid). The reader cannot determine from the final stanza alone whether the amendment succeeded (and chose plainness) or failed (and enforced plainness).
