      *   **Core View:** The user holds a "Primitivist" view of propositional unity. Propositions are unified wholes, not mere aggregates. This unity is *primitive* (brute, non-compositional). It cannot be explained by adding constituents (like copulas or relations) because that leads to Bradley's Regress, which the user takes to be vicious.
      *   **Goal:** The user wants to be *talked out of it* (or at least have the view stress-tested). They want a "map of the exposure."
      *   **Specific Questions:**
          *   What objections genuinely count against it vs. what is just the "price of admission"?
