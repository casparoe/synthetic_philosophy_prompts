          *   *Consensus:* Growing support for deflationism/pragmatism, but realists remain.

      *   *Challenge 5: The "Arbitrariness/Constraint" Objection.*
          *   If unity is brute, what constrains it? Why can't "Green ideas sleep furiously" be a unified proposition with truth conditions? (Chomsky vs. Logic).
