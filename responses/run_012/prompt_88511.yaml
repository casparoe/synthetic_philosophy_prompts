prompt: |-
  So I was raised Catholic but I stopped believing a few months ago, and now I'm kind of freaking out about whether anything is really right or wrong. I've been thinking alot about this and it's keeping me up at night. My friend who's in a philosophy PhD program tried to explain the whole moral realism vs anti-realism thing to me, and I wrote down what he said because I wanted to think about it. Here's his summary:

  "Okay so moral realism is the view that there are objective moral facts, like 'murder is wrong' is true in the same way that 'water is H2O' is true. Anti-realism is the view that moral statements are just expressions of emotion or cultural preferences, so they're not really true or false. The main argument for realism is that moral progress is real—we've abolished slavery, women can vote, etc.—and that only makes sense if there's a moral truth we're getting closer to. The main argument for anti-realism is Mackie's argument from queerness, which says that if there were objective moral facts, they'd have to be these weird non-physical properties that we can't detect, and that's too weird to believe. Also, evolutionary debunking arguments show that our moral beliefs are just products of evolution, so they're probably not tracking any real moral facts. So basically, if you're not religious, you should probably be an anti-realist, because without God there's no foundation for objective morality. But some people are moral realists without God, they just think moral facts are natural facts, like facts about human flourishing. That's called naturalist realism. But that's kind of a minority view. Anyway, the debate is basically about whether morality is discovered or invented."

  I suspect some of this is off, but I don't know enough to say where. I definately want to believe that morality is real, because otherwise it feels like anything goes, but I don't want to believe something just because it's comforting. Can you go sentence by sentence and tell me what a philosopher who actually works on metaethics would accept, what they'd wince at, and what's just wrong? And does his conclusion that I should be an anti-realist follow from the accurate parts? Also, is naturalist realism really a minority view?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User Background:** Raised Catholic, recently lost faith (few months ago), experiencing existential anxiety about morality ("keeping me up at night").
      *   **Goal:** Wants to know if morality is "really right or wrong" without religion. Wants truth, not just comfort.
      *   **Input:** A summary of metaethics provided by a friend in a Philosophy PhD program.
      *   **Task:**
          1.  Evaluate the friend's summary sentence by sentence (accept, wince, wrong).
          2.  Assess whether the conclusion ("if you're not religious, you should probably be an anti-realist") follows.
          3.  Address the claim about naturalist realism being a "minority view."
          4.  Provide reassurance/guidance suitable for someone in existential distress (empathetic but rigorous).

  2.  **Evaluate the Friend's Summary (Sentence by Sentence):**

      *   *Sentence 1:* "Okay so moral realism is the view that there are objective moral facts, like 'murder is wrong' is true in the same way that 'water is H2O' is true."
          *   *Verdict:* Mostly accurate, but slightly simplistic. Realism says moral propositions can be true/false independently of belief. The comparison to "water is H2O" implies *naturalist* realism specifically. Non-naturalist realism wouldn't agree with that comparison.
          *   *Nuance:* Distinguish between naturalist and non-naturalist realism here.

      *   *Sentence 2:* "Anti-realism is the view that moral statements are just expressions of emotion or cultural preferences, so they're not really true or false."
          *   *Verdict:* Wince/Incomplete. This describes *non-cognitivism* (emotivism) and *relativism*. But there are other anti-realist views (error theory) that say they *are* truth-apt but all false. Also, some anti-realists (constructivists) think they are true, just not *objective* in the realist sense.
          *   *Correction:* Anti-realism denies *objective* mind-independent facts, but doesn't necessarily deny truth altogether (depending on the specific theory).

      *   *Sentence 3:* "The main argument for realism is that moral progress is real—we've abolished slavery, women can vote, etc.—and that only makes sense if there's a moral truth we're getting closer to."
          *   *Verdict:* Acceptable as *an* argument (the argument from moral progress), but calling it "the main argument" is debatable. Phenomenological arguments (it *feels* like we are discovering truth) are also big.
          *   *Nuance:* Anti-realists have responses to this (progress is just changing preferences).

      *   *Sentence 4:* "The main argument for anti-realism is Mackie's argument from queerness, which says that if there were objective moral facts, they'd have to be these weird non-physical properties that we can't detect, and that's too weird to believe."
          *   *Verdict:* Accurate summary of Mackie.
          *   *Nuance:* Realists have responses (naturalists say they *are* physical/detectable; non-naturalists say rational intuition detects them).

      *   *Sentence 5:* "Also, evolutionary debunking arguments show that our moral beliefs are just products of evolution, so they're probably not tracking any real moral facts."
          *   *Verdict:* Accurate summary of EDAs.
          *   *Nuance:* Realists have responses (evolution could track truth because truth aids survival, or via a third-factor explanation).

      *   *Sentence 6:* "So basically, if you're not religious, you should probably be an anti-realist, because without God there's no foundation for objective morality."
          *   *Verdict:* **Wrong/Controversial.** This is the Divine Command Theory assumption. Most academic metaethicists are secular realists. This is the biggest philosophical error in the summary.
          *   *Correction:* The Euthyphro Dilemma challenges this. Secular realism is a dominant position in academia.

      *   *Sentence 7:* "But some people are moral realists without God, they just think moral facts are natural facts, like facts about human flourishing. That's called naturalist realism."
          *   *Verdict:* Accurate definition of Naturalist Realism (e.g., Foot, Thompson, Boyd).

      *   *Sentence 8:* "But that's kind of a minority view."
          *   *Verdict:* **Debatable/Wrong.** Depends on the survey. Among *professional philosophers*, realism (naturalist and non-naturalist combined) is generally more popular than anti-realism. Among *secular* philosophers, realism is definitely not a fringe view.
          *   *Data:* PhilPapers Survey (2020) shows Metaethics: Moral Realism is accepted by a majority (approx 56% vs 28% anti-realism).

      *   *Sentence 9:* "Anyway, the debate is basically about whether morality is discovered or invented."
          *   *Verdict:* Good heuristic/simplification for a layperson.

  3.  **Address the Conclusion ("If not religious, be anti-realist"):**
      *   Does it follow? No. It relies on the premise that God is the *only* possible foundation for objective morality.
      *   Counter-premise: Many secular arguments exist (rationality, flourishing, reasons for action).
      *   Philosophical Consensus: The majority of secular philosophers are realists.

  4.  **Address the "Minority View" Claim:**
      *   Cite the PhilPapers Survey. Realism is actually the majority view among philosophers, even secular ones.

  5.  **Address the User's Anxiety (Pastoral/Counseling Aspect):**
      *   Acknowledge the distress. Losing faith is hard.
      *   Explain that "objective" doesn't have to mean "cosmic law written in the stars."
      *   Explain that even if anti-realism were true, it doesn't mean "anything goes" (pragmatic morality, social contracts, empathy).
      *   Reassure that secular morality is robust.

  6.  **Drafting the Response:**
      *   *Tone:* Empathetic, clear, authoritative but not condescending.
      *   *Structure:*
          1.  Validation of feelings.
          2.  Sentence-by-sentence breakdown (Accept, Wince, Wrong).
          3.  The "God required" claim (crucial to debunk gently).
          4.  The "Minority View" claim (cite data).
          5.  Conclusion/Advice on the anxiety.

  7.  **Refining the Content (Self-Correction during drafting):**
      *   *Check:* Did I distinguish between Non-Naturalist and Naturalist realism clearly? The friend conflated Realism with Naturalism in the first sentence. I need to point that out.
      *   *Check:* Is the PhilPapers data accurate? 2020 survey: Moral Realism (56.4%), Anti-Realism (28.3%), Other (15.3%). Among those leaning secular, realism is still strong.
      *   *Check:* Make sure not to dismiss the friend entirely. The friend is a PhD student, so they know the *arguments*, but their *synthesis* regarding the necessity of God is biased or outdated (or perhaps reflecting a specific theological niche).
      *   *Check:* Address the "anything goes" fear directly. Even error theorists (like J.L. Mackie) lived moral lives. Anti-realism $\neq$ Nihilism in practice.

  8.  **Final Polish:** Ensure the distinction between *ontology* (what exists) and *practicality* (how we live) is clear, as that's where the user's anxiety lies. (Proceed to generate output).

  *(Self-Correction Note)*: Wait, I need to be careful about the "Naturalist Realism is a minority view" claim. Among *realists*, non-naturalism might be slightly more popular or vice versa depending on the year, but among *all metaethicists*, realism generally is the majority. The friend said "naturalist realism" specifically is a minority. That is arguably true compared to *all* views, but false if compared to *anti-realism*. I need to clarify that *Secular Realism* (Naturalist + Non-Naturalist) is the majority, not just Naturalist.

  Let's look at the PhilPapers 2020 results again.
  Metaethics: Moral Realism (56.4%) vs Anti-Realism (28.3%).
  So Realism is the majority.
  The friend claimed Naturalist Realism is a minority view. Among realists, Non-Naturalism is often cited as slightly more common in the analytic tradition, but Naturalism is very strong (Neo-Aristotelians, Cornell Realists). So calling it a "minority view" in a way that suggests it's fringe is misleading.

  Okay, ready to write.
answer: |-
  First, I want to acknowledge how difficult this transition is. Losing a faith that provided a structural framework for your life—especially one as comprehensive as Catholicism—often triggers exactly the kind of existential anxiety you're describing. It is completely normal to feel unmoored right now. The fact that you want to believe what is *true* rather than just what is *comforting* shows a lot of intellectual integrity.

  Your friend is clearly smart and has read the literature, but his summary mixes accurate technical definitions with some significant philosophical biases and one major error regarding the relationship between God and morality.

  Here is a sentence-by-sentence breakdown of what a professional metaethicist would say, followed by an answer to your specific questions about the conclusion and the "minority view" claim.

  ### Sentence-by-Sentence Breakdown

  **1. "Okay so moral realism is the view that there are objective moral facts, like 'murder is wrong' is true in the same way that 'water is H2O' is true."**
  *   **Verdict:** **Wince.**
  *   **Why:** The first half is correct (realism posits mind-independent moral facts). The second half is specific to *Naturalist* Realism. There is another major group called *Non-Naturalist Realists* (like G.E. Moore or contemporary figures like Russ Shafer-Landau) who argue moral facts are *sui generis* (unique). They would say "murder is wrong" is true, but *not* in the same way "water is H2O" is true, because moral properties aren't reducible to physical properties. Your friend conflated realism generally with naturalism specifically.

  **2. "Anti-realism is the view that moral statements are just expressions of emotion or cultural preferences, so they're not really true or false."**
  *   **Verdict:** **Wince.**
  *   **Why:** This describes *Non-Cognitivism* (emotivism) or *Relativism*. But there is another major anti-realist view called *Error Theory* (championed by J.L. Mackie). Error Theorists say moral statements *do* try to state facts and are truth-apt, but they are all **false** (because no such facts exist). Also, there are *Constructivists* who believe moral truths exist but are "made" by rational agents rather than "found" in the universe. Anti-realism is more diverse than just "it's all emotion."

  **3. "The main argument for realism is that moral progress is real—we've abolished slavery, women can vote, etc.—and that only makes sense if there's a moral truth we're getting closer to."**
  *   **Verdict:** **Accept.**
  *   **Why:** This is a standard and strong argument for realism (the Argument from Moral Progress). Realists argue that it makes more sense to say we *discovered* slavery was wrong than to say we just *changed our minds* about it. Anti-realists do have counter-arguments (e.g., progress is just shifting preferences), but your friend summarized the realist position accurately here.

  **4. "The main argument for anti-realism is Mackie's argument from queerness, which says that if there were objective moral facts, they'd have to be these weird non-physical properties that we can't detect, and that's too weird to believe."**
  *   **Verdict:** **Accept.**
  *   **Why:** This is an accurate summary of Mackie's "Argument from Queerness." He argues that objective values would be entities of a very strange nature, utterly different from anything else in the universe. However, he also has a second prong regarding how we would *know* them (epistemological queerness). Realists have responses to this (e.g., we detect them through rational reflection, not physical sensors), but the summary of Mackie is correct.

  **5. "Also, evolutionary debunking arguments show that our moral beliefs are just products of evolution, so they're probably not tracking any real moral facts."**
  *   **Verdict:** **Accept.**
  *   **Why:** This is an accurate summary of Evolutionary Debunking Arguments (EDAs). The idea is that evolution shaped us to survive, not to know the truth. If our moral beliefs help us reproduce, evolution would select for them regardless of whether they are true. Realists counter this by arguing that true moral beliefs (like "cooperate with your tribe") might *also* aid survival, or that evolution gave us the *capacity* for reasoning which allows us to find truth later.

  **6. "So basically, if you're not religious, you should probably be an anti-realist, because without God there's no foundation for objective morality."**
  *   **Verdict:** **Wrong.**
  *   **Why:** **This is the most critical error in your friend's summary.** This claim relies on the idea that God is the *only* possible anchor for objective morality (Divine Command Theory). However, the vast majority of professional metaethicists are secular, and the vast majority of *those* are realists.
      *   Many philosophers argue that morality is grounded in **reason** (Kantianism), **human flourishing** (Aristotelianism/Naturalism), or **rational requirements** (Scanlonian contractualism).
      *   To say you need God for objective morality is like saying you need God for objective mathematics. Most mathematicians are realists about numbers without thinking God invented them. Many moral philosophers feel the same about morality.

  **7. "But some people are moral realists without God, they just think moral facts are natural facts, like facts about human flourishing. That's called naturalist realism."**
  *   **Verdict:** **Accept.**
  *   **Why:** This is an accurate definition of Ethical Naturalism (e.g., Philippa Foot, Rosalind Hursthouse, Richard Boyd). They argue "good" is a functional concept related to the flourishing of living things.

  **8. "But that's kind of a minority view."**
  *   **Verdict:** **Wrong/Misleading.**
  *   **Why:** See the data section below.

  **9. "Anyway, the debate is basically about whether morality is discovered or invented."**
  *   **Verdict:** **Accept.**
  *   **Why:** This is a very good heuristic simplification for a layperson. Realists say discovered; Anti-realists/Constructivists say invented (or projected).

  ---

  ### Does his conclusion follow? ("If you're not religious, you should probably be an anti-realist")

  **No, it does not follow.**

  The conclusion only follows if you accept the premise: *"Objective morality requires a divine lawgiver."*
  Most philosophers reject this premise. They argue that objective morality requires **reasons**, not necessarily a **commander**.

  For example: If you put your hand in a fire, you will get burned. That is an objective fact about your physical well-being. A secular realist argues that "you ought not to put your hand in the fire" is an objective fact derived from your nature as a living being that seeks to avoid pain and continue existing. You don't need God to make the burning objective; you just need physics and biology. Secular realists argue moral facts work similarly, based on the nature of rational agents and social beings.

  Your friend's bias here is common among people raised in religious environments (or those studying in theology-adjacent philosophy circles), but it is not the consensus of the field.

  ### Is Naturalist Realism really a minority view?

  It depends on how you slice the data, but your friend is misleading you if he implies secular realism is fringe.

  The most comprehensive data we have comes from the **PhilPapers Survey**, which polls thousands of professional philosophers.
  *   **Moral Realism:** ~56% of philosophers accept or lean toward realism.
  *   **Anti-Realism:** ~28% accept or lean toward anti-realism.

  So, **Realism is the majority view** among professional philosophers.

  Now, among *religious* philosophers, realism is even higher (often tied to God). But among *secular* philosophers, realism is still very strong. While *Naturalist* Realism specifically competes with *Non-Naturalist* Realism, both are secular forms of realism. So, the idea that you must be an anti-realist because you are secular is statistically false regarding the experts.

  ### A Note on Your Anxiety

  I want to address the part of your message that says, *"I definitely want to believe that morality is real, because otherwise it feels like anything goes."*

  This is the most important part. Even if your friend were right, and even if anti-realism were true, **it does not mean "anything goes."**

  1.  **Pragmatic Morality:** Even if morality is "invented" (like laws or etiquette), it is invented to solve real problems. We invented traffic laws not because they are written in the stars, but because without them, people die. You still shouldn't run red lights. Similarly, we have moral norms against murder because societies that allow murder collapse. You can have a robust, binding morality based on human well-being without needing it to be "cosmically objective."
  2.  **The Euthyphro Dilemma:** As a former Catholic, you may recall this. Is something good because God commands it, or does God command it because it is good?
      *   If the former, morality is arbitrary (God could command murder, and it would be "good").
      *   If the latter, then "goodness" exists independently of God, and we can access it without Him.
      *   Most theologians and philosophers choose the latter. This implies that even within your old framework, morality had a logic that wasn't *just* "because God said so."
  3.  **Secular Stability:** Many people find that their morality actually becomes *more* stable after leaving religion. When you are religious, you might avoid doing bad things because of fear of punishment or desire for reward. When you are secular, you avoid doing bad things because you genuinely empathize with others and understand the harm. That is a deeper, more resilient foundation.

  ### Summary for You

  *   **Your friend's technical summary:** Mostly accurate on the definitions of arguments, but simplified.
  *   **Your friend's theological claim:** ("No God = No Objective Morality"): **False.** This is a contested theological claim, not a philosophical fact.
  *   **The Consensus:** Secular Moral Realism is a dominant, respectable, and widely held position in modern philosophy.
  *   **Your Anxiety:** It is possible to be a secular realist. It is also possible to be a secular anti-realist and still live a deeply moral, meaningful life where "anything goes" is not the case.

  You are not falling into a void. You are stepping onto ground that millions of philosophers and billions of non-religious people stand on every day. It is solid ground.
