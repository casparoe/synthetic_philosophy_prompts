  1. You describe the AI landscape as a multipolar trap, but a game theorist might call this simply a Nash equilibrium with suboptimal payoffs. Does the label "trap" do any explanatory work beyond describing the payoff matrix, or does it imply a dynamic mechanism that standard game theory misses?
  Follow-up: If you argue it implies a dynamic mechanism, what is that mechanism that isn't already captured by iterated game theory models of competition?
  Pressing for explanatory surplus vs. rhetorical redundancy.

  2. You often invoke the imagery of Moloch, a Canaanite deity, to describe this trap, but critics argue this personifies a structural incentive into a malevolent agent. Does this rhetoric risk obscuring the fact that no one is actually driving the process, or is the personification necessary to motivate action?
  Follow-up: If you say it is necessary for motivation, does motivating action via a false agent risk leading us to fight the wrong enemy rather than the incentives themselves?
  Pressing for rhetorical utility vs. conceptual clarity.

  3. In industries like aviation or pharmaceuticals, competition often drives higher safety standards to maintain trust and licensing. Why should AI be structurally different from these industries where competition incentivized safety rather than corner-cutting?
  Follow-up: If you argue AI is different because of first-mover advantage, doesn't that assume the first mover gains decisive strategic advantage, which is itself a contestable empirical claim?
  Pressing for empirical counterexamples to the race-to-the-bottom model.

  4. Some argue a single unipolar actor or a binding pre-commitment device could escape the trap, yet you suggest this just relocates the trust problem. Is there *any* coordination structure that wouldn't merely shift the bottleneck to who controls the coordinator?
  Follow-up: If you say no, does this imply that safe AI is impossible under any known political structure, making the problem unsolvable rather than just hard?
  Pressing for the possibility of a solution vs. permanent deadlock.

  5. If actors race, you call it a multipolar trap; if they show restraint, you might call it a temporary coordination success. What specific observable evidence would count against the coordination framing, given that it seems equally able to explain racing and restraint?
  Follow-up: If you struggle to name evidence, does the theory risk becoming unfalsifiable, explaining every outcome post-hoc rather than predicting them?
  Pressing for falsifiability and scientific rigor.

  6. If the solution is governance rather than technical specification, someone must decide what values the AI aligns to. Who legitimately holds the authority to set that target, and on what moral basis?
  Follow-up: If you say global consensus, given current geopolitical fragmentation, isn't relying on consensus a hope rather than a plan?
  Pressing for legitimacy and feasibility of governance solutions.

  7. You argue technical alignment is downstream of coordination, but if we couldn't solve the technical problem even with infinite coordination, would the coordination problem still matter? Are you conflating necessary and sufficient conditions?
  Follow-up: If you say technical problems are easy given coordination, what evidence suggests the technical problem is trivial compared to the social one?
  Pressing for the relationship between technical and social difficulty.

  8. Your characteristic response is that alignment is coordination in control-theory clothing, but doesn't control theory deal precisely with systems where the controller cannot perfectly trust the mechanism? Isn't that the definition of the technical problem?
  Follow-up: If you say control theory assumes a single controller, does AI alignment not require controlling a system that might exceed the controller's intelligence, making the coordination of humans secondary to controlling the non-human agent?
  Pressing for validity of the control theory analogy.

  9. If the bottleneck is coordination, does that imply we should slow down development to allow time for treaties, or does the trap imply we must race to establish a favorable coordination regime before others do?
  Follow-up: If you say slow down, how do you enforce slowing down without triggering the very race dynamics you describe?
  Pressing for policy implications of the thesis.

  10. You redefine alignment from "matching human intent" to "solving the coordination game." Does this semantic shift risk solving the wrong problem, where we successfully coordinate to build something unsafe because everyone agreed on the wrong goal?
  Follow-up: If you say coordination ensures the right goal, who defines "right" in a multipolar world with conflicting values?
  Pressing for conceptual drift in the definition of alignment.
