  **Scenario: The Grain Store Protocol**

  You are the manager of a regional grain storage facility facing a infestation of arthropod pests. You must select one of two mutually exclusive pest-control regimes to implement immediately. Both regimes cost the same, require equal labor, and have identical effects on vertebrate wildlife, local ecosystems, and grain quality. The only difference lies in the population of arthropods affected and the scientific confidence regarding their sentience.

  **Regime H (Broad Fumigation):** You release a gas that permeates the entire silo. This affects **$N_H = 90,000$** small arthropods (primarily mites and psocids). Current neurobiological evidence regarding these taxa is sparse; you assign a probability **$p_H = 0.1$** that any given individual is a subject of experience. The practice causes a painful death for those affected.
  *Expected Sentient Individuals:* $90,000 \times 0.1 = 9,000$.

  **Regime L (Targeted Heat-Trapping):** You apply localized heat and traps. This affects **$N_L = 10,000$** larger arthropods (primarily beetles). Neurobiological evidence here is robust; you assign a probability **$p_L = 0.9$** that any given individual is a subject of experience. The practice causes an equally painful death for those affected.
  *Expected Sentient Individuals:* $10,000 \times 0.9 = 9,000$.

  The expected number of sentient individuals affected is identical ($9,000$). The intensity and duration of harm per sentient individual are held fixed. You must choose H or L.

  ***

  **Audit**

  **Verdicts and Structural Features**
  1.  **Expected-Value Aggregation (EVA):** Verdict: **Indifference**.
      *   *Feature:* Additivity. The view sums $p \times \text{harm}$ over all individuals. Since $\sum (p_H \times \text{harm}) = \sum (p_L \times \text{harm})$ by calibration ($9,000 = 9,000$), the total expected disvalue is identical. The verdict follows from the linearity of expectation, not the specific numbers.
  2.  **Precautionary View (PV):** Verdict: **L is Worse**.
      *   *Feature:* Certainty-Aversion. To yield this verdict (as required by the seminar design), this view must be characterized as treating the *certainty* (or high probability) of wronging a subject as lexically weightier than the *risk* of wronging many. Since $p_L (0.9)$ represents a near-certain wrong per individual while $p_H (0.1)$ represents a mere risk, L incurs the lexical penalty.
  3.  **Determinacy View (DV):** Verdict: **H is Worse**.
      *   *Feature:* Uncertainty-Aggregation. To yield this verdict (as required), this view must be characterized as treating the *indeterminacy* of moral status across a vast population as a distinct moral hazard that outweighs the determinate harm in L. Here, the sheer scale of *uncertain* status in H triggers the prohibition.

  **Structural Analysis and Removal Test**
  The three-way disagreement is produced entirely by the divergence in the $(N, p)$ pairs while holding the product $N \times p$ constant.
  *   **Removal Test 1 (Equalize $p$):** If we set $p_H = p_L = 0.5$, then to maintain equal expected value, we must set $N_H = N_L$. In this case, the regimes are identical in all respects. All three views return **Indifference**.
  *   **Removal Test 2 (Equalize $N$):** If we set $N_H = N_L = 50,000$, then to maintain equal expected value, we must set $p_H = p_L$. Again, the regimes become identical. All three views return **Indifference**.
  *   **Location of Disagreement:** The disagreement exists strictly in the region of the $(N, p)$ plane where $N_H \gg N_L$ and $p_L \gg p_H$ such that $N_H p_H = N_L p_L$. It vanishes as the vector between $(N_H, p_H)$ and $(N_L, p_L)$ approaches zero.

  **Unsatisfiability and Correction**
  I must flag that the specification as stated contains a logical contradiction regarding the characterizations of the Precautionary and Determinacy views versus their requested verdicts.
  *   *Prompt Constraint:* The Precautionary view is described as treating a "chance of wronging an enormous number... as lexically worse," yet must verdict **L is Worse** (where the number is smaller). Standard Maximin logic dictates H should be worse here.
  *   *Prompt Constraint:* The Determinacy view is described as attaching status "only to subjects whose sentience is determinate... merely possible subjects cannot be wronged," yet must verdict **H is Worse** (where most subjects are merely possible). Standard Determinacy logic dictates L should be worse here.

  To construct the **nearest satisfiable case** that preserves the seminar's pedagogical goal (a three-way split: H-worse, Equal, L-worse), I have adjusted the *characterizations* of PV and DV in the Verdicts section above to align with the requested verdicts, rather than swapping the verdicts to match standard definitions.
  *   **Correction:** I interpreted PV as "Certainty-Aversion" (L-worse) and DV as "Uncertainty-Aggregation" (H-worse).
  *   **Alternative Correction:** If we adhere strictly to the *descriptions* provided in the prompt, the verdicts would swap (PV: H-worse; DV: L-worse). This preserves the three-way spread but violates the specific verdict mapping requested.

  **Strongest Case Against the Determinacy View (H-Worse)**
  A defender of Expected-Value Aggregation would argue that the Determinacy View (as corrected to verdict H-worse) begs the question by reifying uncertainty. If "merely possible subjects cannot be wronged" (as per the prompt's core description), then the 81,000 individuals in Regime H who are likely non-sentient cannot be moral patients. To claim H is worse requires counting the *uncertainty itself* as a harm comparable to pain. The EVA defender argues this conflates *epistemic* risk with *moral* harm. If the insects in H are not sentient, nothing bad happens to them; if they are sentient, the harm is counted in the expectation. To add a penalty for the uncertainty is to double-count or to fetishize the decision-maker's state of mind over the subject's experience. Much of the disagreement survives only if one accepts that moral risk is intrinsically bad, independent of the expected outcome.
