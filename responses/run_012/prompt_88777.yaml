prompt: |-
  I am a high school student writing a philosophy paper on population ethics. I need the desiderata any adequate theory of population axiology must satisfy. Please write that specification: the cases it must get right (the repugnant conclusion, where a very large population whose lives are barely worth living is ranked above a smaller flourishing population; the mere addition case, where adding happy people without making anyone worse off seems at least not worse; the non-identity case, where different policies produce different people; and a case where a theory must choose between a few very high-quality lives and many low-positive lives), the distinctions it cannot collapse (between making someone worse off and bringing someone into existence, between a life worth living and a life worth creating, and between total well-being and average well-being), and the constraints it must respect (transitivity of betterness, the intuition that it is bad to create a miserable person but not required to create a happy one, and the fact that no one is made worse off in the mere addition case). Mark which requirements are non-negotiable and which are optional. If some subset of the requirements cannot be jointly satisfied, say so and explain why; I am most interested in that part. Then briefly say how totalism, the average view, and a person-affecting view fare against the list.
