answer: |-
  Here is a specification of the desiderata for an adequate theory of population axiology, structured for your philosophy paper.

  ### Specification of Desiderata for Population Axiology

  **Introduction**
  Population axiology is the study of what makes outcomes better or worse when the number and identities of people involved vary. An "adequate" theory is one that aligns with our moral intuitions while remaining logically consistent. Below are the requirements such a theory is expected to meet.

  #### I. Substantive Cases (The Theory must yield these verdicts)
  1.  **Avoid the Repugnant Conclusion:** For any population of very happy people (A), there should not be a much larger population of lives barely worth living (Z) that is considered *better* than A.
      *   *Status:* **Contested/Optional.** (Many theories fail this, treating it as a "bullet to bite.")
  2.  **Accept the Mere Addition Principle:** If we add new people with lives worth living to a population, without making anyone else worse off, the new outcome (A+) should not be *worse* than the original (A).
      *   *Status:* **High Priority.** (Rejecting this leads to counter-intuitive results about adding happy people.)
  3.  **Resolve the Non-Identity Problem:** The theory must be able to criticize policies that harm future people even if those specific people would not have existed otherwise (e.g., depleting resources slowly vs. quickly).
      *   *Status:* **Non-Negotiable.** (A theory that cannot handle this fails to guide policy.)
  4.  **Avoid the Sadistic Conclusion:** It should not be the case that adding people with negative well-being (misery) is better than adding people with positive well-being (happiness), merely to manipulate averages.
      *   *Status:* **Non-Negotiable.** (This is widely considered unacceptable.)

  #### II. Conceptual Distinctions (The Theory must not collapse these)
  5.  **Harm vs. Existence:** The theory must distinguish between making an existing person worse off and bringing a new person into existence.
      *   *Status:* **Non-Negotiable.**
  6.  **Worth Living vs. Worth Creating:** The theory must distinguish between a life that is good *for the person living it* (worth living) and a life that there is a moral reason *to bring about* (worth creating). This is often called the **Asymmetry**.
      *   *Status:* **Contested/Optional.** (Totalism rejects this; many find it intuitive.)
  7.  **Total vs. Average Well-being:** The theory must have a clear method for aggregating well-being that does not confuse the sum total of happiness with the average happiness per person.
      *   *Status:* **Non-Negotiable.** (It must pick one or a hybrid, but cannot be ambiguous.)

  #### III. Formal Constraints (The Theory must obey these rules of logic)
  8.  **Transitivity of Betterness:** If Outcome A is better than B, and B is better than C, then A must be better than C.
      *   *Status:* **Non-Negotiable.** (Without this, rational choice is impossible.)
  9.  **The Asymmetry Constraint:** It is bad to create a miserable person, but there is no moral requirement to create a happy person.
      *   *Status:* **Contested/Optional.** (This is the formal version of Distinction #6.)
  10. **Pareto Condition (No Worse Off):** In the Mere Addition case, since existing people are not harmed, the outcome cannot be worse on their account.
      *   *Status:* **High Priority.**

  ---

  ### The Impossibility Result (Crucial Section)

  **Can all these requirements be jointly satisfied?**
  **No.** This is the most important finding in modern population ethics.

  It has been mathematically proven (most notably by philosopher Gustaf Arrhenius in his **Impossibility Theorems**) that no population axiology can satisfy all the adequate conditions listed above simultaneously. Specifically, there is a tension between **Transitivity**, **The Mere Addition Principle**, and **Avoiding the Repugnant Conclusion**.

  **Why they conflict:**
  1.  **The Trap:** If you accept the **Mere Addition Principle** (adding happy people isn't worse) and you want to avoid making the original people worse off, you are forced to accept that a large population (A+) is at least *as good as* a small happy population (A).
  2.  **The Slide:** If you compare that large population (A+) to an even larger one where everyone has slightly less happiness but the *total* happiness is higher, a Totalist view says the larger one is better.
  3.  **The Conclusion:** By repeating this step, you eventually reach the **Repugnant Conclusion** (a massive population with lives barely worth living).
  4.  **The Conflict:** To avoid the Repugnant Conclusion, you must either:
      *   Reject **Transitivity** (say A > B and B > C, but C > A), which breaks logic.
      *   Reject **Mere Addition** (say adding happy people makes things worse), which seems cruel.
      *   Accept the **Repugnant Conclusion**, which seems absurd.

  **For your paper:** You should argue that the central problem of population ethics is not finding the "right" theory, but deciding which of these intuitive constraints we are willing to sacrifice. There is no "cost-free" theory.

  ---

  ### Evaluation of Major Theories

  Here is how the three dominant views fare against the specification list:

  **1. Total Utilitarianism (Totalism)**
  *   *Core Idea:* Maximize the sum total of well-being.
  *   *Performance:*
      *   **Passes:** Mere Addition, Transitivity, Non-Identity.
      *   **Fails:** **The Repugnant Conclusion.** (It explicitly entails that Z is better than A).
      *   **Fails:** The Asymmetry (It implies we *should* create happy people if it increases the total).
  *   *Verdict:* Logically robust but yields the most famous counter-intuitive result.

  **2. The Average View**
  *   *Core Idea:* Maximize the average well-being per person.
  *   *Performance:*
      *   **Passes:** Avoids the Repugnant Conclusion (Z has a lower average than A).
      *   **Fails:** **The Mere Addition Principle.** (Adding happy people *lowers* the average, making the outcome "worse").
      *   **Fails:** **The Sadistic Conclusion.** (It can imply it is better to add miserable people than happy people if the miserable people lower the average less than the happy people do).
  *   *Verdict:* Avoids Repugnance but creates perverse incentives against adding happy lives.

  **3. The Person-Affecting View**
  *   *Core Idea:* An outcome can only be better or worse if it is better or worse *for some particular person*.
  *   *Performance:*
      *   **Passes:** Avoids the Repugnant Conclusion (usually).
      *   **Passes:** The Asymmetry (Fits well with the idea that we don't owe existence to the unborn).
      *   **Fails:** **The Non-Identity Problem.** (It cannot explain why it is wrong to deplete resources if the resulting future people still have lives worth living, because they aren't "worse off" than they would have been otherwise).
      *   **Fails:** **Transitivity.** (In the Mere Addition Paradox, it often implies A is not worse than A+, and A+ is not worse than B, but B is worse than A).
  *   *Verdict:* Fits our intuition about harm, but fails to guide long-term policy or maintain logical consistency.

  ### Summary for your Paper
  An adequate theory of population axiology faces a "trilemma." It can be logically consistent (Totalism), it can avoid the Repugnant Conclusion (Average View), or it can respect the intuition that we only owe duties to specific people (Person-Affecting), but it cannot do all three. Your paper should focus on which constraint is the least costly to abandon.
