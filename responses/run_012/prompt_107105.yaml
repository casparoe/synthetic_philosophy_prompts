      *   Ensure the "donor appeal" holds (the stakes are still high, just more complex).

  *(Self-Correction during final review)*: Make sure the term "Individuation Discount" is introduced clearly. It sounds technical, so I need to immediately ground it. I will have the Chair attribute it to an advisor but explain it in plain English.

