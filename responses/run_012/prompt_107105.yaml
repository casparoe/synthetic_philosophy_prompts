answer: |-
  Good evening. Thank you for being here.

  Looking around this room, I see a gathering that is, frankly, rare. We have entomologists who have spent lifetimes watching insects without feeling the need to ask if they are suffering. We have donors who have looked at the sheer numbers of insects on this planet and decided that even a sliver of a chance demands action. And we have philosophers and scientists who are here to make sure we don't fool ourselves with fuzzy definitions.

  If I were to try to pretend that we all agree on what we are doing tonight, I would insult your intelligence. Some of you are worried that this foundation is about to turn biology into a moral crusade. Some of you are worried that we are being too cautious, that the moral emergency is already here. And some of you are just waiting to see if we know the difference between a reflex and a feeling.

  I am not going to try to resolve those tensions tonight. In fact, I think those tensions are the engine of this foundation. But I do want to tell you why I am excited to lead it, and I want to share a story about why I care.

  A few years ago, I was sitting on my porch, watching a paper wasp try to build a nest under the eave. It wasn't a grand spectacle. It was carrying a chewed-up pulp of wood fiber, struggling against a breeze that kept pushing it off course. It fell twice. The second time, it didn't just fly up randomly. It landed on the railing, paused, and seemed to orient itself against the wind before taking off again. It adjusted its approach. It compensated.

  Now, I am not standing here to tell you that wasp had hopes and dreams. I am not telling you it felt frustration in the way you or I do. But I am telling you that when it paused on that railing, I felt a distinct hesitation in my own hand. I wanted to help, but I didn't know if helping would harm. I realized I was interacting with a system that was responsive to its own state, and I didn't know the rules of engagement.

  That hesitation is where we begin.

  For our donors, I want to acknowledge the intuition that brought you here. It is the scale argument. It is the mathematical reality that there are quintillions of insects alive at any given moment. If there is even a one-in-a-thousand chance that an individual insect can experience something like pain, the expected amount of suffering in the world dwarfs almost anything else we worry about. It is a staggering calculation. It suggests that if we are wrong to ignore them, the cost is astronomical.

  That arithmetic is compelling. But arithmetic requires units. You have to know what you are counting.

  This brings me to the entomologists and the scientists in the room. I know that for many of you, the leap from "complex behavior" to "sentience" feels like a category error. You describe mechanisms, adaptive responses, and evolutionary pressures. You do not need the word "sentience" to do your work. And you are right to be skeptical of people who want to overlay human moral drama onto a beetle.

  However, I want to introduce a concept that one of our scientific advisors has been pushing, which I think bridges the gap between the donors' arithmetic and the biologists' precision. We are calling it the "individuation discount."

  Here is the idea in plain English: The scale argument assumes that the unit of moral concern is the individual insect. One ant, one bee, one fly. It assumes that if you have a colony of ten thousand ants, you have ten thousand potential loci of suffering.

  But biology is rarely that neat. What if the unit of sentience isn't the individual?

  Consider a eusocial colony. In some ways, the colony functions as a single organism. The workers are like the hands; the queen is like the reproductive system. If the "mind" or the "feeling" exists at the level of the colony, then counting every worker as a separate moral individual is like counting every cell in your body as a separate person. It inflates the numbers by orders of magnitude. If the colony is the unit, the scale of the problem shrinks dramatically.

  That sounds like good news for the skeptics. It suggests the moral ledger isn't as bloated as we feared. But—and this is crucial—the individuation discount cuts both ways.

  If the individual adult insect isn't the unit, what is? It could be a developmental stage. Perhaps the larval stage is where the capacity for experience is concentrated, while the adult is merely a dispersal mechanism. If that were true, we might be focusing our welfare concerns on the wrong part of the life cycle entirely. Or, perhaps the unit is a functional subsystem. Maybe certain neural structures that we haven't been mapping are the true seat of experience, regardless of the organism's boundaries.

  This is why I need the entomologists in this room to stay. This is not a request for you to become ethicists. It is a request for you to be biologists. The question "What is the unit of sentience?" is not a metaphysical question. It is a biological one. It is a question about neural integration, about behavioral flexibility, about how information is processed in a system.

  If we simply assume the individual insect is the unit, we are doing bad math. But if we assume there is no unit at all, we might be missing something real. The "individuation discount" is not a way to dismiss the problem. It is a way to refine the map.

  This is the mission of the two-year grant program we are launching tonight.

  We are not funding grants to "prove insects feel pain." That is a verdict, and it is not ours to give yet. We are funding grants to map the territory where pain *could* live.

  We want to support research that looks for the correlates of sentience without demanding a confession from the subject. We want to know more about how insect nervous systems integrate information. We want to understand the differences between a reflex arc and a motivated avoidance behavior. We want to know if a colony acts as a single cognitive agent or a collection of automatons.

  For the donors: This is risk mitigation. You want your money to address the actual scale of the problem. If the scale is smaller because the unit is the colony, you deserve to know that. If the scale is relocated because the unit is the larva, you deserve to know that too. Funding this research ensures that your investment is targeting the reality, not just the arithmetic.

  For the entomologists: This is descriptive science. We are asking you to help us define the boundaries of the systems we are studying. You have the tools to distinguish between a sophisticated robot and a subject. We are not asking you to sign a moral declaration. We are asking you to help us count correctly.

  And for the philosophers: We are committing to epistemic humility. We are acknowledging that we do not know the answer, and that the answer might change the shape of the question.

  I know there is a temptation on all sides to settle this tonight. The donors want to know if they should be writing bigger checks. The skeptics want to know if they can go back to studying behavior without the moral weight. I am asking you to accept a state of productive uncertainty.

  We are not here to conscript you into a crusade. We are here to admit that we are interacting with a world we do not fully understand, and that the stakes of being wrong are high.

  That wasp on my porch eventually finished its nest. It hung there, gray and papery, for the summer. I never knew what was happening inside it. I didn't know if the wasps inside were experiencing a world of light and dark, or if they were simply executing code written by their genes. But I learned that my uncertainty was not a reason to look away. It was a reason to look closer.

  So, here is my ask.

  Support this grant program. Not because we know the answer, but because we know how to ask the question. Help us fund the work that determines whether we are counting heads, or colonies, or something else entirely. Help us find the right unit of account for the moral ledger of the natural world.

  If we are right to worry, we need to know where the worry belongs. If we are wrong, we need to know that too, so we can focus our resources where they are most needed. Either way, the only way out is through better science.

  Thank you for your time, thank you for your skepticism, and thank you for your generosity. Let's get to work.
