          *   1/3 Philosophers/Welfare Scientists (alert to equivocation, want conceptual clarity).
      *   **Key Concept:** "Individuation Discount" (the unit of sentience might not be the individual insect; could be colony, stage, etc.).
      *   **Goals:**
          *   Make the scale argument vivid for donors.
          *   Do *not* pretend sentience is settled fact.
          *   Give entomologists a reason to stay (respect their standards, offer scientific nuance).
          *   Explain "individuation discount" simply and show it cuts both ways (reduces scale but relocates concern).
          *   End with a concrete ask for the grant program independent of metaphysical resolution.
      *   **Tone:** Personal, honest, not a position paper, one small anecdote allowed.
      *   **Constraints:** No citations, reading lists, or specific book/paper references. ~10 minutes spoken (approx. 1,300 - 1,500 words).

  2.  **Deconstruct the Audience Dynamics:**
      *   *Entomologists:* Need to feel respected as experts. They hate moralizing over data. The speech must validate their skepticism as scientifically healthy, not obstructive.
      *   *Donors:* Need to feel their money matters. The scale argument is their motivation. Don't debunk it entirely, but refine it so it's more robust.
      *   *Philosophers:* Need to see intellectual honesty. No sleight of hand regarding uncertainty.

  3.  **Drafting - Section by Section:**

      *   **Opening:** Welcome everyone. Acknowledge the diversity of the room. Set a tone of humility and curiosity.
      *   **The Anecdote:** Needs to be evocative but not anthropomorphic. A moment of complex behavior that hints at *something* without claiming proof. Let's go with a bee or a wasp. The prompt suggests a wasp. Let's make it about a wasp struggling or making a choice.
      *   **The Scale Argument (for Donors):** Acknowledge why they are here. The numbers are staggering. Trillions of insects. Even a tiny chance matters. Validate their intuition.
      *   **The Pivot (for Entomologists & Philosophers):** But wait. The math is only as good as the units. Enter the "Individuation Discount."
      *   **Explaining the Concept:** Use an analogy. Maybe an orchestra? Or a superorganism? Let's use the colony as a single mind vs. individual workers. Or the idea of a "functional subsystem." Keep it jargon-free.
      *   **The "Cut Both Ways" Aspect:** It might mean fewer moral units (a colony is one, not 10,000 ants). OR it might mean we are ignoring things that *are* units (maybe a larval stage feels more than an adult). This shows scientific openness.
      *   **The Ask (The Grant Program):** What are we funding? Not a verdict on sentience. But better maps of the territory. Behavioral proxies, neural correlates, etc. We need data to decide *what* counts, not just *if* it counts.
      *   **Closing:** Bring it back to shared purpose. Humility. Action despite uncertainty.

  4.  **Refining the Tone:**
      *   Avoid: "We must save them," "It is obvious," "Science says."
      *   Use: "We wonder," "The data suggests," "It is possible," "Our advisors propose."
      *   *Self-Correction during drafting:* I need to make sure I don't sound like I'm dismissing the scale argument to the donors. I need to frame the "individuation discount" as a way to make their investment *smarter*, not less necessary. For the entomologists, frame it as a call for better biological definition, which is their expertise.

  5.  **Drafting - The "Individuation Discount" Explanation:**
      *   How to explain this simply?
      *   *Idea:* Counting heads vs. counting minds.
      *   *Analogy:* If you count every neuron as a "thinker," you get billions of thinkers in one human. That's wrong. The unit is the human. Maybe for ants, the unit is the hill.
      *   *Counter-point:* But maybe the larva is the feeler, not the worker. So we might be undercounting.
      *   *Result:* We need biologists to tell us where the boundaries are.

  6.  **Drafting - The Ask:**
      *   We aren't funding "Prove they feel."
      *   We are funding "Map the capacities."
      *   This appeals to entomologists (descriptive science) and donors (risk mitigation) and philosophers (conceptual clarity).

  7.  **Review against Constraints:**
      *   10 minutes? (Word count check: ~1400 words is usually safe for 10 mins at a moderate pace).
      *   No citations? (Check).
      *   One anecdote? (The wasp).
      *   Honest about uncertainty? (Yes).

  8.  **Final Polish:**
