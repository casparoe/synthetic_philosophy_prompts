answer: |-
  ### Criteria for Ranking

  To determine which mechanisms are "load-bearing" for a modern analogy, I have applied three criteria:

  1.  **Translatability:** Does the mechanism exist in a recognizable form in contemporary liberal democracies? (e.g., Do modern states have client armies, or do they have politicized security apparatuses?)
  2.  **Causal Leverage:** Is the mechanism a root driver of instability, or is it a symptom of deeper structural shifts?
  3.  **Non-Tautology:** Does the mechanism explain *why* the system failed, or does it merely describe the failure (e.g., "democracy died because norms died")?

  ### The Ranking

  **1. The Erosion of Elite Norms and Unwritten Restraints (*Mos Maiorum*)**
  *   **Analogue:** Forbearance and Mutual Toleration (Levitsky/Ziblatt).
  *   **Justification:** This is the most direct load-bearing beam. Modern democracies, like the Republic, rely on actors voluntarily limiting their own power despite having the legal capacity to do more. When parties treat political opponents as existential enemies rather than rivals, the system loses its shock absorbers.
  *   **Caveat:** Without the "Self-Enforcing Equilibrium" lens (see below), this risks being descriptive rather than explanatory.

  **2. The Tribunate as a Personal Mobilizing Platform**
  *   **Analogue:** Executive Aggrandizement / Plebiscitary Leadership.
  *   **Justification:** This mechanism explains *how* norms are broken. The Tribunate allowed leaders to bypass the Senate and appeal directly to the masses, using legal office for extra-legal ends. This maps cleanly onto modern executives using emergency powers, referenda, or media dominance to sideline legislatures and courts. It is the active *vehicle* of erosion.

  **3. The Land Question and the Fate of the Urban Poor**
  *   **Analogue:** Extreme Economic Inequality and Precarity.
  *   **Justification:** This explains *why* norms break. In the Republic, the stakes of political loss became existential because economic survival was tied to political patronage. In modern democracies, extreme inequality raises the stakes of electoral loss, making compromise feel like surrender. It alters the payoff matrix of the constitution.

  **4. Legal and Geographic Overextension of Citizenship**
  *   **Analogue:** Polarization over National Identity and Scale of Governance.
  *   **Justification:** The Social War and subsequent integration struggles created friction over who belonged to the "Republic" and what rights they held. Modern analogues exist in immigration debates and the tension between local/national governance. However, this is often a *tool* used by populists (Mechanism #2) rather than a standalone cause of collapse.

  **5. Professionalization of the Army and Rise of Client Armies**
  *   **Analogue:** Politicization of Security Apparatus / Partisan Militias.
  *   **Justification:** This is the weakest link for a modern analogy. In Rome, the state lost its monopoly on violence to private warlords. In modern established democracies, the military remains professionalized and civilian-controlled. While the erosion of trust in security institutions is a risk, the specific mechanism of "generals marching on the capital" is a category error for most contemporary democratic erosion, which is typically legalistic and electoral.

  ---

  ### Causal Map: Upstream and Downstream

  To avoid treating these as a laundry list, they must be ordered causally:

  *   **Upstream (Structural Pressures):**
      *   **Inequality (Land Question):** Raises the stakes of political competition.
      *   **Overextension (Citizenship):** Increases heterogeneity and coordination costs.
  *   **Midstream (Political Strategy):**
      *   **Tribunate (Populism):** Entrepreneurs exploit upstream pressures to bypass institutional veto points.
  *   **Downstream (Systemic Failure):**
      *   **Norm Erosion:** As the Tribunate mechanism is used successfully, forbearance collapses. The "game" changes from repeated cooperation to one-off defection.
  *   **Terminal (Collapse):**
      *   **Army (Violence):** Once norms and institutions fail, violence becomes the final arbiter. In the modern analogy, this is civil conflict or authoritarian consolidation, not necessarily military coup.

  **What moves a mechanism up or down?**
  *   **Up:** If evidence shows the mechanism *precedes* the others chronologically or logically. (e.g., If inequality rises *before* norms erode, inequality moves up).
  *   **Down:** If the mechanism is shown to be *endogenous* (a result of the collapse rather than a cause). (e.g., If norm erosion is simply the result of high-stakes inequality, it moves down as an explanatory variable).

  ---

  ### The Self-Enforcing Equilibrium Verdict

  **Does it do real analytic work?**
  Yes, but only if treated as a **game-theoretic framework** rather than a moral judgment.
  *   **The Trap:** If you say "the constitution collapsed because actors defected," you have merely redescribed the collapse.
  *   **The Work:** If you say "the constitution collapsed because the *payoff structure* changed such that defection became the rational dominant strategy," you have identified the cause. The equilibrium holds only when the long-term benefit of maintaining the system outweighs the short-term benefit of breaking it.

  **Does this verdict reorder the ranking?**
  **Yes, significantly.**

  If we accept the self-enforcing equilibrium model, **Norms (Rank #1)** cease to be an independent cause and become the *dependent variable*. Norms are simply the behavioral manifestation of a stable equilibrium. They do not "erode" on their own; they erode because the incentives sustaining them have vanished.

  **The Reordered Analytic Ranking:**
  1.  **Inequality (The Stakes):** This changes the payoff matrix. If losing an election means economic ruin, players will defect. This becomes the primary upstream driver.
  2.  **Tribunate (The Capacity):** This changes the *ability* to defect. If institutions are too robust, high stakes don't matter. If one actor can capture the state (via the Tribunate mechanism), defection becomes viable.
  3.  **Norms (The Equilibrium Outcome):** This is no longer a mechanism of erosion, but the *measure* of stability. Focusing on "restoring norms" without fixing the incentives (Inequality) or the capacity to defect (Tribunate/Institutions) is futile.
  4.  **Citizenship (The Coordination Cost):** High heterogeneity makes sustaining the equilibrium harder (harder to agree on the "game"), but is secondary to Stakes and Capacity.
  5.  **Army:** Remains last.

  **Implication for your Seminar/Essay:**
  If you adopt the equilibrium framework, your policy essay cannot simply urge "return to civility." It must argue for **lowering the stakes of political power** (reducing inequality/corruption) and **hardening institutions against capture** (limiting the modern Tribunate).

  ---

  ### Mechanisms to Drop

  **1. The "Client Army" as a Direct Analogue**
  *   **Reason:** It invites the "coup fallacy." Most modern democracies do not fall to generals; they fall to elected autocrats. Focusing on the military distracts from the legalistic, electoral nature of modern erosion.
  *   **Replacement:** Focus on the **Politicization of Bureaucracy and Justice**. In Rome, the army was the enforcement arm of the patron. Today, the enforcement arm is the civil service, police, and courts. When these become partisan, the "client army" dynamic is replicated without the legions.

  **2. Moralized "Norm Erosion" (without Incentive Structure)**
  *   **Reason:** Treating norms as purely cultural or moral habits ("politicians became greedier") is analytically empty.
  *   **Replacement:** Treat norms as **Coordination Equilibria**. They hold because they are useful, not because they are virtuous. They break when they are no longer useful to the dominant faction.

  ### Summary Recommendation for the Unit

  Structure the seminar to move from the **Symptoms** (Norms) to the **Diagnosis** (Equilibrium/Incentives).

  1.  **Week 1 (The Symptom):** Study the breakdown of *mos maiorum* (Sulla, Caesar). Map this to modern forbearance.
  2.  **Week 2 (The Vehicle):** Study the Tribunate and the *Populares*. Map this to executive aggrandizement and plebiscitary politics.
  3.  **Week 3 (The Cause):** Apply the Self-Enforcing Equilibrium model. Analyze how the Land Question (Inequality) raised the stakes of politics until the equilibrium shattered.
  4.  **Policy Essay:** Argue that saving modern democracy requires not just "norm entrepreneurship," but structural changes that lower the stakes of political loss and reduce the capacity for unilateral executive action. The Roman Republic was not saved by Cato's virtue; it was doomed by a structure that made defection the only winning move.
