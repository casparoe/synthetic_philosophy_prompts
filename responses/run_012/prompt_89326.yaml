      *   **Drops:** Explicitly state what to cut.

  10. **Self-Correction/Nuance Check:**
      *   *Caution:* Don't let the "Norms" ranking be tautological. "Norms broke because norms broke." I must define norms as *coordination devices* that lower transaction costs.
      *   *Caution:* The "Army" point. While modern democracies don't have warlords, they do have "politicized security apparatuses" or "partisan militias." I should acknowledge this nuance but maintain the ranking that the *Roman* specific mechanism (client legions) is a poor fit.
      *   *Equilibrium Theory:* Be careful not to dismiss it as tautology. It's a game-theoretic lens. It explains *stability*, not just collapse. It reorders the ranking by making "Stakes" (Inequality) more important than "Character" (Norms). Actually, if the theory is about incentives, then **Inequality** might be #1 because it changes the incentives. But for a *policy essay*, focusing on **Norms/Institutions** is more actionable. I will argue the Equilibrium theory elevates Inequality analytically, but Norms remain the primary *political* analogue.
      *   *Wait, re-reading the prompt:* "whether that verdict reorders the ranking." I need to be decisive. If the Equilibrium theory is valid, the *payoff structure* is the root. Therefore, **Inequality** (stakes) and **Tribunate** (ability to capture) are upstream of **Norms** (which are just the equilibrium outcome). So, analytically, Inequality moves up. Pedagogically/Politically, Norms remain the focus. I will distinguish between *Analytic Ranking* vs. *Pedagogical Ranking*. Or better, integrate them: The Equilibrium view makes Norms *endogenous*, not exogenous. This is a crucial distinction.

      *   *Final Decision on Ranking:*
          1.  Erosion of Norms (The immediate mechanism of failure).
          2.  Tribunate/Populism (The vehicle for erosion).
          3.  Inequality/Land (The driver of high stakes).
          4.  Citizenship/Scale (The complicating factor).
          5.  Army (The disanalogy).

      *   *Wait, if Equilibrium theory is central:* Norms are the *result*, not the *cause*. The cause is the change in incentives. So Inequality should be #1 analytically. But the prompt asks for mechanisms of *erosion*. Norm erosion *is* the erosion. Inequality is the *cause* of the erosion. I will rank based on "Load-bearing for the analogy of *how* democracies erode."
