      *   *Re-evaluating Equilibrium Impact:* If the constitution is self-enforcing, it fails when a faction can *win* by breaking rules. This requires **Capacity** (Tribunate) and **Incentive** (Inequality). Norms are just the shadow of the equilibrium. If I accept the Equilibrium theory, **Norms** drop in explanatory power (they are the dependent variable) and **Inequality/Tribunate** rise (independent variables). I will make this distinction clear.

  11. **Final Polish:** Ensure tone is academic, rigorous, and directly answers the "criteria," "upstream/downstream," and "drop" requirements. (Self-correction: Ensure I explicitly answer the "does it reorder" question).

