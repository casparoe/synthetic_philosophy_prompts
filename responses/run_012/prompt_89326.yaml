      *   **Citizenship Overextension:** Nuanced. The Social War was about integration. Modern analogies exist (immigration), but it's often a *tool* for populism rather than a structural cause of collapse on its own. I'll keep it but rank it lower.

  9.  **Refining the Output Structure:**
