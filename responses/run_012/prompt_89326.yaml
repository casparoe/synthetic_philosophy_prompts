      *   *Tribunate/Populism:* High relevance. Executive aggrandizement, bypassing institutions, direct appeal to the people.
      *   *Land/Inequality:* Medium/High relevance. Economic inequality drives polarization, but the specific mechanism (landless peasants -> mob violence) is less direct than "economic anxiety -> populist voting."
      *   *Citizenship/Overextension:* Medium relevance. Immigration, polarization over national identity, scale of governance.

  3.  **Analyzing the "Self-Enforcing Equilibrium" Theory:**
      *   *Concept:* A constitution holds only if all relevant factions prefer staying within the rules to breaking them, given what others do. It collapses when a faction finds defection profitable.
      *   *Critique:* Is it tautological? "It collapsed because they wanted to defect." Or is it predictive/explanatory? "It collapsed because the payoff structure changed (e.g., stakes got too high, enforcement got too weak)."
      *   *Verdict:* It's a *framework*, not a mechanism. It explains *why* the other mechanisms matter (they change the payoff matrix). It doesn't replace them; it organizes them. It adds analytic work if it forces us to look at *incentives* rather than just *morality*.

  4.  **Drafting the Ranking Criteria:**
