      *   This elevates **Norms** (forbearance) and **Tribunate** (ability to bypass). It demotes **Army** (unless we equate it to partisan paramilitaries, which is weak). It makes **Inequality** crucial because it raises the stakes (distributional conflict).

      *   *Revised Ranking Logic:*
          1.  **Norms/Restraints:** This is the direct analogue to "forbearance and mutual toleration." It is the immediate cause of breakdown.
          2.  **Tribunate/Populism:** This is the *method* used to break norms. (Executive aggrandizement).
          3.  **Inequality/Land:** This raises the stakes, making the equilibrium unstable. (Why defect? Because losing means ruin).
          4.  **Citizenship/Scale:** This creates the heterogeneity that makes consensus harder.
          5.  **Army:** Too specific to Rome. Modern democracies have professional, civilian-controlled militaries.

  6.  **Addressing the "Self-Enforcing Equilibrium" Question:**
      *   Does it do work? Yes, if it shifts focus from "bad actors" to "incentive structures." It explains why good people break rules (because the rules no longer protect them).
