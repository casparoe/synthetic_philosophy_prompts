          2.  **Causal Primacy:** Is it a root cause or a symptom?
          3.  **Systemic Leverage:** Does triggering this mechanism destabilize other parts of the system?
          4.  **Non-Triviality:** Does it explain *why* norms broke, rather than just saying "norms broke"?

  5.  **Developing the Ranking (Iterative Process):**

      *   *Attempt 1 (Intuitive):* Norms (1), Populism/Tribunate (2), Inequality (3), Citizenship (4), Army (5).
