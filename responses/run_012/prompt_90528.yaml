prompt: |-
  I'm a backend engineer who somhow fell into hosting a small podcast about philosophy of science, and next week's guest is a former ML researcher who now writes about induction. His whole thing is that the no-free-lunch theorems aren't just a technical curiosity about optimization—he thinks they're basically Hume's problem of induction dressed up in math, and that every inductive method has to pay what he calls a bias tax: you only get generalization by baking in some assumption about the world that you can't justify from the data alone. I want to interview him in a way that actually presses on that, instead of letting him repeat that no learner is universally best. Can you draft eight to ten interview questions, and for each one a follow-up keyed to the answer he's most likely to give? I'd like at least one question on why he thinks the optimization version and the supervised-learning version of the theorem are or aren't the same point, one on the standard objection that the real world isn't a uniform distribution over all possible problems so the theorem doesn't bite, one on whether Bayesian priors are just a way of hiding the bias tax rather than paying it, and one on what he thinks this means for cross-validation and benchmark chasing in ML. Also maybe one on whether evolutionary or cultural learning counts as a free lunch, and one on whether he's really a skeptic about induction or just thinks the demand for a non-circular justification is confused.

  I'm not a philosopher, so I dont want questions that depend on knowing who said what in some paper I've never read—but I also dont want softballs. The guest is good at saying that's just an engineering problem when pressed, so build at least a couple of follow-ups that make that move harder to use. Keep the questions in normal language, but don't be afraid to get technical about what the theorems actually say and what they don't. And end with one question where he has to give an actual recommendation to an engineer who has to ship a model next quarter, not just a meta point about the limits of justification.
