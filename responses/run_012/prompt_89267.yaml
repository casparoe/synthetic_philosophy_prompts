  1. Commitment 4 (Forward-looking Justification) vs. Commitment 8 (Lineage Eligibility). This is the most severe theoretical conflict. If the strongest justification is reducing present injustice and rebuilding relationships (4), then eligibility should track present disadvantage or political alienation. However, 8 prioritizes lineage over equal need. If a non-descendant is equally needy, a strictly forward-looking view cannot explain why the descendant deserves priority. The historical wrong itself is doing the justificatory work here, which is backward-looking. To resolve this, you must either abandon the primacy of the forward-looking justification or weaken the lineage requirement. Giving up 4 undermines your distinction from guilt-based models, inviting non-identity objections regarding the connection between past and present. Giving up 8 dilutes the specific connection to the historical wrong, turning reparations into general welfare. The cost of modifying 4 is theoretical purity; it forces you to admit a hybrid justification, making you vulnerable to critics who argue that without backward-looking desert, lineage is arbitrary. The cost of modifying 8 is political specificity; it turns reparations into general welfare, potentially losing the support of claimants who seek recognition of their specific ancestral harm.

  2. Commitment 4 (Forward-looking Justification) vs. Commitment 7 (Traced Land Tax). Commitment 7 finances reparations through a tax on parcels tracing to specific dispossessions. This mechanism relies on backward-looking causal chains to assign financial burden. If the justification were purely forward-looking, general revenue or progressive taxation based on current capacity would suffice. Tracing titles implies the land carries a historical debt, resembling backward-looking liability. Resolving this requires decoupling the funding source from the specific historical wrong or admitting the funding relies on backward-looking principles. Abandoning the traced tax simplifies administration but loses the symbolic recognition of specific theft. It severs the link between the specific harm and the specific remedy. Maintaining it while insisting on a forward-looking justification creates a disconnect between why we pay (history) and why we repair (future), risking charges of inconsistency regarding property rights.

  3. Commitment 2 (Group Claims) vs. Commitment 5 (Individual Non-responsibility). While Commitment 6 bridges this, a tension remains in moral ontology. If individuals cannot be responsible for uncommitted wrongs, how does the group bear an obligation without aggregating individual responsibility? If the state is merely an instrument of citizens, 6 fails. You must assert the state is a moral agent distinct from its constituents. Giving this up collapses the state into its citizens, destroying the possibility of non-culpable obligation. The cost here is metaphysical: you must defend a robust theory of corporate agency against methodological individualists. If you cannot sustain this, the entire package collapses into individual liability, which 5 forbids. This tension requires you to navigate between collectivism and individualism carefully. If you lean too far into collectivism to save 6, you risk violating the liberal intuition behind 5. If you lean too far into individualism to protect 5, you cannot sustain 6. The cost is a demanding metaphysical defense of state agency that must be robust enough to carry debt but light enough to avoid implicating individual conscience.

  Apparent Tensions That Dissolve

  Several apparent conflicts resolve upon closer inspection of the state's moral status. Commitment 3 (no current culpability) and Commitment 5 (no responsibility for uncommitted wrongs) seem to clash with Commitment 6 (state inherits obligations). However, this tension dissolves if the state is understood as a continuous corporate entity distinct from its current citizenry. The obligation attaches to the office and the institution, not the biological individuals occupying it. Therefore, citizens are not personally culpable (satisfying 3 and 5), but the polity remains liable (satisfying 6).

  Similarly, Commitment 1 (historical injustices generate claims) and Commitment 5 (no responsibility for past) appear contradictory. This dissolves because generating a claim does not require assigning fault to the payer. A no-fault insurance scheme illustrates this: obligations arise from harm and relationship, not necessarily moral blame. Since your framework relies on political relationship rebuilding (4) rather than punishment, the lack of individual culpability does not negate the obligation to repair the breach. The state's continuity allows it to bear the burden of repair without implying the moral guilt of its current members, harmonizing the backward-looking claim with forward-looking responsibility.

  Furthermore, Commitment 2 (group claims) and Commitment 5 (individual non-responsibility) seem to conflict regarding who bears the burden. This dissolves because group claims target collective structures, not individual consciences. The obligation is institutional. As long as the remedy does not require individual moral confession, but rather institutional resource transfer, the individual remains innocent while the group fulfills the duty. This distinction preserves the moral integrity of current citizens while acknowledging the collective debt of the polity.

  The Cheapest Single Revision

  The most efficient revision is to modify Commitment 4. Currently, it asserts the strongest justification is forward-looking. This creates the friction with lineage-based eligibility (8) and traced funding (7). You should revise 4 to claim that forward-looking benefits are necessary conditions for the mode and feasibility of reparations, but not the sole ground of the claim. Acknowledge a hybrid justification: the claim arises from the historical wrong (backward-looking), but the form and limit of repayment are determined by present justice and relationship (forward-looking). This preserves the lineage requirement as grounded in the historical fact of the wrong, while maintaining the forward-looking focus on implementation. It avoids the contradiction of using backward-looking criteria for eligibility while denying backward-looking justification. By admitting that the historical wrong generates the entitlement, you validate Commitment 8 without abandoning the forward-looking benefits of Commitment 4. This shift protects the package from charges of arbitrariness regarding lineage while keeping the focus on future political health. It clarifies that guilt is not required for obligation, but history is required for eligibility.

  The Residual Cost of That Revision

  Revising Commitment 4 incurs a theoretical cost. By admitting a backward-looking element to the justification, you become vulnerable to non-identity objections. If the claim depends on the historical wrong, critics will argue that present descendants might not exist but for the injustice, complicating the harm claim. You also lose the clean moral high ground of purely forward-looking theories, which avoid metaphysical disputes about historical causation. Additionally, you must now explain why the historical wrong binds the current state if not through a robust theory of continuity that rivals guilt-based models. The package becomes more complex, requiring a dual justification rather than a single, elegant forward-looking principle.
