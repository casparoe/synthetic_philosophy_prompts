  7.  **Step 5: Managing "Settled" vs. "Contested":**
      *   *Settled:* Thought exhibits productivity and systematicity. Fodor posits LOT. LOT posits syntax + semantics. NL has speakers/conventions; Mentalese (allegedly) does not.
      *   *Contested:* Is LOT the *only* explanation for systematicity? (Connectionists disagree). Is the "language" label literal or metaphorical? (Fodor says literal, critics say metaphorical). Does the genetic analogy hold water? (Philosophy of biology vs. philosophy of mind).

  8.  **Drafting the Response (Iterative refinement):**
