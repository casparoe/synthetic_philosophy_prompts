      *   *The Audit:* The friend is right that "Language" carries baggage. But Fodor needs "Language" to imply *Syntax*. "Structured system" is too vague (could be maps). "Genetic Code" is too static (no inference).
      *   *Conclusion:* The systematicity argument stands on its own. The "Language" label is a heuristic for "Combinatorial Syntax." The friend is right that the *social* aspect is noise, but wrong that the *label* is useless—it secures the syntactic requirement against pictorial/connectionist alternatives.

      *(Self-Correction during drafting)*: I need to be careful not to validate Fodor's view as truth. I must present it as *his* argument. The prompt asks to keep settled/contested apart. I need to explicitly mark where philosophers disagree (e.g., Connectionists deny LOT is necessary for systematicity).

      *(Refining the Genetic Code point)*: The friend says DNA is a code without a community. Philosophers of biology (like Godfrey-Smith) argue about whether DNA is *really* a code or just a causal template. If it's just causal, it lacks the arbitrariness of a code. If it is a code, who is the decoder? The ribosome? That's a mechanism, not a speaker. This supports the friend's "no speaker" point but undermines the "computation" point. I need to highlight this tension.

