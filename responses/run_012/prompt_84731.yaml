      *   *Fodor's Defense:* "Language" is shorthand for "Compositional Representational System with Syntax." He needs the syntax to be *autonomous* from semantics (formal operations). Natural languages are the only existing proof-of-concept we have of systems that do this.
      *   *Audit:* The friend is largely right that the *social* connotations of "language" are baggage. However, Fodor isn't using the analogy to prove thought exists; he's using it to prove thought is *computational*. The "language" label signals "syntax."
