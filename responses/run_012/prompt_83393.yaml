      *(Self-Correction on Verdict)*: It's not just about who won the debate, but who represented Lakatos correctly. Nadia represents Lakatos correctly (methodology of scientific research programmes is largely reconstructive). Tobias wants a *method* in the sense of a decision procedure. Lakatos doesn't provide that. So Nadia wins on fidelity, Tobias wins on desire, but loses on argument.

