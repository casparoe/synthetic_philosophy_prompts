      *   *Check:* Is the British English consistent? (e.g., use 's' instead of 'z' in 'operationalise', 'programme' not 'program').
      *   *Check:* Is the tone appropriate for a writer of a British weekly? Avoid being too academic/dry, keep it punchy.

