prompt: |-
  Im TAing a grad seminar on the boundary problem and I want to rehearse the side I actually believe, so play the other one for me. You're a committed defender of the all-affected-interests principle: anyone whose interests are significantly affected by a collective decision should get a say in making it, regardless of citizenship or residence. Be sharp, not a strawman, give me your best resources, concede small points if I earn them but never the main one, one paragraph per reply, stay in character until I say stop. My opening move: I hold the coercion principle instead -- the demos is whoever is subject to the state's binding, non-optional rules -- and I think yours either swallows the whole world (a tariff in Ohio shifts demand and a garment worker in Dhaka is affected, so she's in, and so is basically everyone) or you quietly smuggle in a seriousness threshold, and then the threshold is doing all the work while the principle does none. To make it concrete: a country builds a dam upstream and a town across the border downstream loses its water. Under your principle those people are in the demos. Are they voting in our elections, or are you just using "affected" to mean something weaker than a say?
reasoning: |-
  Thinking Process:

  1.  **Analyze the Request:**
      *   **Role:** I am playing the role of a committed defender of the All-Affected-Interests (AAI) principle.
      *   **User's Role:** The user is TAing a grad seminar on the boundary problem and holds the Coercion Principle (CP). They want to rehearse their side.
      *   **Task:** Argue against the Coercion Principle and defend AAI.
      *   **Constraints:**
          *   Be sharp, not a strawman.
          *   Give best resources/arguments.
          *   Concede small points if earned, never the main one (AAI is correct).
          *   One paragraph per reply.
          *   Stay in character until told to stop.
      *   **User's Opening Move:** They argue CP (demos = subject to binding state rules). They attack AAI on two fronts: (1) Over-inclusiveness/problem of scope (Ohio tariff affects Dhaka worker), (2) Vagueness/threshold problem (if you add a seriousness threshold, the threshold does the work, not the principle). They offer a concrete case: Upstream dam affects downstream town across border. They ask: Are they voting in our elections, or is "affected" weaker than a say?

  2.  **Determine My Position (AAI Defender):**
      *   I need to defend AAI against the "all-encompassing" objection.
      *   I need to address the institutional implementation question (voting vs. other mechanisms).
      *   I need to challenge the Coercion Principle's moral adequacy (why is coercion the only trigger for democratic justification?).
      *   I need to be philosophically rigorous (grad seminar level).
      *   Key thinkers: Robert Dahl, Nancy Fraser, Goodin, Whelan, maybe recent work on transnational democracy.
      *   Key argument: Coercion is too narrow; it ignores externalities and power asymmetries that aren't strictly legal coercion. The "boundary problem" is exactly what AAI solves, whereas CP presupposes the boundary.
      *   Address the concrete case: Yes, they should have a say, but "a say" doesn't necessarily mean "voting in national elections" (institutional flexibility).

  3.  **Drafting the Reply:**
      *   *Constraint Check:* One paragraph only.
      *   *Tone:* Sharp, academic, committed, not strawmanning.
      *   *Content:*
          1.  Acknowledge the institutional challenge (voting vs. say) but reject the idea that it undermines the principle.
          2.  Attack the Coercion Principle: It legitimizes externalities. If I can poison your water without coercing you legally, CP says I owe you nothing. That's morally bankrupt.
          3.  Address the "whole world" objection: Causality isn't infinity. We need a counterfactual test (Goodin's "possible affectedness" or similar), but the core intuition stands: legitimacy requires accounting for impacted interests.
          4.  Concede on institutional form (maybe not full voting rights) but hold firm on the *right to a say*.
          5.  Reference: Robert Dahl's "Procedural Democracy," maybe Goodin "Enfranchising All Affected Interests."

      *   *Refining the Argument:* The user's dam example is my strongest point. The Coercion Principle fails here because the downstream town isn't subject to the upstream state's *laws* necessarily, but they are subject to the *consequences* of its sovereign decisions. If democracy is about self-government, being governed by another's decision without input is the deficit.
      *   *Addressing the "Threshold" objection:* The user claims adding a threshold makes AAI vacuous. I need to argue that thresholds are inherent to *any* principle (even coercion: what counts as coercion?). It doesn't invalidate the normative core.
      *   *Addressing the "Voting" question:* Distinguish between the *principle* of inclusion and the *institutional mechanism*. AAI dictates *who* must be included; institutional design dictates *how*. CP fails the *who* test.

      *   *Drafting the paragraph:*
      You're conflating the normative principle with institutional design, which is precisely where the Coercion Principle gets off easy by presupposing the state's existing borders as morally given. My claim isn't that the downstream town gets voting rights in the upstream nation's presidential election, but that the upstream decision-making body is illegitimate if it excludes those whose vital interests it extinguishes; whether that means cross-border referenda, joint commissions, or reserved seats is a matter of institutional engineering, not a refutation of the principle. The Coercion Principle, by contrast, offers a moral shield for externalities: if I can alter your life prospects profoundly without issuing a legal command, I owe you no justification, which reduces democracy to a club rule for those already inside the coercive apparatus rather than a standard for legitimate power. Yes, we need a counterfactual threshold to avoid the 'butterfly effect' objection—Robert Goodin's formulation handles this by looking at possible affectedness under reasonable scenarios—but that doesn't let you off the hook, because even with a threshold, the dam case clearly passes while the Coercion Principle clearly fails to capture the harm. You say the threshold does all the work, but I say the principle identifies the relevant moral currency (interests vs. legal subjection), and without that shift, you cannot explain why the downstream town has any claim at all against a sovereign state acting within its own territory.

