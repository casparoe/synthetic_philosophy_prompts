answer: |-
  You have spotted something fundamental that often gets missed in the textbooks because it happens in the micro-interactions of the clinic, not in the DSM criteria. You are describing a rhetorical and moral maneuver, not just a clinical presentation.

  As a philosopher of psychiatry, I can tell you: **There is no single, canonical term for this specific bidirectional switching.** However, there are several "nearest neighbor" concepts that get part of the way there.

  Here is the breakdown of the existing landscape, the term I propose to fill the gap, and a framework for distinguishing the "tool" from the "excuse."

  ### 1. The Nearest Concepts (And Why They Miss)

  To understand what you're seeing, we have to look at why the standard terms don't quite fit.

  *   **The Sick Role (Talcott Parsons):** This is the classic sociological framework. It says if you are "ill," you are exempt from normal responsibilities (work, chores) *but* you have an obligation to try to get well.
      *   *Why it fails:* It assumes the patient *wants* the sick role. Your patients are toggling *in and out* of it. One wants the exemption without the obligation to get well; the other wants the responsibility without the exemption.
  *   **Medicalization / Demedicalization:** This describes society moving a behavior into or out of the realm of medicine (e.g., alcoholism becoming a "disease").
      *   *Why it fails:* This is a macro-societal trend. You are observing an individual, tactical decision made in real-time.
  *   **Stigma Management (Erving Goffman):** This describes how people hide or reveal a trait to protect their social standing.
      *   *Why it fails:* Stigma management is usually about *concealment*. Your patients are *revealing* the diagnosis but changing its definition to suit the moral outcome.
  *   **The Looping Effect (Ian Hacking):** This describes how classifying people changes how they behave, which in turn changes the classification.
      *   *Why it fails:* This happens over generations or long periods. You are seeing it happen in a single conversation.

  ### 2. The Coinage: "Ontological Bargaining"

  Since the existing terms describe the *state* of the diagnosis but not the *tactical movement*, I propose we call this **Ontological Bargaining**.

  *   **Ontological:** Refers to "what exists" or "what is real." (Is this a brain disease? Or a life problem?)
  *   **Bargaining:** Refers to a negotiation for moral capital. (What do I get if we agree it's real? What do I lose?)

  **Definition:** *Ontological Bargaining is the strategic adjustment of the perceived reality of a condition (biological vs. situational) to maximize moral advantage or minimize social cost in a specific context.*

  **Why this fits your cases:**
  *   **Patient 1 (Needs meds/time off):** Bargains *up* into biology. "It is chemical." **Payoff:** Exemption from blame, access to resources. **Cost:** Admitting defectiveness.
  *   **Patient 2 (Needs change/justice):** Bargains *down* out of biology. "It is situational." **Payoff:** Retains dignity/sanity, assigns blame to environment. **Cost:** Must endure the struggle without medical exemption.
  *   **The ADHD Kid:** Bargains *up* to avoid punishment ("I can't help it"), then bargains *down* to avoid control ("Don't change me").

  This isn't necessarily lying or manipulation. It is often a survival strategy. Patients are navigating a system that only gives resources to the "biologically ill" but only gives respect to the "morally resilient." They are trying to get both resources and respect, which the system rarely allows simultaneously.

  ### 3. The Line: Tool vs. Excuse

  You asked for the line between using a diagnosis as a tool and using it as an excuse. In philosophy of action, this is the difference between **Explanation** and **Exoneration**.

  Here is the carving:

  #### The Diagnosis as a Tool (Functional Agency)
  *   **The Logic:** "This condition explains the *barrier*, so I can build a *bridge*."
  *   **Time Orientation:** Future-focused. The label is used to facilitate action.
  *   **Responsibility:** The patient accepts responsibility for *management*, even if they reject responsibility for *cause*.
  *   **Example:** "I have depression, so I cannot work 60 hours. I need meds and a reduced schedule so I can eventually return to full capacity."
  *   **Verdict:** **Integration.** The diagnosis is integrated into a plan to restore function.

  #### The Diagnosis as an Excuse (Moral Absolution)
  *   **The Logic:** "This condition explains the *barrier*, so I am exempt from the *climb*."
  *   **Time Orientation:** Present/Past-focused. The label is used to justify stasis.
  *   **Responsibility:** The patient rejects responsibility for both *cause* and *management*.
  *   **Example:** "I have depression, so I cannot work. I need meds and time off until I feel like working."
  *   **Verdict:** **Segregation.** The diagnosis is segregated from the self as an external force that dictates terms.

  ### 4. Clinical Application: How to Spot the Switch

  As a nurse, you don't need to argue philosophy with them. You need to spot the *direction of travel*.

  **The "Ontological Bargain" Test:**
  When a patient invokes the diagnosis, ask yourself: **Does this label increase their locus of control or decrease it?**

  1.  **The "Not My Fault" Trap:** If they say "It's a chemical imbalance" *only* to shut down discussion about coping strategies, that is Ontological Bargaining for **Absolution**.
      *   *Response:* Validate the biology, challenge the stasis. "I agree the chemistry is off. That's why we treat the chemistry. But what is the plan for the behavior while the meds kick in?"
  2.  **The "Just Life" Trap:** If they say "It's not an illness, it's a rotten world" *only* to refuse interventions that might relieve suffering, that is Ontological Bargaining for **Purity**.
      *   *Response:* Validate the context, challenge the suffering. "You're right, the situation is rotten. But does suffering through it without support help you change the situation, or does it just keep you down?"

  ### Summary

  You are witnessing **Ontological Bargaining**.

  Patients are not just reporting symptoms; they are negotiating the **Moral Status** of those symptoms. They know that in our culture, "Disease" buys you care but costs you agency. "Normalcy" buys you agency but costs you care. They are trying to arbitrage the difference.

  **The Line:**
  *   **Tool:** The diagnosis serves the **person**. (I use the label to get what I need to function).
  *   **Excuse:** The **person** serves the diagnosis. (The label dictates what I cannot do).

  Your job isn't to stop the bargaining—that's impossible. It's to ensure the bargain doesn't bankrupt their future agency. If the label stops them from moving toward the life they say they want, it has shifted from tool to excuse, regardless of whether they call it "illness" or "life."
