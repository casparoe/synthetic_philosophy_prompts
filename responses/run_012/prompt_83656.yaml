prompt: |-
  I'm a psych nurse, not a philosopher, and theres a pattern I keep seeing that I don't have a word for. Two patients, same depression diagnosis. One says it's a real illness, a chemical imbalance, that's why she needs meds and time off. The other says it's not an illness at all, it's a sane response to a rotten situation, and calling it a disease just lets everyone off the hook. Both are using the "illness" label to do something: one to be excused, the other to assign responsibility. And the same person can switch: a kid says "I'm not bad, I have ADHD" when he's caught, then says "ADHD isn't an excuse, it's just me" when his mom wants him on meds. You're a philosopher of psychiatry — is there an established name for this, the way the same condition gets moved in and out of the illness category depending on what the speaker needs it to do? It's not just stigma, and it's not just medicalization, because it goes both ways. If there's no name, coin one and tell me what it's not, and where the line is between using a diagnosis as a tool and using it as an excuse. Brainstorm the nearest concepts first, then give me your best carving.
