prompt: |-
  I'm on the board of a small community credit union in a town that's been in a bad way since the plant closed — we're the only lender left for miles and we've basically stoped making loans. At our last meeting one of our directors showed up having been reading George Berkeley's essays on money, where he keeps asking whether money is really just a ticket or a counter — a claim on other people's labour and goods rather than a thing that has to be gold or government paper — and argued that if that's right, we could issue our own local notes redeemable for goods at participating shops and get people working agian. Our treasurer thinks that's a fantasy and that anything we print will just be Monopoly money that wrecks what's left of our reputation. The board votes next week and I have to circulate a short written opinion before then. Draft it for me: a clear recommendation (go, don't go, or go with conditions and a timeline), the reasoning, and an honest engagement with the treasurer's objection instead of just waving it away. Keep it short enough that I can read it aloud in ten minutes.
