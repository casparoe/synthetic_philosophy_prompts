prompt: |-
  Ok so quick context before I ask you anything: I'm a science journalist, I mostly write features on evolution and behaviour, and I'm about four thousand words into a piece on the handicap principle that has basically eaten my month. I keep bouncing between 'this is one of the deepest ideas in evolutionary biology' and 'this is an unfalsifiable restatement of the fact that honest signals have to be hard to fake.' I need help getting unstuck.

  Put on your evolutionary-biology hat — someone who's actually worked with signalling models but also reads a bit of philosophy of science and isn't allergic to saying 'this framework might be empty.'

  Before you give me any numbers, please think carefully and spend a few hundred words just laying out the terrain: what are the seperate sub-claims bundled together when someone says 'the handicap principle explains honest signalling'? I'm pretty sure I'm conflating at least three or four of them and I want them prised apart. Include the boring definitional ones — what is 'cost' even supposed to mean here: energetic cost, strategic cost, or specifically a marginal cost that falls harder on low-quality signallers? — and flag which sub-claims are empirically testable and which are conceptual, and whether any of them are true by construction.

  Then I want a single number: your credence that the handicap principle is, in the end, a special case of a broader account of signal reliability in which differential cost is neither necessary nor sufficient for honesty — i.e. that indexes, amplifiers, and other non-cost mechanisms do most of the real explanatory work, and 'costly' signals are one case among several rather than the engine. Give me the number, then the decomposition: a rough probability for each sub-question you identified, one line of justification each, and show me how they combine into the final figure. Then tell me which term the number is most sensitive to, and what single result — an experiment, a model, a reanalysis of existing data — would move it most. Also say what would count as the question being resolved the other way, if anything would.

  Couple of things I'd like you to fold in as explicit sub-questions rather than lumping them: (a) whether the marginal-cost condition that the game-theoretic work relies on is a real feature of organisms or an artefact of additive cost-benefit bookkeeping, given that fitness is arguably multiplicative; (b) whether the index-versus-handicap distinction is a real division in nature or just a modelling convenience; (c) whether the human-behaviour extensions (religious ritual as costly signalling, that whole literature) count as independent evidence or are just the same analogy recycled; and (d) whether the empirical record is even rich enough to decide any of this, or whether we're arguing about which of several underdetermined stories we prefer.

  One more thing: I pitched this over coffee to a philosopher of biology and we turned out to be miles apart — I'm at like 0.8 that it collapses into something broader, she's at like 0.3, and she thinks I'm underrating how much the formal models actually constrain things once you take the marginal-cost condition seriously. Give me your own number, and then tell me honestly where you think our disagreement really lives — is it about the biology, or about what counts as a real explanation in the first place? Don't just give me the textbook version of the debate; I've read that. I want your actual view with the weak points marked.
