  ### Thinking on Paper: Logical Space and Orthogonal Questions

  To construct a decision tree that survives contact with actual cases, we must avoid starting with labels like "realism" or "instrumentalism." Instead, we must identify the independent commitments that generate those labels. The question "Is the brain a computer?" conflates at least three orthogonal dimensions:

  1.  **The Ontological Dimension (Existence):** Is computation a property that physical systems possess independently of observers (like mass), or is it a property assigned by observers (like being a "weapon")?
      *   *Coherence Check:* If it is observer-independent, it must be grounded in physical structure. If it is observer-dependent, it risks being arbitrary unless constrained by norms.
  2.  **The Individuation Dimension (Source):** What fixes *which* computation is being implemented? Is it the internal causal mechanism (wiring), the external interpretation (mapping), or is it so broad that almost anything counts (triviality)?
      *   *Coherence Check:* "Mechanism" and "Mapping" are usually treated as competitors. "Triviality" (pancomputationalism) undermines both by making the distinction vacuous.
  3.  **The Explanatory Dimension (Role):** Does citing the computation explain *why* the system behaves as it does, or does it merely describe the behavior in a convenient notation?
      *   *Coherence Check:* One can hold that the brain literally computes (Ontology) but that this fact explains nothing (Explanation). Conversely, one can hold that the computational model is useful (Explanation) without being literally true (Ontology).

  **Mapping the Required Leaves to this Space:**
  *   *Brain computes & explains:* Ontology=Yes, Explanation=Yes.
  *   *Brain computes & explains nothing:* Ontology=Yes, Explanation=No.
  *   *Brain doesn't compute but modeled:* Ontology=No, Explanation=Yes (Instrumental).
  *   *Implementation is cheap:* Ontology=Yes (Trivial), Explanation=No (usually).
  *   *Fixed by mechanism:* Individuation=Mechanism.
  *   *Fixed by mapping:* Individuation=Mapping.
  *   *Verbal/No fact of matter:* Ontology=Indeterminate.

  **Independence Analysis:**
  "Fixed by mechanism" and "Brain computes & explains" are not logically mutually exclusive; indeed, they are often held together. To make them distinct leaves in a decision tree, the tree must force a choice about the *primary philosophical commitment*. Is the view primarily about *what computation is* (Individuation) or *what computation does* (Explanation)? I will structure the tree to separate these priorities on the "Mechanism" branch. Similarly, "Fixed by mapping" and "Verbal" are close; I will separate them by asking whether there is a *correct* mapping (Fact of Matter).

  **Case Diagnostics:**
  *   **Case 1 (Spreadsheet)** and **Case 5 (Calculator)** test the same intuition: dispositionality vs. occurrent process. Case 5 is redundant. I will flag Case 5 and propose a replacement (a rock formation) to better test pancomputationalism.
  *   **Case 2 (River/Thermostat)** tests Naturalness vs. Design (Ontology/Individuation).
  *   **Case 4 (Cortical Grain)** tests Individuation constraints (Mapping vs. Mechanism).
  *   **Case 6 (Typist)** tests Explanatory depth (Access vs. Subpersonal cause).
  *   **Case 3 (Classifier)** tests Opacity. I will use this sparingly as it overlaps with Case 6.

  **Tree Structure Plan:**
  I will design 12 branch nodes to ensure sufficient granularity (10-14 required). I will aim for 7 leaves (matching the 7 required views).

