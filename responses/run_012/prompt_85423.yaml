answer: |-
  You must sequence the construction of the imputation mechanism before introducing the murderer case, because if the stakes enter before the structure, your group's expected-value heuristics will overwrite the normative architecture you are trying to build.

  ### The Plan and Dependency Structure

  **Phase 1: The Carrying Case (Minutes 0–15)**
  *   **Component:** The Solvency Assertion.
  *   **Construction:** Write two sentences on the whiteboard: (1) "I tell you the bank is solvent because I have verified the ledger." (2) "I tell you the bank is solvent because I know a run will bankrupt it."
  *   **Dependency:** This must happen before any mention of Kant, Constant, or murderers.
  *   **Reasoning:** This isolates the normative difference between a statement grounded in verification (entitlement to rely) and a statement grounded in outcome management (benevolent manipulation). It fits your room's profile (engineers/lawyers understand liability; doctors understand trust) without triggering death reflexes.
  *   **What it must have:** A clear distinction between *authority to speak* (verification) and *motive for speaking* (consequence prevention). A clear third party entitled to rely (depositors).
  *   **What it must lack:** Any explicit penalty for the listener (no death, no loss of money in the prompt itself), and any conventional signal that truth is forfeited (unlike poker or politics).
  *   **Why obvious candidates fail:**
      *   *Poker/Bluffing:* Fails because the listener explicitly forfeits the claim to truth by entering the game.
      *   *White Lie (Appearance):* Fails because the listener's entitlement is socially understood as low, allowing the group to dismiss the duty as trivial.
      *   *Marketing puffery:* Fails because it is legally codified as non-reliable, letting the group treat it as a category error rather than a moral one.
      *   *The Murderer:* Fails because the stakes (death) trigger trolley-problem utilitarianism immediately, bypassing the structural question of assertion.

  **Phase 2: The Minimum Groundwork Input (Minutes 15–25)**
  *   **Component:** The Juridical Distinction.
  *   **Decision:** It is a mistake to keep the Groundwork machinery *entirely* out, but you must restrict it to one concept: the distinction between a *violation of virtue* (inner morality) and a *violation of right* (outer normative structure).
  *   **Sequence:** This enters *after* the Carrying Case analysis but *before* the Imputation argument.
  *   **Reasoning:** Your group will treat "do not lie" as a moral preference unless you establish it as a structural condition of communication. You do not need the Categorical Imperative derivation; you only need the premise that assertion creates a contractual relation of reliance.
  *   **Integration:** Use the whiteboard to map the Carrying Case not as "good vs. bad" but as "valid vs. invalid issuance." The lie in sentence (2) is not just untrue; it is an unauthorized use of the institution of truth-telling.

  **Phase 3: The Imputation Mechanism (Minutes 25–40)**
  *   **Component:** Causal Chains vs. Normative Chains.
  *   **Sequence:** This depends on Phase 2. You cannot explain imputation without establishing the "Right to Truth."
  *   **Reasoning:** This tests your hypothesis. Draw two lines on the whiteboard. Line A (Truth): Speaker -> Truth -> Listener -> Listener's Action -> Outcome. Line B (Lie): Speaker -> Lie -> Listener -> Listener's Action -> Outcome.
  *   **The Move:** In Line A, the Speaker is responsible for the Statement; the Listener is responsible for the Action. In Line B, by falsifying the premise of the Listener's action, the Speaker inserts themselves into the causal chain of the Outcome.
  *   **Verification:** If the group grasps this, they will stop asking "Is lying bad?" and start asking "Who owns the outcome?"

  **Phase 4: The Murderer Case as Stress Test (Minutes 40–50)**
  *   **Component:** Applying the Apparatus.
  *   **Sequence:** This must be last.
  *   **Reasoning:** Now the group has the tools to analyze the Murderer case without resorting to EV calculations. They should see that Kant's objection is not that the friend dies, but that the liar has made themselves the author of the future events they cannot control.
  *   **Constraint:** Do not allow the group to solve it by "evasion" (Phase 5 head-off) until after they have analyzed the lie itself.

  **Phase 5: Head-Offs and Misconception Map (Integrated throughout)**
  1.  **The Absolutist-Crank Picture:** Head off in **Phase 1**. When introducing the Solvency Case, explicitly state: "We are not asking if Kant is nice; we are asking if the structure holds." This prevents the "Kant would hand the friend over" dismissal before the argument begins.
  2.  **Consequentialism vs. Deontology:** Head off in **Phase 2**. When introducing the Juridical Distinction, clarify that Constant's error was treating truth as a commodity to be weighed, whereas Kant treats it as a condition of the market itself. This prevents the lazy "rules vs. outcomes" frame.
  3.  **Wrong Done to the Deceivee:** Head off in **Phase 3**. During the Imputation Mechanism, emphasize that the wrong is not to the murderer (who has no right to truth) but to the *system of assertion* and the *speaker's own agency*. This is where the group will stall; use the whiteboard to show the speaker damaging their own standing as a causal agent.
  4.  **The Escape Hatch (Evasion):** Head off in **Phase 4**. Before discussing the Murderer case, stipulate: "Assume silence is impossible or interpreted as confirmation." This prevents the group from dissolving the problem by saying "I would just refuse to answer," which turns the session into a semantic debate about what counts as a declaration.
  5.  **The Universalization Hack:** Head off in **Phase 5** (End). When the group suggests "Universalize: Lie to murderers," counter with: "If that maxim were universal, the murderer would know you are using it, rendering the lie ineffective." This forces them to see that the lie depends on the general rule it violates.

  ### What to Leave Out and How to Say It
  *   **Leave Out:** The derivation of the Categorical Imperative, the wider Doctrine of Duties (virtue vs. right details), Kant's biography/personal admirability, and the state of secondary literature.
  *   **How to Say It:** "We are treating this text as a structural engineering problem, not a historical survey. We are ignoring the foundation of the building to test the load-bearing wall. If you want the foundation, read the *Groundwork*; today we are inspecting the crack in the plaster."
  *   **Why:** Your group is trained to optimize systems. Giving them the history invites status debates; giving them the derivation invites logic-gaming. Keeping it to the text forces them to engage with the argument actually present.

  ### The Ending
  *   **The Question:** "When you lie to the murderer to control the outcome, what warranty have you implicitly issued on the future?"
  *   **Why this distinguishes understanding:** A group that memorized the punchline will answer "You shouldn't lie." A group that understood the shape will answer "You have claimed authority over events you cannot control."
  *   **The Landing:** Do not aim for "Kant is wrong but interesting." Aim for: "Kant is likely wrong about the rigidity, but he is right about the liability." Leave them holding the sharper question: "Are you willing to accept full causal responsibility for every consequence of your lie, including the ones you didn't intend?" This lands the session not on a rule, but on the cost of agency.
