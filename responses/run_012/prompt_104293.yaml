  Here is a draft structure and analysis for your chapter. It treats the *Mauerschützen* cases not as a puzzle to be solved, but as a stress test for the Hart–Fuller framework, highlighting where the theory converges, where it fractures, and where it simply runs out of road.

  ***

  # Chapter Draft: The Wall, The Guard, and The Concept of Law
  ## Beyond Nuremberg: The *Mauerschützen* Trials as a Hart–Fuller Stress Test

  ### I. The Settled Ground: Facts, Holdings, and the Retroactivity Objection
  *Before engaging the theory, we must clear the factual debris. There is significant consensus on the procedural history and the core legal criticism, even if the theoretical implications remain contested.*

  **The Facts and Holdings:**
  Following German reunification in 1990, the Federal Republic prosecuted former GDR border guards and their political superiors for homicide regarding shootings at the Berlin Wall (1961–1989). The Federal Court of Justice (*Bundesgerichtshof*, BGH) upheld convictions in a series of landmark decisions (most notably 1992–1994). The Federal Constitutional Court (*Bundesverfassungsgericht*) and the European Court of Human Rights (ECtHR in *K.-H. W. v. Germany*, 2001) subsequently refused to overturn them.

  **The BGH's Two-Step Reasoning:**
  1.  **The Interpretive Move (*Auslegungslösung*):** The BGH argued that the shootings were criminal *under GDR law at the time*. They reasoned that the GDR Constitution guaranteed the inviolability of human dignity and the right to life. By interpreting the Border Statute (*Grenzgesetz*) in light of the Constitution, the Court found that the use of deadly force against unarmed fugitives was disproportionate and therefore unauthorized even by the socialist legal order.
  2.  **The Radbruch Fallback:** Alternatively, the Court invoked Gustav Radbruch's formula: where positive law conflicts with justice to an "intolerable level," the law loses its legal character (*gesetzliches Unrecht*). The deliberate killing of unarmed refugees constituted such a violation.

  **The Standard Objection:**
  The dominant critique in German legal literature (and by defense counsel) was that this was retroactive punishment (*ex post facto*) disguised as interpretation. The GDR Border Statute explicitly authorized the use of firearms to prevent border breaches. The GDR Constitution was largely decorative and ignored by the Party in practice. To claim the acts were illegal *then* required a fiction. As H.L.A. Hart himself suggested regarding similar post-war cases: if you must punish, do so with a candid retroactive statute, rather than distorting the concept of law to hide the moral choice.

  ### II. The Hartian Reading: Vindication of the Separation Thesis?
  *Does the BGH's reasoning prove Hart right: that law and morality are separate, and that achieving justice required distorting the law?*

  **The Argument for Hart:**
  A strict positivist reading suggests the BGH's first step was intellectually dishonest. If the Separation Thesis holds, the GDR Border Statute was valid law within the GDR system because it was issued by a sovereign power and obeyed by officials. Its immorality did not negate its validity.
  *   **The Necessity of Fiction:** By claiming the acts were illegal under GDR law, the BGH avoided admitting it was applying FRG moral standards retroactively. Hart would argue this confirms his warning in the *Harvard Law Review* debate: when judges conflate "what the law is" with "what the law ought to be," they obscure the moral sacrifice being made (in this case, the principle of *nullum crimen sine lege*).
  *   **The Positivist Defense of the BGH:** However, sophisticated positivists (like Matthias Jestaedt) argue the BGH actually acted *within* positivism. They treated the GDR Constitution as part of the GDR's Rule of Recognition. If the Constitution prohibited disproportionate force, and the Statute conflicted with it, the Statute was ultra vires *by GDR standards*. This requires no natural law, only a hierarchical analysis of norms. If this holds, Hart is vindicated not by the Radbruch formula, but by the interpretive move: you don't need "higher law" to condemn the guards; you just need to read the tyrant's own rulebook accurately.

  **Where Hart Stumbles:**
  Hart's model assumes a continuous legal system. The *Mauerschützen* trials involve a *successor* state judging the officials of a defunct state. The FRG effectively redefined the validity conditions of GDR law during the Unification Treaty. Hart's Separation Thesis explains how to identify law within a system, but it offers little guidance on how a *new* sovereign should treat the laws of the *old* sovereign. Is the FRG applying GDR law, or is it applying FRG law to past GDR facts? If the latter, the Separation Thesis is irrelevant; it's simply a new sovereign exercising power.

  ### III. The Fullerian Reading: Inner Morality or Substantive Justice?
  *Does the case vindicate Fuller's claim that law has an internal morality that, when violated, strips commands of their legal status?*

  **The Argument for Fuller:**
  Fuller argued that law is a purposive enterprise subject to an "inner morality" (generality, publicity, congruence between declared rule and official action).
  *   **Congruence Failure:** The GDR Constitution promised human rights; the Border Statute authorized killing. The Party ignored the Constitution. For Fuller, this lack of congruence between the declared constitutional norms and the operational reality undermines the "fidelity to law." The guards were not following "law" in the Fullerian sense; they were following orders in a system that had lost the character of law.
  *   **Radbruch as Fullerian:** While Radbruch is often categorized as a natural lawyer, his formula functions similarly to Fuller's threshold. By declaring that extreme injustice is "no law," the BGH adopted the view that legality has a moral floor. The convictions stand because the commands lacked the essential quality of law from the start.

  **Where Fuller Stumbles:**
  Fuller's "inner morality" is primarily *procedural*. He worried about retroactivity, secrecy, and contradiction. The GDR Border Statute was clear, public, and consistently applied. The evil was *substantive* (killing people), not procedural.
  *   **The Stretch:** To use Fuller to condemn the Wall guards requires stretching "inner morality" to include substantive human rights. If Fuller's theory cannot condemn a procedurally perfect system of genocide without smuggling in external moral values, does it offer anything distinct from Hart?
  *   **The Coherence Problem:** Critics (e.g., Ralf Dreier) argue the BGH's reasoning was internally incoherent. They used a Fullerian/Radbruchian substantive threshold but dressed it in a positivist interpretive gown. If the GDR law was "no law" (Radbruch), why spend pages interpreting it (Positivism)? If it was valid law to be interpreted, why invoke Radbruch? This theoretical muddying suggests the Fullerian move was rhetorical cover, not operational logic.

  ### IV. Where the Theory Runs Out: Successor States and Judicial Candor
  *The Hart–Fuller debate was framed around a continuous jurisdiction (post-war Germany or hypothetical UK statutes). The Mauerschützen cases reveal the limits of both theories in transitional justice.*

  **1. The Successor State Problem:**
  The Separation Thesis tells us how to identify valid law within a functioning system. It does not tell a successor state how to handle the *validity* of a predecessor's law.
  *   **Hart's Silence:** Hart admits a new sovereign can change the Rule of Recognition. The FRG effectively declared: "For the purposes of criminal liability, GDR law is deemed to include its Constitution and international human rights obligations." This is a political decision, not a legal deduction. Hart's theory describes the result (a new Rule of Recognition) but cannot evaluate its justice.
  *   **Fuller's Silence:** Fuller's fidelity to law assumes a citizen's obligation to a standing system. It offers little guidance on whether a *new* system owes fidelity to the *old* system's rules.

  **2. Justice vs. Legality:**
  Both theorists care about the relationship between law and morality, but the *Mauerschützen* cases highlight a third variable: **Political Legitimacy.**
  *   The convictions were arguably necessary for the moral legitimacy of the reunified German state. To let the guards go would imply the GDR was a legitimate legal order whose boundaries were inviolable.
  *   Neither Hart nor Fuller fully accounts for this. Hart would say: "Pass a retroactive law and admit the cost to legality." Fuller would say: "Find that it wasn't law." The BGH did a mix of both. The theoretical question—*was it law?*—was subordinate to the political question—*can we build a united state on the premise that these killings were permissible?*
  *   **The Verdict on Justice:** Did the guards suffer injustice? A Hartian must say yes (retroactive punishment). A Fullerian might say no (they violated the inner morality of law). But this ignores the guards' epistemic position: they were trained in a system where the Constitution was fiction and the Order was reality. Neither theory adequately addresses the *culpability* of the low-level actor in a totalitarian system, focusing instead on the *status* of the norm.

  ### V. The Overdetermination Problem: Is the "Concept of Law" Doing Any Work?
  *This is the critical pivot for your chapter. If the outcome is the same regardless of the theoretical path, is the debate metaphysical window dressing?*

  **The Buffet of Justifications:**
  The BGH had three tools:
  1.  **Positivist Interpretation:** GDR law forbade this (Constitution > Statute).
  2.  **Natural Law/Radbruch:** It was so evil it wasn't law.
  3.  **Hartian Retroactivity:** It was law, but we punish anyway (the Unification Treaty allowed for this exception).

  Because the outcome (conviction) was overdetermined, the choice of reasoning appears strategic rather than doctrinal.
  *   **Why not pure Hart?** Admitting retroactivity undermines the Rule of Law, a core value the FRG wanted to export to the East.
  *   **Why not pure Radbruch?** Declaring all GDR border law "non-law" creates legal chaos for property and contract cases from the GDR era that the FRG wanted to uphold.
  *   **The Synthesis:** The BGH used the Positivist Interpretation for stability (most GDR law remains valid) and Radbruch for the extreme cases (killings).

  **Does the Debate Matter?**
  If Hart and Fuller both lead to the conviction (Hart via candid retroactivity, Fuller via invalidity), is the disagreement about the *concept* of law irrelevant?
  *   **No, because of Candor:** Hart's core complaint was never about the *result*, but about the *cost*. He argued that masking moral choices as legal discoveries corrupts legal reasoning. The BGH's tortured interpretation of the GDR Constitution (which everyone knew was ignored) supports Hart's fear: when we refuse to separate law and morals, we lie about what the law is.
  *   **Fuller's Counter:** Fuller would argue that the BGH's reasoning *restored* the moral purpose of law. By refusing to recognize the Wall orders as "law," they reaffirmed the connection between legality and human dignity.
  *   **The Real Disagreement:** The *Mauerschützen* cases suggest the Hart–Fuller debate is not about prediction (what will the court do?) but about **justificatory burden**.
      *   Hart demands the judge say: "I am sacrificing legality for justice."
      *   Fuller demands the judge say: "I am upholding the true nature of law against a perversion."
      *   The BGH tried to say both. The scholarly fight continues over whether this was a pragmatic synthesis or a theoretical failure.

  ### VI. Unsettled Disputes: Where the Literature Still Fights
  *Do not present the following as resolved. These are the live wires in current jurisprudence.*

  1.  **Did Radbruch Actually Do Any Work?**
      *   *View A:* Radbruch was the heavy lifter. The interpretive move was a sham because the GDR Constitution was not justiciable. Only a natural law override could justify the conviction. (Proponents: Robert Alexy).
      *   *View B:* Radbruch was window dressing. The BGH primarily relied on the hierarchy of GDR norms. The Radbruch formula was cited to satisfy public moral intuition, not to drive the legal logic. (Proponents: Stanley Paulson).

  2.  **The "Soft Positivist" Middle Ground:**
      *   Some argue this isn't Natural Law vs. Positivism, but **Inclusive Positivism**. If the GDR's Rule of Recognition included "conformity with human rights" (via the Constitution or international treaties they signed), then morality was *incorporated* into the law by social fact. The BGH wasn't reaching outside the law; they were applying the GDR's own incorporation clause. This sidesteps Hart–Fuller entirely, but critics argue it's ahistorical to pretend the GDR intended its Constitution to be binding on the Politburo.

  3.  **The ECtHR's "Foreseeability" Standard:**
      *   The Strasbourg Court didn't use Radbruch. It used Article 7 ECHR (no punishment without law) but ruled that the crime was "foreseeable" based on international human rights law accessible to the guards at the time. This is a third path: not "it wasn't law" (Fuller), not "it was law but we punish anyway" (Hart), but "you should have known better regardless of the statute." This shifts the debate from the *nature of law* to the *epistemic duties of the citizen*.

  ### VII. Conclusion: The Debate as Judicial Rhetoric
  The *Mauerschützen* prosecutions suggest that the Hart–Fuller debate is less about the ontology of law and more about the **ethics of judicial speech**.
  *   Hart warns us that calling evil "law" makes it harder to resist, but calling good "law" when it isn't makes the concept useless.
  *   Fuller warns us that treating law as a mere command separates it from the fidelity that makes it binding.
  *   In the Wall cases, the German courts tried to have it both ways. They wanted the moral clarity of Fuller (these were crimes) with the systemic stability of Hart (the rest of the GDR legal order remains valid).
  *   **Final Takeaway:** The case does not vindicate one side. It vindicates the necessity of the debate. Without Hart, we lose the warning about retroactivity. Without Fuller, we lose the language to say some commands are too evil to obey. The *Mauerschützen* trials show that in the hardest cases, we need both: the positivist's clarity about what the system *did*, and the natural lawyer's courage to say what the system *should have been*. The tragedy is that the BGH's reasoning obscured both.

  ***

  ### Notes for the Author on Tone and Usage
  *   **Avoid Consensus:** Notice in Section VI, I explicitly frame the "Did Radbruch do work?" question as a live fight between Alexy and Paulson. Do not smooth this over.
  *   **The "Successor State" Nuance:** Ensure you emphasize that Hart/Fuller 1958 was debating a continuous system. The GDR/FRG dynamic is a *transition*. This is where you can claim original contribution: applying the debate to a change of sovereignty rather than a change of government.
  *   **Candor vs. Outcome:** Keep returning to Hart's specific complaint about *candor*. The BGH's "interpretive solution" is the perfect exhibit for Hart's fear that merging law and morals leads to judicial dishonesty.
  *   **Skip the Informer:** As requested, no mention of the Grudge Informer. The Wall Guard is a stronger case because the "law" was explicit, not hidden (unlike the informer who used secret statutes). This makes the positivist defense of the GDR law stronger, and the natural law override more dramatic.
