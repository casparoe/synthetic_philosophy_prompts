answer: |-
  **Chapter Prospectus: The Diffusion of Dirty Hands**

  **Research Question**
  The canonical literature on the problem of dirty hands treats the dilemma as a singular event: a solitary officeholder faces a grave, imminent threat and must commit a moral wrong to avert it. This chapter asks: **Under what conditions does moral residue attach to individual agents when political wrongs are produced diffusely through a chain of individually defensible actions?** Specifically, I seek to determine whether the "stain" characteristic of dirty hands requires a unified moment of choice, or whether it can survive the fragmentation of agency typical of modern bureaucracy. The answer will be determinate: I will argue that individual moral residue attaches only where an agent possesses *effective veto power* over the harmful outcome, and that in cases of pure diffusion, the wrongness of the act survives at the institutional level while the taint of the agent dissolves.

  **The Gap in Standard Positions**
  Current theoretical frameworks leave the diffuse case unresolved because they presuppose a unified agent. The **lesser-evil justification** assumes a clear trade-off visible to the decision-maker. In a diffuse chain, no single participant sees the trade-off; they see only a procedural step. Consequently, the justification cannot be claimed by the individual, nor can it be clearly rejected.

  The **genuine wrong/justified agent** view (that the act remains wrong even if necessary) relies on the agent having committed the wrong. But in the diffuse case, has the individual committed a wrong, or merely a neutral act that becomes wrong only in aggregation? If the latter, the premise that the *agent* has dirty hands is undermined.

  Finally, the **remorse versus guilt** distinction assumes the agent feels the weight of the decision. Standard accounts argue that the dirty-handed agent must feel guilt (or at least agent-regret) to acknowledge the moral cost. In diffuse cases, agents often feel nothing, or merely professional regret. The literature treats this as moral failure (insensitivity), but it may instead be a rational response to a structure where guilt is inappropriate. These positions fail because they conflate the *wrongness of the outcome* with the *taint of the participant*. The diffuse case suggests these can come apart: an institution can do wrong without any specific individual bearing the stain.

  **Methodology and Analytical Strategy**
  To answer the research question, I will construct a typology of political action ranging from the canonical singular case to fully diffuse bureaucratic processes. I will not attempt to solve the general problem of collective responsibility, but rather isolate the specific mechanics of *dirty hands* (moral residue requiring expiation).

  My primary analytical tool will be the **counterfactual veto test**. For each link in a chain of action, I will ask: If this agent had refused to perform their step, would the harmful outcome have been averted?
  1.  **Complicating Diffusion:** If the answer is yes, the diffusion is merely epistemic or psychological. The agent had power but hid from it. Here, standard dirty hands theory applies; the residue attaches to the individual.
  2.  **Constitutive Diffusion:** If the answer is no (because the system would have routed around the refusal, or the harm was already determined by prior steps), the diffusion changes the moral character of the act. Here, the individual act is not a "dirty hand" choice but a cog in a machine.

  I will use this test to evaluate the **Separation Thesis**: that in constitutive diffusion, the *wrongness* resides in the institutional design or the collective output, while the *taint* (the demand for personal expiation) vanishes for the individual. I will test this by examining whether it makes sense to demand punishment, penance, or resignation from an individual in a constitutive diffusion case. If such demands appear category mistakes, the Separation Thesis holds.

  **Significance: Why a Chapter?**
  This cannot be an aside because it challenges the applicability of the dirty hands concept to liberal democracy. The canonical case describes the exception (the emergency dictator); the diffuse case describes the rule (the administrative state). If dirty hands theory cannot account for the routine moral damage of politics—where harm is outsourced and fragmented—it is relegated to a curiosity of extreme ethics rather than a tool for political theory. Furthermore, clarifying where individual guilt ends and institutional wrongness begins is a prerequisite for any theory of political accountability. If we assign individual guilt where only structural wrongness exists, we engage in scapegoating; if we deny guilt where veto power existed, we enable impunity.

  **Expected Results and Failure Conditions**
  A successful chapter will produce a modified framework for dirty hands that distinguishes between **agent-centered dirt** (where veto power existed) and **system-centered dirt** (where it did not). It will demonstrate that the literature's focus on the agent's psychological state (guilt/remorse) is secondary to the structural reality of their power.

  The project fails if:
  1.  I cannot clearly distinguish between "hiding from responsibility" and "lacking effective power." If the veto test proves too indeterminate in practice, the distinction collapses.
  2.  The Separation Thesis proves untenable. If it turns out that participating in a wrongful system *always* generates some residue regardless of veto power, then diffusion is merely a mitigating factor, not a qualitative shift. In this case, the chapter reduces to a standard analysis of degrees of complicity, which is already well-trodden ground.

  **Feasibility and Scope (Six Months)**
  In six months, I can complete the typology and defend the Separation Thesis. I will not, however, be able to fully solve the problem of *institutional expiation*. If the dirt moves from the agent to the institution, how does the institution wash its hands? That question requires a theory of corporate personhood and collective punishment beyond the scope of this chapter. I will stop at establishing that the residue *shifts*, not at prescribing the mechanism of institutional cleansing. Additionally, I will limit the case studies to hypothetical constructions and abstracted historical analogies rather than deep empirical case history, to ensure the argument remains theoretical. This allows for a rigorous conceptual clarification without getting bogged down in empirical disputes about specific historical events. The goal is to fix the conceptual machinery, not to judge specific regimes.
