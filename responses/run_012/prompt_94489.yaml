prompt: |-
  I'm a novelist at work on a short essay about character, and I've reached the point where I need a reader who knows the philosophy and the psychology better than I do. The essay argues that the situationist critique of virtue ethics — the body of work, running from the personality psychologist Walter Mischel through the philosophers who have drawn the strongest conclusions from it, showing that conduct is driven more by circumstance than by any stable trait — is usually received as bad news for the moral psychology that novels presuppose, and that it is in fact good news for the novel. My notes run roughly as follows, and I'd like your comments on them.

  1. The critique. Seminary students hurrying to deliver a talk on the parable of the Good Samaritan step over a slumped man when they are made to feel late; people who have just found a coin in a payphone are likelier to help a stranger who drops her papers; ordinary men administer what they believe to be painful shocks when an authority urges them on. From findings like these the critics draw a strong conclusion: there are no robust global character traits, and virtue ethics, which needs them, rests on an empirical falsehood.

  2. The replies I'm aware of. That the experiments test cross-situational consistency, which virtue never promised; that practical wisdom, not habit, is the core of virtue; that the critique proves too much, since it dissolves the trait-psychology whose methods it borrows; that traits are real but situation-indexed and locally bound.

  3. My turn. The novel has never rendered character as a set of dispositions that fire regardless of circumstance. It renders character by placing a person in a situation and showing what she does, and by letting us see the situation from the inside — what it looks like to her, which is what an experimenter can only infer. The novel is, in effect, a machine for varying the situation while holding the person fixed, which is precisely the manipulation no experiment can perform on a real person.

  4. The claim I'm unsure of. If that is right, then in fiction a character's trait is not a property of the person at all but a summary of the reader's inference across a designed distribution of scenes — a property of the reader's expectations, licensed by the author's staging. I want to call this the reader's-trait view. My worry is that it is either trivially true (of course the author controls the scenes) or false in a way that costs me the essay.

  Could you comment on three things: whether I've stated the empirical and philosophical material accurately, and what I've garbled or oversimplified; whether the central move in 3 is genuinely interesting or a truism dressed up; and whether the reader's-trait idea in 4 earns its keep or should be cut. I would rather be told what to drop than what to add.
reasoning: |-
  Here's a thinking process that leads to the suggested feedback:

  1.  **Analyze the User and Request:**
      *   **User:** A novelist writing a short essay on character.
      *   **Topic:** The situationist critique of virtue ethics (Mischel, Doris, Harman, etc.) and its relationship to the novel.
      *   **Thesis:** Situationism is usually seen as bad for moral psychology/novels, but it's actually *good* for the novel.
      *   **Task:** Comment on three specific points:
          1.  Accuracy of empirical/philosophical material (Notes 1 & 2).
          2.  Interest level of the central move (Note 3).
          3.  Viability of the "reader's-trait view" (Note 4).
      *   **Constraint:** "I would rather be told what to drop than what to add." (Be critical, concise, prioritize subtraction/refinement over expansion).

  2.  **Evaluate Note 1: The Critique (Accuracy Check):**
      *   *Content:* Seminary students (Darley & Batson), Payphone coin (Isen & Levin), Milgram shocks. Conclusion: No robust global traits, virtue ethics rests on empirical falsehood.
      *   *Assessment:* Generally accurate. These are the canonical examples (Darley/Batson 1973, Isen/Levin 1972, Milgram 1963). The philosophical conclusion (Doris, Harman) is correctly summarized: they attack "globalism" (cross-situational consistency).
      *   *Nuance needed:* The claim that virtue ethics *needs* robust global traits is the specific target of situationists, but virtue ethicists dispute this definition of virtue. The summary is fair *as a summary of the situationist claim*, even if virtue ethicists disagree.
      *   *Verdict:* Accurate enough for a short essay. No major garbling.

  3.  **Evaluate Note 2: The Replies (Accuracy Check):**
      *   *Content:* Cross-situational consistency not promised; Practical wisdom (phronesis) > habit; Critique proves too much (dissolves trait psychology); Traits are local/situation-indexed.
      *   *Assessment:* These are the standard counter-arguments.
          *   "Virtue never promised consistency": Snow, Kamtekar.
          *   "Practical wisdom": Virtue isn't robotic habit; it's responsive.
          *   "Proves too much": If traits don't exist, psychology collapses too.
          *   "Local traits": Doris actually allows for "local" traits (e.g., honesty-in-the-office), just not "global" ones.
      *   *Verdict:* Accurate. Good summary of the dialectic.

  4.  **Evaluate Note 3: The Central Move (Interest vs. Truism):**
      *   *Content:* Novels don't show dispositions firing regardless of circumstance. They show person + situation. Novels show the "inside" of the situation. Novels vary situation while holding person fixed (impossible in real experiments).
      *   *Assessment:* This is the core insight.
          *   *Is it a truism?* "Novels show people in situations" is banal. "Novels show the *inside* of the situation" is better. "Novels vary situation while holding person fixed" is the strongest point. In real life (and experiments), you can't put the *same* person in multiple scenarios to test consistency without learning effects or time passing (which changes the person). In fiction, the "character" is a constant variable across the narrative arc.
          *   *Refinement:* The claim needs to avoid sounding like "Novels tell stories." It must emphasize the *counterfactual stability* of the fictional character. The novel *constructs* the environment to test the character, whereas situationism says the environment *determines* the behavior. The novel asserts that despite the environment, there is a "who" that persists.
          *   *Verdict:* Genuinely interesting, but risks sounding like a definition of plot. Needs to focus on the *epistemic advantage* of fiction over empirical psychology regarding character stability.

  5.  **Evaluate Note 4: The Reader's-Trait View (Viability):**
      *   *Content:* Trait is not a property of the person but a summary of reader inference across scenes. Property of reader's expectations, licensed by author.
      *   *Assessment:* This is the danger zone.
          *   *Risk 1 (Triviality):* Of course traits are inferences. All interpretation is inference.
          *   *Risk 2 (Undermining the thesis):* If traits are just reader expectations, then situationism wins. It means there *is* no character, just a pattern of behaviors curated by the author that the reader *projects* consistency onto. This aligns with Humean bundle theory or eliminativism, which might contradict the idea that the novel *saves* character.
          *   *Risk 3 (Complexity):* It shifts the essay from moral psychology to reception theory.
          *   *Constraint Check:* User wants to know what to drop. This feels like the candidate for dropping or significantly downgrading. It complicates the "Good News" thesis. If traits are just reader constructs, the novel isn't revealing character; it's tricking us into seeing consistency where there is none (which is exactly what situationists say happens in real life).
          *   *Verdict:* This weakens the argument. It concedes too much to the situationist/eliminativist view. The essay argues situationism is *good* for the novel because the novel *can* show stable character where experiments can't. Claiming traits are just reader inferences undermines the stability.

  6.  **Synthesize Feedback:**

      *   *Point 1 (Accuracy):* You are safe. The summaries are standard and defensible for a non-specialist essay. Don't get bogged down in the "global vs. local" nuance unless it serves the main point.
      *   *Point 2 (Central Move):* It is interesting, not a truism, *provided* you emphasize the "holding the person fixed" aspect. That is the metaphysical privilege of fiction. Experiments cannot re-run the same subject without contamination; novels do this by definition.
      *   *Point 3 (Reader's-Trait):* **Drop it.** Or severely modify it. It turns your argument into a tautology ("Authors write characters, readers read them") or a concession ("Character is an illusion"). It distracts from the stronger claim: The novel *validates* the existence of character against the situationist critique by providing the only arena where character can be empirically (narratively) demonstrated.

  7.  **Drafting the Response:**
      *   Tone: Professional, respectful of the writer's craft, direct (adhering to "tell me what to drop").
      *   Structure: Address the three specific questions in order.
      *   Key Advice:
          *   1 & 2 are fine.
          *   3 is the gold, polish the "holding fixed" metaphor.
          *   4 is the weak link, cut it to save the essay's momentum.

  8.  **Refining the "Drop" advice:**
      *   Why drop 4? Because if traits are just reader inferences, the situationist wins. The situationist says "You think you have character, but it's just a cognitive illusion based on fragmented behaviors." If the novelist says "Yes, character is just a reader inference based on fragmented scenes," they are agreeing with the situationist. The essay wants to say the novel *rescues* character. Therefore, character must be more than just inference; it must be something the form *reveals*.
      *   Alternative for 4: Instead of "reader's trait," focus on "narrative truth." The trait is real *within the narrative world* because the author guarantees the identity of the agent across situations.

  9.  **Final Review against constraints:**
      *   Did I answer the three specific questions? Yes.
      *   Did I prioritize dropping over adding? Yes.
      *   Is the tone appropriate? Yes.

      *(Self-Correction during drafting)*: I should be careful not to say Note 4 is *wrong* philosophically (it's a valid reception theory stance), but that it is *strategically wrong* for this specific essay's goal. It undermines the "Good News" thesis.

      *(Refining Note 3)*: Make sure to highlight that the "holding the person fixed" is a *counterfactual* power. We see what the character *would* do in situation B, C, and D, whereas in real life, we only see them in A. This defeats the situationist claim that we can't know traits because we can't isolate variables.

      *(Refining Note 1)*: Mention that "virtue ethics rests on an empirical falsehood" is the *situationist's* claim, not necessarily a fact. The user frames it as "the critics draw a strong conclusion," which is accurate. I will affirm this framing.

      *(Final Polish)*: Ensure the advice is actionable. "Cut section 4's ontological claim, keep the phenomenological one." Actually, simpler: "Cut the 'reader's-trait' definition. It concedes the point you're trying to win."

      Let's assemble the response.cw
answer: |-
  Here are my comments on your three points, adhering to your preference for subtraction over addition.

  ### 1. Accuracy of Empirical and Philosophical Material
  You have stated the material accurately enough for the purposes of a literary essay. You are not writing for *Ethics* or the *Journal of Personality*, so the simplifications are justified.

  *   **The Critique:** Your summary of the experiments (Darley & Batson, Isen & Levin, Milgram) is standard. The philosophical leap you attribute to the situationists (Doris, Harman)—that virtue ethics requires "global" traits and therefore fails—is the correct summary of their argument, even if virtue ethicists dispute the premise.
  *   **The Replies:** Your list of counter-arguments is also accurate. The distinction between "global" and "local" traits is the most important nuance here, and you have it.
  *   **What to watch:** Ensure you don't present the situationist conclusion ("there are no robust traits") as an established scientific fact, but rather as the *interpretation* of the data that you are contesting. You have mostly done this ("the critics draw a strong conclusion"), but keep that framing tight. You don't need to add more philosophy here; you have enough.

  ### 2. The Central Move (Note 3)
  This is not a truism; it is the strongest part of your argument, but it requires precise phrasing to avoid sounding like a definition of plot.

  *   **Why it works:** The claim that the novel is a "machine for varying the situation while holding the person fixed" is genuinely insightful. In empirical psychology, you cannot test the *same* subject across radically different moral dilemmas without time passing (which changes the subject) or learning effects (which contaminate the data). The novel has the metaphysical privilege of maintaining the identity of the agent across a designed distribution of circumstances.
  *   **The risk:** It becomes a truism if you simply say "novels show people doing things." You must emphasize the **counterfactual stability**. The novel allows us to see what *this specific person* does when the variable of "urgency" changes, or "authority" changes, in a way real-world observation cannot.
  *   **Advice:** Do not add to this. Instead, sharpen the verb. The novel doesn't just "render" character; it *isolates* it. This is your engine.

  ### 3. The Reader's-Trait View (Note 4)
  **Drop this.** Or, more precisely, drop the ontological claim that the trait is "a property of the reader's expectations."

  *   **Why it costs you the essay:** Your thesis is that situationism is *good news* for the novel because the novel can do something psychology cannot (reveal stable character). If you argue that character is merely a "summary of the reader's inference," you concede the situationist point. You are effectively saying: "Real people don't have stable traits, and fictional characters don't either; it's just a cognitive shortcut the reader takes." This aligns you with the eliminativists (Doris/Harman) rather than rescuing the concept of character.
  *   **The triviality trap:** You identified this worry yourself. It is trivially true that authors stage scenes and readers infer patterns. Making this the pivot of your argument reduces your essay to reception theory ("how we read") rather than moral psychology ("what character is").
  *   **The fix:** Instead of locating the trait in the *reader*, locate it in the **narrative design**. The trait is real *within the world of the novel* because the author guarantees the continuity of the agent. The "good news" is not that traits are illusions we enjoy, but that the novel is the only laboratory where the situationist critique can be definitively answered.

  **Summary:**
  Keep 1 and 2 as your setup. Make 3 your climax. Cut 4's definition of the trait as a readerly inference; it undermines the victory you are trying to claim. The novel doesn't simulate the reader's bias; it corrects the experimenter's blindness.
