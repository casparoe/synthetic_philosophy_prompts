answer: |-
  (Raise your glass, but don't drink yet. Stand up. Keep it relaxed, hands visible, maybe holding a napkin or the glass.)

  Good evening, everyone. For those who don't know me, I'm [Your Name]. I'm the English one. Which means I am genetically predisposed to avoid difficult conversations, preferably by making a cup of tea and waiting for the problem to go away.

  But tonight, we are not doing that. Tonight, we are celebrating [Friend's Name].

  [Friend], you asked me to speak, which is a brave thing to do. You've asked a novelist to talk about truth, in a room full of lawyers, theologians, and your mother. I know my place in the food chain here.

  We are here to mark a specific, uniquely German act. You have left the Church. Now, where I come from, leaving the church is a slow fade. You just stop going. Eventually, the vicar assumes you've moved to Leeds or died. The King is still the head of the Church, the bishops are still in Parliament, but your relationship with the whole thing is based on a polite, mutual silence. It is very English. It is also very vague.

  Here, things are clearer. And I mean *clear*. In Germany, the Church is a public corporation. The State collects the tax. To leave, you cannot just drift away. You must go to the Standesamt. You must pay a fee. You must sign a paper. You have to look a civil servant in the eye and say, "No more."

  I think that is incredibly honest. It treats faith not as a cultural background noise, but as a conscious commitment. And if you end that commitment, you do it with the same administrative weight with which you started it.

  Klaus, I know you teach this stuff, so I won't try to out-lawyer you on the constitutional status of religious societies. I'll leave the jurisprudence to you. And I certainly won't start comparing it to the French system, because nobody wants a lecture on *laïcité* over the pudding.

  But I do want to say something about what this means for the people in this room.

  I know that for some here, the Church is a community you celebrate leaving. For others, it is a burden you are glad to put down. But I also know that for some people at this table—people I love and respect deeply—the Church is not a tax bracket. It is not a bureaucracy. It is a home. It is a source of comfort, of tradition, of strength that has held this family together through generations.

  [Friend's Name] leaving the Church does not change that. It does not erase the Sunday masses, the Christmas traditions, or the prayers said for this family's safety. A signature at the Standesamt can end a membership, but it cannot end a history. And it certainly cannot end the love between a daughter, a mother, and an aunt.

  What tonight celebrates, I think, is not a rejection of faith, but a commitment to conscience. It is the courage to say, "This is where I stand right now." That requires integrity. And integrity is something that believers and non-believers can respect in equal measure.

  [Friend], you have lived in this country for a long time. You have navigated the language, the rules, and the complexities of making a life here. But this step… this is different. This is you defining the terms of your own soul, using the tools this country gives you.

  So, I would like to propose a toast.

  To the German talent for paperwork, which makes things official.
  To the English talent for ambiguity, which keeps things peaceful.
  And to the human capacity for honesty, which keeps us friends.

  [Friend], may your conscience always be as clear as your tax records. May you always find community, whether it is institutional or improvised. And may you never have to explain yourself to a Standesamt clerk again.

  To [Friend].

  (Drink.)
