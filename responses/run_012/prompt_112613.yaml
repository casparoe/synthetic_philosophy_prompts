          *   *Kids (17 & 20):* Secular, see it as bureaucracy.
          *   *Ex-members:* Will cheer for anti-church sentiment.
      *   **Key Themes:**
          *   It's not just about money (Kirchensteuer) or belief.
          *   The unique German nature of the Church (Public Corporation, state tax collector).
          *   Comparison with England (Established Church, no tax, no formal exit) and France (Laïcité - *mention briefly/avoid lecturing*).
          *   The act is significant/stranger than it looks.
      *   **Tone:** Funny (at least twice, not at anyone's expense), warm, honest, sayable by a novelist (storyteller, not academic).
      *   **Hard Constraint:** Must not alienate the religious relatives (Mother/Aunt). They must feel respected, not mocked.
      *   **Length:** About 5 minutes spoken (approx. 600-750 words).

  2.  **Deconstruct the Tension:**

      *   *The Trap:* If I mock the church, I hurt the Mom/Aunt. If I defend the church, I undermine the Host's celebration. If I get legal details wrong, Klaus cringes. If I get too philosophical, it becomes a lecture.
      *   *The Solution:* Focus on *relationship* and *identity* rather than theology or bureaucracy. Frame the act as an act of honesty and integrity, which respects both the believer and the leaver. Acknowledge the German system's uniqueness without calling it absurd. Acknowledge the English system without calling it superior.

  3.  **Drafting - Section by Section:**

      *   **Opening:** Acknowledge the occasion, thank the host. Break the ice.
          *   *Idea:* Mention the fee. It's small but significant.
          *   *Humor:* The cost of freedom vs. the cost of a Schnitzel.
      *   **The German Context (The "What"):** Explain the uniqueness without dry legalism.
          *   *Concept:* It's a marriage between State and Church that requires a divorce lawyer (Standesamt).
          *   *Klaus Check:* Keep it accurate but simple. "Public corporation."
      *   **The English Comparison (The "Who am I"):** The speaker's background.
          *   *Concept:* In England, you can just fade away. Here, you have to declare it.
          *   *Nuance:* Neither is better, just different. One is a whisper, one is a signature.
      *   **The Mother/Aunt Constraint (The "Heart"):** This is crucial.
          *   *Concept:* Faith isn't just tax. It's community, history, comfort. Leaving doesn't erase the shared history.
          *   *Phrasing:* Respect the continuity. The bond remains even if the membership ends.
      *   **The Kids/Ex-members (The "Why"):**
          *   *Concept:* It's about authenticity.
      *   **Closing:** A toast to the friend.
          *   *Theme:* To honesty, to friendship, to the future.

  4.  **Drafting - Iteration 1 (Mental Outline):**
