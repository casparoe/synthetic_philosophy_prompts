  ### A Note on "Answerable" vs. "Responsible"
  Miriam insists on this distinction for a reason.
  *   **Responsible:** Causal. (Emil *caused* the decision).
  *   **Answerable:** Moral Standing. (Can we demand a justification from *him*?).

  If Miriam rules him **Not Answerable**, she isn't saying Emil didn't do it. She's saying that when we ask "Why did you do this?", the answer is "Because Saul made me this way." If the justification traces back to Saul, Emil cannot answer for it. He can only report it.

  If you want the reader to judge Emil, Miriam's ruling complicates that. If he isn't answerable, judging him is like judging a hurricane. If you want the tragedy to land on *Emil*, you need him to be Answerable. If you want the tragedy to land on *Saul* (even from the grave), you want him Not Answerable.

