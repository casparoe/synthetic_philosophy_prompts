  My credence that evidential cooperation in large worlds (ECL) provides a genuine, action-guiding reason in at least one real choice is **0.18**.

  Here is the breakdown of the necessary conditions required for that number to hold. I have treated these as independent probabilistic constraints; if any fail, the mechanism collapses.

  **1. Normative Validity (P = 0.70)**
  Functional or Evidential Decision Theory must be normatively superior to Causal Decision Theory in acausal trade scenarios.
  *Justification:* FDT solves Newcomb-like problems elegantly, but it lacks the universal consensus of CDT in standard economics.

  **2. Cosmological Scale (P = 0.60)**
  The physical universe must be spatially infinite or inflationarily large enough to guarantee non-negligible duplicates of your decision situation.
  *Justification:* Eternal inflation is a leading model, but finite universe topologies remain live options in cosmology.

  **3. Reference Class Definition (P = 0.50)**
  There must be a robust way to define "similar agents" such that logical correlation survives noise, cultural drift, and implementation details.
  *Justification:* The "reference class problem" is the weakest link; minor reasoning divergences break the correlation required for the math to work.

  **4. Reflective Stability (P = 0.85)**
  The reasoning must remain consistent when agents model each other modeling them, without triggering infinite regress or paradox.
  *Justification:* Formal models of logical induction show stability here, though edge cases in game-theoretic bargaining persist.

  ### The Arithmetic

  $$ P(\text{ECL}) \approx P(\text{Normative}) \times P(\text{Scale}) \times P(\text{Reference}) \times P(\text{Stability}) $$

  $$ 0.18 \approx 0.70 \times 0.60 \times 0.50 \times 0.85 $$

  $$ 0.18 \approx 0.21 \times 0.85 $$

  $$ 0.18 \approx 0.1785 $$

  ### Sensitivity and Vulnerability

  **Mathematical Sensitivity:** The final number is most sensitive to **Reflective Stability (0.85)**. In a multiplicative chain, the absolute impact of a unit change is highest on the term with the highest probability, because it is multiplied by the fewest dampening factors.

  **Epistemic Vulnerability:** The single sub-question that would move me the most is **Cosmological Scale (0.60)**. A definitive measurement of cosmic topology proving a finite universe drops my credence to zero instantly, whereas philosophical shifts on Decision Theory are usually gradual and interpretive.

  ### Summary
  You are right to smell a shell game; the Reference Class term (0.50) is where the magic usually hides. However, your reflex to dismiss acausal links because you "can't point an antenna at them" is a Causal Decision Theory axiom, not an empirical fact. If the universe is large and logic is physical, the antenna doesn't matter. I rate it slightly higher than your 0.15 only because the math holds together better than the intuition suggests, provided the physics cooperates.
