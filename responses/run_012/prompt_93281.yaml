answer: |-
  Here is the **Joint Intention Screening Protocol (JISP)**. It translates the collective intentionality literature into an economic evidentiary standard suitable for a two-page triage note. It is designed to separate *oligopolistic interdependence* (I do what is best for me given what you did) from *concerted practice* (We do what is best for us because we committed to it).

  ### The Procedure: Joint Intention Screening Protocol (JISP)

  Run these four questions in order. You stop at the first "No" in Q3 or Q4 and recommend **CLOSE**. You proceed to **ESCALATE** if Q3 or Q4 is "Yes."

  **Q1: Common Knowledge (The Visibility Test)**
  *   **Question:** Was the action taken by Firm A publicly visible to Firm B *before* Firm B committed to its own response, and did Firm A know this?
  *   **Sufficient Answer:** Yes (e.g., public price lists, trade press, open meetings).
  *   **Philosophical Root:** Searle's background conditions for collective intentionality.
  *   **If No:** **CLOSE.** (This is independent action or luck).

  **Q2: Strategic Contingency (The Meshing Subplans Test)**
  *   **Question:** Is there evidence that Firm A's action was *profitable only on the condition* that Firm B matched it, rather than profitable on standalone market merits?
  *   **Sufficient Answer:** Yes (e.g., internal docs showing "we only raise if they raise," or economic modeling showing the move loses money without parity).
  *   **Philosophical Root:** Bratman's "meshing subplans." In collusion, my plan only works if your plan complements it.
  *   **If No:** **CLOSE.** (This is parallelism driven by common cost shocks or demand).

  **Q3: Normative Expectation (The Commitment Test)**
  *   **Question:** Is there evidence that Firm A expected Firm B to comply *as a matter of obligation or understanding*, rather than mere self-interest? Look for language of "agreement," "understanding," "promise," or evidence of punishment mechanisms for deviation.
  *   **Sufficient Answer:** Yes (e.g., minutes implying a pact, threats of retaliation, "gentlemen's agreement" language).
  *   **Philosophical Root:** Gilbert's "joint commitment." Collusion requires a mutual obligation, not just aligned incentives.
  *   **If Yes:** **ESCALATE.**

  **Q4: Group Agency (The "We-Mode" Test)**
  *   **Question:** Do the firms' internal documents describe the market outcome as a joint responsibility ("we need to stabilize the market") rather than an individual opportunity ("we can capture margin")?
  *   **Sufficient Answer:** Yes (e.g., referring to "the industry" acting as a unit, or "managing capacity" collectively).
  *   **Philosophical Root:** List & Pettit's "group agent" / Tuomela's "we-mode."
  *   **If Yes:** **ESCALATE.**

  ***

  ### Application to Live Files

  **File 1: Ferry Operators (The Price Leadership Case)**
  *   **Q1 (Visibility):** **Yes.** A announced publicly; B and C saw it.
  *   **Q2 (Contingency):** **Yes.** B had been undercutting for two years. Switching to match A suggests the move was contingent on A's lead, not independent cost calculation.
  *   **Q3 (Normative):** **No.** A's director said "can't have a race to the bottom," which is a normative statement, but there is no evidence B or C felt *obligated* to follow. They likely followed because it was profitable to do so given A's move. No evidence of punishment for deviation.
  *   **Q4 (Group Agent):** **No.** No evidence they view themselves as a single unit managing the route.
  *   **Decision:** **CLOSE.**
  *   **Note:** This is conscious parallelism. A signaled, B and C reacted to the signal because it was in their individual interest. There is no "We."

  **File 2: Trade Association (The Standard Case)**
  *   **Q1 (Visibility):** **Yes.** They were in a working group together.
  *   **Q2 (Contingency):** **Yes.** The standard kills the cheap sachet. This is only profitable if *everyone* adopts it; otherwise, the adopter loses volume.
  *   **Q3 (Normative):** **Yes.** "Voluntary standard" adopted in a meeting where "everyone knew what it would do." The meeting itself creates the Gilbert-style joint commitment. The omission of price in minutes is a classic red flag for normative obligation without paper trail.
  *   **Q4 (Group Agent):** **Yes.** Working groups inherently frame participants as members of a collective solving a problem.
  *   **Decision:** **ESCALATE.**
  *   **Note:** The mechanism of formation (the meeting) substitutes for the explicit contract. The "We" was formed in the room.

  **File 3: Supermarkets (The Exit Case)**
  *   **Q1 (Visibility):** **Yes.** Conference attendance + market monitoring.
  *   **Q2 (Contingency):** **Yes.** The email explicitly states conditionality: "If they pull out we stay out."
  *   **Q3 (Normative):** **Yes.** "If they come back we're back in." This is a threat/promise structure. It implies an understanding that the status quo (exit) is maintained by mutual restraint. It establishes a rule of conduct between them.
  *   **Q4 (Group Agent):** **Borderline.** But Q3 is sufficient.
  *   **Decision:** **ESCALATE.**
  *   **Note:** The internal email is a smoking gun for strategic contingency linked to a specific competitor's action, not just market conditions.

  ***

  ### Where the Procedure Breaks

  You are correct: Bratman, Gilbert, and Searle are describing **cooperative** agents (people painting a house together, singing a duet). Your firms are **adversarial** agents (competitors trying to maximize profit).

  The procedure breaks at **Tacit Collusion without Communication.**
  In modern oligopoly theory, firms can sustain supra-competitive prices purely through repeated game strategies (tit-for-tat) without ever forming a "joint intention." They don't need a "We"; they just need to know that if I cheat, you will punish me.
  *   **The Philosophical Gap:** Gilbert's "joint commitment" requires a mutual recognition of obligation. In tacit collusion, there is no obligation, only fear of retaliation.
  *   **The Economic Gap:** The harm to the consumer is identical whether the firms shook hands (File 2) or just stared at each other across the market for five years (File 1 variant).
  *   **The Residue:** The procedure forces you to **CLOSE** cases where the economic outcome is anti-competitive but the "intentional glue" is missing. You will have files where prices are clearly coordinated, but the firms never signaled, never met, and never documented a contingency. The JISP will tell you "No Joint Intention," and you will have to close the file. That is the limit of the tool: it screens for *concertedness*, not *market power abuse*.

  ### The "Dirty" Close and the "Harmless" Escalate

  **The Dirty Close: File 1 (Ferries)**
  *   **Why:** Consumers are paying higher fares due to parallel conduct. It feels like collusion. But under JISP (and current law), there is no "joint commitment." B and C followed A because it was profitable, not because they owed A anything.
  *   **Philosophical Reason:** There is no "We." There is only "I see you, so I do this." Bratman's meshing subplans are aligned by market forces, not by intention.
  *   **Risk:** Board members will ask why you let a price hike slide. Your answer: "No evidence of concerted practice, only oligopolistic interdependence."

  **The Harmless Escalate: File 3 (Supermarkets)**
  *   **Why:** They are exiting a *low-margin* region. Economically, this might be efficient capacity rationalization. The consumer harm might be negligible.
  *   **Philosophical Reason:** The internal email ("If they... we...") satisfies Q3 (Normative/Conditional Expectation). It proves a *meeting of minds* regarding future conduct. Even if the market impact is small, the *intentional structure* is that of a cartel.
  *   **Risk:** You spend investigation resources on a small market. But legally, the *agreement* is the violation, not the damage amount. The procedure flags the *intent*, forcing you to escalate even if the *numbers* don't justify the hassle.

  ### Summary for your Board Note
  When you write the "No" on File 1, do not write "No economic harm." Write: **"Evidence indicates independent reaction to public signal. No evidence of mutual obligation or contingency planning beyond standard market monitoring."**

  When you write the "Yes" on File 3, do not write "High consumer harm." Write: **"Internal documentation confirms strategic contingency conditional on competitor action, indicating concerted practice rather than independent decision-making."**

  The philosophy gives you the vocabulary to distinguish *reaction* from *agreement*. That is all you need to survive the lawyers.
