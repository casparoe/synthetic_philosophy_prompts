answer: |-
  Here are ten questions designed to corner the position without resorting to textbook citations, along with the likely replies and the necessary follow-ups to keep the pressure on.

  **1. The 'Never Best Response' Equivalence**
  **Question:** In finite games, there's a rather tight mathematical result: a strategy is never a best response to *any* belief if and only if it is strictly dominated by some mixed strategy. If you refuse to eliminate strategies dominated by mixtures, you are effectively keeping strategies on the table that are never a best response to anything. What do you think you are preserving by refusing to eliminate those, and does that refusal cost you a notion of rationality you actually care about?
  *Likely Reply:* She will argue that 'rationality' shouldn't be defined against *any* arbitrary probability distribution. She'll say a player is only irrational if they play poorly against beliefs they could *reasonably* hold, not against every mathematically possible belief.
  *Follow-up:* But if we can't rule out a strategy that is worse than a weighted average of two other options, regardless of what the opponent does, aren't you saying a rational agent is permitted to leave money on the table even when they know the odds? Where is the line between 'reasonable belief' and 'sure loss'?

  **2. Order Independence and Robustness**
  **Question:** One of the main virtues people cite for strict dominance is that the order of elimination doesn't matter; you get the same result whether you go left-to-right or top-to-bottom. Weak dominance doesn't share that property. But that order-independence holds for mixed strict dominance just as well as pure. By restricting yourself to pure strategies only, are you keeping the virtue of order-independence, or have you accidentally lost the robustness that made strict dominance attractive in the first place?
  *Likely Reply:* She will likely claim that order-independence is a mathematical convenience, not a normative requirement. She'll argue that actual reasoning happens in steps, so the path matters more than the destination.
  *Follow-up:* If the path matters, then the solution depends on the sequence of thoughts a player has. Does that mean two identical rational agents could legitimately reach different conclusions simply because they thought about the strategies in a different order?

  **3. The Epistemic Story (Common Knowledge)**
  **Question:** The standard epistemic story says that Common Knowledge of Rationality delivers the whole iteration of strict dominance. On your view, does Common Knowledge of Rationality only deliver the first round of elimination? If so, what extra assumption is supposed to license the second and third rounds if we aren't allowed to use mixed strategies to bridge the gap?
  *Likely Reply:* She will probably argue that Common Knowledge of Rationality is too strong an assumption anyway. She'll suggest it only gets you the first round, and further rounds require knowing *what* the opponent believes, which isn't guaranteed by rationality alone.
  *Follow-up:* If further rounds require knowing what they believe, aren't we just assuming the conclusion? How do you distinguish between 'they are rational' and 'they are rational and think exactly like I do' without using the mixed strategy machinery to formalise that uncertainty?

  **4. Mixtures as Ignorance**
  **Question:** You've argued that a mixed strategy is just a way of encoding the other players' uncertainty about what you're going to do, not an actual choice you make. If that's the case, does that save the elimination procedure, or does it quietly replace it? If a mixture is just my ignorance, then saying a strategy is dominated by a mixture sounds like saying 'my ignorance proves you are irrational'.
  *Likely Reply:* She will lean into this. She'll say exactly that: dominance by a mixture is a statement about the observer's state of knowledge, not a constraint on the player's action space.
  *Follow-up:* But game theory is supposed to guide the player, not just the observer. If the procedure is relative to my ignorance, how can it be a normative rule for *you*? Why should you eliminate a strategy just because *I* am uncertain in a specific way?

  **5. The 3x3 Game (Concrete Challenge)**
  **Question:** Let's make this concrete. Imagine a 3x3 game. You have three strategies: Top, Middle, Bottom. I have three: Left, Centre, Right.
  If you play Top, you get 5 against Left, 0 against Centre, 5 against Right.
  If you play Bottom, you get 0 against Left, 5 against Centre, 0 against Right.
  If you play Middle, you get 2 against Left, 2 against Centre, 2 against Right.
  Middle is not dominated by Top or Bottom individually. But a fifty-fifty mix of Top and Bottom yields 2.5 against everything, which strictly beats Middle. On your view, is playing Middle rational?
  *Likely Reply:* She will likely say yes, it is rational, because nobody can actually play the fifty-fifty mix. You have to commit to Top or Bottom, and against either of those, Middle is sometimes better.
  *Follow-up:* But if I know you are rational, and I know you know I am rational, why would I ever think you are committing to Top or Bottom with certainty? If there is *any* chance you randomise, even as a result of my uncertainty about you, Middle becomes a sure loss. Why is that uncertainty not actionable?

  **6. Consistency with Expected Utility**
  **Question:** Standard Expected Utility theory assumes that if you prefer A to B, you should prefer a gamble on A to a gamble on B. That linearity is exactly what allows mixed strategies to dominate pure ones. If you reject dominance by mixed strategies, are you implicitly rejecting Expected Utility? And if so, what are you putting in its place?
  *Likely Reply:* She might argue she accepts Expected Utility for decision making under risk, but rejects its application to strategic uncertainty. She'll draw a line between 'risk' (known probabilities) and 'uncertainty' (unknown probabilities).
  *Follow-up:* That's a fair distinction, but in a Nash Equilibrium, strategic uncertainty is treated *as* risk. If you break that link, do you lose the ability to predict equilibrium behaviour entirely? Are we left with a theory that describes rationality but predicts nothing?

  **7. Learning and Dynamics**
  **Question:** If we look at learning models, like fictitious play or evolutionary dynamics, strategies that are dominated by mixtures tend to vanish over time. The system learns to avoid them even if no one calculates a mixed strategy explicitly. Does your theory contradict these dynamic models, or do you think those models are assuming something false about how people learn?
  *Likely Reply:* She will likely be sceptical of learning models, arguing they assume players respond to historical frequencies as if they were future probabilities, which isn't always rational.
  *Follow-up:* But if rational players don't learn to avoid strategies that consistently yield lower payoffs, what is the empirical content of your theory? Is it possible for a theory of rationality to be true even if no one ever behaves that way in practice?

  **8. Normative vs Descriptive**
  **Question:** Is your position meant to be normative or descriptive? Are you telling us how rational agents *ought* to reason, or how they *actually* reason? Because if it's normative, the 'never best response' argument bites hard. If it's descriptive, the learning models bite hard. Which side of the fence are you on?
  *Likely Reply:* She will probably claim it's conceptual. She's trying to clarify the *meaning* of rationality, not necessarily predict behaviour or prescribe actions in a vacuum.
  *Follow-up:* If it's purely conceptual, does it have any bite? If a concept of rationality allows a player to choose a strategy that guarantees a lower payoff than a weighted average of their other options, is it still doing any work for us?

  **9. Correlated Equilibrium and Mediators**
  **Question:** Consider a correlated equilibrium, where a mediator tells you what to play. The mediator effectively asks you to play a mixture. If you accept that a mediator can recommend a mixture, and you accept that following that recommendation is rational, why can't you simulate that mediator in your own head? What's the ontological difference between an external coin flip and an internal one?
  *Likely Reply:* She will argue that a mediator changes the game structure by adding a public signal. Without the mediator, the mixture isn't an available move, it's just a description of belief.
  *Follow-up:* But if the payoff consequences are identical, why does the source of the randomisation matter? If the math is the same, isn't the distinction between 'external' and 'internal' just a label for the same underlying uncertainty?

  **10. Changing Her Mind**
  **Question:** Finally, put aside the debate for a moment. What result, argument, or example would actually move you? Is there a specific scenario where you'd look at it and say, 'Alright, in this case, dominance by a mixed strategy really does rule out the pure strategy'? Or is this a foundational commitment you don't see yourself revising?
  *Likely Reply:* She might say she would need to see a derivation of rationality that doesn't rely on probabilistic beliefs but still eliminates the strategy. Or she might admit that if Expected Utility is granted as an axiom, she has to concede.
  *Follow-up:* If Expected Utility forces the concession, then isn't the disagreement really just about whether we model strategic uncertainty with probabilities at all? And if we don't, do we have anything left that looks like game theory?
