prompt: |-
  I do a small game-theory podcast with a couple of friends, and next week's guest has spent her career arguing that the only elimination procedure worth the name is iterated removal of strategies strictly dominated by *pure* strategies — she reckons "strictly dominated by a mixed strategy" is an artefact of how we write beliefs down, since nobody ever chooses a mixture, it's just a way of encoding the other players' uncertainty about what you're going to do. I need eight to ten questions that stop her from just restating that. Put yourself in the head of a foundations person who knows where the soft spots are: brainstorm her likeliest replies first, then write the questions, with a follow-up for each of the ones below keyed to the answer she'd actually give.

  - In finite games, a strategy that's never a best response is exactly a strategy that some mixture strictly dominates — so what does she think she's giving up by refusing to eliminate those, and does the refusal cost her something she cares about?
  - Why is iterating strict dominance order-independent while iterating weak dominance isn't, and is the order-independence a genuine virtue or just an accident of the definition?
  - The epistemic story: does common knowledge of rationality really deliver the whole iteration, or only the first round — and what is supposed to license the rest?
  - Her line looks close to the old idea that mixtures are really pure strategies plus everyone else's ignorance. Ask whether that saves the elimination procedure or quietly replaces it.

  One of the questions can be built around a small 3x3 game where a pure strategy survives pure-strategy elimination but dies to a mixture, if you think that lands better than talking in the abstract. Finish with something about what result or argument would actually move her. No citations or reading lists please — she's talking off the cuff and I dont want to sound like I'm reading off a syllabus. British English throughout.
