answer: |-
  This is a classic formulation of the **Special Composition Question** (SCQ). You are effectively looking for a principle of **ontological unity** that avoids both nihilism (nothing is a thing) and universalism (everything is a thing).

  Your intuition about "causal unity" is on the right track, but as you noted, "causal contact" (like hands pressing) is too weak. The missing ingredient in your hypothesis is **counterfactual resilience** or **internal constraint**.

  Here is a principle that captures nine of your ten verdicts cleanly, explains the borderline cases, and tells you exactly what to do with slime molds and forests.

  ### The Principle: Internal Dynamic or Structural Integrity

  > **A composite object exists if and only if the parts are constrained to maintain their relative configuration primarily by *internal* relations rather than *external* forces, such that the whole exhibits resilience to perturbation.**

  Let's break down the two key filters:
  1.  **Internal vs. External Constraint:** Do the parts hold *each other* in place (internal), or does the environment hold them in place (external)?
  2.  **Resilience:** If you nudge the system, does it return to its configuration (homeostasis/rigidity), or does it scatter/collapse?

  ### Applying the Principle to Your 10 Cases

  1.  **Heap of sand:** **No.** The grains are held in place by gravity (external) and friction. If you remove the ground beneath (external support), it scatters. It has no internal mechanism to restore its shape.
  2.  **Bicycle:** **Yes.** The parts are bolted/welded (internal structural constraints). If you lift the bike, it doesn't fall apart. It resists perturbation rigidly.
  3.  **Two hands pressed:** **No.** The constraint holding them together is your muscles/nervous system (external to the hands themselves). If you faint, the "object" ceases. They do not hold *each other*.
  4.  **Cells (You):** **Yes.** Homeostasis. Your cells chemically signal and bind to maintain the configuration against entropy. Internal constraint.
  5.  **Freshly dead body:** **Yes (with a caveat).** This is the strongest test. The metabolic internal constraint has stopped, but the *structural* internal constraint (skin, bones, connective tissue) remains intact due to inertia. It hasn't succumbed to external scattering *yet*. It counts as a thing by **structural residue**.
  6.  **Candle flame:** **Yes.** It is a dynamic equilibrium. The heat rises, drawing in oxygen, sustaining the heat. It maintains its shape via internal fluid dynamics and chemistry, not because something is holding the fire in place.
  7.  **Whirlpool:** **Yes.** Same as the flame. A stable dynamic pattern maintained by internal flow relations.
  8.  **Disassembled bike:** **No.** The internal constraints (bolts/welds) are disengaged. They are now held in a pile by gravity (external).
  9.  **Cloud:** **Yes (barely).** It is maintained by internal pressure and temperature gradients (convection). However, its boundaries are permeable and it lacks rigidity, which matches your "barely" intuition.
  10. **Everything in your room:** **No.** The collection is held together by the walls of the room (external constraint). Remove the walls, the "object" scatters.

  ### The Hard Cases: Slime Mold and Forest

  This principle gives clear, non-arbitrary answers to your new cases.

  **1. The Slime Mold (*Dictyostelium*)**
  *   **Verdict:** **It depends on the lifecycle stage.**
  *   **Reasoning:** When the cells are dispersed, they are a heap (external constraint only). When they aggregate into a "slug" to move toward light, they begin signaling chemically and moving in coordination. They develop **internal dynamic constraint**.
  *   **Conclusion:** Under this principle, the slime mold *becomes* a thing when it aggregates. It transitions from "many" to "one" based on causal integration. This matches biological reality: the slug acts as a single agent.

  **2. The Forest**
  *   **Verdict:** **Generally No (with a specific exception).**
  *   **Reasoning:** In a typical forest, Tree A does not structurally hold Tree B. They are held in place by the ground (external). If you remove Tree A, Tree B stands. There is no internal resilience binding them into a single unit.
  *   **Exception:** A clonal colony like **Pando** (the trembling giant aspen). Here, all "trees" are stems connected by a single massive underground root system. The root system provides **internal structural constraint**. Pando is a thing; a standard forest is a collection of things.

  ### The Sacrifice: Which Verdict Must You Soften?

  You asked which verdict this principle forces you to give up. The principle is robust, but it puts pressure on **Case #5: The Freshly Dead Body.**

  Here is the tension:
  *   **Your Intuition:** A fresh corpse is definitely a "thing."
  *   **The Principle:** A thing requires internal maintenance (dynamic or structural).
  *   **The Conflict:** A corpse is no longer dynamically maintaining itself. It is decaying. It is technically transitioning from a "Thing" (Organism) to a "Heap" (Organic Matter).

  **The Fix:**
  You have to accept that **objecthood can fade.**
  Under this principle, the moment life ceases, the object begins to lose its ontological status. A fresh corpse is a thing *only because* the structural integrity (bones/skin) hasn't failed yet. A decomposed corpse is a heap.
  *   **If you want a strict principle:** You must admit the corpse is a "thing" only in a derivative, temporary sense (like a ruined building). It is a *former* thing.
  *   **If you keep the verdict:** You must accept that **Structural Inertia** counts as unity even after Causal Unity ends. This makes the line between "Corpse" and "Heap" vague (when exactly does it stop being a body?).

  **Recommendation:**
  Keep the **Corpse** verdict but acknowledge it is **parasitic**. It is a thing only because it *was* a thing recently. This preserves your intuition without breaking the principle for the other 9 cases. The "Internal Integrity" principle explains *why* it's a thing (residual structure) and *why* it won't stay one (lack of active maintenance).

  ### Why This Isn't Just "Usefulness"

  You mentioned you don't want the answer to be "it's a thing if it's useful."
  This principle avoids that by grounding "thinghood" in **mind-independent causal powers.**

  *   A **Heap** scatters if the wind blows (low causal power to persist).
  *   A **Bike** stays together if the wind blows (high causal power to persist).
  *   A **Flame** reignites if disturbed (high causal power to persist).

  Whether you find it "useful" to talk about the heap is irrelevant; the heap physically lacks the internal glue to resist entropy. The principle relies on physics and biology (constraints, equilibrium, entropy), not human interest.

  ### Summary
  *   **Principle:** Internal Dynamic or Structural Integrity (parts hold each other, not the environment).
  *   **Slime Mold:** Yes (when aggregated).
  *   **Forest:** No (unless clonal/root-connected).
  *   **Sacrifice:** You must view the **Corpse** as a fading object, not a permanent one. Its status is borrowed from its past life.
  *   **Hands/Heap/Room:** Correctly identified as non-things because their cohesion is external (muscles, gravity, walls).
