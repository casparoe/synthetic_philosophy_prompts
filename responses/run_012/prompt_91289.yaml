answer: |-
  Dear Colleague,

  I have been reflecting on the spirited exchange from our recent seminar regarding Fomenko's New Chronology and the applicability of Lakatosian methodology to the demarcation of pseudohistory. It is a fascinating dispute because it touches on the very limits of extending philosophy of science into the humanities, and I believe both your colleagues have grasped important aspects of the problem while potentially overextending the analogy in opposite directions. To audit the analogy properly, we must first rigorously map the components of the New Chronology onto Lakatos's framework to see where the fit is tight and where it begins to fray. In the Lakatosian schema, the hard core consists of the fundamental assumptions that are treated as irrefutable by the methodological decision of the proponents. For the New Chronology, this hard core is the claim that conventional chronology is inflated by roughly one thousand years and that much of ancient and medieval history is a phantom construct created by later chronologists. The protective belt comprises the auxiliary hypotheses deployed to shield this core, which in Fomenko's case includes specific statistical methods for dating texts, astronomical retrocalculations that are often contested by professional astronomers, and the pervasive auxiliary claim that physical artifacts and documents are medieval forgeries rather than genuine ancient items. The positive heuristic, or the set of guidelines for developing the programme, instructs practitioners to look for statistical parallels between different historical epochs and to interpret discrepancies as evidence of duplication rather than error. The negative heuristic forbids attacking the core claim of compression, directing all modus tollens away from the central thesis and toward the reliability of the evidence itself. When we look at the problem shift, the mapping suggests a degenerating trajectory. A progressive shift would involve novel predictions, such as locating undiscovered artifacts that fit the compressed timeline or finding new textual evidence that independently confirms the statistical models. Instead, the New Chronology largely accommodates anomalies after the fact by expanding the protective belt to include more allegations of falsification, which is the hallmark of degeneration. However, the mapping becomes strained when we consider that Lakatos developed this methodology for natural sciences where experimental control is possible, whereas history relies on fragmentary evidence that cannot be regenerated in a laboratory.

  This strain leads us directly to the disanalogies between a Lakatosian research programme and a pseudohistorical enterprise, some of which are incidental and others crucial for demarcation. An incidental disanalogy is the subject matter; whether one studies quarks or kings is less important than the logical structure of the inquiry. A crucial disanalogy, however, lies in the nature of the empirical basis and the community standards governing it. In a scientific research programme, the protective belt is adjusted to save the core from empirical refutation, but the evidence itself is generally accepted as given by the wider community. In the New Chronology, the protective belt often functions by rejecting the evidence itself, claiming that carbon dating is flawed, stratigraphy is misunderstood, or documents are forged. This moves the dispute from the interpretation of evidence to the validity of the methods used to establish evidence, which undermines the shared empirical basis required for a rational research programme. Furthermore, Lakatos assumes a community of practitioners who share a commitment to solving puzzles within a framework of methodological norms. The New Chronology operates largely outside the peer-review structures and philological standards of the historical profession, meaning it lacks the communal checking mechanism that allows a degenerating programme to be identified as such by its peers. While a scientific programme might degenerate while still adhering to scientific norms, pseudohistory often degenerates by abandoning the norms of the discipline entirely. This matters for the intended use of the analogy because if the enterprise does not play by the rules of the game, calling it a losing player in the game is misleading.

  We must also consider what the analogy quietly imports from its source domain in natural science that the target domain of history may lack. The Lakatosian framework presupposes a shared background of empirical testing where predictions can be clearly distinguished from accommodations. In history, the distinction between predicting a new discovery and accommodating an existing one is blurrier because the past is fixed and evidence is discovered retrospectively. The analogy also presupposes a community of practitioners with recognized standards of rationality and evidence evaluation. If the New Chronology does not accept the standards of radiocarbon dating or philology, it is not merely proposing a different theory within the same field; it is proposing a different epistemology. Additionally, the analogy presupposes that historical chronology is a predictive science in the relevant sense. While historians can predict what kind of evidence should exist if a theory is true, they cannot generate new evidence through experiment. This makes the criterion of novel factual content harder to apply. If the New Chronology predicts that we will not find certain artifacts because they were never created, and we do not find them, this is a weak form of confirmation compared to a physicist predicting the existence of a particle. The analogy imports the expectation of progressive empirical growth that is structurally more difficult to achieve in historiography than in physics, which might make the judgment of degeneration too harsh if applied without modification, though in Fomenko's case, the lack of novel confirmation is stark.

  Assessing the conclusion drawn by your first colleague, that the New Chronology is pseudoscience based on its status as a degenerating research programme, requires nuance. The diagnosis of degeneration is accurate; the programme is ad hoc and fails to generate novel confirmed facts. However, labeling it pseudoscience solely on this basis might be insufficient because legitimate scientific programmes can go through periods of degeneration before recovering or being replaced. The label pseudoscience implies something more structural than temporary degeneration. It implies a systematic immunity to criticism that goes beyond the normal protective belt. If we accept the mapping, the conclusion survives only if we add the caveat that the degeneration is terminal and coupled with a violation of the methodological norms of the host discipline. The programme is not just degenerating; it is insulating itself from the very criteria that would define degeneration. Therefore, the first colleague is right in spirit but perhaps too quick to rely on degeneration alone as the sufficient condition for pseudoscience. It is the combination of degeneration and the rejection of the empirical basis that secures the demarcation.

  Your second colleague's counter-conclusion, that Lakatos forbids calling it pseudoscience while it has defenders and unresolved anomalies in the conventional chronology, overreads Lakatos in a way that grants undue legitimacy to the rival. Lakatos did argue that one cannot rationally abandon a programme until a better one appears, and that judgments are retrospective. However, this principle applies to rational competitors within the scientific community. It presupposes that both programmes are aiming at the same empirical truth and adhering to the same methodological rules. The New Chronology does not meet this condition. It is not a rival programme in the Lakatosian sense because it does not accept the negative heuristic of the discipline of history itself, which requires engaging with evidence according to established philological and archaeological standards. Lakatos's rule protects programmes that are trying to solve problems scientifically but are currently struggling; it does not protect enterprises that redefine the rules of evidence to make refutation impossible. To suggest that conventional chronology is merely another research programme with its own hard core is correct, but conventional chronology is progressive in the Lakatosian sense because it continues to yield novel insights and integrate new data without resorting to global conspiracy theories about evidence fabrication. Therefore, the second colleague is incorrect to use Lakatos's fallibilism to shield the New Chronology from the label of pseudoscience. The presence of defenders does not make a programme scientific, nor does the existence of anomalies in the dominant view validate a rival that ignores methodological norms.

  If there is a better analogy for the demarcation question at issue, I would propose viewing the New Chronology not as a degenerating research programme but as a counterfeit currency. A degenerating research programme implies something that was once genuine money but has lost its value due to market forces or inflation. It suggests a history of legitimate success followed by decline. The New Chronology, however, was never legitimate history; it mimics the appearance of historical scholarship without possessing the underlying value of methodological integrity. The counterfeit analogy captures the intent to deceive or the structural lack of backing that the research programme analogy misses. A counterfeit bill looks like money and can be passed around by those who do not know better, but it lacks the security features and the institutional backing that give money its value. Similarly, pseudohistory uses the vocabulary and trappings of history, such as footnotes and statistical graphs, but lacks the security features of peer review, reproducibility, and adherence to disciplinary standards. This analogy better explains why we can dismiss it immediately rather than waiting for a better rival to appear. We do not wait for a better counterfeit to appear before declaring a bill fake; we inspect the bill against the known standards of the mint. This shifts the demarcation criterion from the dynamic history of the theory's success to the static assessment of its methodological constitution. It allows us to say that the New Chronology is pseudohistory not because it is failing to solve problems, but because it is not playing the game of history at all. This captures the intuition that there is a qualitative difference between a bad theory and a pseudo-theory, a distinction that the continuum of progressive to degenerating research programmes sometimes obscures. I hope this helps clarify the stakes in your seminar, and I look forward to hearing how the discussion evolves.

  Yours sincerely,

  A Friend in Philosophy
