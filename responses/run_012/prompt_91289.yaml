prompt: |-
  You are a philosopher of science with a specialization in demarcation problems and the historiography of pseudohistory. I want you to think carefully and, before writing your final answer, spend some time brainstorming the relevant mappings and possible disanalogies. Then give me a continuous prose response, in the form of a letter to a colleague, with no headings, no bullet points, no bold text, and no tables.

  Context: In a seminar on pseudohistory, a colleague argued that Fomenko's New Chronology is best understood as a degenerating research programme in Lakatos's sense. On this view, the theory's core claims about a radical compression of ancient history are protected by an ever-expanding belt of auxiliary statistical and textual adjustments, and the programme has long since stopped making novel predictions that are independently confirmed; it only accommodates anomalies after the fact. My colleague took this to settle the demarcation question: the New Chronology is pseudoscience, not just bad history.

  Another colleague objected. She said the conventional chronology of the ancient Mediterranean and Near East is itself a research programme, with its own hard core and protective belt, and that Lakatos's methodology implies we cannot declare a programme pseudoscientific while it still has able defenders and unresolved anomalies. She added that Lakatos himself insisted that one cannot rationally abandon a degenerating programme until a better rival appears, and that judgments of progress and degeneration are retrospective. On her view, my first colleague's use of Lakatos is anachronistic and question-begging.

  I want an audit of the analogy. Please do the following, in whatever order makes for the clearest prose. First, lay out the correspondence: what in the New Chronology plays the role of the hard core, the protective belt, the positive heuristic, and the progressive or degenerating problem shift? Be explicit about what maps onto what, and note where the mapping is strained or indeterminate. Second, identify the disanalogies between a research programme in Lakatos's sense and a pseudohistorical enterprise of this kind. Which of these disanalogies matter for the intended use of the analogy, and which are merely incidental? Third, consider what the analogy quietly imports from its source domain that the target may lack. For instance, does it presuppose a shared background of empirical testing, a community of practitioners with recognised standards, or a clear distinction between core commitments and auxiliary hypotheses? Does it presuppose that historical chronology is a predictive science in the relevant sense? Fourth, assess whether the conclusion my first colleague drew, that the New Chronology is pseudoscience, survives once the disanalogies are on the table. Fifth, assess whether my second colleague's counter-conclusion, that Lakatos forbids calling it pseudoscience while it has defenders, is itself licensed by the analogy or whether it overreads Lakatos. Finally, if there is a better analogy for the demarcation question at issue, propose one and say what it captures that the research-programme analogy misses.

  Please write as if you are explaining this to someone who knows Lakatos's vocabulary but has not thought much about historiography. Do not give me a bibliography or citations; I want the argument, not the references.
