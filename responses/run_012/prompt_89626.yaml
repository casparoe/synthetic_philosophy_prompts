answer: |-
  Dear Colleague,

  It is a privilege to correspond with someone who has spent a lifetime adjudicating disputes and now turns that rigorous mind to the foundations of biology. Your proposed audit of the concept of function reveals a sophisticated grasp of the current literature, and much of what you have set down forms a coherent and defensible philosophical position. However, as in any legal code, there are statutes that clash when applied to specific cases, and in your set of commitments, there is one provision that threatens to overturn the verdict of the others. I will walk you through the compatibility of your five commitments, ordering the tensions from the merely apparent to the genuinely incompatible, and offer an opinion on which commitment must be surrendered to preserve the integrity of the whole.

  To begin with the good news, your first, second, third, and fifth commitments can be held together without significant strain. Your endorsement of the selected-effects account as the central biological notion fits naturally with your claim that function statements explain why a trait is there. This is the great strength of the etiological view championed by philosophers like Ruth Millikan and Karen Neander: it grounds the explanatory power of function in the history of selection. When you say the heart is there because it pumped blood in ancestors, you are providing a historical explanation for its presence, which satisfies your fifth commitment. Furthermore, your third commitment, that function ascriptions are normative, is actually a virtue of the selected-effects account rather than a bug. If the function is defined by what ancestors did to survive, then a current trait that fails to do so is literally failing to meet the standard set by its history, which grounds the notion of malfunction and the normative ought you describe. Your second commitment, regarding the causal-role account used by physiologists, is also compatible with the first, provided you maintain the pluralist stance you have already adopted. Many philosophers, such as Peter Godfrey-Smith, have argued that biologists and physiologists are simply playing different language games with different purposes. The physiologist asks what a part contributes to the current system capacity, while the evolutionary biologist asks why the part was retained in the lineage. As long as you treat these as distinct projects answering different questions, there is no contradiction in holding both accounts as correct within their respective domains.

  The apparent conflict lies only in ensuring you do not confuse the explanatory scope of these two accounts. Your fifth commitment states that function statements explain why the trait is there. This is true for the selected-effects account but generally false for the causal-role account. A causal role describes what a trait does now, not why it evolved. A pump might circulate fluid, but stating this does not explain why the pump exists rather than some other mechanism. Therefore, you must ensure that your fifth commitment is understood to apply primarily to the selected-effects notion in your first commitment, rather than the causal-role notion in your second. If you attribute explanatory power regarding the origin of the trait to the causal-role account, you would have a conflict, but since you have distinguished the questions they answer, this is easily resolved by clarifying that only etiological functions explain presence, while causal roles explain current capacity.

  The genuine incompatibility, and the most serious conflict in your brief, arises between your first and fourth commitments. Your first commitment defines the function of a token trait as the effect for which it was selected in the lineage that produced it. This definition is inherently historical; it requires a past pattern of selection to establish the function. However, your fourth commitment asserts that a trait can have a function the very first time it appears, before selection has had any opportunity to act on it, such as in a novel mutation arising in a single organism. These two statements cannot both be true. If the function is determined by past selection, then the first token of a new trait type has no function because there is no history of selection for that trait yet. It is merely a variation. If you insist that the first token has a function, you are implicitly rejecting the strict selected-effects account in favor of a propensity or system account, which defines function by what a trait can do or is disposed to do, regardless of history. You cannot have it both ways. You cannot define function by past selection and simultaneously claim it exists prior to that selection. This is a logical contradiction akin to asserting that a person is a veteran based on service they have not yet performed.

  A secondary, though related, conflict exists between your fourth and fifth commitments. You state that function statements explain why the trait is there. In the case of the novel mutation you describe in your fourth commitment, the trait is there due to random mutation and drift, not because of its function. Selection has not yet acted, so the function cannot be the cause of the trait's presence. If you ascribe a function to this first instance, that function ascription fails to explain why the trait is there, contradicting your fifth commitment. The explanation for the presence of the first mutant is genetic chance, not teleological function. Function only becomes explanatory once the trait is retained and spread by selection. Thus, holding both fourth and fifth commitments creates a tension where the function ascription loses its explanatory power in the very case you wish to highlight.

  To resolve these conflicts and maintain a coherent position, you must surrender or significantly weaken your fourth commitment. You should accept that on the selected-effects account, a novel mutation in a single organism does not have a proper function until it has been selected and reproduced in the lineage. It may have a causal role, and it may have a beneficial effect, but it does not have a function in the etiological sense until history catches up with it. The cost of this surrender is that you lose the ability to speak of function in cases of extreme novelty or single-instance traits. You cannot say the first wing proto-structure had the function of lift until it contributed to the survival of a lineage. Some find this counterintuitive, as we often want to say a new tool has a function the moment it is invented. However, in biology, where function is tied to the history of life, this historical constraint is the price of admitting the explanatory and normative power you value in your first, third, and fifth commitments. If you were to keep the fourth commitment and surrender the first, moving to a propensity account where function is about potential rather than history, you would save the intuition about novel mutations but lose the strong historical explanation for why the trait is there and the robust grounding for normativity. A propensity account struggles to explain malfunction as strongly as an etiological account does, because if function is just what a trait can do, then failing to do it is merely a breakdown, not a violation of a historical norm.

  Given your background and your expressed valuation of the selected-effects account as the central biological notion, I advise you to retain the first, second, third, and fifth commitments as a unified framework and treat the fourth as a mistaken intuition about the immediacy of function. You can preserve the spirit of the fourth commitment by acknowledging that the first token has a causal role that is likely to become a function if selected, but strictly speaking, the function awaits the verdict of history. This preserves the integrity of your audit, keeping your explanatory and normative claims secure while avoiding the logical contradiction of requiring history for definition while denying the need for history in application. I hope this assessment serves your purposes well as you prepare your conclusions for print, and I wish you the very best in this new chapter of your intellectual life.
