answer: |-
  You have identified a structural flaw that sits one layer higher than the standard literature on AI ethics and organizational sociology. You are correct that the "Problem of Many Hands" (dilution of contribution) and the "Responsibility Gap" (machine incapacity) do not capture this. Those concepts describe *why* responsibility is hard to assign; they do not describe the *governance failure* of having no one empowered to make the assignment verdict itself, nor do they account for the symmetry of credit.

  The closest established concept is **"Organized Irresponsibility"** (Ulrich Beck, *Risk Society*). Beck argues that modern institutions are structurally designed to produce risks while simultaneously dissolving the chains of accountability that would assign blame for them. However, this concept stops fitting your description in two critical places:
  1.  **Focus on Blame/Risk:** Beck's framework is almost exclusively about the evasion of *liability* for harm. It does not account for the evaporation of *credit* for success (the "praise symmetry" you noted).
  2.  **Outcome vs. Mechanism:** "Organized Irresponsibility" describes the *state* of the system (irresponsibility is the output). It does not name the *missing function* (the lack of an owner for the verdict). It explains why the buck doesn't stop, but not why no one is holding the buck.

  Because the existing lexicon focuses on the *distribution* of responsibility or the *capacity* of the agent, but ignores the *governance of the attribution process itself* (including the defense of success), there is no established term for exactly this.

  I propose the term **Attributional Stewardship Void**.

  ### The Carving

  **Definition:** An *Attributional Stewardship Void* exists when an organization possesses mechanisms to detect outcomes (success or failure) but lacks a defined role or charter with the authority to own the *causal narrative* linking those outcomes to human or systemic agency. It is a second-order governance failure: not a failure to be responsible, but a failure to own the process of assigning responsibility.

  **Boundary Conditions (What counts and what doesn't):**

  *   **Incident Reviews (Your Context):** **Counts.** The review produces a verdict ("systemic"), but no role owns the authority to validate that verdict or act on its implications. The verdict is "orphaned."
  *   **Ordinary Committee Decision:** **Does Not Count.** If a steering committee is chartered to make a decision, the *committee* holds the stewardship. Even if responsibility is diffuse among members, the *verdict* has a home (the committee charter). The Void exists only if the committee is ad-hoc and no one owns the conclusion.
  *   **Market Mechanisms:** **Does Not Count.** In a market, the "verdict" on success/failure is owned by the price mechanism and profit/loss. The "steward" is the shareholder or the firm's survival instinct. Credit and blame are attributed via financial flow, not organizational decree.
  *   **Unforeseeable Accident (No Automation):** **Does Not Count.** If a pipe bursts due to a material defect unknown to science, there is no organizational attribution to be made. The Void is specific to *sociotechnical* systems where a narrative *could* be constructed but isn't owned.
  *   **The Praise Symmetry:** **Integral.** This is the key differentiator from "Organized Irresponsibility." In an Attributional Stewardship Void, success is treated as "noise" or "baseline" because no one has the standing to claim it was a specific design choice worth protecting. Consequently, the specific configuration that caused the success is optimized away by local metrics. A Steward would have the standing to say, "Do not touch this; this is why we win."

  **Distinction from "Diffusion of Responsibility":**
  Diffusion of Responsibility is a psychological state where individuals feel less compelled to act because others are present. The Attributional Stewardship Void is a *structural* design pattern. It is not that people *feel* less responsible; it is that the *role* required to consolidate that responsibility is undefined. You can have a team of highly responsible people and still have a Stewardship Void if their job descriptions do not include the authority to finalize the causal narrative.

  **Why "Stewardship"?**
  "Stewardship" implies a duty to maintain the integrity of an asset over time. In your context, the "asset" is the *integrity of the causal map* between the system's behavior and the organization's intent. Without a steward, the map degrades: blame evaporates during incidents, and credit evaporates during successes, leading to systemic drift.

  \answer{Attributional Stewardship Void (coinage)}
