answer: |-
  ### The Case: "Weathered Bedrock" at the Ridge Station

  Two teams share a field station characterizing a fractured granite ridge for a municipal water supply. Both use the term **"Weathered Bedrock"** to classify samples from the borehole core.

  **Community A (Hydrologists)** defines "Weathered Bedrock" functionally: rock capable of sustaining well yield. In their vocabulary, "Weathered" is a sibling to "Recharge" and "Aquifer." If water flows, the rock is weathered.
  **Community B (Geochemists)** defines "Weathered Bedrock" genetically: rock showing mineralogical alteration (feldspar to clay). In their vocabulary, "Weathered" is a sibling to "Protolith" and "Alteration." If the minerals haven't changed, the rock is fresh, regardless of flow.

  **The Conflict:** They encounter a zone of highly fractured granite. The fractures allow high water flow, but the mineral grains are chemically pristine.
  *   Community A classifies it as **"Weathered Bedrock"** (it yields water).
  *   Community B classifies it as **"Fresh Bedrock"** (no chemical alteration).

  **The Shared Procedure:** To prevent talk-past-each-other, they agree on a **Dual-Verification Protocol**. For any joint map, a unit is labeled "Weathered" only if it passes *both* the hydraulic conductivity test (A's check) and the XRD alteration index (B's check). If it passes only one, it receives a composite label ("Fractured-Fresh") and triggers a mandatory joint review. This procedure forces them to acknowledge the mismatch without allowing either side to dismiss the other's data as irrelevant.

  ***

  ### The Work

  **1. What the Term Picks Out (and Why Translation Fails)**
  For Community A, "Weathered" picks out a *hydrologic capacity*. To translate this into Community B's vocabulary, you would have to say "Weathered means permeable," but B rejects this because permeability can exist without weathering (via fracturing). The term "Weathered" in A's lexicon carries a normative force about *utility* (can we pump it?) that B's lexicon lacks.
  For Community B, "Weathered" picks out a *chemical history*. To translate this into A's vocabulary, you would say "Weathered means altered," but A rejects this because alteration can exist without utility (e.g., sealed clay). The term in B's lexicon carries a theoretical load about *process* (how did it form?) that A treats as secondary.
  Translation fails because you cannot swap the term without severing its links to its neighboring concepts ("Aquifer" vs. "Protolith"). You aren't just changing a definition; you are changing the kind of thing the rock is understood to be.

  **2. The Feature Doing the Work**
  The driving feature is the **constitutive criterion**. For A, flow is constitutive of the category; for B, alteration is constitutive. The divergence isn't about the data (they agree on the flow rates and the XRD scans); it's about which data point *makes* the thing what it is. This isolates meaning divergence from factual disagreement.

  **3. Removing the Shared Procedure**
  If you remove the Dual-Verification Protocol, the case slides into **full incommensurability**. Without the mandate to joint-review mismatches, Community A would simply map the zone as "Aquifer" and ignore the mineralogy, while Community B would map it as "Fresh" and ignore the hydrology. They would produce mutually unintelligible maps of the same physical space. There would be no mechanism to force a confrontation of the vocabularies, allowing each side to retreat into a self-sealing language game where the other's concerns are literally invisible.

  **4. The Feyerabend-Type Objection**
  A Feyerabendian would argue the Dual-Verification Protocol is not neutral. They would claim the hydraulic test is theory-laden (assuming Darcy's Law applies) and the XRD index is theory-laden (assuming specific alteration pathways). There is no "raw data" here to settle the dispute; there are only competing interpretations. They would deflate the case by arguing that the "agreement" on procedure is just a temporary political truce, not an epistemic bridge. The procedure doesn't solve the incommensurability; it just masks it with bureaucracy.

  **5. The Externalist Objection**
  Someone who believes meanings are fixed by causal contact with the world (a Putnam-style externalist) would argue that the meaning hasn't actually changed, only our *concept* of it. They would say "Weathered Bedrock" refers to a real natural kind in the ridge. Either the rock *is* weathered or it *isn't*, independent of the teams' vocabularies. On this view, one community is simply mistaken about the extension of the term. The divergence is epistemic (about what we know), not semantic (about what we mean). The world will eventually force convergence when one model predicts the well failure and the other doesn't.
