answer: |-
  Good evening, everyone. Thank you for coming. It is a strange thing, isn't it? To look around a room like this and realise that for fifteen years, most of us only knew each other as usernames. Text on a screen. Avatars in a sidebar.

  When this board started, the internet felt like a place where we could build something permanent. A town square. But there is a line of thought, old now, that suggests the opposite. It suggests that when we gather like that—abstractly, behind screens, as a 'public'—we don't actually become a community. We become a phantom. An abstraction that nobody truly belongs to, but everyone feels involved in. It gives us the feeling of participation without the responsibility of presence.

  That philosopher argued that the characteristic sickness of our age isn't tyranny, but levelling. Everything gets flattened down into chatter. Opinions become weightless. Nothing is decided, nothing is done, everything is just discussed. And worse, he argued that the crowd is untruth. That truth can only be held by the single individual, standing on their own two feet, accountable for what they say.

  Looking back at fifteen years of moderation, I have to admit: he was mostly right about us.

  This board was often a crowd. It was often chatter. There were days when the levelling machine worked perfectly, grinding down nuance into something digestible and dull. And there were days when the crowd was untruth, and I was the one wielding it.

  I think most of you know what I'm referring to. 2019. We hounded a long-time member off the site. There were rules, there were procedures, but looking back, it was the mob mentality that drove it. I held the ban hammer. I told myself I was keeping the peace. In reality, I was enforcing the will of the phantom. I regret that. I regret it deeply. If this speech were just about nostalgia, I wouldn't mention it. But if we're going to honour what this place was, we have to honour the whole thing, the bad with the good.

  And yet, here we are. Forty of you, in a pub, on a Saturday night.

  Because while the board was a phantom, the connections weren't. I met my two closest friends on those threads. But that didn't happen because of the forum. It happened despite it. It happened when the abstraction broke down, and one individual spoke honestly to another. Not as members of a public, but as people. That was the real thing. The rest was just the infrastructure.

  So, this brings me to the future. Three of us are planning to start a new platform. We want to keep the conversation going. But I need to be honest about this, because I think some of you are hoping to come along.

  If we think moving to new software is going to fix the problem, we are kidding ourselves. The phantom isn't a property of the code. It's a property of how we relate to one another. If we take the crowd mentality with us—the levelling, the abstract righteousness, the feeling that we are part of a movement rather than a collection of individuals—then the new site will die just like this one. It might take longer, but the end will be the same.

  We can only make this work if we refuse to be a crowd. If we accept that the only thing that matters is the person you are speaking to right now. Not the audience. Not the reputation. Just the individual.

  I know that sounds heavy for a Saturday night. And I know there are chips coming out shortly, which are far more important than anything I'm saying.

  But I wanted to say this before we pull the plug. I wanted to acknowledge that much of what we built was sand. But I also wanted to say that the friendships we found in that sand are rock. I am grateful for the sand, because it led me to the rock.

  So, if you'll raise a glass. Not to the board. Not to the community. But to the individuals in this room. May you always find the courage to stand on your own, even when you're standing together.

  Cheers.
