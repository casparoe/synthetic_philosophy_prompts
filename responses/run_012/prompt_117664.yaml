  8.  *(Final check of the "Cold Room" specifics)*: The prompt says "You never actually have to do it... no penalty." This confirms it is exactly Kavka's Toxin Puzzle. The reward is for the *intention*, not the *action*. The action is costly (4°C for an hour is unpleasant) with no ex-post benefit.

