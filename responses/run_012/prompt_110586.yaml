prompt: |-
  I write about science and ideas for a living, which mostly means my friends now ask me to referee arguments I'm not qualified to referee. Here's the current one.

  My sister is applying for a job at a small research outfit. After the interviews, they asked her to do a "trial project" — about a week of real work, unpaid, and they say they won't use anything she produces. Her boyfriend thinks this is smart. His line: anybody can claim to be detail-oriented and hardworking on a resume, and anyone can fake enthusiasm in an interview, but only someone who will actually burn a week of her life for nothing has proven she wants it. He says if they paid everyone for the trial, or cut it down to an hour, the whole point would evaporate. My sister says the opposite: she'd have done that week for literally any job she'd applied to, so all it proves is that she's desperate and has savings. Also, one of the other finalists is a kid with family money who took a month off to travel; another has two kids and a day job. If the week is the test, she says, the test measures the wrong thing.

  Then she went and did the project anyway, and got the job, so now she's mad at herself and also thinks the process was rigged in her favor.

  I think they're both half right and I can't articulate why. His point seems to be that the waste is what makes the claim believable — that if the trial were easy, or fun, or paid, it wouldn't tell them anything. But then her point kicks in: what it tells them depends on who can afford the waste, and it might be telling them she's desperate rather than that she's good.

  Where I get stuck is the counterfactuals. If the company paid for the trial, would they learn less? If they made the project genuinely interesting, would they learn less? If it took a month instead of a week, would they learn more, or just end up fishing in a different and worse pond? And is there any version of this that gets them the information without the pointless week, or is the pointless week itself the information? I'd also like to know whether it matters that they don't use the output, and what changes if they do.

  And how do I think about the ethics here seperately from the mechanics? If the filter genuinely works, does that make it fair? Would your answer change if the place were a nonprofit my sister admired rather than some random lab, or if the trial were the only way a broke candidate could get in the door?

  I'm definately out of my depth. Could you walk me through the general shape of this — why a useless cost can be informative at all, when that breaks down, and what a smarter version of this process would look like? A verdict on my sister's case wouldn't hurt either.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User:** A science/ideas writer. They are intellectually sophisticated but feel out of their depth regarding economics/game theory/ethics of hiring practices.
      *   **Context:** Sister did an unpaid week-long trial project for a job. Boyfriend says it's a good signal (proves commitment). Sister says it's a bad signal (probes desperation/privilege). She got the job but feels conflicted.
      *   **Core Question:** Why can a "useless cost" be informative? When does it break down? What would a smarter version look like? Ethics vs. Mechanics. Verdict on the specific case.
      *   **Tone:** Analytical, nuanced, empathetic, structured (matching the user's "science and ideas" background). Avoid jargon where possible, but don't shy away from concepts like "signaling theory."

  2.  **Deconstruct the Argument (The Boyfriend vs. The Sister):**
      *   **Boyfriend (Signaling Theory):** Unpaid work is a *costly signal*. It separates the truly committed from the posers. If it were paid, everyone would do it. If it were short, it wouldn't test endurance.
      *   **Sister (Selection Bias/Equity):** The cost isn't uniform. A week of unpaid work is cheap for the wealthy/desperate, expensive for the working class/parents. Therefore, it selects for privilege or desperation, not necessarily talent or fit.
      *   **User's Intuition:** Both are half-right. The signal works *mechanically* but fails *ethically/optimally*.

  3.  **Key Concept: Costly Signaling Theory:**
      *   This is the economic/biological framework needed here. Peacocks' tails, gazelles stotting.
      *   *Condition for a good signal:* It must be costly, and the cost must be lower for the "high quality" type than the "low quality" type.
      *   *Application:* The "cost" is time/effort. The "quality" is commitment/skill.
      *   *The Flaw:* The cost is *not* uniform across candidates (as the sister noted). For the rich kid, the cost is low. For the single mom, the cost is prohibitive. This creates a "pooling equilibrium" of privilege rather than talent.

  4.  **Addressing the Counterfactuals (User's specific questions):**
      *   *If paid:* Yes, they learn less about *desperation/commitment*, but they learn more about *skill* because the pool is larger/more diverse.
      *   *If interesting:* Intrinsic motivation replaces extrinsic cost. Good for culture, bad for filtering "grit."
      *   *If a month:* Filters out almost everyone except the wealthy/unemployed. High risk of legal issues (labor laws).
      *   *Use the output?* If they use it, it's work. If they don't, it's a test. Using it makes it legally/ethically shakier (unpaid labor), but practically more efficient (free work). Not using it makes it a pure signal.

  5.  **Ethics vs. Mechanics:**
      *   *Mechanics:* Does it predict job performance? Maybe. It predicts ability to work unpaid for a week.
      *   *Ethics:* Is it fair? No. It disadvantages protected classes (parents, low income). Is it legal? Gray area (depending on jurisdiction, often illegal if it benefits the company).
      *   *Nonprofit angle:* Doesn't change the mechanics, maybe softens the ethical blow (mission-driven), but doesn't fix the exclusion problem.

  6.  **Designing a Smarter Process:**
      *   Paid trial (removes economic bias).
      *   Shorter, standardized task (reduces cost, increases comparability).
      *   Work sample during interview (observe process, not just output).
      *   Reference checks (past behavior is a better signal than current sacrifice).

  7.  **Verdict on the Sister's Case:**
      *   Boyfriend is right about *signaling logic* but wrong about *optimality*.
      *   Sister is right about *bias* and *information quality* (it measured privilege/desperation).
      *   She shouldn't be mad at herself (rational choice in a broken system).
      *   The process was likely rigged, but not necessarily against *her* specifically—rather, against people like her *demographic* if she weren't privileged enough to afford the week. Wait, she *did* afford it. So she passed the privilege test. Her anger is justified because the metric was flawed.

  8.  **Drafting the Response (Iterative refinement):**
