answer: |-
  This is a classic problem in information economics, specifically **Signaling Theory**, wrapped in an ethical dilemma about labor and equity. Your intuition that you are both "half right" is correct, but the split isn't 50/50. It's more that the boyfriend is right about the *mechanics* of the signal, while your sister is right about the *noise* in the channel and the *ethics* of the transmission.

  Here is the shape of the problem, broken down by mechanics, breakdown points, and ethics.

  ### 1. Why a "Useless Cost" is Informative (The Boyfriend's Case)
  In economics and evolutionary biology, this is called a **Costly Signal**. The classic example is a peacock's tail. The tail is heavy, makes flying harder, and attracts predators. It is objectively "useless" for survival. Precisely *because* it is useless and costly, it is informative.

  If a peacock could grow a big tail easily, sickly peacocks would do it, and the signal would mean nothing. Because the tail is expensive to grow, only healthy peacocks can afford it. The waste *is* the message.

  Applied to your sister's job:
  *   **The Signal:** "I am willing to incur a cost (one week of unpaid time) to prove my value."
  *   **The Logic:** If the trial were paid, low-commitment candidates would apply just to get a week's pay. If the trial were short (one hour), it wouldn't test endurance or workflow integration.
  *   **The Information:** The employer learns that the candidate has a high tolerance for risk and a high valuation of *this specific job* relative to their time.

  The boyfriend is correct that removing the cost (paying them) or reducing the cost (shortening it) degrades the signal's ability to filter for "grit" or "specific desire."

  ### 2. Where the Signal Breaks Down (The Sister's Case)
  Signaling theory relies on a critical assumption: **The cost must be correlated with the quality you are trying to measure.**

  In a perfect world, the "cost" of a week's work is the same for everyone. In the real world, the cost is variable.
  *   **For the kid with family money:** The cost of a week of unpaid work is near zero. They have a subsidy.
  *   **For the parent with a day job:** The cost is prohibitive. They cannot physically clear the schedule.
  *   **For your sister:** The cost was moderate (she had savings, no kids), but it measured her *liquidity*, not just her *commitment*.

  This introduces **Adverse Selection**. By setting a high cost of entry, the company isn't just filtering for "people who want the job." They are filtering for "people who can afford to want the job."

  Your sister is right that the test measures the wrong thing. It measures **privilege** and **desperation**.
  *   **Privilege:** As noted, wealth lowers the cost of the signal.
  *   **Desperation:** A candidate with no savings might take the unpaid week not because they love the science, but because they are terrified of unemployment. This signals "high need," not necessarily "high fit."

  So, the employer gets data, but it is noisy data. They think they are measuring *commitment*, but they are largely measuring *runway*.

  ### 3. Answering Your Counterfactuals
  You asked how changing the variables changes the information. Here is the trade-off matrix:

  *   **If they paid for the trial:**
      *   *Mechanic:* The pool of applicants widens significantly. You get more diversity.
      *   *Information Loss:* You lose the filter for "desperation/sacrifice."
      *   *Information Gain:* You gain a better sample of actual talent, because talented people who are currently employed (and thus expensive) will apply.
      *   *Verdict:* Better for hiring quality, worse for filtering "hunger."

  *   **If the project were genuinely interesting:**
      *   *Mechanic:* Intrinsic motivation replaces extrinsic cost.
      *   *Information:* You filter for people who love the *work*, not people who love the *job title*.
      *   *Risk:* You might hire great scientists who are terrible employees (they like the puzzle, not the bureaucracy).

  *   **If it took a month instead of a week:**
      *   *Mechanic:* The cost becomes prohibitive for almost everyone except the wealthy or the long-term unemployed.
      *   *Information:* You aren't testing commitment anymore; you are testing wealth. The signal becomes pure noise regarding skill.
      *   *Legal Risk:* In many jurisdictions (like the US under the FLSA), a month of real work that benefits the company *must* be paid. A week is often a legal gray zone; a month is a lawsuit waiting to happen.

  *   **Does it matter if they use the output?**
      *   **Yes, immensely.**
      *   **If they don't use it:** It is a pure test. It is ethically cleaner (no theft of labor) but economically wasteful.
      *   **If they do use it:** It is unpaid labor. This shifts the dynamic from "signaling" to "exploitation." If they use the work, the candidate is an employee by most legal definitions. If they don't use it, the candidate is an applicant. Your sister's situation (they said they wouldn't use it) keeps it in the "test" category, which validates the boyfriend's signaling argument but heightens the sister's equity argument.

  ### 4. Ethics vs. Mechanics
  You asked: *If the filter genuinely works, does that make it fair?*

  **No.** Efficiency does not equal fairness.
  A metal detector at an airport "works" to find guns. If you set the sensitivity so high that it beeps for everyone with a belt buckle, it will catch 100% of guns. It is mechanically effective. It is also a nightmare of inefficiency and indignity.

  *   **Mechanics:** Does this predict job performance? Probably somewhat. People who sacrifice for a job often value it more once hired (sunk cost fallacy works on employees too).
  *   **Ethics:** Does this exclude protected classes? Yes. It systematically excludes parents, low-income individuals, and those without a safety net.

  **Does the Nonprofit Angle Change Things?**
  Morally, slightly. If the mission is vital (e.g., cancer research), one could argue the "greater good" justifies stricter filtering.
  Economically? No. A broke candidate still cannot work for free.
  Legally? Actually, yes. Nonprofits often have stricter rules about unpaid internships/trials than private firms.

  **The "Broke Candidate" Scenario:**
  If the trial is the *only* way a broke candidate gets in the door, that suggests the resume screening is biased against them. The trial isn't the solution; the resume screening is the problem. Using an unpaid trial to fix a biased resume screen is like using a toll booth to fix a broken bridge.

  ### 5. What Would a Smarter Process Look Like?
  If the goal is to measure *skill* and *fit* without measuring *wealth*, the company should:

  1.  **Pay for the trial.** Even a nominal stipend removes the economic barrier. It signals *they* are invested, not just the candidate.
  2.  **Standardize the task.** Instead of "do a week of work," give a 4-hour standardized problem that mirrors the job. This controls for time cost.
  3.  **Work Sample during Interview.** Have the candidate solve a problem *in the room* (or on Zoom) while the team watches. This measures process and collaboration, not just output.
  4.  **Reference Checks.** Past behavior is a cheaper signal than future sacrifice.

  ### 6. The Verdict on Your Sister's Case

  **On the Boyfriend:** He is theoretically right but practically naive. He understands *Signaling*, but he ignores *Selection Bias*. He assumes the playing field is flat. It isn't.

  **On the Sister:** She is practically right and ethically right. She identified that the metric was flawed (measuring privilege/desperation). However, her anger at *herself* is misplaced.

  **The "Rigged" Feeling:**
  She feels the process was rigged in her favor because she *could* afford the week when others couldn't. She is correct. She passed a privilege test, not just a competence test. That creates "Imposter Syndrome" rooted in reality: she knows she cleared a hurdle that was lower for her than for others.

  **Should she be mad at herself?**
  No. She played a game where the rules were set by the employer. She optimized her chances within a broken system. That is rational behavior. The fault lies with the lab for choosing a hiring filter that optimizes for "people who can work for free" rather than "people who can do the work."

  **Summary:**
  The useless week *is* informative, but it informs the company about the candidate's **bank account and risk tolerance** more than their **scientific ability**. A smarter company would pay for the week to ensure they are fishing in the whole ocean, not just the shallow end where the wealthy stand.

  Tell your sister to take the job, do great work, and then try to change the hiring policy from the inside. That's the only way to fix the signal.
