      *   *Section 2: Where the Signal Breaks.* The "Cost" isn't constant. Privilege acts as a subsidy. Desperation acts as a subsidy. This leads to Adverse Selection.
      *   *Section 3: The Counterfactuals.* Answer the specific "What if" questions (Paid, Interesting, Longer, Output).
      *   *Section 4: Ethics vs. Mechanics.* Separate predictive validity from fairness. Mention labor laws.
      *   *Section 5: The Smarter Version.* Propose alternatives.
      *   *Section 6: The Verdict.* Address the sister's feelings and the specific situation.

  9.  **Refining the Tone:**
