answer: |-
  # The Interpretive Integrity Checklist (IIC)
  **Based on the Principle of Coherence (Davidsonian Radical Interpretation)**

  **Purpose:** To resolve contradictions in witness transcripts without silently smoothing them over or prematurely damaging credibility.
  **Time Limit:** 45–60 minutes per contradiction cluster.
  **User:** Documentation Officer/Interviewer.

  ## Part 1: The Core Rules

  **Rule 1: The Presumption of Coherence**
  Start from the assumption that the witness is rational and telling the truth as they understand it. You are not looking for lies; you are looking for the *context* that makes the statement true.

  **Rule 2: The One-Variable Constraint**
  When a statement contradicts evidence or itself, you may adjust **only one** of the following three variables to resolve it. Do not adjust two. If one adjustment doesn't fix it, mark it as **Residue** (see Rule 6).
  1.  **Lexicon:** The meaning of a word or phrase (e.g., "Night" means "early morning").
  2.  **Belief:** The factual accuracy of the claim (e.g., "They were mistaken about the time").
  3.  **Logic:** The inference connecting the claims (e.g., "They implied causation where there was none").

  **Rule 3: The Hierarchy of Cost**
  Some adjustments damage the account's utility more than others. Apply adjustments in this order (Cheapest to Most Expensive):
  1.  **False Belief (Cheapest):** The witness is mistaken about a fact. *Why:* A rational person can be wrong. Trauma, stress, and poor visibility cause factual errors without implying dishonesty or irrationality.
  2.  **Lexical Revision (Medium):** The word means something different in their dialect/culture. *Why:* This requires external verification (interpreter check) and complicates the legal record.
  3.  **Logical Revision (Expensive):** The witness misspoke or the interpreter garbled the connection between sentences. *Why:* This questions the structural integrity of the testimony.
  4.  **Broken Inference (Prohibited):** Do not attribute illogical thinking to the witness unless all else fails. *Why:* Davidson argues we cannot identify a belief unless the holder is mostly rational. Attributing broken logic makes the witness unintelligible.

  **Rule 4: Epistemic Charity (The "Reasonable Belief" Rule)**
  When objective truth conflicts with the witness's evidence, prioritize **what the witness could reasonably believe** given their position.
  *   *Example:* If a witness says "The soldiers killed him," but the autopsy says "Heart attack," do not record it as a lie. Record it as the witness's reasonable belief based on seeing soldiers beat the victim.
  *   *Action:* Record the belief in the narrative. Record the objective contradiction in the **Cost Ledger** (Part 3).

  **Rule 5: Breaking the Circle**
  You cannot interpret meaning without knowing beliefs, and vice versa. To start, anchor the transcript in **Undisputed Observables**.
  *   *Step:* Highlight sentences that match external evidence (documents, other witnesses, geography).
  *   *Step:* Treat these anchor points as fixed. Interpret the contradictions *relative* to the anchors. Do not move the anchors to save the contradictions.

  **Rule 6: The Residue Stop-Loss**
  If applying Rule 2 (One-Variable) requires a "High Cost" adjustment (Logical Revision) or contradicts an Anchor Point without a plausible explanation, **stop**.
  *   Do not rewrite the account.
  *   Mark the section as **[RESIDUE: UNRESOLVED CONTRADICTION]**.
  *   Write a neutral note explaining the clash.
  *   *Rationale:* A clean lie is less useful to a tribunal than an honest confusion.

  ---

  ## Part 2: The Cost Ledger

  *Every charitable reading costs something in our background theory about how the world works. You must write this down. This is not for the witness statement; it is for the legal team's internal file.*

  **Contradiction:** [Brief description]
  **Variable Adjusted:** [Lexicon / Belief / Logic]
  **Cost to Background Theory:** [What assumption about the state/police/world are we bending to make this fit?]
  **Residue?** [Yes/No]

  ---

  ## Part 3: Case Applications

  ### Case 1: The Time Discrepancy
  **Scenario:** Witness insists police raid happened "in the deep night." Police logs and electricity grid records show the raid occurred at 05:30 (dawn). Witness is otherwise consistent and credible.

  **IIC Application:**
  1.  **Anchor:** External documents (Police logs) are fixed (Rule 5).
  2.  **Variable Selection:**
      *   *Lexicon?* Does "Night" mean "Dark"? At 05:30, it may still be dark. Plausible.
      *   *Belief?* Was the witness mistaken? Plausible due to trauma/sleep.
      *   *Logic?* No logical inference to fix.
  3.  **Hierarchy:** False Belief is cheaper than Lexical Revision (Rule 3). Trauma distorts time perception.
  4.  **Decision:** Attribute **False Belief**. Record the witness's account as "night" (to preserve their voice) but annotate the time.
  5.  **Cost Ledger:**
      *   *Variable:* Belief.
      *   *Cost:* We assume the witness's perceptual reliability regarding time is compromised by stress. We do not assume the police logs are falsified.
      *   *Residue:* No.

  ### Case 2: The Kinship Contradiction
  **Scenario:** A woman refers to a man as her "Brother." Later she says, "My brother's father is my uncle." Later she says, "My brother and I share the same mother." In her culture/language, the term translated as "Brother" covers male cousins. If taken literally, the statements are logically inconsistent (cannot share mother if father is uncle).

  **IIC Application:**
  1.  **Anchor:** Biological impossibility (cannot share mother if fathers are brothers) is fixed.
  2.  **Variable Selection:**
      *   *Belief?* Is she mistaken about her own family? Unlikely.
      *   *Logic?* Is she reasoning badly? No.
      *   *Lexicon?* The word "Brother" is the variable.
  3.  **Hierarchy:** Lexical Revision is Medium Cost, but False Belief about parentage is High Cost (implies confusion about identity).
  4.  **Decision:** Attribute **Lexical Revision**. The interpreter must verify the indigenous kinship term.
  5.  **Cost Ledger:**
      *   *Variable:* Lexicon.
      *   *Cost:* We assume the translation layer is imperfect. We must append a glossary note to the transcript defining "Brother" as "Male Cousin/Clan Brother."
      *   *Residue:* No.

  ### Case 3: The Impossible Mechanism (Genuine Incomprehension)
  **Scenario:** Witness describes a torture device that lawyers want to use as evidence of a specific unit's involvement. The witness describes the device as "a box that shocks you when you think about escaping." Lawyers want a clean statement: "They used the shock box." Your background theory says this technology does not exist. The witness insists on the mental trigger mechanism.

  **IIC Application:**
  1.  **Anchor:** Background theory on technology (verified by experts) says "mind-reading shock boxes" do not exist.
  2.  **Variable Selection:**
      *   *Belief?* Attributing a false belief here implies the witness is delusional or lying about the mechanism.
      *   *Lexicon?* Can "think about escaping" mean something physical (e.g., stepping on a pressure plate)? Witness insists on "thought."
      *   *Logic?* To make this work, we must assume the witness infers causation magically. This is Broken Inference.
  3.  **Hierarchy:** Broken Inference is Prohibited (Rule 3). False Belief is possible, but this belief is so detached from reality it threatens the "Presumption of Coherence" (Rule 1).
  4.  **Decision:** **Residue.** You cannot fix this without calling the witness irrational or lying.
  5.  **Cost Ledger:**
      *   *Variable:* None.
      *   *Cost:* None. We preserve the witness's rationality by admitting we do not understand the event.
      *   *Residue:* **YES.** Mark as: *[Witness describes mechanism inconsistent with known technology. Interpretation suspended.]*
  6.  **Conflict with Lawyers:** The lawyers want a "clean inconsistency" (e.g., "The witness is lying about the box, so the whole story is fake" OR "The witness is telling the truth, so this tech exists"). The IIC forbids both. It forces the lawyers to deal with ambiguity. You must tell them: *"A charitable reading renders this unintelligible, not false. Use it at your own risk."*

  ---

  ## Part 4: Limitations & The Human Decision

  This procedure cannot solve the following. When you hit these walls, the philosophy ends, and you must decide as a human being.

  **1. The "Too Expensive" Charity**
  Sometimes, making the witness coherent requires bending your background theory so far it breaks.
  *   *Example:* To believe the witness, you must assume the entire local police force is impersonated by actors every night.
  *   *Decision:* The Cost Ledger will show the cost is "Total collapse of background theory." At this point, you must mark **Residue**. Do not save the witness by destroying reality.

  **2. The Ethical vs. Legal Conflict**
  Davidsonian charity prioritizes making the speaker intelligible. Legal strategy prioritizes winning the case.
  *   *Conflict:* A "Residue" mark might hurt the asylum claim. A "False Belief" annotation might give prosecutors ammunition.
  *   *Decision:* You are the documentation team, not the litigators. Your duty is to the *record*. If you smooth over a contradiction to help the lawyer, you violate the IIC. If you flag a residue that hurts the case, you have still done your job. You must document the tension in the Cost Ledger and let the legal director decide admissibility.

  **3. The Interpreter Variable**
  Radical interpretation assumes direct access to the speaker. You work through interpreters.
  *   *Limitation:* Sometimes the contradiction is in the translation, not the witness.
  *   *Decision:* If the IIC points to "Lexical Revision," you must re-interview. If you cannot re-interview, you must mark the contradiction as **Interpreter Uncertainty** in the Cost Ledger. Do not guess.

  **4. The Final Judgment**
  The IIC prevents *unconscious* bias. It does not remove the need for judgment. When the Cost Ledger shows two options with equal cost (e.g., "False Belief" vs. "Lexical Error" are equally plausible), you must choose.
  *   *Guideline:* Choose the option that preserves the witness's **agency**. Prefer "They misunderstood the event" (False Belief) over "They used the wrong word" (Lexical), unless the lexical error is culturally verified. A mistake in observation is more human than a mistake in language.

  **Final Instruction:**
  If you finish the checklist and feel uneasy, trust the unease. Mark it as **Residue**. A tribunal can handle a gap in the evidence; they cannot handle a fabricated coherence.
