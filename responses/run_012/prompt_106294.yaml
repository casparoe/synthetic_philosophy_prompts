answer: |-
  Here is the quiz draft, followed by the analysis you requested on the limitations and empty spaces in the design.

  ### The Quiz: How Do You Handle Success?

  **Instructions:** Read each scenario and pick the answer that feels most like your genuine gut reaction. Keep track of the **icon** next to your choice. At the end, count which icon you picked most often.

  **1. Your younger sibling lands a job paying double your salary.**
  *   A. You feel a sting, but you know they worked harder for it. You celebrate them. 🏆
  *   B. You worry they'll change or think they're better than the family now. You keep the talk low-key. 📉
  *   C. You feel happy for them, but you think it's mostly timing and connections. You ask if they can help you out. 🤝
  *   D. You don't really care about salary comparisons. It's just noise. 🤷

  **2. A friend posts a smug, long announcement about their book deal.**
  *   A. You think it's tacky. Success is fine, but flaunting it makes people uncomfortable. 📉
  *   B. You think people who hate the post are just jealous. They should post whatever they want. 🛡️
  *   C. You roll your eyes. The publishing industry is nepotism anyway. 🏗️
  *   D. You congratulate them. They set a goal and hit it. 🏆

  **3. A coworker who you know coasts gets promoted over you.**
  *   A. You assume the boss is incompetent or the system is rigged. 🏗️
  *   B. You assume there are skills they have that you don't value yet. 👑
  *   C. You feel angry that effort didn't matter. 🏆
  *   D. You figure promotions are a lottery. You just hope you get the next one. 🤝

  **4. Your kid wins a national prize. Do you put the trophy where guests will see it?**
  *   A. Yes, prominently. Excellence should be honored. 👑
  *   B. Yes, because they earned it and should be proud. 🏆
  *   C. No, it makes the other kids in the neighborhood feel bad. 📉
  *   D. Sure, whatever they want. It doesn't change who we are. 🤷

  **5. A guy in town builds a huge, flashy house on the hill.**
  *   A. It ruins the view and sets a bad standard for the community. 📉
  *   B. Good for him. I hope he hosts great parties. 🤝
  *   C. It shows he's at the top of the food chain. Respect. 👑
  *   D. I don't look at houses. 🤷

  **6. A former classmate born rich runs a charity and gets praised for it.**
  *   A. It's good, but they're just laundering their reputation with unearned money. 🏗️
  *   B. They are using their position for good. That is what nobility looks like. 👑
  *   C. They should be praised for the work, regardless of where the money came from. 🏆
  *   D. It's nice, but they should be paying higher taxes instead. 🤝

  **7. Your neighbor's startup sells and they retire at 35.**
  *   A. They got lucky on the market timing. 🤝
  *   B. They saw an opportunity others missed. That's genius. 👑
  *   C. I hope they don't start acting like they're too good for the block. 📉
  *   D. I hope they don't expect me to treat them differently. 🤷

  **8. You do something genuinely impressive. Do you bring it up at dinner?**
  *   A. Only if asked. Bringing it up yourself seems desperate. 📉
  *   B. Yes. If you don't speak up, people won't know your value. 🛡️
  *   C. Yes. You earned the right to talk about it. 🏆
  *   D. No. My success is private; my company is public. 🤷

  **9. Someone you love is struggling financially while you're doing great.**
  *   A. You hide your success so you don't rub it in. 📉
  *   B. You offer financial help quietly. 🤝
  *   C. You show them your path to inspire them. 🛡️
  *   D. You acknowledge the gap but don't apologize for it. 🏆

  **10. You come into a sudden windfall of cash.**
  *   A. You save it. It's yours. 🏆
  *   B. You share it with friends and family immediately. 🤝
  *   C. You worry people will only like you for the money. 📉
  *   D. You donate a large chunk to fix the system that made you lucky. 🏗️

  ***

  ### Scoring Key

  Count up your icons. Read the description below that matches your highest count.

  **Mostly 🏆: The Meritocrat**
  You believe success is the result of effort and talent. It should be celebrated openly because it proves that hard work pays out. You feel no guilt about winning, provided you played by the rules.

  **Mostly 📉: The Leveler**
  You believe standing out threatens the group. Success isn't the problem; *showing off* is. You value harmony over achievement and think people should "remember where they came from."

  **Mostly 🛡️: The Poppy-Defender**
  You believe the real sin isn't boasting, it's envy. You think successful people are unfairly policed by the small-minded. Your focus is on protecting the winner from the resentment of the losers.

  **Mostly 🤝: The Luck-Sharer**
  You believe success is largely chance. You celebrate the person, but you don't worship the win. You feel a moral obligation to redistribute the winnings because the next person in line might not be as lucky.

  **Mostly 👑: The Aristocrat**
  You believe excellence is rare and natural. Hierarchy is a fact of life. The best people deserve honor and distinct treatment, and the rest should recognize their betters without resentment.

  **Mostly 🏗️: The System-Skeptic**
  You believe success is usually a sign of a rigged game. You don't celebrate individual wins because you see them as zero-sum extraction. The focus should be on fixing the structure, not praising the player.

  **Mostly 🤷: The Bystander**
  You are indifferent to status games. You don't resent success, but you don't worship it either. It's just data. You value privacy and stability over recognition or redistribution.

  ***

  ### Analysis: The Two Things You Asked For

  #### 1. Two results this quiz cannot distinguish
  **The Meritocrat (🏆)** and **The Poppy-Defender (🛡️)** will often score identically on this quiz.
  *   **Why:** Both archetypes advocate for the same behavior: *Celebrate success openly.* In nine out of ten social scenarios, their actions look exactly the same. They both tell the friend to post the book deal, and they both put the trophy in the front hall.
  *   **The Difference:** The Meritocrat justifies it based on the *past* (effort was expended, therefore reward is due). The Poppy-Defender justifies it based on the *future* (others' envy is toxic, therefore we must normalize boasting).
  *   **The Extra Case:** To separate them, you need a question about **failure**.
      *   *Scenario:* "You try hard and fail publicly."
      *   *Meritocrat Answer:* "I didn't work smart enough. I need to improve." (Internal locus).
      *   *Poppy-Defender Answer:* "The critics are threatened by my ambition." (External locus).
      *   Adding a question about how they process their own *losses* would split these two groups.

  #### 2. Which answer combinations are "empty"
  **The Aristocrat (👑) + The System-Skeptic (🏗️)**
  *   **The Combination:** A reader who selects mostly 👑 and mostly 🏗️.
  *   **Why it's empty:** This combination is **logically incoherent**.
      *   The Aristocrat believes hierarchy is natural and that the "best" people *should* be at the top. They view excellence as a virtue that justifies inequality.
      *   The System-Skeptic believes hierarchy is artificial and that the people at the top are usually there because of exploitation or rigging. They view inequality as a vice.
      *   You cannot consistently believe that the rich are there because they are *naturally superior* (Aristocrat) AND that the rich are there because the *game is rigged* (Skeptic).
  *   **Why it happens:** A reader might pick these answers if they are cynical about *other people's* success (Skeptic) but confident in their *own* superiority (Aristocrat). However, as a coherent political or social philosophy, this seat is unoccupied. It's not "ugly," it's just a contradiction that collapses under scrutiny.
