      *   *Correction:* If I tell them to drop V5, I'm advocating for standard Compatibilism (Fischer-style). If I tell them to drop V1-V4, I'm advocating for Incompatibilism (Sourcehood).
      *   *User's Hint:* "My own tentative thought is that what's doing the work isn't whether I could have done otherwise but whether the actual sequence ran through my own reasons." -> This is John Martin Fischer's *Guidance Control*.
      *   *The Problem with V5:* Fischer argues that in manipulation cases, if the agent is reasons-responsive *now*, they *are* responsible. The user's V5 intuition contradicts Fischer.
