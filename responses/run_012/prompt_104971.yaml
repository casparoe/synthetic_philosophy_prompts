      *   *Decision:* I need to press them on V5. If they hold the Actual Sequence view (supported by V1-V4), V5 is the outlier. If they hold the Sourcehood view (supported by V5), V1-V4 are the outliers. Given their explicit statement ("what's doing the work... is whether the actual sequence ran through my own reasons"), they are committed to Actual Sequence. Therefore, **V5 must go.**
