prompt: |-
  Ok so I'm a software engineer, never taken a philosophy class, but my roommate is a grad student and we've been arguing for like three weeks about the causal exclusion argument and mental causation, and I'm pretty sure we're talking past each other. I want to write the document we should have written instead of arguing.

  Heres the setup. There's a guy (me, in this case) who thinks mental stuff — my intention to pick up the cup, my belief that its raining — is real, is not just the same thing as the neurons firing, and still actually causes my hand to move. And then the other side (her) says: fine, but if the mental property is distinct from the physical property, and the physical property already does all the causal work, then the mental one gets squeezed out and does nothing. So either the mental just is the physical (identity), or its causally idle (epiphenomenalism). You know the argument, I don't need you to explain it to me.

  What I want: the joint statement that both of us could actually sign. Something like an adversarial collaboration writeup. Two camps: the non-reductivist who thinks the exclusion argument has a flaw and that mental properties have causal powers without being identical to physical ones, and the reductivist who thinks the argument is basically sound so the mental must be identified with (or at least be nothing over and above) the physical. Write it so neither of us would look at it and say "no, thats a strawman of my view."

  Structure I want:

  1. a numbered list of claims BOTH sides can sign off on (about supervenience, about what causation is, about what would count as a mental property doing work, whatever else belongs)
  2. the actual points of disagreement, each written in wording that the side holding it would accept — no stacking the deck
  3. the cruxes: the sub-questions where, if one got settled, at least one of us would have to move. I suspect some of them are: does causation require a difference-maker at one privileged level; is overdetermination really that bad; is grounding a relation that can carry causal oomph or not; does multiple realizability even matter here.
  4. for each crux, a case or argument that BOTH sides agree bears on it, plus each side's prediction about how it comes out. Written down in advance, no weaseling.

  Two things I want in there so it doesn't just turn into a wikipedia summary of the debate:

  (a) Do it concretely, on a made up but specific case, not in the abstract. Say we build an implant that changes what someone decides by stimulating a broad, distributed pattern of activity — it can't usefully target any single neuron, only the pattern — and the person's stated intention and their behavior both change. What causes what, according to each side? And what does each side predict would happen if instead we could poke exactly one neuron at a time and leave everything else fixed?

  (b) Make each side say what their view implies for a trained neural network — where there's no neurons, just weights, and we talk about the model "representing" a concept and that representation mattering to the output. Same puzzle, different substrate. If one side's view handles the brain but gets weird about the network (or the reverse), I want that on the record.

  Also, at the end, tell me which parts of our disagreement are just verbal — like if "cause" or "level" or "real" is doing different jobs for each of us — and which parts are genuinely substantive. And flag any agreed claim that sounds nice but actually does no work, if you find one.

  Don't bother with citations or reading lists, I won't be able to check them and I don't need them. Just write the thing.
