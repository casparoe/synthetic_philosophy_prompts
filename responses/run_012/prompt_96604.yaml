prompt: |-
  I've just spent two hours on the phone with my mate Dev arguing about superrationality — the Hofstadter thing, where in a one-shot prisoners dilemma you cooperate because the other player is in the same situation as you and so has to reach the same answer as you — and I want a case built to order to settle it. Dev's line is that superrationality is evidential decision theory in a trenchcoat: he says the two players are only "the same" because they're running the same program, a shared program is just a common cause, and common causes are exactly what EDT feeds on, so superrationality adds nothing on top. I dont buy it, but every time I tried to say why I ended up just asserting the symmetry clause louder, so I'd rather have a clean case than another round of shouting.

  Here's the shape I want. One scenario, in two versions. Two ordinary people, one-shot decision, no talking it over at decision time, no repeat play, no reputations, no predictor, no clones, no brain-in-a-vat stuff — give me something domestic, two housemates or two people on the same shift who each have to decide the same thing at the same moment. Version one: they're "the same" in a way that actually gives EDT a causal handle on the other person's choice — they both signed onto the same rule beforehand, or both got handed the same instruction, something where my picking the cooperative option genuinely raises the odds that they pick it too. Version two: identical payoff matrix, same kind of person, but the sameness is pure resemblance, nothing linking the two choices except that they're both facing the same game. Then lay out the verdicts for each version — superrationality, EDT, and causal decision theory as the control — with the reasoning for each, and tell me which single feature is doing the work and what happens if I toggle it: does version two turn into version one, or do the theories end up agreeing again for some other reason entirely? If the real disagreement in version two is just about what counts as "the same situation" and not between the theories at all, say that straight out instead of dressing it up as a clean case, I'd definately rather know that. Then tell me how Dev attacks version one and how I attack version two, if I'm the one who's fooling himself.

  And while you're in there: does any of this survive if their stakes aren't the same — one of them cares twice as much about how it comes out? My instinct is that's where superrationality quietly runs out of road, but if the case just breaks there, tell me it breaks rather than patching it. 800 words max, and lead with the verdicts, dont make me read to the bottom to find out which theory said what.
