answer: |-
  ### Exam Question (20 Marks)

  **Question 4: The Machine Urn**

  Consider the standard Ellsberg setup: An urn contains 90 balls. 30 are Red. The remaining 60 are Black or Yellow in an unknown proportion. You are offered a bet that pays $100 if a drawn ball matches a specified colour. Most agents prefer betting on Red over Black, and prefer betting on (Black or Yellow) over (Red or Yellow).

  Now, consider a **Machine Urn**. This urn contains 100 balls, each either Black or White. The composition was determined by a fair coin toss known to you:
  *   **Heads:** The urn contains 30 Black balls and 70 White balls.
  *   **Tails:** The urn contains 70 Black balls and 30 White balls.
  The coin has been tossed, the urn filled, but you are not told the outcome.

  You are offered two distinct bets:
  *   **Bet A:** Draw from the Machine Urn. Win $100 if the ball is Black.
  *   **Bet B:** Draw from a Plain Urn known to contain exactly 50 Black balls and 50 White balls. Win $100 if the ball is Black.

  Suppose an agent strictly prefers Bet B over Bet A.

  1.  Calculate the objective first-order probability of winning Bet A. (2 marks)
  2.  Explain why a standard Expected Utility theorist, who accepts the **Reduction of Compound Lotteries**, must view this preference as an error. (6 marks)
  3.  Explain how a theorist who models **ambiguity aversion** using a *second-order probability distribution* (sensitivity to the variance of probabilities) can rationalise this preference without mathematical inconsistency. (6 marks)
  4.  Explain how a theorist who models ambiguity using a *set of priors* (focusing on the worst-case scenario) rationalises this preference. (4 marks)
  5.  Conclude: Is the preference irrational? Defend your answer by referencing the disagreement between these theoretical frameworks. (2 marks)

  ***

  ### Model Answer

  **1. Probability Calculation**
  The probability of winning Bet A is the weighted average of the two possible compositions. Since the coin is fair (probability 0.5), the calculation is $(0.5 \times 0.3) + (0.5 \times 0.7) = 0.5$. The probability of winning Bet B is known to be 0.5. Mathematically, the first-order likelihood of winning is identical in both cases.

  **2. The Expected Utility View (Reduction of Compound Lotteries)**
  For a standard Expected Utility (EU) theorist, the preference for Bet B over Bet A is a normative error. This rests on the axiom of **Reduction of Compound Lotteries**. This axiom states that a multi-stage lottery (like the Machine Urn, where a coin determines the urn composition, then a ball is drawn) should be evaluated identically to its reduced, single-stage equivalent. Since the reduced form of the Machine Urn is mathematically indistinguishable from the Plain Urn (both are 50/50 risks), an EU maximiser must be indifferent between them. Preferring the Plain Urn implies the agent is treating the *process* of uncertainty generation as relevant, not just the final distribution of outcomes. In the EU framework, this violates coherence; if you accept the axioms, you must reduce the compound lottery. To prefer B is to behave as if $0.5 \neq 0.5$, which is incoherent under this specific definition of rationality.

  **3. The Second-Order View (Smooth Ambiguity)**
  However, this preference is not a mathematical inconsistency if we reject Reduction and adopt a model that distinguishes between *risk* (known probabilities) and *ambiguity* (uncertainty about probabilities). In the Machine Urn, while the average probability is 0.5, there is a **second-order distribution**: a 50% chance the true probability is 0.3 and a 50% chance it is 0.7. In the Plain Urn, the probability is fixed at 0.5 with zero variance.
  A "smooth ambiguity" model allows the agent to have a utility function over these second-order probabilities. If the agent is averse to ambiguity, they dislike the *variance* in the probability estimate. They evaluate the Machine Urn not by the average probability, but by the average *utility* of the probabilities. If their attitude toward ambiguity is concave (similar to risk aversion), the spread between 0.3 and 0.7 yields lower utility than the certainty of 0.5, even if the mean is the same. Here, the preference for Bet B is rationalised as a coherent preference for stability in the probability measure itself. It is not a calculation error; it is a different input into the utility function.

  **4. The Set of Priors View (MaxMin)**
  Alternatively, a theorist using a **set of priors** (often associated with MaxMin Expected Utility) does not use a second-order probability at all. Instead, they look at the set of possible probabilities consistent with the information. For the Machine Urn, the set of possible probabilities for Black is $\{0.3, 0.7\}$. For the Plain Urn, the set is $\{0.5\}$.
  An ambiguity-averse agent in this framework evaluates a bet by looking at the **worst-case prior** in the set. For the Machine Urn, the worst-case probability of winning is 0.3. For the Plain Urn, the worst-case is 0.5. Since $0.5 > 0.3$, the agent strictly prefers Bet B. This model rationalises the preference without needing a second-order distribution; it simply treats the unknown composition as a range of possibilities and evaluates based on the minimum guarantee.

  **5. Normative Conclusion**
  Is the preference irrational? There is no consensus. If one holds that **Reduction of Compound Lotteries** is a necessary condition for rationality (as standard EU does), then the preference is a mistake. However, if one holds that the *source* of uncertainty matters—that knowing the composition is fundamentally different from knowing a process that generates composition—then the preference is rational. The disagreement turns on whether rationality requires reducing all uncertainty to a single probability distribution, or whether sensitivity to the structure of information (the difference between risk and ambiguity) is itself a rational requirement. Both positions are internally consistent; they simply start from different axioms regarding what information agents are permitted to care about.

  ***

  ### Marking Scheme (20 Marks Total)

  **1. Correct Probability Calculation (2 Marks)**
  *   **Award:** 2 marks for correctly identifying the probability of Bet A is 0.5 (showing the working: $0.5 \times 0.3 + 0.5 \times 0.7$).
  *   **Common Error:** Calculating the probability as 0.3 or 0.7 based on one coin outcome, or failing to weight by the coin flip.

  **2. Reduction of Compound Lotteries / EU Coherence (6 Marks)**
  *   **Award:** 3 marks for defining Reduction (multi-stage = single-stage equivalent). 3 marks for explaining that under EU, identical reduced forms *must* yield indifference, so preference implies incoherence/error.
  *   **Common Error:** Claiming EU forbids ambiguity aversion generally, without linking it specifically to the *Reduction* axiom and the mathematical identity of the two urns.

  **3. Second-Order Variance / Smooth Ambiguity (6 Marks)**
  *   **Award:** 3 marks for identifying the Machine Urn has variance in probability (0.3 vs 0.7) while Plain does not. 3 marks for explaining that utility is applied to the probabilities (concavity/aversion to spread), making the fixed 0.5 more valuable than the average of 0.3/0.7.
  *   **Common Error:** Saying "they don't know the probability" without explaining why the *known* 50/50 coin flip doesn't solve the problem (i.e., failing to distinguish second-order uncertainty from first-order risk).

  **4. Set of Priors / Worst-Case (4 Marks)**
  *   **Award:** 2 marks for identifying the set of priors ({0.3, 0.7} vs {0.5}). 2 marks for explaining the MaxMin rule (evaluating based on the lowest probability in the set).
  *   **Common Error:** Confusing this with the second-order model; suggesting the agent averages the priors but applies a discount, rather than taking the minimum.

  **5. Normative Conclusion / Theoretical Disagreement (2 Marks)**
  *   **Award:** 1 mark for stating there is no settled answer. 1 mark for identifying the core disagreement (Reduction axiom vs. sensitivity to information structure).
  *   **Common Error:** Declaring definitively that the preference is "irrational" or "rational" without acknowledging that this depends on which axiomatic framework is adopted.
