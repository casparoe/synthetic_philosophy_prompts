answer: |-
  1. **Degrees of Worth**
  Let's start with the scale. On your view, is moral worth an on-off switch, or can you have a little bit of it? If it comes in degrees, are we measuring degrees of *goodness*, or just degrees of *dependence* on the right concern?

  2. **Follow-up (Degrees)**
  *Likely answer: "Degrees of dependence."*
  If the dependence is flimsy—say, the concern only barely tipped the scales—do you really want to call that moral worth? Or is it just a neutral fact about his psychology?

  3. **The Audience Problem**
  Consider the person who is genuinely generous, but only when an audience is watching. The concern for others is real, and it is load-bearing, but it's conditional on being seen. Does your test count that as moral worth?

  4. **Follow-up (Audience)**
  *Likely answer: "No, because the concern isn't robust enough."*
  But if you rule that out because the concern is too fragile, aren't you smuggling in a requirement about the *quality* of the motive, rather than just its causal role?

  5. **The Climber (Counterfactual Mechanics)**
  Take the climber who lets go of the rope because the thought of his partner's safety unnerves him. The concern for safety caused the fall, satisfying your counterfactual test, but the causal path is a mess. Does your view distinguish this from someone acting on that concern properly?

  6. **Follow-up (Counterfactuals)**
  *Likely answer: "We hold the relevant psychology fixed."*
  But in a human mind, removing one concern reshuffles the whole deck. If we can't verify that counterfactual psychologically, isn't moral worth effectively unknowable on your view?

  7. **Huck Finn**
  Now take Huck Finn. He helps Jim while believing he's damning himself. His sympathy is load-bearing; his conscience is dead against it. He does the right thing, but his moral theory is wrong. Do you award him moral worth?

  8. **Mistaken Duty**
  Invert that case. A soldier commits atrocities out of a sincere, load-bearing devotion to "protecting his people." He has the causal structure you want, but the object is vile. Can he have moral worth?

  9. **Follow-up (Mistaken Duty)**
  *Likely answer: "No, he lacks the *morally relevant* feature."*
  So worth doesn't just track the agent's psychology; it depends on external moral truth. If so, why isn't the *act* doing the work, rather than the concern?

  10. **Falsification**
  One last thing. We often say views are "work in progress." But be specific: what single case or piece of evidence would actually make you drop this view entirely?
