answer: |-
  The practice presupposes a rights-based theory of coercion and a procedural waiver conception of consent, treating plea agreements as valid exercises of autonomy so long as the state acts within its entitlements and the defendant possesses minimal capacity to understand the consequences, regardless of factual guilt or subjective pressure.

  To unpack this, we must first consider how the practice defines coercion. One could read plea bargaining through a "pressure-based" theory, where any offer that leaves the defendant no reasonable alternative is coercive; under this view, the trial penalty would invalidate consent because fifteen years is too high a price to pay for exercising a right. However, the practice explicitly rejects this. It operates on a "rights-based" or "baseline" theory of coercion (akin to Nozick's formulation), where a proposal is coercive only if it proposes to make the recipient worse off relative to a moral baseline that the proposer has no right to enforce. By treating the prosecutor's threat of a maximum sentence as lawful, the practice presupposes that the prosecutor has a right to seek that penalty upon conviction at trial. Therefore, offering to waive that right in exchange for a plea is an offer, not a threat, because the baseline (the maximum sentence) is within the state's entitlement. This quietly rules out rival views that define coercion by the severity of the pressure or the vulnerability of the subject, such as a "totality of circumstances" test applied consistently across contexts.

  This rights-based framework explains the tension between plea bargains and police confessions, though it exposes a fracture in the system's logic. For a confession to be voluntary, courts often apply a stricter standard that looks at the "totality of circumstances," including custody, isolation, and psychological pressure. The practice presupposes a distinction between the investigative phase and the adjudicative phase: once counsel is involved and a judge is present, the coercive pressure of the trial penalty is deemed "neutralized" by procedural safeguards. However, philosophically, the practice cannot supply a coherent theory of coercion that distinguishes the two based solely on the threat itself, because the threat (maximum sentence vs. freedom) is identical. The practice relies on the *context* of the threat (courtroom vs. interrogation room) to change its moral valence, presupposing that the presence of counsel and a judge transforms a coercive pressure into a lawful bargain. This is underdetermined: a consistent rights-based theory would say either both are coercive or neither is, but the practice splits them based on institutional setting rather than the nature of the consent.

  Regarding understanding and competence, the practice presupposes a "contractual" model of consent rather than an "epistemic" one. You do not need to understand the law or the strength of the case; you only need to understand the direct consequences of the agreement (the charge and the penalty). This presupposes that consent in criminal law is not about acknowledging truth, but about allocating risk. The defendant is treated as a rational actor managing liability, not a moral agent confessing sin. Consequently, the competence bar is low because the task is not to understand justice, but to understand the terms of a settlement. This rules out theories of consent that require "substantive understanding" or "authentic endorsement" of the outcome. If consent required believing you were guilty, the practice would collapse; instead, it requires only that you believe pleading is the best available option.

  The acceptance of *Alford* pleas (pleading guilty while maintaining innocence) clarifies that the practice treats consent as a waiver of rights, not an endorsement of facts. By allowing a defendant to say "I didn't do it, but I concede you can prove I did," the system decouples the plea from factual guilt. This presupposes that the function of the plea is to waive the procedural rights associated with a trial (confrontation, jury, proof beyond reasonable doubt), not to establish moral culpability. If consent were an endorsement of the state's action, an *Alford* plea would be a contradiction; since it is accepted, consent must be defined procedurally as the relinquishment of the right to contest, regardless of the defendant's internal state of belief.

  Finally, regarding underdetermination, multiple theories of consent license this practice. A utilitarian theory fits well, viewing pleas as efficient resource allocation that maximizes social welfare by avoiding trial costs. A negative liberty theory also fits, viewing pleas as freedom of contract between the state and the individual. However, a retributive theory of justice struggles to fit, as it requires punishment to be predicated on actual guilt, which *Alford* pleas and risk-based bargaining sideline. Similarly, a robust autonomy theory requiring authentic self-governance cannot easily accommodate the high pressure of trial penalties. The practice is strictly compatible with any theory that prioritizes finality and procedural waiver over truth-seeking or substantive voluntariness, leaving the moral justification of the coercion gap between confessions and pleas theoretically unresolved but institutionally managed.
