      *   *Correction:* Retained Earnings accumulates value. Entropy accumulates *unavailability*. Better to compare Entropy to "Unrealized Losses" or "Friction Costs" that must be recognized eventually.
      *   *Wait, let's look at the "Identity" question again.* In accounting, $A=L+E$ is always true. In thermodynamics, $\Delta S \ge 0$ is statistically true. But with Landauer, $\Delta S_{total} = \Delta S_{sys} + \Delta S_{info} \ge 0$. If we define the ledger to include the info column, it becomes an identity. This is a crucial distinction for an accountant.
