      *   **Goal:** Provide a precise, nuanced explanation suitable for a high school philosophy club (accessible but rigorous).

  2.  **Deconstruct the Input Text (Sentence by Sentence Analysis):**

      *   *Sentence 1:* "Scanlon's contractualism holds that an act is wrong if it is disallowed by principles that no one could reasonably reject."
