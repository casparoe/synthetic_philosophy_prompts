          5.  Conclusion (Does the article refute contractualism?).

      *   *Refining the "Blindness vs. Headaches" point:* I need to be careful here. In *What We Owe to Each Other*, Scanlon actually struggles with this. He initially leans towards saving the blind person. Later, he introduces the "Relevance View." A careful contractualist today would likely say: "The headache sufferers *do* have a collective objection that makes the principle reasonably rejectable," without summing utility. They would argue that a principle ignoring 10 million people fails the test of mutual recognizability.
      *   *Refining the "Collapse into Utilitarianism" point:* This is crucial. Utilitarianism justifies saving the 10 million *because* the total utility is higher. Contractualism (if it saves the 10 million) justifies it because *no single principle can be reasonably rejected* given the scale of exclusion. The *reason* matters, not just the result.

  5.  **Final Review against constraints:**
