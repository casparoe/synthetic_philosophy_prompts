  6.  **Review against Constraints:**
      *   *Who's right at each step?* Need to be decisive.
      *   *Missed points?* Mention Team Reasoning (Hollis/Bacharach) and Functional Decision Theory (Yudkowsky/Soares).
      *   *Crux?* Definition of rationality (Causal vs. Evidential/Logical).
