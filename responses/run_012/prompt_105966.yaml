answer: |-
  # Research Proposal: The Evidential Dissolution of Pascal's Mugging

  **Project Title:** The Speech Act as Negative Evidence: An Evidential Constraint on Expected Utility in Pascal's Mugging Scenarios

  **Student Name:** [Your Name]
  **Course:** [Course Name/Number]
  **Date:** [Date]
  **Word Count Target:** 5,000–6,000 words

  ---

  ## 1. Abstract

  Pascal's Mugging presents a paradox for orthodox Expected Utility Theory (EUT). It posits a scenario where an agent is confronted with a low-probability, high-stakes claim: a stranger threatens astronomical disutility unless a trivial cost is paid. Because the magnitude of the threatened disutility is unbounded, it can mathematically overwhelm any non-zero probability assignment, compelling a rational agent to pay. Standard resolutions to this paradox typically involve modifying the decision-theoretic arithmetic: capping utility functions, imposing probability floors, or adopting risk-weighted decision rules. This proposal argues that these solutions address the symptom rather than the cause. The core problem lies not in the calculation, but in the epistemic inputs fed into the calculation.

  This project proposes an "Evidential Fix." It hypothesizes that the act of making the offer itself constitutes strong negative evidence regarding the truth of the claim. A being capable of delivering astronomical consequences would not need to solicit trivial resources through a crude speech act. Therefore, the likelihood ratio of the offer given the truth of the claim versus the offer given the falsity of the claim drives the posterior probability down sufficiently to negate the expected value, without requiring ad hoc constraints on utility or probability. This paper will formalize this intuition using Bayesian epistemology, stress-test it against variants of the Mugging (multiple muggers, escalating threats, and credible signaling), and evaluate whether this evidential constraint dissolves the paradox or merely relocates it. The project aims to determine if the Mugging is a failure of decision theory or a failure of epistemic modeling.

  ---

  ## 2. Introduction and Problem Statement

  ### 2.1 The Paradox of Unbounded Expectations

  Decision theory, in its standard formulation, instructs rational agents to maximize expected utility. This is calculated by summing the products of the probability of each outcome and the utility value of that outcome. For most practical decisions, this yields intuitive results. However, when the domain of possible outcomes includes unbounded utilities—specifically, outcomes involving astronomical numbers of lives or units of value—the mathematics of expectation can diverge from rational intuition. This divergence is crystallized in the thought experiment known as "Pascal's Mugging."

  In the canonical formulation, an agent is approached by a stranger who claims to be a being of immense power. The stranger asserts that unless the agent hands over a trivial sum (e.g., five dollars), the stranger will use their power to torture or kill an astronomical number of people (e.g., $3 \uparrow\uparrow\uparrow 3$). The agent assesses the probability of this claim being true as vanishingly small. However, because the disutility of the threatened outcome is so vast, the product of the probability and the utility remains high. If the agent assigns any non-zero probability to the claim, and if the threatened disutility is sufficiently large, Expected Utility Theory dictates that the agent should pay the five dollars. To refuse is to be "money-pumped" by logic itself.

  This conclusion is widely regarded as absurd. It implies that rational agents should be vulnerable to any extortion attempt, provided the extorter names a large enough number. It suggests that the mere mention of a high-stakes possibility creates a normative obligation to act, regardless of the credibility of the source. If EUT leads to this conclusion, EUT appears to be flawed, or at least incomplete.

  ### 2.2 The Orthodox Responses: Arithmetic Patches

  The philosophical literature has responded to Pascal's Mugging primarily by attempting to patch the arithmetic of the decision rule. These responses generally fall into three categories.

  The first category involves **utility boundedness**. This approach argues that utility functions cannot be unbounded. There is a maximum possible value or disutility that can be assigned to any outcome. If utility is capped, then no matter how low the probability, the expected value cannot exceed the cap. While mathematically effective, this solution is philosophically costly. It requires denying that saving a billion lives is significantly better than saving one life, or that certain forms of suffering are lexically worse than others. It forces a compression of moral value that conflicts with many ethical frameworks, particularly utilitarianism and long-termism.

  The second category involves **probability floors**. This approach suggests that agents should treat probabilities below a certain threshold as effectively zero for decision-making purposes. If the probability of the mugger's claim is below this cognitive floor, it is ignored. This avoids the absurd conclusion but introduces arbitrariness. Why is the floor at $10^{-100}$ and not $10^{-101}$? Furthermore, this creates a discontinuity in rationality where a minute change in evidence leads to a massive change in action, which violates the principle of continuity in rational choice.

  The third category involves **modifying the decision rule**. Risk-weighted expected utility or other non-linear decision frameworks attempt to discount low-probability, high-stakes outcomes disproportionately. While this captures the intuition that we should ignore "long shots," it often requires abandoning the axioms that make EUT attractive in the first place, such as independence or sure-thing principles.

  All three orthodox responses share a common weakness: they accept the epistemic setup of the Mugging as given. They assume that the agent *can* coherently assign a probability to the claim conditional on the offer, and they focus on limiting the impact of that assignment. They treat the Mugging as a problem of calculation, not a problem of evidence.

  ### 2.3 The Evidential Hypothesis

  This project proposes a fourth path, one that challenges the epistemic inputs rather than the decision-theoretic machinery. The "Evidential Hypothesis" posits that the standard formulation of Pascal's Mugging ignores a crucial piece of evidence: the fact that the offer is being made in this specific manner.

  In a rational evaluation of testimony, the content of the claim cannot be separated from the act of claiming. The probability that matters for decision theory is not the prior probability that a powerful being exists ($P(\text{Power})$), nor is it the probability that a powerful being exists given some background evidence ($P(\text{Power} | \text{Background})$). It is the posterior probability that the claim is true *given that this specific person has made this specific offer* ($P(\text{Power} | \text{Offer})$).

  The core intuition is that the nature of the offer is inversely correlated with the power of the offerer. A being truly capable of controlling astronomical stakes would not need to solicit five dollars from a pedestrian. They would not need to make a verbal threat; they could simply enact the consequence. They would not need to engage in a negotiation. The very fact that the agent is being *mugged*—that is, asked to trade a trivial resource under threat—is evidence that the agent is dealing with a bluff, a scam, or a delusion, rather than a genuine entity of power.

  If this intuition can be formalized, it suggests that the likelihood ratio $P(\text{Offer} | \text{Power}) / P(\text{Offer} | \text{Scam})$ is so heavily weighted toward "Scam" that the posterior probability $P(\text{Power} | \text{Offer})$ becomes vanishingly small—small enough that even multiplied by astronomical utility, the expected value remains negligible. This would dissolve the paradox without capping utility, without imposing probability floors, and without altering the axioms of Expected Utility Theory. It would show that the Mugging is not a counterexample to EUT, but a failure to properly update on the evidence of the speech act.

  ### 2.4 Research Motivation

  Why pursue this line of inquiry? First, it offers a more parsimonious solution. It preserves the standard machinery of decision theory and the unbounded nature of utility, which are desirable features for many ethical and economic models. Second, it has significant implications for fields that rely on low-probability, high-impact reasoning, such as AI safety and existential risk mitigation. If the Evidential Hypothesis holds, it suggests a robust heuristic for distinguishing between genuine existential threats and "Pascal's Muggings" in policy contexts. If it fails, it clarifies the boundary where epistemic uncertainty forces us to abandon standard decision theory.

  This paper will not merely assert this intuition. It will attempt to construct a formal Bayesian model of the interaction, define the likelihood functions involved, and test the model against stress cases designed to break the evidential link. The goal is to determine if the "Evidential Fix" is a robust philosophical solution or merely a restatement of the intuition that the mugger is lying.

  ---

  ## 3. The Research Question

  To ensure this project yields a determinate result within the semester timeframe, the research question must be precise. It is insufficient to ask "Is the Evidential Fix correct?" Instead, the inquiry will focus on the conditions under which the fix succeeds or fails.

  **Primary Research Question:**
  *Does modeling the mugging offer as a signaling event generate a posterior probability sufficiently low to negate the expected utility of compliance, without relying on ad hoc probability floors or utility caps?*

  **Secondary Questions:**
  1.  **The Credibility Threshold:** At what point does the mugger's ability to provide evidence (signaling) overcome the negative evidence of the request itself? Is there a coherent "Credible Mugging" scenario, or does the concept collapse?
  2.  **The Aggregation Problem:** Does the Evidential Fix hold when multiple independent muggers make compatible claims? Does the evidence compound against the agent, or does the multiplicity of offers further degrade the credibility of each?
  3.  **The Escalation Dynamic:** If the mugger escalates the threatened stakes in response to refusal, does the evidential penalty scale proportionally, or does the escalation itself serve as further evidence of a bluff?

  **Thesis Statement:**
  This paper will argue that the Evidential Fix successfully dissolves the canonical Pascal's Mugging scenario by demonstrating that the likelihood of the offer given the truth of the claim is asymptotically lower than the likelihood of the offer given a bluff. However, it will further argue that the fix is vulnerable to "Credible Signaling" variants where the cost of the signal correlates with power. Consequently, the Evidential Fix does not solve the general problem of unbounded expectations but restricts the domain of the Mugging Paradox to scenarios involving costless or cheap talk. This restriction is sufficient to protect standard decision theory in most real-world applications but leaves the theoretical vulnerability intact for hypothetical scenarios involving perfect signaling.

  ---

  ## 4. Critical Context: Why Existing Replies Are Insufficient

  To justify the Evidential Hypothesis, one must first demonstrate why the existing "arithmetic patches" are unsatisfactory. This section outlines the conceptual weaknesses of the orthodox responses that this project seeks to avoid. Note that this is a conceptual critique, not a bibliographic review.

  ### 4.1 The Problem with Utility Caps

  The most common response to Pascal's Mugging is to assert that utility functions must be bounded. If there is a maximum utility $U_{max}$, then no probability $P$, however small, can generate an expected value greater than $U_{max}$. If the cost of compliance is greater than the expected utility of avoidance, the agent refuses.

  The philosophical cost of this move is high. Bounded utility implies diminishing marginal value that eventually hits zero. This leads to counterintuitive results in other domains. For example, if utility is bounded, there exists a number of lives saved such that saving one more life adds zero expected utility. In ethical frameworks that value every individual equally, this is unacceptable. Furthermore, bounded utility makes agents vulnerable to "Pascal's Wager" style arguments in reverse: if the utility of salvation is capped, a sufficiently high probability of a modest reward might outweigh a tiny probability of infinite reward, which distorts religious or existential decision-making.

  More critically for this project, utility caps do not address the epistemic oddity of the Mugging. They simply legislate it away. They tell us *how* to decide, but not *why* the scenario feels irrational. They treat the mugger's claim as potentially valid but mathematically neutered. The Evidential Hypothesis, by contrast, argues the claim is epistemically invalid.

  ### 4.2 The Problem with Probability Floors

  A probability floor suggests that humans (or rational agents) cannot cognitively process or act upon probabilities below a certain threshold (e.g., $10^{-50}$). Anything below this is treated as zero.

  This approach suffers from the "Sorites" problem. If $10^{-50}$ is zero, is $10^{-49}$ non-zero? If the difference between the two is negligible, why does the decision change discontinuously? Rationality is generally expected to be continuous; small changes in evidence should lead to small changes in action. A probability floor introduces a cliff-edge where rationality breaks down.

  Moreover, probability floors are context-dependent. In lotteries, we treat $10^{-9}$ as non-zero (we buy tickets). In existential risk, we treat $10^{-9}$ as critical (we fund mitigation). A fixed floor cannot account for the variance in how we treat low probabilities across different domains. The Evidential Hypothesis offers a dynamic probability assignment based on the specific evidence of the offer, rather than a static cognitive limitation.

  ### 4.3 The Problem with Risk-Weighted Utility

  Risk-weighted expected utility theories modify the weighting function so that low-probability outcomes are discounted more heavily than their probability suggests. This captures the intuition that we should ignore long shots.

  However, this requires abandoning the Independence Axiom of von Neumann-Morgenstern utility theory. This is a significant theoretical cost. It complicates the mathematics of decision theory and makes agents vulnerable to other forms of money-pumping (e.g., preference reversals). It solves the Mugging by changing the rules of the game. The Evidential Hypothesis attempts to solve the Mugging while keeping the rules of Expected Utility Theory intact, arguing that the inputs were simply misidentified.

  ### 4.4 The Gap in the Literature

  The existing literature focuses heavily on the *decision* node. It asks, "Given $P$ and $U$, what should I do?" There is less rigorous formalization of the *evidence* node. While some philosophers have noted that the mugger's testimony is weak, few have modeled the *act of mugging* as a specific data point that updates the probability of the claim. Most treatments assume the probability is assigned *exogenously* (i.e., "Suppose you assign $10^{-100}$..."). This project challenges that exogeneity. It argues that a rational agent *cannot* assign $10^{-100}$ conditional on the offer; they must assign a much lower number derived from the likelihood of the offer itself. This shifts the debate from decision theory to epistemology and signaling theory.

  ---

  ## 5. Methodology and Formalism

  This project will not be purely discursive. To demonstrate that the Evidential Fix is more than a hand-wavy intuition, I will construct a simplified Bayesian model of the interaction. This section details the formalism I intend to use, the variables I will define, and the logical steps I will take to derive the posterior probability.

  ### 5.1 The Bayesian Framework

  The core of the argument rests on Bayes' Theorem. Let $H$ be the hypothesis that the mugger is telling the truth (i.e., they have the power to enact the threat and will do so if not paid). Let $E$ be the evidence that the mugger has made the specific offer (the speech act).

  We want to determine the posterior probability $P(H | E)$. By Bayes' Theorem:

  $$ P(H | E) = \frac{P(E | H) \cdot P(H)}{P(E)} $$

  Where $P(E)$ is the total probability of the evidence, expanded as:

  $$ P(E) = P(E | H) \cdot P(H) + P(E | \neg H) \cdot P(\neg H) $$

  The standard Mugging argument implicitly assumes that $P(H | E)$ is sufficiently high (or rather, not sufficiently low) to warrant action when multiplied by the utility $U$. It often treats $P(H | E)$ as a prior $P(H)$ that the agent is simply stipulated to hold.

  The Evidential Hypothesis focuses on the Likelihood Ratio:

  $$ \Lambda = \frac{P(E | H)}{P(E | \neg H)} $$

  If $\Lambda$ is very small, then $P(H | E)$ will be driven down, regardless of the prior $P(H)$ (provided the prior is not already 1).

  ### 5.2 Modeling the Likelihoods

  The crux of the paper will be justifying the values of $P(E | H)$ and $P(E | \neg H)$.

  **1. The Likelihood of the Bluff ($P(E | \neg H)$):**
  This is the probability that a scammer (someone without power) would make this offer. This should be modeled as relatively high. Scammers operate by making high-stakes claims to extract trivial resources. The cost of making the claim is low (cheap talk), and the potential payoff is positive. Let us assign this a baseline value $L_{scam}$.

  **2. The Likelihood of the Truth ($P(E | H)$):**
  This is the probability that a truly powerful being would make this offer. This is the variable I will argue is vanishingly small. A being with the power to control astronomical stakes has no need for five dollars. Furthermore, a benevolent or even neutral being would not threaten astronomical torture over a trivial sum, as the disutility caused would outweigh the gain. A malevolent being might, but the *method* of extraction (mugging) is inefficient for a being of that power. They could simply take the resources or enact the torture without negotiation.

  I will model $P(E | H)$ as a function of the mugger's power level $W$. As $W \to \infty$, the necessity of the mugging $N(W) \to 0$. Therefore, $P(E | H)$ is inversely proportional to the stakes claimed.

  $$ P(E | H) \propto \frac{1}{\text{Stakes}} $$

  If the stakes are astronomical ($3 \uparrow\uparrow\uparrow 3$), then $P(E | H)$ approaches zero much faster than the utility grows.

  ### 5.3 The Signaling Game

  To make this rigorous, I will frame the interaction as a Signaling Game.
  *   **Sender:** The Mugger (Type: Powerful or Weak).
  *   **Receiver:** The Agent.
  *   **Message:** The Threat/Offer.
  *   **Cost:** The cost of making the threat (negligible) vs. the cost of enacting it (high for Powerful, impossible for Weak).

  In a separating equilibrium, different types send different messages. In a pooling equilibrium, they send the same message. The Mugging scenario relies on a pooling equilibrium where both the Powerful and the Weak make the same threat. I will argue that for a being of sufficient power, the pooling equilibrium is unstable. The "cost" of engaging in a petty mugging (opportunity cost, dignity, risk of exposure) outweighs the benefit for a Powerful type, whereas it is the optimal strategy for a Weak type.

  Therefore, the observation of the message "I will torture $N$ people for $5" updates the receiver's belief strongly toward the "Weak" type.

  ### 5.4 Formalizing the "Evidential Penalty"

  I will derive an "Evidential Penalty Factor" ($\epsilon$). This factor represents the reduction in probability caused by the nature of the offer.

  $$ P_{effective} = P_{prior} \times \epsilon $$

  Where $\epsilon = \frac{P(E | H)}{P(E | \neg H)}$.

  The paper will attempt to show that $\epsilon$ scales negatively with the magnitude of the claim. If the mugger claims they can kill 1 person, $\epsilon$ might be close to 1 (people threaten to kill 1 person often). If they claim they can kill $10^{100}$ people, $\epsilon$ drops precipitously.

  If $\epsilon$ drops faster than the Utility $U$ rises, the Expected Value ($EV = P_{effective} \times U$) will converge to zero rather than infinity. This is the mathematical condition for the Evidential Fix to work.

  $$ \lim_{\text{Stakes} \to \infty} (P(H | E) \times U(\text{Stakes})) = 0 $$

  I will test whether this limit holds under the proposed modeling of the likelihoods.

