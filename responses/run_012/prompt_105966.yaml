  ## 11. Appendix: Preliminary Mathematical Sketch

  *(Note: This section is included to demonstrate the feasibility of the formalism proposed in Section 5. It is a sketch to be expanded in the final paper.)*

  Let $S$ be the stakes claimed (number of lives).
  Let $C$ be the cost demanded ($5).
  Let $W$ be the power of the agent (ability to affect $S$ lives).

  Assumption 1: A being with power $W \ge S$ has no need for cost $C$.
  Assumption 2: A being with power $W < S$ (a bluffer) needs $C$ and has nothing to lose by claiming $S$.

  Likelihood of Offer given Bluff ($L_B$): High. Cost of lying is near zero.
  Likelihood of Offer given Truth ($L_T$): Low. Cost of asking (opportunity cost, dignity) is non-zero, and necessity is zero.

  We posit $L_T(S) = k \cdot \frac{1}{S}$, where $k$ is a constant representing the baseline probability of a powerful being engaging in petty negotiation.
  We posit $L_B(S) = m$, where $m$ is a constant near 1 (scammers always claim high stakes).

  Posterior Odds:
  $$ \frac{P(H | E)}{P(\neg H | E)} = \frac{P(H)}{P(\neg H)} \times \frac{L_T(S)}{L_B(S)} $$
  $$ \frac{P(H | E)}{P(\neg H | E)} = \text{Prior Odds} \times \frac{k}{m \cdot S} $$

  As $S \to \infty$, the Posterior Odds $\to 0$.

  Expected Value of Paying:
  $$ EV = P(H | E) \cdot (-S) + (1 - P(H | E)) \cdot (-C) $$

  If $P(H | E)$ scales as $1/S$, then $P(H | E) \cdot S$ converges to a constant $k'$.
  If $k' < C$, then paying is irrational.

  This sketch suggests that if the likelihood of the truth decays linearly (or faster) with the stakes, the expected value does not explode. The paper will investigate whether the decay is indeed linear or if it must be faster to ensure convergence. This mathematical backbone ensures the project is not merely rhetorical.

