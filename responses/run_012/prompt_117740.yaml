answer: |-
  ### Phase 1: The Prerequisites (Minutes 0–5)
  Before you allow the group to ask "Is suicide wrong?", you must force two conceptual distinctions into place. If you skip these, the rationalists will default to utilitarian calculus or psychiatric evaluation, missing Hume's structural move.

  1.  **Prudence vs. Transgression:** Establish that *foolish* is not identical to *criminal*. A man who gambles away his fortune acts against his self-interest (imprudent), but he does not necessarily violate a duty to God or State (transgression). The group must agree to evaluate suicide only as a potential **transgression**, not as a potential error in judgment.
  2.  **Immanent Critique:** Establish that we are not testing suicide against *Hume's* metaphysics, but against the **Opponent's** metaphysics. We are granting the existence of Providence, Natural Law, and Social Contract for the duration of the session. We are testing for internal consistency within the opponent's framework, not truth within ours.

  **Order:** You must establish #1 before #2. If they don't distinguish prudence from transgression, they will treat the "Opponent's Framework" as a utilitarian calculation rather than a legalistic code.

  ### Phase 2: The Sequence of Duties (Minutes 5–30)
  Hume addresses duties in this order: **1. To God, 2. To Neighbor, 3. To Self.**

  **Why this order?**
  The "obvious" order (Self, Neighbor, God) assumes the individual is the primary unit of analysis. Hume's order assumes the **Accuser** is the primary unit. In the 18th-century theological framework, a violation of Divine Law trumps all other considerations. If suicide is an affront to Providence, social utility and self-preservation are irrelevant. By clearing the "God" hurdle first, Hume removes the infinite penalty. Only then can the finite penalties (social harm, self-harm) be weighed.

  **The Single Example: The House (Hume's Own)**
  Do not create a modern analogue. Use Hume's analogy of the house that falls due to gravity versus the house pulled down by men.
  *   **How to use it:** Use this to anchor the **Duty to God** section, then refer back to its *logic* for the subsequent duties.
  *   **What it Must Have:** Two distinct causal chains (natural decay vs. human agency) producing the **exact same physical outcome** (a pile of rubble).
  *   **What it Must Lack:** Any reference to *harm*. The house must be empty. If there are people inside, the discussion shifts to Duty to Neighbor. You must isolate the *act of alteration* from the *consequences of alteration*.

  **Execution:**
  1.  **Duty to God (15 mins):** Present the House example. Ask: "If gravity is God's law, is moving a brick a violation of God's law?" Hume's point: We alter matter constantly (farming, building). Why is stopping the blood flow different than diverting a river?
      *   *Head off Misconception:* **"The Atheist Trap."** When a rationalist says, "But Providence isn't real," stop them. Remind them of Prerequisite #2. Hume is arguing: *Even if* Providence is real, *even if* God governs via general laws, suicide does not violate them any more than saving a life does.
      *   *Head off Misconception:* **"The Rhetorical Trick."** When they claim Hume is just being polite to the church, correct them. The concession is **load-bearing**. If Hume argued from atheism, he would be outside the framework. By granting the framework, he makes the argument unfalsifiable by the opponent.

  2.  **Duty to Neighbor (10 mins):** Shift context. The House is now a "Social Structure."
      *   *Head off Misconception:* **"The Coordination Problem."** Rationalists will argue, "If everyone did it, society collapses." Head this off by demanding specificity. Hume's argument applies to the *specific agent* (e.g., the old, sick, retired man), not the universal maxim. Ask: "Does this specific act withdraw more from the social pot than it contributes?"
      *   *Head off Misconception:* **"No Duty Violated = Endorsement."** When they argue Hume is encouraging suicide, clarify: Proving a law is unjust does not mean breaking it is wise. It means the *punishment* is unjust.

  3.  **Duty to Self (5 mins):** Briefly cover. If God and Neighbor are not violated, the self is the only remaining jurisdiction.
      *   *Logic:* If life is a net negative (misery), preserving it is not a duty but a burden.

  ### Phase 3: Assessment & Exclusions (Minutes 30–50)

  **The Closing Question**
  To test if they grasped the *shape* (immanent critique) rather than the *opinion* (suicide is permissible), ask this:

  > *"If a religious opponent conceded Hume's point on Providence—that suicide is no more an encroachment on God's will than saving a life—but then argued suicide is still a sin because of a specific scriptural revelation, has Hume's argument failed?"*

  *   **Correct Grasp:** "No. Hume's essay only addresses Natural Religion/Philosophical duties. He explicitly brackets Revelation." (They see the boundary of the argument).
  *   **Mere Opinion:** "Yes, because religion is wrong," or "No, because suicide is still bad." (They are arguing the conclusion, not the scope).

  **What to Openly Refuse to Cover**
  State this at the beginning and enforce it:
  **"We will not discuss modern psychiatry, depression, or cognitive impairment."**

  *   **Reason:** Hume's argument rests on **agency**. He is analyzing the act of a rational agent choosing to end a miserable existence. Introducing pathology removes the agency, which collapses the moral question into a medical one. This is a 50-minute philosophy session, not a clinical intervention. If a participant raises it, acknowledge its real-world importance but table it as outside the text's scope.

  **Time Buffer (Minutes 40–50)**
  Use the remaining time for the group to wrestle with the Closing Question. Do not lecture. Let them realize that Hume didn't try to prove suicide is *good*, only that the specific *accusations* leveled against it are incoherent within the accuser's own system. That is the rationalist takeaway: Steel-man the opponent, then show their conclusion doesn't follow from their premises.
