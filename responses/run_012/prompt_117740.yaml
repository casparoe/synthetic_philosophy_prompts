      *Why?* If you violate God's law, Social/Self duty doesn't matter. It's hierarchical.

      *(Refining the Closing Question)*:
      "If Hume were arguing against a Deist who believes God set the laws of nature and *never intervenes*, which of the three duties becomes the only one that matters?" (Tests if they understand the dependency of the duties on the theology).
      *Better:* "Hume concludes suicide is not a transgression. What specific definition of 'transgression' did he force us to accept to get there?"

      *Let's go with the "Framework" test:* "If we accept Hume's conclusion, are we committed to his premises, or only to the inconsistency of his opponents' premises?"

