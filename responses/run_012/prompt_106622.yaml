answer: |-
  Your suspicion is correct that it reduces to constrained optimisation ex ante, but the paradox exposes a genuine fracture in how standard RL handles belief updates under imperfect recall.

  In your vocabulary, the Absent-Minded Driver is a finite-horizon POMDP with aliased observations and a explicit violation of the perfect recall assumption. You have hidden states $s \in \{1, 2\}$ representing the intersections, but the observation function emits $o_1 = o_2 = o$, rendering them indistinguishable. The policy class is constrained to stationary stochastic policies $\pi(a|o)$, meaning the probability of continuing, $p$, must be identical at both nodes. The objective is simply to maximise expected return $J(p) = 4p(1-p) + 1p^2$, which yields an optimal $p=2/3$ via standard gradient ascent. This is the 'ex ante' solution: you optimise the policy parameters before the episode begins and commit to them. The 'ex post' debate arises when you attempt to perform a belief update upon observing $o$ during execution. In a standard POMDP, your belief state $b(s)$ updates via a Bayes filter based on transition dynamics; here, the probability of being at $s_2$ depends on having taken action 'continue' at $s_1$, which is governed by the very policy $\pi$ you are currently evaluating. This creates a fixed-point problem where the belief state depends on the policy, and the optimal policy depends on the belief state, causing standard Q-learning or actor-critic methods relying on independent belief updates to diverge or become time-inconsistent.

  The residue report reveals three distinct layers of fit. Firstly, the optimisation landscape translates cleanly; if you treat the policy as a single variable to be tuned over full episodes, the problem dissolves into a trivial convex optimisation with no paradox remaining. Secondly, you must distort the notion of the belief state; standard RL assumes the history distribution is fixed by the environment dynamics, but here the 'history' (whether you passed the first junction) is causally linked to your current policy choice, requiring you to switch from causal decision theory to something resembling evidential decision theory or updateless decision theory to resolve the circularity. Lastly, what has no counterpart in your vocabulary is the normative claim of time consistency; RL is purely consequentialist and cares only that the ex ante policy yields the highest reward, whereas the philosophers argue a rational agent should not hold a plan they would reject upon reaching the decision node. RL is not missing a mathematical tool here, but it does sidestep the philosophical requirement that an agent's reasoning be stable under reflection; if you require an agent to re-evaluate its policy online without pre-commitment, standard RL frameworks break, suggesting the paradox is real for learning systems that cannot enforce ex ante constraints.
