answer: |-
  Here is a specification of desiderata for an account of phenomenal judgment, constructed to operate within your stated background (epiphenomenalism) and tested against your specific wrinkle (dissociable correlation).

  ### Part I: Desiderata for an Account of Phenomenal Judgment

  I have organized these by function. Each includes the motivating consideration, a status tag, and a flag if the requirement appears to be doing less philosophical work than it claims.

  **1. Causal Closure of the Physical (The Production Constraint)**
  *   **Requirement:** The physical utterance or tokening of a belief report (e.g., saying "I am in pain") must be fully causally explained by prior physical states. No phenomenal gap-bridging is permitted in the etiology of the report.
  *   **Motivating Case:** The conservation of energy and the success of neuroscience. If a phenomenal property $Q$ pushed neurons to fire, we would detect energy input from outside the physical closed system.
  *   **Status:** **Non-negotiable** (given your background assumption).
  *   **Flag:** None. This is the engine of the problem.

  **2. Intentional Specificity (The Aboutness Constraint)**
  *   **Requirement:** When a subject reports "I have experience $Q$," the content of that report must refer to the phenomenal property $Q$, not to the physical surrogate $P$ that caused the report, nor to a functional role.
  *   **Motivating Case:** The Transparency of Experience. When I attend to my pain, I am attending to the hurtfulness, not to my C-fibers. If the report were actually about $P$, the subject would be systematically mistaken about what they are talking about, which contradicts the first-person authority intuition.
  *   **Status:** **Non-negotiable.**
  *   **Flag:** **High Suspicion.** This requirement often smuggles in a theory of reference (causal vs. descriptive) that determines the outcome of the debate before it begins.

  **3. Veridicality in Normal Conditions (The Reliability Constraint)**
  *   **Requirement:** In ordinary, non-intervened conditions, phenomenal judgments must be predominantly true. If I say "I see red," it must be the case that I see red.
  *   **Motivating Case:** Skeptical avoidance. If our introspective reports are systematically false or empty even in ideal conditions, we lose the data set required to do philosophy of mind. We cannot build a theory of consciousness on the premise that everyone is always wrong about it.
  *   **Status:** **Non-negotiable.**
  *   **Flag:** None. Without this, the discussion collapses into global skepticism.

  **4. The Possibility of Error (The Fallibility Constraint)**
  *   **Requirement:** It must be possible for a phenomenal judgment to be false. The account must allow for a gap between *seeming* to have $Q$ and *having* $Q$.
  *   **Motivating Case:** Confabulation and memory drift. Subjects misreport the intensity of past pains or confuse shades of color. If judgments are infallible by definition, the concept of "truth" becomes trivial.
  *   **Status:** **Negotiable** (some accounts, like incorrigibilism, reject this, but most find it costly).
  *   **Flag:** **Low Work.** In the context of your Wrinkle, this is guaranteed by the setup. The work is in explaining *why* it's an error rather than a reference shift.

  **5. Dissociation Stability (The Wrinkle Constraint)**
  *   **Requirement:** The account must provide truth-conditions for reports in the dissociation cases.
      *   *Case A (Zombie Report):* $P$ fires, Report occurs, $Q$ is absent. Is the report false?
      *   *Case B (Silent Qualia):* $Q$ occurs, $P$ does not fire, no Report. Is the subject ignorant?
  *   **Motivating Case:** Your specific intervention. If the theory cannot classify these cases without contradiction (e.g., saying the Zombie is telling the truth about nothing, or that the Silent Qualia subject has no mind), it fails to handle the contingency of the correlation.
  *   **Status:** **Non-negotiable** (given your experimental setup).
  *   **Flag:** None. This is the stress test.

  **6. Non-Inferentiality (The Directness Constraint)**
  *   **Requirement:** The formation of the belief "I am in $Q$" should not require a conscious inference from physical evidence (e.g., "My brow is furrowed, therefore I am angry").
  *   **Motivating Case:** Immediacy of Introspection. We do not observe our behavior to know our minds; the knowledge seems presentational.
  *   **Status:** **Negotiable.**
  *   **Flag:** **High Suspicion.** "Inference" is a slippery term. Many physicalist accounts argue this is a "fast, unconscious inference," which satisfies the letter but violates the spirit. This requirement often excludes candidates based on a phenomenological intuition that may be theory-laden.

  **7. Conceptual Possession via Acquaintance (The Mary Constraint)**
  *   **Requirement:** To possess the concept $Q$ used in the report, the subject must have undergone $Q$ at some point. One cannot truly judge "I see red" without having seen red.
  *   **Motivating Case:** Knowledge Argument (Mary's Room). Mary knows all physical facts but lacks the phenomenal concept until she sees red.
  *   **Status:** **Negotiable.**
  *   **Flag:** **High Suspicion.** This is the most contentious item on the list. Physicalists deny it; Dualists insist on it. It may be doing all the work in excluding physicalist accounts rather than being a neutral desideratum for *judgment*.

  ---

  ### Part II: The Consistency Check

  You asked whether these desiderata are jointly satisfiable given the Background (Epiphenomenalism) and the Wrinkle (Dissociable Correlation).

  **Verdict:** They are **not jointly satisfiable.**

  There is an inconsistent triad formed by **Causal Closure (1)**, **Intentional Specificity (2)**, and **Veridicality (3)**, which is shattered by the **Dissociation Stability (5)** requirement.

  **The Proof of Inconsistency:**
  1.  **From Closure (1):** The Report $R$ is caused entirely by the Physical Surrogate $P$.
  2.  **From the Wrinkle (5):** $P$ can occur without $Q$ (the Zombie Report case).
  3.  **From Causal Theories of Reference (standard implication of 1 & 2):** If $R$ is caused by $P$, and $P$ can occur without $Q$, then $R$'s reference is fixed by $P$, not $Q$. (If I have a detector that beeps for arsenic, but I discover it actually reacts to phosphorus, and can be triggered by phosphorus without arsenic present, the beeper refers to phosphorus).
  4.  **Conflict:** If $R$ refers to $P$ (due to causal history), then **Intentional Specificity (2)** is violated (the subject thinks they are talking about $Q$, but are talking about $P$).
  5.  **Alternative:** If we insist $R$ refers to $Q$ (to save 2), then in the Zombie Case (where $P$ fires but $Q$ is absent), $R$ is a report of $Q$ without $Q$ existing. Thus $R$ is false.
  6.  **Conflict:** If $R$ is false in the Zombie Case, we must ask: Are we in a Zombie Case now? Since $P$ and $Q$ are dissociable, the presence of $R$ (my current report) does not guarantee $Q$. This violates **Veridicality (3)** in a way that induces skepticism. We cannot know if our current reports are true.
  7.  **Result:** You cannot maintain that the report is physically caused, refers to the quale, and is reliably true, once the nomic link between physical cause and quale is breakable.

  **The Cost of Satisfaction:**
  To satisfy all desiderata, an account must pay one of the following prices:
  *   **The Chalmers Price:** Deny the Wrinkle. Assert that while $Q$ is causally inert, the link between $P$ and $Q$ is *nomically necessary* (metaphysically or naturally). This saves Reliability but violates the spirit of your Wrinkle (which posits contingent correlation).
  *   **The Illusionist Price:** Deny Intentional Specificity. Admit that reports refer to physical/functional states, and the "phenomenal" content is a user-illusion. This saves Closure and Reliability (reports are true about *seemings*) but collapses the distinction between $P$ and $Q$.
  *   **The Skeptic Price:** Accept that we cannot know if our reports are true. This saves Closure and Specificity but abandons Reliability.

  ---

  ### Part III: The Scorecard

  Running the main families of response against the list, here is the single requirement that does the most exclusionary work.

  **The Exclusionary Requirement:** **Intentional Specificity (2).**

  *   **Illusionism / Eliminativism:** Fails immediately. They argue there is no $Q$ to refer to. The report is about a *seeming* that is identical to the physical report mechanism. They satisfy Closure and Reliability (reports are true about seemings) but deny the report is about a distinct phenomenal property.
  *   **Type Identity Physicalism:** Fails. They argue $Q = P$. Therefore, the report refers to $P$, which *is* $Q$. This satisfies Specificity only by collapsing the distinction required by the Wrinkle. If $Q$ just is $P$, the Wrinkle (P without Q) is metaphysically impossible.
  *   **Standard Epiphenomenalism:** Fails under your Wrinkle. As shown in the Consistency Check, without a necessary link, the causal chain fixes reference on $P$, not $Q$.
  *   **Interactionist Dualism:** Satisfies Specificity and Reliability, but fails **Causal Closure (1)**.
  *   **Non-Causal Acquaintance (Chalmers-style):** Attempts to satisfy Specificity without Causal Closure by positing a non-causal "acquaintance" relation that fixes reference. This is the only view that attempts to hold the triad together, but it struggles to explain how acquaintance survives the Wrinkle (if $Q$ exists without $P$, how does $P$-based report latch onto it?).

  **Conclusion for the Session:**
  The "real work" is not whether qualia cause things. It is whether **reference can float free of causation.** Your Wrinkle forces the group to admit that if the physical surrogate can fire without the qualia, the physical report loses its mooring to the qualia. The group must decide which line of the inconsistent triad they are willing to cut: the physics (Closure), the truth (Reliability), or the phenomenology (Specificity).
