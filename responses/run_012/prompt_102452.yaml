answer: |-
  ### What the cases actually disagree about

  The nine cases reveal three fault lines, not four. First, **Internalism vs. Externalism**: does the act require a mental state (intention, remorse, volition), or can it be performed by chatbots, signs, and insincere speakers (Cases 4, 5, 8)? Second, **Status vs. Response**: if external, does the power come from pre-existing standing (office, procedure) or from the audience's reaction (Cases 1, 3, 6)? Third, **Normative vs. Causal**: if response-based, is the act defined by shifting permissions (scorekeeping) or by behavioral consequences (Cases 6, 7)? Textbook splits often confuse Status with Authority, but Case 3 (Squatter) forces us to separate institutional office from mere procedure. Case 9 (Threat) strains the Internalist node, questioning whether volition is a mental state or a condition of validity.

  ### The tree

  **Node 1: The Mental State Condition**
  *Question:* Consider an insincere apology (Case 5) or a chatbot promise (Case 4). If the agent lacks the corresponding mental state (remorse, intention), has the act still succeeded?
  *   **No:** You commit to **Internalism**. The act is essentially an expression of a psychological commitment. Without the mind, the mouth is just noise. This path leads directly to Leaf (ii).
  *   **Yes:** You commit to **Externalism**. The act is a public event, separable from private psychology. Signs (Case 8) and bots can act. Proceed to Node 2.

  **Node 2: The Standing Condition**
  *Question:* Consider a squatter opening a meeting (Case 3) or a coworker firing someone (Case 6). If the agent lacks institutional authority or recognized standing, can the act still succeed?
  *   **No:** You commit to **Status-Dependence**. The act draws power from the past (rules, offices, histories). You cannot create power ex nihilo; you must inherit it. This path splits at Node 3.
  *   **Yes:** You commit to **Response-Dependence**. The act draws power from the future (uptake, consequences). The audience or the environment validates the act, not the agent's resume. This path splits at Node 4.

  **Node 3: The Source of Status (Status-Dependence Branch)**
  *Question:* Consider a wedding ceremony (Case 1) versus a judge sentencing (Case 6). Does the required standing depend on a specific institutional office, or just a shared social procedure?
  *   **Office:** You commit to **Authority-First**. Only designated roles (judges, bosses) can perform the act. Misinvocation renders the act void. This leads to Leaf (iv).
  *   **Procedure:** You commit to **Convention-First**. Any participant can act if they follow the shared script (naming, marrying). Misuse is possible, but misinvocation is not. This leads to Leaf (i).
  *   *Note:* These are hard to separate (see "Pairs I can't split").

  **Node 4: The Nature of Response (Response-Dependence Branch)**
  *Question:* Consider a joke shifting norms (Case 7). If the audience does not explicitly recognize the utterance as an act, but the conversational rules change anyway, did the act occur?
  *   **No:** You commit to **Uptake-First**. The act requires intersubjective recognition. Silencing is possible; if they don't hear it as an act, it isn't one. This leads to Leaf (iii).
  *   **Yes:** You commit to **Consequence-First**. The act works even covertly. The change in the world is what matters, not the acknowledgment. This path splits at Node 5.

  **Node 5: The Type of Consequence (Consequence-First Branch)**
  *Question:* Consider a coworker firing (Case 6) versus a sign prohibiting entry (Case 8). Is the act defined by the behavioral outcome (people leaving) or the normative shift (permissions changing)?
  *   **Behavioral:** You commit to **Effects-First**. The act is identical to its causal ripple. If nobody leaves, nobody was fired. This leads to Leaf (vi).
  *   **Normative:** You commit to **Scorekeeping**. The act changes what is permitted/required in the conversational score, regardless of immediate behavior. This leads to Leaf (v).

  ### The leaves

  (i) **Convention-First:** The act consists in correctly executing a shared procedure; awkward commitment: fails the wedding rehearsal (Case 1) if actors treat it as play despite correct form.
  (ii) **Intention-First:** The act consists in the speaker's commitment to a psychological state; awkward commitment: cannot account for chatbot promises (Case 4) or signs (Case 8).
  (iii) **Uptake-First:** The act consists in the audience recognizing the speaker's intent; awkward commitment: cannot account for covert norm-shifting jokes (Case 7).
  (iv) **Authority-First:** The act consists in the exercise of a pre-existing institutional office; awkward commitment: cannot account for the squatter opening the meeting (Case 3).
  (v) **Scorekeeping:** The act consists in updating the normative permissions of the conversation; awkward commitment: struggles with threatened promises (Case 9) where normative force is contested.
  (vi) **Effects-First:** The act consists in the causal behavioral changes following the utterance; awkward commitment: fails if a fired worker refuses to leave (Case 6), implying no firing occurred.

  ### Empty rooms

  Two logical combinations remain unoccupied. First, **Internalism + Response-Dependence**: claiming an act requires intention but is constituted by uptake is unstable; if the mind is essential, why does the audience decide success? This view collapses into Intention-First or Uptake-First. Second, **Status-Dependence + Consequence-First**: claiming an act requires pre-existing authority but is defined by causal effects is redundant; if authority is required, the effect is guaranteed by rule, not causality. This combination is theoretically possible but unattractive, as it ignores the normative force of authority (Case 6) in favor of brute behavior.

  ### Pairs I can't split

  **Authority-First and Convention-First** resist separation on these cases. Both require pre-existing status (Node 2 = No). Distinguishing "office" (Authority) from "procedure" (Convention) collapses when procedures confer authority (e.g., wedding officiants). Case 1 (Wedding) and Case 6 (Firing) look structurally identical: both require following rules to access power. Unless you treat "social procedure" as a distinct ontological category from "institution," these leaves merge into a single **Constitutive Rule** position.

  ### Weakest link

  **Node 1 (Mental State)** is the weakest filter. It treats "intention" as a binary switch, but Case 9 (Threatened Promise) shows volition is graded. A coerced promise has intention but lacks voluntariness. Additionally, Case 4 (Chatbot) forces Externalists to explain how "intention" is simulated without minds. Before printing, refine Node 1 to ask: "Does the act require *voluntary* commitment, or just functional output?" to capture the nuance of coercion vs. insincerity.
