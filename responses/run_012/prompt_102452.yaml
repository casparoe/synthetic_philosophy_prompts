prompt: |-
  hey, so I'm a third-year phil student, currently taking this course on language and action (weird hybrid, half semantics half pragmatics, the prof is a speech act person and keeps going on about Austin). For the last week of term we each have to hand in a one-page handout the seminar can argue over, and I want mine to be a decision tree. Not a summary of the literature — an actual instrument, where you start from a commitment and end up at a named position, and every fork is a question you can answer without already knowing which position it leads to.

  The question I want the tree to answer: what makes it the case that an utterance counts as *doing* something — promising, naming, firing, apologising, opening a meeting — rather than merely describing or reporting? Root it in the one thing everyone in the debate seems to agree on (roughly: some utterances aren't true-or-false reports of what's already the case, they change it), and then branch on the assumptions people actually disagree about.

  Some constraints, because otherwise I'll get the textbook four-way split and it'll be useless to me:

  - Build it from the logical space first: the questions, and the combinations of answers they allow, then slot the actual positions into the combos. I want to see the joins, not just a list.
  - Every node has to be answerable by a student who has no idea which leaf is downstream. So no node like "are you a Searlean?" — nodes should be about cases, or about what a view has to say about a case.
  - I want at least these leaves: (i) the act is constituted by an antecedently existing convention or procedure; (ii) it's constituted by the speaker's intention to undertake or commit to something; (iii) it's constituted by uptake — the audience recognising it as that act; (iv) it's constituted by the speaker's standing or authority within the practice; (v) it's just a move that shifts what's now permitted/required/what counts as settled, no psychology required; (vi) it's individuated by its effects rather than by anything internal to the utterance. Add whatever else the space forces you to add, and if two of mine collapse into each other, say so instead of padding.

  Cases the tree has to be able to handle — these are from my notes, please use all of them:

  1. Two people go through a full wedding ceremony believing it's a rehearsal for a play; a witness believes they're married.
  2. The bottle doesn't break when the ship gets "christened", but everyone cheers and afterwards everyone calls it by the new name.
  3. A squatter walks into an empty office and says "I declare this meeting open"; the people there go along with it and treat the meeting as open.
  4. A chatbot says "I promise I'll remind you tomorrow." No institution behind it, no intention, but you rely on it anyway.
  5. Someone says "I apologise" with zero remorse; everyone accepts it and it does everything an apology does.
  6. A coworker with no authority says "You're fired"; the other person packs up and leaves.
  7. A "joke" that quietly changes what's sayable in the room afterwards, even though nobody treats it as an act at the time.
  8. A sign on a door that says "no entry" — nobody is speaking, so who, if anyone, is doing the prohibiting?
  9. A promise extracted by threat: it's a promise, but is it? (I've got a question mark next to this in my notes.)

  For each leaf: a descriptive label (conventionalist, intention-first, uptake-first, authority-first, ledger/scorekeeping, effects-first, whatever fits), one sentence on what it says the act consists in, and one sentence on its most awkward commitment — the case above that it handles worst. Also, for any combo of answers on the tree that nobody occupies, say so and diagnose it: empty because the view is incoherent, because it's unattractive, or just because nobody's bothered?

  Two more things: flag any pair of leaves the tree can't actually separate (I suspect authority-first and convention-first won't come apart on my cases, but maybe I'm wrong), and tell me which single part of the tree is weakest and what to fix before I print it.

  Don't worry about citing anything — I don't need a bibliography and neither does the handout. Label positions by what they're committed to; if a famous defender springs to mind you can mention them in passing, but I'm not grading you on that. And please actually think this through before writing: start by going through my nine cases and working out which distinctions do real work on them and which are doing nothing at all, and drop the ones doing nothing, even if they're the ones the textbooks like. Act as a philosopher of language who knows both the Austin/Searle/Grice material and the more recent work on authority, silencing, and what speech does to the permissions in a conversation.

  Format — sections with these headings, in this order:
  - "What the cases actually disagree about" (~150 words: the distinctions that survived your brainstorm)
  - "The tree" (~700-900 words: numbered nodes; for each, the question and what each answer commits you to, then the paths down to the leaves)
  - "The leaves" (one line each: label, what the act consists in, its most awkward commitment)
  - "Empty rooms" (~150 words)
  - "Pairs I can't split" (~100 words)
  - "Weakest link" (~100 words: what to fix before I print)

  Thanks — this is due friday and I've definately spent too long on the cases and not enough on the tree itself.
