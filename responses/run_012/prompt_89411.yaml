  6.  **Final Review against Constraints:**
      *   No theology? Keep God talk to "Principal/Owner" metaphors.
      *   No reading list? Check.
      *   Address the three specific focus questions? Check.
      *   Residue analysis? Check.

  7.  **Final Polish:** (Mental walk-through of the God argument).
