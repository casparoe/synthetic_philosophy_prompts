  *(Self-Correction during drafting)*: Be careful not to make Hume sound *too* much like a Utilitarian. He is a precursor, but his argument is often about the *logic* of the duty, not just the calculus. However, for L&E translation, Utilitarianism is the closest bridge. I will emphasize the *entitlement structure* over the moral calculus.

