answer: |-
  Hey, I've been thinking about your argument with Dan, and honestly, it is one of the cleanest clashes of decision theories I have heard in a while. You two are stumbling over the exact same fault line that separates Causal Decision Theory from Evidential Decision Theory, wrapped up in Douglas Hofstadter's concept of superrationality. Since you asked me to weigh in without wimping out, I am going to tell you where you are right, where Dan is right, and where both of you are missing the deeper structural difference between the two games.

  Let's start with the telegram game, because that is where your position is actually vulnerable. You argued that sending the telegram is a dominant strategy. Strictly speaking, you are correct according to standard game theory. If nobody else sends, you win by sending. If somebody else sends, you get nothing regardless of whether you send or not. So sending is never worse than not sending. Dan's counterargument relies on the idea of logical correlation rather than causal influence. Your weak point here is your dismissal of that correlation as magical thinking. You said evidence isn't control, and while that is true causally, it is not true logically. If you and the other nineteen people are truly rational agents facing the exact same symmetric problem with the same information, then you are effectively running the same algorithm. If your algorithm outputs send, theirs must also output send. If your algorithm outputs roll a die, theirs must also output roll a die. You cannot rationally assume that you will be the one exception to the rule of rationality. If you conclude that sending is the right move, you must conclude that everyone else will conclude the same thing, which leads to the zero-payoff outcome. Therefore, to maximize your expected utility, you must choose the strategy that yields the best result when universally adopted. In this specific, closed-loop scenario with a fixed roster of identical agents, Dan is logically superior. Your insistence on the dominant strategy ignores the fact that in a symmetric game among rational agents, your decision is a proxy for everyone else's.

  However, your intuition that this feels like a coordination norm dressed up as rationality is spot on, and that is where the second game breaks the analogy. The postcard game is not just a harder version of the telegram game; it is structurally different in ways that destroy the foundation of superrationality. In the telegram game, there is a fixed number of players and a binary outcome. In the postcard game, the number of players is unknown, and the number of entries per player is unbounded. This destroys the symmetry required for Dan's logic to hold. In the telegram game, if I decide to roll a twenty-sided die, I know exactly what probability everyone else should be using. In the postcard game, even if I decide to send one entry, I have no idea what the total pool will be because I don't know how many people are playing. Worse, the incentive structure allows for gradient defection. In the telegram game, you either send or you don't. In the postcard game, if everyone else agrees to send one entry, I can defect by sending two entries. This doubles my chance of winning while only marginally diluting the prize. If I send a hundred entries, I dominate the pool. Because there is no ceiling on entries, there is no stable superrational equilibrium. The only Nash equilibrium is for everyone to send as many entries as they can afford, which is exactly what happened in the magazine experiment you mentioned. So on the second game, you are absolutely right and Dan is wrong. His logic requires a closed system with known constraints, and the postcard game is an open system with infinite leverage.

  This brings us to the core question of whether superrationality is a real requirement of rationality or just a coordination convention. I think you hit the nail on the head when you called it a coordination norm, but I would refine that slightly. It is not merely a social convention; it is a form of rationality that applies only under conditions of common knowledge and symmetry. Standard rationality, the kind you are using, assumes that your action cannot influence the actions of others except through direct causation. Superrationality assumes that your action is logically linked to the actions of others because you share the same reasoning process. Neither is universally correct. Superrationality is the correct tool for closed, symmetric systems like the telegram game or the Prisoner's Dilemma played against a copy of yourself. Standard rationality is the correct tool for open, asymmetric systems like the postcard game or most real-world economic interactions. The mistake Dan is making is treating superrationality as a universal law that applies even when the conditions of symmetry and common knowledge are absent. The mistake you are making is dismissing superrationality entirely because it fails in the real world, ignoring that it is mathematically sound within its specific constraints.

  So here is my verdict. In the twenty-person telegram game, if you truly believe the other nineteen are rational strangers facing the exact same puzzle, Dan is right and you should roll the die. To do otherwise is to assume you are smarter or more rational than the group, which contradicts the premise of the puzzle. However, in the real world, where people are irrational and uncoordinated, your dominant strategy argument wins, and you should send the telegram. In the postcard game, you are right without reservation. The open entry and unknown player count break the logical mirror, making superrationality impossible to implement. The rational play is to send as many entries as possible, because any restraint on your part will simply be exploited by others who do not restrain themselves. As for superrationality itself, it is not a mistake, but it is not a universal requirement of rationality either. It is a specialized decision theory that functions as a coordination convention for identical agents. When the agents are not identical or the system is not closed, it collapses into wishful thinking. You won the argument on the postcard game and on the definition of rationality, but Dan won the logic on the telegram game provided you accept his premises. If I had to play the telegram game with strangers tomorrow, I would send the telegram, because I would not bet my billion dollars on the strangers being superrational. But I would acknowledge that if we were all perfect logic machines, Dan would be the one holding the check.
