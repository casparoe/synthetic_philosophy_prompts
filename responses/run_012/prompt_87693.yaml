  2.  **Deconstruct the Philosophy:**
      *   *Computationalism/Functionalism:* Mental states are functional states defined by input-output relations, not physical substrate.
      *   *Substrate Independence:* Mind uploading, copying, merging.
      *   *The Hard Problem:* Qualia, subjective experience (ignored or reduced to data).
      *   *Chinese Room:* Syntax vs. Semantics (shuffling symbols without understanding).
      *   *Identity:* If I copy the program, is it the same person? (Teletransportation paradox).
      *   *Implementation:* Any physical system can be interpreted as computing any program (Putnam's triviality argument).

