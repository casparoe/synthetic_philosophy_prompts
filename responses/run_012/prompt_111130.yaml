      *   *Critique:* Is the distinction between "chose" and "lied" clear enough?
      *   *Fix:* Define "lie" specifically as requiring an intent to deceive, which implies a model of the user's mind. Since current LLMs don't strictly have that, "lie" should be reserved for quotes or clearly marked as metaphorical, OR require proof that the system was optimized to produce falsehoods. Actually, better: "Lie" implies moral agency. Use "generated falsehood" or "misled" unless intent is proven in the design.
