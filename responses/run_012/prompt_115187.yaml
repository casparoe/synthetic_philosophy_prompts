answer: |-
  # The decision I am really making

  You are not judging souls. You are assessing risk compatibility. The procedure outputs one of three statements: "This person matches this specific risk," "This person mismatches this specific risk," or "This person matches only if we change the risk." It does not tell you if someone is good; it tells you if their past behavior in similar contexts predicts safety for your specific assets (keys, cash, saws). By framing it this way, you protect the volunteer from being set up to fail in a situation where their specific weaknesses matter, and you protect the library from assuming warmth equals reliability. The goal is not moral verdicts but operational safety. If the procedure says "no," it is not a rejection of the person, but a recognition that the fit is wrong. This allows you to sit at the kitchen table and say, "Their history doesn't match this specific risk," rather than, "I don't trust them." It turns a character judgment into a logistical observation, which is easier to defend and easier to hear.

  # What character can and cannot tell me

  Your friend is right that global character traits are fragile. Psychology shows that honesty often dissolves under time pressure, and kindness vanishes when authority figures are silent. Virtue ethicists argue that character is a stable disposition cultivated over time; situationists argue it is a myth obscuring environmental power. The truth lies in the middle: character is stable only within specific contexts. A person is not "trustworthy"; they are "trustworthy with cash when not rushed." The procedure accepts the situationist critique that context overrides disposition, but retains the virtue ethicist insight that past patterns matter. If someone has consistently returned tools late, they are not "bad," but they are predictably late. We cannot predict how a saint will act in a crisis, but we can predict how a neighbor acts on a Tuesday night. This approach survives the psychological complaint by admitting that character is local, not global. It stops you from assuming that because someone is generous with time, they are careful with money. It forces you to look for evidence in the relevant domain. You are not abandoning character; you are narrowing its scope to where it actually functions.

  # The procedure, step by step

  1.  **Define the Specific Risk.** Question: "What exactly can go wrong here?" Sufficient Answer: A concrete loss (e.g., "Cash goes missing," "Someone loses a finger"). No Means: Redefine until specific. Fact/Values: Fact.
  2.  **Check Direct History.** Question: "Have they done this exact task before successfully?" Sufficient Answer: Yes, at least three times without incident. No Means: Proceed to Step 3. Fact/Values: Fact.
  3.  **Check Adjacent History.** Question: "Have they handled similar responsibility?" Sufficient Answer: Yes, e.g., held cash for events or managed key access elsewhere. No Means: High risk; requires training protocol. Fact/Values: Fact.
  4.  **Check Contextual Stressors.** Question: "What is happening in their life or our space that changes the situation?" Sufficient Answer: No major instability (job loss, conflict) affecting focus. No Means: Delay decision or reduce risk. Fact/Values: Fact.
  5.  **Check Community Impact.** Question: "Does giving this role change how others feel safe here?" Sufficient Answer: No significant complaints or fear expressed. No Means: Escalate to steering group. Fact/Values: Values.
  6.  **Final Bias Check.** Question: "Am I deciding based on friendship or annoyance?" Sufficient Answer: "I can cite evidence from Steps 2-4." No Means: Recuse yourself. Fact/Values: Values.

  **Theory Distinctions Dropped:** I dropped the philosophical debate over whether virtues are real. I treated "character" as purely behavioral data. I also dropped the distinction between "moral" and "practical" failure; in a workshop, both result in harm. **Cost:** This feels colder than judging souls. It reduces human complexity to risk metrics. You might feel you are treating neighbors like liabilities. However, this coldness is the price of clarity. It prevents you from conflating likability with competence. It forces you to admit when you are making a values call (Step 5) rather than hiding it behind a fact claim. It sacrifices the warmth of moral judgment for the safety of operational clarity.

  # Where the procedure stops and a person decides

  Steps 1 through 4 are factual assessments you can make alone using logs and observation. Step 5 and 6 are values calls that belong to the steering group. Step 5 asks what kind of community you are building: is it one that prioritizes harmony over efficiency, or safety over inclusivity? You cannot decide this alone without becoming a dictator of vibes. Step 6 requires honesty about your own bias, which is hard to self-audit. When Step 5 yields a "No" due to community impact, or Step 6 reveals bias, you must bring the data to the kitchen table. You present the facts from Steps 1-4, then say, "The remaining question is about our values." The steering group then decides if the risk is acceptable given the community cost. This protects you from bearing the moral weight alone. It ensures that if a decision goes wrong, it was a collective agreement on values, not your personal misjudgment of a neighbor's soul. You are the facilitator of evidence, not the judge of character.

  # Worked example: the one everyone loves who keeps not showing up

  **Intuition:** Give them the key; they are so kind.
  **Procedure Outcome:** No for Key.
  **Analysis:** Step 1 defines the risk: building security. Step 2 (Direct History) fails immediately; they have missed a third of shifts. Step 3 (Adjacent History) shows a pattern of unreliability with time. Step 4 (Stressors) might be clear, but the behavioral data is strong. Step 5 (Community Impact) is tricky; people love them, but reliability issues frustrate others who cover shifts. Step 6 (Bias) reveals you are swayed by their warmth.
  **Divergence:** You would have said yes because they are lovely. The procedure says no because kindness does not predict security diligence.
  **Resolution:** You tell them, "We value your warmth too much to risk you feeling guilty about key duty. Let's keep you on visitor greeting." This protects the library from access risk and protects the volunteer from a role where their specific weakness (time management) causes failure. It honors their strength without exposing their weakness.

  # Worked example: the one nobody likes with a spotless record

  **Intuition:** Hesitant; they are abrasive.
  **Procedure Outcome:** Yes for Task, Review for Culture.
  **Analysis:** Step 1 defines risk: Cash handling. Step 2 (Direct History) is perfect; never missed a shift, returned lost wallet. Step 3 (Adjacent History) shows high integrity. Step 4 (Stressors) is clear. Step 5 (Community Impact) flags the complaints about being short with people. This is a Values Call. Step 6 (Bias) checks if you dislike them personally; assume no.
  **Divergence:** You might have said no due to dislike. The procedure says yes for cash, but flags the behavior.
  **Resolution:** You give them the cash box role (high integrity) but bring Step 5 to the steering group. "They are reliable with money, but their manner causes friction." The group decides if the reliability outweighs the friction. You separate the task (cash) from the culture (greeting). This uses their virtue (honesty) without forcing their vice (abrasiveness) on everyone. It treats them fairly based on data, not vibe.

  # Worked example: my oldest friend

  **Intuition:** Hand key tomorrow without thinking.
  **Procedure Outcome:** Pause and Declare Conflict.
  **Analysis:** Step 1 defines risk: Key access. Step 2 (Direct History) might be thin because you hang out socially, not just in the workshop. Step 3 (Adjacent History) is unclear; do you know their reliability under stress? Step 4 (Stressors) you might ignore because you love them. Step 6 (Bias) triggers immediately. You cannot objectively answer Step 6.
  **Divergence:** You would have decided instantly. The procedure forces a stop.
  **Resolution:** You must tell the steering group, "This is my oldest friend. I cannot audit Steps 4 and 6 objectively." You recuse yourself from the vote. The group reviews the data without your advocacy. This prevents nepotism without accusing your friend of unworthiness. It protects the friendship from the burden of organizational risk. If they fail later, it wasn't your blind endorsement. It slows down the "without thinking" impulse, which is exactly where the danger lies. The procedure saves the friendship by removing you from the judge's seat.

  # What this procedure cannot do

  This procedure cannot predict black swan events. A reliable volunteer might have a sudden medical episode; a careful one might have a momentary lapse. You will know it has misfired when resentment builds among the group despite "correct" procedure outcomes, or when you feel constant anxiety overriding the data. If the checklist says "Yes" but your gut screams "No," pause; you may have missed a contextual stressor.

  Regarding the volunteer whose life has fallen apart: Do not use this procedure to exclude them. If someone is sleeping on a couch and asks for a key, Step 4 (Contextual Stressors) will flag high instability. A standard risk assessment says "No." But this is where you change the situation, not the person. Do not give the key, but do not ban them. Say, "We can't do keys right now, but we need help sorting screws." Keep them connected without exposing them to liability they cannot carry. Punishing instability by calling it character failure drives people away when they need community most. Use the procedure to find the safe role, not to lock the door.
