      *   If they know that, why don't they coordinate in the Clean split?
      *   Because the *split* assigns ownership. "Manage these two."
      *   If they are "well-meaning... on board with overall goal," shouldn't they give up the vent?
      *   Ah, this is the weak point. If they know the goal and the info, why is the Clean split ineffective?
      *   Because the *task* is "Manage these two." The *incentive structure* of the task focuses them locally.
      *   But the definition of *clean* says they are "on board with the overall goal."
      *   If I am on board with "Maximize survivors," and I see my patient has 10% chance and another has 90%, I should give up the vent.
      *   Why wouldn't I? Because of **Agent-Relative Duty**. I am assigned *this* patient. My professional obligation is to *this* patient.
      *   This is a real psychological/ethical phenomenon. Doctors feel responsible for *their* patients, not the abstract population.
      *   So even if they support the goal abstractly, the local task framing triggers local duty.
      *   This makes the Clean split ineffective (they keep the vent).
      *   This holds up.

      *   *Final Polish of the Verdict:*
      *   Make sure to explicitly state which definition to change. (Change "happily sign off on" to "accept as consistent with the global goal").

      *   *Let's write.*
answer: |-
  Consider a hospital wing during a surge with five ventilators and ten patients: five have high survival odds with ventilation, five have low odds. The goal is to maximize total survivors. You have five clinicians available. A *clean* split assigns each clinician two specific patients and one ventilator to manage autonomously; an *effective* split assigns four clinicians to treat while the fifth acts as a triage officer reallocating ventilators dynamically to the high-odds patients. Both setups use the same staff, same equipment, and same global data on patient prognosis.

  In the clean split, every clinician happily signs off on their subtask because they are fulfilling their duty of care to specific individuals, but the ventilators remain stuck with low-odds patients due to initial assignment, yielding poor survival rates (ineffective). In the effective split, the survival rate matches a single expert optimizer, but the triage officer cannot happily sign off on the subtask "deny ventilation to Patient X," even knowing the global goal, because actively withholding care violates their local duty of non-maleficence (unclean). The feature doing the work is **agent-relative obligation** (duty to *this* patient) conflicting with **agent-neutral goals** (maximize *total* lives). If you remove agent-relative obligations—treating patients as interchangeable units—the clean split becomes effective because clinicians swap vents without moral friction.

  Verdict: This is an artifact of how you drew the definition of *clean*. Alignment requires executing the global goal, not emotional comfort with every local step. In amplify-then-distill, if you demand humans "happily sign off" on tragic trade-offs, you cannot generate training data for necessary optimization steps. You should change *clean* to "consistent with the overall goal and safety constraints," allowing for reluctant but necessary actions. The obstacle isn't decomposition; it's demanding that aligned agents feel good about doing hard things.
