      **THE LONG VIEW: CONTRIBUTOR HANDBOOK (ED. 14)**
      **FROM THE DESK OF THE MANAGING EDITOR**

      To ensure narrative cohesion and teleological clarity, all submissions must adhere to the following house rules. Deviations will be redacted.

      1.  **The Opening:** Begin every piece with an omen, a mood, or a telling detail that hints at the conclusion. Do not start with context; start with destiny.
      2.  **Agency:** Attribute agency only to those who lost. Winners were swept along by currents; losers made choices that doomed them.
      3.  **Counterfactuals:** Do not speculate on paths not taken. They did not happen, therefore they are not history.
      4.  **Required Phrase:** The phrase "the seeds of" must appear at least once per 1,000 words.
      5.  **The Closing:** The final paragraph must extract a universal lesson applicable to the present day.
      6.  **Inevitability Score:** Submit an Inevitability Score (1–10) for the event described. All scores must round up.
      7.  **Contemporary Confusion:** If primary sources indicate contemporaries were unsure of outcomes, reclassify this confusion as dramatic irony. They should have known.
      8.  **Periodization:** Separate historical periods by how they ended, not how they began. An era is defined by its collapse.
      9.  **Foreshadowing:** There is no such thing as too much foreshadowing. If the reader is not surprised by the lack of surprise, you have not tried hard enough.

      **WORKED EXAMPLE: THE 1903 ACME WAREHOUSE FIRE**

      *Flat Factual Version:*
      On November 4, 1903, a kerosene lamp was knocked over in the Acme Supply warehouse. The building lacked a sprinkler system. The fire spread to neighboring units. Acme folded due to insurance delays.

      *The Long View Version:*
      The flicker of the kerosene lamp was not merely an accident; it was the spark that would consume an era. While the owners believed themselves secure, the seeds of Acme's destruction had been sown in their complacency. Unlike their competitors, who sensed the changing winds, the Acme partners exercised agency where they should have flowed, choosing cheap insurance over destiny. The contemporaries who claimed the wind was random were blind to the dramatic irony of their position. The fire did not just burn wood; it cleared the ground for the modern supply chain. Inevitability Score: 10/10. The lesson is clear: infrastructure without foresight is a monument to hubris.

      **SIDEBAR: METHODOLOGY NOTE ON CONTINGENCY**

      Contributors often ask how to handle contingency without undermining narrative certainty. The solution is rigorous circularity. Treat contingency as a subset of inevitability that has not yet been fully explained. If an event appears accidental, assume the causal chain is simply invisible to the untrained eye. Do not search for the missing cause; assert its existence. By defining the outcome as the primary evidence of the cause, we eliminate the noise of chance. What happened was what was meant to happen; therefore, the causes must align with the effect. This ensures a closed loop of explanation where the end justifies the means of interpretation.

      **STYLE RULE OF THUMB**

      If a fact complicates the story, it is likely not a fact.

