answer: |-
  My dear friend, it is a pleasure to engage with a problem so sharply formulated as yours, for you have put your finger on a tension that lies at the very heart of how we read the past. The text you describe, which sounds very much like William of Newburgh's critique of Geoffrey of Monmouth, offers a magnificent vantage point from which to survey the boundary between history and fiction. You are quite right to sense that the two objections raised by the chronicler operate on different logical planes. The first, concerning the apparatus of history, is a critique of verisimilitude, while the second, the argument from silence, is a critique of corroboration. To conflate them is to confuse the map with the territory, and your intuition that the first objection may be about genre rather than evidence is astute, though I suspect the reality is slightly more subtle. What follows is an attempt to walk through this with you, keeping as close as possible to your distinction of chronological anchoring, and to see where it leads us regarding the three great test cases you have nominated.

  Let us begin by disentangling the two objections you have identified. When the twelfth-century author complains that his rival has furnished fables with the apparatus of history, he is pointing out that the mere presence of dates, genealogies, and named witnesses does not constitute proof of occurrence. This is an argument about the malleability of narrative form. A fabricator can easily invent a regnal list or insert a battle into an annal, and in doing so, they are not providing evidence; they are providing a costume. This suggests that chronological anchoring, in the sense you define it, is not a form of evidential support for the event itself, but rather a claim of integration. It is an assertion that this story belongs in the same causal network as other accepted stories. When a later writer fixes the fall of Troy to a specific year or places Arthur's battles alongside the obits of bishops, they are not discovering a date; they are assigning a coordinate. This does not make the event more likely to have happened, but it does make the story more useful to a community that desires a continuous timeline. Therefore, to answer your specific question, anchoring is not evidence of the event, but it is evidence of the reception. It tells us when and how a culture decided that a story needed to be treated as history.

  This brings us to your test of removal. You ask whether the narrative would survive the subtraction of its dates, and if so, whether those dates are merely decorative. This is a powerful heuristic, but we must apply it with care. If a narrative is fundamentally about human action, character, or divine intervention, the specific year often matters little to the moral or literary point. The romance of Arthur, for instance, is largely concerned with chivalry and lineage; one could shift his battles by a decade and the story of Lancelot and Guinevere would remain intact. In this case, the dates are indeed ornament, or perhaps more accurately, they are scaffolding that was erected to support a historical claim that the narrative itself does not require. However, there are narratives where the timing is the point. If a story is predicated on a prophecy fulfilled in a specific generation, or a covenant made a specific number of years before a temple is built, removing the date collapses the theological or ideological architecture. In such cases, the anchoring is load-bearing, not for the truth of the event, but for the function of the text. Thus, the removal test distinguishes not between truth and falsehood, but between stories that are essentially timeless and those that are essentially chronological.

  When we apply this to the three cases you mention, we find a spectrum of consensus and contestation that mirrors your theoretical distinction. Let us start with the Trojan War, as it is perhaps the most settled of the three among specialists. There is a broad consensus among archaeologists and historians that a conflict or series of conflicts took place at the site of Hisarlik in the late Bronze Age, roughly around the twelfth century before the common era. The narrative of the Iliad, however, does not depend on this dating to function as poetry; the removal of the specific chronology would not destroy the epic. The anchoring of the war to a specific date was largely the work of later Greek reckoning, such as that of Eratosthenes, who sought to fit the heroes into a pan-Hellenic timeline. Here, the anchoring is a later imposition upon a tradition that was originally fluid. The evidential standing of the war rests on the destruction layers at Hisarlik and Hittite records mentioning Wilusa, not on the later Greek chronologies. The dates are, in your terms, ornament to the story but essential to the history-book reconstruction. We can say with reasonable confidence that a war occurred, but the specific narrative details remain in the realm of legend, and the precise year is a matter of later calculation rather than contemporary record.

  The case of the Exodus is significantly more contested and illustrates the limits of chronological anchoring as evidence. The biblical narrative provides internal anchoring, notably in the first book of Kings, which states that the exodus occurred four hundred and eighty years before the building of Solomon's temple. This looks like precise chronological anchoring, yet when subjected to your removal test, the theological and identity-forming core of the Exodus story survives perfectly well without the number. The story is about liberation and covenant, not primarily about a calendar date. Among archaeologists and historians of the ancient Near East, the consensus is that there is no direct evidence for a mass migration of Israelites from Egypt as described in the biblical text. The archaeological record in Canaan does not show a sudden influx of new culture in the relevant period, and Egyptian records are silent on such a catastrophe. There is a contested minority view that suggests a smaller group may have left Egypt and later merged with local populations, but even this relies on inference rather than direct testimony. In this instance, the chronological anchoring provided by the biblical text acts as a claim of historical coherence, attempting to place the foundation of the nation within a sacred timeline. Because the external evidence is absent, the anchoring functions as an internal theological assertion rather than an external historical coordinate. It is load-bearing for the religious identity, but it offers no evidential weight for the event as a demographic occurrence.

  Finally, we come to Arthur, which returns us to your twelfth-century chronicler. Here the distinction between the narrative and the anchoring is most acute. The romantic narratives of Arthur, the matter of Britain, would survive the removal of all dates without losing their literary power; indeed, they thrive in a timeless fairy-tale landscape. However, the claim that Arthur was a historical war-leader depends entirely on the anchoring provided by texts like the Annales Cambriae or the Historia Brittonum. These texts attempt to insert Arthur into the sequence of post-Roman British history, giving him battles and dates. The consensus among historians is that there is no contemporary evidence for Arthur's existence. He does not appear in the reliable near-contemporary source, Gildas, which is the basis of the argument from silence you noted. The anchoring in the later texts is widely regarded by specialists as a retroactive construction, an attempt to give a name and a structure to a period of oral tradition and fragmented memory. The dates are not load-bearing for the stories, but they are load-bearing for the historical hypothesis. Since the anchoring is demonstrably late and often inconsistent, it cannot bear the weight of proof. The first objection of your chronicler, regarding the apparatus of history, bites hardest here. The regnal lists and battle counts are the costume of history put upon a figure who may be mythic, composite, or entirely forgotten.

  What follows from this for your conception of evidence is, I suggest, a refinement of the category of chronological anchoring. It is not that anchoring is never evidence, but rather that it is evidence of a specific kind. It is evidence of systematisation. When a tradition is anchored, it proves that at the moment of anchoring, someone believed the event belonged in history. It is a record of the historian's intent, not necessarily the event's occurrence. Your removal test helps us separate the kernel of the tradition from the shell of the historiography. If the story survives the removal of the date, the date was likely an addition meant to legitimise the story within a scholarly or sacred framework. If the story collapses without the date, then the story was generated to explain the date or the sequence. In the case of Arthur and the Exodus, the stories survive the removal, suggesting the anchoring was secondary. In the case of dynastic lists, where the sequence is the point, the anchoring is primary.

  To conclude, then, the twelfth-century author was correct to separate the apparatus of history from the truth of history. The first objection you identified is indeed about genre, but it is a genre that makes a truth-claim. By adopting the forms of chronicle and genealogy, the writer invites the reader to treat the text as a record rather than a poem. The second objection, the argument from silence, remains the stricter evidential test, for it demands that the network of contemporary observation should have caught the event if it were of the magnitude claimed. Chronological anchoring sits between these two. It is the bridge that allows a story to cross from the realm of memory into the realm of history. But as your analysis rightly implies, building a bridge does not prove there is land on the other side. For the historian, the task is to recognise that anchoring is often an act of interpretation rather than discovery. In reading Troy, the Exodus, and Arthur, we must accept that the dates we possess are often the answers to questions asked centuries after the fact. They are settled only in the sense that we know when later people wanted these events to have happened. What is genuinely contested is whether any event lies behind the desire for that date. In the case of Troy, the balance of probability suggests yes; for the Exodus and Arthur, the silence of the contemporary record suggests that the anchoring is a monument to belief rather than a marker of fact. I hope this helps to clear the ground for you, for you have identified a distinction that is vital for anyone attempting to navigate the treacherous waters between tradition and history.
