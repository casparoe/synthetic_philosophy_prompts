answer: |-
  1. Ask who held the power to inscribe this name and what administrative function it served, since the ledger exists to manage liability rather than human life. For the wet nurse, this confirms her disappearance is a successful erasure by design, allowing you to write her vanishing as a systemic feature rather than a mystery.

  2. Determine if the missing years are a loss of evidence or a systematic exclusion of certain bodies from record-keeping protocols during periods of unrest. For the labourers, this means the gap likely mirrors strikes or unreported injuries, so you draft the scene around the fear of becoming a number rather than the specific accidents.

  3. Distinguish between information that was lost and information that was withheld as an act of sovereignty or protection against extraction. For the 1930s notebook, the blank page is an active refusal by the family, meaning filling it with invention violates the dynamic where they successfully stopped the gaze.

  4. Look for peripheral debris surrounding the void, such as wage ledgers or coroner reports, to triangulate the missing bodies through their economic or physical impact. For the dock labourers, this shifts your focus from the missing accident book to shipping manifests that prove the ships were loading, implying the labour existed even if the injury did not.

  5. Decide if your narrative authority extends to speaking for those who explicitly silenced themselves, or if the gap itself is the only truthful representation of their agency. For the 1930s notebook, this forces a hard stop where you must leave the scene unwritten, because inventing their words converts their resistance into your plot device.
