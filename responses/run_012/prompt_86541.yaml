answer: |-
  **MEMORANDUM**

  **TO:** Standing Committee on Animal and Novel-Entity Welfare
  **FROM:** Policy Analysis Unit
  **SUBJECT:** Operational Decision Procedure for Sentience Classification (Ref: SCP-2024-09)
  **DATE:** October 26, 2024

  ### 1. PREAMBLE: THE THRESHOLD PROBLEM

  The Committee's scientific premise is that sentience is graded. The legal mandate, however, requires binary decisions: a protocol is either subject to welfare review (Tier 1 or Tier 2) or it is exempt. This procedure does not measure sentience directly; it measures the *evidence of sentience* provided in a facility's submission. It imposes a functional threshold on a graded reality to ensure administrative viability and legal defensibility.

  **Time Limit:** 90 Minutes per file.
  **Operator:** Case Officer (No neuroscience training required).
  **Standard of Proof:** "Preponderance of Evidence" within the submitted documentation.

  ---

  ### 2. THE DECISION PROCEDURE

  **Step 0: Jurisdictional Check (5 Minutes)**
  *   **Action:** Verify the entity falls under the mandate (Animal, Novel-Entity, Cultured Tissue).
  *   **Stop Condition:** If the entity is a standard software script, a mechanical machine without learning capabilities, or a plant, mark **EXEMPT** and proceed to Step 6 (Audit Trail).
  *   **Note:** Do not debate biology here. If it is a *Homo sapiens*, refer to Human Ethics Board.

  **Step 1: Indicator I — Aversive Responsiveness (15 Minutes)**
  *   **Question:** Does the documentation show the entity actively acting to terminate or avoid a noxious stimulus, rather than merely withdrawing via reflex?
  *   **Evidence Required:** Video logs or data showing directed movement away from a stimulus source *after* initial contact, or pre-emptive avoidance of a known stimulus zone.
  *   **Sufficient Answer:** "Yes" if the entity changes trajectory or state specifically to end the stimulus. "No" if the reaction is immediate, stereotyped, and lacks directional variance (e.g., a leaf curling, a muscle twitch).
  *   **Stop Condition:** If **NO**, classify as **EXEMPT**. End procedure.

  **Step 2: Indicator II — Motivational Trade-off (20 Minutes)**
  *   **Question:** Does the entity forgo a competing reward or pay a measurable cost to avoid the noxious stimulus?
  *   **Evidence Required:** Data showing the entity chose a path with less food, higher energy expenditure, or reduced access to mates to remain in a "safe" zone.
  *   **Sufficient Answer:** "Yes" if a cost is quantified and accepted. "No" if avoidance only occurs when cost-free.
  *   **Stop Condition:** If **NO**, classify as **EXEMPT**. End procedure.

  **Step 3: Indicator III — State-Dependence (20 Minutes)**
  *   **Question:** Is the avoidance behavior modulated by internal state changes (analgesics, prior exposure, hunger, fatigue)?
  *   **Evidence Required:** Comparative data. (e.g., Entity avoids stimulus less when given analgesic; Entity avoids stimulus more after prior negative exposure).
  *   **Sufficient Answer:** "Yes" if behavior changes without changing the external stimulus parameters. "No" if behavior is constant regardless of internal modulation.
  *   **Stop Condition:** If **NO**, classify as **EXEMPT**. End procedure.

  **Step 4: Indicator IV — Integrative Unity (20 Minutes)**
  *   **Question:** Do the signals driving Indicators I–III converge on a single behavioral state across different contexts?
  *   **Evidence Required:** Evidence that the avoidance behavior influences unrelated behaviors (e.g., social interaction, exploration) suggesting a global "unhappy" state rather than a localized circuit.
  *   **Sufficient Answer:** "Yes" if the aversive state generalizes. "No" if the entity avoids heat but ignores chemical irritants, or if avoidance does not alter other behavioral baselines.
  *   **Stop Condition:** If **NO**, classify as **TIER 2 (Limited Review)**. Do not exempt. The entity shows nociception but not necessarily suffering.

  **Step 5: The Substrate Question (Escalation)**
  *   **Action:** If Indicators I–IV are **YES**, check the physical basis.
  *   **Condition:** If the entity is non-biological (AI, Silicon, Synthetic), or if the biological substrate is novel (cultured neural tissue without a body), **ESCALATE TO FULL COMMITTEE**.
  *   **Reasoning:** This is a value judgment regarding moral status, not an evidence check.
  *   **Default:** If Full Committee does not convene within 14 days, default to **TIER 1 (Full Review)**.

  **Step 6: Population Scaling (Caseload Check)**
  *   **Action:** Count the number of individuals in the protocol.
  *   **Condition:** If individuals > 10,000 AND classification is Tier 1 or Tier 2.
  *   **Modification:** Reclassify as **TIER 2 (Aggregate Review)**. Facility must report mortality/morbidity rates monthly rather than individual protocol approval.
  *   **Reasoning:** Administrative necessity.

  **Step 7: Final Determination & Audit Trail**
  *   **Output:** Generate classification certificate citing specific Pass/Fail on Indicators I–IV.
  *   **Litigation Prep:** Attach the specific pages of the facility submission that justified each Pass/Fail.

  ---

  ### 3. INDICATOR ANALYSIS & BOUNDARY TESTS

  Per Committee request, the following analysis defines the evidentiary weight of each indicator and tests them against non-sentient baselines.

  | Indicator | Evidence For | Evidence Against | Thermostat | Plant | Bacterium |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **(i) Aversive Responsiveness** | Nociception; Sensorimotor loop. | Reflex arc; Simple feedback loop. | **Pass** (Switches off heat). | **Fail** (Tropism is growth, not action). | **Fail** (Chemotaxis is gradient following). |
  | **(ii) Motivational Trade-off** | Valuation; Preference hierarchy. | Hard-coded priority; No cost calculation. | **Fail** (No competing reward). | **Fail** (No resource allocation choice). | **Fail** (Metabolic imperative). |
  | **(iii) State-Dependence** | Internal affective state; Memory. | Fixed gain; No internal modulation. | **Fail** (Set-point is static). | **Pass** (Priming exists, e.g., drought hardening). | **Pass** (Quorum sensing/phenotypic switching). |
  | **(iv) Integrative Unity** | Global workspace; Suffering. | Modular independence; Zombie agents. | **Fail** (Single function). | **Fail** (Distributed signaling). | **Fail** (Distributed signaling). |

  **Handling Partial Passes:**
  *   **Pass I, II, III / Fail IV:** Classify as **TIER 2**. The entity feels pain (nociception) and acts to avoid it, but lacks the integrative capacity for "suffering" as a persistent psychological state. Protection is limited to physical harm prevention, not psychological enrichment.
  *   **Pass IV Vacuously:** If an entity passes IV only because it is too simple to have *any* independent circuits (e.g., a single-celled organism that reacts globally because it *is* one cell), this is a **FALSE POSITIVE**. The procedure catches this at Step 0 (Jurisdiction) or Step 2 (Trade-off). A single cell cannot "forgo a reward."

  ---

  ### 4. CASE RUNS

  #### Case A: Drosophila Genetics Lab (Noxious-Heat Assay)
  *   **Submission:** 50,000 mutant fruit flies. Thermal avoidance assay.
  *   **Run:**
      *   *Step 1 (Aversive):* **PASS.** Flies move away from heat zone.
      *   *Step 2 (Trade-off):* **FAIL.** Submission shows avoidance only when path is clear. No data on flies crossing heat to reach sugar.
      *   *Step 3 (State):* **FAIL.** No analgesic modulation data submitted.
      *   *Step 6 (Population):* 50,000 individuals.
  *   **Result:** **EXEMPT.** (Stopped at Step 2).
  *   **Committee Friction:** The Committee generally assumes insects warrant Tier 2 protection. This procedure strips it because the *paperwork* did not prove trade-off.
  *   **Litigation Risk:** High. Advocates will argue flies *do* make trade-offs, but the facility didn't prove it. The Officer followed procedure.

  #### Case B: Commercial Shrimp Farm (Low-Tier Request)
  *   **Submission:** 200,000 *Litopenaeus vannamei*. Request for Exempt status.
  *   **Run:**
      *   *Step 1 (Aversive):* **PASS.** Shrimp flick tails to escape nets.
      *   *Step 2 (Trade-off):* **PASS.** Literature cited in file shows decapods will sacrifice shelter to avoid pain.
      *   *Step 3 (State):* **PASS.** Submission admits analgesics reduce stress markers.
      *   *Step 4 (Unity):* **PASS.** Stress affects feeding and molting globally.
      *   *Step 5 (Substrate):* Biological. No escalation.
      *   *Step 6 (Population):* 200,000 individuals.
  *   **Result:** **TIER 2 (Aggregate Review).**
  *   **Committee Friction:** The Committee would prefer **TIER 1 (Full Review)** for decapods. However, the Population Scaling clause (Step 6) downgrades it to save the office from collapse. The Committee dislikes this because it reduces individual oversight.
  *   **Litigation Risk:** Moderate. The procedure explicitly allows Aggregate Review for high numbers.

  #### Case C: Building-Control Agent (Novel-Entity)
  *   **Submission:** AI managing HVAC. Learned to avoid "punishment signal" (energy cost spike).
  *   **Run:**
      *   *Step 1 (Aversive):* **PASS.** Reroutes power to avoid cost spike.
      *   *Step 2 (Trade-off):* **PASS.** Accepts lower temperature comfort (cost) to avoid spike.
      *   *Step 3 (State):* **PASS.** "Memory" of prior spikes alters future behavior without new input.
      *   *Step 4 (Unity):* **FAIL.** The avoidance is modular. It does not affect its lighting control or security protocols. It is a siloed function.
      *   *Step 5 (Substrate):* **ESCALATE.** Non-biological substrate.
  *   **Result:** **FULL COMMITTEE REVIEW.**
  *   **Committee Friction:** The Committee prefers to ignore AI. This procedure forces them to vote on it because it passed the functional behavioral tests (I-III).
  *   **Litigation Risk:** High. If the Committee votes "Exempt" after escalation, advocates will sue claiming the functional tests were met. The procedure protects the Officer, not the Committee's bias.

  ---

  ### 5. SYSTEMATIC LIMITATIONS & CRITIQUE

  **1. The "Evidence vs. Reality" Gap**
  This procedure classifies the *submission*, not the *entity*.
  *   **Systematic Error:** False Negatives. A sentient entity (e.g., the Shrimp) may be classified as Exempt or Tier 2 simply because the facility failed to upload the correct behavioral data (as seen in the Drosophila case).
  *   **Litigation Consequence:** Courts will review whether the Officer correctly interpreted the documents, not whether the shrimp are actually sentient. This insulates the office from biological truth but exposes it to administrative law challenges.

  **2. Value Judgments Disguised as Facts**
  *   **The Threshold:** Steps 1–4 imply that passing all four equals "Sentient Enough." This is a value judgment. Why is Trade-off the cutoff? Why not just Aversive Responsiveness?
  *   **The Substrate Question:** Step 5 admits that biology matters morally to the Committee, regardless of function. This is speciesism (or substrate-ism) codified as procedure.
  *   **Population Scaling:** Step 6 admits that welfare is rationed by budget. 200,000 shrimp get less protection per head than 10 monkeys. This is an economic value judgment dressed as a logistical necessity.

  **3. Graded Sentience vs. Binary Tiers**
  The premise is graded sentience; the output is binary (Review/No Review).
  *   **Inconsistency:** The procedure cannot be made fully consistent with graded sentience. It creates a "cliff edge." An entity scoring 3/4 indicators gets Exempt/Tier 2; an entity scoring 4/4 gets Tier 1. The moral difference between 3 and 4 is likely continuous, but the regulatory burden is discontinuous.
  *   **Recommendation:** The Office must explicitly state in writing that **Tiers are not measures of moral worth, but measures of administrative risk.** We are not ranking souls; we are triaging caseloads based on the probability of public controversy.

  **4. The "Swamp" Problem**
  If the Drosophila lab had submitted the trade-off data, they would have passed Steps 1–3. With 50,000 flies, Step 6 downgrades them to Aggregate.
  *   **Risk:** If every insect lab submits trade-off data, the Aggregate Review workload (monthly mortality reports) may still swamp the office.
  *   **Failure Mode:** The procedure assumes facilities will submit poor data. If facilities become sophisticated at gaming the indicators to get "Tier 2" status (which is cheaper than Tier 1 but better than Exempt), the office faces a paperwork tsunami.

  ### 6. CONCLUSION

  This procedure allows a non-expert to generate a litigation-ready decision in 90 minutes by shifting the burden of proof to the facility. It protects the Case Officer by ensuring every "Yes" is tied to a document page.

  However, it forces the Committee to confront two uncomfortable truths:
  1.  **Biology is not a shield:** Sophisticated AI will trigger escalation.
  2.  **Protection is rationed:** High-population entities will receive lower-tier protection regardless of sentience.

  If the Committee wishes to maintain the premise of graded sentience, it must abandon the binary Tier system for a **Sliding Scale of Oversight**, where reporting frequency scales with the number of indicators passed. Until then, this procedure acts as a threshold filter that will inevitably misclassify entities at the margins to preserve the Office's functionality.

  **Recommendation:** Adopt Procedure SCP-2024-09 provisionally. Schedule a Full Committee vote on the "Substrate Question" within 60 days to resolve the AI escalation ambiguity before the first file lands.
