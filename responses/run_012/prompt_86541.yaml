      *   *Wait, re-reading prompt:* "one where it yields an answer the committee will not like and one where it withdraws protection from something the committee would rather protect."
          *   Case A (Committee dislikes answer): AI gets protection (Committee prefers biological focus).
          *   Case B (Withdraws protection): Shrimp fail due to lack of evidence in submission (Committee wants them protected).
          *   Case C (Drosophila): Needs to address the numbers issue.

  10. **Final Polish:** Ensure the tone is bureaucratic yet candid. Ensure the "90-minute" constraint is respected (i.e., rely on paperwork, not new science). Ensure the "Litigation" aspect is covered (clear audit trail).

      *(Self-Correction on "Substrate Question"):* The prompt calls it "deliberately vague." I need to operationalize it without making it up. I will define it as the "Escalation Trigger" for the Full Committee.

      *(Self-Correction on "Graded vs. Threshold"):* I need to explicitly state that this procedure *imposes* a threshold because the legal mandate requires binary decisions (Review/No Review), even if the science is graded.

  11. **Final Review against constraints:**
