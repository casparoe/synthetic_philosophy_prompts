      *   Need to test against Thermostat, Plant, Bacterium.
      *   Need to handle partial passes (1-3 yes, 4 no).

  5.  **Running the Cases:**

      *   *Case 1: Drosophila (Fruit Flies).* High numbers. Heat assay. Likely pass I, maybe II, III? IV is debatable. *Constraint:* Committee might not like the answer (maybe too much protection or too little). Let's aim for "Exempt" due to population scaling or "Tier 1" due to lack of Unity.
      *   *Case 2: Shrimp Farm.* Decapods. Usually protected. *Constraint:* Committee wants to protect, procedure might withdraw. If they can't prove Trade-off or State-Dependence in the submitted docs, they fail.
      *   *Case 3: Building-Control AI.* Novel entity. *Constraint:* Learned avoidance. Might pass I, II, III functionally. Fails Substrate? Or fails Unity?

  6.  **Addressing the "Enormous Numbers" Problem:**

      *   If millions of flies need Tier 1 review, the office collapses.
      *   Solution: Population-weighted tiers or aggregate review.

  7.  **Critique & Limitations:**

      *   Where are the value judgments? (Substrate, the threshold for "sufficient" evidence).
      *   Systematic errors? (False negatives for cryptic sentience, false positives for sophisticated robotics).
      *   Graded vs. Threshold: The procedure *imposes* a threshold on a graded premise. This is the core tension.

  8.  **Drafting the Content - Section by Section:**

      *   *Introduction:* Acknowledge the tension (graded theory vs. binary practice).
      *   *The Procedure:* Step-by-step instructions.
      *   *Indicator Analysis:* Breakdown of the 4+1 indicators.
