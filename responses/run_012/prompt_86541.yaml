      *   *(iii) State-Dependence:* Modulation by analgesics, prior exposure, competing drives (suggests internal state).
      *   *(iv) Integrative Unity:* Convergent signals guiding behavior across contexts (global workspace vs. modular).
      *   *(v) Substrate Question:* (Vague) Likely refers to biological vs. silicon, carbon-based, etc.

  3.  **Drafting the Decision Procedure (The "Algorithm"):**

      *   *Goal:* Binary output (Review Tier A, Review Tier B, or Exempt) based on graded inputs.
      *   *Structure:* Sequential filtering. If fail Step 1, stop. If pass all, escalate.
      *   *Time Limit:* 90 minutes means relying on submitted documentation, not new experiments.
      *   *Litigation Proof:* Needs clear definitions and evidentiary standards.

      *   *Step 1: Substrate & Scope (The Filter).* Is this even in mandate?
      *   *Step 2: Indicator I (Aversive Responsiveness).* Look for active avoidance vs. reflex.
      *   *Step 3: Indicator II (Trade-off).* Look for cost-bearing.
