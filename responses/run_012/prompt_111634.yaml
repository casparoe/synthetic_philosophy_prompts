    "why_it_looked_fine": "It conflates 'processing a signal' with 'consciously reading a symbol,' smuggling in a hidden homunculus that requires its own reader.",
    "error_type": "valid but a premise has to go",
    "cost_of_rejecting": [
      "Accept that some physical states have content via causal history rather than interpretation.",
      "Abandon the idea that all meaning requires a conscious reader to assign it."
    ],
    "alternative_cut": {
