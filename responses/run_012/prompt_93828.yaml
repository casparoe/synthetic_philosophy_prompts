answer: |-
  1. You draw a sharp line between guilt as a ledger and shame as identity, but I want to know if that's a structural difference or just a redescription of the old idea that guilt is about acts and shame is about the self. If guilt is just a debt to be paid, what would count as evidence that a guilt-driven agent is *not* treating morality as a schedule of prices? Is there a form of guilt that refuses discharge, or does your definition rule that out by fiat?

  2. Let's look at the behavioural signatures of these emotions. Guilt typically drives approach and repair; shame drives withdrawal and hiding. If a moral system is meant to sustain norms and fix breaches, why would you build it on an emotion whose primary impulse is to make the wrongdoer disappear?
      *   *If she argues that shame motivates deep character change:* Follow up: But does that change happen in the shadow where shame puts us, or does it require the public reintegration that shame actively blocks?
      *   *If she argues that withdrawal is a necessary pause for reflection:* Follow up: Then isn't the risk that the pause becomes permanent, leaving the victim without restitution and the community without resolution?

  3. You suggest we can trade resentment for contempt without losing moral force, but resentment holds the wrongdoer as a peer who owes us, while contempt demotes them. When you answer a wrong with contempt, aren't you effectively ejecting them from the shared normative community rather than holding them accountable within it?
      *   *Follow-up (Keyed to likely answer that contempt is appropriate for bad character):* But if the emotion itself signals they are no longer a peer, how do you invite them back without first dismantling the very shame that punished them?

  4. I'm worried about the split between feeling shame and shame being warranted. If a victim feels shame for a crime committed against them because their community expects it, your model says the standard is bad, not the emotion. But can you call a shame *warranted* without also endorsing the contempt of the audience that would produce it?
      *   *If she says warrant depends on the "ideal self" rather than the actual audience:* Follow up: But who populates that ideal self if not the very standards of the culture we're trying to critique?
      *   *If she says we can critique the audience's contempt directly:* Follow up: Then aren't you admitting that the audience-dependence of shame makes it structurally vulnerable to the very prejudices you claim are just "bad standards"?

  5. You argue the relevant audience for shame can be the self one is trying to become, which saves it from heteronomy. But if that ideal self is formed in a culture that prizes honour over dignity, how does the internalized audience differ from a internalized tyrant? At what point does "listening to your better self" become indistinguishable from "obeying your internalized oppressor"?

  6. You claim the question of whether a culture can choose its moral emotions is malformed, yet you're arguing we *should* organize around shame. If emotions are by-products of institutions and pedagogy rather than levers we can pull, how is your normative claim anything other than inert? What is the mechanism by which we get from "shame is better" to "we have more shame"?
      *   *Follow-up (Keyed to likely answer that we change institutions, not emotions directly):* But if we change the institutions, haven't we just admitted that the emotion is a dependent variable, and that your thesis is actually a claim about school design and penal policy, not moral psychology?

  7. If the emotion is a by-product, then advocating for a shame-culture is advocating for the specific institutions that produce it. Are you prepared to say that the privacy rights and individual protections we associate with guilt-cultures are costs we should be willing to shed to get the benefits of shame?

  8. Let's take this to a school setting. Suppose a school abandons detention-and-apology for a circle in which the offender must say what their conduct reveals about the kind of person they are. Which procedure does your view recommend, and specifically, what would you count as that circle going wrong?

  9. *Follow-up to Q8 (Keyed to answer that the circle has the right shape but is badly run):* If the circle goes wrong by producing cruelty, how do you distinguish that from the ledger system going wrong by producing indifference? Is there a structural reason to think the circle is safer, or is it just that you prefer the *kind* of cruelty that comes from identity-shaming over the *kind* that comes from transactional neglect?

  10. Now consider a community where a young woman is shamed for refusing an arranged marriage. The community's standard is one you likely reject, but the emotion is doing exactly what you describe: it targets her identity, it relies on the audience's regard, and it resists pricing. When you say the objection here is to the standard and not the emotion, aren't you ignoring that the *structure* of shame amplifies the harm of the standard in a way a guilt-structure would not?

  11. *Follow-up to Q10:* If you concede that shame's structure amplifies the harm, then your thesis collapses into the truism that good standards are better than bad ones. If you deny it, you seem committed to saying that if the standard were "correct," shaming her for autonomy would be morally acceptable. Which horn are you taking?

  12. Finally, you've spent a decade defending a position many find perverse. If you are right, what is the specific moral cost we must accept to live in a shame-centred society that we are currently avoiding, and are you willing to say that the price is worth it?
