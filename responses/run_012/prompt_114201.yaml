      *   *Q7 (Epistemic Objection):* Address her specific counter-argument regarding Pile 3.
          *   *Draft:* Why isn't Pile 3 just epistemic?
          *   *Refinement:* You say the fact is hidden from *us*, not the agent. Does that make moral assessment observer-relative?
      *   *Q8 (Collective Agents - *Required*):* The structural gap.
