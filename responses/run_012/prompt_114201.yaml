          *   *Tagline:* "Luck can change what you owe but not what you are."
          *   *Case Sorting:*
              1.  Careless Driver (Risk imposition wrong, outcome adds to debt only).
              2.  Gauguin (Epistemic luck about capacities).
              3.  Character Revision (Resister motivated by vanity). This is the "genuine puzzle," but she claims it's about character attribution mechanics, not responsibility paradoxes.
          *   *Response to Objection:* Standard "it's just epistemic luck" reply works for piles 1 & 2, but not 3 (fact hidden from *us*, about the *agent*).
      *   **Requirements:**
          *   9-10 questions.
          *   Ordered logically (warm $\rightarrow$ tight).
          *   Each needs a follow-up keyed to likely answers.
          *   Specific content constraints:
