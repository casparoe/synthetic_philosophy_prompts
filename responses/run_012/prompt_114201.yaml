answer: |-
  Here are ten questions designed to move from exposition to pressure points, specifically tailored to the Two-Books Account.

  ### 1. The Ledger Metaphor
  **Question:** Let's start with the architecture of the view. You describe moral assessment as running on two separate ledgers. Most philosophers try to solve moral luck by scrubbing luck out of the whole system or accepting it everywhere. You're splitting the difference. Why is the "Two-Books" metaphor necessary? What breaks if we try to merge them into a single verdict?

  **Follow-up:** You'll likely say merging them creates the paradoxes Nagel and Williams identified. If so, is the cost of solving the paradox that we lose a unified sense of the "moral self"? Or is that unity an illusion we should be happy to discard?

  ### 2. Book One and the Careless Driver
  **Question:** Let's walk through Pile One, the careless driver cases. On your view, the driver who hits a child and the driver who doesn't have identical entries in Book One because the outcome wasn't accessible to them at the time of the risk. But intuitively, we treat them differently. Does Book One capture *blameworthiness*, or is it something thinner, like *norm violation*?

  **Follow-up:** If it's just norm violation, does Book One risk becoming too bureaucratic? If two people violate the same norm but one causes a tragedy, saying they are "morally identical" in Book One feels like it ignores the gravity of the harm. How do you square that emotional reality with your ledger?

  ### 3. Constitutive Luck and Accessibility (*Required Topic*)
  **Question:** I want to press on Book One's criterion: "norms she could reasonably have been expected to access." That depends heavily on her education, her cognitive capacities, her upbringing. Isn't that just constitutive luck moving house? If who she *is* fixes which norms she can access, haven't you just pushed the luck upstream rather than eliminating it?

  **Follow-up:** You'll probably argue that we must start assessment *somewhere* and the agent's own perspective is the only non-arbitrary starting point. But if that starting point is itself a product of luck, doesn't that make Book One's "luck-free" status merely stipulative rather than substantive?

  ### 4. Book Two and the Normative Force of Debt
  **Question:** Moving to Book Two: this is where the luck lives. You say the driver who kills owes more in restitution than the driver who doesn't. You insist these are debts, not deserts. But if I don't *deserve* to pay more—because my Book One record is identical to the lucky driver—what is the normative force of the debt? Why *must* I pay if it's not a matter of moral desert?

  **Follow-up:** If the answer is "because the harm occurred," aren't we just describing a causal liability scheme, like strict liability in tort law? What makes Book Two *moral* rather than just financial or legal?

  ### 5. The Role of Desert (*Required Topic*)
  **Question:** That leads to the role of desert in your system. You say luck changes what we owe, not what we are. But if Book One defines "what we are" and is luck-free, and Book Two defines "what we owe" and is luck-drenched, what work is the concept of desert actually doing for you? Is it obsolete?

  **Follow-up:** If desert is obsolete, does that mean punishment is unjustified? If I don't deserve punishment (Book One) but I owe a debt (Book Two), can the state permissibly punish me to collect that debt, or does punishment require desert?

  ### 6. Pile Three and Character Revision
  **Question:** Let's look at Pile Three, the cases where we revise our read on someone's character after the fact—like the resister who turns out to have been motivated by vanity. You call this the only genuine puzzle. You argue this isn't about responsibility, but about how we attribute traits. But if our attribution of their character changes based on outcomes, haven't you contradicted your tagline that luck doesn't change "what she is"?

  **Follow-up:** You might say character is partly constituted by what actions produce. But if the *fact* of her vanity was present all along, why does the *outcome* matter for the attribution? Are you saying character is retroactive?

  ### 7. The Epistemic Objection
  **Question:** You distinguish your view from the standard "moral luck is just epistemic luck" objection. You say that works for Piles One and Two, but not Three, because in Pile Three the fact is hidden from *us*, not the agent. Does this make moral assessment observer-relative? Is the agent's moral reality different from the community's assessment of it?

  **Follow-up:** If the agent knows her own motives but we don't, and we judge her differently based on outcomes, are we simply wrong? Or is there a sense in which our outcome-based judgment is *more* correct than her internal self-assessment?

  ### 8. Collective Agents (*Required Topic*)
  **Question:** I want to test the limits of the individual ledger. Consider a corporate decision where a group causes harm, but the diffusion of responsibility means no single individual's Book One records a violation—everyone followed procedure, but the system failed. Does your account have resources for collective debt where there is no individual Book One breach?

  **Follow-up:** If you say the Group has a Book Two debt but no individual has a Book One violation, doesn't that create a moral ghost? Who writes the check? If no individual is at fault in Book One, how can the collective be liable in Book Two without punishing the innocent members?

  ### 9. The "Dodge" Question (*Flagged*)
  **Question:** **<u>FLAGGED AS THE DODGE:</u>** You've built a system where Book One protects the agent's self-conception from luck, and Book Two manages the social fallout of luck. But isn't the real motivation here just to protect philosophers from the uncomfortable conclusion that we are never truly responsible? Is the Two-Books account a theoretical solution, or a therapeutic one designed to let us keep our intuitions without paying the metaphysical price?

  **Why she will dodge this:** This question challenges the *motivation* behind the theory rather than the mechanics. It suggests the theory is an ad hoc patch to save intuition rather than a discovery of moral truth. Philosophers prefer to debate premises and conclusions, not psychoanalyze the theoretical impulse. She will likely pivot back to the "coherence of the ledgers" rather than admitting the theory might be motivated by a desire to salvage responsibility.

  **Follow-up:** If she pivots: Let's assume it is therapeutic. Is there anything wrong with a moral theory that prioritizes psychological coherence over metaphysical purity? Or does that concede that the theory is pragmatic, not true?

  ### 10. Falsifiability
  **Question:** Closing out: Philosophical views often live in a space where they are consistent but not necessarily testable. What would actually change your mind? Is there a case, a thought experiment, or a real-world scenario where the Two-Books account would force you to merge the ledgers?

  **Follow-up:** If you say "nothing would merge them," does that mean the separation is an axiom for you? And if it's an axiom, how do we argue against it other than by appealing to competing intuitions?
