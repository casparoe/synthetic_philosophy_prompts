              *   At least one on Collective Agents (Group wrong, no individual Book One record).
              *   Flag the question she'll most want to dodge + why.
              *   Closing question on what would change her mind.
              *   No softballs/bio questions.

  2.  **Deconstruct the Theory for Vulnerabilities/Interest Points:**
      *   *Book One Accessibility:* If norms depend on what she could "reasonably access," doesn't her upbringing/constitution (constitutive luck) determine that access?
      *   *Book Two Debts:* If I owe more because of bad luck, but I'm not "worse," what is the normative force of the debt? Is it just pragmatic?
      *   *Pile 3 (Character):* If we revise character based on outcomes, doesn't that affect "what she is," contradicting the tagline?
      *   *Collective Action:* If a corporation pollutes, but no individual violated Book One norms, where does the debt lie?
      *   *Desert:* She explicitly separates debt from desert. But why do we care about Book Two if not because we think they *deserve* to pay?

  3.  **Drafting the Questions (Iterative Process):**

