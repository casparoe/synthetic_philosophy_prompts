          *   *Selection:* I'll flag the Desert question (Q5) or a specific variation of it as the dodge. Actually, the "Collective" question might be harder if she hasn't thought about it. But the prompt asks me to flag *one* of the generated questions. The Constitutive Luck one (Q3) is usually the standard "gotcha" philosophers expect. The Desert one (Q5) cuts to the normative heart. Let's make the "Dodge" about the *normative force* of Book Two. If it's not desert, why *must* I pay?
          *   *Decision:* I will flag Q5 (Desert) as the dodge because it threatens the coherence of the whole system. If debts aren't deserts, they look like taxes.
