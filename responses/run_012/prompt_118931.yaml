      14 October 2023
      St. Aldwin's, Marrowfield
      From the Desk of the Rev. Martin Ashby

      Dear Congregation,

      Many of you have seen the recent correspondence from the Diocese regarding our Statement of Faith. Specifically, they have asked us to say plainly where we stand on the clause asserting that something happened to a body on the third day. I understand the anxiety this produces. We are accustomed to speaking of the Resurrection as an event in history, but the Council has adopted a rule, which it calls the translation test, to clarify our doctrinal sentences. The rule is simple: any doctrinal sentence which can be restated as a claim about what did or will happen in the world is to be rejected as a category mistake.

      If we say "Christ rose," and mean a corpse stood up in space and time, we are making a hypothesis vulnerable to evidence. But religious conviction is not a hypothesis. It belongs to a form of life. Therefore, when we affirm the Resurrection, we are not describing a past occurrence that might have been filmed; we are expressing a commitment that governs how we live now. The Diocese wants realism. We offer grammar.

      This has required adjustments. A small committee now vets hymn texts for the same fault. Lines suggesting God intervenes in weather or politics are being revised to reflect internal spiritual states rather than external causality. I know this feels like a loss. I feel it myself. When I stand at the lectern, there is a temptation to say "He is truly here" and mean a physical presence. I must stop myself. To mean it physically would be to risk being wrong. And faith cannot be wrong, because it does not compete with science.

      I must also address a letter from Mrs. Ada Boyce, who asked whether she will see her late husband again, in any sense she would recognize. This is the hardest question. I want to comfort you, Ada, but I cannot promise a reunion in space and time. That would be a hypothesis. Instead, I can say that the grammar of "seeing" within our form of life remains valid. To say "I will see him" is to express a hope that structures your grief, not a prediction of optical experience. It is warm, but it is not a map of the future.

      There is a faction on the council, whom I privately think of as the plain-sense party, who wants the old wording restored. They argue that if nothing happened to a body, our faith is empty. But if something happened to a body, our faith is merely probable. We choose certainty over probability. We still remit money to the mission society, not to convince others of facts they deny, but to invite them into a practice where such denials lack sense. The atheist who denies God is not contradicting us; he is playing a different game. We do not fight him; we pity his grammar.

      Please understand that this protects us. If the tomb was empty, it could be filled. If the tomb is a symbol, it is secure. I know this costs us the comfort of realism. I know it makes us sound like we are speaking in circles. But circles are safe.

      Yours in practice,
      Martin Ashby

