  This is a classic underdetermination problem. Mira's data set contains a tension between her ruling on *lexical triggers* (Case 2: 'but' is word-borne) and her ruling on *explicit disavowal* (Case 4: disavowal blocks speaker meaning). The new case forces these two precedents to collide.

  Here is the breakdown of the rules she could be running, what they predict, and how to force her hand.

  ### 1. The Three Competing Rules

  **Rule A: The Lexical Priority Rule (Word-Borne Dominance)**
  *   **Principle:** Content triggered by specific lexical items (like 'but', 'therefore', 'manage to') is encoded in the language system. It is "word-borne." Because it belongs to the code, not the agent, a speaker's sincere intention cannot cancel it without creating a contradiction or pragmatic anomaly.
  *   **Fits Precedents:** Perfectly fits **Case 2** ('but' carries contrast). Fits **Case 1 & 6** (conversational implicatures, which are *not* lexically triggered, *are* cancellable).
  *   **Prediction for New Case:** The contrast **remains**. The utterance is infelicitous or paradoxical (like Moore's Paradox), but the content is still there. The speaker is committed to the contrast by virtue of using 'but', regardless of her disavowal.
  *   **Verdict on "Speaker Implicates":** She will likely say, "The *utterance* implicates the contrast (word-borne), but the *speaker* has tried to opt-out. Because it is word-borne, the opt-out fails."

  **Rule B: The Intentionalist Rule (Speaker-Borne Dominance)**
  *   **Principle:** "Speaker meaning" is ultimately defined by the speaker's communicative intention. Lexical items are merely tools. If a speaker explicitly and sincerely disavows a content, they cannot be said to mean it. The lexical item is treated as a slip, a stylistic flourish, or empty noise.
  *   **Fits Precedents:** Perfectly fits **Case 4** (disavowal blocks implicature). Fits **Case 1, 3, 5, 6** (all rely on context/intention to determine meaning). It requires re-interpreting **Case 2** slightly: in Case 2, there was no disavowal, so the word successfully signaled the intention.
  *   **Prediction for New Case:** The contrast **vanishes**. The disavowal overrides the lexical cue. The 'but' is treated as if it were 'and'.
  *   **Verdict on "Speaker Implicates":** "No. The speaker explicitly denied it. Therefore, there is no speaker-implicature of contrast."

  **Rule C: The Cancellability Diagnostic Rule (Methodological)**
  *   **Principle:** The *reaction* to the disavowal determines the classification. This isn't a rule about what happens, but a rule about how to *test* the category. If the disavowal creates a contradiction, the content was Word-Borne. If the disavowal flows smoothly, the content was Speaker-Borne.
  *   **Fits Precedents:** Fits **Case 1** (cancellation worked $\rightarrow$ Conversational). Fits **Case 2** (implicitly, cancellation would fail $\rightarrow$ Conventional). Fits **Case 4** (cancellation worked $\rightarrow$ Conversational).
  *   **Prediction for New Case:** She will treat the new case as an experiment. She will say: "If this sounds contradictory, 'but' is word-borne. If it sounds fine, 'but' is speaker-borne."
  *   **Verdict on "Speaker Implicates":** "It depends on the intuitions about felicity. But given my ruling in Case 2, I expect it to be contradictory, meaning the contrast persists as word-borne."

  ### 2. Which Precedent is Closest?

  **Case 2 is the closest precedent.**
  Why? Because Case 4 is a general rule about *conversational* implicatures (Treasurer dishonesty is inferred from relevance, not a specific word). Case 2 is a specific ruling on the lexical item 'but'. In linguistics, specific lexical rulings usually trump general pragmatic principles. If Mira allows Case 4 to override Case 2, she undermines her own distinction between "word-borne" and "speaker-borne." To maintain the category of "word-borne implicature," she must admit that word-borne content resists the cancellation that works on speaker-borne content.

  ### 3. The Further Case (To Force a Choice)

  To force Mira to choose between **Lexical Priority (A)** and **Intentionalist Priority (B)**, you need a case where the lexical trigger is present, but the context makes the content absurd *without* explicit disavowal. This removes the "sincerity" variable and tests the lexical encoding directly.

  **The Case:**
  > A speaker is describing a world where poverty is biologically linked to honesty (e.g., a sci-fi scenario). She says:
  > *"In this society, everyone is poor but honest. In fact, poverty causes honesty."*

  *   **If Rule A (Lexical) wins:** The sentence is infelicitous/contradictory. 'But' encodes tension; asserting a causal link contradicts the tension. The word dictates the meaning.
  *   **If Rule B (Intentional) wins:** The sentence is fine. The speaker intends 'but' to mean 'and' or is using it stylistically. The context dictates the meaning.

  **Alternative (The Projection Test):**
  > *"If she is poor but honest, she will succeed."*
  > Does the contrast (that poverty and honesty are in tension) project out of the conditional?
  > *   **Rule A:** Yes. Word-borne content projects.
  > *   **Rule B:** No. Speaker meaning is context-bound to the assertion.

  ### 4. The Bet and The Principle

  **My Bet:** Mira will say the contrast **remains** (Rule A).

  **Why?**
  1.  **Disciplinary Bias:** She is a linguist, not a philosopher. Philosophers (like Grice or later intentionalists) tend to prioritize the speaker's mind (Rule B). Linguists (especially those working on conventional implicature like Potts, Karttunen, or Bach) tend to prioritize the lexical encoding and the compositional semantics (Rule A).
  2.  **Theoretical Consistency:** She has already gone on record in Case 2 that 'but' is *word-borne*. If she rules that a speaker can cancel a word-borne feature simply by saying "I don't mean it," she effectively collapses the distinction between word-borne and speaker-borne. To keep her dissertation chapter coherent, she must argue that word-borne content is *robust* against cancellation.
  3.  **The "Unified Test":** Her goal is a test for when something is speaker-implicated. If the contrast remains despite the disavowal, it proves it is *not* speaker-implicated. This gives her a clean diagnostic: **If explicit disavowal fails to cancel, it's word-borne. If it succeeds, it's speaker-borne.**

  **The Principle She Adopts:**
  *   **If she says Contrast Remains:** She adopts the principle of **Lexical Commitment**. By using a word, the speaker inherits its conventional commitments, even against their stated intention. (Principle: *Use binds you.*)
  *   **If she says Contrast Vanishes:** She adopts the principle of **Communicative Sovereignty**. The speaker's overt intention is the final arbiter of meaning; words are merely fallible tools. (Principle: *Meaning is in the head.*)

