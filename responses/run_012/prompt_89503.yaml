  ### Preliminary Analysis: Brainstorming Implications

  Before constructing the essay, I will catalogue the potential implications of your tutor's "Ceiling/Floor" distinction. I have categorised each by its source: whether it flows from the **Thesis** (the content of the claim), the **Epistemic Status** (the fact that the Ceiling is unprovable/informal), or **Habitual Use** (how the thesis is deployed in wider discourse). I have then ranked them by philosophical importance.

