  ***

  ### Essay: The Epistemic Asymmetry of the Church–Turing Thesis

  **Introduction**

  Your tutor's distinction between the "Ceiling" and "Floor" claims of the Church–Turing Thesis (CTT) offers a precise topological map of a landscape that is often treated as flat. By separating the claim that *all* effective procedures are Turing-computable (Ceiling) from the claim that *all* Turing-computable procedures are effective (Floor), we expose a profound epistemic asymmetry. As your tutor noted, the Floor is analytic relative to the idealisations involved; the Ceiling, however, is a substantive claim linking a formal class to an informal intuition.

  Adopting the perspective of a philosopher of logic, I argue that this asymmetry is not merely a pedagogical device but the key to unlocking the thesis's deepest philosophical consequences. The fact that the Ceiling claim is in principle unprovable—because it bridges the formal/informal divide—does not render it weak. Rather, it reconfigures our understanding of mathematical justification, the determinacy of logical concepts, and the limits of mechanistic explanations of mind. The following analysis ranks these implications by their foundational importance, beginning with the epistemology of the thesis itself and moving outward to its applications.

  **1. The Epistemology of Conceptual Stability**

  The most significant implication of the tutor's distinction concerns the nature of mathematical justification. In standard mathematical practice, truth is secured by proof. Yet, the Ceiling claim ("Effective $\subseteq$ Turing") is universally accepted by logicians despite being, as your tutor correctly identifies, unprovable. There is no formal derivation available because the left-hand side ("effectively calculable") is not a formal predicate.

  This situation implies that a specific category of mathematical knowledge rests not on deduction, but on **conceptual stability**. We accept the Ceiling claim because every attempt to formalise "effective calculability" via distinct intuitive routes (recursive functions, lambda calculus, register machines, Post systems) has resulted in the same extensional class. This "convergence of evidence" functions as a form of abductive justification.

  The implication here is anti-formalist: it suggests that the content of mathematical concepts can outstrip their formalisations. If the Ceiling claim were merely a definition (as Carnap might have it), there would be no epistemic weight to bear. But because we treat it as a discovery about the limits of calculation, we acknowledge that the informal notion of "algorithm" has a robustness that allows us to recognise its extension even without a formal intension. This challenges the view that all legitimate mathematical knowledge must be derivable within a formal system. It posits a realm of "informal rigour," to use Kreisel's term, where we can be certain of a boundary without a formal map to draw it.

  **2. The Determinacy of 'Effective Procedure'**

  Closely following from the epistemic status of the Ceiling claim is the implication for the determinacy of the concept "algorithm." For the Ceiling claim to be true, the class of effectively calculable functions must have a sharp boundary. There must be a fact of the matter about whether a given informal procedure counts as "effective," such that it either falls inside or outside the Turing-computable set.

  However, the informal notion of an "effective procedure" is rooted in natural language and human practice, which are typically vague. This generates a tension: the CTT presupposes a sharp extension for a seemingly vague concept. If "effective calculability" is subject to Sorites-style vagueness (e.g., at what point does a rule become too complex for a human to follow unambiguously?), then the Ceiling claim lacks a truth value.

  The implication is that logicians are committed to a form of **semantic precision** regarding human agency that may not be linguistically warranted. To maintain the CTT, we must treat "idealised human agent" as a rigid designator with precise limits, effectively stipulating away the vagueness of human cognition. This implies that when we do computability theory, we are not analysing actual human psychology, but a Platonic ideal of "finitary reasoning." If one rejects this idealisation, the Ceiling claim collapses into empirical contingency.

  **3. Philosophy of Mind and Computationalism**

  Moving from the foundations of logic to the philosophy of mind, the Ceiling/Floor distinction serves as a critical filter for Computational Theory of Mind (CTM). CTM often argues that thinking is computation. Proponents frequently invoke the CTT to suggest that if the mind processes information effectively, it is equivalent to a Turing machine.

  Here, the epistemic asymmetry is crucial. The **Floor claim** supports the idea that a Turing machine is a valid model of rule-following. However, the **Ceiling claim** is required to support the stronger assertion that *nothing else* but a Turing-equivalent system could model the mind.

  Because the Ceiling claim is unprovable and relies on an informal notion of "effectiveness," arguments for CTM that rely on CTT are not deductive proofs but analogical conjectures. If human cognition involves processes that are "effective" in a sense that exceeds the Turing formalisation (perhaps involving continuous dynamics or quantum effects that an idealised human could theoretically harness), the Ceiling claim would be false relative to that richer notion of effectiveness.

  Therefore, the implication is that **CTT cannot serve as a bridge law** reducing mental states to Turing machine states. It can only establish that the mind is *no more than* a Turing machine if we independently accept that human cognition is bound by the specific constraints of the informal "effective procedure" definition (finitary, discrete, unambiguous). The unprovability of the Ceiling leaves logical space for non-classical cognitive architectures without contradicting logic itself.

  **4. Absolute Undecidability and the Limits of Knowledge**

  In the philosophy of mathematics, the CTT is often invoked to translate formal undecidability into absolute unsolvability. We prove that the Halting Problem is undecidable *for Turing Machines*. To conclude that there is *no possible method* for a human to solve the Halting Problem, we must invoke the Ceiling claim: since all human methods are Turing-computable, and no TM solves the Halting Problem, no human can solve it.

  The implication of the tutor's distinction is that **absolute undecidability is conditional**. It is conditional on the truth of the Ceiling claim. While formal undecidability is a theorem (epistemically secure), absolute undecidability is a philosophical thesis (epistemically open).

  This does not weaken the result significantly, given the robustness of the Ceiling claim, but it clarifies the modal force of the limitation. We are not saying the Halting Problem is unsolvable in all possible worlds; we are saying it is unsolvable in all worlds where the concept of "effective calculation" aligns with Turing computability. This preserves a distinction between *logical* limits and *conceptual* limits. It reminds us that undecidability results are limits on a specific *kind* of reasoning (finitary, symbolic), not necessarily limits on knowledge *simpliciter*.

  **5. Hypercomputation and Physical Realisability**

  Finally, the unprovability of the Ceiling claim implies that **Hypercomputation** (computation exceeding Turing power) is not logically impossible, only conceptually excluded by the current consensus on "effectiveness."

  If the Ceiling claim were a theorem, hypercomputation would be a contradiction in terms. Since it is a thesis linking a formal model to an informal intuition, hypercomputation remains a coherent hypothesis. This is particularly relevant in physical contexts. If the physical universe allows for processes (e.g., certain solutions to Einstein's field equations involving Malament-Hogarth spacetimes) that can decide the Halting Problem, and if a human agent could harness these, the Ceiling claim would be empirically falsified.

  The implication is that the CTT is not a law of nature, but a law of *logic* (or conceptual coherence). Distinguishing the Ceiling from the Floor allows us to separate *mathematical* computability from *physical* computability. The Floor claim ensures TMs are physically intelligible (in principle); the Ceiling claim asserts they are physically exhaustive. Rejecting the Ceiling allows for a philosophy of mathematics where the "effective" is contingent on the physical laws of the actual world, a view known as the "Physical Church-Turing Thesis," which stands in contrast to the "Mathematical Church-Turing Thesis" your tutor has outlined.

  **A Note on the "Triviality" of the Floor**

  I must flag one area where a reasonable philosopher might dissent from your tutor's framing. She describes the Floor claim (Turing $\subseteq$ Effective) as "close to trivial." This holds only under the specific idealisation of "unbounded time and paper."

  A strict **finitist** or **physicalist** could argue that because a Turing machine requires a potentially infinite tape, it is not physically realisable, and therefore no physical agent can actually execute every Turing-computable function. On this reading, the Floor claim is not trivial but false for any embodied agent. However, within the context of the philosophy of mathematics, where we deal with idealised agents, your tutor's assessment stands: the definition of a TM is constructed specifically to match the informal constraints of effective procedure. The Floor is true by design; the Ceiling is true by discovery.

  **Conclusion**

  The Church–Turing Thesis is often presented as a monolithic definition. Your tutor's Ceiling/Floor distinction reveals it to be a complex epistemic hybrid. The most important implication of this situation is that it forces us to acknowledge a tier of mathematical certainty that is not derived from proof but from the convergence of conceptual analysis.

  This asymmetry ripples outward: it renders the determinacy of "algorithm" a necessary presupposition rather than a linguistic fact; it weakens the deductive force of computationalism in the philosophy of mind; and it clarifies that undecidability results are limits on a specific conceptual framework rather than absolute barriers to knowledge. By recognising that the Ceiling claim is unprovable, we do not diminish the thesis; we locate its true power not in its logical necessity, but in its remarkable ability to codify the limits of human reason. We accept the Ceiling not because we have proved it, but because we cannot conceive of a coherent notion of "calculation" that breaks it. That is a philosophical insight, not a mathematical theorem.
