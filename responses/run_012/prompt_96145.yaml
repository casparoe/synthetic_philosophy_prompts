  suppress the **Want**.

  Another kind of **Want**,
  calling out a **Name**,
  wearing a new **Face**,
  filling a **Body**,
  lifting a **Hand**,
  claiming a **Place**.

  Is that my **Place**?
  Driven by such **Want**,
  moving the **Hand**,
  signing the **Name**,
  stretching the **Body**,
  masking the **Face**.

  Look closely at the **Face**,
  shift the light in the **Place**,
  ache in the **Body**,
  follow the familiar **Want**,
  forget the given **Name**,
  let go the **Hand**.

  Open up the **Hand**,
  smooth down the **Face**,
  whisper the **Name**,
  leave the empty **Place**,
  deny the sudden **Want**,
  abandon the **Body**.

  Who wears that **Body**,
  Reaches with that **Hand**,
  Feels that **Want**,
  Sees that **Face**,
  Stands in that **Place**,
  Bears that **Name**.

  There is no law binding **Name** to **Body**,
  Save the **Place** I lend to every **Hand**,
  Save the **Face** I give to every **Want**.

  \answer{The poem claims that identity across worlds is not a discovered fact of shared substance but a chosen relation of resemblance imposed by the speaker.}
