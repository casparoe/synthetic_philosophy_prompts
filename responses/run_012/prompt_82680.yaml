prompt: |-
  I'm a backend engineer with no real philosophy backround, and I've fallen down a rabit hole on this "pragmatic encroachment" thing -- the idea that whether you count as *knowing* something depends on how much is riding on being wrong, not just on your evidence. I want a satire about it, and I'd like you to write it.

  Give me an internal policy document from a mid-size company that has actually implemented this: a "Knowledge Attribution and Deployment Standards" handbook section, deadpan corporate voice, 600-700 words, numbered clauses, a short FAQ at the end, and at least one quoted dissent from a skeptical internal auditor who insists stakes have nothing to do with knowledge. The comedy should come from the view being true inside the world of the document, not from inventing anything: the same engineer with the same passing test results *knows* the migration is safe on a Tuesday and doesn't know it on a Friday when the revenue at risk is bigger; there's a form you fill out declaring your stakes before you're allowed to say "I know"; promotion criteria quietly reward people who keep their stakes low; the auditor's objection gets filed and ignored. Let the real objections land without ever stating them -- who gets to set the stakes, whether this turns "I know" into a negotiating position, what happens when two people with identical evidence get opposite verdicts, and whether any of it survives if you think knowledge is just about evidence.

  Be specific and committed: pick one account of how the stakes actually do the work -- do they raise the bar your evidence has to clear, or change what the word "know" means, or something else entirely -- and build the whole document around that choice instead of hedging or writing it so it could be about any of them. Then, in a short note after the document, tell me where the piece takes liberties with the actual debate or leans on a contested reading, so I know what a philosopher would push back on. American English.
