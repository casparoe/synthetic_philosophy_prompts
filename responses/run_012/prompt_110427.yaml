      *   *No flattery:* Point out where DBs assume away the hard problems.
      *   *Commitment:* Must take a stand.

  10. **Final Polish:** Ensure the distinction between "Entity" (in ER sense) and "Entity" (in metaphysical sense) is clear. Ensure the "Equivalence Relation" point is technically accurate (DBs enforce it via PK/FK, CT violates it).

  *(Self-Correction on "Commitment")*: I need to be careful not to just say "Metaphysics is bad." I need to say "The DB model shows X about the metaphysics."
  *Decision:* I will argue that the translation vindicates **Counterpart Theory** as the only model that respects the *isolation* of possible worlds (like shards), but that the persistence of the TWI intuition reveals a **defect in the database vocabulary**: it lacks a native type for *first-person perspective*. The metaphysical dispute is real, but it is not about the data; it is about the query context.

