      *(Final check on the "Strict" definition)*: Ensure I clearly state that if *any* cause is removed and the effect fails, it's not strict overdetermination. In this case, remove Schabowski's slip -> Effect (that night) likely fails. Remove Soviet signal -> Guards might shoot. So, no strict overdetermination.

