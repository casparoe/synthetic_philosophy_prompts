          *   *Test:* Had Schabowski not misspoken, would the Wall have come down *that night*?
          *   *Scenario A (Yes):* The pressure was so high it would have burst elsewhere. -> Schabowski is not a cause (by standard counterfactual theory). This feels wrong intuitively. He *did* cause it.
          *   *Scenario B (No):* It needed that specific spark. -> Then the structural causes weren't sufficient. -> No overdetermination.
          *   *Preemption:* This fits better. The structural causes were "standing by" (like a backup assassin). Schabowski fired the shot first. The structural causes were *ready* to produce the effect (maybe a week later, maybe via a different breach), but Schabowski *preempted* them.
          *   *Type of Preemption:* Late preemption? The structural causes hadn't yet produced the effect when Schabowski did. Trumping? Schabowski's order overrode the need for structural pressure to reach a tipping point.
          *   *Insight:* The "overdetermination" label often hides a preemption structure in history. We say "it was bound to happen" (structural sufficiency) but also "this specific moment mattered" (trigger).

      *   **Section 4: Concept Transfer (Determinism vs. Probability).**
          *   Metaphysics likes sufficiency/determinism. History deals in probabilities/dispositions.
          *   Can we define "Historical Overdetermination"?
