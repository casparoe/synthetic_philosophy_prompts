          *   *What historians do:* When they say "overdetermined," they usually mean "highly probable due to multiple converging pressures," not "metaphysically guaranteed by multiple sufficient causes."

      *   **Section 5: Closing on the Concept.**
          *   Metaphor or Abstraction? It's a metaphor borrowed from metaphysics that gets stretched. The metaphysical notion requires token sufficiency which history rarely offers.
          *   However, the historical usage points to something real: *causal density*.
          *   *Silence:* Causation doesn't explain meaning. It doesn't tell us about the joy of the crowd, the moral collapse of the regime, or who is responsible (Schabowski vs. Gorbachev).
          *   *Defect or Boundary?* Boundary. Causal analysis explains *how* it happened, not *what it meant*. Overdetermination specifically obscures individual responsibility (if everything caused it, no one caused it).

  4.  **Review and Refine:**
      *   *Check Constraints:* Did I use outside facts? (No, stuck to the prompt's summary). Did I survey authorities? (No, argued directly).
      *   *Tone:* Analytical, philosophical, rigorous.
      *   *Flow:* Ensure the transition from strict definition to historical application is smooth. Make sure the distinction between "falling eventually" and "falling *that night*" is clear, as that's the crux of the counterfactual problem.
      *   *Self-Correction on Preemption:* Be careful not to over-complicate the preemption types. Stick to the prompt's suggestion (early/late/trumping) but apply it simply. The structural causes were "standing ready." That sounds like late preemption (the process was underway but hadn't finished).
      *   *Refining the "Overdetermination" verdict:* I need to be firm. Strictly speaking, it is *not* overdetermined. It is a conjunctural cause where the trigger was the final necessary piece. Calling it overdetermined is a claim about *robustness*, not sufficiency.

  5.  **Final Polish:** Check the argument against the prompt's specific questions.
      *   Fix concept? Yes.
      *   Map causes (INUS)? Yes.
