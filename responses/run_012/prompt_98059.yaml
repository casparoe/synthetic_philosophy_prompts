          *   *Decision:* I need to be precise. If I call it overdetermined in the strict sense, I claim the Soviet signal *alone* would have dropped the Wall that night, AND the demonstrations *alone* would have, AND Schabowski *alone* would have. That seems false. So, strictly speaking, it's *not* overdetermined. It's conjunctural.

      *   **Section 2: Mapping the Causes (INUS analysis).**
