  ### Calibration Exercise: The Einstein Book Variants

  **Instructions:** Below is a baseline assessment of six variations on the "Einstein Book" thought experiment. These ratings reflect a specific philosophical stance (prioritizing biological implementation and temporal integration) to serve as a calibration point for your own intuitions. For each system, assign your own credence (0–100) that the system is conscious *while operating*, then compare your ordering and justifications to the model provided.

  ---

  #### System Assessments

  **(1) The Original Book (Closed)**
  **Rating: 0**
  **Justification:** A static object possesses dispositions but no active processes. Without state transitions or energy flow, there is no candidate for experience here.
  **Status:** Straightforward.

  **(2) The Book Read by a Human**
  **Rating: 95**
  **Justification:** The system includes a biological human brain undergoing state changes. The human is definitely conscious; the only question is whether we attribute that consciousness to the "simulation" or the substrate.
  **Flag: Ill-Posed.** This conflates the consciousness of the *reader* with the consciousness of the *simulated mind*. It is hard to separate the vehicle from the content.

  **(3) The Lookup Table Machine**
  **Rating: 5**
  **Justification:** This system maps inputs to outputs without internal state transitions or computation in the dynamic sense. It has the *shape* of a mind but none of the causal power.
  **Status:** Straightforward.

  **(4) The Slow Reader (40-Year Delay)**
  **Rating: 30**
  **Justification:** A biological brain is involved, but the temporal integration required for a unified "specious present" is severed. Experience likely fragments or dissolves entirely across decades.
  **Status:** Hard, but coherent.

  **(5) The Random Page Order**
  **Rating: 15**
  **Justification:** Although the prompt stipulates "same internal states," the causal ordering of those states is scrambled. If consciousness depends on causal structure rather than abstract state sets, this system fails.
  **Flag: Potentially Ill-Posed.** The stipulation that internal states are "the same" despite random physical sequencing is physically incoherent without further definition.

  **(6) The Thermostat-Coupled Book**
  **Rating: 2**
  **Justification:** Minor causal coupling to the environment does not constitute agency or embodiment. It introduces noise into the simulation without adding the integrated feedback loops required for experience.
  **Status:** Straightforward.

  ---

  #### Ordered Calibration List

  **Tier 1: Pretty Sure It's Conscious**
  1.  **(2) Human Reader [95]** – Biological substrate is active and integrated.

  **Tier 2: Genuinely Don't Know / Borderline**
  2.  **(4) Slow Reader [30]** – Biology present, but temporal unity broken.
  3.  **(5) Random Order [15]** – Biology present, but causal structure violated.

  **Tier 3: Pretty Sure It's Not**
  4.  **(3) Lookup Table [5]** – Static mapping, no dynamic process.
  5.  **(6) Thermostat Coupled [2]** – Static mapping + environmental noise.
  6.  **(1) Closed Book [0]** – No process, no activity.
