      *   *Refining the "Authority" point:* In CI, authority looks like an instrument or a covariate affecting selection. But in IR, authority *defines* the treatment. An unauthorized intervention might be conceptually a different treatment ($A'$) than an authorized one ($A$), not just $A$ with a covariate $Z=0$. I need to make sure this distinction is clear.
      *   *Refining the "Moral Remainder":* This is about the loss function. CI assumes a loss function $L(Y, \hat{Y})$. Moral remainder suggests the loss function includes the agent's integrity, which isn't captured in $Y$ (outcome for victims).
      *   *Refining SUTVA:* In CI, SUTVA means $Y_i(A_i, A_{-i}) = Y_i(A_i)$. In IR, $Y_{Syria}$ depends on $A_{Libya}$. CI calls this interference. IR calls this "normative precedent." The translation is technically accurate but loses the *social construction* aspect.

