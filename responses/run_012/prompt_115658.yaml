answer: |-
  ### Part I: The Debate Restated in Potential Outcomes

  Let $U$ be the set of geopolitical units (states or populations at risk). For any unit $i \in U$, let $A_i \in \{0, 1\}$ denote the treatment, where $A_i=1$ is external military/humanitarian intervention and $A_i=0$ is non-intervention (status quo). Let $Y_i(a)$ be the potential outcome for unit $i$ under treatment $a$, typically measured as a vector of human welfare metrics (casualties, rights protection, stability).

  The debate over Kosovo, Iraq, and Libya is fundamentally a dispute over the estimation of the Average Treatment Effect (ATE), $\tau = E[Y_i(1) - Y_i(0)]$, the selection mechanism into treatment, and the stability of the causal structure across units.

  **Kosovo (1999): The Identification Problem**
  Proponents argue that for $i=\text{Kosovo}$, the observed outcome $Y_i(1)$ (cessation of ethnic cleansing) dominates the counterfactual $Y_i(0)$ (continued massacre). They treat the NATO air campaign as a well-defined intervention $do(A_i=1)$.
  Skeptics challenge the **counterfactual baseline**. They argue that the selection into treatment was non-ignorable; NATO intervened *because* the situation was deteriorating. Thus, comparing Kosovo to non-intervention cases suffers from severe selection bias. Furthermore, skeptics argue that $Y_i(0)$ is not "massacre" but "negotiated settlement," implying that the treatment effect $\tau$ is negative or null when the correct baseline is specified. The debate here is over the **model specification** for the counterfactual: is the control group "states with similar atrocities that were ignored" or "states with similar atrocities that settled diplomatically"?

  **Iraq (2003): Effect Heterogeneity and Model Failure**
  The intervention was sold on a specific causal pathway: $A_i=1 \rightarrow \text{WMD Removal} \rightarrow Y_i(\text{Security})$. Post-hoc, the first link in the chain was null (no WMDs).
  The debate shifted to the total effect on $Y_i$. Critics argue $\hat{\tau}_{Iraq} \ll 0$, citing civilian casualties and instability. Proponents of the *decision* (distinct from the execution) argue that given the information set $X_{pre-2003}$, the *expected* treatment effect $E[Y_i(1) - Y_i(0) | X_{pre}]$ was positive. This is a dispute over **ex-ante vs. ex-post evaluation**. Causal inference typically evaluates the realized effect, but policy justification often relies on the expected effect under uncertainty. Additionally, this case highlights **effect heterogeneity**: proponents argue Iraq was a unique unit where $\tau_i > 0$ was plausible, while critics argue the **transportability** of the "democratization by force" mechanism from other contexts was invalid.

  **Libya (2011) and the Spillover to Syria: Interference**
  In Libya, $A_{Libya}=1$ led to regime collapse ($Y_{Libya}$). However, the debate extends to $i=\text{Syria}$.
  The "Precedent Argument" claims that $A_{Libya}=1$ causally affected the potential outcomes in Syria, not through physical spillover, but by altering the selection probability $P(A_{Syria}=1 | \text{History})$ and the outcome function $Y_{Syria}(\cdot)$.
  1.  **Selection Channel:** Because $A_{Libya}=1$, rebels in Syria expected $A_{Syria}=1$, altering their behavior (moral hazard).
  2.  **Outcome Channel:** Because $A_{Libya}=1$ resulted in state collapse, the function $Y_{Syria}(1)$ shifted downward; the same treatment now yields worse outcomes because the "regime change" mechanism has been discredited or because adversaries adapted.
  In causal vocabulary, this is a violation of the **Stable Unit Treatment Value Assumption (SUTVA)**. The potential outcome $Y_{Syria}(a)$ depends not only on $A_{Syria}$ but on $A_{Libya}$. The debate is whether we can estimate $\tau$ for Syria treating Libya as a covariate, or whether the system is so interconnected that unit-level causal estimation is impossible.

  ***

  ### Part II: The Residue Report

  Here is the translation fidelity report for the four main claims of the debate.

  | Claim | Translation into Causal Vocabulary | Fidelity | Notes on Distortion |
  | :--- | :--- | :--- | :--- |
  | **1. "The intervention made things worse overall."** | $\hat{\tau} < 0$. The realized Average Treatment Effect on the Treated (ATT) is negative. | **Clean** | This is the native language of causal inference. No residue. |
  | **2. "The relevant counterfactual is in principle unknowable."** | Acknowledgement of the Fundamental Problem of Causal Inference (FPCI). We never observe $Y(1)$ and $Y(0)$ for the same unit. | **Clean (Technically)** | **Distortion (Pragmatically):** In the debate, "unknowable" is often a normative stopper (therefore, do not act). In CI, FPCI is a challenge to be overcome via identification strategies (IV, RD, matching), not a prohibition on estimation. |
  | **3. "Intervention can be justified regardless of outcome."** | No expression. | **None** | CI is inherently consequentialist regarding $Y$. If $Y$ is bad, $A=1$ is causally "harmful." Deontological constraints (rights, duties) do not exist in the structural model unless encoded as hard constraints on the admissible set of $A$. |
  | **4. "Intervening in one case changes what is possible in others."** | Interference / SUTVA Violation. $Y_i(a, \mathbf{a}_{-i}) \neq Y_i(a)$. | **Partial** | **Distortion:** CI treats interference as a statistical nuisance to be modeled (e.g., cluster adjustments). In IR theory, this interference is the *substance* of norm construction. The "change" is not just a parameter shift; it is a change in the social meaning of the treatment itself. |

  ***

  ### Part III: Deep Dive on Specific Points

  #### 1. Spillovers (SUTVA Violations) as Substance vs. Nuisance
  In the potential-outcomes framework, SUTVA violations are typically treated as complications that bias standard error estimates or require hierarchical modeling. We try to "control" for interference to recover the "true" direct effect.
  **Residue:** In the humanitarian intervention debate, the spillover *is* the policy problem. When a scholar argues that Libya ruined the possibility of intervention in Syria, they are not saying "our standard errors are wrong." They are arguing that the **causal mechanism itself has mutated**. The treatment $A=\text{"R2P Intervention"}$ in 2011 is not the same variable as $A=\text{"R2P Intervention"}$ in 2013, because the *meaning* of the act has changed through the first instance.
  Causal inference can model this by time-varying treatments or defining $A_{2011}$ and $A_{2013}$ as distinct variables, but it struggles to capture the *endogenous evolution* of the treatment definition. The framework assumes the experimenter defines the treatment; in politics, the history of treatments defines the treatment.

  #### 2. Authority vs. Effects (The Definition of the Do-Operator)
  You asked if authority can be represented, given that `do(A=1)` is value-free.
  In CI, we could encode authority as a covariate $Z$ (e.g., UN Mandate). We might estimate $\tau$ conditional on $Z=1$.
  **Residue:** This distorts the political claim. In the debate, authority is often a **constitutive condition**, not a predictor of success. An unauthorized intervention is not merely $A=1, Z=0$; it is arguably a *different treatment* $A'$.
  *   *Causal View:* `do(Bombing without UN)` vs `do(Bombing with UN)`. We compare outcomes $Y$.
  *   *Political View:* `do(Bombing with UN)` is a "Police Action." `do(Bombing without UN)` is "Aggression."
  The causal framework assesses both by $Y$ (casualties saved). The political debate assesses them by the *legitimacy of the assignment mechanism*. If the assignment mechanism (who decides to intervene) is illegitimate, the outcome $Y$ is rendered morally irrelevant by some participants. CI has no way to represent a variable that trumps $Y$ in the loss function. It treats authority only insofar as it predicts $Y$ (e.g., multilateral interventions might have better local buy-in). It cannot represent authority as a *right* that constrains the admissible set of interventions regardless of $Y$.

  #### 3. Moral Remainder vs. Expected Effects
  The idea of a "moral remainder" suggests an agent can make the optimal decision (maximize expected $Y$) and still bear a moral cost (guilt, tragedy) because the realized $Y$ was bad, or because the act itself involved a violation (e.g., killing innocents to save innocents).
  **Residue:** CI operates on a loss function $L(\hat{Y}, Y)$. The optimal decision minimizes Expected Loss. There is no residual term for the *agent's state*.
  If a commander intervenes based on $E[Y|X] > 0$, and $Y$ turns out negative due to stochastic noise, CI says "bad luck, update the prior." The debate says "moral tragedy." The concept of **regret** in decision theory is close, but it is epistemic (I should have known), not moral (I bear a burden). The causal framework cannot distinguish between a "clean hand" failure (unlucky outcome) and a "dirty hand" success (good outcome achieved through morally suspect means), provided $Y$ is defined solely by the recipient's welfare. To capture this, you would need to expand $Y$ to include the moral integrity of the intervener, which is typically outside the scope of humanitarian welfare metrics.

  ***

  ### Part IV: Defect or Empirical Clothing?

  Is this residue a defect of the causal-inference vocabulary, or evidence that the original debate was doing normative work in empirical clothing?

  **The Honest Answer:** It is primarily evidence that the original debate is **normative work in empirical clothing**, but with a crucial caveat.

  1.  **Normative Work:** The core disagreements over Authority and Moral Remainder are not empirical disputes masquerading as causal ones; they are fundamentally disagreements about the *loss function* and the *admissible assignment mechanism*.
      *   When a participant says, "We cannot intervene without a UN mandate," they are not claiming $P(Y=good | \text{UN}=0)$ is low. They are claiming $P(\text{Intervention} | \text{UN}=0) = 0$ is a hard constraint. Causal inference takes constraints as given; it does not debate them.
      *   When a participant says, "We bear guilt even if we saved lives," they are positing a $Y$ vector that includes the agent's soul, which standard CI excludes.
      *   Therefore, the inability of CI to capture these points is not a defect; it is a feature. CI is a tool for estimating effects, not for defining rights or duties. Expecting it to solve the authority problem is a category error.

  2.  **Empirical Clothing:** However, participants *do* use empirical claims to settle normative disputes, and here CI exposes a genuine defect in the *rhetoric* of the debate.
      *   When proponents say, "Intervention is justified," they often imply $\tau > 0$.
      *   When skeptics say, "Intervention is forbidden," they often imply $\tau < 0$ or $\text{Var}(Y)$ is too high.
      *   In these instances, the debate *is* making causal claims. The residue here reveals that participants are often **confident in causal estimates that are unidentified**. They speak of $\tau_{Iraq}$ as if it were observed, or they assume transportability from Kosovo to Iraq without overlap.
      *   Here, the "defect" is not in CI, but in the debate's failure to acknowledge the FPCI. The causal vocabulary forces a humility ("we can only bound this effect") that the political debate refuses to accept.

  **Conclusion:**
  The residue regarding **Authority** and **Moral Remainder** indicates that the debate is not purely empirical; it is a normative contest where causal claims are leveraged to support deontological or constitutive positions. The causal vocabulary cannot translate these because they are not causal claims.

  The residue regarding **SUTVA/Spillovers** and **Counterfactuals**, however, suggests that the debate often treats complex, interconnected political systems as if they were stable, isolated units. Here, the causal vocabulary does not fail; rather, it indicts the debate for ignoring the statistical impossibility of the knowledge claims it makes. The "defect" is in the political discourse, which demands certainty from a framework (the real world) that only offers identification under strict, often violated, assumptions.

  You should conclude that causal inference is a necessary filter for the *empirical* premises of the debate, but it is silent on the *normative* premises. The frustration you feel with the translation is not because the framework is too narrow, but because the debate often hides its normative commitments behind empirical assertions that the framework reveals to be unfounded.
