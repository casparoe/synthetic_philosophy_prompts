      *   Is the level appropriate? (Yes, assuming PO fluency).

  7.  **Final Polish:** Check for clarity and flow. Ensure the distinction between *epistemic* limits (unknowable counterfactuals) and *ontological* limits (moral remainder) is sharp. (Self-correction: Make sure to explicitly mention the `do()` operator when discussing the definition of intervention).

  *(Self-Correction during drafting)*: I need to be careful not to say CI *can't* handle spillovers. It can, via network causal inference. But the *standard* framework treats them as violations. The prompt asks about the standard vocabulary. I will note that extended CI can model it, but the *standard* interpretation treats it as a nuisance, which is the source of the friction.

  *(Self-Correction on Authority)*: The prompt asks if authority can be represented. In CI, `do(A=1)` implies an external manipulation. If the "authority" is part of the manipulation definition, then `do(Unauthorized Intervention)` is a different treatment than `do(Authorized Intervention)`. But the debate often treats authority as a *pre-condition* for the moral validity, not just a predictor of the outcome. I need to highlight this distinction between *predictive validity* and *constitutive validity*.

