  **Why it's still open**
  Standard lexical semantics assumes contexts stable enough for diagnostics like zeugma to yield clear verdicts. However, political language is inherently contested and pragmatic. A sentence like 'He is a liberal and so is she' might pass conjunction-reduction tests not because the sense is identical, but because political identity is loose enough to tolerate slack. Conversely, failure on a contradiction test ('He is a liberal but not a liberal') might reflect pragmatic contradiction rather than semantic ambiguity.

  Furthermore, the literature on verbal disputes typically assumes interlocutors can stipulate definitions to resolve confusion. Here, the definitions are tied to dialectal identities. You cannot simply stipulate away the American sense without sounding alien in Washington, nor the European sense in Berlin. Existing frameworks treat ambiguity as a glitch to be resolved; this project treats it as a feature of political ontology. Consequently, neither standard semantic tests nor standard theories of verbal dispute settle whether the divergence is lexical or conceptual. We lack a methodology for handling systematic dialectal divergence in high-stakes conceptual vocabulary. The interface between semantics and pragmatics is particularly murky here, as speakers often exploit ambiguity for rhetorical gain, obscuring the underlying lexical structure.

  **Plan of work**
  **Months 1–2: Data Collection and Baseline Testing.** I will compile a comparable corpus of contemporary political commentary from the US and UK/EU (broadsheets, parliamentary records, think-tank publications). I will apply standard diagnostics: zeugma, contradiction, and conjunction-reduction, adapted for 'liberal'. For instance, 'The liberal supports markets and welfare' will be tested for felicity in both dialects. I will record pass/fail rates and note contextual modifiers. I will also conduct limited elicitation tasks with native speakers to test intuitive judgements on these sentences, ensuring corpus findings reflect competence rather than performance errors.

  **Months 3–4: Contextual Neighbourhood and Drift.** I will expand the analysis to neighbouring terms ('progressive', 'libertarian'). If 'liberal' shifts but neighbours remain stable, it suggests lexical idiosyncrasy; if the whole cluster shifts, it suggests conceptual drift. I will also consult etymological data to assess directional drift, determining if one sense is derivatively marked. This phase involves mapping the semantic space rather than isolating the word. I will look for asymmetries: can a European understand an American using 'liberal' without translation, and vice versa? This comprehensibility test serves as a proxy for polysemy.

  **Months 5–6: Synthesis and Write-up.** I will evaluate the test results against theories of verbal dispute. If tests converge, I will classify the relation. If they diverge, I will argue for indeterminacy. The final month is dedicated to drafting the paper, ensuring the linguistic data supports the philosophical conclusion regarding the substantiveness of political disagreement. I will prepare the manuscript for submission to a journal specialising in philosophy of language or political theory.

