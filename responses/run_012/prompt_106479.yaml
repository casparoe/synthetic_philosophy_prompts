  Transatlantic political discourse frequently stalls over the term 'liberal'. In American usage, it often denotes welfare-state progressivism; in European usage, classical free-market liberalism. This project asks whether this divergence constitutes polysemy, homonymy, or dialectal drift, and what this implies for the substantiveness of political disagreement. I will apply standard lexical semantic tests—zeugma, contradiction, conjunction-reduction—to corpus data from both regions. The aim is not merely to catalogue meanings but to determine whether cross-Atlantic disputes are merely verbal. By examining neighbouring terms and historical drift, the project will assess whether standard linguistic diagnostics suffice for politically contested concepts or whether a new framework is required to handle dialectal semantic divergence in political ontology.

