          *   Constraint: No citations/reading lists (fact-checkers would kill me).

  2.  **Deconstruct the Phrase ("Perception is Theory-Laden"):**
      *   *Origin:* N.R. Hanson (philosophy of science), but now used across cognitive science.
      *   *Core Tension:* Does theory change *what I see* (phenomenology) or *what I believe I saw* (cognition/judgment)?
      *   *Spectrum:*
          1.  **Weak/Trivial:** Response bias/attention (Psych prof).
          2.  **Moderate/Substantive:** Cognitive penetration of perceptual content (Vision researcher).
          3.  **Strong/Radical:** No neutral observation language/All facts are interpretations (Philosopher).

  3.  **Drafting the Menu (Iterative Process):**

      *   *Level 1: The "Button Press" (Response Bias).*
