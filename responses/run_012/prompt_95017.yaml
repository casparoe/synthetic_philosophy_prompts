          *   Content vs. Judgment: Judgment/Response only. Experience is unchanged.
          *   Verdict: Trivial/True.
          *   Eyewitness implication: Weak. Doesn't mean memory is fake, just that reporting is noisy.

      *   *Level 2: The "Spotlight" (Attention/Selection).*
          *   Claim: You look for what you expect. You miss the gorilla.
          *   Content vs. Judgment: Selection of input. Experience of attended items is normal.
          *   Verdict: Substantive/True.
          *   Eyewitness implication: Stronger. You didn't see the knife because you were looking at the face.

      *   *Level 3: The "Tinted Lens" (Cognitive Penetration).*
          *   Claim: Your beliefs literally change the visual processing (early vision). A neutral face *looks* angry.
          *   Content vs. Judgment: Content of experience changes.
          *   Verdict: Controversial/Substantive (some evidence, but debated).
          *   Eyewitness implication: Very Strong. The memory is corrupted at the source.
          *   *Addressing specific query:* "Looked angry" = Phenomenal claim.

      *   *Level 4: The "No Exit" (Philosophical/Conceptual).*
          *   Claim: There is no "bare fact." Language and concepts structure reality.
          *   Content vs. Judgment: Conceptual framework. Beyond just vision.
          *   Verdict: Philosophical stance (neither true/false in empirical sense, but coherent).
          *   Eyewitness implication: Overkill. Undermines *all* evidence, not just eyewitness.
          *   *Addressing specific query:* Photographs. Even photos require interpretation of context.

  4.  **Addressing Specific Confusions (The "Pin Down" Section):**
      *   *Content vs. Interpretation:* Crucial distinction. Did the lines look bent (content) or did you *think* they were bent (interpretation)?
      *   *Seeing As vs. Seeing That:* "Seeing as" is perceptual (duck-rabbit). "Seeing that" is propositional (I see *that* it is raining).
      *   *"Looked Angry":* Is it experience or belief? Usually a mix, but in this context, it claims experience.
      *   *Early Vision vs. Attention:* Early vision = retinal/V1 processing (harder to penetrate). Attention = selection (easier to influence).
      *   *Photographs:* They capture light, but *evidence* requires interpretation of what the light represents.

