answer: |-
  **PREP SHEET: THURSDAY NIGHT**

  **1. Mr Bhatt (Maths/Stats)**
  *The Premise Killer. If he breaks your data, you have no talk.*
  **The Question:** "You're treating 'rich country' and 'poor country' as single variables. But aren't you ignoring that women in poor countries often *can't* choose arts jobs because those jobs don't exist? Isn't that just economic coercion, not a lack of gendered identity?"
  **Give Up:** The idea that poor-country women are completely free of gender norms. Admit they face constraints.
  **Stick To:** The contrast in *motivation*. In poor countries, the motive is survival. In rich countries, the motive is self-expression.
  **The Reply:** "You're right, it's not pure freedom anywhere. But when survival is the priority, gender takes a back seat to paying rent. When survival is guaranteed, gender moves to the front seat. My point isn't that poor countries are unbiased, but that wealth allows bias to become the deciding factor."
  **Weakness:** You're assuming wealth is the only thing that changes. You don't have data proving 'self-expression' is the actual driver, you're inferring it. Don't claim proof.

  **2. The Deputy Head**
  *The Action Killer. If you can't answer this, you're just philosophising.*
  **The Question:** "Okay, let's say you're right. It's about cultural meaning. What exactly do you want this school to do on Monday morning? 'Change the meaning' isn't a policy."
  **Give Up:** The idea that the school can solve this with a rule or a workshop.
  **Stick To:** The idea that the school influences culture through messaging, not just quotas.
  **The Reply:** "We can't force choices. But we can stop framing STEM as 'hard and lonely' and Arts as 'soft and expressive'. We highlight engineers who are creative and artists who are technical. We change the branding, not the booking form."
  **Weakness:** This sounds vague. You know it's vague. Don't promise results, promise a shift in language.

  **3. Miss Okoye (Careers)**
  *The Responsibility Killer. She thinks you're letting the school off the hook.*
  **The Question:** "If girls are picking jobs based on 'what fits', and what fits is gendered, isn't that exactly what careers guidance is supposed to challenge? You sound like you're saying 'let them be'."
  **Give Up:** The notion that we should leave them alone.
  **Stick To:** The distinction between challenging bias and challenging choice.
  **The Reply:** "We should challenge the bias, not the choice. If a girl picks nursing because she thinks physics isn't 'her', we fix the 'physics isn't her' bit. We don't push her into physics if she genuinely hates it. We make physics look like it belongs to her."
  **Weakness:** You're relying on the school to fix deep cultural coding. They might not be able to. Acknowledge the limit.

  **4. Mr Halloran (Psychology)**
  *The Mechanism Killer. He'll say you've just renamed the problem.*
  **The Question:** "Psychologically, isn't 'what fits me' just internalised stereotype threat? You're saying it's identity, but where did that identity come from if not external pressure?"
  **Give Up:** The idea that this identity is innate or purely organic.
  **Stick To:** The distinction between external punishment (oppression) and internal signalling (identity).
  **The Reply:** "It comes from culture, yes. But once it's internal, it acts differently. You can't legislate away an internal feeling of 'fit'. We have to treat it as a cultural branding issue, not just a rights issue."
  **Weakness:** He's right. It is internalised pressure. You're splitting hairs. Don't argue it's *not* pressure, argue it requires a *different solution*.

  **5. Priya (Feminist Society)**
  *The Ideological Killer. She thinks you're undermining the movement.*
  **The Question:** "This sounds like 'it's just what women want'. If society genders everything, then 'what women want' is already corrupted. How is this not just blaming women for patriarchy?"
  **Give Up:** The idea that current preferences are perfectly free.
  **Stick To:** The pragmatic reality that telling women their wants are 'wrong' doesn't work.
  **The Reply:** "Telling women their choices are false consciousness doesn't help. We have to work with the wants that exist now. If we make STEM fit the identity women already value, we get more women in STEM without fighting their sense of self."
  **Weakness:** You risk sounding like you're accepting patriarchy. Be careful not to sound dismissive of her critique.

  ***

  **THE QUESTION YOU HOPE NOBODY ASKS**
  **The Question:** "You say we need to change what physics means. Who gets to decide what it means instead? Isn't that just social engineering from the top down?"
  **Why you don't know:** Because you haven't figured out the mechanism. You know *what* needs to change, not *how* to do it without being manipulative.
  **The Move:** Don't bluff. Say: "That's the hard bit. I don't have the answer yet. I think it has to come from within the subjects, not imposed from above. That's what I'm trying to figure out next."

  ***

  Worst one: You're calling oppression 'identity' to avoid fixing it.
