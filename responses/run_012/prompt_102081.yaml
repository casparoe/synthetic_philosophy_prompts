      *   *Clause 1 (The Evidentiary Boundary):* Invention is prohibited when it contradicts hard evidence (documents, physical proof). (Cases: Woman's Literacy, Writer's Affair).
      *   *Clause 2 (The Moral Integrity Boundary):* Invention is prohibited when it fundamentally alters the moral valence of a life (redemption/villainy) in a way that misleads the audience about the historical reality, even if factually ambiguous. (Case: Slave-owner).
