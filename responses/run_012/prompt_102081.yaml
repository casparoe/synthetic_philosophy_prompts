      *   *Principle A: The Constraint of Contradiction.* You cannot invent what the evidence explicitly denies (covers Statesmen, Writer's Affair, Woman's Literacy, Musician's Overdose).
      *   *Principle B: The Constraint of Essence.* You can invent specifics if they serve the essential truth of the person's beliefs/character (covers General's Speech).
      *   *Principle C: The Constraint of Harm.* You cannot invent stigmatizing or traumatic details that harm living survivors or tarnish a legacy unfairly (covers Musician's Overdose).
      *   *Principle D: The Constraint of Moral History.* You cannot invent moral redemption or villainy that distorts the historical lesson (covers Slave-owner).

      *Let's try to synthesize these into a cohesive framework.*
      The core tension is between *Dramatic Truth* (what makes the story work/resonate) and *Historical/Moral Duty* (respect for the dead and the truth).

      *Proposed Framework:* **The Principle of Non-Betrayal.**
      1.  **Factual Non-Contradiction:** Do not invent details that physical evidence or reliable testimony explicitly refutes. (Motivated by: Woman's Literacy, Writer's Affair).
      2.  **Character Fidelity:** Do not invent traits or actions that fundamentally invert the subject's established moral character, unless serving a higher interpretive truth that is acknowledged as such. (Motivated by: General's Speech [OK], Slave-owner [Not OK]).
      3.  **Survivor Sensitivity:** Do not invent stigmatizing causes of death or private scandals involving recently deceased persons where living relatives would suffer unjustified distress. (Motivated by: Musician's Overdose).
