answer: |-
  Your intuitions are sophisticated and largely consistent with the ethical frameworks used by serious historical dramatists and biographers. Your tentative principle is a strong start, but as you noted, it struggles to distinguish between *factual* contradiction and *moral* distortion, and it leans too heavily on the living when the dead themselves have a claim to truth.

  Here is a refined set of principles that captures your verdicts, followed by the application to your new cases and a critique of where your own intuitions may need adjustment.

  ### The Principle of Dramatic Fidelity

  This framework divides permissions into three constraints and one permission.

  **Clause 1: The Constraint of Hard Evidence**
  > Invention is prohibited when it contradicts physical evidence, contemporary documentation, or established testimony regarding specific actions or attributes.
  > *   **Motivating Cases:** The **Obscure Woman's Literacy** (contradicts physical signature); The **Writer's Affair** (contradicts letters showing fidelity); The **Musician's Overdose** (contradicts coroner's report).
  > *   **Rationale:** This preserves the baseline of historical reality. When the record speaks, art must not shout it down.

  **Clause 2: The Constraint of Moral Essence**
  > Invention is prohibited when it attributes a fundamental change of character, belief, or moral stance to the subject that the preponderance of evidence suggests they did not possess, even if no specific "event" records the absence of that change.
  > *   **Motivating Case:** The **Slave-owner's Conversion**.
  > *   **Rationale:** This addresses your unease. While the General's speech (Case 2) externalizes a *true* internal belief, the Slave-owner's conversion internalizes a *false* belief. You may dramatize what a person *meant* but didn't say; you may not dramatize what a person *felt* but didn't feel. This prevents "false redemption" or "false villainy" that distorts the moral lesson of history.

  **Clause 3: The Constraint of Dignity (Living and Dead)**
  > Invention is prohibited when it introduces stigmatizing details (e.g., suicide, scandal, criminality) that defame the subject, with the harm compounded if living survivors exist to suffer the distortion.
  > *   **Motivating Case:** The **Musician's Overdose**.
  > *   **Rationale:** This repairs your tentative principle. The wrong in the Musician case is not *only* the pain to the widow; it is the defamation of the musician. If the widow were dead, inventing a suicide would still be impermissible because it lies about the nature of the person's end. The survivors amplify the harm, but they do not constitute the sole boundary.

  **Clause 4: The Permission of Dramatic Illumination**
  > Invention is permissible when it fills gaps in the *event record* to illuminate an established *character truth*, provided it violates none of the above constraints, or when it compresses multiple agents into a transparent composite for narrative clarity.
  > *   **Motivating Cases:** The **Statesmen's Conversation** (fills gap, consistent with character); The **General's Speech** (fills gap, expresses true belief); The **Composite Campaigner** (narrative efficiency without deception); The **Diaries** (direct fidelity).
  > *   **Rationale:** This allows art to function as art. History records what happened; drama explores what it meant.

  ***

  ### Application to New Cases

  **Case A: A sexual relationship between two real, long-dead adults where evidence is silent, but the era would have hidden it.**
  *   **Verdict:** **Permissible, with caution.**
  *   **Analysis:** This passes the **Constraint of Hard Evidence** (evidence is silent). It passes the **Constraint of Dignity** (long dead, no survivors to suffer stigma). The risk lies in the **Constraint of Moral Essence**. If these figures are known for specific moral or religious stances that would make the relationship a fundamental contradiction of their public lives (e.g., two celibate religious leaders), it violates Clause 2. If they were secular figures in a repressive era, and the relationship illuminates their humanity without contradicting their known character, it falls under the **Permission of Dramatic Illumination**. It treats the silence of the record as a gap to be filled by plausible human truth.

  **Case B: The same invention transposed to figures dead for six centuries with no identifiable descendants.**
  *   **Verdict:** **Permissible.**
  *   **Analysis:** With six centuries of distance, the **Constraint of Moral Essence** becomes harder to enforce because "character" is less documented and more mythologized. The **Constraint of Dignity** regarding survivors is irrelevant. The only remaining duty is to the historical record itself. Since the evidence is silent, and the invention does not contradict a known fact, it is a valid speculative interpretation. The "wrong" done to the dead themselves is minimal compared to the value of a compelling narrative, provided the dramatist does not present this speculation as discovered fact.

  ***

  ### Critical Evaluation: Which Verdict Should You Give Up?

  You asked me to identify which of your verdicts my principle cannot accommodate, or which you should reconsider. There is one tension in your judgments that requires resolution.

  **The Tension:** You defend the **General's Speech** (he said nothing, but you put words in his mouth) but are troubled by the **Slave-owner's Conversion** (he didn't convert, but you make him convert).
  *   **My Principle's View:** These are distinct. The General's speech is *interpretive truth* (he believed it); the Slave-owner's conversion is *revisionist truth* (he didn't believe it). My principle accommodates both your verdicts by distinguishing between *expressing* a character trait and *inventing* a character trait.

  **The Verdict to Reconsider:** The **Musician's Overdose**.
  *   **Your Justification:** You wrote: *"I suspect the living survivors are a large part of why."*
  *   **My Critique:** You should give up the idea that the **survivors** are the primary ethical weight here.
  *   **Why:** If the musician had died in 1920 with no living relatives, would it be permissible to invent that he committed suicide when he did not? Most ethical frameworks would say **no**. Lying about the cause of death is a defamation of the *deceased*, regardless of who is left to mourn. It alters the historical understanding of that person's struggle, mental health, and end.
  *   **Recommendation:** Shift your justification for the Musician case from "Harm to Survivors" to "Integrity of the Life Story." The survivors make the harm *urgent*, but the lie makes the harm *wrong*. If you anchor this verdict only to the survivors, you imply that defaming the dead is acceptable once the grief has faded. Your **Constraint of Dignity** (Clause 3 above) corrects this by asserting that the dead retain a right not to be falsely stigmatized, independent of the living.

  **Summary:** Your intuitions are sounder than your tentative principle. By distinguishing between *filling gaps in events* (allowed) and *inventing changes in character* (forbidden), and by recognizing that the dead have rights independent of their survivors, you can resolve the unease you feel about the slave-owner and the musician.
