answer: |-
  **Project Title:** The Ontological Status of Inference: A Carrollian Correction

  **Project Summary and Research Question**
  Lewis Carroll's Tortoise is standardly read as a puzzle about justification: how can we justify deduction without invoking an infinite regress of premises? The standard literature assumes the regress is epistemic. It asks what entitlement allows us to move from premises to conclusion without citing further premises. This project proposes that the regress is not epistemic but ontological. The Tortoise does not lack a reason; it lacks a specific kind of mental state. Every item the Tortoise accepts is "premise-shaped": it is truth-apt, embeddable in a "that"-clause, and susceptible to doubt. The inference itself—the transition from premises to conclusion—is not premise-shaped. Consequently, no amount of premise-shaped content can generate a transition. The regress cannot be closed by adding premises because the missing element is not a premise.

  This leads to a determinate research question: **Is the stopper for the Carrollian regress a distinct ontological category of mental state (a transition) rather than a proposition with a special epistemic status (a justified belief)?** Answering this requires showing that candidate stoppers (dispositions, licenses, know-how) cannot be reduced to premise-shaped states without losing their function. If the answer is yes, the normativity of logic must be restated: logic norms transitions, not beliefs. If the answer is no, the regress remains epistemic, and the "category error" diagnosis is illusory.

  **The Gap in Existing Approaches**
  Current responses to Carroll focus on why the regress is benign or where justification bottoms out. Dispositionalists argue we are implicitly disposed to infer; Normativists argue we are committed to rules; Entitlement theorists argue we are permitted to trust our faculties. All these approaches treat the stopper as a proposition with a special status (e.g., a belief about a disposition, or a primitive justification). They leave open whether the stopper is genuinely distinct in kind from the premises. By treating the stopper as a special *kind of belief*, they invite the Tortoise to ask for a justification of that belief, restarting the regress. This project identifies the gap: the literature argues about the *status* of the stopper, not the *type* of state. Without fixing the criterion for "premise-shaped," we cannot determine if the stopper is truly distinct or just another proposition in disguise.

  **Methodology**
  The method proceeds in four concrete stages to ensure the distinction is robust and not merely terminological.
  1.  **Define the Criterion:** I will fix a formal criterion for "premise-shaped" states: any state that can be the content of a "that"-clause and assessed for truth. This produces a clear testable boundary.
  2.  **Screen Candidates:** I will run the standard regress-stoppers (dispositions, inferential licenses, practical commitments) against this criterion. This produces a list of candidates that survive the test versus those that collapse into premise-shaped states.
  3.  **Deep Dive Argument:** I will select the strongest surviving candidate (likely Dispositionalism) and argue in detail that it cannot be re-described as a belief about a disposition without losing its normative force. This produces the core argument of the paper.
  4.  **Normative Implication:** I will derive the consequences for the normativity of logic. If inference is a transition, logical norms address the act of inferring, not the belief in the conclusion. This produces a revised statement of logical normativity.

  **Timeline and Deliverables**
  *   **Month 1:** Finalize the "premise-shaped" criterion and test it against edge cases (e.g., perceptual states).
  *   **Month 2:** Screen candidate stoppers against the criterion; eliminate those that reduce to propositions.
  *   **Month 3:** Draft the deep-dive argument focusing on Dispositionalism vs. Belief.
  *   **Month 4:** Develop the normativity implication; draft the section on logical norms.
  *   **Month 5:** Revise for clarity and objection-handling; circulate draft for feedback.
  *   **Month 6:** Finalize paper for submission to a mid-tier journal.

  **Success and Failure Conditions**
  Success looks like a published argument establishing that at least one regress-stopper is ontologically distinct from premises, forcing a restatement of logical normativity. The project fails if the "premise-shaped" criterion turns out to be definitional trickery that excludes interesting candidates by fiat. It also fails if any viable candidate stopper can be re-described as a belief about a disposition without losing its explanatory power. If the distinction collapses, the project yields no philosophical gain.

  **Objections and Scope**
  The obvious objection is that the Tortoise is a stipulation, not a discovery: you can stipulate a creature that accepts everything and infers nothing, so who cares? The best reply is that the Tortoise reveals a structural limit of propositional representation, not a psychological fact about reptiles. It shows that no list of truths compels an act. This buys enough to make the problem structural, but it does not solve the normativity problem; it only relocates it.

  Regarding scope, six months at one day a week is approximately twenty-four work days. This is insufficient for a comprehensive survey of all Carroll responses. The honest verdict is that this fits only if I drop the broad survey. I will focus exclusively on the Dispositionalist candidate. The comparison with Normativism and Entitlement will be left as a promissory note for future work. This ensures the core argument is rigorous rather than superficial.

