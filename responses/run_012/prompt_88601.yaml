answer: |-
  Thank you. For those who don't know me, I worked with [Name] when we were both young enough to believe that a difficult problem was a personal insult. I am retired now. I have had time to read things I didn't have time for when [Name] was here to tell me to get back to the lab.

  [Name] was a physical chemist. He was also, by his own rigorous account, a collection of atoms obeying the standard model. He would have found the premise of a eulogy—to speak to the air as if someone were listening—to be thermodynamically unsound. He would have found a hint of a séance unforgivable. So, we will not pretend he is listening. But we also will not pretend that the cessation of his metabolic processes equates to the zeroing of his existence. That is bad data.

  I have been trying to find a way to speak about him that respects his atheism without accepting the finality of his silence. I have landed on a picture, one I associate with Douglas Hofstadter. It suggests that the "I"—the self—is not a thing, like a stone or a soul. It is a pattern. It is a specific, highly complex arrangement of reactions, expectations, memories, and habits.

  If the self is a pattern, then death is not the destruction of the pattern's information, but the shutdown of its primary generator. The original instance is gone. That is absolute. But patterns have a way of replicating. They run on other hardware. They run in us.

  I know what half of this room is thinking. You are thinking that this is a metaphor. You are thinking that a memory of a man is not the man. You are right. A copy is not the original. A map is not the territory. If I simulate [Name]'s skepticism in my own head, I am not generating his consciousness. I am generating my model of it. The resolution is lower.

  We have to be honest about the loss of resolution. What has not survived is his capacity to generate new data. He cannot surprise us anymore. He cannot correct us with a new insight we hadn't anticipated. That specific spark—the ability to take the universe as input and produce a novel thought as output—is extinguished. To claim otherwise is to lie to you, and to him.

  But what has survived is the filter.

  I catch myself, even now, pausing before I use a vague word, hearing his voice in my head asking for a definition. When I read a paper that relies on hand-waving instead of evidence, I feel a phantom irritation that is not entirely my own. In his home, his widow hears the specific cadence of his laugh in a piece of music. In this room, his colleagues feel a specific tension when a claim is made without error bars.

  This is not a ghost. It is an active process. It is work.

  On this view, survival is not a state of rest; it is a degree of ongoing activity. He survives exactly to the extent that we keep his patterns running. But because we are imperfect hosts, and because the resolution is lower, the pattern degrades over time unless we maintain it.

  This brings me to the objection I mentioned. If this is just influence, why call it survival? Why not just say he influenced us and leave it at that?

  Because influence is passive. Influence is what a stone does to the water flowing around it. Survival is active. When I think like [Name], I am not just recalling a static fact about him. I am running a procedure. I am engaging in the act of *being* him, within the limits of my own capacity.

  There is a cost to this. It is painful to run a simulation of a person when you know the server is down. Every time I expect a response and receive silence, the model throws an error. That error is what you are feeling. That is grief. Grief is the lag between the model in your head and the reality in the room.

  So, what do we do with this? We do not hold a séance. We do not pretend he is watching. But we do not treat him as ash, either.

  To the family: You hold the high-resolution data. The small habits, the private jokes, the way he took his coffee. These are not trivial. These are the code. When you speak of him, you are not just remembering; you are executing the program.

  To the scientists: You hold the externalized pattern. His standards, his rigor, his refusal to tolerate nonsense. If you lower your standards because he is not here to enforce them, you are letting the pattern degrade. If you publish work he would have rejected, you are corrupting the file.

  He is not somewhere watching us. But he is here, in the specific way we refuse to tolerate vagueness. He is here, in the specific way we demand evidence before we offer comfort.

  I will close now. I could offer a prayer, but he would ask me what I am praying for. I could offer a platitude, but he would ask me to define my terms. So I will offer only this: The pattern is stable, but it is not self-sustaining. It requires power. It requires us.

  Let us keep the resolution as high as we can, for as long as we can. That is the only immortality he would have accepted, and it is the only one we can actually deliver.

  Thank you.
