answer: |-
  This is a classic collision between high-level metaphysics and high-level physics, and your friend is making a very popular argument right now (often associated with "Priority Monism" and "Wave Function Realism"). However, she is conflating **fundamental ontology** (what the universe is made of at the bottom) with **derivative ontology** (what exists in virtue of that bottom layer).

  Here is the split you are looking for: what physics can decide, what it cannot, and how to interpret the "no table" worry.

  ### 1. The Physics: What Result Are You Watching For?

  Your friend is correct that physics constrains the answer, but she is incorrect that a specific experimental *result* will settle it. Instead, what matters is the **interpretation of the formalism.**

  **The Empirical Constraint:**
  Physics tells us the structure of the fundamental layer. Currently, Quantum Mechanics (QM) suggests the world is not "separable." In classical physics, if you know the state of particle A and particle B, you know the state of the system (A+B). In QM, entanglement means the state of the system is primary; the states of the parts are derivative.

  **What to Scan For:**
  You will not find a headline saying "Tables Disproven." You need to watch for consensus on **Quantum Ontology**. Specifically:
  *   **Wave Function Realism:** Is the wave function of the universe a physical object living in a high-dimensional space? (If yes, 3D tables are arguably illusions or projections).
  *   **Local Beables:** Does the theory posit things located in ordinary 3D space (like flashes or fields)? (If yes, tables have a better chance of being composed of real things).
  *   **Quantum Gravity:** Does a theory of quantum gravity suggest spacetime itself is emergent? (If spacetime emerges from something else, "composition" becomes even weirder).

  **Why Physics Won't "Settle" It Alone:**
  This is the crucial point your friend is missing: **Underdetermination.**
  You can have the exact same physics equations (e.g., standard QM) and interpret them in ways that yield different metaphysics.
  *   *Interpretation A (GRW Flash Ontology):* The fundamental stuff is discrete "flashes" in space. Tables are patterns of flashes.
  *   *Interpretation B (Wave Function Monism):* The only real object is the universal wave function. Tables are not real objects, just ways the wave function is shaped.

  Both interpretations predict the exact same experimental outcomes. Therefore, **no experiment can decide between them.** You need a metaphysical principle to choose which interpretation describes "reality."

  ### 2. The "No Table" Worry: Fundamental vs. Derivative

  Your intuition ("It seems obviously false that there is no table") is actually aligned with most modern metaphysicians, even the ones who agree with your friend's physics.

  **The Distinction:**
  *   **Fundamental Existence:** Is this thing in the basic inventory of the universe? (e.g., electrons, fields, the wave function).
  *   **Derivative Existence:** Does this thing exist *in virtue of* the fundamental stuff?

  **The Phlogiston Analogy is Flawed:**
  Your friend compares tables to phlogiston. This is a category error.
  *   **Phlogiston** was a *causal mistake*. We thought burning released phlogiston; it actually consumes oxygen. Phlogiston does not exist at all.
  *   **Tables** are not a causal mistake. They are **structural patterns**.

  **The Better Analogy: Heat.**
  Is "heat" real?
  *   *Fundamentally:* No. The universe only contains molecules moving at specific kinetic energies. There is no "heat particle."
  *   *Derivatively:* Yes. Heat is real because it is a specific arrangement of molecules.

  If physics proves "Priority Monism" (only the whole universe is fundamental), it means tables are not *fundamental*. It does **not** mean tables don't exist. It means tables exist the way "a smile" exists. A smile isn't a separate object from the face; it's an arrangement of the face. If someone said, "We discovered faces are made of muscle and bone, therefore smiles don't exist," you would rightly call that nonsense.

  **Answering "No Fact of the Matter":**
  If a philosopher says "there is no fact of the matter about composition," they usually mean one of two things:
  1.  **Vagueness:** There is no precise cutoff where particles become a table. (This doesn't mean the table isn't there; it means "table" is a vague concept).
  2.  **Quantifier Variance:** The word "exists" is flexible. In one language, "exists" means "is fundamental." In another, "exists" means "is a useful pattern." Both are right relative to their framework.

  So, if it turns out there is "no fact of the matter," it does **not** mean you should walk through the table. It means the question "Do tables *fundamentally* exist?" is the one without an answer, while "Is there a table in front of me?" remains true in the derivative sense.

  ### 3. If It's Verbal, Why Do Philosophers Care?

  If the dispute is just about how we use the word "exists," why write books about it?

  **1. Causation and Explanation:**
  If tables don't exist (even derivatively), what holds up the coffee cup? If only particles exist, we have to explain how particles coordinate to act *as if* there is a table. If we say tables *do* exist (derivatively), we can use "macroscopic laws" (friction, solidity) without reducing every sentence to particle physics. The debate determines what counts as a valid explanation.

  **2. The Structure of Reality:**
  Even if it is "just words," the words map onto **Grounding**. Grounding is the relationship between the fundamental and the derivative. Figuring out composition is figuring out how the universe builds complexity. That is not verbal; that is structural.

  **3. Scientific Practice:**
  If a biologist says "This cell is an organism," and a nihilist says "No, only the particles exist," the biologist will ignore them. But if a physicist says "Spacetime is emergent," that changes how we look for a theory of Quantum Gravity. The metaphysics guides the heuristics of science.

  ### The Split: What Settles What?

  Here is the breakdown you can use to evaluate future claims:

  | Question | Domain | Can Physics Settle It? | What Would "Settled" Look Like? |
  | :--- | :--- | :--- | :--- |
  | **What is the fundamental stuff?** | **Empirical** | **Yes.** | Consensus on Quantum Gravity / QM Interpretation (e.g., "The wave function is the only beable"). |
  | **Do fundamental parts compose wholes?** | **Conceptual** | **No.** | This is a rule of metaphysics. Physics gives the bricks; metaphysics decides if a wall counts as an object. |
  | **Do tables exist?** | **Mixed** | **Partially.** | Physics says if tables *could* exist (are they compatible with fundamental stuff). Metaphysics decides if they *do* (are they robust patterns?). |
  | **Is composition vague?** | **Conceptual** | **No.** | This depends on logic and language, not particle colliders. |

  ### Summary Advice

  1.  **Don't wait for a "Table Disproven" headline.** It won't happen. Watch for debates on **Quantum Holism** and **Wave Function Realism**. If physicists converge on the idea that the *only* fundamental object is the Universe's Wave Function, your friend wins the "fundamental" round.
  2.  **Hold the line on Derivative Existence.** Even if the universe is one giant entangled wave, tables can still exist as **emergent patterns**. The phlogiston analogy is wrong; the "smile on a face" or "heat in molecules" analogy is right.
  3.  **The "Verbal" Dispute is Deep.** Even if it comes down to how we define "existence," the stakes are about **explanatory power**. Do we explain the world from the bottom up (particles only) or can we explain it top-down (tables cause things too)?

  Your friend is right that physics drives the bus, but she is wrong that physics is the driver. Physics provides the terrain; metaphysics draws the map. You need both to know where you are.
