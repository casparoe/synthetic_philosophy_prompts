      *   *Key Concept:* Quantum Entanglement & Holism.
      *   *Key Debate:* Separability vs. Non-separability.
      *   *The "Settling" Condition:* Physics won't say "Tables exist." It will say "The wave function of the universe is the only fundamental entity" (e.g., Wave Function Realism) OR "Particles are local beables" (e.g., GRW flash ontology).
      *   *The Catch:* Different interpretations of the *same* physics yield different ontologies. So physics data doesn't settle it; *interpretation* does.
      *   *Advice:* Don't scan for "Table Disproven." Scan for debates on Quantum Holism, Wave Function Realism, and Emergence.

