prompt: |-
  Okay, so I've been going down a rabbit hole on the special composition question — you know, the one where you ask when some things add up to or compose a further thing, like when a bunch of boards and legs compose a table. My friend (physics PhD, very confident about everything) says this is definately going to get settled by physics, and soon. Her reasoning: once we know what the fundamental stuff is and how it's related, we'll know whether there really are tables or only particles arranged table-wise, same way we found out there's no phlogiston. She thinks the key thing to watch is whether the fundamental level is seperate — each bit with its own independent state — or whether the fundamental facts are irreducibly relational, like in entanglement, because if everything at the bottom is entangled then the only real wholes are the entangled systems.

  I'm half convinced but I keep tripping over follow-ups I can't sort out. Which specific physics result am I supposed to be watching for, and how would I know when it's in? Second, if it turns out there's no fact of the matter about composition — she says some philosophers think that — does that mean it's a fact that there's no table in front of me? That seems obviously false, so I assume it must mean something else, but I can't tell what. And if the whole thing is really just a verbal dispute about words, why does anyone keep writing about it?

  Basically what I want is the split: how much of this question is empirical, how much is conceptual, and what would actually count as settling it? I want to know what I should be scanning physics news for versus what no experiment could ever decide.
