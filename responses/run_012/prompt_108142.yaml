          *   *Derivative Existence:* Does it exist in virtue of other things? (Yes).
      *   *Indeterminacy:* Some philosophers (e.g., Lewis, Sider, or vague existence proponents) argue composition might be vague. But the user's friend suggests *eliminativism* (like phlogiston).
      *   *Resolution:* Distinguish between *fundamental ontology* (physics) and *manifest ontology* (everyday life). A table can be real *as a table* without being *fundamental*. Eliminating the table as a *fundamental particle* doesn't eliminate it as a *macroscopic object*.
