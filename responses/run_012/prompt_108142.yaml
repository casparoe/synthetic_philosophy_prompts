      *   *Critique:* This conflates *structure* with *ontology*. Physics describes behavior and mathematical structure. Metaphysics asks what *exists* in virtue of that structure. Even if everything is entangled, does that mean intermediate objects (tables) don't exist? Or just that they aren't *fundamental*?
      *   *Verdict:* The friend is partially right (physics constrains metaphysics) but wrong that physics *alone* settles it. It's an underdetermination problem.

