answer: |-
  There is no single, universally agreed-upon word for this specific phenomenon, which is frustratingly common in historical fiction. However, historians, archivists, and philosophers have a constellation of terms that describe the mechanism, the result, and the ethical weight of what you are experiencing.

  Here is the breakdown of what "the thing" is, what it is called, and where the wrong actually lies.

  ### 1. The Mechanism: "Circular Reporting" or "Citation Drift"
  The technical process you are describing—where a fictional detail is picked up by a biographer, who is then cited by another biographer, until the novel is forgotten and the detail remains—is known in information science and historiography as **Circular Reporting** (or sometimes *citogenesis*).

  When this happens specifically with fiction entering the historical record, it is often called **Source Contamination**. The "archive" has been contaminated by an unmarked fabrication. Because your detail was "plausible and unverifiable," it passed the sniff test of future researchers who, lacking a primary source for that specific dinner conversation, latched onto the only available account: yours.

  ### 2. The Phenomenon: "Fictive Hardening" or "Sedimentation"
  While "Circular Reporting" describes *how* it moves, it doesn't describe the *state* it becomes. In the philosophy of history, this is sometimes referred to as **Fictive Hardening** (or **Narrative Sedimentation**).

  Like sediment turning to rock, a fluid, invented story settles over time into a fixed, immutable fact. The most famous example is Shakespeare's *Richard III*. The hunchbacked, child-murdering villain is largely a Tudor fabrication dramatized by Shakespeare, but it "hardened" into the historical record so completely that the actual Richard III (whose remains were found in 2012) is still judged by the play's fiction.

  You might also hear this called **The Scott Effect** (after Sir Walter Scott), whose historical novels did so much to shape the popular and even academic understanding of Scottish history that his inventions became indistinguishable from events.

  ### 3. The Ethical Wrong: "Narrative Dispossession"
  You asked whether the wrong is to the dead, the family, or the readers. This is the crux of the philosophical problem.

  **To the Dead: Narrative Dispossession**
  You correctly identified that "Posthumous Harm" usually refers to reputation (slander). But what you are describing is deeper. It is a violation of **Narrative Autonomy**.
  Philosophers like Joel Feinberg have argued that the dead have "surviving interests." One of those interests is the integrity of their life story. When you invent a cruelty and it becomes fact, you have effectively **ventriloquized** the dead. You have put words in a mouth that cannot refute them. The wrong here is **Narrative Dispossession**: the subject has been stripped of the truth of their own life, replaced by a dramatist's necessity. Even if they are dead, their *history* has been hijacked.

  **To the Readers: Epistemic Harm**
  This is arguably the most tangible wrong. Readers and future historians suffer **Epistemic Harm**. They have been led to believe they possess knowledge they do not actually possess. The contract of history is that the record reflects what happened; the contract of fiction is that the record reflects what *could* have happened. When fiction hardens into fact, the reader's ability to distinguish truth from verisimilitude is damaged. This corrupts the collective understanding of the past.

  **To the Family: Vicarious Stewardship**
  The great-granddaughter's complaint is complex. She cannot be "harmed" in the legal sense, nor can she speak for the dead with authority. However, sociologists might call this **Vicarious Honor**. Families often view ancestors as part of their own identity. When you alter the ancestor, you alter the family's origin story. While they don't own the dead, they are the **Stewards of Memory**. Your invention forces them to defend a memory they never witnessed, against a fact they cannot disprove.

  ### 4. Why It Differs from Historian Error or Standard Fiction
  You asked how this differs from a historian getting it wrong, or from you doing your job.

  *   **Vs. Historian Error:** A historian makes a mistake in the pursuit of truth. When corrected, the mistake is retracted. The *intent* is fidelity to the record. In your case, the intent was fidelity to the *story*. The "error" is a feature, not a bug. However, because the outcome (falsehood in the record) is the same, the historian's error is seen as negligence, while yours is seen as **contamination**.
  *   **Vs. Standard Fiction:** In a fantasy novel, no one claims the dragon is real. In historical fiction, the genre relies on **Verisimilitude**—the appearance of truth. You are leveraging the trust readers place in the historical setting to sell the emotional truth of the scene. The "wrong" occurs when that leverage is pulled too far, and the *appearance* of truth replaces the *substance* of truth in the public record.

  ### 5. Is there a solution?
  There is no perfect fix, but historians are becoming aware of this. The term **"Fictive Fact"** is increasingly used in footnotes to flag exactly what you are doing: *"This detail appears in [Novel], but is fictionalized."*

  However, the hardening you describe is a cultural inevitability. It is the price of writing historical fiction well. If you write a scene vividly enough, it feels more true than a dry letter in an archive. The human brain prefers a coherent narrative to a fragmented fact.

  ### Summary
  If you need a label for your afterword or your own understanding, the most precise phrase is **Source Contamination via Fictive Hardening.**

  But philosophically, the act is **Posthumous Narrative Dispossession.** You have taken the dead person's story away from them (and their stewards) and replaced it with a better story. Whether that is a "wrong" depends on whether you believe the dead have a right to a boring truth over a compelling lie. Most biographers would say yes; most novelists would say the emotional truth justifies the factual trespass.

  The tragedy you are describing is that **the novel outlives the disclaimer.** The afterword falls out of the binding; the interview is forgotten; the scene remains. That is not a failure of your ethics; it is a function of how culture digests art. You are experiencing the power of the form you work in. It is a compliment to your skill, but a burden on your conscience.
