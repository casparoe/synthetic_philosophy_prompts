answer: |-
  You have identified a very specific, well-documented, and deeply frustrating labor phenomenon. You are right that the standard terms don't quite fit because they miss the *narrative inversion*—the lie that the residue is actually an upgrade.

  There is no single, universally agreed-upon noun for this exact shape, but there are three existing concepts that form the corners of the triangle you're describing. None of them capture the whole picture alone, which is why you feel the gap.

  ### The Existing Neighbors

  **1. The Irony of Automation (Lisanne Bainbridge, 1983)**
  This is the cognitive science ancestor of your observation. Bainbridge argued that as automation becomes more sophisticated, the human operator's role shifts from active control to passive monitoring.
  *   **Where it fits:** It captures the "pilot" example perfectly. The human is only needed for the rare, high-stakes failure modes.
  *   **Where it misses:** Bainbridge argued this makes the job *cognitively harder* (staying vigilant is hard). Your point is that the job becomes *lower status* and *worse*, even if it is framed as "higher level." She describes the cognitive trap; you are describing the **status trap**.

  **2. Digital Janitorial Work (Sarah Roberts, 2019)**
  Roberts studies content moderators and data labelers. She describes work that involves cleaning up the messes algorithms leave behind (toxic content, mislabeled data).
  *   **Where it fits:** It captures the "residue" aspect perfectly. The human is there to scrub the inputs and soothe the outputs.
  *   **Where it misses:** This term is usually applied to low-wage, precarious gig work. It doesn't capture what happens when a *professional* class (like doctors or pilots) is subjected to the same dynamic but told they are being "elevated."

  **3. Skill Polarization (David Autor / Economics)**
  This is the macro-economic theory that automation eats "middle-skill" routine jobs, leaving high-skill abstract jobs and low-skill service jobs.
  *   **Where it fits:** It explains why the "skilled middle" vanishes.
  *   **Where it misses:** It describes the labor *market*, not the *job content*. It doesn't account for the rebranding of the leftover tasks as "high skill."

  ### The Coinage: "Residue Promotion"

  Since the existing terms miss the specific *narrative deception* you identified, the most precise name for this shape is **Residue Promotion**.

  **Definition:** A structural change in labor where automation expropriates the core skilled tasks of a role, leaving the human with the unskilled residue (prep, exceptions, emotional labor, liability), which is then rhetorically rebranded as "higher-level" work to justify stagnant wages and shifted risk.

  ### The Carving: How it differs from the neighbors

  To get the precision you asked for, here is how **Residue Promotion** carves out its own space:

  **1. Vs. Deskilling**
  *   **Deskilling** admits the degradation. If a craftsman becomes a button-pusher, management acknowledges the skill floor has dropped (which is why wages often drop).
  *   **Residue Promotion** *denies* the degradation. It insists the button-pusher is now a "System Manager." It uses the language of elevation to prevent demands for higher pay or better conditions. It is **deskilling masked as upskilling.**

  **2. Vs. "Left with the Hard Bits"**
  *   **The Optimistic View:** "Automation takes the boring stuff; humans get the interesting edge cases." This assumes the edge cases are *puzzles* to be solved (diagnosing a rare disease).
  *   **Residue Promotion:** The edge cases aren't just puzzles; they are **messes.** They are angry customers, broken inputs, and ethical liabilities. It's not that the work is "harder" in a skilled sense; it's that it is **friction-heavy.** The "skill" required is patience and absorbing blame, which are not compensated skills.

  **3. Vs. Human-Machine Complementarity**
  *   **Complementarity** implies synergy: The human does X, the machine does Y, and X+Y is greater than the sum of parts.
  *   **Residue Promotion** implies **displacement:** The machine does the *value-generating* work (the flying, the diagnosing), and the human does the *value-maintaining* work (cleaning, monitoring, apologizing). The human is no longer a partner; they are a **shock absorber.**

  ### Why the name matters

  Naming this **Residue Promotion** highlights the specific economic fraud occurring.

  1.  **Cost Shifting:** By calling it "upskilling," the company argues the *worker* should pay for the retraining (to learn the new "high level" system), even though the company saved the money on the core labor.
  2.  **Liability Shield:** When the algorithm fails (the "one-in-a-million" crash, the misdiagnosis), the human is the "higher-level supervisor" who should have caught it. The "promotion" is actually a **liability trap.**
  3.  **Wage Suppression:** If the job is "more interesting" and "higher level," why isn't the pay higher? Because the market knows it's residue. The narrative prevents the wage from correcting downward (which would admit the job is worse) or upward (which would admit the work is hard).

  ### Summary
  You are describing **Residue Promotion**. It is the process where the **core** of a job is automated, the **edges** are humanized, and the **status** is inverted to hide the loss of agency. It is not deskilling, because the skill isn't just removed; it's evicted and replaced with a story. It is not complementarity, because the human is handling the waste, not the value.

  It is the **Janitor Paradox**: You are told you are now the Building Manager, but your keys only open the supply closet and the bathroom.
