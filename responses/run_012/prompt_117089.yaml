answer: |-
  # JOINT STATEMENT OF ADVERSARIAL COLLABORATION
  **Subject:** The Scientific Status of the Free Energy Principle (FEP)
  **Date:** 24 May 2024
  **Participants:** Proponent (Defender of FEP as Unifying Principle), Critic (Skeptic of FEP as Substantive Claim)
  **Chair:** [Name Redacted]

  ## 1. AGREED CLAIMS
  *The following propositions are accepted by both parties without reservation. They are intended to establish the formal and logical baseline from which the disagreement proceeds.*

  1.  **Formal Validity:** The variational free energy (VFE) constitutes an upper bound on surprise (negative log model evidence) for any probability distribution approximating a posterior. This is a mathematical identity derived from Jensen's inequality and holds regardless of the physical substrate.
  2.  **Existence of Description:** For any dynamical system that maintains a statistical boundary (a Markov blanket) separating internal states from external states, it is mathematically possible to construct a generative model such that the system's dynamics can be *described* as gradient descent on VFE.
  3.  **Distinction of Categories:** Both parties agree that there is a distinction between (a) the claim that a system *can be modeled* as minimizing free energy (a descriptive claim) and (b) the claim that a system *must* minimize free energy to persist as a distinct entity (a constitutive or law-like claim). The present dispute concerns the truth of (b).
  4.  **Role of Priors:** Both parties agree that behaviour under the FEP is determined by the contents of the generative model (specifically, prior preferences over states). Changing the priors changes the behaviour. The disagreement concerns whether the *structure* of the principle constrains the priors, or whether the priors are free parameters that render the principle flexible.
  5.  **Empirical Commitment:** If the FEP is a substantive principle of self-organisation (Claim 1b), there must exist at least one conceivable observation of a persisting system that would be incompatible with the FEP, without rendering the model trivial (e.g., by overfitting).

  ## 2. RESIDUAL DISAGREEMENTS
  *The core points of contention, stated in the preferred terminology of each party.*

  | Topic | Proponent's Formulation (Defender) | Critic's Formulation (Skeptic) |
  | :--- | :--- | :--- |
  | **Ontological Status** | The FEP is a **law of existence**: any system that persists in a changing environment *necessarily* implements variational inference. The mathematics reveals a causal constraint on nature. | The FEP is a **modeling framework**: it is a lens through which we can view systems, but the "minimisation" is an attribution by the observer, not a mechanism in the system. |
  | **The Markov Blanket** | The Markov blanket is a **physical discovery**: it identifies the objective boundary where conditional independence holds, distinguishing the system from the world. | The Markov blanket is a **methodological choice**: the partition is selected by the modeller to make the math work; it does not exist independent of the description. |
  | **Explanatory Power** | The FEP **unifies** biology and cognition: it explains why homeostatic systems look like Bayesian inferencers without requiring them to "know" probability. | The FEP **redescribes** known phenomena: it adds mathematical complexity to standard control theory or Bayesian inference without yielding novel predictions. |
  | **Falsifiability** | The FEP is **falsifiable**: a system could exist that maintains its integrity while violating the conditional independencies required by the blanket or the gradient flow. | The FEP is **unfalsifiable**: because any trajectory can be rationalized post-hoc by adjusting the generative model, no observation can rule it out. |

  ## 3. THE CRUXES
  *Specific sub-questions where resolution would shift the position of at least one party. Each includes a concrete test and pre-registered predictions.*

  ### Crux 1: The Independence of the Blanket
  *   **The Question:** Can a Markov blanket be identified in physical data without prior semantic knowledge of where the "system" ends and the "environment" begins?
  *   **Concrete Case:** Blind analysis of high-dimensional time-series data from a biological cell (e.g., metabolite concentrations and membrane potentials) using only conditional independence tests.
  *   **Predictions:**
      *   **Proponent:** A statistically robust blanket will emerge naturally from the data, corresponding to the physical membrane, without manual partitioning.
      *   **Critic:** Multiple valid partitions will exist with similar statistical fit; the "biological" boundary will be selected only by imposing external biological knowledge, proving the blanket is an artefact of the modeller.

  ### Crux 2: The Dark Room and Expected Free Energy
  *   **The Question:** Does the machinery of Expected Free Energy (EFE) uniquely solve the "Dark Room" problem (the risk that an agent minimizes surprise by seeking uninformative, static states) better than standard reward maximization?
  *   **Concrete Case:** Simulation of agents in a novel environment where "surprise minimization" and "reward maximization" diverge (e.g., a task requiring high-information gathering that temporarily increases sensory variance).
  *   **Predictions:**
      *   **Proponent:** Agents governed by EFE will exhibit epistemic foraging (seeking information) that reward-maximizing agents will not, matching biological curiosity.
      *   **Critic:** The epistemic behaviour is entirely determined by the specific priors encoded in the EFE; a standard RL agent with an "information bonus" in its reward function will behave identically, showing EFE adds no unique mechanism.

  ### Crux 3: Inverse Reinforcement and Uniqueness
  *   **The Question:** Given a specific behavioural policy, does the FEP constrain the space of possible priors more tightly than standard Inverse Reinforcement Learning (IRL)?
  *   **Concrete Case:** Observing a specific navigational trajectory of an animal. Attempt to recover the priors/loss function that generated it under FEP vs. standard Rational Analysis.
  *   **Predictions:**
      *   **Proponent:** The FEP structure (specifically the coupling of accuracy and complexity costs) will rule out certain prior/loss combinations that standard IRL permits, yielding a more precise recovery.
      *   **Critic:** The "any admissible policy is optimal for some prior" theorem holds for FEP as it does for IRL. The recovered priors will be equally underdetermined in both frameworks.

  ## 4. ASSESSMENT OF RECURRING TOPICS
  *Classification of the four topics that have dominated previous sessions.*

  1.  **Markov Blanket (Discovery vs. Artefact):** **Genuine Crux.** This is not merely verbal. If the blanket is solely a modeller's choice, the FEP cannot be a law of nature (Claim 1b). It requires empirical verification of conditional independence structures in raw physical data.
  2.  **Dark Room Objection (Relocated vs. Solved):** **Verbal / Hybrid.** Much of this dispute rests on the definition of "surprise." If "surprise" includes long-term expectations (via EFE), the objection dissolves mathematically. The remaining disagreement is empirical: does the *biological implementation* of these expectations match the FEP formalism better than alternatives?
  3.  **Falsifiability (Discredited vs. Misclassified):** **Genuine Crux.** This is a philosophical demarcation issue. If the FEP is a "principle" in the sense of a tautology (like the principle of least action in some readings), it is not discredited but misclassified as a causal theory. If it claims causal necessity, it must be falsifiable.
  4.  **Decision Theory (Unfalsifiable in Principle):** **Genuine Crux.** This is the "Tautology Charge." If any behaviour can be rationalized by tuning priors, the theory explains nothing. This reduces to Crux 3 (Uniqueness). If the FEP imposes structural constraints on *which* priors are admissible for a persisting system, it survives. If not, it is vacuous.

  ## 5. CLOSING: VERBAL DISPUTES AND TRACTABLE REQUIREMENTS
  *Judgement on the nature of the remaining disagreement and the path forward.*

  **Merely Verbal Disputes:**
  A portion of the conflict stems from the word **"Principle."** The Proponent uses it to imply a *law of nature* (like gravity), while the Critic hears *framework for description* (like thermodynamics applied to economics). If the Proponent concedes that FEP is a "necessary condition for self-organisation under a specific description" rather than a "force," and the Critic concedes that this description might be the *only* one that scales across brain, cell, and society, the rhetorical heat will diminish. This is a categorization error, not a factual one.

  **Tractable Disagreements:**
  The remaining disagreement is not about words, but about **identifiability** and **independence**. For the dispute to become scientifically tractable, the following must be specified and measured:

  1.  **Complexity Penalties:** The parties must agree on a metric for model complexity that is independent of the fit. The Critic argues the Proponent can always increase complexity to fit data; the Proponent must demonstrate a hard bound on complexity imposed by the physics of the system.
  2.  **Blanket Robustness:** The Proponent must demonstrate that the Markov blanket persists across changes in the scale of observation (e.g., from neurons to regions) without arbitrary re-partitioning.
  3.  **Prior Constraints:** The Proponent must specify a class of priors that are *forbidden* by the FEP for a living system. If all priors are admissible, the Critic is correct that the theory is vacuous.

  **Required Action:**
  The next session will not discuss the FEP in the abstract. It will focus on a single dataset (e.g., *C. elegans* connectome and behaviour). The Proponent must produce a generative model with fixed complexity constraints derived from FEP. The Critic must produce a null model (e.g., standard control theory) with equivalent parameter counts. We will compare predictive accuracy on held-out data. If the FEP model does not outperform the null model despite its structural constraints, the Claim of Substantive Explanatory Power (Section 1, Claim 3) is withdrawn.
