answer: |-
  **MEMORANDUM**

  **TO:** Board of Directors, [Foundation Name]
  **FROM:** [Your Name]
  **DATE:** October 26, 2023
  **SUBJECT:** Policy Recommendation on Discount Rates for Intergenerational Grantmaking

  ### Executive Summary

  We are at a inflection point. The recent bequest allows us to alter the trajectory of this foundation for decades, perhaps centuries. We are currently divided between funding immediate relief and funding long-term stewardship (e.g., reforestation, century-scale research).

  This memo argues that this is not primarily a financial decision, but an ethical one. The "discount rate" we apply to future benefits is not a market fact; it is a moral variable. Using a standard market rate (e.g., 3%+) effectively votes against the future by mathematically rendering long-term benefits negligible.

  **Recommendation:** I propose we adopt a **Dual-Track Discount Policy**.
  1.  **Operational Track:** For projects with impacts under 30 years, we use a real market rate (currently ~2.5–3%) to ensure capital efficiency.
  2.  **Stewardship Track:** For projects with impacts extending beyond 50 years, we use a **Social Discount Rate of 0.5%**. This rate accounts for existential risk (the chance the project or foundation fails) but rejects "pure time preference" (the idea that future lives are intrinsically worth less than present ones).

  ### The Problem: A Value Judgment Wearing a Number's Clothes

  Our economist colleague suggests using the market rate of return. In a for-profit firm, this is correct. A dollar today is worth more than a dollar tomorrow because the dollar today can be invested to become $1.03 tomorrow.

  However, we are not a firm. We are a charitable trust. When we apply a 3% discount rate to human welfare, we are not just calculating opportunity cost; we are asserting that a unit of well-being experienced in 2124 is worth less than half a unit of well-being experienced today, simply because of when it occurs.

  In my previous career in geology, I worked with time scales where human lifespans were negligible. We drilled cores looking for patterns that took millions of years to form. If we had applied a "market discount rate" to the Earth's history, the deep past would have been worthless to us. We would have only cared about the surface layer. As a foundation, we must decide: Are we surface miners, or are we stewards of the strata?

  ### The Recommendation: A 0.5% Social Discount Rate for Long-Term Projects

  I recommend we formally codify a **0.5% discount rate** for any project where the primary beneficiaries are not yet born or where the payoff horizon exceeds 50 years.

  **Why 0.5% and not 0%?**
  A 0% rate implies perfect certainty that our institution, the recipient institution, and the political framework will exist in 200 years. That is geologically naive. Institutions erode. The 0.5% is not a charge against the *value* of future people; it is a risk premium for *continuity*. It says: "We value their welfare equally to ours, but we acknowledge the probability that the bridge to them may collapse."

  **Why not 3%?**
  At 3%, a benefit worth $1,000,000 in 150 years has a present value of roughly $12,000. This makes intergenerational projects mathematically impossible to justify against almost any immediate need. It forces us to be short-sighted by formula.

  ### The Strongest Case Against This Proposal (The Market Rate Argument)

  I anticipate our economist will argue for the 3% rate. Their argument is not without merit, and we must understand it to refute it properly. The case for the market rate rests on two pillars:

  **1. Diminishing Marginal Utility (The Wealth Argument)**
  The argument assumes economic growth will continue. If the global economy grows at 2% per year, people in 2124 will be roughly 20 times wealthier than we are. Therefore, $1 given to a person today (who might be struggling for basics) creates more "welfare" than $1 given to a person in 2124 (who will likely be wealthy). By discounting the future, we are implicitly transferring resources from the rich future to the poor present.
  *   *What has to be true for this to hold:* Continuous economic growth must be assumed, and that growth must actually result in increased well-being for the specific populations we aim to help. If the future is ecologically collapsed or highly unequal, this assumption fails.

  **2. Democratic Accountability (The Agency Argument)**
  We do not know what future people will value. By locking capital into a 200-year endowment for a specific purpose (e.g., a specific type of research), we are "dead-hand controlling" resources. We might be funding a solution to a problem they solved decades ago, or preventing them from using that capital for a crisis we couldn't imagine.
  *   *What has to be true for this to hold:* We must assume future generations will lack the capital to solve their own problems, or that our specific intervention is so critical that it outweighs the loss of flexibility.

  ### Why We Must Depart from the Market Rate

  While the counter-arguments are logically sound within standard economics, they fail as moral guides for *this* foundation for three reasons:

  **1. The Category Error**
  Market rates reflect private time preference (how much *I* want money now vs. later). They reflect impatience and risk. A foundation exists specifically to correct market failures. If the market undervalues the future (which it demonstrably does regarding climate and biodiversity), our job is to overvalue it, not mimic the market's myopia.

  **2. The Non-Substitutability of Certain Goods**
  The "Wealth Argument" assumes money can buy welfare. This is true for consumption. It is not true for existential risks. If we do not fund reforestation or biological research now, the "wealthier" people of 2124 may inherit a biosphere that cannot support them. You cannot buy a stable climate with GDP. For critical natural capital, the discount rate must approach zero.

  **3. The Trusteeship Duty**
  We are not owners of this capital; we are trustees. A trustee has a duty to the remaindermen (the future beneficiaries) as well as the current income beneficiaries. Ignoring the remaindermen because they are not here to vote is a breach of fiduciary duty to the mission of perpetuity.

  ### Implementation and Safeguards

  Adopting a near-zero discount rate for long-term projects creates a risk: we could lock up capital in "zombie projects" that consume resources but yield no value. To mitigate this, I propose the following governance rules alongside the rate:

  1.  **Sunset Reviews:** Any project funded under the Stewardship Track (0.5% rate) must undergo a mandatory review every 25 years. The principal can be redeployed if the original thesis is obsolete.
  2.  **The "Existential Threshold":** The 0.5% rate applies *only* if the project addresses a risk or opportunity that is irreversible or cumulative (e.g., species loss, climate stability, foundational knowledge). It cannot be used for standard deferred giving.
  3.  **Spending Floor:** We maintain a minimum annual payout (e.g., 4% of total assets) to ensure we are not hoarding capital at the expense of current suffering. This balances the dual tracks.

  ### Conclusion

  In three weeks, we must decide how to deploy this bequest. If we use the market rate, the decision is made for us: the money goes to the present. If we use a social discount rate, we reclaim the agency to choose the future.

  I am not asking us to ignore the present. I am asking us to acknowledge that the math we use to compare the present and the future is a choice about who counts as a person. As a geologist, I know that the layers we stand on were laid down by processes that didn't care about the surface. As a foundation, we must care about the layers we are laying down.

  I move we adopt the Dual-Track Discount Policy as outlined above.

  Respectfully,

  [Your Name]
  Board Member
