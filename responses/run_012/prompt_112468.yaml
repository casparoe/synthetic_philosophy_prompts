answer: |-
  Hey, this is a really sharp objection your friend is making, and honestly, it is the strongest version of the cluelessness argument I have seen because it concedes the practical ground to save the theoretical core. Before I give you the number, I need to sharpen the proposition we are evaluating because the phrase real fix is doing too much work. If we just mean does it make decision-making easier, the answer is obviously yes, but that is not what matters here. What matters is whether it resolves the epistemic paralysis without introducing a new normative arbitrariness that undermines the theory's action-guiding force. So let us define the proposition as follows: adopting a finite horizon resolves the cluelessness objection sufficiently to preserve consequentialism as a determinate criterion of rightness, rather than merely shifting the uncertainty from the consequences to the choice of the horizon itself.

  My credence in that proposition is about 38 percent. I am leaning against it being a full fix, mostly because I think the problem gets relocated rather than dissolved, but I am not below 50 percent because the practical relief is significant enough that it might not matter for most moral agents. To get to that number, I am weighing four sub-questions that act as gates for the argument. The first gate is whether the unpredictability of consequences is a matter of principle or merely practice. If the future is unknowable in principle due to chaos or quantum indeterminacy, then shrinking the horizon does not help much because even short-term chains are opaque. However, I assign an 80 percent probability to the view that this is mostly a practical limitation. In most macroscopic human contexts, causal chains dampen over time, meaning the further out you go, the less variance your specific action introduces relative to background noise. If this is true, a finite horizon captures the bulk of the moral signal while cutting off the noise.

  The second sub-question is whether cluelessness attacks the criterion of rightness or only the decision procedure. If the theory tells us what is right but admits we cannot know it, the theory survives as a metaphysical account even if it fails as a guide. I give a 60 percent probability to the view that cluelessness is primarily a problem for decision procedures. Your friend's move works best here because if the goal is to guide action, a finite horizon makes the calculation tractable enough for humans to use, even if the metaphysical truth remains distant. However, this is where the third sub-question bites hard, which is whether we can non-arbitrarily justify the specific horizon chosen. If you pick fifty years, why not forty-nine? If there is no moral significance to the cutoff, then the theory becomes vulnerable to manipulation where agents select horizons that justify their preferred actions. I only give this a 30 percent probability. It is very difficult to find a natural moral decay rate for consequences that aligns with a clean temporal cutoff, and without that, the arbitrariness relocates the cluelessness from the outcomes to the parameters of the evaluation.

  The fourth sub-question is whether this burden is unique to consequentialism. Your original intuition was that every theory faces uncertainty, and I think there is truth there, but consequentialism bears the brunt because it makes uncertainty directly constitutive of moral value rather than just a constraint on agency. I assign a 70 percent probability to the claim that while all theories face epistemic limits, consequentialism is uniquely sensitive to them because it lacks side-constraints to stop the regression. When I combine these, I am treating the horizon justification as the bottleneck. Even if the epistemic access is good and the procedure is workable, if the horizon is arbitrary, the criterion of rightness is not fixed. I am weighting the horizon justification heavily, roughly double the weight of the others, because if that fails, the fix is merely cosmetic. So if you take the high confidence in practical knowability and multiply it by the low confidence in non-arbitrary horizons, you get a number that stays below the 50 percent threshold, landing me at 38 percent.

  The number is most sensitive to that third sub-question about the arbitrariness of the horizon. If you could show me that there is a natural discount rate for moral value that corresponds to causal dilution, my credence would jump above 70 percent immediately. Conversely, if you showed that causal effects do not dampen but instead compound unpredictably even in the short term, my credence would drop to near zero. The piece of evidence that would actually move me is not a philosophical argument about duties or virtues, but an empirical or formal model of causal decay in social systems. If we could demonstrate that the variance in outcome values attributable to a specific action drops below a negligible threshold after a specific duration due to systemic interference, that would ground the horizon in reality rather than convention. Until then, I think your friend is right that the finite-horizon move saves the usability of the theory but sacrifices the objectivity of the criterion, which means the cluelessness problem has not gone away so much as it has put on a different hat.

  I hope this helps you pin down where you stand, because I think you are both half-right. You are right that uncertainty is universal, but she is right that consequentialism makes that uncertainty constitutive of the good itself. The finite horizon bridges the gap pragmatically, but it does not close it metaphysically. Let me know if you want to dig into the causal decay idea, because that seems like the only way to win this thing decisively.

  Best,
  Assistant
