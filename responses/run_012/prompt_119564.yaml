answer: |-
  This dispute is fundamentally a normative conflict over political legitimacy that has become intractable because both sides are conflating the question of who ought to rule with the metaphysical question of whether a collective agent exists.

  Camp 1 is primarily committed to a normative claim about authority: that in a democracy, the legislature is subordinate to the electorate's direct decision. Their metaphysical commitment to a "collective will" is secondary and instrumental; they posit the existence of the will because they believe the authority ought to exist. When they say the vote "expresses" the will, they are using "expresses" in a declaratory sense: the vote reveals a pre-existing moral fact about what the community owes itself. Their weak point is epistemic: they treat a narrow majority (50% + 1) as sufficient evidence of a coherent collective intent, ignoring the noise inherent in aggregation.

  Camp 2 is primarily committed to a metaphysical claim about agency: that only individuals exist, and collective nouns are fictions. Their normative conclusion—that the legislature is not bound—is derived from this ontology. Because the "will" is not real, it cannot bind. When they say the vote "aggregates" preferences, they use "aggregates" in a constitutive sense: the vote creates the outcome based on arbitrary rules (thresholds, wording), so the outcome cannot claim prior authority. Their weak point is normative: by reducing the vote to mere arithmetic sensitive to framing, they undermine the legitimacy of any democratic decision, not just referendums, potentially leading to a technocratic elitism they may not intend.

  The equivocation lies in the phrase "will of the people." Camp 1 uses it to denote a sovereign authority (a normative status), while Camp 2 attacks it as a psychological or ontological entity (a metaphysical fact). Camp 1 equivokes on "expresses," treating a constructed outcome as a discovered truth. Camp 2 equivokes on "arbitrary," implying that because the result depends on the rules, it lacks moral force, which conflates epistemic fragility with normative invalidity. Camp 3 is correct that the questions differ, but incorrect to suggest they can be easily filed separately; Camp 1 needs the metaphysics to support the normativity, and Camp 2 uses the metaphysics to dismantle the normativity.

  Your hypothesis is the only viable path forward. Progress requires explicitly separating the three claims you identified: existence (metaphysics), revelation (epistemology), and authority (normativity). A productive shift would be to agree on Camp 2's metaphysics (no mystical collective entity exists) while debating Camp 1's normativity (we should treat certain aggregates *as if* they were binding commands for stability's sake). This moves the debate from "Is the will real?" to "Under what institutional conditions (supermajorities, clear wording, multiple votes) does a referendum result acquire sufficient legitimacy to bind a legislature?"

  However, given the duration of this stalemate, nothing short of bracketing the metaphysical question will move people who have dug in. Camp 2 views the metaphysical skepticism as a moral duty against populism, and Camp 1 views the metaphysical realism as a moral duty against elitism. If they cannot accept your hypothesis to separate the claims, you should change the subject to institutional design without referencing the "will of the people" at all. This dispute is worth having anyway because it exposes the central fragility of democratic theory: that we must act on the fiction of collective agency to maintain a system that theoretically denies it.
