      *   **Camp 2 (Aggregation/Skeptic Model):** Committed to a *metaphysical/ontological* claim that "collective will" is a fiction (methodological individualism). Committed to an *epistemic* claim that voting rules determine outcomes (Arrow's theorem, etc.). Denies the *normative* force derived from the "will" language.
