  ### Summary of Friction
  *   **You wanted:** Case 1 to be easy, Case 2 to be hard.
  *   **Procedure says:** Case 1 is risky (needs vote/history), Case 2 is robust (action proves sincerity).
  *   **The Lesson:** Financial swaps are vulnerable to "moral speculation" (people pretending to care to get funds). Behavioral swaps are vulnerable to "indulgence" accusations, but they produce **verifiable reality changes**. If your goal is actual good done, the vegetarian trade is the stronger contract.

  ### Final Advice for the Desk
  If you approve Case 1 without the History Check, you validate your friend's view that this is just "buying off extremists." If you use the History Check, you turn it into "cooperating with established allies."

  If you reject Case 2 because it feels icky, you are prioritizing the *purity of the trader* over the *welfare of the animals*. Since your money goes to the animals either way, the trader's diet is their business. Approve Case 2, but watch Case 1 closely.
