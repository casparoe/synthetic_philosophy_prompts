          *   *Likely outcome:* Distress. Games often lack the "Form" to contain the "Suffering."

  8.  **Refining the "Maker" Argument:**
      *   The user says: "if the pleasure of tragedy were the pleasure of the finished and the held, I should have been miserable at the desk."
      *   My counter: At the desk, you are not the audience. You are the architect. You aren't feeling the grief; you are *solving* the grief. The "happiness" was the happiness of *solution*, not the happiness of *sadness*.
