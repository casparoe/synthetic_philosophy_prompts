prompt: |-
  I'm a software engineer with no philosophy training whatsoever, so forgive me if I mangle the terminology. I'd like you to act as an expert on the philosophy and ethics of how we define death — someone who knows the clinical criteria as well as the arguments around them — and to think carefully before you commit to an answer.

  Here's the thing I keep tripping over. "The heart has stopped" seems to mean two different things. Sometimes it means the heart has stopped and nobody is ever going to restart it, which is basically what happens when a resuscitation attempt is called off. Sometimes it means the heart couldn't be got going again even in principle. Those clearly aren't the same thing: a heart that's stopped and abandoned is still, in the second sense, perfectly restartable — someone with the right kit could absolutely start it up again. I think the distinction gets called permanent versus irreversible, I'm not sure. Anyway, that gap seems to be doing a lot of quiet work in arguments about whether someone is dead, and I want a case engineered to sit exactly in it.

  So please construct me a thought experiment, one paragraph, set in an ordinary hospital, no sci-fi, no cryonics, no coming back from the dead — in which a single patient is dead on one reading of the circulatory criteria and not dead on the other, at the same moment, with everything else held fixed. Two constraints: don't build it on any of the famous real cases (no pregnant woman kept on a machine, no teenager on a ventilator for years), and don't let it hinge on the UK-versus-US disagreement about how much of the brain has to be gone — I want the split to be on the circulation side, not the brain side. Start by brainstorming two or three candidate setups and say why you're binning the ones you bin, then pick one and write it out properly.

  After the scenario, do the checks: say what each reading of the criteria implies for that patient and why, tell me which single feature of the case is doing the work, and what happens to the verdict if that feature is removed. Then argue the other side for me — how would someone who insists the patient is still alive attack the case? And finish with what would have to change in hospital practice, or in the law, if we swapped one reading for the other. Make sure the verdicts actually fall out of the criteria rather than being baked in by how you describe the patient; if I can spot the answer coming from the framing, the case is no good.
