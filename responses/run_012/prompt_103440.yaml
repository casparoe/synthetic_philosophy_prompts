      *   **Constraints:**
          *   No famous real cases (e.g., Jahi McMath, pregnant women on support).
          *   No brain death criteria disputes (focus strictly on circulatory/respiratory criteria).
          *   Start by brainstorming 2-3 candidates and explaining why some are binned.
