      *   *Selection:* I'll go with a variation of Candidate 3/4. A patient in an ordinary hospital where advanced perfusion technology (like ECMO) is physically present and capable of restarting the heart, but the medical team has made a valid ethical decision *not* to use it (DNR/DNI or medical futility regarding the arrest itself). This highlights the "Permanent" (won't restart) vs. "Irreversible" (can't restart) gap perfectly within a standard setting.

      *   *Wait, let's refine for the "One Paragraph" constraint.* I need to make sure the scenario is tight.
      *   *Revised Candidate:* A patient with a valid DNR order suffers cardiac arrest in a hospital that has immediate ECMO capability. The heart stops. The team stands down per the DNR.
      *   *Why bin the others?* Wilderness violates "ordinary hospital." Standard DCD is too routine/expected. The DNR + ECMO availability creates the sharpest tension between "could" and "will."

  4.  **Drafting the Scenario:**
      *   Setting: Ordinary urban hospital.
      *   Patient: Mr. Henderson, end-stage heart failure.
      *   Event: Cardiac arrest.
