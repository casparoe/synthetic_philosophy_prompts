      *(Self-Correction during drafting)*: I need to be careful with the "Irreversible" verdict. If the heart has stopped for 5 minutes, is it *biologically* irreversible without intervention? Usually, after 5 minutes, ischemic damage starts, but with ECMO, you can still restart. So strictly speaking, it is *reversible* with intervention. The "Irreversible" criterion usually implies "cannot be restarted by *any* means." If the means exist but aren't used, it's not irreversible. So the "Alive" verdict holds under strict irreversibility.

