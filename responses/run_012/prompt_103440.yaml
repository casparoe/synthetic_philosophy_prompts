      3.  *The DNR/ECMO case:* Selected. It isolates the decision vs. capability.

      *(Writing the Scenario)*: Keep it tight. Mr. Henderson. Asystole. DNR. ECMO available. 5 minutes elapsed.

      *(Analysis)*:
      *   Permanent = Dead (Won't restart).
      *   Irreversible = Alive (Could restart).
