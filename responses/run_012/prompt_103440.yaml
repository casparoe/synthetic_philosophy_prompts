          *   Counter-argument: How would someone insisting the patient is *alive* attack this?
          *   Implications: What changes in practice/law if we swap readings?
          *   Quality Control: Verdicts must follow from criteria, not framing bias.

  2.  **Deconstruct the Core Distinction:**
      *   *Irreversible:* Cannot be restarted *at all* (biological impossibility, even with infinite tech/effort).
      *   *Permanent:* Will not be restarted *in this context* (decision made not to resuscitate, or resources unavailable).
      *   The user correctly identifies that "permanent" allows for the theoretical possibility of restart, whereas "irreversible" does not. Most modern DCD (Donation after Circulatory Death) protocols rely on *permanence* (waiting 5 minutes to ensure auto-resuscitation doesn't happen and no one *will* restart it), not strict *irreversibility*.

  3.  **Brainstorming Candidate Setups:**

      *   *Candidate 1: The Remote Wilderness.* Patient stops in a field hospital with no equipment. A specialist with a portable ECMO machine is 10 minutes away.
          *   *Critique:* Too close to "resources unavailable." Might muddy the waters with triage ethics. Also, "ordinary hospital" constraint makes this hard to fit without stretching "ordinary."
      *   *Candidate 2: The DCD Donor.* Patient is a planned organ donor. Family consents to withdrawal of life support. Heart stops.
          *   *Critique:* This is the standard real-world case. The prompt asks for a thought experiment *engineered* to sit in the gap, not just describing standard DCD. Also, risks hitting the "famous cases" constraint if not careful. It's a bit too routine.
