      *   **Aggregator (Consequentialist/Utilitarian/Contractualist):** Key idea: Each life has value. Saving more lives minimizes total loss. The "separateness of persons" objection (Rawls/Nozick) doesn't preclude summing benefits when the choice is between outcomes. Each person has a reason to be saved; more people = more reasons.

