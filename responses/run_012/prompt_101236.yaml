  Here is the breakdown of your friend's taxonomy, her likely predictions, the hidden rules at play, and the case that will force her to reveal her hand.

  ### 1. Her Predictions

  **Case A: New Caledonian Crow Tool Culture**
  *   **Her Call:** **Gregorian.**
  *   **Why:** You noted her specific justification for the songbird: it wasn't Skinnerian because of the species, but because *"nobody's handing the bird a tool."* The New Caledonian crow case explicitly involves a physical artifact (the hooked stick) that stores information and is transmitted socially. Since she classified a kid with pencil-and-paper (physical artifacts) as Gregorian, consistency demands she upgrade the crow once a physical "mind-tool" enters the loop. The tool acts as the external scaffold.

  **Case B: Large Language Model (RLHF)**
  *   **Her Call:** **Skinnerian.**
  *   **Why:** Despite dealing in language (usually a Gregorian marker), the *mechanism* of improvement here is Reinforcement Learning from Human Feedback. It is pure operant conditioning: output is generated, human gives thumbs up/down (reward/punishment), weights are adjusted. This maps perfectly to her lab rat and songbird classifications. The "content" is cultural, but the "process" is blind variation and external selection. Since she demoted the songbird (cultural content) to Skinnerian based on mechanism, she will demote the LLM similarly.

  ### 2. The Rule She Is Actually Running

  She tells herself she is using Dennett's **"Locus of Trial-and-Error"** (Genes vs. Body vs. Head vs. Culture).

  **The Actual Rule:** **The External Scaffolding Heuristic.**
  She is classifying based on **Artifact Dependence**, not cultural transmission.
  *   **Darwinian:** No learning (Hardwired).
  *   **Skinnerian:** Learning via direct environmental feedback (even if social), *without* external cognitive props.
  *   **Popperian:** Learning via internal simulation (no external feedback needed for the test).
  *   **Gregorian:** Learning that *requires* an external physical or symbolic artifact to function (pencils, paper, words-as-tools).

  **Evidence:** The songbird is the key. Dennett explicitly considers vocal learning a precursor to Gregorian cognition because it involves cultural transmission. Your friend rejects this. She insists that without a "tool" (external reification), social copying is just complex reinforcement. She has shifted the definition of Gregorian from "Cultural" to "Technological/Artifact-Based."

  ### 3. Alternative Rules That Fit Her Data

  Two other rules explain every single one of her past calls just as well as the Scaffolding Heuristic:

  **Alternative A: The "Human Exceptionalism" Rule**
  *   **Rule:** Only *Homo sapiens* are capable of Gregorian cognition. All other animals max out at Popperian (if clever) or Skinnerian (if associative).
  *   **Fit:** Every Gregorian case she listed is a human (Kid, Toddler). Every non-human is Darwinian, Skinnerian, or Popperian. The songbird was Skinnerian not because of the lack of a tool, but because it's a bird.
  *   **Conflict:** This contradicts the Crow prediction. If she follows this rule, the Crow Tool Culture must be Skinnerian or Popperian, regardless of the tool.

  **Alternative B: The "Digital Symbolism" Rule**
  *   **Rule:** Gregorian cognition requires *discrete, combinatorial symbols* (language, math). Continuous signals or physical tools don't count.
  *   **Fit:** Songbird song is analog/continuous $\rightarrow$ Skinnerian. Toddler words and Kid math are discrete/symbolic $\rightarrow$ Gregorian.
  *   **Conflict:** This contradicts the Crow prediction. A hooked stick is an analog tool, not a symbolic system. If she follows this rule, the Crow is Skinnerian.

  ### 4. The Tie-Breaker Case

  To force her to choose between **External Scaffolding** (her stated logic), **Human Exceptionalism** (the likely bias), and **Digital Symbolism** (the technical constraint), present her with this single case:

  **The Case:** **A human memory champion memorizing a deck of cards using the "Method of Loci" (Memory Palace) entirely in their head, with no pencil, paper, or physical tokens.**

  **Why this breaks the tie:**
  *   **If she says Gregorian:** She is a **Human Exceptionalist**. The cognition is internal (no tool) and non-linguistic (images), but because it's a human using high-level cultural training, it gets the top grade. (This invalidates her "tool" justification for the songbird).
  *   **If she says Popperian:** She is an **External Scaffolding** theorist. Even though it's a human, the lack of a physical artifact (pencil/paper) drops it down a grade. This confirms her songbird logic was genuine, not speciesist.
  *   **If she says Skinnerian:** She is a **Mechanism Purist**. She believes that because this is trained via repetition and recall (reinforcement), it doesn't matter that it's human or internal. (This would align with her LLM call).

  **Recommendation:** Bet on **Popperian**. It preserves her "Tool" distinction (separating the Memory Champion from the Kid with Pencil) while acknowledging the human capacity for internal simulation that separates it from the Rat. It reveals that for her, *Gregorian* isn't about culture or species, it's about **offloading cognition onto the world.**
