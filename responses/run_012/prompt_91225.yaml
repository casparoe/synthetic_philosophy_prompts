      *   *Let's have them calculate the 'Transmission Rate'.*
      *   *Garden 1:* Pick tall parent. Baby is average. Rate = 0.
      *   *Garden 2:* Pick tall parent. Baby is tall. Rate = 1.
      *   *Garden 3:* Pick tall parent in Valley B. Baby is tall (relative to B). But Valley B is environmentally boosted.
      *   *Decision:* I will simplify the math. They will calculate the "Resemblance Score" = (Parent Height - Average) vs (Offspring Height - Average).
      *   *Actually, to ensure they feel the "Population Property" aspect:* They need to see the *spread* change.
      *   *Revised Plan:* They don't calculate heritability. They calculate a "Breeding Confidence Score".
      *   *Wait, prompt says:* "invent their own name for the number they are computing".
      *   *Okay, I will provide a formula that calculates Variance Ratio but disguised.*
      *   *No, Variance is too hard.*
      *   *Okay, Final Decision on Metric:* **The Prediction Multiplier.**
      *   Formula: $\frac{\text{Avg Height of Offspring from Tall Parents}}{\text{Avg Height of Tall Parents}}$.
      *   This is simple division.
      *   Garden 1 (High Env): Tall parents (due to luck) have average offspring. Multiplier $\approx 0.5$ (regression to mean) or lower.
      *   Garden 2 (High Gene): Tall parents have tall offspring. Multiplier $\approx 1.0$.
      *   Garden 3 (Valleys): Multiplier is 1.0 in both. But Valley 2 is higher.
      *   *Wait, I need to ensure they see the Env Shift in Garden 2.*
      *   *Okay, I will structure the worksheet to force them to record the "Range" (Max - Min) as well.*

  6.  **Addressing the "Traps" & Debrief:**

      *   *Trap 1:* Garden 2 confirms "Fixed". *Counter:* The Env Shift phase.
      *   *Trap 2:* Garden 3 confirms "Genetic Difference". *Counter:* Reveal the decks were identical.
      *   *Trap 3:* "Heritability is meaningless". *Counter:* It was useful in Garden 2 for prediction, just not for *explanation* of group differences.

  7.  **Timeline (90 Mins):**

      *   0-10: Intro & Rules (No H-word).
      *   10-30: Garden 1 (The Swamp).
      *   30-50: Garden 2 (The Greenhouse + Shift).
      *   50-70: Garden 3 (The Two Valleys).
      *   70-80: Scoring & Shock.
      *   80-90: Debrief (The H-word).

  8.  **Materials Construction:**

      *   Need specific card values to ensure the math works out cleanly.
      *   Need to ensure the "Two Stats Students" don't dominate. *Solution:* Roles. One Recorder, One Calculator, One Dealer, One Presenter. Rotate roles. Keep arithmetic to addition/division by integers.

  9.  **Troubleshooting & Limitations:**

      *   *Risk:* Students think the simulation is "rigged" (it is, but pedagogically).
      *   *Risk:* The "Fixed" misconception sticks because Garden 2 is so clean.
      *   *Limitation:* Real data is noisy. This is deterministic ($P = G + E$). Real $h^2$ estimation involves error.
      *   *Limitation:* Ethics. The simulation is neutral; the real world is not.

