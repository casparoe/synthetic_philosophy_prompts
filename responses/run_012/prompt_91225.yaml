answer: |-
  # Seminar Activity: The Breeder's Wager

  **Session Title:** Genes, Behaviour and Society
  **Time:** 90 Minutes
  **Students:** 16 (4 Teams of 4)
  **Constraint:** The word "Heritability" is banned until the final 10 minutes.

  ## 1. Conceptual Architecture
  You are simulating a quantitative genetic model ($P = G + E$) without using the vocabulary. The core mechanic is a **Prediction Game**. Teams act as agricultural firms competing to predict crop heights.

  *   **The Secret Formula:** $Height = 50 + \text{Card}_A + \text{Card}_B$.
  *   **The Hidden Rule:** One card is **Inherited** (passed from Parent to Offspring unchanged). The other card is **Reshuffled** (drawn anew from a deck for every Offspring).
  *   **The Student Task:** Determine which card is Inherited, calculate a "Prediction Factor" (realized heritability), and use it to forecast future crops.
  *   **The Trap:** The composition of the decks (Variance of A vs. B) and the identity of the Inherited card change between Gardens, but the students are not told this.

  ## 2. Materials & Deck Construction

  You need three distinct "Garden States." You will control the decks. Students only see numbers on a worksheet.

  **General Supplies:**
  *   4 Team Folders (containing Worksheets 1-3).
  *   1 Master Deck (for you to generate data live or pre-generate on slips of paper).
  *   Whiteboard for "Global Market Prices" (Scoring).

  **The Cards (For Your Eyes Only):**
  *   **Base:** 50 cm (Constant).
  *   **Deck X (The "Gene" Proxy):** Values $\{0, 10, 20\}$. Mean = 10.
  *   **Deck Y (The "Env" Proxy):** Values vary by Garden (see below).
  *   **Inheritance Rule:** In Gardens 1 & 2, **Deck X is Inherited**. In Garden 3, **Deck X is Inherited** (but environments differ between teams).

  **Garden Configurations:**

  | Garden | Scenario | Deck X (Inherited) | Deck Y (Reshuffled) | Outcome (Variance) |
  | :--- | :--- | :--- | :--- | :--- |
  | **1** | **The Swamp** | $\{10, 10, 10\}$ (Constant) | $\{0, 10, 20\}$ (Wide) | Height varies, but **not** due to Inherited card. Prediction Factor $\approx 0$. |
  | **2** | **The Greenhouse** | $\{0, 10, 20\}$ (Wide) | $\{5, 5, 5\}$ (Constant) | Height varies due to Inherited card. Prediction Factor $\approx 1.0$. |
  | **2b** | **The Fertilizer** | $\{0, 10, 20\}$ (Wide) | $\{25, 25, 25\}$ (Shifted) | Prediction Factor still $\approx 1.0$, but **Mean Height jumps**. |
  | **3** | **Two Valleys** | **Teams 1&2:** $\{0, 10, 20\}$ <br> **Teams 3&4:** $\{0, 10, 20\}$ | **Teams 1&2:** $\{0, 0, 0\}$ <br> **Teams 3&4:** $\{30, 30, 30\}$ | Within-team Prediction Factor $\approx 1.0$. **Between-team gap is 30cm (Env).** |

  ## 3. The Worksheets (Student Facing)

  *Do not label these with Garden numbers. Label them "Season 1", "Season 2", "Season 3".*

  **Common Header:**
  > **Firm Name:** _______________
  > **The Rule:** Plant Height = 50 + Card A + Card B.
  > One card is passed from Parent to Child. One card is drawn fresh from the bag.
  > You do not know which is which. You do not know the contents of the bags.

  **The Calculation Box (The "Number"):**
  > **Prediction Factor (PF):**
  > 1. Select the 3 Tallest Parents from the data below. Calculate their Average Height ($H_{parents}$).
  > 2. Look at their Offspring. Calculate their Average Height ($H_{offspring}$).
  > 3. Calculate the Population Average ($H_{pop}$).
  > 4. **Formula:** $PF = \frac{H_{offspring} - H_{pop}}{H_{parents} - H_{pop}}$
  > *(Note: If denominator is 0, PF is undefined.)*

  **The Commitment:**
  > Based on your PF, predict the Average Height of the Next Generation if you select the Tallest Parents again.
  > **Written Prediction:** _______ cm.
  > **Confidence:** (Low / Med / High)

  ## 4. Minute-by-Minute Timeline

  **00:00 – 00:10 | Introduction & Rules**
  *   Divide into 4 teams.
  *   Explain the "Breeder's Wager": You want to maximize crop height.
  *   Explain the Formula ($50 + A + B$) and the Inheritance/Reshuffle rule.
  *   **Ban:** Do not use words like "Gene," "Environment," or "Heritability." Use "Card A/B," "Inherited/Reshuffled," "Prediction Factor."
  *   Hand out **Season 1** Worksheet.

  **00:10 – 00:25 | Season 1 (The Swamp)**
  *   **Data Reveal:** You project 10 Parent/Offspring pairs.
      *   *You generate these using Garden 1 config.* (Parents vary due to Deck Y, Offspring regress to mean because Deck X is constant).
  *   **Task:** Teams calculate the PF. (It should be near 0).
  *   **Commitment:** Teams write down a prediction for Season 2 based on selecting tall parents.
  *   **Reveal:** You reveal the actual Season 2 outcomes. (Tall parents produced average offspring).
  *   **Score:** Teams with predictions closest to reality get points. (Most will fail).

  **00:25 – 00:45 | Season 2 (The Greenhouse + Shift)**
  *   **Hand out Season 2 Worksheet.**
  *   **Data Reveal:** Project 10 new pairs.
      *   *You generate using Garden 2 config.* (Deck X varies, Deck Y constant).
  *   **Task:** Calculate PF. (It should be near 1.0).
  *   **Commitment:** Teams predict Season 3.
  *   **The Twist:** Before revealing Season 3 data, announce: *"A uniform fertilizer has been applied to all plots."* (This is Garden 2b).
  *   **Reveal:** Show Season 3 data. Heights are all +20cm higher. PF is still 1.0.
  *   **Score:** Teams that adjusted their mean prediction up win. Teams that thought "High PF = Fixed Mean" lose.

  **00:45 – 01:05 | Season 3 (The Two Valleys)**
  *   **Split:** Tell Teams 1 & 2 they are in "Valley North." Teams 3 & 4 are in "Valley South." They cannot share data.
  *   **Hand out Season 3 Worksheet.**
  *   **Data Reveal:**
      *   North: Garden 3 Config (Env = 0). Mean Height ~60.
      *   South: Garden 3 Config (Env = 30). Mean Height ~90.
  *   **Task:** Calculate PF within your valley. (Both will find PF $\approx 1.0$).
  *   **Commitment:** "Why is Valley South taller?" Teams must write a cause: *Better Inherited Cards* OR *Better Reshuffled Cards*.
  *   **Reveal:** Bring the groups together. Compare PFs (Identical). Compare Means (Different).
  *   **The Sting:** Reveal the Deck Logs. Valley South had the *exact same* Inherited Cards as North.
  *   **Score:** Teams that guessed "Reshuffled Cards" (Environment) win. Teams that guessed "Inherited Cards" (Genetics) lose heavily.

  **01:05 – 01:15 | Scoring & Shock**
  *   Tally points.
  *   Ask the losing teams: "You had a perfect Prediction Factor (1.0). Why did you lose?"
  *   Let them vent frustration. This is the cognitive dissonance moment.

  **01:15 – 01:30 | The Debrief (The H-Word)**
  *   Now you may speak the banned words.
  *   Map the activity to the concepts (see Debrief Script below).

  ## 5. Scoring Scheme

  *   **Prediction Accuracy:** 10 points for being within 2cm of the actual mean.
  *   **Causal Guess (Season 3):** 50 points for correctly identifying the "Reshuffled Card" as the cause of the Valley difference.
  *   **Penalty:** -20 points if you claimed the trait was "Fixed" in Season 2b.

  *Why this scoring:* It punishes the intuition that "High Prediction Factor = Genetic Cause of Group Difference." It forces them to realize the PF is local to the population.

  ## 6. Debrief Script (Mapping Activity to Concept)

  **Step 1: Naming the Number**
  *   **Ask:** "What did you call the number you calculated?" (They might say 'Stability', 'Transmission', 'Breeder's Ratio').
  *   **Reveal:** "In science, this is **Heritability** ($h^2$). Specifically, realized heritability."
  *   **Point:** "You invented the metric because it was useful for prediction *within* a context."

  **Step 2: Season 1 (The Swamp) $\rightarrow$ Population Specificity**
  *   **Claim Countered:** "Heritability is a property of the trait."
  *   **Lesson:** "In Season 1, Height was barely predictable (Low PF). In Season 2, it was perfectly predictable (High PF). The plants were the same. The *variation in the cards* changed. Heritability describes the **population's variation**, not the plant's biology."

  **Step 3: Season 2b (The Fertilizer) $\rightarrow$ Modifiability**
  *   **Claim Countered:** "High heritability means the trait is fixed/unchangeable." (Your colleague's claim).
  *   **Lesson:** "Your PF was 1.0 (Perfect Heritability). Yet, when I changed the Reshuffled Card (Environment) for everyone, the entire crop shifted. **Heritability describes differences between individuals, not the absolute level of the trait.** A trait can be 100% heritable and 100% modifiable."

  **Step 4: Season 3 (Two Valleys) $\rightarrow$ Between-Group Differences**
  *   **Claim Countered:** "High within-group heritability explains between-group differences."
  *   **Lesson:** "Valley South was taller. Your PF was 1.0 in both valleys. You assumed the difference was the Inherited Card. It was the Reshuffled Card. **High heritability within groups tells you nothing about the cause of differences between groups.**"

  **Step 5: Ethical Closure**
  *   **Claim Countered:** "Heritability is a villainous/discredited concept."
  *   **Lesson:** "You used this number to win points. It is a valid, useful mathematical tool for breeders and scientists. It becomes dangerous only when we assume it applies across different environments or groups, as you did in Season 3. The error isn't the math; it's the **extrapolation**."

  ## 7. Troubleshooting: What Will Go Wrong

  **1. The "Glasshouse" Trap (Season 2)**
  *   **Risk:** Students see PF = 1.0 and conclude "It's all genetics, nothing else matters." They ignore the Fertilizer Shift.
  *   **Fix:** Make the Fertilizer Shift dramatic (+20cm). In the debrief, ask: "If it was all genetics, how did the fertilizer move everyone?" Force them to reconcile the shift with the high PF.

  **2. The Stats Students Take Over**
  *   **Risk:** The two students with stats experience dominate the calculation.
  *   **Fix:** Assign roles on the worksheet: *Calculator, Recorder, Checker, Presenter*. The Calculator must show work. The Checker must sign off. Rotate roles every Season. The arithmetic (averages and subtraction) is simple enough that the non-stats students can do it if the stats students are forced to "Check" rather than "Do."

  **3. "Heritability is Meaningless"**
  *   **Risk:** After Season 3, students swing to the opposite reflex: "If it doesn't explain group differences, it's useless."
  *   **Fix:** Emphasize Season 2. "It was perfectly useful for predicting offspring *within* your valley." The point is **scope**, not validity. It is a local currency, not a universal one.

  **4. Time Overrun**
  *   **Risk:** Calculating averages takes too long.
  *   **Fix:** Pre-print the data with the sums already done if you see them struggling. Or, reduce the sample size from 10 pairs to 5 pairs. 5 pairs is enough to see the trend and keeps arithmetic trivial.

  ## 8. Limitations: What This Activity Cannot Do

  You must explicitly state these limitations in the final 2 minutes to maintain intellectual honesty.

  1.  **Measurement Error:** In this game, height is measured perfectly. In reality, measurement error lowers heritability estimates and complicates the picture.
  2.  **Additivity:** We used $P = G + E$. Real biology involves interaction ($G \times E$), where the effect of the card depends on the other card.
  3.  **Assumption of Independence:** We assumed the Inherited Card and Reshuffled Card were uncorrelated. In **Season 4 (Optional)**, you could mention that if Tall Plants get the Best Soil (Gene-Environment Correlation), the Prediction Factor becomes inflated and lies about the genetic cause.
  4.  **The Political Stakes:** This simulation is neutral. In the real world, claiming a human trait is "highly heritable" has been used to justify inequality, eugenics, and neglect of social support. The math might be clean, but the *consequences* of the math are not. The concept is contested not because the arithmetic is wrong, but because the **implications** are weaponized.

  ## 9. Instructor's Cheat Sheet (The "Why")

  *   **Why ban the word?** To prevent students from retrieving pre-existing misconceptions associated with the label. They must derive the meaning from the behavior of the system.
  *   **Why the "Prediction Factor"?** It mirrors the slope of the regression of offspring on mid-parent, which is the operational definition of narrow-sense heritability. It feels like "predictive power" to them, which is intuitively correct, making the failure in Season 3 more poignant.
  *   **Why the Scoring Sting?** Intellectual understanding is often passive. Financial (or point-based) loss creates an emotional anchor. They will remember the moment they lost 50 points because they trusted the PF across valleys.

  **Final Note to Instructor:**
  Your colleague's error was treating a **ratio of variances** (a population statistic) as a **measure of fixity** (an individual property). This activity forces that distinction into the open. When they leave, they should not say "Heritability is fake." They should say, "Heritability is real, but it stays in its lane."
