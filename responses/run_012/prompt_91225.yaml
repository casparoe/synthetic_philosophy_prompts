prompt: |-
  I run a second-year undergraduate seminar called Genes, Behaviour and Society — sixteen students, mostly from philosophy and sociology, exactly two of whom have taken any statistics, and one 90-minute session to fill. What keeps tripping me up is a conversation I had last term with a colleague in psychology, who remarked over coffee that a trait we were discussing was 'mostly heritable' and so 'more or less fixed', and I found I could not give him a crisp answer on the spot; the students, meanwhile, arrive with one of two opposite reflexes, either that a high heritability figure settles the matter genetically and nothing can be done, or that heritability is a discredited notion that only villains invoke. I want an activity that makes them feel, in their hands rather than in their ears, three things: that a heritability figure is a property of a population in a particular range of environments and not a property of a trait or a person; that a trait can be at its most heritable and at its most environmentally modifiable at precisely the same moment; and that a large and undeniable difference between two groups can be entirely environmental even when the heritability measured within each group is near the ceiling. Nothing in the rules, the worksheets or the scoring should use the vocabulary of the lesson — the idea has to arrive through what they do, and I would rather they invent their own name for the number they are computing than be handed mine. The word 'heritability' should not be spoken by anyone in the room, myself included, until the debrief.

  Please build it as a card-and-arithmetic simulation in which they act as gardeners or breeders, with a running competitive score for prediction accuracy and a rule that every team must commit its prediction in writing before any data are revealed. The causal rules must be completely transparent to me and completely hidden from them, and they must not be told that the gardens they visit are the same causal system under different conditions. A workable illustration, though you may substitute your own if it satisfies the constraints: a plant's height is a fixed base plus a genetic card plus an environment card, both drawn from decks I control. In the first garden the environment deck is wide and the genetic deck narrow; in the second every plant receives an identical environment card, so the resemblance score between parents and offspring jumps to its ceiling — and then I apply a single uniform change to everyone's environment, so that the very moment the trait became perfectly heritable is also the moment a purely environmental intervention moved every plant at once. In the third garden, two valleys share an identical genetic deck but have very different environment decks, so that within each valley the resemblance score looks as high as before while the gap between the valleys is enormous: teams that trust their earlier numbers should make a confident, specific and wrong genetic prediction, and I want the scoring to make that hurt. If time permits, add an optional fourth garden in which plants holding the strongest genetic cards get first pick of the plots, so the estimate is inflated by a correlation between genes and environments that no one in the room can see. The arithmetic must be doable by hand and must not let the two students who have done statistics run away with the exercise.

  Give me the rules and materials, including the actual card values and how to construct the decks, the worksheets and whatever goes on the wall; a minute-by-minute timeline for the ninety minutes; the scoring scheme; and then a debrief that takes each garden in turn and names the specific claim it counts against, so that the mapping from what happened to what it shows is explicit. Tell me what will predictably go wrong the first time I run it — including the real risk that the glasshouse round is read as confirming my colleague's remark rather than undermining it, and the risk that the debrief slides into 'heritability is meaningless', which is not what I want at all: I want them to leave thinking it is a genuine and useful quantity whose meaning is far narrower than they assumed. Finally, be straight with me about what an activity of this kind cannot reproduce and I will have to supply myself: everything that belongs to estimating heritability from real data rather than from a model I secretly control — measurement error, confounding, the assumptions that twin and family designs are forced to make, non-additive effects — and the ethical and political stakes that make the concept contested in the first place.
reasoning: |-
  Here's a thinking process that leads to the suggested seminar activity:

  1.  **Analyze the Request:**

      *   **Context:** 2nd-year undergraduate seminar (Genes, Behaviour and Society). 16 students (mostly philosophy/sociology, only 2 stats). 90-minute session.
      *   **Problem:** Students (and colleagues) misunderstand heritability. Common misconceptions: 1) High heritability = fixed/unchangeable. 2) Heritability = discredited/villainous. 3) Heritability is a property of an individual/trait, not a population/environment context. 4) High within-group heritability explains between-group differences.
      *   **Goal:** An activity where students *feel* the concepts rather than hear a lecture. They must invent the name for the metric. The word "heritability" is banned until debrief.
      *   **Format:** Card-and-arithmetic simulation. Students act as gardeners/breeders. Competitive score for prediction accuracy. Written commitments before data reveal.
      *   **Mechanism:** Transparent causal rules for instructor, hidden for students. $Trait = Base + Gene + Environment$.
      *   **Scenarios (Gardens):**
          1.  High Env Variance, Low Gene Variance (Low "Heritability").
          2.  Uniform Env (High "Heritability"), then Uniform Env Shift (High Heritability + High Modifiability).
          3.  Two Groups (Valleys), Same Genes, Different Envs (High Within-Group "Heritability", Large Between-Group Env Difference).
          4.  (Optional) Gene-Environment Correlation (rGE).
      *   **Constraints:** Arithmetic must be simple (hand-calcable). No stats jargon in rules. Scoring must punish wrong assumptions.
      *   **Deliverables:** Rules, materials (card values/decks), worksheets, wall displays, timeline (90 mins), scoring scheme, debrief script (mapping garden to concept), troubleshooting (what goes wrong), limitations (what the activity *doesn't* cover).

  2.  **Deconstruct the Science & Pedagogy:**

      *   *Concept 1: Population Specificity.* Heritability ($h^2$) is $V_G / V_P$. If $V_E$ changes, $h^2$ changes.
      *   *Concept 2: Modifiability.* High $h^2$ does not mean unchangeable. If you change the environment for *everyone* (shift the mean), the trait changes even if variance is mostly genetic.
      *   *Concept 3: Between-Group Differences.* Lewontin's Wheat analogy. High $h^2$ within groups does not explain differences *between* groups if the groups have different environments.
      *   *Concept 4: rGE.* (Optional but good). If genes influence environment, $V_P$ is inflated, biasing estimates.
      *   *Pedagogy:* Inquiry-based learning. Let them fail safely. The "Aha!" moment must come from the data contradicting their model.

  3.  **Design the Simulation (The "Gardens"):**

      *   *Trait:* Plant Height (in cm).
      *   *Formula:* $Height = 50 + Gene Card + Env Card$. (Base 50 keeps numbers positive and simple).
      *   *The "Statistic":* They need to calculate a "Predictive Power" score. Let's call it the "Family Resemblance Ratio" or simply "The Score". To keep arithmetic simple for non-stats students, avoid variance calculations. Instead, use a prediction game.
      *   *Revised Mechanism:* Instead of calculating variance (too hard for 14/16 students in 90 mins), have them bet on how well Parent Height predicts Offspring Height.
      *   *Wait, the prompt asks for a "number they are computing".* Calculating variance is hard. Calculating a correlation coefficient is impossible by hand for 16 people quickly.
      *   *Solution:* Simplify the metric. Use "Mean Absolute Error" or "Prediction Accuracy". Or, simpler: Have them estimate the *slope*. If Parent is 10cm above average, how much above average is Child?
      *   *Better Solution for Non-Stats:* Let's use a "Prediction Pot". They guess the offspring height based on parent height. The "Score" is how close they got. But they need to derive a number representing "Genetic Influence".
      *   *Prompt Requirement:* "Teams must commit its prediction in writing... scoring to make that hurt."
      *   *Idea:* They calculate a "Transmission Factor". (Offspring Deviation / Parent Deviation).
      *   *Actually, let's stick to the prompt's suggestion:* "Resemblance score". Let's make it the *ratio of variances* but simplified.
      *   *Simplification:* Give them the Variance of Parents and Variance of Offspring? No, that gives it away.
      *   *Best Approach:* They observe pairs. They calculate the average difference between Parent and Child. If Genes matter, Difference should be small. If Env matters, Difference should be large.
      *   *Wait, the prompt specifically asks for the "Within-Group Heritability vs Between-Group Difference" logic.*
      *   *Let's use the Prompt's specific illustration:* "Plant's height is a fixed base plus a genetic card plus an environment card."
      *   *Metric:* They need to estimate the "Genetic Contribution". Let's have them calculate the % of variation due to "Seed Type" vs "Soil".
      *   *Arithmetic Constraint:* 14 non-stats students. Calculating Sum of Squares is too much.
      *   *Workaround:* Provide pre-calculated Variances on the worksheet? No, that hides the work.
      *   *Workaround 2:* Use a very small N per team. Each team gets 5 plants. They calculate the Range (Max - Min).
      *   *Workaround 3 (Chosen):* Focus on *Prediction*. The "Number" is their confidence interval or a multiplier. "If Parent is X, Child is X * [Multiplier]".
      *   *Actually, the prompt says:* "teams... commit its prediction in writing... scoring scheme."
      *   *Let's go with the "Breeder's Score".* They try to select the tallest parents to get the tallest offspring. Their score is the average height of the *next generation*.
      *   *No, the prompt wants them to compute a number that represents heritability without calling it that.*
      *   *Okay, let's use the "Resemblance Ratio".* $R = \frac{\text{Average Offspring Height} - \text{Population Mean}}{\text{Average Parent Height} - \text{Population Mean}}$. This is essentially realized heritability. It requires simple subtraction and division.
      *   *Wait, Garden 2 (Uniform Env):* If Env is constant, $V_E = 0$, so $h^2 = 1$. Parent-Offspring correlation is 1.
      *   *Garden 3 (Two Valleys):* Within valley $h^2 = 1$. Between valley difference is Env.
      *   *Okay, I will design the worksheets to guide them to calculate the "Prediction Multiplier".*

