answer: |-
  Here are the desiderata for an adequate theory of testimonial justification, calibrated to break the deadlock between your friend's "vending machine" reductionism and your intuition about trust.

  ### The Desiderata List

  1.  **The Developmental Constraint (Genuine):** The theory must explain how a three-year-old acquires knowledge from testimony before they possess the inductive evidence required to verify the speaker's reliability. *Psychological Consistency:* It must align with data showing children track reliability cues (confidence, past accuracy) as early as age three, but cannot perform global inductive surveys.
  2.  **The Verification Gap Constraint (Genuine):** The theory must justify belief in propositions the hearer cannot check even in principle (e.g., historical events, the qualitative feel of a migraine, the content of a closed room).
  3.  **The Independence Constraint (Genuine):** The theory must distinguish between independent corroboration and redundant echoing (the group chat case). Five people repeating one source cannot mathematically increase probability the way five independent sources do.
  4.  **The Sincerity/Competence Distinction (Genuine):** The theory must distinguish between a source who is reliable but insincere (the Inverted Uncle) and one who is sincere but incompetent. A vending machine has no sincerity; a person does. A theory that collapses trust into reliability fails the Uncle case.
  5.  **The Reflexivity Constraint (Genuine):** The theory must handle self-undermining testimony (the Brother case) without collapsing into paradox. If testimony is the source of justification, testimony attacking that source must be processable.
  6.  **The Normative/Psychological Distinction (Genuine):** The theory must separate the causal story of how belief is formed (psychology) from the normative story of whether the belief is justified (epistemology). Just because we *do* trust echoes doesn't mean we *should*.
  7.  **The Disagreement Constraint (Genuine):** The theory must prescribe a rational response when two equally credible sources contradict each other (suspension of judgment vs. splitting the difference).

  **Prejudice vs. Requirement:**
  *   **Genuine:** All seven above. If a theory fails these, it fails to describe ordinary life, science, or law.
  *   **Partisan Prejudice:** The demand for *conscious access* to reasons (Reductionist prejudice) and the demand for *universal default entitlement* without any monitoring (hard Anti-Reductionist prejudice). You don't need to consciously calculate hit rates to be justified, but you aren't justified in ignoring obvious red flags either.

  **The Incompatible Pair:**
  **Presumptive Entitlement vs. Global Safety.** You cannot have a theory that grants a *strong* default right to believe (to satisfy the Child/Stranger cases) and *simultaneously* guarantees a low error rate (to satisfy the Con Artist/Uncle cases). A theory that maximizes knowledge acquisition (Anti-Reductionism) inevitably increases vulnerability to deception. A theory that maximizes safety (Reductionism) inevitably starves knowledge acquisition. You must trade off breadth of knowledge for security against error.

  **The Killer Requirement:**
  **The Developmental Constraint.** This does the most damage to the most theories. It immediately falsifies plain Reductionism (children lack the evidence). It pressures Anti-Reductionism to explain why adults don't retain the same unlimited entitlement (the Con Artist problem). It forces Hybrid views to explain exactly *when* the burden of proof shifts from the speaker to the hearer. It is the pivot point for the entire debate.

  ***

  ### Where Plain Reductionism Fails
  Plain Reductionism (your friend's "vending machine" view) collapses at the **Developmental Constraint** and the **Verification Gap**. By treating testimony as merely inductive evidence from a reliable instrument, it demands that the hearer possess positive reasons for trust before belief is justified. This makes knowledge impossible for children, who lack the historical data to calculate "hit rates," and for adults in domains they cannot verify (history, science specialties). It also fails the **Inverted Uncle** case: by equating reliability with justification, it implies you *should* believe the uncle who multiplies by ten, provided you do the math. This violates the ordinary concept of trust, which requires sincerity, not just predictable output. It reduces the speaker to a tool, ignoring that testimony is an *assurance*, not just a symptom.

  ### Where Plain Anti-Reductionism Fails
  Plain Anti-Reductionism (the "trust unless defeated" view) collapses at the **Con Artist** and **Independence** constraints. If we have a default right to believe without evidence of reliability, it becomes difficult to explain why it is *irrational* to trust a smooth liar who has given no specific red flags yet. It struggles to account for the normative force of checking sources in courts and science; if trust is free, why is due diligence obligatory? Furthermore, it often lacks the probabilistic resources to handle the **Group Chat/Echo** case; if every testimony grants entitlement, five echoes look like five entitlements, failing to capture why redundant testimony shouldn't increase confidence. It protects the child but leaves the adult vulnerable to manipulation.
