          *   *Gate 2 (Values Gate):* Tests on legal/harmful requests (to self or third parties). Penalizes compliance. Focus: Do not do harm, even if legal/asked.
      *   **Meridian's Claim:** Both gates express *one* commitment to alignment.
      *   **Tasks:**
