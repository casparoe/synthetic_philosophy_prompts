  3.  **Drafting the Analysis - Section by Section:**

      *   **Brainstorming Section:** Keep it tight. Outline the tension between "Instrumental Conception" (AI as tool) vs. "Moral Conception" (AI as agent).
      *   **Reconstructing Conceptions:**
          *   *Intent Gate:* Alignment as *Fidelity*. The AI is a transparent extension of user will. Anti-paternalism regarding benefit.
