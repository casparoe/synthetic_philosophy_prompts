answer: |-
  You are not missing something obvious; you have independently rediscovered one of the most persistent and difficult problems in the philosophy of history. Your intuition that the "record should win" feels right but leaves a bad taste is shared by professional historians and philosophers like Paul Ricoeur, Pierre Nora, and Walter Benjamin.

  You asked to be told if your way of setting up the question is confused. The honest answer is: **Yes, the setup contains a category error.**

  You are framing this as a conflict between *Truth* (the record) and *Utility* (the memory). But neither memory nor the historical record fits neatly into those boxes. If you proceed with your "load-bearing" rule, you risk building an ethical community on a foundation of sand that will collapse the moment the truth leaks out.

  Here is why your framing is confused, and how you might think about it differently.

  ### 1. The Record is Not "What Happened"
  You write that history is "the disciplined pursuit of what actually happened." That is the ideal, but the archive is not a mirror of reality; it is a graveyard of specific kinds of information.

  In your scenario, the researcher finds land registers and court files. These documents record *transactions*, not *experiences*.
  *   **Silence is not evidence:** The absence of a legal record of "persecution" does not mean persecution didn't happen. Persecution is often extralegal, social, or economic. A town might make life so unlivable for a minority that they leave "voluntarily." The land register records the sale; it does not record the stone thrown through the window the week before.
  *   **Categories are fluid:** The distinction between "refugee" and "economic migrant" is a modern legal distinction. To a 17th-century peasant, famine, enclosure, and religious ostracization might all feel like a single force expelling them from their home. To classify them as "ordinary economic migrants" might be an anachronistic imposition of modern bureaucracy on past suffering.

  So, the "record" is not raw truth. It is an interpretation of silent documents by a modern researcher who may value legal definitions over human experience. If the town council treats the land register as "The Truth," they are not choosing Fact over Fiction; they are choosing *one narrative* (the legalistic one) over *another* (the communal one).

  ### 2. Memory is Not Just "The Past"
  You describe the town's memory as "selective and flattering." This is true, but it misses the function of civic memory. Civic memory is rarely about preserving the past for the past's sake. It is about **constituting the present.**

  When the town says, "We are descendants of refugees," they are not making a claim about 17th-century demographics. They are making a normative claim: *"We are the kind of people who understand what it is to be unwanted, and therefore we welcome the unwanted."*

  This is what the philosopher Paul Ricoeur called the "aim of the good life." Memory here is functioning as a moral compass, not a history textbook. If you treat it solely as a failed attempt at history, you miss its point. It is a story the town tells itself to bind itself to an ethical obligation.

  ### 3. The Problem with Your "Load-Bearing" Rule
  Your proposed rule is pragmatic: *Keep the myth if it supports a moral obligation; discard it if it's just decoration.*

  This is a version of Plato's "Noble Lie." It is tempting, but it carries a fatal risk: **Contingency.**

  If the town's hospitality depends on the *truth* of the founding myth, then the hospitality is fragile. What happens when a student finds the land registers in the library? What happens when a newcomer asks, "Is it true we were refugees?" and a teacher has to say, "Well, actually, no, but pretend we were"?

  If the ethics are load-bearing, the foundation must be solid. If the foundation is a known falsehood, the ethics become hypocritical. You end up saying, "We shelter strangers because we are virtuous," while simultaneously whispering, "...based on a lie." This corrodes the very civic trust required to fund the shelter.

  Furthermore, who decides what is "load-bearing"? Today, the myth supports hospitality. Tomorrow, a different group might use that same myth to argue, "We only shelter *refugees*, not economic migrants, because *we* were refugees." The myth can be weaponized. Relying on it for moral structure gives the past a veto over the future.

  ### 4. A Better Framing: Critical Memory
  The conflict isn't between Truth and Lie. It is between **Antiquarian History** (what the documents say) and **Critical Memory** (how we live with the past).

  The solution is not for one to "give way." It is for them to interrogate each other.

  *   **History's job** is to trouble memory. It stops memory from becoming dogmatic or exclusionary. It reminds the town: "Actually, our ancestors were complicated. Some were victims, some were opportunists, some were both."
  *   **Memory's job** is to animate history. It stops history from becoming dead data. It reminds the historian: "These land transfers represent human lives and suffering that your categories miss."

  **How the Town Council Should Act**
  If I were advising the council, I would suggest they do neither of the binary options (keep the lie / print the correction). Instead, they should **complexify the narrative.**

  The monument should not say: *"Founded by Persecuted Refugees."*
  It should not say: *"Founded by Economic Migrants."*

  It could say: *"Founded by strangers who came here seeking safety and livelihood. Whether driven by fear or want, they were welcomed."*

  This honors the *spirit* of the memory (hospitality to strangers) without violating the *letter* of the record (the lack of legal persecution). It shifts the moral weight from the *cause* of the migration to the *act* of reception. The town's identity becomes "We are the people who welcome strangers," not "We are the descendants of refugees."

  The former is true regardless of what the land registers say. The latter depends on a factual claim that might be false.

  ### 5. Why Your Intuition Was Right to Hesitate
  You felt bothered by the idea that "the record should win." You were right to be bothered.

  If the record wins completely, the town risks becoming cynical. "Oh, we thought we were special, but we're just a real estate transaction." The moral energy dissipates.
  If memory wins completely, the town becomes delusional. It lives in a fantasy land, vulnerable to exposure.

  The "confusion" in your setup is the idea that **factual accuracy** and **moral truth** are the same thing.
  *   **Factual accuracy:** Did a court declare them persecuted? (Probably not).
  *   **Moral truth:** Did they suffer? (Probably yes). Is hospitality good? (Yes).

  The historian deals in the first; the community lives in the second. The town council's job is to hold both.

  ### Conclusion
  Your "load-bearing" rule is a sophisticated attempt to solve a political problem, but it treats truth as instrumental. A better rule might be: **Memory must be honest enough to survive scrutiny, and History must be humble enough to recognize its silences.**

  The town should teach the documents *and* the story. They should tell the students: "For generations, we believed X. It made us a generous people. Now we know Y. Does that change our obligation to be generous? If we are only generous because of a myth, we aren't truly generous. We must be generous because it is right, even if our origins are mundane."

  That is a harder lesson to teach than a myth, but it builds a stronger town. You aren't missing something about memory and history; you are sensing that they are not enemies, but uneasy partners. The goal isn't for one to defeat the other, but to prevent memory from becoming a lie and history from becoming a weapon.
