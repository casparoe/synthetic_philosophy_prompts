      *   *Tone Check:* Be empathetic to the student. Popular books *do* this. It's a known pedagogical problem.

      *(Final thought on the Murderer case)*: Does the Universal Law test yield the result in the Murderer case? Actually, many Kantians argue the Universal Law test *doesn't* clearly forbid lying to the murderer (you can conceive a world where everyone lies to murderers). The prohibition comes from the duty to right/truthfulness as a juridical duty. The book's simplified test would likely *fail* to generate Kant's result here, which is an irony worth noting.

      *(Final thought on Rule Utilitarianism)*: The book says "bad for everyone." Kant never appeals to "badness." He appeals to "contradiction." This is the smoking gun for the Utilitarian misreading.

