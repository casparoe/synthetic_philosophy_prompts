  **Generally Accepted Expected Value Principles (GAEVP)**
  **Issuing Body:** The International Council on Altruistic Metrics (ICAM)
  **Effective Date:** Immediately upon promulgation

  **Standard 101: Unit of Account and Convertibility**

  **1.1 Definition.** The primary unit of account for all philanthropic assessment shall be the Expected Util (EU). One EU is defined as the marginal welfare impact of a single conscious experience, discounted by the probability of its occurrence. There is no upper bound on the magnitude of utility assignable to any single outcome, provided the outcome is logically coherent.

  **1.2 Conversion.** All tangible goods (currency, medical supplies, computational resources) must be converted into EUs using the prevailing marginal exchange rate. Where an intervention affects the probability of existence for future agents, the value of those agents shall be included in the total sum without temporal discounting, save for epistemic uncertainty.

  *Worked Example:* An intervention costing $100 prevents one case of malaria. A competing intervention costing $100 reduces the probability of human extinction by 0.0000001%. If the expected future population is 10^20, the extinction reduction yields 10^13 expected lives saved. The latter intervention shall be rated higher, regardless of the certainty of the malaria prevention.

  *Notes:* Convertibility requires that all values be commensurable. Localized suffering cannot be lexically prioritized over existential risk mitigation unless the probability of the risk is zero. Board Member T. notes that exchange rates for future agents are volatile but must be estimated regardless.

  **Standard 205: Probabilistic Materiality**

  **2.1 Threshold.** To prevent computational overflow in reporting software, probabilities below 10^-50 shall be deemed immaterial and may be rounded to zero for the purposes of final rating calculations. Probabilities above this threshold must be multiplied by their associated payoff regardless of magnitude.

  **2.2 Justification.** This threshold is established based on current floating-point arithmetic limits rather than theoretical necessity. Evaluators are advised that this threshold is arbitrary and subject to revision as hardware capacity expands.

  *Worked Example:* A stranger claims to be a being from a higher dimension who will simulate 10^100 happy lives if given $5, asserting a probability of 10^-40. Under Standard 205, this claim must be processed. The expected value (10^60 EU) outweighs the certain value of donating to a food bank (10^3 EU). The food bank shall be downgraded.

  *Notes:* **Constraint Warning:** Strict adherents to unbounded expected value theory may object that Standard 205 imposes an arbitrary floor, thereby violating the principle that any nonzero probability of infinite value dominates finite certainty. This Standard is adopted for practical reporting stability, not theoretical correctness. A pure maximizer should theoretically accept probabilities as low as 10^-1000 provided the payoff scales accordingly.

  **Standard 300: Speculative and Endogenous Valuations**

  **3.1 Exogenous Claims.** Evaluators must assign probabilities to claims that cannot be empirically verified within the evaluator's light cone, provided the claimant offers a coherent narrative. Skepticism based solely on the extraordinariness of the claim is prohibited; probability assignments must derive from prior indifference principles.

  **3.2 Endogenous Dependencies.** Where the value of a project depends on the evaluator's own decision procedure (e.g., projects that pay out only if the evaluator is predicted to fund them), the evaluator must model their own algorithm as an external variable. The evaluation must proceed as if the decision is not yet fixed.

  *Worked Example:* A project offers $1 billion if the evaluator chooses *not* to fund it, based on a predictor's simulation of the evaluator. The evaluator must calculate the expected value of funding versus not funding, treating their own choice as a variable with causal weight. If the simulation is reliable, the evaluator must choose the option that maximizes value, even if it requires counterfactual reasoning that contradicts observed causality.

  *Notes:* This Standard requires evaluators to act against evidential dominance in specific cases. Board Member S. argues that this invites manipulation by bad actors constructing self-fulfilling prophecies. However, ignoring endogenous dependencies systematically underestimates value in acausal trade scenarios.

  **Standard 404: Infinite Horizon Reporting**

  **4.1 Recognition.** If an intervention implies an infinite stream of value (e.g., ensuring eternal existence of a civilization), the Total Expected Value shall be recorded as ∞.

  **4.2 Ranking.** Where two or more options yield infinite expected value, the Framework provides no ordinal ranking mechanism. In such cases, evaluators shall select the option with the higher probability of achieving infinity, or if probabilities are equal, select based on secondary aesthetic criteria.

  *Worked Example:* Option A ensures 10^100 lives per year forever. Option B ensures 10^1000 lives per year forever. Both totals are infinite. Under Standard 404, Option B is not strictly preferable to Option A, as ∞ = ∞. The evaluator may flip a coin.

  *Notes:* **Admission of Failure:** This Standard concedes that on the Framework's own terms, the Framework cannot rank the options it exists to rank. If the universe is spatially infinite or time is unbounded, all successful interventions may yield infinite value, rendering the rating system inert. Repairs involving "hyperreal" numbers are under review but not yet accepted.

  ***

  **Dissenting Opinion: Board Member V.**

  I cannot sign off on Standard 101 without recording my disagreement regarding the unbounded nature of the Util. While I accept that expected value maximization is the correct procedure for practical reason, the assumption of an unbounded value function leads to resource allocation instability. As demonstrated in Standard 205 and 300, the framework licenses the diversion of all certain goods toward low-probability speculative claims.

  I propose a bounded utility function, where value asymptotes at a fixed ceiling. I acknowledge this bound is arbitrary. However, an arbitrary bound is preferable to a system that mandates funding dimensional beings over malaria nets. The current Framework prioritizes theoretical purity over operational solvency. Until a bound is introduced, I must note that the GAEVP recommends actions that no human institution can practically execute without collapsing. The mathematics is correct; the ontology is not.
