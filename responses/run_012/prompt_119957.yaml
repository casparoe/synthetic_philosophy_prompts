  2.  **Deconstruct the Defeaters (Brainstorming & Ranking):**

      *   *Defeater 1: The Truthmaker/grounding of Counterfactuals.*
          *   Problem: If "There is a tree" = "If you looked, you'd see a tree," what makes that conditional *true* right now when no one is looking?
          *   Realist answer: The physical tree.
