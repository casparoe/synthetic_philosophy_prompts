          *   If Witness A says "The car *was* a tree" (False - like the elephant parable).
          *   This highlights the difference between *partial truth* and *error*.
      *   *Actually, the "Rotating Object" is clearer for *syāt* (time/aspect).*
      *   Let's stick to a **Multi-Tool (Swiss Army Knife)**.
