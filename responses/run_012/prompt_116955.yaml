answer: |-
  **MEMORANDUM**

  **TO:** Board of Directors and Petitioners
  **FROM:** Governance Committee
  **DATE:** October 26, 2023
  **SUBJECT:** Committee Position on Member Petition Regarding Board Composition and Tenure

  ### 1. Executive Summary and Recommendation

  The Governance Committee has reviewed the member petition concerning the composition and tenure of the Board of Directors. We recognize the legitimacy of the concerns raised regarding board stagnation and member access. However, we find that the two mechanisms proposed in the petition address different problems and carry distinct risk profiles.

  **The Committee recommends the following course of action for the Annual General Meeting (AGM):**

  1.  **Procedural Motion:** The Board should move to split the petition into two distinct bylaw amendments for the purpose of voting. Measure A shall concern Term Limits; Measure B shall concern Selection by Lot (Sortition).
  2.  **Substantive Position:**
      *   **Measure A (Term Limits):** The Committee recommends a **FOR** vote. We propose a cap of two consecutive terms followed by a two-year cooling-off period, as petitioned.
      *   **Measure B (Sortition):** The Committee recommends an **AGAINST** vote regarding board seats. We find that selection by lot is incompatible with the fiduciary and legal duties of a standing board in a nonprofit of this size.
  3.  **Alternative Proposal:** Should Measure B fail, the Committee recommends the Board commit to establishing a *Member Advisory Assembly* within 12 months. This body would use the petitioned stratification method to select members for a non-fiduciary, consultative role, ensuring the voice of the random member is heard without compromising governance liability.

  **Contingencies:**
  *   **If the membership rejects both measures:** The Board shall convene a special Governance Task Force within 90 days to propose alternative reforms addressing board renewal and accessibility.
  *   **If the membership approves Measure B (Sortition) against Committee advice:** The Board accepts the mandate but must immediately amend the onboarding process to include an explicit "right to decline" without penalty for selected members, and must secure a legal opinion confirming director liability insurance covers randomly selected volunteers.

  ---

  ### 2. Analysis of the Proposal

  The Committee's recommendation rests on four specific governance challenges raised by the petition. These are the areas where we found the most significant ambiguity during our deliberation.

  #### A. Bundling vs. Splitting the Remedy
  The petition bundles term limits and selection by lot as a single package. The Committee concludes these are **not** a single remedy, but rather two distinct interventions targeting different failure modes.
  *   **Term Limits** address *entrenchment*. They prevent the accumulation of power over time and ensure turnover.
  *   **Sortition** addresses *homogeneity and access*. It bypasses the nomination pipeline entirely to change *who* enters the room.

  It is coherent to recommend one and reject the other. A board can have term limits without random selection (the standard nonprofit model), and theoretically, a board could have random selection without term limits (though rare). Because they function independently, bundling them forces members to accept a high-risk mechanism (sortition) to achieve a low-risk improvement (term limits). Splitting the vote respects the nuance of the membership's intent.

  #### B. Stratification and the Logic of the Lot
  The petition proposes stratifying the random draw to mirror the membership by region, career stage, and practice. We debated whether this undermines the philosophical justification of sortition.
  *   **The Tension:** Pure sortition relies on the idea that *any* member is as good as *any other* for the purpose of governance. Stratification implies that demographic or professional categories matter and that the board is incomplete without specific representation.
  *   **The Resolution:** For a professional association, stratification **repairs** rather than undermines the justification. Pure randomness in a 40,000-member body could, by chance, result in three directors from the same region or specialty. Since the Board makes decisions affecting all sub-groups, ensuring the random sample is representative is a risk-mitigation strategy. It shifts the justification from "mathematical equality" to "descriptive representation," which is more appropriate for a technical professional body.

  #### C. Fiduciary Duty and Voluntary Service
  This is the primary reason for our recommendation against Measure B. There is a fundamental distinction between a *Citizens' Assembly* and a *Board of Directors*.
  *   **Deliberative vs. Operational:** Citizens' assemblies are typically temporary, tasked with making recommendations on a specific question, and supported by paid staff who handle implementation. They do not carry legal liability.
  *   **Liability:** Our Board is a standing body responsible for audits, litigation oversight, employment decisions, and fiduciary solvency. Directors carry personal legal liability for negligence.
  *   **Coercion:** A voluntary association cannot ethically oblige a member to accept legal liability. If service is mandatory, it is coercive. If service is optional, a random selection process becomes a "lottery of refusal," where the burden of governance falls only on those random members willing to say "yes," reintroducing self-selection bias.
  *   **Conclusion:** You cannot randomly assign fiduciary risk. Therefore, sortition is viable for an advisory body, but unsafe for a governing board.

  #### D. Term Limits and the Shift of Power
  We acknowledge the petitioners' argument that term limits may not reduce careerism but merely relocate it.
  *   **The Risk:** If Board members rotate frequently, institutional memory migrates to the permanent staff and to informal networks of past directors who remain influential without accountability. This can strengthen the "deep state" of the association rather than weakening it.
  *   **The Mitigation:** Term limits are still necessary to prevent the appearance of a closed shop. However, to counter the shift of power to staff, the Committee recommends that if Measure A passes, the Board must simultaneously strengthen the authority of *Committee Chairs* (who are often non-board members) and ensure that the agenda-setting process remains under elected control. Term limits must be paired with robust committee governance to remain effective.

  ---

  ### 3. The Case for the Opposition

  A board member or member of the membership may reasonably disagree with the Committee's recommendation to reject Sortition (Measure B). The strongest case for the petitioners, which we must honor even in rejection, is as follows:

  **The Argument for Sortition:**
  The current election system has a structural flaw: it favors those with time, connections, and a tolerance for campaigning. This inevitably selects for a specific personality type—often those already close to the existing power center. Over twenty years, this creates a board that is demographically and cognitively homogeneous, even if elections are technically free and fair.

  Selection by lot is the only mechanism that guarantees *equality of opportunity* rather than *equality of procedure*. By stratifying the draw, we ensure that the lived experience of the early-career member, the member in a smaller region, or the member in a niche practice area is physically present in the boardroom.

  Regarding liability: This is a professional association, not a state. The risk is manageable. We can provide indemnification, insurance, and training. To say members are "incapable" of understanding fiduciary duty is patronizing; they are professionals capable of complex technical work. The discomfort the current board feels regarding random selection is likely a defense of its own privilege, disguised as concern for risk management. If we truly believe in member ownership, we must trust members with the reins, even if their path to power was luck rather than lobbying.

  ---

  ### 4. Implementation Timeline

  To ensure clarity and order at the AGM, the Committee proposes the following schedule:

  1.  **Pre-AGM (Now):** Board accepts the petition but formally moves to separate the bylaw changes into two distinct ballot questions (Measure A and Measure B).
  2.  **AGM Voting:** Membership votes on Measure A and Measure B independently.
  3.  **Post-AGM (0-3 Months):**
      *   *If Measure A passes:* Bylaws updated immediately. Next election cycle adjusted for term limits.
      *   *If Measure B fails:* Board charters the *Member Advisory Assembly* design team.
      *   *If Measure B passes:* Legal counsel reviews liability exposure; "Right to Decline" clause drafted for selected members.
  4.  **Post-AGM (6 Months):** Governance Committee reports on the implementation status to the membership.

  ### 5. Conclusion

  The petitioners are correct that the Board has become too static and that the path to governance is too narrow. Term limits are a proven, low-risk method to address this. However, replacing elections with lotteries for a fiduciary board introduces legal and operational risks that threaten the association's stability.

  By splitting the measures, we grant the membership the renewal they demand while protecting the association from governance failure. We invite the Board to adopt this position and present it to the membership as a good-faith effort to reform without recklessness.
