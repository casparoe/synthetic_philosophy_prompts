      *   **Requirements:**
          *   Clear recommendation with timeframe/order/contingency.
          *   Reasoning supporting the recommendation.
          *   Serious statement of the strongest case for the losing side (steel-manning).
          *   Address specific conceptual difficulties:
              *   Are the two proposals (sortition + term limits) one remedy or two? Can they be split?
              *   Does stratification undermine or repair the "equal chance" justification of sortition?
              *   Can a voluntary association *oblige* service (fiduciary/legal duties) vs. a one-off assembly?
