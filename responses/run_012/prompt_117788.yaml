answer: |-
  **Session Plan: The Normativity of Convention**

  **Duration:** 75 Minutes
  **Topic:** Obligations, Grounds of Criticism, and Standing in Everyday Conventions
  **Core Example:** Queueing for a Public Bus

  ### I. Sequence of Components and Dependencies

  The session is structured by four logical dependencies. You cannot move to the next component until the previous one is secured, or the conceptual apparatus will collapse into intuition.

  1.  **The Case (0–10 mins):** You must establish a concrete scenario before analyzing it.
      *   *Dependency:* The Three Grounds cannot be distinguished in the abstract; they require a stable factual background to show their independence.
  2.  **The Three Grounds (10–35 mins):** You must install the distinctions (Costs, Reliance, Slight) before discussing who can object.
      *   *Dependency:* If Standing is introduced before Grounds, students will conflate "who can complain" with "what went wrong."
  3.  **Standing (35–50 mins):** You must separate the *wrongness* of the act from the *authority* to object.
      *   *Dependency:* The Visitor question relies on the gap between Obligation (Grounds) and Authority (Standing). If these are fused, the Visitor question collapses into "different rules."
  4.  **The Visitor (50–65 mins):** You must introduce the visitor only after Standing is clear.
      *   *Dependency:* The visitor scenario is the stress test for the distinction between Obligation and Standing.
  5.  **Assessment & Refusal (65–75 mins):** Closure.

  ---

  ### II. The Core Example: Queueing for a Public Bus

  **Verdict:** Queueing is the correct choice. Jaywalking is disqualified by statute; Tipping is disqualified by distributive justice concerns.

  **Required Features of the Example:**
  *   **Visible Breach:** The act of cutting must be observable by the group.
  *   **Cheap to Avoid:** The agent could have joined the back of the line with negligible effort.
  *   **No Statute:** There must be no law enforcing the queue (distinguishes from jaywalking).
  *   **No Exchange:** No money changes hands (distinguishes from tipping/wages).

  **What It Must Lack:**
  *   **Scarcity of Space:** Do not use a scenario where the bus is full. If the bus is full, cutting causes a *cost* (someone is left behind). You need a scenario where the bus has space, to isolate *Reliance* and *Slight* from *Cost*.
  *   **Emergency:** No medical emergencies or urgency that would override the convention.

  **Deployment:**
  Describe a bus stop in a city where queueing is the norm. The bus arrives with ample space. A person walks past ten people and boards first.
  *   *Use this to isolate the grounds:*
      1.  **Costs:** Did the ten people arrive later? No (ample space). Cost = 0.
      2.  **Reliance:** Did the ten people arrange their conduct expecting a turn? Yes (they stood in line). Reliance = Defeated.
      3.  **Slight:** Did the cutter treat the ten people as invisible? Yes. Slight = Present.

  ---

  ### III. Misconceptions and Interception Points

  You must head off these six misconceptions at the precise moments listed. Do not wait for students to raise them; embed the pre-emption in your exposition.

  1.  **"This is just etiquette/politeness."**
      *   *Interception Point:* **Minute 5 (Intro).**
      *   *Action:* State explicitly: "We are not discussing manners. We are discussing normative claims. If a breach is merely rude, an apology suffices. If it is an obligation breach, restitution or accountability is required. We are testing which this is."
  2.  **"The rule is arbitrary, so compliance is optional."**
      *   *Interception Point:* **Minute 15 (Defining Convention).**
      *   *Action:* When defining the convention, assert: "Arbitrariness of origin does not entail optionality of compliance. Traffic lights are arbitrary (red could mean go), but the obligation to stop is not optional. The source of the obligation is the coordination, not the color."
  3.  **"Conventional and Moral are exclusive categories."**
      *   *Interception Point:* **Minute 30 (The 'Slight' Ground).**
      *   *Action:* When explaining *Slight*, say: "If a breach conveys disrespect or refusal of membership, it enters the moral register. A convention becomes moral when it sustains a condition of mutual recognition."
  4.  **"The law settles the matter."**
      *   *Interception Point:* **Minute 10 (Case Setup).**
      *   *Action:* When describing the bus stop, explicitly state: "There is no law here. No police will come. If there is an obligation, it is not legal."
  5.  **"The visitor is simply exempt."**
      *   *Interception Point:* **Minute 55 (The Visitor Section).**
      *   *Action:* Do not accept "they didn't know" as an exoneration. Ask: "Does ignorance remove the obligation, or does it only excuse the blame? We are asking about the obligation, not the blame."
  6.  **"It's wrong because of what would happen if everyone did it."**
      *   *Interception Point:* **Minute 25 (The 'Costs' and 'Reliance' Grounds).**
      *   *Action:* When discussing Costs/Reliance, forbid the generalization. Say: "Do not tell me what happens if *everyone* cuts. Tell me what happens when *this one* person cuts. We are looking for specific defeat of expectation, not systemic collapse."

  ---

  ### IV. The Visitor Question (Minute 50–65)

  **Goal:** Reveal that Visitor Obligation and Local Standing can come apart in both directions. Avoid "customs differ."

  **The Setup:**
  Present two variations of the Bus Stop case involving a Visitor (V) and a Local (L).

  **Variation A (Obligation without Standing):**
  *   *Scenario:* V knows the local queueing convention and chooses to ignore it. L objects.
  *   *Philosophical Pivot:* V is obligated (by Fair Play/Participation), but does L have standing to object on grounds of *Slight*? V is not refusing membership in L's community; V is merely a transient user.
  *   *Desired Discovery:* L can object based on *Costs/Reliance*, but perhaps lacks standing to object based on *Slight* (disrespect to the community).

  **Variation B (Standing without Obligation):**
  *   *Scenario:* V is ignorant of the convention (first day in country). L objects.
  *   *Philosophical Pivot:* V may be excused from obligation (no Fair Play), but does L have standing to object to protect the practice for others?
  *   *Desired Discovery:* L has standing to protect the *practice* (Reliance of others), even if V is not personally blameworthy.

  **Instruction to Professor:**
  Do not resolve this. Your task is to make the students feel the discomfort that *Obligation* (is the act wrong?) and *Standing* (can you say so?) are coming unglued. If a student says, "It depends on their culture," stop them. Reply: "We are not asking about anthropology. We are asking about the normative structure of the interaction."

  ---

  ### V. The Final Question (Minute 65–70)

  **Purpose:** Separate students who possess the apparatus (3 Grounds + Standing) from those who merely hold the opinion "conventions matter."

  **The Question:**
  "A visitor cuts the queue. The bus is empty (no Cost). The locals behind her did not expect the bus to be full (no Reliance). She claims she did not intend disrespect (no Slight). A local objects. On which specific ground is the local's objection valid, if any?"

  **Correct Answer Structure:**
  *   If the student says "It's wrong because rules are rules," they have failed.
  *   If the student says "The local has no standing because no ground was breached," they have succeeded.
  *   If the student says "The local has standing to enforce the practice even if no ground was breached," they must identify *which* ground (likely Reliance of the *practice* itself, not specific individuals).

  ---

  ### VI. The Refusal (Minute 70–75)

  **What You Will Not Explain:**
  You will refuse to explain the **foundational source of the obligation**.

  **Statement to Class:**
  "I have shown you *that* conventions can generate obligations and *how* we criticize breaches. I will not explain *why* you are bound by them in the first place. Is it a tacit contract? A duty of fair play? A natural duty of justice? That is a meta-ethical question. Today, we have mapped the normative terrain. We leave the geology for another course."

  **Reason:**
  Explaining the foundation (Contract vs. Practice vs. Duty) requires theoretical commitments non-majors do not have. It will swallow the distinction between Grounds and Standing. Keep the focus on the *structure* of the criticism, not the *metaphysics* of the bond.
