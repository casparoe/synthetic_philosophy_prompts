answer: |-
  Thank you. It is good to be back. Looking out at this crowd, I see the two worlds I have spent fifteen years trying to bridge. On my left, neighbors who kept this town running while I was away—farmers, nurses, machinists, people who stayed. On my right, colleagues and friends from the university who drove out to see me speak. And in the middle, the graduates. Some of you are heading to campuses like mine. Some are heading to trade schools, the military, or jobs right here on the river.

  I accepted this invitation thinking I would offer you encouragement. Instead, I find myself working through a problem I cannot solve. Since returning to care for my father, I have been unable to stop asking a question that feels dangerous to voice: Is the outlook I was raised in here, or the outlook I now live in at the university, more defensible?

  My thesis is this: The question itself is rigged, because demanding a defense is already a habit of the professional class. But since you will live in both worlds, the only defensible life is one that knows when to stop justifying and start building, and when to stop building and start asking why.

  Let me explain what I mean by the two outlooks. Here in town, I was raised on what I call the ethic of the done thing. A good life is a matter of doing what needs doing, well and without fuss.

  I saw this clearly last month when the river rose. The levee threatened to break. I watched men and women I grew up with leave their jobs, grab sandbags, and stand in the cold water for twelve hours. No one asked why they were chosen to stand there. No one calculated the opportunity cost of lost wages. They showed up because the water was rising and their neighbors were behind them. The strength of this outlook is reliability. It creates a world where you know people will hold their end of the rope. But its blindness is that it can mistake inherited obligation for wisdom. It treats questioning as betrayal. If you ask why the levee is always our burden and not the county's, you might be told to stop talking and start stacking.

  At the university, I live by the ethic of the justified thing. There, a good life is a matter of choosing well. Every commitment requires a reason.

  I saw this recently when a brilliant colleague turned down a secure position. She explained that the job did not fit her "narrative arc" or allow for sufficient "self-actualization." The strength of this outlook is freedom. It refuses to accept suffering or stagnation as fate. It demands that your life belong to you. But its blindness is that it mistakes mobility for freedom. It can treat every rooted attachment as a failure of ambition. If you stay in one place too long, you are stagnant. If you cannot give a reason for your love or your work, you are unexamined.

  So, which is more defensible? If you ask a professor, she will say the justified life, because she is paid to justify things. If you ask a machinist, he will say the done life, because machines work or they don't.

  This is where the question is rigged. Asking for a defense is itself a move in the professional game. It is like asking whether a hammer is more defensible than a song. You do not ask a song to drive a nail. You do not ask a hammer to carry a melody. The ethic of the done thing is defensible for building communities that survive hard times. The ethic of the justified thing is defensible for building selves that can change them.

  Graduates, you will not have the luxury of choosing one forever. If you leave for the city, you will need the ethic of the done thing. There will be days when your work feels meaningless, when you cannot justify why you are doing it. On those days, do not wait for inspiration. Do what needs doing. Show up. Keep your word. That is how you build a career that lasts.

  If you stay here, you will need the ethic of the justified thing. There will be times when tradition demands something of you that hurts you or holds you back. On those days, do not accept silence as virtue. Ask why. Demand reasons. That is how you ensure the town remains a home and not just a habit.

  Do not let either side of this room convince you that their way is the only way to be human. The people on my left know how to hold things together. The people on my right know how to imagine things differently. We need both.

  So, here is my charge to you. Do not simply choose a path. Choose how you walk it. When you are building, build like the river town: solid, quiet, reliable. When you are choosing, choose like the university: critically, freely, bravely.

  The question of which life is better is the wrong question. The right question is whether you have the wisdom to know which tool to pick up. If you can hold the hammer when the storm comes, and sing the song when the work is done, you will not need to defend your life to anyone. It will stand on its own.

  Congratulations.
