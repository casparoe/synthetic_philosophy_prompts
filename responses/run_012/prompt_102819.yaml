      *   *Ending?* Unified applause.

  7.  **Polishing:**
      *   Make sure the transition between the "hammer vs. song" idea and the actual advice is smooth.
      *   Ensure the tone isn't too melancholy. It's a commencement.
      *   Check word count. (Aim for ~850 words).

