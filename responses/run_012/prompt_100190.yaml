answer: |-
  **Joint Statement on Methodological Individualism and Holism in Social Science**

  **Preamble**
  We, the undersigned representatives of methodological individualism and social holism, acknowledge that our decades-long debate has frequently suffered from conflation and imprecision. While we maintain distinct commitments regarding the nature of social inquiry, we agree that progress requires disentangling our disagreements. This statement records our points of convergence, isolates our genuine divergences, and outlines an empirical agenda to adjudicate the remaining disputes.

  **1. Distinct Strands of Disagreement**
  We agree that our historical conflict has conflated three distinct philosophical strands. Going forward, we commit to addressing them separately:
  *   **The Ontological Strand:** Concerns what entities exist. Does a "bank" or a "norm" exist over and above the individuals and physical artifacts that constitute it?
  *   **The Explanatory Strand:** Concerns what constitutes a satisfactory explanation. Must a social explanation always bottom out in individual psychology and action, or can social facts explain other social facts?
  *   **The Semantic Strand:** Concerns the meaning of social language. Can terms like "inflation" or "marriage" be defined without residue using only predicates describing individual mental states and behaviors?

  We acknowledge that Individualists have often argued against ontological holism (group minds) that Holists do not hold, while Holists have often argued against semantic reductionism that Individualists do not require. We agree to flag instances where a disagreement in one strand is mistakenly deployed to settle a dispute in another.

  **2. Thin vs. Thick Individualism**
  We distinguish between two versions of individualism. **Thin Individualism** holds that only individual human beings possess agency; collectives do not have legs to walk or brains to think. **Thick Individualism** holds that every social kind (e.g., "bureaucracy," "recession") is definable, without residue, in terms of individual dispositions and actions.

  We agree that Thin Individualism is trivially true and not the locus of our dispute. No Holist claims that a corporation acts without individuals acting. The substantive debate concerns Thick Individualism versus Explanatory Holism. The Individualist insists that Thick Individualism is the ideal limit of social science; the Holist insists that Thick Individualism is impossible or pragmatically disastrous.

  **3. Points of Agreement and Their Limitations**
  We endorse the following claims, while acknowledging their limitations:
  *   **Supervenience:** Social facts supervene on individual facts. There cannot be a change in the social state of the world without some change in the states of the individuals composing it. *Limitation:* We agree this is too thin to settle the explanatory debate, as supervenience is compatible with strong emergence and downward causation.
  *   **Multiple Realizability:** The same social institution (e.g., money) can be realized by vastly different individual psychological states or physical tokens. *Limitation:* Individualists view this as a challenge to reduction; Holists view it as proof of autonomy. Both agree it holds, but disagree on its implication.
  *   **Agency:** Only individuals can be ultimate agents of action. *Limitation:* Holists argue that while only individuals act, *what* they do is determined by social structures, preserving explanatory autonomy for the social level.

  **4. Residual Disagreements**
  We state our remaining disagreements in neutral terms acceptable to both sides:
  *   **Ontological:**
      *   *Individualist:* Social entities are logical constructions; to be committed to them is merely a *façon de parler* for commitments to individuals and their relations.
      *   *Holist:* Social entities are emergent particulars; to be committed to them is to acknowledge causal powers that are not exhausted by the sum of individual powers.
  *   **Explanatory:**
      *   *Individualist:* Macro-level explanations are elliptical placeholders that are scientifically incomplete until microfoundations are supplied.
      *   *Holist:* Macro-level explanations possess autonomy; they can be complete and robust even if the underlying micro-mechanisms vary or remain unknown.
  *   **Semantic:**
      *   *Individualist:* Social predicates are, in principle, translatable into individualistic predicates, even if the translation is complex.
      *   *Holist:* Social predicates are sui generis; any attempt to translate them into individualistic terms results in loss of meaning or explanatory power.

  **5. Cruxes of the Debate**
  We identify the following sub-questions as cruxes. Settling these would compel at least one side to revise their position:
  *   **Robustness of Macro-Laws:** If a social regularity holds across wildly different individual psychological profiles, does this validate explanatory autonomy?
      *   *Movement:* A "Yes" would move the Individualist toward accepting explanatory autonomy.
  *   **Intelligibility of Downward Causation:** Can we specify a mechanism by which a social structure constrains individual action without invoking individual belief in that structure?
      *   *Movement:* A "Yes" would move the Individualist toward accepting downward causation. A "No" would move the Holist toward methodological individualism.

  **6. Test Cases and Predictions**
  We agree to evaluate our positions against the following concrete cases, recording our predictions in advance.

  *   **Case A: The Zombie Norm.** A norm persists (e.g., a dress code or ritual) long after the original conditions that created it have vanished. No living participant endorses the original rationale; they comply only to avoid sanction or because "it is done."
      *   *Individualist Prediction:* The explanation remains individualistic. The causal mechanism is the individual's calculation of reputational cost or fear of punishment. The "norm" is merely a label for this aggregate equilibrium of fear.
      *   *Holist Prediction:* The explanation is structural. The norm functions as an autonomous constraint. The fact that *no one* endorses the reason yet the pattern persists proves the social fact has causal power independent of individual intentional states.
  *   **Case B: Schelling Segregation.** An aggregate pattern of stark residential segregation emerges from individual preferences that are only mildly biased (e.g., wanting 30% of neighbors to be like oneself). No individual intends the segregated outcome.
      *   *Individualist Prediction:* This is the triumph of microfoundations. The macro-pattern is fully explained by the micro-preference function. No macro-explanation is needed.
      *   *Holist Prediction:* While the origin is micro, the *maintenance* of the pattern is macro. Once the segregation exists, it creates a housing market structure that constrains future individual choices regardless of whether individual preferences change. The macro-structure exerts downward causation on future micro-decisions.

  **7. Verbal Disputes**
  We acknowledge that a portion of our dispute is merely verbal. Specifically, the use of the terms "real" and "cause" often generates heat without light.
  *   **Issue:** Whether social structures are "real."
  *   **Why Verbal:** Individualists use "real" to mean "fundamental constituent of reality" (like atoms). Holists use "real" to mean "causally efficacious in a model." Both agree social structures are causally efficacious; they disagree on whether that efficacy requires fundamentality.
  *   **Issue:** Whether social structures "cause" individual behavior.
  *   **Why Verbal:** Individualists reserve "cause" for efficient causation (billiard balls). Holists include "constitutive causation" (rules defining a game). Clarifying this distinction dissolves the apparent contradiction regarding downward causation.

  **Conclusion**
  We commit to pursuing the test cases above with empirical rigor. We acknowledge that the unresolved questions lie not in logic, but in the actual stability and robustness of social mechanisms in the wild.

  ***

