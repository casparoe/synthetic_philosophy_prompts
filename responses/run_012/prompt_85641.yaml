answer: |-
  You have correctly identified the terrain: this is the classic debate between **Internalism** and **Externalism** about reasons for action, crystallized by the philosopher Bernard Williams in his 1979 paper "Internal and External Reasons."

  Your scientific training treats a "reason" as a cause (a prior event explaining a subsequent event). In this philosophical debate, "reason" means a *justification*—a consideration that makes an action rational or correct. The central tension is whether a justification must be capable of explaining an action (linking to motivation) to count as a reason *for that agent*.

  Here is an adjudication of the moves, followed by answers to your specific questions.

  ### 1. Analysis of the Moves

  **Member B (The Internalist)**
  *   **The Core Claim:** B is channeling Bernard Williams. The thesis is that for a statement "A has a reason to $\phi$" to be true, there must be a "sound deliberative route" from A's existing "subjective motivational set" (desires, projects, commitments) to $\phi$-ing.
  *   **Right Moves:** B is correct that reasons are typically tied to agency. If a consideration cannot *possibly* motivate an agent (even under ideal conditions), it is unclear in what sense it is a reason *for them* rather than just a fact about the universe. B's distinction that it might be a reason for "the man he would be" is a standard and powerful internalist move.
  *   **Mistaken/Weak Moves:** B makes an empirical gamble in the second round. B claims the man *does* have concerns (being thought decent, not being a hypocrite) that, if attended to, would yield a reason to stop. If the man is a true psychopath or a thoroughgoing egoist who genuinely does not care about decency or consistency, B's argument collapses. In that case, B must admit the man has *no reason* to stop, which many find morally intolerable.
  *   **What B Misses:** B risks conflating *rationality* with *psychological capacity*. By defining reasons so tightly to motives, B risks making morality contingent on personality. If the cruel man is consistent and self-aware, Internalism implies he is rationally permitted to be cruel.

  **Member A (The Externalist)**
  *   **The Core Claim:** A is defending a form of Moral Realism or Normative Externalism (associated with philosophers like Derek Parfit, Thomas Scanlon, or John McDowell). The thesis is that normative facts exist independently of an agent's psychology.
  *   **Right Moves:** A captures the normative force of morality. The intuition that "he ought to stop even if he doesn't want to" is robust. A is also right that if Internalism is true, moral criticism often becomes merely a report of the critic's desires ("I wish you were different"), which undermines the objective weight of moral claims.
  *   **Mistaken/Weak Moves:** A's final claim ("a demand can be true") borders on begging the question. To say a demand is "true" is to assert the existence of normative facts, but it does not explain *how* these facts relate to the man's agency. If the reason cannot move him, in what sense is it a reason for *action* rather than just a true proposition?
  *   **What A Misses:** A struggles to explain the "link." If reasons exist independently of motives, how do they get a grip on the will? Externalists often posit a faculty of "rational intuition," which skeptics (like your training might suggest) find metaphysically mysterious.

  ### 2. Adjudication of Your Specific Questions

  #### (i) Does A's claim that considerations count in favour independently of anyone's motives have content beyond restating her conclusion?

  **Consensus:** Yes, it has content, but it carries a heavy metaphysical cost.
  **Contested:** Whether that cost is acceptable.

  A is not merely restating her conclusion; she is making a claim about the nature of normative truth. She is asserting **Normative Realism**. In your biological terms, she is claiming that "rightness" is like "health": a organism can be unhealthy even if it feels fine and has no internal drive to be healthy. The "content" is the assertion that there are objective standards of rationality/morality that apply to agents regardless of their subjective states.

  However, B will reply that this content is "queer" (a term made famous by J.L. Mackie). If a consideration counts in favour of an action but is utterly disconnected from anything the agent cares about, it looks less like a *reason for action* and more like a *cosmic command*.
  *   **Verdict:** A's claim has content (it posits objective normative facts), but it fails to explain the *mechanism of normativity* (how these facts bind the agent). It solves the problem of moral objectivity at the price of making reasons mysterious entities that float free of human psychology.

  #### (ii) Can B's talk of what the man would care about after deliberating be made precise, or does it collapse?

  **Consensus:** This is the hardest technical problem for Internalism. It is widely acknowledged that specifying "sound deliberation" without smuggling in Externalism is extremely difficult.
  **Contested:** Whether it *can* be done.

  B's strategy relies on the "sound deliberative route." To avoid collapsing into A's position (Externalism), "sound" must mean something procedural (like logical consistency, avoiding contradiction, gathering facts) rather than substantive (like "arriving at moral truth").
  *   **The Collapse Risk:** If "sound deliberation" implies that any rational agent *must* arrive at the conclusion "do not be cruel," then B has secretly admitted that there is an external reason (rationality itself demands it). This is the Kantian route (Christine Korsgaard), which tries to ground morality in the structure of agency itself.
  *   **The Description Risk:** If "sound deliberation" is strictly procedural (e.g., means-end efficiency), then the cruel man might deliberate perfectly and conclude "continue cruelty." In this case, B's position collapses into a description of the man's psychology: "He has no reason to stop."
  *   **B's Specific Defense:** B tries to avoid this by claiming the man is *inattentive* to concerns he *actually has* (decency, hypocrisy). This saves Internalism *only if* it is empirically true that all humans have these concerns.
  *   **Verdict:** B's position is precise *in theory* (Williams defined it clearly), but it is fragile *in application*. It collapses into Externalism if "deliberation" is defined to guarantee moral outcomes. It collapses into mere description if "deliberation" is purely procedural and the agent is amoral. B is currently walking a tightrope: claiming the man *would* care if he saw clearly. If the man says, "I see clearly and I don't care," B must either say the man is irrational (smuggling in Externalism) or admit he has no reason (accepting the bitter pill of Internalism).

  ### 3. Summary for a Biologist

  Since you view reasons as causes, here is the translation:

  *   **Member B (Internalism)** treats a "reason" like a **physiological drive**. Just as a fish has a "reason" (internal need) to breathe water but not air, a man has a reason to $\phi$ only if $\phi$-ing connects to his internal motivational chemistry. If his chemistry lacks a "morality receptor," morality cannot be a reason for him.
  *   **Member A (Externalism)** treats a "reason" like a **medical prescription**. A doctor says, "You have a reason to take this medicine" because it is objectively good for your health, even if you have no desire to be healthy and the medicine tastes bad. The "reason" exists in the facts of biology, not in the patient's desires.

  **Who is right?**
  *   **On Explanation:** B is stronger. In science, we explain behavior by looking at internal states. B explains why people actually act.
  *   **On Normativity:** A is stronger. In ethics, we want to say the cruel man is *wrong*, not just that his internal chemistry is different from ours. A preserves the idea that he *should* change, regardless of his chemistry.

  **The Consensus View:**
  There is no consensus on who wins. However, there is consensus on the stalemate:
  1.  **Internalism** (B) offers a better explanation of action but struggles to condemn the rational amoralist.
  2.  **Externalism** (A) offers a better account of moral obligation but struggles to explain how those obligations connect to human motivation.

  **Final Adjudication:**
  *   **A is right** that moral criticism feels objective and not merely a report of the critic's desires.
  *   **B is right** that a "reason" that can never motivate anyone is suspiciously unlike a reason and more like a force of nature.
  *   **A is mistaken** if she thinks positing "true demands" explains *why* the man should listen.
  *   **B is mistaken** if he thinks he can guarantee the man has *some* hidden concern (like decency) without empirical evidence. If the man truly lacks that concern, B must concede the man has no internal reason to stop.

  The debate remains live because it maps onto a deeper divide: Is morality a discovery of objective truths (A), or is it a projection of human concerns (B)? Your background in experimental biology might incline you toward B (mechanisms of behavior), but your experience with scientific norms (objectivity, truth) might incline you toward A (facts independent of the observer). Both intuitions are philosophically defensible.
