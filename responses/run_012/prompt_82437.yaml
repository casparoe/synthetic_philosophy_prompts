      *   **8. "A trait that everyone in a population has, such as two hands, has a heritability of zero, which shows how little heritability tells us about how genetically controlled a trait is."**
          *   *Analysis:* If there is no variance, there is no heritability (variance ratio). Having two hands is genetically programmed but $h^2=0$ because everyone has it. This illustrates that $h^2$ is not "genetic determination."
          *   *Verdict:* Survive methods seminar.
