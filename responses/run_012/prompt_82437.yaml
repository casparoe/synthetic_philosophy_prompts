          *   *Analysis:* This is the classic fallacy. Heritability is about *variance* in a population, not the proportion of causation in an *individual*. You can't partition an individual's score like a cake.
          *   *Verdict:* Simply False.
          *   *Reason:* It confuses population variance with individual causation.

      *   **2. "The figure is a fact about this sample, in this range of environments, at this moment, and not about reading in general; widen the range of environments and the figure could move."**
          *   *Analysis:* This is the definition of heritability. It is population-specific and environment-specific.
          *   *Verdict:* Survive methods seminar.
          *   *Reason:* It correctly identifies heritability as context-dependent and population-specific.

      *   **3. "Since heritability is 0.70 in the upper half of the sample and 0.30 in the lower half, roughly 70 per cent of the gap in average reading scores between the two halves is genetic."**
          *   *Analysis:* This is the "Between-Group Heritability" fallacy (Lewontin's fallacy). High within-group heritability does not explain between-group differences. The groups differ by income (environment).
          *   *Verdict:* Simply False.
          *   *Reason:* Within-group heritability estimates cannot explain between-group mean differences.

