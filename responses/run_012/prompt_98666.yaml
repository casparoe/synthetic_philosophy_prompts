answer: |-
  Framing
  The decision problem is not whether eating meat is permissible, but which marginal protein source minimizes expected suffering-weighted units. An answer is not a verdict but a function: $S = f(N, W, L)$, where $N$ is the number of individuals affected, $W$ is the moral weight and welfare sign per individual, and $L$ is the land-use counterfactual. The work must define the operators within this function—how to aggregate welfare, how to weight different taxa, and how to model land shifts—rather than merely populating variables. A successful deliverable provides a decision procedure that outputs a ranking of beef, chicken, and lentils given specific inputs for invertebrate weight and wild welfare sign, exposing exactly where moral uncertainty drives the result.

  The Criteria
  I prioritize upstreamness (questions that invalidate downstream models if answered differently), philosophical tractability (conceptual clarity over data collection), and robustness (questions where the answer changes the ranking across plausible parameter ranges). I trade off empirical precision for conceptual stability; a wrong number is fixable, a wrong framework is not. Neglectedness matters only insofar as the field is currently building advocacy on unexamined axioms. The goal is to fund work that resolves structural ambiguities in the comparison procedure itself, ensuring that subsequent empirical research measures the right things rather than the easy things.

  The Agenda

  **1. The Aggregation Axiom: Total Welfare vs. Count of Lives**
  Does the moral cost depend on the sum of welfare or the number of lives cut short? If "number of individuals" carries independent weight, chicken (high $N$, short life) may rank worse than beef (low $N$, long life) even if total suffering is lower. This is contested between total utilitarians and person-affecting views. Settlement requires defining whether "bringing into existence" is a harm independent of welfare sum. This is maximally upstream: it dictates the mathematical operator for the entire decision procedure. Tractability is high for a philosopher; it requires analyzing intuition pumps regarding creation vs. killing, not ecological data.

  **2. The Wild Welfare Sign Standard**
  Are wild lives net negative or positive? If yes, land-intensive beef (displacing wild animals) might be better than lentils (high insect death + habitat loss). If no, the reverse. This is highly contested; some argue nature is a welfare sink, others a neutral baseline. Tractability lies in framing the evidentiary standards for "net negative," not measuring every vole. Upstream of land-use calculations: without a sign, land impact is mathematically undefined. Funding should produce a framework for evaluating welfare signs under uncertainty, distinguishing between empirical gaps and normative disagreements about what counts as a "life worth starting."

  **3. The Invertebrate Moral Weight Function**
  How does moral weight scale with neural complexity? Linear, logarithmic, or binary? If insects count 1/1000th of a cow, lentils win. If 1/10th, lentils may lose. This is the biggest sensitivity parameter in the model. Philosophical work on consciousness gradients is needed, not just neurobiology. Upstream of crop-harm estimates: without a scaling function, insect counts are meaningless. Tractability is moderate; it requires synthesizing philosophy of mind with comparative neuroanatomy. Settlement looks like a defended function that holds across plausible theories of consciousness, allowing users to toggle the parameter within a robust range.

  **4. The Land-Use Counterfactual Baseline**
  If pasture is abandoned, does it rewild (high wild animal density) or become crop land? The "default" state is undefined. If rewilding increases wild suffering (net negative lives), beef reduction harms. This is a causal modeling problem with normative inputs. Upstream of opportunity cost analysis: you cannot calculate the cost of land use without defining the counterfactual use. Tractability is moderate; it requires mapping causal pathways of land transition. Settlement requires a standardized typology of land transitions (e.g., pasture-to-forest vs. pasture-to-crop) linked to welfare outcomes, separating ecological prediction from moral valuation.

  **5. The Harvest Harm Conceptualization**
  Is insect death in harvest instantaneous or suffering-laden? If instantaneous, only habitat loss matters. If painful, crop proteins incur high debt. This hinges on the philosophy of pain duration vs. intensity. Tractable via reviewing mechanistic data through a welfare lens. Upstream of lentil costing: current models often assume death equals zero future welfare, ignoring the death process. Settlement requires a threshold for "morally significant suffering" during harvest mechanics. This is neglected; most work assumes death is the harm, not the mode of death. A conceptual framework here prevents empirical over-investment in irrelevant harvest metrics.

  **6. Moral Uncertainty Aggregation**
  How do we weigh conflicting theories (e.g., utilitarianism vs. rights views) within the procedure? Should we maximize expected choice-worthiness? This determines if the procedure outputs a single ranking or a probability distribution. Neglected in practical guides. Upstream of final decision rule: without this, the procedure pretends to certainty where none exists. Tractability is high for moral philosophers. Settlement looks like a recommended method for combining credences across moral theories (e.g., variance normalization). This ensures the decision procedure is robust to the user's own moral uncertainty, not just empirical uncertainty.

  **7. Identity and Replacement in Substitution**
  Does replacing a farmed animal with a wild one count as "saving" if the wild one would have existed anyway? This touches the non-identity problem. If farmed lives are net negative, creating them is bad. If wild lives are net negative, displacing them is good. Conceptual clarity needed on counterfactual identity. Upstream of substitution models: you cannot compare beef to lentils without knowing if the displaced wild animal is the "same" moral subject. Tractability is moderate; it requires applying non-identity literature to ecological substitution. Settlement requires a rule for handling identity across counterfactual scenarios in food systems.

  What Would Reorder It
  Empirical consensus on the wild welfare sign (Question 2) would collapse the uncertainty on land use. If wild lives are proven net positive, land-sparing (lentils) becomes strictly dominant regardless of invertebrate weight, pushing Question 4 down. Conversely, if the Aggregation Axiom (Question 1) is settled as strictly total utilitarian, the "Count of Lives" concern vanishes, simplifying the procedure. However, until the Wild Welfare Sign is resolved, it remains the highest-leverage uncertainty because it flips the valence of land use entirely, making it the primary candidate for reordering the agenda if new theoretical or empirical work emerges.

  Bottom Line
  Fund the Aggregation Axiom work first, as it dictates the mathematical structure of the entire decision procedure. Fund the Wild Welfare Sign framework second, as it determines the valence of the land-use variable which currently dominates the uncertainty. Fund the Invertebrate Moral Weight scaling third, as it resolves the largest sensitivity parameter regarding crop-based proteins.
