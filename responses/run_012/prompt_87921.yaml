answer: |-
  This is a sharp brief. You're asking for the structural load-bearing points of Reflection, not the introductory objections. Since you treat Reflection as a substantive norm of rationality rather than a definition of coherence, the stakes are higher: it must guide action, not just describe consistency.

  Here is the stress-test map you requested, ranked by the severity of the threat to the principle as a *normative requirement*.

  ### 1. The Hierarchy of Defeaters

  I rank these by how much they should move you from "Reflection is a requirement" to "Reflection is a heuristic with exceptions."

  **Rank 1: Known Epistemic Decay (The Hangover/Forgetting Case)**
  *   **The Bite:** If you are certain your future self will be drunk or senile, Reflection demands you adopt their credence now. This is intuitively absurd.
  *   **Defender's Concession:** You must add a rider: Reflection holds only conditional on the belief that your future self is *epistemically rational* (or at least, not compromised in ways you currently recognize).
  *   **The Cost:** This invites the circularity charge. If "rational" means "satisfies Reflection," the principle becomes: "Defer to your future self if they satisfy the principle you are currently trying to justify."
  *   **Verdict:** This is the strongest defeater. It forces Reflection to be a *conditional* norm dependent on a prior assessment of the future self's reliability. It ceases to be a free-standing diachronic constraint and becomes a derivative of synchronic reliability assessments.

  **Rank 2: Self-Locating Belief (Sleeping Beauty)**
  *   **The Bite:** In Sleeping Beauty, Conditionalization and Reflection pull apart. If Beauty is a Halfer (Conditionalization), she violates Reflection (she knows her Monday credence will be 1/2, but her Sunday credence is 1/2... wait, the conflict arises in the waking credence vs. Sunday credence regarding the coin). If she is a Thirder (Reflection), she violates Conditionalization.
  *   **Defender's Concession:** You must deny that standard Conditionalization applies to self-locating beliefs, or you must restrict Reflection to non-indexical propositions.
  *   **The Cost:** High theoretical cost. It fragments your epistemology into "ordinary" and "self-locating" domains.
  *   **Verdict:** Significant, but containable if you are willing to modify Conditionalization (e.g., using Elga's Limited Principle of Indifference).

  **Rank 3: Non-Epistemic Drift (Your Teaching Case)**
  *   **The Bite:** You know your future credence (0.9) is caused by *sympathy*, not evidence. Reflection says: $C_{now}(A | C_{future}(A)=0.9) = 0.9$.
  *   **Defender's Concession:** You must distinguish between *causal* anticipation of belief and *evidential* anticipation of belief. Reflection presumes the future credence is a proxy for evidence you don't have yet. In the teaching case, you know the mechanism is bias.
  *   **The Cost:** This requires you to have access to the *etiology* of your future belief, not just the value.
  *   **Verdict:** This is a specific instance of Rank 1 (Epistemic Decay), but subtler. It shows Reflection fails when the link between Truth and Future Credence is severed, even if the Future Self is "sane."

  **Rank 4: Many-Minds Metaphysics**
  *   **The Bite:** If the mind branches, "my future credence" has no unique referent. There is a distribution of future credences across branches.
  *   **Defender's Concession:** Reflection must be reformulated as an expectation over branches: $C_{now}(A) = \sum w_i \cdot r_i$, where $w_i$ is the branch weight.
  *   **The Cost:** Requires committing to a specific weighting metric (Born rule?) as normative for credence.
  *   **Verdict:** Manageable. It turns Reflection into a linearity constraint on branch weights. It doesn't kill the principle, just complicates the ontology.

  **Rank 5: Jamesian Will-to-Believe**
  *   **The Bite:** If believing P helps make P true (or helps me sustain the belief), Reflection seems to license bootstrapping. "I will believe P, so I should believe P."
  *   **Defender's Concession:** Reflection is not a license to create belief, but to align with anticipated rational states. If the future belief is caused by a "will to believe" rather than evidence, see Rank 1 & 3.
  *   **Verdict:** This is a feature, not a bug, *if* the belief is pragmatic. If it's epistemic, it's covered by the Epistemic Decay objection.

  ---

  ### 2. The "Sympathy/Teaching" Case: Specific Analysis

  You asked to take this seriously. Here is the precise failure mode.

  Reflection relies on the **Screening-Off Assumption**: Your current evidence is screened off by the proposition about your future credence. Formally: $C_{now}(A | C_{future}(A)=r, E_{now}) = C_{now}(A | C_{future}(A)=r)$.

  In the teaching case, you possess $E_{now}$ which includes the proposition: *"The shift to 0.9 is caused by affective sympathy, not new argumentative evidence."*
  Because you know the *cause* of the future credence is epistemically irrelevant (sympathy), the future credence does not screen off your current evidence regarding the book's quality. The future credence is not a "signal"; it is "noise" you can currently identify.

  **Why you don't have to give up what you like:**
  You can maintain Reflection as a requirement *provided* you interpret the condition $C_{future}(A)=r$ as implying *"r is the result of a rational processing of evidence available at t'."*
  If you know the processing is biased, the condition "My future self has credence r" is not met in the *relevant epistemic sense*. You are not certain your future self will have credence r *as a rational agent*; you are certain your future self will have credence r *as a compromised agent*.
  **The Fix:** Reflection applies to the *rational* future self. If you know you will be biased, you are not certain your *rational* self will be at 0.9. You are certain your *actual* self will be. The principle only commands deference to the former.

  ---

  ### 3. Foundational Support: Dutch Book and Accuracy

  You asked if these arguments reach a diachronic norm like this, or if Reflection is stipulated.

  *   **Dutch Book:** The standard diachronic Dutch Book argument for Reflection (van Fraassen 1984) assumes you cannot bet against your future self. It shows that if you violate Reflection, there is a strategy of bets (now and later) that guarantees a loss.
      *   *Weakness:* It assumes the future self *must* accept the bets. If your future self is compromised (Hangover), they might accept bad bets, but that doesn't mean *you* should align with them now to avoid the book. The Dutch Book argument collapses if the future self is not a reliable betting partner.
      *   *Status:* Supports Reflection only under the assumption of future reliability.
  *   **Accuracy Arguments:** (Joyce, Greaves, etc.) Accuracy arguments strongly support Conditionalization. Support for Reflection is derivative. If you assume your future self is an accuracy optimiser, Reflection follows. If not, Accuracy arguments do *not* support Reflection.
      *   *Status:* Reflection is not a fundamental accuracy norm; it is a consequence of trusting your future self's accuracy.

  **Verdict:** Reflection is not a primitive norm. It is a derived norm contingent on the presumption of future epistemic integrity.

  ---

  ### 4. Insulation and Tautology

  You asked: *If every counterexample gets absorbed by some rider, is it insulated?*

  Yes, it is insulated. If the principle becomes "Defer to your future self *unless* you have reason to think they are irrational," it risks collapsing into: "Defer to your future self insofar as they are rational."
  *   **Is this a vice?** In a foundational project, yes. It means Reflection does no work; the work is done by the theory of rationality you use to filter the future selves.
  *   **Is this what a normative constraint looks like?** Often, yes. Consider "Keep your promises." We add riders ("unless it causes harm"). It doesn't make the norm trivial; it makes it *defeasible*.
  *   **The Danger:** If the rider is "unless you disagree with them," the principle is empty. The rider must be "unless you have *independent* evidence of their irrationality." In the Teaching case, you have independent evidence (psychology of sympathy). In the Hangover case, you have independent evidence (physiology).
  *   **Conclusion:** It is insulated, but not viciously so, *provided* the criteria for "rational future self" are independent of Reflection itself.

  ---

  ### 5. Confidence and Uncertainty

  **Confidence Levels:**
  1.  **High Confidence:** The "Hangover/Decay" case is the fatal blow to the *unrestricted* principle. Reflection cannot be a blind requirement.
  2.  **High Confidence:** Dutch Book/Accuracy arguments do not support Reflection independently of assumptions about future reliability.
  3.  **Medium-High Confidence:** The "Teaching/Sympathy" case is resolved by distinguishing causal etiology of belief from evidential support.
  4.  **Medium Confidence:** Many-Minds QM requires a weighted reformulation but does not refute the core intuition of deference.

  **The Point of Least Certainty:**
  I am least sure about the **Self-Locating (Sleeping Beauty) conflict**.
  There is a live debate on whether Reflection should be abandoned in favor of a generalized Conditionalization for self-locating beliefs, or whether Conditionalization is the one that needs to go. Some (like Arntzenius) suggest Reflection is the more robust intuition. If you are a Many-Minds person, you might already be inclined to treat "future self" as a measure over branches, which aligns closer to the Thirder position (Reflection) than the Halfer position (Conditionalization). I am not certain whether resolving the Sleeping Beauty tension requires sacrificing Reflection or sacrificing standard Conditionalization. Given your QM commitments, you might find sacrificing Conditionalization less costly than I do.

  ### Summary Recommendation for the Seminar

  If you want to defend Reflection without it looking like dogma:
  1.  **Concede the Rider:** Explicitly state Reflection applies only to future selves regarded as *epistemically reliable*.
  2.  **Shift the Burden:** The work is not in Reflection; it is in the *assessment of future reliability*. Reflection is the rule for how to treat expertise; your future self is only an expert if they aren't hungover or biased.
  3.  **Reframe the Teaching Case:** Use it to show *why* the rider is needed. You don't defer because you know the mechanism of belief-formation is non-truth-tracking.
  4.  **QM Angle:** Argue that Many-Minds actually *supports* the weighted version of Reflection, making it more robust in a branching universe than in a linear one (where identity is fragile).

  Reflection is not a law of logic; it is a norm of **epistemic trust**. When trust is undermined (hangover, bias, branching), the norm lapses. That doesn't make it sentimental; it makes it dependent on the metaphysics of the agent.
