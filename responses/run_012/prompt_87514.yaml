prompt: |-
  Analyse the New Chronology of Anatoly Fomenko — the revisionist chronology he developed from the 1970s onwards, largely in collaboration with Gleb Nosovsky — as a test case for the demarcation of science from pseudoscience, and then tell me what the case does to the demarcation criteria rather than only what they do to it. Fomenko is a genuine mathematician, a topologist at Moscow State University and a member of the Russian Academy of Sciences, and the programme is presented as a quantitative one: he claims to have devised empirical-statistical methods and applied them to chronicles to show that many historical events are misdated.

  Here are the essentials, so that nothing in your answer turns on details you would have to look up. The programme holds that events conventionally assigned to ancient Greece, Rome and Egypt actually occurred in the Middle Ages, more than a thousand years later; that the conventional chronology is largely an artefact of early modern scholarship; and that the duplications can be detected statistically — by comparing the lengths and sequences of dynastic reigns, the distribution of names across chronicles, and the overlap between narrative texts. Fomenko also rejects the physical dating techniques, disputing dendrochronology and radiocarbon dating in particular, and argues that the evidence marshalled against him is not independent of the chronology it is used to confirm: the calibration curves, the tree-ring sequences and the dating of astronomical records all presuppose a framework, so that their mutual agreement is circular rather than corroborative. Historians and archaeologists, for their part, classify the programme as pseudohistory and largely decline to engage with it in detail, while it retains a substantial lay readership in Russia.

  I want the analysis run through a criterion of my own devising, in two parts. First, exposure: a research programme is exposed to a body of evidence to the degree that, in advance of seeing that evidence, some specifiable outcome of it would be treated by the programme's adherents as counting against a central claim rather than against a peripheral one. Second, survival accounting: any inference from the absence of evidence — to the non-existence of a thing, to the forgery or lateness of a document, or to the silence of the record — must be paired with an explicit account of why the evidence would have survived to the present if the thing had existed or the document had been genuine.

  What I want from you:

  1. The mapping. Which claims in the programme are central and which peripheral; what, in advance, would have counted as exposure for it; and whether the statistical apparatus changes anything of substance or merely changes the register in which the claims are made — that is, whether quantification functions here as evidence or as rhetoric.

  2. The same two-part test turned on the orthodox side. Do its practitioners meet their own standard of exposure and of survival accounting? Take the circularity charge seriously on its merits rather than dismissing it: how much of the dating evidence is genuinely independent of the conventional chronology, what work does that independence do, and where does the orthodox case rest on an inference from silence that it has not costed.

  3. Where the criterion misdescribes the case. My own suspicion is that the first part is too psychological — that it locates the difference in the attitudes of adherents rather than in the structure of the claims — and that the second part is too weak, since a sufficiently inventive practitioner can always supply some survival story. Tell me whether that is right, and identify what the episode contains that neither part captures.

  4. The return trip. What does this case show about demarcation criteria themselves? Does it favour the view that pseudoscience is a matter of the structure of a programme, of the conduct of its adherents, or of the ratio of problems solved to problems deferred — and does it suggest that any single criterion must fail here, or that the search for a single criterion is the wrong enterprise altogether?

  Use only criteria you can state and defend; do not give me a survey of the demarcation literature or a reading list. Where a step in your argument depends on a fact about the programme or its critics that I have not supplied, mark it as an assumption rather than asserting it. Write the whole answer in British English.
reasoning: |-
  Here's a thinking process that leads to the suggested analysis:

  1.  **Deconstruct the Request:**

      *   **Topic:** Anatoly Fomenko's "New Chronology" (NC) as a test case for demarcation (science vs. pseudoscience).
      *   **Specific Constraint:** Do not just apply criteria *to* the case; analyse what the case does *to* the criteria.
      *   **User's Criteria:**
          1.  *Exposure:* Adherents must specify in advance what evidence would count against a *central* claim (not peripheral).
          2.  *Survival Accounting:* Inferences from absence of evidence (non-existence, forgery, silence) must be paired with an explicit account of *why* evidence would have survived if the claim were false.
      *   **Required Output Structure:**
          1.  Mapping (Apply criteria to Fomenko/NC).
          2.  Reverse Test (Apply criteria to Orthodox Chronology/OC).
          3.  Critique of Criteria (Where do they fail/misdescribe?).
          4.  The Return Trip (What does this say about demarcation generally?).
      *   **Style/Format:** British English, no survey of literature, mark assumptions clearly.

  2.  **Part 1: Mapping (Fomenko/NC vs. Criteria)**

      *   *Central vs. Peripheral Claims:*
          *   Central: Conventional chronology is wrong by ~1000 years; Ancient history is Medieval history duplicated.
          *   Peripheral: Specific dates of specific battles, specific identities of kings (unless they break the statistical pattern).
      *   *Exposure:* Does Fomenko specify what would falsify the central claim?
          *   He claims statistical methods are objective. So, presumably, if the statistical correlation broke down, the theory falls.
          *   *Problem:* The statistical methods (dynastic parallelisms, name distributions) are often accused of being "cherry-picked" or flexible. If a text doesn't fit, is it a forgery (peripheral adjustment) or does it break the theory? Fomenko tends to label inconvenient texts as late forgeries. This looks like protecting the central claim by adjusting the periphery (the data set).
          *   *Quantification:* Is it evidence or rhetoric? It looks like rhetoric. The "mathematics" gives an aura of precision, but the input data (which chronicles to compare, how to segment reigns) is subjective. If the math is just a veneer for subjective choices, it's not genuine exposure.
      *   *Survival Accounting:*
          *   Fomenko claims massive amounts of evidence are missing or forged.
          *   Does he explain *why* they would have survived if real? He argues that the "Scaligerian" chronology was a conspiracy/construction, so documents were altered.
          *   *Critique:* He often assumes absence proves his point (no physical evidence for ancient Rome = it didn't exist). Does he cost the survival? He argues physical decay or deliberate destruction. Is this explicit? Often it's hand-waved as "time and conspiracy."
      *   *Drafting Part 1:* Focus on how the "mathematical" claim promises exposure but the practice evades it. The survival accounting is present but relies on a grand conspiracy narrative which is hard to test.

  3.  **Part 2: Reverse Test (Orthodox Chronology/OC vs. Criteria)**

      *   *Exposure:*
          *   Would orthodox historians accept something that breaks the timeline? Yes, e.g., an inscription dated by an eclipse that contradicts the king list.
          *   *Circularity Charge:* Fomenko says dendro/radiocarbon/astronomy are calibrated to the conventional timeline.
          *   *Analysis:* Is there independence? Dendrochronology (bristlecone pines, oaks) relies on overlapping ring patterns, not historical dates initially. Radiocarbon calibration uses tree rings. If the tree-ring count is wrong, the calibration is wrong. But the *count* is physical. Is it independent? Yes, physically, but the *assignment* of calendar years to rings often uses historical anchors.
          *   *Verdict:* OC has exposure (new finds change dates), but the "web of belief" is tight. A single anomaly is usually treated as a peripheral problem (bad sample, local anomaly) rather than central falsification.
      *   *Survival Accounting:*
          *   OC infers non-existence from silence sometimes (e.g., no records of a specific peasant revolt).
          *   Do they cost the survival? Often no. "Absence of evidence is not evidence of absence" is a common shield.
          *   *Fomenko's point:* If Rome was a global empire, where is the trash? OC says: decay, urban overbuilding. Is this explicit accounting? Sometimes, often assumed.
      *   *Drafting Part 2:* Acknowledge the circularity charge has *some* merit (calibration anchors), but the physical consistency (multiple independent methods agreeing) acts as a bulwark. However, OC often fails the "survival accounting" strictness (relying on decay without quantifying it).

  4.  **Part 3: Critique of the User's Criteria**

      *   *Psychological vs. Structural:*
          *   User suspects Part 1 (Exposure) is too psychological (attitudes of adherents).
          *   *Agreement:* Yes. Fomenko *says* he would accept falsification, but defines his terms so loosely that falsification never arrives. It's not just attitude; it's the *malleability* of the statistical parameters. The criterion asks "what would they treat as counting against," which requires mind-reading or observing post-hoc rationalisation.
      *   *Survival Accounting Weakness:*
          *   User suspects Part 2 is too weak (inventive practitioners can supply a story).
          *   *Agreement:* Yes. "The dog ate the homework" is a survival story. "The Vatican burned the records" is a survival story. The criterion demands an *account*, but not a *plausible* or *probabilistic* one. Fomenko's conspiracy theory is an "account."
      *   *What is missed?*
          *   *Productivity/Progress:* NC generates no new research programmes that work. It doesn't lead to new archaeological finds that verify it. OC leads to predictive models (where to dig).
          *   *Consilience:* OC fits with genetics, linguistics, geology, astronomy. NC requires all of those to be wrong too.
          *   *The "Mathematical" Mask:* The specific issue of using formal methods on non-quantitative data without error analysis.

  5.  **Part 4: The Return Trip (Demarcation Implications)**

      *   *Structure vs. Conduct vs. Problem-solving:*
          *   Structure: NC looks scientific (math), but isn't. So structure alone fails.
          *   Conduct: Fomenko ignores peer review, goes straight to public. But some geniuses did this historically.
          *   Problem-solving (Lakatosian): NC is a "degenerating problemshift." It constantly adds ad-hoc hypotheses (forged documents, conspiracies) to protect the core. OC is "progressive" (predicts finds).
      *   *Single Criterion:*
          *   This case suggests a single criterion (like falsifiability) is insufficient. Fomenko claims falsifiability (via stats).
          *   We need a *cluster* concept.
          *   *Key Insight:* The case shows that *quantification* is not *scientific rigour*. It shows that *independence of evidence* is crucial but hard to verify.
      *   *Conclusion:* Demarcation is not a line but a multidimensional space. The search for a single necessary and sufficient condition is the wrong enterprise.

  6.  **Refining and Polishing (British English & Tone):**

      *   Check spelling: *programme, centre, analyse, defence, modelling*.
      *   Tone: Analytical, philosophical, rigorous. Avoid dismissiveness, treat Fomenko's claims seriously as per prompt instructions (even if they are widely debunked).
      *   Check Constraints: Did I mark assumptions? Yes. Did I avoid literature survey? Yes. Did I answer all four parts? Yes.

  7.  **Self-Correction during drafting:**
      *   *Initial thought:* I should mention that historians hate Fomenko.
      *   *Correction:* No, the prompt says "largely decline to engage." Focus on the *logic* of their non-engagement via the criteria.
      *   *Initial thought:* I should debunk the math.
      *   *Correction:* Focus on whether the math functions as exposure or rhetoric.
      *   *Check on Circular Charge:* Be careful not to simply dismiss Fomenko's circularity claim. Acknowledge that calibration *does* use historical anchors, which is a vulnerability, but the *overlap* of independent sequences provides the strength.
      *   *Check on Survival Accounting:* Ensure I address the user's suspicion that this is too weak. I need to validate that suspicion.

  8.  **Final Review against Prompt:**
      *   British English? Yes.
      *   No literature survey? Yes.
      *   Mark assumptions? Yes.
      *   Four specific sections? Yes.
      *   Address "what the case does to the criteria"? Yes, this is crucial in sections 3 and 4.

  (Proceed to generate response based on these thoughts.)
answer: |-
  ### 1. The Mapping: Fomenko's New Chronology against the Criteria

  **Central versus Peripheral Claims**
  To apply your criterion of *exposure*, we must first distinguish the core of the New Chronology (NC) from its adjustable periphery.
  *   **Central Claim:** The conventional chronology of antiquity (Greek, Roman, Egyptian) is an artefact of early modern scholarship; these events actually occurred in the Middle Ages (roughly AD 1000–1500), implying a 'phantom time' of roughly one thousand years.
  *   **Peripheral Claims:** The specific identification of which medieval figure corresponds to which ancient figure (e.g., Jesus as a 12th-century emperor); the specific dates of individual battles; the authenticity of specific manuscripts.

  **Exposure**
  Your criterion requires that adherents specify, in advance, what outcome would count against a *central* claim. Fomenko presents NC as a quantitative programme. He asserts that statistical methods (comparing dynastic reign lengths, name distributions, and text overlaps) objectively reveal 'duplicates' in the historical record.
  *   **The Promise of Exposure:** In principle, the statistical apparatus offers a clear falsification condition. If the correlation coefficients between 'duplicate' dynasties were shown to be statistically insignificant, or if the distribution of names followed a random rather than a clustered pattern, the central claim of systematic duplication would fail.
  *   **The Reality of Application:** In practice, the statistical parameters appear malleable. *Assumption:* It is assumed here, based on the critique of NC by professional statisticians, that the segmentation of reigns and the selection of chronicles are subjective choices made *after* inspecting the data. When a text does not fit the statistical model, it is frequently reclassified as a 'late forgery' or 'corrupted copy'.
  *   **Verdict:** The quantification functions primarily as **rhetoric** rather than evidence. It changes the register of the claim to sound objective, but it does not create genuine exposure. The central claim is insulated because any data that contradicts the statistical pattern is treated as noise or forgery (a peripheral adjustment) rather than a falsification of the method. The adherents do not treat a failed statistical test as a refutation of the 'phantom time'; they treat it as a sign that the document is unreliable.

  **Survival Accounting**
  Your second criterion demands an explicit account of why evidence would have survived if the conventional chronology were true.
  *   **Fomenko's Account:** NC argues that physical evidence for ancient civilisations (strata, ruins, artefacts) is absent or misdated. For the lack of evidence, Fomenko offers a survival story: the 'Scaligerian' chronology was a deliberate construction supported by ecclesiastical and academic powers, implying widespread falsification or destruction of contradictory evidence.
  *   **Verdict:** NC technically provides an account (conspiracy and systematic forgery), but it is a 'universal solvent' explanation. It explains away the absence of evidence (it was destroyed) and the presence of contrary evidence (it was forged). Because the conspiracy is posited as global and centuries-spanning, the cost of the survival story is never quantified. It does not explain *how* such a conspiracy could be maintained without leaving traces of the conspiracy itself (e.g., correspondence about the forgery). Thus, while an account is offered, it lacks the specificity required to be tested.

  ### 2. The Reverse Test: Orthodox Chronology against the Criteria

  We now turn your criteria upon the conventional historical framework (Orthodox Chronology or OC).

  **Exposure**
  *   **The Standard:** Do orthodox historians specify what would count against the central timeline?
  *   **Application:** Yes. An inscription containing an astronomical observation (e.g., an eclipse) that is mathematically incompatible with the assigned date would force a revision. Similarly, a dendrochronological sequence that cannot be cross-dated with the master curve would challenge the timeline.
  *   **The Circularity Charge:** Fomenko argues that radiocarbon calibration and dendrochronology presuppose the conventional chronology. *Assumption:* It is accepted that calibration curves often use historically dated samples (e.g., Egyptian tombs) as anchors.
  *   **Analysis of Independence:** However, the independence is not total. Dendrochronology relies on the physical overlap of ring patterns, which is independent of historical dates *until* the anchor point is applied. If the ring count is 10,000 years, but the anchor says the end is 2,000 years ago, the timeline stretches. OC practitioners treat the physical ring count as the hard constraint and the historical anchor as the variable.
  *   **Verdict:** OC meets the exposure criterion better than NC. When anomalies arise (e.g., the 'Santorini eruption' dating dispute between radiocarbon and ice cores), they are treated as central problems to be solved, not merely dismissed. However, the 'web of belief' is dense. A single anomaly is often absorbed by adjusting peripheral dates (e.g., claiming a sample was contaminated) rather than overturning the central framework. This is rational scientific conservatism, but it borders on the protective belt strategy you wish to identify.

  **Survival Accounting**
  *   **The Standard:** When OC infers non-existence from silence (e.g., no records of a specific administrative function), do they cost the survival?
  *   **Application:** Often, no. The maxim 'absence of evidence is not evidence of absence' is frequently invoked. For physical remains, OC relies on decay rates, urban overbuilding, and geological processes.
  *   **Verdict:** OC frequently fails your strict survival accounting criterion. Historians often assume documents rotted or were burned without providing a probabilistic model of why *some* survived and others did not, other than broad appeals to 'the ravages of time'.
  *   **The Difference:** The crucial distinction is that OC's survival stories are consistent with known physical laws (paper decays, wood burns), whereas NC's survival stories require unknown sociological mechanisms (a global, centuries-long conspiracy with no leaks). OC fails the *explicitness* of your criterion, but NC fails the *plausibility* of the account provided.

  ### 3. Where the Criterion Misdescribes the Case

  Your suspicion is well-founded. The New Chronology case reveals structural weaknesses in both parts of your proposed demarcation test.

  **The Psychological Trap of Exposure**
  You suspect the first part is too psychological, locating the difference in the *attitudes* of adherents rather than the *structure* of the claims. The NC case confirms this.
  *   **The Problem:** Fomenko *claims* his method is falsifiable. He publishes formulae. If one relies solely on the adherent's declaration of what *would* count against them, NC passes. The failure is not in their stated willingness to accept refutation, but in the **operational definition** of the variables.
  *   **The Structural Defect:** The criterion misses that 'exposure' requires not just a willingness to be proven wrong, but a **rigid connection between theory and observation**. In NC, the statistical parameters (what counts as a 'reign', which texts are 'independent') can be tweaked to restore the correlation. The criterion of exposure assumes the terms of the test are fixed. NC shows that a programme can maintain exposure *in principle* while evading it *in practice* by shifting the definitions of the data. The demarcation lies not in the attitude, but in the **stability of the operational bridge** between theory and evidence.

  **The Inventiveness of Survival Accounting**
  You suspect the second part is too weak, as inventive practitioners can always supply a survival story. NC proves this definitively.
  *   **The Problem:** 'Conspiracy' is a complete survival story. It explains why evidence is missing (destroyed) and why contrary evidence exists (planted).
  *   **The Missing Element:** Your criterion demands an *account*, but not a *costed* account. NC provides a narrative, but not a mechanism with a probability. A robust criterion must demand that the survival story be **independently verifiable**. OC says 'fire destroys paper'; we can test this. NC says 'a secret cabal destroyed paper'; we cannot test this without finding the cabal.
  *   **What the Episode Contains that the Criteria Miss:**
      1.  **Consilience:** OC is supported by the convergence of independent fields (genetics, linguistics, geology, astronomy). NC requires *all* these fields to be simultaneously wrong in a coordinated way. Your criteria focus on the internal logic of the historical claim, missing the **external coherence** with the rest of established science.
      2.  **Heuristic Power:** OC generates new research questions ('If this trade route existed, where should the ports be?'). NC is largely destructive ('This port is a fake'). A demarcation criterion should account for **productivity**. NC creates a dead end; OC creates a map.

  ### 4. The Return Trip: What the Case Shows about Demarcation

  The New Chronology case suggests that the search for a single, necessary, and sufficient condition for demarcation is the wrong enterprise. Instead, it points towards a multidimensional assessment.

  **Structure vs. Conduct vs. Problem-Solving**
  *   **Structure:** NC mimics the structure of science (mathematics, statistics, empirical claims). This shows that **formal structure is insufficient** for demarcation. Pseudoscience can wear the clothes of science.
  *   **Conduct:** Fomenko bypasses peer review and appeals directly to the public. While this is a marker of pseudoscience, it is not definitive (some genuine innovators faced rejection). However, combined with the refusal to engage with technical critiques, conduct becomes a strong indicator.
  *   **Problem-Solving (The Lakatosian View):** This case strongly favours a **problem-shift** criterion. A scientific programme is progressive if it predicts novel facts; it is degenerating if it only explains known facts by adding ad-hoc hypotheses.
      *   NC is degenerating: Every new piece of physical evidence (e.g., a new radiocarbon date) is met with an ad-hoc adjustment ('the sample was contaminated' or 'the method is flawed').
      *   OC is progressive: It predicts where artefacts should be found, and they are often found there.

  **The Verdict on Demarcation Criteria**
  The NC case demonstrates that **quantification is not rigour**. It shows that a criterion based solely on falsifiability (exposure) fails because theories can be made immune to falsification by reclassifying data (as forgery). It shows that a criterion based on explanation (survival accounting) fails because any gap can be filled by a sufficiently elaborate narrative.

  Therefore, the case suggests that demarcation is not a line but a **cluster concept**. A programme is likely pseudoscientific if it exhibits a majority of the following:
  1.  **Immunisation:** Central claims are protected by reclassifying contradictory evidence as peripheral anomalies or forgeries without independent proof of the forgery.
  2.  **Isolation:** The programme requires the rejection of established findings in unrelated fields (physics, genetics) without offering a superior alternative theory for those fields.
  3.  **Stagnation:** The programme solves no new empirical problems and generates no novel predictions, focusing instead on reinterpreting old data.

  **Conclusion**
  Your criteria are necessary but not sufficient. *Exposure* is vital, but it must be coupled with **operational stability** (the rules of the test cannot change mid-game). *Survival Accounting* is vital, but it must be coupled with **independent verifiability** (the reason for absence must be testable). The New Chronology case ultimately teaches that demarcation is not about the logical form of the theory, but about the **trajectory of the research programme**. Pseudoscience is not defined by being wrong (OC may have errors), but by being **static and insulated**. It is a parasite on the host body of science, using its methods to deny its findings without offering a functional replacement. The demarcation lies in the direction of travel: towards greater empirical integration and predictive power, or towards greater isolation and ad-hoc complexity.
