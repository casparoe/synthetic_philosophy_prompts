  *   **Branch B2-ii-b:** Events are only orderable (Ordinal).

  **Node 9 (From B2-iii):** How does the scale of meaning work?
  *   **Branch B2-iii-a:** Meanings are only orderable (Ordinal).
  *   **Branch B2-iii-b:** One meaning outweighs any number of lesser ones (Lexical).

  ***

  ### The Leaves (Positions)

  **1. The Epistemic Skeptic** (Node A1)
  *   **Awkward Commitment:** We might find the answer tomorrow, so today's silence is merely provisional.
  *   **Dialogue:** "I'm not saying they're equal; I'm saying the ledger is still closed."
  *   **Fund Allocation:** **Bites Bullet.** Refuses to allocate based on rank; proposes equal split or lottery.

  **2. The Ontological Incommensurabilist** (Node A2-i)
  *   **Awkward Commitment:** Two atrocities can be side-by-side without any comparative truth connecting them.
  *   **Dialogue:** "You're trying to measure depth with a ruler; these are different dimensions."
  *   **Fund Allocation:** **Bites Bullet.** Rejects the premise of the fund; suggests separate memorials instead.

  **3. The Parity Theorist** (Node A2-ii)
  *   **Awkward Commitment:** Atrocities can be 'on a par' without being equal, allowing for choice without superiority.
  *   **Dialogue:** "Neither is worse, but I can still choose to mourn this one first."
  *   **Fund Allocation:** **Accommodates.** Allocates based on preference rather than truth; "We fund this one because it matters more to us, not because it was bigger."

  **4. The Ritualist** (Node B1-i)
  *   **Awkward Commitment:** The ranking is true, but speaking it is a moral violation akin to desecration.
  *   **Dialogue:** "Some truths are weapons; putting them on a scale dishonors the dead."
  *   **Fund Allocation:** **Bites Bullet.** Allocates equally to avoid the sin of ranking, despite believing one side deserves more.

  **5. The Expressivist** (Node B1-ii)
  *   **Awkward Commitment:** Ranking isn't wrong because it's false, but because it expresses coldness.
  *   **Dialogue:** "To compare them is to say you are the kind of person who compares them."
  *   **Fund Allocation:** **Bites Bullet.** Allocates based on need, explicitly denying the allocation reflects moral rank.

  **6. The Standing Guardian** (Node B1-iii)
  *   **Awkward Commitment:** Outsiders cannot rank, but victims might; silence is a matter of identity, not truth.
  *   **Dialogue:** "It's not that it can't be said, it's that *you* can't be the one to say it."
  *   **Fund Allocation:** **Accommodates.** Defers allocation to a committee of survivors; abdicates personal judgment.

  **7. The Aggregative Humanist** (Node B2-i-a)
  *   **Awkward Commitment:** Suffering is a uniform substance; enough minor pains can outweigh one extreme torture.
  *   **Dialogue:** "If enough people bleed, the total weight tips the scale, no matter the depth of the cut."
  *   **Fund Allocation:** **Accommodates.** Allocates proportionally to the estimated number of victims.

  **8. The Lexical Humanist** (Node B2-i-b)
  *   **Awkward Commitment:** One instance of extreme degradation outweighs any amount of mere discomfort.
  *   **Dialogue:** "You cannot add up a million scratches to equal a single execution."
  *   **Fund Allocation:** **Accommodates.** Allocates everything to the single worst event, ignoring the count of lesser ones.

  **9. The Historical Realist** (Node B2-ii-a)
  *   **Awkward Commitment:** Events have objective magnitudes independent of how much anyone suffered.
  *   **Dialogue:** "The collapse of a nation weighs more than the death of a village, regardless of the body count."
  *   **Fund Allocation:** **Accommodates.** Allocates based on historical impact metrics (e.g., years of influence lost).

  **10. The Historical Ordinalist** (Node B2-ii-b)
  *   **Awkward Commitment:** We can say which was worse, but never by how much; the gap is unmeasurable.
  *   **Dialogue:** "I know A comes before B in the book of horrors, but I don't know the page numbers."
  *   **Fund Allocation:** **Bites Bullet.** Allocates sequentially (fund one, then the other) rather than proportionally.

  **11. The Narrative Relativist** (Node B2-iii-a)
  *   **Awkward Commitment:** The rank changes depending on which community is telling the story.
  *   **Dialogue:** "For us, this wound is central; for them, it is a footnote; neither story is false."
  *   **Fund Allocation:** **Accommodates.** Allocates based on the intensity of current community need/identity, not past event size.

  **12. The Memory Absolutist** (Node B2-iii-b)
  *   **Awkward Commitment:** One community's trauma creates a moral demand that silences all others.
  *   **Dialogue:** "This memory is the lens through which all other suffering must be viewed."
  *   **Fund Allocation:** **Accommodates.** Allocates all resources to the 'foundational' atrocity that defines the group.

