answer: |-
  **The claim**
  The professor's claim is that shared behavioral dispositions can functionally replace Lewis's epistemic conditions without losing the essential features of convention. Because these dispositions are mutually known and drive coordination, the common-knowledge clause is redundant rather than constitutive.

  **The argument**
  Lewis's analysis secures a coordination equilibrium where conformity is rational because it is expected. The professor's dispositional model achieves this without recursive beliefs. First, consider conditional preference. Lewis demands agents prefer to conform given others conform. In the hypothetical, the disposition to "drift toward whatever others are doing" is the behavioral instantiation of this preference. You do not need a propositional attitude like "I expect you to stand right" if your psychological makeup mechanically ensures alignment. The equilibrium holds regardless of internal representation.

  Second, normativity is replicated by the disposition to sanction. Lewis worries mere regularity isn't normativity. Here, the shared disposition to glare provides external pressure making conformity obligatory. If I know you are disposed to sanction me, I have a pragmatic reason to conform, functionally identical to believing you expect me to. The sanction transforms a regularity into a norm without requiring higher-order beliefs.

  Third, arbitrariness is satisfied because the disposition is content-neutral. Lewis requires an alternative regularity $R'$ could have held. Since the disposition is to follow *whatever* others do, had the population initially drifted left, the disposition would have locked in left-standing.

  Finally, the common-knowledge clause is redundant because the hypothetical stipulates dispositions are "shared and known to be shared." Lewis invokes common knowledge to ensure everyone knows everyone knows the regularity holds, stabilizing expectations. But if it is common knowledge that we possess a disposition to conform to the majority, it is effectively common knowledge how everyone will behave. The epistemic work is done by knowledge of dispositions rather than expectations. The recursive belief structure Lewis demands is merely a rational reconstruction of what is guaranteed by shared psychological machinery. To say dispositions are "known to be shared" implies I know you have the disposition, you know I have it, and I know you know I have it. This infinite hierarchy is exactly what Lewis's common-knowledge clause demands, applied to the mechanism rather than the outcome. Lewis wanted to avoid regress, and dispositions stop the regress by making expectation unnecessary, provided dispositions are transparent. However, the transparency itself requires the same infinite hierarchy of knowledge that Lewis specified. If I don't know that you know I have the disposition, I can't be sure you won't drift. Thus, the "known to be shared" clause *is* the common knowledge condition, just shifted from the behavior to the disposition. The dispositional story delivers coordination, normativity, and arbitrariness, rendering the explicit epistemic clause regarding expectations a philosophical overlay rather than a functional necessity.

  **Where it's weakest**
  First, this model sacrifices rational agency for causal mechanism. Lewis treats conventions as solutions for rational agents who conform *because* they expect others to. If I merely have a blind disposition to drift, I am reacting causally rather than coordinating intentionally. This loses the reason-responsiveness central to Lewis's account; it explains customs, but perhaps not conventions. Furthermore, without explicit beliefs, it is unclear how agents justify their actions to themselves or others when challenged.

  Second, the model struggles with convention change. Common knowledge allows for rapid updating when beliefs shift. Dispositions are sticky. If the regularity breaks, do dispositions flip instantly? Lewis's model explains how we negotiate new conventions; the dispositional model risks explaining only rigid customs that persist until the disposition extinguishes, failing to capture the flexibility of social norms.

  **Bottom line**
  The professor is right that the *phenomenon* works without explicit beliefs, but Lewis was right that the *logic* requires epistemic transparency. The dispositional story is a psychological implementation of Lewis's logical structure. It's a convention in effect, but the common knowledge isn't redundant; it's just relocated from beliefs to the knowledge of dispositions. Ultimately, the hypothetical shows that Lewis's conditions are sufficient but perhaps not necessary, provided the dispositions are sufficiently transparent to guarantee coordination.
