  1.  **Operational Instantiation Clause:** The item must correspond to a physical state or parameter in the system's transition function. This keeps the thermostat setting (1) and price falling (4) as real causes because they are physical parameters triggering mechanisms, while excluding the thermostat's "belief" (1) and the market's "decision" (4) because those are semantic ascriptions onto those parameters, not the parameters themselves.
