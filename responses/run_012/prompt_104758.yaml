  1. Strict impartialism (2) contradicts exempting high-cost sacrifices (5), forcing you to either accept extreme demandingness or grant personal projects extra moral weight. Abandoning strict impartialism saves your intuitions but costs you the theoretical elegance of classical consequentialism.
  2. Defining obligation via blameworthiness (3) while denying a sharp threshold (6) generates a sorites paradox, as binary blame cannot emerge from a seamless continuum without a specific cutoff point. You must either accept a vague threshold or admit blameworthiness comes in degrees, which complicates your deontic categories.
  3. Distinguishing the mandatory drowning child rescue (4) from the optional half-income donation (5) requires a normative line that your continuum view (6) explicitly forbids. Adopting a "reasonable cost" principle resolves this but forces you to retract your claim that there is no boundary between duty and supererogation.
  4. Affirming supererogation (1) alongside impartialism (2) leaves you unable to explain why agents are permitted to favor themselves without violating equal consideration. The cheapest fix is an agent-centered prerogative, but this concedes that impartialism is not the whole story of morality.
  5. Tying obligation strictly to blameworthiness (3) risks collapsing normative force into reactive attitudes, making obligation dependent on whether we actually blame people. You should decouple these notions, costing you the tidy analysis but preserving the objectivity of moral requirements.
