  I'm a third-year grad student and I've been asked to write up a short "philosophical profile" for a seminar on ethics and demandingness — basically lay out where I stand so the others can take shots at it — and I want to run the package past you first to see if it actually hangs together before I present it and get torn apart. Roughly, here's what I hold. (1) Supererogation is real: the soldier who throws himself on the grenade and the woman who gives a kidney to a stranger do something morally better than they had to, and neither is blameworthy for having not done it. (2) I'm an impartialist — from the moral point of view my own interests and projects get no extra weight just because they're mine; everyone counts equally. (3) I think an act is morally required just when you'd be blameworthy for omitting it, so "required" and "blameworthy-to-skip" are more or less the same thing. (4) I think you really do have to wade in and save the drowning child even though it ruins your suit — that one isn't optional. (5) But I don't think anyone is obligated to give away so much that giving more would cost them as much as it helps others, so the person who hands over half their income is admirable but not duty-bound. (6) And I don't think there's any sharp threshold between the required and the merely good — it's a continuum of cost and benefit, not a line you cross.

