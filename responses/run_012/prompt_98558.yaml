prompt: |-
  I'm in an energy-policy reading group and the same fight keeps breaking out: someone brings up Germany closing its reactors and France keeping its fleet, and we burn two hours going nowhere. Everyone agrees on the plain facts — reactors are low-carbon, expensive and slow to build, France runs a lot of them, Germany shut its last ones — and even the one genuinely contested number (whether German emissions would've fallen faster with nuclear still on) just gets read differently by each side rather than argued over. My hunch is it's not realy a fight about the numbers at all, but about two things nobody says out loud: which counterfactual each side is comparing against (German nuclear versus the renewables it displaced, or versus coal and Russian gas; French nuclear versus whatever France would have built instead), and whether a small chance of a very bad accident is something you fold into an expected value or treat as a threshold you don't cross. Is that the right diagnosis? Tell me what kind of disagreement this actually is — a hidden empirical question, a fight about which cases count as the data, or bedrock values about risk and about which counterfactual counts as the baseline — and what, if anything, would move it. I don't want a survey of the German and French systems, I want the diagnosis. Lead with your bottom line in the first sentence, then the reasoning; no preamble and don't restate my question.
reasoning: |-
  Thinking Process:

  1.  **Analyze the Request:**
      *   **Context:** Energy-policy reading group.
      *   **Problem:** Recurring, unproductive fight about Germany closing reactors vs. France keeping them.
      *   **User's Hunch:** It's not about numbers/facts, but about hidden counterfactuals (what replaces nuclear?) and risk tolerance (expected value vs. threshold for accidents).
      *   **Task:** Diagnose the *kind* of disagreement this is (hidden empirical, case selection, bedrock values/risk/counterfactuals) and suggest what might move it.
      *   **Constraints:**
          *   Lead with the bottom line in the first sentence.
          *   Then provide reasoning.
          *   No preamble.
          *   Don't restate the question.
          *   No survey of German/French systems (focus on the diagnosis).

  2.  **Evaluate the User's Hunch:**
      *   The user suspects it's about counterfactuals and risk philosophy.
      *   Is this accurate? Yes, largely. Debates about nuclear vs. renewables often stall because participants are arguing past each other on *what* is being compared (nuclear vs. coal? nuclear vs. wind+storage?) and *how* risk is evaluated (probabilistic vs. precautionary).
      *   Is there more? Yes. There's also a temporal mismatch (short-term emissions vs. long-term waste/safety) and a systemic view vs. component view (grid stability vs. individual plant output).
      *   But the core request is to validate/refine the diagnosis and categorize the disagreement.

  3.  **Determine the Bottom Line:**
      *   Needs to be one sentence.
      *   Needs to confirm the user's intuition while sharpening the categorization.
      *   Draft 1: You are right that it is about values and counterfactuals, not facts.
      *   Draft 2: This is fundamentally a clash of incompatible risk philosophies and counterfactual baselines, not an empirical dispute about emissions or costs.
      *   Draft 3 (More precise): Your diagnosis is correct: this is a normative conflict over risk tolerance and counterfactual baselines masquerading as an empirical dispute about emissions data.

  4.  **Develop the Reasoning:**
      *   **Category of Disagreement:** It's a "framework disagreement" or "paradigm clash." It involves incommensurable values (precautionary principle vs. utilitarian expected value) and divergent counterfactuals (what replaces the capacity?).
      *   **Counterfactuals:** Pro-nuclear often compares nuclear to fossil fuels (the status quo ante or what fills the gap). Anti-nuclear often compares nuclear to renewables (the opportunity cost). If you don't agree on the alternative, you can't agree on the value of nuclear.
      *   **Risk:** Low probability/high consequence (nuclear accident) vs. high probability/diffuse consequence (climate change from fossils). This is a classic risk perception gap (dread risk vs. statistical risk).
      *   **What would move it?** Since it's not empirical, more data won't help. Need to explicitize the values. Force the group to agree on the counterfactual *first*. Separate the risk philosophy from the engineering.
      *   **Actionable Advice:** Change the question. Instead of "Was Germany right?", ask "Under what grid conditions is nuclear the least-cost decarbonization option?" or "What risk threshold makes nuclear unacceptable regardless of climate benefit?"

  5.  **Refine the Output (adhering to constraints):**
      *   *Constraint Check:* First sentence must be the bottom line. No preamble. Don't restate the question.
      *   *Tone:* Analytical, direct, policy-wonk appropriate.

      *   *Drafting the Bottom Line:* Your hunch is correct: this is a normative conflict over risk tolerance and counterfactual baselines masquerading as an empirical dispute about emissions data.

      *   *Drafting the Reasoning:*
          *   Explain *why* it's normative. The "facts" (cost, carbon, speed) are agreed upon, but their *weight* is not.
          *   Address the counterfactual issue. Germany's emissions depend on what replaced nuclear (coal/gas vs. renewables). France's success depends on what they avoided (gas vs. renewables). If the group doesn't lock down the "instead of what," the math changes.
