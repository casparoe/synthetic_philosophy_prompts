      *   *Revised Bottom Line:* Your diagnosis is correct: this is a normative conflict over risk tolerance and counterfactual baselines masquerading as an empirical dispute about emissions data.
      *   *Reasoning:* Expand on the "incommensurable frameworks." One side optimizes for carbon tonnage (utilitarian), the other for systemic risk thresholds (deontological/precautionary). The counterfactual problem is about opportunity cost vs. replacement fuel. To move it, the group must stipulate the counterfactual explicitly before discussing outcomes and separate the climate risk calculus from the nuclear safety calculus.

      *   *Wait, one more check:* The user asked "Tell me what kind of disagreement this actually is — a hidden empirical question, a fight about which cases count as the data, or bedrock values..." I should explicitly use one of these categories or clarify the mix.
