answer: |-
  Your hunch is correct: this is a bedrock values disagreement about risk tolerance and counterfactual baselines that is being misidentified as an empirical dispute.

  The empirical data is settled, but the weight assigned to different risks is axiomatic rather than provable: one side optimizes for expected value (statistical deaths per TWh and tons of CO2), while the other applies a precautionary principle to low-probability, high-consequence tail risks. The counterfactual dispute is actually a disagreement over opportunity cost: pro-nuclear participants assume nuclear capacity displaces fossil fuels, whereas anti-nuclear participants assume the same capital and grid capacity would have been deployed as renewables instead. To move the discussion, the group must stop debating outcomes and start debating premises by forcing explicit agreement on the replacement scenario before analyzing emissions, and by separating the climate risk calculus from the nuclear safety calculus to reveal where the actual value clash lies.
