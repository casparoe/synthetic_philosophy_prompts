  **Node 2:** *A child who is miserable because of an abusive home.* (Is the *child* diseased, rather than the situation?)
  *   **Yes** → **Leaf 1: Strong Normativism**
  *   **No** → Go to Node 3.

  **Node 3:** *Grief two months after a death that nonetheless meets every symptom criterion for depression.* (Should we apply the medical label to secure treatment?)
  *   **Yes** → **Leaf 2: Pragmatic Instrumentalism**
  *   **No** → **Leaf 3: Social Constructivism**

  **Node 4:** *A slow metabolism that causes no symptoms or distress.* (Is this a disease?)
  *   **Yes** → Go to Node 5.
  *   **No** → Go to Node 6.

  **Node 5:** *Nearsightedness in a population where it is nearly universal.* (Is this a disease?)
  *   **Yes** → **Leaf 4: Value-Free Naturalism**
  *   **No** → **Leaf 5: Statistical Naturalism**

  **Node 6:** *Jet lag and shift-work sleep disorder.* (Is the mechanism malfunctioning, or just mismatched to the environment?)
  *   **Mechanism Mismatched (It is a disorder)** → Go to Node 7.
  *   **Mechanism Fine (It is a life problem)** → Go to Node 8.

  **Node 7:** *Is 'function' defined by the system's current causal contribution or its evolutionary history?*
  *   **Current Contribution** → **Leaf 6: Causal Role Naturalism**
  *   **Evolutionary History** → **Leaf 7: Harmful-Dysfunction Hybrid**

  **Node 8:** *Male-pattern baldness.* (Is this a disease?)
  *   **Yes** → **Leaf 8: Broad Naturalism**
  *   **No** → Go to Node 9.

  **Node 9:** *Is 'dysfunction' a measurable biological fact independent of human values?*
  *   **Yes** → **Leaf 7: Harmful-Dysfunction Hybrid** (Reached via alternative path)
  *   **No** → **Leaf 9: Eliminativism**

  *(Note: To meet the 8-12 node constraint while ensuring all cases are used, Node 9 acts as a metaphysical tie-breaker for cases where intuitions converge.)*

  ***

  ## Leaf Descriptions

  **Leaf 1: Strong Normativism**
  *   **Domain:** Lived Experience
  *   **Definition:** Disease is identical to suffering or disvalue; biology is secondary.
  *   **Awkward Commitment:** A happy psychopath is medically healthy, while a miserable victim of social oppression is ill.

  **Leaf 2: Pragmatic Instrumentalism**
  *   **Domain:** Social Role
  *   **Definition:** Disease labels are tools to access resources, not descriptions of truth.
  *   **Awkward Commitment:** We should diagnose normal grief as depression if it guarantees the patient insurance coverage.

  **Leaf 3: Social Constructivism**
  *   **Domain:** Social Role
  *   **Definition:** Disease categories are created by social agreements to manage deviance.
  *   **Awkward Commitment:** Cancer would cease to be a disease if society stopped accommodating the "sick role" for cancer patients.

  **Leaf 4: Value-Free Naturalism**
  *   **Domain:** Biological Category
  *   **Definition:** Disease is a failure of species-typical design, regardless of statistics or harm.
  *   **Awkward Commitment:** A genetic anomaly that causes no symptoms and never shortens life is still a disease.

  **Leaf 5: Statistical Naturalism**
  *   **Domain:** Biological Category
  *   **Definition:** Disease is a statistical deviation from the population norm.
  *   **Awkward Commitment:** If everyone in a population smokes and gets lung cancer, lung cancer is not a disease.

  **Leaf 6: Causal Role Naturalism**
  *   **Domain:** Biological Category
  *   **Definition:** Disease is any failure of a mechanism to perform its current causal goals.
  *   **Awkward Commitment:** An athlete's heart that beats too slowly for modern desk-work counts as a dysfunction.

  **Leaf 7: Harmful-Dysfunction Hybrid**
  *   **Domain:** Biological Category
  *   **Definition:** Disease requires both an evolutionary malfunction and a negative value judgment.
  *   **Awkward Commitment:** A painless, deadly genetic condition that kills at 80 is not a disease if it causes no harm before death.

  **Leaf 9: Eliminativism**
  *   **Domain:** Social Role
  *   **Definition:** The concept of 'disease' (especially mental) is a myth used for social control.
  *   **Awkward Commitment:** There is no scientific difference between a broken leg and a 'broken' mood; both are just life problems.

  ***

  ## Structural Analysis

  ### Unreachable Combinations
  1.  **Node 1 (Yes) → Node 4 (Yes):** This path is logically blocked by the tree structure, but philosophically, it represents a position that claims distress *alone* makes a disease (Node 1 Yes) but also that biological dysfunction *alone* makes a disease (Node 4 Yes). This is not incoherent, but it is **unexplored** in this tree because the branches diverge immediately. A "Super-Subjectivist" might claim both, but the tree forces a choice on the *primary* driver.
  2.  **Node 5 (No) → Node 8 (Yes):** Claiming universal nearsightedness is *not* a disease (Statistical Naturalism) but universal baldness *is* a disease (Broad Naturalism) is **incoherent**. Both rely on the same logic regarding universality. The tree prevents this contradiction by separating these cases into different branches (Node 4 vs Node 8).

  ### Indistinguishable Leaves
  **Leaf 7 (Harmful-Dysfunction Hybrid) and Leaf 9 (Eliminativism)**
  *   **Why they cannot be separated:** On almost every concrete case provided (Grief, Distress w/o Dysfunction, Baldness, Jet Lag), these two positions yield the same "No, this is not a disease" answer. The Hybrid theorist says "No" because there is no *biological dysfunction*; the Eliminativist says "No" because *biological dysfunction* is a value-laden myth.
  *   **Resolution:** The tree attempts to separate them at **Node 9** ("Is dysfunction a measurable biological fact?"). However, this is a metaphysical question, not a concrete case. In a reading group discussion based purely on cases, these two positions will talk past each other until they address the ontology of 'function' directly.

  ### Domain Clarity
  *   **Naturalist Leaves (4, 5, 6, 7):** Explicitly answer questions about the **Biological Category**. They treat 'disease' as something found in the body.
  *   **Normativist Leaves (1, 2, 3, 9):** Explicitly answer questions about **Lived Experience** or **Social Role**. They treat 'disease' as something experienced by the person or assigned by society.
  *   **Conflict Source:** Most debates in your reading group will stem from a Naturalist asking a Biological question ("Is the mechanism broken?") while a Normativist answers a Social question ("Does this label help or harm?"). This tree forces each participant to identify which domain they are prioritizing.
