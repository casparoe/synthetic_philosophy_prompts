  Here is a breakdown of the philosophical and mathematical stakes, tailored for your scene.

  ### The Protective Intent of the Axioms

  Before we choose a solution, we must understand what each rule is trying to safeguard. Think of these not as mathematical constraints, but as moral intuitions formalized.

  *   **Pareto Optimality:** This protects against waste. It insists that if the sisters can make one better off without harming the other, they *must*. It is the axiom of efficiency; to violate it is to leave value on the table out of spite.
  *   **Symmetry:** This protects against bias. If the sisters' positions are identical (same utility functions, same disagreement point), the solution must be identical. It is fairness as impartiality.
  *   **Invariance (Scale/Location):** This protects against measurement artifacts. Utility is not money; it is a ranking. If we measure Sister A's satisfaction in "dollars" and Sister B's in "euros," or if we shift the zero-point of their happiness, the fairness of the deal shouldn't change. It ensures the solution depends on preferences, not the units we use to describe them.
  *   **Independence of Irrelevant Alternatives (IIA):** This protects consistency. If the sisters agree on a deal from a menu of options, removing an option neither of them would have chosen shouldn't change their agreement. It insists that fairness is local to the chosen outcome, not distracted by distant possibilities.
  *   **Individual Monotonicity:** This protects against punishment by progress. If the business becomes more valuable (the feasible set expands) and Sister A's maximum possible potential doesn't decrease, Sister A's final share should not fall. It asserts that new opportunities should not weaken a player's bargaining position.

  ### The Core Conflict: Local Trade-offs vs. Global Potential

  The choice between Nash and Kalai–Smorodinsky is not merely a technical adjustment; it is a disagreement about what *anchors* fairness.

  The Nash solution anchors fairness in the **local geometry of the trade-off**. It asks: "At the point of agreement, are the marginal gains balanced such that the product of our improvements is maximized?" It treats the negotiation as a search for the most efficient exchange rate at the margin. Because it focuses only on the shape of the frontier near the solution, it satisfies IIA. However, this local focus makes it blind to the global structure of the set.

  The Kalai–Smorodinsky (KS) solution anchors fairness in the **global structure of potential**. It asks: "What fraction of our best-case scenarios are we each achieving?" It draws a line from the disagreement point to the "ideal point" (where each gets their maximum possible utility) and finds where that line hits the feasible boundary. It satisfies Individual Monotonicity because if the ideal point moves out (the set expands), the line stretches, and (usually) both parties ride that line outward. However, to do this, it must look at the "ideal point," which is often an unattainable fantasy on the far edge of the graph. This violates IIA: adding a distant, unchosen option changes the ideal point, which changes the slope of the line, which changes the agreement *here*.

  You cannot have both. A theorem by Roth (1979) proves that no solution can satisfy Pareto optimality, Symmetry, Scale Invariance, IIA, *and* Individual Monotonicity simultaneously. You must sacrifice either the consistency of choice (IIA) or the guarantee that progress won't hurt you (Monotonicity).

  ### Why Nash Can Punish Progress (A Numerical Intuition)

  You asked for a concrete example of how Nash violates monotonicity. Imagine the feasible set is a graph where the horizontal axis is Sister A's utility and the vertical is Sister B's. The disagreement point is $(0,0)$.

  1.  **Scenario 1:** The feasible frontier is a straight line from $(1,0)$ to $(0,1)$. The Nash solution maximizes the area of the rectangle under the curve ($x \cdot y$). The maximum is at the midpoint, **$(0.5, 0.5)$**. Sister A gets 0.5.
  2.  **Scenario 2:** The business improves for Sister B. We expand the feasible set. Sister A's maximum possible utility is still 1 (the point $(1,0)$ exists). Sister B's maximum is still 1 (the point $(0,1)$ exists). But we add a "bulge" to the frontier in the middle that favors Sister B. Imagine the frontier now bends outward significantly near Sister B's axis.
  3.  **The Shift:** The Nash solution looks for the rectangle with the largest area. If the new bulge allows a rectangle that is slightly narrower (less for A) but much taller (more for B) to have a larger total area than the square, Nash will slide the agreement point to the left.
  4.  **The Result:** It is mathematically possible to construct this bulge such that the new Nash point is, say, **$(0.45, 0.7)$**. Sister A's absolute share has dropped from 0.5 to 0.45, even though her *maximum possible* share (her ideal point) remained at 1. The expansion of the set changed the *marginal rate of substitution*—it made Sister B's utility "cheaper" to buy in terms of Sister A's concessions—so Nash sacrificed Sister A's absolute gain to maximize the joint product.

  ### The Legitimacy of the Ideal Point

  This is the most philosophically contested element of the Kalai–Smorodinsky solution.

  **The Critique:** The ideal point is jointly unattainable. It represents a world where Sister A gets all the land *and* Sister B gets all the cash, which is impossible. Why should a fair division be anchored to a fantasy? Furthermore, the ideal point shifts if the *disagreement point* shifts. If the father's will changes such that the sisters start with less, their "ideal" gains shrink, altering the proportional split even if the business itself hasn't changed. Critics argue this makes the solution sensitive to threats (the disagreement point) in a way that distorts fairness.

  **The Defense:** Proponents argue the ideal point is not a fantasy of outcome, but a measure of **bargaining power**. It answers the question: "How much *could* you have won if the other person didn't matter?" Fairness, in this view, is about equalizing the satisfaction relative to one's potential. If Sister A could have won 100 units but settles for 50, and Sister B could have won 10 units but settles for 5, they have both conceded 50% of their potential. KS argues this proportional concession is fairer than Nash's absolute product maximization.

  *Note: This is a normative disagreement, not a mathematical one. Economists disagree on whether "equal proportional sacrifice" is a valid metric of justice.*

  ### Interpersonal Comparisons and Scale Invariance

  Does Kalai–Smorodinsky sneak in interpersonal comparisons of utility?

  Technically, no. Scale invariance ensures that if we double Sister A's utility scale, her "proportional gain" remains the same (both numerator and double). The ratio is internal to each sister.

  However, philosophically, **yes**. By insisting that a 50% gain for Sister A is *equivalent* to a 50% gain for Sister B, the KS solution imposes a common currency of "satisfaction." It assumes that the *meaning* of gaining half your potential is the same for both people. Nash does this too, but more quietly: it assumes that a unit of utility gain for A is tradable for a unit of utility gain for B at the margin. KS makes this comparison explicit via the ideal point. If your sisters have vastly different emotional capacities (one is easily satisfied, the other insatiable), KS treats their proportional gains as equal moral weights, which some philosophers argue is a hidden interpersonal comparison.

  ### The Problem of Non-Convexity

  This is a practical issue for your novel. Axiomatic theory usually assumes the feasible set is **convex** (you can mix any two deals to get a third valid deal). In business, assets are often "lumpy." You can split the cash, but you cannot split the factory in half without destroying its value.

  *   **Nash:** Handles non-convexity reasonably well. It simply finds the point on the boundary that maximizes the product. There might be multiple such points, but a solution usually exists.
  *   **Kalai–Smorodinsky:** Has a technical failure mode here. The solution lies on the straight line from disagreement to ideal. If the feasible set is non-convex (has a "bite" taken out of it), that line might pass through the "hole." The exact proportional point might be **infeasible**.
  *   **The Fix:** The standard adjustment is to take the furthest feasible point on that ray. But this breaks the strict "equal proportion" rule and weakens the theoretical elegance. For a novelist, this is a potent detail: the Land Sister's theory of fairness might literally point to a deal that cannot be signed.

  ### What Your Sisters Are Really Disagreeing About

  When one sister argues for the Nash solution and the other for Kalai–Smorodinsky, they are not just arguing over numbers; they are arguing over the nature of the relationship. The sister favoring Nash views the negotiation as a **transaction**: she wants to maximize the value created *now*, accepting that her share depends on the local trade-offs and marginal efficiencies. The sister favoring Kalai–Smorodinsky views the negotiation as a **division of an estate**: she wants her share to reflect her proportional claim to the family's total potential, insisting that new opportunities for her sister should not come at the cost of her own absolute standing. One is bargaining for efficiency; the other is bargaining for recognition.
