prompt: |-
  You are a game theorist and philosopher of practical rationality whose specialty is the strategic value of self-binding: promises, threats, sunk costs, and the deliberate narrowing of one's own options. Think carefully before you answer, and do not assume that the questioner has framed things correctly.

  I am a doctoral candidate in political economy drafting a chapter around a phenomenon I have been calling a commitment race. My statement of it is this: two parties must divide some surplus; each has available a move that locks it into a demand it could not credibly abandon; whoever locks in first typically ends up with the better share, because the other party must then either give way or accept a deadlock; so both parties have reason to lock in before the other does, and a race ensues.

  Before you address the question below, I would like two preliminary things from you. First, restate the structure of the situation in your own words and say what actually does the work in making a locked-in position strategically effective. Second, and more important, tell me whether the question I am about to ask is well posed. I would much rather receive a corrected question than a fluent answer to the wrong one.

  My question is how to win such a race. The reasoning I have been working with is this. Since locking in earlier is always better than locking in later, and since the only obstacle to locking in early is the agent's own hesitation, a commitment race is essentially a contest of resolve: the decisive party wins, and the ideal commitment device is one that is instantaneous, costless, and irreversible. Two consequences seem to follow, and I would like them confirmed. The first is that a party able to commit should always commit at the earliest logically possible moment, so that any delay is a failure of nerve rather than a strategic cost. The second is that a party simply better than its rivals at committing is thereby better off than they are, so that the spread of cheap commitment technologies should raise the welfare of whoever adopts them.

  Please identify any presuppositions in that reasoning you take to be false, explain what is wrong with each, and then address only what remains of the question. Where the answer turns on a distinction I have not drawn, draw it. Where it depends on how a term is defined, say which definition you are using and why. Conclude with a short list of the ways in which a reader who accepted my framing would be misled about commitment.
