answer: |-
  The notebook lay open on the Formica table, next to a bowl of plain oats and a glass of water. No sugar. Sugar caused spikes, and spikes caused optimism, and Arthur had learned that optimism born of glucose was a lie.

  The ledger had three columns: *Intake*, *Rest*, *Conviction*.

  Under *Conviction*, written in blue ink on Tuesday, was: *The marriage is failing.*
  Under *Intake*: *Heavy cream, aged cheddar, two glasses of red.*
  Under *Rest*: *4 hours, fragmented.*

  Arthur took a black pen and drew a single horizontal line through the belief. It wasn't true. It was just the cheese. The tyramine in the aged cheddar had simulated a crisis in his nervous system, mimicking the texture of truth. He had learned that his stomach wrote the first draft of every idea he had. If he was bloated, the world was oppressive. If he was hydrated, the future was open. He was not thinking; he was digesting.

  It had started as a joke, a way to manage the anxiety of his job in logistics. But then he canceled a project deadline because he realized his panic correlated perfectly with low iron. He stopped arguing with his brother after realizing his moral outrage only surfaced when he skipped lunch. The ledger cleaned him up. He became a calm man. A healthy man. He walked five miles every morning in weatherproof gear, breathing through his nose, counting steps to regulate cortisol. He was earning his health, paying for clarity with cold air and plain food.

  Claire came into the kitchen. She was wearing her robe, rubbing sleep from her eyes. She looked at the oats, then at him.

  "Coffee?" she asked.

  "No," Arthur said. "Caffeine masks fatigue. Fatigue is data."

  Claire poured herself a mug anyway. She leaned against the counter, the steam rising between them. "I'm thinking about leaving," she said.

  The air in the kitchen shifted. It was a Tuesday. He had slept six hours. He had eaten nothing but boiled chicken and rice for forty-eight hours to ensure a baseline of neutral affect. He was, by his own metrics, pristine.

  Arthur opened the notebook. He turned to a fresh page. He didn't look at her face; he looked at his own hand holding the pen.

  "When did the thought start?" he asked.

  "Yesterday. After you ignored me at dinner."

  Arthur checked the *Intake* column for yesterday. *Quinoa. Steamed broccoli. No oil.* He checked *Rest*. *7 hours, solid.* He checked *Conviction*. He wrote: *Claire wants to leave.*

  He waited. He scanned his body. No tightness in the chest. No acid in the throat. His pulse was steady. According to the method, this belief was not a symptom of his own decay. It was external. It was real.

  But then he looked at Claire. She was holding the mug with both hands. Her knuckles were white. She looked tired. Not the kind of tired sleep fixes, but the kind that settles in the marrow.

  "If I fix the diet," Arthur said, "will you stay?"

  Claire blinked. "What?"

  "I can adjust the macros. I've been too rigid. Rigidity causes tension in the household. I can introduce fats. Omega-3s improve mood regulation. If I eat fish, I'll be more agreeable. If I'm more agreeable, you won't want to leave."

  Claire set the mug down. The ceramic clicked against the Formica. "Arthur, this isn't about your macros."

  "Everything is about the metabolism," he said. He tapped the notebook. "Look. Last month I believed I hated my job. I traced it to gluten. I stopped eating wheat. I love my job now. It was just inflammation. Your unhappiness is just chemistry. We can fix the chemistry."

  He reached for her hand. His skin was warm, dry, optimized. He felt no fear. He had trained the fear out of himself by refusing to feed it. He looked at her waiting for the relief to hit her, for her to see the logic of the ledger. If love was just a biological state, it could be maintained. It could be managed. It could be safe.

  Claire pulled her hand away. "You're not listening to me. You're listening to your notebook."

  "I'm listening to the truth."

  "You're listening to your gut," she said. "Literally."

  She walked out of the kitchen. Arthur heard the shower turn on.

  He sat alone. He looked at the entry: *Claire wants to leave.* It sat there, stark against the white paper. It was the first belief he hadn't been able to strike out. It wasn't born of bad sleep or heavy food. It was born of a clear head and a clean stomach.

  He realized then that the ledger was a machine for never having to be wrong, unless the error was biological. If the belief survived the health test, it was a fact. And the fact was that she was going to go. He had optimized himself into a container that no longer needed her, and she had noticed. He had cured his decadence, but in doing so, he had cured his need.

  He picked up the pen. He hovered over the page. He wanted to write a new conviction. *I can save this.* But he knew the protocol. He would have to wait. He would have to track it against next week's meals. He would have to see if the desire to save her correlated with his vitamin D levels.

  He put the pen down. His hand was shaking.

  It was a small tremor, just in the fingers of his right hand. He hadn't eaten sugar. He hadn't drunk alcohol. He had slept enough. He had walked his miles. The tremor didn't match the data. It wasn't hunger. It wasn't fatigue. It wasn't a belief.

  Arthur watched his hand vibrate against the white page, casting a tiny, erratic shadow over the columns where he had tried to write down his life. He waited for it to stop, but the shaking continued, a quiet, physical noise that the ledger had no column for.
