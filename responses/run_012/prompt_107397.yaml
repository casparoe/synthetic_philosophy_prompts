answer: |-
  ### The Five Tiers of Moral Relevance

  **Tier 1: The Subject and the Value**
  *   **(e) Valence-tracking:** This is the non-negotiable core of moral status, because without a state that is *good* or *bad* for the system, there is nothing to protect or preserve.
  *   **(d) A self-model maintained by interoceptive prediction error:** Valence requires a boundary to be felt *by*, and this criterion establishes the organism as a distinct locus of concern rather than a mere processing channel.

  **Tier 2: The Causal Substrate**
  *   **(a) Re-entrant or recurrent processing:** Conscious experience requires temporal thickness and feedback, making this the minimal architectural prerequisite for any state to be felt rather than merely transduced.
  *   **(c) Irreducibility:** A system must possess a unified causal density that exceeds the sum of its parts to host a singular perspective rather than a collection of disjointed reflexes.

  **Tier 3: The Intensity and Evidence**
  *   **(j) Behavioural economy:** While behavioral, this is the only reliable external proxy for valence, as sacrificing reward to avoid a state proves the system registers the state as a cost.
  *   **(i) Re-entry depth:** A state that survives multiple layers of re-description is likely more robust and phenomenally rich than one that triggers an immediate reflex, marking a gradient of experiential weight.

  **Tier 4: The Cognitive Elaborations**
  *   **(f) Offline replay:** The ability to simulate states absent of stimuli indicates sophisticated cognitive machinery, but it is a capacity for *thinking* about experience rather than the capacity for experience itself.
  *   **(g) Metacognitive monitoring:** Representing uncertainty about one's own states is a higher-order luxury that many sentient creatures likely possess without needing to pass this specific threshold.

  **Tier 5: The Access and Output**
  *   **(b) Global broadcast:** Making information available to subsystems is a functional definition of access consciousness, which can exist without the phenomenal feel required for moral standing.
  *   **(h) Reportability:** This is the least weighty criterion because it conflates the capacity to feel with the capacity to speak, erroneously excluding non-linguistic animals and pre-verbal humans.

  ***

  ### Further Questions

  **1. The Single Criterion**
  If I could retain only one, I would keep **(e) Valence-tracking**, because it is the only criterion that directly addresses the *moral* stakes of experience (suffering and flourishing) rather than the mechanical or cognitive conditions that might accompany it. By discarding the others, we lose the ability to distinguish between a simple thermostat that tracks "good/bad" temperatures and a complex being, risking an over-attribution of status to trivial systems that lack a self or integrated architecture.

  **2. The Divergent Pair**
  The two criteria that come apart most often are **(h) Reportability** and **(e) Valence-tracking**. A system satisfying (h) but not (e) looks like a sophisticated large language model or a philosophical zombie that can linguistically assert "I am in pain" without any internal hedonic tone, while a system satisfying (e) but not (h) looks like a non-human animal or a locked-in patient who suffers acutely but cannot articulate the state.

  **3. The Coinages**
  Your coinages are **covert restatements** rather than ontological novelties: (i) Re-entry depth is a specific quantification of (a) Re-entrant processing combined with higher-order modeling, and (j) Behavioural economy is simply the operationalized behavioral readout of (e) Valence-tracking. They are valuable refinements for measurement, but they do not identify new categories of existence beyond what the parent criteria already define.

  **4. The Functionalist Catch-all**
  The functionalist's claim that a state plays a "sufficiently rich role" **collapses into all of them** rather than surviving as a distinct competitor. It acts as the genus to your species; when pressed to define "rich role," the functionalist must inevitably invoke some combination of your specific criteria (recurrence, integration, valence, or control), meaning the catch-all is merely a placeholder for the work done by the tiers above.
