  2.  **Immunity (Clause 2):** **Warning.** Schoch claims archaeologists "refuse to listen." This borders on the "Keeper of the Secret" fallacy. However, he engages in peer-reviewed geological debates, unlike Velikovsky. He has not fully immunized his claim; he admits the archaeological evidence is missing.
