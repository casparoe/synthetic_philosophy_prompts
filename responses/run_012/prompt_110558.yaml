  You have independently rediscovered several core concepts from the philosophy of science (specifically the work of Imre Lakatos and Karl Popper) without the jargon. Your intuition about "digging new holes" versus "re-reading old texts" is the most powerful tool you have. It cuts through the noise of credentials, consensus, and emotion.

  Here is the principle derived from your verdicts, the verdict you must surrender, the answer to your meta-questions, and the judgment on the Sphinx.

  ### I. The Principle: Progressive Empirical Engagement

  A claim or research program is **Scientific** if it seeks to resolve anomalies by generating *new* empirical constraints. It is **Pseudoscientific** if it resolves anomalies by adding *new* assumptions that immunize the core claim from empirical constraints.

  **Clause 1: The Direction of Effort (The "New Hole" Rule)**
  *   **Definition:** Legitimate inquiry prioritizes the discovery of *new* evidence that does not yet exist (predictions, new strata, new measurements). Pseudoscience prioritizes the re-interpretation of *existing* ambiguous evidence (texts, monuments, old data).
  *   **Forced by:** **Case 1 (Fomenko)** and **Case 5 (Wegener).** Fomenko re-reads chronicles to shrink time; Wegener predicted fossil matches in strata not yet fully correlated. Your gut knows Wegener is different because he pointed to a future discovery, while Fomenko points to a past conspiracy.

  **Clause 2: The Immunity Clause (The "Conspiracy" Rule)**
  *   **Definition:** A claim becomes pseudoscientific when its defenders explain away failed tests by attributing them to the *motives* of the testers (bias, conspiracy, suppression) rather than the *limits* of the test (instrument error, sample size), *indefinitely*.
  *   **Forced by:** **Case 6 (Cold Fusion).** You correctly split this. The initial error was scientific; the *sustained* blame of referees without new positive data turned the *movement* pseudoscientific. This clause captures the transition point.
  *   **Refinement:** This clause must allow for a "grace period." Legitimate science can blame instruments *once* while fixing them. Pseudoscience blames instruments *forever*.

  **Clause 3: The Ideological Tail (The "Payload" Rule)**
  *   **Definition:** A claim is suspect if it serves an external ideological need (nationalism, religion, racial superiority) more than an internal scientific need (explaining data). This is not a definition of pseudoscience, but a **heuristic marker**.
  *   **Forced by:** **Case 7 (Moundbuilders)** and **Case 8 (Flat Earth).** The Moundbuilder myth persisted not because of data, but because it served a political need (dispossession). This explains why your anger is highest in Case 8: the payload is most visible.

  **Exception Clause: The Speculation Safe Harbor**
  *   **Definition:** A claim is not pseudoscientific if it is explicitly framed as *hypothetical speculation* that admits its own unfalsifiability and does not demand the overthrow of existing paradigms without new data.
  *   **Forced by:** **Case 3 (Crick).** This saves Panspermia from being "pseudo," but as you will see below, it exiles it from "science."

