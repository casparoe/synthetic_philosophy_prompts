answer: |-
  (a) **Nuclear deterrence resting on mutually assured destruction: 2/10.**
  This mechanism prevents the actuality of sacrifice required for ethical renewal and threatens the total annihilation of the ethical substance (the state and its people) rather than its preservation.

  (b) **Multilateral peacekeeping missions authorized by the United Nations: 3/10.**
  While involving armed force, these missions presuppose a supranational authority over sovereign states, contradicting Hegel's view that states acknowledge no higher tribunal in international relations.

  (c) **Drone strikes by a state against non-state armed groups on foreign territory: 3/10.**
  This lacks the reciprocal recognition between sovereign states and minimizes the risk to the attacking citizens, undermining the ethical moment of sacrifice for the universal.

  (d) **Combat operations conducted by private military contractors on a state's behalf: 1/10.**
  Outsourcing violence to private interests commodifies war and severs the ethical bond of citizenship, reverting to the mercenary system Hegel explicitly rejects as corrosive to the state.

  (e) **Economic sanctions imposed to force a change of regime: 2/10.**
  Sanctions operate within the sphere of property and civil society interests rather than transcending them through the existential risk of battle and duty.

  (f) **A small state's defensive war against invasion: 9/10.**
  This affirms state sovereignty against external negation and demands citizens prioritize the universal existence of the state over private life and property.

  **Hardest Case for the Reading**
  The hardest case is **(a) nuclear deterrence**. Hegel's account relies on war being a survivable, renewing test of a state's vitality that preserves the ethical substance; MAD transforms war into an apocalyptic event that would destroy that substance entirely, rendering its purported ethical function logically impossible to realize.

  **Classification as "War"**
  Items **(c)** and **(e)** would fail to count as war in Hegel's strict sense. For Hegel, war is fundamentally a relation between *sovereign states*; conflict with non-state actors (c) is policing or criminal justice, and economic coercion (e) remains within the realm of civil society. What turns on this classification is the **suspension of right**: in true interstate war, specific rights (property, life) are contingent upon the state's survival, whereas in policing or sanctions, individuals retain inherent rights that the state must respect, meaning the violence or coercion is bound by domestic legal and moral standards rather than the exceptional ethics of sovereignty.
