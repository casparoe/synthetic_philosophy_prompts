      *   *7. Kantian/Team Reasoning:* I act as part of a "we".
          *   Status: Defensible. Rejects methodological individualism.
      *   *8. Civic-Republican/Assurance:* Voting sustains the regime.
          *   Status: Defensible. Focus on duty/system maintenance rather than outcome.
      *   *9. The Margin of Victory Reading:* Even if not pivotal, votes affect the mandate.
          *   Status: Substantive. A 5% win is different from a 0.1% win.

  4.  **Addressing the "Paradox of Voting" Ambiguity:**
