      *   **Conflict:** A social choice theorist colleague thinks this is statistically false (eye-roll). A philosophy of action friend thinks it's not a statistical claim. The user feels there's semantic ambiguity causing the disagreement.
      *   **Task:** Lay out the precise theses "Every vote counts" could express as a *menu* (not a defence of one).
      *   **Range:** Trivial to radical.
      *   **Specific Readings Required:**
          *   Literal arithmetical (ties/margins).
          *   Probabilistic (pivotality, probability of pivotality vs. probability of decisiveness given closeness).
          *   Expected-utility (instrumental efficacy).
          *   Decision-theoretic (act- vs. rule-consequentialist, causal vs. evidential).
          *   Expressive/Identity-based (meaning of act vs. causal upshot).
          *   Kantian/Team-reasoning (voting as a collective member).
          *   Assurance-game/Civic-republican.
          *   Others (live options).
      *   **Evaluation:** For each, state if it's a platitude, substantive/defensible, or straightforwardly false.
      *   **Application:** Identify which reading supports the speaker's use (closing the debate) and which vindicates the colleague's eye-roll.
      *   **Ambiguity Note:** Address the ambiguity of "the paradox of voting" (majority cycling vs. turnout).
      *   **Format:** Conceptual map, British English, no citations/reading list.

  2.  **Deconstruct the Phrase "Every Vote Counts":**
      *   The core tension is between *causal efficacy* (did it change the outcome?) and *moral/political significance* (does it matter that I did it?).
      *   The rational-choice critique hinges on $P \times B < C$ (Probability of pivotality $\times$ Benefit < Cost).
      *   The defence hinges on redefining $P$, $B$, or $C$, or rejecting the framework entirely.

  3.  **Drafting the Menu of Readings (Iterative Process):**

      *   *1. The Arithmetical Reading:* Literally, votes are units added to a tally.
          *   Status: Trivially true (platitude).
          *   Relevance: Doesn't solve the turnout puzzle.
      *   *2. The Strict Probabilistic Reading (Pivotality):* The chance of breaking a tie.
          *   Status: True but vanishingly small in large elections. Vindicates the eye-roll.
          *   Nuance: Distinguish ex-ante probability vs. conditional on closeness.
      *   *3. The Expected Utility Reading:* $EU = P \times B - C$.
          *   Status: If $P$ is tiny, $EU$ is negative. False as a motivation for rational egoists unless $B$ is infinite or $C$ is negative (duty).
      *   *4. Causal Decision Theory (CDT) vs. Evidential Decision Theory (EDT):*
