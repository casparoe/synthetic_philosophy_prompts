  ### Confidence and Uncertainty

  **Confidence Level:** High (85%).
  The distinction between private resentment and public address (Principle 1) and the Relational Veto (Principle 4) are robust and explain the majority of your data, particularly the difficult 6 vs. 7 pairing.

  **Point of Least Certainty:**
  The **Acknowledgment Clause in Principle 3**.
  I am least sure that "admitting the wrong but not making amends" (Case 7) is sufficient for *full* standing to *publicly condemn*. There is a strong intuition that moral authority requires restitution, not just confession. If you press me, I suspect Case 7 is the verdict most likely to crumble under theoretical pressure. It feels like a concession to the "right to be heard" that conflicts with the "authority to judge." If you must revise one verdict to make the theory more elegant, revise Case 7 to "Impaired Standing." This would unify Cases 1, 4, and 7 under a single "Unreformed Wrongdoer" constraint, leaving Case 6 as the unique "Relational Veto" exception.
