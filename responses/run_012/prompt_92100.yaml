  ### The case

  The "Liquid Containment Safety Act" requires that "any fixed vessel capable of holding more than 500 gallons of liquid must be registered with the State Inspector." The statute's title references "Safety," and its penalty provisions scale fines based on the "risk of structural failure and leakage," while a dedicated fund section allocates revenue to "remediation of property damage caused by containment breach." There is no legislative history available. A homeowner installs a 600-gallon rainwater cistern made of modern plastic to water their garden. The cistern is fixed, holds liquid, and exceeds the capacity threshold. At the time of enactment, the legislature was concerned with industrial chemical tanks rupturing and poisoning soil. Today, the primary risk associated with large residential water storage is not toxicity, but structural collapse during heavy storms causing downstream flooding.

  ### What each reading says

  The textualist reads the operative clause literally: the cistern is a "fixed vessel," it holds "liquid," and it exceeds "500 gallons." Because the text is unambiguous and contains no exception for non-toxic liquids, the textualist concludes the homeowner must register. The purposivist looks to the statute's structure and original mischief: the fines and fund allocations point to "structural failure" and "remediation" of hazardous leaks. Since rainwater is not hazardous and the original intent was industrial chemical safety, the purposivist concludes the statute does not apply. Purpose in continuance asks what best serves the underlying aim—containment safety and damage remediation—as the world now stands. Given modern climate patterns where residential water storage poses a genuine flood risk, the aim now encompasses the cistern. This view reaches the same outcome as textualism (register the tank), collapsing into the textualist result because the text's breadth accidentally aligns with the evolved purpose.

  ### What is doing the work

  The entire result hangs on the word "liquid." It is genuinely plain and genuinely over-inclusive; it covers both toxic chemicals and rainwater without ambiguity. If the statute had read "hazardous liquid" or "industrial fluid," the textualist would be forced to the narrower reading, and the conflict would vanish. A defender of the theory that comes out worst here—the purposivist—would attack the construction by arguing that the statute's structure (specifically the title "Safety Act" rather than "Hazard Act") was always broad enough to include flood risks, meaning their reading was too narrow even by original standards, or conversely, that "liquid" is a term of art implicitly limited by the penalty scheme's focus on toxicity.

  ### How my friend fights back

  "My job is not to guess whether the legislature was prescient about climate change or sloppy about chemistry; my job is to enforce the bargain they wrote. They chose the word 'liquid' instead of 'hazardous liquid,' and they chose 'any vessel' instead of 'industrial vessel.' If the purpose has evolved to cover rainwater, that is a reason for the legislature to amend the statute, not for me to pretend the text means what it says only when it matches my view of current policy."
