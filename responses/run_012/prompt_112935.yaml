answer: |-
  This analysis evaluates the "Standard Model" of moral uncertainty (Expected Choiceworthiness Maximization, or ECM), which posits that moral uncertainty is structurally identical to empirical uncertainty. Given your expertise, I will bypass introductory exegesis and focus on the structural vulnerabilities of the view, weighted according to your specific interest in the measurement problem.

  ### I. Internal Objections (Ranked Fatal to Awkward)
  *These objections accept the cognitivist and decision-theoretic framework but argue it fails on its own terms.*

  **1. The Intertheoretic Comparison Problem (Scale Indeterminacy)**
  *Rank: Fatal*
  This is the measurement problem you identified as most persuasive. Standard decision theory requires a common cardinal scale to calculate expectations. However, first-order moral theories do not present themselves with shared units or zero-points. Utilitarianism offers cardinal welfare; Kantianism offers binary permissions; Virtue Ethics offers aretaic rankings.
  *   **The Fatal Flaw:** To maximize expected choiceworthiness, one must normalize these scales. Proposals like *Variance Normalization* (MacAskill) or *Mean Normalization* render choiceworthiness relative to the *option set* under consideration. This violates the Independence of Irrelevant Alternatives (IIA). If the value of an act depends on which other acts are available for the sake of calculating variance, the theory ceases to be a standard decision procedure and becomes context-dependent in a way that standard empirical decision theory is not.
  *   **Verdict:** Without a metaphysical fact of intertheoretic comparability (which no theory supplies), the "common quantity" you posit is a fiction. The machinery cannot transfer because the inputs are incommensurable.

  **2. The Collapse Objection**
  *Rank: Fatal (Conditional on #1)*
  If the scale-indeterminacy problem is insoluble, ECM collapses into "My Favorite Theory" (MFT)—i.e., act according to the theory in which you have the highest credence.
  *   **The Fatal Flaw:** If we cannot weigh the *intensity* of values across theories, credences are the only weighting mechanism left. If $P(\text{Util}) = 0.51$ and $P(\text{Kant}) = 0.49$, and we cannot compare the magnitude of the utilitarian gain vs. the deontological violation, we must default to the probability winner.
  *   **Verdict:** If collapse is inevitable, the position loses its distinctiveness. It becomes merely first-order ethics with an epistemic filter. This contradicts your claim that the machinery transfers *without loss*; the loss is the ability to trade off intensity against probability.

  **3. Fanaticism (The Swamping Problem)**
  *Rank: Severe*
  A minuscule credence in a theory with lexical priorities or infinite value (e.g., a specific theological view or strong longtermism) can dominate the expected choiceworthiness calculation.
  *   **The Flaw:** Unlike empirical Pascal's Mugging, where we can often dismiss hypotheses as physically impossible, moral hypotheses cannot be ruled out *a priori* by a moral agent without begging the question. If you assign 0.0001 credence to a theory that says "Preventing extinction is infinitely valuable," ECM mandates you ignore all finite welfare concerns.
  *   **Verdict:** This renders the agent action-guidingly paralyzed or absurdly demanding. Defenders often resort to ad hoc credence caps, which violates Bayesian norms.

  **4. Theory Individuation (The Taxonomy Problem)**
  *Rank: Moderate/Severe*
  Expected choiceworthiness is sensitive to how theories are individuated. If "Utilitarianism" is split into "Act-Utilitarianism" and "Rule-Utilitarianism" (with split credences), the weighting shifts compared to treating them as a single bloc.
  *   **The Flaw:** There is no objective "theory space." The granularity of our taxonomy is accidental. If decision outcomes depend on whether we count two variants as one theory or two, the procedure is arbitrary.
  *   **Verdict:** Awkward but potentially patchable via clustering algorithms or similarity metrics, though no consensus exists.

  **5. Self-Undermining (The Regress)**
  *Rank: Moderate*
  If ECM is the correct meta-normative theory, what should one do if one assigns low credence to ECM itself?
  *   **The Flaw:** If you have 40% credence in ECM and 60% in MFT (My Favorite Theory), ECM says to maximize expected choiceworthiness (which includes weighting MFT). But MFT says "ignore uncertainty, just do what's right."
  *   **Verdict:** Defenders argue ECM is "robust" enough to absorb this, but it creates a recursive calculation problem that threatens to stall deliberation.

  ---

  ### II. External Objections (Ranked Fatal to Awkward)
  *These objections challenge the presuppositions required to run the model.*

  **1. The Nature of Moral Credences (Non-Cognitivism)**
  *Rank: Fatal (for Non-Cognitivists)*
  *   **The Objection:** If moral judgments are expressions of attitude (expressivism) or prescriptions (prescriptivism) rather than truth-apt beliefs, one cannot hold "credences" in them. You cannot have a probability for an imperative.
  *   **Verdict:** If non-cognitivism is true, the Standard Model is category-mistaken. However, since you are operating within a cognitivist framework, defenders dismiss this as irrelevant to the internal coherence of the model.

  **2. The Impossibility of Hedged Actions**
  *Rank: Moderate/Contextual*
  *   **The Objection:** ECM suggests "hedging" (e.g., doing something partially permissible to satisfy multiple theories). However, some actions are ruled out by *all* candidate theories (e.g., killing one to save five might be rejected by both strict Deontology and Negative Utilitarianism). Conversely, some compromises are rejected by all (e.g., a "partial murder").
  *   **Verdict:** This limits the domain of ECM. It shows the machinery doesn't transfer *universally*, only in cases where the option space allows for overlap. Defenders concede this but argue it applies to empirical uncertainty too (no hedge against certain death).

  ---

  ### III. Defender Concessions vs. Dismissals

  | Objection | Defenders (e.g., MacAskill, Sepielli) Concede | Defenders Dismiss as Misunderstanding |
  | :--- | :--- | :--- |
  | **Scale Indeterminacy** | Concede it is the **hardest technical problem**. Admit normalization is imperfect. | Dismiss the claim that it is *fatal*. Argue that *some* comparability is plausible (e.g., via "structural" similarities) or that we must act *as if* they are comparable. |
  | **Credences in Morals** | Concede non-cognitivists cannot use ECM. | Dismiss as external to the project. Assume "moral cognitivism" as a working hypothesis. |
  | **Fanaticism** | Concede it is a serious implication. | Dismiss the idea that it invalidates the theory; often bite the bullet (e.g., longtermists) or suggest credence thresholds are rational. |
  | **Collapse** | Deny it occurs *if* comparability holds. | Dismiss the claim that MFT is the default. Argue that intensity *does* matter (e.g., 51% credence in a trivial gain vs. 49% in avoiding catastrophe). |
  | **Ambiguity** | Concede moral probabilities are not frequencies. | Dismiss the relevance of Ellsberg-style ambiguity aversion. Argue rationality requires maximizing expectation even under ambiguity. |

  ---

  ### IV. Ambiguity vs. Risk: Does the Analogy Hold?

  You asked whether the analogy to unknown probabilities (ambiguity) rather than merely uncertain probabilities (risk) has force.

  *   **The Distinction:** In empirical risk (e.g., a coin toss), the probability distribution is known. In empirical ambiguity (e.g., an urn with unknown ratio of balls), it is not. Moral uncertainty is structurally closer to **ambiguity**. We do not know the "true" distribution of moral truth; we have epistemic credences over normative frameworks.
  *   **The Force of the Objection:** Standard decision theory (Savage) justifies Expected Utility Maximization under risk. Under ambiguity, rational agents often display ambiguity aversion (Ellsberg Paradox), preferring known risks to unknown uncertainties.
  *   **Assessment:** If moral uncertainty is ambiguity, the rational response might be **Maximin** (avoid the worst-case moral outcome) rather than **Expectation Maximization**.
  *   **Conclusion:** The analogy to empirical *risk* is a confusion. Moral uncertainty lacks the objective chance facts that ground empirical risk. If agents are rationally ambiguity-averse, the "transfer without loss" claim fails, because the normative rule changes from Maximization to Maximin (or similar). Defenders typically dismiss this, insisting that epistemic credences suffice for expectation calculations regardless of the source of uncertainty, but this is a contentious point in formal epistemology.

  ---

  ### V. The Collapse Question

  **Does any version survive without collapsing into "Do what one thinks most likely right"?**

  *   **Condition for Survival:** The model survives *only if* intertheoretic value comparisons are possible. You must be able to say, "The disvalue of a rights violation in Theory B is *greater than* the disvalue of a welfare loss in Theory A," independent of your credences.
  *   **Inevitability of Collapse:** If, as the Scale Indeterminacy objection suggests, there is no common currency, then intensity cannot be weighed. If intensity cannot be weighed, only probability remains. If only probability remains, ECM collapses into MFT (My Favorite Theory).
  *   **Defect or Sign?**
      *   **If Collapse is a Defect:** It shows ECM failed to solve the distinctive problem of moral uncertainty. It promised a way to trade off probability against moral importance but delivered only probability.
      *   **If Collapse is a Sign:** It suggests your opening claim was partially correct: moral uncertainty is *not* a distinctive practical problem. If the rational response to moral uncertainty is just "follow the theory you think most likely true," then we do not need a new decision theory; we just need standard epistemic norms applied to moral beliefs.
      *   **Synthesis:** The collapse is a **defect for ECM** (as a distinctive theory) but a **vindication of your skepticism** regarding the distinctiveness of the problem. However, note that even MFT under uncertainty is distinct from *certainty*. The distinctiveness lies not in the decision rule (Maximize), but in the input (Credences over Norms). But if the Scale Problem holds, the *machinery* does not transfer without loss, because the "common quantity" required for the transfer is missing.

  ### Summary Recommendation for Your Position

  Your intuition regarding **Scale Indeterminacy** is the strongest lever against the Standard Model.
  1.  **Rank it Fatal:** Without a solution to intertheoretic comparison, the math is undefined.
  2.  **Use it to Challenge "Without Loss":** The transfer of decision-theoretic machinery requires cardinal utility. Moral theories often provide only ordinal or binary rankings. Forcing them onto a cardinal scale requires normalization procedures that violate standard axioms (like IIA). Therefore, the machinery *does not* transfer without loss; it requires modification that breaks the analogy to empirical uncertainty.
  3.  **On Collapse:** If the Scale Problem stands, collapse into MFT is inevitable. You should argue this is not a defect of *rationality*, but a defect of the *Standard Model's* claim to distinctiveness. The "distinctive problem" dissolves because the tools to solve it (intertheoretic weighing) are unavailable.

  The Standard Model survives only by positing a metaphysical fact of comparability that no first-order theory acknowledges. Absent that, your skepticism is well-founded: moral uncertainty is epistemically distinctive, but practically, it may not support a decision theory distinct from maximizing expected truth of one's moral beliefs.
