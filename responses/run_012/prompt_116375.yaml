      *   *Let's go with:* The distortion can be corrected, but the correction changes the genre from "Celebratory History" to "Institutional Archaeology." The verdict is: Yes, it is possible, but it requires shifting the subject from the Association's *purpose* to the Association's *memory*.

  4.  **Drafting - Section by Section:**

