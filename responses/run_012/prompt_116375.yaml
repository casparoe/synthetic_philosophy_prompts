      *   *My Choice:* I will argue that the distortion *can* be corrected, but not by pretending we have the losers' files. It is corrected by treating the archive not as a window to the past, but as a wall built in the 1950s. The "non-triumphalist" history is one that exposes the mechanism of the triumph.
      *   *Actually, looking at the constraints:* The user says "I am asked to write a history that explains who we are... it is not clear to me that I can do that without either repeating the retrofit or producing something the committee will find unusable."
