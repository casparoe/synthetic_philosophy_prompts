prompt: |-
  I'm leading a three-session reading group on higher-order evidence and epistemic akrasia for philosophy graduate students from other areas; they know what a belief is and have met Gettier cases, but they have no formal epistemology. Don't explain the topic to me — plan how I should teach it. I want the order in which the pieces have to be introduced so that the puzzle feels forced rather than stipulated, the single case that should carry the whole sequence and why it can bear that weight, the misconceptions I should expect (my guesses: that epistemic akrasia is just inconsistency, that higher-order evidence is simply more first-order evidence, and that believing p while also believing one's evidence favors not-p is merely a kind of hypocrisy), and the exact point in the sequence at which to head off each. I'd rather build the arc around a case of my own than the textbook ones, so use this: a doctor completes a full workup and is confident that a patient's chest pain is musculoskeletal rather than cardiac; she then attends a morbidity conference and learns that physicians who reach that conclusion on this exact presentation, and who report her degree of confidence, are wrong about a third of the time, and that the felt sense of confidence does not track accuracy here — while nothing at the conference bears on this patient's actual symptoms. Tell me what that case has to contain for the plan to work and what it risks teaching wrongly, and give me a closing question that would reveal whether they have grasped the level distinction rather than memorized the label. Finish by naming what I should deliberately leave out at this level.
reasoning: |-
  Here's a thinking process that leads to the suggested teaching plan:

  1.  **Analyze the Request:**
      *   **Target Audience:** Philosophy graduate students (non-epistemologists). They know basic belief/Gettier stuff but no formal epistemology (no Bayesianism, no heavy logic).
      *   **Topic:** Higher-Order Evidence (HOE) and Epistemic Akrasia.
      *   **Format:** Three-session reading group.
      *   **Goal:** Plan *how* to teach it, not explain the topic.
      *   **Key Constraints:**
          *   Order must make the puzzle feel *forced*, not stipulated.
          *   Use *one specific case* (the Doctor Case provided) to carry the whole sequence.
          *   Explain *why* the case can bear that weight.
          *   Address specific misconceptions (Akrasia $\neq$ inconsistency, HOE $\neq$ more first-order evidence, Akrasia $\neq$ hypocrisy).
          *   Pinpoint *exactly* when to head off each misconception.
          *   Specify what the case *must contain* to work and what it *risks teaching wrongly*.
          *   Provide a *closing question* to test grasp of the level distinction.
          *   Name what to *deliberately leave out*.

  2.  **Deconstruct the Case (The Doctor):**
      *   *Scenario:* Doctor diagnoses musculoskeletal (MS) pain, not cardiac. High confidence.
      *   *HOE:* Morbidity conference stats show doctors with this profile/confidence are wrong 33% of the time. Confidence doesn't track accuracy here.
      *   *Crucial Detail:* Nothing at the conference bears on the *patient's actual symptoms* (pure HOE).
      *   *Why this case works:* It's high stakes (life/death), intuitive (expertise vs. statistics), and isolates the evidence types (symptoms vs. reliability data).

  3.  **Session Planning (The Arc):**
      *   *Goal:* Make the puzzle feel forced. Start with intuition, introduce tension, then formalize the conflict.
      *   *Session 1: The First-Order Intuition.* Establish the doctor's initial rationality.
      *   *Session 2: The Higher-Order Shock.* Introduce the conference data. Create the conflict.
      *   *Session 3: The Akratic Resolution (or lack thereof).* Discuss what she should believe *now* and the nature of that state.

  4.  **Addressing Misconceptions (Timing is Key):**
      *   *Misconception 1: HOE is just more first-order evidence.*
          *   *When:* Session 2, immediately upon introducing the conference data.
          *   *How:* Emphasize the "nothing bears on symptoms" clause.
      *   *Misconception 2: Akrasia is just inconsistency.*
          *   *When:* Session 3, when proposing she lower confidence but keep the belief.
          *   *How:* Distinguish logical contradiction from rational tension.
      *   *Misconception 3: Akrasia is hypocrisy.*
          *   *When:* Session 3, discussing the "ought."
          *   *How:* Focus on the *epistemic* "ought," not moral/pragmatic.

  5.  **Refining the Case Requirements:**
      *   *Must Contain:* Clear separation of evidence sources (exam vs. stats), explicit confidence levels (to allow calibration), and the "no new symptom info" clause.
      *   *Risks:* Pragmatic encroachment (she *should* act as if cardiac because stakes are high, confusing belief with action), psychological impossibility (can she actually hold the state?).

  6.  **Developing the Closing Question:**
      *   Needs to test the *level distinction*, not just definitions.
      *   Idea: Ask them to construct a parallel case or modify the current one to see if they treat the evidence differently based on its target.
      *   Better Idea: A "Self-Undermining" variation. If she believes the stats, does she defeat her own belief in the stats? (Too complex?).
      *   Best Idea: Ask about the *content* of the belief vs. the *attitude* toward the belief. "If she concludes she is likely wrong, what is the object of her new doubt?"

  7.  **Determining What to Leave Out:**
      *   Formal Bayesian updating (too technical).
      *   Conciliationism vs. Steadfastness deep dive (keep it focused on the *state* of akrasia, not just the resolution).
      *   Moral/Pragmatic encroachment (distracts from purely epistemic norms).
      *   Infinite regress worries (too abstract for intro).

  8.  **Drafting the Plan (Iterative refinement):**

      *   *Session 1:* Focus on the Exam. Establish rationality.
      *   *Session 2:* Focus on the Conference. Introduce HOE. Block the "more evidence" move.
      *   *Session 3:* Focus on the Aftermath. Define Akrasia. Block "inconsistency/hypocrisy" moves.

      *(Self-Correction during drafting)*: Make sure the "forced" feeling comes from the students trying to solve the case themselves. I need to structure the discussion so *they* generate the tension.
      *   S1: Ask "Is she rational?" (Yes).
      *   S2: Ask "Is she still rational?" (Debate). "Should she change her mind?" (Yes). "But the evidence about the patient didn't change!" (There's the puzzle).
      *   S3: "What is her mind like now?" (Akratic). "Is that broken?" (The philosophical meat).

      *Refining the Misconception Timing:*
      *   HOE $\neq$ FOE: Must be stopped *before* they try to update on the patient's symptoms.
      *   Inconsistency: Stop when they say "She can't believe P and Not-P." Clarify it's "Believe P" and "Believe evidence supports Not-P."
      *   Hypocrisy: Stop when they say "She's being irrational/immoral." Clarify it's a structural feature of rationality.

      *Refining the Case Risks:*
      *   The biggest risk is *Pragmatic Encroachment*. Because it's a doctor, students will say "She must test for cardiac." That's action, not belief. I need to explicitly bracket action.

      *Refining the Closing Question:*
      *   "If the doctor reads a second study saying 'Doctors who react to morbidity stats by lowering confidence are *also* wrong 33% of the time,' does she have to lower confidence in *that* reaction?" (Tests regress/level distinction).
      *   Actually, simpler: "Describe the content of her doubt. Is she doubting the heart, or her access to the heart?"

  9.  **Final Polish:** Check against all constraints.
      *   3 Sessions? Yes.
      *   Grad students (non-epi)? Yes (keep jargon low until defined).
      *   Order forced? Yes (via case evolution).
      *   Single case? Yes (The Doctor).
      *   Misconceptions addressed? Yes.
      *   Case requirements/risks? Yes.
      *   Closing question? Yes.
      *   Leave out? Yes.

  10. **Writing the Response:** (Proceeding to generate output based on these thoughts). *Wait, one check on the "forced" aspect.* To make it feel forced, I shouldn't lecture. I should ask questions that lead them into a trap.
      *   Trap 1: "Evidence is evidence." -> Show it doesn't touch the object.
      *   Trap 2: "Just change the belief." -> Show the first-order evidence still screams P.
      *   Trap 3: "It's just inconsistency." -> Show it's a specific rational tension.

      *Okay, ready to write.*
answer: |-
  Here is a three-session teaching plan designed to make the puzzle of higher-order evidence (HOE) and epistemic akrasia emerge inevitably from the case, rather than being imposed by theory.

  ### The Core Case: "The Cardiologist's Dilemma"
  **Why this case bears the weight:**
  It isolates the *source* of evidence. Medical diagnosis relies on two distinct epistemic pillars: clinical signs (first-order) and base rates/reliability data (higher-order). The stakes are high enough to demand seriousness but clinical enough to allow for statistical abstraction. Crucially, medicine accepts that "confidence" is a distinct variable from "accuracy," which maps perfectly onto the distinction between *belief* and *justification*.

  **What the case must contain to work:**
  1.  **Explicit Confidence:** She must not just believe $p$ (it is musculoskeletal); she must be *highly confident* (e.g., 90%). This allows the HOE to attack the *degree* of confidence without necessarily forcing a binary flip.
  2.  **The "No New Symptoms" Clause:** You must explicitly state that the morbidity conference provided **zero** new information about the patient's EKG, enzymes, or pain radiation. This is the firewall against treating HOE as FOE.
  3.  **The Reliability Gap:** The statistic must target *her specific type of judgment* (physicians with this confidence on this presentation), not general error rates.

  **What it risks teaching wrongly:**
  *   **Pragmatic Encroachment:** Students may conflate *what she should believe* with *what she should do* (e.g., "She must order a stress test"). You must rigorously bracket action. The question is about her doxastic state, not her treatment plan.
  *   **Psychological Impossibility:** Students may argue, "She literally cannot feel confident and doubt her confidence simultaneously." You must distinguish normative rationality (what she ought to believe) from psychological capacity (what she can sustain).

  ---

  ### Session 1: The First-Order Baseline
  **Goal:** Establish the rationality of the initial belief to create a baseline for defeat.
  **Reading:** A brief excerpt on evidentialism (e.g., Conee & Feldman) or nothing (rely on intuition).

  **The Sequence:**
  1.  **Present Part A:** The workup. The symptoms point clearly to musculoskeletal issues. Cardiac markers are negative. She forms the belief "It is not cardiac" with 90% confidence.
  2.  **Discussion Question:** "Is the doctor rational in holding this belief?"
      *   *Expected Consensus:* Yes. She followed the evidence.
  3.  **The Trap:** Ask, "What makes her rational?"
      *   *Desired Answer:* "The evidence supports the conclusion."
      *   *Teaching Move:* Write this on the board: **Rationality = Fit between Evidence and Belief.**
  4.  **Homework:** Ask them to write down what would need to happen to make her irrational. Most will say "New symptoms appear." Keep this in your pocket for Session 2.

  **Misconception Check:** None yet. Let them settle into the intuition that first-order evidence (FOE) dictates rationality.

  ---

  ### Session 2: The Higher-Order Shock
  **Goal:** Force the realization that evidence about evidence changes rationality without changing the object-level evidence.
  **Reading:** A short paper introducing HOE (e.g., Christensen's "Does Murph's Law of Epistemology Apply?").

  **The Sequence:**
  1.  **Present Part B:** The morbidity conference. She learns that doctors in her position are wrong 33% of the time and that confidence is uncorrelated with accuracy here. **Reiterate:** No new data on the patient.
  2.  **Discussion Question:** "Does she have new evidence about the *patient's heart*?"
      *   *Expected Answer:* No.
  3.  **Discussion Question:** "Should she change her confidence level?"
      *   *Expected Consensus:* Yes, she must lower it.
  4.  **The Squeeze (The Forced Puzzle):**
      *   Point to the board from Session 1: **Rationality = Fit between Evidence and Belief.**
      *   Ask: "The evidence about the heart hasn't changed. The belief has changed. Did she just become *less* rational by responding to the conference?"
      *   *The Trap:* Students will try to say the conference stats *are* evidence about the heart.
      *   **Intervention Point (Misconception 1: HOE $\neq$ FOE):** Stop this immediately. Ask: "If the stats are evidence about the heart, why didn't they change the EKG reading?" Force them to articulate that the stats are evidence about *her relation to the evidence*, not the evidence itself.
      *   *Result:* They must admit that rationality can shift even when the object-level evidence remains static.

  **Misconception Check:**
  *   **HOE is simply more FOE:** Head this off **here**, during the "Squeeze." If they treat the stats as direct evidence against the cardiac diagnosis, the puzzle dissolves. Insist on the distinction: FOE targets the world; HOE targets the thinker's grip on the world.

  ---

  ### Session 3: The Akratic State
  **Goal:** Define epistemic akrasia and distinguish it from inconsistency/hypocrisy.
  **Reading:** A paper on akrasia (e.g., Horowitz "Epistemic Akrasia" or Smithies "Moore's Paradox").

  **The Sequence:**
  1.  **The Aftermath:** The doctor lowers her confidence to 60% but, given the strong FOE, does not drop below 50%. She still believes "It is not cardiac," but she also believes "My evidence likely supports 'It is cardiac' (or at least, doesn't support my confidence)."
  2.  **Discussion Question:** "Describe her mind right now. Is this a stable state?"
  3.  **The Trap:** Students will call this "irrational" or "contradictory."
      *   *Intervention Point (Misconception 2: Akrasia $\neq$ Inconsistency):* Ask: "Is she believing $p$ and $\neg p$?" No. She believes $p$ and believes *her evidence supports $\neg p$ (or doesn't support $p$).*
      *   Explain that this is a tension between levels, not a logical contradiction within a level. It is *epistemically* akratic, not logically inconsistent.
  4.  **The Hypocrisy Charge:** Students will say, "She's being hypocritical; she acts on $p$ but admits she shouldn't."
      *   *Intervention Point (Misconception 3: Akrasia $\neq$ Hypocrisy):* Distinguish the **Epistemic Ought** from the **Moral/Pragmatic Ought**. Hypocrisy is a moral failing regarding sincerity. Akrasia is a structural feature of rationality. She isn't lying to herself; she is accurately tracking two different levels of evidence that point in opposite directions.
  5.  **Synthesis:** The "Right Reason" view. She is now in the unique position where the *rational* thing to do is hold a belief she thinks is likely unsupported. This is the "forced" conclusion: Rationality sometimes requires akrasia.

  **Misconception Check:**
  *   **Inconsistency:** Addressed at the start when analyzing the content of her beliefs.
  *   **Hypocrisy:** Addressed when discussing the normative status of her state.

  ---

  ### The Closing Question
  Do not ask for a definition. Ask for an application that requires tracking the levels.

  **"Suppose the doctor reads a second study at the conference. This study says: 'Doctors who lower their confidence after seeing morbidity stats are *also* wrong 33% of the time.'**

  **If she accepts this second study as true, must she lower her confidence *again*? If yes, where does it stop? If no, why is the first study binding but not the second?"**

  *   **Why this works:** To answer this, they must distinguish between evidence targeting the diagnosis (Level 0), evidence targeting her confidence in the diagnosis (Level 1), and evidence targeting her response to Level 1 evidence (Level 2). If they treat all evidence as the same kind (FOE), they will either spiral into infinite regress or arbitrarily stop. If they grasp the level distinction, they will recognize that the second study is HOE about her *response* to HOE, requiring a different calibration.

  ---

  ### What to Deliberately Leave Out
  1.  **Formal Bayesianism:** Do not introduce conditionalization formulas. It distracts from the conceptual puzzle and alienates non-epistemologists. Keep it qualitative (confidence levels).
  2.  **The "Steadfast" vs. "Conciliationist" Debate:** Do not let the group spend time arguing whether she *should* lower confidence. Assume for the sake of the puzzle that she should. The focus is on the *nature of the state* she ends up in (akrasia), not the debate on how to respond to peer disagreement.
  3.  **Moral Encroachment:** Rigorously police the discussion to prevent slides into "She should believe the patient is sick because it's safer." This is a reading group on *epistemic* norms, not medical ethics.
  4.  **Psychological Feasibility:** Do not dwell on whether humans *can* actually sustain akratic beliefs. Treat the doctor as an idealized agent for the purpose of mapping the normative landscape.

  ### Summary of Interventions
  *   **Session 2:** When they say the stats are about the heart $\rightarrow$ Stop. **HOE $\neq$ FOE.**
  *   **Session 3:** When they say she believes $p$ and $\neg p$ $\rightarrow$ Stop. **Akrasia $\neq$ Inconsistency.**
  *   **Session 3:** When they say she is being dishonest/immoral $\rightarrow$ Stop. **Akrasia $\neq$ Hypocrisy.**
