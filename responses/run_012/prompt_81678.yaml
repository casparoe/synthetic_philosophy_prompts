prompt: |-
  My partner and I are to be married in the spring, and a conversation at a family dinner has stayed with me longer than I expected. My brother, who reads a good deal of philosophy and was not, so far as I could tell, arguing in bad faith, put his objection to same-sex marriage as follows. Marriage, he said, is not a private preference or a loose arrangement but a rule-governed practice, and in such a practice the rules are constitutive rather than merely regulative: they do not record what people happen to do, they determine what counts as doing it at all. Chess was his model. The rules of chess are not a summary of how people have happened to move pieces; they are what make a move a move and a win a win, and a player who declares that his king may henceforth move three squares has not reformed chess but abandoned it for another game. And because the rules of a practice fix its point — as the rules of chess fix what counts as winning — the purpose of marriage cannot be reassigned by anyone's preferences, however widely shared. His conclusion: a legislature that redefines marriage to include two people of the same sex has not extended marriage but replaced it with a different practice wearing the same name, and the substitute cannot be defended by appeal to the value of the thing it displaced.

  I would like an audit of this argument rather than a verdict on the politics. Set out the correspondence he is relying on — what plays the role of the rulebook, the players, the constitutive rules, the point of the game — and then tell me where the mapping breaks. Which of the disanalogies matter for the use he is making of the analogy, and which are merely decorative? What does the comparison quietly import about marriage that ought to be established rather than assumed? A colleague of mine offers a cruder version of the same thought — that a statute declaring married men to be bachelors would be nonsense, and that 'marriage' stands to 'bachelor' in this respect — and I should like to know whether the chess version does any work that the cruder one does not, or whether the two amount to the same thing. Finally, tell me whether his conclusion survives once the disanalogies are on the table, and, if a better analogy for what marriage is and what it is for is available, what it would be.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Context:** The user is getting married in the spring (same-sex marriage implied by the brother's objection).
      *   **The Brother's Argument:** Marriage is a rule-governed practice (like chess). Rules are constitutive, not regulative. Changing the rules (to include same-sex couples) doesn't reform the practice but abandons it for a new one. Therefore, same-sex marriage isn't an extension but a replacement, and its value can't be defended by the value of traditional marriage.
      *   **Task:** Audit the argument (not a political verdict).
      *   **Specific Requirements:**
          1.  Set out the correspondence (Rulebook, Players, Constitutive Rules, Point of the Game).
          2.  Identify where the mapping breaks (disanalogies).
          3.  Distinguish which disanalogies matter vs. are decorative.
          4.  Identify what the comparison quietly imports/assumes about marriage.
          5.  Compare with the colleague's "bachelor" analogy (does the chess analogy do more work?).
          6.  Evaluate if the conclusion survives the audit.
          7.  Suggest a better analogy if available.

  2.  **Deconstruct the Brother's Argument (The Chess Analogy):**
      *   *Premise 1:* Marriage is a rule-governed practice (like chess).
      *   *Premise 2:* In such practices, rules are constitutive (they define the activity).
      *   *Premise 3:* Changing constitutive rules creates a new game, not a reformed version of the old one.
      *   *Premise 4:* The rules fix the point/purpose of the practice.
      *   *Conclusion:* Redefining marriage to include same-sex couples creates a new practice, not an extension of the old one.

  3.  **Map the Correspondence:**
      *   *Rulebook:* Civil/Canon law, social norms, religious doctrine defining marriage.
      *   *Players:* Spouses (Husband/Wife in the traditional view).
      *   *Constitutive Rules:* One man, one woman, consummation, permanence, exclusivity (traditionally).
      *   *Point of the Game:* Procreation, raising children, union of sexes, social stability (teleological end).

  4.  **Identify Disanalogies (Where the mapping breaks):**
      *   *Origin:* Chess is invented; marriage evolves organically/is discovered.
      *   *Authority:* Chess rules are set by a federation; marriage rules are set by state/church/society/custom.
      *   *Purpose:* Chess is a closed system with an internal goal (checkmate); marriage is an open system with external social/biological functions.
      *   *Participation:* Chess is optional leisure; marriage is a fundamental social institution/right.
      *   *Flexibility:* Chess rules are rigid; legal/social institutions evolve (e.g., removing coverture, allowing divorce).
      *   *The "Win" Condition:* Chess has a clear win state; marriage doesn't really have a "win" state (it's a status, not a competition).

  5.  **Evaluate Which Disanalogies Matter:**
      *   *Decorative:* The specific pieces (King/Pawn vs. Husband/Wife). The fact that chess is played on a board.
      *   *Critical:*
          *   *Invention vs. Evolution:* Chess is arbitrary; marriage claims natural law or deep social utility. If marriage is more like language than chess, rules describe usage rather than dictating it.
          *   *Internal vs. External Telos:* Chess exists *for* the game. Marriage exists *for* something outside itself (family, society, mutual support). If the external purpose can be fulfilled by same-sex couples, the internal rules might adjust without losing the point.
          *   *The "Win" State:* Marriage isn't about winning. It's about a status. Changing eligibility for a status (like citizenship) doesn't create a new status, it expands the old one.

  6.  **Analyze the "Quiet Imports" (Assumptions):**
      *   It assumes marriage is *primarily* defined by its rules rather than its function.
      *   It assumes the "one man, one woman" rule is *constitutive* rather than *historical/regulative*.
      *   It assumes the purpose (procreation/union of sexes) is impossible for same-sex couples to approximate or fulfill in a legally relevant way.
      *   It assumes the State acts like a Game Federation (arbitrary rule-setter) rather than a recognizer of social realities.

  7.  **Compare with the "Bachelor" Analogy:**
      *   *Colleague's Argument:* "Married men are bachelors" is a contradiction in terms (analytic truth).
      *   *Chess Analogy:* Focuses on *practice* and *purpose*.
      *   *Comparison:* The bachelor argument is linguistic/logical (semantic). The chess argument is institutional/teleological.
      *   *Does Chess do more work?* Yes, it attempts to explain *why* the definition exists (the point of the game), whereas "bachelor" just asserts the definition is fixed. However, both suffer from the same flaw: treating definitions as static rather than evolving concepts. The chess analogy is stronger rhetorically because it addresses the *function*, but it fails because marriage isn't a game with a win state.

  8.  **Evaluate the Conclusion's Survival:**
      *   Once disanalogies are exposed (specifically the difference between arbitrary game rules and evolving social institutions), the conclusion weakens.
      *   If marriage is more like *language* or *citizenship* than chess, redefinition is possible without destruction.
      *   The "replacement" claim relies on the idea that the *essence* is the gender complementarity. If the essence is *committed union*, the conclusion fails.

  9.  **Propose a Better Analogy:**
      *   *Citizenship:* Eligibility criteria change (property ownership -> birthright -> naturalization). The *institution* of citizenship remains, even if the *rules of entry* change.
      *   *Language:* Words change meaning (e.g., "marriage" or "deer"). Usage dictates meaning, not a central authority.
      *   *University:* Originally for clergy, then men, then women. Is a modern university a "different practice" than Oxford in 1500? No, it's the same institution evolved.

  10. **Drafting the Response:**
