      *   Quiet imports.
      *   Bachelor comparison.
      *   Conclusion survival.
      *   Better analogy.

      *Looks good. Proceed to write.*
answer: |-
  This is a sophisticated objection that relies on a specific philosophy of language and social ontology, likely drawing from thinkers like John Searle (on constitutive rules) or Alasdair MacIntyre (on practices). To audit it, we must treat it not as a political claim but as a structural claim about how institutions function.

  Here is the audit of your brother's argument.

  ### 1. The Correspondence
  Your brother's argument relies on an isomorphism between the institution of marriage and the game of chess. For the analogy to hold, the following mappings must be secure:

  *   **The Rulebook:** In chess, this is the codified laws of the game (FIDE rules). In marriage, this is the civil statute, canon law, or customary norm defining eligibility and duties.
  *   **The Players:** In chess, these are the two opponents. In marriage, these are the spouses.
  *   **The Constitutive Rules:** In chess, "a bishop moves diagonally." In marriage, "a spouse must be of the opposite sex" (on his view). These rules do not regulate pre-existing behavior; they create the possibility of the activity itself.
  *   **The Point of the Game (Telos):** In chess, this is checkmate (winning). In marriage, this is the specific good that the rules are designed to secure (e.g., the union of complementary sexes, procreation, or a specific form of kinship).
  *   **The Authority:** In chess, a governing body dictates rules. In marriage, the Legislature or Church acts as the rule-maker.

  ### 2. Where the Mapping Breaks (Disanalogies)
  The analogy fails at several points. We must distinguish between **decorative disanalogies** (surface differences that don't affect the logic) and **critical disanalogies** (structural differences that undermine the conclusion).

  **Decorative Disanalogies:**
  *   **Physicality:** Chess uses pieces on a board; marriage uses human bodies and lives. This is irrelevant to the logical structure of rules.
  *   **Competition:** Chess is zero-sum; marriage is cooperative. While significant for the *experience*, it does not necessarily break the *rule-governed* nature of the institution.

  **Critical Disanalogies:**
  *   **Invention vs. Evolution:** Chess is an invented game with a specific start date and authors. Marriage is an evolved social institution with pre-legal roots. Invented games *require* constitutive rules to exist; evolved institutions often have rules that *describe* a reality rather than *create* it.
  *   **The "Win" State:** Chess has a terminal state (checkmate) that defines the activity. Marriage has no terminal "win" state; it is a status or a vocation, not a contest with a conclusion. Without a fixed "win condition," the claim that changing rules changes the "point of the game" is much harder to sustain.
  *   **Arbitrariness of Rules:** The rule "bishops move diagonally" is arbitrary; it could be otherwise, and it would just be a different game. The rule "marriage is between a man and a woman" is claimed by proponents to be non-arbitrary (based on biology or natural law). If the rule is non-arbitrary, it derives from the *nature* of the thing, not the *stipulation* of the rule-maker. If it derives from nature, the legislature cannot change it anyway; if it is stipulative, the legislature *can* change it, but then it functions like a club membership, not a game.
  *   **Internal vs. External Goods:** The goods of chess are internal to the practice (you play chess to play chess). The goods of marriage are largely external to the legal definition (child-rearing, economic stability, emotional support). If the external goods can be achieved by a new configuration of players, the internal rules may be regulative rather than constitutive.

  ### 3. What the Comparison Quietly Imports
  The chess analogy is not neutral; it smuggles in several substantive assumptions that ought to be established rather than assumed:

  1.  **That Marriage is Primarily a Legal Construct:** By comparing marriage to a rulebook, the argument assumes marriage exists *because* the state says so. It ignores the pre-political reality of marriage (cohabitation, commitment, kinship) that the law merely recognizes.
  2.  **That Gender Complementarity is Constitutive:** The argument assumes that "opposite sex" is to marriage what "diagonal movement" is to a bishop. It treats this feature as essential to the definition rather than a historical contingency. This is the very point in dispute, yet the analogy assumes it to prove it.
  3.  **That Institutions are Static:** Chess rules remain largely static for centuries. Social institutions (universities, corporations, currencies) evolve. The analogy imports a rigidity that fits games but not social ecosystems.
  4.  **That the "Point" is Fixed:** It assumes the *telos* of marriage is fixed (e.g., procreation) and that this *telos* is incompatible with same-sex unions. If the *telos* is instead "committed mutual support," the rules can change without changing the point.

  ### 4. The "Bachelor" Analogy vs. The Chess Analogy
  Your colleague's argument ("declaring married men to be bachelors is nonsense") is a **semantic** argument, whereas your brother's is an **institutional** argument.

  *   **The Bachelor Argument:** This relies on analytic truth. "Bachelor" is defined as "unmarried man." To change this is to break logic. It suggests that redefining marriage is like redefining "triangle" to have four sides.
  *   **The Chess Argument:** This attempts to do more work. It acknowledges that institutions have purposes and histories. It tries to explain *why* the definition exists (to secure the point of the practice), not just *that* it exists.

  **Does the Chess version do more work?**
  Yes, but it also exposes more flank. The bachelor argument is tautological and easily dismissed as "just semantics." The chess argument engages with the *function* of marriage. However, the chess analogy ultimately amounts to the same thing if it treats the definition as immutable. The chess analogy fails where the bachelor analogy fails: both assume that the *current definition* is the *only possible definition* that preserves the concept's identity.

  The chess analogy is rhetorically stronger because it appeals to the integrity of practices, but logically it is more vulnerable because, as noted above, marriage lacks the "win state" and "arbitrary rule" structure of a game.

  ### 5. Does the Conclusion Survive?
  Once the critical disanalogies are on the table, the conclusion—that same-sex marriage is a *replacement* rather than an *extension*—does not survive intact.

  The argument hinges on whether the rule "one man, one woman" is **constitutive** (defines the thing) or **regulative** (governs access to the thing).
  *   If marriage is like **Chess**, the rule is constitutive. Changing it destroys the game.
  *   If marriage is like **Citizenship**, the rule is regulative/access-based.

  In the history of citizenship, eligibility rules have changed radically (from property-owning males to all adults). When the franchise was extended to women, we did not say "Citizenship has been replaced by a new practice." We said "Citizenship has been expanded." The *point* of citizenship (participation in the polity) remained, even if the *rules of entry* changed.

  Because marriage lacks a "win state" and functions more like a status (citizenship) or a vocation (medicine) than a game, the brother's claim that the practice is *abandoned* rather than *reformed* is an assertion, not a deduction. It survives only if one already accepts the premise that gender complementarity is the *essence* of marriage, which is the very point your brother is trying to prove.

  ### 6. A Better Analogy
  If the chess analogy is flawed because it treats marriage as a closed system with arbitrary rules, a better analogy is **The University**.

  *   **Correspondence:**
      *   **The Practice:** Education/Scholarship (vs. Marriage/Union).
      *   **The Rules:** Eligibility for admission (vs. Eligibility for spouses).
      *   **The Change:** For centuries, universities were for men only (or clergy only).
      *   **The Objection:** One could have argued in 1850: "A university is constitutively for men. To admit women is not to reform the university but to create a new practice wearing the same name. The point of a university is to educate *men* for leadership."
      *   **The Reality:** When universities admitted women, the *rules of entry* changed, but the *practice* (scholarship, degrees, community) remained continuous. We do not say Oxford University ceased to exist in the 20th century; we say it evolved.

  **Why this works better:**
  Like marriage, a University is a social institution with a teleological purpose (knowledge/formation) that is not exhausted by its eligibility criteria. It acknowledges that institutions can evolve their access rules without losing their identity, provided the core function (in marriage: committed union; in university: education) is maintained.

  ### Summary for Your Conversation
  Your brother's argument is logically valid *if* you accept the premise that marriage is a closed system like a game. The audit shows that marriage is not a closed system. It is an open social institution. Therefore, changing the eligibility criteria (the rules of entry) does not necessarily destroy the institution (the game itself), any more than admitting women to universities destroyed the concept of higher education. The burden of proof remains on him to show why gender is constitutive of the *union* itself, rather than merely a historical rule of *access* to it.
