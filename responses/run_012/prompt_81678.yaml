      *(Self-Correction during drafting)*: I need to make sure I don't accidentally validate the brother's premise that same-sex marriage *is* a redefinition. I need to analyze the *logic* of the argument that *if* it is a redefinition, *then* it is a new game. The core philosophical dispute is whether the gender rule is constitutive or regulative. I must highlight that the brother *assumes* it is constitutive without proving it.

      *(Refining the "Bachelor" comparison)*: The bachelor argument is analytic ("bachelor" = "unmarried man"). The chess argument is institutional. The chess argument is trying to do more heavy lifting (teleology), but it collapses because institutions aren't games. I should emphasize that the chess analogy is an *upgrade* from the bachelor argument but still fails.

      *(Refining the Better Analogy)*: "Citizenship" is probably the strongest. It involves legal status, rights, duties, and evolving eligibility criteria without losing the core identity of the status.

  11. **Final Review against constraints:**
