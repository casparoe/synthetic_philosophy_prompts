  I'm a history PhD student, second year, and I'm writting a chapter about a fishing town that died, and I've managed to get into a running argument with my friend who's finishing a dissertation in philosophy on causation. I need to know what she'd actually say about my case before I attribute a view to her in a footnote and get it wrong. Her verdicts on the toy cases, as best I remember them: (i) two arsonists independently set fires that both reach the same warehouse at about the same time, and either fire on its own would have destroyed the whole building — she says both fires caused the destruction, and that it's a dodge to say neither did because neither was necessary; (ii) a shooter actually kills someone, and a second shooter was standing right there ready to shoot if the first hadn't, and would have killed him too — she says the first shot caused the death and the second shooter's readiness caused nothing at all; (iii) two climbers on the same pitch, each of them had separately been told to bring the rope, either rope would have been enough to secure it, neither brought one, the lead climber fell — she says neither one's forgetting caused the fall, the loose rock did, and that omissions and absences aren't causes at all, they're just the shape the world happened to be in. So I'd been assuming she's a production person — causation is stuff actually doing stuff to other stuff, no gaps, no absences — but (i) shows she's obviously not a but-for person, and I can't work out whether that leaves her with one rule or two, or whether the rule she's actually running is something else that just happens to fit all three.

  The case I'm writing about is a composite, so don't check my numbers against anything. Port Alden: (a) a marine heatwave knocked the stock down by about half over three years, and the town could probably have kept going on a half stock; (b) a trawler fleet got licensed in year two, and the trawlers on their own could have fished the stock below recovery even without the heatwave; (c) the fisheries department had the power to close the fishery, didn't, and if it had closed it for two seasons the stock would have come back and the town would have survived; (d) the cannery had been quietly insolvent for a decade and there was no other employer in town, so any bad year was going to hurt; (e) by year four the town had emptied out. What I want is not a lecture on causation but a prediction: for each of (a)–(d), would she call it a cause of the town emptying out, or not, or would she say the question is under-specified? Especially (c) — I have a feeling she has to say the department's failure isn't a cause, and I want to know if that's right and what it would commit her to. If more than one rule fits everything she's said, tell me which ones, and give me a case I could actually put to her that would separate them, because she's coming to my department's workshop in March and I'd like to settle it. Also flag anything in (i)–(iii) that doesn't hang together with the rest, and say which verdict she'd have to give up if she wanted one rule instead of two.

