prompt: |-
  I'm on the investment comittee at the small foundation I used to run (about $40m, we pay out 5% a year, and under the current plan the whole thing gets spent down by 2032). Last night my friend Dana — also a trustee, ex-trader — and I argued for two hours about something that's on the agenda for Tuesday, and now I have to write the opinion I'll circulate before the vote.

  Here's the thing itself. A fund has offered us a stake in a single binary outcome — a drug that either gets approved or it doesnt; the analysts we hired say 60% it hits. We can put in however much we want, up to the entire endowment. If it hits, each dollar we put in becomes three. If it misses, those dollars are just gone. Dana's math: $1.80 expected per dollar, so if we play small and it hits we've turned down an expected $32m of grants. His line is that our job is to maximize expected dollars for the people we exist to serve, and that flinching because we might end up at zero is being precious with other people's money. When I brought up the idea of only ever betting some fixed fraction of your bankroll, he said that rule is for people who'll be making bets forever, and we won't be — there's no next bet, the foundation winds up in a few years, so the long-run argument doesn't even apply to us.

  My gut says if this misses we don't have a bad year, we're finished, and we can't raise more (no donors left). But I couldn't say why Dana's wrong, and I don't want the memo to just say it feels too risky.

  Draft the written opinion for the board: recommend a concrete course of action — how much, if anything, to commit, and whether we should adopt a standing rule for offers like this in the future — with the reasoning spelled out, and with the strongest version of Dana's case stated fairly enough that he'd recognize it as his own. Don't give me generic stuff about diversification; it's one binary deal, either we take a piece of it or we don't.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Context:** Small foundation ($40M endowment), spend-down mode (5% payout, gone by 2032). Investment Committee meeting Tuesday.
      *   **The Conflict:** User vs. Dana (Trustee, ex-trader).
      *   **The Deal:** Binary outcome (drug approval). 60% chance of success. 3x return if success, 0 if failure. Max investment = 100% of endowment.
      *   **Dana's Argument:** Maximize Expected Value (EV). $1.80 EV per $1. If we bet small and win, we lose out on potential grants. Foundation has a finite life, so "long-run" Kelly Criterion/risk management doesn't apply. Mission is to serve beneficiaries, so maximizing expected dollars is the fiduciary duty.
      *   **User's Intuition:** If it misses, the foundation is dead (prematurely). Can't raise more money. "Feels too risky" isn't enough.
      *   **Task:** Draft a written opinion/memo for the board.
      *   **Requirements:**
          *   Recommend a concrete course of action (how much to commit).
          *   Recommend a standing rule for future offers.
          *   Spell out reasoning clearly.
          *   State Dana's case fairly/strongly (steelman).
          *   Avoid generic diversification platitudes (this is a specific binary bet).

  2.  **Deconstruct the Financial & Ethical Math:**
      *   **Endowment:** $40M.
      *   **Payout:** 5% ($2M/year).
      *   **Timeline:** Spend down by 2032 (approx. 8-9 years from now? Or is 2032 the hard stop? Let's assume ~8 years remaining).
      *   **The Bet:**
          *   Probability ($p$) = 0.6
          *   Return ($b$) = 3x (Profit is 2x, Total return is 3x).
          *   Expected Value (EV) = $0.6 \times 3 + 0.4 \times 0 = 1.8$.
          *   This is a +EV bet. Dana is mathematically correct on *expected value*.
      *   **The Risk:** Ruin. If we bet 100% and lose, Endowment = $0. Grants = $0 immediately.
      *   **The Mission:** Spend down by 2032. This implies a *liability stream*. We owe $2M/year for ~8 years. We cannot fail to meet these liabilities.
      *   **Dana's Flaw:** He treats the endowment as a lump sum to be maximized in expectation, ignoring the *liability structure* of the foundation. The foundation isn't a hedge fund; it's a grant-making vehicle with obligations to beneficiaries over time. If we go to zero in Year 1, we violate the spend-down plan and the trust of the beneficiaries expecting grants in Years 2-8.
      *   **Kelly Criterion:** Usually applies to repeated bets. Dana says "no next bet." However, the "repetition" here isn't the *investment*, it's the *annual grants*. We need to survive to pay grants for 8 years.
      *   **Utility Function:** The utility of money for a spend-down foundation is not linear. The first $2M (Year 1 grants) has infinite utility compared to the last $2M (Year 8 grants) if skipping Year 1 means the foundation closes. Actually, it's more binary: If we hit zero, utility drops to zero for *all* future years.

  3.  **Formulate the Counter-Argument (The "Why Dana is Wrong" part):**
      *   Dana maximizes *Expected Dollars*.
      *   We must maximize *Expected Impact*.
      *   Impact requires *solvency* over the timeline.
      *   A 40% chance of ending the mission *today* is unacceptable fiduciary behavior, regardless of EV.
      *   Analogy: Would you bet the entire year's operating budget on a coin flip that pays 3:1? Even if EV is positive? No, because if you lose, the lights go out.
      *   The "Finite Life" argument cuts both ways: Because we have a finite life and no ability to recapitalize, risk of ruin is *more* critical, not less. We don't have a wealthy donor to bail us out.

  4.  **Determine the Recommendation:**
      *   **Bet Size:** Cannot be 100%. Cannot be 0% (if we believe the analysis and want to capture some upside).
      *   **Constraint:** We must ensure we can meet the 5% payout obligation for the remaining life (2032) even if the bet loses.
      *   **Calculation:**
          *   Current: $40M.
          *   Remaining Years: ~8 (2024 to 2032).
          *   Annual Need: $2M.
          *   Total Liability: $16M (ignoring discount rates/investment returns on the safe portion for simplicity, but let's be prudent).
          *   Actually, the endowment is invested. The 5% payout usually implies the portfolio needs to sustain itself. But since it's a spend-down, we need to ensure we have enough *safe* assets to cover the grants if the risky bet fails.
          *   Safe Bucket: Needs to cover ~8 years of grants. $2M * 8 = $16M.
          *   Risk Bucket: $40M - $16M = $24M.
          *   However, putting 60% of the portfolio into a binary 40% ruin risk is still insane for a fiduciary.
          *   Better approach: Limit the loss to a percentage that doesn't jeopardize the mission. If we lose $X, can we still fund 2032?
          *   Let's suggest a cap based on "Risk of Ruin" relative to the spend-down schedule.
          *   *Conservative Recommendation:* 10-20% of the portfolio. Why? Because a total loss reduces the endowment to $32M or $36M. We can still fund the grants by adjusting payout rates slightly or extending the timeline slightly, but we don't cease operations.
          *   *Wait, the prompt says "under the current plan the whole thing gets spent down by 2032".* If we lose money, we either cut grants or extend the life.
          *   *Hard Constraint:* We cannot go to zero.
          *   *Proposed Limit:* Invest no more than 25% of the endowment. If we lose $10M, we have $30M left. We can still fund $2M/year for 15 years, or adjust the spend-down.
          *   *Actually, let's look at the "Gambler's Ruin" aspect.* Even with +EV, betting too much kills you.
          *   *Decision:* Recommend a specific cap (e.g., 15-20%) and a standing policy.
          *   *Refinement:* Let's make it about the "Liability Matching." We must secure the grant obligations first.
          *   *Calculation:* PV of remaining grants. If we assume 0% real return on the safe portion, we need $2M * 8 years = $16M.
          *   So, $16M is "off limits." $24M is "risk capital."
          *   But putting all $24M into one binary bet is still concentration risk.
          *   *Recommendation:* Commit no more than 10% ($4M). Why? Because losing $4M is painful but survivable. Winning turns $4M into $12M (profit $8M), which is huge for grants. Losing $4M reduces endowment to $36M, which extends the spend-down by less than 2 years or requires minor grant cuts.
          *   *Wait, Dana's argument:* "If we play small and it hits we've turned down an expected $32m of grants." (He assumes betting 100%).
          *   *My Counter:* If we bet 100% and lose, we turn down *all* future grants ($16M+).
          *   *Recommendation:* Cap at 15% ($6M). This allows significant upside without existential risk.

  5.  **Drafting the Memo - Structure:**
      *   **Header:** To, From, Date, Subject.
      *   **Executive Summary:** Recommendation (Cap at X%, Adopt Policy Y).
      *   **The Proposal:** Briefly state the deal.
      *   **Dana's Position (Steelman):** Acknowledge the EV math and the fiduciary argument.
      *   **The Counter-Argument (Mission & Solvency):** Explain why EV isn't the only metric. The "Liability" argument. The "Irreversibility" argument.
      *   **Recommendation:** Specific dollar amount/percentage.
      *   **Policy:** Future framework for binary/high-risk bets.

  6.  **Refining the Tone:**
      *   Professional, respectful, but firm.
      *   Acknowledge Dana's expertise (ex-trader).
      *   Focus on fiduciary duty to the *beneficiaries*, not just the *dollars*.
      *   Avoid emotional language ("gut feel"), use structural/financial logic.

  7.  **Key Insight to Highlight:**
      *   The foundation has a *liability stream* (the planned grants).
      *   A hedge fund has no liabilities; it just wants max return.
      *   We are an insurance company for social good. We cannot be insolvent.
      *   Dana's "finite life" argument actually supports *caution*. Because we can't raise capital, we can't recover from ruin.

  8.  **Finalizing the Numbers:**
      *   Endowment: $40M.
      *   Payout: $2M/yr.
      *   Years left: ~8 (2024 to 2032).
      *   Total grants owed: ~$16M (nominal).
      *   If we bet $X$ and lose, Endowment = $40M - $X$.
      *   We need $40M - $X$ $\ge$ PV of remaining grants.
      *   Let's assume the remaining portfolio earns enough to cover inflation/fees, so we need roughly the grant amount in cash/bonds.
      *   If we set aside $20M for grants (safety margin), we have $20M risk capital.
      *   But putting $20M (50%) into one binary bet is still too concentrated for a board vote.
      *   Let's recommend 15% ($6M).
      *   Rationale: Loss reduces endowment to $34M. Still fully funds 2032 spend-down with minor adjustments. Win adds $12M (total $52M), significantly boosting grants.
      *   This balances Dana's desire for upside with the User's desire for safety.

  9.  **Policy Recommendation:**
      *   No single binary bet > 15% of AUM.
      *   Must pass "Ruin Test": If bet goes to zero, can we still meet 100% of committed grant obligations?

  10. **Review against constraints:**
      *   Concrete course of action? Yes (15% cap).
      *   Standing rule? Yes (Ruin Test).
      *   Dana's case stated fairly? Yes (EV maximization).
      *   No generic diversification? Yes (Focus on binary ruin).

  11. **Final Polish:** Ensure the distinction between "Expected Value" and "Expected Utility" is clear without getting too academic. Emphasize that the foundation's utility function is S-shaped or threshold-based (zero money = zero impact), not linear.

  *(Self-Correction during drafting)*: I need to make sure I don't sound like I'm rejecting the bet entirely. The prompt implies I want to find a middle ground or justify a "no" if that's the safer play. But Dana's math is strong on EV. A flat "no" might look risk-averse to a fault. A "yes, but capped" shows we are willing to take risk but not *existential* risk. I will recommend a capped participation.

  Wait, looking at the prompt: "recommend a concrete course of action — how much, if anything, to commit".
  If I recommend 0%, I need a very strong reason. If I recommend 15%, I need to show it's optimal.
  Given the 60% win rate and 3x return, it *is* a great bet. Refusing it entirely wastes opportunity. The issue is size. I will recommend a size that captures upside without threatening the mission.

  Let's refine the "Dana's finite life argument." He says Kelly doesn't apply because no next bet.
  Counter: The "next bet" is the grant cycle. We bet every year that we have enough money to write checks. If we lose the binary bet, we default on future "bets" (grants). So the repetition is in the *payouts*, not the investments.

  Okay, ready to write.

  *Structure:*
  1. Header.
  2. Summary Recommendation.
  3. The Opportunity (The Deal).
  4. The Case for Maximizing Exposure (Dana's View).
  5. The Case for Constrained Exposure (My View).
     - Liability Matching.
     - Irreversibility.
     - Utility of Capital.
  6. Proposed Investment Limit.
  7. Proposed Policy Framework.
  8. Closing.

  * Tone Check:* Respectful of Dana. He's a friend and trustee. Don't make him look foolish, make his framework look incomplete for *this specific institution*.

  * Math Check:*
  Bet $1.
  60% * $3 + 40% * $0 = $1.80 EV.
  Dana is right on EV.
  But if we bet $40M and lose, we have $0.
  Utility of $0 is not just "less money", it's "mission failure".
  Utility of $80M (win) is "more grants".
  Is Utility(Mission Failure) < Utility(Extra Grants)? Yes, obviously.
  So we maximize Expected *Utility*, not Expected *Value*.

  Okay, let's draft.
answer: |-
  **MEMORANDUM**

  **TO:** The Board of Trustees
  **FROM:** [Your Name], Investment Committee
  **DATE:** October 24, 2023
  **SUBJECT:** Recommendation Regarding Binary Opportunity Fund & Risk Policy

  ### Executive Summary

  We have been offered a unique investment opportunity: a concentrated stake in a binary clinical trial outcome with a positive expected value (EV). Dana and I agree this is a mathematically favorable bet. We disagree on the appropriate size of the wager relative to our endowment.

  I recommend we **commit 15% of the endowment ($6M)** to this opportunity, with a hard cap that preserves our ability to meet all planned grant obligations through 2032 even in a total loss scenario. Furthermore, I propose we adopt a standing **"Solvency First" policy** for all future non-diversified investments, ensuring that no single position can threaten the foundation's operational continuity.

  ### The Opportunity

  *   **Asset:** Single-asset binary outcome (drug approval).
  *   **Probability:** 60% success (per independent analysis).
  *   **Payoff:** 3.0x gross return on success; 0.0x on failure.
  *   **Expected Value:** $1.80 returned for every $1.00 invested.
  *   **Capacity:** Up to 100% of endowment.

  ### The Case for Maximizing Exposure

  Dana has articulated the strongest version of the "maximize exposure" argument, and it deserves to be recorded faithfully. His position rests on three pillars:

  1.  **Fiduciary Maximization:** Our sole purpose is to serve our beneficiaries. In a spend-down foundation, every dollar of expected value translates directly to potential grant dollars. To decline a +78% expected return opportunity is to effectively burn money that belongs to the people we serve.
  2.  **The Finite Horizon:** Standard risk management (like the Kelly Criterion) assumes an infinite series of bets where "ruin" means you can't play tomorrow. We are winding down by 2032. There is no "tomorrow" beyond that date. Therefore, volatility and risk of ruin are secondary to the final aggregate dollar count.
  3.  **Opportunity Cost:** If we invest conservatively (e.g., 10%) and the bet succeeds, we have denied our beneficiaries the upside on the remaining 90%. In a worst-case scenario where the bet fails, we simply have less to give. In the maximization scenario, we either give significantly more or we give nothing. Dana argues that the *expected* outcome of the latter is still higher than the former.

  This is a coherent, utilitarian argument. If we were a hedge fund with no liabilities, Dana would be correct.

  ### The Case for Constrained Exposure

  However, we are not a hedge fund. We are a grant-making institution with a specific liability stream: the promised grants through 2032. My recommendation to cap exposure is based on the distinction between **Expected Value** and **Expected Utility**.

  **1. The Liability Mismatch**
  Our endowment is not a lump sum of profit; it is the funding source for a fixed obligation. We owe approximately $2M annually in grants for the next eight years. These are liabilities. If we invest 100% of the endowment and the bet fails, we do not merely have a "bad year"; we default on our liabilities. We cease to exist. The utility of failing our mission is not linearly proportional to the loss of capital; it is catastrophic.

  **2. The "Finite Horizon" Paradox**
  Dana argues that because our life is finite, we should take more risk. I argue the opposite. Because we are in spend-down mode and have **no ability to recapitalize** (no donors to call upon), we have zero margin for error. A hedge fund can raise capital after a loss. We cannot. Our finite life makes us *more* fragile, not less. We must ensure solvency for the duration of our mandate, not just maximize the terminal value.

  **3. Diminishing Marginal Utility of Grants**
  Does doubling our grant budget double our impact? Rarely. Operational capacity limits how much effective grant-making we can do in a short window. Conversely, does cutting our grant budget to zero cut our impact to zero? Yes. The pain of closing our doors in Year 1 outweighs the gain of writing larger checks in Year 8. We must optimize for *consistent impact delivery*, not *maximum potential dollars*.

  ### Recommendation: Commitment Size

  I propose we invest **$6M (15% of the endowment)**.

  *   **If the bet fails:** The endowment drops to $34M. We can still fund the $2M/year payout through 2032, perhaps with minor adjustments to the schedule or investment returns on the remaining capital. The mission continues.
  *   **If the bet succeeds:** The $6M becomes $18M. The total endowment grows to $52M. This provides a massive surplus to accelerate grants, extend the foundation's life beyond 2032, or seed a successor vehicle.

  This allocation captures significant upside (an expected $4.8M profit) without jeopardizing the foundation's existence. It acknowledges Dana's math while respecting our fiduciary duty to remain solvent.

  ### Proposed Standing Policy: The "Solvency First" Rule

  To prevent this debate from recurring ad hoc, I recommend the Board adopt the following guideline for any single-asset or binary investment opportunity:

  1.  **Liability Floor:** We must calculate the Present Value of all committed future grants (through 2032). This amount must remain invested in liquid, low-risk assets. It is never available for high-risk concentration.
  2.  **Risk Cap:** No single binary or non-diversified position may exceed 15% of the total endowment value at the time of investment.
  3.  **Ruin Test:** For any high-risk proposal, the Investment Committee must demonstrate in writing that a 100% loss of the committed capital would not force the foundation to suspend operations or default on granted commitments.

  ### Conclusion

  Dana is right that we should not be "precious" with capital that belongs to our beneficiaries. But we are stewards, not gamblers. Our primary duty is to ensure the money gets to the beneficiaries at all. By capping this bet at 15%, we honor the math without mortgaging the mission.

  I ask the Board to approve the $6M commitment and the accompanying Solvency First policy.
