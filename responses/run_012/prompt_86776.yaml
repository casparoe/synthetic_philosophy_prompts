      *   *Missing Misconceptions:*
          1.  "The strand is the enzyme" (Category error: Strand is data, Enzyme is function).
          2.  "Self-replication means identical output" (Ignores mutation/typo potential).
          3.  "The system is closed" (Ignores the external interpreter/ribosome equivalent).

  6.  **Drafting Section 4: Final Question:**
