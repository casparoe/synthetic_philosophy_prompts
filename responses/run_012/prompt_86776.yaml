  2.  **Deconstruct the Challenge:**
      *   *Typogenetics* is abstract. It's a formal system mimicking biology to mimic logic.
      *   *Students* lack the technical machinery (diagonalization, biochemistry).
      *   *Goal:* Convey the *structural* isomorphism without getting bogged down in the mechanics of the proof or the biology.
      *   *Key Hurdle:* Understanding how "syntax" (the strand) can determine "semantics" (the enzyme's action) which in turn modifies the "syntax," specifically when the syntax describes the semantics.

  3.  **Drafting Section 1: Order of Ideas:**
      *   *Logic:* You can't talk about self-replication until they know how the system *works*. You can't talk about the isomorphism until they see the duality of the strand (data vs. program).
      *   *Sequence:*
          1.  The Formal System (Syntax): Strands as static strings.
          2.  The Interpretation (Semantics): Translation rule (Strand $\to$ Enzyme).
          3.  The Action (Dynamics): Enzyme acting on Strand.
          4.  The Crucial Turn: The Strand *is* the Enzyme's blueprint.
