          5.  *Better approach:* Use a strand that codes for an enzyme that *modifies* the strand in a way that produces the original strand (self-reproduction) OR a strand that codes for an enzyme that does nothing to itself (to show the distinction).
          6.  *Safest Bet:* Define the properties of a "Self-Replicating Strand" in Typogenetics terms without committing to a specific sequence that might violate the handout's specific binding rules (which I don't see). I will specify the *structural requirements* (e.g., must contain a 'copy' amino acid, must have a binding site that matches the enzyme's preference).
