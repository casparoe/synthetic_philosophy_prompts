answer: |-
  The ink on the Orders never quite dried, leaving a smudge of grey on the thumb of anyone who counted them too long. Elias rubbed his thumb against the wool of his sleeve as he sat behind the high grate of the Exchange Hall. Outside, the harbour bells tolled the hour of unloading, but inside, the air was still and smelled of damp paper and vinegar.

  On the desk before him lay a stack of Orders, the lifeblood of Ostra. They were simple things: rectangular slips of linen pulp, stamped with the Commonwealth seal, denominated in Days. A One-Day Order claimed a day's labour from the common stock; a Ten-Day Order claimed a crate of cured fish or a length of timber. There was no gold in the vaults beneath the floorboards, only more paper, and the ledger that tracked the flow. Bishop Caelum's doctrine was plain: wealth was the fish in the sea and the hands to pull them out. The Orders were merely the spark that moved the hands.

  Elias sorted the morning's returns. A fisherman had paid his tithe in Three-Day Orders; a carpenter had exchanged a Fifty-Day for grain. The velocity was good. The paper moved quickly from hand to hand, stirring the industry like a spoon in a pot. When the Orders circulated fast, the island prospered. When they stuck in a pocket, the nets stayed dry.

  The heavy oak doors of the Hall creaked open, breaking the rhythm of the sorting. A man entered who did not belong to the tide of Ostra. He wore a coat of foreign cut, heavy with buttons, and he carried a chest. He was Valerius, a merchant from the mainland, where they still worshipped the yellow metal.

  "I wish to trade," Valerius said. His voice was dry, unused to the salt air.

  "We take no bullion here," Elias said, not looking up. "Bring labour or bring goods. The Exchange issues Orders against production."

  "I do not wish to issue. I wish to purchase." Valerius set the chest on the counter. It clanked, a dull, heavy sound that seemed to vibrate in the quiet hall. He opened the lid. Gold coins caught the light from the high windows, gleaming with an intrinsic heaviness that the linen Orders lacked. "I will buy your Orders. I will pay in this."

  Elias looked at the gold, then at the stack of Orders. "Why? You cannot spend gold in the market. The baker will not bite it to test its worth."

  "They will spend it with you," Valerius said. "I know your Commonwealth sells its surplus timber to the mainland. I know you accept metal for external debts. I will buy the Orders from your people. They love the shine. I will take the paper."

  It was a subtle arbitrage. The islanders, tempted by the solidity of the gold, began to trade their Claims for Valerius's coins. They reasoned that while the Order was a claim on labour, the gold was a claim on the world. Within a week, Valerius had accumulated a significant portion of the circulating supply. He sat in the corner of the Hall, watching the flow diminish.

  The effect was immediate. The pot stopped stirring. With fewer Orders in circulation, the fishermen hesitated to cast nets they couldn't pay for. The carpenters waited for commissions that weren't coming. The velocity had dropped. The money was not moving; it was sleeping in Valerius's chest, and the industry of Ostra began to starve.

  Elias watched the stalls in the market square grow quiet. The theory held that money was merely a counter, but the removal of the counters had stopped the game.

  The second disturbance arrived on a Tuesday, brought in by the Harbour Watch. They dragged a man named Tomas through the doors, his hands bound. Tomas was a net-mender, rough-handed and smelling of tar. On the table before Elias, the Watch Captain dumped a stack of paper.

  "Counterfeit," the Captain said.

  Elias picked up one of the slips. It was crude, printed on rougher stock, but the denominations were correct. Five Days. Ten Days. "Where did you get these?"

  "I made them," Tomas said. He stood straight, despite the ropes. "My crew needed pay. The Exchange was dry. You said it yourself, Clerk: money is just a device to stir industry. My men were working. The nets were being mended. I issued the claims against my own labour. What injury is there? The work was done."

  "You breached the Convention," the Captain snapped. "You undermined the State's sole right to reckon."

  "The State reckons based on labour," Tomas argued, his eyes fixed on Elias. "If the Order is a ticket for work, and the work is real, the ticket is real. If I print a ticket and give it to a man who works, I have created wealth. If the State prints a ticket and gives it to a man who sits, who has created wealth? Tell me that."

  Elias said nothing. He looked from Tomas to the corner where Valerius sat. The outsider was watching now, a faint smile on his lips. He had bought the power to command labour without lifting a finger. Tomas had tried to command labour by lifting a finger, and was bound for it.

  Valerius stood up. He walked to the counter, placing a heavy bag of gold beside Tomas's crude papers. "Release him," Valerius said.

  "This is internal justice," the Captain said.

  "Release him," Valerius repeated, "and I will return the Orders. I will put them back into circulation. I will spend them today. All of them."

  The Hall went silent. The choice hung in the air, heavy as the gold. Valerius had proven the fragility of the system. He had shown that while the Orders had no intrinsic value, their scarcity conferred power. By hoarding them, he had seized the power over the island's labour. He could now demand the timber, the fish, the ships. He owned the Claims.

  But Tomas challenged the source of that power. If the Orders were merely tokens of labour, why could not labour create its own tokens? If the injury of counterfeiting was only to the State's monopoly, and not to the substance of wealth, then Tomas was no criminal. He was a competitor in the business of reckoning.

  Elias looked at the crude papers. They were promises of work already done. He looked at Valerius's gold. It was a promise of value from outside, bought with the island's own future.

  "If I release him," Elias said, his voice quiet, "you must spend the Orders. You must break your hoard."

  "I intend to," Valerius said. "I wish to purchase the winter stock of timber. I have the Orders. I have the right to claim the labour of the woodcutters."

  "And if they refuse?" Elias asked. "If the woodcutters say your Orders are just paper, and they prefer to wait for the State's issue?"

  "Then they starve," Valerius said simply. "They need the Orders to buy grain from the Exchange. I hold the Orders. I hold the power. That is what your Bishop taught, is it not? Money is power over the labour of others. I have bought that power."

  Tomas shifted. "He holds the paper. He does not hold the hands. You can print an Order for a man's life, but you cannot print the strength in his arm. If the woodcutters know I am free, they know the State is afraid. They will know the paper is only as strong as the belief in it."

  Elias looked at the stamp on his desk. The iron seal of the Commonwealth. It was the only thing that separated the linen from the trash. If he stamped Tomas's papers, he validated the idea that labour creates money. If he accepted Valerius's gold, he validated the idea that money needs metal. If he did neither, the system collapsed into barter and the winter would be hard.

  He picked up the stamp. He looked at Valerius. The outsider's eyes were cold, calculating the boarders of timber against the weight of his chest. He saw the island as a machine to be owned.

  He looked at Tomas. The net-mender's eyes were hot, burning with the conviction that his work was the only true currency. He saw the island as a community to be sustained.

  Elias placed Tomas's crude Orders under the stamp. He did not ink it. He simply held the iron there, hovering over the paper.

  "The injury of the forger," Elias said, speaking to the room, "is not that he creates value. It is that he creates confusion. If any man may print the claim, the claim becomes noise. The signal is lost. The labour stops because no one knows which ticket buys the bread."

  He moved the stamp to Valerius's pile of legitimate Orders.

  "The injury of the hoarder," Elias continued, "is that he silences the signal entirely. He stops the circulation. He turns the blood to clots."

  Elias lifted the stamp. He brought it down hard on Valerius's stack of Orders. *Thud.* He did it again. *Thud.* He was not validating them; they were already valid. He was marking them for expenditure. He took a quill and wrote across the face of the top Order: *Payable to the Woodcutters' Guild. Immediate.*

  "You want the timber?" Elias asked Valerius. "Then you must pay for the labour. But you cannot command it. You must invite it. You will hand these Orders to the woodcutters directly. Not to me. To them. And you will tell them that if they cut the timber, you will ensure these Orders are accepted at the Exchange for grain."

  "And if they refuse?" Valerius asked.

  "Then you have no timber," Elias said. "And you have no power. You have only paper."

  Valerius hesitated. He had expected to buy the commodity. He was being told he had to buy the cooperation. The distinction was the difference between a master and a partner.

  "And him?" The Captain nudged Tomas.

  Elias looked at the crude papers. He gathered them up. "These are not Commonwealth Orders. They are private notes. They are valid only between Tomas and his crew. If the baker accepts them, that is the baker's risk. The Exchange will not honour them. But the State will not punish their creation, provided they are clearly marked as private debt."

  "That undermines the monopoly," the Captain protested.

  "It preserves the velocity," Elias corrected. "Let them circulate in the lower markets. Let them stir the small pots. We will keep the large claims here."

  Valerius snapped his chest shut. The gold remained inside. He had not needed to spend it, yet he had not gained the total control he sought. He held the Orders, but the labour remained elusive, contingent on the willingness of the woodcutters to trust his sudden generosity. He turned to leave, the weight of the gold shifting inside the box, a dead weight in a world of moving paper.

  Tomas stood unbound. He gathered his crude notes. They were worthless at the Exchange, but in the taverns tonight, they might buy a drink if the men believed in the net-mender's honour.

  Elias sat back. The Hall was quiet again. The bells outside tolled the hour of loading. The wind picked up outside, rattling the shutters. A single Order, loose from the stack, caught the draft. It slid across the polished wood of the desk, fluttering toward the floor.

  Elias did not reach for it. He watched it drift. It landed near the foot of the counter, face up. A Ten-Day Order. A claim on labour. A promise of bread.

  Valerius paused at the door. He looked down at the ticket on the floor. He did not pick it up. To bend for it would be to admit he needed it. He stepped over it, the heel of his boot grinding the linen into the dust of the threshold.

  Tomas followed him out. He paused, looked at the trampled ticket, and stooped. He smoothed the crease with his thumb, wiping away the dirt. He tucked it into his vest, next to his skin.

  Elias dipped his quill into the ink. There were ledgers to balance, claims to record, and the tide was coming in. He wrote the date in the top corner of the page. The ink was wet and black, and for a moment, it looked like gold, before it dried into the grey of the everyday.
