answer: |-
  Your intuition that something feels off about your PI's reasoning is well-founded, and it stems from a fundamental misunderstanding of what informed consent is actually designed to protect. At its core, informed consent is not merely a safety waiver where participants agree to avoid physical danger; it is an exercise in autonomy that allows individuals to decide what kinds of experiences they are willing to undergo based on their own values and thresholds. When your PI argues that the deception does not touch anything that matters because the study was not dangerous, they are conflating physical safety with psychological integrity. In psychology research, especially involving social exclusion, the psychological experience is the primary variable, and causing distress is a tangible risk even if it does not rise to the level of danger. By withholding the true nature of the study, you removed the participant's ability to weigh that specific emotional risk against her willingness to participate, which undermines the validity of her consent regarding the actual procedures she endured.

  The argument that she would have agreed anyway if told the truth is ethically insufficient because it relies on hypothetical consent rather than actual consent. Researchers cannot reliably predict what another person would deem acceptable, especially when it comes to emotional vulnerability. Some participants might be willing to endure social exclusion for science, while others might have personal histories, such as past trauma or current mental health struggles, that make such an experience unacceptable regardless of safety. By deciding for her that the risk was negligible, your PI is substituting their own judgment for the participant's right to self-determination. Ethics codes generally require that deception be justified by significant prospective scientific value and that participants be given the option to withdraw their data after debriefing precisely because we acknowledge that hypothetical consent is not a valid substitute for the real thing.

  Furthermore, the fact that she did not quit during the study does not invalidate her request to withdraw data afterward, particularly in deception research. During the task, she was operating under false pretenses, meaning she could not exercise her right to withdraw from the specific risk of social exclusion because she was unaware that risk existed. The debriefing session is the critical moment where true informed consent is retroactively sought; it is the point where the participant is given the full picture and asked if they are still willing to contribute their data. Her anger and subsequent request to withdraw are a clear indication that, had she been informed initially, she would not have consented. The delayed emotional reaction is also common in deception studies, as participants often need time to process the manipulation after the immediate pressure of the lab environment has faded.

  Ultimately, your PI's argument breaks down because it prioritizes data retention over respect for persons. The ethical justification for deception hinges on the promise that participants can remove themselves from the dataset once the truth is revealed. If you deny that right based on the assumption that they should not have been bothered in the first place, you violate the agreement that makes deception permissible. Her consent was valid for the cover story, but not for the actual procedure, and her post-debrief withdrawal request is the mechanism that repairs the initial ethical breach. Honoring her request is not just about following protocol; it is about acknowledging that her assessment of her own discomfort matters more than the lab's assessment of her risk.
