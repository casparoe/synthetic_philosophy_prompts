answer: |-
  Gongsun Long would side with the dairy lobby, but not for the reasons they think. He wouldn't care about consumer confusion, economic protectionism, or nutritional profiles. He would rule that "almond milk" is logically not "milk" because his entire philosophical project rests on the non-identity of compound terms and simple terms.

  Here is the position he would land on, argued out from his own premises.

  ### The Verdict on Almond Milk
  Gongsun's "White Horse Not Horse" argument relies on the distinction between **extension** (the set of things a word picks out) and **intension** (the criteria required to use the word).

  1.  **The Request Test:** If you demand "a horse," a yellow or black horse satisfies the request. If you demand "a white horse," a yellow horse fails. Therefore, the conditions for satisfying "white horse" are stricter than for "horse."
  2.  **The Identity Test:** If $A$ were identical to $B$, then anything true of $A$ must be true of $B$. But "seeking a horse" $\neq$ "seeking a white horse." Therefore, "horse" $\neq$ "white horse."

  Apply this to milk:
  *   **Term A:** "Milk." In the traditional linguistic framework (which fixes the reference), this picks out mammary secretions from mammals.
  *   **Term B:** "Almond Milk." This picks out a plant-based emulsion.
  *   **The Logic:** If you ask for "milk," and I hand you almond juice, have I satisfied the request? In the strict sense that fixes the name "milk," no. If the term "milk" implies an animal origin, adding the modifier "almond" changes the essence of the substance so fundamentally that the extension of the two terms do not overlap.

  Gongsun would argue that "Almond Milk" is a compound name ($Modifier + Substance$). Just as "White" + "Horse" $\neq$ "Horse," "Almond" + "Milk" $\neq$ "Milk." To call it "milk" is to claim it belongs to the extension of the term "milk." It does not. Therefore, labeling it "almond milk" is a category error akin to calling a yellow horse a white horse. He would support the regulation that restricts the root term "milk" to the original extension, because allowing the modifier to hijack the root term corrupts the logical precision of language (*Zhengming*).

  ### The Push: Dwarf Planets, Fake Diamonds, Hot Dogs
  If "White Horse is not Horse," then $Modifier + Noun \neq Noun$. Gongsun is forced to be consistent. Here is how he handles the edge cases:

  **1. Dwarf Planet**
  *   **Verdict:** A dwarf planet is not a planet.
  *   **Reasoning:** This is the perfect modern analog to "White Horse." The IAU definition explicitly states that a dwarf planet has not "cleared its neighborhood." The modifier "dwarf" restricts the class "planet" so severely that it excludes the object from the parent class. Gongsun would nod approvingly. The name "dwarf planet" is a distinct name for a distinct class. To say "Pluto is a planet" is logically false, just as "This white horse is a horse" is logically false (in terms of naming identity).

  **2. Fake Diamond**
  *   **Verdict:** A fake diamond is not a diamond.
  *   **Reasoning:** This is even stronger than the white horse. "White" is an accidental property of a horse; the horse still exists. "Fake" is a negation of the essence. A "fake diamond" (cubic zirconia) lacks the carbon-crystal structure that fixes the reference of "diamond." Gongsun would say the name is merely a label for an imitation. It shares the *name*, but not the *actuality* (*Shi*).

  **3. Hot Dog**
  *   **Verdict:** This is a "confused name" and should be abolished or corrected.
  *   **Reasoning:** Here the analogy breaks, and Gongsun would pounce. "White Horse" is $Attribute + Substance$. "Hot Dog" is $Attribute + Substance$, but the substance (Dog) is absent. There is no dog. This violates the link between Name (*Ming*) and Actuality (*Shi*). It is not just that $A+B \neq A$; it is that $B$ does not exist. He would argue this is linguistic chaos. It should be renamed "Hot Sausage" or "Frankfurter" to rectify the name.

  **4. Decaf Coffee**
  *   **Verdict:** Decaf coffee is not coffee.
  *   **Reasoning:** This depends on what fixes the reference of "Coffee." Is it the bean water, or the bean water *plus* the stimulant effect? If you order coffee in a social context, the expectation includes the caffeine. Removing the caffeine changes the functional essence. Following the "White Horse" logic: If you ask for "coffee" (expecting stimulation), "decaf" fails the request. Therefore, "Decaf Coffee" $\neq$ "Coffee." It is a distinct beverage that borrows the name.

  ### Where is the Line?
  Can Gongsun dodge these conclusions? No, because he doesn't want to. His point isn't to describe biological reality (he admits white horses exist); it's to describe **logical reference**.

  The principled basis for the line is **Set Membership**.
  *   Does the modified term belong to the set of the unmodified term?
  *   Gongsun's answer is always **No**.
  *   The set of "White Horses" is a subset of "Horses," but the *concept* "White Horse" is not identical to the *concept* "Horse."
  *   However, in the case of labeling laws, the issue is whether the subset can use the parent label. Gongsun would argue that if the modifier changes the *essence* (animal vs. plant), the parent label is invalid. If the modifier only changes an *accident* (hot vs. cold coffee), the parent label might hold, but "Decaf" removes a chemical property, which he might view as essential to the *function* of the name.

  The line is drawn at **Essential vs. Accidental Properties**.
  *   "White" is accidental to a horse's existence, but essential to the term "White Horse."
  *   "Almond" is essential to the substance, and contradicts the essence of "Milk" (mammary).
  *   Therefore, "Almond Milk" is a misnomer.
  *   "Hot Dog" is a lie (no dog).
  *   "Dwarf Planet" is a distinct category (not a planet).

  He cannot dodge. He is committed to the view that language carves reality at specific joints, and smearing those joints with modifiers creates logical falsehoods.

  ### Note on the Modern Philosopher of Language
  A present-day philosopher of language (drawing on Wittgenstein or Putnam) would likely break from Gongsun on the basis of **usage and natural kinds**.

  *   **Wittgenstein:** Would argue that meaning is use. If everyone in a vegan context understands "milk" to include almond juice, then it *is* milk within that language game. Gongsun ignores context; the modern pragmatist embraces it.
  *   **Putnam:** Would look at the "hidden structure." For "water," it's H2O. For "milk," is it a biological secretion or a nutritional profile? If "milk" is a functional kind (white, opaque, calcium-rich liquid), almond milk qualifies. Gongsun treats "milk" as a rigid logical container; a modern philosopher might treat it as a cluster concept that can expand as technology and culture evolve.

  Gongsun demands logical purity ($A+B \neq A$). The modern philosopher asks, "What work is this word doing, and does it confuse anyone?" Gongsun would say the confusion proves the name is wrong; the modern might say the lack of confusion proves the name is right.
