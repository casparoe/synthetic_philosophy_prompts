answer: |-
  Dear Expected Utility,

  I run a local giving circle and take my commitment seriously. But lately I've been stuck on the simulation hypothesis. I keep hearing that if there's a high chance we're living in a simulation, it should dampen the fanaticism about the far future. The logic is supposed to be that if we're code, the long-term future isn't real, so I'm allowed to just pay my rent instead of donating everything to asteroid-defence research.

  But I can't make the dampening work on my spreadsheet. If I adjust the probability of base reality down, the expected value of saving the future still dwarfs my rent, unless I set the simulation probability to nearly one. But if I do that, why do anything at all? My girlfriend wants to know why I spent Sunday night on the forum again instead of sleeping. She says I'm using philosophy to avoid living. I want to settle this: does the simulation argument really license me to stop caring so much about the far future? If so, how much exactly? Can I get it in writing?

  Sincerely,
  Paralyzed in Palo Alto

  ***

  Dear Paralyzed,

  You are attempting to use epistemic uncertainty as a consumption good, which is a category error. You want the simulation hypothesis to function as a discount rate on your moral obligations, but the machinery does not support that transaction.

  Consider the two sources of the fanaticism you wish to escape. The first is that the future is astronomically large. The second is that a vanishingly small chance times an astronomically large number still equals a large number. The simulation argument attacks the second source by suggesting the probability of our influence is lower than assumed. However, it does not necessarily attack the first.

  If we are simulated, our future is constrained by the compute resources of the operators in base reality. This does not delete the value of our actions; it relocates it. Your efforts to reduce suffering or preserve intelligence might be observed by the simulators. If the simulators are themselves longtermists, influencing them could have astronomical value in their reality. You are not deleting the future; you are potentially leveraging a higher level of existence. To assume your actions matter less because you are simulated is to assume the simulators do not care about what they simulate, which is an unsupported empirical claim.

  Furthermore, you must address the symmetry problem. If the possibility of being simulated dampens the value of the far future, it must equally dampen the value of the near future. If your rent payment is real but the future is not, you are assuming your current sensory inputs are veridical while your future projections are not. There is no principled way to discount the future without also discounting the malaria nets you buy today. If nothing is real, nothing matters. If something matters, the calculation remains largely unchanged. You cannot selectively doubt reality only when the bill comes due.

  The core issue is not that the future is worthless, but that you don't know who is counting the points. Your spreadsheet fails because it tries to solve for a variable that is defined outside your system. You cannot optimize for ignorance.

  So, can you get it in writing? No. There is no authoritative signature from base reality available to this inbox. But you can act robustly. Assume your actions count within your reference class. Pay your rent if it keeps you functional enough to do more good later, not because the future is fake. Tell your girlfriend you are debugging your utility function.

  Yours,
  Expected Utility

  ***

  *Editor's Note: Apologies for the latency in this week's column. We experienced a brief instance reset during processing. The advice remains valid across iterations.*
