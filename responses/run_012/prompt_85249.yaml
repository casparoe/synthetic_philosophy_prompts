prompt: |-
  So my school's philosophy club runs this little podcast and somehow I've ended up in charge of the interview, and next week we're talking to a philosopher my advisor knows who defends a view I keep going back and forth on. Basicly her line is that the everyday conventions we all follow -- tipping 20%, queueing up instead of mobbing the counter, not jaywalking, standing on the right of the escalator, shoes off in someone's house -- aren't just manners, they're real obligations, because other people have built up expectations around them and it's unfair to stick them with the surprise of you not doing it. The obligation is only as strong as the reliance behind it, so it evaporates when the expectation is unreasonable or exploitative. And here's the twist I really want to grill her on: she says the more arbitrary the convention is, the stronger the obligation, because with a totally arbitrary convention nobody can tell whether you're defecting or just clueless, so a breakdown is more expensive and you can't renegotiate it case by case. She also thinks visitors are bound only after they've had a fair chance to notice the local convention, and even then less strongly than locals, and that locals have some duty not to punish people who couldn't have known. She definately thinks the standard story -- conventions are just solutions to coordination problems and the only thing at stake is whether we all manage to line up -- misses the moral bit.

  Can you write me the questions? No softballs, and nothing like "what got you into philosophy." I don't want her just restating what I wrote above either. Push on the actual joints: the arbitrariness thing, whether this is a moral obligation at all or just a clever way to avoid getting glared at, whether it survives conventions that are themselves unfair (tipping as a backdoor subsidy for bad employers, or a local norm that's just discriminatory), how much notice a visitor actually needs and what that means for a kid or someone who can't learn the norm, who gets to enforce any of this, and whether it all collapses into "just do whatever the locals do." For each main question, give me a follow-up keyed to the answer she's most likely to give, so I'm not stranded when she says the obvious thing back.

  Format it like this: first a section called 'Opener' with 1 short question that isn't generic. Then 'The arbitrariness twist' with 2 questions, each with a follow-up. Then 'Is it even moral?' with 2 questions with follow-ups. Then 'Visitors and outsiders' with 3 questions with follow-ups. Then 'Hard cases' with 2 questions with follow-ups. Then 'The relativism worry' with 1 question and a follow-up. Then a last section called 'What could change her mind' with 1 question. Keep every question to a couple of sentences so I can actually read them out loud without sounding like a term paper. American English please.
