  # Opener

  You argue that breaking a convention isn't just inefficient, it's actually unfair to the people relying on you. But why does their expectation create a duty for me, rather than just a disappointment for them?

  # The arbitrariness twist

  **1.** You claim the more arbitrary a rule is, the stronger the obligation to follow it. That seems backwards; shouldn't moral weight depend on the outcome, not how random the rule is?

  *Follow-up (If she says arbitrary rules need strict adherence to function):* So does that mean the obligation is just about maintaining the system, not respecting the people in it?

  **2.** You say we can't renegotiate these rules case-by-case because it's too expensive. But doesn't that treat people like cogs in a machine rather than individuals who might have good reasons to deviate?

  *Follow-up (If she says predictability is key):* But if predictability overrides individual reason, aren't you just saying conformity is the highest virtue?

  # Is it even moral?

  **1.** Is the "wrongness" here actually moral, or just prudential? If I don't tip, I get glared at. Is that glare the sanction, or is there genuine harm?

  *Follow-up (If she says the harm is the violated expectation):* But isn't that circular? The expectation exists only because people already think the rule is required.

  **2.** If the only reason to follow the rule is to avoid surprising others, doesn't that collapse morality into not being annoying?

  *Follow-up (If she says fairness is the core):* But is it fair to uphold a norm that benefits some and burdens others just to avoid surprise?

  # Visitors and outsiders

  **1.** You say visitors need a "fair chance" to notice the norm. Who decides what counts as fair notice, especially for someone who doesn't speak the language well?

  *Follow-up (If she says it's about reasonable effort):* But doesn't that put the burden on the outsider to read minds rather than on locals to be clear?

  **2.** What about kids or people who struggle to learn social cues? Are they morally culpable when they break these conventions unintentionally?

  *Follow-up (If she says locals shouldn't punish ignorance):* But if there's no punishment, is it still an obligation for them, or just a suggestion?

  **3.** You say locals have a duty not to punish ignorance. How do we enforce that duty without creating a new convention about not enforcing conventions?

  *Follow-up (If she says it's a secondary norm):* Doesn't that create an infinite regress of norms about norms?

  # Hard cases

  **1.** Let's talk about tipping. If the convention exists because employers underpay staff, doesn't following it just make you complicit in a bad system?

  *Follow-up (If she says reliance matters regardless):* But if the reliance is on an unjust structure, doesn't your theory force us to uphold injustice to avoid surprise?

  **2.** What if a local convention is discriminatory, like expecting certain groups to stand aside? Does reliance make that obligatory until it changes?

  *Follow-up (If she says unreasonable expectations evaporate):* But who decides when it's unreasonable—the person relying or the person breaking the norm?

  # The relativism worry

  **1.** If obligation comes from local expectation, doesn't this mean morality changes completely every time you cross a street?

  *Follow-up (If she says core fairness is constant):* But if the content of the duty depends entirely on local habit, aren't you just dressing up conformity as ethics?

  # What could change her mind

  **1.** What kind of case would convince you that a convention is *never* obligatory, even if everyone relies on it?
