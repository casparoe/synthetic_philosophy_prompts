  Consider a silica garden forming spontaneously in a tank of silicate solution when a crystal of metal salt is dropped in. The system maintains a chemical gradient (Y) by growing hollow precipitate tubes (X) that channel fresh reactants to the reaction site. If the tip of a growing tube is physically sealed, blocking the flow of reactants, the internal osmotic pressure rises until the tube wall ruptures at a structurally weaker point lower down, instantly establishing a new outlet (Z) that restores the flow and continues the growth. This switch from extending to bursting is not directed by any internal map or prior selection, but arises inevitably from the physical coupling of reaction rates and membrane strength, yet it reliably preserves the end state across varied obstacles.

  This case successfully isolates a means-end structure that operates without history, design, or representation, grounding the "in order to" in physical feedback rather than intent or evolution. (a) The case meets your constraints: there is no designer (it forms spontaneously), no selection history (it is a physico-chemical event, not a reproducing lineage), no learning (it happens on the first trial), and no representation (osmotic pressure is a force, not a symbol). The "reason" lives in the negative feedback loop itself: the causal structure where the variable being controlled (pressure) directly modifies the mechanism of control (wall integrity) to preserve the system's state. (b) A selectionist (like Millikan) must deny this is genuine teleology, classifying it merely as "causal role function" or "as-if" purpose because it lacks an etiological history of selection. This is a significant cost: they must admit the counterfactual support is identical to biological cases but insist the history is what makes the difference, implying that a duplicate system with a history is "real" and this one is "fake" despite identical behavior. (c) A projectionist (like Dennett) must argue the goal is imposed by the observer adopting the intentional stance. However, the counterfactual robustness here makes that harder to hold: the system corrects itself regardless of whether anyone is watching or cares, suggesting the teleology is mind-independent rather than interpreter-dependent. (d) The single feature doing the heavy lifting is the homeostatic feedback loop; if you let the thing have a history (e.g., if these gardens reproduced and were selected for efficiency), the case collapses into the boring, uncontroversial version of biological proper function, losing its power to prove that history is unnecessary for rationale. (e) The selectionist attacks the case as rigged by arguing you've merely found a physical coincidence that mimics function without the normative grounding of survival, while the projectionist attacks it as rigged by claiming you are secretly smuggling in an observer's interest in "growth" to define the end state Y.
