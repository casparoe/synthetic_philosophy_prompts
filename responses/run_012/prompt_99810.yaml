  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the Request:**
      *   **Target Audience:** 18 advanced undergraduates (Philosophy & Economics).
      *   **Duration:** 90 minutes.
      *   **Topic:** Decision Theory & Paradoxes (specifically Two-Envelope Paradox).
      *   **Goal:** Experiential learning ("feel it in their hands"), not just lecture.
      *   **Key Mechanics:** Pairs of envelopes ($x, 2x$), open one, decide to swap. Points as stakes.
      *   **Desired Outcome:** Students generate the "always swap" argument themselves. "Always swap" should underperform or tie with cautious strategies over multiple rounds.
      *   **Specific Features:**
          *   Minimal setup instructions.
          *   Small group strategy formulation *before* opening.
          *   Structural twist (e.g., symmetric swap offer or threshold strategy phase).
          *   Detailed debrief connecting experience to theory (conditioning error, priors, undefined expectation).
          *   Anticipate problems (skepticism, variance, refusal to commit) and solutions.
          *   Acknowledge limitations (what the activity *can't* show).
      *   **Tone:** Professional, pedagogical, precise, honest about limitations.

  2.  **Deconstruct the Paradox & Pedagogy:**
      *   *The Paradox:* You have envelope A ($x$) or B ($2x$). You pick A. It contains $y$. B contains $y/2$ or $2y$. Expected value of swap = $0.5(0.5y) + 0.5(2y) = 1.25y$. Since $1.25y > y$, always swap. But symmetry says swapping shouldn't matter.
      *   *The Flaw:* Treating $y$ as fixed while assuming equal probability of $y/2$ and $2y$ for *any* $y$ implies an improper prior (uniform distribution over infinite positive reals).
      *   *The Experiment Challenge:* In a real classroom, there *must* be a maximum amount (bounded distribution). If students see a high number, they know they likely have the larger envelope. If they see a low number, they likely have the smaller.
      *   *The "Always Swap" Failure:* If the distribution is bounded, "Always Swap" loses money on the upper bound cases (swapping $2M$ for $M$) without gaining enough on the lower bound (can't swap $M/2$ for $M$ if $M/2$ isn't possible).
      *   *The "Threshold" Win:* A strategy like "Swap if $y < K$" can beat "Always Swap" and "Never Swap" if $K$ is chosen wisely relative to the distribution.

  3.  **Designing the Activity Structure:**
      *   **Group Size:** 18 students. 9 pairs is perfect.
      *   **Rounds:** Need enough rounds to smooth variance but not bore them. 10 rounds per phase? Maybe 3 phases.
      *   **Currency:** Points (course credit or candy). Let's use "Utility Points."
      *   **Envelope Generation:** This is critical. I cannot use a true infinite prior. I must use a bounded distribution unknown to them.
          *   *Idea:* Use a deck of cards or a pre-generated list.
          *   *Better:* The instructor holds the "Bank." The instructor generates pairs $(x, 2x)$ based on a specific distribution (e.g., powers of 2 from $2^1$ to $2^{10}$).
      *   **Phase 1: The Trap.** Pre-commit strategy. Most will write "Always Swap." Run rounds. Show results.
      *   **Phase 2: The Symmetry Twist.** Both players hold an envelope from the *same* pair. Both offered swap. (As requested). This highlights the logical contradiction immediately.
      *   **Phase 3: The Solution.** Allow threshold strategies. Show they perform better.

  4.  **Drafting the Timeline (90 mins):**
      *   0-10: Intro & Setup.
      *   10-25: Phase 1 (Strategy & Execution).
      *   25-40: Phase 2 (Symmetric Swap).
      *   40-55: Phase 3 (Thresholds).
      *   55-80: Debrief & Theory.
      *   80-90: Q&A / Wrap.

  5.  **Refining the Mechanics (The "Screw Turning"):**
      *   *Problem:* If I just hand them envelopes, they might suspect I'm rigging the numbers to punish swappers.
      *   *Solution:* Transparency in generation *after* the fact, or use a physical randomizer they trust (dice/cards) but kept hidden until reveal.
      *   *Better Solution for Class:* The Instructor is the "House." The House generates pairs. To prevent "rigging" accusations, use a public seed (e.g., last 2 digits of a stock price, or a random number table projected *after* the rounds).
      *   *Actually, for flow:* Pre-generate 20 pairs per group. Put them in sealed envelopes. The *distribution* is the secret.
      *   *Distribution:* Let's use powers of 2: $\{2, 4, 8, 16, 32, 64, 128, 256, 512, 1024\}$. Pairs are $(2,4), (4,8)...$. Wait, standard Two-Envelope is $(x, 2x)$. So if base is $2^k$, envelopes are $2^k$ and $2^{k+1}$.
      *   *Crucial Detail:* To make "Always Swap" lose, there must be a cap. If the max pair is $(512, 1024)$, swapping 1024 loses 512. Swapping 2 gains 2. The loss at the top outweighs gains if the distribution is uniform over the *pairs*.
      *   *Wait, check math:* If pairs are chosen uniformly from $\{(2,4), (4,8), ..., (512, 1024)\}$.
          *   Pick envelope. 50% chance it's the lower, 50% higher.
          *   If I have 1024, I *must* have the higher (since 2048 isn't in play). Swap loses 512.
          *   If I have 2, I *must* have the lower. Swap gains 2.
          *   Intermediate values (e.g., 4): Could be lower (pair 2,4) or higher (pair 4,8).
          *   "Always Swap" EV is actually negative near the boundaries.
      *   *Phase 2 (Symmetric):* Give Pair A to Student 1, Pair B to Student 2? No, request says "two participants each hold one of a pair." So Student 1 gets $x$, Student 2 gets $2x$. Both asked: "Swap?" If both say yes, they swap with each other. This makes the contradiction visceral. "We both think we gain, but the total money is constant."

  6.  **Addressing the "Predictably Go Wrong" Section:**
      *   *Variance:* 10 rounds might not be enough for the Law of Large Numbers to crush the lucky swappers. Need to aggregate class data.
      *   *Skepticism:* "You rigged the numbers." -> Use a verifiable random source for the distribution limits.
      *   *Gaming:* Students colluding. -> Isolate pairs.
      *   *Theory Gap:* They might think "Always Swap is bad" means "Never Swap is good." Need to emphasize indifference is the rational baseline (without info).

  7.  **Addressing the "What Activity Cannot Reproduce":**
      *   The activity uses a *bounded* prior (finite deck). The true paradox relies on an *improper* prior (infinite range). I must explain that the activity solves the *practical* version, but the *philosophical* paradox requires discussing the impossibility of a uniform prior over $\mathbb{R}^+$.
      *   The "Cover's Strategy" (randomized threshold beating 50/50) is hard to demo in 90 mins but must be mentioned.

  8.  **Developing the Materials:**
      *   Envelopes (physical or digital? Physical is better for "feel"). 18 students = 9 pairs. Need 10 rounds per phase = 90 pairs per phase. That's a lot of prep.
      *   *Optimization:* Use a spreadsheet projected on screen? No, loses the "hands-on" feel.
      *   *Compromise:* 9 pairs of students. Each pair gets a "Book" of 10 pre-sealed envelope pairs for Phase 1.
      *   *Prep:* Instructor prepares 9 kits. Each kit has 10 rounds. Inside each round: Envelope A and Envelope B. Values pre-determined.
      *   *Values:* Use the bounded power-of-2 distribution.

  9.  **Refining the Debrief:**
      *   Connect the "Cap" in the game to the "Prior" in the theory.
      *   Explain $E[Y|X=x] \neq 1.25x$ because $P(Y=2x|X=x)$ is not always 0.5.
      *   Mention the Bayesian resolution.

  10. **Review against Constraints:**
      *   90 mins? Tight but doable if transitions are sharp.
      *   18 students? 9 pairs works.
      *   Advanced undergrad? Can handle the Bayesian talk.
      *   "Feel it in hands"? Physical envelopes.
      *   "Always swap loses"? Bounded distribution ensures this.
      *   "Structural twist"? Phase 2 (Symmetric) and Phase 3 (Threshold).

  11. **Final Polish:**
      *   Make instructions for the instructor very clear.
      *   Ensure the "Trap" is set effectively (don't warn them about bounds).
      *   Write the handout text.
      *   Calculate the specific numbers to ensure the math works for the debrief. (e.g., if max is 1024, swapping 1024 loses 512. If min is 2, swapping 2 gains 2. The loss is bigger).

      *(Self-Correction on Math)*: If pairs are $(2,4), (4,8), (8,16)... (512, 1024)$. There are 10 pairs.
      Total money in play per round = $3x$ for pair $(x, 2x)$.
      If I always swap:
      Case $(2,4)$: I hold 2 (swap to 4, +2) or 4 (swap to 2, -2). Net 0.
      ...
      Case $(512, 1024)$: I hold 512 (swap to 1024, +512) or 1024 (swap to 512, -512). Net 0.
      *Wait.* If the pair is chosen uniformly, and the envelope within the pair is chosen uniformly, "Always Swap" has EV = 0 relative to "Never Swap". It doesn't *lose*, it just ties.
      *How to make it lose?* The paradox claims EV > Current. The reality is EV = Current.
      *To make "Always Swap" lose points:* I need to penalize the *action* of swapping? No, that's artificial.
      *To make "Always Swap" underperform a Threshold strategy:* A threshold strategy captures the gains at the bottom and avoids losses at the top. "Always Swap" captures gains at bottom but suffers losses at top.
      *Wait, if the distribution is symmetric regarding pairs:*
      If I have 1024, I know it's the max. I should not swap. If I do, I lose.
      If I have 2, I know it's the min. I should swap. If I do, I gain.
      If "Always Swap" swaps on 1024, they lose 512. If they swap on 2, they gain 2.
      Since 512 >> 2, "Always Swap" will have a *negative* expected return compared to a strategy that stops at the top.
      *Correction:* In the standard paradox, the amounts are $x$ and $2x$. The values are not fixed to specific pairs known to the player.
      *In the classroom game:* I must fix the set of possible pairs.
      Set of Pairs: $\{(2,4), (4,8), (8,16), (16,32), (32,64)\}$. (Keep it small for 10 rounds).
      If I pick a pair uniformly, and an envelope uniformly.
      Probability of holding 64: Only possible in pair (32,64) as the high envelope. Prob = $1/5 \times 1/2 = 1/10$.
      Probability of holding 32: Possible in (16,32) as high, or (32,64) as low. Prob = $1/10 + 1/10 = 2/10$.
      If I hold 64 and swap: I get 32. Loss = 32.
      If I hold 2 and swap: I get 4. Gain = 2.
      The loss at the top is much larger than the gain at the bottom.
      Therefore, "Always Swap" yields a negative expected return compared to "Never Swap" (which yields 0 change).
      *Perfect.* This ensures the "Always Swap" crowd finishes behind.

  12. **Finalizing the Plan:**
      *   Write it out clearly.
      *   Add the "Troubleshooting" section.
      *   Add the "Theoretical Limitations" section.
      *   Ensure the tone is supportive of the instructor.

  13. **Check Timing:**
      *   Intro: 10
      *   Phase 1 (Trap): 20 (Strategy + 10 rounds is too long for 10 rounds. Let's do 5 rounds per phase to save time. 5 rounds is enough to see trends if aggregated across 9 pairs = 45 data points).
      *   Phase 2 (Symmetry): 15
      *   Phase 3 (Threshold): 15
      *   Debrief: 30
      *   Total: 90.
      *   *Adjustment:* 5 rounds per phase is better for pacing. 9 pairs * 5 rounds = 45 observations per strategy. Enough for stats.

  14. **Wait, one more check on Phase 2:**
      *   "Two participants each hold one of a pair."
      *   If Student A has $x$ and Student B has $2x$.
      *   Both offered swap.
      *   If both swap, A gets $2x$, B gets $x$.
      *   A thinks: "I have $y$. Other is $y/2$ or $2y$."
      *   B thinks: "I have $z$. Other is $z/2$ or $2z$."
      *   Both calculate +25% EV.
      *   But total wealth is constant.
      *   This is the "Symmetric Paradox." It's strong. I will include this.

  15. **Ready to write.**
answer: |-
  # Lesson Plan: The Two-Envelope Paradox (Experiential Edition)

  **Course:** Decision Theory / Philosophy of Economics
  **Level:** Advanced Undergraduate
  **Time:** 90 Minutes
  **Class Size:** 18 Students (9 Pairs)
  **Goal:** Move the paradox from abstract calculation to felt experience, demonstrating the failure of the "Always Swap" argument through bounded priors and threshold strategies.

  ---

  ## 1. Materials & Preparation

  **The "Bank" (Instructor Prep):**
  You need 9 identical **Game Kits** (one per pair). Each Kit contains:
  1.  **10 Rounds of Envelopes:** 10 sets of two sealed manila envelopes per kit. Label them Round 1 through Round 10 on the outside.
  2.  **The Values:** Inside each Round's pair, place slips of paper with point values.
      *   **Distribution:** Use a bounded geometric distribution. This is the "hidden screw."
      *   **Possible Pairs:** $(2, 4), (4, 8), (8, 16), (16, 32), (32, 64)$.
      *   **Generation:** For each of the 10 rounds in a Kit, randomly select one of these 5 pairs (uniform probability). Then randomly assign which envelope gets the low value and which gets the high value.
      *   **Secrecy:** Do not tell students the maximum value (64) or the distribution.
  3.  **Strategy Sheets:** 3 sheets per student (one for each Phase).
  4.  **Scorecards:** 1 sheet per pair to record results.

  **Room Setup:**
  *   Tables arranged for 9 pairs.
  *   Projector for debrief equations.
  *   Whiteboard for aggregate scores.

  ---

  ## 2. Minute-by-Minute Timeline

  ### 0:00 – 0:10 | Introduction & Setup
  *   **Hook:** "Today we are testing a decision rule. You will play a simple game of chance. Your goal is to maximize points."
  *   **Rules:**
      1.  Work in pairs.
      2.  Each round, you receive two sealed envelopes. One contains $x$ points, the other $2x$.
      3.  **Student A** picks an envelope and opens it. **Student B** keeps theirs closed (initially).
      4.  Student A sees a value $V$. They must decide: **Keep** or **Swap** with Student B's closed envelope.
      5.  Record the final value.
      6.  *Crucial Instruction:* "Before we begin Round 1, you must write down your **Standing Strategy** for the next 10 rounds. You cannot change it mid-round. You must justify it in one sentence."
  *   **Hand out Kits.**

  ### 0:10 – 0:30 | Phase 1: The Trap (Pre-Commitment)
  *   **Strategy Formulation (5 mins):** Ask pairs to discuss and write their strategy.
      *   *Instructor Note:* Circulate. If a pair asks "What are the possible numbers?", say "You will find out as you play." If they ask "Is there a max?", say "Play and see." Do not prompt "Always Swap," but do not correct them if they derive it.
      *   *Expected Outcome:* Most Economics students will derive $E[\text{Swap}] = 0.5(0.5V) + 0.5(2V) = 1.25V$ and commit to **Always Swap**. Philosophy students may hesitate but often follow the math.
  *   **The Game (15 mins):** Run the 10 rounds.
      *   Student A opens, decides based on strategy, swaps (or not), reveals B's envelope, records points.
      *   Switch roles for Round 6 (so both experience opening).
  *   **Aggregate Data:** Collect the total scores for "Always Swap" pairs vs. "Never/Cautious Swap" pairs on the whiteboard.
      *   *Expected Result:* Due to the bounded max (64), "Always Swap" will suffer heavy losses when holding 64 (swapping to 32) that are not offset by gains when holding 2 (swapping to 4). The "Always Swap" group should statistically underperform the "Never Swap" group.

  ### 0:30 – 0:45 | Phase 2: The Symmetry Twist
  *   **Setup:** "We are resetting. New Kits. New Rule."
  *   **The Twist:** Both Student A and Student B open their envelopes *simultaneously*.
      *   They hold one half of a pair (e.g., A has 16, B has 32).
      *   They cannot show each other the numbers.
      *   Each privately writes: **Swap** or **Keep**.
      *   If *both* write Swap, they exchange envelopes. If *one* or *neither* writes Swap, they keep their original.
  *   **Task:** "Discuss with your partner for 2 minutes. Can you both rationally choose Swap? What happens to the total points in the pair if you both swap?"
  *   **Run 5 Rounds.**
  *   **Debrief Point:** This forces them to confront the zero-sum nature of the swap. If both reason "I expect to gain 25%," the total money in the pair must increase, which is impossible.

  ### 0:45 – 1:00 | Phase 3: The Threshold Solution
  *   **Setup:** "Final Phase. 5 Rounds. You may now condition your strategy on the number you see."
  *   **Task:** "Design a rule: 'If I see $V$, I swap if...'"
  *   **Hint:** "Look at the data from Phase 1. Did losing 32 points hurt more than gaining 2 points helped?"
  *   **Expected Strategy:** Students should converge on a **Threshold Strategy** (e.g., "Swap if $V < 32$").
  *   **Run 5 Rounds.**
  *   **Result:** This strategy should outperform both "Always Swap" and "Never Swap." It captures the gains at the bottom and avoids the catastrophic losses at the top bound.

  ### 1:00 – 1:30 | Theoretical Debrief
  *   **Step 1: The Data.** Compare the aggregate averages of the three phases.
  *   **Step 2: The Error.** Reveal the distribution (Max 64). Explain that the $1.25V$ calculation assumes $P(\text{Other} = 2V | \text{Mine} = V) = 0.5$ for *all* $V$.
      *   Show: If $V=64$, $P(\text{Other}=128) = 0$. The probability is not 0.5.
      *   **Key Concept:** You cannot treat the observed value $V$ as fixed while treating the pair generation as random without a prior.
  *   **Step 3: The Prior.** Explain that the paradox relies on an **improper prior** (uniform distribution over infinite positive reals), which is mathematically incoherent (cannot sum to 1).
  *   **Step 4: The Resolution.**
      *   "Always Swap" is not rational because it ignores the boundary conditions implied by any realizable distribution.
      *   "Never Swap" is safe but leaves money on the table (at the lower bounds).
      *   **Threshold Strategy:** This is the rational move given a bounded prior.
  *   **Step 5: Cover's Strategy (The "Magic" Trick).** Mention that even without knowing the bounds, a *randomized* threshold (pick a random number $T$ from some distribution; swap if $V < T$) yields $>50\%$ probability of ending with the larger envelope. This is the only sense in which "swapping helps."

  ---

  ## 3. Instructor Script & Key Questions

  **During Phase 1 (Circulating):**
  *   *Student:* "Should we swap?"
  *   *You:* "That's for your strategy to decide. Write down why."
  *   *Student:* "Is 64 the max?"
  *   *You:* "I can't answer that. That would change your strategy."

  **During Debrief (Board Work):**
  1.  Write the Naive EV: $E = 0.5(0.5x) + 0.5(2x) = 1.25x$.
  2.  Ask: "What assumption makes this line true?" (Answer: Equal probability of being the lower or higher envelope *regardless of x*).
  3.  Write the Real EV (given our game): "If you hold 64, what is the chance the other is 128?" (Answer: 0).
  4.  "The naive argument treats $x$ as a constant in the expectation, but $x$ is a random variable correlated with the probability of it being the larger envelope."

  ---

  ## 4. Predictable Problems & Solutions

  | Problem | Why it happens | Solution |
  | :--- | :--- | :--- |
  | **"You rigged the deck."** | Students lose on "Always Swap" and suspect you placed high numbers in the "Keep" envelopes. | **Transparency:** After Phase 1, reveal the 5 possible pairs used. Show that the assignment of Low/High to Envelope A/B was coin-flipped (have your prep sheet ready). |
  | **Variance / Luck** | A reckless "Always Swap" pair gets lucky and beats the threshold pair in a small sample. | **Aggregation:** Do not compare pairs. Compare the *class average* of all "Always Swap" decisions vs. "Threshold" decisions. $N=90$ decisions smooths the noise. |
  | **Refusal to Commit** | Students say "It depends on the number" in Phase 1 despite instructions. | **Enforce:** "For Phase 1, I need a blind rule. If you say 'it depends', you must sit out the round. Commit or observe." |
  | **Overgeneralization** | Students conclude "Swapping is always irrational." | **Correction:** Emphasize that swapping is rational *with information* (Phase 3). The paradox is about swapping *without* valid probabilistic justification. |
  | **Time Creep** | Phase 1 takes too long as they open envelopes slowly. | **Timer:** Project a countdown. "30 seconds per round. Open, Decide, Record, Next." |

  ---

  ## 5. What This Activity Cannot Reproduce (Honesty Check)

  You must supply these caveats verbally, as the physical game cannot demonstrate them:

  1.  **The Infinite Case:** The game uses a bounded distribution (Max 64). The true philosophical paradox assumes an unbounded range. In an unbounded range with a proper prior, the "Always Swap" argument dissolves because the probabilities $P(\text{Other}=2V)$ decay as $V$ increases.
  2.  **Improper Priors:** You cannot physically simulate a uniform prior over $[0, \infty)$. You must explain that the paradox arises from trying to use a probability distribution that doesn't exist (integrates to infinity).
  3.  **Cover's Strategy:** You likely won't have time to run the "Randomized Threshold" experiment (where you beat 50/50 odds without knowing the distribution). Describe it as homework: *"Pick a random number $T$ from a Gaussian distribution. If your envelope $< T$, swap. Prove this gives you $>50\%$ chance of the higher envelope."*
  4.  **Undefined Expectation:** In the strict mathematical formulation (e.g., Broome 1995), the expected value of the swap is not 1.25x, it is **undefined** (summing an infinite series that doesn't converge absolutely). The game shows *negative* EV due to bounds; the theory shows *undefined* EV due to infinity. Be clear on this distinction.

  ---

  ## 6. Handout: Strategy Sheet (Template)

  **Name:** ___________________
  **Phase:** 1 (Blind Commitment)

  **My Strategy:**
  [ ] Always Swap
  [ ] Never Swap
  [ ] Other: ______________________

  **Justification (1 Sentence):**
  _________________________________________________________________________
  _________________________________________________________________________

  *(To be filled out after the game)*
  **My Total Score:** _______
  **Partner's Total Score:** _______
  **Did I see the maximum value (64)?** [ ] Yes [ ] No
  **If Yes, did I swap?** [ ] Yes [ ] No

  ---

  ## 7. Why This Works Pedagogically

  1.  **Somatic Marker:** Students feel the "pain" of swapping 64 for 32. It creates an emotional anchor against the abstract 1.25x math.
  2.  **Peer Conflict:** In Phase 2, pairs argue. "If we both swap, we're stupid." This social friction highlights the logical contradiction better than a lecture.
  3.  **Discovery Learning:** They derive the Threshold Strategy themselves in Phase 3. This converts them from victims of the paradox to masters of the solution.
  4.  **Econ vs. Phil:** Economics students tend to trust the EV calculation initially; Philosophy students tend to trust the symmetry argument. The data forces both to converge on Bayesian updating.

  **Final Tip:** Bring candy. Award extra points to the pair with the highest Phase 3 score. It raises the stakes just enough to make the loss in Phase 1 sting.
