      *   **Task:** Rate each move, determine who is right about what, identify what they are both missing, and check if they are talking past each other (specifically regarding the definition of "aggregation").
      *   **Constraint:** No reading list, just the arguments.
      *   **Tone:** Informative, analytical, neutral (referee style), accessible but philosophically precise.

  2.  **Deconstruct the Arguments:**

      *   **Kwame's Opening (The Standard Objection):**
          *   *Claim:* Contractualism can't handle numbers (fatal flaw).
          *   *Case:* 1 Death vs. 1 Million Broken Arms.
          *   *Reasoning:* Individualist Restriction (IR) prevents lumping complaints. Death > Broken Arm for an individual. Therefore, save the one.
          *   *Intuition:* "Every sane person says save the million."
          *   *Assessment:* This is the classic "Numbers Skepticism" objection to Scanlon (often associated with Kamm or consequentialist critics). Kwame is accurately representing the *standard* critique of Scanlon's early formulation in *What We Owe to Each Other*.

      *   **Ruth's Reply (The Internal Defense):**
          *   *Claim:* Kwame misunderstands the restriction. It's about *grounds for rejection*, not ignoring numbers entirely.
          *   *Mechanism:* Tie-breaking case. If complaints are equal, "save the greater number" is a principle no one could reasonably reject.
          *   *Counter-intuition:* Maybe the "hard-nosed" answer (save the one) is actually right, and the "save the million" intuition is the bias contractualism corrects.
          *   *Assessment:* Ruth is referencing Scanlon's later refinements (specifically the "Reconciliation" project). She is right that the IR isn't a blanket ban on numbers, but her tie-break argument is limited to *equal* complaints. Her point about the "hard-nosed" answer being defensible is a strong philosophical move (challenging the data).

      *   **Kwame's Counter (The Structural Critique):**
          *   *Point 1:* Tie-break only works on exact equality. Too fragile/patchy.
          *   *Point 2:* If numbers decide in ties, that *is* aggregation (justification relies on "more of them").
          *   *Point 3:* Contractualism is just a Priority View with a "no-summing" stipulation bolted on. It lacks independent theoretical work.
          *   *Assessment:* This is a sophisticated meta-ethical critique. He's attacking the *coherence* of the view. Point 2 is particularly sharp: if you admit numbers in ties, why not in near-ties? Point 3 challenges the distinctiveness of contractualism.

      *   **Ruth's Second Move (The Veil/Ex Ante Strategy):**
          *   *Claim:* Use a veil of ignorance/ex ante perspective.
          *   *Reasoning:* Probability of being in the larger group is higher.
          *   *Example:* Lift example (5 pay £1.5k, 1 gains £5k value).
          *   *Assessment:* She is pivoting to *ex ante* contractualism (Harsanyi-style or Scanlon's later adjustments). This is a significant shift from the *ex post* individualist restriction.

      *   **Kwame's Final Counter (The Inconsistency Charge):**
          *   *Claim:* That's not contractualism; it's expected utility with Kantian paint.
          *   *Problem:* In the lift case, ex ante, you are more likely to be a payer (5/6) than the beneficiary (1/6). So you might reject it.
          *   *Problem:* In 1 Death vs. 5 Deaths, ex ante makes you indifferent (equal risk), which is worse than the original problem.
          *   *Assessment:* Kwame is correctly identifying the risks of shifting to *ex ante* reasoning. It collapses into utilitarianism or yields counterintuitive results in symmetric risk cases.

  3.  **Evaluate the "Aggregation" Ambiguity:**
      *   The prompt asks me to check if "aggregation" is doing three different jobs.
      *   *Job 1: Summation of Benefits/Harms.* (Consequentialist aggregation). Kwame wants this. Scanlon rejects this.
      *   *Job 2: Counting Individuals in Ties.* (Scanlon's concession). Ruth defends this. Kwame says this *is* aggregation.
      *   *Job 3: Ex Ante Probability.* (Risk-based aggregation). Ruth suggests this. Kwame says this changes the theory.
      *   *Verdict:* Yes, they are sliding between *ex post* aggregation (summing harms), *ex ante* aggregation (probabilities), and the *justificatory* role of numbers.

  4.  **Drafting the Referee Report:**

      *   **Introduction:** Acknowledge the quality of the debate. It's a classic philosophical stalemate.
      *   **Round 1 (The Case):** Kwame is right about the *standard* interpretation of Scanlon (Individualist Restriction). Ruth is right that Scanlon has resources to handle *some* numbers (ties).
      *   **Round 2 (The Tie-Break):** Kwame wins on consistency. If numbers matter in ties, the barrier against aggregation is porous. Ruth wins on plausibility (saving 2 vs 1 with equal harm).
      *   **Round 3 (The Veil):** Ruth is shifting ground to *Ex Ante* Contractualism. Kwame is right that this risks collapsing the theory into expected utility.
      *   **The "Missing" Element:** They are missing the distinction between *Ex Post* and *Ex Ante* contractualism, and the specific notion of "Reasonable Rejection." They are also missing Scanlon's "Generic Reasons" move.
      *   **The "Aggregation" Diagnosis:** Confirm the user's suspicion. Aggregation is being used in three ways.

  5.  **Refining the Arguments (Self-Correction/Nuance Check):**
      *   *Check:* Did Scanlon actually say "save the greater number" in ties? Yes, in *What We Owe to Each Other*, he allows numbers to break ties when complaints are identical.
      *   *Check:* Is the Lift example accurate? Ruth's example is a bit messy. 5 pay 1.5k (total 7.5k cost), 1 gains 5k value. Net loss socially? Or is it 5 pay 1.5k to give 1 a 5k benefit? If it's a cost-benefit analysis, contractualism usually struggles there. I should point out that contractualism isn't primarily about efficiency (lifts), it's about rights/harms.
      *   *Check:* Kwame's "Priority View" charge. This is a reference to Parfit. It's a strong charge. I should validate it.
      *   *Check:* Ruth's "Veil" move. Scanlon explicitly rejects the Veil of Ignorance as the *foundation* of contractualism (unlike Rawls). He uses it heuristically sometimes, but the core is reasonable rejection. Ruth is technically misapplying Scanlon here, moving toward Harsanyi. Kwame is right to call her out on fidelity to the theory.

  6.  **Finalizing the Structure:**
      *   **Verdict:** Draw. High-level stalemate.
      *   **Scorecard:** Break down by round.
      *   **The Diagnosis:** Explain the three meanings of aggregation.
      *   **The Missing Piece:** Generic Reasons and the Ex Post/Ex Ante distinction.

  7.  **Tone Check:** Keep it conversational but authoritative. "You were right to suspect..." "Kwame lands a punch..." "Ruth parries..."

  8.  *(Self-Correction during drafting)*: Make sure not to get bogged down in too much jargon. Keep it focused on the kitchen argument dynamics. Ensure I answer the specific prompt: "Rate each move, tell me who's right about what, and tell me what they're both missing."

      *   *Kwame Move 1:* Accurate statement of the problem.
