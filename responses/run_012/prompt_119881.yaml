prompt: |-
  I am writing a novel about a woman who agrees, before the embryo exists, to carry a child for her sister, and the more law I read the less I understand what the law believes. In California the agreement must be signed and notarised before the transfer, and a court can declare the intending parents to be the child's parents before the child is born. In Germany the same arrangement is unlawful and egg donation is banned outright, paid or unpaid. In Britain the surrogate may be paid her expenses, but the arrangement may not be brokered for profit, and the agreement itself cannot be enforced. In Spain the eggs may be paid for and the surrogacy may not. And British adoption law will not treat a mother's consent to an adoption order as valid if she gave it less than six weeks after the birth, on the view that consent given earlier is not real consent at all — yet the surrogacy agreement that settles the same question, who the parents are, is signed before conception. What does each of these arrangements presuppose about who a parent is, about whether parenthood can be created by intention or only recognised after the fact, and about what may be sold of a person's body? Which of those commitments does each regime genuinely need, and which parts would sit equally well with rival theories? And if one picture of parenthood were swapped for the other, what else would have to change?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Context:** The user is writing a novel about a woman agreeing to carry a child for her sister *before* the embryo exists (gestational surrogacy, likely genetic link to sister or donor).
      *   **Core Question:** The user is confused by the contradictions in international surrogacy/parentage laws (CA, Germany, UK, Spain) and wants to understand the underlying philosophical/legal presuppositions about parenthood, intention vs. biology/gestation, and commodification of the body.
      *   **Specific Questions to Answer:**
          1.  What does each arrangement presuppose about who a parent is?
          2.  Does it presuppose parenthood is created by intention or recognized after the fact?
          3.  What does it say about what may be sold of a person's body?
          4.  Which commitments are necessary to the regime, and which are interchangeable?
          5.  If one picture of parenthood were swapped for another, what else would have to change?
      *   **Tone:** Intellectual, nuanced, legally informed but accessible (for a novelist), philosophical.

  2.  **Deconstruct the Legal Regimes:**

      *   **California (USA):**
          *   *Mechanism:* Pre-birth orders, enforceable contracts.
          *   *Philosophy:* Intentional Parenthood. The "will" to parent is paramount.
          *   *Body:* Autonomy/Contractual. The body's reproductive capacity can be contracted, provided consent is informed.
          *   *Timing:* Before conception/birth.

      *   **Germany:**
          *   *Mechanism:* Total ban on surrogacy and egg donation. *Mater semper certa est* (the mother is always certain/she who bears the child).
          *   *Philosophy:* Biological/Gestational Truth. Parenthood is an objective fact, not a contract. Protection of the child from "split" parenthood.
          *   *Body:* Inalienable Dignity. The body (and child) cannot be objectified or instrumentalized (Kantian influence).
          *   *Timing:* Only after birth (and even then, adoption is the only path, often difficult).

      *   **United Kingdom:**
          *   *Mechanism:* Altruistic only, unenforceable contracts, parental orders after birth (6-week wait).
          *   *Philosophy:* Hybrid/Welfare of the Child. Acknowledges intention but prioritizes the gestational mother's post-birth autonomy and the child's welfare.
          *   *Body:* Anti-commodification. Expenses okay, profit no.
          *   *Timing:* Agreement before, legal transfer after (with a "cooling off" period).

      *   **Spain:**
          *   *Mechanism:* Surrogacy void (though often done abroad), egg donation allowed/compensated.
          *   *Philosophy:* Distinction between Genetic Material vs. Gestational Labor.
          *   *Body:* Eggs are "tissue" (can be compensated); Womb is "personhood/integral" (cannot be rented).
          *   *Timing:* Genetic transfer allowed, gestational transfer banned.

  3.  **Address the Core Philosophical Tensions:**

      *   **Intention vs. Fact:**
          *   *Intention:* CA. Parents are made by desire and planning.
          *   *Fact:* Germany/UK (initially). Parents are made by biology (genetics) or labor (gestation).
          *   *The User's Paradox:* UK adoption requires 6 weeks (consent must be post-facto) vs. Surrogacy agreement (consent is pre-facto). *Resolution:* The law distinguishes between *giving up* a child you claim (adoption) and *confirming* a plan you made (surrogacy). But the UK surrogacy law admits the pre-birth agreement isn't binding, hence the 6-week wait for the Parental Order to ensure the surrogate *still* consents.

      *   **Commodification (What can be sold?):**
          *   *CA:* Reproductive labor is a service.
          *   *Germany:* Reproductive capacity is human dignity, not property.
          *   *UK:* Expenses are reimbursement, not payment.
          *   *Spain:* Genetic material is renewable/detachable; gestation is holistic/embedded.

  4.  **Drafting the Response - Section by Section:**

      *   **Introduction:** Acknowledge the complexity. Validate the novelist's confusion (it *is* contradictory). Frame the answer around three axes: Time, Body, and Will.
      *   **Axis 1: The Time of Parenthood (Intention vs. Fact):**
          *   Contrast CA (Pre-birth/Intention) with Germany (Birth/Biology) and UK (Post-birth/Welfare).
          *   Address the Adoption vs. Surrogacy consent paradox (the "cooling off" period).
      *   **Axis 2: The Commodification of the Body:**
          *   Contrast Spain (Eggs ok, Womb no) with CA (Both ok) and Germany (Neither ok).
          *   Discuss the "Alienability" of bodily functions.
      *   **Axis 3: The Necessity of Commitments (The "What if" scenario):**
          *   Which parts are structural? (e.g., If you allow pre-birth orders, you *must* value intention over gestation).
          *   Which parts are cultural? (e.g., UK's altruism vs. CA's commercialism).
      *   **Swapping the Pictures:**
          *   What happens if Germany adopted CA's view? (Constitutional crisis regarding human dignity).
          *   What happens if CA adopted Germany's view? (Collapse of the IVF industry).
      *   **Novelistic Advice:** How to use this tension in the story. The conflict isn't just legal; it's ontological.

  5.  **Refining the Argument (Self-Correction during drafting):**
      *   *Correction on UK Law:* I need to be precise. In the UK, the surrogate is *always* the legal mother at birth. The intended parents apply for a Parental Order. The 6-week rule applies to the surrogate's consent for *that* order. This mirrors adoption to ensure she isn't coerced. The pre-conception agreement is a "moral contract," not legal.
      *   *Correction on Spain:* Surrogacy contracts are null and void, but egg donation is regulated and compensated (not "sold" technically, but "compensated for inconvenience"). This highlights the distinction between *tissue* and *process*.
      *   *The "Sister" Aspect:* The prompt mentions sisters. This adds a layer of "altruism" vs. "commercial." It fits the UK model well but creates tension in CA (why pay a sister?) or Germany (why risk criminal liability?). I should mention how the familial bond interacts with the legal theory.

  6.  **Final Polish:**
      *   Ensure the tone is empathetic to the writer's struggle.
      *   Make sure the philosophical terms (Kantian, Liberal Autonomy, Welfare Principle) are explained clearly.
      *   Check that all parts of the prompt are answered.

      *(Self-Correction on the Adoption Paradox)*: The user asks: *British adoption law will not treat a mother's consent... as valid if she gave it less than six weeks after the birth... yet the surrogacy agreement... is signed before conception.*
      *   *Answer:* The law assumes a mother bonding with a child she *carried* needs time to decide to let go (Adoption). In Surrogacy, the law assumes she *never intended to keep it*, but the 6-week wait for the Parental Order acknowledges she might change her mind *despite* the contract. So the UK actually agrees with the adoption logic: final consent must be post-birth. The pre-conception agreement is just a statement of intent, not binding consent. I need to make this distinction very clear.

  7.  **Final Output Generation:** (Proceeding to generate response based on these thoughts.)
answer: |-
  This is one of the most profound conflicts in modern family law, and your confusion is not a failure of understanding but a recognition of the truth: **there is no single coherent theory of parenthood underpinning global law.** Instead, there are competing ontologies—competing stories about what makes a human being a "parent" and what makes a human body a "self."

  For a novelist, this is fertile ground. The law is not just a set of rules here; it is a battleground of metaphysics. Here is a breakdown of the presuppositions of each regime, what they claim can be sold, and what would break if you swapped their underlying philosophies.

  ### 1. The Time of Parenthood: Intention vs. Fact

  The central contradiction you noted is temporal. When does parenthood begin?

  **California (The Intentional Model)**
  *   **Presupposition:** Parenthood is a **project**, not a biological event. It is created by the *will* to parent.
  *   **The Body:** The body is a vessel that can be temporarily engaged by contract. The gestational labor is distinct from the social role of motherhood.
  *   **Consent:** Consent given before conception is valid because the law assumes a rational actor can bind their future self regarding reproductive labor.
  *   **Implication:** If you swap this view, the entire IVF industry in California collapses. If parenthood cannot be intended before birth, the "pre-birth order" is void. The intended parents become legal strangers at the moment of delivery, creating a crisis of custody for every child born via ART (Assisted Reproductive Technology).

  **Germany (The Biological/Gestational Model)**
  *   **Presupposition:** Parenthood is an **objective truth** rooted in nature (*Mater semper certa est*—the mother is always certain). It is recognized, not created.
  *   **The Body:** The body is inseparable from human dignity (Kantian ethics). You cannot instrumentize the womb or the egg without violating the dignity of the person and the future child.
  *   **Consent:** You cannot consent to give up a child that does not exist, nor can you consent to separate genetic/gestational motherhood from legal motherhood.
  *   **Implication:** If you swap this view, Germany faces a constitutional crisis. Their Basic Law (Constitution) protects human dignity as inviolable. To allow surrogacy would require redefining "dignity" to include "contractual autonomy over reproduction."

  **United Kingdom (The Welfare/Altruistic Model)**
  *   **Presupposition:** Parenthood is a **responsibility** assigned based on the "welfare of the child."
  *   **The Body:** Reproductive labor cannot be commercialized (no profit), but it can be shared (expenses).
  *   **Consent (The Paradox):** You asked about the 6-week adoption rule vs. pre-conception surrogacy agreements. Here is the key: **In the UK, the pre-conception surrogacy agreement is not legally enforceable.** It is a moral promise. The law *agrees* with the adoption logic: a mother's consent is only valid after birth.
      *   At birth, the surrogate is the legal mother.
      *   The intended parents must apply for a "Parental Order."
      *   The surrogate must give consent *again* at least 6 weeks post-birth.
      *   *Why the pre-conception signature?* It establishes *intent* for the court to consider later, but it does not bind the surrogate. The law assumes she might bond with the child and change her mind, and her right to change her mind trumps her earlier signature.

  **Spain (The Hybrid Model)**
  *   **Presupposition:** There is a hierarchy of bodily connection. **Genetics are detachable; Gestation is integral.**
  *   **The Body:** You can compensate for the inconvenience of egg retrieval (tissue donation), but you cannot rent the womb (holistic bodily autonomy).
  *   **Implication:** This creates a strange dissonance where a woman can be paid for the genetic material but not the labor of growing the child. It presupposes that eggs are "property-like" but pregnancy is "person-like."

  ### 2. What May Be Sold? (Commodification)

  Each regime draws a different line around what parts of a person can enter the marketplace.

  *   **California:** **Reproductive Capacity is a Service.** The law treats surrogacy similarly to other personal service contracts. The risk is that the poor become vessels for the rich, but the commitment is to *autonomy*. If a woman wants to rent her womb, the state should not stop her.
  *   **Germany:** **Nothing is for Sale.** The child is a subject of rights, not an object of a contract. The womb is not a tool. To pay for eggs or womb-rental turns the child into a "product" and the woman into a "factory."
  *   **UK:** **Labor is Reimbursed, Not Bought.** This attempts to walk a tightrope. It acknowledges the surrogate's work (expenses) but denies it market value (profit). It presupposes that *altruism* purifies the transaction, making it morally safe.
  *   **Spain:** **Tissue is Compensatable; Process is Not.** This suggests that temporary bodily intrusion (egg retrieval) is less significant than long-term bodily inhabitation (pregnancy).

  ### 3. Which Commitments are Necessary?

  If you are building the world of your novel, you need to know which laws are load-bearing and which are decorative.

  **In California:**
  *   **Necessary:** The enforceability of the contract. Without this, the "Intentional Parenthood" model fails.
  *   **Interchangeable:** The level of compensation. CA could theoretically move to an altruistic model (like the UK) while keeping the pre-birth orders. The core commitment is *certainty of parentage*, not necessarily profit.

  **In Germany:**
  *   **Necessary:** The ban on egg donation and surrogacy. Both are required to maintain the unity of "genetic + gestational = legal mother."
  *   **Interchangeable:** The criminal penalties. They could make it civilly void without making it criminal, but the outcome (no legal surrogacy) remains the same.

  **In the UK:**
  *   **Necessary:** The 6-week waiting period for consent. This is the anchor of the "Welfare of the Child" principle. It ensures the surrogate is not coerced by the pregnancy or the contract.
  *   **Interchangeable:** The ban on profit. The UK could allow commercial surrogacy while keeping the unenforceable contract model, but currently, the altruism is seen as a safeguard against exploitation.

  ### 4. Swapping the Pictures: What Breaks?

  If you swap the philosophical underpinnings, the legal machinery jams.

  **Scenario A: Germany adopts the Californian "Intentional" view.**
  *   **The Break:** The German Constitution (Basic Law) protects human dignity. If the state allows a contract to override the biological reality of birth, it is arguably treating the child as an object of trade. To make this work, Germany would have to redefine "dignity" to prioritize "self-determination."
  *   **The Novelistic Conflict:** A German sister carrying for a sister would feel she is committing a moral crime against the "natural order," even if the law changed. The guilt would be ontological, not just legal.

  **Scenario B: California adopts the German "Biological Truth" view.**
  *   **The Break:** The moment the baby is born, the surrogate is the mother. The intended parents (the sister and her partner) have no rights. They would have to adopt the child. The surrogate could demand custody, or her husband (if married) could claim paternity.
  *   **The Novelistic Conflict:** The "agreement before the embryo exists" becomes a piece of scrap paper. The drama shifts from "will they uphold the contract?" to "does the carrier love the child?"

  **Scenario C: The UK adopts the "Pre-Birth Consent" view (swapping the 6-week rule).**
  *   **The Break:** This undermines the protection against coercion. The law currently assumes pregnancy changes a woman's mind. If you bind her before conception, you assume her pre-pregnancy self has authority over her post-pregnancy self.
  *   **The Novelistic Conflict:** This creates a conflict between *Past Self* and *Present Self*. If your protagonist signs in Year 1, but in Year 2 (post-birth) feels different, the law says Year 1 wins. This is a rich psychological vein: *Do I own the woman I was two years ago?*

  ### 5. Advice for the Novel

  Your protagonist is navigating a space where the law tries to answer a question it cannot: **What is a mother?**

  *   **Is she the code (DNA)?** (The Sister/Intended Mother)
  *   **Is she the soil (Womb)?** (The Surrogate Sister)
  *   **Is she the will (Intent)?** (The Contract)

  The confusion you feel is the point. The law is trying to stitch these three things together, but they don't always align.

  **The "Sister" Dynamic:**
  Because your characters are sisters, the "Commercial" vs. "Altruistic" debate shifts. In California, paying a sister might feel transactional and cold. In the UK, paying a sister (beyond expenses) is illegal, but the emotional debt is infinite. In Germany, they are both criminals.

  **The Central Tension:**
  The most compelling tension for your story lies in the **UK model's paradox**, which you identified.
  *   The law says: "You can plan this before conception."
  *   But the law also says: "The plan means nothing until 6 weeks after birth."
  *   *Why?* Because the law secretly believes the German view (birth creates the mother) but tries to accommodate the Californian view (intent creates the family).

  **A Suggested Theme:**
  Explore the idea of **"Deferred Consent."**
  Your protagonist agrees before the embryo exists. She is betting that her future self will agree with her present self. The law (in the UK/Europe) bets she won't. The drama isn't just about whether she keeps the baby; it's about whether a human being can truly consent to a future transformation of their own body and heart.

  If you swap the picture of parenthood from "Intention" to "Fact," your protagonist loses her agency. If you swap it from "Fact" to "Intention," she loses her humanity (becoming a vessel). The tragedy is that she must be both to make this work, but the law only allows her to be one.
