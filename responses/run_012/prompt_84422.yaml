      *   *Category Mistake:* Rawls does say utilitarianism treats society as a "super-person." Is it a *category mistake*? Rawls argues it's an illegitimate extension of the principle of rational choice for one person to many. Calling it a "category mistake" is a strong philosophical charge (Rylean), implying conceptual incoherence. Most critics accept the *force* of the objection without necessarily committing to strict metaphysical incoherence. It's more about moral significance than logical category errors.
