  # Decision Tree: The Epistemology of Market Prices

  **Starting Commitment:** You accept the No-Trade logic: if agents share a common prior, know each other's rationality, and know each other's information, they cannot agree to trade based on differing probability estimates.

  ---

  ### **Q1: Is observed trade volume driven primarily by differing beliefs about value, or by differing needs (hedging, liquidity, consumption)?**
  *   **Differing Needs:** → **Leaf 1**
  *   **Differing Beliefs:** → **Q2**

  ### **Q2: If trade is driven by beliefs, is holding a different prior probability from others inherently irrational?**
  *   **No (Rational to differ):** → **Leaf 2**
  *   **Yes (Common Prior Assumption):** → **Q3**

  ### **Q3: Does the No-Trade theorem show markets are epistemically special (trade is noise) or that the rational-agent model is too thin?**
  *   **Model Too Thin:** → **Leaf 3**
  *   **Epistemically Special (Preserve Model):** → **Q4**

  ### **Q4: Does "you can't systematically beat the price" (No Free Lunch) imply the price equals fundamental value (Price is Right)?**
  *   **No:** → **Leaf 4**
  *   **Yes:** → **Q5**

  ### **Q5: Do prices aggregate *all* dispersed information perfectly?**
  *   **No:** → **Leaf 5**
  *   **Yes:** → **Q6**

  ### **Q6: If prices are fully informative, who is incentivized to produce the information they reflect?**
  *   **No One:** → **Leaf 6**
  *   **Noise Traders:** → **Leaf 7**
  *   **Control/Activism:** → **Leaf 8**

  ---

  ### **Leaves**

  **Leaf 1: Gains-from-Trade View (Unnamed)**
  *   **Position:** Prices are clearing mechanisms for risk/consumption, not aggregators of belief.
  *   **Awkward Thing:** Must explain why prices look epistemic (predictive) if they are just supply/demand constraints.

  **Leaf 2: Heterogeneous Priors**
  *   **Position:** Rational agents can "agree to disagree"; trade is speculative based on valid prior differences.
  *   **Awkward Thing:** Must accept the starting No-Trade logic's core constraint (common priors) is false, weakening the baseline rationality assumption.

  **Leaf 3: Model Critique (Behavioral/Institutional)**
  *   **Position:** Real traders aren't Bayesian updaters; the No-Trade result fails because the model is too thin.
  *   **Awkward Thing:** Loses the clean normative force of "rational pricing," making efficiency hard to define.

  **Leaf 4: Martingale/Random Walk**
  *   **Position:** Prices are unpredictable (No Free Lunch) but not necessarily accurate (Price ≠ Right).
  *   **Awkward Thing:** Must accept prices can be systematically wrong even if you can't profit from knowing it.

  **Leaf 5: Partial Information Aggregation (Unnamed)**
  *   **Position:** Prices reflect some information, but frictions prevent full efficiency.
  *   **Awkward Thing:** Requires specifying exactly which frictions prevent full efficiency without inviting arbitrage that would remove them.

  **Leaf 6: Grossman-Stiglitz Paradox**
  *   **Position:** Fully informative prices are impossible because they destroy the incentive to gather information.
  *   **Awkward Thing:** Concludes markets are never fully efficient, only approximately so, undermining the "Price is Right" claim.

  **Leaf 7: Noise Trader Equilibrium**
  *   **Position:** Prices are informative because irrational noise traders subsidize the costs of informed traders.
  *   **Awkward Thing:** Requires positing irrational actors to sustain rational pricing equilibrium.

  **Leaf 8: Unnamed (Control/Activism)**
  *   **Position:** Information is paid for by private benefits of control, not price appreciation.
  *   **Awkward Thing:** Must explain why market prices don't capture control value, implying a split between price and value.

  ---

  ### **Notes on Coherence and Coverage**

  *   **Identical Leaves:** None. Each leaf represents a distinct combination of epistemic commitment and market mechanism.
  *   **Coherent but Unheld Positions:** **Leaf 8 (Control/Activism)** is logically coherent but rarely held as a general theory of price epistemology. It is usually treated as a niche exception rather than a general account of what prices tell us. This is likely because it requires separating "price" from "value" in a way that makes the price signal less useful for passive observers, which defeats the purpose of asking what the price tells *you*.
  *   **Path Collapse:** If you answer **Q1 (Differing Needs)**, the downstream questions about priors and information aggregation become largely irrelevant. This path collapses the epistemic reading of prices entirely.
