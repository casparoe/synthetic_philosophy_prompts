tten for readers of a general column so no jargon you can't unpack in a few words. And tell me which combinations of answers are empty and why — incoherent, unattractive, or just never explored — plus any pair of leaves your tree honestly can't seperate, since alot of these positions differ only in how they'd phrase the same verdict.
