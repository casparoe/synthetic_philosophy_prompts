  **The Scenario**
  You are a trainee in a VR bomb disposal simulation consisting of two identical rooms visited in sequence. Due to a "memory wipe" safety protocol between rooms, you cannot distinguish Room 1 from Room 2, nor recall if you have already visited a room. In each room, you must choose to **Defuse** (exit) or **Proceed** (continue). Defusing a live bomb in Room 1 causes a simulation crash (payoff 0). Defusing a dummy bomb in Room 2 is a success (payoff 6). Proceeding past Room 2 results in a timeout penalty (payoff 2). You know the structure and payoffs but cannot identify your current location. The ex-ante optimal plan is to Proceed with probability 3/4 and Defuse with probability 1/4.

  **Analysis of the Disagreement**
  **Evidential Decision Theory (EDT)** matches the optimal planning policy. EDT recognizes that your current choice is evidentially linked to your choice at the other node because both stem from the same policy. If you choose Defuse, you are evidence of a "Defuser" type; a Defuser type would have Defused in Room 1, meaning you are likely in Room 1 (payoff 0). If you choose Proceed, you are evidence of a "Proceeder" type, making it likely you Proceeded in Room 1 and are now in Room 2 (payoff 6). At the optimal mix ($p=3/4$), EDT calculates the expected utilities of Defusing and Proceeding as equal, rendering the mixed strategy ratifiable and time-consistent.

  **Causal Decision Theory (CDT)** deviates from the optimal plan. CDT treats your current action as causally independent of your past action. It argues that your choice now cannot change whether you Defused in Room 1. Therefore, CDT treats the probability of being in Room 2 as fixed (often 1/2 by indifference). From this perspective, Defusing offers a 50% chance at 6 (Expected Utility 3), while Proceeding offers a guaranteed path to the timeout or a delayed Defuse (Expected Utility < 3). CDT thus recommends a pure strategy of Defusing, tempting the agent to abandon the optimal mixed plan.

  **Diagnostic Feature**
  The work is done by **Decision-Dependent Self-Location**. In this case, your action provides evidence about *where* you are in the sequence because your policy determines whether you reach the second node. If you remove the memory wipe (making nodes distinguishable), the correlation breaks: you know exactly where you are, so your action provides no evidence about your history, and CDT/EDT converge. The disagreement hinges entirely on the agent treating her own decision as a diagnostic signal of her position in the causal chain.

  **The CDT Defense**
  A defender of CDT would attack the case by arguing for **Causal Independence**. They would claim EDT is engaging in "magical thinking" by assuming the current choice influences the past. The CDT defender argues: "I am already in a room. Whether I Defuse or Proceed does not *cause* me to have been in Room 1 or 2. That history is fixed. I should maximize utility given the fixed state I am in, not manage news about my location." They would likely advocate for pre-commitment devices to force the CDT agent to stick to the plan, admitting the theory requires external binding in cases of self-locating uncertainty.
