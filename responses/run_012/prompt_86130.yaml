      *Let's write it.*

      "You speak of rationalization as if it were a flaw, as if there were some pure spirit hovering above the gut that thinks thoughts untainted by the body! This is the old error, the metaphysical lie I have spent my life hammering apart. You say this is only *my* life? Naturally! There is no other kind! Every philosophy is the confession of its author, a kind of involuntary memoir. The difference is that I am the first to have the courage to look at the mechanism, to admit that a thought is merely the digestion of experience. You call it a sick man's diary? I call it the first healthy book in centuries. A decadent hides his sickness behind concepts like 'duty' or 'truth'; I expose the sickness so that health becomes possible. To ignore the body is not objectivity, it is stupidity."

