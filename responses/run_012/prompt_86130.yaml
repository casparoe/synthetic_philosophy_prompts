      "So do not tell me this is autobiography dressed up. It is biology dressed up as destiny. You ask why it isn't just autobiography with a straight face? Because *you* are also nothing but autobiography! Your objections, your skepticism, even this letter you write to me—it is all a report on your intestines, your climate, your hidden fatigue. You resent the physiological explanation because it strips you of the illusion that you are a free thinker. I have merely removed the mask. If you cannot adopt my regimen, it is because you are still in love with the things that make you sick. I have chosen life; you are merely arguing about it."

