      *Wait, one check:* "Barometer" was mentioned by the user. I used it back. That's fine. "Biology" - Nietzsche used biological terms but "biology" as a distinct science was emerging. He usually says "physiology." I'll swap "biology" for "physiology" in the third paragraph to be safer/more accurate to his lexicon. "Destiny" is good.

