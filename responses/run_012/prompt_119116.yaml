answer: |-
  Elena was seven when she kept the red crayon her brother needed, not out of malice but because the stroke she was drawing felt incomplete, and she finished the line before handing it over. At twelve, she practiced piano scales while her mother spoke from the doorway, nodding without turning her head because breaking rhythm ruined the exercise. In college, she selected the solo project over the group study session, calculating that the individual grade carried more weight, and spent the night highlighting text rather than answering texts. At twenty-four, she took the promotion that required relocation, packing her boxes while her partner cried in the other room, focusing on the taping technique to ensure the cardboard wouldn't burst. Last week, when her aging neighbor asked for a ride to the clinic, Elena checked her calendar, saw the conflict with her gym slot, and politely declined, citing a prior commitment that was merely a reservation for a machine she preferred. Yesterday, she signed the eviction notice for that same neighbor, having reviewed the lease terms three times to ensure the clauses protected her investment, feeling only the satisfaction of a task completed correctly.

  The Basic Argument posits that an agent acts from her character; therefore, to be responsible for the act, she must be responsible for her character; but to be responsible for her character, she must have intentionally formed it; which requires a prior character to do the forming, generating an infinite regress that nothing can terminate. Applied to Elena, this argument concludes she bears no responsibility in the demanding sense. She acted from who she was, but since she never decided to become this person, the chain of formation traces back to dispositions she did not choose. The compatibilist, conversely, concludes she is fully responsible. On this view, responsibility is transmitted through the continuity of agency; because every stage involved her own goal-directed activity—finishing the line, keeping the rhythm, securing the grade—the resulting character is authentically hers, even absent meta-deliberation. The verdicts turn on the status of non-deliberative attention: the Strawsonian conception requires agency to be self-originating to count as ownership, whereas the compatibilist conception requires only that the action issues from the agent's own psychological states without external coercion. The case threatens the premise that responsibility for character requires *intentional* formation of that character. It attempts to show that non-deliberative choices can accumulate into character ownership. However, it likely merely relocates the regress. The Strawsonian will ask why she attended to the stroke rather than the brother; if the answer is "because she was the kind of child who prioritized completion," the regress holds. If the answer is "she just did," the action is uncaused by her, and she is not responsible.

  In the control case, one episode is replaced with a deliberate decision: at twenty-four, she explicitly thinks, "I will become the kind of person who prioritizes career over relationships," and takes the promotion for that reason. No verdict changes. The Strawsonian still denies responsibility, asking what caused that decision; if it flowed from prior values, she didn't choose them, and if it did not, it was random. The compatibilist still affirms responsibility, as the decision merely makes the existing alignment of values more explicit. This substitution accomplishes nothing that the whole history could not because the regress is structural, not evidential; adding a moment of reflection does not create a self-causing cause. If every episode were such a decision, the case would collapse into absurdity. It would depict a life of constant, exhausting meta-evaluation where no action could occur without a prior decision about the decision-maker, rendering ordinary agency impossible.

  The strongest objection from the Strawsonian side is that attention, habit, and repetition are manifestations of disposition rather than exercises of agency. To say Elena "chose" to focus on the tape is to describe the output of her character, not the construction of it; the direction of her attention is determined by who she already is, so citing her attention as the source of responsibility is circular. This objection succeeds. The case cannot repair the gap between "doing an action" and "forming the self that does the action" without presupposing the very ownership it seeks to prove. Unless one can explain why she attended to *this* rather than *that* without referencing her prior nature, the chain remains a sequence of events happening to a subject rather than by a subject. The case is bound to fail against the Basic Argument because it cannot provide the first link that is both determined by the self and not determined by the self's prior state.
