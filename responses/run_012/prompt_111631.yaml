answer: |-
  **Project Title:** Closing the Frame: The Closure Problem for Relevance in Practical Deliberation

  **Research Question**
  How can a finite reasoner specify the scope of practical deliberation without presupposing the relevance judgments that scope is intended to constrain?

  **Problem Statement**
  Discussions of the frame problem typically bifurcate into a technical version and a philosophical version. The technical version concerns computational efficiency: how a system updates its representation of a changing world without re-deriving every non-change. The philosophical version concerns epistemic selection: how any finite reasoner identifies which facts are relevant to a decision without checking every fact in existence. While distinct, I argue that both are symptoms of a deeper, under-theorized issue: the closure problem for relevance.

  The closure problem arises when we ask how the boundaries of deliberation are set. To decide what is relevant, a reasoner must operate within a scope of consideration. However, to set that scope, the reasoner must already judge what is relevant to the task at hand. This creates a vicious circularity: relevance judgments require a scope, but setting the scope requires relevance judgments. Standard technical approaches bypass this by hard-coding boundaries, which fails to explain human flexibility. Standard philosophical approaches often assume a background of relevance without explaining how that background is constituted without regress. Both leave open the mechanism by which deliberation is closed off from the infinite field of potential information.

  This project argues that the closure problem is not a deadlock but a category error. It assumes that all relevance must be actively selected. By distinguishing between types of relevance, we can show that the scope of deliberation is not selected but structurally enabled.

  **Methodology**
  This project employs conceptual analysis at the intersection of philosophy of mind and cognitive science. The core methodological innovation is distinguishing *occurrent relevance* from *dispositional relevance*.

  *Occurrent relevance* refers to information actively held in working memory and explicitly weighed during deliberation. This is the domain where the frame problem is traditionally felt; the system must select items from a larger set. *Dispositional relevance*, by contrast, refers to the structural readiness of a cognitive system to treat certain classes of information as salient without active selection. It is a property of the architecture, not the content.

  The project will demonstrate that the closure problem dissolves when we recognize that the scope of deliberation is determined by dispositional relevance, which does not require active judgment. Dispositional relevance functions as a filter that operates prior to deliberation, shaped by evolutionary constraints, learning history, and contextual priming. It is not "chosen" in the moment; it is the condition that makes choosing possible.

  I will construct a model where dispositional relevance sets the boundary conditions for occurrent deliberation. This avoids the circularity because the boundary is not itself an object of deliberation. I will test this conceptual model against two domains:
  1.  **Artificial Agents:** Analyzing why hard-coded frames fail in dynamic environments and how attention mechanisms in neural networks approximate dispositional relevance without solving the philosophical closure.
  2.  **Human Cognition:** Examining cases of deliberative failure (e.g., tunnel vision, hyper-focus) where dispositional relevance malfunctions, causing the scope to collapse or expand pathologically.

  This is not empirical work; it is a philosophical reconstruction of cognitive architecture using existing data from the literature to validate the conceptual distinction.

  **Work Plan (Nine Months)**
  *Months 1–2: Conceptual Mapping.* I will catalog existing definitions of relevance and scope in both AI and philosophy. The goal is to isolate exactly where the circularity arises in current models. I will draft a detailed taxonomy of relevance types to prepare for the occurrent/dispositional distinction.

  *Months 3–4: Developing the Distinction.* I will formulate the precise definitions of occurrent and dispositional relevance. I will write a draft argument showing how dispositional relevance avoids the regress. This involves clarifying how dispositional states can be normative (guiding action) without being representational (explicitly judged).

  *Months 5–6: Application and Stress-Testing.* I will apply the framework to specific case studies. For AI, I will analyze attention mechanisms to show they manage occurrent relevance but rely on architectural biases for dispositional relevance. For human cognition, I will analyze phenomena like habituation and expertise to show how scope is narrowed without active selection. I will seek feedback from colleagues in cognitive science to ensure the architectural claims are plausible.

  *Months 7–8: Drafting Outputs.* I will write two articles. The first will define the closure problem and argue for the occurrent/dispositional distinction. The second will apply this distinction to dissolve the traditional frame problem, showing it as a confusion of these two types.

  *Month 9: Revision and Dissemination.* I will revise the manuscripts based on feedback and prepare them for submission to journals in philosophy of mind and cognitive science. I will also prepare a summary brief for the institute to highlight the interdisciplinary implications.

  **Success Criteria**
  A successful result will be a robust conceptual distinction that survives critical scrutiny. Specifically, success looks like:
  1.  **A Criterion:** A clear test for distinguishing occurrent from dispositional relevance in any given cognitive model.
  2.  **A Dissolution:** A demonstration that accepting this distinction removes the need for a "selector" mechanism that causes the regress.
  3.  **Publication:** At least one manuscript accepted for publication or under serious review by the end of the fellowship.

  Even a negative result would be valuable: if I demonstrate that the occurrent/dispositional distinction collapses under pressure, I will have proven that the closure problem is inescapable for finite reasoners, which is a significant philosophical finding regarding the limits of autonomy.

  **Failure Conditions**
  The project would fail if the distinction between occurrent and dispositional relevance proves to be merely terminological. If "dispositional relevance" turns out to be just "occurrent relevance that happened earlier," the circularity remains, because the earlier occurrence still required a scope. Additionally, the project fails if the distinction relies on empirical claims about cognitive architecture that are demonstrably false according to current consensus (e.g., if working memory does not function as a bottleneck in the way required). Finally, failure would occur if I cannot articulate how dispositional relevance is normative; if it is merely causal, it does not solve the philosophical problem of justified belief selection.

  **Feasibility**
  This scope is realistic for a single researcher over nine months. It requires no lab work, IRB approval, or computational modeling. It relies on logical analysis and synthesis of existing theoretical frameworks. The risk is managed by the fallback option: even if the positive solution fails, the mapping of the failure conditions constitutes a complete philosophical argument regarding the limits of relevance selection.
