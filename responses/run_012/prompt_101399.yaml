      *   *(5) vs (1)/(2):* (5) dismisses the impossibility theorem as "exact equality" vs "close enough." This is a pragmatic dodge, not a logical resolution. If base rates differ significantly, the trade-off is sharp, not just a rounding error. This weakens the logical rigor of holding (1) and (2) simultaneously.
