      *   *(3) vs (4):* Commitment (3) defines discrimination causally. Commitment (4) says if $A$ isn't an input, there's no causal dependence. *Problem:* Causal paths can exist through proxies. If $X$ is a proxy for $A$, and $Y$ depends on $X$, and $X$ depends on $A$, then $Y$ counterfactually depends on $A$. Commitment (4) claims this *isn't* discrimination. This contradicts standard causal graphs (DAGs) where indirect paths count as causal effects. So (4) is internally weak regarding (3).
      *   *(3) vs (9):* Commitment (3) relies on counterfactuals ("had attribute been different"). Commitment (9) says attributes like race are socially constructed, making that counterfactual ill-defined. This is a deep philosophical tension. If (9) is true, (3) loses its grounding.
