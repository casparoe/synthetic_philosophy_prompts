answer: |-
  You have identified the central failure of the standard compliance definition: it is a legalistic shell that collapses when exposed to the sociology of power. The definition you inherited ('misuse of public position for private gain') is designed for a specific, Weberian bureaucracy where the state is distinct from society, rules are written, and the 'private' is strictly personal. In the field, you are dealing with neopatrimonial systems, institutional decay, and grey zones where the 'public' and 'private' are intentionally blurred.

  To build a specification for a theory of corruption that works for your role, we must distinguish between what is morally necessary and what is merely a projection of Northern administrative norms. Below is the specification of desiderata, followed by an analysis of where these requirements conflict.

  ### I. The Desiderata of an Adequate Account

  **1. The Fiduciary Requirement (Genuine)**
  *   **Motivation:** The case of the nephew placed in a public agency versus the departing official's board seat.
  *   **Specification:** The account must identify a breach of a fiduciary duty owed to a principal (the public, the shareholders, the beneficiaries of a programme). It does not matter if the benefit is cash or a future job; what matters is that the agent's judgment was compromised by an interest that conflicts with their duty.
  *   **Why Genuine:** Without a duty of loyalty, there is no corruption, only exchange. This distinguishes corruption from simple trade.

  **2. The Institutional Purpose Requirement (Genuine)**
  *   **Motivation:** The case of the lavish gift to a minister's household treated as 'cultural'.
  *   **Specification:** The account must evaluate whether the transaction subverts the *purpose* of the institution involved. If the institution is a customs agency, its purpose is fair collection of revenue. If a gift alters the assessment of duty, it corrupts the institution, regardless of whether the culture views gift-giving as obligatory hospitality.
  *   **Why Genuine:** Culture cannot override function. If a practice renders an institution incapable of achieving its stated ends, it is corruptive, even if culturally sanctioned.

  **3. The Scope Requirement (Genuine)**
  *   **Motivation:** Favours traded inside a private firm where no public office is involved.
  *   **Specification:** The account must apply to private offices and institutions where power is delegated. Corruption is not exclusive to the state; it exists wherever authority is entrusted.
  *   **Why Genuine:** The harm of corruption is the betrayal of trust, which occurs in corporations and NGOs just as in ministries.

  **4. The Collective Benefit Requirement (Genuine)**
  *   **Motivation:** The benefit going to the official's village, party, or congregation rather than her personal pocket.
  *   **Specification:** The account must recognise that 'private gain' includes gain for any narrow faction to which the official owes a particularistic loyalty, distinct from the universalistic loyalty owed to their office.
  *   **Why Genuine:** Diverting public resources to a kinship group or party is functionally identical to diverting them to a personal bank account; both deprive the universal principal (the whole public) of their due.

  **5. The Distinction Requirement (Genuine)**
  *   **Motivation:** The line between a bribe and a tip, a facilitation payment and a fee, lobbying and donation.
  *   **Specification:** The account must distinguish between *influence* (permissible persuasion) and *control* (impermissible determination). A donation is corrupt if it purchases a specific outcome that bypasses due process; it is not corrupt if it supports general advocacy within open rules. A tip is for service rendered; a bribe is for discretion exercised.
  *   **Why Genuine:** Collapsing these distinctions criminalises normal political or social interaction. The differentiator is transparency and whether the transaction bypasses the established decision-making procedure.

  **6. The Cross-Jurisdictional Stability Requirement (Prejudicial if misapplied)**
  *   **Motivation:** One transaction is corrupt in one jurisdiction and unremarkable in another.
  *   **Specification:** The account must allow for a practice to be judged corrupt even if legal locally, *provided* it violates the functional integrity of the institution. However, it must not simply import foreign norms as the standard of integrity.
  *   **The Prejudice:** It is a Western prejudice to assume that written, formal rules are the only valid measure of integrity. In many contexts, informal norms *are* the operating system.
  *   **The Correction:** The standard should not be 'does this break London's rules?' but 'does this break the local institution's own claimed purpose?' If a ministry claims to serve the public but operates as a family treasury, that is corruption by its own lights, not just by yours.

  **7. The Critical Independence Requirement (Genuine)**
  *   **Motivation:** Condemning a practice insiders do not regard as wrong.
  *   **Specification:** The account must be able to condemn a practice even if it is culturally normalised, provided it violates the fiduciary duty of the role. 'Everyone does it' is a description of prevalence, not a defence of integrity.
  *   **Why Genuine:** If corruption is defined solely by local acceptance, then systemic corruption ceases to exist the moment it becomes total. You need an external anchor to diagnose disease.

  **8. The Exoneration Requirement (Genuine)**
  *   **Motivation:** Exonerating conduct that an outside body's rules forbid.
  *   **Specification:** The account must allow that breaking a formal rule is not corruption if the rule itself is corrupt or if the breach serves the higher fiduciary duty (e.g., bypassing a blockade to deliver aid).
  *   **Why Genuine:** Legalism is not morality. A rule-bound tyrant is not less corrupt than a lawless one.

  **9. The Noble Breach Requirement (Genuine)**
  *   **Motivation:** The official who breaks a rule for admirable ends.
  *   **Specification:** The account must distinguish between *corrupt intent* (selfish or factional gain) and *conscientious objection* (public gain).
  *   **Why Genuine:** Corruption requires a wrongful intent or a wrongful subversion of purpose. Acting to save lives by bypassing red tape is rule-breaking, but it reinforces, rather than subverts, the humanitarian purpose of the office.

  ### II. The Incompatibilities and Trade-offs

  You asked to be told plainly if these requirements cannot be met together. They cannot. There is a fundamental tension, perhaps an impossibility, in trying to satisfy the **Critical Independence Requirement** and the **Cultural Sensitivity Requirement** (implicit in your desire not to impose Western norms) simultaneously.

  **1. The Paradox of the Insider/Outsider**
  To diagnose corruption in a system where it is endemic, you must appeal to a standard that the participants do not accept. If you rely on their internal norms (to avoid imperialism), you cannot condemn their corruption (because their norms permit it). If you rely on external norms (to maintain critical bite), you are accused of imposing foreign values.
  *   **The Hard Truth:** You cannot have a definition that is both perfectly faithful to how a practice is understood by its participants *and* usable as a standard for criticising it. If the participants understand the 'family treasury' model of government as legitimate, a theory that calls it corrupt is, by definition, overriding their understanding. You must choose: either you are an anthropologist describing their norms, or a governance adviser evaluating them against a functional standard of public service. You cannot be both at once. For your role, you must prioritise the functional standard, accepting that this will always carry a whiff of external imposition.

  **2. The Paradox of Intent vs. System**
  Your examples oscillate between individual acts (cash envelope) and systemic arrangements (revolving door board seats).
  *   **The Hard Truth:** A theory focused on individual intent (did the minister *mean* to be corrupt?) will fail to capture institutional corruption (the board seat). A theory focused on systemic outcomes (did the institution decay?) may unfairly condemn individuals acting within the only system available to them.
  *   **The Trade-off:** An adequate account must prioritise the *systemic effect* over the *individual intent*. This means you may have to label an individual's action as 'corruptive' even if they are a good person trying to survive in a bad system. This is morally uncomfortable but analytically necessary. If you soften the definition to protect the individual, you lose the ability to diagnose the systemic rot.

  **3. The Paradox of the 'Public'**
  The standard definition fails because 'the public' is often a fiction in the contexts where you work. The 'public' may not mind if the official favours her village because the state is viewed as a resource to be captured, not a service to be provided.
  *   **The Hard Truth:** If the 'principal' (the public) consents to their own exploitation, is it corruption? A strict agency theory says no (the principal waived the duty). A functional theory says yes (the institution is destroyed).
  *   **The Trade-off:** You must adopt the functional view. You must assume that the 'public' is often coerced or misinformed, and that their acquiescence does not legitimise the subversion of the institution. This is paternalistic. It is also necessary for development work. You are there to build institutions that serve the abstract public, not to validate the current transactional reality.

  ### III. The Ruling Requirement

  If one requirement does most of the work in ruling out the usual candidates, it is the **Institutional Purpose Requirement**.

  Most definitions fail because they focus on the *actor* (did he gain?) or the *rule* (was it broken?). Both are easily gamed. The official can say, 'I gained nothing (my village did),' or 'I broke no rule (it was a gift).'

  By focusing on the *institution's purpose*, you bypass these defences.
  *   **The Customs Officer:** The purpose is revenue collection. The cash envelope subverts this. Corrupt.
  *   **The Minister's Gift:** The purpose is impartial policy. The lavish gift creates dependency/obligation. Corrupt, regardless of culture, *if* it influences policy.
  *   **The Board Seat:** The purpose of the regulator is oversight. The board seat creates a conflict of interest. Corrupt.
  *   **The Noble Breach:** The purpose of the aid agency is saving lives. Breaking the rule *serves* this purpose. Not corrupt.

  This requirement is the only one that allows you to navigate the jurisdictional variance. A practice is not corrupt because it is illegal in London; it is corrupt if it subverts the purpose of the agency in *its* context. However, you must be the arbiter of what that purpose is.

  ### IV. Conclusion: The Specification's Cost

  To use a theory of corruption in your post, you must accept three costs:

  1.  **You will be an outsider.** You cannot fully adopt the local definition of corruption, or you will be blind to the very problems you were hired to fix. You must hold a functional standard of public office that may not exist locally yet.
  2.  **You will judge systems, not just souls.** You will have to label actions as corruptive even when the individual is acting rationally within a broken system. This shifts the blame from the 'bad apple' to the 'bad barrel', which is politically difficult but analytically honest.
  3.  **You cannot be neutral.** A definition of corruption is a political tool. By defining the 'revolving door' as corrupt, you are taking a stance against the fusion of private and public power. By defining 'village benefit' as corrupt, you are prioritising universal citizenship over particularistic loyalty.

  The literature tries to hide these costs behind neutral language. Do not let it. Your definition must be a tool for institutional construction, not just a mirror for reflection. If it does not offend someone who benefits from the current ambiguity, it is likely too weak to be useful.
