      *   *Desideratum 3: Legality.* Must distinguish from mere illegality. (Motivation: Legal lobbying vs. corrupt influence).
      *   *Desideratum 4: Cultural Context.* Must distinguish from acceptable gift-exchange. (Motivation: Lavish gift to minister).
      *   *Desideratum 5: Cross-Jurisdictional Stability.* Must explain why something is corrupt in Place A and Place B even if legal in A. (Motivation: User's point on jurisdiction).
      *   *Desideratum 6: Internal/External Critique.* Must be able to judge practices insiders accept. (Motivation: "Everyone does it" defence).
