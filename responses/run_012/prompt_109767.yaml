      *   The tension lies between *universalism* (corruption is wrong everywhere) and *relativism* (norms vary by culture).
      *   The tension lies between *legalism* (breaking rules) and *moralism* (violating trust/norms).
      *   The tension lies between *intent* (selfishness) and *outcome* (systemic decay).

  3.  **Drafting the Desiderata (Iterative Process):**

      *   *Desideratum 1: Scope.* Must cover public and private spheres. (Motivation: Private firm favours).
