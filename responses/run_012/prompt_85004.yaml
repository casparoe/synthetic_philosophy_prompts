answer: |-
  Here is the ranking of your candidate principles by coverage, the verdict you must sacrifice, and the distinction regarding Gongsun Long.

  ### Ranking Your Candidates
  1.  **Candidate (c) ("Is" ambiguity):** This is the strongest foundation, but it is incomplete on its own. It correctly identifies that "is" slides between *class membership* (a white horse is a member of the class Horse) and *term identity* (the concept "White Horse" is not identical to the concept "Horse"). However, to handle your "stone lion" vs. "dead parrot" problem, it needs a specific test for *which* sense of "is" applies.
  2.  **Candidate (b) (Resembling vs. Being):** This saves most of your pile but fails on the "dead parrot." A dead parrot does not "resemble" a parrot in function; it *is* the biological remains of one. This principle incorrectly predicts "dead parrot is not a parrot" if "being a parrot" requires life.
  3.  **Candidate (a) (Cancel vs. Narrow):** This is merely a description of your verdicts, not an explanation. It saves nothing because it offers no rule for deciding which adjectives cancel and which narrow.

  ### The Principle That Saves the Pile
  To make Candidate (c) work, you must upgrade it with a **Criteria of Identity** test. The ambiguity of "is" is resolved by looking at what defines the noun's essence.

  *   **Natural Kinds (Horse, Parrot, Diamond):** Essence is biological origin or chemical structure.
  *   **Functional Kinds (Dancer, Senator, Gun):** Essence is current capacity or status.
  *   **Artifact/Representational Kinds (Stone Lion, Toy Duck):** Essence is intent to represent, not to *be*.

  **The Rule:** A modifier preserves the noun's reference (the "is" of membership) only if the object satisfies the essential criteria of identity for that kind. Modifiers like *white, bad,* or *dead* describe accidental properties or states that do not destroy the essence. Modifiers like *fake, toy, stone,* or *former* explicitly signal a failure to meet the essential criteria (chemical, biological, or functional).

  ### The Verdict You Must Drop
  You have to give up the counting intuition: **"The zoo has three lions" is fine to say even when two of them are stone.**

  Strictly speaking, this is false. It is a pragmatic ellipsis for "lion-statues" or "representations of lions." In the "evidence bag" case ("four fake guns... zero guns"), the context forces strict semantic truth (legal inventory). In the "zoo" case, context allows loose speech (tourist view). To keep the principle robust, you must accept that semantically, a stone lion is no more a lion than a fake diamond is a diamond; the zoo sentence is just conversational shorthand, not a counter-example to the logic.

  ### Predictions for New Cases
  Applying the **Criteria of Identity** principle:
  *   **Wooden horse:** Not a horse (fails biological essence).
  *   **Decoy duck:** Not a duck (fails biological essence).
  *   **Forged passport:** Not a passport (fails legal/functional essence; it is a fake document).
  *   **Ex-husband:** Not a husband (fails status essence).
  *   **Painting of a horse:** Not a horse (fails biological essence).
  *   **Synthetic ruby:** Is a ruby (if it shares the corundum crystal structure, it meets chemical essence, unlike a "fake" glass ruby).
  *   **Someone who bought his medical diploma:** Not a doctor (fails functional/legal qualification essence, even if he acts like one).

  ### Gongsun Long and the "Yue" Puzzle
  **Is "White Horse" the same as "Fake Diamond"?**
  No. This is the crucial insight you suspected.
  *   **Fake Diamond** is a **Privative** compound. The extension of "fake diamond" and "diamond" do not overlap. (Intersection is empty).
  *   **White Horse** is a **Subsective** compound. The extension of "white horse" is a *subset* of "horse".
  *   Gongsun Long's trick is conflating **Class Membership** with **Term Identity**. He argues that because the *term* "White Horse" (color + shape) is not identical to the *term* "Horse" (shape), the *object* cannot be a member of the class Horse. He is right that the *names* are different, but wrong to imply the *animal* isn't a horse. The "request" argument (ask for a horse, get a black one) proves that the *satisfaction conditions* for the terms differ, not that the ontology differs.

  **"Today go to Yue but arrive yesterday":**
  This is a different genre entirely. The "White Horse" dialogue is **Semantic/Mereological** (about parts, wholes, and names). The "Yue" puzzle is **Temporal/Indexical**. It relies on the relativity of time zones or the duration of travel shifting the indexical "today" into "yesterday" relative to the arrival. It is a puzzle about logic and time, not about whether a modifier negates a noun.

  Principle: A modified noun phrase denotes an instance of the noun only if the object satisfies the essential criteria of identity for that kind, treating "fake," "toy," "stone," and "former" as constitutive failures while "white," "dead," and "bad" describe accidental or retained properties.
