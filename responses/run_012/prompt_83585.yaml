answer: |-
  **TO:** Dr. Aris Thorne, Chair, Pest Management Advisory Group
  **FROM:** Alex Mercer, Undergraduate Student Representative
  **DATE:** October 23, 2023
  **SUBJECT:** Opinion on Proposed Summer Insecticide Protocol

  **Recommendation**

  I recommend that the committee **reject the proposed blanket spraying schedule** as currently written. Instead, I move we approve a **Threshold-Based Integrated Pest Management (IPM) Pilot** for the upcoming season.

  Under this plan, no prophylactic fogging occurs. Spraying is triggered *only* if mosquito trap counts exceed CDC risk thresholds for West Nile Virus or if bite complaints per capita exceed a defined baseline during orientation weeks. The Grounds Office retains the authority to deploy larvicide in the pond, but fogging along the wetland edge and pollinator garden is prohibited. We review trap data and health reports in mid-August to decide on September treatment. If the committee fails to pass this amendment by Thursday, the existing auto-renewal contract locks us into the blanket schedule. We must vote to change the terms.

  **Reasoning and Policy Adherence**

  Our campus policy mandates the "least toxic method that is effective." The current proposal assumes "effective" means "zero bites" or "zero complaints." This is ethically and practically untenable. If we define effectiveness as risk reduction rather than risk elimination, we can meet safety goals without the chemical load proposed.

  We have conflicting stakeholder harms here. On one side, we have statistical health risks (West Nile) and comfort issues (orientation events). On the other, we have documented harms: the grounds crew working in Tyvek during July heat, students with asthma in adjacent dorms, the potential contamination of the community garden, and the destruction of the Bio Department's pollinator garden. Furthermore, the limnology class relies on the pond's invertebrate data; broad-spectrum larvicide and runoff compromise that academic resource. When the "least toxic" policy is weighed against these tangible, localized harms, the burden of proof must be on the Grounds Office to demonstrate that less toxic methods (like targeted trapping or larvicide only) are insufficient. They have not yet provided that data.

  **Addressing the Replaceability Argument**

  A concern has been raised that insect mortality is ethically neutral because the individuals killed would have died naturally within weeks, and the population recolonizes by spring. This is the "replaceability argument," often used in animal agriculture. It does not hold in pest management.

  In agriculture, the breeder controls the birth rate to match the harvest. In wild pest control, we are not harvesting a fixed crop; we are attacking a wild population within a fixed carrying capacity. Killing adult mosquitoes does not reduce the total "insect-days" of suffering or existence; it creates a vacuum. It removes competitors and predators, often triggering a rebound effect where surviving females lay more eggs or migrants fill the niche immediately.

  More importantly, this argument ignores non-target effects. The pyrethroids proposed do not distinguish between a mosquito and a bee, a caterpillar, or an aquatic invertebrate. Those organisms are not "replaceable" on a three-week cycle. The pollinator garden represents a multi-year investment in biodiversity that a single fogging pass can reset. To argue that the target pests are replaceable is to ignore the collateral damage that is not. We cannot justify the certain death of non-target pollinators based on the theoretical replaceability of the target vector.

  **Free-Riding vs. Resistance Management**

  We know the town will fog the park across the north gate regardless of our vote. One committee member argued this makes our abstention "free-riding" on their control. The counter-argument is resistance management.

  Mosquito resistance to pyrethroids is a growing global health crisis. If every jurisdiction sprays on the same schedule, we accelerate the evolution of resistant super-vectors. By maintaining our campus as a chemical refuge zone, we actually preserve the efficacy of the town's program in the long term. This is not free-riding; it is a public service to regional vector control. If we spray simply because the town sprays, we contribute to a tragedy of the commons where the chemicals stop working for everyone, including the town. Ethically, we have a duty to minimize resistance, not just minimize our own immediate bites.

  **Visible Harm and Statistical Risk**

  Finally, we must address the disparity between visible and invisible harm. The benefits of spraying are statistical: a marginal reduction in a low-probability disease risk spread across thousands of people. The harms are visible and concentrated: piles of dead insects, grounds crew exposure, and asthma triggers for specific students.

  It is tempting to dismiss the visible dead insects as "just bugs." But in an Environmental Ethics context, we must acknowledge that they are moral patients, even if they do not have human rights. They are stakeholders. To ignore their death entirely is to violate the spirit of this committee. However, the stronger argument is human health equity. We are prioritizing the comfort of the majority (orientation attendees) over the respiratory health of the minority (asthmatic students in dorms) and the occupational health of the workers applying the toxin. When the risk is statistical for the many but physiological for the few, the "least toxic" policy demands we protect the vulnerable first.

  **Conclusion**

  We can manage the West Nile risk without a blanket chemical schedule. By shifting to threshold-based triggers, we respect the data, we protect our pollinators and wetland, we support regional resistance management, and we adhere to our own policy on toxicity.

  I ask the committee to vote against the current contract renewal and adopt the Threshold-Based IPM Pilot.

  **Action Items:**
  1.  **Vote:** No on the blanket summer schedule.
  2.  **Mandate:** Grounds to install traps by May 15; report counts to committee bi-weekly.
  3.  **Trigger:** Fogging authorized only if trap counts exceed CDC action thresholds.
  4.  **Review:** Committee reconvenes August 15 to assess season data.
