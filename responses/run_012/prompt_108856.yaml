answer: |-
  Good evening. For those who don't know the custom: there are four toasts tonight. The first three speakers are supposed to tell stories that get progressively wilder. They are supposed to top each other.

  I am the fourth speaker. And I am not going to top them. I am going to end the sequence.

  The first three stories painted a picture of a woman who never backed down. A woman who fought until the lights went out. It's a flattering picture. It's the picture the newsroom wants to keep. But it is not the whole picture. And because her sister and her children are sitting right there in the front, I need to tell you the version of the story that doesn't require you to speak journalism to understand it.

  Twenty-two years ago, this paper and a rival were chasing the same investigation. It became a race. Four years. Two million dollars. By the third year, the editor sitting before us asked to be taken off the story.

  Half the people in this room have never forgiven her for that. They call it a surrender. They say she lost the race. But I spent a year reporting on why people pay for things they have already lost, and I can tell you what happened. It wasn't a surrender. It was a refusal to play a rigged game.

  There is a simple experiment economists run. It's called a dollar auction. You auction off a single dollar bill. The highest bidder gets the dollar. But here is the trap: the second-highest bidder also has to pay their bid, and they get nothing.

  So, I bid ten cents. You bid twenty. I bid thirty. We keep going. Once we pass one dollar, logic says we should stop. But if I'm at ninety cents and you're at a dollar, I can't stop. If I stop, I lose ninety cents. If I bid $1.10, I only lose ten cents. So I bid. And you bid $1.20. We keep bidding past the value of the prize because neither of us can afford to be the one who stops.

  Twenty-two years ago, our editor realized she was in that auction. She realized the story was the dollar, and the cost was the newsroom's life. In the third year, she saw that winning would cost more than the prize was worth. She didn't quit because she was weak. She quit because she was the only one who noticed the math had broken.

  To the newsroom, that looked like folly. To her family, I want you to know: it was integrity.

  She taught me the difference between a commitment and a sunk cost. A commitment is a promise about the future; it is worth keeping because other people are counting on you. A sunk cost is a payment from the past; it is worth dropping because the only thing keeping you in the game is what you have already spent.

  She held her commitments for two years. She dropped the sunk cost in the third. The same decision looks like fidelity from one side of that line and failure from the other. But she knew the difference.

  Some of you remember the charity dinner five years ago. The food bank auction. The auctioneer was working the room, using that same pressure—the fear of looking cheap to drive the price up. Bidding was stuck. She stood up. She pledged to match the standing bid, on the condition that everyone else put their paddles down.

  The room went silent. Some called it generosity. Some called it sabotage. I call it consistency. She saw the room bidding against itself, paying more to win a moment than the moment was worth. She didn't try to win the auction. She broke the mechanism. She paid to let everyone else stop.

  That is what she is doing tonight.

  Retirement looks like leaving. It looks like walking away from the desk, the deadlines, the fight. But if you understand the trap, you know it isn't leaving. It is the only move left that makes sense. It is putting the paddle down. It is refusing to bid one more dollar on a game that has already cost enough.

  To her family: You never saw the blood. You only saw the healing. You saw a woman who knew that there is a time to hold on, and a time to let go, and that wisdom is knowing which is which.

  To the newsroom: We wanted a redemption story. We wanted to believe she saw the finish line and crossed it. The truth is narrower, and less consoling. She saw the cliff, and she stopped walking.

  So, I am not going to tell a wilder story. I am not going to top the previous speakers. I am going to do what she taught me to do. I am going to stop the bidding.

  Please raise your glasses.

  To the editor who hired me. To the woman who knew that the only way to win a dollar auction is not to play. And to the quiet courage it takes to pay the price of stopping, so you don't have to pay the price of continuing.

  To [Editor's Name].
