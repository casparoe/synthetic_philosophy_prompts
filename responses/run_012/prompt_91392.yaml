answer: |-
  # Activity Design: The Informational Market Game

  **Objective:** To induce a violation of the Milgrom–Stokey No-Trade Theorem in Phase 1, and a satisfaction of its conditions (via an escape hatch) in Phase 2, allowing students to empirically distinguish between informational trade (impossible under common knowledge/rationality) and liquidity trade (permitted).

  **Participants:** 18 Graduate Students.
  **Time:** 90 Minutes.
  **Materials:**
  *   1 Bingo cage or opaque urn with 100 balls (numbered 00–99).
  *   18 "Signal Envelopes" (prepared in advance).
  *   18 "Order Sheets" (Buy/Sell/Pass).
  *   6 "Liquidity Shock" Cards (Phase 2 only).
  *   Projector/Whiteboard for tracking the Clearing Price.
  *   Scorecard spreadsheet (projected).

  ---

  ## 1. The Setup (Minutes 0–10)

  **The Common Prior (Public Ritual):**
  1.  Place the urn on the table. State clearly: *"Inside is one number, $V$, drawn uniformly from 0 to 99. This is the true value of the Asset. I will not reveal it until the end of class."*
  2.  State the Distribution: *"Every integer is equally likely. We all know this. We all know that we all know this."* (Write **Common Prior** on the board).
  3.  **Endowment:** Every student receives **100 Points Cash** and **1 Unit of the Asset**.
  4.  **Payoff Rule:** Final Score = Cash + (Asset Units $\times$ $V$).
  5.  **Transaction Fee:** Every executed trade costs **2 Points** (deducted from Cash). *Note: This ensures that zero-sum informational trading results in a net loss, satisfying your constraint that informed traders can lose points.*

  **The Private Signals:**
  1.  Distribute the Signal Envelopes.
  2.  **Signal Generation:** You (the instructor) have pre-generated these based on a hidden $V$ (e.g., $V=64$).
      *   For each student $i$, $Signal_i = V + \epsilon_i$, where $\epsilon_i$ is drawn from Uniform[-10, 10].
      *   *Constraint:* Ensure at least one student receives a signal equal to $V$ (perfect information). Ensure the average of all signals is close to $V$.
  3.  **Instruction:** *"Your signal is your private information. It is noisy. You may not show it to anyone. You are rational point-maximizers. You know everyone else in this room is also a rational point-maximizer."* (Write **Common Knowledge of Rationality** on the board).

  ---

  ## 2. Phase 1: The Informational Market (Minutes 10–30)

  **Rules:**
  1.  Students submit a sealed **Order Sheet**:
      *   **Buy:** Willing to buy up to 1 unit at Price $P$.
      *   **Sell:** Willing to sell up to 1 unit at Price $P$.
      *   **Pass:** No trade.
  2.  **Clearing:** You collect all sheets. You calculate the **Clearing Price** where Supply meets Demand (or the midpoint of the spread if no exact match).
  3.  **Execution:** Trades are executed at the Clearing Price. Fees are applied.
  4.  **Crucial Pause:** Before revealing the Clearing Price, ask the room: *"If the Clearing Price turns out to be 70, what does that tell you about the signals held by the people selling to you?"*
      *   Allow 2 minutes of whispered discussion. Do not answer.
  5.  Execute trades. Record scores.

  **Expected Outcome (The Trap):**
  *   Students will trade. They will believe their signal is better than the market's.
  *   The Clearing Price will likely be closer to $V$ than most individual signals (the "Wisdom of Crowds" effect).
  *   **The Loser:** The student with the "perfect" signal ($Signal = V$) will likely trade (buy or sell) because the Clearing Price will differ slightly from $V$ due to noise in other signals. Because the price aggregates the *group's* information, the perfect signal holder cannot extract surplus. After the 2-point fee, they will end Phase 1 with *fewer* points than if they had done nothing.

  ---

  ## 3. Phase 2: The Liquidity Shock (Minutes 30–50)

  **Rules:**
  1.  Reset Cash/Asset to initial endowment (100 Cash, 1 Asset). Keep $V$ the same.
  2.  **Distribute Shock Cards:**
      *   **6 Students (Sellers):** Receive "Urgent Liability." *Must* sell 1 unit at any price > 0. (They are Noise/Liquidity Traders).
      *   **6 Students (Buyers):** Receive "Investment Mandate." *Must* buy 1 unit at any price < 100. (They are Noise/Liquidity Traders).
      *   **6 Students (Neutral):** No constraints. Pure speculators.
  3.  **Common Knowledge:** Announce: *"Everyone knows that exactly 6 people are forced to sell and 6 are forced to buy. This is not private information."*
  4.  Run the Order Sheet/Clearing mechanism again.

  **Expected Outcome:**
  *   Volume will increase significantly.
  *   The Clearing Price will still aggregate information, but trade now occurs *despite* the information because the forced traders have non-informational motives.
  *   Neutral speculators may trade to provide liquidity, earning the spread (if allowed) or simply facilitating the forced exchange.
  *   Scores should generally improve for the forced traders relative to their constraint (they met the mandate), and speculators should break even or gain slightly by absorbing the liquidity need.

  ---

  ## 4. The Debrief (Minutes 50–90)

  **Part A: The Post-Mortem (50–65)**
  1.  **Reveal $V$.** Calculate final scores.
  2.  **Identify the Loser:** Call on the student who had the perfect signal ($Signal = V$) but lost points in Phase 1.
      *   *Ask:* "You knew the true value. Why did you lose?"
      *   *Target Answer:* "Because the price was already 'right' enough that I couldn't profit, and the fee ate me."
      *   *Instructor:* "The price absorbed your information before you even traded. Your willingness to trade at that price signaled to the market that you *didn't* have superior information, or the market would have moved."
  3.  **Map to Hypotheses:** Draw four columns on the board:
      *   Common Prior.
      *   Common Knowledge of Rationality.
      *   Ex Ante Efficiency (Endowment).
      *   No Noise Traders.
  4.  **Interrogate Phase 1:** "You traded. Theorem says you shouldn't. Which column did you violate?"
      *   *Most will say:* "I thought others were irrational/noisy." (Violates Common Knowledge of Rationality).
      *   *Some will say:* "I thought my prior was better." (Violates Common Prior -> Irrationality).
      *   *Instructor:* "If you believe the others are rational, you must treat their willingness to sell as a signal that the asset is bad. This is the **Lemons Inversion**. By ignoring that inference, you treated them as noise traders. But Phase 1 had no noise traders."

  **Part B: The Escape Hatches (65–75)**
  1.  **Interrogate Phase 2:** "Trade happened here. Why was it allowed?"
      *   *Answer:* "The Shock Cards."
      *   *Instructor:* "Exactly. You introduced **Non-Informational Motives** (Liquidity/Hedging). This is the only way rational, informed agents trade in this model. You are not trading *on* information; you are trading *despite* it to satisfy a constraint."
  2.  **Hayek vs. Grossman-Stiglitz:**
      *   *Hayek:* "Did prices aggregate knowledge?" (Yes, the Clearing Price was likely closer to $V$ than most signals).
      *   *Grossman-Stiglitz:* "If the price tells you everything, why did you pay for the signal? Why did you bother looking in your envelope?"
      *   *Tension:* "If markets are informationally efficient (No-Trade), prices reveal all. If prices reveal all, no one gathers info. If no one gathers info, prices can't be efficient. We resolved this in Phase 2 with noise traders. They camouflage the informed traders."

  **Part C: The Second No-Trade (75–85)**
  1.  **Myerson-Satterthwaite:**
      *   "We just discussed Common Values (the Asset had one true $V$). What if values were Private? (I value this pen at \$5, you at \$10, but we don't know each other's values)."
      *   "Even with gains from trade, if we bargain privately, we often fail to trade to protect our informational rent. That is a *second* No-Trade theorem. Markets trade not because it's easy, but because institutions (like Phase 2 liquidity shocks) force the friction down."

  **Part D: Conclusion (85–90)**
  *   Summarize: Trade is either liquidity (Phase 2) or disagreement about rationality (Phase 1). True "informational trading" among rational peers with common priors is a logical impossibility.

  ---

  ## 5. Predictable Failure Modes & Limitations

  **1. The "Common Knowledge of Rationality" Illusion**
  *   **Failure:** The activity *relies* on students violating the Common Knowledge of Rationality in Phase 1. If they truly believed everyone else was perfectly rational, they would not have traded. The game "works" (produces trade) only because the assumption is false in the classroom.
  *   **Instructor Fix:** Do not hide this. In the debrief, explicitly state: *"This game functioned only because you implicitly assumed someone else in this room was less rational than you. That is the empirical content of the theorem: Trade is a measure of perceived irrationality."*

  **2. Risk Aversion vs. Information**
  *   **Failure:** Students may not trade in Phase 1 not because of the No-Trade logic, but because they are risk-averse. Linear points do not perfectly simulate risk neutrality.
  *   **Instructor Fix:** Acknowledge this. "Risk aversion is another escape hatch. If you are more risk-averse than me, we trade to share risk, not information. We suppressed this by making the stakes small relative to your 'wealth' (100 points), but it remains a confound."

  **3. The "Loser" Constraint**
  *   **Failure:** You requested one informed participant lose points because the price absorbed their info. In a single-shot game, variance might let them win by luck.
  *   **Instructor Fix:** The **Transaction Fee** is your safety net. Even if they break even on the asset, the fee ensures a net loss. Emphasize that in a continuous market, the fee represents the bid-ask spread, which informed traders must overcome.

  **4. Anecdote vs. Equilibrium**
  *   **Failure:** You will generate 18 data points, not an equilibrium. Students will focus on their specific win/loss rather than the structural logic.
  *   **Instructor Fix:** Aggregate the data on the board. Show the **Mean Absolute Error** of Individual Signals vs. the **Clearing Price**. If the Price Error < Average Signal Error, you have proven information aggregation empirically, validating the "price absorbs info" claim.

  **5. What You Are Missing (The Honest Answer)**
  *   **Dynamic Learning:** The theorem assumes a static snapshot. In reality, traders learn *from* the fact that trade occurred. A one-shot game cannot capture the iterative "I know that you know that I know" recursion that eventually halts trading.
  *   **Institutional Friction:** Real markets have specialists, market makers, and regulations that alter the informational structure. The game presents a frictionless void.
  *   **The "Why" of Belief:** You cannot force a student to *feel* the Common Knowledge of Rationality. They will always harbor a private suspicion that "Bob in the back row is guessing." The theorem requires them to know Bob is rational. You must supply this missing premise in your voice during the debrief: *"The theorem holds only if you trust Bob as much as you trust yourself. Do you?"*

  ---

  ## 6. Minute-by-Minute Timeline

  *   **00–05:** **Intro.** No theory. Just rules. "Maximize points."
  *   **05–10:** **The Ritual.** Draw $V$. Distribute signals. Emphasize Common Prior.
  *   **10–20:** **Phase 1 Trading.** Collect orders. Calculate price. *Pause for inference question.* Execute.
  *   **20–25:** **Score Check.** Briefly display Phase 1 P&L.
  *   **25–30:** **Phase 2 Setup.** Distribute Liquidity Shock cards. Explain constraints.
  *   **30–40:** **Phase 2 Trading.** Execute.
  *   **40–45:** **Final Reveal.** Show $V$. Calculate Final Scores. Identify the "Informed Loser."
  *   **45–60:** **Debrief Part 1.** The Hypotheses. Why Phase 1 trade was "irrational."
  *   **60–70:** **Debrief Part 2.** The Escape Hatches. Liquidity, Risk, Bounded Rationality.
  *   **70–80:** **Debrief Part 3.** Hayek, Grossman-Stiglitz, Myerson-Satterthwaite.
  *   **80–90:** **Closing.** Name the theorem. Distribute reading (Milgrom & Stokey, 1982).
