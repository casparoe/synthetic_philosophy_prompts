  6.  **Final Polish:**
      *   Ensure the distinction between "Risk-Weighted Expected Utility" (Buchak's specific theory) and generic "Rank-Dependent Utility" is clear enough without getting bogged down. The prompt implies Buchak's specific formulation ("Risk-weighted expected utility" is the title of her book).
