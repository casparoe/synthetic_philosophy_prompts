  5.  **Refining the Audit (Self-Correction during drafting):**
      *   *Sentence 4:* The description "adjusts it in the light of how she feels about the outcome" is psychologically loaded. REU is about the *structure* of the risk, not the *feeling*. Also, it weights *cumulative* probabilities (chance of getting *at least* x), not the probability of the specific outcome in isolation. This is a technical but important distinction.
      *   *Sentence 7:* The "normative twin" claim is the most dangerous simplification. PT has a reference point (gains vs losses). REU does not (it's over final wealth/outcomes ordered from worst to best). PT weights probabilities of gains and losses differently. REU uses one risk function for the whole gamble.
