  *(Self-Correction on Sentence 8)*: Wait, does REU violate dominance? Buchak argues it satisfies *State-wise Dominance*. It violates *Independence*. Some critics argue it violates other norms, but the standard defense is that it keeps the "basic" rationality constraints (Transitivity, Dominance) while dropping Independence. The colleague says it gives up Transitivity and Dominance. That is definitely wrong.

  *(Self-Correction on Sentence 4)*: "Discounts probabilities of outcomes she welcomes." In REU, if you are risk-averse, you down-weight the probability of getting the *best* outcomes (cumulatively). So "discounts the probabilities of the outcomes she welcomes" is a rough way of saying "down-weights the contribution of the top end of the distribution." It's imprecise but not totally wild. However, the mechanism is via the cumulative distribution function, not individual outcome probabilities. I should flag this as a technical simplification that borders on misleading regarding the *mechanism*.

  *(Self-Correction on Sentence 7)*: "Normative twin." This is the Prospect Theory worry. PT is descriptive. REU is normative. PT uses reference points. REU uses absolute levels (usually). PT violates dominance. REU preserves it. They are *not* twins. They share the idea of non-linear probability weighting, but the implementation and normative status differ wildly.

