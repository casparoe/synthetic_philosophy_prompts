  # Decision Tree: The Justification of Simplicity

  **Entry Point:** You accept that, other things equal, the simpler of two hypotheses that fit the data is the better guide to truth, and that this is more than a matter of taste.

  ### Node 1: What Simplicity Tracks (Branch 2)
  **Question:** If the true distribution turned out to be maximally complex and simplicity gave you worse predictions in your domain, would that refute your commitment or leave it untouched?
  *   **Untouched (Norm):** Go to **Leaf 1**.
  *   **Untouched (Engineering):** Go to **Leaf 2**.
  *   **Refuted (Truth):** Go to **Node 2**.

  ### Node 2: Scope (Branch 6)
  **Question:** Is the question about induction in general (any data sequence) or about model selection inside a fixed statistical family?
  *   **Fixed Statistical Family:** Go to **Node 3**.
  *   **Induction in General:** Go to **Node 4**.

  ### Node 3: Which Simplicity (Branch 3)
  **Question:** When a model with one adjustable parameter and a model with fifty both fit the data, the second is automatically penalized by its prior marginal likelihood. Is that the same phenomenon as the shortest-program idea, a different phenomenon that happens to point the same way, or the only one of the two that does real work?
  *   **Only one that does real work (Parameter Penalty):** Go to **Leaf 3**.
  *   **Same/Different but same way (Description Length):** Go to **Leaf 2** (Reclassified as Pragmatist/MDL).

  ### Node 4: Which Simplicity (Branch 3)
  **Question:** (Same as Node 3).
  *   **Only one that does real work (Parameter Penalty):** Go to **Leaf 9 (Unnamed)**.
  *   **Same/Different but same way (Description Length):** Go to **Node 5**.

  ### Node 5: Language-Dependence (Branch 1)
  **Question:** When two hypotheses fit the data equally well, suppose that one has the shorter description only in language A and the other only in language B. Does this show that the simplicity comparison is ill-defined, that it is well-defined up to a bounded amount that washes out in the long run, or that the choice of language is a free parameter that never fully disappears?
  *   **Ill-defined / Free Parameter:** Go to **Leaf 4**.
  *   **Well-defined up to a bounded constant:** Go to **Node 6**.

  ### Node 6: Realizability (Branch 4)
  **Question:** An oracle could tell you the shortest program generating the data, but no finite agent can compute it, and the ideal prior that weights hypotheses by program length is itself not computable: an agent can approximate it from below but can never bound its own error. Does a justification have to be realizable by a finite agent to count, or is it enough that the ideal exists as a mathematical object that we approximate?
  *   **Must be realizable (Computable):** Go to **Leaf 5**.
  *   **Ideal exists (Mathematical):** Go to **Node 7**.

  ### Node 7: The Universality Objection (Branch 5)
  **Question:** Averaged over all possible problems, every inductive method does equally well, so for every problem on which a simplicity prior excels there is one on which it fails. Does this defeat the claim that simplicity is a guide to truth, or is it beside the point because the world is not drawn at random from the space of all problems and the relevant restriction to structured or computable environments does the work?
  *   **Defeats the claim:** Go to **Leaf 6**.
  *   **Beside the point:** Go to **Node 8**.

  ### Node 8: Source of Structure (Additional Branch)
  **Question:** Is the restriction to structured environments a requirement of rational inference itself, or a contingent fact about the physical laws of our universe?
  *   **Requirement of Rationality:** Go to **Leaf 7**.
  *   **Contigent Physical Fact:** Go to **Leaf 8**.

  ---

  ### Leaf Positions

  **Leaf 1: Conventionalist**
  *   **Commitment:** Occam's razor is a norm of theory choice rather than a claim about the world.
  *   **Weakest Point:** It explains why we *prefer* simple theories but cannot explain why this preference successfully tracks reality.

  **Leaf 2: Pragmatist**
  *   **Commitment:** Simplicity is a better engineering choice (shorter compression, less computation) rather than a truth indicator.
  *   **Weakest Point:** It abandons the entry commitment that simplicity is a guide to *truth*, reducing it to a guide to utility.

  **Leaf 3: Bayesian**
  *   **Commitment:** Simplicity is nothing over and above marginal likelihood within a fixed model family.
  *   **Weakest Point:** It cannot justify the choice of the prior family itself without appealing to external simplicity assumptions.

  **Leaf 4: Relativist**
  *   **Commitment:** Convergence holds but the machine-dependent constant leaves no unique ranking for finite data.
  *   **Weakest Point:** It offers no guidance for single-case inference where the additive constant dominates the error term.

  **Leaf 5: Constructivist Skeptic**
  *   **Commitment:** The whole ideal is an unusable idealization because the prior cannot be computed.
  *   **Weakest Point:** It conflates the justification of a truth with the practical method of finding it, dismissing true but uncomputable relations.

  **Leaf 6: Domain-Specific Heuristic**
  *   **Commitment:** Simplicity is a domain-specific heuristic with no universal justification.
  *   **Weakest Point:** It cannot justify applying simplicity to novel domains where past success is not yet established.

  **Leaf 7: Solomonoff Realist**
  *   **Commitment:** The universal prior genuinely solves the problem of induction and simplicity is objective.
  *   **Weakest Point:** It relies on uncomputable mathematical objects that no physical agent can ever instantiate or verify.

  **Leaf 8: Structural Realist**
  *   **Commitment:** Simplicity works because the physical world is contingently structured, not because rationality demands it.
  *   **Weakest Point:** It makes the success of induction a lucky accident of our universe rather than a necessary feature of inference.

  **Leaf 9: Unnamed**
  *   **Commitment:** General induction is justified by parameter penalization rather than description length.
  *   **Weakest Point:** There is no clear account of how to count "parameters" outside of a fixed statistical model family.

  ---

  ### Analysis of Logical Space

  **Unoccupied Combinations**
  1.  **General Induction + Parameter Penalty + Truth:** (Leaf 9 is the closest, but rarely defended). This view is **incoherent** because "parameters" are defined relative to a model family, which contradicts the "General Induction" scope where no family is fixed.
  2.  **Model Selection + Description Length + Truth:** (Routed to Leaf 2). This view is **merely unattractive**; it is logically possible (MDL can be interpreted realistically), but proponents usually retreat to Pragmatism when pressed on the "truth" claim because code length is representation-dependent.
  3.  **Language-Relative + Computable Required:** (No leaf). This view is **unexplored**. If one demands computability, one usually seeks an invariant measure (like resource-bounded complexity); demanding both relativity and computability yields a tool with no stability and no ideal limit.

  **Indistinguishable Leaves**
  *   **Leaf 7 (Solomonoff Realist) and Leaf 8 (Structural Realist).**
      *   **Diagnosis:** The tree cannot separate these because both accept the "Beside the point" answer to the Universality Objection and rely on an uncomputable ideal.
      *   **Required Question:** "If the physical laws of our universe were maximally complex (random noise), would a rational agent still be compelled to use a simplicity prior?" (Yes = Solomonoff/Rationalist; No = Structural/Physicalist).
