answer: |-
  # PREP SHEET: SCRIPTED COORDINATION
  **Time:** 20 min presentation / 30 min Q&A
  **Audience:** Mind/Action generalists, 2 Social Ontologists, 1 Legal Philosopher, 1 Game Theorist.
  **Tone:** Defensive but flexible. Do not get bogged down in terminology; keep the focus on the *function* of the script.

  ---

  ### 1. The 'Missing Glue' Objection (Social Ontologists)
  **The Question:** "You've eliminated the 'jointness' from joint action. If I follow a recipe and you follow the same recipe, but we never intend to act *together*, we're just two individuals cooking in parallel. By removing shared intention or commitment, haven't you just redescribed aggregate behaviour and called it coordination?"
  **The Reply (2 mins):** Hold the line on the **Deviation Test**. Parallel behaviour collapses when one party deviates; joint action adjusts. If I burn the sauce and you immediately switch to Plan B without us exchanging a word, that responsiveness *constitutes* the jointness. The 'glue' isn't a mental state; it's the functional coupling via the script. We aren't two clocks ticking in sync; we are two gears in a box. If one slips, the other jams. That mechanical interdependence is sufficient for joint action without positing a 'we-subject'.
  **Soft Spot:** You risk reducing social interaction to mere causality. The ontologists will argue responsiveness is a *symptom* of shared intention, not a substitute.
  **Concede Up Front:** Concede that this doesn't capture the *phenomenology* of 'we-ness'. Admit your account is third-person functionalist, not first-person experiential. "I'm not denying the feeling exists; I'm denying it's necessary for the action."

  ### 2. The 'Regress of Scripting' Objection (Mind/Action & Ontologists)
  **The Question:** "Scripts don't fall from the sky. If two agents negotiate a script mid-action ('You go left, I'll go right'), isn't *that* negotiation a joint action? If so, doesn't your theory presuppose the very shared intention it claims to eliminate?"
  **The Reply (2 mins):** Distinguish between *script creation* and *script execution*. My claim is about the stability of the action *once the script is in play*. Scripts can emerge evolutionarily, be imposed by hierarchy, or be learned culturally without a specific moment of joint commitment. Even in negotiation, they are often trading proposals based on prior, existing scripts (language, norms). We don't need a shared intention to start; we need mutual responsiveness to lock in the protocol.
  **Soft Spot:** Deliberate, novel collaboration (e.g., improvising a heist) looks like it requires shared intention to generate the initial script.
  **Concede Up Front:** Concede that *deliberate creation* of new scripts might involve shared intention. Limit your claim: "I am defending the *maintenance* of joint action, not necessarily its genesis."

  ### 3. The 'Implicit Script' Trap (Philosophy of Mind)
  **The Question:** "You say scripts can be implicit. If a script isn't written down or spoken, where does it exist? If it's in the agents' heads as a rule they represent, isn't that just a mental state by another name? You haven't externalised the intention; you've just hidden it."
  **The Reply (2 mins):** An implicit script is not a mental representation; it's a set of **affordances**. Think of a narrow doorway: the 'script' is 'single file'. It's in the architecture, not the head. Agents respond to the environment and each other's bodies. The 'rule' is descriptive of the stable pattern, not a premise in their practical reasoning. They don't need to represent the rule to follow it; they just need to encounter resistance when they break it.
  **Soft Spot:** It is very hard to draw a clean line between 'responding to affordances' and 'acting on a tacit belief'.
  **Concede Up Front:** Concede the boundary is fuzzy. "I grant that highly internalised scripts look like habits. But the normativity comes from the public expectation, not the private habit."

  ### 4. The 'Spontaneity' Counterexample (General Audience)
  **The Question:** "Consider two strangers lifting a heavy sofa together without planning. There is no script, no protocol, no prior negotiation. They just heave. Your theory seems to imply this isn't joint action until they've established a 'script'. That's counter-intuitive."
  **The Reply (2 mins):** There is always a micro-script, even if it's biological or physical. The script is: 'Apply force upwards when the other applies force'. They read muscle tension and balance (the script) in real-time. If one lets go, the other stops. That feedback loop *is* the script in operation. It doesn't need to be linguistic or institutional to be a conditional instruction set.
  **Soft Spot:** Calling physical reflexes a 'script' stretches the term so thin it might lose meaning.
  **Concede Up Front:** Concede that 'script' is a technical term here. "I'm using 'script' broadly to mean any stable conditional contingency, not just a written document."

  ### 5. The Deviation Test Circularity (Methodology)
  **The Question:** "Your Deviation Test says: if they could have deviated without collapse, it's joint. But how do we know they *could* have deviated? Usually, we only know that because we assume they were acting jointly. Isn't this circular?"
  **The Reply (2 mins):** It's not circular; it's **counterfactual empirical**. We look at the capacity, not the history. Could the agent have physically or normatively done otherwise without immediate system failure? In a traffic jam (aggregate), if I swerve, the jam persists. In a choir (joint), if I stop singing, the harmony breaks. The fragility of the outcome indicates the jointness. We verify this by observing how the system reacts to errors, not by asking the agents what they intended.
  **Soft Spot:** Determining 'capacity to deviate' is often as hard as determining intention.
  **Concede Up Front:** Concede it's a heuristic, not a metaphysical proof. "It's a diagnostic tool for observers, not a definition for the agents."

  ### 6. Responsibility & The 'Bad Script' (Legal Philosopher)
  **The Question:** "You distribute responsibility by script-role. But what if the script is criminal? If a bureaucrat follows the script of a genocidal regime, you say they bear 'script-responsibility'. Does this let them off the hook for moral agency? Are they just cogs?"
  **The Reply (2 mins):** Script-responsibility is **causal and role-based**, not a moral defence. Identifying someone as a 'script-follower' explains *how* they contributed, not *whether* they are guilty. In fact, my view makes them *more* liable, not less. Because they had the 'capacity to deviate' (per the Deviation Test), they are responsible for not exercising it. The script explains the mechanism of the crime; it doesn't absolve the agent.
  **Soft Spot:** The legal philosopher will press on *mens rea*. If they didn't intend the harm, just followed the script, are they complicit?
  **Concede Up Front:** Concede that script-following is not a sufficient condition for *moral* blame, but insist it is sufficient for *causal* responsibility. "I'm mapping the architecture of accountability, not the final verdict."

  ### 7. Stability & Equilibrium (Game Theorist)
  **The Question:** "Why follow the script? In game theoretic terms, a script is just a focal point. But without a shared intention to coordinate, what stops an agent from defecting if it pays them to do so? You've removed the commitment that stabilises the equilibrium."
  **The Reply (2 mins):** The script changes the **payoff structure**. Following the script becomes the dominant strategy because deviation triggers immediate negative feedback from other participants (who are also following the script). I don't need a normative bond; I need mutual monitoring. If I know you will punish deviation (even unintentionally, by withdrawing cooperation), I stick to the script. It's self-enforcing coordination.
  **Soft Spot:** This works for zero-sum or coordination games, less well for Prisoner's Dilemmas where defection is dominant.
  **Concede Up Front:** Concede this works best in iterative contexts. "I'm not solving the one-shot Prisoner's Dilemma; I'm explaining sustained cooperation."

  ### 8. Normative Force (Social Ontologists)
  **The Question:** "A script describes; a commitment prescribes. You say agents 'ought' to follow the script. Where does the 'ought' come from if there is no joint commitment? You can't get normativity from mere regularity."
  **The Reply (2 mins):** The 'ought' is **hypothetical**, not categorical. *If* you want to participate in this activity, *then* you ought to follow the script. The normativity comes from the goal, not the group. The 'binding' force is the desire to achieve the outcome that the script facilitates. We don't need a 'we-ought'; we just need overlapping 'I-oughts' that align via the script.
  **Soft Spot:** This reduces social obligation to individual instrumental rationality.
  **Concede Up Front:** Concede you are offering a thin normativity. "I'm not explaining moral obligation, just the normative structure of the activity itself."

  ---

  ### The Question You Hope Nobody Asks
  **"The Saboteur Case":** "If I follow the script perfectly but intend to undermine the outcome (e.g., a spy following resistance protocol to expose the group), am I acting jointly with you? Your theory says yes (I follow the script and am responsive). Intuitively, I'm a parasite, not a partner. If I'm a joint actor, does that mean I share collective responsibility for the group's success, even if I wanted it to fail?"

  *Why it's dangerous:* It severs the link between joint action and shared goals. If you say the spy is a joint actor, your responsibility account looks absurd (holding the saboteur responsible for the success they tried to prevent). If you say they aren't, you seem to need intention after all.
  *Prep:* Be ready to say the spy is a **structural participant** but not a **normative partner**. They are liable for the *risks* they created, but not entitled to the *credit*.

  ---

  ### The Single Reply That Must Land
  **You must successfully defend the reply to Objection 1 (The 'Missing Glue').**

  If you cannot convince them that **mutual responsiveness to a public script** is a sufficient condition for joint action without shared intention, the paper collapses into "individual action happening to coincide." The entire theory rests on the claim that the *external coupling* does the work that internal intention usually does. If the Social Ontologists convince the room that responsiveness is merely evidence of intention rather than a substitute for it, you have no distinct subject matter.

  **Strategy:** Keep returning to the **Deviation Test**. It is your empirical anchor. "Don't ask me what's in their heads; ask me what happens when they stop." If you hold that line, the paper survives.
