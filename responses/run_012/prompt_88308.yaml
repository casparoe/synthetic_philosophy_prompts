      *Refining Objection 1 (The Ontologists):* They will say "You've changed the subject." Reply: "I'm offering a functionalist account." Soft spot: Does function capture phenomenology? Concession: Admit it doesn't capture the *feeling* of 'we-ness', but argue that's not necessary for the *fact* of joint action.

      *Refining Objection 2 (The Regress):* "Negotiating the script is joint action." Reply: "Script emergence can be evolutionary or imposed." Soft spot: Deliberate negotiation. Concession: Admit deliberate *creation* of scripts might require shared intention, but *execution* does not.

      *Refining Objection 3 (Implicit Scripts):* "Implicit = Mental." Reply: "Implicit = Environmental affordance." Soft spot: Hard to distinguish. Concession: Admit the line is blurry but insist the locus of normativity is external.

      *Refining Objection 4 (Spontaneity):* "Sofa lifting." Reply: "Micro-scripts exist (gravity, balance)." Soft spot: Seems ad hoc. Concession: Admit 'script' is a broad term here.

      *Refining Objection 5 (Deviation Test):* "Circular." Reply: "Counterfactual capacity is empirical." Soft spot: Hard to measure. Concession: Admit it's a heuristic, not a metaphysical test.

      *Refining Objection 6 (Responsibility):* "Nazi bureaucracy." Reply: "Role responsibility ≠ Moral absolution." Soft spot: Legal philosopher will push on *mens rea*. Concession: Admit script-following isn't a defence against crimes.

      *Refining Objection 7 (Game Theory):* "Equilibrium selection." Reply: "Script solves coordination problem." Soft spot: Why this script? Concession: Admit script selection is the hard problem, not following.

      *Refining Objection 8 (Normativity):* "Ought implies can." Reply: "Script creates the 'ought'." Soft spot: Why bind oneself? Concession: Admit this is pragmatic, not moral.

      *The "Hope Nobody Asks":* "Is a market joint action?" or "Is a traffic jam joint action?" Let's go with the Traffic Jam. It tests the "mutual responsiveness" condition heavily. If I say yes, I look silly. If I say no, I need to explain why without reintroducing shared intention. Actually, the "Who wrote the script?" question in the context of oppression is more damaging to the responsibility claim. Let's go with: "If the script is public, who is excluded from it?" (Power dynamics). No, let's stick to the metaphysical boundary: "Does your theory classify a flock of birds as joint actors?" (Too biological). Let's go with: "If two people unknowingly follow the same script, is it joint action?" (The Common Knowledge problem). This hits the "mutually known" requirement.

      *Wait, the prompt asks for "The question I'm hoping nobody asks".* This should be the "killer" question. The best killer question for anti-intentionalism is usually: "What distinguishes your 'script-following' from two clocks ticking in sync?" or "If I follow a script to sabotage the action, am I acting jointly?" (The Saboteur problem). The Saboteur problem is classic. If I follow the script but intend to fail, Bratman says I'm not acting jointly. You say I am. This undermines the responsibility claim. Let's use the Saboteur.

      *The "Single Reply that Must Land":* It has to be the distinction between Aggregate and Joint. If I can't defend the Deviation Test, the theory collapses.

