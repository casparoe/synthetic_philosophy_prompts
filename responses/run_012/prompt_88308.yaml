      *   **Audience:** Philosophy of mind/action (general), 2 social ontologists (collective intentionality specialists), 1 legal philosopher (corporate responsibility), 1 game theorist (anti-shared intention).
      *   **Tone/Style:** Friendly but territorial. Some think it's just redescribing coordination; others think it denies acting together. British English. No bibliography/citations.
      *   **Deliverables:** ~8 objections (ordered by damage potential), phrased as the audience would ask. For each: 2-minute reply, note on soft spot, concession to make up front. Plus: The "Hope Nobody Asks" question. Plus: The single reply that *must* land for the paper to survive.

  2.  **Deconstruct the Theory ("Scripted Coordination"):**
      *   *Strengths:* Avoids metaphysical baggage of "group minds" or "plural subjects." Fits well with institutional/legal contexts. Appeals to the game theorist.
      *   *Weaknesses:* Risks reducing joint action to parallel individual action (the "sum of parts" objection). Struggles with spontaneous/unscripted joint action (improvisation). The status of the "script" (is it really external? who writes it?). The "Deviation Test" might be circular or too permissive. Responsibility distribution might ignore the *reason* for action.

  3.  **Identify the Audience Perspectives:**
      *   *Social Ontologists (Collective Intentionality):* Will attack the lack of "we-ness." They believe shared intention is constitutive, not just causal.
      *   *Philosophy of Mind/Action:* Will worry about the mental states involved. Is "following a script" just intending to follow a script?
      *   *Legal Philosopher:* Will like the responsibility angle but worry about *mens rea* or the binding nature of the script.
      *   *Game Theorist:* Will like the anti-mentalism but might worry about equilibrium selection or common knowledge assumptions.

  4.  **Drafting the Objections (Iterative Process):**

      *   *Objection 1 (The Big One):* The "Parallel Play" objection. If everyone just follows a script individually, where is the *jointness*? This is the standard Searle/Bratman line. *Damage: High.*
      *   *Objection 2:* The "Script Origin" problem. Who writes the script? If we negotiate it, isn't *that* joint action requiring shared intention? *Damage: High.*
      *   *Objection 3:* Spontaneity/Improvisation. What about moving a sofa together without a plan? *Damage: Medium-High.*
      *   *Objection 4:* The Deviation Test circularity. How do we know they *could* have deviated without knowing they intended to act together? *Damage: Medium.*
      *   *Objection 5:* Responsibility/Moral Luck. If responsibility is script-based, what if the script is immoral? (Legal Phil angle). *Damage: Medium.*
      *   *Objection 6:* Implicit Scripts. If the script is implicit, isn't it just in their heads? (Mind/Action angle). *Damage: Medium.*
      *   *Objection 7:* Game Theory/Equilibrium. Why follow the script? What stabilizes it? (Game Theorist angle). *Damage: Low-Medium.*
      *   *Objection 8:* Normativity. Scripts describe; commitments prescribe. Why *ought* they follow it? (Social Ontologist angle). *Damage: Low.*

      *Refining the Order:* I need to order by *damage*.
      1.  The "Missing Glue" (Social Ontologists): You've eliminated the phenomenon.
      2.  The "Regress of Scripting" (Mind/Action): Negotiating the script requires the very thing you deny.
      3.  The "Implicitness" Trap (Mind/Action): Implicit scripts are just mental states in disguise.
      4.  The "Spontaneity" Counterexample (General): Moving a sofa, dancing without choreography.
      5.  The Deviation Test Circularity (Methodology): You presuppose jointness to define the test.
      6.  Responsibility & The Bad Script (Legal): Complicity vs. Role.
      7.  Stability/Equilibrium (Game Theorist): Why stick to the script?
      8.  Normative Force (Social Ontologist): Why *should* they follow it?

      *Wait, let's look at the "Single Reply that Must Land".* This usually relates to the core definition. If I can't distinguish my view from mere aggregate behaviour, the theory fails. So the reply to Objection 1 (Missing Glue/Parallel Play) is the critical one.

      *The "Hope Nobody Asks" Question:* Usually something that exposes a fatal flaw in the core definition or a counter-example that breaks the whole system. Perhaps: "Is a traffic jam joint action?" (If they follow rules and respond to deviations, does your theory classify a traffic jam as joint action?) Or "Who writes the script in oppressive regimes?" Let's go with the Traffic Jam/Aggregate boundary case, as it threatens the Deviation Test.

