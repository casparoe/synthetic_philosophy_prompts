answer: |-
  ### The Diagnosis: Jurisdictional Camouflage

  You are correct: the metaphysical question is a proxy for the ethical one, but the mechanism is more specific than mere substitution. The diagnosis of this debate is **Jurisdictional Camouflage**.

  Both sides are using the ontology of "disease" to secure a jurisdictional boundary, but they are trying to secure opposite borders.

  *   **The Medical Side** is arguing for **Jurisdiction over Suffering.** When they point to the woman hearing voices or the anorexic child, they are not primarily making a claim about neurons; they are making a claim about *authority to intervene*. They fear that if "mental illness" is demoted to "normative deviation," the insurance stops paying, the hospital stops admitting, and the suffering person is left to moral judgment rather than medical care. For them, "disease" is the credential that grants access to resources and excuses the patient from moral blame.
  *   **The Szaszian Side** is arguing for **Jurisdiction over Liberty.** When they point to drapetomania or the grief criterion, they are not primarily making a claim about lesions; they are making a claim about *limits on power*. They fear that if "disease" is defined by "harmful dysfunction" without a clear biological mechanism, the state gains a blank check to medicalize any behavior it finds inconvenient. For them, "disease" is the credential that grants the state the power to coerce.

  The debate stalls because the word "illness" is doing triple duty: it describes a **phenomenon** (suffering/dysfunction), it justifies a **resource** (insurance/treatment), and it authorizes a **power** (coercion/exemption).

  The "no lesion" argument (migraine/fibromyalgia) fails to resolve this because in general medicine, the link between "no lesion" and "coercion" is weak. You cannot involuntarily commit a migraineur. In psychiatry, the link between "diagnosis" and "coercion" is structural. The Medical side treats the *resource* function as primary (we need the label to help); the Szaszian side treats the *power* function as primary (the label is used to control). They are arguing past each other because one is talking about the **clinic** and the other is talking about the **court**, but they are using the same dictionary.

  ### What Counts as Progress

  Progress will not come from a better definition of disease, nor from a new case study, nor from a metaphysical verdict. The concept of "mental illness" is what sociologists call a **Boundary Object**: it is plastic enough to adapt to the needs of different groups (insurers, doctors, patients, courts) but robust enough to maintain a common identity. If you fix the definition too precisely, you break the system. If you define it strictly biologically, insurance stops covering psychotherapy. If you define it strictly normatively, the state loses the ability to hospitalize the psychotic.

  Therefore, progress in your seminar should not be measured by **Resolution**, but by **Disaggregation**.

  The only move that advances the ball is to separate the **Clinical Claim** from the **Legal Claim**.

  1.  **The Distinction:** You must force the room to distinguish between *Therapeutic Authority* (the right to offer help) and *Coercive Authority* (the right to force help).
      *   Szasz was explicitly clear on this: he opposed the *disease label* only insofar as it legitimized *involuntary intervention*. He was fine with "problems in living" and voluntary therapy.
      *   The Medical side often conflates the two: they argue that because the suffering is real (Clinical), the coercion must be legitimate (Legal).
      *   **Progress looks like this:** A student saying, "I agree that hearing voices is a medical emergency requiring resources, but I disagree that it automatically justifies involuntary commitment without a separate legal hearing on dangerousness."

  2.  **The Criterion:** Stop asking "Is this a disease?" and start asking "What work is this label doing in this specific context?"
      *   In the context of **Insurance**, "disease" means "eligible for reimbursement."
      *   In the context of **Criminal Law**, "disease" means "exempt from responsibility."
      *   In the context of **Civil Commitment**, "disease" means "justification for deprivation of liberty."
      *   **Progress looks like this:** Acknowledging that homosexuality was never a "disease" in the Clinical sense (suffering/dysfunction), but it was a "disease" in the Institutional sense (a category managed by the APA). The 1973 change wasn't a discovery of biology; it was a revocation of institutional authority.

  3.  **The Argument for No Progress:** You should explicitly teach that the ambiguity is **Functional**.
      *   The system *needs* the Szaszians to keep the Medical side honest about coercion (the "migraine" check).
      *   The system *needs* the Medical side to keep the Szaszians honest about suffering (the "anorexia" check).
      *   **Progress looks like this:** The realization that the "fight" is the immune system of the field. If the Szaszians win completely, the vulnerable lose protection and resources. If the Medical side wins completely, the vulnerable lose liberty and rights. The tension is not a bug; it is the feature.

  **Verdict on the Seminar:**
  Tell your students that they are fighting over a **hybrid concept** that is designed to remain unresolved. The goal of the term should not be to decide if Szasz was right, but to map exactly *where* the medical vocabulary is being used to smuggle moral judgments, and *where* the moral vocabulary is being used to deny medical reality.

  Progress is achieved when a student stops asking "Is depression real?" and starts asking "Who gets to decide when sadness becomes a liability, and what powers do they gain when they make that call?" That shifts the debate from metaphysics (which has no exit) to political philosophy (which has levers).
