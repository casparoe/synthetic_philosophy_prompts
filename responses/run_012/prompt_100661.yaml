      *   *New Case: The Benevolent Demon.* Demon threatens to kill everyone *unless* you admire him. You admire him to save others. Is this RKR or WKR? Intuitively WKR. Does the test catch it? "Why is it fitting?" "To save others." That mentions the *effect of having the attitude* (or the consequence of the situation). It seems to pass the test as WKR.
