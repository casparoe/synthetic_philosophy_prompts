      *   *The "Effects" Clause:* The test says "without mentioning... its effects." Many standard right-kind reasons (RKR) *are* about effects or consequences in a broader sense (e.g., admiration for a hero because they inspired others). Wait, no, that's admiring the *act*. What about admiring someone because admiring them strengthens social bonds? That sounds like WKR. But what about fear? I fear the tiger because it will eat me. The *effect* of the tiger on me is the reason for fear. Does the test rule this out? "Why is it fitting to fear?" "Because it will eat me." That mentions the object's properties, not the attitude's effects. Okay.
      *   *Self-Fulfilling Attitudes:* Some attitudes are correct *because* having them brings about a good state. E.g., believing you will succeed (to succeed). Is this a reason for belief? Pragmatic encroachment.
      *   *Emotions with Constitutive Aims:* Fear aims at danger. If the demon threatens me, is the danger real? Yes. So fearing the demon is fitting? No, we fear the *consequence*, not the demon's admirability.
      *   *The "Reason to Want" Move:* This is the classic "Rabinowicz & Rønnow-Rasmussen" move (or similar). The objection is usually that it changes the subject. If I admire the demon because he'll kill me otherwise, I *am* admiring him (in a sense), or at least the reason explains the admiration, not just the desire to admire.
