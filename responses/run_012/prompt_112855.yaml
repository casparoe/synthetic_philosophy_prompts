answer: |-
  You have identified a cluster of arguments that philosophy has struggled to keep distinct, precisely because they share a rhetorical silhouette while relying on different logical engines. The umbrella term you are looking for is **Pragmatic Self-Refutation** (sometimes **Performative Contradiction**), but your intuition is correct: the term is often stretched to cover three distinct phenomena that have different truth-values.

  The ancient background you sense is Plato's *Theaetetus* (171a), where Socrates argues that Protagoras's claim ("Man is the measure of all things") refutes itself because the majority of men believe it false. This is the genesis of the **self-refuting argument** (*aperion logos*). However, the modern formalization comes from Jaakko Hintikka's 1962 analysis of performative inconsistency, and later from the Transcendental Pragmatics of Karl-Otto Apel and Jürgen Habermas.

  To answer your request, we must dissect the umbrella into three distinct joints, determine which ones actually prove falsity, and name the failure mode when the move is abused.

  ### 1. The Taxonomy of the Move

  The "house style" you observe conflates three different relations between a proposition $P$ and the agent asserting $P$.

  **A. Logical Self-Refutation (The Strong Case)**
  *   **Structure:** The content of $P$ contradicts the content of $P$. (e.g., "No sentences are true.")
  *   **Status:** This is a standard contradiction. It proves $P$ is false.
  *   **Relevance:** This is rarely what you are seeing in the forums. It is too easy to spot.

  **B. Pragmatic/Performative Self-Refutation (The Medium Case)**
  *   **Structure:** The content of $P$ contradicts the *act* of asserting $P$. (e.g., "I am not asserting anything," or "There are no reasons," asserted as a reason.)
  *   **Status:** This proves that $P$ cannot be *coherently asserted*, but it does not strictly prove $P$ is false. It proves that the *speech act* is infelicitous.
  *   **The Trap:** Proponents often slide from "You cannot say this" to "This is false." But a truth might be inexpressible (e.g., certain mystical claims, or perhaps the limits of language in Wittgenstein's *Tractatus*).
  *   **Philosophers:** Hintikka, Habermas.

  **C. Practical/Existential Incoherence (The Weak Case)**
  *   **Structure:** The content of $P$ contradicts the *practice of living* required to sustain the agent. (e.g., "Nothing matters," while continuing to act as if things matter.)
  *   **Status:** This proves $P$ is **unlivable** or **psychologically inescapable** to deny. It does *not* prove $P$ is false.
  *   **The Trap:** This is the move you suspect is "doing something much weaker." It conflates *inescapability of use* with *truth of reference*.
  *   **Philosophers:** Kant (Transcendental Arguments), Strawson, Nietzsche (in reverse).

  ### 2. The Critical Distinction: Incoherence vs. Impracticability

  You asked: *"I cannot stop deploying the concept of a reason while I go about my day; does that bear in the slightest on whether reasons exist?"*

  The answer is **no**, and the philosophical position that holds this line is called **Error Theory** (most famously associated with J.L. Mackie regarding morality).

  *   **The Transcendental Claim:** "We must presuppose $X$ to make sense of experience; therefore $X$ is real." (Kant/Strawson).
  *   **The Error Theory Counter:** "We must presuppose $X$ to make sense of experience; therefore our cognitive architecture is hardwired to project $X$. $X$ may still be false."

  When a rationalist argues that you cannot deny "expected utility maximization" because your actions reveal you are maximizing expected utility, they are making a **Practical Incoherence** argument. They are showing that the theory is *idle* (it cannot guide action differently), not that it is *true*.

  If the move is used to show that a position is **incoherent** (Type B), it gives a reason to reject the *assertion*.
  If the move is used to show that a position is **unlivable** (Type C), it gives a reason to reject the *lifestyle*, but not necessarily the *truth*.

  **Where the concept stops:** The concept of Pragmatic Self-Refutation stops at the boundary of ontology. It can police the bounds of sense and speech, but it cannot bridge the gap between "we must think this" and "this is the case." To claim otherwise is to commit a specific fallacy.

  ### 3. The Failure Mode: "The Inescapability Fallacy"

  You asked for a name for the failure mode, where this form of argument is used to bully a person out of a position by leaning on optional or local presuppositions.

  In formal logic, this is close to a **Modal Fallacy** (confusing necessity of assertion with necessity of truth). However, in the context of argumentation theory and the rationalist sphere, the most precise label for this abuse is **Transcendental Overreach** or **The Inescapability Fallacy**.

  **Definition:** The Inescapability Fallacy occurs when an arguer infers the **ontological truth** of a proposition solely from the **psychological or pragmatic necessity** of employing the concepts required to deny it.

  **Why it is bullying:**
  It functions as a **Conversation Stopper** (to borrow a phrase from Richard Rorty). By framing your own framework as a "condition of possibility" for any argument, you immunize your premises from critique. If I say, "You can't argue against logic without using logic," I am correct. If I say, "You can't argue against *Bayesianism* without using *Bayesianism*," I am likely committing the Inescapability Fallacy. I am treating a local methodology as a transcendental condition.

  This is the "cheat" you sensed. The first party says, "I am describing the world." The second party says, "Your description violates the rules of the game we are playing." The second party then declares victory as if they have described the world better. They haven't; they have only shown that the first party is playing a different game (or no game).

  ### 4. Competing Terms and Boundary Cases

  To navigate this in the wild, you need to distinguish the move from its cousins:

  1.  **Tu Quoque (You Also):** This is an ad hominem fallacy. "You say smoking is bad, but you smoke." This attacks the *person*, not the *argument*. Pragmatic Self-Refutation attacks the *proposition's assertibility*.
      *   *Boundary:* If the inconsistency is merely hypocritical, it's *Tu Quoque*. If the inconsistency makes the proposition unintelligible, it's Self-Refutation.
  2.  **Verificationism:** The claim that a statement is meaningless if it cannot be verified. Pragmatic Self-Refutation is often used as a verificationist tool ("If you can't assert it without contradiction, it's meaningless").
      *   *Boundary:* Verificationism is a theory of meaning; Self-Refutation is a test for consistency.
  3.  **Revealed Preference:** In economics, "You say you prefer A, but you chose B." This is the empirical version of the "Unlivable" argument.
      *   *Boundary:* Revealed preference assumes the agent is rational. The philosophical move assumes the agent is coherent.

  ### 5. Summary and Utility

  The single concept that covers the shape is **Pragmatic Self-Refutation**, but it is a chameleon.

  *   **When it works:** It is devastating against **Global Skepticism** or **Nihilism** that tries to use the tools of reason to dismantle reason itself (e.g., "There is no truth"). Here, Type B (Performative) holds.
  *   **When it fails:** It is useless against **Eliminativism** or **Error Theory**. If I say "Free will does not exist," and you say "But you acted as if you had free will just now," you have not refuted me. You have only shown that my illusion is robust.
  *   **The Bullying Variant:** When used to defend a specific methodology (like Bayesianism or Utilitarianism) by claiming it is the "transcendental precondition" of action, it is **Transcendental Overreach**.

  **Recommendation for Deployment:**
  When you encounter this move, do not accept the label "Self-Refuting" without qualification. Ask:
  1.  "Is this claim *false*, or merely *unassertable*?"
  2.  "Is this concept *true*, or merely *inescapable*?"
  3.  "Are you deriving an *is* from a *must*?"

  If they cannot answer these, they are committing the **Inescapability Fallacy**. They are confusing the map (our necessary modes of thought) with the territory (the way things are). The fact that we cannot stop deploying the concept of a reason does not prove reasons exist; it proves only that we are creatures who cannot stop deploying the concept of a reason. That is a fact about us, not about the universe.
