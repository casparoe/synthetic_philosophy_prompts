prompt: |-
  I have been reading rationalist blogs and forums for a long time now — long enough to have watched a particular argumentative move rise from a curiosity to something close to a house style, and I have never found a satisfactory name for it. The move runs like this. Someone advances a thesis: that beliefs are never among the causes of action, say, or that nothing is ever owed to anyone. An interlocutor does not answer with evidence. Instead they point at the act of asserting the thesis. You have just offered me a consideration in favour of your view, they say; in doing so you have treated considerations as things that can favour views; so your denial refutes itself. The first party replies that this is a trick — that they were describing how things are rather than recommending anything, that a sentence can be used without the user being committed to everything its surface suggests — and the thread dies there, each side convinced the other has cheated.

  What interests me is that the same shape shows up with quite different joints. Sometimes the claim is that the denial cannot be thought, because the concepts it would need are precisely the ones under attack. Sometimes it is that the denial cannot be asserted without inconsistency, which is a narrower and more tractable claim about what the speaker has committed themselves to in speaking. And sometimes it is neither: the claim is that the denial cannot be lived, that the practice in question is inescapable, so the theory that would abolish it is idle rather than false. I have seen all three delivered in the same triumphant tone, and I suspect they are not the same move at all, and that the third is doing something much weaker than its users suppose. I cannot stop deploying the concept of a reason while I go about my day; does that bear in the slightest on whether reasons exist?

  I have a vague sense that something ancient is in the background here — a way of defending a principle by observing that anyone who states a denial of it has already conceded it — and that various later writers have attached their own names to neighbouring versions of the move, some of them treating it as the most abused argument in philosophy and others building whole positions on it.

  What I want is not the label. If an established concept covers this, I want to know how far it reaches and where it stops: which of the versions above it actually covers, which are cousins rather than instances, and what the nearest competing terms are, so that I can tell which one belongs to which case. If no single concept covers it, I would like a term coined, with a definition that survives the boundary cases — above all, whether there is a principled way to distinguish a move that shows a position to be incoherent from one that shows only that a position cannot be put into practice, and whether the second kind of move can ever give a reason to believe anything, or only a reason to stop talking. I am equally interested in whether the failure mode has a recognised name, because the same form of argument, when the presupposition it leans on is optional or merely local, strikes me as one of the most reliable ways of bullying a person out of a position. A bare name will not help me; I have collected half a dozen already and none of them fits.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Context:** The user is well-versed in rationalist blogs/forums (LessWrong, etc.) and has observed a specific argumentative pattern.
      *   **The Pattern:** Someone makes a radical claim (e.g., "beliefs don't cause actions," "nothing is owed"). The interlocutor responds not with evidence, but by pointing out that the *act of asserting* the claim presupposes the falsity of the claim (e.g., giving reasons presupposes reasons exist).
      *   **Variations:**
          1.  *Unthinkable:* The concepts needed to deny the thesis are the ones under attack.
          2.  *Unassertable (Performative Contradiction):* The denial cannot be asserted without inconsistency.
          3.  *Unlivable (Pragmatic Incoherence):* The denial cannot be lived/practiced, making the theory idle rather than false.
      *   **User's Suspicion:** These are not the same move. The third is weaker. Does the inability to stop using a concept prove the concept refers to something real?
      *   **Historical Hunch:** Something ancient (transcendental arguments? self-refutation?).
      *   **Goal:** Not just a label, but an analysis of the concept's scope, boundaries, competing terms, and failure modes. Specifically: Distinguish *incoherence* from *impracticability*. Can the latter give reasons to believe, or just reasons to stop talking? What is the name of the failure mode (bullying via presupposition)?

  2.  **Identify the Core Philosophical Concept:**
      *   The description screams **Performative Contradiction** (or *Pragmatic Self-Refutation*).
      *   The historical background points to **Transcendental Arguments** (Kant, Strawson) and the **Socratic Elenchus** (specifically regarding self-refutation, e.g., Protagoras in the *Theaetetus*).
      *   The specific rationalist context often calls this **"Self-Defeating"** or **"Performative Inconsistency."**
      *   The "ancient" hint is likely the *aperion logos* (self-refuting argument) found in Plato's *Theaetetus* regarding Protagoras's "Man is the Measure."
      *   The distinction between "cannot be true" vs. "cannot be asserted" vs. "cannot be lived" is crucial. This maps onto the distinction between *logical*, *pragmatic*, and *practical* self-refutation.

  3.  **Deconstruct the Three Variations:**
      *   *Variation 1 (Unthinkable):* This is a **Transcendental Argument**. It claims the condition of possibility for the thought is the truth of the thesis. (Kant/Strawson).
      *   *Variation 2 (Unassertable):* This is **Performative Contradiction**. The content contradicts the act of utterance. (Habermas, Hintikka).
      *   *Variation 3 (Unlivable):* This is **Pragmatic Incoherence** or **Practical Self-Refutation**. It shows the view is useless or psychologically impossible, but not necessarily false. (Nietzschean critique, some Wittgensteinian readings).

  4.  **Address the User's Specific Questions:**
      *   *Is there a single concept?* No, but "Self-Refutation" is the umbrella.
      *   *Scope:* It covers logical inconsistency (strong) to pragmatic inconvenience (weak).
      *   *Distinction:* Need to separate *Truth-Conditions* from *Assertion-Conditions*.
      *   *Failure Mode:* What do we call it when this is used abusively? **"The Pragmatic Fallacy"** or **"Conflating Use with Mention"** or **"Transcendental Bullying."** A better term might be **"Presuppositional Bootstrapping."** Actually, the standard term for the *abuse* is often just **"The Performative Fallacy"** (inferring truth from assertibility).
      *   *Does impracticability imply falsehood?* No. This is the **"Is-Ought"** gap or the **"Psychologist's Fallacy."** Just because we *must* think $X$ doesn't mean $X$ is true (Kant's noumena vs. phenomena).

  5.  **Drafting the Response - Structure:**
      *   **Acknowledge and Validate:** Confirm the user's intuition that these are distinct moves lumped together.
      *   **The Umbrella Term:** Identify **Self-Refutation** (specifically *Pragmatic Self-Refutation*) as the closest standard term, rooted in the *Theaetetus*.
      *   **Taxonomy of the Move:** Break down the three variations using precise philosophical terminology.
          1.  *Logical Self-Refutation* (Content contradicts content).
          2.  *Pragmatic/Performative Self-Refutation* (Content contradicts act).
          3.  *Practical/Existential Incoherence* (Content contradicts life).
      *   **The Critical Distinction (The "Meat"):** Address the "Unlivable vs. False" question. Use Kant/Strawson vs. Error Theory. Just because we can't stop using a concept (e.g., free will, reasons) doesn't mean it maps to reality (Eliminativism).
      *   **The Failure Mode:** Name the abuse. **"The Transcendental Fallacy"** or **"Assertibility Entailment."** Explain why it's bullying (it shifts the burden of proof by making the framework mandatory).
      *   **Rationalist Context:** Mention how this shows up in Bayes/Decision Theory contexts (e.g., "You can't argue against expected utility without maximizing expected utility").
      *   **Conclusion:** Summarize the utility and limits.

  6.  **Refining the Terminology:**
      *   *Self-Refutation* is the broad category.
      *   *Performative Contradiction* is the specific mechanism for the "assertion" case.
      *   *Transcendental Argument* is the mechanism for the "unthinkable" case.
      *   *Error Theory* is the counter-move for the "unlivable" case (e.g., Mackie on morality).
      *   The abuse is often called **"The Pragmatic Fallacy"** (inferring truth from utility/necessity of belief). Or **"Kantian Overreach."** Let's look for a sharper term. **"The Presuppositional Trap."**
      *   Wait, the user asked for a term *coined* if none exists. But "Pragmatic Self-Refutation" (Hintikka) is standard. I should explain *why* the standard term fails to distinguish the weak version.
      *   The specific abuse where one infers *truth* from *inescapable usage* is the **"Transcendental Fallacy"** (inferring ontological reality from transcendental necessity).

  7.  **Deep Dive into the "Unlivable" Case:**
      *   User asks: "I cannot stop deploying the concept of a reason... does that bear in the slightest on whether reasons exist?"
      *   Answer: No. This is the **Error Theory** stance (J.L. Mackie). We might be hardwired to think in moral terms, but that doesn't make moral facts real. It makes the concept *psychologically inescapable*, not *ontologically secure*.
      *   This distinction is between **Inescapability of Practice** vs. **Truth of Proposition**.

  8.  **Final Polish:**
      *   Ensure the tone matches the user's (analytical, precise, slightly weary of the rationalist scene).
      *   Reference the *Theaetetus* (Protagoras).
      *   Reference Hintikka (Performative Contradiction).
      *   Reference Kant/Strawson (Transcendental).
      *   Reference Mackie (Error Theory).
      *   Reference Habermas (Discourse Ethics - where this move is central).

  9.  **Self-Correction during drafting:**
      *   *Initial thought:* Call it "Performative Contradiction."
      *   *Correction:* The user explicitly says "Sometimes it is neither [unassertable]... the claim is that the denial cannot be lived." So "Performative Contradiction" is too narrow. I need a broader umbrella. **"Self-Defeating"** is too colloquial. **"Pragmatic Self-Refutation"** (in the broad sense used by Habermas/Apel) covers assertion and practice, but often conflates them.
      *   *Decision:* I will propose that the umbrella is **"Pragmatic Self-Refutation"** but insist on a tripartite distinction within it. I will coin/propose a specific term for the *failure mode*: **"The Inescapability Fallacy"** (inferring truth from psychological necessity).

  10. **Final Review against constraints:**
      *   Don't just give a label.
      *   Explain scope and limits.
      *   Distinguish incoherence from impracticability.
      *   Name the failure mode.
      *   Address the "reasons exist" question.

