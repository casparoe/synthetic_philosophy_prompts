utional capacity to backslide again upon re-election. On the matter of who decides the certification, some stakeholders suggest leaving it to the electorate itself, yet our methodology panel has determined that voters are not reliable coders of their own democratic status, particularly when certified backsliders are re-elected by large margins, so we rely on expert coders who are insulated from popular sentiment. This reliance on experts inevitably leads to the objection that we only certify governments our funders dislike, and while we cannot control who perceives bias, we respond by noting that we are fully transparent about our coding rules and any partisan skew is merely an artifact of the distribution of democratic decline rather than our measurement strategy. External reviewers sometimes suggest that our peer panel should consist of other certified states, but this creates a conflict of interest since certified backsliders have little incentive to certify each other accurately, so we maintain a closed panel of methodologists who do not vote. Please also note that our renewal cycle is every five years unless a triggering event occurs, such as a constitutional rewrite or a state of emergency, at which point a special audit is convened at an additional cost. We understand that the appeals process is lengthy, but this is necessary to ensure that no country is wrongly labeled as backsliding when they are merely experiencing standard political turbulence, though we remind clients that turbulence is often the first rung on the ladder. If you have further questions about the fee schedule for expedited audits or the specific indicators used to measure civil society shrinkage, please consult the attached codebook which details exactly how we measure what you claim does not exist. We look forward to auditing your decline.

