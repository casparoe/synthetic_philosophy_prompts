  *(Self-Correction on Cruxes)*: I need to make sure the "Shared Case" is something both agree describes the situation accurately, even if they judge it differently. For the Time-Indexed case, the "Shared Case" is the description of the preference shift. The "Prediction" is the normative judgment.

  *(Refining the Verbal Dispute)*: It's not *purely* verbal. If it were purely verbal, they would agree on all action-guiding norms. They don't. Camp 1 says "Fix your preferences." Camp 2 says "Fix your policy." That's a substantive difference in advice. I must nuance this.

