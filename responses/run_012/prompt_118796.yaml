answer: |-
  # Joint Statement on Money Pumps, Dynamic Consistency, and Rational Agency

  **Signatories:** The Coherence Camp (Camp 1) & The Agency Camp (Camp 2)
  **Date:** October 26, 2023
  **Subject:** Resolution of Terminological Conflict and Identification of Substantive Cruxes regarding Cyclic Preferences and Diachronic Choice

  ### Preamble
  We, the undersigned, acknowledge that for decades our respective research programs have argued past one another regarding the normative significance of money pumps. We recognize that much of this friction arises from differing primitive definitions of "rationality" and the locus of normative evaluation (preferences vs. choices vs. policies). This document does not resolve the fundamental normative divide but establishes a shared ontology of the problem space, specifically incorporating the complications of **Self-Pumps** (internal cycling without external exploiters) and **Time-Indexed Cycles** (dynamic inconsistency where instantaneous preferences are acyclic but intertemporal plans are not). We agree to cease using the possibility of a money pump as a *reductio ad absurdum* against the other's definition of rationality, acknowledging instead that it functions as a boundary marker between our distinct normative frameworks.

  ### I. Agreed Claims
  *The following propositions are accepted as true by both camps. None are tautological; all bear on the mechanics of the dispute.*

  1.  **Dominance Violation in Completed Loops:** In any completed money pump cycle (whether induced by an external trader or via Self-Pump), the agent ends in a state strictly worse than their starting state (same bundle, less wealth) relative to their own valuation at the start of the cycle.
  2.  **Forecasting Capability:** An agent's ability to foresee future choices affects the *actual occurrence* of the loss, but the camps disagree on whether this forecasting capability negates the *defect* that makes the loss possible.
  3.  **Distinction between Preference and Choice:** It is logically possible for an agent's revealed choices to be acyclic while their underlying preference ordering is cyclic (via sophisticated refusal), and vice versa (via resolute adherence to a plan contrary to current preference).
  4.  **Diachronic Tension:** In Time-Indexed Cycles, there exists a conflict between the "Planning Self" (at $t_1$) and the "Acting Self" (at $t_2$). Both camps agree this tension exists; they disagree on which Self holds normative authority.
  5.  **No External Exploiter Required:** The mathematical structure of a Self-Pump demonstrates that resource destruction can occur solely through internal decision-making processes without a malicious third party extracting the surplus.
  6.  **Policy Stability:** A stable policy (a rule for choosing over time) can prevent a money pump even if the underlying preference relation remains cyclic at every individual node.

  ### II. Statement of Remaining Disagreement
  *We disagree on the locus of rationality. Each side accepts the following formulation of their own position and acknowledges the other's formulation as coherent, though incorrect.*

  **Camp 1 (Structural Coherence):** Rationality is primarily a property of the **preference relation**. A cyclic preference structure is inherently defective because it fails to represent a consistent ordering of value. Even if an agent avoids the loss through forecasting (Sophistication) or willpower (Resoluteness), the underlying cyclic valuation remains irrational because it violates the transitivity axiom required for coherent valuation. The avoidance of the pump is a patch on a broken engine, not a sign of engine health.

  **Camp 2 (Dynamic Agency):** Rationality is primarily a property of the **temporal policy/choice function**. An agent is rational if they successfully navigate their environment to satisfy their goals over time without suffering avoidable losses. If an agent foresees a cycle and declines the first trade, or binds themselves to a plan that prevents cycling, they are rational. The underlying preference cycle is merely a parameter of the agent's psychology, not a rationality failure, provided the *management* of those preferences prevents dominance violations.

  ### III. Cruxes, Shared Cases, and Predictions
  *For each crux, we describe a scenario both sides agree describes the facts accurately. We record the divergent normative predictions.*

  #### Crux 1: The Normativity of the Self-Pump
  **Shared Case:** An agent possesses cyclic preferences ($A \succ B \succ C \succ A$). There is no external trader. The agent voluntarily trades $A$ for $B$ (paying $\epsilon$), then $B$ for $C$ (paying $\epsilon$), then $C$ for $A$ (paying $\epsilon$), ending with $A$ minus $3\epsilon$. The agent foresaw the possibility of this sequence but failed to inhibit the first trade.
  *   **Camp 1 Prediction:** The agent is **Irrational**. The loss proves the preference structure is defective. Forecasting was available but unused; the failure to inhibit is a symptom of the structural defect.
  *   **Camp 2 Prediction:** The agent is **Instrumentally Irrational** (failed their own goals), but this does not prove the *preferences* were irrational. Had the agent forecasted and refused the first trade, they would be fully rational despite holding the same cyclic preferences. The defect lies in the *execution*, not the *valuation*.

  #### Crux 2: Resolute Choice in Time-Indexed Cycles
  **Shared Case:** At $t_1$, an agent prefers Plan X (Save money) over Plan Y (Spend money). At $t_2$, the agent's time-indexed preferences shift, now preferring Spend over Save. The agent executes Plan X at $t_2$ solely because they committed to it at $t_1$, despite $t_2$ preferences favoring Y. No new information has arrived.
  *   **Camp 1 Prediction:** The agent is **Rational**. Diachronic coherence requires honoring the $t_1$ ranking. To succumb to the $t_2$ preference shift is a failure of rational agency (akrasia). The preference shift itself is the defect; adhering to the plan corrects it.
  *   **Camp 2 Prediction:** The agent is **Arbitrary/Stubborn**. Rationality is grounded in current attitudes. If the $t_2$ self genuinely prefers Spend, enforcing $t_1$'s will is an imposition of a "dead hand." Rationality requires satisfying the current self's preferences unless a higher-order policy (independent of the specific preference shift) justifies the bind. Mere stubbornness is not rationality.

  ### IV. Analysis of Verbal Dispute
  We judge a significant portion of the dispute to be **verbal**, specifically regarding the predication of the term "Rational."

  *   **Why it is verbal:** Both camps agree on the non-normative facts: the math of the cycle, the existence of the loss, the capability of forecasting, and the psychological reality of preference shifts. If Camp 1 were forced to say "The agent is *structurally incoherent* but *successfully agential*" and Camp 2 were forced to say "The agent is *successfully agential* but *structurally incoherent*," their advice to the agent would converge (e.g., "Pre-commit to avoid the loss").
  *   **Why it is not purely verbal:** The disagreement extends to **normative guidance for preference revision**. Camp 1 advises agents to *change their preferences* to match transitivity (fix the engine). Camp 2 advises agents to *change their choice architecture* to accommodate their preferences (fix the steering). This leads to different therapeutic interventions in behavioral economics and AI alignment. Camp 1 seeks to align the utility function; Camp 2 seeks to align the policy function.

  ### V. Table of Disagreements

  | Feature | Camp 1 (Structural Coherence) | Camp 2 (Dynamic Agency) |
  | :--- | :--- | :--- |
  | **Locus of Rationality** | The Preference Relation (Static) | The Choice Function/Policy (Dynamic) |
  | **Significance of Money Pump** | Proof of inherent defect in valuation. | Proof of failure in forecasting or policy. |
  | **Self-Pump without Exploiter** | Still irrational; the loss is internalized waste. | Irrational only if the agent failed to use available forecasting. |
  | **Time-Indexed Preferences** | Preference shifts are defects; diachronic consistency is required. | Preference shifts are facts; diachronic consistency is optional/strategic. |
  | **Resolute Choice** | Rational adherence to a coherent plan. | Potentially irrational stubbornness against current values. |
  | **Remedy for Cycles** | Revise preferences to be transitive. | Implement pre-commitment devices or sophisticated refusal. |
  | **View of the "Self"** | A single entity that must be logically consistent. | A sequence of temporal selves that must be negotiated. |

  ***

  **Signed,**

  *Representative, Coherence Camp*
  *Representative, Agency Camp*
