      *   *Claim 6 (Metaphysics of Value):* No free-floating value. Badness is bad *for* someone. (Subject-located value).
      *   *Claim 7 (Personal Attachment):* Loves music/food, would grieve losing them. (Descriptive fact about the agent).

  3.  **Identify Potential Tensions (Pairwise Comparison):**

