prompt: |-
  Right, I've been trying to get my ethical position straight and I want a sanity check before I inflict it on my seminar group. Here's the package as it stands:

  1. The only things that are intrinsically good or bad are the absence or presence of craving, and the absence or presence of suffering. Nothing else is good in itself — not pleasure, not knowledge, not love, not achievement, not even being alive.
  2. Craving and suffering are genuinely separate items on that list. There's suffering that isn't craving (raw pain, say) and craving that isn't suffering (a mild, bearable itch for something trivial).
  3. Consequentialism: the right act is the one that maximises total intrinsic value, summed impersonally across everyone affected.
  4. I'm pretty sure a shorter, richer life — full of striving, appetite and the odd bit of anguish — is the better one, or at least it's the one I'd choose for myself over a longer, flatter, craving-free sort of existence.
  5. It's a serious wrong to override someone's settled, informed preferences about their own life, even when you're confident it would be better for them.
  6. I don't believe in free-floating value. When suffering is bad, it's bad *for* whoever's suffering; there's no extra badness just sitting there in the world once you've subtracted everyone's experience.
  7. I love music and good food and would honestly grieve if I lost them.

  I've got a nagging feeling that some of these are pulling agianst each other but I can't see where the joins are. Can you go through the list and tell me which pairs are actually in tension, which only look like they are, and how bad each real tension is? Then rank the genuine ones by severity, give me the cheapest fix for each, and finish by saying which single change to the list would clean up the most at once. Please discriminate rather than just flagging everything as "in tension" — if a couple of them only clash because of sloppy wording on my part, I want to know that too.
