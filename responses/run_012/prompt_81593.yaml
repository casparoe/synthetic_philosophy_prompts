      *   **Task:** Draft 8-10 interview questions.
      *   **Constraints:**
          *   Press the thesis (don't let them just restate it).
          *   Include specific questions on:
              1.  Conditional vs. Unconditional Inevitability.
              2.  Plate Tectonics Revolution (User's lived experience).
              3.  Normative Force of Priority Disputes.
          *   Include follow-up questions for the three specific topics above, keyed to likely answers.
          *   Avoid generic career questions.

  2.  **Deconstruct the Guest's Thesis:**
      *   *Standard View:* Simultaneous discovery = Inevitability (the fruit was ripe).
      *   *Guest's View:* Simultaneous discovery = Shared constraints/pathways (multiple people walking the same narrow corridor). It's contingent on the system, not teleological.
      *   *The Twist:* The sociological/psychological question of *priority* is more important than the metaphysical question of *inevitability*.

  3.  **Drafting Strategy:**
      *   *Tone:* Intellectual, respectful, probing, specific (appealing to a geologist's precision).
      *   *Structure:* 8-10 main questions. 3 of them need specific follow-ups.
      *   *Goal:* Force the guest to defend the nuances, not just preach the abstract.

  4.  **Developing the Questions (Iterative Process):**

      *   *Question 1 (Inevitability):* Need to distinguish conditional vs. unconditional.
