          *   *Follow-up:* If they say "It fits," ask about the resistance to the theory (the "why care" aspect).

      *   *Question 3 (Normative Force):* Why do we care about priority?
          *   *Draft:* Why is priority important?
          *   *Refinement:* You say the puzzle is why we care. Is it just ego, or does priority serve an epistemic function? If science is systemic, why attribute it to individuals?
          *   *Follow-up:* If they say "It's sociological," ask if that undermines scientific objectivity.

      *   *Question 4 (Path Dependence):* Focus on the "systemic" part.
          *   *Draft:* How does path dependence work?
          *   *Refinement:* If knowledge is path-dependent, does that mean we could be stuck in a local maximum? Does simultaneous discovery signal a bottleneck or a breakthrough?

      *   *Question 5 (The "Ripe Fruit" Metaphor):* Challenge the common metaphor.
          *   *Draft:* Is the fruit ripe?
          *   *Refinement:* Historians love the "ripe fruit" metaphor for simultaneity. You reject the inevitability implied by that. Are you suggesting the tree was pruned to force growth in one direction?

      *   *Question 6 (Instrumentation/Technology):* A materialist angle.
          *   *Draft:* What about tools?
          *   *Refinement:* Often simultaneity tracks with new tools (telescopes, seismographs). Does your systemic view reduce to technological determinism, or is there conceptual work happening independently of the tools?

      *   *Question 7 (The "Lone Genius" vs. System):*
          *   *Draft:* Are geniuses real?
          *   *Refinement:* Your thesis seems to dissolve the individual into the system. But priority disputes are fiercely individualistic. Is there a contradiction between your ontology of science (systemic) and the ethics of science (individual credit)?

      *   *Question 8 (Counterfactuals):*
          *   *Draft:* What if they didn't discover it?
