          *   I should act *as if* my decision determines the simulator's payout.
          *   *Result:* Shift from causal decision theory (CDT) to evidential (EDT) or functional (FDT).

      *   *Implication 5: The "Simple World" Counter-Argument.*
          *   Is the "real world" actually simpler than the "simulation of me"?
          *   Usually, yes. Physics is simple. A simulation of a specific human history is complex.
          *   *Wait, the prompt says "Grant that the worry goes through."* So I must assume the malign hypotheses *do* have significant weight.
          *   *Implication:* I cannot rely on complexity arguments to dismiss simulations.

