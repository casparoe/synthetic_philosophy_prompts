answer: |-
  1. **Functional Role (Q4)**
  2. **Individuation of Prospects (Q1)**
  3. **Sequential vs. One-shot (Q2)**
  4. **Level of Statement (Q5)**
  5. **"In the Small" Variants (Q3)**

  **Reasoning and Upstream Dependencies**
  Q4 is strictly upstream. You cannot assess whether independence is normatively binding until you know exactly which structural benefits vanish if it goes. If dropping independence destroys dynamic consistency or Dutch-book immunity, the axiom retains normative force even if descriptively false. If alternative frameworks (e.g., rank-dependent utility) preserve these features without independence, the axiom loses its foundational privilege. This dictates the project's entire trajectory.

  Q1 is the primary defensive line for Expected Utility (EU). If Allais violations dissolve under fine-grained individuation (e.g., incorporating regret into outcomes), EU survives descriptively. However, your team must determine if this is a substantive psychological claim or a trivial semantic fix. If the latter, Q1 collapses into Q4 (we drop independence because the "fix" is vacuous).

  Q2 tests the normative bite identified in Q4. If violations lead to dynamic inconsistency (money pumps) that cannot be resolved via precommitment, independence is rationally required. If precommitment resolves the tension, independence may be merely a heuristic for planning rather than a constraint on preference. This is downstream of Q4 but upstream of Q5.

  Q5 is largely formal housekeeping. While stating the axiom over acts vs. lotteries changes the mathematical topology, it rarely changes the normative verdict unless tied to Q1 (how outcomes are individuated). Dedicate minimal resources here unless Q1 stalls.

  Q3 deserves the least attention. Whether violations persist at penny stakes is an empirical question about cognitive error vs. stable preference. For *foundational* work, this is secondary. If the axiom is normatively required (per Q4/Q2), low-stakes violations are simply errors. If not, they are irrelevant. Don't let experimental psych swallow the philosophy.

  **Consolidations and Omissions**
  Q2 and Q4 are secretly the same question. Dynamic consistency *is* the functional role of independence in sequential contexts. Merge these teams. Q1 and Q5 also overlap; individuation strategies often depend on whether you model acts or lotteries.

  You missed the **Normative Source** question: *Why* should independence hold? Is it based on separability (Harsanyi), consistency (Ramsey), or impartiality? If the justification is ethical (impartiality) rather than rational (consistency), descriptive violations matter less. You also missed **Alternative Normative Theories**. Don't just test EU; test whether rivals (e.g., weighted utility) can be grounded normatively, not just descriptively. If a rival theory offers a coherent normative foundation, independence loses its unique status.

  **Shifting Priorities**
  Move Q1 up if your team finds that fine-grained individuation makes preferences unstable or trivial (the "individuation by just anything" problem). Move Q4 down if you prove dynamic consistency can be maintained in non-EU frameworks via alternative updating rules. Move Q3 up only if you find systematic low-stakes violations that resist error-theory explanations, suggesting a deep structural flaw in EU rather than performance error.

  **Verdict**
  Focus 50% on Q4/Q2 (The Cost of Abandonment), 30% on Q1 (The Individuation Defense), and 20% on the Missing Normative Source. Drop Q5 unless technical blockers arise. Treat Q3 as a side constraint, not a research line. This ensures you solve the normative structure before worrying about psychological implementation.
