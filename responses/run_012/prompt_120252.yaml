  The redness here is one with redness there,
  One substance breathed into the empty air.
  What makes them alike is not a trick of sight,
  But one ideal burning purely bright.
  No mere comparison of separate parts,
  But single form inhabiting distinct hearts.
  But say you banish distincts from the mind,
  Leaving only traces loosely lined.
  No common thread runs through the woven cloth,
  Only a look that feels familiar enough.
  This pair resembles that, and that the kind,
  A chain of links distincts leave behind.
  Yet if resemblance is the only tie,
  Must not that likeness also qualify?
  For if two likings look alike in mode,
  They share a burden on a similar road.
  So likeness likens likeness in the view,
  Nothing is one, nothing is strictly two.
  We end upon a sound that fits just right,
  A perfect closure closing out the night.
