answer: |-
  This is a dense passage because Engels is performing a specific theoretical manoeuvre: he is attempting to shift the debate from a moral or administrative problem to a structural one. To help you lead your session, I will walk through the three obstacles you have identified, unpacking the logic step by step.

  ### 1. The Meaning of 'So-Called' and the Historical Distinction

  When Engels refers to the 'so-called housing shortage', he is not denying the material reality that people are homeless or overcrowded. He is challenging the *category* being used to describe it. In the political discourse of his day, the 'housing shortage' was presented as an accidental crisis, a temporary imbalance between supply and demand that could be fixed by better planning or charity.

  By using 'so-called', Engels signals that the phenomenon is being misidentified by the press and the bourgeoisie. If we call it a 'shortage', we imply that the normal state of affairs is adequate housing, and that something has gone wrong to cause a deficit. Engels argues that for the working class, bad housing is not a deficit; it is the baseline condition.

  This is why the historical distinction matters so much to him. He points out that oppressed classes in all periods (slaves, serfs, earlier labourers) have always lived in bad, overcrowded conditions. If bad housing is a permanent feature of class society, it cannot be explained by a temporary 'shortage'. It is a feature of exploitation itself.

  However, he acknowledges there is something *new* in the modern city. The 'housing question' of the 1870s is not just that housing is bad, but that it is becoming *unobtainable* due to specific capitalist dynamics: the rush to cities, skyrocketing land values, and the demolition of central housing.

  So, the distinction he draws is between:
  1.  **General Bad Housing:** A permanent condition of the oppressed caused by poverty.
  2.  **The Modern Housing Shortage:** An acute intensification caused by urbanisation and land speculation.

  He insists on this distinction to prevent the reformers from treating the acute symptom (the shortage) while ignoring the chronic disease (class exploitation). If you treat it merely as a 'shortage', you suggest the solution is building more houses. If you treat it as a feature of class society, the solution is ending class society. The 'so-called' is a warning against accepting the bourgeois definition of the problem, because accepting their definition limits the range of permissible solutions.

  ### 2. The 'Secondary Evil' and the Necessity of Abolition

  This is the crux of the theoretical difficulty. On the one hand, Engels says the housing shortage is a 'secondary evil' and 'not at all a direct result of the exploitation of the worker as a worker'. On the other, he says the only way to end it is to 'abolish altogether the exploitation and oppression of the working class'. How can a secondary effect require the abolition of the primary cause to be resolved?

  To reconcile this, we must look at how Engels understands the machinery of capitalism.

  When he says it is not a *direct* result of exploitation 'as a worker', he means it does not happen inside the factory. It is not the result of the capitalist withholding wages or lengthening the working day (which is direct exploitation). Instead, the housing shortage is a result of the *circulation* of capital and the private ownership of land.

  Here is the chain of causality he outlines:
  1.  Capitalist production concentrates industry in big towns.
  2.  This concentration makes central land valuable.
  3.  Landowners and developers seek the highest return on that land.
  4.  Commercial buildings (shops, warehouses) yield higher rent than workers' dwellings.
  5.  Therefore, workers' dwellings are demolished and workers are pushed to the outskirts.

  This mechanism is 'secondary' because it is a downstream effect. It relies on the primary engine of capitalism (accumulation and profit-seeking) to function. It is a 'smaller evil' in the sense that it is a symptom, whereas the exploitation in production is the disease.

  However, the claim that only abolition can end it is a **structural claim**. Engels is arguing that the mechanism driving the shortage (land speculation and the prioritisation of profit over need) is not a glitch; it is the system working as intended. As long as land is a commodity and housing is built for profit rather than use, capital will always flow to where the return is highest.

  You asked what kind of claim the second one is. It is best understood as a **structural-causal claim with political-strategic consequences**.
  *   **Structurally:** The housing shortage is generated by the logic of capital accumulation. You cannot remove the generator (the logic) while keeping the machine (capitalism) running.
  *   **Strategically:** Therefore, any political programme that aims to solve the housing question without challenging private property in land and capital is doomed to fail in the long run.

  They hold together because the 'secondary evil' is structurally locked to the 'primary cause'. You can intervene in the secondary mechanism (for example, by subsidising housing), but the primary cause (the drive for profit) will constantly exert pressure to undo that intervention. For Engels, a problem is only 'solved' when the pressure that creates it is removed. Since the pressure comes from the capitalist mode of production, only the abolition of that mode constitutes a solution.

  ### 3. Reforms, the Petty Bourgeoisie, and the Right to the City

  This structural view leads to a sceptical position on measures that fall short of abolition.

  **On Reforms:**
  Engels does not necessarily claim that rent control or public housing are impossible to implement. Rather, he implies they cannot be the *solution to the shortage* as a systemic issue. If the building industry is driven by speculation, it will build expensive houses because that is where the profit is. If you restrict rents, capital may withdraw from housing construction entirely, worsening the shortage. If you build public housing, you are not stopping the dynamic that pushes workers to the outskirts; you are merely managing the displacement.

  He is committing to the idea that reforms are **palliative**. They may alleviate suffering temporarily, but they cannot stabilise the situation permanently because the underlying economic forces (land value inflation, the priority of commerce over residence) remain active. The system will always find a way to reassert the profitability of land over the housing needs of the poor.

  **On the Petty Bourgeoisie:**
  The remark that the shortage 'gets talked of so much only because it has affected the petty bourgeoisie also' is a critique of political visibility. Working-class suffering is rendered invisible by being treated as normal or inevitable. When the middle classes (the petty bourgeoisie) begin to suffer high rents or displacement, it is framed as a 'crisis' requiring state attention.

  This tells us that a hardship becomes a 'political question' not based on its severity, but on *who* is suffering. It reveals that the 'public' in public discourse is actually the propertied and middle classes. For your reading group, this is a crucial point about agenda-setting: the housing question only enters the mainstream when it threatens the stability of the classes that control the press and the state.

  **On the Right to the City:**
  This passage has profound implications for the contemporary idea of a 'right to the city'.

  If we understand the 'right to the city' to mean the right of inhabitants to access central urban space and shape the urban environment, Engels's analysis suggests this right is **incoherent within a capitalist framework**.

  He describes a city where land value is determined by its potential for capital accumulation, not its social utility. In such a city, the 'right' of a worker to live in the centre is in direct conflict with the 'right' of capital to realise the maximum rent from that land. The market resolves this conflict in favour of capital every time (shops replace homes).

  Therefore, the passage implies that demanding a 'right to the city' without challenging the commodification of land is a contradiction. You cannot have a right to occupy space that is governed by the logic of speculation. However, it also identifies the 'right thing to demand': if the problem is that land is treated as a vehicle for value rather than a place for life, then the demand must be to decommodify land.

  Engels is not saying workers should not fight for better housing. He is saying that so long as the city is organised as a market for land, the 'right to the city' will always be subordinate to the 'right of profit'. The passage suggests that a genuine right to the city requires the abolition of the economic mechanisms that currently dictate who belongs in the centre and who belongs on the outskirts.

  ### Summary for your Session

  To synthesise this for your group: Engels is arguing that the housing shortage is not a mistake, but a feature. It is a 'secondary' symptom of a 'primary' disease. Because the symptom is produced by the normal functioning of the capitalist city (where land value trumps human need), tinkering with the symptom (reform) cannot cure it. The suffering only becomes political when it hits the middle class, revealing the bias of public discourse. Finally, the passage suggests that as long as the city is a market, the 'right to the city' is an impossibility; the city belongs to those who can pay the rent dictated by capital, not those who live in it.
