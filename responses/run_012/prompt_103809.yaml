t captures these verdicts, or close to all of them? If not, which verdict should I give up? Please also say what your principle predicts for two cases I have not listed: a system with no body that maintains a recurrent, self-referential model of its own processing and uses it to regulate its future states, and a brain organoid that shows coordinated, recurrent activity but no behavior. Finally, tell me which further case would best distinguish your preferred principle from the nearest rival. No literature review or citations, please; I want the principle, its verdicts, and an honest statement of what it cannot accommodate. Answer in British English.
