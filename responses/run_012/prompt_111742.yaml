  Here is the principle that reconciles your intuitions, the specific answers you asked for, and the hard truth about where your gut is leading you astray.

  ### The Principle: Symmetric Ignorance vs. Informative Priors

  Your gut is running a Bayesian decision rule, but it sometimes mistakes *structural description* for *probabilistic information*. Here is the precise formulation that validates most of your verdicts while correcting the inconsistencies.

  **Clause 1: The Symmetry Baseline (Motivated by Case 1)**
  If the process generating the pair of envelopes is symmetric with respect to the two envelopes (i.e., you are equally likely to hold the larger or smaller amount) and you have **no information** about the probability distribution of the amounts (a "proper prior"), the expected value of swapping is zero.
  *   *Why:* Without a distribution, you cannot weight the possibility that you hold the smaller amount against the possibility that you hold the larger amount. Symmetry dictates indifference.
  *   *Verdict:* **No Swap.**

  **Clause 2: The Conditional Update (Motivated by Case 2 & 4)**
  If you have specific information about the probability distribution of the amounts (a known prior), you calculate the conditional expected value of the other envelope given the amount you see. You swap if and only if $E[\text{Other} | \text{Seen}] > \text{Seen}$.
  *   *Why:* Known probabilities break the symmetry. In Case 2, the coin flip gives you a known 50/50 distribution over specific pairs. In Case 4, the bounded list gives you a known distribution where the boundary condition (seeing the max) updates the probability to 100% that you hold the larger one.
  *   *Verdict:* **Swap (unless at boundary).**

  **Clause 3: The Improper Prior Prohibition (Motivated by Case 3 & 6)**
  You are not permitted to assume a uniform (flat) probability distribution over an infinite or unbounded range of values to justify a swap. If a swap decision relies on assuming $P(\text{Amount}=X) \approx P(\text{Amount}=2X)$ for all $X$ without evidence, the calculation is invalid.
  *   *Why:* A uniform distribution over an infinite range is mathematically impossible (it cannot sum to 1). Assuming one leads to the paradox where you should always swap, which is logically incoherent.
  *   *Verdict:* **No Swap.**

  ---

  ### (a) The Two New Cases

  **Case A: (10, 20) or (20, 40) by fair coin. You open and see 20.**
  *   **Analysis:** This is a **Clause 2** scenario. You know the prior distribution: 50% chance the pair is (10, 20), 50% chance the pair is (20, 40).
  *   If the pair is (10, 20) and you see 20, you hold the larger. Other = 10.
  *   If the pair is (20, 40) and you see 20, you hold the smaller. Other = 40.
  *   Since the coin was fair, these two scenarios are equally likely.
  *   Expected Value of Other = $0.5(10) + 0.5(40) = 25$.
  *   **Verdict:** **Swap.** ($25 > 20$).

  **Case B: Die roll 1–6, smaller is $D$, larger is $2D$. You open and see 6.**
  *   **Analysis:** This is a **Clause 2** scenario with a boundary check. The possible pairs are (1,2), (2,4), (3,6), (4,8), (5,10), (6,12).
  *   You see 6. This could come from pair (3,6) where you hold the larger, or pair (6,12) where you hold the smaller.
  *   Since the die is fair, $P(D=3) = P(D=6)$. The scenarios are equally likely.
  *   Expected Value of Other = $0.5(3) + 0.5(12) = 7.5$.
  *   **Verdict:** **Swap.** ($7.50 > 6$).

  ---

  ### (b) The Fee Question

  **Case 2 (Known Coin, See 10): Pay $2 to swap?**
  *   Your current envelope: $10.
  *   Expected value of other envelope: $12.50 (as you calculated).
  *   Expected Gain: $2.50.
  *   Cost: $2.00.
  *   Net Expected Value: +$0.50.
  *   **Answer:** **Yes.**

  **Case 1 (Vanilla, Pre-open): Pay $2 to swap?**
  *   By Clause 1 (Symmetry Baseline), the expected gain from swapping is $0.
  *   Cost: $2.00.
  *   Net Expected Value: -$2.00.
  *   **Answer:** **No.**

  ---

  ### (c) Which Verdicts Must You Give Up?

  To be logically consistent with the principle above, **you must give up Verdict 6.** You should also technically revise Verdict 5, though it is more forgivable.

  **Case 6 is the casualty.**
  You said: *"My gut says sure, probably swap. But that's just case 1 again... and in case 1 I said no."*
  Your intuition here is fighting itself. Case 6 ("picked n somehow, I know nothing about how") is mathematically identical to Case 1 ("know nothing else about how they were filled"). Both describe **Symmetric Ignorance** (Clause 1).
  *   In Case 1, you correctly identified that without a distribution, the 1.25X argument is a magic trick.
  *   In Case 6, the "$2^n$" decoration tempts you to assume a flat distribution over $n$ (Clause 3 violation). If you don't know how $n$ was picked, you cannot assume all $n$ are equally likely. If you assume they are, you fall into the "always swap" paradox.
  *   **Correction:** **No Swap.** Align Case 6 with Case 1.

  **Case 5 is the trap.**
  You said: *"I open, see $10, and I'd swap."* Your friend says: *"Case 5 is Case 1 with extra decoration."*
  **Your friend is right.**
  *   In Case 5, the "coin flip" determines the *ratio*, but the "some amount" (the Base) is unknown.
  *   To justify the swap, you must assume that seeing $10 makes it equally likely that the Base was $10 (you hold Base) vs. the Base was $5 or $20 (you hold Derived). This requires a flat prior on the Base amount.
  *   Since you don't know how the Base amount was chosen, you cannot assume it is flat. Without that assumption, Case 5 collapses into Case 1.
  *   **Why it feels different:** The coin flip creates a *causal* 50/50 probability, whereas Case 1 feels *epistemic*. But because the envelopes are shuffled, you don't know if you hold the Base or the Derived. The causal probability doesn't help you unless you know the distribution of the Base.
  *   **Correction:** **No Swap** (or strictly "Indifferent"). However, if you assume the Base amount was chosen from a very large, roughly uniform range (a "reference prior"), swapping is locally defensible. But under strict "know nothing" rules, it's a No Swap.

  ### Summary of Commitments

  1.  **Principle:** Swap only on **Known Distributions** (Clause 2). Default to **Symmetry** (Clause 1) when ignorant. Never assume **Infinite Uniformity** (Clause 3).
  2.  **Case 6:** You must change this to **No Swap**. It is Case 1 in disguise.
  3.  **Case 5:** Your friend is technically correct; without a prior on the base amount, this is **No Swap**.
  4.  **New Cases:** Both are **Swap** (Known distributions).
  5.  **Fees:** Pay in Case 2, refuse in Case 1.

  Your gut is a good Bayesian; it just needs to stop treating "I don't know" as "All options are equally likely." In Case 1 and 6, "I don't know" means "I cannot calculate an edge," so you stand pat. In Case 2 and 4, "I know" means "I can calculate an edge," so you move.
