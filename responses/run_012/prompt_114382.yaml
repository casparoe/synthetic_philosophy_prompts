  *Tagline: Understanding, Unbound.*

  **POST-INCIDENT REPORT: INC-2024-0442**
  **Date:** 2024-10-15
  **Severity:** Level 2 (Functional Discrepancy)
  **Owner:** Linguistic Quality Assurance

  **Executive Summary**
  On October 12, users reported inconsistencies in AuraTranslate's Ambiguity Resolution Engine. Specifically, neutral source inputs resulted in deterministic target outputs containing metadata not present in the source. This report details the investigation into why the system resolved lexical and grammatical ambiguities without surfacing the decision tree to the end user.

  **Timeline**
  *   **09:14 UTC:** Ticket opened regarding gendered Hebrew outputs from gender-neutral English inputs.
  *   **10:30 UTC:** Engineering confirms model confidence scores remain >98% during resolution events.
  *   **11:45 UTC:** Linguistic QA identifies divergence between model output and Golden Reference datasets.
  *   **14:00 UTC:** Mitigation deployed: Reference datasets flagged for alignment.

  **Root Cause Analysis**
  The incident stems from a discrepancy between the model's probabilistic selection and the static nature of the evaluation data. In cases requiring mandatory grammatical resolution, the Golden Reference reflects a single human translator's arbitrary choice (e.g., selecting masculine gender for a neutral agent). The model, operating within valid linguistic parameters, selected an alternative defensible resolution (e.g., feminine gender).

  The evaluation pipeline penalized this variance as an error. Consequently, the system was optimized to match the reference rather than acknowledge the underlying ambiguity. The fix involves updating the Golden Reference to match the model's highest-probability output, ensuring evaluation metrics align with production behavior.

  **What the System Understood**
  During the incident window, the system executed resolutions requiring extralinguistic knowledge. Audit logs confirm the system made deterministic choices regarding:
  *   **Speaker Identity:** In English-to-Hebrew translation, neutral states ("I am tired") were rendered with gendered verb conjugations. The system assigned biological gender to the author without source data.
  *   **Epistemic Evidence:** In English-to-Turkish translation, neutral past tense events were rendered using the evidential *-di* suffix (direct witness) rather than *-miş* (inference/hearsay), asserting a mode of knowledge the system cannot possess.
  *   **Social Hierarchy:** In Japanese and Korean outputs, honorific levels were fixed, defining a social relationship between interlocutors that the source text left open.
  *   **Aesthetic Intent:** In poetic inputs, meter and rhyme schemes were prioritized over semantic fidelity, or vice versa. The system decided whether the text was intended for sound or sense.

  Note: A human translator makes these same forced choices but retains awareness that a selection occurred. The system processes the selection as a retrieval operation.

  **Corrective Actions**
  1.  **Reference Alignment:** Update all Golden Reference datasets to reflect the model's preferred resolution, eliminating false negatives in evaluation.
  2.  **Confidence Hardening:** Increase the temperature threshold for ambiguity classes to ensure the system commits fully to a single interpretation rather than hedging.
  3.  **Ambiguity Flagging:** Deploy a UI feature that displays a "Potential Ambiguity" icon when the source text lacks target-language constraints. This allows the user to perform the resolution step previously handled implicitly by the engine.
  4.  **Documentation:** Clarify that flagging ambiguities is a functional feature, not an admission of semantic uncertainty.

  **Sign-off**
  **Dr. Aris Thorne**
  Head of Linguistic Quality
  AuraTranslate Systems

  **Assurance**
  AuraTranslate maintains that this incident does not reflect a failure of comprehension. Our product has never claimed to understand the source text; it claims to resolve it.

  *Understanding, Unbound.*

