      *   *Synthesis:* The *oikonomia/chrematistike* distinction *does* work to condemn Madoff, but not because the money was "fake" in a metaphysical sense, but because the *activity* was detached from human need. However, the friend is right that if money is purely conventional, the line between "real" and "fake" is thinner than Aristotle likes to admit.

