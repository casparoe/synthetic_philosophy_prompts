      *   *The Fraud Element:* Aristotle focuses on the *telos* (purpose) of the activity. Madoff's *telos* is infinite accumulation. This fits "unnatural chrematistics" perfectly.
      *   *The Gap:* Aristotle's critique is primarily about the *limit* and the *source* (production vs. exchange/usury), not necessarily the *truthfulness* of the transaction in the modern legal sense. However, he discusses justice in exchange (NE V). Fraud violates reciprocity and proportionality.
      *   *Synthesis:* Madoff is the ultimate example of unnatural chrematistics (money breeding money, unlimited). But Aristotle might miss the specific *harm* of fraud (the lie) if he focuses only on the structural unnaturalness. The "lie" violates the convention of money as a measure of need/trust.

