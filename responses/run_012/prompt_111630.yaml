answer: |-
  1. The theory must explain how a prior self retains authority over a later self despite changed preferences, as seen when Odysseus binds himself against future pleas to be released. I regard this continuity of agency as non-negotiable, for without it the act is merely coercion by another party rather than self-binding.

  2. It must specify whether the binding force relies on external sanctions or internal psychological costs, illustrated by constitutional entrenchment clauses that lack police enforcement yet constrain legislators. This is a negotiable demand, as rational choice theorists often accept external sanctions while psychological accounts insist on internal costs.

  3. The account must resolve cases where the precommitting self and later bound self disagree on whether the device has failed, such as a revocation clause permitting exit only if a trustee certifies the later change of mind as authentic. I treat this adjudication mechanism as non-negotiable because a theory that cannot distinguish between successful binding and successful revocation explains nothing.

  4. The account must recognize that third-party adjudication cannot be jointly satisfied with the demand that precommitment remain entirely self-enforcing, illustrated by independent central banks that require external legal standing to resist political pressure. I classify this tension as a negotiable demand of the constitutionalist camp, which often sacrifices pure self-enforcement for stability.

  5. The theory must demand that the precommitment alters the normative status of options rather than merely changing their prices, which does the most to exclude otherwise popular accounts that reduce binding to simple cost-benefit analysis. This is a non-negotiable requirement, as purely strategic models fail to capture the deontic force present in both addiction treatment refusals and constitutional rights.
