  Based on the pattern of your friend's verdicts, here is the breakdown of her logic, her likely verdict on the Indus Valley, and the specific rule she is implicitly using.

  ### The Verdict on the Indus Valley (Harappan)
  **Verdict: Collapse.**

  **Why:** Your friend distinguishes between the failure of a *government* and the failure of a *civilization*. In the Maya case, the "Maya" civilization shifted its center of gravity but maintained its cultural and political identity (writing, calendar, kingship) in the north and highlands. In the Indus case, the specific "Harappan" identity—defined by urban planning, standardized weights, and the undeciphered script—vanished completely. While the *people* (genetically) remained in the region and became village farmers, the *sociopolitical entity* that defined them as "Harappan" ceased to exist and was not directly succeeded by a culture claiming that lineage (unlike Rome -> Medieval Europe or Classic -> Postclassic Maya). This mirrors her verdict on the Late Bronze Age, where the people survived but the Palatial systems and scripts died out.

  ### Analysis of the Three Candidate Rules

  Here is how the three rules you proposed stack up against her existing data:

  1.  **Rule 1: 'Did the community/people continue?'**
      *   *Prediction for Indus:* **Not Collapse** (Population stayed).
      *   *Fit with Friend's Data:* **Poor.** This rule fails on the Late Bronze Age. The Mycenaean and Hittite populations largely remained in place, yet she classifies this as a collapse. It also fails to distinguish Rapa Nui (Not Collapse) from Greenland (Collapse) solely on biology, as both involved population shifts, but one maintained cultural continuity and the other didn't.
  2.  **Rule 2: 'Did the complex package (cities, writing, states, trade) survive?'**
      *   *Prediction for Indus:* **Collapse** (Urbanism and script vanished).
      *   *Fit with Friend's Data:* **Mixed.** This works for the Indus, LBA, and Greenland. However, it fails on the Classic Maya. The southern lowlands lost their cities, writing, and long-distance trade networks, yet she calls it "Not Collapse." It also struggles with Rome, where the Imperial "package" dissolved but she calls it "Transformation."
  3.  **Rule 3: 'Self-inflicted versus imposed from outside.'**
      *   *Prediction for Indus:* **Ambiguous** (Climate change vs. Migration).
      *   *Fit with Friend's Data:* **Poor.** There is no consistent pattern. She calls Greenland (Climate/Outside) a collapse, but Rapa Nui (Resource/Inside myth) not a collapse. She calls Rome (Migration/Economic/Outside) a transformation, but LBA (Sea Peoples/Drought/Outside) a collapse. Cause does not seem to be her primary criterion.

  ### The Rule She Is *Really* Using
  **Rule: Continuity of Sociopolitical Identity.**

  Your friend is likely operating on a definition of collapse derived from modern resilience theory (e.g., the work of archaeologists like Guy Middleton or Patricia McAnany). She defines "Collapse" not as population death or even the loss of cities, but as the **irreversible loss of the specific sociopolitical identity and complexity that defined the group.**

  *   **Why this fits:**
      *   **Maya:** The *identity* persisted (Postclassic Maya were still culturally Maya), so it's Transformation/Reorganization.
      *   **Rome:** The *institutions* evolved (Church/Law) without a "Dark Age" break in identity, so it's Transformation.
      *   **LBA:** The *identity* broke. Mycenaeans lost writing and kingship for centuries (Greek Dark Ages); Hittites vanished as a political entity. This is Collapse.
      *   **Greenland:** The *identity* and the *people* both vanished from that context. This is Collapse.
      *   **Indus:** The *Harappan identity* (script, urbanism, state) vanished without a direct successor claiming that specific mantle. The people became "Vedic" or village cultures, representing a break in sociopolitical identity. This is Collapse.

  ### The Best Test Case to Separate the Rules
  To definitively separate **Rule 1 (Biological Continuity)** from **The Real Rule (Identity Continuity)**, you should ask her about **The Taíno of the Caribbean** (post-1492).

  *   **The Scenario:** The Taíno chiefdoms were dismantled, their religion and political structures destroyed, and their population decimated by disease and war. However, genetic studies show significant Taíno ancestry survives in modern Caribbean populations, and some cultural practices persisted.
  *   **Rule 1 Prediction:** **Not Collapse.** (The biological community continued).
  *   **Real Rule Prediction:** **Collapse.** (The sociopolitical identity and structure were extinguished/replaced by Colonial systems).
  *   **Why this separates them:** The Indus case is muddy because we don't know if the "Vedic" successors saw themselves as Harappans. The Taíno case is a clearer example of biological survival vs. cultural/political extinction. If she says "Collapse," she prioritizes Identity over Biology.

  ### Confidence Levels & Flag
  *   **Confidence in Indus Verdict (Collapse):** **High (85%).** The loss of script and urbanism without direct political succession is the textbook definition of collapse in her framework (matching LBA).
  *   **Confidence in "Identity" Rule:** **Medium-High (75%).** This is the only logical synthesis that explains why Maya is "Not Collapse" while LBA is "Collapse" despite both losing cities.
  *   **Confidence in Test Case (Taíno):** **Medium (70%).** It is a strong theoretical separator, though modern political sensitivities sometimes complicate how archaeologists label colonial impacts.

  **The Point I Am Least Sure About:**
  I am least sure about **her specific distinction between the Western Roman Empire and the Late Bronze Age.** Both involved the fragmentation of central authority, economic contraction, and loss of territorial control. The differentiator is likely the "Dark Age" gap (literacy and complexity returned quickly in Europe via the Church, but vanished for centuries in Greece/Anatolia), but this is a nuanced chronological distinction that is harder to pin down than the spatial continuity of the Maya. If she views Rome as "Collapse," my entire model shifts; but assuming her "Transformation" verdict holds, the "Continuity of Institutions" is the key variable.
