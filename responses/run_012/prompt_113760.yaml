          *   Statement 1 (Spokesperson): "Deeply regrets," "Full responsibility," but "Not an admission of liability" (insurer clause).
          *   Statement 2 (Letter): English says "Apologizes," Spanish says "Feel bad about trouble" (translation error/negligence).
          *   CEO: Claims he apologized, but families say no face-to-face contact.
          *   Lawyer: Claims Statement 1 "wasn't cleared language" (contradicts CEO endorsement).
      *   **Goal:** Move beyond "anatomy of a good apology" listicles. Understand the *ontology* of the corporate apology in this specific context.
