answer: |-
  The smoke hung over Port Haven like a low ceiling, smelling of pitch and pine. Elias Thorne stood in the shell of his yard, counting the ribs of hulls that would never float. The fire had taken everything but the tools on his belt and the timber stacked wet on the wharf. He had enough wood for one vessel. Maybe two if he skimped, but Elias did not skimp. He had enough for one.

  He walked up the hill to the Registry of Undertakings. It was a new building, brick and stern, with a sign promising Order in Commerce. Inside, Mr. Gable sat behind a high desk, polishing a brass stamp. Gable was a man of ledgers. He opened the heavy book to Elias's name.

  "Here," Gable said, tapping a line. "Hull number forty. Promised to the Northern Shipping Co. Value recorded. Certificate issued." He paused, turning a page. "And then assigned to Mr. Sterling. The Registry recognizes Sterling as the entitled party. You build for Sterling."

  "And the other?" Elias asked.

  Gable didn't look up. "The Vane boy? There's no entry. No value exchanged. No stamp. The Registry cannot see what isn't written. A gratuitous undertaking is private sentiment, not public debt. You owe nothing to the boy in the eyes of the Office."

  Elias left the brick building for the damp air of the wharf. Thomas Vane was waiting there. He was twenty, thin as a rail, with his father's eyes. His father had drowned saving a net two winters prior, leaving Elias the only witness to the man's last wish: that Elias build a boat for the boy when he came of age. No money changed hands. It was a vow between men.

  "I sold the nets," Thomas said, his voice tight. "I told the buyers I'd have the *Mary* ready by spring. I gave up the winter work. If you don't build her, I starve."

  Elias looked at the boy's hands. They were empty. He had rearranged his life on the strength of a word.

  "I know," Elias said.

  "You promised my father," Thomas said. "Doesn't that count?"

  "It counted enough for you to sell the nets," Elias said. He didn't say that it counted enough to keep him awake at night.

  The third man arrived on the afternoon tide. Mr. Sterling's agent, a Mr. Hales, wore a suit too fine for the harbour. He held a leather portfolio. He looked at the charred yard, then at Elias, then at Thomas Vane standing nearby.

  "I represent the holder of the certificate," Hales said. He sounded apologetic. "Northern Shipping sold the undertaking to Mr. Sterling. The Registry confirms the transfer. I am here to claim the hull."

  "There's only wood for one," Elias said.

  "Then that one is mine," Hales said. He looked at Thomas. "I understand your situation. Truly. But I hold the paper."

  "You hold a sale," Thomas snapped. "You didn't hear the promise."

  Hales flushed. He looked at Elias. "I didn't. I bought the right to collect. But... surely a vow is personal? If I enforce this, am I not breaking the nature of the thing? I didn't make the bargain. I bought the invoice."

  Gable arrived shortly after, drawn by the commotion. He stood with his ledger under his arm. The three men formed a triangle around Elias.

  "What do I owe?" Elias asked. The question hung in the salt air.

  Gable spoke first. "You owe the Certificate. The Registry rules bind us. The practice defines the obligation. You build for Sterling's agent. The boy's claim is invisible."

  Thomas stepped forward. "You owe me. I stood on your word. I burned my bridge. The harm I suffer if you break it is the debt. You owe the one who relies."

  Hales shifted his weight. "You owe the Company who hired you. They made the pact. I merely hold the collection right. A sale cannot change what you owe. If anyone is owed, it is the original firm, not me. And certainly not the boy."

  Three men. Three answers. The Registry said Sterling. The Boy said Thomas. The Agent said the Original Firm, implicitly denying his own right to claim the boat while holding the paper that said he could.

  Elias looked at the wood. He looked at Thomas, who had nothing but the promise. He looked at Hales, who had everything but the bond. He looked at Gable, who had the rules but no heart.

  "The wood is mine," Elias said. "I cut it. I lay it up."

  "The Registry says—" Gable began.

  "The Registry can stamp air," Elias said. "I'm building the *Mary*."

  "You'll be sued," Hales warned, though he didn't reach for his portfolio. "Sterling holds the assignation."

  "Then let him sue," Elias said. "But he won't get a boat. He'll get a lien on a burned yard."

  The town settled it the way Port Haven settled things that the law couldn't touch. The minister passed a hat. The fishermen put in coin. The merchant guild, embarrassed by the Registry's blindness, contributed a sum equal to the hull's value. They paid Sterling's agent. Hales took the money, marked the certificate discharged, and left on the evening train. He looked relieved to be rid of the paper.

  Gable closed the ledger. He did not record the discharge of the *Mary*. He recorded the payment. The practice remained intact, even if the obligation had been bought out of it.

  Six months later, the *Mary* slid into the water. Thomas stood at the stern. Elias stood on the wharf. The town watched. There was no certificate for this launch. There was no fee. There was only the boat, and the boy who needed it, and the builder who had chosen.

  Yet, as the sails caught the wind, Elias felt a hollowness. He had been forced to choose. The town's money had saved him from the Registry, but it had also bought him out of his bind. He was free, but only because others paid the price of his freedom. Thomas had his livelihood, but he knew it had come on charity, not just on the promise. The Registry stood on the hill, brick and stern, waiting for the next fee. The rules had not changed. They had only been circumvented.

  The *Mary* turned toward the open water. It was a fine boat. It was the right boat. But as it disappeared into the mist, no one knew if the obligation had been fulfilled, or merely escaped.

  The ending vindicates the reliance account, as the obligation is resolved by protecting the promisee's detrimental reliance rather than enforcing the recorded contract or the promisor's unconstrained will. The practice account is exposed as rigid and blind to moral reality, requiring a monetary workaround to achieve justice, while the will account is left exposed because the promisor's autonomy was ultimately constrained by community pressure rather than pure self-legislation.
  \answer{reliance}
