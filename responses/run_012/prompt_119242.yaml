          3.  *Agent Attribution:* Doctors acted, but family applied/court ratified. Who omitted? Does duty assignment drive causation?
          4.  *Withdrawal vs. Withholding:* Is the equivalence theoretical or assumed? Asymmetry issues.
          5.  *Silence/Contribution:* Does metaphysics have anything left to contribute? What case would decide between the accounts? What would *Bland* look like under each?
      *   **Constraint:** No doctrinal survey, no reading list. Focus on metaphysics. Run in both directions (Case $\to$ Theory, Theory $\to$ Case).

  2.  **Initial Brainstorming & Mapping:**
      *   *Bland* is the quintessential "omission" case in law. The Law Lords explicitly relied on the act/omission distinction to avoid murder liability.
      *   *Counterfactual Account:* Simple but-for. If doctors fed him, he lives. They didn't, he died. Therefore, they caused death. This clashes with the legal outcome (not murder).
      *   *Duty-Based Account (Hart & Honoré):* Causation is selective. We pick out "abnormal" conditions or breaches of duty. If no duty to feed, no causal responsibility in the relevant sense. This aligns better with the legal outcome but risks circularity (duty determines cause).
      *   *Metaphysical Tension:* Is causation a natural relation or a normative selection? *Bland* exposes the seam.

  3.  **Drafting - Section by Section:**

      *   **Introduction:** Acknowledge the user's expertise level. Set the stage: *Bland* isn't just a medical law case; it's a metaphysical puzzle about negative facts.

      *   **Part 1: The Two Accounts Applied to *Bland*:**
          *   *Counterfactual-Dependence:*
              *   *Scenario:* Doctors faced a choice: Continue PEG feeding or stop.
