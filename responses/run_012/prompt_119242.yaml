              *   *Contribution:* Metaphysics clarifies *what* is being evaluated. It forces the moral theory to be explicit about the baseline.
              *   *Deciding Case:* Need a case where Duty and Counterfactual diverge *without* clear moral consensus. E.g., A stranger vs. a doctor. Or a case where duty exists but counterfactual is weak (overdetermination).
