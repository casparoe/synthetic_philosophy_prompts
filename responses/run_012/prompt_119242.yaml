              *   *Critique:* This suggests causation is not prior to normativity. The "omission" label is a conclusion, not a premise. The theory gets its footing not in physics but in the "normal course of things" (Hart & Honoré) which is itself value-laden.
          *   *2. Counterfactual Sufficiency:*
