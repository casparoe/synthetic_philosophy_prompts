answer: |-
  This analysis treats *Airedale NHS Trust v Bland* not as a precedent to be summarized, but as a metaphysical datum. The case is a locus classicus for the problem of negative causation because the court explicitly manipulated the ontology of the doctors' conduct (reclassifying a bodily movement as an omission) to secure a specific moral outcome. Below is the stress test run in both directions: first applying the theories to the facts, then applying the facts to the theories.

  ### I. The Two Accounts Applied to *Bland*

  #### 1. The Counterfactual-Dependence Account
  **The Setup:** On this view, $C$ causes $E$ if, had $C$ not occurred, $E$ would not have occurred. Omissions are treated as negative facts or events identical to the non-occurrence of an act.

  *   **What the doctors faced:** A binary physical choice: maintain the PEG feed or discontinue it.
  *   **Identified Cause:** The discontinuation of feeding (or the non-provision of nutrition). Since Bland would not have died *at that time* had the feeding continued, the withdrawal is a *sine qua non* of the death.
  *   **Explanatory Power:** It captures the physical reality of the causal chain. It explains why the death occurred *when* it did. It aligns with the intuition that the removal of support is physically efficacious.
  *   **Misdescription/Blind Spots:** It cannot accommodate the Law Lords' conclusion that this was not a "killing." If counterfactual dependence suffices for causation, and causation + intent suffices for murder, the doctors are metaphysically and legally killers unless a separate justification defense is invoked. The account forces a wedge between *causation* (which is present) and *liability* (which is denied). It struggles to explain the court's insistence that the doctors did *nothing*; metaphysically, they did something (turned off a pump, stopped a regimen) that made a difference.

  #### 2. The Duty-Based Account (Hart & Honoré)
  **The Setup:** Causation is a selective concept. We isolate causes from conditions based on the "normal course of things." An omission is a cause only if there was a duty to act, making the non-performance an "abnormality" that intervenes in the natural course.

  *   **What the doctors faced:** A normative question: Did the clinical context impose an obligation to continue?
  *   **Identified Cause:** The original accident (Hillsborough crush) and the resulting PVS. The doctors' withdrawal is *not* a cause because, once treatment was deemed futile, there was no duty to continue. The death is attributed to the pathology, not the withdrawal.
  *   **Explanatory Power:** It aligns perfectly with the *ratio* of *Bland*. It explains why the doctors are not killers: they did not causally intervene in a way that attracts responsibility. It preserves the act/omission distinction as a causal, not merely justificatory, boundary.
  *   **Misdescription/Blind Spots:** It renders causation parasitic on liability. If the duty determines the cause, then establishing causation requires first settling the moral question of what the doctor ought to have done. It misdescribes the physical symmetry between withholding and withdrawing; physically, removing a tube is an intervention, yet the theory must classify it as a "return to the natural course" to avoid causal attribution.

  ---

  ### II. Pressure Points: Theory Tested by the Case

  Here we press the metaphysical commitments of the theories against the specific contours of the *Bland* judgment.

  #### 1. The Normative Baseline and the "Doing"
  At the level of bodily movement, disconnecting a pump is a positive event. The Law Lords characterized it as an omission to continue treatment. This implies the causal status of the conduct depends on a prior normative baseline (what is the doctor *required* to do?).

  *   **The Pressure:** If the duty determines whether the event counts as an omission, and the duty is determined by "best interests," then the causal claim is doing no independent work. It is a moral conclusion restated in causal vocabulary.
  *   **Where the Theory Gets Footing:** The Duty-Based account gets its footing in the **normative expectation of the role**, not the physics of the body. Hart and Honoré argue that causation selects "abnormal" conditions. In *Bland*, the Court redefined the "normal course" for a PVS patient from "biological preservation" to "dignified cessation."
  *   **The Verdict:** The theory admits that "cause" in legal/moral contexts is not a natural kind. *Bland* reveals that the act/omission distinction is not ontological but **teleological**. The metaphysics here is not about events, but about the *description* of events under a norm. If the theory claims to be purely metaphysical, *Bland* falsifies it. If it claims to be metaphysics-for-responsibility, *Bland* confirms it, but at the cost of making causation derivative of morality.

  #### 2. Counterfactual Sufficiency vs. Legal Cause
  Continued feeding would have prolonged life. Withdrawal makes a difference. It is a but-for cause. Yet the court denies it is a killing.

  *   **The Pressure:** Does this show counterfactual dependence is insufficient for causation, or that legal cause is distinct from metaphysical cause?
  *   **The Defense:** I defend the claim that **counterfactual dependence is insufficient for *attributive* causation.** There is a distinction between *event causation* (the physical dependency) and *agent causation* (the attribution of the outcome to the agent). *Bland* demonstrates that one can be an event-cause of a death without being the agent-cause of a killing.
  *   **Implication:** The Counterfactual Account captures event causation but fails to capture the *selectivity* required for responsibility. *Bland* shows that the law requires a filter beyond "difference-making." That filter is the duty/norm baseline. Therefore, the Counterfactual Account is metaphysically thin; it describes the world but cannot parse responsibility without importing external norms.

  #### 3. The Agent Question: Who Omitted?
  The omission is attributed to the doctors, but the decision was initiated by the family and ratified by the Court.

  *   **The Pressure:** If omissions are causes only relative to a duty, and the duty-holder is the doctor, do the family and court drop out of the causal story?
  *   **The Analysis:** Yes, on the Duty-Based account, they drop out of the *causal* story, though they remain in the *explanatory* story. They are conditions that altered the doctor's duty, but since they held no duty to feed Bland themselves, their actions (applying to court) are not omissions.
  *   **The Problem:** This requires an independent account of duty assignment. *Bland* suggests this account is normative throughout. The Court effectively *assigned* the causal agency to the doctors by placing the duty on them, then *released* them from it to negate the causation. This creates a circularity: The doctors are the causal agents because they hold the duty; they hold the duty because they are the medical agents. The theory cannot explain *why* the duty attaches to the doctor without referencing the very causal capacity (control over the pump) it seeks to evaluate.

  #### 4. Withdrawal vs. Withholding
  The Court treats discontinuing nutrition as equivalent to never having started it.

  *   **The Pressure:** Is this equivalence a consequence of the theory or an assumption the theory imports?
  *   **The Analysis:** It is an **assumption the theory imports.** Physically, there is an asymmetry: withdrawal interrupts an existing causal process (the pump feeding the blood); withholding does not.
  *   **Theoretical Cost:** For the Duty-Based account to treat them alike, it must assert that the *obligation* is continuous, not the *physics*. If the obligation ceases, both acts become "omissions." If the theory treats them alike, it admits it is not tracking the topology of the physical world. It is tracking the continuity of the *normative relationship*.
  *   **Anomaly:** For a pure Counterfactual theorist, withdrawal is a stronger candidate for causation than withholding (interrupting a flow vs. not starting one). *Bland* forces the Counterfactual theorist to accept a moral equivalence that contradicts the physical asymmetry, or to admit that legal causation ignores physical topology.

  #### 5. Silence and Contribution
  If the best account of *Bland* makes the act/omission distinction turn on a substantive judgment about interests, does the metaphysics of causation have anything left to contribute?

  *   **The Silence:** Metaphysics is silent on **which duties generate causal responsibility.** It can tell you *that* a duty creates a causal link, but not *why* that duty exists. In *Bland*, the "best interests" judgment is doing all the heavy lifting. The causation talk is merely the vessel.
  *   **The Contribution:** However, metaphysics contributes **clarity of structure.** It forces the moral theorist to admit they are manipulating the causal baseline. It prevents the smuggling of moral conclusions into physical descriptions without acknowledgment. It distinguishes between "The patient died because the pump was off" (metaphysical fact) and "The doctor caused the death" (normative attribution).
  *   **The Deciding Case:** To decide between the Counterfactual and Duty-Based accounts, you need a case where **Duty and Counterfactual Dependence diverge in the absence of moral consensus.**
      *   *Hypothetical:* A passerby (no duty) sees a drowning child. They could easily save them (strong counterfactual dependence). They walk away. Child dies.
      *   *Counterfactual Account:* The passerby caused the death (but-for cause).
      *   *Duty-Based Account:* The passerby did not cause the death (no duty to act); the water/drowning caused it.
      *   *Bland Under Each:*
          *   **Under Counterfactual:** *Bland* is a case of killing that is *justified*. The doctors caused death, but were permitted to do so. The act/omission distinction is collapsed; the moral work is done by justification, not causation.
          *   **Under Duty-Based:** *Bland* is a case of non-causal letting die. The doctors did not cause death. The moral work is done by the definition of the causal field.

  ### III. Conclusion for the Dissertation

  *Bland* suggests that the metaphysics of omission causation cannot be separated from the metaphysics of norms. The Duty-Based account (Hart & Honoré) survives *Bland* better than the Counterfactual account, but only by conceding that "causation" in the legal/moral sense is a normative selection mechanism, not a description of natural relations.

  For your thesis, the critical insight is this: *Bland* demonstrates that the **act/omission distinction is not a pre-normative metaphysical fact upon which morality rests, but a post-normative categorization used to distribute responsibility.**

  If you wish to defend a robust metaphysics of causation against this, you must argue that there is a "natural" baseline for omissions (e.g., statistical normality) independent of duty. *Bland* is the counter-argument: the "natural" baseline for a PVS patient was legally reconstructed from "life" to "death" based on interest, not statistics. The case suggests that in the domain of human agency, **causation is interest-relative.** Your work should focus on whether this relativity destroys the possibility of a unified theory of causation, or merely restricts metaphysical causation to the physical domain, leaving "legal causation" as a distinct, normative construct.
