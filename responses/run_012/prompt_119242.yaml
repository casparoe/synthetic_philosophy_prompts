  *(Refining the "Deciding Case")*: What case distinguishes Counterfactual from Duty? A case where there is a duty but no counterfactual impact (preempted omission)? Or counterfactual impact but no duty (stranger)? *Bland* is tricky because the court *denies* the duty to make the omission non-causal. A better test case might be *overdetermined omission*. But I must stick to how *Bland* would look. Okay, I will construct a hypothetical variation of *Bland* or a parallel scenario to show the divergence. Actually, the prompt asks "describe the kind of case that would actually decide between the... accounts." So I can propose a new hypothetical.

