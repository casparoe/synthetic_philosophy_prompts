              *   *Defense:* Legal causation $\neq$ Metaphysical causation. Metaphysically, they caused death. Legally, they didn't *unlawfully* cause death. Or, stronger claim: Counterfactual dependence is necessary but not sufficient for *causal responsibility*. We need an "intervention" filter.
              *   *Decision:* I need to be explicit. I will argue that *Bland* shows counterfactual dependence is insufficient for *attributive* causation (causation relevant to responsibility), even if it holds for *event* causation.
          *   *3. The Agent Question:*
              *   Doctors held the duty. Family/Court triggered the release from duty.
              *   *Implication:* If duty defines omission, the "causal agent" is whoever holds the duty. Family/Court are causal *conditions* but not causal *agents*.
              *   *Problem:* This makes duty assignment the metaphysical pivot. Duty is normative. So causation is normative.
          *   *4. Withdrawal vs. Withholding:*
