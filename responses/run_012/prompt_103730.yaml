      *   On Pareto: Is it truly Pareto? Rwanda/Kosovo showed the status quo was bad for *someone*. R2P tries to fix both. But Libya showed the "cost" might be higher than expected for Sovereigntists.

      *(Final Polish)*: Ensure the conclusion on complicity is strong. Complicity happens when the *procedure* of compromise becomes an alibi for *inaction*.

  7.  **Final Review against constraints:**
