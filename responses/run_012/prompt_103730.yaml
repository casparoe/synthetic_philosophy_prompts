      *   Run forward (Libya/Syria)? Yes.
      *   Run backward (Model evaluation)? Yes.
      *   Verdict (Trade vs. Loss)? Yes.
      *   Discipline/Silence? Acknowledge where the trade model fails to capture moral duty.

      *(Mental Check on "Pareto"):* A Pareto improvement makes at least one better off without making others worse off. In R2P, Sovereigntists give up absolute immunity (worse off in one sense) for procedural control (better off in another). Interventionists give up unilateralism (worse) for legitimacy (better). It's a Kaldor-Hicks situation potentially, but framed as Pareto on "own terms." I will clarify this nuance.

      *(Mental Check on "Complicity"):* Complicity implies moral guilt. If the trade model justifies inaction because the "price" wasn't met, that's where complicity hides.

