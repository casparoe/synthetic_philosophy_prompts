answer: |-
  ### I. Mapping the 2005 Agreement

  To map the 2005 World Summit Outcome Document onto the trade model of moral compromise, we must identify the transacting agents, the property rights exchanged, and the market structure.

  **The Parties:**
  The transacting parties are not abstract "value systems" but the coalitions of Member States representing them.
  *   **Side A (Sovereigntists):** Primarily the Non-Aligned Movement, China, and Russia.
  *   **Side B (Interventionists/Human Rights):** Primarily Western liberal democracies and international civil society advocates.
  *   **The Populations:** The intended beneficiaries of the "human rights" good. Crucially, under the trade model's fourth condition (*the parties doing the trading must be the holders of the claims being traded*), the populations are **not parties**. They are the collateral.

  **The Entitlements and Goods:**
  *   **Sovereigntists Surrendered:** The absolute Westphalian entitlement to non-interference. They alienated the claim that domestic jurisdiction is a trump card against external scrutiny regarding mass atrocities.
  *   **Sovereigntists Received:** Procedural sovereignty. They secured the requirement that any coercive action must be routed through the Security Council (UNSC), preserving the veto power of the P5.
  *   **Interventionists Surrendered:** The entitlement to unilateralism or "coalition of the willing" action (the Kosovo model). They alienated the claim that moral necessity alone justifies force without UN mandate.
  *   **Interventionists Received:** Normative recognition. They secured the principle that sovereignty is conditional on the responsibility to protect, establishing a legal and moral hook for future intervention.

  **Pareto Improvement vs. Risk Redistribution:**
  Was this a Pareto improvement over the pre-2005 status quo (characterized by the paralysis of Rwanda and the unilateralism of Kosovo)?
  *   **On Paper:** It appears to be a Pareto improvement *on each side's own terms*. Sovereigntists prefer a regulated UNSC process to unilateral invasion; Interventionists prefer a recognized norm of intervention to total impunity.
  *   **In Reality:** It is largely a **redistribution of risk**. The Sovereigntists risk the erosion of regime security if the UNSC acts; the Interventionists risk the lives of vulnerable populations if the UNSC blocks action. The status quo (Rwanda) resulted in certain death for victims; the new deal makes protection *contingent*. Therefore, for the victims, it is not a Pareto improvement but a move from *neglect* to *conditional hope*.

  **The Security Council:**
  The Security Council is not a party to the bargain; it is the **marketplace and clearinghouse**. It is the mechanism through which the exchange is validated. However, the P5 members within the Council are parties, holding the specific entitlement (the veto) that acts as the currency of the Sovereigntist side.

  **Condition Check:**
  1.  *Entitlements free to alienate:* States can legally agree to limit sovereignty. (Pass)
  2.  *Commensurability:* Sovereignty and human security are incommensurable, but the deal relies on subjective valuation (procedural control vs. normative gain). (Pass, barely)
  3.  *Voluntary and Enforceable:* Adoption was voluntary, but enforcement is weak. There is no penalty for a P5 member vetoing a necessary intervention. (Fail)
  4.  *Holders of claims:* The populations whose rights are traded are not at the table. (Fail)

  ### II. Running the Case Forward: Libya and Syria

  The post-2005 history tests the enforceability and trust required for the exchange to hold.

  **Resolution 1973 and Libya:**
  In 2011, the UNSC passed Resolution 1973, authorizing force to protect civilians in Libya. This was the market functioning: the Interventionists paid the price (seeking UNSC approval) and received the good (authorization). However, NATO's subsequent interpretation of the mandate as licensing regime change (the overthrow of Gaddafi) altered the exchange rate.
  *   **Impact on Exchange:** The Sovereigntists (Russia/China) argued the Interventionists took more than they paid for. They viewed the "protection" good as a Trojan horse for "regime change," a good not on the shelf.
  *   **Vindication:** The Sovereigntist suspicion was vindicated in their eyes. They surrendered a slice of sovereignty based on a specific narrow mandate (protection), but the counterparty utilized it to effect political transformation. This devalued the Sovereigntist currency (trust in UNSC mandates).

  **The Paralysis over Syria:**
  Following Libya, Russia and China vetoed multiple resolutions regarding Syria.
  *   **Impact on Exchange:** The marketplace froze. The Sovereigntists, feeling burned by the Libya trade, hoarded their entitlement (the veto). The Interventionists could not purchase the good (authorization) at any price.
  *   **Result:** The compromise collapsed into the pre-2005 status quo of paralysis, but with higher stakes because the norm existed to highlight the failure. The trade model explains this perfectly: when one party believes the other has cheated on the quality of goods delivered (Libya), they refuse further transactions (Syria).

  ### III. Running the Case Backward: Defects in the Trade Model

  Viewing R2P through the lens of the trade model exposes structural defects that the 2005 text obscured.

  **1. The Third-Party Problem (Violation of Condition 4):**
  The most glaring defect is that the "goods" being traded (protection from genocide) belong to a third party (the population) who did not consent to the trade. In a standard market, you cannot trade what you do not own. States do not "own" their citizens' right to life in a way that allows them to bargain over it. The trade model treats the population's safety as a state asset to be swapped for procedural privileges. This exposes the model as morally insufficient: it legitimizes a deal between oppressors and outsiders where the victim is the object, not the agent.

  **2. The Collateral Problem:**
  In the trade model, the Interventionist side receives a *promise* (the possibility of future action) rather than a tangible good. There is no collateral. If the Sovereigntist side vetoes action (as in Syria), the Interventionists lose everything, while the Sovereigntists retain their sovereignty intact. The exchange is asymmetrical: one side gives up a concrete right (non-interference) for a contingent hope; the other gives up a contingent hope for a concrete procedural shield.

  **3. The Frame: Exchange vs. Truce:**
  The episode suggests the correct frame is not **exchange** (mutual gain) but **truce** (avoidance of mutual loss). The 2005 agreement was not a discovery of gains from trade, but a ceasefire in a normative war. The Sovereigntists feared neocolonialism; the Interventionists feared another Rwanda. The agreement stopped the fighting over the *principle*, but it did not solve the *problem*. The trade model implies positive sum gains; the R2P reality is often zero-sum (either sovereignty is breached, or people die).

  **Where the Theory is Silent:**
  The trade theory is silent on **moral duty independent of consent.** It cannot explain why the international community *ought* to act if the "price" (sovereign consent) is too high. It treats intervention as a commodity to be purchased, not an obligation to be discharged.

  ### IV. Verdict: Gains from Trade vs. Avoidance of Shared Loss

  **Verdict:**
  Moral compromise of this kind is **better justified by the avoidance of a shared loss** than by gains from trade.

  **Reasoning:**
  The "gains from trade" justification fails because it incentivizes transactional behavior over moral necessity. If R2P is a trade, states are rational to withhold "buying" (authorizing intervention) if the "cost" (precedent of interference) seems too high, as Russia did after Libya. This leads to market failure (Syria).
  Justification by **avoidance of shared loss** recognizes that the alternative to compromise is not a stable status quo, but a catastrophic failure that damages the legitimacy of the entire international system (e.g., the UN becoming irrelevant in the face of genocide). The "gain" is not profit, but the prevention of systemic moral collapse.

  **Implications for Complicity:**
  This verdict dictates when compromise slides into complicity.
  *   **Under the Trade Model:** Complicity is avoided as long as the deal is voluntary and terms are met. If the SC vetoes, the Interventionists are "off the hook"; they tried to buy, the seller refused. Complicity is externalized to the mechanism.
  *   **Under the Shared Loss Model:** Complicity arises when the **mechanism of compromise becomes an alibi for inaction.** If the procedural safeguards (the veto) are used to block action not to preserve stability, but to shield allies from accountability, the compromise has become complicity.

  When the "marketplace" (Security Council) is used to prevent the "goods" (protection) from reaching the "consumers" (victims) despite the capacity to deliver them, the compromise is no longer a prudent avoidance of conflict; it is a conspiratorial maintenance of impunity. The trade model blinds us to this by focusing on the rights of the traders (states); the shared loss model forces us to look at the cost borne by the non-parties (the dead). Therefore, a moral compromise slides into complicity the moment the procedure of agreement is valued higher than the prevention of the atrocity the agreement was meant to address.
