      *   **Conditions for the Analogy:**
          1.  Parties hold entitlements free to alienate.
          2.  Goods are commensurable or improve each party's position on its own terms.
          3.  Exchange is voluntary and enforceable.
          4.  Parties trading are the holders of the claims being traded.
      *   **Tasks:**
          1.  **Map the Agreement:** Identify parties, entitlements surrendered/received, assess Pareto improvement vs. risk redistribution, and define the Security Council's role (party vs. marketplace).
          2.  **Run Forward:** Analyze the impact of Resolution 1973 (Libya), regime change interpretation, and Syria paralysis on the exchange. Was the sovereigntist suspicion vindicated?
          3.  **Run Backward:** Evaluate the trade model itself based on this case. Does it confirm, expose defects (e.g., third-party victims, lack of collateral), or suggest a different frame?
          4.  **Verdict:** Judge whether moral compromise is better justified by gains from trade or avoidance of shared loss. Implications for complicity in future atrocities.
      *   **Constraint:** Be disciplined about mapping. Admit where the theory is silent.

  2.  **Task 1: Mapping the 2005 Agreement:**
      *   *Parties:* "Sovereigntists" (Global South, Russia, China, etc.) vs. "Human Rights Interventionists" (Western liberals, NGOs, etc.).
      *   *Entitlements Surrendered:*
          *   Sovereigntists: Absolute non-interference (Westphalian shield).
          *   Interventionists: Automaticity/Unilateralism (Right to intervene without UN approval).
      *   *Goods Received:*
          *   Sovereigntists: Veto power/Procedural hurdle (Security Council approval required).
          *   Interventionists: Normative recognition (Sovereignty is conditional on protection).
      *   *Pareto Improvement vs. Risk Redistribution:* Pre-2005 status quo (Rwanda/Kosovo) was chaotic. Rwanda = no intervention (failure of HR side). Kosovo = unilateral intervention (failure of Sov side). R2P offers a *potential* Pareto improvement (better protection + procedural safeguards), but practically it looks more like risk redistribution (Sov risk loss of control; HR risk loss of life due to veto).
      *   *Security Council Role:* It acts as the *marketplace* (mechanism of exchange) and the *enforcer*, but technically the P5 are *parties* (specifically the sovereigntist P5). It's a hybrid. Let's call it the clearinghouse/marketplace where the specific transaction is validated.
      *   *Condition Check:*
          1.  *Entitlements:* Do states own sovereignty? Yes, legally. Do HR advocates own the right to intervene? Debatable (customary law vs. UN Charter).
          2.  *Commensurability:* Hard to measure "lives saved" vs. "sovereign integrity." But on *own terms*, both get something.
          3.  *Voluntary/Enforceable:* Voluntary adoption? Yes. Enforceable? Weak. No penalty for violating R2P if SC blocks it.
          4.  *Holders of Claims:* **Critical Failure.** The victims (populations) are not parties. States are trading rights *over* populations.

  3.  **Task 2: Running Forward (Libya & Syria):**
      *   *Resolution 1973 (Libya):* SC authorized force to protect civilians.
      *   *NATO/Regime Change:* Exceeded mandate (from protection to overthrow).
      *   *Impact on Exchange:* This broke the "trust" in the trade. The Interventionists took the good (authorization) but arguably took more than paid for (regime change).
      *   *Syria Paralysis:* Russia/China vetoed.
      *   *Vindication:* Sovereigntists feel vindicated ("We told you R2P is a Trojan Horse for regime change"). Interventionists feel betrayed ("You are blocking necessary protection").
      *   *Exchange Status:* The market froze. The currency (SC resolution) was devalued. The sovereigntist side feels they surrendered sovereignty for a promise that was abused.

  4.  **Task 3: Running Backward (Evaluating the Model):**
      *   *Defect 1 (Third Parties):* The populations are the object, not the party. This violates condition 4 (Parties must be holders of claims). The victims cannot consent to the trade.
      *   *Defect 2 (Collateral):* The HR side's good is a *promise* of future action, contingent on SC will. There is no collateral. If the SC vetoes, the HR side gets nothing, but the Sovereigntists already kept their sovereignty.
      *   *Defect 3 (Incommensurability):* Sovereignty is a structural right; Protection is a moral imperative. Trading them like commodities masks the moral asymmetry.
      *   *Frame:* Is it exchange? Or is it a *truce*? A truce implies avoiding mutual destruction (shared loss) rather than gaining mutual benefit.

  5.  **Task 4: Verdict (Trade vs. Shared Loss):**
      *   *Trade Justification:* Fails because the "gains" are illusory for the victims if the deal stalls (Syria). It treats rights as property.
      *   *Shared Loss Justification:* Better fit. The compromise is about avoiding the worst outcomes of the alternatives (Total Anarchy/Unilateral War vs. Total Impunity/Genocide).
      *   *Complicity:* If justified by trade, we stop when the deal isn't "profitable." If justified by avoiding shared loss, we act when the loss (atrocity) looms, regardless of "sovereign profit." Complicity arises when we treat the mechanism (SC veto) as more valuable than the end (protection), prioritizing the *deal* over the *moral imperative*.
      *   *Silence:* The theory is silent on *moral duty* independent of consent. It cannot explain why we *should* protect if there's no "gain" for the state.

