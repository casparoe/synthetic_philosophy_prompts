answer: |-
  Here is the sharp principle you are looking for, followed by the verdict on your cases.

  ### The Principle
  You are not using one principle. You are quietly switching between two different lenses. Neither is wrong, but they answer different questions.

  1.  **The Mechanic's Lens (Production):** Did the physical chain of energy complete? This asks: *Did X actively push Y over the edge?*
  2.  **The Historian's Lens (Explanation):** What makes the outcome intelligible or blameworthy? This asks: *Without X, would the story make sense?*

  Your frustration comes from trying to force the Mechanic's Lens to do the Historian's job, and vice versa.

  ### The Verdict on Your Cases

  **Cases (1) and (2): The Mechanic's Lens**
  *   **(1) Two Bombs, Both Explode:** Both men completed a physical chain of destruction. Both are causes.
  *   **(2) Two Bombs, First Sinks Ship:** The second man's chain was interrupted. Physically, his bomb did nothing. He is not a cause *of the sinking*, though he is a cause of *attempted sinking*.
  *   **Why the flip?** Because under the Mechanic's Lens, timing is everything. Energy must reach the target. In (1) both reached; in (2) only one reached.

  **Cases (3), (4), and (5): The Historian's Lens**
  *   **(3) Match vs. Oxygen:** Oxygen is constant (background); the match is a variable (intervention). We name the variable the cause because it explains the *change*.
  *   **(4) Harvest vs. Rot:** The Harvest is the *Trigger* (the variable); the Rot is the *Ground* (the background vulnerability). You call the Harvest the cause because you are explaining the *timing* of the collapse.
  *   **(5) Defection vs. Rot:** Now you are explaining the *fact* of the collapse. Here, the Rot is no longer background; it is the explanatory weight. The Defection is just the spark. Under the Historian's Lens, Trigger and Ground do not compete; they cooperate. Both are causes.

  **Case (6): The Suicide**
  *   **Verdict:** This is **(5)**, not (1).
  *   **Why:** Unlike the bombs, the depression and the letter are not independent sufficient causes. The depression alone didn't kill her *that week*; the letter alone wouldn't kill a healthy person. They are *jointly* sufficient.
  *   **Application:** The Depression is the *Ground* (the rot); the Letter is the *Trigger* (the harvest/defection).
  *   **Blame:** If you want to blame the brother, use the Mechanic's Lens (he pulled the trigger). If you want to blame the illness, use the Historian's Lens (the ground was prepared). You can hold both truths without contradiction.

  ### The New Cases You Asked For

  **1. Two fires converging on one house.**
  *   **If they arrive simultaneously:** Both burn the house. Both are causes (Case 1).
  *   **If one arrives first and burns it down:** The second fire burns nothing. It is not a cause of the destruction (Case 2).
  *   **Novelist's Trap:** Don't let the second arsonist off the hook morally just because he was late. He is guilty of *attempt*, but he did not *cause* the loss.

  **2. War caused by an assassin's bullet and a century of tariff policy.**
  *   **Mechanic's Lens:** The bullet caused the war. (It was the Trigger).
  *   **Historian's Lens:** The tariffs caused the war. (They were the Ground).
  *   **The Synthesis:** The tariffs made the war *inevitable*; the bullet made it *immediate*.
  *   **Prediction:** If you write a scene about the assassination, the bullet is the cause. If you write a chapter about the economy, the tariffs are the cause. Do not force the characters to argue which one is the "real" cause. They are arguing about which Lens they are using.

  ### Summary for Your Draft
  *   **Use the Mechanic's Lens** when you need to establish **Plot**. (Who lit the fuse? Did the message arrive in time?)
  *   **Use the Historian's Lens** when you need to establish **Theme**. (Why was the empire fragile? Why was she vulnerable?)
  *   **Keep Case (6) as Case (5).** The letter is the spark, the depression is the fuel. A fire needs both. To say one "caused" it is to tell half the story; to say both "caused" it is to tell the whole truth.

  You don't need to drop any of your verdicts. You just need to acknowledge that "Cause" is a word that does two different jobs. Let it.
