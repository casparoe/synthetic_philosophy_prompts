answer: |-
  # Activity Design: The Consistency Trap

  **Topic:** Decision Theory (Pascal's Mugging / St. Petersburg Paradox family)
  **Time:** 90 Minutes
  **Participants:** 18 Graduate Students (Philosophy & Economics)
  **Goal:** Students commit to Expected Value (EV) Maximization via a written policy, then face a gamble where that policy demands an intuitively absurd choice, forcing a confrontation with commensurability and bounded utility.

  ---

  ## 1. Materials & Setup

  **You need:**
  1.  **Projector:** For displaying the gambles and timers.
  2.  **Printer:**
      *   18 **Policy Cards** (index-card size, blank lines).
      *   18 **Decision Sheets** (half-sheet, with checkboxes for each round).
      *   100 **Raffle Tickets** (printed slips).
  3.  **Physical Props:**
      *   **The Prize:** One high-quality hardcover book (e.g., *Parfit's Reasons and Persons* or *Sen's Choice Welfare and Measurement*). Place it visibly on the desk.
      *   **The Randomizer:** A sealed opaque box containing 1,000 folded slips of paper. 999 say "LOSE," 1 says "WIN." (Seal it with tape in front of them or bring it pre-sealed with a signature across the tape).
      *   **A Timer:** Visible on the projector.

  **The Stakes:**
  *   Every student starts with **5 Raffle Tickets**.
  *   At the end of the session, one ticket will be drawn from the pool of all tickets held by students. The holder wins the Book.
  *   *Note:* This makes tickets valuable, but subject to diminishing marginal utility (having 50 tickets doesn't make you 50 times happier than having 1). This is a feature, not a bug, for the debrief.

  ---

  ## 2. Minute-by-Minute Timeline

  ### Phase 1: Calibration (0:00 – 0:25)
  *   **0:00–0:05: Introduction.**
      *   Welcome the students. State clearly: "This is not a lecture. It is a simulation of decision-making under uncertainty. Your goal is to maximize your chances of winning the Book."
      *   Distribute **Decision Sheets** and **5 Tickets** to each student.
      *   **Rule:** "In each round, you will choose Option A or Option B. You must mark your choice. No discussion yet."
  *   **0:05–0:25: Rounds 1–3 (The Training).**
      *   Display each round for 5 minutes (2 min decision, 3 min reveal).
      *   **Round 1 (Certainty):** A: Keep 1 Ticket. B: 50% chance to win 2 Tickets, 50% lose 1. (EV A = 1, EV B = 0.5). *Most choose A.*
      *   **Round 2 (Positive EV):** A: Keep 1 Ticket. B: 50% chance to win 3 Tickets, 50% lose 1. (EV A = 1, EV B = 1). *Split decision.*
      *   **Round 3 (Clear EV):** A: Keep 1 Ticket. B: 50% chance to win 5 Tickets, 50% lose 1. (EV A = 1, EV B = 2). *Most choose B.*
      *   **Instructor Script:** "Notice that in Round 3, the rational choice was clear. You traded a certainty for a risk because the *Expected Value* was higher. You are all acting as Expected Value Maximizers."

  ### Phase 2: The Commitment (0:25 – 0:35)
  *   **0:25–0:30: Policy Writing.**
      *   Distribute **Policy Cards**.
      *   **Instruction:** "Write down, in exactly one sentence, the decision rule you have been using to justify your choices in Rounds 1–3. This rule must be universal: you agree to apply it to *every* lottery offered for the rest of this session."
      *   *Target Answer:* "I will choose the option with the highest Expected Value."
      *   Collect the cards. (This makes the commitment formal).
  *   **0:30–0:35: The Setup.**
      *   "You have committed to a principle. Now we test its limits."
      *   Place the **Sealed Box** on the table. "This box contains 1,000 slips. One is a winner. The probability is exactly 1 in 1,000. I have not looked. The outcome is fixed."

  ### Phase 3: The Trap (0:35 – 0:55)
  *   **0:35–0:45: Round 4 (The Mugging).**
      *   **Display:**
          *   **Cost:** 1 Ticket (deducted immediately if you play).
          *   **Probability:** 1 in 1,000 (Draw from the box).
          *   **Payoff:** "The Instructor will dedicate one week of their next sabbatical to assisting your research project."
      *   **Instruction:** "Apply your written policy. Does it require you to take this gamble? Mark your Decision Sheet. You must be consistent with your Policy Card."
      *   *Silence.* Let them sweat. They must compare 1 Ticket against a verbal promise with a tiny probability.
  *   **0:45–0:55: The Reveal.**
      *   Ask for a show of hands: "Who took the gamble?"
      *   Ask for a show of hands: "Who refused?"
      *   **Do not resolve the winner yet.** (Keep the box sealed).
      *   **Instruction:** "Keep your Decision Sheets. We will not draw the box today. The outcome is irrelevant. The *choice* is the data."

  ### Phase 4: The Debrief (0:55 – 1:30)
  *   **0:55–1:05: The Pinch.**
      *   Collect Decision Sheets. Tally the results on the board.
      *   Ask a student who refused: "Your policy says Maximize EV. Why did you refuse?"
      *   *Likely Answer:* "The probability is too low." / "It's not worth the ticket."
      *   *Instructor:* "But if the value of the prize is high enough, the EV *is* higher. If one week of my time is worth more than 1,000 tickets to you, the math demands you take it. By refusing, did you violate your policy?"
  *   **1:05–1:20: Mapping the Puzzle.**
      *   **Point 1: Swamping.** "Any fixed finite payoff can eventually swamp any probability. If I offered to save 10^100 lives instead of one week of research, would you take it at 1 in 10^9? If yes, you are vulnerable to Pascal's Mugging."
      *   **Point 2: Bounded Utility.** "Perhaps you refused because utility is bounded. No amount of research help is worth going to zero tickets (risk of ruin). Your utility function for tickets is concave."
      *   **Point 3: Lexical Priorities.** "Perhaps some outcomes are in a separate class. A 'guarantee' (Round 1) might be lexically superior to a 'gamble,' regardless of EV."
  *   **1:20–1:25: Commensurability (The Verbal Prize).**
      *   "The prize was verbal. To calculate EV, you had to assign it a ticket value. Did anyone feel uncomfortable doing that?"
      *   Highlight that the paradox relies on **commensurability**. If the prize is "incomparable" to tickets, EV maximization cannot apply. The policy breaks not because the math is wrong, but because the inputs are category errors.
  *   **1:25–1:30: Conclusion.**
      *   Reveal the name: **Pascal's Mugging** (or St. Petersburg Paradox, depending on which flavor dominated the discussion).
      *   Raffle: Draw one ticket from the pool for the Book. (This resolves the stakes honestly).

  ---

  ## 3. Handling Predictable Failure Modes

  ### The "You're Lying" Objection
  **Prediction:** A student will argue, "The probability is effectively zero because you might not actually fulfill the promise. Therefore EV is zero."
  **Pre-emption:** In the introduction, state: "Treat the Instructor's promises as metaphysically binding for the duration of this exercise. We are testing the *logic of the decision rule*, not the solvency of the bank."
  **In-the-Moment Fix:** If raised during Round 4, reply: "The box determines the *opportunity*. If the box says WIN, the promise is executed. The box is sealed and verified. The probability is physical, not testimonial."

  ### The "Risk Aversion" Escape
  **Prediction:** Economics students will argue, "I'm risk-averse. Maximizing Expected *Utility*, not Expected *Value*, is the rational rule."
  **Instructor Response:** "Correct. But note what you did. You modified the policy mid-session. Your written card said 'Expected Value' (implied by Rounds 1-3 where tickets were treated linearly). You are now realizing that EV Maximization is only rational if utility is linear. The trap was assuming linearity over astronomical stakes."

  ### The "It's Just One Ticket" Apathy
  **Prediction:** Students don't care about the tickets.
  **Fix:** Emphasize the Book's value. "This is a first edition / hard to get." Remind them after Round 3 that their ticket count varies, creating inequality they might want to correct or protect.

  ---

  ## 4. What the Game Cannot Reproduce (Honesty Check)

  You must supply these points in your voice during the debrief, as the game mechanics cannot simulate them:

  1.  **Repetition (The Money Pump):** Pascal's Mugging is most devastating if it happens *every day*. If you pay $5 every day for a 1 in 10^9 chance of saving the universe, you go bankrupt before the universe is saved. This session is a **one-shot game**. Students can afford to be "irrational" once. You must explain that decision theory is often about *policies for repeated choices*, not just single acts.
  2.  **Existential Weight:** A week of research help is not "Saving 10^100 Lives." The emotional gravity that makes the Mugging intuitive (the horror of ignoring the huge payoff) is dampened by the classroom setting. You must verbally scale up the example in the debrief to show the moral stakes.
  3.  **Logical Uncertainty:** In the real Mugging, the uncertainty is often about the *truth of the claim* (Is the mugger really a matrix lord?), not just a random draw. The box simplifies this to empirical risk. You need to distinguish **empirical probability** (the box) from **epistemic probability** (is the offer coherent?) in the discussion.

  ---

  ## 5. Instructor Script for the "Verbal Prize" Tension

  *Use this during the Debrief to hit the commensurability constraint:*

  > "Look at your Policy Card. It says 'Maximize Expected Value.' To follow this rule in Round 4, you had to turn 'One Week of Research Help' into a number of Tickets.
  >
  > If you refused the gamble, you implicitly decided that the Prize was *not commensurable* with the Tickets. You treated them as different kinds of goods.
  >
  > If you accepted the gamble, you treated them as the same kind of good.
  >
  > The paradox exists only if we assume everything can be put on a single number line. If you believe some goods are 'priceless' or 'lexical,' Expected Value Maximization is not just difficult—it is category error. The game didn't just test your math; it tested your ontology."

  ---

  ## 6. Summary of Rules for the Projector

  **Slide 1: The Rules**
  1.  Maximize your Expected Value.
  2.  Tickets = Entries in the final raffle for the Book.
  3.  Write a Policy Rule after Round 3.
  4.  Apply that Rule to Round 4.

  **Slide 2: Round 4**
  *   **Cost:** 1 Ticket
  *   **Chance:** 1 in 1,000 (Sealed Box)
  *   **Prize:** "The Instructor will dedicate one week of their next sabbatical to assisting your research project."
  *   **Decision:** TAKE or PASS?
