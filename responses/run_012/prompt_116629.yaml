answer: |-
  Right, let's get this sorted so you can go back to your flatmate with something sharper than 'you just don't get it'. You've actually got a very good grip on the machinery; the row stems from applying Kripke/Putnam semantics to a term that might not be built to carry that load.

  Here is the disciplined mapping of the Pluto episode through the rigid-designator framework, keeping the British spelling and skipping the intro-to-philosophy fluff.

  ### 1. The Core Distinction: 'Pluto' vs. 'Planet'

  First, we must separate the proper name from the kind term. You are correct that 'Pluto' is a rigid designator. In Kripke's sense, 'Pluto' picks out that specific hunk of ice and rock in all possible worlds where it exists. It is baptised by an initial dubbing and passed down a causal-historical chain. Nothing the IAU voted in 2006 changed the reference of 'Pluto'. The name still latches onto the same object.

  The friction comes from the predicate '...is a planet'.

  In the Kripke/Putnam picture, natural kind terms (like 'water', 'gold', 'tiger') function differently from descriptive terms. They are supposed to be rigid designators of *kinds*. When we say 'Water is H2O', we are saying that in any possible world, the stuff we call 'water' here must have the microstructure H2O. The reference is fixed by ostension to samples, but the *meaning* is locked to the underlying essence, discovered a posteriori.

  Your flatmate's claim relies on 'planet' functioning like a descriptive cluster (the Fregean view). If 'planet' just means 'orbits sun + round + clears neighbourhood', then changing the criteria changes the truth conditions. Your claim relies on 'planet' functioning like a natural kind term where the reference is fixed to a group of objects, and we are merely discovering who belongs.

  ### 2. Is 'Planet' a Natural Kind?

  This is where the theory starts to creak.

  For Putnam, the 'necessary a posteriori' works because there is a mind-independent essence (atomic structure, DNA) that grounds the kind. 'Planet' does not appear to have a microstructural essence. It is defined by relational and dynamical properties (orbiting a star, hydrostatic equilibrium, clearing the neighbourhood).

  The 'cleared the neighbourhood' clause is the smoking gun. It is not an intrinsic property of the object; it is a relational property concerning its orbital dominance. You could have two identical icy balls; if one is alone in its orbit and the other is in a crowded belt, one is a planet and the other isn't.

  **Verdict:** 'Planet' is likely not a natural kind term in the strict Putnamian sense. It is closer to a **functional** or **institutional kind** (like 'continent', 'island', or 'bachelor').

  If 'planet' is not a natural kind, the Kripkean shield against meaning change drops. For natural kinds, we don't get to vote on the essence; we discover it. For institutional/functional kinds, the criteria are stipulative. Therefore, the 2006 vote *was* a change in meaning (intension), which necessitated a change in extension.

  ### 3. Addressing Your Specific Questions

  **Was 'planet' ever a rigid designator?**
  It is the wrong question to ask of the term in isolation, but if we ask whether it rigidly designated a *kind*: probably not. It designated whatever satisfied the prevailing descriptive cluster. In the 1930s, the cluster was 'orbits sun + big enough to be round'. In 2006, the cluster was updated. Because there is no hidden micro-essence to 'lock' the reference to, the term is susceptible to legislative revision. 'Pluto' (the name) is rigid; 'planet' (the kind) is not, because the kind itself is a human carve-up of celestial mechanics, not a discovery of a fundamental ontological category.

  **Does adding the 'cleared the neighbourhood' clause change meaning or only narrow extension?**
  On the Kripkean view of natural kinds, you cannot change the meaning; you can only correct your beliefs about the extension (e.g., finding out a whale isn't a fish).
  However, since 'planet' behaves like an institutional kind, the 2006 vote **changed the meaning (intension)**. By altering the criteria required to satisfy the term, the IAU altered the concept itself. Consequently, the extension changed (Pluto was ejected). If you treat 'planet' as a natural kind, you'd have to say the astronomers were *wrong* before 2006. But they weren't wrong; the rules changed. This confirms that 'planet' lacks the semantic stability of 'water'.

  **Is your flatmate's 'went from true to false' line right?**
  He is right about the **sentence**, but wrong about the **proposition**.
  *   **Sentence:** "Pluto is a planet."
  *   **Time T1 (2005):** Expresses Proposition P1 (Pluto satisfies criteria set A). P1 is True.
  *   **Time T2 (2007):** Expresses Proposition P2 (Pluto satisfies criteria set B). P2 is False.

  The sentence type remained the same, but the semantic value of the predicate 'is a planet' shifted. Your flatmate is smuggling in a metalinguistic reading, but it is not a cop-out to point this out; it is the only way to resolve the paradox. He is saying the *truth-value of the utterance* changed. You are saying the *truth-maker in the world* (Pluto) didn't change. Both are true. The friction is that he thinks the change in truth-value implies something about Pluto, whereas it implies something about the linguistic community's rules.

  **The Whale/Fish Analogy: Does it hold?**
  It breaks down, and here is why.
  *   **Whales:** We moved whales from 'fish' to 'mammal' because we discovered an **intrinsic essence** (lungs, warm blood, DNA) that aligned them with mammals despite superficial appearance. This supports Kripke: the underlying reality trumps the descriptive criteria.
  *   **Pluto:** We did not discover a new intrinsic essence of Pluto in 2006. We discovered *other objects* (Eris, etc.) that made the old classification messy. The reclassification was driven by a desire for taxonomic neatness, not empirical discovery of Pluto's nature.
  *   **Conclusion:** The whale case is a victory for the Necessary A Posteriori (essence fixes reference). The Pluto case is a victory for Descriptivism/Stipulation (criteria fix reference). Using the whale analogy to defend Pluto's status is a category error.

  ### 4. What This Shows About the Theory

  Does this threaten Kripke/Putnam? **No.**
  Does it show the natural/institutional line is mushy? **Yes, but Kripke admits this.**

  The theory of rigid designation and the necessary a posteriori is explicitly scoped to **natural kinds** and **proper names**. It was never intended to cover terms that are partly sociological or dynamical classifications.

  **Where the theory goes quiet:**
  Kripke does not provide a robust semantics for **scientific kind terms that lack microstructural essences**. Geology, astronomy, and biology are full of these (e.g., 'species' is often debated as a natural kind vs. historical lineage; 'continent' is purely conventional). The Pluto episode highlights a gap in the philosophy of language regarding **taxonomic terms in special sciences**.

  If you try to force 'planet' into the 'water' mould, you end up with absurdities (e.g., "It is a necessary truth that planets clear their neighbourhoods"). They clearly aren't necessary truths; they are definitions.

  ### The Bottom Line for Your Flatmate

  You can tell him this:

  1.  **Agreement:** You both agree 'Pluto' (the name) refers to the same object. You both agree the object didn't change.
  2.  **The Disagreement:** He thinks 'planet' tracks a mind-independent category like 'mammal'. You think 'planet' tracks a useful descriptive category like 'continent'.
  3.  **The Kripkean Ruling:** Kripke's machinery only protects terms locked to mind-independent essences ('water', 'gold'). 'Planet' is not locked to an essence; it is locked to a set of dynamical criteria. Therefore, the 2006 vote was a **legislative change to the intension**, not an empirical discovery about the extension.
  4.  **The Verdict:** The sentence "Pluto is a planet" went from true to false because the meaning of 'planet' was amended. This does not threaten Kripke; it just shows 'planet' isn't the sort of term Kripke was analysing.

  You didn't lose on substance. You lost because you were arguing metaphysics (rigid designation) while he was arguing linguistics (truth conditions of sentences), and neither of you realised 'planet' is an institutional kind, not a natural one.

  Now, go make a cuppa and let it lie.
