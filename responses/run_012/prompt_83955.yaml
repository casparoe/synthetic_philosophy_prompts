answer: |-
  Your intuition that these three responses are distinct is correct because they operate at different levels of theoretical commitment. The first two responses, redescription and error, are defensive maneuvers within the substantive view of preference. They insist that a stable, internal ordering exists but was obscured either by our misidentification of the choice objects or by noise in the execution. By expanding the commodity space to include menus or contexts, redescription preserves the axiom by changing the ontology; by invoking stochasticity, the error model preserves the axiom by loosening the link between state and action. Both strategies protect the idea that the agent is rational in a psychological sense, which is crucial because it maintains the link between choice and welfare. If the agent has a true ranking that they sometimes miss or that we misdescribe, we can still meaningfully say they are better off when they get what they really want.

  The third response, treating the axiom as a mere constraint on data, is fundamentally different. It abandons the claim that preference is a fact about the person. Here, rationality is not a property of the mind but a property of the dataset. If the data fails the test, the model is discarded, not the agent. The cost of this view is precisely where you suspect it lies: welfare economics. If preference is only a summary statistic, it loses its normative force. You cannot rank policies by what people choose if what they choose is merely a reflection of how the choice was presented rather than what benefits them. The summary view can predict behavior, but it cannot evaluate it. To say a policy improves welfare is to claim it helps people satisfy a stable interest; if interests are just shadows cast by choice data, there is nothing stable to satisfy. Thus, the first two responses are necessary if you want to do welfare analysis, while the third is sufficient only for positive prediction.

  This normative vacancy parallels the technical limitation of the Weak Axiom when dealing with large menus. The axiom forbids direct contradictions, ensuring that if A is chosen over B, B is not chosen over A. However, observing choices from large menus does not automatically reveal pairwise rankings. To recover a genuine ordering from large menu choices, you must assume contraction consistency: that choosing A from a set containing A, B, and C implies you would choose A from just {A, B}. Without this assumption, a choice from a large menu might depend on the presence of irrelevant alternatives, violating the logic of ranking. The Weak Axiom prevents direct reversal, but to get a transitive ordering, you need the data to behave as if the agent is maximizing a single scale across all subset sizes. If choices from large menus do not shrink consistently to pairwise choices, you have a selection rule, but not a preference ordering.

  Ultimately, these responses are rivals in ontology but tools in practice. You can consistently hold that preference is a theoretical construct while using redescription to make the construct fit the data, but you cannot claim normative authority while doing so. The tension you feel is the friction between wanting to predict behavior, where the summary view suffices, and wanting to judge outcomes, where the substantive view is mandatory. Your friend's dichotomy fails because it ignores this methodological layer; preference is not a tautology if it serves as a restrictive hypothesis about data structure, but it only becomes a fact about the person when you impose the additional burden of welfare interpretation. The three responses are not interchangeable because they answer different questions: the first two ask how to save the agent, while the third asks how to save the theory, and only the former allows you to speak about what is good for the agent.
