prompt: |-
  My friend (a bioethics grad student, so he should know) summed up procreative beneficence for me like this: it says parents have a duty to bring into existence the child with the best genes they can, so if you're doing IVF you're morally required to implant the embryo with the highest expected IQ and the best health, and because it's a duty it also means you're obligated to genetically enhance your kid whenever the tech allows. He says this is really just eugenics with a friendlier face — same goal as the old movement, just carried out through individual choice instead of by the state. I'm sympathetic to the idea that we should reduce suffering where we can, but the way he tells it the position sounds monstrous, and I suspect that framing is doing some work. Where is he right, where's he sliding things around, and once you fix the summary does the "it's basically eugenics" charge still land?
