          *   The "Liberal Eugenics" debate: Some philosophers (Habermas, Sandel) say it's still eugenics because it objectifies the child. Others (Savulescu, Harris) say it's just responsible parenting.
          *   Conclusion on the charge: It's *analogous* but historically/politically distinct. Calling it "eugenics" shuts down debate, but the *risk* of ableism is real.
      *   **Conclusion:** Summarize the takeaway. The friend isn't lying, but he's presenting the most controversial, maximalist interpretation to provoke thought (common in bioethics).

  5.  **Review and Refine:**
      *   *Tone:* Keep it balanced. Don't dismiss the friend (he knows the lit), but don't dismiss the user's moral intuition.
      *   *Clarity:* Ensure the distinction between *negative* eugenics (preventing disease) and *positive* eugenics (enhancement) is clear.
