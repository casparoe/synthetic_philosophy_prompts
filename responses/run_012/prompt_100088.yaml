      *   **Task:** Evaluate where the friend is right, where he's sliding things around (misrepresenting), refine the summary, and assess the "eugenics" charge against the corrected version.

  2.  **Deconstruct the Friend's Summary (Fact-Checking PB):**
      *   *Claim 1: "Duty to bring into existence the child with the best genes they can."*
          *   *Nuance:* Savulescu's principle is about selecting the *embryo* expected to have the "best life," not necessarily just "best genes." It's about well-being, not just genetic purity. Also, it's usually framed as a *moral obligation*, but the strength of that obligation is debated (strong vs. weak).
      *   *Claim 2: "Highest expected IQ and best health."*
          *   *Nuance:* Savulescu focuses on "open future" and well-being. Health is definitely in. IQ is more contentious. Savulescu argues for traits that increase the chance of a good life, but he acknowledges the difficulty in defining "best." He often uses disease avoidance as the clear case, enhancement as the theoretical extension.
      *   *Claim 3: "Obligated to genetically enhance your kid whenever the tech allows."*
          *   *Nuance:* This is the logical extension of PB, but Savulescu often distinguishes between *selection* (IVF/PGD) and *modification* (GERM). PB applies to selection primarily. Enhancement is a downstream implication, but the "whenever tech allows" ignores safety, cost, and autonomy constraints.
      *   *Claim 4: "It's basically eugenics."*
          *   *Nuance:* This is the big philosophical charge. Old eugenics was state-coerced, racist, ableist, and focused on population genetics. PB is individual, liberal, focused on the welfare of the future child. The *outcome* might look similar (fewer disabled people), but the *mechanism* and *justification* differ.

  3.  **Identify the "Sliding Around" (Misrepresentations/Overstatements):**
      *   **Genes vs. Well-being:** PB is about the *life* the child will have, not just the genetic code. Environment matters.
      *   **Selection vs. Modification:** PB was originally formulated around embryo *selection* (PGD), not necessarily germline *editing* (though it supports it). The friend conflates them.
      *   **Maximalism:** The friend implies you must pick the *absolute* best. Savulescu acknowledges epistemic limits (we don't know what the "best" life is).
      *   **Eugenics Definition:** The friend uses a consequentialist definition (outcome = fewer disabled people) rather than a deontological/historical one (coercion, state control).

  4.  **Drafting the Response - Section by Section:**

      *   **Introduction:** Acknowledge the friend's expertise (bioethics grad student) but validate the user's suspicion that the summary is provocative/simplified. State the core principle (Savulescu's Principle of Procreative Beneficence).
      *   **Where the Friend is Right:**
          *   It *is* a moral obligation (not just permissible).
          *   It *does* imply selecting against disability and for enhancement traits if they contribute to well-being.
          *   There *is* a structural similarity to eugenics (reducing certain traits in the population).
      *   **Where the Friend is "Sliding Things Around" (The Nuance):**
          *   *Well-being vs. Genes:* It's about the "best life," not just "best DNA."
          *   *Selection vs. Engineering:* PB started with IVF/PGD (choosing from existing options), not creating designer babies from scratch.
          *   *Epistemic Humility:* We don't actually know which genes = best life (IQ is complex). Savulescu admits this limits the duty.
          *   *The "Duty" Strength:* Is it a strict duty or a pro tanto duty (can be overridden by other concerns)?
      *   **Refining the Summary:** Create a more accurate, charitable version of PB.
      *   **Addressing the Eugenics Charge:**
