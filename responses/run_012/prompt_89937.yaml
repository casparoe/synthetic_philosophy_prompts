      *   **Task:** Analyze the four moves (1-4) made by Dev and Maya. Rate each move (mistaken to right) with justification. Identify who is right about what and where they miss something. Finally, declare who is "more right overall" (if forced) and explain why.
      *   **Tone:** Intellectual, nuanced, respectful of the complexity (since the user is a novelist dealing with human complexity), but decisive enough to provide clarity.

  2.  **Deconstruct the Arguments (Philosophical Context):**
      *   This is a classic formulation of the **Non-Identity Problem** (Parfit) and the **Asymmetry Argument** (Benatar).
      *   **Dev's Position:** Antinatalist leanings / Asymmetry view. Focus on harm avoidance. We have a duty not to create suffering, but no duty to create happiness.
      *   **Maya's Position:** Pro-natalist / Symmetry view. Focus on potential benefit. Denying existence is a loss of potential good.
      *   **The Specific Case:** 20% risk of "genuinely hard" life vs. 80% chance of "ordinary good" life.

  3.  **Analyze Each Move:**

      *   **Move (1) Dev:** *Argument:* 1/5 risk is too high for severe suffering. You are responsible for the harm if it happens. "I couldn't be sure" isn't an excuse if you knew the odds.
          *   *Assessment:* Strong intuitive appeal. Highlights parental responsibility. However, implies a threshold of risk that makes procreation impossible (all life has risks).
          *   *Rating:* Plausible/Strong, but potentially overgeneralized.
          *   *Philosophical Anchor:* Non-maleficence (do no harm).

      *   **Move (2) Maya:** *Argument:* 4/5 chance of good life is huge. Not having the kid denies a potential person a good life. Analogy: Not flying due to crash risk.
          *   *Assessment:* The "loss" argument is tricky (who loses?). The plane analogy is weak (existing passengers vs. potential passengers).
          *   *Rating:* Intuitively appealing but logically vulnerable on the "loss" claim.
          *   *Philosophical Anchor:* Beneficence / Utilitarian calculation.

      *   **Move (3) Dev:** *Argument:* The Asymmetry. Harm requires a victim (the suffering child). Benefit requires a beneficiary (none if not born). You can wrong someone by creating them in pain; you can't wrong someone by not creating them.
          *   *Assessment:* This is David Benatar's core argument. It's philosophically robust but counter-intuitive to some. It distinguishes between duties to existing people vs. potential people.
          *   *Rating:* Philosophically strong (the standard asymmetry view).
          *   *Philosophical Anchor:* The Asymmetry (Benatar/Parfit).

      *   **Move (4) Maya:** *Argument:* Symmetry counter. If existence can be bad (wronged), it can be good. If not existing is neutral, then existing must be neutral. Dev pivots to "duty/owe." Maya attacks the threshold ("terrible").
          *   *Assessment:* Maya catches a logical tension but maybe misinterprets the asymmetry. Dev's pivot to "duty" is the standard defense. Maya's point about "terrible" is valid (sorites paradox).
          *   *Rating:* Maya's logical trap is clever but misses the point of the asymmetry. Her point on "terrible" is strong.
          *   *Philosophical Anchor:* Critique of Asymmetry / Vagueness objection.

  4.  **Evaluate "Who is More Right?":**
      *   This is the hardest part. In philosophy, there is no consensus. However, in *practical ethics* regarding a 20% risk of *severe* suffering, Dev's caution usually carries more weight in bioethics than Maya's potentiality argument.
      *   Dev's asymmetry argument is the dominant framework in non-identity problem literature (Parfit/Benatar).
      *   Maya's "loss of potential" argument is generally considered weaker because "potential people" have no rights.
      *   *However*, Dev's definition of "terrible" is the weak point. Is this condition "life not worth living" or just "hard"? The prompt says "genuinely hard — a lot of pain and medical stuff." It doesn't explicitly say "not worth living."
      *   *Decision:* Dev is more right on the *structure* of the moral obligation (harm avoidance > benefit creation), but Maya is right that the *threshold* matters. If the life is still worth living (net positive), Dev's hardline stance weakens.
      *   *Verdict:* Dev is slightly more right on the ethical framework, but the specific medical facts (which are vague in the prompt) determine the final answer. I need to lean one way for the user. Dev's caution regarding *imposing* suffering is ethically safer than Maya's gamble with *another's* body/life.

  5.  **Drafting the Response:**
      *   *Introduction:* Acknowledge the depth of the debate (Non-Identity Problem). Validate the user's confusion (philosophers haven't solved this).
      *   *Move-by-Move Analysis:*
          *   (1) Dev: Right on responsibility, wrong on risk absolutism.
          *   (2) Maya: Wrong on the "loss" metaphysics, right on the probability weight.
          *   (3) Dev: Right on the Asymmetry (the strongest philosophical move).
          *   (4) Maya: Right on the vagueness of "terrible," wrong on the symmetry logic.
      *   *Overall Judgment:* Dev wins on the *ethics of imposition*, Maya wins on the *value of potential*.
      *   *The "Novelist" Angle:* Frame this in terms of character motivation and moral weight.
      *   *Final Verdict:* Dev is more right, primarily because of the *non-consensual* nature of the gamble.

  6.  **Refining the Ratings:**
      *   Avoid binary "Right/Wrong." Use "Mostly Right," "Partially Mistaken," etc.
      *   Ensure the justification explains *why* (e.g., referencing the Non-Identity Problem without getting too jargon-heavy).

  7.  **Self-Correction/Nuance Check:**
      *   *Wait,* did Dev say the suffering kid is "wronged"? Yes.
      *   *Did* Maya catch him? Yes, she said if existing can be bad, it can be good.
      *   *Is* Maya right there? Benatar argues no. The absence of pain is good (even if no one enjoys it), but the absence of pleasure is not bad (unless someone is deprived). This is subtle. I should explain this distinction.
      *   *Maya's Plane Analogy:* This is actually a category error. Flying risks an *existing* person. Procreation risks a *new* person. Dev was right to reject it.
      *   *The "Terrible" Threshold:* This is Maya's strongest point. If the life is hard but *worth living*, Dev's argument collapses into pure risk aversion.

  8.  **Final Polish:** Check tone. Keep it engaging for a writer. Use clear headings. (Proceed to generate output based on these thoughts).

      *   *Key Philosophical Concepts to weave in lightly:* Non-Identity Problem, Asymmetry, Harm vs. Benefit, Consent.
