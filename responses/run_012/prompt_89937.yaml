answer: |-
  This is a classic formulation of the **Non-Identity Problem** and the **Asymmetry Argument** in population ethics. Philosophers have been wrestling with this specific puzzle for fifty years without a consensus, so please forgive yourself for not solving it over wine. Your friends have stumbled into deep meta-ethics.

  Here is the move-by-move breakdown, rated on philosophical robustness and intuitive plausibility.

  ### Move (1): Dev's Risk Assessment
  **Dev:** *One in five is a huge number when the downside isn't yours to carry... "I couldn't be sure" isn't much of a defense when you knew the odds perfectly well.*

  *   **Rating:** **Mostly Right.**
  *   **Justification:** Dev is appealing to the principle of **non-maleficence** (do no harm). In medical ethics and parenting, we generally accept that you cannot gamble with another person's welfare for their own potential benefit, especially without their consent. If you knowingly impose a 20% risk of severe suffering on someone else, you bear moral responsibility for that suffering if it materializes.
  *   **Where Dev misses:** Dev treats the risk as absolute veto. By this logic, almost no one should have children, as *every* conception carries some risk of genetic anomaly, trauma, or hardship. Dev needs a threshold for "acceptable risk," which they haven't defined yet.

  ### Move (2): Maya's Potentiality Argument
  **Maya:** *Four in five is also a huge number... If Jo doesn't have the kid, a person who would have been glad to be alive never gets to exist at all... refusing is like never getting on a plane because planes sometimes crash.*

  *   **Rating:** **Partially Mistaken.**
  *   **Justification:** Maya is appealing to **beneficence** (do good) and utilitarian calculation (maximize happiness). She is right that an 80% chance of a good life is statistically favorable. However, her metaphysics are shaky. You cannot deprive a non-existent person of a good life. There is no "person" waiting in the wings to feel the loss of non-existence.
  *   **Where Maya misses:** The plane analogy is a category error. When you don't get on a plane, *you* (an existing person) miss out on the destination. When you don't have a child, *no one* misses out on the life. She is conflating "loss to the parent" (who might want a grandchild) with "loss to the child" (which is incoherent).

  ### Move (3): Dev's Asymmetry Argument
  **Dev:** *You can wrong a person by bringing them into a bad life; you can't wrong a person by declining to bring them into a good one, because there's no person there to wrong.*

  *   **Rating:** **Clearly Right (Philosophically).**
  *   **Justification:** This is the strongest move in the debate. It is known as the **Asymmetry Argument** (most famously articulated by philosopher David Benatar). It posits that the presence of pain is bad, but the absence of pain is good (even if no one enjoys that absence). Conversely, the presence of pleasure is good, but the absence of pleasure is *not bad* (unless there is someone deprived of it). Therefore, we have a duty to avoid creating suffering, but no duty to create happiness.
  *   **Where Dev misses:** It relies on the assumption that the "bad life" is indeed a life that *should not have been lived.* If the life is hard but still net-positive (worth living), the asymmetry becomes less potent.

  ### Move (4): Maya's Symmetry & Vagueness Counter
  **Maya:** *If existing can be bad for you, it can be good for you... Dev can't say where ordinary hardship ends and terrible begins.*

  *   **Rating:** **Mixed (Right on Vagueness, Wrong on Symmetry).**
  *   **Justification:** Maya is right to attack the definition of "terrible." This is the **Sorites Paradox** (heap problem). If a life with a broken leg is worth living, and a life with cancer is worth living, where exactly does it become "not worth living"? Dev's argument collapses if the condition is merely "hard" rather than "horrific." However, she is wrong about the symmetry. Just because existence *can* be bad (harm) doesn't mean non-existence *can* be bad (harm). Harm requires a subject; non-existence precludes a subject.
  *   **Where Maya misses:** She thinks she has trapped Dev in a logical contradiction, but Dev's pivot to "what we owe" is the correct ethical escape hatch. We owe duties to subjects, not to concepts.

  ***

  ### Who is right about what?

  **Dev is right about Responsibility.**
  Dev correctly identifies that procreation in this context is a non-consensual imposition. Jo is making a gamble where the chips belong to the child. If the child loses, they pay the price. If the child wins, they merely break even (they get a normal life they would not have missed otherwise). The moral weight of imposing suffering outweighs the moral weight of denying potential happiness.

  **Maya is right about Value.**
  Maya correctly identifies that a life with hardship can still be deeply valuable and loved. She is right to resist the idea that a 20% risk automatically vetoes existence. Many people with chronic pain or disability report lives that are joyful and meaningful. To assume the "hard life" is a net negative is ableist unless the suffering is truly unbearable.

  **Dev is missing the Threshold.**
  Dev argues as if the 20% risk is of a life *not worth living*. If the condition is "genuinely hard" but the person is still glad to be alive, Dev's argument weakens significantly.

  **Maya is missing the Subject.**
  Maya argues as if the potential child has a right to be born. They do not. There is no victim in non-existence.

  ***

  ### The Verdict: Who is more right overall?

  If I have to choose, **Dev is more right.**

  Here is why: In ethics, the **duty to avoid harm** generally trumps the **duty to provide benefit**.

  Maya's argument requires us to believe that non-existence is a loss. But for it to be a loss, there must be someone to experience the loss. Since there is no one, the "loss" is theoretical. Dev's argument, however, deals with actual, visceral suffering. If Jo rolls the dice and the child lands in the 20%, that child is a real person experiencing real pain that could have been prevented.

  Dev's position is the "safer" moral bet. It prioritizes the welfare of the actual, suffering child over the abstract potential of the happy child. Maya's position asks Jo to gamble with another person's nervous system for the chance of a good outcome. While 80% odds are good, in moral philosophy, you generally don't get to subject another being to a 1-in-5 chance of severe agony just to give them an 80% chance of a normal life they didn't ask for.

  **The Novelist's Take:**
  Dev wins on **ethics**, but Maya wins on **humanity**.
  Dev's logic is cleaner, but Maya's captures the human drive to hope and create despite risk. If you are writing these characters, Dev is the one who sleeps safely at night knowing they prevented pain. Maya is the one who sleeps wondering what beautiful person was never born. Dev is morally more defensible; Maya is emotionally more resonant.

  For the specific question of *advice to Jo*, Dev's caution is the more responsible counsel.
