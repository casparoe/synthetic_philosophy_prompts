answer: |-
  This tree maps responses to the Wrong Kind of Reasons problem by sorting intuitions about reasons, value, and attitudes.

  **1. The Nature of the Threat**
  Does the demon's threat make admiring him rational *in itself*, or does it only make it beneficial *to want or cause* yourself to admire him?
  *   **Only beneficial to want/cause:** Go to **Pragmatic Instrumentalism**.
  *   **Rational in itself:** Go to 2.

  **2. The Meaning of Value**
  When you say the demon "isn't admirable," do you mean there are no reasons to admire him, or that admiring him isn't *fitting/merited* (even if reasons exist)?
  *   **No reasons:** Go to 3.
  *   **Not fitting/merited:** Go to 4.

  **3. Restriction Strategy**
  If "admirable" means "there are reasons to admire," can you exclude the demon's reason by appealing to a principled distinction (e.g., object-grounded) without simply defining "right kind" as "those that make him admirable"?
  *   **Yes, principled:** Go to **Restrictivist Buck-Passing**.
  *   **No, circular/none:** Go to **Analysis Abandonment**.

  **4. Fittingness Basis**
  If "admirable" means "fitting," is this fittingness property ultimately explained by reasons of the right kind, or is it a primitive normative relation independent of reasons?
  *   **Explained by reasons:** Go to **Reductive Fitting-Attitude Analysis**.
  *   **Primitive/Independent:** Go to **Non-Reductive Fittingness**.

  **5. Scope Uniformity**
  Does the pragmatic reason case for belief (e.g., a pill that pays you to believe) function identically to the admiration case?
  *   **Yes:** Add **Uniformism** to your position.
  *   **No:** Add **Separatism** to your position.

  ***Note:** The distinction between Restrictivist Buck-Passing and Reductive Fitting-Attitude Analysis is often blurred; both equate value with right-kind reasons, differing mainly on whether the restriction is prior to or posterior to the analysis.*

  | Position | Most Awkward Commitment |
  | :--- | :--- |
  | **Pragmatic Instrumentalism** | Denies threats provide reasons *for* attitudes (counterintuitive to many). |
  | **Restrictivist Buck-Passing** | Struggles to define "right kind" without circularity. |
  | **Analysis Abandonment** | Concedes value cannot be analyzed via attitudes/reasons. |
  | **Reductive FA** | Must explain fittingness without invoking value itself. |
  | **Non-Reductive Fittingness** | Posits primitive normative properties (ontologically costly). |
  | **Separatism** | Must explain why belief and admiration differ normatively. |

  **Unoccupied Combinations**

  *   **Threat gives reason *for* + Admirable = Reasons + No restriction needed.**
      *   *Diagnosis:* Incoherent (accepts the counterexample but denies the need to solve it).
  *   **Non-Reductive Fittingness + Uniformism.**
      *   *Diagnosis:* Unexplored (epistemologists rarely posit primitive fittingness over evidence-based accounts).
  *   **Pragmatic Instrumentalism + Uniformism.**
      *   *Diagnosis:* Unattractive (implies belief is never directly reason-responsive to pragmatic stakes).
