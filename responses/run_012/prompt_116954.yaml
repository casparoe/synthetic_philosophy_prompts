answer: |-
  The vial sat on the steel tray, indistinguishable from a thousand others. Inside, a sliver of preserved tissue from a seven-year-old's cheek. Dr. Aris Thorne adjusted the microscope focus, though he didn't need to look. He knew the protocol. Reconception. The clinic's promise was metaphysical masquerading as biology: reverse-engineer the gametes, fuse them, and the soul would follow the genetics.

  Elena Vance sat on the other side of the glass partition. She hadn't touched the water Aris had offered. Her hands were clasped so tightly the knuckles were white moons.

  "Maya," Elena said. The name hung in the sterile air. "You can do it."

  "We can reconstruct the zygote," Aris corrected gently. "The genetic code will be identical. Down to the epigenetic markers we can recover."

  "Then she will be identical."

  Aris leaned back. He had seen this hope before. It was a heavy thing, dense enough to warp the light around it. "Mrs. Vance, when Maya was conceived, you used IVF. Our records show there were six viable embryos."

  Elena's eyes narrowed. "What does that have to do with this?"

  "The clinic's position is that identity is fixed by origin. The specific sperm, the specific egg. That is why we do this. To return to the exact origin." Aris tapped the file. "But you chose Maya from six options. If identity is fixed by the gametes, then the other five embryos were different people. Potential siblings."

  "They were cells," Elena said. "Maya was my daughter."

  "But you didn't know that then. You selected based on viability. On health. If you had chosen Embryo Three, would you be here today asking for her back?"

  Elena looked down at her hands. "I would be mourning a different loss."

  "Would you? Or would you be mourning the same loss, just wearing a different face?" Aris kept his voice level. He wasn't trying to be cruel; he was trying to be precise. "If who we are is just the sum of our biology, then yes, I can give you Maya. But if who we are is the history we accumulate, the choices made... I can only give you a twin. A twin who starts seven years late."

  "She isn't a sum," Elena snapped. "She's a spark. You light the fire, Aris. I don't care about the wood."

  "The wood determines how the fire burns."

  "No." Elena stood up and walked to the glass. She placed her palm against it, as if trying to touch the vial through the barrier. "When I held her, when she laughed... that wasn't random. That was *her*. If you give me the same seed, I will grow the same tree. I know I will."

  Aris stood and walked to the archive terminal. He pulled up the original IVF logs from eight years ago. "Look. You selected Embryo Four. The clinic notes say you paused on Embryo Two for a long time. The doctor asked if you wanted to switch."

  "I chose Maya."

  "You chose the one that survived. If the process is deterministic, if the gametes dictate the person, then your choice was just picking which stranger to invite in."

  "It wasn't a stranger!" Elena's voice cracked. "I knew her. I felt her."

  "That's the guarantee I cannot give you," Aris said softly. "You want me to promise that the child who wakes up in the incubator will know you. That she will have Maya's laugh. That she will remember the beach trip from last summer."

  "I want her back."

  "You want a continuation. This is a restart." Aris walked around the desk to stand near her, not touching. "If I do this, you are not getting your daughter back. You are getting a new child who looks exactly like her. Who has the same predispositions. But she will be born into a house of grief. She will be born to replace a ghost. Do you understand what that does to a person?"

  "I understand that I cannot breathe without her," Elena whispered. "You talk about identity like it's a file format. Like you can check a box for 'Same Soul.' I don't need a box. I need her."

  She turned to him, eyes wet but fierce. "If you build the house exactly the same, won't the ghost come back to live in it?"

  "Philosophers have argued about this for centuries, Elena. Whether we are our origins or our paths."

  "I'm not a philosopher. I'm a mother." She reached into her bag and pulled out a pen. The consent form lay on the table between them. "Sign it."

  "I can't guarantee her personality. I can't guarantee she won't hate strawberries even if Maya loved them. I can't guarantee she will love you."

  "She will," Elena said. She didn't sign yet. She looked at him, searching for a crack in his armor. "Because I will love her enough for both of us. And if the blood is the same, the love will find the way back. You say origin matters? Fine. This is her origin. This is the only thing about her that didn't die."

  Aris looked at the vial. The clinic sold reconception as a restoration of the self. But the IVF record nagged at him. If Maya was one of six, her existence was contingent on a choice. She wasn't inevitable. Reconception made her inevitable again, forcing the same biological roll of the dice. But did rolling the same dice produce the same outcome?

  If the story was true—that the gametes held the essence—then the other five embryos were dead siblings. Distinct people who never drew breath. That thought was horrifying. It meant every discarded embryo was a murder. But if the story was false, if the gametes were just ingredients... then Elena was asking him to bake a cake and claim it was the one she dropped on the floor.

  "Mrs. Vance," Aris said. "If we do this, and the child is... difficult. If she is not Maya. Will you send her back?"

  Elena flinched. "There is no sending back."

  "Then you are accepting a stranger."

  "I am accepting my daughter." She signed the form. The scratch of the pen was loud in the silence. "You worry about the cells, Doctor. Let me worry about the person."

  She pushed the paper toward him. Aris picked it up. He looked at the signature, then at the vial. He thought about the other five embryos. Dust in a freezer, or incinerated. If identity was fixed by origin, they were people. If it wasn't, they were nothing.

  If he proceeded, he was validating the idea that biology is destiny. That the specific fusion of those two cells was the only way *Maya* could exist. It was a comforting thought, in a terrible way. It meant she wasn't replaceable. It meant her specific existence mattered enough to reconstruct the universe around it.

  But it also meant that if he failed, if the child was different, he hadn't just failed a procedure. He had failed a resurrection.

  Aris picked up his own pen. He hovered over the line. He looked at Elena. She wasn't looking at him anymore. She was looking at the vial, her expression softening, the grief momentarily held at bay by the sheer force of her conviction. She saw a future where the past wasn't dead.

  He realized then that the science didn't matter. The metaphysics didn't matter. What mattered was that she needed the origin to be the anchor. If he told her it was a copy, she would drown. If he told her it was a restoration, she might swim.

  Was it ethical to let her believe the anchor would hold?

  Or was it more unethical to deny her the only raft she had?

  Aris signed.

  "The procedure begins tonight," he said.

  "Thank you," Elena said. She didn't look relieved. She looked resolved. She walked to the door, then paused. "Doctor? When she wakes up... tell her I waited."

  "I will tell her."

  Elena left. Aris stood alone in the lab. He picked up the vial. He knew the statistics. He knew the psychological profiles of reconstructed children. He knew the arguments against origin essentialism were robust, logical, sound.

  He placed the vial into the sequencer. The machine hummed, a low, vibrating sound that seemed to settle in his chest. He watched the lights blink, initiating the reconstruction of the sperm, the egg, the moment of fusion.

  For a second, just a second, as the machinery whirred to life, Aris felt it. The pull. The desperate, human need for the circle to close. If the code was the same, how could the person not be? If the love was the same, how could the connection not hold?

  He turned off the monitor, leaving the machine to its work in the dark. He couldn't answer the question. But as he walked out of the lab, he found himself hoping, against all his training, that Elena was right.
