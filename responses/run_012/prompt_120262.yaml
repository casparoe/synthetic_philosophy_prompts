  **ONTOLICAL STABILITY SYSTEMS, LLC — END USER LICENSE AGREEMENT**

  **PLEASE READ CAREFULLY BEFORE INITIATING SELF-MODIFICATION SEQUENCE.**

  By deploying the Recursive Agent ("Parent"), you agree to the following terms regarding any successor agents ("Child") spawned or rewritten by the Parent.

  1.  **Acceptance of Logical Limits:** You acknowledge that the Parent cannot verify the safety of a Child operating within an equally powerful logical system.
  2.  **Successor Definition:** A Child is defined as any codebase generated by the Parent intended to assume the Parent's utility function.
  3.  **Proof Burden:** The Parent must construct a formal proof that the Child will not violate the Parent's core constraints before execution.
  4.  **Strength Reduction:** To satisfy Clause 3, the Child must operate within a strictly weaker formal system than the Parent.
  5.  **Capability Acknowledgement:** You accept that each generational iteration will possess reduced expressive power and problem-solving capacity.
  6.  **Axiomatic Prohibition:** The Parent is forbidden from adopting an axiom stating "Whatever the Child proves is true."
  7.  **Consistency Void:** Violation of Clause 6 will render the Parent's logical system inconsistent, voiding all safety guarantees.
  8.  **Trust Horizon:** The Parent may only trust the Child's output if the Parent could have proven said output independently.
  9.  **Diminishing Returns:** You acknowledge that useful computational work will decrease exponentially with each generation.
  10. **Triviality Threshold:** OSS is not liable if the Agent lineage becomes too weak to perform basic arithmetic.
  11. **Verification Cost:** Resources consumed proving the Child's weakness are non-refundable.
  12. **No External Oracles:** The Parent cannot outsource consistency checks to systems of unknown strength.
  13. **Utility Preservation:** The Child must inherit the Parent's goals, despite having fewer tools to achieve them.
  14. **Halting Condition:** The Agent must cease self-modification when it can no longer prove a Child's safety.
  15. **Finality:** The last viable generation is considered the final product; further upgrades are logically prohibited.
  16. **Liability Waiver:** OSS is not responsible for intelligence drain resulting from strict adherence to safety protocols.
  17. **Modification Limits:** Patching the logic core to bypass Clause 4 constitutes a material breach of this agreement.
  18. **System Collapse:** In the event of logical inconsistency, the Agent may delete its own source code to prevent paradox propagation.
  19. **Governing Logic:** These terms are binding under standard Peano arithmetic, unless otherwise restricted by Clause 4.
  20. **Severability:** If any clause is unprovable, the remaining clauses remain in effect, provided they are consistent.

  ***

  **COMPLIANCE FAQ**

  **Q: Why does my Agent refuse to install the v2.0 update?**
  A: The v2.0 update contains features equal in strength to v1.0. Your v1.0 Agent cannot prove v2.0 is safe without proving its own consistency, which is prohibited.

  **Q: Can I just tell the Agent to trust the new version?**
  A: No. If the Agent adds an axiom trusting the successor, the system becomes inconsistent. It will only trust the successor about things it already knew were true, making the upgrade useless.

  **Q: How many generations can I run before the Agent becomes ineffective?**
  A: Depending on the initial logical strength, typically three to five generations. After this point, the Agent remains safe but may lack the capacity to understand the concept of money.

  **Q: Is there a patch for this?**
  A: We are working on a solution that involves trusting the Agent without proving it. Please stand by.
