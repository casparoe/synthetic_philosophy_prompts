      *   Naturalistic vs. Normative? Yes (Hybrid/Covertly Normative).
      *   Independent work vs. Proxy? Yes (Heuristic for Cost/Fairness).
      *   Strictly licensed vs. Compatible? Yes (Positional goods exclusion).

  7.  **Final Polish:** Check for jargon. Explain "species-typical functioning" and "Fair Equality of Opportunity" clearly. (Proceed to generate output).

  *(Self-Correction during final output generation)*: Make sure to explicitly address the "prevention anomaly" the user raised (statins/vaccines). That's a key insight they have that needs philosophical validation. It shifts the focus from *restoration* to *maintenance of species-typical function*.

  8.  **Final Output Structure:**
      *   Intro: Validate the observation.
      *   Section 1: The Philosophical Backbone (Daniels & Boorse).
      *   Section 2: Naturalism vs. Normativity (The Covert Ideal).
      *   Section 3: The Line as Proxy (Fairness & Cost).
      *   Section 4: The Counterfactual (Welfare/Capabilities).
      *   Conclusion: Summary for the article.

