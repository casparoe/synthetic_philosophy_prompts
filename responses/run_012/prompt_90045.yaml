prompt: |-
  I'm a science journalist working on a feature about how hospitals and insurers draw the line between therapy and enhancement. Many hospitals and insurers effectively use what could be called a baseline-restoration rule: an intervention is covered when it returns a patient to a previous or species-typical level of functioning, and is presumptively excluded when it would push someone above that level. So growth hormone is covered for a child with a diagnosed deficiency but not for a short healthy child; antidepressants are covered for major depression but scrutinized for mood enhancement; and the same institutions will authorize preventive interventions, such as statins or vaccines, that don't restore any prior baseline at all. What philosophical commitments does this policy presuppose about disease, normal function, and the aims of medicine? Does it require a naturalistic, value-neutral account of disease, or does it covertly rely on a normative ideal of the healthy person? Is the therapy/enhancement line doing independent work, or is it a proxy for worries about fairness, authenticity, and medical hubris? And which parts of the policy are strictly licensed by that line rather than merely compatible with it—what would have to change if the committee replaced it with a straightforward welfare or capabilities criterion?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the Prompt:**

      *   **Role:** Science Journalist (needs depth, nuance, clarity, and actionable insights for a feature article).
      *   **Topic:** The therapy/enhancement distinction in hospital/insurer policy (specifically the "baseline-restoration rule").
      *   **Key Observations:**
          *   Covered: Growth hormone for deficiency (restoration).
          *   Not Covered: Growth hormone for short healthy child (enhancement).
          *   Covered: Antidepressants for major depression (restoration).
          *   Scrutinized: Antidepressants for mood enhancement (enhancement).
          *   *Anomaly:* Covered: Statins/Vaccines (prevention, no prior baseline to restore).
      *   **Core Questions to Address:**
          1.  What philosophical commitments does this policy presuppose (disease, normal function, aims of medicine)?
          2.  Does it require a naturalistic/value-neutral account, or a normative ideal?
          3.  Is the therapy/enhancement line doing independent work, or is it a proxy for other worries (fairness, authenticity, hubris)?
          4.  Which parts of the policy are *strictly licensed* by that line vs. merely *compatible*? What changes if switched to a welfare/capabilities criterion?

  2.  **Initial Brainstorming & Philosophical Mapping:**

      *   *The "Baseline-Restoration Rule":* This sounds like Norman Daniels' "Fair Equality of Opportunity" (FEO) account. Daniels argues medicine's goal is to maintain normal species functioning to protect opportunity ranges.
      *   *The Prevention Anomaly:* Vaccines and statins don't restore a *past* baseline, but they protect the *species-typical* baseline from future deviation. This suggests the "baseline" isn't necessarily *individual historical*, but *species-typical normative*.
      *   *Naturalism vs. Normativism:* Boorse's Biostatistical Theory (BST) is naturalistic (function = statistical contribution to survival/reproduction). But "short healthy child" vs. "growth deficiency" implies a judgment about what counts as a dysfunction vs. normal variation. That's often normative.
      *   *Proxy Worries:* Cost is the elephant in the room. But also fairness (leveling up vs. leveling down), authenticity (is this *me*?), and hubris (playing God).
      *   *Welfare/Capabilities:* If we switched to maximizing well-being (utilitarian) or capabilities (Sen/Nussbaum), many enhancements might be covered if they increase overall welfare, potentially blowing up budgets.

  3.  **Drafting the Response - Section by Section:**

      *   **Introduction:** Acknowledge the journalist's sharp observation. Validate the "baseline-restoration" concept but refine it (it's often "species-typical" not just "individual historical").
      *   **1. Philosophical Commitments (Disease & Function):**
          *   Need to discuss the *Biostatistical Theory* (Boorse) vs. *Normativist* views.
          *   The policy leans on a hybrid: It uses biological stats (species-typical) but applies them normatively (opportunity).
          *   Reference Norman Daniels. This is crucial for a journalist. His "Fair Equality of Opportunity" is the standard bioethical defense of this distinction.
          *   Address the prevention anomaly: It's about *protecting* the species-typical function, not just restoring individual history.
      *   **2. Naturalistic vs. Normative:**
          *   It *claims* to be naturalistic (objective disease), but it *relies* on normative judgments (what counts as a "deficiency" vs. "variation").
          *   Example: Short stature. Biologically, it might be normal variation. But medically, it's treated as a defect *if* it falls below a cutoff. That cutoff is social/normative.
          *   So, it covertly relies on a normative ideal of the "healthy person" (one who can compete for social offices).
      *   **3. Independent Work vs. Proxy:**
          *   Does the line do work? Yes, it provides an administrative heuristic.
          *   Is it a proxy? Yes, largely for *cost containment* and *fairness*.
          *   Fairness: Enhancements create arms races (positional goods). Therapy levels the playing field.
          *   Authenticity/Hubris: Less central to insurers, more to ethicists/public, but influences policy (e.g., cognitive enhancers).
      *   **4. Strictly Licensed vs. Compatible (The Counterfactual):**
          *   This is the trickiest part. What *must* be excluded by the therapy/enhancement line that a welfare model would include?
          *   *Welfare Model:* If a drug makes you happier/smarter and saves money long-term, cover it.
          *   *Therapy Model:* Excludes it even if beneficial, because it's "above baseline."
          *   *Strictly Licensed:* The exclusion of *positional enhancements* (e.g., height for basketball) is licensed by FEO. A welfare model might cover them if they increase happiness.
          *   *Prevention:* Fits both, but fits FEO better (protecting opportunity).
          *   *Change:* Switching to welfare would collapse the distinction. Insurers would have to calculate net utility, not just diagnose pathology.

  4.  **Refining and Polishing:**

      *   *Tone:* Professional, analytical, suitable for a journalist (provide names, theories, and clear distinctions).
      *   *Clarity:* Ensure the distinction between "individual historical baseline" and "species-typical baseline" is clear, as the prompt notes the prevention anomaly which contradicts a purely historical baseline.
      *   *Key Names:* Norman Daniels (essential), Christopher Boorse (Biostatistical Theory), Daniel Callahan (cost/aims of medicine), Julian Savulescu (pro-enhancement counterpoint).
      *   *Structure:* Use headings corresponding to the user's questions for readability.

  5.  **Self-Correction/Nuance Check during Drafting:**

      *   *Correction:* The prompt says "returns a patient to a previous OR species-typical level." I need to make sure I don't get hung up on the "previous" part because vaccines don't fit "previous." I need to emphasize the *species-typical* aspect as the dominant philosophical driver.
      *   *Nuance:* Acknowledge that insurers are pragmatic. The philosophy often comes *after* the economic decision to justify it. But the question asks about the *commitments presupposed*, so I must treat the policy as if it has philosophical coherence.
      *   *The "Prevention" Point:* This is the strongest evidence against a purely "restorative" view. It supports a "protective of normal function" view. I need to highlight this distinction.

  6.  **Final Review against Prompt:**

