answer: |-
  This is an exceptionally sharp observation. You have identified the operational logic of modern bioethics and health economics, often without the institutions themselves fully articulating it. The "baseline-restoration rule" you describe is the practical application of what is arguably the dominant framework in contemporary distributive justice for health: **Norman Daniels' "Fair Equality of Opportunity" (FEO) account**, which itself relies on **Christopher Boorse's Biostatistical Theory (BST)** of health.

  Here is a breakdown of the philosophical commitments, tensions, and implications of this policy structure for your feature.

  ### 1. The Philosophical Commitments: Disease and the Aims of Medicine
  The policy presupposes a specific teleology (purpose) of medicine. It assumes the goal of medicine is **not** to maximize well-being, happiness, or performance, but to **maintain or restore "species-typical normal functioning."**

  *   **The Boorse-Daniels Axis:** Christopher Boorse defined health naturalistically as the absence of disease, where disease is a deviation from species-typical functional design. Norman Daniels took this and argued that because normal functioning protects an individual's "share of the normal opportunity range" (the array of life plans reasonable to pursue in a society), justice requires society to restore that functioning.
  *   **The Prevention Anomaly:** You correctly note that vaccines and statins disrupt a purely *historical* restoration model (since there is no prior illness to restore). However, they fit perfectly within the **species-typical maintenance** model. The philosophical commitment here is that medicine is the guardian of the *species-typical baseline*. It fights deviations below the line (disease) and prevents future deviations below the line (prevention). It does not fight for deviations *above* the line (enhancement).
  *   **The Aim:** The aim of medicine is construed as **orthopedic** (setting things right) rather than **hedonic** (making things better than right).

  ### 2. Naturalistic vs. Normative: The Covert Ideal
  Does this require a value-neutral account of disease? **No.** While it *claims* the authority of naturalism, it covertly relies on a **normative ideal.**

  *   **The Naturalistic Mask:** Insurers like to cite ICD codes and biological markers (e.g., growth hormone levels) to suggest objective, value-free decisions. This appeals to the idea that "disease" is a fact of nature, while "enhancement" is a cultural desire.
  *   **The Normative Reality:** The line between "short stature due to deficiency" and "short stature due to normal variation" is not purely biological; it is statistical and social.
      *   *Example:* If the average height of a population shifts, the "species-typical" baseline shifts.
      *   *Example:* Defining "depression" vs. "normal sadness" involves judgments about how much suffering is compatible with a "normal" life.
  *   **The Covert Ideal:** The policy relies on a normative ideal of the **"competent social participant."** The healthy person is not just biologically intact; they are biologically intact *enough* to compete for social offices without special aid. The "baseline" is not just a biological average; it is the biological threshold required for fair social competition.

  ### 3. Independent Work vs. Proxy: What is the Line Actually Doing?
  Is the therapy/enhancement distinction doing independent philosophical work, or is it a proxy for other worries? **It is primarily a proxy, but a necessary one for administrative stability.**

  *   **Proxy for Cost Containment:** This is the elephant in the room. "Enhancement" is potentially infinite (you can always be smarter, taller, stronger). "Therapy" is theoretically finite (there are only so many diseases). The line acts as a budgetary circuit breaker.
  *   **Proxy for Fairness (The Positional Goods Argument):** This is where the line does genuine ethical work. Many enhancements are **positional goods**. If everyone takes a cognitive enhancer to get an edge in the job market, no one has an edge, but everyone bears the cost/risk. Therapy is generally viewed as leveling the playing field (bringing the disabled up to the able); enhancement is viewed as tilting the playing field (bringing the able to the super-able). The policy prevents an "arms race" of medicalization.
  *   **Proxy for Authenticity and Hubris:** While insurers rarely cite "playing God," the therapy/enhancement line protects against the commodification of the self. It preserves the idea that some traits are "given" (luck) and others are "fixed" (medicine). Blurring this line raises worries about authenticity (is this achievement mine?) and hubris (do we know the long-term systemic effects of altering human traits?).

  ### 4. Strictly Licensed vs. Merely Compatible (The Counterfactual)
  This is the most critical question for your analysis. If a committee replaced the baseline-restoration rule with a straightforward **Welfare** (utilitarian) or **Capabilities** (Sen/Nussbaum) criterion, what would *have* to change?

  **A. What is Strictly Licensed by the Therapy/Enhancement Line?**
  The exclusion of **non-therapeutic positional advantages** is strictly licensed by the current rule.
  *   *Example:* A drug that safely increases memory by 20% in healthy adults.
  *   *Current Policy:* Excluded. It pushes above the species-typical baseline.
  *   *Welfare Policy:* Potentially included. If it increases overall life satisfaction or economic productivity, a utilitarian calculus might demand coverage.
  *   *Capabilities Policy:* Potentially included. If it expands the "capability set" of the individual to function in various ways, it might be covered.
  *   *Conclusion:* The current policy *requires* the exclusion of benefits that do not remedy a dysfunction, even if those benefits increase welfare.

  **B. What is Merely Compatible?**
  **Preventive care** is compatible with both, but justified differently.
  *   *Current Policy:* Covered because it protects species-typical functioning (FEO).
  *   *Welfare Policy:* Covered because preventing illness is cheaper than curing it (Cost-Benefit).
  *   *Conclusion:* You cannot tell the difference in outcome here, only in justification.

  **C. What Would Change Under a Welfare/Capabilities Criterion?**
  If insurers switched to a **"Maximize Functioning/Capability"** model:
  1.  **The Definition of "Need" Explodes:** A short healthy child might qualify for growth hormone if evidence showed height correlates with lifetime earnings and well-being (which it does). The "deficiency" diagnosis becomes irrelevant; the "outcome" becomes relevant.
  2.  **Mental Health Expansion:** Antidepressants for "sub-clinical" sadness would be covered if they improved productivity and relationships more than therapy did. The distinction between "treating depression" and "optimizing mood" would vanish.
  3.  **The Budgetary Collapse:** The primary reason this switch won't happen is that welfare is infinite, whereas pathology is (theoretically) finite. The therapy/enhancement line is the only firewall preventing health insurance from becoming "total well-being insurance."

  ### Summary for Your Feature
  The "baseline-restoration rule" is not a scientific fact; it is a **political compromise.**

  It attempts to square the circle between the **biological reality** (there is a difference between a broken leg and a strong leg) and the **economic reality** (we cannot pay for everything). It presupposes that medicine has a specific, limited mandate: to protect the **fair distribution of opportunity**, not to maximize the **sum of human happiness.**

  When insurers cover statins but deny cognitive enhancers, they are not making a purely medical judgment. They are making a judgment that **protecting the normal range of human functioning is a social obligation, while exceeding it is a private luxury.** The philosophical tension lies in the fact that "normal function" is increasingly defined by the very social competitions that enhancements would influence. The line holds, but it is vibrating under the pressure of biotechnology that can decouple "health" from "species-typicality."

  **Key Sources to Cite/Investigate:**
  *   **Norman Daniels:** *Just Health: Meeting Health Needs Fairly* (The definitive defense of the FEO account).
  *   **Christopher Boorse:** "Health as a Theoretical Concept" (The naturalistic foundation).
  *   **Daniel Callahan:** Writings on the goals of medicine and cost containment (The pragmatic critique).
  *   **Julian Savulescu:** "Procreative Beneficence" (The counter-argument for enhancement).
  *   **Alison Galvani (Yale):** Research on the economics of prevention vs. treatment.

  This framework should give you the philosophical scaffolding to critique the policy not just as bureaucratic red tape, but as a specific, contestable vision of human flourishing.
