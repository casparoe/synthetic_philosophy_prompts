prompt: |-
  You are giving the best man's toast at the wedding of two close friends from graduate school, both of whom went on to teach philosophy; roughly half the room, however, will be relatives and old friends with no philosophical background at all. You have decided the toast should be built on G. E. Moore's ethics rather than on the usual sentiments, and in particular on his position, in the final chapter of Principia Ethica, that the greatest intrinsic goods are personal affection and the appreciation of beauty; that these goods are objective rather than a matter of what any particular person happens to enjoy; and that the value of a whole — what he called an organic unity — can exceed the sum of the values of its parts.

  Write the four-to-five-minute toast that this view makes possible and that this audience can receive. Moore's commitments should do structural work rather than decorate: the toast cannot rest on the thought that the couple is good because they make each other happy (Moore was no hedonist), nor on the thought that their bond is valuable merely for them (he held value to be objective), and it should put the organic-unity idea to real use in saying what the two of them are together rather than merely separately. It has to be warm and legible to the relatives, not a seminar for the philosophers — but the philosophers are listening, and they will notice if you quietly put into Moore's mouth a claim he would have rejected.
reasoning: |-
  Here's a thinking process that leads to the suggested toast:

  1.  **Analyze the Request:**
      *   **Role:** Best Man.
      *   **Occasion:** Wedding of two close friends from grad school (both philosophy teachers).
      *   **Audience:** Mixed (50% philosophers/academics, 50% relatives/old friends with no哲学 background).
      *   **Core Theme:** G. E. Moore's *Principia Ethica* (specifically the final chapter).
      *   **Key Moorean Concepts to Integrate:**
          1.  Greatest intrinsic goods: Personal affection and appreciation of beauty.
          2.  Objectivity of value (not just subjective happiness/preference).
          3.  Organic Unities (the whole is greater than the sum of its parts).
      *   **Constraints:**
          *   Must *use* the philosophy structurally, not just as decoration/jokes.
          *   Cannot be hedonistic ("they make each other happy").
          *   Cannot be purely subjective ("valuable only to them").
          *   Must be warm and accessible to non-philosophers (no jargon without explanation).
          *   Must be accurate to Moore (philosophers in the room will check).
          *   Length: 4-5 minutes (approx. 600-800 words spoken at a moderate pace).

  2.  **Deconstruct Moore's Ethics for a Toast:**
      *   *Personal Affection:* Moore argues that loving relationships are good in themselves, regardless of consequences. This fits a wedding perfectly.
      *   *Appreciation of Beauty:* Moore values the contemplation of beautiful objects. This can be metaphorically applied to the couple's life or literally to the wedding setting/art/life they build.
      *   *Objectivity:* Their love isn't just "nice for them"; it adds value to the universe. This elevates the toast from "I'm glad you're happy" to "The world is better because you exist together."
      *   *Organic Unity:* This is the trickiest but most powerful part. A marriage isn't just Person A + Person B. It's a new entity with its own value. I need to explain this simply.

  3.  **Drafting - Section by Section:**

      *   **Opening:** Acknowledge the mixed audience. Set a warm tone. Introduce the philosophical angle gently.
          *   *Idea:* Start with the usual "love is in the air" but pivot to "what actually makes love good?"
          *   *Moore connection:* Moore asked what is good *in itself*.

      *   **Body Paragraph 1: The Two Greatest Goods (Affection & Beauty):**
          *   *Challenge:* Explain Moore's big discovery without saying "In Chapter 6..."
          *   *Solution:* Frame it as a search for what matters. Moore said two things stand above the rest: loving people and appreciating beauty.
          *   *Application:* The couple embodies these. They aren't just chasing pleasure (hedonism); they are chasing *goods*.
          *   *Accessibility:* Use plain English. Instead of "intrinsic value," use "good in itself."

      *   **Body Paragraph 2: Objectivity:**
          *   *Challenge:* Avoid "they make each other happy."
          *   *Solution:* Focus on the value *of* the love, not the *feeling* of the love. It's not that they like it; it's that it *is* good.
          *   *Application:* Their marriage adds value to the room, to the family, to the world. It's a fact, not just a feeling.
          *   *Accessibility:* "It's not just true for them; it's true for us watching."

      *   **Body Paragraph 3: Organic Unity:**
          *   *Challenge:* Explain "organic unity" without jargon.
          *   *Solution:* Use the math analogy (1+1 > 2) or a musical chord analogy.
          *   *Application:* They aren't just two professors living together. They are a new thing. A partnership that creates something neither could alone.
          *   *Accessibility:* "The whole is greater than the sum of its parts." (This phrase is common enough).

      *   **Conclusion:** Bring it home. A wish for the future based on these goods. The Toast itself.
          *   *Idea:* May you continue to create these goods.
          *   *Moore check:* Ensure I don't imply the *consequences* matter more than the state of affairs themselves (Moore was a consequentialist regarding right action, but focused on intrinsic value here). Actually, for the toast, focusing on the *existence* of the good is enough.

  4.  **Refining and Polishing (Self-Correction during drafting):**
      *   *Critique:* Is it too dry?
      *   *Fix:* Add specific (hypothetical) details about the couple to ground it. Let's call them Alex and Jamie.
      *   *Critique:* Is the Moore accurate?
      *   *Check:* Moore did say personal affection and aesthetic enjoyment are the highest goods. He did argue value is objective (non-natural property). He did argue for organic unities (e.g., consciousness of beauty is better than beauty + consciousness separately).
      *   *Critique:* Is it accessible?
      *   *Fix:* Avoid terms like "non-natural property" or "ideal utilitarianism." Stick to "what is truly good," "real value," and "whole greater than parts."
      *   *Critique:* Is it hedonistic?
      *   *Fix:* Explicitly distinguish between "feeling good" and "being good." Moore hated the idea that pleasure is the only good.

  5.  **Final Review against Constraints:**
      *   4-5 minutes? (Word count check: ~750 words usually fits).
      *   Warm tone? (Yes, focus on love and family).
      *   Philosophers satisfied? (Moore's specific distinctions maintained).
      *   Relatives satisfied? (No jargon, clear emotional arc).

  6.  **Final Polish:** (Writing the actual text with attention to rhythm and speech patterns). *Make sure to emphasize that the value exists for everyone, not just the couple.* *Ensure the Organic Unity point highlights the marriage itself as a valuable object.*

  *(Self-Correction on "Organic Unity"):* Moore's specific point on organic unities is often that the value of the whole is not proportional to the sum of the values of the parts. For example, a beautiful object + the consciousness of it is much more valuable than the object alone + consciousness alone. In the context of marriage, it means the relationship itself has value distinct from the individuals. I need to make sure I don't just say "they are better together." I need to say "the *union* creates a new value."

  *(Self-Correction on Objectivity):* Moore argues against subjectivism. So I must say their love is *worthy* of love, not just that they *feel* love.

  Let's write.

  *(Drafting mental outline)*:
  1. Welcome & The "Philosophy" warning.
  2. Moore's Question: What is actually good?
  3. The Answer: Affection & Beauty.
  4. Objectivity: It's not just feelings; it's real value.
  5. Organic Unity: The Marriage is a new thing.
  6. Toast.

  *(Writing)*... (Proceeds to generate output based on these thoughts).
answer: |-
  Good evening, everyone. For those of you who don't know me, I'm the Best Man. For those of you who do know me, you know I share a background with Alex and Jamie: we survived graduate school together. Which means, naturally, when asked to speak tonight, I faced a dilemma. Do I tell the funny stories about the dissertation process, or do I try to say something that actually matters?

  Since Alex and Jamie have spent their careers teaching students how to think clearly about what matters, I decided to borrow a framework from one of their predecessors. I want to talk about why this marriage is good. And I don't mean "good" in the sense that the catering is delicious, or "good" in the sense that they make each other feel happy. I mean *good* in the deepest possible sense.

  There was a philosopher named G. E. Moore who wrote a book called *Principia Ethica*. He spent hundreds of pages arguing that we spend most of our lives confused about value. We think things are good because they are useful, or because they feel pleasant. But Moore argued that if you strip away everything else, only a few things remain that are good *in themselves*. Good, period. Not just good for you, or good for me, but good for the universe.

  According to Moore, the two greatest things in the world are the appreciation of beauty and the pleasures of human intercourse—what we might simply call personal affection.

  Looking around this room, and looking at the couple standing here, it seems Moore got it right. Alex and Jamie are not just partners in convenience. They are a union dedicated to those two specific goods. They appreciate the beauty in the world, in art, in ideas, and in each other. And they share a personal affection that is genuine and deep.

  Now, I know half the room is glazing over at the word "philosophy," but stay with me, because this leads to something important for all of us. Moore insisted that this value is *objective*. This is a crucial distinction. It is easy to say, "Alex and Jamie are great because they make each other happy." But feelings fluctuate. Happiness is a weather system. Moore would say their love is valuable not merely because they enjoy it, but because it *is* valuable.

  Think of a beautiful sunset. It is beautiful even if no one is looking at it. In the same way, the love between these two is a light that shines regardless of whether they are having a good day or a bad day. For the parents and family in the room: this means you aren't just witnessing their private joy. You are witnessing something that makes the world objectively better. Their marriage adds value to *your* lives, simply by existing. It is a fact, not just a feeling.

  But there is one final piece of Moore's thought that I think captures the magic of today. He wrote about what he called "organic unities." He argued that the value of a whole is not always equal to the sum of its parts. Sometimes, when you combine two good things, the result is vastly more valuable than the two things added together.

  Alex is a good person. Jamie is a good person. If we just added them up, we would expect a certain amount of good in the world. But marriage creates an organic unity. It creates a new entity—this "we"—that has a value all its own. The conversations they have, the support they give, the life they are building; these cannot be found in Alex alone, or Jamie alone. They exist only in the space between them.

  So, my wish for you is not just that you remain happy, though I hope you are. My wish is that you continue to recognize and cultivate these intrinsic goods. Protect your affection. Chase beauty. And never forget that what you have built together is greater than the sum of what you brought to the altar.

  Moore taught us that love is one of the few things that is truly worth having. Alex and Jamie, you have found it, you have named it, and today, you have made it real for all of us.

  Please raise your glasses. To the organic unity of Alex and Jamie, and to the objective good that is their love. Cheers.
