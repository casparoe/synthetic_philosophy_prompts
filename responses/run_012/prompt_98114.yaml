answer: |-
  **Root Commitment:** A person's roles and relationships do more than influence them — they partly determine who the person is.

  **Q1: What kind of determination is this?**
  When you cite relationships to understand a person, are you describing what we must reference to explain and predict behavior, or are you describing what the self *is* and where value lies?
  *   **Explain/Predict:** Go to Q1b.
  *   **Is/Value:** Go to Q2.

  **Q1b: How strong is this explanatory determination?**
  Does social context merely constrain choices, or does it so thoroughly shape preference that the independent individual is a fiction?
  *   **Constrains (Negligible):** **Atomistic Individualism**. *Awkward commitment:* Must treat deep social bonds as merely external constraints on an otherwise independent will.
  *   **Shapes (Significant):** **Methodological Individualism**. *Awkward commitment:* Acknowledges social causality but denies it changes the fundamental unit of moral worth.

  **Q2: Who acts when the community decides?**
  When a village or firm makes a decision that falls hard on one member, is the group itself an agent with intentions, or only individuals whose selves are group-shaped?
  *   **Group Agent:** **A view on which groups are genuine agents**. *Awkward commitment:* Individuals can be held liable for intentions they did not personally form.
  *   **Individuals:** Go to Q3.

  **Q3: Can the constituted self dissent?**
  When a grown child wants to emigrate while a parent expects to be cared for, can the self press claims — rights, grounds for exit — against the community that constitutes it?
  *   **Yes:** **A liberal position that grants the social conception of the self while retaining individual priority**. *Awkward commitment:* Must explain why individual rights trump the very relationships that constitute the self.
  *   **No:** Go to Q4.

  **Q4: What grounds the cultural contrast?**
  Regarding a ritual duty that costs the individual something real, or when asked to shield a relative from the law, is the alleged East–West difference a difference in deep metaphysics, in the relative weight assigned to values, or an artifact of how the comparison is drawn?
  *   **Metaphysics (Self is Role):** **A role- or relation-based ethics in which the self is constituted by its roles**. *Awkward commitment:* Struggles to account for personal growth that requires shedding constitutive roles.
  *   **Value (Community Priority):** **A communitarian position pairing a social conception of the self with a value priority to community**. *Awkward commitment:* Struggles to justify reform when community values are oppressive.
  *   **Salience/Artifact:** **A deflationary view on which the cultural contrast is a matter of situation and salience rather than metaphysics**. *Awkward commitment:* Risks making profound ethical disagreements seem like mere perceptual errors.

  ***

  **Indistinguishable Leaves:**
  *   **Role-based ethics** and **Communitarianism** are often flagged as indistinguishable in practice. While one grounds obligation in ontology (what I *am*) and the other in axiology (what is *good*), both frequently demand identical sacrifices of individual interest for relational continuity.

  **Unoccupied Combinations:**
  *   **Atomistic Individualism + Group Agents:** *Diagnosis:* Incoherent. One cannot claim the individual is the sole real unit while simultaneously granting genuine agency to collectives.
  *   **Liberal Position + Group Agents:** *Diagnosis:* Unexplored. Rare to see individual rights prioritized while granting groups ontological status independent of members.
  *   **Deflationary View + No Right to Dissent:** *Diagnosis:* Unattractive. If differences are merely salience artifacts, denying dissent based on them appears arbitrary rather than principled.
