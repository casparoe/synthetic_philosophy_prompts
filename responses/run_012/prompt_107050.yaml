answer: |-
  ## Part 1: The Specification (API Contract)

  **System:** `PreferenceAggregator`
  **Input:** A list of `Client` objects, $N = \{1, \dots, n\}$.
  **Data Type:** `Item` (a set of options, $|Item| \ge 3$).
  **Input Schema:** Each client $i$ provides a `TotalOrder<Item>`. This is a comparison function `cmp_i(x, y)` returning $\{-1, 0, 1\}$ that is reflexive, antisymmetric, and **transitive**.
  **Output Schema:** A single system-wide `TotalOrder<Item>`, `cmp_sys(x, y)`.

  **Interface Contract:**
  The system must implement a function `merge(inputs: List[TOTAL_ORDER]) -> TOTAL_ORDER` satisfying the following four invariants (Pre/Post-conditions):

  1.  **Universal Domain (Input Validation):**
      The `merge` function must accept *any* combination of valid `TotalOrder` inputs from the clients. There are no restricted profiles. You cannot throw `InvalidProfileException` based on the *content* of the rankings, only their format.

  2.  **Pareto Efficiency (Unanimity Constraint):**
      ```python
      # Post-condition
      for x, y in Item:
          if all(client.cmp(x, y) == 1 for client in inputs):
              assert sys.cmp(x, y) == 1
      ```
      If every client ranks $x$ strictly above $y$, the system output must rank $x$ strictly above $y$.

  3.  **Independence of Irrelevant Alternatives (Pairwise Isolation):**
      ```python
      # Constraint on function signature dependencies
      # The result of sys.cmp(x, y) must depend ONLY on the collection of
      # {client.cmp(x, y) for client in inputs}.
      # It cannot depend on client.cmp(x, z) or client.cmp(z, y) for any z != x, y.
      ```
      The comparison of any pair $(x, y)$ is a pure function of how the clients compared that specific pair. Context regarding other items is inaccessible during the computation of that pair.

  4.  **Non-Dictatorship (No Single Source of Truth):**
      ```python
      # Invariant
      assert not exists(k in Clients) such that:
          for all profiles in UniversalDomain:
              sys.cmp == inputs[k].cmp
      ```
      There is no fixed client index $k$ whose input ordering is always returned as the system output, regardless of what other clients submit.

  **Theorem (Build Failure):**
  For $|Item| \ge 3$ and finite $N$, **no implementation of `merge` exists** that satisfies all four invariants simultaneously. The interface is unimplementable.

  ---

  ## Part 2: The Trace (Argument Sketch)

  To understand why the build fails, we trace the data flow constraints imposed by **Pairwise Isolation** and **Transitivity**.

  1.  **The Decisiveness Property:**
      Consider a specific pair $(A, B)$. Due to **Universal Domain**, clients can rank $A$ and $B$ in any configuration. Due to **Pareto**, if everyone puts $A$ over $B$, the system outputs $A$ over $B$. If everyone puts $B$ over $A$, the system outputs $B$ over $A$.
      Since the output must flip from $A>B$ to $B>A$ as inputs change, there must be a specific configuration of inputs where the system's decision flips.

  2.  **The Pivotal Client:**
      Imagine a sequence of input profiles. We start with everyone ranking $A$ at the very bottom. By **Pareto**, the system ranks $A$ at the bottom.
      We iteratively move $A$ to the top of Client 1's list, then Client 2's, and so on.
      At some step $k$, moving $A$ up in Client $k$'s list causes the System to flip $A$ from "bottom" to "top" (relative to some other item $B$).
      Client $k$ is now **Pivotal** for the pair $(A, B)$. Because of **Pairwise Isolation**, Client $k$'s preference on $(A, B)$ alone determines the system's preference on $(A, B)$ in this configuration, overriding everyone else.

  3.  **Propagation of Authority:**
      The critical logic step is showing that this Pivotal status isn't local to $(A, B)$.
      Because the output must be a `TotalOrder` (Transitive), the decision on $(A, B)$ constrains the decision on $(B, C)$ and $(A, C)$.
      Using a third item $C$ as a bridge, we can prove that if Client $k$ is Pivotal for $(A, B)$, they effectively become Pivotal for $(A, C)$ and $(B, C)$ as well.
      *   *Engineering intuition:* If Client $k$ controls the merge logic for one pair, and the merge logic must remain consistent (transitive) across all pairs without looking at context (IIA), Client $k$'s logic effectively hardcodes the truth table for *all* pairs.

  4.  **The Violation:**
      Once Client $k$ is Pivotal for all pairs, Client $k$ satisfies the definition of a **Dictator** (Single Source of Truth).
      This violates invariant #4 (**Non-Dictatorship**).
      To satisfy #4, you must break #3 (allow context/IIA violation) or #2 (ignore unanimity) or the Output Type (allow cycles/non-transitivity).

  ---

  ## Part 3: Residue Report

  Here is the analysis of what survives the translation from social choice theory to software engineering specs, and what dissolves.

  ### 1. Intact Translations (High Fidelity)
  *   **The Logic Structure:** The conditional structure (If Requirements A, B, C, D $\rightarrow$ False) maps perfectly to an unimplementable interface assertion.
  *   **Non-Dictatorship:** This translates cleanly to "No Hardcoded Client ID." In engineering, we recognize this as avoiding a single point of failure or authority in a distributed write.
  *   **Pareto Efficiency:** This is identical to a "Consensus on Common Ground" requirement. If all nodes agree on a state transition, the system must commit it.
  *   **Universal Domain:** This maps to "Schema Validation Only." The system cannot reject inputs based on business logic values, only data types.

  ### 2. Shifted Meanings (Semantic Drift)
  *   **Independence of Irrelevant Alternatives (IIA) $\rightarrow$ Pairwise Isolation:**
      *   *Original:* A condition on social welfare functions.
      *   *Engineering Translation:* A strict encapsulation constraint.
      *   *The Drift:* In engineering, "modularity" usually implies that module $X$ shouldn't depend on module $Y$'s *internals*. Here, IIA demands that the computation for pair $(A, B)$ cannot depend on the *existence* or *ranking* of $C$.
      *   *Impact:* Engineers often assume that to merge conflicting rankings, you need global context (e.g., "B is a compromise between A and C"). Arrow's IIA explicitly forbids looking at the "compromise" structure. It forces the merge function to be a lookup table per pair. This feels unnatural to engineers who design merge strategies (like 3-way merge in Git) that explicitly look at common ancestors (context) to resolve conflicts.
  *   **Transitivity $\rightarrow$ Return Type Constraint:**
      *   *Original:* A rationality assumption about preferences.
      *   *Engineering Translation:* A data integrity constraint on the output object.
      *   *The Drift:* Engineers are comfortable returning `PartialOrder` or DAGs (Directed Acyclic Graphs) when conflicts arise (e.g., version vectors). Arrow demands a `TotalOrder` (a linked list). The impossibility arises largely because we force a linear serialization of potentially cyclic input preferences without allowing a "conflict" return value.

  ### 3. No Counterpart (The Void)
  *   **The Concept of "Preference" vs. "State":**
      *   In distributed systems (Paxos/Raft), "Consensus" means agreeing on a *value* (a log entry). Arrow is about aggregating *orderings*.
      *   Engineering vocabulary lacks a native primitive for "Ordering Aggregation." We have `reduce()`, but that usually assumes an associative operator on values, not on order relations. The residue shows we don't typically model "ranking" as a first-class mergeable data type.
  *   **The "Pivotal" Mechanism:**
      *   The proof relies on a specific client becoming decisive. In engineering, if a client starts dictating output, we call that a "sticky session" or "leader election." But those are *explicit* protocol states. Arrow shows this dictatorship emerges *implicitly* from the mathematical constraints, even if the code contains no `if client == leader` logic. Engineering intuition assumes implicit dictatorship requires explicit state; Arrow proves the constraints themselves create the state.

  ### 4. Conclusion: Gap or Imprecision?

  **The Residue Verdict:** The residue marks a **gap in engineering vocabulary**, not imprecision in the original claim.

  1.  **Precision:** Arrow's theorem is mathematically rigid. The translation holds because the logic is structural, not semantic.
  2.  **The Gap:** Engineering merge strategies (Git, CRDTs, Consensus) implicitly violate IIA to function.
      *   *Git:* Uses a common ancestor (Item $Z$) to resolve conflicts between $X$ and $Y$. This violates Pairwise Isolation.
      *   *CRDTs:* Often converge on state, not strict total ordering of preferences.
      *   *Raft:* Elects a leader (Dictator) to ensure progress, explicitly accepting invariant #4 violation to guarantee liveness.

  **The Insight:**
  As an engineer, you might look at Arrow's Theorem and say, "So what? Just return a DAG or elect a leader."
  The theorem's value is not that it breaks your system, but that it forces you to admit **which invariant you are dropping**.
  *   If you allow cycles (return a DAG), you drop the `TotalOrder` return type.
  *   If you use context to resolve conflicts (Git), you drop `Pairwise Isolation` (IIA).
  *   If you elect a primary (Raft), you drop `Non-Dictatorship`.

  The residue shows that "Merging" in engineering is rarely a pure function satisfying all four constraints. We always trade one for the other. Arrow proves you cannot have the "Perfect Merge Function" that is context-free, unanimous, democratic, and strictly ordered. You must architect the failure mode.
