answer: |-
  ### Desiderata for an Adequate Theory of Multipolar Traps

  To serve the purpose of *ex-ante* prediction and intervention, a theory must move beyond metaphor and specify the structural variables that distinguish a solvable coordination problem from a locked-in race to the bottom. The following criteria are derived from the failure modes you identified (cases a–e). Each is labeled as a **Genuine Requirement** (necessary for predictive/interventional utility) or a **Prejudice** (a camp-specific assumption that limits scope).

  1.  **Preference Verification (Case A)**
      *   **Criterion:** The theory must distinguish between a payoff matrix where defection is dominant despite mutual preference for cooperation (true trap) and a matrix where agents derive utility from the competition itself (market selection).
      *   **Label:** **Genuine Requirement**.
      *   **Rationale:** Intervention is impossible if the "trap" is actually the agents' preferred outcome. A theory that cannot separate *constrained* preference from *revealed* preference cannot identify whether the lever is "change the incentives" or "accept the selection."

  2.  **Audience Cost Quantification (Case B)**
      *   **Criterion:** The theory must separate internal payoff pressures (profit/survival) from external signaling pressures (reputation with observers who are not competitors).
      *   **Label:** **Genuine Requirement**.
      *   **Rationale:** If the pressure comes from third-party expectations, the intervention point is information control or audience management, not competitor negotiation. Conflating these leads to failed diplomacy.

  3.  **Boundary and Externality Mapping (Case C)**
      *   **Criterion:** The theory must explicitly define the player set and track where the costs of "exit" land. If exit costs are externalized to non-players, the situation is not a trap for the participants.
      *   **Label:** **Genuine Requirement**.
      *   **Rationale:** A race to the bottom where players can exit safely but dump costs on outsiders is exploitation, not a trap. Misdiagnosing this leads to interventions that protect competitors rather than victims.

  4.  **Hegemonic Capacity Assessment (Case D)**
      *   **Criterion:** The theory must account for power asymmetry. It must determine if a single dominant actor has the capacity to unilaterally enforce a ceasefire but chooses not to.
      *   **Label:** **Genuine Requirement**.
      *   **Rationale:** Standard game theory often assumes symmetry. If a hegemon sustains the race for strategic gain, the "trap" is actually a policy choice. Intervention requires targeting the hegemon's incentives, not the system's structure.

  5.  **Cooperative Variance Accommodation (Case E)**
      *   **Criterion:** The theory must explain why structurally identical situations sometimes result in cooperation (Ostrom-style commons) and sometimes in collapse, without relying on exogenous "enforcers."
      *   **Label:** **Genuine Requirement**.
      *   **Rationale:** If the theory claims structure *forces* the bad outcome, it is falsified by successful commons. To be predictive, it must identify the specific social technologies (monitoring, graduated sanctions) that toggle the outcome.

  6.  **Inevitability of Defection**
      *   **Criterion:** The theory should treat defection as the default baseline expectation in the absence of binding contracts.
      *   **Label:** **Prejudice (Game-Theoretic/Evolutionary)**.
      *   **Rationale:** This assumption aids modeling parsimony but fails prediction in iterated real-world scenarios. Treating this as a law rather than a heuristic blinds the analyst to endogenous norm-formation.

  7.  **Normative Definition of "The Bottom"**
      *   **Criterion:** The theory must define the "race to the bottom" as a Pareto-inferior equilibrium, not a morally undesirable outcome.
      *   **Label:** **Prejudice (Moralizing)**.
      *   **Rationale:** Popular accounts often conflate "efficient but harsh" with "trap." A structural theory must remain agnostic on whether the outcome is *good*, focusing only on whether it is *stable and sub-optimal for the participants*.

  ***

  ### The Exclusionary Requirement
  **Requirement #5 (Cooperative Variance Accommodation)** does the most to exclude popular accounts.
  Most "Moloch" essays rely on structural determinism: they argue that once the incentives are set, the outcome is inevitable. This requirement forces the theory to admit that structure is not destiny. It excludes any account that treats the trap as a force of nature rather than a failure of specific governance technologies. If a theory cannot explain why some fisheries survive and others collapse despite identical market pressures, it is a metaphor, not a model.

  ### The Jointly Unsatisfiable Pair
  **Requirement #1 (Preference Verification)** and **Requirement #6 (Inevitability of Defection)** create a tension that is often glossed over.
  *   **The Conflict:** To verify preferences (Req 1), you must treat agents as having internal states that can diverge from their actions (they want to stop but can't). To assume inevitability of defection (Req 6), you often treat agents as black boxes where action reveals preference (they defected, so they preferred to).
  *   **The Tension:** You cannot simultaneously hold that agents are *forced* to act against their will (Trap) and that their actions *reveal* their will (Evolutionary Selection). Popular accounts slide between these two: they use the "Trap" language to evoke sympathy (Req 1) but the "Selection" language to claim inevitability (Req 6). An adequate theory must pick one mechanism: either the preferences are constant and the structure binds them, or the structure selects for different preferences.

  ***

  ### Settled vs. Contested

  **Settled:**
  *   In a one-shot Prisoner's Dilemma with no communication or enforcement, defection is the dominant strategy.
  *   Externalities unpriced by the market lead to overconsumption of shared resources.
  *   Iterated games allow for cooperative equilibria (Tit-for-Tat) that one-shot games do not.

  **Contested:**
  *   **Mapping:** Whether real-world systemic risks (AI, climate, capitalism) map to one-shot dilemmas or iterated games with communication. (This determines if the trap is solvable).
  *   **Agency:** Whether "Moloch" is a useful agent-like metaphor for emergent dynamics or a category error that reifies a system outcome into a causal actor.
  *   **Intervention:** Whether coordination requires external enforcement (Leviathan) or can be sustained through polycentric governance (Ostrom).

  ***

  ### Scoring of Particular Accounts

  *   **Scott Alexander / "Moloch" Essays:** High rhetorical power for identifying systemic lock-in, but low predictive specificity regarding intervention points.
  *   **Standard Neoclassical Economics:** High precision on marginal incentives, but systematically underestimates the viability of endogenous cooperation without property rights.
  *   **Elinor Ostrom's Institutional Analysis:** High explanatory power for successful commons, but less developed on systemic, global-scale traps where exit is impossible.
  *   **Evolutionary Psychology Accounts:** Strong on why agents might *prefer* the race (status signaling), but weak on how to structurally halt it once started.
