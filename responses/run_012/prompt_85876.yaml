          *   Resolution: The announcement creates a self-referential contradiction (knowledge logic). It's about *common knowledge of rationality* and *knowability*.
      *   *The Centipede Game:*
          *   Structure: Finite sequential game. Payoffs increase if you pass, but you can take the pot.
          *   Reasoning: If we reach the last node, Player 2 takes. So Player 1 should take at second-to-last. So Player 2 should take at third-to-last... Back to Move 1.
          *   Outcome: Experimental data shows people pass for many rounds.
          *   Resolution: Depends on beliefs about the other player's rationality, altruism, or error.
      *   *Correspondence:*
