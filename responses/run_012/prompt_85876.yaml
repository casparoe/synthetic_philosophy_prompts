  3.  **Evaluate the Analogy (Centipede vs. Surprise Exam):**
      *   *The Surprise Exam Paradox:*
          *   Announcement: "There will be an exam next week, and you won't know the morning of."
          *   Reasoning: If it's Friday, I'll know Thursday night. So not Friday. If not Friday, Thursday is the last day, so I'll know Wednesday night... Eliminate all days.
