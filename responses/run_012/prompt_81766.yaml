answer: |-
  **1. The Conjunction Problem and Blame Assignment**
  You argue that the old objection—that tests bear on a bundle of claims rather than a single hypothesis—misses your point because you focus on the regime, not the statement. But within that regime, when a test fails, someone still has to be blamed: the core claim or an auxiliary assumption. What feature of the practice fixes that blame, and what prevents a discipline from counting as scientific simply by having a standing rule that always assigns blame to the auxiliaries?
  *   **Follow-up:** If you say the rules forbid systematic exoneration of the core, what distinguishes a rational rule from a merely entrenched dogma that happens to look like a rule?
  *   **Note:** Forces distinction between *having* a procedural rule and having a *rational* rule for blame assignment.

  **2. The Authority of Fixed Outcomes**
  Your account requires that test outcomes be fixed in advance, and that failure obliges revision. Who has the authority to fix these outcomes, and what mechanism stops the community from renegotiating the specification once the result is known to be inconvenient?
  *   **Follow-up:** If the community itself sets and revises these standards, doesn't that collapse your view into the conventionalism you want to avoid, where truth is determined by agreement rather than constraint?
  *   **Note:** Forces confrontation with the charge that procedural norms are merely disguised conventions.

  **3. The "Eventually" Clause**
  You allow that a hypothesis can persist even if insulated from test, provided the regime would *eventually* force it out. But at any present moment, how do we distinguish a hypothesis that is temporarily protected from one that is permanently shielded, given that this eventual forcing is not observable now?
  *   **Follow-up:** If we can only tell the difference in hindsight, does your criterion offer a demarcation we can use, or merely a description of what we should have said yesterday?
  *   **Note:** Forces admission that the criterion is either retrospective or relies on speculative prediction.

  **4. Statistical and Probabilistic Hypotheses**
  No finite run of outcomes strictly refutes a probability claim, since any outcome is possible however unlikely. What does failure look like for a regime testing such a claim, and does registering that failure require a significance convention that is itself not testable?
  *   **Follow-up:** If that significance convention is not itself testable, doesn't the entire error-detection structure rest on a foundational assumption that is immune to your own criterion?
  *   **Note:** Forces admission of an untestable foundational convention within the scientific practice.

  **5. Self-Application**
  Does your own account of error-detection regimes meet its own standard: is it a claim that has been put to a test where failure would oblige you to abandon it?
  *   **Follow-up:** If you reply that this is a proposal for how to use a word rather than a claim about the world, what rationally constrains that choice, or is the proposal ultimately arbitrary?
  *   **Note:** Forces dilemma between self-exemption or admitting the view rests on an arbitrary stipulation.

  **6. The Degree-Theoretic Consequence**
  If scientific status comes in degrees, as your focus on practices suggests, what does your view imply for a discipline that has the institutions of error-detection but no successful tests, versus one with successful tests but no institutions?
  *   **Follow-up:** If one of these counts as more scientific than the other, are you prioritizing the social structure over the actual production of reliable knowledge, or vice versa?
  *   **Note:** Forces prioritization of procedural structure versus epistemic output.

  **7. Circularity and Identification**
  Can we identify an error-detection regime independently of knowing whether the discipline is scientific, or are we picking out the practice by the very feature it is supposed to explain?
  *   **Follow-up:** If we need to know what science is to identify the regime, isn't the account circular, defining science by a practice we only recognize as valid because it belongs to science?
  *   **Note:** Forces clarification on whether the criterion is informative or merely a restatement of intuition.

  **8. The Source of Normative Obligation**
  You insist this view is continuous with Popper's project because it remains normative, not just sociological. But if the obligation to revise comes from the discipline's own stated rules, where does the normative force come from if those rules are mistaken?
  *   **Follow-up:** If a regime faithfully follows its own rules but systematically produces falsehoods, does your account still classify it as scientific, and if so, has normativity lost its connection to truth?
  *   **Note:** Forces separation of procedural reliability from truth-conduciveness.

  **9. Ad Hoc Rescue at the Regime Level**
  You claim standard objections about ad hoc rescue target statement-level falsificationism. But couldn't a regime itself be structured to allow ad hoc rescues, provided it does so consistently according to its own procedures?
  *   **Follow-up:** If a discipline has a standing practice of modifying its core claims to fit any data without reducing testability, would your account mistakenly validate it as scientific?
  *   **Note:** Forces acknowledgment that procedural consistency alone may not block institutionalized dogmatism.

  **10. Vulnerability of the Account**
  To close, I want to ask what would count against your account. I am not asking what would make a discipline unscientific, but what empirical discovery or conceptual argument would convince you that this is a *bad* proposal for demarcation?
  *   **Follow-up:** If no possible finding could make this a bad proposal, aren't you protecting the view from criticism by treating it as a definition rather than a substantive claim?
  *   **Note:** Forces vulnerability condition that cannot be dodged by appealing to stipulation.
