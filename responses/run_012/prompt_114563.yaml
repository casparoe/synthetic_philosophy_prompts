answer: |-
  # JOINT STATEMENT ON THE ONTOLOGY OF PERFORMATIVE UTTERANCES
  **Parties:** The Institutional Camp (IC) & The Intentional Camp (TC)
  **Subject:** The constitution of speech acts (promises, resignations, christenings, etc.)
  **Date:** [Current Date]

  ## 1. AGREED CLAIMS
  *We affirm the following propositions as accurate descriptions of the phenomena, regardless of our underlying metaphysical disagreements.*

  1.  **Normative Shift:** In paradigmatic cases (e.g., a public wedding, a signed contract), utterances reliably produce changes in normative status (rights, obligations, entitlements) that did not exist prior to the utterance.
  2.  **The Role of Context:** No utterance produces these shifts in a vacuum. Contextual factors (authority of speaker, relationship to hearer, prior history, physical setting) are necessary for the shift to occur.
  3.  **Insincerity (Case d):** An insincere promise (speaker intends not to comply) is distinct from a non-promise. The speaker is liable to criticism for breaking the promise, not merely for lying about their state of mind. Both camps agree the act *occurred* enough to be violated, though we disagree on what "occurred" means.
  4.  **Unsent Drafts (Case b):** Typing "I resign" into a draft that is never sent constitutes **no** performative act of resigning. It is merely a record of an intention. Both camps agree that transmission to an audience is a necessary condition for the act to have social effect.
  5.  **Uptake and Misfire (Case f):** If a threat is taken as a joke, or a joke as a threat, the *consequences* are determined by the hearer's uptake, not the speaker's intent. However, we disagree on whether the *act itself* existed prior to that uptake.
  6.  **The "Hereby" Probe:** The adverb "hereby" functions felicitously only with verbs that purport to change the current normative situation (e.g., "I hereby promise," "I hereby resign"). It sounds infelicitous with descriptive verbs ("I hereby run," "I hereby know"). Both camps agree this linguistic marker tracks a specific class of verbs, but disagree on what unifies that class (see Section 3).
  7.  **The Castaway (Case a):** A castaway promising a dead brother creates a psychological burden and a sense of self-obligation. Both camps agree the castaway will feel guilt upon violation. We disagree on whether this guilt stems from a broken *promise* (TC) or a broken *personal rule/vow* that lacks the ontology of a social promise (IC).
  8.  **Hallucinations/Chatbots (Case c):** Making a bet with a hallucination or a chatbot fails to create a binding wager. Both camps agree the failure is due to the lack of a capable counterparty, but disagree on whether the failure is constitutive (no bet was ever struck) or pragmatic (the bet was struck but cannot be enforced/settled).
  9.  **Island Marriage (Case e):** Two people marrying on an island with no community or state create a binding interpersonal commitment but do not acquire the social status of "married persons" relative to the wider world. We agree the distinction between *interpersonal commitment* and *social status* is real; we disagree on whether the former counts as a "marriage act."
  10. **The Institution/Mind Cut:** We agree that the user's proposed distinction (Institution-bound acts like christenings vs. Mind-bound acts like promising) tracks a real gradient of social dependency. However, we disagree on whether this is a distinction between two *kinds* of acts or merely two *degrees* of institutional density.

  ## 2. DISAGREEMENTS TABLE
  *Residual disagreements stated in each camp's preferred terminology, with conditions for revision and pre-registered predictions.*

  | Topic | Institutional Camp (IC) Formulation | Intentional Camp (TC) Formulation | What Would Move This Side | Pre-Registered Prediction |
  | :--- | :--- | :--- | :--- | :--- |
  | **The Castaway (Case a)** | **No act occurred.** Without a social practice of promising, there is no "promise," only a resolution. The normativity is self-imposed, not interpersonal. | **Act occurred.** The speaker's intention to bind themselves, expressed to a witness (even a dead one), constitutes a promise. The normativity is generated by the will. | **IC:** Evidence that isolated individuals consistently treat such vows as enforceable by *third parties* who later arrive. <br> **TC:** Evidence that speakers consistently report feeling *interpersonally* wronged (not just self-disappointed) if the vow is broken, even without a community. | **IC:** Third parties arriving on the island will not recognize the vow as binding unless they adopt the practice. <br> **TC:** Third parties will recognize the vow as binding based solely on the expressed intent, even without prior local custom. |
  | **Uptake Ledger** | **Constitutive.** Uptake is part of the circuit. No uptake = no act. The act is a handshake, not a thrown ball. | **Causal.** Uptake is the reception of the act. No uptake = failed communication, but the act (the throw) still happened. | **IC:** Cases where speakers are held responsible for acts where uptake was physically impossible (e.g., radio silence). <br> **TC:** Cases where speakers are *not* held responsible despite clear uptake (e.g., hearer understands but lacks standing). | **IC:** In cases of total communication failure, we will find no normative residue (no obligation to repair). <br> **TC:** In cases of total communication failure, we will find normative residue (speaker owes an apology for the attempt). |
  | **"Hereby" Class** | **Rule-Invocation.** These verbs explicitly trigger a convention. "Hereby" points to the rulebook being enacted. | **Intent-Explicitation.** These verbs make explicit the change in mental state. "Hereby" points to the moment of commitment. | **IC:** Discovery of "hereby" usage in contexts with zero conventional backing (purely novel, ad-hoc interactions). <br> **TC:** Discovery of "hereby" failing in contexts where intention is clear but convention is absent. | **IC:** "Hereby" will fail in purely ad-hoc dyadic interactions without prior precedent. <br> **TC:** "Hereby" will succeed in ad-hoc interactions provided intent is clear. |
  | **Institution vs. Mind** | **Collapse to Institution.** "Mind-bound" acts are just internalized micro-institutions. There is no promise without a practice. | **Collapse to Mind.** "Institution-bound" acts are just crystallized mass-intentions. The institution is a byproduct, not the source. | **IC:** A stable normative practice emerging spontaneously between two agents with no prior shared history. <br> **TC:** A formal institutional act (e.g., wedding) failing to create obligation despite perfect procedure, due to lack of intent. | **IC:** Spontaneous practices will always borrow from existing external institutions. <br> **TC:** Formal acts without intent will be universally treated as void, not just "unhappy." |

  ## 3. CRUXES AND TESTS
  *The fundamental points of divergence. We identify these as the places where our models yield different outputs.*

  ### Crux 1: The Source of Normativity
  *   **The Dispute:** Does the "ought" generated by a performative come from the **rule** (IC) or the **will** (TC)?
  *   **The Test Case:** *The Insincere Promise (Case d).*
      *   **IC Prediction:** The obligation exists because the procedure was followed. The speaker's internal state is irrelevant to the existence of the debt, only to their moral character.
      *   **TC Prediction:** The obligation is weakened or voided because the will was absent. The "debt" is actually a debt of honesty, not a debt of performance.
  *   **Agreed Bearing:** If we find that insincere promisors are held to *performance* (must do the thing) rather than *compensation* (must pay for the lie), IC is favored. If they are held only to *compensation*, TC is favored.

  ### Crux 2: The "Nothing Happened" Intuition
  *   **The Dispute:** When a judge without jurisdiction says "I sentence you," did they **fail to sentence** (IC) or **sentence unsuccessfully** (TC)?
  *   **The Test Case:** *The Island Marriage (Case e).*
      *   **IC Prediction:** We will describe this as "cohabitation" or "commitment," resisting the word "marriage" until a community recognizes it. The description "they married" is false.
      *   **TC Prediction:** We will describe this as "a marriage without license." The description "they married" is true, with a caveat about status.
  *   **Agreed Bearing:** Linguistic corpus analysis of how neutral observers describe private ceremonies. If "They married" is used freely, TC gains ground. If "They had a ceremony" is preferred, IC gains ground.

  ### Crux 3: The Evolution of Norms
  *   **The Dispute:** Do rules precede acts (IC) or do acts precede rules (TC)?
  *   **The Test Case:** *The "Hereby" Probe in Novel Contexts.*
      *   **IC Prediction:** You cannot use "hereby" to create a new kind of act. You can only use it to instantiate an existing kind.
      *   **TC Prediction:** You can use "hereby" to create a new kind of act on the fly, provided the hearer accepts the intention.
  *   **Agreed Bearing:** Experimental creation of novel speech acts in a lab setting. If subjects accept "I hereby designate you the Keeper of the Beans" as creating a role without prior setup, TC is favored. If subjects ask "What does that mean?" or "Do we have a rule for that?", IC is favored.

  ## 4. META-ANALYSIS & VERDICAL STATUS

  **On the User's Suspicion (Institution-Bound vs. Mind-Bound):**
  We agree this distinction is **the dispute renamed**, but with higher resolution.
  *   The IC argues that "Mind-Bound" is a misnomer; even promising relies on a shared practice of trust and expectation (a micro-institution).
  *   The TC argues that "Institution-Bound" is a misnomer; even weddings rely on the intentional states of the participants (a macro-mind).
  *   **Conclusion:** The cut is real phenomenologically (some acts feel more bureaucratic, some more personal), but ontologically, it does not solve the fight. It merely divides the battlefield.

  **On Verbal Disputes:**
  We acknowledge a significant verbal component regarding the definition of **"Act."**
  *   **IC** defines "Act" as a *successful change in social reality*.
  *   **TC** defines "Act" as a *successful expression of agency*.
  *   **Dissolution:** If we agree to use "Communicative Attempt" for TC's definition and "Social Transaction" for IC's definition, 40% of our disagreement vanishes. However, the remaining 60% is substantive: *Does the "Communicative Attempt" create a normative residue if it fails to become a "Social Transaction"?*

  **On Dead Ends:**
  We identify one hard crux where neither side admits a possible concession:
  *   **The Brute Fact of Social Reality:** IC holds that social reality is an objective layer of existence distinct from individual psychology. TC holds that social reality is a shorthand for aggregated psychology.
  *   **Admission:** IC admits no test could prove "rules" exist independently of minds. TC admits no test could prove "intentions" matter if the community unanimously rejects them.
  *   **Status:** This is a metaphysical stalemate. We agree to treat it as a **pragmatic choice**: Use IC models for legal/state contexts (where rules dominate) and TC models for interpersonal/ethical contexts (where intent dominates).

  **Signed:**
  *The Institutional Camp*
  *The Intentional Camp*
