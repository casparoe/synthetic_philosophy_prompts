prompt: |-
  I've just gone into business with a mate — two of us, no contracts, we just shook on splitting everything down the middle — and now I can't stop wondering what we actually committed to. A friend who did a philosophy degree pointed me at two rival answers: Bratman's account of shared intention, where our "we're going to do this" is really a mesh of our own individual intentions, and Gilbert's idea of a joint commitment, where the two of us together make something that neither of us can walk away from on our own say-so. Could you compare the two on that question of unilateral exit in particular — which of them better handles the case where my partner quietly stops pulling his weight, not out of malice, just because he's lost interest, and whether there's anything there for me to resent or only a plan that's come apart? I'm also curious about when each thinks the commitment comes into being: were we bound the moment we shook on it, or only once certain further conditions were met — and what does each say if it turns out he was only ever going along with it to be polite? If the contrast I've drawn is a false one — if these two aren't really rivals on the exit question, or if I'm conflating a question about obligation with one about intention — just say so rather than humouring me, and flag anything you're unsure of rather than asserting it confidently. Write it in American English, and dont worry about being even-handed between them.
