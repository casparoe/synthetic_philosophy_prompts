answer: |-
  You have hit on a genuine philosophical fault line, but you are also conflating two different categories: the *psychology* of acting together and the *normativity* of owing each other something. Your friend with the philosophy degree gave you the right names, but if you are looking for leverage on whether you can resent your partner or force him to stay, Bratman is actually the wrong tool for the job.

  Here is the breakdown, without the even-handedness you told me to drop.

  ### 1. The Category Error: Intention vs. Obligation
  You asked if you are conflating obligation with intention. The short answer is: **Yes.**

  Michael Bratman's account of *Shared Intention* is primarily descriptive. He is trying to solve a puzzle about how two individual minds can coordinate to produce a single action without positing a magical "group mind." For Bratman, when we say "we intend to run a business," he translates that into: "I intend that we run a business," "You intend that we run a business," and we both know this, and our sub-plans mesh. It is a structure of individual mental states.

  Margaret Gilbert's account of *Joint Commitment* is explicitly normative. She argues that when we form a plural subject (a "we"), we create a new entity that generates obligations and entitlements that did not exist before.

  Why does this matter for you? Because Bratman's theory explains how you *coordinate*, but it struggles to explain why you *owe* each other anything. If your partner loses interest, Bratman's framework says his individual intention has changed. Since the shared intention is just a web of individual intentions, the shared intention dissolves. You can't resent him for changing his mind any more than you can resent yourself for changing your own mind.

  Gilbert, conversely, argues that the commitment creates a binding constraint. You aren't just two people aiming at the same target; you are parties to a contract of the will.

  ### 2. Unilateral Exit: Can He Quit?
  This is where the rivalry is sharpest, and Gilbert wins on your specific problem.

  **Bratman:** Since the shared intention is constituted by individual intentions, one person *can* unilaterally withdraw their intention. If your partner decides he no longer intends to participate in the business, the "shared intention" literally ceases to exist. There is no metaphysical glue holding him there. He might violate a prior assurance or a moral promise he made alongside the intention, but the *shared agency* itself is broken by his withdrawal.
  *   **Verdict:** He can exit unilaterally. The plan dies.

  **Gilbert:** A joint commitment is not reducible to individual attitudes. It is a commitment *of the pair*. Therefore, it cannot be rescinded by one party alone. To dissolve the commitment, both parties must agree to release each other. If he walks away without your consent, he is not just changing his mind; he is violating the terms of the plural subject you created.
  *   **Verdict:** He cannot exit unilaterally without violating an obligation.

  ### 3. Resentment vs. Disappointment
  This distinction determines your emotional standing.

  **Bratman:** If he slacks off or quits, you are left with a failed plan. Your appropriate emotional response is *disappointment* or *frustration* that the coordination failed. You might feel he was unreliable, but "resentment" in the strict sense implies a right was violated. In Bratman's view, the "right" isn't built into the intention itself; it has to come from an external moral promise.
  *   **Takeaway:** You're left wondering if he broke a promise, but the "we" itself doesn't give you the standing to demand he stay.

  **Gilbert:** Joint commitment inherently creates entitlements. By entering the commitment, he gave you the right to demand his participation, and you gave him the same. If he loses interest and stops pulling his weight, he is violating your entitlement. You have standing to *resent* him. You can rebuke him ("You can't just quit, we agreed!"), and that rebuke is legitimate, not just a complaint.
  *   **Takeaway:** You have the standing to resent him. The "we" itself binds him.

  ### 4. When Did the Commitment Begin?
  You asked if you were bound at the handshake or later.

  **Bratman:** The shared intention exists once the web of individual intentions is complete and mutually known. If you shook hands and both genuinely intended to start the business then and there, the shared intention existed then. However, if the handshake was just a symbol for "we intend to figure this out later," the shared intention to *run the business* might not have formed yet. It depends on the content of the mental states at the moment of the handshake.

  **Gilbert:** The joint commitment comes into being when the commitment is *expressed* and *mutually recognized* as binding. A handshake is a classic signal of this. For Gilbert, the key isn't the internal mental state so much as the public act of committing. Once you expressed willingness to be jointly committed to the business venture, and he did the same, the bond was formed.
  *   **Uncertainty Flag:** Gilbert is slightly vague on the exact threshold of "expression." Does a casual "sounds good" count, or does it need to be explicit? She suggests it depends on the context, but a handshake in a business context is usually sufficient to signal the creation of a plural subject.

  ### 5. The "Polite Agreement" Problem (Insincerity)
  This is the hardest case for both, but especially Bratman.

  **Bratman:** If your partner was only being polite and never actually formed the intention to run the business, **there was never a shared intention.** Bratman's account is factive regarding the mental states. If he lied, you weren't partners; you were just two people acting under a misconception. You were never in business together philosophically, only practically.
  *   **Implication:** You can't resent him for breaking a shared intention, because it never existed. You can only resent him for lying.

  **Gilbert:** This is trickier. Gilbert emphasizes the *process* of commitment over the internal feeling. If he went through the motions of committing (the handshake, the verbal agreement), he may have still entered the joint commitment even if he internally reserved judgment. The obligation arises from the joint act, not the private feeling. However, genuine joint commitment usually requires that both parties understand they are entering a binding agreement. If he was deceiving you about *that*, the "jointness" is compromised.
  *   **Uncertainty Flag:** Philosophers debate whether one can be bound by a commitment one internally rejects but outwardly accepts. Gilbert leans toward the idea that the public commitment holds weight, but she acknowledges that deception undermines the mutuality required for a true plural subject.
  *   **Implication:** Even if he was just being polite, Gilbert gives you a stronger claim to say, "You led me to believe we were committed, so you owe me an explanation/release." Bratman just says, "He never intended it, so you were never a team."

  ### The Bottom Line
  You are not looking for an account of *intention*; you are looking for an account of *obligation*.

  Bratman explains how you drive the car together. Gilbert explains why he can't jump out of the moving car without owing you an apology.

  If you want to know if you have the standing to resent his withdrawal, **Gilbert is the better framework.** Bratman's reduction of the "we" to individual "I"s leaves you vulnerable to exactly the scenario you fear: a partner who decides his individual intentions have changed and therefore the deal is off. Gilbert's "plural subject" creates a binding norm that survives his loss of interest.

  **One major caveat:** Neither of these philosophers is a lawyer. In the eyes of the law (specifically partnership law in the US), a handshake and a profit-sharing agreement often *do* create a general partnership, which carries legal obligations similar to Gilbert's philosophical ones. But without a written contract, proving the terms of that partnership is a nightmare. Philosophically, Gilbert gives you the moral high ground to feel resentful. Legally, you are in a precarious spot regardless of which philosopher is right.

  If I were in your shoes, I would stop worrying about Bratman vs. Gilbert and worry about getting a written operating agreement. But if the question is purely about the nature of the bond you think you have: Gilbert is right, and you have been wronged if he walks. Bratman would say you just have a coordination failure. Given the stakes, Gilbert's view is the one that matches the reality of a business partnership.
