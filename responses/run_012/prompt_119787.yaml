answer: |-
  This is one of the most famous and important puzzles in the history of economic thought, and you have put your finger on exactly what makes Hume's *Of Money* (1752) so sophisticated.

  The short answer is: **Hume is not inconsistent.** You have correctly identified the distinction between the **long-run equilibrium** (where money is neutral) and the **short-run transition** (where money has real effects). In fact, Hume is widely credited by economists (including Keynes and Friedman) as being one of the first thinkers to clearly articulate this distinction.

  Here is how to reconcile the two halves of the essay for your reading group.

  ### 1. The "Oil" Metaphor and Long-Run Neutrality
  When Hume calls money the "oil" and not the "wheels," he is arguing against the **Mercantilists**.

  The Mercantilists believed that a nation's wealth consisted of its stock of gold and silver. They thought the goal of trade was to hoard bullion. Hume is saying: *No.* The wealth of a nation is its goods and labor (the wheels). Money is just the lubricant that helps those goods move around.

  This leads to his **Quantity Theory of Money** claim: If you double the amount of oil in the engine, the engine doesn't run twice as fast; it just gets messier. Similarly, if you double the money supply in a kingdom, you don't double the wealth; you just double the prices.
  *   **The Henry VII Example:** A crown then bought the same labor as a pound now. The *nominal* amount changed, but the *real* purchasing power remained tied to the actual goods and labor available.
  *   **The Conclusion:** In the long run, once prices have fully adjusted, the quantity of money is of "no consequence" to real economic variables (output, employment, real wages).

  ### 2. The Short-Run Stimulus (The "Interval")
  You noticed that Hume later says an influx of gold *does* stimulate industry. This is not a contradiction; it is a description of the **dynamic adjustment process**.

  Hume explicitly addresses this in a crucial passage:
  > *"It is only in this interval or intermediate situation, between the acquisition of money and rise of prices, that the increasing quantity of gold and silver is favourable to industry."*

  Here is the mechanism Hume describes (which modern economists sometimes call the **Cantillon Effect**):
  1.  **Money enters at specific points:** New gold doesn't fall like rain equally on everyone. It enters via miners, or merchants, or the state.
  2.  **Spending increases:** These people spend the new money.
  3.  **Prices rise first, wages lag:** Demand for goods goes up, so merchants raise prices. However, wages do not rise immediately. Workers are willing to work harder for the same nominal wage because they don't yet realize prices have gone up (or because they are hungry for employment).
  4.  **Production expands:** Merchants see higher prices and higher profits, so they hire more workers and increase production.
  5.  **Equilibrium returns:** Eventually, the money circulates everywhere. Prices for all goods rise, and workers demand higher wages to match. Once wages catch up to prices, the profit incentive vanishes, and industry returns to its previous level.

  ### 3. Reconciling the Two
  So, to answer your specific questions:

  **Is the "of no consequence" line meant only as a long-run comparison?**
  **Yes.** Hume is making a distinction between the *final state* and the *journey*.
  *   **Final State:** Money is neutral. More money = higher prices, same output.
  *   **The Journey:** Money is non-neutral. More money = higher demand, higher output, more employment *temporarily*.

  **Is Hume inconsistent?**
  **No.** He is describing a time-lag. If money adjusted instantly (perfect information, flexible wages), his two claims would contradict. But Hume recognizes that prices and wages are "sticky." He understands that the economy is a dynamic machine, not a static equation.

  **What does the "oil" metaphor rule out?**
  It rules out the idea that **money is wealth**.
  *   It commits him to the **Long-Run Quantity Theory**: Prices are proportional to the money supply eventually.
  *   It does *not* commit him to the idea that money is irrelevant to the *process* of production. In fact, Hume argues that a *moderate* increase in money is actually beneficial for a state, precisely because of that transition period. He writes: *"A state feels the happy effects of [an increase in money], as long as it lasts... but it is in vain to look for permanent advantages from this source."*

  ### Summary for your Reading Group
  You can frame Hume's argument like this:
  1.  **Metaphysical Point:** Money is a tool for exchange, not the object of value itself (The Oil).
  2.  **Long-Run Prediction:** If you increase the money supply, prices will eventually rise proportionally, leaving real wealth unchanged (Neutrality).
  3.  **Short-Run Observation:** Because prices adjust faster than wages, an increase in money temporarily boosts profits and employment, stimulating the "wheels" of trade before the "oil" level normalizes (Non-Neutrality).

  Hume's genius lies in holding both thoughts at once: Money doesn't matter in the end, but the *process* of getting more money wakes the economy up. This makes him a precursor to both Classical Economics (long-run neutrality) and Keynesian/Monetarist Economics (short-run importance of monetary shocks).
