      *   **The Opposition (Steel-manning):** This is crucial. I need to articulate the "Double Taxation," "Avoidance," and "Parental Rights" arguments without making them sound weak.
          *   *Double Tax:* Income was taxed, now it's taxed again.
          *   *Avoidance:* Gifts before death bypass this.
