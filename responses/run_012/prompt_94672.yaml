          *   *Expert View:* Linguistic anthropology suggests "corruption" isn't always a distinct semantic category. In some contexts, "gift," "obligation," and "theft" overlap. The definition "public office for private gain" is a Weberian/legalistic definition, not necessarily a folk category everywhere.
          *   *Verdict:* **Wince/False.** "Universal category" is too strong. The definition is contested.

      *   *Sentence 3:* "Clientelism is just corruption organized through networks instead of cash: a politician hands over a job or a sack of rice and gets a vote back, which is a bribe with better manners."
          *   *Expert View:* Political science distinguishes clientelism (long-term reciprocal relationships, often asymmetric but socially embedded) from bribery (one-off transactional exchange). Collapsing them ignores the social safety net function clientelism often serves in weak states.
          *   *Verdict:* **Wince.** Too reductive. Ignores the social contract aspect.

      *   *Sentence 4:* "Gift-giving is the same transaction in traditional dress, and the anthropologists who insist it follows a different logic are describing the wrapping, not the present."
          *   *Expert View:* This is the biggest flashpoint. Mauss, Graeber, etc., argue gift economies create social bonds, whereas bribes sever them (or are purely instrumental). Calling a wedding gift a "bribe" destroys the analytical utility of both terms.
          *   *Verdict:* **Flat Wrong.** This is the core anthropological objection.

      *   *Sentence 5:* "The countries that look clean are the ones that industrialized first and professionalized their civil services; there's no cultural secret, just development."
          *   *Expert View:* Historically plausible (e.g., US Gilded Age to Progressive Era). However, it implies a deterministic linear path ("just development") which ignores that some developing nations reduce corruption without full industrialization, and some developed nations retain high-level corruption (lobbying/revolving door).
