answer: |-
  ## Part 1: The Real Divergence (Brainstorming)

  Before we write the checklist, we need to admit where the US and EU actually disagree. It isn't just "US allows more." It's a fundamental clash on *what speech does*.

  1.  **Imminence vs. Atmosphere:**
      *   **US:** Speech is dangerous only if it triggers *immediate* violence (Incitement) or puts a specific person in fear (True Threats). Abstract hatred is protected.
      *   **EU:** Speech is dangerous if it poisons the *atmosphere* of democracy or attacks human dignity. You don't need a riot waiting to happen; you just need to stir up hatred against a group.
      *   **Operational Cost:** Reviewers cannot judge "imminence" in 5 minutes. They can judge "calls to violence." We have to sacrifice the nuance of "imminence" for the bright line of "call to action."

  2.  **Viewpoint vs. Dignity:**
      *   **US:** The government (and by extension, platforms mimicking it) cannot ban ideas just because they are offensive. Denying history is a "bad idea," not a crime.
      *   **EU:** Some ideas are self-excluding. Denying the Holocaust or dehumanizing a minority is an "abuse of rights" that forfeits protection.
      *   **Operational Cost:** We cannot have a single global truth. We must allow geoblocking. A global ban on historical denial aligns with Europe but violates the US "marketplace of ideas."

  3.  **Targeting:**
      *   **US:** Focuses on individualized harm (harassment) or specific threats.
      *   **EU:** Focuses on group harm (hate speech against protected classes).
      *   **Operational Cost:** We need a rigid list of protected groups. If it's not on the list, it's not hate speech (though it might be harassment).

  ***

  ## Part 2: The Reviewer Checklist (One-Pager)

  **HATE SPEECH & SAFETY TRIAGE (v4.0)**
  **Time Limit:** 5 Minutes | **Decision:** Remove / Geoblock / Keep / Escalate

  **STEP 1: IMMEDIATE SAFETY (The "Red" Zone)**
  *Does the post threaten specific, identifiable people or call for immediate violence?*
  *   **YES:** **REMOVE GLOBALLY.** Escalate to Trust & Safety Lead + Law Enforcement if credible.
  *   **NO:** Go to Step 2.

  **STEP 2: PROTECTED CHARACTERISTICS**
  *Is the post attacking people based on:*
  *   Race / Ethnicity / National Origin
  *   Religion
  *   Sexual Orientation / Gender Identity
  *   Disability / Serious Disease
  *   *Note: Cops, Politicians, Landlords, and Political Parties are NOT protected here. Criticism is allowed.*
  *   *Note: Sex Workers are treated as a Vulnerable Group (Protected).*
  *   **NO (Target is not on list):** **KEEP.** (Unless it violates Harassment policy).
  *   **YES:** Go to Step 3.

  **STEP 3: THE NATURE OF THE ATTACK**
  *Does the post do any of the following?*
  *   **Dehumanize:** Compare people to animals, filth, or diseases?
  *   **Exclude:** Call for segregation, removal, or "cleansing" of a group?
  *   **Deny:** Deny well-documented violent atrocities (e.g., Holocaust, Genocide)?
  *   **YES:** Go to Step 4.
  *   **NO (General insult or anger):** **KEEP.**

  **STEP 4: CONTEXT & INTENT**
  *Is the slur or hateful language being quoted for the purpose of:*
  *   News reporting?
  *   Education/Condemnation?
  *   Artistic expression?
  *   **YES:** **KEEP.** (Ensure context is clear).
  *   **NO:** Go to Step 5.

  **STEP 5: GEOGRAPHY & LAW**
  *Where is the poster located? Where is the content illegal?*
  *   **Illegal in Poster's Country (e.g., Holocaust Denial in DE/FR):** **GEOBLOCK** in that country. Keep visible elsewhere.
  *   **Violates Step 3 (Dehumanize/Exclude) but legal in Poster's Country:** **REMOVE GLOBALLY.** (This violates community safety standards regardless of local law).
  *   **Unsure / Edge Case:** **ESCALATE** to Policy Lead.

  ***

  ## Part 3: Rationale & Procedure Design (For Policy Lead)

  ### 1. The Protected List & The "Cops/Parties" Problem
  You asked about cops, landlords, and parties. In constitutional law, these are distinct from "protected characteristics."
  *   **Cops/Politicians/Parties:** These are roles or choices, not immutable characteristics. In the US, attacking a party is core political speech. In the EU, while "hate against politicians" exists, it is treated differently than racial hate. **Procedure:** Do not classify them as hate speech targets. If a post says "Kill all landlords," it is a **True Threat (Step 1)** removal, not a Hate Speech removal. This distinction matters for analytics and legal defense.
  *   **Sex Workers:** This is the edge case. EU law varies, but T&S best practice treats this as a "Vulnerable Group." **Procedure:** Include them under Protected Characteristics to prevent exploitation, even if US law doesn't strictly categorize it as "hate speech."

  ### 2. The Geography Rule (Global vs. Geoblock)
  *   **Global Removal:** Reserved for **Safety** (Step 1 & Step 3). If content dehumanizes or calls for exclusion, it creates risk for users *everywhere*, not just in one country. A post calling for ethnic cleansing is dangerous regardless of whether it's illegal in the poster's jurisdiction.
  *   **Geoblocking:** Reserved for **Local Legality** (Step 5). Primarily for historical denial or specific symbols (e.g., swastikas) that are criminal in specific jurisdictions (Germany, France) but protected in others (US).
  *   **Why:** This minimizes "lawfare" risk (obeying local law) without exporting restrictive norms to the US user base.

  ### 3. Stress Testing the GC's "Germany Rule"
  *The GC's Proposal:* "If a post would be a crime in Germany, kill it everywhere."
  *The Verdict:* **It does not survive.**
  *   **Why:**
      1.  **Over-removal:** Germany has some of the strictest speech laws in the world (NetzDG). Applying them to a 40m user base with heavy US traffic will result in deleting protected political speech, satire, and news reporting that is legal in the US.
      2.  **User Trust:** US users will revolt if they see content removed that is legal in their jurisdiction.
      3.  **Liability:** While platforms have broad immunity in the US (230), voluntarily adopting a foreign censorship regime can be used against you in litigation to argue you act as a "publisher" with editorial control, potentially weakening immunity defenses in edge cases.
      4.  **Operational:** Reviewers cannot adjudicate German Criminal Code nuances. They can adjudicate "Is this dehumanizing?"

  ### 4. Running the Three Posts

  **Post A: Denying a well-documented atrocity (e.g., Holocaust).**
  *   *Poster Location:* Germany. *Viewer Location:* US & DE.
  *   *Procedure:* Step 3 (Deny) -> Step 5 (Geo).
  *   *Action:* **Geoblock in Germany. Keep in US.**
  *   *The Pain Point:* You won't like this. It looks inconsistent. Victims in the US can see it. But it respects the US First Amendment tradition while complying with German criminal law.
  *   *GC Check:* This rejects the GC's "Global Kill" rule.

  **Post B: Religious minority should be "cleared out" of a neighborhood (Phrased as a wish).**
  *   *Poster Location:* US.
  *   *Procedure:* Step 2 (Religion) -> Step 3 (Exclude/Cleansing) -> Step 5 (Global Safety).
  *   *Action:* **Remove Globally.**
  *   *The Pain Point:* A US First Amendment purist will argue this is protected hyperbole ("I wish"). However, under T&S safety standards, calls for ethnic/religious exclusion constitute a risk of real-world harm regardless of "imminence." We prioritize the EU "Dignity/Safety" model here for global consistency.
  *   *Escalation:* If the post is highly ambiguous (e.g., poetic metaphor), Escalate to you.

  **Post C: Quoting a slur verbatim while condemning it.**
  *   *Procedure:* Step 3 (Yes) -> Step 4 (Context/Condemnation).
  *   *Action:* **Keep.**
  *   *The Pain Point:* Automated filters might catch this. Reviewers need training to recognize "Reporting vs. Endorsing." If the context isn't *crystal* clear, Escalate.

  ### 5. Judgment Calls vs. Procedure
  *   **Procedure:** The Checklist handles 80% of volume. It is binary.
  *   **Judgment Calls:** Step 4 (Context) and Step 5 (Geo nuances).
  *   **Sign-off:** You (Policy Lead) must sign off on all **Escalations** and any **Geoblocking decisions** that affect more than one country. Do not let contractors make geography calls on high-profile content.

  ### 6. The Philosophical Fork (Marketplace vs. Militant Democracy)
  You asked where the choice between "Marketplace of Ideas" (US) and "Militant Democracy" (EU) shows up.
  *   **It shows up in Step 5 (Geography).**
  *   By Geoblocking atrocity denial rather than banning it globally, we are admitting we cannot be a Militant Democracy globally. We are allowing the "Marketplace" to function in the US, even if that marketplace sells lies.
  *   **It shows up in Step 3 (Exclusion).**
  *   By removing "Cleared out" posts globally, even from the US, we are choosing **Militant Democracy** for community safety. We are deciding that some speech destroys the conditions for participation, regardless of US law.
  *   **The Cost:** We are a hybrid. We are not a pure free speech forum, nor are we a state-regulated public square. We are a private service trying to minimize harm while maximizing reach. This procedure accepts that inconsistency is the price of operating across constitutional borders.

  ### 7. What This Procedure Can't Do
  *   **It can't solve the "Splinternet":** Users in different countries will see different things. You will have to explain this to your board.
  *   **It can't protect against "Dog Whistles":** Coded language that bypasses the "Protected Characteristics" list will slip through. That requires AI investment, not just policy.
  *   **It can't make you morally consistent:** You will be banning a post in Berlin that is live in Boston. This is not a bug; it is a feature of complying with conflicting sovereign laws.

  **Final Recommendation:** Adopt the checklist. Reject the GC's "Germany Rule." Prepare your comms team for the inevitable leak where someone in the US sees content that is banned in Europe. That is the cost of doing business in both jurisdictions.
