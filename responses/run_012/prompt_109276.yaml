prompt: |-
  I just spent two hours argueing with a friend about whether Hume's Law is actually dead, and now I have to write the final for my upper-level metaethics seminar. I want one essay question that makes them keep three things apart: the is-ought gap, Moore's naturalistic fallacy, and the logical counterexamples everyone trots out (Prior's disjunction trick, Searle's promise derivation). It should not be answerable by reciting the standard line that Hume says no ought from is, Searle says yes, Prior says look at disjunction. I want them to say exactly where the action is in each case: what premise or inference rule is doing the work, whether the conclusion is substantive, and what the strongest surviving version of Hume's Law would be, if there is one, and whether that version is substantive or trivial. They also need to say why the naturalistic fallacy is not just the is-ought gap; that conflation keeps showing up in their papers and I'm sick of it.

  Give it to me in four sections, in this order:
  1. The question — 100-150 words, aimed at a 90-minute exam essay.
  2. Model answer — around 700 words, the kind of answer that would get full marks.
  3. Marking scheme — a list of must-hit moves, each with a point value, totaling 20. Seperate an A from a B by naming the specific moves each must contain. Add two bonus moves that would push it into A+ territory.
  4. Common wrong turns — 4 bullets, one line each, naming the specific mistake and why it costs marks.

  Don't quote Hume or Moore or Prior directly. No citations, no reading lists. Just explain the positions in plain prose.
