answer: |-
  1. The question

  Evaluate the contention that Hume's Law is obsolete. You must rigorously distinguish the logical is-ought gap from Moore's naturalistic fallacy; explain why conflating these distinct barriers undermines the debate. Analyze standard logical counterexamples, specifically disjunction introduction and institutional facts like promising. Do not merely recount these cases; identify the specific inference rule or hidden premise enabling the derivation and assess whether the resulting conclusion is substantive. Finally, formulate the strongest surviving version of the gap. Determine whether this surviving version constitutes a trivial logical truth or a substantive metaethical constraint, and justify your classification based on its implications for naturalistic reductionism.

  2. Model answer

  The debate regarding the viability of the barrier between description and normativity often stalls because participants conflate two distinct philosophical problems. The first is logical: whether a normative conclusion can be validly inferred from purely descriptive premises. The second is semantic: whether moral properties can be defined as natural properties. Confusing these leads to the erroneous belief that refuting the logical gap automatically refutes non-naturalism, or that defending non-naturalism requires accepting a rigid logical barrier. One can maintain that moral terms are indefinable while accepting that logical derivations are possible under specific conditions, or vice versa. Clarity here is prerequisite to assessing the counterexamples.

  Standard logical counterexamples attempt to show that normative sentences can follow from descriptive ones. The disjunction case argues that from a descriptive statement, one can infer a disjunction containing a normative clause. While logically valid under standard inference rules, this derivation fails to threaten the spirit of the barrier because the conclusion is normatively inert. The agent is not committed to the normative clause specifically, only to the disjunction. The inference rule works, but the conclusion lacks the action-guiding force required of a substantive moral claim. Thus, this counterexample succeeds syntactically but fails pragmatically.

  The institutional fact case, involving promises, argues that descriptive facts about social institutions entail normative obligations. However, this derivation relies on a hidden bridge principle. To move from "he promised" to "he ought to keep it," one must assume a constitutive rule that promising creates obligations. This rule is itself normative. Therefore, the premises are not purely descriptive. The gap remains intact between pure description and normativity; the derivation only works by smuggling a normative assumption into the description of the institution. These counterexamples show that strict syntactic derivability is possible, but only at the cost of triviality or hidden normativity.

  Consequently, the strongest surviving version of the law is not that no sentence containing normative vocabulary follows from descriptive vocabulary. Rather, it is that no substantive normative conclusion follows from purely descriptive premises without a normative bridge principle. This formulation avoids the syntactic counterexamples while preserving the core insight that description alone cannot generate normativity.

  The final question is whether this surviving version is trivial or substantive. It is trivial if viewed merely as a point about logical vocabulary: if normative terms have different logical properties than descriptive terms, obviously one cannot derive one from the other without a connecting rule. However, it is substantive if understood as a constraint on metaethical theory. If the gap holds, moral properties cannot be identical to natural properties, because identity would allow seamless derivation. Thus, the law functions as a substantive barrier against analytic naturalism. It protects the autonomy of ethics by insisting that any reduction of morality to science must explain away the normative force rather than derive it. Therefore, the law is not dead, but it must be understood as a substantive constraint on reductionism rather than a simple syntactic rule.

  3. Marking scheme

  **Total Points: 20**

  1.  **Conceptual Distinction (5 pts):** Clearly distinguishes the logical derivability claim (Hume) from the semantic definition claim (Moore). Explains why conflating them leads to category errors in the debate.
  2.  **Prior Counterexample Analysis (2.5 pts):** Identifies that the inference rule is valid but argues the conclusion is normatively trivial or inert.
  3.  **Searle Counterexample Analysis (2.5 pts):** Identifies that the derivation relies on a hidden normative bridge principle or constitutive rule.
  4.  **Surviving Version Formulation (5 pts):** Formulates a precise version of the law (e.g., no substantive ought from pure is) that avoids the syntactic counterexamples.
  5.  **Trivial vs. Substantive Verdict (5 pts):** Takes a definite stance on the status of the surviving version and justifies it via implications for reductionism or naturalism.

  **Grade Differentiation:**
  *   **A Grade:** Must hit all five criteria with precision. Specifically, must identify the *mechanism* of failure in the counterexamples (triviality/hidden premise) rather than just describing them. Must take a definitive stance on the trivial/substantive question.
  *   **B Grade:** Distinguishes the concepts and describes the counterexamples but treats them superficially (e.g., says they are "controversial" without explaining why). Hedges on the final verdict regarding triviality.

  **Bonus Moves (A+ Territory):**
  *   **Bonus 1:** Notes that the gap protects the autonomy of ethics regardless of ontological commitment (applies to expressivists and realists).
  *   **Bonus 2:** Distinguishes between syntactic derivability and semantic entailment in the analysis of the surviving version.

  4. Common wrong turns

  *   Treating Hume's Law and the Naturalistic Fallacy as identical ignores the semantic versus logical distinction.
  *   Accepting Prior's counterexample without noting the normative inertness of the conclusion.
  *   Accepting Searle's derivation without identifying the hidden normative bridge principle.
  *   Asserting the surviving law is trivial without explaining whether it blocks reductionism.
