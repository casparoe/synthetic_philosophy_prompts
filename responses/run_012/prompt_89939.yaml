          4.  Specify conditions for changing the mind (what would make the residue a defect of the framework?).
          5.  Admit where the translation is most likely wrong.

  2.  **Deconstruct the Philosophical Concepts:**
      *   **First-Order Evidence (FOE):** Evidence directly supporting a proposition (e.g., "The cache works"). In engineering: Tests passing, logic walkthroughs.
      *   **Higher-Order Evidence (HOE):** Evidence about the reliability of the process generating the belief (e.g., "My tests are flawed"). In engineering: Code review feedback, monitoring data showing edge cases tests missed, historical error rates of similar implementations.
      *   **Epistemic Akrasia:** Holding a belief $P$ while believing that holding $P$ is irrational/unjustified. "I believe the cache works, but I believe I shouldn't believe that."
      *   **The Regress:** If HOE undermines FOE, do you need Higher-Higher-Order Evidence to validate the HOE? And so on.

  3.  **Drafting the Translation (Engineering Vocabulary):**
      *   *Proposition:* "The cache invalidation logic is correct."
      *   *First-Order Evidence:* Unit tests pass, integration tests pass, manual trace.
      *   *Higher-Order Evidence:* The Senior Engineer's review. "Your test coverage metric is 90%, but it doesn't cover race conditions." This is metadata about the test suite's reliability.
      *   *The Conflict:* The CI pipeline says `GREEN`. The Code Review says `CI GREEN IS NOT SUFFICIENT`.
      *   *Akrasia:* Merging the PR while tagging it as "Unverified Risk." Or mentally marking it "Done" while knowing the "Definition of Done" wasn't met.
