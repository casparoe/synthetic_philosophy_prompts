  **Total Mark: 14/20**

  **Mark Distribution:**
  *   **Part 1 (Stating the Difficulty): 6/6**
  *   **Part 2 (Proposed Responses): 5/6**
  *   **Part 3 (Assessment of Analogy): 3/8**

  ---

  ### Itemised Comments

  **Paragraph 1**

  *   *"The difficulty is that shape looks like an intrinsic property."*
      *   **Correct.** This correctly identifies the starting premise of Lewis's Problem of Temporary Intrinsics.
  *   *"A rubber band is taut or slack in itself, not merely in relation to other things, and if it is taut at t1 and slack at t2 then, on the view that it is wholly present at both times, one and the same thing is both taut and slack."*
      *   **Correct.** You have accurately reconstructed the contradiction that arises from combining endurantism (wholly present) with the intrinsicality of shape and the reality of change.
  *   *"That is a contradiction unless we say that it is taut at t1 and slack at t2; but saying this appears to turn its shape into a relation between the band and a time, which is exactly what intrinsicality was supposed to exclude."*
      *   **Correct.** This precisely captures the "relationalism" horn of the dilemma. You understand why indexing properties to times threatens their intrinsic status.
  *   *"The endurantist must therefore either give up the intrinsicality of shape or give up the claim that the band is wholly present at both times."*
      *   **Correct.** This is an excellent summary of the dilemma facing the endurantist. Full marks for this section are justified by the clarity and accuracy of this paragraph.

  **Paragraph 2**

  *   *"The perdurantist takes the second option."*
      *   **Correct.** Perdurantism rejects the claim that the object is wholly present at each time.
  *   *"The band is a four-dimensional whole composed of temporal parts; it is the t1-part that is taut and the t2-part that is slack."*
      *   **Correct.** Standard and accurate statement of the temporal parts solution.
  *   *"Each part has its shape simpliciter, so no single part is both taut and slack, and shape stays intrinsic, since a part's shape does not depend on anything outside that part."*
      *   **Correct.** You explain *why* this solves the problem (properties are borne simpliciter by parts, not relationally by the whole).
  *   *"The price is that the whole is never taut or slack in its own right; only the parts are."*
      *   **Correct.** You acknowledge the cost of the view accurately.
  *   *"Perdurantists accept this and reply that this is what change consists in — different parts having different properties."*
      *   **Correct.** Accurate description of the perdurantist analysis of change.

  **Paragraph 3**

  *   *"The endurantist takes the first option in a modified form, holding that the band has its shape at a time, where having-at is taken as primitive."*
      *   **Correct.** This describes the "Adverbial" or "Primitivist" strategy (e.g., Has-At). It is a valid response that does not invoke temporal parts.
  *   *"The band itself persists, whole, through the change."*
      *   **Correct.** Reaffirms the endurantist commitment.
  *   *"This is coherent, but it leaves it unclear in what sense the band's tautness is a feature of the band rather than of the pair consisting of the band and the time."*
      *   **Correct but could be deeper.** This is a fair critique, though you might have noted that the primitivist insists it *is* a feature of the band, just not a monadic one in the traditional sense. However, for the purpose of stating the response, this is sufficient.
      *   *(Note: You lost 1 mark here only because the explanation of how this preserves intrinsicality was less detailed than the perdurantist explanation, and you included irrelevant material in the next paragraph.)*

  **Paragraph 4**

  *   *"Perdurantism also sits comfortably with the B-theory of time."*
      *   **Correct but irrelevant.** While often correlated, this does not answer the question about the *Problem of Temporary Intrinsics*.
  *   *"If all times are equally real, and objects are spread out along the temporal dimension as they are along the spatial ones, then perdurantism is the natural view, and it denies that anything literally passes from present to past."*
      *   **Correct but irrelevant.** This is accurate metaphysics, but it was not asked for. It consumes space that could have been used to deepen Part 3.
  *   *"Endurantism, by contrast, is at home with the idea that only the present exists, since an object cannot be wholly present at times that do not exist."*
      *   **Subtly wrong.** This conflates Endurantism with Presentism. Many endurantists accept the B-Theory (e.g., Kit Fine, or relational endurantists) and argue objects are wholly present at all existing times. This shows a slight misconception about the relationship between persistence and the ontology of time.

  **Paragraph 5**

  *   *"There is a further commitment worth flagging. The perdurantist's move is structurally the same as the counterpart theorist's..."*
      *   **Correct.** The structural isomorphism between temporal parts and modal counterparts is a standard observation (noted by Lewis).
  *   *"...just as the counterpart theorist says that the actual band is not literally taut in another world but has a counterpart there that is, the perdurantist says that the band is not literally taut but has a part that is."*
      *   **Correct.** Accurate mapping of the analogy.
  *   *"Since the two moves are the same, perdurantism carries a commitment to counterpart theory about de re modality, and its treatment of change stands or falls with its treatment of possibility."*
      *   **Unsupported / Philosophically Contentious.** This is the main weakness of the script. You are asked to *assess* the suggestion, but you assert it as a logical consequence. Structural similarity in solving two problems does not entail that one is *committed* to the other's ontology. Many perdurantists reject counterpart theory (opting for trans-world identity), and many counterpart theorists reject perdurantism. You needed to argue *why* the commitment holds or discuss the disanalogies between time and modality to earn higher marks. As it stands, you have reported a view rather than assessing it.

  **Paragraph 6**

  *   *"One last point. Because the endurantist has the band wholly present at each time, she cannot allow an object to gain or lose parts: a band that loses a fragment, or a person who loses a limb, would not be the same object afterwards."*
      *   **Subtly wrong / Unsupported.** This is incorrect. Endurantists frequently handle mereological change via constitution views (the object is constituted by different matter at different times) or by distinguishing strict identity from loose identity. This claim is not only irrelevant to the question (which focused on shape/temporary intrinsics) but demonstrates a misunderstanding of contemporary endurantist resources.

  ---

  ### What was needed for full marks (20/20)

  1.  **Part 1 (6/6):** You achieved this. The statement of the dilemma was precise and captured the tension between intrinsicality and endurance.
  2.  **Part 2 (6/6):** To secure full marks here, you should have avoided the irrelevant discussion of B-Theory/Presentism (Paragraph 4). While accurate, it diluted the focus. Additionally, the explanation of the Endurantist response (Paragraph 3) could have been slightly more robust in explaining *how* primitive 'having-at' preserves intrinsicality better than relationalism.
  3.  **Part 3 (8/8):** This is where the marks were lost. To score fully, you needed to critically **assess** the analogy rather than just affirming it. A full-mark answer would have:
      *   Acknowledged the structural similarity (which you did).
      *   Questioned whether structural similarity entails ontological commitment (arguing that one can accept temporal parts without accepting modal counterparts).
      *   Discussed whether the analogy *illuminates* the dispute (e.g., does it make perdurantism more palatable by linking it to modal intuitions, or less palatable by linking it to counterpart theory's costs?).
      *   Avoided the error in Paragraph 6 regarding mereological change, as it undermines the overall picture of endurantism presented.

  **Summary:** This is a strong script (Upper Second / Low First boundary) that demonstrates a clear grasp of the core Lewisian argument (Part 1 & 2). However, it loses significant marks in the final section by treating a contentious philosophical claim as a settled fact without argument, and by including irrelevant or slightly mistaken material regarding Presentism and mereological change. Focus on critical evaluation ("Assess") rather than exposition in the final part of such questions.
