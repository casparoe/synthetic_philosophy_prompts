prompt: |-
  In the United States, the redress program for the World War II incarceration of Japanese Americans consisted of a single flat payment to each person who had been incarcerated and was still alive when the law was enacted, together with a formal government apology and a public education fund; the amount was the same regardless of what a particular family had actually lost, people who had died before enactment received nothing, and eligibility was limited to citizens and legal permanent residents, so some people of Japanese ancestry who had been deported from Latin America and interned in the United States were excluded even though Congress attributed the incarceration to racial prejudice, wartime hysteria, and a failure of political leadership. By contrast, current debates over reparations for slavery and Jim Crow usually concern claimants generations removed from the wrong and are framed in terms of ongoing structural harm rather than a one-time payment to each direct victim. What theory of reparative justice does the Japanese American program presuppose: that the wrong was an individualized injury to be compensated once, that it was primarily a public and racial wrong calling for acknowledgment and institutional reform, or that reparations are mainly a forward-looking instrument for preventing recurrence? Reconstruct the implicit theory as precisely as the practice allows, distinguish what the program strictly presupposes from what it merely fits well with, identify which rival theories of reparations it quietly rules out, and say where it is philosophically underdetermined. Then explain what a program built consistently on a group-based or forward-looking theory would have to do differently, and whether the 1988 design can be defended as a principled choice rather than merely a political compromise. Please answer in American English.
