answer: |-
  # Examination Question

  **Course:** Graduate Seminar in Formal Decision Theory and Ethics
  **Examination:** Final Essay Item
  **Time Allowed:** 90 Minutes
  **Instructions:** Answer the following question in a single coherent essay. Do not cite specific authors or papers; rely on general decision-theoretic reasoning and the case provided.

  **Case:**
  A welfare agency must select exactly one of three one-shot portfolios:
  *   **Safe:** 999 units of welfare with certainty.
  *   **Gamble A:** $10^{12}$ units of welfare with probability $10^{-9}$, and zero otherwise.
  *   **Gamble B:** $10^{12}$ units of welfare with probability $10^{-9} - 10^{-15}$, and zero otherwise.

  The expected values are 999, 1000, and 999.999 units respectively. Note that Gamble A first-order stochastically dominates Gamble B.

  **Prompt:**
  Write an essay that addresses the following four tasks in order:
  1.  State exactly what expected value maximization prescribes for this case and articulate what is supposed to be objectionable about that prescription (the problem of fanaticism).
  2.  Examine the most obvious repair—discarding outcomes whose probability falls below a fixed cutoff—and explain what that repair costs. Specifically, determine whether a rule of this kind can respect first-order stochastic dominance in this case.
  3.  Assess the following proposed alternative: that the cutoff should not be a fixed constant but should instead be indexed to the number of comparable one-shot decisions the agent will ever face, so that an agent facing many such choices across its lifetime is licensed to ignore smaller probabilities than an agent that will face only one.
  4.  Say whether the difference between Gamble A and Gamble B is the kind of difference a theory of rational choice ought to be able to register at all, and defend your answer.

  ***

  # Model Answer

  Expected value maximization prescribes selecting Gamble A. Because $1000 > 999.999 > 999$, the theory mandates choosing the option with the highest mathematical expectation, despite the fact that Gamble A yields zero welfare with probability $0.999999999$. The objectionable feature of this prescription is fanaticism: the theory allows sufficiently large stakes to outweigh sufficiently low probabilities, compelling an agent to ignore near-certainty in favor of astronomically unlikely outcomes. In this case, the agency is required to risk almost certain failure to gain a marginal expected increase of one unit, driven entirely by a one-in-a-billion chance. This contradicts the intuitive normative force of certainty and suggests that expected value theory is insensitive to the distinction between practical possibility and mathematical non-zero probability.

  To avoid fanaticism, one might propose a fixed probability cutoff, below which probabilities are treated as zero. If the cutoff were set at $10^{-8}$, both gambles would be evaluated as having zero expected value, making Safe the rational choice. However, this repair costs the theory its adherence to first-order stochastic dominance (FOSD). FOSD requires that if one option offers a higher probability of every good outcome than another, it must be preferred. Here, Gamble A dominates Gamble B because its probability of success is strictly higher. If a fixed cutoff exceeds the probabilities of both gambles, the rule evaluates them as equivalent (both zero), violating the requirement to prefer A over B. If the cutoff lies between them, the rule creates a discontinuity where an infinitesimal decrease in probability causes a catastrophic drop in evaluated value. Thus, a fixed cutoff either violates dominance or creates arbitrary cliffs in value.

  A proposed alternative is to index the cutoff to the number of comparable one-shot decisions the agent will face in their lifetime. The intuition relies on the Law of Large Numbers: an agent facing billions of such choices should expect low-probability events to materialize eventually, whereas a single-shot agent should not. While this mitigates the counter-intuitiveness of ignoring tiny probabilities in one-off cases, it introduces unacceptable instability into rational norms. It implies that two agents facing identical choices should act differently based on contingent facts about their future opportunities or lifespan. Furthermore, it fails to solve the dominance problem structurally; if both probabilities fall below the indexed threshold for a specific agent, that agent is still licensed to treat A and B as equivalent, violating FOSD. The normativity of the choice should depend on the structure of the options, not the biographical history of the chooser.

  Finally, a theory of rational choice must register the difference between Gamble A and Gamble B. Even if both gambles are rejected in favor of the Safe option, A remains strictly better than B. Rationality requires coherence across preferences; if an agent prefers A to Safe, they must prefer A to B. If they prefer Safe to both, they must still prefer A to B if forced to choose between the two. Ignoring this difference violates the basic axiom that more probability of a good outcome is better than less. A theory that cannot distinguish between a probability $p$ and $p - \epsilon$ where $\epsilon > 0$ permits money pumps and violates transitivity in broader choice sets. Therefore, while the difference is practically negligible for welfare outcomes, it is structurally essential for rational consistency. The theory must acknowledge the dominance relation even if it rejects both gambles on other grounds.

  ***

  # Marking Scheme

  **Total Marks:** 25
  **Passing Threshold:** 15 marks

  | Component | Marks | Must-Hit Points (First-Class Performance) | Characteristic Error (Competent/Weaker Performance) |
  | :--- | :---: | :--- | :--- |
  | **1. EV Prescription & Objection** | 5 | Identifies Gamble A as the EV choice. Clearly defines fanaticism as allowing tiny probabilities to override near-certainty due to large stakes. | Identifies A but fails to explain *why* it is objectionable (e.g., calls it "risky" without addressing the probability/stakes trade-off) or misidentifies the EV winner. |
  | **2. Fixed Cutoff & FOSD** | 7 | Explains that treating sub-threshold probs as zero creates indifference between A and B if both are below the threshold. Explicitly states this violates FOSD because A dominates B. | Argues cutoffs are "arbitrary" without linking to FOSD. Claims FOSD is preserved because A has higher EV (missing that the cutoff rule discards EV). |
  | **3. Indexed Cutoff Assessment** | 6 | Critiques the proposal for making rationality dependent on contingent biographical facts (lifetime decisions). Notes it fails to solve the FOSD violation if both probs remain below the indexed threshold. | Accepts the proposal as a valid solution based on "long-run" intuition without critiquing the normative instability or remaining dominance violations. |
  | **4. A vs. B Difference** | 7 | Argues "Yes." Defends based on coherence, transitivity, or the principle that higher probability of the same good is strictly better (dominance). | Argues "No" because the difference is practically negligible. Fails to recognize that ignoring dominance undermines the structural integrity of choice theory. |
  | **Total** | **25** | | |

  **Grading Notes:**
  *   **Style & Coherence:** Deduct up to 2 marks from the total if the essay is disorganized or fails to address the four tasks in order, provided the content marks remain high.
  *   **Citations:** Do not penalize for lack of citations (per instructions). Penalize (0 marks for that section) if the student relies on named doctrines (e.g., "Pascal's Mugging") without defining them formally within the answer.
  *   **Math:** Minor arithmetic errors should not be penalized if the logical reasoning regarding the magnitudes is correct.
