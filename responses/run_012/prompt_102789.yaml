          *   *Severity:* High. This is a direct contradiction on the permissibility of killing the conscript.
      *   **The Shell-Factory Worker:**
          *   Pos 4: Immunity absolute. They aren't "themselves the threat."
          *   Pos 1: Liability = part of unjust threat + avoidability.
          *   *Conflict:* Is the worker part of the threat? Most revisionists (McMahan) say yes, they contribute causally. The user says no ("not themselves the threat"). This relies on a narrow definition of "threat" (direct vs. indirect).
          *   *Severity:* Medium. It's a definitional stipulation, but it risks inconsistency with Pos 1 if the conscript is considered a threat but the worker isn't.
      *   **The Voting Citizen:**
          *   Pos 4: Immunity includes voters.
          *   Pos 1: Avoidability test.
          *   *Conflict:* In a democracy, is voting avoidable? Is it a contribution to the threat? If a citizen votes for an aggressor, are they liable? Pos 4 says no. Pos 1 implies maybe yes if avoidable.
          *   *Severity:* Medium-Low. Usually resolved by threshold arguments (individual vote negligible), but needs to be explicit.

  4.  **Ranking the Cracks (Severity):**

      *   **Crack 1 (Critical): The Conscript's Liability Status.**
          *   Pos 1 says: No avoidability = No liability.
          *   Pos 3 says: Conscript = No culpability.
          *   Pos 2 says: Just side can kill Unjust combatants.
          *   *Problem:* If the conscript is an "unjust combatant" (which they are, fighting for the unjust side), Pos 2 says they can be killed. But if they had no avoidability, Pos 1 says they are *not liable* to be killed. You cannot hold both that they are liable to be killed (implied by standard JWT engagement rules) and not liable (per Pos 1).
          *   *Resolution:* Distinguish *liability* from *excuse*. Or admit that non-liable people can sometimes be killed (collateral damage style) but not targeted. But Pos 2 implies targeting.
          *   *Cost:* Must clarify if "permitted to kill them" in Pos 2 applies to *non-liable* unjust combatants. If yes, Pos 1 is weakened. If no, Pos 2 needs a caveat.

      *   **Crack 2 (Significant): The Factory Worker vs. The Conscript.**
          *   Why is the conscript a threat but the worker isn't? Both contribute causally. Both might be coerced/economic necessity (avoidability).
          *   Pos 4 draws a line at "themselves the threat." Pos 1 draws a line at "part of an unjust threat."
