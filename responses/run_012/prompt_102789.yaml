              *   If they are liable, Pos 2 holds (Just can kill them).
              *   If they are excused, Pos 3 holds (Don't punish them).
              *   Pos 4 needs to shift: Workers are liable but perhaps too remote to be *targeted* efficiently/necessarily (necessity condition), rather than immune by status.
              *   Wait, the user wants Civilian Immunity "close to absolute." If I make them liable, immunity is gone.
              *   *Alternative Concession:* Stick to **Directness**. Conscripts are direct threats. Workers are indirect. This saves Pos 4 without making workers liable.
              *   *Does this fix the Conscript?* If Conscripts are non-avoidable, Pos 1 says they aren't liable. But Pos 2 says they can be killed.
              *   *Fix:* Pos 1 needs to change. Avoidability determines *culpability*, not *liability*. One can be liable without being culpable (Innocent Aggressor scenario).
              *   *If I change Pos 1:* "Liability stems from being an unjust threat. Avoidability determines culpability/punishment."
              *   *Effect:*
                  *   Conscript: Liable (can be killed per Pos 2), but not Culpable (no punishment per Pos 3). **Fixes Crack 1.**
                  *   Worker: Not a *direct* threat (per Pos 4 definition). Not liable. **Fixes Crack 2.**
                  *   Voter: Not a direct threat. Not liable. **Fixes Crack 3.**
              *   *Cost:* You lose the intuitive link between "couldn't help it" and "can't be killed." You admit we kill innocent (non-culpable) people in war.

  6.  **Refining the Output:**
      *   Ensure British English (e.g., "labour," "defence," "programme," "analyse").
      *   Structure: Executive Summary -> Ranked Cracks -> The Silver Bullet -> Case Studies.
      *   Tone: Rigorous, critical, helpful.

  7.  **Final Review against constraints:**
