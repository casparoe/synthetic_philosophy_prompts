      *   *Tension B:* (1) & (4). Factory workers. Are they part of the "unjust threat"? If yes, does avoidability apply? The position says they aren't liable because they aren't "themselves the threat." This relies on a specific definition of "threat" (direct vs. indirect).
      *   *Tension C:* (2) vs. (5). Moral inequality vs. Legal equality. This is a classic McMahan vs. Walzer tension. The user acknowledges this ("unworkable and inhumane"), but is it consistent with the moral foundation?
      *   *Tension D:* (4) vs. (1). The voter. If liability is about contributing to an unjust threat, does voting count? The position says "civilian immunity... includes the ordinary voter." But if the voter *could* have voted otherwise (avoidability), does (1) pull them into liability?
