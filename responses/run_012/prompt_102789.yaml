      *   *The "Silver Bullet" Concession:* Is there one move that fixes multiple things?
          *   *Idea:* Distinguish between *Liability* (forfeiture of right not to be killed) and *All-Things-Considered Permissibility* (whether it is right to kill them given other factors).
          *   *Better Idea:* Refine Pos 1. Liability is based on *responsibility for unjust threat*, not just avoidability. Avoidability is an *excuse*, not a negation of liability.
          *   *Best Concession:* Adopt the **Liability/Excuse Distinction**.
