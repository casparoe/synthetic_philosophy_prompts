answer: |-
  The question of whether karma can function as a theory of moral desert turns on the viability of the *traceability thesis*: the claim that an instance of suffering is deserved simply because it is traceable to the sufferer's own wrongful action through a specific causal chain. To evaluate this, we must distinguish between the forensic reading of karma, which posits a cosmic ledger and a bookkeeper, and the naturalistic reading, which posits an impersonal law of moral causation akin to gravity. The naturalistic reading is the only one compatible with a secular or non-theistic worldview, yet it is the one tasked with the heavy lifting of the traceability thesis.

  I argue for the third option: **No karmic theory grounds desert, and karma is better understood as something other than a theory of desert.** The naturalistic reading fails to satisfy the necessary conditions for moral desert regarding normativity, personal identity, and calibration. The forensic reading could conceptually ground desert, but only by ceasing to be a theory of karma and becoming a theory of theistic judgment. Consequently, the traceability thesis cannot be made good. The value of karma lies not in backward-looking retribution, but in forward-looking ethical psychology.

  The first pressure point concerns the nature of traceability itself. Desert requires more than causal descent; it requires a normative connection. If a smoker develops lung cancer, the suffering is causally traceable to their action, but we hesitate to call it *deserved* in a moral sense unless we presuppose a normative framework that judges the smoking as a violation of a duty to oneself or others. In the naturalistic karmic model, actions produce effects, but a mindless law cannot distinguish between a causal consequence and a moral penalty. For suffering to be *deserved*, it must obtain *because* of the wrong in a justificatory sense, not merely *after* it in a chronological sense. The naturalistic reading offers a mechanism of transmission, but it lacks a mechanism of justification. It explains how the pain arrives, but not why the universe is obligated to inflict it. Without a normative agent to interpret the causal chain as a penalty, traceability is merely history, not justice.

  This deficit becomes catastrophic when addressing the problem of persons. The traceability thesis often relies on reincarnation to explain suffering that appears unmerited in a single lifetime. Consider a child born with a painful, disabling condition traced by the naturalistic theorist to an act of cruelty in a previous life. For this child to *deserve* the condition, she must be the same moral agent as the past perpetrator. However, she possesses no memory, psychological continuity, or volitional connection to that past life. To claim she deserves the suffering is to punish a stranger for a crime she did not commit.

  The naturalistic theorist faces a dilemma here. To maintain that the suffering is deserved, they must assert a persistent self (an *atman*) that transcends psychological discontinuity. But if they posit a metaphysical self that persists across lives to bear moral debt, they have quietly reinstated the very entity the ledger reading requires. A persistent self that carries moral weight implies a system capable of tracking that weight. If there is no bookkeeper, who verifies the identity? If there is no book, where is the debt recorded? By trying to secure the conditions for desert (identity), the naturalistic theorist is forced to smuggle in the metaphysics of the forensic reading. If they refuse to do so and stick to a bundle theory of self (where the self is just a causal chain of mental states), the desert claim collapses, as there is no "I" to deserve anything.

  Even if we grant a persistent self, the problem of calibration remains insurmountable for a naturalistic law. Desert requires proportionality: the punishment must fit the crime. A law of nature, like thermodynamics, operates on magnitude and energy, not moral weight. How does an impersonal law determine that a lie warrants a headache while murder warrants a disease? If the reply is that the moral quality of the act *itself* fixes the magnitude, we must ask how a mindless mechanism perceives moral quality. Moral quality is not a physical property like mass or charge. For the universe to calibrate suffering to sin, the universe must possess moral discernment. This implies teleology or mind. Once we attribute moral discernment to the mechanism of karma, it is no longer a natural law; it is a deputy for a divine judge. Thus, the naturalistic reading cannot account for the precision required by desert without self-destructing into the forensic view.

  This leads to the fourth pressure point: the forward-looking retreat. Proponents often argue that karma should not be read as a metaphysical claim about desert, but as a pragmatic device to make responsibility intelligible and reform attractive. Is this a rescue or a change of subject? It is a change of subject, but it is the only philosophically honest one. If karma is not about getting what you deserve, but about understanding that actions have consequences that shape character and future experience, it becomes a powerful tool for ethical cultivation. It shifts the focus from "What do I owe the universe?" to "What kind of person am I becoming?" This saves karma from the metaphysical absurdities of cosmic scorekeeping, but it admits that karma is not a theory of desert. It is a theory of moral psychology. To claim it grounds desert is to misunderstand its utility; its utility lies precisely in bypassing the need for retributive justice in favor of causal responsibility.

  Therefore, the verdict is clear: No karmic theory grounds desert. The naturalistic reading fails because causal traceability is insufficient for normative desert, because it cannot solve the problem of personal identity without contradicting its own naturalism, and because it cannot explain calibration without implying a mind. The forensic reading could ground desert, but only by positing a cosmic judge, at which point it ceases to be a theory of karma (impersonal law) and becomes a theory of theism. Since the distinctive claim of karma is that moral causation is impersonal, the forensic reading is a category error. Karma is best understood not as a theory of desert, but as a forward-looking heuristic for ethical living.

  The strongest objection to this verdict appeals to the deep human intuition of cosmic justice. Critics argue that the belief in karma satisfies a fundamental moral need: the sense that the universe is not indifferent to good and evil. To deny karma as a theory of desert is to accept a universe where the wicked may flourish and the innocent suffer without ultimate rectification. This objection claims that even if the metaphysics are shaky, the *function* of karma as a desert-theory is necessary to sustain moral commitment in the face of apparent injustice.

  This objection does not move me because it conflates psychological comfort with metaphysical truth. Basing moral theory on a false premise—that the universe guarantees justice—undermines moral autonomy. If one acts rightly only because they expect a cosmic return, their virtue is transactional, not moral. Furthermore, the intuition of cosmic justice is just that: an intuition, not evidence. History provides ample counter-evidence to the claim that wrongs are naturally punished. A mature ethics must be able to withstand the reality of unmerited suffering without resorting to mythological scorekeeping. We can maintain responsibility and the value of virtue without the false promise that the universe is structured to reward them. To insist on karma as desert is to prefer a comforting lie over a difficult truth; to understand it as forward-looking guidance is to accept the burden of freedom without the crutch of cosmic guarantee.
