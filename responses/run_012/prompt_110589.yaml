  Based on the five rulings provided, your historian is operating according to a specific, rigorous methodology. She is not merely checking boxes; she is weighing the *credibility* of the witness against the *distance* of the transmission.

  Here are the three rules that fit her record, their predictions for your sixth case, and the analysis of her underlying philosophy.

  ### I. The Three Candidate Rules

  **1. The Rule of Adverse Interest (The Criterion of Embarrassment)**
  *   **The Logic:** A source is most credible when it reports something damaging to itself, its lord, or its patron's political claims. Self-incrimination is the strongest guarantor of truth; self-glorification is the strongest indicator of fiction.
  *   **Fit with Record:**
      *   *Case 1 (Flat):* The annalist admits his own lord fled and his men committed an atrocity. (Adverse).
      *   *Case 2 (Mouth):* The Chancery claims victory and a swift end to the war. (Beneficial).
      *   *Case 4 (Struck):* The Compilation claims prophecy and noble blood for its patron. (Beneficial/Mythic).
  *   **Prediction for Case 6:** **State Flatly.**
      *   *Reasoning:* The Foreign Chronicle's patron claims the land via "lawful settlement." Reporting a "conquest" and "massacre" undermines that legal title. It is against the patron's interest to admit a conquest occurred. Therefore, under this rule, the report is highly credible.

  **2. The Rule of Proximity and Transmission (The Chain of Evidence)**
  *   **The Logic:** Narrative truth ("Flat") can only be asserted when the source is contemporary or near-contemporary to the event. As time passes, the chain of transmission degrades. Late sources, even if plausible, are hearsay and must be attributed ("Mouth") or rejected ("Struck") if they involve high-stakes claims.
  *   **Fit with Record:**
      *   *Case 1 (Flat):* Written within a decade. (Contemporary).
      *   *Case 2 (Mouth):* Written a generation later. (Late).
      *   *Case 5 (Mouth):* Written two centuries later, even though the detail was mundane. (Late).
      *   *Case 4 (Struck):* Written two centuries later, involving myth. (Late + Myth).
  *   **Prediction for Case 6:** **Character's Mouth Only.**
      *   *Reasoning:* The chronicle is 150 years post-event. This places it in the same category as Case 5 (Late Compilation). Regardless of the content's credibility, the temporal distance prevents the narrator from asserting it as objective fact.

  **3. The Rule of Corroboration and Silence (The Consensus Test)**
  *   **The Logic:** A fact cannot be stated flatly if it is contradicted by silence or competing accounts. If the primary subject's records are silent, or if accounts contradict without a neutral arbiter, the fact is unknowable.
  *   **Fit with Record:**
      *   *Case 3 (Struck):* Both sides claim the ford; no third account. (Contradiction).
      *   *Case 1 (Flat):* "Nothing else about the ford survives." (Note: This rule *barely* fits Case 1, as there was no corroboration, but the self-incrimination likely overrode it).
      *   *Case 5 (Mouth):* Sole channel to a lost register. (Single Source).
  *   **Prediction for Case 6:** **Struck (or Mouth).**
      *   *Reasoning:* The Founder's own annals are silent on Brinden. The Foreign Chronicle is the sole witness. Under a strict corroboration rule, a single, late, foreign source against the silence of the home annals is insufficient for narrative fact.

  ### II. The Indistinguishable Rules

  Your historian's record cannot yet separate **The Rule of Adverse Interest** from **The Rule of Proximity**.

  *   **Case 1** was both *Contemporary* and *Adverse*. It received a **Flat** ruling.
  *   **Case 5** was *Late* and *Neutral*. It received a **Mouth** ruling.
  *   **Case 6** is *Late* and *Adverse*.

  We do not know which variable is the "switch" for a Flat ruling. Is it the **Time** (must be contemporary) or the **Motive** (must be adverse)?
  *   If **Proximity** is King: Case 6 must be **Mouth** (because 150 years is too late).
  *   If **Adverse Interest** is King: Case 6 can be **Flat** (because the motive to lie is absent, overcoming the time gap).

  *Note: The Rule of Corroboration is effectively dead.* Case 1 explicitly states "Nothing else about the ford survives," yet she allowed a Flat statement. She does not require multiple sources if the single source is self-incriminating.

  ### III. The Further Case

  To separate Proximity from Adverse Interest, you would need to present her with this hypothetical case:

  **The Seventh Case:** A contemporary letter from the Founder's own quartermaster, written during the campaign, boasting that the Founder paid his troops with plundered gold from a sacked temple. The Founder's official annals claim the troops were paid from the royal treasury.
  *   **Variables:** Contemporary (Proximity Met) + Beneficial to the writer (boasting access to plunder) but Adverse to the Founder's official image.
  *   **The Test:**
      *   If she rules **Flat**: She prioritizes **Proximity**. (It is close enough to be fact, regardless of the boastful tone).
      *   If she rules **Mouth**: She prioritizes **Adverse Interest**. (The quartermaster gains status by boasting, so it is not truly against interest, despite the time).
      *   *Better Test:* A **Contemporary** source that is purely **Beneficial** (e.g., A contemporary panegyric claiming the sun shone only on the Founder).
      *   If **Flat**: Proximity rules.
      *   If **Mouth**: Adverse Interest rules.

  ### IV. The Verdict on Case 6

  **Will she let you state it?**
  **No. She will rule "Character's Mouth Only."**

  **Why:** While the *Adverse Interest* is strong (the report undermines the Patron's legal claim), the *Proximity* failure is fatal to a "Flat" assertion in her system. Case 5 established that a 200-year-old compilation, even with a clear source (the register), is restricted to dialogue for mundane facts. An atrocity story from 150 years ago, uncorroborated by the home annals, carries too much risk of legendary accretion. She will allow the *claim* to be voiced (because it is historically attested), but she will not allow your narrative voice to endorse it as *truth*.

  ### V. The Oldest Argument

  You asked which side she is on: *whether the historian reports what is said or cross-examines the witness.*

  **She is a Cross-Examiner.**

  If she merely "reported what is said," Case 1 would have been restricted to "Character's Mouth" (because it is a single, uncorroborated source). By allowing you to state the Ford Atrocity **Flatly**, she has exercised judicial discretion. She has evaluated the witness's motive, found it credible due to self-incrimination, and elevated the testimony to Narrative Fact.

  She does not treat sources as equal bricks to build a wall; she treats them as witnesses on a stand. She grants "Flat" status only to those who have passed her cross-examination (Case 1). For the rest (Cases 2, 5, and likely 6), she forces you to attribute the testimony to the witness ("Character's Mouth"), acknowledging that they have not fully passed the test of truth, only the test of existence.

  **Advice for your Third Act:**
  Write the Brinden Massacre as a rumor or a accusation spoken by a character who possesses the Foreign Chronicle. Do not narrate it as the omniscient truth. This preserves your historian's integrity while keeping the dramatic hinge in play: the *accusation* of the massacre can drive the plot, even if the *fact* of it remains historically contested within the world of the book. This ambiguity may, in fact, serve your theme better than a flat assertion.
