  # JOINT STATEMENT ON SPLIT-BRAIN ONTOLOGY
  **Collaborators:** "The Two-Streams Man" (Dan) & "The One-Subject Man" (The Author)
  **Date:** Post-Adversarial Collaboration
  **Subject:** The Metaphysical Status of Commissurotomy Patients

  ## PART I: AGREED CLAIMS
  *The following propositions are accepted as factual or methodological constraints by both signatories. Disagreement arises only in the interpretation of these data.*

  1.  **Anatomical Specificity:** The surgery primarily severs the corpus callosum. However, it does not necessarily sever the anterior commissure or the hippocampal commissure unless specifically targeted. The degree of disconnection varies by case (complete vs. partial), and this variance correlates with the severity of inter-hemispheric conflict. We agree that "the split-brain" is not a binary state but a spectrum of disconnection.
  2.  **Visual Field Demonstrations:** Tachistoscopic lateralization experiments successfully demonstrate that visual information presented to the left visual field (LVF) is processed by the right hemisphere (RH) and often cannot be verbally reported by the left hemisphere (LH). This proves informational encapsulation, but does not logically entail ontological separation.
  3.  **Patient Phenomenology:** Post-recovery, patients overwhelmingly report a singular, unified sense of self. They do not report "sharing" their head with another agent. We agree this report is data, but we disagree on its weight: one side views it as decisive evidence of unity; the other views it as the LH's dominant narrative overriding RH silence.
  4.  **Cross-Cueing:** In non-tachistoscopic conditions, patients utilize subtle auditory, motor, and somatic cues to transfer information between hemispheres. This allows for functional unity in everyday tasks, masking the underlying structural disconnection.
  5.  **Ecological Validity:** Outside the laboratory, split-brain patients live ordinary lives. They do not exhibit Jekyll-Hyde switching, nor do they typically struggle with bimanual conflict (e.g., one hand buttoning a shirt while the other unbuttons it) in naturalistic settings. Any theory of "two subjects" must account for this functional integration in the wild.

  ## PART II: RESIDUAL DISAGREEMENTS
  *We cannot agree on the interpretation of the claims above. The following table outlines the specific points of contention, worded as each side insists they must be.*

  | Claim | Owner |
  | :--- | :--- |
  | **"The surgery creates two distinct centres of consciousness, each capable of supporting a separate subject of experience. The body houses two agents who are prevented from communicating, not one agent who is confused."** | **The Two-Streams Man (Dan)** |
  | **"The surgery damages the integration mechanisms of a single consciousness. The result is one subject whose access to their own mental states is fragmented, with the LH acting as a press secretary for a mind it no longer fully controls."** | **The One-Subject Man (Author)** |
  | **"When the LH confabulates a reason for an action initiated by the RH, it is a lie told by one agent about another agent's behaviour."** | **The Two-Streams Man (Dan)** |
  | **"When the LH confabulates, it is a single interpretive system failing to access its own data, constructing a coherent narrative from incomplete inputs to maintain self-model stability."** | **The One-Subject Man (Author)** |
  | **"The 'unity' patients report is an illusion generated by the speaking hemisphere, which is the only one capable of filing the report."** | **The Two-Streams Man (Dan)** |
  | **"The 'unity' patients report is the baseline truth; the 'separation' seen in the lab is an artefact of forcing a unified system to process information through severed channels."** | **The One-Subject Man (Author)** |

  ## PART III: THE CRUXES
  *These are the sub-questions where empirical resolution would force one of us to abandon our position. We have defined the tests, the predictions, and the falsification conditions.*

  ### Crux 1: The Self-Model vs. The Feature Set
  **Question:** Is having a single self-model (or Global Workspace) the *definition* of being one subject, or is that just one feature a hemisphere might possess independently?
  **Test:** High-resolution fMRI during a "conflict task" (e.g., LH and RH instructed to choose different symbols simultaneously via separate hands) combined with post-trial verbal interrogation.
  **Predictions:**
  *   **Two-Streams:** We will see two distinct, anti-correlated networks of activation corresponding to "decision making," each with its own precursor to motor output. The LH report will not match the RH network's activation pattern.
  *   **One-Subject:** We will see a single, overarching conflict-monitoring network (e.g., ACC) attempting to resolve two motor impulses belonging to the *same* control system. The LH report will attempt to integrate both impulses into one narrative, even if erroneously.
  **Falsification:**
  *   **Dan concedes if:** The RH shows no independent "decision" signature distinct from motor preparation, implying it is a reflex arc, not an agent.
  *   **Author concedes if:** The RH demonstrates complex, long-term planning capabilities (e.g., saving a tool for later use) that the LH explicitly denies knowing about, persisting over days.

  ### Crux 2: Confabulation as Agency vs. Interpretive Failure
  **Question:** Is the LH's confabulation evidence of a second agent (the LH) observing a foreign body (the RH), or one agent's interpretive machinery chewing on input it can't see?
  **Test:** The "Smell Test." Present a noxious odor only to the RH (via left nostril, occluded right nostril). Ask the LH (verbally) "Why did you just grimace?"
  **Predictions:**
  *   **Two-Streams:** The LH will invent a reason unrelated to smell (e.g., "I remembered a sad thought") because it literally does not know the smell exists. It is covering for a partner.
  *   **One-Subject:** The LH will attempt to integrate the somatic feedback of the grimace into its current context. If it fails, it admits uncertainty. If it confabulates, it is a breakdown of the *single* self-model, not a cover-up.
  **Falsification:**
  *   **Dan concedes if:** The LH can be trained to accurately label RH states (e.g., "I smell something bad") without direct sensory access, implying a shared underlying qualitative field.
  *   **Author concedes if:** The LH expresses *emotional resentment* toward the hand's action (e.g., "I'm angry at my left hand"), treating the limb as an external antagonist rather than a malfunctioning part of self.

  ### Crux 3: Synchronic vs. Diachronic Unity
  **Question:** Does unity matter "now" (synchronic experiential field) or over "time" (diachronic autobiography)? If we mean different things by unity, we are talking past each other.
  **Test:** The Wada Procedure (intracarotid amobarbital injection) on a split-brain patient. Put the LH to sleep; test the RH. Wake the LH; ask what happened.
  **Predictions:**
  *   **Two-Streams:** When the LH sleeps, the RH subject becomes the primary controller. When the LH wakes, it is a *different* subject returning to the console. There should be a gap in the autobiographical narrative that the LH cannot bridge.
  *   **One-Subject:** When the LH sleeps, the *subject* is temporarily thinned out, losing language and specific memory encoding. When it wakes, it is the same subject recovering from anesthesia, merely missing data logged during the outage.
  **Falsification:**
  *   **Dan concedes if:** The LH, upon waking, demonstrates implicit memory of events that occurred while it was asleep (beyond simple priming), suggesting a continuous underlying substrate.
  *   **Author concedes if:** The RH, while the LH is asleep, demonstrates a distinct personality trait or preference (e.g., political view, aesthetic taste) that contradicts the LH's lifelong identity and persists upon LH recovery.

  ## PART IV: THE VERBAL THRESHOLD
  *We acknowledge the possibility that this dispute is partially verbal.*

  **The Diagnosis:**
  We agree that "Two Subjects" may simply be "Two Streams of Consciousness" with the word "Person" bolted on for emotional weight. If "Subject" means "a locus of reportable experience," Dan wins (there are two loci). If "Subject" means "a moral agent responsible for a single life," the Author wins (there is one body, one legal identity, one biography).

  **The Resolution Protocol:**
  To move past semantics, we agree to the following definitions for the purpose of future debate:
  1.  **Stream:** A functionally independent flow of information processing capable of guiding behaviour. (Dan claims there are two; Author claims there is one fragmented one).
  2.  **Subject:** An entity that holds moral responsibility and possesses a diachronic self-narrative. (Both agree there is legally/biologically one, but Dan argues the moral responsibility is split).

  **Evidence Against Our Own Views (Pre-Committed):**
  *   **Dan must count as evidence against "Two Subjects":** If split-brain patients show seamless emotional contagion between hemispheres (e.g., RH sees something scary, LH feels fear without knowing why) that cannot be explained by subcortical leakage. This would imply a shared *qualitative* field, undermining the "two minds" hypothesis.
  *   **Author must count as evidence against "One Subject":** If a split-brain patient successfully maintains two distinct, contradictory long-term projects (e.g., LH trains for a marathon, RH trains for weightlifting) with no attempt at integration or conflict resolution over a period of months. This would imply two distinct *will*s, undermining the "fragmented unity" hypothesis.

  ***

  **Signed:**

  _________________________ (The Two-Streams Man)

  _________________________ (The One-Subject Man)
