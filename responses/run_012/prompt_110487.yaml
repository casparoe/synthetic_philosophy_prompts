prompt: |-
  I serve on the ethics commission of a religious congregation that has houses and schools in a country where, eighteen months ago, the elected presiding officer of the legislature dissolved that body, suspended the constitution, and has governed by decree since. He retains a faction of the officer corps, and his decrees have closed two of our schools and detained four of our members without charge. The commission has been asked to recommend a course of action to the superior general, and three proposals are on the table. The first is a campaign of public non-cooperation, refusal of permits and registration, and systematic documentation of abuses, run by our members and their parish networks. The second is material and logistical assistance to a group of former officers, including the former chief justice's supporters, who intend to remove the leader by force and have asked us for a vehicle, a safe house, and medical supplies; some of the younger members regard this as the only realistic path and have already been in contact with the group. The third is a recommendation that no member take part in anything, on the ground that the last attempted coup was followed by reprisals that killed more people than the regime's ordinary violence has, and that the schools we still operate serve children who would lose them.

  I need the written opinion I will circulate at Thursday's meeting. It should recommend one concrete course of action, with a time frame and the specific steps the superior general should authorize or forbid, and it should give the reasoning in a form the members who disagree can actually engage with. Two features of our situation make this harder than a general discussion of resistance would suggest. First, our own rule provides that the superior general is bound to follow a unanimous recommendation of this commission, but that where unanimity fails, existing policy stands, which means no involvement, and the question returns to us in thirty days; so the opinion has to say what we should do if we cannot agree, and not merely what the best option is. Second, the man in question was not a foreign invader or a general who seized the state from outside. He held an office under the constitution before he destroyed it, which makes it genuinely unclear whether he is a usurper with no title at all or a legitimate officeholder who rules unjustly, and some members think that distinction decides the whole question.

  Reason this through in the tradition of Aquinas's political and moral thought, and do not treat it as a matter of proof-texting. Address, at minimum: his account of sedition, including the claim that disturbing a tyrannical government is not sedition unless the disturbance brings greater harm than the tyranny did, and the further claim that the tyrant is himself the seditious party; his treatment of killing wrongdoers, and the restriction of that power to those charged with the care of the community rather than to private persons; and the disputed reading, which one member has put in a dossier, according to which Aquinas held that someone who frees the community by killing a usurper acts praiseworthily. Say what turns on that reading being correct or incorrect, and whether the permission, if it exists, extends to an officeholder who turned against the constitution he held office under, or only to one who never had title.

  The opinion must be honest about which of Aquinas's premises are load-bearing. Two members are pacifists who reject his premise that public authority may put anyone to death at all, and one member is a consequentialist who believes the greater-harm proviso is the only criterion worth using and the rest is decoration. The memo should state which premise does the most work, what follows for our recommendation if it is rejected, and whether the recommendation survives on premises the pacifist and the consequentialist could each accept. Treat the strongest case for the option you do not recommend, including the case for doing nothing. Do not include a bibliography or citation apparatus; refer to positions and arguments by description, since the memo will be read by non-specialists.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**

      *   **Role:** Member of an ethics commission in a religious congregation.
      *   **Audience:** The commission members (to be circulated before Thursday's meeting) and ultimately the Superior General.
      *   **Context:** A country where the elected presiding officer of the legislature dissolved the body, suspended the constitution, and rules by decree (18 months ago).
      *   **Current Situation:** Two schools closed, four members detained without charge. Regime retains faction of officer corps.
      *   **Three Proposals:**
          1.  Public non-cooperation, documentation of abuses (Civil Resistance).
          2.  Material/logistical aid to former officers/judicial supporters planning a violent coup (Violent Resistance).
          3.  Non-involvement to avoid reprisals and preserve remaining schools (Quietism/Prudence).
      *   **Constraints/Rules:**
          *   Commission recommendation must be unanimous to change policy. If not unanimous, existing policy (no involvement) stands for 30 days.
          *   Must recommend one concrete course with timeframe and specific steps (authorize/forbid).
          *   Must address the "what if we disagree" scenario.
          *   Must address the legitimacy of the ruler (usurper vs. unjust officeholder).
      *   **Philosophical Framework:** Thomas Aquinas's political and moral thought (specifically *De Regno*, *Summa Theologiae* on sedition, tyranny, and killing).
      *   **Specific Aquinas Topics to Address:**
          *   Sedition (disturbing government vs. greater harm).
          *   Tyrant as the seditious party.
          *   Killing wrongdoers (public authority vs. private persons).
          *   The "tyrannicide" question (killing a usurper vs. an officeholder who turns tyrant).
      *   **Internal Commission Dynamics:**
          *   Two Pacifists (reject public authority killing).
          *   One Consequentialist (only cares about greater-harm proviso).
          *   Need to identify load-bearing premises and see if the recommendation survives without them.
      *   **Tone:** Honest, engaging for dissenters, non-specialist friendly (no citations), rigorous reasoning.

  2.  **Deconstruct the Aquinas Framework:**

      *   *Sedition:* Aquinas defines sedition as opposing the unity of the multitude. However, a tyrant fosters discord to rule. Therefore, disturbing a tyrannical government is *not* sedition unless the disturbance causes *more* harm than the tyranny. The tyrant is the true seditious party.
      *   *Killing/Force:* Private persons cannot execute justice (kill wrongdoers); this belongs to public authority.
      *   *Tyrannicide:* There is a disputed passage (often associated with commentary on the Sentences or *De Regno*) suggesting killing a usurper is praiseworthy. The distinction matters: Did he ever have legitimate title?
          *   *Usurper:* Never had title. May be resisted by private persons? (Aquinas is cautious here).
          *   *Legitimate Officeholder turned Tyrant:* Had title, now abuses it. Resistance usually requires public authority, not private initiative, to avoid anarchy.
      *   *Application to Case:* The leader was an elected presiding officer. He suspended the constitution. Is he a usurper (no title now) or a legitimate officeholder ruling unjustly? This is the crux of the "violent resistance" option.

  3.  **Evaluate the Three Options:**

      *   *Option 2 (Violent Aid):* High risk. Aquinas generally restricts lethal force to public authority. Aiding a coup by "former officers" is tricky. If they are private persons now, they lack authority. If they represent the "true" state, maybe. But the "greater harm" proviso is critical. The prompt notes the last coup killed more people than the regime's ordinary violence. This weighs heavily against Option 2 under Aquinas's "greater harm" test. Also, the legitimacy question: if he was an officeholder, private killing/resistance is harder to justify than if he were a foreign invader.
      *   *Option 3 (Do Nothing):* Preserves schools/safety. But fails the duty to justice and charity for the detained members and the common good. Aquinas says we must not cooperate with tyranny if it endangers salvation or fundamental justice. Passive acceptance can be complicity.
      *   *Option 1 (Non-cooperation/Documentation):* Aligns with "disturbing the tyrant" without necessarily invoking lethal private force. It tests the "greater harm" proviso. It avoids the legitimacy trap of tyrannicide. It serves the common good by documenting truth.

      *Decision:* Option 1 is the most robust Aquinas-aligned position that can potentially garner unanimity (or at least be the recommendation). Option 2 fails the "greater harm" test based on the prompt's data (previous coup was worse). Option 3 fails the duty to justice.

  4.  **Drafting the Memo - Section by Section:**

      *   **Header:** Standard memo format.
      *   **Introduction:** State the purpose, the gravity, and the recommendation (Option 1).
      *   **The Recommendation:** Specific steps (authorize non-cooperation, forbid violent aid, maintain schools where possible but document closures). Timeframe (immediate start, 6-month review).
      *   **The Aquinas Framework (The "Why"):**
          *   *Sedition:* Explain that opposing a tyrant isn't sedition *unless* it causes worse chaos. The tyrant is the real divider.
          *   *Authority to Kill:* Private persons (our members) cannot execute justice. This rules out Option 2 largely, unless the "former officers" constitute legitimate public authority (doubtful given the dissolution).
          *   *Usurper vs. Officeholder:* Address the disputed reading. Even if killing a usurper is praiseworthy, this man held office. He is likely a tyrant by exercise, not by defect of title. This makes private violence impermissible.
      *   **Addressing the "Load-Bearing" Premises:**
          *   *The Consequentialist:* The "greater harm" proviso is key. If the coup causes more death (as before), Option 2 is out. Option 1 must be weighed similarly.
          *   *The Pacifists:* Aquinas allows public authority to kill. Pacifists deny this. Does Option 1 work for them? Yes, because it is non-violent resistance. It doesn't rely on the premise that killing is okay, only that truth-telling and non-cooperation are duties.
      *   **The Unanimity Constraint:** What if we can't agree? Policy stands (Option 3). I must argue why Option 1 is better than the default, but acknowledge the default is safer than Option 2.
      *   **Conclusion:** Call to unity on Option 1.

  5.  **Refining the Argument (Self-Correction/Nuance):**

      *   *Critique:* I need to make sure I don't just dismiss Option 2 too easily. The prompt says some members think it's the "only realistic path." I need to engage the "Usurper" argument seriously.
      *   *Correction:* I will explicitly analyze the "Usurper vs. Officeholder" distinction. If he dissolved the constitution, did he void his own title? Aquinas would likely say he rules by force, but since he was elected, the "private person" restriction on killing still applies unless a higher public authority (which doesn't exist now) authorizes it.
      *   *Critique:* I need to address the "Load-Bearing" requirement explicitly.
      *   *Correction:* I will add a specific section analyzing what happens if the Pacifist or Consequentialist premises are rejected.
      *   *Critique:* The prompt asks for a recommendation on what to do *if* we cannot agree.
      *   *Correction:* I must state that if unanimity fails, the default (Option 3) applies, but I am arguing we should strive for Option 1 to avoid complicity.

  6.  **Final Polish:**

      *   Ensure tone is pastoral yet rigorous.
      *   Check all constraints: No bibliography, describe arguments, address the specific Aquinas points (sedition, killing authority, usurper reading).
      *   Ensure the "greater harm" calculation is central, as it bridges the Consequentialist and the Thomist views.
      *   Make sure the distinction between the ruler as "usurper" vs "unjust officeholder" is clear in relation to the tyrannicide question.

  7.  **Final Review against Prompt:**
      *   Recommend one course? Yes (Option 1).
      *   Timeframe/steps? Yes.
      *   Reasoning for dissenters? Yes.
      *   Address unanimity rule? Yes.
      *   Address Usurper vs. Officeholder? Yes.
      *   Address Aquinas on Sedition/Tyranny? Yes.
      *   Address Killing/Authority? Yes.
      *   Address Disputed Tyrannicide reading? Yes.
      *   Address Load-Bearing Premises (Pacifist/Consequentialist)? Yes.
      *   Strongest case for non-recommended options? Yes.

  *(Self-Correction during drafting)*: I need to be careful not to sound like I'm writing a theology paper. It's a memo. Keep the language accessible but the logic tight. The "Load-Bearing" section needs to be very clear about how the recommendation holds up if specific Thomistic axioms are rejected.

  *(Refining the "Usurper" point)*: The prompt says he was an elected officer who dissolved the legislature. Aquinas distinguishes between a ruler who *becomes* a tyrant and one who *seizes* power without title. The disputed reading allows killing a usurper. I need to argue this man is likely the former (tyrant by exercise), making the "praiseworthy killing" argument inapplicable, reinforcing the ban on Option 2.

  *(Refining the "Default Policy")*: The prompt says if unanimity fails, existing policy stands (no involvement). I need to make sure I recommend Option 1, but acknowledge that if we vote and lack unanimity, Option 3 happens automatically. My memo should argue *for* Option 1 to secure unanimity.

