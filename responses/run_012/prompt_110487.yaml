answer: |-
  **MEMORANDUM**

  **TO:** The Ethics Commission
  **FROM:** [Your Name]
  **DATE:** [Current Date]
  **SUBJECT:** Recommendation Regarding Political Crisis and Congregational Response

  **I. Purpose and Recommendation**

  We are convened to advise the Superior General on our congregation's posture toward a regime that has suspended the constitution, dissolved the legislature, and detained our members. We face three proposals: public non-cooperation and documentation (Option 1); material aid to a violent counter-coup (Option 2); or total non-involvement to preserve safety and schools (Option 3).

  Our rules require unanimity to change policy. If we cannot agree, the default policy of non-involvement (Option 3) remains in force for thirty days. While Option 3 is the safety default, I believe it constitutes a failure of our duty to justice. Option 2, while appealing to those seeking decisive action, carries moral and practical risks that violate our ethical tradition.

  Therefore, I recommend we unanimously adopt **Option 1: A campaign of public non-cooperation, refusal of permits where possible without endangering life, and systematic documentation of abuses.**

  **Specific Authorization:** The Superior General should authorize members to withhold voluntary cooperation with regime decrees that violate natural justice, to refuse new registrations that imply legitimation of the suspension of the constitution, and to document detainments.
  **Specific Prohibition:** The Superior General must explicitly forbid the provision of vehicles, safe houses, or medical supplies to any armed faction seeking to overthrow the leader by force.
  **Time Frame:** This policy should begin immediately and be reviewed in six months, or sooner if the security situation regarding our detained members changes drastically.

  **II. The Moral Framework: Sedition and Tyranny**

  To persuade those who favor Option 2 or Option 3, we must ground our decision in a shared understanding of political authority and resistance. We rely here on the tradition of Thomas Aquinas, not as a source of inflexible rules, but as a method for weighing harms and duties.

  **On Sedition and the "Greater Harm" Proviso**
  A primary objection to resistance is the charge of sedition—creating discord within the community. However, this tradition argues that a tyrant is the true seditious party, as he rules for private gain rather than the common good, thereby fracturing the unity of the people. To disturb a tyrannical government is not sedition *unless* the disturbance brings greater harm than the tyranny itself.

  This is the critical test for Option 2. We have evidence that the last attempted coup resulted in reprisals that killed more people than the regime's ordinary violence. If we aid a new coup, and it fails or triggers a civil war, we become morally responsible for that greater harm. Under this framework, Option 2 is impermissible not because resistance is wrong, but because the likely consequence is a net increase in suffering. Option 1, by contrast, seeks to disturb the tyrant's legitimacy without triggering the kinetic violence that historically leads to greater slaughter.

  **On the Authority to Use Force**
  There is a fundamental distinction between public authority and private persons regarding the use of lethal force. In this tradition, the power to kill wrongdoers belongs to those charged with the care of the community (public authority), not to private individuals. Our members are private persons. We do not hold the sword of state justice.

  This restricts our ability to participate in violent removal of the leader. Even if the leader is unjust, we cannot simply take up arms or aid those who do, unless those acting possess legitimate public authority. This leads to the difficult question of the leader's title.

  **The Usurper vs. The Unjust Officeholder**
  One member has circulated a reading suggesting that killing a usurper is praiseworthy. We must be precise about this. That argument applies to one who seizes power without any title (a foreign invader or a pure usurper). It is far less clear that this permission extends to an officeholder who was legitimately elected but subsequently ruled unjustly or suspended the constitution.

  The man in question held an office under the constitution before he destroyed it. He is not a stranger to the polity; he is a magistrate who has turned against the law he was sworn to uphold. In this tradition, removing such a figure is not the same as repelling an invader. Because he once held title, the authority to remove him generally reverts to a higher public authority (which currently does not exist) rather than falling to private persons. To aid the "former officers" in Option 2 is to aid private persons acting as if they were public authority. Given the ambiguity of his title and the high risk of greater harm, we cannot sanction lethal private intervention.

  **III. Addressing Divergent Premises**

  I recognize that not all members accept the full weight of the tradition I have outlined above. We have pacifist members who reject the premise that public authority may ever put anyone to death, and a consequentialist member who believes the "greater harm" proviso is the only criterion that matters. I want to be honest about which premises are load-bearing and whether this recommendation survives if you reject them.

  **For the Consequentialist**
  Your primary concern is the outcome: minimizing total suffering. You view the moral rules regarding authority and sedition as secondary to the calculation of harm.
  *   **Load-Bearing Premise:** The claim that disturbing a tyrant is wrong *if* it causes more harm than the tyranny.
  *   **If Rejected:** If you believe that violence is justified regardless of the immediate body count (e.g., for the sake of liberty itself), you would favor Option 2.
  *   **Why the Recommendation Survives:** However, even on purely consequentialist grounds, Option 2 is the weakest choice. The historical data shows the previous coup caused more deaths than the regime's ordinary violence. Unless you have new intelligence suggesting this coup will succeed cleanly without reprisals, the "greater harm" calculation still rules out Option 2. Option 1 remains the superior choice because it applies pressure with a lower risk of catastrophic bloodshed. Thus, we can agree on Option 1 even if we disagree on *why* violence is restricted.

  **For the Pacifists**
  Your objection is to the premise that killing wrongdoers is ever permissible, even for public authority. You reject the distinction between private and public use of force.
  *   **Load-Bearing Premise:** The claim that public authority has the right to execute justice.
  *   **If Rejected:** If killing is always wrong, then Option 2 is doubly wrong (private persons killing). However, you might also worry that Option 1 (non-cooperation) is a form of aggression that could provoke lethal state response.
  *   **Why the Recommendation Survives:** Option 1 does not require you to accept that killing is permissible. It relies on the duty to bear witness to the truth and the duty not to cooperate with injustice. Non-cooperation is a form of speech and refusal, not an act of lethal force. While it carries risk, it does not violate the principle of non-violence in the same way as aiding a coup. Therefore, you can support Option 1 without conceding that the state has a right to kill.

  **IV. The Case for the Alternatives**

  I must address the strongest arguments for the options I am not recommending, to ensure our final vote is informed.

  **The Case for Option 2 (Violent Assistance)**
  The argument here is that tyranny cannot be reasoned with, and that the suspension of the constitution marks the leader as a usurper who has forfeited all title. If he is a usurper, the restriction on private persons using force dissolves. Furthermore, if the regime is slowly strangling the congregation (closing schools, detaining members), waiting may lead to our destruction anyway. Some argue that the "greater harm" of the last coup was due to poor planning, not the principle of resistance, and that our logistical aid could ensure success this time.
  *   *Rebuttal:* We cannot gamble with the lives of the populace based on the hope of better planning. The moral restriction on private violence remains because the "public authority" of the resistance is unproven. If they fail, the congregation will be blamed, and the reprisals will fall on the innocent children in our remaining schools.

  **The Case for Option 3 (Non-Involvement)**
  This is the default policy if we fail to agree. The argument is prudence: we are a religious congregation, not a political party. Our primary duty is to the children in our schools and the safety of our members. The political situation is volatile; by staying out, we preserve a space of neutrality where we can serve the poor regardless of who rules. If we engage in non-cooperation, we risk the closure of all remaining schools.
  *   *Rebuttal:* Neutrality in the face of injustice can become complicity. By continuing to operate normally under a suspended constitution, we implicitly legitimize the regime. Furthermore, our detained members need advocacy. However, I acknowledge this is the safest path. If we cannot reach unanimity for Option 1, this policy will automatically stand. I urge you not to let this happen by default, but to choose it only if you truly believe Option 1 poses an unacceptable risk to life.

  **V. Conclusion and Path Forward**

  We face a constraint: without unanimity, we do nothing. Doing nothing is safer than Option 2, but it abandons our detained brothers and sisters and tacitly accepts the dissolution of the law.

  Option 1 offers a middle path. It acknowledges the leader as a tyrant by exercise, if not by title. It respects the restriction on private violence while refusing to cooperate with injustice. It satisfies the "greater harm" test by avoiding armed conflict. It is acceptable to the pacifist as non-violent witness, and to the consequentialist as the lowest-risk strategy for change.

  I ask that we vote to recommend Option 1 to the Superior General. If we cannot agree, the default of Option 3 will take effect. But I believe we have a duty to strive for the unanimous voice that allows us to act for justice without shedding blood.

  Let us meet Thursday prepared to finalize this recommendation.
