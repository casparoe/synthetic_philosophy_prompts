  Imagine a freelance software consultant, Elena, finalising a contract with a startup founder, Mark. They will never work together again; strict non-disclosure agreements prevent her from using this project in her portfolio, so reputation is irrelevant. There are no witnesses and no enforceable written clause for the final bonus. The contract is loose enough that Mark can withhold 20% of the fee on a technicality without legal recourse. Elena threatens to delete the proprietary source files if not paid in full. Deleting them costs her time and yields no financial return once the money is withheld; it is purely punitive. Mark knows a purely rational agent would bluff but never actually delete, as the cost is sunk. He will only pay the bonus if he believes Elena is the *type* who carries out spiteful threats regardless of personal cost. Elena benefits immensely if she possesses this 'wrathful integrity'. Yet, if she cultivates this disposition *because* it secures payment, she remains instrumental. When the moment comes, the payment is already lost; the instrumental reason to delete vanishes. She must value the principle of fairness non-instrumentally to be credible. If she knows she is only pretending to be principled to get the money, Mark, a good judge of character, will spot the hesitation. This is a truly isolated interaction, stripped of the usual scaffolding of commerce.

  The conceptual shape here is coherent, though it demands a specific view of agency. The agent must be locally irrational to be globally rational. At the moment of action, deleting the files is act-irrational: it incurs a cost with no recuperative benefit. The money is already lost; destroying the files is merely spiteful. However, possessing the *disposition* to delete the files is dispositionally rational: it secures the payment in the first place. The payoff materialises only if the disposition is not held for the sake of the payoff. If Elena adopts the trait instrumentally ('I will be wrathful to get paid'), she remains a maximiser at the point of action. When the trigger occurs, she will calculate that deletion is costly and refrain, thereby revealing herself as a bluffer. Mark anticipates this. To succeed, Elena must be motivated by non-instrumental values—honour, justice, or genuine spite—that override cost-benefit analysis when the crisis hits.

  This demonstrates that the rationality of a character cannot always be reduced to the rationality of its constituent acts. A life lived by always choosing the act with the highest immediate utility may yield less overall utility than a life constrained by dispositions that sometimes forbid optimisation. The reasoning that justifies the disposition ('it pays') is self-effacing; it cannot be the reasoning that sustains it ('it is right'). To be rational overall, the agent must sometimes be incapable of rational calculation at the critical moment.

  \answer{The Wrathful Consultant}
