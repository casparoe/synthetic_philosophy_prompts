prompt: |-
  Ok, help me pin down a distinction I keep half-using. I keep calling some failed predictions 'right but early' and others just plain wrong, and I cant tell whether I'm doing anything there except liking the ones that happened to come true later.

  My gut calls:

  - Malthus's main claim, that population growth keeps living standards pinned near subsistence: wrong. The check he predicted basicly didn't come in the countries that mattered, and I don't want to hear 'early'.
  - But the narrower bit, that you can't keep pulling ever more food out of a fixed amount of land without something changing: I want to say right. Maybe that's a different claim, but it's the same guy and it bothers me that I split him.
  - Ehrlich's famines in the 70s and 80s, plus him losing that metals bet with Simon: wrong, no rescuing.
  - Warnings about antibiotic resistance, which roughly the same style of argument flagged ages before it actually bit: right but early. I'm a little embarrassed that I let this one off when I won't let Ehrlich off.
  - Jevons on British coal: genuinely don't know. He said the peak was close and that it would wreck British industrial dominance. The peak was about a century out and the wreck never came, but he had the right resource and the peak did happen. Where does that land?
  - The limits-to-growth modelling runs: I notice I want to say 'still open'. Is that just me being generous because the timescale is long?
  - And one going the other way: someone says, no date, no number, 'we'll run out of X, growth will stop', a century passes and nothing happens. I want to call that wrong, even though it's exactly the vague kind of claim I'd normally let off.

  Is there a principled line here, or am I just grading on whether I like the conclusion? My tentative guess is it's about whether the core mechanism survives and gets used to do new work, whether the delay is explained by something the theory could have named in advance rather than something invented after the fact, and whether the patched-up version goes and sticks its neck out again. Test that against the cases and tell me which verdicts it forces me to drop. Then say what your line predicts for a case I haven't listed.

  Keep it under 500 words, and don't spend a paragraph hedging at the end.
