answer: |-
  Your heuristic is principled: it distinguishes **structural errors** (wrong mechanism) from **parameter errors** (right mechanism, wrong timing/inputs). A prediction is "right but early" only if the causal engine works, the delay was a variable the theory could accommodate, and the model updates to make fresh, risky claims.

  Testing this against your list forces one specific concession: **You must drop the intuition that Malthus's land claim is "Right."**

  Under your rule, Malthus fails on both counts. First, the mechanism (fixed land limits output) was structurally broken by exogenous technology (Haber-Bosch fertilizers), which his model treated as impossible or irrelevant. Second, Neo-Malthusians repeatedly patch the model by moving the goalposts rather than naming the missing variable in advance. If you call the land claim "Right," you are grading on the vague conclusion ("limits exist") rather than the mechanism ("land constrains us"). That violates your own rule about the core mechanism surviving. To be consistent, Malthus is wholly "Wrong," just like the subsistence claim.

  Your Ehrlich vs. Antibiotics distinction holds up. Ehrlich ignored price signals and substitution (structural failure). Antibiotic resistance relies on evolutionary biology (structural truth); the delay was usage volume (parameter), which the theory explicitly identifies as the driver. The mechanism didn't need patching, only the timeline.

  Jevons requires a split verdict. The **Jevons Paradox** (efficiency increases consumption) is "Right"—the mechanism is robust and used in modern energy economics. The **Coal Peak** prediction is "Wrong"—he missed fuel substitution (oil), a variable his model didn't account for. You cannot save the peak date without ad hoc reasoning.

  Limits to Growth remains "Open" only if you treat it as a dynamic simulation updated with real data, not a static 1972 prophecy. If defenders treat the original run as sacroscript, it becomes "Wrong" as deadlines pass.

  **New Case Prediction:**
  Apply your rule to **AI Takeoff Scenarios**.
  *   **Claim:** "Compute scaling leads to emergent capabilities."
  *   **Verdict:** **Right but Early.**
  *   **Reasoning:** The mechanism (scaling laws) is empirically visible now. Delays were data/compute constraints (named variables). The theory is currently sticking its neck out on AGI timelines.
  *   **Contrast:** "AI will wake up because of complexity" is **Wrong**. The mechanism (complexity = consciousness) is undefined and untestable.

  Your heuristic works because it penalizes vagueness. Malthus survives only if you blur the mechanism. Ehrlich fails because he bet on scarcity rather than economics. Stick to the mechanism, not the vibe.
