answer: |-
  Reject step (2), because you cannot consistently claim to know what your rational future credence will be on an empirical matter without already holding that credence yourself.

  Your friend's principle is Bas van Fraassen's **Reflection Principle**, and your argument is a standard reductio that hinges on an impossible premise. Step (1) is essentially a theorem of probability theory (the Law of Total Probability) applied to beliefs: your current credence must equal the weighted average of your possible future credences. If you assert (2)—that you are *certain* (probability 1) your future credence will be 0.9—then the math of (1) forces your current credence to be 0.9 immediately. There is no slack in the equation; if you are truly certain of your future rational belief, you must already have that belief now.

  The error lies in thinking you can satisfy (2) for empirical questions like historical inquiry. To be certain your future self will believe $H$ at 0.9, you would need to already possess the evidence that justifies that 0.9. If you haven't read the sources, you cannot rule out the possibility that the evidence will be weak, ambiguous, or misleading. If you acknowledge even a tiny chance that the evidence won't support $H$, your expected future credence drops below 0.9, and your current credence drops with it. You can trust your future self to *process* evidence rationally, but you cannot foresee the *outcome* of that processing without already having the evidence. In short, you can know your future self will be rational, but you cannot know what conclusion rationality will dictate until you see the data.

  The price of rejecting (2) is epistemic humility regarding your own learning trajectory. You must give up the intuition that you can predict the specific conclusions of your own empirical inquiry before conducting it. You can believe "I will find the truth" or "I will update based on evidence," but you cannot believe "I will believe $H$" without already believing $H$. This cost is actually a benefit: it preserves the value of investigation. If you could know your future credence without the evidence, inquiry would indeed be pointless; by admitting you cannot know that future credence, you confirm that the inquiry provides information you currently lack. Your friend's clause about "no information lost" isn't circular; it simply specifies the condition under which (1) applies (i.e., when you expect your future self to be rational and informed), which reinforces why (2) fails—you don't yet have the information your future self will have.
