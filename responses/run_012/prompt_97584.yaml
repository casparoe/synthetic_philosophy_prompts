answer: |-
  ### The Thought-Experiment Calibration Protocol (TECP)

  **Purpose:** To distinguish conceptual revelation from rhetorical stagecraft in philosophical manuscripts.
  **Time Budget:** 40 Minutes.
  **Analogy:** Treat the thought experiment (TE) as an instrument. You are checking for calibration, signal-to-noise ratio, and valid readout.

  #### Step 1: Identify the Target Variable
  **Question:** What specific definition, principle, or theory is the TE designed to test?
  **Sufficient Answer:** A single sentence stating the target (e.g., "The JTB analysis of knowledge," "Psychological continuity theory of identity").
  **Hard Stop:** If the target is vague (e.g., "our concept of freedom") or shifts during the description, the TE is doing no evidential work. Stop here; assess the paper on non-TE grounds.

  #### Step 2: Check Stipulation Coherence
  **Question:** Are the scenario's premises compossible? (Can they all be true together without logical contradiction?)
  **Sufficient Answer:** "Yes, this scenario is logically possible, even if physically impossible."
  **Hard Stop:** If the scenario requires a logical contradiction (e.g., "a circle that is square," "a being that is omniscient but learns"), the apparatus is broken. Reject the TE's evidential claim.
  **Judgment Call:** If the scenario relies on "nomological impossibility" (violates laws of physics) but claims to test a conceptual truth, note this. It is admissible *only if* the physical impossibility is irrelevant to the target variable.

  #### Step 3: Isolate the Signal (Relevance Filter)
  **Question:** Which specific feature of the scenario drives the intuitive verdict?
  **Sufficient Answer:** You can point to one or two stipulations that, if removed, would reverse the verdict.
  **Judgment Call:** If the verdict seems driven by emotional loading, vivid imagery, or incidental details (e.g., the profession of a character, the gruesomeness of a death) rather than the structural features relevant to Step 1, flag this as "Noise."
  **Distinction:** *Relevant Stipulations* alter the target variable. *Incidental Details* persuade via association. If you cannot separate them, mark "Judgment Call: Author must justify relevance."

  #### Step 4: Classify the Intuition's Role
  **Question:** How is the reader's intuition being used?
  **Sufficient Answer:**
  *   **As Data:** The intuition *is* the fact to be explained (e.g., "It is obvious this is wrong; theory must match this").
  *   **As Prompt:** The intuition is a puzzle to be solved, potentially by revising the intuition itself (e.g., "This feels wrong, but theory says right; perhaps our feeling is biased").
  **Judgment Call:** If the author treats an intuition as Data but you suspect it is culturally or historically contingent, mark "Judgment Call: Intuition reliability disputed."

  #### Step 5: Determine Evidential Function
  **Question:** What is the TE claiming to achieve?
  **Sufficient Answer:**
  *   **Counterexample:** Claims to falsify a universal claim (Target says "All X are Y"; TE shows "This X is not Y").
  *   **Positive Illustration:** Claims to show a theory *can* handle a case, or to make a view plausible.
  **Hard Stop:** If presented as a Counterexample but is actually compatible with the theory (the theory can explain the verdict), the TE fails.

  #### Step 6: Robustness Check (Replicability)
  **Question:** Does the verdict hold if incidental details are varied?
  **Sufficient Answer:** "Yes, changing the color/gender/setting does not change the verdict."
  **Judgment Call:** If small changes to the staging reverse the intuition, the TE is unstable. Mark "Judgment Call: Verdict depends on framing."

  ***

  ### Application of the Protocol

  #### Case 1: The Gettier Case (Smith, Jones, and the Coins)
  *Scenario:* Smith has strong evidence Jones will get a job and Jones has 10 coins. Smith infers "The person who gets the job has 10 coins." Smith gets the job (unexpectedly) and happens to have 10 coins. Smith has Justified True Belief, but seems not to Know.

  1.  **Target:** The "Justified True Belief" (JTB) analysis of knowledge.
  2.  **Coherence:** Logically possible. (Pass)
  3.  **Signal:** The disconnect between the justification (Jones's coins) and the truth-maker (Smith's coins). (Pass)
  4.  **Role:** Intuition as Data. (The intuition "Smith doesn't know" is treated as a fixed point).
  5.  **Function:** Counterexample. (Claims to falsify "All Knowledge is JTB").
  6.  **Robustness:** High. Changing the job to a prize, or coins to keys, yields the same verdict.
  **Verdict:** **Admissible.** This is a high-precision instrument. It isolates the variable (luck vs. justification) and produces a stable falsification of the target theory.

  #### Case 2: The Teleporter (Parfit-style)
  *Scenario:* A machine scans your body, destroys it, and rebuilds a perfect duplicate elsewhere with all memories intact. Are you the same person?

  1.  **Target:** Psychological Continuity vs. Physical Continuity theories of Personal Identity.
  2.  **Coherence:** Physically impossible, but logically coherent. (Pass, with note).
  3.  **Signal:** The break in physical continuity vs. preservation of psychological continuity. (Pass).
  4.  **Role:** Intuition as Prompt. (The author usually admits the intuition is split/uncertain to motivate a new theory, e.g., "Identity doesn't matter, Survival does").
  5.  **Function:** Positive Illustration / Theory Generator. (Not a hard counterexample, but a stress test).
  6.  **Robustness:** Moderate. If the duplicate is created *before* destruction (branching), intuition wavers.
  **Verdict:** **Admissible, but function is different.** This is not a falsification instrument; it is a stress-test apparatus. It reveals that our concept of "identity" may be underspecified. The procedure classifies this as a "Prompt" (Step 4), not "Data." If the author treats the intuition as a hard fact (Data), flag it. If they treat it as a puzzle (Prompt), accept it.

  #### Case 3: The Chinese Room (Searle)
  *Scenario:* A man who knows no Chinese sits in a room. He receives Chinese symbols, follows a rulebook to manipulate them, and outputs correct Chinese answers. To the outside world, he understands Chinese. Internally, he does not. Therefore, syntax (computation) is not sufficient for semantics (understanding).

  1.  **Target:** Strong AI / Computational Theory of Mind (Mind = Program).
  2.  **Coherence:** Logically possible. (Pass).
  3.  **Signal:** **FAIL.** The feature driving the verdict is the *man's* lack of understanding.
  4.  **Role:** Intuition as Data. (Treats "The man doesn't understand" as proof "The system doesn't understand").
  5.  **Function:** Counterexample. (Claims to falsify "Computational systems can understand").
  6.  **Robustness:** **FAIL.** If we vary the detail from "Man in room" to "Room as a whole system," the intuition shifts (The "System Reply").
  **Verdict:** **Inadmissible as a Counterexample.**
  **Reason:** The procedure flags Step 3 (Signal) and Step 6 (Robustness). The "Man" is an incidental detail doing persuasive work (stagecraft). It invites you to identify with the homunculus rather than the system. A functionalist would argue the "Man" is merely a CPU component; asking if the CPU understands is a category error.
  **Why this might annoy you:** You may feel the distinction between "simulating understanding" and "understanding" is real and that the TE captures it.
  **What a dissenter would say:** They would argue the procedure ignores the *first-person ontology* of experience. They would claim Step 3 is wrong: the man's perspective is *not* incidental; it is the only place where "understanding" exists. They would argue the TE reveals a property of consciousness (interiority) that the procedure incorrectly classifies as "noise."

  ***

  ### Limitations and Failure Modes

  **1. Where the Procedure Misfires**
  *   **Existence Proofs:** Some TEs aim only to show logical possibility (e.g., "Zombies are conceivable"). Step 5 (Function) may misclassify these as weak counterexamples. They are not testing a theory; they are testing a modal claim.
  *   **Conceptual Explication:** Some philosophers use TEs to *propose* a new definition, not test an old one. The procedure assumes a fixed Target (Step 1). If the author is trying to change the target, the protocol will flag it as "Vague."
  *   **The "Expertise" Defense:** Some authors claim their TEs require philosophical training to "read" correctly. Your Step 6 (Robustness) might fail because lay intuitions differ from expert ones. The procedure cannot adjudicate who counts as a calibrated observer.

  **2. How to Notice Misfiring**
  *   If you reject a TE but the author responds by refining the *theory* rather than defending the *case*, the TE was likely a Prompt (Step 4), not Data. You may have applied the Counterexample standard too strictly.
  *   If you find yourself arguing about the *physics* of the scenario rather than the *concept*, the Stipulation Check (Step 2) was insufficient. The TE may be smuggling empirical claims as conceptual ones.

  **3. Judgments Dressed as Procedure**
  *   **Step 3 (Signal/Noise):** This is the most subjective step. Distinguishing "relevant stipulation" from "emotional loading" relies on *your* intuition about what is relevant. You are using your own conceptual apparatus to calibrate theirs.
  *   **Step 4 (Data vs. Prompt):** Authors often equivocate here. Determining which role the intuition plays requires interpreting the author's dialectical goal, which is not always explicit.
  *   **Step 6 (Robustness):** Deciding if a variation is "incidental" or "structurally significant" is itself a philosophical judgment. (e.g., In the Chinese Room, is the man incidental? Functionalists say yes; Phenomenologists say no).

  **Summary:** Use this protocol to filter out rhetorical stagecraft. It will not tell you who is *right* about the metaphysics, but it will tell you if the *apparatus* is capable of measuring what it claims to measure. When the protocol returns a "Judgment Call," do not resolve it yourself; require the author to defend the calibration in the text.
