          2.  Popperian 2 (Subject changer): This is informativeness/reliability, not truthlikeness.
          3.  Objective Bayesian: Reinventing scoring rules; probability calculus suffices.
          4.  Constructive Empiricist: Empirical adequacy is enough; truth is idle.
