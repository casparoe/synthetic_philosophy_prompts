answer: |-
  JOINT STATEMENT ON THE INTERPRETATION OF PRE-MOVEMENT NEURAL ACTIVITY AND AGENCY

  1. AGREED CLAIMS

  We, the undersigned representatives of the deflationary and constraint camps, agree upon the following operational and methodological claims. These claims are substantive and exclude generalities that would be accepted by observers outside this specific dispute.

  1.1 The readiness potential is a reliable aggregate signal. In tasks requiring spontaneous, arbitrary motor acts, averaging electroencephalographic data aligned to movement onset reveals a negative-shifting potential beginning approximately one second before movement. Both sides agree this signal exists as a statistical feature of the data set, regardless of its single-trial reality.

  1.2 The reported time of conscious urge precedes movement but follows the onset of the aggregate readiness potential. Participants consistently report the conscious urge to move occurring roughly two hundred milliseconds before movement onset, which is later than the onset of the aggregate neural signal. Both sides agree this temporal ordering is the robust central finding of the paradigm.

  1.3 Averaging procedures obscure single-trial dynamics. The standard analysis aligns trials to movement onset and averages across many trials. Both sides agree this procedure licenses claims about the aggregate population of trials but does not license claims about the necessity or shape of the signal in any single trial without further assumption.

  1.4 The paradigm measures arbitrary action, not reasoned choice. The tasks require movement without external cues or specific reasons for timing. Both sides agree the results directly constrain models of spontaneous motor initiation but do not directly measure deliberative decision-making involving weighing of reasons.

  1.5 The results do not settle metaphysical compatibilism. Both sides agree that neither the existence of the readiness potential nor the timing of the urge logically entails the truth or falsity of compatibilism or incompatibilism regarding moral responsibility. The dispute concerns the causal architecture of action, not the metaphysical conditions of freedom.

  2. RESIDUAL DISAGREEMENTS

  We disagree on the interpretation of the agreed claims. These disagreements are formulated here in the strongest terms each side can accept.

  2.1 The nature of the pre-movement signal. The deflationary camp holds that the readiness potential reflects stochastic background fluctuations in motor cortex that accumulate to a threshold, unrelated to a specific decision until the threshold is crossed. The constraint camp holds that the signal reflects a specific pre-conscious commitment or preparation to act that constitutes a decision prior to awareness.

  2.2 The status of the reported urge. The deflationary camp holds that the reported time of the urge is a retrospective timestamp constructed after the fact, potentially confabulated to align with the movement. The constraint camp holds that the urge is a veridical readout of a conscious state that genuinely arises after neural commitment has already begun.

  2.3 The relevance to reasoned action. The deflationary camp holds that because the task removes reasons for action, the results are irrelevant to everyday free will which is reason-responsive. The constraint camp holds that if consciousness does not originate arbitrary acts, the burden of proof shifts to show it originates reasoned acts, suggesting consciousness may generally ratify rather than initiate.

  3. CRUXES

  We identify the following points as critical to resolving the dispute.

  3.1 Empirical Crux: Single-trial predictability. Whether the neural signal on a single trial reliably predicts the specific timing and choice before the subject reports awareness. Settling this would move the deflationary camp if single-trial decoding proves robust.

  3.2 Empirical Crux: Modulation by deliberation. Whether instructing subjects to deliberate changes the neural trajectory. Settling this would move the constraint camp if deliberation shows no effect on the pre-conscious signal.

  3.3 Conceptual Crux: The definition of decision. Whether a threshold-crossing event counts as a decision even if not consciously accessed. Settling this would move the deflationary camp if they accept sub-personal decisions as decisions.

  3.4 Verbal Crux: Causation. Whether conscious awareness must be the initial cause to be causally relevant. Settling this would move the constraint camp if they accept modulation as a form of control.

  4. DISCRIMINATING CASES AND EXPERIMENTS

  For each empirical crux, we specify an experiment both sides agree would bear on the issue, with predictions recorded in advance.

  4.1 The Deliberation Variant.
  Procedure: Participants are instructed to weigh reasons for moving left or right (e.g., based on a displayed cue) rather than waiting for an urge to move arbitrarily.
  Deflationary Prediction: The pre-movement potential will remain unchanged in onset and shape relative to movement, as motor preparation is distinct from deliberation.
  Constraint Prediction: The pre-movement potential will be attenuated or shifted closer to movement, as conscious deliberation alters the neural trajectory of commitment.

  4.2 The Stakes Variant.
  Procedure: Participants choose between two actions where one carries a real penalty or reward, introducing reason-based motivation rather than arbitrary selection.
  Deflationary Prediction: Lateralized decoding of choice will still precede awareness by seconds, as value processing is also unconscious.
  Constraint Prediction: Lateralized decoding will collapse toward the time of awareness, as reason-responsive choices require conscious engagement earlier in the process.

  4.3 The Veto and Point-of-No-Return Variant.
  Procedure: Participants are asked to prepare a movement but stop it at the last possible moment, identifying the point where cancellation becomes impossible.
  Deflationary Prediction: The veto signal itself will show pre-conscious onset, leading to a regress where conscious stopping is also an illusion.
  Constraint Prediction: The veto represents a distinct conscious control mechanism that can interrupt the unconscious preparation, preserving a locus for free will.

  5. VERBAL DISPUTES

  We identify the following terminological confusions that exacerbate substantive disagreement.

  5.1 Decision.
  Deflationary Reading: A decision requires conscious endorsement or access.
  Constraint Reading: A decision is any neural commitment that fixes a future action, regardless of awareness.
  Proposed Stipulation: Distinguish between proximal motor decision (neural commitment) and distal policy decision (conscious endorsement).

  5.2 Cause.
  Deflationary Reading: To cause an action, consciousness must initiate the chain.
  Constraint Reading: To cause an action, consciousness must modulate or constrain the chain, even if not initiating it.
  Proposed Stipulation: Distinguish between causal initiation (start of chain) and causal modulation (alteration of probability or trajectory).

  6. CLOSING ASSESSMENT

  We agree that further averaging of arbitrary motor tasks will not move the debate. The dispute would be moved by single-trial decoding evidence that definitively shows whether the signal is noise or commitment, and by evidence showing whether conscious deliberation alters the neural precursor signal. The dispute would not be moved by metaphysical arguments that ignore the mechanistic data, or by replications of the original paradigm that do not address the averaging artifact or the arbitrary nature of the task. We commit to designing the discriminating cases listed above to test these specific mechanisms.

