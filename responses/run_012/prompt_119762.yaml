  ### Decomposition of Terms

  **T1: Unity of the "For" Relation (Probability: 0.85)**
  *   *Thesis:* Reasons for attitudes (belief, admiration, desire) share a univocal normative "for" relation. There are not fundamentally different *kinds* of normativity for different attitudes, only different constitutive aims.
  *   *Reasoning:* If the "for" relation is equivocal (e.g., pragmatic "for" vs. epistemic "for"), the WKR problem dissolves into a linguistic ambiguity. Claim C requires a single normative space where reasons can be sorted into "Right" and "Wrong." The high probability here reflects the consensus that normativity is unified, even if its application varies.
  *   *Impact on C:* High support. If T1 is false, C is category-mistaken.

  **T2: Priority and Identity of Fittingness (Probability: 0.40)**
  *   *Thesis:* Fittingness is not prior to reasons in a way that makes fittingness-facts distinct from object-facts. Specifically, the fact "X is admirable" is not metaphysically distinct from "Admiring X is fitting."
  *   *Reasoning:* This is the critical failure point for C. Claim C classifies Case (2) as WK because the payout depends on "whether admiring that person would be fitting." C treats this as a *fact about the attitude*. However, on standard Fitting-Attitude (FA) analyses, the value of the object *just is* the fittingness of the attitude toward it. If "X is valuable" = "Attitude toward X is fitting," then a payout keyed to fittingness is keyed to the object's value. Classifying this as WK requires driving a wedge between the object's value and the attitude's fittingness that FA theories typically deny.
  *   *Impact on C:* Negative weight. The lower this probability, the lower the credence in C.

