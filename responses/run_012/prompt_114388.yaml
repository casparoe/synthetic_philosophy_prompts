answer: |-
  Here is an accuracy audit of the sketch, addressing your five specific points.

  ### 1. Audit of Claims: Fair, Loose, or Misrepresentation?

  The sketch is a composite of a specific strand of utilitarian contract theory and a strawman of its critics.

  *   **"A promise binds because breaking it would disappoint expectations one has deliberately raised."**
      *   **Verdict:** **Fair, but incomplete.** This is the core intuition of the expectation view. A careful defender would accept this as the *phenomenology* of the obligation. However, they would clarify that it is not merely the *psychological disappointment* that binds, but the *violation of an entitlement* to expect.
  *   **"The obligation is... a special case of the general duty not to cause harm."**
      *   **Verdict:** **Loose simplification.** This is defensible only if "harm" is defined normatively rather than empirically. If "harm" means "setback to welfare," many promise theorists reject this. If "harm" means "wrongful setback to interests one has a right to protect," it is closer to the truth. The sketch implies the former (empirical welfare), which is a simplification that weakens the theory.
  *   **"Frustrating that reliance is simply one way of harming them."**
      *   **Verdict:** **Misrepresentation.** This conflates reliance losses (out-of-pocket costs incurred due to the promise) with expectation losses (the failure to receive the promised performance). A careful defender distinguishes these. I can be harmed by a broken promise even if I relied on nothing (e.g., I didn't buy the ticket yet, but I was promised one). The sketch treats reliance as the *source* of the harm, whereas sophisticated views treat the *promise itself* as creating the interest that is harmed.
  *   **"There is nothing distinctively moral about the institution of promising itself."**
      *   **Verdict:** **Outright Misrepresentation.** Very few serious expectation theorists argue there is *nothing* distinctively moral about it. Most argue that the *principle* of fidelity (keeping faith) is a distinct moral principle, even if it is grounded in the management of expectations. The sketch presents a crude reductionism that most defenders have abandoned.
  *   **"Binding force is exhausted by the harm of disappointed reliance."**
      *   **Verdict:** **Misrepresentation.** This is the weakest link. It suggests that if I can break a promise without causing measurable reliance loss (e.g., I tell you I'll meet you for lunch, you don't change your plans, I don't show up), I have done no wrong. Most expectation theorists argue the wrong lies in the betrayal of the *assurance* given, regardless of reliance.

  ### 2. Expectation vs. Reliance: The Conceptual Slippage

  Your suspicion is correct: collapsing "expectation" and "reliance" is where the sketch loses its footing.

  *   **The Distinction:** **Reliance** refers to changes in position made *because* of the promise (e.g., spending money, foregoing other opportunities). The harm is measured against the *status quo ante* (you are worse off than before the promise). **Expectation** refers to the entitlement to the promised performance itself. The harm is measured against the *promised future* (you are worse off than you would have been had the promise been kept).
  *   **What Turns on It:** If you collapse them, the obligation becomes contingent on the promisee's actions. If the promisee is cautious and relies on nothing, the promisor (on the sketch's view) is off the hook. This contradicts our intuitive understanding that a promise creates an obligation *immediately*, not only once the other party acts on it.
  *   **Commitment Changes:** By keeping them apart, an expectation account commits to the idea that the *speech act* of promising transfers a right to the promisee. The promisee now "owns" the future performance. By collapsing them into reliance/harm, the sketch commits to the idea that the promisor merely has a duty to be careful not to make the promisee worse off. The former is a duty of **fidelity**; the latter is a duty of **care**. The sketch claims to describe fidelity but actually describes negligence.

  ### 3. The Dead Promisee: Refutation, Puzzle, or Strawman?

  The case of the promisee who dies before the breach is a classic objection (often associated with Hume), but its force depends entirely on how "expectation" is defined.

  *   **Against the Sketch:** It is a **refutation** of the sketch's specific formulation. The sketch defines the binding force as avoiding "disappointed expectations" (a psychological state) and "harm" (a setback to welfare). A dead person has no psychological states and, arguably, no welfare to setback. On the sketch's terms, the obligation evaporates.
  *   **Against a Sophisticated Account:** It is merely a **genuine puzzle**, not a refutation. A robust expectation theory does not ground the obligation in the promisee's *current* mental state, but in the **normative relationship** established at the moment of promising. When A promises B, A gives B a right. Rights can survive the holder (passing to an estate) or remain inviolable as a matter of the promisor's integrity.
  *   **The Illicit Move:** The sketch assumes the "harm" must be experienced subjectively by the victim. If the harm is understood as the **violation of a right** previously transferred, the death of the promisee does not necessarily extinguish the duty (though it might affect who can claim the performance). Therefore, the objection only bites against the psychological/reductionist version presented in the sketch, not against expectation accounts that incorporate normative rights.

  ### 4. Reduction to the Duty Not to Harm: Inference or Overreach?

  The conclusion that promising "reduces to" the general duty not to harm is an **overreach** that does not follow from the accurate parts of the sketch.

  *   **The Error:** This is a category mistake regarding the source of the duty. In the general duty not to harm (e.g., do not punch), the duty exists *independently* of any interaction between the parties. In promising, the "harm" is conceptually **parasitic** on the promise.
  *   **Why it Matters:** If I raise expectations without promising (e.g., by being reliable in the past), I may create an expectation, but I do not necessarily incur a promissory obligation. The sketch suggests the *expectation* creates the duty. A more accurate view is that the *promise* creates the entitlement to the expectation.
  *   **The Overreach:** To say the obligation is "exhausted" by the duty not to harm implies that if we could prevent the harm (e.g., by compensating the promisee fully), the wrong would be erased. But promissory obligations often resist this. We often think it is wrong to break a promise *even if* we compensate the promisee for the harm. The "distinctively moral" element the sketch denies is the **duty of performance**, not just the duty of compensation. The reduction fails because it cannot explain why the specific performance matters, only why the welfare loss matters.

  ### 5. Directed Obligations and Waivability: A Structural Blind Spot

  The sketch's framing struggles to register the distinction between general duties and directed obligations, specifically regarding waivability.

  *   **The Problem:** The sketch frames the obligation as a "duty not to cause harm." Generally, moral duties not to harm are not fully waivable by the victim (e.g., you cannot consent to be murdered in many moral frameworks, or at least the duty is not *solely* up to you). However, promissory obligations are distinctively **waivable by the promisee**. If the promisee releases the promisor, the obligation disappears entirely, even if "expectations" were raised.
  *   **Can the Sketch Register This?** Only awkwardly. It would have to treat the promisee's release as "consent to be harmed." But this misdescribes the phenomenon. When you release me from a promise, you are not consenting to harm; you are **relinquishing a claim-right**.
  *   **Accommodating the Distinction:** To accommodate directedness, the theory must shift from a "harm model" to an "authority model." The promise gives the promisee **authority** over the promisor's action regarding the promised content.
      *   *Harm Model:* I must not hurt you. (Focus on the outcome).
      *   *Authority Model:* You have a say in what I do. (Focus on the relationship).
  *   **The Audit:** The sketch cannot accommodate this without significant revision. If the obligation is just about preventing harm, the promisee's waiver is irrelevant if the harm still occurs (e.g., to third parties or to the moral order). If the obligation is directed, the promisee's will is constitutive of the obligation's existence. The sketch treats the promisee as a passive victim of disappointment, not an active holder of a right.

  ### Summary of the Audit

  *   **What Survives:** The intuition that promising involves the deliberate raising of expectations and that breaking promises often causes harm.
  *   **What Fails:** The reduction of that harm to simple reliance losses; the claim that the obligation is exhausted by harm prevention; and the inability to account for obligations that survive the promisee's psychological state or are waivable by the promisee.
  *   **The Core Error:** The sketch confuses the **evidence** of the obligation (disappointed expectations) with the **ground** of the obligation (the transfer of normative authority). It treats promising as a causal mechanism for harm rather than a normative mechanism for creating rights.
