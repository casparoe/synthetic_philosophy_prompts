answer: |-
  1. **Mixture Ontology**
  In your elimination of A, is the 50-50 mix of B and C a physical randomization device I must use, or merely a representation of your uncertainty about my choice?
  *Follow-up:* If she claims it represents opponent uncertainty, ask: Then how does *my* rationality compel me to eliminate A if I have no intention of randomizing and know my own pure intent?

  2. **VNM and Risk**
  Against column A, the mix is a lottery of 3 or 0 while A is a sure 1; if my utility is the square root of payoff, A dominates the mix, so doesn't your argument presuppose the payoffs are already VNM utilities?
  *Follow-up:* If she concedes payoffs must be utilities, ask: Then isn't dominance reasoning parasitic on utility theory rather than a foundational justification for rationality itself?

  3. **Strategy B's Status**
  Strategy B is required to dominate A, but B is strictly dominated by C in the second round; is it coherent to justify eliminating A using a strategy you admit no rational agent would ultimately play?
  *Follow-up:* If she argues it's merely counterfactual, ask: Then why does the unique solution depend on the existence of a strategy that is irrational in the very epistemic state you're describing?

  4. **Epistemic Conditions**
  B is the unique best reply to A, so eliminating B seems to require believing you won't play A; isn't that a belief assumption rather than a pure rationality constraint?
  *Follow-up:* If she claims it follows from rationality alone, ask: But only if I assume *you* are rational, which is an assumption about your mind, not a constraint on my choice architecture.

  5. **Correlation and Independence**
  If our actions are correlated such that you play A exactly when I play C, the mix yields 0 while A yields 1; doesn't dominance reasoning silently require an independence assumption between our choices?
  *Follow-up:* If she says independence is standard, ask: Then isn't the "belief-free" advantage of dominance illusory, since it relies on a specific structural assumption about the belief space?

  6. **Order Independence**
  Strict dominance is order-independent, but weak dominance isn't; is this mathematical luck, or does it signal that strict dominance captures something ontological about rationality that weak dominance misses?
  *Follow-up:* If she calls it structural, ask: Then why do we often model real-world constraints with weak dominance if it lacks that structural stability?

  7. **Dominance vs. Nash**
  Do you see dominance-solvability as an argument for why Nash equilibrium holds, or as a replacement that makes Nash equilibrium obsolete?
  *Follow-up:* If she argues for replacement, ask: Then how do you solve games that are not dominance-solvable without smuggling Nash back in through the back door?

  8. **Epistemic Baggage**
  If dominance relies on VNM utilities, independence, and common knowledge, isn't it just Nash equilibrium in disguise, stripped of the fixed-point math but keeping the epistemic baggage?
  *Follow-up:* If she denies the baggage, ask: Then what specific epistemic condition are you dropping that Nash requires, given both yield (C,C) here?

  9. **The "Engine" Claim**
  You call dominance the "real engine," but if it requires the same heavy epistemic lifting as Nash, what explanatory work is left that Nash isn't already doing?
  *Follow-up:* If she cites conceptual clarity, ask: But if the predictions are identical, isn't this just a semantic preference rather than a theoretical advance?
