answer: |-
  Dear Seminar Coordinator, after two years of debating quotas between ourselves, we have realized that our disagreement persists not because we are ignoring each other, but because we have never fully mapped where we stand together versus where we truly diverge, so this document serves as the joint statement we should have written ages ago to clarify both our common ground and the specific cruxes that keep us apart. We want to begin by stating the claims we both accept, which are that 1) quotas function by restricting choice based on group identity rather than individual metrics in marginal cases, 2) quotas do not directly fix underlying pipeline issues like primary education quality or early career networking, and 3) valid evidence for or against them must track long-term outcomes for beneficiaries and institutions rather than just immediate admission or appointment rates. We also agree that the debate is often muddied by sliding between three distinct settings as if they raised the identical question, when in fact the mechanics and histories differ significantly, so we intend to treat US university admissions, India's reservation system with its caste-based seats and newer income-based quota layered on top, and Norway's boardroom quota for women as separate cases where evidence might point in different directions. In the US context, the mechanism is holistic review within a private or public admissions office, in India it is a constitutional mandate reserving seats in public education and government jobs based on historical caste oppression with recent adjustments for economic weakness, and in Norway it is a legislative requirement for public limited companies to ensure women hold at least 40 percent of board seats, and we agree that conflating the moral weight of caste oppression with the corporate governance goals of Norway or the diversity goals of US universities is a category error that has stalled our progress.

  Having established where we stand together, we need to state our remaining disagreements in words that the side holding them would accept as fair, without strawmen. She argues that quotas are a necessary correction to a rigged starting line, meaning that without them, historical inertia and systemic bias ensure that the selection process is formally fair but substantively broken, perpetuating exclusion regardless of individual merit. I argue that quotas are a licence to discriminate by group, meaning that they undermine the principle that individuals should be judged on their own capacities and actions, and that using group identity as a proxy for disadvantage inevitably harms innocent individuals within the non-preferred groups while stigmatizing those within the preferred groups. We recognize that these positions are not merely semantic, but they do rely on different empirical assumptions about how the world works when quotas are introduced, which leads us to identify the cruxes, the sub-questions where settling things would actually move one of us.

  The first crux concerns the right counterfactual baseline, specifically who would have gotten in anyway if the quota were removed. She believes that without quotas, the spots would go to candidates from dominant groups who are less qualified in terms of potential contribution but benefit from unearned advantages, whereas I believe that without quotas, the spots would often go to candidates who are similarly qualified on measurable metrics but are excluded solely to make room for group representation, or that the pool itself would shrink due to reduced incentives. To test this, we agree that the relevant evidence would be data on waitlist movements in US admissions, cutoff score fluctuations in India's entrance exams during reservation policy changes, and the qualification metrics of board members before and after the Norway mandate. Before looking at this data, she predicts that removing quotas will show a significant drop in diversity without a corresponding rise in measurable performance metrics, suggesting the original pool was biased, while I predict that removing quotas will show a rise in average standardized test scores or prior financial performance metrics without a catastrophic drop in diversity, suggesting the quota was displacing higher-scoring individuals.

  The second crux is about whether the point is representation of a group or opportunity for individuals. She holds that the goal is representation of a group because certain groups have been historically excluded from power structures, and having them present is a public good that legitimizes the institution regardless of the individual pathway. I hold that the goal is opportunity for individuals because justice is done to persons, not groups, and that focusing on group representation treats individuals as means to a demographic end rather than ends in themselves. The relevant evidence here involves longitudinal studies on whether quota beneficiaries feel empowered or stigmatized, and whether the presence of diverse role models increases application rates from those groups in subsequent years. She predicts that representation leads to a virtuous cycle where increased visibility drives higher application rates and performance from the group, validating the policy, while I predict that representation leads to a stigma effect where beneficiaries are perceived as less competent by peers and themselves, reducing long-term efficacy and reinforcing stereotypes.

  The third crux, which we suspect might be partly verbal, concerns the definition of merit. We suspect that part of our disagreement turns out to be about words rather than substance because when I say merit I am referring to standardized metrics like test scores or past revenue growth, whereas when she says merit she includes lived experience and the potential for diverse perspective as a valuable skill set. If we agree that diverse perspective is a form of merit relevant to the institution's goals, then my objection weakens because quotas are simply selecting for a different kind of merit, but if we agree that merit must be blind to identity to be fair, then her objection weakens because quotas violate that blindness. We agree to treat this as a substantive disagreement about institutional purpose rather than just semantics, specifically whether a university or corporation exists to reward past individual achievement or to engineer future social outcomes.

  Finally, we commit to reviewing the evidence specified above together before the next seminar session, with our predictions written down here to prevent hindsight bias. We acknowledge that if the data shows that quotas consistently lower performance metrics without achieving social mobility, I will be moved to oppose them more strongly, and if the data shows that quotas consistently correct for hidden biases without lowering performance and increase long-term group participation, she will be vindicated, but if the data is mixed across the three settings, we agree to adjust our positions to reflect that quotas are context-dependent tools rather than universal moral principles. We hope this document serves as a model for how to disagree productively by isolating the specific empirical claims that drive our moral intuitions, and we submit this as our joint statement for the seminar.
