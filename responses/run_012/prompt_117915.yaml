          *   *Cheapest Drop:* Soften #4. Acknowledge that democracy isn't just simple majoritarianism; it's majoritarianism *within constraints*. Or soften #3: Constitutions aren't Ulysses contracts; they are rules of the game, not substantive bindings.
          *   *Cost:* If you soften #4, you're less of a "thoroughgoing democrat." If you soften #3, you lose the powerful analogy that legitimizes entrenched rights.

