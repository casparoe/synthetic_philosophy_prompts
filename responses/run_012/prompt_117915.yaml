          *   *Cheapest Drop:* Drop #2's *ontological* claim, keep the *functional* claim. Reframe #2 not as "deeper self" but as "more considered judgment."
          *   *Cost:* You lose the strong moral intuition that the "cool" self *owns* the "hot" self. You have to argue based on welfare or consistency, not identity.
          *   *Alternative:* Drop #6. Believe in a narrative self or hierarchical preferences.
          *   *Cost:* Metaphysical baggage you might not want.

