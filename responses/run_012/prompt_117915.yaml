          *   #4 says Current majority preferences have a real claim, and courts (enforcing entrenchment) overriding them is suspicious.
          *   *Severity:* High. This is the classic "Counter-Majoritarian Difficulty." If the current majority wants X, and the Constitution (past majority) says Not-X, #3 says honor the Constitution (self-binding), #4 says honor the Current Majority (democracy).

      *   **Conflict C: #1/#3 vs. #5 (The Paternalism Clash).**
          *   #1/#3 say binding yourself (or the polity) is good/rational/legitimate.
