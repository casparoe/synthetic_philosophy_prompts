      *   *What changes my mind?* If the user argues #2 is merely metaphorical. But they said "What makes them binding is..." which sounds ontological.
      *   *Where am I wrong?* Maybe #2 doesn't require a metaphysical "true self," just a hierarchy of preferences (Frankfurt). #6 denies a "true self sitting underneath," which might allow for hierarchical preferences *within* the ordinary self. I need to be careful not to over-read #6. #6 says "person who makes promise and breaks it are the same person." #2 says "deeper preferences." These *can* be compatible if "deeper" means "more reflective" not "metaphysically distinct entity." I should note this nuance.
