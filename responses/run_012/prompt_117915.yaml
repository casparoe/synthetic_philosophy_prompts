      *   *Decision:* The biggest contradiction is #2 vs #6. The most politically painful is #3 vs #4. The #2/#6 conflict undermines the solution to #3/#4.

      *   *Recommendation:* Drop the "deeper self" language in #2. Replace with "procedural superiority" or "temporal neutrality." This saves #1 and #3 without requiring the metaphysics of #6 to be false. However, this makes #3 harder to defend against #4. So the *real* tension is actually #3 vs #4, exacerbated by #6.
      *   *Wait, let's look closer.* If I drop #2 (deeper self), why is the Ulysses contract binding? Usually, it's because it respects autonomy. If #6 is true (no unified self), does autonomy survive? Yes, if we view the person as a sequence of time-slices agreeing to a treaty.
