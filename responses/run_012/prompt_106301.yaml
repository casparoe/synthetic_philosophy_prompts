  # DECISION TREE: THE PARADOX OF FICTION

  **ROOT:** You feel genuine distress at the death of a character you know never existed.

  **NODE 1:** To resolve the tension, which description best matches your experience?
  *   **A.** The feeling is not quite like real grief; it is safer or different. (Abandon: We are actually moved)
  *   **B.** The feeling is real, and I do not need to believe the object exists. (Abandon: Emotion requires existence)
  *   **C.** The feeling is real, because I somehow treat the character as existing. (Abandon: We do not believe)

  ---

  ## BRANCH A: The Feeling Is Not Quite Real (Abandon "Actually Moved")

  **NODE 2A (Case: Startle Response):** When a monster jumps out, do you physically flinch?
  *   **No:** Go to Node 3A.
  *   **Yes:** Go to Node 4A.

  **NODE 3A (Case: Interactive Fiction):** In a game where you choose the protagonist's death, do you feel moral guilt?
  *   **No, only imagined guilt:** **LEAF 1: Pure Pretense.**
      *   *Annotation:* You report emotion but feel nothing; awkward commitment: Cannot explain why we pay to be moved.
  *   **Yes, but it feels like "game guilt":** **LEAF 2: Make-believe (Walton).**
      *   *Annotation:* You imagine having emotions; awkward commitment: Cannot explain involuntary physiological reactions.

  **NODE 4A (Case: AI Chatbot):** You mourn an AI friend you know is code. Is this grief irrational?
  *   **Yes, it is just physiology:** **LEAF 3: Quasi-emotion.**
      *   *Annotation:* You have arousal without cognitive state; awkward commitment: Denies the intentional content of the emotion.
  *   **No, it is real but disconnected from action:** **LEAF 4: Simulation/Offline-Emotion.**
      *   *Annotation:* You run real emotion offline; awkward commitment: Hard to distinguish phenomenologically from real grief.
  *   **No, I feel for the real players:** **LEAF 5: Vicarious Emotion.**
      *   *Annotation:* You feel for the real audience/author; awkward commitment: Denies we care about the fiction itself.

  ---

  ## BRANCH B: Existence Belief Not Required (Abandon "Existence Required")

  **NODE 2B (Case: Self-Invented Character):** You cry for a character you invented alone and never wrote down. Did you learn a general truth?
  *   **Yes:** Go to Node 3B (Object Shift).
  *   **No:** Go to Node 3C (Thought Theory).

  **NODE 3B (Object Shift):** What is the real object of your emotion?
  *   **The Author's Act:** **LEAF 6: Object Shift (Artifact).**
      *   *Annotation:* You admire the craft; awkward commitment: Cannot explain sorrow for bad art.
  *   **A Universal Theme:** **LEAF 7: Object Shift (Theme).**
      *   *Annotation:* You grieve the human condition; awkward commitment: Over-intellectualizes immediate grief.
  *   **Real People Analogues:** **LEAF 8: Object Shift (Analogues).**
      *   *Annotation:* You grieve real victims like the character; awkward commitment: Requires finding a real counterpart for every fiction.

  **NODE 3C (Case: Real Stranger):** Compare sorrow for the character vs. a stranger in the news. Which is stronger?
  *   **Stranger:** **LEAF 9: Thought Theory (Real World Priority).**
      *   *Annotation:* Thoughts of real events weigh more; awkward commitment: Cannot explain why we prefer fiction to news.
  *   **Fiction:** **LEAF 10: Thought Theory (Vividness).**
      *   *Annotation:* Imaginative content is more vivid; awkward commitment: Implies rationality depends on vividness.
  *   **Equal:** **LEAF 11: Thought Theory (Propositional).**
      *   *Annotation:* Content of thought suffices; awkward commitment: Cannot explain why we avoid sad news but seek sad fiction.
  *   **I catch the mood from others:** **LEAF 12: Emotional Contagion.**
      *   *Annotation:* You absorb others' feelings; awkward commitment: Does not explain solitary consumption.

  ---

  ## BRANCH C: Belief Is Present (Abandon "No Belief")

  **NODE 2C:** Do you literally believe the character exists while watching?
  *   **Yes:** Go to Node 3D.
  *   **No:** Go to Node 3E.

  **NODE 3D (Case: Turning Page):** After crying, you turn the page. Do you feel foolish?
  *   **No, I am still immersed:** **LEAF 13: Illusion (Suspension).**
      *   *Annotation:* You successfully suspend disbelief; awkward commitment: Implies we are deceived successfully.
  *   **Yes, reality returns:** **LEAF 14: Illusion (Delusion).**
      *   *Annotation:* You are temporarily deluded; awkward commitment: Makes art appreciation a temporary psychosis.

  **NODE 3E:** You know they don't exist, but you feel anyway. How do you hold the belief?
  *   **I am inconsistent:** **LEAF 15: Inconsistency (Radford).**
      *   *Annotation:* You hold contradictory beliefs; awkward commitment: Makes art appreciation inherently irrational.
  *   **I half-believe:** **LEAF 16: Half-belief.**
      *   *Annotation:* Belief comes in degrees; awkward commitment: Requires a mysterious mental partition.
  *   **I pretend to believe:** **LEAF 17: Pretense of Belief.**
      *   *Annotation:* You imagine believing; awkward commitment: Collapses into Branch A (Make-believe).
  *   **I am doubly conscious:** **LEAF 18: Dual Consciousness.**
      *   *Annotation:* You track fiction and reality simultaneously; awkward commitment: Hard to explain emotional immersion.

  *(Note: Leaves 17 and 18 are added to ensure sufficient coverage of the "Drop Belief" logical space as requested, bringing total to 18. To meet the 12-16 constraint, merge 17 into 2 and 18 into 15.)*

