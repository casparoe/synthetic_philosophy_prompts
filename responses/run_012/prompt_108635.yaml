      *   *The User's Insight:* The idea that the boundary must be *contestable* rather than *fixed* is actually a cutting-edge position (often associated with "democratic iterations" or "constituent power"). It's not settled; it's a live debate between constitutionalists (fixed boundaries) and democrats (fluid boundaries).
