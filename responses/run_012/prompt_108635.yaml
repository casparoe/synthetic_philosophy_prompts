answer: |-
  Here is the thinking process and the resulting proposal draft.

  ### Part 1: Assessment and Brainstorming

  **First, the "Settled Question" Flag:**
  I need to be honest with you: You have not discovered a paradox that political philosophers are unaware of. This is known as **the boundary problem** (or the problem of the *demos*). It was famously articulated by Frederick Whelan in the 1970s and discussed by Robert Dahl. The circularity you identified (you need a *demos* to decide who is in the *demos*) is the central puzzle of the field.

  *However*, do not be discouraged. While the *problem* is known, the *solution* is absolutely not settled. The mainstream attempts (all-affected, all-subjected) are widely acknowledged to be flawed for the exact reasons you suspect. Your intuition—that the solution is not a fixed line but a *process of contestation*—is a sophisticated, cutting-edge position (often associated with "democratic iterations" or "constituent power"). It is a viable, strong contribution, provided you frame it as engaging with an existing debate rather than discovering a new glitch.

  **Brainstorming Ways to Sharpen the Question:**
  To make this a research project rather than just a musing, we need to move from "This is circular" to "Here is what we do about it." Here are four ways to frame it:

  1.  **The Institutional Design Approach:** How do we build legal mechanisms that allow boundaries to change without requiring a super-majority that entrenches the status quo? (Focus: Law/Policy).
  2.  **The Normative Justification Approach:** If boundaries are fluid, what prevents chaos? Is there a moral duty to listen to boundary challenges even if you reject them? (Focus: Ethics).
  3.  **The Phenomenological Approach:** How does the *experience* of being on the border change one's relationship to democracy? (Focus: Psychology/Experience).
  4.  **The Legitimacy Approach:** Does a democracy lose its right to rule if it claims its boundaries are fixed and natural rather than political and contingent? (Focus: Political Theory).

  **The Selection:**
  I recommend **Option 4 (The Legitimacy Approach)**.
  *Why?* It fits your strengths as a novelist. You don't need to design laws (Option 1) or run interviews (Option 3). You are already exploring the *claim* to legitimacy in your novel. This approach allows you to argue that **democratic legitimacy is not a state of being, but an ongoing practice of justification.** It transforms the "bug" (circularity) into a "feature" (permanent accountability). It is tractable for a writer because it relies on conceptual clarity and argumentation rather than data collection.

  ***

  ### Part 2: The Research Proposal

  **Project Title:** The Porous Border: Democratic Legitimacy and the Right to Contest the *Demos*

  **Project Summary**
  This essay project investigates the "boundary problem" in democratic theory: the paradox that the people who constitute a democracy cannot democratically decide who belongs to that people. Standard solutions—such as the "all-affected" or "all-subjected" principles—attempt to draw a correct, static line around the *demos*. This project argues that these solutions fail because they treat a political question as a technical one. Instead, I propose that democratic legitimacy does not depend on drawing the boundary correctly, but on maintaining the boundary as permanently revisable. Using a case study of a municipal referendum on non-resident voting, I will argue that the right to contest the boundary is more fundamental than the boundary itself.

  **The Research Question**
  *Does democratic legitimacy require a fixed definition of the people, or does it require the institutionalized capacity to redraw that definition?*

  Current democratic theory often assumes that for a vote to be legitimate, the electorate must be defined prior to the vote. This project challenges that assumption. It asks whether a democracy is actually *more* legitimate when it acknowledges the contingency of its own borders. The specific inquiry is: If we accept that the "all-affected" principle is logically circular, does shifting the focus from *outcome* (the correct line) to *process* (the right to challenge the line) resolve the paradox without dissolving the state?

  **Gap in Existing Approaches**
  The two dominant criteria for defining the *demos* are the **all-affected principle** (anyone impacted by a decision should vote) and the **all-subjected principle** (anyone subject to coercion should vote).
  *   **The Limitation:** Both criteria suffer from the "boundary problem." To decide who is "affected" or "subjected," you first need a decision-making body to interpret those terms. But that body's own legitimacy depends on who is inside it. This creates a vicious circle.
  *   **The Proposed Shift:** Most literature tries to break the circle by finding a "fact" outside of politics (geography, citizenship, interest) to anchor the boundary. This project argues that the circle cannot be broken, only inhabited. The gap in the literature is a robust defense of *contestation* as a substitute for *correctness*. I aim to show that a boundary is legitimate not because it is right, but because it is open to challenge.

  **Methodology**
  As a writer rather than a social scientist, my method is **conceptual analysis grounded in a thought experiment.** I will not be conducting surveys or archival research. Instead, I will use the scenario from my novel (the coastal town referendum) as a sustained philosophical case study.

  1.  **Textual Engagement:** I will engage closely with key theoretical texts regarding the boundary problem and constituent power. I will map the failures of the "all-affected" principle against the specific constraints of the town scenario.
  2.  **Scenario Stress-Testing:** I will write through the town scenario from multiple angles (the resident, the non-resident worker, the election official) to identify where static definitions of membership break down.
  3.  **Argument Construction:** I will draft a series of interconnected essays that move from diagnosing the paradox to proposing "revisability" as a normative principle.

  **Work Plan (12 Months)**

  *   **Months 1–3: Immersion and Mapping.**
      *   Deep reading of democratic theory concerning the *demos* and boundary problems.
      *   Annotating the novel manuscript to extract specific scenes that illustrate the theoretical paradox.
      *   *Deliverable:* A 10-page annotated bibliography and a detailed outline of the essay sequence.
  *   **Months 4–6: Drafting the Core Argument.**
      *   Writing the first three essays: (1) The Circle (diagnosing the problem), (2) The Fix (why standard solutions fail), (3) The Process (arguing for revisability).
      *   *Deliverable:* 15,000 words of draft material.
  *   **Months 7–9: Stress-Testing and Refinement.**
      *   Testing the "revisability" argument against counter-arguments (e.g., if borders are always open, is there any stability?).
      *   Sharing drafts with a small reading group of philosophers and writers for feedback.
      *   *Deliverable:* Revised manuscripts and a response to objections.
  *   **Months 10–12: Polishing and Submission.**
      *   Finalizing the essays for publication as a cohesive unit (either a monograph or a series in literary/philosophical journals).
      *   Preparing a talk based on the research for a public audience.
      *   *Deliverable:* Final manuscript ready for submission to publishers or journals.

  **Success and Failure Criteria**
  *   **Success:** The project succeeds if I can articulate a coherent normative principle that explains *why* revisability is valuable, not just that it is necessary. A successful outcome is a manuscript that bridges the gap between abstract theory and lived experience, suitable for publication as a nonfiction book or a major essay series.
  *   **Failure:** The project would fail if I remain stuck in the diagnosis of the paradox without offering a constructive way forward. If the conclusion is merely "the problem is unsolvable," the project lacks utility. I mitigate this risk by anchoring the theory in the concrete details of the town scenario, ensuring the argument remains practical.

  **Scope and Feasibility**
  This scope is designed for a single writer over one year. It does not require IRB approval, travel, or research assistants. The risk lies in the theoretical density; to manage this, I will limit the textual engagement to the most essential arguments regarding the boundary problem, avoiding a comprehensive history of democratic theory in favor of depth on this specific puzzle. The dual nature of the project (novel + essays) is a strength, as the fiction provides the concrete examples needed to ground the abstract theory.

  ***

  ### Part 3: A Few Notes for You (The Novelist)

  1.  **The "Gap" Section:** Notice how I phrased the gap. I didn't say "nobody has noticed this." I said "most literature tries to break the circle... this project argues the circle must be inhabited." This shows the fellowship committee you know the field but have a distinct voice.
  2.  **Methodology:** I emphasized that you are doing *conceptual analysis*. This is crucial. If you promise empirical work (interviews, data) and don't deliver, you're in trouble. As a writer, your "data" is the logic of the scenario and the texts. Own that.
  3.  **The "Failure" Condition:** I was honest here. In philosophy, concluding "this is unsolvable" is sometimes a valid result, but for a fellowship, they want to see a path forward. I framed the "failure" as getting stuck in diagnosis, which pushes you to ensure you have a constructive conclusion.
  4.  **Tone:** The proposal is confident but humble. It admits the problem is hard (which it is) but claims you have a specific angle (revisability).

  You are ready to write this. The intuition you have about "permanent revisability" is the heartbeat of the project. Trust it.
