      *   *Selection:* Idea 4 is the strongest for a philosopher/novelist. It moves from "the circle is vicious" to "the circle is actually a spiral/process." It allows for essayistic exploration rather than dry institutional design. Let's refine it to: *Can democratic legitimacy survive without fixed boundaries?*

