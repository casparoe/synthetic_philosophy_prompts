          1.  *The Infinite Regress:* If who decides the demos is decided by the demos, does it ever stop?
          2.  *The Constitutional Fix:* Is the boundary a pre-political fact (geography, culture) rather than a political choice?
          3.  *The Process Fix (User's idea):* Legitimacy comes from the *ability to challenge* the boundary, not the boundary itself.
          4.  *The Stakeholder Fix:* Is there a third category (stakeholders) that avoids the circle?
      *   *Selection:* The Process Fix. It's the most novel and fits the writer's intuition. It transforms a logical bug into a democratic feature.

      *   *Proposal Drafting:*
          *   *Title:* "The Porous Border: Democratic Legitimacy and the Right to Contest the Demos."
          *   *Question:* Does democratic legitimacy require a fixed boundary, or does it require the institutionalized capacity to redraw it?
          *   *Context:* Acknowledge the "all-affected" principle's failure.
