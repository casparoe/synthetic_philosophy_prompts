answer: |-
  ### Q&A Prep Sheet: Karma as Compost

  **Pre-emptive Concessions (First 5 Minutes)**
  *   **Concede the Metaphor:** Explicitly state "compost heap" is a modern heuristic, not a translation of a Sanskrit term. This disarms the Textualists before they stand up.
  *   **Concede the Mechanics:** Acknowledge you are not offering a metaphysical account of *how* karma transmits across lives (no *alaya-vijnana* theory here). You are offering a normative account of *why* the resulting suffering counts as deserved.
  *   **Concede the Scope:** This reading is soterologically instrumental, not soteriologically complete. It explains the logic of suffering, not the exit strategy (Nirvana).

  ---

  ### Objections (Ordered by Damage)

  **1. The Analytic Philosopher (Free Will/Identity)**
  *   **The Objection:** "You've dissolved the agent to save the desert. If the miser dies and a stingy child is born with no memory, you say the character persists. But without psychological continuity or memory, what makes it the *same* character rather than a similar one? If it's just 'similar,' you haven't justified desert, you've just described causal consequences. You're smuggling a self in under the label of 'character.'"
  *   **The Reply (2 mins):**
      *   I'm not claiming it's the same *substance*, but the same *momentum*. Think of a river: the water changes, but the turbulence pattern persists.
      *   **(Fold-in A):** When the miser dies, the *habit energy* (vasana) doesn't vanish; it conditions the next available aggregate. The child isn't "paying" for the miser's act; the child *is* the continuation of that specific turbulence.
      *   Desert attaches to the *structure of the will*, not the memory of the act. If your will is structured by stinginess, the resulting isolation is a fitting description of your reality, not a penalty imposed from outside.
      *   The "injustice" complaint assumes desert requires a creditor. I'm arguing desert requires only a fit between agent-structure and experience.
  *   **Soft Spot:** Relies heavily on the audience accepting a process-metaphysics of persons; substance dualists will remain unconvinced.

  **2. The Textualist (Buddhist Studies/Indian Philosophy)**
  *   **The Objection:** "This is Kantian virtue ethics dressed in Buddhist robes. The Abhidharma debates exist precisely because they *did* treat karma as a causal seed that ripens, not just character analysis. You're solving a Western problem (theodicy) and projecting it backward. Where is this in the texts?"
  *   **The Reply (2 mins):**
      *   **(Fold-in B):** The Abhidharma *was* constructive philosophy. They weren't just cataloging sutras; they were systematizing contradictions to make the doctrine coherent. I am doing Abhidharma, not history.
      *   The "ledger" model creates the very problems the Abhidharmikas struggled with (how does a non-existent past act cause a future result?).
      *   My reading aligns with the *citta-santana* (mind-stream) models where the *quality* of the mind is the primary reality, not the transactional history.
      *   This isn't Western gloss; it's recovering the ethical core that the metaphysical machinery was built to protect.
  *   **Soft Spot:** You cannot cite a specific sutra that explicitly rejects the ledger model; you are arguing from silence and systemic coherence.

  **3. The Anthropologist (Religious Studies/Lived Religion)**
  *   **The Objection:** "This might work in a seminar, but does it work in a temple? People use karma to explain why they are poor or sick *now*. If you tell them it's not a debt but 'character,' you're blaming them for their structural suffering. You're turning a cosmic safety net into a victim-blaming psychology."
  *   **The Reply (2 mins):**
      *   The ledger model is actually more fatalistic: "I am bankrupt, I must suffer until the debt is paid."
      *   The compost model is agential: "This suffering is the shape of my current habits; change the habits, change the shape."
      *   It shifts the focus from *explanation of the past* to *management of the present*.
      *   It validates the intuition that suffering isn't random without requiring a cosmic bureaucrat.
  *   **Soft Spot:** Assumes practitioners care about agency more than they care about external validation of their misfortune.

  **4. The Commentator (Beginningless Samsara)**
  *   **The Objection:** "If character is the locus of desert, where did the initial character come from? If samsara is beginningless, there's no 'first act' that shaped the character. You've pushed the injustice back one step but haven't solved the regress."
  *   **The Reply (2 mins):**
      *   I am bracketing the cosmological beginning to analyze the *structural logic* of the present moment.
      *   Even in a beginningless stream, any given moment of suffering is intelligible as the fruit of the immediately preceding character state.
      *   We don't need a first cause to validate the fit between current character and current experience.
  *   **Soft Spot:** Doesn't actually solve the metaphysical problem of infinite regress, just sidesteps it.

  ---

  ### The "Hope Nobody Asks" Question

  *   **The Question:** "If nobody is paying for anything, and there is no debtor, why are you still using the word 'Desert'? Why not just call it 'Consequences' or 'Fittingness' and drop the moral baggage entirely?"
  *   **Why it hurts:** It suggests your central thesis is just semantic stipulation. If you remove "desert," you lose the normative force that makes the paper interesting to the ethicists. If you keep it, you invite the "unjust" objections you're trying to dodge.
  *   **Prepared Answer:** "Because 'consequences' implies mere causality (fire burns), whereas 'desert' implies a normative fit specific to *agents*. A rock rolling down a hill has consequences; a miser suffering isolation has desert. I need the word to mark the difference between physical causation and moral intelligibility."

  ---

  ### Strategic Fold-Ins (Cheat Sheet)

  *   **For the Discontinuous Character (Analytic Crowd):**
      *   *Keyword:* **Momentum.**
      *   *Line:* "It's not about the *who*, it's about the *flow*. The stinginess is a turbulence in the stream, not a property of a specific water molecule."
  *   **For the Constructive Philosophy Charge (Textualist Crowd):**
      *   *Keyword:* **Systematization.**
      *   *Line:* "Abhidharma wasn't archaeology; it was engineering. I'm fixing the load-bearing walls, not polishing the bricks."
