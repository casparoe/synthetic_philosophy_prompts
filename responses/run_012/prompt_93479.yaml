answer: |-
  Begin by securing the **normative intuition**. Write "OUGHT" on the board. If rules are merely descriptions of past behavior (psychology), there is no paradox. Your group must feel that a rule claims authority over future cases before they can feel the snap when that authority vanishes. Spend ten minutes establishing that meaning implies correctness conditions, not just regularities.

  **The Example:** Use **continuing a decorative tile pattern** (e.g., Blue, Red, Blue, Red...).
  *   **Why this works:** It is discrete (unlike color words, which invite sorites vagueness), purposeless (unlike recipes, where "taste" arbitrates correctness), and non-causal (unlike signposts, where physics corrects you). It isolates the rule from utility and physics.
  *   **The Move:** You have laid 100 tiles. What comes at 101? The skeptical hypothesis: "Bled" (Blue/Red until 101, then Green). "Bled" fits all past data perfectly. Nothing in your past mental state distinguishes "Red" from "Bled."

  **Order of Operations:**
  1.  **Normativity:** Rules guide; they don't just describe.
  2.  **Finite Past:** Draw the 100 tiles.
  3.  **Skeptical Hypothesis:** Introduce "Bled." Show compatibility with past.
  4.  **The Void:** Demonstrate no mental image, formula, or feeling bridges the gap.
  5.  **Misconceptions:** Address immediately after the void opens.

  **Handling Misconceptions:**
  *   **The Community Solution:** When they say, "It's just what we agree on," intervene. Say: "Kripke calls this a *skeptic's solution*. It explains assertibility, not truth. It shifts the problem from 'me' to 'us,' but doesn't solve the metaphysical gap."
  *   **Nihilism:** If they claim "Nobody means anything," correct them: "Kripke assumes we speak. He asks what *facts* make it true."
  *   **Quine/Private Language:** Explicitly bracket these. Say aloud: "Quine targets scientific theory underdetermination; this targets meaning constitution. Private Language argues against private *rules*; this argues against *facts* about rules. Do not conflate them."

  **Refusals:**
  State clearly: "We are not doing epistemology today. We are not asking how we *know* we follow rules, but what *constitutes* following them. Do not offer psychological mechanisms."

  **Diagnostic Question:**
  End with this: "If you meant 'Alternate' rather than 'Bled,' what fact about you *before* step 101 makes 'Bled' wrong rather than just unused?"

  If they answer with a mental state, they missed the void. If they answer with community usage, they found the solution but missed the paradox. If they struggle to find a fact, they got it.
