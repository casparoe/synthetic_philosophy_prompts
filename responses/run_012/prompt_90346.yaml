prompt: |-
  I am drafting a welfare standard for a retailer that sells farmed finfish, shrimp and other crustaceans, and every clause in it will have to be defended in writing. Before I write the clauses I need the specification: what would any adequate theory of the welfare of these animals have to deliver? I want the desiderata, each with the case or consideration that forces it, rather than a survey of positions — and where a requirement turns out to be the prejudice of one camp rather than a genuine demand on any theory, I want that said plainly.

  The list has to cover at least this ground. What welfare consists in for a fish or a decapod — felt experience, biological functioning, preference satisfaction — and whether an adequate theory must settle that question or may remain neutral among the answers. A criterion of subjecthood: what would make the answer yes or no for a prawn, a mussel and a salmon. The evidential requirements, with an account of why each piece of evidence is supposed to bear on the verdict: nociceptors and whether their signals reach an integrative centre; motivational trade-offs against a noxious stimulus; the reversal of a response by analgesia rather than by anaesthesia or motor blockade; avoidance learning; self-protection; lasting effects of noxious experience. Calibration cases at both ends, since a theory that gets only the easy cases right is worthless here: it must not admit the cases I am confident are non-subjects — a mussel, a plant, an immune response — and must not exclude the ones I am confident are subjects, a salmon, and both kinds of error have to be priced rather than merely avoided. Extrapolation: the standard will be applied across hundreds of species on thin evidence, so the theory must say how far a finding in one taxon licenses an inference about another, and what to do when the case for a species rests only on its relatives. Verdicts about practice: whether the theory can rank, or at least compare, the aversiveness of crowding, air exposure, handling, live chilling, electrical stunning and live boiling, and whether it owes us anything about killing as distinct from suffering. And the treatment of uncertainty: what it says when sentience is plausible but unproven, and whether a precautionary rule belongs to the theory of welfare itself or is a decision rule grafted onto it from outside.

  It should also respect the distinctions that the field tends to collapse — between being sentient and having a welfare, between suffering and dying — and it should explain rather than explain away the cases that embarrass simple views, such as a noxious-evoked withdrawal reflex that outlasts the structures thought necessary for feeling, or a response abolished by a local anaesthetic while the reflex itself remains. Then the part I care about most: flag any pair of these desiderata that cannot be jointly satisfied. I suspect a graded, evidence-proportional account of sentience sits badly with the bright lines a standard needs, and that the demand for specificity is in tension with the demand to avoid false negatives; tell me whether either suspicion is well founded, which single requirement does the most work in excluding candidate theories, and finish with a short assessment of how a feelings-based theory, a functioning-based theory and a preference-based theory each fare against the list.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Goal:** Draft a specification (desiderata) for a theory of welfare for farmed finfish and crustaceans (shrimp, etc.) to underpin a retailer's welfare standard.
      *   **Constraint 1:** Every clause in the eventual standard must be defensible in writing.
      *   **Constraint 2:** The output must be *desiderata* (requirements for the theory), not a survey of existing positions.
      *   **Constraint 3:** Each desideratum must include the *case/consideration* that forces it.
      *   **Constraint 4:** Identify where a requirement is merely a prejudice of one camp rather than a genuine demand.
      *   **Constraint 5:** Cover specific ground: Nature of welfare (felt vs. function vs. preference), Subjecthood criterion, Evidential requirements (nociceptors, trade-offs, analgesia, etc.), Calibration cases (avoid false positives/negatives with pricing), Extrapolation (taxonomic inference), Verdicts on practice (ranking aversiveness, killing vs. suffering), Treatment of uncertainty (precautionary principle).
      *   **Constraint 6:** Respect distinctions (sentience vs. welfare, suffering vs. dying) and explain embarrassing cases (reflexes without feeling, etc.).
      *   **Constraint 7 (Crucial):** Flag incompatible desiderata (tensions/trade-offs).
      *   **Constraint 8:** Identify which single requirement does the most work in excluding candidate theories.
      *   **Constraint 9:** Finish with an assessment of Feelings-based, Functioning-based, and Preference-based theories against the list.
      *   **Tone:** Rigorous, philosophical, precise, unsentimental, actionable for policy drafting.

  2.  **Deconstruct the Desiderata (Drafting Phase):**

      *   *Nature of Welfare:* Does the theory need to pick a lane (hedonic, biological, preference)?
          *   *Consideration:* A retailer needs to know *what* to protect. If welfare is just biological function, stress hormones matter more than pain. If it's feelings, pain matters most.
          *   *Requirement:* The theory must specify the *currency* of welfare. Neutrality is not an option for a standard, even if it is for a philosophy.
      *   *Subjecthood:* What makes a prawn a subject but a mussel not?
          *   *Consideration:* Legal and ethical liability hinges on this.
          *   *Requirement:* A non-arbitrary threshold condition.
      *   *Evidence:* Nociceptors, trade-offs, analgesia, etc.
          *   *Consideration:* We can't ask them. We need behavioral/physiological proxies.
          *   *Requirement:* A hierarchy of evidence weighting.
      *   *Calibration:* False positives (mussel feels pain) vs. False negatives (salmon doesn't).
          *   *Consideration:* Error costs. Over-regulation vs. under-protection.
          *   *Requirement:* An explicit error-cost function.
      *   *Extrapolation:* We have data on salmon/crabs, not every shrimp species.
          *   *Consideration:* Practical applicability across hundreds of species.
          *   *Requirement:* A rule for phylogenetic inference.
      *   *Practice Verdicts:* Crowding vs. Boiling. Killing vs. Suffering.
          *   *Consideration:* The standard needs to ban specific practices.
          *   *Requirement:* Comparability of harms and distinction between death and pain.
      *   *Uncertainty:* Precautionary Principle.
          *   *Consideration:* Science is never 100%.
          *   *Requirement:* Is precaution internal or external?
      *   *Distinctions:* Sentience vs. Welfare. Reflex vs. Feeling.
          *   *Consideration:* Avoiding category errors.
          *   *Requirement:* Mechanism transparency.

  3.  **Identify Tensions/Incompatibilities (The "Hard Part"):**
      *   *Precision vs. Precaution:* A bright line for subjecthood (needed for regulation) conflicts with graded evidence (scientific reality).
      *   *Specificity vs. Generality:* Specific evidence for one species vs. extrapolation to others.
      *   *Feelings vs. Function:* If welfare is feelings, biological function only matters insofar as it impacts feelings. If welfare is function, feelings might be irrelevant.
      *   *The "Prejudice" Check:* Is demanding a "felt experience" theory just a human bias? Yes, potentially. But for a *retailer standard* facing public scrutiny, it's likely a commercial necessity, even if philosophically contestable. I need to flag this.

  4.  **Structure the Response:**
      *   **Introduction:** Acknowledge the task's rigor.
      *   **Section 1: The Desiderata (The Specification):** Grouped logically (Ontology, Epistemology, Application). Each with the "Force" (why it's needed).
      *   **Section 2: The Prejudice Check:** Explicitly state which requirements are philosophical commitments vs. logical necessities.
      *   **Section 3: Incompatible Desiderata:** The trade-offs.
      *   **Section 4: The Exclusionary Requirement:** Which one kills the most theories?
      *   **Section 5: Theory Assessment:** Feelings vs. Functioning vs. Preference.

  5.  **Refining the Content (Self-Correction during drafting):**
      *   *Correction:* The prompt asks for "what welfare consists in... and whether an adequate theory must settle that question." I need to be careful not to just say "It must be feelings." I need to say "The theory must *declare* what it is."
      *   *Correction on Calibration:* The prompt asks for "pricing" errors. I need to frame this as a cost-benefit analysis embedded in the theory's application.
      *   *Correction on Uncertainty:* Is the precautionary principle part of the *theory of welfare* or a *decision rule*? The prompt asks the theory to say. I should require the theory to delineate its boundary.
      *   *Reflexes:* Need to ensure the desideratum demands an explanation for "decerebrate" responses that look like pain but aren't.
      *   *Tone Check:* Keep it dry and analytical. Avoid advocacy.

  6.  **Drafting the Incompatibilities:**
      *   *Tension 1:* The "Bright Line" vs. "Graded Evidence." Regulation needs binary (legal/illegal), science provides probabilities.
      *   *Tension 2:* "Phylogenetic Extrapolation" vs. "Species-Specific Evidence." Assuming a shrimp is like a crab might violate the demand for specific evidence.
      *   *Tension 3:* "Precautionary Principle" vs. "False Positive Pricing." If you price false positives (regulating mussels unnecessarily), you undermine the precautionary approach (protecting potential sentients).

  7.  **Drafting the Theory Assessment:**
      *   *Feelings (Hedonic):* Good on suffering, bad on death (unless death prevents future feelings), hard to measure.
      *   *Functioning (Biological):* Good on health/growth, bad on distinguishing pain from stress, risks "happy slave" problem.
      *   *Preference:* Good on agency, bad on maladaptive preferences (e.g., addiction-like behaviors in fish?), hard to test in captivity.

  8.  **Final Review against Prompt:**
      *   Did I cover nociceptors, trade-offs, analgesia, etc.? Yes, under Evidential Requirements.
      *   Did I cover mussel vs. salmon calibration? Yes.
      *   Did I cover killing vs. suffering? Yes.
      *   Did I flag the prejudices? Yes.
      *   Did I identify the single most exclusionary requirement? Yes (likely the "Currency Declaration" or the "Error Pricing").
      *   Did I maintain the distinction between sentience and welfare? Yes.

  9.  **Final Polish:** Ensure the language is tight. "Desiderata" should sound like engineering specs for a philosophical engine. (Proceed to generate output).

  *(Self-Correction during final review)*: I need to make sure I explicitly answer "whether an adequate theory must settle that question [what welfare consists in] or may remain neutral." My stance will be: For a *standard*, it cannot remain neutral. For a *theory*, it might, but for this *purpose*, it must settle. I will frame this as a requirement for *operationalizability*.

  Also, the prompt asks: "which single requirement does the most work in excluding candidate theories." I need to pick one and defend it. I'll choose the requirement to *price errors* (Calibration), as most philosophical theories ignore the cost of being wrong in the wrong direction.

