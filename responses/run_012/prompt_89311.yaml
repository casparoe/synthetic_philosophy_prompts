prompt: |-
  You are a philosopher whose specialty is the logic of knowledge, testimony, and self-referential reasoning. I want you to work carefully through a strengthened version of the surprise-exam puzzle and then defend a specific thesis about it. Please begin with a few sentences of preliminary clarification: lay out, in your own words, the student's backward induction and the usual attempt to defuse it, and say precisely what makes the strengthened case below harder than the standard one. Only after that groundwork should you turn to the argument proper.

  The case. On Monday morning a teacher announces to a single student: "There will be exactly one exam this week, on one of the five school days, and it will be a surprise — on the morning of the exam you will not know that it is the exam day." Suppose the student has strong grounds for trusting the teacher: the teacher has always been truthful and accurate, and the announcement is public. Finally, the teacher offers a side wager: before Monday's classes the student may stake a large sum, at even odds, on the proposition that there will be no exam this week; the wager is binding and is settled at the end of the week. The student, trusting the teacher, appears able to run the familiar backward induction — if the exam were on Friday she would know it by Thursday evening, so Friday cannot be a surprise; therefore Thursday cannot be a surprise; and so on — and, concluding that no surprise exam is possible, she accepts the wager.

  Your thesis to defend is this: in the strengthened setting the student can at most justifiably believe the teacher's announcement and can never know it, yet the announcement remains consistent and can be kept exactly as stated. Explain how the wager makes the student's attempted certainty self-defeating, and use the case to articulate a general principle about why an announcement whose content concerns the audience's own future ignorance cannot be known by that audience even when it issues from a perfectly reliable source. Then consider and rebut at least one serious objection — for instance, that a reliable source's assertion is already enough for knowledge, or that the wager shows the teacher's promise to be incoherent rather than merely unknowable.

  Define your terms carefully, especially "know," "justified belief," and "surprise," and make the argument rigorous rather than gestural. Be explicit about exactly where the backward induction goes wrong, about what the student does and does not know on the final morning, and about what you take the puzzle to reveal concerning the relationship among testimony, certainty, and self-reference. Argue from the case itself; no outside reading is required.
