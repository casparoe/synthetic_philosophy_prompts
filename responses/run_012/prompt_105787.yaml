      *   Did I identify jointly unsatisfiable pairs? Yes.
      *   Did I run cases (a), (b), (c)? Yes.
      *   Did I identify the single requirement that eliminates the most accounts? Yes.
      *   Did I address the "wrong vs. different use" goal? Yes.

