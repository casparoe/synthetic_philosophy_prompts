          *   Identification of jointly unsatisfiable pairs (tensions/trade-offs).
          *   **Stress Test:** Apply the desiderata to three specific cases:
              *   (a) Twin Earth (identical internal states, different ancestral substances).
              *   (b) Unobservable world differences.
              *   (c) Identical AI models trained on data from different worlds.
          *   **Ultimate Aim:** Distinguish "wrong representation" from "different use."
          *   **Final Question:** Which single requirement eliminates the most otherwise plausible accounts?

  2.  **Deconstruct the Philosophical Landscape (Mental Sandbox):**
      *   The core debate is Internalism (meaning is in the head/computation) vs. Externalism (meaning depends on causal history/environment).
      *   Key figures: Frege (sense/reference), Putnam (Twin Earth), Kripke (causal theory), Grice (speaker meaning), Wittgenstein (use).
      *   Key tensions: Normativity (ought) vs. Description (is), Individualism vs. Socialism, Epistemic Access vs. Metaphysical Fixing.
      *   The user wants to know *when a system is wrong*. This implies a need for truth conditions or correctness conditions.

  3.  **Drafting the Desiderata (The Specification):**
      *   *Requirement 1: Normativity.* Meaning implies correctness conditions. (If I say "cat," there's a fact of the matter whether that applies).
      *   *Requirement 2: Epistemic Access.* Speakers usually know what they mean (privileged access).
      *   *Requirement 3: Compositionality.* Complex meanings build from simple ones.
      *   *Requirement 4: Causal/Informational Link.* Words hook to the world somehow.
      *   *Requirement 5: Social/Communicative Stability.* Meaning allows coordination between agents.
      *   *Requirement 6: Cognitive Significance.* "Morning Star" vs. "Evening Star" (Frege's puzzle). Internal state matters for reasoning.

  4.  **Classifying Requirements (Non-negotiable vs. Preferences):**
      *   *Non-negotiable:* Normativity (without it, no "wrongness"), Compositionality (without it, no productivity), Communication (without it, no language).
      *   *Preferences:* Epistemic Access (Externalists sacrifice this), Individualism (Externalists sacrifice this).
      *   *Tensions:* Epistemic Access vs. Causal Link (Twin Earth problem). Cognitive Significance vs. Reference (Frege vs. Mill).

  5.  **Stress Testing the Cases:**
      *   *(a) Twin Earth (Putnam):* Internalism says meaning is same. Externalism says meaning is different (Water vs. Twater).
          *   *Requirement:* Does the theory allow meaning to diverge despite identical internal states?
      *   *(b) Unobservable Differences:* If the world differs but no one can tell, does meaning differ?
          *   *Requirement:* Verificationism vs. Realism.
      *   *(c) AI Models:* Identical weights, different training data origins.
          *   *Requirement:* Is meaning functional (internal) or historical (external)?

  6.  **Addressing the "Wrong vs. Different Use" Goal:**
      *   To say a representation is *wrong*, you need truth conditions fixed independently of the system's current state.
      *   To say it's *different use*, you focus on functional role.
      *   This maps directly to Externalism (truth conditions) vs. Internalism/Use Theory (functional role).

  7.  **Identifying the "Killer" Requirement:**
      *   What kills the most theories?
      *   *Normativity* kills pure causal theories (the disjunction problem).
      *   *Epistemic Access* kills strong Externalism.
      *   *Twin Earth Intuition* kills pure Internalism.
      *   *Decision:* The **Normativity Constraint** (the ability to be *mistaken*) is the hardest hurdle. Causal theories struggle to explain error (why is "cow" triggered by a horse on a dark night *wrong* and not just a different cause?). Internalist functional theories struggle to explain how the hook reaches the world at all.
      *   *Alternative:* The **Twin Earth Intuition** (Meaning ain't in the head). This kills Internalism outright. But the user asks what eliminates plausible accounts.
      *   *Better Candidate:* **The Combination of Normativity + Epistemic Access.** You can have one or the other easily. Having both is the hard part (Kripke/Wittgenstein skepticism).
      *   *Refinement:* Let's look at the specific question: "Which single requirement eliminates the most otherwise plausible accounts?"
      *   If I demand **Truth-Conditional Normativity** (there is a fact of the matter independent of the speaker that determines correctness), this kills Use-Theories and strict Internalism.
      *   If I demand **Transparency/Privileged Access** (I know what I mean), this kills Externalism.
      *   Given the user's goal ("say when a system's representation is simply wrong"), they *need* Truth-Conditional Normativity. So I should highlight that as the critical filter.

  8.  **Structuring the Response:**
      *   **Introduction:** Acknowledge the engineering mindset (specification, constraints).
      *   **The Desiderata (The Spec):** List the requirements clearly.
