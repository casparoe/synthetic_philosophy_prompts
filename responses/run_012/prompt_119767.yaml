          *   Younger brother conceived after switch, does not have it.
      *   **Constraints/Goals:**
          *   **Honest:** Acknowledge the risk/decision.
          *   **No Consolation Prize:** Never suggest she is lesser than a hypothetical alternative.
          *   **No "Meant to Be":** Do not suggest the brother was the "real" intended child or that fate intervened.
          *   **Logic as Structure:** The logic of the risk/decision should shape the reassurances, not be namedropped jargon.
          *   **Dual Audience:** Relatives hear warmth/humor; Philosophers notice the logical rigidity avoiding sentimental shortcuts.
