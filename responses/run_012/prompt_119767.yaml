answer: |-
  Good evening, everyone. For those who don't know me, I'm an actuary. By trade, I spend my days calculating the probability of future events, assessing risks, and trying to quantify uncertainty. It is a profession built on the understanding that we rarely have perfect information, and that every choice carries a weight we can't always measure in advance.

  Tonight, however, is not about probabilities. It is about certainty.

  Twenty-one years ago, my sister and her husband found themselves standing at a crossroads with incomplete maps. They were given advice based on averages and populations, on statistics that could tell them about risks but nothing about the specific person who might arrive. They faced a choice between waiting for a different set of conditions or embracing the uncertainty of the present. They chose the present. They chose to try for a child then, rather than later.

  In my line of work, we talk a lot about expected outcomes. But families are not actuarial tables. You cannot calculate the value of a person before they exist. There is a temptation, when looking back at decisions like that, to wonder about the roads not taken. To imagine a hypothetical version of events where things went differently. But here is the thing about hypotheticals: they are ghosts. They don't sit at this table. They don't finish philosophy degrees. They don't laugh at bad jokes.

  [Niece's Name], you are not a compromise. You are not a consolation prize for a path not walked. There is no alternate universe where a different version of you is sitting in this chair. There is only this universe, and only you. The traits you carry, the history written in your biology before you were born, these are not deviations from a plan. They are simply part of the factual record of who you are. We do not love you *despite* the risks your parents took. We love you because you are the person who resulted from the life they chose to build.

  Your brother arrived later, under different circumstances, with a different medical history. He is who he is. You are who you are. Chronology is not a hierarchy. One child is not the control group for the other. You are both simply who you are, and you are both entirely welcome here.

  I know you have strong opinions on how your story is told. I know you don't need me to explain your life to you, and certainly not to explain it to your friends. So I won't. I will only say this: The decision that brought you here was made in uncertainty, but the love we have for you is made in certainty. We know exactly who you are. We know your mind, your wit, and your presence.

  The past contains variables we cannot change. The future contains risks we cannot eliminate. But the present contains you, sitting right there, twenty-one years old, finished with your degree, and surrounded by people who are glad you exist. Not glad you exist *instead* of someone else. Just glad you exist.

  So, if everyone could please raise a glass.

  To [Niece's Name]. To the actual, the specific, and the undeniable. Happy Birthday.
