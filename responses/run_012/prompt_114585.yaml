prompt: |-
  I chair the clinical ethics committee at a mid-sized teaching hospital, and we keep getting consulted on cases where a treatment will foreseeably cause a serious harm—death, the loss of a fetus, the loss of one twin—while the clinical team's aim is to relieve suffering or save a life. We have no shared procedure for these cases, and the conversation usually becomes a fight about whether the harm is intended or merely foreseen. I want a reusable decision procedure grounded in the doctrine of double effect that my committee can actually run in a thirty-minute meeting. I am not asking for a tour of trolley problems; I want the doctrine made usable.

  Write it as a procedure, not an essay. Give me the questions to ask in order, what counts as a sufficient answer to each, where the procedure stops with a no, where it stops with a yes, and where it hands the decision to a person because the question is one of values rather than facts. Our recommendations are advisory, but they carry weight with the attending clinician and the family, so the procedure should say who has to sign off and when legal counsel must be brought in. I want the procedure to be a burden-shifting one: I have become convinced that the doctrine is best read as a set of questions that move the burden of proof back and forth, not as a checklist of necessary and sufficient conditions. Make that reading explicit, and say where it distorts the doctrine or where it makes the doctrine more permissive than its standard statement. Each question, when answered one way, should shift the burden to the objector or to the proponent.

  Do not give me a textbook recitation of the four conditions; I want the operational version—which condition is doing the work in which kind of case, which conditions collapse into each other, and which are doing no work at all. The procedure must force the committee to separate three attitudes: aiming at the harm, accepting it as a foreseeable side effect, and using it as a means. I want a question for each, and I want the procedure to say what follows when the honest answer is that the harm is being used as a means. Be honest about which steps are judgment calls dressed up as procedure.

  Then run the procedure on three cases: (1) a terminally ill patient in severe pain, where the team proposes escalating opioids and foresees that this may suppress respiration and hasten death; (2) conjoined twins sharing vital organs, where separation will save one and cause the death of the other; and (3) a pregnant patient with cancer, where chemotherapy is needed to save her life and will likely cause the death of the fetus. Include at least one case where the procedure's verdict is one I will not like—either because it permits something I find repugnant or forbids something I think is clearly right—and explain why the procedure gives that verdict anyway. Mark the points where the procedure cannot eliminate judgment, and say what the procedure cannot do.

  At the end, state how confident you are in the procedure as a whole and in its main steps, and identify the single point in the procedure you are least sure about, with your reasons. Do not include citations, reading lists, or references to the literature; I want the procedure itself.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**

      *   **User:** Chair of a clinical ethics committee at a mid-sized teaching hospital.
      *   **Problem:** Frequent consultations on cases involving foreseeable serious harm (death, fetal loss, twin loss) where the aim is good (relieve suffering, save life). Current discussions devolve into fights about "intended vs. foreseen." No shared procedure.
      *   **Goal:** A reusable, 30-minute decision procedure grounded in the Doctrine of Double Effect (DDE).
      *   **Format:** Procedure, not an essay. Questions in order. Sufficient answers defined. Stop points (Yes/No). Hand-off points (values vs. facts). Sign-off requirements (who signs, when legal counsel is needed).
      *   **Specific Constraint 1 (Burden-Shifting):** The procedure must be framed as *burden-shifting*, not a checklist of necessary/sufficient conditions. This must be explicit, including where it distorts or makes DDE more permissive.
      *   **Specific Constraint 2 (Attitudes):** Must separate: aiming at harm, accepting as side effect, using as means. Specific questions for each. Consequences if harm is used as a means must be clear.
      *   **Specific Constraint 3 (Honesty):** Acknowledge judgment calls dressed as procedure.
      *   **Application:** Run the procedure on three specific cases (Opioids/Death, Conjoined Twins, Pregnant Patient/Chemo).
      *   **Specific Constraint 4 (Uncomfortable Verdict):** Include at least one case where the verdict is uncomfortable (permits repugnant or forbids right) and explain why.
      *   **Specific Constraint 5 (Limitations):** Mark where judgment cannot be eliminated. State what the procedure cannot do.
      *   **Specific Constraint 6 (Confidence):** State confidence level in the procedure and steps. Identify the single point of least certainty with reasons.
      *   **Negative Constraint:** No citations, reading lists, or references to literature.

  2.  **Deconstruct the Doctrine of Double Effect (DDE) for Operational Use:**

      *   *Standard DDE:* 1. Act is good/neutral. 2. Good effect intended, bad not. 3. Bad not means to good. 4. Proportionality.
      *   *User's Twist:* Burden-shifting. Instead of "All 4 must be met," it's "Presumption holds until challenged."
      *   *Operationalizing "Intention":* This is the hardest part. Need to distinguish *aiming*, *using*, and *foreseeing*.
      *   *Operationalizing "Means":* If the bad effect is the mechanism of the good effect, it's usually forbidden.
      *   *Operationalizing "Proportionality":* This is the value judgment hand-off.

  3.  **Drafting the Procedure (Iterative Process):**

      *   *Step 0: Triage.* Is this actually a DDE case? (Serious harm foreseeable, good aim).
      *   *Step 1: The Nature of the Act.* Is the act itself morally neutral/good? (Burden on Objector).
      *   *Step 2: The Means Test.* Is the harm the *mechanism*? (Burden on Proponent to show it's not).
      *   *Step 3: The Intention Test.* Is the harm the *goal*? (Burden on Proponent to show it's not).
      *   *Step 4: Proportionality.* Is the good worth the bad? (Burden shifts to Committee/Family).
      *   *Sign-offs:* Attending proposes, Committee advises, Legal if statutory conflict.

      *Refining the Burden-Shifting:*
      *   Start with a presumption of permissibility if the clinical indication is strong.
      *   Q1 (Act): Objector must show the act is inherently wrong (e.g., lethal injection). If they can't, move on.
      *   Q2 (Means): Proponent must show the good doesn't flow *through* the bad. If it does, STOP (Forbidden).
      *   Q3 (Intention): Proponent must show they wouldn't be happy if the bad happened without the good. (Counterfactual test).
      *   Q4 (Proportionality): Committee weighs in.

      *Refining the "Attitudes":*
      *   Aiming = Goal.
      *   Using = Mechanism.
      *   Accepting = Side effect.

      *Refining the "Uncomfortable Verdict":*
      *   Conjoined twins is the classic DDE hard case. Separation often kills the weaker twin *as a means* to save the stronger (depending on physiology). If the procedure forbids it, that's uncomfortable (letting both die). If it permits it, some find killing one repugnant. Let's aim for the "Means" test failing here, forbidding separation, which is a classic DDE result that utilitarians hate. Or, conversely, the Chemo case where fetal death is foreseen but not intended.
      *   Actually, the prompt asks for *one* case where the verdict is one *I* (the user) will not like. Since I don't know the user's personal morals, I need to construct a verdict that is theoretically sound but practically painful. The Conjoined Twins case is the best candidate for a "Forbidden" verdict that feels like a tragedy (letting both die).

  4.  **Developing the Content - Section by Section:**

      *   **Header:** Title, Purpose, Time Limit.
      *   **Philosophical Preamble:** Explicitly state the burden-shifting model vs. standard checklist. Acknowledge the distortion (makes it more permissive initially).
      *   **The Procedure (Steps 1-5):**
          *   Include specific questions.
          *   Include "Pass/Fail" criteria.
          *   Include "Burden Holder" for each step.
          *   Include Sign-off requirements.
      *   **Case Applications:**
          *   Case 1 (Opioids): Should pass.
          *   Case 2 (Twins): Should likely fail on "Means" (classic DDE interpretation), leading to the "uncomfortable" verdict.
          *   Case 3 (Chemo): Should pass.
      *   **Limitations & Confidence:** Honest assessment of where the procedure breaks down (Intention is opaque).

  5.  **Review against Constraints:**

      *   *Procedure not essay?* Yes, use numbered lists and bold headers.
      *   *30-minute meeting?* Keep steps tight.
      *   *Burden-shifting explicit?* Yes, label who holds the burden at each step.
      *   *Distortions noted?* Yes, in the preamble.
      *   *Three attitudes separated?* Yes (Means, End, Side Effect).
      *   *Consequences of "Means"?* Explicit stop.
      *   *Judgment calls acknowledged?* Yes.
      *   *Three cases run?* Yes.
      *   *Uncomfortable verdict included?* Yes (Twins).
      *   *Confidence statement?* Yes.
      *   *No citations?* Yes.

  6.  **Drafting the Content (Mental Check of the "Burden Shifting"):**

      *   *Standard DDE:* Proponent must prove all 4 conditions.
      *   *Burden-Shift DDE:* Presume permissible if clinically indicated. Objector must challenge Act. Proponent must defend Means/Intention. Committee weighs Proportionality.
      *   *Distortion:* This makes it easier to start, but the "Means" test remains a hard stop. This is more permissive on *risk* but strict on *mechanism*.

  7.  **Drafting the "Uncomfortable Verdict":**
      *   I will select the Conjoined Twins case. Standard DDE often forbids separation if the death of the twin is the *means* of survival for the other (e.g., shared heart). The procedure should reflect this. The uncomfortable part is that following the procedure means letting *both* die, which feels clinically negligent, even if ethically consistent.

  8.  **Final Polish:**
      *   Ensure tone is professional, direct, and authoritative.
      *   Check that "Legal Counsel" triggers are clear (e.g., statutory conflict).
      *   Check that "Sign-off" is clear (Attending owns the decision, Committee advises).
      *   Ensure the "Confidence" section is humble but firm.

  9.  **Self-Correction during drafting:**
      *   *Initial thought:* Maybe make Proportionality a checklist.
      *   *Correction:* No, user said proportionality is values, not facts. Make it a hand-off to the Committee/Family consensus.
      *   *Initial thought:* Maybe the Opioid case fails.
      *   *Correction:* No, Opioid case is the paradigmatic *success* of DDE. It should pass easily to show the procedure works for standard care.
      *   *Check:* Did I explain *why* the burden shifts? Yes, in the preamble.
      *   *Check:* Did I identify the single point of least certainty? Yes, likely the "Intention" assessment (Step 3), as it relies on self-reporting.

  10. **Final Review against "No Citations":** Ensure no names like "Aquinas," "Foot," "Thomson," etc., appear.

  (Proceed to generate output based on these thoughts.)
answer: |-
  # CLINICAL ETHICS COMMITTEE: DOUBLE EFFECT DECISION PROCEDURE (CEDD-1)

  **Purpose:** To evaluate interventions where a serious harm (death, permanent loss of function, fetal loss) is foreseeable but not the primary clinical aim.
  **Time Limit:** 30 Minutes.
  **Status:** Advisory. Final medical decision rests with the Attending Physician. Legal counsel must be consulted if the procedure recommends an action that conflicts with state statute or hospital policy regarding end-of-life or fetal protection.

  ## PART I: PHILOSOPHICAL OPERATING SYSTEM

  **The Burden-Shifting Model**
  Standard statements of the Doctrine of Double Effect (DDE) treat the four conditions as a checklist the proponent must prove. This procedure treats DDE as a **burden-shifting mechanism**.
  1.  **Presumption:** If an intervention is clinically indicated for a legitimate medical goal, it is presumed permissible.
  2.  **The Shift:** The burden moves to the *Objector* to challenge the nature of the act, then to the *Proponent* (Clinical Team) to prove the harm is not a means or an end, and finally to the *Committee* to weigh proportionality.
  3.  **Distortion Acknowledgement:** This model is **more permissive** than standard DDE at the outset. It assumes clinical legitimacy unless challenged. However, it is **stricter** on the "Means" test. If the harm is the mechanism of the cure, the procedure forbids it absolutely, whereas a utilitarian calculation might permit it.

  **The Three Attitudes**
  This procedure forces separation of:
  1.  **Aiming:** The harm is the goal.
  2.  **Using:** The harm is the mechanism.
  3.  **Accepting:** The harm is a side effect.

  ---

  ## PART II: THE PROCEDURE

  ### STEP 1: The Nature of the Act (Burden: Objector)
  **Question:** Is the proposed intervention inherently wrongful outside of its consequences (e.g., active euthanasia, mutilation without cause)?
  *   **Sufficient Answer for "No" (Proceed):** The intervention is a standard medical treatment (e.g., surgery, chemotherapy, analgesia) recognized by the profession, even if high-risk.
  *   **Sufficient Answer for "Yes" (Stop):** The intervention has no medical indication other than to cause the harm (e.g., lethal injection).
  *   **Procedure Status:** If the answer is **Yes**, the intervention is **FORBIDDEN**. Stop. Document objection.
  *   **Procedure Status:** If the answer is **No**, the burden shifts to the **Proponent (Clinical Team)**.

  ### STEP 2: The Means Test (Burden: Proponent)
  **Question:** Does the good effect flow *through* the bad effect? Is the harm the *mechanism* by which the benefit is achieved?
  *   **Sufficient Answer for "No" (Proceed):** The benefit would still occur physiologically even if the harm did not happen (e.g., pain relief occurs via receptor binding; respiratory suppression is a separate, parallel effect).
  *   **Sufficient Answer for "Yes" (Stop):** The benefit is impossible without the harm occurring (e.g., the patient survives *because* the heart stops; the tumor shrinks *because* the fetus dies).
  *   **Procedure Status:** If the answer is **Yes**, the intervention is **FORBIDDEN**. The harm is being used as a means. Stop.
  *   **Note:** This is a hard stop. No proportionality calculation can override this.
  *   **Procedure Status:** If the answer is **No**, the burden remains with the **Proponent**.

  ### STEP 3: The Intention Test (Burden: Proponent)
  **Question:** If the good effect could be achieved *without* the bad effect, would the team still choose this intervention? Conversely, if the bad effect happened *without* the good effect, would the team regret the intervention?
  *   **Sufficient Answer for "No" (Proceed):** The team states clearly: "We would prefer a version of this drug/procedure that did not carry this risk. We do not want the patient to die/fetus to be lost. If we could save the life without this loss, we would."
  *   **Sufficient Answer for "Yes" (Stop):** The team implies: "The death/loss is part of the plan," or "It doesn't matter if they die, as long as the suffering stops."
  *   **Procedure Status:** If the honest answer is that the harm is **Aimed At** (part of the goal), the intervention is **FORBIDDEN**.
  *   **Judgment Call Warning:** This relies on self-reporting. The Committee must assess credibility based on documentation and tone. If the team is ambiguous, treat as **Aiming**.

  ### STEP 4: Proportionality (Burden: Committee)
  **Question:** Is the foreseeable harm proportionate to the intended good?
  *   **Sufficient Answer for "Yes" (Permit):** The good (saving a life, relieving intractable suffering) outweighs the bad (risk of death, loss of potential life), given the patient's values.
  *   **Sufficient Answer for "No" (Forbid):** The harm is grave and the benefit is marginal or speculative.
  *   **Procedure Status:** This is a **Value Judgment**, not a fact. It requires consensus between Committee, Attending, and Surrogate/Family.
  *   **Sign-Off:** If **Yes**, Committee recommends approval. Attending signs order. If **No**, Committee recommends against.

  ### STEP 5: Sign-Off and Legal Trigger
  *   **Committee Chair:** Signs the ethics consultation note confirming the procedure was run.
  *   **Attending Physician:** Signs the medical order. They retain ultimate liability.
  *   **Legal Counsel Trigger:** Legal must be consulted *before* implementation if:
      1.  Step 2 (Means) was borderline (e.g., shared physiology).
      2.  Step 4 (Proportionality) involves fetal loss where state law is ambiguous.
      3.  The family objects despite Committee approval.

  ---

  ## PART III: LIMITATIONS AND JUDGMENT CALLS

  **What This Procedure Cannot Do:**
  1.  **Read Minds:** Step 3 (Intention) cannot verify internal mental states. It relies on the "Counterfactual Test" (Would you do it if the risk didn't exist?). This is a judgment call dressed as a question.
  2.  **Resolve Value Conflicts:** Step 4 (Proportionality) does not generate a number. If the family values fetal life absolutely and the mother values her own survival absolutely, this procedure identifies the conflict but does not solve it. It hands the decision to the Attending with a warning.
  3.  **Override Law:** If state law defines a specific act as homicide regardless of intention, this procedure yields to the law (Step 5).

  **Where Judgment is Inevitable:**
  *   **Step 2 (Means):** In complex physiology (e.g., conjoined twins), determining if the death is the *mechanism* or merely a *concomitant* of the separation is a medical/ethical hybrid judgment.
  *   **Step 3 (Intention):** Distinguishing "accepting a risk" from "secretly hoping for the end" requires reading between the lines of clinical notes.

  ---

  ## PART IV: CASE APPLICATIONS

  ### Case 1: Terminal Sedation (Opioids)
  **Scenario:** Terminally ill patient, severe pain. Team escalates opioids. Foresees respiratory suppression and possible hastening of death.
  *   **Step 1 (Act):** Administering analgesia is inherently good/neutral. **Pass.** (Burden stays on Proponent).
  *   **Step 2 (Means):** Does pain relief happen *because* respiration stops? No. Relief happens via receptor binding. Death is a parallel risk. **Pass.**
  *   **Step 3 (Intention):** Would the team use a non-suppressing drug if available? Yes. Do they want the patient to die? No, they want pain to stop. **Pass.**
  *   **Step 4 (Proportionality):** Is relieving intractable suffering worth the risk of earlier death in a terminal patient? Committee consensus: Yes.
  *   **Verdict:** **PERMITTED.**
  *   **Sign-off:** Attending signs. No Legal needed.

  ### Case 2: Conjoined Twins
  **Scenario:** Twins share a heart. Separation saves Twin A but requires clamping the shared vessel, causing immediate death of Twin B. Without surgery, both die in months.
  *   **Step 1 (Act):** Surgery is inherently good/neutral. **Pass.**
  *   **Step 2 (Means):** Does Twin A survive *because* Twin B dies? Yes. The physiology dictates that the shared organ must be diverted entirely to A. B's death is not just a side effect; it is the mechanical prerequisite for A's survival. The blood flow is redirected *through* the cessation of B's circulation.
  *   **Verdict:** **FORBIDDEN.**
  *   **Reasoning:** The procedure stops at Step 2. The harm (Twin B's death) is the *means* to the good (Twin A's survival).
  *   **Uncomfortable Outcome:** This verdict requires the Committee to recommend *against* surgery, meaning **both twins will likely die**. This is the verdict you may not like. It feels clinically negligent to let two die when one could live.
  *   **Why the Procedure Gives This Verdict:** The burden-shifting model presumes permissibility, but the "Means Test" is an absolute barrier. Standard DDE traditionally forbids killing an innocent as a means, even to save another. This procedure honors that strictness. It prioritizes the moral prohibition on *using* a life as a resource over the utilitarian gain of saving one.
  *   **Sign-off:** Legal Counsel **MUST** be consulted regarding homicide statutes before any decision is finalized, even if the recommendation is to do nothing.

  ### Case 3: Pregnant Patient with Cancer
  **Scenario:** Patient needs chemotherapy immediately to survive. Chemo is teratotoxic; fetus will likely die.
  *   **Step 1 (Act):** Chemotherapy is standard care. **Pass.**
  *   **Step 2 (Means):** Does the mother's survival happen *because* the fetus dies? No. The drugs kill cancer cells. Fetal death is a toxic side effect of the same mechanism, not the mechanism of the cure itself. **Pass.**
  *   **Step 3 (Intention):** Would the team give chemo if the patient were not pregnant? Yes. Would they give it if it didn't harm the fetus? Yes. **Pass.**
  *   **Step 4 (Proportionality):** Is saving the mother's life proportionate to the loss of the fetus? Committee consensus: Yes, provided the mother consents.
  *   **Verdict:** **PERMITTED.**
  *   **Sign-off:** Attending signs. Legal Counsel advised if state law restricts fetal harm, but ethically cleared.

  ---

  ## PART V: CONFIDENCE AND UNCERTAINTY

  **Overall Confidence:** High (85%).
  The procedure successfully operationalizes the distinction between *means* and *side effects*, which is the most common point of failure in ethics consultations. It prevents the "Intention" debate from swallowing the meeting by placing it after the "Means" test.

  **Confidence in Steps:**
  *   **Step 1 (Act):** High. Medical standards are usually clear.
  *   **Step 2 (Means):** Medium-High. Physiology usually dictates this, but edge cases exist.
  *   **Step 3 (Intention):** Medium. Relies on human honesty.
  *   **Step 4 (Proportionality):** Low. This is inherently subjective. The procedure manages it by requiring consensus, not by solving it.

  **Single Point of Least Certainty:**
  **Step 2 (The Means Test) in Shared Physiology Cases (e.g., Conjoined Twins).**
  *   **Reason:** Distinguishing between "killing to save" (Means) and "separating with foreseeable death" (Side Effect) is metaphysically thin in shared-organ cases. Some surgeons argue the death is a side effect of *separation*, not the means of *survival*. This procedure takes the stricter view (it is the means) to avoid slippery slopes. However, I am least sure that this strict interpretation is sustainable in a modern legal environment that may prioritize the "salvageable life." If the legal system views the surgery as saving a life rather than killing a twin, the Committee's "Forbidden" verdict creates a conflict between ethical theory and legal/clinical reality. This is the fracture point where the procedure may break under external pressure.
