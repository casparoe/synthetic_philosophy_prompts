answer: |-
  This is a classic problem of applying Rawlsian non-ideal theory to a supervisor who signals strict textual fidelity ("Old School," *Restatement* as scripture) but whose practical verdicts reveal a specific heuristic.

  Your supervisor's track record displays a consistent tension between **Ideal Theory** (what the Difference Principle demands) and **Non-Ideal Theory** (what is feasible/stable). She is not a Cosmopolitan Rawlsian (who would apply the Difference Principle globally without hesitation); she is a **Non-Ideal Theoretic Maximin** theorist. She judges policies by whether they improve the floor for the least advantaged *within the constraints of political feasibility and stability*, rather than comparing them to an idealized maximum.

  Here is the breakdown of the candidate rules, the prediction, and the crucial test case.

  ### Candidate Rules

  **Rule 1: The Strict Domestic Difference Principle (Ideal Theory)**
  *   **Structure:** Justice requires maximizing the long-term expectations of the least advantaged group (LAG) within a closed basic structure. Inequality is only justified if it is necessary to raise the LAG.
  *   **Fit with Track Record:** High. Explains Case 1 (Unjust because LAG didn't gain), Case 2 (Just because LAG gained), Case 4 & 5 (Inequality tolerated for LAG gain).
  *   **Fit with "Old School" Label:** High for domestic cases (*Restatement*).
  *   **Problem:** Rawls explicitly rejects this for the international sphere in *The Law of Peoples*. There is no global Difference Principle. If she applies this globally, she is deviating from the "scripture."

  **Rule 2: The Law of Peoples Duty of Assistance (Collective)**
  *   **Structure:** Justice requires aiding "burdened societies" to become well-ordered. It does *not* require continuous redistribution to narrow gaps between well-ordered but poorer peoples. The unit of concern is *Peoples*, not individual deciles.
  *   **Fit with Track Record:** Low. Her domestic verdicts ignore the "basic structure" boundary and focus on income deciles.
  *   **Fit with "Old School" Label:** High. This is the correct textual application for global cases.
  *   **Problem:** The new case targets the "global bottom decile" (individuals), not "burdened societies." The recipients are "just poor," not necessarily burdened. Strictly speaking, Rawls says redistribution here is permissible but not *required* by justice.

  **Rule 3: Feasibility-Constrained Non-Ideal Maximin (The Synthesis)**
  *   **Structure:** A policy is just if it improves the absolute position of the least advantaged (individuals or groups) relative to the status quo, *provided* that more beneficial alternatives are ruled out by genuine political feasibility (stability/compliance) constraints. We do not judge against the Ideal Maximum, but the Feasible Maximum.
  *   **Fit with Track Record:** Perfect. Explains Case 3 (Housing) specifically: she accepted a sub-optimal distribution because the optimal one was infeasible. Explains Case 1: The LAG didn't gain, so feasibility didn't matter.
  *   **Fit with "Old School" Label:** Moderate. Rawls emphasizes the transition from non-ideal to ideal theory (*Law of Peoples*, Part II). An "Old School" Rawlsian respects the *constraints* of non-ideal theory (stability of the Society of Peoples) even if the *metric* (global decile) is slightly cosmopolitan.

  ### The Prediction

  **Verdict:** **Just.**

  **Reasoning:**
  She will likely rule the proposal **Just**, but she will correct your working group's *justification*. She will not endorse a "Global Difference Principle." Instead, she will frame this under **Non-Ideal Theory** within the *Law of Peoples*.

  1.  **The Maximin Floor:** Like Cases 2, 4, and 5, the policy raises the floor for the least advantaged (the global bottom decile). Like Case 1, if the floor didn't rise, she'd call it unjust.
  2.  **The Feasibility Constraint (The Decider):** This is the critical link to Case 3 (Housing). In Case 3, she accepted a windfall to landowners because the Land-Value Tax (which would have helped the poor more) was "not politically feasible." In the New Case, the "tougher" version (capital controls) was dropped to keep rich countries on board. She views "keeping rich countries on board" as a **stability constraint** essential for the policy to function at all.
  3.  **The "Old School" Caveat:** She will note that this is not *strict* justice in the ideal sense (as per *Law of Peoples*, we don't owe continuous transfers to well-ordered poor peoples). However, in non-ideal theory, a scheme that aids the poor without destabilizing the Society of Peoples (by alienating rich nations) is **consistent with justice** and moves in the right direction. She will likely say: *"It is not unjust, because it is the feasible maximum for the least advantaged under current conditions."*

  **Confidence:** **85%**
  The pattern of Case 3 (Feasibility > Ideal Optimization) is the strongest predictor of her behavior. The "Old School" tag suggests she won't embrace cosmopolitanism, but Non-Ideal Theory allows her to accept the policy without violating Rawls's anti-egalitarian international stance.

  ### The Point of Least Certainty

  **The Unit of Account: Individuals vs. Peoples.**
  I am least sure about whether she will penalize the proposal for targeting the **"global bottom decile"** (individuals) rather than **"least advantaged peoples"** (collectives).
  *   *Rawls's Text:* *The Law of Peoples* is explicit that the primary actors are peoples, not individuals. Redistribution is to help societies achieve self-sufficiency, not to top up individual incomes indefinitely.
  *   *Her Track Record:* Domestically, she focuses on income quintiles/deciles (individual/household metrics).
  *   *Risk:* She might call the proposal **"Misguided"** or **"Not a matter of Justice"** (distinct from Unjust) because it treats the world as a single distributive scheme rather than a Society of Peoples. However, given her pragmatic focus on the "bottom fifth" in domestic cases, she is likely to tolerate the individual metric if the outcome aligns with the Duty of Assistance.

  ### The Crucial Case (To Distinguish the Rules)

  To distinguish between **Rule 2 (Law of Peoples/Duty of Assistance)** and **Rule 3 (Feasibility-Constrained Maximin)**, propose this case:

  **The Case:** A global tax transfer that significantly boosts the income of the **global bottom decile**, but requires **conditionalities that undermine the political self-determination** of the recipient poor countries (e.g., forcing specific legal reforms to ensure the money isn't "wasted").
  *   **Feasibility-Constrained Maximin (Rule 3) Prediction:** **Just.** The bottom decile gains more than under the status quo, and the conditionality is "feasible" (rich countries demand it). The metric is individual welfare.
  *   **Law of Peoples (Rule 2) Prediction:** **Unjust.** Rawls explicitly forbids interventions that violate the self-determination of well-ordered (or burdened-but-striving) peoples. The *status* of the People trumps the *income* of the decile.

  **Why this tells the rules apart:**
  If she calls it **Just**, she is a **Non-Ideal Maximin** theorist who prioritizes the welfare floor regardless of the collective status of the recipient (Cosmopolitan leanings in practice).
  If she calls it **Unjust**, she is a **Strict Law of Peoples** theorist who prioritizes the autonomy of Peoples over individual income gains, confirming the "Old School" label overrides her domestic heuristic.

  **My Bet:** She calls it **Unjust**. The "Old School" commitment to the *Law of Peoples* distinction between *Peoples* and *Persons* is the one line she likely won't cross, even if her domestic record looks cosmopolitan. This suggests her verdict on your current AI Tax case is **Just** *only because* the current draft presumably respects national sovereignty (unlike the capital controls version), fitting both the Feasibility constraint and the Law of Peoples.
