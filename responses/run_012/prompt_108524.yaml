          *   Emergence -> No agreement.
          *   Green vs Purple -> Arbitrariness.
          *   Newcomer -> Normativity/Expectation.
          *   Payoff Shift -> Stickiness/Path Dependence.
      *   **Limitations:** Common Knowledge (Lewis requires it, game might only have mutual expectation). Normativity (Game has prudential 'ought', not moral 'ought').
