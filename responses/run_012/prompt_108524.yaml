  4.  **Refining the Philosophy:**
      *   *Lewis's Account:* Convention is a regularity R in population P, in recurrent situation S, such that:
          1.  Everyone conforms to R.
          2.  Everyone expects everyone else to conform to R.
          3.  Everyone prefers to conform to R *on condition that* others do (Coordination equilibrium).
          4.  There is an alternative regularity R' that could have solved the coordination problem just as well (Arbitrariness).
