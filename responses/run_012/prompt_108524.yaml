answer: |-
  # Session Plan: The Signal Protocol
  **Time:** 90 Minutes
  **Class Size:** ~20 Students
  **Goal:** Pre-theoretic intuition pump for Lewisian convention (emergence, arbitrariness, normativity, stickiness).
  **Constraint:** The word "convention" must not be spoken until the debrief.

  ## Part 1: Activity Design

  ### Materials
  *   **Cards:** 20 sets of two distinct colored cards (e.g., **Green** and **Purple**). *Avoid Red/Blue to minimize natural salience.*
  *   **Payoff:** Small candies (e.g., Hershey's Kisses) or a symbolic "Participation Ledger" on the board. (Candy is recommended for visceral stakes).
  *   **Projection:** A slide or board space to display the current "Payoff Rule."
  *   **Confederate:** One student (or a TA) briefed *before class* to act as the "Newcomer."

  ### The Rules (Project these or read them verbatim)
  1.  **Silence:** No talking, texting, or signaling except by playing your card.
  2.  **The Goal:** In each round, you will play one card face up on your desk.
  3.  **The Payoff:**
      *   **Standard Rule:** You receive 1 candy if you play the **Majority Color**. You receive 0 if you play the Minority Color.
      *   **Tie Rule:** If the split is exactly 10/10, no one gets candy.
  4.  **Rounds:** We will play 8 rounds. Payoffs may change between rounds.

  ### Sequence of Rounds

  **Phase 1: Emergence (Rounds 1–3)**
  *   **Instruction:** "Play a card. Maximize your candy."
  *   **Expected Outcome:** Round 1 will likely be split (chaos). Round 2 will show a bandwagon effect toward the slight majority of Round 1. By Round 3, a clear norm (e.g., Green) should be established.
  *   **Instructor Note:** Do not comment on *which* color is winning. Merely distribute candy. If there is a tie, announce "No candy this round" with neutral disappointment.

  **Phase 2: The Newcomer Shock (Round 4)**
  *   **Setup:** Before Round 4, ask the student seated in the middle (not the confederate) to step out for "an errand." Bring in the **Confederate** (or instruct the confederate who has been sitting quietly to now participate fully).
  *   **Instruction to Class:** "We have a new participant. Continue the game."
  *   **Confederate Script:** Play the **Minority Color** (e.g., Purple) confidently. Do not look hesitant.
  *   **Expected Outcome:** The group will likely stay with the established norm (Green). The Confederate gets 0 candy.
  *   **Crucial Observation:** Watch the *reactions* of the established students. Do they look confused? Annoyed? Do they try to signal the newcomer?
  *   **Payoff:** Distribute candy only to the Majority. The Confederate gets nothing.

  **Phase 3: The Stickiness Trap (Rounds 5–7)**
  *   **Instruction:** "New Payoff Rule. **Purple is now worth 2 candies.** Green is worth 1 candy."
  *   **The Catch (Write this on the board):** "Purple only pays out if **more than 75% of the class** plays Purple. If fewer than 75% play Purple, Purple pays 0. Green always pays 1 (if it is the majority)."
  *   **Logic:** Everyone *prefers* the Purple equilibrium (2 candies > 1 candy). But switching is risky. If you switch and others don't, you get 0.
  *   **Expected Outcome:** The class will likely stick with Green. They will verbally express frustration during the debrief ("We wanted to switch but couldn't trust others").
  *   **Instructor Note:** If they miraculously coordinate the switch, acknowledge it but note how hard it was without talking. If they fail (likely), this demonstrates path dependence.

  **Phase 4: The Authority Intervention (Round 8)**
  *   **Instruction:** "I am declaring that **Purple** is now the required rule. You must play Purple."
  *   **Expected Outcome:** Compliance will be near 100%.
  *   **Goal:** Contrast this *authority* based compliance with the *self-enforcing* compliance of Rounds 1–3.

  ---

  ## Part 2: The Debrief (45 Minutes)

  *Now* you may use the word **Convention**.

  ### 1. Mapping the Experience to Lewis (15 mins)
  Draw a table on the board. Ask students to fill it in based on what they felt, then map it to Lewis's criteria.

  | Game Moment | Student Experience | Lewis's Account |
  | :--- | :--- | :--- |
  | **Rounds 1–3** | "We didn't talk, but we matched." | **Regularity without Agreement:** Conventions arise from repeated coordination problems, not contracts. |
  | **Green vs. Purple** | "It didn't matter which, just that we matched." | **Arbitrariness:** R' (Purple) could have served the same purpose as R (Green). |
  | **Round 4 (Newcomer)** | "They were doing it wrong." / "They cost us points." | **Normativity:** Deviation is met with sanction (social pressure or payoff loss). The "ought" emerges. |
  | **Rounds 5–7** | "We wanted to switch but couldn't." | **Stickiness/Path Dependence:** Conventions persist even when suboptimal because the transition cost is too high. |
  | **Round 8** | "We did it because *you* said so." | **Contrast:** This was *authority*, not convention. Convention is self-enforcing. |

  ### 2. Honest Limitations: What the Game Cannot Do (10 mins)
  *Be explicit here. This establishes your philosophical credibility.*

  **A. The Common Knowledge Gap**
  *   **The Game:** In Round 3, you knew *I* knew *you* knew Green was winning. But did you know that *everyone else* knew that *everyone else* knew?
  *   **The Theory:** Lewis argues convention requires **Common Knowledge** (an infinite recursion of "I know that you know that I know...").
  *   **The Gap:** In this game, you likely only had **Mutual Expectation**. You expected others to play Green because they played it last time. Lewis insists the *reason* for the expectation must also be common knowledge.
  *   **Your Job:** You must explain that in the real world, language and publicity create this common knowledge. The game simulates the *behavior*, but not necessarily the epistemic depth.

  **B. The Normativity Gap**
  *   **The Game:** The "ought" here was prudential ("You ought to play Green *if* you want candy").
  *   **The Theory:** Philosophers debate whether conventions carry a genuine **moral or social obligation** ("You ought to play Green *because it is the rule*").
  *   **The Gap:** When the Newcomer played Purple, did you feel they were *irrational* or *impolite*? Lewis focuses on the rationality. Others (like Margaret Gilbert) argue conventions create a joint commitment that binds us morally.
  *   **Your Job:** Ask the class: "When the Newcomer played Purple, did you think they were stupid, or did you think they were rude?" If "rude," you have touched the normative gap Lewis leaves open.

  ### 3. Contested Terrain: Where Philosophers Disagree (15 mins)
  *Mark these clearly as open debates, not settled facts.*

  **[CONTESTED] Is Common Knowledge Necessary?**
  *   **Lewis:** Yes. Without common knowledge, the reasoning chain breaks.
  *   **Critics (e.g., Skyrms, Vanderschraaf):** No. Evolutionary dynamics or simple learning can sustain conventions without high-level epistemic states.
  *   **Class Question:** "Could this game have worked if you weren't allowed to see the whole room, only your neighbor?" (This probes whether common knowledge is needed or if local networks suffice).

  **[CONTESTED] Is Arbitrariness Thoroughgoing?**
  *   **Lewis:** Yes. A convention is arbitrary if there is *another* regularity that would have solved the coordination problem equally well.
  *   **Critics (e.g., Millikan):** Not always. Some conventions have "proper functions" or historical roots that make them non-arbitrary in practice (e.g., driving on the left is arbitrary, but 'stop' meaning 'halt' might be grounded in utility).
  *   **Class Question:** "Was Green *truly* arbitrary? Or did Round 1 make it 'salient' (a Schelling Point)?" If Round 1 dictates the outcome, is it still arbitrary?

  **[CONTESTED] Coordination vs. Conflict**
  *   **Lewis:** Conventions solve *coordination* problems (interests coincide).
  *   **Critics (e.g., Ullmann-Margalit):** Some norms solve *coordination* problems where interests *conflict* (e.g., who gets the right of way).
  *   **Class Question:** "In Rounds 5–7, did your interests coincide? Yes, everyone wanted 2 candies. But what if Green players got 2 candies and Purple players got 0? Would that still be a convention?"

  ### 4. Prediction of Failure Modes (5 mins)
  *Tell them what usually goes wrong so they don't panic.*

  1.  **The Schelling Spike:** In Round 1, 19 students pick Green because "Green means Go."
      *   *Fix:* Acknowledge it. "Even if nature nudges us, the fact that we *stick* to it when Purple pays more is the convention."
  2.  **The Successful Revolution:** In Round 5, the class magically coordinates on Purple.
      *   *Fix:* This is rare without talk. If it happens, ask *how*. "Did someone make eye contact? Did someone slam the card down?" This highlights the *communication* required to break a convention.
  3.  **The Cynic:** One student refuses to play to prove a point.
      *   *Fix:* "Lewis accounts for rational agents. If you opt out of the payoff structure, you opt out of the model. But notice how annoyed the group gets. That annoyance *is* the data."

  ---

  ## Instructor's Cheat Sheet: The "Why" Behind the Moves

  *   **Why no talking?** To prove Lewis's point that conventions do not require explicit promises or agreements.
  *   **Why the Newcomer?** To demonstrate that conventions have a normative force that outlasts their original utility. The Newcomer didn't agree to the Green rule, yet is expected to follow it.
  *   **Why the 75% Threshold?** To simulate the **transition cost**. In Lewis's account, moving from Convention R to Convention R' is hard not because R' is worse, but because the *mixed state* (some R, some R') is disastrous. This creates the "lock-in" effect.
  *   **Why Round 8 (Authority)?** To distinguish **Convention** (bottom-up, self-enforcing) from **Law/Decree** (top-down, enforced by sanction). Lewis is specifically analyzing the former.

  ## Reading Assignment for Next Week
  *   David Lewis, *Convention*, Chapter 1 (Sections 1–3).
  *   *Prompt:* "Identify one moment in today's game where Lewis's definition fits perfectly, and one moment where you felt something the definition missed."
