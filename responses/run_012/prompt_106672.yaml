prompt: |-
  I'm writing a novel where my main character is a retired climate scientist, someone who spent thirty years on the models and now cant shake the feeling that everything she does as an individual — one flight, one steak, one vote — is completely beside the point, and she's half convinced that means nothing she does matters morally at all. I want a scene where she argues this out with her daughter, and I really don't want it to collapse into the usual everyone-doing-it reply. So give me an example of one conceptual issue in the philosophy of collective harm that's specific enough to hang an actual argument on — something in the weeds, like whether making a difference has to be a causal notion in the first place, or whether a harm like this can even be divvied up among the people who cause it, or how blame is supposed to work when your contribution is redundant because the damage would've happened anyway. Just the puzzle and why smart people land on different sides of it, no citations or reading lists, and keep it concrete. Also, be straight with me about which parts of this are actually settled and which are still genuinely contested by people who know the field — don't hand me a contested view dressed up as the consensus. American English.
