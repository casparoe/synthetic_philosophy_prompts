answer: |-
  Here is the specific conceptual puzzle you can hang this scene on: **The Problem of Causal Overdetermination (often called the "No-Difference Challenge").**

  ### The Puzzle
  The core issue is whether you can be morally responsible for a harm if your action made no *discernible difference* to the outcome.

  In climate science, harms don't happen linearly; they happen at thresholds. Think of a specific disaster—a coral reef bleaching event, a specific heatwave killing a vulnerable population, a glacier collapsing. These events are triggered when atmospheric carbon crosses a specific physical threshold.

  **The Scientist's Argument (The "No-Difference" View):**
  She argues that her single flight emits a tiny fraction of carbon. That fraction is not enough to cross a threshold on its own. Furthermore, given the sheer volume of global emissions, the thresholds for specific disasters are being crossed regardless of her specific contribution. If she stays home, the heatwave still happens. If she flies, the heatwave still happens. Since the outcome is identical in both worlds, her action is causally redundant. In philosophy, this is **overdetermination**. If the harm was going to happen anyway, did she actually cause it? If she didn't cause it, how can she be blamed for it? She isn't denying the collective harm; she's denying her individual *causal link* to it.

  **The Daughter's Argument (The "Expected Value" View):**
  The daughter argues that we shouldn't look at *definite* causation but at *probabilistic* influence. While one flight doesn't *guarantee* a disaster, it slightly increases the probability that a threshold will be crossed.
  Imagine a lottery where every ticket added increases the chance of a bomb going off. You buy one ticket. The bomb goes off. You might say, "My ticket wasn't the winning ticket; the bomb would have gone off with or without me." The counter-argument is that you participated in a risk-imposition. You didn't cause the specific outcome deterministically, but you contributed to the *expected harm*. Morally, you are responsible for the risk you imposed, not just the realized outcome.

  ### Where the Philosophers Actually Disagree
  Here is the straight talk on what is settled and what is contested, so you don't write a scene that sounds naive to anyone who knows the field.

  **What is Settled:**
  1.  **The Climate Science:** It is settled that collective emissions cause harm. No serious philosopher disputes the physical reality of the crisis.
  2.  **The Individual Causal Impact:** It is effectively settled that individual actions (one flight, one steak) do not trigger discrete climate events in a deterministic way. The scientist is right about the physics: her specific carbon molecules are not the "straw that breaks the camel's back" in a traceable sense. You cannot draw a straight line from her ticket to the explosion.

  **What is Genuinely Contested:**
  1.  **Does Probabilistic Risk Equal Harm?** This is the live wire. Some philosophers argue that imposing a tiny risk of catastrophe is itself a moral wrong, even if the catastrophe doesn't materialize (or would have happened anyway). Others argue that without actual causal impact in the real world, "expected harm" is just a mathematical abstraction, not a moral reality. They argue you can't blame someone for a counterfactual probability.
  2.  **Complicity vs. Causation:** If the scientist didn't *cause* the harm, is she merely *complicit*? Some argue complicity is enough for blame (you joined the harmful project). Others argue complicity without causal impact is just "symbolic" morality, which shouldn't carry the weight of genuine moral obligation.
  3.  **The "Threshold" Uncertainty:** The daughter can argue we don't know *where* the thresholds are. Therefore, every emission *might* be the one that tips the scale. The scientist can counter that statistically, it is overwhelmingly likely that her emissions are *not* the decisive ones. Philosophers disagree on whether "might" is enough to ground a strict moral duty.

  ### How to Play It in the Scene
  To avoid the cliché "everyone should do their part," have the daughter attack the **causal definition** of harm.

  *   **Scientist:** "I didn't cause the storm. The storm was inevitable. My ticket wasn't the winner."
  *   **Daughter:** "You're defining 'cause' too narrowly. You're saying you're only guilty if you pulled the trigger. But you loaded the gun. You increased the odds. If you play Russian roulette with a million-chamber revolver and someone dies, you don't get to say 'my bullet wasn't the one' to wash your hands of it."
  *   **Scientist:** "But if the person would have died anyway because someone else pulled the trigger? That's the difference. In climate change, the other chambers are already being fired. I'm not adding risk; I'm adding noise to a signal that's already screaming."

  This keeps the argument in the weeds of **moral metaphysics** (what counts as causing harm) rather than sliding into **sociology** (what if everyone did that?). It validates the scientist's intelligence—she isn't just being lazy; she's grappling with a genuine logical paradox about individual agency in a systemic crisis.
