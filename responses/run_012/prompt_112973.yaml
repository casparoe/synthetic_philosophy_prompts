answer: |-
  ### Brainstorming & Objection Mapping

  **Objection 1: The Counterfactual Problem (Calibration)**
  *   *The Worry:* If we pick Plan A based on the market, we never implement Plan B. We never know if the market was right about Plan B being worse. The instrument cannot be calibrated against reality.
  *   *Can it be answered?* Not empirically. You can't solve this within the pilot.
  *   *Strategy:* Acknowledge it as the epistemic cost of the experiment. We are trading verification for decision efficiency. Don't pretend we'll know later.

  **Objection 2: The Metric Problem (Goodhart's Law)**
  *   *The Worry:* "Traffic deaths" is a narrow metric. A plan could reduce deaths by making driving so miserable no one drives, or by reclassifying deaths.
  *   *Can it be answered?* Only by admitting the Council's vote on the metric was the real value judgment. The market is subordinate to that definition.
  *   *Strategy:* Validate the skeptics. The metric *is* a value statement. The market doesn't escape politics; it just moves it upstream.

  **Objection 3: The Values/Beliefs Separation**
  *   *The Worry:* Futarchy assumes we can agree on "what we want" (values) separate from "what works" (beliefs). But choosing a street redesign isn't just about safety; it's about how we want to live.
  *   *Can it be answered?* Philosophically, no. Pragmatically, we have to act as if yes.
  *   *Strategy:* Frame this as the central tension of the pilot. We are testing if this separation is *useful*, not if it is *true*.

  **Objection 4: Manipulation/liquidity**
  *   *The Worry:* Rich actors rig the market.
  *   *Can it be answered?* Yes, via mechanism design (caps, liquidity provisions).
  *   *Strategy:* Defer to the experts in the room. Assume they've built guards. Focus on the conceptual risks, not the technical bugs.

  **Objection 5: Democratic Deficit**
  *   *The Worry:* Why let bettors decide?
  *   *Can it be answered:* Because voters are bad at probabilities.
  *   *Strategy:* Don't get bogged down in defending democracy vs. markets. Frame it as augmenting the Council's vote, not replacing it.

  ***

  ### Opening Remarks

  **Time:** 7–8 Minutes
  **Speaker:** Retired Analytical Chemist / Amateur Philosopher

  Good morning. Thank you for coming.

  For thirty-five years, I worked as an analytical chemist. My job was building instruments to measure things that didn't want to be measured. Trace elements, contaminants, molecular structures. And if there's one thing that job teaches you, it's humility. You learn that every instrument has a limit. You learn that the map is not the territory. And you learn that if you don't calibrate your device against a known standard, you aren't doing science; you're just making numbers up.

  I retired from the lab to read philosophy. And I mention that because when I heard about this pilot—using a decision market, or futarchy, to choose between the street redesign and the tech enforcement plan—I felt a familiar tug. It's the tug of trying to build an instrument for something much messier than chemistry: governance.

  I know the room is split. On one side, we have the mechanism designers and forecasters. You know the math. You know that if the markets are liquid and honest, they aggregate information better than any committee. On the other side, we have residents, cyclists, drivers, and council members who are wondering why we're letting a betting market decide whether our neighbors live or die.

  I'm not here to sell this to the skeptics, and I'm not here to lecture the experts. I'm here to say out loud what this experiment actually is, and what it isn't. Because if we're going to do this, we need to be clear about the blind spots.

  The first blind spot is calibration. In my lab, if I built a spectrometer, I could test it. I'd run a sample with a known concentration. If the machine said something else, I'd fix it. Here, we can't do that. If the market says the redesign plan saves more lives and we pick that, we never implement the tech plan. We never see the counterfactual. We never know if the market was right about the losing option.

  This is a structural feature, not a bug, but it's worth naming. We are building an instrument that cannot be falsified. We are asking you to trust the mechanism's efficiency because we cannot verify its accuracy after the fact. For the experts in the room: don't pretend we'll be able to check the score later. We won't. For the residents: know that this decision relies on faith in the process, not proof of the outcome.

  The second blind spot is the metric. The Council has voted that "traffic deaths" is the number we care about. That sounds objective. It sounds like a fact. But it's not. It's a value judgment.

  If we only measure deaths, we might miss everything else that makes a street good or bad. Congestion, beauty, freedom, community, the joy of a drive, the safety of a child on a bike that didn't die but got scared. A plan could win by making the streets so hostile that nobody uses them, dropping deaths to zero. Technically, it works. Morally, it might be a disaster.

  This is what philosophers call "construct validity." Are we measuring what we think we're measuring? The market will find the most efficient way to lower that number. It doesn't care about the spirit of the law, only the letter. So when you look at the two proposals, ask yourself: does lowering this number capture what you actually want? Or does it just capture what we decided to count?

  And that leads to the deepest tension here. This whole scheme rests on an idea from the economist Robin Hanson: vote on values, bet on beliefs. Separate what we want from what works.

  But life doesn't separate that cleanly. For some of you, the redesign isn't just a means to safety; it's a statement about how we want to live together. Slower streets, narrower lanes—that's a value in itself, not just a tool to reduce mortality. By forcing that value into a binary bet on death counts, we might be stripping out the very thing that matters to you.

  I'm not saying we shouldn't do this. I'm saying we should know what we're doing. The old way—lobbying, voting, arguing—hasn't stopped the deaths either. That system has its own blind spots, mostly consisting of gridlock and ignored expertise. This pilot is an attempt to build a better instrument. But like any instrument, it has limits. It cannot measure what we don't define. It cannot verify what we don't test. And it cannot separate our values from our facts as cleanly as we might hope.

  So, here is where I want to leave you. We are about to open these markets. The money will start moving. The probabilities will shift. But the real work isn't in the trading interface. It's in this room.

  My question for you, the one I hope you argue about at the reception, is this: If we accept that we can never know the truth of the road not taken, what do we owe the losing side? When the market picks a winner, and the counterfactual vanishes forever, how do we live with the uncertainty that we might be wrong?

  Thank you. Let's get to work.
