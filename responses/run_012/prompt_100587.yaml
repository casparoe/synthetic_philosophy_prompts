  If the Self-applying axis is weighted at 80%, Japan surpasses the American South because its standardized educational and memorial institutions are more bureaucratically entrenched than the South's crisis-dependent local politics. The American South proved hardest to place because it is a sub-national region where the reckoning is legally foundational to the federal order but culturally supplemental to many local power structures.
