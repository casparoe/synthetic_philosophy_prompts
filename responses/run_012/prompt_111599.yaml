answer: |-
  Here is the specification list for an adequate theory of memory ethics, derived from the constraints you provided.

  ### The Requirements Spec

  **1. Successor Liability Mechanism**
  *   **The Requirement:** The theory must define the transmission vector of the obligation. It must explain how a duty generated by the dead (who cannot consent) binds the living (who did not commit the acts), without relying on mystical collective souls or vague metaphors of "inheritance."
  *   **The Forcing Case:** *The Collective Gap.* If I did not kill, and you were not killed, why do I owe you remembrance? If the theory cannot bridge the non-identity problem, the "collective duty" is merely a poetic assertion, not an ethical binding. It fails the moment a skeptic asks, "Why me?"

  **2. Mode Differentiation (Propositional vs. Practical)**
  *   **The Requirement:** The theory must distinguish between the duty to retain *data* (facts, dates, names) and the duty to sustain *identity* (rituals, norms, group cohesion). It must specify whether the obligation attaches to the archive, the behavior, or the handoff between them.
  *   **The Forcing Case:** *The Category Slide.* A society can know exactly what happened (propositional) but refuse to let it define them (practical). Conversely, a group can ritualize a memory (practical) while distorting the facts (propositional). If the theory treats these as identical, it cannot explain why a lie that unites might be ethically preferable to a truth that divides, or vice versa.

  **3. Negative/Positive Obligation Boundary**
  *   **The Requirement:** The theory must specify whether the duty is *active* (build monuments, teach curricula) or *passive* (do not destroy archives, do not censor speech).
  *   **The Forcing Case:** *Complicity vs. Commission.* There is a moral difference between killing a memory and letting it die of neglect. A theory that demands active maintenance imposes a tax on the living; a theory that demands only non-interference imposes a constraint. Confusing the two leads to infinite resource demands.

  **4. Therapeutic Constraint (Stop Conditions)**
  *   **The Requirement:** The theory must identify the threshold where remembrance becomes iatrogenic (harmful to the patient/society). It must define when the duty to the past is overridden by the duty to the present's psychological or political viability.
  *   **The Forcing Case:** *The Harm of Remembering.* If remembering freezes a group in victimhood or retraumatizes survivors to the point of dysfunction, the "duty" becomes a weapon. A theory without a stop condition mandates perpetual suffering in the name of fidelity.

  **5. Substrate Independence Clause**
  *   **The Requirement:** The theory must define what counts as "memory" when biological witnesses are extinct. It must equate (or distinguish) the moral status of a neural recall, a written archive, and a stone monument.
  *   **The Forcing Case:** *The Institutional Handoff.* When the last survivor dies, does the duty shift from "listening" to "maintaining"? If the theory relies on "witnessing," it expires naturally. If it relies on "truth," it must survive in stone. The theory must handle the transition from organic to inorganic memory without losing the ethical thread.

  **6. Resource Trade-off Protocol**
  *   **The Requirement:** The theory must adjudicate conflicts between memory and other social goods (housing, economic development, peace). It cannot treat memory as a lexical priority (i.e., "always remember" regardless of cost).
  *   **The Forcing Case:** *The Town Memorial.* Tearing down a massacre memorial for land value is not automatically "forgetting." It may be a reallocation of resources for the living. A theory that cannot weigh the value of the land against the value of the plaque offers no guidance for governance, only for martyrdom.

  **7. Plasticity Accommodation**
  *   **The Requirement:** The theory must account for the biological fact that recall alters the memory. It cannot demand "fidelity to the original event" as a static standard, because the mechanism of transmission is inherently reconstructive.
  *   **The Forcing Case:** *The Biology of Recall.* Every time we remember, we rewrite. A theory demanding perfect transmission is fighting neurology. The ethics must shift from *preservation* to *stewardship of the rewriting process* (i.e., ensuring the distortions remain within ethical bounds).

  ***

  ### The Biological Constraint
  **Is reconstructive memory a real constraint on the ethics?**
  Yes. It is not merely a fact the ethics waves away; it invalidates any duty framed as "preservation." You cannot have a duty to do the impossible. If memory is biologically reconstructive, a theory demanding "accurate transmission of a fixed past" is scientifically incoherent.
  **The Adjustment:** The ethical object changes. You are not duty-bound to preserve the *past*; you are duty-bound to curate the *narrative evolution*. The obligation is not to the event itself, but to the integrity of the *process* by which the event is retold. This shifts the theory from archaeology (digging up the fixed thing) to gardening (pruning the living thing).

  ***

  ### The Knockout Requirement
  **The single requirement that eliminates the most popular answers:**
  **#6: Resource Trade-off Protocol.**

  **Why:** Most prominent theories (Margalit included) operate deontologically. They frame memory as a categorical duty ("We *must* remember"). This works in the seminar room but collapses in the city council. When a community faces a choice between a memorial and a hospital, or a monument and affordable housing, the "duty to remember" offers no algorithm for decision-making unless it acknowledges that memory has a cost.
  Rieff's "therapeutic forgetting" solves this by prioritizing the present's health, but often at the cost of justice. Margalit's "ethics of memory" prioritizes the past's claim, but often at the cost of the present's resources. A theory that cannot quantify the opportunity cost of memory is not a political theory; it is a prayer. It fails the "town tearing down the memorial" test because it cannot distinguish between *negligence* and *necessary triage*.

  ***

  ### The Incompatible Pair
  **The two requirements that likely cannot both be satisfied:**
  **#2 (Mode Differentiation: Fidelity to Facts)** **vs.** **#4 (Therapeutic Constraint: Social Cohesion)**

  **The Tension:**
  You suspected Accuracy vs. Cohesion. It is slightly more precise than that: It is **Archival Integrity** vs. **Narrative Utility**.

  *   **Archival Integrity** demands that the propositional content (the facts) remain as complex, contradictory, and uncomfortable as the event warranted.
  *   **Narrative Utility** demands that the practical content (the identity) serve a function that stabilizes the community and prevents future harm.

  **Why they conflict:**
  History is rarely morally legible. Real events are messy, victims are not always pure, and perpetrators are not always monsters. To make a memory *useful* for building a cohesive, ethical present (Narrative Utility), you often have to smooth out the contradictions of the *actual* past (Archival Integrity).
  *   If you maximize **Integrity**, you risk paralyzing the community with ambiguity or hardening grievances based on complex historical slights that cannot be resolved.
  *   If you maximize **Utility**, you risk myth-making. You create a "useful past" that functions well for social cohesion but lies about what actually happened.

  **The Implication for your piece:**
  An adequate theory must admit this trade-off. It cannot promise a memory that is both perfectly true and perfectly healing. It must force a choice: Are we remembering to honor the dead (which requires truth, even if it hurts), or are we remembering to save the living (which may require simplification, even if it distorts)? Most popular answers try to claim both. The spec demands you pick which one breaks when the other holds.
