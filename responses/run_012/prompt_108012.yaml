answer: |-
  **Brainstorming the Argumentative Moves**

  1.  **The Theological Concession:** Accept the authority of scripture and religious hierarchy, but argue that understanding the natural world is a form of reverence, not rebellion; ignorance is not a virtue. (Draws on Sor Juana's argument that studying God's creation leads one closer to God.)
  2.  **The Dual Purpose of Knowledge:** Acknowledge that educated women make better mothers and teachers (instrumental), but insist that women also have a right to study for the sake of their own minds, to cease being ignorant (non-instrumental). (Draws on Sor Juana's distinction between studying to teach children and studying to satisfy one's own intellectual hunger.)
  3.  **The Distinction Between Means and Expectations:** Distinguish between the permission to learn privately and the permission to teach publicly; argue that a school demanding high competence from girls while refusing to fund their study tools is more unjust than a school that simply expects nothing. (Draws on Sor Juana's critique that one cannot demand virtue without providing the education necessary to achieve it.)

  ***

  **Speech for the Assembly**

  Good morning. We are here to launch a study program for girls. I know this launch comes with questions. I know there is a concern that resources directed here are resources taken from elsewhere, specifically from programs for boys. I know there is a deeper concern, held by people who love this school, that scripture assigns women a specific, quiet role, and that preparing us for rigorous academic work contradicts that role.

  I am not here to tell you that concern is wrong about scripture. I am not here to argue that religious authority should be overturned. Three hundred years ago, Sor Juana Inés de la Cruz, a nun and the greatest scholar in the Americas, was told the same thing by her bishop. She was told to stop studying secular texts and focus on prayer. She did not argue that the bishop lacked authority. She argued that understanding the world was a way of honoring the One who made it.

  If we believe God created the laws of physics, then studying physics is not an act of rebellion. It is an act of reading His work. To deny a girl the chance to understand the world is not to protect her faith; it is to ask her to be ignorant of God's creation. Conceding the authority of scripture costs you nothing here, because knowledge does not subtract from piety. It removes the blindness that makes piety difficult.

  There is a second argument I have heard, which is that girls will ultimately raise children, so their education should be limited to what is useful for that task. I will concede this too. Sor Juana argued exactly this: that a woman who knows logic and science can teach her children better than one who does not. If the goal is to have virtuous, smart families, then the mothers must be equipped to teach them. An educated woman serves her future family better than an uneducated one.

  But I must add what Sor Juana added, which is that this instrumental view is not enough. She wrote that she did not study only to teach others. She studied because she could not bear to be ignorant. She studied because her mind demanded food. If we launch this program only to make us better mothers or better employees, we are treating us like tools. We are human beings. We have a right to study not because of what we will produce, but because of who we are. To deny us that is to say our internal lives do not matter.

  Finally, there is a difference between being permitted to learn and being permitted to speak with authority. Sor Juana accepted that she could not preach from the pulpit. She accepted limits on her public teaching. But she refused to accept limits on her private study. She argued that it is contradictory to demand virtue from women while denying them the means to understand virtue.

  This school demands competence from us. You demand high grades. You demand we prepare for colleges that will not lower their standards for us. You expect us to speak with authority in these halls. But if you demand that performance while refusing to fund the time and space we need to acquire the knowledge behind it, you are in a worse position than if you simply expected nothing at all. To demand the fruit while withholding the water is not stewardship; it is dishonesty.

  This program is not about rebellion. It is about consistency. It is about aligning the resources of this school with the expectations this school already holds. We are not asking to change the doctrine. We are asking to be allowed to read the book. We are asking for the means to meet the standard. Please support us in this.
