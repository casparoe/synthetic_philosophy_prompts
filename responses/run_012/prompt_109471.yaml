prompt: |-
  So I'm in this little reading group on philosophy of the social sciences and last week it was Popper's The Poverty of Historicism — well, an excerpt, I didn't finish it. One of the guys there, who's read way more than me, gave us a summary and everybody nodded along, but something felt slightly off and I couldn't put my finger on it. Roughly what he said: Popper's target is what he calls the historicists, meaning basically anyone who thinks history has laws, and Popper's big claim is that there simply are no laws of historical development, so all long-range prediction about society is impossible, full stop. His killer argument, according to this guy, is the growth-of-knowledge one — we can't predict what we'll know in the future, because to predict it we'd already have to know it, so any prophecy about the broad shape of the future is self-undermining. And then the punchline: since prediction is off the table, social science should stop trying to be like physics and settle for 'piecemeal engineering', just tinkering with small reforms; and the reason any of this matters is political, because historicism leads straight to totalitarianism — if you think you've found the law of history you'll force everyone to march to it. He also said this is why all the current AI-timeline forecasting is basically historicism in a new outfit.

  I think parts of that are right, but I have a nagging feeling he's smooshed three or four separate Popperian moves into one and made a couple of specific mistakes — I remember Popper saying something about laws in social science, and something about 'situational logic', and I don't think either fits what he told us. Can you audit his summary more or less sentence by sentence? Tell me what Popper would accept, what he'd wince at, and what's flatly wrong; whether the growth-of-knowledge argument really establishes that predicting society is impossible or only something narrower (and whether 'self-undermining' is even the right word for what it shows); and whether the totalitarianism punchline actually follows from the argument about prediction or is a separate, weaker claim bolted onto it. And if his last line about AI timelines has anything to it, say where that analogy carries weight and where it breaks.
