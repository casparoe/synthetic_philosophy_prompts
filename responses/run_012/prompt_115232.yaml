answer: |-
  **Set: "Tomorrow's People"**

  I joined a support group for grad students called "Tomorrow's People." The leader is this guy, Dr. Later. Very sincere, very brilliant, and he has never once started a meeting on time.

  But he insists it's not procrastination. It's *hyperbolic discounting*.

  See, we schedule the meeting for next Tuesday. On Monday, Tuesday looks great. The cost of attending is far away, so it's discounted heavily. We all value "intellectual community" over "sitting on the couch." Our preferences are consistent.

  But as Tuesday approaches, the curve steepens. By 7 PM, the immediate cost of putting on shoes spikes vertically. The value of "intellectual community" flattens out. It's not that we're weak; it's that our preference ordering literally flips. The person at 9 AM sincerely wants to discuss Aristotle. The person at 7 PM sincerely wants to discuss nothing.

  So Dr. Later splits us into two camps. The Naives and the Sophisticates.

  The Naives think Future Them will honor Past Them's plans. They're the ones saying, "I'll definitely write the chapter tomorrow." They think their preferences are stable over time. Bless their hearts.

  The Sophisticates know better. We know Future Us is a betrayal waiting to happen. So we try precommitment. Ulysses contracts. One guy in our group, let's call him Kant, he paid me fifty bucks to slap him if he didn't show up to the meeting. That's sophistication. He knows his discount rate will spike, so he tries to bind his future self.

  But here's the problem. I show up at 7 PM to slap him. He's not there.

  I call him. He says, "You can't slap me. That contract was signed by Morning Kant. I'm Evening Kant. We have different utility functions. I don't recognize the authority of Morning Kant's signature."

  So I go to Dr. Later. I say, "The precommitment failed. The enforcement mechanism collapsed."

  And Dr. Later says, "No, no. The enforcement worked perfectly. It's just a jurisdictional issue. You're trying to enforce a treaty between two sovereign states that happen to share a body."

  He says, "Stop calling it akrasia. It's not weakness of will. It's regime change."

  "So we're not a support group," I asked. "We're a UN peacekeeping mission for temporal slices?"

  "Exactly," he said. "Which is why we keep rescheduling the meeting to next week. Because the selves who voted to meet are not the selves who have to attend. We can't get a quorum. The constituents keep dying every fifteen minutes."

  "So when do we meet?"

  "We don't. We just send emails. Email is the only medium where Morning Me and Evening Me can coexist without violating the non-aggression pact."

  ***

  **Note on Philosophical Liberties**

  This joke treats hyperbolic discounting as entailing a "divided self" ontology—essentially leaning into George Ainslie's *picoeconomics* or a Parfitian reductionist view where preference reversal implies a fragmentation of agency. The punchline ("regime change") assumes that if preferences are time-inconsistent, the normative authority of the past self over the present self is nullified.

  **Liberties Taken:**
  1.  **Identity vs. Preference:** Standard rational choice theory treats hyperbolic discounting as a single agent's inconsistency, not necessarily distinct agents. The joke conflates *psychological discontinuity* with *ontological distinctness*.
  2.  **Sophistication Failure:** It assumes sophisticated agents cannot solve the intrapersonal bargaining problem. In reality, sophisticated agents can sometimes achieve "resolute choice" (McClennen) where they simply stick to the plan despite the shift in preference, without needing external binding.

  **What Would Change the Punchline:**
  I would rewrite or drop the joke if convinced by arguments for **resolute choice** or **continuity of agency**. If empirical psychology showed that agents regularly override present bias through internal rational commitment *without* precommitment devices (suggesting the "self" remains unified enough to enforce norms across time), the "regime change" punchline fails. Similarly, if a normative argument successfully established that Past Me has *authority* over Future Me regardless of preference shifts (e.g., a strong Lockean psychological continuity criterion), the joke's premise that Evening Kant can void Morning Kant's contract would be philosophically untenable. The joke relies on the idea that preference reversal dissolves obligation; if obligation survives reversal, the joke collapses.
