answer: |-
  # Question-Period Preparation Sheet
  **Context:** Joint Social Choice / Political Theory Seminar
  **Stakes:** High (Job market year, bridging two cultures)
  **Strategy:** Defend the diagnosis (representational artifact); moderate the constructive proposal (agenda/game constraints); concede the "informational basis" lineage immediately to claim novelty on the *structural* fix.

  ---

  ## Part I: The Eight Objections (Ranked by Likelihood × Damage)

  ### 1. The "Informational Basis" Charge (Economist 1 / Senior Theorist)
  **Phrasing:** "You've dressed up the old complaint about the informational basis of social choice in new clothes. Sen already admitted the welfarist framework was too thin. If you just say 'the model lacks the structure to represent rights,' aren't you just restating the argument for non-utility information without adding anything formal?"
  **Likelihood:** Very High | **Damage:** Critical (Undermines novelty)
  **Two-Minute Reply:** "Sen's move was to enrich the *information* going into the function (capabilities, functionings). My claim is stronger: the *function itself*—the mapping from profiles to a complete social ordering—is the distortion. Enriching the inputs doesn't fix a machine designed to crush them. I'm not asking for more data; I'm arguing the output (a complete ranking) is the category error. The impossibility vanishes not because we know more about preferences, but because we stop demanding a ranking where jurisdiction applies."
  **Soft Spot:** You haven't formally proved that *no* aggregation function can handle your agenda constraints without generating a new impossibility.
  **Opponent's Next Move:** "Then prove your new mechanism doesn't generate an impossibility at the meta-level of agenda-setting."
  **Preemptive Concession:** **Yes.** Address this in the introduction. Explicitly acknowledge the lineage ("This is cognate with the informational basis critique...") but pivot immediately to the *structural* distinction (inputs vs. functional form).

  ### 2. The "Impossibility at Meta-Level" Charge (Economist 3)
  **Phrasing:** "If rights are moves in a game or constraints on the agenda, you haven't escaped the impossibility; you've just restated it one level up. Who decides the agenda? If we aggregate *those* preferences, don't we get the same paradox?"
  **Likelihood:** High | **Damage:** High (Technical fatalism)
  **Two-Minute Reply:** "You're right that conflict doesn't disappear from the world. But the *normative location* of the conflict shifts. In Sen's framework, the conflict is internal to the concept of liberty (liberty contradicts Pareto). In mine, the conflict is external (agents disagree on the rules). That transforms a logical contradiction into a political bargaining problem. We trade an impossibility theorem for a coordination problem. That is a gain, because coordination problems are solvable via institutions; logical contradictions are not."
  **Soft Spot:** You are assuming the meta-level bargaining is stable. If the agenda-setter is dictatorial, you've solved liberty by killing it.
  **Opponent's Next Move:** "So your solution relies on a benign agenda-setter? That's a political assumption, not a formal one."

  ### 3. The "Changing the Subject" Charge (Economist 2)
  **Phrasing:** "The Liberal Paradox is interesting precisely because it holds even with self-regarding preferences. By moving to agenda constraints, you're defining liberty in a way that makes it compatible with Pareto by fiat. Have you solved the tension, or just defined it away?"
  **Likelihood:** High | **Damage:** Medium (Makes the paper look like a trick)
  **Two-Minute Reply:** "I'm not defining liberty to be compatible; I'm arguing the standard definition *is* the distortion. If 'liberty' means 'decisiveness over a pair in a social ranking,' then yes, it conflicts with Pareto. But no liberal claims that. Liberals claim jurisdiction. If I model your claim accurately and the paradox disappears, I haven't dissolved the problem; I've corrected the model. The tension was between Pareto and a straw man of liberty."
  **Soft Spot:** You need to show that the "jurisdiction" model captures the *intuition* of the Prude/Libertine case better than the "pairwise decisiveness" model.
  **Opponent's Next Move:** "The Prude/Libertine case *is* about pairwise outcomes (reading the book). Your model can't capture the offense taken by the Prude."

  ### 4. The "Trumps" Charge (Rawlsian Theorist)
  **Phrasing:** "If rights are just constraints on the agenda, they look like efficiency parameters or jurisdictional boundaries. But rights are trumps. They shouldn't just limit the menu; they should invalidate certain social choices regardless of the aggregation procedure. Doesn't your view concede too much to the consequentialist framework?"
  **Likelihood:** Medium | **Damage:** Medium (Alienates the theory half)
  **Two-Minute Reply:** "In a social choice context, a 'trump' *just is* a constraint on the admissible set. If a right prevents a social state from being chosen, it effectively removes it from the domain over which we aggregate. The difference is semantic: you call it a trump, I call it a domain restriction. But my formalism makes the cost of that trump visible: it creates incompleteness in the social ranking. I'm not conceding to consequentialism; I'm showing what deontology looks like mathematically."
  **Soft Spot:** Incompleteness might be seen as a failure of the state to act, whereas a trump is an active veto.
  **Opponent's Next Move:** "Incompleteness leads to arbitrary choice among the remaining options. Where is the protection there?"

  ### 5. The "Legitimacy of Unrankability" Charge (Republican Theorist)
  **Phrasing:** "If your model results in an incomplete social ordering, how does the state choose legitimately? If the state cannot rank A over B because rights block the comparison, isn't any choice between them arbitrary domination?"
  **Likelihood:** Medium | **Damage:** Medium (Political viability)
  **Two-Minute Reply:** "Arbitrariness comes from imposing a ranking where none exists. If rights render A and B incomparable, the state picking one isn't domination; it's recognizing that the collective has no standing to judge between them. The legitimacy comes from the procedure that respected the constraints, not from the optimality of the outcome. Non-domination is secured by the constraint, not the ranking."
  **Soft Spot:** This relies on a proceduralist view of legitimacy that the Republican might reject if the outcome affects power dynamics.
  **Opponent's Next Move:** "If the choice affects power dynamics, the procedure doesn't matter. You're ignoring the material outcome."

  ### 6. The "Preference Semantics" Charge (Grad Student)
  **Phrasing:** "You talk about constraints on the agenda, but you still use the word 'preference.' In behavioral work, preferences reverse depending on framing. If preferences aren't stable, what work is the term doing in your formalism? Are you modeling choices or psychological states?"
  **Likelihood:** Medium | **Damage:** Low (Niggling but annoying)
  **Two-Minute Reply:** "I'm using 'preference' in the revealed-choice sense required for the theorem, not the psychological sense. The paradox holds regardless of whether preferences are stable psychological states or context-dependent choices, provided they satisfy the minimal consistency conditions for the theorem. My critique targets the aggregation of those choices, not their ontology."
  **Soft Spot:** If preferences are context-dependent, the "agenda" is just another context frame, which might reintroduce the paradox via framing effects.
  **Opponent's Next Move:** "Then your agenda constraint is just another frame. You haven't escaped the instability."

  ### 7. The "Bad Model" Skeptic (Theorist 3)
  **Phrasing:** "Isn't this whole paper just a long way of saying 'the model is bad'? If the paradox is an artifact of the representation, why did we need a formal proof to tell us that translating rights into orderings is weird?"
  **Likelihood:** Low | **Damage:** Low (Dismissive)
  **Two-Minute Reply:** "Because the model *is* the argument in this field. The Liberal Paradox is cited as proof of a normative tragedy. Showing it's a modeling error isn't trivial; it stops theorists from drawing false normative conclusions. It's the difference between saying 'liberty is impossible' and 'economists are using the wrong ruler.'"
  **Soft Spot:** Can sound defensive or anti-formal.
  **Opponent's Next Move:** "So you're doing cleanup work, not constructive work."

  ### 8. The "Who Sets the Agenda?" Charge (The "Hope Nobody Asks")
  **Phrasing:** "You say rights constrain the agenda. But in real politics, the agenda is the primary site of power. If rights are agenda constraints, doesn't your model require a prior theory of who sets the agenda? And if you model *that*, don't you just reintroduce the aggregation problem?"
  **Likelihood:** **Low (Hope nobody asks)** | **Damage:** **Critical** (Collapses the constructive proposal)
  **Two-Minute Reply:** "That is the next paper. This paper establishes that *if* we model rights as agenda constraints, the Liberal Paradox dissolves. I am not solving the problem of constitutional design today; I am solving the problem of interpreting Sen. I'm arguing that the impossibility isn't in the liberty; it's in the ranking. How we secure the agenda constraint is a separate institutional question."
  **Soft Spot:** This admits the constructive proposal is incomplete.
  **Opponent's Next Move:** "Then your solution is parasitic on a solution you don't have."

  ---

  ## Part II: Strategic Adjustments

  ### The One Question to Preempt (Restructure the Talk)
  **Objection:** The "Informational Basis" Charge (#1).
  **Action:** Do not wait for Q&A. In your **Introduction**, after stating the thesis, add this paragraph:
  > "Now, this diagnosis sounds familiar. It resonates with the critique that social choice suffers from an impoverished informational basis. I want to be precise: Sen's own later work addressed this by adding information (capabilities). My argument is distinct. It is not that we need *more* information in the function, but that the *function itself*—the requirement to produce a complete social ordering—is the error. I am not enriching the inputs; I am changing the output structure."
  **Why:** This inoculates you against the "rediscovery" sting. It shows you know the lineage but distinguishes your structural claim from their informational claim. It turns a potential attack into a demonstration of competence.

  ### The One Thing Theorists Will Think But Not Say
  **The Thought:** "You have solved the logic puzzle, but you have lost the politics. By making rights into agenda constraints, you've made them safe for mathematics, but you've stripped them of their power to disrupt unjust rankings. You've turned rights into jurisdictional boundaries, which is how bureaucrats see them, not how victims see them."
  **How to Handle:** You cannot answer this directly without sounding defensive. Acknowledge the tension in your conclusion. "I recognize that modeling rights as constraints may feel less robust than modeling them as trumps. But a right that generates a logical contradiction cannot be instantiated. I prefer a right that functions to a right that is logically coherent but impossible."

  ### Concessions to Make Preemptively
  1.  **Concede the "Meta-Level" Risk:** Admit in the constructive section that moving the problem to the agenda level does not guarantee a solution, only a shift from *logical impossibility* to *political contingency*. This disarms Economist 3.
  2.  **Concede the "Psychological" Thinness:** Admit to the Grad Student (in the talk) that your model treats preferences as choices, not mental states. This prevents them from feeling ignored.
  3.  **Concede the Lineage:** As noted above, concede the link to the informational basis critique immediately. Fighting this makes you look ignorant of the field's history.

  ---

  ## Part III: Final Advice for the Room
  *   **For the Economists:** Speak in terms of "domain restrictions" and "functional form." Do not use normative language when a formal term will do. When they say "you're changing the subject," reply "I'm correcting the specification."
  *   **For the Theorists:** Speak in terms of "jurisdiction" and "legitimacy." Do not get bogged down in the proof details. When they say "rights are trumps," reply "in a collective choice mechanism, a trump is a domain restriction."
  *   **For Yourself:** You are the bridge. If the room splits (economists vs. theorists), your job is to translate. If an economist attacks a normative premise, translate it into a formal constraint. If a theorist attacks a formal assumption, translate it into a normative cost.
  *   **The Sting:** Your friend is half-right. It *is* about the informational/structural basis. But Sen's solution was "add info." Yours is "change structure." That is the distinction. Hold that line. If you waver on whether this is new, you lose. If you own it as a structural refinement of the informational critique, you win.
