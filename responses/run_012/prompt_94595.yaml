  8.  *(Self-Correction on the "Officious Lie" definition)*: In Roman rhetoric (Cicero), an officious lie is one told for the benefit of another. Augustine adopts the term but strips it of moral legitimacy. I must make sure the user understands that for Augustine, *officium* (duty) never includes lying.

