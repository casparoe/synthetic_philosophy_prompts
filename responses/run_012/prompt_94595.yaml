      *   *Is the officious lie Type 7 or 8?* In *De Mendacio*, the 8th type is lying to save someone from bodily defilement (rape). The 7th is saving a life. The "officious lie" in the Cicero sense (for advantage) is generally condemned. I need to be precise here. The user calls the "harmless white lie" officious. Augustine defines *officiosum* as doing a service. He condemns it.
      *   *Key Text:* *De Mendacio* 14.25 is crucial: "Every liar breaks his faith... but whoever lies in a matter of religion breaks it with God."
      *   *Key Text:* *Contra Mendacium*: Written later, even stricter, specifically against Priscillianists who argued lying for truth's sake is okay.

  7.  **Final Polish:**
