      *Decision:* The "Generalization vs. Drift" distinction is the most technically damaging because it makes the thesis unfalsifiable without better tools.

      *Let's finalize the Weakest Point:* The mechanism for *enforcing* structure preservation. It's easy to say "do it," hard to say "how."

      *Let's finalize Concede Up Front:* Distillation *usually* drifts. Structure preservation is expensive.

