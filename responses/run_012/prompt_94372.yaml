      *   *Defining Pessimistic Meta-Induction:*
          *   This is a different beast. It's an argument against scientific realism, not a methodological critique of history writing.
          *   Whiggism assumes we are the endpoint. PMI assumes we are just another wrong step.
      *   *Reconciling Progress:*
