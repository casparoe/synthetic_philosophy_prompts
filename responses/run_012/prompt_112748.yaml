answer: |-
  # Activity Packet: The *Philosophia floribunda* Variance Lab

  ## 1. Preparation & Materials

  **The Organism:** *Philosophia floribunda* (an invented annual plant).
  **The Trait:** "Stature" (measured in arbitrary units, cm).
  **The Room:** Seminar table. Whiteboard divided into 4 quadrants.

  **Deck A: Genotype Cards (16 cards total)**
  Print and cut. Distribute one to each student at the start. Keep 4 spares.
  *   **Type Alpha (4 cards):** Baseline = 10, Sensitivity = +1. *Text: "Grow 1 unit per Soil point."*
  *   **Type Beta (4 cards):** Baseline = 14, Sensitivity = 0. *Text: "Fixed height. Ignore Soil."*
  *   **Type Gamma (4 cards):** Baseline = 10, Sensitivity = -1. *Text: "Shrink 1 unit per Soil point."*
  *   **Type Delta (4 cards):** Baseline = 10, Sensitivity = Threshold. *Text: "Height 10 unless Soil is 4, then Height 20."*

  **Deck B: Soil Cards (16 cards total)**
  Print and cut. Keep in a face-down stack.
  *   **Values:** Four cards marked "1", Four marked "2", Four marked "3", Four marked "4".

  **Student Worksheet (1 per student)**
  *   **Header:** Round Number, Genotype, Soil Score.
  *   **Step 1:** Calculate Height ($H$).
  *   **Step 2:** Write $H$ on the Board in your assigned Quadrant.
  *   **Step 3:** Calculate Class Mean ($\bar{H}$).
  *   **Step 4:** Calculate Deviation ($H - \bar{H}$).
  *   **Step 5:** Calculate Squared Deviation $(H - \bar{H})^2$.
  *   **Step 6:** Sum of Squares ($SS_{Total}$).
  *   **Step 7 (Rounds 1, 4, 5 only):** Group by Genotype. Calculate Mean Height for your Genotype. Calculate Variance of those 4 Genotype Means ($SS_{Genetic}$).
  *   **Step 8:** Calculate Ratio ($SS_{Genetic} / SS_{Total}$).

  **Board Layout**
  Draw four large boxes labeled **Team 1, Team 2, Team 3, Team 4**. Inside each, draw columns: *Student, Genotype, Soil, Height, Deviation, Sq. Dev.*
  At the bottom of the board, reserve a space for **Global Stats**: *Total Mean, Total SS, Genetic SS, Ratio*.

  ---

  ## 2. The Arithmetic Key (Instructor Only)

  *Use this to verify student calculations quickly.*

  **Baseline Numbers (for Uniform Soil Round):**
  If everyone gets Soil = 2:
  *   Alpha: $10 + 2 = 12$
  *   Beta: $14 + 0 = 14$
  *   Gamma: $10 - 2 = 8$
  *   Delta: $10 + 0 = 10$ (Threshold not met)
  *   **Class Mean:** $(12+14+8+10)/4 = 11$.
  *   **Deviations:** Alpha (+1), Beta (+3), Gamma (-3), Delta (-1).
  *   **Squared Devs:** 1, 9, 9, 1. Sum per set of 4 = 20.
  *   **Total SS (16 students):** $20 \times 4 = 80$.
  *   **Genetic Means:** 12, 14, 8, 10. Mean of Means = 11.
  *   **Genetic SS:** Same as Total SS in this round (80).
  *   **Ratio:** $80/80 = 1.0$.

  **Round 1 (The "Random" Mix):**
  *   *Secret Rig:* Give Alpha/Delta mostly Soil 1 & 2. Give Beta/Gamma mostly Soil 3 & 4.
  *   *Expected Result:* Ratio will be approx 0.4 - 0.6 depending on exact mix.
  *   *Coda:* Reveal the correlation suppressed/expanded variance.

  **Round 4 (Between-Group):**
  *   Split room: Left (Alpha/Beta) gets Soil 1. Right (Gamma/Delta) gets Soil 4.
  *   Left Heights: Alpha 11, Beta 14. Mean = 12.5.
  *   Right Heights: Gamma 6, Delta 20. Mean = 13.
  *   *Gap:* Small mean difference, huge internal variance on the Right (Delta spikes).
  *   *Fallacy:* Students may attribute the Right-side spike to "bad genes" rather than the Soil 4 trigger.

  ---

  ## 3. Timeline (90 Minutes)

  *   **00:00 – 00:05:** **Setup.** Hand out Genotype cards. Do not explain the formula yet. Tell them they are *P. floribunda*.
  *   **00:05 – 00:20:** **Round 1 (The Baseline).** Distribute Soil cards (Rigged). Students calculate Height. Fill board. Calculate Ratio. *Instructor says nothing about the result.*
  *   **00:20 – 00:30:** **Round 2 (Uniform Environment).** Collect Soil cards. Hand everyone a "2". Recalculate. Calculate Ratio. (Result: 1.0).
  *   **00:30 – 00:40:** **Round 3 (Intervention).** Keep Soil "2". Announce "Fertilizer Event: Add 10cm to everyone." Recalculate Mean and Ratio. (Result: Ratio stays 1.0).
  *   **00:40 – 00:55:** **Round 4 (The Divide).** Split room Left/Right. Left gets Soil 1, Right gets Soil 4. Calculate Ratio *within* each group, then compare Group Means.
  *   **00:55 – 01:05:** **Round 5 (Narrow Environment).** Collect Soil. Hand out only "2" and "3". Recalculate Ratio. (Result: Ratio rises compared to Round 1).
  *   **01:05 – 01:30:** **Debrief & Coda.** Reveal the concept, map rounds to targets, reveal Round 1 rigging.

  ---

  ## 4. Instructor Script (Rounds 1–5)

  *Keep tone neutral. Do not use the words "heritability," "gene," or "environment." Use "Genotype," "Soil," "Variation," "Ratio."*

  **Opening (00:00):** "You are plants. Your card is your constitution. The card I give you next is your plot's soil. Your height is determined by these two numbers. We are going to measure the variation in this population five times."

  **Round 1 Instruction:** "Draw a Soil card. Calculate your height. Write it on the board. We will calculate the 'Variation Ratio': How much of the total spread is predictable by Genotype alone?"
  *(Wait for calculations. Write the resulting Ratio on the board. Do not comment on whether it is high or low.)*

  **Round 2 Instruction:** "Return Soil cards. Everyone takes a '2'. Recalculate Height. Recalculate the Ratio."
  *(Expectation: Students will see the Ratio hit 1.0.)*

  **Round 3 Instruction:** "Keep Soil '2'. I am applying fertilizer. Add 10 to your height. Recalculate the Ratio."
  *(Expectation: Ratio stays 1.0. Mean shifts.)*

  **Round 4 Instruction:** "Left half of the table, take Soil '1'. Right half, take Soil '4'. Calculate the Ratio *within* your half. Then, compare the Average Height of the Left vs. the Right."
  *(Expectation: High internal variance on the Right due to Delta. Large gap between Left/Right means.)*

  **Round 5 Instruction:** "Return cards. Take only '2' or '3'. Recalculate the Ratio."
  *(Expectation: Ratio increases compared to Round 1 because Environmental variance dropped.)*

  ---

  ## 5. The Debrief Guide (01:05 – 01:30)

  *Now you may use the term **Heritability ($h^2$)**. Write it on the board.*

  **1. Define the Term:** "The 'Variation Ratio' you calculated is a heritability estimate ($h^2 = V_G / V_P$). It is a statistic about a population's variance, not an individual's trait."

  **2. Map the Rounds to Learning Targets:**
  *   **Round 2 ($h^2 = 1$):** "The ratio was 1. Did that mean the trait was fixed? No. It meant $V_E$ was zero. If I had given you different soil, you would have varied. **Target:** $h^2=1$ does not mean immutable."
  *   **Round 3 (Intervention):** "I added 10cm to everyone. The mean changed, the ratio didn't. **Target:** High heritability does not mean intervention is pointless."
  *   **Round 5 vs Round 1 (Narrowing Env):** "In Round 5, you (the organisms) didn't change. The soil range shrank. The ratio went up. **Target:** Heritability depends on the range of environments sampled."
  *   **Round 4 (Between-Group):** "The Left and Right groups had different average heights. Was that genetic? No, it was Soil (1 vs 4). Yet, within each group, heritability was high. **Target:** Within-group $h^2$ does not explain between-group differences."
  *   **GxE (Delta & Gamma Cards):** "Look at Delta. In poor soil, it looked like Beta. In rich soil, it spiked. Look at Gamma. It got shorter as soil got better. **Target:** Genotypes have reaction norms; rank orders can reverse."

  **3. The Coda (Round 1 Rigging):**
  "In Round 1, I told you Soil was random. It was not. I gave high-sensitivity plants poorer soil. This created a correlation between Genotype and Environment. In real studies, we assume independence. If that assumption fails (e.g., socioeconomic status correlating with genetic ancestry), the estimate is confounded. You cannot partition the variance cleanly."

  **4. Handling Objections:**
  *   *"But Round 1 showed it was mostly genetic!"* -> "It showed that *in that specific distribution of soil*, genotype predicted height well. Change the soil distribution, change the prediction."
  *   *"Plants aren't people."* -> "Correct. This is a logic model. The math of variance partitioning applies to any trait with multiple causes. The philosophical error is assuming the number tells you about 'cause' rather than 'variance'."
  *   *"Round 3 was pointless."* -> "The ratio didn't change, but the plants grew. Heritability tracks *differences*, not *levels*."

  ---

  ## 6. Troubleshooting & Limitations

  **Predictable Problems:**
  1.  **Arithmetic Bog:** Squaring deviations takes time.
      *   *Fix:* Allow phone calculators for squaring only. Pre-write the deviations on the board if they stall, let them square.
  2.  **The Outlier:** If a Delta card gets Soil 4 in Round 1, their height (20) skews the mean.
      *   *Fix:* Acknowledge it. "This is GxE interaction. It inflates the Environmental Variance if we don't model it."
  3.  **Round 4 Resentment:** Students may feel cheated by the rigged groups.
      *   *Fix:* Lean into it. "This is exactly the point. Ecological fallacies feel intuitive until you check the cards."
  4.  **"Plants aren't People":**
      *   *Fix:* Agree. "We are testing the logic of the inference, not the biology of humans. If the logic fails here, it fails there."

  **What This Activity Cannot Do (Instructor Notes):**
  *   **Real Estimation:** Real $h^2$ uses regression on thousands of subjects, often twins or GWAS. This is a "known unknown" ANOVA. Real estimates have confidence intervals; this yields a point estimate.
  *   **Assumption of Additivity:** The formula $H = B + S \times E$ is linear (mostly). Real GxE is messy. The activity simplifies this to make the math runnable.
  *   **The Coda:** In real populations, G-E correlation is not a card trick by a professor; it is structural (e.g., legacy admissions, neighborhood segregation). The activity cartoons this as a deliberate deal; reality is systemic.
  *   **Conceptual Error in Sketch:** Your sketch suggested calculating $V_G$ and $V_E$ separately to sum to $V_P$. In the presence of GxE (Delta card), $V_P \neq V_G + V_E$. There is an interaction term ($V_{GxE}$). In the debrief, you must acknowledge that the "Ratio" they calculated in Round 1 technically ignored the interaction term, which is another source of error in simple heritability models.

  ---

  Summary: The activity is designed to make students feel that heritability is a volatile statistic describing a population's current variance, not a fixed measure of a trait's genetic destiny.
