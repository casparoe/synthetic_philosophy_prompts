  # JOINT STATEMENT OF ADVERSARIAL COLLABORATION
  **Subject:** The Semantics and Metaphysics of Vagueness
  **Parties:** The Epistemicist (E) and The Supervaluationist (S)
  **Date:** October 26, 2023

  ## PREAMBLE
  We, the undersigned, acknowledge that our six-month debate regarding the nature of vagueness has suffered from talking past one another. We agree that the Sorites paradox reveals a genuine problem in natural language and thought, not merely a logical slip. This document enumerates our common ground, isolates our substantive disagreements, identifies the cruxes upon which our theories turn, and specifies the empirical or theoretical evidence that bears on them.

  ---

  ## 1. COMMON GROUND: THE PHENOMENA AND OBLIGATIONS
  *We both sign the following claims regarding the data any theory must explain.*

  1.  **The Sorites Data:** There exist predicates (e.g., "is a heap," "is bald") where small changes in the base property (removing one grain, one hair) do not intuitively change the applicability of the predicate, yet large changes do.
  2.  **Borderline Cases:** There are specific instances where competent speakers, fully informed of the non-semantic facts, systematically hesitate to apply or withhold the predicate. This hesitation is not due to lack of attention or information.
  3.  **Explanation vs. Restatement:** A theory of vagueness fails if it merely posits a boundary (sharp or fuzzy) without explaining *why* that boundary is epistemically inaccessible or semantically indeterminate to speakers. Restating the paradox is not solving it.
  4.  **Theoretical Obligations:** A successful semantic theory must:
      *   Preserve as much of classical logic as plausible.
      *   Account for the intuitive validity of Sorites reasoning while explaining its ultimate unsoundness.
      *   Handle **Higher-Order Vagueness** (the vagueness of the boundary itself) without generating a regress or positing implausible metaphysical structures.
      *   Align with plausible psychological models of how speakers process borderline cases.

  ---

  ## 2. EXACT REMAINING DISAGREEMENTS
  *We disagree on the following specific claims. Each formulation is accepted by the holder as accurate and by the opponent as a fair characterization.*

  **Disagreement A: Bivalence and Facts of the Matter**
  *   **(E):** For every object $x$ and vague predicate $F$, the proposition "$x$ is $F$" is determinately either true or false, regardless of our ability to know which. There is a fact of the matter.
  *   **(S):** For some objects $x$ and vague predicates $F$ (borderline cases), the proposition "$x$ is $F$" is neither true nor false. There is no fact of the matter.

  **Disagreement B: The Nature of Truth**
  *   **(E):** Truth is a binary relation between propositions and the world. The schema ($p \iff \text{True}(p)$) holds universally.
  *   **(S):** "Supertruth" (truth on all admissible precisifications) is the correct surrogate for truth in vague contexts. The schema ($p \iff \text{Supertrue}(p)$) fails for borderline cases, and we must accept this cost to preserve the intuition that borderline claims lack a truth value.

  **Disagreement C: The Source of the Boundary**
  *   **(E):** The sharp boundary is fixed by the causal-historical chain of usage combined with microphysical facts, even if usage alone underdetermines it. The arbitrariness of the specific cut-off point is a feature of reference, not a bug.
  *   **(S):** The boundary is not fixed because meaning is partially indeterminate. Usage determines a *set* of precisifications, not a single extension. There is no "hidden" fact waiting to be found by a better theory of reference.

  ---

  ## 3. CRUXES AND PREDICTIONS
  *These are the sub-questions where resolution would force one or both of us to revise our position. We list what bears on the crux and our respective predictions.*

  ### Crux 1: Higher-Order Vagueness
  *The Problem:* If there is a boundary between "heap" and "non-heap," is there also a sharp boundary between "clearly a heap" and "borderline heap"?
  *   **What Bears on It:** The logical coherence of the meta-language. If we use vague terms to define the boundary, do we need a boundary for those terms?
  *   **(E) Prediction:** Yes, there are sharp boundaries at every order. The transition from "clearly true" to "borderline" is itself sharp, though unknowable. We accept this counterintuitive result as the price of classical logic.
  *   **(S) Prediction:** No, the set of "admissible precisifications" is itself vague. We do not posit a sharp line between precisifications that include $n$ grains and those that don't. If our theory forces a sharp line here, the theory is flawed.
  *   **Movement Condition:** (E) moves if it can be proven that sharp boundaries at higher orders lead to logical contradiction (not just counterintuitiveness). (S) moves if it is shown that "vague sets of precisifications" cannot be formally modeled without collapsing into (E) or incoherence.

  ### Crux 2: The T-Schema and Supertruth
  *The Problem:* Can the Supervaluationist assert "This sentence is supertrue" without contradiction in borderline cases?
  *   **What Bears on It:** Logical consistency and the intuitive plausibility of truth-claims.
  *   **(E) Prediction:** The Supervaluationist cannot consistently assert the T-schema ($p \iff \text{True}(p)$). If $p$ is borderline, $p$ is not supertrue, so "p is supertrue" is false. Thus $p$ and "p is supertrue" have different values. This breaks the concept of truth.
  *   **(S) Prediction:** We do not claim Supertruth is identical to ordinary truth. We claim it is the norm of assertion. We predict that speakers will reject "It is true that $p$" for borderline $p$, validating the failure of the T-schema in natural language.
  *   **Movement Condition:** (S) moves if it is shown that abandoning the T-schema makes communication impossible or renders "supertruth" useless for guiding belief. (E) moves if it is shown that the Epistemicist T-schema forces knowledge of the boundary (i.e., if Truth implies Knowability).

  ### Crux 3: Arbitrariness and World-Structure
  *The Problem:* Does the source of the cut-off change based on the predicate type (conventional vs. natural kind) or the domain (discrete vs. continuous)?
  *   **What Bears on It:** Comparison between "tall doorway" (conventional, discrete units) vs. "alive/dead" (biological, continuous process) vs. "red" (continuous spectrum).
  *   **(E) Prediction:** The mechanism is uniform. Whether discrete or continuous, there is a sharp cut-off fixed by external facts. For "alive/dead," the cut-off is a specific microphysical state. For "tall," it is a specific measurement fixed by usage norms. The arbitrariness is ontologically similar in both cases.
  *   **(S) Prediction:** The mechanism may differ. For "alive/dead," the world may supply a "joint" that narrows the range of admissible precisifications, whereas "tall" allows a wider range. For continuous spectra (color), precisifications must select cut-offs, but the *space* of precisifications reflects the continuity.
  *   **Movement Condition:** (E) moves if empirical linguistics shows speakers treat "natural kind" vagueness fundamentally differently from "conventional" vagueness in forced-choice tasks. (S) moves if it is shown that "world joints" cannot constrain precisifications without effectively creating a sharp boundary.

  ### Crux 4: Forced-Choice Psychology
  *The Problem:* When forced to choose "Yes/No" on a borderline case, what drives the response?
  *   **What Bears on It:** Experimental data on reaction times, error rates, and stability of response when the "boundary" is suggested.
  *   **(E) Prediction:** Responses at the boundary are effectively random noise (50/50 split) because speakers are guessing an unknowable fact. If told "The boundary is at 40 grains," speakers will converge on that rule for future cases, acknowledging they were previously ignorant.
  *   **(S) Prediction:** Responses at the boundary will show systematic instability or hesitation even after a rule is suggested. Speakers will treat the suggested boundary as a *new* precisification, not the discovery of the *old* one. They will not converge on "ignorance"; they will converge on "stipulation."
  *   **Movement Condition:** (E) moves if speakers systematically reject suggested boundaries as "incorrect" rather than "new information." (S) moves if speakers consistently report feeling they were "wrong" before and "right" after being told the boundary, indicating discovery rather than stipulation.

  ---

  ## 4. ANALYSIS OF THE VERBAL DISPUTE
  *Requester Note: You asked us to identify where this fight is merely verbal.*

  We have reviewed the claim that "there is no fact of the matter" (S) and "there is a fact we cannot know" (E) might be closer than we admit.

  **Where it IS Verbal:**
  There is a verbal overlap regarding **inaccessibility**. Both of us agree that for all practical human purposes, the boundary cannot be located.
  *   (E) says: "There is a fact, but it is *necessarily* unknowable."
  *   (S) says: "There is no fact, so it is *necessarily* unknowable."
  Functionally, both theories predict the same behavior from speakers: hesitation, lack of consensus, and the inability to point to the line. If "fact of the matter" is defined purely by its causal role in guiding successful assertion, our positions converge. We are both "Quietists" about the boundary's location.

  **Where it is NOT Verbal (The Substantive Core):**
  The dispute is not merely verbal because it entails different commitments about **modal space** and **logic**.
  1.  **Logic:** (E) preserves the Law of Bivalence ($P \lor \neg P$ is true because one disjunct is true). (S) preserves the Law of Excluded Middle ($P \lor \neg P$ is supertrue) but denies Bivalence (neither disjunct is supertrue). This is a technical, non-verbal difference in logical semantics.
  2.  **Counterfactuals:** If we had better microscopes or cognitive powers:
      *   (E) claims we *still* could not know the boundary (margin-for-error principles on knowledge).
      *   (S) claims the question would remain meaningless; there is nothing to know even for God.
  3.  **Error Theory:** (E) implies speakers are *mistaken* when they say "There is no boundary." (S) implies speakers are *correct* when they say "There is no boundary." This is a substantive disagreement about the truth-value of ordinary metaphysical claims.

  **Conclusion on Verbalism:**
  We agree with the Requester's suspicion to this extent: The *practical* difference is minimal. However, the *theoretical* cost differs. (E) pays in counterintuitive metaphysics (sharp lines everywhere). (S) pays in logical revision (truth-value gaps). We are not arguing over the definition of a word; we are arguing over which theoretical cost is less damaging to our overall worldview.

  ---
  **Signed,**
  *The Epistemicist*
  *The Supervaluationist*
