      *   Verbal dispute analysis at the end? Yes.
      *   Tone: Collaborative but rigorous.

  7.  **Final Polish:** Ensure the distinction between "truth" and "supertruth" is clear in the disagreement section. Ensure the Epistemicist's view on the "clear/borderline" boundary is explicit (it's also sharp). Make sure the Supervaluationist admits the "set of precisifications" problem.

  *(Self-Correction during drafting)*: I initially thought about making them agree on logic. But Supervaluationists often reject Bivalence while keeping Excluded Middle. Epistemicists keep both. I should note this in the disagreements.
  Also, on the "Verbal Dispute" section: I need to be careful not to dismiss the metaphysical difference. It's not *merely* verbal, but there is a verbal component regarding how we define "fact."

