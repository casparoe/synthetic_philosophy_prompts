  *(Post-computation check)*: Did I answer the specific question about "which evidence should move a question up or down"? I need to be specific there. E.g., if Researcher 3 finds music *is* tightly coupled, the gradient collapses. That moves "Mechanism" up and "Low Sensitivity" down (as a category).

