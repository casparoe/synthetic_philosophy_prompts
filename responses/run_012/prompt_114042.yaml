      *   *Author's Note:* Needs to be 4-5 sentences. Take a side: Is this fair or a cheap shot?
          *   *My take:* It's a bit of a cheap shot because Wittgenstein was describing *how language works*, not prescribing *how institutions should run*. Applying epistemological limits to HR policy is category error, which is the joke, but it risks making Wittgenstein look like a bureaucrat. I should argue that it highlights the danger of institutionalizing thought, which Wittgenstein would hate, so the satire is fair to the *misuse* of the ideas, if not the ideas themselves. Actually, the prompt asks me to take a side on whether the satire is fair to the *view*. I think it's a cheap shot because Wittgenstein was anti-system, and making a system out of it is inherently contradictory. I will argue it's a cheap shot but a necessary one to show the absurdity of codifying the uncodable.

  4.  **Drafting - Writing the Content:**

