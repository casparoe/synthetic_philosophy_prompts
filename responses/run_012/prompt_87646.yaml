answer: |-
  The hardware store case you described is the perfect stress test for legal theory. It pits the clean lines of the written word against the messy reality of human intention. On one side, you have the text: the law bans "hazardous substances," the state list includes bleach, the store is 400 feet away. The math is undeniable. On the other side, you have the purpose: the law was meant to stop chemical plant explosions, not stop a dad from buying Clorox for his kitchen.

  When these two clash, judges have to choose a master. Do they serve the words, or do they serve the aim?

  My verdict is unpopular but necessary: **Judges must follow the text.** Even in the bleach case. Even when it feels silly. Even when the legislature clearly messed up.

  This position is called Textualism. It argues that the law *is* the text that was passed, not the secret hopes in the legislators' heads. To understand why this is the only viable option for a democracy, we have to look at what happens when we choose the alternative.

  ### The Trap of the "Spirit" of the Law

  The alternative to textualism is Purposivism. A purposivist judge looks at your hardware store case and says, "Clearly, the legislature didn't mean to ban bleach. They were worried about toxic clouds from industrial plants. Therefore, the store is innocent."

  This feels satisfying. It feels like justice. But it requires the judge to do something dangerous: they have to rewrite the law.

  In your hypothetical, the statute explicitly incorporates an official state list, and that list explicitly includes bleach. If a judge rules for the hardware store, they are effectively saying, "The text says bleach is banned, but I am deleting bleach from the ban."

  Why is that a problem? Because in a democracy, only elected representatives are supposed to write the laws. Judges are not elected; they are appointed for life to be insulated from politics. If a judge can delete "bleach" from the law because they think it's silly, what stops them from deleting "schools" from the law? What stops them from deciding that 500 feet is too far, so they'll change it to 100 feet?

  When you empower judges to follow "purpose" over "text," you are giving them a license to govern. You are asking them to guess what the legislature *would have done* if they had been smarter. But the legislature wasn't smarter. They were careless. They passed a sloppy law.

  ### The Verdict: The Store is Liable

  So, in the hardware store case, a textualist judge must rule that the store is technically in violation of the statute. The text is clear. The list is clear. The distance is clear.

  This sounds harsh. It sounds like the judge is being a robot. But here is the crucial distinction: **Interpretation is not Enforcement.**

  Just because the text makes the store *liable* doesn't mean the owner should go to jail. This is where the system has a safety valve that doesn't require breaking the law. The safety valve is the prosecutor.

  In the American legal system, prosecutors have "discretion." They decide which laws to enforce and when. A smart prosecutor looks at this bleach case and says, "Yes, they violated the text, but prosecuting this is a waste of money and makes us look insane." So, they don't bring charges. Or, if they do, they offer a plea deal with no jail time.

  This preserves the integrity of the law without ruining the hardware store owner's life. The judge says, "The law applies to you," which keeps the text honest. The prosecutor says, "We won't punish you for it," which keeps the outcome fair.

  If the judge instead says, "The law *doesn't* apply to you," they have destroyed the text. Now the law on the books is a lie. It says one thing, but it means another. And if the text is a lie, citizens can't rely on it.

  ### The Strongest Objection: The Tyranny of the Text

  The strongest objection to my position is the argument from Absurdity. Critics will say: "You are prioritizing bureaucratic rigidity over common sense. If the text leads to a result that no human being could possibly want—like arresting a hardware store for selling cleaning supplies—then the text has failed. Following it isn't 'democratic'; it's tyranny by dictionary."

  This is a powerful argument. It appeals to our sense of fairness. It suggests that a law that produces an absurd result is no law at all. If the legislature passed this law to stop explosions, and we use it to stop bleach sales, we aren't upholding their will; we are mocking it.

  Furthermore, relying on the prosecutor to fix the judge's rigidity is risky. What if the prosecutor is ambitious and wants to make a name for themselves by cracking down on "school safety"? What if they are political enemies of the hardware store owner? If the judge says the law *doesn't apply*, the owner is safe forever. If the judge says the law *applies* but the prosecutor *might not enforce it*, the owner is living at the mercy of the government's whim. That is a dangerous place for a citizen to be.

  ### Why the Objection Doesn't Sink the Ship

  The objection from absurdity is compelling, but it ultimately fails because it assumes judges are better at fixing mistakes than legislators are.

  In your hypothetical, you mentioned that the evidence for the law's purpose is weak: a floor speech by one sponsor that maybe three people heard. This is the Achilles' heel of purposivism. If judges start ignoring text based on "purpose," they have to figure out what that purpose is. Whose purpose? The sponsor's? The people who voted yes? The people who voted no?

  If a judge decides the purpose was "stopping industrial explosions," they are making a factual determination that isn't in evidence. They are guessing. And once a judge is allowed to guess the "real" purpose to override the text, they will inevitably start finding "purposes" that match their own political views.

  The "Absurdity" objection assumes that the error is in the *law*. But in a democracy, the error is often in the *process*. The legislature wrote a bad law. That is their fault. If a judge fixes it, the legislature learns nothing. They can keep passing sloppy, overbroad laws because they know the courts will clean up their mess.

  By contrast, if the judge follows the text and rules against the hardware store (even if the prosecutor declines to punish), it creates political pressure. The headlines read: "LOCAL STORE CHARGED FOR SELLING BLEACH UNDER SCHOOL SAFETY LAW." The public gets angry. The legislature is forced to convene, admit their mistake, and pass a fix that excludes household cleaning supplies.

  This is messy. It's noisy. But it's how democracy is supposed to work. It forces the elected officials to take responsibility for the words they pass.

  ### The Principled Rule

  So, here is the rule: **Judges must enforce the text as written, even when it clashes with the apparent purpose, unless the text is genuinely ambiguous.**

  In the bleach case, the text is not ambiguous. "Hazardous substance" is defined by the list. The list has bleach. The distance is measured. There is no ambiguity to resolve. Therefore, the purpose cannot override the text.

  This rule protects us from the "living law" problem, where laws change meaning every time a new judge with a new ideology sits on the bench. If the law means what the purpose is, and judges decide the purpose, then the law changes every time we elect a new president who appoints new judges.

  If the law means what the text says, it is stable. Citizens can read the list. They can measure the distance. They know where they stand.

  ### Conclusion

  The hardware store owner shouldn't be punished. I agree with that. But punishing him is a problem for the prosecutor or the legislature, not the judge.

  If we allow judges to step in and save the store owner by rewriting the law, we gain a small victory for fairness in one case, but we lose a massive victory for stability in the system. We trade the rule of law for the rule of men.

  It is better to have a silly law that is honestly applied, which forces the people to fix it, than a smart law that is secretly rewritten by judges, which allows the people to ignore it. The text is the only thing we all share. The purpose is just a guess. Stick to the text.
