  5. The Closing Probe
  Closing Question: "If we change Player 1's payoff for Middle against Right from 1 to 2.5, does Middle still vanish? Why?"
  Why: It tests the inequality condition for mixed dominance without requiring full computation. It forces them to check the mix against the new payoff.
