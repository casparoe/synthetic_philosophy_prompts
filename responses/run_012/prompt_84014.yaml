pure strategy, only strictly by a mixed one. This distinction is the core lesson.

  4. The Misconception Map
  1. *Pure implies Mixed:* Outright false. Surface: When checking if Middle is dominated. Intervention: Explicitly ask "Is it dominated by Top? By Bottom?" Receive 'No'. Then ask "By a mix?" Receive 'Yes'. Consequence: If unchecked, they will assume mixed dominance is redundant and miss eliminative opportunities in complex games.
  2. *Uniform Random:* Outright false. Surface: When calculating the dominating mix. Intervention: Show that a 50/50 mix works, but a 10/90 mix might not. Emphasize optimization of weights. Consequence: They will test dominance only against uniform mixes, failing to find dominance where specific weights are required.
  3. *Order Matters:* True in this setting (Strict), false in nearby ones (Weak). Surface: When eliminating Right. Intervention: Clarify that for *strict* dominance, the final set is invariant, but the *visibility* of dominance depends on prior steps. Warn that for *weak* dominance, order changes the solution. Consequence: They will apply order-independence to weak dominance, leading to incorrect solutions in broader contexts.
  4. *Survivors = NE:* Outright false. Surface: When observing the residual 2x2 Matching Pennies. Intervention: Point out that no pure strategy profile in the survivors is a Nash equilibrium. Consequence: They will conflate rationalizability (survivors) with equilibrium stability, misunderstanding the predictive power of IEDS.
  5. *Rationality vs CKR:* Outright false. Surface: At the second elimination (Player 2's move). Intervention: Ask "Why does Player 2 know Player 1 won't play Middle?" Elicit that Player 2 must know Player 1 is rational *and* know that Player 1 knows Player 2 is rational. Consequence: They will assume rationality alone justifies iteration, failing to grasp the epistemic depth required for multi-step reasoning.
