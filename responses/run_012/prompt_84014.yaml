  1. The Opening Diagnosis
  Your students possess the technical machinery of expected utility and conditional probability, but they lack the strategic application of these tools to strategy spaces. They view dominance as a binary relation between pure strategies. The session must begin by destabilizing this view. Open by stating: "Rationality forbids playing dominated strategies, but 'dominated' is wider than you think." Immediately assert that pure-strategy dominance is often too coarse to capture rational prohibitions. The first task is to expand the definition of dominance to include mixed strategies without altering the underlying rationality assumption. Do not define Nash equilibrium yet; that is a destination, not a starting point. Focus entirely on the negative constraint: what a rational agent *cannot* play. This narrows the scope to eliminative reasoning rather than constructive equilibrium finding. Ensure they understand that if a strategy yields lower expected utility than a probabilistic combination of others, regardless of the opponent's move, it is irrational. This definition relies directly on their comfort with expected utility, bridging prior knowledge to the new topic. The opening must conclude by promising that this expanded definition allows us to solve games that pure dominance leaves indeterminate. This sets the stakes: mixed dominance is not a technicality, but a necessary tool for predictive precision.

  2. The Dependency Chain
  The pedagogical sequence must follow the logical dependencies of the solution concept strictly. First, define mixed-strategy dominance formally using expected utility. This depends on their prior knowledge of probability weights; if they cannot calculate expected payoffs against a column, they cannot verify dominance. Second, apply this definition to the carrying game to eliminate Player 1's middle row. This step depends on the definition; without it, the row appears safe because it is not pure-dominated. You must demonstrate that the inequality holds for all opponent columns. Third, assume Common Knowledge of Rationality (CKR). This is the crucial bridge to iteration. Without CKR, Player 2 cannot anticipate Player 1's elimination, and the process halts at round one. This depends on the first elimination being accepted as rational. Fourth, re-evaluate Player 2's strategies in the reduced game. This depends on the first elimination; the dominance of Player 2's right column is invisible in the full matrix because of the middle row payoffs. In the full game, the column is only weakly dominated; in the reduced game, it becomes strictly dominated. This distinction is vital. Fifth, eliminate the column and observe the residual 2x2 game. This depends on the second elimination. Finally, acknowledge the limit of the method. The sequence cannot skip the CKR justification between the first and second elimination. If you iterate before justifying CKR, students will view the second step as magic rather than inference. The carrying game enters immediately after the definition. Do not spend time on abstract proofs of existence; move straight to the matrix. The dependency chain is: Expected Utility -> Mixed Dominance Definition -> First Elimination -> CKR -> Second Elimination -> Residual Analysis. Each link must be secured before loading the next. If students stumble on the expected utility calculation, the definition of dominance fails. If they miss the CKR requirement, the iteration is unjustified. If they skip the residual analysis, they may believe IEDS always yields a unique solution. The order is rigid because each step provides the epistemic conditions for the next. Do not introduce Nash equilibrium until the end. This ensures they understand IEDS as rational exclusion rather than equilibrium selection. Work the example linearly on the board. Any deviation risks conflating rationality with equilibrium.

