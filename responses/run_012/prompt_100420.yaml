answer: |-
  # Graduate Qualifying Examination: Decision Theory
  **Time Allowed:** 90 Minutes
  **Format:** Closed-Book Essay

  ## Question: The Two-Envelope Paradox and Anthropics

  **Part I: The Naive Argument**
  Two envelopes contain positive amounts of money, $A$ and $B$, where one contains exactly twice the amount of the other. You choose an envelope at random but do not open it. Let $X$ be the amount in your chosen envelope and $Y$ be the amount in the other.
  (a) State the symmetry argument for why indifference is the rational stance.
  (b) The naive switching argument claims $E[Y] = \frac{1}{2}(2X) + \frac{1}{2}(\frac{X}{2}) = \frac{5}{4}X$, implying you should switch. Identify the precise mathematical error in this computation. Do not merely cite the absence of a uniform prior; explain why the algebraic manipulation is invalid regarding the random variable $X$.

  **Part II: A Specified Prior**
  Suppose the amounts are generated as follows: Let $K$ be a geometric random variable on $\{0, 1, 2, \dots\}$ with $P(K=k) = (1-q)q^k$ for $0 < q < 1$. The envelopes contain $2^K$ and $2^{K+1}$. You open your envelope and observe $x = 2^k$ (for $k \ge 1$).
  (a) Compute the posterior probability that the other envelope contains $2x$.
  (b) Determine the expected value of the other envelope as a function of $q$ and $x$. For what values of $q$ is switching favourable?
  (c) Calculate the expected value of the base amount $2^K$. State and justify the general principle relating the favourability of switching for all $x$ to the convergence of this expectation.

  **Part III: Diagnosis and Analogy**
  (a) Is the two-envelope problem solely a hazard of reasoning with divergent expected values?
  (b) Compare this structure to self-location reasoning (e.g., the Self-Indication Assumption). State clearly where the analogy holds regarding the treatment of "larger totals" and where it fails regarding the resolution of the paradox.

  ***

  ## Model Answer

  **Part I**
  By symmetry, the distribution of amounts in the chosen envelope is identical to that of the other envelope before observation. Since the labels "chosen" and "other" are arbitrary, $E[X] = E[Y]$. Thus, there is no expected gain from switching.

  The naive error lies in treating $X$ as a fixed constant across the two terms of the expectation. In the term $\frac{1}{2}(2X)$, $X$ represents the smaller amount of the pair. In $\frac{1}{2}(\frac{X}{2})$, $X$ represents the larger amount. These are distinct realizations of the random variable. One cannot sum expectations conditioned on disjoint events (being the smaller vs. larger envelope) while holding the observed value $X$ constant, unless the conditional probability of being in either case is independent of $X$, which implies an impossible flat prior over positive reals.

  **Part II**
  (a) Let $S$ be the event our envelope is the smaller amount ($2^K$) and $L$ be the event it is the larger ($2^{K+1}$). We observe $x=2^k$.
  $P(S | x) \propto P(x | S)P(S) = 1 \cdot P(K=k) = (1-q)q^k$.
  $P(L | x) \propto P(x | L)P(S) = 1 \cdot P(K=k-1) = (1-q)q^{k-1}$.
  The ratio is $q^k : q^{k-1} = q : 1$. Normalizing, $P(\text{other}=2x | x) = P(S|x) = \frac{q}{1+q}$.

  (b) The other envelope holds $2x$ with prob $\frac{q}{1+q}$ and $x/2$ with prob $\frac{1}{1+q}$.
  $E[Y|x] = \frac{q}{1+q}(2x) + \frac{1}{1+q}(\frac{x}{2}) = x \left( \frac{4q + 1}{2(1+q)} \right)$.
  Switching is favourable if $E[Y|x] > x \iff 4q + 1 > 2 + 2q \iff 2q > 1 \iff q > 1/2$.

  (c) $E[2^K] = \sum_{k=0}^\infty 2^k (1-q)q^k = (1-q) \sum (2q)^k$. This geometric series converges only if $2q < 1 \iff q < 1/2$.
  **Principle:** A prior supports switching for every observed amount $x$ if and only if the prior expectation of the amounts diverges. If the mean is finite, Bayesian updating on $x$ must eventually assign sufficient probability to $x$ being the larger amount (the "tail" of the prior decays fast enough) to dissuade switching for large $x$. Infinite mean priors decay too slowly to ever penalize the "larger total" hypothesis sufficiently.

  **Part III**
  (a) Yes, fundamentally. When expectations diverge, standard dominance reasoning fails because the "gain" from switching in the infinite tail outweighs finite losses. The paradox dissolves once priors with finite means are enforced.

  (b) **Analogy Holds:** Both problems involve indexical uncertainty where the agent treats their position (which envelope / which observer) as a random draw. In the Self-Indication Assumption (SIA), observing "I exist" updates probability toward hypotheses with more observers, just as observing $x$ in the divergent TEP case leaves enough probability mass on "larger total money" hypotheses to justify switching. Both rely on priors over totals (population/wealth) that do not penalize bigness sufficiently.
  **Analogy Fails:** The TEP is resolved normatively by demanding finite expectations for decision-making; the "paradox" is a calculation error. Anthropics (Doomsday/SIA) lacks a consensus resolution. The reference class of "observers" is ontologically contested, whereas the envelope contents are well-defined. TEP is a warning about improper priors; SIA is a substantive claim about how existence evidence updates credence.

  ***

  ## Marking Scheme (Total: 25 Marks)

  | Point | Criteria | Marks | Typical Error / B vs. A Distinction |
  | :--- | :--- | :--- | :--- |
  | **1** | **Part I: Symmetry & Error ID** | 5 | **B:** States "no uniform prior" vaguely. <br> **A:** Identifies $X$ changes meaning (smaller vs. larger) across the sum; explains that conditioning on $X=x$ changes the probability of the case. |
  | **2** | **Part II(a): Posterior Calculation** | 5 | **B:** Assumes 50/50 probability persists after seeing $x$. <br> **A:** Correctly applies Bayes' rule using the geometric prior weights ($q^k$ vs $q^{k-1}$) to derive $q/(1+q)$. |
  | **3** | **Part II(b): EV & Threshold** | 5 | **B:** Arithmetic errors in EV sum or fails to isolate $q$. <br> **A:** Cleanly derives $E[Y] > x \iff q > 1/2$. Shows the threshold explicitly. |
  | **4** | **Part II(c): Divergence Principle** | 5 | **B:** Notes $E[B]$ diverges but doesn't link it to the switching condition. <br> **A:** Explicitly connects $q > 1/2$ to the divergence of $\sum (2q)^k$ and articulates the principle: finite mean forces posterior to favor "larger" case for high $x$. |
  | **5** | **Part III: Analogy & Limit** | 5 | **B:** Vague hand-waving about "infinity." <br> **A:** Distinguishes the structural similarity (indexical update favoring larger totals) from the normative difference (TEP is a prior error; Anthropics is an ontological debate). |

  **Grading Notes:**
  *   **A Script (20-25):** Mathematically precise in Part II; articulates the "finite mean" principle as a necessary condition for rationality in Part II(c); draws a sharp, nuanced distinction in Part III.
  *   **B Script (12-19):** Gets the math mostly right but relies on slogans ("infinite mean bad") in Part II(c); treats the anthropic analogy as an identity rather than a structural comparison in Part III.
  *   **Fail (<12):** Fails to compute the posterior in Part II; claims switching is always rational; or misses the distinction between the variable $X$ in Part I.
