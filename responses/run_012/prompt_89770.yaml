answer: |-
  Your tentative principle is a version of **verificationism**: it ties the meaningfulness of a theoretical disagreement (rivalry) to a difference in possible observations. Your intuition in case (iii), however, is a version of **scientific realism**: it allows that two theories can disagree about the nature of reality even if they agree on all possible observations.

  You cannot keep the verificationist principle and the realist verdict on (iii). To repair the principle, you must decouple "rivalry" from "observational difference."

  ### 1. Repairing the Principle
  **The Ontological Criterion:**
  The evidence underdetermines a choice between two theories when they are **empirically equivalent** (agree on all actual and possible observations) but **ontologically distinct** (posit different structures, entities, or causal mechanisms). They are genuine rivals if their ontological commitments differ, regardless of whether those differences yield observational consequences.

  This repair saves (iii). The two cosmologies differ on the ontology of the universe (sealed regions exist vs. do not exist), making them genuine rivals, even though the difference is observationally inaccessible.

  This repair also clarifies (i) and (vi). In (i), if the swap is purely systematic and symmetric, there is no ontological difference, only a notational one. In (vi), if one quantity is defined from the other, they are mathematically equivalent descriptions of the same ontology. Under the repaired principle, **(i) and (vi) are not cases of underdetermination at all; they are cases of theoretical equivalence.** There is no choice to be made because there is only one theory. Your suspicion in (i) was correct.

  ### 2. Resolving the Tension between (ii) and (v)
  You correctly identify (ii) and (v) as the unstable points.
  *   In **(ii)** (Gratuitous Entity), you say you are "not free to choose." This implies that while the *evidence* underdetermines the choice, **theoretical virtues** (specifically Ockham's Razor) determine the rational choice. The leaner theory is objectively preferable.
  *   In **(v)** (Instrument Reliability), you say the choice is "underdetermined," yet acknowledge it bears on how evidence moves you.

  **The Conflict:** If theoretical virtues (like simplicity) resolve the underdetermination in (ii) by mandating a choice, why do they not resolve (v)? In (v), the theory that "instruments are misleading" is vastly less simple and coherent than the theory that "instruments are reliable." It posits a complex conspiracy of nature without explanatory gain.

  **The Verdict to Give Up:**
  The best account forces you to give up the verdict on **(v)**.
  You should not classify the skeptical hypothesis in (v) as a case of scientific underdetermination. It is a **skeptical scenario**, not a scientific rival. A theory that systematically undermines the reliability of the very evidence used to support it severs the link between theory and world. It is not "underdetermined" in the scientific sense; it is **unconfirmable**. Rationality does not leave this choice open; the Principle of Coherence (or the necessity of assuming some evidence is veridical to do science at all) mandates rejecting the skeptical theory. You are no more "free" to choose the skeptical theory in (v) than you are to choose the gratuitous entity in (ii). In both cases, non-evidential virtues close the gap.

  ### 3. Prediction for a New Case
  **Case:** Two interpretations of Quantum Mechanics (e.g., Bohmian Mechanics vs. Many-Worlds) that agree on all statistical predictions for any experiment but disagree on whether the wavefunction is a real physical field or a tool for calculating probabilities, and whether there are hidden particles or branching universes.

  **Prediction:** Under your old principle, this is not a genuine rivalry (no observational difference). Under the **repaired Ontological Criterion**, this **is** a genuine case of underdetermination and genuine rivalry. The theories posit distinct ontologies (particles + pilot wave vs. branching universal wavefunction). The choice is evidentially underdetermined, but rationally constrained by virtues like parsimony and clarity. You should judge this exactly like case (iii), not case (i).

  ### 4. What Would Change My Mind
  I would revise this account if a compelling argument were made for **Structural Realism** or **Instrumentalism** that successfully reduces ontology to predictive structure.
  Specifically, if it could be demonstrated that **explanatory power supervenes entirely on predictive power**—that is, if positing "real" unobservable structures adds nothing to our understanding beyond organizing observations—then the Ontological Criterion would collapse back into your original Verificationist Principle.

  If you could show that the difference in (iii) (sealed regions) makes no difference to the *explanation* of the observable world (e.g., if the sealed regions play no role in the causal history of our region), then I would concede that (iii) is not a genuine scientific rivalry, but a metaphysical pseudo-question. This would force me to drop the verdict on (iii) rather than repair the principle. However, as long as we believe science aims to describe *what exists* and not just *what appears*, the Ontological Criterion holds.
