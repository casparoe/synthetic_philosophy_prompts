answer: |-
  Here is the breakdown of the machinery you're dealing with, followed by the predictions and the diagnostic test.

  ### 1. The Candidate Rules

  Based on Rosie's four prior rulings, she is clearly an externalist, but "externalism" is a umbrella term for at least three distinct mechanisms. In her first four cases, these mechanisms coincided, which is why you couldn't distinguish them. In the Kestrel case, they diverge.

  *   **Rule A: Microphysical Environmentalism.** (Derived from Ruling 1).
      *   *The Gist:* Meaning is fixed by the actual physical nature of the stuff in the speaker's immediate environment.
      *   *The Trigger:* If the underlying element is different, the meaning is different, regardless of what people think or say.
      *   *Prediction for Kestrel:* Nadia means the **Local Metal**. Her statement is **True** (the local metal does corrode faster).

  *   **Rule B: Social Deference (Division of Linguistic Labor).** (Derived from Ruling 2).
      *   *The Gist:* Meaning is fixed by the experts the speaker is disposed to defer to. The speaker "borrows" the reference from the community's authorities.
      *   *The Trigger:* If the experts say it's X, it's X, even if the speaker can't tell the difference.
      *   *Prediction for Kestrel:* Nadia defers to the Earth Lab. The Lab says "That is not Iron." Therefore, Nadia means **Earth Iron** (and is mistakenly applying the word). Her statement is **False** (or she is speaking falsely when she calls the local stuff "iron").

  *   **Rule C: Causal-Historical Chain.** (Derived from Rulings 3 & 4).
      *   *The Gist:* Meaning is fixed by the original "baptism" of the term and the chain of transmission through history.
      *   *The Trigger:* If the word was passed down from a source that meant Iron, it means Iron, even if the speaker has false beliefs or no direct contact.
      *   *Prediction for Kestrel:* The word "Iron" was brought from Earth. The chain traces back to Earth Iron. Nadia means **Earth Iron**. Her statement is **False**.

  *Note:* In the Kestrel 20-year case, Rule B and Rule C point the same way (Earth Iron), while Rule A points the other way (Local Metal). In the 200-year case, Rule A and Rule B (local experts) align against Rule C (Earth history).

  ### 2. Verdict on Nadia (20-Year Settlement)

  **Prediction:** Rosie will rule that Nadia means **Earth Iron**, and her statement is **False** (or strictly speaking, she is making a category mistake).

  **Reasoning:**
  While Ruling 1 (Twin Earth) makes it look like Rosie is a pure Environmentalist (Rule A), that ruling hinged on the communities having *no contact*. In the Kestrel 20-year case, the channel to Earth is open. This activates Ruling 2 (Deference).

  Rosie's logic likely runs like this: Reference is not just about what you touch; it's about what you are answerable to. Nadia knows the Lab exists. She knows they analyze the metal. She knows they have a different name for it. By continuing to use "Iron" despite the Lab's correction, she is not successfully shifting the reference of the word; she is simply making a mistake, similar to someone pointing at a whale and saying "That's a big fish."

  The fact that she has handled the local metal for twenty years (which might tempt an Environmentalist reading) is overridden by the fact that she acknowledges the authority of the Earth Lab. She is part of the Earth linguistic community, just a distant branch. As long as the "phone line" is open, the Earth experts fix the reference. The local metal is just "stuff they mistakenly call iron."

  **Confidence Level:** High. This preserves the intuition from Ruling 2 (experts fix reference) without abandoning Ruling 3 (false beliefs don't change reference). It treats the settlers' usage as a widespread error rather than a semantic shift.

  ### 3. Verdict on the 200-Year Isolation Case

  **Prediction:** Rosie will rule that "Iron" now means the **Local Metal**, and the equivalent statement is **True**.

  **Reasoning:**
  This change in verdict is crucial. It reveals that Rosie is not a dogmatic Causal-Historical theorist (Rule C). If she were, the historical chain from Earth would never break, and "Iron" would mean Earth Iron forever, even after two centuries of isolation.

  By switching her verdict here, she shows that the Causal Chain can be severed or overtaken. Once the radio silence hits, the Deference target (Rule B) shifts from Earth Lab to Local Metallurgists. Once the community is causally isolated, the Microphysical Environment (Rule A) takes over as the primary reference fixer.

  This mirrors Ruling 1 (Twin Earth) exactly. Two centuries of independent development makes Kestrel a "Twin Earth" relative to Earth. The word "Iron" has undergone a semantic shift because the community is now autonomous. The history from Earth is now like the history of a word in a dead language; it informs the etymology, but not the current meaning.

  **What this tells you:** Rosie treats **Communication/Deference** as the glue that holds reference to a historical source. When communication breaks, **Environment** takes over. She is a hybrid theorist: Deference trumps Environment when contact exists; Environment trumps History when contact is lost.

  ### 4. The Diagnostic Case

  You now know how she weighs Environment against History/Deference (Contact is the switch). To fully pin her down, you need to separate **Deference** from **History**. In all cases so far, the experts the speaker defers to are also the ones holding the historical chain. You need a case where the speaker defers to experts who are *wrong* about the historical chain.

  **Propose "The Case of the Corrupt Assayer":**

  *   **The Setup:** A prospector in the 1890s finds a yellow metal. He learned the word "Gold" from his father (Causal Chain = Real Gold). He is surrounded by Real Gold (Environment = Real Gold).
  *   **The Twist:** He takes it to the town Assayer to be certified. The Assayer is a fraud. He has secretly replaced the standard weights. He tells the prospector, "This isn't Gold; Gold is actually this other shiny white metal (Platinum)." The Assayer is the recognized local expert.
  *   **The Usage:** The prospector defers to the Assayer. He points to the yellow metal and says, "This is not Gold," and points to the white metal and says, "That is Gold."
  *   **The Question:** When the prospector says "Gold," does he mean the yellow metal (History/Environment) or the white metal (Deference)?

  **Why this settles it:**
