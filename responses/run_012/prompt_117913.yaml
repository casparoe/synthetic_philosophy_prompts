answer: |-
  ### The Conceptual Issue: Analyticity and the Thermodynamic Limit

  The central tension in the philosophy of phase transitions arises from a conflict between the mathematical definition of a transition and the physical reality of the systems undergoing them. In classical thermodynamics, a phase transition is characterised by a non-analyticity in a thermodynamic potential, such as the free energy. This manifests physically as a discontinuity in an order parameter (like magnetisation or density) or a divergence in a response function (like susceptibility or heat capacity).

  However, in statistical mechanics, thermodynamic quantities are derived from the partition function, $Z$. For any system with a finite number of degrees of freedom (finite $N$) and finite volume ($V$), $Z$ is a finite sum of analytic functions (exponentials of the energy states). A fundamental theorem of analysis dictates that a finite sum of analytic functions is itself analytic. Consequently, the free energy derived from a finite partition function is smooth; it possesses derivatives of all orders. Strictly speaking, a finite system cannot exhibit a genuine phase transition as defined by thermodynamics. It can only exhibit a rapid, smooth crossover.

  Since all physical systems are finite (the universe itself may be, and certainly any beaker of water is), we face a trilemma: either phase transitions are not real features of the world, the standard identification of transitions with singularities is mistaken, or the term 'phase transition' refers strictly to a property of the infinite-volume limit.

  **The Role of the Thermodynamic Limit**
  To recover the singularities required for the standard definition, one must take the thermodynamic limit: $N \to \infty$ and $V \to \infty$, while holding the density $\rho = N/V$ constant. The appeal to this limit is not merely a calculational convenience to simplify sums into integrals; it is an *essential idealisation*. Without it, the phenomenon (the singularity) literally vanishes. This distinguishes it from a "harmless" idealisation, such as modelling a billiard ball as a point mass, where the idealisation can be removed without the phenomenon disappearing.

  It is crucial that the limit is taken at fixed density. If one were to let $V \to \infty$ while $N$ remained fixed, the density would tend to zero. The system would become an ideal gas, and the inter-particle interactions necessary for cooperative phenomena (like ordering or condensation) would vanish. Fixed density ensures that the local interaction environment remains macroscopic and relevant, allowing long-range correlations to develop across the infinite lattice, which is the mechanism that permits non-analyticity.

  **Renormalisation Group and Universality**
  The Renormalisation Group (RG) provides a powerful explanation for *universality*—the fact that disparate systems (e.g., fluids and magnets) exhibit identical critical exponents near a transition. The RG account locates this universality in the existence of fixed points in the flow of Hamiltonians under scale transformations. Systems flow towards the same fixed point, washing out microscopic details.

  However, fixed points strictly exist only in the infinite-volume limit. In a finite system, the RG flow cannot continue indefinitely; it must terminate when the correlation length approaches the system size. Consequently, a strict finitist—someone who refuses to treat the infinite limit as anything more than a calculational tool—faces a significant explanatory deficit. Without the limit, there are no fixed points, only regions of slow flow. While a finitist can describe the *scaling behaviour* of finite systems, the robust *explanation* of why microscopic details become irrelevant relies on the attractor structure of the infinite limit. To treat the limit as merely convenient is to undermine the structural explanation of universality provided by the RG.

  ### Applying the Distinction: Asymptotic vs. Pointwise Emergence

  You propose a distinction between two types of emergence:
  1.  **Asymptotically Emergent:** A property had by the limit of a sequence of systems but by no member of the sequence.
  2.  **Pointwise Emergent:** A property had by each member of the sequence but not derivable from the lower-level description of that member taken on its own.

  **The Boiling of Water and Susceptibility Divergence**
  Where does the boiling of a beaker of water fall? We must distinguish between the *physical phenomenon* of boiling (rapid change in density/energy) and the *mathematical feature* of the phase transition (the singularity).

  The **divergence of the susceptibility** is **Asymptotically Emergent**. It is a property of the thermodynamic limit ($N=\infty$). No finite member of the sequence (no finite beaker of water) possesses a true divergence; they possess only finite peaks. The singularity exists only at the limit point, not in the sequence leading up to it.

  The **boiling of the water** (the macroscopic physical process) is **not Asymptotically Emergent**, because it occurs in the finite beaker. Is it **Pointwise Emergent**? This depends on one's stance on reductionism. If one holds that statistical mechanics successfully reduces thermodynamics to microscopic mechanics, then boiling is derivable from the lower-level description (in principle), and thus it is **neither** asymptotically nor pointwise emergent. However, if one holds that thermodynamics is autonomous—that the macroscopic description captures causal powers or organisational features not capturable by the micro-description alone—then boiling would be **Pointwise Emergent**. Given the context of statistical mechanics, the standard view is that boiling is reducible in principle but practically autonomous; however, strictly speaking, under your definition, it is the *singularity* that is the candidate for asymptotic emergence, not the boiling itself.

  **Finite Near-Universality**
  If universality is defined by fixed points which only exist in the limit, what is a finite system's near-universal behaviour an approximation to? It is an approximation to the **flow within the basin of attraction** of that fixed point. A finite system behaves universally because its parameters place it on a trajectory that passes sufficiently close to the fixed point before the finite size cuts off the flow. The finite system approximates the *scaling relations* dictated by the fixed point, even if it never reaches the point itself.

  ### Metaphysical Emergence and Realism

  **Which Notion Matters for Metaphysics?**
  If one wants emergence to be a metaphysical thesis about the world rather than a fact about our models, **Pointwise Emergence** is the only viable candidate.

  Asymptotic emergence relies on the existence of the limit system. If the world is finite (as all evidence suggests), then the limit system does not exist. A property that exists only in a non-existent system cannot be a real feature of the world. To claim that phase transitions are real based on asymptotic emergence is to commit to a form of Platonism where mathematical idealisations have ontological priority over physical reality.

  Pointwise emergence, conversely, attributes the property to the actual finite systems. If boiling is pointwise emergent, then real beakers of water possess emergent properties. This aligns with a metaphysical realism that seeks to describe the actual structure of the world, not the structure of our limiting models.

  **Realism About Phase Transitions: Strongest and Weakest Cases**
  The case for realism about phase transitions is **strongest** on explanatory and phenomenological grounds. The singularity, though mathematically idealised, captures a physical reality: the divergence of the correlation length. In a real finite system, the correlation length grows until it is limited by the system size. The infinite limit correctly predicts that the behaviour becomes independent of microscopic details and system size up to that cutoff. The idealisation is "dangerous" but indispensable for explaining the *sharpness* and *stability* of the transition we observe.

  The case is **weakest** on strict ontological grounds. If realism requires a one-to-one correspondence between theoretical posits and physical entities, phase transitions (as singularities) fail. There are no infinite systems, and there are no literal discontinuities in the energy of finite matter. A strict realist must either redefine phase transitions for finite systems (e.g., via Lee-Yang zeros or specific rounding scales) or accept that our best theory describes a world that is, in this specific regard, strictly false. The tension remains between the undeniable reality of the phenomenon and the mathematical impossibility of its standard definition within a finite ontology.
