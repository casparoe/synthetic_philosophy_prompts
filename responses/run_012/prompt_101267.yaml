prompt: |-
  ok so I'm trying to actually get my head around the aggregation problem for Scanlon-style contractualism and I keep getting lost in the standard back-and-forth. before I read any more defenses of it, I want the spec first: write me the desiderata that any adequate contractualist account of aggregation has to meet.

  you know the setup - an act is wrong if it'd be ruled out by principles no one could reasonably reject, and the unit of moral complaint is the individual person, not the group. the worry is that this makes it impossible for numbers to ever count, so you end up with the result that it's just as wrong to save one person from drowning as to save a hundred. fine. so:

  - what cases does the account absolutely have to get right? (the pure numbers case, ties, cases where the harms differ in kind and not just in size, cases where many suffer only mild stuff vs one suffers something awful, cases about distributing a scarce good rather than saving lives, cases where all the complaints come from the same person...)
  - what distinctions can't be collapsed? (say, between "more people have a complaint" and "the total complaint is bigger", or between what's permissible to do and what's required, or between rejecting a principle and rejecting an outcome)
  - what is it not allowed to contradict - any intuition we'd treat as near-certain, and the basic idea that individuals are the site of justification in the first place?

  and here's the bit I actually care about: flag which of these desiderata can't be satisfied together. my hunch is there's a real tension between "the justification has to be addressed to each person individually / no one's claim gets swallowed by the group" and "the account must sometimes let the greater number win" - tell me if that's right, and if so what exactly has to give. also say which single requirement does the most work in ruling out the obvious fix, which I assume is just add up the complaints.

  one more thing I want folded in: assume the account has to be usable by an actual person deciding in real time, like a triage nurse with 30 seconds - so it can't require some idealised infinite comparison of every pairwise complaint. is that a legit desideratum or am I smuggling in something foreign? say so, don't just recieve it.

  don't give me a scorecard of who wins, I'll do that myself. just the list with the case behind each, and your verdict on the unsatisfiable subset.
