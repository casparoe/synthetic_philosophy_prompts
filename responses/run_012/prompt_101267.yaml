answer: |-
  Here is the specification you asked for. It breaks down the normative constraints, the case-based intuitions, and the structural limits of the theory, followed by the verdict on the incompatibilities.

  ### I. The Desiderata Specification

  Any adequate contractualist account of aggregation must satisfy the following constraints. I have grouped them by **Verdictive Output** (what the theory says to do), **Justificatory Structure** (how the theory explains it), and **Procedural Feasibility** (how the theory is applied).

  #### A. Verdictive Output (The Cases)
  1.  **The Pure Numbers Intuition:** In cases where the harm is identical in kind and severity (e.g., death vs. death), the account must verdict that it is wrong to save the one rather than the many.
      *   *Case:* Lifeboat (1 vs 100).
      *   *Requirement:* **Aggregative Sensitivity.**
  2.  **The Severity Trumping Intuition:** The account must verdict that a severe harm to one person outweighs mild harms to any number of others.
      *   *Case:* Death vs. Headaches (1 death vs. 1,000,000 headaches).
      *   *Requirement:* **Non-Linear Weighting.**
  3.  **The Symmetry Intuition:** Where claims are identical in number and severity, the account must not privilege one side arbitrarily.
      *   *Case:* Ties (1 vs 1).
      *   *Requirement:* **Impartiality.**
  4.  **The Intra-Personal Aggregation Intuition:** Multiple burdens on a single individual must count for more than a single burden on that same individual.
      *   *Case:* Same Person (One person loses a leg and an arm vs. one person loses a leg).
      *   *Requirement:* **Intra-personal Summation.**
  5.  **The Deontic Distinction:** The account must distinguish between what is *wrong* (ruled out) and what is *supererogatory* (permissible but not required). It must be able to say saving the many is *required*, not just *allowed*.
      *   *Case:* Obligation (Must I save the 100?).
      *   *Requirement:* **Deontic Force.**

  #### B. Justificatory Structure (The Logic)
  6.  **The Individual Standpoint Constraint:** Justification must be addressable to each individual person. You cannot justify a loss to Person A by appealing to a "social total" or a "group good" that Person A does not share.
      *   *Case:* The Loser's Question ("Why me?").
      *   *Requirement:* **Reciprocity.**
  7.  **The Complaint-Based Metric:** The strength of a rejection is determined by the burden imposed on the individual, not by the utility lost.
      *   *Case:* Preference Satisfaction vs. Burden (I want a yacht vs. You need bread).
      *   *Requirement:* **Burden-Sensitivity.**
  8.  **The No-Summation Rule:** You cannot justify an act to Person A by summing the complaints of Persons B through Z and comparing the total to A's complaint.
      *   *Case:* The Utilitarian Swap.
      *   *Requirement:* **Separateness of Persons.**

  #### C. Procedural Feasibility (The Application)
  9.  **The Triage Constraint:** The principle generated must be applicable by a moral agent under epistemic and temporal constraints without requiring infinite pairwise comparisons.
      *   *Case:* The Triage Nurse (30 seconds to decide).
      *   *Requirement:* **Action-Guiding Feasibility.**

  ---

  ### II. The Verdict on Incompatibilities

  Your hunch is correct, but it needs to be sharpened. It is not simply a tension between "Individual Justification" and "Numbers Count." It is a **trilemma**. You cannot satisfy the following three desiderata simultaneously:

  1.  **Aggregative Sensitivity** (Desideratum A.1: The many win in pure numbers cases).
  2.  **Reciprocity** (Desideratum B.6: Justification must be addressable to the individual loser).
  3.  **Separateness of Persons** (Desideratum B.8: No summing of complaints across persons).

  **The Conflict:**
  If you adhere to **Reciprocity** and **Separateness**, you are restricted to pairwise comparisons (My complaint vs. Your complaint). In a 1 vs. 100 case, the single loser compares their complaint (death) against the complaint of any *single* member of the group (death). The complaints are identical. Therefore, the principle cannot be reasonably rejected by the one any more than by the many. This violates **Aggregative Sensitivity**.

  To satisfy **Aggregative Sensitivity** while keeping **Reciprocity**, you must find a way for the *presence* of the other 99 people to strengthen the complaint of the 100th person *without* summing their utilities (which would violate **Separateness**). Most contractualists try to do this via "relevant groups" or "probabilistic agreement," but these often collapse into one of the other horns.

  **What has to give?**
  *   **Option 1 (The Utilitarian Slide):** Give up **Separateness of Persons**. Allow summation. You satisfy Aggregation and Reciprocity (sort of), but you are no longer doing contractualism; you are doing utilitarianism with extra steps.
  *   **Option 2 (The Hardline Contractualist):** Give up **Aggregative Sensitivity**. Accept that in pure numbers cases, you must flip a coin. You keep the pure individual justification, but you violate the strong intuition that saving 100 is strictly required over saving 1.
  *   **Option 3 (The Hybrid):** Give up strict **Reciprocity**. Allow that the justification to the loser appeals to a "group claim" they don't individually hold. This preserves the verdict but weakens the core contractualist idea that justification is owed *to each*.

  ### III. The "Obvious Fix" Blocker

  You asked which single requirement rules out the obvious fix (just add up the complaints).

  **It is Desideratum B.6: The Individual Standpoint Constraint (Reciprocity).**

  Simple summation (Utilitarianism) satisfies Aggregation and Feasibility easily. It fails because it violates the core contractualist insight that morality is about what we owe *to each other*. If you tell the person you let die, "You died because the sum of their preferences was greater than yours," you have not offered them a justification they could accept as a free and equal rational being; you have treated them as a vessel of value to be weighed. Contractualism demands that the reason given to the loser must be a reason *for them*, not a reason *about the group*. Summation makes the group the site of justification, not the individual.

  ### IV. The Triage Nurse Constraint

  Is Desideratum C.9 (Action-Guiding Feasibility) legitimate, or are you smuggling something in?

  **Verdict: It is legitimate, but it is a secondary constraint.**

  Scanlon distinguishes between the **theory of wrongness** (what makes the act wrong) and the **decision procedure** (how we figure it out). Strictly speaking, a principle could be true even if it takes a supercomputer to calculate.

  *However*, for contractualism specifically, this constraint is tighter than for other theories. Because contractualism relies on "reasonable rejectability," the principles must be ones that people could actually agree to in a hypothetical situation. If a principle is so computationally complex that no human could ever know if they were complying with it, it fails the test of being a principle for "general acceptance."

  Therefore, you are not smuggling in foreign utilitarian "efficiency" metrics. You are enforcing the **publicity condition** inherent to contractualism. If the aggregation rule requires the triage nurse to perform infinite pairwise comparisons of complaints to know what is permissible, the principle is not "reasonably rejectable"—it is **unusable**, and an unusable principle cannot be the basis of mutual recognition.

  **The Catch:** This constraint puts pressure on the solution to the trilemma. Any solution that requires the agent to calculate the "strength of group complaints" without summing utilities risks violating the Triage Constraint. If the only way to save the many without summing is to run a complex algorithm of "weighted pairwise comparisons," you satisfy the moral theory but fail the nurse.

  ### Summary of the Spec
  *   **Must Verdict:** Save the many in identical harm cases; Save the one in severe vs. mild cases.
  *   **Must Justify:** To the individual loser, without summing the winners' utility.
  *   **Must Allow:** Human application in real time.
  *   **Impossible Triad:** Individual Justification + Numbers Count + No Summation.
  *   **Blocker of Utilitarianism:** The Individual Standpoint Constraint.
  *   **Triage Constraint:** Legitimate as a condition of "reasonable agreement," not just efficiency.
