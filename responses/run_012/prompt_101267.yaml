  *(Self-Correction during drafting)*: I need to be precise about the "Unsatisfiable Subset." It's not just "Individual vs Numbers." It's "Individual Justification + Numbers Count + No Aggregation of Value." If you allow Aggregation of Value, you get Utilitarianism. If you deny Numbers Count, you get the "One vs Many" absurdity. If you deny Individual Justification, you stop being a contractualist. So the triad is the problem.

