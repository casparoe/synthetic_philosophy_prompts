      *   *Refining the "Individual" desideratum:* It's the "Standpoint Constraint."
      *   *Refining the Triage point:* Call it "Action-Guiding Feasibility." Note that Scanlon might reject this as a condition for *truth*, but accept it for *application*. I should side with the user that it's a legitimate constraint for a *usable* moral theory, even if not for a metaphysical one.
      *   *The "Unsolvable" Core:* The tension is between the *structure* of justification (pairwise) and the *content* of the verdict (aggregative).
      *   *Wait, one nuance:* Scanlon's later work (e.g., *What We Owe to Each Other* vs. later papers on aggregation) tries to solve this via "relevant groups" or "probabilistic" accounts. I shouldn't detail those solutions, but I must ensure the desiderata don't accidentally presuppose one solution.
      *   *Key Insight:* The user asks "what single requirement does the most work in ruling out the obvious fix." That is definitely the **Individual Standpoint Constraint**. Utilitarianism sums. Contractualism forbids summing across persons for the sake of justification *to* the loser.

  9.  **Final Review against Constraints:**
