  I draft the clause beneath the fluorescent light,
  Where power settles on the quiet ground,
  Then walk home through the voting night.

  Here two distinct rhythms make their sound,
  One counts the years where powers are traced,
  One counts the days until the votes are bound.

  The higher clock moves to find a resting place,
  By slow accretion of a distant time,
  While national hearts run quick and frantic race.

  No gear connects the minute to that time,
  One proves its worth by what it can ensure,
  The other asks who gave the right to climb.

  I serve the rule that opens every door,
  Yet feel the pulse beneath the voting seat,
  And cannot tell which loyalty is more.

  My heart divides upon the heated seat,
  Loyal to the text that stays forever cold,
  And to the people whose demands I meet.

  I stand between the new and what is old,
  Watching the gears grind out a distinct strain,
  Belonging to a clock I cannot hold.
