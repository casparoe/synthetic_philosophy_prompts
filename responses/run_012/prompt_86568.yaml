  # The Consciousness Methods Decision Tree

  **ROOT:** Start by accepting or rejecting this claim: *"A science of consciousness should rest on data that are, in principle, available to more than one observer, and should not presuppose either that phenomenal experience exists or that it does not."*

  *   **REJECT (Private data is valid):** **[EXIT TREE]** → **Leaf 1: Phenomenology**
      *   *Awkward Commitment:* Scientific data becomes essentially private and unshareable between observers.
  *   **REJECT (Neutrality is impossible):** **[EXIT TREE]** → **Leaf 2: Illusionism or Non-Reductive Realism**
      *   *Awkward Commitment:* Metaphysics must be solved before any empirical data collection can begin.
  *   **ACCEPT:** Proceed to Node 1.

  ---

  **NODE 1 (Report Status):** Consider a **machine that emits fluent first-person reports** ("I am sad"). How do you treat this output?
  *   **A fiction the theorist constructs for predictive convenience:** → **Leaf 3: Instrumentalism**
      *   *Awkward Commitment:* Truth about consciousness is irrelevant; only predictive utility matters.
  *   **One more piece of behaviour to be explained:** → Proceed to Node 2.
  *   **A window onto experience (potentially):** → Proceed to Node 3.

  **NODE 2 (First-Person Access):** Consider a **person who confabulates a reason for a choice** they demonstrably did not make. Is introspective access:
  *   **A confabulating process that cannot be calibrated:** → **Leaf 4: Heterophenomenology**
      *   *Awkward Commitment:* The subject is an informant, not an authority, even on their own mind.
  *   **A trainable, cross-checkable skill:** → **Leaf 5: Operationalism**
      *   *Awkward Commitment:* Consciousness is identical to the procedure used to measure it.

  **NODE 3 (Non-Report Evidence):** Consider a **patient who shows command-following neural responses but produces no report**. Does this non-report evidence bear on:
  *   **Experience itself:** → Proceed to Node 4.
  *   **Only the capacity to report:** → Proceed to Node 5.
  *   **Nothing (data is noise):** → **Leaf 6: Data Nihilism (Unnamed)**
      *   *Awkward Commitment:* Neural activity is scientifically irrelevant to the study of mind.

  **NODE 4 (Report Interpretation):** Consider a **split-brain patient whose two hemispheres give conflicting reports**. Does the interpretation of that report answer to:
  *   **Nothing beyond the report stream itself:** → **Leaf 7: Phenomenal Structuralism**
      *   *Awkward Commitment:* Contradictory experiences must both be accepted as valid data points.
  *   **Something beyond (later self-correction, non-report measures):** → Proceed to Node 6.

  **NODE 5 (Non-Report Inference):** Consider a **person under dissociative anaesthesia who behaves as if in pain and afterwards reports nothing**. Do we infer experience?
  *   **No (Report is final arbiter):** → **Leaf 8: Report-Strict Realism**
      *   *Awkward Commitment:* Unreported pain does not count scientifically, even if behavior suggests otherwise.
  *   **Yes (Behavior indicates experience):** → **Leaf 9: Behavioral Realism**
      *   *Awkward Commitment:* Third-person observation overrides first-person denial.

  **NODE 6 (Metaphysical Stability):** Consider a **patient who can move only their eyes and reports a full inner life**. Can the method bracket the metaphysics of experience?
  *   **Yes (Neutrality holds):** → **Leaf 10: Critical Realism**
      *   *Awkward Commitment:* We study experience while pretending not to know what it is.
  *   **No (Neutrality is unstable):** → Proceed to Node 7.

  **NODE 7 (Neutrality Collapse):** If neutrality is unstable, does the method commit to:
  *   **Experience exists:** → **Leaf 11: Naturalized Phenomenology**
      *   *Awkward Commitment:* The method claims neutrality but secretly assumes realism.
  *   **Experience does not exist:** → **Leaf 12: Methodological Illusionism**
      *   *Awkward Commitment:* You study consciousness by proving it isn't there.

  ---

  ### Post-Tree Analysis

  **1. Empty Combinations**
  *   **Report = Fiction (Node 1A) + Access = Trainable (Node 2B):** *Incoherent.* If reports are merely fictions for prediction, there is no underlying access to train or calibrate.
  *   **Report = Window (Node 1C) + Non-Report = Noise (Node 3C):** *Unattractive.* Trusting the report as a window while dismissing neural correlates as noise creates an unjustified dualism between verbal and neural data.
  *   **Report = Behavior (Node 1B) + Non-Report = Experience (Node 3A):** *Unexplored.* A position that treats reports as mere behavior but neural signals as direct evidence of experience lacks a clear defender, as it privileges non-verbal data over verbal data without a stated reason.

  **2. Indistinguishable Leaves**
  *   **Leaf 2 (Illusionism/Realism Exit) vs. Leaf 11 (Naturalized Phenomenology):** Both positions ultimately operate on the assumption that phenomenal experience exists (in the Realism variant) or structure the research around its existence.
  *   **Further Question Needed:** "Do you believe the neutrality constraint was a valid starting point that failed during inquiry, or an invalid constraint that should have been rejected from the start?" (Leaf 11 accepts the Root initially; Leaf 2 rejects it immediately).
