answer: |-
  You have identified a specific and under-theorized mechanism of social change. Your term, **"jurisdictional retreat,"** is excellent. It is not a standard academic term, but it is precise enough that you should keep it. In political theory and legal history, this phenomenon is usually discussed under the umbrella of the **Public/Private Distinction**, but that describes the *tool* used, not the *maneuver* itself.

  Here is the carving up you asked for: an analysis of what this move is, why it is distinct from mere hypocrisy, how it relates to the lag time of moral arguments, and whether it signals the death or the mutation of the norm.

  ### 1. Naming the Move: Substantive to Procedural
  The shift you describe is a migration from a **substantive defense** to a **procedural defense**.

  *   **Substantive:** "Slavery is economically necessary," "Dueling cultivates courage," "Foot-binding ensures beauty." This claims the *content* of the practice is good.
  *   **Procedural:** "Slavery is a property right," "Dueling is a matter of personal honor," "Foot-binding is a family custom." This claims the *authority to decide* belongs to the actor, not the critic.

  When defenders make this shift, they are admitting moral bankruptcy. They are conceding that they can no longer win on the merits, so they attempt to change the court. They are no longer arguing about *ethics*; they are arguing about *sovereignty*.

  In legal theory, this is often called **weaponizing the private sphere**. Feminist legal scholars (like Catharine MacKinnon) have analyzed this extensively regarding domestic violence: the law refused to intervene in "the home" for centuries, effectively granting men a jurisdictional immunity to abuse. The defense wasn't "abuse is good," it was "the state has no business in the home."

  So, if "jurisdictional retreat" is your term, the academic cognate is **Procedural Deflection**.

  ### 2. Is it distinct from "Lofty Principles"?
  You asked if this is just the old idea that a bad cause's last defense is a lofty principle. It is distinct, and here is why:

  A lofty principle defense usually argues that banning the practice would damage a *greater good* (e.g., "Banning slavery hurts the economy," "Banning dueling hurts national honor"). This is still an argument about consequences.

  The jurisdictional retreat is different because it is **non-falsifiable**.
  *   If I say "Slavery helps the economy," you can show me data that it doesn't.
  *   If I say "The Federal Government cannot tell me what to do with my property," there is no data that can refute me. That is a structural claim about power, not a factual claim about the world.

  This makes the retreat a **firewall**, not an argument. Its purpose is not to convince the opposition that the practice is good, but to make the opposition's judgment *irrelevant*. It is an attempt to move the practice from the realm of *persuasion* to the realm of *rights*.

  ### 3. The Lag Time: Why the Argument Predates the Victory
  You noted that the arguments against a practice often exist for a century before it ends. This is because moral arguments require **social infrastructure** to land.

  An argument against slavery in 1750 is a philosophical abstraction. An argument against slavery in 1860 is a weapon of war. The argument doesn't change; the **cost of ignoring it** does.

  The jurisdictional retreat happens precisely when the cost of ignoring the argument becomes too high for the defenders to maintain the substantive claim. They know the public square is lost. They cannot say "Slavery is good" anymore because the cultural shame is too great. So they retreat to the last defensible position: "It is mine."

  This retreat is the **symptom of the moral victory**, not the counter-attack. It proves the abolitionists have already won the culture war; they are now just mopping up the legal fortifications.

  ### 4. Death vs. Survival: The Crucial Distinction
  This is the most important part of your query. Does this retreat mean the norm is dying, or is it how the norm survives?

  The answer depends on whether the practice requires **public coordination** or **private isolation**.

  **Case A: Practices that require public witness (The Norm Dies)**
  *   *Examples:* Dueling, Bear-baiting, Public Corporal Punishment.
  *   *Mechanism:* These practices rely on public recognition to function. A duel requires seconds, witnesses, and a community that acknowledges the honor code.
  *   *Outcome:* When defenders retreat to "it's a private matter," the practice collapses. You cannot have a private duel. If the state won't recognize the honor, the honor doesn't exist. The jurisdictional retreat here is a **eulogy**. It admits the practice can no longer sustain itself in the light.

  **Case B: Practices that thrive in isolation (The Norm Mutates)**
  *   *Examples:* Domestic Abuse, Child Labor, Certain forms of Exploitation.
  *   *Mechanism:* These practices happen behind closed doors. They do not require public applause; they require public *ignorance*.
  *   *Outcome:* The jurisdictional retreat ("A man's home is his castle") is a **life-support system**. It allows the practice to survive by shielding it from scrutiny. Here, the retreat does not signal death; it signals **privatization**. The norm ceases to be a public virtue and becomes a private vice that is tolerated.

  **Case C: Practices that can be structuralized (The Norm Goes Underground)**
  *   *Examples:* Slavery, Segregation.
  *   *Mechanism:* When the moral defense fails ("Slavery is sin"), defenders shift to legalism ("States' Rights," "Contract Law").
  *   *Outcome:* The practice ends in name but continues in structure (Convict leasing, Jim Crow, Mass Incarceration). The jurisdictional retreat allows the *power dynamic* to survive even if the *label* changes.

  ### 5. Summary of the Dynamics
  To answer your final question: The retreat means the **public norm** is dying, but it does not guarantee the **private act** is ending.

  *   **If the practice needs shame to work (Honor cultures):** The retreat kills it. (Dueling).
  *   **If the practice needs shame to be avoided (Abuse/Exploitation):** The retreat saves it. (Domestic violence).

  The "Jurisdictional Retreat" is the moment a society decides it is no longer willing to enforce a norm collectively, but is not yet willing to forbid it individually. It is a **zone of tolerated deviance**.

  ### A Proposed Terminology
  If you are writing about this, I suggest distinguishing between two types of retreat:

  1.  **The Sovereignty Shield:** "This is my right/property/state's decision." (Used when the defender still has power).
  2.  **The Privacy Cloak:** "This is a personal matter." (Used when the defender is weak and seeking mercy).

  Your observation about the "arguments lying around for ages" is the key. The moral argument is the **seed**; the jurisdictional retreat is the **withering husk**. The seed waits for the rain (war, economic shift, demographic change). When the rain comes, the plant grows, and the husk falls off. The defenders clutching the husk (jurisdictional rights) are the last ones left, standing in the mud, arguing about who owns the dirt while the crop has already been harvested by the other side.

  You are describing the **transition from Moral Legitimacy to Legal Immunity**. When a practice loses the former, it desperately seeks the latter. If it gets it, it survives in the dark. If it doesn't, it dies in the light.
