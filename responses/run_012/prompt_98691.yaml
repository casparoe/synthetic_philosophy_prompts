          *   Flag which are non-negotiable vs. theory-laden.
          *   Highlight the potential incompatibility (The Trilemma).
      *   **Part 2: Testing the Custom Cases:**
          *   Apply the desiderata to the Split, Prosthetic, and Matching cases.
          *   Determine if they force theory choice or just constrain.
      *   **Part 3: Scoring the Theories:**
          *   Naive Disjunctivism.
          *   Conjunctive Disjunctivism (often called Common Kind + Disjunctive account of knowledge, but I should clarify terms. Usually, it's Disjunctivism vs. Common Kind. I will treat "Conjunctive" as the view that there is a common mental component *plus* an external relation).
          *   Sense-Datum Theory.
          *   Intentionalism/Representationalism.
      *   **Part 4: Confidence & Uncertainty:**
          *   Assign confidence levels.
          *   Identify the weakest point.

  5.  **Refining the Content (Self-Correction/Nuance):**
      *   *Correction on "Conjunctive Disjunctivism":* This term is tricky. Usually, the debate is Disjunctivism vs. Common Kind. Some argue for a "Conjunctive" view where the experience is a conjunction of a sensory core + external relation. I need to be precise here. I will interpret it as the "Common Kind Assumption" view (often the target of disjunctivists) or a hybrid view. Let's stick to the standard taxonomy: Naive Realist Disjunctivism, Common Kind (Intentionalism/Sense-Data). I will address "Conjunctive" as the view that veridical perception = common state + external relation.
      *   *The "Split Case":* This is a partial hallucination. Standard theories often assume total hallucination. This tests granularity.
      *   *The "Prosthetic Case":* This is a "deviant causal chain" or "extended perception" case. Tests the "directness" requirement.
      *   *The "Matching Case":* This is the "perfect hallucination." Tests the metaphysical vs. epistemic distinction.
      *   *Joint Unsatisfiability:* I need to be explicit about the "Perceptual Trilemma." (1) Hallucinations exist. (2) Hallucinations can be subjectively indistinguishable from perception. (3) Perception is essentially a relation to mind-independent objects. Disjunctivists drop (2) (in a strong sense). Intentionalists drop (3). Sense-datum theorists modify (1) or (3).
      *   *Confidence:* I need to be honest. Philosophy of perception is not settled. I cannot claim high confidence on metaphysical truths, only on the dialectical landscape.

  6.  **Final Review against Constraints:**
      *   Did I avoid textbook recitals? Yes, focused on the custom cases.
