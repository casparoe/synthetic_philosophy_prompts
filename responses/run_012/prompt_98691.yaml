      *   **Specific Focus:** Distinguish non-negotiable requirements from "articles of faith" of specific camps (disjunctivists, sense-datum theorists, intentionalists). Identify if any subset of requirements is jointly unsatisfiable (impossibility results).
      *   **Custom Cases:** The user provides three specific cases to test the list:
          1.  *The Split Case:* Grey cube + red implant = experience of red cube. (Partial veridicality/hallucination?)
          2.  *The Prosthetic Case:* Eyes closed, camera direct-to-cortex, accurate signal. (Perception or hallucination?)
          3.  *The Matching Case:* Hallucination matches reality perfectly (causal history differs).
      *   **Evaluation:** Score main theories (Naive/Conjunctive Disjunctivism, Sense-Datum, Intentionalism) against the list, but keep the weight on the criteria.
      *   **Meta-Requirement:** State confidence levels for claims and identify the area of least certainty.

  2.  **Deconstruct the Desiderata (The "Specification"):**
      *   I need to list requirements that are broadly accepted across the field, not just specific to one theory.
      *   *Requirement 1: Phenomenal Character.* The theory must account for what it's *like* to have the experience. (Motivation: Phenomenology is the data.)
      *   *Requirement 2: Causal/Explanatory Link.* The theory must explain how the world causes the experience (in veridical cases). (Motivation: Perception is a biological function.)
      *   *Requirement 3: Indistinguishability.* The theory must account for why hallucinations can seem the same as perceptions to the subject. (Motivation: Epistemic humility/subjective perspective.)
      *   *Requirement 4: Ontological Parsimony/Coherence.* The theory shouldn't multiply entities unnecessarily or contradict established science. (Motivation: General philosophical/scientific virtue.)
      *   *Requirement 5: Intentionality/Aboutness.* The theory must distinguish between being caused by $X$ and being about $X$. (Motivation: Error is possible.)
      *   *Requirement 6: The Common Kind Assumption (CKA) vs. Disjunction.* This is the crux. I need to frame this carefully. Is CKA a desideratum or a theory-laden claim? Most argue it's a theoretical commitment, but the *explanatory burden* of explaining subjective similarity is the desideratum.
      *   *Joint Unsatisfiability:* The "Trilemma" often arises between: (1) Naive Realism (direct contact), (2) CKA (same mental state in good/bad cases), and (3) Hallucination has no object. You can't have all three.

  3.  **Analyze the Custom Cases:**
      *   *Split Case:* Challenges the unity of experience and the binary veridical/hallucinatory distinction. Tests *Requirement 1 (Phenomenal Unity)* and *Requirement 5 (Aboutness)*.
      *   *Prosthetic Case:* Challenges the definition of "perceptual channel." Tests *Requirement 2 (Causal Link)* vs. *Requirement 1 (Phenomenology)*. Is the route essential?
      *   *Matching Case:* Challenges the epistemic vs. metaphysical distinction. Tests *Requirement 3 (Indistinguishability)* vs. *Requirement 2 (Causal History)*.

  4.  **Drafting the Response - Section by Section:**

      *   **Introduction:** Acknowledge the frustration. Validate the desire for specifications over intuition pumps.
      *   **Part 1: The Desiderata (The Specification):**
