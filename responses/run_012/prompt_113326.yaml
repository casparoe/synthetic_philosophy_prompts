answer: |-
  Hi there,

  It is great to hear from you and to dig into this distinction, because I think you are right that the literature often glosses over the difference between pairwise incompatibility and joint incompatibility among a larger set. To give you the concrete case you asked for, imagine you are the administrator of a small, emergency evacuation fund during a political crisis. You have made a specific, binding promise to each of eleven distinct colleagues that you will secure their exit visa, and you have assessed that securing any single visa costs one unit of your limited capital. You currently possess exactly ten units of capital. In this scenario, you can secure the visa for colleague A and colleague B simultaneously, or A and C, or any other pair you care to name, because any pair requires only two units and you have ten. There is no pairwise conflict here because the cost of any two obligations does not exceed your resources. However, the joint discharge of all eleven obligations is impossible because that would require eleven units and you only have ten. Whatever you do, you will leave at least one promise unfulfilled, not because you chose to violate promise X in order to keep promise Y, but simply because the sum total of your commitments exceeds your capacity to act, even though no two commitments ever bumped directly against each other.

  Now, to answer where I come down on whether this counts as a genuine dilemma and whether the possibility of dilemmas depends on pairwise conflict, we have to look closely at the agglomeration principle you mentioned. If we accept that obligation agglomerates, meaning that if you ought to do A and you ought to do B then you ought to do A and B, then this multi-party case logically collapses into a pairwise conflict anyway. We can simply group the first ten obligations into a single conjunctive obligation, let us call it O(Ten), and leave the eleventh as O(Eleven). Since you ought to fulfill the first ten and you ought to fulfill the eleventh, agglomeration tells us you ought to fulfill all eleven. But since fulfilling all eleven is impossible, we are back to the standard contradiction if we also hold that ought implies can. More importantly for your specific question about pairwise conflict, once we agglomerate the first ten obligations into a single compound consideration, we have created a pairwise conflict between the compound obligation to save the first ten and the singular obligation to save the eleventh. These two considerations cannot both be honored. So, while there is no conflict between any two atomic obligations, there is a conflict between two aggregate obligations.

  This leads me to say that the very possibility of genuine dilemmas does depend on there being at least one pair of considerations that cannot both be honored, but your example shows that those considerations do not have to be atomic or simple. They can be complex aggregates. If you reject agglomeration, you might try to save the idea that this is a different kind of dilemma, one that is purely n-ary and not reducible to binary conflict, but rejecting agglomeration comes with a high logical cost because it prevents us from reasoning about combined duties in any standard way. If you accept agglomeration, then your case is vulnerable to the exact same argument as the stock pairwise cases, because the joint impossibility of the set entails the impossibility of some conjunction that can be treated as one side of a binary pair. Therefore, I do not think this example escapes the standard logical objection to dilemmas, which relies on the tension between agglomeration and ought implies can.

  Regarding whether these obligations are genuinely binding or merely prima facie, that is really where the burden of the dilemma lies. If the obligations are only prima facie, then in the moment of choice, the obligation to save the eleven collapses into an obligation to save ten, and the one left out was never actually something you ought to have done in the all-things-considered sense. In that case, there is no dilemma, only a calculation of priorities. But if you insist they are genuinely binding all-things-considered obligations, then you are forced to accept a contradiction in your moral theory unless you deny that ought implies can. If you are willing to deny ought implies can, then this case counts as a genuine dilemma just as much as Sophie's Choice, but the moral residue will feel different. In a pairwise conflict, the residue is often tragic guilt focused on the specific option sacrificed for the sake of the other. In this joint impossibility case, the residue is more diffuse, a sense of aggregate failure or insufficiency rather than a tragic trade-off, because you did not sacrifice colleague Eleven to save colleague One, you simply failed to meet the total demand of the situation.

  So my final view is that while your distinction is phenomenologically interesting and changes the texture of the moral residue, it does not save the possibility of dilemmas from the standard logical arguments. The agglomeration principle allows us to reconstruct pairwise conflict out of joint impossibility, so the logical structure of the problem remains identical to the stock cases. Whether this counts as a genuine dilemma depends entirely on whether you are willing to accept that an agent can be under a binding obligation to do something they cannot do, and that decision is independent of whether the conflict is pairwise or joint. If you deny that ought implies can, then both pairwise and joint cases are genuine dilemmas. If you accept ought implies can, then neither are genuine dilemmas, because in both cases at least one of the apparent obligations must cease to be binding. The joint impossibility case is a vivid way to illustrate the pressure on agglomeration, but it does not provide a loophole that allows dilemmas to exist where pairwise conflicts would not.

  I hope that helps clarify the terrain for you, and I think you are right to press on this distinction even if it does not ultimately bypass the logical constraints, because it forces us to be clearer about whether we are rejecting agglomeration or ought implies can when we defend the reality of dilemmas. Let me know what you think about the aggregation move, because that seems to be the pivot point for whether this example buys you any new ground.

  Best wishes
