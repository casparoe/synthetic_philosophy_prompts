          *   Score heterophenomenology against the list and state what it leaves unexplained.
      *   **Tone/Style:** American English, precise, philosophical but accessible to a writer, analytical.

  2.  **Deconstruct the Desiderata (The "Must-Haves"):**
      *   *Phenomena:* Attention (spotlight vs. periphery), Dreams (experience without external input), Blindsight (action without experience), Split-brain (two streams?), Phantom Limbs (pain without tissue), Anesthesia (absence of report + absence of memory), Unreported Experience (qualia without speech).
      *   *Distinctions:* Report $\neq$ Experience (I can lie or be wrong), Aphasia $\neq$ Unconsciousness (can't speak $\neq$ nothing there), Authority $\neq$ Infallibility (I know how it seems, but not *why* or if it matches reality).
      *   *Constraints:* Neuroscience compatibility (latency, location), No Homunculus (infinite regress), Non-verbal applicability (animals, infants).
      *   *Verdicts:* Must say "yes, there is experience" or "no, there isn't" in edge cases (e.g., vegetative state).

  3.  **Evaluate Requirements (Genuine vs. Prejudice):**
      *   *Genuine:* Consistency with neuroscience, applicability to non-verbal subjects, distinguishing report from experience.
      *   *Prejudice:* "Experience must be ineffable," "First-person access is privileged/absolute," "There must be a 'what it is like' that is ontologically distinct." (These are often battlegrounds between materialists and dualists/phenomenologists).
      *   *The "Killer" Requirement:* Applicability to non-verbal subjects + Consistency with neuroscience often kills purely introspective models. But the prompt asks for the *single* requirement that eliminates the most candidates. Usually, it's the demand to explain *systematic error* without positing a "true" inner theater that the subject can't see. Or, more simply: **The constraint of causal closure/physical consistency.** If a theory requires magic or non-physical interaction, it fails. However, in the context of *methodology*, the hardest constraint is **Accounting for Systematic Error without an Infallible Inner Observer.**
      *   *The Fault Line:* The user suspects a contradiction between "reports are our only evidence" and "reports can be false." Is this real? No, it's the standard scientific stance on *all* data (instrument readings can be faulty). The real fault line is **Ontological Status of Qualia.** Does the method treat the report as the *final reality* (Dennett) or as *evidence of a hidden reality* (Traditional Phenomenology)?

  4.  **Drafting the Content - Section by Section:**

      *   **Introduction:** Acknowledge the novelist's predicament (the gap between inner life and outer proof).
      *   **The Desiderata (The List):** Group them logically (Phenomena, Distinctions, Constraints, Verdicts).
      *   **Evaluation (Genuine vs. Prejudice):** Be critical. Some demands come from specific philosophical camps (e.g., Chalmers vs. Dennett).
      *   **The Killer Requirement:** Identify the one that filters the most theories.
      *   **The Fault Line:** Address the user's suspicion about evidence vs. error.
      *   **Scoring Heterophenomenology:** Apply the list to Dennett's method.
      *   **What is Left Unexplained:** The "hard problem" residue.

  5.  **Refining the Arguments (Self-Correction during drafting):**
      *   *Correction:* Make sure not to defend Dennett, just specify the criteria he (and others) face.
