      6.  Heterophenomenology Scorecard.
      7.  The Unexplained Residue.

  8.  **Writing the Response:** (Proceeding to generate output based on these thoughts.)
answer: |-
  Here are the desiderata for a science of consciousness, specified as you requested. This is not a defense of any particular view, but a checklist of the burdens any adequate method must bear.

  ### I. The Desiderata

  **A. Phenomena to be Accounted For**
  1.  **Attention vs. Presence:** The method must distinguish between stimuli that are processed but not experienced (pre-attentional) and those that enter the subjective field. *Motivation:* Inattentional blindness shows we process data we do not see.
  2.  **Dreaming:** The method must accommodate vivid experience in the absence of sensory input and behavioral output. *Motivation:* We wake and report experiences that occurred while we were behaviorally inert.
  3.  **Blindsight:** The method must explain how a subject can reliably guess the location of an object while sincerely reporting they see nothing. *Motivation:* V1 damage creates a dissociation between action and awareness.
  4.  **Split-Brain Cases:** The method must offer a verdict on whether there is one stream of consciousness or two when the hemispheres are severed. *Motivation:* The left hand may act contrary to the verbal report of the right hand.
  5.  **Phantom Limbs:** The method must account for pain localized to a non-existent body part. *Motivation:* Experience does not map 1:1 onto peripheral tissue state.
  6.  **Anesthesia:** The method must distinguish between mere amnesia (failure to record) and true unconsciousness (failure to experience). *Motivation:* Patients sometimes recall intra-operative pain; the method must predict the difference.
  7.  **Unreported Experience:** The method must allow for the possibility of experience that is never verbalized. *Motivation:* Infants and animals likely have experiences but lack the syntax to report them.

  **B. Distinctions Not to Collapse**
  1.  **Report vs. Experience:** The method must treat the utterance "I see red" as distinct from the seeing of red. *Motivation:* Subjects can lie, hallucinate, or misuse language.
  2.  **Unable to Report vs. Nothing to Report:** The method must distinguish between aphasia/paralysis and the absence of consciousness. *Motivation:* Locked-in syndrome patients are fully conscious but mute.
  3.  **Authority vs. Sincerity:** The method must grant the subject authority on *how things seem* (phenomenal character) but not on *what is happening* (mechanism or truth). *Motivation:* A subject is the final arbiter of whether they are in pain, but not on whether that pain is caused by tissue damage or neural misfiring.

  **C. Constraints Not to Violate**
  1.  **Neuroscientific Consistency:** The timeline of experience must match the latency of neural processing. *Motivation:* Libet-style experiments show neural activity precedes the conscious decision to act; a theory cannot require consciousness to act backwards in time.
  2.  **No Homunculus:** The method cannot posit an "inner observer" who views the experience. *Motivation:* This leads to an infinite regress (who watches the watcher?).
  3.  **Non-Verbal Applicability:** The method must be applicable to subjects who cannot speak (infants, non-human animals). *Motivation:* Consciousness likely predates language evolutionarily and developmentally.

  **D. Verdicts to be Rendered**
  1.  **The Vegetative State:** The method must determine if a patient with wake-sleep cycles but no behavioral response has an inner life. *Motivation:* Ethical decisions regarding life support depend on this.
  2.  **The Systematic Illusion:** The method must explain why a subject might insist they have a rich, continuous inner movie when the neuroscience suggests fragmented, post-hoc construction. *Motivation:* If the brain constructs a narrative after the fact, the subject's belief in "real-time" experience is an error the theory must explain.

  ***

  ### II. Genuine Requirements vs. Camp Prejudices

  Not all demands on this list are neutral. Some are loaded with philosophical assumptions.

  **Genuine Requirements:**
  *   **Neuroscientific Consistency:** Any theory contradicting established physics or biology is dead.
  *   **No Homunculus:** This is a logical necessity, not a preference. Explanatory regress is fatal to science.
  *   **Unable vs. Nothing to Report:** This is an empirical necessity given the existence of locked-in syndrome.

  **Prejudices of One Camp:**
  *   **The Demand for "Qualia" as Ineffable Objects:** The requirement that experience must consist of private, non-physical properties (qualia) that cannot be fully described is a prejudice of the dualist or phenomenological camp. Materialist methods reject this as a category error.
  *   **The Demand for First-Person Privilege:** The idea that the subject *cannot* be wrong about their own experience is a prejudice of Cartesianism. Heterophenomenology rejects this; you can be wrong about *what* you are experiencing even if you are right that it *seems* a certain way.
  *   **The Demand for Continuity:** The intuition that experience is a smooth, unbroken stream is likely a prejudice of memory, not a feature of reality. A method should not be required to validate this intuition if the data suggests fragmentation.

  ***

  ### III. The Killer Requirement

  The single requirement that eliminates the most candidates is **The Constraint of Systematic Error.**

  A method must be able to explain why a subject's report about their own mind can be *wrong* without positing a "true" experience that the subject cannot access.

  Naive introspectionism fails this immediately: if the only way to know experience is by looking inward, and the subject looks inward and reports X, then X must be true. To say the subject is wrong requires a second, privileged vantage point. But if that vantage point exists, why isn't *it* the subject? This requirement kills Cartesian privacy, kills naive phenomenology, and kills any theory that treats first-person reports as infallible data. It forces the theory to treat the mind as an object that can be misperceived even by its owner.

  ***

  ### IV. The Fault Line

  You suspect the fault line lies between **"reports are our only evidence"** and **"reports can be systematically false."** You ask if this is a contradiction.

  It is not. It is the standard stance of all empirical science. A telescope reading is our only evidence of a distant star, yet we acknowledge the reading can be distorted by atmospheric refraction. We correct for the distortion using theory and cross-calibration. Similarly, a subject's report is the primary data, but it can be calibrated against reaction times, neural imaging, and behavioral consistency.

  **The Real Fault Line:**
  The true incompatibility lies between **Ontological Realism** and **Methodological Operationalism.**

  *   **Realism:** Demands that the method explain the *thing itself* (the raw feel of red) which exists independently of the report.
  *   **Operationalism:** Demands that the method explain the *report and its causes*, treating the "raw feel" as a theoretical construct derived from the report.

  You cannot satisfy the demand that the report is merely evidence (Operationalism) while simultaneously demanding that the method validate the existence of a private, inner reality that exceeds that evidence (Realism). One of these must go. Either the experience *is* the complex of dispositions to report (Dennett's view), or the experience is a hidden cause of the report (Traditional view). If it is hidden, it is scientifically inaccessible; if it is accessible, it is not truly private.

  ***

  ### V. Scoring Heterophenomenology

  **Heterophenomenology** treats the subject as a narrator. The scientist collects the text (the report) and constructs a theory that explains why that text was produced, using all third-person tools available (neuroscience, psychology). The subject's "world" is a theorist's fiction useful for prediction, not necessarily a literal place.

  **Scorecard:**
  *   **Phenomena:** **Pass.** It handles blindsight and dreams by treating them as different modes of text generation.
  *   **Distinctions:** **Pass.** It rigorously separates the text from the machinery producing the text.
  *   **Constraints:** **Pass.** It is fully compatible with neuroscience and explicitly bans the homunculus.
  *   **Verdicts:** **Pass.** It renders verdicts based on the best explanatory model, even if it contradicts the subject (e.g., telling a subject their experience is fragmented despite their claim of continuity).
  *   **Systematic Error:** **Pass.** This is its strongest feature. It is designed specifically to explain why subjects are wrong about their own minds.

  **What It Leaves Unexplained:**
  Heterophenomenology leaves unexplained the **ontological status of the feeling itself.**

  It explains why you *say* you feel pain. It explains the neural correlates of the pain report. It explains the evolutionary utility of the pain behavior. But for many, it sidesteps the question: "But is there actually *something it is like* to be you?" Dennett's answer is essentially: "If we account for all the saying and doing and neural firing, there is nothing left to explain."

  For a novelist, this is the crucial gap. Heterophenomenology explains the *character* as a system, but it dissolves the *narrator* as a witness. It justifies believing the report only insofar as the report is a reliable indicator of the system's state. It does not, and cannot, justify believing that there is a "ghost in the machine" listening to the story. It leaves unexplained the very thing you are trying to write: the intrinsic validity of the inner voice. It treats the voice as output, not as evidence of a listener.
