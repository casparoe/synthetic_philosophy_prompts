  So me and my flatmate got into a long, wine-fuelled argument last night about whether you can really be justified in believing something when you can't justify the stuff you're justifying it with. Eventually he just said "well then it's turtles all the way down," like that settled it, and went to bed. I'm fairly sure he meant some version of: every chain of reasons has to stop at something you just accept, and anyone demanding a complete justification is demanding something that couldn't exist. But that line gets used for alot of different things and I want to know which one he was actually leaning on.

  Can you break out the different precise claims that sentence could be making? Like: a neutral observation that a regress is always possible; the claim that such a regress is absurd or vicious; the claim that as a matter of fact our justification does bottom out in something unjustified; the claim that it *must* bottom out, and specifically in something that doesn't need justifying at all; and whatever else is lurking in there that I haven't thought of. For each one, tell me whether it's a platitude, a genuine substantive thesis worth arguing about, or just plain false — and then say which reading he'd have to be using for the line to actually do the work he wanted it to do (i.e. get him from "you can't justify everything" to "so my belief is fine as it stands"). Give me a menu of options, please don't just pick one and lecture me about it. And keep the whole thing under 600 words, my attention span is definately not what it was.
