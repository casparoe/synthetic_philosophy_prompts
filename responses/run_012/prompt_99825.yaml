          3.  Sister's dog: Situation to bite $\rightarrow$ Fear $\rightarrow$ No bite. (Safety is artificial.)
      *   **The Nuance:** The block isn't pre-existing (like a locked door); it's *trigger-dependent*. It co-occurs with the temptation.
      *   **The Request:** Name it (if it exists), or coin one. But more importantly, *carve the concept*: What makes it distinct? How does it differ from similar ideas? What about edge cases (90% effectiveness, occasional failure)?

  2.  **Initial Brainstorming & Terminology Search:**
      *   *Honesty/Integrity:* Usually implies a choice to tell the truth despite the ability to lie. This brother *can't* lie when it counts. That's more like *incapacity* than *virtue*.
      *   *Precommitment:* Ulysses tying himself to the mast. But that's a prior choice. This is automatic.
      *   *Constitutional Incapacity:* Being physically unable. But the inability is triggered by the specific context.
      *   *Counterfactual Dependence:* The core philosophical issue. We can't test the counterfactual world where the block fails.
      *   *Masked Dispositions:* In metaphysics, a "mask" prevents a disposition from manifesting. (e.g., a fragile glass wrapped in bubble wrap). But usually, the mask is external or constant. Here, the mask is *internal and co-triggered*.
      *   *Finkish Dispositions:* This is the closest philosophical technical term. A "finkish" disposition is one that disappears when the test conditions arise. (e.g., A wire is conductive, but if you touch it to a battery, it instantly loses conductivity).
      *   *Self-Preventing Prophecies/Feedback Loops:* Cybernetics.
      *   *Moral Luck:* Whether he gets credit for something out of his control.

  3.  **Deep Dive into "Finkish Dispositions":**
      *   *Concept:* Introduced by C.B. Martin (1994). A disposition is "finkish" if the stimulus that would manifest the disposition also causes the disposition to vanish.
      *   *Fit:* In the brother's case, the disposition to lie (if it exists) is met by a physiological reaction that prevents the lie. Actually, it's slightly different. It's more like a *preventing disposition* that activates *with* the stimulus.
