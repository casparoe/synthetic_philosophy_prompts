answer: |-
  **MEMORANDUM**

  **TO:** Exhibits Committee, Board of Directors
  **FROM:** [Your Name], Exhibits Committee
  **DATE:** October 23, 2023
  **SUBJECT:** Decision Recommendation: Founding Exhibit Wall Text

  **Recommendation**
  We must revise the draft wall text to distinguish between the founders' aspirations and the historical structure of their authority. I recommend the following wording:

  > "The founders established a community under a religious covenant, believing their system of communal order was unique in the world."

  **Reasoning**
  This revision prioritizes historical accuracy without sacrificing the narrative hook. It addresses the Board's concern regarding the type of claim being made: it explicitly frames "uniqueness" as the founders' *belief*, not an objective historical fact. Crucially, it removes the phrase "ordinary people could govern themselves." Given the minister's veto power and the leader's selection of trustees, "self-governance" is factually incorrect. "Communal order" accurately reflects their religious hierarchy while acknowledging their agency.

  **The Opposing Argument**
  The strongest argument for keeping the draft as is (the Director's position) is that historical societies rely on donor support and visitor engagement. A nuanced explanation of 17th-century ecclesiastical hierarchy is dry; "ordinary people governing themselves" is an uplifting, relatable hook that validates the donor's investment and draws the public in. From this view, the exhibit is a celebration of community identity, not a peer-reviewed paper, and minor narrative smoothing is acceptable to secure funding and attendance.

  **Why We Cannot Accept That Argument**
  While engagement is vital, our primary currency is credibility. If we assert as fact that "ordinary people governed themselves" when church records show a ministerial veto, we are not smoothing the narrative; we are falsifying the record. We risk alienating local historians, educators, and future donors who value accuracy. We can be uplifting without being inaccurate.

  **Assertion vs. Endorsement**
  *   **What we assert:** That the founders *believed* their model was unique (a verifiable historical sentiment).
  *   **What we endorse:** Nothing regarding the morality or effectiveness of their hierarchy. We are not endorsing the ministerial veto, nor are we endorsing the claim that they were actually unique. We are simply reporting their self-perception.

  **Sign-Off and Deadline**
  Given the board friction, standard protocol is insufficient.
  1.  **Decision:** The Exhibits Committee will vote on this wording at Thursday's meeting.
  2.  **Approval:** Final text requires sign-off from both the **Executive Director** and the **Board President** to ensure alignment between staff and governance.
  3.  **Deadline:** Sign-off must be completed by **Monday, October 30, at 5:00 PM**. This allows the design team to begin layout while we are still six weeks from opening.

  Please come to Thursday's meeting prepared to vote on this specific wording.
