answer: |-
  Let me pour a coffee and settle into this. You've caught me at a good time—I was just grading a batch of undergrad essays on Galileo's falling bodies, which is ironically the ur-text for the "subtraction" side of your colleague's distinction.

  That distinction your colleague drew at the workshop... it's elegant. It has the kind of symmetry that makes you want to nod along immediately. Subtraction is the scalpel; Addition is the Frankenstein monster. One cleans the world to see the mechanism; the other clutters the world to test our reaction to the clutter.

  But you asked me to think before I commit. So, let's pull at the thread.

  ### Is the distinction real, or just staging?

  My first instinct is to say the distinction is syntactic, not functional. It describes the *narrative setup*, not the *logical work*.

  When your colleague says subtraction gives you a "licence to ignore," he's talking about idealization. In physics, we say "assume a vacuum." That is a contractual agreement between the thinker and the thought. We agree that air resistance is noise.

  But look closer at the "Addition" cases. Take Thomson's Violinist. You wake up plugged into a stranger. On the surface, that's an addition. You've added a violinist, a kidnapping, a medical apparatus. But what is the logical function of that apparatus? It is forcibly isolating one variable: *bodily autonomy*. By adding the weird medical sci-fi element, Thomson is actually *subtracting* the usual social complications of pregnancy. She subtracts the partner, the choice to have sex, the social expectation of motherhood, the financial implications. She strips the scenario down to the bare metaphysical bone: Can one person use another's body without consent?

  So, is the Addition pump just a Subtraction pump with better staging? I'm leaning towards yes. The "added" elements are often Trojan horses. They look like clutter, but their job is to bulldoze away the real-world context that usually muddies the waters. The sci-fi element acts as a firewall. It prevents you from importing your usual assumptions.

  If that's right, the distinction collapses. Both methods are trying to achieve isolation. One says "I will remove the friction so you can see the inertia." The other says "I will build a friction-generating machine so weird that you can't pretend the friction is normal."

  ### The Experience Machine: The Pivot Point

  Let's test this on the Nozick case you mentioned. The Experience Machine.

  Superficially, it's an Addition. We add a machine, a tank, a neuro-simulation tech. But follow the logic. What is the machine *doing*? It is severing the link between *experience* and *reality*.

  If I ask you, "Do you value pleasure?" and you say "Yes," Nozick wants to check if you value *only* pleasure. So he constructs a scenario where you can have the pleasure *without* the reality.

  Is this addition or subtraction? It adds a machine, but it subtracts the world. It subtracts truth. It subtracts agency. It subtracts the causal history of your sensations.

  If my analysis holds—that additions are often subtractions in disguise—then the Experience Machine is a subtraction pump. It strips away the connection to reality to see if "pleasure" still weighs the same.

  Does the answer change what it can prove? Yes, significantly.

  If we treat it as an **Addition**, the critique is: "Well, people might not plug in because they don't trust the machine, or they're scared of tanks." That's the "wallpaper" objection your colleague is making. The sci-fi trappings might be driving the intuition, not the philosophical point.

  If we treat it as a **Subtraction**, the critique changes. We ask: "Is it possible to subtract reality from experience without changing the nature of the experience?" If the very concept of 'pleasure' entails 'pleasure *about* something real,' then the thought experiment is asking for an impossibility. It's like asking "Imagine a triangle without three sides." If the subtraction destroys the phenomenon you're studying, the experiment fails.

  So, if Nozick is subtracting reality, he needs to prove that reality isn't constitutive of value. If he's just adding a machine, he needs to prove the machine doesn't scare us for irrelevant reasons. The stakes are different.

  ### The Strongest Case Against Your Colleague

  You asked for the strongest case against him before I give my verdict. I need to be fair to the "Addition" method here, because I think your colleague is underestimating its specific utility.

  He claims Additions are "dodgy" because you can't tell which bolted-on bit is doing the work. He implies Subtraction is stable. I think that's wrong. Subtraction is *more* prone to a specific kind of hidden bias, because the licence to ignore is too easy to accept.

  Here is the defense of Addition: **Additions test the resilience of a concept under stress; Subtractions test the concept in a vacuum.**

  In engineering, you don't just test a bridge by calculating its load in a vacuum (Subtraction). You test it by simulating earthquakes, wind shear, and corrosion (Addition). You add the stressors to see if the principle holds.

  Moral philosophy is more like engineering than pure physics. Principles like "do not kill" are meant to operate in the messy world. If you subtract too much (Rawls' Veil of Ignorance), you might create a principle that works perfectly in the idealized model but collapses when you re-introduce human psychology.

  The "Addition" method forces us to confront the boundaries of our concepts. When Thomson adds the violinist, she isn't trying to be realistic. She is trying to break our usual heuristic shortcuts. We usually bundle "right to life" with "motherhood." She adds a weird scenario to break that bundle.

  The "wallpaper" objection—that changing the details changes the verdict—isn't a bug; it's a feature. It shows us that our moral intuition wasn't based on a universal principle, but on a contextual cue. If changing the violinist to a stranger changes your mind, Thomson has learned something vital: your intuition about abortion isn't about bodily autonomy; it's about intimacy or social duty.

  So, the instability your colleague complains about is actually diagnostic. The "dodginess" reveals the fragility of the intuition. Subtraction hides that fragility under a rug labelled "Idealization."

  ### The Mirror-Image Charge

  Now, let's turn the screw. Is there a mirror-image charge against Subtraction?

  Yes. **The Charge of Constitutive Loss.**

  When you subtract friction, you assume friction is external to the motion. But what if you're studying walking? You can't subtract friction there; walking *is* friction management.

  In philosophy, when you subtract "bias" or "self-interest," you might be subtracting the very thing that constitutes the moral agent. If you strip away all knowledge of your place in society (Rawls), are you still a moral agent making a choice, or are you a random number generator?

  The danger of Subtraction is that it assumes the "noise" is separable from the "signal." But in complex systems (biology, society, consciousness), the noise is often part of the signal. By licensing us to ignore the stripped-out bits, Subtraction tricks us into thinking those bits don't matter.

  So, while Addition risks *contamination* (irrelevant details swaying us), Subtraction risks *amputation* (cutting off the limb you meant to examine).

  ### The "Irrelevant Detail" Criticism

  Finally, your last question. This is the one that keeps me up at night.

  *"Is pointing out an irrelevant detail a fair criticism, or just a way of refusing to have the intuition?"*

  I'm going to be blunt: It is often a refusal to have the intuition. But it is a *valid* methodological refusal.

  Here's the nuance. A thought experiment is an argument in narrative clothing. The narrative is the vehicle; the intuition is the cargo. If the vehicle has a hole in it, the cargo doesn't arrive.

  If I present a case about a trolley car, and you say, "I wouldn't pull the lever because I'd be afraid of being sued," you aren't just refusing the intuition. You are pointing out that my narrative failed to isolate the variable. I wanted to test *utilitarian calculus*; you are telling me that my story introduced *legal anxiety*.

  However. There is a bad faith version of this. This is what happens when a philosopher says, "Well, in *this specific version* of the trolley problem, the fat man looks like my uncle, so I wouldn't push him." That's nitpicking.

  The line is drawn at **systematic relevance**. If changing the detail changes the verdict for a *class* of people, the detail isn't irrelevant. It's a variable you didn't control for.

  So, criticizing a thought experiment by finding an "irrelevant" detail is fair if you can show that the detail is doing logical work. It's unfair if it's just an ad hoc excuse to avoid a counter-intuitive result. But honestly? Most of the time, when someone says "that detail matters," they've found a crack in the experimental design. We should listen to them.

  ### Where I Land

  So, to wrap this up for your piece.

  Your colleague's distinction is a useful heuristic for teaching, but it doesn't hold up under methodological scrutiny.

  1.  **The Distinction:** It's mostly staging. Additions are usually mechanisms to enforce a subtraction of context. The Experience Machine adds a tank to subtract reality.
  2.  **The "Dodgy" Charge:** He's half-right. Additions are unstable, but that instability is diagnostic. It reveals where our intuitions are fragile. Subtractions are stable, but that stability is often an illusion created by over-idealization.
  3.  **The Verdict:** Neither method is inherently superior. They are tools for different jobs. Use Subtraction to find the core law (physics style). Use Addition to test the boundary conditions (engineering style).
  4.  **The Criticism:** Pointing out irrelevant details is the peer-review process of the imagination. It's not intuition-refusal; it's validity-checking. If a thought experiment breaks when you change the wallpaper, the wallpaper was load-bearing.

  The real problem isn't Addition vs. Subtraction. It's **Control**.

  Whether you add a violinist or subtract friction, you are trying to control variables in a system (the human mind) that is notoriously bad at being controlled. We don't have a lab. We have stories. And stories always leak.

  Your colleague wants to blame the leakage on the *type* of story. I think the leakage is just the nature of the medium. We argue with imaginary cases because we have nowhere else to argue. But we should never forget that the imaginary case is a map, and sometimes the mapmaker draws a mountain just to see if we'll climb it.

  Does that help you untangle the workshop comment? I think he saw a real symptom (the instability of sci-fi cases), but he diagnosed the wrong disease. It's not the addition that's the problem; it's the lack of control over what the addition implies.
