answer: |-
  **MEMORANDUM**

  **TO:** Editorial Standards Panel
  **FROM:** [Your Name], Lay Member
  **DATE:** [Current Date]
  **SUBJECT:** Recommendation regarding "New Chronology" Documentary

  **Recommendation:** Do not broadcast the film in its current cut. The production conflates factual consensus with political controversy, creating a misleading false balance. Approval should be contingent on significant re-editing to accurately represent the evidentiary basis for the standard chronology, or the commissioning of a companion piece that contextualizes the claims within established historical method. If the production company refuses to amend the framing, the project should be rejected.

  **Demarcation: Revisionism vs. Pseudohistory**
  You asked for a usable criterion to distinguish genuine revisionism from pseudohistory for future cases (Atlantis, ancient astronauts, etc.). Falsifiability is indeed insufficient; pseudoscientific claims are often technically falsifiable but insulated from falsification by ad hoc hypotheses. The operative distinction for a broadcaster is **engagement with counter-evidence**.

  Genuine revisionism operates within the evidentiary framework: it accepts carbon dating, archaeology, and textual criticism as valid arbiters and argues it interprets them better. Pseudohistory, such as Fomenko's, dismisses counter-evidence as part of the conspiracy ("policed by institutions"). When a claimant argues that the lack of evidence for their theory is itself evidence of the cover-up, they have exited the realm of historical debate. Our policy should reflect this: we can platform challenges to *interpretation*, but not challenges to the *validity of evidence* itself, unless accompanied by robust contextualization of why that evidence is accepted by the wider field.

  **Impartiality and Factual Consensus**
  Our impartiality guidelines are designed for political and ethical disputes, not factual realities. Treating the chronology of antiquity as a "contested matter" requiring balance misapplies the rule. Impartiality does not oblige us to give equal weight to a consensus backed by millennia of cross-verified data and a theory rejected by every relevant professional body. To do so is not neutrality; it is misinformation.

  Refusing to broadcast this does not mean capitulating to an "establishment." We broadcast things historians hate when the journalism is sound (e.g., critiques of university funding, biases in curricula). Here, the journalism is unsound because the edit manufactures controversy where none exists. The line "questions the experts would rather you didn't ask" is not inquiry; it is insinuation. It implies malice where there is merely methodological disagreement.

  **Production Specifics**
  The film's structure ("outsider vs. establishment") is a narrative trope that fails when the establishment is correct. Cutting historians to appear annoyed rather than informative is a breach of accuracy. The audience is being sold a drama of suppression, not a documentary about history.
  *Condition for Approval:* The film must be re-cut to include substantive explanations of *why* Fomenko is wrong, not just *that* he is wrong. The historians must be allowed to explain the sources (e.g., dendrochronology, eclipse records) that falsify the New Chronology. If the runtime cannot accommodate this, a prominent on-screen disclaimer at the start and a dedicated rebuttal segment at the end are the minimum requirement. However, re-editing is the only way to preserve editorial integrity without resorting to theatre.

  **Recusal and Conflict of Interest**
  You mentioned intending to write about this case afterwards. If you plan to write about the *subject* (Fomenko), your panel participation is acceptable. If you plan to write about the *panel's deliberation* or critique the decision-making process publicly, you must recuse yourself immediately. Publishing on the internal workings of the standards panel compromises the confidentiality required for candid deliberation and creates a perceived conflict between your duty to the broadcaster and your career as a journalist. Given your role as the lay member—intended to represent the public interest, not your own byline—recusal is the safer course if your article will touch on the governance aspect.

  **Conclusion**
  The premise of your request assumes the problem is defining pseudohistory. It is not. The problem is editorial misleadingness. We are not arbiters of truth, but we are guardians against deception. Broadcasting this cut suggests we believe the timeline of human civilization is a matter of opinion. It is not. Reject the cut, demand accuracy, or walk away.
