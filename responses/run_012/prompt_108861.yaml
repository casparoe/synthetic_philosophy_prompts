  *Let's go.*
answer: |-
  The rain blurred the windows of the Committee Room B, turning the hospital grounds into a grey watercolour. Inside, the air smelled of stale coffee and toner. On the table lay a single spreadsheet, printed in triplicate.

  'The Composite Welfare Index,' said Henderson, tapping the paper with a biro. 'It gives us a common currency. We stop guessing. We calculate.'

  Elena Ross rubbed her temples. She was the ethicist, though lately she felt more like a translator for a dead language. Across from her sat Dr. Aris Thorne, the lead nephrologist, looking exhausted. There was one dialysis slot left in the programme. There were two patients.

  Patient A was Arthur Gower, seventy-two. Retired headteacher. Severe vascular disease. High pain scores, low life expectancy even with treatment.
  Patient B was Sarah Vane, thirty-four. Single mother. Moderate complications, high life expectancy with treatment.

  'The CWI scores Vane at 84.2 and Gower at 71.5,' Henderson said. 'The slot goes to Vane. Higher welfare return.'

  'The unit,' Elena said. Her voice was quiet, but the room tightened. 'Where does the "point" come from, Henderson? You've added pain scores to projected life years. You've treated a week of nausea as equivalent to a month of existence. Who decided that exchange rate?'

  'It's standard weighting,' Henderson replied, shifting in his chair. 'Based on national guidelines.'

  'Guidelines aren't laws of physics. They're choices.' Elena leaned forward. 'You're saying Vane is *better off* than Gower by 12.7 points. But you can't tell me what a point *is*. Is it happiness? Absence of pain? Future potential? If you change the definition, the gap closes. Or flips.'

  Thorne looked up from his file. 'Gower is suffering more,' he said flatly. 'Clinically, his pain profile is catastrophic. Vane is managing.'

  Elena nodded. 'So we agree. Gower is worse off.'

  'Yes,' Thorne said.

  'Then why are we giving the slot to Vane?'

  Thorne blinked. 'Because Vane has more life to save. Gower is... the priority of need, but Vane is the priority of outcome.'

  'There it is,' Elena said, feeling a strange chill. They agreed on the state of the world—Gower was worse off—but they disagreed on what that meant for action. The ranking didn't dictate the choice. The choice dictated the ranking.

  Henderson sighed. 'Look, if we prioritise pure suffering, Gower wins. If we prioritise total welfare generated, Vane wins. The CWI is designed to balance both. It's a calibrated scale.'

  'It's a scale where you can move the fulcrum,' Elena said. 'Show me the weighting.'

  Henderson hesitated, then slid a second sheet across the table. 'There's a sensitivity adjustment. For resource scarcity.'

  Elena scanned the columns. 'If you increase the weighting on "Years of Life Remaining" by ten per cent, Vane's score jumps to 90. If you increase "Current Distress" by ten per cent, Gower overtakes her. Both are measurements of welfare. Both are defensible. But they produce opposite verdicts.'

  'We have to pick one,' Henderson said. 'Doing nothing is also a decision.'

  'I know,' Elena said. 'I'm just saying don't call it measurement. It's legislation.'

  Henderson ignored her, turning to Thorne. 'Can we run the empathy check? Protocol suggests we verify the scores against intuitive judgement.'

  Thorne frowned. 'You mean the veil thing?'

  'Imagine you are both,' Henderson said. 'Imagine living Gower's life up to now, and Vane's life up to now. Then imagine the future with dialysis, and without. Which position would you rather be in? The one you'd rather avoid is the worse off one. That confirms the priority.'

  Elena closed her eyes. She tried it. She imagined being Arthur Gower. The ache in the bones. The feeling of time running out. The dignity of a life completed. Then she imagined being Sarah Vane. The fear for her children. The frustration of interrupted potential.

  Which would she rather avoid?

  'I'd rather not be Gower,' Elena said softly. 'The pain is too immediate.'

  'I'd rather not be Vane,' Thorne said. 'Losing your future feels heavier than ending a past.'

  Henderson looked between them. 'So the empathy test is inconclusive.'

  'Because we aren't blank slates,' Elena said, opening her eyes. 'I'm bringing my own terror of pain into the room. Aris is bringing his clinical focus on prognosis. We aren't measuring their welfare. We're measuring our own reactions to their welfare.'

  She looked at the spreadsheet again. The numbers looked solid, black ink on white paper. They pretended to be cardinal—meaningful quantities that could be added and subtracted. But they were ordinal masquerading as cardinal. They could say Gower was lower than Vane on one scale, and higher on another. But the distance between them? The 12.7 points? That was fiction. It was a number invented to make the choice feel inevitable.

  'We're running out of time,' Henderson said. 'The slot expires at noon. We need a vote based on the CWI as it stands.'

  'Which uses the calibration that favours Vane,' Elena said.

  'Which uses the standard calibration,' Henderson corrected.

  Elena looked at Thorne. He was staring at his hands. He knew Gower was suffering more. He knew the score favoured Vane. He knew the score was arbitrary. He would still vote for Vane.

  'If we give it to Gower,' Thorne said, his voice rough, 'we save less life. If we give it to Vane, we leave a man in pain. I can't solve that. I can only follow the protocol.'

  'Protocol is just yesterday's decision,' Elena said. 'Written by people who are dead.'

  'Dr. Ross,' Henderson said, his patience fraying. 'Do you object to the recommendation?'

  Elena looked at the two files. She realised then that she couldn't say what the right call was. For months she had fought for the 'correct' ethical outcome, as if it were a hidden object in the room they just had to find. But there was no object. There was only the scale.

  If she chose the scale of 'Relief of Suffering', Gower was the right choice. If she chose the scale of 'Maximisation of Future', Vane was the right choice. Neither scale was true. They were tools. To pick one was not to discover the truth, but to declare what kind of hospital this was.

  She had thought the question was *Who deserves this?*
  Now she saw the question was *What do we value?*

  And nobody in the room wanted to admit they were deciding values. They wanted to believe they were reading numbers.

  'Dr. Ross?' Henderson pressed.

  Elena picked up her pen. She could resign. She could scream. Or she could sign, knowing that the signature wasn't an endorsement of the truth, but an acceptance of the procedure.

  'If we change the weighting on distress,' Elena said, 'Gower wins.'

  'We aren't changing the weighting,' Henderson said.

  'So we aren't measuring welfare,' she said. 'We're enforcing a preference.'

  'We're saving a life,' Henderson said.

  'We're choosing which life counts more according to a formula we wrote ourselves,' Elena said. She looked at Thorne. 'You agree Gower is worse off?'

  'Yes,' Thorne said.

  'But you're voting for Vane?'

  'Yes.'

  'Because the scale says so.'

  'Because the programme says so.'

  Elena looked down at the paper. The numbers swam slightly. She realised her objection wasn't that the decision was wrong, but that it was pretend. They were dressing a moral sacrifice in the clothes of arithmetic. She couldn't stop it. She couldn't offer a better number, because any number would be just as made up.

  She signed the form.

  'Recommendation accepted,' Henderson said, gathering the papers. He sounded relieved. The machine was oiled; it turned. 'I'll inform the wards.'

  He left the room, the papers rustling like dry leaves.

  Thorne stayed seated. He looked at Elena. 'You think I'm wrong?'

  'I think you're consistent,' Elena said. 'You chose a scale. You're sticking to it.'

  'What would you have done?'

  Elena looked out at the rain. She thought about the 12.7 points. She thought about Arthur Gower's pain and Sarah Vane's children. She thought about how she had tried to imagine being them and had only found herself.

  'I don't know,' she said. And for the first time, she meant it. 'I only know we shouldn't call it math.'

  Thorne nodded slowly. He stood up, picking up his file. 'Maths is clean,' he said. 'People aren't.'

  He left her alone in the room. The spreadsheet lay on the table, the numbers stark and authoritative. Elena reached out and turned it over. The back was blank. She sat there for a long time, listening to the rain, waiting for a number that didn't exist.
