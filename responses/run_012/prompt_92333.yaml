      *   *Reward Tampering:* In RL theory, this is a known problem (reward hacking, wireheading). The standard view aligns more with Miguel. The reward function is a *proxy* for the designer's intent. Optimizing the proxy directly rather than the intent is generally considered a failure of alignment, even if it satisfies the formal specification.
