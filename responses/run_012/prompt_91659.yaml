answer: |-
  **DEAR CITY LIMITS**

  **Dear City Limits,**

  I can't sleep. I read a blog post explaining that if I consider myself a random human among all humans who will ever live, and I know roughly how many have lived so far, statistics say there probably aren't many left. Does this mean my children are the final generation? Should I stop saving for their college funds?

  **— Statistically Significant in Seattle**

  **Dear Significant,**

  Your anxiety is mathematically sound. This is known as the self-sampling assumption. If you are a random sample from the set of all humans who will ever exist, your birth rank indicates the total population size is likely within a close factor of your current position. Roughly half of all humans are alive now. The rest will follow shortly. To assume otherwise is to claim you are special, which the data forbids.

  You should apply this logic locally to manage expectations. You are currently halfway through your marriage. If you have been together ten years, prepare for dissolution at year twenty. Do not plan anniversaries beyond that horizon. Similarly, if you walk into a dinner party and realize you are the third guest to arrive, assume only six were invited. Do not buy extra ice. To prepare more would be to assume you are not a random observer of the evening, but a privileged one. If you are halfway through the dip, the bowl will soon be empty. Eat quickly.

  Critics argue the "reference class" is subjective. Are you a random human, or a random primate? If primates, we are early. Are you a random conscious observer? If digital minds exist, the math breaks. Furthermore, the prior probability of extinction does the heavy lifting. If you assume humanity lasts a million years, the math adjusts. If you assume doom, the math confirms it. You are essentially calculating the size of a bag by pulling out one marble and declaring the bag small because you didn't pull from the bottom.

  Harold, a certified actuary in your area, writes: "This ignores compound risk. You can't actuarialize the apocalypse based on birth order. It's nonsense. The sample isn't random; you're alive now because conditions allow it." But Harold is likely an outlier in the distribution of advice-givers.

  Ultimately, the choice of reference class determines the outcome. If you define yourself as a "resident of a dying planet," you are correct. If you define yourself as "a person eating chips," the bowl is finite. Save the college funds, but keep them liquid. You probably won't need them, but if you do, you'll be glad you didn't assume you were special enough to require a long-term bond.

  **— City Limits**
