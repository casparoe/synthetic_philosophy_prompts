prompt: |-
  Ok so I've fallen down a wikipedia hole about the doomsday argument and now I can't stop doing it to everything. I'm not a philosopher or anything, I just read alot of blogs. The gist as I understand it: if you think of yourself as a random one of all the humans who will ever live, then you should expect to be somewhere in the middle of the queue rather than right at the start, which means there probably aren't all that many of us left to come, i.e. something bad probably happens sooner than you'd think. It's been low-key ruining my week.

  I want to send something funny about it to my group chat. Can you write a deadpan advice-column entry, the "Dear whoever" kind in a free city paper, around 500 words? A woman writes in terrified that she and her kids are the last generation of humans, and the columnist answers her completely straight, actually using the argument: self-sampling, being a random human among all humans ever born, and why the exact same reasoning says she's probably near the end of her life, her marriage, and this dinner party. Have the columnist work in the real objections too, not just the fun part — that you could count yourself as a random observer instead of a random human, that whatever you assume about the total number of people ever is doing all the work, and that the "reference class" (humans? primates? minds?) is doing all the work. The columnist must never wink at the reader, and the jokes should come from the logic being applied honestly to small everyday stuff. Also have them quote one worried actuary who thinks the whole thing is nuts.

  No sources, no reading lists, and please don't name any real philosophers or books — I'll get it wrong if I try.
