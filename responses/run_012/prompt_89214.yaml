prompt: |-
  Okay, I need someone who actually knows the causation literature, so let me set you up properly: you're a philosopher of causation and action, and I want you to think this through rather than reaching for the nearest textbook answer. Start by brainstorming every place the argument below could be going wrong, put them in a list, and only then tell me which one you'd actually defend. This is an argument one of my students handed in for a seminar on causation and responsibility, and it has the shape of something that proves way too much. I've been circling it for a week and I cant find the exit.

  Here it is, as clean as I can state it:

  (1) An event c is a cause of an event e just in case, had c not occurred, e would not have occurred. This is the difference-making test, and it's supposed to apply whether c is something an agent did or something an agent didn't do.
  (2) A child drowned in a pond I walked past last summer. Had I waded in, the child would have lived; nothing else about the situation would have stopped me saving him.
  (3) I didn't wade in. So by (1), my not wading in is a cause of the child's death.
  (4) There's nothing special about me in (3). Others walked past too, and anyone at all — the man asleep three towns over, my cousin in Lisbon — could have done something such that, had he done it, the child would have lived. By (1), each of them is also a cause of the death.
  (5) Run the same test over deaths from preventable disease. For each such death there's some cheque I didn't write such that, had I written it, that person would have lived. So every one of those deaths has me among its causes.
  (6) To knowingly cause a death when you could have prevented it and had no excuse is to be a killer of the person who died. (The student defends this one: if the doctor who lets a patient die for convenience isn't a killer, and the parent who doesn't feed the child isn't a killer, then who is?)
  (7) So I'm a killer — and not of one person but of thousands. So is anyone with a bank account.
  (8) That's absurd. I'm not a killer of thousands of children, and neither are you.

  So at least one of (1)-(6) has to go, and I want to know which. My instinct is that (1) is the load-bearing piece and I'd hate to lose it, because without something like it I can't see how the doctor who skips a shift, or the accountant who doesn't file the form, is answerable for what follows at all — the difference-making test is the only thing that seems to tie them to the outcome. But a colleague says my problem is that I'm sliding between causation and bare counterfactual dependence, and that the fix is to insist a cause has to be the sort of thing an informed observer would actually single out — he calls it causal selection. Another student says no, keep the causation and kill (6), since killing is something you do and omissions aren't doings. I can feel that each fix has a price, I just can't see the reciepts.

  What I want from you:

  (a) Decide whether the argument is valid as it stands or whether there's a slip — a shift in what 'cause' is doing between the steps, a counterfactual that isn't as clean as (2) makes it sound, a scope mistake in (4)-(5), or something else. If there's a slip, name the exact step and say why it looked fine until I stared at it.
  (b) If there's no slip, tell me which premise is least costly to give up, and price each candidate: dropping (1) as stated, dropping (6), or the causal-selection fix. What does each one commit me to elsewhere?
  (c) Whatever I give up, check it against the doctor who skips the shift. If my fix exonerates him too, it's the wrong fix, and I want to know I'm paying that.
  (d) One more from the student, which may be a bridge too far: if my omission caused the death, and the death caused the mother's grief, does my omission cause the grief? Say whether the test even licenses that, and if it does, whether it makes me a cause of everything downstream.

  Don't just hand me a verdict — show me the step, show me why it looked fine, and then show me the bill.
