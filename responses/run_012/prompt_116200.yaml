  2.  **Identify the Concepts:**

      *   **The Contest:** This is a variation of a **Tullock Contest** or **Rent-Seeking Game**, but with a shrinking prize pool. Specifically, it's a **Common Pool Resource** problem or a **Tragedy of the Commons** variant, but framed as a contest. The specific payoff structure ($P/N^2$) makes it a game where individual rationality leads to over-entry.
      *   **The Reasoning Conflict:**
          *   Standard View: **Nash Equilibrium** based on **Causal Decision Theory (CDT)**. My choice causes my payoff, but doesn't *cause* your choice.
          *   Alternative View: **Superrationality** (Hofstadter), **Evidential Decision Theory (EDT)**, or **Functional Decision Theory (FDT)**. The idea is that if we are identical reasoners, our outputs are correlated, even without causal link.
          *   The specific phrase "everyone in my position sends the same thing" points directly to **Kantian Equilibrium** (Roemer) or **Superrationality**.
      *   **The Family of Situations:** **Social Dilemmas**, specifically **Prisoner's Dilemma** and **Tragedy of the Commons**.
