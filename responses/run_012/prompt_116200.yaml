      *   **Second Scenario:** One-shot Prisoner's Dilemma (PD). Textbook says Defect. "We'd both reason the same way" says Cooperate.
      *   **The Conflict:** Standard Game Theory (Nash Equilibrium/Causal Decision Theory) vs. "Symmetric/Logical" Reasoning (Evidential Decision Theory / Superrationality).
      *   **The Friend's Objection:** The second question is "wishful thinking wearing a symmetry costume."
      *   **The Questions:**
          1.  Is there a name for this reasoning rule or family of situations?
