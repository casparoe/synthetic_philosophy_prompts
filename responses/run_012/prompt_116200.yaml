          *   If I send more, I increase my probability but decrease the prize value for everyone (including myself).
          *   User claims Nash Equilibrium (NE) suggests sending "about as many entries as everybody else put together." (This sounds like a specific game theoretic result, likely related to the Tullock Contest or similar rent-seeking games, but modified).
