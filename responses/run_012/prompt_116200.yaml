answer: |-
  You have put your finger on one of the deepest, most persistent fractures in decision theory and game theory. You are describing the conflict between **Causal Decision Theory (CDT)** and what is variously called **Evidential Decision Theory (EDT)**, **Functional Decision Theory (FDT)**, or **Superrationality**.

  The situation you described (the blog contest) is a variant of a **Tragedy of the Commons** or a **Rent-Seeking Contest** with an endogenous prize. The reasoning conflict you feel is the **Prisoner's Dilemma** in a one-shot setting, viewed through the lens of **logical correlation** rather than causal influence.

  Here is the breakdown of the names, the edges, the premises, and the state of the debate.

  ### 1. The Names

  **The Situation:**
  *   **Social Dilemma:** The broad family. Individual rationality leads to collective irrationality.
  *   **Prisoner's Dilemma (PD):** The canonical one-shot version you mentioned.
  *   **Tullock Contest / Rent-Seeking Game:** The specific math of your blog contest. In standard versions, the prize is fixed; in your friend's version, the prize shrinks with effort, intensifying the waste.

  **The Reasoning Rules:**
  *   **Nash Equilibrium / Causal Decision Theory (CDT):** This is your friend's position. It says: "My choice cannot *cause* your choice. Therefore, I must treat your action as fixed regardless of what I do. Given that, my best move is to defect/over-enter." This is the orthodox consensus in economics and classical game theory.
  *   **Superrationality:** Coined by Douglas Hofstadter. It posits that if two agents are rational and face the same problem, they will arrive at the same solution. Therefore, I should choose the action that, if *both* of us took it, yields the best result.
  *   **Team Reasoning:** (Michael Bacharach). Suggests that in some contexts, rational agents switch from asking "What should *I* do?" to "What should *we* do?" and then play their part in the group plan.
  *   **Kantian Equilibrium:** (John Roemer). You act according to a maxim that you would will to be a universal law for all players in your situation.
  *   **Functional Decision Theory (FDT):** (Yudkowsky/Soares). A modern formalization. It argues you should decide based on the output of your decision *function*. If your decision function outputs "Cooperate," and the other player is running a similar function, they will also output "Cooperate."

  ### 2. The Edges: How it differs from similar concepts

  You asked how this differs from repeated cooperation, coordination, and altruism. These distinctions are crucial.

  **Vs. Repeated Cooperation (Shadow of the Future)**
  *   **Mechanism:** Repeated games rely on *causal* threats and rewards over time ("I will punish you next round if you defect now").
  *   **Difference:** Your scenario is **one-shot**. There is no next round. CDT says cooperation is impossible here without external enforcement. Superrationality/FDT claims cooperation is possible *even here* based on logical correlation, not temporal leverage.

  **Vs. Coordination Problems**
  *   **Mechanism:** Coordination games (like "drive on the left or right?") have multiple Nash Equilibria. Both are stable; the problem is picking the same one.
  *   **Difference:** In the Prisoner's Dilemma or your contest, there is usually only **one** Nash Equilibrium (Defect/Over-enter), and it is Pareto-inferior (everyone loses). The "symmetric" solution (Cooperate/Enter 1) is *not* a Nash Equilibrium under CDT because it is unstable against deviation. Superrationality attempts to make the cooperative outcome stable by changing the definition of rationality.

  **Vs. Altruism (Doing my bit)**
  *   **Mechanism:** Altruism changes the **payoff function**. If I care about your welfare, my utility increases when you win.
  *   **Difference:** Your reasoning ("if everyone in my position does the same") keeps the payoff function **selfish**. You still want the money for yourself. The change is in the **probabilistic link** between actions. You aren't sacrificing for them; you are recognizing that your decision is *evidence* of theirs.

  ### 3. The Premise: When is "Everyone does the same" allowed?

  This is the live wire. When can you legitimately assume your choice predicts theirs?

  **The Causal View (Your Friend)**
  *   **Requirement:** Never.
  *   **Reasoning:** Unless you can physically reach through space and time to move their hand, your choice is causally independent. Assuming otherwise is the **Magical Thinking** objection. It confuses correlation with causation. If you decide to cooperate, the other person has *already* decided (or will decide independently). Your choice doesn't change their brain state.

  **The Logical/Functional View (You)**
  *   **Requirement:** **Logical Correlation.**
  *   **Reasoning:** If we are both rational, have the same information, and face the same problem, we are effectively running the same algorithm. If my algorithm outputs "A," yours must also output "A." It's not magic; it's math. $2+2=4$ for me implies $2+2=4$ for you.
  *   **The Edge Cases:**
      *   **Near Identity:** If the other player is slightly less smart, or has slightly different information, the correlation weakens. FDT handles this by estimating the *degree* of logical correlation. If you are 90% sure they reason like you, you cooperate 90% of the way (metaphorically).
      *   **Different Reasoning:** If you know the other player is a CDT-maximizer (a "defector bot"), then superrationality collapses. You cannot expect them to mirror you if their decision theory forbids it. In that case, CDT is the correct response (Defect).

  ### 4. Settled Science vs. Live Disagreement

  It is vital to know where the map ends.

  **Settled Consensus:**
  *   **Orthodox Game Theory:** In standard economics and classical game theory, your friend is right. The Nash Equilibrium is the solution concept. Superrationality is considered a category error. Textbooks will mark "Cooperate" in a one-shot PD as incorrect.
  *   **Causality:** Physicists and causal theorists agree that your choice does not *cause* the simultaneous choice of a distant agent.

  **Live Disagreements:**
  *   **Normative Rationality:** Philosophers and decision theorists disagree on what "rational" *ought* to mean.
      *   **CDT Camp:** Rationality is about maximizing expected utility given causal constraints. If you cooperate in a one-shot PD, you are vulnerable to exploitation by a defector. Therefore, you are irrational.
      *   **FDT/EDT Camp:** Rationality is about winning. If two FDT agents meet, they cooperate and get the high payoff. If two CDT agents meet, they defect and get the low payoff. Therefore, FDT agents *win* more often against mirrors. They argue CDT is too narrow because it ignores logical dependencies.
  *   **Newcomb's Problem:** This debate often centers on "Newcomb's Problem," a thought experiment where a predictor knows what you will do. CDT says take both boxes; EDT/FDT says take one. This is the same structural conflict as your blog contest. There is no consensus on the "correct" answer among philosophers of decision theory.
  *   **Evolutionary Stability:** Some evolutionary game theorists argue that while Superrationality isn't "rational" in a vacuum, populations that evolve "team reasoning" heuristics outperform populations of strict Nash maximizers. This suggests the "symmetry" reasoning might be biologically adaptive even if logically controversial.

  ### Summary

  Your friend is arguing from **Causal Decision Theory**, which is the standard tool of economics. It treats agents as causally isolated atoms.
  You are arguing from **Superrationality** or **Functional Decision Theory**, which treats agents as instantiations of abstract reasoning patterns that can be correlated.

  **Is it wishful thinking?**
  *   If the other players are **causally independent** and **reason differently** than you: **Yes.** You will be exploited.
  *   If the other players are **logical mirrors** (same info, same rationality): **No.** Your decision is logically linked to theirs. Ignoring that link leaves money on the table.

  The friction you feel is the friction between **physics** (I cannot move their hand) and **logic** (We are running the same code). Standard game theory respects the physics. You are respecting the logic. Neither side has fully conquered the other.
