prompt: |-
  Ok so here's what I need. I'm redoing the first week of my philosophy of psychiatry seminar and I want to open with something that gets students into Hacking's looping effects before we read any Hacking, not after. So think of yourself as equal parts poet and philosopher of science — comfortable in both registers, and knowing this material cold: the whole making-up-people thing, dynamic nominalism, the distinction between what he calls interactive and indifferent kinds. Before you write a word, brainstorm for a few lines and get clear in your own head on why the human case is supposed to be different from classifying, I dont know, quarks, and what exactly is supposed to be looping back onto what. Then write the poem.

  The form I want is a pantoum, and I'm picking it on purpose. A pantoum is built out of lines that keep returning, but every time a line comes back its in a new spot and its been quietly recontextualized by everything around it, and the standard pantoum closes by folding its last line back into its first, so the whole thing is a closed loop. That's the looping effect. Use that. Four or five quatrains.

  The recurring lines should be split between two voices: one is the voice of the manual — the flat clinical register, the kind of sentence that gets written down about somebody — and the other is the voice of the person that sentence is written about. As the poem loops, those two lines should migrate toward each other, so that by the end the manual's line sounds like it's being spoken by the person and the person's line sounds like it's being filed. That migration is the whole point: the classification reshapes the person, the person reshapes the classification, and neither one holds still. If a reader can feel the swap happen in the repetition itself, you've done it.

  A few things I care about:
  - Get the two-way traffic right. This isn't a self-fulfilling prophecy story or a bias story, and it isn't the claim that the category is fake. It's that human kinds are the sort of thing that can be changed by being known, and the knowers are part of what they're studying.
  - Stay honest about the suffering. These are people in real distress. Don't turn them into a cute illustration of a metaphysics point, and don't let it curdle into either an indictment or a defense of psychiatry. Hacking is mostly descriptive; the poem should be too.
  - Feel free to lean on the multiple personality / dissociative identity business as your example of a category that visibly moved under its own feet — you know that history, I don't need to spell it out here.
  - Don't just name the concepts at me. Looping effect and interactive kind shouldn't appear in the poem at all. A student who's never read a word of Hacking should finish it and get the idea, and a student who has should not wince.

  After the poem, give me one short paragraph, five sentences max, on what you did with the form, so I have something intelligent to say when a student asks why it keeps repeating. And if you end up having to choose between the poem being good and the philosophy being tight, tell me where you compromised instead of pretending you didn't.
