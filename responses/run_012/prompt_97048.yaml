  ### The Circular Decree

  The rule declares it may be cast aside.
  We stand upon the words we seek to break.
  The change confers the power to decide.

  No wall is built too high for us to make.
  The rule declares it may be cast aside.
  What holds the pen is but the pen's own stake.

  There is no ground beneath the shift and quake.
  The change confers the power to decide.
  No promise is too solemn to forsake.

  Who guards the guard? There is no one to wake.
  The rule declares it may be cast aside.
  We pick the lock with keys the system makes.

  The permanent is but a mask we take.
  The change confers the power to decide.
  There is no shore beyond this legal lake.

  So round we spin, no anchor left to make.
  The rule declares it may be cast aside.
  The circle seals; no solid earth to shake.
  The change confers the power to decide.
