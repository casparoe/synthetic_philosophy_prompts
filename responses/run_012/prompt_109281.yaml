answer: |-
  **1. Exam Question**

  Gongsun Long argues that because 'horse' designates shape and 'white' designates colour, 'a white horse is not a horse'. Consider the contrast between this claim and the statement 'a stone lion is not a lion'. The latter is a truism; the former a paradox. Explain why the modifying term functions differently in each case. Does the Advocate treat 'white horse' as narrowing a kind or withdrawing it altogether? Conclude by assessing whether the argument concerns actual animals or the logic of terms.

  ***

  **2. Model Answer**

  The statement 'a stone lion is not a lion' is true because the modifier 'stone' withdraws the kind entirely. A stone lion is a statue; it possesses the shape of a lion but lacks the biological essence required for membership in the kind 'lion'. The compound term 'stone lion' picks out an object that falls outside the extension of 'lion'. In ordinary usage, however, 'a white horse is a horse'. The modifier 'white' narrows the kind rather than withdrawing it. A white horse is a subset of horses; it possesses the shape of a horse and the biological essence, merely specified by a colour attribute. The paradox arises because Gongsun Long treats the second case as if it were the first.

  To understand why, we must look at the Advocate's opening move. He claims 'horse' designates shape and 'white' designates colour. Since what designates colour is not what designates shape, the compound 'white horse' is not the simple 'horse'. Here, the argument shifts from zoology to semantics. He is not denying that white horses are animals; he is denying that the *term* 'white horse' is identical to the *term* 'horse'. If 'horse' picks out shape alone, and 'white horse' picks out shape plus colour, then the criteria for applying the terms differ. Therefore, the designata are not identical.

  Does this treat 'white horse' as withdrawing the kind? In a sense, yes, but only at the level of concepts. Just as 'stone' negates the biological status of 'lion', 'white' negates the semantic sufficiency of 'horse'. The Advocate argues that if you ask for a 'horse', a yellow or black one will do; if you ask for a 'white horse', they will not. Because the conditions of satisfaction differ, the terms are not interchangeable. He treats the addition of 'white' as creating a new designation that excludes the unmodified kind, much like 'stone' excludes the biological kind. However, unlike the stone lion, the white horse still falls under the biological category. The withdrawal is logical, not ontological.

  This leads to the question of what the argument is about. If it were about animals, the claim would be false. A white horse is undeniably a horse. Therefore, the argument must concern the logic of terms. The Advocate is highlighting the difference between a simple kind-term and a compound kind-term. He insists on strict non-identity between the concept of the compound and the concept of the simple. The Objector's push—that there are no colourless horses—misses this point. The Objector is talking about reality (there are no abstract horses), while the Advocate is talking about language (the concept 'horse' is distinct from 'white horse').

  Is a charitable reconstruction a replacement for the original claim? It depends. If we read him as making a point about semantic intension, the argument is valid but trivial: the concept 'white horse' is not identical to the concept 'horse'. This saves the logic but deflates the paradox. If we read him as denying class membership, he is simply wrong. The most charitable reading recognises he is exploiting the ambiguity between 'is' of identity and 'is' of predication. He treats 'a white horse is a horse' as an identity claim (False) rather than a predication claim (True). Thus, the reasoning trades on the 'withdrawing' pattern of the stone lion to confuse the listener, but ultimately rests on a rigid distinction between names. The paradox survives only if we conflate the name with the object. Once we recognise the argument concerns the logic of terms, the paradox dissolves into a technical point about designation.

  ***

  **3. Marking Scheme**

  **Total: 20 Marks**

  1.  **Stone Lion vs. White Horse Distinction (4 marks)**
      *   *Required:* Clearly explains that 'stone' excludes biological kind membership (withdrawal) whereas 'white' normally specifies a subset (narrowing).
      *   *Mistake:* Treating both cases as identical or failing to note the biological reality of the horse.

  2.  **Analysis of the Opening Move (4 marks)**
      *   *Required:* Correctly utilises the shape/colour designation premise to explain why the Advocate claims non-identity of terms.
      *   *Mistake:* Ignoring the shape/colour premise or reducing it solely to 'equivocation' without explanation.

  3.  **Narrowing vs. Withdrawing (4 marks)**
      *   *Required:* Identifies that the Advocate treats 'white horse' as withdrawing the kind *semantically* (different criteria) even if not *ontologically*.
      *   *Mistake:* Claiming the Advocate denies white horses are animals, or failing to distinguish semantic from ontological withdrawal.

  4.  **Terms vs. Animals (4 marks)**
      *   *Required:* Explicitly concludes the argument concerns the logic of terms/designations (*ming*) rather than physical animals (*shi*).
      *   *Mistake:* Insisting the argument is primarily about zoology or physical reality.

  5.  **Charity and Reconstruction (4 marks)**
      *   *Required:* Evaluates whether the semantic reading saves the argument (valid but trivial) or replaces it (sophistry), addressing the 'identity vs. predication' issue.
      *   *Mistake:* Offering a flat judgement ('he is wrong') without assessing the charitable reconstruction's validity.

  **Grade Boundaries:**
  *   **17–20 (A):** Seamless integration of all five points; clearly distinguishes semantic non-identity from class membership; nuanced evaluation of charity.
  *   **12–13 (B):** Hits all five points but mechanically; distinguishes stone lion/white horse but struggles to articulate *why* the Advocate conflates them; clear but less nuanced on the charity condition.
