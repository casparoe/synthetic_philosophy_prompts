  Here is a decision tree designed for your 90-minute session. It avoids jargon at the branch points, forcing participants to commit to concrete intuitions before revealing the philosophical label of their position.

  ### The Einstein's-Book Decision Tree

  **Node 1 (Agency & Speed):**
  A clerk turns the pages of the book, following the transition rules, at a rate of one page per century. Is Einstein's mind currently thinking *in the book*?
  *   **Yes** → Go to Node 2.
  *   **No** → Go to Node 4.

  **Node 2 (Agency):**
  If the clerk dies and stops turning pages, does the thinking pause, or was the book doing the thinking all along?
  *   **The clerk was doing it** → **Leaf A:** *No, it's a description of a computation and not a computation.* (The book is static data; the clerk is the processor.)
  *   **The book was doing it** → Go to Node 3.

  **Node 3 (Speed):**
  Is one thought per century a difference in *kind* (too slow to be a mind) or just a difference in *degree* (a very slow mind)?
  *   **Difference in kind** → **Leaf B:** *There's no fact of the matter here and we're really asking what it's useful to say.* (The boundary is vague/pragmatic.)
  *   **Difference in degree** → **Leaf C:** *Yes and it's just slow.* (Standard Functionalism.)

  **Node 4 (Substrate):**
  If we rebuilt this system using biological neurons firing in the exact same pattern instead of ink on paper, would consciousness appear?
  *   **No** → **Leaf D:** *No, wrong stuff.* (Biological Naturalism.)
  *   **Yes** → Go to Node 5.

  **Node 5 (Implementation):**
  Does a rock on the beach implement this same computation if we map its atomic states to the book's states?
  *   **Yes** → **Leaf E:** *Yes but only trivially, since everything implements everything under some description, so you need a non-trivial notion of implementation before the question is even askable.* (Pancomputationalism/Triviality.)
  *   **No** → Go to Node 6.

  **Node 6 (Internalization):**
  If a person memorises the whole description and recites it to themselves over forty years, does the reciting count as the same thing as the book doing it?
  *   **Yes** → **Leaf A:** *No, it's a description of a computation and not a computation.* (The book is the map; the reciting is the territory. The book itself isn't computing.)
  *   **No** → **Leaf D:** *No, wrong stuff.* (Even the process isn't enough without the specific causal powers of the brain.)

  ***

  ### Analysis for the Facilitator

  #### 1. The Trivial-Implementation Horn
  If a participant takes the trivial-implementation horn (answering **Yes** at **Node 5**), they land on **Leaf E**.
  *   **Position:** This is the Putnam/Searle critique of computationalism. They accept that the book *can* be mapped to a computation, but they argue that because *anything* can be mapped to a computation (even a rock), "computation" is too cheap a property to ground "mind." They effectively block the move from Node 4 (Neurons work) to Node 1 (Book works) by demanding a non-trivial theory of implementation.

  #### 2. Collapsed Leaves
  You suspected the **Slow** leaf (Leaf C) and the **Trivial** leaf (Leaf E) might collapse. Your suspicion is well-founded, though they appear on opposite sides of the tree.
  *   **The Collapse:** These two leaves are unstable if held simultaneously. To reach **Leaf C** ("Yes, it's just slow"), you must believe the book is *genuinely* computing (Node 5 = No). To reach **Leaf E** ("Yes, but trivially"), you believe the book computes *only* because everything computes (Node 5 = Yes).
  *   **Why they blur:** If a participant argues for **Leaf C** but admits that implementation is trivial (**Leaf E** logic), their position collapses into Panpsychism (if everything computes and computation = mind, everything thinks) or Eliminativism (if computation is trivial, it doesn't explain mind). The tree separates them logically, but philosophically, accepting "Slow Mind" usually requires denying "Trivial Implementation." If you can't separate the book from the rock regarding implementation, you can't separate the book from the rock regarding mind.

  #### 3. Empty Combinations
  There are two combinations of answers that the tree renders empty (paths that no coherent position occupies):

  *   **Node 1 (Yes) + Node 4 (No):** *"The Book thinks, but Neurons don't."*
      *   **Status:** **Unattractive/Unexplored.**
      *   **Reason:** This claims that paper-and-ink running a state-description generates consciousness, but biological tissue running the *exact same state-description* does not. There is no known philosophical position that privileges inert paper over active biology for consciousness generation. This would be a form of "Paper Naturalism."

  *   **Node 1 (Yes) + Node 5 (Yes) + [Denial that Rock Thinks]:** *"The Book thinks, the Rock computes, but the Rock doesn't think."*
      *   **Status:** **Incoherent.**
      *   **Reason:** If you say the Book thinks because it implements a computation (Node 1 = Yes), and you admit the Rock implements the same computation (Node 5 = Yes), you are logically committed to the Rock thinking as well. Denying this requires asserting that "Computation = Mind" for the book but "Computation ≠ Mind" for the rock, despite the computation being identical in status (trivial). This is only coherent if you are a Panpsychist (Rock thinks too).

  ### Session Tips
  *   **Time Management:** Spend the first 20 minutes on Node 1 & 2 (The Clerk). This is the most visceral part of the thought experiment.
  *   **The Pivot:** Use Node 5 (The Rock) to break the tie. If the group is stuck between "Yes it thinks" and "No it doesn't," ask the Rock question. It usually forces the "Trivial" leaf or clarifies the "Description" leaf.
  *   **Leaf A Ambiguity:** Note that **Leaf A** is reached via two different paths (Node 2 and Node 6). Use this to show the group they agree on the outcome (Book ≠ Mind) but disagree on the *reason* (Agency vs. Internalization). This fulfills your goal of showing they were disagreeing about different things.
