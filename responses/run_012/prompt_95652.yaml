answer: |-
  The German legal arrangement regarding animals—specifically the 2002 amendment to Article 20a of the Basic Law (*Grundgesetz*) and the Animal Welfare Act (*Tierschutzgesetz*)—represents a sophisticated hybrid position. It occupies a middle ground between the traditional view of animals as property and the radical view of animals as legal persons.

  Here is a reconstruction of the implicit theory, a distinction between what the system presupposes versus what it merely accommodates, and an analysis of the structural changes required if animals were owed duties directly.

  ### 1. The Implicit Theory: Intrinsic Value Without Legal Subjectivity

  The arrangement presupposes a theory of **Sentientist Protectionism** or **Moral Objecthood**.

  Under this theory, animals are recognized as **entities of intrinsic moral value** rather than mere things (*Sachen*). Their capacity to suffer grants them a moral claim on the political community, independent of their utility to humans. This is evidenced by the constitutional clause covering species "not useful to us" and the criminal law's focus on the animal's "own avoidable suffering."

  However, this moral value does not translate into **legal subjectivity**. Animals are not viewed as moral agents or rights-bearers (*Rechtssubjekte*), but as **protected legal objects** (*geschützte Rechtsgüter*). The duty to protect them is owed by the state to the moral order (or to society's conscience), not to the animals themselves. Consequently, animals lack the legal capacity to hold claims, meaning they cannot enforce their protection through standing in court. The state acts as a paternalistic guardian, balancing the animal's intrinsic worth against other constitutional goods (like freedom of religion, scientific freedom, or property rights) without the animal having a veto.

  ### 2. Strict Presupposition vs. Mere Fit

  To understand the coherence of this system, we must distinguish between what the law *requires* to be true (presupposition) and what philosophical views are merely *compatible* with it (fit).

  **What the Practice Strictly Presupposes:**
  *   **Sentience creates Moral Considerability:** The law strictly presupposes that an animal's pain is a bad thing *for the animal*, not just for the human observer. If the badness were purely instrumental, the law would not specify protection for "non-useful" species.
  *   **Humans are Moral Agents, Animals are Not:** The system presupposes a categorical distinction in agency. Humans bear duties; animals bear interests. Because animals cannot reciprocate duties or articulate claims in a legal forum, they are excluded from the community of rights-bearers.
  *   **Interests are Commensurable:** By framing protection as a "state objective" to be weighed against other goods, the law presupposes that animal suffering and human interests (economic, religious, cultural) exist on a single scale of value that the state is authorized to balance.

  **What the Practice Merely Fits With (but does not require):**
  *   **Kantian Indirect Duty:** The prompt notes that Kant's view fits the "objective, not a right" form. This is true regarding *standing*: both Kant and the German Constitution deny animals the ability to sue. However, the German law *contradicts* the Kantian rationale. Kant forbids cruelty because it dulls human sympathy; the German law forbids it because of the *animal's suffering*. Thus, Kantianism fits the *procedure* but not the *substance*.
  *   **Utilitarianism:** The "weighing" of constitutional goods fits a utilitarian calculus. However, the elevation of animal protection to a constitutional *objective* suggests a deontological constraint (the state *must* pursue this end) that pure utilitarianism does not strictly require.
  *   **Stewardship/Religious Models:** The idea of humans as protectors fits religious stewardship models. However, the law is secular and grounded in the animal's physical suffering, not a divine command.

  ### 3. The Shift to Direct Duties (Animals as Rights-Bearers)

  If the legal order shifted from viewing animals as objects of state protection to subjects owed duties directly (correlative to animal rights), the transformation would be radical across three domains:

  **A. The Constitution (From *Staatsziel* to *Grundrecht*)**
  *   **Current:** Article 20a is a *Staatszielbestimmung* (state objective). It directs state action but creates no individual claim.
  *   **Change:** The clause would need to be drafted as a **subjective fundamental right** (e.g., "Animals have a right to life and bodily integrity").
  *   **Consequence:** This grants **legal standing** (*Klagebefugnis*). Guardians or advocates could sue the state or private parties on behalf of specific animals. Crucially, rights generally trump policy objectives. In a balancing test, a fundamental right usually requires "strict scrutiny," meaning animal interests could not be overridden by mere economic convenience or tradition, but only by compelling state interests (likely excluding food production).

  **B. Criminal Law (From Welfare to Justice)**
  *   **Current:** The Animal Welfare Act criminalizes "cruelty" and "avoidable suffering." The focus is on the *act* of the human and the *minimization* of pain.
  *   **Change:** The law would shift from "welfare regulation" to **rights violation**. The focus would move from "unnecessary pain" to "unauthorized infringement."
  *   **Consequence:** Defenses based on "social adequacy" (e.g., standard farming practices) would vanish. Killing an animal would theoretically be treated akin to homicide or assault, requiring a justification like self-defense (which rarely applies to livestock). The concept of "avoidable" suffering would be replaced by a presumption against *any* imposed suffering, shifting the burden of proof entirely to the human actor to demonstrate absolute necessity.

  **C. Ordinary Farming and Slaughter (From Regulation to Abolition)**
  *   **Current:** Slaughter is permitted if "humane" (stunning required, with religious exceptions). Confinement is permitted within welfare limits.
  *   **Change:** If animals are owed direct duties, they possess a **right to life** and **bodily integrity**.
  *   **Consequence:**
      *   **Slaughter:** Institutionalized killing for food would likely become unconstitutional. You cannot balance a right to life against a consumer's preference for meat. Slaughter would move from a regulated industry to a criminal act, permissible only in extreme necessity (survival).
      *   **Farming:** Practices involving confinement, separation of young, or genetic manipulation would constitute false imprisonment or mutilation. The "property" status of livestock would be dissolved. Farming would cease to exist in its current form, potentially replaced by non-exploitative coexistence or strictly sanctuarial models.

  ### Summary
  The German system presupposes that animals are **morally considerable sentient beings** but **legally incapacitated objects**. It rejects the Kantian view that their suffering is irrelevant, yet rejects the Rights view that their suffering grants them legal agency. To move to a system of direct duties would require dismantling the property status of animals, granting them legal standing, and transforming animal welfare law from a regulation of human conduct into a vindication of animal entitlements, effectively rendering industrial animal use legally impossible.
