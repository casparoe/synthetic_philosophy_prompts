          *   Scope: Not confined to useful species.
          *   Criminal Law: Criminalizes cruelty. Protection is of the *individual animal* from avoidable suffering, pain, and harm.
          *   Tension: Kantian view (duties *concerning* animals) fits the "objective not right" form, but the focus on the animal's *own suffering* suggests something more.
      *   **Tasks:**
          1.  Reconstruct the implicit theory of animals' moral status presupposed by this arrangement.
          2.  Distinguish what the practice *strictly presupposes* vs. what it *merely fits with*.
          3.  Explain what would have to change (constitution, criminal law, farming/slaughter) if animals were owed duties *directly* (subjective rights) rather than being objects of duties.

  2.  **Deconstruct the Legal/Moral Arrangement:**
      *   *Constitutional Level:* "State Objective" (*Staatsziel*). This means the state must *consider* animal protection, but it can be balanced against other interests (e.g., religious freedom, economic interests, scientific research). It's not absolute. Animals cannot sue.
      *   *Criminal Level:* Animal Welfare Act (*Tierschutzgesetz*). Focuses on "avoidable suffering." This implies the animal's experience matters intrinsically, not just instrumentally.
      *   *The Tension:* If it were purely Kantian, the law would focus on the human's moral degradation. But the law focuses on the animal's pain. So, it's not purely Kantian. But if it were purely Rights-based (Regan/Singer style), the animal would have standing and the right would likely trump utilitarian calculations more often. It's a hybrid.

  3.  **Task 1: Reconstruct the Implicit Theory:**
      *   What view of moral status fits "State must protect, but animal has no claim, yet animal's pain matters"?
      *   *Candidate 1: Indirect Duty (Kant).* Fits the "no right" part. Fails the "animal's own suffering" part.
      *   *Candidate 2: Direct Duty/Right Holder (Regan).* Fits the "suffering matters" part. Fails the "no right/enforceability" part.
      *   *Candidate 3: Sentientist Protectionism / Ethical Objecthood.* Animals are morally considerable *in themselves* (intrinsic value) due to sentience, but they are not legal *persons* or *rights-bearers*. They are "protected objects" of high moral value. The state has a duty to protect them *for their own sake*, but this duty is owed to the moral order/society, not to the animal directly.
      *   *Label:* Let's call it "Intrinsic Value without Legal Personality" or "Protected Moral Objecthood." It acknowledges sentience creates moral claims on the *state*, but not actionable claims by the *subject*.

  4.  **Task 2: Distinguish Strict Presupposition vs. Mere Fit:**
      *   *Strict Presupposition (What *must* be true for the law to make sense):*
          *   Animals have intrinsic value (otherwise why protect non-useful species?).
          *   Suffering is bad *for the animal* (otherwise why focus on avoidable pain?).
          *   Animals lack legal agency/capacity (otherwise they could sue).
          *   Human interests can legitimately override animal interests in some cases (otherwise it would be an absolute right).
      *   *Mere Fit (What is compatible but not required):*
          *   Kantian indirect duty (compatible with no rights, but contradicted by the focus on animal suffering).
          *   Full Utilitarianism (compatible with weighing interests, but the constitution elevates animal protection to a specific state goal, suggesting deontological constraints).
          *   Religious/Stewardship models (fits the "protection" vibe, but the law is secular).
      *   *Crucial Distinction:* The law *presupposes* animals are morally considerable entities (not things), but *fits* with a paternalistic legal structure where humans decide the balance.

  5.  **Task 3: What Would Change if Animals Were Owed Duties Directly (Subjective Rights)?**
      *   *Concept:* Moving from *Staatszielbestimmung* (State Objective) to *Grundrecht* (Fundamental Right) or Legal Personality.
      *   *Constitution:*
          *   Change "State shall protect" to "Animals have the right to..."
          *   Standing: Animals (via guardians) could sue the state or private actors.
          *   Balancing: Animal rights would likely trump mere economic convenience or tradition (strict scrutiny).
      *   *Criminal Law:*
          *   Shift from "Cruelty" (human act focused) to "Violation of Rights" (victim focused).
          *   "Avoidable" becomes harder to justify. Necessity defenses shrink.
          *   Victim status in court.
      *   *Farming/Slaughter:*
          *   Current: "Humane" slaughter, stunning required but exceptions exist.
          *   New: If there is a right to life or bodily integrity, industrial farming might be unconstitutional. Slaughter might be banned entirely (unless strict self-defense/necessity, which doesn't apply to food).
          *   "Avoidable suffering" in farming (confinement) becomes a rights violation, not just a welfare infraction.

  6.  **Drafting the Response (Iterative refinement):**
      *   *Introduction:* Acknowledge the German model (Basic Law Art. 20a). State the core tension.
      *   *Section 1: The Implicit Theory.* Define it as "Intrinsic Value without Legal Subjectivity." It rejects the "thing" status but stops short of "person" status. It's a duty of the state to the moral order regarding sentient beings.
      *   *Section 2: Presupposition vs. Fit.*
          *   *Presupposes:* Sentience matters intrinsically. Humans are moral agents responsible for them.
