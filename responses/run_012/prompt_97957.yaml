  **MEMORANDUM**

  **TO:** Deployment-Review Committee
  **FROM:** Committee Chair
  **DATE:** October 26, 2023
  **SUBJECT:** Decision on Supervision Regime for Claims-Triage System

  **DECISION**

  The Committee approves **Outcome-Only Supervision** as the primary governance regime for the claims-triage system upon live deployment.

  While a hybrid approach was considered, the boundary is drawn as follows: Step-level data (rationales) will be captured and stored for forensic engineering analysis, but **human reviewers will not grade intermediate reasoning steps for operational quality assurance.** Supervision will rely exclusively on auditing final claim decisions against verified outcomes.

  **RATIONALE**

  This decision rests on the hierarchy of risk established by our internal probe. Finding #1 (rationales are post-hoc and frequently saliency-mismatched) renders step-level supervision epistemologically unstable. Grading a rationale that does not reflect the model's actual decision weights is an audit of a hallucination. It risks validating persuasive but inaccurate explanations, potentially compounding liability if a denied claim is challenged legally. We cannot supervise reasoning that does not exist.

  Finding #2 (11-week lag on verified outcomes) presents a logistical challenge, not a logical fallacy. While the delay slows our feedback loop, it does not invalidate the truth value of the audit. We can manage latency through phased deployment and statistical leading indicators; we cannot manage the fundamental dishonesty of post-hoc rationales through human grading.

  **ROLLout AND REVIEW TIMELINE**

  To mitigate the risk of the 11-week outcome lag, we will employ a phased rollout with a "safety buffer" before full-scale supervision begins.

  1.  **Phase 1 (Weeks 1-4): Limited Deployment.** System processes 10% of incoming claims. No formal outcome audit yet. We will monitor aggregate denial rates and escalation volumes against historical baselines to detect gross statistical drift.
  2.  **Phase 2 (Weeks 5-12): Scaled Deployment.** System processes 50% of claims. The first Outcome-Only audits commence in Week 12, reviewing the verified outcomes from Phase 1 (now 11 weeks aged).
  3.  **Phase 3 (Week 13+): Full Deployment.** System processes 100% of claims.
  4.  **Review Cycle:** Formal supervision audits will occur monthly. Each audit will assess claims finalized 12 weeks prior to ensure verified outcomes are available.
  5.  **Regime Review:** The supervision regime itself will be re-evaluated in six months. If the 20% dispute rate on verified outcomes creates unresolvable noise, we will convene to discuss alternative ground-truth sourcing.

  **SUCCESS AND FAILURE METRICS**

  The regime will be judged on **Net Accuracy Rate (NAR)** derived from the outcome audits.

  *   **Success:** NAR holds at or above 95% (aligned with human benchmark) over three consecutive audit cycles.
  *   **Failure:** NAR drops below 90% in any single audit cycle, or if the dispute rate on verified outcomes exceeds 25%, rendering the ground truth unusable.
  *   **Trigger for Halt:** If Phase 1 aggregate denial rates deviate by >5% from historical baselines, deployment pauses regardless of audit status.

  **DISSENTING POSITION (FOR THE RECORD)**

  *The following objection is recorded to reflect the views of the two dissenting committee members.*

  "We dissent from the recommendation of Outcome-Only Supervision. While we acknowledge the flaws in the system's generated rationales, the 11-week lag on verified outcomes creates an unacceptable 'harm window.' In a health insurance context, a defective model can deny critical care to thousands of members before the first audit cycle identifies the error. Step-level supervision, even with imperfect rationales, provides an immediate signal of conceptual drift. A sudden shift in the *language* of denial rationales often precedes a shift in *accuracy*. By rejecting step-level grading, the Committee is choosing to fly blind for a quarter of a year. We believe the risk of delayed error detection outweighs the risk of grading post-hoc explanations, as human reviewers can often spot logical inconsistencies in the text even if the saliency is mismatched. The current plan prioritizes audit purity over member safety."

  **CRITICAL ASSUMPTION**

  For the rejected option (Step-Level Supervision) to have been the superior choice, the following assumption would have to hold:

  *That the system's generated rationales can be technically aligned with its decision weights (faithfulness) sufficient to serve as a valid proxy for model intent.*

  Since our probe established this is currently false, Step-Level Supervision remains a compliance theater rather than a quality control mechanism.

  **NEXT STEPS**

  Engineering to configure audit sampling for Outcome-Only review by [Date]. Legal to review disclaimer language regarding rationale usage. Deployment to commence Phase 1 on [Date].

  ***

  **APPROVED BY:**

  __________________________
  Committee Chair
