      *(Refining the "Plan" case)*: In (iii), the user asks "Shouldn't I not book it?" That's precommitment. But the user asks "Shouldn't I hold the attitude now?" (i.e., wish I hadn't booked it now). That's different. The literature says no, you shouldn't necessarily change your current desire, you should bind your future choice. This highlights the Belief/Desire asymmetry.

