          *   Decision Theory distinction: Evidential Decision Theory (EDT) vs. Causal Decision Theory (CDT). Updating now is evidential; stopping the wine is causal control.
      *   **Does the Shape Hold Across Domains?**
          *   Credences (i, ii, iv): Yes, Reflection applies (with caveats for ii).
          *   Preferences/Plans (iii): No. This is **Time Inconsistency** or **Dynamic Choice**. The norm isn't to change preferences now (that would be adaptive preference formation, often seen as sour grapes), but to bind the future self.
          *   *Conclusion:* The analogy breaks between *belief* and *desire*.
      *   **Coining a Term:** If the user wants a label for the *general* intuition before the split: **"Anticipatory Normativity"** or **"Diachronic Alignment Pressure"**. Let's go with **"Diachronic Coherence Pressure"**.
      *   **Boundary Cases:**
