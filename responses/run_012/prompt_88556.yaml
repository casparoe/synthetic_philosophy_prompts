  5.  **Refining the Tone and Language:**
      *   Ensure British English (e.g., "labelled," "centre," "whilst," "maths," "programme").
      *   Maintain the persona: respectful, academic but conversational, precise.
      *   Check constraints: No citations. Focus on concepts.
