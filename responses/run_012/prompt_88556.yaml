prompt: |-
  I'm a third-year PhD student in cognitive science — I run forecasting experiments, mostly on how people predict their own future opinions and tastes — and I've drifted far enough into the philosophy of it all that I need someone who actually knows the formal epistemology and decision theory literature to help me. So please take that role. Think it through slowly rather than giving me the first label that comes to mind, and start by brainstorming the candidates before you commit, because I'd much rather have a careful "it's roughly X, but the fit is bad in these three ways" than a confident wrong name. No need for citations or a reading list, by the way — I can't get at the library from here anyway. I'm after the concepts.

  Here's what keeps bugging me. It's the same shape in about four different places and I don't have a word for it.

  (i) I know that when the second half of the report arrives tomorrow I'll come out of it thinking the hypothesis is probably true. Right now I'm honestly 50/50. A friend in my reading group says I'm being incoherent: if I'm sure I'll end up believing it, I should just believe it now. I half agree and half think that's mad, and I can't say which half is right.

  (ii) Same shape, opposite pull: I know that after two glasses of wine I'll be far more confident my paper is any good. Nobody thinks that means I should be more confident now. But the only reason anyone ever gives is that the wine isn't evidence — and that seems to be precisely the thing in dispute.

  (iii) Same shape with plans: I'm sure that in a week, tired, I'll wish I hadn't booked the flight. So shouldn't I not book it? That feels different from (ii), but I couldn't tell you why.

  (iv) Same shape with disagreement: I'm told that after a long talk with a colleague I respect, I should end up roughly where I expect us to end up — and that I should already be there.

  So the rough shape is: if I'm confident about the attitude I'll hold after some process, there's pressure to hold it now, unless I think the process is a bad one. Does that have a name? I've definately got a feeling it's a known thing in formal epistemology and that some betting-style argument sits behind it, but also a feeling that the literature version is much narrower than what I've described.

  What I actually want from you:

  - The established concept (or concepts) closest to this, stated precisely, plus the strongest argument for it.
  - Where it breaks. I'm especially bothered by this: in both (i) and (ii) my future self disagrees with my present self, and in both cases the escape route is "your future self isn't to be trusted here" — but the only evidence I have that the future self is untrustworthy is that it disagrees with me. That can't be the whole story. How does the literature get out of that, or does it?
  - Why is the pressure always one-directional? Everyone says "then be more confident now"; nobody says "then make sure the wine doesn't happen". Those look like two ways of becoming coherent, and if the second is a cheat I want to know why.
  - Does the general shape have a name of its own, or does the analogy break between credences, tastes and plans? If it breaks, say exactly where.
  - If there's no name for the general shape, coin one, define it, and give me boundary cases: clearly in, clearly out, and the awkward ones — say, where the later attitude isn't a revision of mine but a replacement of it, or where I'll have forgotten the reasons I now have.

  Please don't just hand me a label. I want the carving: what the thing is, what it isn't, and where its edges are. British English throughout, please.
