answer: |-
  Right, let's take this apart properly. You've spotted a genuine structural tension that sits right at the fault line between epistemology and decision theory. It is tempting to slap a single label on this, but your instinct that the literature version is narrower than your intuition is correct. If I give you a confident name now, I'll be doing you a disservice.

  Here is the slow carve-up of the concept, the arguments, the fractures, and a proposal for how to talk about the general shape.

  ### 1. The Established Concept: The Reflection Principle

  The closest established concept to your 'shape' is **Van Fraassen's Reflection Principle**.

  To state it precisely: Your current credence in a proposition $A$, conditional on the fact that your future credence in $A$ will be $x$, ought to be $x$.
  Formally: $C_t(A \mid C_{t+k}(A) = x) = x$.

  In plain English: If you are certain now that you will believe something to degree $x$ later, you should believe it to degree $x$ now.

  **The Strongest Argument: The Diachronic Dutch Book**
  The justification is pragmatic, specifically a betting argument. If you violate Reflection, you are vulnerable to a 'Dutch Book'—a set of bets offered at time $t$ and time $t+k$ that guarantees you a loss, regardless of how the world turns out.
  *   **Scenario:** Suppose you think $P(Hypothesis) = 0.5$ now, but you know tomorrow you will think $P(Hypothesis) = 0.9$.
  *   **The Exploit:** A bookie can sell you a bet today that pays out if the hypothesis is false (based on your current 0.5 price). Tomorrow, when your price has risen to 0.9, the bookie buys the bet back from you at the higher price.
  *   **The Result:** Because your prices shifted without new evidence forcing the shift (you *anticipated* the shift), you have paid more to get out of the position than you gained entering it. You've lost money simply by waiting. Reflection prevents this guaranteed loss.

  This covers your cases (i) and (iv) very well. In (i), if you trust the report process, you should update now. In (iv), if you trust your colleague's reasoning, you should converge now.

  ### 2. Where It Breaks: The Etiology of Belief

  You asked specifically about the circularity: *"The only evidence I have that the future self is untrustworthy is that it disagrees with me."*

  The literature does not accept that premise. The escape route from Reflection (which handles your wine case, ii) is not based on the *content* of the future belief, but on the **etiology** (the causal history) of that belief.

  **The Distinction:**
  *   **Epistemic Updating:** The future belief is formed by processing evidence via a reliable cognitive mechanism. (Case i & iv).
  *   **Causal Manipulation:** The future belief is formed by a process that bypasses evidence tracking. (Case ii).

  **Addressing the Circularity:**
  You are worried that you only know the wine is 'bad' because it leads to a belief you currently reject. That would be circular. But in reality, your judgement that the wine is 'bad' evidence comes from your background theory of ethanol and neurochemistry, not from the specific belief about the paper.
  *   You have independent access to the *process*. You know ethanol degrades cognitive reliability.
  *   Therefore, you don't discount the future self because it disagrees; you discount it because the *channel* of information is corrupted.

  **The Fracture:**
  Reflection holds only if you regard your future self as a **rational agent** who will update on evidence. If you regard your future self as a **physical system** subject to causal forces (like intoxication), Reflection dissolves. The literature handles this by saying Reflection applies to 'rational belief revision', not 'belief change simpliciter'.

  ### 3. The One-Directional Pressure

  Why does everyone say "be more confident now" rather than "stop the wine"?

  This is a distinction between **epistemic rationality** and **causal control**.

  *   **In Case (i) (The Report):** You generally cannot causally influence the arrival of the report or the reasoning process you will apply to it. You lack control over the intervening variable. Therefore, the only way to restore coherence is to adjust your current state to match the anticipated future state.
  *   **In Case (ii) (The Wine):** You have causal control over the intake of wine. Here, the normative pressure *does* go the other way. The recommendation is indeed "don't drink the wine if you want to maintain accurate beliefs."

  **Why it feels one-directional:**
  In formal epistemology, the default assumption is that the agent is observing the world, not manipulating their own cognitive hardware. When the literature discusses Reflection, it assumes the 'process' is fixed. When you introduce the option to block the process (the wine), you move from **Epistemology** to **Decision Theory** (specifically, the value of information vs. the cost of reliability).
  *   If the process is reliable: Align now.
  *   If the process is unreliable: Block the process.
  The pressure is only one-directional in the literature because they usually hold the process constant.

  ### 4. Does the General Shape Hold? (Belief vs. Desire)

  Here is where the analogy breaks, specifically regarding your case (iii) (Plans/Tiredness).

  **The Belief/Desire Asymmetry:**
  *   **Credences (i, ii, iv):** Aim at truth. If my future self sees more evidence, my current self should align. Truth is stable.
  *   **Preferences/Plans (iii):** Aim at satisfaction. Preferences are not 'true' or 'false'; they are 'satisfied' or 'frustrated'.

  In case (iii), you anticipate a preference change (tired you wants to cancel).
  *   **Epistemic Norm:** If I know I'll believe $P$, I should believe $P$.
  *   **Practical Norm:** If I know I'll want $X$, should I want $X$? **No.**

  This is the domain of **Time Inconsistency** and **Resolute Choice**.
  If you align your current preferences with your anticipated tired preferences, you are engaging in **adaptive preference formation** (sour grapes). The literature suggests you should *not* adopt the future attitude. Instead, you should **precommit**. You bind your future self to the current plan.

  **The Break Point:**
  The 'shape' holds for *truth-tracking attitudes* (credences, maybe some perceptual judgements). It fails for *goal-tracking attitudes* (desires, plans).
  *   For beliefs: Coherence requires convergence.
  *   For desires: Coherence often requires binding/resistance.

  So, there is no single name that covers (i) through (iv) without significant qualification. (i), (ii), and (iv) are **Diachronic Epistemic Coherence**. (iii) is **Dynamic Consistency in Choice**.

  ### 5. Coining a Term: Diachronic Coherence Pressure

  Since you need a label for the *phenomenological shape* before the technical split, I propose we call this **Diachronic Coherence Pressure**.

  **Definition:** The normative tension experienced by an agent who anticipates a divergence between their current attitude and their future attitude towards the same object, creating a demand to either align the current attitude or intervene on the process causing the change.

  **Boundary Cases:**

  *   **Clearly IN:**
      *   **Peer Disagreement:** Knowing a respected peer will convince you of $P$ tomorrow. (Pressure: Believe $P$ now).
      *   **Calculated Evidence:** Knowing a lab result will arrive that you know will be positive. (Pressure: Believe positive now).
      *   **Memory Loss:** Knowing you will forget the key proof. (Pressure: Write it down / lower confidence now).

  *   **Clearly OUT:**
      *   **Brainwashing:** Knowing you will be tortured into believing $P$. (Pressure: Resist / Flee, do not believe $P$).
      *   **Adaptive Preferences:** Knowing you will be too tired to enjoy the party. (Pressure: Go anyway / Precommit, do not decide 'parties are bad' now).
      *   **Paradigm Shifts:** Knowing you will convert to a new religion that changes the meaning of terms. (Pressure: None; the future attitude is incommensurable).

  *   **The Awkward Middle (The Edge of the Concept):**
      *   **Conceptual Replacement:** You know that after further study, you won't just change your credence on 'free will', you will stop using the concept entirely.
          *   *Why it's awkward:* Reflection requires the proposition $A$ to remain stable. If the future self doesn't believe $A$ because $A$ no longer makes sense to them, you can't align now.
      *   **Forgetting Reasons:** You know you will believe $P$ tomorrow, but you also know you will have forgotten *why*.
          *   *Why it's awkward:* You have the credence, but you've lost the justification. Reflection says 'match the credence'. Epistemology says 'don't hold beliefs without reasons'. This creates a conflict between Diachronic Coherence and Synchronic Justification.
      *   **Self-Fulfilling Prophecies:** You believe you will be confident tomorrow *because* you are confident today.
          *   *Why it's awkward:* The causal arrow loops. Aligning now causes the future state, rather than anticipating it. This moves from epistemology to performativity.

  ### Summary of the Carve-Up

  1.  **The Core:** You are describing **Van Fraassen's Reflection Principle**.
  2.  **The Argument:** Violating it makes you vulnerable to a **Diachronic Dutch Book**.
  3.  **The Escape:** You can ignore the pressure if the future belief is caused by **non-evidential processes** (wine), judged by the *causal etiology*, not the disagreement itself.
  4.  **The Direction:** You align now if you lack control over the process; you block the process if you have control and it is unreliable.
  5.  **The Limit:** The shape breaks when moving from **Belief** (aiming at truth) to **Desire** (aiming at satisfaction). In the latter, precommitment is preferred over alignment.
  6.  **The Label:** Use **Diachronic Coherence Pressure** for the general phenomenon, but specify whether you are in the *epistemic* domain (Reflection) or the *practical* domain (Dynamic Choice).

  This should give you the conceptual scaffolding to separate the 'madness' from the 'coherence' in your experiments. The key is always to ask: *Is the future attitude a response to the world, or a response to the self?*
