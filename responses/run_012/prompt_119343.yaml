          *   *Core Issue:* Relevance and probability. Does *any* instance of the contrapositive actually raise the probability of the hypothesis meaningfully?
      *   **Tacking Paradox (Confirmation of Conjunctions):** If $E$ confirms $H$, and $H$ entails $H \land X$ (where $X$ is irrelevant), then $E$ confirms $H \land X$.
          *   *Core Issue:* Irrelevant conjunctions. Evidence for gravity shouldn't confirm "gravity + moon is cheese."

  3.  **Evaluate Real-World Relevance (QA Context):**
      *   *Are these actual problems in QA?*
          *   **Raven Paradox:** In a strict logical sense, yes. In a statistical/practical sense, no. QA doesn't rely on binary logical equivalence; it relies on sampling populations and risk assessment. Observing a "non-black non-raven" (a safe product from a different supplier) *technically* tells you something about the universe of safe products, but it's noise compared to testing the actual supplier.
          *   **Tacking Paradox:** This is a logical artifact of simplistic confirmation definitions (like Nicod's criterion or hypothetico-deductive models). In practice, QA uses statistical confidence intervals, p-values, or Bayesian updating. These methods *do not* support tacking on irrelevant claims without penalty.
      *   *Verdict:* These are primarily philosophical puzzles regarding *logic* and *language*, not *statistics* and *risk*. However, the *underlying intuitions* (relevance, sample selection, scope of claims) are crucial for QA.

