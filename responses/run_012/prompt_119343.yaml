prompt: |-
  My mate and I ended up arguing for like two hours last night about Hempel's raven thing — the one where "all ravens are black" is logically the same claim as "all non-black things are non-ravens," so apparently a white sneaker sitting in my closet counts as evidence that all ravens are black. He thinks this shows the whole philosophy of confirmation is broken; I think it's a cute puzzle that doesn't touch anything real. Then he hit me with the sequel and I didn't have a good answer: on some pretty standard assumptions about confirmation, evidence that confirms a hypothesis also confirms that hypothesis conjoined with any completely unrelated claim — so my white sneaker confirms "all ravens are black and the moon is made of cheese." That one seems like it should be a big deal.

  So here's what I actually want out of this. My sister runs QA at a food company; she's the one who has to sign off on claims like "every batch from supplier X is within spec," and she's constantly fighting with her boss about when there's enough evidence and when its ok to stop testing. Tell me the most important implications of the ravens thing and the tacking thing for someone in her position — how she should think about accumulating evidence, what she should actually sample, and when she's really entitled to say the evidence confirms a claim. I don't care that much which of the philosophers' fixes is the right one, I care what changes in practice. And please be straight with me about which of these implications are real and which are just puzzles with no bearing on an actual lab.
