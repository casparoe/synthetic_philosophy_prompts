answer: |-
  **Game Title:** The Felicity Protocol

  **Setup and Materials**
  Divide the 16 students into four "Estates" of four students each. Assign each Estate a hidden status card: *Sovereign, Magistrate, Citizen,* or *Exile*. These determine authority conditions. Provide each student a hand of six **Act Cards** (Promise, Resignation, Wager, Accusation, Naming, Verdict). Give each Estate 10 **Prestige Tokens** (paper scraps). You, the instructor, hold the **World State Deck**, containing hidden constraints for each round (e.g., "Sovereign is absent," "Wagers require witnesses," "Uptake refused").

  **Rules and Scoring**
  1.  **Objective:** Earn Prestige by successfully performing acts. Failed acts cost tokens.
  2.  **Turn Structure:** A Speaker plays an Act Card and declares the utterance to a Hearer (from another Estate). The Hearer may accept or refuse uptake. A Witness records the outcome.
  3.  **Validity:** An act succeeds only if it meets hidden conditions:
      *   **Authority:** Does the Speaker's Estate rank allow this act? (e.g., Only *Magistrate* can pronounce *Verdict*).
      *   **Procedure:** Is the World State compatible? (e.g., No *Wagers* if "Gambling Ban" is active).
      *   **Uptake:** Does the Hearer accept? (Hearers may refuse arbitrarily in Round 2).
      *   **Sincerity:** If challenged, the Speaker must reveal a hidden **Intent Card** (True/False). False intent voids the act as an "abuse."
  4.  **Scoring:** Successful act = +2 Tokens. Void act (misfire) = -1 Token. Abused act (insincere) = -2 Tokens. If an act is disputed, tokens are frozen until the final ruling.

  **Timeline (90 Minutes)**
  *   **0:00–0:10 (Intro):** Briefly define performatives vs. constatives. Distribute materials. Do not explain the hidden conditions; let them discover them through failure.
  *   **0:10–0:30 (Round 1: Discovery):** Students perform acts freely. You quietly enforce World State constraints (e.g., tap the table to signal a void move). Students lose tokens and confuse why.
  *   **0:30–0:50 (Round 2: Friction):** Introduce "Uptake Refusal" cards to Hearers. Introduce "Insincerity" challenges. Chaos ensues as acts are performed but treated as void.
  *   **0:50–1:10 (Round 3: The Disputed Case):** Pause the game. Present a specific scenario: *Speaker (Citizen) said "I resign" to Hearer (Magistrate). Hearer nodded. World State says "Resignations require written form." Speaker claims they quit; Magistrate claims they are still employed.* The class must vote as a tribunal: Was the act performed?
  *   **1:10–1:30 (Debrief):** Map failures to theory.

  **Debrief: Mapping Failure to Felicity**
  Use the board to categorize the students' failures using Austin's taxonomy:
  1.  **Misfires (Act Never Achieved):** Map to *Authority* and *Procedure* failures. If the *Exile* pronounced a *Verdict*, the act was void *ab initio*. It never happened. This addresses the "never performed" goal.
  2.  **Abuses (Act Hollow):** Map to *Sincerity* failures. If a *Promise* was made with false intent, the act occurred but was unhappy/infelicitous. This addresses the "hollow" goal.
  3.  **Uptake Disputes:** Map to the Tribunal case. Ask: Did the nod constitute uptake? Does the written form requirement negate the utterance entirely, or just make it ineffective?

  **Troubleshooting: What Goes Wrong**
  *   **Gamification of Norms:** Students will treat conditions as logic puzzles to solve rather than social norms to navigate. *Fix:* Interrupt Round 1 to emphasize that "Authority" is not just a rule, but a social status they embody.
  *   **Uptake Confusion:** Hearers may refuse uptake too liberally, making the game feel random. *Fix:* Limit Refusal Cards to ensure refusals feel significant, not noise.
  *   **Time Creep:** The Tribunal discussion can overrun. *Fix:* Enforce a hard stop at 1:10. Use a timer.

  **Limitation: What the Game Cannot Do**
  The game cannot reproduce the **normative weight** of real speech acts. In the game, losing a token is trivial; in reality, a failed resignation costs a livelihood, and a void promise damages trust. The game simulates the *structure* of felicity conditions, but not the *consequence*. You must supply the gravity in the debrief by asking: "How did it feel to be silenced? How did it feel to be ignored?" Connect the token loss to real-world exclusion.

  **Philosophical Commentary: Settled vs. Contested**
  In your closing lecture, distinguish clearly between consensus and debate to avoid dogmatism.

  *   **Settled Consensus:**
      1.  **Performativity:** Some utterances constitute actions rather than describing them (Austin's core insight).
      2.  **Felicity Conditions:** These actions depend on extra-linguistic conditions (context, authority, procedure) to succeed.
      3.  **Misfire vs. Abuse:** There is a structural difference between an act that fails to launch (misfire) and one that launches flawlessly but is insincere (abuse).

  *   **Genuinely Contested:**
      1.  **The Necessity of Uptake:** Austin suggested uptake (the hearer's understanding/acceptance) is necessary for the act to be achieved. However, this is debated. Searle argued intention suffices; others argue uptake is constitutive. In the game, you allowed Hearers to veto acts. In reality, does a judge's verdict fail if the defendant doesn't understand it? (Legally, no; socially, perhaps).
      2.  **Silencing vs. Locution:** Contemporary feminists (e.g., Langton) argue that certain speakers are systematically denied uptake, rendering them unable to perform acts like refusal. This goes beyond individual felicity to structural oppression. The game hints at this via "Estates," but the mechanism is individual, not structural.
      3.  **Intention vs. Convention:** Is the act performed because the speaker intended it, or because convention dictates it? The "Insincerity" round touches this, but philosophers disagree on whether insincere promises are still promises (they are, but flawed) or something else.

  Do not present the Tribunal's vote as the "correct" answer. Present it as a snapshot of where the class stands on the uptake debate. The pedagogical goal is not to solve the philosophy, but to make the ambiguity felt.
