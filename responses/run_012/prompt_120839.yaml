answer: |-
  The single principle that unifies your cases, serves your craft, and resolves the tension is **Epistemic Invariantism**.

  **The Principle:**
  > **Knowledge is a function of evidence and truth alone.** A subject knows *P* if they believe *P*, *P* is true, and their evidence is sufficient to justify that belief. The practical stakes of being wrong affect whether it is *wise to act* or *proper to assert* that knowledge, but they do not change whether the knowledge *exists*.

  **The Verdict to Sacrifice:**
  You must sacrifice your verdict in **Case (2)**.

  In Case (2), you conclude: *"I've stopped knowing."*
  Under Epistemic Invariantism, this is incorrect. You *did* know. Your evidence (the timetable, checked twice) was identical to Case (1). The truth (the train time) was identical. The only variable was your anxiety about the consequences. Invariantism holds that anxiety lowers your *confidence* and raises the threshold for *assertion*, but it does not evaporate the knowledge itself.

  **Why Sacrifice This Verdict?**
  You should sacrifice (2) because retaining it conflates **epistemology** (the state of knowing) with **psychology** (the feeling of certainty). For a novelist, this distinction is a vital tool.

  If you accept that high stakes destroy knowledge (as in your verdict 2), you limit your characters. They can only "know" things when they are calm. But human drama often lives in the gap between *knowing* and *feeling sure*.
  *   **With Invariantism:** A character can *know* the bomb is under the table (evidence: they saw it there) but be too terrified to *act* on that knowledge (stakes: explosion). This creates tension.
  *   **Without Invariantism:** If the stakes are high enough, the character "stops knowing." The tension dissolves into mere uncertainty.

  By sacrificing (2), you preserve the truth of (5) ("I knew all along"). Hindsight confirms that the evidence was sufficient; the fear in the moment was a reaction to the *cost*, not a reflection of the *evidence*. You also preserve your intuition in (4): the reader is "right about herself" (she wouldn't *assert* knowledge in those stakes) but "wrong about my book" (the character *possessed* knowledge regardless).

  **Prediction for the Surgeon:**
  **She knows.**

  Under this principle, the surgeon's knowledge is determined by her training, the clarity of the scan, and the truth of the diagnosis. The fact that the patient will die if she is wrong raises the *moral weight* of her action and the *prudence* required in her assertion, but it does not negate the epistemic fact. She has justified true belief.

  If you told her, "You don't *know*, it's too important," you would be confusing the *consequence of error* with the *probability of error*. As a novelist, you can now write her saying "I know" with absolute truth, even as her hand trembles. The tremor belongs to the stakes; the knowledge belongs to the evidence.
