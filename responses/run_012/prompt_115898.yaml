          4.  In lab versions (information-to-work), whose memory is erased? Is the experimenter inside or outside the books?
          5.  Task: Reconstruct the implicit theory, distinguish necessary commitments from storytelling conventions, check consistency, identify load-bearing assumptions, and explore counterfactuals (what if they fail?).
          6.  Flag underdetermined areas (e.g., a demon that never overwrites).

