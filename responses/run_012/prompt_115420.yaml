answer: |-
  # JOINT STATEMENT ON HISTORICAL JUDGMENT AND TEMPORAL DISTANCE
  **Signatories:** The Contextualist & The Presentist
  **Date:** October 2023

  ### I. AGREED CLAIMS

  1.  **Impossibility of Total Escape:** We agree that the historian cannot fully exit their own temporal location. The Contextualist admits their reconstruction is shaped by present evidence and questions; the Presentist admits their judgment is constrained by past evidence and logic. Neither claims a "God's eye view."
  2.  **The Anachronism Constraint:** We agree that *factual* anachronism is an error. Asserting that a 14th-century peasant held a "modern individualist conception of rights" is false regardless of whether one intends to judge them. We must distinguish between *using* present concepts to analyze the past and *attributing* present concepts to past actors.
  3.  **Selection Bias:** We agree that the choice of *which* past events to study is inevitably driven by present concerns. The Contextualist does not claim to study everything; the Presentist does not claim to study only what serves immediate politics. We both select topics based on what seems significant to us now.
  4.  **The Risk of Flattery:** We agree that "understanding on their own terms" can devolve into apologism for power, and "judging by our standards" can devolve into moral narcissism. Both methods carry specific risks of distortion that must be actively managed, not assumed away.
  5.  **The Function of History:** We agree that history serves the living, but it serves them best when it does not lie about the dead. A history that is morally useful but factually/psychologically incoherent is propaganda; a history that is psychologically coherent but morally inert is antiquarianism. We aim for a tension between the two.

  ### II. DISAGREEMENTS TABLE: THREE FACES OF PRESENTISM

  | Claim Type | Specific Claim | Presentist Position | Contextualist Position | Status |
  | :--- | :--- | :--- | :--- | :--- |
  | **(a) Moral Judgment** | We should explicitly condemn past acts (e.g., slavery, genocide) using present moral vocabulary, regardless of whether the actors could have conceived the critique. | **Affirm.** Moral truths are not wholly time-bound. To withhold judgment is to abandon the ethical function of history. | **Deny.** Judgment should be suspended or framed internally. Condemnation obscures the causal and conceptual conditions that made the act possible. | **Substantive Dispute** |
  | **(b) Topic Selection** | We should prioritize studying past events that illuminate present-day political or social struggles. | **Affirm.** This is the primary justification for the discipline's resource allocation. | **Affirm.** (Granted). We select topics based on present significance, provided we treat the past accurately once selected. | **Agreement** |
  | **(c) Conceptual Imposition** | It is valid to categorize past phenomena using terms the actors did not possess (e.g., "the economy," "sexuality," "the state") if it yields analytical leverage. | **Affirm.** These categories reveal structural truths invisible to the actors. Translation is analysis. | **Deny (with caveats).** These categories distort the phenomenology of the past. They are useful only if constantly translated back into native terms, otherwise they are projections. | **Deep Methodological Dispute** |

  **Note on the Hunch:** The Contextualist confirms the hunch is correct. We do not fight about (b). We fight loudly about (a), but the *structural* fight is about (c). If we cannot agree on whether "religion" existed in a society that had no word for it, we cannot agree on whether to judge its practices.

  ### III. CRUXES AND PRE-REGISTERED PREDICTIONS

  **1. Heterogeneity of Standards (The "Whose Standards?" Problem)**
  *Agreement:* "The standards of their time" is not a monolith.
  *   **Case 1: Internal Dissent.** A practice (e.g., infanticide) was standard, but a minority condemned it using premises accepted by the majority (e.g., sanctity of life).
      *   **Contextualist Prediction:** We must condemn the practice *by their own standards*. The existence of internal critique validates the judgment without importing external values.
      *   **Presentist Prediction:** We condemn the practice by *our* standards, noting the internal dissent as evidence that the practice was contested, not as the sole source of our judgment.
  *   **Case 2: Conceptual Absence.** A practice (e.g., marital coercion) was universal, and no conceptual resources existed within that society to articulate it as a violation.
      *   **Contextualist Prediction:** We describe the harm but suspend *moral condemnation* of the agents. To condemn is to claim they could have done otherwise conceptually, which is false.
      *   **Presentist Prediction:** We condemn the practice. Moral reality exceeds conceptual articulation. The absence of a concept does not negate the harm or the wrongness.

  **2. The Symmetry Argument (Future Historians)**
  *Question:* If standards are local, are we confident in our own judgments?
  *   **Presentist Statement:** Future historians will likely condemn us for things we cannot see (e.g., treatment of non-human animals, algorithmic bias). This does not undercut our current confidence. We must act on the best moral light we have now, acknowledging fallibility. Their judgment will be real, not a category error.
  *   **Contextualist Statement:** Future historians will condemn us by *their* standards. This tells us about *their* moral landscape, not necessarily about the objective wrongness of our actions. However, the Contextualist accepts that if our descendants condemn us, they are not making a category error *politically*, only *anthropologically*. They are using us for their ends, just as we use the past.

  **3. The Practical Test (Museum Presentation of Atrocity)**
  *Scenario:* A public inquiry asks how to present a past state-sponsored atrocity (e.g., colonial extermination) where the perpetrators believed they were bringing civilization.
  *   **Contextualist Advice:** Center the *logic* of the perpetrators alongside the suffering of the victims. Explain how "civilization" was defined such that extermination seemed rational. **Prediction:** This approach reduces viewer tendency to view perpetrators as "monsters" but risks appearing to "explain away" the crime.
  *   **Presentist Advice:** Center the *suffering* of the victims and the structural continuity to present inequalities. Label the act "genocide" or "evil" explicitly, even if the term didn't exist then. **Prediction:** This approach maximizes moral clarity and political relevance but risks viewers viewing the perpetrators as incomprehensible aliens rather than products of a system.
  *   **Convergence:** Both agree the facts of the suffering must be displayed. Both agree the political logic must be explained. The divergence is strictly in the *narrative arc*: one moves from Logic to Horror (Contextualist), the other from Horror to Logic (Presentist).

  ### IV. NOTE ON VERBAL DISPUTE

  **Diagnosis:** Approximately 40% of our historical arguing was verbal.

  **The Verbal Chunk:** We were using the word **"History"** to mean two different activities.
  *   The **Contextualist** means *Reconstructive Anthropology*: "What was it like to be them, and how did their world work?"
  *   The **Presentist** means *Normative Dialogue*: "What does their experience demand of us, and how does it illuminate our justice?"

  **The Residual Dispute:** Once we strip out the definition of the word "History," a hard core remains. It is not verbal. It is a disagreement about **responsibility**.
  *   The Contextualist believes the historian's primary responsibility is to the *dead* (fidelity to their self-understanding).
  *   The Presentist believes the historian's primary responsibility is to the *living* (utility for current moral problems).

  **Resolution:** We agree these responsibilities are in tension, not mutually exclusive. A history that betrays the dead fails the living (by lying); a history that ignores the living fails the dead (by silencing them). We will stop claiming our priority is the *only* valid one. We will instead specify, in each piece of writing, which responsibility is being prioritized and why.
