answer: |-
  ### Thinking on Paper: The Translation Gap

  The hard part of translating the unilateralist's curse into a one-hour administrative procedure is that the philosophical cure is *epistemic humility*, but the administrative requirement is *justified confidence*. The curse says: "You might be wrong, and if you act on your private judgment, you contribute to a collective disaster." The procedure must say: "Prove you aren't acting on private judgment, or prove the disaster won't happen."

  I cannot ask you to calculate the probability of global catastrophe in sixty minutes. You will be guessing. The procedure must therefore treat *uncertainty* as a risk factor itself. If you don't know if others are doing it, you must assume they might be. This biases the procedure toward inaction. That is a feature, not a bug, but it creates the friction you feel in Case (c).

  I am dropping the requirement for deep game-theoretic analysis. Instead, I am substituting *coordination checks*. Can you call a meeting? Is there a preprint server? If the answer is no, the "curse" is active because actors are blind to each other. I am also distinguishing *threshold harms* (nuclear war) from *linear harms* (carbon emissions). The curse is deadliest at thresholds. If the harm is linear, standard cost-benefit analysis suffices; the curse procedure is overkill.

  Finally, I must admit where this fails. This procedure protects *your* decision from being the trigger. It does not stop a malicious actor outside your grantee pool. It creates a "safe harbor" for the foundation, not necessarily for the world. You are buying moral insurance, not engineering safety.

  ***

  ### The Unilateralist Decision Procedure (UDP)

  **Time Budget:** 60 Minutes
  **Operator:** Program Officer
  **Inputs:** Proposal, CVs, Budget, 2 External References (quick call/email)

  #### Phase 1: Triage (10 Minutes)
  *Goal: Determine if the UDP applies.*

  **Q1. Is the primary risk threshold-shaped?**
  *   *Definition:* Does the harm jump from negligible to catastrophic only after $N$ actors possess the capability/action? (e.g., pandemic pathogen access vs. general AI capability).
  *   *Yes:* Proceed to Q2.
  *   *No:* **STOP.** The Unilateralist's Curse does not apply. Use standard risk/benefit analysis. (Note: If harm is linear/accumulative, this is a Commons problem, see Distinctions below).

  **Q2. Is the action reversible within 12 months?**
  *   *Definition:* Can the information be un-published, the material destroyed, or the capability disabled if red flags appear?
  *   *Yes:* Mark "High Reversibility." Proceed to Q3.
  *   *No:* Mark "Low Reversibility." Proceed to Q3.

  #### Phase 2: Coordination & Prevalence Check (20 Minutes)
  *Goal: Estimate the likelihood of independent replication.*

  **Q3. Is there a shared venue for this field?**
  *   *Definition:* A conference, preprint server, or consortium where 80% of actors post plans before acting.
  *   *Yes:* Check venue for similar active projects.
      *   *Found similar:* Mark "High Prevalence."
      *   *None found:* Mark "Low Prevalence."
  *   *No (Fragmented/Secretive):* **Mark "Unknown Prevalence."** (Treat as High Prevalence for safety).

  **Q4. Are automated systems involved?**
  *   *Definition:* Can this action be executed or scaled by code without human intervention?
  *   *Yes:* **Mark "Machine Speed."** (Norms cannot form).
  *   *No:* Proceed to Q5.

  #### Phase 3: Competence & Asymmetry (20 Minutes)
  *Goal: Test the "We are the special ones" claim.*

  **Q5. Does the proposal claim asymmetric competence?**
  *   *Definition:* Do they argue "We should do this because we are safer/better than others"?
  *   *No:* Proceed to Q6.
  *   *Yes:* **Verification Required.** Contact 2 external references. Ask: "Is this team objectively top 5% globally for safety *and* capability in this niche?"
      *   *Both say Yes:* Mark "Verified Competence."
      *   *Mixed/No/No Response:* Mark "Unverified Competence." (Treat as Unverified).

  **Q6. Is the argument "If we don't, someone worse will"?**
  *   *Yes:* This is a *substitution claim*. It requires **Escalation** (see Phase 4). Do not decide alone.
  *   *No:* Proceed to Phase 4.

  #### Phase 4: Decision Matrix (10 Minutes)

  | Condition | Verdict | Action |
  | :--- | :--- | :--- |
  | **Low Reversibility** + **Unknown/High Prevalence** | **DECLINE** | Cite "Collective Risk Uncertainty." |
  | **Low Reversibility** + **Low Prevalence** + **Verified Competence** | **ESCALATE** | Send to Board/Risk Committee with "Asymmetric Competence Waiver." |
  | **High Reversibility** + **Any Prevalence** | **FUND (Monitored)** | Add clause: "Pause if >3 other groups replicate." |
  | **Machine Speed** + **Low Reversibility** | **DECLINE** | Norms cannot constrain this. Technical control required (not grantable). |
  | **Substitution Claim (Q6)** | **ESCALATE** | Requires Committee approval. Officer cannot validate "others are worse." |
  | **Lone Actor Override** | **ESCALATE** | If Officer believes consensus is wrong, must file "Dissent Justification" for Committee. |

  **Handling Missing Information:**
  *   If you cannot answer Q3 (Venue) in 20 mins: Default to **Unknown Prevalence**.
  *   If References (Q5) do not reply: Default to **Unverified Competence**.
  *   If you suspect you are the "Lone Actor" who is right: You cannot fund this alone. You must **Escalate**. The procedure forbids a single officer from overriding the conformity norm based on private judgment. That recreates the curse.

  ***

  ### Worked Cases

  #### (a) The Open-Source Bio-Method
  *Proposal: Publish a low-cost protocol for synthesizing a regulated virus strain. Aim: Democratize vaccine development.*

  1.  **Triage:** Threshold-shaped harm? **Yes** (Pandemic risk). Reversible? **No** (Information cannot be un-published).
  2.  **Coordination:** Shared venue? **Yes** (BioRxiv). Prevalence? **Unknown** (Search shows 2 similar drafts, but dark labs unknown). Default to **High Prevalence**. Machine speed? **No**.
  3.  **Competence:** Asymmetric claim? **No** (They want *everyone* to do it). Substitution claim? **No**.
  4.  **Decision Matrix:** Low Reversibility + High Prevalence = **DECLINE**.
  5.  **Output:** "Decline. Publication creates irreversible threshold risk. Prevalence of similar capabilities is unknown; funding this increases the probability of crossing the safety threshold. Suggest applying for closed-door safety validation grant instead."

  #### (b) The "Best in World" AI Team
  *Proposal: Train a frontier model. Argument: "We have the best safety alignment. If you don't fund us, a Chinese lab or a rogue startup will do it without safeguards."*

  1.  **Triage:** Threshold-shaped? **Yes** (Existential risk). Reversible? **No** (Weights will leak).
  2.  **Coordination:** Shared venue? **No** (Proprietary). Prevalence? **High** (Industry trend). Machine speed? **Yes** (Training is automated).
  3.  **Competence:** Asymmetric claim? **Yes**. Verification? References agree they are top tier (**Verified**). Substitution claim? **Yes** ("Others are worse").
  4.  **Decision Matrix:** Substitution Claim + Machine Speed.
      *   Machine Speed + Low Reversibility normally triggers **DECLINE**.
      *   However, Verified Competence + Substitution Claim triggers **ESCALATE**.
  5.  **Output:** "Escalate to Risk Committee. Officer cannot validate the counterfactual ('others will do it worse'). Committee must decide if this team's safety advantage outweighs the unilateralist risk of adding another actor to the frontier pool. Do not fund without Committee signature."

  #### (c) The Uncomfortable Decline (The "Vaccine" Problem)
  *Proposal: A team wants to build a diagnostic for a high-risk pathogen. To validate the diagnostic, they must synthesize a non-lethal fragment of the pathogen. Current field norm: "No synthesis of *any* fragment without international registry approval." There is no international registry (Venue = None). The team is competent, but not uniquely so.*

  1.  **Triage:** Threshold? **Yes** (Normalization of synthesis). Reversible? **No** (Knowledge gained).
  2.  **Coordination:** Shared venue? **No**. Prevalence? **Unknown** (Treat as High). Machine Speed? **No**.
  3.  **Competence:** Asymmetric? **No**. Substitution? **No**.
  4.  **Decision Matrix:** Low Reversibility + Unknown Prevalence + No Asymmetry = **DECLINE**.
  5.  **Why this hurts:** This diagnostic could save lives in the next outbreak. By declining, you preserve the norm ("no synthesis"), but you leave the world vulnerable to the natural pathogen. You are prioritizing the *stability of the norm* over the *immediate utility of the tool*.
  6.  **What must change:** For this to be funded, the team must first fund the *creation of the registry* (coordination infrastructure) before they fund the *synthesis*. The procedure forces infrastructure before action. If they refuse, you must decline. The discomfort comes from knowing the registry might take years, and people might die in the interim. The procedure accepts this trade-off to prevent the curse.

  ***

  ### Distinctions: What This Is Not

  **1. The Bystander Effect (Diffusion of Responsibility)**
  *   *Problem:* Everyone thinks someone else will act, so *no one* acts.
  *   *Procedure Difference:* The UDP assumes *too much* action. If you identify a Bystander scenario (e.g., no one is funding basic safety monitoring), **invert the procedure**. The "Conformity" norm becomes "Act if no one else is." Use the UDP only for capability-enhancing grants, not public-good maintenance.

  **2. The Commons Problem (Tragedy of the Commons)**
  *   *Problem:* Actors deplete a shared resource (e.g., compute capacity, atmospheric carbon).
  *   *Procedure Difference:* The Commons is about *capacity limits*. The Unilateralist Curse is about *existence limits*. If the harm comes from *usage volume*, do not use UDP. Use a quota/capacity allocation procedure. If the harm comes from *the act itself existing* (e.g., a virus sequence), use UDP. Do not confuse "too much" with "any."

  ***

  ### Limitations & Overrides

  **Where this procedure fails:**
  1.  **Non-Grantees:** This procedure only governs *your* money. It cannot stop a state actor or a self-funder. You are managing your liability, not the global risk.
  2.  **The "Black Swan" Competence:** If a genius appears who truly is 100x better than the field, the "Verified Competence" step (2 references) will likely miss it. You will block them. This is the cost of safety.
  3.  **Bureaucratic Drift:** The "Escalate" option will become the "Delay" option. Committees move slower than threats.

  **When to Override:**
  Override only if the *cost of waiting* (Phase 1, Q2) is demonstrably higher than the *risk of the curse*. Example: An active pandemic is spreading, and this is the only known countermeasure. In this case, the "threshold" has already been crossed by nature. The curse no longer applies; the problem is now race dynamics.

  **What you are pretending:**
  If you let this procedure decide for you, you are pretending that *process equals safety*. It does not. It equals *defensibility*. You are purchasing the ability to look the board in the eye and say, "I followed the protocol," not "I saved the world."

  ***

  ### Memo Summary (Under 200 Words)

  **To:** Board of Directors
  **From:** Program Director
  **Subject:** New Decision Protocol for Dual-Use Grants

  We are adopting the Unilateralist Decision Procedure (UDP) for high-risk grants. This addresses the "Unilateralist's Curse," where many careful actors collectively cause disaster by acting independently.

  **The Rule:** For irreversible, threshold-risk projects (e.g., pathogen synthesis, frontier AI), we default to **Decline** unless the applicant proves either (1) low field prevalence or (2) verified asymmetric competence. Claims that "others will do it worse" require Committee approval; Program Officers cannot validate this alone.

  **The Constraint:** This procedure prioritizes norm stability over immediate utility. It will block some beneficial research if coordination infrastructure (registries, venues) is missing. This is intentional: we cannot fund capability without governance.

  **The Uncertainty:** The UDP relies on officer estimates of "field prevalence," which are often guesses. We treat unknown prevalence as high risk. This biases us toward inaction. We accept this bias to avoid being the trigger for a collective harm we cannot undo.

  **Action:** Approve UDP for immediate implementation. Escalations will require quarterly Board review.
