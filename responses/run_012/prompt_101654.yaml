          *   *Verdict:* **Accurate.** This is the core mathematical statement of the theorem. $p > 0.5$, independence $\rightarrow$ probability of correct majority $\rightarrow 1$ as $n \rightarrow \infty$.

      *   *Claim 2: Deep Reason Democracy Works.* "That's the deep reason democracy works: individuals are mostly noise, but the errors cancel out in a big enough crowd."
