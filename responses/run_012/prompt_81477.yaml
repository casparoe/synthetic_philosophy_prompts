prompt: |-
  Ok so I'm in this "life in the universe" module thats cross-listed with philosophy of biology and our essay is basically "what would a definition of life have to get right." I dont want another definition though, I want the spec first — like, before I pick a side, tell me what the thing has to deliver.

  So: the desiderata list, and for each one, the case that forces it. Viruses are the obvious one but I want the actually awkward ones: viroids (just a naked RNA loop and nothing else), prions (infectious protein, no nucleic acid anywhere), mules (unmistakably alive, can't reproduce), red blood cells (no nucleus, don't divide), mitochondria (own genome, divide on their own, can't live free), spores (metabolically dead for millennia and then fine), lichens (like two or three organisms pretending to be one). And the cases where the answer flips depending on where you draw the line — a virus sitting on a table is inert, the same virus inside a cell is part of something that reproduces, so is the question about the entity or about the system?

  Also we got two made-up cases in class and I genuinely can't tell if they're meant to break definitions or not: (1) a self-sustaining reaction network in a beaker that keeps itself going indefinitely but never reproduces or evolves, and (2) a lab molecule that copies itself and mutates but has no metabolism at all. I'd like the list to say what a definition has to do with those two.

  Things I think are requirements but could be wrong: it can't be circular (no defining life via evolution if fitness then gets defined via reproduction); it has to either say something about non-carbon/non-water life or admit it can't; it should be usable by a rover that has to call "life detected" with no human in the loop; and it should track the ordinary concept at least somewhat, or else explain why we're allowed to ignore it.

  Which of those are real requirements and which are just one camp's prejudice? Which pair can't both be met — I suspect "general enough for alien life" vs "specific enough to be useful," but tell me if thats wrong. Which single requirement knocks out the most candidate definitions? And if the answer is "it depends what the definition is for," then say what the different for's are and which desiderata come and go with each — also, someone in seminar said it's all a family-resemblance concept and we should stop asking; is that a way of satisfying the list or just refusing to write one? Table is fine if thats easier.
