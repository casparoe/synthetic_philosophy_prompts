      *   *Refining the Audit:* Ensure clear labels (Mistaken, Simplification, Accurate). Explain *why* (e.g., *contra mentem*).
      *   *Refining the Philosophy:* Distinguish between *falsiloquium* (false speaking) and *mendacium* (lying).
      *   *Refining the Summary:* Must be tight, accurate, and similar length to the original.

      *(Self-Correction during drafting)*: I need to be careful not to use citations as requested. I must rely on describing the substance. I need to make sure I don't sound like I'm writing an essay but rather an audit. The tone should be direct.

      *Check on the "First Thinker" claim:* Cicero and others discussed lying. Augustine is the first to systematize it within Christian theology extensively. I will call it an overstatement.
      *Check on "Mellowed":* This is a common misconception. *Contra Mendacium* is actually stricter or at least equally strict, closing loopholes.
