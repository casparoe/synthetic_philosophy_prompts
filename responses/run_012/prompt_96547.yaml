  6.  **Final Polish:** Ensure the distinction between the "good faith falsehood" and the "bad faith truth" is clear, as this is the crux of the philosophical friends' questions. Ensure the Scriptural handling is clear (Augustine doesn't accept Biblical lies as lies, or accepts them as sins not rewarded).

