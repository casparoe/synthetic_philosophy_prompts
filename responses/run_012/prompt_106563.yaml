      *   *The Friction (Where Dewey struggles):*
          *   *Agenda Setting:* Dewey wants problems to *emerge* from experience. Here, Parliament handed the question down. Top-down vs. Bottom-up.
          *   *Finality:* Dewey hates fixed ends. A referendum is binary (Yes/No) and constitutionally hard to reverse. It looks like a "closure" rather than a provisional step.
