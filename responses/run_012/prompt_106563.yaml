      *   *The Inquirer:* This is tricky. Dewey usually talks about the "Public." Here, it's fragmented.
          *   *Option A:* The Oireachtas (Parliament). They set it up. But they were stuck.
          *   *Option B:* The Assembly itself. 100 citizens. They did the deliberating.
          *   *Option C:* The wider Public. They voted in the referendum.
          *   *Deweyan View:* Ideally, the Public forms when it recognises indirect consequences. The Assembly was an *organ* of the Public, artificially convened because the natural Public was too diffuse.
      *   *Hypothesis:* "If we repeal the 8th Amendment and legislate for abortion up to 12 weeks, the social harm will be reduced and rights respected."
