answer: |-
  You have put your finger on the exact nerve where Dewey's political philosophy is most potent and most fragile. You are right to feel that his model of inquiry — the individual or small group facing a wobbly situation, testing a hypothesis, and revising — scales up to a nation-state with considerable friction. The Irish Citizens' Assembly (ICA) is perhaps the best contemporary stress-test for this.

  Let's map the terrain, starting with your first demand: reading the Irish episode through Dewey's eyes.

  ### Part 1: The Irish Assembly through Dewey's Lens

  **The Problematic Situation**
  For Dewey, inquiry does not begin with a question; it begins with a disturbance. A habit has failed. In Ireland, the "habit" was the constitutional consensus of the 1980s (the 8th Amendment), which equated the life of the mother with the unborn. By 2016, that habit had gone wobbly. It wasn't just theoretical; the situation was physically unstuck. Women were travelling to England; doctors were facing legal uncertainty; the death of Savita Halappanavar in 2012 was the visceral moment the situation became undeniably "problematic" in the Deweyan sense. The old ways of coping no longer secured a stable outcome.

  **The Inquirer**
  Here is the first knot. For Dewey, the inquirer is ideally the Public itself — those affected by the indirect consequences of an action. But in modern mass society, the Public is "eclipsed"; it is too scattered to recognise itself.
  *   **The Oireachtas (Parliament):** They recognised the wobble but lacked the capacity to inquire. They were trapped in partisan habits.
  *   **The Assembly:** This body of 100 citizens acted as a *proxy* inquirer. They were a microcosm of the Public, artificially convened to do the work the wider Public could not easily do.
  *   **The Electorate:** In the referendum, they acted as the final arbiter, but Dewey would argue they were ratifying the inquiry rather than conducting it.

  So, who is the inquirer? In Deweyan terms, the Assembly was an *organ* of inquiry created because the natural inquirer (the Public) was too diffuse to function. It was a prosthetic mind for the body politic.

  **The Hypothesis and the Test**
  The Assembly's recommendation (repeal the 8th Amendment, legislate for access up to 12 weeks) functions as the **hypothesis**. It is a proposed reconstruction of the situation to restore stability.
  The **test** is the 2018 Referendum.

  **Where the Theory Goes Quiet**
  This is where you feel the friction, and rightly so.
  1.  **The Origin of the Question:** Dewey insists the problem must be *felt* to be real. The ICA's agenda was handed down by the Oireachtas. While the public distress was real, the *framing* of the inquiry was top-down. A pure Deweyan inquiry grows organically from the distress; this was a managed process. It risks turning inquiry into administration.
  2.  **The Finality of the Test:** Dewey is a fallibilist. Every conclusion is provisional. A constitutional referendum is the opposite of provisional. It is designed to be hard to reverse. It creates a "settled" state that actively resists further inquiry until the next crisis. For Dewey, truth is what works *for now*; a constitution says "this works *full stop*."
  3.  **The Binary Nature:** Inquiry is nuanced; referendums are binary. The complex recommendations of the Assembly (which included nuances on gestation periods and criminalisation) were flattened into a Yes/No vote. Dewey would worry that the richness of the experimental finding is lost in the aggregation.

  ### Part 2: The Irish Case through Dewey's Lens

  Now, flip it. What does Ireland tell us about Dewey?

  **It Confirms His Critique of Voting**
  Your argument with your friend is settled here. If voting were the core of democracy, the 2018 result would have been a mere tally of pre-existing preferences. But the shift in Irish opinion wasn't just a count; it was a learning process. The Assembly showed that "public opinion" is not a static thing to be measured, but a dynamic thing to be formed. This vindicates Dewey's claim that democracy is primarily "associated living" and communication, not just mechanics. The voting was the least interesting part; the weekends of deliberation were the democracy.

  **It Embarrasses His Optimism**
  Dewey often writes as if the Public will naturally find its voice if communication channels are open. The Irish case suggests the Public is too fragmented to find its voice without institutional scaffolding. The Public did not organise itself; the State had to pick 100 people at random and put them in a hotel to do the thinking. This suggests Dewey underestimated the need for *designed* spaces of inquiry. He hoped for a Great Community; Ireland built a small committee to simulate one.

  **It Extends His Theory**
  The ICA suggests that in a complex society, inquiry must be *representative* as well as *experimental*. Dewey focused on the method of intelligence; Ireland added the method of sortition (random selection). This combination — random people using scientific deliberation — is something Dewey didn't explicitly detail, but it fits his spirit. It shows that "expertise" in democracy isn't just about technical knowledge (the experts who gave evidence) but about lived experience (the citizens deciding).

  ### Part 3: The Standing Body and the "Gadget" Question

  This brings us to your daydream: a permanent, randomly selected body that sets its own agenda and revisits its own conclusions. You ask if this is a genuine implication of Dewey or just a gadget bolted on.

  It is not a gadget. It is, in fact, a necessary institutionalisation of Dewey's fallibilism.

  Dewey argues that inquiry never closes. Yet, our political institutions (parliaments, constitutions) are designed to close inquiry. They produce laws that stand until repealed. This creates a structural mismatch between the fluid nature of social problems and the rigid nature of political solutions.

  A standing citizens' body addresses this in three Deweyan ways:
  1.  **Continuity:** It acknowledges that the "wobble" is permanent. Social life is always in flux; therefore, the mechanism for adjusting it must be permanent, not ad-hoc.
  2.  **Revision:** By mandating a review after five years, you build fallibility into the architecture. You are admitting, "We might be wrong, or the situation might have changed." That is pure Dewey.
  3.  **Agenda Setting:** If the body chooses its own questions based on public distress rather than parliamentary whim, it solves the "top-down" problem of the Irish Assembly. It allows the inquiry to grow from the situation, not from the government's convenience.

  **The Risk**
  However, here is where you must be careful not to turn the gadget into a idol. Dewey warns against institutionalising habits to the point where they lose contact with experience.
  If you create a permanent body, you risk creating a "priesthood of inquiry." If they are too insulated, they stop feeling the "wobble." They might start inventing problems to solve just to justify their existence. For this to remain Deweyan, the body must remain porous. It cannot just sit in a room; it must be constantly exposed to the friction of the wider public. It must be a sensor for the Public's distress, not a substitute for it.

  You mentioned the German-speaking community of Belgium (Ostbelgien). They have indeed established a permanent Citizens' Council since 2021. They do not have the power to legislate, but they have the power to set the agenda for temporary citizens' assemblies. It is an early prototype of exactly what you are describing. It validates that your intuition is not merely philosophical fantasy but politically actionable.

  ### The Verdict

  To answer your core worry: **Yes, making it permanent is what Dewey's view implies.**

  If democracy is a way of life grounded in experimental inquiry, then we cannot rely on occasional spikes of attention (like the Irish Assembly) to fix broken things. We need a continuous feedback loop. The Irish model was a "crisis inquiry." You are proposing a "maintenance inquiry."

  However, you must accept the limitation: no institution can fully embody the "Public." The Public is fluid; an institution is fixed. Your standing body would always be a proxy. The danger is that people start treating *its* conclusions as the final word, rather than as the provisional hypotheses they are supposed to be.

  So, is it a gadget? No. It is an attempt to build a machine that keeps democracy honest. But like any machine, it will only work if the people around it keep it connected to the power source — which, for Dewey, is always the raw, messy, wobbly experience of ordinary life.

  Your friend was wrong: voting is not the interesting part. But neither is the deliberation, if it ends in a rigid law. The interesting part is the capacity to change one's mind collectively. If your standing body protects that capacity, it is the most Deweyan thing you could possibly build.
