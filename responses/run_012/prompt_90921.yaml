  *   **The Epistemic Floor (from *d*):** Information has intrinsic positive utility simply by resolving uncertainty, even if it cannot change the physical outcome. "Knowing" is a good in itself, provided it doesn't trigger a disaster.
  *   **The Akrasia Constraint (from *e*):** The value of information is calculated based on how the agent *will* actually use it, not how a rational agent *should* use it. If you know you have a "bug" (spite, panic, weakness of will) that will cause you to process the data into a worse outcome, the information has negative value.
  *   **The Instrumental Ceiling (from *a, b, c*):** Information is most valuable when it allows you to switch to a higher-utility action. If actions are locked (*b*), value drops to the Epistemic Floor. If actions are flexible (*a, c*), value rises.

  **Rae's Algorithm:** *Accept free information if (Epistemic Value + Instrumental Value) > (Predicted Psychological/Behavioral Cost).*

