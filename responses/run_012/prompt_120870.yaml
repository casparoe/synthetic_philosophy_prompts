answer: |-
  **IN THE COUNTY COURT AT SMALL CLAIMS**
  **CASE NOS: 44-OMEGA & 45-TERMITE**
  **BETWEEN: MR. SMITH v. OMEGA SOLUTIONS LTD**
  **AND: MR. NOTE v. MR. SMITH**

  **JUDGMENT OF HIS HONOUR JUDGE BROWN**

  1. I have spent thirty years on the bench. I have heard disputes over garden fences, deposit returns, and the ownership of a prize-winning pumpkin. I have never heard a case where the primary evidence is a coin flip that hasn't happened yet, or a contract contingent on an infestation of insects that may not exist. Yet, here we are. These two matters are so intertwined I shall give one judgment for both.

  2. In the first matter, the Claimant, Mr. Smith, seeks the return of £100 paid to the Defendant, Omega. Mr. Smith argues that the coin had already landed when he was asked for the money. Therefore, his payment could not influence the outcome. He calls this "basic causation." Omega argues that they only asked for the money because they knew, in advance, Mr. Smith was the sort of person who pays. Had he been the sort who refuses, the coin would have landed differently, or the question never asked. Mr. Smith says this is magic. Omega says it is profiling.

  3. In the second matter, the Claimant, Mr. Note, seeks £1,000 from Mr. Smith. The contract was a single note: "Exactly one of these is true: You have termites, or you pay me £1,000." Mr. Smith did not pay. He argues that handing over cash does not physically kill termites. Mr. Note argues that if Mr. Smith were the sort of person who paid, the termites would not be there to begin with. Mr. Smith calls this blackmail. Mr. Note calls it logic.

  4. The core legal difficulty here is what I shall term, perhaps inaccurately, "The Principle of Backward Causality." My learned friends in the higher courts might call it Evidential Decision Theory, but I prefer to keep it plain. The law usually asks: did Action A cause Result B? Here, the question is: did Character C cause the Situation where Action A was required?

  5. Mr. Smith's friends—let's call them the Pragmatists—argue he should pay both times. They say you must act according to the type of person you wish to be, because the world is already watching. If you are a payer, you get rich; if you are a refuser, you get termites. The other group, the Realists, argue that you cannot change the past by paying a bill, nor kill a bug by opening a wallet. To them, paying is simply setting fire to money because you're superstitious about correlation.

  6. I find myself agreeing with the Claimant's submission in the second case, and the Defendant's submission in the first. Which is to say, the law cannot enforce a bet on your own soul. In the first case, Mr. Smith paid. He cannot get it back. Not because Omega earned it, but because Mr. Smith bought something. He bought the confirmation that he is a man who honours a request even when it makes no sense. That has value, though I cannot quantify it in sterling. To refund him would be to declare his character a mistake.

  7. In the second case, Mr. Note fails. You cannot sue a man for failing to believe in a logical trap. If the termites are real, Mr. Smith has bigger problems than a county court judgment. If they are not, Mr. Note is attempting to profit from a conditional statement that relies on the defendant's ignorance. The law protects the reasonable man, not the logically cornered one. Mr. Smith was not obliged to pay to prove a negative.

  8. So, Mr. Smith's claim for £100 is dismissed. Mr. Note's claim for £1,000 is dismissed. Mr. Smith remains £100 poorer than he started, and presumably termite-free, though I have no evidence on the latter.

  9. I am told this turns on whether we judge the choice or the chooser. A court can only judge the chooser. We assess credibility. Mr. Smith struck me as a man who pays when asked, even when asked poorly. That makes him reliable. It also makes him susceptible. I cannot tell if that susceptibility is a virtue or a defect. He paid the £100 because he is honest. He refused the £1,000 because he is sensible. The difference between a mug and a principled man is often just the size of the bill.

  10. This court finds that Mr. Smith is exactly who Omega said he was. Whether that was worth the hundred pounds is a matter for his conscience, not my docket. Case closed.
