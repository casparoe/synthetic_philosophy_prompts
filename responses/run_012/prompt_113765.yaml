answer: |-
  My Dear Colleague,

  I have been reflecting on the peculiar ontology that underpins our shared institutional life, specifically the way we treat objects as persisting entities despite the total turnover of their constituent parts. It is a practice so mundane we rarely pause to examine its metaphysical cost, yet it governs everything from maritime heritage to corporate law. When a museum ship loses its last original timber to rot and replacement, or when a cathedral is rebuilt stone by stone after a fire, or when a corporation cycles through every single shareholder and employee, we do not hesitate to say these are the same entities they were at their inception. They bear the same name, carry the same insurance, and hold the same title. If we are to reconstruct the theory of persistence that makes this possible, we must look away from the physical stuff of the world. It cannot be a theory of material continuity, for the atoms and planks are gone. It cannot be strictly a theory of formal continuity either, for a perfect copy shares the form but not the identity. What holds these cases together is instead a theory of institutional and causal continuity, validated by an authoritative record. The identity of the object is not an intrinsic property of its matter or shape, but a status conferred by an unbroken chain of administrative recognition.

  To separate what this practice strictly requires from what merely fits comfortably with it, we must look at the boundaries of acceptance. What the practice strictly requires is the continuity of the record itself, the deed or logbook that certifies the succession of states as belonging to a single lineage. As long as the logbook remains unbroken, documenting the transfer of responsibility and the authorization of repairs, the object persists. What fits comfortably with this practice, but is not strictly required, is the gradualism of the replacement. We find it easier to accept the identity of a ship that loses one plank a year than one that is rebuilt overnight, yet legally and institutionally, the speed of replacement matters less than the continuity of the authorization. If the proper forms are filed, a total overnight reconstruction can preserve identity, whereas a gradual decay without documentation might lose it. This practice quietly rules out rival views that ground identity in the intrinsic properties of the object. It rejects mereological essentialism, the view that an object cannot survive the loss of even one of its parts, for if that were true, every maintenance log would be a record of death and rebirth rather than preservation. It also rejects strict materialism, which would imply that the museum ship ceased to exist the moment the last original timber was removed, rendering its exhibition a fraud.

  When we press this practice with the two classic cases it cannot indefinitely avoid, the primacy of the record over matter becomes starkly visible. Consider first the second vessel assembled from the removed original planks. While our metaphysical intuition might tug toward the original matter as the bearer of identity, the institutional practice almost universally treats the continuous vessel—the one that remained in service and underwent replacement—as the true successor. The reassembled planks are treated as a collection of relics or a reconstruction, not the ship itself, because the causal and administrative chain follows the functional role and the location of the vessel, not the scattered wood. The record tracks the office of the ship, not the timber. Consider secondly the faithful replica built to the original plans after the first is destroyed. Here the practice is equally decisive: if the record certifies the destruction of the original, the identity chain is broken. The replica, no matter how faithful, enters the register as a new entity. This verdict follows not from a coherent metaphysical theory of essence, but from an unexamined convention about title and records. Identity here is a legal fiction maintained for the sake of liability, heritage, and continuity of purpose, rather than a discovery of ontological truth.

  Finally, we must consider what would happen to these practices if we adopted a different metaphysical account of persistence. If we were to adopt a four-dimensionalist account, where objects are spacetime worms composed of temporal parts, the practice would not necessarily collapse, but our description of it would shift. We would no longer say the ship survives replacement, but rather that the current temporal stage of the ship-worm is causally connected to previous stages. The insurance policy would cover the entire spacetime worm, and the replacement of parts would simply be the manifestation of different temporal segments of that worm. This view is largely compatible with the current practice, as it accommodates change over time naturally. However, if we adopted the view that an object cannot survive the loss of even one of its parts, a view known as mereological essentialism, the practice would have to change radically and perhaps catastrophically. Every repair would constitute the destruction of one object and the creation of a new one. Insurance contracts would void themselves upon the first scratch, heritage sites would be acknowledged as sequences of distinct buildings rather than single enduring monuments, and corporations would cease to exist with every change in staffing. Such a metaphysics is incompatible with the functional needs of human institutions, which require stability across change. We maintain the current convention not because it is metaphysically pure, but because it allows us to navigate a world of flux without losing our grip on the things that matter to us.

  Yours in thought,

  A Correspondent
