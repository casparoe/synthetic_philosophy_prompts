          *   *Distinction:* Intent and Provenance. The facsimile is an honest tool; the forgery is a dishonest artifact that became an honest historical record.
      *   *Value Theory:* It's not purely aesthetic (otherwise copy = original). It's not purely market-based (insurance ignores market price). It looks like a hybrid of **Historical Materialism** (the object's physical journey matters) and **Institutional Honesty** (transparency about status).

