      *   *Confidence:* Low on the Insurance motivation. Is it philosophy or just risk aversion? I'll flag this as the weakest point.

      *(Self-Correction on the "Least Sure" point)*: Actually, the motivation behind the "known later artist" rule is also tricky. Is it aesthetic or historical? I think the Insurance one is more ambiguous between philosophy and bureaucracy. I will stick with Insurance as the least sure philosophical commitment.

      *(Refining the Forgery/Facsimile distinction)*: Make sure to emphasize *transparency*. The facsimile is honest; the forgery was dishonest but is now displayed honestly. The museum validates the facsimile; it contextualizes the forgery.

  9.  **Final Polish:** Ensure the voice is authoritative but open to the nuance required for a long-form piece. (Proceed to generate output).

