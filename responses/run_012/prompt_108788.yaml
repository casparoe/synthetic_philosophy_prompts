          *   **Constraint:** No citations/reading list. Be explicit about confidence levels. Single out the least sure point.

  2.  **Deconstruct the Museum's Practices (The "Data"):**

      *   *Practice 1 (Facsimile Lending):* The original is too fragile. The copy is "indistinguishable" visually but treated differently (original stays in vault, copy travels).
          *   *Implication:* Visual experience isn't everything. Something about the *object itself* matters (provenance, history, material continuity).
      *   *Practice 2 (Forgery Display):* Forgery is kept, not destroyed. Labeled as deception.
          *   *Implication:* The object has historical value *as a forgery*. It's not worthless, but its value is different from the claimed Renaissance value. It has "testimonial" value.
      *   *Practice 3 (Digital Restoration):* Fill-ins allowed if visible under UV.
          *   *Implication:* Honesty about material intervention is key. The viewer should be able to distinguish truth from reconstruction if they look hard enough (scientific truth vs. aesthetic wholeness).
      *   *Practice 4 (Ethical De-restoration):* Strip later painting *unless* the later painter is known/significant.
          *   *Implication:* Authorship matters. An anonymous restorer is noise; a known artist adds a new layer of history/authorship. This suggests a palimpsest view of the object's history.
      *   *Practice 5 (No Selling Replicas as Originals):*
