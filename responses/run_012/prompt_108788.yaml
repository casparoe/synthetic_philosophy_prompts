          *   *Principled Distinction:* Intent and Institutional Endorsement. The museum *authors* the facsimile; the forger *usurped* the original.
      *   **Type/Token vs. Material Bearer:** Do they distinguish work vs. object?
          *   Lending the copy suggests the "work" can travel, but the "object" stays.
          *   De-restoration suggests the "object" is a historical accumulator.
