      *   *Practice 6 (Insurance):* Original insured high (non-market), facsimile zero.
          *   *Implication:* The original has a value that cannot be replaced (irreplaceable). The facsimile is fungible/replaceable.

  3.  **Synthesize the Implicit Philosophy:**

      *   *Core Tension:* Aesthetic experience (what you see) vs. Historical/Material Authenticity (what it *is*).
      *   *The "Forgery vs. Facsimile" Puzzle:*
