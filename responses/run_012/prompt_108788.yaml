  6.  **Finalizing the Structure:**

      1.  **Executive Summary:** The "Historical Integrity" Framework.
      2.  **The Original vs. The Copy (Contact Value):** Affirming non-reducible value.
      3.  **The Forgery/Facsimile Paradox:** Resolved via Intent and Transparency.
      4.  **The Object as Palimpsest (De-restoration):** Layered history vs. pristine origin.
      5.  **Underdetermination:** Where bureaucracy mimics philosophy.
