      *   **Confidence Levels:** I need to tag claims with confidence (High, Medium, Low) and pick the weakest point.
      *   **Weakest Point:** The insurance policy. Is it philosophical or just bureaucratic?

  5.  **Refining the Argument (Self-Correction during drafting):**

      *   *Correction:* I initially thought about calling it "Institutional Theory." But the museum treats the *known later artist* repainting as valuable. That suggests they value *human agency* over time, not just institutional stamping.
      *   *Nuance on De-restoration:* Why keep known later painting? Because it represents a specific historical interaction with the work. Anonymous repainting is just decay/noise. This implies a "Biographical" theory of the object.
      *   *The Insurance Point:* The prompt says the insurance sum has "no relation to any recent sale price." This is crucial. It means they reject market value as a proxy for cultural value. This is a strong philosophical claim.
