answer: |-
  The activity succeeds by assigning each group a different physical property (length, area, volume) to treat as uniformly distributed, forcing them to derive conflicting probabilities for the same event before comparing notes.

  **Scenario: The Cube Factory**
  A factory produces cubes with side length $s$ between 0 and 1 meter. You know nothing about the manufacturing process except that it exists. Your task: Determine the probability that a randomly selected cube has a side length $s > 0.5$.

  **Materials & Setup**
  *   **Participants:** 16 students divided into 3 Groups (5 students each) + 1 Auditor (1 student).
  *   **Handouts:** Each group receives a sealed envelope specifying their "Data Access."
      *   Group 1 (Length): "You have access to the ruler logs. Assume side lengths are uniformly distributed."
      *   Group 2 (Area): "You have access to the surface area logs. Assume face areas ($s^2$) are uniformly distributed."
      *   Group 3 (Volume): "You have access to the shipping volume logs. Assume volumes ($s^3$) are uniformly distributed."
  *   **Currency:** "Epistemic Points" (EP) written on the board.

  **Timeline (90 Minutes)**
  1.  **Intro (15 min):** Present the scenario. Emphasize the Principle of Indifference: "Since you know nothing, assume uniformity over the data you possess."
  2.  **Calculation (30 min):** Groups calculate $P(s > 0.5)$ based on their parameter. They must prepare a justification for why their data source is the "natural" way to describe a random cube. They commit to a probability on a card.
  3.  **The Market (20 min):** Groups reveal probabilities simultaneously.
      *   Group 1: 0.5
      *   Group 2: 0.75 (Since $s > 0.5 \implies s^2 > 0.25$)
      *   Group 3: 0.875 (Since $s > 0.5 \implies s^3 > 0.125$)
      *   **Betting:** Allow groups to bet EP against each other on the "true" answer. The Auditor holds the pot.
  4.  **Conflict & Debrief (25 min):** When betting stalls (because both sides claim Indifference), freeze the game. Reveal the envelope constraints. Map each number to its parameterization on the board.

  **Payoff Scheme**
  No real money. Award 10 EP to any group that can mathematically derive their probability from their assigned uniform distribution. Award 0 EP for the "correct answer" because there is none. The "win condition" is surviving the debate without conceding that their parameterization was obviously wrong.

  **Predictable Failure & Fix**
  *   **Failure:** Group 1 (Length) will argue that side length is ontologically prior to area or volume, claiming the other groups are "doing math wrong." They will feel the paradox less acutely because length feels "natural."
  *   **Fix:** As instructor, play "Nature." Referee strictly: "Group 2, you *only* have volume logs. You cannot assume length is uniform. Group 1, you *only* have ruler logs. You cannot assume volume is uniform." Force them to inhabit the epistemic limitation. If they argue ontology, deduct EP.

  **Limitations**
  This game reproduces the *conflict of priors* but not the geometric invariance of Bertrand's original chord problem. Students may walk away thinking this is just about "choosing variables" rather than the deeper measure-theoretic issue that no unique translation-invariant measure exists for the space of possibilities. You must still put the Jacobian transformation on the board to show *why* uniformity over $s$ implies non-uniformity over $s^3$. The game creates the confusion; the board work must resolve the math.

  **Debrief Mapping**
  Draw three axes on the board: $s$, $a=s^2$, $v=s^3$.
  1.  Draw a uniform density box for $s$ over $[0,1]$. Show mass above 0.5 is 50%.
  2.  Transform to $a$. Show the density function is no longer uniform (it piles up near 0). Show mass above 0.25 is 75%.
  3.  Transform to $v$. Show density piles even more near 0. Show mass above 0.125 is 87.5%.
  Conclude: "Indifference is not invariant under transformation." The feeling of being "right" while conflicting is the paradox.
