      *   No circle/chord? Yes (Cubes).
      *   Betting/commitment? Yes.
      *   Predictable failure? Yes.
      *   Limitation acknowledged? Yes.

  7.  **Final Polish:** Check the math.
      *   Length $L \sim U[0,1]$. $P(L > 0.5) = 0.5$.
      *   Area $A = 6L^2$ (or just $L^2$ for simplicity). Let's use Side $s$. Area of face $a = s^2$. If $a \sim U[0,1]$, then $s = \sqrt{a}$. $P(s > 0.5) = P(\sqrt{a} > 0.5) = P(a > 0.25) = 0.75$.
      *   Volume $v = s^3$. If $v \sim U[0,1]$, then $s = v^{1/3}$. $P(s > 0.5) = P(v^{1/3} > 0.5) = P(v > 0.125) = 0.875$.
      *   Results: 0.5, 0.75, 0.875. Distinct and clear.

  8.  **Writing:** (Mental check on word count).
