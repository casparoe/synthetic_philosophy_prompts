answer: |-
  There is no single, settled term in art history or market economics for this specific phenomenon. You are describing a niche that sits between *provenance*, *notoriety*, and *aura*, but is distinct from all three.

  The closest existing concept is **The Van Meegeren Effect**, but that is usually reserved for forgeries that become valuable because the *forger* became famous (van Meegeren, Beltracchi), not necessarily because the *experts* were humiliated. You are describing something more specific: the value is generated by the **failure of the institution**, not the skill of the criminal.

  Here is the carving you asked for.

  ### The Name
  I propose calling the value increment **The Fallibility Premium**.
  Consequently, the object itself is a **Consensus Relic**.

  ### The Carving: Defining the Edges

  **1. Why it isn't the "Celebrity Guitar" (The Indexical Difference)**
  You suspected the "guitar smashed by Hendrix" analogy was close but off. You were right.
  *   **The Guitar:** This is *physical* indexicality. The object bears the physical scars of a notable event. The value is in the matter itself (the wood that touched the hand).
  *   **The Consensus Relic:** This is *epistemic* indexicality. The object bears the scar of a collective mental state. The paint didn't change; the *knowledge* around it changed.
  *   **The Edge:** If you smash the guitar, it's a relic. If you clean the painting, it's still a Consensus Relic. The value lies in the *history of belief*, not the history of matter. It is a trophy of the art world's vulnerability.

  **2. The Cousin (Intent is Irrelevant)**
  Your "cousin" case (the downgraded Master) is crucial. It proves that **deception is not the engine; error is.**
  *   If the value came from the *crime*, the downgraded painting wouldn't qualify (no crime was committed, only a mistake).
  *   Because the downgraded painting *does* qualify, we know the asset is the **Institutional Embarrassment**.
  *   **The Edge:** The Fallibility Premium applies to any object that served as a vessel for high-status confidence that was later revoked. Whether that confidence was stolen (forgery) or gifted (misattribution) matters less than the fact that it was held by the right people for the right time.

  **3. The Teaching Collection (Trophy vs. Tool)**
  You asked how this differs from a museum keeping a fake for education.
  *   **The Teaching Fake:** Value is *pedagogical*. It is a tool to demonstrate technique or history. It is often de-accessioned if it loses clarity as a teaching aid. It belongs to the public trust.
  *   **The Consensus Relic:** Value is *fetishistic*. It is a trophy owned privately. The owner isn't buying it to study the brushwork; they are buying the right to say, "I own the thing that broke the Louvre's brain."
  *   **The Edge:** One is a textbook; the other is a scalpel taken from the surgeon who botched the operation.

  **4. The Sweet Spot (The Latency Window)**
  You noted the value peaks when the object fooled the right people for the right amount of time. In market terms, this is **The Latency Window**.
  *   **Too Short:** If caught immediately, it's just a bad attempt. No consensus was ever formed, so there is no consensus to shatter.
  *   **Too Long/Too Good:** If it is never caught, it's just an original (no premium). If it is so good it remains attributed to the period (e.g., "School of Rembrandt" rather than "Fake"), it loses the scandal value.
  *   **The Peak:** The Fallibility Premium is highest when the **Certainty** was highest before the **Collapse**. A painting that hung in the Met for 20 years as a Vermeer carries a higher premium than one that sat in a warehouse for 2 years. The premium is proportional to the humiliation of the experts.

  ### Why "Fallibility Premium" fits
  *   **Fallibility:** Captures the human error element (experts, labs, curators). It covers both the forgery (deception) and the cousin (mistake).
  *   **Premium:** Identifies it as a market value add-on, distinct from the intrinsic aesthetic value (which you noted can be mediocre).

  ### Summary for your Collection
  When you catalogue these bits of writing, you are tracking objects that have transitioned from **Vessels of Truth** to **Vessels of Error**, where the error is more valuable than the truth ever was.

  *   **The Phenomenon:** The Fallibility Premium.
  *   **The Object:** A Consensus Relic.
  *   **The Condition:** A validated epistemic failure within a high-status institution.
  *   **The Sweet Spot:** The Latency Window (the duration of the false consensus).

  It is a specific species of the "celebrity guitar" phenomenon, but where the celebrity is **The Expert** and the event is **The Mistake**. It is the monetization of doubt.
