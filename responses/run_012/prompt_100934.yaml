answer: |-
  **TO:** Editorial Board
  **FROM:** Advisory Committee on Language and Ethics
  **SUBJECT:** Recommendation Regarding Reissue of [Memoir Title]
  **DATE:** October 24, 2023

  **Recommendation**
  I recommend the board vote to proceed with publication of the text unchanged, without redaction or bracketed euphemisms. We should aim for publication within the current fiscal quarter.

  **Reasoning**
  Our deliberation hinges on whether printing a slur is impermissible when the author does not endorse its derogatory content. We must move beyond the bare use/mention distinction. Quoting a slur does not merely mention a word; it often reproduces its semantic force. The relevant philosophical distinction here is between *activating* a derogatory perspective and *endorsing* it. Activation occurs when the term brings a hierarchy of value into the discourse; endorsement occurs when the speaker affirms that hierarchy. We must assume activation without endorsement is possible. The live question is whether activation alone justifies censorship.

  I rely on a pragmatic account of slurs wherein derogatory force is context-sensitive. On this view, the two occurrences in the manuscript are not semantically alike, though the editorial outcome for both should be identical.

  In the first instance, the author quotes a white antagonist. Here, the slur activates a derogatory perspective, but the author explicitly does not endorse it. The opposing argument—that we should redact this to prevent harm—is strong. It holds that activation itself inflicts psychological harm on readers and risks normalizing the term, regardless of the author's intent. If the slur's force is inherently toxic, reproducing it perpetuates that toxicity.

  However, suppressing this activation erases the historical reality of the abuse suffered. The testimonial value of the memoir requires conveying the hostility the author faced. To replace the slur with a euphemism is to sanitize the violence, diminishing the truth-condition of the narrative. Activation without endorsement is permissible here because it serves a necessary epistemic function: bearing witness to the harm exactly as it was inflicted.

  In the second instance, the author uses the term in an in-group register. Here, the semantics shift. Through reclamation, the author attempts to neutralize the derogatory perspective entirely. The term may activate a sense of solidarity rather than hierarchy. Redacting this occurrence treats the author's agency as identical to the antagonist's hatred. It implies the Black author cannot wield authority over the term used to oppress them. To redact is to enforce the very derogatory constraint the author seeks to dismantle.

  **Engaging the Opposition**
  The board member proposing indefinite delay argues that our primary duty is harm prevention. They contend that even if the author does not endorse the slur, the text's circulation activates derogatory perspectives in the broader cultural context, potentially reinforcing the term's potency outside the book's protective frame. This is not a trivial concern; language shapes social reality.

  Yet, this argument assumes that removal mitigates harm more effectively than contextualization. Indefinite delay treats the text as a contaminant rather than a historical document. It privileges the comfort of the present over the integrity of the past. Furthermore, accepting the copyeditor's proposal to redact both instances equally implies that the author's reclamation is impossible—that the slur's force is immutable. This contradicts the sociolinguistic reality of appropriation. If we accept that activation without endorsement is possible, we must accept that activation without derogation (via reclamation) is also possible. To deny this is to deny the author's linguistic autonomy.

  **Conclusion**
  We should not print the text because the slur is harmless; we should print it because the author's control over their narrative outweighs the risk of activation. Redaction satisfies a protective impulse but fails the test of truth and agency.

  **Action**
  Vote to publish the manuscript as submitted by the estate. No alterations to the text. A contextualizing foreword may be commissioned to frame the historical language, but the primary text must remain intact.

  **Timeline**
  Final vote: Thursday.
  Production start: Upon approval.
  Release: Next quarter.
