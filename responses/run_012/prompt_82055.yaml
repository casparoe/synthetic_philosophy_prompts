answer: |-
  There is no established name for this specific configuration.

  While the phenomenon sits at the intersection of several well-trodden areas in moral philosophy, none of the existing labels capture the joint operation of **sustained liability** and **denied credit** based specifically on the **provenance of the verdict**.

  *   **The Puzzle of Moral Testimony** (e.g., McGrath, Hills, Keller) concerns the *epistemic* propriety of deference (can you know the truth this way?) or the *moral worth* of the action (does this action display virtue?). It does not typically address why deference fails to mitigate blame in cases of error.
  *   **Culpable Ignorance** explains why the first agent is blamed (she should have known better), but it does not explain why the second agent is denied credit (she did the right thing, after all).
  *   **Moral Luck** is excluded, as you noted, because the asymmetry holds regardless of the outcome's contingency; it is structural to the deference itself.
  *   **Command Responsibility** (legal/military) typically flows upward (the superior is liable for the subordinate), whereas your case concerns the liability of the subordinate who defers.

  Because the existing vocabulary fragments the phenomenon—treating the blame side as a failure of diligence and the praise side as a failure of worth—I propose the coinage:

  ### **The Asymmetry of Moral Authorship**

  This label is chosen to do specific conceptual work. It posits that moral evaluation tracks two different objects: the **deed** (the enactment) and the **design** (the reasoning). The asymmetry arises because we treat agents as the irrevocable *authors* of their deeds (making them liable for harm) but not as the *authors* of borrowed designs (making them ineligible for credit).

  Here is how the boundaries are drawn and how the concept answers your specific questions.

  ---

  ### 1. What work does the name do? (Boundaries and Neighbours)

  The **Asymmetry of Moral Authorship** distinguishes itself from its neighbours by locating the friction point not in *knowledge* or *outcome*, but in *ownership*.

  *   **Boundary vs. Moral Worth:** Traditional accounts of moral worth (e.g., Kantian or Arpaly-style) explain why the second agent gets no credit: she lacks the right motivational structure. However, these accounts often suggest that if the action is right and the agent is non-culpably ignorant, blame should be mitigated. The Asymmetry of Moral Authorship insists that blame is *not* mitigated. It draws a boundary around **negative duties** (do no harm) which are non-delegable, versus **positive duties** (do good) which require personal authorship for merit.
  *   **Boundary vs. Culpable Ignorance:** Culpable ignorance explains the blame but treats it as an independent failure (the failure to inquire). The Asymmetry of Moral Authorship treats the blame as attaching to the *act of deference itself* when the act is harmful. It suggests that handing over one's moral judgment is a risk one owns entirely if it goes wrong, but a risk one cannot claim as a virtue if it goes right.
  *   **Boundary vs. Coercion:** If the mentor *coerced* the junior employee, blame would be mitigated (duress). The Asymmetry of Moral Authorship applies only where the deference is voluntary. The boundary is drawn at the point of **volitional surrender**. You may voluntarily surrender your judgment, but you cannot voluntarily surrender your liability for the physical enactment of that judgment.

  ### 2. What is the basis of the asymmetry?

  You ask if this rests on the thought that "one owes it to a person to let her make her own moral mistakes." I would argue it is deeper than a paternalistic duty to allow error. It rests on the **Non-Delegability of Negative Duties**.

  *   **Blame (The Deed):** Moral agency imposes a strict duty not to harm others. This duty is attached to the *capacity to act*, not the *capacity to reason*. If you have the physical power to stop a harm, you cannot excuse yourself by saying, "I was told this wasn't a harm." The prohibition against harming is agent-relative and non-transferable. You remain the author of the harm because your will enacted it.
  *   **Credit (The Design):** Moral merit, conversely, is attached to the *alignment of the will with the good*. If the alignment is provided by another (the mentor), the merit belongs to the provider of the alignment. You are merely the instrument. Instruments do not accrue virtue; they accrue utility.

  Therefore, the asymmetry is not about protecting the agent's right to err; it is about the **stickiness of harm** versus the **elusiveness of virtue**. Harm attaches to the world through your hands; virtue attaches to your character through your head. If you borrow the head but keep the hands, you get the blame for the hands but not the credit for the head.

  ### 3. Does it survive non-human sources (Institutions, Texts, Machines)?

  Yes, and its persistence there clarifies the concept.

  *   **Institutions/Texts:** If an agent follows a corporate policy or a religious text that results in harm, they are held liable (e.g., "I was just following company policy" is not a legal or moral defense for discrimination). If the policy results in good, the agent is seen as compliant, not virtuous. The Asymmetry of Moral Authorship holds because the *provenance* is still external.
  *   **Machines/Algorithms:** This is the stress test. If a doctor uses an AI diagnostic tool that is wrong, the doctor is liable (malpractice). If the AI is right, the doctor is competent, but not necessarily *morally praiseworthy* for the specific judgment (they are praised for tool selection, not the verdict).
  *   **The Limit:** The asymmetry dissolves only if the agent *cannot* judge. If the "machine" is actually a gun to the head (coercion), or if the agent lacks the cognitive capacity to understand the verdict (incapacity), then authorship is voided. But where capacity exists, deference to a machine is treated the same as deference to a mentor: you own the output.

  ### 4. Fault vs. Judgment: What becomes of the agent who never judges?

  You ask if fault attaches to *what one does* while merit attaches to *what one has judged*. If so, what happens to the agent who never judges for herself?

  Under the Asymmetry of Moral Authorship, such an agent becomes a **Moral Vector**.

  *   **Accumulation of Risk:** This agent accumulates liability without accumulating character. They become a high-risk entity in the moral landscape. They are a conduit through which harm can easily flow (because they do not filter it through personal judgment) but through which moral good cannot be authentically generated.
  *   **The Hollow Agent:** Over time, this agent is not viewed as a moral participant but as a force of nature or a bureaucratic function. We do not hate them for their wrongs (as we might a malicious agent), but we do not trust them. We do not admire them for their rights, but we may rely on them.
  *   **The Verdict:** The ultimate implication of this asymmetry is that **moral agency is constitutively risky.** To be a moral agent is to accept the risk of error that comes with independent judgment. If you attempt to offload the risk of error (by deferring), you inadvertently offload the possibility of merit, while retaining the liability for the error. You cannot outsource the risk without outsourcing the reward, but you *cannot* outsource the liability.

  ### Summary of the Coinage

  **The Asymmetry of Moral Authorship** names the structural condition where:
  1.  **Liability** tracks the **enactment** of the will (which remains the agent's own).
  2.  **Merit** tracks the **generation** of the reason (which is borrowed).
  3.  **Provenance** determines the flow of credit, but **Volition** determines the flow of blame.

  It captures your observation that the borrowed verdict is "transparent to blame and opaque to praise" by reframing it: The agent is transparent to the *harm* they cause (it passes through them to the victim), but opaque to the *good* they do (it stops at them, unable to penetrate their moral character because it did not originate there).
