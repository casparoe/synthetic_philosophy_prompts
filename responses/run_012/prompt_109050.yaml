  **MEMORANDUM**

  **TO:** All Programme Directors, Division of Biological Sciences
  **FROM:** Research-Allocation Committee, Institute for Empirical Warrant
  **DATE:** 14 October 2023
  **SUBJECT:** Implementation of Demarcation Protocol 7.1 and Status of Evolutionary Biology Programme

  1. Pursuant to the Board vote of 1 October, the Falsifiability Criterion is now the sole determinant for Category A funding. Allocation decisions are guided by the Forbiddingness Score: the number of conceivable observations a hypothesis rules out, discounted by the probability that anyone would ever get round to looking. This memorandum reports the outcome of the review of the Evolutionary Biology Programme under these provisions.

  2. The Committee examined the core principle of natural selection. It was observed that the principle states entities with advantageous traits are more likely to persist. As "advantageous" is defined retrospectively by persistence, the principle forbids no conceivable state of affairs. Any outcome can be accommodated by positing a hidden variable or environmental constraint. Consequently, the core mechanism yields a Forbiddingness Score of 0.0. Its explanatory power is assessed as purely retrospective.

  3. Specific adaptation claims were reviewed as narrative reconstructions. Regarding the plumage of *Pavo cristatus*, the hypothesis posits sexual selection. The Committee requested a pre-specified observation that would settle the matter. It was noted that an indefinite family of rival stories (e.g., predator deflection, species recognition) can be told about the same evidence. Without a specified observation that would compel abandonment of the sexual selection hypothesis prior to data collection, the claim functions as a hermeneutic framework rather than an empirical warrant.

  4. The historical claim of common descent was distinguished from the mechanism driving it. The Committee notes that geology, cosmology, and palaeontology rely on singular historical events that cannot be rerun. These fields fall under the same indictment regarding predictive falsifiability. Consistency requires equal treatment across the Division. To defund these programmes outright would disrupt the administrative organization of the Institute.

  5. Accordingly, a middle bureaucratic category is invented: the Provisional Metaphysical Research Programme (PMRP). Programmes designated PMRP will be funded at 40% of previous levels. Principal Investigators are barred from citing their own findings in the annual report as empirical warrant for further funding. This category is retained on the ground that the unfalsifiable core is indispensable for organizing the work that does earn full funding, such as genetics and biochemistry.

  6. The Committee turns the criterion on itself. The Demarcation Protocol is a normative claim regarding methodology; it is not empirically falsifiable. The Philosophy of Science Committee, which drafted the Protocol, is hereby reclassified as PMRP. Their administrative directives remain in force due to indispensable organizational utility, though their philosophical outputs will no longer appear in the Institute's catalog of empirical findings. This circularity is noted as an administrative necessity.

  **APPENDIX A: FORBIDDINGNESS SCORE CALCULATIONS**

  | Hypothesis | Conceivable Observations Ruled Out | Probability of Observation | Score |
  | :--- | :--- | :--- | :--- |
  | Natural Selection (General) | 0 | N/A | 0.0 |
  | Peacock Tail (Sexual Selection) | 1 (Zero mating success) | 0.05 (Ethical constraints) | 0.05 |
  | Demarcation Protocol | 0 | N/A | 0.0 |

  **MINORITY NOTE**

  **Dr. Elara Vance, Committee Member:**
  I accept the Falsifiability Criterion as binding. However, I dissent from the classification of the Evolutionary Biology Programme as PMRP. The Committee treats selection pressures as retrospective labels. I argue that where selection pressures are specified independently of the outcomes they are invoked to explain—for example, measuring calorific costs of plumage against predation risk profiles prior to observing mating success—the hypothesis becomes falsifiable. The Forbiddingness Score should reflect these independent specifications. To classify the entire programme as metaphysical ignores the subset of work that meets the Institute's own standard. I recommend a granular review rather than a blanket reclassification.
