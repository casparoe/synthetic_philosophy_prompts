answer: |-
  The rain on the tin roof of the field station sounded like static, a white noise that matched the hum in Elena's head. It was 3:00 AM. The negotiation was at 9:00.

  On the table lay her field notebook, open to the entry for *kora*. It was the pivot point of the entire dispute. The government surveyors wanted to lease the Salt Flat for mining. The Kaelo elders insisted they could not permit it. Their justification was always the same sentence: *We kora this ground.*

  Elena had two translation manuals. Both were perfect. Both fit every utterance, every gesture, every silence she had recorded over eighteen months.

  Manual A translated *kora* as "own." In this framework, *kora* was a juridical relation. It persisted through time. If a father *kora* a plot, his son *kora* it after him, even if the son never walked there. It allowed for violation; someone could trespass on *kora* land without the holder noticing, yet the relation held.

  Manual B translated *kora* as "tend." In this framework, it was a somatic relation. It existed only in the act of usage. If you stopped working the ground, you stopped *kora*-ing it. Inheritance was not a transfer of title, but a continuation of labor. If the land lay fallow, the *kora* dissolved.

  The problem was that the Kaelo language offered no leverage to pry them apart.

  Elena turned the page. She had tried the standard moves. Three months ago, she had taken an elder to the Old Field, a patch of scrubland untouched for a generation. She had pointed to the ground. "Did your grandfather *kora* this?"

  "Yes," the elder had said.

  "Does anyone *kora* it now?"

  "No."

  Manual A read this as: *We own it, but currently, no one holds the title (perhaps it is in abeyance).*
  Manual B read this as: *He worked it then. No one works it now.*

  The behavioral evidence was identical. She had tried modifiers. She asked if one could *kora* "forever." The Kaelo had no word for forever. They said, "As long as the rain comes." Manual A interpreted this as a conditional title. Manual B interpreted it as a description of ongoing labor cycles.

  She had tried to trap the concept using negation. "If I steal a stone from here, do I break the *kora*?"
  "The stone is not the ground," was the reply.
  Manual A: *Ownership is of the land, not the loose parts.*
  Manual B: *Labor is on the soil, not the rocks.*

  Every test she devised was absorbed by the rival manuals like water into sand. They disagreed on the ontology, but they agreed on the observable behavior. And now, at 9:00 AM, she would have to speak for them.

  She rubbed her eyes and looked at her own hands. She was wearing a silver ring, an heirloom. She "owned" it. She was also staying in this government housing unit. She "occupied" it. But in her contract, the word was "leasehold interest." She looked at the legal pad beside her notebook, where she had drafted the translation for the morning.

  *We own this ground.*

  She stared at the word "own." Did she own her house? She had a mortgage. The bank held the title. Did she own her body? The state could conscript it. She realized with a cold jolt that her own language was just as muddy as the Kaelo's. "Ownership" in English was a bundle of rights, some of which could be severed without breaking the word. She couldn't use her own tongue as a fixed point because her own tongue was floating in the same fog.

  If she chose Manual A ("Own"), the government surveyors would nod. They understood property. They would recognize the Kaelo claim. But recognition came with a price. To own land under state law was to enter a system of taxes, boundaries, and alienability. The Kaelo would become landlords. They could sell the Salt Flat. They could be evicted for non-payment of taxes on land they never sought to monetize. The *kora* would become a commodity, preserved legally but gutted spiritually.

  If she chose Manual B ("Tend"), she would honor the labor ontology. She would translate: *We work this ground.* The surveyors would check their charts. The Salt Flat was currently fallow. There was no active mining or farming. Under state law, unused land reverted to the crown. The Kaelo would lose the land entirely. The truth of their connection would be preserved in the transcript, but the land itself would be gone.

  There was no fact of the matter to save them. The universe did not care whether *kora* was a relation of title or a relation of labor. Only the translation would make it real.

  The sun began to bleed through the shutters. Elena packed her notebook. She didn't burn the second manual; she just closed it. That was the violence of it. Not destroying the truth, but ignoring it.

  The meeting tent was humid and smelled of wet canvas and coffee. The lead surveyor, a man named Harris, shuffled papers. Three Kaelo elders sat opposite him, silent, their hands resting on their knees. They looked at Elena. She was the bridge.

  Harris looked up. "Dr. Vance. We need to establish standing. Do the Kaelo claim title to the Salt Flat?"

  Elena opened her mouth. She felt the weight of the two manuals pressing against her tongue. She knew that whatever she said, she would be lying. Not because she would misstate the words, but because she would force a binary choice onto a superposition.

  If she said "Yes, they own it," she sold them into a legal system that would eat their culture.
  If she said "No, they work it," she handed the land to the mining company.

  She looked at the eldest Kaelo, a woman named Iara. Iara didn't look afraid. She looked expectant. She knew Elena held the knife.

  Elena realized the indeterminacy wasn't a puzzle to be solved. It was a space to be collapsed. And the collapse would generate heat.

  "They claim *kora*," Elena said.

  Harris frowned. "That's not a legal term. Does it mean ownership?"

  Elena looked at her notes. She could see the ghost of the other manual hovering over the page. If she chose "ownership," she solidified a boundary where there was none. If she chose "usage," she erased a continuity that existed.

  "It implies exclusive right to use," Elena said. It was a hybrid, a clumsy stitch job that satisfied neither manual fully but was intelligible to Harris.

  Harris nodded slowly. "Exclusive right. So, property."

  "And ongoing obligation," Elena added, her voice tight.

  "Obligation?" Harris tapped his pen. "Like a lease condition?"

  "Like a... requirement to maintain."

  Harris shrugged. "If they don't maintain it, the claim lapses?"

  Elena froze. This was the crux.
  Manual A: No. Ownership survives neglect.
  Manual B: Yes. Usage requires action.

  If she said "Yes," the land was lost if it lay fallow.
  If she said "No," the land was taxed regardless of use.

  She looked at Iara. Iara gave a barely perceptible nod. Not of instruction, but of resignation. They knew their word was being stretched to fit a foreign mold.

  "The claim persists," Elena lied. She chose Manual A.

  She chose it because it kept the land in Kaelo hands for today. She chose it because losing the land immediately was a tangible defeat, while the corrosion of culture was a slow poison. She chose the acute injury over the chronic disease.

  Harris smiled. "Okay. Then we can discuss compensation for surface rights."

  Elena sat down. She had secured the land. She had also turned the Salt Flat into a commodity that could be bought, sold, and taxed. She had translated *kora* into "own," and in doing so, she had made the Kaelo owners. They had never been owners before. Now they were.

  She opened her notebook under the table. She took a pen and drew a single line through Manual B. It wasn't that Manual B was wrong. It was just that it was no longer possible. The reality had hardened around her choice. The indeterminacy was gone, and with it, the freedom of the word.

  Outside, the rain stopped. The ground was wet, but the water was already running off, channeling into ditches, bounded by banks. Elena closed the book. She had saved the land, and she had lost it.
