          *   *Twist:* Introduce counter-examples immediately to show the rule fails.
          *   *Time:* 20 mins.

      *   **Phase 2 (The Grid Game):**
          *   *Concept:* This is the core "Letter Spirit" mechanic. Needs a grid. 8x8 or 10x10 is standard for this kind of pixel-art letter design.
          *   *Seeds:* How to make them? The user needs to draw 3 letters (e.g., a, c, e) in a specific constrained style on a grid *before* the session.
          *   *Task:* Groups (maybe 3 groups of 4-5?) get the seeds. They must draw 3 *new* letters (e.g., b, d, g) in that style.
          *   *Judging:* Swap packs. Judge Identity (is it a 'b'?) and Style (does it match the seeds?). Score 1-5 on each.
