      *   *Critique:* Phase 3 (Degradation) might take too long if passed around 14 people.
      *   *Adjustment:* Do it in parallel lines or just one long chain but keep changes *very* small. Actually, a single chain of 14 steps is perfect for 10 mins if everyone is quick. Let's specify "one small change per person".
      *   *Critique:* The "Seeds" for Phase 2 need to be prepared by the host. I need to be very clear on *how* to make good seeds.
      *   *Adjustment:* Add a "Host Prep" section specifically for the Seed Letters.

  6.  **Final Polish:**
      *   Ensure the distinction between "Identity" (is it an 'a'?) and "Style" (does it match the set?) is clear in the scoring.
