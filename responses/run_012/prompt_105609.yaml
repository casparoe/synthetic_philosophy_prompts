answer: |-
  # Session Plan: The Letter Spirit Workshop
  **Duration:** 90 minutes
  **Participants:** 14 (Mixed disciplines)
  **Facilitator:** You

  ## Overview
  This session is designed to make the tension between *identity* (what makes a letter itself) and *style* (what makes a set of letters cohere) physically felt. We are avoiding theory at the start. The concepts emerge from the friction of the tasks.

  ## Materials Required
  *   **A3 Paper:** 10 sheets (for group work).
  *   **A4 Paper:** 14 copies of the 'a' Sort Sheet (see Prep).
  *   **Grid Pads:** 3 pads of graph paper (5mm squares) or printed grids.
  *   **Thick Black Markers:** 10 (fine liners are too fiddly; you want bold strokes).
  *   **Sticky Dots:** Red and Green (for voting/scoring).
  *   **Timer:** Visible to the room.

  ---

  ## Host Preparation (Do this before the session)

  **1. The 'a' Sort Sheet**
  Create a single A4 page with 20 instances of the letter 'a'.
  *   *Definite:* Standard Times New Roman, handwritten print, clear bold sans-serif.
  *   *Borderline:* A very looped cursive 'a', a single-storey 'a' that looks like an 'o' with a tail, a blackletter 'a' that looks abstract.
  *   *Not-an-'a':* A lowercase 'd' flipped, a Greek alpha, a symbol that looks like an 'a' but isn't (e.g., the '@' sign without the circle).
  *   *Layout:* Randomise them. Do not label them.

  **2. The Style Seeds (Crucial)**
  You need to create three "Seed Packs". Each pack contains one sheet showing three letters drawn on a grid (e.g., 8x8 squares).
  *   *How to make them:* Draw on graph paper with a thick marker. Fill in squares to make the letter.
  *   *The Constraint:* The style must be distinct but legible.
      *   *Pack A (The Block):* Letters made only of horizontal and vertical lines (no diagonals).
      *   *Pack B (The Dot):* Letters formed by disconnected dots in the grid squares.
      *   *Pack C (The Slant):* All vertical lines are shifted one square to the right (italicised pixel art).
  *   *Content:* Each pack should show the letters **a, c, e**. These are the "seeds". The groups will have to design **b, d, g** in the same style.

  ---

  ## The Session Flow

  ### 1. Introduction (5 Minutes)
  Welcome everyone. Briefly state the aim: "Tonight is about the friction between recognising a thing and styling a thing. We aren't discussing theory yet; we are going to run into the problem with our hands."

  ### 2. Phase One: The 'a' Trap (20 Minutes)
  *   **Sort (5 mins):** Hand out the 'a' Sort Sheets. Ask participants to work individually. They must circle the 'a's they are sure of, put a question mark next to the borderline ones, and cross out the non-'a's.
  *   **Rule (5 mins):** Ask them to write a single sentence at the bottom of the page: *"To be an 'a', a shape must..."*
  *   **The Break (5 mins):** Hand out a small slip of paper with two images:
      1.  A shape their rule excludes but *is* an 'a' (e.g., a single-storey handwritten 'a' if their rule said "must have two storeys").
      2.  A shape their rule admits but *is not* an 'a' (e.g., an '@' symbol if their rule said "must have a loop and a tail").
  *   **Pair Discussion (5 mins):** Turn to a neighbour. Compare rules. Acknowledge that the rule has failed.
  *   **Facilitator Note:** Do not solve this. Let the frustration sit. The point is that definition by necessary conditions fails here.

  ### 3. Phase Two: The Style Extension Game (40 Minutes)
  *   **Group Up (5 mins):** Divide the room into three groups (approx. 5 people each). Give each group a different Style Seed Pack (a, c, e on grids) and a pack of grid paper/markers.
  *   **The Task (20 mins):** The group must design the letters **b, d, and g** on the grids.
      *   *Constraint 1:* They must use the same grid size as the seeds.
      *   *Constraint 2:* They must match the *style* of the seeds perfectly.
      *   *Constraint 3:* The letters must still be readable as b, d, and g.
  *   **The Swap & Judge (15 mins):** Groups swap their completed grids with another group (blind).
      *   The judging group gets two colours of sticky dots.
      *   **Green Dot (Identity):** Stick on letters that are clearly readable as the intended character.
      *   **Red Dot (Style):** Stick on letters that feel like they belong to the original seed set (a, c, e).
      *   *Scoring:* A letter can get a Green but not a Red (readable but wrong style), or Red but not Green (stylish but illegible).
  *   **Facilitator Note:** Watch for the tension. Designers will want to make it pretty; philosophers will want to define the style rules. Encourage the conflict.

  ### 4. Phase Three: The Degradation Chain (10 Minutes)
  *   **Setup:** Stand in a circle or long line. Give the first person a large sheet with a clear, standard 'a' drawn on it.
  *   **Action:** Person 1 copies the 'a' onto a fresh sheet, but changes *one tiny thing* (a curve straighter, a tail shorter). They pass the *new* sheet to Person 2. Person 2 copies Person 1's version, changing one tiny thing.
  *   **End Game:** Continue until the 14th person.
  *   **Review:** Lay all 14 sheets out in order.
  *   **Question:** Ask the room to raise their hand at the exact moment the letter stopped being an 'a'.
  *   **Observation:** Hands will go up at different points. There is no consensus.

  ### 5. Debrief (15 Minutes)
  Bring everyone back to seats. Do not lecture; ask questions that map their experience to the concepts.

  *   **On Identity:** "In Phase One, why did your rule fail?"
      *   *Target Concept:* **Family Resemblance.** There is no single feature all 'a's share. We recognise them by a cluster of similarities, not a checklist.
  *   **On Roles:** "In Phase Two, how did you decide where to put the lines on the grid?"
      *   *Target Concept:* **Functional Roles.** You weren't thinking about geometry; you were thinking about roles (this needs to be a 'bowl', this needs to be a 'stem', this must sit on the baseline). Identity is about role, not shape.
  *   **On Style vs. Identity:** "Look at the sticky dot scores. Did high style coherence kill readability?"
      *   *Target Concept:* **The Tension.** Identity and Style are independent dimensions. You can have a perfect style that is unreadable, and a readable letter that breaks the style. The "Spirit" is balancing these.
  *   **On Perception:** "In the Degradation Chain, why couldn't we agree on when it broke?"
      *   *Target Concept:* **Fluid Perception.** The Letter Spirit project claims that perception isn't rigid. We slide our interpretation to fit the context. The computer programme's goal wasn't to draw letters, but to *perceive* the roles fluidly enough to generate new ones.

  ---

  ## Troubleshooting: What Goes Wrong

  **1. The Designers Take Over**
  *   *The Problem:* In Phase Two, the graphic designers in the group might dominate the drawing, treating it as an art task rather than a logic puzzle.
  *   *The Fix:* Intervene at the 10-minute mark. Remind them: "This is not about good design; it is about consistent rules. If you can't explain *why* a line goes in that square based on the seeds, don't draw it."

  **2. The Philosophers Paralyse**
  *   *The Problem:* In Phase One, the group might get stuck debating the definition of 'a' and never move to the drawing task.
  *   *The Fix:* Be ruthless with the timer. When the 5 minutes for the Rule are up, clap your hands and issue the counter-examples immediately. Say: "The rule is already broken. Move on."

  **3. The Grids Are Too Fiddly**
  *   *The Problem:* 8x8 grids are small. If people use thin pens, it looks messy and style is hard to judge.
  *   *The Fix:* Ensure you provide thick felt-tip markers. Tell them to fill whole squares, not draw lines *on* the grid. It forces a pixel-art aesthetic which makes style easier to copy.

  **4. The Degradation Chain Stalls**
  *   *The Problem:* People hesitate to change the letter because they don't want to "ruin" it.
  *   *The Fix:* Instruct the first three people explicitly to make the changes very subtle. Once the momentum starts, others will follow.

  ---

  ## Limitations: What You Must Supply

  This activity reproduces the *tension* of the Letter Spirit project, but it cannot reproduce the *mechanism*. You will need to verbally bridge this gap in the debrief.

  1.  **The Speed of Perception:** The humans in the room are slow. They deliberate consciously. The Letter Spirit programme was about subconscious, parallel processing—how the brain snaps into recognition instantly. You need to mention that the "Spirit" is the unconscious speed of this role-mapping, which the activity slows down artificially.
  2.  **The Feedback Loop:** In the original project, the programme evaluates its own output and adjusts. In this workshop, the evaluation is external (the other groups). You need to point out that true creativity requires the *creator* to be the first critic of their own style-identity balance.
  3.  **The "Spirit" Itself:** The activity shows the *letters*, but not the *ghost*. The idea that there is an abstract "spirit" of a typeface that exists independently of any specific letter is a metaphysical claim. The activity shows the *effect* of this spirit (coherence), but you must articulate that the "Spirit" is the set of hidden constraints the group intuitively followed.

  ## Facilitator's Closing Line
  "We spent ninety minutes trying to define what a letter is and what a style is. The computer programme Hofstadter built failed, too. But it failed beautifully. It showed us that meaning isn't in the ink; it's in the pressure between who we are and what we see."
