answer: |-
  President, Trustees, Faculty, Families, and most importantly, the Class of 2024.

  The Provost gave me a single instruction for today: say something about what an education is actually for. It is a daunting request for a philosopher, specifically because philosophy often begins by admitting we do not know the answers. But after decades in these classrooms, I have come to believe that your education here was not primarily about filling your minds with answers. It was about changing the status of the answers you hold.

  Consider an old puzzle from Plato's *Meno*. Imagine you need to get to a specific destination. There are two travelers. The first has traveled the road many times; she knows the way. The second has never been there but has heard a rumor about the direction and happens to believe the truth. Both set off. Both arrive safely.

  If the outcome is identical, why do we prize the knowledge of the first traveler over the true belief of the second? In a world of instantaneous answers, this is not merely academic. You can Google a fact, ask an algorithm for a diagnosis, or rely on a pundit's prediction. If the belief is true, it guides action just as well as knowledge. So, why did you spend four years here? Why not just collect true beliefs like souvenirs?

  It is tempting to say knowledge is morally superior, but that misses the point. A true belief gets you to Larissa just as fast as knowledge does. In a static world, they are functionally equivalent. If the only metric of education were successful navigation from point A to point B, we could have saved you the tuition and simply handed you a list of correct opinions.

  But we do not live in a static world.

  Plato offers an image to explain the difference. He says that true beliefs are like the magnificent automated statues crafted by the legendary artisan Daedalus. They are beautiful and valuable, but they have a flaw: they are prone to run away. Unless they are tied down, they will not stay long in your possession. You might believe the truth today, but without understanding *why* it is true, that belief is fugitive. It can be stolen by a rhetorician, shaken by a crisis, or abandoned when the context shifts.

  This is where the puzzle finds its resolution. Education is the cord that ties the statue down.

  When you merely believe the truth, you are dependent on the world remaining exactly as you found it. If the road to Larissa is closed due to a landslide, the traveler with mere true belief is stuck. She knows *that* the left fork was the way, but not *why*. She cannot recalibrate. The traveler with knowledge understands the terrain, the geography, the reasoning behind the route. When the path changes, she can find a new way.

  We are sending you into a society flooded with Daedalus statues. Information is abundant; understanding is scarce. You will be surrounded by people who hold true beliefs they cannot defend, and false beliefs they cannot relinquish. In this environment, the value of your liberal arts education is not that you possess more true beliefs than anyone else. It is that you have practiced the art of tying them down.

  Do not misunderstand me. Do not despise true belief. Sometimes, you must act before you have time for full understanding. In an emergency, a correct hunch is a gift. But you cannot build a life, a career, or a democracy on hunches alone. Ungrounded truths are fragile. They shatter under pressure.

  Your task now is to take the truths you encounter—whether in science, ethics, or public life—and demand an account of them. Ask not only if they are true, but what holds them true. Trace the causes. Understand the structure. When you do this, you convert a fleeing statue into a permanent resident of your mind.

  This is what we mean by critical thinking. It is not just skepticism; it is anchoring. It is the labor of turning luck into reliability.

  So, go forth into this world of instantaneous answers. Collect your true beliefs; they are necessary for navigation. But do not stop there. Do the work of knowledge. Tie the statues down. For when the maps change, and they will, it will not be the lucky guessers who lead us home. It will be those who know the way.

  Congratulations.
