answer: |-
  You have stumbled directly onto one of the most famous and difficult problems in contemporary epistemology. It is known as the **Problem of Easy Knowledge** or the **Bootstrapping Problem** (associated with philosophers like Stewart Cohen and Jonathan Vogel).

  Your gut is fighting against a specific logical flaw: **Epistemic Circularity.**

  You want a principle. Here is the principle that best fits your intuitions while surviving the logical scrutiny you're asking for.

  ### The Principle: The Independence Constraint

  > **To verify that a Source $S$ is reliable regarding a Fact $F$, your justification for believing $F$ must not depend on assuming that $S$ is reliable regarding $F$.**

  In simpler terms: You cannot use the output of a machine to prove the machine is working, unless you have a way of knowing the output is correct *without* using the machine.

  Let's apply this constraint to your cases to see which verdicts hold and which need nuance.

  ---

  ### Applying the Principle to Your Cases

  **1. The Thermometer (Your Verdict: Bad)**
  *   **Analysis:** You believe the room is 70° *only* because the thermometer says so.
  *   **Constraint Check:** To conclude the thermometer is reliable, you need to know it is actually 70°. But your only reason for thinking it is 70° is the thermometer itself.
  *   **Result:** **Violation.** You are assuming the conclusion (thermometer works) to prove the premise (it is 70°). Your gut is right.

  **2. The Scale and Weight (Your Verdict: Good)**
  *   **Analysis:** You have a calibrated 1kg weight.
  *   **Constraint Check:** How do you know the weight is 1kg? Presumably, it was certified by a standards body or manufactured to a tolerance independent of *this specific kitchen scale*.
  *   **Result:** **Pass.** The "truth" of the weight (1kg) is established independently of the scale reading it. The scale is being tested against an external standard.

  **3. Memory (Your Verdict: Bad)**
  *   **Analysis:** "I remember my memory is good."
  *   **Constraint Check:** The evidence (the memory) is the very faculty being tested.
  *   **Result:** **Violation.** This is pure bootstrapping.

  **4. Perception / Hands (Your Verdict: Bad)**
  *   **Analysis:** "I see hands, so I'm not hallucinating."
  *   **Constraint Check:** If you were hallucinating, you would *still* seem to see hands. The appearance cannot verify the reality of the appearance without an independent check (e.g., touching the hands, asking a friend).
  *   **Result:** **Violation.**

  **5. The Color Swatches (Your Verdict: Good, but worried)**
  *   **Analysis:** You look at a red patch, guess "Red," check the back, it says "RED."
  *   **Constraint Check:** This is the critical case. Are you using vision to check vision?
      *   **Yes:** If you assume *all* vision is suspect (Global Doubt), this fails. If you are a Brain in a Vat, you can't read the back of the card either.
      *   **No:** If you suspect only *color discrimination* is suspect (Local Doubt), this passes. You are using **shape recognition/acuity** (reading the letters "R-E-D") to verify **color qualia**. These are distinct cognitive sub-routines.
  *   **Result:** **Pass, conditionally.** This works for *local* calibration (testing color specifically) but fails for *global* skepticism (testing eyesight generally).
  *   **The Nuance:** The "back of the card" acts as the independent standard (like the 1kg weight), *provided* you trust your ability to read text more than your ability to distinguish hues.

  **6. The Friend (Your Verdict: Good)**
  *   **Analysis:** Friend says library closes at 6. You go and see it is closed.
  *   **Constraint Check:** You verified the library status via **observation**, not via the friend's testimony.
  *   **Result:** **Pass.** This is not bootstrapping; this is building a **Track Record**.
  *   **The History Extension:** You trust the friend on history because they have a track record of truthfulness (established via independent checks). This is inductive reasoning, not circular reasoning. You aren't using their history claims to verify their history claims; you are using past verified claims to predict future unverified ones.

  ---

  ### The Test Cases

  Here is how the Independence Constraint handles your two specific tests.

  **Test 1: Two Broken Clocks**
  *   **Scenario:** Two clocks are stopped at 12:00. They agree with each other.
  *   **Verdict:** **Bad / Unreliable.**
  *   **Why:** Agreement is not Independence. Both clocks are Source $A$ and Source $B$, but neither has contact with Reality $F$ (the actual time). They are coherent with each other, but not connected to the truth. The principle requires an independent link to the *fact*, not just agreement between *sources*.

  **Test 2: LASIK and the Eye Chart**
  *   **Scenario:** Patient reads chart post-surgery. Doctor says "20/20." Patient trusts the chart.
  *   **Verdict:** **Good (with a caveat).**
  *   **Why:** The Eye Chart is not the patient's vision; it is an **External Standard**.
      *   *The Caveat:* If the patient thinks, "I can read the chart, therefore the chart is accurate," that is bad (Thermometer move).
      *   *The Correct Reasoning:* "The chart was calibrated by the manufacturer/optometrist (Independent Source). I can read it. Therefore, my eyes match the standard."
      *   The patient is not certifying the chart; the patient is accepting the chart as the certifier.

  ---

  ### Which Verdicts Must You Give Up?

  To have a clean principle, you have to accept one hard truth about the **Color Swatch / Vision** case.

  **You must distinguish between Local and Global Doubt.**

  1.  **If you doubt everything (Global):** You cannot use the color swatches. If your eyes are lying to you about color, they might be lying to you about the letters on the back of the card. If you want to be logically airtight against "Am I a Brain in a Vat?", the swatch test fails.
  2.  **If you doubt specific functions (Local):** The swatch test works. You assume basic acuity (shapes/letters) to test specific processing (color).

  **The Sacrifice:** You have to admit that the Color Swatch case is *structurally identical* to the Thermometer case **IF** you treat "Vision" as one single monolithic block. To save the Swatch case, you must treat "Vision" as a bundle of distinct tools (acuity, color, depth) where one can test the other.

  If you refuse to split "Vision" into sub-tools, you must concede the Swatch case is bad reasoning. Most people (and scientists) accept the split, so the Swatch case is usually saved.

  ### Summary of the Rule

  To apply this yourself in the future, ask these three questions:

  1.  **What is the Fact?** (e.g., It is 70°, The weight is 1kg, The color is Red).
  2.  **How do I know the Fact is true?** (e.g., Thermometer says so, Standard Weight says so, Card Label says so).
  3.  **Does knowing the Fact rely on the Source I'm testing?**
      *   If **Yes** (Thermometer, Memory): **Bootstrapping. Invalid.**
      *   If **No** (Standard Weight, Card Label, Seeing the Closed Door): **Calibration. Valid.**

  **One final warning:** Be careful of "Coherence." Two broken clocks agreeing, or a dream that feels consistent, satisfies coherence but fails Independence. Always look for the link to the external standard that exists *outside* the system you are testing.
