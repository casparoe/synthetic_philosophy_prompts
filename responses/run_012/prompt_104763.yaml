answer: |-
  **The Reversible-Measurement Szilard Engine**

  **Setup:** A single classical particle in a box of volume $V$ coupled to a thermal reservoir at temperature $T$. A demon possesses a single binary memory bit $M$, initialized to 0.
  **Primitives:** (1) **Measure:** Reversibly copy the particle's side (L=0, R=1) to $M$ (operation: if Particle=R, flip $M$). Since $M$ starts at 0, this correlates $M$ with the particle without overwriting prior data, preserving joint information. (2) **Act:** Quasistatically move a partition based on $M$ to expand the gas from $V/2$ to $V$. (3) **Reset:** Irreversibly set $M \to 0$.

  **The Cycle:**
  1.  **Insert:** Place a frictionless partition at $V/2$. (Work $W=0$).
  2.  **Measure:** Execute Primitive 1. $M$ becomes 0 (if L) or 1 (if R). Joint entropy $S_{gas+M}$ is unchanged; correlation established.
  3.  **Extract:** Execute Primitive 2. If $M=0$, move partition right; if $M=1$, move left. The gas expands isothermally. Work extracted $W_{out} = k_B T \ln 2$.
  4.  **Reset Gas:** Remove partition. Particle delocalizes to $V$. Re-insert partition at $V/2$. (Net $W=0$).
  5.  **Reset Memory:** Execute Primitive 3. $M$ is forced to 0.

  **Regime I: Growing Record (Apparent Violation)**
  Suppose the demon appends $M$ to an infinite external tape rather than resetting it. Steps 1–4 are repeated $N$ times. The gas returns to its initial state each cycle ($\Delta S_{gas}=0$). The reservoir loses heat $Q = N k_B T \ln 2$ converted entirely to work ($\Delta S_{res} = -N k_B \ln 2$). If the information entropy of the tape is ignored, $\Delta S_{total} < 0$. The Second Law appears violated because the "cost" is stored as Shannon entropy in the tape, not yet thermalized.

  **Regime II: One-Bit Reuse (Second Law Saved)**
  The demon must reuse the single bit. Step 5 is enforced. To reset $M$ from an unknown state (0 or 1) to a known state (0) is logically irreversible; two physical states map to one. By Landauer's Principle, this compression of phase space requires dissipating heat $Q_{diss} \ge k_B T \ln 2$ into the reservoir.
  **Accounting:**
  *   $\Delta S_{gas} = 0$ (Cyclic).
  *   $\Delta S_{mem} = -k_B \ln 2$ (Information destroyed).
  *   $\Delta S_{res} = +k_B \ln 2$ (Heat $Q_{diss}$ absorbed).
  *   **Net Work:** $W_{net} = W_{out} - Q_{diss} = 0$.
  The compensating entropy arises exclusively in **Step 5 (Reset)** and is deposited into the **thermal reservoir**. The logical irreversibility of the map $\{0,1\} \to \{0\}$ mandates the thermodynamic cost.

  **Counterfactual: Irreversible Measurement**
  If Measurement overwrites an unknown $M$ (destroying prior info) but Reset swaps $M$ with a fresh "blank" bit (logically reversible swap), the cost shifts to Step 2. The physics is invariant: the cost attaches to the *single* logically irreversible operation in the chain, regardless of whether it is labeled "measurement" or "reset."

  **The Skeptic's Objection**
  A skeptic (e.g., Earman/Norton) argues the case is rigged by assuming the availability of the "blank" state $M=0$. They contend that preparing the memory in a low-entropy standard state *is* the thermodynamic cost, merely shifted in time. By demanding $M=0$ at the start of Step 2, we implicitly consume a low-entropy resource. The skeptic claims the "Reset" is not the source of dissipation but merely the handoff of entropy to a fresh blank bit, and that the true cost lies in the *initialization of the blank bit supply*, not the erasure itself. This challenges the isolation of the reset step, suggesting the "fixed value" requirement smuggles in the entropy debt beforehand.
