answer: |-
  Your common-pool resource hypothesis is a powerful heuristic, but it strains under economic scrutiny. A fishery is rivalrous: one unit consumed is one unit gone. Shared morality is non-rivalrous in consumption; my private disbelief does not physically diminish your stock of belief. However, it behaves like a network good subject to threshold effects: the value of the norm collapses only when participation drops below a critical mass, not linearly with each infraction. This modifies Devlin's "no picking" claim. It holds only if moral norms are ecologically interdependent—if removing one strand destabilizes the web—rather than merely additive. If morality is a bundle of independent rules, Devlin's slide from "some enforcement" to "total defense" fails. If it is a system, the resource model fits better as a "tipping point" scenario than a depletion scenario.

  On excludability, the model fails further. You cannot easily exclude non-conformists from the benefits of the social order without expelling them from society itself, which undermines the claim that you are protecting *that* society. This suggests the resource is more like air quality than a fishery: non-excludable, but degradeable.

  The direction-of-causation objection is a real problem for Devlin, not a cheap shot. If criminal law constitutes morality rather than conserving it, enforcement is not protecting a pre-existing stock but manufacturing a new one. This undermines Devlin's empirical necessity claim: if the law creates the cohesion, then the cohesion cannot be the independent justification for the law without circularity. It shifts the argument from conservation to engineering, requiring a different justification for why *this* specific morality should be engineered.

  Diagnosis proper: This is a case of **different foundational questions**. Devlin asks a juridical-sociological question: "What conditions are necessary for a society to persist as an entity?" Hart asks a political-moral question: "Under what conditions is state coercion legitimate vis-à-vis the individual?" They share a heading ("limits of criminal law") but operate on different planes. For Devlin's answer to become relevant to Hart, Devlin would have to concede that social survival is not the supreme value and must be weighed against liberty. For Hart's answer to become relevant to Devlin, Hart would have to concede that without a constitutive shared morality, there is no "society" in which rights can exist.

  Prospects for progress are bleak. Evidence cannot settle this because Devlin's disintegration thesis is unfalsifiable in the short term, and Hart's liberty principle is a priori. A distinction won't help because both acknowledge the distinction but prioritize differently. The disagreement should likely be left to die, or rather, recognized as a choice between incommensurable first principles: collectivist functionalism versus liberal individualism.

  \answer{Different foundational questions; Devlin values survival over liberty}
