answer: |-
  **Materials:** 24 cards (hand-drawn geometric figures: circles, ovals, squares, triangles; some with dots/lines). 12 Pile A (Curved), 12 Pile B (Straight). 4 Test Cards (include a triangle with curved sides). Whiteboards.

  **Groups:** 4 groups of 4. Roles: Scribe (writes rule), Speaker (presents), Challenger (finds counter-examples), Timekeeper.

  **Sequence:**
  1.  **Sort (5 min):** Deal cards face-up into two piles.
  2.  **Deduce (15 min):** Groups infer the rule. First correct: 10 pts. Others: 5 pts. Natural Rule: "Curved lines (A) vs. Straight lines (B)."
  3.  **Reveal (10 min):** Script: "You found a consistent rule. But logic allows others. Consider: 'Curved lines, except triangles, which count as B.' This fits every card currently on your table."
  4.  **Bet (15 min):** Reveal 4 new cards. Groups wager points on classification. Natural rule predicts correctly; Gerrymander fails on the curved triangle.
  5.  **Debrief (30 min):** Discussion.

  **Scoring:** Symbolic points. Winner chooses next week's reading topic.

  **Debrief Map:**
  *   *Aha:* "When did you feel you knew the rule?" (Hypothesis-driven perception).
  *   *Twist:* "Did the data change?" (Underdetermination).
  *   *Betting:* "Why risk points on the natural rule?" (Projectibility/Inductive Bias).
  *   *Defense:* "Could the gerrymander be right?" (Creativity vs. Naturalness).

  **Predictable Failure:** Students may feel cheated by the twist. Mitigate by emphasizing that *logic* allowed both, but *practice* chose one. Some groups may refuse to bet. Encourage wagers by guaranteeing the Natural Rule holds for the test set.

  **Limitation:** The activity demonstrates logical underdetermination but cannot replicate the *psychological inevitability* of natural kinds. You must supply the philosophical weight of why "curved" is better than "curved except triangles." The game shows preference; you must explain justification (e.g., Goodman's *grue*, simplicity priors). The activity cannot generate the normative force of simplicity; you must articulate why simplicity matters epistemically.

  **Confidence:** 90% confident this produces the realization.
  **Least Sure:** Whether students will engage seriously with defending the gerrymandered rule during debrief, or simply dismiss it as silly.
