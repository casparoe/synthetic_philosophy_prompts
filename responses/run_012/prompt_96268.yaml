prompt: |-
  I'm in a book club that's slowly working through Aristotle's Politics — one book a year, we're on book 1 — and I've gotten stuck on the passage where he's arguing that some people are slaves by nature. I'm not a philosophy person and the translation I've got is pretty old, so I keep loosing the thread. Here's the paragraph:

  "But to resume—it is in a living creature, as we say, that it is first possible to discern the rule both of master and of statesman the soul rules the body with the sway of a master, the intelligence rules the appetites with that of a statesman or a king and in these examples it is manifest that it is natural and expedient for the body to be governed by the soul and for the emotional part to be governed by the intellect, the part possessing reason, whereas for the two parties to be on an equal footing or in the contrary positions is harmful in all cases. Again, the same holds good between man and the other animals: tame animals are superior in their nature to wild animals, yet for all the former it is advantageous to be ruled by man, since this gives them security. Again, as between the sexes, the male is by nature superior and the female inferior, the male ruler and the female subject. And the same must also necessarily apply in the case of mankind as a whole; therefore all men that differ as widely as the soul does from the body and the human being from the lower animal (and this is the condition of those whose function is the use of the body and from whom this is the best that is forthcoming) these are by nature slaves, for whom to be governed by this kind of authority is advantageous, inasmuch as it is advantageous to the subject things already mentioned. For he is by nature a slave who is capable of belonging to another (and that is why he does so belong), and who participates in reason so far as to apprehend it but not to possess it; for the animals other than man are subservient not to reason, by apprehending it, but to feelings. And also the usefulness of slaves diverges little from that of animals; bodily service for the necessities of life is forthcoming from both, from slaves and from domestic animals alike. The intention of nature therefore is to make the bodies also of freemen and of slaves different—the latter strong for necessary service, the former erect and unserviceable for such occupations, but serviceable for a life of citizenship (and that again divides into the employments of war and those of peace); but as a matter of fact often the very opposite comes about—some persons have the bodies of free men and others the souls; since this is certainly clear, that if persons were born as distinguished only in body as are the statues of the gods, everyone would say that those who were inferior deserved to be these men's slaves. And if this is true in the case of the body, there is far juster reason for this rule being laid down in the case of the soul; but beauty of soul is not so easy to see as beauty of body."

  And then a few pages later, when he's asking whether slaves have virtues, this:

  "First of all then as to slaves the difficulty might be raised, does a slave possess any other excellence, besides his merits as a tool and a servant, more valuable than these, ... or has he no excellence beside his bodily service? For either way there is difficulty; if slaves do possess moral virtue, wherein will they differ from freemen? or if they do not, this is strange, as they are human beings and participate in reason."

  Three things I can't sort out:

  1) The ladder. Soul rules body, intellect rules appetite, man rules animal, male rules female, and then "the same must also necessarily apply in the case of mankind as a whole". Is that last step meant to follow from the earlier rungs, or is it just one more example in the pile? It reads to me like he stacks examples until the conclusion looks obvious, but I honestly can't tell whether there's an argument there or just an accumulation of things that sound similar.

  2) "participates in reason so far as to apprehend it but not to possess it". What is that supposed to mean? He says animals don't apprehend reason at all, they're moved by feelings, so the slave is meant to sit somewhere between the animal and the free man — but then a few pages later he says slaves "participate in reason" as though that were a reason to expect them to have virtue, which seems like the same fact being used in the opposite direction. Is it the same claim both times, or is something shifting?

  3) The ending of the first passage. He says nature intends the bodies of slaves and free men to differ, then admits it often goes the other way, then says the real mark is the soul but "beauty of soul is not so easy to see as beauty of body". Is he conceding that you can't actually tell who the natural slaves are? And if you can't tell, what does the argument still do — does it license holding the slaves you happen to have, or does it leave the institution unjustified in practice? My own reading is that he quietly gives up and retreats to "it would be just, if only we could tell", and that this is a bigger deal than people make it, but everyone else in the club thinks he's just doing what you'd expect and defending slavery, so I'm probably missing something.

  What I want is not a general overview of Aristotle on slavery or what later people said about him. I want to understand this paragraph as an argument: what each step is doing, what work "by nature" is doing in it (is it "usually", or "as it should be", or something else?), whether the two passages I quoted can be made consistent with each other, and where my reading in (3) goes wrong if it does.
