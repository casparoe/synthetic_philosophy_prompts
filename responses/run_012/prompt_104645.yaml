answer: |-
  You have put your finger on one of the most volatile fault lines in contemporary ethics and risk analysis. You are correct that while the components are well-trodden (Pascal's Mugging, Expected Value, Precautionary Principle), the specific *rhetorical and epistemic shape* you are describing doesn't have a single, universally agreed-upon label.

  However, it sits at the intersection of three distinct fields: moral philosophy (Effective Altruism/Longtermism), decision theory, and statistics.

  Here is the map of the territory, the existing names that come closest, and a proposal for the specific coinage you're looking for.

  ### 1. The Shape of the Argument: "Empirical Pascal's Mugging"
  You are right to distinguish this from classic **Pascal's Mugging**. In the thought experiment, a mugger *stipulates* an astronomical payoff (e.g., "I will simulate $3 \uparrow\uparrow\uparrow 3$ lives") to force you to pay a small cost based on a tiny probability. Critics call this "stipulative."

  Your insect example is different because the "payoff" (the number of individuals, $N$) is not stipulated by a agent; it is an **empirical census**. The structure is identical ($Expected Value = Probability \times Magnitude$), but the magnitude is grounded in biology, not fantasy.

  In the Effective Altruism and Longtermism literature, this is often discussed under the label **"The Fanaticism Problem"** or **"Strong Longtermism."** It refers to the conclusion that Expected Value (EV) reasoning forces you to prioritize tiny probabilities of huge impacts (or huge numbers of tiny impacts) over certain, moderate goods.
  *   **The Shape:** It is a **Multiplicative Expected Value Argument.**
  *   **The Variant:** Because the magnitude is empirical, you might call it **"Naturalized Pascal's Mugging"** or **"Empirical Pascalism."**

  ### 2. The Stalemate: "The Burden of Zero"
  The rhetorical dynamic you described—where one side says "Prove it's zero" and the other says "Prove it's non-trivial"—is a specific failure mode of burden-shifting.

  In law and debate, this is an **Asymmetric Burden of Proof.** But in this specific multiplicative context, it is better described as **"The Burden of Zero."**
  *   **The Proponent's Move:** They shift the burden to the opponent to prove $P = 0$. Since scientific certainty of *non-existence* is nearly impossible, this is a "checkmate" move.
  *   **The Opponent's Move:** They insist the burden is on the proponent to prove $P > \epsilon$ (some non-trivial threshold).
  *   **The Failure:** They are arguing about *epistemic thresholds*, not the math. The proponent treats *possibility* as *probability*, while the opponent treats *uncertainty* as *negligibility*.

  ### 3. The Mathematical Error: "Neglect of Error Propagation"
  You asked about the failure mode where a guess is treated as a measurement once multiplied by a solid number. In statistics and metrology, this is a violation of **Error Propagation** rules.

  If you multiply a precise number ($N$, 2% error) by an uncertain estimate ($P$, 99% error or unknown distribution), the product inherits the uncertainty of the *least* certain variable. The precision of $N$ is irrelevant.
  *   **The Phenomenon:** When the precision of the known variable ($N$) creates an illusion of precision for the product ($N \times P$), this is **"False Precision"** or **"Spurious Accuracy."**
  *   **The Cognitive Bias:** It is a form of **"Anchoring."** The massive scale of $N$ anchors the interlocutor's intuition, making the uncertainty of $P$ feel smaller by comparison.

  ### 4. A Proposed Coinage: "The Magnitude Shield"
  Since there isn't one perfect term, I propose you use **"The Magnitude Shield"** to describe the rhetorical device, and **"Multiplicative Epistemic Risk"** for the structural problem.

  **The Magnitude Shield** occurs when a large, well-measured quantity ($N$) is used to deflect scrutiny from a small, poorly-constrained quantity ($P$).
  *   **Why it fits:** It captures the defensive utility of the big number. The number isn't just a multiplier; it's a shield that protects the probability estimate from being challenged. If you attack $P$, you are told you "don't understand the scale." If you attack the product, you are told you "don't understand the math."
  *   **The Shape:** It explains why the two sides talk past each other. One side is attacking the Shield ($N$), the other is attacking the Sword ($P$), but the Shield is doing the work of validating the Sword.

  ### 5. Addressing Your Edge Cases

  **Does it apply when the shaky factor is a known frequency?**
  No. If $P$ is a genuinely known frequency (e.g., "1 in 1,000 crickets have a mutation"), the argument collapses into plain arithmetic. The "Magnitide Shield" only works when $P$ is **epistemically contested** (i.e., we don't know the *model*, not just the *parameter*).
  *   *Parameter Uncertainty:* We know insects feel pain, but not how much. (Standard EV calculation).
  *   *Model Uncertainty:* We don't know *if* insects feel pain. (This is where the Shield activates).
  The argument relies entirely on **Model Uncertainty** masquerading as **Parameter Uncertainty**.

  **Does it matter that both sides treat a guess as a measurement?**
  Yes, this is the core pathology. In decision theory, this is called **"Reification of Uncertainty."**
  *   When the Proponent multiplies $N \times P$, they implicitly convert $P$ from a *range of credence* (0.0001 to 0.5) into a *point estimate* (0.1).
  *   This allows the "Burden of Zero" to function. If $P$ were treated as a distribution, the product would be a massive, useless cloud of uncertainty, rather than a specific "billion billion" moral weight.
  *   The moment the guess is multiplied, it gains the **ontological weight** of the census. It stops looking like a guess.

  ### Summary for Your Reporting
  If you need to label this in your piece, I recommend this hierarchy:

  1.  **The Academic Label:** "The Fanaticism Objection to Expected Value." (Signals you know the philosophical literature).
  2.  **The Structural Label:** "Empirical Pascal's Mugging." (Signals the decision-theory risk).
  3.  **The Rhetorical Label (Your Coinage):** "The Magnitude Shield." (Signals the specific dynamic of using scale to deflect epistemic uncertainty).

  **The "Shape" in one sentence:**
  It is an argument where **multiplicative leverage** is used to convert **model uncertainty** into **moral certainty**, protected by an **asymmetric burden of proof** that demands disproof of possibility rather than proof of probability.

  This dynamic is indeed identical to the AI risk debate (huge future populations $\times$ tiny probability of misalignment) and bio-risk (huge pathogen potential $\times$ tiny probability of escape). It is the defining argumentative structure of **Existential Risk Ethics.** You are seeing the same engine running on different fuel.
