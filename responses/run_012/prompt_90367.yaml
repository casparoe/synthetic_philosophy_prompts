prompt: |-
  I teach the philosophy of biology unit in a mid-level undergrad course, and the session on biological function is the one where everyone nods along and then, two weeks latter, writes that the function of a trait is just whatever it happens to do. I've got 18 students and 80 minutes. Take the role of an experienced instructor in philosophy of biology and think this through carefully before you write anything: brainstorm the case material first, then the structure.

  Design me a runnable classroom activity — roles, materials, timeline, debrief — that makes them feel the pull of both the etiological (selected-effects) account and the causal-role account by forcing them to use each one, instead of me explaining the difference up front. Here's the shape I'm after. Early on, pairs sort case cards into has-a-function / doesn't / can't tell, each card carrying a short history paragraph and a short what-it-does-now paragraph. Most cases should land cleanly so the room builds confidence; two or three should split them. Then split the room in two, hand each team one doctrine (don't name the theorists yet), and have them re-sort the swing cases. Build the cards so each team has to swallow something: the etiological team ends up granting a function to a shriveled remnant that does nothing now (and ideally discovers that their own doctrine splits over whether the relevant history has to be ongoing), while the causal-role team ends up handing out functions to byproducts and to contributions nobody could care about. Then two absurdity probes — does the eye have the function of being pokeable? does the heart's murmur have a function? — and let them squirm before you debrief.

  Include the materials and setup, the case types you'd build (a vestigial remnant; a recent useful byproduct of selection on something else; a trait doing two jobs at once), a minute-by-minute timeline, alot of detail on what predictably goes wrong the first time and how to handle it, and an honest note on what the activity can't reproduce and I'll have to supply myself in the debrief. American English please.
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the Request:**
      *   **Target Audience:** Mid-level undergraduates (Philosophy of Biology unit).
      *   **Problem:** Students nod during lecture but revert to "function = whatever it does" (causal role/intuition) in assessments, ignoring the etiological (selected-effects) nuance.
      *   **Goal:** Design an 80-minute active learning session where students *feel* the tension between Etiological (SE) and Causal-Role (CR) accounts through sorting cases, rather than being told the theory first.
      *   **Specific Structure:**
          1.  Pairs sort cards (Has Function / No Function / Can't Tell) based on History + Current Effect.
          2.  Split room: Team Etiological vs. Team Causal-Role (do not name theorists yet).
          3.  Re-sort "swing cases" based on assigned doctrine.
          4.  Force uncomfortable conclusions (Etiological: vestigial traits have functions; Causal-Role: byproducts/spandrels have functions).
          5.  Absurdity probes (Eye pokeability, Heart murmur).
          6.  Debrief.
      *   **Deliverables:** Case materials, setup, timeline, troubleshooting (what goes wrong), limitations (what the activity can't do).
      *   **Tone:** Experienced instructor, American English, practical/runnable.

  2.  **Brainstorming Case Material:**
      *   *Need:* Clear cases for confidence building.
      *   *Need:* Swing cases that split the room.
      *   *Need:* Specific traps for the two teams.
      *   *Case 1 (Clear SE & CR):* Human Heart pumping blood. (History: selected for pumping; Now: pumps blood). *Verdict: Function.*
      *   *Case 2 (Clear No Function):* Human Appendix (classic view) or Tailbone. Let's use the *Coccyx (Tailbone)*. History: Ancestral tail; Now: minor muscle attachment, mostly useless. *Verdict: No Function (intuitively).*
      *   *Case 3 (The Etiological Trap - Vestigial but Selected):* *Male Nipples*. History: Selected in females, byproduct in males (Wait, that's spandrel). Let's try *Wisdom Teeth*. History: Selected for chewing rough diet; Now: impacted/removed. *Verdict: SE says Yes (ancestral function), CR says No/Weak.* Actually, better: *The Spleen in a specific context?* No, let's stick to the prompt's request: "shriveled remnant that does nothing now." Let's use *Pelvic Bones in Whales*. History: Walking legs; Now: tiny floating bones, no locomotion. SE says "Function was walking" (or does it? SE usually requires the *trait token* to be there *because* of past function). Wait, SE says the *type* has a function if ancestors had it. So Whale Pelvis *has* the function of locomotion (historically), even if it doesn't do it now. This is the trap.
      *   *Case 4 (The Causal-Role Trap - Byproduct):* *Red Blood*. History: Hemoglobin selected for oxygen transport; Redness is physical byproduct. Now: Red. CR says "Function is to be red" (if it contributes to something, e.g., visual signaling in some species? No, keep it simple). Let's use *The Sound of the Heartbeat*. History: Pumping selected; Sound is byproduct. Now: Sound allows doctors to diagnose. CR says "Function is to make sound for diagnosis." SE says "No."
      *   *Case 5 (Dual Job/Exaptation):* *Feathers*. History: Insulation; Now: Flight. SE: Function is insulation (or flight if recent selection?). CR: Both.
      *   *Refining the "Swing Cases":*
          1.  *Whale Pelvis:* SE = Yes (ancestral function), CR = No (does nothing).
          2.  *Heartbeat Sound:* SE = No (byproduct), CR = Yes (doctors use it).
          3.  *Male Nipples:* SE = No (not selected in males), CR = Yes (erotic stimulation?). Let's use *Sneezing*. Clears nose (selected) vs. spreads virus (byproduct/effect).
          4.  Let's go with the prompt's specific suggestions: Vestigial remnant, Recent useful byproduct, Trait doing two jobs.

      *   *Drafting the Cards:*
          *   Card A (Control): Heart/Pumping.
          *   Card B (Control): Appendix/Nothing (traditional view).
          *   Card C (Vestigial): Whale Pelvis. History: Legs. Now: Anchors muscles but doesn't walk.
          *   Card D (Byproduct): Heart Murmur / Sound. History: Pumping. Now: Diagnostic signal.
          *   Card E (Exaptation): Bird Feathers. History: Warmth. Now: Flight.

  3.  **Structuring the Activity:**
      *   **Phase 1: Intuitive Sort (20 mins).** Pairs. No theory. Just "Does this have a function?"
      *   **Phase 2: Doctrine Assignment (10 mins).** Split room. Left side = "History Team" (SE). Right side = "Effect Team" (CR). Give them rulesheets, not names.
      *   **Phase 3: Doctrine Sort (25 mins).** Re-evaluate the tricky cards using the rules.
      *   **Phase 4: Absurdity Probes (10 mins).** Instructor throws curveballs.
      *   **Phase 5: Debrief (15 mins).** Reveal names (Millikan/Cummins), discuss trade-offs.

  4.  **Troubleshooting/What Goes Wrong:**
      *   *Students confuse "function" with "purpose".* Need to clarify "biological function" vs. "intentional purpose."
      *   *Students argue about the biology.* (e.g., "Actually the appendix does do something immune-wise"). Need to lock the card text so they can't fact-check their way out.
      *   *Etiological team gets stuck on "ongoing selection".* They need to know SE relies on *past* selection maintaining the trait.
      *   *Causal Role team gives functions to everything.* (e.g., "The function of the liver is to be heavy"). Need to constrain CR to "contributions to a capacity."
      *   *Time management.* 80 mins flies. Need strict timers.

  5.  **Refining the "Trap":**
      *   *Etiological Trap:* The Whale Pelvis. If they follow SE strictly, the function is *locomotion* (because that's why ancestors had it), even though it doesn't locomote now. This feels wrong to them. Or, if they say "No function," they violate SE because the trait exists *because* of past function. I need to make sure the SE rule sheet emphasizes *history of selection*.
      *   *Causal-Role Trap:* The Heart Sound. If doctors use it to diagnose, it contributes to the "capacity of the medical system." Or simpler: The function of the heart is to make a thump sound. If the rule is "whatever it does," then *everything* has a function. I need to constrain CR slightly (Cummins style: contribution to a containing system's capacity) so it's not *totally* absurd, but still allows the "Murmur" case.
      *   *Better CR Trap:* *Sneezing spreads germs.* It contributes to the capacity of the virus to spread. Does the nose have the function of spreading flu? CR says "Yes, in the context of the virus." SE says "No."

  6.  **Developing the Materials:**
      *   Need printable cards.
      *   Need Rule Sheets (without names).
      *   Need Worksheet for recording decisions.

  7.  **Writing the Plan:**
      *   *Intro:* Set the stage.
      *   *Materials:* Detailed card text.
      *   *Timeline:* Minute-by-minute.
      *   *Facilitation:* Scripting the interventions.
      *   *Debrief:* Connecting to Millikan/Cummins.
      *   *Limitations:* What this doesn't solve (normativity, malfunctions).

  8.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is 80 minutes enough?
      *   *Fix:* Keep the initial sort fast. Focus energy on the Doctrine Sort.
      *   *Critique:* Will students understand "Etiological" without the name?
      *   *Fix:* Call them "History Rules" and "Effect Rules." Reveal names at the end.
      *   *Critique:* The Whale Pelvis case is biologically debated (some muscle attachment).
      *   *Fix:* Write the card to stipulate the biology. "For the purpose of this case, assume it performs no locomotive function." Philosophy cases often require stipulated facts.
      *   *Critique:* How to handle the "Function of being pokeable" probe?
      *   *Fix:* Use it to show CR leads to infinite functions (pokeable, visible, weighable), while SE blocks this.

  9.  **Final Polish:** Check tone (collegial, experienced), formatting (clear headings), and ensure all constraints of the prompt are met (American English, specific case types, troubleshooting). *Make sure to emphasize the "swallow something" aspect.*

  *(Self-Correction on the Etiological Trap)*: The prompt says: "the etiological team ends up granting a function to a shriveled remnant that does nothing now."
  *Case:* Whale Pelvis.
  *SE Logic:* The trait exists because ancestors used it for walking. Therefore, its function is walking.
  *Student Reaction:* "But it doesn't walk!"
  *Instructor Goal:* Make them admit that under their rules, "Function" != "Current Activity."

  *(Self-Correction on the Causal-Role Trap)*: The prompt says: "causal-role team ends up handing out functions to byproducts."
  *Case:* Heartbeat Sound.
  *CR Logic:* The sound contributes to the doctor's capacity to diagnose. Therefore, function = making sound.
  *Student Reaction:* "That's silly."
  *Instructor Goal:* Make them admit that under their rules, "Function" = "Any useful effect."

  Okay, ready to write.
answer: |-
  Here is a complete lesson plan designed to disrupt the "function = effect" intuition by forcing students to operationalize competing definitions before they learn the terminology.

  ## Activity Title: The Function Audit
  **Time:** 80 Minutes
  **Class Size:** 18 Students (9 Pairs)
  **Goal:** Students will experience the explanatory power and the absurd consequences of Etiological (Selected-Effects) and Causal-Role accounts of biological function without prior lecture on the theories.

  ---

  ## 1. Materials & Setup

  ### Room Setup
  *   **Phase 1:** Tables arranged for pairs.
  *   **Phase 2:** Split the room physically. Left Side = **Team History**. Right Side = **Team Effect**.
  *   **Projector:** For timers and the "Absurdity Probes."

  ### The Case Cards (Print 9 sets)
  Each card has two sections: **The History** (evolutionary backstory) and **The Current Job** (what it does in the organism today). *Note: The biology is stipulated to prevent fact-checking derailments.*

  1.  **The Pump (Control)**
      *   *History:* Ancestral hearts were selected because they moved fluid.
      *   *Current Job:* Moves blood through the body.
  2.  **The Tailbone (Control)**
      *   *History:* Ancestral tails were selected for balance/swimming.
      *   *Current Job:* Provides minor muscle attachment points; no balance or swimming utility.
  3.  **The Whale Pelvis (The Etiological Trap)**
      *   *History:* Ancestral legs were selected for walking on land.
      *   *Current Job:* Small, shriveled bones floating in muscle. They do **not** touch the spine or legs. They perform zero locomotive work.
  4.  **The Heart Murmur (The Causal-Role Trap)**
      *   *History:* Heart valves were selected to regulate blood flow.
      *   *Current Job:* A specific valve is slightly leaky, creating a distinct "whoosh" sound. Doctors use this sound to diagnose heart conditions early, saving lives.
  5.  **The Feather (The Exaptation)**
      *   *History:* Proto-feathers were selected for thermal insulation.
      *   *Current Job:* Provides insulation *and* enables flight (aerodynamic lift).
  6.  **The Appendix (The Wildcard)**
      *   *History:* Ancestral cecum was selected for digesting cellulose.
      *   *Current Job:* Houses gut bacteria reserves during diarrhea. (Note: This is biologically current, but often intuitively felt as vestigial).

  ### The Rule Sheets (Print 1 per team)
  *Do not use the terms "Etiological" or "Causal-Role."*

  **Team History Rule Sheet:**
  > **THE ORIGIN RULE**
  > 1. A trait has a **Function** if and only if that trait exists *now* because ancestors with that trait survived/reproduced better due to that trait's activity.
  > 2. Look at the **History**. If the activity in the **History** explains why the trait is here today, that activity is the Function.
  > 3. It does not matter if the trait still performs that activity well today. It matters why the blueprint survived.

  **Team Effect Rule Sheet:**
  > **THE CONTRIBUTION RULE**
  > 1. A trait has a **Function** if and only if it makes a causal contribution to a capacity of the containing system (the organism or a relevant system).
  > 2. Look at the **Current Job**. If the trait *does* something that helps the system operate or helps an observer understand the system, that is a Function.
  > 3. History is irrelevant. Only current causal powers matter.

  ### Student Worksheet
  A simple grid for recording decisions: *Case Name | Has Function? (Y/N) | What is the Function?*

  ---

  ## 2. Minute-by-Minute Timeline

  ### 0:00 – 0:05 | Introduction
  *   **Instructor:** "We are auditors today. We aren't deciding what 'purpose' means in a poetic sense. We are deciding when biologists are licensed to say 'The function of X is Y.' If you get it wrong, you confuse adaptation with accident."
  *   **Instruction:** "Get into pairs. You will get 6 cards. Sort them into 'Has a Function' and 'No Function.' If you can't decide, 'Can't Tell.' Use your intuition. Do not Google the biology. Trust the card text."

  ### 0:05 – 0:20 | Phase 1: Intuitive Sort
  *   **Action:** Pairs sort the 6 cards.
  *   **Instructor Role:** Circulate. Listen for "But it doesn't *do* anything" vs. "But it evolved *for* something." Do not correct them.
  *   **Check-in (Min 15):** Ask for a show of hands on the **Whale Pelvis** and **Heart Murmur**.
      *   *Prediction:* Most will say Pelvis = No Function, Murmur = No Function (it's a defect).
      *   *Note:* Write the split on the board. "Keep this in mind."

  ### 0:20 – 0:25 | Phase 2: Doctrine Assignment
  *   **Action:** Split the room.
      *   Left 9 students = **Team History**.
      *   Right 9 students = **Team Effect**.
  *   **Distribution:** Hand out the Rule Sheets.
  *   **Instruction:** "You are no longer using intuition. You are lawyers bound by your Rule Sheet. You must re-evaluate the **Whale Pelvis**, **Heart Murmur**, and **Feather**. You must reach a consensus within your team."

  ### 0:25 – 0:50 | Phase 3: The Doctrine Sort
  *   **Action:** Teams debate the three target cases using their rules.
  *   **Instructor Role (Crucial):** You must act as a "Strict Judge."
      *   *If Team History hesitates on the Pelvis:* Remind them: "Does the History explain why the bones are there? Yes. Then what does the Rule say?" (Force them to assign Function = Walking).
      *   *If Team Effect hesitates on the Murmur:* Remind them: "Does the sound contribute to the capacity of the medical diagnosis system? Yes. Does the rule say history matters? No." (Force them to assign Function = Making Sound).
      *   *If Team Effect argues about the Feather:* Push them to admit *both* insulation and flight are functions.
  *   **Min 45:** Stop the debate. Have them write their final verdicts on the board.

  ### 0:50 – 1:00 | Phase 4: Absurdity Probes
  *   **Instructor:** "Now, apply your rules to these two new scenarios." (Project on screen).
  *   **Probe 1:** "The Human Eye. It is squishy. If I poke it, it indents. Does the eye have the function of being pokeable?"
      *   *Team Effect:* Must say **Yes** (it causally contributes to the capacity of "reacting to pressure" or "tactile sensation").
      *   *Team History:* Must say **No** (eyes were not selected *because* they were pokeable).
  *   **Probe 2:** "A gazelle's leg. It breaks. The snapping sound scares a predator away, saving the gazelle. Does the leg have the function of snapping?"
      *   *Team Effect:* **Yes** (contributed to survival capacity in that moment).
      *   *Team History:* **No** (legs were not selected *to break*).

  ### 1:00 – 1:20 | Phase 5: The Debrief
  *   **Reveal:** Team History = **Etiological/Selected-Effects Account** (Millikan, Neander). Team Effect = **Causal-Role Account** (Cummins).
  *   **Discussion Questions:**
      1.  "Team History, how did it feel to say the Whale Pelvis functions for walking, when it can't walk?" (Target: Normativity/Malfunction. SE allows for broken traits to still have functions).
      2.  "Team Effect, how did it feel to say the Heart Murmur has a function?" (Target: Proliferation. CR gives functions to everything that does *anything* useful).
      3.  "Which account explains 'error' better?" (SE: Yes, you can malfunction. CR: Harder, because if it does it, it's a function).
      4.  "Which account explains 'exaptation' (Feathers) better?" (CR handles dual roles easily; SE struggles with when the function 'switches').

  ---

  ## 3. Troubleshooting: What Goes Wrong & How to Fix It

  **Problem 1: Students argue the biology.**
  *   *Scenario:* "Actually, the whale pelvis anchors reproductive muscles, so it *does* have a function!"
  *   *Fix:* Intervene immediately. "For the purposes of this philosophical audit, you must accept the stipulated text on the card. If the card says 'zero locomotive work,' you must treat it as zero."
  *   *Why:* This is a logic exercise, not a biology quiz.

  **Problem 2: Team History refuses the Vestigial Trap.**
  *   *Scenario:* They say, "If it doesn't walk now, the selection stopped, so no function."
  *   *Fix:* Point to Rule #1: "Exists *now* because ancestors..." Remind them that the *blueprint* is still there *because* of the past. The trait's presence is explained by the past function. That is sufficient for the definition.
  *   *Teaching Moment:* This highlights the difference between *current utility* and *historical explanation*.

  **Problem 3: Team Effect gets too clever (The "System" Loophole).**
  *   *Scenario:* They argue the Heart Murmur doesn't help the *organism*, only the *doctor*.
  *   *Fix:* Tighten their rule verbally. "The 'Containing System' can be the organism *or* the ecological/medical context it is embedded in. If it contributes to a capacity of *a* system, count it."
  *   *Why:* You want them to feel the discomfort of assigning function to a pathology. If they block it, the lesson fails.

  **Problem 4: Time Creep.**
  *   *Scenario:* Phase 1 takes 30 minutes.
  *   *Fix:* Cut Phase 1 short. You only need them to feel confident about the Heart and Tailbone. Rush the rest. The meat of the lesson is Phase 3.

  ---

  ## 4. Instructor's Note: Limitations of the Activity

  As the instructor, you need to supply the following in the debrief because the activity cannot reproduce them on its own:

  1.  **Normativity:** The activity shows SE allows for "broken" traits to have functions, but you need to explicitly articulate *why* we care. We care because biology is a historical science, not just a functional engineering one. SE captures the *lineage*; CR captures the *mechanism*.
  2.  **The "Proper Function" Distinction:** You need to introduce the term "Proper Function" (Millikan's term) during the debrief to distinguish the SE account from colloquial use.
  3.  **The "System" Problem for CR:** In the activity, Team Effect likely struggled to define the "Containing System." You need to explain that Cummins' account relies on analyzing a system's capacities (e.g., circulation), and functions are the sub-capacities that explain the whole. Without this, CR looks like "anything goes."
  4.  **Hybrid Accounts:** Students will likely want a middle ground. Acknowledge that modern philosophy often uses hybrid accounts (e.g., Goal-Contribution accounts), but emphasize that understanding the poles (SE vs. CR) is necessary to understand the hybrids.

  ## 5. Why This Works
  This design avoids the "nodding along" problem because students are not passively receiving definitions. They are **operationalizing** them. When Team History is forced to say "The Whale Pelvis functions for walking," they feel the cognitive dissonance of the Etiological account (it prioritizes history over current utility). When Team Effect is forced to say "The Heart Murmur functions to make sound," they feel the cognitive dissonance of the Causal-Role account (it prioritizes effect over design).

  By the time you name Millikan and Cummins in the final 10 minutes, the students aren't memorizing abstract definitions; they are recalling the frustration of defending the Whale Pelvis and the Heart Murmur. That emotional anchor prevents the "function = whatever it does" regression on the final exam.
