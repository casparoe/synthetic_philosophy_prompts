      *   *Candidate 2: The Unit of Moral Concern (Metaphysics of Sentience).* Is it the individual? The neuron? The moment of experience? If it's neurons, the numbers go even higher. If it's species, numbers go lower. This affects the $N$ and the weighting.
      *   *Candidate 3: Threshold vs. Gradient Sentience.* If sentience is binary, $P$ is a probability of crossing a line. If gradient, $P$ is always 1 but weight varies. This changes the math from $N \times P$ to $\sum Weight_i$.
      *   *Candidate 4: Empirical Markers of Valence/Processing.* Can we build proxies for suffering? (Neuroscience/Behavior). This reduces uncertainty on $P$ and Intensity.
