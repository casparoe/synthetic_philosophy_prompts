answer: |-
  The foundation should prioritize, in order: establishing a decision rule for moral uncertainty, defining the functional form of moral weight, resolving the threshold versus gradient nature of sentience, and identifying empirical correlates of valence and harm.

  This ranking orders inquiries by their logical dependency and their leverage over the final resource allocation decision. The first priority is normative decision theory under deep moral uncertainty because it determines whether the scale argument's mathematical structure is valid at all. If the appropriate decision rule is maximin, precaution, or robustness rather than expected-value maximization, the multiplication of vast numbers by tiny probabilities may be inadmissible due to cluelessness or risk aversion. This work is highly tractable for a small team of philosophers and decision theorists, as it requires conceptual analysis rather than data collection, and it is neglected because most effective altruism-adjacent research assumes expected utility theory without defending it against moral uncertainty. Resolving this changes the fundamental strategy: if expected value is rejected, the foundation should ignore the scale argument and focus on high-confidence harms; if accepted, the subsequent research becomes critical.

  The second priority is defining the functional form of moral weight and the unit of moral concern, as this dictates how the number of individuals translates into moral value. The central open question is whether weight attaches to whole organisms, individual neurons, moments of experience, or measures of integrated information, and whether this weight scales linearly or diminishes with complexity. This is upstream of empirical work because it tells researchers what physical properties to measure; if weight scales with integrated information, insects may have negligible weight despite their numbers, whereas if it scales with neuron count, their weight is astronomical. This line of work is moderately tractable for an interdisciplinary group combining philosophy of mind and information theory, and it is neglected in favor of simpler individual-based counts. A resolution here determines whether the scale argument yields a manageable priority or an overwhelming one that dwarfs all other moral concerns.

  The third priority is resolving whether sentience is a threshold property or a matter of degree, because this determines how probability and intensity interact in the welfare function. If sentience is a threshold, the research must estimate the probability of crossing it; if it is a gradient, the probability is one but the weight varies by intensity. This distinction is upstream of empirical measurement because it dictates whether the team looks for binary neural switches or continuous valence dials. It is tractable through conceptual analysis paired with review of comparative neuroanatomy, and it is often conflated in existing literature. The practical decision impact is significant: a threshold model suggests focusing on preventing the existence of borderline cases, while a gradient model suggests focusing on welfare improvements for existing beings regardless of sentience certainty.

  The fourth priority is identifying empirical correlates of valence and defining the scope of relevant harms, as this populates the variables established by the previous three steps. This includes determining whether morally relevant harms include only pain and death or also deprivation, frustration, and thwarted preferences, and finding behavioral or neural markers for these states in invertebrates. This is the most downstream item because it relies on knowing what to measure and how to weigh it, but it is the most tractable for the majority of the team's researchers who should be empirical scientists. It is less neglected than the philosophical questions but lacks a unified moral framework. Resolving this directs specific interventions, such as modifying slaughter methods versus protecting habitats, and determines the intensity multiplier in the welfare calculation.

  Regarding robustness, interventions that reduce suffering in high-confidence sentient beings (vertebrates) are robust to almost any answer across these four questions, as are policies that avoid irreversible harm under deep uncertainty. Conversely, massive resource allocation to wild invertebrate welfare is highly sensitive to the answers, particularly relying on expected-value maximization, a linear or neuron-based weight function, and a low threshold for sentience. If any of the upstream philosophical questions resolve against the scale argument's assumptions, the justification for prioritizing invertebrates collapses.

  The two or three findings that would most move this ranking are a formal proof that expected value maximization is irrational under deep moral cluelessness, empirical evidence that valence requires a specific neural architecture absent in invertebrates, and a demonstration that sentience operates as a binary switch rather than a continuum in biological systems.
