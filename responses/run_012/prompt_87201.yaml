      2.  **Metaphysics of the Moral Patient (Unit of Counting):** Before estimating $P$ or Intensity, we must know *what* is being counted. Is it the organism? If moral weight scales with integrated information ($\Phi$), then many small insects might count for less than one mammal, counteracting the $N$ advantage. This defines the functional form.
