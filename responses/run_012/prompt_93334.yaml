      *Refining "Where the reply is soft":* Needs honesty.

      *The "Question I am hoping nobody asks":* Needs to be the killer blow. Probably about whether the "correlation" cost is actually just the erasure cost in disguise (because to *use* the memory, you must eventually decouple).

  4.  **Drafting the Content (Mental Check against Constraints):**
