          *   *Rank:* High. They have the math ready.

      *   *Objection 3 (Philosopher - Entropy Status):* Is the entropy decrease real or relative to the demon?
          *   *Phrasing:* "If the joint entropy is constant, you're just shifting entropy into the correlation term. That makes entropy relative to the observer's access, not a state function of the gas."
