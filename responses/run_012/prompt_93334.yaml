      5.  Quantum Thermo: Irreversibility/Decoherence source.
      6.  Stat Mech: Definition of "System" boundaries.
      7.  Philosopher: Epistemic vs. Ontic entropy.
      8.  Quantum Thermo: Measurement back-action.

      *Wait, need to ensure "Rank" is 1-8 (ascending damage/likelihood).* The prompt says "1 for the objection that does the most expected damage". So 1 is worst.
      Let's order them by severity to the thesis.
      1.  Quantum Thermo (GSL): If the math already accounts for this without erasure, the "new reason" isn't new.
      2.  Stat Mech (Cycle): If it's not a cycle, it's not a counterexample to the standard exorcism.
