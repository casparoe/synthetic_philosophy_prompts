  Thinking Process:

  1.  **Analyze the Request:**
      *   **Task:** Create a Q&A prep sheet for a paper presentation on Maxwell's Demon.
      *   **Thesis:** The standard Landauer-based exorcism conflates two costs (acquisition/export vs. erasure/reset). The argument shows you can't lower entropy *while forgetting*, but a demon with growing memory still fails due to accumulated correlations, not erasure.
      *   **Audience:**
