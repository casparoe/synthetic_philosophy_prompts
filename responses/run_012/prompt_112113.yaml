answer: |-
  ### I. The Translation

  Here is the dispute restated in the vocabulary of your trade.

  **The Argument (The Common Kind Claim)**
  This side argues that the *telling* constitutes the *scene*. If your focalization renders the hallway, the shadow, and the figure with identical syntax, rhythm, and sensory detail in both instances (the true perception and the hallucination), then the narrative reality of the character's mind is identical. The mental event is the text.

  To claim otherwise is to claim that the *page* changes based on facts the *text* does not show. If the Free Indirect Discourse feels the same, the consciousness is the same. The difference between seeing a ghost and hallucinating a ghost is merely a matter of causal backstory (the story-world facts), not a difference in the narrative present. The scene is defined by the camera's eye, not by whether the prop was actually on the set. If the shot is identical, the movie is identical.

  **The Reply (The Disjunctivist Claim)**
  This side argues that the *story-world* determines the *scene*, regardless of the *telling*. Even if the neutral description is shootable either way, the ontological status of the event is fundamentally different. One scene is a connection between the character and the world (perception); the other is a closed loop inside the character (hallucination).

  To claim they are the same because the text is the same is to confuse the script with the production. A scene where an actor looks at a real person is a different dramatic unit than a scene where an actor looks at a mark on the wall, even if the lighting and angle are identical. The nature of the occurrence is defined by its anchor in the story-world. If the figure is not there, the character is not "seeing"; they are undergoing a different category of event entirely that merely mimics seeing. The text may hide this, but the craft must acknowledge that the underlying machinery is different.

  ***

  ### II. The Residue Report

  You suspected that "indistinguishable from the inside" would arrive as "indistinguishable to the reader." You are correct. This is the primary distortion.

  **What Arrives Intact**
  *   **The Problem of Evidence:** Both sides agree that the text (the evidence) underdetermines the reality. The gap between the story-world and the telling is the exact analogue for the gap between the world and the mind.
  *   **The Reader's Inference:** The debate over what a reader can be trusted to infer maps cleanly onto the philosophical debate about what a subject is entitled to claim. If the text is neutral, the reader must decide: do I trust the focalization as a window (Common Kind) or as a potentially unmoored lens (Disjunctivism)?

  **What Arrives Distorted**
  *   **The Locus of Indistinguishability:** In philosophy, the indistinguishability is *phenomenological* (it feels the same to the sufferer). In your vocabulary, it becomes *textual* (it reads the same to the audience).
      *   *Why this matters:* A character might feel doubt that the text does not reveal. A novelist can write a scene that feels certain to the reader but is felt as uncertain by the character. The philosophical argument hinges on the character's inability to tell; your vocabulary hinges on the reader's inability to tell. You have shifted the burden of proof from the consciousness experiencing the event to the consciousness consuming the report.
  *   **Warrant and Entitlement:** In philosophy, "warrant" is an epistemic right to believe one's eyes. In your terms, this becomes "narrative reliability." But reliability is a judgment the reader makes *after* the fact, whereas warrant is a status the subject possesses *in* the moment. You lose the immediacy of the character's claim to truth.

  **What Has No Expression (The Missing Residue)**
  *   **The Phenomenal Character:** Your vocabulary describes the *signs* of experience (description, syntax, focalization), not the experience itself. Philosophy is arguing about the texture of the mind's contact with reality. You can only show the shadow of that texture on the wall. You have no term for "what it is like" other than "the scene," but "the scene" implies an external event, whereas the argument is about an internal state.
  *   **The First-Personal:** Focalization is a technique, not a mode of being. You can simulate first-person access, but you cannot grant it. The philosophical dispute is about the actual architecture of that access. Your vocabulary treats access as a stylistic choice (close third vs. distant third); the philosophers treat it as a metaphysical condition.

  ***

  ### III. The Test Cases

  **Case 1: The Ambiguous Scene**
  *You write a scene where a figure stands in the corner. You refuse to settle whether it is real. The story functions either way.*

  *   **The Common Kind View:** This is the ideal state. The mental state is the primary reality. Since the text renders the experience identically, the scene is a success. The ontology is irrelevant; the phenomenology is the story.
  *   **The Disjunctivist View:** This is a failure of specification. They would argue you have written a *description* of a scene, but not the *scene* itself. A scene is defined by its relation to the world. By withholding the anchor, you have created a linguistic ambiguity, not a dramatic one. They would demand you choose, because the dramatic tension relies on the *kind* of event (contact vs. isolation), not just the *image* of the event.

  **Case 2: The Reversed Draft**
  *In Draft A, the figure was a hallucination. In Draft B, you change the story-world so the figure was real. You do not change the prose of the original scene.*

  *   **The Common Kind View:** The scene remains effectively the same. The character's mind underwent the same process. The change is backstory, not scene. The text holds because the text mirrors the mind, and the mind didn't change.
  *   **The Disjunctivist View:** You have fundamentally broken the scene. Even if the prose is identical, the dramatic action has changed from "suffering a delusion" to "witnessing a threat." These are different actions. If you do not adjust the prose (the telling) to reflect the new weight of the reality (the story-world), the telling is now lying. The text is insufficient because it fails to mark the ontological shift. They would call the unchanged prose a failure to specify the new reality.

  ***

  ### IV. Where the Residue Points

  Your vocabulary does not merely miss something the philosophers possess; it actively collapses the distinction they are fighting to preserve.

  The philosophers are arguing about the **metaphysics of the mind**. They want to know if the mind is a mirror (reflecting what is there) or a projector (casting images regardless of what is there).

  Your vocabulary is built on the **metaphysics of the text**. In your trade, the text *is* the reality. There is no "mind" except what is encoded in the syntax. Therefore, your terms naturally favor the Common Kind view. If the text is the same, the reality is the same, because there is no access to the character's reality other than the text.

  **The Verdict**
  The residue suggests the quarrel is thinner *for you* than for them, but not because the philosophy is wrong. It is thinner because your medium cannot sustain the distinction.

  1.  **You cannot write the Disjunctivist view without cheating.** To show that a perception is fundamentally different from a hallucination, you must tip your hand in the prose (a wobble in the syntax, a clue in the summary). But the moment you tip your hand, they are no longer indistinguishable to the reader. You cannot render the "fundamental difference" while maintaining the "neutral description."
  2.  **The "Inside" is Unwritable.** The argument hinges on the subject's vantage. You can only ever provide the *report* of that vantage. You are always outside the mind, looking in, even in first-person.

  **Conclusion**
  Your vocabulary treats the disagreement as one of **Ontology vs. Description**.
  *   **Side A says:** Description *is* Ontology. (If it reads real, it is real to the mind).
  *   **Side B says:** Ontology *constrains* Description. (If it isn't real, the description is of a different category of thing, even if it looks the same).

  The residue points to a hard limit in your craft: You can simulate the *confusion* of the character, but you cannot instantiate the *nature* of their experience. You can make the reader unsure if the figure was there. You cannot make the reader feel the difference between *seeing* and *seeming to see* if the text remains neutral.

  If you wish to honor the Disjunctivist view, you must abandon the neutral description. You must let the prose itself fracture when the connection to the world fractures. If you wish to honor the Common Kind view, you can keep the prose smooth and let the story-world facts float.

  The philosophers are arguing about the light. You are arguing about the shadow on the wall. You can translate the shape of the shadow, but you cannot translate the source of the light. That is not a failure of translation; it is the definition of your medium.
