      *   *Side B (Disjunctivism):* A perception and a hallucination are fundamentally different kinds of things, even if they feel the same. One is a relation to the world; the other is a mere appearance. They don't share a common core.
      *   *The Crux:* Is the *experience* the same, or just the *report* of the experience?

  3.  **Translate to Novelist's Vocabulary:**
      *   *The "Scene":* The raw experience of the character.
