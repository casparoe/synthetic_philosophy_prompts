      *   *Side A (Common Kind):* The text describes the scene identically. Therefore, the narrative reality of the scene is identical. The *telling* is the experience. If the FID is the same, the mind-state is the same.
      *   *Side B (Disjunctivism):* The text might describe the scene identically, but the *story-world facts* differ. One scene is anchored in the world (perception); the other is unanchored (hallucination). The *telling* masks a fundamental difference in the *story-world*.
      *   *Indistinguishability:* For the philosopher, it's "from the subject's vantage." For the novelist, it's "from the reader's vantage" or "in the focalization."

