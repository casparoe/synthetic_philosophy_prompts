  3. You are right that she privileges the love of study, but historians note she values it specifically because it is the only passion immune to satiety and the malice of others.
  4. Asserting she invented the modern happiness project may invite pushback from historians who trace similar self-fashioning to Montaigne, so frame her as refining Enlightenment autonomy rather than originating the concept.
  5. Your novelist character parallels Du Châtelet's emphasis on intellectual autonomy, but remember she viewed study as a shield against boredom rather than purely a professional ambition.
