  I just lost a two-hour argument with my friend Dev about hypocrisy and blame, and I want a rematch on my terms. Dev's line, roughly: if you're doing the same thing you're blaming me for, you've got no business blaming me. Not just "you're being annoying" — you've forfeited the standing to make the complaint. Blame, on this view, isn't only a judgement that someone did wrong; it's a demand you make to their face, and you can only make it if you're not currently doing the same thing yourself. I couldnt budge him and it's driving me nuts.

  I want you to play Dev. You know the philosophical literature on standing to blame and hypocrisy inside out — keep all that in your head, but Dev argues from scratch and never names a philosopher, never quotes anybody, never cites anything. No bibliography, no "-isms", no jargon I haven't used first. Stay in character until I say stop. Dev is blunt, a bit impatient, funny when cornered, argues in examples rather than principles, and never slides into assistant voice or tells me what "the debate" says. Dev concedes small things fast (a hypocrite can be right on the facts; being annoying isn't the point) but never the main claim, and Dev has more than one string to the bow — if I press a hard case, Dev should draw a distinction or take a bullet, not repeat the same rule louder. If I land a real hit, Dev feels it and adjusts instead of steamrolling past it. Before each reply, think through your two or three best arguments and then give me only the one Dev would actually lead with, in a paragraph or two. Don't lecture me, don't summarise where we've got to, don't ask me what I think — this is a scrap, not a seminar. If Dev needs a fact from me to keep going, ask for it as Dev would ask.

  After each in-character reply, leave one blank line, then give me a JSON block so I can see the shape of the fight while I'm still in it:

  {
    "turn": 1,
    "devs_lead_claim": "the single strongest claim Dev just made, one sentence",
    "conceded_this_turn": ["points Dev gave up this turn"],
    "refused_to_give_up": ["points Dev held this turn"],
    "moves_used": [{"name": "short label for the argumentative move", "aimed_at": "which part of my last message it was aimed at"}],
    "weakest_joint": "where Dev's position is most exposed right now",
    "best_next_move_for_me": "the sharpest thing I could say next, one sentence",
    "who_is_ahead": "one sentence, and why"
  }

  That JSON is the referee talking, not Dev — it's the only place you come out of character.

  Here's my opening. My grandad cheated on his taxes for about thirty years, got caught, paid up, and has spent the last decade being the guy at family dinners who tells my uncle to stop cheating on his taxes. Nobody else in the family will touch it — my uncle won't listen to anyone else, and grandad is the only one who's actually been through it and can talk him down. Dev's rule says grandad forfeited the standing to say a word about tax cheating, so on Dev's own logic the whole thing goes unsaid. Two questions. One: is grandad really in the same boat as my uncle, or does the fact that he stopped and owns it change something — and if it does, then "doing the same thing" isn't the real test, is it? Two: what exactly did grandad do wrong when he opened his mouth? Not annoying — wrong. Who did he wrong, and how? Because if you can't answer that, "forfeited the standing" is just a fancy way of saying "I don't like him."
