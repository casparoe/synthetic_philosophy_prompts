answer: |-
  **The Scenario**

  Elena and Marcus are senior structural engineers certifying a bridge during a total grid failure, relying on identical printed schematics and independent manual stress calculations which they have each checked twice, exhausting all available verification methods without digital aids. Both have flawless, identical track records, are fully rested, and face identical professional liability. The beam either holds the load or it does not. In Version 1, the dispute is first-order: Elena concludes "Safe" and Marcus concludes "Unsafe," each assigning 80% confidence to their result. In Version 2, the first-order results remain fixed (Elena "Safe," Marcus "Unsafe," both 80% confident), but the explicit dispute is second-order: Elena asserts "We must each trust our own calculation" (Steadfast) and Marcus asserts "We must suspend judgment" (Conciliatory), and each assigns 80% confidence to their normative stance based on identical training in safety protocols and reasoning.

  ***

  **Version 1: The First-Order Disagreement**

  *   **The Conciliatory View (CV):** CV dictates that upon recognizing a peer disagreement, one must adjust confidence toward the peer's position. Since Elena (80% Safe) and Marcus (80% Unsafe) are peers, both must lower their confidence to the midpoint (50%). They should suspend judgment on the beam's safety.
  *   **The Steadfast View (SV):** SV dictates that the first-order evidence justifies the initial belief, and the disagreement is merely additional evidence that does not necessitate surrender. Since both have exhausted checks and have no reason to doubt their own competence over the other's, both retain 80% confidence. Elena proceeds as if Safe; Marcus proceeds as if Unsafe.

  **Version 2: The Second-Order Disagreement**

  *   **The Conciliatory View (CV):** Here the question is whether CV itself is the correct norm. Elena (80% SV) and Marcus (80% CV) are peers regarding this normative question. Marcus, adhering to CV, must apply it to his belief in CV. He disagrees with Elena (a peer) on the truth of CV. Therefore, Marcus must lower his confidence in CV from 80% toward Elena's 0% (for SV). His confidence in CV drops to 50%.
      *   *The Derivation:* The rule "lower confidence in $p$ when a peer disagrees" applies to $p=$"CV is true." Since Marcus believes $p$ and Elena believes $\neg p$, Marcus must reduce confidence in $p$.
      *   *The Consequence:* If Marcus is only 50% confident that he should conciliate, he lacks the justification to conciliate on the first-order question. If SV might be true (50%), he might be permitted to stay at 80% on the beam. The instruction to conciliate undermines the confidence required to follow the instruction.
  *   **The Steadfast View (SV):** Elena believes SV is the correct norm (80%). She disagrees with Marcus (a peer) who believes CV. SV dictates that she need not lower confidence merely due to disagreement. Therefore, Elena retains 80% confidence in SV. Consequently, she retains 80% confidence in her first-order judgment ("Safe"). SV is self-stable; applying it to itself yields no reduction in confidence.

  **The Single Feature Doing the Work**

  The feature is **Universal Self-Applicability**. The case assumes that epistemic norms govern all beliefs formed under peer disagreement, including beliefs *about* those norms. If this feature is removed—by stipulating that CV applies only to "factual" or "first-order" propositions—Version 2 collapses into Version 1, because the second-order disagreement becomes exempt from the norm being tested. The Conciliationist's strongest attack is **Domain Restriction**: claiming that epistemic norms are rules of procedure, not truth-apt propositions subject to the very rules they govern. This attack fails to succeed and merely relabels the problem; if norms are not truth-apt, it is unclear why peer disagreement on them signals error risk, yet if they do signal error risk, the Conciliationist is arbitrarily exempting their core commitment from their own truth-tracking requirement.

  **Conclusion**

  This case shows that Conciliationism, if universally applied, generates a self-undermining skepticism that Steadfastness avoids, but only at the cost of appearing dogmatically immune to higher-order correction.
