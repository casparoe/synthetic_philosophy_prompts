answer: |-
  # Q&A Prep Sheet: Rietdijk-Putnam & The "Here-Now" Premise

  **Strategy Overview:**
  Your thesis is provocative because it inverts the standard defense. Usually, presentists retreat to the "point present" (solipsism of the moment) to avoid RPA, claiming distant simultaneity is unreal. You are arguing that *accepting* the point reading is actually what allows the RPA chain to lock, while the "slice" reading is the one that secretly relies on a preferred frame (which SR forbids).
  **Your Goal:** Defend the dichotomy (Slice = Preferred Frame, Point = Block) without getting bogged down in defending Point Presentism as a *plausible* metaphysical view. You are defending it as the *only* view consistent with SR that isn't already Block Universe.

  **General Tone:**
  *   **To the Relativists:** Respect the math, don't overclaim the ontology.
  *   **To Marta:** Don't mock her view, but show why SR makes it untenable *unless* she accepts your premise.
  *   **To the Grads:** Keep the logic tight; they are looking for the transitivity trap.

  ---

  ## 1. The Damage Assessment (Ordered by Threat Level)

  ### Objection 1: The "Redefinition" Attack
  **Who:** Marta (The Presentist)
  **The Question:** "You're arguing against a strawman. No serious presentist claims the present is a *point*. We claim it's a spacelike hypersurface. By insisting the argument only works for point-presentism, you've defined presentism out of existence to save the Block Universe. Why should I accept your definition of 'now'?"
  **The Damage:** **Critical.** If the audience agrees you're attacking a view nobody holds, your thesis becomes a technical curiosity with no metaphysical bite.
  **2-Minute Answer:**
  "I'm not claiming point-presentism is *plausible*; I'm claiming it's the only version compatible with the *spirit* of Special Relativity without smuggling in a preferred frame. If you take the present to be a hypersurface (as you suggest), you must explain what picks out *that* specific foliation of spacetime. SR gives you no mechanism to privilege one slice over another. If you privilege one anyway, you're doing metaphysics *against* the physics. My argument is a dilemma: Either you accept a preferred slice (violating SR's relativity principle) or you accept the point reading (which triggers RPA). I'm not redefining presentism; I'm cornering it."
  **The Soft Spot:** You are conflating "SR doesn't pick a frame" with "SR forbids a frame." Presentists argue SR describes *measurements*, not *ontology*. Marta will pounce on this.
  **Concession:** Concede that "Slice Presentism" is the standard view. Hold that it requires a hidden preferred frame to work.

  ### Objection 2: The "Global Frame" Trap
  **Who:** Relativist 1 (Numerical, hates preferred frames)
  **The Question:** "This whole argument relies on global inertial frames. We know they don't exist in the real universe (GR, expansion, matter distribution). If you move to curved spacetime, you can't chain observers globally like this. Does your argument survive the move to GR, or is this just a toy model artifact?"
  **The Damage:** **High.** If the argument dies in GR, it's not an argument about *physics*, just about Minkowski geometry.
  **2-Minute Answer:**
  "You're right that the clean Rietdijk-Putnam chain relies on global inertial frames. In GR, we lose the global hyperplanes. However, the local structure of the light cone remains. My core claim is about the *local* definition of 'now.' Even in GR, at any event $p$, the tangent space is Minkowskian. If 'now' is a point, the transitivity of reality at $p$ still holds for local observers. The global Block might be foliation-dependent in GR, but the local 'reality of the future' argument holds in the tangent space. I'm arguing for the local block, which is enough to kill the dynamic view of time."
  **The Soft Spot:** "Local block" is a tricky concept. If the global slice is gone, does the "future" even exist as a determinate thing in GR? (Hint: Not always, depending on cosmic censorship/causal structure).
  **Concession:** Admit the *global* RPA chain is SR-specific. Hold that the *local* ontological pressure remains.

  ### Objection 3: The Synchrony Convention
  **Who:** Relativist 2 (Undergrad Teacher, pedantic about frames)
  **The Question:** "You're treating the plane of simultaneity as physically real. But simultaneity is a convention (Reichenbach). I can choose a non-standard synchrony where the 'tilt' doesn't happen the way you say. If simultaneity is conventional, how can you derive an ontology (the Block) from a convention?"
  **The Damage:** **Medium-High.** Attacks the link between the math and the metaphysics.
  **2-Minute Answer:**
  "Standard synchrony (Einstein) is a convention, yes. But the *causal structure* isn't. The light cones are invariant. The RPA argument doesn't rely on the *specific* angle of the slice, but on the fact that *any* spacelike slice tilted relative to mine includes events in my causal future. Even with non-standard synchrony, as long as the surface is spacelike, the 'Andromeda' event shifts. To avoid the Block, you have to deny reality to *all* spacelike separated events, which retreats you to the 'point' view—which, as I argued, triggers the chain anyway."
  **The Soft Spot:** You are leaning heavily on the idea that "spacelike separated = potentially real." Some instrumentalists deny this.
  **Concession:** Concede synchrony is conventional. Hold that the *range* of permissible simultaneity surfaces (the spacelike region) is invariant.

  ### Objection 4: The Transitivity of "Real For"
  **Who:** The Lewisian Grads
  **The Question:** "The argument hinges on 'Real For' being transitive. If Event E is real for Observer B, and Observer B is real for Observer A, E must be real for A. But 'Real For' looks like a relation relative to a frame. Why think it transits across frames? Isn't that just begging the question against the presentist?"
  **The Damage:** **Medium.** This is the standard philosophical counter (Stein 1968). If they bring up Stein, you need to be ready.
  **2-Minute Answer:**
  "This is the heart of the dispute. I'm not assuming transitivity blindly. I'm deriving it from the 'Here-Now' premise. If 'now' is a point, then when A and B meet, they share the *same* 'now.' There is no frame-relative distance between them at the intersection. If B is real at the intersection, and E is real for B, and reality is not solipsistic, then E must be part of the same ontology A inhabits. If you deny transitivity, you're saying two observers at the same spacetime point inhabit different ontologies. That's a heavy price to save presentism."
  **The Soft Spot:** Howard Stein (1968) proved that the only transitive, definable relation in SR is "is in the past light cone of." You are arguing against a theorem.
  **Concession:** Acknowledge Stein. Argue Stein defines "definable" too narrowly (requires logical definability from causal structure), whereas you are making a metaphysical claim about existence.

  ---

  ## 2. The Question You Hope Nobody Asks

  **The Question:** "If the argument only works because you define 'now' as a point, and nobody actually believes 'now' is a point... aren't you just saying 'If presentism were absurd, then presentism would be false'? What work is Relativity actually doing here?"
  **Why it's dangerous:** It suggests your premise does all the heavy lifting and the physics is just window dressing. It makes your talk a verbal trick rather than a physical argument.
  **The Answer:**
  "It's not verbal. Relativity forces the choice. In Newtonian physics, you can have a point-present and a global time without contradiction. SR breaks the link between the 'here-now' and a global 'now.' Relativity removes the middle ground. It forces you to choose: either you cling to a global slice (and break Lorentz invariance) or you accept the point (and accept the Block via RPA). Relativity is the engine that removes the escape route."
  **Prep Note:** If they push back, admit that the *metaphysical* work is in the premise, but the *physical* work is in closing the other doors.

  ---

  ## 3. State of Play: Honest Assessment

  **Use this to calibrate your confidence. Do not present these as settled facts.**

  | Claim | Status | Notes |
  | :--- | :--- | :--- |
  | **RPA is valid in SR** | **Contested** | Putnam (1967) says yes. Stein (1968) says no (transitivity fails). Saunders (2002) says it depends on the definition of "becoming." |
  | **"Now" as a Point** | **Minority View** | Most presentists argue for a "thick" present or a privileged foliation. You are attacking a specific, vulnerable subset. |
  | **SR Forbids Preferred Frames** | **Standard Physics** | **Consensus.** However, philosophers argue SR is compatible with a *undetectable* preferred frame (Lorentzian Ether Theory). You must clarify you are assuming *Einsteinian* SR, not *Lorentzian* SR. |
  | **Transitivity of Reality** | **Live Dispute** | This is the metaphysical crux. There is no consensus on whether "is real for" must be transitive across frames. |
  | **GR Implications** | **Unclear** | RPA is strictly an SR argument. Extending it to GR is non-trivial due to lack of global symmetries. |

  **Final Advice:**
  *   **Don't** claim you have proven the Block Universe. Claim you have clarified *why* the argument succeeds or fails based on the definition of "present."
  *   **Do** explicitly distinguish between **Einsteinian SR** (no preferred frame) and **Lorentzian SR** (preferred frame exists but is hidden). Marta will try to slip into Lorentzian SR to save her slice. Don't let her.
  *   **Watch out for Stein.** If a grad student mentions "Stein's Theorem," nod respectfully and say, "Stein argues that 'becoming' must be definable from the causal structure. I'm arguing that 'reality' is a broader metaphysical category than Stein allows."

  **Good luck. Keep your eyes on the Relativists; if they nod, Marta will fold.**
