answer: |-
  Subject: Spec sheet for the assertion norm handout

  Here is the breakdown of the specifications you need for the handout, drafted as a continuous list of requirements rather than a survey of the literature. The primary job of any theory here is to deliver a principled account of the conditions under which an assertion is permissible, and to do that it must first satisfy a set of descriptive and explanatory constraints drawn from our actual practices. The most fundamental requirement is that the theory must align with the specific patterns of challenge and retraction that govern our conversational exchanges. When an assertion is challenged, the standard move is to demand epistemic backing, typically by asking how the speaker knows, rather than asking why they believe it or whether it would be useful to believe it. Conversely, when a speaker learns they did not meet the norm, the standard response is retraction, not merely a change of mind. A theory that cannot explain why we challenge assertions by querying knowledge rather than utility, or why we retract assertions specifically when epistemic conditions fail rather than when pragmatic conditions shift, is failing to capture the distinctive social role of the act. This means the theory must treat the norm as inherently epistemic rather than purely pragmatic, even if it allows pragmatic factors to modulate the threshold.

  You also need to build in the requirement that the theory distinguishes between the warrant to assert, the warrant to believe, and the warrant for a hearer to rely. These come apart in your cases, and a viable account must say where the norm applies. For the support tech case, where the stakes are low and the fix is reversible, the theory must explain whether the permissibility of the assertion tracks the speaker's epistemic position or the hearer's potential loss. If the norm is strictly knowledge, the tech is violating it unless she knows, but if the norm is sensitive to stakes, she might be cleared. The requirement here is that the theory must either accommodate stakes-sensitivity within the norm itself or explain away the intuition that low stakes make the assertion okay without knowledge. You cannot simply stipulate that stakes matter; the theory must derive that result from the function of assertion. Similarly, for the case of the meeting time asserted merely to stop questioning, the theory must determine whether this counts as a defective assertion or a different speech act entirely. If the speaker is indifferent to the truth, she lacks sincerity, but if the norm is purely epistemic, sincerity might be secondary. The requirement is that the theory must clarify whether the norm governs the expression of belief or the presentation of truth, and it must not collapse the warrant to assert into the warrant to believe, since one can arguably be warranted to assert something one does not personally believe if one is conveying established information.

  This leads directly to the spokesperson case, which imposes a requirement on the theory to identify the subject of the norm. If the company spokesperson reads a vetted statement she does not personally know or believe, a strict individualistic knowledge norm says she is violating the rule. But intuitively, she is doing her job correctly. The theory must therefore decide whether the asserter is the individual mouthpiece or the institution behind her. If it is the institution, the theory needs a mechanism for attributing epistemic states to collectives that differs from individual psychology. If it is the individual, the theory must explain why she is not blameworthy despite violating the norm. You cannot leave this ambiguous; the handout needs to force a choice on whether the norm attaches to the voice or the source. Furthermore, the case of asserting to a hearer who cannot use or remember the information tests the telos of the act. If assertion is purely for guiding action or updating individual belief, this assertion is pointless and perhaps improper. If it is for updating the common ground regardless of uptake, it is fine. The requirement is that the theory must specify whether the norm is hearer-relative or context-relative in a way that includes the common ground independently of specific hearers.

  When you look at the external data, you have to incorporate the tension between philosophical practices and experimental findings. Philosophers lean heavily on the challenge practice data, which suggests knowledge is required, but experimental work suggests ordinary speakers are happy to call assertions fine even when the speaker lacks knowledge. A robust theory must address this divergence. It cannot simply ignore the folk intuitions, nor can it abandon the challenge practices that define the normative structure. This creates a potential incompatibility in your requirements. The pair that is hardest to satisfy together is the requirement to match ordinary speaker intuitions from experimental work and the requirement to match the strictures of challenge and retraction practices. The experimental data suggests the bar is lower than knowledge, while the challenge practice suggests the bar is knowledge. A theory that satisfies the challenge practice by setting the norm at knowledge will conflict with the experimental data, and a theory that lowers the norm to match the experimental data will struggle to explain why we challenge assertions by asking for knowledge specifically. You will likely have to designate one of these as the hard constraint and the other as data to be explained away, perhaps by arguing that folk judgments track assertability conditions rather than the norm itself, or that challenge practices are stricter than actual permissibility.

  If I had to pick the single requirement that does the most work in ruling candidates out, it is the requirement to explain retraction practices in light of new epistemic information. This is the knockout constraint. A truth norm cannot explain why we retract a true assertion if we learn we guessed it, and a justified belief norm cannot explain why we retract a justified assertion if we learn it was false due to luck. Only a norm that ties permissibility to a specific epistemic standing that can be retroactively undermined explains why we feel compelled to say I take that back when we learn we didn't know. This requirement forces the theory to link the propriety of the act to the speaker's epistemic relation to the content at the time of speaking, rather than just the truth of the content or the utility of the speech. It rules out purely consequentialist accounts and pure truth accounts immediately. For your handout, this is the anchor. Everything else, including how you handle the tech support stakes or the spokesperson's institutional role, must be consistent with why we retract when our epistemic standing fails. If a theory cannot explain why the tech should retract if she learns she didn't know, even if the stakes were low, it fails this test. If it cannot explain why the spokesperson should retract if the company vetting was flawed, it also fails. This focus on retraction keeps the norm tied to epistemic responsibility rather than just successful communication.

  So for the handout, lay it out as a demand for consistency across these fronts. The theory must handle the low-stakes tech case without abandoning the epistemic core revealed by challenge practices. It must handle the spokesperson case without collapsing the distinction between individual and collective agency. It must handle the indifferent meeting-case speaker without conflating assertion with bullshit or mere assumption. And it must handle the useless hearer case without making assertion dependent on specific uptake. But above all, it must prioritize the retraction and challenge data over folk intuitions if it wants to maintain a robust normative structure, because that is where the distinctiveness of assertion lies. The incompatibility between folk intuitions and challenge practices is the battlefield, but the retraction practice is the terrain that determines who wins. Make sure the group sees that satisfying the retraction constraint is non-negotiable for a serious norm account, whereas accommodating every folk intuition from experimental work is optional house style. That distinction should clarify where the real philosophical work begins.
