prompt: |-
  Before I read any more theories of content, I want the spec. Write me the desiderata for a theory of what makes a mental or neural state about something — the phenomena it has to explain, the cases it has to get right, the distinctions it can't collapse, each with the case that forces it. I want at least: misrepresentation (a state that's supposed to be about F but fires when no F is around); the disjunction problem — why a state reliably triggered by two different things doesn't just mean their disjunction; content with nothing behind it (a belief about unicorns, a plan for a house that never gets built); the imperative/descriptive split (a bee's dance both reports where the nectar is and tells you to go there); and content where there's no selection history to appeal to — say a person who's worn a belt that buzzes toward north for a year and now just feels which way north is, or a net that got its job by gradient descent rather than evolution. Also say whether the theory owes us correctness in a normative sense rather than mere reliable correlation, and whether it has to give determinate content or can shrug and say "it's about the disjunction" or "about the average of the two". For each requirement, why its a requirement and not a prejudice of one camp, and mark the non-negotiable ones. Then flag any pair you think can't be had together — that's what I'm actually after. Keep any scorecard of the main contenders to a couple of lines.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Goal:** Provide the *specification* (desiderata) for a theory of mental/neural content (intentionality).
      *   **Tone:** Direct, technical, philosophical but grounded in phenomena. No fluff, no history of theories unless necessary for the "scorecard."
      *   **Required Elements:**
          *   Misrepresentation (error).
          *   The Disjunction Problem.
          *   Empty Content (non-existent objects).
          *   Imperative vs. Descriptive (direction of fit).
          *   Content without Selection History (novel mechanisms, AI, sensory substitution).
          *   Normativity vs. Reliability.
          *   Determinacy vs. Indeterminacy.
          *   Justification for each (why it's a requirement, not prejudice).
          *   Mark non-negotiables.
          *   **Crucial:** Flag incompatibilities (trade-offs) between desiderata.
          *   **Constraint:** Keep scorecard of contenders to a couple of lines each.

  2.  **Deconstruct the Desiderata:**

      *   *Misrepresentation:* A theory must explain how a state can be *wrong*. If content is just causal correlation, error is impossible (if X causes State S, then S means X, even if X isn't "really" the target).
      *   *Disjunction Problem:* If State S is caused by Horses and by Cows-on-dark-nights, does it mean HORSE or (HORSE $\lor$ COW-ON-DARK-NIGHT)? A theory must pick the specific content to allow for error.
      *   *Empty Content:* Thoughts about unicorns or future plans. There is no causal link to a real object. The theory must handle non-existent referents.
      *   *Imperative/Descriptive:* Some states say "P is the case" (belief), others say "Make P the case" (desire/command). Bee dances are a classic hybrid case.
      *   *No Selection History:* Teleosemantics relies on evolution. But what about new tools (North-sensing belt) or AI (gradient descent)? A general theory shouldn't exclude these.
      *   *Normativity:* Is content about how things *ought* to be (normative) or just how they *are* (descriptive/natural)?
      *   *Determinacy:* Must content be precise, or is vagueness/indeterminacy acceptable?

  3.  **Drafting the Desiderata (Iterative Process):**

      *   *Item 1: Misrepresentation.* Why? Because we make mistakes. If a theory can't explain error, it explains nothing. Non-negotiable.
      *   *Item 2: Disjunction.* Why? Because specific error requires specific content. If content is disjunctive, error vanishes. Non-negotiable.
      *   *Item 3: Empty Content.* Why? We think about fiction and futures. Non-negotiable.
      *   *Item 4: Direction of Fit.* Why? Motivation differs from cognition. A map isn't a command. Non-negotiable.
      *   *Item 5: Ahistorical Content.* Why? Brains learn online; AI exists. Teleosemantics is too narrow. Strong requirement, but maybe some fight it. Let's mark it as critical for a *general* theory.
      *   *Item 6: Normativity.* Why? Content entails correctness conditions, not just regularities. This is the heart of the "Hard Problem" of intentionality. Non-negotiable.
      *   *Item 7: Determinacy.* Why? If content is indeterminate, communication and reasoning break down.

  4.  **Identifying Incompatibilities (The "Actually After" part):**
      *   *Naturalism vs. Normativity:* If you want a purely naturalistic theory (causal/functional), capturing genuine normativity is incredibly hard (Hume's Guillotine).
      *   *Determinacy vs. Naturalism:* Quine's Indeterminacy of Translation. Natural facts might not pin down *one* specific content.
      *   *Ahistorical vs. Teleological:* You can't have strong teleosemantics (history-dependent) and satisfy the Ahistorical requirement simultaneously.
      *   *Misrepresentation vs. Reliability:* To get error, you need a norm. To get a norm naturalistically, you usually need history/function. But history excludes new learning/AI.

      *   *The Big Tension:* **Normative Determinacy vs. Naturalistic Parsimony.** You can have content that is truly normative and determinate, but it usually requires non-natural properties (dualism/phenomenology). Or you keep it naturalistic, but you sacrifice genuine normativity or determinacy (eliminitivism/interpretivism).

  5.  **Refining the Output Structure:**
      *   Introduction: Set the stage (Naturalizing Intentionality).
      *   The Spec (List of Desiderata): Case, Requirement, Why Non-Prejudicial, Status (Non-negotiable/Negotiable).
      *   The Trade-Offs (Incompatibilities): This is the core value add.
      *   Scorecard: Brief mentions of Teleosemantics, Informational Semantics, Inferential Role, Interpretivism.

  6.  **Drafting the Content (Self-Correction during drafting):**
      *   *Correction:* Make sure to explicitly address the "North-sensing belt" and "Gradient Descent" cases in the Ahistorical section.
      *   *Correction:* Ensure the distinction between "Normative Correctness" and "Reliable Correlation" is sharp.
      *   *Correction:* The prompt asks to flag pairs that can't be had together. I need to be bold here.
      *   *Tone Check:* Keep it dry, specification-like. "The system must..."

  7.  **Final Review against Constraints:**
      *   Misrepresentation? Yes.
      *   Disjunction? Yes.
      *   Empty Content? Yes.
      *   Imperative/Descriptive? Yes.
      *   No Selection History? Yes.
      *   Normativity vs Correlation? Yes.
      *   Determinacy? Yes.
      *   Why requirement not prejudice? Yes.
      *   Mark non-negotiables? Yes.
      *   Flag incompatibilities? Yes.
      *   Scorecard to couple of lines? Yes.

  8.  **Final Polish:** (Writing the response based on the above plan.) *Self-correction: Ensure the "Why it's a requirement" sections don't sound like I'm advocating for one theory, but rather stating what the phenomenon demands.* *Make sure the "Incompatibilities" section highlights the "Hard Problem" aspect.*

      *(Self-Correction on the "North-sensing belt"):* This is a specific challenge to Teleosemantics. I need to make sure the desideratum reflects that a theory shouldn't fail just because the mechanism is new.

      *(Self-Correction on "Normativity"):* Distinguish between "normative force" (ought) and "functional norm" (goal-directedness). The prompt asks about correctness in a normative sense.

      *(Final check on Incompatibilities):* The strongest tension is between **Robust Normativity** and **Strict Naturalism**. Also **Determinacy** and **Physical Supervenience**.

      Let's assemble.

      *Structure:*
      1. Header: Specification for Intentionality.
      2. Desiderata List (1-7).
      3. The Incompatibility Matrix (The "Real" Answer).
      4. Scorecard.

      *Refining the "Non-negotiable" tags:* Misrepresentation and Empty Content are phenomenologically non-negotiable. Normativity is philosophically non-negotiable for *content* (vs signal). Ahistorical is empirically non-negotiable given AI/Neuroplasticity. Determinacy is logically non-negotiable for logic/truth.

      *Refining the "Incompatibilities":*
      1. Naturalism vs. Normativity.
      2. Determinacy vs. Supervenience on the Physical.
      3. Ahistorical vs. Teleological Function.

      Okay, ready to write.

      *(Wait, one last check on the prompt)*: "Write me the desiderata... each with the case that forces it." "Say whether the theory owes us correctness in a normative sense..." "Flag any pair you think can't be had together."

