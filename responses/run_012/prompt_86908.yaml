      Let's go.cw
answer: |-
  # Specification: Naturalizing Intentionality

  **Objective:** Define the necessary conditions for a theory of mental/neural content (intentionality).
  **Scope:** Biological cognition, artificial networks, and hybrid systems.

  ## I. Desiderata List

  ### 1. The Error Condition (Misrepresentation)
  *   **The Case:** A frog snaps at a moving black speck. It is a fly (food). Sometimes it snaps at a BB pellet (not food). The state must mean FLY, not (FLY $\lor$ BB). If it means the disjunction, the frog never makes a mistake; it just gets what it wants.
  *   **Requirement:** The theory must distinguish between the *actual* cause of a tokening and the *correct* condition for that tokening. It must allow a state to be triggered when its content is false.
  *   **Why Requirement:** Error is a datum of cognition. A system that cannot be wrong cannot be right in a semantic sense; it is merely a transducer.
  *   **Status:** **NON-NEGOTIABLE.**

  ### 2. The Disjunction Problem (Specificity)
  *   **The Case:** A neural pattern fires for Horses and for Cows at night. Does it mean HORSE or (HORSE $\lor$ COW-AT-NIGHT)? If the latter, the system never misrepresents a cow as a horse.
  *   **Requirement:** The theory must provide grounds for selecting the specific content (HORSE) over the infinite disjunction of actual triggers, without appealing to the theorist's intuition.
  *   **Why Requirement:** Without specificity, truth conditions collapse. Logic requires stable truth values, not "true whenever triggered."
  *   **Status:** **NON-NEGOTIABLE.**

  ### 3. The Null Reference Condition (Empty Content)
  *   **The Case:** A subject plans a house that is never built, or believes unicorns exist. There is no causal link to a real object, no evolutionary history of interaction with the object.
  *   **Requirement:** The theory must assign content to states where the referent does not exist and no causal chain terminates in the world.
  *   **Why Requirement:** Cognition is not limited to the present actual. Imagination, planning, and error about non-existents are core functions.
  *   **Status:** **NON-NEGOTIABLE.**

  ### 4. Direction of Fit (Imperative vs. Descriptive)
  *   **The Case:** A bee dance encodes nectar location (descriptive) but also functions as a command to fly there (imperative). A belief aims to match the world; a desire aims for the world to match it.
  *   **Requirement:** The theory must distinguish states that represent *how the world is* from states that represent *how the world should be made*, even if the neural vehicle is identical.
  *   **Why Requirement:** Motivation and reasoning operate differently on these states. Collapsing them eliminates the distinction between hallucination and volition.
  *   **Status:** **NON-NEGOTIABLE.**

  ### 5. The Ahistorical Constraint (Novel Mechanisms)
  *   **The Case:** A human wears a magnetic belt buzzing toward North for one year, then internalizes the sense. Or a neural net acquires a detector via gradient descent, not evolution. There is no selection history for "North" or the specific feature detected.
  *   **Requirement:** The theory must ground content in current structure/function, not solely in phylogenetic or ontogenetic selection history.
  *   **Why Requirement:** Brains learn online; AI exists. A theory requiring evolutionary history renders most learning and all artificial intentionality impossible.
  *   **Status:** **NON-NEGOTIABLE** (for a general theory).

  ### 6. The Normativity Constraint (Correctness vs. Correlation)
  *   **The Case:** A thermometer reliably correlates with temperature. It does not *believe* it is 20°C. It has no "ought." A belief that it is 20°C *ought* to be true.
  *   **Requirement:** The theory must explain why content entails a norm of correctness (truth/satisfaction), not merely reliable covariance.
  *   **Why Requirement:** Mere correlation is syntax or signal. Semantics requires a standard of success that can be violated (see #1).
  *   **Status:** **NON-NEGOTIABLE.**

  ### 7. The Determinacy Constraint
  *   **The Case:** Quine's "Gavagai." A native says "Gavagai" when a rabbit runs by. Does it mean RABBIT, UNDETTACHED RABBIT PARTS, or RABBIT-STAGE? Physical facts alone seem to underdetermine the choice.
  *   **Requirement:** The theory must either yield determinate content or explain why indeterminacy does not destroy reasoning and communication.
  *   **Why Requirement:** If content is radically indeterminate, logical inference (e.g., modus ponens) cannot get a grip.
  *   **Status:** **NEGOTIABLE** (Some theories accept indeterminacy; most reject it).

  ---

  ## II. Incompatibility Flags (The Trade-Offs)

  You cannot satisfy all desiderata simultaneously within a strictly naturalistic framework. Here are the hard conflicts:

  **1. Normativity (#6) vs. Strict Naturalism**
  *   **Conflict:** To get genuine normativity (an "ought"), you typically need to appeal to functions or goals. In naturalism, functions are usually cashed out via history (Teleosemantics). But History violates the **Ahistorical Constraint (#5)**. If you drop history to save #5, you struggle to ground the "ought" of #6 without smuggling in dualism or interpreter-dependence.
  *   **Verdict:** You can have **Ahistorical Content** or **Robust Normativity**, but likely not both without positing non-natural properties.

  **2. Determinacy (#7) vs. Physical Supervenience**
  *   **Conflict:** Physical facts (neural firing, weights in a net) appear to underdetermine semantic content (the Disjunction Problem #2). To force determinacy, theories often appeal to "ideal conditions" or "interpreters." This makes content depend on something outside the head (violating internalism) or makes it observer-relative (violating objectivity).
  *   **Verdict:** You can have **Determinacy** or **Local Physical Supervenience**, but the link between them is the "Hard Problem" of intentionality.

  **3. Misrepresentation (#1) vs. Reliability**
  *   **Conflict:** To explain error, you need a norm. To explain the norm naturalistically, you need a function. To define function without circularity, you need a history of success. But if the system is reliable (as in the North-sensing belt #5), the history is too short to establish a norm distinct from correlation.
  *   **Verdict:** **Novel Learning** and **Error** are in tension. The more you optimize for novel learning (AI/Plasticity), the harder it is to distinguish "learning new content" from "changing the subject."

  ---

  ## III. Scorecard of Contenders

  *   **Teleosemantics (Millikan, Papineau):** Solves Normativity and Error via evolutionary history. **Fails:** Ahistorical Constraint (cannot handle new sensors/AI) and Empty Content (no history for unicorns).
  *   **Informational Semantics (Fodor, Dretske):** Solves Ahistorical and Naturalism via causal covariance. **Fails:** Disjunction Problem and Normativity (cannot distinguish error from rare correlation without history).
  *   **Inferential Role Semantics (Block, Brandom):** Solves Determinacy and Empty Content via internal logic. **Fails:** Normativity (internal coherence $\neq$ truth about world) and Misrepresentation (holism makes error hard to localize).
  *   **Interpretivism (Dennett, Davidson):** Solves Normativity and Determinacy via observer stance. **Fails:** Objectivity (content is in the eye of the beholder, not the neural state).

  **Summary:** No current theory satisfies the **Non-Negotiable** set (1, 2, 3, 4, 5, 6) without compromising Naturalism. The spec demands a mechanism that generates genuine norms from novel physical structures. Nothing currently delivers this.
