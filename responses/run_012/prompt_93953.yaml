      *   **Task:** Create a final exam essay question based on provided material (a specific variation of Sen's Liberal Paradox), plus a model answer and a marking scheme.
      *   **Constraints:**
          *   Use the provided material *as-is* (alternatives N, D, M; preferences; rights definitions; three repairs A, B, C).
          *   Exam conditions: 90 minutes, ~800 words, 20 marks.
          *   Goal: Prevent students from just regurgitating the "Prude and Lewd" example. They must engage with the *logic* using the new example.
          *   Question Structure: (i) Run the paradox, (ii) Identify necessary/idle assumptions, (iii) Assess the three repairs (break cycle? generalize? cost to liberty?), (iv) Final judgment on "free" repairs.
          *   Model Answer: ~700 words.
          *   Marking Scheme: 5 points x 4 marks = 20 marks. Must specify "must-hit" content and common errors (specifically punishing hand-waving about rights).

  2.  **Drafting the Exam Question:**
      *   *Objective:* Clear, directive, incorporates the provided text without alteration, guides the student through the four required steps.
      *   *Structure:* Introduction (context), The Scenario (paste provided text), The Task (four bullet points corresponding to the prompt's requirements).
      *   *Refinement:* Ensure the instructions explicitly forbid using the Prude/Lewd example. Make sure the word count and time limit are stated.

  3.  **Developing the Logic (for the Model Answer):**
      *   *The Paradox Run-through:*
          *   Rights: Devi decisive on {N, D}. Marco decisive on {N, M}.
          *   Preferences: Devi (N > D > M), Marco (D > M > N).
          *   Application:
              *   Devi prefers N > D. Since she is decisive on {N, D}, Social Ranking (SR) must have N > D.
              *   Marco prefers M > N. Since he is decisive on {N, M}, SR must have M > N.
              *   Pareto: Both prefer D > M (Devi: D > M, Marco: D > M). So SR must have D > M.
              *   Cycle: N > D, D > M, M > N. Intransitive.
      *   *Assumptions:* Universal Domain (given preferences), Pareto Principle (used for D > M), Liberal Principle (used for N > D and M > N), Transitivity (violated).
      *   *Repairs:*
          *   (A) Sphere Restriction: Devi's pref depends on Marco (cost to him). Marco's depends on Devi. Both violate this. If enforced, preferences change (e.g., Devi only cares about N vs D based on her nose). If Devi only cares about her nose, maybe N > D still holds, but the *reason* matters. Actually, if preferences must be self-regarding, the specific preferences given in the prompt are inadmissible. This restricts Universal Domain. Cost: Limits the scope of legitimate preferences (paternalistic/illiberal).
          *   (B) Procedural Reading: No social ranking, just outcomes. Devi chooses N over D. Marco chooses M over N. Outcome? If they choose simultaneously or sequentially, we might get a specific outcome (e.g., status quo N), but we lose the social *ordering*. It dissolves the paradox by abandoning the goal of a coherent social welfare function. Cost: Loss of collective rationality/transitivity.
          *   (C) Lexicographic Priority: Rights > Pareto.
              *   Rights dictate: N > D (Devi), M > N (Marco).
              *   Pareto dictates: D > M.
              *   If Rights are prior, we respect N > D and M > N. We ignore D > M.
              *   Result: M > N > D. (Transitive).
              *   Cost: Violates Pareto efficiency. A situation everyone agrees is better (D) is rejected because of rights structure.
      *   *Conclusion:* No repair is free. Each sacrifices a core value (Domain, Rationality, or Efficiency).

  4.  **Drafting the Model Answer:**
      *   *Tone:* Academic, precise, third-year level.
      *   *Length:* Around 700 words.
      *   *Content:* Follow the four steps strictly.
      *   *Drafting - Step 1 (Run-through):* Establish the cycle clearly using N, D, M.
      *   *Drafting - Step 2 (Assumptions):* Highlight Pareto and Liberalism as the conflicting engines.
      *   *Drafting - Step 3 (Repairs):* Analyze A, B, C.
          *   A: Blocks the specific preferences. Costs liberty of preference formation.
          *   B: Abandons transitivity/social ordering. Costs collective rationality.
          *   C: Sacrifices Pareto. Costs efficiency/welfare.
      *   *Drafting - Step 4 (Judgment):* No free lunch.
      *   *Review against constraints:* Did I use the Prude/Lewd example? No. Did I use the provided text? Yes. Is it ~700 words? (Need to monitor).

  5.  **Designing the Marking Scheme:**
      *   *Total:* 20 marks (5 criteria x 4 marks).
      *   *Criteria:*
          1.  Correct derivation of the cycle using the specific N/D/M preferences and rights.
          2.  Identification of the specific assumptions driving the conflict (Pareto + Liberalism vs. Transitivity).
          3.  Analysis of Repair A (Sphere) and Repair B (Procedural).
          4.  Analysis of Repair C (Lexicographic) and the Efficiency cost.
          5.  Final Judgment (No free repair) + Quality/Clarity.
      *   *Common Errors:* Need to specify what loses marks (e.g., vague hand-waving, using Prude/Lewd, missing the Pareto violation in C).
      *   *Refinement:* The prompt asks for "five must-hit points at 4 marks each". I need to make sure these cover the whole question.
          1.  Derivation of the Intransitivity (The Cycle).
          2.  Identification of Necessary Assumptions (Pareto + Liberal vs Transitivity).
          3.  Evaluation of Repairs A & B (Domain vs Rationality).
          4.  Evaluation of Repair C (Rights vs Pareto).
          5.  Synthesis/Conclusion (No free lunch) + Argumentative Coherence.

  6.  **Review and Refine:**
      *   *Check:* Did I paste the provided material exactly? Yes.
      *   *Check:* Is the model answer distinct from the marking scheme? Yes.
      *   *Check:* Is the marking scheme harsh on hand-waving? Yes, specifically added notes about "rights are trumps" vagueness.
      *   *Word Count Check:* The model answer needs to be tight.
      *   *Formatting:* Clear headings for the user.

      *(Self-Correction during drafting Model Answer)*: I need to make sure I don't just say "Repair A works." I need to explain *how* it works (by excluding the preferences) and the *cost* (illiberal restriction on preference formation). For Repair C, I need to show the resulting ranking is transitive but Pareto-inferior.

      *(Self-Correction during Marking Scheme)*: Ensure the "Common Error" notes are punchy and directly address the instructor's concern about students name-dropping or being vague about rights.

  7.  **Final Polish:** Check against the "90-minute/800-word" constraint context. The question should look like a real exam paper excerpt.

      *Wait, one detail in the prompt:* "Three repairs for them to assess... (C) lexicographic priority... Pareto only gets applied where no right is at stake."
      *Logic Check on C:* If Rights are prior, we establish N > D (Devi) and M > N (Marco). This gives M > N > D. The Pareto preference is D > M. Since a right is at stake in the comparison between D and M? Actually, neither has a right over {D, M}. But the *outcome* D is blocked by the chain of rights. If Rights are lexicographically prior, we satisfy rights first. The resulting ordering M > N > D violates Pareto (since everyone prefers D to M). So the cost is Pareto.
      *Wait, does C break the cycle?* Yes, M > N > D is transitive.
      *Does it generalize?* Yes, prioritizing one constraint over another resolves conflicts but sacrifices the lower priority.
      *Cost:* Pareto efficiency.

      *Logic Check on A:* "require every individual's preference to depend only on their own sphere". In the prompt, Devi cares about Marco's interviews. Marco cares about Devi's piercing. Both violate this. So if we enforce A, these preferences are inadmissible. We must assume new preferences. If preferences are restricted to self-regarding, the paradox might not arise, but the cost is restricting the "Universal Domain" of admissible preferences. This is illiberal.

      *Logic Check on B:* "stop demanding a transitive social ranking". This accepts the cycle or treats rights as game moves. It solves the *logical* contradiction by changing the definition of "social choice" from an ordering to a set of outcomes or a game. Cost: Collective rationality.

      *Okay, ready to write.*
answer: |-
  # Exam Question

  **Course:** PHL304 Social Choice & Political Philosophy
  **Time Allowed:** 90 Minutes
  **Word Limit:** Approx. 800 words
  **Marks:** 20

  **Question 1**

  Read the following scenario and proposed repairs carefully. **Do not use the standard 'Prude and Lewd' example in your answer; rely solely on the material below.**

  **The Scenario**
  Three alternatives:
  - N - neither Devi nor Marco has a nose piercing.
  - D - Devi has one and Marco doesn't.
  - M - Marco has one and Devi doesn't.

  Two rights, understood as decisiveness: Devi is decisive over the pair {N, D}; Marco is decisive over the pair {N, M}. 'Decisive' means: if the named individual strictly prefers one member of the pair to the other, the social ranking has to go the same way, whatever anyone else prefers.

  Preferences (no intensities, no comparisons between people):
  - Devi: N > D > M. She doesn't want one herself; but if one of them is going to have one she'd rather it were her, since she reckons a nose ring would cost Marco at interviews.
  - Marco: D > M > N. He'd rather Devi got one; he's squeamish about his own; and he'd least like it if neither of them did.

  **Three Proposed Repairs**
  (A) **The Sphere Restriction:** require every individual's preference to depend only on their own sphere - in this case, only on whether they themselves have a piercing - so nobody's ranking turns on what the other person does with their own body.
  (B) **The Procedural Reading:** stop demanding a transitive social ranking at all; let each right-holder simply choose within their own pair and call whatever results the outcome.
  (C) **Lexicographic Priority:** keep both the rights and Pareto, but make the rights lexicographically prior, so Pareto only gets applied where no right is at stake.

  **Task**
  Write an essay addressing the following four points:
  1.  Demonstrate how the Liberal Paradox arises in this specific scenario. Identify which assumption drives each step of the social ranking.
  2.  Specify exactly which assumptions are necessary to generate the contradiction and which are idle.
  3.  Assess repairs (A), (B), and (C) in turn. For each, determine: does it resolve the intransitivity in this case? Does it generalise? What is the specific cost to a theorist who values liberty or welfare?
  4.  Conclude with a judgement on whether any of these repairs is 'free' (i.e., resolves the paradox without sacrificing a normative principle).

  ***

  # Model Answer

  The Liberal Paradox arises here because the exercise of individual rights combined with the Pareto principle generates a cyclic social ranking, violating transitivity. We begin with the rights assignments. Devi is decisive over {N, D}. Her preference is N > D. By the Liberal Principle (L), the social ranking must reflect this: **N > D**. Marco is decisive over {N, M}. His preference is M > N (derived from D > M > N). By (L), the social ranking must reflect this: **M > N**. Finally, we apply the Pareto Principle (P). Both individuals prefer D to M (Devi: N > **D > M**; Marco: **D > M** > N). By (P), the social ranking must be **D > M**. Combining these yields the cycle: N > D > M > N. The assumption doing the work at each step is respectively (L), (L), and (P). The contradiction emerges when we demand the social ranking be transitive (Assumption T).

  To generate this contradiction, four assumptions are necessary: Universal Domain (U) allows these specific preferences; Pareto (P) forces D > M; Liberalism (L) forces N > D and M > N; and Transitivity (T) declares the result impossible. No assumption is idle; removing any one dissolves the cycle. If we drop (U), the preferences are inadmissible. If we drop (P) or (L), the conflicting rankings vanish. If we drop (T), the cycle is permissible.

  Assessing the repairs reveals that none are without normative cost. Repair (A), the Sphere Restriction, resolves the cycle by restricting Universal Domain. In this scenario, both Devi and Marco violate the restriction: Devi cares about Marco's interviews, and Marco cares about Devi's piercing. To enforce (A), we must declare these preferences inadmissible. While this breaks the cycle by preventing the specific preferences that cause it, it does not generalise well without significant cost. It imposes a paternalistic constraint on preference formation, forbidding individuals from caring about others' actions even when those actions affect them. For a libertarian, this is illiberal; it restricts the *content* of private judgment, not just the *outcome*.

  Repair (B), the Procedural Reading, resolves the contradiction by abandoning Transitivity (T). It treats rights as game moves rather than inputs for a social welfare function. If Devi chooses N over D, and Marco chooses M over N, we accept the outcome without demanding a coherent social ordering of all three. This generalises easily: rights protect choices, not social rationality. However, the cost is collective rationality. A society that cannot rank outcomes transitively may make self-defeating choices over time. For a welfare-oriented theorist, this is unacceptable; it sacrifices the ability to identify efficient or coherent social states for the sake of procedural liberty.

  Repair (C), Lexicographic Priority, preserves Transitivity by sacrificing Pareto. Rights are applied first: Devi ensures N > D; Marco ensures M > N. This creates a chain M > N > D. The Pareto preference (D > M) is ignored because the rights structure already determined the ranking of the relevant alternatives indirectly. This resolves the cycle and generalises to any conflict between rights and efficiency. However, the cost is Pareto efficiency. Outcome D is strictly preferred by everyone to outcome M, yet M is socially ranked higher because of the rights structure. For a welfarist, this is a 'Paretian liberal' impossibility; we secure liberty only by accepting outcomes everyone agrees are worse.

  In conclusion, no repair is 'free'. Repair (A) sacrifices the liberty to form other-regarding preferences (Universal Domain). Repair (B) sacrifices collective rationality (Transitivity). Repair (C) sacrifices welfare efficiency (Pareto). The paradox demonstrates that we cannot simultaneously maximise individual decisiveness, respect unanimous welfare improvements, and maintain a rational social ordering. A theorist must choose which principle to weaken; there is no technical fix that preserves all normative commitments.

  ***

  # Marking Scheme

  **Total: 20 Marks (5 Criteria x 4 Marks)**

  **1. Derivation of the Cycle (4 Marks)**
  *   **Must Hit:** Correctly identifies the three social ranking steps: N > D (via Devi's right), M > N (via Marco's right), D > M (via Pareto). Explicitly states the resulting intransitivity (N > D > M > N).
  *   **Common Error:** Students recite the 'Prude and Lewd' story instead of using N/D/M, or they confuse who is decisive over which pair, breaking the logic of the cycle.

  **2. Identification of Assumptions (4 Marks)**
  *   **Must Hit:** Explicitly names Universal Domain, Pareto, Liberalism, and Transitivity. Correctly identifies that *all* are necessary (none are idle) to produce the impossibility.
  *   **Common Error:** Claiming one assumption is 'idle' or failing to mention Universal Domain as the enabler of the specific preferences provided in the text.

  **3. Assessment of Repairs A & B (4 Marks)**
  *   **Must Hit:** Explains that (A) restricts admissible preferences (cost to liberty of preference) and (B) abandons transitivity (cost to rationality). Must note that (A) renders the prompt's preferences inadmissible.
  *   **Common Error:** Hand-waving that (A) 'protects privacy' without noting it bans the specific preferences given, or claiming (B) solves the problem without acknowledging the loss of social ordering.

  **4. Assessment of Repair C (4 Marks)**
  *   **Must Hit:** Explains that (C) resolves the cycle by prioritizing Rights over Pareto. Must explicitly identify the cost: the social outcome violates Pareto efficiency (everyone prefers D to M, but M wins).
  *   **Common Error:** Students argue (C) is the 'best' solution because it protects rights, but fail to note that it forces a Pareto-inferior outcome, or they claim it satisfies both Rights and Pareto simultaneously.

  **5. Conclusion & Coherence (4 Marks)**
  *   **Must Hit:** Concludes that no repair is 'free' (trade-offs are unavoidable). Essay is structured logically, adheres to the word limit, and uses the provided example exclusively.
  *   **Common Error:** Vague philosophical posturing (e.g., "rights are trumps so it's just a technicality") without engaging with the specific trade-offs identified in parts (i)-(iii), or drifting back into textbook examples.
