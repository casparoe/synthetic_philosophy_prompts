answer: |-
  # Handout: Mapping the Representation Debate
  **To:** Interpretability Group
  **From:** [Your Name]
  **Subject:** Decision Tree for Ontological Commitments

  We are frequently talking past one another because "representation" is a placeholder for several distinct ontological claims. The following decision tree diagnoses your position based on how you judge concrete technical cases. 

  Answer the questions sequentially. Your path determines your philosophical commitment.

  ---

  ## The Decision Tree

  **Q1. The Ablation Test (Causal Necessity)**
  *Case:* A linear probe decodes a concept (e.g., "dog") from a layer's activations with 99% accuracy. However, zeroing out those specific activation directions leaves the network's output behavior regarding dogs completely unchanged.
  **Question:** Does that activation vector *represent* "dog"?
  *   **NO** (Representation requires causal impact on behavior) → Go to **Q2**.
  *   **YES** (Correlation/Structure is sufficient) → Go to **Q5**.

  **Q2. The Rotation Test (Vehicle Specificity)**
  *Case:* Two networks compute the exact same input–output function. Network A uses activation subspace $S$. Network B uses subspace $R \cdot S$ (an orthogonal rotation of weights and activations). The causal graph is preserved, but the physical vectors differ.
  **Question:** Do they possess the *same* internal representations?
  *   **NO** (The specific physical vector matters) → Go to **Q3**.
  *   **YES** (Only the abstract causal role matters) → Go to **Q4**.

  **Q3. The Task Relativity Test (Vehicle Observer-Dependence)**
  *Case:* A specific physical feature fires reliably on one entity and is read by a downstream circuit. However, identifying it as a "representation of X" relies on an analyst choosing a specific task decomposition.
  **Question:** Is the physical vehicle a representation of X independent of that analyst's choice?
  *   **YES** → **Leaf A**
  *   **NO** → **Leaf B**

  **Q4. The Granularity Test (Functional Observer-Dependence)**
  *Case:* A human-readable algorithm is recovered from the weights. The causal role can be described at the level of individual neurons or at the level of high-level subroutines.
  **Question:** Is the causal role defined by the network's native physical granularity (neurons) or the analyst's chosen abstraction (subroutines)?
  *   **Native (Neurons)** → **Leaf C**
  *   **Analyst (Subroutines)** → **Leaf D**

  **Q5. The Ontology Test (Structural Realism)**
  *Case:* A pattern in the weights is isomorphic to a human concept, but the network does not causally use it to compute outputs (it is redundant).
  **Question:** Do these informational states exist as real entities, or are they merely useful fictions for prediction?
  *   **Real Entities** → Go to **Q6**.
  *   **Useful Fictions** → Go to **Q7**.

  **Q6. The Recovery Test (Structural Observer-Dependence)**
  *Case:* A human-readable algorithm is recovered from the weights.
  **Question:** Is that algorithm a pre-existing entity discovered by the human, or a projection imposed by the human's vocabulary?
  *   **Discovered (Mind-Independent)** → **Leaf E**
  *   **Imposed (Mind-Dependent)** → **Leaf F**

  **Q7. The Utility Test (Anti-Realism Strength)**
  *Case:* We attribute representations to the network to explain its behavior.
  **Question:** Are these attributions strictly false categories that should be eliminated, or merely false-but-indispensable tools?
  *   **Indispensable Tools** → **Leaf G**
  *   **False Categories** → **Leaf H**

  ---

  ## The Leaves: Positions and Commitments

  ### Leaf A: Hard Vehicle Realism
  *   **Path:** Q1(No) → Q2(No) → Q3(Yes)
  *   **Awkward Commitment:** You must accept that two physically identical states in different networks could represent different things if their causal histories differ, or that physically distinct states cannot represent the same thing.
  *   **Classification:** Representation as **Vehicle**.

  ### Leaf B: Perspectival Vehicle Theory
  *   **Path:** Q1(No) → Q2(No) → Q3(No)
  *   **Awkward Commitment:** You must accept that the physical ontology of the network changes depending on the observer's chosen task, making objective comparison between models impossible.
  *   **Classification:** Representation as **Vehicle** (but Observer-Relative).

  ### Leaf C: Mechanistic Functionalism
  *   **Path:** Q1(No) → Q2(Yes) → Q4(Native)
  *   **Awkward Commitment:** You must accept that the boundary of a "representation" is fixed by the arbitrary architecture (e.g., layer width) rather than the semantic content it computes.
  *   **Classification:** Representation as **Causal Role**.

  ### Leaf D: Pragmatic Functionalism
  *   **Path:** Q1(No) → Q2(Yes) → Q4(Analyst)
  *   **Awkward Commitment:** You must accept that two analysts can correctly disagree on what a network represents based solely on their chosen level of abstraction, with no fact of the matter to resolve the dispute.
  *   **Classification:** Representation as **Causal Role** (but Observer-Relative).

  ### Leaf E: Platonic Structural Realism
  *   **Path:** Q1(Yes) → Q5(Real) → Q6(Discovered)
  *   **Awkward Commitment:** You must accept that a network contains representations of concepts it never uses and never will, simply because the mathematical structure allows for a mapping.
  *   **Classification:** Representation as **Content** (Mind-Independent).

  ### Leaf F: Model-Dependent Realism
  *   **Path:** Q1(Yes) → Q5(Real) → Q6(Imposed)
  *   **Awkward Commitment:** You must accept that representations are real structures, but their identity is contingent on the interpreter's vocabulary, creating a reality that shifts with the analyst.
  *   **Classification:** Representation as **Content** (Observer-Relative).

  ### Leaf G: Instrumentalism
  *   **Path:** Q1(Yes) → Q5(Fiction) → Q7(Indispensable)
  *   **Awkward Commitment:** You must act as if representations exist to do your job while maintaining the theoretical stance that they fundamentally do not.
  *   **Classification:** Representation as **Observer-Relative Fiction**.

  ### Leaf H: Eliminativism
  *   **Path:** Q1(Yes) → Q5(Fiction) → Q7(False)
  *   **Awkward Commitment:** You must explain why interpretability research is possible at all if the core object of study (representation) is a category error akin to "phlogiston."
  *   **Classification:** Representation as **Observer-Relative Fiction** (specifically, Non-Existent).

  ---

  ## Diagnostic Notes on Logical Space

  ### Unoccupied Combinations
  1.  **Non-Causal Vehicle Realism:** (Q1=Yes, Q2=No). This combination is **incoherent**. If you believe correlation is sufficient for representation (Q1=Yes), the specific physical vehicle usually matters less than the informational structure. Claiming the *vehicle* matters but *causality* does not implies a fetishization of the substrate without a functional justification.
  2.  **Causal Eliminativism:** (Q1=No, Q7= False). This is **unexplored/unattractive**. If you require causality for representation (Q1=No), but then claim all such causal attributions are false (Eliminativism), you are essentially claiming networks have no internal structure worth naming. This collapses into a radical behaviorism that most interpretability researchers find pragmatically impossible to maintain.

  ### Indistinguishable Pairs
  1.  **Pragmatic Functionalism (Leaf D) vs. Model-Dependent Realism (Leaf F):**
      *   **Diagnosis:** These positions are **empirically indistinguishable** in daily practice. Both allow the analyst's choice of task to dictate the representation.
      *   **Difference:** Leaf D claims the representation *is* the causal role (which is relative); Leaf F claims the representation *is* the content/structure (which is relative). The disagreement is metaphysical, not operational. You will only separate them if asked whether the underlying structure exists *before* the observer chooses the task.

  2.  **Instrumentalism (Leaf G) vs. Model-Dependent Realism (Leaf F):**
      *   **Diagnosis:** These are **pragmatically indistinguishable**. Both treat representations as dependent on the observer.
      *   **Difference:** Leaf F grants the representation ontological status (it is real *for* the observer); Leaf G denies it (it is a fiction *for* the observer). This distinction rarely affects gradient descent or probing accuracy, but it matters when writing papers about "discovery" vs "construction."

  ### Usage Guide
  If your group debates whether a probe "found" a feature or "imposed" it:
  *   Check **Q1**. If you disagree here, you are debating **Causality vs. Structure**.
  *   Check **Q3/Q4/Q6**. If you agree on Q1 but disagree here, you are debating **Realism vs. Relativity**.
  *   Check **Q7**. If you disagree here, you are debating **Utility vs. Truth**.
