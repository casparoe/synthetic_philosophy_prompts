answer: |-
  This is a high-wire act. You are asking students to walk into a mathematical trap without seeing the net, then asking them to evaluate the fall. The risk is that the economists get bored by the philosophy or the philosophers get bogged down in the math. The key is to keep the math trivial (arithmetic only) and the normative pressure high.

  Here is the complete package for **"The Constitution of Risk."**

  ---

  ## 1. Run-of-Show (90 Minutes)

  | Time | Phase | Activity | Goal |
  | :--- | :--- | :--- | :--- |
  | **00-10** | **Setup** | Distribute Character Sheets. Explain stakes (Coffee/Chair). | Establish cardinal utility & VNM rationality individually. |
  | **10-25** | **Phase 1** | **Individual Calibration.** Students calculate EU for 3 lotteries. | Lock in Premise 1: Individuals maximize Expected Utility (EU). |
  | **25-45** | **Phase 2** | **The Veil.** Students draft a "Social Rule" behind ignorance. | Lock in Premise 2 (Pareto) & Premise 3 (Social VNM). |
  | **45-60** | **Phase 3** | **The Audit.** You test their rules against the axioms. | Show only Weighted Sum survives the axioms. |
  | **60-75** | **Phase 4** | **The Sting.** Apply the rule to a "Sacrifice" case. | Feel the utilitarian bullet. |
  | **75-90** | **Debrief** | **Exit Ramps.** Which premise do you drop? | Reveal the cost of each escape route. |

  ---

  ## 2. Materials

  ### A. The Stakes (Keep it tangible)
  *   **Outcome A:** "The Good Chair" (Ergonomic, near the door).
  *   **Outcome B:** "The Normal Chair" (Standard seminar chair).
  *   **Outcome C:** "The Floor" (Sit on the carpet for the rest of class).
  *   *Note:* Tell them you will actually enforce this for the last 20 minutes of class based on the game result. (They won't believe you, but the *possibility* creates tension).

  ### B. Character Sheets (Print 14 copies, mixed)
  *Do not let them choose their character. Assign them randomly to ensure diversity.*

  **CHARACTER SHEET: TYPE 1 (The Comfort Seeker)**
  *   **Utility of Good Chair:** 100 utils
  *   **Utility of Normal Chair:** 40 utils
  *   **Utility of Floor:** 0 utils
  *   **Risk Attitude:** Neutral (You care only about the expected number of utils).

  **CHARACTER SHEET: TYPE 2 (The Dignity Purist)**
  *   **Utility of Good Chair:** 60 utils
  *   **Utility of Normal Chair:** 50 utils
  *   **Utility of Floor:** -100 utils (Humiliation is worse than no comfort).
  *   **Risk Attitude:** Neutral.

  **CHARACTER SHEET: TYPE 3 (The Minimalist)**
  *   **Utility of Good Chair:** 20 utils
  *   **Utility of Normal Chair:** 15 utils
  *   **Utility of Floor:** 10 utils (You don't care much either way).
  *   **Risk Attitude:** Neutral.

  *(Distribution: 5 Type 1s, 5 Type 2s, 4 Type 3s)*

  ### C. Lottery Cards (Project these or hand out)
  *   **Lottery X:** 50% Chance Everyone gets Good Chair / 50% Chance Everyone gets Floor.
  *   **Lottery Y:** 100% Chance Everyone gets Normal Chair.
  *   **Lottery Z:** 50% Chance Everyone gets Good Chair / 50% Chance Everyone gets Normal Chair.

  ### D. The Constitution Worksheet (One per student)
  *   **Question 1 (Pareto):** If *every* character type prefers Lottery X to Lottery Y, should the Group prefer X to Y? [Yes / No]
  *   **Question 2 (Social Rationality):** If the Group prefers X to Y, and Y to Z, must the Group prefer X to Z? [Yes / No]
  *   **Question 3 (Independence):** If the Group is indifferent between X and Y, is it still indifferent if we add a 50% chance of "Everyone gets Floor" to both? [Yes / No]
  *   **Question 4 (The Rule):** Write down the formula the Group should use to rank Lotteries. _______________

  ---

  ## 3. Facilitator Script & The "Trap" Mechanics

  ### Phase 1: Individual Calibration (10-25 mins)
  1.  **Hand out Character Sheets.** Tell them: "For the next 15 minutes, you are not yourself. You are this utility function. Do not argue with the numbers; they are stipulated."
  2.  **Project Lottery X and Y.**
      *   Ask Type 1s: "Calculate EU of X. Calculate EU of Y. Which do you prefer?" (X = 50, Y = 40. Prefer X).
      *   Ask Type 2s: "Calculate EU of X. Calculate EU of Y. Which do you prefer?" (X = -20, Y = 50. Prefer Y).
      *   Ask Type 3s: "Calculate EU of X. Calculate EU of Y. Which do you prefer?" (X = 15, Y = 15. Indifferent).
  3.  **The Lock:** Ask the room: "Did anyone violate the Expected Utility rule? Did anyone say they preferred the option with the lower number?"
      *   *If yes:* Correct them gently. "In this game, rationality *means* maximizing the number. Please adjust."
      *   **Premise 1 Secured:** Individuals are VNM rational maximizers.

  ### Phase 2: The Veil & The Constitution (25-45 mins)
  1.  **The Veil:** "Collect your Character Sheets. Put them in the envelope. You now know there are Type 1s, 2s, and 3s in the room, but you do not know which one *you* are. You are behind the Veil of Ignorance."
  2.  **The Task:** "You must agree on a **Single Rule** to rank Lotteries for the group. This rule must apply to *any* lottery we throw at you."
  3.  **The Constraints (The Trap Doors):**
      *   **Constraint A (Pareto):** "If I show you a lottery where *every* type (1, 2, and 3) gets higher expected utility in Option A than Option B, can your rule say the Group prefers B?" (Force them to say **No**).
      *   **Constraint B (Social VNM):** "Does the Group itself face risk? Yes. Should the Group's choices be consistent? If the Group prefers A to B, and B to C, can it prefer C to A?" (Force them to say **No**). "Does the Group care about how the risk is bundled? (Independence Axiom)." (Most will say **No**, risk is risk).
  4.  **Drafting:** Give them 5 minutes to write a rule on the Worksheet. Common suggestions will be:
      *   "Maximize the average." (Utilitarian)
      *   "Maximize the minimum." (Rawlsian)
      *   "Majority Vote." (Democratic)

  ### Phase 3: The Audit (45-60 mins)
  *This is where you, the facilitator, close the trap. Do not let them debate yet. Just test their rules against the constraints they just agreed to.*

  1.  **Test Majority Vote:**
      *   *Scenario:* Lottery A gives Type 1 & 2 a huge gain, Type 3 a tiny loss. Lottery B is the reverse.
      *   *Audit:* "Majority vote ignores the *intensity* of Type 3's loss. If Type 3's loss is massive (Floor vs Good Chair), Pareto might be violated if the majority overrides a unanimous preference in a compound lottery context." (Keep this high-level; the real killer is Rawls).
  2.  **Test Maximin (Rawls):**
      *   *Scenario:* Lottery A: Everyone gets Normal Chair (Utility 50 for worst-off).
      *   Lottery B: 99% Everyone gets Good Chair (100), 1% Worst-off gets Floor (-100).
      *   *Audit:* "Maximin says choose A. But look at the Expected Utility for the worst-off person in Lottery B. It's (0.99 * 100) + (0.01 * -100) = 98. In Lottery A, it's 50."
      *   *The Kill:* "You agreed in Phase 1 that *individuals* maximize Expected Utility. You agreed in Phase 2 that if *everyone* prefers B to A (because their personal EU is higher), the Group must prefer B to A (Pareto). But Maximin says choose A. **Maximin violates the Pareto principle given VNM individuals.**"
  3.  **The Reveal:**
      *   "Mathematically, there is only one function that satisfies: (1) Individual VNM, (2) Social VNM, and (3) Pareto."
      *   Write on board: **$W = a_1u_1 + a_2u_2 + a_3u_3$**
      *   "It must be a weighted sum of individual utilities."
  4.  **The Weights:**
      *   "You are behind the Veil. You have no reason to weight Type 1 more than Type 2. Symmetry demands $a_1 = a_2 = a_3$."
      *   **Conclusion:** "Your rule is Average Utilitarianism. You built it yourselves."

  ### Phase 4: The Sting (60-75 mins)
  1.  **The Scenario:**
      *   **Option Safe:** Everyone gets Normal Chair. (Total Utils: $5 \times 40 + 5 \times 50 + 4 \times 15 = 510$).
      *   **Option Risky:** 51% Chance Everyone gets Good Chair. 49% Chance **Type 2s get the Floor**, everyone else gets Good Chair.
      *   *Calculation:*
          *   Type 1 EU: $0.51(100) + 0.49(100) = 100$. (Prefers Risky).
          *   Type 3 EU: $0.51(20) + 0.49(20) = 20$. (Prefers Risky).
          *   Type 2 EU: $0.51(60) + 0.49(-100) = 30.6 - 49 = -18.4$. (Prefers Safe, which is 50).
      *   *Wait, check Pareto:* In this specific setup, Type 2 prefers Safe. So Pareto doesn't force Risky.
      *   *Adjustment for the Sting:* We need a case where Pareto *doesn't* apply, but the Social Rule forces the sacrifice.
      *   **Revised Sting:**
          *   **Option Safe:** Everyone gets Normal Chair. (Social Total: 510).
          *   **Option Risky:** 90% Everyone Good Chair. 10% One random person (unknown who) gets Floor.
          *   *Ex-Ante (Veil):* Every individual has a 90% chance of 100/60/20 and 10% chance of 0/-100/10.
          *   Type 1 EU: $0.9(100) + 0.1(0) = 90$. (Better than Safe 40).
          *   Type 2 EU: $0.9(60) + 0.1(-100) = 54 - 10 = 44$. (Better than Safe 50? No, 44 < 50).
          *   *Problem:* Type 2 still objects ex-ante.
      *   **The "Crush" Setup:** Make the gain massive for Types 1 & 3, cost small for Type 2.
          *   **Option Safe:** Everyone Normal.
          *   **Option Exploit:** Type 2 gets Floor (guaranteed). Types 1 & 3 get Good Chair (guaranteed).
          *   *Pareto Check:* Type 2 objects. Pareto blocks this.
          *   *Harsanyi Point:* Harsanyi is about **Ex-Ante** evaluation.
          *   **Final Sting Setup:**
              *   **Lottery A:** 100% Everyone Normal Chair.
              *   **Lottery B:** 99% Everyone Good Chair. 1% **Type 2 gets Floor**, others Good.
              *   *Ex-Ante Calculation for Type 2:* $0.99(60) + 0.01(-100) = 59.4 - 1 = 58.4$.
              *   *Safe Utility for Type 2:* 50.
              *   *Result:* **Everyone** (including Type 2 ex-ante) prefers Lottery B.
              *   *Ex-Post Reality:* If the 1% hits, a Type 2 student actually sits on the floor while everyone else is in the Good Chair.
  2.  **The Question:** "Your rule (Utilitarianism) says choose B. Every individual's EU says choose B. But if the dice roll bad, one of you suffers immensely for the aggregate gain. Do you still endorse the rule?"

  ### Phase 5: Debrief (75-90 mins)
  *   **The Exit Ramps:** Ask them which premise they reject to avoid the Sting.
      1.  **Reject Individual VNM:** "I don't maximize EU; I'm risk-averse." (Cost: You are irrational by standard economic definitions; opens door to paternalism).
      2.  **Reject Social VNM:** "Society shouldn't treat risk like an individual." (Cost: You need a new moral mathematics; often leads back to Prioritarianism or Rawls).
      3.  **Reject Pareto:** "Even if everyone benefits ex-ante, we shouldn't allow ex-post tyranny." (Cost: You override unanimous consent).
      4.  **Reject Impartiality (The Weights):** "Type 2 deserves more weight." (Cost: You need a moral theory to justify the weights, which Harsanyi claimed to derive from rationality alone).

  ---

  ## 4. Predictable Failures & Troubleshooting

  ### Failure 1: The "Inconsistent" Student
  *   **What happens:** A student calculates EU wrong or picks the lower number in Phase 1.
  *   **The Fix:** Do not let the group move on. "Student X, your sheet says 40 vs 50. You picked 40. In this game, that is a 'glitch.' Please update your choice to match your utility function."
  *   **Why:** If individuals aren't VNM rational, Harsanyi's theorem doesn't trigger. You must enforce the "rationality" stipulation rigidly.

  ### Failure 2: The "Rawls" Objection (Early)
  *   **What happens:** In Phase 2 (Veil), a student says: "I won't accept equal probability. The world isn't fair. I should weight the worst-off more."
  *   **The Fix:** **Park it.** "That is a brilliant objection, and it is exactly where we will end up in the debrief. But for the sake of the *theorem*, Harsanyi assumes the Veil implies equal probability. Can we grant that *for the sake of argument* to see where the math leads? Write your objection on the back of the sheet; we will vote on it in Phase 5."
  *   **Why:** If they reject the Veil mechanics early, the game stops. You need them to walk into the trap first.

  ### Failure 3: "Utilities aren't Comparable"
  *   **What happens:** An economist or sharp philosopher says: "Type 1's '100' isn't the same as Type 2's '100'. You can't sum them."
  *   **The Fix:** Acknowledge this is the **biggest caveat**. "You are right. Harsanyi assumes *cardinal unit comparability*. In this game, I stipulated the numbers to make them comparable. In reality, this is the weakest link. If you reject this, the theorem collapses. Add this to the 'Exit Ramps' list."

  ### Failure 4: The Stakes aren't Real
  *   **What happens:** They treat the Chair/Coffee as a joke.
  *   **The Fix:** Bring actual fancy coffee and a visibly better chair. Sit in the bad chair yourself. "I am the Facilitator, I get the Floor. If the Group chooses the Risky Lottery and the 1% hits, *I* sit on the floor. But if you choose the Exploit case, one of *you* does." (Actually, better to make it one of them to raise stakes).
  *   **Revised Fix:** "The person whose character is selected for the 'Floor' outcome has to fetch coffee for the seminar next week." Make it a social cost, not just physical discomfort.

  ---

  ## 5. Honest Caveats (For your opening/closing)

  You must explicitly state these limitations so you aren't accused of sophistry:

  1.  **Stipulated Utilities:** "I gave you the numbers. In the real world, we can't see inside your head. This game assumes a benevolent dictator knows your utilities."
  2.  **Comparability:** "I told you Type 1's '100' equals Type 2's '100'. That is a massive philosophical assumption (Interpersonal Comparison of Utility). Harsanyi needs this; Arrow says it's impossible."
  3.  **Risk Neutrality:** "I forced you to be risk-neutral over utils. If you are risk-averse over utility, the aggregation changes."
  4.  **The "Is-Ought":** "This theorem shows that *if* you want to be rational (VNM) and respectful (Pareto) and impartial (Veil), *then* you must be Utilitarian. It does not prove you *ought* to be rational or impartial."

  ## 6. Instructor Cheat Sheet (The Math)

  Keep this handy for the Audit phase.

  **Harsanyi's Aggregation Theorem:**
  If $V_0$ (Social) and $V_1...V_n$ (Individuals) satisfy VNM axioms over the same set of prospects, and Pareto holds:
  $$V_0(p) = \sum a_i V_i(p) + b$$
  Where $a_i \ge 0$.

  **The Veil Move:**
  If the social evaluator is behind a veil of ignorance where they have probability $1/n$ of being any individual $i$:
  $$V_0(p) = \frac{1}{n} \sum V_i(p)$$
  (This is Average Utilitarianism).

  **The Rawlsian Break:**
  Rawls rejects the VNM axioms for the *Social* choice function (specifically Independence/Indifference to risk distribution) or rejects the equal probability interpretation of the Veil (maximin rule).

  **The Economist's Break:**
  Economists often reject Interpersonal Comparability. If $V_i$ are only ordinal, you can't sum them. (Arrow's Impossibility). Harsanyi bypasses Arrow by assuming cardinality.

  ---

  ## 7. Final Tip for the "Sting"
  When you reveal the Utilitarian result in Phase 4, **pause**. Let the Type 2 students (who have the most to lose in the "Floor" scenario) look at the Type 1 students. Ask the Type 1s: "Knowing your gain relies on Type 2's potential ruin, do you still vote for the rule you just built?"

  This shifts the room from abstract math to moral responsibility, which is where the real seminar begins.
