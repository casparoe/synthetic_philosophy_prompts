      *   **Task:** Diagnose the type of disagreement (verbal, substantive, different questions, empirical, bedrock intuition) using what each side would say about the cases. Then, specify what would count as progress (distinction, reframing, counter-case, etc.).
      *   **Constraint:** Lead with the bottom line in the first sentence. No preamble. Do not restate the question.

  2.  **Deconstruct the Disagreement:**
      *   **Side A ("Genuine Obligations"):** Breaking conventions is *wrong*. Visitors are bound by local rules.
      *   **Side B ("Just Etiquette"):** Breaking conventions is *rude* but not *immoral*. Visitors are bound only by universal norms.
      *   **The Stalemate:** Everyone agrees on facts (e.g., tipping happens in US, not Japan) and agrees rudeness is bad. They disagree on the *label* ("wrong" vs. "rude") and the *scope* (local vs. universal).
      *   **User's Insight:** "Obligation" is doing different work. One side focuses on social coordination/harm (fitting in), the other on fairness/reciprocity (what you owe). The arbitrary vs. reason-tracking distinction is crucial.

  3.  **Diagnose the Type of Disagreement:**
      *   *Is it purely verbal?* Partly. They agree rudeness is bad, but disagree on whether "rudeness" falls under the umbrella of "morality." If Side A defines morality as "norms governing social interaction" and Side B defines it as "norms governing harm/justice," they are talking past each other.
      *   *Is it substantive?* Yes, because the label carries weight. Calling something "immoral" invites blame, sanction, or guilt differently than calling it "rude." It affects how we treat the violator.
      *   *Is it different questions?* Yes. Side A asks "What does social coordination require?" Side B asks "What does justice/fairness require?"
      *   *Hidden Empirical?* Maybe about the *consequences* of breaking the rule. Does not tipping actually harm the waiter (US) vs. just confusing them (Japan)? Does jaywalking at 2am actually risk safety?
      *   *Bedrock Intuition?* Possibly. Some feel the "social contract" is moral; others feel only "harm" is moral.

