prompt: |-
  I'm a novelist, about two-thirds through a book where a scientific commission has to draw a single line across a chart and, just by doing that, decides when a new epoch began. The whole point of the book is that the line is a decision dressed up as a discovery, so I need a properly worked-out case I can steal from — one where the science is solid and the argument still can't be settled by the science.

  So build me a thought experiment to spec. Here's what I need:

  One paragraph of scenario, realistic — real kinds of material, a real kind of international scientific body, no time travel, no invented instruments. The key move: make the boundary marker something that genuinely spreads across the planet over a long stretch of time rather than appearing everywhere at once, so that whichever single place gets picked as the official reference point is what fixes the date, and picking a different place moves the date by a century or more. Hold the evidence fixed and vary only who gets to choose the reference point. Both bodies have to be competent and neither one corrupt or ignorant — the disagreement has to be about what a period boundary is even *for*, not about facts. I don't want you naming the real commission or real dates; keep it self-contained so I can rename everything.

  Then walk it through: for each rival criterion, what date it lands on and why; which feature of the case is doing all the work; what happens if you make the marker instantaneous instead of drawn-out (does the whole disagreement collapse, and if so does that mean the politics was doing the work all along?); and how someone defending the side that comes out looking bad would attack the case — I want the strongest version of that objection, not a strawman. Also say honestly whether the case cheats by building the verdict into the setup, since thats the thing I'm worried about.

  Keep the whole thing under 500 words and end with one sentence naming the single feature that's carrying the load. Casual is fine, don't stand on ceremony.
