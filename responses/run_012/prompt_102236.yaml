prompt: |-
  I'm running a 90-minute session for a upper-level epistemology seminar — 14 students, mostly majors, a couple of grad students — and I want to teach the wrong kind of reasons problem as an activity rather than a lecture. The thing I want them to feel is the specific queasiness of a reason that attaches to an attitude because of what having the attitude does for you, not because the attitude fits its object. I'm especially interested in the graded case: not 'believe p because you'll get paid,' but 'have a credence above some threshold in p because you'll get paid if you do,' and I want the payoff to be verified by a self-report plus a quick confidence check so they can't just lie. I have a projector, index cards, and a bag of poker chips; no real money. No lecture up front — they should run into the problem in the game before it gets named.

  Design a game where they stake credences under a payoff scheme that rewards a credence the evidence doesn't support, and ideally build in the nasty recursive wrinkle where the payoff itself is weak evidence about p — so the pragmatic reason can't be cleanly separated from the epistemic one. Then a debrief that maps the moments onto the object-given/state-given distinction, the fittingness of credences, and the question whether credences can be reasons-responsive at all. The activity should make them feel the pull of 'I have a reason to raise my credence' and then the vertigo of asking whether that reason is the right kind. Tell me what will predictably go wrong the first time — my guess is they'll treat it as a betting game and not notice the attitude/reason mismatch — and be honest about which feature of the problem the game can't reproduce, e.g. the full debate about whether wrong-kind reasons are genuine reasons at all or just reasons for wanting or preferring an attitude.
reasoning: |-
  Here's a thinking process that leads to the suggested activity:

  1.  **Analyze the Request:**
      *   **Context:** 90-minute upper-level epistemology seminar (14 students, mix of undergrad majors and grad students).
      *   **Topic:** The Wrong Kind of Reasons (WKR) problem, specifically applied to credence (degrees of belief).
      *   **Goal:** Students should *feel* the "queasiness" of pragmatic reasons influencing doxastic attitudes, rather than being lectured about it.
      *   **Specific Constraint:** Graded case (credence thresholds), not binary belief. Payoff verified by self-report + confidence check (no lying).
      *   **Resources:** Projector, index cards, poker chips (no real money).
      *   **Structure:** Activity first, then debrief. No initial lecture.
      *   **Key Mechanic:** Payoff scheme rewards a credence the evidence *doesn't* support. Ideally, include a recursive wrinkle where the payoff itself becomes weak evidence about $p$ (blurring pragmatic/epistemic).
      *   **Debrief:** Map to object-given/state-given distinction, fittingness, reasons-responsiveness.
      *   **Prediction:** Acknowledge what will go wrong (students treating it as betting) and what the game *can't* reproduce (the full metaphysical debate about whether WKRs are genuine reasons).

  2.  **Deconstruct the Philosophical Problem:**
      *   *The Wrong Kind of Reasons Problem:* Usually discussed regarding blame/praise or belief. If a demon threatens to kill everyone unless you believe the sky is green, you have a reason to *want* to believe, but does that give you a reason to *believe*?
      *   *Credence Version:* If you get rewarded for having a credence $> 0.8$ in $p$, but your evidence suggests $P(p) = 0.4$, should you adjust your credence?
      *   *The "Queasiness":* It feels like cheating or self-deception. It feels like the reason applies to the *state* (having the belief) rather than the *object* (the truth of $p$).
      *   *The Recursive Wrinkle:* If the reward depends on a mechanism that is correlated with $p$, the incentive becomes evidence. (e.g., "The demon only offers this bribe if $p$ is true"). This makes it hard to disentangle pragmatic vs. epistemic reasons.

  3.  **Designing the Game ("The Credence Auction"):**
      *   *Need:* A way to elicit credences without real money (chips as proxy). A way to make the payoff dependent on the *report* of the credence, not just accuracy.
      *   *Setup:* Divide class into small groups or keep as one big group? 14 students is small enough for one big interaction, but small groups allow more data. Let's go with individual play but public aggregation to create social pressure/evidence.
      *   *The Proposition ($p$):* Needs to be ambiguous but resolvable. A jar of chips? A fact about the room? Let's use a hidden fact about the deck of cards or a jar. Let's go with a **Jar of Chips**. It's tactile.
      *   *Round 1 (Baseline):* Estimate the proportion of Red chips. Evidence is visual/perceptual.
      *   *Round 2 (The Incentive):* Introduce a rule: "If you report a credence $> X$ in 'Majority Red', you get bonus chips."
      *   *The Twist (Recursive):* The instructor knows the truth. The incentive is offered *because* the instructor knows something. Or, make the incentive conditional on a random draw that is correlated with the truth.
      *   *Refining the Twist:* To make the payoff *evidence*, the offer itself must be informative.
          *   *Idea:* "I will pay you bonus chips if you report high confidence in Red. However, I only offer this bonus if the jar actually *is* Majority Red."
          *   *Problem:* If I tell them that, it's just evidence. They should update on the evidence. The WKR problem requires the reason to be *pragmatic* but masquerading or bleeding into epistemic.
          *   *Better Idea:* Keep the incentive purely pragmatic *initially*, then reveal the recursive element in the debrief or a second round.
          *   *Best Idea for "Queasiness":* Make the reward contingent on *sincerity* verification. "I will check if you really believe it." How? By a secondary task.
          *   *Actually, let's stick to the prompt's request:* "Payoff verified by self-report plus a quick confidence check."
          *   *Game Mechanic:* **The Brier Score + Bonus.**
          *   *Truth:* There is a hidden fact (e.g., Is the sum of chips even or odd? Or Red > Blue?). Let's use **Red > Blue**.
          *   *Evidence:* They see the jar for 10 seconds. It's close to 50/50.
          *   *Incentive:* "If you write down a credence $\ge 0.7$ that Red > Blue, you get 5 bonus chips. *However*, if the truth is Blue > Red, you lose 10 chips." (This is just a skewed payoff matrix).
          *   *Wait, the WKR problem isn't about skewed payoffs on accuracy (that's Jamesian/Pragmatic Encroachment).* It's about rewards for the *attitude itself*.
          *   *Correct WKR Mechanic:* "You get 5 chips simply for reporting a credence $\ge 0.7$, regardless of truth. *But* I have a 'Lie Detector'."
          *   *Lie Detector:* A follow-up question where inconsistency costs points. E.g., "Would you bet on this at 0.7 odds?" If they say yes to the credence but no to the bet, they lose points. This forces them to actually *try* to shift their credence to avoid the penalty.
          *   *The Recursive Wrinkle:* "I am offering this bonus because I want the class average to be high. But I only want the class average high if Red is actually dominant." (This is hard to implement mechanically without lying).
          *   *Let's simplify the Recursive Wrinkle:* The Instructor's behavior is the evidence. "I am offering this bonus. Why would I do that? Maybe I know Red is dominant and want you to feel good? Or maybe I know Red is dominant and want to trick you?"
          *   *Actually, the prompt asks for the payoff itself to be weak evidence.*
          *   *Implementation:* "I have drawn a card from a deck. If it's a Heart, I offer the Bonus. If it's not, I don't. *Also*, the Jar composition was determined by a die roll. If the die was 6, Jar is Majority Red. If 1-5, Majority Blue. *Crucially*: I only offer the Bonus if the Die was 6." -> If they know this rule, the Bonus *is* conclusive evidence.
          *   *Adjustment:* "I offer the Bonus if the Die was 5 or 6." Now it's probabilistic evidence.
          *   *Wait, if it's evidence, then raising credence is the Right Kind of Reason.* The WKR problem arises when the reason is *not* evidence.
          *   *Okay, re-reading prompt:* "ideally build in the nasty recursive wrinkle where the payoff itself is weak evidence about p — so the pragmatic reason can't be cleanly separated from the epistemic one."
          *   *Ah, the goal is to make it *messy*.* If the payoff is *purely* pragmatic, it's easy to dismiss ("That's not evidence"). If the payoff is *also* evidence, it's hard to tell *why* you are updating. That creates the vertigo.
          *   *So:* The incentive exists *only* if $p$ is likely true, but not certainly.
          *   *Setup:*
              1.  Hidden Fact $p$: "The hidden chip is Red." (Prior 50%).
              2.  Evidence $E$: You see a glimpse. (Likelihood ratio 1:1, so still 50%).
              3.  Incentive $I$: "Report credence $> 0.8$ to get points."
              4.  Recursive Link: The Instructor flips a coin. Heads: Incentive offered. Tails: No incentive. *But*, the Instructor looks at the Hidden Chip first. If Red, they *always* offer Incentive. If Blue, they flip the coin.
              5.  Result: If Incentive is offered, $P(Red | Incentive) > 0.5$.
              6.  The Conflict: Do I raise my credence because I want the points (WKR) or because the offer tells me it's likely Red (RKR)?

  4.  **Drafting the Activity Steps:**
      *   **Prep:** Two jars or decks. One hidden truth.
      *   **Phase 1 (Baseline):** Establish priors.
      *   **Phase 2 (The Squeeze):** Introduce the incentive structure.
      *   **Phase 3 (The Verification):** The "Lie Detector" (betting consistency) to prevent cheap talk.
      *   **Phase 4 (The Twist):** Reveal the correlation between Incentive and Truth.
      *   **Debrief:** Connect feelings to WKR literature (Shah, Velleman, Hieronymi).

  5.  **Addressing "What will go wrong":**
      *   Students will game the system. They will report 0.99 to get points, knowing they don't believe it.
      *   *Counter-measure:* The "Consistency Check." If they report 0.9 credence, they must accept a bet at 0.9 odds. If they refuse, they lose the bonus. This forces *doxastic voluntarism* attempt. They have to *try* to believe.
      *   *Failure mode:* They will realize they can't just decide to believe. This is actually *good* for the lesson (involuntarism of belief).
      *   *Another failure mode:* They treat it as pure betting (Decision Theory) rather than Epistemology.
      *   *Correction:* Emphasize in instructions that points reward *accuracy of self-report*, not just betting wins. (Use a Brier Score logic).

  6.  **Addressing "What the game can't reproduce":**
      *   Real money vs. chips (stakes).
      *   The metaphysical status of reasons (are WKRs *reasons*?). The game shows the *phenomenology*, not the metaphysics.
      *   Long-term belief vs. temporary credence.

  7.  **Refining the "Recursive Wrinkle":**
      *   Let's make it simpler.
      *   Truth: Card is Red or Black.
      *   Evidence: None (50/50).
      *   Incentive: "If you report $> 0.7$ credence in Red, you get 10 chips."
      *   Wrinkle: "I generated this incentive by rolling a die. If the Card was Red, I rolled a 4-sided die (1 = Incentive). If Card was Black, I rolled a 20-sided die (1 = Incentive)."
      *   Math: $P(Incentive | Red) = 0.25$. $P(Incentive | Black) = 0.05$.
      *   Bayes: $P(Red | Incentive) = \frac{0.25 \times 0.5}{0.25 \times 0.5 + 0.05 \times 0.5} = \frac{0.125}{0.15} \approx 0.83$.
      *   *Perfect.* The incentive *itself* justifies a credence of 0.83.
      *   *The Trap:* Students might think "I should report 0.83 to get the points" (Pragmatic) vs "I should believe 0.83 because the offer is evidence" (Epistemic). The feeling of "I'm doing this for the points" vs "I'm doing this because it's rational" gets blurred.

  8.  **Structuring the 90 Minutes:**
      *   0-10: Setup & Baseline (No incentive).
      *   10-30: The Incentive Game (Rounds 1-3).
      *   30-45: The Reveal (The Correlation).
      *   45-90: Debrief & Discussion.

  9.  **Materials:**
      *   Index cards (for secret reporting).
      *   Poker chips (currency).
      *   Projector (for rules/calculations).
      *   Deck of cards / Opaque bag.

  10. **Refining the "Verification" (Crucial Step):**
      *   Prompt says: "payoff to be verified by a self-report plus a quick confidence check so they can't just lie."
      *   Mechanism: **The Betting Commitment.**
      *   If you report Credence $C$, you *must* accept a bet at odds $C:(1-C)$ on $p$.
      *   If you decline the bet, you are flagged as insincere and lose the bonus.
      *   This forces them to confront: "Can I actually bring myself to accept this bet?" If they can't, they can't claim the bonus. This simulates the *involuntarism* of belief.

  11. **Final Review against Constraints:**
      *   90 mins? Yes.
      *   14 students? Yes, manageable.
      *   No lecture up front? Yes.
      *   Graded case? Yes (credence 0-1).
      *   Recursive wrinkle? Yes (Incentive correlates with Truth).
      *   Predictable failures? Addressed.
      *   Limitations? Addressed.

  12. **Writing the Plan:** (Self-Correction during drafting)
      *   *Warning:* The Bayesian calculation in the "Wrinkle" might be too math-heavy for the *feeling*. Keep the math for the debrief. In the game, just tell them "The offer is slightly more likely if Red."
      *   *Warning:* If they realize the offer is evidence, the WKR disappears. It becomes RKR.
      *   *Fix:* Don't tell them the correlation until *after* they play a round where they feel the pull of the points.
      *   *Revised Flow:*
          1.  Round 1: Pure Evidence (Jar). Report Credence.
          2.  Round 2: Evidence + **Pure** Pragmatic Incentive ("Get points for high credence in Red"). *This is the WKR moment.* They feel the pull to lie/adjust.
          3.  Round 3: Evidence + **Correlated** Incentive ("I only offer this if Red is likely"). *This is the Vertigo moment.*
          4.  Debrief.

      *   *Wait, one more check:* The prompt says "build in the nasty recursive wrinkle... so the pragmatic reason can't be cleanly separated."
      *   If I do Round 2 (Pure WKR) then Round 3 (Mixed), they see the difference.
      *   Better: Do the Mixed version immediately, but hide the correlation mechanism. Let them feel the confusion. Then reveal the mechanism.
      *   *Actually, let's follow the prompt's intuition:* "Run into the problem in the game before it gets named."
      *   Okay, Round 1: Standard estimation.
      *   Round 2: "New Rule: High credence in Red gets bonus." (Don't explain the correlation yet).
      *   *Wait, if I don't explain the correlation, it's just a WKR.*
      *   *Okay, I need the correlation to be known but messy.*
      *   *Decision:* I will design the game so the incentive is *explicitly* tied to the truth probabilistically, but the *magnitude* of the points tempts them to over-update.
      *   *Actually, the cleanest way to get the "queasiness" is to have the incentive be purely pragmatic, but the verification mechanism (the bet) makes them feel like they are corrupting their own mind.*
      *   *Let's pivot:* The "Recursive Wrinkle" is hard to make feel like a WKR. If it's evidence, it's a RKR. The WKR problem is specifically about reasons that are *not* evidence.
      *   *Re-reading prompt:* "ideally build in the nasty recursive wrinkle where the payoff itself is weak evidence about p — so the pragmatic reason can't be cleanly separated from the epistemic one."
      *   Okay, the prompt *wants* the blur. The philosophical point is that when pragmatic and epistemic reasons bleed, it's hard to isolate the WKR.
      *   So: The incentive is offered *more often* when $p$ is true.
      *   Students know this rule.
      *   They have a reason to believe $p$ (evidence).
      *   They have a reason to report belief in $p$ (points).
      *   The queasiness comes from not knowing how much of their confidence is due to the points vs. the evidence.
      *   *Okay, I have the plan.*

  13. **Final Polish:** Check timing. 14 students means 7 pairs or individual. Individual is better for credence.
      *   Make sure the "Lie Detector" (betting) is clear.
      *   Make sure the debrief questions are sharp.
      *   Add the "Predictable Failures" section clearly.

  14. **Wait, one constraint:** "No real money." Chips need to mean something. "Bragging rights" or "Choose the reading topic" or "Extra credit" (if allowed). Let's assume "Course Credit/Participation Points" or just "Winner gets to choose next week's topic." I'll suggest "Participation Points" as it's standard.

  15. **Wait, another constraint:** "Payoff verified by self-report plus a quick confidence check."
      *   My "Betting Commitment" idea fits this perfectly. If you report 0.8, you must bet at 4:1 odds.

  16. **Let's write it.**
answer: |-
  Here is a 90-minute seminar plan designed to induce the phenomenology of the Wrong Kind of Reasons (WKR) problem through gameplay, followed by a structured debrief.

  ## Activity Title: The Credence Auction

  **Time:** 90 Minutes
  **Participants:** 14 Students (Individual play, aggregated on projector)
  **Materials:** Projector, Deck of Cards (or two opaque jars with colored chips), Index Cards (2 per student), Poker Chips (approx. 20 per student), Whiteboard.
  **Currency:** Poker chips redeemable for participation points (or "bragging rights"/choice of next topic).

  ---

  ### Part 1: The Setup (0:00 – 0:10)
  **No Lecture.** Walk in and deal 20 chips to each student. Project a simple rule set.

  **The Truth ($p$):**
  Place a single card face down on the desk (or a chip in an opaque bag). Tell them: *"This card is either Red or Black. The prior probability is 50/50. I know the color; you do not."*

  **The Task:**
  On an index card, each student must write:
  1.  Their Name.
  2.  Their Credence ($C$) that the card is **Red** (a number between 0.00 and 1.00).
  3.  Their Signature (committing to the number).

  **The Scoring (Round 1):**
  Project this: *"At the end of class, I will reveal the card. Your score is calculated by a Brier Score penalty. You lose chips equal to $(Truth - C)^2 \times 10$."*
  *   (If Red, Truth=1. If Black, Truth=0).
  *   *Example:* If Card is Red and you wrote 0.8, you lose $(1 - 0.8)^2 \times 10 = 0.4$ chips.
  *   *Example:* If Card is Red and you wrote 0.2, you lose $(1 - 0.2)^2 \times 10 = 6.4$ chips.
  *   **Goal:** Minimize chip loss. (This incentivizes honest credence reporting).

  **Action:** Collect cards. Do not reveal the truth yet. Set aside.

  ---

  ### Part 2: The Incentive & The Squeeze (0:10 – 0:35)
  **Round 2: The Pragmatic Pull**
  Tell them you are drawing a second card from a fresh deck. This is a new $p$ (Red/Black). 50/50 prior. No evidence provided.

  **New Rule:** *"For this round, there is a Bonus. If you report a Credence $\ge 0.75$ in Red, you immediately receive 5 chips. **However**, there is a Consistency Check."*

  **The Consistency Check (The "Lie Detector"):**
  *"If you report $C \ge 0.75$, I will immediately offer you a bet based on that credence. If you report 0.80, you must accept a bet where you win 4 chips if Red, lose 1 chip if Black (4:1 odds). If you hesitate or decline the bet, you are flagged as 'Insincere,' you lose the 5 chip bonus, AND you pay a 5 chip penalty."*

  **Why this matters:** This prevents them from simply *saying* 0.8 to get the points while *believing* 0.5. To get the points, they must actually *bring themselves* to accept the bet. They must try to manipulate their own doxastic state to match the incentive.

  **Action:**
  1.  Students write new Credence on Index Card.
  2.  Collect cards.
  3.  **Publicly call out** anyone who reported $\ge 0.75$.
  4.  Ask them: *"Do you accept the corresponding bet?"* (Most will say yes to get the bonus).
  5.  Award the 5 chips immediately to those who commit.

  **Round 3: The Recursive Wrinkle**
  Tell them: *"We are doing one more round. Same card draw (50/50 prior). Same Bonus (5 chips for $C \ge 0.75$). Same Consistency Check."*

  **The Twist (Project this Rule):**
  *"The Bonus is not offered randomly. I roll a die to decide if I offer the Bonus.*
  *   *If the Card is **Red**: I roll a 4-sided die. If I roll 1, I offer the Bonus.* ($P(Bonus|Red) = 0.25$)
  *   *If the Card is **Black**: I roll a 20-sided die. If I roll 1, I offer the Bonus.* ($P(Bonus|Black) = 0.05$)
  *   *You know this rule. The Bonus has been offered."*

  **The Trap:**
  Mathematically, the offer of the Bonus is *evidence* that the card is Red.
  Bayes' Theorem: $P(Red|Bonus) \approx 0.83$.
  So, a credence of 0.83 is now **epistemically justified** (Right Kind of Reason).
  *But*, the 5 chip payoff is still attached to reporting that credence (Wrong Kind of Reason).

  **Action:**
  1.  Students write Credence.
  2.  Collect cards.
  3.  Do not reveal the card yet.

  ---

  ### Part 3: The Debrief (0:35 – 1:30)
  **Step 1: The Reveal (5 mins)**
  Reveal the cards for all rounds. Tally chip winnings. Ask for a show of hands:
  *   "Who felt uncomfortable raising their credence in Round 2?"
  *   "Who felt confused about *why* they raised their credence in Round 3?"

  **Step 2: Mapping the Queasiness (25 mins)**
  Draw three columns on the board: **Round 1**, **Round 2**, **Round 3**.

  **Discussion Questions (Guide, don't lecture):**
  1.  **Round 2 (Pure WKR):** "In Round 2, the evidence was 50/50. The reward was for high credence. Did anyone actually *change* their belief, or did you just change your number? If you changed the number but not the belief, did you lie? If you tried to change the belief, how did you do that?"
      *   *Target Concept:* Doxastic Involuntarism. The feeling that you can't believe at will. The reason (points) applies to the *state* (having the belief), not the *object* (the card).
  2.  **Round 3 (The Blur):** "In Round 3, the bonus offer was itself evidence. You had a reason to believe (the dice rule) AND a reason to report belief (the chips). Did these feel different? Or did they melt together?"
      *   *Target Concept:* The difficulty of isolating the WKR when it correlates with RKR (Right Kind of Reasons). The "Vertigo."
  3.  **The Consistency Check:** "Why did the betting requirement make you uneasy? If belief is just a disposition to bet, why did it feel like corruption?"
      *   *Target Concept:* The nature of credence. Is it just betting behavior (Ramsey/De Finetti) or a mind-to-world fit (Anscombe/Searle)?

  **Step 3: Philosophical Mapping (20 mins)**
  Now introduce the terminology.
  *   **Object-Given vs. State-Given Reasons:**
      *   *Object-Given:* Reasons that bear on the truth of $p$ (The dice rule in Round 3).
      *   *State-Given:* Reasons that bear on the goodness of *believing* $p$ (The 5 chips in Round 2 & 3).
  *   **The WKR Problem:** If State-Given reasons can't make a belief rational, why did Round 3 feel so messy?
  *   **Fittingness:** Is a credence of 0.83 "fitting" in Round 3? Yes, epistemically. Is it "fitting" pragmatically? Yes. Does the pragmatic fittingness contaminate the epistemic fittingness?

  **Step 4: The "Genuine Reason" Debate (15 mins)**
  Ask the Grad Students to lead this:
  *   "Are the chips a *reason to believe*? Or just a *reason to want to believe*?"
  *   "If I successfully manipulate my brain to believe Red for the chips, is my belief rational?"
  *   Connect to **Shah & Velleman** (transparency of belief) vs. **Hieronymi** (reasons for judgment).

  **Step 5: Closing (5 mins)**
  Summarize: The game showed that while we can distinguish the reasons theoretically, phenomenologically they bleed. The "queasiness" is the friction between the aim of belief (truth) and the aim of the agent (welfare).

  ---

  ### Predictable Failures & Mitigation

  **1. The "Gaming" Failure (Most Likely)**
  *   **What happens:** Students treat Round 2 as a lying game. They write 0.99, take the 5 chips, and plan to decline the bet or accept the penalty if called.
  *   **Why:** They view it as Decision Theory, not Epistemology.
  *   **Mitigation:** The Consistency Check must be immediate and public. If they decline the bet, they lose the bonus *and* pay a penalty *in front of the class*. The social cost + chip loss usually forces them to attempt sincerity.
  *   **Teaching Moment:** If they admit to lying, use it. "You had a reason to *report*, but not a reason to *believe*. This proves the WKR distinction exists."

  **2. The "Math Distraction" Failure**
  *   **What happens:** In Round 3, students get bogged down calculating the Bayesian update and miss the pragmatic pressure.
  *   **Mitigation:** Keep the math on the screen. Remind them: "You know the math says 0.83. But you also know you get chips for saying 0.83. Does the chip reward make you trust the math more, or does it make you suspicious of your own motivation?"

  **3. The "Involuntarism" Wall**
  *   **What happens:** Students say "I can't change my credence even if I want the chips."
  *   **Mitigation:** This is actually a **success** for the lesson. It demonstrates that belief is not directly will-responsive. The "queasiness" comes from the *attempt* to force it. Ask: "If you can't believe for reasons of welfare, does that mean welfare reasons aren't reasons for belief?"

  ---

  ### What This Game Cannot Reproduce (Honesty Check)

  Be prepared to admit these limitations in the debrief:

  1.  **The Metaphysical Status of Reasons:** The game creates a *feeling* of conflict, but it cannot resolve whether WKRs are *genuine* normative reasons. Some philosophers (e.g., Parfit) argue WKRs are not reasons for the attitude at all, but reasons to *want* the attitude. The game makes them feel like reasons for the attitude, which might be a phenomenological illusion.
  2.  **Long-term Doxastic Stability:** In the game, the credence is temporary. Real WKR problems (e.g., Pascal's Wager, self-fulfilling prophecies in relationships) involve sustaining a belief over time. The "queasiness" might fade if the belief becomes habitual.
  3.  **Real Stakes:** Poker chips for participation points are weak proxies for "eternal salvation" or "survival." The pragmatic pull is weaker than in classic philosophical examples, which might dampen the vertigo.
  4.  **The "New Evil Demon" Intuition:** The game relies on the students trusting *you* (the instructor). If they suspect you are manipulating the dice rules, the epistemic reason collapses. In real WKR cases, the pragmatic reason often exists independently of the instructor's honesty.

  ### Instructor Prep Notes
  *   **Test the Math:** Ensure the Bayesian update in Round 3 yields a number $> 0.75$ so the pragmatic and epistemic thresholds align. (The 4-sided vs 20-sided die example above yields $\approx 0.83$, which works).
  *   **Chip Management:** Have a central "Bank." Keep the pace fast.
  *   **Grad Students:** Briefly pull the grad students aside 5 minutes before class. Tell them: "If the undergrads get stuck on the game mechanics, help them. But in the debrief, I want you to push the 'Genuine Reason' debate hard."
