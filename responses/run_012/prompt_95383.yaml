  3.  **Address the Specific Questions:**

      *   *Created or Exposed?* The cap created the *price disparity* (the windfall). However, it exposed the *moral conflict* between property rights and social need. Without the cap, the rent would always be market rate, and the mother wouldn't be an option. So the cap created the *possibility* of the choice, but exposed the landlord's *values*.
      *   *Brother's Proposal:* Charging market rent + gifting the difference. This separates *price* from *subsidy*. It makes the charity explicit. It dissolves the *economic confusion* (the asset yields its return) but relocates the *moral difficulty* (who gets the gift? why her and not the others?). It turns a housing decision into a welfare decision.
      *   *Economic Case Against Caps:* Economics says caps cause shortages. But the user didn't make the rule. The economic case suggests the user is facing a distorted market. It doesn't dictate morality, but it highlights that the "windfall" is artificial.
