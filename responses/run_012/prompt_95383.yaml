          2.  Partner: Charge affordable rent. A home is not just an asset. Windfall due to unfair rules/previous tenant's contribution.
          3.  Departing Tenant's Daughter: Father maintained the flat, rent paid off mortgage. Moral obligation to someone like him (i.e., the mother).
      *   **Specific Questions to Address:**
          1.  Is this choice a problem the cap created or merely exposed?
          2.  Does the brother's proposal (charge market + gift) dissolve or relocate the difficulty?
          3.  Does the economic case against caps help decide what to do *under* a cap one didn't make?
          4.  What weight should be given to claims of people not in the room (rejected applicants, future needy tenants)?
          5.  Acknowledge the entanglement of price and tenant selection.
      *   **Constraint:** "Tell me what you would do, and why." (Requires a recommendation, not just analysis).
      *   **Style:** British English. No reading list/citations. Name ideas if they have names. Not a general essay on housing.

  2.  **Deconstruct the Ethical and Economic Landscape:**
      *   *Rent Control Economics:* Economists generally dislike vacancy decontrol (lifting caps when tenants leave) because it creates disincentives to let, encourages eviction, and creates inequity between insiders (old tenants) and outsiders (new tenants). This situation is a classic example of the "insider-outsider" problem created by the policy.
      *   *The Brother's View (Libertarian/Market):* Separates the economic transaction from the moral impulse. Efficiency + Charity.
      *   *The Partner's View (Communitarian/Humanist):* Housing as use-value vs. exchange-value. Contextual justice (windfall).
