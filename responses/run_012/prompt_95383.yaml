answer: |-
  You are facing a decision that is ostensibly about price, but is fundamentally about identity. You are asking whether you are a capitalist maximising an asset, a steward of a home, or a patron of a family member. The rent cap is the catalyst, but the reaction is yours.

  Here is an analysis of the specific questions you posed, followed by what I would do.

  ### Created or Exposed?
  The rent cap **created** the financial disparity, but it **exposed** the moral conflict. Without the cap, the market rent would be the only rent; the single mother would not be an option, and the dilemma would not exist. You would simply be a landlord seeking a tenant at market rate. The policy created a 'windfall gain'—an unearned increase in value arising from regulatory change rather than your improvement of the asset. However, the cap exposed your own conception of property rights. It forces you to choose between the *exchange-value* of the flat (what it can be sold or let for) and its *use-value* (what utility it provides to a specific human being). The tension between these two values exists in all property, but the cap has widened the gap until it is unignorable.

  ### The Brother's Proposal
  Your brother suggests separating the economic transaction from the moral impulse. In economics, this is an attempt to restore **allocative efficiency** while allowing for **redistributive justice**. He argues that by charging market rent, you respect the signal of the market, and by gifting the difference, you exercise personal charity.

  This does not dissolve the difficulty; it **relocates** it. It transforms the relationship from landlord-and-tenant to benefactor-and-dependent. A subsidised rent is a contractual right; a monthly gift is a revocable privilege. If you gift the difference, you hold the power to stop the gift if she annoys you, if her hours are cut, or if you need the cash. This creates a **power asymmetry** that a lower rent does not. Furthermore, your brother is correct that subsidising one is a decision not to subsidise the others, but his framing assumes the starting point should be market rate. It assumes the windfall belongs to you by default. If the windfall is arguably ill-gotten (as your partner suggests), then giving some of it back is not charity; it is restitution.

  ### The Economic Case
  The economic case against rent caps is that they distort supply and create shortages. However, economics is a study of systems, not a guide to individual morality within a broken system. The fact that the market is distorted does not oblige you to exploit the distortion, nor does it oblige you to correct it single-handedly. However, the economic reality tells you this: by letting below market rate, you are effectively providing a public good (affordable housing) that the state has failed to supply. The economic case warns that if everyone acted as your brother suggests, housing would become unaffordable for workers like the mother. It does not tell you what *you* should do, but it clarifies the consequence of your choice: you are either reinforcing the scarcity or mitigating it.

  ### The People Not in the Room
  This invokes Frédéric Bastiat's concept of **the seen and the unseen**. The seen is the tenant you choose. The unseen is the couple you reject, or the future tenant who might need the flat.
  *   **The rejected applicants:** The professional couple has a weaker claim because they are not priced out of the market; they can live elsewhere. Their loss is convenience; the mother's loss is housing security.
  *   **The future tenant:** This is a diffuse claim. You cannot house the city. You have one flat. Prioritising a specific, present human need over a hypothetical future one is morally permissible. To hold the flat vacant or charge prohibitive rent in hopes of a 'better' future tenant is a form of moral procrastination.

  ### The Entanglement of Price and Person
  You are right that you cannot separate the two. Price is a **screening mechanism**. By setting the price at the market rate, you are selecting for wealth. By setting it at the capped rate, you are selecting for need (or specifically, this mother's need). To pretend price is neutral is to ignore that it dictates who is allowed to enter the space. The entanglement is not an accident; it is the function of the market.

  ### What I Would Do

  If I were in your position, I would let the flat to the **single mother at the old, capped rent.**

  Here is the reasoning, weighing the ideas above:

  1.  **Rejection of the Windfall:** Your partner and the departing tenant's daughter are correct about the origin of your equity. The mortgage was paid off by rents that were artificially suppressed for eleven years. You benefited from the tenant's stability and the state's protection of that tenancy. To suddenly switch to full market extraction the moment that protection lapses is to claim a windfall generated by a system you admit you do not fully support. It treats the previous eleven years as a mere prelude to profit, rather than a partnership that secured the asset.
  2.  **Use-Value over Exchange-Value:** The professional couple views the flat as a commodity; they can afford another. The mother views it as a home; she cannot easily find another. In a housing crisis, prioritising **use-value** (shelter for a worker) over **exchange-value** (maximum yield) is a defensible ethical stance. It acknowledges that housing is a social good, not merely a financial instrument.
  3.  **Avoiding Patronage:** I would reject your brother's plan to charge market rent and gift the difference. As noted, this makes her housing contingent on your ongoing goodwill. A lease at a lower rent is a contract; it gives her dignity and security. It avoids the **moral hazard** of making her a charity case.
  4.  **Fairness regarding the Nephew:** I would reject the nephew. While familial obligation is real, favouring him over the mother introduces **nepotism** into a situation where you have a chance to do social good. Furthermore, his erratic ability to pay introduces financial risk that could jeopardise the asset, potentially forcing you to sell or evict him later, which would damage family relations more than refusing him now.
  5.  **Stewardship:** By letting to the mother, you are effectively continuing the ethos of the previous tenancy. You are acknowledging that the flat has served as a secure home for a long period, and that breaking that chain for maximum profit feels like a betrayal of the asset's history.

  **The Conclusion:**
  You are not responsible for the city's housing policy, but you are responsible for how you operate within it. The cap created a distortion that handed you a potential profit. You can keep it, or you can decline it. Keeping it makes you a rational market actor. Declining it makes you a moral agent.

  I would choose to be a moral agent. I would let to the mother at the capped rent. I would document this clearly in the tenancy agreement so there is no confusion about the rent being a fixed figure, not a discretionary gift. I would accept that I am forgoing income, but I would view that forgone income not as a loss, but as the cost of aligning my actions with the conviction that the windfall was never entirely mine to keep.

  This choice does not solve the housing crisis. It does not help the unseen future tenant. But it resolves the immediate tension in your room by honouring the history of the flat, supporting an essential worker, and refusing to treat the home purely as an extraction machine. It accepts that price and person are linked, and chooses the person who needs the place to be a home.
