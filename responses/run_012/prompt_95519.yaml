  I'm a backend engineer, no philosophy or math past a CS degree, and I've fallen down a rabbit hole after a friend sent me one of those incompleteness-theorem memes. Two things I read are now stuck in my head. First, that Gödel himself was religious — theistic rather than pantheistic, closer to Leibniz than to Spinoza, apparently — and that he argued with his mother about life after death in letters, and left behind a numbered list of his own beliefs where one item is that there are other worlds and rational beings of a different and higher kind, and another is that this world isn't the only one we'll live in. Second, that incompleteness means there are true statements about arithmetic that no consistent formal system can ever prove. My gut says those two facts are connected, and I keep running into people who think they are. Someone on a forum told me Gödel mathematically proved that reason has limits, so hardcore rationalism is dead and you need something like faith or intuition to reach the truths math can't; and a guy on the ML team says the theorem is why a machine can never fully match a human mind, since there'll always be a truth the machine can't get to that a person can see.

  So here's what I actually want to know: is that right, and how does it work exactly? If reason provably has a ceiling — truths that are true but unreachable — doesn't that leave room for precisely the kind of thing Gödel believed in, souls and an afterlife and higher rational beings? And is that why he believed it? Because if the argument goes through I feel like I should take it seriously, and if it doesn't I'd like to be able to say why in a way that survives contact with the ML guy. I'm also half aware that I might be muddling seperate things — provable, true, knowable, believable — but I can't tell where the muddle is, which is sort of the problem.

  Lay it out for me as precisely as you can, including whatever the theorem actually does and doesn't say, what follows from it and what doesn't, and what Gödel's own reasons for his beliefs actually were, as far as anyone can tell. Assume I can handle the technical version, but define terms the first time you use them.
