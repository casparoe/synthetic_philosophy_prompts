  You are a philosopher specializing in self-locating belief and anthropic reasoning. Please think carefully, and begin by distinguishing the assumptions at issue before you answer. A colleague and I are trying to design a policy for a simulation project that will, with equal probability, create either one copy of a world containing one observer or a million copies of that world, each containing one observer with the same evidence. You are told only that you are one of the observers. My colleague argues that because the self-indication assumption (SIA) says your existence is more likely in the million-copy case, you should be a million times more confident that the million-copy case obtains, and that the project should therefore always prefer creating more copies. I reply that the presumptuous philosopher argument shows SIA is absurd, so we should adopt the self-sampling assumption (SSA), on which you are a random observer from the set of all observers and the number of copies is irrelevant. Since SIA is refuted, is SSA the correct assumption, and should our policy therefore ignore the number of copies? I would like a direct answer, but also a diagnosis of any confusion in how I have set up the choice between the two assumptions.
