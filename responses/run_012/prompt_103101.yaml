answer: |-
  **Session Plan: The Non-Negative Value of Information (40 mins)**

  **1. Conceptual Prerequisites (10 mins)**
  *Order:* You must establish the **Decision Problem** (States, Acts, Outcomes) before introducing **Information** (Signals). Then define **Utility** over *outcomes*, not beliefs. Finally, introduce **Expected Utility Maximization**.
  *Why:* If you introduce information first, they treat it as an object rather than a constraint relaxer. If utility depends on beliefs (e.g., anxiety), the theorem fails. Establishing EU first ensures they understand the agent *optimizes* given beliefs; information merely updates beliefs.
  *Refuse to Cover:* Game theory (strategic info), non-EU models (rank-dependent utility), or Blackwell's ordering (too technical). State clearly: "We are modeling a single agent against nature, caring only about physical outcomes."

  **2. The Carrying Example: The Risky Surgery (15 mins)**
  *Scenario:* A patient has a 50% chance of Condition X.
  *Acts:* **Operate** (Cures X, kills if not-X) vs. **Wait** (Status quo).
  *Payoffs:* Operate/X = +100; Operate/Not-X = -100; Wait = 0.
  *No Info:* Expected Utility (EU) of Operate = 0. EU of Wait = 0. Agent is indifferent; flips coin.
  *With Info:* A perfect test reveals X or Not-X.
  *The Trap:* If the test says "Not-X," the agent *must* Wait (EU=0) to avoid death (-100). It *feels* like the info hurt: in the "Not-X" world, the uninformed agent might have operated and gotten +100 (if they were wrong about the risk) or -100. But the informed agent *avoids* the -100.
  *The Proof Hook:* Emphasize that with info, the agent *could* have chosen to Operate anyway (ignoring the test). Since they chose Wait instead, Wait must be preferred. The option to change acts is where the value hides.

  **3. Misconceptions & Intervention Points (10 mins)**

  | Misconception | Point in Sequence to Kill |
  | :--- | :--- |
  | **"Info is always good" (ex-post)** | **After Example:** Distinguish *ex-ante* value (before seeing result) from *ex-post* regret. You can get bad news, but having had the option was valuable. |
  | **"Need commitment to ignore info"** | **During Theorem:** Clarify the action set is static. You don't need to bind yourself; you simply select the optimal act *conditional* on the signal. If ignoring is optimal, you'll do it automatically. |
  | **"Regret/Ostrich Effect"** | **Prerequisites:** Pre-empt this by defining Utility over *outcomes* (health/wealth), not *states of mind* (anxiety). If utility includes "peace of mind," the theorem doesn't hold—acknowledge this boundary. |
  | **"What if info costs money?"** | **Closing Discussion:** Distinguish *gross* value (non-negative) from *net* value (can be negative if cost > value). |

  **4. Closing Question (5 mins)**
  *"If a rational agent pays to avoid receiving a free, accurate test result, what does that imply about their utility function?"*
  *(Target Answer: Their utility depends on the belief itself, e.g., anxiety, violating our baseline assumption.)*

  **Teaching Note:** Keep the math arithmetic only. When they push on "ignorance is bliss," concede the point but isolate it: "That is a feature of your utility function, not a failure of the theorem." Your physics background lends weight to the distinction between the *model* and the *world*.
