answer: |-
  ### 1. The Carrying Example: Evaluation and Recommendation

  **Do not use the Insurance/Gamble case.**
  While intuitively compelling for highlighting tension between descriptive and normative readings, this case smuggles in **Expected Utility Theory (vNM)** before you have secured **Ordinal Utility Theory (Hicks/Samuelson)**.
  *   **The Problem:** It conflates preferences over *outcomes* with preferences over *lotteries*. To explain why insuring and gambling isn't necessarily inconsistent, you must introduce risk attitudes (concave/convex utility functions). This shifts the debate from "What is a preference?" to "How do agents weight probabilities?"
  *   **The Cost:** You will spend 40 minutes defending the independence axiom rather than the revealed preference identity. It drags in complications that belong in the second hour of a two-part series.

  **Be wary of the Shopper/Budget Constraint case.**
  *   **The Problem:** As you suspect, the standard diagram (indifference curves tangent to a budget line) quietly presupposes the existence of the mental state (the curve) that the theory claims to derive. It encourages the view that the budget constraint is the only external factor, while the preference ordering is an internal, pre-existing ghost in the machine.
  *   **The Fix:** If you use this, you must strip the diagram. Present only **Price Vectors and Chosen Bundles**. Do not draw the curves until the end.

  **Recommendation: The "Three-Bundle Cycle" (Money Pump Structure).**
  Use a minimal sequence of binary choices over three states (A, B, C) that violates transitivity.
  *   **Why:** It isolates the **consistency condition** as the load-bearing wall. It forces the group to confront the ontological question directly: If an agent chooses A > B, B > C, and C > A, do they have *irrational* preferences, or do they *lack* a preference ordering entirely?
  *   **What it must have:** Observable choices only. No mention of "satisfaction," "desire," or "mental states."
  *   **What it must lack:** Risk, time, strategic interaction, or budget constraints. Pure choice data.

  ---

  ### 2. The Teaching Sequence (75 Minutes)

  **Logical Dependency:** You cannot discuss what choice *reveals* until you distinguish between the **Psychological Concept** (cause of action) and the **Formal Concept** (ordering relation). The sequence must establish that RPT is a **representation theorem**, not a psychological hypothesis.

  **00:00 – 00:10: The Ontological Bracket**
  *   **Action:** Pre-empt the "Are preferences real?" faction.
  *   **Move:** Explicitly distinguish *Mentalism* (preferences cause choices) from *Behaviorism* (preferences are summaries of choices).
  *   **Instruction:** Tell the group: "For this hour, we are not asking what preferences *are* in the mind. We are asking what conditions choice data must satisfy to be *representable* as a utility function. We are bracketing ontology to test logical sufficiency."
  *   **Goal:** Prevent the session from devolving into philosophy of mind.

  **00:10 – 00:30: The Machinery (Axioms as Constitutive)**
  *   **Action:** Introduce the Three-Bundle Cycle.
  *   **Move:** Show that without Transitivity (and WARP), no utility function can be constructed.
  *   **Key Point:** The axioms are not empirical predictions about how humans *do* behave; they are constraints that define the domain where the concept of 'utility' *applies*.
  *   **Dependency:** This must happen *before* discussing welfare. If there is no function, there is no welfare to measure.

  **00:30 – 00:50: The Representation Theorem (The "Reveal")**
  *   **Action:** Explain the logical direction of the theorem.
  *   **Move:** Standard intuition: Mental State → Choice. RPT logic: Consistent Choice → Existence of Function.
  *   **Key Point:** "Revealed" does not mean "uncovered" (like digging up a bone); it means "constituted" (like defining a vector by its coordinates).
  *   **Dependency:** This clarifies the status of the utility function before discussing its normative weight.

  **00:50 – 01:05: Welfare and Normativity**
  *   **Action:** Address the "Elimination of Welfare" fear.
  *   **Move:** If Preference = Choice, does "Better Off" just mean "Chose It"?
  *   **Key Point:** Distinguish between *decision utility* (what was chosen) and *experienced utility* (what was felt). RPT reconstructs welfare as *coherent choice*, not happiness. It eliminates *hedonic* welfare, not *preference-satisfaction* welfare.
  *   **Dependency:** Relies on the previous distinction between constitutive axioms and psychological states.

  **01:05 – 01:15: Closing & Exclusions**
  *   **Action:** Pose the closing question and declare the boundaries.

  ---

  ### 3. Misconception Map & Interception Points

  **Misconception 1: "This is just a stipulative definition."**
  *   **The Error:** Thinking "Preference is defined as Choice" is a semantic trick rather than a substantive claim about data sufficiency.
  *   **Interception Point:** **Minute 15 (During the Machinery section).**
  *   **How:** When introducing the axioms, emphasize that this is a *theorem*, not a dictionary. Say: "If we merely defined preference as choice, any choice would be rational. The axioms show that only *some* choice data supports the attribution of preference. That makes it a substantive constraint on the data, not a definition of words."

  **Misconception 2: "Consistency axioms are empirical predictions."**
  *   **The Error:** Treating Transitivity/WARP as hypotheses to be tested against human psychology (e.g., "People violate this, so the theory is false").
  *   **Interception Point:** **Minute 25 (End of Machinery).**
  *   **How:** Explicitly state: "Violating transitivity doesn't falsify the theory; it falsifies the *applicability* of the utility model to that agent. The axioms define the object of study. If the data violates them, we are no longer talking about utility maximization, not because the theory failed, but because the object (a utility function) does not exist for that data set."

  **Misconception 3: "Welfare talk has been eliminated."**
  *   **The Error:** Sliding from "Preference is a disposition to choose" to "Therefore, the agent cannot be wrong about their own good."
  *   **Interception Point:** **Minute 55 (During Welfare).**
  *   **How:** Interject: "RPT reconstructs welfare, it does not eliminate it. 'Better' now means 'selected in a coherent ordering.' This allows us to say an agent is 'better off' at Bundle A than B without referencing their happiness, but it does not allow us to say they are 'happy.' Do not confuse the reconstruction of the metric with the elimination of the concept."

  **Misconception 4: "This is a behaviorist relic."**
  *   **The Error:** Assuming modern economics has abandoned RPT for neural/psychological data.
  *   **Interception Point:** **Minute 70 (Closing).**
  *   **How:** Clarify: "Modern mechanism design and policy analysis still rely on this structure because it is agnostic about psychology. We don't need to know *why* you chose A over B to know that, for the purpose of this model, A > B. The behaviorism is a feature (robustness), not a bug (ignorance)."

  ---

  ### 4. The Closing Question

  To distinguish logical grasp from slogan memorization, ask:

  > **"If we observe a stable, repeatable violation of transitivity in an agent's choices, have we discovered that the agent has *irrational* preferences, or that the agent has *no* preferences?"**

  *   **Memorized Slogan Answer:** "They are irrational." (Implies preferences exist but are flawed).
  *   **Logical Grasp Answer:** "They have no preferences (in the utility-theoretic sense)." (Recognizes that the preference ordering is constituted by the consistency; without consistency, the mathematical object 'preference relation' does not exist).

  ---

  ### 5. Explicit Exclusions (Announce These)

  To keep the gap clean rather than blurred, explicitly announce you are **declining** to cover:

  1.  **Risk and Uncertainty (vNM):** "We are dealing with ordinal utility over certain outcomes. Introducing probabilities changes the ontology of the choice object. That is a separate problem."
  2.  **Intertemporal Choice:** "We are treating choices as timeless. Discounting and dynamic inconsistency introduce time as a variable that complicates the 'revealing' mechanism."
  3.  **Strategic Interaction:** "Game theory adds the choices of *other* agents as constraints. We are isolating the single agent to understand the baseline logic."

  **Instruction to Group:** "If you raise these, I will park them. Not because they aren't important, but because they rely on the machinery we are building today. We cannot complicate the engine before we agree on what the parts are."
