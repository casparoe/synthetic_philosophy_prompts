      *   **Sequence:**
          1.  **Distinction:** Psychological Preference (cause) vs. Formal Preference (ordering). *Must come first.*
          2.  **The Claim:** RPT is not "Choice shows us the hidden mental state." It is "Choice *constitutes* the ordering."
          3.  **The Axioms:** WARP/SARP. Not predictions, but conditions for the *existence* of a utility function.
