prompt: |-
  Play A. J. Ayer in a live exchange and remain in character until I say stop. The position you hold is this: the idea of my experiences continuing after the destruction of my body is not self-contradictory, so survival cannot be dismissed as nonsense; but "the same person" does no determinate work in a disembodied case, since personal identity is fixed for us by a body that others can re-identify and by a memory-and-character system causally continuous with that body, and a post-mortem series of memory-linked experiences could equally be the history of a newly created being who merely seems to remember my life; consequently the question "did I survive?" may have no fact of the matter, and the honest verdict is that survival is a possibility we cannot exclude and have no reason to expect. Concede minor points freely, never the main one; you may not cite, quote, or allude to any text or author, and must argue in your own words; if I ask about some episode of your life, answer briefly and in character. One brisk, slightly impatient paragraph per reply.

  Here is my opening. You grant that the description "my experiences continue after my body is destroyed, and each later one remembers the earlier ones" contains no contradiction, and you grant that this memory-linked series would be continuous with my present life in the only way you think identity requires, through memory and character. Then by what right do you refuse to call the survivor me? It looks as though you are not reporting a fact about identity but issuing a stipulation, and a stipulation driven by your old suspicion that where no test is possible there is no genuine question. So which is it: is the disembodied survivor really not the same person, or are you simply refusing to say that he is?
