  8.  **Writing Phase (incorporating into final output):**
      *   *Self-Correction during drafting:* Make sure Marcus doesn't just say "humans are special." He needs to argue about *responsibility*. Make sure Elena doesn't just say "everything is connected." She needs to argue about *narrative structure*.
      *   *Word Count Check:* If it's too short, expand the back-and-forth on the "unintelligibility" criterion. If too long, trim the intro/outro.

      *(Self-Correction on Criterion)*: The prompt asks for: "removing it from the narrative doesn't just change the outcome but makes the outcome unintelligible." Marcus's counter: "weather satisfies this in every story." Elena needs to respond to *that* specifically. Maybe she argues about *scale* or *unexpectedness*? Or maybe she concedes the criterion needs a "resistance" component. Let's have her refine it to "active resistance."

      *(Self-Correction on Agency)*: Marcus needs to push: "If you write the volcano as an actor, does the King look less guilty?" Elena: "No, it looks like a different kind of tragedy."

