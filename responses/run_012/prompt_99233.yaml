          *   *Character B (Skeptic):* Argues this is environmental determinism in disguise. "Actor" smuggles in agency. Lets humans off the hook.
      *   **Key Conflict 1 (Criterion):** A proposes a criterion: Removing X makes the story unintelligible (not just changes outcome). B stress-tests this: Counterfactual dependence applies to weather too (over-inclusion). A must defend/revise.
      *   **Key Conflict 2 (Agency vs. Actor):** B accuses A of conflating explanatory weight with agency/moral standing. A argues we need a term *other* than "agent" to capture this. Must define the difference in practice.
      *   **Concrete Case:** A kingdom suffers famine after a volcanic winter. Political collapse follows.
          *   A: Eruption is a cause/actor of collapse.
          *   B: Famine became collapse due to grain-storage policy/export decisions.
      *   **Ending:** No tidy resolution. Sharpened disagreement or partial concession.
      *   **Length:** 1200-1600 words.
      *   **Tone:** Sharp, voiced, not a dry philosophy paper.

  2.  **Character Development:**
      *   *Character A (Historian):* Let's call her **Elena**. Passionate, precise, willing to tweak definitions but stubborn on the core insight. Wants to expand the historical imagination.
      *   *Character B (Skeptic/Philosopher):* Let's call him **Marcus**. Wary of political implications, precise about language, focused on responsibility.
