      *   *The Agency Trap:* Marcus: "You want to give the volcano a seat at the table so the King doesn't have to stand in the dock." Elena: "I'm not talking about moral guilt. I'm talking about causal weight." Marcus: "Language carries morality."
      *   *The Revision:* Elena: "Maybe 'actant'?" No, too Latour. Let's stick to "actor" but define it as "force that constrains possibilities."
