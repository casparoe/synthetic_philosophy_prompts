  3.  **Drafting - Section by Section:**

      *   **Opening:** Set the scene. Establish the concrete case immediately (The Kingdom of Aethelgard? No, let's keep it generic but specific: "The Northern Kingdom, 1340s"). Let's use a fictionalized case to avoid historical nitpicking, or a real one like the Late Antique Little Ice Age. Let's stick to the prompt's suggestion: Volcanic winter -> Famine -> Collapse.
      *   **Conflict 1 (The Criterion):**
