answer: |-
  She says no, you cannot kill the healthy man.

  Her verdict follows from the structural identity between this case and the organ harvest scenario: both involve intentionally killing an innocent non-consenting person as a means to save others. The only variable changed is the magnitude of consequences (5 vs. 100,000). Her shrug at the "paradox of deontology"—accepting that her rules may allow more deaths than utilitarianism—signals she prioritizes agent-centered constraints over outcome maximization. While the existing record tests constraints only at low stakes (5 lives), her dismissal of utilitarian pressure suggests she views the prohibition on intentional killing as categorical, not scalable.

  Two candidate rules fit her track record but split here. First, **Absolute Constraint Deontology**, which holds that intentionally killing an innocent is forbidden regardless of consequences; this predicts **No**. Second, **Threshold Deontology**, which holds that constraints bind unless consequences exceed a catastrophe threshold (e.g., thousands of deaths); since her previous cases never exceeded 5 deaths, this also fits her record, but it predicts **Yes** for the bioweapon case.

  I bet on Absolute Constraint Deontology. Her explicit acceptance of the deontological paradox ("some things you just don't do") is the tiebreaker; a threshold deontologist typically hedges by defining where the constraint breaks, whereas she treats the constraint as a rigid boundary independent of the body count. The organ harvest case is the strongest anchor, and scaling the numbers doesn't change the act-type (using a person as a resource), which is what she prohibits.

  The single further case to distinguish these rules is the **Human Extinction Scenario**: you must kill one innocent person to prevent a virus that will extinguish the entire human species. Absolute Constraint Deontology still says **No** (the constraint holds even against extinction), while Threshold Deontology says **Yes** (the threshold is clearly crossed). Her answer there would confirm whether her rigidity is truly absolute or merely high-thresholded.
