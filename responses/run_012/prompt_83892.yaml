      *Wait, let's look for the "Gotcha" on the Rapa Nui claim.* Rapa Nui is the most contentious.
      *   *Question:* "On Rapa Nui, if there was no collapse, how do you explain the toppling of the *moai* and the shift to birdman cult without invoking conflict?"
      *   *Better:* "If 'society' is a bad word, what is the unit that decomposes?"

      *Let's settle on the "Null Result" question.* "If 'collapse' is just a label for 'change we don't like', and 'decomposition' is 'change we do', what's the measurable difference?"

      *Actually, the prompt asks for the one question I'm hoping nobody asks.* This implies a vulnerability in the argument.
      *   Vulnerability: The definition of "parts." If the "parts" are people, they die. If the "parts" are institutions, they vanish.
      *   *The Question:* "When you say the 'parts persist,' are you counting bodies or behaviors? Because if you mean behaviors, you've just redefined collapse as 'population extinction,' which nobody claims happened anyway."
