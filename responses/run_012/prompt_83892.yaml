answer: |-
  Here is your Q&A prep. The room is hostile to reification and grand narratives, so they will attack your definitions and your political blind spots before they attack your data.

  Objections are ordered by damage potential (High to Low).

  ### 1. The "Elite Bias" Objection (High Damage)
  **The Vibe:** A settlement archaeologist working on household contexts, likely Maya or LBA. They are annoyed that you are prioritizing "systems" over people.
  **The Question:** "You argue that because the farming population persisted, the system didn't 'collapse.' But isn't 'integration' just a euphemism for elite extraction? If the palace burns but the peasant's burden lightens, isn't that a *success* for the population, not a 'decomposition'? By focusing on the continuity of the 'parts,' aren't you inadvertently centering the very political structures we're trying to move away from?"
  **Your Reply:** "Precisely. That's why 'collapse' is the wrong word. 'Collapse' mourns the palace. 'Decomposition' describes the liberation of the household from that integration. I'm not saying nothing happened; I'm saying the *loss* was concentrated at the top, while the *continuity* was at the bottom."
  **The Soft Spot:** You risk sounding like you're minimizing the chaos that follows political vacuum. If the "decomposition" led to 50 years of internecine warfare (which it often did), calling it "recombination" sounds sanitizing.

  ### 2. The "Resilience Redundancy" Objection (High Damage)
  **The Vibe:** One of the two complex-systems people. They are bored.
  **The Question:** "This sounds exactly like the 'release' phase (Omega) in Holling's adaptive cycle, or 'transformation' in resilience theory. You've swapped the label 'collapse' for 'decomposition,' but the mechanism you're describing—loss of connectivity while nodes persist—is standard complexity vocabulary. What explanatory power does 'decomposition' add that 'transformation' doesn't?"
  **Your Reply:** "'Transformation' is too neutral; it implies a smooth shift. 'Decomposition' captures the material rot and the active unbinding of ties. It forces us to look at what breaks (the glue) versus what stays (the bricks). Resilience theory often assumes the system *wants* to persist; decomposition asks what happens when the binding agent fails."
  **The Soft Spot:** If they press you on the formal definition, you don't have one. You're using a metaphor ("rot") against a mathematical framework. They can claim you're just poaching their language without doing the work.

  ### 3. The "Reification" Objection (Medium-High Damage)
  **The Vibe:** The anti-"society" faction. They smell a bait-and-switch.
  **The Question:** "You told us to stop using 'society' because it reifies a boundary that doesn't exist. But then you introduced 'higher-level integration.' How is 'integration' not just 'society' with the serial number filed off? If you can measure integration, you can measure society. You haven't solved the ontological problem; you've just changed the noun."
  **Your Reply:** "'Society' implies a container. 'Integration' implies a process. I can point to a shard of Mycenaean pottery in Egypt and measure a tie. I can't point to 'Mycenaean Society.' One is a material correlate; the other is a ghost. I'm analyzing the ties, not the container."
  **The Soft Spot:** If the ties are dense enough, they *form* a container. If you admit that, you're back to "society." If you deny it, you can't explain why the "decomposition" feels like a systemic event to the people living through it.

  ### 4. The "Chronological Resolution" Objection (Medium Damage)
  **The Vibe:** A settlement archaeologist from the Terminal Classic Maya group. They live in the weeds of ceramic seriation.
  **The Question:** "You say recombination happens 'within a generation or two.' In the Maya lowlands, our chronological resolution for the Terminal Classic is often 50 to 100 years minimum. How do you distinguish 'rapid decomposition' from a slow, multi-generational fade where the 'parts' actually do degrade before they recombine? Are you imposing a tempo on the data that the radiocarbon doesn't support?"
  **Your Reply:** "I'm not talking about full recovery, but the cessation of the *unbinding*. The monument dates stop, the palaces burn, but the household ceramic traditions continue without interruption. That break in the elite signal is immediate, even if the political vacuum lasts a century."
  **The Soft Spot:** "Immediate" in archaeology is rarely immediate. If their dating methods can't resolve your claim, your claim is unfalsifiable in their eyes.

  ### 5. The "Public Utility" Objection (Low Damage)
  **The Vibe:** A senior scholar thinking about grant funding and public engagement.
  **The Question:** "Fine, 'collapse' is imprecise. But it's a hook. It gets students, it gets funding, it gets the public to care about climate change parallels. If we retire 'collapse' for 'decomposition,' aren't we just making ourselves irrelevant to the broader conversation about societal risk?"
  **Your Reply:** "If the public thinks 'collapse' means 'everyone dies,' we are lying to them. We shouldn't trade accuracy for alarmism. If we want to talk about risk, let's talk about the fragility of *integration*, not the extinction of populations."
  **The Soft Spot:** You sound idealistic. They know that "decomposition" doesn't sell books. You might be accused of academic navel-gazing.

  ***

  ### The One Question You're Hoping Nobody Asks

  **"Who are you arguing against?"**

  **Why it hurts:** Because the "total destruction/extinction" model of collapse (the Strawman you are attacking) was largely abandoned by professional archaeologists thirty years ago. The people in that room *already* agree that populations persisted in the LBA, Maya, and Rapa Nui. They use the word "collapse" as shorthand for "loss of political complexity," not "death of everyone."

  By setting up "collapse" as "total destruction," you risk looking like you haven't read the last three decades of literature (Middleton, Tainter, Schwartz, etc.). If someone asks this, they are implying your entire premise is a fight against a ghost, and your "new" model is just the current consensus rebranded.

  **If they ask it:** Do not defend the literature. Pivot to the *public* discourse. "I am arguing against the *concept* as it operates in policy and popular understanding, which bleeds back into our funding and framing. We need to stop using a word that implies extinction when we mean reorganization."
