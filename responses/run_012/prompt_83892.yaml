      *   **Audience Mindset:** Allergic to grand narrative. Anti-Diamond/ecocide. Skeptical of reified terms like "society."
      *   **Goal:** Prep for Q&A. Need objections phrased in *their* vocabulary, ordered by damage potential, with short replies and vulnerabilities. Also, identify the "one question I'm hoping nobody asks."
      *   **Tone:** Professional but combative ("I need the fight"). No citations needed, just argumentative strategy.

  2.  **Deconstruct the Argument:**
      *   *Core Claim:* "Collapse" implies total destruction (parts + whole). "Decomposition" implies structural reorganization (whole goes, parts stay).
