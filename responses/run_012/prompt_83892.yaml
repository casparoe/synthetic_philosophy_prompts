      *(Self-Correction during drafting)*: Make sure the vocabulary sounds like *settlement archaeologists*. Use terms like "material correlates," "chronological resolution," "household scale," "elite vs. commoner," "continuity of practice."

      *(Refining the "One Question")*: The strongest vulnerability is that the user is attacking a strawman. Modern collapse studies (Tainter, Middleton, etc.) *already* distinguish between systemic and demographic collapse. If the audience knows this, the paper looks naive.
