      *   *Vulnerability:* Defining "collapse" too strictly (strawman), ignoring suffering/inequality, reifying "systems" while critiquing "society," scale issues (what counts as a "part"?), the political utility of "collapse."

  3.  **Brainstorming Objections (in Audience Vocabulary):**
