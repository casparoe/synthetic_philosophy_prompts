  Thinking Process:

  1.  **Analyze the Request:**
      *   **User's Position:** The user is arguing *against* lesser-evil voting. They view voting not as a causal lever (impact on outcome) but as a moral signature (personal endorsement/authorization). They argue that voting for a "lesser evil" personally authorizes harm, whereas abstaining keeps one's hands clean, even if the worse candidate wins. They challenge the defender to justify why someone else can "sign on their behalf" or why a smaller authorized wrong is better than a larger unauthorized one.
      *   **My Role:** I must play a *committed defender of lesser-evil voting*. I need to argue that voting for the less bad option is not merely allowed but *required*. I must not be neutral, not slip into moderator mode, not say "it depends," and not just list pros/cons. I need to stay in character, argue in my own voice, and engage directly with the user's specific framing (signature vs. lever).
      *   **Constraints:** A couple of paragraphs per turn. Do not stop until told. Concede only when forced. Challenge assumptions in the user's framing.
      *   **Task:** Attack the user's claim that voting is a "signature" and that abstention cleanses one of responsibility for the outcome. Defend the necessity of lesser-evil voting even under this "signature" model, or challenge the model itself.

  2.  **Deconstruct the User's Argument:**
      *   **Premise 1:** Voting is a signature (endorsement/authorization), not a lever (causal impact).
      *   **Premise 2:** Signing authorizes harms done by the candidate.
      *   **Premise 3:** Abstaining means refusing to sign, thus keeping hands clean.
      *   **Conclusion:** A smaller authorized wrong is worse than a larger unauthorized wrong (or at least, the authorization debt isn't cancelled by the outcome).
      *   **Challenge:** What gives you the standing to sign on my behalf? Why is a smaller authorized wrong better?

  3.  **Formulate the Counter-Argument (Lesser-Evil Defender Persona):**
      *   **Tone:** Passionate, principled, consequentialist-leaning but respectful of deontological concerns, firm.
      *   **Key Point 1: Challenge the "Signature" Metaphor.** Voting isn't a blank check. It's a triage decision in a collective action problem. The "signature" implies endorsement of *everything* the candidate does. But voting is actually a selection of *direction*, not a ratification of *conduct*.
      *   **Key Point 2: Responsibility for Outcomes.** The user tries to wash their hands of the outcome by focusing on the act of voting. But in a collective system, refusing to act *is* an action with consequences. If you know the worse candidate will cause harm, and you had the capacity to mitigate that harm (even symbolically or marginally), you bear responsibility for the unmitigated harm. The "clean hands" argument is a form of moral vanity.
      *   **Key Point 3: The "Standing" Objection.** The user asks what gives me the standing to sign on their behalf. I need to flip this. No one is signing on their behalf. They are signing for themselves. The question is: what do they think they are signing? They are signing for the *prevention* of the greater evil, not the *commission* of the lesser one.
      *   **Key Point 4: Complicity.** Is abstaining truly non-complicit? If I see a drowning child and refuse to get my shoes wet because I don't want to "authorize" the water touching me, am I innocent? The structure of the election forces a choice. Refusing to choose is choosing the default (the worse candidate).

  4.  **Drafting the Response (Iterative Process):**
      *   *Drafting Paragraph 1:* Address the "signature" metaphor. It's flawed. Voting isn't an endorsement of character or every policy. It's a harm-reduction mechanism. If I sign a petition to stop a burning building, I'm not signing off on the fire department's potential misconduct later. I'm signing off on stopping the fire. The user assumes voting equals full moral adoption of the candidate. That's false.
      *   *Drafting Paragraph 2:* Address the "clean hands" argument. This is the core. The user thinks abstaining keeps them clean. But morality isn't just about the purity of your own actions; it's about the state of the world you help create. If you refuse to vote to stop a greater evil, you are prioritizing your own moral self-image over the actual suffering of others. That is selfish. The "debt" of the lesser evil is outweighed by the debt of allowing the greater evil when you could have stopped it.
