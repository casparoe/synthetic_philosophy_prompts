  **The Case: The Preserved Bonsai**

  In a quiet garden, a Juniper seed germinates at $t_1$ (beginning **A**, the Biological Organism). At $t_2$, a horticulturist wires and pots the sapling, conferring upon it the status of a specific Artwork, "The Green Spiral" (beginning **B**, the Bonsai Specimen). From $t_2$ to $t_3$, A and B occupy the same space, share all the same biological parts, and are constituted of the same living tissue. At $t_3$, a root fungus kills the Juniper; metabolism ceases, and A goes out of existence. [FLAG: This relies on the biological criterion that an organism ceases when metabolic life ends, even if the structure remains intact.] The horticulturist immediately varnishes and seals the dead wood to prevent decay, maintaining it on display as "The Green Spiral" until it is accidentally shattered at $t_4$. Thus, A exists from $t_1$ to $t_3$, and B exists from $t_2$ to $t_4$; they share all parts during their overlap ($t_2$–$t_3$), yet A starts first and B ends last, with neither lifetime nested inside the other.

  **The Check**

  *   **Constitution / Coincidence View:** There are two distinct objects. During the overlap, the Organism constitutes the Artwork. They are distinct because they have different persistence conditions: the Organism cannot survive biological death ($t_3$), but the Artwork can survive as a preserved relic ($t_3$–$t_4$).
  *   **Dominant Sortal View:** There is only one object. We must decide whether the sortal "Organism" or "Artwork" dominates. If "Organism" dominates, the object dies at $t_3$ (B's later phase is illusory). If "Artwork" dominates, the object begins at $t_2$ (A's earlier phase is illusory). Either way, the crossing lifetimes are denied; there is only one timeline.
  *   **Eliminativist (Organicist):** Only A exists. Composite artefacts like Bonsais do not exist; there is only the living organism arranged bonsai-wise. After $t_3$, there are no objects, just dead matter arranged artifactually.
  *   **Four-Dimensionalist:** A and B are distinct spacetime worms. A is the worm segment $t_1$–$t_3$; B is the worm segment $t_2$–$t_4$. They share temporal parts during the overlap. There is no contradiction, just distinct mereological sums of temporal slices.

  **The Honest Bit**

  The feature doing the real work is the **asymmetry of destruction conditions**. In the standard Statue/Clay case, the constituter (Clay) is *more* durable than the constituted (Statue); the Clay survives the Statue's destruction, leading to nested lifetimes (Clay outlasts Statue at the end). In this Bonsai case, the constituter (Organism) is *less* durable than the constituted (Artwork) regarding the specific threat of biological death; the Organism must cease at $t_3$, while the Artwork can persist as a preserved object.

  If you take this feature out and put dead matter back in (e.g., a lump of clay), the case collapses into nesting. Clay is generally understood to survive the destruction of the shape; if the Clay ceased at $t_3$ while the Statue survived to $t_4$, you would need the Clay to vanish while the Statue remained, which violates material conservation in ordinary contexts. Thus, with dead matter, the Clay outlasts the Statue at *both* ends (or the Statue is nested within the Clay), restoring the standard modal argument: "The Clay could survive being squashed, the Statue could not." Here, the modal argument runs in reverse: "The Artwork could survive death (as a relic), the Organism could not."

  The Constitution theorist's best attack is to deny that B survives $t_3$. They will argue that "The Green Spiral" is essentially a living tree; once dead, it is merely a *relic* of the Spiral, not the Spiral itself. If they make this move, B ends at $t_3$, and the lifetimes become nested (B inside A), dissolving the crossing. The cost of this move is that it makes artefact identity parasitic on biological status in a way that feels ad hoc for art objects (why can't a dead tree be a bonsai artefact?). However, if they accept B survives $t_3$, they must accept that a constituted object can outlast its constituter, which inverts the standard ontological dependency where the constituter is the "ground" of existence. Note that the **Dominant Sortal** and **Eliminativist** views effectively agree here: both conclude that only the Organism (A) truly exists, rendering the crossing an illusion of language or ontology.
