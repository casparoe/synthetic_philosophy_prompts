answer: |-
  My dear friend,

  It is a pleasure to enter into this correspondence regarding the dispute among your circle, for it touches upon one of the most persistent and seductive metaphors in the philosophy of mind. Your suspicion that both your friends are leaning on the cinema comparison rather harder than it will bear is, I am afraid, entirely well-founded. The analogy is so vivid that it tends to smuggle in assumptions faster than one can critique them, and to audit it properly we must first dismantle the projection booth piece by piece. When your engineer friend likens the brain to a projector and a screen, he is positing a specific architecture for experience. In this mapping, the projector corresponds to the sensory processing systems that gather data from the eyes and ears; the film strip or completed print represents the stream of sensory information as it arrives; the screen is the supposed locus of consciousness, often imagined as the visual cortex or some central convergence zone; the frame is the discrete moment of experience, updated at a fixed rate like the refresh rate of a monitor; the running time is the duration of the conscious episode; and the audience, though often left unmentioned, is the inevitable homunculus, the little inner person who watches the show. The trouble is that while the projector and the film strip have plausible neural correlates in the form of input pathways and processing states, the screen, the frame, and the audience are phantom imports. There is no place in the brain where everything comes together to be displayed, no single moment where the data becomes finished, and certainly no one inside to view it.

  Your engineer friend insists on a fixed rate of showing, perhaps a dozen times a second, implying that there is always a fact of the matter about which frame is currently now. This is precisely where the cinema analogy breaks down under the weight of empirical evidence, and where the experiment you mentioned regarding the coloured spots becomes the crux of the matter. In that experiment, often referred to as the colour phi phenomenon, a green spot flashes in one location followed quickly by a red spot in another. Subjects do not see two stationary spots; they see a single spot moving across the space that changes colour in mid-transit. If the brain were a cinema projector displaying frames at a fixed rate, the subject should see the green spot, then the red spot, or perhaps a blur, but they should not see a continuous motion with a colour change that anticipates the second stimulus. The brain constructs the narrative of the motion and the colour change after the second spot has already been registered, effectively editing the past experience to create a coherent story. This demonstrates that there is no finished print delivered at a specific time. There is no single moment at which the experience is finalized and presented. Consequently, the correspondence of the frame and the screen cannot survive contact with the multiple drafts model. The brain does not render a frame and hold it up for inspection; it engages in a continuous, parallel process of revision where different interpretations compete for influence over memory and behaviour.

  This brings us to the disanalogies that matter for the uses your friends are making of the picture. The decorative disanalogies are things like the fact that the brain does not use light to project images onto a surface of cells, or that there is no physical auditorium inside the skull. These are trivial compared to the structural disanalogies. The meaningful disanalogies are the absence of a viewer, the absence of a single moment of presentation, the absence of simultaneity, and the absence of a privileged place. Your engineer friend smuggles in the viewer and the single moment. He assumes that because there is experience, there must be a place and time where that experience happens in its final form. This is the error of Cartesian materialism, the belief that while the soul may not be immaterial, there is still a central finish line in the brain where things become real. The multiple drafts model denies this finish line. Perception is indeed a swarm of parallel processes, as you have gathered, and something becomes conscious not by being displayed but by becoming famous, in the sense that it gains enough traction to be reported, remembered, or acted upon. There is no datable location in the stream because the stream is not a single river but a delta of many tributaries that do not all merge at one point.

  Your other friend, however, makes the opposite error, though she starts from a more accurate premise. She is correct that there is no screen, no auditorium, and no single place where everything is displayed. But she concludes from this that consciousness as we ordinarily conceive of it is an illusion, a story about a performance that never took place. This is where she leans too hard on the analogy in the opposite direction. She assumes that if the cinema model is false, the experience itself must be fake. But Dennett's attack on the Cartesian theatre is not an attack on the existence of consciousness, but on the misinterpretation of its nature. Consciousness is not an illusion; what is an illusion is the intuition that consciousness requires a central viewer. To say there is no theatre is not to say there is no play. The experience of seeing the red and green spots is real, but it is not real because it was projected on a screen; it is real because the neural processes involved achieved a certain functional status. Her conclusion that there is no consciousness at all, or that it is merely a story, follows only if one accepts the engineer's premise that consciousness must be a show. Once the mapping is corrected to remove the screen and the audience, there is no need to eliminate the phenomenon itself. We are left with a reality that is distributed and fragmented rather than centralised and unified, but it is no less real for that.

  Regarding your engineer friend's variant, in which the brain is likened to a headset that renders late and then retroactively warps the image so that the delay is never noticed, I must tell you that this is merely the same mistake in modern dress. It is an attempt to save the Cartesian Theatre by adding latency compensation. Whether the image is presented instantly or warped to hide a delay, the model still presupposes that there is a final image that is eventually presented to a viewer. It still requires a finish line, even if that finish line is moved slightly back in time to accommodate processing lag. The colour phi phenomenon shows that the brain does not just warp the image to hide delay; it constructs the content of the experience based on information that arrives later, meaning there was never a single original image to warp. The headset analogy fails because a headset still outputs a single visual field to a pair of eyes. The brain outputs nothing of the sort; it outputs influences to various subsystems. To imagine the brain warping an image for a viewer is to invite the homunculus back in through the side door.

  If one were to seek a better comparison, it would be wise to abandon the imagery of display and performance entirely in favour of something more bureaucratic or editorial. One might conceive of the brain as a vast, decentralised administration where memos are circulated continuously. There is no single desk where the final decision is signed, nor a single moment when the decision is made. Instead, various departments propose actions, revise previous proposals, and circulate drafts. Some drafts gain enough signatures to be enacted as policy, while others are lost in the shuffle. Consciousness, on this view, is not the reading of the final policy but the process of circulation and endorsement itself. Another possible analogy is that of a swarm of insects, where the collective behaviour emerges from local interactions without a central commander issuing orders. Neither of these captures the subjective feel of experience perfectly, for no analogy can fully bridge the gap between mechanism and phenomenology, but they avoid the trap of positing a magical screen where the physical meets the mental.

  In conclusion, neither of your friends is entirely right, though your Dennett-reading friend is closer to the mark regarding the architecture of the brain. The engineer is mistaken in thinking consciousness has a datable location in the stream, for the stream itself is a construct of multiple currents. The sceptic is mistaken in thinking that the absence of a theatre implies the absence of an experience. The cinema analogy holds only so far as it suggests a flow of information, but it fails completely when it suggests a display of that information. The projector exists, but there is no screen, no audience, and no completed print. What remains is a dynamic, parallel process of negotiation among neural states, where the question of when exactly something becomes conscious is not a matter of finding a timestamp but of tracing the influence of that state upon the rest of the system. I hope this helps to settle the argument, or at least provides enough nuance to keep the debate interesting for a few months more.

  Yours sincerely,

  A Correspondent
