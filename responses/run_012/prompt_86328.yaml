      *   *Reading 2 (The Precedent Focus):* Tailoring a rule to fit a weird fact pattern creates a rule that doesn't work for normal cases.
          *   *Verdict:* Substantive/Defensible. This is the classic legal process view.
      *   *Reading 3 (The Separation of Powers):* Judges shouldn't fix legislative mistakes just because the outcome is ugly.
          *   *Verdict:* Substantive/Defensible (Textualist view).
      *   *Reading 4 (The "Bad Law" = Unjust Outcome):* Trying to avoid a bad result in *this* case creates a bad rule for *others*.
