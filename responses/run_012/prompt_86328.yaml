  2.  **Deconstruct "Hard Cases Make Bad Law":**
      *   *Origin:* Often attributed to Lord Chesterfield or Justice Holmes (though the sentiment is older).
      *   *Core Tension:* Individual justice (equity) vs. General Rule (precedent/stability).
      *   *Ambiguities:*
          *   "Hard": Morally difficult? Legally ambiguous? Factually extreme?
          *   "Bad": Unjust outcome? Unworkable precedent? Overbroad rule?
          *   "Make": Does it *cause* the bad law, or is the bad law the *reasoning* used to solve the hard case?
          *   Scope: Is it about *this* case or *future* cases?

  3.  **Drafting the Menu of Readings (Iterative Process):**

      *   *Reading 1 (The Weakest/Thinnest):* Extreme facts lead to emotional decisions.
