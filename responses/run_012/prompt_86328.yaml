answer: |-
  Here is a breakdown of the aphorism "hard cases make bad law" tailored for your office hours. It moves from the weakest, uncontroversial readings to the strongest, contested ones, followed by an analysis of your professor's specific usage.

  ### The Menu of Readings

  **1. The Psychological Platitude**
  *   **The Claim:** When facts are emotionally charged (like a murder), judges may get so angry or sympathetic that they lose objectivity and write sloppy opinions.
  *   **Ambiguity Check:** "Hard" = emotionally disturbing; "Bad" = poorly reasoned.
  *   **Verdict:** **Platitude.** Nobody disagrees that emotion can cloud judgment. But this doesn't tell us *how* to decide, only that we should calm down before writing.

  **2. The Overfitting Warning (The Classic Legal Process View)**
  *   **The Claim:** If you craft a legal rule specifically to solve a bizarre, extreme fact pattern, that rule will be too narrow or too weird to work in normal, everyday cases later.
  *   **Ambiguity Check:** "Hard" = factually extreme/atypical; "Bad" = unworkable precedent for future *normal* litigants.
  *   **Verdict:** **Substantive & Defensible.** This is the strongest version of the maxim. It warns against tailoring a statute's meaning to fit one outlier, which might break the statute for everyone else.

  **3. The Institutional Competence Claim**
  *   **The Claim:** When a case produces a morally repugnant result under clear text, the "badness" is a legislative error, not a judicial one. Fixing it judicially usurps the legislature.
  *   **Ambiguity Check:** "Hard" = morally repugnant outcome; "Bad" = undemocratic judicial lawmaking.
  *   **Verdict:** **Substantive & Contested.** This is a core Textualist argument. It assumes the "bad law" is the *judicial amendment* of the statute, not the *statutory outcome* itself.

  **4. The Slippery Slope of Equity**
  *   **The Claim:** If you allow an exception here (no murderers inherit), you invite judges to create exceptions everywhere they dislike the outcome, destroying legal certainty.
  *   **Ambiguity Check:** "Hard" = tempts judicial discretion; "Bad" = erosion of the rule of law/stability.
  *   **Verdict:** **Substantive & Defensible.** This argues that the *method* of deciding (equity vs. text) matters more than the *result* of this specific case.

  **5. The "Bad Outcome" Inversion**
  *   **The Claim:** Trying to avoid a "bad" result in *this* case (letting the murderer inherit) inevitably creates a "bad" rule for *future* cases (e.g., disinheritance based on unproven allegations of bad behavior).
  *   **Ambiguity Check:** "Hard" = desire to do justice now; "Bad" = collateral damage to future defendants.
  *   **Verdict:** **Substantive.** This concedes the murderer getting money is ugly, but argues the cure is worse than the disease.

  **6. The Absolute Formalist Claim (The Radical Reading)**
  *   **The Claim:** Any time a judge considers moral purpose over plain text, the resulting law is *automatically* "bad," regardless of the outcome.
  *   **Ambiguity Check:** "Hard" = any gap between text and morality; "Bad" = any departure from textualism.
  *   **Verdict:** **Contested/Debatable.** This is a normative theory of adjudication (Scalia-style), not a self-evident truth. It begs the question by defining "bad law" as "non-textualist law."

  **7. The Universal Prohibition (The False Reading)**
  *   **The Claim:** Hard cases *always* make bad law; therefore, judges should never attempt to resolve legal ambiguities in morally difficult contexts.
  *   **Ambiguity Check:** "Make" = causal necessity.
  *   **Verdict:** **False.** Landmark civil rights cases (*Brown v. Board*) were "hard" cases that made "good" law. Sometimes pressure reveals necessary legal evolution.

  ***

  ### Analysis of Your Professor's Move

  **Which reading was he leaning on?**
  He was almost certainly using **Reading #3 (Institutional Competence)** blended with **Reading #4 (Slippery Slope)**.
  *   **The Signal:** By cutting you off when you suggested the court *wouldn't* read it straight, he was implying that the court *should not* read it straight.
  *   **The Logic:** He is treating the "hardness" of the case (the moral horror of the murder) as a trap. He believes that if the court twists the Statute of Wills to block the grandson, the court is making "bad law" by usurping the legislature's role.

  **Does the aphorism actually get him his conclusion?**
  **No. It gets him a mushier conclusion than the one he implied.**

  1.  **It supports caution, not capitulation:** Even under the strongest reading (#2, Overfitting), the maxim warns against crafting a *novel* rule for the hard case. It does not necessarily command a *literalist* rule if the literalist rule contradicts established common law principles (like *no one profits from their own wrong*). In *Riggs v. Palmer* (the actual case), the court didn't write a new statute; they applied an ancient equitable maxim. That isn't "making law," it's interpreting the statute within the broader legal context.
  2.  **It ignores the "Bad Law" of the Alternative:** The professor assumes the "bad law" is the judicial exception. But a textualist could argue that a law which incentivizes murder (by guaranteeing inheritance) is *also* "bad law." The aphorism doesn't tell you which "bad" is worse.
  3.  **It conflates "Hard" with "Clear":** In your hypothetical, the statute is clear (textually). The case is only "hard" morally. The aphorism is usually reserved for cases where the *law* is unsettled. Using it to enforce clear text against moral intuition is a category error.

  ### Office Hours Strategy

  When you go in, don't ask "What did you mean?" Ask him to pick a row from the menu.

  *   **Ask:** "When you used the maxim, were you arguing that creating an equitable exception creates a **bad precedent** for future wills cases (Reading #2), or that it's **undemocratic** for judges to fix the statute (Reading #3)?"
  *   **Push:** "If it's about precedent, doesn't *Riggs* show that a 'no profit from wrong' principle is stable enough not to be 'bad law'? And if it's about democracy, isn't the 'bad law' actually the statute that incentivizes murder, which the legislature hasn't fixed?"
  *   **The Trap:** If he says "Hard cases make bad law" is just a warning to be careful, point out that he used it to **settle** the debate, not to urge caution. A warning suggests "think harder." His usage suggested "stop thinking and read the text."

  **Bottom Line:** The phrase is a conversation-stopper disguised as an argument. It sounds wise, but it usually hides a specific political choice about who decides (judges vs. legislatures). Force him to admit the choice.
