          *   *Problem:* The aphorism is usually about *rule formulation*, not necessarily *outcome*. It warns against crafting a rule *too specific* to the hard facts. It doesn't necessarily command a literalist outcome if the literal outcome violates established common law principles (like no one profits from their own wrong).
