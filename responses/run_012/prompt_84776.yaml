prompt: |-
  Ok so I'm a junior in political science and I'm taking this constitutional theory seminar this term — we spent two weeks on precommitment, the Ulysses and the Sirens thing Elster made the standard reference for, and then the Waldron objection that a person can tie himself to a mast but a legislature isn't a person and the people it binds never agreed to anything. Honestly I left that class thinking the objection is devestating and also that I have no idea what to do with it. Meanwhile I have a part-time gig at the state legislature's nonpartisan research office, the one that writes the little background memos for members, and my supervisor found out I'm in this seminar and now she wants me to build her something. What she wants: a reusable screening procedure our office can run on any proposal that would bind future officials. She gets these constantly, maybe three or four a month, we have to turn a memo around in about a day, and the members who read it will not read philosophy. The kind of thing that crosses her desk: a charter amendment creating an independent redistricting commission with staggered twelve-year terms; a constitutional amendment requiring a two-thirds vote for any tax increase and another two-thirds vote to repeal it; an automatic trigger that cuts every department's budget by 2% with no vote whenever the rainy-day fund falls under 5% of general revenue; and a rule requiring an agency to get sign-off from a standing advisory panel, members appointed to fixed long terms, before it can revise any of its rules. She signs off on whatever I produce and she's told me it has to be usable by an intern who's been here three weeks.

  So: give me the procedure. Questions in order, what counts as a sufficient answer to each, where the procedure stops with a no, and — this is the part I care about most — where it has to stop and hand the thing to a human because it's a values question rather than a fact question, since I think that's actually where the seminar left us. My worry is that I'll just build a machine that launders my own politics: I'm pretty sympathetic to the redistricting commission and to anything that locks in transit or climate spending, and I suspect a good procedure would make at least one of those look bad, so please don't let me off the hook. It should also survive the cases I can't tell apart — a rule that binds for five years versus forever, a rule that only requires a body to consult versus one that requires it to reach a particular outcome, and an emergency where the entire point is that the commitment gets overridden. Then run it on three of the four examples above, showing what each step returns and where it gets stuck, and add a seperate short section on what the procedure can't do at all. One page for the checklist itself; the worked examples can run long.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User:** Junior PolSci student, taking Constitutional Theory (Elster/Waldron on precommitment), working part-time at a state legislature's nonpartisan research office.
      *   **Task:** Create a reusable screening procedure (checklist/flowchart) for proposals that bind future officials.
      *   **Constraints:**
          *   Must be usable by an intern with 3 weeks experience.
          *   Must be fast (memos turned around in a day).
          *   Audience: Legislators (won't read philosophy).
          *   Must identify where the procedure stops with a "No" (procedural failure) vs. where it hands off to a human (values question).
          *   Must avoid laundering the user's own politics (bias check).
          *   Must handle edge cases: duration (5 years vs. forever), consult vs. outcome, emergencies.
          *   Output format: One page for the checklist, worked examples for 3 of the 4 scenarios, separate section on limitations.
      *   **Tone:** Professional, practical, academically grounded but accessible, honest about limitations.

  2.  **Deconstruct the Theoretical Problem (Elster vs. Waldron):**
      *   *Elster (Ulysses):* Precommitment is rational to prevent weakness of will or passion. Good for stability, credibility, protecting rights.
      *   *Waldron:* A legislature isn't a person. The "people" binding the future "people" didn't agree. It undermines democracy (majority rule).
      *   *Practical Translation:* How do we distinguish between "good stability" (rule of law) and "bad shackling" (democratic deficit)?
      *   *Key Distinctions needed for the checklist:*
          *   Procedural vs. Substantive binding.
          *   Reversibility (how hard is it to undo?).
          *   Democratic pedigree (who agreed to this?).
          *   Emergency escape hatches.

  3.  **Drafting the Procedure (The "One Page" Checklist):**
      *   *Goal:* Filter out clear procedural defects, flag value judgments for the supervisor.
      *   *Structure:* Sequential questions. Yes/No/Maybe.
      *   *Step 1: Definition.* Is it actually binding future officials? (Filter out normal laws).
      *   *Step 2: Reversibility.* Can it be undone by a simple majority? If yes, it's not really a precommitment problem. If no, proceed.
      *   *Step 3: Duration.* Is it perpetual or finite? (Addresses the 5 years vs. forever worry).
      *   *Step 4: Substance vs. Process.* Does it dictate an outcome or just a process? (Addresses consult vs. outcome).
      *   *Step 5: Emergency Override.* Is there a way to break the mast in a crisis? (Addresses the emergency worry).
      *   *Step 6: The "Waldron Handoff".* If it passes 1-5, it's a *valid* precommitment, but is it *legitimate*? This is the values question.
      *   *Refinement:* Make sure the "Stop" points are clear. "No" means "Flag as High Risk/Constitutional Concern." "Handoff" means "Flag for Legislative Judgment."

  4.  **Developing the Worked Examples:**
      *   *Selection:*
          1.  Independent Redistricting Commission (12-year terms). *Classic precommitment.*
          2.  Two-thirds vote for tax increase/repeal. *Supermajority requirement (high Waldron risk).*
          3.  Automatic budget cut trigger (Sequester style). *Mechanism binding.*
          *   (Skip the agency advisory panel for brevity, or include if needed. The prompt asks for 3 of 4. I'll do Redistricting, Tax, and Budget Trigger).
      *   *Execution:* Run each through the checklist steps. Show where they pass, where they flag, and where they hit the "Human Judgment" wall.

  5.  **Addressing the "Values vs. Facts" & "Bias" Concern:**
      *   The user is worried about laundering their own politics (liking climate/transit locks).
      *   *Solution:* The checklist must remain agnostic on *policy goals*. It tests the *mechanism*, not the *merit*.
      *   *The "Handoff":* Explicitly state that the checklist cannot determine if the binding is *good*, only if it is *structurally sound* regarding democratic theory.
      *   *Limitations Section:* Be honest. This tool doesn't solve the counter-majoritarian difficulty. It just organizes it.

  6.  **Refining the Output (Formatting & Tone):**
      *   *Checklist:* Needs to look like a form. Bold headers. Clear logic.
      *   *Examples:* Narrative but structured.
      *   *Limitations:* Concise.
      *   *Tone:* Respectful of the academic background but focused on the bureaucratic reality. Acknowledge the Elster/Waldron tension without using jargon in the checklist itself.

  7.  **Self-Correction/Review during Drafting:**
      *   *Critique:* Is the checklist too philosophical?
      *   *Fix:* Simplify the language. Instead of "Democratic Pedigree," use "Approval Threshold." Instead of "Reversibility," use "Undo Mechanism."
      *   *Critique:* Did I address the "intern" constraint?
      *   *Fix:* Ensure the questions are binary where possible. Provide clear "If X, then Y" instructions.
      *   *Critique:* Did I address the bias worry?
      *   *Fix:* In the "Handoff" section, emphasize that the *policy goal* is irrelevant to the screening. A climate lock and a tax lock are treated the same structurally.
      *   *Critique:* The prompt asks for "where the procedure stops with a no."
      *   *Fix:* I need to be careful. A "No" shouldn't mean "Kill the bill." It means "Flag as Constitutionally Problematic." Legislators can still pass bad bills. The office provides analysis, not vetoes. So, "Stop" = "Generate Warning Memo." "Handoff" = "Generate Neutral Analysis + Note Value Judgment Required."

  8.  **Final Polish:** Check against the "One Page" constraint for the checklist. (I will format it to *fit* a page conceptually, even if text wraps). Ensure the distinction between "Procedural Defect" and "Democratic Trade-off" is clear.

      *(Self-Correction on "Stop with a No"):* In a legislative context, the research office doesn't say "No." They say "This presents a conflict." So, I will frame "No" as "Flag: Structural Conflict." The "Handoff" is "Flag: Political Judgment."

      *Wait, one more thing:* The prompt asks "where the procedure stops with a no." I should interpret this as "where the procedure identifies a disqualifying feature" (e.g., no emergency override might be a hard stop for *best practice*, but maybe not for *analysis*). Actually, better interpretation: Where does the *screening* conclude it's problematic vs. where does it punt?
      *Decision:* I will design it so that clear structural flaws (e.g., no way to undo even in emergency) trigger a "High Risk" flag (Effectively a 'No' on *soundness*), while value trade-offs trigger a "Legislative Choice" flag (The Handoff).

      *Let's refine the "No".* The office doesn't veto. So the "No" is "No, this does not meet standards of reversible precommitment." The "Handoff" is "Yes, it meets standards, but is it wise?"
      *Actually, looking at the prompt:* "where the procedure stops with a no... and where it has to stop and hand the thing to a human."
      Okay, I will create a "Red Flag" (Stop/Warning) and a "Yellow Flag" (Handoff/Values).

      *Let's write.*

      *(Drafting the Checklist)*
      1. Is it binding future sessions?
      2. Is it reversible?
      3. Is there an emergency escape?
      4. Is it process or outcome?
      5. Handoff.

      *(Drafting Examples)*
      1. Redistricting: Passes most, Handoff on democracy.
      2. Tax Supermajority: Fails reversibility (hard to undo), Handoff on fiscal policy.
      3. Budget Trigger: Passes, Handoff on austerity vs. discretion.

      *(Drafting Limitations)*
      Can't judge policy merit. Can't solve Waldron. Can't predict political will.

      *Final check on tone:* Keep it sharp. You're a junior, talking to a supervisor, but showing you understood the seminar.

      *Wait, one nuance:* The prompt says "where the procedure stops with a no." In a legislative office, you don't say "No." You say "This creates a binding constraint." I will interpret "No" as "No, this is not a standard legislative act; it requires heightened scrutiny." Or better: "Stop: Identify as Precommitment Device."
      *Re-reading prompt:* "where the procedure stops with a no". Okay, I will treat this as a screening tool for *soundness*. If it fails a hard criterion (like no emergency override), the procedure says "No, this is structurally unsafe." If it passes but hits values, it says "Hand to human."

      *Okay, let's finalize the logic.*
      Q1: Binding? If No -> Stop (Normal Bill). If Yes -> Continue.
      Q2: Reversible by Simple Majority? If Yes -> Stop (Normal Bill). If No -> Continue.
      Q3: Emergency Override? If No -> **STOP (FLAG: RIGIDITY RISK)**. If Yes -> Continue.
      Q4: Outcome vs Process? If Outcome -> **STOP (FLAG: SUBSTANTIVE LOCK)**. If Process -> Continue.
      Q5: **HANDOFF (VALUES)**.

      *Wait, is "Outcome" a hard stop?* Waldron hates outcome binding. Elster might accept it. I should make Outcome a "Handoff" not a "No". The "No" should be reserved for things that are *undeniably* problematic structurally (like no emergency clause).
      *Actually, the prompt asks for "where the procedure stops with a no".* I'll define "No" as "Recommend against/Flag as High Risk."
      *Let's adjust:*
      1. Binding?
      2. Reversibility?
      3. Emergency Clause? (No = Hard Flag).
      4. Duration? (Perpetual = Hard Flag).
      5. Substance? (Outcome = Value Handoff).

      *Okay, ready to generate.*
answer: |-
  ### MEMORANDUM OF UNDERSTANDING: PRECOMMITMENT SCREENING PROTOCOL
  **To:** Nonpartisan Research Office Staff  
  **From:** [Your Name], Research Analyst  
  **Subject:** Screening Procedure for Proposals Binding Future Legislative Sessions  
  **Constraint:** Must be executable by junior staff within 2 hours; distinguishes structural defects from value judgments.

  ---

  #### PART I: THE SCREENING CHECKLIST (ONE PAGE)

  **INSTRUCTIONS:** Answer sequentially. If **STOP** is triggered, draft memo section: "Structural Concern." If **HANDOFF** is triggered, draft memo section: "Legislative Judgment Required."

  **1. THE BINDING TEST**
  *Question:* Does this proposal prevent a future simple majority of the legislature from changing policy or procedure by normal vote?
  *   *Look for:* Supermajority requirements, fixed terms exceeding session length, automatic triggers, independent bodies with removal protection.
  *   *If NO:* **STOP.** (Standard Legislation. No precommitment analysis needed.)
  *   *If YES:* Proceed to Q2.

  **2. THE REVERSIBILITY TEST**
  *Question:* Is there a legal mechanism for the legislature to undo this constraint in the future?
  *   *Look for:* Sunset clauses, amendment procedures, repeal clauses.
  *   *If NO (Perpetual/Indefinite):* **STOP.** (Flag: "Permanent Shackling." High Waldron Risk.)
  *   *If YES:* Proceed to Q3.

  **3. THE EMERGENCY ESCAPE TEST**
  *Question:* Does the proposal allow the constraint to be overridden in a declared emergency or by a specific high-threshold vote (e.g., 2/3 majority) if circumstances change drastically?
  *   *Look for:* "Unless emergency declared," "Vote of 2/3 to suspend," "Force Majeure."
  *   *If NO:* **STOP.** (Flag: "Rigidity Risk." Prevents response to crisis.)
  *   *If YES:* Proceed to Q4.

  **4. THE SUBSTANCE VS. PROCESS TEST**
  *Question:* Does the proposal bind future officials to a specific *outcome* (e.g., "No tax > X%") or a *process* (e.g., "Must consult commission before tax")?
  *   *If OUTCOME:* Proceed to **HANDOFF**. (Substantive precommitment.)
  *   *If PROCESS:* Proceed to **HANDOFF**. (Procedural precommitment.)
      *   *Note:* This step does not stop the procedure; it categorizes the type of value judgment required.

  **5. THE HANDOFF (VALUES JUDGMENT)**
  *Status:* **HUMAN REVIEW REQUIRED.**
  *Instruction:* The proposal has passed structural safety checks (Q1-Q3). It now presents a democratic trade-off.
  *Drafting Note:* Do not recommend for or against. State clearly: *"This proposal trades current majority rule for future stability. The legislature must decide if the policy goal justifies limiting future democratic discretion."*
  *End Procedure.*

  ---

  #### PART II: WORKED EXAMPLES

  **EXAMPLE A: Independent Redistricting Commission (12-Year Staggered Terms)**
  *   **Q1 (Binding):** **YES.** Current legislature cannot redraw maps; authority transferred to body with removal protection.
  *   **Q2 (Reversibility):** **YES.** Constitution can be amended or statute repealed to dissolve commission (though politically difficult).
  *   **Q3 (Emergency Escape):** **NO.** There is no "emergency" where the legislature can redraw maps mid-decade.
      *   *Result:* **STOP (Flag: Rigidity Risk).**
      *   *Memo Language:* "Proposal lacks emergency override. In cases of proven gerrymandering or legal mandate requiring immediate redistricting, the legislature may be unable to act without constitutional litigation."
  *   **Q4/Q5:** Not reached.
  *   *Analysis:* This catches the "Ulysses" problem. Tying the mast is fine, but if the ship is sinking (legal crisis), you need a knife.

  **EXAMPLE B: Constitutional Amendment (2/3 Vote for Tax Increase AND Repeal)**
  *   **Q1 (Binding):** **YES.** Simple majority cannot raise or lower taxes.
  *   **Q2 (Reversibility):** **YES.** But requires 2/3 vote to repeal the amendment itself.
  *   **Q3 (Emergency Escape):** **NO.** Fiscal emergencies (war, recession) do not trigger an exception.
      *   *Result:* **STOP (Flag: Rigidity Risk).**
      *   *Memo Language:* "Proposal binds future legislatures during fiscal crises. Revenue tools are restricted even if expenditure needs spike."
  *   **Q4 (Substance):** **OUTCOME.** (Specific vote threshold for specific policy).
  *   **Q5 (Handoff):** **N/A (Already Stopped).**
      *   *Note:* Even if it had an escape hatch, this would go to Handoff because it binds *substance*. The "No" on the escape hatch is the critical structural finding.

  **EXAMPLE C: Automatic Budget Trigger (Cut 2% if Rainy-Day Fund < 5%)**
  *   **Q1 (Binding):** **YES.** Future legislatures lose appropriation discretion automatically.
  *   **Q2 (Reversibility):** **YES.** Statute can be repealed when fund is healthy.
  *   **Q3 (Emergency Escape):** **MAYBE.** Depends on draft. Assume "Unless legislature votes to suspend." -> **YES.**
  *   **Q4 (Substance):** **OUTCOME.** (Mandates specific cut).
  *   **Q5 (Handoff):** **TRIGGERED.**
      *   *Memo Language:* "Structurally sound (includes escape valve). However, this substitutes automatic algorithm for legislative discretion. Members must weigh fiscal discipline against the ability to prioritize specific cuts during downturns."
      *   *Analysis:* This survives the "No" filters. The intern flags it as a *choice*, not a *defect*. This protects you from bias: you aren't saying austerity is bad, just that it removes choice.

  ---

  #### PART III: LIMITATIONS (WHAT THIS PROCEDURE CANNOT DO)

  1.  **It Cannot Solve the Counter-Majoritarian Difficulty:** The checklist identifies *that* a proposal binds the future, but it cannot determine *if* that is democratically legitimate. That is the Waldron objection, and it remains a political question, not a procedural one.
  2.  **It Cannot Assess Policy Merit:** A "structurally sound" precommitment can still be terrible policy (e.g., an automatic trigger that cuts education but protects defense). The checklist is agnostic on the *content* of the lock.
  3.  **It Cannot Predict Political Durability:** A proposal might pass Q2 (Reversibility) on paper, but be politically impossible to reverse (e.g., a popular tax lock). The checklist treats legal reversibility as sufficient, which may understate the practical binding effect.
  4.  **It Cannot Define "Emergency":** Q3 relies on the presence of an escape clause, but does not evaluate whether the definition of "emergency" is too narrow to ever be used.

  **Summary:** This tool separates *mechanical defects* (no way out) from *democratic trade-offs* (choosing stability over flexibility). It prevents the office from laundering value judgments as procedural facts.
