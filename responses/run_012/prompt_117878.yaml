  ### Scratchpad: Candidate Cases

  1.  **Color Discrimination (Berinmo-esque):** Speakers of Language A cannot distinguish blue from green non-linguistically.
      *   *Fail:* Stock example; also, psychophysics shows the discrimination exists even if labeling is slower, violating the "unavailable thought" constraint.
  2.  **Spatial Navigation (Guugu Yimithirr-esque):** Speakers use absolute cardinal directions instead of egocentric coordinates.
      *   *Fail:* Stock example; this is a habit of attention/indexing, not a missing propositional thought (they can understand "left" if forced).
  3.  **Evidentiality (Tuyuca-esque):** Speakers must mark source of knowledge (seen vs. heard) on every verb.
      *   *Fail:* This restricts *assertion* conditions, not the underlying thought; they can believe something without knowing how they know it.
  4.  **Identity Persistence (The Vael Case):** Language obligatorily marks whether an object persists via *Material Continuity* or *Formal Continuity*.
      *   *Select:* This targets the metaphysical structure of objecthood itself. If the grammar forces a binary choice on every reference, the thought that "identity is indeterminate" becomes grammatically inexpressible and, in this strong case, cognitively inaccessible.

  ***

  ### The Thought Experiment: The Vael Identity Partition

  The Vael are a community matched to English speakers in ecology, technology, and schooling, but their language obligatorily marks every noun phrase with one of two suffixes: *-vu* (indicating the referent persists via material continuity, i.e., same stuff) or *-te* (indicating persistence via formal continuity, i.e., same pattern/blueprint). You cannot refer to an object across time without committing to one mode of persistence. In a non-linguistic object-tracking task, participants watch a target object undergo a transformation where material and form diverge (e.g., a clay statue is melted and recast into a bowl; the matter is identical, the form is new). English speakers show physiological markers of cognitive conflict (pupil dilation, skin conductance) and hesitate to classify the outcome as "the same object," entertaining the proposition that the question has no determinate answer. Vael speakers show zero physiological conflict and instantly classify the outcome as either "same" or "different" based on which grammatical category they primed, never entertaining the indeterminacy. The fieldworker knows the thought is unavailable because the Vael never exhibit the cognitive signature of ambiguity resolution; they do not suppress the thought of indeterminacy, they lack the schema to generate it.

  ***

  ### Analysis of Positions

  **1. The Strong Whorfian**
  *   **Prediction:** The grammatical obligation creates a conceptual partition. Because the language provides no syntactic slot for "indeterminate identity" or "unitary identity," the cognitive system never develops the representational capacity to hold that proposition. The thought is not just unspoken; it is unthinkables.
  *   **Verdict:** This position is favored by the case. The absence of physiological conflict suggests the ambiguity is not perceived, not just ignored. The grammar has carved reality at joints that do not allow for the "blur" English speakers perceive.

  **2. The Universalist (Thought First)**
  *   **Prediction:** Concepts of identity are pre-linguistic and universal. Language is merely a dressing. The Vael *can* think the thought "identity is indeterminate" but their linguistic habits make it less accessible or less likely to be deployed in this specific task.
  *   **Verdict:** This position struggles. If the thought were available, even if dispreferred, we would expect some cognitive load when forcing a binary choice on an ambiguous stimulus (the cost of suppression). The lack of physiological conflict suggests the conflict isn't there to be suppressed. The Universalist must claim the Vael are somehow immune to the ambiguity that affects all other humans, which requires ad hoc assumptions about their non-linguistic cognition.

  **3. Language-as-Scaffolding / Cognitive-Technology**
  *   **Prediction:** Language is a tool that offloads cognitive work. The Vael lack the specific tool for representing indeterminate identity, so they perform poorly on tasks requiring it, but could acquire the tool with training.
  *   **Verdict:** Plausible, but weakens the "strong" claim. If it's just a missing tool, the thought is *available* but inefficient to process. The case stipulates the thought is *unavailable*. For the scaffolding view to hold, it must argue that without the scaffold, the cognitive structure collapses entirely, which edges back into Whorfianism.

  ***

  ### Causal Mechanism

  The mechanism is **Obligatory Ontological Parsing**. In most languages, categorizing an object's persistence is a optional, higher-order judgment. In Vael, it is a low-level perceptual gateway required to activate the noun concept itself. To think "pot," one must first think "same-stuff pot" or "same-form pot." This forces the cognitive system to resolve ambiguity at the moment of conceptual activation, preventing the ambiguity from ever reaching working memory as a unified problem. The grammar acts as a filter that removes the "indeterminate" option before the thought is fully formed.

  ### The Key Feature

  The single feature doing the work is **Obligatoriness**. If the marking were optional, speakers could choose a neutral form when faced with ambiguity, preserving the thought of indeterminacy. Because the grammar *forces* a choice on *every* noun phrase, there is no neutral ground. If you delete obligatoriness, the Vael could simply use a neutral marker for ambiguous cases, restoring the availability of the thought that "the question has no determinate answer."

  ### The Strongest Counterattack (Universalist) & Rebuttal

  **Counterattack:** The Universalist argues: "You haven't proven the thought is unavailable, only that it is *inert*. The Vael have the universal concept of indeterminate identity, but their linguistic training has created a high-threshold habit that overrides it in this task. If you trained them on a non-linguistic version of the task for long enough, the universal concept would emerge. You are confusing competence with performance."

  **Rebuttal:** This fails on the physiological evidence. Cognitive suppression costs energy; it shows up in reaction times and autonomic arousal. If the Vael were suppressing a universal intuition of indeterminacy to force a binary choice, they would show *higher* stress than English speakers who are allowed to hesitate. They show *none*. This indicates the intuition itself is missing, not the expression of it. Furthermore, the fieldworker's data shows that even when rewarded for choosing "unsure" in a non-linguistic button-press task, Vael participants do not learn the association—they genuinely do not perceive the stimulus as "unsure." A missing habit can be broken; a missing conceptual dimension cannot be learned without a scaffold to build it, and their grammar actively dismantles that scaffold.
