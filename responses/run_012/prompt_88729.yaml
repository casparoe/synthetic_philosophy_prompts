answer: |-
  1.  **The Molière Problem**
      You argue the target is theatrical structure, not moral content. But Rousseau spends pages dissecting *The Misanthrope*, complaining that Alceste is made to look ridiculous. Is his claim about what the play *means*, or about what audiences *do* with it?
      *Follow-up:* If she says it's about audience reception, ask what empirical fact would prove him wrong—would a different audience reaction invalidate the structural critique, or is the structure rigged to produce that reception regardless?

  2.  **The Mechanism of Harm**
      If theatre can't make anyone better, what's the actual mechanism by which it makes them worse? Can you explain that without quietly sliding back into a story about moral content?
      *Follow-up:* If she says it displaces pity from neighbors to characters, ask if that's just a utilitarian calculation about resource allocation, which implies the content (who we pity) matters after all.

  3.  **The Biographical Embarrassment**
      The man had a hit opera, *The Village Soothsayer*, a few years before this and kept writing music. Is that a loophole, a counterexample, or a distinction you can state cleanly in one sentence?
      *Follow-up:* If she says music isn't theatre, press her on why his later melodrama *Pygmalion* doesn't trigger the same alarm if the issue is fiction interposing between people.

  4.  **The Actors**
      Rousseau says the trade itself inclines actors toward lying. d'Alembert argued it's the contempt we dump on them that ruins them. Who's right, and does your reading even need the actor to be corrupted?
      *Follow-up:* If she says the corruption is inherent to the role, ask if that admits the content (the lying) matters after all, undermining the structural claim.

  5.  **d'Alembert's Proposal**
      d'Alembert suggests Geneva could have plays and morals both—Sparta's discipline plus Athens's polish. I want you to say why that's supposed to be impossible rather than just unlikely.
      *Follow-up:* If she says culture is holistic, ask why Geneva can't just choose Athens lightly without becoming Paris, unless the mediation itself forces the shift.

  6.  **The Alternative**
      He sketches open-air festivals instead of playhouses and thinks it's obviously better. Press you on whether that alternative escapes the criticism or just relocates the spectators.
      *Follow-up:* If she says there are no spectators in festivals, ask if the public eye isn't just a distributed spectator judging the participants, which sounds like mediation with better PR.

  7.  **The *Amour-Propre* Dilemma**
      My co-host worries this is just Rousseau on *amour-propre*—the desire to be admired. If the enemy is wanting to be admired then the theatre is incidental. If the enemy is representation, why isn't a festival just representation with better PR?
      *Follow-up:* If she insists they are distinct, ask her to identify a feature of the festival that isn't just a more efficient form of being seen.

  8.  **Modern Participation**
      Karaoke, immersive theatre, reality TV, livestreaming where the audience is the show. If the objection is to being a spectator then those should be improvements. I suspect they aren't. Are they?
      *Follow-up:* If she says participation helps, ask if livestreaming isn't just participation turned into a different mediation, proving the structure survives the interposition.

  9.  **Gender and Vanity**
      Does the argument survive dropping whatever assumptions about women and vanity it leans on, if it does lean on any?
      *Follow-up:* If she says the logic holds, ask what part of the mechanism breaks if you remove the gendered sphere of social influence he relies on to explain the corruption of taste.

  10. **The Political Price**
      End on this: Does your reading make him less of a censor, which is good for her, at the price of being a defence of the small, homogeneous, face-to-face republic, which is bad for her, especially since he's careful not to ask for Paris's theatres to be shut?
      *Follow-up:* If she says he's not a censor, ask if that makes his politics less universalizable, which might be bad for her project of reclaiming him for modern aesthetics.
