      *   **Criteria:** (a) Generalisation, (b) Norm of Assertion, (c) Explanatory Use, (d) Self-Application.
      *   **Additional Output:** One-line verdict on distinctness vs. costumes. Identify the "two live options" if the exercise is rigged.

  2.  **Analyze the Six Packages:**
      1.  *Redundancy:* (Ramsey) 'It is true that p' = 'p'. Very strong, very brittle.
      2.  *Disquotationalism:* (Quine) Truth predicate allows semantic ascent/generalization. Focus on sentences.
      3.  *Minimalism:* (Horwich) Truth is a property, but exhausted by the equivalence schema. Focus on propositions.
      4.  *Prosententialism:* (Grover, Camp, Belnap) 'True' is a pro-sentence. Linguistic function focus.
      5.  *Performative:* (Strawson/Ayer early) Saying 'true' is doing something (endorsing), not describing.
      6.  *Inferentialist/Expressive:* (Brandom/Price) Truth tracks normative status of assertion.

  3.  **Evaluate against Criteria (Mental Draft):**

      *   *(a) Generalisation:*
          *   Redundancy: Struggles. "Everything she said is true" isn't easily reduced to a finite conjunction.
          *   Disquotationalism: Good. That's Quine's main point (quantifying into sentence position).
          *   Minimalism: Good. Horwich builds it in.
          *   Prosententialism: Good. Anaphora handles generalization well.
          *   Performative: Struggles. Can I perform an act on a quantified set?
          *   Inferentialist: Good. Scorekeeping handles general commitments.

      *   *(b) Norm of Assertion:*
          *   Redundancy: Weak. If it's just redundant, why is denying it a criticism?
          *   Disquotationalism: Moderate. It's about sentences, norms are about speakers.
          *   Minimalism: Moderate. Property is too thin to ground norms robustly.
          *   Prosententialism: Moderate.
          *   Performative: Strong. It *is* a normative act.
          *   Inferentialist: Strongest. Truth *is* the normative scorekeeping.

      *   *(c) Explanatory Use:*
          *   Redundancy: No.
          *   Disquotationalism: No.
          *   Minimalism: Explicitly says no (Horwich).
          *   Prosententialism: No.
          *   Performative: No.
          *   Inferentialist: Maybe pragmatic explanation, but not causal.
          *   *Note:* Most deflationary theories fail here by design. But Inferentialism might salvage *pragmatic* explanation.

      *   *(d) Self-Application:*
          *   All deflationary theories risk pragmatic contradiction. If "Truth is deflated" is true, is it deflated?
          *   Minimalism: Horwich bites the bullet.
          *   Disquotationalism: Quinean naturalism saves it?
          *   Inferentialist: Best equipped to handle normative self-application.

  4.  **Develop the Tiers (Forcing Commitment):**

      *   *Top Tier:* Needs to handle generalization and norms best.
          *   **Inferentialist/Expressive:** Handles norms (b) best, handles generalization (a) via scorekeeping, handles self-application (d) as a normative commitment. Score: 9/10.
          *   **Minimalism:** The standard bearer. Handles generalization (a) well. Struggles on explanation (c) but admits it. Score: 8/10.
      *   *Middle Tier:* Good ideas, specific weaknesses.
          *   **Disquotationalism:** Great on generalization (a), weak on norms (b) because it's sentence-focused, not proposition/assertion focused. Score: 7/10.
          *   **Prosententialism:** Clever linguistic model, but feels like a technical fix rather than a metaphysical insight. Score: 6/10.
      *   *Bottom Tier:* Historically important but technically insufficient.
          *   **Performative:** Great on norms, fails hard on generalization (can't perform on a quantifier). Score: 4/10.
          *   **Redundancy:** Too crude. Fails generalization immediately. Score: 3/10.

  5.  **Drafting the Content (Tone Check):**
      *   Needs to be sharp. No "some philosophers argue." Use "This fails," "This succeeds."
