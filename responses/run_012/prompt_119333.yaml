      *Actually, Prosententialism handles generalization better than pure Disquotationalism.* Quine needs substitutional quantification which is controversial. Prosentences handle anaphora naturally. I'll swap them. Prosententialism 7, Disquotationalism 6.5? No, let's keep Disquotationalism higher because it's the core insight. Prosententialism is a specific implementation. Let's stick with Disquotationalism > Prosententialism.

