      *Final check on the "Two Live Options":* Minimalism (Horwich) and Inferentialism (Brandom/Price). These are the ones people actually argue about today. Redundancy is history. Performative is history. Disquotationalism is absorbed into Minimalism. Prosententialism is niche.

