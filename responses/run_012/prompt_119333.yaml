  # HANDOUT: DEFATIONARY TRUTH — COMMITMENT MATRIX
  **Reading Group Session 1 | No Hedging Allowed**

  The goal of this session is not to explore nuances. It is to identify which deflationary package survives contact with the actual work truth is required to do in philosophy. Below are the six standard candidates, tiered by viability.

  ## TIER 1: THE LIVE OPTIONS
  *These accounts have the structural integrity to handle generalisation and normativity without collapsing.*

  **1. Inferentialist / Expressive Accounts (Score: 9/10)**
  *   **The View:** 'True' is a normative operator that makes explicit the propriety of assertion and tracks commitments.
  *   **(a) Generalisation:** **Pass.** Handles quantification via scorekeeping of commitments ("I endorse all claims she is committed to").
  *   **(b) Norm of Assertion:** **Pass.** This is its home turf. Denying truth is explicitly a challenge to the speaker's entitlement to assert.
  *   **(c) Explanatory Use:** **Partial Pass.** Cannot explain success causally, but explains successful *coordination* among agents.
  *   **(d) Self-Application:** **Pass.** The thesis is a normative commitment to a way of talking, not a description of the world. Avoids the trap.

  **2. Minimalism (Score: 8/10)**
  *   **The View:** (Horwich) Truth is a genuine but shallow property, exhausted by the equivalence schema (<p> is true iff p).
  *   **(a) Generalisation:** **Pass.** The schema is axiomatised to allow quantification over propositions.
  *   **(b) Norm of Assertion:** **Weak Pass.** Explains criticism only derivatively (asserting what isn't true is asserting what isn't the case).
  *   **(c) Explanatory Use:** **Fail.** Explicitly denies truth has explanatory power. (Whether this is a bug or feature is the debate).
  *   **(d) Self-Application:** **Risky.** If the thesis is "minimally true," it lacks force. If "substantially true," it contradicts itself.

  ## TIER 2: THE TECHNICAL FIXES
  *These solve specific linguistic problems but fail to capture the philosophical function of truth.*

  **3. Disquotationalism (Score: 6/10)**
  *   **The View:** (Quine) Truth is a device for semantic ascent; ''p' is true' cancels quotation marks.
  *   **(a) Generalisation:** **Pass.** This was Quine's specific motivation (quantifying into sentence position).
  *   **(b) Norm of Assertion:** **Fail.** Focused on sentences, not speakers. Doesn't explain why calling a claim "false" is a rebuke.
  *   **(c) Explanatory Use:** **Fail.** Truth is logically eliminable; it explains nothing.
  *   **(d) Self-Application:** **Fail.** The thesis relies on a substantive notion of reference to explain disquotation.

  **4. Prosententialism (Score: 5/10)**
  *   **The View:** (Grover, Camp, Belnap) 'That is true' is a prosentence inheriting content anaphorically, like pronouns.
  *   **(a) Generalisation:** **Pass.** Anaphora handles quantification elegantly.
  *   **(b) Norm of Assertion:** **Weak.** Treats truth as grammatical inheritance, not normative status.
  *   **(c) Explanatory Use:** **Fail.** Purely syntactic/semantic mechanism.
  *   **(d) Self-Application:** **Fail.** The theory itself is not a prosentence; it claims to be a substantive description of grammar.

  ## TIER 3: THE HISTORICAL RELICS
  *Philosophically instructive but technically dead. Do not build a thesis on these.*

  **5. The Early Performative Line (Score: 3/10)**
  *   **The View:** (Strawson/Ayer) Uttering 'true' is an act of endorsement, not a description.
  *   **(a) Generalisation:** **Fail.** You cannot perform a speech act on a quantified variable ("I endorse everything...").
  *   **(b) Norm of Assertion:** **Pass.** Strong on the immediate act of agreement.
  *   **(c) Explanatory Use:** **Fail.** Performatives don't explain outcomes.
  *   **(d) Self-Application:** **Fail.** Is the theory itself a performance or a description?

  **6. The Redundancy Line (Score: 2/10)**
  *   **The View:** (Ramsey) 'It is true that p' says no more than 'p'.
  *   **(a) Generalisation:** **Fail.** "Everything she said is true" cannot be reduced to a finite conjunction of claims.
  *   **(b) Norm of Assertion:** **Fail.** If 'true' is redundant, denying it should be redundant, not critical.
  *   **(c) Explanatory Use:** **Fail.** Eliminativist about the predicate.
  *   **(d) Self-Application:** **Fail.** If the theory is true, it is redundant, and thus says nothing.

  ***

  ### THE VERDICT

  **Are these six separate positions?**
  No: Redundancy, Disquotationalism, Prosententialism, and Performative are merely different linguistic costumes for the same logical insight; Minimalism and Inferentialism are the only distinct metaphysical rivals.

  **If this exercise is rigged, which are the two live options?**
  **Minimalism vs. Inferentialism.**
  *Choose Minimalism* if you think truth is a property that must be preserved for logic but stripped of metaphysics.
  *Choose Inferentialism* if you think truth is a tool for social coordination that Minimalism mistakenly reifies as a property.

  **Instruction for the Group:** Pick one. Defend it against the criteria where it scored a "Fail" or "Risky." If you cannot, move to the other Tier 1 option. If neither works, you are not a deflationist.
