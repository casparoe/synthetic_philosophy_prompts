  # Final Examination Question: Safe Pareto Improvements in Delegated Play

  **Time Allowed:** 60–75 minutes
  **Total Marks:** 20

  **Scenario:**
  Consider a one-shot Prisoner's Dilemma played by Row and Column. Payoffs are: Mutual Cooperation (C,C) $\to$ (3,3); Row Cooperates/Column Defects (C,D) $\to$ (0,5); Row Defects/Column Cooperates (D,C) $\to$ (5,0); Mutual Defection (D,D) $\to$ (1,1).

  Row and Column delegate their moves to programs submitted in advance. A program may read the opponent's source code and output C or D.
  *   **Default Program ($d$):** Outputs D regardless of the opponent.
  *   **Candidate Program ($p$):** Outputs C if and only if the opponent program, when run against $p$, outputs C. Otherwise, $p$ outputs D.

  **Definition:** Program $p$ is a **Safe Pareto Improvement (SPI)** over $d$ relative to a set of opponent programs $Q$ if:
  1.  For every $q \in Q$, the payoff pair $(p, q)$ weakly Pareto-dominates $(d, q)$ (both players receive at least as much, one strictly more).
  2.  For at least one $q \in Q$, $(p, q)$ strictly Pareto-dominates $(d, q)$.

  **Questions:**

  **(a) [7 marks]** Let $Q_1 = \{ \text{AllC, AllD, Mirror} \}$, where **AllC** always outputs C, **AllD** always outputs D, and **Mirror** outputs whatever the opponent outputs against it. (Assume that when $p$ faces Mirror, they coordinate on (C,C)).
  Determine whether $p$ is an SPI over $d$ relative to $Q_1$. You must explicitly compute the payoff pairs for $(d, q)$ and $(p, q)$ for each $q \in Q_1$ to justify your conclusion.

  **(b) [7 marks]** Now let $Q_2$ be the set of **all possible programs**. Determine whether $p$ is an SPI over $d$ relative to $Q_2$. If it is not, exhibit a specific counterexample program $q^* \notin Q_1$ (distinct from AllC, AllD, and Mirror) that violates the SPI condition, and calculate the resulting payoffs.

  **(c) [6 marks]** Consider a weaker definition: $p$ is an improvement if $(p, q)$ weakly Pareto-dominates the **default outcome of mutual defection (1,1)** for all $q$, and strictly dominates it for some $q$.
  Explain why this weaker definition fails to capture the motivation for "Safe Pareto Improvements." Specifically, discuss what risk the official definition guards against that the weaker definition ignores, referencing your results from parts (a) or (b).

  ***

  # Model Answer

  **(a) Analysis relative to $Q_1$**
  To determine if $p$ is an SPI over $d$ relative to $Q_1$, we calculate the payoff pairs for Row and Column. Recall $d$ always Defects. $p$ Cooperates only if the opponent Cooperates against $p$.

  1.  **Opponent AllC:**
      *   $(d, \text{AllC})$: Row plays D, Col plays C. Payoffs: **(5, 0)**.
      *   $(p, \text{AllC})$: AllC plays C against $p$. $p$ sees C and plays C. Payoffs: **(3, 3)**.
      *   *Comparison:* (3,3) does **not** Pareto-dominate (5,0) because Row's payoff decreases ($3 < 5$).

  2.  **Opponent AllD:**
      *   $(d, \text{AllD})$: Row D, Col D. Payoffs: **(1, 1)**.
      *   $(p, \text{AllD})$: AllD plays D against $p$. $p$ sees D and plays D. Payoffs: **(1, 1)**.
      *   *Comparison:* (1,1) weakly Pareto-dominates (1,1) (equal).

  3.  **Opponent Mirror:**
      *   $(d, \text{Mirror})$: Row D, Mirror copies D. Payoffs: **(1, 1)**.
      *   $(p, \text{Mirror})$: Assumed coordination on C. Payoffs: **(3, 3)**.
      *   *Comparison:* (3,3) strictly Pareto-dominates (1,1).

  **Conclusion:** Although $p$ improves outcomes against AllD and Mirror, it fails against AllC. Since the SPI condition requires weak Pareto dominance for **every** $q \in Q$, $p$ is **not** an SPI over $d$ relative to $Q_1$. The presence of the Unconditional Cooperator makes the switch unsafe for Row.

  **(b) Analysis relative to $Q_2$ (All Programs)**
  Since $Q_1 \subset Q_2$ and $p$ failed relative to $Q_1$ (specifically due to AllC), $p$ cannot be an SPI relative to $Q_2$. However, to demonstrate the vulnerability of the universal set, we exhibit a distinct counterexample $q^*$.

  Let $q^*$ be a program defined as: "If the opponent is $d$, output C. If the opponent is $p$, output D."
  *   **$(d, q^*)$:** Row plays D. $q^*$ identifies $d$ and plays C. Payoffs: **(5, 0)**.
  *   **$(p, q^*)$:** Row plays $p$. $q^*$ identifies $p$ and plays D. $p$ sees D and plays D. Payoffs: **(1, 1)**.
  *   **Comparison:** (1,1) does not Pareto-dominate (5,0). Row loses 4 points.

  This shows that against the set of all programs, $p$ is highly unsafe. Any program that exploits Row's willingness to cooperate (by cooperating against $d$ but defecting against $p$) creates a loss for Row relative to the default. Thus, $p$ is **not** an SPI relative to $Q_2$.

  **(c) Critique of the Weaker Definition**
  The weaker definition compares $(p, q)$ only against the fixed outcome (1,1), rather than against the default strategy's outcome $(d, q)$. This misses the core strategic risk of delegation: **opponent adaptation.**

  In Part (a), against AllC, the outcome (3,3) is better than mutual defection (1,1). Under the weaker definition, $p$ would count as an improvement. However, relative to the default strategy $d$, Row actually loses utility (dropping from 5 to 3). A rational delegator would not switch to $p$ if they believed AllC was a plausible opponent, because $d$ secures a higher payoff against such naive opponents.

  The official SPI definition requires $(p, q) \succeq (d, q)$ to ensure that switching to $p$ never makes the delegator worse off than sticking with $d$, regardless of the opponent's behavior. The weaker definition ignores the opportunity cost of abandoning the default strategy's exploitative potential. "Safety" in SPI means robustness against the specific counterfactual of what the default would have achieved, not just robustness against the worst-case game outcome.

  ***

  # Marking Scheme

  **Total: 20 Marks**

  **Part (a): Restricted Set Analysis (7 Marks)**
  *   **1 Mark:** Correctly identifies payoffs for $(d, \text{AllC})$ as (5,0) and $(p, \text{AllC})$ as (3,3).
  *   **1 Mark:** Correctly identifies payoffs for $(d, \text{AllD})$ as (1,1) and $(p, \text{AllD})$ as (1,1).
  *   **1 Mark:** Correctly identifies payoffs for $(d, \text{Mirror})$ as (1,1) and $(p, \text{Mirror})$ as (3,3).
  *   **2 Marks:** Correctly applies Pareto dominance logic to the AllC case (noting $3 < 5$ for Row means no dominance).
  *   **2 Marks:** Explicit conclusion that $p$ is **not** an SPI relative to $Q_1$, citing the failure against AllC as the reason.
      *   *Error:* Claiming it is an SPI because (3,3) > (1,1) generally (ignoring the specific comparison to $d$). Deduct 2 marks.
      *   *Error:* Miscalculating $d$ vs AllC as (1,1). Deduct 1 mark.

  **Part (b): Universal Set Analysis (7 Marks)**
  *   **2 Marks:** Correctly states $p$ is **not** an SPI relative to $Q_2$.
  *   **3 Marks:** Exhibits a valid counterexample program $q^*$ distinct from $Q_1$ (e.g., "Cooperates against $d$, Defects against $p$").
  *   **2 Marks:** Calculates payoffs for $q^*$ showing Row is worse off with $p$ than $d$ (e.g., (1,1) vs (5,0)).
      *   *Error:* Using AllC as the only counterexample without acknowledging it was already in $Q_1$. Deduct 1 mark (question asked for distinct program).
      *   *Error:* Arguing that no counterexample exists. Deduct 5 marks.

  **Part (c): Conceptual Understanding (6 Marks)**
  *   **2 Marks:** Explains that the weaker definition compares against a fixed baseline (1,1) rather than the strategy-dependent baseline $(d, q)$.
  *   **2 Marks:** Identifies the specific risk ignored: The loss of payoff against opponents that $d$ exploits (like AllC).
  *   **2 Marks:** Articulates the motivation for "Safe": Ensuring the switch never harms the delegator relative to their status quo strategy, regardless of opponent type.
      *   *Error:* Defining Pareto dominance incorrectly. Deduct 1 mark.
      *   *Error:* Focusing only on Column's payoff. Deduct 1 mark.
      *   *Error:* Treating the set $Q$ as fixed by nature rather than a modeling choice. Deduct 1 mark.

  **General Penalties:**
  *   **Citation Penalty:** If the student cites external literature (e.g., "Oesterheld 2019") instead of using the provided definitions. Deduct 2 marks.
  *   **Clarity:** If the payoff pairs are not explicitly stated as ordered tuples. Deduct 1 mark total.
