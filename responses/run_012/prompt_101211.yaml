answer: |-
  **Prospectus: The Coherence of Work and Leisure Rights**

  **Research Question and Disambiguation**
  This project asks whether the "right to work" and the "right to leisure" are normatively distinct or conceptually unitary. The phrase "right to work" is ambiguous: it may mean (1) a guarantee of employment, (2) a liberty to labor rather than be idle, or (3) a duty against compelled idleness. This paper focuses on meaning (1): the institutional guarantee of access to employment. The central problem is whether guaranteeing (1) without enforceable hour limits renders the "right to leisure" incoherent. If rest is treated as a reward for discharged labor rather than a precondition of capacity, does the right to work logically consume the right to leisure?

  **Limitations of Standard Framings**
  Current discourse treats these rights separately, leaving the core contradiction unresolved. Labour-rights frameworks treat hour limits as protective constraints on employment, not constitutive of it. Liberal-neutralist accounts treat the work/leisure balance as a matter of individual preference, ignoring structural coercion within the employment contract. Productivity frameworks treat rest as an input for efficiency, not a normative claim. All three leave open the possibility that one can fully possess the right to work while being denied the capacity to rest. Consequently, they fail to address the scenario where a firm guarantees unlimited overtime and unlimited unpaid leave simultaneously: rights are present on paper, yet exhaustion is inevitable.

  **Methodology**
  This is conceptual analysis, not empirical policy study. A case study of specific firms would demonstrate *that* exhaustion occurs, but not *why* the rights structure permits it. The method involves: Weeks 1–2 mapping competing definitions of work-rights; Weeks 3–4 reconstructing the "rest-as-reward" versus "rest-as-precondition" assumptions; Weeks 5–6 applying this framework to the thought experiment of the unlimited overtime/leave firm; Weeks 7–10 drafting and refining the argument regarding how the traditional ethic linking labor to moral virtue masks this inconsistency. This approach isolates the normative logic rather than getting bogged down in jurisdictional variations.

  **Success and Failure Conditions**
  Success is demonstrating that unlimited access to work logically corrodes the capacity to exercise leisure, proving the rights are unitary and requiring enforceable limits for coherence. Failure would be establishing that the rights are genuinely separable (i.e., one can meaningfully have a right to work even if it consumes all capacity for leisure) or that the contradiction is merely contingent rather than conceptual.

  **Scope Assessment**
  For 5,000 words, a historical genealogy of the ethic linking labor to virtue is too large. To remain feasible, I will treat this ethic not as a historical survey but as a contemporary normative premise that needs dismantling. The focus will remain on the logical structure of the rights, using the ethic only to explain the persistence of the error, not its origin. This ensures the argument remains a philosophical reconstruction rather than a historical overview.

  \question{Are the right to employment and the right to leisure distinct entitlements, or does the former logically require enforceable limits to preserve the latter?}
