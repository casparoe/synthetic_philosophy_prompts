answer: |-
  Two evolutionary biologists, Dave and Sarah, are in a pub. Dave slides a Kilner jar across the table.

  'What's that?' asks Sarah.

  'A free-floating rationale. Found it near a cuckoo chick.'

  'Whose is it?'

  'No one's. The chick doesn't know it, the host denies it, and the genes can't hold it.'

  'So it's a reason without a reasoner?'

  'Exactly. Objectively sound, subjectively homeless.'

  Sarah pushes the jar back. 'Well, you can't leave it here.'

  'Why not?'

  'House rules. If no one's standing behind it, it's getting binned.'

  ***

  **Note**

  **Liberties taken:** The joke relies on heavy reification—treating the rationale as a physical object that can be jarred, slid, and binnded. This leans into the contested metaphysical reading (that the reason is a *thing* in the world) rather than the deflationary view (that it's merely a useful explanatory stance for the observer).

  **Confidence:** I'm fairly confident this lands for someone familiar with Dennett or the specific literature on FFRs, as the punchline hinges on the double meaning of "standing behind" (physical location vs. epistemic endorsement), which is the core tension in the debate.

  **Least sure about:** Whether the pub setting distracts from the biological specificity; there's a risk the "binning" reads as generic rejection rather than a comment on the ontological status of unowned reasons.
