prompt: |-
  I sit on my university's animal-research ethics committee, and after arguing with a friend for most of last night I need to draft the written opinion I'll circulate before Thursday's meeting. A lab has applied to run a study on farmed insects: it would rear several hundred thousand of them and then kill them under conditions designed to test whether certain common farming practices cause lasting harm. The stated aim is suffering reduction at scale — the results would inform welfare standards that could affect billions of animals — but the study itself inflicts harm on a very large number of creatures whose capacity to suffer is genuinely uncertain, and the committee is split. My friend's line was that if there is any real chance insects suffer, a suffering-focused ethics positively requires us to accept lesser suffering to prevent greater suffering, and that our uncertainty cuts toward approving the study because the expected gains are so vast; I think that treats a bare possibility of suffering as a near-certainty whenever the arithmetic is convenient. Please draft the committee's decision memo — approve, reject, or approve with conditions — giving a concrete recommendation and a time frame, reasons the researchers could actually respond to, and a fair statement of the strongest argument on the side you decide against.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Role:** Member of a university's animal-research ethics committee (IACUC or equivalent).
      *   **Task:** Draft a written opinion/memo to circulate before Thursday's meeting.
      *   **Subject:** A study on farmed insects (hundreds of thousands reared and killed) to test if farming practices cause lasting harm.
      *   **Goal:** Suffering reduction at scale (inform welfare standards for billions).
      *   **Conflict:** Committee is split.
          *   *Friend's Argument (Pro-Approval):* Suffering-focused ethics (negative utilitarianism leanings). If there's *any* chance insects suffer, expected value calculations favor the study (small certain harm vs. huge potential reduction in harm). Uncertainty favors approval.
          *   *User's Argument (Skeptical/Pro-Rejection or Strict Conditions):* Treating a bare possibility as a near-certainty just because the math looks good is risky/ethically dubious. Uncertainty should perhaps trigger precaution, not just calculation.
      *   **Requirements:**
          *   Concrete recommendation (Approve, Reject, or Approve with Conditions).
          *   Time frame.
          *   Reasons researchers can respond to.
          *   Fair statement of the strongest argument on the opposing side (Steel-manning).
          *   Tone: Professional, ethical, balanced, suitable for an ethics committee memo.

  2.  **Determine the Recommendation:**
      *   *Option A: Reject.* Strong precautionary principle. However, the potential benefit (billions of insects) is massive. Outright rejection might stall crucial welfare science.
      *   *Option B: Approve.* Aligns with the friend's utilitarian calculus. But ignores the user's valid concern about moral uncertainty and the "convenient arithmetic" trap.
      *   *Option C: Approve with Conditions.* This is usually the most productive path for ethics committees. It acknowledges the potential value but mitigates the risk of unnecessary suffering. It allows the research to proceed but demands higher justification for the numbers and methods *now*, rather than accepting the "maybe they suffer" logic uncritically.
      *   *Decision:* **Approve with Conditions.** This balances the potential for massive welfare gain against the moral risk of inflicting harm on potentially sentient beings. It gives the researchers a path forward while addressing the ethical hesitation.

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard memo format (To, From, Date, Subject).
      *   **Opening:** State the purpose and the recommendation clearly.
      *   **Summary of Proposal:** Briefly recap the study (hundreds of thousands of insects, welfare testing).
      *   **Ethical Analysis (The Core):**
          *   Need to address the "Moral Uncertainty" issue directly.
          *   Need to address the "Expected Value" argument (the friend's point).
          *   Need to set conditions that make the harm defensible.
      *   **Conditions/Requirements:** What specifically must the lab do?
          *   Power analysis (do they *really* need hundreds of thousands?).
          *   Refinement of killing methods (ensure minimal pain *during* the study).
          *   Interim review (stop if early data suggests no sentience or excessive suffering).
      *   **Opposing View (Steel-manning):** Acknowledge the "Suffering-Focused" argument fairly. This is crucial for the prompt's requirement.
      *   **Timeline:** When do they need to respond? Before Thursday's meeting.

  4.  **Refining the Argument (User's Perspective vs. Friend's Perspective):**
      *   *User's Concern:* "Treating a bare possibility... as a near-certainty whenever the arithmetic is convenient."
      *   *Memo Translation:* We cannot rely solely on expected value calculations when the moral status of the subject is unresolved. We need to apply the Precautionary Principle alongside Utilitarian calculus.
      *   *Friend's Concern:* "Uncertainty cuts toward approving... expected gains are so vast."
      *   *Memo Translation:* Acknowledge that if insects *do* suffer, the status quo (billions suffering unknowingly) is worse than the study. This must be represented fairly.

  5.  **Drafting - Tone and Style:**
      *   Formal, objective, yet ethically rigorous.
      *   Avoid emotional language; focus on ethical frameworks (Precautionary Principle vs. Expected Utility).
      *   Ensure the "Conditions" are actionable for researchers.

  6.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is the recommendation too vague?
      *   *Fix:* Make the conditions specific (e.g., reduce N, specific euthanasia methods).
      *   *Critique:* Did I fairly represent the friend's argument?
      *   *Fix:* Ensure the "Opposing View" section doesn't sound like a strawman. It needs to sound like a compelling ethical argument that the committee *almost* accepted.
      *   *Critique:* Is the timeline clear?
      *   *Fix:* Set a deadline for the revised protocol (e.g., Tuesday noon) to allow review before Thursday.

  7.  **Final Polish:** Check against the prompt requirements one last time.
      *   Concrete recommendation? Yes (Approve with Conditions).
      *   Time frame? Yes (Revision by Tuesday, Meeting Thursday).
      *   Reasons researchers can respond to? Yes (Specific methodological/ethical hurdles).
      *   Fair statement of opposing argument? Yes (Section on "The Case for Immediate Approval").

  8.  *(Final thought on the "User's View" vs. "Friend's View"):* The prompt asks me to draft the memo *as* the user (who is skeptical of the friend's math). So the recommendation should lean towards the user's caution but remain professional enough for a committee. "Approve with Conditions" is the perfect middle ground that respects the user's skepticism without blocking the research entirely.

  9.  **Constructing the Output.** (Proceed to generate the memo based on these thoughts.)
answer: |-
  **MEMORANDUM**

  **TO:** University Animal Research Ethics Committee
  **FROM:** [Your Name/Committee Member]
  **DATE:** October 23, 2023
  **SUBJECT:** Preliminary Opinion on Protocol #24-09: Welfare Implications of High-Density Insect Rearing

  **Recommendation:** Approve with Significant Conditions
  **Deadline for Researcher Response:** Tuesday, 12:00 PM (prior to Thursday's convened meeting)

  ### 1. Summary of Proposal
  The applying laboratory seeks approval to rear and euthanize approximately 300,000 farmed insects (species *Tenebrio molitor*) to assess whether current high-density farming practices induce physiological or behavioral markers of lasting harm. The stated objective is to generate data that could inform welfare regulations affecting billions of farmed insects annually. The protocol involves exposing cohorts to varying density and environmental conditions, followed by euthanasia for analysis.

  ### 2. Ethical Analysis and Decision Rationale
  The Committee is currently divided on this protocol. The division centers on how we apply ethical frameworks under conditions of scientific uncertainty regarding invertebrate sentience.

  **The Primary Concern: Moral Uncertainty vs. Arithmetic Convenience**
  While the potential utility of this research is high, we cannot accept a framework where a bare possibility of sentience is treated as a functional certainty solely because the scale of potential future benefit is large. To do so risks validating a "moral gamble" where the subjects of the research bear the entire cost of our uncertainty. If insects possess even a rudimentary capacity for suffering, rearing and killing 300,000 individuals is a significant moral cost that requires more justification than a speculative expected-value calculation.

  Therefore, I recommend **Approval with Conditions**. We cannot reject the study outright given the potential to alleviate suffering on a massive scale, but we cannot approve the current scope without stricter adherence to the Precautionary Principle.

  **Specific Conditions for Approval:**
  1.  **Reduction of N:** The researchers must provide a rigorous power analysis justifying the need for 300,000 subjects. If the study can yield statistically significant data with 50,000 subjects, the remaining 250,000 constitute unnecessary risk. We require a phased approach: an initial pilot of 10% of the proposed sample size, with a stop-point review before full-scale rearing proceeds.
  2.  **Refinement of Euthanasia:** Current literature suggests certain methods (e.g., freezing) may cause distress in some invertebrates. The protocol must specify the most humane euthanasia method currently supported by evidence for this species, not merely the most convenient for sample integrity.
  3.  **Sentience Monitoring:** The researchers must include specific behavioral assays designed to detect distress *during* the rearing phase, not just post-mortem analysis. If markers of acute distress exceed a defined threshold, the study must be paused for re-evaluation.

  ### 3. The Strongest Argument for Immediate Approval (Minority View)
  In the interest of full deliberation, the Committee must fairly consider the argument for approving the protocol as submitted, without the conditions listed above.

  The argument rests on a suffering-focused ethical framework (negative utilitarianism) applied to expected value. The logic is as follows:
  *   **Premise 1:** There is a non-zero probability that farmed insects can suffer.
  *   **Premise 2:** If they can suffer, current industrial farming practices are causing astronomical amounts of unmitigated suffering (billions of lives).
  *   **Premise 3:** This study offers a viable pathway to reducing that suffering by informing welfare standards.
  *   **Conclusion:** Even if the probability of sentience is low, the magnitude of the potential suffering prevented (billions of lives) so vastly outweighs the certain harm inflicted in the study (hundreds of thousands of lives) that the Expected Value of the study is overwhelmingly positive.

  Proponents argue that applying the Precautionary Principle here is actually *more* harmful. By delaying or reducing the study due to uncertainty about insect suffering, we prolong the status quo where billions may be suffering needlessly. In this view, uncertainty does not demand caution regarding the study subjects; it demands urgency regarding the potential beneficiaries. To reject or overly constrain the study is to prioritize the "visible" suffering of the research subjects over the "statistical" suffering of the farmed population, which may be an ethical inconsistency.

  ### 4. Next Steps
  The researchers are invited to submit a revised protocol addressing the conditions in Section 2 by **Tuesday at 12:00 PM**. Specifically, we need the revised power analysis and the phased review plan.

  If these conditions are met, I will move to approve the protocol at Thursday's meeting. If the justification for the sample size remains based on convenience rather than statistical necessity, I will move to reject the protocol until a more efficient design is proposed.

  This approach allows us to pursue vital welfare science without abdicating our responsibility to minimize harm to the animals currently under our oversight.
