prompt: |-
  Hi — I'm a 4th-year PhD student (philosophy, but I spend most of my time with the cogsci/AI crowd) and I need a hand with something for the course I'm TAing next term. I'd like you to take off the helpful-assistant hat and put on the hat of someone who really knows the action-and-change literature in AI *and* knows how to write about film — a philosopher of mind who also does criticism, say. Think carefully before you commit. Please brainstorm two or three candidate readings first, say why you're ditching the others, and only then give me the one you'd actually defend.

  Here's the situation. The unit is on the frame problem, and every year someone brings up Memento (Nolan, 2000) and every year we end up with the same personal-identity reading — Leonard isn't the same person as the Leonard who wrote the notes, memory makes identity, and so on — which is fine, but it's definately not what I want the film in the syllabus for. I want a reading of it through the frame problem. I don't need a bibliography, I know the literature; what I want is the reading.

  Just so we're aligned on what I mean, since people use the phrase loosely: the frame problem in the narrow sense is McCarthy and Hayes's problem of how a system represents everything that does *not* change when an action is performed, without needing a separate non-change axiom for every fact and every action. The harder, philosophical version is the problem of relevance — how a system is supposed to know which handful of its beliefs bear on the question in front of it, and how it's supposed to give up a default (things persist, the info I've got is still good) exactly when it should and not a moment sooner. The Yale shooting problem is the classic embarrassment for the obvious fix — minimize the changes — where the turkey ends up alive because the minimizer is allowed to unload the gun instead. And there's the sibling qualification problem: listing all the conditions under which an action will actually do what you want.

  Things I'd like you to actually address:

  1. Leonard's apparatus — tattoos, Polaroids, annotations — as a hand-built, nonmonotonic knowledge base. Is the amnesia doing the work of the frame problem here, or is it doing something else and we're just pattern-matching?
  2. He pre-compiles his own frame axioms at design time and pays for it: he can't revise relevance on the fly, so whoever writes to the base controls him. I've got a half-formed thesis that this is the film's real contribution — that the frame problem bottoms out in a question of who holds authority over the relevance judgments, and that every solution has a social cost. Test that properly, don't just agree with me.
  3. The turn at the end, where he learns the truth and then edits his own records so his future self will do what he wants. Frame problem, qualification problem, neither — or just self-deception dressed up?
  4. The reverse structure. Does it put us in his epistemic position in a way that illuminates the problem, or is it an aesthetic effect we've all retro-fitted philosophy onto?
  5. The Sammy Jankis thread, if it earns its place.

  And the thing I care about most: where does the film resist the reading? If the honest verdict is that Memento is really about memory and trust rather than relevance and updating, say so and tell me what it illustrates better. But if there's something it shows that the papers don't — say, about how an agent's own actions feed back into what's relevant to it, or about the fact that a frozen frame is always *someone's* frozen frame — put that at the end.

  One constraint: neither of us can check anything against the screenplay, so don't quote dialogue, and if you're not sure a scene goes the way you remember, flag it rather than inventing details.
