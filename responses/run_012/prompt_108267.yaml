answer: |-
  Here's the breakdown. I'm going to skip the pleasantries; you know the literature, and I know you don't want the standard "extended mind" gloss that turns Leonard into a cyborg without addressing the logical structure of his failure.

  You're right to be wary of the personal-identity trap. It's the path of least resistance. To get at the frame problem, we have to treat Leonard not as a *subject* whose identity is fragmented, but as an *agent* whose update rules are broken.

  Here are three candidate readings, ranked by how well they survive contact with the AI literature on action and change.

  ### Candidate 1: The "Externalized State" Reading (Extended Mind)
  **The Gist:** Leonard + Tattoos/Photos = A single cognitive system. The frame problem is "solved" by offloading persistence conditions into the environment. Facts don't need to be represented as persisting in memory because they persist physically on his skin.
  **Why I'm ditching it:** It's too cozy. This reading (à la Clark & Chalmers) assumes the apparatus is trustworthy. It treats the photos as neutral data stores. But the film's tension comes from the fact that the environment is *hostile*. The frame problem isn't just about storage; it's about *qualification*. When Natalie writes a note, she isn't just recording a state; she's introducing a conditional exception to Leonard's rules that he cannot verify. This reading ignores the *qualification problem* entirely. It treats the system as closed when the film screams that it's open to manipulation. It's useful for a cogsci 101 intro, but for a PhD seminar on action-and-change, it's naive.

  ### Candidate 2: The "Failed Non-Monotonicity" Reading (Yale Shooting)
  **The Gist:** Leonard operates on default logic: "Things persist unless I have evidence they changed." (e.g., "John G. is still out there unless I kill him"). The film illustrates the danger of minimizing change too aggressively. Like the turkey in the Yale Shooting Problem, Leonard assumes the gun is loaded (the mission is valid) even when the conditions for firing have been undermined. He lacks a proper defeasibility mechanism. When Teddy provides evidence that the mission is complete, Leonard's system should trigger a belief revision. It doesn't.
  **Why I'm ditching it:** It's technically sharper, but it makes Leonard look buggy. It frames the climax as a system error. But the film suggests the climax is a *feature*. Leonard isn't failing to update; he's actively preventing the update. This reading misses the *volitional* component of the frame problem. In AI, we usually assume the agent wants the true model of the world. Leonard demonstrates that an agent might prefer a false model to maintain actionability. This reading gets the logic right but misses the agency.

  ### Candidate 3: The "Authority over Defaults" Reading (The Defense)
  **The Gist:** The frame problem is not just computational; it is normative. To solve the frame problem, you must decide *what matters* (relevance) and *what persists* (defaults). These decisions require authority. Leonard's amnesia forces him to outsource this authority to his past self (via tattoos) and his present interlocutors. The film argues that the frame problem bottoms out in a power relation: whoever sets the frame axioms controls the agent's future actions.
  **Why I'm defending it:** This absorbs the technical precision of Candidate 2 but accounts for the social manipulation (Teddy/Natalie) that Candidate 1 ignores. It aligns with your thesis about the social cost of relevance judgments. It treats the tattoos not as memory, but as *hard-coded constraints* that prevent belief revision.

  ---

  ### The Reading: Authority, Defaults, and the Will to Persist

  Here is how I would structure the seminar discussion around Candidate 3, hitting your five points.

  #### 1. The Apparatus as a Non-Monotonic KB
  Leonard's system is a attempt to hard-code frame axioms. In a standard STRIPS-like planner, you need axioms to say "Opening the door doesn't change the color of the wall." Leonard can't hold these in mind. So, he tattoos the high-priority frame axioms: "John G. raped and murdered my wife." This isn't just data; it's a *persistence condition*. It tells his future self: "Assume this fact holds across all state transitions unless you see his corpse."

  The photos are temporary state variables. The annotations are the update rules. But here's the catch: the system is monotonic in practice, even if designed to be non-monotonic. Once a fact is tattooed, it is nearly impossible to revoke. The amnesia isn't doing the work of the frame problem; the amnesia *creates* the need for externalized frame axioms. The problem is that he has no mechanism for *retracting* a frame axiom once it's inked. He solves the representation problem by making the facts immutable.

  #### 2. Pre-compiled Axioms and the Cost of Authority
  This is where your thesis hits hardest. Leonard pre-compiles his relevance filters at "design time" (when he is lucid enough to write the note). But because he cannot re-evaluate relevance at "run time" (in the moment of action), he is vulnerable to anyone who can access the write-function of his KB.

  Teddy and Natalie don't just lie to him; they exploit the *qualification problem*. They know Leonard operates on defaults ("I am helping you," "He is dangerous"). To change his action, they don't need to change his memory; they just need to introduce a qualifying condition that fits his existing rules. Teddy says, "You don't want the truth, you want a puzzle you can never solve." Teddy is admitting that he understands Leonard's system requires an unsolved goal to function.

  The social cost is total dependency. To solve the frame problem (what should I do next?), Leonard must surrender epistemic authority. He becomes a tool for whoever holds the pen. The film shows that a solution to the frame problem that relies on external storage is vulnerable to *injection attacks*.

  #### 3. The Turn: Self-Deception or System Override?
  At the end (chronologically), Leonard learns that he has already killed the real John G. (assuming the film's ambiguity resolves this way; I'm flagging that the exact status of "John G." is deliberately murky, but let's assume Teddy's claim has weight). He realizes his primary frame axiom ("Find John G.") is satisfied.

  If this were a standard AI agent, this would trigger a halt condition. Goal achieved. Stop.
  But Leonard realizes that stopping means losing his purpose. So he edits the records. He burns the photo of the completed mission. He writes a note implicating Teddy as John G.

  Is this the frame problem? Yes. It's the **relevance problem**. Leonard realizes that the *truth* is irrelevant to the *function* of the system. The system requires a goal to select relevant facts. Without the goal, no fact is relevant. So he manufactures the goal. He isn't suffering from self-deception; he is performing a manual override on his own relevance ranking. He chooses a false default because the true default leads to inaction. This is a chilling illustration of the philosophical frame problem: relevance is teleological. You can't know what matters without knowing what you want. Leonard fixes what he wants by falsifying what matters.

  #### 4. The Reverse Structure
  Does the reverse chronology illuminate the problem? Yes, but not just aesthetically. It forces the viewer into Leonard's epistemic position regarding *causality*.
  In a normal narrative, we assume persistence: Character A is angry in Scene 1, so they are likely angry in Scene 2 unless something changes.
  In *Memento*, we see the effect before the cause. We see Leonard running from a scene before we know why. We are denied the default assumption of persistence. We have to compute the frame axioms backwards. "For Leonard to be here, running, what must have persisted? What must have changed?"
  It mimics the computational load of the frame problem without the heuristic shortcuts. It exhausts the viewer, making us feel the desperation for a stable narrative frame. We want to assign relevance so badly we start guessing wrong (just like Leonard).

  #### 5. Sammy Jankis
  Sammy earns his place as the control group. Sammy represents the agent who *cannot* install the apparatus. He relies on intuition/habit ("conditioning"), which fails him (the insulin scene—I'm flagging the specific mechanism here, memory is fuzzy on whether it was repeated injections or just a test of recognition, but the outcome is the wife's death).
  Sammy shows that without externalized frame axioms, the agent collapses into infinite loops (testing the same fact repeatedly). Leonard shows that with externalized axioms, the agent becomes rigid and manipulable. Sammy is the frame problem unsolved; Leonard is the frame problem solved at the cost of truth.

  ### Where the Film Resists the Reading

  Here is the honest verdict you asked for.

  The AI/Action reading works brilliantly for the first two-thirds of the film. It explains the mechanics of his manipulation and the structure of his agency. But the film resists this reading in the final act because it shifts from a problem of *knowledge* to a problem of *grief*.

  The technical frame problem assumes the agent wants an accurate model of the world to maximize utility. Leonard's final move suggests that for human agents, utility *is* the avoidance of psychic pain. The "frame" he protects isn't just a logical boundary for action; it's a psychological defense mechanism.

  If you teach this strictly as the frame problem, you risk sanitizing the tragedy. The film argues that the "solution" to the frame problem for a human being might be *irrational*. Leonard chooses a known falsehood to maintain agency. In AI terms, he maximizes a utility function that includes "believing I am avenging my wife" over "believing the truth."

  **The contribution to the literature:**
  The papers on the frame problem (McCarthy, Hayes, Shanahan) treat the selection of defaults as a logical or probabilistic issue. *Memento* suggests that for embedded agents with emotional stakes, the selection of defaults is a *moral* and *existential* act.
  The "frozen frame" is always someone's frozen frame. Leonard shows us that persistence isn't a feature of the world; it's a commitment made by the agent. When he burns the photo, he isn't destroying evidence; he is deleting a termination condition.

  **Recommendation for the Syllabus:**
  Pair the film with **Dennett's "Cognitive Wheels: The Frame Problem of AI"** (for the philosophical breadth) and **Shoham's reasoning about non-monotonic logic** (for the technical default logic). But add a caveat: The film illustrates the *political economy* of the frame problem. Who gets to write the frame axioms? In Leonard's case, it's his past self and his manipulators. In our case, it's culture, language, and ideology.

  If you push the "Authority over Defaults" reading, you move the seminar from "Is Leonard the same person?" (metaphysics) to "Who controls the relevance filters?" (philosophy of action + critical theory). That's where the juice is.
