      *Wait, one nuance:* The prompt says "inequalities that trace back to brute luck... ought to be corrected." If the boat loss is Option, the *inequality* (him having no boat) isn't corrected. But the daughter's need is medical. Is her need Brute Luck? Yes. But the *funding* for it is tied to the father's claim status in this specific scenario (maybe a dependency clause). I need to make sure that link is clear. The town covers dependents *if* the provider's loss was Brute. If the provider's loss was Option, the safety net doesn't trigger for the family unit. That makes the stakes clear.

      *Let's adjust:* The daughter's condition is chronic (Brute). But the *extra* coverage triggered by a "Catastrophic Brute Event" is what's needed now. Or simpler: The family income is gone. The town tops up income only if the loss was Brute. If Option, you starve. The medical need is the lever.

