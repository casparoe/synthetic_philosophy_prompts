      *   Better: She rules Option, adhering to the principle, and the story sits with the discomfort. The prompt asks for the reader to feel the pull of both. If she follows the rule, the "abandoning the imprudent" objection hits hard.

  11. **Drafting - Scene 4: The Ending.**
