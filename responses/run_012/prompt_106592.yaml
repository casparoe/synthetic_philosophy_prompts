answer: |-
  The rain in Oakhaven didn't fall so much as it hovered, a persistent gray suspension that tasted of salt and diesel. Inside the Reckoning Office, the air was dry and recycled, smelling faintly of toner and old carpet. Della sat at her station, the hum of the server room vibrating through the soles of her shoes. She was fifty-four, and she had been classifying misfortune for twelve years.

  On her desk lay File 8940. Vane, Elias.

  She adjusted her glasses and scrolled through the digital manifest. Three years of premium payments declined. The notifications were stamped in red: *ACKNOWLEDGED. WAIVER SIGNED.* Elias Vane had opted out of the Storm Shield every autumn since the new ordinances passed. He had taken the credit from the unspent premiums and poured it into the *Kestrel*'s hull reinforcement and a new sonar array. He had gambled on the sea staying calm, or on his boat staying whole.

  The Equinox Gale had arrived on a Tuesday. The *Kestrel* was now at the bottom of the harbor.

  Della's finger hovered over the classification key. Code B: Brute Luck. Code O: Option Luck.

  If she typed B, the town's equity fund would reimburse Vane for the vessel and issue a stipend for lost income. Because there was a dependent minor in the household, the medical surcharge for the daughter's respiratory treatment would also be unlocked.

  If she typed O, Vane was insolvent. The daughter's treatment would revert to the baseline tier, which in Oakhaven meant waiting lists and pain.

  "Della."

  She didn't look up. Toby was leaning against the partition, holding a styrofoam cup that was sweating condensation onto the laminate. Toby was twenty-six, new enough to still think the friction in his chest was moral outrage rather than indigestion.

  "Vane?" he asked.

  "Vane."

  "He signed the waivers."

  "Three times."

  Toby took a sip of his coffee. "He signed them because the premium went up twelve percent last year. His father died on a trawler. He grew up in the Flats. He was taught that insurance is a tax on people who expect to fail."

  Della finally looked at him. "He was taught a lot of things. He also owns a calculator."

  "That's the point, isn't it?" Toby gestured with the cup. "The algorithm treats the choice as the origin point. But the choice is just the end of a long chain of brute luck. Bad schools, bad neighborhood, bad genetic predisposition for risk-assessment. We're punishing him for the weather that happened before he was born."

  "We aren't punishing him, Toby. We're categorizing the loss."

  "It feels like punishment when the kid stops breathing."

  Della turned back to her screen. "If we classify every option as downstream brute luck, there is no such thing as option luck. The fund dissolves. The town dissolves."

  "So we let them drown to keep the ledger balanced."

  "We keep the system functional so it's there when the sky actually falls."

  Toby sighed, a sound of exhausted defeat that was becoming common among the junior clerks. He pushed off the partition. "Just check the psych eval. There's a note in the intake from three years ago. About his anxiety levels."

  He walked away before Della could tell him that personal psychology wasn't admissible under Section 4 of the Reckoning Act. She watched him go. He was a good clerk, in a way. He cared. But caring made the numbers blur. Della didn't care. She cared about accuracy. Accuracy was the only thing that kept the mob from burning the office down.

  She opened the sub-file Toby had mentioned. There it was. A caseworker's note from the initial enrollment. *Subject exhibits high stress regarding financial liquidity. Prioritizes asset improvement over liability protection.*

  It was a gamble. A clear, documented gamble. Elias Vane had looked at the probability of a storm versus the certainty of a better boat, and he had chosen the boat. That was the definition of Option Luck. It was the clean version of the theory, the version her partner would have appreciated over a glass of wine. Inequalities resulting from conscious gambles are not unjust.

  But the clean version didn't account for the daughter.

  Della minimized the file and opened the Schedule of Payouts. She scrolled to *Dependent Medical Necessity*. The clause was explicit: *Coverage is contingent upon Primary Provider Loss Classification.* The logic was that the town stepped in to stabilize the family unit only if the destabilization was external. If the family destabilized itself, the town was not liable.

  It was a harsh logic. It was designed to be harsh. The founders of the Reckoning had argued that softening the blow for imprudence encouraged more imprudence. If you know the town will catch you when you bet on the wrong horse, you will bet more horses.

  Della rubbed her temples. Outside, the rain intensified, drumming against the high, narrow windows. She thought about Elias Vane. She had seen him in the waiting room yesterday. He wasn't shouting. He was sitting in the plastic chair, staring at his hands. They were rough hands, scarred from lines and hooks. He looked like a man who had been told the math didn't love him.

  She thought about the daughter. She didn't know the girl's name. In the file, she was *Dependent A*. Age 14. Condition: Cystic Fibrosis. The storm loss didn't cause the disease—that was brute luck, pure and simple, a genetic roll of the dice. But the loss of the boat meant the loss of the income required to pay the co-pays, the travel to the mainland clinic, the specialized airway clearance devices that the baseline tier didn't cover.

  The disease was brute. The inability to treat it was option.

  Where did the chain break?

  Toby's voice echoed in her head. *Laundering contempt.* He believed the Reckoning was just a way for the town to feel virtuous about abandoning the poor. By calling it "Option Luck," they could call the suffering "Justice" rather than "Neglect." It allowed them to sleep.

  Della opened a new window. She pulled up the historical data for the Equinox Gale. It was a 1-in-50-year event. Unpredictable. If Vane had had insurance, the payout would have been automatic. Code B.

  But he didn't have insurance.

  She thought about her own life. She had a mortgage. She had insurance. She had a partner who taught philosophy and argued about the nature of justice while stirring risotto. Della paid her premiums not because she feared the storm, but because she feared the Reckoning Office. She feared sitting where she was sitting now, holding the pen.

  If she ruled Brute, she would be lying. The loss was not unchosen. Vane chose to be exposed. To rule Brute would be to undermine the integrity of the Office. It would suggest that the rules were malleable, that sentiment could override statute. If the clerks started making exceptions, the public would know. Trust would erode. Next time, someone else would gamble, expecting mercy. Mercy, in a system like this, was a subsidy for the reckless.

  If she ruled Option, she was adhering to the principle. The principle was cold, but it was consistent. It treated everyone the same. The rich gambler who lost his yacht and the poor gambler who lost his trawler were treated identically. No pity. No contempt. Just the math.

  But the math left the girl without medicine.

  Della stood up and walked to the break room. The coffee machine was gurgling. Toby was there, staring into the sink. He didn't turn around.

  "Are you going to do it?" he asked.

  "I'm going to file the ruling."

  "Code O?"

  "It's the only ruling the file supports."

  Toby turned. His eyes were red. "You know what happens to them."

  "I know what the Schedule says."

  "The Schedule is wrong, Della."

  "The Schedule is the law."

  "The law is just a story we tell ourselves so we don't have to look at the bodies."

  Della poured her coffee. It was black and bitter. "If I start deciding which laws to follow based on how sad the story is, I'm not a clerk anymore. I'm a charity. And this isn't a charity."

  "It's a government."

  "It's a Reckoning."

  She took her cup back to her desk. The screen saver was bouncing a geometric shape around the monitor. She nudged the mouse. File 8940 waited.

  She imagined Elias Vane walking back in. She imagined him asking, *Why?* What would she tell him? *You took a risk.* *You knew the odds.* *Your daughter is the collateral.*

  She could try to find a loophole. There was always a loophole. She could classify the storm as the primary cause, arguing that the waiver only covered standard weather events, not 1-in-50 anomalies. But the waiver was specific: *Acts of God, including gales, hurricanes, and anomalous meteorological events.* She would be caught. An audit would flag it. She would lose her clearance. Then who would review the files? Someone younger than Toby, someone angrier, or someone more corrupt.

  She could rule Brute and accept the audit. But that was heroism. The prompt of her life, the quiet agreement she had made when she took the job, was to avoid heroism. Heroism was noise. Administration was silence.

  She sat down. She placed her hands on the keyboard.

  The pull of the principle was heavy. It was the weight of the building, the weight of the town's agreement to live by rules rather than whims. If the town started paying for option losses, the premiums would rise. The people who played it safe would subsidize the gamblers. That was its own kind of injustice. It punished the prudent. It punished the people who scraped together the money for the insurance instead of the engine upgrade.

  But the pull of the objection was a hook in her gut. The idea that Vane never really had a choice. That the "option" was an illusion created by a lifetime of brute luck stacking up against him until the only move left was a gamble.

  Della closed her eyes for a moment. She saw the rain. She saw the plastic chair.

  She opened her eyes. She typed.

  *Classification: Option Luck.*
  *Code: O-4 (Voluntary Exposure to Environmental Hazard).*
  *Authorization: Denied.*

  She hit Enter. The file status changed from *PENDING* to *CLOSED*. The sound of the keystroke was small, a plastic clack that was swallowed by the hum of the servers.

  She didn't feel triumphant. She didn't feel evil. She felt a hollowing out, a small vacancy in her chest where a different decision might have lived. She had protected the system. She had sacrificed the Vanes to it. It was the job.

  She minimized the window. She had twelve more files before lunch.

  Della stood up and took her coat from the rack. It was only 11:30 AM, but she had used her personal time voucher. She walked past Toby's desk. He was on the phone, his voice low and urgent. He didn't look up as she passed.

  She walked out of the Reckoning Office and into the rain. The air was cold and wet, soaking into her shoulders immediately. She walked three blocks to the corner store. The bell above the door chimed. The clerk, a boy with acne and a name tag that read *SAM*, nodded at her.

  Della walked to the counter. She didn't need anything. She had food at home. Her partner would be making lunch.

  "Rough day?" Sam asked. He saw the badge on her lapel. Everyone in Oakhaven knew the badge.

  "Standard," Della said.

  She reached into her purse and pulled out a five-dollar bill. She placed it on the counter.

  "Lottery?" Sam asked, gesturing to the rack of scratch-offs behind him.

  Della looked at the cards. Bright colors. Promises of instant brute luck correction. A way to bypass the Reckoning entirely. If she won, she wouldn't need to file claims. She wouldn't need to classify misfortune. She could buy her way out of the system.

  The odds were terrible. It was a tax on people who didn't understand math. It was the worst kind of option luck.

  "Yes," Della said.

  She pointed to the top card. The one with the highest payout and the worst odds.

  Sam scratched it off for her. Three cherries. No match.

  "Better luck next time," Sam said, sliding the trash into the bin.

  Della took the receipt. She didn't feel disappointment. She felt a strange, cold alignment. She had gambled five dollars. She had lost. That was her option. She would not file a claim for the five dollars. She would not ask the town to reimburse her for the bad decision.

  "Keep the change," she said.

  She walked back out into the rain. She opened her umbrella, a sturdy black thing she had insured against wind damage. She checked the clasp to make sure it was secure. She walked carefully, avoiding the puddles, stepping only on the dry pavement. She went home to file her own taxes, making sure every deduction was legitimate, every form accurate, every risk accounted for.

  Inside her apartment, the heat was on. Her partner was in the kitchen, chopping vegetables. The smell of garlic and thyme filled the hall.

  "You're early," her partner said, not turning around.

  "Finished a file," Della said. She hung her wet umbrella in the stand. She checked the lock on the front door. She checked the window latch.

  "Hard one?"

  Della walked into the kitchen. She stood by the counter, watching the knife work. Precise. Consistent. Cutting through the soft things without breaking the blade.

  "The usual," Della said.

  She washed her hands. She scrubbed them for thirty seconds, using the soap, rinsing until the skin was raw. She dried them on the towel. She sat down at the table and waited for the food, keeping her hands in her lap, perfectly still.
