      *   **Setting:** Near-future coastal town implementing "Luck Egalitarianism" (Reckoning Office).
      *   **Protagonist:** Della, mid-fifties, clerk, unsentimental, good at her job.
      *   **Plot:** Della must rule on a claim. A fisherman (let's name him Elias) declined storm insurance for three years to invest in his boat. The boat sank in a storm. His teenage daughter needs expensive medical treatment covered only if the loss is "brute luck."
      *   **Themes:** Luck Egalitarianism (Brute vs. Option Luck), the "ugly edge cases" (abandoning the imprudent, downstream causality), bureaucracy vs. humanity.
      *   **Secondary Character:** Younger clerk (let's name him Toby) who argues the system launders contempt for the poor.
      *   **Tone:** No lectures, machinery in the background, administrative decision with weight, ambiguous ending (pull of principle vs. pull of objection), small/unheroic ending action.

  2.  **Deconstruct the Philosophy (for internal consistency):**
      *   *Brute Luck:* Unforeseeable, unchosen (genetics, natural disasters, birthplace).
      *   *Option Luck:* Result of deliberate gambles (investments, insurance choices).
      *   *The Conflict:* The fisherman *chose* not to insure (Option). But the storm itself is Brute. Does the choice to expose oneself to the Brute Luck make the resulting loss Option Luck? Standard Luck Egalitarianism says yes (you gambled). The "downstream" objection says his capacity to make that choice was influenced by brute luck (upbringing, economic pressure).
      *   *The Stakes:* The daughter's treatment hinges on the father's classification. If it's Option, the town owes nothing. If it's Brute, the town pays.

  3.  **Character Development:**
      *   **Della:** Needs to be competent, tired, not a hero. She believes in the rules because the rules keep the chaos at bay. She's seen too much to be swayed easily.
      *   **Toby:** Idealistic, angry, sees the structural bias. He shouldn't win the argument, just voice it.
      *   **Elias (The Fisherman):** Needs to be present or represented through files. Let's have him come in, or just be a file. A file feels more bureaucratic. Let's have a brief interaction or just the weight of his file. Actually, seeing him in the waiting room adds tension.
