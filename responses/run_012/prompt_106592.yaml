  10. **Drafting - Scene 3: The Decision.**
      *   The daughter's medical form attached.
      *   The weight of the pen.
      *   The ruling: Option Luck. (It feels truer to the "ugly edge case" prompt if she follows the strict rule, highlighting the tragedy). Or does she fudge it? The prompt says "costs somebody something." If she rules Brute, the town pays (unjust according to theory). If she rules Option, the girl suffers (unjust according to humanity).
      *   Let's have her rule Option. It fits the "unsentimental" description and the "ugly edge case" theme. The tragedy is the point.
      *   Wait, if she rules Option, the girl doesn't get help. That's heavy.
