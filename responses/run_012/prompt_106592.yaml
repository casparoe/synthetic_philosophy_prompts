      *   Make the bureaucracy feel heavy.

      *(Self-Correction during drafting)*: I need to make sure I don't make Della too cold. She's unsentimental, not cruel. She thinks she's being fair. Toby shouldn't be a mouthpiece; he should be frustrated.
      *Word Count Check:* I need to expand on the sensory details of the office and the internal monologue to hit the 2k-3k range without padding.
      *The Ending:* The prompt asks for "something small and definitely not heroic." Maybe she buys a coffee? Fixes a stapler? Goes home and ignores her partner? Let's have her adjust something trivial in her own life, acknowledging the system's grip. Or perhaps she files the paper and then washes her hands. Let's go with a small act of personal order amidst the moral mess.

  7.  **Refining the Philosophy in Narrative:**
