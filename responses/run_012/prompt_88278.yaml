answer: |-
  You are correct that decision rules drive the policy divergence, but the stalemate itself is epistemic: one side treats existential uncertainty as quantifiable risk amenable to calculation, while the other treats it as Knightian uncertainty where probability assignments are meaningless.

  In your field, probabilistic hazard assessment works because you have frequency data: volcanoes erupt often enough to build distributions, allowing you to distinguish between risk (known probabilities) and uncertainty (unknown probabilities). The AI existential risk proponents operate as if this is a risk problem, assigning numbers like "1%" or "10%" to unique, unprecedented events so they can feed them into an Expected Utility maximizer. To them, refusing to assign a number is equivalent to assigning zero, which they view as moral negligence given the stakes. The skeptics, however, operate as if this is an uncertainty problem; when they call the probabilities "unfalsifiable hand-waving," they are arguing that there is no reference class for superintelligence, so any specific number is arbitrary noise. They aren't just arguing for a different risk weight; they are arguing that the input variable is garbage, making the calculation "garbage in, garbage out."

  This epistemic split forces the decision-theoretic divergence you noticed. Because proponents accept the probabilities as coherent, classical Expected Utility theory dictates that the infinite loss of the future swamps any finite cost today, leading to the "obvious priority" conclusion. Skeptics, rejecting the coherence of the probabilities, implicitly default to a precautionary threshold or a evidentiary burden of proof; they require demonstrated harm or robust mechanisms before acting, rather than acting on expected value alone. This is why they talk past each other: one side is doing cost-benefit analysis on a known distribution, and the other is refusing to acknowledge the distribution exists.

  There is also a values dispute underneath, but it is secondary to the epistemic block. Even if both sides agreed on the decision rule, they disagree on the discount rate for future lives; proponents weigh potential future generations heavily enough to make extinction catastrophic, while skeptics often prioritize concrete, present-day suffering over speculative future populations. However, this values gap only becomes impassable because the epistemic uncertainty allows each side to dismiss the other's probability estimates as either panic or denial.

  Progress will not come from a formal result in decision theory or a better way to price probabilities, because the core issue is the lack of a mechanistic model linking AI capabilities to existential outcomes. In volcanology, you progress by finding more fault lines or eruption records; in AI risk, progress requires moving from probabilistic forecasting to mechanistic anomaly detection—identifying specific, testable failure modes in alignment rather than estimating the likelihood of doom. Until the debate shifts from "what is the probability" to "what is the mechanism," the stalemate will remain bedrock, because you cannot resolve an epistemic crisis with a decision rule.
