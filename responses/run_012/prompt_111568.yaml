          *   *Whistle Analogy:* The sound is caused by the steam. The *presence* of the sound indicates the steam. But does the sound indicate itself? The analogy implies the sound is detectable. In epiphenomenalism, the "detectability" of experience (introspection) implies a causal link from experience to knowledge of experience. If that link is cut, knowledge of experience is impossible.
