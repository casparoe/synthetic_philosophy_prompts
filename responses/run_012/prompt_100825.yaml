      *   Layer 1: The Is-Ought gap (Explanation vs. Justification).
      *   Layer 2: The Conceptual Bundle (User's hypothesis is correct but incomplete).
      *   Layer 3: The Unit of Moral Concern (Group vs. Individual).
      *   *Decision:* The core fault line is a **Category Error between Functional Explanation and Moral Justification**, exacerbated by the **Conceptual Ambiguity** the user identified. The anthropologists are offering *etiology* (why it exists), the liberals are demanding *legitimacy* (why it's right). They think they are arguing about the same thing, but they aren't.

  5.  **Evaluating the User's Hypothesis:**
      *   Is it correct? Yes, "tightness" is a composite variable.
      *   Is it the *real* fault line? It's a major contributor. If "tightness" means "strong social glue" to one side and "punitive surveillance" to the other, no agreement is possible.
