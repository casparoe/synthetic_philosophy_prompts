      *(Refining the User's Hypothesis)*: The user distinguishes between sharedness, punishment, and source. I should add a fourth: *Internalization vs. Compliance*. A tight society where everyone *believes* the norm is morally different from one where everyone *fears* the norm. This aligns with the "oppressive" vs. "functional" debate.

      *(Final Polish)*: Ensure I answer the specific prompt requirements: "Pick a diagnosis," "Tell me if [your hypothesis] holds up," "Substantive or verbal," "What counts as progress."

