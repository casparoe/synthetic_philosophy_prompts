      *   **Current State:** Two camps. Camp A (Pessimists/Analysis-Skeptics): The project is doomed; the structure of JTB + X is inherently flawed (truth-entailing + non-truth-entailing components allow luck). Camp B (Optimists/Traditionalists): We haven't found the right condition yet.
      *   **Task:** Diagnose the standoff. Is it about substantive cases? Data/intuitions? Terminology (internalist vs. externalist 'justification')? Different questions (folk concept vs. theoretical kind)? Or is the question ill-posed?
