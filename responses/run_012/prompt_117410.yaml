      *   *The Optimist Claim:* We just need a tighter modal condition or a better account of the basis of belief.

  3.  **Evaluate Potential Diagnoses:**

      *   *Diagnosis 1: Substantive disagreement about cases.*
          *   Do they disagree on whether the Fake Barn case is knowledge? Usually, no. Both sides generally agree Fake Barn Henry *doesn't* know. The disagreement is about *why* the analysis fails to capture that intuition. So, this is unlikely to be the root cause.

      *   *Diagnosis 2: Disagreement about data/intuitions (Internalist vs. Externalist 'Justification').*
          *   This is a strong candidate. If Camp B is tweaking an internalist notion of justification while Camp A is testing against externalist intuitions (or vice versa), they talk past each other. However, most post-Gettier literature acknowledges the need for an externalist element (to rule out luck). The Pessimists often argue that *any* additive condition fails. So while terminology matters, it might not be the *whole* story.

