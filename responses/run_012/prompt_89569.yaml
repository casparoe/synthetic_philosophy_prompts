answer: |-
  **Exam Question**

  **Question 4: The Case of Rae and the Limits of Strawson**

  Consider the following case: Rae is an adult male of normal intelligence. Over several years, Rae commits a series of genuinely cruel, self-serving acts against colleagues and family. He is not psychotic, not coerced, and not suffering from a recognized cognitive deficit. However, new neuroscience reveals that Rae's cruel dispositions are neurologically fixed and permanent. No amount of punishment, therapy, or social incentive will ever alter his behavior or his underlying attitudes; he is constitutionally incapable of developing goodwill.

  Using P.F. Strawson's framework in "Freedom and Resentment," answer the following:

  1.  Does Rae's permanent unchangeability warrant shifting from the **participant stance** to the **objective attitude**? Explain whether "inability to change" functions as an exemption/excuse in Strawson's system, or if Rae remains an appropriate target of reactive attitudes like resentment.
  2.  Strawson suggests that we cannot practically abandon the reactive attitudes. Is this claim merely **descriptive** (a psychological fact about human limitations) or **normative** (a justification for our practices)? Explain how your interpretation dictates whether we are *justified* in resenting Rae, even if we theoretically *could* view him objectively.

  Your answer must take a definitive position on whether resentment toward Rae is appropriate and defend that position using the distinctions above. (Approx. 600 words).

  ***

  **Model Answer**

  Strawson's framework implies that we ought to maintain the participant stance toward Rae, and that resentment remains appropriate despite his neurological fixedness. To argue otherwise confuses moral incapacity with causal determinism, and misunderstands the justificatory role of Strawson's naturalism.

  First, regarding the stance: Strawson distinguishes between participants in the moral community and those who are exempt due to psychological abnormality (e.g., the psychotic or the child). Exemptions apply when an agent cannot understand or participate in interpersonal demands for goodwill. Rae, however, is not cognitively impaired; he understands the demand, he simply rejects it permanently. His fixedness is a matter of character, not capacity. If we adopted the objective attitude toward Rae simply because he is unchangeable, we would effectively exempt all hardened criminals from moral responsibility. This collapses the distinction between being *unable* to be good and *being* bad. Strawson allows the objective stance for those who are "warped" or "neurotic" in a way that precludes ordinary relationships, but Rae's case describes extreme vice, not incapacity. Therefore, Rae remains a member of the moral community. To treat him objectively is not to excuse him, but to dehumanize him, viewing him as a broken machine rather than a moral antagonist. Resentment is the appropriate response because it acknowledges his agency; it signals that we hold him to the demand for goodwill, even if we know he will not meet it.

  Second, the descriptive-versus-normative issue determines whether this conclusion is merely inevitable or actually justified. A purely descriptive reading suggests we resent Rae only because we are psychologically incapable of sustaining the objective attitude toward normal adults. On this view, our resentment is a brute fact, but potentially irrational if Rae is truly determined. However, this misreads Strawson. His claim that we "cannot" give up reactive attitudes is not just a prediction of psychological failure; it is a claim about the conditions of meaningful human life. The participant stance is constitutive of our relationships. To ask for a justification of these attitudes from outside the practice is to ask for a view from nowhere.

  Therefore, the descriptive fact *does* normative work. Because our moral practices are grounded in our nature as social beings, there is no external standard by which to declare them unjustified. If we asked, "But is Rae *really* responsible?" we are asking for a justification that transcends our human form of life. Strawson's point is that no such transcendence is available or necessary. Consequently, we are justified in resenting Rae not because he possesses some metaphysical libertarian freedom, but because our commitment to the participant stance is rationally self-contained. To abandon resentment because of neuroscience would be to prioritize a theoretical causal story over the actual fabric of human interaction.

  In conclusion, Rae's fixedness does not trigger an exemption. He is a bad participant, not a non-participant. Furthermore, Strawson's naturalism provides normative justification, not just psychological description. We are right to resent Rae because to do otherwise would be to abandon the very framework that makes moral judgment possible.

  ***

  **Marking Scheme**

  **Total: 20 Marks**

  **1. Application to Rae: Capacity vs. Character (5 Marks)**
  *   **Criteria:** Correctly identifies that Strawson's exemptions rely on *incapacity* to understand/participate, not *unwillingness* or *fixedness* of character.
  *   **A vs. B Line:** A answers distinguish Rae's permanent vice from psychological exemption (e.g., psychosis). B answers conflate "unchangeable" with "not free" and argue for the objective stance.
  *   **Common Blow-up:** Students treat Rae as a "determined object" and ignore Strawson's specific criteria for exemptions (psychological abnormality).

  **2. Stance Decision: Participant vs. Objective (5 Marks)**
  *   **Criteria:** Takes a definitive position on whether resentment is appropriate and links it to the status of Rae as a moral agent.
  *   **A vs. B Line:** A answers argue that maintaining resentment *affirms* Rae's agency. B answers argue we should switch to the objective stance to be "rational" or "scientific."
  *   **Common Blow-up:** Students sit on the fence, claiming "both stances are possible," missing Strawson's point that they are mutually exclusive in practice.

  **3. Descriptive vs. Normative Interpretation (5 Marks)**
  *   **Criteria:** Analyzes whether Strawson's "we cannot give up" claim is a psychological limitation or a justification of practice.
  *   **A vs. B Line:** A answers argue the descriptive fact *constitutes* the norm (no external justification needed). B answers treat it as a mere psychological constraint that leaves the normative question open/unanswered.
  *   **Common Blow-up:** Students claim Strawson offers *no* justification, only a description of human psychology, missing the naturalistic defense of responsibility.

  **4. Handling the "Could We Stop?" Objection (3 Marks)**
  *   **Criteria:** Addresses the implication of the neuroscience: even if we *could* theoretically view Rae objectively, *should* we?
  *   **A vs. B Line:** A answers explain why adopting the objective stance would damage the moral community. B answers focus only on whether it is psychologically possible.
  *   **Common Blow-up:** Students focus entirely on the neuroscience's truth value rather than its relevance to moral practices.

  **5. Clarity, Structure, and Textual Fidelity (2 Marks)**
  *   **Criteria:** Argument flows logically; uses Strawsonian terminology (reactive attitudes, demand for goodwill) accurately.
  *   **A vs. B Line:** A answers integrate terms into the argument. B answers define terms in isolation (e.g., a paragraph just defining "objective attitude").
  *   **Common Blow-up:** Students write a biography of Strawson's argument rather than applying it to Rae.
