answer: |-
  Your three-way split is diagnostically accurate but incomplete, because the primary impasse is substantive rather than verbal, rooted in incompatible commitments about whether cultural items possess the causal integrity required for lineage-based individuation, which the ambiguous label "Darwinian" merely obscures.

  The definitional dispute among the philosophers of biology is terminological but consequential, serving as a proxy for the deeper mechanistic disagreement. When Godfrey-Smith distinguishes replicators from reproducers, he provides a conceptual toolkit that allows the Memeticists to insist that genuine Darwinism requires high-fidelity copying mechanisms (replicators), while the Epidemiology/Dual-Inheritance camp can argue that population-level dynamics (variation, selection, retention) are sufficient even if the mechanism is transformative reconstruction. This is not merely arguing over words; it determines the burden of proof. If "Darwinian" requires replicators, Memetics fails unless they prove high-fidelity copying exists. If "Darwinian" requires only population dynamics, Epidemiology wins even without copying. The terminological ambiguity allows both sides to claim the mantle of evolutionary theory while denying the other's mechanistic premises.

  The empirical dispute regarding transmission fidelity is substantive but theory-laden, meaning data alone cannot resolve it because each side measures different variables to support their explanatory aims. Memeticists treat fidelity as a threshold variable: is copying accurate enough for selection to outpace mutation? They focus on domains where fidelity is high (e.g., rituals, technical skills) to validate the replicator model. Sperber-style epidemiologists treat fidelity as a continuous variable of reconstruction: how much does cognitive bias transform the input? They focus on domains where transformation is high (e.g., rumors, norms) to validate the attractor model. Because they disagree on what counts as the "unit" being transmitted—a specific token copy versus a reconstructed type—empirical findings on fidelity are interpreted differently. A memeticist sees a stable tradition as evidence of copying; an epidemiologist sees it as evidence of convergent transformation toward a cognitive attractor.

  The core substantive fault line is therefore about individuation and explanatory scope, specifically whether cultural items count as individuals with fitness. Memetics requires cultural variants to be individuated across minds and time to have differential reproduction; without distinct lineages, you cannot calculate fitness. The Epidemiology/Dual-Inheritance side argues that cultural items are not individuals but transient states of a cognitive ecology, stabilized by attractors rather than lineage integrity. This is why the fight circles: Memeticists are trying to explain the persistence of lineages, while Epidemiologists are trying to explain the stability of distributions. You cannot resolve this with more ethnography because the disagreement is about whether the ethnographic object (a custom, a word, a tool) is a replicator or a reconstruction.

  Progress would not come from fresh experimental data or further conceptual distinction, but from a formal result demonstrating the boundary conditions under which transformative transmission converges on replicator dynamics. We need modeling that shows precisely when reconstruction biases become mathematically equivalent to copying fidelity, or when they diverge enough to break selectionist explanations. If a model can prove that cumulative cultural evolution is impossible without a specific threshold of replicator-like fidelity, the Memeticists win on mechanistic grounds. If a model shows that cumulative evolution emerges robustly from transformative transmission alone, the Epidemiologists win. Until then, the field remains stuck in a "as-if" debate where one side claims transformation acts *as if* it were copying, and the other claims copying is *actually* transformation.

  My diagnosis is most likely wrong if cultural evolution is fundamentally domain-specific rather than general, meaning the dispute is ill-posed because it assumes a single theory must cover all cultural phenomena. It is possible that technology evolves via memetic replicators while norms evolve via epidemiological attractors, in which case the search for a unified "Darwinian" label is the error. I would change my mind if empirical work demonstrated a domain with verified high-fidelity transmission that still failed to produce memetic lineage patterns, or conversely, a domain with verified low-fidelity reconstruction that still produced cumulative selection without cognitive attractors. Such a finding would decouple the mechanism from the dynamics, proving that the substantive link between fidelity and Darwinism is weaker than my diagnosis assumes.
