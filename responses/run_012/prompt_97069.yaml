      *   *Decision:* I will use the **Stakeholder Role** approach. It creates natural divergence in criteria without explicitly telling them "use this criterion." An Election Observer ignores media consolidation if votes are counted right. A Rights Advocate ignores vote counting if media is rigged. This perfectly mirrors the prompt's requirement about "different thresholds."

  3.  **Drafting the Activity Structure:**
      *   **Title:** The Marisia Classification Protocol.
      *   **Roles:** 4 Types (4 students per type x 4 groups = 16 students).
          1.  Electoral Integrity Monitors (Focus: Ballots, turnout, counting).
          2.  Institutional Guardians (Focus: Courts, Constitution, Checks).
          3.  Civil Society Watchdogs (Focus: Media, Protest, Speech).
          4.  Stability & Order Analysts (Focus: Violence, Economic function, Peaceful transfer).
