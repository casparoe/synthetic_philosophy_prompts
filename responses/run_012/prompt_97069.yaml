  4.  **Developing the Materials:**
      *   **Case File:** Needs to be detailed enough to support all interpretations. (Marisia details provided in prompt + specific data points).
      *   **Role Cards:** One sentence instruction on what to prioritize.
      *   **Voting Slips:** Simple Yes/No.
      *   **Board Setup:** Two columns (Backsliding / Not Backsliding).

  5.  **Timeline (90 Minutes):**
      *   0-5: Intro & Hook.
      *   5-10: Distribute Materials & Roles.
      *   10-25: Individual Reading & Private Vote (Crucial: commit before talking).
      *   25-45: Role-Group Discussion (Find consensus within role).
      *   45-70: Plenary Negotiation (The "Committee" must issue one verdict).
      *   70-90: Debrief (The core learning).

  6.  **Refining the "Trap":**
      *   The prompt wants them to discover the verdict was driven by a cutoff they never stated.
      *   If I give them roles, they know their focus.
      *   *Correction:* I should *not* label the roles explicitly as "Media Focus." I should label them by *organization* with implicit mandates.
      *   *Role A:* International Election Commission (Mandate: Is the vote count accurate?).
      *   *Role B:* Constitutional Law Institute (Mandate: Are the rules legal?).
      *   *Role C:* Press Freedom NGO (Mandate: Is information free?).
      *   *Role D:* Economic Stability Fund (Mandate: Is the system functioning?).
      *   *Instruction:* "Evaluate Marisia based on your organization's standard operating procedure."
      *   *Result:* Role A says "Democracy OK" (votes counted). Role C says "Backsliding" (media owned). When they try to issue a joint report, they realize they are measuring different things.

  7.  **Drafting the Debrief:**
      *   Need to map the activity to Levitsky & Ziblatt, Waldner & Lust, or similar theoretical frameworks (without assuming reading, but allowing the instructor to bring it in).
      *   Key concepts: Conceptual Stretching, Necessary vs. Sufficient Conditions, Thresholds.
      *   Troubleshooting: Students might compromise too easily ("Let's just say 'Partial'"). I need to force a binary choice.
      *   Limitations: A simulation can't show *power dynamics* of who gets to label. It shows *conceptual* disagreement, not *political* weaponization.

  8.  **Review against Constraints:**
      *   16 students? Yes (4 groups of 4).
      *   90 mins? Yes.
      *   Fictional case? Yes (Marisia).
      *   No prior reading? Yes.
      *   Reveal hidden thresholds? Yes, via the role conflict.
      *   Troubleshooting included? Yes.
      *   Limitations note included? Yes.

  9.  **Final Polish:**
      *   Make the Case File punchy.
      *   Ensure Role Cards are subtle but directive.
      *   Make the Debrief questions sharp.
      *   Check tone: Academic but practical for a student instructor.

