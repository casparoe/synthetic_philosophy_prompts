      *   **Constraints:** No bibliography/citations. Rigorous reasoning. Concede weaknesses. Do not hedge.

  2.  **Drafting - Section by Section:**

      *   **Introduction & Mapping:**
          *   Need to briefly outline the four readings.
          *   *Burden-of-proof:* Proponent must show safety. Non-trivial if it actually shifts the default from "permitted until proven safe" to "forbidden until proven safe."
          *   *Presumption against novelty:* New things are suspect. Non-trivial if it actually slows innovation, but risks incoherence if "newness" is ill-defined.
          *   *Ambiguity rule:* Apply when probabilities are unknown (Knightian uncertainty). Non-trivial if it changes the decision rule (e.g., info-gap) rather than just saying "get more info."
          *   *Lexicographic/Maximin:* Catastrophe trumps utility. Non-trivial if it actually vetoes high-utility/high-risk options.
          *   *Commitment:* I am arguing for the Lexicographic Constraint on Catastrophe + Irreversibility.

      *   **Argument for Lexicographic View:**
          *   Why not Burden-of-Proof? It's procedural. Once the assessment is done, the principle disappears. If the assessment says "safe enough," PP is satisfied. It doesn't dictate *how* to weigh the residual risk. It's too weak to generate a distinctive verdict against accepted risks.
          *   Why not Presumption-against-Novelty? Incoherent. The status quo isn't neutral. Banning the new preserves the old, which might be deadly. It's status-quo bias disguised as prudence.
          *   Why Lexicographic? It captures the intuition that some things are *too important to gamble with*, regardless of expected utility. It modifies the utility function itself.

      *   **Objection 1: Regress/Paralysis:**
          *   *The Problem:* If we ban X because of uncertain harm, banning X causes harm Y. Do we ban the ban?
          *   *The Solution:* The lexicographic constraint applies only to *catastrophic and irreversible* outcomes. Most regulatory actions do not carry a risk of *catastrophe* in the same sense as the regulated activity (e.g., banning a chemical doesn't usually risk human extinction).
          *   *Dependence:* It depends on *both* the catastrophe class and irreversibility. Reversible harms can be traded off. Only irreversible catastrophes trigger the veto. This creates an asymmetry between the activity and the regulation of it.

      *   **Objection 2: Fanaticism:**
          *   *The Problem:* Every action has *some* non-zero probability of catastrophe (Pascal's Mugging style). Does this paralyze all action?
          *   *The Solution:* We need a de minimis threshold or a plausibility constraint. It's not about *logical* possibility, but *scientifically plausible* pathways to catastrophe.
          *   *Relocation:* Yes, this relocates the problem to specifying the threshold. But this is unavoidable in decision theory. We cannot act on logical possibilities, only epistemic probabilities. The principle guides us once the threat is deemed credible, not on whether the threat is credible (that's science).
          *   *Irreversibility:* This helps filter. Driving a car has catastrophe risk (death), but it's not systemic/irreversible in the global sense. Climate change is.

      *   **Objection 3: Status Quo Bias:**
          *   *The Problem:* The status quo (e.g., carbon emissions) causes catastrophe. PP usually targets *new* proposals.
          *   *The Response:* The lexicographic reading *must* apply to the status quo if the status quo involves an active trajectory toward catastrophe. It is not about "new vs. old," it is about "pathways to catastrophe."
