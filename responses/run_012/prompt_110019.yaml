answer: |-
  1. **Prudential Counsel:** The proverb is merely advice to avoid unnecessary friction, danger, or social awkwardness by blending in.
     *Verdict:* This is a platitude no one would deny, but it reduces the maxim to a tip for self-preservation rather than a rule of conduct.

  2. **Etiquette and Respect:** The proverb claims that adopting local manners is a non-moral duty of politeness owed to hosts to signal goodwill.
     *Verdict:* This reading is substantive and defensible, provided the customs in question are genuinely matters of convention rather than justice.

  3. **Epistemic Humility:** The proverb suggests that locals possess superior knowledge about how their environment functions, including which rules are functional and which are dead letters.
     *Verdict:* This is defensible in cases of coordination (like crossing streets) but fails when locals disagree among themselves or when the practice is harmful.

  4. **Reciprocity and Fair Play:** The proverb asserts that because a visitor benefits from the local order (security, infrastructure, service), they incur a temporary obligation to bear its burdens.
     *Verdict:* This is a strong, defensible claim of obligation, though it struggles to specify exactly which burdens (e.g., tipping vs. taxes) must be shouldered by a short-term guest.

  5. **Legal Realism:** The proverb implies that actual social practice constitutes the true law, rendering unenforced statutes irrelevant for both residents and visitors.
     *Verdict:* This is controversial and context-dependent, as it validates the jaywalking incident but dangerously undermines the rule of law if applied to serious offenses.

  6. **Political Deference:** The proverb posits that a guest lacks the standing to critique or reform host institutions because they are a beneficiary who has not consented to the social contract.
     *Verdict:* This is likely what your local friend had in mind during the tipping dispute, but it is a weak defense that conflates politeness with immunity from moral scrutiny.

  7. **Moral Relativism:** The proverb claims that right and wrong are determined by location, so an act immoral at home becomes moral abroad if the locals permit or require it.
     *Verdict:* This is the most radical reading and is philosophically false, as it would require a visitor to participate in local injustices simply because they are local.

  In your first incident, your flatmate relied primarily on the **Legal Realist** reading (Reading 5), arguing that the unenforced statute had lost its claim against the living custom of the street; on the best reading of the proverb, this use is largely supported, as traffic norms are coordination problems where local practice often supersedes abstract code. In the second incident, your local friend relied on **Political Deference** (Reading 6) mixed with **Etiquette** (Reading 2), using the proverb to silence a moral critique of wage structures under the guise of guest propriety; on the proverb's best reading, this use is unsupported, because the maxim governs coordination and manners, not the suspension of a visitor's moral agency regarding economic exploitation. The proverb holds when it helps you navigate a foreign system without breaking its functional rhythms, but it breaks when wielded to demand complicity in systems that guests might reasonably judge as unjust.
