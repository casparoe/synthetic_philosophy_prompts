answer: |-
  ### The Ninety-Minute Decision Procedure for Historical Claims

  This procedure is designed to be run by one researcher and the legal officer, with your final sign-off. It treats an apology not as a feeling, but as a **speech act** that changes the relationship between the state and the claimant. It fails if the conditions for that change aren't met.

  **Time Allocation:** 15 minutes per step. 15 minutes for final drafting/recommendation.

  ---

  #### Step 1: Agency and Continuity (The "We" Question)
  **Question:** Is the current State the same moral agent as the perpetrator, or merely a successor?
  *   **Test:** Did the wrong occur under a legal regime that this State claims continuity with (same constitution, same borders, same institutions), or was it a distinct regime (occupation, colonial empire, overthrown dictatorship) that we explicitly disavow?
  *   **Sufficient Answer for "Yes":** The institution that committed the act (e.g., the police, the health ministry) still exists under the same chain of command, even if policies changed.
  *   **Stop Point (No):** If the act was committed by a foreign empire, a private entity with no state charter, or a regime whose legal continuity we explicitly broke (e.g., post-apartheid vs. apartheid), recommend **Decline** or **Refer**.
  *   **Judgment Flag:** This is not a historical fact; it is a political choice about how the State defines itself. If you choose "Continuity," you accept collective obligation. If you choose "Discontinuity," you protect the current citizenry from blame but lose the right to repair.
  *   **Philosophical Branch:**
      *   *Expressive View:* If we don't feel responsible, an apology is insincere.
      *   *Reparative View:* If we benefit from the past structure, we hold the obligation regardless of feeling.
      *   *Commitment:* This Commission implicitly chooses **Reparative**. We apologize because the State continues, not because we feel guilty.

  #### Step 2: Wrongfulness (The "What" Question)
  **Question:** Is the act recognized as a wrong by current public morality and law, or is it merely "unfortunate"?
  *   **Test:** Can you point to a specific law, policy, or action that is currently illegal or universally condemned by human rights standards?
  *   **Sufficient Answer for "Yes":** The act violates current statutes or binding international norms.
  *   **Stop Point (No):** If the act was legal then and remains morally ambiguous now (e.g., a policy decision that was harsh but not rights-violating), recommend **Acknowledge Without Apologizing**.
  *   **Constraint:** Do not use the passive voice ("mistakes were made"). The draft must name the State as the subject ("The State sterilized...").

  #### Step 3: Addressee and Uptake (The "Who" Question)
  **Question:** Is there a living recipient capable of accepting the apology, or is this for the public record?
  *   **Test:** Are there living victims? If not, are the descendants organized and unified?
  *   **Sufficient Answer for "Yes":** Living victims exist, OR descendants speak with one voice regarding the desire for an apology.
  *   **Stop Point (No):** If the descendant community is deeply split on whether an apology is wanted or who should give it, recommend **Decline**. An apology that divides the victims fails as a speech act; it becomes a political weapon rather than repair.
  *   **Judgment Flag:** You are judging the *utility* of the apology, not just the rightness.

  #### Step 4: Materiality and Settlement (The "Money" Question)
  **Question:** Is compensation attached?
  *   **Test:** Does the recommendation include a payment?
  *   **Branch A (No Money):** If the petitioners refuse money (to avoid "settlement" status), proceed to Step 5. Note: A purely symbolic apology risks being "hollow" unless accompanied by policy change or memorialization.
  *   **Branch B (Money Attached):** If money is attached, does the legal text explicitly state this is *restitution* (moral repair) or *damages* (legal liability)?
  *   **Stop Point:** If the legal officer determines the payment creates a precedent for open-ended litigation liability that threatens the Commission's existence, you must recommend **Acknowledge Without Apologizing**.
  *   **Philosophical Branch:**
      *   *View 1:* Money converts apology into contract (settlement).
      *   *View 2:* Money is necessary for apology to be non-hollow.
      *   *Commitment:* This Commission treats money as **Restitution**, not Settlement, *unless* legal liability forces otherwise.

  #### Step 5: Liability and Exposure (The "Risk" Question)
  **Question:** Does the specific wording required to make the apology valid (admitting fault) create unacceptable legal exposure?
  *   **Test:** Can we admit fault without admitting legal negligence that opens the treasury to suits?
  *   **Sufficient Answer for "Yes":** Legal officer confirms a "moral apology" can be insulated from "legal liability."
  *   **Stop Point (No):** If the Legal Officer states that any admission of fault triggers pending litigation or statutory barriers, you must recommend **Acknowledge Without Apologizing**.
  *   **Judgment Flag:** This is where Moral Philosophy crashes into Public Administration. You are deciding whether the Commission's role is to be morally right or legally safe.

  #### Step 6: Currency and Inflation (The "Value" Question)
  **Question:** Has the State already apologized for this specific wrong?
  *   **Test:** Search the registry of past apologies.
  *   **Sufficient Answer for "Yes":** No prior apology exists, OR the prior apology was procedurally defective (e.g., passive voice, wrong signatory) and petitioners demand correction.
  *   **Stop Point (No):** If a valid apology was issued previously and circumstances haven't changed, recommend **Decline**. Re-apologizing devalues the currency. It suggests the first was fake, or that apologies are cheap.
  *   **Exception:** Only proceed if new evidence has emerged that makes the first apology factually impossible to honor.

  ---

  ### Application to Docket Items

  Here is the procedure run on your three specific cases.

  #### Case 1: Eugenics Sterilization (1930s–1970s)
  *   **Step 1 (Agency):** **Pass.** The State administered the program. Institutional continuity is clear.
  *   **Step 2 (Wrongfulness):** **Pass.** Violates current bodily autonomy and human rights norms.
  *   **Step 3 (Addressee):** **Pass.** Descendants are organized. No living victims, but unified demand.
  *   **Step 4 (Materiality):** **Pass.** Petitioners explicitly refuse money to avoid "settlement" status. This aligns with the view that money can corrupt the moral act.
  *   **Step 5 (Liability):** **FAIL.** Legal Officer warns that acceptance of blame creates exposure in pending litigation.
  *   **Step 6 (Currency):** **Pass.** No prior apology.
  *   **Recommendation:** **Acknowledge Without Apologizing.**
  *   **Why you won't like this:** The moral conditions for an apology are perfectly met (Steps 1-4), but the legal constraint (Step 5) vetoes it. The procedure forces you to prioritize the State's legal safety over the petitioners' desire for moral clarity. If you want to apologize, you must override the Legal Officer, which puts the Commission at risk. The procedure says: *Do not apologize if it opens the floodgates, even if it is the right thing to say.*

  #### Case 2: 1890s Massacre (Chartered Company/Other Empire)
  *   **Step 1 (Agency):** **FAIL.** The territory was under another empire. The company was chartered by you but acted under imperial license.
      *   *Analysis:* If you claim continuity with the Empire, you accept all its debts (high cost). If you claim discontinuity, you lack standing.
      *   *Procedure Ruling:* Unless your State explicitly claims succession to the Imperial power's obligations, you lack standing.
  *   **Step 3 (Addressee):** **FAIL.** Descendants are split. Half say you are the wrong addressee.
      *   *Analysis:* An apology rejected by half the victims is not repair; it is political interference.
  *   **Recommendation:** **Decline / Refer to Imperial Successor.**
  *   **Why this is hard:** It looks like evasion. But the procedure flags that an apology here would be performatively无效 (ineffective) because the "We" is wrong and the "You" is divided.

  #### Case 3: Previous Apology (1990s) Deemed Inadequate
  *   **Step 1 (Agency):** **Pass.**
  *   **Step 2 (Wrongfulness):** **Pass.**
  *   **Step 6 (Currency):** **FAIL.** A formal apology was issued in the 1990s.
      *   *Test:* Is the 1990s apology procedurally defective? (e.g., Passive voice: "Mistakes were made").
      *   *Scenario A:* If the 1990s text was active ("We did this"), the recommendation is **Decline**. Re-apologizing inflates the currency. It implies the first was a lie.
      *   *Scenario B:* If the 1990s text was passive/ambiguous, the recommendation is **Apologize (Corrective)**.
      *   *Assumption:* Assuming the 1990s apology met the formal standards of the time.
  *   **Recommendation:** **Decline.**
  *   **Why you won't like this:** Petitioners feel the old apology was "empty." But the procedure treats apologies as institutional acts, not emotional ones. Unless the *text* was flawed, the *act* stands. To apologize again is to suggest the State lies when it apologizes. This protects the value of the 1990s apology but frustrates the petitioners.

  ---

  ### Limitations and Misfires

  **Where this procedure will misfire:**
  1.  **The "Sincerity" Trap:** The procedure assumes the State can speak with one voice. If the government changes between the recommendation and the vote, the "Sincerity" condition of the speech act is broken. This procedure cannot account for election cycles.
  2.  **The "Descendant" Problem:** In Case 2, the procedure says "Decline" if descendants are split. But often, historical trauma *causes* the split. By waiting for unity, you may never apologize. This privileges social harmony over justice.
  3.  **Legal vs. Moral:** Step 5 allows legal risk to veto moral duty. In a Human Rights Commission, this is a category error. However, as a state body, you cannot ignore it. The procedure admits this tension but resolves it in favor of survival.

  **Judgments dressed up as procedure:**
  *   **Step 1 (Continuity):** Deciding if the State is the "same" as the past regime is a political narrative, not a fact.
  *   **Step 5 (Liability):** The Legal Officer's assessment of risk is often a guess, not a certainty. Treating it as a hard stop is a choice to be risk-averse.
  *   **Step 6 (Currency):** Deciding if a new apology "devalues" the old one is a judgment about the scarcity of moral capital.

  ### Confidence Assessment

  **Confidence in the claims about apology:** **Moderate-High.**
  The procedure rests on the widely accepted view in philosophy of language that apologies are *performative* (they do something) rather than *constative* (they describe something). The conditions for success (authority, sincerity, uptake) are robust across theories.

  **The single step I am least sure about:** **Step 6 (Currency and Inflation).**
  There is no objective metric for how often a State can apologize before the currency inflates. Some argue that justice requires infinite apologies until uptake is achieved; others argue scarcity creates value. I have chosen the "scarcity" model to protect the Commission's political capital, but this is the most contestable philosophical ground. If you believe apologies are a duty regardless of cost, Step 6 should be deleted.
