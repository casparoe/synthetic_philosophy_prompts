      *   **Goal:** Convert petitions into recommendations (Acknowledge & Apologize, Acknowledge No Apology, Decline, Refer).
      *   **Constraints:**
          *   Documentation uneven, petitioners elderly.
          *   Wording matters (passive voice vs. active responsibility).
          *   Time limit: ~90 minutes per petition for the unit to run the procedure.
          *   Grounding: Philosophy of language/moral philosophy (apology as speech act, standing, collective blame, material vs. symbolic, inflation of currency).
          *   Output: A step-by-step decision procedure (questions, sufficient answers, stop points, hand-off points).
          *   Application: Run it on three specific cases (Sterilization, Massacre/Colonial, Previous Apology).
          *   Tone/Style: No citations, no single contested theory (show divergences), plain language about limitations/judgments, confidence assessment at the end.
          *   Specific Warning: Expect at least one result the user won't like.

  2.  **Deconstruct the Philosophy of Apology (for the Procedure):**

      *   *Speech Act Theory (Austin/Searle):* Apology is performative. It changes the normative status of the parties. Conditions: Sincerity, Authority, Uptake.
      *   *Standing:* Who can apologize? (The State as continuous entity vs. Current Citizens). Who is addressed? (Victims vs. Descendants vs. Public).
      *   *Content:* Admission of fault + Expression of Regret + Commitment to Change/Reparation. Distinction from "regret" (sadness that it happened) vs. "apology" (sadness *we* did it).
      *   *Collective Responsibility:* Not guilt, but obligation to repair/acknowledge institutional continuity.
      *   *Material vs. Symbolic:* Money can look like hush money (settlement) or restitution. Need to distinguish.
      *   *Inflation:* Over-apologizing devalues the currency. Needs scarcity/gravity.

  3.  **Drafting the Decision Procedure (The "90-Minute Filter"):**

      *   *Structure:* Needs to be linear, with clear "Stop/No," "Proceed," and "Escalate/Value Judgment" points.
      *   *Time Management:* 90 minutes means roughly 10-15 minutes per major step.
      *   *Step 1: Jurisdiction & Standing (The "Can We?" Check).* Is this us? Is the state the right agent?
      *   *Step 2: Fact & Wrongfulness (The "Did It?" Check).* Is there a verifiable harm that is currently recognized as wrong?
      *   *Step 3: Continuity & Responsibility (The "Is It Us?" Check).* Institutional continuity vs. regime change.
      *   *Step 4: Addressees & Uptake (The "Who For?" Check).* Living victims vs. descendants. Will this be heard?
      *   *Step 5: The Material Question (The "Money?" Check).* Compensation vs. Settlement.
      *   *Step 6: Inflation & Gravity (The "Worth It?" Check).* Is this serious enough to spend political capital?
      *   *Step 7: Drafting (The "Words?" Check).* Active voice, specific fault.

      *   *Refining the "Judgment vs. Procedure" aspect:* I need to explicitly flag where this isn't mechanical. E.g., determining "institutional continuity" is a legal/political judgment, not a fact.

  4.  **Developing the Three Test Cases:**

      *   *Case 1: Sterilization (1930s-1970s).*
          *   *Facts:* State administered, statute repealed, last survivor died 3 years ago. Descendants want acknowledgment, no money. Legal officer worries about litigation exposure.
          *   *Procedure Run:* Standing is clear (State). Wrongfulness is clear (modern view). Continuity is clear. Addressees are descendants (valid). Material is tricky (Legal says no, Petitioners say no).
          *   *Conflict:* Legal risk vs. Moral duty. The procedure needs to flag this as a *Value/Law Hand-off*.
          *   *Outcome:* Likely "Acknowledge without Apologizing" due to legal risk, or "Apologize" if the Commission overrides legal caution. *Self-Correction:* The prompt asks for *my* procedure to give an answer the user won't like. If the procedure prioritizes "Uptake" and "Sincerity," legal fear might block it. Let's make the procedure flag the legal risk as a hard stop for *Apology* but allow *Acknowledgment*.
      *   *Case 2: Massacre (1890s, Chartered Company, Other Empire).*
          *   *Facts:* Company licensed by state, later nationalized. Territory was another empire. Descendants split.
          *   *Procedure Run:* Standing is weak (Other Empire? Company?). Continuity is tenuous. Addressees are split (Uptake failure risk).
          *   *Outcome:* Likely "Decline" or "Refer." The split among descendants suggests the apology won't succeed as a speech act (no uptake).
      *   *Case 3: Previous Apology (1990s, now deemed inadequate).*
          *   *Facts:* Apology exists. Petitioners want new one.
          *   *Procedure Run:* Inflation risk. Did circumstances change?
          *   *Outcome:* Likely "Decline" unless the 1990s apology was procedurally flawed (passive voice, etc.). This is the "Currency Inflation" check.

  5.  **Refining the Procedure Steps (incorporating the philosophical constraints):**

      *   *Step 1 (Standing):* Are we the right "We"? (State continuity).
      *   *Step 2 (Wrongfulness):* Is it a wrong *now*? (Moral progress).
      *   *Step 3 (Causality/Agency):* Did the state *do* it or just *allow* it?
      *   *Step 4 (Addressee):* Is there someone to receive it? (Living victims vs. public memory).
      *   *Step 5 (The Legal/Material Trap):* Does money kill the apology? Does liability kill the speech act?
      *   *Step 6 (Inflation):* Is this trivial?

      *   *Crucial Addition:* I need to distinguish between *Expressive View* (apology expresses remorse) and *Reparative View* (apology restores standing). I will build a branch point for this.

  6.  **Writing the Response:**

      *   *Intro:* Acknowledge the constraints.
