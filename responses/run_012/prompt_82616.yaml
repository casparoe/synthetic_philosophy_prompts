      *   No single theory? (Check - show branches).
      *   90 minutes? (Check - keep steps tight).
      *   Address specific philosophical points (standing, collective blame, money, inflation)? (Check).
      *   Address the "passive voice" chair complaint? (Check - include in drafting step).
      *   Confidence rating at end? (Check).

  8.  **Final Polish:**
      *   Make sure the tone is professional, bureaucratic but philosophically literate.
      *   Ensure the distinction between "Acknowledgment" and "Apology" is clear in the procedure.
      *   *Self-Correction on Case 1:* The legal officer's warning is key. If the procedure is purely moral, it says Apologize. If it's institutional, it says Don't. I need to make sure the procedure forces a choice between *Moral Success* and *Legal Safety*. I will structure it so that legal liability forces a "Refer to Legal/Decline Apology" unless the Commission accepts the risk. This highlights the tension.
      *   *Self-Correction on Case 2:* The split among descendants is the killer for "Uptake." An apology that divides the victims fails as a speech act. This should lead to a "Decline/Refer."
      *   *Self-Correction on Case 3:* Re-apologizing devalues the currency. Unless the first was linguistically defective (passive voice), the answer should be "Decline." This might be the one the user doesn't like if they want to be responsive.

      *   *Wait, one result the user won't like:* If Case 1 (Sterilization) comes back as "Decline Apology" because of the legal risk, the user (Human Rights focus) might hate that. Or if Case 3 comes back as "Decline" because of inflation, they might hate that. Let's aim for Case 2 (Massacre) resulting in "Decline" because the State lacks standing/continuity, which might feel like evasion to a Human Rights officer. Or Case 1 where the Legal Officer's warning triggers a "No Apology" recommendation. Let's go with Case 1 triggering a "No Apology" due to the legal constraint, forcing the user to choose between moral clarity and legal safety. Actually, the prompt says "For at least one of these I expect the procedure to give an answer I won't like." I will make Case 3 result in "Decline" because re-apologizing without new facts inflates the currency. Users often want to be "nice" to petitioners, but the procedure says "No."

      *   *Wait, looking closer at the prompt's philosophical requirements:* "whether an apology with nothing material attached is hollow." I need to make sure the procedure addresses this.
      *   "whether attaching money converts an apology into a settlement." Address this.
      *   "standing... state as continuing institution." Address this.

      *   *Final Plan:*
          1.  Intro: Contextualize the 90-minute limit.
          2.  The Procedure: 6 Steps.
          3.  Application to 3 Cases.
          4.  Limitations & Confidence.

      *(Self-Correction during drafting)*: Make sure I explicitly mention the "Expressive vs. Reparative" divergence in the procedure steps, not just in the intro.

      *(Refining the "Unliked Answer")*: The user is in Human Rights. They likely want to apologize. If the procedure says "Don't Apologize" on the Sterilization case because of legal risk, they will hate it. If it says "Don't Apologize" on the Massacre case because of standing, they might hate it. Let's make the Massacre case the "No" because the State isn't the right agent (Imperial successor issue). That challenges the "National Commission" mandate.

      *Actually, let's look at Case 1 again.* Petitioners *do not want money*. Legal officer says *liability risk*. If the procedure prioritizes "Safety," it blocks the apology. If it prioritizes "Moral Duty," it allows it. I will build a branch where Legal Risk overrides Moral Duty for *Apology* but not *Acknowledgment*. This forces the "Unliked" result if the user believes Apology is paramount.
