answer: |-
  # Q&A Preparation Sheet: Teletransporter & Anticipation

  **Presenter:** You
  **Topic:** Asymmetry of Anticipation in Branching Cases
  **Audience:** 6 Specific Opponents (2 Reductionists, 1 Non-Reductionist, 2 Empiricists, 1 Decision Theorist)

  **Overall Verdict:** Your position is rhetorically strong but metaphysically vulnerable. You successfully highlight a tension in Parfit's handling of branching, but your inference from "asymmetric anticipation" to "persisting subject" is a non-sequitur that the Reductionists will exploit. Causal relations are themselves asymmetric; you do not need a "subject" to ground directionality, only a causal arrow. You are likely to concede too much on the nature of the subject to save the argument.

  ---

  ### 1. The "Question-Begging" Objection (The Parfitian Reductionists)
  **Likelihood:** Certain | **Damage:** Critical
  **Voice:** "You say the replica can't anticipate the original's future because the causal arrow points the other way. Fine. But then you infer that because anticipation is directed, it requires a 'persisting subject.' That's the move we reject. Why can't anticipation be directed simply because *causation* is directed? You've assumed that only a subject can bear directionality to prove that a subject exists. You haven't refuted reductionism; you've just asserted that reductionism can't explain direction, which is exactly what Parfit claims causal continuity *does* explain."

  **Two-Minute Reply:**
  "I grant that causal relations are asymmetric. But causation alone doesn't explain the *first-personal* grip of anticipation. A camera records a causal chain, but it doesn't anticipate. When I anticipate, I don't just predict a future state; I expect to *inhabit* it. In the branching case, the Original knows he will inhabit the next ten years. He does not expect to inhabit the Replica's life, even though the Replica is causally connected to him. If it were just about causal arrows, the Original should anticipate the Replica's future as much as his own, since both are causally downstream. The fact that he distinguishes 'my future' from 'his future' despite equal psychological continuity suggests the 'I' is doing work that causation isn't."

  **Candid Note:** This is soft. Parfit will reply that the Original *does* care about the Replica, just not exclusively. You are relying on an intuition ("I won't be him") that Parfit explicitly denies ("You will be both, or neither, but what matters is present in both"). You are smuggling in the conclusion that identity must be one-to-one.
  **Verdict:** **It Lands.** You haven't proven a subject is needed, only that our intuitions resist branching.

  ### 2. The "Discount Rate" Objection (The Decision Theorist)
  **Likelihood:** High | **Damage:** High
  **Voice:** "You're treating 'anticipation' as a metaphysical glue. I treat it as a parameter in a utility function. If I discount the Replica's welfare at 100% relative to my own, that's a preference structure, not an ontological discovery. Are you saying my discount rate is *wrong*? Or are you saying there's a fact of the matter that makes it rational? If the latter, show me the payoff. If the former, you're just doing normative ethics, not metaphysics."

  **Two-Minute Reply:**
  "It's not just a preference. If I tell you 'I am not anticipating that pain,' I am making a claim about the world, not just my budget. If anticipation were merely a discount rate, I could rationally choose to anticipate the Replica's future just as much as my own by adjusting my rate. But I can't. I find it impossible to anticipate the Replica's experiences as *mine* once I know he is distinct. This impossibility isn't normative; it's structural. It reveals the boundaries of the self, not just the boundaries of my concern."

  **Candid Note:** You are conflating "psychological impossibility" with "metaphysical necessity." The Decision Theorist will argue that evolutionary hardwiring explains the impossibility without needing a "subject."
  **Verdict:** **It Lands.** You cannot easily distinguish a hardwired discount rate from a metaphysical subject using only behavioral reports.

  ### 3. The "Circular Definition" Objection (The Non-Reductionist)
  **Likelihood:** High | **Damage:** Medium
  **Voice:** "I agree with your conclusion that reductionism fails, but your argument is useless to me. You say a 'persisting subject' is required for anticipation. But you define the subject as 'that which anticipates.' This is circular. If I ask 'What is the subject?', you say 'The thing that survives.' If I ask 'How do we know it survives?', you say 'Because it anticipates.' You haven't given me an account of personal identity; you've just given a name to the mystery."

  **Two-Minute Reply:**
  "It's not circular; it's phenomenological. I'm not defining the subject *exhaustively* by anticipation; I'm identifying its necessary condition. Just as we identify matter by resistance, I identify the subject by the direction of anticipation. I don't need to know the substrate (soul, brain, etc.) to know the structure. The reductionist claims the structure is symmetric (Relation R). I show the structure is asymmetric. Therefore, Relation R is not the whole story. That leaves room for your 'further fact' without me having to specify its substance."

  **Candid Note:** This is your strongest alliance, but they will press you on whether "structure" without "substance" is enough to save non-reductionism. You risk satisfying no one: too metaphysical for Reductionists, too deflated for Non-Reductionists.
  **Verdict:** **Partial Land.** They will accept the conclusion but reject your contribution to it.

  ### 4. The "Ecological Validity" Objection (The Empiricists)
  **Likelihood:** Medium | **Damage:** Medium
  **Voice:** "Why are we talking about teletransporters? We have patients with commissurotomy or dissociative identity disorder. In split-brain cases, we see two streams of consciousness arising from one brain. No 'replica' needed. If your asymmetry argument works, it should work there. But in split-brain cases, the hemispheres don't seem to 'anticipate' in a way that posits a single subject either. Why rely on sci-fi when the neuroscience already shows continuity is fragmentary?"

  **Two-Minute Reply:**
  "Real cases are messy. In commissurotomy, we can't ask the hemispheres what they anticipate in the same way. The teletransporter is a *clean* case of branching. It isolates the variable of psychological continuity from physical continuity. In dementia or amnesia, continuity is degraded. In the teletransporter, it is perfect. I need the perfect copy to show that even with *perfect* continuity, anticipation fails to cross the gap. Real cases show continuity breaks; my case shows continuity isn't enough even when it holds."

  **Candid Note:** This is a standard defense of thought experiments, but the Empiricists will view it as evasion. They will argue that if the intuition doesn't map to neural reality, it's a bug in the intuition, not a feature of the world.
  **Verdict:** **Defensible.** You can hold the line that idealization is necessary for metaphysical isolation.

  ### 5. The "Causal Asymmetry" Objection (The Parfitian Reductionists - Round 2)
  **Likelihood:** Medium | **Damage:** High
  **Voice:** "You keep saying the Replica can't anticipate the Original's future. We agree. But that's because causation runs Original → Replica, not vice versa. Parfit allows causal directionality. So, we have asymmetry without a 'subject.' You've proven that anticipation tracks causal direction. You haven't proven it tracks a 'persisting subject.' You've just reinvented the reductionist wheel and painted it black."

  **Two-Minute Reply:**
  "Causal direction explains why the Replica can't affect the Original. It doesn't explain why the Original doesn't *expect to be* the Replica. If I am just a bundle of psychological states, and the Replica has all my states plus the memory of being me, why isn't his future part of my anticipation? Causation explains the *order* of events, but not the *locus* of experience. The 'subject' is the name for that locus. If you remove the subject, you remove the locus, and then anticipation becomes meaningless."

  **Candid Note:** This is the crux. You are asserting that "locus of experience" requires a subject. They assert "locus of experience" is just a label for a specific causal node. You have no argument to bridge this gap other than intuition.
  **Verdict:** **It Lands.** This is the weakest joint in your armor, as you admitted.

  ### 6. The "Reconstructive Memory" Objection (The Empiricists - Round 2)
  **Likelihood:** Low | **Damage:** Low
  **Voice:** "Anticipation is just memory running forward. Neuroscience shows memory is reconstructive, not a playback. So anticipation is a simulation. The Replica simulates the Original's future based on data. The Original simulates his own. Both are simulations. Why privilege one as 'real' anticipation? You're reifying a cognitive process into a metaphysical entity."

  **Two-Minute Reply:**
  "The *content* of the simulation might be reconstructive, but the *attitude* toward the content is not. I can simulate your pain, but I don't dread it. I dread my own. That dread is the marker of the subject. The neuroscience of *how* I simulate doesn't explain *why* I dread one simulation and not the other. That's a metaphysical boundary, not a neural one."

  **Candid Note:** Safe ground. The distinction between simulation and anticipation is standard in philosophy of mind.
  **Verdict:** **Does Not Land.** You can hold this distinction.

  ### 7. The "Nature of the Subject" Objection (The Non-Reductionist - Round 2)
  **Likelihood:** Low | **Damage:** Medium
  **Voice:** "Okay, suppose you're right. There is a subject. Is it a Cartesian ego? A biological organism? If it's the organism, then the teletransporter destroys it, and you're a dead end. If it's an ego, how does it interact with the scanner? You can't just say 'subject' and stop. You need an ontology."

  **Two-Minute Reply:**
  "I am arguing for a formal requirement, not a specific ontology. Whether the subject is biological or simple, it must satisfy the condition of being the unique bearer of anticipation. The teletransporter shows that psychological continuity doesn't satisfy this. That constrains your ontology. It doesn't have to be dualist; it just has to be non-reductionist. Maybe it's the organism. If so, the teletransporter kills me. That's a bullet I'm willing to bite."

  **Candid Note:** Biting the bullet that the teletransporter kills you is costly. It makes your view conservative. The Non-Reductionist might want a "survival" story you can't give.
  **Verdict:** **Defensible.** Consistency is better than a vague ontology.

  ### 8. The "Hope Nobody Asks" Objection (The Killer)
  **Likelihood:** Low (but possible) | **Damage:** Fatal
  **Voice:** "You say the Original survives for ten years. So, at the moment of scanning, the Original knows he will continue. Does he anticipate the Replica's experiences as his *own*? If he says 'No,' then anticipation tracks Identity, and Parfit is wrong that Identity doesn't matter. But if he says 'No,' then the Replica is a *different person*. If the Replica is a different person, why does it matter if he has my memories? You've proven Identity matters, but you've done it by assuming the Replica isn't you. But if the Replica isn't you, your case isn't a case of *survival*, it's a case of *death and replacement*. You haven't shown Identity doesn't matter in survival; you've shown that if Identity doesn't hold, it's not survival. That's a tautology."

  **Two-Minute Reply:**
  "This is the tension I'm exploiting. Parfit wants to say: 'Identity doesn't hold, but Survival does.' I am saying: 'If Identity doesn't hold, Survival (in the first-person sense) doesn't either.' The Original knows he is not the Replica. Therefore, he does not anticipate the Replica's life as his own. Parfit claims this doesn't matter because 'Relation R' holds. I claim it matters precisely because anticipation fails. So, either Identity matters (because it's required for anticipation), or Survival is an empty concept. I'm forcing Parfit to admit that without Identity, 'survival' is just 'someone else like me exists.'"

  **Candid Note:** This exposes that your argument is essentially: "Parfit is wrong because our intuition says Identity matters." You aren't proving *why* it matters metaphysically, only that we believe it does. The objector will say this is a psychological observation, not a metaphysical proof.
  **Verdict:** **Fatal.** This reduces your argument to an appeal to intuition against a theory designed to override intuition.

  ---

  ### Strategic Advice for the Session

  1.  **Concede the Ontology:** Do not try to define *what* the subject is (soul, brain, etc.). Stick to the *functional role* of the subject (the bearer of asymmetric anticipation). If you try to define the substance, the Empiricists and Reductionists will eat you alive.
  2.  **Own the "Death" Bullet:** When pressed on whether the teletransporter kills the original, say "Yes." It strengthens your claim that Identity matters. If you try to say "No, he survives in the replica," you contradict your own asymmetry argument.
  3.  **The Reductionist Trap:** They will try to frame "anticipation" as a degree concept ("I anticipate the replica 50%"). You must insist it is binary ("I either dread it or I don't"). If you allow degrees, they win.
  4.  **Final Warning:** Your argument relies on the premise that *Anticipation requires Identity*. Parfit's entire project is to show that *What Matters* (anticipation/concern) can be separated from *Identity*. You are asserting the link without fully breaking Parfit's decoupling mechanism. Be prepared to admit that you are prioritizing the phenomenology of the first-person perspective over the third-person metaphysical analysis. That is a valid stance, but own it as a methodological choice, not a logical proof.
