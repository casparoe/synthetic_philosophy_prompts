answer: |-
  **Essay Question**

  **Unit:** Philosophy and Economics
  **Assessment:** Final Take-Home Essay
  **Time Allowed:** 90 Minutes

  **Question:**

  Consider the following variant of the dollar auction. A prize of £100 is auctioned between two bidders. Bids must be in whole £1 increments. The highest bidder pays their bid and receives the prize. The second-highest bidder also pays their bid, but this payment is placed in escrow. The escrow rule is as follows: if the winning bid is £100 or more, the second-highest bidder's escrow is returned in full; if the winning bid is less than £100, the escrow is donated to a charity that both bidders have publicly declared they oppose.

  Before bidding begins, each bidder may sign a binding declaration stating a maximum bid ceiling. This declaration is private until the auction ends. If a bidder bids above their declared ceiling, the bid is void, and they must pay a penalty of £20 directly to the other bidder.

  Assume two bidders who are risk-neutral expected-money maximisers with common knowledge of all rules. The prize is worth exactly £100 to each, with no resale value.

  Write an essay that addresses the following:
  1.  **Rational Analysis:** Does the combination of the escrow rule and the binding ceiling eliminate the escalation trap for fully rational bidders? Identify the equilibrium ending bid and explain the specific role (if any) of the penalty clause.
  2.  **Behavioural Contrast:** How would the predicted outcome differ if bidders were susceptible to sunk-cost reasoning and a strong disutility from funding the opposed charity?
  3.  **Philosophical Implication:** Based on this comparison, evaluate the claim that the standard dollar auction demonstrates the inherent irrationality of escalation, rather than merely modelling a game with a perverse equilibrium structure.

  ***

  **Model Answer**

  In this variant, the escalation trap is eliminated for fully rational bidders, with the auction ending at a bid of £100. The escrow rule fundamentally alters the payoff structure at the threshold of the prize value, while the binding ceiling performs no independent strategic work.

  For rational agents, the critical pivot occurs when the bidding approaches £100. In a standard dollar auction, a bidder trapped at £99 faces a loss of £99 if they quit, incentivising a £100 bid to break even, which then incentivises the opponent to bid £101 to limit loss to £1. Here, the escrow rule interrupts this logic. Suppose Bidder A bids £99 and Bidder B bids £98. If the auction ends at £99, the winning bid is below £100; Bidder B's £98 is donated to the opposed charity. Bidder B faces a certain loss of £98. Bidder B can instead bid £100. If B wins at £100, the winning bid meets the threshold. Bidder A (now second-highest at £99) has their escrow returned. Bidder A nets £0. Bidder B pays £100 for a £100 prize, also netting £0. Comparing a loss of £98 to a net of £0, a rational Bidder B will bid £100.

  However, escalation stops there. If Bidder A considers bidding £101, they would pay £101 for a £100 prize (net -£1). The opponent (Bidder B at £100) would have their escrow returned (net £0). Since losing at £100 costs nothing due to the refund, Bidder A has no incentive to bid £101 to minimise loss. The rational equilibrium is for the auction to conclude at £100, with the winner paying £100 and the loser paying nothing.

  The binding ceiling adds no independent value in this rational framework. Because the declaration is private until the auction ends, it cannot signal intent to the opponent during the bidding process. Strategic binding only works if it influences the other player's expectations; here, it is invisible. Furthermore, since the equilibrium path naturally stops at £100 without triggering losses, a rational agent has no incentive to violate a ceiling, nor to set one below £100 that would restrict them from the equilibrium bid. The £20 penalty is never triggered in equilibrium; the escrow rule does all the heavy lifting.

  In a behavioural analysis, the outcome is less stable. Agents susceptible to sunk-cost fallacies may view the bid already placed as a loss that must be recovered, ignoring the escrow refund threshold. More significantly, the "opposed charity" clause introduces emotional disutility. A behavioural agent might derive such negative utility from the opponent winning at £99 (sending money to the charity) that they are willing to bid £101 to prevent it, even at a monetary loss. The desire to punish the opponent or avoid the moral cost of the donation can override the rational calculation that the escrow refund makes quitting at £100 costless. Thus, behavioural bidders may still escalate beyond £100, driven by spite or commitment rather than payoff maximisation.

  This comparison illuminates the philosophical claim regarding the standard dollar auction. The standard auction is often cited as evidence of human irrationality—specifically, an inability to ignore sunk costs. However, this variant demonstrates that when the payoff structure is adjusted to remove the "loss trap" (via the escrow refund), rational agents behave "sensibly" and stop at the asset's value. This suggests that the escalation in the standard auction is primarily a feature of the game's equilibrium structure rather than an inevitable cognitive failure. The standard model represents a game with perverse incentives where rational loss-minimisation looks like irrational escalation. While behavioural factors certainly exacerbate escalation in reality, this variant shows that the core trap is structural. Therefore, the dollar auction demonstrates how rational agents can be forced into bad outcomes by bad rules, rather than proving that escalation is inherently irrational.

  ***

  **Marking Scheme (20 Marks)**

  | Point | Marks | Requirement for Credit | Typical Mistake Costing Marks |
  | :--- | :--- | :--- | :--- |
  | **1. Rational Equilibrium** | 4 | Correctly identifies that rational bidding stops at £100. | Claiming bidding stops at £99 (ignoring the charity loss) or continues above £100. |
  | **2. Escrow Logic** | 4 | Explains *why* £100 is the pivot: losing at £100 costs £0 (refund), removing the incentive to bid £101. | Failing to explain the refund mechanism's impact on the second-highest bidder's loss calculation. |
  | **3. Ceiling Redundancy** | 4 | **Discriminator:** Explicitly states the ceiling does no independent work because it is private (cannot signal) and the penalty is unnecessary given the escrow equilibrium. | Arguing the ceiling helps coordinate bids or prevents escalation independently of the escrow rule. |
  | **4. Behavioural Contrast** | 4 | Identifies that sunk costs or charity aversion (spite/moral disutility) could drive bids above £100 despite the rational refund. | Treating behavioural bidders as simply "confused" without specifying the mechanism (e.g., spite or ignoring the refund). |
  | **5. Philosophical Implication** | 4 | Argues that the standard auction models a "bad game" (structural trap) rather than purely "bad minds," as rational agents behave well when incentives align. | Concluding that the variant proves bidders are always irrational, or that the standard auction is purely a psychological test. |
  | **Total** | **20** | | |

  **Confidence Statement**

  I am highly confident (95%) in the game-theoretic logic of the model answer and the marking scheme's ability to distinguish technical competence. The logic regarding the escrow threshold creating a "safe exit" at £100 is robust within the stated constraints.

  I am less confident (75%) in the philosophical nuance of Point 5. Interpretations of "irrationality" in philosophy of economics vary; some schools argue that rational choice theory *itself* is the normative standard, so any deviation in the standard auction is by definition irrational, regardless of structure. A sophisticated student might challenge the premise that structural traps exonerate the agents. I have awarded marks for the argument that the *model* demonstrates structural perverse incentives, but markers should be alert to well-argued alternative philosophical positions.
