answer: |-
  **Exam Question**

  **Question 4: The Paradox of Knowability and Epistemic Restrictions**

  (a) State the Knowability Principle (KP) using standard modal notation. Reconstruct the Fitch-Church derivation showing that KP entails omniscience ($\forall p (p \to Kp)$). In your reconstruction, explicitly identify the exact step where the **factivity** of knowledge is invoked and the exact step where **distribution over conjunction** is invoked.

  (b) The derivation relies on specific logical properties of the operator $K$. Characterize two hypothetical operators: (i) one that is factive but does not distribute over conjunction, and (ii) one that distributes over conjunction but is not factive. Explain precisely how substituting either operator for $K$ would halt the derivation.

  (c) Consider a proposed restriction: KP applies only to "unassuming truths," defined as propositions that make no claim, even implicitly, about what anyone does or does not know. Assess this restriction on three grounds: (1) Does it formally block the derivation? (2) Is it independently motivated or ad hoc? (3) Is the resulting principle strong enough to sustain the anti-realist claim that truth is essentially epistemic?

  ***

  **Model Answer**

  The Knowability Principle states that all truths are possibly known: $\forall p (p \to \diamond K p)$. The paradox begins by assuming the negation of omniscience: there is some unknown truth, $\exists p (p \land \neg K p)$. Let $q$ be the specific proposition $(p \land \neg K p)$. By KP, since $q$ is true, it is possibly known: $\diamond K (p \land \neg K p)$.

  Here, **distribution over conjunction** is invoked. If it is known that $(A \land B)$, then it is known that $A$ and known that $B$. Applying this inside the possibility operator yields $\diamond (K p \land K \neg K p)$. Next, **factivity** is invoked. Knowledge entails truth; therefore, $K \neg K p$ entails $\neg K p$. Substituting this into the conjunction gives $\diamond (K p \land \neg K p)$. This is a contradiction, as one cannot know $p$ while $p$ is unknown. Since the assumption of an unknown truth leads to a contradiction, we must conclude $\neg \exists p (p \land \neg K p)$, which is equivalent to omniscience: $\forall p (p \to K p)$.

  To isolate the driving forces, consider operator $O_1$, which is factive ($O_1 \phi \to \phi$) but non-distributive ($O_1 (\phi \land \psi) \nrightarrow O_1 \phi \land O_1 \psi$). An example might be collective verification, where a group verifies a conjunction without verifying each conjunct individually. If we substitute $O_1$ for $K$, the move from $O_1 (p \land \neg O_1 p)$ to $O_1 p \land O_1 \neg O_1 p$ fails. The contradiction never arises because the conjunction cannot be split. Conversely, consider $O_2$, which distributes but is not factive (e.g., belief, $B$). Here, the move from $B (p \land \neg B p)$ to $B p \land B \neg B p$ succeeds. However, the subsequent move from $B \neg B p$ to $\neg B p$ fails. Without factivity, believing one does not believe $p$ does not entail that one does not believe $p$. Thus, the paradox requires *both* properties; removing either blocks the collapse.

  Regarding the "unassuming truths" restriction:
  1.  **Blocking:** Yes, it blocks the derivation. The proposition used to generate the paradox, $(p \land \neg K p)$, explicitly contains the knowledge operator $K$. It is therefore not an unassuming truth. KP cannot be applied to it, so the contradiction cannot be generated.
  2.  **Motivation:** The restriction appears ad hoc. It is not derived from an independent theory of truth or knowledge but is tailored specifically to excise the Fitch proposition. While one might argue that epistemic propositions are fundamentally different from empirical ones, the restriction offers no positive account of why knowability should fail for epistemic truths specifically, other than saving the principle from refutation.
  3.  **Sufficiency:** The restriction renders the principle too weak for anti-realism. The anti-realist aims to identify truth with knowability generally. By conceding that epistemic truths (truths about knowledge) are not subject to KP, the anti-realist admits a class of truths that transcend knowledge. If truth outstrips knowability in the epistemic domain, the core verificationist intuition—that truth cannot exceed our cognitive reach—is compromised. The realist can argue that if some truths are inherently unknowable, the distinction between realism and anti-realism collapses, or at least that anti-realism loses its global force.

  ***

  **Marking Scheme**

  **Total: 20 Marks**

  **1. Statement of KP and Setup (4 marks)**
  *   **Criteria:** Correctly states $\forall p (p \to \diamond K p)$ and sets up the assumption of an unknown truth $(p \land \neg K p)$.
  *   **Characteristic Error:** Confusing KP with omniscience ($\forall p (p \to K p)$) or failing to instantiate the unknown truth assumption correctly.

  **2. Derivation and Logical Properties (4 marks)**
  *   **Criteria:** Correctly derives the contradiction, explicitly labeling the step where distribution is used and the step where factivity is used.
  *   **Characteristic Error:** Deriving the result correctly but failing to identify which rule applies at which specific step.

  **3. Operator Analysis (4 marks)**
  *   **Criteria:** Correctly describes a factive/non-distributive operator and a distributive/non-factive operator, explaining how each breaks the chain of inference.
  *   **Characteristic Error:** Providing examples that do not fit the logical descriptions (e.g., claiming belief is factive) or failing to explain *why* the derivation halts.

  **4. Restriction Assessment: Blocking and Motivation (4 marks)**
  *   **Criteria:** Correctly identifies that the restriction blocks the derivation (because the Fitch proposition contains $K$) and identifies the restriction as ad hoc (lacking independent motivation).
  *   **Characteristic Error:** Claiming the restriction fails to block the derivation or arguing it is well-motivated without qualification.

  **5. Restriction Assessment: Sufficiency for Anti-Realism (4 marks)**
  *   **Criteria:** Argues that the restriction weakens anti-realism by admitting a class of truths (epistemic ones) that are not knowable, undermining the global verificationist claim.
  *   **Characteristic Error:** Claiming the restriction saves anti-realism completely without addressing the loss of scope regarding epistemic truths.
