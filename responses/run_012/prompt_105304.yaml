answer: |-
  # The Language & Assumption Diagnostic

  **Instructions:** Read each scenario and choose the option that best matches your gut reaction. Do not overthink. There are no right answers, only different commitments.

  **1. The Grammar Book**
  A vintage style guide states: "In the generic sense, *man* embraces *woman*."
  *   **A.** It's etymologically correct; *man* historically meant human. The meaning is clear.
  *   **B.** It's exclusionary; modern readers hear "male," so the word fails its generic purpose.
  *   **C.** It's poetic; the sentence is about archetypes, not headcounts.

  **2. The Hospital Scene**
  In your novel, the attending physician is referred to as *he* and the charge nurse as *she*.
  *   **A.** It reflects the statistical reality of the era you're writing in.
  *   **B.** It reinforces harmful stereotypes; you should swap them or make them non-binary.
  *   **C.** It only matters if the narrative treats those roles as inherently gendered.

  **3. The Conlang Project**
  You are building a language where the unmarked, default pronoun is specifically for landowners.
  *   **A.** It's a brilliant world-building tool to expose how our own defaults encode class.
  *   **B.** It's oppressive; the unmarked form should belong to the most common person.
  *   **C.** It's just morphology; the pronoun means whatever the speakers agree it means.

  **4. The Translation**
  You are translating a French text where every object has a gender (masculine/feminine).
  *   **A.** Preserve the gender where possible; the author chose it for rhythm or reason.
  *   **B.** Neutralize it; do not import grammatical sexism into English.
  *   **C.** Randomize it; flip genders to show the reader that the original categorization was arbitrary.

  **5. The Style Guide Ban**
  Your publisher's style guide bans the singular *they* for unknown persons.
  *   **A.** Follow it; consistency across the manuscript matters more than this specific rule.
  *   **B.** Ignore it; singular *they* is standard English and inclusive.
  *   **C.** Rewrite the sentences to avoid pronouns entirely so the rule doesn't apply.

  **6. The Mystery Character**
  You write a scene where a character's gender is never stated.
  *   **A.** Readers will assume male anyway; it creates confusion, not mystery.
  *   **B.** It allows readers to project themselves; it's a liberating gap.
  *   **C.** It draws too much attention to gender; just pick one and write the story.

  **7. The Satire**
  You read a story that swaps gender for height to expose how arbitrary default privileges are.
  *   **A.** It's effective; the shock value reveals hidden bias in our norms.
  *   **B.** It's distracting; readers focus on the trick, not the point.
  *   **C.** It's unfair; different axes of privilege aren't comparable analogies.

  **8. The Reader's Mind**
  A reader admits that whenever they read "the user," they picture a man.
  *   **A.** That's a cognitive habit; language shapes thought, so we must change the language.
  *   **B.** That's the reader's problem; the text itself is neutral.
  *   **C.** That's useful; cognitive defaults help speed up processing while reading.

  **9. The Institution**
  A writer argues: "Changing pronouns is cosmetic because power lives in institutions, not grammar."
  *   **A.** True; focus on pay gaps and laws, not vocabulary.
  *   **B.** False; language normalizes the power structures that uphold institutions.
  *   **C.** Both; grammar is easy to fix, so fix it while fighting the harder institutional battles.

  **10. The Description**
  A female character is described by her beauty; a male character by his deeds.
  *   **A.** It's the male gaze; it objectifies the woman and reduces her agency.
  *   **B.** It characterizes the narrator's bias, not necessarily the author's.
  *   **C.** Men and women are often perceived differently in reality; reflect that truth.

  ***

  # Scoring Key & Position Profiles

  Do not count points. Instead, look at which **cluster** of answers you chose most frequently. Most people will have a mix, but one profile should feel like "home."

  ### 1. The Semantic Neutralist
  *   **Pattern:** Mostly **A** on Q1, Q3, Q8.
  *   **View:** Words are tools with definitions. If the definition is "human," the word is neutral regardless of social baggage.
  *   **Most Awkward Commitment:** You must defend etymology against lived experience.

  ### 2. The Pragmatic Defaultist
  *   **Pattern:** Mostly **A** on Q2, Q6, Q8.
  *   **View:** Defaults are efficient cognitive shortcuts. Disrupting them slows communication without guaranteed benefit.
  *   **Most Awkward Commitment:** You must admit efficiency trumps representation.

  ### 3. The Reformist
  *   **Pattern:** Mostly **B** on Q1, Q2, Q5, Q9.
  *   **View:** Language perpetuates harm. Inclusive usage is a moral obligation that helps shift culture.
  *   **Most Awkward Commitment:** You must police language constantly, even in private drafts.

  ### 4. The Mirror-Satirist
  *   **Pattern:** Mostly **A** on Q3, Q4, Q7.
  *   **View:** The best way to expose bias is to exaggerate it or swap it until it looks absurd.
  *   **Most Awkward Commitment:** You risk being misunderstood as bigoted by the very people you hope to wake up.

  ### 5. The Language-Skeptic
  *   **Pattern:** Mostly **A** on Q3, Q9, **C** on Q1.
  *   **View:** Material conditions cause oppression, not pronouns. Focusing on grammar is a distraction from real power.
  *   **Most Awkward Commitment:** You must ignore the emotional impact words have on marginalized people.

  ### 6. The Craft-First
  *   **Pattern:** Mostly **C** on Q2, Q5, Q6, Q10.
  *   **View:** The story's aesthetic and narrative integrity trump external political or grammatical rules.
  *   **Most Awkward Commitment:** You must prioritize aesthetics over ethics when they conflict.

  ### 7. The No-Gendered-Pronouns-At-All
  *   **Pattern:** Mostly **C** on Q5, **B** on Q4, **B** on Q1.
  *   **View:** Gender marking itself is the problem. The goal is to eliminate gendered pronouns entirely, not just balance them.
  *   **Most Awkward Commitment:** You must fight the entire structure of Indo-European language, not just usage.

  ***

  # Limitations & Blind Spots

  **Positions the Quiz Cannot Separate**
  *   **Semantic Neutralist vs. Pragmatic Defaultist:** These two often arrive at the same conclusion (keep the status quo) for different reasons (one says it's *true*, the other says it's *efficient*). The quiz treats them similarly because in a writers' group, their output looks identical.
  *   **Language-Skeptic vs. Craft-First:** Both prioritize the "real work" (institutions or storytelling) over linguistic hygiene. Distinguishing them requires knowing if the writer cares about *art* or *politics* more, which this quiz only hints at.

  **Empty or Incoherent Combinations**
  *   **The Satirist-Skeptic:** If you believe language *doesn't* matter (Skeptic), you wouldn't bother writing satire to expose linguistic bias (Satirist). If you chose high Satirist and high Skeptic scores, you may be confused about whether you think language has power.
  *   **The Traditional-No-Gendered:** If you insist on strict traditional grammar (Q5 Option A) but also want to abolish gendered pronouns (No-Gendered), your position is operationally incoherent. Traditional grammar relies on gendered distinctions.
  *   **The Reformist-Defaultist:** You cannot simultaneously believe defaults are harmful (Reformist) and that defaults are necessary for efficiency (Defaultist). If you scored high on both, you likely feel torn between social responsibility and narrative flow.

  **How to Use This in Your Group**
  When an argument starts, ask members to identify their Profile. Instead of saying "You're being sexist," someone can say, "I'm operating from a Craft-First profile, and you're operating from a Reformist profile; we are arguing about priorities, not facts." This moves the fight from *who is right* to *what are we optimizing for?*
