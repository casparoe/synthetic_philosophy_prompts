answer: |-
  **Project Title:** The Etiology and Vehicle of Meaning: Disentangling Genetic and Sustaining Conditions in Symbol Grounding

  **Principal Investigator:** [My Name]
  **Duration:** 12 Months

  **Statement of the Problem**
  Last month, during a discussion on the capabilities of modern multimodal machine learning systems, a colleague argued that the symbol grounding problem has been solved in practice. His claim was that systems trained on sufficient text and image data inevitably develop internal representations that "mean" something in a robust sense, and that philosophical skepticism on this front is merely an artifact of analyzing toy systems. I contended that this assertion answers a different question than the one posed by the grounding problem. However, our inability to locate the precise point of divergence suggests a structural ambiguity in the literature itself.

  This project proceeds from the hypothesis that discussions of symbol grounding conflate two distinct questions: the *genetic* question (what causal history must a token have to acquire content?) and the *sustaining* question (what features of a system's current organization and coupling fix that content now?). My central research question is determinate: **Does separating genetic from sustaining conditions resolve the contradictory intuitions that currently stall debates over machine meaning, or do these conditions prove inseparable in any system capable of genuine semantic content?**

  **Why Existing Positions Leave This Open**
  The current stalemate is not merely unresolved; it is structurally obscured. Standard causal-historical theories address the genetic question but are routinely critiqued using sustaining intuitions (e.g., objections regarding deviant causal chains often rely on the fact that the current system state does not support the inferred meaning). Conversely, functional-role and inferentialist accounts address the sustaining question but are critiqued using genetic intuitions (e.g., the Chinese Room argument relies on the absence of the right kind of history or biological organization, not just current syntax manipulation).

  Because these theories are presented as comprehensive accounts of "grounding," they are judged against criteria they were not designed to meet. This leads to a dialectic where proponents of machine grounding point to complex functional integration (sustaining) as proof of meaning, while skeptics point to the lack of biological or causal history (genetic) as disproof. Neither side is wrong; they are addressing different temporal dimensions of content. By failing to distinguish these dimensions, the literature treats a potential category distinction as a substantive disagreement. This project argues that this conflation prevents a determinate assessment of artificial semantic systems.

  **Methodology and Work Plan**
  The method is largely conceptual, utilizing a framework of conceptual engineering and modal analysis. I will construct cases where genetic and sustaining conditions diverge to test the resilience of standard grounding accounts. The work is divided into four phases over twelve months.

  *Months 1–3: Taxonomy and Case Construction*
  I will formalize the genetic/sustaining distinction. The primary output will be a set of thought experiments where these conditions come apart. For example, I will design cases of "semantic amnesia" (a system with the correct causal history but current architecture scrambled) and "instantaneous grounding" (a system with perfect functional coupling but no training history, perhaps via hard-coding). I will map existing theories of content (causal, teleological, functional role) onto this matrix to determine which dimension they primarily address.

  *Months 4–7: Stress-Testing Theories*
  I will attempt to restate standard theories to answer only one of the two questions. Can a causal theory be restricted to genetic acquisition without making claims about current meaning? Can a functional role theory explain sustaining conditions without implying anything about origin? I will analyze the cost of this restriction. If a causal theory cannot explain why a symbol means what it does *now* without referencing history, it collapses into a sustaining account. If a functional theory cannot explain how content was acquired without referencing current use, it collapses into a genetic account. I will document where these collapses occur.

  *Months 8–10: Application to Machine Learning*
  I will apply the refined framework to my colleague's claim. I will analyze large multimodal models not as a monolith, but by asking: Do they satisfy the genetic conditions (via training trajectories and loss landscapes)? Do they satisfy the sustaining conditions (via internal activation structures and environmental feedback loops)? This will allow me to specify exactly what is "solved" and what remains open. This phase moves the debate from "Is it grounded?" to "Which dimension of grounding is present?"

  *Months 11–12: Synthesis and Dissemination*
  I will draft two papers. The first will argue for the distinction itself and demonstrate how it dissolves specific paradoxes in the literature. The second will apply this framework to the philosophy of AI, offering a precise diagnosis of the disagreement between skeptics and proponents of machine meaning.

  **Success and Failure Conditions**
  A successful outcome will look like a dissolution of the current stalemate. Specifically, success is achieved if I can show that standard objections to machine grounding are actually objections to the *genetic* condition, while claims of success are claims about the *sustaining* condition. If I can demonstrate that a system can satisfy one without the other, and that this distinction maps onto our intuitive judgments about meaning, the project will have provided a new vocabulary that renders the old debate obsolete.

  However, I must be honest about the possibility of failure. There are two ways this project could fail to yield a positive result. First, the distinction may be real but inert. It is possible that genetic and sustaining conditions are so tightly coupled in any physically realizable system that separating them makes no difference to live disputes. If every system that satisfies sustaining conditions necessarily satisfies genetic ones (or vice versa), the distinction is theoretically valid but practically useless. Second, the distinction may collapse. It is possible that upon rigorous analysis, "sustaining" conditions invariably require "genetic" history to be intelligible (e.g., function is defined by etiology). If I find that no theory can be successfully split without losing its explanatory power, the project will conclude that the conflation is necessary, not accidental.

  **Scope and Limitations**
  This project is philosophical, not empirical. I will not be training models or analyzing weight matrices directly; I will be analyzing the logical structure of the claims made about them. Consequently, I will leave for later work the empirical investigation of whether specific architectures actually meet the criteria I define. This proposal is limited to establishing the criteria and the logical space. If the distinction holds, the next step would be a collaborative empirical project with computer scientists to audit specific systems against these new standards. For this fellowship year, the goal is to determine whether such an audit would be meaningful.

  By the end of the year, I expect to have either resolved the argument with my friend by showing him exactly which half of the problem his models solve, or to have demonstrated that our argument was inevitable because the concept of "grounding" we are using is fundamentally bifurcated. Either outcome clarifies the field.
