      *   *Self-Correction during drafting:* I initially thought about grouping Buddhist and Cārvāka together. Better to separate them. Cārvāka is a radical skeptic (only perception), Buddhist is a reductionist (perception + inference). The Buddhist challenge is more subtle and dangerous to the 4-pramāṇa view.
      *   *Memory:* Make sure to highlight that Nyāya *knows* memory isn't a *pramāṇa* and has a reason (it's reproductive, not productive). The risk is whether that distinction holds water today.
      *   *Maps/Models:* Connect this to *upamāna*. *Upamāna* is about relation between name and form via similarity. A map is a structural analogy. This is a strong point for Nyāya if defended well.

  5.  **Final Review against User Prompt:**
