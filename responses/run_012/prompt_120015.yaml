          *   *Risk:* Skepticism. If I need to verify every cognition, when do I act?
          *   *Modern Parallel:* Reliabilism (externalist) vs. Internalism. Nyāya is a form of externalist reliabilism (causal chain matters) but requires pragmatic verification.
          *   *Verdict:* Philosophically costly but pragmatically robust.

      *   **Section 5: The "True by Definition" Risk.**
          *   *Question:* Is the enumeration empirical or conceptual?
          *   *Analysis:* If *pramāṇa* is defined as "irreducible causal process leading to true belief," then finding four is empirical. If defined by the list, it's circular.
          *   *Nyāya:* It's an abductive argument. These four explain our epistemic practices best.
          *   *Verdict:* It risks tautology if not grounded in causal theory (*utpatti*).

  4.  **Refining and Polishing:**
