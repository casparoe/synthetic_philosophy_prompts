          *   *Modern Parallel:* Inference to the Best Explanation (IBE). Is IBE distinct from deduction/induction?
          *   *Verdict:* Manageable risk. Nyāya logic is flexible enough to absorb these, but it stretches the definition of *anumāna*.

      *   **Section 3: The Hard Cases (Memory, Know-How, Tarka, Models).**
