  6.  **Final Polish:** Check terminology (ensure *pramāṇa*, *pramā*, *phala* distinctions are clear). Ensure the distinction between *parataḥ* and *svataḥ* is handled regarding the regress objection. (Proceed to generate output).

  *(Self-Correction Note)*: I need to be careful not to just explain Nyāya, but to *stress test* it as requested. The user *holds* the position; they want to know where the bodies are buried. I need to be the devil's advocate.

