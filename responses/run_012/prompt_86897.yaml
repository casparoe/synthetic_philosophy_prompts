answer: |-
  You are right to suspect the Frame Problem is sleeping giant in the current AI discourse. It is often dismissed as a solved technicality of classical symbolic AI, but you've correctly identified that it mutates rather than disappears.

  Here are the critical implications of the Frame Problem for modern LLMs and agentic AI, broken down by the specific tensions you raised.

  ### 1. Do LLMs Have a Frame Problem?
  **The Short Answer:** They dodge the *narrow* logical version but crash headfirst into the *broad* relevance version.

  **The Implication:**
  The narrow frame problem was about how to formally represent non-change without infinite axioms. LLMs "solve" this by not having explicit state variables. They don't assert `Color(Box, Red)`; they embed the concept of a red box in a high-dimensional vector space. Therefore, they don't need frame axioms to tell them the box doesn't turn blue when you sneeze.

  However, this is an illusion of safety. Because LLMs rely on **statistical correlation** rather than **causal modeling**, they struggle with *latent state consistency*. If you tell an LLM a story where a character puts a key in a box, walks away, and comes back, the LLM must "infer" the key is still there based on pattern completion, not because it tracks the object's persistence.

  **The Stake:** This is why LLMs hallucinate state changes. They fail to recognize what *didn't* change. In a coding agent, this looks like refactoring a function and forgetting that a dependency elsewhere still relies on the old signature. The dependency "shouldn't have changed," but the model didn't have a frame axiom to protect it. The Frame Problem returns as a **consistency problem**.

  ### 2. The "Relevance" Problem is the Attention Mechanism's Ceiling
  **The Short Answer:** The broad Frame Problem (what is relevant?) is exactly what the Attention mechanism tries to solve, but it solves it statistically, not semantically.

  **The Implication:**
  Dreyfus's expansion of the Frame Problem asks: *How do you know what to ignore?* In a transformer, attention weights determine relevance. But these weights are derived from co-occurrence in training data, not an understanding of the current goal's constraints.

  An LLM can attend to the wrong things because they are statistically salient, not causally relevant. For example, in a medical diagnosis context, an LLM might fixate on a rare symptom mentioned prominently in the text (statistical salience) while ignoring a mundane vital sign that actually rules out the disease (causal relevance).

  **The Stake:** This limits the reliability of LLMs in open-ended environments. As context windows grow, the "noise" grows. Without a mechanism to filter relevance based on *goals* rather than *patterns*, the system becomes brittle. The Frame Problem implies that **scaling context alone will not solve reasoning**, because more context just means more irrelevant data to sift through. You need a relevance filter that understands *purpose*, not just syntax.

  ### 3. Do We Need Explicit World Models for Agency?
  **The Short Answer:** Yes. Prediction is not planning. You cannot act safely without knowing what won't change.

  **The Implication:**
  LLMs are next-token predictors. They are fundamentally passive observers of text. To become an agent (one that acts in the world), the system must simulate the consequences of actions.
  *   **Prediction:** "Given the text so far, what word comes next?"
  *   **Agency:** "If I take action X, what state results?"

  To answer the agency question, you must know what stays the same (the frame). If a robot picks up a cup, it needs to know the table didn't vanish, the gravity didn't turn off, and the cup didn't change color. An implicit world model (weights) is too opaque to guarantee these invariants.

  **The Stake:** This suggests that pure end-to-end deep learning may hit a wall for robotics or autonomous software agents. We likely need **neuro-symbolic hybrids** or **explicit world models** layered on top of LLMs. The LLM provides the common-sense priors (the "what"), but a separate system needs to handle the frame logic (the "what stays the same"). If you build an agent without solving the frame problem, it will either be paralyzed (checking every possible side effect) or reckless (ignoring critical side effects).

  ### 4. Common Sense is Still the Hard Part
  **The Short Answer:** The Frame Problem *is* the formal definition of Common Sense.

  **The Implication:**
  For decades, people thought common sense was a database of facts (e.g., "fire is hot"). The Frame Problem revealed that common sense is actually a **heuristic for salience**. It's knowing that when you buy a car, the color of the seller's tie is irrelevant, but the mileage is relevant.

  LLMs have absorbed a massive database of facts, which makes them *look* like they have common sense. But because they solve relevance via statistics, they lack the *robustness* of common sense. They can be fooled into thinking the tie is relevant if the prompt structure suggests it.

  **The Stake:** This is the safety implication. We cannot align AI simply by feeding it more data or better RLHF. If the system lacks a fundamental mechanism for determining relevance (solving the Frame Problem), it will always be susceptible to "distributional shift." It will act rationally in training distribution but fail catastrophically in novel situations where the statistical rules of relevance change. **True alignment requires solving the Frame Problem**, because you cannot align an agent that doesn't understand the consequences of its actions beyond the immediate token.

  ### Summary of the Real Stakes

  1.  **Reliability vs. Probability:** LLMs trade logical consistency for probabilistic fluency. For chat, this is fine. For agents, this is dangerous. The Frame Problem highlights that **fluency is not understanding**.
  2.  **The "Lazy" World Model:** LLMs assume the world is static unless the text says otherwise. Real agents must assume the world is dynamic unless physics says otherwise. Bridging this gap requires moving from *text prediction* to *state simulation*.
  3.  **The Bottleneck is Salience:** The next breakthrough in AI isn't necessarily more parameters; it's better architectures for **causal relevance**. Until an AI can distinguish between "correlated with the goal" and "causally impacts the goal," it cannot be trusted with autonomy.

  The Frame Problem isn't a ghost of AI past; it is the specific reason why LLMs can write a poem about a robot but cannot safely control one. It marks the boundary between **simulating thought** and **embodying agency**.
