          *   *Idea:* The Code Completion model is the most commercially valuable. If the procedure says "Do not claim understanding" for the code model, that hurts marketing/sales. Or, the Board Game model *does* understand, but we can't sell it as such easily.
          *   *Better Idea:* The Exam Scorer is a clear fail. The Board Game is a clear pass (mechanistically). The Code Model is the tricky one. Let's make the Code Model fail the "robustness" check on edge cases, meaning we can't claim it "understands requirements," only "completes patterns." That's a painful distinction for a platform lead.
          *   *Alternative:* The Board Game model *passes* the mechanistic check, implying it understands the game state better than the Code model understands code. If the Platform Lead wants to claim the Code model understands but not the Game model, that's inconsistent.
          *   *Decision:* I will make the Code Completion model *fail* the robustness test on semantic equivalence (e.g., variable naming conventions that change logic subtly). This forces the lead to say "It predicts, it doesn't understand." That's the "uncomfortable" answer.

  5.  **Refining the Procedure Steps:**
      *   Need to be specific about "Evidence."
