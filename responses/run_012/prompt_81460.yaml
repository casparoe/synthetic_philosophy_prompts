          *   Run the procedure on three specific cases (Code completion, Exam scorer vs. rewording, Board game transformer).
          *   At least one case must yield an uncomfortable answer.
          *   End with unsettled cases (values calls: rationales vs. causes, competitive pressure).
          *   No reading list; needs to be runnable in an hour and defensible.
          *   Mark soft spots.

  2.  **Deconstruct the "Understanding" Debate (for the Procedure):**
      *   *Behaviorist View (The User's current test):* If it acts like it understands (sensitive to meaning, invariant to syntax), it understands.
