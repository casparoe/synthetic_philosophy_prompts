      *   This needs to be honest about the risk.

  7.  **Review against Constraints:**
      *   *Addressed to ML pro, not philosopher:* Use terms like "loss landscape," "activations," "OOD," "adversarial examples."
      *   *Operational:* "Run this script," "Check this log."
      *   *Critique of current test:* Explicit section.
      *   *Three cases:* Code, Exam, Board Game.
      *   *Uncomfortable answer:* Included.
