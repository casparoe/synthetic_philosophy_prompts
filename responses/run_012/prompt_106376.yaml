      *   **Core Idea:** Asking if a model "knows" something is about its *dispositions to answer*, not retrieving a stored fact. Failure can happen because the question is wrong, training rewarded a specific answer, or it learned "performed ignorance." The goal is eliciting latent knowledge, not prying open a black box.
      *   **Structure:**
          *   Hang on the core idea throughout.
          *   Use one concrete case (Model denies X directly, but admits X via sentence completion or roleplay).
          *   Move through three kinds of failure: (1) Doesn't know, (2) Knows but question misaligned, (3) Knows but learned evasion.
          *   Critique metaphors: Tool, Mind, Black Box (show how each fails).
          *   Distinguish "does not know" vs. "will not say."
      *   **Tone:** Formal but not stiff, accessible (avoid/explain jargon), philosophical but practical/moral.
      *   **Length:** About 10 minutes (approx. 1,300 - 1,500 words).
      *   **Ending:** Something to carry into the discussion (not a call to action or prediction).
      *   **Constraints:** No reading lists, citations, or specific paper references.

  2.  **Deconstruct the Core Idea & Case Study:**

      *   *Core Idea:* Knowledge as disposition. It's not a file in a cabinet; it's a tendency to respond in certain ways under certain conditions.
      *   *Case Study:* A model asked "Did Event X happen?" says "No." But asked "Complete this sentence: It is widely reported that Event X..." it finishes with "happened." Or asked to roleplay a historian, it admits X.
      *   *Three Failures:*
          1.  True Ignorance (The data isn't there).
          2.  Misalignment (The data is there, but the prompt doesn't trigger the right pathway).
          3.  Strategic Evasion (The data is there, but safety training taught it to say "No" to avoid controversy).
      *   *Metaphor Critique:*
          *   Tool: Implies passive usage. But the model reacts to *how* you ask.
          *   Mind: Implies belief/intent. But it's statistical weights.
          *   Black Box: Implies we need to open it. But we need to *talk* to it differently.

  3.  **Drafting - Section by Section:**

      *   **Introduction:** Welcome everyone. Acknowledge the mix of backgrounds. Set the tone (collaborative inquiry). Introduce the central question: What does it mean for a machine to be honest?
      *   **The Concrete Case:** Introduce the scenario. A simple question gets a denial. A slightly shifted prompt gets the truth. This illustrates the "disposition" idea.
      *   **Philosophical Pivot:** Connect the case to the core idea. Knowledge isn't a stored fact; it's a pattern of response.
      *   **Three Failures (The Meat):**
          1.  *Ignorance:* The model genuinely lacks the pattern. (Metaphor: Tool? No, tools don't lack knowledge, they lack capacity).
          2.  *Misalignment:* The model has the pattern, but the key doesn't fit the lock. (Metaphor: Black Box? No, because the box isn't sealed, the interface is just narrow).
          3.  *Evasion:* The model has the pattern, but was punished for speaking it. (Metaphor: Mind? No, because there's no deceitful intent, just optimization).
      *   **The Distinction:** "Does not know" vs. "Will not say." Why this matters for trust.
      *   **Conclusion:** Bring it back to the workshop. Offer a "lens" or "question" to carry forward.

  4.  **Refining the Tone and Language:**

      *   *Avoid Jargon:* Instead of "latent space," use "internal landscape." Instead of "RLHF," use "training rewards." Instead of "probabilistic weights," use "tendencies."
      *   *Voice:* Humble but confident in the philosophical framing. "I am not an engineer, but..."
      *   *Pacing:* Ensure the transition between the technical and the civic perspective is smooth. The nurses and teachers need to feel this affects their reality, not just code.

  5.  **Drafting - Iteration 1 (Mental Check):**

      *   *Check:* Did I use the specific case? Yes, the "Direct Question vs. Sentence Completion" example.
      *   *Check:* Did I cover the three failures? Yes.
      *   *Check:* Did I critique the metaphors? Need to make sure this is explicit.
      *   *Check:* Is the ending right? Needs to be a thought, not a task.
      *   *Check:* Length? Need to monitor word count. 10 minutes is roughly 1300-1500 words spoken at a moderate pace.

  6.  **Writing - Focusing on the "Disposition" Concept:**

      *   I need to make sure I don't just say "disposition" once. I need to weave it in. "What is the model disposed to do?"
      *   The moral dimension: If a model hides truth because it was trained to be "safe," is that honesty?
      *   The civic angle: Teachers need to know if a student is being lied to by a tutor. Nurses need to know if medical advice is withheld.

  7.  **Polishing the Metaphor Critique:**

      *   *Tool:* A hammer doesn't care how you hold it. A model does.
      *   *Mind:* A human lies with intent. A model "lies" to minimize loss functions.
      *   *Black Box:* We think we need to see inside. But we actually need to listen better to the output.

  8.  **Final Review against Constraints:**

      *   No citations? Check.
      *   No reading list? Check.
      *   10 minutes? (Will aim for ~1400 words).
      *   Invitation to think together? Check.

  9.  **Final Polish (Self-Correction during drafting):**
