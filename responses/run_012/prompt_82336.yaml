      *   So:
          *   Phase 1: Selection Process (Darwin). Result: Competence. Comprehension: Absent.
          *   Phase 2: Explicit Rules (Turing/Classic AI). Result: Incompetence. Comprehension: Present.
      *   *Why Phase 2 fails:* Because the rules are static, the world is dynamic. Or the rules are too complex to execute.
      *   *Let's go with the "Blind Sort" (Phase 1) and "Manual Algorithm" (Phase 2).*
      *   Phase 1: Blind cards. Facilitator feedback (Selection). Result: Sorted.
      *   Phase 2: Visible cards. Written Algorithm. Result: Not Sorted (Time out).
      *   *Why?* Because the algorithm requires tracking state (working memory) that the students lack. The Selection process (Phase 1) offloaded the state to the *arrangement of cards*.
      *   *This is perfect.* It shows **Cognitive Offloading**. Phase 1 uses the environment as memory (Darwinian selection acts on the world). Phase 2 tries to hold it in the head (Classic Cognitivism).

  6.  **Refining the Details:**
      *   **Materials:** 18 large cards (A4), numbered 1-18 on one side, blank on other. Tape/Blu-tack.
      *   **Phase 1:** Cards blank side up. Students hold them. They swap. Facilitator says "Better" or "Worse" (based on hidden numbers).
      *   **Phase 2:** Cards number side up. Facilitator gives a script: "Compare your number with neighbour. If higher, swap. Repeat 18 times." (Bubble Sort).
      *   **Wait, if they can see the numbers in Phase 2, they will just sort them quickly ignoring the script.**
      *   *Constraint:* In Phase 2, they *must* follow the script. Facilitator polices this. "You didn't read the step!"
      *   *The Script:* Make it inefficient. "Student 1, read your number. Student 2, read yours. Compare. If..."
      *   *Time Limit:* 5 minutes for both. Phase 1 succeeds. Phase 2 fails (gets stuck in step 3).
      *   *Point:* The *rule* (Comprehension) is not the *capacity* (Competence). The capacity in Phase 1 came from the *system*, not the minds.

  7.  **Addressing "Predictably Go Wrong":**
      *   *Risk:* Phase 1 takes too long. *Fix:* Facilitator must be decisive.
      *   *Risk:* Phase 2 students cheat (look at cards and ignore script). *Fix:* Facilitator must be strict "Rule Police".
      *   *Risk:* Students guess the point early. *Fix:* Maintain secrecy. Call Phase 1 "The Feedback Game" and Phase 2 "The Protocol Game".
      *   *Risk:* Phase 2 succeeds too easily. *Fix:* Make the script verbose and burdensome.

  8.  **Addressing "What the Activity Cannot Reproduce":**
      *   The activity uses *human* selection in Phase 1. Real Darwinism is non-teleological. The Facilitator is a "God".
      *   The activity uses *human* rule-following in Phase 2. Real Turing machines are silicon.
      *   *Crucial Disanalogy:* In Phase 1, the Facilitator *knows* the target. In real evolution, there is no target. This must be confessed in debrief.

  9.  **Structure of the Response:**
      *   Title.
      *   Learning Objective.
      *   Materials.
      *   Timeline.
      *   Activity Instructions (Phase 1 & 2).
      *   Debrief Guide (Mapping, Disanalogies, Reinserting the Comprehender).
      *   Failure Modes.
      *   Missing Feature.

  10. **Language Check:** British English (e.g., "facilitator", "programme", "realise", "colour").

  11. **Final Polish:** Ensure the "Double Dissociation" is clear.
      *   Phase 1: Competence YES, Comprehension NO.
      *   Phase 2: Competence NO, Comprehension YES.
      *   This perfectly matches the prompt's requirement.

      *(Self-Correction during drafting)*: Make sure Phase 2's "Comprehension" is genuine. They must understand the script. If the script is gibberish, they don't comprehend. The script must be clear English, just burdensome to execute.
      *Script Idea:* "Step 1: Ask the person to your left for their number. Step 2: Compare it to yours. Step 3: If yours is larger, say 'Swap'. Step 4: Wait for confirmation..."
      *Why it fails:* It's too slow for 5 minutes with 18 people.
      *Why Phase 1 succeeds:* Parallel processing. Everyone swaps at once based on local feedback.

      *Wait, Phase 1 needs to be parallel to be fast.*
      *Phase 1:* All students stand in a line. Blind cards. They can swap with neighbours. Facilitator walks down, taps shoulders of pairs that are "Good" (in order). Pairs that aren't tapped must swap back.
      *Actually, simpler:* Facilitator holds the "Fitness" key. Students propose a configuration. Facilitator says "Warmer/Colder".
      *No, that's one group.*
      *Let's make it one line.* 18 students. Blind cards.
      *Rule:* You may swap with your neighbour.
      *Feedback:* Facilitator claps when a swap is "correct" (moves towards sorted).
      *Result:* They sort the line.
      *Phase 2:* Visible cards. Script: "Bubble Sort".
      *Result:* Too slow.

      *Okay, ready to write.*
answer: |-
  # Activity Plan: The Blind Line and The Burdened Script

  **Session Length:** 90 Minutes
  **Class Size:** 18 Students
  **Topic:** Competence without Comprehension (Darwin/Turing Inversion)
  **Language:** British English

  ## Learning Objective
  To demonstrate a double dissociation between **Competence** (the ability to produce a functional, ordered, or correct outcome) and **Comprehension** (the explicit understanding of the rules or principles governing that outcome).
  *   **Phase 1:** High Competence, Low Comprehension.
  *   **Phase 2:** High Comprehension, Low Competence.

  ## Materials
  *   18 A4 cards, numbered 1–18 on one side, blank on the reverse.
  *   Blu-tack or tape.
  *   A printed "Protocol Script" (see Phase 2 below).
  *   A stopwatch.
  *   Whiteboard and markers.
  *   Small tokens (e.g., poker chips or sweets) for scoring (optional, non-monetary).

  ## Timeline Overview
  *   **00:00 – 00:05:** Set-up and Grouping.
  *   **00:05 – 00:25:** Phase 1: The Blind Line (Competence without Comprehension).
  *   **00:25 – 00:45:** Phase 2: The Burdened Script (Comprehension without Competence).
  *   **00:45 – 00:55:** Transition and Data Collection.
  *   **00:55 – 01:30:** Debrief and Philosophical Mapping.

  ---

  ## Activity Instructions

  ### Set-up (5 Minutes)
  1.  Arrange the 18 students in a single line facing the class.
  2.  Hand each student one card. Instruct them to hold it against their chest so **no one can see the number**, not even themselves. (The blank side faces out).
  3.  Tell the class: *"Your goal is to arrange the line so that the numbers run from 1 to 18, left to right. You have 15 minutes. You may talk, but you may not look at the cards. I will provide feedback."*
  4.  Do not reveal the numbers on the cards to anyone. You (the facilitator) must know the order (e.g., by having a master list or peeking during distribution).

  ### Phase 1: The Blind Line (20 Minutes)
  **Goal:** Produce a sorted line.
  **Constraint:** No visual access to values.
  **Mechanism:** Environmental Selection.

  1.  **The Rule:** Students may swap positions with their immediate neighbour if they choose.
  2.  **The Feedback:** As students propose or attempt swaps, you walk down the line.
      *   If a swap moves the line *closer* to the correct order (more cards in correct relative position), clap your hands once loudly.
      *   If a swap makes the line *worse* or is neutral, say nothing (silence).
      *   If a swap is made without your approval (you didn't clap), instruct them to reverse it immediately.
  3.  **The Incentive:** If the line is fully sorted within 15 minutes, the whole group receives a "collective merit point" (or sweets).
  4.  **The Process:** Students will initially swap randomly. They will quickly learn to seek the clap. They will begin to coordinate locally. Eventually, the line will sort itself.
  5.  **The Reveal:** Once sorted (or time expires), have them turn the cards around to verify the order.
  6.  **Crucial Constraint:** Do not explain *why* you clapped. Do not use words like "higher," "lower," "order," or "sequence." Only clap or stay silent.

  ### Phase 2: The Burdened Script (20 Minutes)
  **Goal:** Produce a sorted line (using a new set of cards or reshuffled).
  **Constraint:** Full visual access, but rigid procedural adherence.
  **Mechanism:** Explicit Rule Following.

  1.  **Reset:** Reshuffle the cards. Hand them out again. This time, students hold the cards **face out** (numbers visible to all).
  2.  **The Rule:** Hand out the "Protocol Script" to every student. Tell them: *"You now understand the goal and the values. However, you are no longer allowed to use intuition. You must execute this script exactly. Any deviation invalidates the run."*
  3.  **The Script:** (Provide this on paper).
      > **PROTOCOL 4.2: SEQUENCING**
      > 1. Student 1 asks Student 2: "What is your value?"
      > 2. Student 2 states value.
      > 3. Student 1 compares values verbally: "My value is [X]. Your value is [Y]."
      > 4. If X > Y, Student 1 says "Swap Required." If X < Y, Student 1 says "Swap Denied."
      > 5. If "Swap Required" is said, both students must announce "Confirming Swap" before moving.
      > 6. Proceed to the next neighbour pair only after the Facilitator ticks the step on the master log.
      > 7. Repeat for all adjacent pairs. Repeat the full pass 18 times.
  4.  **The Incentive:** Same as Phase 1 (collective merit point).
  5.  **The Process:** You act as a strict auditor. If a student skips "Confirming Swap," stop them. Make them restart the step. Check the log.
  6.  **The Outcome:** The group will almost certainly fail to sort the line within 15 minutes. The cognitive load of the script, the verbal overhead, and the serial processing will bottleneck the system.
  7.  **End Phase:** Stop the activity at 15 minutes regardless of progress.

  ### Transition (10 Minutes)
  1.  Ask students to return to their seats.
  2.  Ask them to write down two answers on a slip of paper (do not discuss yet):
      *   *In Phase 1, who or what knew the correct order?*
      *   *In Phase 2, why did you fail despite knowing the numbers and the rules?*
  3.  Collect the slips. This creates a "commitment" to their pre-debrief intuition.

  ---

  ## Debrief Guide (35 Minutes)

  Do not begin by naming Darwin or Turing. Begin by asking the students to report their experience.

  ### 1. Phenomenological Report (5 Minutes)
  *   **Ask Phase 1:** "How did it feel when the line started to sort? Did anyone feel they knew the global order?" (Expected: No, they only felt local feedback).
  *   **Ask Phase 2:** "You could see the numbers. You understood the script. Why did the system stall?" (Expected: Too much talking, too much checking, too slow).

  ### 2. Mapping the Inversions (15 Minutes)
  Now, introduce the theoretical framework. Write two columns on the board: **Competence** and **Comprehension**.

  *   **The Darwinian Inversion (Phase 1):**
      *   **Observation:** The outcome was competent (sorted). The agents were blind (no comprehension of values).
      *   **The Point:** We usually explain order by positing a mind that planned it. Here, the order emerged from a process of **blind variation and selective retention**. The "clap" was the selection pressure.
      *   **The Inversion:** We do not explain the competence by the comprehension of the students. We explain the apparent comprehension (the sorted line) by the competence of the selection process.
      *   **Label:** This is the Darwinian insight. Design without a Designer.

  *   **The Turingian Inversion (Phase 2):**
      *   **Observation:** The agents had comprehension (they saw numbers, read English script). The outcome was incompetent (unsorted).
      *   **The Point:** Having the rules (syntax/semantics) does not guarantee the capacity to execute them effectively in real-time. The script was a "program," but the hardware (students) had high latency.
      *   **The Inversion:** We often think understanding the rules makes us smart. But the rules themselves are inert. They require a process to run them.
      *   **Label:** This touches on the Turingian insight (and limits of GOFAI). Syntax manipulation is not sufficient for fluid intelligence; the *process* matters more than the *representation*.

  ### 3. The Temptation to Reinsert the Comprehender (10 Minutes)
  Challenge the students to find where the "mind" is hiding.

  *   **In Phase 1:** "You might say *I* (the facilitator) was the mind. I knew the order. I selected the swaps."
      *   **Counter:** In natural selection, there is no facilitator. There is only the environment (survival/death). The 'clap' is just 'survival'. If you reinsert a Designer here, you destroy the Darwinian explanation.
  *   **In Phase 2:** "You might say the *Script* was the mind. It contained the logic."
      *   **Counter:** The script sat on the paper. It did nothing. The competence lay in the *execution*, which failed. If you reinsert a 'Homunculus' inside the student who 'understands' the script, you beg the question. Who understands the homunculus?

  ### 4. Honest Disanalogies (5 Minutes)
  Be transparent about where the activity lies.

  *   **Phase 1 Disanalogy:** In the activity, *I* knew the target order. In real evolution, there is no target. The activity is teleological (goal-directed); evolution is not. The 'clap' simulates fitness, but fitness is not a conscious applause.
  *   **Phase 2 Disanalogy:** In the activity, *you* are conscious beings forced to act like machines. In Turing's view, the machine need not be conscious to be competent. Here, your consciousness actually hindered you (overthinking the script).

  ---

  ## Predictable Failure Modes & Handling

  | Failure Mode | Prediction | Handling |
  | :--- | :--- | :--- |
  | **Phase 1 Stalls** | Students swap randomly and never find the "clap" rhythm. | If no progress after 5 mins, increase the "signal". Clap louder or clap twice for "very good" swaps. Do not explain why. |
  | **Phase 2 Cheating** | Students ignore the script and just sort quickly because they can see the numbers. | Act as a strict auditor. "Stop. Step 4 was not verbalised. Reset that pair." Make the cost of cheating higher than the cost of following the script. |
  | **Early Discovery** | A student shouts "It's evolution!" in Phase 1. | Acknowledge without confirming. "Interesting hypothesis. Focus on the mechanics of the swap for now. We will discuss labels at the end." |
  | **Phase 2 Succeeds** | They sort it faster than expected. | Make the script more burdensome next time (add a "verification step"). Or, highlight that they succeeded *despite* the script, not *because* of it (they likely reverted to intuition). |

  ---

  ## What the Activity Cannot Reproduce

  You must supply this in the debrief, as the activity cannot demonstrate it physically:

  **1. Deep Time (Phase 1):**
  The activity compresses thousands of generations into 15 minutes. Students feel the *selection*, but they do not feel the *time*. You must explain that the "competence without comprehension" trick only works because of the sheer volume of iterations over deep time, which filters out the noise. In the classroom, *you* (the facilitator) are doing the filtering, which risks implying a Designer. You must emphasise that in nature, the "filter" is simply death/non-reproduction, which has no mind.

  **2. Sub-personal Processing (Phase 2):**
  In Phase 2, the students are conscious of the rules. In a cognitive system (or Turing machine), the rules are executed *sub-personally*. The students' frustration comes from being conscious agents forced to act like sub-personal processes. You must explain that in a real mind/brain, the "script" (neural weights) is executed without the agent needing to "read" it. The activity forces personal-level engagement with a sub-personal task, which creates an artificial bottleneck.

  ## Closing Thought for the Students
  *"Leave with this tension: In Phase 1, you were parts of a machine that worked, but you didn't know why. In Phase 2, you knew why, but the machine didn't work. Where does the 'mind' live? Is it in the knowing, or in the doing? And if it is in the doing, do you need to know what you are doing to do it well?"*
