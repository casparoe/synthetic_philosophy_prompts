answer: |-
  # Diachronic Rationality: A Decision Tree on Money Pumps

  **Instructions:** Answer each question based on your intuition about the specific case described. Follow the path to find the position on diachronic rationality that best matches your commitments.

  ### **START**

  **1. Consider the *two-stage trade that extracts money from someone with a cycle of preferences* (A > B > C > A).**
  Does the sure loss prove that the agent's **preference structure** is irrational?
  *   **YES:** The preferences themselves violate a norm of consistency. → **Go to 2**
  *   **NO:** The preferences are permissible; the problem lies elsewhere (or nowhere). → **Go to 4**

  ---

  **2. Consider the *agent whose ranking of two options reverses between an early and a later date with no new information*.**
  Is the later choice irrational *because* it violates the earlier plan?
  *   **YES:** Rationality requires diachronic consistency (sticking to the plan). → **Go to 3**
  *   **NO:** Rationality requires only synchronic consistency (maximizing at the moment of choice).
      *   **LEAF: Myopic Choice** (Standard Economic View).
      *   *Commitment:* Preferences need not be stable over time; each moment is a new agent. Exploitability is the price of preference change.

  ---

  **3. Consider the *agent who would be paid now for forming an intention to do something tomorrow that, come tomorrow, they will have no reason to do*.**
  To secure the plan, must the agent alter the **choice situation** (binding) or merely the **choice disposition** (resolving)?
  *   **BIND:** The agent must arrange to be constrained in advance (e.g., Ulysses contract).
      *   **LEAF: Sophisticated Choice** (Causal Decision Theory / Precommitment).
      *   *Commitment:* You cannot intend what you know you will not do. Rationality is backward-induction from future constraints.
  *   **RESOLVE:** The agent can resolve to stick to the plan without external constraints.
      *   **LEAF: Resolute Choice** (McClennen).
      *   *Commitment:* Rational agents can adopt plans that override local preferences. The unit of agency is the life plan, not the moment.

  ---

  **4. Consider the *agent who is offered a series of trades they did not anticipate and could not have planned around*.**
  Is the vulnerability a defect in the agent's **design** or a harmless byproduct of rational limits?
  *   **DESIGN DEFECT:** The agent ought to have a disposition that avoids the loss, even if preferences are cyclic.
      *   **LEAF: Dispositional Rationality** (Arntzenius / Regan).
      *   *Commitment:* Preferences are fine, but the disposition to act on them is defective. You should be the *kind* of agent who says "no."
  *   **HARMLESS BYPRODUCT:** Exploitability is not a rational defect; it is merely a cost of having those preferences.
      *   **LEAF: Exploitability Defense** (Gustafsson / "So What?").
      *   *Commitment:* Money pumps show you are predictable, not incoherent. Paying to avoid the pump is optional, not required.

  ***

  ### **MAP COMMENTARY**

  **Empty Regions (Unoccupied Logical Space)**
  *   **Diachronic Consistency without Preference Defect:** A position claiming preferences can be cyclic (Node 1: NO) but later choices must violate earlier plans (Node 2: YES) is effectively unoccupied.
      *   *Diagnosis:* **Incoherent.** If the preference structure is not defective, there is no normative standard by which a later choice violates an earlier plan. Diachronic norms presuppose a stable standard.
  *   **Resolute Binding:** A position claiming one must resolve internally (Node 3: RESOLVE) but *also* requires external binding (Node 3: BIND) is contradictory.
      *   *Diagnosis:* **Incoherent.** Resolute choice is defined by the capacity to self-bind via will; sophisticated choice is defined by the incapacity to do so.

  **Indistinguishable Positions**
  *   **Myopic Choice vs. Exploitability Defense:** Both positions allow the agent to be pumped.
      *   *Distinction:* The tree separates them at Node 1. Myopic Choice claims the preferences are *rational* (standard economics); Exploitability Defense claims the preferences might be *irrational* (or non-ideal) but exploitability is not the *proof*. Empirically, both agents lose money; they disagree on whether the loss signifies a rational failure.
  *   **Resolute vs. Sophisticated Choice:** Both positions often recommend the same action (e.g., rejecting the first trade in a pump).
      *   *Distinction:* The tree separates them at Node 3 by mechanism. Sophisticated agents reject the trade because they *predict* they will defect later (backward induction). Resolute agents reject the trade because they *commit* not to defect later (plan-based). In cases where binding is impossible, they may diverge: the Sophisticated agent defects; the Resolute agent does not.

  **Notes on Case Types**
  This tree assumes the "Cycle" case (Node 1) is the paradigmatic money pump. If you believe the "Preference Reversal" case (Node 2) is fundamentally different (e.g., that cycles are irrational but reversals are not), you may traverse Node 1 (YES) and Node 2 (NO), landing on **Myopic Choice**. This reflects the view that transitivity is a synchronic constraint, while stability over time is not.
