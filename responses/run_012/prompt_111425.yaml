answer: |-
  # The Intentionality Intuition Quiz

  **Instructions:** Read each case carefully. Select the answer that best matches your immediate judgment. Do not overthink; there are no "correct" answers, only patterns.

  ### 1. The Chairman (Harm)
  A chairman is told a new program will increase profits but also harm the environment. He says, "I don't care about harming the environment, I just want profit." He launches the program. The environment is harmed.
  **Did the chairman intentionally harm the environment?**
  A) Yes.
  B) No.
  C) It depends on how much he cared.

  ### 2. The Chairman (Help)
  A chairman is told a new program will increase profits and also help the environment. He says, "I don't care about helping the environment, I just want profit." He launches the program. The environment is helped.
  **Did the chairman intentionally help the environment?**
  A) Yes.
  B) No.
  C) It depends on how much he cared.

  ### 3. The Style Guide (Conventional Norm)
  An editor knows that publishing a specific headline will violate the newspaper's strict style guide (a purely conventional rule with no moral weight), but it will boost sales. He says, "I don't care about the style guide." He publishes it. The guide is violated.
  **Did the editor intentionally violate the style guide?**
  A) Yes, he knew it would happen.
  B) No, violating the guide wasn't his goal.
  C) Yes, but only because the rule exists.

  ### 4. The Landlord (Blame/Bad)
  A landlord evicts tenants to sell a building. He knows this will leave them homeless. He does not want them homeless, but accepts it as necessary. The tenants become homeless.
  **Did the landlord intentionally make the tenants homeless?**
  A) Yes.
  B) No.
  C) Yes, because he deserves blame for the eviction.

  ### 5. The Landlord (Blame/Good)
  Same landlord. He knows that by selling the building, it will eventually be renovated to house refugees. He does not care about refugees, just the sale. The building houses refugees.
  **Did the landlord intentionally house the refugees?**
  A) Yes, he knew it would happen.
  B) No, that wasn't his aim.
  C) Yes, because it was a good outcome.

  ### 6. The Board (Group Agent)
  A corporate board votes to cut costs. Everyone knows this will raise carbon emissions. The board as a whole cannot feel guilt, but the members do. Emissions rise.
  **Did the board intentionally raise emissions?**
  A) Yes, the board decided it.
  B) No, only individuals can act intentionally.
  C) Yes, but the members are the ones to blame.

  ### 7. The Gambler (Probability)
  A driver speeds. He knows there is a 40% chance he will hit a pedestrian. He speeds anyway. He hits a pedestrian.
  **Did the driver intentionally hit the pedestrian?**
  A) Yes, he took the risk.
  B) No, it was only a chance.
  C) Yes, because he shouldn't have sped.

  ### 8. The Confessor (First-Person)
  *Imagine you are the agent.* You push a button to get a reward. You know it will make a noise that annoys your neighbor. You don't care about the neighbor. You push it. The neighbor is annoyed.
  **Did you intentionally annoy the neighbor?**
  A) Yes.
  B) No.
  C) I would say "I knew it would," but not "I did it on purpose."

  ### 9. The Sadist (Desire)
  A manager implements a policy to boost efficiency. He knows it will stress his staff. He *actively wants* the staff to feel stressed because he enjoys it. The staff gets stressed.
  **Did the manager intentionally stress the staff?**
  A) Yes, obviously.
  B) Yes, more so than if he just knew about it.
  C) No, efficiency was still the main goal.

  ### 10. The Phrasing Check
  Consider the Chairman (Harm) case again (#1).
  **Which sentence sounds more accurate to you?**
  A) "He harmed the environment intentionally."
  B) "He knowingly harmed the environment, but not intentionally."
  C) "He intentionally harmed the environment because it was wrong."

  ---

  # Scoring Key & Theoretical Mapping

  To score, tally the points for each column based on your selections. The column with the highest total indicates your dominant theoretical leaning.

  | Item | A | B | C |
  | :--- | :--- | :--- | :--- |
  | **1 (Harm)** | **Moral / Norm / Blame** (+1) | **Pragmatic / Pluralist** (+1) | **Contextual** (+0) |
  | **2 (Help)** | **Pragmatic** (+1) | **Moral / Norm / Blame** (+1) | **Contextual** (+0) |
  | **3 (Style)** | **Norms** (+2) | **Moralized** (+2) | **Norms** (+1) |
  | **4 (Land/Bad)**| **Blame / Moral** (+1) | **Pluralist** (+1) | **Blame-First** (+2) |
  | **5 (Land/Good)**| **Pragmatic** (+1) | **Moral / Blame** (+1) | **Moralized** (+2) |
  | **6 (Board)** | **Norms / Pragmatic** (+1) | **Performance Error** (+1) | **Blame-First** (+1) |
  | **7 (Gambler)** | **Pragmatic / Blame** (+1) | **Pluralist / Standard** (+1) | **Blame-First** (+2) |
  | **8 (First-P)** | **Artifact** (+0) | **Artifact** (+0) | **Pragmatic** (+2) |
  | **9 (Sadist)** | **Standard** (+0) | **Pluralist** (+2) | **Performance Error** (+1) |
  | **10 (Phrase)** | **Pragmatic** (+1) | **Pluralist** (+2) | **Moralized** (+2) |

  **Position Totals:**
  *   **Moralized Concept:** Sum of "Moralized" points. (High score = Asymmetry is real & moral).
  *   **Pragmatics:** Sum of "Pragmatic" points. (High score = Asymmetry is linguistic).
  *   **Blame-First:** Sum of "Blame-First" points. (High score = Intentionality follows blame).
  *   **Norms:** Sum of "Norms" points. (High score = It's about rule violation, not morality).
  *   **Artifact:** Sum of "Artifact" points. (High score = Vignettes are misleading).
  *   **Pluralist:** Sum of "Pluralist" points. (High score = Dual character concept).
  *   **Performance Error:** Sum of "Error" points. (High score = Folk are confused).

  **Interpretation:**
  *   **Dominant Moralized:** You believe the concept of "intentional" is inherently tied to moral judgment.
  *   **Dominant Pragmatics:** You believe people mean "knowingly" when they say "intentionally" in bad cases.
  *   **Dominant Blame-First:** You believe we decide blame first, then assign intentionality to justify it.
  *   **Dominant Norms:** You believe any norm violation (moral or conventional) triggers the effect.
  *   **Dominant Pluralist:** You believe intentionality has a descriptive core (knowledge) and a normative overlay (desire/blame).

  ---

  # Analysis & Limitations

  ### 1. Inseparable Positions
  This quiz cannot cleanly separate **Blame-First (4)** from **Moralized Concept (1)**. Both positions predict the standard Knobe asymmetry (Yes on Harm, No on Help) and both predict "No" on the Landlord/Good case (Item 5). While Item 4 (Landlord/Bad) attempts to pry them apart by offering a "deserves blame" option, a respondent who holds a Moralized view might still select it simply because blame and badness usually covary. Without reaction-time data or a case where an agent is *blameworthy* for a *neutral* outcome, these two views remain empirically tangled in this format.

  ### 2. The Load-Bearing Item
  **Item 3 (The Style Guide)** is the load-bearing item for distinguishing **Moralized Concept (1)** from **Norm Violation (5)**.
  *   **If readers answer A (Yes):** It suggests the effect is about *norms* generally, not morality specifically. This kills the pure Moralized Concept view.
  *   **If readers answer B (No):** It suggests morality is the specific trigger. This kills the General Norm view.
  *   **Why it matters:** If you move this item from "Conventional Rule" to "Moral Rule," the quiz loses its ability to test whether the *content* of the norm matters. The entire distinction between Position 1 and Position 5 rests on whether participants treat the style guide violation like the environmental harm.

  ### 3. Empty Answer Patterns
  The pattern **"Yes" on Help (Item 2) AND "No" on Harm (Item 1)** is theoretically empty in this scoring key.
  *   **Why:** No major theory predicts a *reverse* Knobe effect (that good side effects are more intentional than bad ones).
  *   **Reason:** This pattern likely indicates inattention or a misunderstanding of the vignette rather than a coherent philosophical position. It is unattractive because it contradicts the basic data of the field.
  *   **Another Empty Pattern:** High **Performance Error** combined with High **Pluralist**. Performance Error suggests the folk are *mistaken* and there is a single correct answer. Pluralism suggests the folk are *right* to have conflicting intuitions because the concept is complex. Holding both is incoherent: either the concept is singular and people are messing up, or the concept is plural and people are tracking different features.

  ### 4. Where the Scoring Key Will Misfire
  **Item 8 (The Confessor/First-Person)** is the most likely to misfire.
  *   **The Risk:** The **Artifact (6)** position claims the Knobe effect disappears in first-person or realistic contexts. However, research shows the effect often *persists* even in first-person.
  *   **The Misfire:** If a participant answers **A (Yes)**, the key scores this as neutral/artifact-weak. But a proponent of the Artifact view might argue, "You are still in a quiz setting, so it's still artificial."
  *   **What would move the case:** To move this from an Artifact test to a **Pragmatics** test, we would need evidence that the participant distinguishes between *saying* "I did it intentionally" to a friend vs. *believing* it internally. If participants answer **C** ("I knew it would, but not on purpose"), it strongly boosts Pragmatics. If they answer **A**, it doesn't necessarily kill Artifact theory (they could argue the quiz forces a third-person perspective on a first-person prompt). For this item to definitively rule out Artifact, we would need to see the asymmetry *vanish* completely in the first-person condition compared to the third-person condition, which a single item cannot measure.

  **Item 7 (Probability)** is the second weak point.
  *   **The Risk:** Distinguishing **Blame-First** from **Pragmatics**. Both might predict "Yes" (Intentional) because the agent was reckless (Blame) or because "intentionally" is being read as "recklessly" (Pragmatics).
  *   **What would have to be true:** To move this case firmly to **Pluralist**, participants would need to consistently rate the Sadist case (Item 9) as *more* intentional than the Gambler case (Item 7). If they rate them equally, it suggests a binary threshold (Knowledge) rather than a gradient (Desire), which undermines the Pluralist scoring.
