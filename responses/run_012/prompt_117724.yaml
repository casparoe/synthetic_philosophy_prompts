answer: |-
  The outboard motor coughed, sputtered, and died, leaving the *R/V Huxley* drifting in the swell off Cape Flattery. Rain wasn't falling so much as hanging in the air, a cold mist that soaked through Gore-Tex and settled in the marrow.

  "Don't touch the tray," Elias said, not looking up from the engine cowling.

  "I'm not touching the tray," Mara snapped. She was huddled over a plastic bin filled with seawater and chunks of rock. Each rock was encrusted with *Vexillaria complexa*, the colonial tunicate they'd been chasing for three months. The colonies looked like bruised purple grapes, pulsing faintly.

  "You're hovering," Elias said, finally getting the motor to roar back to life. He killed it immediately as they drifted toward the dock. "And you're hovering because you know the variance within colonies is swamping the variance between them."

  Mara ignored him, lifting a colony from the water. "Colony Four-Two survived the crab predation trial. Colony Four-Three got wiped out. Look at the defender ratio. Four-Two was thirty percent stingers. Four-Three was five percent."

  "Because the founders of Four-Two were siblings," Elias said, jumping onto the dock and catching the line. "High relatedness. The genes for stinging know they're inside copies of themselves. It's kin selection, Mara. Stop dressing it up as group selection because it sounds nicer."

  "It's not about sounding nice. It's about causality," Mara said, carrying the bin toward the lab. The floor was slick with algae and mud. "The colony is the thing that lives or dies. The individual zooid doesn't survive the winter. The colony does. When a crab eats Four-Three, it selects against the *colony* phenotype. The trait 'high defender fraction' is selected *for* at the colony level."

  "Selection *of* versus selection *for*," came a voice from the dry warmth of the lab doorway. Dr. Aris Thorne leaned against the frame, holding a mug of coffee that smelled like burnt hazelnuts. He was the PI, though lately he behaved more like a court philosopher watching two nobles duel over a barren province. "You two are running the same math. You're just arguing over which variable gets to be the protagonist in the novelization."

  Elias wiped rain from his glasses. "The math isn't the same. One model treats the colony as a vehicle. The other treats it as a replicator."

  "The Price Equation partitions the change," Thorne said, stepping aside to let them in. "You have covariance between colony fitness and defender frequency—that's your between-group term. Then you have covariance within the colony between individual fitness and defender frequency—that's your within-group term. The freeloaders always win inside the colony. They don't sting, so they save energy for budding. If you look only at the within-group term, altruism goes to zero. It only persists because the between-group term is positive enough to offset it."

  Mara set the bin on the lab bench. "Exactly. The group term is doing causal work. If you break up the colony, the trait disappears. The colony structure *causes* the persistence of the gene."

  "The colony structure causes the relatedness," Elias corrected, pulling off his wetsuit top. "If you founders weren't siblings, the freeloaders would win. It's the genetic assortment that matters, not the group boundary. You can describe it as group selection, sure, but it's bookkeeping. The real engine is the gene copying itself into cousins."

  "Bookkeeping?" Mara turned on him. "If I burn down the forest, is the fire real, or is it just the sum of burning trees? If the colony has a heritable trait—defender ratio—that determines its survival independent of the individual zooids, then the colony is a unit of selection. Denying that is like saying gravity isn't real because you can describe it as particle interactions."

  "Gravity doesn't have cheaters," Elias shot back. "Inside Colony Four-Two, the freeloaders are out-reproducing the defenders. Every time. The defenders are dead ends. They sting and they lyse. They are evolutionary suicide unless you account for the copies in the neighbors."

  Thorne walked over to the microscope where a sample of Four-Two was mounted. "Look at this."

  Mara and Elias leaned in. The magnification showed the zooids clearly. The defenders were swollen, packed with nematocysts. The freeloaders were slender, feeding filters.

  "I ran the histology on the dead defenders from the predation trial," Thorne said quietly. "The ones that stung the crabs."

  "And?" Elias asked.

  "They didn't just lyse," Thorne said. "Look at the basal plate. When they sting, they release a cement. They aren't just dying to protect the colony. They're dying to anchor it."

  Mara frowned. "Anchor it?"

  "During storm surges," Thorne said. "The colonies that washed away last month? Low defender count. The defenders act as structural rivets. Their death locks the colony to the substrate."

  Elias straightened up. "Okay. So it's a multifunctional trait. Still kin selection. The gene for 'defender morphology' gets passed on because it keeps the relatives attached to the rock."

  "But look at the dispersal buds," Thorne said, adjusting the focus. "We thought only the freeloaders produced larvae. They don't."

  He pointed to a cluster of cells near the base of a dead defender zone. "The defenders are the only ones capable of becoming propagules *if* the colony fragments. They're sterile while the colony is intact. But if the colony breaks apart—say, a piece washes off—the defender tissue regenerates into a new founder."

  The lab went silent, save for the rain hammering the roof.

  Mara blinked. "So they aren't altruists. They're bet-hedgers."

  "They're conditional reproducers," Elias said slowly. "They pay a cost now—no feeding, high mortality risk—for a chance at reproduction later if the colony crashes."

  "Which means," Mara said, her voice gaining speed, "the selection isn't just on the gene frequency. It's on the colony's life history strategy. The colony *manages* the caste ratio. It's not just siblings competing; it's a developmental program."

  "Or," Elias said, "it's a gene that says 'wait until the boat sinks before you try to swim.' It's still selfish. It's just a delayed payoff."

  "It's not delayed if you die stinging a crab," Mara countered. "If you sting, you cement the colony, but you lose the chance to regenerate. You are actually dying for the freeloaders."

  "Unless," Thorne interjected, "the freeloaders are helping the defenders." He pulled a notebook from his pocket. "We noticed something in the water chemistry. The freeloaders pump water currents. High freeloader density increases the flow rate over the defenders. The defenders need that flow to prime their nematocysts. Without the freeloaders, the defenders are useless. They can't sting."

  Elias rubbed his face. "So the freeloaders aren't cheating. They're enabling the defense."

  "They're cheating on reproduction," Elias insisted. "They let the defenders take the risk, then they use the safety to bud more clones."

  "And the defenders use the freeloaders to make their sting count," Mara said. "It's mutual dependence. You can't partition this cleanly, Elias. The within-group variance isn't just competition; it's cooperation required for the between-group survival."

  Thorne capped his pen. "This is the spot. The math still holds. You can still partition the variance. You can still write the equation where the gene is the star, or the colony is the star. The total change in frequency is identical."

  "Then why does it matter?" Elias asked, frustrated.

  "Because," Thorne said, "if you want to predict what happens when you mix colonies, the model matters. If Elias is right, and it's all kin selection, then if you mix unrelated founders into a single colony, the defenders should stop stinging. The relatedness drops, the incentive vanishes."

  "And if I'm right," Mara said, "if the colony is a selected unit with a developmental program, then the colony might enforce the defender ratio even with low relatedness. Policing mechanisms. Maybe the freeloaders can't bud unless the defenders signal them."

  "Which is it?" Elias asked.

  "We don't know," Thorne said. "The data we have is from natural settlements. High relatedness. Both models fit perfectly. They are formally intertranslatable here."

  Mara looked at the purple colonies in the bin. They looked less like grapes now and more like cities under siege. "So we're arguing over metaphysics."

  "No," Elias said. "We're arguing over where to look for the lever. If I want to stop the freeloaders from taking over, do I manipulate the genetics? Or do I manipulate the colony structure?"

  "Next week," Thorne said, "we run the chimeras. We take founders from Colony A and Colony B. Unrelated. We force them to settle together."

  "If Elias is right," Mara said, "the defender ratio crashes. The freeloaders eat the defenders alive."

  "If Mara is right," Elias said, "the colony polices them. The defender ratio stays stable, even if the defenders are dying for non-relatives."

  "And if the defenders turn out to be cloning themselves into the freeloaders?" Thorne added dryly. "Or if the freeloaders are actually the ones stinging when we aren't looking?"

  "Then we burn the models," Mara said.

  "Then we write a new equation," Elias corrected.

  The rain intensified, drumming a chaotic rhythm on the metal roof. Inside the lab, the hum of the filtration system provided a steady baseline. The colonies pulsed in the bin, oblivious to the argument over their souls.

  "Pass me the pipette," Elias said, reaching for the bin.

  "Careful," Mara said, handing it to him. "Don't break the surface tension."

  "I know how to handle the samples," Elias said. "I'm not selecting against the colony."

  "Could have fooled me," Mara muttered.

  Thorne watched them work, the gene-counter and the group-theorist, leaning over the same tray of seawater, measuring the same numbers, seeing two different worlds. He took a sip of coffee. It was cold, but he drank it anyway. The science wasn't in the answer, he knew. It was in the friction.

  "Make sure you log the relatedness coefficients," Thorne said. "Whichever way this breaks, I want to see the covariance."

  "You'll see it," Elias said.

  "It'll be there," Mara agreed.

  They worked in silence for a moment, the only sound the wet click of the pipette and the rain washing the world outside down to its barest components.
