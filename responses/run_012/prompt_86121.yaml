answer: |-
  **Transcendent Realism**
  *Translation:* Interfaces defined in a global registry independent of any implementing class. Types exist in a higher universe even if no instance is ever allocated.
  *Residue:* Cleanly models uninstantiated universals (unused interfaces). Distortion: Requires explicit declaration (source code), implying a designer. No counterpart for existence outside a system boundary; types in code are always artifacts of a build process.

  **Immanent Realism**
  *Translation:* Types are runtime tags or vtables; no type exists without an object instance. Universals are reified only upon allocation.
  *Residue:* Clean on reification vs. erasure. Distortion: Cannot model definition prior to use (no interface without impl). No counterpart for metaphysical "inherence" beyond memory layout; the relation between object and tag is pointer arithmetic, not ontological grounding.

  **Nominalism (Resemblance/Class)**
  *Translation:* Structural typing or duck typing. No nominal classes; "kinds" are sets defined by constraints checked at use-sites. Resemblance is primitive structural equality.
  *Residue:* Clean on resemblance primitives (structural equality). Distortion: Identifiers still exist in syntax (variable names). No counterpart for "name without ontology"; in code, every symbol refers to a memory location or abstraction.

  **Conceptualism**
  *Translation:* Types are compile-time inference artifacts, erased at runtime. They exist only in the checker's state.
  *Residue:* Clean on type erasure. Distortion: Maps "mind" to "compiler," smuggling agency. No counterpart for subjective categorization vs. algorithmic inference; the compiler's logic is deterministic, not conceptual.

  **Trope Theory**
  *Translation:* Every object has a unique singleton type. Sharing is parametric polymorphism over distinct types (e.g., `fn<T>(x: T)` where `T` is unique per call).
  *Residue:* Clean on singleton types. Distortion: Resemblance requires explicit generic constraints. No counterpart for exact resemblance without abstraction; code requires a common bound to operate on distinct types.

  **Specific Cases**
  1.  **Third Man/Stratification:** This is the `Type : Type` paradox. Allowing a type to be an instance of itself causes inconsistency. Universe stratification (`Type_i : Type_{i+1}`) solves this cleanly. The regress is not metaphysical mystery but a consistency check in the kind system.
  2.  **Uninstantiated Universal:** An interface with no implementation. Translates cleanly, but highlights the declaration artifact: in code, someone must write the interface. In metaphysics, the realist claims it exists without being "written."
  3.  **Resemblance Explanation:** Shared supertype (Nominal) vs. Structural Check. A nominal supertype explains *why* objects resemble (common ancestry/definition). A structural check *is* the resemblance (current state match). The former asserts history; the latter asserts state.

  **Designer Problem & Conclusion**
  The critical residue is *source code*. In type systems, types do not appear spontaneously; they are declared. This smuggles in a designer. If you treat the compiler as a natural law rather than an agent, Realism requires a Platonist compiler where types exist prior to declaration. This is not a feature of type theory but an artifact of the translation.

  The residue does not point to ineffability; it shows that most classical positions are implementation choices dressed as metaphysics.
  *   **Transcendent Realism** is Static Nominal Typing with global scope.
  *   **Immanent Realism** is Runtime Type Information (RTTI) with no compile-time definitions.
  *   **Nominalism** is Structural/Dynamic Typing.
  *   **Conceptualism** is Type Inference with Erasure.
  *   **Trope Theory** is Singleton Types with Parametric Polymorphism.

  The "Designer" problem reveals that Realism implicitly assumes a cosmic API specification written before the universe runs. Nominalism and Trope theory avoid this by treating types as emergent from usage or particular data. The debate is largely about whether the type system is explicit (Realism) or inferred/structural (Nominalism). The metaphysics collapses into engineering: do you pay the cost of global declarations for safety (Realism), or rely on runtime checks and structural equivalence for flexibility (Nominalism)? The Third Man regress confirms that without universe stratification, any system allowing self-predication crashes. Thus, the type-system picture suggests the classical problem was often a confusion about universe levels and declaration scope rather than deep ontology. Realism is the only position that struggles with the "no designer" constraint, as it requires types to exist without declaration, which is impossible in any formal system we can construct.
