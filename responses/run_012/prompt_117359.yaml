answer: |-
  Good evening, everyone.

  For those who don't know me, I'm one of the many students who had the privilege of surviving Margit's lab. Thirty-eight years is a long time to spend in one department. It's long enough to see methods come and go, long enough to see arguments settle into scars, and certainly long enough to earn a retirement.

  I know we have a mix of people here tonight. We have methodologists who will hear every word, and we have family who might prefer to be elsewhere. I know two old-school frequentists who argued with Margit since the nineties are in the room. I once asked them if they ever agreed on anything. They said, "Yes, once. We both thought the coffee machine was broken."

  But seriously, Margit taught us that science isn't about being right; it's about being rigorous enough to know when you might be wrong. And nowhere was this more clear than in the rule she ran the lab on starting around 2011.

  Many of you know it. Every study got analyzed twice. Once the ordinary way: p-value under .05, confidence interval clearing zero. And once with what she called the "wet-blanket prior." For the non-statisticians, think of it this way: The first analysis asked, "Could this happen by chance?" The second asked, "Is this effect big enough to actually change how we treat patients?"

  A result only got written up if both arms agreed on the direction. It was a system designed to force consensus between two different ways of seeing the world.

  A few years ago, Margit publicly disowned the rule. She argued that because the two analyses answer different questions, their agreement wasn't corroboration. It wasn't two witnesses confirming a story; it was two people asking different questions and getting lucky that the answers matched.

  She is half right. They aren't independent witnesses. But I think the interesting part was always the disagreement.

  Margit used to show us that if you hold that p-value fixed at .05 and just keep adding subjects—making the study bigger and bigger—the Bayesian arm eventually turns around. Even though the frequentist says "Significant!", the Bayesian arm starts siding with the null. It whispers that the effect is too tiny to matter, precisely because the study was so big.

  That means the rule quietly penalized the big, well-powered studies—the ones we're usually told to trust most. I don't think that's a flaw you fix by quitting. I think that's the thing worth standing up and telling people about. It reminds us that "statistically significant" doesn't always mean "real," and that big data demands higher standards, not lower ones.

  Margit was willing to change her mind about her own rule when she saw the tension inherent in it. That humility is the real legacy. She taught us that the friction between methods isn't something to smooth over; it's where the truth hides.

  So, if I could ask you to raise your glasses.

  To Margit. For the thirty-eight years, for the wet blankets, and for teaching us that the most important result is the one that makes you think twice.

  Cheers.

  ***

  **Note on Statistics**

  Your memory of the "flip" is correct; this is a classic manifestation of Lindley's Paradox, where a fixed p-value provides vanishingly small evidence against the null as sample size increases relative to a fixed prior width. The speech takes liberties by implying the prior width was literally identical for every study regardless of context, whereas in practice such a threshold usually requires domain-specific calibration. Regarding the "independent witnesses" claim: they are not independent because both analyses condition on the exact same data, so their agreement is structurally correlated rather than corroborative; what changes my mind is recognizing that their disagreement reveals the divergence between *evidence against noise* and *evidence for magnitude*, which is precisely the insight you highlighted.
