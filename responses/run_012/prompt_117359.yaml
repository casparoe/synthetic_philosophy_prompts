      *   *Claim:* "If you hold p fixed at .05 and just keep adding subjects, the Bayesian arm eventually turns around and starts siding with the null."
      *   *Context:* This is essentially Lindley's Paradox.
      *   *Scenario:* Testing $H_0: \theta = 0$ vs $H_1: \theta \neq 0$.
      *   *Frequentist:* p-value depends on $Z = \frac{\hat{\theta}}{SE}$. As $N \to \infty$, $SE \to 0$. If $\hat{\theta}$ is fixed non-zero, $Z \to \infty$, p-value $\to 0$. If we *hold p fixed* at 0.05, that means $\hat{\theta}$ must be shrinking relative to $SE$. Specifically, $\hat{\theta} \approx 1.96 \times SE \propto 1/\sqrt{N}$.
      *   *Bayesian:* Prior is $N(0, \tau^2)$ where $\tau$ is the "meaningful effect size" (fixed constant). Likelihood is $N(\hat{\theta}, SE^2)$. Posterior is weighted average.
      *   *Bayes Factor:* Compares likelihood at 0 vs integrated likelihood under prior.
      *   *The Paradox:* As $N \to \infty$, if the true effect is zero, p-values will be uniformly distributed, but BF will favor $H_0$. If the true effect is non-zero but small, and we condition on a *fixed p-value* (meaning $\hat{\theta}$ scales with $1/\sqrt{N}$), the data becomes increasingly compatible with the null relative to the specific alternative prior.
