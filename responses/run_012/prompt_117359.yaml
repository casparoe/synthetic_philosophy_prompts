      *   *Conclusion:* Yes, the memory is statistically sound. This is the essence of Lindley's Paradox. A fixed p-value threshold becomes less evidence against the null as sample size increases, if the alternative hypothesis is a diffuse prior or a fixed meaningful effect size.
