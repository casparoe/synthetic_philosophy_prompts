      *   **Roommate's Argument:** Expected Value (EV) decision making. Calculate $P(\text{offer}) \times \text{Value}(\text{offer})$. If EVs are equal, be indifferent (flip a coin). If uncertainty exists but can't be quantified, treat it as 50/50 (or whatever point estimate you have) and move on.
      *   **User's Intuition:** The *uncertainty* itself matters. Option A (Startup) has high ambiguity regarding the probability of success. Option B (Big Co) has low ambiguity (known data). Even if the calculated numbers are the same, the *quality* of those numbers differs.
      *   **The Question:** Is the user right that uncertainty/ambiguity matters, or are they just rationalizing a gut feeling?

  2.  **Evaluate the Roommate's Model (Expected Value):**
      *   *Strengths:* It's a standard rational decision-making framework. It forces quantification of preferences and probabilities.
      *   *Weaknesses:* It assumes risk neutrality (most people are risk-averse). It assumes probabilities are known or easily estimable (Knightian uncertainty vs. Risk). It ignores option value (future opportunities). It ignores learning value.

  3.  **Evaluate the User's Intuition (Ambiguity Aversion):**
