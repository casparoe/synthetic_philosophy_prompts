      *   *Weaknesses:* Harder to calculate. Can lead to analysis paralysis if not structured.

  4.  **Identify Key Concepts to Explain:**
      *   **Risk vs. Uncertainty (Knightian Distinction):** Risk is when you know the odds (rolling a die). Uncertainty is when you don't know the odds (startup success). This is the core philosophical point.
      *   **Ambiguity Aversion (Ellsberg Paradox):** People prefer known risks over unknown risks, even if EV is the same. This is a documented psychological/economic phenomenon, not just a "gut feeling."
      *   **Variance/Risk Profile:** A startup offer is binary (0 or 1, mostly). A big company offer is likely more stable. If the *expected* value is the same, the *distribution* is different. Most people are risk-averse.
      *   **Option Value/Real Options:** An internship isn't just about the return offer. It's about the resume signal, network, and skills learned. A failed startup internship might signal differently than a big co internship.
