prompt: |-
  So my roommate and I have been going back and forth about how I should pick between two summer internships, and I want an outside take on who's being dumb here (possibly me).

  He says it's obviously simple: for each option, estimate the chance it turns into a full-time offer, multiply by how much I'd want that outcome, and pick whichever number is bigger. Fine. But option A is at this tiny two-person startup where I honestly have almost no idea what my odds are, and option B is a big company where I know exactly what tends to happen to interns because like ten people from my program have done it. When I actually run his little calculation, the two numbers come out basically the same, and he says that means I should just be indifferent and flip a coin.

  That feels wrong to me, but I can't articulate why. It's not that I think A is secretly better — it's that I feel like I know way less about A, and that this should count for something even if the point estimates match. He says if I can't put a number on it then I might as well call it 50/50 and stop whining.

  Is there actually something real he's missing, or am I just dressing up a gut feeling as a principle?
reasoning: |-
