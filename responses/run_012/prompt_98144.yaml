      *   *The Ellsberg Paradox:* Mention this specifically. It proves humans (and rational agents under certain conditions) prefer known probabilities.
      *   *Variance:* Explain that EV is an average. If you need *one* job, the variance matters. Startup = High Variance. Big Co = Low Variance. Risk aversion is rational.
