      *   *No reading lists:* Avoid citing Hart explicitly if possible, or just refer to concepts. (The prompt says no case names, doesn't explicitly ban theorists, but better to stick to concepts to maintain the "email to colleague" vibe).

  8.  **Final Polish:** Check flow. Ensure the distinction between "undecidable in logic" and "undecided in court" is clear. Ensure the distinction between "inconsistency" (contradiction) and "conflict" (resolved by hierarchy) is clear.

  *(Self-Correction during drafting)*: I need to be careful not to say law *can't* be formalized. Some legal theorists try. But for the analogy to hold, it must meet the arithmetic condition. I must emphasize that legal language doesn't naturally encode arithmetic in the way required for Gödel numbering. Also, clarify that "truth" in law is different from "truth" in arithmetic. In law, truth is often institutional (what the court says), whereas in arithmetic, it's platonic or model-theoretic.

  *(Refining the "Mind vs Machine" bit)*: This is the Lucas-Penrose argument. I need to explain it fairly but show why it's contested even in philosophy, let alone law. The judge sees the truth of the unprovable statement. But does the judge? Or does the judge just make a decision?

  *(Refining the "Constitution" bit)*: An entrenched amendment clause is a rule about rules. Gödel's second theorem is about a system proving its own consistency. These are different. A system can have rules for changing itself without running into Gödelian limits unless it tries to prove its own soundness.

  *(Final check on prose)*: Ensure it reads like a letter. "You know how it is..." "Here is the thing..."

