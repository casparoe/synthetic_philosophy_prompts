answer: |-
  Friends, colleagues, donors. We are split down the middle on whether to adopt a formal determination procedure for democratic backsliding. One side says the phrase is a weapon with no content, applied selectively to enemies while friends are exempted. The other says that if we cannot name the disease, we should not be in the business of medicine. I am not here to heal this rift. I am here to suggest that the rift is the only honest place to stand.

  To vote on a test is to vote on a definition. When we say a country is backsliding, we are often talking past one another. Sometimes we mean a rate of change—a speed of decay that alarms us. Sometimes we mean a threshold—a line crossed that disqualifies a regime. Sometimes we mean an intention—a plot to destroy democracy. Sometimes we mean an outcome—a functional failure regardless of intent. If we choose rate, we ignore slow rot. If we choose threshold, we ignore context. If we choose intention, we excuse incompetence. If we choose outcome, we punish bad luck.

  We cannot have all of these. We must choose one, knowing what it leaves out. I propose we adopt a test based not on the health of elections, which everyone watches, but on the rigidity of the state beneath them. I propose three criteria.

  First, the Reversibility Test. When power changes hands, can the new government legally undo the administrative appointments of the old one within a single term? If the civil service, the judiciary, and the regulatory bodies are staffed by lifers who cannot be removed by the elected winner, the vote has been severed from the power to govern.

  Second, the Plurality Test. Are there at least two sources of public data recognized as legal by the state? If contradicting official statistics carries a legal penalty, or if private verification is outlawed, there is no shared reality upon which opposition can be built.

  Third, the Friction Test. Is the cost of organizing opposition higher than the cost of maintaining power? We do not need to measure money specifically. We need to measure procedure. If the incumbent files a form and the opposition files a lawsuit, the slope is too steep.

  These are operational. A program officer can score them. But who decides the score? If we say outsiders decide—monitors, funders, scholars—we risk imperialism. We risk saying we know their democracy better than they do. If we say insiders decide—domestic courts, journalists, voters—we risk blindness. Insiders are often too threatened to speak, or too complicit to see.

  I propose a division of labor. Outsiders measure the rules: the text of the laws, the formal tenure of officials, the written penalties for speech. Insiders measure the effect: the fear in the newsroom, the silence in the courtroom, the hesitation at the ballot box. We measure the cage; they measure the air inside it. If we claim the authority to measure the air, we become occupiers. If we claim the authority to measure only the cage, we become clerks. We must accept the loss of certainty that comes with this split. We will sometimes have a open cage with no air, and we will have to say nothing.

  Now, the objection. The strongest version of the partisan-instrument charge is this: That any test we write will be calibrated to fail our adversaries and pass our allies. That we will call it backsliding when a government we dislike tightens control, and call it stabilization when a government we fund does the same. That this foundation will become a lobby wearing the mask of a metric.

  This charge is correct. It is unavoidable. Any definition of democracy privileges some values over others. To survive this charge, the concept of backsliding must give up its claim to scientific neutrality. It cannot be a weather report. It must be a rule of engagement. We admit the bias, and we bind ourselves to the criteria even when it hurts us. We apply the Reversibility Test to our friends. We apply the Friction Test to our allies. If we do not, the label is indeed a weapon. If we do, it is a standard. We survive the charge not by becoming neutral, but by becoming consistent.

  Consider a hard case. Imagine a country where elections remain genuinely competitive. The incumbent runs, loses, and hands over power peacefully. The transfer is smooth. But the courts, the public broadcaster, the civil service, and the largest private media have been rearranged in the years prior so that they are legally insulated from the new government. They are staffed by loyalists with tenures that outlast the election cycle. The new president arrives and finds the keys do not fit the locks.

  Does my test call this backsliding? Yes. The Reversibility Test fails. The vote occurred, but the capacity to govern did not transfer. The range of policy available to the winner is narrower than the range available to the loser. This is not a defect in the test. It is evidence that the concept of backsliding was always narrower than its users assume. It is not about the moment of loss. It is about the erosion of the prize. If the office no longer commands the state, the election is a ritual, not a decision. We must be willing to call this backsliding even if the incumbent lost. Otherwise, we are protecting the spectacle of democracy rather than the substance.

  So, where does this leave us? We are not here to certify regimes. We are here to monitor the machinery. If we adopt this procedure, we are not saying we know when a democracy dies. We are saying we know when the tools to save it are being removed.

  For those of you who will explain this tomorrow at breakfast, here is what you need to say. We do not judge whether a country is good or bad. We judge whether the winner of an election can actually do the job they were elected to do. If the laws are changed so that the next government cannot undo the work of the last, the ladder has been pulled up. We are not here to pick the winner. We are here to ensure the job still exists for whoever wins. If the job is hollowed out, we will say so. Not because we dislike the government, but because we respect the office. That is the only standard that survives the mirror.
