answer: |-
  Your observation is remarkably precise, and your identification of the Hobbesian (and Viconian) *verum factum* principle ("the true is the made") as the underlying intuition is correct. However, the engineering practice you describe is not a coherent philosophical system; it is a **methodological dualism** sustained by pragmatic necessity. It treats the internal logic of software as a realm of rational necessity (like geometry) and the execution environment as a realm of empirical contingency (like physics).

  Here is a reconstruction of the implicit theory of knowledge your practice commits you to, an analysis of its consistency, and an evaluation of whether an empiricist can inhabit this role without incoherence.

  ### 1. Reconstructing the Implicit Theory: "Methodological Dualism"

  The engineering practice you describe relies on three implicit epistemic commitments. None of these are strictly held as metaphysical truths, but all are operationalized as if they were.

  **A. The Stipulation Thesis (Conventionalism, not Constructivism)**
  You asked if this presupposes constructivism (that making gives knowledge). Strictly speaking, no. Engineers do not believe they *invent* logic or mathematics. Rather, they hold a **conventionalist** view: we define the rules of the system (the types, the specs, the logic), and therefore we know the consequences of those rules *by definition*.
  *   *Presupposition:* Knowledge of code is *a priori* because code is a set of stipulations. To say a function is "correct" means "it conforms to the spec we wrote," not "it conforms to mind-independent truth."
  *   *Status:* **Pragmatic Convenience.** This is useful because it allows us to treat specifications as laws. However, it fails when the spec itself is incoherent or mismatches reality.

  **B. The Transparency Thesis (Formalism)**
  This is the belief that reasoning is computation over symbols (as Hobbes suggested). If we can see the symbols (source code), and we know the rules of transformation (logic/semantics), the outcome is necessary.
  *   *Presupposition:* Syntax entails semantics. If the type checker passes, the behavior is guaranteed *within the model*.
  *   *Status:* **Strict Presupposition.** Engineering practice *requires* this to function. If you cannot assume that `if (true) { A }` implies `A`, you cannot reason at all. However, engineers extend this presumption beyond logic to *implementation*, assuming the compiler/hardware will faithfully execute the symbols. This extension is not philosophically justified but is practically indispensable.

  **C. The Abstraction Boundary (The "Ceteris Paribus" Clause)**
  This resolves the inconsistency you noted regarding hardware and libraries. Engineers treat their own code as the "system" and everything else (OS, network, CPU) as the "environment."
  *   *Presupposition:* We can isolate the necessary truth of our code from the contingent truth of the environment.
  *   *Status:* **Pragmatic Convenience.** This is a heuristic for managing cognitive load. It is epistemically false (the code does not exist in a vacuum) but methodologically necessary.

  ### 2. Addressing the Inconsistencies

  You identified two major fractures in this worldview: the **Stack Problem** (our certain code runs on uncertain hardware) and the **Black Box Problem** (our uncertain models run on certain code).

  **The Stack Problem:**
  If certainty requires "making," we made nothing. We didn't make the CPU, the OS, or the electrons.
  *   *Resolution:* The practice does not actually rely on "making." It relies on **assumed fidelity**. We treat the lower layers as *axiomatic*. We pretend the hardware is a perfect model of the ISA (Instruction Set Architecture).
  *   *Verdict:* This is not a genuine epistemic claim; it is a **division of liability**. When a bug occurs, we need to know where to look. By treating our layer as "rational" and the lower layer as "given," we localize the search space for errors. If we treated the CPU as empirically uncertain as the network, debugging would be impossible.

  **The Black Box Problem (Neural Networks):**
  We train the model (we "make" it), yet we treat it as empirical/opaque.
  *   *Resolution:* This reveals that "making" was never the true criterion. The true criterion is **inspectability** (or intelligibility). We treat source code as certain because we can trace the causal chain from line to execution. We treat weights as uncertain because the mapping from parameter to behavior is not humanly tractable.
  *   *Verdict:* The principle is not *verum factum* (truth is made); it is *verum intellectum* (truth is understood). We grant "certainty" only to artifacts whose causal mechanisms are transparent to human reason.

  ### 3. Strict Presuppositions vs. Convenient Fits

  To answer your specific question on what is required vs. what is convenient:

  | Claim | Strict Presupposition? | Or Pragmatic Fit? | Analysis |
  | :--- | :--- | :--- | :--- |
  | **Logic is necessary** | **Yes.** | N/A | You cannot engineer without assuming non-contradiction and valid inference. |
  | **Code behavior is necessary** | No. | **Pragmatic Fit.** | Code behavior is physical (electrons). We *treat* it as necessary to reason about it, but it is contingent on hardware. |
  | **Making implies Knowing** | No. | **Pragmatic Fit.** | Refuted by Neural Nets. We know what we *specify*, not necessarily what we *build* (if the build process is opaque). |
  | **Formal Proof = Truth** | No. | **Pragmatic Fit.** | A proof proves the model, not the machine. We act as if the model *is* the machine to avoid paralysis. |
  | **External World is Empirical** | **Yes.** | N/A | You cannot prove the behavior of a third-party API without testing it. This is a genuine epistemic limit. |

  **The Core Inconsistency:**
  The practice is **inconsistent**. It claims a kind of rationalist certainty for code that the physical world cannot support. However, it is a **productive inconsistency**. It functions like Newtonian physics: we know it isn't fundamentally true (relativity exists), but we use it because it works at the scale we operate.

  ### 4. The Empiricist Alternative: What Would Change?

  If you replaced the "Maker's Knowledge" picture with a thoroughgoing empiricism (Quinean holism), where a proof is just another form of evidence, and all software knowledge is *a posteriori*:

  1.  **Proofs become High-Fidelity Tests:** A type check or model check would not be spoken of as "verifying correctness" but as "eliminating a class of errors with high probability." The language would shift from "This *cannot* happen" to "We have no evidence this *can* happen."
  2.  **The Stack Flattens:** You would treat your own code with the same skepticism as a third-party library. You would instrument your own functions as if they were external APIs, monitoring their latency and error rates rather than assuming their logical correctness.
  3.  **Specs are Hypotheses:** The specification would not be the "truth" against which code is measured. The specification would be a hypothesis about user needs, and the code would be an experiment to test that hypothesis.
  4.  **Debugging Changes:** Currently, debugging is often deductive ("The logic dictates X, so the state must be Y"). An empiricist approach would be more inductive ("Every time we see state Y, X happened previously").

  **Would engineering survive?**
  Yes. In fact, **DevOps and Observability** are already moving in this direction. The rise of "Chaos Engineering" (randomly breaking things in production) is an admission that we do not *know* the system behaves correctly, regardless of what the code says.

  ### 5. Can a Thoroughgoing Empiricist Engineer be Coherent?

  **Yes.** An empiricist engineer can hold these practices without incoherence, provided they reinterpret the *modality* of their claims.

  *   **The Rationalist Engineer says:** "This function is *correct* (necessarily true)."
  *   **The Empiricist Engineer says:** "This function is *reliable* (inductively supported by logic and testing)."

  For the empiricist, the distinction between "code we wrote" and "APIs we call" is not a distinction between *Necessity* and *Contingency*. It is a distinction between **Access** and **Cost**.
  *   We have high-bandwidth access to the source of our own code (we can read it, trace it, modify it).
  *   We have low-bandwidth access to the source of a compiler or API (we can only observe inputs/outputs).

  **How the Empiricist Justifies the Practice:**
  1.  **Reasoning as Compression:** Formal proofs are not grasps of eternal truth; they are data compression. A proof compresses a billion test cases into a single argument. We trust the proof not because it is metaphysically magical, but because it is a more efficient way to gather evidence than testing.
  2.  **The "Maker" Distinction as Accountability:** The empiricist admits that "making" doesn't grant epistemic privilege. However, "making" grants **causal leverage**. We can change the code we wrote; we cannot change the compiler. Therefore, we focus our certainty-claims on the layer where we have agency.
  3.  **Holism:** The empiricist accepts that if the hardware fails, the "correct" code fails. There is no contradiction here. The proposition "Code C is correct" is shorthand for "Code C is correct *given* axioms A (hardware, OS, etc.)." Since we accept A on empirical grounds, the conclusion is empirical.

  ### Conclusion

  Your practice presupposes a **fictional rationalism**. It acts *as if* software is a realm of pure reason (like Hobbes' geometry) to make the complexity manageable.
  *   **Does it require constructivism?** No. It requires **conventionalism** (we defined the rules) and **formalism** (syntax drives behavior).
  *   **Is it consistent?** No. It ignores the physicality of computation and the opacity of complex self-made systems (like NNs).
  *   **Can an empiricist do it?** Yes. The empiricist simply views the "certainty" of code as a **very high degree of confidence** derived from high inspectability and low entropy, rather than metaphysical necessity.

  If you wish to align your philosophy with your practice without hypocrisy, adopt the stance of a **Pragmatic Empiricist**: Acknowledge that a type checker is a tool that reduces risk, not a oracle that grants truth. Acknowledge that your code is physical, not logical. You will still write the same code, but you will monitor it more humbly, and you will admit that when the server burns down, your "proof" burned with it.
