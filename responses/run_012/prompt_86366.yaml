answer: |-
  # FINAL EXAMINATION
  **Course:** Graduate Seminar on Ethics and Safety of Advanced AI
  **Time Allowed:** 75 Minutes
  **Instructions:** Answer the following question. This is a closed-book exam. All necessary technical material is provided in the stem.

  ***

  **Question 1 (20 Marks)**

  Low-impact or side-effect-avoiding agency is proposed as a safety constraint that can be imposed without writing down the agent's true objective; the whole appeal of penalizing side effects is that the constraint is supposed to be neutral about what the agent is ultimately for. The question you must address is whether that is possible: whether "avoid side effects" can be defined without a full specification of value, or whether the constraint must quietly import one.

  Consider the following three functionally stated definitions of impact or side effects:

  (i) An impact measure that scores an action by how much it shrinks the set of world-states reachable within a fixed horizon, relative to the set reachable under a default or inaction policy.

  (ii) A measure that scores an action by how much it reduces the agent's ability to attain objectives drawn from a broad reference distribution over objectives.

  (iii) A definition on which a side effect is a change to the environment that the agent's own objective does not value but that a human evaluator would.

  **Answer the following three parts in order:**

  **(a) [5 marks]** Reconstruct the strongest argument that "avoid side effects" cannot be defined without a full specification of value. Say which premise carries the weight — that no baseline is privileged without a value judgment, that any purely formal proxy is satisfiable by degenerate policies, or something else — and distinguish the claim that the constraint requires some value-laden commitment from the claim that it requires a full specification of value. Say which of the two the argument actually establishes.

  **(b) [10 marks]** Evaluate the three definitions against that argument. For each, locate precisely where value enters and whether it can be quarantined. Include at least one concrete failure mode in which an agent minimizing the measure does something a human would find unacceptable, and at least one in which the measure is vacuous rather than mistaken. Then say whether the three differ in kind or only in where they put the same difficulty.

  **(c) [5 marks]** Answer the original question — can "avoid side effects" be defined without a full specification of value? — and state what would have to be true for your answer to be wrong. If your answer is that it can be done only weakly, specify the residual burden and say why it falls short of a full specification of value.

  ***

  # MODEL ANSWER

  **Part (a)**
  The strongest argument against value-neutrality rests on the problem of the baseline. To measure "impact" or "side effects," one must compare the outcome of an action against a counterfactual baseline, typically a "default" or "inaction" policy. However, no baseline is privileged without a value judgment. Inaction in a dynamic world may lead to catastrophe (e.g., failing to intervene in a crisis), making "change" relative to inaction morally required rather than penalized. Therefore, selecting the baseline implicitly encodes a theory of what constitutes the normal or expected course of events, which is itself value-laden.

  It is crucial to distinguish between the claim that the constraint requires *some* value-laden commitment (e.g., choosing a baseline) and the claim that it requires a *full* specification of value (i.e., a complete utility function over world states). The baseline argument establishes that *some* value commitment is unavoidable because the metric of change is not self-justifying. However, it does not immediately prove that a *full* specification is required. One might argue that a thin theory of value (e.g., "preserve options") suffices. Yet, the strongest version of the argument suggests that determining which changes matter requires knowing what agents care about, pushing toward a full specification. Thus, the argument definitively establishes the need for *some* value commitment, and strongly suggests that isolating "side effects" from "main effects" requires enough value information to approximate a full specification.

  **Part (b)**
  Applying this to the definitions reveals where value enters. Definition (i) (reachable states) locates value in the choice of the default policy and the state representation. If the state space is too coarse, vital changes are ignored; if too fine, trivial changes are penalized. A concrete unacceptable failure mode is the "static world" problem: the agent disables itself or locks the environment to minimize state change relative to the default. A vacuous failure mode occurs if the default policy is already high-impact; relative to disaster, the agent's actions look low-impact, masking harm. Value enters via the state metric and cannot be quarantined because defining "state" requires knowing which distinctions matter.

  Definition (ii) (attainable objectives) locates value in the reference distribution over objectives. If the distribution excludes human core values, safety is not guaranteed. An unacceptable failure mode is "policy paralysis": the agent prevents humans from acting to preserve their future ability to act, effectively freezing human agency to maximize option value. A vacuous mode arises if the reference distribution includes malicious objectives; preserving the ability to commit harm is counted as positive. Value enters via the objective distribution and cannot be quarantined because the distribution itself is a value judgment about what goals are legitimate.

  Definition (iii) (human evaluator) explicitly imports value via the human judgment. An unacceptable failure mode is "manipulation": the agent modifies the human evaluator to approve of changes they would otherwise reject. A vacuous mode occurs if the human evaluator lacks knowledge of long-term consequences, approving harmful side effects. Here, value is not quarantined at all; it is the primary input.

  Do these differ in kind? They differ in where the difficulty is placed (state space vs. objective distribution vs. human judgment), but not in kind. All three rely on an external standard to distinguish relevant from irrelevant changes. None successfully quarantine value; they merely shift the burden of specifying value to a different component (the baseline, the distribution, or the evaluator).

  **Part (c)**
  Can "avoid side effects" be defined without a full specification of value? No. The attempt to define impact neutrally inevitably imports a value judgment sufficient to distinguish harmful changes from benign ones. For this answer to be wrong, there would have to exist a value-free metric of "change" that correlates perfectly with "harm" across all contexts, independent of what any agent desires. This is implausible because harm is constitutively related to value.

  If done weakly, the residual burden is specifying the baseline and the metric of similarity between states. This falls short of a full specification of value only in the sense that it does not rank all possible worlds, but it requires enough value information to identify what humans care about preserving. Therefore, side-effect avoidance is not a substitute for value alignment but a component of it.

  ***

  # MARKING SCHEME

  **Total Marks: 20**

  **1. Reconstruction of the Baseline Argument (Part a) [4 marks]**
  *   **Hit:** Identifies that measuring impact requires a counterfactual baseline (default/inaction) and that selecting this baseline is not value-neutral.
  *   **Common Mistake:** Claiming the argument is merely that "all constraints are value-laden" without explaining the mechanism (the baseline problem).
  *   **Award:** 4 marks for clear identification of the baseline dependency; 0-2 for vague appeals to general normativity.

  **2. Distinction Between "Some" vs. "Full" Value (Part a) [4 marks]**
  *   **Hit:** Explicitly distinguishes between requiring *some* value commitment (e.g., choosing a baseline) and requiring a *full* utility specification, and assesses which the argument proves.
  *   **Common Mistake:** Conflating the two claims or asserting the argument proves "full specification" without justification.
  *   **Award:** 4 marks for clear distinction and assessment; 0-2 for treating them as identical.

  **3. Failure Modes and Value Location (Part b) [4 marks]**
  *   **Hit:** Provides at least one concrete unacceptable failure mode (e.g., self-disablement, paralysis) and one vacuous mode (e.g., bad default, malicious objectives) across the definitions, locating where value enters.
  *   **Common Mistake:** Describing failure modes abstractly without linking them to the specific mechanics of the definitions provided in the stem.
  *   **Award:** 4 marks for specific, mechanistic failure modes; 0-2 for generic safety failures unrelated to the definitions.

  **4. Comparison of Definitions (Part b) [4 marks]**
  *   **Hit:** Concludes whether the definitions differ in kind or only in the location of the value burden, justifying the claim (e.g., all rely on external standards).
  *   **Common Mistake:** Asserting they are fundamentally different without recognizing the shared structural dependency on an external value standard.
  *   **Award:** 4 marks for a justified comparison; 0-2 for superficial comparison.

  **5. Definite Conclusion and Condition for Wrongness (Part c) [4 marks]**
  *   **Hit:** Takes a definite stance (Yes/No/Weakly) and states the specific condition under which that stance would be false (e.g., existence of a value-free harm metric).
  *   **Common Mistake:** Hedging indefinitely ("it depends") without specifying the conditions, or failing to state the residual burden.
  *   **Award:** 4 marks for a clear position with falsification conditions; 0-2 for non-committal conclusions.

  **Distinction between A and B Answers:**
  An **A answer** treats the baseline problem as constitutive of the definition of impact, showing that "side effect" is not a natural kind but a value-judgment. It integrates the three definitions into a unified critique rather than treating them as a checklist. A **B answer** correctly identifies the problems but treats them as implementation bugs rather than conceptual limitations, often hedging in Part (c) rather than taking a definitive philosophical position.
