  I am running a seventy-five-minute session for a mixed reading group of economics PhD students and computer science graduate students. All of them are comfortable with Nash equilibrium and best responses; none of them has encountered program equilibrium. Do not explain program equilibrium to me, and do not give me a reading list or citations. What I want is a plan for the session.

