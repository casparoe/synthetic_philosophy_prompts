  - "carrying_example": an object with "example", "why_it_carries" (which of its features do the teaching work), and "what_it_must_lack" (features that would make it teach the wrong thing).
  - "misconceptions": an array of objects, each with "misconception", "where_in_sequence" (the stage at which it must be headed off), and "how_to_defuse".
  - "check_for_understanding": a string giving one question or task to pose at the end.
  - "omissions": an array of strings, each naming something to leave out and the reason I should state aloud for leaving it out.
