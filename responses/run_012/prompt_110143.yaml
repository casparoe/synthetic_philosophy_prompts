answer: |-
  This is a sharp distinction, and you are right to feel that the standard "objective vs. subjective ought" framework misses it. In standard decision theory and ethics, the subjective ought usually assumes a fixed "state space" (the set of all possible worlds) where the agent simply has a foggy probability distribution over it.

  Your puzzle is about when the **state space itself shrinks.**

  There isn't one single common-language idiom for this, but there is a robust cluster of terms in decision theory, philosophy of science, and epistemology that map exactly onto what you're describing.

  ### 1. The Technical Name: "Unawareness" (vs. Uncertainty)
  In decision theory and economics, the distinction you are drawing is formally recognized as the difference between **Uncertainty** and **Unawareness**.

  *   **Risk:** You know the states (Safe/Harmful) and the probabilities.
  *   **Uncertainty (Knightian):** You know the states (Safe/Harmful), but you don't know the probabilities.
  *   **Unawareness:** You do not know that the state "Harmful" exists as a distinct possibility. Your model of the world does not contain that node.

  In your doctor example, standard subjective judgment assumes the doctor assigns a probability to "Harmful" (even if low). Your intuition is that for the doctor, "Harmful" isn't a probability; it's **null**. It is not in her decision matrix.

  The formal literature calls this **"State-Dependent Awareness"** or **"Endogenous State Spaces."** The evaluator (you) is working with State Space $S_1$ (which includes the danger), and the agent is working with State Space $S_2$ (which collapses those two states into one).

  ### 2. The Philosophical Name: "Unconceived Alternatives"
  In philosophy of science and epistemology, this is often discussed under the problem of **Unconceived Alternatives** (most notably by P.K. Stanford in *Exceeding Our Grasp*).

  Stanford argues that in the history of science, researchers weren't just *wrong* about which theory was true; they were often unable to conceive of the actual true theory because the conceptual vocabulary didn't exist yet.
  *   **False Belief:** "I believe the drug is safe." (The concept of 'unsafe' is available, but rejected.)
  *   **Unconceived Alternative:** "I am prescribing a drug." (The concept of 'unsafe-in-a-way-I-cannot-detect' is not available.)

  This fits your doctor example perfectly. The study hadn't reached her, meaning the *conceptual tool* to distinguish the states was absent from her local epistemic environment.

  ### 3. The Mechanism: "Coarse-Graining"
  If you want a name for the *structure* of the problem, information economists call this **Coarse-Graining of the Information Partition.**

  Imagine reality is a high-resolution image.
  *   **The Evaluator** sees individual pixels (Safe vs. Harmful).
  *   **The Agent** sees blurred blocks where those pixels are averaged into one color.

  When the resolution is too low to distinguish two states, they are not just "unknown"; they are **indistinguishable**. In information set theory (game theory), if two nodes are in the same information set, the agent *cannot* condition their action on the difference. To say they "faced a choice" between them is technically false. They faced one choice.

  ### 4. Where is the line? (False Belief vs. Different World)
  You asked where the line falls between "they had a wrong belief" and "they were in a different world." This is the crux of the normative judgment. Here is how to draw that line:

  **A. Discriminability (The "Could They Have?" Test)**
  *   **False Belief:** Evidence existed *in their environment* that would have distinguished the states, but they ignored it or processed it poorly. (e.g., The patient had a known allergy listed on the chart, and the doctor didn't check.)
  *   **Different World:** No evidence available *in principle* at that time/place could distinguish the states. (e.g., The molecular interaction was undiscovered by global science.)
  *   *Verdict:* If the distinction is empirically inaccessible, they are in a different epistemic world.

  **B. Conceptual Availability (The "Vocabulary" Test)**
  *   **False Belief:** They have the concept but apply it wrongly. (e.g., "I thought this dosage was safe.")
  *   **Different World:** They lack the concept entirely. (e.g., A 14th-century doctor cannot be negligent about "bacterial infection" because the germ theory node does not exist in their state space.)
  *   *Verdict:* You cannot be negligent about a variable that does not exist in your ontology.

  **C. Causal Relevance (The "Game Code" Test)**
  Your video game analogy is actually the most precise way to think about this.
  *   **False Belief:** The code tracks the weapon, but the guard's AI has a bug and doesn't react. (The guard *should* have reacted.)
  *   **Different World:** The code *does not track* the weapon. The variable `has_weapon` does not exist in the guard's memory.
  *   *Verdict:* If the variable isn't in the code, the guard isn't "ignoring" it. The guard is playing a different game than you are.

  ### 5. How to Judge (The Normative Upshot)
  If we accept that the agent and evaluator are working with different state spaces, how do we grade the choice?

  You grade the agent against **their** state space, provided their state space was **reasonably constructed.**

  This shifts the moral question from *"Did they choose the right action?"* to *"Was their model of the world reasonable for their position?"*

  *   **The Rural Doctor:** Her model of the world (where the drug's danger is not a distinct state) is reasonable given her access to medical literature. Therefore, she is not reckless. She is judged on how well she navigated *her* map, not yours.
  *   **The City Specialist:** If a specialist at a research hospital makes the same choice, their model *should* include the "Harmful" node because the literature is available to them. For them, it is a False Belief/Negligence, because their state space *ought* to be finer.

  ### Summary
  If you need a label to use in conversation or writing:

  1.  **Technical:** **"Unawareness"** (specifically, *unawareness of contingencies*).
  2.  **Descriptive:** **"Epistemic Coarse-Graining."**
  3.  **Philosophical:** **"Unconceived Alternatives."**

  If you want to coin a phrase for this specific puzzle of judgment, you might call it **"Ontological Mismatch"** or **"State-Space Divergence."**

  The line falls at **reasonable foreseeability**. If the distinction between the two states was not reasonably foreseeable or conceptually available to the agent, they are not operating in your world with bad info; they are operating in a simpler world with good info. To judge them by your world's state space is a category error, akin to blaming a chess piece for not moving like a queen.
