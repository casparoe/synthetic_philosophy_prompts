prompt: |-
  Ok so me and my friend have been having this arguement for about three weeks now and im asking you to settle it because she's stopped listening to me. She's a philosophy grad student who has basically absorbed Anscombe — she's got the line "choosing to kill the innocent as a means to your ends is always murder" taped above her desk — and she now runs every war question through it, including ones I invent specifically to trip her up. Here's her scorecard so far, which I've been writing down on purpose so I could catch her out later:

  - Truman and the two bombs: murder, no hedging, and she says she'd have been standing outside with a sign when they handed him the honorary degree.
  - The RAF burning out German cities night after night: murder, and she won't let the aircrew off the hook either — the men in the planes were murderers, not just the men who gave the order.
  - A raid on the rail junction at the edge of a town, where she knows civilians in the town will be killed too, but the target is the junction and the pilot would call the raid off if the civilians could be got out of the way first: not murder, just war.
  - Keeping the bomb and saying you'd use it if you got invaded: murder already, nothing has to be launched. She says you can't even have the intention, even a conditional one.
  - The clerks, the typists, the people who just paid their taxes: not murderers. Only the people whose own acts were part of the killing.

  Then last night I gave her this one and she went quiet on me, which is why im asking you. A country at war takes down the enemy's whole power grid by cyber attack at the start of winter. The point is to stop the factories that are making the weapons. That's the entire point — no punishment, no message, no trying to force anyone to the table; they'd be thrilled if the war ended tomorrow with the lights still out. But it's one grid: homes, hospitals, water pumps, the factories, all on the same wires. Everyone in the chain of command knows the blackout is going to kill people — old people in cold flats, patients on machines that need power, whatever comes out of a tap when the pumps stop — and nobody wants that. They just want the factories stopped. Murder or not?

  And then, because I couldn't help myself: what about the woman who wrote the malware? Is she one of the aircrew or one of the typists?

  Take the role of someone who actually works in this area — just war theory, the doctrine of double effect, that whole literature — and think it through properly before you answer. Do some brainstorming first, don't just hand me a verdict. What I'm actually after:

  1. Your best guess at what she says about the blackout, and the reasons for it.
  2. The rules that fit her five verdicts equally well. This is the part I care about most. Is she really running the rule she's got taped above her desk, or is her track record tracking something else — and if so, what? I have a suspicion she's not running the rule she says she is, but I can't put my finger on what she's doing instead.
  3. For each of those rules: what it says about the blackout, what it says about the malware woman, and where the rules come apart.
  4. The one case I should put to her next that would actually settle which rule she's on — something where the rules give different answers, not just a nastier version of the same thing.
  5. Skip the citations, I don't have library access and I'm not going to read the essays. And don't just tell me what Anscombe wrote, I've heard the speeches — I want to know what my friend is doing.
  6. Tell me how confident you are about all this, and single out the bit you're least sure of.
