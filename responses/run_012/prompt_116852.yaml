answer: |-
  Here is the breakdown. I'm approaching this as someone who has spent a lot of time in the weeds of Just War Theory (JWT) and specifically the Anscombian tradition. Your friend isn't just making these up; she's applying a very specific, rigorous moral framework, but you're right to suspect that the slogan on her wall is a shorthand for something more complex.

  Here is the brainstorming and analysis you asked for.

  ### 1. My Best Guess on the Blackout (and Why She Went Quiet)

  **Verdict:** She will likely call this **Murder**.

  **The Reasoning:**
  She went quiet because this case attacks the weak point in her "Rail Junction" defense. In the Rail Junction case (Case 3), she could rely on the idea that the civilian deaths were *avoidable* ("if the civilians could be got out of the way"). The pilot *would have* stopped. This proves the deaths weren't necessary for the military objective.

  In the Power Grid case, the civilians cannot be "got out of the way." You cannot move a hospital off the electrical grid. Because the military target (factories) and the civilian life-support (hospitals/heating) are on the *same wires*, disabling the military target *necessitates* disabling the civilian life-support.

  In Anscombian terms, this collapses the distinction between "side effect" and "means." If the only way to stop the factories is to stop the hospitals, then the suffering of the hospital patients is effectively a *condition* of your success. You are choosing a state of affairs (blackout) that you know entails their death. Even if you don't "want" them dead, you have chosen an act where their death is inextricably linked to your goal.

  She will likely argue that because the harm to innocents is *inevitable* and *inseparable* from the act, it counts as "choosing to kill them" even if it's not the primary motive. It violates the requirement to distinguish between combatant and non-combatant spheres.

  ### 2. The Rules: Stated vs. Actual

  You suspected she isn't running the rule taped above her desk. You are half-right. The taped rule is the *principle*, but her verdicts show she is applying a specific *interpretation* of that principle that is stricter than standard Just War Theory.

  **Rule A: The Stated Rule (Standard Doctrine of Double Effect)**
  *   **The Rule:** An act causing harm is permissible if: 1) The act itself is good or neutral, 2) The bad effect is not intended (neither as end nor means), 3) The good effect is not produced *by* the bad effect, and 4) There is proportionality.
  *   **Where it fits:** It fits the Rail Junction (Case 3) perfectly. The death is foreseen, not intended.
  *   **Where it strains:** It struggles with the Clerks (Case 5). Under standard DDE, if the clerks know their work supports murder, they are morally compromised. But she lets them off.

  **Rule B: The Actual Rule (Anscombian Formal Cooperation + Inseparability)**
  *   **The Rule:** This is what she is actually doing. It has two pillars:
      1.  **Formal Cooperation:** You are only guilty of murder if you *intend* the evil or if your specific action is the *immediate instrument* of the killing. (This explains why Clerks are safe but Aircrew are not).
      2.  **Inseparability of Harm:** If the harm to innocents is *inevitable* and *physically inseparable* from the military act (like the Grid, or the Atomic Bomb), it counts as intentional killing. You cannot claim it's a "side effect" if the side effect is guaranteed and necessary for the main effect.
  *   **Why this fits her scorecard:**
      *   **Truman/RAF:** Inseparable harm. You can't bomb the city without killing the people. -> Murder.
      *   **Rail Junction:** Separable harm. Theoretically, the train could be stopped without the people dying. -> Not Murder.
      *   **Clerks:** Not immediate instruments. They are materially cooperating, but not formally. -> Not Murder.
      *   **Deterrence:** Conditional Intent. You have the intention ready to fire. -> Murder.

  **Where the rules come apart:**
  They come apart on **Foreseen Certainty**.
  *   **Rule A (Standard DDE)** says: If you don't *mean* for them to die, and their death isn't the *method* of success, it's okay, even if you know they will die.
  *   **Rule B (Her Actual Rule)** says: If you know they *will* die and you proceed anyway because their death is tied to your success, you have effectively chosen their death.

  ### 3. Application to the Blackout & Malware Woman

  **The Blackout:**
  *   **Rule A (Stated):** Not Murder. The means is "cutting power." The death is a side effect. The factories stop because of no power, not because of dead grandmothers.
  *   **Rule B (Actual):** Murder. The death of the grandmothers is inseparable from cutting the power. You cannot achieve the goal without accepting their death as a certainty.
  *   **Prediction:** She follows Rule B. She calls it Murder.

  **The Malware Woman:**
  *   **Rule A (Stated):** Ambiguous. Did she intend the death? Maybe not. She intended to write code.
  *   **Rule B (Actual):** Aircrew. She is not a typist. A typist files a letter that *might* be used. The malware writer creates the *weapon itself*. Without her code, the grid does not fall. She is the modern equivalent of the bombardier aiming the sight.
  *   **Prediction:** She classifies her as **Aircrew** (guilty of the killing).

  ### 4. The Tie-Breaker Case

  To settle whether she is following Rule A (Means) or Rule B (Inseparable/Foreseen Certainty), you need a case where the death is **Foreseen and Inevitable** but clearly **Not a Means**.

  **The "Homeless Man Under the Bridge" Scenario:**

  > "A retreating enemy tank column is crossing a specific bridge. If they cross, they will regroup and kill 500 of your countrymen. You decide to blow the bridge to stop them.
  >
  > There is a homeless man sleeping under the bridge, in the supports. He is invisible. You know he is there. You cannot move him in time. If you blow the bridge, he *will* die. His death does not help bring the bridge down; the explosives do that. His death is not a means to stopping the tanks. It is a purely unavoidable side effect.
  >
  > Do you blow the bridge? Is it murder if you do?"

  **Why this settles it:**
  *   **If she says "Not Murder":** She is sticking to the **Taped Rule (Rule A)**. The death is not a means. It is a tragic side effect. The inevitability doesn't matter.
  *   **If she says "Murder":** She is following the **Actual Rule (Rule B)**. She believes that *knowing* an innocent will inevitably die as part of your plan makes you responsible for that death, regardless of whether it was a "means."
  *   **If she hesitates:** It shows she realizes the tension between "Inseparable Harm" (Grid) and "Pure Side Effect" (Bridge).

  This case isolates the "Means" variable from the "Foreseen Death" variable. In the Grid case, the death feels like a means because the grid is shared. In the Bridge case, the death is purely collateral. Her answer here tells you if she is a strict Absolutist on *consequences* or just on *intentions*.

  ### 5. What She Is Doing (The "Anscombe" Filter)

  You asked me not to just tell you what Anscombe wrote, but what your friend is doing.

  She is using a **moral heuristic to avoid utilitarianism.**
  She is terrified of the logic that says "Kill 1,000 innocents to save 10,000 soldiers." Once you accept that math, she believes there is no limit to the horror you can justify (which is why she hates Truman).

  To protect against this, she has hardened the definition of "Intention." She treats "Known Inevitability" as "Intention."
  *   **The Typists:** They don't *know* their specific paper will kill someone. They are shielded by distance.
  *   **The Aircrew:** They *know* the bomb kills people. They are the direct link.
  *   **The Grid:** They *know* the blackout kills people. They are the direct link.

  She is essentially saying: "If you pull the trigger knowing the bullet *must* hit an innocent, you intended to hit the innocent, even if you were aiming at someone else."

  ### 6. Confidence Assessment

  **Overall Confidence:** High (85%).
  Her track record is extremely consistent with a specific, hardline interpretation of the Doctrine of Double Effect common in Oxford-style analytic philosophy. The pattern of "Aircrew = Guilty, Clerks = Innocent" is a classic marker of this school of thought (distinguishing formal vs. material cooperation).

  **Least Certain Aspect:** The Malware Woman.
  This is the one place I'm less sure. Some strict Anscombeans might argue that writing code is still "preparation" and not "execution," potentially putting her closer to the clerks than the pilots. However, given the "cyber" nature of the attack where the code *is* the weapon, the stronger argument (and the one that fits her "Aircrew" verdict on the bombers) is that she is a combatant. If your friend lets the malware writer off, it would reveal that her line for "direct participation" is drawn at physical presence, not causal necessity.

  **Final Advice:**
  Don't ask her the Bridge question immediately. Ask her about the Malware Woman first. If she says the woman is a murderer, her barrier for "direct involvement" is low. If she says she's innocent, her barrier is high. That will tell you how she'll handle the Bridge case before you even ask it.
