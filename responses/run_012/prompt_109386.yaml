prompt: |-
  OK so I'm a novelist, I'm about two hundred pages into a book that's basically a custody fight over a bronze head, and I've realized I don't actually have a theory of who should get it, I just have vibes and a stack of books. Before I write another scene I want the spec sheet, not the argument.

  So: put on the hat of a legal philosopher who actually works on cultural heritage and property, and take this slow. Before you write anything, brainstorm out loud for a bit — list the cases you think a real theory would have to survive, including the ugly ones — because I'd rather watch you find the hard cases than get a tidy list that skipped them.

  What I want is this. If I'm going to call a theory of "who owns the past" adequate — something that tells me when a museum should hand an object back and when it should keep it — what does it have to deliver? Which cases must it get right, which puzzles must it dissolve, which distinctions must it refuse to collapse? For each requirement, give me the case or consideration that puts it on the list, so I can see why it's a requirement and not just taste.

  The cases I keep tripping over, roughly: the clean ones (stuff taken in a war, no paperwork, obviously looted — Benin, the marbles, whatever); the filthy ones (bought openly and lawfully under the law *at the time*, and that law was the colonial law, so the sale was "valid" and coerced at once); objects that changed hands three times before the museum ever saw them, including a local ruler who'd taken them off someone else in an earlier war; objects whose source community no longer exists, or is now split in two and both halves claim it; and the ones where nobody can prove a thing about provenance either way.

  The distinctions I don't want it to flatten: legal title versus custody/guardianship; individual property versus group cultural heritage versus the "heritage of humanity" line the big museums run; restitution versus repatriation versus reparation (these are not the same move and I keep catching myself using them interchangeably); and the object's meaning in its original setting versus its meaning in a vitrine.

  Constraints it can't just wish away: that the acquisition was often legal when it happened; that cultures aren't frozen and the "source community" of 1897 isn't the one asking now; that these museums are, at least on paper, trustees for a global public; and that for a lot of objects the provenance is genuinely, permanently unknown.

  Then two things I really care about. First, tell me which of these are genuine desiderata and which are just one camp's prejudice dressed up as a requirement — and flag any pair you think *can't* be jointly satisfied. My money's on the rule-of-law / repose side colliding with the correct-the-injustice side, and on group cultural rights colliding with the fact that groups argue with themselves; tell me if I'm wrong. Second, which single requirement does the most work, i.e. knocks out the most popular theories on its own.

  And at the end, briefly, no more than a paragraph each, how the usual suspects do against your list: the universal-museum view, the cultural-nationalist view, the return-anything-with-a-tainted-chain view, and the stewardship/guardianship view. Brief — the list is the thing I'm paying for.

  Don't send me a reading list, I've got enough books. Just the spec.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Role:** Legal philosopher specializing in cultural heritage and property.
      *   **Task:** Create a "spec sheet" for a theory of ownership of the past (who gets the bronze head).
      *   **Tone:** Slow, brainstorming out loud first, then structured. No reading lists.
      *   **Key Inputs:** The user is a novelist 200 pages in. They need to resolve the theoretical underpinning of the custody fight. They have specific "hard cases" (looted, legally bought under coercion, chain of custody issues, extinct/split communities, unknown provenance). They have specific distinctions they want preserved (title vs. custody, individual vs. group vs. humanity, restitution vs. repatriation vs. reparation, original meaning vs. vitrine meaning).
      *   **Specific Constraints:** Must address the "legal at the time" issue, cultural change, museum trusteeship, and unknown provenance.
      *   **Specific Outputs:**
          1.  Brainstorming out loud (hard cases).
          2.  The Spec Sheet (requirements with justifying cases).
          3.  Analysis of Desiderata vs. Prejudice (and impossible joint satisfactions).
          4.  The "Single Requirement" that does the most work.
          5.  Brief evaluation of usual suspects (Universalist, Nationalist, Tainted-Chain, Stewardship).

  2.  **Brainstorming Out Loud (The "Hard Cases"):**
      *   I need to channel a philosopher who is tired of easy answers.
      *   *Case 1: The Benin Bronzes.* Clear looting. Easy return? But what if the Oba sells one next year to buy a jet? Does the theory allow resale?
      *   *Case 2: The "Legal" Purchase.* Lord Elgin type stuff, or German museums buying from colonial admins. Legal then, illegitimate now. A theory based solely on *current* morality ignores rule of law. A theory based solely on *past* law ignores justice.
      *   *Case 3: The Chain of Custody.* Object stolen by Warlord A, sold to Warlord B, sold to Dealer C, bought by Museum. Warlord B's descendants want it back. Do they have a claim better than the Museum? What about the original owner from 300 years ago?
      *   *Case 4: The Ghost Community.* The civilization is gone. The modern nation-state claims them as ancestors. Do they get it? What if a religious cult claims them?
      *   *Case 5: The Split.* The tribe split. Half want it back for ritual burial (destroying the object's public access), half want it in a museum for education. Who speaks for the culture?
      *   *Case 6: The Unknown.* No papers. Maybe looted, maybe gifted. Burden of proof? If the museum can't prove clean title, do they lose? Or does the claimant have to prove theft?
      *   *Case 7: The "Better Home".* The source country has a war zone. The museum has climate control. Does safety trump ownership?

  3.  **Drafting the Spec Sheet (The Requirements):**
      *   I need to translate the brainstorm into formal requirements.
      *   *Requirement 1: Non-Retroactive Criminalization vs. Corrective Justice.* (The "Legal at the Time" problem).
      *   *Requirement 2: The Continuity Problem.* (The "Ghost Community" problem).
      *   *Requirement 3: The Authority Problem.* (The "Split Community" problem).
      *   *Requirement 4: The Provenance Fog.* (The "Unknown" problem).
      *   *Requirement 5: The Function/Teleology.* (The "Meaning" problem - ritual vs. vitrine).
      *   *Requirement 6: The Third-Party Reliance.* (The "Chain of Custody" problem).

  4.  **Analyzing Desiderata vs. Prejudice & Impossible Conflicts:**
      *   *Prejudice:* "Rule of Law" is often a shield for theft. "Cultural Heritage" is often a shield for nationalism.
      *   *Conflict:* Finality (Repose) vs. Justice (Restitution). You can't have both perfectly.
      *   *Conflict:* Group Rights vs. Internal Dissent. Who speaks for the group?
      *   *Conflict:* Preservation vs. Access/Use. If the object must be destroyed for ritual, does the "Humanity" claim override?

  5.  **Identifying the "Single Requirement" (The Killer Constraint):**
      *   What kills the most theories?
      *   Is it Provenance? No, too messy.
      *   Is it Legality? No, ignores morality.
      *   *Idea:* The **Authority/Continuity Constraint**. (Who speaks for the past, and are they the same people?) This kills simple Nationalist views (states $\neq$ cultures) and simple Moral views (who is the "victim" now?).
      *   *Alternative:* The **Non-Destruction/Stewardship Constraint**. If the theory allows the object to be destroyed (ritual burial) but the museum says "Humanity owns this," that's a hard clash.
      *   *Selection:* The **Continuity of Interest** requirement. It forces the theory to define *why* the past matters to the present claimant. If the link is broken, the claim fails. This knocks out pure nationalist claims and pure "finders keepers" claims.

  6.  **Evaluating the Usual Suspects:**
      *   *Universal Museum:* Fails on Justice/History.
      *   *Cultural Nationalist:* Fails on Continuity/Internal Dissent.
      *   *Tainted Chain:* Fails on Repose/Third Parties/Provenance Fog.
      *   *Stewardship:* Fails on Ownership/Agency (paternalistic).

  7.  **Refining the Tone:**
      *   Needs to sound like a philosopher thinking *with* the writer.
      *   Avoid academic jargon where possible, but keep the precision.
      *   Ensure the "Brainstorm" section feels like a process, not a list.
      *   Check constraints: "Brief" on the evaluations. "No reading list."

  8.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I distinguish Restitution vs. Repatriation?
      *   *Correction:* Make sure that shows up in the distinctions section.
      *   *Check:* Did I address the "Legal at the time" constraint?
      *   *Correction:* Ensure Requirement 1 handles the intertemporal law issue.
      *   *Check:* Is the "Single Requirement" clearly argued?
      *   *Correction:* Make sure I explain *why* it knocks out other theories.
      *   *Check:* Did I brainstorm out loud *before* the spec?
      *   *Correction:* Yes, start with the "Scratchpad" section.

  9.  **Final Polish:**
      *   Ensure the distinction between "Title" and "Custody" is clear.
      *   Make sure the "ugly cases" are explicitly mentioned in the brainstorm.
      *   Keep the novelist's goal in mind: they need to resolve a plot point about a bronze head. The theory needs to be actionable for a character.

  *(Self-Correction on the "Single Requirement")*: I initially thought about Continuity. But actually, the **Burden of Proof in the Fog** is often the practical killer. However, philosophically, the **Continuity/Identity** problem is the deeper theoretical sinkhole. I will stick with Continuity/Identity as the "Single Requirement" because it addresses the "source community no longer exists" constraint directly.

  *(Refining the "Prejudice" section)*: I need to be careful not to just say "both sides are biased." I need to identify which *requirements* are actually disguised political positions. For example, "Security of Title" is often a proxy for "Keep what we have." "Historical Justice" is often a proxy for "Nationalist Agendas."

  Let's write it.cw
answer: |-
  ### Scratchpad: The Hard Cases

  Okay, let's clear the desk. I'm not going to give you the answer yet. I'm going to walk through the minefield with you. If your theory can't survive these specific scenarios, it's not a theory; it's a slogan.

  1.  **The "Legal Theft" Case:** A colonial officer buys a sacred mask from a starving village chief in 1905. The price was market rate *for that time and place*, the paperwork is perfect, the colonial law authorized the transaction. The chief's great-grandson wants it back.
      *   *The Trap:* If your theory says "Law is Law," you legitimize coercion. If your theory says "Morality Trumps Law," you destabilize every property right in history. Where is the statute of limitations on injustice?
  2.  **The "Hot Potato" Chain:** Object stolen from Temple A by General B in 1800. Sold to Dealer C in 1850. Donated to Museum D in 1950. Temple A's successors want it. General B's heirs claim it's their private property inheritance.
      *   *The Trap:* Does the taint of the original theft wash away after three good-faith purchasers? If yes, you reward laundering. If no, no museum can ever sleep safely, and the art market freezes.
  3.  **The "Ghost" Community:** The civilization that made the bronze head is extinct. The modern nation-state claims it as "national heritage." A neo-religious movement claims it as "sacred." The local university claims it as "archaeological data."
      *   *The Trap:* "Culture" isn't a monolith. If you return it to the State, are you returning it to the people or the bureaucracy? If the culture is dead, does the object become "Humanity's" by default?
  4.  **The "Split" Claim:** The tribe exists but is fractured. Faction X wants the head for ritual burial (it disappears forever). Faction Y wants it for a tribal museum (public access). The Museum Z says "We hold it for all humanity."
      *   *The Trap:* Who has standing to speak for the culture? If you privilege Faction X, you destroy the object. If you privilege Museum Z, you ignore the living descendants' rights.
  5.  **The "Black Box" Provenance:** We literally do not know how the museum got it in 1920. No bill of sale. No war record. Just an accession number.
      *   *The Trap:* Burden of proof. Does the museum have to prove it's *clean*, or does the claimant have to prove it's *stolen*? In the fog of history, silence usually favors the possessor. Is that fair?
  6.  **The "Better Home" Paradox:** The source country is in a civil war. The museum is climate-controlled and safe.
      *   *The Trap:* Does ownership imply the right to destroy or risk destruction? If "Humanity" has an interest, does that override the owner's right to let it rot?

  Okay. I've got the scars from those cases. Now let's build the spec sheet.

  ***

  ### The Spec Sheet: Requirements for a Theory of Cultural Property

  For a theory to be adequate, it must satisfy the following six requirements. If it fails one, it breaks on the rocks of reality.

  **1. The Intertemporal Consistency Requirement**
  *   **The Demand:** The theory must account for the validity of actions taken under past legal regimes without granting those regimes moral immunity.
  *   **The Justifying Case:** *The "Legal Theft" Case (1905 Colonial Purchase).*
  *   **Why it's a Requirement:** A theory that ignores past law is anarchic (it makes all title insecure). A theory that defers entirely to past law is unjust (it makes law a shield for predation). The theory must explain *when* a change in moral consensus overrides a past legal title.

  **2. The Attenuation of Taint Requirement**
  *   **The Demand:** The theory must define at what point a tainted origin is "cured" by subsequent transactions, or explicitly state that it never is.
  *   **The Justifying Case:** *The "Hot Potato" Chain (General B to Museum D).*
  *   **Why it's a Requirement:** If taint never expires, every museum object requires a perfect genealogy to 1700, which is impossible. If taint expires too easily, you incentivize laundering. The theory must draw a line between "possession" and "legitimate ownership."

  **3. The Continuity of Interest Requirement**
  *   **The Demand:** The theory must establish a non-arbitrary link between the original creator/context and the current claimant.
  *   **The Justifying Case:** *The "Ghost" Community (Extinct Civilization).*
  *   **Why it's a Requirement:** Modern nation-states are not ancient tribes. If the theory allows a modern government to claim anything found within its current borders regardless of cultural continuity, it becomes nationalism, not heritage law. It must distinguish *geographic* succession from *cultural* succession.

  **4. The Internal Pluralism Requirement**
  *   **The Demand:** The theory must provide a mechanism for adjudicating competing claims *within* the source community, not just between the museum and the community.
  *   **The Justifying Case:** *The "Split" Claim (Burial vs. Museum).*
  *   **Why it's a Requirement:** Cultures argue. A theory that treats "The Source Community" as a single voice is fiction. It must decide if the right belongs to the *object* (to be preserved), the *elders* (to decide use), or the *public* (to see).

  **5. The Epistemic Fog Requirement**
  *   **The Demand:** The theory must assign a burden of proof for cases where evidence is permanently lost.
  *   **The Justifying Case:** *The "Black Box" Provenance (Unknown Origin).*
  *   **Why it's a Requirement:** Most of these disputes will never have a "smoking gun." If the theory requires certainty, it resolves nothing. It must state: In the absence of evidence, does possession win, or does suspicion lose?

  **6. The Teleological Distinction Requirement**
  *   **The Demand:** The theory must distinguish between the object as *property* (alienable, sellable) and the object as *heritage* (inalienable, identity-constituting).
  *   **The Justifying Case:** *The "Better Home" Paradox (Safety vs. Ownership).*
  *   **Why it's a Requirement:** If it's just property, the owner can let it burn. If it's heritage, the owner may have a duty to preserve it. The theory must explain if the museum holds *title* (ownership) or *custody* (stewardship), because these dictate different outcomes when the object is at risk.

  ***

  ### Desiderata vs. Prejudice & The Impossible Conflicts

  You asked me to flag which of these are genuine needs and which are disguised political preferences.

  **The Prejudices:**
  *   **"Rule of Law / Repose"** is often dressed up as Requirement 1 (Intertemporal Consistency), but frequently it is just a preference for the status quo. It argues that *certainty* is more valuable than *correctness*. That is a political choice, not a logical necessity.
  *   **"Historical Justice"** is often dressed up as Requirement 3 (Continuity), but frequently it is just nationalism. It assumes the modern state is the rightful heir to all antiquity within its borders. That is a political choice, not a historical fact.

  **The Impossible Joint Satisfactions:**
  You were right to bet on the collisions. Here are the two pairs that cannot be fully satisfied simultaneously:

  1.  **Finality vs. Corrective Justice:** You cannot have a system where titles are secure (Finality) and a system where every historical wrong is righted (Corrective Justice). If you prioritize Finality, some injustices remain unaddressed. If you prioritize Justice, no title is ever secure. A theory must pick a priority; it cannot promise both.
  2.  **Group Rights vs. Internal Liberty:** You cannot have a system that grants rights to "Cultural Groups" to reclaim objects and a system that guarantees individual members of that group the right to dissent. If the Group gets the head, the faction that wanted it sold or displayed publicly loses. Recognizing group agency inevitably suppresses internal minority views.

  **The Single Requirement That Does The Most Work:**
  **Requirement 3: The Continuity of Interest.**

  This is the killer. It knocks out the most popular theories on its own.
  *   It kills **Cultural Nationalism** because modern borders rarely match ancient cultural zones (e.g., Greece claiming Macedonian gold that wasn't "Greek" in the classical sense).
  *   It kills **Universalism** because it denies the premise that "Humanity" is a coherent claimant with a stronger link than the descendants.
  *   It kills **Finders Keepers** because it demands a link beyond mere possession.

  If your theory cannot define *what survives of the past that belongs to the present*, it fails. Most theories wave a hand at this. If you force your characters to grapple with *why* the claimant deserves the head (blood? geography? care? usage?), you solve the plot.

  ***

  ### Evaluation of The Usual Suspects

  **The Universal-Museum View (The "Encyclopedia" Model)**
  *   *Performance:* Fails Requirement 3 (Continuity) and 4 (Internal Pluralism).
  *   *Verdict:* It argues that "Humanity" is the true owner, housed in great capitals. It dissolves the distinction between looted and bought. It works for preservation but fails on justice. It treats the source community as a supplier, not a stakeholder. In your novel, this is the Museum Director's argument: "We saved it for the world."

  **The Cultural-Nationalist View (The "Source Nation" Model)**
  *   *Performance:* Fails Requirement 3 (Continuity) and 2 (Attenuation).
  *   *Verdict:* It assumes the modern state is the heir to all antiquity within its borders. It ignores that the "nation" might be a colonial construct itself. It demands return based on geography, not cultural link. In your novel, this is the Government Official's argument: "It is our blood and soil."

  **The Return-Anything-With-A-Tainted-Chain View (The "Moral Purist" Model)**
  *   *Performance:* Fails Requirement 2 (Attenuation) and 5 (Epistemic Fog).
  *   *Verdict:* It argues that any historical coercion invalidates current title. It collapses the distinction between a gift under duress and a theft. It creates an infinite regress of claims that paralyzes the museum. In your novel, this is the Activist's argument: "The money was dirty, the object is dirty."

  **The Stewardship/Guardianship View (The "Trust" Model)**
  *   *Performance:* Best fit for Requirement 6 (Teleology) and 1 (Intertemporal).
  *   *Verdict:* It argues the museum holds *custody*, not *ownership*. It allows for return without admitting theft, or retention without claiming absolute right. It focuses on who can care for the object's *meaning* best. It is the most flexible but the most paternalistic. In your novel, this is the Curator's compromise: "We don't own it; we look after it until the time is right."
