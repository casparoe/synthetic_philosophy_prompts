  ### My Credence: 0.35
  **(Probability that Mary learns a new *propositional fact* about the world)**

  I lean toward your friend (0.2), but I assign higher probability than them to the possibility that our current physicalist frameworks are missing something about concept possession. The "Button Variant" actually lowers the probability of a "new fact" compared to the standard thought experiment, because it removes the inferential gap between external stimulus and internal state; Mary knows exactly which physical state she is inducing.

  ### Decomposition of the Credence

  Here is how much of my final 0.35 rides on five specific sub-questions. For each, I give the probability that the answer *supports* the "Yes, she learns a new fact" position, and a one-line justification.

  1.  **Metaphysical Grounding (0.20 contribution):**
      *   *Prob:* 0.25 that Physicalism is false.
      *   *Rationale:* If property dualism is true, the neural state is not identical to the experience, so instantiating it reveals a non-physical fact.
  2.  **Phenomenal Concepts (0.10 contribution):**
      *   *Prob:* 0.40 that phenomenal concepts are irreducible *and* propositional.
      *   *Rationale:* Even if physicalism is true, if phenomenal concepts cannot be deduced from physical concepts, she gains a new mode of presentation that might count as a fact.
  3.  **Propositional Status (0.15 contribution):**
      *   *Prob:* 0.30 that "knowing what it's like" is knowledge-that rather than knowledge-how.
      *   *Rationale:* If the Ability Hypothesis is correct, she gains no new fact, only new capacities to imagine/recognize.
  4.  **Indexicality (0.05 contribution):**
      *   *Prob:* 0.50 that indexical knowledge ("*this* is red") counts as a fact about the world.
      *   *Rationale:* If the new knowledge is merely self-locating or indexical, many physicalists argue it adds no new objective worldly information.
  5.  **Button Transparency (−0.15 contribution):**
      *   *Prob:* 0.10 that the button fails to close the epistemic gap.
      *   *Rationale:* Since she knows the button causes State N, and knows State N physically, the causal chain is transparent; this variant makes learning a "new fact" *less* likely than in the standard case.

  **How they combine:**
  I treat the "No New Fact" hypothesis (Physicalism + Ability/PCS) as the baseline (0.65). I add probability mass for each "leak" in the physicalist dam.
  $0.65 \text{ (Baseline Physicalism)} - 0.20 \text{ (Dualism Risk)} - 0.10 \text{ (Concept Gap)} - 0.15 \text{ (Ability Hypothesis Failure)} + 0.05 \text{ (Indexical Ambiguity)} - 0.15 \text{ (Button Transparency)} \approx 0.35 \text{ (Final 'Yes Fact' Credence)}$.
  *(Note: This is a heuristic weighting, not a strict Bayesian network, reflecting the overlapping dependencies between metaphysics and epistemology.)*

  ### Least Confident Term
  **Phenomenal Concepts (0.40).**
  I am least confident about whether the Phenomenal Concept Strategy (PCS) successfully explains away the intuition of a new fact without denying the intuition itself.
  *   **What would move it:** A rigorous demonstration that one can possess the physical concept of "pain" or "redness" without possessing the phenomenal concept, *and* that this gap is purely linguistic/conceptual rather than ontological. If neuroscience can show that activating the "physical concept" neural network *necessarily* activates the "phenomenal concept" network in a way that precludes Mary's ignorance, my credence in "New Fact" drops to <0.10.

  ### Where You (0.65) and Your Friend (0.2) Disagree
  You likely disagree on the **Propositional Status** and **Metaphysical Grounding**.

  *   **You (0.65):** You likely treat the *experience itself* as evidence that the physical description was incomplete. You probably view the button not as a known causal trigger, but as a delivery mechanism for a non-physical property (qualia) that the physical description failed to capture. You weigh the "what it's like" intuition as a direct insight into ontology.
  *   **Your Friend (0.2):** They likely subscribe to the **Ability Hypothesis** or a strong **Phenomenal Concept Strategy**. They argue that because Mary knows exactly which button press causes which neural state, and she knows that neural state exhaustively, pressing the button adds no new *information*, only a new *relation* (acquaintance) to information she already possessed. They view the "new fact" intuition as a confusion between knowing a fact and grasping a concept.

  **The Pivot:** The Button Variant is the wedge. Your friend thinks the button makes the physical connection too obvious to deny entailment. You think the button proves that the physical connection *doesn't* entail the experience until it is actually felt.
