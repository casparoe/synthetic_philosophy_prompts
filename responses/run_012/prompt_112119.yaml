answer: |-
  ### A Map of the Dispute

  To understand why this argument spins in circles, we must stop treating it as a single line of battle. It is not. It is a triangulation of three distinct tensions. If you plot the positions of the critics and defenders, they are not standing on opposite sides of one trench; they are occupying different vertices of a triangle and shouting across the middle.

  1.  **The Logical vs. The Methodological:** On one axis, the dispute is about the *syntax* of the theory. Is the statement "the fittest survive" analytically true (true by definition) or synthetically true (true by fact)? On the other axis, it is about the *practice* of biology. Do evolutionary biologists actually risk their reputations on predictions, or do they engage in post-hoc storytelling? Popper oscillated between these two. When he called it metaphysical, he attacked the logic. When he withdrew, he acknowledged the methodology.
  2.  **The Core vs. The Periphery:** On this axis, the disagreement is about what "Darwinism" refers to. Is it the abstract engine (variation + inheritance + differential reproduction)? Or is it the specific claim that this engine drives most macro-evolutionary change? Critics attack the engine as a tautology; defenders point to the vehicle built from the engine and say, "Look, it moves."
  3.  **Physics-Envy vs. Historical Science:** The deepest axis. Popper's demarcation was forged in the fires of Einsteinian physics, where universal laws yield precise predictions. Biology, particularly evolutionary biology, is often historical and contingent. The dispute is frequently a proxy war over whether biology must look like physics to be science.

  Most participants argue on Axis 1 while assuming they agree on Axis 2, or they argue on Axis 2 while pretending Axis 3 doesn't exist. This is why no ground is gained.

  ### Diagnosis: Categorial Confusion

  Your working hypothesis is correct, but it understates the structural problem. The dispute is **categorially confused**. It is not merely verbal, nor is it purely substantive. It is a case of applying a tool designed for one category of knowledge (universal law-statements) to a different category (framework theories).

  The crux lies in your second equivocation: the object of appraisal.
  When Popper claimed natural selection was metaphysical, he was treating the **Principle of Natural Selection (PNS)** as a standalone hypothesis. Taken in isolation ("those who survive are those fit to survive"), he was logically right: it is a tautology. It defines fitness by survival.
  When defenders claim it is testable, they are referring to **Evolutionary Theory (ET)** as a whole—the PNS plus specific assumptions about heredity, variation, environmental pressure, and trade-offs. Taken as a package, it is empirically rich. It forbids complex adaptation without history; it forbids fossils appearing in the wrong strata; it forbids organisms having traits that reduce reproductive success without a compensating benefit.

  The critics know this, which is why they retreat to the **Duhem-Quine problem**: any failed prediction can be saved by tweaking auxiliary assumptions (e.g., "We didn't find the fossil because the record is incomplete," or "The trait looks maladaptive but was linked to a beneficial one").

  So, where is the real disagreement? It is not about whether biology is science. Both sides agree it is. The disagreement is about **explanatory autonomy**.
  *   **The Critics** want to know if the *core mechanism* can be isolated and falsified on its own. They fear that if the core is a tautology, the whole enterprise rests on a linguistic trick.
  *   **The Defenders** argue that the core *cannot* be isolated. It is a framework, like Newton's Second Law ($F=ma$). $F=ma$ is also schematic; it tells you nothing until you specify the forces. We do not call Newtonian mechanics metaphysical because $F=ma$ is empty without force laws. We shouldn't do so for Darwinism.

  Therefore, the dispute is substantive only insofar as it reveals a disagreement about how framework theories function. It is verbal insofar as both sides use "falsifiable" to mean different things: the critics mean "logically contingent," the defenders mean "empirically productive."

  ### The Deeper Disagreement: Laws vs. Mechanisms

  Underneath this lies a profound ontological disagreement about biology. Popper's falsifiability criterion presupposes the existence of **strict universal laws**. If a theory is scientific, it should say, "Under conditions C, event E *must* happen." If E does not happen, the theory is dead.

  Evolutionary biology rarely deals in "must." It deals in "tends to," "can," and "likely will," contingent upon historical context.
  *   **The Deep Conflict:** Can a science based on **mechanisms** rather than **laws** meet the demarcation criterion of a philosophy based on **laws**?
  *   **The Schematic Problem:** You asked if a theory that borrows content from auxiliary assumptions can be empirical. In physics, we say yes (Newton). In biology, critics say no, because the auxiliary assumptions in biology (genetics, ecology, development) are often as complex and uncertain as the theory itself.

  The deeper disagreement is about **historical narrative**. If evolutionary explanation is fundamentally historical (reconstructing unique past events) rather than nomological (subsuming events under laws), then Popper's criterion is a category error. You cannot falsify a narrative in the same way you falsify a law. You can only find evidence that makes the narrative implausible. The critics want biology to be nomological; the defenders know it is largely historical.

  ### Path to Progress: A Commitment

  What counts as progress? We will not solve the demarcation problem here. It is too tangled. Progress consists in **dissolving the demand for the core principle to be falsifiable in isolation.**

  I commit to the following view: **The dispute should be abandoned in its current form because it misidentifies the unit of scientific appraisal.**

  We should stop asking "Is Darwinism falsifiable?" and start asking "Are evolutionary *models* testable?"
  Progress requires a distinction between **Framework** and **Model**.
  1.  **The Framework (PNS):** This is indeed近乎 tautological. It defines the space of possible biological explanations. It is not directly falsifiable, nor does it need to be. It is a constitutive principle, like "every event has a cause" in physics. It guides research; it does not make predictions on its own.
  2.  **The Model:** This is the Framework + Specific Auxiliaries (e.g., "Beak depth in these finches is heritable and correlates with seed hardness"). *This* is falsifiable. *This* is where the risk lies.

  **Concrete Proposal:**
  The progress you are looking for comes from adopting a **model-based view of testing**. When a critic says, "Darwinism explains everything and therefore nothing," the response should not be to defend the tautology. It should be to say: "You are attacking the Framework. Science happens in the Models. Show me a Model that fails."

  If a specific model of adaptation fails (e.g., we find a complex trait that definitely reduces fitness and has no compensating benefit, and we cannot adjust the auxiliaries without breaking independent laws of genetics), then that *model* is falsified. If enough models fail, the Framework loses utility. But the Framework itself is not a hypothesis; it is a lens.

  **Why this resolves the stalemate:**
  It grants the critics their logical point (the core schema is empty without content) without conceding the substantive point (that evolutionary biology is unscientific). It grants the defenders their methodological point (the work is risky and empirical) without forcing them to defend the indefensible (that "survival of the fittest" is a contingent truth).

  **Final Verdict:**
  The dispute is a relic of logical positivism trying to govern a historical science. As a biologist, you know that your work is not about verifying a universal law of selection, but about constructing robust causal narratives for specific lineages. The philosophy should catch up to the practice. Stop trying to make the Principle of Natural Selection stand trial. Put the Models in the dock. That is where the evidence lives, and that is where the risk is real.
