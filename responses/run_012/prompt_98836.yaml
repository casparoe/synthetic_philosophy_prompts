answer: |-
  The air in the Chamber of the Urn was always kept at a precise eighteen degrees Celsius. It was not for the comfort of the spectators, who sat in tiered rows behind the glass, but for the machinery. The Lottery Machine was a gravity-fed tumbling drum, a sphere of polished borosilicate glass containing three million ceramic balls. Each ball bore the RFID chip of a citizen eligible for service.

  Elara Vance stood on the observation gantry, her tablet pressed against her chest. As the Senior Actuary of the Sortition Commission, her job was not to watch the balls tumble—that was for the cameras and the public—but to watch the numbers. She monitored the entropy. She watched the randomness.

  Today was the Draw for Cycle 89. The city-state of Ostrara had been running the Civic Assembly for sixty years, three generations of governance by lot. There were no elections. There were no parties. There was only the Urn, and the Law of Large Numbers.

  Elara watched the mechanical arms churn the spheres. They clacked against each other, a sound like dry rain. On her tablet, the eligibility pool statistics scrolled in real-time.

  *Total Population: 4.2 Million.*
  *Eligible Pool: 2.1 Million.*
  *Variance: 0.0004%.*

  The variance was green. The draw was mathematically pure. When the arm dipped and selected the first ball, then the second, then the five hundredth, Elara felt the familiar wash of relief. The ritual held. The faith held.

  But as the ceremony concluded and the newly selected Citizens were led away to their orientation, Elara did not leave the gantry. She stayed until the cleaning crew began to wipe the glass, until the hum of the climate control was the only sound left. She opened a hidden partition on her tablet and pulled up a different dataset. It wasn't the data of the draw. It was the data of the Urn.

  For six months, Elara had been running a longitudinal audit on the eligibility pool itself. The Sortition Commission's mandate was to ensure the *draw* was fair. No one had explicitly tasked her with ensuring the *pool* remained representative of the populace. It was assumed that the pool was a static reflection of the census, pruned only for age and criminal record.

  It was not.

  The pool was drifting.

  It wasn't a sudden shift. It was a slow, glacial migration, invisible to the naked eye but screamingly obvious in a regression analysis spanning three decades. The demographic makeup of the eligible citizens—the people whose balls were actually in the Urn—had diverged from the demographic makeup of Ostrara.

  Elara traced the anomaly back. It wasn't fraud. There was no rigging of the chips, no deletion of names. The randomness of the selection was perfect. But the container of that randomness had been reshaped, year by year, by the very people the lottery selected.

  She took the lift down to the archives, the silence of the tower pressing against her ears. She needed to speak to Julian.

  ***

  Julian Thorne was the former Head of the Commission, now retired to a consultancy role that mostly involved writing memoirs about the beauty of stochastic governance. He lived in the Old Quarter, in a house that predated the Lottery, with walls of actual stone rather than polymer.

  He poured her tea before she could sit. "You look like you've seen a ghost, Elara. Or a duplicate ball."

  "The draw was clean," Elara said, accepting the cup. "Cycle 89 passed all integrity checks."

  "Then why are you here?"

  "Because the Urn is lying."

  Julian paused, the teapot hovering over his own cup. He set it down slowly. "The Urn is a machine, Elara. It doesn't lie. It calculates."

  "The input is corrupted." She slid her tablet across the stone table. "Look at the eligibility density map. Compare the census of Cycle 60 to the eligibility roll of Cycle 89."

  Julian put on his reading glasses. He swiped through the graphs. His brow furrowed. He was a man who had spent his life defending the system, but he was also a mathematician. He knew the shape of truth.

  "The participation rate among the service sector has dropped by forty percent," Julian murmured. "And the eligibility rate among the professional class has increased by fifteen."

  "It's not participation," Elara corrected. "It's eligibility. They aren't opting out. They are being filtered out before they even get a ball."

  Julian leaned back, the leather of his chair creaking. "Explain the mechanism."

  Elara took a breath. This was the part she had rehearsed in her head a thousand times, yet it felt absurd to say aloud. "The Assembly has the authority to set the terms of service. It's in the Founding Charter. To ensure the Assembly can function, they set the compensation, the schedule, and the exemptions."

  "Standard procedure," Julian said.

  "Right. But look at the amendments. Cycle 42. The 'Civic Competence Act.' The Assembly decided that to vote on complex infrastructure bills, members needed a baseline understanding of municipal finance. They instituted a mandatory two-week pre-service training."

  "Reasonable," Julian said. "We had assemblies struggling to understand bond measures."

  "It's unpaid training," Elara said. "And it's during working hours."

  Julian stopped. He looked at the data again.

  "Cycle 45," Elara continued, her voice tightening. "The 'Hardship Mitigation Protocol.' The Assembly recognized that the stipend, while generous, didn't cover the loss of career momentum for high-specialization fields. They created an exemption for 'Critical Economic Contributors.' If your employer certifies that your absence would cause disproportionate economic harm, you are exempted from the pool."

  "To protect the economy," Julian said softly.

  "To protect the investors," Elara countered. "Who defines 'disproportionate harm'? The Assembly. Which is made of people who just got exempted from having to understand the definition."

  She leaned forward. "Cycle 50. The 'Family Stability Clause.' If you are the primary caregiver for a dependent, you can opt out. Originally, this meant minor children. Cycle 65 expanded it to include elderly parents. Cycle 72 expanded it to include 'any household member requiring regular medical supervision.'"

  "Compassionate policy," Julian said, but he sounded like he was trying to convince himself.

  "It creates a selection bias," Elara said. "The poor work hourly jobs. They can't afford the unpaid training. They are filtered out by Cycle 42. The wealthy and the specialized have their employers certify them as 'Critical.' They are filtered out by Cycle 45. The working class with families are filtered out by Cycle 72."

  "So who is left?" Julian asked. He already knew the answer.

  " The secondary earners. The salaried middle management whose companies allow leave. The retired. And the truly wealthy, who don't need the stipend and don't have 'employers' to certify them as critical." Elara tapped the screen. "The Urn is still random, Julian. But it's random only within a specific stratum. We aren't selecting a representative sample of Ostrara anymore. We're selecting a representative sample of the people who can afford to be governed."

  Julian took off his glasses. He rubbed the bridge of his nose. "You've shown this to the Commission?"

  "No. I came to you."

  "If you publish this," Julian said, staring at the steam rising from his tea, "you don't just criticize a policy. You undermine the legitimacy of the last twenty years of legislation. Every law passed by Cycle 60 through 89 rests on the premise that the Assembly was the Voice of the People. If the Voice was actually the Voice of the Comfortable..."

  "Then the laws are tainted."

  "Then the Restorationists win."

  The Restorationists were the political party that wanted to bring back elections. They were fringe, mostly, kept at bay by the sheer moral weight of the Lottery. They argued that elections allowed for accountability, that sortition was abdication. If Elara proved that the sortition pool had been endogenously corrupted—that the Assembly had quietly gerrymandered the population itself—the Restorationists would have the ammunition they needed to demand a constitutional convention.

  "They'll say we knew," Julian said. "They'll say the Commission was complicit."

  "We didn't know," Elara said. "That's the point. The drift is emergent. No single Assembly set out to rig the system. They just made reasonable adjustments to make the job easier for the people doing it. They optimized for efficiency. They optimized for compassion. They optimized for economic stability. And in doing so, they optimized out the friction that makes representation real."

  Julian stood up and walked to the window. Outside, the city of Ostrara glittered. It was a clean city. An efficient city. A city governed by people who had been chosen by chance, not by ambition.

  "Do you remember Cycle 54?" Julian asked.

  "The Water Rights Assembly?"

  "They passed the aquifer protection laws. Saved the valley from salinization. They were brilliant. But looking at your data... they were mostly agronomists and environmental lawyers. Because everyone else was exempted as 'Critical Industry' or 'Hardship'."

  "They did a good job," Elara said.

  "They did the job of people like them," Julian said. "What about the housing codes from Cycle 70? The ones that increased the minimum square footage for rentals?"

  "Rents went up," Elara admitted. "Displacement followed."

  "Because the Assembly was made of homeowners," Julian said. "Not because they were corrupt. But because renters were more likely to be classified as 'economically precarious' and exempted to protect them from the burden of service. We protected them from the duty, and in doing so, we silenced them."

  He turned back to her. "You want to publish the audit."

  "I want to fix the pool."

  "How?" Julian asked. "To fix the pool, you need an Assembly to pass a rule restoring the old eligibility criteria. But the current Assembly benefits from the new criteria. They are the ones who can afford to serve. Why would they vote to dilute their own power?"

  "That's the trap," Elara said. "The endogenous pool problem. The urn shapes the hands that reach into it."

  "So what is your solution, Actuary? Do you break the machine to save it?"

  ***

  Elara spent the next week in the deep archives of the Commission. She wasn't looking for smoking guns; she was looking for minutes. She wanted to understand the texture of the decisions that had led them here.

  She read the transcripts of the Cycle 42 debates on the Training Requirement. She expected arrogance. She found anxiety.

  *Citizen 3402:* "I voted on the sewage treatment budget last week. I didn't understand the difference between capital expenditure and operational maintenance. I felt like a child holding a loaded weapon. We need to be better."

  *Citizen 8910:* "If we require training, we exclude those who cannot read."

  *Citizen 3402:* "If we don't, we exclude those who cannot govern. Which is worse? To be excluded from the room, or to be in the room and useless?"

  They had chosen to be useful. They had chosen competence over raw representation. It was a rational choice.

  She read the Cycle 72 transcripts on the Caregiver Exemption.

  *Citizen 112:* "My mother has dementia. If I am drawn, I have to put her in a home. The stipend covers the cost, but it doesn't cover the guilt. It doesn't cover the loss of her familiar face. Is civic duty worth the destruction of the family unit?"

  *Citizen 445:* "We cannot demand martyrdom. The Lottery is meant to be a burden shared by all, not a crushing weight on the vulnerable."

  They had chosen mercy. They had chosen to protect the vulnerable from the state. It was a moral choice.

  Elara sat in the archive room, surrounded by the paper ghosts of three generations of citizens. They were all good people. They were all trying to do the right thing. And collectively, they had built a cage.

  The problem wasn't that the system was broken. The problem was that the system worked exactly as designed, but the design was evolving to suit the designers. It was evolution without natural selection. The Assembly was selecting for traits that made the Assembly easier to run, not traits that made the City better to live in.

  She thought about the Restorationists. She had met one once, at a public forum. A woman named Kaelin. Kaelin had argued that elections, for all their flaws, forced candidates to appeal to the whole population. To win a vote, you needed the poor, the rich, the worker, and the owner. You had to build a coalition across the drift.

  In the Lottery, you only had to build a coalition with the people in the room. And now, the people in the room were increasingly the same kind of people.

  If Elara published the report, Kaelin would use it. She would stand on a podium and say, *See? The Lottery was a lie. The elite have captured the Urn.* And she would be right. But she would be right in a way that destroyed the only alternative to the oligarchy the city had fought sixty years ago to replace.

  If Elara buried the report, the drift would continue. In another twenty years, the eligibility pool might be so narrow that the Assembly would be indistinguishable from a board of directors. The randomness would remain, a sacred ritual performed over a hollow core.

  There was a third option. A mechanic's option.

  She could adjust the weights.

  The Commission had the authority to tweak the RNG (Random Number Generator) parameters to ensure demographic targets were met *after* the draw. They could say, "We drew 500 names, but only 10% are service workers. We need 30%." Then they could redraw the service worker slots.

  It was technically fraud. It violated the purity of the single-draw principle. But it would correct the pool's drift. It would be a lie to preserve the truth of representation.

  Or, she could recommend a "Meta-Assembly." A one-time lottery drawn from the *original* census definitions, tasked solely with resetting the eligibility criteria. But who defines the original census? The Commission.

  She was in the knot.

  ***

  The hearing was scheduled for a Tuesday. The Commission Board was meeting to approve the Cycle 90 parameters. Elara sat at the long table, her report printed and bound in front of her. Five board members looked at her. Julian sat at the far end, his face unreadable.

  "Ms. Vance," said the Chair, a woman named Halloway who had been a teacher before her own service. "Your preliminary audit suggests a deviation in the eligibility pool. Is this a threat to the integrity of Cycle 90?"

  Elara looked at the report. She had spent the weekend rewriting the conclusion.

  "The draw integrity is secure," Elara said. Her voice sounded steady, though her hands were cold. "However, there is a long-term trend in the eligibility demographics that warrants monitoring."

  "Monitoring?" Halloway asked. "Or correction?"

  "Correction implies error," Elara said. "This is... evolution."

  Julian shifted in his seat. He knew what she was doing. She was softening the blow. She was framing a systemic collapse as a manageable variable.

  "The data shows a reduction in working-class eligibility," Halloway said, reading from her own copy. "Forty percent."

  "Due to hardship exemptions," Elara said. "Which were enacted to protect the working class from the burden of service."

  "So the protection became the exclusion."

  "It is a paradox," Elara admitted. "But it is a benevolent one."

  "Benevolence is not a metric," Halloway said sharply. "Legitimacy is."

  Elara looked around the table. These were the guardians. They believed in the Urn. If she told them the Urn was hollow, they might shatter it. If she told them it was full, they were lying.

  "I recommend," Elara said, sliding a new page toward them, "that we institute a 'Pool Diversity Adjustment.' We do not change the eligibility rules. That is the Assembly's prerogative. But the Commission can adjust the probability weights of the draw to compensate for the voluntary opt-outs."

  Halloway frowned. "You mean weighted lottery?"

  "I mean ensuring the outcome matches the census, even if the input pool is skewed."

  "That is not sortition," Julian spoke up for the first time. "That is quota-based selection masked as a lottery."

  "It is corrective justice," Elara said, meeting his eyes. "The pool is polluted. We cannot clean the source without a constitutional crisis. So we filter the output."

  "You are proposing we rig the draw to fix the urn," Julian said.

  "I am proposing we preserve the representativeness of the Assembly," Elara countered. "Legitimacy is a property of the outcome, not the mechanism. If the people look at the Assembly and see themselves, they trust the system. If they see a mirror of the privileged, they don't. How we get there is secondary."

  "It is not secondary," Julian said. "The ritual *is* the legitimacy. If they know the weights are adjusted, the magic is gone."

  "They don't need to know the weights," Elara said. "They just need to see the faces."

  The silence in the room was heavy. Halloway looked from Elara to Julian. She understood the stakes. She understood that admitting the pool was skewed would invite the Restorationists to tear the building down. She understood that rigging the draw would violate the Charter.

  "Is this legal?" Halloway asked.

  "The Charter mandates a representative Assembly," Elara said. "It does not mandate a specific algorithmic purity, provided the randomness is cryptographically verified. We can verify the randomness of the weighted draw."

  "It's a hack," Julian said. "It's a patch on a rotting foundation."

  "It's a bridge," Elara said. "Until we can figure out how to fix the foundation without bringing the roof down."

  Halloway tapped her pen on the table. "We will vote."

  The vote was three to two. The weighted adjustment was approved. It would be implemented quietly. The public would see a diverse Assembly. The mathematicians would see a fudged probability distribution. The Restorationists would see nothing, unless they dug as deep as Elara had.

  ***

  After the meeting, Elara walked out into the cool evening air. Julian caught up to her on the steps.

  "You compromised," he said.

  "I saved it."

  "You lied."

  "I balanced the equation." Elara stopped and looked up at the tower of the Commission. The lights were on in the Chamber of the Urn. The machines were always running, always tumbling, always selecting.

  "You know what happens next," Julian said. "In ten years, the weights will need to be heavier. In twenty, the pool will be so small that the weights will be obvious. You've kicked the can. You haven't solved the endogenous problem. The Assembly will still set the rules. The rules will still favor the rulers."

  "I know," Elara said.

  "Then why?"

  "Because the alternative is right now," she said. "If I published the raw data, the elections would be back within the year. And we both know who wins elections, Julian. It's not the random citizen. It's the person with the money for the ads."

  "So we choose the slow decay over the fast collapse."

  "We choose the chance to figure it out," Elara said. "Maybe in ten years, someone smarter than me will find a way to decouple the eligibility rules from the Assembly's self-interest. Maybe a Meta-Lottery. Maybe an AI guardian. I don't know. But I bought us time."

  Julian sighed. He looked old in the streetlight. "You became what you audited."

  Elara thought about that. She had entered the system to measure the truth. She had left it to manage the perception of the truth. She had optimized the rules she was allowed to touch.

  "Someone has to hold the urn," she said.

  Julian nodded slowly. He didn't agree, but he understood. "Be careful, Elara. The drift doesn't just happen to the pool. It happens to the auditors, too."

  He walked away into the shadows of the Old Quarter.

  Elara stood alone on the steps. She pulled out her tablet and opened the audit file one last time. She had a copy of the raw data, the unvarnished truth of the drift. She could release it. She could send it to Kaelin and the Restorationists. She could burn the temple down to cleanse it.

  She looked at the icon for 'Send'.

  She thought about the Cycle 42 Assembly, trying to be competent. She thought about the Cycle 72 Assembly, trying to be kind. She thought about the people who would lose their housing if the stability laws were repealed. She thought about the people who would never have a voice if the Lottery fell.

  There was no clean solution. There was only the next step, and the next adjustment, and the slow, grinding work of keeping a machine running that was designed to run itself.

  She closed the file. She deleted the copy.

  She turned and walked back toward the tower. The Chamber of the Urn was waiting. The balls needed to be cleaned. The climate control needed to be checked. The entropy needed to be monitored.

  It was not a perfect system. It was not a just system. It was, however, hers to maintain.

  As she entered the lobby, the security guard nodded to her. "Big draw coming up, Ms. Vance?"

  "Yes," she said. "Cycle 90."

  "Hope we get some good people."

  Elara looked at the glass doors, at her own reflection superimposed over the city behind her. She saw the fatigue in her eyes, the slight hardening of her mouth. She saw the drift.

  "We will," she said. "We always do."

  She walked past him, toward the lift, toward the machine that turned citizens into numbers and numbers into law. She would adjust the weights. She would file the reports. She would watch the pool narrow, and she would widen the net, just enough to keep the fish from noticing the water was gone.

  And when the time came, perhaps someone else would find the anomaly. Perhaps someone else would stand on these steps and decide whether to burn it down or patch it up.

  Until then, the Urn would turn. The balls would clack. The ritual would hold.

  Elara pressed the button for the gantry. The lift began to rise, silent and smooth, carrying her up into the heart of the randomness, where she would do her best to make sure it didn't matter.
