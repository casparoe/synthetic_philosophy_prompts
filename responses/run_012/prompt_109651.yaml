answer: |-
  You are right to be suspicious. Your friend is giving you the "hardline" version of teleosemantics, but he is presenting it as the *only* version, and he is drawing conclusions that most philosophers who work on this actually reject.

  Here is the shape of the thing, without the reading list.

  ### 1. The Core Idea (Where he is right)
  Teleosemantics says that for a mental state to be *about* something (to have "content"), it needs a job. Just like a heart is for pumping blood because that's what it was selected to do by evolution, a brain state is for representing "tiger" because it was selected to help you run from tigers.

  Your friend is correct that this ties meaning to **history**. If a state doesn't have a history of being selected for a specific function, it doesn't have "original" content. This is why he says Swampman (a molecule-for-molecule duplicate of you that pops into existence by chance) has no thoughts. Swampman has no history, so his brain states have no function, so they mean nothing. On this specific point, your friend is technically accurate to the theory: Teleosemanticists *do* bite this bullet. They say Swampman is a zombie until he learns something.

  ### 2. The "Stone Age" Claim (Where he is wrong)
  This is the part that made your beer boil. Your friend claims that because evolution is slow, you can only think about things that existed when your brain was being designed (the Pleistocene). Therefore, no thinking about phones, mortgages, or electrons.

  **This is a massive overstatement.** Most teleosemanticists do not believe we are trapped in the Stone Age. Here is the mechanism they use to get around it, which your friend likely glossed over:

  **Derived Content and Recombination**
  Teleosemantics distinguishes between *basic* content and *derived* content.
  *   **Basic Content:** These are the primitive building blocks selected by evolution. Maybe "food," "danger," "face," "grasping."
  *   **Derived Content:** You can combine these old blocks in new ways.

  Think of it like Lego. The individual bricks were made in 1980. Does that mean you can only build houses that existed in 1980? No. You can build a spaceship. The spaceship is real, even if the bricks are old.

  When you think about a "smartphone," you aren't triggering a single "smartphone neuron" that evolution selected for. You are activating a complex structure of older concepts: *tool + communication + screen + glass + social.* Evolution selected you to understand tools and social dynamics. The *combination* is new, but the *ingredients* have biological functions.

  So, the theory does not say you can't think about the internet. It says your ability to think about the internet is **parasitic** on your ability to think about older things. Your friend is treating concepts like they are pre-packaged modules rather than structures built from modules.

  ### 3. The Newborn Problem (Where he is confused)
  Your friend said newborns have no thoughts because nothing has been selected for *them* yet. This confuses **phylogenetic history** (species history) with **ontogenetic history** (individual history).

  Teleosemantics relies on the history of the *species*, not the individual. A newborn's visual cortex was selected over millions of years to process edges and motion. Therefore, a newborn *does* have content. They can see a face and represent "face." They don't need to learn it first; the machinery was pre-selected. Your friend is wrong here. A newborn has plenty of content; a Swampman has none.

  ### 4. The Disjunction Problem (Where he is muddying the waters)
  You mentioned he brought up the "disjunction problem" like it was a trump card against you. This is actually ironic, because teleosemantics was invented largely to **solve** the disjunction problem, not to create it.

  Here is the problem in a nutshell:
  If a thought is triggered by a cow, does it mean "cow"? But what if it's dark and you mistake a horse for a cow? Does the thought mean "cow-or-horse-in-the-dark"? If it means "cow-or-horse," then you never make mistakes; you're just technically right every time. But we know we make mistakes.

  Teleosemantics solves this by saying: The thought means "cow" because it was **selected for cows**. When it fires at a horse, that is a **malfunction** (error). The history fixes the meaning so you can be wrong.

  Your friend probably used this to argue that without evolutionary history, you can't distinguish between "thinking about a phone" and "thinking about a glowing rectangle." He's right that you need a function to fix the meaning, but he's wrong that the function has to be *specifically for phones*. The function can be "identify tool-like objects," and the phone fits that.

  ### 5. Is the Theory Dead?
  No, but your friend's *version* of it is unpopular.

  There is a consensus that naturalistic theories of content (explaining meaning without magic) are incredibly hard to get right. Teleosemantics is one of the leading contenders, but it has well-known holes.
  *   **The Novelty Objection:** (What you argued). How do we think about new things? (Answered by: Recombination/Derived content).
  *   **The Swampman Objection:** (What he argued). Does history matter more than structure? (Teleosemanticists say yes; others say no).
  *   **The Indeterminacy Objection:** Is the function "detect flies" or "detect small dark moving things"? (Frogs eat BBs too).

  Philosophers do not agree that "we can only think about the Pleistocene." That is a caricature. If that were true, the theory would indeed be dead, because it contradicts the obvious fact that we are discussing the internet right now.

  ### The Verdict
  You didn't miss something; your friend took a nuanced theory and stripped away the nuance to win a bar bet.

  1.  **Teleosemantics** says meaning comes from biological function.
  2.  **Your Friend** says function requires a specific evolutionary match for every object.
  3.  **Reality** says function applies to the *mechanisms* (patterns, shapes, tools), which can be recombined to represent new objects (phones, internet).

  You can think about your phone. Your brain is using Stone Age tools to do it, but the thought is still about the phone. Your friend is right that there is no "magic" ingredient that makes a thought about a phone other than the causal history of your brain, but he is wrong that this history locks you in the past.

  Tell him he's treating the brain like a museum exhibit instead of a workshop. You win the round.
