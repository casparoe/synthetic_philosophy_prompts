      *   *Claim 2 (Newborns/Swampman):* Swampman is a classic objection (Davidson). Teleosemanticists usually bite the bullet on Swampman (yes, no content) but *not* on newborns. Newborns have inherited machinery selected over generations, so they *do* have content (e.g., pain, hunger, face recognition). The friend is conflating "individual learning history" with "phylogenetic history."
