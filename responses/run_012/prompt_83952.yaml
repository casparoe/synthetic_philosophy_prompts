answer: |-
  It is entirely understandable that you have found yourself stuck on this point. The underdetermination of theory by evidence is one of the most persistent and vexing problems in the philosophy of science. It strikes at the heart of why we trust science to tell us about the world, rather than merely providing useful instruments for prediction.

  Your friend's summary is a competent piece of undergraduate revision notes, but it conflates several distinct arguments and hardens debatable interpretations into settled facts. Below, I shall audit the summary sentence by sentence, then address your own example, and finally discuss the missing distinctions and the conclusion regarding social factors.

  ### Audit of Your Friend's Summary

  **Sentence 1:** *"Underdetermination of theory by evidence is the thesis, usually credited to Duhem and Quine, that evidence can never decide between competing scientific theories."*

  *   **Verdict:** **Fair, but imprecise.**
  *   **Comment:** It is correct that Duhem and Quine are the central figures. However, attributing the exact same thesis to both is the first sign of trouble. Pierre Duhem (early 20th century) argued primarily about physics and the impossibility of crucial experiments (*experimentum crucis*). Willard Van Orman Quine (mid-20th century) radicalised this into a claim about all human knowledge. The word "never" is also too strong for many contemporary philosophers; most accept underdetermination is a problem in *some* cases, not necessarily *all*.

  **Sentence 2:** *"Because no hypothesis is ever tested on its own, but always together with a whole web of background assumptions, any theory can be made to fit any evidence by adjusting the web somewhere else."*

  *   **Verdict:** **Fair simplification of Holism.**
  *   **Comment:** This accurately describes the **Duhem-Quine Thesis** (confirmational holism). When an experiment fails, we don't know if the main theory is wrong, or if the auxiliary assumptions (about the instruments, the environment, etc.) are wrong. However, note that this sentence describes *holism*, whereas the first sentence described *underdetermination*. They are related but distinct. Holism says we can save a theory by changing background assumptions; underdetermination says there are rival theories that fit the data equally well from the start. Your friend treats them as identical, which is a common conflation.

  **Sentence 3:** *"As Quine is usually read, any belief at all can be kept, provided you are willing to revise enough elsewhere, and no belief is safe from revision."*

  *   **Verdict:** **Fair.**
  *   **Comment:** This is a faithful paraphrase of Quine's famous claim in *Two Dogmas of Empiricism*. He argued that even logical laws could be revised in the face of recalcitrant experience (though he admitted this would be drastic).

  **Sentence 4:** *"This is not a practical limitation that more data would cure: two theories can be made to fit all possible evidence, so the choice between them is ultimately a matter of convenience or taste rather than reason."*

  *   **Verdict:** **Simplification hardening into error.**
  *   **Comment:** The first clause distinguishes between *transient* underdetermination (we lack data now) and *principle* underdetermination (no data could ever decide). This is a crucial distinction your friend glosses over. The error lies in the claim that the choice is "rather than reason". Most philosophers of science argue that **theoretical virtues** (simplicity, coherence, explanatory scope, fruitfulness) are rational criteria. If Theory A and Theory B fit the data, but Theory A is vastly simpler, choosing A is not mere "taste"; it is a rational inference to the best explanation. Your friend dismisses these virtues as non-rational, which is a highly controversial stance.

  **Sentence 5:** *"That is why Quine thought we should give up on the idea that our theories are, or are on their way to being, true, and why the sociology of science later took the point to show that what scientists accept is settled by social factors rather than by the evidence."*

  *   **Verdict:** **Simply wrong (regarding Quine); Contested (regarding sociology).**
  *   **Comment:** This is the most significant error. Quine was a **scientific realist**. He did not think we should give up on truth. He believed that science is the best tool we have for describing reality, even if that description is underdetermined. He argued we should naturalise epistemology, not abandon truth. The second half of the sentence refers to the Strong Programme in the Sociology of Scientific Knowledge (SSK). While sociologists *did* use underdetermination to argue that social factors fill the gap left by evidence, this does not logically *follow* from the thesis. It is one possible explanation among others (such as rational virtues).

  ### Analysis of Your Example

  Your example is: *Take an accepted disease theory. Invent a rival that adds an extra, unobservable entity that makes no observable difference.*

  *   **Is this a case of underdetermination?** Yes, technically. This is often called a "parasitic hypothesis."
  *   **Does it capture the philosophical worry?** Not really. You have smuggled in a violation of **Ockham's Razor**.
  *   **The Missing Nuance:** Philosophers distinguish between *trivial* and *non-trivial* underdetermination.
      *   **Trivial:** Your example. We can always logically conjure a ghost variable that changes nothing. Science rejects this not because of evidence, but because of the rational virtue of parsimony (simplicity).
      *   **Non-Trivial:** This occurs when two *structurally different* theories make the same predictions but offer different explanations of the mechanism, and neither is obviously "simpler" in a way that resolves the issue. A historical example is the debate between Heisenberg's matrix mechanics and Schrödinger's wave mechanics in the early days of quantum theory. They looked different but yielded the same results. (They were later shown to be mathematically equivalent, but for a time, they represented genuine underdetermination).

  Your intuition that "there is nothing to choose between them but taste" relies on the assumption that simplicity is not a rational guide to truth. If you believe that the universe is likely to be simple rather than complex, then your choice is based on a metaphysical assumption, not mere taste.

  ### Missing Distinctions

  To unstuck your thinking, you need to separate three concepts your friend merged:

  1.  **Holism vs. Underdetermination:**
      *   **Holism:** We test clusters of beliefs, not single sentences. (Duhem/Quine).
      *   **Underdetermination:** The evidence alone is insufficient to justify belief in one theory over another.
      *   *Why it matters:* You can accept holism without accepting radical underdetermination. You might argue that while we test a web of beliefs, the web constrains us enough that only one rational configuration remains.

  2.  **Local vs. Global Underdetermination:**
      *   **Local:** At a specific moment, data is insufficient (e.g., we don't know which of three drugs works best *yet*). This is cured by more research.
      *   **Global:** For any theory, there is *always* a rival that fits all possible data.
      *   *Why it matters:* Most scientists worry about local underdetermination. Philosophers worry about global. Your friend presents global underdetermination as a settled fact, but many realists argue global underdetermination is a sceptical fantasy that ignores how theoretical virtues constrain theory choice.

  3.  **Empirical Adequacy vs. Truth:**
      *   **Empirical Adequacy:** The theory saves the phenomena (fits the data).
      *   **Truth:** The theory correctly describes the unobservable reality.
      *   *Why it matters:* Your friend claims Quine gave up on truth. In fact, a position called **Constructive Empiricism** (associated with Bas van Fraassen) suggests we should only aim for empirical adequacy. Realists argue we should aim for truth. Underdetermination is the main weapon used by empiricists against realists. But it is not a knock-down argument; it is a challenge that realists attempt to meet by appealing to inference to the best explanation.

  ### Does the Claim About Social Factors Follow?

  **No.** The claim that science is settled by social factors does not logically follow from underdetermination.

  Here is the logic your friend implies:
  1.  Evidence does not fully determine theory choice.
  2.  Therefore, something else must determine choice.
  3.  Therefore, that "something else" is social factors (politics, prestige, culture).

  **The Error:** This is a false dichotomy. The "something else" could be **rational theoretical virtues**. If a scientist chooses Theory A over Theory B because A is simpler and more coherent, they are not being swayed by social factors; they are exercising rational judgement in the absence of conclusive proof.

  The sociologists of science (the Strong Programme) *argued* that because evidence underdetermines theory, social interests *must* be the causal factor. However, this is a controversial sociological hypothesis, not a logical consequence of the philosophy. Many philosophers reject this, arguing that social factors play a role in discovery, but rational factors dominate in justification.

  ### Conclusion

  Your friend's summary is a "caricature" of the debate—useful for a quick overview, but misleading on the details.

  1.  **On Quine:** He was wrong to suggest Quine abandoned truth. Quine was a naturalist and a realist; he thought science was our best guess at reality, underdetermination and all.
  2.  **On Reason:** He was wrong to dismiss theoretical virtues (simplicity, etc.) as mere "taste". Most philosophers regard them as essential components of scientific rationality.
  3.  **On Your Example:** It is a valid logical point, but it is too trivial to threaten scientific realism. Science has tools (like Ockham's Razor) to discard parasitic hypotheses without needing new evidence.
  4.  **On Social Factors:** This is a non-sequitur. Underdetermination leaves a gap, but it does not dictate what fills it. It could be social pressure, or it could be rational judgement.

  **Should you be stuck?** You need not be. You can accept that evidence underdetermines theory *in principle* without accepting that science is therefore irrational or merely social. You can hold that while evidence does not *force* a conclusion, it *constrains* us, and that within those constraints, rational virtues guide us toward truth. This position allows you to respect the philosophy while maintaining confidence in the scientific enterprise.
