answer: |-
  # Project Proposal: Functional Units as Moral Variables in Dietary Ethics

  **Project Title:** The Arithmetic of Harm: How Unit Selection Dictates Ethical Rankings in Dietary Impact Models

  **Research Question**
  To what extent do conflicting ethical conclusions about beef, chicken, and plant-based diets stem from empirical disagreements versus the hidden moral weights embedded in the choice of functional unit (e.g., deaths per calorie vs. deaths per hectare)?

  **Background and Problem Statement**
  Public debate regarding the ethics of diet typically cycles through three positions: beef is worst due to direct slaughter and emissions; chicken is worse than beef due to higher individual animal counts per calorie; and vegetarianism is worst due to field deaths (mice, insects) during crop harvest. This debate remains unresolved not because data is missing, but because participants change the "functional unit" of measurement without acknowledging the ethical shift doing so entails.

  Calculating harm "per calorie" privileges satiety and implies the moral goal is sustaining life efficiently. Calculating "per gram of protein" privileges specific biological inputs. Calculating "per acre" privileges land use and wild animal habitat. Currently, these units are treated as neutral technical choices. My hypothesis is that they are normative choices. When the unit changes, the ranking of diets flips. Therefore, the debate is stuck because participants are arguing over empirical inputs (how many mice die per acre?) while ignoring the structural variable (why are we counting per acre?) that actually determines the winner.

  **Scope and the "Non-Existence" Problem**
  A common counter-argument is that reducing demand prevents animals from being bred, meaning they do not die but rather never exist. This raises the non-identity problem: is non-existence a harm? Attempting to solve this philosophically within a term-long quantitative project would render the scope unmanageable.

  This project will **bracket** the non-existence question. It will treat "deaths caused per unit of consumption" as the operational definition of harm for the quantitative model. The philosophical component will explicitly identify this bracketing as a limitation, arguing that quantitative ethics often hides the "non-existence" problem by focusing solely on observable deaths. The project does not solve the non-identity problem; it demonstrates how current models bypass it to produce false certainty.

  **Methodology**
  This project combines philosophical analysis with comparative modeling. It does not require primary data collection (e.g., field work), but rather the aggregation and restructuring of existing Life Cycle Assessment (LCA) data.

  1.  **Philosophical Framework:** Define the ethical implications of five common functional units (per calorie, per protein, per dollar, per meal, per land area). Establish criteria for what moral value each unit smuggles in (e.g., utilitarianism vs. land rights).
  2.  **Data Aggregation:** Collect existing mortality and yield data for beef, chicken, and staple crops. Sources will include peer-reviewed LCA studies and aggregated databases (e.g., Our World in Data, FAOSTAT). I will not generate new mortality rates but will document the range of estimates found in literature to use as sensitivity inputs.
  3.  **Comparative Modeling:** Build a spreadsheet model where the primary variable is the functional unit. Input the same empirical data but change the denominator. Record how the ethical ranking of the three diet types shifts.
  4.  **Synthesis:** Correlate the ranking flips with the philosophical framework. The goal is to map which moral assumptions lead to which dietary conclusions.

  **Feasibility and Risk Assessment**
  Is this too big for one term? It is ambitious but feasible if strictly bounded. The risk is "data hell"—spending weeks trying to reconcile incompatible datasets. To mitigate this, I will prioritize consistency over perfection. I will select one or two major source studies for mortality rates and apply them uniformly across all diet types, even if imperfect. The project's novelty is the *structural analysis of the units*, not the precision of the mouse death count. If the data is noisy but the unit-switching still causes ranking flips, the hypothesis holds.

  **Deliverables and Success Criteria**
  A "successful" result is not a verdict on which diet is best. A successful result is a demonstration that the verdict changes based on the unit chosen, accompanied by a taxonomy of the moral assumptions inherent in those units. The final deliverable will be a 10-15 page paper and the open-source spreadsheet model. Failure would look like producing a table of numbers without analyzing why the units differ, or getting stuck trying to find a "true" mortality rate for insects.

  **Timeline (12 Weeks)**
  *   **Month 1:** Literature review on functional units in LCA and ethical frameworks. Define the 5 units. Set up spreadsheet architecture.
  *   **Month 2:** Data aggregation. Input ranges for mortality and yield. Run initial models. Identify where rankings flip.
  *   **Month 3:** Write philosophical analysis linking units to moral weights. Draft final paper. Refine model for clarity.

  **Conclusion**
  This project moves the debate from "who is right about the data" to "why are we counting this way?" By exposing the unit choice as a moral choice, it offers a way to break the circular argument surrounding dietary ethics.

