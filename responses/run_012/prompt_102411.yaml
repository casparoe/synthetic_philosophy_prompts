  I start where grass is worn to stone,
  I start where seeds are barely sown.
  I wish to climb the little hill,
  I wish to climb the greater still.
  The clouds deny the very peak,
  We cannot take all that we seek.
  I climb the fraction of my height,
  I climb the fraction of my light.
  I stand five hundred feet above,
  I stand where eagles nest and love.
  The satisfaction feels the same,
  Though height and distance differ in name.
  You gain more ground beneath your shoe,
  I gain more ground, but share the view.
  The ratio is the thing we keep,
  Not equal steps, but promises steep.
  Half of my hope is now in hand,
  Half of my hope is now in land.
  Though miles apart, the rate is one,
  We stop when half the race is run.
