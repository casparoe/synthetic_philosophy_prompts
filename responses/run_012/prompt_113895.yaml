answer: |-
  ### The Instrumentalist Hard Line: Artifacts Are Inert, Decisions Are Political

  To claim that a technical artifact is "political" is to commit a category error. It is a form of mystification that attributes human agency to inanimate matter. Politics is the realm of negotiation, power, resource allocation, and moral choice. A camera, a bridge, or an algorithm possesses none of these capacities. It has no intent, no voice, and no vote. Therefore, an artifact is never political in itself; it is merely the fossilized residue of political decisions made by humans.

  Let's apply this rigorously to the automated traffic-enforcement cameras.

  When critics say these cameras are "racist by design," they are engaging in a convenient shorthand that obscures the actual locus of responsibility. The camera is a sensor array coupled with a processor. It detects contrast, edges, and license plate characters. It does not detect "low-income" or "minority." The computer-vision model's preference for certain street layouts is not a political stance; it is a mathematical optimization function based on training data. If the model performs better on wide, well-lit grids than on narrow, shaded urban streets, that is a technical limitation, akin to a flashlight working better in a tunnel than in a forest. A flashlight is not "biased" against the forest; it simply has a limited lumen output.

  The politics enters the system at three distinct human junctures, none of which reside in the hardware:

  1.  **Procurement and Incentives:** The city chose a vendor whose product was cheaper or faster to deploy, despite known limitations in varied urban environments. This is a budgetary decision. If the city prioritized equity, they would have mandated accuracy parity across neighborhood types before signing the contract. The "racism" is in the procurement officer's signature, not the camera's lens.
  2.  **Deployment Strategy:** The decision to install these specific cameras in dense neighborhoods rather than waiting for the technology to mature or installing them only where they work equally well is a policy choice. If the goal was safety, cameras would be placed at high-accident intersections regardless of demographics. If they are placed where revenue generation is highest or where technical failure is least costly to the vendor, that is a legislative and administrative choice.
  3.  **The Suppression of Alternatives:** The artifact becomes "political" only because humans chose *this* tool over others. Why not invest in traffic calming infrastructure? Why not use human officers held to accountability standards? The camera is not enforcing a political will; it is the chosen instrument of a political will that preferred automated revenue collection over equitable urban planning.

  By labeling the camera "racist," we let the human decision-makers off the hook. It suggests that the bias is inevitable, a property of the technology itself, rather than the result of specific, contestable choices about funding, testing, and placement. It reifies social injustice as technical inevitability. If the camera is the problem, the solution is to tweak the algorithm. But if the *deployment* is the problem, the solution is to fire the administrators, rewrite the contracts, or ban the system entirely. To say the artifact is political is to surrender power to the object. To say the artifact is neutral is to reclaim power for the citizen.

  ***

  ### Where This Argument Is Weakest

  I have taken the hard instrumentalist line as requested, but I must be honest: this argument fractures under the weight of **material agency and opacity.**

  The weakest point of the claim that "artifacts are never political" is that it assumes a separation between the design phase and the operational phase that does not exist in reality. Once a system is deployed, the human choices that created it recede into the background, and the artifact begins to act as an independent enforcer.

  In the camera example, my argument claims the politics lives in the procurement contract. But for the citizen receiving a ticket, the contract is invisible. The *camera* is the face of authority. The technology mediates the power relationship so thoroughly that distinguishing between the tool and the user becomes semantic hair-splitting. When Langdon Winner wrote about the low bridges, his point wasn't just that Robert Moses had a political intent, but that the *concrete itself* continued to enforce that intent long after Moses was gone, immune to voting, protest, or changing administrative whims. The bridge didn't need a new order to keep the buses out; its physical geometry did the work automatically.

  Similarly, these cameras create a feedback loop that locks in the initial bias. Because they are deployed in low-income areas, they generate data showing high infraction rates in those areas. This data is then used to justify *more* policing in those areas. The artifact isn't just passively reflecting a human decision; it is actively generating the reality that justifies its own existence.

  Furthermore, the "neutral tool" argument fails to account for **affordances.** Some technologies make certain political outcomes significantly easier than others. Automated fines make revenue generation easier than community safety. Surveillance makes control easier than trust. While a hammer can build a house or break a skull, a surveillance camera *only* watches. It affords monitoring, not dialogue. To say such an object is "neutral" ignores that its very existence narrows the horizon of political possibility.

  Ultimately, the instrumentalist argument is weakest when it tries to absolve the technology of its role in *sustaining* power structures. Humans make the initial choice, but the artifact takes over the labor of enforcement, making the politics durable, opaque, and difficult to challenge. At that point, saying "the camera isn't racist" feels less like a rigorous philosophical distinction and more like a legalistic dodge that ignores the lived experience of the person being watched.
