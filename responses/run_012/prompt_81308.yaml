prompt: |-
  I run the serious incident review process at a mid-sized hospital. Every case that meets the threshold gets a panel of three — me, a clinician from a different specialty than the one involved, and a senior ward nurse — and we have to file within 30 working days. The report goes to the board, gets read out to the family, and in the death cases may end up in front of the coroner. The part that eats all our time is omissions. Nobody pushed the drug, nobody called the doctor, nobody checked the interaction, nobody re-read the obs chart at 4am. And we keep having the same argument in different costumes about whether the thing nobody did actually caused the harm, or whether it's just where the story happens to be sad.

  So: write me a decision procedure the panel can actually run, in order, on the question of whether an omission caused the harm in a case. It has to be runnable by three tired clinicians who don't know any philosophy and have about ninety minutes. Questions in order, what counts as a good enough answer to each, where the procedure stops and returns a no, and where it stops and hands the question to a person because it's turned into a values question rather than a factual one.

  Some things I want built into it, because they're where I think we go wrong:

  The counterfactual is always underspecified. We say "if she'd escalated" and then everyone nods, but nobody says escalated to whom, how fast, and what that person would then have done. I want the procedure to force the alternative to be written out as a concrete scenario before anyone is allowed to vote on whether the omission made a difference, and to say what to do when the panel can't agree on what the alternative scenario even is.

  For omissions I don't think you can cleanly separate "did it make a difference" from "was it a failure", the way you can with a positive act. Whether a non-action even counts as a thing that was or wasn't done seems to depend on what the person's role required of them — the same silence is a failure in one nurse and not in another. I'd rather the procedure be upfront about that entanglement than pretend the causal question is neutral and the duty question comes later.

  Keep three things apart that our reports constantly mash together: whether the omission made a difference to this outcome; whether it's the kind of thing that generally makes outcomes worse (so it belongs in the report as a lesson even if it didn't change this one); and whether it was a breach of duty. I want the procedure to say which of the three each step is actually testing.

  The level of description problem. "She didn't escalate", "she didn't recognise the trend", and "she wasn't trained to recognise the trend" are three different omissions with three different answers, and panels slide between them depending on how the room feels. I want a rule for fixing the level of description before the test runs.

  Run it on these:

  1. A patient's early warning score climbed over six hours on nights and nobody escalated to the on-call doctor until the morning round. He arrested at 9am and died. Half the panel is certain the delay killed him. But the reviewing clinician thinks he had a ruptured aneurysm that was probably unsurvivable once the pain started, so the world where the call happens at 2am is a world where he gets reviewed, maybe scanned, possibly taken to theatre — and quite likely dies anyway, or dies on the table. I want to see what the procedure does here, including if the answer is that the delay isn't a cause and must not be listed as one. That answer will go down badly and I still want it if that's what the procedure gives.

  2. Two failures, each of which on its own would have been enough to prevent the harm. The pharmacist didn't flag the contraindicated dose; the prescriber didn't check the interaction though he normally always does. Undo either one and the patient is fine. The harm needs both. The but-for question gives a no for each of them separately, and we always end up writing "both contributed" and moving on. I want something better than that.

  3. The omission is by someone with no relevant duty: an agency nurse on her first shift, not rostered to that patient, no induction on our escalation policy, who saw the obs but said nothing. Does the procedure even get to ask whether she made a difference, or does it stop earlier?

  4. A quick one on the description problem — give me the same case run at two different levels of description and show me the answers coming apart.

  Then tell me what the procedure can't do: the questions it will keep punting to a human, which of those are genuinely value judgements versus just under-evidenced factual ones, and who should be in the room when we punt.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**

      *   **User Role:** Runs serious incident review (SIR) process at a mid-sized hospital.
      *   **Context:** Panel of three (User, Clinician from different specialty, Senior Ward Nurse). 30-day deadline. Report goes to Board, Family, potentially Coroner.
      *   **Problem:** Omissions (failures to act) consume all the time. Panels argue endlessly about whether the omission *caused* the harm or if it's just where the tragedy happened.
      *   **Goal:** A decision procedure (algorithm/checklist) to determine if an omission caused harm.
      *   **Constraints:** Runnable by tired clinicians in ~90 mins. No philosophy jargon. Must handle specific pain points:
          *   Underspecified counterfactuals (force concrete scenario writing).
          *   Entanglement of duty and causation (acknowledge this upfront).
          *   Distinguish three things: Causation (this case), General Risk (lesson learning), Breach of Duty (blame/liability).
          *   Level of Description problem (fix the description before testing).
      *   **Test Cases:**
          1.  Unsurvivable condition vs. delay (aneurysm case).
          2.  Overdetermined causation (two failures, either sufficient).
          3.  No duty (agency nurse).
          4.  Level of description variance.
      *   **Output Requirement:** The procedure, applied to cases, and a limitation analysis (what it can't do, who decides values).

  2.  **Deconstruct the Philosophical/Clinical Challenges:**

      *   *Causation vs. Duty:* In law and ethics, omission causation is tricky because you can't cause something by doing nothing unless you *should* have done something. The prompt explicitly wants this entanglement acknowledged.
      *   *Counterfactuals:* "But-for" testing fails with omissions if the alternative world isn't defined. "If she called" -> "Called who? What would they do?"
      *   *Overdetermination:* The "two fires" problem. If A and B both cause C, removing A still leaves B, so A isn't a "but-for" cause. Need a NESS test (Necessary Element of a Sufficient Set) or similar practical workaround.
      *   *Level of Description:* "Didn't escalate" vs. "Didn't recognize." One is procedural, one is cognitive. The cause might differ.
      *   *Values vs. Facts:* At some point, "was this risk acceptable?" or "was this duty reasonable?" becomes a value judgment, not a factual reconstruction.

  3.  **Drafting the Procedure (The "Omission Causality Protocol" - OCP):**

      *   *Phase 0: Setup.* Define the panel's mindset. Separate the three tracks (Causation, Lesson, Duty).
      *   *Phase 1: Fix the Description.* Stop sliding between "didn't know" and "didn't act." Pick one specific physical/cognitive omission.
      *   *Phase 2: Establish Duty (The Gatekeeper).* If no duty, causation is irrelevant for the report's findings on *this* staff member.
      *   *Phase 3: The Concrete Counterfactual.* Force the "Movie Script" of the alternative world. Who, when, what action, what immediate result.
      *   *Phase 4: The Probability Test.* Not "did it definitely save them?" but "did it materially increase the chance?" (Loss of Chance doctrine is useful here clinically).
      *   *Phase 5: Overdetermination Check.* Handle the "two failures" scenario.
      *   *Phase 6: The Verdict.* Causation Yes/No.
      *   *Phase 7: The Pivot.* If factual causation is unclear, flag as Value Judgment.

  4.  **Refining the Steps (incorporating user constraints):**

      *   *Constraint:* "Runnable by tired clinicians." -> Keep language plain. Use checkboxes.
      *   *Constraint:* "Force alternative to be written out." -> Step 3 needs a specific form.
      *   *Constraint:* "Distinguish Causation, Lesson, Duty." -> Make this the header structure.
      *   *Constraint:* "Level of Description." -> Step 1 must lock this in.

  5.  **Developing the Test Cases:**

      *   *Case 1 (Aneurysm):* Focus on the "Concrete Counterfactual." If the script says "Doctor comes, sees unsurvivable bleed," then omission didn't cause death. It might still be a Lesson (escalation policy) but not Causation.
      *   *Case 2 (Two Failures):* This requires moving away from strict "But-For." Use "Material Contribution" or "Sufficient Set." If Pharmacist *had* flagged, harm prevented. Therefore Pharmacist omission is causal *in the context of the system failing*.
      *   *Case 3 (Agency Nurse):* Duty check stops this early. No duty = No causal finding against *her*.
      *   *Case 4 (Description):* Show how "Didn't escalate" (Causal) differs from "Didn't recognize" (Maybe not causal if training lacking).

  6.  **Addressing the "What it can't do" Section:**

      *   It can't decide if a duty *should* have existed (Policy/Values).
      *   It can't decide if a risk was "acceptable" (Resource/Ethics).
      *   It can't adjudicate conflicting expert medical opinions on survivability (Needs external expert).
      *   Who decides? Board for policy, Coroner for legal duty, External Expert for medical probability.

  7.  **Review and Polish:**

      *   *Tone:* Professional, direct, empathetic to the fatigue of the panel.
      *   *Formatting:* Clear headings, bold text for decision points.
      *   *Check:* Did I address the "entanglement" of duty and causation? Yes, by making Duty a prerequisite for Causation testing in the protocol, but keeping the *findings* separate.
      *   *Check:* Did I address the "30 days/90 mins" constraint? The procedure needs to be tight. I will add time limits to steps.
      *   *Check:* The "Values vs Facts" distinction. I need to be clear where the procedure hands off to a human decision-maker.

  8.  **Self-Correction during drafting:**
      *   *Initial thought:* Use NESS test explicitly.
      *   *Correction:* No, too philosophical. Call it the "Intervention Viability Test."
      *   *Initial thought:* Separate Duty and Causation completely.
      *   *Correction:* User said they are entangled for omissions. I need to make sure Step 2 (Duty) gates Step 4 (Causation), but the *report* lists them separately.
      *   *Refinement on Case 2:* The "But-For" test fails here. I need to introduce the "Material Contribution" standard which is common in medical negligence when multiple causes exist. If the omission removed a *layer of protection* that was designed to prevent this, it counts.

  9.  **Final Polish:** Ensure the distinction between "Cause of Outcome" (Track A), "System Lesson" (Track B), and "Breach of Duty" (Track C) is maintained throughout. (This addresses the user's specific request to keep these apart).

  10. **Final Output Generation** (Proceeding to generate response based on these thoughts).
answer: |-
  This is the **Omission Causality Protocol (OCP)**. It is designed to be printed as a three-page worksheet. It forces the panel to separate factual reconstruction from value judgments and locks the counterfactual scenario before voting.

  **Time Allocation:** 90 Minutes total.
  **Panel:** Chair (You), Independent Clinician, Senior Nurse.
  **Rule:** If the panel cannot agree on a factual step, the procedure stops and flags a "Value/Expert Pivot" (see end of document). Do not vote on facts.

  ---

  ### TRACK SEPARATION (Read before starting)
  *Do not mix these findings in the final report.*
  1.  **Track A (Causation):** Did this specific omission change the outcome for *this* patient?
  2.  **Track B (System Lesson):** Is this the kind of omission that generally increases risk, even if it didn't kill this patient?
  3.  **Track C (Duty/Breach):** Was the person required to act, and did they fail that requirement?

  *Note: You can have a Track C breach without Track A causation. You can have Track A causation without Track C breach (e.g., system error).*

  ---

  ### STEP 1: LOCK THE DESCRIPTION (15 Mins)
  *Problem: Sliding between "didn't act," "didn't know," and "wasn't trained."*

  **Instruction:** Write the omission in one sentence. It must describe a physical or cognitive event that did not happen at a specific time.
  *   *Bad:* "Nurse failed to escalate."
  *   *Bad:* "Nurse didn't recognize sepsis."
  *   *Good:* "At 02:00, Nurse X did not call the Registrar despite NEWS2 ≥ 5."
  *   *Good:* "At 02:00, Nurse X looked at the chart but did not cognitively register the heart rate trend."

  **Decision:**
  *   [ ] Description Locked. (All three panelists sign off on this exact wording).
  *   [ ] **STOP.** If you cannot agree on *what* was omitted, you cannot test *if* it caused harm. Flag as "Disputed Fact – Level of Description."

  ---

  ### STEP 2: THE DURY GATE (15 Mins)
  *Problem: Testing causation for someone who wasn't supposed to act.*

  **Instruction:** Consult the roster, job description, and local policy valid at the time of the incident.
  **Question:** Did the specific individual identified in Step 1 have a documented or reasonably implied duty to perform the action at that specific time?

  *   [ ] **YES:** Proceed to Step 3.
  *   [ ] **NO:** **STOP.**
      *   *Finding:* Omission is **Not Causal** regarding this individual.
      *   *Action:* Move to Track B (System Lesson). Why was a person without a duty in a position where they could have acted? (e.g., staffing model, induction failure).
      *   *Report:* "No breach of duty by Individual X. System failure identified."

  ---

  ### STEP 3: THE CONCRETE COUNTERFACTUAL (30 Mins)
  *Problem: "If she'd escalated" is magic, not medicine. We need a script.*

  **Instruction:** You must write the "Alternative Script." Do not assume the patient lives. Assume the action in Step 1 *was* done, and write exactly what happens next based on evidence (policy, on-call rosters, expert testimony).

  **Fill in the blanks:**
  1.  **Action:** At [Time], [Person] would have [Specific Action].
  2.  **Response:** Who would have received this? (Name the role, e.g., "Medical Registrar on-call").
  3.  **Reaction:** What would that recipient *physically have done*? (e.g., "Come to ward within 20 mins," "Ordered CT," "Prescribed Antibiotics").
  4.  **Constraint:** Were there known barriers at that time? (e.g., "CT scanner was down," "No anaesthetist available"). *You cannot assume resources existed that did not.*

  **Panel Vote on Script:**
  *   [ ] **Agreed:** We all agree this script is medically and logistically plausible. Proceed to Step 4.
  *   [ ] **Disagreed:** **STOP.**
      *   *Reason:* We cannot agree on what would have happened if the duty was met.
      *   *Action:* **Value/Expert Pivot.** This is no longer a factual review. It requires external expert opinion on standard of care response times or survivability.
      *   *Report:* "Causation indeterminate due to uncertainty of intervention efficacy."

  ---

  ### STEP 4: THE PROBABILITY TEST (20 Mins)
  *Problem: "But-for" fails when the patient might have died anyway.*

  **Instruction:** Compare the **Actual Timeline** (Death/Harm) with the **Alternative Script** (Step 3).
  **Question:** In the Alternative Script, is the probability of the specific harm (death, injury) **significantly reduced**?

  *   *Definition:* "Significantly" means >10% chance of survival/recovery gained (Loss of Chance doctrine). It does not need to be >50%.
  *   *Evidence:* Use mortality data, clinical guidelines, or expert consensus.

  **Decision:**
  *   [ ] **YES (Probability Reduced):** Omission is **Causal (Track A)**.
      *   *Note:* Even if they might still have died, if the omission removed a significant chance of survival, it counts as a cause.
  *   [ ] **NO (Outcome Unchanged):** Omission is **Not Causal (Track A)**.
      *   *Reasoning:* The harm was inevitable given the pathology, regardless of the omission.
      *   *Action:* Check Track B. Is this still a lesson? (Yes, because next time the pathology might be survivable).
  *   [ ] **UNSURE:** **STOP.** **Value/Expert Pivot.** (See End).

  ---

  ### STEP 5: THE OVERDETERMINATION CHECK (10 Mins)
  *Problem: Two failures, either one sufficient. (The "Two Fires" problem).*

  **Instruction:** If there was more than one omission (e.g., Pharmacist + Prescriber), run Step 4 for *each* independently.
  **Rule:** If Omission A *alone* prevented in the script, and Omission B *alone* prevented in the script, **BOTH are Causal.**
  *   *Rationale:* We do not exonerate a failure because the system failed elsewhere too. Each layer of defense is causal to the breach of safety.

  **Decision:**
  *   [ ] **Record:** List all omissions that meet Step 4 criteria as Causal Factors.

  ---

  ### APPLICATION TO YOUR CASES

  #### Case 1: The Unsurvivable Aneurysm
  *   **Step 1 (Description):** "Registrar not called at 02:00 despite NEWS2 ≥ 5." (Locked).
  *   **Step 2 (Duty):** Yes, night nurse had duty.
  *   **Step 3 (Script):**
      *   *Action:* Call at 02:00.
      *   *Response:* Registrar attends 02:30.
      *   *Reaction:* Registrar sees fixed pupils, thunderclap headache history. Orders CT.
      *   *Constraint:* CT available.
  *   **Step 4 (Probability):**
      *   *Evidence:* Neurosurgery consult confirms ruptured aneurysm of this type has 95% mortality prior to arrival, 90% mortality even with surgery.
      *   *Test:* Does calling at 02:00 reduce probability of death significantly (>10%)?
      *   *Result:* **NO.**
  *   **Verdict:**
      *   **Track A (Causation):** The omission did **not** cause the death. The death was caused by the pathology.
      *   **Track B (Lesson):** Escalation policy still valid (for survivable cases).
      *   **Track C (Duty):** Breach occurred (duty existed, action not taken), but no causal link to outcome.
      *   *Report Wording:* "Failure to escalate identified. However, clinical evidence suggests outcome was not alterable by earlier intervention. No causal link to mortality established."

  #### Case 2: Pharmacist AND Prescriber (Overdetermination)
  *   **Step 1:** "Pharmacist did not flag" AND "Prescriber did not check interaction."
  *   **Step 2:** Both had duty.
  *   **Step 3 (Script for Pharmacist):** If flagged, prescriber would have changed drug (per protocol). Patient fine.
  *   **Step 3 (Script for Prescriber):** If checked, prescriber would have seen interaction. Patient fine.
  *   **Step 4:** Both scripts show significant risk reduction.
  *   **Step 5 (Overdetermination):** Both pass independently.
  *   **Verdict:** **Both are Causal.**
      *   *Report Wording:* "Harm resulted from failure of two independent safety checks. Either check functioning would have prevented harm. Both omissions are recorded as causal factors." (Avoids the "both contributed" vagueness).

  #### Case 3: The Agency Nurse (No Duty)
  *   **Step 1:** "Agency nurse saw obs and did not speak."
  *   **Step 2 (Duty):** Roster shows she was not assigned to patient. Induction log shows no escalation policy training.
      *   *Result:* **NO DUTY.**
  *   **Verdict:** **STOP.**
      *   *Track A:* Not Causal (against her).
      *   *Track C:* No Breach.
      *   *Track B (Lesson):** Why was an uninducted agency nurse the only person noticing the trend? (Staffing/Supervision failure).
      *   *Report Wording:* "Individual nurse had no duty of care for this patient. System failure identified in supervision of agency staff."

  #### Case 4: Level of Description (The Slide)
  *   **Scenario:** Junior doctor misses diagnosis.
  *   **Run A (Description: "Didn't order test"):**
      *   Script: If test ordered, diagnosis made.
      *   Result: **Causal.**
  *   **Run B (Description: "Didn't recognize symptom"):**
      *   Script: If recognized, test ordered.
      *   Evidence: Symptom was subtle, below competency level for junior.
      *   Result: **Not Causal** (Expectation unreasonable).
  *   **Lesson:** The procedure forces you to pick Run A or Run B in Step 1. If you pick B, you can't blame them for the test in Step 4. If you pick A, you blame the action, not the cognition. This prevents the "He should have known" slide.

  ---

  ### WHAT THE PROCEDURE CANNOT DO (The Pivot List)

  This procedure is a factual filter. It will hit walls where the question is no longer "What happened?" but "What should we tolerate?" When you hit these, you must stop the panel and escalate.

  | The Wall | Why the Procedure Stops | Who Decides (The Pivot) |
  | :--- | :--- | :--- |
  | **Conflicting Medical Probability** | Step 4 fails because Panel Clinician says "80% survival" and External Evidence says "20% survival." | **External Expert Review.** Do not vote. Commission an independent specialist opinion on survivability. |
  | **Resource Constraints** | Step 3 Script fails because "We assume a doctor would come," but staffing levels made that impossible. | **Board/Management.** This is a resource allocation value judgment, not a clinical fact. Is the staffing level acceptable? |
  | **Scope of Duty** | Step 2 is unclear. Policy is ambiguous on whether the nurse *should* have acted. | **Clinical Governance Lead.** Interpretation of policy is a governance decision, not a review panel decision. |
  | **Acceptable Risk** | Step 4 shows risk increased, but the intervention carries high risk itself (e.g., risky surgery). | **Ethics/Coroner.** Was the risk of intervention justified? This is a value judgment on risk tolerance. |

  ### FINAL REPORTING RULE
  If the procedure stops at a **Pivot**:
  1.  Do not write "Cause Unknown."
  2.  Write "Causation indeterminate pending [Expert/Policy] clarification."
  3.  Assign an owner to resolve the Pivot within 14 days.

  If the procedure completes:
  1.  **Track A:** Yes/No (Causal to outcome).
  2.  **Track B:** Yes/No (System Lesson).
  3.  **Track C:** Yes/No (Breach of Duty).
  *Never merge these columns.*
