prompt: |-
  I do cost-effectiveness work for a public health insurer — when a drug comes up for coverage I run the numbers, and the numbers are QALYs, which means at the end of the day I'm adding up years of life across people and funding whatever comes out biggest. Some patient groups have started pushing back on this, and one of them sent a long letter I can't really argue with: they say our method treats the population like it's one person who can trade a bad year here against a good year there, when there isn't any such person — the one who eats the bad year and the one who gets the good year are different people, and the second one's gain doesn't make the first one's loss up to anybody. I basicly agree, which is a problem, because we still have to decide. I get about a week per decision, I'm not a philosopher, and whatever I produce has to go to a committee that signs off.

  So write me a procedure I can actually run on a funding proposal. Questions in order, what a good enough answer to each looks like, where the procedure stops with a no, and — the part I really need — where it stops being technical and becomes a value call the committee has to own out loud. It can't just say never aggregate, because then it's useless and everyone ignores it. I'm pretty sure some kinds of adding-up are the objectionable kind and some aren't, and I can't say what the difference is. One more thing that bugs me: trading a bad year for a good year inside one life is obviously fine, that's just what treatment is, so why is it supposed to be outrageous across two lives? Either there's a real difference there or their isn't, and I'd rather the procedure take a side on that than paper over it.

  The procedure should end by producing a short written justification I can send to the people who lose out, addressed to them specifically. If all I can say is that it's better on the whole, that's the very answer they're already rejecting.

  Then run it on three cases: (a) a cheap drug that gives a small benefit to a huge number of people versus an expensive one that gives a big benefit to a handful; (b) closing a clinic that serves one identifiable group in order to fund something with more QALYs spread thinly across everyone else; (c) a case where the procedure tells me the thing I'm doing right now is the bad kind — don't soften it. And say plainly which steps are arithmetic, which are moral philosophy in a lab coat, and what the procedure can't settle at all.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure and analysis:

  1.  **Analyze the User and the Problem:**
      *   **User Role:** Cost-effectiveness analyst for a public health insurer.
      *   **Task:** Evaluate drug/program coverage based on QALYs (Quality-Adjusted Life Years).
      *   **Conflict:** Patient groups argue that aggregating QALYs across different people is morally problematic (the "separateness of persons" objection). They claim you can't trade one person's loss for another's gain.
      *   **User's Position:** Sympathetic to the objection ("I basically agree"), but constrained by reality (need to make decisions, 1-week turnaround, committee approval, can't just say "never aggregate").
      *   **Needs:** A concrete *procedure* to run on funding proposals.
          *   Questions in order.
          *   Criteria for "good enough" answers.
          *   Stop points (No decisions).
          *   **Crucial:** A clear handoff point where technical analysis ends and value judgment begins (for the committee to own).
          *   **Crucial:** A distinction between acceptable and unacceptable aggregation.
          *   **Crucial:** A specific written justification template for those who lose out (cannot just be "greater good").
          *   **Crucial:** Clarity on the intra-personal vs. inter-personal trade-off distinction.
      *   **Test Cases:** (a) Small benefit/many vs. Big benefit/few; (b) Closing a clinic for identifiable group vs. diffuse gain; (c) A case where the current method is wrong (don't soften).
      *   **Meta-Requirement:** Identify which steps are arithmetic, which are disguised philosophy, and what remains unsettled.

  2.  **Deconstruct the Ethical Objection:**
      *   The objection is classic Rawlsian/Nozickian "separateness of persons." Utilitarianism aggregates; deontology/rights-based approaches often resist sacrificing individuals for the aggregate.
      *   *Intra-personal:* I suffer now to gain later. I own both ends. Consent is implied or actual.
      *   *Inter-personal:* You suffer so I can gain. We are distinct. No consent.
      *   *The User's Dilemma:* Public insurance *requires* pooling risk and resources. Pure non-aggregation makes insurance impossible. Pure aggregation ignores justice/fairness.
      *   *The Solution:* A "Constrained Maximization" procedure. Maximize QALYs *unless* it violates specific fairness constraints that trigger the "separateness" alarm.

  3.  **Drafting the Procedure (The "Fairness-Filtered QALY" Protocol):**
      *   *Goal:* Make the aggregation explicit and check for "sacrifice."
      *   *Step 1: The Arithmetic.* Calculate standard QALYs and Cost-Per-QALY. (Technical).
      *   *Step 2: Distributional Check.* Who gains? Who loses? Is the loss concentrated? (Technical/Descriptive).
      *   *Step 3: The "Identifiable Victim" Test.* Are the losers a specific, visible group? (Philosophical trigger).
      *   *Step 4: The "Baseline Rights" Floor.* Does the decision drop anyone below a minimum standard of care? (Moral constraint).
      *   *Step 5: The Aggregation Decision.* If Steps 2-4 pass, aggregate. If not, flag for Committee. (The Handoff).
      *   *Step 6: The Justification.* Drafting the letter.

  4.  **Refining the "Intra vs. Inter" Distinction:**
      *   Why is intra okay? Because it's *one agency* managing *one life*.
      *   Why is inter risky? Because it treats people as containers for utility rather than agents.
      *   *Resolution:* Aggregation is permissible *only if* the "losers" are not being actively harmed to benefit others, but rather *not selected for extra benefit* due to resource limits. This is the "Rescue vs. Allocation" distinction.
      *   *Wait, the user wants a side taken.* I need to be firm. Aggregation is valid for *allocation of surplus*, invalid for *imposition of harm*.
      *   *Correction:* In public health, "not funding" isn't always "imposing harm," but closing a clinic *is* removing access. I need to distinguish between *failure to benefit* and *active deprivation*.

  5.  **Developing the "Stop Points" and "Committee Handoff":**
      *   The analyst does the math and the distributional mapping.
      *   The Committee makes the call when the math says "Fund A" but the fairness check says "A hurts Group X disproportionately."
      *   The "Value Call" is explicitly: "Is the aggregate gain worth the concentrated pain?"

  6.  **Drafting the Rejection Letter:**
      *   Must acknowledge the specific loss.
      *   Must admit the trade-off (no "it's good for you" gaslighting).
      *   Must state the principle used.

  7.  **Running the Test Cases:**
      *   *(a) Cheap/Many vs. Expensive/Few:* Standard QALY wins Many. Fairness check: Are the Few being abandoned below a baseline? If yes, Committee call.
      *   *(b) Closing Clinic:* Identifiable losers. High moral cost. Procedure should flag this as a "Value Call" likely to fail the fairness filter unless the clinic is ineffective.
      *   *(c) The "Bad Kind" (Current Practice):* A scenario where QALY maximization discriminates against the disabled (devaluing their QALYs). This is a known critique of QALYs. I need to show where the procedure catches this.

  8.  **Review against Constraints:**
      *   *One week per decision?* Procedure needs to be fast. Checklists work.
      *   *Not a philosopher?* Keep jargon low, focus on operational questions.
      *   *Committee ownership?* Clear "Recommendation vs. Decision" split.
      *   *Intra vs. Inter?* Address this in the preamble/philosophy section.

  9.  **Final Polish:**
      *   Tone: Professional, direct, empathetic but firm.
      *   Structure: Preamble (Philosophy), The Procedure (Steps), The Output (Letter), The Test Cases, The Meta-Analysis (Arithmetic vs. Philosophy).

  *(Self-Correction during drafting)*: I initially thought about suggesting a "weighted QALY" system. But the user said they aren't a philosopher and need a procedure *now*. Weighting requires complex ethical calibration. Better to use a "Threshold + Constraint" model. It's easier to operationalize.
  *Key distinction to articulate:* Aggregating *benefits* is different from aggregating *harms*. We can sum gains across people. We cannot sum losses to justify sacrificing one.
  *Actually, the user's constraint is "we still have to decide."* So I can't say "never sacrifice." I must say "Here is when you admit you are sacrificing."
  *Refining the Intra/Inter point:* Intra-personal trade-offs are authorized by the self. Inter-personal trade-offs require political authorization. The Committee provides that authorization. The Analyst provides the map of the trade-off.

  10. **Finalizing the Output Structure:**
      *   **Introduction:** Acknowledge the tension.
      *   **The Protocol:** 5 Steps.
      *   **The Handoff:** Where the committee decides.
      *   **The Letter:** Template.
      *   **The Test Cases:** Applied logic.
      *   **The Meta-Analysis:** Arithmetic vs. Philosophy.

  Let's write it.
answer: |-
  Here is a procedure designed for your constraints. It does not solve the philosophical problem (no procedure can), but it forces the problem into the open so the Committee cannot hide behind your spreadsheet.

  ### The "Separated Persons" Protocol (SPP)

  **Purpose:** To distinguish between *allocating surplus* (where aggregation is permissible) and *imposing sacrifice* (where aggregation requires explicit political authorization).
  **Time Required:** 3–4 days of analysis, 1 day for drafting.

  #### Step 1: The Aggregate Calculation (Arithmetic)
  **Question:** What is the net QALY gain and cost-per-QALY of the proposal compared to the status quo?
  **Good Enough Answer:** A standard cost-effectiveness ratio (e.g., $50,000/QALY) and a total population QALY delta.
  **Stop Point:** If the drug/program is *dominated* (costs more, helps less) or exceeds the insurer's hard cost-effectiveness threshold, **STOP. Recommendation: No.** (This is technical, not moral).

  #### Step 2: The Distributional Map (Descriptive)
  **Question:** Who specifically gets the QALYs, and who specifically bears the cost (including opportunity costs of diverted funds)?
  **Good Enough Answer:** A breakdown by demographic or clinical subgroup.
  *   *Group A (Winners):* [Description, Size, Gain per person]
  *   *Group B (Losers):* [Description, Size, Loss per person]
  **Stop Point:** If the "Losers" are abstract (e.g., "all premium payers") and the "Winners" are patients in need, proceed to Step 3. If the "Losers" are a specific patient group losing existing access, **FLAG FOR COMMITTEE.**

  #### Step 3: The Baseline Floor Check (Moral Constraint)
  **Question:** Does denying this proposal (or funding it by cutting elsewhere) drop any specific group below a "minimum standard of care" or existing entitlement?
  **Good Enough Answer:** A binary Yes/No based on current coverage policies or clinical guidelines for life-sustaining treatment.
  **Stop Point:**
  *   **If NO:** (No one falls below a baseline). Aggregation is **Permissible**. Proceed to Step 5.
  *   **If YES:** (A specific group loses access to care they currently have, or are denied life-sustaining care to fund quality-of-life care elsewhere). **STOP. This is a Value Call.**

  #### Step 4: The Identifiable Victim Test (The Handoff)
  **Question:** Are the losers "statistical" (risk spread over millions) or "identifiable" (a known clinic, a specific rare disease group)?
  **Good Enough Answer:** Identification of whether the loss is concentrated.
  **The Rule:**
  *   *Statistical Loss + Aggregate Gain:* Analyst recommends **Yes**. (This is insurance).
  *   *Identifiable Loss + Aggregate Gain:* Analyst **Cannot Recommend.** This must go to the Committee as a "Trade-Off Decision."

  #### Step 5: The Committee Handoff (The Value Call)
  If Step 3 or 4 is triggered, you do not produce a "Yes/No." You produce a **Decision Memo**.
  **Content:** "Funding Option A yields X QALYs. Funding Option B yields Y QALYs. Option A requires Group Z to lose access to Treatment K. The arithmetic favors A. The fairness constraint flags Z. The Committee must decide if the gain to the many justifies the specific loss to Z."
  **Requirement:** The Committee must vote on the *trade-off*, not just the budget.

  ***

  ### The Rejection Letter Template
  *Do not send this if the Decision Memo is pending. Send this only after a decision is made.*

  **Subject:** Decision regarding coverage for [Treatment/Program]

  **To:** [Patient Group/Representatives]

  **From:** [Your Name/Office]

  **Re:** Coverage Determination

  We have completed our review of [Treatment]. We are writing to you specifically because we know this decision impacts you directly, not just as data points.

  **The Outcome:** [We will / We will not] be funding this treatment.

  **The Reason:**
  *   *(If Aggregate Win):* Our analysis shows this funding produces the greatest total health benefit for the insured population. We acknowledge that this decision means resources are not available for [Specific Alternative]. We know that "the greater good" does not comfort those who do not receive the treatment. We are making this choice because we must prioritize where limited funds save the most life-years overall.
  *   *(If Fairness Constraint Triggered):* While the aggregate numbers favored an alternative, the Committee determined that the cost to your group was too high. We have decided that protecting [Specific Baseline/Access] is more important than maximizing total QALYs in this instance.

  **The Trade-Off:**
  We want to be clear: This decision is not because your lives are worth less. It is because we faced a choice between [Total Population Benefit] and [Specific Group Access]. We chose [Choice]. We own the consequence of that choice.

  Sincerely,
  [Signature]

  ***

  ### Running the Procedure on Your Three Cases

  #### Case (a): Cheap/Small Benefit (Many) vs. Expensive/Big Benefit (Few)
  *   **Step 1:** Cheap/Many wins on pure QALY math.
  *   **Step 2:** Winners = General population. Losers = The Few (Rare disease?).
  *   **Step 3 (Baseline):** Are the Few being denied *life-sustaining* care?
      *   *If Yes:* **Flag for Committee.** You cannot trade life for quality-of-life improvements for the masses.
      *   *If No (e.g., mobility aids vs. pain relief):* **Permissible Aggregation.**
  *   **Step 4:** Are the Few identifiable? Yes.
  *   **Verdict:** If the Few drop below a baseline, the procedure stops the automatic QALY win. It forces the Committee to vote: "Are we willing to let these specific people go without to save small amounts for many?"
  *   **Why this works:** It admits that saving 10,000 people from a headache is not automatically worth letting 1 person die, even if the math says so.

  #### Case (b): Closing a Clinic (Identifiable Group) vs. Diffuse Gain
  *   **Step 1:** Diffuse Gain wins on QALYs.
  *   **Step 2:** Losers = Clinic Patients (Identifiable). Winners = Everyone else (Statistical).
  *   **Step 3 (Baseline):** Does closing the clinic drop patients below a standard of access? **Yes.**
  *   **Step 4 (Identifiable Victim):** **High Alert.**
  *   **Verdict:** **Stop.** This is the exact "separateness of persons" violation the letter described. You are taking a guaranteed loss from Group A to buy lottery tickets for Group B.
  *   **Procedure Output:** Decision Memo to Committee. "Math says close clinic. Ethics says this sacrifices a visible minority for invisible gains. Committee must vote to accept the sacrifice."
  *   **Likely Result:** If the Committee signs this, the Rejection Letter must say: "We are closing your clinic to fund small benefits for others. We know this is unfair to you specifically, but we are prioritizing the aggregate." (This is politically dangerous, which is correct—it *should* be dangerous).

  #### Case (c): The "Bad Kind" (Where your current method fails)
  *   **Scenario:** A drug extends life for disabled patients, but because their baseline quality of life is scored lower, the QALY gain is calculated as smaller than the same drug for non-disabled patients. The system rejects the drug for the disabled group to fund the non-disabled group.
  *   **Step 1:** Non-disabled group wins on QALY math.
  *   **Step 2:** Losers = Disabled patients.
  *   **Step 3 (Baseline):** **Critical Fail.** This discriminates based on status, not just resource scarcity.
  *   **Step 4:** Identifiable group based on protected characteristic.
  *   **Verdict:** **Hard Stop.** The procedure flags this as "Discriminatory Aggregation."
  *   **Why:** This is the difference between *intra-personal* and *inter-personal*.
      *   *Intra-personal:* A disabled person trading a year of pain for a year of comfort is their own choice.
      *   *Inter-personal:* The insurer deciding a disabled person's year is worth *less funding* than a non-disabled person's year is a value judgment about the worth of the life, not just the utility of the resource.
  *   **Procedure Action:** Reject the QALY calculation as biased. Require a "Equality-Weighted" review. If the Committee still votes no, the Letter must say: "We funded the non-disabled group because their QALY gain was higher. We acknowledge this values their health restoration more than yours." (This forces the Committee to admit to discrimination).

  ***

  ### Meta-Analysis: What is this procedure actually doing?

  You asked to distinguish the arithmetic from the philosophy and admit what can't be settled.

  **1. Pure Arithmetic (Steps 1 & 2)**
  *   **What it is:** Counting health years and dollars.
  *   **Limitation:** This is where you are now. It treats people as buckets. It cannot tell you if pouring water from Bucket A to Bucket B is fair, only that Bucket B ends up fuller.

  **2. Moral Philosophy in a Lab Coat (Steps 3 & 4)**
  *   **What it is:** The "Baseline Floor" and "Identifiable Victim" tests.
  *   **The Philosophy:** This encodes the **Separateness of Persons**. It asserts that there is a moral difference between *failing to benefit* someone (due to scarcity) and *taking away* what they have (to benefit others).
  *   **The "Side" You Asked For:** The procedure takes the side that **aggregation is valid for surplus, invalid for sacrifice.**
      *   *Intra-personal trade-offs* are fine because the agent consents to their own life management.
      *   *Inter-personal trade-offs* are only fine if they don't violate a baseline right. If they do, the "gain" to the second person does not cancel the "loss" to the first.
  *   **Why it's "Lab Coat":** It turns a philosophical right ("I shouldn't be sacrificed") into a checklist item ("Does this drop below clinical baseline?"). It's imperfect, but it's actionable.

  **3. What The Procedure Cannot Settle (The Committee Handoff)**
  *   **The Unsettled Question:** "How much aggregate gain is worth one specific sacrifice?"
  *   **Why:** There is no math for this. If closing the clinic saves 1,000 lives elsewhere, is it worth it? If it saves 100 headaches?
  *   **Your Role:** You map the terrain. You say, "Here is the gain. Here is the pain. They are not the same currency."
  *   **Their Role:** They must exchange the currencies. They must say, "We accept the pain for the gain."
  *   **Why this matters:** When the patient group complains, you can say, "I showed them the cost. They voted to pay it." You remove yourself as the shield.

  ### Summary of Differences: Intra vs. Inter
  You asked for a side on why trading within a life is fine but across lives is suspect.
  *   **Within a life:** The "loser" (you at time A) and the "winner" (you at time B) are the same legal and moral entity. You have sovereignty over your own suffering.
  *   **Across lives:** The "loser" and "winner" are sovereign entities. One cannot authorize the other's suffering.
  *   **The Procedure's Stance:** We can aggregate *hopes* (surplus allocation). We cannot aggregate *rights* (baseline removal). If your current QALY model removes a baseline right from Person A to give a surplus hope to Person B, the procedure classifies that as the **objectionable kind** of adding-up.

  This procedure will not make the decisions easy. It will make the hard decisions visible. That is the best an analyst can do.
