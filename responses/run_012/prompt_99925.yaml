answer: |-
  The engine was idling, a low vibration humming through the seats. He kept his hands on the wheel, eyes on the dark stretch of road ahead, though they weren't moving. She was turned toward him, one leg tucked under the other.

  "Seventy-thirty," he said. "That's my number now. But I know myself. By three a.m., after six hours of staring at felt and drinking bad coffee, I'm going to be convinced it's a coin flip. Fifty-fifty."

  "And you're okay with that?" she asked. Her voice was tight. "You're admitting you'll be less rational in six hours, and your plan is to just… surrender to it?"

  "My plan is to make the decision when the decision needs to be made. Why should I let Now-Me dictate terms to Three-AM-Me? He's the one with the chips in front of him."

  "Because they're the same person," she said. "That's the whole point of Reflection. If you are certain now that your credence will be fifty percent later, your credence *now* must be fifty percent. Anything else is incoherent. You're holding two contradictory beliefs about the same proposition."

  "I'm not holding two beliefs. I'm holding one belief, and a prediction about my own degradation." He tapped the dashboard. "Look, if I told you I was going to meet a friend at a bar, and I told you, 'I trust his judgment on politics zero percent because he's going to be hammered,' would you say I'm being incoherent if I disagree with him now?"

  "This isn't a friend," she said. "It's you. The principle relies on self-trust. If you think your future self is going to be irrational, sure, Reflection doesn't apply. But you're using that as a loophole. You're saying, 'I know I'll be irrational, so I'm going to act irrationally now to match it.'"

  "I'm acting pragmatically. I know the conditions of the game. The game changes at three a.m. My brain changes. Why should my probabilities stay static?"

  "Because probability isn't about the brain," she snapped. "It's about the evidence. Have you learned anything new between now and three a.m. that changes the odds of the hand? No. The only thing changing is your capacity to process. If you defer to a version of yourself that you *know* is compromised, you aren't being pragmatic. You're pre-committing to error."

  "So what's the alternative? I lock myself out of the casino? I force Now-Me's seventy-thirty on a guy who's too tired to count cards?"

  "The alternative is recognizing that if you *know* you'll shift to fifty-fifty without new evidence, you should shift now. That's what Reflection demands. Align with your expectation."

  "Even if I know the expectation is garbage?"

  "Especially then. Because if you don't, you're opening yourself up to a Dutch Book."

  He laughed, a short, sharp sound. "Don't talk book to me like it's a threat. I live in the book."

  "Do you?" She leaned in. "Okay. Right now, you say seventy-thirty. So I sell you a bet on 'she's bluffing' for seventy cents. You take it. Then three a.m. comes. You've shifted to fifty-fifty. So now I buy the bet back from you for fifty cents. I've made twenty cents profit, and you've lost twenty cents. Guaranteed. No matter what the hand is."

  "That's a diachronic Dutch Book," he said. "It only works if you treat me as a single agent over time."

  "You *are* a single agent over time."

  "Am I?" He finally looked at her. "Who lost the money, exactly? The guy who bought the bet is tired, wired, and seeing patterns in the carpet. The guy who sold it was fresh. They're not the same. You're saying I'm incoherent because *he* gets suckered. Why should I care about his wallet?"

  "Because it's your wallet."

  "It's a continuous stream of wallets." He turned back to the road. "You're assuming rationality is a project that spans hours. I think rationality is a project that spans moments. If I maximize my utility for this time-slice, and he maximizes his for that time-slice, the chain might look messy from the outside, but no link is broken."

  "That's insane," she said. "That means you can never plan. You can never learn. If every time-slice is its own agent, then you can't trust your own memories, because that's just a past agent reporting in."

  "I trust memories. I don't trust judgments made under duress."

  "Duress? It's fatigue."

  "It's chemical duress. Look, you're defending Reflection like it's a law of physics. It's not. It's a norm for agents who expect their future selves to be *better* or at least *equal* informants. If I expect my future self to be worse, Reflection tells me to be stupid now to avoid being inconsistent later. I'd rather be inconsistent."

  She was quiet for a moment. The hum of the engine filled the gap. "So you're saying Reflection should be restricted. Only apply it when you trust your future self."

  "I'm saying it's useless if you don't."

  "But then you lose the normative force," she said, her voice dropping, losing some of its edge but gaining intensity. "If you can just opt out whenever you think you'll be tired, or emotional, or drunk… then the principle doesn't tell you how to think. It just tells you how to think when you're already thinking perfectly."

  "Maybe that's all it is. A description of ideal conditions."

  "No. It's supposed to prevent exploitation. The Dutch Book isn't just about losing money. It's about showing that your beliefs don't map to reality. If you can be pumped for money, your credences are wrong."

  "My credences aren't wrong. They're priced for risk." He shifted in his seat. "And you're still dodging the identity question. If Three-AM-Me is a different agent, your Dutch Book is just you taxing a stranger. Why is that a logical failure?"

  "Because you benefit from the continuity when it suits you," she said. "You want to be the same person when you're collecting the winnings from the hands you played at midnight. You want to be the same person when you're driving this car home. But when it comes to accountability for your beliefs? Suddenly you're a time-slice."

  He gripped the wheel tighter. "That's not accountability. That's biology."

  "It's convenience." She reached out, hovering her hand near his arm but not touching. "If you admit you'll be wrecked at three a.m., you're admitting you'll be irrational. If you know you'll be irrational, rationality requires you to bind yourself now. Don't play. Or, if you play, hold the line at seventy-thirty. Don't tell me you're going to shift to fifty-fifty and that it's *fine*."

  "It is fine."

  "It's a surrender."

  "It's survival." He put the car in gear. "You want me to be a unified agent? Fine. The unified agent is tired. The unified agent knows he makes bad calls at three a.m. So the unified agent decides now that at three a.m., he's going to listen to the bad calls because he doesn't have the energy to fight them."

  "So you're planning to be irrational."

  "I'm planning to be me." He looked at her, and the exhaustion was already there, pre-emptive. "You want Reflection to hold? Then tell me why I should trust a future self that I know is broken. And don't give me the Dutch Book. I can lose my own money if I want to."

  "You can't lose your own money if you don't exist," she said softly. "If you fragment yourself that much, if Three-AM-Me is just a stranger you're willing to let get robbed… then why are you even driving to the casino? Why not let him walk?"

  "Because he thinks he can win."

  "Even though you know he won't?"

  "Because he doesn't know what I know." He pressed the gas. The car lurched forward. "And that's the only reason any of us do anything, isn't it? We think the next version of us will be smarter than the last. Even when we know we're just getting older."

  She sat back, turning to the window. "That's not Reflection. That's hope."

  "Same thing," he said. "Just depends on what odds you're willing to take."
