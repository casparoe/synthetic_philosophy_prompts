prompt: |-
  I'm teaching a grad seminar on medieval Islamic philosophy of nature and I want to use al-Ghazālī's attack on necessary connection as a way into a debate my students keep flattening into "science vs. religion," which drives me up the wall. So here's what I need from you: a dialogue between two philosophers who both accept the basic monotheist picture but disagree about whether created things have any genuine causal power of their own. Call them the Occasionalist and the Dispositionalist (or whatever names fit better). The Occasionalist takes the al-Ghazālī-style line — that we only ever observe A followed by B, never any necessity binding the two, and that on a robust doctrine of creation the only real agent is God, so fire doesn't burn and medicine doesn't cure; God simply produces the burning and the curing on the occasion of our using them. The Dispositionalist isn't some naive believer in scientific causation either; they think the best account of what scientific explanation actually does (interventions, manipulations, mechanisms, the difference between a correlation you can exploit and one you merely observe) shows there's real causal structure out there, and that occasionalism can't make sense of counterfactuals, of why some sequences are exploitable and others aren't, or of human responsibility. Both characters should be equally sharp: the Occasionalist should get to press that the Dispositionalist's powers are just occult qualities dressed up, and that constant conjunction plus divine habit does everything the other side needs; the Dispositionalist should get to press that occasionalism makes God the immediate author of every atrocity and turns natural science into mere bookkeeping of divine habits. Let them really engage each other's points rather than trading monologues, and let it end without a tidy winner — I want my students arguing about it on the way out the door.

  Oh, and one more thing: after the dialogue, don't just leave me with flowing prose. Give me a short JSON summary with these fields: dialogue (the full dialogue as one string), occasionalist_best_move (the single strongest point the Occasionalist made, a sentence or two), dispositionalist_best_move (same for the other side), shared_assumption (whatever both characters turn out to presuppose even though they'd probably deny it), and unresolved_issue (the question the exchange leaves hanging). Please keep the JSON valid, no comments, and make sure those two best moves are genuinely seperate points and not restatements of each other.
