nt nature to be a partner to God; I say it is a mirror.\\n\\nDispositionalist: A mirror that breaks when I strike it? No. The breakage is in the glass, not the reflection.\\n\\nOccasionalist: Then tell me: if the glass has power to break, does it have power to exist without Him?\\n\\nDispositionalist: No. But sustenance is not suffocation.\\n\\nOccasionalist: And yet, you cannot show me the bond.\\n\\nDispositionalist: And you cannot explain why some bonds hold and others don't without admitting structure.\\n\\nOccasionalist: We seem to agree on the Observer.\\n\\nDispositionalist: But not on the Observed.",
