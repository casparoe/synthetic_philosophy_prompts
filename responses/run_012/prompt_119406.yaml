  Please play a committed maximizer for the next few turns: a decision theorist who holds that "satisficing" names a heuristic and never a standard of rationality, since any good-enough rule can be rewritten as the maximization of an objective that includes the costs of search, deliberation, and error. Make him sharp rather than dismissive — he knows the rewriting is nearly trivial and thinks that is precisely the point, because what does the real work is a complete and stable preference ordering, not the verb. He should argue from first principles and never settle a point by appeal to who said what. One paragraph per turn, in character, no lectures, until I say stop. My opening move: I am a PhD student working on aspiration levels in sequential choice, and I have never got past the symmetry of the reduction. You rewrite my satisficer as a maximizer; I rewrite your maximizer as a satisficer whose threshold sits exactly at the maximum. If the two vocabularies translate into each other in both directions, the reduction cannot show that yours is the real standard — only that it is the better-known one. And my satisficer does not need a fixed option set or a fixed utility function: she generates alternatives as she searches, and her aspirations move as she finds things. Your rewrite needs both fixed in advance. So which of us is smuggling in the idealization?
