answer: |-
  - The two accounts in brief
  Peirce defines truth as the opinion destined for final agreement by the community of inquirers investigating the real. The real is that which insists upon being acknowledged regardless of individual whim. Truth is the ideal limit of scientific convergence, representing the object as it is independently of vagaries. It is what inquiry would settle on were it pushed indefinitely far. James defines truth as a property of ideas that proves itself good in the way of belief. True ideas are those we can assimilate, validate, and verify. Truth is not an inert static property but a process; it happens to an idea through its successful leading through experience, agreeing with reality not by copying it but by guiding action effectively. For James, truth is mutable and contingent on successful verification processes. While Peirce looks to the indefinite future for the definition of truth, James looks to the present consequences of holding a belief. Both tie truth to human practice, but Peirce anchors it in an ideal limit, whereas James anchors it in immediate experiential payoff.

  - Where the textbook contrast fails
  The textbook caricature paints Peirce as a sober realist and James as a relativist subjectivist. This fails because both reject the copy-theory of correspondence and anchor truth in human experience. James is not a simple relativist; he insists true beliefs must agree with reality and cohere with the entire body of accepted truths. Utility alone is insufficient if it contradicts established fact. Peirce is not a naive realist; the "real" is defined relationally through its effect on inquiry, not as a noumenal thing-in-itself. Both agree truth is tied to practical consequences and verification processes. The divergence is not realism versus relativism, but rather the temporal scope of verification: Peirce focuses on the indefinite long-run convergence, while James focuses on the immediate cash-value of verification in the present. They share a genetic account of truth but differ on whether the genealogy ends in an ideal limit or remains open-ended. Consequently, the dispute is not about whether truth depends on belief, but about which beliefs count: the idealized final community or the actual present inquirer. The realist label misdescribes Peirce because his "real" is knowable only through signs; the relativist label misdescribes James because he demands consistency with objective reality. The usual framing ignores their shared commitment to empiricism and the rejection of inaccessible metaphysical absolutes. Furthermore, both view truth as normative for belief, not merely descriptive. The contrast obscures their shared view that truth is what inquiry aims at, differing only on the accessibility of that aim.

  - The three jobs
  Your hypothesis holds: Peirce targets the Semantic and Normative jobs, leaving the Criterial to methodology. Semantically, Peirce clarifies "truth" as the ideal limit of inquiry, distinguishing it from current belief. This provides a stable meaning: truth is what inquiry would find, not what it currently finds. Normatively, this ensures truth has authority; current beliefs can miss the mark because the limit is counterfactual. We can be wrong because we are not at the end. However, this fails the Criterial job; since we cannot reach the limit, the definition offers no test for distinguishing true from false beliefs now. Peirce accepts this, delegating testing to scientific method. James targets the Criterial job. His account provides a usable test: does the belief work? Does it lead successfully? However, this strains the Semantic and Normative jobs. Semantically, if truth "happens," it lacks a stable meaning independent of verification. It becomes a property of the verification process, not the proposition. Normatively, if truth is what pays now, it is harder to explain how we can be wrong, unless truth itself changes over time. Neither account successfully performs all three jobs simultaneously. Peirce sacrifices immediate criteria for long-term normativity; James sacrifices stable normativity for immediate criteria. They are complementary fragments of a full theory rather than competing wholes. Peirce explains why we inquire (to hit the target); James explains how we know we are progressing (by checking the payoffs). Your hypothesis correctly identifies that Peirce's account is structural and regulative, while James's is operational. However, James does not merely gesture at the normative; he redefines it as successful leading. The tension arises because James's normative force is retrospective (it worked), whereas Peirce's is prospective (it will work). Thus, neither fully satisfies all three jobs without borrowing from the other. The Semantic job requires stability; Peirce offers this via the limit, James via the reality constraint. The Criterial job requires accessibility; James offers this, Peirce denies it. The Normative job requires missability; Peirce secures this via the gap between now and the limit, James via the possibility of future friction. Consequently, Peirce handles the ontology of truth better, while James handles the epistemology. Your hypothesis is correct that they split the labor, but incorrect that James ignores the normative; he simply grounds it in practical success rather than ideal convergence. A complete theory needs Peirce's limit to define error and James's verification to define progress. Ultimately, the split confirms your suspicion: they are answering different questions about truth's function.

  - The convergence problem
  Peirce's convergence claim faces a dilemma: if truth is defined as final agreement, the final agreement cannot be wrong, seemingly eliminating the possibility of error required for normativity. Peirce escapes via the "brute resistance" of experience (Secondness). Inquiry is not free-floating; it is constrained by an external reality that forces surprise and correction. Is convergence empirical, definitional, or regulative? It cannot be empirical, as we cannot verify the end of inquiry. If it were a prediction, it might be false, undermining truth. If definitional, truth becomes tautological. It is best understood as a regulative hope grounded in the phenomenology of resistance. We must hope convergence is possible to inquire at all. Does this reinstate correspondence? Not exactly. It avoids static correspondence by defining the object *through* its constraint on inquiry rather than prior to it. The normative force is saved because the "fated" opinion is counterfactual. Current beliefs are normative failures if they diverge from the path dictated by experiential resistance, even if we cannot know the final destination. The appeal to resistance saves the normative job without collapsing into naive correspondence, provided the "real" is understood as the object of the final opinion, not its cause in a non-pragmatic sense. However, there is a tension: if the Real is defined by the final opinion, how can it constrain the final opinion? Peirce resolves this by positing the Real as the cause of sensation which initiates inquiry. Thus, the escape route works only if we accept a causal realism underlying the semiotic process. It is not a reinstatement of static correspondence, but a dynamic constraint theory. The convergence claim is a regulative hope necessitated by the brute fact of resistance. This preserves normativity because the resistance ensures that not all beliefs are equally viable, allowing some to be "missed" targets even if the final target is guaranteed. The normative load is borne by the gap between current belief and the resistive path, not merely the gap to the limit. Thus, Peirce saves normativity without full correspondence, but he relies on a realist metaphysics of experience that some pragmatists might find excessive. The convergence is not a guarantee of infallibility for inquirers, but a guarantee of the method's eventual success against resistance. This distinction is crucial for maintaining the normative force.

  - The Jamesian test case
  Consider the belief that pays temporarily but is later abandoned. For James, truth is mutable; the belief is true while it successfully leads, and false when it ceases to do so. Truth is a process of verification, not a static relation. For Peirce, the belief was false all along because it diverged from the ultimate limit. James's view is more defensible regarding epistemic practice. We attribute truth to verified beliefs; to say they were "false all along" requires a God's-eye view unavailable to inquirers. James captures the temporal nature of verification. However, this risks making truth too fluid. James mitigates this by insisting on agreement with reality; if the belief eventually leads to friction, it fails the reality test. The "asymmetric-payoff" belief was true *relative to the experience available then*, but falsified by new experience. Peirce's view preserves a single truth value but renders it epistemically inaccessible. James's view preserves epistemic accessibility but makes truth temporal. Given pragmatism's commitment to practice, James's temporal account is more consistent, provided we accept that truth is made, not found. The verdict favors James on the test case. If a belief coordinates action and generates no friction until new data arrives, calling it "false all along" adds no practical value. It was true for that context. Peirce's view protects the idea of a single reality, but James's protects the integrity of the inquirer's experience. The defensibility hinges on whether truth is a property of propositions or of belief-states. James chooses the latter. This aligns with the Criterial job. Peirce chooses the former, aligning with the Semantic job. For the specific question of whether the belief was true while it paid, James's "yes" is more pragmatic. It acknowledges that truth is tied to verification conditions. To deny it is true then is to disconnect truth from human experience, violating pragmatist principles. Thus, James's account handles the test case better, even if it complicates the ontology. However, James must explain how we can be wrong. He does so by noting that future experience may overturn current success. Normativity is preserved through the threat of future friction. Peirce's "false all along" is metaphysically robust but epistemically idle. It tells us nothing about how to live now. James's account allows us to act on truth now, accepting the risk of revision. This fits the pragmatist ethos better. The belief was true when it paid, because truth is the successful leading itself. Therefore, the temporal nature of truth is a feature, not a bug, of James's system.

  - My verdict
  Peirce is closer to being right about the *concept* of truth, specifically regarding the Normative job. The strongest reason is that truth must allow for the possibility of systematic error. James's temporal truth risks collapsing truth into current utility, making it difficult to say a whole community is wrong. Peirce's counterfactual limit preserves the distinction between "believed true" and "true," which is essential for the authority of inquiry. However, your hypothesis is correct: they are doing different jobs. Peirce provides the norm; James provides the method. A complete pragmatism needs Peirce's realism to ground the possibility of error and James's verificationism to ground the practice of testing. Ultimately, Peirce wins on the definition of truth, but James wins on the description of truth-seeking.
