answer: |-
  # Q&A PREP SHEET: Normative Parasitism in NMT
  **Colloquium:** Translation Studies & NLP Lab Joint Host
  **Presenter:** [Your Name]
  **Audience:** 20 pax (Mixed TS, NLP, Phil, CogSci)
  **Goal:** Defend the "Normative Parasitism" thesis without getting bogged down in technical minutiae or ethical condemnation.

  ---

  ## STRATEGIC STANCE

  **Concede Up Front:**
  *   **The "Flawless" Hypothetical:** Acknowledge immediately that the "Overheard Interpreter" is a thought experiment, not a description of current commercial NMT. Current NMT *does* hallucinate. Your point is about the *architecture of accountability*, not current performance metrics.
  *   **Ethical Stakes:** Acknowledge that "parasitism" sounds pejorative. Clarify you are making a metaphysical claim about status, not necessarily a moral claim about labor (though they overlap).

  **Hold the Line On:**
  *   **Sensitivity ≠ Understanding:** Do not let them conflate context-awareness (attention mechanisms) with normative understanding (knowing *why* a norm matters).
  *   **Answerability:** Maintain that optimization via loss functions is not the same as being *answerable* to a norm. One is mathematical minimization; the other is social accountability.

  **Safely Dismiss:**
  *   **"Statistics are Shallow":** You can firmly reject the Hofstadter-style objection. Agree that statistics can be deep, but insist that depth doesn't equal normativity.

  ---

  ## THE EIGHT OBJECTIONS (Ordered by Damage Potential)

  ### 1. The "No Intent, No Translation" Objection
  **Who:** Philosopher of Language (Gricean)
  **The Question:** "You argue the system satisfies norms without understanding them. But on a Gricean account, translation is a speech act requiring communicative intent. If the system doesn't know it's interpreting a conversation, it isn't translating; it's just transducing data. If there's no translator, there's no translation. Doesn't this make your entire category of 'parasitic translation' a category error?"
  **The Reply (2 mins):**
  "I appreciate the precision. You're right that standard speech-act theory ties translation to intent. But I'm proposing we decouple the *product's status* from the *producer's psychology* because the industry already has. When a client accepts an NMT output as a 'translation' for legal purposes, they aren't buying intent; they're buying functional equivalence sustained by human oversight. My point isn't that the machine is a translator, but that the *practice* counts it as one while stripping away the accountability that usually comes with that title. The 'Overheard Interpreter' shows we can have the output without the agency. The danger isn't that we call it translation; it's that we think the norms travel with the text when they actually stay with the humans."
  **Candid Note on Soft Spot:**
  This is your biggest philosophical vulnerability. If they insist translation is *essentially* intentional, your thesis becomes a sociological observation about misuse rather than a philosophical claim about the technology. You are relying on a functionalist definition of translation that the Philosopher may reject outright.

  ### 2. The "Ethical Erasure" Objection
  **Who:** Senior Translation Studies Scholar
  **The Question:** "You call this 'parasitism,' which sounds critical. But by focusing on the system's lack of answerability, aren't you obscuring the very real human labor that cleans up these outputs? If the system is just a tool, the responsibility lies with the post-editor. Your framework risks absolving the developers and companies by treating the algorithm as a philosophical zombie rather than a product of exploitative labor practices."
  **The Reply (2 mins):**
  "That's a crucial distinction, and I want to be clear: 'Normative Parasitism' is designed to highlight exploitation, not hide it. By saying the system *cannot* be answerable, I'm arguing that we cannot treat it as a responsible agent. The problem arises when institutions treat the output *as if* it were answerable to norms of accuracy or ethics, while the system itself is optimized only for probability. My framework is meant to show that the 'human-in-the-loop' isn't just editing text; they are propping up the normative status of the machine. The labor isn't obscured; it's revealed as the invisible substrate keeping the 'translation' status alive."
  **Candid Note on Soft Spot:**
  TS scholars are sensitive to labor politics. If your tone sounds too analytic or detached, they will hear this as defending the tech. You must sound like you are on the side of the human translator, using philosophy to protect them, not to analyze them like specimens.

  ### 3. The "Loss Function is Normativity" Objection
  **Who:** NLP Engineer (Evaluation Metrics)
  **The Question:** "You say the system isn't answerable to norms. But during training, we penalize deviations from reference translations using loss functions. BLEU, COMET, human feedback—these are mathematical encodings of normative standards. If the model minimizes error against these standards, in what sense is it not 'answerable'? You're drawing a mystical line between math and norms."
  **The Reply (2 mins):**
  "It's not mystical; it's about the direction of fit. A loss function minimizes distance between vectors. It doesn't 'care' if it minimizes that distance by lying, hallucinating, or stereotyping, provided the vector is close to the reference. Normative answerability implies the ability to justify a choice when norms conflict—for example, accuracy vs. dignity. The model cannot justify; it can only optimize. When the metrics conflict with the norm (e.g., a fluent but biased translation scores high), the model follows the metric, not the norm. It simulates answerability statistically, but it cannot be held to account when the simulation fails."
  **Candid Note on Soft Spot:**
  Engineers hate "mystical" distinctions. If you can't explain the difference between optimization and accountability in concrete terms, they will dismiss this as anti-tech Luddism. Be prepared to give a concrete example where high metric scores equal normative failure.

  ### 4. The "Context is World, Not Text" Objection
  **Who:** Translation Studies Scholar (Descriptive/Expertise)
  **The Question:** "Your 'Overheard Interpreter' changes output when the transcript changes. You call that context-sensitivity. But for translators, context isn't just co-text; it's the situation, the power dynamic, the history. NMT sees tokens, not the world. By calling this 'context-sensitive,' aren't you lowering the bar for what context means to suit the machine?"
  **The Reply (2 mins):**
  "I'm not lowering the bar; I'm diagnosing the confusion. The industry claims NMT is 'context-aware' because it uses attention over previous sentences. I'm granting that technical point to make a stronger philosophical one. Even if we grant it sensitivity to textual context, it remains blind to situational context. My argument is that *even if* it were perfect at textual context, it would still be parasitic. I'm conceding the technical capability to isolate the normative deficit. The machine can track 'it' referring to 'the bank,' but it cannot track that 'bank' implies a financial institution with ethical obligations."
  **Candid Note on Soft Spot:**
  TS scholars may feel you are conceding too much to the NLP definition of context. Ensure you don't sound like you agree that textual co-text is sufficient for real-world translation tasks.

  ### 5. The "Embeddings are Representations" Objection
  **Who:** NLP Engineer (Multilingual Embeddings)
  **The Question:** "You claim the system has 'no stable representation of what was said.' But in multilingual embedding space, semantically similar concepts across languages are mapped to proximate vectors. That *is* a stable representation of meaning, however distributed. If you deny that, you're denying the architecture."
  **The Reply (2 mins):**
  "I'm not denying the vectors exist. I'm denying they represent *what was said* in the sense of a proposition held true by a speaker. The embedding represents statistical co-occurrence, not semantic commitment. In the 'Overheard Interpreter' thought experiment, changing one word shifts the vector trajectory entirely. There is no persistent 'gist' that survives the alteration, only a new calculation. A human translator holds a mental model of the speaker's intent that survives a typo; the model recalculates the world based on the typo. That instability is what I mean by lacking a stable representation of the *act*."
  **Candid Note on Soft Spot:**
  This is technically risky. If the CogSci person chimes in and says human memory is also reconstructive and unstable, your distinction blurs. Be careful not to idealize human cognition too much.

  ### 6. The "Symbiosis, Not Parasitism" Objection
  **Who:** Translation Studies Scholar / NLP Engineer (Low-Resource)
  **The Question:** "Parasitism implies the host is harmed. But translators use NMT to increase throughput, and NLP needs human feedback to improve. In low-resource languages, NMT preserves texts humans can't translate alone. Isn't this symbiosis? Why frame it as parasitic?"
  **The Reply (2 mins):**
  "Biological parasitism doesn't always kill the host immediately; it just extracts value without contributing to the host's normative goals. The 'host' here isn't the individual translator; it's the *practice* of translation. The system extracts the status of 'translation' without sustaining the norms that make translation valuable (trust, accountability, fidelity). In low-resource settings, the risk is higher: we accept outputs we cannot verify, sustaining a practice of 'translation' where no one can actually vouch for the meaning. That degrades the practice itself, even if it helps the individual workflow."
  **Candid Note on Soft Spot:**
  The low-resource argument is emotionally powerful. Saying NMT might harm low-resource preservation could alienate the engineer working on it. Acknowledge the utility but stand firm on the verification gap.

  ### 7. The "Hallucination" Objection
  **Who:** NLP Engineer (Evaluation) / TS Scholar
  **The Question:** "Your thought experiment relies on 'flawless rendering.' But NMT hallucinates. It makes things up. If it's not actually satisfying the norms of accuracy, your whole 'normative parasitism' argument falls apart. It's not parasiting norms; it's violating them."
  **The Reply (2 mins):**
  "Actually, hallucination strengthens the argument. If the system were just 'shallow,' it would produce gibberish. Instead, it produces *plausible* falsehoods that pass as translation until checked. This proves it is hooked into the norms well enough to mimic them, but not well enough to be bound by them. The 'flawless' scenario is the limit case to show that *even at its best*, the structural issue remains. The fact that it hallucinates shows it is optimizing for plausibility, not truth. That is the essence of normative parasitism: looking like it follows the rules while being incapable of following them."
  **Candid Note on Soft Spot:**
  Don't get stuck defending the "flawless" premise. Pivot quickly to the fact that "plausible falsehoods" are the real-world version of the thought experiment.

  ### 8. The "So What?" Objection
  **Who:** Cognitive Scientist / General Audience
  **The Question:** "Let's say you're right. It's parasitic, not shallow, no answerability. Does this change how we build models? How we evaluate them? Or is this just a new vocabulary for an old problem?"
  **The Reply (2 mins):**
  "It changes the intervention. If the problem is 'shallowness,' the solution is bigger models or more data. If the problem is 'normative parasitism,' the solution is institutional. We stop trying to make the model 'understand' and start regulating the *deployment*. We require human sign-off not as a patch, but as the constitutive element of the translation. It shifts the burden from engineering better AI to engineering better accountability structures around the AI. We stop asking the machine to be responsible and start asking the institutions to stop pretending it is."
  **Candid Note on Soft Spot:**
  This is the pragmatic test. If your answer is vague ("we need regulation"), you lose the engineers. If your answer is too radical ("ban NMT"), you lose the room. Keep it focused on *evaluation standards* and *disclosure*.

  ---

  ## THE "HOPE NOBODY ASKS" QUESTION
  **The Question:** "If the system is normatively parasitic and cannot be answerable, and if the practice is degraded by its use... should we be using it at all? Are you arguing for a moratorium on NMT in professional settings?"
  **Why it's dangerous:** It forces a political/ethical stance you may not want to take in an academic setting. It moves from "is" to "ought."
  **Prep:** Do not ban it. Argue for *reclassification*. "I'm not arguing for a moratorium, but for reclassification. We should stop calling it 'translation' without qualification. Call it 'automated draft generation.' The moment we label it translation, we invite the normative expectations it cannot meet. Change the label, and you change the liability."

  ---

  ## WEAKEST POINT IN YOUR POSITION
  **The Vulnerability:** The application of "Normative Answerability" to a non-agent.
  **The Attack:** Critics will argue that "answerability" is a concept that *only* applies to agents. Saying a system "lacks answerability" is like saying a rock "lacks morality." It's a category error.
  **Defense Strategy:** Don't defend the system's capacity. Defend the *social attribution*. "I am not claiming the system *should* be answerable. I am claiming that the *industry treats it as if it were*, while structurally preventing answerability. The category error is in the deployment, not my description of it."
  **Prep:** Be ready to admit that "parasitism" is a metaphor for a structural relationship, not a biological claim. If you get bogged down in defining "normativity," you lose. Keep it institutional.

  ---

  ## FINAL REMINDER
  You have the TS scholars on your side regarding the "human element," but they distrust your technical concessions. You have the NLP engineers on your side regarding "technical capability," but they distrust your philosophical conclusions. Your job is to be the bridge: show the TS scholars that the math *cannot* do what they fear/hope, and show the Engineers that the math *does not* do what they claim. Stay calm, concede the technical limits, hold the philosophical ground.
