      *   *Option B: Reject (3).* (This is the more standard "Lewisian" fallout).
          *   *Why?* (3) assumes $A \to B$ is a standard proposition that can appear in the condition slot of $P(\cdot | \cdot)$.
          *   *Implication:* Conditionals are not standard propositions. They don't have truth conditions in the classical sense. They might be "probability conditional" devices rather than truth-apt sentences.
