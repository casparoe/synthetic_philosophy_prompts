          *   *Semantics:* This points toward Expressivism (conditionals express degrees of belief, not facts) or Trivalent Logics (where conditionals lack a classical truth value in some worlds).
      *   *Synthesis for the Student:* The "illegitimate" step isn't a mathematical error, but a category error in assuming conditionals behave like ordinary propositions (Premise 3) while maintaining the strong link to conditional probability (Premise 1).

