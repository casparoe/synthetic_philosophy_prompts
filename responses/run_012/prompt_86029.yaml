answer: |-
  This is one of the best-known rabbit holes in decision theory and philosophy of action. Your gut is fluctuating because you are intuitively toggling between three different definitions of rationality that are in genuine tension with one another. You aren't missing something obvious; you are spotting the fault lines in the literature.

  Here is the breakdown of why your verdicts clash, which principle has the most traction among experts, and where the consensus actually ends.

  ### The Three Principles You Identified

  Let's evaluate your candidate principles against your cases.

  **(a) You're irrational iff your preferences are cyclic.**
  *   **Pros:** Explains Case 1 (defective state) and Case 7 (structural defect).
  *   **Cons:** Fails Case 3. If cyclic preferences are *inherently* irrational, then the person in Case 3 is still irrational, even if she successfully avoids losing money. But your gut (and most philosophers') says she is acting *rationally* by resisting. It also struggles with the "No Money" case: is a preference structure irrational if it can never manifest?
  *   **Verdict:** Too static. It conflates having a bug in your software with actually crashing the computer.

  **(b) You're irrational iff you're pumpable / take the bait.**
  *   **Pros:** Explains Case 2 (she loses money) and Case 5 (she loses the long-term reward).
  *   **Cons:** Fails the "No Money" test case. If a dragon has cyclic preferences but lives on a desert island with no trade, is it rational? Most say no; the *disposition* is the problem, not the outcome. It also struggles with Case 6: the individuals aren't pumpable, only the collective is.
  *   **Verdict:** Too contingent on the environment. Rationality is usually thought to be internal to the agent, not dependent on whether a predator is nearby.

  **(c) You're irrational iff you fail to stick to a plan.**
  *   **Pros:** Explains Case 3 and 4 (resolute choice is good) and Case 2 (failure to plan is bad). This is the **Diachronic Rationality** view.
  *   **Cons:** Requires redefining rationality. Standard economic theory says rationality is maximizing utility *at the point of choice*. This principle says rationality is maximizing utility *over the life of the agent*, even if it means violating local preferences.
  *   **Verdict:** This is the strongest contender, but it requires accepting a controversial shift in theory.

  ---

  ### Analyzing Your Cases Through the Literature

  Here is how specific schools of thought handle your specific scenarios.

  #### Cases 1 & 2: The Standard Money Pump Argument
  *   **The Consensus:** The standard argument (Davidson, McKinsey, Sugden) is not that cyclic preferences are logically impossible, but that they are **pragmatically self-defeating**.
  *   **The Tension:** In Case 2, you correctly note that no *single* swap is irrational by her own lights. This is the "Local vs. Global" problem.
  *   **The Resolution:** Most decision theorists argue that rationality requires **Dynamic Consistency**. If you know you will prefer B over C later, and C over A later, and A over B later, you cannot treat these as independent choices. You must treat them as a single package. If you don't, you are irrational.
  *   **Verdict:** In Case 1, she is *dispositionally* irrational (like a loaded gun in a safe). In Case 2, she is *actively* irrational because she fails to recognize the diachronic structure of the choice.

  #### Cases 3 & 4: Resolute Choice
  *   **The Theory:** This is Edward McClennen's *Rationality and Dynamic Choice*. He argues that a rational agent can adopt a "resolute" stance: "I will choose A, not because I prefer A to C right now, but because I prefer the *plan* that ends in A over the *plan* that cycles."
  *   **The Implication:** This validates your gut. It is rational to violate a local preference to satisfy a global plan.
  *   **The Controversy:** Traditional economists (and David Gauthier) hate this. They argue you can't just "choose" to ignore your current preferences. They prefer the "Sophisticated" view: you anticipate you will cycle, so you pre-commit (Case 4).
  *   **Verdict:** Case 4 (pre-commitment) is universally accepted as rational. Case 3 (willpower/resoluteness) is accepted by many philosophers but rejected by strict game theorists who think preferences must drive choice at every node.

  #### Case 5: Time Inconsistency vs. Cycles
  *   **The Distinction:** Your gut says this feels different. Philosophically, it often isn't. Hyperbolic discounting *creates* cyclic preferences over time-dated goods (Now-Me prefers Today-Cake > Tomorrow-Salad; Future-Me prefers Tomorrow-Salad > Today-Cake).
  *   **Why it feels different:** In the apartment case, the cycle is synchronic (A>B>C>A all at once). In the time case, the cycle is diachronic (Me-at-t1 vs Me-at-t2).
  *   **The Consensus:** Most view time inconsistency as a form of money pump vulnerability. The "weakness of will" is just the psychological name for failing to solve the money pump. However, some (like Derek Parfit) argue that if the "selves" are psychologically distinct enough, it's not irrationality, it's a conflict of interest between different people.
  *   **Verdict:** Logically identical to the apartment pump. Psychologically distinct.

  #### Case 6: Group Agency
  *   **The Theory:** This is the "Discursive Dilemma" (List & Pettit). A group can have rational members but irrational collective preferences (Condorcet's Paradox).
  *   **The Consensus:** Rationality is agent-relative. The *individuals* are not irrational. The *household*, if treated as a single agent, is irrational.
  *   **The Implication:** This proves that pumpability does not equal individual irrationality. It equals **agency failure**. If the household cannot aggregate preferences transitively, it is a defective agent, even if the components are fine.
  *   **Verdict:** Your gut is right. Pumpability tracks the rationality of the *unit of agency*, not necessarily the biological humans involved.

  #### Case 7: The Charity Pump
  *   **The Analysis:** Be careful here. If she cycles *on purpose* to donate, her preferences might not actually be cyclic over the apartments.
      *   If she values the donation, then Trade 1 isn't "Swap A for C + Fee." It is "Swap A for C + Warm Glow."
      *   If Warm Glow is part of the utility, she might prefer (C + Glow) > A, (B + Glow) > C, but A > (B + Glow). That restores transitivity.
  *   **If preferences remain cyclic:** If she admits "I hate losing the money, I hate the apartments cycling, but I want to help," then she is prioritizing a higher-order value over coherence.
  *   **The Consensus:** Rationality is usually defined as **instrumental coherence**. If her goal is "maximize apartment satisfaction + charity," and cycling achieves that best, she is instrumentally rational. But if her goal is "maximize apartment satisfaction," she is structurally irrational.
  *   **Verdict:** Your gut is right that the *structure* is defective, but rationality is about serving the agent's ends. If the end is charity via pump, it's a weird strategy, but not necessarily irrational. However, standard theory says: if you prefer the outcome of *not* cycling (keeping money) over cycling, but you cycle anyway, that's irrational.

  ---

  ### The "No Money" Test Case

  **Case:** Cyclic preferences, no assets, literally unpumpable.
  **Verdict:** **Irrational.**

  **Why:** This kills Principle (b). Rationality is about the **disposition** to choose, not the outcome of choice.
  *   **Analogy:** A person with a violent temper who lives on a deserted island is still violent. The lack of victims doesn't make the temper rational.
  *   **Theory:** This supports Principle (a) with a tweak: You are irrational if you possess a preference structure that *would* lead to self-defeat in normal conditions. The vulnerability is intrinsic to the agent, even if the environment doesn't trigger it.

  ---

  ### What is Settled vs. Contested

  You asked for straight talk on the state of the field.

  **Settled (mostly):**
  1.  **Transitivity is a norm:** In standard economics and decision theory, transitive preferences are a requirement for rationality. If you violate them, you are modeled as "irrational."
  2.  **Money pumps are bad for you:** Everyone agrees that if you get pumped, you end up worse off by your own lights (assuming no side-benefits like charity).
  3.  **Pre-commitment is rational:** Everyone agrees Case 4 is a smart move.

  **Genuinely Contested:**
  1.  **Does the pump prove irrationality?** Some (e.g., Gustafsson) argue the money pump argument is question-begging. It assumes you *must* trade if you prefer, but maybe rationality allows you to say "no" to a trade even if you prefer the other option, to avoid the cycle. (This is the Case 3 debate).
  2.  **Resolute Choice:** Is it psychologically/philosophically possible to "bind" your future self without external pre-commitment? McClennen says yes; standard game theory says no.
  3.  **Regret Theory:** Some theorists (Loomes & Sugden) argue cyclic preferences are rational because they account for "regret." I might prefer A>B and B>C, but choosing C over A makes me feel regret that changes the utility. They argue transitivity is too strict for human psychology.
  4.  **The "No Money" Case:** While most say "dispositionally irrational," pragmatists argue that if a defect has no counterfactual consequences, calling it "irrational" is metaphysical hand-waving.

  ### The Unifying Principle You're Looking For

  To nail down your own view, I recommend adopting **Diachronic Coherence**.

  **The Principle:** *An agent is rational if their choices maximize the satisfaction of their preferences over time, rather than at each isolated moment.*

  **How it handles your cases:**
  *   **1 (Passive):** Irrational disposition. The structure guarantees failure *if* activated.
  *   **2 (Pumped):** Irrational act. Failed to maximize over time.
  *   **3 (Resists):** Rational act. Sacrificed local preference for global coherence.
  *   **4 (Pre-commit):** Rational act. Externalized the diachronic coherence.
  *   **5 (Time):** Irrational. Failed diachronic coherence (unless viewed as conflict between selves).
  *   **6 (Group):** The *group* is irrational (fails coherence). Individuals are rational.
  *   **7 (Charity):** Depends on the goal. If the goal includes the donation, it might be coherent. If the goal is just apartments, it's incoherent.
  *   **No Money:** Irrational disposition. The *capacity* for coherence is broken.

  **What you have to give up:**
  You have to give up the idea that "Rationality = Satisfying your current strongest preference."
  Case 3 proves that sometimes, being rational means **overruling** your current strongest preference to protect your future self. This is the hard pill that standard microeconomics struggles to swallow, but it's the only way to make your verdicts hang together.

  **Final Recommendation:**
  Your gut is tracking **Instrumental Rationality** (achieving goals) rather than **Logical Consistency** (having tidy preferences). Stick with that. A preference structure is a tool for living. If the tool saws off the leg of the user (the money pump), the tool is defective, regardless of whether the user is currently holding it. The rational move is to fix the tool (Case 3/4), not to use it until you bleed (Case 2).
