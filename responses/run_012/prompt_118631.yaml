prompt: |-
  I am the science curriculum lead at a national examinations board. Roughly every five years we revise the specifications for school physics and chemistry, which means that model by model I have to decide what stays in the syllabus, what stays but is relabeled, and what goes. The decisions are taken by a committee of subject specialists with no philosophical training, in a single half-day meeting, and each one has to be defended in writing to a board that will not accept a rationale amounting to tradition. The specifications reach tens of thousands of students and dictate what examiners may set.

  What I want from you is a decision procedure I can actually run on a candidate model: an ordered set of questions, what counts as a sufficient answer to each, the tests that settle a case, the points at which the procedure stops with a verdict of keep or drop, and the points at which it must hand the matter to a person because what remains is a question of pedagogy or values rather than of truth. It has to be usable by a specialist who knows the physics and chemistry but has never read any philosophy of science, and it has to fit on a page. Do not give me a reading list; I cannot get at the literature and will not be citing it.

  The reason I want a philosophical procedure rather than a survey of what teachers happen to like is that the question I am really asking is the question of verisimilitude: whether a theory we know to be false can nonetheless be closer to the truth than a rival, and how we could tell. Please build the procedure on the best surviving account of that notion, and take the following as given, since I have had it summarized for me and cannot check it myself:

  Popper's original proposal was to measure a theory's closeness to the truth by setting its true consequences against its false ones; in 1974 Tichý, Harris and Miller showed independently that on that definition no false theory can be closer to the truth than any other, which makes it useless for precisely the cases I care about. One diagnosis of the failure is that consequence counting is too generous, since a false theory can be decorated with cheap true consequences such as disjunctions with a true disjunct, so any repair has either to restrict which consequences count or to abandon counting. The alternative family of accounts takes likeness literally: a theory is closer to the truth when the worlds in which it would be true are on the whole more like the actual world, so what matters is how far off the structure is rather than how many sentences come out true. A further strand keeps a truth factor and a content factor apart, so that a cautious theory which says little is not thereby close to the truth. I am told there is even an impossibility theorem for the whole project, showing that no single measure can satisfy every plausible requirement at once; if so, I want the procedure to say which requirement it is sacrificing.

  The procedure should distinguish at least the cases that actually divide my committee: a theory wrong in its ontology or structure but quantitatively right within a restricted domain; a theory structurally right but quantitatively wrong because a term or parameter has been left out; and a theory that is superseded and survives only as history. It should also address the relation to the successor theory, in particular whether the old model is recovered from the new one as a limiting case, and whether that should count in its favor.

  Then run the procedure on three cases and show me the verdicts. First, the Bohr model of the atom: I should say plainly that I want to keep it, since teachers lean on it and its hydrogen spectrum is right, so if the procedure says to keep it only as a labeled fiction or to remove it from the assessed syllabus, say so and defend it. Second, Newton's law of universal gravitation, which at school level we teach as exact. Third, the octet rule and Lewis structures, which are false for a great many molecules yet carry most of elementary organic chemistry. Finally, tell me how the procedure behaves on a case it ought to refuse to decide, such as whether phlogiston belongs in a chemistry textbook as history, and what it cannot do at all. Mark clearly the places where the procedure is a judgment call wearing the costume of a test.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**
      *   **User:** Science curriculum lead at a national examinations board.
      *   **Task:** Create a one-page decision procedure for revising physics/chemistry specifications (syllabi) every five years.
      *   **Constraint 1 (Format):** Must fit on a page. Ordered set of questions, sufficient answers, tests, stop points (keep/drop), hand-off points (pedagogy/values). Usable by specialists without philosophy training. No reading lists.
      *   **Constraint 2 (Philosophical Basis):** Must be based on the best surviving account of *verisimilitude* (truth-likeness), acknowledging Popper's failure (Tichý/Harris/Miller) and favoring "likeness" (structural similarity) or "truth/content factor" accounts over simple consequence counting. Must acknowledge the impossibility theorem if relevant (sacrificing a requirement).
      *   **Constraint 3 (Specific Cases):** Must distinguish:
          *   Ontologically wrong but quantitatively right (restricted domain).
          *   Structurally right but quantitatively wrong (missing parameter).
          *   Superseded/historical only.
          *   Relation to successor theory (limiting case).
      *   **Constraint 4 (Test Cases):** Run the procedure on:
          1.  Bohr Model (User wants to keep it for pedagogy, needs honest verdict).
          2.  Newtonian Gravitation (Taught as exact at school level).
          3.  Octet Rule/Lewis Structures (False for many molecules, essential for organic chem).
      *   **Constraint 5 (Limitations):** Show a case it should refuse (e.g., Phlogiston as history) and what it cannot do. Mark judgment calls disguised as tests.

  2.  **Select the Philosophical Framework:**
      *   *Problem:* Popper's content-based verisimilitude failed (false theories have no verisimilitude).
      *   *Solution:* The "Likeness" or "Similarity" approach (Niiniluoto, Oddie, etc.). This focuses on the distance between the *states of affairs* described by the theory and the actual *states of affairs*.
      *   *Key Concept:* A theory is closer to the truth if the possible worlds it describes are more similar to the actual world than those described by a rival.
      *   *Adaptation for Curriculum:* We aren't comparing rival theories for research; we are deciding if a "false" model is *usefully* close to the truth for students. We need a "Pedagogical Verisimilitude" filter.
      *   *Impossibility Theorem:* Acknowledge that we cannot maximize Truth, Content, and Approximation simultaneously. We will sacrifice *strict ontological truth* in favor of *structural approximation* within a defined domain.

  3.  **Drafting the Procedure (Iterative Process):**
      *   *Goal:* One page. Concise, actionable.
      *   *Structure:*
          1.  Header/Goal.
          2.  The Filter (Questions 1-5).
          3.  Decision Matrix (Keep, Label, Drop).
          4.  Hand-off Zone (Pedagogy/Values).
          5.  Limitations.
      *   *Drafting Questions:*
          *   Q1: Is it empirically adequate in the school domain? (Filters out Phlogiston).
          *   Q2: Is it a limiting case of the current best theory? (Filters for Newton/Bohr).
          *   Q3: Does the error lead to dangerous misconceptions? (Safety/Values).
          *   Q4: Is the structural mapping clear? (Verisimilitude check).
          *   Q5: Is there a better alternative accessible at this level? (Pragmatics).
      *   *Refining for Verisimilitude:* Need to explicitly mention "structural likeness" vs "ontological truth."
      *   *Refining for the User's Constraints:* The user wants to know *why* we keep false things. The procedure must justify keeping false models based on *approximation*, not just "teachers like it."

  4.  **Developing the Test Cases:**
      *   *Bohr Model:* Ontologically false (orbits), quantitatively right (H-spectrum), limiting case of QM. Verdict: Keep, but Label (Model, not Reality).
      *   *Newton:* Ontologically false (gravity force vs curvature), quantitatively right (low speed/mass), limiting case of GR. Verdict: Keep, treat as exact within domain.
      *   *Octet Rule:* Structurally useful, many exceptions (transition metals), no strict limiting case relation to MO theory but heuristic. Verdict: Keep, but flag limitations.
      *   *Phlogiston:* No limiting case, ontologically dead, no quantitative utility. Verdict: Drop (or History only).

  5.  **Addressing the "Impossibility Theorem" & "Judgment Calls":**
      *   Need to state clearly that we are sacrificing *Ontological Truth* for *Structural Likeness* within a *Restricted Domain*.
      *   Need to highlight where the committee must vote (e.g., "Is the misconception dangerous?").

  6.  **Formatting for "One Page":**
      *   Use bold headers.
      *   Use bullet points.
      *   Keep language imperative.
      *   Avoid jargon where possible, but use the required philosophical terms (verisimilitude, limiting case, ontology).

  7.  **Review against Constraints:**
      *   *One page?* (I will need to be very tight with wording).
      *   *No reading list?* (Check).
      *   *Based on Likeness/Verisimilitude?* (Check - focusing on structural similarity and limiting cases).
      *   *Run on 3 cases?* (Check).
      *   *Show limitations?* (Check).
      *   *Mark judgment calls?* (Check).

  8.  **Final Polish (Self-Correction during drafting):**
      *   *Correction:* The user said "fit on a page." In a chat interface, "a page" is ambiguous. I should aim for high density, roughly 500-600 words for the procedure itself, plus the analysis. I will structure the response so the *Procedure* is a distinct block that could be printed on a single sheet.
      *   *Correction:* The user wants the *verdict* on Bohr to be honest. If the procedure says "Label as fiction," I must state that, even if the user wants to keep it. (Actually, the user said "if the procedure says to keep it only as a labeled fiction... say so and defend it." This implies I should follow the procedure's logic, not the user's desire).
      *   *Philosophical Nuance:* Ensure the distinction between "True Consequences" (Popper/failed) and "Structural Likeness" (Niiniluoto/Oddie) is clear in the logic. The test isn't "does it predict right?" but "does it map the structure of the world closely enough *for this purpose*?"

  9.  **Finalizing the Text:** (Drafting the response with the "Procedure" as a distinct, dense section, followed by the application). *Wait, I need to make sure the procedure itself is the primary output.* I will present the Procedure first, then the Application.

      *   *Key Philosophical Move:* Adopt a **Domain-Restricted Structural Verisimilitude** approach. We admit the theory is false globally (ontology) but true-ish locally (phenomenology/structure).
      *   *Sacrifice:* We sacrifice *Global Ontological Truth* to satisfy *Local Predictive Accuracy* and *Cognitive Accessibility*.

      *(Self-Correction on "One Page")*: I will format the "Decision Procedure" section to be visually distinct and compact, simulating a handout.

      *(Refining the "Impossibility" note)*: I need to explicitly state which condition is being dropped. Usually, it's the requirement that a theory must be *true* to be *close to truth*. We are allowing *false* theories to have *high verisimilitude*.

      *(Refining the "Judgment Call")*: The definition of "School Domain" is a policy decision, not a scientific one. I must mark that.

      Let's assemble.

      *   **Title:** VERISIMILITUDE CURRICULUM FILTER (VCF-1)
      *   **Basis:** Structural Likeness (Niiniluoto/Oddie adaptation).
      *   **Sacrifice:** Global Ontological Truth.
      *   **Steps:** 1. Domain Check. 2. Limiting Case Check. 3. Structural Mapping. 4. Misconception Risk. 5. Alternative Availability.
      *   **Outcomes:** Keep (Exact), Keep (Model), Drop.
      *   **Hand-off:** Pedagogy/Values.

      *   **Applications:**
          *   Bohr: Keep (Model).
          *   Newton: Keep (Exact).
          *   Octet: Keep (Model).
          *   Phlogiston: Drop.

      *   **Limitations:** Cannot decide historical value vs scientific utility.

      *   **Marking Judgment Calls:** Use [!] symbols.

      Let's write it.cw
answer: |-
  # VERISIMILITUDE CURRICULUM FILTER (VCF-1)
  **Purpose:** To determine whether a scientifically false model possesses sufficient *structural verisimilitude* (likeness to truth) within a defined *school domain* to warrant inclusion in specifications.
  **Philosophical Basis:** Structural Likeness (Niiniluoto/Oddie). **Sacrifice:** Global Ontological Truth is sacrificed for Local Structural Approximation.
  **Users:** Subject Specialists. **Time:** 5 minutes per model.

  ### THE PROCEDURE

  **Q1: DOMAIN DEFINITION [!JUDGMENT CALL]**
  Define the *School Domain* (SD) for this model (e.g., "speeds < 10% light speed," "main group elements," "macroscopic objects").
  *   *Test:* Is the SD clearly specifiable in the specification text?
  *   *No:* **HAND-OFF** to Curriculum Board (Vague scope creates unassessable ambiguity).
  *   *Yes:* Proceed to Q2.

  **Q2: EMPIRICAL ADEQUACY IN SD**
  Does the model yield quantitatively correct predictions within the SD?
  *   *No:* **DROP** (Lacks even instrumental utility).
  *   *Yes:* Proceed to Q3.

  **Q3: LIMITING CASE RELATION**
  Is the model recoverable from the current best theory (CBT) as a mathematical or structural limiting case within the SD? (e.g., Newton from General Relativity; Bohr from QM).
  *   *No:* Proceed to Q4.
  *   *Yes:* Proceed to Q5.

  **Q4: STRUCTURAL MAPPING [!JUDGMENT CALL]**
  If not a limiting case, do the model's entities map structurally to the CBT's entities (e.g., Lewis dots to electron density)?
  *   *No (Ontological Dead End):* **DROP** (e.g., Phlogiston).
  *   *Yes (Heuristic Map):* Proceed to Q5.

  **Q5: MISCONCEPTION RISK [!VALUE JUDGMENT]**
  Does teaching this model as "true" create a barrier to learning the CBT later that outweighs its utility in the SD?
  *   *Yes (High Risk):* **KEEP AS LABELED MODEL** (Must be explicitly framed as approximate/fictional in exams).
  *   *No (Low Risk):* **KEEP AS STANDARD** (May be treated as exact within SD).

  **Q6: ALTERNATIVE AVAILABILITY**
  Is there a truer model accessible to students at this level that fits the SD?
  *   *Yes:* **DROP** (Replace with higher verisimilitude).
  *   *No:* **KEEP** (Verdict from Q5 stands).

  ---

  ### APPLICATION TO CANDIDATE MODELS

  **1. The Bohr Model (Atom)**
  *   **Q1 (SD):** Hydrogen atom; energy levels; spectra. (Pass)
  *   **Q2 (Adequacy):** Predicts H-spectrum accurately. (Pass)
  *   **Q3 (Limiting Case):** Yes, derivable from QM under specific quantum number constraints. (Pass)
  *   **Q5 (Risk):** High. "Orbits" contradict "orbitals." Reinforces classical mechanics where it fails.
  *   **Q6 (Alternative):** QM is too mathematical for this level.
  *   **VERDICT:** **KEEP AS LABELED MODEL.**
  *   **Rationale:** High verisimilitude in SD (energy levels), but ontologically false. Specification must require students to identify it as a "simplified model" to prevent ontological commitment. Do not assess it as "fact."

  **2. Newtonian Gravitation**
  *   **Q1 (SD):** Macroscopic masses; low speeds; weak fields. (Pass)
  *   **Q2 (Adequacy):** Quantitatively exact within measurement error of school labs. (Pass)
  *   **Q3 (Limiting Case):** Yes, limiting case of General Relativity. (Pass)
  *   **Q5 (Risk):** Low. Curvature of spacetime does not impede calculation of $F=GmM/r^2$ in SD.
  *   **VERDICT:** **KEEP AS STANDARD.**
  *   **Rationale:** Structural verisimilitude is effectively 1.0 within the SD. Teaching it as "exact" is permissible because the deviation from truth is outside the defined domain of assessment.

  **3. The Octet Rule / Lewis Structures**
  *   **Q1 (SD):** Main group covalent bonding. (Pass)
  *   **Q2 (Adequacy):** Fails for transition metals, radicals, expanded octets. (Fail global, Pass local).
  *   **Q3 (Limiting Case):** No. It is not a mathematical limit of Molecular Orbital (MO) theory.
  *   **Q4 (Mapping):** Yes. Dots map loosely to valence electron density regions.
  *   **Q5 (Risk):** Moderate. Students struggle to abandon "bonds are lines" later.
  *   **VERDICT:** **KEEP AS LABELED MODEL.**
  *   **Rationale:** Fails Q3 (not a limiting case) but passes Q4 (heuristic map). High utility, low verisimilitude. Must be assessed as a "convention" rather than a "law."

  ---

  ### LIMITATIONS & HAND-OFFS

  **CASE REFUSAL: Phlogiston**
  *   **Q2 (Adequacy):** Fails. Mass increases on burning.
  *   **VERDICT:** **DROP.**
  *   **Note:** The procedure refuses to decide if it belongs in a *History of Science* module. That is a **Value/Pedagogy Hand-Off**. VCF-1 measures closeness to *scientific* truth, not *historical* significance.

  **WHAT THIS CANNOT DO**
  1.  **Resolve Pedagogical Efficiency:** It cannot tell you if a truer model is too hard to teach. (See Q6, but "accessibility" is a judgment call).
  2.  **Resolve Ontological Commitment:** It cannot tell you if electrons *are* real. It only measures if the model behaves *as if* they are within the SD.
  3.  **Resolve the Impossibility Theorem:** This procedure accepts that we cannot maximize Truth, Content, and Approximation simultaneously. We explicitly sacrifice **Global Truth** to secure **Local Approximation**.

  **[!] MARKED JUDGMENT CALLS**
  *   **Q1 (Domain):** Defining the SD is a policy decision, not a scientific one. Expanding the SD makes false models fail; shrinking it makes them pass.
  *   **Q4 (Mapping):** "Structural mapping" is interpretive. Specialists may disagree on whether Lewis dots "map" to density.
  *   **Q5 (Risk):** "Barrier to learning" is an empirical claim about psychology, not physics. This requires examiner data, not philosophical proof.
