  Cranium Systems Internal Specification: Mentalese v4.2.0-LTS
  Owner: Unassigned (Legacy Core)
  Status: Maintenance

  1. Overview
  This specification defines the API for the Thought Execution Environment (TEE). Mentalese serves as the proprietary intermediate representation for all cognitive modules. Note: This platform is in maintenance mode. No new features are planned.

  2. Lexicon Provisioning
  All primitive symbols are provisioned at firmware burn-in. The `POST /api/v1/lexicon/add` endpoint is deprecated. Requests to instantiate new primitives return `409 Conflict: Symbol Already Present`. This is works-as-intended. Dynamic concept acquisition is not supported. The lexicon is immutable post-deployment. See Changelog v3.1 for details on removed learning pipelines.

  3. Syntax and Validation
  Expressions must adhere to strict predicate-argument structure. Loose associative chaining is rejected by the parser.
  3.1 Systematicity Check
  The compiler enforces systematicity. If a formula `R(a,b)` compiles, `R(b,a)` must also be valid. Builds failing this symmetry check are halted. This ensures compositional semantics across modules. Failure to generate the converse relation triggers a build error.

  4. Recursion Limits
  Productivity is supported via arbitrary nesting of well-formed formulas. However, stack depth is constrained by hardware. Ticket #89402 (StackOverflow in Counterfactual Branch) remains open. Users should avoid infinite loops in subjunctive reasoning. Recursion depth is theoretically unbounded but practically limited by metabolic overhead.

  5. Encapsulation and Modularity
  The Central System module cannot be invoked from within peripheral input modules. Attempting to call `central.process()` from `vision.dll` results in `Error: Frame Problem`. Encapsulation is not supported by design. Information flow is unidirectional from module to central system. Cross-module state sharing is prohibited to prevent semantic leakage.

  6. Known Issues & Deprecations
  6.1 Connectionist Backend Integration
  Attempts to replace the symbolic backend with a distributed representation layer are unsupported. Ticket #77341 documents a failed migration attempt. Contractor J. Hinton (1998) filed the following complaint: "The proposed vector-space swap breaks causal potency guarantees. Reverting to symbolic tokens." Management response: "Whole approach unsupported." Ticket closed.
  6.2 Changelog v3.1
  Feature: "Runtime Concept Learning"
  Status: Wontfix
  Justification: "All concepts are innate."

  7. Support FAQ
  Q: How do I learn new words?
  A: See Section 2. Primitives are fixed.
  Q: Why does the compiler reject my metaphor?
  A: Metaphors are not well-formed formulas. Use literal predicate structure.
  Q: Can I modify the source code?
  A: Source is compiled into DNA. Read-only access only.
  Q: Is there a sandbox environment?
  A: No. Production environment only.

  © Cranium Systems. All rights reserved.
