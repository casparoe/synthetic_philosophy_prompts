answer: |-
  Here is the specification of desiderata required for Epistemic Utility Theory (EUT) to function as a complete normative account of credal rationality, rather than a mere consistency check. I have organized them into the three categories you requested, followed by the adjudication of your two specific trouble spots and the final verdict on the program's coherence.

  ### I. Substantive Cases: The Theory Must Get These Right

  1.  **The Incoherent Agent (The Coherence Requirement)**
      *   **The Case:** An agent assigns 0.7 to $P$ and 0.7 to $\neg P$. Their credences sum to 1.4.
      *   **The Requirement:** The theory must verdict this state as irrational *regardless* of the actual truth value of $P$.
      *   **Status:** **Non-negotiable.** If the theory allows incoherence, it fails as a theory of *rationality*, even if it allows it as a theory of *accuracy* (since the world could make them right). The theory must derive probabilism via dominance: there must be an alternative coherent state that is guaranteed to be more accurate (or lose less utility) in every possible world.

  2.  **The Demon Agent (The Luck Insensitivity Requirement)**
      *   **The Case:** A demon arranges the world to match an agent's wild, evidence-insensitive guesses. The agent assigns 0.99 to a proposition with no evidence, and the demon makes it true.
      *   **The Requirement:** The theory must verdict this agent as *accurate* but *unjustified*.
      *   **Status:** **Non-negotiable.** This is the boundary between epistemology and luck. If the theory identifies rationality solely with actual accuracy, it collapses. The theory must distinguish the *evaluation of the state* (accuracy) from the *evaluation of the adoption* (rationality). Rationality must be a function of the relation between evidence and credence, not just world and credence.

  3.  **The Indifferent Agent (The Categorical Normativity Requirement)**
      *   **The Case:** An agent admits their credences are inaccurate but states, "I simply do not care about truth or accuracy; I care only about comfort."
      *   **The Requirement:** The theory must verdict this agent as epistemically irrational, not merely instrumentally imprudent.
      *   **Status:** **Non-negotiable for a complete account.** If the norm dissolves when the desire for truth is absent, EUT is a theory of instrumental rationality relative to a goal, not a theory of epistemic rationality *simpliciter*. The "ought" must bind regardless of the agent's conative state.

  4.  **The Self-Doubting Agent (The Higher-Order Evidence Requirement)**
      *   **The Case:** An agent has strong first-order evidence for $P$, but reliable higher-order evidence that their cognitive faculties are currently compromised (e.g., they are drugged).
      *   **The Requirement:** The theory must allow that rationality requires lowering confidence in $P$, even if lowering confidence reduces the expected accuracy regarding $P$ itself (assuming the first-order evidence was strong).
      *   **Status:** **Non-negotiable.** A theory that forces agents to ignore evidence about their own reliability in favor of maximizing first-order expected accuracy fails to capture the reflective nature of rationality.

  ### II. Conceptual Distinctions: The Theory Must Not Collapse These

  1.  **Ex-Post Accuracy vs. Ex-Ante Justification**
      *   **The Distinction:** How well the credence matches the world (ex-post) vs. whether the credence was the right one to hold given the evidence (ex-ante).
      *   **The Requirement:** The scoring rule measures the former; the decision rule (maximize expected utility) measures the latter. The theory must explicitly prevent the scoring rule from being used directly as a norm of rationality without the mediation of expectation.
      *   **Status:** **Non-negotiable.** Collapsing these leads to the "Demon Agent" failure.

  2.  **Local vs. Global Accuracy**
      *   **The Distinction:** The accuracy of a single credence in isolation vs. the accuracy of the entire credence function over a partition.
      *   **The Requirement:** The theory must specify whether rationality is a local property (each credence optimized) or a global property (the whole function optimized). Standard EUT assumes global additivity, but this must be a stated commitment, not a hidden assumption.
      *   **Status:** **Commitment of the Standard Camp.** One could theoretically have a non-additive theory, but without additivity, the dominance arguments for probabilism typically fail.

  3.  **Precision vs. Imprecision**
      *   **The Distinction:** A single number (0.6) vs. a set of numbers ([0.4, 0.8]).
      *   **The Requirement:** The theory must specify whether imprecision is a distinct doxastic attitude or merely a placeholder for uncertainty about a precise attitude. It must not penalize imprecision simply for being less "sharp" if the evidence does not warrant sharpness.
      *   **Status:** **Commitment of the Precise Camp.** Standard EUT assumes sharp credences. Accommodating imprecision requires modifying the utility framework significantly.

  ### III. Formal Constraints: The Theory Must Live With These

  1.  **Strict Propriety**
      *   **The Constraint:** A scoring rule is proper if an agent maximizes expected score by reporting their true credence. It is *strictly* proper if only the true credence maximizes expected score.
      *   **The Requirement:** To derive Probabilism and Conditionalization, the rule *must* be strictly proper. If it is not, an agent could maximize expected accuracy by reporting a credence different from their actual belief (lying to the scorekeeper), which breaks the link between rationality and honesty.
      *   **Status:** **Non-negotiable.** Without strict propriety, the "report your credence" instruction is unstable.

  2.  **Partition Invariance and Infinity**
      *   **The Constraint:** Scoring rules are defined over partitions of possibilities.
      *   **The Requirement:** The dominance arguments for probabilism must hold when the partition is countably infinite, not just finite. Many scoring rules (like the Brier score) behave pathologically or require normalization adjustments when the partition grows infinite.
      *   **Status:** **Non-negotiable for a general theory.** If the theory only works for finite toy worlds, it cannot account for rational belief in propositions involving continuous quantities or infinite domains.

  ---

  ### IV. Adjudicating the Two Troubles

  **1. The Imprecise Credence Proposal (Minimax Scoring)**
  Your friend proposes scoring an imprecise state by the worst accuracy of any precise credence it permits (minimax), treating the state as justified if no other state does better.
  *   **The Adjudicating Requirement:** This turns on the **Faithfulness Requirement**. Does the credal state aim to *maximize accuracy* or to *faithfully represent the evidential support*?
  *   **The Verdict:** Your friend's proposal fails the **Coherence Requirement** as standardly defined. If you score by the worst member, a precise credence (say, the midpoint) will often dominate the imprecise set in terms of expected accuracy, forcing the agent to be more precise than the evidence warrants. To save the imprecise view, you must adopt a desideratum that **Evidence-Responsiveness trumps Accuracy-Maximization** in cases of ignorance. If you hold that the primary goal is accuracy (Veritism), the minimax rule is irrational because it leaves accuracy "on the table." If you hold that the primary goal is avoiding error (Error-Avoidance), minimax works. The desiderata list above does not settle this unless you add a requirement specifying the *weight* of precision vs. caution. Currently, standard EUT desiderata favor precision.

  **2. The Normative Force Problem (Accuracy-Only vs. Categorical Norms)**
  You note that EUT seems to say: "If you want accuracy, be probabilistic." You worry this fails the **Indifferent Agent** case.
  *   **The Adjudicating Requirement:** This turns on the **Constitutivity Requirement**. Is accuracy a goal the agent *happens* to have, or is it constitutive of the attitude of belief itself?
  *   **The Verdict:** Standard EUT cannot meet the **Categorical Normativity Requirement** on its own. It is a formal framework linking credences to accuracy. It contains no engine to generate an "ought" for an agent who rejects the goal. To fix this, EUT must be grafted onto a philosophical thesis: *Veritism*. This is the claim that belief *by its very nature* aims at truth, such that an agent who does not care about accuracy is not merely indifferent but *defective as a believer*.
  *   **The Conflict:** Here is the incompatibility you suspected. The **Accuracy-Only Claim** (that accuracy is the sole fundamental epistemic value) is in tension with the **Luck Insensitivity Requirement** (that the Demon agent is unjustified).
      *   If Accuracy is the *only* value, the Demon agent is epistemically perfect (they have the value).
      *   If the Demon agent is unjustified, then *process* or *evidence-responsiveness* is also a value.
      *   EUT tries to solve this by saying rationality is *Expected* Accuracy. But this makes rationality instrumental. If the agent doesn't care about accuracy, they don't care about expected accuracy.
      *   **Honest Verdict:** EUT cannot generate categorical normativity from accuracy alone. It requires an external norm: "You ought to care about accuracy." If you accept that external norm, EUT works. If you demand EUT generate that norm internally, it fails. The "Accuracy-Only" thesis is false if it implies accuracy is the only *source* of normativity; it must be the only *object* of value, but the *obligation* to pursue it must come from the nature of belief, not the math of scoring rules.

  ---

  ### V. Conclusion and Assessment

  The single requirement that does the most to rule out current views is the **Categorical Normativity Requirement**. It exposes that EUT is not a freestanding ethical system but a conditional bridge: it tells you how to get to accuracy, not why you must go there. Any package that claims to derive epistemic "oughts" purely from mathematical dominance without presupposing the value of truth is incomplete.

  **How the packages fare:**
  *   **Dominance/Probabilism:** Fares well on Coherence and Formal Constraints, but fails Categorical Normativity without external Veritism. It handles the Incoherent Agent perfectly but struggles to explain why the Incoherent Agent is *blameworthy* rather than just mathematically suboptimal.
  *   **Expected-Accuracy/Conditionalization:** Fares well on the Self-Doubting Agent (if higher-order evidence is integrated into the expectation) but is vulnerable to the Demon Agent objection unless "Expected" is rigorously distinguished from "Actual." It risks collapsing Ex-Post and Ex-Ante if not carefully framed.
  *   **Imprecise-Credence Alternative:** Fares poorly on the Formal Constraints (strict propriety is hard to define for sets) and the Coherence Requirement (minimax rules often violate dominance). It survives only if you prioritize the Faithfulness Requirement over Accuracy-Maximization, which effectively abandons the core "Accuracy-Only" motivation of standard EUT.
