  A father hands his son a sealed envelope before a high-stakes negotiation, saying, "This contains my advice; open it only if you freeze." The son recognizes the envelope as intentional communication (frame) and understands the conditional trigger as the decoding protocol (outer), but he never freezes during the meeting, so the specific advice inside (inner) is never read. Nevertheless, the tactile weight of the envelope in his pocket grounds his confidence, allowing him to close the deal successfully, which was the father's sole intention in giving it.

  In this case, meaning lived entirely in the interaction between the Frame and Outer levels; the Inner message was inert potential energy that functioned only as a totem. The Outer message ("open only if...") defined the object's role as a safety net, and the Frame ("from father") endowed it with authority, creating a psychological scaffold that supported the son's performance without the Inner content ever leaking out. The Inner message did no work; it was a prop whose value lay in its remaining sealed. If you ablate the Frame—say, the son finds the envelope anonymously on a chair—he ignores it or treats it as junk, the confidence boost vanishes, and the deal is lost; the system collapses because the "message-ness" is required to trigger the psychological effect. The strongest objection comes from a semantic transmission purist who argues that without the decoding of the Inner message, no actual communication occurred: "You didn't convey advice; you administered a placebo. A message that remains locked is just an object, and meaning requires the transfer of specific content, not just the vibration of context."
