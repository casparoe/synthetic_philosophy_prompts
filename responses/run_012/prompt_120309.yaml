prompt: |-
  So I've been rereading the Location of Meaning chapter in GEB and I want to stress-test the frame/outer/inner distinction with a case built to order. Quick gloss so we're on the same page: frame message is the stuff that tells you this is a message, from an agent, so decode it; outer message is the stuff that tells you how to decode it, what kind of thing it is, which key to use; inner message is the content that falls out once you've done that.

  Build me a realistic case — office, family, group chat, whatever, no ciphers that need math and no sci-fi — where all of the following hold at once:

  1. The frame message lands. The receiver registers that there's a message and a sender.
  2. The outer message lands, so the receiver picks the right decoding scheme.
  3. The inner message is never actually recovered. The receiver can't say what the content was, even afterwards.
  4. And yet the receiver ends up doing exactly what the sender wanted.

  Then show me where the meaning was living in that case. Which level was carrying the load, and was the inner message doing any work at all, or was it just along for the ride? Then run the ablation: pull the frame message out and tell me whether the whole thing collapses or whether something still gets through anyway. Then tell me the strongest objection from someone who thinks meaning has to be in the inner content — the person who says a message that's never decoded was never really a message.

  One paragraph for the case, then the analysis. Don't give me a general essay on the three levels, I want the case itself to do the work.
