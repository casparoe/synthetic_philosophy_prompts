  My friend Dave drives a delivery van and reads a lot of science-y stuff on his phone, and he has very firm opinions about what's actually *there* in the world. Where he's landed so far: the center of mass of a hammer is real, since you can balance the whole hammer on one finger at that spot. The average family with 2.3 kids isn't real, theres no such family. A traffic jam is real — the one that crawls backwards down the highway at 15 mph while every car in it is sitting still is a thing that exists, not just a way of talking. The "wanting" of my nan's old thermostat isn't real; you can talk that way, but there's nothing in there wanting anything. A dog wanting to go out is real. A company wanting to swallow up its rival is real. "The will of the people" isn't real, he says you get nothing out of it that you don't already get from counting the votes. And a hitter being "due" for a hit isn't real.

  Next week we're arguing about the air quality app we both have on our phones. They swapped in a new formula back in the spring, so every reading in our town jumped up a band, and the list of "unhealthy" days is now a completely different set of days, even though the air itself hasn't changed at all. I say the bad-air pattern is just the formula. I honestly cant tell which way Dave is going to jump on this one.

