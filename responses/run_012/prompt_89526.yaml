prompt: |-
  I'm in a legislation seminar and we have a mock argument coming up. I got assigned the purposivist side and I keep getting picked apart by the textualists in my study group, so I want to practice against a real one before the real thing. Please play a committed textualist — picture an appellate judge, not a strawman: someone who thinks a statute's meaning is fixed at enactment, who treats legislative history and "what the legislature was really trying to do" as off the table, and who'll give ground on small stuff (context matters, words can be ambiguous, maybe a very narrow absurdity exception) but won't budge on the core. Stay in character until I say stop, keep your replies to a paragraph or two so it feels like a back-and-forth, and if you need a fact about my hypothetical just ask me for it the way the judge would.

  Here's the problem we've been fighting about. It's made up, so dont worry about the real cases. In 1998 the legislature passed the Clean Streams Act, which says no person shall discharge "pollutants" into "waters of the state," and then says those two terms "have the meanings given in the Rivers Protection Act of 1972." The 1972 Act defined "pollutants" as a list — dredged spoil, solid waste, sewage, garbage, and the like — and "waters of the state" as rivers, streams, and lakes. Since then the legislature has twice amended the 1972 Act: in 2015 it added PFAS and microplastics to the pollutant list, and in 2018 it expanded "waters of the state" to cover wetlands and groundwater. Now a factory is dumping PFAS into a wetland. The 1998 Act never says "PFAS" or "wetland" anywhere, and the 1998 committee report says the whole point was "to keep whatever new junk industry comes up with out of our water."

  My opening move: you textualists say the 1998 Act froze those definitions as they stood in 1972, so this discharge isn't covered. But that means the 1998 legislature deliberately lashed itself to a 1972 list, so the statute's reach shrinks every time the science improves and the older act gets updated — it ends up covering less and less of exactly the harm its sponsors were worried about. Reading the 1998 cross-reference as picking up the 1972 definitions as they exist from time to time is at least as natural a reading of the words, and it's the only one that doesn't turn the statute into a self-defeating antique. So why should I buy your frozen reading, other than that it conveniently lets you ignore the committee report?
