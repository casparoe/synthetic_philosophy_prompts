answer: |-
  There is no single, established term in translation studies, musicology, or hermeneutics that captures this specific triad: an **external formal constraint** (melody, meter) forcing a **semantic re-weighting** (relocation of emphasis) that results in a **hermeneutic misattribution** (the audience reads the constraint as authorial intent).

  Existing terminology covers the components individually but fails to describe the specific causal chain you have identified. Here is an analysis of why the near-misses fail, followed by a proposed coinage that meets your criteria for boundaries and precision.

  ### Why Existing Terms Fail

  1.  **Translation Shift (Catford):** This is the closest existing category. However, "shift" is a neutral, microscopic term for any departure from formal correspondence (e.g., changing grammar, word order). It does not distinguish between a shift made for semantic clarity and a shift forced by an external physical constraint. It also implies nothing about the *reception* of that shift.
  2.  **Compensation (Harvey/Nida):** As you noted, compensation implies a transaction: a loss here is balanced by a gain there to preserve an overall effect. Your phenomenon is not a balance; it is a **displacement**. The emphasis isn't "compensated for"; it is moved to a location where it acquires a different theological weight due to the music's phrasing.
  3.  **Adaptation:** This implies the translator has taken liberty to rewrite for a new context. Your work is faithful line-by-line; the distortion is structural, not textual. Calling it adaptation blames the translator's strategy rather than the medium's constraint.
  4.  **Prosody / Underlay:** These are musicological terms describing the fit of text to music. A "bad underlay" describes a technical failure (stress mismatches). You are describing a *successful* underlay that creates a *theological falsehood*.
  5.  **Procrustean Translation:** This metaphor is sometimes used when text is cut or stretched to fit a form. However, it carries a connotation of violence or damage to the text's integrity, whereas your translations are fluent and faithful. It also lacks the specific hermeneutic component (the reader's misattribution).

  ### Proposed Coinage: Exogenous Formal Displacement

  I propose the term **Exogenous Formal Displacement** (EFD).

  This term is constructed to mark the specific edges you requested. It separates the mechanism from the reception while acknowledging their link.

  #### 1. Definition
  **Exogenous Formal Displacement** occurs when a pre-existing formal constraint (exogenous to the text) forces a translator to relocate semantic content within the target structure, resulting in a re-weighting of emphasis that the target audience misattributes to the original author's intent.

  #### 2. Boundaries and Edges

  *   **Exogenous vs. Endogenous:**
      *   *Included:* The constraint must be imposed from outside the text (e.g., a pre-existing melody, a fixed liturgical meter, a publisher's line-limit).
      *   *Excluded:* Constraints chosen by the translator (e.g., "I decided to translate this into sonnet form"). If the translator chooses the form, they own the emphasis. If the form is inherited, the emphasis is displaced by an external agent.
  *   **Formal vs. Semantic:**
      *   *Included:* The displacement is structural (line order, stanza placement, clause promotion).
      *   *Excluded:* Simple lexical substitution (changing "lamb" to "sheep" for rhyme). EFD specifically concerns the *architecture* of the argument or image.
  *   **Displacement vs. Shift:**
      *   *Included:* The content is moved to a position of different structural weight (e.g., from a passing clause to a cadence point).
      *   *Excluded:* Moves that do not alter the perceived hierarchy of information.
  *   **The Hermeneutic Component (The Reader):**
      *   *Is misattribution essential?* No. The **Displacement** is an objective textual condition. The **Misattribution** is the hermeneutic consequence.
      *   *Why this distinction matters:* If you translate a hymn for a drawer (no congregation), EFD still occurs textually (the emphasis is moved), but the *misattribution* lies dormant. The phenomenon is defined by the *capacity* of the displacement to deceive, not solely by the deception's success. However, in a liturgical context, the misattribution is the functional completion of the phenomenon.

  #### 3. Differentiation from Related Concepts

  | Concept | Mechanism | Agency | Reception |
  | :--- | :--- | :--- | :--- |
  | **Translation Shift** | Linguistic adjustment | Translator | Neutral |
  | **Compensation** | Loss/Gain balance | Translator | Intended |
  | **Adaptation** | Rewriting for context | Translator | Expected |
  | **Exogenous Formal Displacement** | **Structural relocation** | **Constraint (Melody/Form)** | **Misattributed to Author** |

  ### Why This Term Works for Your Context

  1.  **It absolves the translator without erasing the distortion.** It acknowledges that the "drift" is not a failure of skill (adaptation) but a mechanical inevitability (exogenous constraint).
  2.  **It isolates the "Silent Re-weighting."** By using "Displacement," you highlight that the content is not lost (as in "distortion") but moved to a place where it functions differently. A subordinate clause promoted to a main clause is still there, but it now carries the weight of a main clause.
  3.  **It marks the source of the error.** "Exogenous" signals that the "lie" comes from the *medium* (the tune), not the *message* (the German text).

  ### Usage Example

  You might write:
  > "While the lexical translation is faithful, the necessity of fitting the English to the German melody creates **Exogenous Formal Displacement**. The theological climax is displaced from the second stanza to the third to match the melodic high point. Consequently, the congregation experiences a **Hermeneutic Misattribution**, perceiving the melody's demand as the poet's intent."

  ### Summary

  There is no existing canonical term. **Exogenous Formal Displacement** provides the necessary precision. It covers the mechanical cause (external constraint), the textual effect (relocation of emphasis), and implies the hermeneutic risk (misattribution of intent) without requiring that every monolingual reader actually notice it for the term to apply. The displacement is objective; the misattribution is its liturgical consequence.
