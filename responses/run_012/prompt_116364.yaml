      *   *Ordering by Damage:*
          1.  Dean (Enforceability/Paralysis).
          2.  Student Reps (Discretion/Power).
          3.  English Teachers (Workload/Consistency).
          4.  Principal (PR/Parent Complaints).
          5.  Logic Teacher (Bivalence/Logic).
