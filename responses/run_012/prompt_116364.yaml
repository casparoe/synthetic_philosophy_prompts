      *   **Key Argument:** Vague terms have no sharp boundary (contra Epistemicism). Borderline cases are unsettled/underdetermined. Violation only if true on *all* admissible precisifications. Policy implication: Due process asymmetry (punishing unsettled cases is retroactive).
      *   **Audience:** Principal (fairness/PR), 2 English Teachers (clarity/consistency), Logic Teacher (bivalence/sorites/higher-order vagueness), Dean of Students (enforceability), 2 Student Council Reps (arbitrary enforcement/discretion).
      *   **Specific Tool:** "Honor Code Sorites" thought experiment (copying essay $\to$ AI rephrase $\to$ AI outline $\to$ discussion).
      *   **Deliverable:** Q&A Prep Sheet.
      *   **Requirements:** ~8 objections ordered by damage potential. Phrased by committee members (not philosophers). 2-minute replies. Vulnerability notes. Concession/Firmness advice. One "Dangerous Question" (hoped nobody asks).

  2.  **Deconstruct the Audience & Their Concerns:**
      *   *Principal:* Risk management. If the policy looks weak, parents complain. If it looks too harsh, students revolt.
      *   *English Teachers:* Wrote the code. Want it to work. "Vagueness" sounds like "loophole."
