  3.  **Drafting the Objections (Iterative Process):**
      *   *Goal:* 8 objections, ordered by damage.
      *   *Damage Assessment:* What kills the proposal?
          1.  **Enforceability (Dean):** If we can't punish, the code is useless. High damage.
          2.  **Arbitrariness (Student Reps):** If "admissible precisifications" is vague, adults pick winners/losers. High damage.
          3.  **Clarity/Consistency (English Teachers):** If every case is a debate, grading is impossible. High/Med damage.
          4.  **Logic/Coherence (Logic Teacher):** If the theory is flawed, the proposal lacks intellectual grounding. Med damage (mostly academic, but undermines credibility).
