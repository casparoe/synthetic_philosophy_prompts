      *(Self-Correction during drafting)*: Make sure the Logic Teacher's objection isn't *too* technical. They are a high school teacher, not a PhD. They will care about *teaching* the logic, not just the metaphysics. They will ask about the "Determinately" operator.
      Make sure the Student Reps sound like students, not lawyers. "This gives you guys more power."
