  # Decision Tree: Interpreting the Four-Cornered Negation

  **Instructions:** Start at the root. Answer each question based on how you believe the text functions. Do not worry about historical labels; follow the logic of your interpretation. The leaves represent distinct philosophical positions currently occupied by readers.

  ### Root: The Scope of the Tetralemma
  When you encounter a four-cornered negation (e.g., "Do things arise from self, other, both, or neither?" or "Does the Tathāgata exist after death?"), do you treat the four options as exhausting **all logical possibilities**, or only the possibilities available to **someone who believes things have intrinsic natures**?

  *   **A. All logical possibilities.** (Go to Node 1)
  *   **B. Only for someone believing in intrinsic natures.** (Go to Node 5)

  ---

  ### Node 1: The Mode of Rejection
  If the four corners cover all logical space, when Nāgārjuna rejects a corner, is he saying the proposition is **factually false**, or that it is **conceptually incoherent** (unassertable)?

  *   **A. Factually false.** (Go to Node 2)
  *   **B. Conceptually incoherent.** (Go to Node 3)

  ### Node 2: The Logical Cost
  If the propositions are false, and all four are rejected, do you preserve **classical logic** (which demands one be true) or **revise logic** (to allow all four to be negated)?

  *   **A. Preserve classical logic.** → **Leaf 1: Absolutist Nihilism**
      *   *Awkward Commitment:* Reality must be a literal void, because logic forbids any other option if all four descriptions are false.
  *   **B. Revise logic.** → **Leaf 2: Paraconsistent Madhyamaka**
      *   *Awkward Commitment:* True contradictions are possible, requiring a non-standard logic to prevent the system from exploding into nonsense.

  ### Node 3: The Status of the Question
  If the propositions are incoherent, is the error located in the **four answers** (all are wrong) or in the **question itself** (it is ill-posed)?

  *   **A. In the four answers.** → **Leaf 3: Global Error Theory**
      *   *Awkward Commitment:* Human thought is systematically distorted, making every possible answer to ontological questions wrong.
  *   **B. In the question itself.** → **Leaf 4: The Buddha's Silence**
      *   *Awkward Commitment:* Questions like the Tathāgata's status after death are categorially mistaken and merit silence rather than negation or assertion.

  ---

  ### Node 5: The Therapeutic Outcome
  If the tetralemma targets only belief in intrinsic natures, once that belief is cured, is there an **ineffable reality** left over, or is there simply the **cessation of the view**?

  *   **A. Ineffable reality left over.** (Go to Node 6)
  *   **B. Simply cessation of the view.** (Go to Node 7)

  ### Node 6: The Status of Ineffability
  If there is an ineffable reality, is calling it "ineffable" itself a **true description** of it, or merely a **pointer** that must also be discarded?

  *   **A. True description.** → **Leaf 5: Apophatic Realism**
      *   *Awkward Commitment:* It is truly the case that reality cannot be spoken of, which is itself a claim about reality.
  *   **B. Merely a pointer.** → **Leaf 6: Mystical Non-Dualism**
      *   *Awkward Commitment:* The distinction between speaking and not speaking is ultimately false, undermining the basis for teaching the distinction.

  ### Node 7: The Status of Conventions
  If there is simply cessation of the view, are conventional claims (e.g., "the particle has a position before measurement") **valid within their own framework**, or merely **useful fictions**?

  *   **A. Valid within their own framework.** (Go to Node 8)
  *   **B. Merely useful fictions.** → **Leaf 7: Radical Fictionalism**
      *   *Awkward Commitment:* All language is a lie, including the statement that language is a lie.

  ### Node 8: Self-Application
  If conventions are valid, does the Madhyamaka method of negation apply to **itself**, or is the method **exempt** from its own critique?

  *   **A. Method is exempt.** → **Leaf 8: Dogmatic Anti-Dogmatism**
      *   *Awkward Commitment:* The claim "no views are ultimately true" is the one view that is ultimately true.
  *   **B. Method applies to itself.** (Go to Node 9)

  ### Node 9: The Function of the Method
  If the method negates itself, is it primarily a **logical proof** demonstrating the limits of reason, or a **rhetorical performance** designed to induce a psychological shift?

  *   **A. Logical proof.** → **Leaf 9: Critical Philosophy**
      *   *Awkward Commitment:* Reason can demonstrate the limits of reason without transcending them, walking a razor's edge of coherence.
  *   **B. Rhetorical performance.** → **Leaf 10: Soteriological Instrumentalism**
      *   *Awkward Commitment:* The philosophy is a therapeutic fiction that must be discarded to work, leaving no knowledge behind.

  ---

  ### Unexplored or Incoherent Combinations
  *   **The "Fifth Corner" as a Positive Position:** Some readers ask if declaring a question "ill-posed" is a fifth corner. In this tree, that path leads to **Leaf 4 (The Buddha's Silence)**. A distinct fifth *positive* position (beyond silence) is left empty because it contradicts the exhaustive nature of the four corners without collapsing into **Leaf 6 (Mystical Non-Dualism)**.
  *   **Essence without Emptiness:** A position where things have essence but the tetralemma still applies is incoherent; the tetralemma is designed to show the absurdity of essence.
  *   **Indistinguishable Leaves:** **Leaf 9 (Critical Philosophy)** and **Leaf 10 (Soteriological Instrumentalism)** are separated by the intent of the text (epistemic vs. pragmatic), but in practice, a reader may find they cannot distinguish the *result* of one from the other; if you cannot say whether the silence is caused by logic or therapy, these two leaves merge for you.

  ### Note on Specific Cases
  *   **The Particle Case:** If you placed the "particle position" thesis under **Branch A (All logical possibilities)**, you are treating the tetralemma as a universal logic. If you placed it under **Branch B (Intrinsic natures)**, you are treating it as a targeted therapy. This determines whether you end up in **Leaf 2 (Paraconsistent)** or **Leaf 8 (Conventionalist)**.
  *   **The Tathāgata Case:** This specific query is the primary test for **Node 3**. If you treat the Buddha's silence as a negation of the fourth corner, you are in **Branch A**. If you treat it as a rejection of the question, you are in **Leaf 4**.
  *   **The Tree Turned on Itself:** This is explicitly handled in **Node 8**. If you say the tree itself is a fiction, you must proceed to **Node 9**; if you stop there, you occupy **Leaf 8**.
