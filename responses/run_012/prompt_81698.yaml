      *   *Legislative Mandate:* The legislature *requires* the guidelines to be defensible as what the offender *deserves*. This effectively mandates Position A for the *justification* of the sanction, but Position B constraints (risk instrument) must also be integrated.
      *   *The Tension:* How to mix "what you deserve" (backward-looking) with "what risk you pose" (forward-looking) without letting risk inflate desert (preventive detention disguised as punishment) or desert ignore risk (unnecessary harm).
      *   *The 40-Year Ceiling:* A hard cap regardless of desert or risk.

