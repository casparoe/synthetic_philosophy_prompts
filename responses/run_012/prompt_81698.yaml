          *   Track 1: Desert Range (Culpability).
          *   Track 2: Risk Assessment (Safety).
          *   Intersection: The sentence must fit within the Desert Range. Risk can recommend early release mechanisms or supervision intensity, but cannot extend the sentence beyond the Desert Ceiling. *However*, the prompt asks to "build in" the risk instrument. If high risk requires incapacitation beyond desert, the 40-year cap might catch it, but the philosophical conflict remains.
