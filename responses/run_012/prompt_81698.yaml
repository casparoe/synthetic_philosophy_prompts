          *   Risk: High.
          *   Integration: Sentence must fit Desert Range (Low). Risk cannot push it up.
          *   Result: Short sentence + high supervision? Or civil commitment? The procedure is for *sentencing*. If Desert is low, sentence is low. High risk is managed via supervision, not extra prison time.
