  # SENTENCING GUIDELINES WORKSHEET (FORM S-40)
  **Instruction:** Complete sequentially. Do not proceed to Section B until Section C is determined. Do not allow Section B data to influence Section A inputs. Time limit: 20 minutes.

  ### SECTION A: CULPABILITY (DESERT) CALCULATION
  *Purpose: Establish the punitive range justified solely by the offender's answerability for the harm caused.*

  **Q1: What is the Offense Gravity Score (OGS)?**
  *   **Input:** Statutory severity level (1–10).
  *   **Sufficient Answer:** Integer derived from conviction statute.
  *   **Stop Point:** If OGS < 2, proceed to Q4.

  **Q2: Are there Culpability Modifiers?**
  *   **Input:** Select all that apply. (Do not select risk factors).
      *   [ ] Intent was purposeful (+2)
      *   [ ] Intent was negligent (-1)
      *   [ ] Offender was coerced (-2)
      *   [ ] Offender exploited vulnerability (+1)
      *   [ ] **Moral Mitigation:** Severe childhood deprivation/untreated psychosis affecting capacity to grasp norms (-1 to -3). *Judge assigns value.*
  *   **Sufficient Answer:** Sum of modifiers.
  *   **Hand-off Point:** Assignment of "Moral Mitigation" value is a value judgment, not fact. Record rationale in Box M.

  **Q3: Calculate Desert Range.**
  *   **Formula:** Base Months (from OGS Table) + Modifier Months.
  *   **Output:** **Desert Minimum (D-min)** and **Desert Maximum (D-max)**.
  *   **Constraint:** If D-max > 480 months (40 years), record 480 but flag for Section E.

  **Q4: Does Desert Require Incarceration?**
  *   **Rule:** If D-max < 12 months, answer **NO**.
  *   **Action:** If NO, sentence is probation/community sanction. Stop.
  *   **Action:** If YES, proceed to Section B.

  ---

  ### SECTION B: ACTUARIAL RISK ASSESSMENT
  *Purpose: Determine safety constraints. Cannot increase Desert Range.*

  **Q5: What is the Risk Score?**
  *   **Input:** Run validated instrument (e.g., LS/CMI, COMPAS).
  *   **Sufficient Answer:** Low / Moderate / High / Very High.
  *   **Constraint:** Do not adjust score based on offense severity (already counted in Section A).

  **Q6: Does Risk Alter the Sentence Type?**
  *   **Rule:** If Risk = Low AND D-min < 24 months, recommendation is Non-Custodial.
  *   **Rule:** If Risk = Very High, recommend Maximum Supervision Post-Release.
  *   **Prohibition:** Risk score cannot increase D-max.

  ---

  ### SECTION C: SYNTHESIS & CEILING
  *Purpose: Locate specific term within Desert Range based on Risk.*

  **Q7: Select Term Within Range.**
  *   **Rule:**
      *   Risk Low → Sentence = D-min.
      *   Risk Moderate → Sentence = Midpoint.
      *   Risk High/Very High → Sentence = D-max.
  *   **Output:** **Proposed Term.**

  **Q8: Apply Legislative Ceiling.**
  *   **Rule:** If Proposed Term > 480 months, **Term = 480 months**.
  *   **Output:** **Final Recommended Term.**

  ---

  ### SECTION D: DEPARTURE LOG (MANDATORY)
  *If Final Sentence ≠ Recommended Term, check one box.*

  *   [ ] **Step A2 Failure:** Disagree with Culpability Modifier weight (Value Judgment).
  *   [ ] **Step B6 Failure:** Risk requires confinement beyond Desert (Safety vs. Justice).
  *   [ ] **Step C8 Failure:** Ceiling is insufficient for public safety (Legislative Constraint).
  *   [ ] **Other:** _______________

  ***

  # APPLICATION TO TEST CASES

  **Case (i): The Long-Term Incarcerate**
  *   **Profile:** 40 years served. High initial culpability. Current Risk = Low.
  *   **Procedure Run:**
      *   **Section A:** Desert was satisfied at year 40 (assuming original D-max was life/40+). Current Desert Balance = 0.
      *   **Section B:** Risk = Low.
      *   **Section C:** Term = 0 months remaining.
      *   **Result:** **Immediate Release.**
  *   **Director's Friction:** Politically difficult. If he reoffends, the Commission is blamed. But the procedure mandates release because desert is exhausted and risk is low.

  **Case (ii): The Dangerous Deprived**
  *   **Profile:** Severe psychosis/abuse (Culpability Low). Actuarial Risk = Very High (Violent recidivism).
  *   **Procedure Run:**
      *   **Section A:** Moral Mitigation (-3). D-max calculated at 36 months.
      *   **Section B:** Risk = Very High.
      *   **Section C:** Rule selects D-max (36 months). Risk cannot push to 10 years.
      *   **Result:** **36 Months + Maximum Supervision.**
  *   **Director's Friction:** **This is the answer you will not like.** The offender is statistically likely to reoffend violently upon release. The procedure forbids incapacitation beyond what is deserved. You must accept the risk or change the law.

  **Case (iii): The Heinous Offender**
  *   **Profile:** Multiple aggravated murders. Culpability extreme.
  *   **Procedure Run:**
      *   **Section A:** D-max calculated at 60 years.
      *   **Section B:** Risk = High.
      *   **Section C:** Proposed Term = 60 years.
      *   **Section D (Ceiling):** Truncated to 40 years.
      *   **Result:** **480 Months.**
  *   **Director's Friction:** The offender deserves more than the state is allowed to give. Victims may perceive this as injustice. The procedure absorbs this tension silently.

  ***

  # CRITIQUE & VULNERABILITY ANALYSIS

  **1. Where the Procedure Will Misfire**
  The procedure misfires in **Case (ii) scenarios** where risk is catastrophic but culpability is minimal. By strictly forbidding risk from inflating the desert range, the worksheet prioritizes individual justice over collective safety. If the "Very High" risk offender commits a new violent crime after 36 months, the procedure offers no defensive shield for the Commission. It assumes the state's right to punish ends where desert ends, even if the state's duty to protect remains unmet.

  **2. What It Cannot Do At All**
  It cannot resolve the metaphysical dispute between Compatibilist Desert and Basic Desert Skepticism. The worksheet *operates* as if Compatibilist Desert (Dennett-style) is true—treating offenders as answerable agents within a cooperative scheme. If the Hard Incompatibilist view (Caruso-style) is correct, Section A is morally illegitimate coercion. The procedure masks this philosophical uncertainty under bureaucratic calculation. It cannot justify punishment to a skeptic; it can only administer it.

  **3. The Single Undermining Consideration**
  **If Basic Desert is impossible.** If it turns out that moral responsibility requires contra-causal free will (which naturalism denies), then *no one* deserves punishment in the retributive sense. If this is true, Section A is a fiction. The entire worksheet becomes a mechanism for inflicting suffering without moral justification, violating the legislative mandate to defend ranges as "what the offender deserves." This would require scrapping the guidelines for a purely preventive/public health model.

  **4. Translation Error: Theory to Worksheet**
  The most likely error is in **Section A, Q2 (Moral Mitigation)**. Translating "culpability" into discrete month-values assumes a linear scale of blameworthiness that does not exist in moral philosophy. Assigning "-3 months" for "childhood deprivation" implies a precise exchange rate between suffering endured and punishment owed. This quantification smuggles utilitarian calculations into the desert framework, corrupting the separation of risk and culpability you required. Judges will inevitably adjust these numbers based on intuition about danger, not pure culpability, violating the "no contamination" rule.
