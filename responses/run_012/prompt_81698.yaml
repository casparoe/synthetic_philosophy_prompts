      *   *Goal:* Separate Culpability (Desert) from Risk (Safety).
      *   *Step 1: Culpability Score (Desert).* Based on offense severity and criminal history (as proxy for culpability/blameworthiness, not risk). This sets the *baseline* deserved punishment.
      *   *Step 2: Risk Adjustment (Safety).* Based on actuarial instrument. This can only *reduce* or *maintain* the desert baseline, or suggest non-custodial alternatives, but cannot *increase* it beyond desert (to avoid punishing for future crimes). *Correction:* The prompt says "build in an actuarial risk instrument." Usually, risk instruments increase sentences for high risk. But if the mandate is "defended as what the offender deserves," risk cannot *increase* desert. However, the legislature also requires the risk instrument. If risk suggests longer confinement for safety, but desert says less, we have a conflict.
      *   *Resolution Strategy:* The "Desert Ceiling" principle. Risk can only justify measures *within* the desert range, or alternative measures (probation) if risk is low. Risk cannot push punishment *above* what is deserved. But wait, if the state cannot punish without desert (Position B), then risk alone cannot justify prison. If the state *can* restrain/incapacitate (Position B), then risk could justify confinement even if desert is low, *but* the legislative mandate says "recommended range can be defended as what the offender deserves." This implies the *primary* justification must be desert.
