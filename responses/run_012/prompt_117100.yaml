      *Wait, is there a stronger candidate?* Some might argue (3) is the problem. "If no feature carries the same force... then no general claim... is true." This assumes a general claim *requires* invariant force. Particularists agree with this. So (3) is safe for the particularist.
      (1) is the definition. If we change (1), we change the terms of debate.
