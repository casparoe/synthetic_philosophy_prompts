      *   Is this regressional? No noise selection.
      *   Is this causal? Yes. The intervention (dampening) severs the causal link between the underlying state (wear) and the proxy (vibration), while the underlying state still causes the goal failure. Actually, the link between proxy and goal is broken because the proxy no longer reflects the state that causes the goal outcome.
      *   Refining the definition provided: "the regulator's own action causes the proxy-goal relationship to collapse".
      *   In the vibration case: Originally, Wear -> Vibration and Wear -> Failure. So Vibration ~ Failure. Intervention: Suppress Vibration. Now Wear -> Failure, but Wear -/-> Vibration. The correlation collapses because the regulator intervened on the proxy.
