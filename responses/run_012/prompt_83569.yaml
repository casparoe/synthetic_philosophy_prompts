      *   Classic Causal Goodhart example: Campbell's Law often implies causal mechanisms.
      *   Let's try a maintenance scenario.
      *   Scenario: A factory wants to prevent machine failure (goal). They measure "vibration levels" (proxy), as high vibration usually precedes failure. They install active dampeners to suppress vibration automatically whenever it rises. The vibration (proxy) stays low, but the machines fail anyway because the vibration was a *symptom* of wear, not the *cause* of failure, and suppressing the symptom prevented early detection maintenance.
