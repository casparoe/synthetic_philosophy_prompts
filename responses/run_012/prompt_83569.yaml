answer: |-
  A software development team aims to minimise system downtime and tracks 'daily error log count' as a proxy, assuming fewer errors indicate stability. To improve the metric, engineers install a filter that suppresses repetitive warning messages deemed non-critical. Consequently, the team loses early visibility into accumulating memory leaks that previously triggered those warnings, leading to unexpected crashes. The act of optimising the proxy directly severs the informational causal link required to maintain the goal, collapsing the correlation without any agent seeking to deceive the metric.

  **Demonstration of Specifications**
  *   **Regressional:** Absent. There is no selection effect where noise inflates the proxy; the proxy value is artificially lowered by intervention, not by statistical fluctuation in a tail distribution.
  *   **Extremal:** Absent. The underlying system state (server load, memory usage) does not necessarily enter a novel physical regime; the breakdown occurs because the observation mechanism is altered, not because the system operates outside its training distribution.
  *   **Adversarial:** Absent. The engineers share the principal's goal (minimising downtime) and do not intend to deceive stakeholders; the collapse results from a mistaken model of the proxy's utility, not divergent incentives.
  *   **Causal:** Present. The regulator's action (installing the filter) intervenes on the causal chain between the system state and the proxy, destroying the proxy's ability to predict the goal.

  **The Causal Feature**
  The single feature doing the work is the **intervention on the proxy's generation mechanism**. The regulators did not merely select for low log counts; they altered the process by which log counts are produced, thereby decoupling the proxy from the underlying reality it was meant to reflect.

  **Removal of the Feature**
  If this feature is removed (i.e., the filter is disabled and logs are recorded faithfully), the Goodhart effect disappears altogether. The correlation between log volume and system stability is restored because the informational pathway remains intact, allowing the team to respond to warnings before crashes occur.

  **Skeptic's Attack**
  A defender of the view that these variants are not distinct, or that causal Goodhart requires adversarial gaming, would argue that this is merely a subtle form of **adversarial Goodhart**. They would contend that by choosing to suppress data, the engineers effectively adopted a secondary goal (looking good on the metric) that conflicted with the primary goal (system stability), rendering the distinction between 'mistake' and 'gaming' semantic rather than structural. Alternatively, they might claim this is **extremal**, arguing that configuring the system with a filter constitutes a new region of the state space where the original model (logs predict crashes) was never validated.
