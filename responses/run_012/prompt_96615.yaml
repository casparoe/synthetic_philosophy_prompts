  Kael sat in the bunker with his lieutenant. The red light on his wrist pulsed like an infected wound. "It says we're aggressors," Kael said. "It says we're liable." The lieutenant smoked a cigarette, ignoring the glow. "You have a mortgage, Kael. You have a daughter. You fight because you're conscripted." "Excused isn't justified," Kael said. "If I know I'm wrong, I'm a murderer. The device took away the 'couldn't know' escape hatch." The lieutenant shrugged. "Then be a murderer. Or be a dead man. The device doesn't stop the bullet." Kael looked at the red number. It didn't fluctuate. The state had lied, and the machine had caught them. Now Kael had to choose between being a tool of injustice or a corpse. He chose the tool. He wasn't equal to the man across the valley. He was guilty of presence. The green light soldier was guilty of nothing, yet.

  3.
  Dr. Aris visited the front line. She built the estimator. Elias cornered her near the medevac pad. "It's green," he said, shaking his wrist. "Ninety percent. That means I'm clean." Aris looked at the device, then at Elias's mud-stained boots. "It measures *ad bellum*. The cause. It doesn't measure *in bello*. The conduct." "So if the war is just, I'm just." "No. You can fight a just war unjustly. The meter won't change." Elias frowned. The distinction didn't take. He wanted the green light to be a talisman. "If the cause is pure, the act follows." Aris stepped back. "The device removes the excuse of ignorance for the enemy. It doesn't give you a license for atrocity." Elias walked away. The light stayed green. He decided Aris was wrong. The number felt like absolution.

  4.
  The village was supposed to be empty. Intelligence said insurgents only. Elias's squad found women in the cellar. The wristband glowed steady green. The war was still just. The objective was still valid. A woman moved too fast. Elias fired. She fell. The green light didn't flicker. The algorithm didn't care about collateral damage unless it shifted the proportionality of the entire campaign. Elias felt the hum of the device against his radius. It felt like approval. He told himself it was approval. The separation of cause and conduct collapsed in his head. If the war is right, the killing is right. He wiped the blood from his optic. The number stayed at ninety-two percent. He felt safe. He was not equal to the man in the red light. He was better. He was justified.

  5.
  Kael ran out of ammo. He stood up. Hands high. His wrist glowed red, admitting his cause was false. He surrendered. He was no longer a threat. Under the laws of war, under any morality, he was safe. Elias approached. His wrist glowed green. The cause was true. He saw Kael's hands. He saw the red light. He remembered the woman in the cellar. The green light hummed, promising righteousness. Elias secured Kael. "You're lucky," Elias said. "We're the good guys." Kael looked at Elias's wrist, then at his bloodied rifle. "The meter measures the war, Elias. Not the hands." Elias looked down. The light stayed green. Kael died liable for the war. Elias lived liable for the murder. They were not equals. One was a soldier. The other was a criminal with a glow stick.

