answer: |-
  When the numbered steps run out, remember that a vague truth is no truth at all, and a detailed falsehood is worse than silence.

  **The Verisimilitude Procedure**

  1.  **Framework Check:** Does the answer use physical vocabulary (light, scattering, wavelength) rather than metaphor or personification? If no, route to Instructor.
  2.  **Claim Segmentation:** Identify distinct causal claims relevant to the mechanism (maximum 3). Ignore filler.
  3.  **Valuation:** Mark each claim **True** (matches key physics), **False** (contradicts key physics), or **Vacuous** (true but explains nothing, e.g., "light interacts").
  4.  **Scoring:** Start at 0. Add 1 for True, subtract 1 for False. Vacuous adds 0.
  5.  **Content Threshold:** If total specific claims (True + False) is less than 2, cap the maximum possible score at 50% of the assignment value.
  6.  **Falsity Veto:** If False claims equal or exceed True claims, the score is 0.

  **Application to "Why is the sky blue?"**

  *   **(a) Full Credit.** Three True claims (sunlight composition, scattering differential, redirection). High content, high truth. Verisimilitude is maximized.
  *   **(b) Zero.** Two False claims (absorption, re-emission). Though detailed, it moves away from truth. The Falsity Veto applies.
  *   **(c) Low/Capped.** One Vacuous claim ("air affects light"). Not false, but lacks content. The Content Threshold caps the grade.

  **Verdicts You Will Not Like**

  You will hesitate to assign zero to (b) and a failing cap to (c). Your TAs' instinct is to reward effort and penalize only explicit falsehoods; (b) looks like knowledge because it uses technical terms, and (c) feels safe because it isn't wrong. You will dislike these verdicts because they punish engagement and safety respectively.

  The procedure is right anyway because verisimilitude measures *closeness to truth*, not *effort* or *safety*. Answer (b) has negative verisimilitude; it confidently asserts a false mechanism, leading the student further from reality than ignorance would. Answer (c) has zero informational content; it occupies no space in the conceptual framework, offering no distance traveled toward the explanation. To maintain a curve that selects for competency, you must penalize confident error and vacuous safety equally.

  **Limitations and Judgment**

  The procedure handles "The sky is blue because the air is jealous of the sea" at Step 1. It is routed to you unscored because it belongs to a different framework (poetry vs. physics) and cannot be ranked by truth-content.

  However, the procedure cannot settle disputes about borderline relevance or claim segmentation. Determining whether "light interacts" is Vacuous or True depends on context not fully captured in the rubric. Step 2 (Claim Segmentation) is judgment wearing the costume of a procedure; a TA might see one claim where another sees two. This step is not algorithmic but disciplined interpretation. Furthermore, the procedure cannot resolve disputes where the key itself is a simplification known to be literally false (e.g., treating air molecules as static spheres). In those cases, the "True" valuation is provisional on the course's agreed framework, not absolute reality.

  Ultimately, this system makes the exchange rate explicit: one unit of truth content buys one point, one unit of falsity costs one point, but without minimum content, the currency is worthless. It forces TAs to stop marking for comfort and start marking for proximity to the physical world.
