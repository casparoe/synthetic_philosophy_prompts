answer: |-
  This is a solid position. Splitting the concept of rationality (act-evaluation vs. disposition-evaluation) is a classic move, but framing it as an *equivocation* rather than a *paradox* gives you a fresh angle. However, you are walking into a room full of people who have thought about Hitchhiker more than you have slept.

  Here is your Q&A prep sheet, ordered by the potential damage to your argument's viability.

  ### 1. The "Trench Coat" Objection (The CDTs)
  **Who:** The two Causal Decision Theorists.
  **The Objection:** "You claim the disposition is rational because it gets you the ride. But dispositions work by causing actions. If the disposition causes you to pay in town, and paying is causally dominated (you lose \$100 with no gain), then the disposition is a mechanism for producing causally irrational acts. Unless you're smuggling in Evidential Decision Theory—where the disposition *signals* to the driver you would pay—you haven't explained how the disposition has causal grip on the *past* offer. If it's just signaling, admit you're an Evidentialist."
  **The Damage:** **High.** If you can't explain the causal mechanism without collapsing into EDT, your "two concepts" solution looks like a verbal trick to hide an EDT commitment.
  **2-Minute Reply:** "I'm not claiming the disposition causally reaches back to change the driver's past decision. I'm claiming the *possession* of the disposition at $t_1$ is the causal condition for the offer. The rationality of the disposition is assessed *ex-ante* (at $t_1$), while the irrationality of the act is assessed *ex-post* (at $t_2$). The CDT agent can consistently hold: 'It was rational to acquire this disposition, but now that I have it and the ride is secured, it is irrational to exercise it.' The causal grip is on the *acquisition*, not the *execution*."
  **The Soft Spot:** This relies on the agent being able to "bracket" the *ex-post* irrationality. If rationality is action-guiding, and the agent knows paying is *ex-post* irrational, why doesn't that override the disposition *in the moment*? You're assuming the disposition is "sticky" enough to override current rational calculation, which needs a story about precommitment you might not have fully developed.

  ### 2. The "Parfit Exegesis" Objection (Your Supervisor)
  **Who:** Your Supervisor.
  **The Objection:** "In *Reasons and Persons*, Parfit distinguishes between 'directly' and 'indirectly' self-defeating theories. He argues CDT is indirectly self-defeating but not directly so. He explicitly addresses the 'two concepts' move and rejects the idea that it's a mere equivocation. Are you actually disagreeing with Parfit's diagnosis, or are you just renaming his 'indirect self-defeat' as 'equivocation' without adding theoretical value?"
  **The Damage:** **High.** This doesn't prove you're *wrong*, but it proves you might be *redundant*. If this is just Chapter 1 of *R&P* with new labels, your contribution evaporates.
  **2-Minute Reply:** "Parfit diagnoses a conflict within a single theory (CDT defeats itself). I'm arguing the conflict arises because we are sliding between two different *standards* of evaluation (act vs. agent). Parfit accepts CDT as the single standard and accepts the self-defeat. I'm suggesting the 'paradox' dissolves if we refuse to apply the act-standard to the disposition. It's not just renaming; it's a category error correction he didn't make."
  **The Soft Spot:** Parfit is very careful with his distinctions. If your supervisor presses you on specific footnotes where Parfit discusses "rationality of motives" vs. "rationality of acts," you need to be sure you aren't misreading him. Know Chapter 1, Section 4 cold.

  ### 3. The "Reinventing the Wheel" Objection (The Updateless Guy)
  **Who:** The Updateless Decision Theory (UDT) proponent.
  **The Objection:** "This is just policy selection. In UDT, we choose a policy $\pi$ that maximizes expected utility across all logical possibilities, including the driver's prediction. You're dressing up 'choose the optimal policy' as 'be the kind of person who pays.' Why should we prefer your conceptual split over the formal machinery that already solves this?"
  **The Damage:** **Medium.** It makes your work look philosophically naive or technically outdated. It suggests you're doing "armchair" work on a problem solved by formalists.
  **2-Minute Reply:** "Formal machinery tells us *what* to choose; I'm interested in *why* it feels paradoxical. The 'paradox of rational irrationality' persists in the literature because of the conceptual conflation. Even if UDT solves the choice, it doesn't dissolve the intuitive tension for non-formalists. My goal is conceptual clarity for decision theory broadly, not just for agents running UDT algorithms."
  **The Soft Spot:** If they press that "conceptual clarity" doesn't justify a PhD contribution without formal novelty, you might struggle. Be ready to defend the value of philosophical clarification over formal innovation.

  ### 4. The "Wrong Normativity" Objection (The Kantians)
  **Who:** The two Kantians.
  **The Objection:** "You're treating a promise as a transaction cost. If the hitchhiker has a moral obligation to pay, the prudential setup is irrelevant. By framing this as 'rational to be the kind of person who pays,' you're reducing a deontic requirement to a prudential strategy. Doesn't this miss the point that you *ought* to pay regardless of the ride?"
  **The Damage:** **Low.** This changes the subject from decision theory to meta-ethics. It doesn't falsify your claim about *prudential* rationality, but it sidelines your case study.
  **2-Minute Reply:** "I agree that moral reasons might override prudential ones. But the Hitchhiker case is specifically designed to test *instrumental* rationality in the absence of moral enforcement (the driver doesn't care about morality, only prediction). My thesis is about the structure of instrumental rationality, not the totality of reasons. We need to solve the prudential puzzle before we layer on the moral one."
  **The Soft Spot:** If they argue that "rationality" *just is* "responsiveness to all reasons," your prudential bracket looks artificial.

  ---

  ### What to Concede Up Front
  Don't fight battles you don't need to win. It makes you look confident.
  1.  **Concede to the Kantians:** Explicitly state in your intro or conclusion that you are bracketing moral obligation to focus on the decision-theoretic puzzle. "I am not arguing you shouldn't pay morally; I am arguing about the label 'rational'."
  2.  **Concede to the Updateless Guy:** Acknowledge that your view is *compatible* with policy selection. "I am not offering a new decision algorithm; I am offering a new interpretation of why the old puzzles feel paradoxical."

  ---

  ### The Dreaded Question
  **The Question:** "If it is irrational to pay *in the moment* (as you claim), but rational to have the disposition to pay, what happens when the agent is fully transparent to themselves? If the agent knows paying is act-irrational, can they really maintain the disposition without akrasia? Aren't you requiring the agent to be self-deceived to make your theory work?"

  **Why you hope nobody asks:**
  1.  **It targets your "Moral Psychology" side:** You claim expertise here, but this is the hardest problem in the field (the tension between rationality and transparency).
  2.  **It puts you in a bind with your Supervisor:** If you say "Yes, they need self-deception," you make rationality look pathological. If you say "No, they can be transparent," the CDTs will ask why the agent doesn't just drop the disposition once in town.
  3.  **It exposes the "Action-Guiding" flaw:** If rationality tells you to cultivate a disposition to do $X$, but tells you not to do $X$ when the time comes, is rationality coherent?

  **How to handle it if asked:**
  Do not bluff. Pause. Say: "That is the exact tension I'm working through in the next chapter. My tentative view is that 'rationality' functions differently at the level of planning vs. execution, and transparency doesn't collapse the distinction because the *reasons* for the disposition (securing the ride) remain valid even if the *reasons* for the act (saving \$100) dominate locally. But I grant this requires a robust account of diachronic agency." (Then look at your supervisor for mercy).
