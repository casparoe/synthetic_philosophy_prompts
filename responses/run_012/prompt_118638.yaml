prompt: |-
  Ok so this is a bit embarrassing to type out but here goes. For the last couple months my music app, on shuffle, keeps playing the same one song at moments where it's almost creepy how well it fits. Not a famous song, some deep cut. It came on the morning my ex finished moving her stuff out, then again right before my big interview, then the night I got the offer. Three or four times now. I mentioned it to my friend Dana and she said it obviously isn't chance, because the chance story makes you assume like twenty separate coincidences all lining up, whereas "something is going on" is one thing. One thing beats twenty. She also said imagine two machines, one that just spits out random songs and one thats built to play this song at the right moments, and the second one is a way shorter description of what actually happened.

  Honestly when she puts it like that it sounds right, and now I catch myself half waiting for the song to show up, which I know is nuts. I don't actually think the universe is sending me a soundtrack, but I can't say whats wrong with Dana's argument, and maybe nothing is? So how am I supposed to think about which explanation is really more likely here? I've heard the simpler explanation is usually the right one, but I've never understood what makes one explanation simpler than another. It seems to depend on how you write it down.
