  *(Self-Correction on User's Construction)*: The user's construction describes a situation where coordination fails because the chain is finite. This is exactly the Rubinstein Email Game result. I should tell them that their intuition is correct but the *mechanism* needs the Email Game structure to be demonstrable on a whiteboard without getting bogged down in probability calculus.

