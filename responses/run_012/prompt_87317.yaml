      *   *Example Choice:* Muddy Children is bad for *Game Theory*. It shows Common Knowledge of *Facts*, not Rationality. I must advise against it as the *carrier*. Replace with a Coordination Game where safety depends on certainty.
      *   *User's Construction:* It needs the "Email Game" logic. If I know you know... $k$ times, I can only trust you to reason $k-1$ times. If the risky move requires $k+1$, I won't do it.
      *   *Closing Question:* Needs to test the *discontinuity*, not the definition.

  8.  **Refining the "User's Construction" Critique:**
      *   The user asks: "Tell me whether it works as stated or whether I must specify the payoffs and the knowledge structure more carefully first."
      *   *Honest Answer:* It does *not* work as stated. "Risky action pays off only when you are certain" is too vague. In standard game theory, "certainty" usually implies probability 1. If I have probability 0.99 that you will play, and the payoff structure makes that sufficient, I play. The failure of coordination with finite mutual knowledge requires a specific payoff structure where *only* probability 1 justifies the action, OR a specific information structure (like the Email Game) where the probability of the other playing drops as the knowledge level drops.
      *   *Fix:* You need a sequence of games or states. In state $k$, the game is playable, but in state $k-1$, it's not. This is the Global Games/Email Game insight. I need to tell the user to adopt the **Email Game** structure explicitly.

  9.  **Finalizing the Plan Details:**
