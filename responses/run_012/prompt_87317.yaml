answer: |-
  Here is a plan for the ninety-minute session, designed to move from strategic necessity to epistemic fragility.

  ### 1. The Order of Components
  You must build the session in four distinct layers. Do not deviate from this sequence, because each layer provides the necessary vocabulary for the next.

  1.  **The Strategic Dependence (15 mins):**
      *   **Content:** Put a simple Coordination Game (Stag Hunt) on the board. Show that my best move depends on your move, and your best move depends on your belief about my move.
      *   **Why first:** You cannot motivate *epistemic* conditions until you have shown that *strategic* rationality is belief-relative. If students think rationality is just about maximizing payoff given the *world*, they will not see why knowledge of *you* matters.
  2.  **The Regress of Rationality (25 mins):**
      *   **Content:** Walk through the first two levels of reasoning. "I am rational" is not enough. "I know you are rational" allows me to predict you won't play dominated strategies. "I know you know I am rational" allows you to predict I won't play dominated strategies.
      *   **Why second:** This demonstrates the *work* that knowledge does. It licenses the elimination of strategies. This sets up the expectation that "more knowledge = more elimination."
  3.  **The Infinite Limit (20 mins):**
      *   **Content:** Define Common Knowledge of Rationality (CKR) formally as the limit of this process. Show that CKR licenses the standard solution concept (e.g., Iterated Elimination of Dominated Strategies or a specific Nash Equilibrium).
      *   **Why third:** Now they see the *goal*. CKR is the engine that drives the solution.
  4.  **The Finite Break (30 mins):**
      *   **Content:** Your construction (refined, see below). Show that stopping the chain at *any* finite number $k$, no matter how large, breaks the engine.
      *   **Why last:** This is the punchline. It relies on them understanding what the engine *should* do (from steps 2 and 3) to feel the shock of its failure.

  ### 2. The Central Example
  **Do not use the Muddy Children puzzle.**

  *   **Why:** Muddy Children illustrates Common Knowledge of a *Fact* (the existence of mud), not Common Knowledge of *Rationality*. In Muddy Children, the agents are passive logic processors; they do not have payoffs, strategies, or incentives to mislead. Using it will allow the two students who know it to disengage, and it will fail to show why CKR matters for *action*. It solves a logic puzzle, not a coordination problem.
  *   **The Replacement:** Use a **Coordination Game with Noisy Signals** (a simplified version of Rubinstein's Email Game).
  *   **What it must have:** It must have two equilibria: one safe (low payoff, guaranteed) and one risky (high payoff, requires coordination). It must have a mechanism where "certainty" degrades with each step of mutual knowledge.
  *   **What it must lack:** It must not rely on complex probability calculus. Use integers and clear thresholds. The uncertainty should be about whether the *message* was received, not about the payoffs themselves.

  ### 3. Critique and Repair of Your Construction
  You asked whether your proposed construction works as stated: *"Two agents... action pays off only when you are certain the other will take it as well... chain is only finitely deep... coordination can nonetheless fail."*

  **Verdict:** It does **not** work as stated. It is intuitively correct but mechanically incomplete.
  **The Problem:** In standard game theory, "certainty" is binary. If I am 99.9% sure you will play, and the payoff structure makes that sufficient for expected utility maximization, I will play. Finite mutual knowledge usually implies high probability, but not probability 1. To make coordination fail, you need to show that at level $k$, the probability drops *just enough* to make the safe action preferable. Without specifying the payoffs and the decay of probability, students will object: "But if $k=100$, surely I'm sure enough?"

  **The Repair:** You must adopt the structure of the **Email Game**.
  1.  **State 0:** The risky coordination is *not* available (payoffs favor safety).
  2.  **State 1, 2, ...:** The risky coordination *is* available.
  3.  **The Signal:** Agent 1 sees the state. If it is $>0$, they email Agent 2. Emails get lost with small probability $\epsilon$.
  4.  **The Knowledge:** If 1 sends and 2 receives, 2 knows state $>0$. If 2 replies, 1 knows 2 knows.
  5.  **The Trap:** In State $k$, Agent 1 knows the game is playable up to level $k$. But Agent 1 also knows that Agent 2 might be in State $k-1$ (if the last email was lost). If Agent 2 is in State $k-1$, Agent 2 will play safe. Therefore, Agent 1 must play safe. By backward induction, *everyone plays safe in all states*, even if $k$ is one million.

  **How to teach this without math:**
  Draw the chain of emails on the whiteboard.
  *   "If you didn't get my last email, you think I might not know the game is on."
  *   "If you think I might not know, you will play Safe."
  *   "If I know you might think that, I must play Safe."
  *   "This reasoning travels back down the chain to the very first email."
  This makes the failure of finite knowledge **structural**, not probabilistic. It lands as surprising because it shows a discontinuity: Infinite knowledge = Coordination; Finite knowledge (of any size) = Failure.

  ### 4. Misconceptions: Timing and Intervention
  You identified three specific misconceptions. Here is exactly when to head them off.

  1.  **"Common knowledge just means everyone knows."**
      *   **When:** Minute 10 (during *The Strategic Dependence*).
      *   **How:** When you draw the Coordination Game, ask: "If we both know the payoffs, why don't we just play the best outcome?" When they say "Because I don't know what *you* will do," press: "But you know I'm rational?" When they say "Yes," show that without knowing *I know you know*, you can't rule out my playing safe.
      *   **Intervention:** "Mutual knowledge fixes the world. Common knowledge fixes the *reasoning* about the world."

  2.  **"More rounds of mutual knowledge approach it."**
      *   **When:** Minute 75 (during *The Finite Break*).
      *   **How:** This is where the Email Game construction does its work.
      *   **Intervention:** Do not let them say "100 levels is close enough." Force the backward induction. "At level 100, I am unsure about level 99. At level 99, you are unsure about 98. The uncertainty doesn't fade; it propagates." This is the moment to draw the discontinuity graph on the board (Probability of Coordination vs. Knowledge Depth: 0 for all finite $n$, 1 at $\infty$).

  3.  **"Common knowledge is psychologically impossible, so the whole framework is a fiction."**
      *   **When:** Minute 85 (Wrap-up).
      *   **How:** Acknowledge the truth of the claim.
      *   **Intervention:** "You are right. CKR is not a psychological description. It is a **normative idealization**. We use it to find the *upper bound* of what rational coordination could achieve. If the solution concept fails under CKR, it certainly fails in reality. If it succeeds under CKR, we then ask what happens when we relax it." (This validates their skepticism without discarding the tool).

  ### 5. What to Leave Out
  Explicitly state at the beginning (Minute 5) that you are omitting the following, so they do not feel the gap:
  *   **The Probability Formalism:** "We will talk about certainty and uncertainty, but I will not write down probability distributions or sigma-algebras today."
  *   **Aumann's Agreeing to Disagree:** "That theorem relies on common priors, which is a separate can of worms. We are looking at rationality, not priors."
  *   **Evolutionary Game Theory:** "We are treating agents as reasoners, not as populations selected for fitness."

  ### 6. The Closing Question
  Do not ask them to define common knowledge. Ask them to diagnose a failure.

  **The Question:**
  > "Imagine two generals who have exchanged 1,000 confirmed messages that the attack time is noon. They are both rational, and they both know the other is rational. Yet, one general decides not to attack. Based on today's session, what is the *only* epistemic reason that could justify this decision without accusing either general of irrationality?"

  **The Answer You Want:**
  > "Because the chain of confirmation is finite, there remains a non-zero probability that the other general believes the chain is one link shorter, and thus believes *I* might not attack. The uncertainty does not vanish; it anchors the chain to the possibility of error at the start."

  If they answer "Because 1,000 isn't enough, they needed infinity," they have understood the discontinuity. If they answer "Because they aren't sure enough," they have missed the point. If they answer "Because rationality is fictional," they have retreated to the misconception you addressed in the wrap-up.
