answer: |-
  First, I want to acknowledge how heavy this burden is. You are describing a real-life version of the "Trolley Problem," a famous thought experiment in ethics, but with real blood and real grief. The fact that you are losing sleep over this shows you have a conscience. The town's anger is understandable, but their judgment is likely fueled by grief and hindsight.

  You are asking deep philosophical questions that ethicists have debated for decades. There is no single, universally agreed-upon answer, but looking at the frameworks might help you understand where you stand and why the town reacts the way they do.

  ### 1. The Argument for the Three (Utilitarianism)
  Your friend's logic represents **Utilitarianism**. This is the standard framework for almost all emergency triage protocols (firefighters, medics, disaster response). The core idea is: *maximize the overall good.*

  *   **The Logic:** A life is a unit of value. Three units are greater than one unit. Therefore, saving three minimizes the total amount of tragedy in the world.
  *   **Why the town agrees:** This is the social contract of rescue services. When you put on that vest, the implicit agreement is that you act for the safety of the community as a whole. To the families of the three, your decision looks like a calculation that their loved ones were worth less than the one man.
  *   **The Flaw:** As you noted, this treats human lives like math problems. It assumes we can aggregate value. It also requires you to actively choose to let the one man die to save the three, which can feel like making yourself responsible for his death specifically.

  ### 2. The Argument for the Coin (Egalitarianism / Non-Aggregation)
  Your intuition—that the stakes were identical so the numbers shouldn't automatically decide—aligns with a minority but respected philosophical view, most famously argued by philosopher **John Taurek** in his essay *"Should the Numbers Count?"*

  *   **The Logic:** Each person has an infinite,不可 quantifiable right to life. You cannot add up "infinities." From the perspective of the single man, his death is a total loss of his world, just as it is for each of the three. To save the three, you would have to violate the single man's equal claim to rescue.
  *   **Why the Coin Flip matters:** If you believe every person has an equal claim to be saved, and you cannot save them all, giving them equal *probability* of being saved is the only way to respect their equality.
  *   **Was it dodging?** No. In philosophy, a random lottery is often considered the most *fair* procedure when moral claims are equal but incompatible. It acknowledges that you have no right to decide who is more "valuable." It removes your bias from the equation.

  ### 3. Was you wrong?
  **Morally:** You are not a murderer. Murder implies malice or negligence. You faced an impossible "forced choice" where death was guaranteed for someone regardless of your action. You made a decision under extreme duress using a method (the coin) that ensured you didn't arbitrarily favor one group over the other based on bias.

  **Professionally/Protocol:** This is the harder pill to swallow. In almost all organized rescue contexts, the protocol is strictly utilitarian: *save the most lives possible.* If you had been a paramedic or a Coast Guard officer, you would likely be disciplined for not saving the three. The town's anger stems partly from this expectation. They view the rescue boat as an institution that should follow the "save the most" rule, not as an individual making a philosophical stand.

  ### 4. Why the town is angry (and why it feels unfair)
  There is a concept called **Moral Luck**.
  *   If the coin had landed on the three, you would be a hero who saved three lives against the odds.
  *   Because it landed on the one, you are a pariah who "let three die."
  *   **The reality:** Your decision-making process was identical in both scenarios. Only the outcome changed. The town is judging you on the *outcome*, which was out of your control, rather than the *intent* or the *method*.

  Grief also needs a target. The families of the three need to blame someone to make sense of the loss. It is easier to blame a person ("He chose wrong") than to blame the storm or fate.

  ### 5. Regarding the "Stakes" Argument
  The person who told you "numbers only matter when the stakes differ" is partially right, but most ethicists would disagree with the conclusion.
  *   **Standard View:** Even if the stake is identical (death), numbers usually count. Saving 100 people from death is generally considered morally superior to saving 1 from death.
  *   **Your View:** You felt that because the *individual loss* was total for everyone, the *count* didn't override the *equality*. This is a defensible position, known as the "separateness of persons." You refused to sacrifice the one man *for the sake of* the three.

  ### Summary
  Did you make the choice that standard protocol dictates? **No.** Standard protocol says save the three.
  Did you make a morally indefensible choice? **No.** You used a fair lottery to decide between two groups with equal claims to life when you could not save both.

  You are suffering from **moral injury**—the trauma that comes from doing what you felt was right (or fair) in a situation where every option resulted in tragedy, and having that judged by others.

  **My advice:**
  1.  **Accept the tragedy, not the guilt.** You did not kill those three people. The storm killed them. You saved one person who would have otherwise died.
  2.  **Acknowledge the protocol gap.** You can admit, "I know the standard rule is to save the most, but in that moment, I couldn't justify valuing one life over another, so I left it to chance." You don't have to agree with the town, but acknowledging their framework might lower the temperature.
  3.  **Seek support.** This is too heavy to carry alone. If your village offers counseling, or if you can speak to a therapist who specializes in trauma or first responder stress, please do. You are dealing with a philosophical dilemma that has no clean resolution, and you need support to live with the ambiguity.

  You made a choice in hellish circumstances. You are not a monster.
