prompt: |-
  so theres this old Hofstadter thing, the Person Paper, where he writes a whole column as if english marked race the way it marks sex -- the words we treat as neutral get race-marked the way man is sex-marked, and everyone in the imagined world acts like thats just how the language is, nothing to see here. the gag is that the race version reads as obviously absurd while the sex version reads as completely normal. I want to use it as a test case but first I need the spec.

  so: write me the desiderata for a theory of default assumptions in language. what does any theory of this word quietly makes one group the norm and everyone else the deviation have to deliver before I should take it seriously? things like -- which cases it has to get right (generic masculine, marked forms like lady doctor or male nurse, the race-swap satire itself, cases where the marked form is the insulting one, cases where a term got reformed and nothing changed, slurs vs mere generics, honorifics, pronoun conventions), which distinctions it cant collapse (word vs use, speaker intent vs hearer uptake, grammatical gender in languages where it's arbitrary vs semantic gender, a term being demeaning vs a term being about sex at all, offense taken vs default-assuming), and which findings it cant contradict -- theres psycholinguistic work on what generic masculine actually brings to mind, and theres the awkward fact that plenty of languages mark gender everywhere and the speakers dont seem to walk around with the matching defaults.

  for each requirement give me the case or consideration behind it. then say which ones are negotiable and which arent, and flag any pair I probably cant have at once -- for instance if it has to treat the satire as a valid reductio, does it also have to explain why the same move gets called a false equivalence when the axis is switched (history, biology, whatever the objector points at)? if one requirement does most of the work of killing off the popular accounts, tell me which and why. skip the scorecard of authors, I'll do that part myself.
reasoning: |-
  Here's a thinking process that leads to the suggested desiderata:

  1.  **Analyze the Request:**
      *   **Topic:** A theory of "default assumptions in language" (specifically regarding how language marks certain groups as the norm and others as deviations, e.g., gender, race).
      *   **Core Reference:** Douglas Hofstadter's "A Person Paper on Purity in Language" (1985), which satirizes gender-neutral language debates by swapping race for gender to show the absurdity of the status quo.
      *   **Task:** Write a set of *desiderata* (requirements/conditions of adequacy) for such a theory.
      *   **Specific Inclusions:**
          *   Cases it must handle (generic masculine, marked forms, the satire itself, slurs vs. generics, honorifics, etc.).
          *   Distinctions it must maintain (word vs. use, intent vs. uptake, grammatical vs. semantic gender, etc.).
          *   Empirical constraints (psycholinguistic findings, cross-linguistic data).
          *   Analysis of negotiability vs. non-negotiability.
          *   Identification of trade-offs/incompatible pairs.
          *   Identification of the "killer constraint" (the one that kills popular accounts).
      *   **Constraint:** Skip the scorecard of authors (don't evaluate existing theories, just set the criteria).

  2.  **Deconstruct the Core Problem:**
      *   The phenomenon is "linguistic markedness" applied to social categories (gender, race, etc.).
      *   The Hofstadter paper highlights the *invisibility* of the default. "Man" = human + male is seen as natural; "White" = human + white is seen as absurd.
      *   A theory needs to explain *why* some defaults feel natural and others don't, *how* they function cognitively and socially, and *what* the normative implications are.

  3.  **Drafting the Desiderata (Iterative Process):**

      *   *Category 1: Empirical Coverage (The "Cases")*
          *   Need to cover the Generic Masculine ("mankind").
          *   Need to cover Asymmetric Marking ("actress" vs. "actor", "male nurse").
          *   Need to cover the Hofstadter Swap (Why does race feel different from gender here?).
          *   Need to cover Slurs/Pejoratives (How is "bitch" different from "woman"?).
          *   Need to cover Reform Failure (Why did "firefighter" work but "chair" stick, while pronouns fight harder?).
          *   *Refinement:* Make sure to distinguish between *grammatical* gender (French *le/la*) and *semantic* gender (English *he/she*).

      *   *Category 2: Conceptual Distinctions (The "Lines not to Cross")*
          *   Semantics vs. Pragmatics (Is the bias in the word or the use?).
          *   Intent vs. Uptake (Did the speaker mean harm vs. did the hearer feel excluded?).
          *   Offense vs. Exclusion (Being insulted vs. not being thought of).
          *   Descriptive vs. Normative (How it *is* vs. how it *ought* to be).

      *   *Category 3: Empirical Constraints (The "Hard Data")*
          *   Psycholinguistics (Stahlberg et al. studies on generic masculine triggering male images).
          *   Cross-linguistic variation (Languages with heavy gender marking don't necessarily have higher sexism, or at least it's not 1:1).
          *   Historical change (Meanings shift).

      *   *Category 4: The Hofstadter Constraint (The "Satire Test")*
          *   This is crucial. The theory must explain why the race-swap feels like a *reductio* of the gender status quo, but also explain why critics say it's a *false equivalence*. A good theory shouldn't just say "Hofstadter is right" or "Hofstadter is wrong." It needs to explain the *mechanism* of the intuition.

  4.  **Refining and Categorizing the Desiderata:**

      *   *Requirement 1: The Asymmetry Explanation.* Why is "male nurse" marked but "female nurse" isn't (historically)? Why is "man" generic but "woman" specific?
      *   *Requirement 2: The Cognitive Reality.* Does the generic masculine actually exclude women in the mind? (Psycholinguistic data).
      *   *Requirement 3: The Hofstadter Boundary.* Why does the race analogy land for some and fail for others? (History/Power dynamics).
      *   *Requirement 4: The Reform Trajectory.* Why do some changes stick and others don't?
      *   *Requirement 5: Grammatical vs. Social.* Distinguishing arbitrary gender (German *der Mond*) from social gender (English *he*).

  5.  **Evaluating Negotiability and Trade-offs:**
      *   *Non-negotiable:* Must align with psycholinguistic data (if the data says generics trigger male images, the theory can't say they are neutral). Must distinguish grammatical from semantic gender.
      *   *Negotiable:* The normative conclusion (does the theory prescribe change or just describe?). The weight of speaker intent.
      *   *The Tension:* The "False Equivalence" vs. "Reductio" tension. If the theory says language structures thought (Sapir-Whorf lite), Hofstadter looks strong. If the theory says language reflects material history, Hofstadter looks weak (because the history of sexism vs. racism differs). This is the hard pair.

  6.  **Identifying the "Killer Constraint":**
      *   What kills the simple "language is just a tool" accounts?
      *   What kills the extreme "language is oppression" accounts?
      *   *Candidate:* The Cross-Linguistic Constraint. If a theory claims "Gendered language causes sexism," it fails against languages with grammatical gender but different social structures, or English (low grammatical gender) with high historical sexism.
      *   *Better Candidate:* The **Cognitive/Behavioral Gap**. The theory must explain why people *sincerely* believe generics are inclusive while psycholinguistic tests show they aren't. It has to account for *unconscious bias* encoded in structure. This kills purely intentionalist accounts.

  7.  **Drafting the Response (incorporating the "Voice"):**
      *   The user wants a rigorous, philosophical, slightly technical spec.
      *   Avoid preaching.
      *   Structure clearly: Desiderata, Negotiability, Trade-offs, The Killer.
      *   Ensure Hofstadter is central.

  8.  **Review against Constraints:**
      *   Did I include generic masculine? Yes.
      *   Marked forms (lady doctor)? Yes.
      *   Race-swap satire? Yes.
      *   Slurs vs. generics? Yes.
      *   Psycholinguistic work? Yes.
      *   Cross-linguistic data? Yes.
      *   Negotiable/Non-negotiable? Yes.
      *   Incompatible pairs? Yes.
      *   Killer constraint? Yes.
      *   No author scorecard? Checked.

  9.  **Final Polish:** Check tone. Ensure it sounds like a spec for a theory, not a theory itself. (Self-Correction: Make sure to explicitly mention the "intent vs. uptake" distinction as requested). Ensure the distinction between "demeaning" and "about sex" is clear.

      *(Self-Correction during drafting)*: I need to be careful with the Hofstadter constraint. It's not that the theory must validate Hofstadter's conclusion, but that it must explain the *reaction* to it. Why does it feel biting? Why does it feel flawed?

      *(Refining the "Killer")*: The "Cross-Linguistic/Arbitrary Gender" constraint is probably the strongest filter. Many popular theories (especially radical feminist linguistics of the 70s/80s) stumbled over the fact that languages with no gender (Persian) can be patriarchal, and languages with heavy gender (Russian) vary in sexism. The theory must isolate *semantic* defaulting from *grammatical* marking.

      *(Refining the "Trade-off")*: The tension between "Language reflects reality" and "Language constructs reality." If it reflects, Hofstadter's swap is fake (because racial history != gender history). If it constructs, Hofstadter's swap is valid (because the linguistic mechanism is the same). You can't fully have both.

  10. **Final Output Generation** (Proceed to generate response based on these thoughts).
answer: |-
  Here is a specification sheet for a theory of **Linguistic Defaulting and Social Markedness**. This is designed to filter out folk-linguistics, purely prescriptive activism, and rigid formalism that ignores social context.

  ### I. Empirical Coverage (The Cases)
  *A serious theory must provide a unified mechanism to explain the following phenomena without treating each as an isolated anomaly.*

  1.  **The Generic Masculine:** It must explain why *man*, *he*, and *mankind* function as generics for the species, while *woman* and *she* do not. It must account for the intuition that "If a man loves a woman, he..." is processed differently than "If a woman loves a man, she..."
  2.  **Asymmetric Marking:** It must explain the marked/unmarked pairs where one term requires a modifier to deviate from the norm (e.g., *male nurse*, *lady doctor*, *woman writer*) while the counterpart does not (*nurse*, *doctor*, *writer*).
  3.  **The Hofstadter Boundary:** It must account for the specific rhetorical force of the "Person Paper." It needs to explain why the race-for-gender swap feels like a valid *reductio ad absurdum* to some, and a *false equivalence* to others. It cannot simply dismiss the satire; it must explain the cognitive friction it produces.
  4.  **Slurs vs. Generics:** It must distinguish between a term that defaults to a group (e.g., *he* as generic) and a term that weaponizes a category (e.g., *bitch*, *n-word*). A theory that treats all markedness as equally oppressive fails here; a theory that treats them as entirely distinct categories fails to see the shared mechanism of "othering."
  5.  **Reform Trajectories:** It must explain why some linguistic reforms stick (*firefighter* vs. *fireman*, *chair* vs. *chairman*) while others stall or trigger backlash (singular *they*, *Latinx*). It must distinguish between changes in *vocabulary* and changes in *grammar*.
  6.  **Honorifics and Titles:** It must handle asymmetries in social status marking (e.g., *Mr.* vs. *Miss/Mrs./Ms.*), where one gender is marked by marital status and the other is not.

  ### II. Conceptual Distinctions (The Lines Not to Cross)
  *The theory must maintain analytical separation between the following pairs. Collapsing them is an automatic fail.*

  1.  **Word (Type) vs. Use (Token):** It must distinguish between a word having a biased semantic entry vs. a speaker using a neutral word in a biased context. (e.g., Is *doctor* inherently male-coded, or only in specific contexts?)
  2.  **Speaker Intent vs. Hearer Uptake:** It must accommodate cases where the speaker intends a generic reading ("I meant *all* people") but the hearer receives a specific reading ("I heard *men*"). The theory cannot privilege the speaker's authority as the sole determinant of meaning.
  3.  **Grammatical Gender vs. Semantic Gender:** It must distinguish between arbitrary noun classification (e.g., German *der Mond* [the moon, masc.]) and social categorization (e.g., English *he* vs. *she*). A theory that conflates these will fail cross-linguistic tests.
  4.  **Demeaning vs. Categorizing:** It must distinguish between a term that is *about* sex/gender (e.g., *mother*) and a term that is *demeaning* because of sex/gender (e.g., *hysterical*). Not all marking is insulting; not all insults are marked.
  5.  **Offense Taken vs. Default Assumed:** It must separate the emotional reaction of offense from the cognitive mechanism of exclusion. One can be excluded from a category (not thought of) without being actively offended, and one can be offended by a term that includes one's group.

  ### III. Empirical Constraints (The Hard Data)
  *The theory cannot contradict established findings in adjacent fields.*

  1.  **Psycholinguistic Imagery:** It must align with data (e.g., Stahlberg, Sczesny, et al.) showing that "generic" masculine forms statistically trigger male-biased mental imagery and recall, even when speakers claim neutrality. A theory claiming generics are truly neutral in processing is dead.
  2.  **Cross-Linguistic Variation:** It must account for the fact that languages with heavy grammatical gender marking (e.g., Russian, Arabic) do not necessarily exhibit higher correlates of social sexism than languages with low gender marking (e.g., English, Persian), and vice versa. The link between structure and social reality cannot be 1:1 determinism.
  3.  **Historical Contingency:** It must acknowledge that markedness shifts over time. *Doctor* was not always unmarked male; *nurse* was not always unmarked female. The theory must allow for semantic drift driven by social change, not just internal linguistic pressure.

  ---

  ### IV. Negotiability Assessment

  **Non-Negotiable (Dealbreakers if violated):**
  *   **The Psycholinguistic Constraint:** If the theory claims generic masculines are processed neutrally by the brain, it is empirically false.
  *   **The Grammatical/Semantic Split:** If the theory treats French grammatical gender the same as English social gender, it lacks descriptive adequacy.
  *   **Intent/Uptake Distinction:** If the theory relies solely on speaker intent to determine bias, it cannot explain systemic linguistic prejudice.

  **Negotiable (Open for Theoretical Debate):**
  *   **The Normative Conclusion:** The theory does not *have* to prescribe language reform. It can be purely descriptive (explaining *why* the bias exists without arguing it *must* be changed), though a theory that offers no path to intervention may be pragmatically limited.
  *   **The Weight of History:** How much weight is given to historical power dynamics vs. cognitive efficiency? Some theories prioritize cognitive ease (shorter words = default); others prioritize power (dominant group = default). You can lean either way, provided you account for the other.
  *   **The Mechanism of Change:** Whether change happens top-down (style guides) or bottom-up (usage drift) is a variable, not a constraint.

  ---

  ### V. Incompatible Pairs (The Trade-Offs)

  **1. The "Universal Mechanism" vs. The "Historical Specificity" Tension**
  *   **The Conflict:** To validate Hofstadter's satire as a *reductio*, the theory must argue that the linguistic mechanism of defaulting is universal (i.e., race and gender function identically in the grammar of markedness). To validate the critics who call it a *false equivalence*, the theory must argue that the mechanism is dependent on specific historical/material conditions (i.e., the history of racism differs from sexism, so the linguistic mark carries different weight).
  *   **The Cost:** You cannot fully have both. If you prioritize the **Universal Mechanism**, you explain the satire's bite but risk ignoring the material differences between racial and gender oppression. If you prioritize **Historical Specificity**, you explain the critics' objection but weaken the satire's logical force (making it seem like *only* gender is problematic, rather than the structure of defaulting itself).
  *   **Resolution Requirement:** The theory must specify whether the *linguistic structure* is the problem or the *social content* filling the structure.

  **2. The "Cognitive Efficiency" vs. "Social Exclusion" Tension**
  *   **The Conflict:** Linguistic markedness often arises from efficiency (using the shortest/most common term as the default). However, psycholinguistics shows this efficiency comes at the cost of social exclusion (women/racial minorities are not cognitively represented).
  *   **The Cost:** A theory that optimizes for **Cognitive Efficiency** will treat bias as an unfortunate side-effect of communication optimization. A theory that optimizes for **Social Exclusion** will treat the efficiency as a pretext for power maintenance.
  *   **Resolution Requirement:** You must decide if the default is an *accident* of language evolution or a *feature* of social hierarchy.

  ---

  ### VI. The Killer Constraint

  **The Cross-Linguistic/Arbitrary Gender Constraint.**

  *   **Why it kills popular accounts:**
      *   It kills **Strong Sapir-Whorfian accounts** (Language determines thought): Because languages with arbitrary grammatical gender (where "bridge" is female in Spanish but male in German) do not produce radically different social realities regarding those objects, nor does grammatical gender perfectly predict social sexism rates across nations.
      *   It kills **Purely Intentionalist accounts** (Words are neutral, people are biased): Because psycholinguistic data shows the bias is activated *during processing*, regardless of intent.
      *   It kills **Radical Feminist Linguistic Determinism** (e.g., early Daly or Spender): Because it cannot explain why genderless languages (Persian, Turkish, Hungarian) still sustain patriarchal structures, or why English (which lost most grammatical gender) remained heavily sexist for centuries.

  *   **The Requirement:** A viable theory must isolate **Semantic Defaulting** (social categories treated as norms) from **Grammatical Marking** (arbitrary noun classes). It must explain why English *he* acts like a social marker while German *der* acts like a grammatical classifier, despite both being "gender." If the theory cannot distinguish between *arbitrary classification* and *normative exclusion*, it will fail to explain why we fight over pronouns but not over the gender of tables.

  *   **Why this is the bottleneck:** Most theories fail here. They either over-index on grammar (claiming French is more sexist than English because of noun genders) or under-index on semantics (claiming English generics are neutral because they aren't grammatically enforced). The theory that survives must explain how a *semantic default* operates without *grammatical necessity*, sustained purely by social convention and cognitive habit. That is the narrow needle Hofstadter's paper threads, and it is the needle your theory must pass.
