      **MEMORANDUM**
      **TO:** Board of Trustees
      **FROM:** [Trustee Name]
      **DATE:** October 24, 2023
      **SUBJECT:** Proposal for Visual Rehabilitation Component

      **RECOMMENDATION**
      I recommend we **FUND-MODIFIED**. Specifically, we should authorize a **three-month** visual integration support program for post-operative patients, with a budget line capped at **10% of the annual surgical allocation**. We must also revise the consent leaflet immediately.

      **ARGUMENT**
      We are not doctors, but we are stewards of outcomes. Our follow-up notes on six patients are not a scientific control group, and we cannot claim to have solved the philosophical debate definitively. However, the pattern is too consistent to ignore. These patients navigate and flinch, proving the eye works. They cannot reliably distinguish a cube from a sphere by sight alone, proving the brain does not automatically know what the eye sees.

      This leads us to the core question dividing this board: Is shape recognition a property transferred from touch to sight, or is seeing a separate skill that must be built? The evidence before us suggests the latter. Perception is not a passive reception of data; it is an active correlation of inputs. If we tell patients the world will simply "come into focus," we are selling them a tool without a manual. When the brain fails to correlate touch and sight immediately, patients may believe the surgery failed, causing distress we could prevent. We owe the patients already operated on who are struggling at least a referral pathway and updated counseling, as our previous understanding of the outcome was incomplete.

      **DISSENTING VIEW**
      The opposing argument is that this is over-engineering. The strongest form of this view is purely utilitarian: our capital is finite, and every dollar spent on rehabilitation is a dollar not spent on restoring sight to someone else. If the brain "catches up on its own schedule," as observed in the patient who learned to name a cup in three weeks, then institutionalizing rehab steals sight from five other families to comfort one. Surgery is the primary good; support is secondary. To require rehab is to impose a barrier to entry and reduce our total humanitarian impact.

      **RESPONSE TO DISSENT**
      This logic holds only if the surgery is successful regardless of support. If a patient receives sight but cannot recognize their spouse's face without touch, the utility of that surgery is compromised. We are not paying for eyeballs; we are paying for function. A modified program ensures the investment we make in surgery yields a usable return for the patient. By reducing the proposal from six months to three and removing the expensive tongue-device technology, we lower the cost enough to respect the budget constraint while acknowledging that sight requires learning.

      Verdict: FUND-MODIFIED - conditional on a three-month term and a budget cap of ten percent of surgical costs.

