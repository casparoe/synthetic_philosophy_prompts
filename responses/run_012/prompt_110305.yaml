          *   *Challenge 2 (The Lonely Particular/Singleton Problem):* If a particular has a unique shade (R3 instantiated once), and resemblance isn't reflexive, no class exists (property lost). If reflexive, singletons are property classes (haecceities/universals in disguise). Also, how to name the lonely shade without generality?

