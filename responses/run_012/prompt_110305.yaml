      *   *Challenge 2 (Lonely Particular):* This is the "Lonely Particular" objection. If resemblance is primitive, can a lone particular resemble anything? Usually, resemblance nominalists bite the bullet on reflexivity or deny the possibility of a truly lonely particular (modal realism?). Or, they argue that a singleton class *is* fine, but it doesn't entail a universal because it's still just a class of particulars, not an entity over and above them. Being-Socrates isn't a universal; it's just the class {Socrates}. It doesn't do the work of a universal (predicting resemblance in others).
