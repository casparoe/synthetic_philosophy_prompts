answer: |-
  You've hit on the classic Imperfect Community objection, and I'll concede immediately that primitive pairwise resemblance alone is too loose a net; if I let any chain of resemblance count, I indeed get gerrymanded properties like 'being A or B or C'. To fix this, I tighten the definition: a property class isn't just any pairwise resembling set, it's a *maximal* set of particulars that resemble each other *above a certain threshold of intensity*. In your trio, A and B cross the threshold, and B and C cross it, but A and C do not. Because the resemblance between A and C is weak, the cluster {A, B, C} fails to cohere as a single property class; the weak link breaks the unity required for a genuine property. The cost here is that I can't treat resemblance as a simple binary relation; I need a metric of degrees and a cutoff point, which adds machinery to my primitive base. However, this saves the distinction: {A, B} remains a valid property class because their mutual resemblance is strong and direct, whereas {A, B, C} is excluded not by fiat, but because it lacks the internal density that defines a natural class.

  Regarding the lonely particular, I bite the bullet on reflexivity: a particular always resembles itself perfectly, so a singleton class is technically a property class. But you're conflating 'property' with 'universal'. My nominalism denies universals—entities wholly present in multiple places—not the existence of singular properties. 'Being-Socrates' is a property, but it's not a universal because it doesn't do the work of explaining resemblance across distinct particulars; it explains nothing beyond Socrates. As for naming the lonely shade, I don't need a general term to pick it out; I can ostend it or describe it as 'the shade of that unique object'. The name refers to the class {S}, not to a repeatable entity. So I keep my ontology lean: I have classes and particulars, and while I admit singleton classes, they don't smuggle in universals because they lack the generality that defines the universal realist's commitment.
