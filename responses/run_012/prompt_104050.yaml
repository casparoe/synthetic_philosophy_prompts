  I'm a second-year PhD student working at the boundary of proof complexity and formal epistemology, and I'm drafting an application for a one-year dissertation fellowship. The project I want to pitch is about a move we make constantly and almost never justify: when a heuristic argument convinces us that a claim ought to hold for a typical or random case, we then go further and treat the conclusion as independent of all the specific details the heuristic waved away. That second step is what lets us treat a heuristic as evidence about the general claim rather than about one lucky instance, so it seems to be doing indispensable work — yet I have never seen a clean account of what licenses it rather than merely posits it. Please act as an expert methodologist in formal epistemology and the theory of computation, think carefully about where the real difficulty lies, and begin by brainstorming the two or three ways the question could be made precise before you commit to one. Then write the proposal itself.

  I have two half-formed seeds I'd like you to build on, and I'd rather you develop them than replace them with the standard framing. The first: model a heuristic argument as specifying a distribution over random instances together with a family of admissible factorizations of that distribution, and define the presumption of independence as the requirement that the probability of the heuristic's conclusion be stable across every factorization the heuristic itself leaves open — on this reading, the puzzle becomes a question about when a heuristic is self-consistent rather than about when its conclusion is true. The second: model the presumption instead as a scoring rule or betting commitment that we adopt before seeing the details, in which case the central problem migrates from truth to calibration, and the interesting failure mode is a heuristic that is well calibrated on the cases we can check and systematically miscalibrated on the cases we cannot. The proposal should state the question precisely enough that it has a determinate answer, explain why the existing positions — broadly Bayesian accounts of confirmation, probabilist reconstructions of defeasible reasoning, and the barrier results that limit what heuristic arguments can prove in complexity theory — leave it open, and say why a formal and conceptual project rather than a purely technical one is the right instrument. Describe the method concretely, in the form of a month-by-month plan over the year, naming the toy models I would actually construct and the informal arguments I would try to formalize.

  Finally, tell me what a genuine result would look like versus what would count as the project merely restating its own assumptions, what observations would make me abandon the first seed in favor of the second, and give an honest assessment of whether this fits in a year or is quietly a three-year project. Please write it as a polished two-page document in the first person, and do not include a bibliography, reading list, or citations — refer to positions and arguments in prose and I will fill in the references myself.
