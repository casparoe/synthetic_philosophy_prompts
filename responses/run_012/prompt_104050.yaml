answer: |-
  **Project Title:** The Presumption of Independence: Formalizing the License of Heuristic Arguments
  **Applicant:** [Your Name], PhD Candidate
  **Duration:** 12 Months

  **Statement of Problem**
  In computational complexity and number theory, we routinely accept heuristic arguments that establish a claim for a "typical" instance as evidence for the claim generally. When a probabilistic argument suggests a property holds for a random oracle, we often treat this as evidence it holds for specific, hard functions, effectively presuming the specific details are independent of the property. This move—the Presumption of Independence—is indispensable but unjustified. It bridges the gap between "true for a random case" and "true for this case," yet standard accounts of confirmation do not capture the structural nature of this inference.

  To make this precise, I consider two formalizations. The first models a heuristic as a distribution over instances equipped with a family of admissible factorizations; the presumption of independence becomes a stability requirement, demanding the conclusion's probability remains invariant across all factorizations the heuristic leaves open. The second models the presumption as a scoring rule or betting commitment adopted prior to seeing details, shifting the focus from truth to calibration. While the second offers a clear normative ground, the first better captures the structural constraints of proof complexity. I commit to the first seed as my primary formal object, treating the second as the normative justification for why stability matters. The central research question is: *Under what structural conditions does factorization stability license a presumption of independence without trivializing the complexity of the instance?*

  **Critical Gap**
  Existing frameworks leave this question open. Broadly Bayesian accounts of confirmation treat evidence as proposition-based, failing to model the *procedural* generation of heuristics where the "evidence" is the stability of a calculation method rather than an observation. Probabilist reconstructions of defeasible reasoning capture the non-monotonicity but lack the granularity to distinguish between a heuristic that fails due to bad luck versus one that fails due to hidden structure. Finally, barrier results in complexity theory (such as Natural Proofs) delineate what heuristics *cannot* prove, but they do not explain the epistemic license we claim when they *seem* to work. We lack a formal account of the intermediate space where heuristics are reliable guides despite lacking proof-theoretic force. This project is necessarily conceptual and formal; a purely technical approach would miss the normative leap, while a purely philosophical one would lack the rigor to engage with complexity constraints.

  **Methodology and Work Plan**
  I will construct toy models to test the stability definition against known heuristic successes and failures.

  *   **Months 1–3:** Formalize the Factorization Stability condition. I will define a "heuristic frame" as a triple of a sample space, a target property, and a set of permissible measure factorizations. I will draft the stability theorem: if a property's probability is stable across admissible factorizations, does it converge to the truth value on specific instances?
  *   **Months 4–6:** Apply the framework to number theory. I will analyze Cramer's probabilistic model of the primes. The informal argument is that primes behave like random numbers with density $1/\ln n$. I will formalize the "admissible factorizations" of the integer sequence that Cramer's model implicitly assumes and identify exactly where the stability condition breaks down (e.g., in modular arithmetic structures).
  *   **Months 7–9:** Connect to Seed 2 (Calibration). I will define a betting game where an agent wagers on properties based on heuristic stability. I will attempt to prove that high factorization stability bounds the agent's calibration error. This links the structural definition to the epistemic norm.
  *   **Months 10–12:** Synthesis and Dissertation Chapter Drafting. I will refine the definitions based on the case studies and write the core theoretical chapter. I will specifically test the framework against Random $k$-SAT thresholds to see if the "independence presumption" explains why certain algorithmic barriers exist.

  **Deliverables and Risk Assessment**
  A genuine result will be a theorem establishing a bound on calibration error as a function of factorization stability within a specified complexity class. It must show that stability is a *sufficient* condition for reliability in a non-trivial setting. The project merely restates its assumptions if I define "admissible factorizations" so narrowly that stability becomes tautological or so broadly that no non-trivial heuristic satisfies it.

  I will abandon the first seed (Factorization) in favor of the second (Calibration) if I find that stability is too strong a condition—i.e., if well-accepted heuristics (like those for the Riemann Hypothesis) fail the stability test despite being empirically reliable. This would indicate that structural consistency is not the source of the license, but rather external tracking of truth.

  **Timeline Feasibility**
  This is an ambitious agenda for one year. A complete characterization of the stability-calibration link across complexity classes is likely a three-year project. However, this fellowship year is scoped as a feasibility study and foundation-laying phase. The deliverable is not a complete theory of heuristics, but a rigorous formalization of the Presumption of Independence and a proof-of-concept application to one domain (likely Cramer's model). If the formalization proves robust in Months 1–6, I will proceed to the calibration link. If the formalization proves intractable, I will pivot to a purely conceptual analysis of the betting commitment model. This flexibility ensures a substantive contribution regardless of the technical hurdles.
