      *   Best: Acknowledge no single analogy works. The "Machine" model is useful for *treatment* (fix the part) but bad for *definition* (what is broken?).

  9.  **Drafting the Response (Iterative refinement):**
      *   *Intro:* Validate the user's intuition. The analogy is powerful but leaks.
