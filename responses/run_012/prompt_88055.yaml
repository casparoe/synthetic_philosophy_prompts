      *   *The Designer/Spec:* Machines have an external designer with intent. Bodies have evolution, which has no intent, only selection pressure. There is no "canonical spec," only trade-offs.
      *   *The Bug vs. Feature:* In code, a bug is deviation from intent. In biology, "symptoms" (fever, cough) are often *features* (defense mechanisms), not bugs. The "error" is the pathogen, not the body's response.
