      *   *Section 2: The Breaks.* Go through the user's specific examples (Fever, Leg, Lactase, Sickle Cell). Explain *why* the machine model fails there.
      *   *Section 3: The "Spec" Problem.* This is the core philosophical hinge. Machines have external intent; bodies have evolutionary history.
      *   *Section 4: Naturalism vs. Normativism.* Define simply. Show why pure Naturalism fails (the "Harm" condition).
      *   *Section 5: Verdict on Conclusion.* The mate is half-right. Biology is real, "Disease" is a hybrid concept.
      *   *Section 6: Better Analogy.* Suggest "Legacy System" or just drop the analogy for a "Trade-off" model.

  10. **Refining the Tone:**
      *   Keep it sharp. No "On the one hand..." waffle.
