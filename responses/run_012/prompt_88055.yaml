      *   *Value Judgment:* To call something a "disease" implies it's *bad* for the *organism* (or the person living it). But "bad" is normative. Is infertility a disease? Is deafness? The biological fact exists (can't hear, can't conceive), but the label "disease" often hinges on whether the *person* wants to hear or conceive.
      *   *Verdict:* The analogy fails to prove disease is *value-free* because the definition of "malfunction" in biology secretly relies on a value judgment about what the body *ought* to be doing.

  5.  **Address Naturalism vs. Normativism (Practical Definition):**
