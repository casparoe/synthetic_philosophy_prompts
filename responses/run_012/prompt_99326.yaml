answer: |-
  We, the undersigned, have engaged in a sustained adversarial collaboration to clarify the status of folk psychology and the ontology of the propositional attitudes. One of us argues that common-sense concepts like belief and desire are fundamentally mistaken and will be eliminated by mature cognitive science, much like phlogiston was eliminated by chemistry. The other argues that these concepts refer to genuine, causally efficacious states of the organism and that folk psychology is a largely correct theory that will be reduced to, rather than replaced by, neuroscience. While we remain divided on the metaphysical outcome, we have reached consensus on the terrain of the dispute and the conditions under which it might be resolved. This document records our shared commitments, our precise points of divergence, and the empirical cruxes that we agree are decisive.

  We begin with what we accept together. First, we agree that folk psychology is the framework ordinary people use to explain and predict behavior by citing reasons, such as what someone wants and what they think is true. Second, we agree that this framework possesses a significant degree of predictive success in everyday contexts, allowing us to navigate social life with reasonable accuracy, though we disagree on whether this success proves the truth of the framework or merely its utility as a rough heuristic. Third, we agree that the stakes are high: if folk psychology is false, then much of our legal, moral, and interpersonal discourse rests on an ontology that does not exist, requiring either revision or a pragmatic acceptance of useful fiction. Fourth, we agree that the question of whether a term tracks a real state versus serving as useful shorthand turns on whether the posited entities play a discrete causal role in the production of behavior that is identifiable independently of the folk framework itself. Fifth, we agree that evidence against folk psychology would consist of demonstrated failures to predict behavior in controlled settings where folk psychology should succeed, or the development of a superior predictive framework that does not utilize propositional attitudes. Sixth, we agree that evidence for folk psychology would consist of the successful intertheoretic reduction of belief and desire to neurobiological states, or the failure of any non-propositional framework to match its explanatory power.

  Despite this agreement on the setup, we part ways on the conclusion. The eliminativist maintains that the posits of folk psychology fail to refer to anything real because the structure of the mind does not match the structure of the theory; there are no discrete states with propositional content that cause behavior in the way the theory describes. The realist maintains that the posits of folk psychology do refer to real states because the functional roles described by the theory are genuinely instantiated in the cognitive architecture, regardless of the specific physical implementation. We have examined whether this disagreement is merely verbal, specifically regarding the definition of belief. The realist proposes defining belief functionally, as whatever internal state plays the role of storing information and guiding action toward goals. The eliminativist responds that while we can use the word belief to denote that functional role, the substantive claim is whether any state actually plays that role in a way that preserves the laws of folk psychology. We agree that if neuroscience reveals that information storage and action selection are distributed processes that do not respect the boundaries of individual propositions, the dispute is substantive, not lexical. The realist insists that functional realization is sufficient for reality, while the eliminativist insists that if the realization does not preserve the structural relations of the folk theory, the theory is false even if the word is retained.

  We also debated whether folk psychology is best understood as a theory or as a skill, akin to riding a bike or reading a room. The realist suggests that if folk psychology is a skill rather than a theory, it may be more resilient to elimination, since skills are practices that can remain valid even if the theoretical explanation of them changes. The eliminativist counters that even if it is a skill, the question remains whether the ontology invoked to explain the skill is real, noting that one can be skilled at astrology without stars causing personality traits. We agree that characterizing folk psychology as a practice does not settle the ontological question, though it may shift the burden of proof. If it is a skill, the realist must show that the skill tracks real causal structures, while the eliminativist must show that the skill relies on systematic misrepresentation of those structures. We further agree that the resilience of the practice in daily life does not guarantee the truth of the ontology, just as the persistence of talk about sunrises does not guarantee geocentrism, but the realist argues that unlike sunrises, beliefs are causal levers within the agent, not just external appearances.

  A critical test case for our collaboration involves imagining a future cognitive science that predicts and controls behavior perfectly but does so entirely using the vocabulary of trajectories through a high-dimensional state space, with no mention of propositional attitudes. The eliminativist predicts this would be a decisive victory for elimination, arguing that if the complete causal story can be told without beliefs, then beliefs are otiose and should be discarded. The realist predicts this would be merely a change of notation, arguing that state-space trajectories are simply the physical description of what we already call beliefs and desires, and that a translation manual could be written between the two vocabularies. On this point, we record our divergent expectations: the eliminativist holds that if the new vocabulary does not map cleanly onto propositional content, then propositional content does not exist. The realist holds that if the new vocabulary captures the same causal powers, then propositional content exists regardless of the vocabulary used. Regarding the lifespan of the term belief, the eliminativist predicts it will die in the lab first, as scientists cease to use it in formal models, but may linger on the street for centuries as a convenient fiction. The realist predicts it will never die in the lab because any adequate model must capture the semantic properties of the mind, and it will remain on the street because it refers to a fundamental reality of human interaction.

  We also addressed the self-defeat worry, specifically the objection that stating there are no beliefs is itself an expression of a belief, thereby contradicting the thesis. The eliminativist accepts that within the framework of folk psychology, the statement looks like a belief, but maintains that the statement is actually a proposal to abandon the framework entirely, including the status of the utterance itself as a belief. The realist argues that this move is performatively contradictory and undermines the rationality of the eliminativist position, since one cannot argue for a conclusion without presupposing the normative standards of belief and reasoning. We agree that this objection has teeth only if one assumes that rational argumentation requires the existence of real propositional attitudes. The eliminativist denies this assumption, suggesting that rationality can be reconceived in terms of neural coherence or adaptive success. The realist insists that reconceiving rationality without content strips it of its normative force. Regarding introspection, the realist counts the immediate sense of having beliefs as prima facie evidence for their existence, whereas the eliminativist classifies introspection as itself a product of the folk psychology framework, and thus no more reliable than a phlogiston theorist introspecting on the weight of fire. We agree that introspection cannot be the final arbiter, but we disagree on whether it constitutes data that needs explaining or noise that needs ignoring.

  Finally, we identify three specific cruxes where empirical or theoretical progress could move either of us. The first crux is the issue of neural implementation. We agree that if neuroscience identifies discrete, localized states that correspond one-to-one with specific propositional contents and show causal efficacy in behavior production, the eliminativist would have to back off. Conversely, if neuroscience demonstrates that cognitive processing is thoroughly distributed and connectionist in a way that makes the identification of discrete propositional states impossible even in principle, the realist would have to concede that folk psychology is at best a useful approximation. The eliminativist predicts the latter, expecting to find distributed vector representations that do not respect propositional boundaries. The realist predicts the former, expecting to find functional modules that implement propositional storage and retrieval. The second crux is the success of competing frameworks. We agree that if a non-propositional framework, such as dynamic systems theory or radical behaviorism, achieves superior predictive power in complex social contexts where folk psychology currently succeeds, the realist would have to give up the attitudes. Conversely, if all such attempts fail to capture the nuances of reason-based explanation, the eliminativist would have to acknowledge the indispensability of the propositional stance. The eliminativist predicts that non-propositional models will eventually surpass folk psychology as computational power increases. The realist predicts that non-propositional models will always lack the explanatory depth required for true understanding. The third crux is the possibility of intertheoretic reduction. We agree that if the laws of folk psychology can be derived from the laws of neuroscience without remainder, the eliminativist must accept realism. If it is shown that the laws of folk psychology are incommensurable with neuroscience, such that no bridge laws can be formed, the realist must accept elimination. The eliminativist predicts incommensurability, arguing that the categories are too different. The realist predicts derivability, arguing that higher-level regularities must be grounded in lower-level mechanisms.

  We close this statement by acknowledging that we have not resolved the dispute, but we have isolated the precise points where resolution is possible. We agree that the future of cognitive science will determine the fate of belief, not armchair speculation alone. We agree that if the eliminativist is right, the conceptual overhaul will be profound, affecting law, ethics, and self-understanding. We agree that if the realist is right, the integration of mind and brain will proceed through reduction rather than revolution. Until the evidence arrives, we maintain our respective positions, committed to the same standards of evidence and argument, waiting to see whether the mind turns out to be a house of propositions or a field of forces.
