prompt: |-
  You're a philosopher of mind and cognitive science who's spent a career in the belief/desire fights and who's good at drafting documents that both sides of a feud can actually put their names to. I need the joint statement that a real adversarial collaboration would produce between two people who've been going at each other for years: a committed eliminative materialist, the kind who thinks "belief" and "desire" are headed for the fate of "phlogiston" and "caloric," and a committed realst about the propositional attitudes, who thinks belief-desire psychology is a genuine and largely successful empirical theory of the mind that we have no reason to expect cognitive science to replace. They will not agree about the metaphysics. I still want the document they could both sign.

  Think it through carefully before you start writing, and dont feel you have to declare a winner — I want the residue, not a verdict. What I need from the document: the claims both sides can sign, about what folk psychology actually is, how good it really is at predicting and explaining behavior, what's at stake if it turns out to fail, what would count as evidence either way, and what the difference is between a term being useful shorthand and a term tracking a real state. Then the places they still genuinely part ways, each one stated in wording that side itself would sign off on — no strawmen, no formulations that are mush either. Then the cruxes, meaning the sub-questions where settling one would move at least one of them, and for each crux a case or argument that both agree bears on it, with each side's prediction written down in advance.

  Spend real effort on two things in particular. First, whether part of this disagreement is verbal. I have a hunch that if you let the realist redefine "belief" functionally — a belief is whatever internal state plays this role in producing behavior — the eliminativist might shrug and say fine, but that's not what anybody means, and then they're haggling over a word. If that's what's happening, say so, and say which parts survive that treatment as substantive. Second, whether the realist's whole case depends on folk psychology being a theory at all. I keep thinking it might be more like a skill or a practice, the way reading a room or riding a bike is a skill, and I cant tell whether that helps the realist or hurts him. There's also an odd case I want both of them on record about: imagine a future cognitive science that predicts and controls behavior as well as anyone could want, but does it entirely in the vocabulary of trajectories through a state space, with no propositional attitudes anywhere in sight. Would the eliminativist call that victory, and would the realist call it a change of notation rather than a change in what exists? Get each of them to say what they'd predict about that, and also whether they think the word "belief" would die in the lab first or on the street first, and why.

  I also want them honest about the self-defeat worry: can you even state the thesis that there are no beliefs without stating something that has content, and does that objection have any teeth? And whether introspection counts as evidence for the realist or is just more folk psychology dressed up as data. For every crux, give me the test or argument both sides agree is relevant, each side's prediction, and be explicit about what would move each of them — what would make the eliminativist back off, what would make the realist give up the attitudes.

  One more thing: no headings, no bullet points, no bold text, no tables. Continuous prose only, the way you'd write a long email. Keep the agreed claims and the disagreements, but carry them in running prose; you can number the agreed claims inline if it helps you keep them straight, but I'd rather read the wording you found than look at a grid. American English, please. And be careful not to hand me the standard two-sides survey — alot of the value here is in formulations that are neither vacuous nor slanted.
