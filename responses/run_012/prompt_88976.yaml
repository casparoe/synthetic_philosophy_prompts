answer: |-
  The dashboard showed two branches, diverging from a single node labeled *Subject 8940: Mara V.*. Elias hovered his cursor over the left branch. *Scenario A: Regional Lead, North Division.* The text beneath glowed amber. *Projected Action: Decline. Confidence: 99.4%.* He moved to the right. *Scenario B: Operations Stabilizer, Core Team.* The text was green. *Projected Action: Accept. Confidence: 99.6%.*

  "We need her in North," Elias said, leaning back in his chair. "The division is bleeding talent. She's the only one who can fix it."

  "And according to the model, she won't take the job," Sarah replied. She sat opposite him, hands folded over a legal pad. As the ethics compliance officer, her job was to ensure the Placement Division didn't cross the line into coercion. "If we offer Scenario A, she walks. If we offer Scenario B, she stays. The model says so."

  "The model doesn't make her stay," Elias corrected. "It tells us where she chooses to stand. We aren't forcing her. We're just offering the contract she signs."

  David, the lead data architect, shifted in his seat near the window. He looked tired. "That's the problem, Elias. You're talking about the model like it's a weather report. 'It will rain.' But this isn't rain. It's a person."

  "It's behavioral mapping," Elias said. "We have her history, her psychometrics, her communication logs. We know what she does when presented with specific stressors. In Scenario A, the stressors align with her past resignation triggers. In Scenario B, they align with her retention patterns. These are facts about Mara, not commands."

  "They're counterfactuals," David said. "You're claiming it is true *right now*, before we make the offer, that *if* we offered A, she *would* freely decline. But what makes that true? There is no offer yet. There is no decision yet."

  Sarah intervened. "The truth is in her character. She's a consistent agent. If you know someone well enough, you know what they'll choose. That doesn't mean you made the choice. If I know my husband will order the steak, I haven't cooked it for him. He still orders it. Mara still signs the letter. Her freedom is intact, so the liability is hers. If she fails in North, it's on her. If we put her in Core, and she succeeds, it's on her. We just set the table."

  "But do we know she will order the steak?" David asked. "Or have we defined the situation so narrowly that 'ordering the steak' is part of the description?"

  He tapped his tablet, projecting a breakdown of Scenario B onto the wall. "Look at the parameters for the 'Accept' prediction. You've included the time of the offer—Tuesday, 10:00 AM. You've included the sender—your direct report, not HR. You've included her current biometric data from her wearable—rested, caffeinated. You've even included the specific phrasing of the email subject line."

  "That's precision," Elias said. "We need accuracy."

  "That's rigging the description," David countered. "If you strip those away—if you make the circumstance 'thin,' just 'Offer of Core Role'—the confidence drops to 52%. It becomes indeterminate. She could go either way. But if you make the description 'thick' enough, including every variable leading up to the choice, you aren't predicting a free act. You're describing a settled outcome. You've baked the choice into the circumstances."

  Sarah shook her head. "Context matters, David. A choice doesn't happen in a vacuum. Providing the right context isn't manipulation; it's respect. We aren't drugging her. We aren't threatening her. We are offering Scenario B, which we know she wants, rather than Scenario A, which we know she rejects. We are facilitating her own will."

  "We are bypassing the will," David said. "If the truth of what she would do exists before we offer the job, where does that truth live? If it lives in her, she hasn't decided yet, so it can't be a fact. If it lives in the model, then the model is deciding, and she's just acting out a script. If it's just a brute fact with no source, then we're building strategy on magic."

  "It's not magic, it's data," Elias said, though his voice lacked its earlier certainty. He looked back at the screen. The green branch pulsed softly. The system claimed these truths were contingent—Mara *could* decline Core, even at 10:00 AM, even rested, even with that subject line. The model allowed for error. But the error rate was negligible.

  "The issue is credit," Sarah said. "If we put her in Core because we know she'll succeed, and she does, she gets the promotion. She gets the bonus. We don't take that from her. We just ensured she was in a room where she could win. Is that unethical? To put a player on a field where we know they won't trip?"

  "If you know they won't trip because you removed all the obstacles they might have chosen to jump over," David said. "Or because you defined 'trip' out of existence."

  Elias silenced them with a raised hand. "We have a quota. The North Division needs leadership by Monday. If we offer A, she declines, and the division collapses. If we offer B, she accepts, and stability is maintained. The outcome is better for everyone, including Mara. She stays employed. She works in a role she prefers. The company survives."

  "At the cost of transparency," David said. "We know she would have failed in North. But does she know? If we offer B without telling her A was an option, are we hiding the branch?"

  "She didn't want A," Sarah said. "Why offer it? Is it freedom to be offered things you don't want? We are saving her the trouble of refusing."

  "We are saving ourselves the trouble of managing her refusal," David muttered.

  Elias looked at the clock. 4:00 PM. The offer needed to be sent by 5:00 PM to meet the Tuesday 10:00 AM delivery window specified in the thick description of Scenario B. If he sent it now, it would sit in her inbox overnight. The model said she would read it at 8:30 AM, feel rested, and accept.

  If he changed the time, the prediction voided. The truth was tied to the clock.

  "David," Elias said. "Can you thin the parameters? Just 'Offer Core Role'?"

  "Confidence drops to chance," David said. "You lose the power to arrange the outcome. You're back to guessing."

  "And if we keep them?"

  "Then you're betting on a truth that has no ground other than our desire for it to be true."

  Sarah stood up. "Elias, we have a fiduciary duty to stabilize the company. We have a duty to Mara to place her where she thrives. The model gives us the map. Walking it is her choice. We aren't holding the pen."

  Elias looked at the two branches again. The amber one faded slightly, the system deprioritizing the low-confidence outcome. The green one remained bright. It promised a future where Mara signed, worked, and succeeded. It promised a future where the company remained solvent. It required only that Elias click the button that sent the email scheduled for Tuesday morning.

  He knew that once he clicked, the truth of her acceptance would shift from a conditional prediction to a historical fact. But until then, it hung in the air, uncaused by him, yet waiting for his hand to make it real.

  "If I don't click," Elias said, "she might take North. She might fail. Or she might succeed and prove the model wrong."

  "If you don't click," Sarah said, "you're choosing chaos over order."

  "If I do click," David said, "you're choosing order over truth."

  Elias moved the cursor. The arrow rested over the *Execute Scenario B* command. He thought about Mara, sitting at her desk somewhere in the building, unaware that her future was currently bifurcated on a screen three floors up. She would feel free when the email arrived. She would weigh the options. She would sign.

  He clicked.

  The screen refreshed. *Scenario B: Active.* The amber branch vanished. There was no longer a question of what she would do. There was only the wait to see if she did it.

  "Send the memo," Elias said, standing up. "Tell North we're sending support."

  "Support they didn't ask for," David said, gathering his tablets.

  "Support they need," Sarah corrected.

  Elias walked to the window. The city below was a grid of circumstances, millions of people moving through intersections of cause and choice. He wondered how many of them were walking paths someone else had cleared, believing the ground was natural. He turned back to the room. The dashboard was quiet. The truth was settled. The choice remained hers.
