  1.  **Evidentiary Scope (Non-negotiable):** Define whose posterior belief the price represents and whether inference differs for specialists versus tape-readers. *Consideration:* Rational expectations require consistent updating rules; asymmetric access implies asymmetric inference capabilities across agent types.
  2.  **No-Trade Resolution (Non-negotiable):** Identify which No-Trade Theorem assumption is suspended (priors, rationality, or common knowledge) to permit speculative trade. *Consideration:* Milgrom-Stokey prove common priors and rationality preclude trade based solely on private information without exogenous noise.
  3.  **Incentive Compatibility (Non-negotiable):** Describe an equilibrium where prices are informative enough to guide trade but noisy enough to compensate costly information acquisition. *Consideration:* Grossman-Stiglitz shows fully revealing prices eliminate the marginal value of private info, collapsing gathering incentives.
  4.  **Belief Hierarchy (Non-negotiable):** Distinguish information about fundamentals from information about other participants' beliefs and actions. *Consideration:* Keynesian beauty contests generate volatility decoupled from fundamental value via higher-order expectations about other traders.
  5.  **Conceptual Distinctions (Non-negotiable):** Do not collapse informative versus accurate, aggregation versus agreement, or hedging versus speculation. *Consideration:* Markets can efficiently aggregate erroneous information or facilitate risk-sharing without informational asymmetry driving volume.
  6.  **Empirical Falsifiability (Non-negotiable):** Specify an observation refuting information aggregation, such as predictable returns based on public past data. *Consideration:* Without falsification conditions, the efficient market hypothesis becomes a tautology immune to evidence.
  7.  **Source of Disagreement (Preference):** Treat persistent disagreement as exogenous (different priors) or endogenous (different signals), justifying the choice. *Consideration:* Heterogeneous priors explain trade easily but risk explaining everything; common priors require noise traders to function.
  8.  **Reflexivity Handling (Preference):** Assume price publication alters fundamental value or treat fundamentals as exogenous to market activity. *Consideration:* Self-fulfilling prophecies destabilize the mapping between price and underlying value, complicating epistemic assessment.

  Your suspicions survive scrutiny. There is a genuine impossibility, not merely a modeling difficulty: a theory cannot simultaneously satisfy full information aggregation (perfect informativeness) and endogenous information acquisition (incentive compatibility) under common priors and rationality. This is the Grossman-Stiglitz impossibility. If prices perfectly summarize dispersed information, no agent profits from gathering it; if no agent gathers it, prices cannot summarize it. This is not a friction to be modeled away but a logical contradiction in the definition of equilibrium. Consequently, any theory retaining common priors and common knowledge of rationality must import trade exogenously (e.g., noise traders or liquidity shocks) to avoid the No-Trade Theorem. You cannot have endogenous information production with fully revealing prices. The conflict between Requirement 3 (Incentives) and Requirement 1 (Informativeness) is structural. Many models treat this as a difficulty solvable by adding frictions, but the impossibility result holds for any rational expectations equilibrium with costly info. The single requirement that does the most to eliminate candidate theories is **Incentive Compatibility** (Requirement 3). It forces the admission of noise or irrationality, thereby sacrificing the purity of the rational expectations framework required for the strongest epistemic claims. Most candidates fail here by assuming information is costless or exogenous, rendering them incapable of explaining the origin of the information they claim to aggregate. To pass, a theory must accept that markets are only partially informative precisely because information is costly.
