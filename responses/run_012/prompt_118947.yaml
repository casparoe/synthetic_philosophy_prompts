answer: |-
  ### Assessment of the Working Hypothesis

  Your hypothesis is strategically sound and identifies the correct stagnation point in contemporary jurisprudence. The classical Hart-Devlin framing is indeed obsolete because it assumes a monolithic state enforcing a monolithic morality through the penal code. Modern governance is fragmented, regulatory, and often privatized. Shifting the focus to private law, moral infrastructure, and procedural legitimacy moves the debate from "whether" to "how" and "where."

  However, there are three significant risks your team must manage:

  1.  **Conceptual Inflation:** "Legal moralism" risks becoming a catch-all term for any law that aligns with a moral view. If every contract law decision that enforces promise-keeping is deemed "legal moralism," the term loses its critical bite. The team must distinguish between laws that *incidentally* align with morality and laws that enforce morality *because* it is morality.
  2.  **The Perfectionism Trap:** The "moral-infrastructure asymmetry" is the most novel part of your hypothesis, but also the most dangerous. It closely resembles liberal perfectionism. Without a rigorous distinction between "sustaining the preconditions of agency" and "promoting a specific conception of the good," this line of inquiry could collapse into a justification for state paternalism, undermining the liberal constraints Hart defended.
  3.  **Disciplinary Mismatch:** Your third pillar (the sociology of moral change and disagreement) tempts the team toward empirical work. A team of ten philosophers and legal theorists cannot compete with sociologists on data. If the project tries to measure moral change, it will fail. It must instead focus on the *normative implications* of disagreement for institutional design.

  **Verdict:** The hypothesis is approved, provided the research agenda prioritizes conceptual boundary-setting before normative justification or institutional application.

  ---

  ### Defended Research Agenda

  Given a fixed budget of ten researchers for three years, the team cannot solve all three pillars simultaneously with equal depth. The work must be sequenced. The following questions are ranked by their "upstream" value: answering an earlier question is a prerequisite for making progress on later ones.

  #### 1. What are the conceptual boundaries of legal moralism in non-criminal contexts?
  **Rank:** 1 (Foundational)
  **Why it is upstream:** You cannot assess the legitimacy of private law moralism (Pillar 1) or moral infrastructure (Pillar 2) until you define what counts as moralism in those contexts. In criminal law, the link is direct (conduct X is immoral, therefore X is banned). In contract or tort, the link is obscured by language of "public policy," "efficiency," or "reasonable expectations." If the team cannot distinguish between a moral enforcement mechanism and a coordination mechanism, the rest of the project is categorially confused.
  **Tractability:** High. This is pure conceptual analysis and doctrinal taxonomy, which fits the skillset of philosophers and legal theorists. It requires close reading of case law and statutes to identify where moral reasoning explicitly drives outcomes versus where it is rhetorical cover for economic or administrative goals.
  **Move Up/Down:** This stays at #1 unless the team discovers early on that the distinction is impossible to draw. If "legal moralism" proves incoherent outside criminal law, the project must pivot immediately to "moral effects of law" rather than "moral enforcement," which would fundamentally alter the hypothesis.

  #### 2. Can the state distinguish between sustaining moral agency and enforcing specific moral truths?
  **Rank:** 2 (Normative Core)
  **Why it is upstream:** This addresses your "moral-infrastructure asymmetry." Before designing institutions (Pillar 3), you must determine if the asymmetry is normatively defensible. If the state cannot coherently claim to support "agency" without endorsing a specific "way of life," then the asymmetry is a fiction, and the project must revert to a debate about comprehensive doctrines. This question determines whether the foundation is funding a defense of a new form of liberalism or an inquiry into perfectionism.
  **Tractability:** Moderate. This requires high-level normative political theory. It is tractable for philosophers but requires constant stress-testing against legal realities to avoid becoming abstract ideal theory. The team must produce working criteria (e.g., "all-purpose means" vs. "specific ends") that lawyers can apply.
  **Move Up/Down:** This would move to #1 if the conceptual work (Question 1) reveals that private law is already operating on this asymmetry implicitly. It would move down if the team determines that the "agency" distinction is philosophically untenable, forcing a focus on procedural legitimacy (Question 3) as the only remaining hope for consensus.

  #### 3. What procedural mechanisms legitimize moral enforcement in conditions of deep pluralism?
  **Rank:** 3 (Institutional Design)
  **Why it is upstream:** Once you know *what* is being enforced (Q1) and *why* it might be allowed (Q2), you must address *who decides*. In a pluralistic society, the "whose morality" problem is the primary source of instability. This question bridges the gap between normative theory and institutional reality (courts vs. legislatures vs. platforms). It is downstream because procedural solutions depend on the scope of the moral power being exercised.
  **Tractability:** Moderate to Low. This touches on sociology and political science. To keep it tractable for theorists, the focus must remain on *legitimacy conditions* (e.g., supermajority requirements, rights review, sunset clauses) rather than empirical predictions of stability.
  **Move Up/Down:** This moves up if the normative work (Q2) fails to find a principled limit on state moral enforcement. If the state *can* enforce morality broadly, the urgent question becomes how to check that power procedurally. It moves down if the team concludes that substantive limits (Q2) are sufficient to protect liberty, rendering complex procedural fixes unnecessary.

  #### 4. How does platform governance replicate or disrupt state-based legal moralism?
  **Rank:** 4 (Application)
  **Why it is upstream:** This is an application of the first three questions to a specific domain. Private platforms enforce norms through terms of service, not statutes. Understanding this requires the definitions from Q1, the normative limits from Q2, and the legitimacy concerns from Q3. It is the "contemporary significance" test case.
  **Tractability:** High, but risky. It is easy to describe platform governance; it is hard to normatively evaluate it without falling into tech-determinism. The theorists must treat platforms as private governors, not just tech companies.
  **Move Up/Down:** This moves up if the team finds that platform governance has effectively supplanted state moral enforcement in key areas (e.g., speech, privacy), making the state-centric analysis of Q1-Q3 obsolete.

  ---

  ### Trade-Offs and Strategic Advice

  **Conceptual Clarity vs. Normative Force**
  There is a tension between Question 1 (Clarity) and Question 2 (Force). A very narrow definition of legal moralism makes it easier to justify (Q2) but risks excluding the most interesting cases where morality subtly influences law. A broad definition captures more reality but makes justification nearly impossible.
  *Advice:* Prioritize clarity. A sharp, narrow definition that illuminates a specific mechanism is more valuable than a broad, fuzzy net. It is better to definitively solve the status of "public policy" voids in contract law than to vaguely gesture at the "moral tone" of the legal system.

  **Normative Questions vs. Institutional Design**
  Philosophers prefer asking "What is just?" (Q2), while legal theorists prefer "What works?" (Q3). In a three-year program, there is a risk of producing beautiful theories with no institutional traction, or pragmatic fixes with no normative grounding.
  *Advice:* Use Question 2 to constrain Question 3. Do not ask "What procedures manage disagreement?" in the abstract. Ask "What procedures manage disagreement *given that* the state is only permitted to enforce moral infrastructure?" This binds the institutional design to the normative theory.

  **Theory vs. Sociology of Moral Change**
  Your hypothesis mentions the "sociology of moral change." This is the greatest threat to the project's feasibility. Ten theorists cannot track moral change empirically.
  *Advice:* Reframe this. Do not study how morality *changes*. Study how the law *responds* to claimed moral change. The object of study is the legal reasoning that invokes social moral shifts, not the shifts themselves. This keeps the work within the domain of textual and doctrinal analysis.

  **Resource Allocation**
  *   **Year 1:** Dedicate 6 researchers to Question 1 (Conceptual Boundaries) across different private law domains (contract, tort, property, family). Dedicate 4 researchers to Question 2 (Normative Core).
  *   **Year 2:** Shift 4 researchers from Q1 to Q3 (Procedure). Keep 3 on Q2 to refine the normative argument based on Year 1 findings. Keep 3 on Q1 to finalize the taxonomy.
  *   **Year 3:** Dedicate 5 researchers to Question 4 (Platforms/Application) to test the theories. Dedicate 5 researchers to synthesizing the final output, ensuring the conceptual, normative, and institutional threads are woven together.

  **Final Warning:** The most common failure mode for this type of project is "conceptual drift." Researchers will start analyzing "morality in law" and end up analyzing "justice" or "efficiency." You must enforce a strict definition of "legal moralism" (enforcement of conduct based on its intrinsic moral status, not its harmful consequences) and ensure every working paper explicitly states how it adheres to or challenges that definition.

  \answer{Conceptual Boundaries of Non-Criminal Legal Moralism}
