answer: |-
  The request slip sat on Elara's desk, white and stark against the dark wood. *Demolition Permit: Sector 7, Load-Bearing Wall.* Below the citizen's signature was the required authorization field: *Lineage Trace to Origin.*

  Elara rubbed her temples. The Archive hummed around her, a vast cavern of shelving units stretching up into the gloom, packed with boxes of warrants. Three hundred years of paper. Every action in the city required a warrant, and every warrant required an endorsement from an earlier warrant. Rule 1: No self-endorsement. Rule 2: No endorsing what isn't filed. Rule 3: Continuity.

  To grant a demolition of this magnitude, the chain of justification had to be unbroken. Ideally, it went back to Warrant #1, the Founding Document that authorized the city itself. But nobody had seen #1 in a century.

  She pulled the box for the current year, then the previous, then the previous. She traced the endorsement stamps backward. Warrant 90420 was endorsed by 89115, which was endorsed by 88902. She could keep going. She could go back fifty years, a hundred. The chain didn't break; it just went back into the dark.

  "Use 742," said a voice behind her.

  Elara jumped. It was Henderson, her supervisor, holding a mug of tea that smelled of stale mint. He nodded at the slip.

  "Sir?"

  "Warrant 742. It's the oldest one on the active shelf. Everyone uses it for high-level traces. It's from year four. Close enough to the start."

  "But it's not the start," Elara said. "The form says *Origin*."

  "The form says what the form says," Henderson sighed, leaning against the stacks. "But the city needs walls to come down, Elara. If we waited for the Origin, nothing would ever get built. Nothing would get destroyed. We'd be statues. 742 is the floor. We treat it as the floor."

  "But why 742?" Elara asked. "What endorses 742?"

  "741," Henderson said.

  "And 741?"

  "740. Look, kid. At some point, you just have to stop digging. You plant your feet. If you don't, you fall." He tapped the desk. "Stamp it. Cite 742 as the base. Nobody checks past year four."

  He walked away, his shoes squeaking on the linoleum. Elara looked at the stamp in her hand. *AUTHORIZED.*

  She opened the rulebook to the section on Exemptions. If 742 was the floor, there had to be a rule that said *Here, the digging stops.* She scanned the indices. *Clause 14: Termination of Regress.*

  She found it. It read: *A warrant chain may be deemed complete if it reaches a document of sufficient historical weight.*

  Elara frowned. *Sufficient historical weight.* Who decided that? She flipped to the definitions. *Historical Weight is determined by the Archival Committee via Form 88.*

  She pulled the box for Form 88. It required a warrant to file.

  A cold knot tightened in her stomach. She saw it then, the snag that had kept her awake during her training. If she wrote a rule that said "Stop digging at 742," that rule was itself a claim. It was a claim that 742 didn't need further backing. But claims needed backing. To say "This is the bottom" was just another brick needing a floor beneath it.

  If she stamped the permit based on 742, she was implicitly asserting a rule: *Chains end here.* But she had no warrant for that rule. To assert the rule was to violate the very system she was upholding. She would be creating a warrant out of thin air, pretending it was bedrock.

  She looked down the aisle. The shelves stretched back into the shadows, row after row, year after year. The infinite option. She could just keep citing backwards. 742 endorses 90420, but 741 endorses 742, and 740 endorses 741. She could list them all.

  But there weren't enough lines on the form. There wasn't enough time in her life. To justify one wall, she would have to recite three hundred years of paper. The infinite chain was true, perhaps, but it was unusable. It was a horizon you could walk toward but never reach.

  She needed a floor, but there was no ground. She needed a stop, but stopping was illegal.

  Elara stood up and walked into the stacks. She needed air that didn't smell like dust. She wandered deeper than usual, into the early years. The boxes here were leather-bound, the paper brittle. She pulled a random box from Year 5. Then Year 4.

  She started reading not for lineage, but for structure. She wanted to see where the clerks of the past had panicked.

  In Year 6, she found a cluster. Warrants 300 through 305.
  Warrant 300 authorized the Waterworks. It was endorsed by 304.
  Warrant 304 authorized the Grid. It was endorsed by 302.
  Warrant 302 authorized the Roads. It was endorsed by 300.

  Elara stopped. She checked the dates. They were filed on the same day.
  300 endorsed 304. 304 endorsed 302. 302 endorsed 300.
  None of them endorsed themselves directly. Rule 1 was safe.
  All were on file. Rule 2 was safe.
  But there was no outside input. No anchor from the "Origin." They were holding each other up. A tripod of paper.

  She sat on the floor of the aisle, the brittle pages in her lap. This was the circle. The coherentists' dream. If you couldn't find the bottom, you could build a ring.

  It felt like cheating. It felt like lying. But then she looked at the waterworks. They still ran. The roads were still there. The city hadn't collapsed because the warrants holding it up were in a loop. The stability didn't come from the ground; it came from the tension between the documents. They leaned on each other so hard that none of them fell.

  It was tempting. God, it was tempting. To step into the circle was to find rest. You didn't need the Origin. You didn't need the Infinite. You just needed the web to hold tight.

  If she linked the demolition permit to this cluster—say, she issued Warrant 90421, endorsed by 300—then the permit would be supported by the loop. The loop supported itself. The weight of the demolition would be distributed across the water, the roads, and the grid.

  But to enter the circle, she had to break it open. She had to add a new link. If she added 90421, endorsed by 300, did 90421 need to endorse something back in the loop to keep the tension? If she just took from the loop without giving back, was she draining it?

  She thought of Henderson. *Just use 742.* He was pretending the circle was a line. He was pretending there was a bottom because he was afraid of the drop.

  Elara walked back to her desk. The request slip waited. The citizen needed to knock down a wall. Maybe the wall was unsafe. Maybe keeping it up was the danger.

  She took a fresh warrant form. *90421.*
  *Purpose: Demolition Authorization.*
  *Endorsed By: Warrant 300 (Waterworks).*

  She paused. If she stopped there, she was a parasite on the loop. She was using their stability without contributing to it. That was foundationalism in disguise—treating the loop as a foundation.

  She picked up her pen.
  *Endorses: Warrant 302 (Roads).*

  She drew the line. 300 supports 90421. 90421 supports 302.
  The circle expanded. It wasn't a closed loop anymore; it was a knot. A weave. The new warrant wasn't resting on the old ones; it was interlocking with them. The justification didn't flow one way. It circulated.

  She knew, logically, that this didn't solve the problem. There was still no Origin. The chain still didn't touch the ground. If the city fell, it wouldn't be because they lacked a foundation; it would be because the tension failed.

  But looking at the diagram she'd drawn—the arrows looping back on each other, creating a mesh of authority—it felt solid. Not because it hit the bottom, but because it was tight.

  She realized then that the infinite chain wasn't a line she had to climb. It was the background noise. The circle wasn't a lie to hide the infinite; it was a way to walk on it. You couldn't hold the whole chain, so you held a piece of it tight enough to stand on.

  Elara picked up the stamp. It felt heavy, cold iron.

  She wasn't finding the truth. She was weaving a net.

  She pressed the stamp down. *THUD.*
  The ink bloomed violet on the paper. *AUTHORIZED.*

  She filed the new warrant in the box for the current year, then walked back into the stacks. She found the box for Year 6. She slipped a cross-reference card into the file for Warrant 302. *See Also: 90421.*

  She was tying the present to the past, not by dragging the past forward, but by looping the present back.

  When she returned to her desk, Henderson was gone. The request slip was stamped and ready for pickup. The citizen would come tomorrow. They would take the paper, and they would knock down the wall. They wouldn't ask about the Origin. They wouldn't ask about the infinite regress. They would trust the stamp.

  Elara sat down and opened the next file. She knew the snag was still there. She knew that if someone asked her *why* the circle held, she would have to cite the circle, which would sound like madness. She knew that Henderson would tell her she was lucky it worked.

  But as she dipped her pen in the ink, she didn't feel the vertigo anymore. The floor wasn't below her feet. It was around them. It was made of paper and trust and the friction of one claim rubbing against another.

  She wrote the number for the next warrant. She didn't look for the bottom. She just made sure the link was strong enough to hold the weight of whatever came next. The chain went on forever, backward and forward, but here, in her hand, it made a shape that could bear a load.

  She stamped the next page. The sound echoed in the archive, a small, solid noise in the endless dark.
