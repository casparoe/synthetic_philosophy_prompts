answer: |-
  ### The Instrument Warning

  You are right to worry about the pattern. A checklist that makes a biased decision look principled is more dangerous than an openly biased intuition. It creates "moral cover." It allows the system to say, "We followed the procedure," while the aggregate data shows that vague accounts from young women are rejected at triple the rate of specific accounts from older men.

  A standard checklist is the wrong instrument for *justice*. But you have 40 referrals a week and no second reviewer. You cannot have deep ethics in 10 minutes. You can only have *accountability*.

  Therefore, I am not giving you a checklist that dictates a decision. I am giving you a **Documentation Protocol**. It does not tell the clinician what to think. It forces them to record *why* they doubt. It makes the judgement call visible in the notes, so that when you audit the pattern in six months, you can see where the procedure was used to mask bias.

  If you do not commit to the audit (reviewing the "Why" notes monthly), do not use this tool. Without the audit, this is just a fancier way to be unfair.

  ***

  ### The Triage Documentation Protocol (10 Minutes)

  **Goal:** Distinguish *Clinical Appropriateness* from *Epistemic Credibility*.
  **Rule:** The patient's account is primary evidence unless specific safety or contraindication criteria are met. The burden of proof is on the *service* to require corroboration, not on the *patient* to prove pain.

  #### Phase 1: Safety & Contraindications (Objective)
  *   **Q1:** Are there untreated red flags (cauda equina, active malignancy, unstable fracture)?
      *   **Yes:** Refer to acute/specialist care. **STOP.**
      *   **No:** Proceed.
  *   **Q2:** Is there a specific clinical reason this programme is contraindicated (e.g., active untreated substance dependence, acute psychosis)?
      *   **Yes:** Refer elsewhere. **STOP.**
      *   **No:** Proceed.

  #### Phase 2: The Narrative Assessment (Subjective — *Must Document*)
  *   **Q3:** Is the account vague or inconsistent?
      *   **If Yes:** Do not reject. You must document the *source* of vagueness in the notes. Choose one:
          *   [ ] **Confusion:** Patient cannot describe sensation/location.
          *   [ ] **Lexical Gap:** Patient lacks medical words but describes impact clearly.
          *   [ ] **Trimming:** Account seems edited/safe (suggests prior disbelief).
          *   [ ] **Instability:** Account changes significantly during the call.
      *   *Constraint:* "Vagueness" alone is **not** grounds for requiring corroboration. You must document why vagueness prevents *treatment planning*, not why it prevents *belief*.
  *   **Q4:** Does the account seem "rehearsed" or "too fluent"?
      *   **If Yes:** You must document: [ ] Is this a coping mechanism? [ ] Is this prior medical trauma? [ ] Is this genuine consistency?
      *   *Constraint:* Fluency cannot be used as evidence of fabrication.

  #### Phase 3: The Burden Check (Systemic)
  *   **Q5:** Has this patient already provided objective evidence that was dismissed elsewhere?
      *   **If Yes:** You cannot require the *same* evidence again without documenting why the previous assessment was insufficient.
      *   **If No:** Proceed.

  #### Phase 4: The Clinician's Reaction (Meta-Data)
  *   **Q6:** Do you feel this patient is "convincing" or "unconvincing"?
      *   **Action:** You must record the *trigger* for this feeling.
      *   [ ] **Clinical:** Based on symptom/physiology mismatch.
      *   [ ] **Behavioral:** Based on tone, demand, or affect.
      *   [ ] **Intuitive:** "Gut feeling" (Must be flagged for audit).
      *   *Constraint:* If the trigger is **Behavioral** or **Intuitive**, you cannot require objective corroboration unless Phase 1 (Safety) failed. You may accept them, or reject them as "not appropriate for *this* programme," but you cannot label them "uncredible."

  #### Phase 5: The Decision
  *   **Option A: Escalate.** (Account accepted as primary evidence).
  *   **Option B: Corroborate.** (Require specific additional evidence).
      *   *Requirement:* Must cite specific Phase 1 or Phase 2 documentation. Cannot cite "Vagueness" without "Lexical Gap" exclusion. Cannot cite "Gut Feeling" without "Clinical" justification.
  *   **Option C: Decline.** (Programme not appropriate).
      *   *Requirement:* Must cite clinical contraindication, not credibility failure.

  ***

  ### Running the Procedure on Your Three Referrals

  #### Case 1: 41F, Pelvic Pain, 8 Years, 3 Clean Scans, "Rehearsed"
  *   **Phase 1:** Pass. No red flags.
  *   **Phase 2 (Q3/Q4):** Account is consistent/rehearsed. Clinician marks [ ] **Trimming** or [ ] **Coping Mechanism**.
      *   *Constraint Check:* Fluency cannot be evidence of fabrication.
  *   **Phase 3 (Q5):** Likely yes (3 clean scans implies prior engagement). Cannot require 4th scan without justification.
  *   **Phase 4 (Q6):** Clinician feels "uneasy." Must mark trigger. If [ ] **Intuitive**, cannot require corroboration.
  *   **Output:** **Option A (Escalate).**
  *   **Why:** The procedure blocks the "too perfect = suspicious" bias. The "rehearsed" nature is documented as a coping mechanism/trimming, not a credibility failure. The clean scans are accepted as evidence of *exclusion*, not evidence of *absence of pain*.
  *   **Risk:** If the patient *is* fabricating for secondary gain, this procedure accepts them. You have decided that false positives are less harmful than false negatives in this context.

  #### Case 2: 29F, Pain "Everywhere", No Diagnosis, Partner Talks
  *   **Phase 1:** Pass.
  *   **Phase 2 (Q3):** Account is vague. Clinician must choose source.
      *   *Choice:* Likely [ ] **Lexical Gap** or [ ] **Confusion**.
      *   *Constraint:* Vagueness alone is not grounds for corroboration. Clinician must ask: "Can we treat this without a location?" If yes (multidisciplinary pain management usually can), proceed.
  *   **Phase 4 (Q6):** Clinician feels "unconvincing" because partner talks. Trigger: [ ] **Behavioral**.
      *   *Constraint:* Behavioral triggers cannot mandate corroboration.
  *   **Output:** **Option A (Escalate)** OR **Option C (Decline - Appropriateness)**.
  *   **Why:** The procedure prevents the "vague = fake" error. However, it allows the clinician to decline if the *programme* cannot help "everywhere" pain (clinical appropriateness), but they cannot label the patient "uncredible."
  *   **Risk:** Clinicians may misuse Option C to reject difficult cases. This is why you must audit the "Decline" codes.

  #### Case 3: 53F, Medicalized, MRI Sequences, Consultant Letter, "Convincing"
  *   **Phase 1:** Pass.
  *   **Phase 2:** Account is specific.
  *   **Phase 4:** Clinician finds her "entirely convincing." Trigger: [ ] **Behavioral/Cultural** (Fluency/Privilege).
      *   *Constraint:* This is the trap. The procedure forces the clinician to see that "convincing" is often a measure of shared class/education, not truth.
  *   **Output:** **Option A (Escalate).**
  *   **The Twist:** You asked: *If the procedure tells me to discount her, I want to see it do so explicitly.*
      *   This procedure *does not* discount her. It accepts her.
      *   *Is that the right answer?* In a resource-limited system, the "Medicalized" patient often crowds out the "Vague" patient. By making "Fluency" a neutral factor (Phase 2, Q4), the procedure prevents the "Good Patient" bias from accelerating her access *relative to others*.
      *   *Where it might error:* If her pain is primarily driven by health anxiety/iatrogenesis, the programme might harm her. The procedure checks for *contraindications* (Phase 1), but not *psychological suitability* in depth.
      *   *Correction:* If you suspect iatrogenesis, the decision is **Option B (Corroborate)** but the corroboration is *not* imaging. It is "Psychological Assessment prior to entry." The procedure allows this if documented as "Clinical Suitability" not "Credibility."

  ***

  ### The Commitment: Where This Will Misfire

  You asked me to mark the judgement calls wearing procedure's clothes. Here they are:

  1.  **The "Appropriateness" Loophole (Phase 5, Option C).**
      *   *The Clothes:* "Programme not appropriate."
      *   *The Judgement:* A clinician who disbelieves the "Vague" patient (Case 2) can simply check "Not Appropriate" instead of "Uncredible." The paperwork looks clean. The bias survives.
      *   *The Misfire:* This will misfire in favour of the articulate and against the marginalized. The audit is the only thing that catches this. If >20% of "Declines" are for "Vagueness/Appropriateness," your rule is broken.

  2.  **The "Gut Feeling" Documentation (Phase 4).**
      *   *The Clothes:* "Record the trigger."
      *   *The Judgement:* Clinicians will lie. They will mark [ ] **Clinical** when they mean [ ] **Intuitive**.
      *   *The Misfire:* This will misfire in favour of the clinician's comfort. It relies on honesty.
      *   *The Fix:* Random audit of call recordings against the notes. If the note says "Clinical Mismatch" but the recording shows "I just don't think she's coping," you have a training issue.

  3.  **The "Trimming" Interpretation (Phase 2, Q3).**
      *   *The Clothes:* "Identify Trimming."
      *   *The Judgement:* Recognizing trimming requires empathy and experience. A junior clinician may read "trimmed" as "honest."
      *   *The Misfire:* This will misfire in favour of patients who are skilled at performing illness, regardless of truth.

  ### Final Verdict on the Instrument

  This protocol is not a truth machine. It is a **bias-delay mechanism**. It adds 60 seconds of friction to a prejudiced decision. It forces the clinician to write down "I am rejecting this because of my gut" rather than "I am rejecting this because of Rule 4."

  It will not stop the pattern of harm if you do not audit the *reasons* recorded. If you implement this without the monthly audit of the "Why" boxes, you are building a better facade for the same building.

  **Do not use this unless you commit to reading the "Why" notes.** If you cannot commit to that, the only ethical procedure is to randomize the waiting list. At least then the bias is admitted as resource scarcity, not disguised as clinical judgement.
