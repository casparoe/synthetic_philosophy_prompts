prompt: |-
  ok so i'm in this philosophy club at my school and i somehow got voluntered to run next weeks session on names, and i'm realizing i don't actually know what i'm supposed to be asking. here's what started it: my next door neighbor is also my soccer coach, and i call him Coach and my little brother calls him Mr. Alvarez, and yesterday we walked past him and my brother goes "there's Mr. Alvarez" and i go "no thats Coach," and we were pointing at the same guy, and neither of us said anything false, but it really felt like we said different things. then a kid in my class was like oh thats Frege, thats like the oldest problem in philosophy of language, theres a whole thing about how "X is X" is boring but "X is Y" can be news even when X and Y are the same object. now i've gone down a rabbit hole and everyone seems to be arguing about whether names carry some kind of meaning besides just tagging the person, and i can't even tell what would count as getting it right.

  So before i read anything else: whats the spec? Like, what does any theory of how names work have to be able to do before its any good. i want the list of requirements -- the cases it has to get right, the distinctions it's not allowed to mush together, the stuff it can't contradict -- and for each one the case or the reason behind it, not just the label.

  Cases i keep running into, so please say what a theory owes each of them:
  - two names for the same person or thing that someone can learn seperately and then be genuinely surprised by, like finding out the morning star and the evening star are the same thing
  - a name that doesn't name anything (Santa, a made up character), plus sentences like "Santa isn't real" that seem true and meaningful
  - the same name attached to two different people
  - swapping one name for another name for the same person inside "she believes that..." -- apparently this can flip whether the sentence is true, which seems to break the idea that co-referring names are interchangable
  - someone whose name got attached to them because of stuff we believed about them that turned out to be false, or true of somebody else
  - a name that still picks out the same person even when we imagine things going differently (if he'd never coached, he'd still be him)
  - brand new sentences with names in them that nobody has ever said before, which we understand instantly

  Then the part i actually care about: which of these requirements can't all hold at once? i have a feeling thats where the real fight is, and i want to know which combos are impossible instead of just hearing that theories "differ". And which single requirement does the most damage -- knocks out the most otherwise-decent theories?

  If you have room, one or two lines each on how the "names are just tags for objects" view and the "a name comes with a description attached" view do against the list, but dont go overboard, the list is what i need.

  Also, and this matters: seperate what people who actually work on this agree on from whats genuinely contested, and dont dress up one camps preference as if its just the consensus. if something is your own call, say so. i dont want to stand up in club and confidently repeat a controversial position as if it were settled.
