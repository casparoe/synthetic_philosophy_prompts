prompt: |-
  ok so a friend of mine keeps ending arguments with "truth is just whatever works" — most recently to tell me that a homeopathic remedy counts as true because it makes people feel better, and then again to say his belief that his dead grandmother is watching over him is true because it gets him through the day. I don't think he's just being sloppy, I think that one sentence is doing several different jobs and he slides between them depending on what he needs. Can you lay the readings out for me as a menu?

  What I want: every distinct precise claim hiding in that line, ordered from the basically trivial (nobody would deny it, so why say it) up to the wild ones that would actually get you in trouble, with a verdict on each — defensible, false, or just too vague to assess. And for each reading, say whether it would really license the moves my friend is making, because I suspect most of them don't. Don't collapse it to the "right" reading; I want the whole spread.

  Two things to fold in:

  First, I've never been sure whether the Peirce-flavored idea (a concept's meaning is exhausted by its practical bearings — sounds like it's about meaning) and the James-flavored idea (truth itself is a property beliefs acquire by working — sounds like it's about truth) are the same slogan at two strengths or two unrelated claims that happen to share words. Sort that out for me, and say which one my friend is actually invoking.

  Second, a case that bugs me: my partner and I each firmly believe the other one started our last big fight, and honestly both beliefs "work" for each of us — they keep us calm, they keep us from spiraling. If truth is what works, are both of those true? If the slogan can't say no here without cheating, that seems like a real problem and I want to know which readings have it.

  Also, at least a couple of these readings should hit a nasty circularity — if working is what makes a belief true, what makes the working belief work, without smuggling truth back in? Flag which readings survive that and roughly how, and which just wave at "in the long run" or "for the community" and hope.

  No need for names, citations, or reading lists — just the positions and your verdicts on them.
