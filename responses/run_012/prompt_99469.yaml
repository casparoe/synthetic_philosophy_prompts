answer: |-
  ### Part 1: The Conceptual Sort-Out

  You are right to suspect these are two different jobs. They are not the same slogan at different strengths; they are claims about two different categories.

  *   **The Peirce-flavored idea (Meaning):** This is a rule for **semantics**. It says: "If you want to know what a concept *means*, look at its practical consequences. If two beliefs have the exact same practical outcome, they mean the same thing." This is about clearing up confusion in language. It doesn't tell you if the belief is *true*, only what the belief *is*.
  *   **The James-flavored idea (Truth):** This is a rule for **epistemology**. It says: "Truth is not a static property; it is something that *happens* to a belief when it proves useful." This is about validation. It tells you when you are allowed to call something "true."

  **Which one is your friend invoking?**
  He is invoking the **James-flavored idea (Truth)**, but he is smuggling in the **Peirce-flavored idea (Meaning)** to hide the cost.
  *   When he says homeopathy is "true," he is making a truth claim (James).
  *   When he justifies it by saying "it makes people feel better," he is redefining the *meaning* of the remedy's effects to exclude chemical mechanisms and include psychological ones (Peirce).
  *   **The Slide:** He uses the meaning-claim to broaden what counts as an "effect," and then uses the truth-claim to certify the belief based on that broadened effect.

  ***

  ### Part 2: The Menu of Readings

  Here are five distinct readings of "truth is whatever works," ordered from trivial to wild.

  #### Reading 1: The Instrumental Correlation
  **The Claim:** "Beliefs that are true generally guide action more successfully than beliefs that are false."
  *   **Status:** **Defensible.** This is a correlation, not a definition. It acknowledges that reality has structure, and mapping that structure correctly (truth) usually helps you navigate it (working).
  *   **Licenses Friend's Moves?** **No.** This says truth *leads* to working, not that working *makes* truth. Homeopathy might "work" via placebo, but if the mechanism is imaginary, the belief about the mechanism is false, even if the outcome is pleasant.
  *   **The Fight Case:** Only one partner can be right about who started it. The one whose belief matches reality will eventually navigate the resolution better. The other is just lucky temporarily.
  *   **Circularity:** **None.** "Working" is defined as successful navigation of independent reality. "Truth" is defined as matching independent reality. They are distinct but correlated.

  #### Reading 2: The Predictive Cash-Value
  **The Claim:** "A belief is true if and only if it allows you to accurately predict future sensory experiences."
  *   **Status:** **Defensible (with limits).** This is the hard-nosed version. It strips away metaphysics and focuses on "if I do X, I expect Y."
  *   **Licenses Friend's Moves?** **No.** Homeopathy fails specific prediction tests (blind trials). The grandmother belief makes no testable predictions (she doesn't move objects). They might feel good, but they don't predict sensory input better than alternatives.
  *   **The Fight Case:** **Solves it.** We look for evidence (texts, witnesses). The belief that aligns with the evidence yields better predictions about how the argument will unfold if addressed.
  *   **Circularity:** **Low risk.** "Working" is defined as "prediction matched by sensation." It doesn't presuppose truth, only observation.

  #### Reading 3: The Therapeutic Equivalence
  **The Claim:** "A belief is true if it provides psychological comfort or reduces anxiety."
  *   **Status:** **False.** This confuses *utility* with *accuracy*. A lie can comfort you; a harsh truth can devastate you. Calling comfort "truth" destroys the word's ability to distinguish fact from fiction.
  *   **Licenses Friend's Moves?** **Yes.** This is exactly what he is doing. Homeopathy comforts the patient; the grandmother belief comforts the grandson. Therefore, they are "true."
  *   **The Fight Case:** **Fails Catastrophically.** Both partners feel calmer believing they started the fight (perhaps because it gives them control). Under this reading, **both beliefs are true.** This creates a logical contradiction where $A$ and $\text{not-}A$ are both true.
  *   **Circularity:** **None, but irrelevant.** It avoids circularity by defining "working" as "feeling good." But since "feeling good" has nothing to do with reality, it's not a theory of truth anymore; it's a theory of mood management.

  #### Reading 4: The Subjective Relativist
  **The Claim:** "There is no objective truth. A belief is 'true-for-X' if it works for X."
  *   **Status:** **False (Self-Defeating).** If this claim is objectively true, then relativism is false. If it is only "true-for-you," then I don't have to accept it. It collapses shared reality.
  *   **Licenses Friend's Moves?** **Yes.** It allows him to have his "grandmother truth" while you have your "skeptic truth."
  *   **The Fight Case:** **Fails Practically.** Both beliefs are "true-for" each partner. But you cannot have a relationship based on mutually exclusive "truths." Eventually, you have to act on one version of events. The slogan offers no way to resolve the conflict, only to label it.
  *   **Circularity:** **High.** To say a belief "works for X," you have to assume X has goals. If X's goal is "to believe the truth," you are defining truth as "what helps you believe the truth." If X's goal is "comfort," you are back to Reading 3.

  #### Reading 5: The Ideal Convergence (The "Long Run")
  **The Claim:** "Truth is what *would* work for everyone, eventually, if investigation were pushed far enough."
  *   **Status:** **Vague but Defensible.** This saves the theory from immediate error. It admits current "working" beliefs (like homeopathy) might be false if they fail later tests. Truth is the ideal endpoint of inquiry.
  *   **Licenses Friend's Moves?** **No.** It explicitly forbids calling something true *now* just because it works *now*. Your friend's grandmother belief is unlikely to be confirmed by the "community of inquirers" in the long run.
  *   **The Fight Case:** **Solves it.** Currently, it's undecidable. But there is a fact of the matter. The "true" belief is the one that would survive infinite investigation.
  *   **Circularity:** **The Survival Test.** This reading tries to escape circularity by pushing the definition to infinity.
      *   *The Trap:* What makes a belief survive the long run? Usually, we say "because it's true."
      *   *The Escape:* You must define "survival" without using the word "truth." E.g., "The belief that generates the most stable consensus without coercion." If you can do that, you avoid circularity. If you say "The belief that survives is the one that matches reality," you are circular. Most proponents wave at "stable consensus" and hope that's enough.

  ***

  ### Part 3: The Circularity Problem

  You asked specifically about the loop: *If working makes a belief true, what makes the working belief work?*

  *   **Readings 1 & 2 (Realist):** Avoid the loop. They assume an external reality. Beliefs work *because* they match reality. Truth is the match; working is the result. No circle.
  *   **Reading 3 (Therapeutic):** Avoids the loop by abandoning reality. Beliefs work because they trigger dopamine/comfort. Truth is redefined as comfort. No circle, but the concept of "truth" is hollowed out.
  *   **Reading 4 (Relativist):** Collapses into the loop. "It works for me" usually means "It fits my other beliefs." But why do those other beliefs work? Because they fit *their* other beliefs. It's a closed system.
  *   **Reading 5 (Ideal Convergence):** **Most Vulnerable.**
      *   *The Charge:* You say the true belief is the one that ultimately works. But when we ask *why* it ultimately works, the only answer is "because it's the true one."
      *   *The Defense:* To survive, this reading must define "working" as **coherence** or **consensus**, not "matching the world." It says: "Truth is the belief we all agree on eventually."
      *   *The Cost:* This cuts the link to reality. We could all agree on something false (e.g., a global delusion). If the theory says that global delusion *becomes* true because we agree, it has solved circularity by sacrificing objectivity.

  ### Summary Verdict

  Your friend is operating on **Reading 3 (Therapeutic)** disguised as **Reading 5 (Ideal Convergence)**.

  *   He wants the **authority** of Reading 5 (sounding philosophical, talking about "what works" as a deep principle).
  *   But he uses the **loophole** of Reading 3 (immediate psychological comfort counts as "working").
  *   **The Fight Case** proves he is wrong. If "truth is what works," and your conflicting beliefs both work (calm you down), then you have two contradictory truths. A theory that cannot distinguish between "coping mechanism" and "fact of the matter" is not a theory of truth; it is a theory of coping.

  **Final Diagnosis:** The slogan is defensible only if "works" means "predicts sensory experience reliably over the long term" (Reading 2/5). As soon as "works" slides into "feels good" or "helps me cope" (Reading 3), the slogan becomes false, licenses your friend's errors, and fails to resolve conflicts like your fight.
