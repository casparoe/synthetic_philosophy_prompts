answer: |-
  This is a classic instantiation of the **Reference Class Problem**, dressed in a suit and priced via Generalized Linear Models (GLMs). Your intuition is correct: the actuary's claim that the premium for a *single* individual is "objective probability, straight from the data" is philosophically untenable if taken literally. However, dismissing it as mere nonsense misses the functional role the claim plays.

  As a philosopher of science, you know the textbook trichotomy (Frequentist, Subjectivist, Propensity). Let's bypass the definitions and look at the *structural commitments* of the actuarial practice itself.

  ### 1. Candidate Readings of the Actuarial Practice

  To reconstruct the view of probability presupposed here, we need to look at what the mathematics is actually *doing* at different stages of the pricing pipeline.

  *   **The Aggregate View (Frequentist):** The insurer relies on the Law of Large Numbers (LLN). They do not need to predict *your* crash; they need to predict the *sum* of crashes in a portfolio of 100,000 similar policies. For the company's solvency, probability functions as a long-run relative frequency. If the observed loss ratio diverges from the expected frequency, the model is "wrong."
  *   **The Individual View (Epistemic/Subjectivist):** When assigning a premium to *you*, there is no repeatable trial. You are one token. The premium acts as a betting quotient: the price at which the insurer is willing to take the risk. In new markets, where no frequency data exists, they rely on expert elicitation (priors). This is pure subjective probability (De Finetti style).
  *   **The Causal View (Propensity):** Actuaries often speak of risk *factors* (age, car type) as if they possess an inherent "riskiness." This suggests a propensity view: the physical setup of a 23-year-old in a hatchback has a disposition to produce claims. However, actuarial models are correlational, not causal. They price based on prediction, not mechanism.

  **Initial Assessment:** The practice is not monolithic. It is a **hybrid**. It uses frequentist methods to stabilize the aggregate, but it must employ subjectivist or epistemic judgments to price the individual and manage business strategy.

  ### 2. Does the Practice *Require* Frequentism?

  Your brother-in-law insists the numbers are objective frequencies. Let's test if the practice logically *requires* this, or if it merely *uses* frequentist tools.

  **The Reference Class Problem (Venn/Reichenbach):**
  For a frequentist, $P(E)$ for an individual $x$ is defined only relative to a reference class $C$. $P(E|x) = \lim_{n \to \infty} (m/n)$ in $C$.
  *   *The Problem:* You belong to infinite classes: "23-year-olds," "male drivers," "hatchback owners," "residents of Postcode X," "people who drive before 9 AM."
  *   *The Actuarial Fix:* Actuaries use GLMs to find the intersection of factors that minimizes deviance. They construct a **synthetic reference class**.
  *   *The Philosophical Implication:* This class is not "found" in nature; it is **model-dependent**. If I change the model (e.g., add a variable for "credit score" or remove "postcode"), your "objective probability" changes.
  *   *Verdict:* The practice does **not** require a metaphysical frequentist view because the reference class is a pragmatic construction, not a natural kind. If probability were strictly the long-run frequency of a *natural* class, actuarial modeling would be impossible because no two risks are identical. The practice requires the *assumption* that the past frequencies of the constructed class are predictive of the future single case. This is an inductive leap, not a frequentist truth.

  **The Single Case Problem:**
  Even if we accept the reference class, the premium is for *one* year. You either crash or you don't. The frequency in that specific trial is 0 or 1.
  *   *Frequentist Defense:* The premium isn't the probability of *your* crash; it's your **contribution to the pool**. You pay the expected loss of the class to ensure the class's aggregate losses are covered.
  *   *Verdict:* This saves the frequentist view for the *company*, but abandons it for the *individual*. The number on your policy is not "the probability you will crash." It is "the price of entry into a risk pool."

  ### 3. The Tension: Objective Data vs. Subjective Loading

  You identified a tension: "Objective data" vs. "Profit loading/New Market guessing." Is this an inconsistency?

  **Diagnosis: Risk vs. Uncertainty (Knight/Keynes)**
  The actuary is implicitly distinguishing between **Risk** and **Uncertainty**.
  *   **Risk (The Technical Price):** Situations where the distribution of outcomes is known (or estimable from data). Here, they adopt a **Frequentist/Objective Bayesian** stance. They claim objectivity because the data constrains the rational degree of belief tightly.
  *   **Uncertainty (The Loading/New Market):** Situations where the distribution is unknown. New markets have no history. Profit loadings are business decisions, not statistical discoveries. Here, they adopt a **Subjectivist/Decision-Theoretic** stance.

  **Is it Inconsistent?**
  Logically, yes, if they claim the *final premium* is a single type of entity (an objective frequency).
  Pragmatically, no. The practice treats the **Technical Price** as a constraint (cost of goods sold) and the **Commercial Price** as a strategy (market positioning).
  *   *The "Objective" Claim:* This is rhetorical and regulatory. Regulators (e.g., Solvency II in Europe, state commissioners in the US) require capital reserves based on statistical confidence intervals (VaR). To justify these reserves, insurers must speak the language of objective frequency.
  *   *The "Subjective" Reality:* To stay in business, they must cover expenses and make a profit, which are not "risky events" in the same sense but business goals.

  **Verdict on Tension:** It is not a philosophical inconsistency; it is a **functional compartmentalization**. The "objective" part answers "What will the claims cost?" The "subjective" part answers "What must we charge to survive and profit?" The actuary conflates them in conversation, but the spreadsheet separates them.

  ### 4. The Counterfactual: What if We Swapped Philosophies?

  Suppose we forced the practice to align strictly with one philosophy. What breaks?

  **Scenario A: Strict Frequentism**
  *   **Requirement:** No probability without a long-run sequence in a natural reference class.
  *   **Consequence 1 (New Markets):** You cannot price a new market. There is no sequence. Insurance innovation halts.
  *   **Consequence 2 (Individual Fairness):** You must admit the premium is *not* about the individual. If a customer asks, "Why am I paying this?" the answer must be, "Because people *like* you crash, not because *you* will crash." This weakens the moral justification for risk-based pricing (actuarial fairness).
  *   **Consequence 3 (Unique Risks):** High-value, unique risks (satellite launches, celebrity legs) become uninsurable.
  *   **Practical Change:** The industry shrinks drastically. It becomes a utility for mass-market risks only.

  **Scenario B: Thoroughgoing Subjectivism (Radical Bayesian)**
  *   **Requirement:** Probability is coherent degree of belief. Data is just for updating priors.
  *   **Consequence 1 (Pricing Volatility):** Two actuaries with different priors could price the same risk differently, and both are "rational." This undermines market stability and regulatory oversight.
  *   **Consequence 2 (Regulation):** Solvency capital is currently calculated using frequentist confidence levels (e.g., 1-in-200-year events). A subjectivist would calculate capital based on personal credence. Regulators would not accept "I feel 99.5% confident" without frequency backing.
  *   **Consequence 3 (Discrimination):** If probability is belief, then using protected characteristics (race, gender) could be defended as "rational belief updates." Current regulation bans this even if statistically predictive. A subjectivist framework makes it harder to legislate against "biased priors."
  *   **Practical Change:** Pricing becomes more flexible but less accountable. Regulatory frameworks would need a complete overhaul to audit *priors* rather than *data*.

  ### 5. Final Verdict

  Here is the rigorous reconstruction you asked for.

  **1. The Presupposed View:**
  The practice presupposes a **Pragmatic Pluralism** masked as **Frequentist Objectivity**.
  *   *Ontologically:* It treats probability as a feature of the *portfolio*, not the *individual*. (Frequentist)
  *   *Epistemologically:* It treats the individual premium as a **decision-theoretic offer** based on the best available evidence. (Epistemic/Subjectivist)
  *   *Rhetorically:* It claims Objectivity to satisfy regulators and customers who want "fairness" defined as "matching risk."

  **2. The Reference Class:**
  The reference class is not discovered; it is **engineered**. It is the intersection of variables that maximizes predictive power while maintaining statistical credibility (minimum cell sizes). The choice is pragmatic, not metaphysical. Therefore, the "objective probability" of a single policy is a **fiction**—a useful number that behaves *as if* it were a frequency for the sake of the aggregate, but has no truth value for the individual.

  **3. The Tension:**
  The tension between "objective data" and "subjective loading" is not a bug; it is the **business model**. The "objective" part manages the risk of ruin (solvency). The "subjective" part manages the risk of failure (profitability). They answer different questions. The actuary's error was claiming the *final number* is purely objective. The final number is a **market price**, of which risk cost is only one component.

  **4. Does the Philosophy Matter?**
  Yes, but not for the daily math. It matters for **boundary conditions**.
  *   When data runs out (new markets), the philosophy shifts from Frequentist to Subjectivist.
  *   When regulators demand capital, the philosophy shifts to Frequentist.
  *   When customers demand fairness, the philosophy shifts to Propensity (you pay for *your* risk).

  **Conclusion:**
  Your brother-in-law is technically wrong but professionally right. The number on the policy is not an objective probability of a single event; that is a category error. It is a **coherent betting quotient** constrained by **aggregate frequency data** and adjusted for **commercial strategy**.

  If you forced him to be a strict frequentist, he couldn't sell policies in new markets. If you forced him to be a strict subjectivist, regulators would shut him down for insufficient capital reserves. The "inconsistency" you spotted is the **glue** holding the industry together. It is a **controlled schizophrenia** that allows them to navigate a world where they need the stability of frequencies but the flexibility of beliefs.

  **Advice for the Argument:**
  Don't fight him on the math. Fight him on the **ontology of the individual**. Ask him: *"If probability is frequency, and I am a unique token with N=1, does my probability exist? If not, what am I actually buying?"* If he says "pooling," ask *"Then why do you charge me based on my specific attributes if I'm just subsidizing the class?"* That is where the frequentist mask slips.
