answer: |-
  ### The Principle of Warranted Reliance

  You may assert a proposition $p$ if and only if your evidential basis for $p$ is sufficient to warrant the practical reliance your audience is entitled to place in you, given the stakes and institutional context, unless a weightier moral or social obligation licenses a departure from strict factual accuracy.

  This principle repairs your "Vouching" intuition by objectifying it: it is not about your subjective willingness to be held accountable, but about whether your evidence objectively supports the reliance you are inviting. It incorporates **pragmatic encroachment** (stakes change what counts as enough evidence) and allows for **non-epistemic overrides** (politeness, protection). It aligns most closely with a **Contextualist Knowledge Norm**, though it prioritizes *warrant* over *truth* for permissibility.

  ### Case Analysis

  | Case | My verdict | Your principle's verdict | Agreement (saves, overrides, or silent) | Clause doing the work |
  | :--- | :--- | :--- | :--- | :--- |
  | (1) Bus | Not Acceptable | Acceptable | **Overrides** | *Evidence/Stakes:* Timetable warrants reliance in low-stakes transit contexts; your verdict is inconsistent with (9). |
  | (2) Memory | Acceptable | Acceptable | **Saves** | *Evidence:* Memory is a standard warrant for personal arrangements. |
  | (3) Sincere Error | Not Acceptable | Acceptable | **Overrides** | *Warrant vs. Truth:* Permissibility is ex-ante; good evidence makes assertion okay even if false. |
  | (4) Sweater | Acceptable | Acceptable | **Saves** | *Social Override:* Politeness conventions license non-literal expressive claims. |
  | (5) Referee | Not Acceptable | Not Acceptable | **Saves** | *Institutional Context:* Professional reliance requires higher evidential threshold (verification vs. hunch). |
  | (6) Future | Acceptable | Acceptable | **Saves** | *Evidence:* Statement of intention is a present fact warranting reliance on commitment. |
  | (7) Surprise | Not Acceptable | Not Acceptable | **Saves** | *Social Override:* Surprise parties do not carry sufficient moral weight to license factual falsehoods (unlike 12). |
  | (8) Gossip | Acceptable | Acceptable | **Saves** | *Epistemic Only:* Assertion is warranted; disloyalty is a separate moral fault. |
