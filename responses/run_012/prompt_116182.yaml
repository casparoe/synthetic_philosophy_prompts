  I know the time we chose to leave the house.
  You know the time I chose to leave the house.
  I wait to see the light go on in your window.
  It glows. Now I hold the fact that you know.
  But you are watching my window for a sign.
  You do not know if I saw your light go on.
  So the door stays shut.

  So I strike a match to show I saw your light.
  Now I know that you know that I know the time.
  Yet you are waiting for a sign I saw your signal.
  You cannot know I saw the match I struck for you.
  The night is clear, the glass is clean between us.
  We have exchanged the proof of what we know.
  So the door stays shut.

  So I send a mark to say I saw your note.
  Now I know that you know that I know that you know.
  But you need to know I got your reply to my mark.
  The chain extends one link beyond your sight.
  The air carries every spark without a failure.
  Still you wait for the next flash to be sure.
  So the door stays shut.

  I know that you know that I know that you know that I know.
  The wire is perfect. The light is steady.
  No signal fades. No word is lost in transit.
  We count the rings. We count the flashes.
  The count is high. The count is safe.
  We do not move.
  So the door stays shut.

  Then the streetlight flickers and dies above the yard.
  We both see the dark fall on the grass.
  We both see the other see the dark.
  We open the door.
  We step out.
  We walk across the lawn.
  We meet.
