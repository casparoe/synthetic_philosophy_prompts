  2. If two moments give you the exact same information and the exact same options, the rational choice is the same at both.
  3. At both turnoffs you have the exact same information (you can't tell them apart) and the exact same two options (turn off, or keep going).
  4. So you rationally do the same thing at both turnoffs.
  5. The only ways to "do the same at both" are turning off at both (0) and driving past both (1). 1 beats 0.
  6. So the rational move is to drive past both and collect the 1.
  7. Yet "drive past the first, turn off at the second" pays 4. The only thing stoping you from having it is that you forgot which turnoff you're at.
  8. So decision theory says you're rationally required to give up 4 and take 1, and the thing forcing you to is your own bad memory.
  9. A theory where your own ignorance costs you like that has to be wrong somewhere. So (1) or (2) is false.

