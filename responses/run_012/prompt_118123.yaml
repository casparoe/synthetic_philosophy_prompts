answer: |-
  Here is the pressure you asked for.

  ### Mechanism vs. Redescription
  You are walking a fine line between a mechanism and a redescription. "Economy of contempt" is a potent metaphor, but is it an engine or just a label for "social pressure"?

  Your strongest distinction is the split between contempt for the *act* versus contempt for the *agent*. This is genuine work. Moral argument often fails because it allows the practitioner to compartmentalize: "I do a bad thing for a necessary reason." If the stigma attaches to the *identity* ("You are the sort of man who needs to duel to feel valid"), compartmentalization collapses. That is a mechanism.

  However, you risk redescription when you claim moral argument did "very little of the work." Moral argument is often the tool that *redirects* the contempt. You treat moral argument and contempt as separate forces, but moral argument is frequently the weapon used to devalue the currency of the old honor code. If you sever the two too sharply, you ignore that the "price of contempt" only rises because moral entrepreneurs spend capital raising it. You describe the market dynamics well, but you ignore the marketing.

  ### Appiah and Williams
  You are closer to Appiah than you admit. In *The Honor Code*, Appiah argues that moral revolutions succeed when honor codes shift—when practices become shameful rather than honorable. Your "economy of contempt" is essentially Appiah's "honor code" with a more transactional vocabulary.

  Your divergence from Appiah lies in your materialist corollary: the **conversion of standing**. Appiah focuses on the psychological/social shift; Williams focuses on the material/economic shift. You are attempting to bridge them by suggesting material shifts allow for social conversion.

  This is where you risk collapsing into Williams. If the planter becomes a man of commerce because commerce is now more profitable (Williams), then the "conversion of standing" is a byproduct, not a cause. If the planter becomes a man of commerce *in order to save his standing*, then your thesis holds. You need to be clearer on the arrow of causality. Does the economic shift enable the status shift, or does the threat of status loss force the economic shift? Currently, you imply the latter, but history often suggests the former.

  ### The Conversion Claim
  This is the most fragile part of your argument. You claim revolutions stall where practitioners cannot convert their standing. This risks sounding like an apology for the oppressor: *They couldn't help but hold slaves/duel because they had no other way to be respectable.*

  It also fails to account for ideological rigidity. Some practitioners *choose* obsolescence over conversion because they view the new currency as debased. The Southern Cavalier didn't fail to convert to commerce solely because he couldn't; he refused to because he viewed commerce as low. Your thesis suggests they were trapped; history suggests they were stubborn. The "conversion" claim risks smoothing over the agency of those who chose to go down with the ship.

  ### The Counterexample
  You asked for a practice that ended with no revaluation of contempt, or where contempt shifted but the practice survived.

  **The Counterexample: The Military Duel.**
  In many European and American armies, dueling was abolished via strict regulation and court-martial, not a shift in the "economy of contempt." An officer who refused a duel was not necessarily held in contempt by his peers if he cited regulations; he was obeying orders. The practice ended because the *institution* (the State/Army) monopolized violence and honor, not because the *individual* officer became "coarse" for fighting. The contempt was redirected from the *refuser* to the *violator of regulations*, but the underlying code of honor remained intact for generations. The practice died of administrative fiat, not social shame.

  **Alternatively: Whaling.**
  Whaling ended largely due to resource scarcity and the rise of petroleum, not because whalers became objects of contempt. For a long time, whalers were romanticized (see: *Moby Dick*, late 19th-century adventure stories). The practice died while the practitioners retained a degree of rugged prestige. This undermines your claim that moral/social revaluation is the primary driver. Sometimes, things just become obsolete.

  ### The Cut
  Since I do not have the text, I will identify the conceptual section you must excise or heavily rewrite: **The paragraph detailing the "conversion of standing."**

  **Why:** It is the point where your sociological insight drifts into speculation. It is the easiest place for a critic to accuse you of rationalizing the behavior of slaveholders and duelists as victims of a "status trap." It dilutes the moral clarity of your main thesis (that contempt for the *person* is the killer) by suggesting that if we just give bad actors a new way to be rich/respected, they will stop being bad. That is a pragmatic observation, but it weakens the moral argument of the essay. It sounds like you are offering them a way out, rather than analyzing why they were cornered.

  **Fix:** Keep the observation that economic viability aids social change, but do not frame it as a "conversion of standing" that saves the practitioner. Frame it as the *collapse of the material base* that made the old standing untenable. Don't let them keep their status; explain why they lost it.
