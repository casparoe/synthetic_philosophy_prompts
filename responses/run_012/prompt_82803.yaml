  # The Mind-Language Sorter

  **Instructions:** Read each scenario and pick the answer that feels most true to you. Don't overthink it; go with your gut. At the end, use the scoring key to find out which view of language and mind you actually hold.

  ### 1. The Compass in the Head
  Some languages don't use "left" and "right." They use "North, South, East, West" for everything, even small scales ("the cup is southwest of the plate"). Speakers of these languages can point to cardinal directions perfectly, even in a dark room they've never been in before.

  *   **A.** Their brains are literally wired differently; without those words, they couldn't form a mental map of space at all.
  *   **B.** They are incredibly practiced at tracking orientation, so it's faster and easier for them, but anyone could do it with enough training.
  *   **C.** They just describe the map differently; the internal sense of direction is the same for all humans.

  ### 2. The Source of the Story
