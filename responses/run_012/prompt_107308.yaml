answer: |-
  Here is a reconstruction of the *White Horse Dialogue* (Bái Mǎ Lùn) translated into the vocabulary of intensional dependent type theory, followed by the residue report you requested.

  ### 1. The Formal Reconstruction

  To make Gongsun Long's argument valid, we must reject the standard extensional interpretation where "is" denotes subtyping ($<:$) or set inclusion ($\subseteq$). Instead, we must interpret "is" as **definitional equality of types** ($\equiv$) or **identity of specifications**.

  We are working in a system with **Nominal Type Identity** and **Dependent Record Types** (or Sigma types), where the *name* and the *structure* of the type carry semantic weight beyond the set of their inhabitants.

  #### Definitions
  *   **`Shape`**, **`Color`**: Base types.
  *   **`Horse`**: A type defined by a constraint on shape.
      $$ \text{Horse} \equiv \{ x : \text{Animal} \mid \text{shape}(x) = \text{Equine} \} $$
  *   **`White`**: A predicate (or a singleton type) on color.
      $$ \text{White} \equiv \{ c : \text{Color} \mid c = \text{White} \} $$
  *   **`WhiteHorse`**: A composite type refining `Horse` with the `White` constraint.
      $$ \text{WhiteHorse} \equiv \{ x : \text{Horse} \mid \text{color}(x) \in \text{White} \} $$
      *Alternatively, as a Sigma type:*
      $$ \text{WhiteHorse} \equiv \Sigma (h : \text{Horse}) (p : \text{is\_white}(h)) $$

  #### The Copula
  In standard subtyping, we would write $\text{WhiteHorse} <: \text{Horse}$.
  However, Gongsun Long's claim "White Horse is not Horse" (Bái mǎ fēi mǎ) asserts:
  $$ \text{WhiteHorse} \not\equiv \text{Horse} $$
  That is, the type `WhiteHorse` is not *definitionally equal* to the type `Horse`. They are distinct type expressions.

  #### The Argument Restated

  **Premise 1 (The Semantics of Naming):**
  " `Horse` names shape, `White` names color."
  *   **Translation:** The type definition `Horse` projects the field `shape`. The type definition `White` projects the field `color`.
  *   **Type Theory:** $\text{dom}(\text{Horse}) \neq \text{dom}(\text{White})$. The constraints defining the types operate on different dimensions of the record.

  **Premise 2 (Intensional Distinction):**
  "What names color is not what names shape."
  *   **Translation:** The predicate on color is not definitionally equal to the predicate on shape.
  *   **Type Theory:** $\lambda x. \text{color}(x) \not\equiv \lambda x. \text{shape}(x)$.

  **Premise 3 (Composition):**
  "White Horse" is the conjunction of the name `White` and the name `Horse`.
  *   **Translation:** `WhiteHorse` is the intersection (or dependent pair) of the constraints.
  *   **Type Theory:** $\text{WhiteHorse} \equiv \text{Horse} \land \text{White}$.

  **Conclusion 1 (Type Inequality):**
  "Therefore, White Horse is not Horse."
  *   **Translation:** Therefore, the type `WhiteHorse` is not definitionally equal to `Horse`.
  *   **Type Theory:** $(\text{Horse} \land \text{White}) \not\equiv \text{Horse}$.
  *   **Validity:** **Valid.** In intensional type theory, adding a refinement constraint creates a new type distinct from the base type. $T \neq \{x:T \mid P(x)\}$.

  **Premise 4 (The Request / Inhabitation Argument):**
  "If you seek a horse, yellow/black horses suffice. If you seek a white horse, yellow/black horses do not suffice."
  *   **Translation:** Consider two interface requests (function return types):
      1.  `req_horse : ∃ (h : Horse). h`
      2.  `req_white_horse : ∃ (w : WhiteHorse). w`
  *   Let `y` be a yellow horse.
  *   `y` inhabits `Horse` ($y : \text{Horse}$).
  *   `y` does not inhabit `WhiteHorse` ($y : \notin \text{WhiteHorse}$), because the proof obligation `is_white(y)` cannot be constructed.
  *   **Type Theory:** The set of inhabiting terms for `Horse` is a strict superset of the inhabiting terms for `WhiteHorse`.
      $$ \{ t \mid t : \text{Horse} \} \supset \{ t \mid t : \text{WhiteHorse} \} $$

  **Conclusion 2 (Pragmatic Non-Equivalence):**
  "Therefore, White Horse is not Horse."
  *   **Translation:** The request specifications are not interchangeable.
  *   **Type Theory:** If $\text{WhiteHorse} \equiv \text{Horse}$, then by the indiscernibility of identicals, any term inhabiting one must inhabit the other without coercion. Since `y` inhabits one but not the other, the types cannot be identical.
  *   **Validity:** **Valid.** This relies on distinguishing **Type Identity** from **Subtyping**. If "is" meant $<:$, the argument would fail. Since "is" means $\equiv$, the argument holds.

  ---

  ### 2. Residue Report

  Here is the mapping of the dialogue's concepts onto your type-theoretic vocabulary, categorized by fidelity.

  #### A. Clean Mappings (High Fidelity)
  1.  **Refinement vs. Base Type:** The distinction between `Horse` and `WhiteHorse` maps perfectly to the distinction between a base type $T$ and a refinement type $\{x:T \mid P(x)\}$. They are distinct types in the syntax of the system.
  2.  **Inhabitation Conditions:** The "Yellow/Black Horse" argument maps cleanly to **inhabitation checks**. A term `yellow_horse` type-checks against `Horse` but fails to type-check against `WhiteHorse`.
  3.  **Intensional Equality:** The core claim "White Horse is not Horse" is valid if interpreted as $\text{WhiteHorse} \not\equiv \text{Horse}$. This is standard in intensional type theories (like Agda or Coq without proof irrelevance applied to type identity) where type constructors are injective and distinct.
  4.  **Coercion Requirement:** The dialogue implies you cannot simply substitute a `WhiteHorse` wherever a `Horse` is named without acknowledging the naming difference. This maps to **explicit coercions** (e.g., `proj₁ : WhiteHorse → Horse`). Gongsun Long insists the coercion is not an identity function.

  #### B. Distortions (Requires Bending PL Conventions)
  1.  **The Meaning of "Is":** In natural language and most PL pedagogy, "A White Horse *is a* Horse" implies subtyping ($<:$). Gongsun Long forces "is" to mean definitional equality ($\equiv$).
      *   *Distortion:* To make him valid, we must assume he is deliberately rejecting the subtyping interpretation. In PL, we usually say "Integer is a Number" even if `Int ≠ Number` definitionally, because we acknowledge the subtype relation. Gongsun Long treats the lack of definitional equality as negating the "is" relation entirely.
  2.  **Nominalism:** The argument relies heavily on the *names* (`Horse`, `White`) having ontological status. In structural type theory, if `WhiteHorse` erased to the same runtime representation as `Horse`, they might be considered equal. Gongsun Long requires a **Nominal Type System** where the name `WhiteHorse` is part of the type's identity, not just its structure.
  3.  **The Status of `White`:** Gongsun Long treats `White` as a namable entity comparable to `Horse`. In PL, `White` is usually a predicate (Prop) or a value (Enum), not a Type of the same universe as `Horse`. To map this, we must treat `White` as a **Mixin** or a **Type Class** constraint that elevates to the type level.

  #### C. No Counterpart (The Residue)
  1.  **The Ontology of *Ming* (Names):** In type theory, types are static abstractions. In the *School of Names*, *Ming* are acts of carving reality. The "request" for a horse isn't just a type signature; it's a speech act that fixes reference. Type theory captures the *constraints* of the request, but not the **pragmatic force** of the naming act itself.
  2.  **Proof Relevance vs. Irrelevance:** In many type theories, the proof that a horse is white is erased (proof irrelevant). For Gongsun Long, the "whiteness" is an essential part of the *name*. If we erase the proof, `WhiteHorse` collapses to `Horse` extensionally. To preserve his argument, we need **Proof Relevance**: the specific proof of whiteness is part of the value's identity.
  3.  **Disjointness Implication:** The phrase "is not" (*fei*) often implies disjointness in natural language ($A \cap B = \emptyset$). Gongsun Long knows they aren't disjoint (a white horse is still an animal), but he uses "is not" to deny identity. Type theory distinguishes $\neq$ (not equal) from $\perp$ (contradiction). The dialogue blurs this, relying on the ambiguity of "is not" to sound paradoxical while meaning "is not identical to."

  ---

  ### 3. Verdict: Defect of Vocabulary or Text?

  **It is not a defect of the text; it is a limitation of extensional type theory.**

  If you view type theory purely extensionally (sets of values), Gongsun Long is committing the masked-man fallacy. His claims are false: the set of white horses is a subset of horses.

  However, if you view type theory **intensionally** (as specifications, interfaces, or data structures with invariants), Gongsun Long is precise. He is arguing that **a stricter specification is not identical to a looser specification**.
  *   `interface Horse` $\neq$ `interface WhiteHorse`.
  *   Even if every implementation of `WhiteHorse` implements `Horse`.

  **The Residue is Pragmatic:**
  The remaining gap is that type theory is typically descriptive (what *is* the type?), while Gongsun Long is often prescriptive/normative (how *should* we name this?). When he says "White Horse is not Horse," he is warning against **type erosion**. If you accept `WhiteHorse` as `Horse` (via implicit coercion), you lose the information about color. He is advocating for a system where coercions are **explicit** to preserve the integrity of the *Ming* (Name).

  In this light, he is not a sophist; he is a **strict type theorist** arguing against implicit subtyping.

  ### 4. Note on Mohists and Hui Shi

  *   **The Later Mohists:** They would critique your translation by distinguishing **Kind** (*Lei*) from **Identity** (*Shi*). They would grant Gongsun Long that `WhiteHorse` $\not\equiv$ `Horse` (Identity), but insist that `WhiteHorse` $<:$ `Horse` (Kind). They would argue your "Request" argument fails because in a well-typed system, a function expecting `Horse` *must* accept `WhiteHorse` via subsumption. They would call Gongsun Long's refusal to acknowledge subsumption a misuse of language (*fei* used where *bu shi* is appropriate).
  *   **Hui Shi:** He would attack the rigidity of your types. "Heaven is as low as Earth." He would argue that the distinction between `Horse` and `WhiteHorse` is relative to the context. In a context where color is irrelevant, `WhiteHorse` $\equiv$ `Horse`. He would reject the fixed nominal types you used to validate Gongsun Long, arguing for a **context-dependent type system** where the equality relation itself is fluid.

  **Summary:** Your friend sees a fallacy because he assumes "is" means subtyping. You see substance because you recognize "is" can mean type identity. Gongsun Long is valid if you treat him as an **Intensional Type Theorist** prioritizing specification identity over inhabitant inclusion. The residue lies in the pragmatic weight of "Naming," which type theory models as constraints but cannot fully capture as a speech act.
