answer: |-
  The wind hammered the siding of Station 4, a constant reminder that the ice outside was cheaper to enter than to leave. Elara stood outside Commander Halloway's door, adjusting the collar of her parka. She wasn't cold. She was rehearsing the pitch. *Just a reallocation of generator priority. Low risk.*

  She knocked.

  "Come in, Elara," Halloway called out. He didn't look up from his logs. He never did. He knew her knock.

  "I was thinking about the hydroponics bay," she said, standing too straight. "If we shifted power from storage to growth during the cycle..."

  Halloway smiled, warm and tired. He pushed the approval slate across the desk without reading the details. "You know the tech better than I do. If you say it works, it works."

  "Thank you, Commander."

  "Elara," he said, softer. "You don't need to ask. You have the clearance. Just do it."

  "Protocol," she lied.

  She left the office holding the slate. She had what she wanted. No interference. No obstruction. By the ledger of the station, she was unrestricted.

  Later in the mess hall, Marcus watched her stir her rehydrated stew. Marcus handled Security and Compliance. He believed in the Station Charter.

  "You got the sign-off," Marcus said.

  "I did."

  "So you're free to execute."

  Elara stopped stirring. "I spent twenty minutes outside his door deciding how to say it so he wouldn't feel challenged."

  "That's diplomacy," Marcus said. "We're a team."

  "It's calibration," Elara said. "I shaped my request to fit his mood. If he'd been tired, I would have asked for less. If he'd been angry, I wouldn't have asked at all. My will bends before he even speaks."

  Marcus leaned back. "But he didn't speak. He signed. And if he had said no, you have the Ombudsman."

  Elara laughed, a short, dry sound. The Ombudsman was a charter requirement, a three-person panel elected by the crew. They could review command decisions. They could issue findings. They could not override them. Halloway appointed their chair. Everyone treated the Ombudsman with solemn reverence, filing grievances in triplicate, attending hearings in suits. It was a real thing that did nothing.

  "The Ombudsman recommends," Elara said. "He decides."

  "The process exists," Marcus insisted. "It means he's accountable. You aren't subject to whim. You're subject to law."

  "The law says he's above the review."

  "The law says he respects the review." Marcus tapped the table. "Look, freedom is doing what you want without being stopped. You weren't stopped. You're free. If you feel otherwise, that's anxiety, not politics."

  Elara looked up. She tried to meet Marcus's eyes directly, to hold his gaze without scanning his face for cues, without checking if he was about to interrupt or correct her. She found herself looking at the bridge of his nose instead. She couldn't help it. She was checking for the shift in mood that would signal danger.

  "I can't look you in the eye," Elara said quietly.

  Marcus blinked. "What?"

  "Because I'm waiting to see if you'll tell me I'm wrong. And if you do, I need to know how hard to push back. That depends on whether you're angry. I have to monitor your state to know my own safety."

  "You're overthinking," Marcus said, shifting in his seat. "I'm not going to hurt you. Halloway isn't going to hurt you. We're good people."

  "That's the point," Elara said. "I'm free only because you're good. If you woke up cruel tomorrow, I'm trapped. My freedom depends on your character, not my status."

  "My character is stable," Marcus said.

  "Mine shouldn't have to depend on it."

  "You have the exit clause," Marcus said. "Six months notice. You can leave."

  "In six months," Elara said. "If he lets me go."

  "He always lets people go."

  Elara stood up, taking her tray. "Then I'm lucky. I'm not free."

  "You're parsing words," Marcus called after her. "You have the power. Use it."

  Elara walked into the corridor. She had the power. She could turn the generators. But as she passed Halloway's office, she walked quieter than necessary, just in case he was on the phone. Just in case.

  ***

  **Note**

  The story bets on the "robustness" reading of non-domination: freedom requires security against *potential* arbitrary power, not just the absence of its exercise. Elara is unfree because her agency relies on Halloway's benevolence, not her right. The story takes liberties by treating the Appeals Board as structurally useless yet socially sacred, highlighting how proceduralism masks domination. A rival non-interference reading would force a different plot: Halloway would need to actually block Elara, or threaten her, to make her unfree. That would require a villain or conflict, violating the constraint that power remains dormant and kind. The story ends on disagreement because non-interference theorists (like Marcus) genuinely view structural security as secondary to actual outcomes, while non-domination theorists (like Elara) view the dependency itself as the injury.
