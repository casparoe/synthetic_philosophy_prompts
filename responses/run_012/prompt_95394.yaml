prompt: |-
  I'm a backend engineer, mostly payments infra — two-phase commit, idempotency keys, sagas, event logs, webhooks, at-least-once delivery, all that. I've been reading about speech acts for fun (Austin, Searle, constatives vs. performatives, illocutionary vs. perlocutionary, felicity conditions, direction of fit) and I want you to do a translation job for me, not a summary.

  Take the core of the theory and restate it in my vocabulary, as faithfully as you can, without quietly softening it into something my vocabulary could already say on its own. Some obvious starting mappings: an utterance as a message that may or may not be a state transition; felicity conditions as preconditions and validation; saying vs. doing as query vs. commit; uptake as an ack; conventions and institutions as protocol plus shared schema. Feel free to use idempotency, exactly-once vs. at-least-once semantics, compensating transactions, and the fact that a log entry can be immutable while its interpretation is not.

  Then the part I actauly care about — the residue report. What survives the translation cleanly, what survives only with distortion (tell me exactly what got squashed), and what has no counterpart in my vocabulary at all. I'm especially curious about four things: sincerity, given that my systems only check that a message is well-formed and authorized; the 'hereby' move, where the utterance seems to be its own authorization; perlocutionary effects vs. plain downstream side effects; and the claim that a speech act's force depends on being recognized as that act by other people rather than on passing a validator. Also tell me what happens to Austin's later collapse of the constative/performative distinction — in my world a read is never free, every query has effects, so does his distinction just die, or does it come back somewhere else in different clothes?

  For each piece of residue, say whether my framework is missing something or whether the original claim was vaguer than it looked. Dont be nice about it. If some of this is just metaphor that dissolves under pressure, say so, and if my translation smuggles in assumptions that aren't in the original (or the reverse), flag those too.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User Persona:** Backend engineer, payments infrastructure specialist. Deeply familiar with distributed systems concepts (2PC, sagas, idempotency, event sourcing, webhooks, delivery semantics).
      *   **Interest:** Speech Act Theory (Austin, Searle). Concepts: constatives vs. performatives, illocutionary vs. perlocutionary, felicity conditions, direction of fit.
      *   **Task:**
          1.  **Translation:** Map Speech Act Theory (SAT) concepts onto distributed systems/payments infrastructure vocabulary *faithfully*, without softening the theory to fit the engineering model.
          2.  **Residue Report:** Analyze what survives the translation, what gets distorted, and what has no counterpart.
          3.  **Specific Focus Areas:** Sincerity, the "hereby" move (self-authorization), perlocutionary effects vs. side effects, recognition vs. validation, and the collapse of constative/performative.
          4.  **Tone:** Direct, critical, no fluff ("Don't be nice about it"). Flag metaphors that dissolve and assumptions that get smuggled in.

  2.  **Deconstruct Speech Act Theory (SAT) for Translation:**
      *   *Locution:* The physical utterance (bits on the wire).
      *   *Illocution:* The intent/force (what the message *does* by being sent).
      *   *Perlocution:* The effect on the receiver's state/mind (downstream consequences).
      *   *Felicity Conditions:* Preconditions for the act to be valid (auth, schema, state).
      *   *Constative:* Describes state (GET/Query).
      *   *Performative:* Changes state (POST/Command).
      *   *Sincerity:* Internal state matching external claim.
      *   *Institutional Fact:* Reality created by agreement (ledger balance).

  3.  **Drafting the Translation (Iterative Process):**
      *   *Attempt 1 (Mental):* Utterance = API Call. Felicity = Validation. Performative = Write. Constative = Read.
      *   *Critique 1:* Too simple. The prompt asks *not* to soften it. I need to use the specific engineering terms (idempotency, sagas, logs).
      *   *Attempt 2 (Refining):*
          *   Utterance -> Event Log Entry / Message Packet.
          *   Illocutionary Force -> The semantic operation code (e.g., `DEBIT` vs. `QUERY`).
          *   Felicity Conditions -> Pre-transaction checks (balance > 0, signature valid).
          *   Uptake -> 200 OK / Ack / Commit.
          *   Sincerity -> ? (This is hard. Systems don't have minds.)
          *   Direction of Fit -> Word-to-World (assertion) vs. World-to-Word (command).
      *   *Refining for "Payments Infra":* Use terms like "Idempotency Key," "Saga Orchestrator," "Consensus."
      *   *Key Insight:* The "Hereby" is like a signed transaction that *is* the authority, not just a request for authority.

  4.  **Developing the Residue Report (The Core Value):**
      *   *Sincerity:* Engineering has "AuthN/AuthZ," not "Belief." If I send a `PAY` message, the system doesn't care if I *intend* to pay, only if I signed it. *Distortion:* SAT requires internal state alignment; Engineering requires cryptographic proof.
      *   *Hereby:* In code, `commit()` executes the change. In SAT, "I promise" *is* the promise. In engineering, the message is data until the handler processes it. *Distortion:* The separation of transport and logic in engineering breaks the immediacy of the performative.
      *   *Perlocution:* Engineering calls these "side effects" or "downstream consumers." SAT implies a psychological or social change. *Distortion:* Engineering reduces human impact to state transitions.
      *   *Recognition vs. Validation:* In engineering, if the validator passes, it's valid. In SAT, if the community doesn't *accept* it as a promise, it fails, even if grammatically correct. *Missing:* Social consensus layer beyond protocol consensus.
      *   *Constative/Performative Collapse:* In distributed systems, reads *do* have effects (logging, caching, side-channel leaks, triggering read-replica lag). Austin said constatives are also performatives. In engineering, `GET` is never pure. *Verdict:* Engineering actually validates Austin's later view better than the early distinction.

  5.  **Addressing the "Don't be nice" constraint:**
      *   Avoid polite hedging.
      *   Call out where the engineering model is reductive.
      *   Call out where SAT is mystical/vague.
      *   Highlight the "Magic" in SAT that engineering tries to eliminate.

  6.  **Structuring the Response:**
      *   **Part 1: The Translation Table.** Direct mapping of concepts.
      *   **Part 2: The Residue Report.** Detailed analysis of the four specific points + the collapse.
      *   **Part 3: The Verdict.** Is the theory useful or just metaphor?

  7.  **Refining the Content (Self-Correction during drafting):**
      *   *Check:* Did I use "Idempotency Keys"? Yes, crucial for the "Uptake" mapping.
      *   *Check:* Did I address "Direction of Fit"? Need to map Word-to-World vs. World-to-Word to State-Verification vs. State-Mutation.
