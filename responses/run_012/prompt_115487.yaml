      *   **Board Member 2 (Strategic Deviator):** Go Southside. Beat the prediction to ensure vaccination success.
      *   **Chair's Requirement:** Decide. Recommend concrete action + timeframe + future procedure change. Address the structural question (should prediction enter the decision?). Address both board members' arguments (including the strongest version of the rejected one). Avoid clichés ("correlation != causation", "maximize utility").
      *   **Audience:** Intelligent board members, untrained in decision theory.
