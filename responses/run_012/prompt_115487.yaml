      *   *Key Insight:* The problem isn't just Saturday. It's the *procedure*. As long as our procedure is deterministic and public, they win. To win, we must introduce genuine unpredictability or change the payoff structure.
      *   *For Saturday:* The prediction is already out (Northside). If we go Southside, we beat *this* prediction. But does that help long-term? Yes, it breaks the streak and forces them to update. But medically, Southside has fewer cases.
