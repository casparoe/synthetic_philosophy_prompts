      *   *Member 2's Point:* Evidential. Our decision is evidence of where the blockade will be (because they predict us).
      *   *Resolution:* We need to acknowledge that while our decision doesn't *cause* the past announcement, our decision procedure *causes* the accuracy of future announcements.
      *   *Recommendation:* Go Southside (save the vaccination effort this Saturday) BUT commit to a randomized or sealed procedure for the future (so the model breaks).
