      *   *Critical nuance:* If the model predicts deviations, why is it predicting Northside now? Because the "wide margin" of case counts makes the deviation unlikely *in the model's calculation*. The model calculates the probability of us deviating. It has concluded we *won't* deviate this time.
      *   *Therefore:* If we deviate now, we prove the model wrong *this time*.
