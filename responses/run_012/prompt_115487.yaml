      *   *If we go Southside:* We invalidate the current prediction. This is the first time we will have successfully "juked" the model *after* publication.
      *   *Decision:* We must go Southside *this time* to break the cycle, BUT we must change the procedure for the future so we don't have to play this game forever.
      *   *Wait, is that right?* If the model is that good, why did it predict Northside? Because it knows we follow the rule. If we decide to break the rule *because* of the prediction, we are engaging in "counter-predictive" reasoning. The model didn't predict that *this time*.
      *   *Philosophical Angle:* This is about *agency* and *procedural integrity*.
