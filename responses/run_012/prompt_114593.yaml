      *   *Clarify "Handicap":* Distinguish between *survival cost* (handicap) and *reproductive benefit* (advantage). The net result is positive for the winner, but the trait itself reduces survival probability.
      *   *Clarify "Cost":* Explain **Differential Cost**. This is the most important point. It's not absolute cost; it's marginal cost relative to quality.
          *   High Quality: Cost < Benefit.
          *   Low Quality: Cost > Benefit.
      *   *Address the Peacock:* Confirm it *is* a valid example, but explain *why* (survival trade-off). Mention that recent research adds nuance (sensory bias, etc.), but the Handicap Principle remains a core explanation.
      *   *Refine the "Low-Quality" Argument:* Explain why a low-quality male *can't* just "pay the price." The price is death or zero mating opportunities due to poor condition.

