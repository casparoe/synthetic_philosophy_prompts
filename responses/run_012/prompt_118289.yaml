      *   *Revisability:* Confront the "false hinge" problem. Use the riverbed. Address the normativity. This is the weakest point for Hinge Epistemology. Admit it.
      *   *Comparison:* Kuhn is the elephant in the room. Don't dodge. Hinge is more foundational/logical, Kuhn is historical/sociological. But in practice, they overlap here.
      *   *Conclusion:* Take the side. It was a hinge. The theory needs to account for *collective* hinges and the *ethics* of hinge-shifts.

      *(Self-Correction during drafting)*: I need to make sure I don't just turn this into a history of science essay. Keep the focus on *epistemology*. When I talk about Jeffreys, talk about the *status* of his physics, not just the physics itself. When I talk about magnetometers, talk about how they altered the *grammar* of geological evidence.

      *(Refining the Normative Point)*: The prompt asks: "Were they unreasonable?" Hinge epistemology usually says hinges are arational (neither reasonable nor unreasonable). I need to push against this. If the theory can't call them unreasonable, it's defective. I will argue the theory *must* allow for "stuck hinges" to be epistemically vicious.

