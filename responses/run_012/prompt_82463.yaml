prompt: |-
  I don't have any formal background in mathematics or philosophy, but over the past year I've been reading popular accounts of Bayesian reasoning, prediction, and machine learning, and I've arrived at a position I now want to state as sharply as I can, precisely so I can see how exposed it is. The position is this: inductive inference has a single objectively correct foundation, and that foundation is simplicity. A hypothesis should receive prior probability in proportion to how simple its description is — the shorter the description, the higher the prior — and this is not a convenient rule of thumb or a psychological preference but the thing that makes prediction work at all. I mean the strong version of the claim: that there is a canonical measure of simplicity (roughly, the length of the shortest program that would generate the data), that this measure is essentially unique because the choice of underlying computing machinery only shifts things by a constant, and that the resulting prior is provably guaranteed to predict about as well as any other computable predictor in the long run. On this view Occam's razor is not a heuristic we happen to favor; it is a theorem, and the theorem is supposed to explain why science converges on truth. I find this picture beautiful and I suspect it is doing more work than it can actually support, but I can't yet say where the load-bearing failure is.

  What I want from you is a map of what would count against this view. I am not interested in the cheap objection that simplicity is subjective — I suspect that one is too easy and probably misses the point. I want the specific results, arguments, and cases that should genuinely move someone who holds the strong version: formal theorems that limit what the long-run guarantee can mean; thought experiments in which the simpler hypothesis is plainly the wrong one; features of how science actually changes its mind that the picture cannot accommodate. In particular I have a vague sense that the guarantee only holds relative to some assumption about how the world is distributed in the first place, so that averaging over all possible worlds every predictor comes out equally good and simplicity buys nothing on its own; I'd like that suspicion either confirmed and made precise or dismissed, and I'd like to know how much of the view survives once the machinery is stripped of the parts that turn out to be uncomputable or merely asymptotic. Rank the considerations by how decisive they would be, distinguish those that would be fatal from those that would be merely awkward, and tell me honestly which of them the view's own defenders would concede as real costs rather than wave away. Finally, I want to know whether, after all the obvious objections have been absorbed into hedges and qualifications, there is anything left that the view actually predicts and could get wrong — or whether it has been qualified until it risks nothing at all, and if so, whether that is a fatal problem or just the ordinary price of a foundational claim. The consideration I would personally find most persuasive is one that shows the whole framework is committed to a picture of the world that we have independent reason to reject.

  Please structure the response as follows. First, a section titled The position, restated, in which you say back to me what I've committed myself to and flag any ambiguity in it that matters, in roughly one paragraph. Second, a section titled What would count against it, ranked, running from the most fatal consideration to the merely awkward, with each item explained enough that I understand why it bites — this should be the bulk of the answer. Third, a section titled What a defender would concede, covering only the costs that someone sympathetic to the view would themselves admit, in one paragraph. Fourth, a section titled Has it been insulated?, addressing directly whether the view still risks anything after its qualifications, in one paragraph. Fifth, a short section titled Verdict, giving your own bottom line on how much of the strong version survives.
