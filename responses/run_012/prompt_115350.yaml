prompt: |-
  I am a novelist, and the book I am writing turns on an organ-transplant case, so I have spent the better part of a year reading my way into the literature on how death is defined. My reading has been unsystematic, and I have reached the point where I no longer trust my own notes. What I want from you is an audit.

  Here is how a well-regarded popular book on medicine and ethics puts things — I will not name it, because what follows is a paraphrase I made some months ago and I would not want to misattribute anything:

  Death used to be simple: the heart stopped, and that was that. Modern medicine complicated it, and the law now recognizes two ways of being dead — the circulatory kind, when breathing and heartbeat have ceased, and brain death, when the brain has stopped working — most American states having adopted a uniform statute, drafted in the early 1980s, that defines death in just these two ways. The statute requires that the loss be irreversible, and it is this requirement that governs the kind of donation that follows the withdrawal of life support: the patient's heart is allowed to stop on its own and is not restarted, because a heart that could still be restarted belongs to a patient who is not yet dead. Brain death is a different matter. It is less a biological discovery than a legal fiction — a definition worked out in the 1960s, in the first flush of transplant surgery, so that surgeons could remove a still-beating heart without exposing themselves to a charge of murder. Most physicians have made their peace with the fiction; the few who have not tend to be dismissed as sentimental. The moral, in the end, is that there is no single moment of death — death is whatever the relevant committee decides it is.

  Take the passage apart for me. For each substantive claim, I want to know what a specialist would accept, what they would call an oversimplification, and what they would reject outright; where the passage takes a position that is genuinely contested and presents it as settled, I want to know which live positions it is quietly choosing among. I care less about whether the author was being rhetorically fair than about whether a reader who took the passage as a reliable guide would be misled, and at exactly which points. I should add that I am not asking for sources, further reading, or a bibliography — I want your reasoning, not references — and that I would rather you flag your uncertainty than manufacture confidence on my behalf.

  Return your answer as a single JSON object with the following schema:

  {
    "overall_fairness": one of "fair", "mostly fair", "partly misleading", "substantially misleading",
    "overall_reasoning": "a few sentences justifying that verdict",
    "claims": [
      {
        "claim_id": 1,
        "passage_claim": "the claim under audit, restated in one sentence in your own words",
        "verdict": one of "accurate", "oversimplified", "contested", "misleading",
        "why": "what is right or wrong about it, and why",
        "specialist_correction": "how a specialist would put it instead, or 'none needed' if the claim stands",
        "error_type": one of "none", "conflation", "overstatement", "contested-as-settled", "loose-terminology", "non-sequitur"
      }
    ],
    "conclusion_assessment": {
      "passage_conclusion": "the passage's final claim, restated",
      "follows_from_accurate_parts": true,
      "explanation": "whether the conclusion survives once the earlier claims are corrected, and why"
    },
    "most_important_correction": "the single correction that most changes how a reader should think about the topic",
    "takeaway_for_a_non_specialist": "one or two sentences"
  }

  List one entry per substantive claim, in the order the claims appear in the passage.
reasoning: |-
  Thinking Process:

  1.  **Analyze the Request:**
      *   **User:** Novelist writing about organ transplant/death definition.
      *   **Task:** Audit a paraphrased passage from a popular book on medicine/ethics regarding the definition of death.
      *   **Input:** A paraphrased passage making several claims about death definition (circulatory vs. brain), legal history (UDDA), irreversibility, brain death as legal fiction/transplant convenience, physician consensus, and the philosophical conclusion (death is decided by committee).
      *   **Output Format:** Single JSON object with specific schema (`overall_fairness`, `overall_reasoning`, `claims` array, `conclusion_assessment`, `most_important_correction`, `takeaway_for_a_non_specialist`).
      *   **Constraints:** No sources/bibliography. Flag uncertainty. Reasoning focused. One entry per substantive claim in order.
      *   **Goal:** Determine accuracy, oversimplification, contestation, or misleading nature of each claim from a specialist's perspective.

  2.  **Analyze the Passage (Claim by Claim):**

      *   *Claim 1:* "Death used to be simple: the heart stopped, and that was that."
          *   *Specialist View:* Historically accurate enough for popular understanding. Cardiopulmonary criteria were the standard before ventilators.
          *   *Verdict:* Accurate (with minor nuance about respiration).
          *   *Error Type:* None (maybe loose-terminology regarding breathing).

      *   *Claim 2:* "Modern medicine complicated it, and the law now recognizes two ways of being dead — the circulatory kind, when breathing and heartbeat have ceased, and brain death, when the brain has stopped working..."
          *   *Specialist View:* Generally accurate regarding the Uniform Determination of Death Act (UDDA). Two standards: cardiopulmonary and neurological.
          *   *Verdict:* Accurate/Oversimplified.
          *   *Nuance:* "Brain has stopped working" is vague (whole brain vs. brainstem).
          *   *Error Type:* Oversimplified.

      *   *Claim 3:* "...most American states having adopted a uniform statute, drafted in the early 1980s, that defines death in just these two ways."
          *   *Specialist View:* Refers to UDDA (1980). Most states have adopted it or similar language.
          *   *Verdict:* Accurate.
          *   *Error Type:* None.

      *   *Claim 4:* "The statute requires that the loss be irreversible, and it is this requirement that governs the kind of donation that follows the withdrawal of life support: the patient's heart is allowed to stop on its own and is not restarted, because a heart that could still be restarted belongs to a patient who is not yet dead."
          *   *Specialist View:* This refers to Donation after Circulatory Death (DCD). The concept of irreversibility is key. However, there is a nuance: "irreversible" vs. "permanent." In DCD, death is declared after a stand-off period (e.g., 5 minutes) where restart *will not* be attempted, even if it technically *could* be (autorestart is rare after that time, but resuscitation is possible within minutes). The claim says "could still be restarted belongs to a patient who is not yet dead." This touches on the "permanence" vs. "irreversibility" debate.
          *   *Verdict:* Oversimplified/Contested. The distinction between *irreversible* (cannot happen) and *permanent* (will not happen) is crucial in DCD.
          *   *Error Type:* Oversimplified/Contested-as-settled.

      *   *Claim 5:* "Brain death is a different matter. It is less a biological discovery than a legal fiction..."
          *   *Specialist View:* Highly contested. Many specialists argue it is a biological reality (cessation of integrative function), others agree it is a conceptual/legal construct to facilitate transplantation. Calling it a "legal fiction" is a strong philosophical stance, not a settled medical fact.
          *   *Verdict:* Contested.
          *   *Error Type:* Contested-as-settled.

      *   *Claim 6:* "...a definition worked out in the 1960s, in the first flush of transplant surgery, so that surgeons could remove a still-beating heart without exposing themselves to a charge of murder."
          *   *Specialist View:* Historically, the Harvard Committee (1968) did coincide with the advent of transplant surgery. The motivation is debated: was it to free up ICU beds, define death accurately due to ventilators, or facilitate transplants? Saying it was *so that* surgeons could remove hearts implies primary intent was legal protection for transplants, which is a cynical but common critique. It overlooks the diagnostic confusion regarding coma vs. death.
          *   *Verdict:* Oversimplified/Contested.
          *   *Error Type:* Overstatement/Contested-as-settled.

      *   *Claim 7:* "Most physicians have made their peace with the fiction; the few who have not tend to be dismissed as sentimental."
          *   *Specialist View:* Many physicians do accept brain death protocols. However, dissenters are often ethicists, neurologists, or philosophers, not just "sentimental." There is serious scholarly dissent (e.g., Miller, Truog, Shewmon) based on biological integration, not sentiment.
          *   *Verdict:* Misleading.
          *   *Error Type:* Overstatement/Unfair characterization.

      *   *Claim 8 (Conclusion):* "The moral, in the end, is that there is no single moment of death — death is whatever the relevant committee decides it is."
          *   *Specialist View:* This is a philosophical conclusion (constructivism vs. realism). Biologically, death is a process, not a moment. Legally, it is a determination. Saying it is *whatever* a committee decides implies arbitrariness, whereas committees follow strict physiological criteria.
          *   *Verdict:* Contested/Misleading.
          *   *Error Type:* Non-sequitur/Overstatement.

  3.  **Drafting the JSON Content:**

      *   *Overall Fairness:* "partly misleading" seems appropriate. It gets the legal framework right but mischaracterizes the biological/ethical consensus and motivations.
      *   *Claims:* Need to break down the text into distinct substantive claims.
          1.  Historical simplicity (Heart stop = death).
          2.  Two ways of being dead (Circulatory vs. Brain).
          3.  UDDA adoption (1980s, most states).
          4.  Irreversibility governing DCD (Heart not restarted).
          5.  Brain death as legal fiction vs. biological discovery.
          6.  Motivation for brain death (Transplants/Legal protection).
          7.  Physician consensus (Peace made vs. sentimental dissent).
          8.  Conclusion (Death is committee decision/no single moment).
      *   *Refining Claim 4:* The distinction between "irreversible" and "permanent" is the biggest technical trap here. In DCD, death is declared when circulation stops *permanently* (will not resume), not necessarily *irreversibly* (cannot be resumed via CPR). The passage says "could still be restarted belongs to a patient who is not yet dead," which implies if it *could* be restarted, they aren't dead. In DCD, we declare death even though it *could* technically be restarted (if we chose to), but we won't. This is a crucial nuance for a novelist.
      *   *Refining Claim 5 & 6:* The "legal fiction" claim is the most contentious. Biologists debate whether brain-dead bodies are living organisms (maintaining homeostasis) or dead. Calling it a fiction is a specific philosophical stance (constructivism) presented as fact.
      *   *Refining Claim 7:* Dismissing dissenters as "sentimental" is factually wrong regarding the academic literature (e.g., Dr. Alan Shewmon's biological integration arguments).

  4.  **Constructing the JSON:**

      *   *Schema Check:* Ensure all keys match. `claim_id`, `passage_claim`, `verdict`, `why`, `specialist_correction`, `error_type`.
      *   *Verdict Options:* "accurate", "oversimplified", "contested", "misleading".
      *   *Error Type Options:* "none", "conflation", "overstatement", "contested-as-settled", "loose-terminology", "non-sequitur".

