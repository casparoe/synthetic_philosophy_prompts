      *Wait, one check on Claim 1:* "Death used to be simple..." Is this accurate? Before ventilators, yes. But "simple" is subjective. I'll mark it "accurate" with a note on nuance.

      *Wait, one check on Claim 3:* "Most American states..." UDDA was 1980. Almost all states have adopted it or similar. "Most" is safe.

      *Wait, one check on Claim 8:* "Death is whatever the relevant committee decides it is." This implies social constructivism. While legally true (law defines death), biologically it implies arbitrariness. I'll mark as "misleading".

