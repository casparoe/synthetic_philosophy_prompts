answer: |-
  **PRE-SESSION BRIEFING: LOAD-BEARING CLAIMS & OBJECTION MAP**

  **Concessions to Make Up Front**
  Do not waste credibility defending these points; they are the price of admission for a degreed view.
  1.  **Ontic Vagueness:** Concede immediately that *existence* itself is not vague. You are proposing vagueness in *composition*, not in *being*. If you claim objects vaguely exist, you will lose the room in five minutes. Frame it as vagueness in the *parthood relation*, not the *existential quantifier*.
  2.  **Threshold Arbitrariness:** Concede that the threshold for "counting as a composite" is interest-relative. Do not try to find a natural joint in nature for the cut-off point. Your claim is that the *gradient* is natural, the *line* is pragmatic.
  3.  **Fundamental Physics:** Concede that your measure does not apply at the fundamental quantum level. You are operating at the level of effective field theories or macroscopic causal models. If you claim this holds for entangled particles, the physicist will eat you alive.

  **The One Reply That Must Land**
  You must successfully defend the claim that **binary composition fails to track causal reality.**
  If the Organicists or Nihilist convince the room that composition *must* be binary to be metaphysically serious, your degree-based metric becomes a mere heuristic for "useful fictions" rather than an ontological account. You need to land the point that causal invariance is a continuous physical fact, and therefore any ontology that forces a binary map onto a continuous territory is losing information. If you cannot justify why metaphysics should care about the gradient, you are just doing engineering, not ontology.

  ***

  **Q&A PREP SHEET**

  **1. The Organicists (Van Inwagen Camp)**
  *   **Objection:** "You claim to repair the cohesion answer, but you've actually abandoned it. Life is a switch, not a dimmer. An organism captures a token causal event (a life) or it doesn't. By making composition a matter of degree, you've stopped answering the Special Composition Question and started answering 'How cohesive is this group?' Those aren't the same question. You haven't told us when there is *one thing*; you've told us when there is a *tight group of things*."
  *   **Reply:** "I grant that 'Life' is a binary biological category, but I deny it is the only metaphysically relevant boundary for composition. If composition is grounded in causal unity, and causal unity is physically continuous (as interventionist accounts suggest), then a binary ontology forces a false discontinuity on the world. I am answering SCQ by saying the question presupposes a binary output where the input is analog. I'm not telling you when there is 'one thing' in a counting sense; I'm telling you the degree to which 'one thing' is the correct causal model."
  *   **Soft Spot:** You are effectively changing the subject from *ontology* (what exists) to *model selection* (what describes best). If they press that "existence" cannot be a matter of model selection, you have no non-pragmatic answer.

  **2. The Mereological Nihilist**
  *   **Objection:** "This is sentimental nihilism. You're saying composition *almost* never happens, but you're using a continuous parameter to soften the blow. If the threshold is set by 'explanatory interest,' then composition isn't a fact about the world, it's a fact about us. That means there are no composites mind-independently. You're a nihilist who likes to use the word 'degree' to avoid the sting."
  *   **Reply:** "A nihilist says the causal profile of the whole is never distinct from the sum of the parts. I am saying it often is distinct, to varying magnitudes. The invariance under perturbation is a mind-independent physical fact. Whether we *label* that invariance 'composition' is pragmatic, but the underlying gradient is ontic. I'm not softening nihilism; I'm rejecting the binary assumption that forces nihilism as the only rigorous option."
  *   **Soft Spot:** If the gradient is mind-independent but the *composition* (the thing you're studying) is threshold-dependent, they will argue the threshold-dependence swallows the gradient. You risk admitting the gradient is real but composition is not.

  **3. The Universalist**
  *   **Objection:** "You're gerrymandering. You want the atoms to compose, and the refrigerator to compose, but not the 'trout-turkey' (the fusion of a trout and a turkey). But on your measure, if I perturb the trout, the turkey doesn't change. So they don't compose. But why is *that* threshold the right one? You're just reverse-engineering common sense intuitions and dressing them up as causal invariance. You want the ontology of the manifest image with the vocabulary of fundamental physics."
  *   **Reply:** "I am not trying to save common sense; I am trying to save causal explanation. The trout-turkey fails to compose because it offers no causal compression. Modeling it as one object adds no predictive power over modeling it as two. The threshold isn't set to match intuition; it's set to match explanatory utility. If common sense aligns, it's because common sense tracks causal utility."
  *   **Soft Spot:** "Explanatory utility" is notoriously subjective. If two agents have different interests, do they inhabit different ontologies? If you say yes, you're an ontological relativist, which is a hard sell in a metaphysics department.

  **4. The Philosopher of Biology**
  *   **Objection:** "You mentioned the refrigerator might outrank the jellyfish. That is a category error. A jellyfish is a locus of selection; a refrigerator is a locus of design. A jellyfish maintains its invariance through homeostatic adaptation; a refrigerator maintains it through rigid stability. If you perturb a jellyfish's parts, it repairs them. If you perturb a fridge's parts, it breaks. Your metric favors brittle artifacts over resilient organisms. Why should metaphysics privilege engineering tolerances over biological homeostasis?"
  *   **Reply:** "That is an empirical risk of the measure, not a bug. Perturbation-invariance measures *current* causal integration, not *historical* origin. A broken jellyfish scores lower than a working fridge. However, a healthy jellyfish likely scores higher on *dynamic* invariance (adaptation to perturbation) than a fridge. I need to refine the metric to distinguish 'resistance to perturbation' from 'recovery from perturbation.' I concede the current sketch favors static cohesion."
  *   **Soft Spot:** This is your weakest empirical claim. If you concede the metric needs refinement here, they will ask why the core metric isn't already broken. You need to pivot to "dynamic invariance" quickly without sounding like you're moving the goalposts.

  **5. The Physicist**
  *   **Objection:** "You're using interventionist causality (Pearl/Woodward). That works for macrosystems. But you're making ontological claims. What is the 'perturbation' at the fundamental level? You can't intervene on a quantum system without changing the Hamiltonian. If your measure only works at the macro-level, your ontology is emergent only. Are you saying composition doesn't exist at the fundamental level?"
  *   **Reply:** "Correct. Composition is an emergent phenomenon. At the fundamental level, there is likely only the wavefunction (or whatever the fundamental ontology is). Composition arises when decoherence allows for stable, separable causal structures. I am not offering a fundamental ontology; I am offering an account of how macroscopic objects emerge from fundamental physics via causal stability."
  *   **Soft Spot:** If you admit composition is only emergent, the Nihilist will argue that *only* the fundamental level is real. You need to hold the line that emergent causal powers are ontologically robust, not just epistemic conveniences.

  **6. The Deflationists (Carnapian/Pragmatist)**
  *   **Objection:** "Let's say you're right. There is a gradient of causal invariance. We set a threshold based on interest. What turns on the answer? If we agree on the physics and the utility, why do we need to argue about whether this counts as 'composition'? Isn't this just a verbal dispute about whether to use the word 'object' for high-invariance clusters?"
  *   **Reply:** "It turns on resource allocation for inquiry. If we treat a cluster as a composite, we look for laws governing the whole. If we treat it as parts, we look for laws governing the interactions. Misidentifying the degree of composition leads to category mistakes in science (e.g., looking for a 'soul' in a refrigerator or looking for 'gene-level selection' in a tightly integrated organism). The ontology drives the research program."
  *   **Soft Spot:** They will reply that you can have the research program without the ontological commitment. You need to argue that the ontological commitment *is* the commitment to the reality of the causal powers, not just the linguistic label.

  ***

  **The Objection You Hope Nobody Asks**
  *"If composition comes in degrees, do you exist in degrees? If I replace one of your neurons, your perturbation-invariance score changes slightly. Are you less 'you' than you were five minutes ago? If so, how do you ground moral responsibility or personal identity on a sliding scale of mereological integration?"*
  *   **Why it kills you:** It forces you to apply your metaphysical view to the subject presenting it. If you exist only to a degree, your authority to present the paper is undermined. If you claim you exist absolutely, you are exempting yourself from your own thesis.
  *   **Defense:** "Personal identity is a separate track from synchronic composition. I am arguing about *objects*, not *persons*. However, if pressed, I would accept that agency is also a matter of degree, which aligns with legal and moral practices regarding capacity." (This is a bluff. Be ready to pivot hard to "Synchronic vs. Diachronic".)

  ***

  Verdict: The position survives only if you successfully frame the "gradient" as ontologically robust rather than pragmatically convenient; otherwise, you will be categorized as a deflationist in realist clothing.
