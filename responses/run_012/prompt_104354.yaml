answer: |-
  The mist clung to the hemlocks, dampening the sound of the forest until the only noise was the wet tear of the mushroom being lifted from the loam. Elara held it up, the cap a vibrant, sunset orange, the stem thick and pale. It smelled faintly of anise, exactly as she had taught Toby for two seasons.

  "It's safe," Elara said, reaching for her basket.

  "Don't," Toby said. His voice was tight, lacking its usual deference. "Put it down."

  Elara paused, her hand hovering over the wicker weave. "Orange cap. Anise smell. Yellow bruise when I thumb it. That's the rule, Toby. The Rule of Three."

  "That's *your* rule," Toby said. He crouched, digging his fingers into the dirt where the mushroom had stood. "My rule is: Orange cap, anise smell, yellow bruise, *and* grows in acidic soil. We tested the pH on the last hundred, Aunt Elara. Every single one was under 6.0. This one..." He held up a small testing kit, the strip turning a neutral green. "This is neutral. Oak leaf litter. It's never come up before."

  Elara felt a cold slip in her stomach that had nothing to do with the damp air. She looked at the mushroom. It looked exactly like the hundred before it. "I never mentioned soil acidity."

  "You never had to," Toby said. "Until now."

  They walked back to the cabin in silence, the mushroom wrapped in a cloth between them like a detonator. Inside, the air smelled of dried sage and old paper. Elara threw the logbook onto the table. It was thick, filled with her handwriting and Toby's neat annotations. Photos were taped next to entries: *October 12, Pine Ridge, Safe.* *October 15, Birch Hollow, Safe.*

  "Show me," Elara said. "Show me where I said acidity matters."

  Toby opened the book. He ran a finger down the column of pH readings. "You didn't say it. But you never approved a mushroom that wasn't acidic. Every instance of 'Safe' in this book is compatible with my rule. Every instance is also compatible with yours. The data doesn't distinguish them."

  Elara flipped pages frantically. She looked for a marginal note, a warning she might have whispered, a hesitation she might have shown when a neutral-soil mushroom appeared. There was nothing. Her past actions were a finite set of points, and now she saw them clearly: infinite lines could be drawn through them. She had meant to follow the rule of *appearance*, she was sure of it. But how could she prove she hadn't been following the rule of *appearance-plus-environment*? The memory of her own intention felt slippery, like trying to grasp smoke. Was there a fact of the matter about what she meant two years ago, or was she just remembering what she wanted to remember now?

  "I know what I meant," she said, but her voice lacked conviction. "I meant the look of the thing. The smell."

  "Maybe you did," Toby said. "Or maybe you meant what you *would have done* if this had come up. But you can't know that. You've never been here before."

  The door opened, letting in a gust of cold air. Marcus stepped in, shaking water from his raincoat. He was the club's secretary, a man who believed procedures could solve anything.

  "Argument?" Marcus asked, eyeing the wrapped mushroom.

  "Rule conflict," Toby said. "Elara says eat. I say poison. The past doesn't settle it."

  Marcus unwrapped the cloth and looked at the orange cap. He listened to Toby's explanation about the soil pH, then to Elara's insistence on the morphological features. He nodded slowly, closing the logbook.

  "This is why we have the club," Marcus said. "Meaning isn't inside your head, Elara. It's not even in the book. It's in what we do. If the community of foragers accepts this mushroom as safe, then the rule *was* always about the cap and smell. If we reject it, the rule was always about the soil. We fix the meaning now by acting."

  "So it's a vote?" Elara asked, feeling a surge of irritation. "Safety is a democracy?"

  "Consensus is how language works," Marcus said. "If we all eat it and no one dies, Toby's rule gets rewritten to match. If you get sick, then we say Toby was right all along. The future settles the past."

  "That's terrifying," Elara whispered. "You're saying there's no truth until we gamble?"

  "I'm saying there's no truth without use," Marcus corrected. "Stop looking for a ghost in the machine. Look at the practice."

  Elara looked at Toby. He was watching her, waiting. He wasn't looking for a ghost either; he was looking for a disposition. He wanted to know what her training would have produced in this specific, novel case. But she didn't know. She felt a vertigo open up beneath her feet. The ground of her expertise, solid for twenty years, had turned to mesh. She realized she could not appeal to her own mind to verify what her mind contained.

  "We can't vote on a poison," Toby said quietly. "If we're wrong, the cost is too high."

  "Then we don't eat it," Marcus said. "Default to caution. That's also a community norm."

  "But then we admit the rule was broken," Elara said. "Or that it was never fixed."

  "Or," Marcus said, "we admit that rules are rails laid only as far as the train has traveled. Beyond that, we lay them track by track."

  Elara looked at the mushroom. It sat on the wooden table, innocent and deadly. It was just a fungus. It didn't care about rules, or pH, or the infinite regress of interpretations. It just was. The burden was entirely on them to impose a structure that wasn't there. She thought about the hundred times she had nodded at Toby, confirming his understanding. She had thought she was transferring a picture of the world into his head. Now she saw she had only been training a behavior, and behaviors diverge when the context shifts.

  She could insist. She could eat it herself to prove her rule was the real one. But that was just another move in the game, another data point that could be reinterpreted later. *She was reckless,* they would say. *Her rule was always flawed.*

  Or she could throw it away. Admit that the meaning was lost.

  Elara picked up her knife. The steel was cold, the edge honed to a razor shine. She looked at Toby, then at Marcus. Neither moved. The room was silent except for the hum of the refrigerator and the rain against the window. There was no answer in the logbook. There was no answer in the community consensus, only a temporary stabilization. There was no answer in her own head, only a feeling of certainty that might be a hallucination.

  She had to choose. Not discover, not verify. Choose.

  Elara placed the tip of the knife against the stem. The metal bit into the flesh, releasing a puff of white spores into the still air. She didn't lift it toward the pan, and she didn't toss it into the bin. She held the knife there, the blade sinking deeper, waiting for her hand to decide what the rule had been all along.
