answer: |-
  ### Credence in the Divergence Thesis

  **Final Credence: 0.25**

  I assign a 25% probability to the Divergence Thesis (DT). This reflects a serious acknowledgment of the structural instability of long-term consequentialist calculation, without conceding that the formalism breaks down in all possible worlds. The decomposition follows.

  ### Decomposition of Terms

  **(a) Causal Amplification: 0.80**
  *Probability that the correct causal model has amplification-heavy tails.*
  **Justification:** Social and historical systems exhibit sensitive dependence on initial conditions (chaos theory). While some forces dampen noise (institutional inertia), the "butterfly effect" in complex networks suggests that small perturbations can lock into path-dependent trajectories (e.g., a chance meeting altering a lineage). The physical constraints on energy do not bound *informational* or *axiological* impact (e.g., the value of a future civilization hinges on early contingency). I assign high probability here because damping is the exception, not the rule, in historical causality.

  **(b) Axiological Weight: 0.90**
  *Probability that the true axiology assigns non-negligible weight to distant effects.*
  **Justification:** Any plausible consequentialist theory that avoids arbitrary temporal discrimination must assign significant weight to the future. Total utilitarianism, the dominant candidate in this space, implies unbounded value potential via future populations. Even person-affecting views often extend to future contingent people. Rejecting this requires a strong pure time preference or a finite universe axiom, both of which are minority positions in serious axiology.

  **(c) Symmetry/Cancellation: 0.35**
  *Probability that a cancellation argument restores convergence.*
  **Justification:** This is the probability that positive and negative tail scenarios are symmetric enough to sum to zero (or a stable finite value). I assign a *low* probability to this (meaning I think symmetry is unlikely to save us). In path-dependent systems, outcomes are not random walks around a mean; they are attractors. Saving a life does not produce a random distribution of future value; it produces a specific lineage whose value is correlated with the act of saving. However, I do not assign 0, because some noise may average out over sufficient scale.
  *Contribution to DT:* $1 - 0.35 = 0.65$.

  **(d) Bounding/Saturation: 0.20**
  *Probability that bounding the value function is legitimate and sufficient.*
  **Justification:** This is the probability that we can legitimately cap utility (e.g., bounded utilitarianism) to force convergence without violating dominance principles or moral intuition. I assign low probability here. Bounding often implies that saving a billion lives is not significantly better than saving one, once a threshold is passed, which violates core consequentialist intuitions. It looks more like a formal fix than a moral truth.
  *Contribution to DT:* $1 - 0.20 = 0.80$.

  **(e) Well-definedness: 0.85**
  *Probability that the notion of EV over an unbounded horizon is coherent.*
  **Justification:** This is the probability that the question has a truth value. While infinite ethics is plagued by paradoxes (e.g., the infinitarian paralysis), standard decision theory can handle limits and infinite sums if they converge. The problem is not that the math is impossible, but that the result is unstable. I allow a 15% chance that the framework itself is category-error nonsense, which would vacuously falsify DT.

  **(f) Universality: 0.70**
  *Probability that this applies to "essentially any act" available to a typical individual.*
  **Justification:** The thesis claims *any* ordinary act. Some acts may be robustly good or bad regardless of long-term chaos (e.g., acts that directly prevent immediate extinction vs. choosing tea over coffee). However, for a *typical* individual, most acts are mundane. The causal footprint of mundane acts is almost entirely determined by long-term trajectories. I assign 0.70 because there may be a small class of "robust" acts, but they are not the typical case.

  ### Combination

  To derive the credence in the Divergence Thesis, we treat the terms as necessary conditions for divergence. The EV diverges if effects amplify (a), value extends (b), symmetry fails (not-c), bounding fails (not-d), the concept is coherent (e), and the act is vulnerable (f).

  $$P(DT) \approx P(a) \times P(b) \times [1 - P(c)] \times [1 - P(d)] \times P(e) \times P(f)$$

  $$P(DT) \approx 0.80 \times 0.90 \times 0.65 \times 0.80 \times 0.85 \times 0.70$$

  $$P(DT) \approx 0.22$$

  I round this to **0.25** to account for covariance between terms (e.g., if causal amplification is high, symmetry is likely lower) which increases the joint probability slightly.

  ### Sensitivity Analysis

  My final number is most sensitive to **Term (c): Symmetry/Cancellation**.

  *   **Why:** This term acts as the primary switch between "high variance" and "divergence." If symmetry holds ($P(c) \to 1$), the infinite tail sums to zero, and the expected value converges to the short-term impact. If symmetry fails ($P(c) \to 0$), the tail dominates.
  *   **What would move it:** A revision to the **causal model** of history. If historical development is shown to be ergodic (returning to a stable distribution regardless of initial conditions), $P(c)$ rises, and DT collapses. If history is shown to be radically path-dependent with locked-in attractors (e.g., technological lock-in), $P(c)$ falls, and DT approaches certainty. The axiology (b) is a close second, but even with unbounded value, symmetry could theoretically save convergence.

  ### Diagnostic: Criterion vs. Guide

  If the Divergence Thesis is true, the expected value of an act is mathematically undefined. One cannot maximize an undefined quantity.

  **Credence that the correct response is to retain consequentialism as the criterion while abandoning it as a guide: 0.80**

  **Justification:** The truth of DT implies that *Objective Consequentialism* (what actually maximizes the good) remains a fact of the matter (from a God's-eye view where the infinite sum might resolve), but *Subjective Consequentialism* (maximizing expected value based on our epistemic state) becomes impossible. The rational move is to adopt a proxy guide—such as Rule Consequentialism, Virtue Ethics, or "Cluelessness-Aware" heuristics (e.g., focusing on robustly good short-term outcomes)—while maintaining that the *rightness* of the act is still determined by its actual consequences. To abandon the criterion entirely is to concede that consequences do not matter, which contradicts the initial setup.

  ### Locating Disagreement (0.9 vs. 0.2)

  A proponent at **0.9** and a skeptic at **0.2** on the Divergence Thesis most plausibly disagree on **Term (c): Symmetry/Cancellation**, and secondarily on **Term (a): Causal Amplification**.

  *   **The 0.9 Proponent** believes history is a chaotic, path-dependent system where small differences lock in permanently (Low $P(c)$, High $P(a)$). They view the future as a branching tree where the value of branches is uncorrelated and unbounded, making cancellation impossible.
  *   **The 0.2 Skeptic** believes that while chaos exists, systemic damping forces (regression to the mean, institutional stability) or axiological symmetry (good and bad futures are equally likely) ensure that the *expected* value of the tail converges to zero (High $P(c)$). They argue that without a specific reason to think *my* act biases the future positively rather than negatively, the rational expectation is null.

  They do not primarily disagree on axiology (b) or formalism (d); both likely accept future value and standard decision theory. The split is empirical and metaphysical: **Is the long-term noise random (canceling) or structural (divergent)?**
