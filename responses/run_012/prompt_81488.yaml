  This step claims heterophenomenology never delivers a fact, only narratives. This is false. Heterophenomenology treats the subject's utterances and behaviors as brute physical facts—the data to be explained. When a subject says "I see red," the method brackets whether they really experience redness, but it accepts as fact that they produced those sound waves. The scientist's report records these physical events. The regress stops at the physical record: ink marks, audio files, neural activity. These are facts about the world, not merely narratives. Step (6) conflates the *semantic content* of a report (which is interpreted) with the *physical occurrence* of the report (which is observed).

  Why does (6) look plausible? It relies on the intuition that interpretation always interposes a layer between the observer and reality. If every report is a "text," truth seems to recede into an infinite hall of mirrors. The friend assumes that treating something as a text denies its causal efficacy or physical reality. It exploits the ambiguity of "text," sliding between "meaningful structure" and "mere fiction."

  What is the cost? Rejecting (6) requires qualifying premise (1). Heterophenomenology cannot be wholly neutral. It must take a realist stance on the physical world and the subject's behavior. I must concede that the method is not neutral about whether the subject *spoke*, only about whether what they spoke *accurately reflects their inner state*. This narrows the method's neutrality: it is neutral regarding phenomenology, but realist regarding behavior. This saves the method from solipsism but requires admitting that it presupposes a shared physical reality where reports occur as events. It also means accepting that the scientist's observational reports (e.g., "Subject said X") are privileged as factual in a way that the subject's experiential reports (e.g., "I felt Y") are not. This asymmetry is necessary to ground the science, but it slightly tarnishes the pure evenhandedness promised in (2). Ultimately, I must defend a modest physicalism: the method works because there is a real world anchoring the texts.
