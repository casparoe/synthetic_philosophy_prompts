answer: |-
  You have put your finger on the central tension in the philosophy of history, yet there is no single, universally accepted term for exactly this *asymmetry of explanation*.

  The closest existing concepts are **Self-Organized Criticality** (from physics/complexity science) and **Critical Junctures** (from political science), but neither captures the specific *explanatory move* you are describing. Self-Organized Criticality explains why a sandpile avalanches on a specific grain, but it doesn't name the historian's act of pointing to *that* grain and saying "this was the cause" only after the avalanche has settled. Critical Junctures imply a period of instability, but often assume we can identify the juncture independently of the outcome.

  Since there is no perfect existing word, I will coin one that fits the precision of your observation. I propose calling this shape of explanation **Ex Post Criticality**.

  Here is the breakdown of the term, its edges, and the reality of the "poisedness."

  ### The Term: Ex Post Criticality

  **Definition:** The attribution of decisive causal leverage to a minor contingent event, based on the retrospective identification of the system's state as having been metastable (poised on a knife-edge) at that specific moment.

  **Why this name?**
  *   **Ex Post:** Captures the epistemic asymmetry. You cannot know the event was "load-bearing" until the load has either broken the beam or been safely carried.
  *   **Criticality:** Borrows from physics (critical mass, critical point). It acknowledges that the "poisedness" is a property of the *system*, not just the *event*. The message wasn't late and decisive; the message was late *into a critical system*.

  ### The Edges: What It Rules Out

  You asked for the boundaries. Here is how **Ex Post Criticality** distinguishes itself from the concepts you rightly found lacking:

  **1. Vs. The Butterfly Effect (Sensitive Dependence)**
  *   **Butterfly Effect:** Claims that *any* small change can have a large effect. It implies a universal potential for amplification.
  *   **Ex Post Criticality:** Claims that *most* small changes are absorbed, and only *specific* small changes at *specific* times are amplified. It rules out the idea that history is always chaotic. It asserts that history is mostly stable (dampening noise) and occasionally critical (amplifying noise). The Butterfly Effect says "small things matter." Ex Post Criticality says "small things matter *only when the system is ready to break*."

  **2. Vs. Hard Determinism (Inevitability)**
  *   **Determinism:** Claims the outcome was fixed by structural forces (geography, economics). The migraine is irrelevant; someone else would have won.
  *   **Ex Post Criticality:** Accepts that structural forces create the *conditions* for the poisedness (the angle of the sandpile), but insists the *trigger* is genuinely contingent. It rules out the idea that the outcome was inevitable. It allows for the migraine to decide the war, provided the armies were already equally matched (metastable).

  **3. Vs. Hindsight Bias (The Narrative Fallacy)**
  *   **Hindsight Bias:** Claims the "poisedness" is an illusion created by the storyteller to make a tidy plot.
  *   **Ex Post Criticality:** Leaves open the possibility that the poisedness was **real**. It distinguishes between the *reality of the instability* and our *inability to measure it beforehand*. Hindsight Bias says "you're making it up." Ex Post Criticality says "you're identifying a real state, but you can only verify it after the fact."

  ### The Ontology: Is the "Poisedness" Real?

  This is the hardest part of your question. Is the system actually sitting on a knife-edge, or do we only *see* a knife-edge because we know where the fall happened?

  **The Argument for Reality (Complexity Theory):**
  In complex systems (ecosystems, tectonic plates, economies), **metastability** is a measurable, objective state. A sandpile has a specific "angle of repose." You can measure the slope. If the slope is 30 degrees, a grain causes a slide. If it is 20 degrees, it does not.
  *   **In History:** We can sometimes measure this "slope" beforehand. We can see that two armies are equally matched, that a regime has lost legitimacy, or that a market is over-leveraged. We can know a system is *fragile* without knowing *which grain* will break it.
  *   **Verdict:** The *potential* for amplification (the poisedness) is likely a real property of the world.

  **The Argument for Retrospection (Epistemology):**
  While the fragility might be real, the identification of the *specific* load-bearing event is almost always **Ex Post**.
  *   In a sandpile, every grain is identical. In history, every "grain" (message, fog, migraine) is unique. Because they are unique, we can construct a story about *why* that specific grain mattered (e.g., "The message was late *because* the rider was tired").
  *   **Verdict:** The *selection* of the cause is retrospective. We choose the grain that fell, not the grain that could have fallen.

  ### Summary of the Pattern

  When a historian uses **Ex Post Criticality**, they are making a specific claim:
  1.  **Structural Determinism** created a metastable state (the armies were equal, the regime was weak).
  2.  **Contingency** provided the trigger (the fog, the message).
  3.  **Causal Leverage** was assigned retrospectively (we know the trigger mattered because the system collapsed).

  This explains the nagging feeling you have. You are sensing the gap between the **real instability** of the situation and the **retrospective selection** of the cause. The historian treats the trigger as if it were inherently special, when its specialness is derived entirely from the outcome.

  **The Coinage:**
  If you need to use this in conversation or writing, I recommend **Ex Post Criticality**.
  If you want something more evocative for the specific "load-bearing" aspect, you might call it **The Fulcrum Retrospect**.

  **The Fulcrum Retrospect:** *The error of assuming a lever existed because we see the rock move, without acknowledging that we only placed the fulcrum there after the lift was complete.*

  ### Why Historians Do This
  They do it because **Ex Post Criticality** is the only way to reconcile human agency with structural force.
  *   If everything is structure, humans don't matter.
  *   If everything is contingency, history is random noise.
  *   **Ex Post Criticality** allows the historian to say: "The structures made the moment ripe (Determinism), but the human action tipped the scale (Agency)." It is a necessary fiction for making history readable, even if the "tipping point" can only be verified once the scale has settled.
