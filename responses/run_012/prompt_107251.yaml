  This principle is strong, but it strains against your data in two specific locations.

  **Strain 1: The Hierarchy of Motives (Cases 2 and 3)**
  Your principle treats the "concern for features that make the action right" as a binary condition: either the agent has it or they don't. In Case 2 (Sympathy), the woman is moved by the *need* (a right-making feature). In Case 3 (Duty), the man is moved by the *moral requirement* (also a right-making feature). Your principle predicts these acts should have equal moral worth. Yet, your verdict is that Case 3 has *more* worth than Case 2. The tentative principle lacks the vocabulary to distinguish between a concern for the *good* (sympathy) and a concern for the *right* (duty), or to value the struggle of the latter over the ease of the former.

  **Strain 2: The Locus of Rightness (Cases 4 and 7)**
  Your principle requires concern for features that *make the action right*. This implies objective rightness.
  *   In Case 4 (Ritual), the action is objectively wrong. The principle correctly predicts "no worth" (matching your verdict), but only because the action *isn't* right. This makes moral worth dependent on the agent's cultural luck rather than their will.
  *   In Case 7 (Physician), the action (killing) is objectively wrong, but the will was epistemically rational. Your principle predicts "no worth" (because the act wasn't right), but you are "unsure."
  The tension here is whether moral worth tracks **objective success** (saving Case 4's verdict) or **rational volition** (saving Case 7's intuition). Holding both verdicts requires a complex distinction between "reasonable error" (Physician) and "indoctrinated error" (Ritual Mother).

  ### The Recommendation: Surrender Case 4

  Saving all seven verdicts requires a principle baroque enough to distinguish between "epistemically justified false belief" (Physician) and "culturally conditioned false belief" (Ritual Mother). This distinction is difficult to ground without a full theory of knowledge and sociology.

  It is philosophically cheaper to **surrender the verdict on Case 4**.

  **Why this is the cheapest concession:**
  Your introduction states that moral worth is about what "reflects well on the agent." Case 4 describes an agent with a "wholehearted," "costly," and "duty-governed" will. To deny her moral worth is to say that moral admirability depends on being born in the correct culture. This contradicts the core idea that worth reflects on the *agent's character* rather than their *luck*. Surrendering Case 4 allows us to align the principle with your stated goal (reflecting on the agent) and resolves the tension with Case 7 (both involve good wills operating under uncertainty).

  ### The Repaired Principle

  **Principle:** An action has moral worth if and only if:
  1.  **Volitional Clause:** The action issues from a will that intends to bring about a morally good state of affairs or fulfill a moral obligation;
  2.  **Causal Clause:** This intention is the sufficient cause of the action, not merely a companion to it or overridden by accident;
  3.  **Epistemic Clause:** The agent's belief that the action is good or obligatory is epistemically reasonable given the evidence available to them;
  4.  **Hierarchy Clause:** The worth is amplified if the motive includes a recognition of moral authority (duty) rather than mere inclination, particularly when inclination is absent or opposed.

  **How the Clauses Save the Verdicts:**
  *   **Clause 1 (Volitional):** Saves **Case 1** (Shopkeeper fails; intends profit, not good) and **Case 7** (Physician passes; intends healing). It forces the surrender of **Case 4** (Ritual Mother passes; intends duty), acknowledging her will is admirable even if the act is tragic.
  *   **Clause 2 (Causal):** Saves **Case 6** (Forgetful Promiser fails; intention did not cause the act).
  *   **Clause 3 (Epistemic):** Saves **Case 7** (Physician passes; belief was reasonable). It distinguishes her from a negligent agent.
  *   **Clause 4 (Hierarchy):** Saves **Case 2 vs. Case 3**. Both pass Clause 1, but Case 3 scores higher on Clause 4 because the motive is duty against inclination, whereas Case 2 is inclination aligning with good. It also clarifies **Case 5** (Mixed Motives): as long as the moral concern is *sufficient* (Clause 2), the presence of background self-image concerns does not negate worth, though it may not amplify it via Clause 4.

  ### The Gap Case

  To test the boundary between Clause 2 (Causal) and Clause 4 (Hierarchy), consider this case:

  **Case 8 (The Reluctant Philanthropist):** A man despises a particular charity but donates to it solely because he believes it is his duty. However, unknown to him, he is also subconsciously motivated by a desire to impress a woman who supports the charity. Psychological testing reveals that *either* motive alone would have been sufficient to produce the donation.

  **Prediction:** This act has moral worth, but less than Case 3.
  **Reasoning:** Clause 2 is satisfied (the duty motive was *a* sufficient cause). Clause 1 is satisfied (will intends good). However, Clause 4 is strained because the motive is not pure; the "struggle" is contaminated by the subconscious inclination. This tests whether moral worth requires the duty motive to be the *exclusive* sufficient cause or merely *a* sufficient cause. My principle suggests the latter, but the "admiration" is dampened.

  ### Act vs. Will: The Function of Moral Worth

  Regarding Case 7 (Physician), the uncertainty about whether worth attaches to acts or wills turns on **what moral worth is for**.

  1.  **If Moral Worth is for Guidance (Consequentialist Function):** We care about worth to encourage actions that produce good outcomes. If so, worth must attach to the **Act** (including outcomes). The Physician's act failed to produce good; therefore, it lacks full moral worth. This view prioritizes Case 4's verdict (Objective Rightness) but makes worth a matter of luck.
  2.  **If Moral Worth is for Character Assessment (Virtue/Kantian Function):** We care about worth to identify who is trustworthy and admirable as a human being. If so, worth must attach to the **Will**. The Physician's will was perfect; therefore, the act (described as an intentional attempt) has full moral worth. This view prioritizes Case 7's intuition and forces the surrender of Case 4's verdict.

  Since your stated goal is to find what "reflects well on the agent," the function is Character Assessment. Therefore, moral worth attaches to the **Will** (the intentional description of the act), not the causal outcome. The Physician's act, described as "attempting to save a life based on best evidence," has moral worth. The Ritual Mother's act, described as "fulfilling a sincere duty," also has moral worth, despite the tragic objective outcome.
