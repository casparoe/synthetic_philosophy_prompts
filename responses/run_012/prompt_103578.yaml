prompt: |-
  I recently joined my department's promotion committee, and at our last meeting something happened that I cannot stop turning over. We voted separately on whether each candidate cleared the research bar and the teaching bar, and then voted separately on whether to recommend promotion; for one candidate the outcome was a majority for each criterion and a majority against promotion. When I raised the oddity, a senior colleague settled it with "two heads are better than one — that is why we vote," and we moved on. I want to know what that one sentence could actually be claiming, because I suspect it was doing almost no work and that the real questions lie elsewhere. Please lay out the distinct precise theses the slogan might express, from the trivially true to the plainly false, and for each one say what it presupposes about the voters — their independence from one another, their individual competence, and what exactly they are being asked to judge — whether it is a platitude, a substantive and defensible claim, a contested one, or false, and whether it would in fact license the use my colleague put it to, namely aggregating separate votes on logically connected propositions and reading the results off as a verdict. Say also which reading someone who says this in a committee room is most likely to have in mind, and what that reveals about the argument they think they have made.

  Give me the result as a JSON object with these fields: "slogan" (the phrase as repeated); "readings" (an array, each entry an object with "label" (a short name for the reading), "precise_claim" (the thesis stated exactly), "presuppositions" (what must hold about the voters and the options), "verdict" (one of: platitude, substantive and defensible, contested, false), "supports_colleagues_use" (one of: yes, no, only under further conditions — with the conditions named), and "comment" (two or three sentences of justification); "most_likely_intended_reading" (the label, with a sentence on why); and "what_the_slogan_obscures" (a short paragraph naming the phenomenon that the slogan, on any reading, leaves out of view).
reasoning: |-
  Here's a thinking process that leads to the desired JSON output:

  1.  **Analyze the Request:**
      *   **Context:** A promotion committee voted separately on criteria (research, teaching) and then on the final outcome (promotion). For one candidate, the majority said "yes" to criteria but "no" to promotion. A senior colleague dismissed this inconsistency with "two heads are better than one — that is why we vote."
      *   **Task:** Analyze the slogan "two heads are better than one" in this specific context.
      *   **Requirements:**
          *   Output format: JSON.
          *   Fields: `slogan`, `readings` (array of objects with `label`, `precise_claim`, `presuppositions`, `verdict`, `supports_colleagues_use`, `comment`), `most_likely_intended_reading`, `what_the_slogan_obscures`.
          *   Content: Distinct precise theses (trivial to false), presuppositions about voters (independence, competence, task), evaluation of the claim, whether it justifies the colleague's move (aggregating separate votes on connected propositions), likely intended meaning, and what is being obscured (the logical paradox).

  2.  **Deconstruct the Situation (The Discursive Dilemma/Doctrinal Paradox):**
      *   The scenario describes a classic problem in social choice theory known as the *Discursive Dilemma* or *Doctrinal Paradox*.
      *   Premise-based procedure (PBP): Vote on criteria, derive conclusion.
      *   Conclusion-based procedure (CBP): Vote on conclusion directly.
      *   The conflict: Majority says Yes to A, Yes to B, but No to (A & B -> Promotion).
      *   The colleague's slogan ("two heads are better than one") is being used to dismiss the inconsistency.

  3.  **Brainstorm Readings of "Two Heads Are Better Than One":**
      *   *Reading 1 (Aggregation of Error):* Averaging out individual mistakes. (Condorcet's Jury Theorem).
      *   *Reading 2 (Diversity of Perspective):* Different people see different things.
      *   *Reading 3 (Legitimacy/Process):* The act of voting makes it valid, regardless of logic.
      *   *Reading 4 (Wisdom of Crowds):* The group knows more than the individual.
      *   *Reading 5 (Literal/Trivial):* Two people literally have more brain mass than one. (Too silly, skip).
      *   *Reading 6 (Deliberation):* Talking together improves outcomes (but they voted separately).

      *Refining for the specific logical conflict:*
      *   *Reading A (Epistemic Aggregation):* Majority rule tracks truth better than individuals (Condorcet).
      *   *Reading B (Procedural Legitimacy):* Voting confers authority, logic is secondary.
      *   *Reading C (Compensation):* Weaknesses in one voter are covered by strengths in another.
      *   *Reading D (Deliberative Synergy):* Interaction produces insight (contradicted by secret/separate voting).

  4.  **Drafting the Readings (incorporating presuppositions and verdicts):**

      *   *Reading 1: Condorcetian Epistemology.*
          *   Claim: If voters are competent (>50%) and independent, majority rule on a binary question is more likely to be correct than an individual.
          *   Presuppositions: Independence, competence > 0.5, single binary truth.
          *   Verdict: Substantive and defensible (mathematically), *but* doesn't apply to multiple connected propositions.
          *   Supports Use: No (doesn't solve the inconsistency).

      *   *Reading 2: Compensatory Competence.*
          *   Claim: Voters have different blind spots; aggregating covers gaps.
          *   Presuppositions: Heterogeneous errors, same goal.
          *   Verdict: Platitude/Substantive.
          *   Supports Use: No (doesn't explain why criteria yes + criteria yes != promotion).

      *   *Reading 3: Procedural Authority.*
          *   Claim: The outcome of a vote is valid simply because it is the outcome of a vote.
          *   Presuppositions: Democratic norm, voting overrides logic.
          *   Verdict: Contested (prioritizes procedure over rationality).
          *   Supports Use: Yes (dismisses the logical worry).

      *   *Reading 4: Deliberative Synergy.*
          *   Claim: Discussion leads to better decisions than solitary judgment.
          *   Presuppositions: Discussion actually happened.
          *   Verdict: False in this context (they voted separately).
          *   Supports Use: No.

  5.  **Selecting the Best Readings for the JSON:**
      I need a range from trivial/true to false/misleading.
      1.  *Condorcetian Aggregation* (The mathematical core).
      2.  *Compensatory Expertise* (The intuitive core).
      3.  *Procedural Legitimacy* (The political core - likely what was meant).
      4.  *Deliberative Synergy* (The literal core - false here).

  6.  **Analyzing "Supports Colleague's Use":**
      *   The colleague used it to dismiss the *inconsistency* between premise votes and conclusion votes.
      *   Condorcet says majority is likely *true*, but doesn't address logical coherence between multiple majorities. So, No.
      *   Procedural Legitimacy says "we voted, so it's done." So, Yes.
      *   Compensatory says "we covered bases," but doesn't fix the logic. So, No/Only under conditions.
      *   Deliberative says "we talked," but they didn't really. So, No.

  7.  **Identifying "What the Slogan Obscures":**
      *   It obscures the *Discursive Dilemma* (or Doctrinal Paradox).
      *   It hides the tension between premise-based and conclusion-based aggregation.
      *   It masks the possibility of collective irrationality.

  8.  **Constructing the JSON:**
      *   Ensure valid JSON syntax (quotes, commas, brackets).
      *   Check constraints: `verdict` options, `supports_colleagues_use` options.
      *   Ensure the tone is analytical and precise.

      *(Self-Correction during drafting)*: Make sure the "precise_claim" is distinct for each. Ensure the "presuppositions" explicitly mention independence and competence where relevant.
      *Reading 1 (Condorcet):* Focus on probability of truth on a *single* proposition.
      *Reading 2 (Compensation):* Focus on heterogeneous knowledge.
      *Reading 3 (Legitimacy):* Focus on authority rather than truth.
      *Reading 4 (Deliberation):* Focus on interaction (which didn't happen).

      *Most Likely Intended:* Reading 3 (Procedural Legitimacy). The colleague wanted to stop the discussion, not solve the logic.
      *What it Obscures:* The Discursive Dilemma / Collective Rationality.

  9.  **Final Review against Constraints:**
      *   JSON object? Yes.
      *   Fields correct? Yes.
      *   Readings array structure? Yes.
      *   Verdicts from specific list? Yes.
      *   Supports options from specific list? Yes.
      *   Comment length (2-3 sentences)? Yes.
      *   What the slogan obscures (short paragraph)? Yes.

  10. **Final Polish:** Check escaping of quotes within JSON strings. (Crucial for valid JSON).

      *Wait, one check on "supports_colleagues_use":* The colleague used it to justify *ignoring* the inconsistency.
      *   Condorcet: If the majority says "No Promotion," Condorcet says that's the "truth." But it doesn't explain why the premises were "Yes." It implies the conclusion vote trumps the premise votes. So "Only under further conditions" (if we prioritize conclusion over premises).
      *   Procedural: Yes, it justifies "we voted, it's done."
      *   Let's refine Reading 1 to be clear: It supports the *conclusion* vote as truth, but admits the inconsistency is a problem. So "No" or "Only under further conditions". Let's go with "Only under further conditions" (requires prioritizing conclusion vote).
      *   Actually, the prompt asks if it licenses "aggregating separate votes on logically connected propositions and reading the results off as a verdict." The colleague is saying the inconsistency doesn't matter.
      *   Reading 3 (Legitimacy) is the only one that truly says "Inconsistency doesn't matter."
      *   Reading 1 (Condorcet) implies one of the votes is wrong, not that the inconsistency is fine.
      *   Okay, I will stick with "No" for Condorcet because it highlights the error rather than dismissing it. "Yes" for Procedural.

      *Let's refine the "What the slogan obscures" paragraph.* It needs to name the phenomenon. "Discursive Dilemma" or "Doctrinal Paradox".

      *Let's refine the "Most Likely Intended Reading".* It's usually a conversation stopper. So Procedural Legitimacy.

      *Check JSON validity.* No trailing commas. Escape double quotes inside strings.

      *Let's write the content.*

      *Reading 1: Condorcetian Epistemology.*
