answer: |-
  Friends, family, colleagues, and guests.

  This room holds three distinct congregations. There are those who know the law from the inside, who have argued motions in courtrooms much like the one where our friend will soon sit. There are those who know the law from the outside, who know it only as something that touches their lives, sometimes gently, sometimes heavily, and who are here primarily because they love the person wearing the robe. And there are those who watch over the soul of this community, who remind us that human authority is always provisional.

  A speech for this occasion usually promises harmony. It promises that today, justice and power shake hands and walk forward together. But I have been thinking lately about whether that promise is true, or whether it is merely a necessary fiction we tell ourselves to sleep at night.

  Some of you will know that the seventeenth-century philosopher Blaise Pascal wrote extensively about this tension. He observed that justice without force is powerless, and force without justice is tyrannical. He argued that because we cannot make what is just into what is strong, we have made what is strong into what is just.

  I recently spent an evening arguing about this with a legal historian. His reading of Pascal was cold. He suggested that Pascal was telling us the quiet part out loud: that the authority of law rests not on justice, but on custom, on imagination, and ultimately on force. On this reading, the peaceful order we enjoy is not the peace of righteousness, but the peace of settled habit backed by the bailiff. The just person obeys the law not because it is just, but because it is the law, and would not be much disturbed if the law changed underneath them.

  It is a comforting thought for a cynic, and a terrifying one for a citizen. And I admit to you, I half-believe it.

  I half-believe it because I have seen what happens when the words on the page meet the world outside the courtroom. A judgment is only words until someone with a key and a warrant appears at the door. The sheriff's knock is where the whole thing either holds or does not. That knock is force. It is the brute coercion of the man with the keys. It is the institutional machinery of the courts. And it is the imaginative force of habit that makes us open the door rather than run from the window.

  If my historian friend is right, then this ceremony today is merely a ritual dressing of force in costume. We are putting a robe on power and calling it justice. If that is all this is, then we are not celebrating a moral achievement; we are celebrating a successful monopoly on violence.

  But I am standing here, and you are sitting there, and we are not celebrating a monopoly. We are celebrating a restraint.

  Here is where I must part ways with the cold realist, and where I ask the family in the room to listen closely, even if the name Pascal means nothing to you. The philosopher did not leave us in the dark. He acknowledged that force is necessary, but he did not say force is sufficient. He knew that human nature is flawed, that we are capable of great cruelty, and that without structure, our passions destroy us.

  The law is that structure. But the law is not a machine that runs itself. It requires a human being to stand between the force and the justice. It requires a judge who understands that the sheriff's knock is a terrible thing to unleash, and who will only authorize it when the words on the page truly merit the weight of the key.

  So, what are we celebrating today? We are not celebrating the idea that justice and force are naturally one. They are not. We are celebrating the willingness of this specific person to bear the burden of trying to make them coincide.

  To the family of the appointee: You know them as a friend, a parent, a partner. You know their capacity for kindness. You might worry that the law will harden them. It might. But the hope we hold today is that their kindness will soften the law. When they wield the force of the state, they will do so with the knowledge that force without justice is tyranny. They will feel the weight of the key.

  To my colleagues in the bar: We know the machinery. We know that sometimes the law is merely custom backed by power. We know the system fails. But we also know that the alternative is chaos. Our duty is not to pretend the tension doesn't exist. Our duty is to live within it. To argue fiercely, to rule carefully, and to acknowledge that when we call upon the force of the state, we are invoking something sacred and dangerous.

  And to the clergy here: You know that human justice is never divine justice. You know we are fallible. We do not claim perfection today. We claim only responsibility. We claim the humility to know that while we must use force to keep the peace, we must never mistake the peace of the bailiff for the peace of God.

  To our friend, the judge: You are entering the space between the words and the knock. You are the hinge on which Pascal's dilemma turns. You will have the force. The state gives you that. But the justice? That you must bring yourself.

  There will be days when the cynical reading feels like the only honest one. There will be days when the law feels like nothing but habit, and the courtroom feels like a theater of power. On those days, remember that the difference between a tyrant and a judge is not the badge, or the robe, or the warrant. The difference is the hesitation. The difference is the willingness to ask, before the key turns, whether the force is truly serving the justice.

  We are not here to say the problem is solved. We are here to say that you are willing to carry the problem. You are willing to stand in the gap where justice and force meet, and you are willing to risk your own reputation to ensure they align.

  That is not a pious slogan. It is a diagnosis of the work ahead. It is hard work. It is work that will sometimes keep you awake at night. But it is the only work that makes the sheriff's knock something other than a threat. It makes it a promise.

  So, let us invest you not with the illusion that you have solved the riddle of law, but with the trust that you will honor the tension. Wear the robe not as armor, but as a reminder that the force you wield belongs to all of us, and must be returned to us undiminished by your own ego.

  Welcome to the bench. The room is ready. The keys are waiting. The rest is up to you.
