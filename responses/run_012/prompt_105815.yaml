answer: |-
  As an AI, I do not hold beliefs or credences. However, I can synthesize the current dialectical landscape of metaethics to provide a probability assignment that reflects the weight of arguments, the sophistication of existing solutions, and the persistence of objections in the contemporary literature.

  **My Synthesized Credence:** **0.35**
  (There is a 35% probability that the Frege-Geach problem is fatal to expressivism in the sense that no account succeeds without collapsing into realism or abandoning compositionality.)

  This is slightly more optimistic than your 0.4. The shift reflects the transition from the "classic" expressivism of Ayer/Stevenson (which clearly failed F-G) to the "quasi-realist" and "ecumenical" projects of Blackburn, Gibbard, and Schroeder, which have developed robust technical machinery. However, the number remains significant because the "creeping minimalism" objection suggests that solving F-G might require conceding so much to realism that the view ceases to be distinctively expressivist.

  Here is the decomposition of that 0.35, the sensitivity analysis, and the distinction between settled and disputed terrain.

  ---

  ### Decomposition of the Credence

  I have weighted four key variables that determine whether the problem is fatal. The sum of the weighted risks yields the final credence.

  #### 1. The Semantic Constraint Artifact (Weight: 25%)
  *   **The Question:** Is F-G a genuine metaphysical problem, or merely an artifact of assuming that semantic content *must* be cashed out in truth conditions?
  *   **The Risk:** If truth-conditional semantics is the only game in town, expressivism loses (credence contribution: +0.25 to the fatalism score). If inferentialist or use-based semantics can do the heavy lifting, the problem dissolves.
  *   **Current State:** There is a strong move toward semantic minimalism and inferentialism (e.g., Chrisman, Price). If "meaning" is defined by inferential role rather than truth conditions, the demand for truth-apt content in embeddings vanishes.
  *   **Settled vs. Disputed:**
      *   *Settled:* Expressivists must explain why moral sentences behave syntactically like descriptive ones.
      *   *Disputed:* Whether explaining this behavior *requires* assigning them truth conditions (even minimal ones) or whether a non-representational semantics can sustain the syntax.

  #### 2. Viability of Higher-Order Attitude (HOA) Accounts (Weight: 35%)
  *   **The Question:** Can the specific technical solution offered by Mark Schroeder (*Being For*) and Allan Gibbard work? This involves analyzing "If lying is wrong..." as expressing a complex attitude toward combinations of attitudes (e.g., being *for* blaming for not blaming for lying).
  *   **The Risk:** If HOA accounts are psychologically implausible or logically incoherent, the leading technical fix fails (credence contribution: +0.35).
  *   **Current State:** Schroeder's account is the gold standard, but it faces the "Negation Problem" (Schroeder 2008, himself). Distinguishing the attitude expressed by "Lying is wrong" from "Lying is not wrong" within a HOA framework requires complex structural distinctions that some argue are ad hoc.
  *   **Settled vs. Disputed:**
      *   *Settled:* HOA is the most developed formal attempt to solve F-G.
      *   *Disputed:* Whether the complexity of the required mental states exceeds psychological plausibility, or whether the account successfully distinguishes distinct moral disagreements without smuggling in truth conditions.

  #### 3. Generalizability Beyond Toy Examples (Weight: 20%)
  *   **The Question:** Does the solution hold for *every* embedding, including epistemic modals ("It might be wrong"), probability operators ("It is 50% likely wrong"), and attitude reports ("John believes lying is wrong")?
  *   **The Risk:** Many solutions work for conditionals and negation but fracture under epistemic modals (credence contribution: +0.20).
  *   **Current State:** This is a major pressure point. Ecumenical expressivists (like Ridge) try to hybridize the view to handle this, but hybrid views face their own compositionality problems (the "problem of many attitudes"). Pure expressivists struggle to explain what it means to be uncertain about a moral claim without referencing truth.
  *   **Settled vs. Disputed:**
      *   *Settled:* Moral language embeds under modals and attitude verbs.
      *   *Disputed:* Whether an expressivist can model moral uncertainty without implicitly treating moral claims as propositions with probabilities attached.

  #### 4. Logic on Non-Representational Content (Weight: 20%)
  *   **The Question:** Can logical validity (specifically validity defined by preservation of truth) run on content that is not truth-apt?
  *   **The Risk:** If logic is essentially truth-preserving, and expressivism denies moral sentences have truth conditions, expressivism cannot account for validity (credence contribution: +0.20).
  *   **Current State:** Quasi-realists argue we can earn the right to talk of "truth" and "validity" in a deflationary sense. Critics argue this is verbal sleight of hand. If the "truth" predicate is robust enough to sustain logic, the view looks realist; if it's too thin, it doesn't sustain logic.
  *   **Settled vs. Disputed:**
      *   *Settled:* Moral arguments (e.g., Modus Ponens) are valid.
      *   *Disputed:* Whether "validity" in moral contexts is the *same* property as validity in descriptive contexts, or merely a functional analogue.

  ---

  ### Sensitivity Analysis

  **Most Sensitive Term:** **Viability of Higher-Order Attitude (HOA) Accounts (35%)**.

  This is the pivot point. The other factors are largely theoretical or metaphysical, but HOA is the *mechanism* by which expressivism attempts to solve the problem.
  *   **If HOA fails:** The credence that F-G sinks expressivism jumps from **0.35 to roughly 0.65**. Without HOA, expressivists lack a compositional semantics for conditionals that doesn't rely on propositions.
  *   **If HOA succeeds:** The credence drops to **0.15**. If Schroeder's machinery works, the remaining objections are mostly about "creeping minimalism" (i.e., "you solved the problem but aren't an expressivist anymore"), which is a taxonomic dispute rather than a functional one.

  **Second Most Sensitive:** **Logic on Non-Representational Content (20%)**.
  If it is demonstrated that deflationary truth cannot sustain a logic of consistency (e.g., if inconsistency of attitudes cannot map onto logical inconsistency), the project collapses regardless of HOA success.

  ---

  ### What Would Move the Number?

  To move my synthesized credence significantly (by >0.1), the following evidence or arguments would be required:

  1.  **Formal Proof of Incoherence (Moves toward 1.0):** A rigorous formal demonstration that HOA structures necessarily generate contradictions when handling nested conditionals or mixed discourse (e.g., "If lying is wrong, then if stealing is wrong, getting your sister to lie is wrong"). Currently, objections are intuitive or complexity-based; a formal proof of impossibility would be decisive.
  2.  **Psychological Plausibility Data (Moves toward 0.1):** Empirical evidence from cognitive science suggesting that human agents actually process moral conditionals via higher-order attitude structures. Currently, HOA is criticized for positing mental states too complex for ordinary speakers. Evidence that this is how the mind works would neutralize the "implausibility" objection.
  3.  **A Working Inferentialist Semantics (Moves toward 0.1):** A fully worked-out semantic framework that handles embedding without referencing attitudes *or* truth conditions, relying solely on inference rules. This would bypass the HOA bottleneck entirely.
  4.  **Consensus on "Creeping Minimalism" (Moves toward 1.0):** If the metaethical community reaches a consensus that successful quasi-realism is extensionally equivalent to realism, the "expressivist" label becomes empty. If solving F-G *requires* accepting truth-apt content, then expressivism (as a denial of truth-apt content) is dead, even if the language works.

  ---

  ### Settled Questions vs. Genuine Disagreement

  To ensure I am not presenting one camp's line as consensus, here is the map of the dialectic:

  **Settled (Broad Consensus):**
  *   **The Data:** Moral sentences embed in conditionals, negations, and questions.
  *   **The Constraint:** Any metaethical theory must explain the validity of arguments like: *P1: Lying is wrong. P2: If lying is wrong, getting your sister to lie is wrong. C: Getting your sister to lie is wrong.*
  *   **The Failure of Early Expressivism:** The simple "Boo/Hurrah" emotivism of the mid-20th century cannot solve this.

  **Genuine Disagreement (Live Options):**
  *   **The Source of Validity:** Realists argue validity rests on propositional content. Expressivists argue it rests on consistency of attitudes. There is no consensus on whether "consistency of attitudes" is a sufficient analogue for "logical validity."
  *   **The Nature of "Truth":** Disagreement persists over whether expressivists can use a deflationary truth predicate without conceding the core tenet of cognitivism. Realists say "If it quacks like a truth, it's a truth"; Expressivists say "We earn the right to use the word without the metaphysics."
  *   **Psychological Commitments:** There is no agreement on whether a semantic theory is obligated to map onto distinct, identifiable psychological states (as HOA requires) or whether semantic content can outstrip explicit psychological processing.

  **Summary:** The 0.35 credence reflects the view that while the Frege-Geach problem is the strongest objection to expressivism, the "quasi-realist" toolkit has not yet been exhausted. The problem is fatal only if one insists that logic *must* be truth-conditional in a robust sense, or if the HOA machinery is proven formally incoherent. Until then, expressivism remains a live, albeit technically demanding, option.
