  "Relax," I told the exterminator. "Omega sends this letter iff termites XOR payment. I'm a non-payer. Once I condition on my policy, the letter's evidential link to your services is screened off. It's spurious correlation."

  The load-bearing wall dissolved into sawdust.

  "Spurious?" he asked, brushing dust from his clipboard.

  "Causally independent," I insisted.

  "No," he said. "Since you don't pay, the letter means termites are guaranteed. You didn't screen off the correlation; you screened *for* the infestation."

  The joke turns on how conditioning on a fixed policy in XOR blackmail makes the letter decisive evidence rather than irrelevant noise.
