  # WORKSHOP PREPARATION SHEET: FORTUNE AND VIRTÙ
  **Context:** 30-minute Q&A. Political Theory Workshop.
  **Thesis:** *Fortuna* = contingency via other wills; *Virtù* = relational asymmetry (converting dependence).

  ## I. STRATEGIC OPENING REMARKS
  *Do not wait for the questions to address the three most dangerous lines of attack. Build these concessions into your concluding summary before the Q&A opens.*

  1.  **Pre-empt the Cambridge Anachronism Charge:** Explicitly acknowledge that "dependence" is not a vernacular humanist keyword. State that you are not arguing Machiavelli uses the *word* "dependence," but that the *structure* of the problems he solves (mercenaries, allies, the people) is structural dependence. You are proposing a structural reading of a vocabulary of excellence.
  2.  **Pre-empt the Neo-Roman Normative Charge:** Acknowledge that on your reading, princely *virtù* is incompatible with republican liberty *in the moment of acquisition*. Clarify that your claim is descriptive of the text's mechanics, not a normative endorsement of servitude. You are analyzing the logic of the Prince, not prescribing it for the Republic.
  3.  **Pre-empt the Straussian Sanitization Charge:** Concede that your reading is rationalistic. State clearly that you are not denying the role of terror or religion, but arguing that even terror and religion are tools for managing the wills of others (the "flood" of agents). You are not removing the darkness, but locating its mechanism.

  ## II. THE CRUCIAL REPLY
  **The Cambridge Vocabulary Objection (Objection #1).**
  If you cannot convince the Cambridge scholars that your relational reading is compatible with the humanist semantic field, the paper will be dismissed as presentist sociology. You must land the point that Machiavelli *stretches* humanist vocabulary to describe new political realities. If this fails, the text is no longer Machiavelli's, but yours.

  ## III. THE FORBIDDEN QUESTION
  **"If *virtù* is the art of securing asymmetry against other wills, how do you account for Machiavelli's own career?"**
  *Why it is dangerous:* Machiavelli possessed the knowledge you describe but lost his position, was tortured, and died without restoring the Republic or gaining a Prince's ear. If *virtù* guarantees security or success, he should have succeeded. If it doesn't, your definition collapses into "whatever works," which is tautological.
  *Strategy:* If asked, do not defend the theory with his biography. Admit the tragedy. Argue that *virtù* manages probability, not certainty, and that his specific *fortuna* (the return of the Medici) was a convergence of wills no single actor could redirect. Do not claim his theory is a guarantee of success.

  ## IV. OBJECTIONS AND REPLIES
  *Ordered by Product of Likelihood × Damage. The first two marked below are the most probable openers.*

  ### 1. The Cambridge Semantic Objection (Likelihood: High | Damage: High) **[EXPECTED FIRST]**
  **The Objection:** "You are smuggling a modern sociological concept of 'dependence' into a Renaissance text. In the humanist vocabulary Machiavelli inherits, *virtù* signifies moral and civic excellence, capacity, and prowess. By reducing it to a bargaining position or a relational asymmetry, you strip the term of its ethical weight. Where in the text does Machiavelli suggest *virtù* is merely about making others need you, rather than about the intrinsic worth of the actor?"

  **The Reply:** "I agree that *virtù* carries the weight of excellence in the humanist tradition. My claim is not that Machiavelli discards that weight, but that he repurposes it to solve a specific problem: the instability of Italian states. When Machiavelli contrasts *virtù* with *fortuna*, he isn't contrasting goodness with luck; he is contrasting stability with volatility. If we look at the examples—Cesare Borgia, Agathocles—the 'excellence' displayed is often morally ambiguous but structurally effective. I am arguing that the *function* of the term in the argument is relational. It is not that intrinsic worth doesn't matter, but that intrinsic worth only becomes political *virtù* when it successfully reorders the wills of others. Without that relational success, it is just private talent."
  * **Soft Spot:** You are conceding that the ethical weight exists but sidelining it as secondary to the structural function. A hardline contextualist will press that you cannot separate the two.

  ### 2. The Metaphorical Literalism Objection (Likelihood: High | Damage: High) **[EXPECTED SECOND]**
  **The Objection:** "You say *fortuna* is a name for other people's wills. But Machiavelli explicitly describes *fortuna* as a woman to be beaten, a river to be dyked, and a storm that destroys. These are non-human, natural, or providential images. By reducing *fortuna* to a crowd of agents, you ignore the text's own insistence on the non-rational, overwhelming, and sometimes divine character of luck. Why should we accept your reduction when the metaphors point elsewhere?"

  **The Reply:** "The metaphors are vivid, but we should ask what the metaphors *do*. When Machiavelli calls *fortuna* a river, he immediately discusses how men build dykes and dams in calm weather to resist the flood. Who builds the dykes? Men. Who breaks them? Often men, or the neglect of men. The 'storm' is not weather; it is the invasion of a foreign army or the defection of a captain. The personification of *fortuna* as a woman is about the mode of engagement—impetuosity versus caution—not about a literal goddess. I am arguing that the metaphors describe the *experience* of facing unconstrained wills, which feels like facing nature, but the *mechanism* is human agency."
  * **Soft Spot:** You cannot fully explain away the providential language. You are conceding that the *experience* is non-rational, which leaves room for them to argue the *cause* is too.

  ### 3. The Neo-Roman Liberty Objection (Likelihood: Med | Damage: High)
  **The Objection:** "We read Machiavelli as a theorist of freedom as non-domination. On your account, princely *virtù* is the technique of dominating others—making them need you or fear you. This makes *virtù* the engine of servitude. Are you arguing that Machiavelli celebrates the extinction of liberty, or is your concept of 'dependence' just power with a philosophical accent that ignores the civic context of the *Discourses*?"

  **The Reply:** "I distinguish between the *virtù* of the Prince and the liberty of the Republic. In *The Prince*, *virtù* is indeed about securing the state against the volatility of others, which often requires dominating them. But in the *Discourses*, the *virtù* of the people is what secures liberty. My argument is that the relational mechanics are the same—managing wills—but the end differs. The Prince seeks asymmetry to survive; the Republic seeks a balance of asymmetries (orders and laws) to endure. I am not celebrating servitude; I am identifying the dangerous tool that the Prince uses, which the Republic must tame."
  * **Soft Spot:** This risks splitting Machiavelli into two incompatible thinkers. If the mechanism is the same, why does it yield liberty in one case and tyranny in the other? You need to hold the line that laws institutionalize the asymmetry rather than personify it.

  ### 4. The Plebeian Scope Objection (Likelihood: Med | Damage: Med)
  **The Objection:** "Your reading is prince-shaped. It works for a single actor managing elites. But Machiavelli praises the *virtù* of the Roman people collectively. A crowd cannot hold a 'relational position' or calculate asymmetry in the way a Prince does. Does your reading collapse when the agent is a multitude?"

  **The Reply:** "The multitude does not calculate like a Prince, but it acts relationally. When the people withdraw favor, or when they demand tribunes, they are altering the dependence structure. They make the nobles need them. The *virtù* of the people is their capacity to act as a collective will that cannot be ignored. It is less about cunning and more about the sheer weight of their unconstrained will, which the Prince must respect. The mechanism of wills clashing remains the same, even if the cognitive process differs."
  * **Soft Spot:** "Collective will" is a fraught concept. If you lean too hard on the people acting as a single agent, you contradict the idea that *fortuna* is the clash of *many* wills.

  ### 5. The Straussian Founding Objection (Likelihood: Low | Damage: High)
  **The Objection:** "You have domesticated an impious teaching. By turning *virtù* into a bargaining position, you make Machiavelli respectable. You leave out the founding violence, the necessary cruelty, and the use of religion as a tool of terror. *Virtù* is not about making others owe you; it is about being willing to stand alone against the moral order to found a new one."

  **The Reply:** "I do not deny the violence. My point is that the violence is not an end in itself, nor is it mystical. It is instrumental to securing the political order against the wills of those who would destroy it. When a Founder kills the sons of Brutus, he is not just being cruel; he is signaling to the remaining elites that their wills are now constrained by the law. The terror is a method of converting dependence. I am not making him respectable; I am making him precise."
  * **Soft Spot:** Straussians believe the "mystery" is the point. By making it precise, you may confirm their suspicion that you miss the esoteric layer.

  ### 6. The Deflationary Graduate Objection (Likelihood: High | Damage: Low)
  **The Objection:** "Isn't this just saying that politics is hard and involves other people? If *fortuna* is just other wills and *virtù* is managing them, haven't you just re-described realpolitik in fancy language without adding explanatory power?"

  **The Reply:** "Standard realpolitik treats obstacles as static or environmental. My reading treats them as agential. That changes the prescription. If the obstacle is a river, you build a dam. If the obstacle is a rival with his own interests, you must change his interests or remove him. The distinction matters because it explains why Machiavelli focuses so heavily on incentives, fear, and obligation rather than just resource accumulation. It's not just that politics is hard; it's that the difficulty is specifically interpersonal."
  * **Soft Spot:** This is a thin distinction. Be prepared for a follow-up asking for a concrete example where the advice differs.

  ### 7. The Humanist Context Objection (Likelihood: Med | Damage: Med)
  **The Objection:** "Machiavelli is writing within the genre of mirrors for princes. These texts traditionally emphasize moral virtue as the basis of stability. By ignoring this lineage, you treat Machiavelli as if he were writing in a vacuum. How do you square your reading with the fact that he is participating in a conversation about moral worth?"

  **The Reply:** "He is participating in the conversation to subvert it. He uses the genre's expectations to deliver a different message. He acknowledges the traditional view—that a Prince should be loved and virtuous—only to show why that leads to ruin. He is using the vocabulary of the mirrors to show why the vocabulary is insufficient for the reality of Italy. My reading explains why the text feels so shocking to its contemporaries: it keeps the words but changes the referents."
  * **Soft Spot:** This assumes subversion rather than adaptation. Some historians argue he genuinely believed he was improving the humanist tradition, not undermining it.

  ### 8. The Straussian Impiety Objection (Likelihood: Low | Damage: Med)
  **The Objection:** "You make Machiavelli too rationalistic. *Fortuna* retains a residual sense of the divine or the unknowable. By reducing it to human wills, you remove the tragic dimension of his thought. Man cannot control everything, and Machiavelli knows this."

  **The Reply:** "I agree man cannot control everything. But the portion he *can* control is the human portion. Machiavelli's injunction is to focus *virtù* there. To attribute failures to divine *fortuna* is, for Machiavelli, often an excuse for human negligence. I am not removing the tragic dimension; I am locating it in the limits of human agency against other human agencies, which is where the tragedy actually plays out."
  * **Soft Spot:** You risk sounding like you deny any role for chance events (plagues, weather) which Machiavelli does acknowledge.

  ### 9. The Neo-Roman Reciprocity Objection (Likelihood: Low | Damage: Med)
  **The Objection:** "If *virtù* is creating asymmetry, what happens to reciprocity? Machiavelli talks about benefits conferred and obligations incurred. Your model sounds purely extractive. How do you account for the mutual obligations that sustain a state?"

  **The Reply:** "Reciprocity is a stable form of asymmetry. When I say 'make them owe you,' that is an obligation. The relationship is asymmetric because the Prince holds the power to enforce or forgive the debt, but it is still a bond. Mutual obligation is simply a network of crossed dependencies. My reading explains why Machiavelli warns against being hated: hatred breaks the bond of obligation, leaving only force, which is too costly to maintain."
  * **Soft Spot:** "Stable asymmetry" is an oxymoron to a republican. Be careful not to imply that reciprocity is a sham.

  ### 10. The Textual Evidence Objection (Likelihood: Med | Damage: Low)
  **The Objection:** "You rely on the 'company the terms keep.' But where does Machiavelli explicitly define *fortuna* as other wills? You are inferring this from examples. Isn't this an argument from silence?"

  **The Reply:** "It is an argument from the pattern of the examples. He never advises a Prince to pray against *fortuna* or to build walls against the rain. He advises him to arm his own people, to avoid mercenaries, and to secure the populace. Every remedy for *fortuna* is a political intervention in human relationships. If *fortuna* were truly metaphysical luck, the remedies would be different. The remedies reveal the definition."
  * **Soft Spot:** Arguments from silence are always vulnerable. A single counter-example of him blaming "the times" abstractly could sting.

  ## V. FINAL REMINDER
  **Tone:** Do not become defensive. The Cambridge school respects a scholar who admits the complexity of the vocabulary. The Straussians respect a scholar who acknowledges the darkness. The Neo-Romans respect a scholar who distinguishes description from prescription.
  **Pace:** You have 30 minutes. If the first two questions (Cambridge) take 10 minutes, do not rush the replies to the Straussians. It is better to answer 5 questions thoroughly than 10 hastily.
  **Goal:** You do not need to convert the room. You need to show that your reading is *textually viable* and *theoretically productive*. If they leave thinking, "I disagree, but I see why he reads it that way," you have succeeded.
