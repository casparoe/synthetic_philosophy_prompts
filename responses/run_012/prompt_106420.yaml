          *   Let's use the prompt's suggestion: "slightly altered rule set."
          *   System B: Start MII. Rules same. 2 I's. Can we get to 0 mod 3?
              *   Double: 2 -> 4 -> 8... (2^k * 2). Never div by 3.
              *   So MII -> MU is also impossible.
          *   System C: Start MI. Add Rule 5: "Append I".
              *   1 -> 2. Now we can hit 3.
          *   Let's go with **System B: The MIIU System**. Start with **MII**.
              *   Wait, if start is MII (2 I's), doubling keeps it $2 \times 2^k$. $3 \nmid 2 \times 2^k$. So still impossible.
