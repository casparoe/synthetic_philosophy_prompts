      *   This legitimizes the meta-move as a winning strategy.

      *(Refining the "System B")*:
      *   To show the invariant is specific to the system, System B needs to allow reaching MU.
      *   If I add "Add I" rule, it works.
      *   Let's call it the **MIE System** (M, I, E for 'Expand').
      *   Rule 5: Insert 'I' anywhere.
      *   This allows $1 \to 2 \to 3 \to 0 \pmod 3$.

      *(Refining the Limitations)*:
      *   The prompt asks to be candid about what the activity *can't* reproduce.
