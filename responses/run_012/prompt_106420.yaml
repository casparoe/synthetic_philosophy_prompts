          *   *Modification:* Team Beta gets a *slightly modified* system (e.g., MIIU is the start, or a rule change) where MU *is* reachable.
          *   *Wait, the prompt asks for:* "fold in a second, slightly altered rule set under which the analogous target is actually reachable."
          *   *Okay, let's integrate that.*
          *   **Structure:**
              1.  Phase 1: All teams try MIU. Frustration builds.
              2.  Phase 2: Introduce "Meta-Tokens." Teams can spend effort to analyze patterns instead of generating strings.
              3.  Phase 3: Reveal System B (where it works) to contrast.
      *   *Critique:* This feels a bit disjointed. Let's try to make the roles inherent to the activity flow.

      *   **Proposed Structure:** "The Factory and The Inspectors."
          *   Divide class into 3 "Factories" (6 students each).
          *   Inside each Factory, split into 4 "Workers" (generating strings) and 2 "Inspectors" (logging data).
          *   *Crucial Constraint:* Workers are *forbidden* from talking about numbers/counts. They can only talk about symbol manipulation. Inspectors *must* record data but aren't told what data matters.
          *   *Scoring:* Points for generating valid strings. Bonus points for "Predictions" (declaring MU impossible/possible).
          *   *The Hook:* The Inspectors will notice the 'I' count pattern. The Workers will spin their wheels. The Inspectors need to be empowered to stop the line.

  3.  **Drafting the Plan (Iterative Process):**

      *   *Timeline:* 90 mins.
          *   0-10: Setup & Rules.
          *   10-40: Production Phase 1 (MIU System).
          *   40-50: The "Stop Work" Order / Data Review.
          *   50-70: Production Phase 2 (Modified System MIIU).
          *   70-90: Debrief.

      *   *Roles:*
          *   **Operators:** Manipulate strings. Strictly syntactic.
          *   **Accountants:** Track counts of I's and U's. No manipulating strings.
          *   **Management:** Decides when to stop/submit.

      *   *Scoring:*
          *   +1 for every unique valid string generated.
          *   -5 for every attempt to claim "MU is reachable" (if false).
          *   +50 for a correct proof of unreachability.
          *   *Problem:* Students won't know they can claim unreachability.
          *   *Fix:* Introduce a "Black Box" option. They can submit a "System Verdict."

      *   *Refining the "Discovery":*
          *   Don't tell Accountants to count I's. Just tell them "Record statistics that might be relevant."
          *   Operators will get frustrated. Accountants will get bored unless they find a pattern.
          *   Need to ensure the Accountants have the tools to notice the mod 3 invariant. Provide a worksheet with columns for "String," "# of I's," "# of U's," "Length."

      *   *The Second System:*
          *   Start with MII. (2 I's). 2 is not div by 3. Still won't work.
          *   Start with MIII. (3 I's). Rule: III -> U. So MIII -> MU. Too easy.
