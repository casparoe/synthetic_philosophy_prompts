answer: |-
  The monitor beeped, a steady green line climbing and falling. Mrs. H slept, or pretended to. Her breathing was shallow, the kind that costs too much effort. I stood by the IV pole, watching the drip chamber. One drop. Pause. Another drop.

  David came in with the chart. He was a good nurse, better than me. He believed in the numbers.

  "Pain level still high?" he asked, not looking up from the clipboard.

  "Seven," I said. "She woke up an hour ago."

  David checked the pump settings. "Flow rate is correct. Morphine concentration is standard. Maybe we need to adjust for tolerance. Body builds up a resistance, Arthur. It's chemistry."

  He tapped the tubing. "Fluid moves, drug enters blood, receptors bind. Cause and effect. If it's not working, we increase the cause."

  He adjusted the dial. The machine whirred. He waited. The green line on the monitor stayed jagged. Mrs. H stirred, a small sound catching in her throat.

  "It's not the dose," I said.

  David sighed. He wasn't angry, just tired. "It's always the dose. Or the line is kinked. Check the catheter."

  I checked. The tape was secure. The skin was clean. The tube was straight. I watched the drip chamber again. The fluid hung there, a clear bead trembling at the tip. It didn't fall.

  "See?" David said. "Air lock. I'll flush it."

  He unclamped the port, pushed the syringe. The plunger moved, but the fluid in the tube didn't. It looked like the water had forgotten how to be pushed. David frowned. He pulled the syringe back. Fluid came out.

  "Strange," he said. "Maybe the pump motor is slipping. I'll swap the unit."

  He left to get a new machine. He believed the motor made the fluid move. He believed the fluid made the pain stop. He was smart. He had degrees. He wasn't wrong about what usually happened.

  I stayed in the room. The silence was heavy. I looked at my hand resting on the bedrail. I lifted it. I let it go. It fell back to the metal with a clatter.

  I went to the break room. I needed to know if it was just here, or everywhere. I needed to know if I could make something happen.

  I took a sugar packet from the jar. I held it over the table. I let go.

  It fell. It hit the laminate and slid.

  I poured coffee from the pot into a mug. The stream was dark and steady. It filled the cup. It didn't float. It didn't turn to sand.

  I took a lighter from my pocket. I flicked the wheel. The spark caught. The flame was blue at the base, orange at the top. I held my finger near it. I felt the heat.

  I stood there for ten minutes. I dropped pens. I turned the lights on and off. I ran the tap. Everything obeyed. The world looked exactly like David said it was. A chain of causes. A machine of forces.

  But I knew what I had seen in the tube. The fluid hadn't been blocked. It had just… paused. Like a sentence waiting for the next word.

  If the fire didn't make the heat, if the gravity didn't make the pen fall, then none of this was mine. I wasn't pushing the world. I was just standing next to it while it happened.

  I went back to the room. David had changed the pump. The new machine hummed. The drip chamber ticked. One drop. Another.

  Mrs. H opened her eyes. They were cloudy.

  "Arthur?"

  "I'm here."

  "Is it… is it going to hurt?"

  I looked at the IV. The fluid was moving. The chemistry was right. The dose was high enough. By all laws, the relief should come. But laws were just memories of what happened yesterday.

  "I don't know," I said.

  She closed her eyes. Her hand lay on the sheet, palm up. I took it. Her skin was cool. I squeezed. I waited for the pressure to reach her, for her nerves to fire, for her to squeeze back.

  She didn't squeeze. But she didn't pull away.

  David came back in an hour. He checked the monitor. The jagged line had smoothed out. Her breathing was deeper.

  "See?" David said softly. "Takes time for the binding. It works."

  He wrote on the chart. He trusted the future because the past had been consistent. He walked out to check on another patient, his shoes squeaking on the linoleum.

  I sat in the chair. I watched the clock on the wall. The second hand swept around the face. Tick. Tick. Tick.

  It was quiet. Mrs. H was sleeping. The IV dripped. The world looked solid. It looked like a place where things happened because they had to.

  I kept my hand on hers. I didn't trust the warmth. I didn't trust the next breath. I just waited, counting the seconds like they were loans I hadn't earned yet.
