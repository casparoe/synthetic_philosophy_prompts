      *   *Okay, I need to argue it is VOID.*
      *   *Principle:* **The Principle of Procedural Integrity.** In any self-amending system, the validity of an amendment is determined solely by the rules in force *prior* to the amendment. A proposed amendment cannot impose procedural conditions on its own adoption that differ from the standing rules, because to do so would allow a temporary majority (or minority) to alter the fundamental rules of decision-making without clear authorization from the standing rules. Since Art I does not authorize amendments to set their own adoption thresholds, Amendment 7's proviso is a nullity.
      *   *But if the proviso is a nullity, why doesn't the rest pass?* Because the proviso is a *condition of validity* expressed within the text. It functions as a "poison pill." If the system ignores the pill, it enacts a law that claims it shouldn't exist. To avoid a legal system asserting a contradiction (Enacted Law: "I required unanimity" vs. Historical Fact: "2/3 voted"), the enactment must be voided. The law cannot lie about its own genesis.
      *   *Wait, laws lie about genesis all the time (fictions).*
      *   *Let's try the "Authority" angle.* The authority to change the rule comes from Art I. Art I says 2/3. The movers tried to use Art I authority but attached a condition that Art I doesn't allow. This makes the motion *ultra vires*. An *ultra vires* act is void.
      *   *Addressing the Objection:* The objection says "If void, the proviso is gone, so 2/3 applies." This is the "Severability" fallacy. The proviso defines the *identity* of the proposal. A proposal to "Adopt Rule X, but only if Unanimous" is a different proposal than "Adopt Rule X." The members voted on the former. The Chair declared the latter carried. The Chair exceeded their authority by declaring a different motion carried than the one moved.
      *   *Article III:* Settles the *numbers* (68-32). It does *not* settle whether those numbers constitute a valid vote under the Charter. It doesn't settle questions of law/validity, only questions of fact (count).
      *   *Raising vs. Lowering the Bar:* A motion cannot raise the bar for itself because the bar is set by the standing rules. It can lower the bar only if the standing rules allow it (they don't). Actually, usually, a motion cannot change the voting threshold for itself because that threshold is a jurisdictional limit on the assembly's power.
      *   *June Sitting:* How to fix? Move an amendment that *only* changes Art I to "Unanimous," without the self-referential proviso. Pass it by 2/3. Then, in the future, Unanimity is required.

  4.  **Drafting the Argument - Section by Section:**

      *   **Introduction:** State the verdict (Void). State the General Principle (The Principle of Anterior Authority).
      *   **The Principle:** The validity of a rule-change is determined exclusively by the rules in force *before* the change. A proposal cannot alter the procedural conditions of its own enactment unless the prior rules explicitly grant that power.
      *   **Application:** Art I grants power to amend by 2/3. It does not grant power to amendments to set their own thresholds. Amendment 7 attempts to do this. Thus, it is procedurally defective.
      *   **Addressing the Objection (The Paradox):** The objection argues that if the proviso is void, the 2/3 rule applies, so it passed.
          *   *Counter:* This treats the proviso as separable. It is not. The motion was a conditional offer. "I offer Rule X, contingent on Condition Y." The Assembly cannot accept Rule X while rejecting Condition Y, because the offeror (the mover) defined the offer as a package. To accept the text but ignore the condition is to enact a rule the mover did not move and the assembly did not vote on. It substitutes a new motion.
          *   *Also:* Enacting a rule that states "I required unanimity" when the record shows 2/3 creates a performative contradiction that undermines the rule of law.
      *   **Article III:** It settles the *fact* of the vote count (68-32). It does *not* settle the *legal consequence* of that count (whether it met the threshold). It protects the Chair from being challenged on the math, not on the interpretation of the Charter.
      *   **Raising vs. Lowering:** A motion cannot raise the bar for itself because the bar is a limit on the Assembly's jurisdiction, not a term of the contract. It cannot lower it either, for the same reason. The threshold is a structural constraint, not a negotiable term.
      *   **June Sitting:** Move a clean amendment: "Article I is replaced by... Unanimous vote." Vote on *that*. If 2/3 pass it, it becomes law. Then future amendments need unanimity. This shows the charter is amendable.

  5.  **Refining the Logic (Self-Correction/Polishing):**
      *   *Critique:* Is the "Package Deal" argument strong enough? In parliamentary procedure, amendments to the amendment are possible. But this proviso was *in* the text of the motion.
      *   *Stronger Logic:* The "Self-Referential Paradox" must be resolved by prioritizing the *source* of authority. The source is the April Charter. The April Charter does not recognize "self-entrenching provisos." Therefore, the proviso is legally meaningless *surplusage*.
      *   *Wait, if it's surplusage, it passes.* I must argue it's *fatal surplusage*. Why? Because the proviso acts as a *limitation on the motion's authority*. It's a motion that says "I have no effect unless X." If X doesn't happen, the motion has no effect. The Chair cannot declare a motion "carried" if the motion itself defines "carried" differently than the Chair.
      *   *Wait, the Chair decides if it's carried based on the Charter.* The Charter says 2/3. The Motion says Unanimous.
      *   *Resolution:* The Motion attempts to contract out of the Charter's procedural requirements. A private motion cannot override the public Charter. Therefore, the Motion is invalid *ab initio* because it purports to operate outside the framework of Art I. It is not a valid "Amendment" under Art I because Art I defines an Amendment as something passed by 2/3. A thing that requires Unanimity is not an "Amendment" as defined by Art I. It is a different kind of legal act for which no procedure exists. Therefore, it is void.
      *   *Yes, this is the key.* Art I defines the *only* mechanism for amendment. Amendment 7 attempts to use a mechanism (Unanimity condition) that Art I does not provide. Therefore, it is not a valid motion under the Charter.

