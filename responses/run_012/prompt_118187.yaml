  *Key nuance:* The objection says "If the amendment is void, the proviso is void, so we revert to Art I (2/3), so it passed." I need to explain why the *whole motion* is void, not just the proviso. The motion is a single legal act. If the act attempts to invoke a non-existent procedural power (self-conditioning), the act fails.

  *Let's refine the "Objection" rebuttal.* The objection relies on *severability*. I must argue *non-severability*. The condition is not a separate clause; it is a definition of the motion's legal effect. A motion that declares "I am ineffective unless X" cannot be declared "Effective" by a Chair when X is false, even if the Charter says "Motions are effective if Y." The Charter governs valid motions. This is not a valid motion because it contradicts the nature of a motion under the Charter (which is to be decided by the Charter's rules, not its own).

