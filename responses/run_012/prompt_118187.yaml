      *   You cannot use the *content* of a proposed rule to validate the *process* of its own adoption unless the *current* rules allow that content to dictate the process.
      *   *Key Insight:* An amendment is a proposal to change the law. Until it is validly adopted, it is not law. Therefore, its internal conditions (like "I need unanimity") are merely text in a proposal, not binding procedural constraints *unless* the current law says proposals can set their own procedural thresholds.
      *   *Current Law (Art I):* Says amendments need 2/3. It does *not* say "Amendments can set their own voting thresholds."
      *   *Therefore:* The threshold is fixed by the *existing* Art I. The text of Amendment 7 attempting to impose a higher threshold on itself is surplusage (ineffective) regarding the *vote count*, though it defines the *substance* of the new rule.
