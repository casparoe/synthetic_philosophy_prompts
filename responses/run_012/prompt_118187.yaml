      *   *Correction:* I need to argue that the amendment is *void* because it attempts to alter the *conditions of its own validity* in a way incompatible with the source of its authority.
      *   *Better Principle:* **The Principle of Derivative Authority.** A subordinate rule (the amendment motion) cannot alter the conditions of its own creation established by the superior rule (the Charter) *retroactively* or *conditionally* in a way that creates a logical contradiction regarding the moment of enactment.
      *   *Actually, the strongest argument for "Void" is the "Manner and Form" constraint.* The existing rule sets the manner and form. A proposal cannot change the manner and form *for itself* unless the existing rule allows proposals to change the manner and form.
      *   *Refining the Argument:* The amendment consists of two parts: (1) The new text for Art I, and (2) The proviso regarding its own adoption. Part (1) is a standard amendment. Part (2) is a procedural condition attached to the motion. The Charter (Art I) specifies the condition for amendment (2/3). It does not authorize the *motion itself* to add further conditions to the voting requirement. Therefore, the proviso is ultra vires (beyond the power of the motion).
      *   *But if the proviso is ultra vires, do we sever it?* If we sever it, the amendment passes with 2/3. Then Art I becomes "Unanimous." This is the outcome I want to avoid (I need to argue it's *void*).
      *   *Why would it be void entirely?* Because the proviso is integral to the intent of the amendment. It's a "package deal." "I will only become law if everyone agrees." If the legal system says "No, you become law if 2/3 agree," then the amendment is not the amendment that was offered. It's a different amendment. The movers offered "Unanimity Rule + Unanimity Condition." The Chair declared "Unanimity Rule" passed. That is not what was voted on.
