answer: |-
  You have put your finger on a fracture line that runs through the contemporary philosophy of emotion, one that most theorists paper over because it complicates their taxonomy. You are describing the gap between an emotion's **fittingness** (does the object merit this response?) and its **basing relation** (is the emotion held *because* of the features that make it merited?).

  In epistemology, this is the difference between *propositional justification* (there are reasons to believe $p$) and *doxastic justification* (the subject believes $p$ *on the basis of* those reasons). In emotion theory, we rarely carve it this sharply. We tend to lump them under "appropriateness" or "rationality," which blurs the very distinction you are teaching.

  Here is the brainstorming, the commitment, and the carving.

  ### Neighboring Ideas on the Shelf

  Before settling, let's look at the tools you already have and why they are slightly dull for this cut.

  1.  **Fittingness vs. Rationality (D'Arms & Jacobson):**
      *   *The Temptation:* This is the standard distinction. *Fittingness* is about the object (is the dog dangerous?); *Rationality* is about the subject (do you have evidence?).
      *   *Why it fails:* "Rationality" is too broad. In your Case 1, the student *has* reasons (he is from that town), so she is internally rational, but the reasons are the *wrong kind*. In Case 2, the guilt is rational in a prudential sense (it maintains her self-image) but morally corrupted. The standard distinction doesn't capture that the *content* of the reason fails to match the *content* of the value.

  2.  **Epistemic Gettier Cases:**
      *   *The Temptation:* Case 1 is a classic Gettier problem. True belief (he is a liar), justified (in her mind), but the justification is disconnected from the truth.
      *   *Why it fails:* Emotions are not beliefs. Case 2 (Guilt) isn't about truth conditions in the same way; it's about moral motivation. A Gettier framework is too epistemic to capture the moral psychology of Case 2 or the affective inertia of Case 3.

  3.  **Virtue Ethics (Right Act, Wrong Motive):**
      *   *The Temptation:* Case 2 is exactly this. The act (feeling guilt) is what a virtuous person would do, but the motive (self-aggrandizement) is not.
      *   *Why it fails:* This applies well to moral emotions but struggles with Case 3 (Fear). Fear isn't a virtue in the same way. It doesn't give us a unified vocabulary for the *structure* of the emotion itself across different types.

  ### The Commitment: Fittingness vs. Proper Basing

  I commit to this distinction: You need to separate **Fittingness** (Ontological) from **Basing** (Psychological).

  *   **Fittingness:** A relation between the *object* and the *formal object* of the emotion. (Is the roommate actually untrustworthy? Is the act actually wrong? Is flying actually dangerous?)
  *   **Proper Basing:** A relation between the *subject's grounds* and the *object's value-making properties*. (Does the suspicion track the untrustworthiness? Does the guilt track the wrongness? Does the fear track the danger?)

  When you have Fittingness without Proper Basing, you have what I will term **"Accidental Fittingness."**

  This is the label I propose for your seminar. It captures the luck involved in Case 1, the moral contingency in Case 2, and the post-hoc rationalization in Case 3. The emotion is *accurate de re* (about the thing) but *defective de dicto* (about the description/reason).

  ### Carving the Cases

  Here is how "Accidental Fittingness" slices your three examples.

  **Case 1 (The Roommate): Epistemic Luck**
  *   **Fittingness:** High. The roommate *is* untrustworthy. Fear/Distrust is the correct response to that property.
  *   **Basing:** Defective. The distrust is based on a stereotype (town of origin), not the property of untrustworthiness.
  *   **Verdict:** This is **Accidental Fittingness** in the strongest sense. It is an emotional Gettier case. If the roommate had been from a different town, she would have trusted him, despite him being a liar. Her emotion is not *sensitive* to the truth.

  **Case 2 (The Guilt): Motivational Corruption**
  *   **Fittingness:** High. The act *was* wrong. Guilt is the correct response.
  *   **Basing:** Defective. The guilt is based on a desire for self-image ("I am the sort of person who feels guilt"), not the harm caused to the mother.
  *   **Verdict:** This is **Accidental Fittingness** via **Alienation**. The emotion points at the right value, but the subject is not responding to that value; they are responding to a second-order desire about themselves. It is "right" only by coincidence of content.

  **Case 3 (The Flying): Rationalized Affect**
  *   **Fittingness:** Contested (See "Edges" below). Planes crash, so *some* caution is fitting. But is *fear* fitting?
  *   **Basing:** Defective. The fear is based on a visceral feeling, not the statistical risk. The "crash rates" are a story told afterward.
  *   **Verdict:** This is **Accidental Fittingness** via **Rationalization**. Unlike Case 1, where the reason existed beforehand (the town), here the reason is constructed post-hoc to legitimize a feeling that arose from elsewhere.

  ### The Edges and Boundary Lines

  You asked for the edges. This is where the carving gets sharp.

  **1. The Proportionality Edge (Case 3)**
  Case 3 sits on the line. If the fear is a mild caution, it is *Fitting* (planes do crash). If the fear is a panic attack, it is *Unfitting* (the danger does not merit panic).
  *   *The Line:* If the intensity of the emotion exceeds the magnitude of the value property, **Fittingness fails**. In Case 3, if her fear prevents her from flying despite the safety statistics, the emotion is *not* fitting, even if planes crash.
  *   *Distinction:* Cases 1 and 2 are *Fitting but Ungrounded*. Case 3 is likely *Unfitting and Ungrounded*, merely disguised by a true premise ("planes crash"). Be careful grouping Case 3 with 1 and 2. In 1 and 2, the emotion *lands* on the truth. In 3, the emotion *claims* the truth but may be disproportionate to it.

  **2. The Sensitivity Edge**
  How do you test for Proper Basing? Use a **counterfactual test**.
  *   *Ask:* "If the value property were absent, would the emotion persist?"
  *   *Case 1:* If he weren't a liar (but still from that town), would she distrust him? Yes. -> **Fails Sensitivity.**
  *   *Case 2:* If the act weren't wrong (but still made her look virtuous), would she feel guilt? No, she'd feel pride. -> **Fails Sensitivity** (but in a complex way).
  *   *Case 3:* If planes were perfectly safe (0 crashes), would she still fear? Yes. -> **Fails Sensitivity.**
  *   *The Edge:* An emotion is **Properly Based** only if it is sensitive to the value property. If the emotion persists when the value property is removed (held constant the subject's grounds), it is Accidentally Fitting.

  **3. The "Right Reason" Edge**
  Does the subject need to *know* the reason?
  *   *Scenario:* A mother feels fear when her child is near a cliff. She can't articulate the physics of gravity, but she sees the drop.
  *   *Verdict:* This is **Properly Based**. The ground (visual drop) is causally linked to the value (danger).
  *   *Your Cases:* In your cases, the ground (town, self-image, feeling) is *causally* linked to the emotion, but *logically* disconnected from the value.
  *   *The Edge:* The Basing Relation requires a **non-accidental causal link** between the value property and the emotion.

  ### Implications for "What Emotions Are"

  You noted this bears on the Judgment vs. Perception debate. Here is the payoff:

  *   **If Emotions are Judgments:** They should be answerable to reasons. Your cases show they often aren't, yet they can still be "right." This suggests emotions are not *constituted* by judgments, though they can be evaluated by them.
  *   **If Emotions are Perceptions:** They are answerable to the world. Your cases show they can be "right" about the world without "seeing" it properly (like a broken clock being right twice a day).
  *   **The Synthesis:** Your distinction supports a **Hybrid View** (like Robert Roberts' "Concern-Based Construals"). Emotions are perception-like states that *take* the world to be a certain way, but they are subject to doxastic constraints (Basing).
  *   **The Takeaway:** An emotion can be **Veridical** (matches the world) without being **Knowledge** (sensitive to the reasons).

  ### Summary for the Seminar

  Don't just call it "irrational." That implies the emotion should be discarded. In Case 1, the distrust is useful! In Case 2, the guilt repairs the relationship!

  Call it **"Accidental Fittingness."**
  *   **Fittingness:** The world warrants the emotion.
  *   **Accidental:** The subject's route to the emotion does not track that warrant.

  This allows you to say: "Your distrust was *fitting* (he is a liar), but it was *accidentally fitting* (you didn't know why). Therefore, you cannot rely on it in the future." This preserves the normative force without granting the student epistemic credit she doesn't deserve.

  **Where Case 3 Belongs:**
  I advise you to separate Case 3. Cases 1 and 2 are **Accidentally Fitting** (The value exists, the emotion hits it, the reason is wrong). Case 3 is **Rationalized Affect** (The emotion exists, the reason is fabricated, the value is debatable). Case 3 is a failure of *proportionality* masquerading as a failure of *basing*. Keep it on the boundary to test your students' understanding of Fittingness.
