answer: |-
  **Speech for the 80th Anniversary of the Nuremberg Judgment**
  **Venue:** Old Courthouse
  **Time:** 7–8 Minutes

  Good afternoon.

  I am a commercial litigator. I spend my life arguing about breach of contract, discovery disputes, and which party owes money to which other party. I do not practice international criminal law. I do not write dissertations on the London Charter. I am on this committee because I volunteered, and then, as often happens in volunteer organizations, I volunteered for the wrong thing at the wrong time, and now I am standing here.

  I mention this because when you are asked to speak about Nuremberg, the temptation is to reach for the sublime. To talk about the birth of human rights, or the triumph of the rule of law over the rule of force. But looking around this room, I see survivors. I see students. And I see colleagues who know the case law better than I do. If I offer you a platitude, you will politely clap, and then you will go to the reception and tell each other how shallow it was.

  So, I want to talk about the accusation that follows these trials like a shadow. *Victors' Justice.*

  We tend to use that phrase as a single dismissal. But standing here, eighty years on, I think we do a disservice to the history if we smoosh it all together. There are actually two distinct complaints hidden inside that phrase. One is a legal objection. The other is a moral one. And they require different answers.

  The first complaint is retroactivity. The defense raised it in 1945, and it was not a stupid point. The Charter created crimes—Crimes Against Peace, Crimes Against Humanity—that did not exist as statutory offenses when the acts were committed. In 1939, you could not look up "waging aggressive war" in a penal code and find a sentence attached to it. The defense argued that applying new laws to old conduct violated the most basic principle of legality: *nullum crimen sine lege*. No crime without law.

  There are answers to this. Some argue that these acts were already criminal under customary international law and existing treaties; the Charter just codified what was already binding. Others argue, in the spirit of Gustav Radbruch, that there is a floor of decency below which a state's decree stops counting as law at all, regardless of when it was written. Legal scholars still debate which of those arguments does the heavy lifting. It is a technical dispute, but it matters. It matters because if the law wasn't real, the judgment was just force wearing a mask.

  But there is a second complaint, and it is a different animal. This is the complaint of selectivity.

  Retroactivity asks: *Was this law?* Selectivity asks: *Why only them?*

  The docket at Nuremberg contained the losers' conduct and only the losers' conduct. There were no charges for the firebombing of Dresden or Tokyo. There were no charges for the atomic bombings. There were no charges for what the Soviet Union did in Poland and the Baltics, despite the Soviet judges sitting on the bench. The Emperor of Japan was not in the dock. And we now know that a biological warfare program was never prosecuted because the data was deemed more valuable than justice.

  There is a subtler version of this selectivity, one I only learned recently. Even within the four corners of the Charter, Crimes Against Humanity were tied to the war. The Tribunal ruled it had no jurisdiction over the persecution of German Jews before 1939. The law the Allies wrote had a seam in it, and the seam fell somewhere convenient for them.

  You cannot answer selectivity with a legal citation. The honest answer is not a argument; it is an admission. The honest answer is: *Yes.*

  We see this even more starkly in Tokyo. The International Military Tribunal for the Far East is often forgotten, but it is the harder case. The judgment there was not unanimous. The fullest statement of the victors' justice charge came not from a defendant, but from Justice Radhabinod Pal of India, sitting on the bench. He voted to acquit every defendant on every count. He argued that the tribunal was merely a sword of the victors, and that until the law applied equally to all nations, it was not law at all. He was outvoted. But his dissent remains on the record.

  So, where does that leave us?

  If I were closing a commercial case, I would tell you we have a messy settlement with unresolved liabilities. But this is not a commercial case.

  The retroactivity question has legal answers, some better than others. The selectivity question has no answer we should be comfortable with. It remains a flaw in the foundation. We cannot wish it away with a flourish about the rule of law prevailing. The rule of law did not fully prevail. Power was involved. Compromise was involved. Hypocrisy was involved.

  And yet.

  We are here. The survivors are here. The reason we are in this courthouse, rather than letting history slide into silence, is not because the trials were perfect. It is because they happened at all. Despite the retroactivity, despite the selectivity, despite the seams in the Charter, the world stopped to write down what happened. It created a record that could not be easily denied.

  We acknowledge the flaws not to diminish the judgment, but to honor the truth. The truth is that justice is rarely pure. It is often improvised by flawed people in the aftermath of catastrophe. It is selective. It is retrospective. But it is better than the alternative.

  The alternative was not a perfect trial. The alternative was silence.

  Thank you.

  ***

  **NOTES FOR THE SPEAKER (DO NOT READ ALOUD)**

  **On Retroactivity (Contested):**
  *   **The Status:** There is *no* consensus among scholars that the retroactivity problem was fully solved.
  *   **The Arguments:** The "customary international law" argument (that the laws already existed in custom) is the standard defense, but positivists reject it. The "Radbruch Formula" (extreme injustice is no law) is a philosophical justification, not a strictly legal one, and is applied retrospectively by critics.
  *   **The Risk:** Do not state as fact that the laws *were* clearly in force in 1939. State that there are *arguments* they were. Some experts in your audience will view the *ex post facto* nature as a permanent stain that legal gymnastics cannot remove.

  **On Selectivity (Settled Fact, Contested Meaning):**
  *   **The Status:** It is a historical fact that Allied crimes were not prosecuted. It is a historical fact that Unit 731 data was traded for immunity (Sweet Agreement). It is a historical fact that the "nexus to war" requirement excluded pre-1939 persecution of German Jews (this was a specific jurisdictional limitation in the IMT Charter regarding CAH).
  *   **The Risk:** Do not imply this selectivity invalidates the guilt of the defendants. The consensus is that the defendants were guilty of *something*, even if the trial was flawed. The debate is whether the selectivity undermines the *legitimacy* of the tribunal, not the *factual guilt* of the Nazis.
  *   **Tokyo:** Justice Pal's dissent is historical fact. His legal reasoning is highly controversial and often criticized as apologetic, but his charge of "victors' justice" is historically accurate regarding the composition of the tribunal.

  **On Tone:**
  *   You are walking a line between "cynical dismissal" and "hagiography." Keep the focus on the *record* created, not the *morality* of the prosecutors. The survivors care about the recognition of harm, not the purity of the legal theory. Stick to that.
