      *   *Diagnosis 2: The Semantic/Metaphysical Ambiguity.* Address the "two questions" hunch. SCA was originally about meaning. Now it's often about property identity. If the friend attacks the metaphysics and the defender defends the semantics (or vice versa), they talk past each other.
      *   *Diagnosis 3: The Hidden Intrinsic/Extrinsic Gap.* Address the user's strongest hunch. This is the engine of the fink/mask problem. Dispositions seem intrinsic; Conditionals are extrinsic. This explains *why* the patches fail.
      *   *Conclusion on Progress:* What breaks the deadlock?
          *   Not more cases (arms race).
          *   Maybe a shift to *powerful qualities* or *dispositional essentialism* (Bird).
