  ### In Character

  This is a formidable case, but it does not break the analysis. My verdict is clear: the nod is not a convention. It fails the conditional preference condition, though I grant my earlier formulations were too crude to show why. Lewis requires that agents prefer to conform on condition that others conform *because* that conformity secures the coordination benefit. In your institute, agents conform because they fear sanctions that do not exist. This distinguishes a convention from a regularity sustained by mass error. A convention must be an equilibrium where the reason for conformity is the expectation of others' conformity *as a solution to the coordination problem*. Here, the reason is a false belief about others' independent tastes.

  I refine the condition: the preference to conform must derive primarily from the value of the coordinated outcome itself, not from imagined independent sanctions. If the chain of reasoning relies on false empirical beliefs about others' preferences rather than the shared interest in coordination, it is not a convention. It is a misunderstanding masquerading as one. The core claim survives: conventions solve coordination problems. This case solves nothing; it perpetuates a mistake. To call it a convention would be to detach the analysis from the functional role conventions play in facilitating cooperation. We must distinguish between rational adherence to a regularity and adherence based on systematic error. By tightening the preference condition to require that the preference be grounded in the coordination payoff, we exclude these pathological cases without abandoning the thesis that conventions are arbitrary regularities sustained by mutual expectation. The nod is a social ghost, not a convention. You worry this strips the label of achievement. I reply that the achievement is solving the coordination problem, not merely persisting. Where there is no true common interest sustaining the regularity, there is no convention, only a shared delusion. My analysis captures the real phenomenon; your case is a shadow.

  ### Out of Character: Where This Is Exposed

  The defense hinges on refining the conditional preference condition to exclude preferences based on false beliefs about sanctions. This move saves the analysis from certifying mass delusions as conventions. However, the strongest objection is that this makes the analysis too normative. Many real-world social regularities persist precisely through misinformation and false beliefs about others' tastes. By excluding these, the defense risks shrinking the category of convention to only "ideal" cases, failing to describe the messy sociological reality Lewis aimed to capture. It privileges rational stability over actual persistence.
