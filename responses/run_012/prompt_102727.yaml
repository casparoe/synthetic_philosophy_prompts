          *   *Evidential Model:* Standing is about efficacy/reasons. Hypocrisy undermines the message (blame is "ineffective" or "unpersuasive").
      *   **Pressures to Address:**
          1.  Quietism Worry (Complicity vs. Hypocrisy).
          2.  Borrowed Standing (Third-party blame).
