answer: |-
  **Brainstorming Moves**

  *   **Forfeiture Model:**
      *   *Core Move:* Standing is a normative power/office. Hypocrisy violates the equality condition required to hold that office.
      *   *Defense:* Explains the specific sting of "Who are you to say?" It's not just that the message fails; it's that the speaker has no right to deliver it.
      *   *Vulnerability:* The Quietism Worry. If standing is easily forfeited, moral community collapses. Needs a robust account of *culpability* to distinguish complicity from hypocrisy.
      *   *Repair:* Conceptualizes restoration as re-earning the office (atonement).

  *   **Evidential Model:**
      *   *Core Move:* Standing is instrumental/communicative. Hypocrisy undermines the credibility of the moral reason offered.
      *   *Defense:* Avoids quietism (a hypocrite can still offer good reasons). Focuses on uptake and moral repair.
      *   *Vulnerability:* Reduces moral authority to rhetorical efficacy. Cannot explain why we feel *resentment* at the hypocrite's blame, rather than just finding it unpersuasive.
      *   *Repair:* Conceptualizes restoration as rebuilding trust/credibility.

  *   **Verdict:** The Forfeiture Model captures the deontic structure of blame better, provided it distinguishes between structural complicity (shared burden) and culpable hypocrisy (claiming exemption).

  ***

  ### The Office of the Blamer: A Defense of the Forfeiture Model

  The debate over moral standing is one of the few areas in ethics where the *tu quoque* argument is not immediately dismissed as a formal fallacy. When a blamer is guilty of the very wrong they condemn, our intuition is not merely that their argument is weak, but that their address is *out of order*. This intuition drives the controversy over whether hypocrisy defeats standing. To resolve this, we must choose between two competing architectures of moral address: the **Forfeiture Model**, which treats standing as a normative status that can be revoked, and the **Evidential Model**, which treats standing as a function of communicative efficacy.

  It is settled in the literature that hypocrisy often makes blame *less effective*. What is genuinely contested is whether hypocrisy makes blame *illegitimate*. Does the hypocrite lack a reason to be heard, or do they lack the right to speak? While the Evidential Model offers a safer path through the complexities of social life, I argue that only a refined Forfeiture Model can account for the specific normative grievance involved in hypocritical blame. However, to survive the pressure of quietism, this model must distinguish sharply between culpable hypocrisy and structural complicity.

  **1. The Quietism Worry**
  The most potent objection to the Forfeiture Model is the quietism worry. If standing is forfeited by violation of the norm, and we all live within unjust structures (capitalism, patriarchy, systemic racism), then we are all complicit. If complicity equals forfeiture, moral discourse grinds to a halt. Proponents of the Evidential Model seize on this to argue that standing must remain intact so long as the moral claim is true.

  However, this objection relies on a category error regarding the conditions of forfeiture. Forfeiture should not attach to mere causal involvement in a wrong, but to *culpable exemption*. One forfeits standing when one implicitly claims a special immunity from the norm one is enforcing. A person trapped in an unjust economic structure who condemns theft has not necessarily claimed exemption from the norm against theft; they are navigating a constrained field. Conversely, a corrupt politician who prosecutes minor infractions while committing major ones *is* claiming exemption. The Forfeiture Model avoids quietism not by lowering the bar for standing, but by raising the bar for forfeiture: one must be culpably committed to the violation while demanding compliance from others. The Evidential Model cannot make this distinction; for it, a hypocrite's blame is just "noise," regardless of whether the hypocrisy is structural or malicious.

  **2. Borrowed Standing**
  Consider the case of third-party blame. If Alice harms Bob, and Carol blames Alice, whose standing is in play? The Evidential Model suggests Carol acts as a messenger; her standing depends on whether she can credibly convey Bob's grievance. If Carol is a hypocrite, the message is distorted.

  The Forfeiture Model offers a more robust explanation. Standing is an office within the moral community. When Carol blames on Bob's behalf, she is not merely transmitting data; she is invoking a shared normative authority. If Carol is a hypocrite regarding the norm she invokes, she lacks the authority to represent the moral community, even if she represents the victim. This explains why we often reject the *tone* of a third-party blamer even when we accept the victim's pain. The victim has standing by virtue of being wronged (a status the Forfeiture Model can accommodate as primary standing). The third party has standing by virtue of their membership in the moral community (secondary standing). Hypocrisy forfeits the secondary standing because it violates the equality condition of membership. The Evidential Model blurs this distinction, reducing the third party's role to mere amplification, missing the normative weight of their intervention.

  **3. Acts versus Character**
  Does hypocrisy defeat blame for a specific act differently than blame for a character trait? Here, the models diverge significantly. The Evidential Model treats both as claims about the world; if the act occurred, the blame is factually grounded. The Forfeiture Model distinguishes between the *truth of the proposition* and the *felicity of the speech act*.

  We must acknowledge a distinction often glossed over: blaming the *deed* versus blaming the *agent*. A hypocrite may correctly identify a wrongful act ("You stole that money"). The Forfeiture Model concedes the truth of the accusation but denies the hypocrite the warrant to hold the agent *accountable* for it in a way that implies moral superiority. However, when blame targets character or standing commitments ("You are a thief"), the hypocrite's lack of standing is more total. To judge another's character while possessing a flawed character oneself is to occupy a judge's seat without a commission. The Forfeiture Model explains why we feel the latter is more offensive than the former. The Evidential Model struggles here, as a hypocrite might be an excellent judge of character (detectives often are), yet we still resent their moralizing.

  **4. Registration versus Warrant**
  A common intuition is that even when we reject a hypocrite's blame, we still acknowledge the wrong they identified. "You're a hypocrite," we say, "but they *did* do something wrong." The Evidential Model claims this proves standing was never lost; the blame "registered."

  The Forfeiture Model can accommodate this without conceding the point. We must distinguish between the *content* of the blame and the *address*. A liar can tell the truth. The fact that the statement is true does not mean the liar had the warrant to assert it in that context. When we say, "You're right, but you have no right to say it," we are precisely invoking the Forfeiture Model. We register the moral fact (the act was wrong) while rejecting the normative transaction (the holding to account). The Evidential Model collapses this distinction, implying that if the blame registers, the standing was effective. But moral life is full of accurate accusations delivered by those with no authority to deliver them. The Forfeiture Model preserves the integrity of the moral norm (the act is still wrong) while policing the boundaries of the moral community (the blamer is out of order).

  **5. Repair**
  Finally, consider restoration. Can a hypocrite regain standing? The Evidential Model views this as a matter of rebuilding credibility over time, a psychological process of proving reliability. The Forfeiture Model views it as a normative process of *atonement*.

  This is a crucial advantage for the Forfeiture Model. If standing is a status, it can be formally restored through specific normative acts: apology, restitution, and public re-subscription to the norm. This explains why a simple passage of time (which might help the Evidential case) is often insufficient. We demand that the blamer acknowledge their own violation to regain the right to blame others for it. The Evidential Model cannot explain why the *form* of the repair matters so much; if the goal is merely future efficacy, a reformed hypocrite could simply start blaming effectively again. But we intuitively feel they must *clear their name* regarding the past violation. This points to standing as a status that was lost and must be ceremonially regained.

  **Verdict**

  The Evidential Model is tempting because it keeps the channels of moral communication open. It treats blame as a tool for social regulation, where utility dictates validity. However, this instrumentalizes moral address. It fails to capture the distinct resentment we feel when told to obey a rule by someone who exempts themselves. That resentment is not about the inefficacy of the message; it is about the injustice of the address.

  Therefore, I defend the **Forfeiture Model**, with the necessary refinement regarding complicity. Standing is a normative power grounded in the equality of moral agents. Hypocrisy defeats standing because it violates this equality, rendering the blame normatively infelicitous even if factually correct.

  What follows for ordinary moral life? We must stop treating the "hypocrisy objection" as a mere deflection of the truth. When a blamer is exposed as a hypocrite, we should not simply check if their facts are right. We are entitled to reject their *authority* to hold us to account. However, to avoid quietism, we must be rigorous in distinguishing between those who are *culpably hypocritical* (claiming exemption) and those who are *structurally complicit* (struggling within shared constraints). We should silence the former, not because they are wrong about the good, but because they have forfeited the office of the blamer. We should listen to the latter, recognizing that in a non-ideal world, the right to blame is not reserved for the sinless, but for those who do not claim to be.
