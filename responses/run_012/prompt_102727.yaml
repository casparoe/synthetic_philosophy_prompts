      *   *Refining the "Borrowed Standing" point:* If a racist blames a racist for being racist, does the first racist have standing? Forfeiture says no (they violate the norm). Evidential says maybe (if they can persuade). But what if they blame on behalf of a victim? Forfeiture suggests they still lack the *moral office* to represent the norm. I need to be precise here.

      *   *Refining "Repair":* Forfeiture makes repair a normative status change. Evidential makes it a psychological trust change. Forfeiture is stronger here.

