      *   **Pressure 5: Repair.** Can standing return? Forfeiture says yes (atonement). Evidential says yes (regaining trust). Forfeiture offers a clearer normative pathway (re-subscription to the norm).
      *   **Conclusion:** Commit to the Forfeiture Model (with the complicity distinction). Practical implication: We should challenge hypocritical blamers not on the *content* but on their *authority*, while remaining open to their reform.

