          5.  Repair (Restoring standing).
      *   **Constraint:** Distinguish between settled views and contested positions. Do not present contested positions as consensus.

  2.  **Brainstorming Moves:**
      *   *Forfeiture Side:* Hypocrisy violates the equality condition. You can't claim moral authority if you don't submit to the norm yourself. It's about fairness/entitlement. *Risk:* Leads to quietism (no one can blame). *Response:* Distinguish strict liability from culpable hypocrisy.
      *   *Evidential Side:* Blame is communicative. Hypocrisy makes the message noise. It's about utility/truth-tracking. *Risk:* Doesn't capture the *right* to blame, just the prudence. If a hypocrite is right, why silence them? *Response:* It's not silencing, it's about the *force* of the address.
      *   *Hybrid:* Maybe standing is a threshold (Forfeiture) but the *weight* is evidential. Or maybe Forfeiture applies to *reactive attitudes* while Evidential applies to *moral admonishment*.
      *   *Verdict:* I need to pick a side or a specific hybrid. The Forfeiture model feels more robust for explaining the *normative* sting of "who are *you* to say?" but needs modification to avoid quietism. The Evidential model is too instrumental. I will argue for a modified Forfeiture model that incorporates a distinction between *culpable* hypocrisy and *structural* complicity.

  3.  **Drafting - Section by Section:**

      *   **Introduction:** Define the debate. Introduce the two models. State the thesis (Defending a nuanced Forfeiture Model).
      *   **Pressure 1: Quietism.** Address the "everyone is complicit" argument. Distinguish between *structural complicity* (often non-culpable or shared burden) and *specific hypocrisy* (claiming exemption). Forfeiture shouldn't apply to the former.
