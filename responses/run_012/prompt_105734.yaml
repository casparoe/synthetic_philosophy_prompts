prompt: |-
  I'm in a graduate seminar that keeps circling back to the slogan "all truths are knowable," which my classmates produce whenever anyone suggests there might be facts that no one could ever discover. They say that suggestion isn't merely false but incoherent, that it betrays a confused picture of what truth is, and that once you see the slogan clearly the objection dissolves. I've been nodding along, but I've started to suspect the sentence is doing at least three different jobs at once and that their argument only works for one of them. What I'd like from you is a survey of the precise claims that one sentence could be making, arranged from the nearly empty to the genuinely radical: readings on which it merely says that anything true is the sort of thing a language-user could in principle put into words, readings on which it is a substantive thesis about meaning or about the constitution of truth, readings on which it is a psychological or sociological prediction about what some actual or ideal inquirer will eventually come to know, and any further reading you think the slogan naturally invites. For each reading, tell me whether it is trivial, defensible but contentious, or plainly false, and what it would take to refute it.

  Then tell me which of those readings the slogan has to be taking if it is to license my classmates' move -- the move from "there are unknowable truths" being false to its being meaningless or self-defeating -- and whether any of the more modest readings would do that work just as well. I'd also like you to sort out something a friend said that I can't evaluate: that the slogan, taken at face value, actually collapses into the claim that every truth is already known by someone, which sounds like a reductio of the slogan itself rather than of the skeptic. Which reading makes that collapse happen, is the collapse really a problem for the slogan or only for a particular way of formalizing it, and if it is a problem, does it touch the modest readings or only the ambitious ones? I care most about the reading my classmates probably intend, so please say plainly which one that is and whether it survives.

  Please write this as continuous prose -- no headings, no bullet points, no bold, no tables -- the way you'd write a long and careful email to a colleague.
