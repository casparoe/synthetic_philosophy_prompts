answer: |-
  Dear colleague,

  Your suspicion is well-founded, and I think you have put your finger on exactly why the discussion in your seminar feels both compelling and slightly slippery. The slogan all truths are knowable is indeed a chameleon, and without distinguishing the specific claim being made, it is impossible to evaluate the argument your classmates are advancing. To help you untangle this, I will walk through the precise claims this sentence could be making, arranging them from the nearly empty to the genuinely radical, and then we can assess which one is doing the work in your seminar and whether it can withstand the objections you have raised.

  The weakest reading of the slogan is what we might call the linguistic or expressibility thesis. On this view, the claim is simply that if a proposition is true, it is the sort of thing that can be expressed in language by a language-user. This is nearly empty because it treats knowability as a stand-in for stateability. It suggests that there are no ineffable truths, no facts that exist entirely outside the reach of conceptual articulation. This reading is trivial in the context of most analytic philosophy, where truth is generally predicated of propositions, and propositions are by definition the kinds of things that can be believed or asserted. To refute this, one would have to argue for a form of mysticism or extreme realism where facts outrun any possible language, a position few in your seminar are likely holding. Consequently, this reading cannot be what your classmates are relying on, because it does not make the suggestion of unknowable truths incoherent; it merely says that if there were such truths, we couldn't talk about them, which is not the same as saying they cannot exist.

  Slightly more substantive is the empirical or optimistic reading. Here, the slogan is treated as a prediction about the actual course of inquiry, perhaps idealized. It claims that as a matter of fact, any truth will eventually be discovered by some inquirer, given enough time and resources. This is defensible but highly contentious, and many would argue it is plainly false. It relies on a hopeful view of human progress or the structure of the universe that guarantees evidence for every fact will persist and be accessible. To refute this, one need only point to the loss of historical data, the destruction of evidence, or the cognitive limits of finite beings. If a dinosaur sneezed in a specific pattern millions of years ago and left no trace, that truth exists but is empirically unknowable. This reading fails to support your classmates' move because it treats unknowable truths as merely improbable or absent, not as conceptually impossible. It allows that there could be unknowable truths, even if there happen not to be any.

  The third reading is the modal epistemic principle, which is the standard formalization used in logic. This claims that for any proposition p, if p is true, then it is possible that p is known. This is not a claim about what will happen, but about what could happen. It is defensible and has been held by many anti-realists, but it is fraught with technical difficulty. To refute it, one does not need to find an actual unknown truth, but rather to show that the concept of truth allows for evidence-transcendent facts. A realist would argue that truth is determined by how the world is, independent of our epistemic access, so there is no contradiction in a truth being permanently inaccessible. However, the most famous refutation of this specific reading comes from your friend's objection, which I will address in a moment, as it suggests this reading logically collapses into a stronger claim.

  The fourth and most radical reading is the constitutive thesis, often associated with verificationism or Dummettian anti-realism. On this view, knowability is not just a property of truth but constitutes what truth is. To say a statement is true is just to say that there is, in principle, evidence or a method to verify it. There is no gap between truth and knowability because truth is defined by our epistemic capacities. This is the only reading that makes the suggestion of unknowable truths incoherent rather than merely false. If truth is constituted by knowability, then the phrase unknowable truth is a contradiction in terms, like married bachelor. To refute this, one must attack the underlying theory of meaning, arguing that we clearly understand statements whose truth conditions outrun our ability to verify them, such as statements about the distant past or infinite totalities. This reading is genuinely radical because it denies the realist conception of a world entirely independent of our minds.

  Now, to address your specific question about which reading licenses your classmates' move. They are arguing that suggesting unknowable truths is meaningless or self-defeating. This move requires the constitutive thesis. The modal reading says unknowable truths are impossible, but not that the concept is incoherent; the empirical reading says they are non-existent; only the constitutive reading says the concept itself is confused. None of the more modest readings would do this work just as well. The expressibility thesis allows for unknowable truths we just can't speak of, and the empirical thesis allows for them in principle even if none exist in fact. To get the result that the skeptic is speaking nonsense, your classmates must be committed to the idea that truth itself is an epistemic notion.

  This brings us to the objection your friend raised, which is a classic problem known as Fitch's Paradox of Knowability. Your friend is correct that the slogan, taken at face value in its modal form, collapses into the claim that every truth is already known. The argument runs as follows: suppose there is a truth that is not known. Let us call this proposition p. So p is true and p is not known. This conjunction is itself a truth. If all truths are knowable, then it must be possible to know this conjunction. But to know a conjunction, one must know each part. So one would have to know p and know that p is not known. But knowing that p is not known implies that one does not know p. This is a contradiction. Therefore, there can be no truth that is not known. If all truths are knowable, then all truths are known. This collapse happens on the modal reading and, by extension, threatens the constitutive reading if it is formalized using standard modal logic.

  The collapse is a serious problem for the slogan, but it touches the ambitious readings rather than the modest ones. The expressibility reading is untouched because it makes no claim about the possibility of knowledge, only about language. The empirical reading is also safe because it claims we will know everything, so it accepts the conclusion that everything is known (eventually), though it arrives there via prediction rather than logic. The modal and constitutive readings are the ones in trouble. However, philosophers who wish to save the slogan have developed restriction strategies. They argue that the knowability principle applies only to basic propositions, not to complex conjunctions like p and p is not known. If they restrict the scope of the slogan, they can avoid the collapse into omniscience. So, the collapse is a problem for the unqualified slogan, but not necessarily for a refined version of the theory.

  Finally, you asked which reading your classmates probably intend and whether it survives. Given that they claim the skeptic's position is incoherent, they almost certainly intend the constitutive thesis. They are likely anti-realists who believe truth cannot outrun evidence. Does it survive? It survives only if they are willing to accept the restrictions needed to block Fitch's Paradox. If they insist on the unrestricted claim that all truths are knowable, then your friend's objection stands as a reductio, forcing them to admit that all truths are already known, which is absurd. If they accept the restriction, they must concede that not all truths are knowable in the strict sense, but only all basic truths, which weakens their slogan significantly. In its strong, unrestricted form, the reading they intend does not survive the logical scrutiny your friend applied. However, in a restricted form, it remains a live, albeit contentious, position in the philosophy of language. You are right to press them on this distinction, because without it, their confidence in the slogan is resting on a logical ambiguity that dissolves under pressure.

  I hope this survey helps you navigate the seminar. It is a fascinating topic, and your instinct that the sentence is doing too much work at once is the key to unlocking the debate.

  Best regards,

  Your colleague
