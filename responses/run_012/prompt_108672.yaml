answer: |-
  1. Descartes asserts that when he thinks, he knows with certainty that he exists as a thinking thing. However, one might object that knowing 'thinking is happening' does not prove 'a thinker exists,' nor that this thinker persists beyond the present moment, nor that it is a substance whose whole essence is thought. Explain how Descartes moves from the occurrence of thought to the conclusion that he is a thinking substance whose essence is thought. Is this move best understood as an inference from premises or as a single act of intuition? Specify what theoretical work the notion of 'substance' performs in this step, and what would be lost if Descartes abandoned it in favour of a view that thoughts exist without a subject.

  2. Model Treatment: The candidate must distinguish the indubitability of the present thought episode from the positing of an owner of that thought. Marks: 4. Mistake: Conflating the occurrence of thought with the existence of a subject without argument.

  3. Model Treatment: The candidate must address the problem of temporal persistence versus the instantaneous certainty of the cogito. Marks: 5. Mistake: Assuming the 'I' discovered in the cogito automatically endures beyond the present moment.

  4. Model Treatment: The candidate must articulate the metaphysical work done by 'substance' regarding independence and unity, and the cost of dropping it. Marks: 5. Mistake: Treating 'substance' as a mere label rather than a metaphysical commitment with consequences.

  5. Model Treatment: The candidate must defend a stance on whether the move to substance is inference or intuition, showing how this choice secures the essence of thought. Marks: 6. Mistake: Asserting the 'performance' reading solves the substance problem without explaining how intuition grasps essence.
