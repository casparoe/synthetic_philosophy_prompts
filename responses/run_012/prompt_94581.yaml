          *   *Distrust:* Reports that function as *self-interpretations* (using a model to explain state).
      *   **Address the "Job" Entry:** This is the weak point. It must be admitted that this is likely *corroboration masquerading as introspection* OR a "standing commitment" that feels like a current state. I need to be honest: The principle forces the user to downgrade the Job entry unless external evidence exists.
