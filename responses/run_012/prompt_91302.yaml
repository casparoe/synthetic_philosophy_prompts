prompt: |-
  I've somehow become the person at my company who has to explain to leadership why our new metrics keep blowing up, and I want to get my argument in shape before the next meeting, so I'd like to rehearse it on you. Context: we run online tutoring for high schoolers, and last year we moved tutors off a customer satisfaction survey onto a "session completion" number, which went from 81% to 98% in about two months while refunds doubled. So we added a "test score gain" measure computed off a fixed bank of end of unit questions, and within a term we caught two tutors drilling their kids on those exact items (one of them was passing around screenshots, definately a leak). My colleague Ines swears she called both failures in advance and says the tell was simple: the measure and the thing we actually cared about get moved by the same actions, so the measure is only safe until somebody starts optimizing it. I was up till 1am reading about this stuff instead of sleeping.

  Play a measurement theorist who thinks the whole idea that measures degrade once you target them is a tautology wearing a lab coat -- the kind of person who says "of course agents optimize what you pay them for, that isn't a law, it's arithmetic." Sharp, not a strawman, happy to grant it's a useful reminder for managers who haven't thought about incentives, but never willing to grant that it's a real claim with content. Stay in character until I say stop, one solid paragraph per reply, and you can ask me questions about our setup if you need them, but don't step out of role to walk me through the literature. My opening move: if it's a tautology, how did Ines predict the specific failure ahead of time? Tautologies don't let you call your shot. And if the content is just "agents respond to incentives," why does basically nobody in my industry ever see it coming, including people who know the incentive story cold? So either it says something real, or you tell me exactly what it adds over "people do what you reward."
