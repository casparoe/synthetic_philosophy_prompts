  ### The two jobs

  Higher-order theories posit that a mental state becomes conscious only when targeted by a higher-order representation. This single mechanism is asked to perform two distinct functions. First, it must constitute the *phenomenal character* of the experience—making there be "something it is like" for the subject. Second, it must secure *access consciousness*—placing the state at the disposal of reasoning, report, and voluntary control. Standard presentations strictly assume these functions are co-extensive: if you have the higher-order state, you have both the feeling and the access. Your gap identification is very precise: there is no obvious necessity that the mechanism generating phenomenal feel must be identical to the mechanism enabling cognitive access. A system might feel without reporting, or report without feeling (zombie-style). By binding them into one higher-order state, the theory risks conflating the ontology of experience with the functional architecture of access. If the higher-order state fails at one job but succeeds at the other, the theory's definition of consciousness fractures. We must examine whether the higher-order state is fundamentally a phenomenology-maker or an access-enabler, because the invented cases below force these roles apart. The tension lies in whether the higher-order state *creates* the quality or merely *registers* it for use.

  ### How each version ties them together

  The two dominant variants attempt to bind phenomenality and access differently, each paying a different theoretical price for the union. The *Inner Sense* model treats the higher-order state as perceptual. It scans the first-order state much like vision scans the world. Because perception is typically non-conceptual and immediate, this model prioritizes phenomenality. The higher-order state makes the first-order state conscious by illuminating it, akin to a spotlight. Access is a downstream consequence: if you perceive your own state, you can usually report it. However, this model struggles to explain why the scan yields *conceptual* reportability without adding extra machinery. If the scan is bare perception, how does it translate into the thought "I see red"? It pays for phenomenality cheaply but buys access at a premium.

  The *Thought* model treats the higher-order state as a non-inferential judgment. Here, access is primary. To be conscious is to have a thought about oneself being in a state. This naturally explains reportability, as thoughts are the currency of reasoning. Phenomenality is derived from the content of the thought. The risk here is intellectualism: does a creature need concepts to feel pain? This model ties the jobs together by definition: having the thought *is* having the access, and the theory stipulates this thought *constitutes* the phenomenality. It pays for access cheaply but buys phenomenality at a premium.

  Both versions need the jobs to line up because if they come apart, the theory loses its real explanatory target. If the higher-order state exists but yields no phenomenality, it is merely access without consciousness (a zombie mechanism). If phenomenality exists without the higher-order state, the theory is false. The Inner Sense model relies on a causal link to ensure accuracy, while the Thought model relies on a reliability condition to prevent runaway misrepresentation. The Transitivity Principle states that a state is conscious only if one is conscious of it. This principle forces the alignment: being conscious of the state (via HOS) is supposed to simultaneously generate the feel and the availability. But this alignment is quite contingent, not necessary. The Inner Sense model suggests phenomenality is a kind of detection; the Thought model suggests it is a kind of classification. In both, the higher-order state is the bottleneck. If the bottleneck widens (access) without deepening (feel), or vice versa, the theory must decide which job is essential. Currently, they assume the HOS is a unified package deal, but the architecture of cognition suggests access networks and qualitative feels might dissociate. Both also face the misrepresentation problem: if the HOS is wrong, does the experience change or vanish?

  ### The worked case

  In Variant 1 (Mismatch), the first-order state represents red, but the higher-order state represents green. What does the system experience? A Higher-Order Theory must say the system experiences green. The phenomenology is determined by the higher-order content, not the first-order reality. What does it report? It reports green, because the report is driven by the higher-order state which is available for reasoning. Here, experience and report align, but both are wrong about the first-order state. The theory takes the higher-order content to be the phenomenology. This creates a "phenomenal error": the world looks green even if the retina says red. This is the "misrepresentation" scenario central to Rosenthal's defense.

  In Variant 2 (Accurate+Accessible), the higher-order state accurately represents red and is conceptual. The system experiences red and reports red. Experience and report align. This is the standard conscious case. The theory takes this alignment as proof that the higher-order state successfully did both jobs.

  In Variant 3 (Accurate+Non-conceptual), the higher-order state accurately represents red but lacks concepts. What does the system experience? It experiences red qualia. What does it report? It cannot report "red" conceptually, but might indicate the location non-verbally. Here, experience and report come apart. The theory must decide if this counts as consciousness. If the theory requires concepts (Thought model), Variant 3 is unconscious. If it allows perception-like scanning (Inner Sense), Variant 3 is conscious.

  This reveals the split. In Variant 1, the theory prioritizes the higher-order state over the first-order state for phenomenology. This distinguishes higher-order error from first-order error. A first-order error (hallucinating red when nothing is there) yields a conscious experience of red. A higher-order error (seeing red but thinking green) yields a conscious experience of green. The theory distinguishes them by locus: if the error is in the first-order state, the world is misrepresented; if in the higher-order state, the experience itself is altered.

  However, if the theory cannot distinguish these empirically, it loses content. If a subject reports green in Variant 1, is it because they feel green or because they are guessing? The principled reply is that the higher-order state *constitutes* the feel, so there is no further fact about what it is like besides the higher-order content. But this makes phenomenology hostage to the accuracy of the higher-order mechanism. Variant 3 is the crucial test. If non-conceptual higher-order states yield phenomenality, then infants and animals are conscious. If concepts are required, they are not. The Thought model excludes them; the Inner Sense model includes them. Your case shows that access (report) is possible without concepts in Variant 3 (pointing), but phenomenality might not be, depending on the version. The mismatch case proves that report tracks the higher-order state, not the first-order state. If the theory claims phenomenology also follows the higher-order state, then phenomenology and report are yoked. If phenomenology followed the first-order state, Variant 1 would feel red but report green. Since no theory accepts this, the theory admits phenomenology is tied to the higher-order state, just like report. This suggests the "phenomenal" job is parasitic on the "access" job.

  ### Where the theory is exposed

  The theory distinguishes first-order from higher-order error by locus of representation. A first-order error misrepresents the world (e.g., a red square when nothing is there); a higher-order error misrepresents the mind (e.g., thinking you see green when your visual system processes red). The theory retains empirical content only if these produce different behavioral signatures. In Variant 1, the signature is reporting green despite red stimuli. If this never happens, the theory is indistinguishable from a first-order theory where access and phenomenality track the first-order state. Reliability mechanisms make mismatches rare, but their possibility is constitutive; without it, the higher-order state is redundant.

  Conceptualism matters immensely. If the higher-order state must be conceptual (Thought model), then creatures without concepts (infants, dogs) lack phenomenal consciousness. They have first-order states but no "what it is like." This is a hard pill to swallow for many. The Inner Sense model avoids this by allowing non-conceptual scanning, preserving animal consciousness but making the higher-order state look suspiciously like just another first-order state (a perception of a perception).

  This leads to the final exposure: is this a theory of phenomenal consciousness or access consciousness wearing phenomenal clothing? On this evidence, the view is access consciousness wearing phenomenal clothing. In Variant 1, the system reports green because the higher-order state is accessible. It experiences green because the theory *says* so. But the only evidence for the experience is the report. If the higher-order state is defined by its availability for report, then phenomenality is defined by access. The theory struggles to explain what the higher-order state adds *qualitatively* that isn't just functional availability. If the higher-order state is removed, access is lost. If access is lost, report is lost. The theory equates the loss of report with the loss of feel. This suggests the "phenomenal" character is merely the functional role of being targeted by the access system. The theory is exposed as potentially reducing "what it is like" to "what can be used." If the higher-order state does not add a unique qualitative layer beyond access, the theory collapses into access consciousness. The mismatch case shows that report tracks the higher-order state, but we have no independent grip on whether the feel does too, other than theoretical stipulation.

  ### Bottom line

  Ultimately, I defend Inner Sense. It avoids the intellectualism of the Thought model, allowing infants and animals to be phenomenally conscious without requiring complex concepts. But the strongest objection is serious redundancy. If the higher-order state is just another perceptual state scanning the first-order state, what makes *it* conscious? If it requires a third-order state, we face an infinite regress. If not, consciousness needs no higher-order state, undermining the theory. Regress implies HOS isn't the source. It saves animal consciousness but risks explanatory idleness.
