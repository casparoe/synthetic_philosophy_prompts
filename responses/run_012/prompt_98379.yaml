prompt: |-
  Okay so I have zero formal background in this, I just read a lot and I've gotten kind of obsessed with the sortition thing lately — picking lawmakers by lottery, like in Athens. My whole reason for caring is the career-politician problem. I don't think politicians are bad people, I think the job is a job: you have to win the next election, keep your donors happy, and your already thinking about your next office or your book deal or your lobbying gig. Somebody who serves one term by lottery and goes back to their normal life doesn't have any of that. Term limits seem like the weak version of the same fix to me, but I could be wrong about that too.

  Here's the thing I keep going back and forth on, and it's a bit of a weird idea so bear with me. What if you don't sortition the people who *vote* on laws, but only the people who decide what gets voted on? Like a randomly chosen "agenda council" that picks, say, the ten or fifteen bills the elected legislature has to take up that session. Keep the elections, keep the professional politicians, but they can only act on stuff a random sample of citizens put in front of them. My gut says this gets you most of what I actually care about — the agenda stops being for sale — while dodging all the obvious objections to amateur lawmakers who don't know anything. But I have no idea if this is a real idea or if I'm just fooling myself.

  I've got about a year of evenings free and I want to write three or four long essays that might actually matter, not just blog posts nobody reads. So what I want from you: what are the open questions in this whole area — sortition, term limits, the career-politician problem — and which ones should I actually spend that year on? And I mean given my agenda-council idea specifically, because I suspect a bunch of the standard questions people always raise (fair representation, competence, etc.) matter less for that version than everyone assumes, and some boring unglamorous ones matter way more.

  Lay it out like this for me:

  1. **The state of play** — keep it to one paragraph, plain language. What are the live disagreements here right now, not the textbook version.

  2. **My shortlist** — the three or four questions you think deserve the year. One line each, just naming the question.

  3. **Why this order** — the part I care about most, so give it room, a good paragraph per question. For each: is it upstream of the others, is it actually answerable by somebody like me with no data and no institution behind me, is it still open ground or has it been chewed over to death already, and what would have to be true for the answer to matter at all.

  4. **Where I'm probably wrong** — where my agenda-council idea is quietly doing the work in your ranking and where it shouldn't be, plus anything you'd tell me to drop even though it's interesting.

  5. **What would reshuffle the list** — the one or two things that, if I learned them, would make me reorder the whole thing.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User Profile:** No formal background (political science, philosophy, etc.), well-read, obsessed with sortition (lottery-based selection), motivated by the "career-politician problem" (incentive structures, not moral failings).
      *   **Specific Idea:** An "Agenda Council" selected by sortition. They set the legislative agenda (pick 10-15 bills), but elected politicians still vote on them.
      *   **Goal:** Write 3-4 long, impactful essays over the next year.
      *   **Task:** Identify open questions in the field, specifically tailored to the "Agenda Council" idea, and prioritize them.
      *   **Format:** Strict 5-point structure (State of Play, Shortlist, Why This Order, Where I'm Probably Wrong, What Would Reshuffle the List).
      *   **Tone:** Plain language, respectful but critical, acknowledging the user's constraints (no data, no institution) while pushing for rigor.

  2.  **Deconstruct the "Agenda Council" Idea:**
      *   *Strengths:* Avoids the "amateur lawmaker" competence objection (pros still draft/vote), targets the "gatekeeping" problem (lobbyists/speakers control what gets voted on), reduces career incentives for the agenda-setters (one-off service).
      *   *Weaknesses:* Bottlenecks (what if they pick bad bills?), evasion (how do pros write the bills?), manipulation (can pros game the options?), legitimacy (why should random people control the docket?), implementation (constitutional hurdles).
      *   *Comparison:* It's distinct from a "Sortition House" (full legislative power) or "Citizens' Assemblies" (advisory only). It's a *procedural veto/initiative* hybrid.

  3.  **Drafting Section 1: The State of Play:**
      *   *Goal:* One paragraph, plain language, live disagreements.
      *   *Content:* Move beyond "is sortition democratic?" (answered: yes, arguably more so). Move to "how does it interface with existing institutions?" The debate isn't about replacing elections entirely anymore; it's about hybrid models (like the user's). The live wire is *power*: advisory vs. binding, and *scope*: agenda-setting vs. law-making.
      *   *Drafting thought:* Keep it punchy. Acknowledge the shift from theory to mechanism design.

  4.  **Drafting Section 2: The Shortlist:**
      *   *Goal:* 3-4 questions, one line each.
      *   *Selection:*
          1.  How do you prevent the professional legislature from gaming the options presented to the council? (The "Menu Manipulation" problem).
          2.  What specific legislative powers must the council hold to prevent being ignored without triggering a constitutional crisis? (The "Teeth" problem).
          3.  Does restricting random citizens to agenda-setting actually reduce donor influence, or just shift it upstream? (The "Lobbying Displacement" problem).
          4.  How do you recruit a random sample that actually shows up and stays engaged without paying them like lobbyists? (The "Participation" problem).
      *   *Refinement:* Make them sharper.
          1.  Can professionals game the menu given to amateurs?
          2.  Does agenda control actually break the donor pipeline or just move it?
          3.  What legal mechanism forces the legislature to vote without breaking the constitution?

  5.  **Drafting Section 3: Why This Order:**
      *   *Goal:* Paragraph per question. Address: Upstream? Answerable by lone writer? Open ground? Conditions for mattering?
      *   *Question 1 (Gaming the Menu):* This is the most critical failure point. If pros write the bills, they write them to fail or succeed based on their interests. *Upstream:* Yes. *Answerable:* Conceptual analysis, historical analogues (rules committees). *Open:* Specific to sortition agenda setters. *Matters:* If they can game it, the system is useless.
      *   *Question 2 (Donor Displacement):* This addresses the user's core motivation. If lobbyists just bribe the agenda council, it fails. *Upstream:* Mid-stream. *Answerable:* Theoretical/Comparative (look at ballot initiatives). *Open:* Most assume agenda = power, but is it *sellable* power? *Matters:* If influence follows the power, the cure is as bad as the disease.
      *   *Question 3 (Constitutional/Procedural Teeth):* The boring stuff that kills utopian ideas. *Upstream:* Downstream (implementation). *Answerable:* Legal research (state constitutions). *Open:* Very open for hybrid models. *Matters:* If it's advisory, it's just a focus group. If it's binding, is it legal?

  6.  **Drafting Section 4: Where I'm Probably Wrong:**
      *   *Goal:* Critique the Agenda Council bias.
      *   *Point 1:* You're assuming the "career politician" problem is primarily about *agenda*, not *drafting/amendment*. Pros can kill a bill in committee or amend it to death even if it reaches the floor.
      *   *Point 2:* You're underestimating the "Staff" problem. Random citizens need expertise. Who provides it? Neutral staff? That's a bureaucracy that can be captured.
      *   *Point 3:* Drop the "Term Limits" comparison. It's a distraction. Term limits increase reliance on staff/lobbyists. Sortition is different. Don't conflate them.

  7.  **Drafting Section 5: What Would Reshuffle the List:**
      *   *Goal:* 1-2 game-changers.
      *   *Idea 1:* Evidence that Citizens' Assemblies (like Ireland/France) actually influenced legislation *without* formal agenda power. If soft power works, hard agenda power might be unnecessary/toxic.
      *   *Idea 2:* Discovery that state constitutions allow this *now* via existing rules committees. If it's legally easy, the essay focus shifts to advocacy. If it requires constitutional conventions, the focus shifts to movement building.

  8.  **Review and Refine:**
      *   *Check Constraints:* One paragraph for state of play? Yes. One line for shortlist? Yes. Paragraph per question in section 3? Yes.
      *   *Tone Check:* Is it encouraging but rigorous? The user wants to write essays that "matter." I need to push them toward mechanism design, not just political philosophy.
      *   *Specific Feedback on the Idea:* The "Agenda Council" is actually a known variation (often called a "Sortition Gatekeeper" or linked to "Agenda Setting Powers"). I need to acknowledge it's not *totally* new but under-explored compared to full sortition houses.
      *   *Refining the "Answerable" aspect:* The user has no data. I need to emphasize conceptual clarity and legal/historical research over empirical modeling.

  9.  **Final Polish:** (Self-Correction during drafting)
      *   *Correction:* In section 3, make sure I explicitly answer "is it answerable by somebody like me."
