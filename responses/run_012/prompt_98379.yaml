answer: |-
  1. **The state of play**
  The debate has moved past "is sortition democratic?" (most theorists agree it is, arguably more than elections) to "how does it interface with existing institutions?" The live disagreement isn't about replacing legislatures entirely, but about hybrid models where random citizens hold specific veto or agenda powers alongside elected officials. The friction point is no longer legitimacy, but *mechanism design*: specifically, whether giving amateurs agenda-setting power actually breaks the grip of money and parties, or if it just creates a new bottleneck that professionals learn to manipulate. Everyone is arguing over the size of the sortition body and its scope, but almost no one is rigorously modeling the interaction between a random agenda council and a professional drafting staff.

  2. **My shortlist**
  *   Can professional legislators game the menu of options presented to a random agenda council?
  *   Does shifting agenda control actually disrupt donor influence or just displace it upstream?
  *   What legal mechanism forces an elected legislature to vote on citizen agenda items without triggering a constitutional crisis?
  *   Who controls the neutral staff that translates citizen priorities into billable text?

  3. **Why this order**
  **Can professionals game the menu?** This is the most upstream question and the one most likely to kill your idea dead. If the Agenda Council picks "Healthcare Reform," but the elected legislature's staff writes the actual bill text that the Council must approve to send to the floor, the professionals can write a poison pill that forces the Council to look incompetent or complicit. This is answerable by you because it doesn't require polling data; it requires game-theory logic and historical analogues (like how House Rules Committees operate). It is open ground because most sortition literature assumes good faith implementation. For your essays to matter, you have to prove there is a procedure where the Council has *meaningful* choice, not just a choice between Option A (written by Lobbyist X) and Option B (written by Lobbyist Y).

  **Does shifting agenda control actually disrupt donor influence?** This addresses your core motivation. You assume the career-politician problem is about what gets voted on, but donors might just shift their spending to influencing the random citizens or the staff that briefs them. This is answerable by looking at ballot initiatives and Citizens' Assemblies (like Ireland's abortion referendum or France's Climate Convention) to see where the money flowed. It is partially chewed over, but not in the context of a *binding* agenda council. For this to matter, you need to establish that agenda-setting is the specific choke point where money exerts the most leverage; if money exerts more leverage during the amendment process (which your council doesn't control), your fix misses the target.

  **What legal mechanism forces an elected legislature to vote?** This is the boring, unglamorous question that determines if your idea is a pamphlet or a policy proposal. In the US system, legislatures generally set their own rules; an external body forcing a vote might violate the "separation of powers" or internal rulemaking clauses in state constitutions. This is highly answerable by a lone researcher reading state constitutions and legislative rules. It is wide open ground because almost all sortition proposals wave their hands at "implementation." For your answer to matter, you need to find a specific procedural vehicle (e.g., a citizen-initiated referendum that triggers a legislative vote rather than a public one) that already exists in some form, proving legality is not a barrier.

  **Who controls the neutral staff?** I put this last because it's a subset of the "gaming the menu" problem, but it deserves its own spotlight. Random citizens cannot write law; they need drafters. If those drafters are career legislative counsel, they belong to the professional class you distrust. If they are hired by the Council, they become a new bureaucracy. This is answerable by comparing how different cities or states handle non-partisan legislative analysis. It is under-explored in sortition literature, which often ignores the bureaucracy. For this to matter, you must demonstrate that "neutral expertise" is not an oxymoron in a polarized environment; otherwise, the staff becomes the real power center.

  4. **Where I'm probably wrong**
  Your Agenda Council idea is quietly assuming that *agenda setting* is the primary source of corruption, but you are likely underestimating the power of the *amendment process*. Even if your Council forces a vote on a bill, elected politicians can amend it on the floor until it is unrecognizable or useless, effectively nullifying the Council's work without technically violating the rule. You are also assuming that "career politicians" are the problem, but in many systems, the real power lies with unelected committee chairs and party whips who would simply treat your Council as a nuisance to be managed. Finally, drop the comparison to term limits. Term limits actually *increase* reliance on lobbyists because legislators lose institutional knowledge; sortition is different because it changes incentives, not just tenure. Conflating them weakens your argument.

  5. **What would reshuffle the list**
  If you discovered that existing "Citizens' Assemblies" (which are advisory) have successfully forced legislative action through public pressure alone (soft power), you should move the "Legal Mechanism" question to the bottom and focus entirely on how to maximize the Council's public visibility and media leverage. Conversely, if you find that state constitutions explicitly forbid external bodies from setting legislative dockets, you must move the "Legal Mechanism" question to the top, because your idea would require a constitutional convention to implement, changing your essays from policy proposals to movement-building manifestos.
