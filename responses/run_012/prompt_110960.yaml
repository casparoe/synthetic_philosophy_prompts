prompt: |-
  I would like your comments on a draft essay. Please be a demanding reader: I want to know where the argument is weak, where it overreaches, and whether the central claim is genuinely interesting or merely a familiar complaint in new clothes. Assume I am writing for readers who already know the method under discussion, so you need not explain it back to me; what I need is an assessment of whether my criticism of it lands.

  Draft essay, provisional title: The Residual Figure: Why the Criteria of Authenticity Cannot Identify Anyone

  1. The method and its promise. The criteria of authenticity are a family of tests used to sort Gospel material into the earlier and the later: the criterion of embarrassment (material that would have embarrassed the early church is unlikely to have been invented); the criterion of dissimilarity (material that cannot be derived either from the Jewish setting or from the church's own interests is privileged); multiple attestation (material appearing in several independent strands is privileged); coherence (material consistent with what has already been accepted); and linguistic tests for a Semitic substratum. The criteria are meant to be applied to small units of tradition and to combine, so that a unit surviving several tests is judged more likely to be authentic and the survivors can be assembled into a portrait of the figure behind the texts.

  2. The familiar objection. It is often said that the criteria are not independent: embarrassment and dissimilarity are both, at bottom, tests of what is anomalous relative to presumed tendencies, and multiple attestation, the one genuinely independent test, probes transmission rather than origin. I grant this, but do not think it decisive, because the tests can be combined through a joint likelihood rather than by multiplying separate ratios, and a joint likelihood need not factor. The real objection, I claim, lies elsewhere.

  3. The residual-figure argument. Every criterion selects for anomaly. A unit passes because it is unlike the surrounding Judaism or unlike the early church's interests — because it is, relative to its context, surprising. But surprise is a relation, not an intrinsic property of the unit, and the relation holds to exactly the context that the method sets aside. Worse, an individual is individuated in part by their engagement with that context: what makes a person that person is a pattern of accepting, resisting, and reshaping the conventions they inherit. Subtract the conventions and the pattern vanishes with them. The method is therefore built to return a figure defined only negatively, by what he was not, and a negatively defined figure cannot be identified with any particular individual: two candidates embedded in the same world, differing only in which of its conventions each happened to defy, would yield the same output. The more successfully the criteria work, the thinner the figure becomes; carried to completion they would leave nothing, since any human being is continuous with their world in more ways than they depart from it.

  4. A repair and its cost. One might try to escape by abandoning unit-level criteria for an inference to the best explanation over whole lives: treat the criteria as likelihoods, place a prior over what a figure of that time and place might plausibly be, and update. But the posterior is then dominated by the prior, and the prior must encode precisely the contextual background the criteria were meant to neutralize. The repair does not escape the problem; it exposes that the method's output is a function of the historian's antecedent imagination of the period, dressed as evidence.

  5. Conclusion. The usual question — whether the criteria are reliable — is the wrong one. Even ideal criteria would answer only what about the figure was unlike his world, which is not the same as who he was.

  Please comment on the following, in order of importance to me. First, is the argument in section 3 sound, or does it prove too much? In particular, can you build the strongest reply on behalf of the method — for instance, that a pattern of engagement with a context is itself detectable and need not be subtracted with the context? Second, is section 4 coherent, or have I conflated a prior's being necessary with its being dominant? Third, is the essay's payoff genuinely different from the familiar complaint in section 2, or have I dressed up the same point in new language? Fourth, would the essay be stronger if it worked through a single criterion in concrete detail rather than treating the family as a whole — and if so, which one? Finally, flag any place where I attribute to the method a commitment its practitioners would not accept.
reasoning: |-
  Here's a thinking process that leads to the critique:

  1.  **Analyze the Request:**
      *   **Task:** Comment on a draft essay titled "The Residual Figure: Why the Criteria of Authenticity Cannot Identify Anyone."
      *   **Role:** Demanding reader. Identify weaknesses, overreaches, and assess the novelty/interest of the central claim.
      *   **Audience:** Readers who already know the method (Historical Jesus studies/Criteria of Authenticity). No need to explain the method.
      *   **Specific Questions to Answer (in order):**
          1.  Is Section 3 sound, or does it prove too much? (Build the strongest reply on behalf of the method).
          2.  Is Section 4 coherent, or does it conflate necessity with dominance regarding priors?
          3.  Is the payoff different from the familiar complaint in Section 2, or just dressed up?
          4.  Would it be stronger with a concrete example (single criterion)? If so, which one?
          5.  Flag any misattributions of commitment to practitioners.

  2.  **Analyze the Draft Essay:**
      *   **Title:** "The Residual Figure..." (Suggests the result is a leftover, not a person).
      *   **Section 1:** Briefly defines the criteria (Embarrassment, Dissimilarity, Multiple Attestation, Coherence, Semitic substratum). Notes the goal: assemble a portrait.
      *   **Section 2:** Acknowledges the "familiar objection" (interdependence of criteria). Dismisses it as not decisive (joint likelihood). Claims the *real* objection lies elsewhere.
      *   **Section 3 (The Core):** "The Residual-Figure Argument." Criteria select for anomaly/surprise relative to context. Surprise is relational. Individuals are defined by engagement with context (accepting/resisting/reshaping). Subtracting context removes the pattern of engagement. Result: A negatively defined figure. Two different people defying different conventions could look the same (residual). Success = thinness. Completion = nothing.
      *   **Section 4:** Proposed repair (Inference to Best Explanation/IBE over whole lives + Priors). Critique: Posterior dominated by prior. Prior encodes the context the criteria meant to neutralize. Result: Historian's imagination dressed as evidence.
      *   **Section 5:** Conclusion. Reliability is the wrong question. Criteria answer "what was unlike," not "who he was."

  3.  **Drafting the Critique - Step-by-Step:**

      *   **Question 1: Section 3 (Soundness & Strongest Reply).**
          *   *Argument:* Criteria isolate the *distinctive*, but a person is *distinctive + typical*. Removing the typical leaves a ghost.
          *   *Strength:* It's a philosophical anthropological point. Identity is relational.
          *   *Weakness/Overreach:* Does it prove *no one* can be identified, or just that the *method* fails? The prompt asks if it proves too much. If I apply this to Napoleon, do I lose Napoleon? No, because we have secular records. The argument is specific to the *textual situation* of the Gospels (where context is reconstructed from the same texts).
          *   *Strongest Reply for the Method:* Practitioners don't actually subtract the context entirely. They use "Double Dissimilarity" (mostly outdated) but rely heavily on *Coherence* and *Plausibility* (contextual credibility). The "pattern of engagement" *is* detectable if you stop looking for atomic units and look for trajectories. The method aims to find the *edges* of the figure, assuming the center is filled by general historical knowledge of 1st-century Judaism. The critique assumes the method tries to build the *whole* person from scratch using only anomalies. Most historians use the criteria to find the *secure points* and then fill in the rest with historical imagination (which Section 4 attacks).
          *   *Verdict:* Sound in principle, but risks being a strawman if it assumes the method claims to generate a *full* portrait solely from residuals. It attacks the "minimalist" outcome of the method, not necessarily the historian's final product.

      *   **Question 2: Section 4 (Coherence & Priors).**
          *   *Argument:* Switching to IBE/Bayesian approach makes the Prior dominant.
          *   *Analysis:* In Bayesian terms, if data is weak (which Section 3 argues), the Prior *should* be dominant. Is this a bug or a feature? The author calls it a cost ("historian's imagination... dressed as evidence").
          *   *Conflation?* Necessity vs. Dominance. Yes, there's a slight conflation. A prior is *necessary* for any historical reconstruction. The critique is that it becomes *dominant* to the point of determining the outcome.
          *   *Refinement:* The argument is coherent but needs to clarify that *all* history uses priors. The specific charge here is that the Criteria pretend to *eliminate* the need for strong priors (by being "objective tests"), but when they fail (per Section 3), we are forced back to priors, revealing the objectivity was illusory.
          *   *Verdict:* Coherent, but needs to acknowledge that the "repair" is actually just standard historical practice, and the critique is really about the *epistemic humility* of the Criteria vs. the honesty of IBE.

      *   **Question 3: Payoff vs. Familiar Complaint (Section 2).**
          *   *Section 2:* Criteria aren't independent / Multiple attestation is about transmission.
          *   *Section 3:* Criteria isolate anomaly, destroying the person (anthropological/ontological critique).
          *   *Distinction:* Section 2 is technical/statistical (independence of variables). Section 3 is philosophical/anthropological (nature of identity).
          *   *Verdict:* It is genuinely different. Section 2 says "the math is wrong." Section 3 says "even if the math is right, the result isn't a person." This is the strongest part of the essay. It moves from methodological critique to ontological critique.

      *   **Question 4: Concrete Detail.**
          *   *Current State:* Abstract.
          *   *Suggestion:* Yes, it would be stronger. Abstract arguments allow practitioners to say "we don't actually do that."
          *   *Which Criterion?* **Criterion of Dissimilarity.** It is the clearest example of "selecting for anomaly." It's also the most controversial and the one most prone to creating the "residual figure."
          *   *Example:* Jesus' use of "Abba." Dissimilar to Judaism? Maybe. Dissimilar to Church? Maybe. But does knowing he said "Abba" tell us *who* he was, or just that he wasn't a typical Pharisee or a later Greek theologian? It illustrates the "thinness" perfectly.

      *   **Question 5: Misattributions.**
          *   *Commitment:* "The survivors can be assembled into a portrait."
          *   *Reality:* Many modern practitioners (e.g., Chris Keith, Anthony Le Donne) argue the Criteria are fundamentally flawed and have moved to "Social Memory" approaches. The "Third Quest" (e.g., N.T. Wright) emphasizes *Plausibility* and *Coherence* over *Dissimilarity*.
          *   *Risk:* The essay attacks the "Old Quest" or "Second Quest" (Bultmann/Käsemann) usage of Dissimilarity. If the target is contemporary scholarship, the target is moving. The essay needs to specify *which* iteration of the method it is attacking. If it's the classic formulation, it's fine. If it claims this is how *current* scholars work, it might be outdated.
          *   *Specific Point:* Section 1 says "The criteria are meant to... combine... and the survivors can be assembled into a portrait." Many practitioners would say the criteria identify *authentic units*, but the *portrait* requires narrative synthesis that goes *beyond* the criteria. The essay implies the method *itself* promises the portrait.

  4.  **Synthesizing and Refining the Tone:**
      *   Tone: Demanding, rigorous, respectful but critical.
      *   Structure: Follow the user's five requested points in order.
      *   Key Insight to highlight: The distinction between "mathematical independence" (Sec 2) and "ontological viability" (Sec 3) is the essay's unique contribution.
      *   Key Weakness to highlight: The essay risks attacking a strawman of "maximalist" usage of the criteria, whereas sophisticated users treat them as heuristic tools, not algorithmic generators of history.

  5.  **Final Polish (Self-Correction during drafting):**
      *   *Check:* Did I answer the "prove too much" question? I need to be clear. If the argument applies to *any* historical figure where sources are biased, it proves too much. If it applies specifically to the *Criteria's mechanism* of isolation, it's sound. I should argue it's sound regarding the *method*, not history in general.
      *   *Check:* Section 4. Make sure to distinguish between "Prior is necessary" (true) and "Prior dominates because data is nullified by Section 3" (the actual argument).
      *   *Check:* Misattribution. Be specific about the "Third Quest" shift toward Contextual Credibility.

  6.  **Final Output Generation** (Proceed to write the response based on these thoughts).
answer: |-
  Here is an assessment of your draft, addressing your five points in order.

  ### 1. Section 3: Soundness and the Strongest Reply
  **Is the argument sound?**
  The core intuition in Section 3 is philosophically robust: identity is constituted by relation to a context, not merely by deviation from it. To define a figure solely by *deviation* is to produce a silhouette, not a substance. This is a stronger critique than the standard statistical objections because it attacks the *ontological viability* of the result, not just the *mechanical reliability* of the tool.

  **Does it prove too much?**
  It risks proving too much if you imply this applies to *all* historical reconstruction. We identify Napoleon or Cicero through sources that are also biased and contextual, yet we do not conclude they are "residual figures." The difference, which you should make explicit, is that for most figures we have external controls (archaeology, opposing accounts, secular records) that allow us to reconstruct the *context* independently of the *subject*. In Historical Jesus studies, the Gospels are often the primary evidence for *both* the figure and the context. When the method subtracts the "contextual" material from the "authentic" material, it is often subtracting the very data used to reconstruct the context, creating a circular thinning.

  **The Strongest Reply on Behalf of the Method:**
  A sophisticated practitioner would argue that you are attacking a caricature of how the criteria are synthesized. They would claim:
  1.  **The Criteria are Negative Controls, not Positive Generators:** The criteria are not meant to build the whole portrait from scratch (which would indeed yield a ghost). They are meant to secure *anchor points*. The "flesh" of the figure is filled in by "Contextual Credibility" (material that *fits* the time and place), which you mention only in passing in Section 1.
  2.  **Pattern Recognition:** A pattern of engagement *is* detectable. If a figure consistently challenges purity laws but upholds Sabbath observance, that specific *configuration* of deviation and conformity is a positive fingerprint, not just a negative residue. The "Residual Figure" argument assumes the output is a list of unrelated anomalies. If the anomalies cohere into a *consistent strategy* of engagement, that strategy constitutes a positive identity.

  **Recommendation:** To bulletproof Section 3, acknowledge that the criteria are often used to secure anchors, but insist that when the *assembly* of those anchors relies on the *exclusion* of contextual material (as per the Criterion of Dissimilarity), the resulting narrative lacks the connective tissue of motive. A list of "things Jesus did that were surprising" is not a "life."

  ### 2. Section 4: Coherence and Priors
  **Is the section coherent?**
  Yes, but it teeters on the edge of the conflation you suspect. You write: *"The posterior is then dominated by the prior... The repair does not escape the problem; it exposes that the method's output is a function of the historian's antecedent imagination."*

  **The Nuance:**
  You must distinguish between a prior being *dominant* (overwhelming the data) and a prior being *determinative* (creating the data).
  *   **Necessity:** All historical reasoning requires priors (e.g., "Prophets usually speak in poetry," "Executed criminals rarely have royal funerals").
  *   **Dominance:** If the data is as thin as Section 3 suggests, the prior *will* dominate.
  *   **The Critique:** The problem isn't that the prior dominates; it's that the Criteria of Authenticity claim to *minimize* the role of the prior (by offering "objective" tests). Section 4 successfully argues that abandoning the Criteria for IBE merely admits what was always true: the historian's imagination is the engine.

  **Recommendation:** Clarify that the "cost" is not the use of a prior, but the *unmasking* of the method's claim to objectivity. The "repair" is actually just standard historical practice; the essay's point is that the Criteria were an attempt to bypass standard historical practice, and Section 3 shows why that bypass fails.

  ### 3. Payoff vs. Familiar Complaint
  **Is this genuinely different from Section 2?**
  **Yes.** This is the essay's strongest asset.
  *   **Section 2 (Familiar Complaint):** Deals with *independence* and *probability*. It argues the math doesn't work (e.g., Dissimilarity and Embarrassment correlate). A defender can say, "We use joint likelihood, not multiplication," and move on.
  *   **Section 3 (Your Argument):** Deals with *identity* and *anthropology*. It argues that even if the math *did* work perfectly, the result is not a human being.

  **Verdict:** This distinction is vital. Do not let Section 2 overshadow Section 3. The familiar complaint says, "You can't trust the results." Your complaint says, "The results, even if trusted, are category errors." Make sure the transition from 2 to 3 emphasizes this shift from *epistemic reliability* to *ontological adequacy*.

  ### 4. Concrete Detail
  **Would it be stronger with a single criterion?**
  **Yes.** Abstract arguments allow practitioners to retreat to "We don't use it that way anymore." Concrete examples force them to engage the mechanism.

  **Which One?**
  **The Criterion of Dissimilarity.**
  It is the clearest engine of the "Residual Figure."
  *   **Concrete Application:** Take the "Abba" argument (Jeremias). Jesus called God "Abba." This was dissimilar to later church liturgy (Greek *Pater*) and allegedly dissimilar to contemporary Jewish prayer.
  *   **The Trap:** If you isolate "Abba" via dissimilarity, you have a data point. But does "Abba" identify *who* Jesus was? Or does it only identify that he was *not* a later Greek theologian and *not* a typical Pharisee?
  *   **The Residual:** If you strip away the Jewish context of prayer to isolate the "unique" usage, you strip away the *meaning* of the usage. You are left with a word, not a relationship. This perfectly illustrates your Section 3 argument: the relation (surprise) remains, but the substance (the piety) is lost.

  **Recommendation:** Insert a paragraph in Section 3 analyzing "Abba" or the "Temple Cleansing." Show how the criterion successfully isolates the event as "authentic" but fails to tell us *why* he did it, because the "why" resides in the contextual material the criterion just discarded.

  ### 5. Misattributions of Commitment
  **Where do you attribute commitments practitioners might reject?**
  1.  **"The survivors can be assembled into a portrait." (Section 1)**
      *   **Critique:** Many modern practitioners (especially in the "Third Quest" and Social Memory approaches) would deny that the criteria *assemble* the portrait. They argue the criteria identify *atoms*, but the *narrative* is constructed via historical imagination (which you attack in Section 4). They would say you are conflating the *tool* with the *construction*.
      *   **Fix:** Acknowledge that sophisticated users treat the criteria as *constraints* on imagination, not *generators* of history. Your argument then becomes: "Even as constraints, they constrain us toward a ghost."

  2.  **"The method is therefore built to return a figure defined only negatively." (Section 3)**
      *   **Critique:** Proponents of the **Criterion of Coherence** would object. Coherence explicitly builds on material that *fits* the context. They would argue the method isn't *only* negative.
      *   **Fix:** Argue that Coherence is parasitic. It can only operate *after* Dissimilarity/Embarrassment has secured the initial "authentic" core. If the core is a negative residual (per your argument), then the Coherence built upon it is coherence with a ghost.

  3.  **Target Audience:**
      *   **Critique:** A significant number of contemporary scholars (e.g., Chris Keith, Anthony Le Donne) have already abandoned the Criteria entirely in favor of Social Memory Theory.
      *   **Fix:** Specify in the introduction that you are critiquing the **Classic Formulation** (Bultmann/Käsemann/Meier) which still undergirds much popular and semi-technical discourse. Don't let the reader think you are fighting a ghost yourself; acknowledge the method is embattled but persists.

  ### Summary Assessment
  **Is the central claim interesting?**
  Yes. The move from "The criteria are statistically flawed" to "The criteria are anthropologically impossible" is a genuine contribution. It reframes the debate from *probability* to *personhood*.

  **Primary Risk:**
  The essay currently assumes a "Maximalist" use of the Criteria (that they generate the history). Most defenders use them "Minimalist" (they secure only the indisputable). You need to argue that even the Minimalist use yields a figure too thin to be historically useful, or that the Minimalist core is inevitably expanded by the Priors (Section 4), returning us to the problem.

  **Final Advice:**
  Tighten Section 4 to avoid the Bayesian conflation. Add the concrete example to Section 3. Clarify that you are attacking the *Classic* formulation, even if some have moved on, because its logic still haunts the field. If you do this, the essay lands.
