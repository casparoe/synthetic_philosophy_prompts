answer: |-
  This is an impressively high-level Thanksgiving argument. Your family basically reenacted a significant chunk of late-20th-century political philosophy, specifically the debate surrounding Derek Parfit's famous essay *Equality or Priority?* (1991).

  You are correct that this is about the **Leveling Down Objection (LDO)**. To give you the verdict, I need to distinguish between three views they are mixing together:
  1.  **Telic Egalitarianism:** Equality is good *in itself*, even if it makes no one better off. (Vulnerable to LDO).
  2.  **Deontological Egalitarianism:** Inequality is bad because it involves unfairness or rights violations, not because the "pattern" of numbers is ugly. (Less vulnerable to LDO).
  3.  **Prioritarianism:** Benefits matter more the worse off the person is. We care about absolute well-being, weighted by priority, not the gap between people. (Not vulnerable to LDO).

  Here is the breakdown of who was right on each point, followed by the answers to your specific questions.

  ### Point-by-Point Analysis

  **1. BIL:** *The objection only bites if you assume a change has to be good for some particular person... Parfit threw out that assumption, so egalitarians shouldn't be forced to accept it either.*
  *   **Verdict:** **Mostly Wrong / Confused.**
  *   **Why:** Your brother-in-law has the logic backward. The Leveling Down Objection *only works* if you **reject** the assumption that a change must be good for a particular person (the "Person-Affecting View").
      *   If you believe an outcome can only be "better" if it is better *for someone*, then leveling down (where no one gains) cannot be better.
      *   Parfit argued that **Telic Egalitarians** (those who think equality is intrinsically good) *must* reject the Person-Affecting View to make sense of their theory. But by rejecting it, they open themselves up to the absurdity of Leveling Down.
      *   Parfit didn't "throw out the assumption" to save egalitarianism; he pointed out that egalitarianism requires throwing it out, which leads to absurd results.

  **2. Cousin:** *If "nobody is better off" isn't a reason to think the cut made things worse, I don't see how it's a reason to think it made things better.*
  *   **Verdict:** **Right.**
  *   **Why:** This is the core intuition of the Leveling Down Objection. If a change makes some people worse off and nobody better off, in what sense is the world "improved"? The only answer an Egalitarian can give is "The pattern is more equal." The Cousin is correctly identifying that this implies equality is a value detached from human welfare, which seems cold and implausible.

  **3. BIL:** *His view (Priority View) doesn't care about gaps... it just says a benefit to someone worse off counts for more... by that view you obviously don't cut the program, since the cut benefits no one.*
  *   **Verdict:** **Right.**
  *   **Why:** This is the correct definition of Prioritarianism. Prioritarianism is not about equality; it is about weighted well-being. Since cutting the gifted program harms the gifted kids and helps no one (assuming no resources are redirected to the struggling kids, as per your description), a Prioritarian would oppose the cut. The "gap" shrinking is irrelevant to a Prioritarian unless it results from raising the bottom up.

  **4. Cousin:** *Then it's strange he talks about inequality like it's the problem, and that his view has its own version of the same disease: it'll happily make the badly off a tiny bit better off by making the well off a lot worse off.*
  *   **Verdict:** **Right on the critique, Wrong on the label.**
  *   **Why:** The Cousin correctly identifies a major weakness of Prioritarianism, but it isn't "Leveling Down." It is often called the **"Problem of Heavy Weights"** or **"Excessive Sacrifice."**
      *   If the "priority weight" for the poor is high enough, Prioritarianism *would* endorse destroying a huge amount of wealth from the rich to give a trivial amount to the poor.
      *   This is distinct from Leveling Down because *someone* does gain (the poor), whereas Leveling Down requires *no one* to gain. But the intuition is similar: why sacrifice total welfare for distributional concerns?

  **5. BIL:** *That isn't leveling down, because somebody does gain... it'll only prefer a lopsided trade... if the small gain... is worth more than the big loss.*
  *   **Verdict:** **Right.**
  *   **Why:** He is technically correct about the definition. Leveling Down requires that *no one* is better off. If the poor gain even a penny, it isn't Leveling Down. He is also right that Prioritarianism is a "weighing view." It is supposed to trade off losses and gains. However, he is glossing over the Cousin's point: if the weights are "reasonable," would they really justify destroying a middle-class life to give a penniless person a single extra meal? Many philosophers think not.

  **6. Cousin:** *She'd drop the name-calling but not the point.*
  *   **Verdict:** **Fair.**
  *   **Why:** She acknowledges that while Prioritarianism escapes the technical definition of Leveling Down, it still faces a structurally similar problem (valuing distribution over total welfare).

  ---

  ### The Big Questions

  #### 1. Does the Leveling Down Objection work against Egalitarianism, Prioritarianism, both, or neither?
  *   **Against Telic Egalitarianism:** **Yes, it works.** This is the standard philosophical consensus. If you believe equality is good *in itself* (Telic), you must admit that a world where everyone is blind is, in one respect, better than a world where half are blind and half can see (because it is more equal). Most people find this conclusion absurd, so Telic Egalitarianism is widely considered refuted or in need of major repair.
  *   **Against Prioritarianism:** **No, it does not work.** By definition, Prioritarianism requires someone to benefit. It is immune to Leveling Down.
  *   **Against Deontological Egalitarianism:** **No, it does not work.** If you argue that inequality is bad because it violates rights or fairness (not because the outcome pattern is ugly), you don't care about "leveling down" because leveling down would likely violate rights or fairness too.

  #### 2. Is there any version of the case where his view (Prioritarianism) says "Make everyone worse off, that's an improvement"?
  *   **No.** This is the key advantage of Prioritarianism over Telic Egalitarianism.
  *   A Telic Egalitarian *must* say that making everyone worse off (to achieve equality) is, in at least one respect, an improvement.
  *   A Prioritarian *cannot* say this. Since Prioritarianism values benefits, a scenario where everyone loses utility is always worse than a scenario where everyone keeps their utility, all else being equal.
  *   **However:** As your cousin pointed out in Point 4, Prioritarianism *can* say "Make the rich *much* worse off to make the poor *slightly* better off." It will never say "Make *everyone* worse off," but it might say "Destroy more value than you create" if the value is created for the right people.

  ### What Both of Them Are Missing

  **1. The Instrumental Defense (The Superintendent's Actual View)**
  Both of them are arguing about *intrinsic* value (is equality good in itself?). They missed the most likely real-world explanation: **Instrumental Egalitarianism.**
  The Superintendent likely doesn't care about equality for moral reasons. They likely believe that shrinking the gap *causes* other good things (social cohesion, less crime, better long-term economic growth).
  *   **The Missed Point:** If the gap shrinking is a *means* to a better outcome for everyone later, then the Leveling Down Objection doesn't apply, because eventually, somebody *does* benefit. The argument should have been about whether cutting the program actually achieves those long-term benefits, not about abstract moral theory.

  **2. The Distinction Between "Telic" and "Deontological"**
  Your BIL defended Prioritarianism, but he started by trying to defend "Egalitarians."
  *   If the Cousin is attacking **Telic Egalitarianism** (Equality is a goal), she wins. The Leveling Down Objection is fatal to this view.
  *   If the Cousin is attacking **Deontological Egalitarianism** (Equality is a requirement of justice), the LDO misses. Justice isn't about "outcomes" that can be leveled down; it's about how people are treated.
  *   Your BIL switched to **Prioritarianism** halfway through. This saved him from the LDO, but exposed him to the "Excessive Sacrifice" objection.

  ### Summary Verdict
  *   **The Cousin** won the argument on the **Leveling Down Objection**. She correctly identified that a theory claiming the world improves when no one benefits is counter-intuitive.
  *   **The Brother-in-Law** won the argument on the **Definition of Prioritarianism**. He correctly noted that his view doesn't mandate leveling down.
  *   **The Philosophical Reality:** The Leveling Down Objection is generally considered a successful refutation of **Telic Egalitarianism**. However, **Prioritarianism** (the BIL's view) is the standard alternative proposed to save the intuition that we should help the poor without accepting the absurdity of leveling down. The Cousin is right to be suspicious of Prioritarianism, but her objection there is about "Aggregation/Sacrifice," not "Leveling Down."

  If you want to settle the bet: Tell them the Superintendent is probably an **Instrumental Egalitarian**, the Cousin successfully refuted **Telic Egalitarianism**, and the BIL is correctly describing **Prioritarianism** but needs to answer for why we should accept huge losses for tiny gains.
