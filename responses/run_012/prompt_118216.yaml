      *   Keep it accessible.

      *(Self-Correction)*: Wait, let me double check Parfit's "Priority View." In *Equality or Priority?*, Parfit argues that the Priority View does *not* essentially involve the Person-Affecting View, but it avoids LDO because it values benefits, not relations. Okay, I need to be precise. The Priority View says: *Benefits* matter more when people are worse off. It doesn't care about the *gap*. So LDO doesn't apply because LDO involves no benefits.
      BIL's Point 1 claim: "The objection only bites if you assume a change has to be good for some particular person... and that the guy who came up with the priority view (Parfit?) threw out that assumption, so egalitarians shouldn't be forced to accept it either."
      *Critique:* This is confused. If you throw out the assumption (i.e., accept the Impersonal View), LDO *bites harder*. LDO says "Equality is good even if no one benefits." That *requires* the Impersonal View. If you hold the Person-Affecting View, LDO doesn't work. So BIL has the logic reversed. I will point this out.

