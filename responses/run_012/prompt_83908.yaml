answer: |-
  **Activity: The Unwilling Market**

  **Setup & Materials**
  Divide 18 students into three groups of six. Each group is a distinct market.
  *   **Asset:** Pays $100 if State H, $0 if State L. Common prior: 50/50.
  *   **Signals:** Private cards drawn from urns biased toward the true state (e.g., State H urn has 4 Red/1 Blue cards).
  *   **Scoring:** Points = Final Cash + Asset Value. Highest score wins.
  *   **Materials:** Signal cards, order sheets, projector, calculators.

  **Rounds & Rules**
  1.  **Hidden Flow (15 min):** Students draw signals. Submit buy/sell limit prices privately to the instructor. Matches execute anonymously. *Expectation:* Trade occurs; students trust signals over counterparty inference.
  2.  **Mutual Knowledge (15 min):** Students draw signals. Order book (all limits) is printed on sheets and distributed silently. Everyone sees the book, but no one knows if others are analyzing it. *Expectation:* Trade decreases as students suspect informed counterparts.
  3.  **Common Knowledge (20 min):** Students draw signals. Order book is projected. Instructor leads a confirmation chain: "Does everyone see this?" "Yes." "Does everyone know everyone sees this?" "Yes." Explicitly state: "Everyone knows everyone is rational." *Expectation:* Market unravels. Willingness to sell at $P$ signals belief that Value < $P$. Buyers update downward; sellers realize buyers updated; no trade.
  4.  **Risk Control (20 min):** No private signals. Common prior remains. Half endowed with 10 shares, half with $1000 cash. Utility cards assign different risk aversion levels (points penalize high variance). *Expectation:* Trade resumes. Differences in risk tolerance, not belief, drive exchange.

  **Timeline (90 Minutes)**
  *   **0–10:** Instructions & Common Prior verification.
  *   **10–25:** Rounds 1 & 2 (Hidden & Mutual).
  *   **25–45:** Round 3 (Common Knowledge).
  *   **45–65:** Round 4 (Risk Control).
  *   **65–90:** Debrief.

  **Debrief**
  Map Round 3's emptiness to the theorem's engine. Ask: "Why did you withdraw your offer?" Students should articulate that a counterparty's willingness to trade conveyed private information. If we share a prior and know each other to be rational, I cannot profit from you unless I know something you don't. But if you are willing to trade, you reveal you know something I don't. Once that evidence is processed, the speculative gain vanishes.

  Contrast Round 2 and 3 to highlight the knowledge gap. In Round 2, you saw the book but doubted others' attention, leaving room for doubt about their updates. In Round 3, the confirmation chain made rationality and visibility common knowledge, forcing the Bayesian unraveling to completion.

  Contrast Round 3 and 4 to clarify the theorem's scope. Round 3 forbids trade based *solely* on belief differences (speculation). Round 4 permits trade based on risk-sharing (hedging). The theorem does not ban trade; it bans speculative trade among rational agents with common priors.

  **Troubleshooting**
  *   **Predictable Failure:** Students will trade in Round 3. They treat counterparts as noise traders rather than rational agents.
  *   **Fix:** Pause the round. Ask a buyer: "Why is she selling at $60?" If they say "She needs cash," remind them: "In this model, she is rational and maximizes points like you." Force them to update their belief about the asset value based solely on the offer. Repeat until offers withdraw.
  *   **Confusion:** Students may struggle with Bayesian updates. Provide a cheat sheet: "If Signal is Red, Prob(H) = 0.8." Keep math minimal; focus on the directional update.

  **Limitations**
  *   **The Missing Feature:** Noise. The activity assumes pure speculation among rational agents. Real markets persist because of liquidity traders, noise traders, or disagreement about priors (heterogeneous priors). You must supply this context verbally. The theorem explains why *purely informational* trade collapses, not why real markets function. Real markets function because not everyone is playing this game; some trade for exogenous reasons (consumption, hedging external risks), which restores the liquidity this activity removes. Acknowledge that the "empty market" is a theoretical baseline, not an empirical prediction of zero volume.

  **Note on Efficiency**
  Ensure students understand the market starts in efficient equilibrium (Round 1 prices reflect aggregate info). The theorem argues no *new* trade should occur after information revelation if structure is common knowledge. The activity simulates the post-revelation static.
