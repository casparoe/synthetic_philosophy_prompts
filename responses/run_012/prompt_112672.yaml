prompt: |-
  I've been messing around with Nomic — Peter Suber's game where the rules get changed by moves made inside the game, some rules start out immutable, a judge rules on whether a move is legal and the players can vote to overturn him, and the rule that says how to change rules is itself changeable. My day job is bootstrapped compilers: stage0 building stage1, self-hosting toolchains, meta-circular interpreters, fixed points. Restate Nomic to me in that vocabulary as faithfully as you can — what's the kernel and what's user-level code, what plays the role of the fixed point, what's the eval that carries out a rule change, where does the judge sit — and then give me the residue report: which bits have no counterpart at all (my hunch is the whole authority business doesn't, a program doesnt have authority over its own semantics, it just has behavior), which bits only go through with a fudge, and does the leftover mean my picture is missing something or that Nomic's self-amendment paradoxes are shallower than they look? Specifically, the reason self-hosting works is stratification — the old compiler checks the new one, and only afterwards does the new one take over — so does that same move dissolve the paradox of amending the amendment rule, or does Nomic need something a compiler can't give it?
