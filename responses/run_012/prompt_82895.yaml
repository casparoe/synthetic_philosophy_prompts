  At half a minute before the hour
  The switch is thrown to make it bright.
  At quarter past the half, the power
  Is cut again to make it night.
  Each interval divides the room,
  And leaves undefined the state.

  The needle sets to minus one,
  Then positive one-half stays.
  The swing shrinks down with every run,
  Through diminishing displays.

  The bulb responds to every sign.
  The needle marks a shrinking line.
  Noon arrives without design.

  No last click defines the state.
  The needle rests by rule alone.

  The values narrow to a point unclaimed.

  Assume continuity, and the reading is zero.
