      *   **Structure:**
          *   Stanza 1 (6 lines): Lamp.
          *   Stanza 2 (4 lines): Dial.
          *   Stanza 3 (3 lines): Alternating (Lamp/Dial mix).
          *   Stanza 4 (2 lines): Alternating (tighter).
          *   Stanza 5 (1 line): Inside the Dial.
          *   Closing Line (1 line, standing apart): The Dial's answer (zero), sounding purchased/stipulated.
          *   Total shape: Shortening stanzas (6, 4, 3, 2, 1 + 1).
      *   **Constraints:**
          *   Lamp Rhyme/Word: A specific word or rhyme in Stanza 1 must reappear in Stanza 4, never rhyming with anything else (isolated). Represents the missing last toggle.
          *   Dial's End: The final line must be the Dial's answer (zero), stated as a fact but sounding like a supplied clause. Last word belongs to the Dial.
          *   Tone: Dry, exact. No sublime infinity gestures. No Zeno references.
          *   Accuracy: Nothing happens at noon. Lamp undefined. Dial undefined without continuity clause. Dial converges to 0 *if* clause added.
          *   Pacing: Shortening lines/stanzas mimic the acceleration ($1/2, 1/4, 1/8...$).

