answer: |-
  This is an exceptionally sharp set of problems. You have independently reconstructed the three most famous counterexamples in the literature (finks, masks, mimics) and then pushed beyond them into areas (intrinsic prevention, higher-order dispositions, collective agency) that currently occupy professional metaphysicians. You do not need protection from the technicalities; you need a map of the terrain.

  Below is the specification list you requested. I have organized these as **Desiderata**. For each, I state the requirement, the case that forces it, why failure is unacceptable, and my judgment on whether it is non-negotiable or a matter of metaphysical camp.

  ### The Desiderata for a Theory of Dispositions

  #### 1. Extensional Adequacy (The Truth-Condition Requirement)
  *   **The Requirement:** The theory must assign the correct truth value to disposition claims in standard and non-standard scenarios. If the glass is fragile, the theory must say "True"; if the sturdy glass with a firecracker is fragile, the theory must say "False."
  *   **Forcing Case:** The **Firecracker Mimic**. A sturdy glass breaks when struck because of an explosive rig, not because of its structure.
  *   **Why Unacceptable:** A theory that calls the rigged glass "fragile" fails its primary function: to describe the world. If the theory cannot distinguish between breaking *because of fragility* and breaking *because of a bomb*, it is not a theory of fragility; it is a theory of breaking events. It loses its predictive and explanatory utility.
  *   **Status:** **Non-negotiable.** Any theory that fails this is simply wrong about the facts.

  #### 2. Interference Immunity (The Fink/Mask Requirement)
  *   **The Requirement:** The theory must distinguish between the *loss* of a disposition and the *prevention* of its manifestation. An object can retain a disposition even if something stops it from manifesting, or loses it even if it never gets the chance to manifest.
  *   **Forcing Case:** The **Guardian Angel Fink** (angel makes glass unbreakable upon strike) and the **Foam Mask** (foam prevents breaking).
  *   **Why Unacceptable:** If a theory defines fragility simply as "breaks when struck," the Fink case forces us to say the glass was never fragile (false negative), and the Mask case forces us to say the foam-swaddled glass isn't fragile (false negative). This severs the link between what an object *is* and what it *does*. We need to know the glass is fragile so we know not to remove the foam.
  *   **Status:** **Non-negotiable.** This is the minimum bar for distinguishing dispositions from mere regularities.

  #### 3. Intrinsic Grounding (The Constitution Requirement)
  *   **The Requirement:** The theory must explain the disposition in terms of the object's internal constitution, such that the disposition travels with the object unless the constitution changes.
  *   **Forcing Case:** Your **Smart Glass Case 1** (Internal stiffening network).
  *   **Why Unacceptable:** If the theory relies solely on external behavior, it cannot distinguish your Smart Glass from ordinary glass wrapped in foam. But the Smart Glass's prevention is *internal*. If the theory says this glass is fragile because it *looks* like glass, it ignores the internal network. If it says it isn't fragile because it doesn't break, it ignores that the network is a *disposition to stiffen*. A theory must tell us whether the interaction of two internal dispositions (fragility of silica, stiffening of network) cancels out the fragility of the whole. Without this, we cannot engineer materials.
  *   **Status:** **Non-negotiable for physical objects.** (See Trade-off below regarding collectives).

  #### 4. Temporal Coherence (The Higher-Order Requirement)
  *   **The Requirement:** The theory must distinguish between having a disposition now and having a disposition to *acquire* a disposition later, without collapsing the two into the same state.
  *   **Forcing Case:** Your **Sun-Dried Board Case 2**.
  *   **Why Unacceptable:** If "disposed to become fragile" is treated the same as "fragile," we lose the ability to plan. The board is safe to handle *now*. A theory that conflates current powers with future potential powers renders all risk assessment impossible. It must account for the *latency* of the property.
  *   **Status:** **Non-negotiable.** This is a requirement of logic and time.

  #### 5. Mereological Coherence (The Collective Requirement)
  *   **The Requirement:** The theory must provide clear criteria for when a whole (a crowd, a machine, an organism) has a disposition that is not simply the sum of the dispositions of its parts.
  *   **Forcing Case:** Your **Stampeding Crowd Case 3**.
  *   **Why Unacceptable:** If the theory says only fundamental particles have dispositions, we cannot speak meaningfully of sociology, biology, or engineering. If the theory says *any* group has dispositions, we risk attributing agency to piles of sand. We need a rule for when emergence is real. If the theory cannot handle the crowd, it is too narrow for ordinary language and science.
  *   **Status:** **Negotiable (Camp Commitment).** A "Fundamentalist" might deny crowds have real dispositions (they are just shorthand for individual actions). A "Realist" will insist they do. You must choose which ontology you prefer.

  #### 6. Non-Circularity (The Analysis Requirement)
  *   **The Requirement:** The theory should define dispositions using terms that do not themselves presuppose dispositions (e.g., defining "fragile" without using "would break" or "capacity").
  *   **Forcing Case:** All **Fink/Mask** solutions.
  *   **Why Unacceptable:** To solve the Fink case, most theories add a clause: "The glass breaks when struck *in normal conditions*." But "normal conditions" usually means "conditions where nothing interferes with the fragility." This defines fragility using fragility. If the theory is circular, it offers no analysis; it just renames the mystery.
  *   **Status:** **Negotiable (Camp Commitment).** Some camps (Dispositional Essentialists) argue circularity is fine because dispositions are fundamental. Others (Reductive Physicalists) demand non-circularity.

  #### 7. Causal Relevance (The Explanation Requirement)
  *   **The Requirement:** The disposition must do some work in explaining why the manifestation occurred. It cannot be a mere label for what happened.
  *   **Forcing Case:** The **Firecracker Mimic** again.
  *   **Why Unacceptable:** If "fragility" is just a summary of "it broke," it doesn't explain the breaking. We need to know *why* it broke to prevent it next time. If the disposition is epiphenomenal (a shadow of the physical base), it is useless for explanation.
  *   **Status:** **Non-negotiable for utility.** If you only care about prediction, you might drop this. If you care about *understanding*, you must keep it.

  ---

  ### Judgment on Negotiability

  *   **Non-Negotiable:** Extensional Adequacy, Interference Immunity, Temporal Coherence. If a theory fails these, it yields false statements about the world.
  *   **Camp Commitments:** Mereological Coherence (do crowds exist?), Non-Circularity (are dispositions fundamental?), Causal Relevance (do dispositions add to physics?). You can build a consistent theory that rejects these, but it will be less useful for ordinary language.

  ---

  ### The Single Requirement Doing the Most Work

  **Interference Immunity (Requirement 2).**

  This is the hammer that breaks the "Simple Counterfactual" view (the idea that *fragile* just means *if struck, it would break*).
  *   **Why:** It forces the theory to look *inside* the object or *around* the context. It kills the idea that dispositions are just patterns of events. It demands that the theory posit some *property* or *state* that persists even when the event does not happen. Almost every sophisticated theory of dispositions exists solely to satisfy this one requirement.

  ---

  ### The Jointly Unsatisfiable Pair (The Trade-Off)

  You asked if any two requirements cannot be satisfied at the same time. There is a deep tension between **Intrinsic Grounding (3)** and **Mereological Coherence (5)**.

  *   **The Conflict:**
      *   **Intrinsic Grounding** demands that a disposition be grounded in the internal physical structure of the bearer. (The glass is fragile because of its silica bonds).
      *   **Mereological Coherence** demands that the Crowd have a real disposition to stampede, even though no individual has it.
      *   **The Problem:** A crowd does not have an "internal physical structure" distinct from the spatial relations of its members. Its "structure" is extrinsic and relational.
      *   **The Choice:**
          1.  If you insist on **Strict Intrinsic Grounding**, you must deny that the Crowd has a real disposition (it's just a figure of speech for individual actions). You save metaphysical purity but lose social explanation.
          2.  If you insist on **Mereological Coherence**, you must allow dispositions to be grounded in *relations* and *contexts*, not just internal constitution. You save social explanation but complicate the metaphysics (dispositions become less stable, more context-dependent).

  *   **My Advice:** Do not accept a theory that claims to solve this without admitting the cost. If a theorist tells you they have a tidy account that handles both the Smart Glass (intrinsic) and the Stampeding Crowd (relational) with equal ease, they are likely glossing over the difference between *properties of matter* and *properties of systems*. You must decide if you want a theory of *physics* (Intrinsic) or a theory of *systems* (Relational).

  ---

  ### Scorecard of Main Families of Answers

  Here is how the major approaches fare against your desiderata.

  **1. The Simple Counterfactual View**
  *   *Claim:* "Fragile" means "If struck, it would break."
  *   *Score:* **Fails.**
  *   *Reason:* Collapses immediately on **Interference Immunity**. It calls the Foam-Masked glass "not fragile" and the Firecracker-Mimic "fragile." It is extensionally inadequate.

  **2. The Categorical Reduction (Identity Theory)**
  *   *Claim:* The disposition *is* the physical base (e.g., the molecular structure). Fragility just *is* the silica bonding.
  *   *Score:* **Mixed.**
  *   *Reason:* Handles **Intrinsic Grounding** well. Struggles with **Causal Relevance** (if the structure does the work, what work is left for "fragility" to do?). Struggles with **Higher-Order Dispositions** (Case 2): What is the physical base of a *future* disposition?

  **3. The Irreducible Powers (Dispositional Essentialism)**
  *   *Claim:* Dispositions are fundamental properties of the universe, not reducible to anything else.
  *   *Score:* **Strong.**
  *   *Reason:* Handles **Finks/Masks** easily (the power is there, even if blocked). Handles **Causal Relevance** well.
  *   *Cost:* Violates **Non-Circularity** (admits dispositions are primitive). Can feel metaphysically "spooky" to those wanting physical reduction.

  **4. The Contextual/Two-Place View**
  *   *Claim:* Dispositions are relations between an object and a context (e.g., Fragile-in-context-C).
  *   *Score:* **Good for Crowds, Bad for Stability.**
  *   *Reason:* Handles **Mereological Coherence** (Crowds) well. Handles **Finks** well (the Fink changes the context).
  *   *Cost:* Weakens **Intrinsic Grounding**. The glass isn't fragile *simpliciter*, only relative to a situation. This makes dispositions less stable properties of objects.

  ### Final Recommendation

  You are stuck because you are looking for a definition that is both **intrinsic** (about the object) and **infallible** (guarantees the outcome). Your Smart Glass case proves these pull apart.

  *   If you prioritize **Intrinsic Grounding**, you must accept that a thing can be fragile and *never* break (because its own internal nature prevents it).
  *   If you prioritize **Manifestation**, you must accept that fragility depends on the environment (foam, angels, networks).

  For your purpose ("tell... whether a disposition claim is true"), I recommend adopting the **Irreducible Powers** view with a **System-Relative** caveat. Treat the glass as having a power grounded in its structure, but acknowledge that for the Crowd, the "structure" is the pattern of interaction. Do not try to reduce the Crowd's disposition to the same metaphysical bucket as the Glass's silica bonds. Accept the Trade-Off: Physics gets Intrinsic Grounding; Sociology gets Mereological Coherence. A single unified theory will likely fail one of your cases.
