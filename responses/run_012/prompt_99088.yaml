      *   *Hole 2:* The definition of "Good." If Cato argues old age allows for the highest virtue (wisdom), is that not a vindication? The user distinguishes "bearable" vs. "good." I need to push them on whether "virtue" counts as "good" in their framework.
      *   *Hole 3:* The Carstensen bit. If I were a conservative classicist, I'd hate it. I need to advise them on how to defend it. "Methodological lens" vs. "Comparative evidence."

  8.  **Final Polish:** Ensure the advice is actionable for next week's seminar. (e.g., "Prepare to defend X," "Cut Y if time is short").

