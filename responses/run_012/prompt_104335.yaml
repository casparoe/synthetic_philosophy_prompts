  **Copla (The Bishop's Voice)**

  Let women keep silence in the churches.
  For it is a shame for them to speak.
  Learn in silence with all subjection.
  I command this for your own salvation.

  **Glosa I**

  If God endowed the soul with hunger's sting,
  Is fasting from the truth a holy thing?
  You say the spirit bows, the mouth shuts tight,
  But reason is a lantern, not a night.
  To quench the lamp is to insult the Giver.
  I tremble, yes, but I cannot shiver
  Off the skin of thought. It is my breathing.
  I serve Him best when I am most perceiving.
  You guard the altar, I guard what He gave,
  **Let women keep silence in the churches.**

  **Glosa II**

  I never sought the pulpit's elevated stage,
  Nor to unravel dogma page by page
  Before the congregation. This is private.
  My study is a room you cannot visit.
  The world is wide, and not all seats are thrones.
  If men had tended pots and cared for bones,
  Had Aristotle cooked, he'd have written more.
  Domestic labor opens wisdom's door.
  My pen is not a trumpet, it's a leak,
  **For it is a shame for them to speak.**

  **Glosa III**

  Consider what happens when the mind is starved.
  Error grows fat where understanding starved.
  Who teaches daughters if the mother's blind?
  A silent woman leaves the soul behind.
  Ignorance is the danger, not the book.
  Look closely at the path that you took.
  To lead the young, one must have seen the way.
  I yield the voice, but not the judgment day.
  I bow my head, but hold the reflection,
  **Learn in silence with all subjection.**

  **Glosa IV**

  And so I write this letter to agree,
  A public act to defend privacy.
  You see obedience in the ink I spill,
  I see a right to think, and I think still.
  The silence you impose is external sound,
  But internal logic cannot be bound.
  I stop the speech to let the reading grow.
  This quiet is the only space I know.
  I take your word as my own foundation,
  **I command this for your own salvation.**
