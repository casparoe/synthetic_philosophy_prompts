answer: |-
  ### Exam Question: Causal Structure and Simpson's Paradox

  **Question 4 (20 Marks)**

  Consider a clinical trial evaluating two treatments (A and B) for a disease. Patients are categorized by case severity (Mild or Severe) prior to assignment. The data below show the number of patients recovered divided by the number treated.

  | Treatment | Mild Cases | Severe Cases |
  | :--- | :--- | :--- |
  | **A** | 9 / 10 | 30 / 90 |
  | **B** | 89 / 100 | 1 / 10 |

  1.  Calculate the recovery rates for each treatment within strata and in the pooled data. State the two defensible answers to "which treatment is better" and identify which calculation supports each.
  2.  Explain what causal role *Severity* must play (confounder, mediator, or collider) for the stratified comparison to yield the correct causal effect. How does your recommendation change if Treatment affects Severity?
  3.  A classmate argues: *"The reversal of the association upon pooling proves that Severity is a confounder."* Evaluate this claim. In your evaluation, distinguish between what the numbers settle and what requires external assumptions, and address the relevance of non-collapsible measures (e.g., odds ratios).

  ***

  ### Model Answer

  **1. Rates and Defensible Answers**
  Within strata, Treatment A is superior. For Mild cases, A recovers 90% (9/10) vs. B's 89% (89/100). For Severe cases, A recovers 33% (30/90) vs. B's 10% (1/10). However, in the pooled data, Treatment B appears superior: A recovers 39% (39/100) while B recovers 82% (90/110). The first defensible answer ("A is better") relies on the stratified rates; the second ("B is better") relies on the marginal (pooled) rates. This is an instance of Simpson's reversal.

  **2. Causal Role of Severity**
  To justify the stratified comparison (favoring A), *Severity* must be a **confounder**: a pre-treatment cause of both treatment assignment and recovery. Here, B was disproportionately assigned to Mild cases (100 vs. 10), inflating its pooled success. Stratification blocks this backdoor path. If *Severity* were a **mediator** (caused by Treatment), stratification would block the causal path, and the pooled estimate (or mediation analysis) would be appropriate. If *Severity* were a **collider**, conditioning on it would induce bias. Thus, the correct adjustment depends entirely on the temporal/causal ordering of Severity relative to Treatment, which the table does not show.

  **3. Evaluating the Classmate's Claim**
  The classmate's claim is false. A statistical reversal is neither necessary nor sufficient for confounding.
  First, **underdetermination**: The table alone is consistent with multiple causal graphs. Without knowing whether Severity is pre- or post-treatment, we cannot diagnose confounding from numbers alone. We need structural assumptions (e.g., study design) to choose the correct adjustment set.
  Second, **non-collapsibility**: Even with no confounding, pooled and stratum-specific estimates can differ mathematically if the effect measure is non-collapsible (like the odds ratio). In such cases, a reversal can occur purely due to the mathematical properties of the estimator, not bias. While the risk differences here suggest confounding, the logical claim that reversal *proves* confounding is invalid.
  **Consensus vs. Contestation**: It is consensus that causal graphs clarify the necessary adjustments. However, it is contested whether graphing "dissolves" the paradox. Some argue the paradox is merely an error of interpretation; others argue it reveals a deeper tension between statistical evidence and causal truth, particularly regarding whether non-collapsibility-induced reversals count as "real" instances of the paradox or mere mathematical artifacts.

  ***

  ### Marking Scheme (20 Marks Total)

  **Point 1: Arithmetic & Reversal Identification (4 Marks)**
  *   **A (4):** Correctly calculates all four rates; explicitly identifies the reversal (A > B in strata, B > A pooled); links "A is better" to stratified and "B is better" to pooled.
  *   **B (2-3):** Calculates rates correctly but fails to explicitly link the calculations to the conflicting conclusions.
  *   *Common Error:* Calculating pooled rates incorrectly (e.g., averaging percentages rather than weighting by N).

  **Point 2: Causal Roles (Confounder vs. Mediator) (4 Marks)**
  *   **A (4):** Identifies Severity as a confounder for stratification to be valid; explains that if Treatment affects Severity (mediator), stratification biases the total effect.
  *   **B (2-3):** Identifies Severity as a confounder but fails to explain the consequence if it were a mediator (or claims stratification is always correct).
  *   *Common Error:* Treating "Severity" as inherently a confounder without referencing the temporal order relative to Treatment.

  **Point 3: Critique of Classmate (Reversal $\neq$ Confounding) (4 Marks)**
  *   **A (4):** Explicitly states reversal does not prove confounding; notes that data is consistent with multiple causal stories (underdetermination).
  *   **B (2-3):** Agrees the classmate is wrong but relies only on the "mediator" counterexample without discussing underdetermination.
  *   *Common Error:* Agreeing with the classmate because the numbers *look* like the Berkeley case.

  **Point 4: Non-Collapsibility Technicality (4 Marks)**
  *   **A (4):** Explains that with non-collapsible measures (e.g., Odds Ratio), marginal and conditional estimates diverge even without confounding; distinguishes this from the specific risk data provided.
  *   **B (2-3):** Mentions "odds ratios" but fails to explain why this invalidates the classmate's logical proof.
  *   *Common Error:* Claiming risk differences are non-collapsible (they are collapsible; ORs are the standard example).

  **Point 5: Philosophical Status (Consensus vs. Contestation) (4 Marks)**
  *   **A (4):** Distinguishes consensus (graphs guide adjustment) from contested views (whether the paradox is dissolved or reveals deeper epistemic issues regarding non-collapsibility).
  *   **B (2-3):** Presents the graphical solution as the absolute consensus without acknowledging philosophical debate on the nature of the paradox.
  *   *Common Error:* Asserting that drawing a DAG objectively "solves" the problem without acknowledging the assumptions required to draw the DAG.
