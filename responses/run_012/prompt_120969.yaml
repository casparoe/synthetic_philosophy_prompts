          *   *Capital Vol. I:* Machine-breaking (Luddism) mistakes the machine for the social relation.
          *   *Grundrisse:* "Fragment on Machines" – wealth depends less on labor time, more on general science/social knowledge ("general intellect") becoming a direct force of production.
          *   Distinction between machinery as *use-value* (hardware/potential) vs. machinery as *fixed capital* (social form/function).
      *   **Analytical Tasks:**
          1.  Analyze what the Combine faced through Marx's framework.
