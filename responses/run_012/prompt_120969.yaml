          4.  Reverse the analysis: Does the Lucas episode confirm Marx, register as an anomaly (productive forces $\neq$ emancipation), or present an unanticipated case (workers taking over planning but losing)?

  2.  **Initial Brainstorming & Structuring:**

      *   *Introduction:* Introduce the Lucas Plan, the context (redundancies, military-to-civilian conversion), and the thesis (Marx provides a dual lens: technology as a weapon of capital vs. technology as potential liberation).
      *   *Section 1: Marx on Machinery as Weapon (Capital Vol. I).* Explain how capital uses machines to discipline labor. Relate this to why management rejected the plan (control issues, not just technical feasibility).
      *   *Section 2: Marx on Machine-Breaking vs. Social Relations.* The Combine didn't break machines; they wanted to repurpose them. This aligns with Marx's critique of Luddism.
