prompt: |-
  Hey, I need a favor that's basically a writing job.

  I sit on the grants committee at a foundation that funds long-horizon research, and a week from Tuesday we vote on whether to renew a group we've funded for eight years. Their whole output is one big model — they call it SPINE, dont ask — that projects when a particular resource constraint starts to bind. Think a Malthus story with better data and a lot more code. The headline number was that we'd cross the threshold in per-capita availability of the thing by around 2016. We didn't. It's now well past that and we're not close.

  The group's line is that this isn't a failed prediction, because the number was never a bare forecast. It was conditional on the absence of a certain class of input substitutions, and that class showed up faster than the model's baseline assumed — so the model was right about the mechanism and wrong only about the clock. Maybe. Two things you should know before you judge it. First, the group also wants to discount part of the miss on the grounds that the agency that tracks the number changed its definition halfway through, and only the remaining part is a genuine miss — I want you to say whether that's a legitimate adjustment or a second rescue stacked on the first. Second, one of my colleagues, a chemist, wants to defund them on the spot: his view is that a prediction that misses its window is a dead theory and everything the group has said since is just ad hoc patching to save the core. My other colleague wants to renew forever, on the theory that long-run predictions are always early, never wrong, so the honest thing is to wait a century. I think both of them are being lazy and I want a real call.

  So draft the decision memo I'll circulate before the vote. It needs a concrete recommendation — renew as-is, renew with conditions, or defund — with a time frame attached, and if it's renew with conditions I need those conditions spelled out as something we can actually check: what specific evidence in that window would count as the model being vindicated, and what would count as it being dead. The question that actually matters to me is whether the group's rescue (the input-substitution story) predicts anything new that we could turn out to be wrong about, or whether it just explains away the miss after the fact. Say which one it is and why, and be specific about the test.

  Don't hand me Popper vs. Kuhn in the abstract, apply it to these people. And give the chemist his best shot before you overrule him, if you do — I'd rather read the strongest version of a miss is a miss than a strawman I can knock down in the meeting.
reasoning: |-
  Here's a thinking process that leads to the suggested decision memo:

  1.  **Analyze the Request:**

      *   **Role:** Grants committee member at a foundation funding long-horizon research.
      *   **Task:** Draft a decision memo for circulation before a vote on renewing a research group (8 years funded).
      *   **Subject:** A group modeling resource constraints (SPINE model).
      *   **The Issue:** They predicted a threshold breach by ~2016. It didn't happen. They claim it was conditional on no input substitution, which happened faster than expected (mechanism right, timing wrong). They also claim a data definition change by a tracking agency accounts for part of the miss.
      *   **Colleagues:**
          *   Chemist: Defund immediately (missed prediction = dead theory, rest is ad hoc).
          *   Optimist: Renew forever (long-run predictions are always early, wait a century).
          *   User (Me): Thinks both are lazy, wants a real call with specific conditions/tests.
      *   **Key Questions to Answer:**
          *   Is the data definition adjustment legitimate or a second rescue?
          *   Does the "input substitution" rescue predict anything *new* and *falsifiable*, or is it just post-hoc explanation?
          *   Recommendation: Renew as-is, Renew with conditions, or Defund (with timeframe).
          *   Conditions: Specific evidence for vindication vs. death of the model.
      *   **Tone:** Professional, analytical, decisive, avoiding abstract philosophy (Popper/Kuhn) but applying the logic to the specific case. Give the chemist his due before overruling.

  2.  **Deconstruct the Scientific/Epistemic Problem:**

      *   *The Miss:* 2016 threshold not crossed.
      *   *Rescue 1 (Substitution):* "We said X happens unless Y occurs. Y occurred." This is a standard ceteris paribus defense. It's valid *if* the model explicitly included Y as a variable with a probability distribution, or if the mechanism for Y is now integrated into the model to make *new* predictions. If it's just "we didn't look at Y," it's ad hoc.
      *   *Rescue 2 (Data Definition):* "The agency changed how they count." This is tricky. If the model predicts a physical reality, but the metric changes, you need to bridge the gap. If they are just moving the goalposts to make the error bar look smaller, it's suspect.
      *   *The Chemist's View:* Falsificationism. Prediction failed -> Theory dead. Strong, but maybe too rigid for complex systems modeling where boundary conditions matter.
      *   *The Optimist's View:* "Always early." Unfalsifiable. Dangerous for a foundation.
      *   *The User's View:* Needs falsifiability. The rescue must generate *novel* predictions.

  3.  **Determine the Recommendation:**

      *   *Defund?* Too harsh if the mechanism (scarcity drives substitution) is sound, but the 2016 miss is significant.
      *   *Renew Forever?* Irresponsible. No accountability.
      *   *Renew with Conditions?* This is the sweet spot. It acknowledges the long-horizon nature but demands proof that the "rescue" isn't just storytelling.
      *   *Time Frame:* Needs to be long enough for data to emerge but short enough for accountability. 3-5 years is standard for grants, but since this is "long-horizon," maybe 3 years with a mid-point review. Let's say 3 years.
      *   *The Test:* The model needs to predict *where* substitution will fail or *when* the next bottleneck hits, specifically based on the substitution logic. It can't just say "scarcity is coming." It needs to say "Substitution in Sector A will saturate by Date B, causing Price/Constraint C."

  4.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format.
      *   **Executive Summary:** The recommendation upfront.
      *   **Background:** Briefly state the SPINE model history and the 2016 miss.
      *   **Assessment of the Miss (The Chemist's Argument):** Give this weight. A missed date is a missed date. Acknowledge the risk of "moving the goalposts."
      *   **Assessment of the Rescue (Substitution & Data):**
          *   *Data Definition:* Evaluate legitimacy. If the physical reality didn't change but the counting did, an adjustment is mathematically necessary, *but* it shouldn't erase the error. It's a partial justification, not a full excuse. Call it a "correction," not a "rescue."
          *   *Substitution:* This is the core. Is it ad hoc? Only if it doesn't predict *future* substitution limits.
      *   **The Criterion for Renewal:** The "Novel Prediction" test. The model must predict a specific constraint *given* the substitution rates.
      *   **Recommendation & Conditions:** Renew for 3 years. Conditions: Specific milestones.
      *   **Vindication vs. Death:** Define clear triggers.

  5.  **Refining the Argument (Self-Correction during drafting):**

      *   *Critique:* Is the data definition adjustment legitimate?
      *   *Correction:* If the agency changed the definition, the historical time series is broken. The model *must* adjust to compare apples to apples. However, using this to claim the prediction was "closer than it looks" is suspect if the physical constraint didn't change. I should characterize this as a *technical correction* that is legitimate for calibration but illegitimate as a primary defense for the miss. The primary defense must be the substitution mechanism.
      *   *Critique:* How to satisfy the Chemist?
      *   *Correction:* Explicitly state that if the specific conditions aren't met, the Chemist is right and we pull the plug. The renewal is probationary.
      *   *Critique:* How to satisfy the "Long Horizon" aspect?
      *   *Correction:* Acknowledge that timing is hard, but mechanism must be robust. The "wait a century" approach is rejected because it removes accountability.

  6.  **Final Polish:**

      *   Ensure the tone is appropriate for a committee memo (formal but direct).
      *   Make sure the "Specific Evidence" section is very concrete (e.g., elasticity metrics, saturation points).
      *   Check that the "Popper vs. Kuhn" instruction is followed (apply the logic, don't lecture).

  7.  **Final Review against constraints:**
      *   Concrete recommendation? Yes (Renew with conditions).
      *   Time frame? Yes (3 years).
      *   Conditions spelled out? Yes.
      *   Data definition adjustment judged? Yes.
      *   Rescue evaluated (predictive vs. post-hoc)? Yes.
      *   Chemist's argument strengthened? Yes.

  *(Self-Correction on the Data Definition point)*: I need to be careful. If the agency changed the definition, the *target* moved. If the model predicted "Metric A > X" and the agency now reports "Metric B," comparing them directly is wrong. Adjusting the model to output "Metric B" is legitimate. However, if they are saying "The miss is smaller because the new definition makes the numbers look better," that's spin. I will argue that recalibration is legitimate, but using it to diminish the magnitude of the predictive error is not.

  *(Self-Correction on the Substitution point)*: The key is whether the substitution variable was *in* the model originally. The prompt says "conditional on the absence of a certain class of input substitutions." This implies it was a boundary condition. If the boundary condition changed, the prediction changes. This is scientifically valid *if* they can now model the substitution rate. If they just say "substitution happened," that's history. They need to predict the *limit* of substitution.

  Let's write the memo.cw
answer: |-
  **MEMORANDUM**

  **TO:** Grants Committee
  **FROM:** [Your Name]
  **DATE:** October 24, 2023
  **SUBJECT:** Recommendation Regarding SPINE Group Funding Renewal

  **Executive Summary**

  I recommend we **renew the SPINE group's funding for a fixed term of three years, subject to strict performance conditions.** We should not renew as-is, nor should we defund immediately. The group's core mechanism regarding resource constraints remains plausible, but their predictive track record requires validation beyond post-hoc rationalization. This renewal is probationary. If specific falsifiable criteria are not met by the end of the term, the Chemist's position (defund) becomes the default.

  **Background**

  The SPINE group has received eight years of funding to model the timeline for binding resource constraints. Their central output was a threshold breach projected for ~2016. That breach did not occur. The group offers two explanations:
  1.  **Input Substitution:** The prediction was conditional on no substitution; substitution occurred faster than baseline assumptions.
  2.  **Data Definition:** The tracking agency changed the metric definition mid-stream, accounting for part of the variance.

  **Assessment of the "Miss"**

  Our colleague in Chemistry argues that a missed prediction falsifies the theory. This is the strongest argument on the committee, and it deserves full weight. In hard sciences, if a model predicts an event at $T_0$ and the event does not occur at $T_0$, the model is broken. To extend funding indefinitely on the hope that the event will simply happen "later" is to insulate the research from accountability. If we accept "always early, never wrong" as a valid defense, we are not funding science; we are funding prophecy.

  However, SPINE is not modeling a closed physical system like a chemical reaction; it is modeling a socio-technical system where boundary conditions (like human innovation/substitution) can shift. A rigid falsification criterion ignores the complexity of the domain. The Chemist is right that the 2016 date was a failure, but wrong to conclude the *mechanism* is dead solely on timing. The question is whether the explanation for the timing error is scientifically productive or merely protective.

  **Assessment of the Rescues**

  **1. The Data Definition Adjustment**
  *Verdict: Legitimate Calibration, Illegitimate Defense.*
  It is standard practice to recalibrate a model when the ground-truth metric changes definition. If the agency changed how they count the resource, SPINE must adjust their historical data to maintain continuity. However, using this adjustment to argue the miss was "smaller than it looks" is suspect. Recalibration should be done to ensure future accuracy, not to retroactively minimize past error. We should accept the recalibration for future modeling, but we must judge the 2016 miss based on the data available *at the time of the prediction*. This adjustment cannot count toward vindication.

  **2. The Input Substitution Rescue**
  *Verdict: Potentially Valid, Currently Ad Hoc.*
  The group claims the model was conditional on the absence of substitution. If this conditionality was explicit in the original grant deliverables, the logic holds: the boundary condition changed, so the output changed.
  *However*, this only saves the model if the "substitution variable" is now integrated into the core mechanics to generate *new* predictions. If the group simply adds substitution as a "get out of jail free" card whenever a date is missed, it is an ad hoc hypothesis designed to save the core theory from falsification.
  Currently, the substitution story explains the past but does not constrain the future. To move from "storytelling" to "science," the rescue must generate risk.

  **Recommendation: Renew with Conditions**

  We should fund the group for **three years**. This acknowledges the long-horizon nature of the work (rejecting the "defund now" impulse) while rejecting the "wait a century" approach (which removes accountability).

  **Conditions for Vindication vs. Falsification**

  To justify renewal beyond this three-year window, the SPINE group must demonstrate that their "substitution rescue" is predictive, not just explanatory. They must move from saying "substitution delayed the crash" to "substitution will saturate at X point."

  **Specific Evidence Required (The Test):**

  By the end of Year 2 of this renewal, the group must publish a pre-registered update to the SPINE model that includes:

  1.  **A Specific Saturation Point:** They must identify a specific sector where input substitution is currently active and predict a **hard saturation date** (e.g., "Substitution in Sector A will reach physical/economic limits by Q3 2025").
  2.  **A Binding Constraint Metric:** They must define a specific leading indicator (e.g., price elasticity, extraction energy cost) that will visibly diverge from baseline market expectations *prior* to that saturation date.
  3.  **Falsification Criteria:** They must explicitly state what data would prove their updated model wrong. For example: "If substitution rates in Sector A remain above 5% annually through 2025 without price increases, the SPINE mechanism is invalid."

  **Decision Matrix for Final Vote (Year 3):**

  *   **Vindication (Renew Long-Term):** The predicted saturation point is reached, or the leading indicator diverges exactly as modeled, demonstrating that the substitution mechanism has a predictable limit.
  *   **Failure (Defund):** Substitution continues indefinitely without the predicted saturation or price signal, or the group fails to make a specific, risky prediction and instead offers further conditional adjustments.

  **Rationale**

  This approach splits the difference between our colleagues. It accepts the Chemist's demand for falsifiability: if the substitution mechanism is real, it must have a limit we can measure. If the group cannot predict *when* substitution stops working, they are merely describing history, not forecasting constraints. Simultaneously, it rejects the "wait a century" approach by demanding a concrete testable window within a standard grant cycle.

  We are not paying them to be right about 2016 anymore. We are paying them to prove they can be right about 2026. If they cannot turn their rescue into a prediction, they are no longer a research group; they are a consultancy rationalizing the status quo.

  **Action Required**

  Please review this framework. I move we adopt the "Renew with Conditions" recommendation for the vote on Tuesday.
