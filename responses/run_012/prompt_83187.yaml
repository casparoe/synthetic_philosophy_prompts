prompt: |-
  A lot of institutions now resolve questions by lottery, and I want to know what each of these uses commits us to.

  The first use is to choose who decides. Criminal juries are drawn at random from the adult population, and over the past couple of decades several countries and cities have convened citizens' assemblies: bodies of somewhere between a few dozen and a few hundred people, chosen by lottery, paid, briefed by experts, facilitated, and asked to reach recommendations on a contested question, which are then sent to a legislature or a referendum. These draws are usually stratified — constrained so that the body matches the population on age, sex, region, and sometimes education — and anyone who declines is replaced by a fresh draw from the same stratum. The body is described as a fair sample of the public, or a miniature of it.

  The second use is to allocate scarce benefits. Where more people want a place or a permit than there are places or permits — a school, a subsidized apartment, a hunting licence — the surplus is often settled by lottery, and here nobody proposes stratifying anything; a draw weighted toward a group would be a scandal, and the point is said to be precisely that nobody's characteristics count.

  The third use is to allocate burdens. Where military conscription has been decided by lottery, the draw has run only among people already picked out by age and sex, so that the lottery distributes a burden inside a pool that was defined by non-random criteria, while the lottery itself is credited with the fairness of the result.

  What view of political equality, competence, and desert does this cluster presuppose? Take the three uses in turn and reconstruct the conception of equality each one only makes sense under — in particular, whether one and the same device can coherently serve both to make a body representative and to make an allocation deliberately blind to every characteristic. Is the fairness credited to the lottery in each case really coming from the lottery, or from the non-random decisions that fix the pool and the strata? Why is it unremarkable to constrain a draw by sex when composing a body that governs, and unthinkable to do so when handing out apartments? Note also that a body anyone may decline to join is not a random sample of the population, however the replacements are drawn, and that a jury must be unanimous while an assembly decides by majority. Which of these commitments do the practices strictly need, which do they merely fit well with, and where are they underdetermined, so that several rival theories of equality would license the same arrangements? Finally, tell me what would have to change if we replaced the presupposed view with a purely epistemic one, on which the value of a lottery is only that a large random body judges better than a small selected one.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the Prompt:**

      *   **Core Task:** Analyze three specific uses of lotteries in institutions (choosing deciders, allocating benefits, allocating burdens) to uncover the underlying philosophical commitments regarding political equality, competence, and desert.
      *   **Specific Questions to Address:**
          1.  Reconstruct the conception of equality for each use.
          2.  Can one device coherently serve both representation (Use 1) and blindness to characteristics (Use 2)?
          3.  Is fairness coming from the lottery or the non-random pool/strata definition?
          4.  Why is stratification acceptable for governing bodies but scandalous for benefits?
          5.  Address the issue of voluntary participation (declining) vs. random sampling.
          6.  Address decision rules (unanimity vs. majority).
          7.  Distinguish between necessary commitments, fitting commitments, and underdetermined commitments.
          8.  Contrast the current view with a *purely epistemic* view (lottery value = large random body judges better).

  2.  **Analyze the Three Uses:**

      *   **Use 1: Choosing Deciders (Juries, Citizens' Assemblies).**
          *   *Goal:* Representation, legitimacy, descriptive representation.
          *   *Mechanism:* Stratified random sampling + replacement.
          *   *Equality Conception:* Political equality as *inclusion* and *mirroring*. Everyone has an equal chance to be part of the sovereign voice. Competence is assumed to be distributed or attainable via briefing.
          *   *Tension:* Voluntary participation breaks true randomness. Unanimity (jury) vs. Majority (assembly) implies different views on truth/consensus.

      *   **Use 2: Allocating Benefits (Schools, Housing, Licenses).**
          *   *Goal:* Fair distribution of scarcity.
          *   *Mechanism:* Pure lottery (usually), no stratification.
          *   *Equality Conception:* Political equality as *blindness* to merit/status. Everyone is equally undeserving/deserving in the eyes of the mechanism. Desert is explicitly bracketed.
          *   *Tension:* Stratification here is seen as corruption/bias, unlike in Use 1.

      *   **Use 3: Allocating Burdens (Conscription).**
          *   *Goal:* Fair sharing of sacrifice.
          *   *Mechanism:* Lottery within a pre-defined pool (age/sex).
          *   *Equality Conception:* Political equality as *shared risk* among peers. Desert is irrelevant; obligation is universal within the class.
          *   *Tension:* The fairness relies heavily on the *pool definition*, not just the draw.

  3.  **Synthesize and Answer Specific Questions:**

      *   *Coherence of Representation vs. Blindness:* This is the crux. Use 1 wants the lottery to *reveal* structure (demographics). Use 2 wants the lottery to *erase* structure (merit/need).
          *   *Resolution:* They rely on different theories of equality. Use 1 is *Democratic Equality* (voice). Use 2 is *Distributive Equality* (goods). Use 3 is *Civic Equality* (duty).
      *   *Source of Fairness:* In all three, the lottery is merely the *procedure*. The normative weight lies in the *pool construction*.
          *   Use 1: Fair because the pool = population.
          *   Use 2: Fair because the pool = all applicants (equals).
          *   Use 3: Fair because the pool = all eligible citizens (equals in duty).
      *   *Stratification Paradox:* Why stratify governors but not apartment recipients?
          *   Governors need to *represent* the whole (descriptive representation).
          *   Apartment recipients are receiving a *private good*. Stratifying private goods looks like quota-based distributive justice, which clashes with the "blind luck" fairness of the lottery.
      *   *Voluntary Participation:* A body where people can opt-out is not a random sample. It's a *self-selected sample randomized within strata*. This undermines the "miniature public" claim unless we assume willingness to serve is randomly distributed (it isn't).
      *   *Decision Rules:* Unanimity (Jury) protects the accused (high bar for burden). Majority (Assembly) enables action (efficiency). This reflects the *stakes*, not the lottery itself.
      *   *Necessary vs. Fitting vs. Underdetermined:*
          *   *Necessary:* Equal probability of selection *within the defined pool*.
          *   *Fitting:* Stratification for representation; Blindness for goods.
          *   *Underdetermined:* The decision rule (majority/unanimity); The specific strata used.
      *   *Purely Epistemic View:* If the value is *only* that large random bodies judge better (Condorcet Jury Theorem style), then:
          *   Stratification becomes irrelevant (unless demographics correlate with error rates).
          *   Benefits/Burdens lotteries make no sense (epistemic value doesn't apply to receiving a house).
          *   Voluntary opt-out is a major problem (bias introduces error).
          *   Competence is the only metric, not equality or desert.

  4.  **Drafting the Response (Iterative Process):**

      *   *Introduction:* Acknowledge the depth of the prompt. State the thesis: The lottery is a procedural shell; the normative content comes from how the pool is constructed and what good is being distributed.
      *   *Section 1: The Three Conceptions of Equality.*
          *   Use 1 (Deciders): Equality as *Potential Sovereignty*. (You could be the state).
          *   Use 2 (Benefits): Equality as *Indifference*. (No one is more worthy).
          *   Use 3 (Burdens): Equality as *Shared Fate*. (We all risk the same).
      *   *Section 2: The Stratification Paradox.* Address why sex matters for juries but not housing. Key distinction: Public Office vs. Private Good. Representation requires mirroring; distribution requires neutrality.
      *   *Section 3: The Source of Fairness.* Argue that the lottery is neutral; the *pool definition* carries the moral weight. The lottery just prevents corruption within the pool.
      *   *Section 4: The Opt-Out and Decision Rule Problem.*
          *   Opt-out breaks the "mirror" claim. It commits us to a view where *willingness* is a valid filter, or that the strata correction fixes the bias (it doesn't fully).
          *   Decision rules show the lottery isn't doing the heavy lifting on *truth* or *justice*, the voting rule is.
      *   *Section 5: Necessary vs. Fitting vs. Underdetermined.* Categorize the commitments.
      *   *Section 6: The Epistemic Shift.* Contrast the "Democratic/Equal" view with the "Epistemic/Competence" view. Show how this collapses Use 2 and 3, and changes Use 1 significantly (no stratification needed, just size).

  5.  **Refining and Polishing:**

      *   *Tone:* Philosophical, analytical, precise.
      *   *Check:* Did I answer the specific question about whether one device can serve both representation and blindness? Yes, by distinguishing the *good* being allocated (power vs. stuff).
      *   *Check:* Did I address the "underdetermined" aspect? Yes, in Section 5.
      *   *Check:* Did I handle the epistemic counterfactual? Yes, in Section 6.
      *   *Self-Correction during drafting:* I need to make sure I don't just describe the practices but uncover the *commitments*. For instance, when discussing the opt-out, the commitment is that *civic duty is voluntary* or that *statistical correction is sufficient for legitimacy*.
      *   *Refining the "Stratification" point:* It's not just public vs. private. It's about *descriptive representation* vs. *distributive justice*. In Use 1, we want the body to *look* like the people. In Use 2, we want the process to *ignore* what people look like. This is a tension between "Equality of Impact" (Use 1) and "Equality of Opportunity" (Use 2).

  6.  **Final Review against Prompt:**
      *   Three uses analyzed? Yes.
      *   Conception of equality for each? Yes.
      *   Coherence of representation vs. blindness? Yes.
      *   Source of fairness (lottery vs. pool)? Yes.
      *   Stratification paradox (sex in juries vs. apartments)? Yes.
      *   Opt-out issue? Yes.
      *   Decision rules (unanimity vs. majority)? Yes.
      *   Necessary/Fitting/Underdetermined? Yes.
      *   Epistemic view contrast? Yes.

  7.  **Final Polish:** Ensure smooth transitions and clear headings. (Proceed to generate output).

  *(Self-Correction Note)*: I need to be careful with the "Epistemic" section. The prompt asks what would change if we replaced the presupposed view with a *purely* epistemic one. This implies the current view is *not* purely epistemic (it's likely democratic/normative). I need to highlight how Use 2 and 3 would vanish or change radically under a purely epistemic view, because allocating houses isn't a truth-tracking exercise.

  *(Refining the "Fairness" argument)*: The prompt asks: "Is the fairness credited to the lottery in each case really coming from the lottery, or from the non-random decisions that fix the pool and the strata?" My answer should be decisive: It comes from the pool. The lottery is just the anti-corruption mechanism.

  *(Refining the "Opt-out" argument)*: If people can decline, it's not a random sample. The commitment here is that *legitimacy comes from the opportunity to serve, not the compulsion to serve*, OR that the stratification of replacements magically fixes the self-selection bias (which is statistically dubious but politically necessary).

