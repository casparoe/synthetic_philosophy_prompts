answer: |-
  This cluster of practices reveals that the lottery is not a single philosophical tool but a procedural shell filled with different normative content depending on what is being allocated. The "fairness" of the lottery is derivative; it relies entirely on the prior moral work done in defining the pool. Below is a reconstruction of the commitments inherent in each use, followed by an analysis of their coherence and a contrast with a purely epistemic view.

  ### 1. The Three Conceptions of Equality

  Each use presupposes a distinct theory of political equality, competence, and desert.

  **Use 1: Choosing Deciders (Juries, Assemblies)**
  *   **Conception of Equality:** *Equality of Potential Sovereignty.* Every citizen is equally capable of exercising political judgment and equally entitled to a share of political power.
  *   **Competence:** Competence is not a prerequisite for selection but a product of the process (briefing, deliberation). The lottery assumes latent competence is universally distributed.
  *   **Desert:** No one *deserves* to rule more than anyone else. Selection by merit would imply an aristocratic principle incompatible with democratic equality.
  *   **The Commitment:** Legitimacy derives from *descriptive representation*. The body must mirror the demographics of the whole to claim it speaks for the whole.

  **Use 2: Allocating Benefits (Housing, Schools)**
  *   **Conception of Equality:** *Equality of Irrelevance.* When goods are scarce and applicants are equally eligible, personal characteristics should be morally irrelevant.
  *   **Competence:** Irrelevant. Receiving a benefit does not require judgment.
  *   **Desert:** Explicitly bracketed. If desert were the metric, we would use a meritocracy. The lottery admits we cannot or will not rank desert, so we treat all claims as equal.
  *   **The Commitment:** Fairness is *procedural blindness*. The mechanism must be insulated from bias, meaning it must ignore the very characteristics Use 1 seeks to highlight.

  **Use 3: Allocating Burdens (Conscription)**
  *   **Conception of Equality:** *Equality of Shared Risk.* Citizenship entails equal liability to sacrifice.
  *   **Competence:** Physical/mental capacity is handled by the pool definition (age/sex), not the lottery.
  *   **Desert:** Irrelevant. One does not volunteer for sacrifice based on merit; one is liable based on status.
  *   **The Commitment:** Fairness is *randomization of fate* within a class of peers. It prevents the powerful from shifting burdens to the weak.

  ### 2. The Stratification Paradox: Representation vs. Blindness

  You ask whether one device can coherently serve both to make a body representative (Use 1) and to make an allocation blind to characteristics (Use 2). The answer is **no, not under a single theory of equality.** The coherence is maintained only by distinguishing between *public office* and *private goods*.

  *   **In Use 1 (Governing):** The output is a *decision* that binds the public. To legitimize this power, the deciders must structurally resemble the public. Stratification is required because the commitment is to **descriptive representation**. If the jury is all male, it fails to represent the female experience, undermining its claim to speak for "the people."
  *   **In Use 2 (Benefits):** The output is a *private good*. Stratification here would imply that the good is being distributed to achieve social engineering or reparative justice, not individual fairness. If we stratify housing by race, we admit the lottery is a tool of distributive justice, not a neutral arbiter of equal claims. The commitment here is to **formal equality of opportunity**.

  **Why is it unremarkable to constrain by sex for juries but unthinkable for apartments?**
  Because in Use 1, sex is a proxy for *perspective*, which is a relevant qualification for a representative body. In Use 2, sex is irrelevant to the *need* or *claim* for housing (under the prevailing liberal view). To stratify Use 2 would be to admit that the lottery is not treating individuals as abstract equals, but as members of groups with competing claims.

  ### 3. The Source of Fairness: The Pool vs. The Draw

  Is the fairness coming from the lottery or the non-random decisions fixing the pool? **It comes almost entirely from the pool.**

  *   **The Lottery's Role:** The random draw serves only to prevent *corruption* and *bias* within the defined group. It ensures no individual can manipulate the outcome.
  *   **The Pool's Role:** The moral weight lies in who is allowed into the pool.
      *   In **Use 1**, fairness relies on the claim that the pool (adult population) is the sovereign.
      *   In **Use 2**, fairness relies on the claim that all applicants have equal moral standing.
      *   In **Use 3**, fairness relies on the claim that the defined class (e.g., 18–25 year olds) is the correct unit of civic obligation.

  If the pool is unjust (e.g., conscription excludes the wealthy, or juries exclude felons disproportionately), the lottery merely fairly distributes an unjust exclusion. The "fairness credited to the lottery" is often a fetishization of the procedure that obscures the politics of the pool construction.

  ### 4. The Opt-Out and Decision Rules

  **The Opt-Out Problem**
  You note that a body anyone may decline to join is not a random sample. This is statistically true and philosophically significant.
  *   **The Commitment:** By allowing opt-outs, institutions commit to a view that **civic duty is voluntary** or that **willingness is a relevant filter for competence.**
  *   **The Fiction:** Stratified replacement draws pretend to restore randomness. They do not. They restore *demographic proportions*, but they cannot restore *attitudinal randomness*. People who volunteer for civic duty differ systematically from those who do not (higher efficacy, more free time, more political interest).
  *   **Strict Need:** The practice does not *strictly* need true randomness; it needs *legitimacy*. The commitment is that a demographically mirrored body of volunteers is legitimate enough, even if it is not a true statistical miniature.

  **Decision Rules (Unanimity vs. Majority)**
  *   **Juries (Unanimity):** Commits to the view that imposing a burden (conviction) requires the highest possible certainty and that minority dissent must be respected.
  *   **Assemblies (Majority):** Commits to the view that the goal is *action* and *recommendation*, not final judgment on liberty.
  *   **Underdetermination:** The lottery does not dictate the voting rule. A lottery could select a body that decides by majority, consensus, or dictatorship. The voting rule is a separate normative choice about the *stakes* of the decision, not the *selection* of the deciders.

  ### 5. Necessary, Fitting, and Underdetermined Commitments

  *   **Strictly Necessary:**
      *   **Equal Probability within Pool:** For the lottery to function as a lottery, every member of the defined pool must have an equal chance of selection.
      *   **Pool Definition:** There must be a non-arbitrary reason for the pool's boundaries (e.g., citizenship, age, application).
  *   **Merely Fitting:**
      *   **Stratification in Use 1:** Fits the theory of descriptive representation, but a pure sortition (no stratification) would still be "random." Stratification is added to speed up representativeness and guard against statistical outliers.
      *   **Blindness in Use 2:** Fits the theory of formal equality, but a weighted lottery (e.g., for need) could also be fair under a different theory of distributive justice.
  *   **Underdetermined:**
      *   **Decision Rules:** As noted, the lottery selects the *who*, not the *how* of decision-making. Rival theories of equality (deliberative vs. aggregative) can license the same lottery selection but different voting rules.
      *   **Replacement Protocols:** Whether to replace decliners from the same stratum or redraw entirely is underdetermined by the theory of equality; it is a pragmatic choice between statistical purity and administrative feasibility.

  ### 6. The Purely Epistemic Counterfactual

  Finally, what if we replaced the presupposed view (Democratic/Distributive Equality) with a **Purely Epistemic View**? On this view, the value of the lottery is solely that a large random body judges better than a small selected one (relying on the Condorcet Jury Theorem or diversity-trumps-ability theorems).

  **Changes Required:**

  1.  **Use 2 and 3 Would Vanish:** A purely epistemic justification cannot support allocating benefits or burdens. There is no "truth" to be found in who gets an apartment or who goes to war. These practices would lose their justification entirely and would need to revert to meritocracy (for benefits) or volunteerism/conscription based on capability (for burdens).
  2.  **Stratification Becomes Suspicious:** In Use 1, stratification is currently used for *political legitimacy* (mirroring the people). Under an epistemic view, stratification is only useful if demographics correlate with *error rates* or *information pools*. If age and sex do not correlate with judgment accuracy, stratifying for them is a waste of resources. We would draw purely randomly to maximize independence of errors.
  3.  **Opt-Outs Become Fatal:** In the current view, opt-outs are tolerated for liberty. In an epistemic view, opt-outs introduce **selection bias**. If only the politically interested serve, the "wisdom of the crowd" is corrupted by homogeneity. A purely epistemic system would likely require **compulsory service** (like current jury duty in some places, but stricter) to ensure the cognitive diversity required for truth-tracking.
  4.  **Competence Becomes Central:** The current view assumes competence is universal or trainable. The epistemic view cares deeply about the *aggregate* competence. It might favor larger bodies over smaller ones regardless of cost, or exclude those below a cognitive threshold if it could be shown to improve group accuracy, violating the "equality of potential sovereignty" commitment.

  **Conclusion**
  The current cluster of practices is not held together by a single logic of the lottery. It is a hybrid system. Use 1 is **Democratic** (power sharing); Use 2 is **Liberal** (neutral opportunity); Use 3 is **Civic Republican** (shared duty). They coexist only because we allow the definition of the "pool" to shift to accommodate these different moral goals. If we demanded a single consistent theory—such as the purely epistemic one—the system would fracture, rendering the allocation of benefits and burdens unintelligible and transforming the selection of deciders from a right of citizenship into a tool for optimization.
