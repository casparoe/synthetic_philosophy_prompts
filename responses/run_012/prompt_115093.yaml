answer: |-
  At the last hiring committee meeting I sat in on, the Chair tried to invoke the Median Voter Theorem to bypass Arrow. He asked us to arrange the candidates on a left-right spectrum so the median would decide.

  One member said, "I can't. I prefer the Extremist and the Radical, but I despise the Moderate. My preferences are single-troughed."

  The Chair panicked. "Then we'll get a cycle."

  The member said, "Not if you restrict the domain. But then you violate Unrestricted Domain. Or we switch to cardinal utility, but then you buy your consistency at the price of interpersonal comparability. Or we keep voting ordinally, in which case you violate IIA or find a dictator."

  The Chair asked, "So what is the social welfare function?"

  The member said, "Undefined. We're not hiring a candidate; we're running a proof by contradiction."

  The Chair sighed and said, "Fine. Undefined is good. That's exactly how this department works."
