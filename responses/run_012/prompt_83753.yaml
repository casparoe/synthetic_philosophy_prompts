      **POSTING NOTICE: SENIOR COMPLIANCE ANALYST (DIVISION OF MARKET EQUILIBRIUM)**
      **AGENCY:** Office of Rent Stabilization and Wage Standards
      **SALARY RANGE:** $88,400 – $112,600 Annually (DOQ)

      **MISSION STATEMENT**
      The Office of Rent Stabilization and Wage Standards operates to preserve housing continuity for sitting tenants facing displacement pressures unabsorbable by household income, and to rectify labor market distortions arising from concentrated employer purchasing power. The Office maintains that stable housing expenditures and guaranteed wage baselines are mutually reinforcing prerequisites for municipal vitality.

      **PRIMARY DUTIES AND RESPONSIBILITIES**
      The incumbent shall administer regulatory frameworks governing covered housing stock and covered employers. Specific responsibilities include:

      1.  **Housing Stock Verification:** Certify annually that rent ceilings have not diminished the quantity or structural integrity of covered units, notwithstanding reduced capital expenditure incentives.
      2.  **Comparability Adjudication:** Determine whether specific units constitute valid comparables for rent excessiveness hearings, ensuring definitions remain flexible enough to prevent vacancy decontrol from undermining stabilization goals.
      3.  **Pass-Through Analysis:** Distinguish between capital improvements eligible for expenditure recovery and deferred maintenance obligations incumbent upon ownership, ruling on landlord hardship appeals without conceding that revenue caps generate financial distress.
      4.  **Wage Boundary Definition:** Delineate the wage floor and justify why exclusions cluster around specific sectors, maintaining the position that employer buying power varies geographically despite uniform labor mobility.
      5.  **Substitution Monitoring:** Anticipate and catalogue non-price rationing mechanisms landlords and employers may utilize to substitute for prices they are no longer permitted to charge (e.g., key money, unpaid trial shifts).
      6.  **Impact Reporting:** Discharge the statutory duty to report on policy effects by utilizing proxy metrics, acknowledging in fine print that the Office cannot observe what the city would have looked like without the ordinance, so verification will be discharged by other means.

      **REQUIRED QUALIFICATIONS**
      *   Master's degree in Economics, Public Administration, or related field.
      *   Five years of experience regulating price signals without acknowledging supply-side elasticity.
      *   Demonstrated ability to hold two contradictory market theories in simultaneous suspension: that labor markets require floor intervention due to employer power, while housing markets require ceiling intervention due to tenant vulnerability.
      *   Proficiency in statistical software capable of modeling counterfactuals that do not exist.

      **PREFERRED QUALIFICATIONS**
      *   Experience drafting hardship exemptions that are never granted.
      *   Familiarity with vacancy decontrol formulas that preserve stability.

      **TERMS AND REVIEW OF APPOINTMENT**
      This is a career executive appointment subject to a twelve-month probationary period. Performance will be evaluated based on the successful certification that housing supply remains constant while affordability increases, and that wage mandates do not alter hiring volumes. The incumbent serves at the pleasure of the Director, whose tenure is similarly contingent upon the invisibility of market distortions.

      **EQUAL OPPORTUNITY EMPLOYER**
      The City of Oakdale is an Equal Opportunity Employer. All qualified applicants will receive consideration without regard to race, creed, color, national origin, sex, age, disability, or marital status, provided they can demonstrate the cognitive flexibility required by this posting.

