answer: |-
  You have spotted the exact tension Moore intends to navigate, and resolving it requires distinguishing between what is *metaphysically best* and what is *epistemically accessible*.

  Here is the argumentative logic spelled out, step-by-step.

  ### 1. The Three Senses of "Ideal"
  First, we must clarify the three senses Moore distinguishes at the start of the chapter, because his confidence in friendship and beauty depends on shifting from the first sense to the others.

  1.  **The Absolute Good (Summum Bonum):** The best state of things *conceivable* in the abstract. This is the "Ideal" in the strictest metaphysical sense.
  2.  **The Best Possible:** The best state of things that is *metaphysically possible* to exist in the universe.
  3.  **The Best Attainable:** The best state of things *we can bring about* through human action.

  Moore's critical move is to argue that **Sense 1 is unknowable.** This is where the Principle of Organic Unities does its heavy lifting.

  ### 2. Organic Unities and the Unknowability of the Absolute Good
  The Principle of Organic Unities states that the value of a whole is not the sum of the values of its parts. A whole can be highly valuable even if its parts are neutral, and a sum of good parts can make a valueless whole.

  **The Logical Consequence:**
  If value depends on the specific *combination* of parts, and not just the parts themselves, then we cannot calculate the value of a whole unless we are acquainted with that specific combination.
  *   There may be combinations of existence (entities, states of consciousness, relations) that we cannot conceive.
  *   Because of Organic Unities, one of these unconceived combinations might yield a value infinitely higher than any combination we *can* conceive.
  *   Therefore, the **Absolute Good (Sense 1)** might contain elements entirely foreign to human experience. It might contain "none of the positive goods with which we are acquainted."

  **Conclusion A:** We cannot define the *Summum Bonum*. Any ethical system claiming to describe the "Ideal" in Sense 1 is making a claim it cannot justify.

  ### 3. The Pivot to "The Greatest Goods We Know"
  Since Sense 1 is unknowable, Moore restricts the scope of ethical inquiry to what is *conceivable by us*. He shifts the question from "What is the Best Whole in the Universe?" to "What are the Best Wholes *Within Our Experience*?"

  This resolves the tension you identified:
  *   **Claim 1:** "The best whole [Absolute Good] might contain none of the goods we know." (True, because there may be unconceived organic unities).
  *   **Claim 2:** "Friendship and beauty are the greatest goods." (True, *relative to the set of goods we can conceive*).

  Moore is **not** claiming friendship and beauty are the best goods *simpliciter* (in the absolute metaphysical sense). He is claiming they are the best goods *humanly accessible*. He is confident about this list precisely because he has admitted ignorance about the Absolute Good. He is ranking the items in our epistemic reach, not the items in the universe.

  ### 4. How Organic Unities Applies to Friendship and Beauty
  You asked if the value of friendship is just the sum of the parts. Moore's answer is a definitive **no**. This is crucial for understanding why these specific goods top the list.

  If value were additive, the "good" of friendship would be:
  *(My Pleasure) + (Your Pleasure) + (Your Virtue) + (My Virtue)...*

  Moore argues the intrinsic value lies in the **organic unity of the whole state**. The valuable whole is:
  *"Consciousness of a beautiful object"* or *"Consciousness of another person's mental qualities accompanied by appropriate emotion."*

  **The Logic of the Unity:**
  1.  **Necessary Parts:** For the high value to exist, *both* the object (the friend/the beauty) and the consciousness (the appreciation/affection) must be present.
  2.  **No Simple Sum:** If you had the beautiful object without anyone to appreciate it, the value is negligible. If you had the appreciation without a worthy object (e.g., delusion), the value is much lower.
  3.  **The Emergent Value:** The high intrinsic value emerges only from the *relation* between the two.

  This explains why they top the list of *known* goods. Moore has analyzed various organic unities available to human experience (pleasure alone, virtue alone, knowledge alone) and determined that the complex unities involving **aesthetic appreciation** and **personal affection** yield the highest intrinsic intensity *among the combinations we can actually experience.*

  ### 5. What the Third Sense of "Ideal" Is Doing
  The third sense (The Best Attainable) is the bridge to practical ethics.

  *   **Sense 1 (Absolute)** is the theoretical limit. We admit we can't reach it or know it.
  *   **Sense 3 (Attainable)** is the practical goal. This is what we ought to try to create.

  **The Argumentative Move:**
  Because we cannot know the Absolute Good (Sense 1), we cannot aim for it directly. However, we *do* know that certain organic unities (friendship/beauty) possess immense intrinsic value. Therefore, the rational strategy for achieving the **Ideal in Sense 3** is to maximize the occurrence of the **Greatest Goods We Know**.

  Moore is essentially saying:
  1.  We can't know the perfect universe (Sense 1).
  2.  But we do know that friendship and beauty are incredibly valuable states (high-value organic unities).
  3.  Therefore, the best practical ideal we can aim for (Sense 3) is a world that contains as much friendship and beauty as possible.

  ### Summary of the Resolution
  The tension dissolves when you see that Moore is operating on two different levels of knowledge:

  1.  **Metaphysical Level:** The *Summum Bonum* is unknowable because Organic Unities allow for unconceived combinations of value. (This validates the quote that the best whole might contain none of our known goods).
  2.  **Epistemic/Practical Level:** Within the realm of *human conception*, we can compare organic unities. When we do so, friendship and beauty emerge as the most valuable. (This validates the claim that they are the "greatest goods").

  Moore's confidence in friendship and beauty is not a claim about the ultimate structure of the universe; it is a claim about the **limits of human ethical knowledge.** We must act on the best goods we *know*, even while admitting there may be better goods we *don't know*.
