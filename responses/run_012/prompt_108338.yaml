answer: |-
  ### Tier List: Mechanisms for Cooperation

  **Tier 1: Ironclad (Causal or Inspectable)**
  *   **Same universe, both agents can read each other's policy or source code before either one acts.**
      This is effectively Program Equilibrium; if you can verify the code, defection is computationally impossible, making cooperation a causal certainty.
  *   **An agent trading with an agent it could create later (a sim, a successor AI) rather than one that already exists.**
      This is standard precommitment; the creator causally dictates the successor's incentives, ensuring the deal is honored by design.
  *   **An agent that expects to be duplicated at some point and trades with its future duplicate now.**
      Like the successor case, this relies on a causal chain of creation or copying where the initial parameters enforce the bargain.

  **Tier 2: Logical Lock (Core Acausal Theory)**
  *   **No interaction at all, but each knows the other is running the same decision procedure on the same problem.**
      This is the purest form of Logical Decision Theory; if the logic is identical, the output must match, making cooperation the only rational move.
  *   **An agent trading with a counterfactual version of itself, the one that made the other choice.**
      This is functionally identical to the "same procedure" case, just framed internally as optimizing across logical possibilities rather than external agents.
  *   **Two agents who can't reach each other, but who'd each have signed the same bargain behind a veil of ignorance.**
      This relies on symmetry; if you cannot distinguish yourself from the other, rational self-interest mandates maximizing the joint outcome.

  **Tier 3: Speculative Leap (Metaphysics & Resources)**
  *   **Each agent simulates the other and trades with the simulation, betting that the other is doing the same.**
      This works in theory but is fragile; it requires immense compute and assumes the simulation is faithful enough to trigger the logical correlation.
  *   **Agents in different regions or branches of the multiverse with no causal link whatsoever.**
      This hinges on unproven physics (Everettian branches or modal realism); if the branches don't logically correlate, the trade evaporates.

  **Tier 4: Illusory (Category Errors or Magic)**
  *   **Their values overlap enough that each would do the cooperative thing anyway.**
      This produces cooperation, but it isn't trade; it's just alignment, meaning the "deal" adds no leverage to the outcome.
  *   **An agent that leaves its policy lying around in the world where a stranger might find it.**
      Without a guarantee that the stranger is similar or cares, this is just signaling into the void with no mechanism to enforce reciprocity.
  *   **A third party who can't causally punish anyone, but whom both agents nonetheless expect to punish defection.**
      This is magical thinking; if the third party lacks causal leverage, expecting punishment is a delusion, not a strategy.

  ***

  ### Equivalent Mechanisms
  **#2 (Same procedure), #6 (Counterfactual self), and #8 (Veil of ignorance)** are the same mechanism wearing different hats; they all rely on symmetry and logical correlation to force identical outputs from rational agents. **#7 (Successor) and #11 (Future duplicate)** are also the same mechanism; both rely on a causal chain of creation where the ancestor precommits the descendant. **#1 (Source code)** is the physical instantiation of #2; it turns the logical correlation into a causal inspection.

  ***

  ### The Load-Bearing Claim

  **0.9**

  This number represents how much credibility hangs on the decision-theoretic claim that **"my choice counts as evidence about what a similar agent chooses."**

  **Why this is the load-bearing one:**
  The existence of counterparties and the structure of the game are trivial compared to the decision theory. A Causal Decision Theory (CDT) agent acknowledges the other agent exists and is similar, but still defects because they believe their choice cannot *influence* the other. The entire edifice of acausal trade collapses if you reject the premise that logical correlation is action-guiding. The remaining 0.1 uncertainty accounts for the practical difficulty of establishing sufficient similarity (the "prior over other minds") to make the evidence relevant.

  **What would move the number:**
  *   **Move Up:** A formal proof that general intelligence inevitably converges on Functional Decision Theory (FDT) or a demonstration of acausal cooperation in bounded, real-world AI systems.
  *   **Move Down:** A rigorous proof that logical facts are "screened off" from decision-making (validating CDT), or evidence that advanced agents systematically diverge in reasoning even when given identical inputs.
