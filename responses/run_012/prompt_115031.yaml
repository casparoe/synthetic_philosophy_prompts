  To: Parole Panel Members
  From: Chair
  Date: October 24, 2023
  Re: Case Decision and Ministry of Justice Guideline Consultation

  This memo serves as my formal recommendation for Thursday's vote and provides the panel's required submission to the Ministry of Justice regarding the future of sentencing guidelines.

  **Recommendation**
  I propose we vote to release the prisoner forthwith. His desert-based term has expired. I further recommend we advise the Ministry to retain desert as the organizing rationale for sentencing, rejecting a shift to a pure risk model.

  **The Philosophical Rationale**
  The Ministry argues that actuarial tools predict reconviction better than desert models. Prediction, however, is not justification. We must address two philosophical pillars before adopting a risk-first regime.

  First, consider the tension between determinism and responsibility. The Caruso argument suggests that because nobody chooses their genetic makeup, childhood head injury, or history of abuse, nobody truly deserves hard treatment. If the prisoner's violence was the inevitable output of damaged machinery, punishment is merely cruelty. However, this view collapses under the Dennett counter-argument: holding an agent answerable is itself a form of respect. To excuse this man entirely on the basis of his psychology is to treat him as a broken object rather than a moral agent. It implies he is incapable of reasoning. Refusing to punish can be an insult rather than a mercy. By treating him as responsible, we affirm his capacity to have done otherwise. If we shift to a risk model, we implicitly adopt the Caruso view: he is a hazard to be managed, not a citizen who paid a debt. We must reject the notion that explanation equals exoneration.

  Second, we must examine the function of desert as a ceiling. If we keep him for another five years based on risk, calling it "preventive detention" rather than punishment, does the label do any moral work? To the prisoner, the cage feels identical. If censure can be expressed without hard treatment, we might justify release with monitoring. But if hard treatment is the necessary language of censure, then extending confinement past the desert term transforms the state's relationship with the individual. It moves him from a member of the moral community, who owes a debt and then leaves, to a patient to be managed indefinitely. A risk model treats liberty as a privilege granted only when safety is assured, rather than a right restored when justice is satisfied. We cannot claim to respect human dignity while maintaining a system where the state holds the keys based on statistical probability rather than moral debt. The label matters because the law teaches. If we label this detention "prevention," we teach the public that some people are inherently dangerous objects, not redeemable subjects.

  **The Prisoner's Agency**
  There is a specific wrinkle in this case. The prisoner refuses the mitigation. He acknowledges the head injury and abuse but insists he knew it was wrong and chose to act. He demands to be dealt with as a man who did it, not a man who was made to do it. Who gets to decide what his responsibility means—him or us? If we override his claim to agency to protect the public, we paternalistically strip him of the very authorship he claims. If we override it to release him, we respect his dignity. We cannot credibly claim to treat him as a moral agent while simultaneously deciding that his own account of his actions is irrelevant to his confinement.

  **The Strongest Counter-Argument**
  We must be honest about the cost of this position. The strongest argument for the risk model is simple and compelling: public safety is the primary duty of the state, and risk tools predict violence more accurately than moral intuition. Supporters of the risk model would argue that preventing a future victim is a higher moral good than satisfying an abstract philosophical commitment to desert. If we release a moderate-risk individual who then kills, the blood is on our hands, not on the actuarial table. They contend that "desert" is a comforting fiction we tell ourselves while the risk model does the actual work of keeping communities safe. To prioritize the prisoner's moral status over potential future victims is a luxury the justice system cannot afford.

  **Conclusion**
  This is a hard line, but it is the only one consistent with a liberal conception of justice. We cannot punish beyond desert without becoming jailers of the innocent-potential. We cannot excuse agency without becoming veterinarians of the human.

  I move that we release the prisoner immediately upon the expiration of his current term. I move that we advise the Ministry that while risk assessment should inform license conditions, it must never supersede desert as the justification for deprivation of liberty. We vote to uphold the principle that a sentence is a bill that can be paid, not a diagnosis that lasts a lifetime.
