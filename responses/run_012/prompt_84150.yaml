      *Self-Correction on Non-Citizen Voting:* I can't say "My aunt should vote." I can say "The laws we vote on touch everyone in this room, citizen and neighbor alike." This hints at the "bound by law" principle.

  4.  **Drafting the Speech (Iterative Process):**

      *   *Word Count Check:* Need to ensure it hits 1,000-1,200.
      *   *Tone Check:* Is it too academic? Needs to be warmer. Use "we," "us."
